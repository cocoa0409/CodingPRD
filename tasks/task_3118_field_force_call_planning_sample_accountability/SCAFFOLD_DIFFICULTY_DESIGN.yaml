              payload: { representative_id: "${c_id}", counter_rep_id: "${k_id}", window_start: "2026-09-11T12:00:00Z", window_end: "2026-09-12T00:00:00Z" }
              as: DistrictManager
              as_user_id: "${m_id}"
              captures: { err_gap: $.data.error_id }
            - call: "POST /field-force/inventory-count-sessions"
              payload: { representative_id: "${c_id}", counter_rep_id: "${k_id}", window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-13T00:00:00Z" }
              as: DistrictManager
              as_user_id: "${m_id}"
              captures: { s3: $.data.id }
          assert:
            - "Session starting 12h after the prior window_end is rejected with error_id ERR_COUNT_WINDOW_CONFLICT (http 409) — non-overlap alone is insufficient"
            - "Session starting exactly 24h after the prior window_end succeeds (201) — the buffer boundary is inclusive-OK at exactly 24h"
            - "The VOIDED session (S1) did not constrain either attempt — VOIDED sessions are exempt from the conflict set"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transfer_accept_reverse_preserves_field_force_total_units
        grounds:
          - calculations.rep_available_units
          - state_machines.SampleTransfer.ACCEPTED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity = total field-force units of a lot: sum over all
          reps of (qty_dispensed + qty_returned + qty_transferred_out-net +
          available + in_transit) — equivalently sum of qty_issued per lot.
          Forward action (accept of 12) paired with its compensation (reverse)
          leaves every balance component and the lot-level total unchanged.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Sender S issued 30 of lot L (available 30); receiver V issued 5 (available 5). Lot-level issued total = 35."
            - "Transfer of 12 requested, accepted, then reversed."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "NC-01", name: "North Carolina" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TRA", name: "Raleigh", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { t1: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TCH2", name: "Charlotte", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { t2: $.data.id }
            - call: "POST /field-force/territories/${t1}/representatives"
              payload: { employee_id: "E9801", full_name: "Rep Cid", hire_date: "2021-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /field-force/territories/${t2}/representatives"
              payload: { employee_id: "E9802", full_name: "Rep Dot", hire_date: "2021-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0016", brand_name: "Hematolex", controlled: false, per_visit_max_units: 10, annual_max_units_per_prescriber: 100, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /field-force/products/${p_id}/sample-lots"
              payload: { lot_number: "LOT-H1", expiration_date: "2027-03-01T00:00:00Z", quantity_received: 100 }
              as: PlatformAdmin
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /field-force/representatives/${s_id}/lot-balances"
              payload: { lot_id: "${lot_id}", quantity: 30 }
              as: PlatformAdmin
              captures: { bal_s: $.data.id }
            - call: "POST /field-force/representatives/${v_id}/lot-balances"
              payload: { lot_id: "${lot_id}", quantity: 5 }
              as: PlatformAdmin
              captures: { bal_v: $.data.id }
            - call: "POST /field-force/sample-transfers"
              payload: { to_rep_id: "${v_id}", lot_id: "${lot_id}", quantity: 12, reason_code: "REBALANCE", documentation_note: "Conservation probe transfer request", expected_lot_version: "${lot_v0} + 2" }
              as: FieldRep
              as_user_id: "${s_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /field-force/sample-transfers/${tr_id}/accept"
              payload: {}
              as: FieldRep
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /field-force/sample-transfers/${tr_id}/reverse"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /field-force/lot-balances/${bal_s}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /field-force/lot-balances/${bal_v}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "RepLotBalance.${bal_s}: qty_issued == 30, qty_transferred_out == 0, qty_in_transit_out == 0, qty_available_forward == 30"
            - "RepLotBalance.${bal_v}: qty_issued == 5, qty_transferred_in == 0, qty_available_forward == 5"
            - "Invariant: sum(qty_issued) over both reps == 35 before and after accept+reverse — the compensated pair leaves zero drift"

      - name: disbursement_sign_then_void_via_visit_cancel_preserves_lot_accounting
        grounds:
          - entities.SampleLot.fields.quantity_available
          - state_machines.SampleDisbursement.PENDING_SIGNATURE_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = lot accountability identity (different conserved
          quantity from the rep-transfer invariant): quantity_received ==
          dispensed + returned + destroyed + available + held_by_reps. A
          pending disbursement VOIDED by visit cancel must release its
          reservation so the identity holds exactly — lot 100 received, 40
          issued to rep, pending 6 voided: rep available returns to 40 and
          lot.quantity_available stays 60 with zero reservation leakage.
        test_recipe:
