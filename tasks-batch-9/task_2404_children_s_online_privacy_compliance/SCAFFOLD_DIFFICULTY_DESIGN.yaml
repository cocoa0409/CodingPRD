            - call: "POST /third-party-integrations/${intg_id}/status"
              payload: { to_status: "APPROVED", audit_note: "analytics SDK approved, persistent id in scope" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_a}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "KBA-OK-A" }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv3: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.b@x.test", child_pseudonym: "child-b1", intended_uses: ["PARTICIPATION_CORE", "CONTESTS_PRIZES"], consent_method: "KNOWLEDGE_BASED_AUTH", expected_service_version: "${sv3}" }
              as: ComplianceOfficer
              captures: { consent_b: $.data.id, tier_b: $.data.required_tier_at_creation }
            - call: "POST /consent-requests/${consent_b}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_b}/status"
              payload: { to_status: "PENDING_VERIFICATION" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_b}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "KBA-OK-B" }
              as: ComplianceOfficer
              captures: { err_tier: $.data.error_id }
          assert:
            - "ConsentRequest.${consent_a}.required_tier_at_creation == 2 (max(USE_TIER PARTICIPATION_CORE 1, CONTESTS_PRIZES 2) + bump 0)"
            - "ConsentRequest.${consent_a}.method_assurance_tier == 2"
            - "ConsentRequest.${consent_a}.status == GRANTED (the pinned tier 2 is still satisfied after MetricPulse is approved)"
            - "ConsentRequest.${consent_b}.required_tier_at_creation == 3 (base 2 + bump 1 from the APPROVED persistent-identifier ANALYTICS integration)"
            - "ConsentRequest.${consent_b}.method_assurance_tier == 2"
            - "${err_tier} == ERR_CONSENT_METHOD_TIER_INSUFFICIENT with HTTP 422"
            - "ConsentRequest.${consent_b}.status == PENDING_VERIFICATION (the refused grant left the row untouched)"
            - "ConsentRequest.${consent_a}.required_tier_at_creation != ConsentRequest.${consent_b}.required_tier_at_creation despite identical intended_uses and identical consent_method"
            - "ThirdPartyIntegration.${intg_id}.status == APPROVED and ThirdPartyIntegration.${intg_id}.exposure_points == 30 (ANALYTICS 15 x 2 for the persistent identifier)"
            - "OnlineService.${svc_id}.third_party_exposure_points == 30"
            - "OnlineService.${svc_id}.compliance_posture == OPEN (30 < POSTURE_RESTRICT_POINTS 40)"
            - "OnlineService.${svc_id}.active_consent_count == 1"
            - "OnlineService.${svc_id}.granted_disclosure_consent_count == 0 (CONTESTS_PRIZES is not a disclosure use)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_parallel_axes_move_independently
        grounds:
          - state_machines.OnlineService.compliance_posture=ANY_to_compliance_posture=value_of_calculations.compliance_posture
          - state_machines.OnlineService.determination_status_IN_{GENERAL_AUDIENCE,MIXED_AUDIENCE,CHILD_DIRECTED_PRIMARY}_to_determination_status_IN_{GENERAL_AUDIENCE,MIXED_AUDIENCE}
          - calculations.compliance_posture
          - calculations.design_factor_weighted_score
          - entities.OnlineService.fields.posture_override
          - entities.DeterminationEvidence.fields.evidence_sequence
        distinguishing_aspect: |
          OnlineService is a PARALLEL machine: a posture_override write moves compliance_posture
          OPEN -> RESTRICTED while determination_status stays MIXED_AUDIENCE, and a subsequent
          re-determination moves determination_status MIXED_AUDIENCE -> GENERAL_AUDIENCE (a
          BACKWARD move on that axis, which no linear machine allows) while compliance_posture
          stays RESTRICTED because clause 1 of calculations.compliance_posture still wins; clearing
          the override then returns posture to OPEN with the determination axis untouched.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Service registered and determined MIXED_AUDIENCE from a single SUBJECT_MATTER/MODERATE row (design_score 0.60, DESIGN_FIRST)."
            - "No integrations, no assessments: the computed posture is OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Storytime Shelf", operator_organization: "Shelf Books Inc", service_category: "EDUCATION_APP", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /online-services/${svc_id}/posture"
              payload: { posture_override: "RESTRICTED" }
              as: ComplianceOfficer
              captures: { posture_after_override: $.data.compliance_posture, det_after_override: $.data.determination_status }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "INCIDENTAL", evidence_note: "re-review downgraded the subject matter" }
              as: ComplianceOfficer
              captures: { seq_2: $.data.evidence_sequence }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { score_before_redetermination: $.data.design_score, det_before_redetermination: $.data.determination_status }
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/posture"
              payload: { posture_override: null }
              as: ComplianceOfficer
          assert:
            - "${posture_after_override} == RESTRICTED and ${det_after_override} == MIXED_AUDIENCE (posture axis moved, determination axis did not)"
            - "${seq_2} == 2 (per-service monotonic evidence_sequence; the SUBJECT_MATTER row with the greatest sequence is the only one that counts)"
            - "${score_before_redetermination} == 0.25 (POST /determination-evidence recomputes design_score)"
            - "${det_before_redetermination} == MIXED_AUDIENCE (POST /determination-evidence NEVER writes determination_status)"
            - "After the re-determination: OnlineService.${svc_id}.determination_status == GENERAL_AUDIENCE (0.25 < DESIGN_MIXED_THRESHOLD 0.45) — a backward move on the determination axis"
            - "After the re-determination: OnlineService.${svc_id}.compliance_posture == RESTRICTED (posture_override clause 1 still wins)"
            - "After clearing the override: OnlineService.${svc_id}.posture_override == null"
            - "After clearing the override: OnlineService.${svc_id}.compliance_posture == OPEN"
            - "After clearing the override: OnlineService.${svc_id}.determination_status == GENERAL_AUDIENCE (unchanged by the posture write)"
            - "OnlineService.${svc_id}.design_score == 0.25 and OnlineService.${svc_id}.determination_variant_applied == DESIGN_FIRST"

      - name: assessment_remediation_cycle_bounded_then_certified
        grounds:
          - state_machines.SafeHarborAssessment.SUBMITTED_to_REMEDIATION_REQUIRED
          - state_machines.SafeHarborAssessment.REMEDIATION_REQUIRED_to_SUBMITTED
          - state_machines.SafeHarborAssessment.SUBMITTED_to_CERTIFIED
          - validations[priority=114]
          - validations[priority=118]
          - entities.SafeHarborAssessment.fields.remediation_round
          - calculations.safe_harbor_status
        distinguishing_aspect: |
          SafeHarborAssessment is CYCLIC on SUBMITTED <-> REMEDIATION_REQUIRED with the loop bound
          MAX_REMEDIATION_ROUNDS = 2: rounds 1 and 2 are accepted, the THIRD
          REMEDIATION_REQUIRED attempt is refused with ERR_REMEDIATION_ROUNDS_EXHAUSTED (409) while
          the row stays SUBMITTED, and the exhausted loop does NOT force FAILED — the same row
          still certifies from SUBMITTED once findings_open_count reaches 0, so the terminal state
          reached depends on the path taken out of the loop, not on the loop counter.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Service registered (no determination needed for the safe-harbor axis)."
            - "Program 'KidTrust Seal': regulator_approved true, annual_assessment_required true, assessment_validity_days 365, assessment_grace_days 30."
            - "Assessment for year 2026 opened in DRAFT by SafeHarborAssessor with X-User-ID assessor-1 (preparer_user_id = assessor-1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Rocket Readers", operator_organization: "Rocket Learning LLC", service_category: "EDUCATION_APP", subject_matter_code: "CHILD_EDUCATION" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /safe-harbor-programs"
              payload: { program_name: "KidTrust Seal", regulator_approved: true, annual_assessment_required: true, assessment_validity_days: 365, assessment_grace_days: 30 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_id}", program_id: "${prog_id}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
              captures: { asmt_id: $.data.id, preparer: $.data.preparer_user_id }
          trigger:
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 2 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "REMEDIATION_REQUIRED", remediation_note: "round 1: notice missing retention language" }
              as: SafeHarborCertifier
              as_user_id: "certifier-1"
              captures: { round_1: $.data.remediation_round }
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 1 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "REMEDIATION_REQUIRED", remediation_note: "round 2: age screen still prefilled" }
              as: SafeHarborCertifier
              as_user_id: "certifier-1"
              captures: { round_2: $.data.remediation_round }
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 0 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "REMEDIATION_REQUIRED", remediation_note: "round 3 attempt" }
              as: SafeHarborCertifier
              as_user_id: "certifier-1"
              captures: { err_rounds: $.data.error_id }
            - call: "POST /safe-harbor-assessments/${asmt_id}/certify"
              payload: {}
              as: SafeHarborCertifier
              as_user_id: "certifier-1"
              captures: { certified_status: $.data.status, expiry: $.data.expires_at }
          assert:
            - "${preparer} == assessor-1"
            - "${round_1} == 1 and ${round_2} == 2"
            - "${err_rounds} == ERR_REMEDIATION_ROUNDS_EXHAUSTED with HTTP 409"
            - "SafeHarborAssessment.${asmt_id}.remediation_round == 2 (the refused third attempt did not increment)"
            - "${certified_status} == CERTIFIED"
            - "SafeHarborAssessment.${asmt_id}.certifier_user_id == certifier-1"
            - "SafeHarborAssessment.${asmt_id}.certified_at == 2026-08-01T00:00:00Z"
            - "${expiry} == 2027-08-01T00:00:00Z (certified_at + assessment_validity_days 365)"
            - "SafeHarborAssessment.${asmt_id}.findings_open_count == 0"
            - "OnlineService.${svc_id}.safe_harbor_status == CERTIFIED"
            - "OnlineService.${svc_id}.safe_harbor_expires_at == 2027-08-01T00:00:00Z"
            - "OnlineService.${svc_id}.compliance_posture == OPEN"

      - name: age_screen_rejection_revision_cycle_exhausts_and_locks
        grounds:
          - state_machines.AgeScreen.DRAFT_to_IN_REVIEW
          - state_machines.AgeScreen.IN_REVIEW_to_REJECTED
          - state_machines.AgeScreen.REJECTED_to_DRAFT
          - validations[priority=72]
          - validations[priority=114]
          - entities.AgeScreen.fields.revision_round
        distinguishing_aspect: |
          AgeScreen is CYCLIC on DRAFT -> IN_REVIEW -> REJECTED -> DRAFT with two independent
          non-linear guards on the SAME transition: the actor guard (only PrivacyEngineer may take
          REJECTED -> DRAFT, so a ComplianceOfficer attempt yields ERR_TRANSITION_ROLE_NOT_PERMITTED
          403 even though ComplianceOfficer is a declared role on the endpoint) and the loop bound
          MAX_SCREEN_REVISION_ROUNDS = 2 (the third REJECTED -> DRAFT yields
          ERR_SCREEN_REVISIONS_EXHAUSTED 409), after which the row is stuck in REJECTED and cannot
          be short-circuited to ACTIVE.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service registered."
            - "Age screen created by PrivacyEngineer: mechanism ACCOUNT_AGE_INHERIT with inherited_from_verified_account true, retry_allowed_on_fail false, outcome_session_persisted true — neutrality_violation_codes == []."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Mixed Mall Kids Corner", operator_organization: "Mall Media Group", service_category: "GENERAL_INTEREST_PORTAL", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "ACCOUNT_AGE_INHERIT", retry_allowed_on_fail: false, outcome_session_persisted: true, inherited_from_verified_account: true }
              as: PrivacyEngineer
              captures: { screen_id: $.data.id, codes_at_create: $.data.neutrality_violation_codes }
          trigger:
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "REJECTED", review_note: "inherit source account audit trail incomplete" }
              as: ComplianceOfficer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "DRAFT" }
              as: ComplianceOfficer
              captures: { err_actor: $.data.error_id }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "DRAFT" }
              as: PrivacyEngineer
              captures: { rev_1: $.data.revision_round }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "REJECTED", review_note: "still incomplete" }
              as: ComplianceOfficer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "DRAFT" }
              as: PrivacyEngineer
              captures: { rev_2: $.data.revision_round }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "REJECTED", review_note: "third rejection" }
              as: ComplianceOfficer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "DRAFT" }
              as: PrivacyEngineer
              captures: { err_rounds: $.data.error_id }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { err_state: $.data.error_id }
          assert:
            - "${codes_at_create} == [] (a verified-account inherit is neutral)"
            - "${err_actor} == ERR_TRANSITION_ROLE_NOT_PERMITTED with HTTP 403 (ComplianceOfficer is allowed on the endpoint but not on REJECTED -> DRAFT)"
            - "${rev_1} == 1 and ${rev_2} == 2"
            - "${err_rounds} == ERR_SCREEN_REVISIONS_EXHAUSTED with HTTP 409"
            - "AgeScreen.${screen_id}.revision_round == 2 (the refused third revision did not increment)"
            - "${err_state} == ERR_INVALID_STATE with HTTP 409 (REJECTED -> ACTIVE is not a declared transition)"
            - "AgeScreen.${screen_id}.status == REJECTED"
            - "AgeScreen.${screen_id}.activated_at == null"
            - "GET /online-services/${svc_id}/age-screens?status=ACTIVE returns total_count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deletion_fulfilment_six_link_cascade_unfreezes_to_restricted
        grounds:
          - state_machines.ParentalRightsRequest.VERIFIED_to_FULFILLED
          - state_machines.ChildDataRecord.COLLECTED|SCHEDULED_FOR_DISPOSAL_to_DISPOSED
          - state_machines.ConsentRequest.GRANTED_to_REVOKED
          - state_machines.ThirdPartyIntegration.DECLARED|APPROVED_to_AUDIT_PENDING
          - calculations.rights_request_scope_resolution
          - calculations.third_party_exposure_points
          - calculations.compliance_posture
          - entities.OnlineService.fields.granted_disclosure_consent_count
        distinguishing_aspect: |
          A single VERIFIED -> FULFILLED call on a DELETE right propagates through six distinct
          links in one request — rights request FULFILLED (1) -> both ChildDataRecords DISPOSED (2)
          -> live_child_data_element_count 2 -> 0 (3) -> the ConsentRequest auto-REVOKED with
          revocation_reason DELETION_FULFILLED (4) -> granted_disclosure_consent_count 1 -> 0 which
          demotes the APPROVED persistent-identifier behavioural ad network to AUDIT_PENDING (5) ->
          third_party_exposure_points 80 -> 0 and open_audit_count 0 -> 1, so compliance_posture
          moves FROZEN -> RESTRICTED (6). The posture lands on RESTRICTED via clause 3
          (open_audit_count) and NOT on OPEN, which is only reachable if link 5 is skipped.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (design_score 0.60) with an ACTIVE neutral age screen."
            - "Activity CLUBHOUSE whitelists SCREEN_NAME and EMAIL; retention schedules cover (SCREEN_NAME, PARTICIPATION_CORE) and (EMAIL, PARTICIPATION_CORE)."
            - "Notice published with all 7 content keys and disclosed_integration_vendors ['AdKid Network']."
            - "Consent GRANTED for parent guardian.c@x.test / child-101 with intended_uses [PARTICIPATION_CORE, THIRD_PARTY_DISCLOSURE] via GOVT_ID_MATCH, so granted_disclosure_consent_count == 1."
            - "Two records collected under that consent while the posture is still OPEN (live 2, lifetime 2)."
            - "Integration 'AdKid Network' (BEHAVIORAL_AD_NETWORK, persistent identifier, CHILD_DIRECTED_AREA) approved AFTER collection, taking exposure to 80 and the posture to FROZEN."
            - "A DELETE parental rights request for that consent verified with GOVT_ID_MATCH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Comet Club", operator_organization: "Comet Kids Media", service_category: "SOCIAL_NETWORK", subject_matter_code: "FAMILY_MIXED" }
