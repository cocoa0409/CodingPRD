            - "GroupClient.${gc_id}.credit_balance_cents == 19659"

      - name: element_restricted_then_serviceable_loop_returns_to_original_state
        claim_type: cyclic
        grounds:
          - state_machines.Element.SERVICEABLE_to_RESTRICTED
          - state_machines.Element.RESTRICTED_to_SERVICEABLE
        excluded_because:
          difficulty_instance: compensating_invariant / restriction_counters_restored_by_return_to_service
          rationale: "That instance drives the full RESTRICTED -> SERVICEABLE loop and asserts every derived counter back to its pre-restriction value."

      - name: booking_status_and_roster_status_are_independent_dimensions
        claim_type: parallel
        grounds:
          - state_machines.Booking
          - calculations.booking_roster_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_status_and_roster_dimensions_advance_independently
          rationale: "That instance observes both dimensions after each write and asserts one moving while the other holds."

      - name: element_restriction_cascades_down_to_blocks_and_bookings
        claim_type: cascade_down
        grounds:
          - state_machines.ProgramBlock.SCHEDULED_to_BLOCKED_UNSAFE
          - state_machines.Booking.CONFIRMED_to_AT_RISK
        excluded_because:
          difficulty_instance: transitive_cascade / defect_major_log_cascades_four_links_to_course_posture
          rationale: "Asserted as the depth-4 forward chain of that instance, including the untouched-sibling and counter assertions."

      - name: element_out_of_service_quarantines_rigged_belay_equipment
        claim_type: cross_entity
        grounds:
          - state_machines.BelayEquipment.IN_SERVICE_to_QUARANTINED
          - state_machines.Element.SERVICEABLE_to_OUT_OF_SERVICE
        excluded_because:
          difficulty_instance: transitive_cascade / inspection_fail_cascades_element_then_equipment_then_belay_readiness
          rationale: "That instance asserts both equipment rows QUARANTINED and the recomputed belay_ready / quarantined_equipment_count."

      - name: return_to_service_compensates_every_restriction_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Element.RESTRICTED_to_SERVICEABLE
          - state_machines.Booking.AT_RISK_to_CONFIRMED
        excluded_because:
          difficulty_instance: compensating_invariant / restriction_counters_restored_by_return_to_service
          rationale: "Asserted as the compensating half of that invariant, with all three course counters back at 0."

  # ===========================================================================
  - section: calculations
    instances:
      - name: element_retirement_forecast_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.element_retirement_forecast.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / element_retirement_forecast_switches_to_usage_basis
          rationale: "That instance builds two elements from identical calendar data and asserts both the CALENDAR and USAGE answers plus the nine-year delta."

      - name: cancellation_settlement_variant_selection_by_context
        claim_type: variant_selection
        grounds:
          - calculations.booking_cancellation_settlement.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / cancellation_settlement_weather_variant_diverges_from_client_variant
          rationale: "That instance cancels two identically-priced bookings on the same date, one under a weather closure and one not, and asserts which variant each selected."

      - name: cancellation_settlement_reconciles_client_ledger_on_variant_switch
        claim_type: reconciliation
        grounds:
          - calculations.booking_cancellation_settlement
          - entities.GroupClient.fields.credit_balance_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / cancellation_settlement_weather_variant_diverges_from_client_variant
          rationale: "That instance asserts the per-variant refund and the resulting credit_balance_cents for both bookings, which is the ledger reconciliation."

      - name: quote_subtotal_correct_for_a_full_five_block_program
        claim_type: correct_result
        grounds:
          - calculations.booking_quote_subtotal
        excluded_because:
          difficulty_instance: combinatorial_formula / quote_subtotal_rounds_each_program_block_line_before_summing
          rationale: "That instance pre-computes the full five-block PARTNER subtotal (35706) and contrasts it with the naive whole-order rounding (35705)."

      - name: quote_rounding_order_is_per_line_then_sum
        claim_type: precision
        grounds:
          - calculations.booking_quote_subtotal.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / quote_subtotal_rounds_each_program_block_line_before_summing
          rationale: "The per-line-then-sum rounding order is exactly the distinction that instance is built to falsify."

      - name: high_element_surcharge_band_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.booking_high_element_surcharge
        excluded_because:
          difficulty_instance: combinatorial_formula / high_element_surcharge_band_resolved_once_from_pre_surcharge_subtotal
          rationale: "That instance pins the band selection to the pre-surcharge subtotal and asserts the 5% band literal (861 cents) rather than a recursive re-band."

      - name: at_risk_booking_count_is_forward_looking_over_confirmed_bookings
        claim_type: forward_looking
        grounds:
          - entities.Course.fields.at_risk_booking_count
        excluded_because:
          difficulty_instance: transitive_cascade / defect_major_log_cascades_four_links_to_course_posture
          rationale: "That instance asserts at_risk_booking_count moving from 0 to 1 as the forward-looking third link of the cascade."

      - name: roster_of_chaperones_only_stays_incomplete
        claim_type: input_set_filtering
        grounds:
          - calculations.booking_roster_status
        distinguishing_aspect: "A roster whose only member is a fully screened ELIGIBLE chaperone is INCOMPLETE, not READY: the non-chaperone count is the filtered input set, so chaperones are counted for coverage but never as billable heads."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; a PARTNER client; a DRAFT booking for 2026-09-15 whose only participant is an adult chaperone with a complete packet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER" }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_id}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 1 }
              as: ProgramDirector
              captures: { b_id: $.data.id, b_v0: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v0}", full_name: "Robin Vale", birth_date: "1988-11-30", weight_kg: 71.0, is_chaperone: true }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
              captures: { p_chap_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/participants/${p_chap_id}/screening-packet"
              payload: { agreement_signed: true, guardian_signature_provided: false, health_flags: ["NONE"] }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
              captures: { chap_screening: $.data.screening_status }
          assert:
            - "http_status == 200"
            - "${chap_screening} == ELIGIBLE"
            - "Booking.${b_id}.roster_status == INCOMPLETE"
            - "Booking.${b_id}.required_chaperone_count == 0"

      - name: equipment_service_life_constant_beats_shelf_life_for_a_rope
        claim_type: constants_applied
        grounds:
          - calculations.equipment_retirement_forecast.constants
        distinguishing_aspect: "A ROPE manufactured 2022-06-01 and first used 2024-08-10 forecasts 2029-08-10 on basis SERVICE (5-year service life beats the 10-year shelf life), while a CARABINER manufactured the same day with no first_use_on forecasts 2037-06-01 on basis MANUFACTURE — the per-kind constants are indexed, not shared."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; two pieces of belay stock created with different kinds and different first-use history."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/belay-equipment"
              payload: { course_id: "${course_id}", equipment_kind: "ROPE", serial_number: "RP-001", manufactured_on: "2022-06-01", max_cycles: 40000, first_use_on: "2024-08-10" }
              as: ProgramDirector
              captures: { rope_id: $.data.id, rope_basis: $.data.retirement_basis }
            - call: "POST /challenge-course/belay-equipment"
              payload: { course_id: "${course_id}", equipment_kind: "CARABINER", serial_number: "CB-001", manufactured_on: "2022-06-01", max_cycles: 60000 }
              as: ProgramDirector
              captures: { crab_id: $.data.id, crab_basis: $.data.retirement_basis }
          assert:
            - "${rope_basis} == SERVICE"
            - "${crab_basis} == MANUFACTURE"
            - "BelayEquipment.${rope_id}.mfg_life_forecast_date == 2032-06-01"
            - "BelayEquipment.${rope_id}.service_life_forecast_date == 2029-08-10"
            - "BelayEquipment.${rope_id}.retirement_forecast_date == 2029-08-10"
            - "BelayEquipment.${rope_id}.usage_cycles == 0"
            - "BelayEquipment.${rope_id}.status == IN_SERVICE"
            - "BelayEquipment.${crab_id}.mfg_life_forecast_date == 2037-06-01"
            - "BelayEquipment.${crab_id}.service_life_forecast_date == null"
            - "BelayEquipment.${crab_id}.retirement_forecast_date == 2037-06-01"

      - name: rescue_drill_exactly_one_hundred_eighty_days_old_still_scores_active
