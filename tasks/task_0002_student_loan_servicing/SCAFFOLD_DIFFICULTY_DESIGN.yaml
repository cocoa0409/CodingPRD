  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payment_creation_requires_loan_not_paidoff_or_discharged
        grounds:
          - validations[priority=22]
          - entities.Borrower.fields.borrower_status
          - state_machines.Loan.transitions.REPAYMENT_to_DISCHARGED
        distinguishing_aspect: |
          Entity pair: Payment ←→ Loan. Creating a Payment on Loan A is rejected
          if its parent Borrower has every Loan in {DISCHARGED, PAID_OFF}
          (priority 22 cross-entity check). The Payment's validity depends on
          aggregate states of OTHER Loans owned by the same Borrower.
        test_recipe:
          setup:
            - "Veteran Borrower with two Loans, both DISCHARGED via approved VETERAN_TOTAL_PERMANENT_DISABILITY application."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
