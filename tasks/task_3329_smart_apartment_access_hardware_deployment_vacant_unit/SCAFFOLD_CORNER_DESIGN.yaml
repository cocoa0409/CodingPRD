              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cell Shop", address_line: "1 Amp Ave", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_cs: $.data.id }
            - call: "POST /properties/${prop_cs}/buildings"
              payload: { name: "CS-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_cs: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", building_id: "${bld_cs}", firmware_version: "LATEST", battery_pct: 20 }
              as: HardwareTechnician
              captures: { dev_cs: $.data.id }
            - call: "POST /buildings/${bld_cs}/device-scans"
              payload: { reachable_device_ids: ["${dev_cs}"] }
