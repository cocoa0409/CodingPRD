          BUFFERED-ADJACENCY semantics on the Route resource, a different geometry from the
          barn containment rule: the successor stop's start must be at least its predecessor's
          end PLUS its own travel_minutes. With stop 1 ending at 566 and a zone A buffer of 15,
          a start of 575 lands inside the buffer and is refused, while 581 would be accepted.
        test_recipe:
          setup:
            - "A route whose first zone A stop starts at 480 and, after an 86-minute appointment is attached, ends at 566."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barns"
