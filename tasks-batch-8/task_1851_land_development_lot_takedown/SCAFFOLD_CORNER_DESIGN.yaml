# =============================================================================
# Task 1851: Land Development & Lot Takedown — §1.9 Scaffold Corner Design
# Breadth coverage of §1.1-§1.7 claims not owned by §1.8
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: parcel_create_defaults_applied
        claim_type: defaults
        grounds: [entities.Parcel.fields.absorption_method, entities.Parcel.fields.planned_sellout_months, entities.Parcel.fields.status]
        distinguishing_aspect: "Omitting optional fields applies defaults: absorption_method STRAIGHT_LINE, planned_sellout_months 24, status DRAFT, derived counters 0, earnest_money_refunded false, version 1."
        test_recipe:
          setup: ["empty DB; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/parcels"
              payload: { parcel_name: "DP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { dp_status: $.data.status, dp_method: $.data.absorption_method, dp_months: $.data.planned_sellout_months, dp_total: $.data.total_lots_planned, dp_refund: $.data.earnest_money_refunded, dp_v: $.data.version }
          assert:
            - "captured dp_status == DRAFT (initial state)"
            - "captured dp_method == STRAIGHT_LINE and dp_months == 24 (defaults)"
            - "captured dp_total == 0 and dp_refund == false"
            - "captured dp_v == 1 (version starts at 1)"

      - name: parcel_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Parcel.fields.parcel_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/parcels without parcel_name is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/parcels"
              payload: { county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: parcel_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PARCEL_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_PARCEL_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/parcels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_PARCEL_NOT_FOUND (404)"

      - name: lot_type_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Phase.fields.lot_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "submit-plat with lot_type 'MANSION' (outside STANDARD|PREMIUM|ESTATE) is rejected 400."
        test_recipe:
          setup: ["Parcel P exists; Phase PH exists"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "EP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { ep: $.data.id }
            - call: "POST /api/phases"
              payload: { parcel_id: "${ep}", phase_name: "PH", sequence_number: 1, planned_lot_count: 5, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { eph: $.data.id }
          trigger:
            - call: "POST /api/phases/${eph}/submit-plat"
              payload: { plat_lot_count: 5, lot_type: "MANSION" }
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Parcel.fields.lots_closed_count]
        distinguishing_aspect: "Client-supplied computed field lots_closed_count in the create body is ignored; the stored value stays the computed 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/parcels"
              payload: { parcel_name: "CP", county: "Travis", earnest_money_cents: 100000, lots_closed_count: 99 }
              as: DeveloperOperator
              captures: { cp_closed: $.data.lots_closed_count }
          assert:
            - "captured cp_closed == 0 (input value 99 ignored)"

      - name: builder_list_pagination
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List pagination fields total_count and has_more respond to limit/offset: 3 builders, limit=2 -> 2 rows + has_more true; offset=2 -> 1 row + has_more false."
        test_recipe:
          setup: ["Builders B1, B2, B3 exist"]
          setup_api_calls:
            - call: "POST /api/builders"
              payload: { builder_name: "PB1", license_number: "LIC-P1", contact_email: "p1@x.com" }
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "PB2", license_number: "LIC-P2", contact_email: "p2@x.com" }
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "PB3", license_number: "LIC-P3", contact_email: "p3@x.com" }
              as: DeveloperOperator
          trigger:
            - call: "GET /api/builders?limit=2&offset=0"
              as: DeveloperOperator
            - call: "GET /api/builders?limit=2&offset=2"
              as: DeveloperOperator
          assert:
            - "first page: 2 data rows, total_count == 3, has_more == true"
            - "second page: 1 data row, total_count == 3, has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: parcel_terminate_from_acquired_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Parcel, "errors[ERR_PARCEL_INVALID_STATE]"]
        distinguishing_aspect: "From ACQUIRED there is no terminate path: terminate-contingency is rejected ERR_PARCEL_INVALID_STATE and the parcel stays ACQUIRED."
        test_recipe:
          setup: ["Parcel P in ACQUIRED"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "SP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { sp: $.data.id }
            - call: "POST /api/parcels/${sp}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${sp}/clear-contingency"
              payload: {}
              as: DeveloperOperator
          trigger:
            - call: "POST /api/parcels/${sp}/terminate-contingency"
              payload: {}
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_PARCEL_INVALID_STATE"
            - "GET /api/parcels/${sp} still shows status ACQUIRED and earnest_money_refunded == false"

      - name: agreement_amend_from_terminated_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TakedownAgreement, "errors[ERR_AGREEMENT_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED is terminal: amend on a terminated agreement is rejected ERR_AGREEMENT_INVALID_STATE even with the correct version."
        test_recipe:
          setup: ["Parcel P ACQUIRED; agreement AG TERMINATED after activation"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "TP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { tp: $.data.id }
            - call: "POST /api/parcels/${tp}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${tp}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "TB", license_number: "LIC-T1", contact_email: "t1@x.com" }
              as: DeveloperOperator
              captures: { tb: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${tp}", builder_id: "${tb}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 2 }
              as: DeveloperOperator
              captures: { tag: $.data.id }
            - call: "POST /api/takedown-agreements/${tag}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/takedown-agreements/${tag}/terminate"
              payload: {}
              as: DeveloperOperator
              captures: { tag_v: $.data.version }
          trigger:
            - call: "POST /api/takedown-agreements/${tag}/amend"
              payload: { expected_agreement_version: "${tag_v}", price_cap_bp: 13000 }
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_AGREEMENT_INVALID_STATE (terminal lockdown beats a correct OCC version)"

      - name: closing_finalize_twice_second_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.LotClosing, "errors[ERR_CLOSING_INVALID_STATE]"]
        distinguishing_aspect: "Second finalize on a CLOSED closing is rejected ERR_CLOSING_INVALID_STATE; side effects (loan balance, lot states) are not applied twice."
        test_recipe:
          setup:
            - "Parcel P ACQUIRED; phase ACTIVE with 1 lot; agreement ACTIVE (scheduled 2); loan ACTIVE; closing CL already CLOSED"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "IP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { ip: $.data.id }
            - call: "POST /api/parcels/${ip}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${ip}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${ip}", phase_name: "PH", sequence_number: 1, planned_lot_count: 1, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { iph: $.data.id }
            - call: "POST /api/phases/${iph}/submit-plat"
              payload: { plat_lot_count: 1, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${iph}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${iph}/record-plat"
              payload: {}
              as: MunicipalClerk
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${iph}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { ibd: $.data.id }
            - call: "POST /api/infrastructure-bonds/${ibd}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${ibd}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
            - call: "POST /api/phases/${iph}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "IB", license_number: "LIC-I1", contact_email: "i1@x.com" }
              as: DeveloperOperator
              captures: { ib: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${ip}", builder_id: "${ib}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 2 }
              as: DeveloperOperator
              captures: { iag: $.data.id }
            - call: "POST /api/takedown-agreements/${iag}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/development-loans"
              payload: { parcel_id: "${ip}", commitment_amount_cents: 50000000, release_price_floor_bp: 8000 }
              as: DeveloperOperator
              captures: { iln: $.data.id }
            - call: "POST /api/development-loans/${iln}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "GET /api/lots?phase_id=${iph}"
              as: DeveloperOperator
              captures: { ilot: $.data.0.id }
            - call: "POST /api/lots/${ilot}/reserve"
              payload: { agreement_id: "${iag}" }
              as: BuilderRep
              as_user_id: "${ib}"
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${ilot}", agreement_id: "${iag}" }
              as: BuilderRep
              as_user_id: "${ib}"
              captures: { icl: $.data.id }
            - call: "POST /api/lot-closings/${icl}/finalize"
              payload: {}
              as: LenderOfficer
          trigger:
            - call: "POST /api/lot-closings/${icl}/finalize"
              payload: {}
              as: LenderOfficer
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_CLOSING_INVALID_STATE (second finalize rejected)"

      - name: plat_resubmit_increments_revision
        claim_type: valid_transition
        grounds: [state_machines.Phase]
        distinguishing_aspect: "Plat review cycle: submit -> rev 1; REJECT -> PLAT_REJECTED with reason; resubmit -> rev 2 and reason cleared; APPROVE -> PLAT_APPROVED."
        test_recipe:
          setup: ["Parcel P exists; Phase PH in PLANNED"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "RP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { rp: $.data.id }
            - call: "POST /api/phases"
              payload: { parcel_id: "${rp}", phase_name: "PH", sequence_number: 1, planned_lot_count: 5, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { rph: $.data.id }
          trigger:
            - call: "POST /api/phases/${rph}/submit-plat"
              payload: { plat_lot_count: 5, lot_type: "STANDARD" }
              as: DeveloperOperator
              captures: { rev1: $.data.plat_revision }
            - call: "POST /api/phases/${rph}/review-plat"
              payload: { decision: "REJECT", rejection_reason: "lot lines misaligned" }
              as: MunicipalClerk
              captures: { st_rej: $.data.status, rr: $.data.plat_rejection_reason }
            - call: "POST /api/phases/${rph}/submit-plat"
              payload: { plat_lot_count: 6, lot_type: "PREMIUM" }
              as: DeveloperOperator
              captures: { rev2: $.data.plat_revision, rr2: $.data.plat_rejection_reason }
            - call: "POST /api/phases/${rph}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
              captures: { st_appr: $.data.status }
          assert:
            - "captured rev1 == 1"
            - "captured st_rej == PLAT_REJECTED and rr == 'lot lines misaligned'"
            - "captured rev2 == 2 and rr2 == null (reason cleared on resubmission)"
            - "captured st_appr == PLAT_APPROVED"

      - name: phase_activate_guard_parcel_not_acquired
        claim_type: precondition_enforcement
        grounds: [state_machines.Phase.PLAT_RECORDED_to_ACTIVE, "errors[ERR_PARCEL_NOT_ACQUIRED]"]
        distinguishing_aspect: "Guarded transition: even with the bond POSTED, phase activate is rejected while the parcel is still CONTINGENCY_ACTIVE."
        test_recipe:
          setup: ["Parcel P in CONTINGENCY_ACTIVE; phase PH PLAT_RECORDED with bond POSTED"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "GP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { gp: $.data.id }
            - call: "POST /api/parcels/${gp}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${gp}", phase_name: "PH", sequence_number: 1, planned_lot_count: 2, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { gph: $.data.id }
            - call: "POST /api/phases/${gph}/submit-plat"
              payload: { plat_lot_count: 2, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${gph}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${gph}/record-plat"
              payload: {}
              as: MunicipalClerk
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${gph}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { gbd: $.data.id }
            - call: "POST /api/infrastructure-bonds/${gbd}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${gbd}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
          trigger:
            - call: "POST /api/phases/${gph}/activate"
              payload: {}
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_PARCEL_NOT_ACQUIRED (409)"

      - name: agreement_create_initial_state
        claim_type: initial_state
        grounds: [state_machines.TakedownAgreement]
        distinguishing_aspect: "Newly created agreement starts DRAFT with closed_lot_count 0 and version 1."
        test_recipe:
          setup: ["Parcel P and Builder B exist"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "NP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { np: $.data.id }
            - call: "POST /api/builders"
              payload: { builder_name: "NB", license_number: "LIC-N1", contact_email: "n1@x.com" }
              as: DeveloperOperator
              captures: { nb: $.data.id }
          trigger:
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${np}", builder_id: "${nb}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 2 }
              as: DeveloperOperator
              captures: { nag_status: $.data.status, nag_closed: $.data.closed_lot_count, nag_v: $.data.version }
          assert:
            - "captured nag_status == DRAFT, nag_closed == 0, nag_v == 1"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: impact_fee_indexation_at_default_clock
        claim_type: correct_result
        grounds: [calculations.impact_fee_amount]
        distinguishing_aspect: "At the default clock 2026-08-01 (943 days after the 2024-01-01 ordinance epoch -> 2 index years), WATER fee is 265225 and SEWER fee is 318270 (3% compounded annually)."
        test_recipe:
          setup: ["Parcel P ACQUIRED; phase ACTIVE with 2 lots; providers WATER and SEWER registered"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "FP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { fp: $.data.id }
            - call: "POST /api/parcels/${fp}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${fp}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${fp}", phase_name: "PH", sequence_number: 1, planned_lot_count: 2, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { fph: $.data.id }
            - call: "POST /api/phases/${fph}/submit-plat"
              payload: { plat_lot_count: 2, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${fph}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${fph}/record-plat"
              payload: {}
              as: MunicipalClerk
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${fph}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { fbd: $.data.id }
            - call: "POST /api/infrastructure-bonds/${fbd}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${fbd}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
            - call: "POST /api/phases/${fph}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/utility-providers"
              payload: { provider_name: "City Water", utility_type: "WATER", max_connections_per_day: 4 }
              as: MunicipalClerk
              captures: { fpv_w: $.data.id }
            - call: "POST /api/utility-providers"
              payload: { provider_name: "City Sewer", utility_type: "SEWER", max_connections_per_day: 4 }
              as: MunicipalClerk
              captures: { fpv_s: $.data.id }
            - call: "GET /api/lots?phase_id=${fph}"
              as: DeveloperOperator
              captures: { flot1: $.data.0.id, flot2: $.data.1.id }
          trigger:
            - call: "POST /api/utility-connections"
              payload: { lot_id: "${flot1}", provider_id: "${fpv_w}", scheduled_date: "2026-08-20T00:00:00Z" }
              as: DeveloperOperator
              captures: { fee_w: $.data.impact_fee_cents }
            - call: "POST /api/utility-connections"
              payload: { lot_id: "${flot2}", provider_id: "${fpv_s}", scheduled_date: "2026-08-20T00:00:00Z" }
              as: DeveloperOperator
              captures: { fee_s: $.data.impact_fee_cents }
          assert:
            - "captured fee_w == 265225 (250000 * 1.03^2 at the default clock)"
            - "captured fee_s == 318270 (300000 * 1.03^2)"

      - name: release_payment_clamped_at_outstanding
        claim_type: boundary_edge
        grounds: [calculations.lien_release_price, calculations.loan_balance_reconciliation, state_machines.DevelopmentLoan]
        distinguishing_aspect: "With zero outstanding balance the release payment clamps to 0 (payment_applied_cents == 0), the balance never goes negative, and the loan stays ACTIVE because total_drawn_cents == 0 blocks the PAID_OFF auto-transition."
        test_recipe:
          setup: ["Parcel P ACQUIRED; phase ACTIVE with 1 lot; agreement ACTIVE (scheduled 2); loan ACTIVE with NO draws (outstanding 0); closing CL PENDING"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "ZP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { zp: $.data.id }
            - call: "POST /api/parcels/${zp}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${zp}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${zp}", phase_name: "PH", sequence_number: 1, planned_lot_count: 1, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { zph: $.data.id }
            - call: "POST /api/phases/${zph}/submit-plat"
              payload: { plat_lot_count: 1, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${zph}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${zph}/record-plat"
              payload: {}
              as: MunicipalClerk
