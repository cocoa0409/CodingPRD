            - "A second POST /market-conduct/examinations/${exam_id}/abort returns 409 ERR_EXAM_ALREADY_TERMINAL and changes nothing"

  # =============================================================================
  # RULE 5 - priority_pair_validation_conflict
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_priority_40_beats_constraint_priority_65_on_data_call_respond
        grounds:
          - validations[priority 40 ERR_DATA_CALL_NOT_AWAITING_RESPONSE]
          - validations[priority 65 ERR_RECORDS_EXCEED_REQUEST]
          - endpoints[POST /market-conduct/data-calls/{id}/respond]
        distinguishing_aspect: |
          Pair (40, 65) on the same endpoint with a 25-point gap: the data call has already been
          responded to AND the body reports 9999 records against a request for 4000, so both rules are
          live in one call. The lower-numbered state rule must answer with 409
          ERR_DATA_CALL_NOT_AWAITING_RESPONSE; a control call on a still-ISSUED sibling data call with
          the same oversized body proves the 422 rule is not merely dead.
        test_recipe:
          setup:
            - "AURORA carrier; ON_SITE examination 2026-09-01 .. 2026-11-30, scope locked, two areas (CLAIMS population 4000 / sample 10 and RATING population 500 / sample 10)."
            - "CLAIMS data call DC1: 4000 records requested, due 2026-09-15, already RESPONDED with records_received 4000."
            - "RATING data call DC2: 500 records requested, due 2026-09-15, still ISSUED."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "RATING", population_size: 500, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { rt_area_id: "$.data.id" }
