            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-41", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z", holiday_closure_dates: ["2026-08-10"] }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
