          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
