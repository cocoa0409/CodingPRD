# =============================================================================
# task_0150_bnpl_installment_lending — SCAFFOLD_CORNER_DESIGN.yaml (§1.9)
# Breadth probe: enumerative coverage of testable claims in §1.1–§1.7 not already
# covered by §1.8. Sections/claim_types follow references/claim-extraction-guide.md.
# excluded_because stubs cite a §1.8 instance by name (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_merchant_minimal_fields_returns_201
        claim_type: Creation
        grounds: [entities.Merchant, endpoints]
        distinguishing_aspect: "POST /merchants with display_name+mdr_bps -> 201, status=ACTIVE, gross_financed_cents=0, net_settled_cents=0, version=1, settlement_hold_days default 2."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /merchants"
              payload: { display_name: "Acme", mdr_bps: 500 }
              as: Servicer
              captures: { m_id: $.data.id, hold: $.data.settlement_hold_days }
          assert:
            - "HTTP status == 201"
            - "Merchant.${m_id}.status == ACTIVE AND gross_financed_cents == 0 AND net_settled_cents == 0"
            - "Merchant.${m_id}.settlement_hold_days == 2 AND version == 1"

      - name: borrower_default_settlement_hold_omitted_applies_default
        claim_type: Defaults
        grounds: [entities.Merchant.fields.settlement_hold_days]
        distinguishing_aspect: "Omitting settlement_hold_days on POST /merchants applies the declared default 2."
        excluded_because:
          difficulty_instance: combinatorial_formula / monthly_amortization_nonlinear_three_inputs
          rationale: "Default settlement_hold_days is exercised wherever a merchant is created without the field; covered structurally by the create_merchant_minimal corner above and used throughout §1.8 chains. Stub to avoid duplication."

      - name: get_borrower_includes_computed_credit_fields
        claim_type: Computed Fields
        grounds: [entities.Borrower.fields.eligible_credit_limit_cents, entities.Borrower.fields.available_credit_cents, calculations.eligibility_limit]
        distinguishing_aspect: "GET /borrowers/{id} returns eligible_credit_limit_cents=200000 for score 700 income 3_000_000 (min(200000, 300000)); available equals limit when no loans."
        test_recipe:
          setup: ["Borrower BB score 700 income 3_000_000c registered."]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { full_name: "BB", email: "bb@x.com", annual_income_cents: 3000000, soft_credit_score: 700 }
              as: Servicer
              captures: { bb_id: $.data.id }
          trigger:
            - call: "GET /borrowers/${bb_id}"
              as: Servicer
              captures: { lim: $.data.eligible_credit_limit_cents, avail: $.data.available_credit_cents }
          assert:
            - "Borrower.${bb_id}.eligible_credit_limit_cents == 200000"
            - "Borrower.${bb_id}.available_credit_cents == 200000 AND outstanding_principal_cents == 0"

      - name: get_loan_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /loans/{random-uuid} on empty DB -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /loans/00000000-0000-4000-8000-000000000001"
              as: Servicer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 AND response error_id == ERR_NOT_FOUND"

      - name: application_missing_term_months_for_monthly_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Application.fields.term_months
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "MONTHLY application omitting term_months -> ERR_INVALID_REQUEST (422); term_months is conditionally required."
        test_recipe:
          setup: ["Merchant M ACTIVE; Borrower BA limit 500000."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 120000, plan_type: "MONTHLY", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 AND response error_id == ERR_INVALID_REQUEST"

      - name: application_term_months_for_pay_in_4_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Application.fields.term_months
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "PAY_IN_4 application that includes term_months -> ERR_INVALID_REQUEST (422); term_months must be absent for PAY_IN_4."
        test_recipe:
          setup: ["Merchant M ACTIVE; Borrower BA limit 500000."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", term_months: 6, requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 AND response error_id == ERR_INVALID_REQUEST"

      - name: disclosure_acceptance_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.DisclosureAcceptance]
        distinguishing_aspect: "DisclosureAcceptance has common_fields:false — response carries id+created_at, no version, and there is no update endpoint."
        test_recipe:
          setup: ["Merchant M ACTIVE; Borrower BA; App A APPROVED."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
          trigger:
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { d_id: $.data.id, apr: $.data.disclosed_apr_bps }
          assert:
            - "DisclosureAcceptance.${d_id}.disclosed_apr_bps == 0 (PAY_IN_4)"
            - "DisclosureAcceptance.${d_id} response has no version field"
            - "DisclosureAcceptance.${d_id}.disclosed_finance_charge_cents == 0 AND disclosed_installment_count == 4"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: decline_application_already_declined_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.SUBMITTED_to_DECLINED
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Deciding an application that is already DECLINED -> ERR_INVALID_STATE (409); DECLINED is terminal."
        test_recipe:
          setup: ["Borrower BD score 500 -> limit 0; App D SUBMITTED then DECLINED (INSUFFICIENT_CREDIT)."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BD", email: "bd@x.com", annual_income_cents: 9000000, soft_credit_score: 500 }
              as: Servicer
              captures: { bd_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${bd_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${bd_id}"
              captures: { app_d_id: $.data.id }
            - call: "POST /applications/${app_d_id}/decision"
              payload: { decision: "DECLINE" }
              as: Servicer
          trigger:
            - call: "POST /applications/${app_d_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response error_id == ERR_INVALID_STATE"

      - name: decline_reason_insufficient_credit_on_zero_limit_borrower
        claim_type: Side Effect Execution
        grounds: [state_machines.Application.SUBMITTED_to_DECLINED, entities.Application.fields.decline_reason, calculations.eligibility_limit]
        distinguishing_aspect: "A borrower with eligible_credit_limit_cents=0 (score 500) -> DECLINE sets decline_reason=INSUFFICIENT_CREDIT."
        test_recipe:
          setup: ["Borrower BD score 500 limit 0; App D SUBMITTED on ACTIVE merchant."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BD", email: "bd@x.com", annual_income_cents: 9000000, soft_credit_score: 500 }
              as: Servicer
              captures: { bd_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${bd_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${bd_id}"
              captures: { app_d_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_d_id}/decision"
              payload: { decision: "DECLINE" }
              as: Servicer
              captures: { reason: $.data.decline_reason }
          assert:
            - "Application.${app_d_id}.status == DECLINED AND decline_reason == INSUFFICIENT_CREDIT"

      - name: withdraw_application_from_submitted
        claim_type: Valid Transition
        grounds: [state_machines.Application.SUBMITTED_to_WITHDRAWN]
        distinguishing_aspect: "POST /applications/{id}/withdraw on a SUBMITTED app -> WITHDRAWN (terminal)."
        test_recipe:
          setup: ["Merchant M ACTIVE; Borrower BA; App A SUBMITTED."]
          setup_api_calls:
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_a_id}/withdraw"
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { st: $.data.status }
          assert:
            - "Application.${app_a_id}.status == WITHDRAWN"

      - name: default_loan_not_delinquent_returns_not_delinquent
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Loan.ACTIVE_to_DEFAULTED
          - "validations[priority=9]"
          - "errors[ERR_NOT_DELINQUENT]"
        distinguishing_aspect: "POST /loans/{id}/default on an ACTIVE+CURRENT loan -> ERR_NOT_DELINQUENT (409); default requires delinquency_status==DELINQUENT."
        test_recipe:
          setup: ["Loan A PAY_IN_4 financed 100000 activated 2026-01-01, CURRENT, no payments."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id, lv: $.data.version }
          trigger:
            - call: "POST /loans/${loan_a_id}/default"
              payload: { expected_loan_version: "${lv}" }
              as: Servicer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response error_id == ERR_NOT_DELINQUENT"

      - name: default_delinquent_loan_writes_off_installments_and_claws_pending_settlement
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Loan.ACTIVE_to_DEFAULTED
          - state_machines.Installment.LATE_to_WRITTEN_OFF
          - state_machines.MerchantSettlement.PENDING_to_CLAWED_BACK
        distinguishing_aspect: "Defaulting a DELINQUENT loan (settlement still PENDING) -> status DEFAULTED, open installments WRITTEN_OFF, PENDING settlement CLAWED_BACK, version+1."
        test_recipe:
          setup: ["Loan A PAY_IN_4 financed 100000 activated 2026-01-01; clock to 2026-02-01 -> DELINQUENT; settlement PENDING (hold 30 days)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600, settlement_hold_days: 30 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Servicer
            - call: "GET /loans/${loan_a_id}"
              as: Servicer
              captures: { lv: $.data.version }
            - call: "GET /merchant-settlements?loan_id=${loan_a_id}"
              as: Servicer
              captures: { s_id: "$.data[0].id" }
          trigger:
            - call: "POST /loans/${loan_a_id}/default"
              payload: { expected_loan_version: "${lv}" }
              as: Servicer
              captures: { st: $.data.status }
            - call: "GET /merchant-settlements/${s_id}"
              as: Servicer
              captures: { s_status: $.data.status }
          assert:
            - "Loan.${loan_a_id}.status == DEFAULTED"
            - "all installments status IN {WRITTEN_OFF}"
            - "MerchantSettlement.${s_id}.status == CLAWED_BACK"

      - name: cancel_loan_with_payments_returns_loan_has_payments
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Loan.ACTIVE_to_CANCELLED
          - "validations[priority=10]"
          - "errors[ERR_LOAN_HAS_PAYMENTS]"
        distinguishing_aspect: "Cancelling a loan after a payment (total_paid_cents>0) -> ERR_LOAN_HAS_PAYMENTS (409)."
        test_recipe:
          setup: ["Loan A PAY_IN_4 financed 100000, one 25000 payment applied."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "POST /payments"
              payload: { loan_id: "${loan_a_id}", amount_cents: 25000, source: "MANUAL" }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "GET /loans/${loan_a_id}"
              as: Servicer
              captures: { lv: $.data.version }
          trigger:
            - call: "POST /loans/${loan_a_id}/cancel"
              payload: { expected_loan_version: "${lv}" }
              as: Servicer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response error_id == ERR_LOAN_HAS_PAYMENTS"

      - name: settlement_release_from_already_released_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.MerchantSettlement.PENDING_to_RELEASED
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Releasing a settlement already RELEASED -> ERR_INVALID_STATE (409); RELEASED is terminal w.r.t. release."
        test_recipe:
          setup: ["Merchant M hold 0; Loan A activated 2026-01-01; settlement S released."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600, settlement_hold_days: 0 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "GET /merchant-settlements?loan_id=${loan_a_id}"
              as: Servicer
              captures: { s_id: "$.data[0].id" }
            - call: "POST /merchant-settlements/${s_id}/release"
              as: Servicer
          trigger:
            - call: "POST /merchant-settlements/${s_id}/release"
              as: Servicer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 AND response error_id == ERR_INVALID_STATE"

      - name: installment_initial_state_scheduled_on_loan_creation
        claim_type: Initial State
        grounds: [entities.Installment.fields.status, state_machines.Installment]
        distinguishing_aspect: "Freshly generated installments start SCHEDULED with amount_paid_cents=0, late_fee_cents=0."
        excluded_because:
          difficulty_instance: dual_variant_calc / schedule_pay_in_4_vs_monthly_diverge_on_same_principal
          rationale: "Schedule generation (and the SCHEDULED initial state) is verified by the dual-variant schedule §1.8 instance which inspects the generated installments."

  # ===========================================================================
  - section: calculations
    instances:
      - name: late_fee_floor_applied_small_installment
        claim_type: Constants Applied
        grounds: [calculations.late_fee_assessment, entities.Installment.fields.late_fee_cents]
        distinguishing_aspect: "An installment of 10000c going LATE assesses late_fee = max(700, round(10000*0.05=500)) = 700 (floor clamp). MONTHLY 24-month split keeps a small installment."
        test_recipe:
          setup: ["MONTHLY term 24 loan, financed 240000 -> first installment small enough that 5% < 700? Use return to shrink. Simpler: PAY_IN_4 financed 12000 -> installments 3000; 5% of 3000=150 -> floor 700."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
