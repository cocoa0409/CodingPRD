              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et3: $.data.id }
            - call: "POST /trips/${et3}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /enrollments/${e_id}/finalize-scoring"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /quotes"
              payload: { enrollment_id: "${e_id}" }
              as: UnderwritingOps
              captures: { q_id: $.data.id }
            - call: "POST /policies"
              payload: { quote_id: "${q_id}" }
              as: UnderwritingOps
              captures: { p_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${p_id}", reported_severity: 2 }
