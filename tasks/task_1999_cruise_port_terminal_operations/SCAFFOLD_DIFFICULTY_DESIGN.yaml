            - { call: "POST /port-ops/port-calls/${pca}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pca_v}" }, as: Harbormaster, captures: { baa: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${baa}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VC", scheduled_eta: "2026-08-11T01:00:00Z", scheduled_etd: "2026-08-11T09:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pcc: $.data.id, pcc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pcc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T23:59:00Z", window_end: "2026-08-11T11:59:00Z", expected_port_call_version: "${pcc_v}" }, as: Harbormaster, captures: { bac: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VB", scheduled_eta: "2026-08-11T02:00:00Z", scheduled_etd: "2026-08-11T10:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pcb: $.data.id, pcb_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pcb}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-11T00:00:00Z", window_end: "2026-08-11T12:00:00Z", expected_port_call_version: "${pcb_v}" }, as: Harbormaster, captures: { babb: $.data.id } }
          trigger:
            - { call: "POST /port-ops/berth-assignments/${bac}/confirm", as: Harbormaster, captures: { err: $.data.error_id } }
            - { call: "POST /port-ops/berth-assignments/${babb}/confirm", as: Harbormaster, captures: { st: $.data.status } }
          assert:
