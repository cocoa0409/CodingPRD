        distinguishing_aspect: "The same endpoint branches on mode: GRACE only flips the status and bumps the version leaving allocated 50000 intact with rollover_out 0, while FINAL runs period_close_rollover and lands rollover_out 12500, forfeited 37500 and available 0."
        test_recipe:
