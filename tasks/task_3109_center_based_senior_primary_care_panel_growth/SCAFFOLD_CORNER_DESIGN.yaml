scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: center_create_returns_defaults_and_201
        claim_type: Creation
        grounds:
          - "entities.Center"
          - "endpoints.POST_/senior-care/centers"
        distinguishing_aspect: "POST /senior-care/centers with the three required inputs returns 201 with status PRE_OPEN, profitability_tier RAMP, maturity_months 0, cumulative_contribution_cents 0, version 1, and system id/created_at/updated_at."
        test_recipe:
          setup: ["Logical clock at default 2026-09-01T00:00:00Z. Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/centers"
              payload: { name: "Harbor", neighborhood_code: "CHI-HARBOR-02", opened_on: "2026-09-01" }
              as: NetworkOperator
              captures: { c_id: $.data.id }
          assert:
            - "status 201, response_type object"
            - "Center.${c_id}.status == PRE_OPEN"
            - "Center.${c_id}.profitability_tier == RAMP and maturity_months == 0"
            - "Center.${c_id}.cumulative_contribution_cents == 0 and version == 1"
            - "data.id, created_at, updated_at present"

      - name: patient_get_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - "entities.Patient"
          - "endpoints.GET_/senior-care/patients/{patientId}"
        distinguishing_aspect: "Every stored Patient field round-trips unchanged through GET, including the default transport_dependent=false and no_show_strikes=0."
        test_recipe:
          setup: ["Clock default. One patient registered."]
          setup_api_calls:
            - call: "POST /senior-care/patients"
              payload: { full_name: "Della Roe", date_of_birth: "1955-04-12", zip_code: "60607", risk_score: 1.75 }
              as: EnrollmentCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /senior-care/patients/${p_id}"
              payload: {}
              as: CareTeamLead
              as_user_id: "${t_any}"
          assert:
            - "Patient.full_name == \"Della Roe\" and risk_score == 1.75"
            - "Patient.transport_dependent == false and no_show_strikes == 0"

      - name: centers_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "endpoints.GET_/senior-care/centers"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "With three centers, limit=2&offset=0 returns 2 rows, total_count 3, has_more true; offset=2 returns 1 row, has_more false."
        test_recipe:
          setup: ["Three centers created."]
          setup_api_calls:
            - call: "POST /senior-care/centers"
              payload: { name: "C1", neighborhood_code: "N1", opened_on: "2026-01-01" }
              as: NetworkOperator
            - call: "POST /senior-care/centers"
              payload: { name: "C2", neighborhood_code: "N2", opened_on: "2026-01-01" }
              as: NetworkOperator
            - call: "POST /senior-care/centers"
              payload: { name: "C3", neighborhood_code: "N3", opened_on: "2026-01-01" }
              as: NetworkOperator
          trigger:
            - call: "GET /senior-care/centers"
              payload: { limit: 2, offset: 0 }
              as: FinanceAnalyst
          assert:
            - "data length == 2, total_count == 3, has_more == true"

      - name: get_missing_patient_returns_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.GET_/senior-care/patients/{patientId}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /senior-care/patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: EnrollmentCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "status 404 and error_id == ERR_NOT_FOUND"

      - name: center_create_missing_opened_on_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Center.fields.opened_on"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required opened_on fails with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/centers"
              payload: { name: "NoDate" , neighborhood_code: "N9" }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "status 400, error_id == ERR_INVALID_REQUEST"

      - name: vehicle_wheelchair_default_false
        claim_type: Defaults
        grounds:
          - "entities.Vehicle.fields.wheelchair_capable"
        distinguishing_aspect: "Omitting wheelchair_capable yields false in the stored vehicle."
        test_recipe:
          setup: ["Center exists."]
          setup_api_calls:
            - call: "POST /senior-care/centers"
              payload: { name: "D", neighborhood_code: "ND", opened_on: "2026-01-01" }
              as: NetworkOperator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /senior-care/centers/${c_id}/vehicles"
              payload: { plate: "IL-1234", seat_capacity: 4 }
              as: NetworkOperator
              captures: { v_id: $.data.id }
          assert:
            - "Vehicle.${v_id}.wheelchair_capable == false"

      - name: care_team_staffing_score_computed_ignores_input
        claim_type: Computed Fields
        grounds:
          - "entities.CareTeam.fields.staffing_score"
        distinguishing_aspect: "staffing_score is computed as physician*1.0 + chw*0.5 + behavioral*0.75 (2.0 + 1.0 + 0.75 = 3.75 for 2/2/1) even if the client submits a staffing_score field — computed fields ignore client input."
        test_recipe:
          setup: ["Center exists."]
          setup_api_calls:
            - call: "POST /senior-care/centers"
              payload: { name: "E", neighborhood_code: "NE", opened_on: "2026-01-01" }
              as: NetworkOperator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /senior-care/centers/${c_id}/care-teams"
              payload: { team_label: "T", panel_cap: 10, physician_count: 2, chw_count: 2, behavioral_count: 1, staffing_score: 99.99 }
              as: NetworkOperator
              captures: { t_id: $.data.id }
          assert:
            - "CareTeam.${t_id}.staffing_score == 3.75"

      - name: patient_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds:
          - "entities.Patient"
        distinguishing_aspect: "Client-supplied id/version/created_at in the create payload are ignored; the server mints them."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/patients"
              payload: { full_name: "Sys", date_of_birth: "1950-01-01", zip_code: "60601", risk_score: 1.00, id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 42 }
              as: EnrollmentCoordinator
              captures: { p_id: $.data.id }
          assert:
            - "Patient.${p_id}.version == 1"
            - "Patient.${p_id}.id != \"8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2\""

      - name: attribution_invalid_status_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.HealthPlan.fields.contract_type"
          - "validations[priority=4]"
        distinguishing_aspect: "contract_type outside {FULL_RISK, SHARED_SAVINGS} fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/health-plans"
              payload: { plan_name: "Bad", contract_type: "PARTIAL", base_pmpm_cents: 50000, risk_adjust_factor: 1.0, revenue_share_pct: 0.8 }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "status 400, error_id == ERR_INVALID_REQUEST"

      - name: care_team_create_requires_existing_center
        claim_type: Parent Relationships
        grounds:
          - "entities.CareTeam.fields.center_id"
          - "validations[priority=3]"
        distinguishing_aspect: "Creating a care team under a non-existent center id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/centers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/care-teams"
              payload: { team_label: "T", panel_cap: 10, physician_count: 1, chw_count: 1, behavioral_count: 0 }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "status 404, error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: settlement_close_provisional_from_finalized_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.MonthlySettlement"
          - "errors[ERR_SETTLEMENT_NOT_OPEN]"
        distinguishing_aspect: "close-provisional on a FINALIZED settlement fails with ERR_SETTLEMENT_NOT_OPEN; no side effects fire."
        test_recipe:
          setup: ["Settlement finalized for 2026-08."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/monthly-settlements/${stl_id}/close-provisional"
              payload: { expected_center_version: "${c_v}" }
              as: FinanceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SETTLEMENT_NOT_OPEN and status stays FINALIZED"

      - name: terminal_state_lockdown_disenrolled_attribution_cannot_disenroll_again
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.PatientAttribution"
          - "errors[ERR_ATTRIBUTION_NOT_ACTIVE]"
        distinguishing_aspect: "Disenroll on an already-DISENROLLED attribution fails with ERR_ATTRIBUTION_NOT_ACTIVE."
        test_recipe:
          setup: ["Attribution already DISENROLLED."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/patient-attributions/${attr}/disenroll"
              payload: {}
              as: EnrollmentCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ATTRIBUTION_NOT_ACTIVE"

      - name: attribution_initial_state_pending
        claim_type: Initial State
        grounds:
          - "state_machines.PatientAttribution"
        distinguishing_aspect: "A newly created attribution starts in PENDING with disenrolled_month null."
        test_recipe:
          setup: ["Center, team, plan, patient exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/patient-attributions"
              payload: { patient_id: "${p_id}", health_plan_id: "${plan_id}", care_team_id: "${t_id}", effective_month: "2026-09" }
              as: EnrollmentCoordinator
              captures: { a_id: $.data.id }
          assert:
            - "PatientAttribution.${a_id}.status == PENDING"
            - "PatientAttribution.${a_id}.disenrolled_month is null"

      - name: ride_dispatch_requires_requested_state
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RideRequest.REQUESTED_to_DISPATCHED"
          - "errors[ERR_RIDE_NOT_REQUESTED]"
        distinguishing_aspect: "Dispatch on an EN_ROUTE ride fails ERR_RIDE_NOT_REQUESTED."
        test_recipe:
          setup: ["Ride already EN_ROUTE."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/ride-requests/${ride}/dispatch"
              payload: { vehicle_id: "${veh}" }
              as: TransportDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RIDE_NOT_REQUESTED"

      - name: appointment_complete_books_cost_and_delivers_ride
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Appointment.CHECKED_IN_to_COMPLETED"
        distinguishing_aspect: "Completing a CHECKED_IN 40-min PRIMARY appointment books 18000 INTERNAL_VISIT cost and flips its DISPATCHED ride to DELIVERED with a 3200 TRANSPORT booking."
        test_recipe:
          setup: ["Appointment CHECKED_IN with DISPATCHED ride."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/appointments/${appt}/complete"
              payload: {}
              as: CareTeamLead
              as_user_id: "${t_id}"
          assert:
            - "Appointment.status == COMPLETED and cost_cents == 18000"
            - "RideRequest.status == DELIVERED"

      - name: appointment_cancel_cascades_to_requested_ride
        claim_type: Cross-entity
        grounds:
          - "state_machines.Appointment.SCHEDULED_to_CANCELLED"
          - "state_machines.RideRequest.REQUESTED_to_CANCELLED"
        distinguishing_aspect: "Cancelling a SCHEDULED appointment cascades its REQUESTED ride to CANCELLED with no transport cost booked."
        test_recipe:
          setup: ["SCHEDULED appointment with REQUESTED ride, clock before start_utc."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/appointments/${appt}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Appointment.status == CANCELLED"
            - "RideRequest.status == CANCELLED"

      - name: disenroll_bubbles_center_from_saturated_to_open_and_promotes_waitlist
        claim_type: Bubble up
        grounds:
          - "state_machines.Center.SATURATED_to_OPEN"
          - "state_machines.PatientAttribution.WAITLISTED_to_PENDING"
        distinguishing_aspect: "Disenrolling the last ACTIVE patient on a SATURATED center flips it to OPEN and promotes the earliest-created WAITLISTED attribution to PENDING."
        test_recipe:
          setup: ["Center SATURATED, team cap 2 with 2 ACTIVE and 1 WAITLISTED attribution."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/patient-attributions/${attr1}/disenroll"
              payload: {}
              as: EnrollmentCoordinator
          assert:
            - "Center.status == OPEN"
            - "waitlisted attribution status == PENDING; CareTeam.waitlist_depth == 0"

      - name: second_activation_same_attribution_rejected
        claim_type: Idempotency
        grounds:
          - "state_machines.PatientAttribution.PENDING_to_ACTIVE"
          - "errors[ERR_ATTRIBUTION_NOT_PENDING]"
        distinguishing_aspect: "Activating the same attribution twice: the second call fails ERR_ATTRIBUTION_NOT_PENDING and the panel count is unchanged."
        test_recipe:
          setup: ["Attribution already ACTIVE."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/patient-attributions/${attr}/activate"
              payload: { expected_care_team_version: "${t_v}" }
              as: EnrollmentCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ATTRIBUTION_NOT_PENDING; active_panel_count unchanged"

      - name: claim_settled_automatically_when_settlement_finalizes
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.CostOfCareClaim.ADJUDICATED_to_SETTLED"
          - "state_machines.MonthlySettlement.CLOSED_PROVISIONAL_to_FINALIZED"
        distinguishing_aspect: "Finalizing a settlement moves all its ADJUDICATED claims to SETTLED."
        test_recipe:
          setup: ["CLOSED_PROVISIONAL settlement with one ADJUDICATED claim, no SUBMITTED claims."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/monthly-settlements/${stl}/finalize"
              payload: {}
              as: FinanceController
          assert:
            - "CostOfCareClaim.status == SETTLED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: quote_at_mature_boundary_fill_ratio_exactly_three_quarters
        claim_type: Correct Result
        grounds:
          - "calculations.profitability_ramp_tier"
          - "calculations.risk_adjusted_pmpm_quote"
        distinguishing_aspect: "panel_fill_ratio == 0.7500 exactly qualifies for MATURE (inclusive lower bound): with maturity >= 12 and non-negative cumulative contribution the tier is MATURE and the 1.05 multiplier applies."
        test_recipe:
          setup: ["Center opened 2025-01-01 (maturity >= 12 at clock 2026-09), cumulative_contribution_cents >= 0, fill exactly 0.7500 (3 active of cap 4)."]
          setup_api_calls: []
          trigger:
            - call: "GET /senior-care/health-plans/${plan_id}/quote"
              payload: { risk_score: 1.00, center_id: "${c_id}" }
              as: FinanceAnalyst
          assert:
            - "tier_applied == MATURE and quote uses 1.05 multiplier"

      - name: no_show_books_half_cost_rounded
        claim_type: Precision
        grounds:
          - "calculations.cost_of_care_booking"
        distinguishing_aspect: "A 20-min CHW_OUTREACH no-show books round_half_up(9000 * 0.5 * 0.5) == 2250 cents."
        test_recipe:
          setup: ["SCHEDULED CHW_OUTREACH 20-min appointment whose window has passed; nightly sweep ran."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "GET /senior-care/appointments/${appt}"
              payload: {}
              as: FrontDesk
          assert:
            - "Appointment.status == COMPLETED_NO_SHOW and cost_cents == 2250"

      - name: diversion_rate_excludes_self_care
        claim_type: Input Set Filtering
        grounds:
          - "calculations.ed_diversion_rate"
        distinguishing_aspect: "With 2 RESOLVED_DIVERTED, 1 RESOLVED_ED, 1 EXPIRED, 3 RESOLVED_SELF_CARE the rate is 2/4 == 0.5000 — self-care excluded from both numerator and denominator."
        test_recipe:
          setup: ["Seven triage cases resolved as described in the period."]
          setup_api_calls: []
          trigger:
            - call: "GET /senior-care/centers/${c_id}"
              payload: {}
              as: NetworkOperator
          assert:
            - "Center.ed_referral_count_current_month == 2 (1 ED + 1 EXPIRED)"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_role_header_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request with no X-User-Role header returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/centers"
              payload: { name: "H", neighborhood_code: "NH", opened_on: "2026-01-01" }
              as: __NO_ROLE__
              captures: { err: $.data.error_id }
          assert:
            - "status 400, error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: future_effective_month_rejected_at_create
        claim_type: Violation → Error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_TEMPORAL_VIOLATION]"
        distinguishing_aspect: "Creating an attribution with effective_month before the current logical month fails 422 ERR_TEMPORAL_VIOLATION."
        test_recipe: { setup: ["Clock at 2026-09-15."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/patient-attributions"
            payload: { patient_id: "${p}", health_plan_id: "${plan}", care_team_id: "${t}", effective_month: "2026-08" }
            as: EnrollmentCoordinator
            captures: { err: $.data.error_id }
        assert:
          - "status 422, error_id == ERR_TEMPORAL_VIOLATION"

      - name: behavioral_appointment_requires_behavioral_room
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_CROSS_REFERENCE_MISMATCH]"
        distinguishing_aspect: "A BEHAVIORAL appointment in a room with supports_behavioral == false fails 422 ERR_CROSS_REFERENCE_MISMATCH."
        test_recipe: { setup: ["Room R1 supports_behavioral=false."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/appointments"
            payload: { care_team_id: "${t}", patient_id: "${p}", room_id: "${r}", start_utc: "2026-09-12T10:00:00Z", duration_minutes: 40, kind: "BEHAVIORAL" }
            as: FrontDesk
            captures: { err: $.data.error_id }
        assert:
          - "status 422, error_id == ERR_CROSS_REFERENCE_MISMATCH"

      - name: state_priority_beats_fiscal_on_claim_submit
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=5]"
          - "validations[priority=11]"
        distinguishing_aspect: "Submitting a claim whose service_month is in the future AND whose period settlement is finalized returns the temporal error ERR_TEMPORAL_VIOLATION (priority 5) before the fiscal gate ERR_FISCAL_GATE_VIOLATION (priority 11)."
        test_recipe: { setup: ["Settlement FINALIZED for 2026-08; clock 2026-09."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/cost-claims"
            payload: { center_id: "${c}", patient_id: "${p}", service_month: "2027-01", category: "PHARMACY", amount_cents: 100 }
            as: ClaimsAdjudicator
            captures: { err: $.data.error_id }
        assert:
          - "error_id == ERR_TEMPORAL_VIOLATION"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_default_is_fixed_before_any_set
        claim_type: Computed read
        grounds:
          - "endpoints.POST_/_clock/set_current_utc"
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z — an attribution with effective_month 2026-09 is activatable at default clock while 2026-10 is not."
        test_recipe: { setup: ["Empty DB, clock never set."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/patient-attributions"
            payload: { patient_id: "${p}", health_plan_id: "${plan}", care_team_id: "${t}", effective_month: "2026-09" }
            as: EnrollmentCoordinator
            captures: { a_id: $.data.id }
        assert:
          - "creation succeeds and activation is permitted at the default clock"

      - name: attribution_create_with_outreach_event_increments_signups
        claim_type: Action endpoint
        grounds:
          - "endpoints.POST_/senior-care/patient-attributions"
          - "entities.OutreachEvent.fields.attributed_signups"
        distinguishing_aspect: "Creating an attribution with outreach_event_id increments OutreachEvent.attributed_signups by 1."
        test_recipe: { setup: ["Outreach event exists with attributed_signups 0."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/patient-attributions"
            payload: { patient_id: "${p}", health_plan_id: "${plan}", care_team_id: "${t}", effective_month: "2026-09", outreach_event_id: "${ev}" }
            as: EnrollmentCoordinator
        assert:
          - "OutreachEvent.${ev}.attributed_signups == 1"

      - name: settlements_filtered_list_by_center
        claim_type: Standard CRUD
        grounds:
          - "endpoints.GET_/senior-care/monthly-settlements"
        distinguishing_aspect: "GET /senior-care/monthly-settlements?center_id=X returns only settlements of center X."
        test_recipe: { setup: ["Two centers each with one settlement."], setup_api_calls: [] }
        trigger:
          - call: "GET /senior-care/monthly-settlements"
            payload: { center_id: "${c1}" }
            as: FinanceAnalyst
        assert:
          - "all returned rows have center_id == ${c1}"

  # ===========================================================================
  - section: errors
    instances:

      - name: error_transport_privilege_suspended_triggerable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TRANSPORT_PRIVILEGE_SUSPENDED]"
        excluded_because:
          difficulty_instance: no_show_strike_count_exactly_three_suspends_transport
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_stale_version_triggerable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_VERSION]"
          - "concurrency_rules[attribution-activate-stale-team]"
        distinguishing_aspect: "Activating with an expected_care_team_version one behind the team's current version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Attribution PENDING; team version bumped once by a prior successful activation."]
          setup_api_calls: []
          trigger:
            - call: "POST /senior-care/patient-attributions/${attr2}/activate"
              payload: { expected_care_team_version: "${t_v} - 1" }
              as: EnrollmentCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "status 412, error_id == ERR_STALE_VERSION"

      - name: error_duplicate_settlement_triggerable
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_SETTLEMENT]"
        distinguishing_aspect: "Opening a second settlement for the same (center_id, period_month) fails 409 ERR_DUPLICATE_SETTLEMENT."
        test_recipe:
          setup: ["Settlement exists for center X period 2026-09."]
          setup_api_calls:
            - call: "POST /senior-care/monthly-settlements"
              payload: { center_id: "${c}", period_month: "2026-09" }
              as: FinanceAnalyst
          trigger:
            - call: "POST /senior-care/monthly-settlements"
              payload: { center_id: "${c}", period_month: "2026-09" }
              as: FinanceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "status 409, error_id == ERR_DUPLICATE_SETTLEMENT"

  # ===========================================================================
  - section: roles
    instances:

      - name: finance_analyst_cannot_finalize_settlement
        claim_type: RBAC denial
        grounds:
          - "roles.FinanceAnalyst"
          - "roles.FinanceController"
          - "endpoints.POST_/senior-care/monthly-settlements/{settlementId}/finalize"
        distinguishing_aspect: "Segregation of duties: the role that closed provisionally (FinanceAnalyst) is denied finalize (403 ERR_UNAUTHORIZED) — only FinanceController may finalize."
        test_recipe: { setup: ["Settlement CLOSED_PROVISIONAL."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/monthly-settlements/${stl}/finalize"
            payload: {}
            as: FinanceAnalyst
            captures: { err: $.data.error_id }
        assert:
          - "status 403, error_id == ERR_UNAUTHORIZED"

      - name: claims_adjudicator_cannot_dispatch_rides
        claim_type: RBAC denial
        grounds:
          - "roles.ClaimsAdjudicator"
          - "roles.TransportDispatcher"
        distinguishing_aspect: "Peer-role isolation: ClaimsAdjudicator calling ride dispatch is denied 403 ERR_UNAUTHORIZED."
        test_recipe: { setup: ["Ride REQUESTED."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/ride-requests/${ride}/dispatch"
            payload: { vehicle_id: "${veh}" }
            as: ClaimsAdjudicator
            captures: { err: $.data.error_id }
        assert:
          - "status 403, error_id == ERR_UNAUTHORIZED"

      - name: triage_nurse_cannot_complete_appointments
        claim_type: RBAC denial
        grounds:
          - "roles.TriageNurse"
          - "roles.CareTeamLead"
        distinguishing_aspect: "TriageNurse cannot complete an appointment (403) — appointment completion is exclusive to CareTeamLead."
        test_recipe: { setup: ["Appointment CHECKED_IN."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/appointments/${appt}/complete"
            payload: {}
            as: TriageNurse
            captures: { err: $.data.error_id }
        assert:
          - "status 403, error_id == ERR_UNAUTHORIZED"

  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: occ_settlement_close_stale_center_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[settlement-close-stale-center]"
        distinguishing_aspect: "close-provisional with an expected_center_version one behind the center's current version returns 412 ERR_STALE_VERSION; with the current version it succeeds and bumps Center.version by 1."
        test_recipe:
          setup: ["Settlement OPEN for 2026-09; clock 2026-10-01; center version observed at V."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /senior-care/monthly-settlements/${stl}/close-provisional"
              payload: { expected_center_version: "${c_v} - 1" }
              as: FinanceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "status 412, error_id == ERR_STALE_VERSION"

      - name: settlement_finalize_reconciles_derived_center_fields
        claim_type: derived_field_reconciliation
        grounds:
          - "complexity_profile.complexity_layers"
          - "entities.Center.fields.cumulative_contribution_cents"
          - "entities.Center.fields.panel_fill_ratio"
        distinguishing_aspect: "After finalize, Center.cumulative_contribution_cents, panel_fill_ratio, and profitability_tier all reflect the recomputed settlement values — derived fields reconcile with their sources."
        test_recipe: { setup: ["CLOSED_PROVISIONAL settlement with adjudicated claims."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/monthly-settlements/${stl}/finalize"
            payload: {}
            as: FinanceController
        assert:
          - "Center.cumulative_contribution_cents updated by the finalize delta"
          - "Center.version incremented"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: activation_effects_visible_immediately
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "A successful attribution activation is fully visible in the same response: status ACTIVE, and a follow-up GET of the care team shows active_panel_count incremented with no lag."
        test_recipe: { setup: ["PENDING attribution, clock in effective month."], setup_api_calls: [] }
        trigger:
          - call: "POST /senior-care/patient-attributions/${attr}/activate"
            payload: { expected_care_team_version: "${t_v}" }
            as: EnrollmentCoordinator
        assert:
          - "response shows status == ACTIVE"
          - "GET /senior-care/care-teams/${t} shows active_panel_count incremented by 1"
