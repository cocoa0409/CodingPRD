            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Bob Birch", email: "bob@example.org", county: "Cecil", prior_gardening_years: 3 }, as: ProgramCoordinator, captures: { app2: $.data.id } }
            - { call: "POST /applications/${app2}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app2}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
