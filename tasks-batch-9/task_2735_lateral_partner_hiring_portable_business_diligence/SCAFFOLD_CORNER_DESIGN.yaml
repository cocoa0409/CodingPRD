          Rung 4 owns NUMERIC RANGE, not just presence and type: notice_period_days is
          capped at 365, non_solicit_days at 730, and current_standard_rate_usd must be
          strictly positive. Each probe sends a value of the correct JSON type that violates
          exactly one declared bound, so a naive type-only validator lets all three through
          and mints candidates with impossible notice geometry. All three must be 400, not
          422 — 422 in this scaffold is reserved for cross-entity and window semantics.
