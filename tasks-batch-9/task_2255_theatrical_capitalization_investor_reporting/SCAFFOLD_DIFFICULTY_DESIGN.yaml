    - §1.1 Production.recoupment_pct (4dp)
    distinguishing_aspect: |
      capitalization_target_cents is set to exactly 18,362,500, the exact profit of the
      single certified wrap, so the comparison is at the boundary. A >= implementation
      flips to RECOUPED with recoupment_pct 1.0000; a strictly-greater implementation
      leaves it UNRECOUPED and is caught here rather than by the percentage, which reads
      1.0000 either way.
