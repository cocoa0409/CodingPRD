            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/product-items", payload: { sku: "SKU-AIR", name: "AirportOnly", category: "MERCHANDISE", proprietary: false, venue_type_restrictions: ["AIRPORT"], unit_cost_cents: 500, case_pack_units: 1, footprint_units: 0 }, as: BrandProgramAdmin, captures: { p_air: $.data.id } }
          trigger:
            - { call: "POST /licensing/stores/${store_id}/assortment-items", payload: { product_item_id: "${p_air}", par_level: 5000 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_VENUE_TYPE_PROHIBITED\" with HTTP 422 (safety priority 20 beats constraint priority 24)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: royalty_tier_boundary_exact_threshold
        grounds:
          - calculations.royalty_recognition
          - validations[priority=38]
        distinguishing_aspect: |
          Metric recognized-sales cents at exactly the 50000000 tier threshold: the threshold cent
          belongs to tier 1 (marginal tier-2 amount is 0), so royalty is exactly 1500000 — reached
          via the royalty-statements generation endpoint.
        test_recipe:
          setup:
            - "ACCRUAL agreement with tiers [{0,300},{50000000,350}]; OPERATING store; one FINALIZED report with net exactly 50000000 inside the statement period"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-12" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 }, { threshold_cents: 50000000, rate_bps: 350 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/sales-reports", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-30", gross_sales_cents: 50000000, returns_cents: 0, loyalty_redemption_cents: 0 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { rep_id: $.data.id } }
            - { call: "POST /licensing/sales-reports/${rep_id}/finalize", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "GET /licensing/license-agreements/${agr_id}", payload: {}, as: BrandProgramAdmin, captures: { agr_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${agr_id}/royalty-statements", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-30", expected_agreement_version: "${agr_v}" }, as: BrandProgramAdmin, captures: { stmt_id: $.data.id } }
          assert:
            - "RoyaltyStatement.${stmt_id}.recognized_sales_cents == 50000000"
            - "RoyaltyStatement.${stmt_id}.royalty_amount_cents == 1500000 (exactly the tier-1 value; tier 2 contributes 0 at the boundary)"

      - name: certification_exam_exact_pass_threshold
        grounds:
          - calculations.certification_exam_outcome
        distinguishing_aspect: |
          Metric exam-score points (different metric than royalty cents) reached via record-exam
          (different endpoint): score exactly 80 passes (>= inclusive), score 79 stays ENROLLED.
        test_recipe:
          setup:
            - "Licensee with two employees each ENROLLED in BARISTA_CORE"
          setup_api_calls:
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-13" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
          trigger:
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 80, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 79, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
          assert:
            - "Certification.${cert1}.status == EXAM_PASSED (score == 80 meets the inclusive threshold)"
            - "Certification.${cert2}.status == ENROLLED and exam_attempts == 1 (score 79 fails)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_requires_store_operating
        grounds:
          - state_machines.SupplyOrder.DRAFT_to_SUBMITTED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair SupplyOrder -> LicensedStore: a DRAFT order cannot transition to SUBMITTED
          while its store is in CERT_PENDING, regardless of the order's own validity.
        test_recipe:
          setup:
            - "Store in CERT_PENDING (request-certification done, begin-operations not called); assorted product; approved distributor; DRAFT order"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-14" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
