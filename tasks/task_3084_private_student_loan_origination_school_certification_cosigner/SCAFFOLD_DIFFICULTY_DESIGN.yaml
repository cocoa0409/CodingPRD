            - call: "POST /private-student-loans/_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-05T00:00:00Z" }
              as: Servicer
            - call: "POST /private-student-loans/loans/${loan}/payments"
              payload: { due_period_index: 24, paid_date: "2028-09-05T00:00:00Z", amount_cents: 8055 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { pay24: $.data.id }
            - call: "GET /private-student-loans/loans/${loan}"
              payload: {}
              as: Borrower
              as_user_id: "${brw}"
              captures: { rate_before_reversal: $.data.effective_rate_pct, lifetime_before: $.data.lifetime_accrued_interest_cents }
          trigger:
            - call: "POST /private-student-loans/payments/${pay24}/reverse"
              payload: { reason: "RETURNED_ACH" }
              as: Servicer
              captures: { pay24_status: $.data.payment_status, pay24_qualifying: $.data.is_qualifying }
          assert:
            - "${pay24_status} == REVERSED and ${pay24_qualifying} == false"
            - "Borrower.${brw}.lifetime_on_time_payment_count == 24 — unchanged by the compensating action"
            - "Borrower.${brw}.on_time_payment_run_count == 23 — the run lost exactly one member"
            - "Loan.${loan}.effective_rate_pct == ${rate_before_reversal} == 3.5 — the earned reduction is conserved"
            - "Loan.${loan}.current_balance_cents is one payment higher than before the reversal"
      - name: headroom_is_conserved_across_release_and_school_refund
        grounds:
          - state_machines.Disbursement.RELEASED_to_RELEASED
          - calculations.certification_limit_waterfall
          - entities.Loan.fields.certified_amount_cents
          - entities.Loan.fields.disbursed_amount_cents
        distinguishing_aspect: "Conserved quantity = certification headroom, an entirely different type from the payment counter: certified_amount_cents - disbursed_amount_cents must hold identically before the releases, at zero headroom, and after a school refund, with the refund moving certified_amount_cents instead of silently re-inflating the ceiling."
        test_recipe:
          setup:
            - "An IN_SCHOOL loan certified 400000 for FALL and 300000 for SPRING, total certification 700000, nothing released yet."
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Ivan Borrower", email: "ivan@example.com", state_code: "AK", program_level: "UNDERGRADUATE", credit_score: 700, dti_ratio: 0.22 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Northern Lights College", school_code: "003019", state_code: "AK", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-UG-INV", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5, allows_standalone_borrower: false }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Joan Cosigner", email: "joan@example.com", state_code: "AK", relationship: "PARENT", credit_score: 760, credit_history_months: 160, dti_ratio: 0.2 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 760, dti_ratio: 0.2 }
              as: Cosigner
              as_user_id: "${cos}"
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 700000, cost_of_attendance_cents: 800000, other_aid_cents: 100000, interest_accrual_option: "DEFERRED", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app: $.data.id }
            - call: "POST /private-student-loans/loan-applications/${app}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "GET /private-student-loans/loan-applications/${app}/loans"
              payload: {}
              as: Underwriter
              captures: { loan: "$.data[0].id" }
            - call: "POST /private-student-loans/loan-applications/${app}/school-certifications"
              payload: { academic_period_label: "2026-FALL", certified_amount_cents: 400000, certified_enrollment_status: "IN_SCHOOL", period_end_date: "2026-12-20T00:00:00Z" }
              as: School
              as_user_id: "${sch}"
              captures: { certF: $.data.id }
            - call: "POST /private-student-loans/loan-applications/${app}/school-certifications"
              payload: { academic_period_label: "2027-SPRING", certified_amount_cents: 300000, certified_enrollment_status: "IN_SCHOOL", period_end_date: "2027-05-15T00:00:00Z" }
              as: School
              as_user_id: "${sch}"
              captures: { certS: $.data.id }
            - call: "POST /private-student-loans/school-certifications/${certF}/certify"
              payload: { certified_amount_cents: 400000, certified_enrollment_status: "IN_SCHOOL" }
              as: School
              as_user_id: "${sch}"
            - call: "POST /private-student-loans/school-certifications/${certS}/certify"
              payload: { certified_amount_cents: 300000, certified_enrollment_status: "IN_SCHOOL" }
              as: School
              as_user_id: "${sch}"
            - call: "GET /private-student-loans/loans/${loan}/summary"
              payload: {}
              as: Servicer
              captures: { headroom0: $.data.certified_headroom_cents }
            - call: "GET /private-student-loans/loans/${loan}"
              payload: {}
              as: Servicer
              captures: { v_r1: $.data.version }
            - call: "POST /private-student-loans/loans/${loan}/disbursements"
              payload: { academic_period_label: "2026-FALL", period_start_date: "2026-09-02T00:00:00Z", period_end_date: "2026-12-20T00:00:00Z", scheduled_date: "2026-09-15T00:00:00Z", amount_cents: 200000, expected_loan_version: "${v_r1}" }
              as: Servicer
              captures: { d1: $.data.id }
            - call: "POST /private-student-loans/disbursements/${d1}/release"
              payload: {}
              as: Servicer
            - call: "GET /private-student-loans/loans/${loan}"
              payload: {}
              as: Servicer
              captures: { v_r2: $.data.version }
            - call: "POST /private-student-loans/loans/${loan}/disbursements"
              payload: { academic_period_label: "2027-SPRING", period_start_date: "2027-01-05T00:00:00Z", period_end_date: "2027-05-15T00:00:00Z", scheduled_date: "2027-02-15T00:00:00Z", amount_cents: 500000, expected_loan_version: "${v_r2}" }
              as: Servicer
              captures: { d2: $.data.id }
            - call: "POST /private-student-loans/disbursements/${d2}/release"
              payload: {}
              as: Servicer
            - call: "GET /private-student-loans/loans/${loan}/summary"
              payload: {}
              as: Servicer
              captures: { headroom_full: $.data.certified_headroom_cents }
          trigger:
            - call: "POST /private-student-loans/disbursements/${d2}/school-refund"
              payload: { remainder_credited_cents: 50000 }
              as: School
              as_user_id: "${sch}"
              captures: { refund_st: $.data.refund_status }
          assert:
            - "${headroom0} == 700000 and ${headroom_full} == 0"
            - "${refund_st} == REFUNDED with remainder_credited_cents 50000"
            - "Loan.${loan}.certified_amount_cents == 700000 — the school's refund moved the ceiling, not just the disbursed total"
            - "Loan.${loan}.disbursed_amount_cents == 650000"
            - "GET /private-student-loans/loans/${loan}/summary now reports certified_headroom_cents == 50000, so certified_amount_cents - disbursed_amount_cents is conserved at every step"
