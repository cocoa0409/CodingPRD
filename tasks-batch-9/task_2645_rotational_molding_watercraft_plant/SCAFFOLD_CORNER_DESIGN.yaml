            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CD-2", finished_unit_id: "${fu1}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 2.99 }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CD-2", finished_unit_id: "${fu1}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 3.00 }
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { claim2: $.data.id }
            - call: "POST /warranty-claims/${claim2}/start-review"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${claim2}/storage-review"
              payload: { outcome: "VERIFIED", storage_description: "stored on a cradle indoors" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${claim2}/storage-review"
              payload: { outcome: "VIOLATED", storage_description: "stored hull-down on gravel" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${claim2}/storage-review"
              payload: { outcome: "VIOLATED", storage_description: "second look, same finding" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${claim2}/waive-storage-finding"
              payload: { waiver_note: "dealer corrected the cradle" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warranty-claims/${claim2}/waive-storage-finding"
              payload: { waiver_note: "waiving it twice" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /customers/${cust}/suspend"
              payload: { suspend_reason: "unpaid dealer account" }
              as: PlantAdmin
