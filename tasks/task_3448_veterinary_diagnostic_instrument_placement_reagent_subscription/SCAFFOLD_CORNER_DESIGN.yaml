            - "the follow-up GET returns the identical 4200 — no reconciliation lag"
            - "pricing_detail in both reads lists price_source LIST for VC300_CHEM_SLIDE and PROGRAM_INCLUDED for QC_LEVEL_1"

  # ===========================================================================
  - section: excluded_stubs
    instances:
      - name: corner_stub_renegotiation_cycle_covered
