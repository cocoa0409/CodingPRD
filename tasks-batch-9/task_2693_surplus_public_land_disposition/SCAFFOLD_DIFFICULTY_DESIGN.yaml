  - rule_id: resource_temporal_overlap
    instances:
      - name: appraiser_engagement_closed_interval_endpoint_day_counts_as_overlap
        grounds:
          - validations[priority=55]
          - state_machines.Appraisal.null_to_ORDERED
          - entities.Appraiser.fields.active_engagement_count
          - concurrency_rules[appraisal-order-stale-parcel]
          - errors[ERR_APPRAISER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          The contended resource is an APPRAISER's concurrent-engagement
          capacity (APPRAISER_MAX_CONCURRENT_ENGAGEMENTS = 2) and the interval
          semantics are CLOSED [start, end] - a shared endpoint DAY counts as an
          overlap. The requested engagement [2026-08-20, 2026-08-25] touches the
          END of engagement A (2026-08-02..2026-08-20) and the START of
          engagement B (2026-08-25..2026-09-05), so it collides with BOTH and is
          refused with ERR_APPRAISER_CAPACITY_EXCEEDED (409), while shrinking it
          by exactly one day on each side to [2026-08-21, 2026-08-24] - a window
          strictly between the two - collides with neither and is accepted. The
          rejected create also proves it consumed no OCC token: the identical
          expected_parcel_version is reused successfully on the retry.
        test_recipe:
          setup:
            - "One custodian Agency."
            - "One Appraiser licensed through 2028-01-01T00:00:00Z."
            - "Three parcels P1, P2 and P3 so each engagement carries its own OCC token; the version returned by each create is captured directly."
            - "Engagement A: an ORDERED Appraisal on P1 over the closed interval [2026-08-02, 2026-08-20]."
            - "Engagement B: an ORDERED Appraisal on P2 over the closed interval [2026-08-25, 2026-09-05]."
            - "Both are ORDERED, so both are counted as in-flight by the capacity rule."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /appraisers"
              payload: { name: "Dana Kirkwood MAI", license_number: "AG-44133", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-021", address: "1 Canal Street", acreage: 1.0, zoning_code: "M-1", book_value_cents: 40000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_1_id: "$.data.id", parcel_1_v: "$.data.version" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_1_id}", appraiser_id: "${appraiser_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_1_v}" }
              as: RealPropertyOfficer
