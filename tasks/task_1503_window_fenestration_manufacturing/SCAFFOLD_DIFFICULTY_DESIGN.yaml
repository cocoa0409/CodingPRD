            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { wv2: $.data.version } }
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ordB}", expected_wave_version: "${wv2}" }, as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/lock", as: ProductionLead }
