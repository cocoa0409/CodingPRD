          Two-hundredths of a percent decides both the task kind and the money: utilization_pct 5.00 is inclusive of
          IDLE_UTILIZATION_MAX_PCT so the resource is FLAGGED_IDLE with kind IDLE_TERMINATE and
          projected_savings_cents 1000000, while 5.01 falls through to RIGHTSIZE with 500000 - a 500000-cent swing
