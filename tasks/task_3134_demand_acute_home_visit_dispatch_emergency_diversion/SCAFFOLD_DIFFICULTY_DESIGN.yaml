            - "HTTP status == 422"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sla_breach_strict_greater_than
        grounds:
          - calculations.sla_deadline
          - entities.VisitRequest.fields.sla_breached
        distinguishing_aspect: |
          sla_breached uses strict `>` (not `>=`). An arrival exactly AT
          sla_deadline_at is NOT a breach; one second later IS. This is a
          numeric-timestamp boundary, reached via the arrive endpoint.
        test_recipe:
          setup:
            - "Market with response_window_minutes_urgent=60; URGENT visit; dispatch accepted at 2026-09-15T10:00:00Z."
            - "Two visits: one arrives at exactly 11:00:00Z (== deadline, NOT breach); the other arrives at 11:00:01Z (> deadline, breach)."
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-97.5,32.5],[-96.5,32.5],[-96.5,33.5],[-97.5,33.5],[-97.5,32.5]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Jack J", date_of_birth: "1980-01-01", payer_code: "AETNA", member_id: "M1100", pcp_name: "Dr. V", pcp_npi: "1212121212", comorbidity_count: 1, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/care-teams"
              payload: { market_id: "${mkt_id}", app_user_id: "app-J", tech_user_id: "tech-J", supervising_physician_user_id: "md-J", skill_tags: ["POCT"] }
              as: Dispatcher
              captures: { team_id: $.data.id }
            - call: "POST /dh/care-teams/${team_id}/go-available"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-J", window_start: "2026-09-15T08:00:00Z", window_end: "2026-09-15T20:00:00Z" }
              as: Dispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /dh/vehicle-shifts/${shift_id}/start"
              payload: {}
              as: Dispatcher
            # Visit A: accept at 10:00:00 -> deadline 11:00:00 -> arrive AT 11:00:00
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "fever" }
              as: TriageNurse
              captures: { vr_a: $.data.id, vr_a_v0: $.data.version }
            - call: "POST /dh/visit-requests/${vr_a}/triage-assessments"
              payload: { heart_rate: 130, systolic_bp: 95, spo2_pct: 92, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_a: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_a}/submit"
              payload: { outcome: "APPROPRIATE" }
              as: TriageNurse
            - call: "POST /dh/visit-requests/${vr_a}/dispatch-offers"
              payload: { expected_visit_request_version: "${vr_a_v0}" }
              as: Dispatcher
              captures: { da_a: $.data.id }
            - call: "POST /dh/dispatch-assignments/${da_a}/accept"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-J"
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/dispatch-assignments/${da_a}/arrive"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-J"
            # Visit B (re-walk): new visit; accept at 11:00 -> deadline 12:00; arrive at 12:00:01
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "fever again" }
              as: TriageNurse
              captures: { vr_b: $.data.id, vr_b_v0: $.data.version }
            - call: "POST /dh/visit-requests/${vr_b}/triage-assessments"
              payload: { heart_rate: 130, systolic_bp: 95, spo2_pct: 92, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_b: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_b}/submit"
              payload: { outcome: "APPROPRIATE" }
              as: TriageNurse
            - call: "POST /dh/visit-requests/${vr_b}/dispatch-offers"
              payload: { expected_visit_request_version: "${vr_b_v0}" }
              as: Dispatcher
              captures: { da_b: $.data.id }
            - call: "POST /dh/dispatch-assignments/${da_b}/accept"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-J"
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T12:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dh/dispatch-assignments/${da_b}/arrive"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-J"
          assert:
            - "VisitRequest.${vr_a}.sla_deadline_at == 2026-09-15T11:00:00Z (10:00 + 60 min)"
            - "VisitRequest.${vr_a}.sla_breached == false (arrival AT the deadline is not a breach)"
            - "VisitRequest.${vr_b}.sla_deadline_at == 2026-09-15T12:00:00Z"
            - "VisitRequest.${vr_b}.sla_breached == true (arrival one second after deadline IS a breach)"

