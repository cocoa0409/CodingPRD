  - rule_id: non_linear_state_machine
    instances:
      - name: credit_amendment_cycle_returns_to_issued_twice
        grounds:
          - state_machines.DocumentaryCredit.ISSUED_to_AMENDMENT_PENDING
          - state_machines.DocumentaryCredit.AMENDMENT_PENDING_to_ISSUED
          - state_machines.Amendment.PENDING_CONSENT_to_REJECTED
          - state_machines.Amendment.PENDING_CONSENT_to_ACCEPTED
          - entities.DocumentaryCredit.fields.amendment_seq
          - entities.Amendment.fields.seq
          - calculations.amendment_consent_requirement
          - concurrency_rules[amendment-create-stale-credit]
        distinguishing_aspect: |
          This instance exercises the CYCLIC non-linearity: DocumentaryCredit.status
          leaves ISSUED for AMENDMENT_PENDING and returns to ISSUED twice, and the two
          traversals of the identical edge produce opposite outcomes (round 1 REJECT
          restores the original terms and leaves amendment_seq 0, round 2 ACCEPT applies
          the change_set and sets amendment_seq 2), which a linear reading of the machine
          cannot produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 50000000, collateral_required_pct 0."
