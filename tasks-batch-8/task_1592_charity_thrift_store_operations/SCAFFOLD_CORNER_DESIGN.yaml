# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1592 charity thrift store. Breadth probe: every testable claim of
# §1.1–§1.7 not already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Clock default 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: donor_create_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.Donor]
        distinguishing_aspect: "A donor created with only full_name gets status ACTIVE, tier STANDARD, lifetime_donation_count 0, version 1; email/address fields default null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Min" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
          trigger:
            - call: "GET /api/donors/${d1}"
              as: StoreManager
          assert:
            - "Donor.${d1}.status == ACTIVE"
            - "Donor.${d1}.tier == STANDARD"
            - "Donor.${d1}.lifetime_donation_count == 0"
            - "Donor.${d1}.version == 1"

      - name: batch_create_rejects_system_only_enum
        claim_type: type_constraint
        grounds: [entities.DonationBatch.fields.source, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "source=PICKUP_STOP is system-only at the API surface; posting it (or a bogus enum member) to POST /api/donation-batches is a 400 schema rejection."
        test_recipe:
          setup: ["donor exists"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Enum" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "PICKUP_STOP" }
              as: IntakeAttendant
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: item_create_rejects_computed_field_input
        claim_type: computed_field_readonly
        grounds: [entities.DonationItem.fields.provisional_value_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied computed fields (provisional_value_cents, status, id) in the item-creation body are unknown fields and rejected with ERR_INVALID_REQUEST; the system computes provisional value itself."
        test_recipe:
          setup: ["donor + OPEN batch"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Comp" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD", provisional_value_cents: 1 }
              as: IntakeAttendant
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "batch ${b1}.item_count == 0 (nothing persisted)"

      - name: get_item_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields the 404 ERR_NOT_FOUND envelope, representative of every single-GET endpoint."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: batch_create_missing_donor_returns_not_found
        claim_type: fk_integrity
        grounds: [entities.DonationBatch.fields.donor_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body FK that does not resolve (donor_id) is an existence failure (404 ERR_NOT_FOUND), not a 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/donation-batches"
              payload: { donor_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: items_list_pagination_and_filters
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /api/items honors limit/offset with total_count and has_more per the fixed envelope, and batch_id filters the rows."
        test_recipe:
          setup: ["donor, batch with 3 items (2 CLOTHING, 1 FURNITURE)"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Page" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "FAIR" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "FURNITURE", condition: "GOOD" }
              as: IntakeAttendant
          trigger:
            - call: "GET /api/items"
              payload: { batch_id: "${b1}", limit: 2, offset: 0 }
              as: StoreManager
            - call: "GET /api/items"
              payload: { batch_id: "${b1}", category: "FURNITURE" }
              as: StoreManager
          assert:
            - "first page: 2 rows, total_count == 3, has_more == true"
            - "category filter: 1 row, total_count == 1, has_more == false"

      - name: batch_computed_totals_track_items
        claim_type: computed_field
        grounds: [entities.DonationBatch.fields.item_count, entities.DonationBatch.fields.provisional_value_cents, calculations.calc_provisional_item_value]
        distinguishing_aspect: "Batch aggregates are derived, not stored input: CLOTHING/GOOD (560) + FURNITURE/FAIR (1800) give provisional_value_cents 2360 and untriaged_count 2, dropping to 0 as triage completes."
        test_recipe:
          setup: ["donor + OPEN batch with two items"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Tot" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "FURNITURE", condition: "FAIR" }
              as: IntakeAttendant
              captures: { i2: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
          trigger:
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALVAGE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i2}/triage"
              payload: { decision: "SALVAGE" }
              as: IntakeAttendant
          assert:
            - "before triage: DonationBatch.${b1}.item_count == 2, untriaged_count == 2, provisional_value_cents == 2360"
            - "after both triages: untriaged_count == 0 and provisional_value_cents still == 2360 (disposition does not change FMV)"
            - "DonationItem.${i1}.provisional_value_cents == 560 and DonationItem.${i2}.provisional_value_cents == 1800"

  - section: state_machines
    instances:
      - name: complete_sort_with_untriaged_item_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DonationBatch.SORTING_to_SORTED, "errors[ERR_BATCH_HAS_UNTRIAGED_ITEMS]"]
        distinguishing_aspect: "complete-sort with any item still in RECEIVED fails 409 and the batch stays SORTING."
        test_recipe:
          setup: ["batch SORTING with one RECEIVED item"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D T" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "TOYS", condition: "GOOD" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
          trigger:
            - call: "POST /api/donation-batches/${b1}/complete-sort"
              as: IntakeAttendant
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BATCH_HAS_UNTRIAGED_ITEMS"
            - "DonationBatch.${b1}.status == SORTING"

      - name: triage_after_priced_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DonationItem, "errors[ERR_ITEM_INVALID_STATE]"]
        distinguishing_aspect: "Triage is only legal from RECEIVED while the batch is SORTING; a PRICED item rejects with ERR_ITEM_INVALID_STATE."
        test_recipe:
          setup: ["guideline CLOTHING 2000; item triaged SALABLE and priced"]
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D T2" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
          trigger:
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALVAGE" }
              as: IntakeAttendant
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ITEM_INVALID_STATE"
            - "DonationItem.${i1}.status == PRICED (unchanged)"

      - name: shrunk_item_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.DonationItem, "errors[ERR_ITEM_INVALID_STATE]"]
        distinguishing_aspect: "SHRUNK is terminal: hold/price/triage/release on a shrunken item all fail; representative of terminal lockdown (BALED, DISPOSED behave identically)."
        test_recipe:
          setup: ["item priced and floored inside an OPEN cycle, then shrunk"]
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Sh" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
            - call: "POST /api/cycles"
              as: StoreManager
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
            - call: "POST /api/items/${i1}/shrink"
              payload: { reason: "THEFT" }
              as: StoreManager
          trigger:
            - call: "POST /api/items/${i1}/hold"
              as: Pricer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ITEM_INVALID_STATE"
            - "DonationItem.${i1}.status == SHRUNK"
            - "DonationItem.${i1}.value_at_shrink_cents == 1600"

      - name: hold_from_priced_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DonationItem.ON_FLOOR_to_ON_HOLD, "errors[ERR_ITEM_INVALID_STATE]"]
        distinguishing_aspect: "Hold is only legal from ON_FLOOR; a PRICED (not yet floored) item rejects."
        test_recipe:
          setup: ["item PRICED (no cycle needed)"]
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D H" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
          trigger:
            - call: "POST /api/items/${i1}/hold"
              as: Pricer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ITEM_INVALID_STATE"

      - name: publish_empty_route_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_ROUTE_EMPTY]"]
        excluded_because:
          difficulty_instance: route_unpublish_republish_loop
          rationale: "The first publish attempt of that instance asserts ERR_ROUTE_EMPTY on a stop-less route."

      - name: complete_route_with_open_stop_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PickupRoute.IN_PROGRESS_to_COMPLETED, "errors[ERR_ROUTE_INVALID_STATE]"]
        distinguishing_aspect: "Route completion requires every stop terminal; a SCHEDULED stop blocks it with ERR_ROUTE_INVALID_STATE."
        test_recipe:
          setup: ["route IN_PROGRESS with one SCHEDULED stop"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Drive", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D R" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/pickup-routes"
              payload: { route_date: "2026-08-10", driver_worker_id: "${w1}", truck_capacity_cuft: 500 }
              as: StoreManager
              captures: { r1: $.data.id }
            - call: "POST /api/pickup-routes/${r1}/stops"
              payload: { donor_id: "${d1}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z", estimated_volume_cuft: 100 }
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/publish"
              as: StoreManager
            - call: "POST /api/pickup-routes/${r1}/start"
              as: StoreManager
          trigger:
            - call: "POST /api/pickup-routes/${r1}/complete"
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ROUTE_INVALID_STATE"
            - "PickupRoute.${r1}.status == IN_PROGRESS"

      - name: double_count_rejected
        claim_type: idempotency
        grounds: [state_machines.TillSession, "errors[ERR_TILL_INVALID_STATE]"]
        distinguishing_aspect: "Counting an already-RECONCILED session fails with ERR_TILL_INVALID_STATE — the count action is not idempotent and cannot be replayed."
        test_recipe:
          setup: ["cashier session float 7000, counted even (7000) -> RECONCILED"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 7000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
            - call: "POST /api/till-sessions/${s1}/count"
              payload: { counted_cash_cents: 7000 }
              as: StoreManager
          trigger:
            - call: "POST /api/till-sessions/${s1}/count"
              payload: { counted_cash_cents: 7000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TILL_INVALID_STATE"
            - "TillSession.${s1}.status == RECONCILED"

      - name: cashier_cannot_open_second_session
        claim_type: precondition_enforcement
        grounds: ["validations[priority=9]", "errors[ERR_TILL_SESSION_OPEN_EXISTS]"]
        distinguishing_aspect: "Uniqueness constraint: one OPEN session per cashier; a second open fails 409 while another cashier can still open one."
        test_recipe:
          setup: ["cashiers W1, W2; W1 holds an OPEN session"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W One", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w2: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 5000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 5000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 3000 }
              as: Cashier
              as_user_id: "${w2}"
              captures: { s2: $.data.id }
          assert:
            - "${err} == ERR_TILL_SESSION_OPEN_EXISTS"
            - "TillSession.${s2}.status == OPEN (per-cashier, not global, uniqueness)"

      - name: assignment_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.ShiftAssignment, "errors[ERR_ASSIGNMENT_INVALID_STATE]"]
        distinguishing_aspect: "NO_SHOW is terminal: complete and cancel afterwards both fail with ERR_ASSIGNMENT_INVALID_STATE."
        test_recipe:
          setup: ["VOLUNTEER W assigned to a shift, then marked NO_SHOW"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Vol", employment_type: "VOLUNTEER" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/shifts"
              payload: { role_type: "SORTER", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T13:00:00Z", required_headcount: 1 }
              as: VolunteerCoordinator
              captures: { sh1: $.data.id }
            - call: "POST /api/shifts/${sh1}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { a1: $.data.id }
            - call: "POST /api/shift-assignments/${a1}/no-show"
              as: VolunteerCoordinator
          trigger:
            - call: "POST /api/shift-assignments/${a1}/complete"
              as: VolunteerCoordinator
              captures: { err1: $.data.error_id }
            - call: "POST /api/shift-assignments/${a1}/cancel"
              as: VolunteerCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_ASSIGNMENT_INVALID_STATE"
            - "${err2} == ERR_ASSIGNMENT_INVALID_STATE"
            - "ShiftAssignment.${a1}.status == NO_SHOW"
            - "Worker.${w1}.credited_hours == 0 (no credit on no-show)"

      - name: receipt_double_issue_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TaxReceipt, "errors[ERR_RECEIPT_INVALID_STATE]"]
        distinguishing_aspect: "A batch has at most one ISSUED receipt; a second issuance fails 409."
        test_recipe:
          setup: ["SORTED batch (receipt_requested) with one small item; receipt already ISSUED"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D R2", address_line: "1 Main St" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN", receipt_requested: true }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "TOYS", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/complete-sort"
              as: IntakeAttendant
            - call: "POST /api/donation-batches/${b1}/receipt"
              as: IntakeAttendant
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /api/donation-batches/${b1}/receipt"
              as: IntakeAttendant
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RECEIPT_INVALID_STATE"
            - "exactly one TaxReceipt row exists for batch ${b1} (GET /api/tax-receipts?batch_id=...)"

      - name: receipt_void_after_batch_close_locked
        claim_type: cross_entity_guard
        grounds: [state_machines.TaxReceipt.ISSUED_to_VOIDED, "errors[ERR_RECEIPT_LOCKED]"]
        distinguishing_aspect: "Batch close locks its receipts: voiding after CLOSED fails ERR_RECEIPT_LOCKED even though the receipt is ISSUED."
        test_recipe:
          setup: ["SORTED batch with ISSUED receipt, then batch CLOSED"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Lock", address_line: "2 Main St" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN", receipt_requested: true }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "TOYS", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
