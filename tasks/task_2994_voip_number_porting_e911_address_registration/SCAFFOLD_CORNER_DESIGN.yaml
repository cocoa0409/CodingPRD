          - calculations.reservation_number_selector
        distinguishing_aspect: "Priority 48 can only speak about a number priority 47 has already chosen: when the block's single number is already RESERVED and number_id is omitted, the answer is ERR_NO_NUMBERS_AVAILABLE (409), not the overlap error - and naming that same number explicitly then does yield ERR_NUMBER_RESERVATION_OVERLAP."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; block 415617 with exactly one number 3301 and max_concurrent_reservations 3"
            - "one HELD reservation on 3301 over 2026-08-04 .. 2026-08-10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
