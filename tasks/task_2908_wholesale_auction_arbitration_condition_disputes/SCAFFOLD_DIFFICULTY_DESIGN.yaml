  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: negotiation_cycle_three_rounds_then_escalation_unlocks
        grounds:
          - state_machines.ArbitrationCase.NEGOTIATION_to_COUNTERED
          - state_machines.ArbitrationCase.COUNTERED_to_NEGOTIATION
          - state_machines.ArbitrationCase.COUNTERED_to_ARBITRATOR_REVIEW
          - state_machines.NegotiationRound.COUNTERED_to_SUPERSEDED
          - entities.ArbitrationCase.fields.current_round_index
          - validations[priority=41]
        distinguishing_aspect: |
          Cyclic, not linear: the case traverses NEGOTIATION -> COUNTERED -> NEGOTIATION
          three times over the SAME pair of states, and the loop's exit is gated by a
          counter (current_round_index >= MAX_NEGOTIATION_ROUNDS 3) rather than by the
          state itself — the third counter leaves the case in exactly the same COUNTERED
          status as the first, yet only after it does escalation stop returning
          ERR_NEGOTIATION_NOT_EXHAUSTED.
        test_recipe:
          setup:
            - "the FRAME_DAMAGE registry, sale and evidenced case, reviewed by arb-intake-01"
            - "three completed offer/counter cycles: offers 100000, 150000, 180000 at clock 2026-08-01T00:00:00Z, 2026-08-01T03:00:00Z and 2026-08-01T06:00:00Z, each countered at the same instant it was offered"
            - "rounds 1 and 2 are SUPERSEDED, round 3 is COUNTERED with cooldown_until_utc 2026-08-01T08:00:00Z, ArbitrationCase.status is COUNTERED and current_round_index is 3"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "FRAME_DAMAGE", window_hours: 168, mileage_limit: 1000, min_claim_amount_cents: 50000, requires_third_party_verification: true, max_allowance_bps: 3000, psi_extension_hours: 72, psi_clean_waives_rights: false }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "RED", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "FRAME_DAMAGE", claim_amount_cents: 285000, odometer_at_claim: 84120, complaint_text: "Frame rail repair found on the lift" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "AutoCheck Bay 4", document_reference: "IR-88120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "THIRD_PARTY_VERIFICATION", provider_name: "National Frame Verify", document_reference: "TPV-4471" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/open-review"
              payload: {}
              as: Arbitrator
              as_user_id: "arb-intake-01"
            - call: "POST /arbitration/cases/${case_id}/seller-response"
              payload: { response_type: "OFFER_REPAIR_ALLOWANCE", response_note: "First offer", seller_offer_cents: 100000 }
              as: SellerRep
