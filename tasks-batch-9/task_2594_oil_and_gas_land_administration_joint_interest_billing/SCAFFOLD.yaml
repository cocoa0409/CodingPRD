scenario: |
  Generate task harder than expert level!

  2594. Oil and Gas Land Administration & Joint Interest Billing (exploration and production land
  department): lease inventory with expiration, extension, shut-in and continuous-development
  obligations, working interest and net revenue interest maintenance across wells and units, joint
  operating agreement election processing including authorization for expenditure responses and
  non-consent penalties, joint interest billing preparation with allocation of shared costs and
  overhead rates, partner audit rights and billing dispute resolution timelines, revenue
  distribution to interest owners with statutory payment deadlines, well transfer, assignment and
  preferential purchase rights, plugging obligation and bonding requirements
domain_name: oil-gas-land-administration-jib
api_prefix: /land-admin

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: graph
  # Wells and Leases form a many-to-many pooling graph through WellLeaseAllocation; Wells and
  # InterestOwners form a second many-to-many ownership graph through WellInterest; JibStatement
  # references itself through superseded_statement_id (revision chain).
  state_machine_shape: parallel
  # Lease carries two independent dimensions (tenure_status x obligation_status); Well carries two
  # independent dimensions (well_status x pooling_status); BillingDispute is cyclic
  # (OPEN -> OPERATOR_RESPONDED -> OPEN, round_count++); Afe and AssignmentTransfer are branching
  # fork-joins; JibStatement revision loops back to DRAFT through a superseding statement.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # The JointInterestAccountant who prepared a JibStatement (prepared_by_user_id) may not resolve a
  # BillingDispute filed against it; only an AuditReviewer whose X-User-ID differs from
  # prepared_by_user_id may. Partner-side actions are entity_backed on InterestOwner.
  consistency_model: immediate

entities:
  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: lease_number
        type: string
        source: input
        description: External lease identifier printed on the recorded instrument
        constraints: "unique across all Lease rows; 1-32 chars"
      - name: lessor_name
        type: string
        source: input
        description: Name of the mineral owner who granted the lease
      - name: gross_acres
        type: number
        source: input
        description: Gross acreage described in the lease
        constraints: "> 0; 2 decimal places"
      - name: royalty_rate
        type: number
        source: input
        description: Lessor royalty share of net proceeds allocated to this lease
        constraints: "0 < royalty_rate < 1; exactly 6 decimal places"
      - name: primary_term_end_date
        type: datetime
        source: input
        description: Last calendar date (ISO 8601 date, YYYY-MM-DD) on which the primary term is still running
      - name: extension_option_months
        type: integer
        source: input
        description: Number of months the primary term advances when the extension option is exercised
        default: 0
        constraints: ">= 0; <= 60"
      - name: extension_bonus_per_acre_cents
        type: integer
        source: input
        description: Bonus consideration per gross acre owed to the lessor when the extension is exercised
        default: 0
        constraints: ">= 0"
      - name: extension_exercised
        type: boolean
        source: system
        description: True once the extension option has been exercised; the option is single-use
        default: false
      - name: extension_bonus_paid_cents
        type: integer
        source: computed
        description: "round_half_up(gross_acres * extension_bonus_per_acre_cents) recorded when the extension is exercised, else 0"
        default: 0
      - name: shut_in_royalty_per_acre_cents
        type: integer
        source: input
        description: Shut-in royalty rate per gross acre owed for each shut-in maintenance period
        default: 0
        constraints: ">= 0"
      - name: shut_in_start_date
        type: datetime
        source: system
        description: Date the allocated well most recently entered SHUT_IN; null when no shut-in period is open
      - name: shut_in_payments_made
        type: integer
        source: system
        description: Count of shut-in royalty payments recorded against the current shut-in period chain
        default: 0
      - name: shut_in_next_due_date
        type: datetime
        source: computed
        description: "shut_in_start_date + 90 days for the first payment, then prior due date + 365 days per payment; null when shut_in_start_date is null"
      - name: continuous_dev_window_days
        type: integer
        source: input
        description: Days allowed between the end of one continuous-development operation and the start of the next
        default: 180
        constraints: ">= 30; <= 365"
      - name: last_operation_end_date
        type: datetime
        source: system
        description: End date of the most recently recorded CONTINUOUS_OPERATION obligation event; null when none recorded
      - name: continuous_dev_deadline
        type: datetime
        source: computed
        description: "last_operation_end_date + continuous_dev_window_days; null when last_operation_end_date is null"
      - name: tenure_status
        type: enum
        source: system
        description: Dimension 1 of the Lease parallel state machine - how the lease is currently held
        default: PRIMARY_TERM
        constraints: "PRIMARY_TERM | HELD_BY_PRODUCTION | SHUT_IN_HELD | CONTINUOUS_DEV_HELD | EXPIRED"
      - name: obligation_status
        type: enum
        source: system
        description: Dimension 2 of the Lease parallel state machine - compliance posture of the open obligation
        default: COMPLIANT
        constraints: "COMPLIANT | OBLIGATION_DUE | IN_BREACH | CURED"
      - name: committed_acres_total
        type: number
        source: computed
        description: Sum of WellLeaseAllocation.committed_acres for this lease where allocation_status == COMMITTED
        default: 0
      - name: held_acres
        type: number
        source: computed
        description: "Acreage the lease retains: min(gross_acres, committed_acres_total) when tenure_status != EXPIRED, else 0"
        default: 0

  - name: WellLeaseAllocation
    parent: Well
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the well (pooled unit) this tract commitment feeds"
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease whose acreage is committed to the well"
      - name: committed_acres
        type: number
        source: input
        description: Lease acreage committed to this well's pooled unit
        constraints: "> 0; <= Lease.gross_acres; 2 decimal places"
      - name: allocation_factor
        type: number
        source: computed
        description: This allocation's share of the well's pooled unit, per calculations.unit_allocation_factor
        default: 0
      - name: allocation_status
        type: enum
        source: system
        description: COMMITTED while the lease supports the unit; WITHDRAWN once the lease expires
        default: COMMITTED
        constraints: "COMMITTED | WITHDRAWN"
      - name: withdrawn_reason
        type: enum
        source: system
        description: Reason the allocation left the unit; null while allocation_status == COMMITTED
        constraints: "LEASE_EXPIRED"

  - name: Well
    parent: null
    common_fields: true
    fields:
      - name: well_name
        type: string
        source: input
        description: Operator's well name, also used as the JIB statement number prefix
        constraints: "unique across all Well rows; 1-32 chars"
      - name: api_number
        type: string
        source: input
        description: Regulatory API well number
      - name: product_type
        type: enum
        source: input
        description: Primary product sold from the well; drives severance tax rate and statutory payment window
        constraints: "OIL | GAS"
      - name: total_depth_ft
        type: integer
        source: input
        description: Total measured depth in feet; drives the plugging liability estimate
        constraints: "> 0; <= 30000"
      - name: spud_date
        type: datetime
        source: input
        description: Optional spud date supplied at well creation; the PROPOSED -> DRILLING transition overwrites it with the logical clock date, so it is null only while the well has never been supplied one and has not yet reached DRILLING
      - name: first_production_date
        type: datetime
        source: system
        description: Logical-clock date on which the well first transitioned to PRODUCING; null before that
      - name: shut_in_since
        type: datetime
        source: system
        description: Logical-clock date of the most recent transition to SHUT_IN; null when not shut in
      - name: well_status
        type: enum
        source: system
        description: Dimension 1 of the Well parallel state machine - operational lifecycle
        default: PROPOSED
        constraints: "PROPOSED | DRILLING | PRODUCING | SHUT_IN | TEMPORARILY_ABANDONED | PLUGGED"
      - name: pooling_status
        type: enum
        source: system
        description: Dimension 2 of the Well parallel state machine - pooled-unit formation lifecycle
        default: UNPOOLED
        constraints: "UNPOOLED | POOLED_FORMING | POOLED_EFFECTIVE | POOLED_TERMINATED"
      - name: allocation_factor_total
        type: number
        source: computed
        description: Sum of allocation_factor over WellLeaseAllocation rows with allocation_status == COMMITTED
        default: 0
      - name: consent_working_interest_pct
        type: number
        source: computed
        description: Sum of working_interest_pct over WellInterest rows with interest_status == ACTIVE and non_consent_flag == false
        default: 0
      - name: plugging_liability_cents
        type: integer
        source: computed
        description: Estimated plugging and abandonment cost per calculations.plugging_liability_estimate
        default: 0
      - name: billed_to_date_cents
        type: integer
        source: computed
        description: Running ledger - sum of total_billed_cents over JibStatement rows for this well whose statement_status is in {ISSUED, DISPUTED, SETTLED}; ADJUSTED and VOID statements leave the billed set
        default: 0

  - name: InterestOwner
    parent: null
    common_fields: true
    fields:
      - name: owner_name
        type: string
        source: input
        description: Legal name of the interest owner
      - name: owner_type
        type: enum
        source: input
        description: Class of interest the owner may hold
        constraints: "WORKING_INTEREST_PARTNER | ROYALTY_OWNER | OVERRIDING_ROYALTY_OWNER"
      - name: contact_email
        type: string
        source: input
        description: Notice address for AFE, audit and division-order correspondence
      - name: tax_id_on_file
        type: boolean
        source: input
        description: Whether a validated taxpayer identification number is on file; false forces revenue into suspense
        default: false
      - name: bond_posted_cents
        type: integer
        source: input
        description: Face amount of the plugging bond or letter of credit this owner has posted
        default: 0
        constraints: ">= 0"
      - name: audit_window_days
        type: integer
        source: input
        description: Contractual audit-rights window measured from JibStatement.issued_at
        default: 730
        constraints: ">= 90; <= 1460"
      - name: required_bond_cents
        type: integer
        source: computed
        description: Aggregate bonding requirement across the owner's wells per calculations.bond_coverage_requirement
        default: 0
      - name: suspense_balance_cents
        type: integer
        source: computed
        description: Sum of net_amount_cents over this owner's OwnerDisbursement rows with disbursement_status == SUSPENDED
        default: 0

  - name: WellInterest
    parent: Well
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the well this ownership record covers"
      - name: owner_id
        type: string
        source: input
        description: "FK -> InterestOwner.id; the owner holding the interest"
      - name: working_interest_pct
        type: number
        source: input
        description: Share of costs borne by this owner
        constraints: "> 0; <= 1; exactly 6 decimal places"
      - name: net_revenue_interest_pct
        type: number
        source: input
        description: Share of post-royalty net proceeds payable to this owner
        constraints: "> 0; <= 1; exactly 6 decimal places"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the ownership interval (half-open interval semantics)
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the ownership interval; null means open-ended
      - name: is_operator
        type: boolean
        source: input
        description: True for the single operating partner of the well; the operator is deemed to consent to every AFE
        default: false
      - name: preferential_right
        type: boolean
        source: input
        description: True when this owner holds a preferential purchase right over assignments on this well
        default: false
      - name: interest_status
        type: enum
        source: system
        description: ACTIVE while the interval governs, SUPERSEDED when an assignment splits it, TERMINATED when the owner's residual interest reaches zero
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED | TERMINATED"
      - name: non_consent_flag
        type: boolean
        source: system
        description: True once this owner has elected or been deemed NON_CONSENT on any AFE of the well that closed PARTIALLY_CONSENTED
        default: false
      - name: non_consent_recoverable_balance_cents
        type: integer
        source: system
        description: Outstanding penalty balance the operator recovers from this owner's revenue before disbursing it
        default: 0

  - name: Afe
    parent: Well
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the well whose operation is proposed"
      - name: afe_number
        type: string
        source: input
        description: Authorization-for-expenditure document number
        constraints: "unique across all Afe rows"
      - name: operation_type
        type: enum
        source: input
        description: Operation the AFE authorizes
        constraints: "DRILL | COMPLETION | WORKOVER | RECOMPLETION"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: Operator's estimate of the total operation cost
        constraints: "> 0"
      - name: cost_class
        type: enum
        source: input
        description: Whether the authorized spend is capital or operating; only CAPITAL spend carries a non-consent penalty multiple
        constraints: "CAPITAL | OPERATING"
      - name: election_deadline_date
        type: datetime
        source: input
        description: Last calendar date on which a partner may submit an election
      - name: non_consent_penalty_multiple
        type: number
        source: input
        description: Multiple of the non-consenting owner's capital share the operator may recover out of revenue
        default: 3.0
        constraints: ">= 1.0; <= 5.0; 1 decimal place"
      - name: minimum_consent_pct
        type: number
        source: input
        description: Minimum consenting working interest required for the operation to proceed
        default: 0.500000
        constraints: "> 0; <= 1; exactly 6 decimal places"
      - name: afe_status
        type: enum
        source: system
        description: Branching lifecycle - closing elections forks into one of three outcomes
        default: ELECTIONS_OPEN
        constraints: "ELECTIONS_OPEN | FULLY_CONSENTED | PARTIALLY_CONSENTED | FAILED"
      - name: consent_working_interest_pct
        type: number
        source: computed
        description: Consenting working interest tallied at election closure per calculations.afe_consent_tally
        default: 0
      - name: non_consent_working_interest_pct
        type: number
        source: computed
        description: "1.000000 - consent_working_interest_pct, tallied at election closure"
        default: 0
      - name: elections_closed_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which elections were closed; null while ELECTIONS_OPEN

  - name: AfeElection
    parent: Afe
    common_fields: true
    fields:
      - name: afe_id
        type: string
        source: input
        description: "FK -> Afe.id; the AFE being elected on"
      - name: owner_id
        type: string
        source: input
        description: "FK -> InterestOwner.id; the electing working-interest partner"
      - name: election_type
        type: enum
        source: input
        description: The partner's response to the AFE
        constraints: "CONSENT | NON_CONSENT"
      - name: election_status
        type: enum
        source: system
        description: SUBMITTED when the partner elected, DEEMED_NON_CONSENT when the closure cascade synthesized it, VOIDED when the AFE closed FAILED
        default: SUBMITTED
        constraints: "SUBMITTED | DEEMED_NON_CONSENT | VOIDED"
      - name: wi_pct_snapshot
        type: number
        source: system
        description: The owner's ACTIVE WellInterest.working_interest_pct captured when the election row was written
      - name: estimated_penalty_cents
        type: integer
        source: computed
        description: "For NON_CONSENT rows: round_half_up(Afe.non_consent_penalty_multiple * Afe.estimated_cost_cents * wi_pct_snapshot) when Afe.cost_class == CAPITAL, else 0; always 0 for CONSENT rows"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which the election row was written

  - name: CostEntry
    parent: Well
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the well the cost was incurred on"
      - name: afe_id
        type: string
        source: input
        description: "FK -> Afe.id; the AFE that authorized this cost, null for routine costs"
      - name: cost_category
        type: enum
        source: input
        description: Accounting category of the charge
        constraints: "DRILLING | COMPLETION | LEASE_OPERATING | WORKOVER | PLUGGING"
      - name: cost_class
        type: enum
        source: input
        description: CAPITAL costs are subject to non-consent reallocation and penalty recovery; OPERATING costs are not
        constraints: "CAPITAL | OPERATING"
      - name: amount_cents
        type: integer
        source: input
        description: Gross amount of the charge in cents
        constraints: "> 0"
      - name: incurred_date
        type: datetime
        source: input
        description: Date the cost was incurred; the inclusion key for cost_basis == ACCRUAL
      - name: paid_date
        type: datetime
        source: input
        description: Date the cost was settled with the vendor; the inclusion key for cost_basis == CASH; null while ACCRUED
      - name: cost_status
        type: enum
        source: system
        description: ACCRUED when recorded, PAID once settled
        default: ACCRUED
        constraints: "ACCRUED | PAID"

  - name: JibStatement
    parent: Well
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the well being billed"
      - name: superseded_statement_id
        type: string
        source: system
        description: "FK -> JibStatement.id; the statement this revision replaces, null for an original statement"
      - name: statement_number
        type: string
        source: input
        description: "Caller-supplied statement label, unique across all JibStatement rows of the same well_id; on the system-created superseding statement it is derived as <superseded statement_number>-R<count of prior JibStatement rows whose superseded_statement_id is set for this well, plus 1>"
        constraints: "1-32 chars; unique per well_id"
      - name: billing_period_start
        type: datetime
        source: input
        description: Inclusive first date of the billing period (closed interval semantics)
      - name: billing_period_end
        type: datetime
        source: input
        description: Inclusive last date of the billing period (closed interval semantics)
      - name: cost_basis
        type: enum
        source: input
        description: Variant selector for calculations.jib_direct_cost_pool
        constraints: "ACCRUAL | CASH"
      - name: activity_class
        type: enum
        source: input
        description: COPAS activity class driving the fixed overhead rate
        constraints: "DRILLING | PRODUCING"
      - name: overhead_rate_class
        type: enum
        source: input
        description: Overhead pricing mode per calculations.overhead_charge
        constraints: "FIXED_RATE | PERCENTAGE_BASIS"
      - name: capital_direct_cents
        type: integer
        source: computed
        description: Direct CAPITAL cost pool for the period per calculations.jib_direct_cost_pool
        default: 0
      - name: operating_direct_cents
        type: integer
        source: computed
        description: Direct OPERATING cost pool for the period per calculations.jib_direct_cost_pool
        default: 0
      - name: direct_cost_cents
        type: integer
        source: computed
        description: "capital_direct_cents + operating_direct_cents"
        default: 0
      - name: billable_months
        type: integer
        source: computed
        description: Count of distinct calendar months having at least one day inside the closed billing period
        default: 0
      - name: overhead_cents
        type: integer
        source: computed
        description: Overhead charge per calculations.overhead_charge
        default: 0
      - name: total_billed_cents
        type: integer
        source: computed
        description: "direct_cost_cents + overhead_cents; equals the sum of JibLineItem.total_billed_cents once issued"
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the JointInterestAccountant who created the DRAFT; the segregation-of-duties key
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock timestamp of issuance; null while DRAFT
      - name: payment_due_date
        type: datetime
        source: computed
        description: "issued_at + 30 days; null while DRAFT"
      - name: statement_status
        type: enum
        source: system
        description: Cyclic lifecycle - a DISPUTED statement resolved in the partner's favour becomes ADJUSTED and spawns a superseding DRAFT
        default: DRAFT
        constraints: "DRAFT | ISSUED | DISPUTED | ADJUSTED | SETTLED | VOID"

  - name: JibLineItem
    parent: JibStatement
    common_fields: false
    fields:
      - name: statement_id
        type: string
        source: input
        description: "FK -> JibStatement.id; the statement this owner row belongs to"
      - name: owner_id
        type: string
        source: input
        description: "FK -> InterestOwner.id; the billed working-interest partner"
      - name: wi_pct_snapshot
        type: number
        source: system
        description: The owner's ACTIVE WellInterest.working_interest_pct captured at issuance
      - name: consent_normalized_wi_pct
        type: number
        source: computed
        description: "For consenting owners: working_interest_pct / Afe-consent-weighted denominator per calculations.non_consent_reallocation; 0 for non-consenting owners"
        default: 0
      - name: direct_capital_cents
        type: integer
        source: computed
        description: Capital direct cost billed to this owner after non-consent reallocation
        default: 0
      - name: direct_operating_cents
        type: integer
        source: computed
        description: Operating direct cost billed to this owner (never reallocated)
        default: 0
      - name: overhead_cents
        type: integer
        source: computed
        description: This owner's share of JibStatement.overhead_cents per calculations.jib_owner_share_rounding
        default: 0
      - name: non_consent_reallocated_cents
        type: integer
        source: computed
        description: Extra AFE capital cost this consenting owner absorbed on behalf of non-consenting owners; 0 for non-consenting owners
        default: 0
      - name: non_consent_withheld_cents
        type: integer
        source: computed
        description: AFE capital cost this non-consenting owner was NOT billed; 0 for consenting owners
        default: 0
      - name: penalty_accrued_cents
        type: integer
        source: computed
        description: Penalty balance added to this owner's WellInterest.non_consent_recoverable_balance_cents at issuance
        default: 0
      - name: rounding_residual_cents
        type: integer
        source: computed
        description: Signed cent residual assigned to this row by calculations.jib_owner_share_rounding; 0 on every other row
        default: 0
      - name: total_billed_cents
        type: integer
        source: computed
        description: "direct_capital_cents + direct_operating_cents + overhead_cents"
        default: 0

  - name: BillingDispute
    parent: JibStatement
    common_fields: true
    fields:
      - name: statement_id
        type: string
        source: input
        description: "FK -> JibStatement.id; the statement being audited or disputed"
      - name: owner_id
        type: string
        source: input
        description: "FK -> InterestOwner.id; the partner exercising audit or dispute rights"
      - name: dispute_kind
        type: enum
        source: input
        description: AUDIT_EXCEPTION is raised out of an audit; BILLING_DISPUTE is raised off the face of the statement
        constraints: "AUDIT_EXCEPTION | BILLING_DISPUTE"
      - name: disputed_amount_cents
        type: integer
        source: input
        description: Amount of the owner's billed total placed in dispute
        constraints: "> 0"
      - name: basis_note
        type: string
        source: input
        description: Written basis for the exception, required by the joint operating agreement
        constraints: "1-500 chars"
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock timestamp at filing
      - name: response_due_date
        type: datetime
        source: computed
        description: "filed_at + 60 days; the operator's response deadline"
      - name: rebuttal_due_date
        type: datetime
        source: computed
        description: "response_due_date + 30 days; the partner's rebuttal deadline, recomputed as operator_responded_at + 30 days after each operator response"
      - name: operator_responded_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent OPERATOR_RESPONSE exchange; null before the first response
      - name: round_count
        type: integer
        source: system
        description: Number of completed response/rebuttal cycles; incremented on each PARTNER_REBUTTAL exchange
        default: 0
      - name: dispute_status
        type: enum
        source: system
        description: Cyclic lifecycle - OPEN and OPERATOR_RESPONDED alternate until resolution, escalation or expiry
        default: OPEN
        constraints: "OPEN | OPERATOR_RESPONDED | ESCALATED | RESOLVED_UPHELD | RESOLVED_ADJUSTED | EXPIRED"
      - name: adjustment_amount_cents
        type: integer
        source: system
        description: Credit granted at resolution; null until resolved, 0 when RESOLVED_UPHELD
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuditReviewer who resolved the dispute; null until resolved
      - name: deemed_in_favor_of_partner
        type: boolean
        source: system
        description: True when the operator missed response_due_date and the obligation run escalated the dispute
        default: false

  - name: ProductionRevenue
    parent: Well
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the well that produced the volumes"
      - name: production_month
        type: string
        source: input
        description: Production month in YYYY-MM form
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$; unique per well_id"
      - name: gross_revenue_cents
        type: integer
        source: input
        description: Gross sales proceeds for the month before taxes and royalty
        constraints: "> 0"
      - name: volume_units
        type: number
        source: input
        description: Sales volume in barrels (OIL) or MMBtu (GAS)
        constraints: "> 0"
      - name: sale_date
        type: datetime
        source: input
        description: Date the operator received the purchaser's proceeds
      - name: severance_tax_cents
        type: integer
        source: computed
        description: Severance tax withheld per calculations.revenue_distribution_waterfall
        default: 0
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: "gross_revenue_cents - severance_tax_cents"
        default: 0
      - name: total_royalty_cents
        type: integer
        source: computed
        description: Sum of lessor royalty withheld across the well's committed leases
        default: 0
      - name: total_disbursed_cents
        type: integer
        source: computed
        description: Sum of gross_share_cents over the OwnerDisbursement rows created at release
        default: 0
      - name: statutory_due_date
        type: datetime
        source: computed
        description: "Last calendar day of production_month + 60 days when Well.product_type == OIL, + 90 days when GAS"
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock timestamp of release; null while ACCRUED
      - name: distribution_status
        type: enum
        source: system
        description: ACCRUED until released; SUSPENDED when the well's pooled unit terminated before release
        default: ACCRUED
        constraints: "ACCRUED | RELEASED | SUSPENDED"

  - name: OwnerDisbursement
    parent: ProductionRevenue
    common_fields: true
    fields:
      - name: revenue_id
        type: string
        source: input
        description: "FK -> ProductionRevenue.id; the well-month distribution this row belongs to"
      - name: owner_id
        type: string
        source: input
        description: "FK -> InterestOwner.id; the payee"
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the committed lease whose allocated pool funded this row"
      - name: gross_share_cents
        type: integer
        source: computed
        description: The owner's post-royalty share of this lease's allocated pool per calculations.revenue_distribution_waterfall
        default: 0
      - name: withheld_recovery_cents
        type: integer
        source: computed
        description: Portion of gross_share_cents applied against WellInterest.non_consent_recoverable_balance_cents
        default: 0
      - name: net_amount_cents
        type: integer
        source: computed
        description: "gross_share_cents - withheld_recovery_cents"
        default: 0
      - name: late_interest_cents
        type: integer
        source: computed
        description: Statutory late-payment interest computed at payment time per calculations.statutory_late_interest
        default: 0
      - name: interest_basis
        type: enum
        source: system
        description: Which accrual start the statutory interest used; null until paid
        constraints: "FROM_DUE_DATE | FROM_PROCEEDS_RECEIPT"
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock timestamp of payment; null until paid
      - name: suspense_reason
        type: enum
        source: system
        description: Why the row is held; null when disbursement_status != SUSPENDED
        constraints: "MISSING_TAX_ID | NON_CONSENT_RECOVERY | POOLING_TERMINATED"
      - name: disbursement_status
        type: enum
        source: system
        description: ACCRUED when payable, SUSPENDED when held, PAID once disbursed
        default: ACCRUED
        constraints: "ACCRUED | SUSPENDED | PAID"

  - name: AssignmentTransfer
    parent: Well
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the well whose working interest is being assigned"
      - name: assignor_owner_id
        type: string
        source: input
        description: "FK -> InterestOwner.id; the selling partner"
      - name: assignee_owner_id
        type: string
        source: input
        description: "FK -> InterestOwner.id; the proposed buyer named in the notice"
      - name: ppr_holder_owner_id
        type: string
        source: system
        description: "FK -> InterestOwner.id; the preferential-right holder who exercised, null unless transfer_status == PPR_EXERCISED or the transfer closed to a preferential-right holder"
      - name: transfer_wi_pct
        type: number
        source: input
        description: Working interest percentage being conveyed
        constraints: "> 0; <= 1; exactly 6 decimal places"
      - name: transfer_nri_pct
        type: number
        source: input
        description: Net revenue interest percentage being conveyed
        constraints: "> 0; <= 1; exactly 6 decimal places"
      - name: sale_price_cents
        type: integer
        source: input
        description: Consideration named in the preferential-purchase-right notice
        constraints: "> 0"
      - name: notice_date
        type: datetime
        source: input
        description: Calendar date the notice was circulated; supplied in the notice body and used to compute ppr_deadline_date
      - name: ppr_deadline_date
        type: datetime
        source: computed
        description: "notice_date + 30 days; last date on which a preferential right may be exercised"
      - name: ppr_eligible_count
        type: integer
        source: computed
        description: Count of WellInterest rows on the well with interest_status == ACTIVE and preferential_right == true whose owner_id is neither assignor_owner_id nor assignee_owner_id, snapshotted at creation
        default: 0
      - name: ppr_waiver_count
        type: integer
        source: system
        description: Number of distinct eligible preferential-right holders that have submitted a WAIVE election on this transfer
        default: 0
      - name: bond_check_required_cents
        type: integer
        source: computed
        description: Bonding the closing assignee must have posted per calculations.bond_coverage_requirement, evaluated at closing
        default: 0
      - name: effective_date
        type: datetime
        source: input
        description: Agreed conveyance date named in the notice; must be >= notice_date, and is rewritten to the supplied closing_date when the transfer closes
      - name: transfer_status
        type: enum
        source: system
        description: Branching fork-join - the preferential-right branch and the waiver branch converge on CLOSED with divergent side effects
        default: NOTICED
        constraints: "NOTICED | PPR_EXERCISED | PPR_WAIVED | CLOSED"

state_machines:
  - entity: Lease
    dimension: tenure_status
    initial_state: PRIMARY_TERM
    terminal_states: [EXPIRED]
    transitions:
      - from: PRIMARY_TERM
        to: PRIMARY_TERM
        trigger: "POST /land-admin/leases/{lease_id}/extension"
        actor: LandAdministrator
        preconditions:
          - "tenure_status == PRIMARY_TERM"
          - "extension_exercised == false"
          - "extension_option_months > 0"
          - "logical clock date <= primary_term_end_date"
        side_effects:
          - "primary_term_end_date advances by extension_option_months calendar months, clamping the day-of-month to the last day of the target month"
          - "extension_exercised = true"
          - "extension_bonus_paid_cents = round_half_up(gross_acres * extension_bonus_per_acre_cents)"
          - "obligation_status moves OBLIGATION_DUE -> CURED when it was OBLIGATION_DUE (no change otherwise)"
          - "increments Lease.version by 1"
        note: "Self-loop; the option is single-use so a second call fails with ERR_EXTENSION_NOT_AVAILABLE."
      - from: PRIMARY_TERM
        to: HELD_BY_PRODUCTION
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "logical clock date > primary_term_end_date"
          - "at least one WellLeaseAllocation with allocation_status == COMMITTED references a Well with well_status == PRODUCING and pooling_status == POOLED_EFFECTIVE"
        side_effects:
          - "tenure_status = HELD_BY_PRODUCTION"
          - "held_acres recomputed as min(gross_acres, committed_acres_total)"
          - "obligation_status = COMPLIANT"
      - from: PRIMARY_TERM
        to: SHUT_IN_HELD
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "logical clock date > primary_term_end_date"
          - "at least one COMMITTED allocation references a Well with well_status == SHUT_IN and pooling_status == POOLED_EFFECTIVE"
          - "shut_in_payments_made >= 1 and logical clock date <= shut_in_next_due_date"
        side_effects:
          - "tenure_status = SHUT_IN_HELD"
          - "held_acres recomputed as min(gross_acres, committed_acres_total)"
      - from: PRIMARY_TERM
        to: SHUT_IN_HELD
        trigger: "POST /land-admin/leases/{lease_id}/obligation-events with event_type == SHUT_IN_PAYMENT"
        actor: LandAdministrator
        preconditions:
          - "tenure_status IN {PRIMARY_TERM, HELD_BY_PRODUCTION, SHUT_IN_HELD}"
          - "at least one COMMITTED allocation references a Well with well_status == SHUT_IN"
          - "shut_in_payments_made < MAX_SHUT_IN_PAYMENTS (2), else ERR_SHUT_IN_LIMIT_EXCEEDED"
        side_effects:
          - "shut_in_start_date = the supplied shut_in_start_date on the first payment only; later payments leave it alone"
          - "shut_in_payments_made += 1; shut_in_next_due_date recomputed per calculations.lease_obligation_deadlines"
          - "tenure_status = SHUT_IN_HELD"
          - "obligation_status = CURED only when it was OBLIGATION_DUE (the obligation dimension is otherwise untouched)"
          - "increments Lease.version by 1"
        note: "Self-loop on SHUT_IN_HELD for the second payment; this is the operator-driven counterpart of the system evaluation below."
      - from: PRIMARY_TERM
        to: EXPIRED
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "logical clock date > primary_term_end_date"
          - "no COMMITTED allocation references a Well with well_status == PRODUCING and pooling_status == POOLED_EFFECTIVE"
          - "not (well_status == SHUT_IN and shut_in_payments_made >= 1 and logical clock date <= shut_in_next_due_date)"
          - "continuous_dev_deadline is null or logical clock date > continuous_dev_deadline"
        side_effects:
          - "tenure_status = EXPIRED; obligation_status = IN_BREACH; held_acres = 0"
          - "CASCADE hop 1: every WellLeaseAllocation of this lease with allocation_status == COMMITTED becomes allocation_status = WITHDRAWN, withdrawn_reason = LEASE_EXPIRED"
          - "CASCADE hop 2 (caused by hop 1, not by the lease change): each affected Well recomputes allocation_factor over its remaining COMMITTED allocations per calculations.unit_allocation_factor, refreshes allocation_factor_total, and - when its remaining COMMITTED allocation count is below 2 - sets pooling_status = POOLED_TERMINATED"
          - "CASCADE hop 3 (caused by hop 2's POOLED_TERMINATED write): every ProductionRevenue of that well with distribution_status IN {ACCRUED, RELEASED} becomes distribution_status = SUSPENDED"
          - "CASCADE hop 4 (caused by hop 3): every OwnerDisbursement of those suspended revenues with disbursement_status == ACCRUED becomes disbursement_status = SUSPENDED, suspense_reason = POOLING_TERMINATED, and each affected InterestOwner.suspense_balance_cents is recomputed"
      - from: HELD_BY_PRODUCTION
        to: SHUT_IN_HELD
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "every COMMITTED allocation's Well has well_status == SHUT_IN"
          - "shut_in_payments_made >= 1 and logical clock date <= shut_in_next_due_date"
        side_effects:
          - "tenure_status = SHUT_IN_HELD"
      - from: SHUT_IN_HELD
        to: HELD_BY_PRODUCTION
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "at least one COMMITTED allocation references a Well with well_status == PRODUCING and pooling_status == POOLED_EFFECTIVE"
        side_effects:
          - "tenure_status = HELD_BY_PRODUCTION"
          - "shut_in_start_date = null; shut_in_payments_made = 0; shut_in_next_due_date = null (reset mechanism)"
          - "obligation_status = COMPLIANT"
      - from: SHUT_IN_HELD
        to: EXPIRED
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "logical clock date > shut_in_next_due_date"
          - "no COMMITTED allocation references a Well with well_status == PRODUCING"
        side_effects:
          - "tenure_status = EXPIRED; obligation_status = IN_BREACH; held_acres = 0"
          - "same four-hop cascade as PRIMARY_TERM -> EXPIRED"
        note: "Once shut_in_payments_made == 2 (MAX_SHUT_IN_PAYMENTS) no further payment can be recorded, so this transition is unavoidable at the third due date."
      - from: PRIMARY_TERM
        to: CONTINUOUS_DEV_HELD
        trigger: "POST /land-admin/leases/{lease_id}/obligation-events with event_type == CONTINUOUS_OPERATION"
        actor: LandAdministrator
        preconditions:
          - "tenure_status IN {PRIMARY_TERM, HELD_BY_PRODUCTION, CONTINUOUS_DEV_HELD}"
          - "event_date <= logical clock date"
        side_effects:
          - "last_operation_end_date = event_date; continuous_dev_deadline = event_date + continuous_dev_window_days"
          - "tenure_status = CONTINUOUS_DEV_HELD"
          - "obligation_status = CURED when it was OBLIGATION_DUE or IN_BREACH is not set, else unchanged"
      - from: CONTINUOUS_DEV_HELD
        to: CONTINUOUS_DEV_HELD
        trigger: "POST /land-admin/leases/{lease_id}/obligation-events with event_type == CONTINUOUS_OPERATION"
        actor: LandAdministrator
        preconditions:
          - "logical clock date <= continuous_dev_deadline"
        side_effects:
          - "last_operation_end_date = event_date; continuous_dev_deadline = event_date + continuous_dev_window_days (rolling reset)"
        note: "Cycle: each qualifying operation restarts the continuous-development window."
      - from: CONTINUOUS_DEV_HELD
        to: EXPIRED
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "logical clock date > continuous_dev_deadline"
          - "logical clock date > primary_term_end_date"
          - "no COMMITTED allocation references a Well with well_status == PRODUCING"
        side_effects:
          - "tenure_status = EXPIRED; obligation_status = IN_BREACH; held_acres = 0"
          - "same four-hop cascade as PRIMARY_TERM -> EXPIRED"
      - from: CONTINUOUS_DEV_HELD
        to: HELD_BY_PRODUCTION
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "at least one COMMITTED allocation references a Well with well_status == PRODUCING and pooling_status == POOLED_EFFECTIVE"
        side_effects:
          - "tenure_status = HELD_BY_PRODUCTION; obligation_status = COMPLIANT"

  - entity: Lease
    dimension: obligation_status
    initial_state: COMPLIANT
    terminal_states: [IN_BREACH]
    transitions:
      - from: COMPLIANT
        to: OBLIGATION_DUE
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "the lease has an open obligation date D_ob = coalesce(shut_in_next_due_date, continuous_dev_deadline)"
          - "logical clock date >= D_ob - 30 days (OBLIGATION_WARNING_DAYS) and logical clock date <= D_ob"
        side_effects:
          - "obligation_status = OBLIGATION_DUE"
        note: "When both shut_in_next_due_date and continuous_dev_deadline are non-null the earlier date wins; when they are equal shut_in_next_due_date wins."
      - from: OBLIGATION_DUE
        to: CURED
        trigger: "POST /land-admin/leases/{lease_id}/obligation-events"
        actor: LandAdministrator
        preconditions:
          - "obligation_status == OBLIGATION_DUE"
          - "tenure_status != EXPIRED"
        side_effects:
          - "obligation_status = CURED"
          - "for event_type == SHUT_IN_PAYMENT: shut_in_payments_made += 1 and shut_in_next_due_date advances by 365 days"
          - "for event_type == CONTINUOUS_OPERATION: last_operation_end_date = event_date and continuous_dev_deadline recomputed"
      - from: OBLIGATION_DUE
        to: IN_BREACH
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "logical clock date > D_ob (the obligation date that triggered OBLIGATION_DUE)"
        side_effects:
          - "obligation_status = IN_BREACH"
          - "tenure_status = EXPIRED via the tenure dimension's matching transition, with its four-hop cascade"
      - from: CURED
        to: COMPLIANT
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "no open obligation date within 30 days of the logical clock date"
        side_effects:
          - "obligation_status = COMPLIANT"
      - from: CURED
        to: OBLIGATION_DUE
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "the next obligation date is within 30 days of the logical clock date"
        side_effects:
          - "obligation_status = OBLIGATION_DUE"
        note: "Cycle COMPLIANT -> OBLIGATION_DUE -> CURED -> OBLIGATION_DUE runs once per shut-in anniversary."

  - entity: Well
    dimension: well_status
    initial_state: PROPOSED
    terminal_states: [PLUGGED]
    transitions:
      - from: PROPOSED
        to: DRILLING
        trigger: "POST /land-admin/wells/{well_id}/status-changes with to_status == DRILLING"
        actor: LandAdministrator
        preconditions:
          - "well_status == PROPOSED"
          - "pooling_status == POOLED_EFFECTIVE"
        side_effects:
          - "spud_date = logical clock date"
          - "increments Well.version by 1"
      - from: DRILLING
        to: PRODUCING
        trigger: "POST /land-admin/wells/{well_id}/status-changes with to_status == PRODUCING"
        actor: LandAdministrator
        preconditions:
          - "well_status == DRILLING"
          - "at least one WellInterest with interest_status == ACTIVE and is_operator == true exists on the well"
        side_effects:
          - "first_production_date = logical clock date when currently null"
          - "increments Well.version by 1"
      - from: PRODUCING
        to: SHUT_IN
        trigger: "POST /land-admin/wells/{well_id}/status-changes with to_status == SHUT_IN"
        actor: LandAdministrator
        preconditions:
          - "well_status == PRODUCING"
        side_effects:
          - "shut_in_since = logical clock date"
          - "CROSS-ENTITY: every Lease with a COMMITTED allocation to this well gets shut_in_start_date = logical clock date, shut_in_payments_made = 0, and shut_in_next_due_date = logical clock date + 90 days"
          - "increments Well.version by 1"
      - from: SHUT_IN
        to: PRODUCING
        trigger: "POST /land-admin/wells/{well_id}/status-changes with to_status == PRODUCING"
        actor: LandAdministrator
        preconditions:
          - "well_status == SHUT_IN"
        side_effects:
          - "shut_in_since = null"
          - "CROSS-ENTITY: every Lease with a COMMITTED allocation to this well gets shut_in_start_date = null, shut_in_payments_made = 0, shut_in_next_due_date = null"
          - "increments Well.version by 1"
        note: "Cycle PRODUCING -> SHUT_IN -> PRODUCING is unbounded."
      - from: PRODUCING
        to: TEMPORARILY_ABANDONED
        trigger: "POST /land-admin/wells/{well_id}/status-changes with to_status == TEMPORARILY_ABANDONED"
        actor: LandAdministrator
        preconditions:
          - "well_status IN {PRODUCING, SHUT_IN}"
        side_effects:
          - "increments Well.version by 1"
      - from: SHUT_IN
        to: TEMPORARILY_ABANDONED
        trigger: "POST /land-admin/wells/{well_id}/status-changes with to_status == TEMPORARILY_ABANDONED"
        actor: LandAdministrator
        preconditions:
          - "well_status IN {PRODUCING, SHUT_IN}"
        side_effects:
          - "increments Well.version by 1"
      - from: TEMPORARILY_ABANDONED
        to: PLUGGED
        trigger: "POST /land-admin/wells/{well_id}/status-changes with to_status == PLUGGED"
        actor: ComplianceOfficer
        preconditions:
          - "well_status == TEMPORARILY_ABANDONED"
          - "plugging_liability_cents is recomputed first per calculations.plugging_liability_estimate"
          - "for every WellInterest with interest_status == ACTIVE on this well, the owner satisfies InterestOwner.bond_posted_cents >= InterestOwner.required_bond_cents (boundary is inclusive)"
        side_effects:
          - "no further CostEntry, JibStatement or ProductionRevenue may be created for the well"
          - "plugging_liability_cents frozen at the value computed by this transition"
          - "increments Well.version by 1"

  - entity: Well
    dimension: pooling_status
    initial_state: UNPOOLED
    terminal_states: [POOLED_TERMINATED]
    transitions:
      - from: UNPOOLED
        to: POOLED_FORMING
        trigger: "POST /land-admin/wells/{well_id}/lease-allocations (first allocation)"
        actor: LandAdministrator
        preconditions:
          - "pooling_status == UNPOOLED"
          - "referenced Lease.tenure_status != EXPIRED"
        side_effects:
          - "WellLeaseAllocation created with allocation_status = COMMITTED"
          - "allocation_factor recomputed for every COMMITTED allocation per calculations.unit_allocation_factor"
          - "each referenced Lease.committed_acres_total and held_acres recomputed"
          - "increments Well.version by 1"
      - from: POOLED_FORMING
        to: POOLED_FORMING
        trigger: "POST /land-admin/wells/{well_id}/lease-allocations (subsequent allocations)"
        actor: LandAdministrator
        preconditions:
          - "pooling_status == POOLED_FORMING"
          - "no COMMITTED allocation for the same lease_id already exists on this well"
          - "referenced Lease.tenure_status != EXPIRED"
        side_effects:
          - "allocation_factor recomputed for every COMMITTED allocation; allocation_factor_total refreshed"
          - "increments Well.version by 1"
      - from: POOLED_FORMING
        to: POOLED_EFFECTIVE
        trigger: "POST /land-admin/wells/{well_id}/pooling-effectuation"
        actor: LandAdministrator
        preconditions:
          - "pooling_status == POOLED_FORMING"
          - "count of COMMITTED allocations >= 2"
          - "allocation_factor_total == 1.000000 exactly"
          - "every referenced Lease has tenure_status IN {PRIMARY_TERM, HELD_BY_PRODUCTION, SHUT_IN_HELD, CONTINUOUS_DEV_HELD} (i.e. not EXPIRED)"
        side_effects:
          - "pooling_status = POOLED_EFFECTIVE"
          - "increments Well.version by 1"
      - from: POOLED_EFFECTIVE
        to: POOLED_TERMINATED
        trigger: "system cascade hop 2 of the Lease EXPIRED transition"
        actor: system
        preconditions:
          - "count of COMMITTED allocations after the withdrawal cascade is below 2"
        side_effects:
          - "pooling_status = POOLED_TERMINATED"
          - "CASCADE hop 3: ProductionRevenue rows of this well with distribution_status IN {ACCRUED, RELEASED} become SUSPENDED"

  - entity: Afe
    initial_state: ELECTIONS_OPEN
    terminal_states: [FULLY_CONSENTED, PARTIALLY_CONSENTED, FAILED]
    transitions:
      - from: ELECTIONS_OPEN
        to: FULLY_CONSENTED
        trigger: "POST /land-admin/afes/{afe_id}/election-closures"
        actor: LandAdministrator
        preconditions:
          - "afe_status == ELECTIONS_OPEN"
          - "logical clock date > election_deadline_date OR every non-operator owner with an ACTIVE WellInterest has an AfeElection with election_status == SUBMITTED"
          - "consent_working_interest_pct computed by calculations.afe_consent_tally == 1.000000"
        side_effects:
          - "afe_status = FULLY_CONSENTED; elections_closed_at = logical clock timestamp; consent/non-consent tallies written"
          - "Well.consent_working_interest_pct recomputed"
      - from: ELECTIONS_OPEN
        to: PARTIALLY_CONSENTED
        trigger: "POST /land-admin/afes/{afe_id}/election-closures"
        actor: LandAdministrator
        preconditions:
          - "afe_status == ELECTIONS_OPEN"
          - "logical clock date > election_deadline_date OR every non-operator owner with an ACTIVE WellInterest has an AfeElection with election_status == SUBMITTED"
          - "minimum_consent_pct <= consent_working_interest_pct < 1.000000"
        side_effects:
          - "afe_status = PARTIALLY_CONSENTED; elections_closed_at set; consent/non-consent tallies written"
          - "CASCADE hop 1: for every NON-OPERATOR owner with an ACTIVE WellInterest on the well and no AfeElection row, a synthesized AfeElection is written with election_type = NON_CONSENT, election_status = DEEMED_NON_CONSENT, wi_pct_snapshot = that owner's ACTIVE working_interest_pct, submitted_at = logical clock timestamp, estimated_penalty_cents per its formula"
          - "CASCADE hop 2 (caused by hop 1's election rows, both SUBMITTED NON_CONSENT and DEEMED_NON_CONSENT): each such owner's ACTIVE WellInterest gets non_consent_flag = true"
          - "CASCADE hop 3 (caused by hop 2's non_consent_flag write): Well.consent_working_interest_pct recomputed as the sum of working_interest_pct over ACTIVE interests with non_consent_flag == false"
          - "CASCADE hop 4 (caused by hop 2's non_consent_flag write on the owner's interest): every OwnerDisbursement of that owner on this well with disbursement_status == ACCRUED becomes SUSPENDED with suspense_reason = NON_CONSENT_RECOVERY, and InterestOwner.suspense_balance_cents is recomputed"
      - from: ELECTIONS_OPEN
        to: FAILED
        trigger: "POST /land-admin/afes/{afe_id}/election-closures"
        actor: LandAdministrator
        preconditions:
          - "afe_status == ELECTIONS_OPEN"
          - "logical clock date > election_deadline_date OR every non-operator owner with an ACTIVE WellInterest has an AfeElection with election_status == SUBMITTED"
          - "consent_working_interest_pct < minimum_consent_pct"
        side_effects:
          - "afe_status = FAILED; elections_closed_at set"
          - "every AfeElection of this AFE becomes election_status = VOIDED"
          - "no non_consent_flag is set and no penalty balance accrues (divergent branch side-effect set)"

  - entity: AfeElection
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: DEEMED_NON_CONSENT
        trigger: "system cascade hop 1 of the Afe ELECTIONS_OPEN -> PARTIALLY_CONSENTED transition (synthesized rows are written directly in DEEMED_NON_CONSENT)"
        actor: system
        preconditions:
          - "the owner has an ACTIVE WellInterest on the AFE's well and no AfeElection row for this AFE"
        side_effects:
          - "election_type = NON_CONSENT; estimated_penalty_cents computed; wi_pct_snapshot captured"
        note: "This row is created, not transitioned, by the cascade; the pair is listed so the DEEMED_NON_CONSENT value has a declared producer."
      - from: SUBMITTED
        to: VOIDED
        trigger: "system side effect of the Afe ELECTIONS_OPEN -> FAILED transition"
        actor: system
        preconditions:
          - "Afe.afe_status becomes FAILED"
        side_effects:
          - "election_status = VOIDED; estimated_penalty_cents = 0"
      - from: DEEMED_NON_CONSENT
        to: VOIDED
        trigger: "system side effect of the Afe ELECTIONS_OPEN -> FAILED transition"
        actor: system
        preconditions:
          - "Afe.afe_status becomes FAILED"
        side_effects:
          - "election_status = VOIDED; estimated_penalty_cents = 0"

  - entity: JibStatement
    initial_state: DRAFT
    terminal_states: [SETTLED, ADJUSTED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /land-admin/jib-statements/{statement_id}/issuance"
        actor: JointInterestAccountant
        preconditions:
          - "statement_status == DRAFT"
          - "Well.well_status != PROPOSED and Well.well_status != PLUGGED"
          - "Well.pooling_status == POOLED_EFFECTIVE"
          - "the closed interval [billing_period_start, billing_period_end] does not intersect the closed interval of any other JibStatement of the same well whose statement_status IN {ISSUED, DISPUTED, SETTLED}"
          - "the direct cost pool selected by calculations.jib_direct_cost_pool is non-empty"
          - "activity_class == DRILLING requires Well.well_status == DRILLING; activity_class == PRODUCING requires Well.well_status IN {PRODUCING, SHUT_IN, TEMPORARILY_ABANDONED}"
        side_effects:
          - "capital_direct_cents, operating_direct_cents, direct_cost_cents recomputed per calculations.jib_direct_cost_pool"
          - "billable_months and overhead_cents recomputed per calculations.overhead_charge"
          - "one immutable JibLineItem per owner holding an ACTIVE WellInterest on the well, per calculations.non_consent_reallocation then calculations.jib_owner_share_rounding"
          - "total_billed_cents = direct_cost_cents + overhead_cents and equals the sum of JibLineItem.total_billed_cents"
          - "for each non-consenting owner: WellInterest.non_consent_recoverable_balance_cents += JibLineItem.penalty_accrued_cents"
          - "Well.billed_to_date_cents += total_billed_cents"
          - "issued_at = logical clock timestamp; payment_due_date = issued_at + 30 days"
          - "increments JibStatement.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /land-admin/jib-statements/{statement_id}/disputes"
        actor: PartnerRepresentative
        preconditions:
          - "statement_status == ISSUED"
          - "logical clock date <= issued_at + InterestOwner.audit_window_days (inclusive boundary)"
          - "disputed_amount_cents <= the filing owner's JibLineItem.total_billed_cents"
        side_effects:
          - "BillingDispute created in dispute_status = OPEN with filed_at = logical clock timestamp, response_due_date = filed_at + 60 days"
          - "statement_status = DISPUTED (Well.billed_to_date_cents unchanged, DISPUTED remains a billed status)"
          - "increments JibStatement.version by 1"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /land-admin/disputes/{dispute_id}/resolution with outcome == UPHELD"
        actor: AuditReviewer
        preconditions:
          - "no other BillingDispute on this statement has dispute_status IN {OPEN, OPERATOR_RESPONDED, ESCALATED}"
        side_effects:
          - "statement_status = ISSUED (cycle back); no ledger change"
          - "increments JibStatement.version by 1"
        note: "Cycle ISSUED -> DISPUTED -> ISSUED may repeat for each partner that files within the audit window."
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /land-admin/disputes/{dispute_id}/resolution with outcome == ADJUSTED"
        actor: AuditReviewer
        preconditions:
          - "statement_status == DISPUTED"
          - "adjustment_amount_cents > 0 and adjustment_amount_cents <= BillingDispute.disputed_amount_cents"
        side_effects:
          - "statement_status = ADJUSTED"
          - "CASCADE hop 1: Well.billed_to_date_cents -= total_billed_cents (ADJUSTED leaves the billed set)"
          - "CASCADE hop 2 (caused by hop 1's de-billing): a superseding JibStatement is created in DRAFT with superseded_statement_id = this statement's id, the same well_id, billing period, cost_basis, activity_class and overhead_rate_class, prepared_by_user_id = the resolving AuditReviewer's X-User-ID, and statement_number = the adjusted statement's statement_number suffixed with -R<count of existing JibStatement rows on this well whose superseded_statement_id is not null, plus 1>"
          - "CASCADE hop 3 (caused by hop 2's new DRAFT existing): every other BillingDispute on the original statement with dispute_status IN {OPEN, OPERATOR_RESPONDED, ESCALATED} is closed as dispute_status = EXPIRED with deemed_in_favor_of_partner = true, because the bill they contested no longer exists"
          - "increments JibStatement.version by 1"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "statement_status == ISSUED"
          - "logical clock date > payment_due_date"
          - "no BillingDispute on this statement has dispute_status IN {OPEN, OPERATOR_RESPONDED, ESCALATED}"
        side_effects:
          - "statement_status = SETTLED (stays inside Well.billed_to_date_cents)"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /land-admin/jib-statements/{statement_id}/settlement"
        actor: JointInterestAccountant
        preconditions:
          - "statement_status == ISSUED"
          - "no BillingDispute on this statement has dispute_status IN {OPEN, OPERATOR_RESPONDED, ESCALATED}"
          - "settled_on <= the logical clock date"
        side_effects:
          - "statement_status = SETTLED (stays inside Well.billed_to_date_cents)"
          - "increments JibStatement.version by 1"
        note: "The operator-driven path: cash may arrive before payment_due_date, so no due-date precondition applies here. The system evaluation above is the deemed-settlement path for bills nobody contested."
      - from: ISSUED
        to: ADJUSTED
        trigger: "POST /land-admin/jib-statements/{statement_id}/revisions"
        actor: JointInterestAccountant
        preconditions:
          - "statement_status IN {DRAFT, ISSUED}"
          - "expected_jib_statement_version matches the statement's current version"
        side_effects:
          - "statement_status = ADJUSTED (the addressed bill leaves the billed set but its line items are retained for audit)"
          - "Well.billed_to_date_cents -= total_billed_cents when the addressed statement was ISSUED (no change when it was DRAFT) and Well.version incremented by 1"
          - "for each JibLineItem of the addressed statement with penalty_accrued_cents > 0: the owner's WellInterest.non_consent_recoverable_balance_cents -= (its withheld share + penalty_accrued_cents) (compensating reversal)"
          - "a superseding JibStatement is created in DRAFT with superseded_statement_id = this statement's id, the same billing period, and the overrides supplied in the request body"
          - "increments JibStatement.version by 1"
        note: "The revision path supersedes a bill with a corrected one. The void path below discards a bill without replacing it."
      - from: ISSUED
        to: VOID
        trigger: "POST /land-admin/jib-statements/{statement_id}/void"
        actor: JointInterestAccountant
        preconditions:
          - "statement_status IN {DRAFT, ISSUED}"
        side_effects:
          - "statement_status = VOID"
          - "Well.billed_to_date_cents -= total_billed_cents because the voided statement was ISSUED, and Well.version incremented by 1"
          - "for each JibLineItem of the voided statement with penalty_accrued_cents > 0: the owner's WellInterest.non_consent_recoverable_balance_cents -= (its withheld share + penalty_accrued_cents) (compensating reversal)"
          - "no superseding statement is created; the period is freed because VOID statements are excluded from the period-overlap check"
          - "increments JibStatement.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /land-admin/jib-statements/{statement_id}/void"
        actor: JointInterestAccountant
        preconditions:
          - "statement_status == DRAFT"
        side_effects:
          - "statement_status = VOID; no ledger change because a DRAFT was never counted in Well.billed_to_date_cents"
          - "no superseding statement is created"
          - "increments JibStatement.version by 1"
      - from: DRAFT
        to: ADJUSTED
        trigger: "POST /land-admin/jib-statements/{statement_id}/revisions"
        actor: JointInterestAccountant
        preconditions:
          - "statement_status == DRAFT"
          - "expected_jib_statement_version matches the statement's current version"
        side_effects:
          - "statement_status = ADJUSTED; no ledger change because a DRAFT was never counted in Well.billed_to_date_cents"
          - "a superseding JibStatement is created in DRAFT with superseded_statement_id = this statement's id"
          - "increments JibStatement.version by 1"

  - entity: BillingDispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_ADJUSTED, EXPIRED]
    transitions:
      - from: OPEN
        to: OPERATOR_RESPONDED
        trigger: "POST /land-admin/disputes/{dispute_id}/exchanges with exchange_type == OPERATOR_RESPONSE"
        actor: JointInterestAccountant
        preconditions:
          - "dispute_status == OPEN"
          - "logical clock date <= response_due_date"
        side_effects:
          - "dispute_status = OPERATOR_RESPONDED; operator_responded_at = logical clock timestamp; rebuttal_due_date = operator_responded_at + 30 days"
          - "increments BillingDispute.version by 1"
      - from: OPERATOR_RESPONDED
        to: OPEN
        trigger: "POST /land-admin/disputes/{dispute_id}/exchanges with exchange_type == PARTNER_REBUTTAL"
        actor: PartnerRepresentative
        preconditions:
          - "dispute_status == OPERATOR_RESPONDED"
          - "logical clock date <= rebuttal_due_date"
          - "round_count < 2 (MAX_DISPUTE_ROUNDS)"
        side_effects:
          - "dispute_status = OPEN; round_count += 1; response_due_date = logical clock date + 60 days"
          - "increments BillingDispute.version by 1"
        note: "Cycle OPEN -> OPERATOR_RESPONDED -> OPEN; the third rebuttal is rejected with ERR_MAX_DISPUTE_ROUNDS_EXCEEDED."
      - from: OPERATOR_RESPONDED
        to: ESCALATED
        trigger: "POST /land-admin/disputes/{dispute_id}/exchanges with exchange_type == PARTNER_ESCALATION"
        actor: PartnerRepresentative
        preconditions:
          - "dispute_status == OPERATOR_RESPONDED"
          - "logical clock date <= rebuttal_due_date"
        side_effects:
          - "dispute_status = ESCALATED"
          - "increments BillingDispute.version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "dispute_status == OPEN"
          - "logical clock date > response_due_date"
        side_effects:
          - "dispute_status = ESCALATED; deemed_in_favor_of_partner = true"
      - from: OPERATOR_RESPONDED
        to: EXPIRED
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "dispute_status == OPERATOR_RESPONDED"
          - "logical clock date > rebuttal_due_date"
        side_effects:
          - "dispute_status = EXPIRED; adjustment_amount_cents = 0"
          - "the parent JibStatement returns from DISPUTED to ISSUED when no other dispute on it is still in {OPEN, OPERATOR_RESPONDED, ESCALATED}"
      - from: OPERATOR_RESPONDED
        to: RESOLVED_UPHELD
        trigger: "POST /land-admin/disputes/{dispute_id}/resolution with outcome == UPHELD"
        actor: AuditReviewer
        preconditions:
          - "dispute_status IN {OPERATOR_RESPONDED, ESCALATED}"
          - "X-User-ID != JibStatement.prepared_by_user_id (segregation of duties)"
        side_effects:
          - "dispute_status = RESOLVED_UPHELD; adjustment_amount_cents = 0; resolved_by_user_id = X-User-ID"
          - "parent JibStatement DISPUTED -> ISSUED"
      - from: ESCALATED
        to: RESOLVED_UPHELD
        trigger: "POST /land-admin/disputes/{dispute_id}/resolution with outcome == UPHELD"
        actor: AuditReviewer
        preconditions:
          - "dispute_status IN {OPERATOR_RESPONDED, ESCALATED}"
          - "deemed_in_favor_of_partner == false"
          - "X-User-ID != JibStatement.prepared_by_user_id"
        side_effects:
          - "dispute_status = RESOLVED_UPHELD; adjustment_amount_cents = 0; resolved_by_user_id = X-User-ID"
          - "parent JibStatement DISPUTED -> ISSUED"
        note: "A dispute escalated by the obligation run carries deemed_in_favor_of_partner == true and therefore cannot be upheld; it may only be resolved ADJUSTED."
      - from: OPERATOR_RESPONDED
        to: RESOLVED_ADJUSTED
        trigger: "POST /land-admin/disputes/{dispute_id}/resolution with outcome == ADJUSTED"
        actor: AuditReviewer
        preconditions:
          - "dispute_status IN {OPERATOR_RESPONDED, ESCALATED}"
          - "0 < adjustment_amount_cents <= disputed_amount_cents"
          - "X-User-ID != JibStatement.prepared_by_user_id"
        side_effects:
          - "dispute_status = RESOLVED_ADJUSTED; adjustment_amount_cents recorded; resolved_by_user_id = X-User-ID"
          - "parent JibStatement DISPUTED -> ADJUSTED with its three-hop cascade"
      - from: ESCALATED
        to: RESOLVED_ADJUSTED
        trigger: "POST /land-admin/disputes/{dispute_id}/resolution with outcome == ADJUSTED"
        actor: AuditReviewer
        preconditions:
          - "dispute_status IN {OPERATOR_RESPONDED, ESCALATED}"
          - "0 < adjustment_amount_cents <= disputed_amount_cents"
          - "X-User-ID != JibStatement.prepared_by_user_id"
        side_effects:
          - "dispute_status = RESOLVED_ADJUSTED; adjustment_amount_cents recorded; resolved_by_user_id = X-User-ID"
          - "parent JibStatement DISPUTED -> ADJUSTED with its three-hop cascade"

  - entity: WellInterest
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /land-admin/assignment-transfers/{transfer_id}/closing"
        actor: LandAdministrator
        preconditions:
          - "interest_status == ACTIVE"
          - "the row belongs to the transfer's assignor, or to the closing grantee (assignee_owner_id on the waiver branch, ppr_holder_owner_id on the preferential-right branch) when that grantee already holds an ACTIVE interest on the well"
          - "working_interest_pct - transfer_wi_pct > 0 for the assignor row"
        side_effects:
          - "interest_status = SUPERSEDED; effective_to = logical clock date (exclusive end)"
          - "a replacement ACTIVE WellInterest is created with effective_from = the same logical clock date (half-open adjacency, no overlap)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /land-admin/assignment-transfers/{transfer_id}/closing"
        actor: LandAdministrator
        preconditions:
          - "interest_status == ACTIVE"
          - "the row belongs to the transfer's assignor"
          - "working_interest_pct - transfer_wi_pct == 0 (the assignor conveys its entire interest)"
        side_effects:
          - "interest_status = TERMINATED; effective_to = logical clock date; no replacement row is created"
          - "non_consent_recoverable_balance_cents is carried to the assignee's new ACTIVE row (conserved, never dropped)"

  - entity: ProductionRevenue
    initial_state: ACCRUED
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACCRUED
        to: RELEASED
        trigger: "POST /land-admin/production-revenues/{revenue_id}/release"
        actor: JointInterestAccountant
        preconditions:
          - "distribution_status == ACCRUED"
          - "Well.pooling_status == POOLED_EFFECTIVE"
          - "Well.allocation_factor_total == 1.000000"
          - "the well has at least one ACTIVE WellInterest (the normalized net revenue interests then sum to exactly 1.000000 by construction)"
        side_effects:
          - "severance_tax_cents, net_proceeds_cents, total_royalty_cents computed per calculations.revenue_distribution_waterfall"
          - "one OwnerDisbursement per (COMMITTED allocation lease, ACTIVE interest owner) pair, with gross_share_cents, withheld_recovery_cents and net_amount_cents set"
          - "for each owner with a positive WellInterest.non_consent_recoverable_balance_cents: the balance is reduced by the withheld amount"
          - "total_disbursed_cents = sum of the created rows' gross_share_cents"
          - "distribution_status = RELEASED; released_at = logical clock timestamp"
          - "increments ProductionRevenue.version by 1"
      - from: ACCRUED
        to: SUSPENDED
        trigger: "system cascade hop 3 of the Lease EXPIRED transition (through Well POOLED_TERMINATED)"
        actor: system
        preconditions:
          - "distribution_status == ACCRUED"
          - "Well.pooling_status became POOLED_TERMINATED"
        side_effects:
          - "distribution_status = SUSPENDED"
          - "no OwnerDisbursement exists yet on an ACCRUED month, so hop 4 is a no-op on this branch"
      - from: RELEASED
        to: SUSPENDED
        trigger: "system cascade hop 3 of the Lease EXPIRED transition (through Well POOLED_TERMINATED)"
        actor: system
        preconditions:
          - "distribution_status == RELEASED"
          - "Well.pooling_status became POOLED_TERMINATED"
        side_effects:
          - "distribution_status = SUSPENDED; the computed waterfall totals are retained for audit"
          - "CASCADE hop 4 (caused by hop 3): every OwnerDisbursement of this revenue with disbursement_status == ACCRUED becomes SUSPENDED with suspense_reason = POOLING_TERMINATED, and each affected InterestOwner.suspense_balance_cents is recomputed"
        note: "RELEASED is deliberately non-terminal: an expired lease retroactively suspends money that was computed but not yet paid. Rows already PAID are untouched."

  - entity: OwnerDisbursement
    initial_state: ACCRUED
    terminal_states: [PAID]
    transitions:
      - from: ACCRUED
        to: SUSPENDED
        trigger: "system, applied atomically inside POST /land-admin/production-revenues/{revenue_id}/release"
        actor: system
        preconditions:
          - "InterestOwner.tax_id_on_file == false, OR net_amount_cents == 0 because the entire gross share was withheld for non-consent recovery"
        side_effects:
          - "disbursement_status = SUSPENDED; suspense_reason = MISSING_TAX_ID when the tax id is absent, otherwise NON_CONSENT_RECOVERY"
          - "InterestOwner.suspense_balance_cents recomputed"
        note: "MISSING_TAX_ID wins when both conditions hold."
      - from: SUSPENDED
        to: ACCRUED
        trigger: "POST /land-admin/interest-owners/{owner_id}/compliance-updates with tax_id_on_file == true"
        actor: ComplianceOfficer
        preconditions:
          - "disbursement_status == SUSPENDED and suspense_reason == MISSING_TAX_ID"
        side_effects:
          - "disbursement_status = ACCRUED; suspense_reason = null"
          - "InterestOwner.suspense_balance_cents recomputed"
      - from: ACCRUED
        to: PAID
        trigger: "POST /land-admin/owner-disbursements/{disbursement_id}/payment"
        actor: JointInterestAccountant
        preconditions:
          - "disbursement_status == ACCRUED"
          - "net_amount_cents > 0"
        side_effects:
          - "late_interest_cents computed per calculations.statutory_late_interest using the selected interest_basis variant"
          - "interest_basis recorded; paid_at = logical clock timestamp; disbursement_status = PAID"
          - "increments OwnerDisbursement.version by 1"

  - entity: AssignmentTransfer
    initial_state: NOTICED
    terminal_states: [CLOSED]
    transitions:
      - from: NOTICED
        to: PPR_EXERCISED
        trigger: "POST /land-admin/assignment-transfers/{transfer_id}/ppr-elections with election == EXERCISE"
        actor: PartnerRepresentative
        preconditions:
          - "transfer_status == NOTICED"
          - "logical clock date <= ppr_deadline_date"
          - "the electing owner holds an ACTIVE WellInterest on the well with preferential_right == true and is neither the assignor nor the named assignee"
        side_effects:
          - "transfer_status = PPR_EXERCISED; ppr_holder_owner_id = the electing owner's id"
          - "increments AssignmentTransfer.version by 1"
      - from: NOTICED
        to: PPR_WAIVED
        trigger: "POST /land-admin/assignment-transfers/{transfer_id}/ppr-elections with election == WAIVE (final eligible holder) or POST /land-admin/assignment-transfers at creation time when ppr_eligible_count == 0"
        actor: PartnerRepresentative
        preconditions:
          - "transfer_status == NOTICED"
          - "logical clock date <= ppr_deadline_date"
          - "ppr_waiver_count + 1 == ppr_eligible_count, i.e. this is the last eligible holder to waive"
        side_effects:
          - "ppr_waiver_count += 1; transfer_status = PPR_WAIVED"
          - "increments AssignmentTransfer.version by 1"
        note: "When ppr_eligible_count == 0 the transfer is created directly in PPR_WAIVED (empty candidate pool fallback)."
      - from: NOTICED
        to: NOTICED
        trigger: "POST /land-admin/assignment-transfers/{transfer_id}/ppr-elections with election == WAIVE (not the last eligible holder)"
        actor: PartnerRepresentative
        preconditions:
          - "transfer_status == NOTICED"
          - "logical clock date <= ppr_deadline_date"
          - "ppr_waiver_count + 1 < ppr_eligible_count"
          - "this owner has not already submitted an election on this transfer"
        side_effects:
          - "ppr_waiver_count += 1; transfer_status unchanged"
          - "increments AssignmentTransfer.version by 1"
      - from: NOTICED
        to: PPR_WAIVED
        trigger: "POST /land-admin/obligation-runs (system evaluation)"
        actor: system
        preconditions:
          - "transfer_status == NOTICED"
          - "logical clock date > ppr_deadline_date"
        side_effects:
          - "transfer_status = PPR_WAIVED (deemed waiver by silence); ppr_holder_owner_id stays null"
      - from: PPR_WAIVED
        to: CLOSED
        trigger: "POST /land-admin/assignment-transfers/{transfer_id}/closing"
        actor: LandAdministrator
        preconditions:
          - "transfer_status IN {PPR_WAIVED, PPR_EXERCISED}"
          - "the closing grantee (assignee_owner_id on this branch) has owner_type == WORKING_INTEREST_PARTNER"
          - "the closing grantee satisfies bond_posted_cents >= bond_check_required_cents (inclusive boundary)"
          - "the assignor's ACTIVE WellInterest.working_interest_pct >= transfer_wi_pct and net_revenue_interest_pct >= transfer_nri_pct"
        side_effects:
          - "WAIVER BRANCH: the grantee is assignee_owner_id"
          - "assignor's ACTIVE WellInterest becomes SUPERSEDED (or TERMINATED at a full conveyance) with effective_to = closing_date"
          - "a replacement ACTIVE row for the assignor is created with working_interest_pct -= transfer_wi_pct and net_revenue_interest_pct -= transfer_nri_pct, effective_from = closing_date, is_operator and preferential_right copied"
          - "the grantee's existing ACTIVE row (if any) is SUPERSEDED and re-created with the transferred percentages added; otherwise a new ACTIVE row is created with exactly the transferred percentages, is_operator = false, preferential_right = false"
          - "transfer_status = CLOSED; effective_date = closing_date"
          - "Well.consent_working_interest_pct recomputed; increments Well.version by 1"
          - "INVARIANT: the sum of working_interest_pct over the well's ACTIVE interests stays exactly 1.000000, and the sum of net_revenue_interest_pct over those rows is unchanged by the conveyance - interest is redistributed between assignor and grantee, never created or destroyed"
      - from: PPR_EXERCISED
        to: CLOSED
        trigger: "POST /land-admin/assignment-transfers/{transfer_id}/closing"
        actor: LandAdministrator
        preconditions:
          - "transfer_status IN {PPR_WAIVED, PPR_EXERCISED}"
          - "the closing grantee (ppr_holder_owner_id on this branch) has owner_type == WORKING_INTEREST_PARTNER"
          - "the closing grantee satisfies bond_posted_cents >= bond_check_required_cents (inclusive boundary)"
          - "the assignor's ACTIVE WellInterest.working_interest_pct >= transfer_wi_pct and net_revenue_interest_pct >= transfer_nri_pct"
        side_effects:
          - "PREFERENTIAL-RIGHT BRANCH: the grantee is ppr_holder_owner_id, NOT assignee_owner_id; the named assignee receives nothing"
          - "the same assignor supersede/replace mechanics as the waiver branch"
          - "the preferential-right holder's existing ACTIVE row is SUPERSEDED and re-created with the transferred percentages added (a preferential-right holder always already owns an interest, so no brand-new row is created on this branch)"
          - "transfer_status = CLOSED; effective_date = closing_date"
          - "Well.consent_working_interest_pct recomputed; increments Well.version by 1"
          - "INVARIANT: the same two conserved sums as the waiver branch - working interest stays exactly 1.000000 and the net-revenue-interest sum is unchanged (the fork-join converges on the same conserved quantities with a different payee)"

concurrency_rules:
  - rule_id: well-interest-create-stale-well
    parent_entity: Well
    write_endpoint: "POST /land-admin/wells/{well_id}/interests"
    occ_field: "expected_well_version"
    description: |
      Recording a WellInterest against a Well whose version has advanced since the client last
      read it is rejected with 412. This captures the case where an assignment closing has
      already superseded the ownership rows of that well (a conveyance that legitimately
      supersedes the prior division of interest), so the division order the client is posting
      from is stale and would push the well's ACTIVE working-interest sum away from 1.000000.
    error_id: ERR_STALE_WELL_VERSION
    http_status: 412

  - rule_id: statement-revision-stale-statement
    parent_entity: JibStatement
    write_endpoint: "POST /land-admin/jib-statements/{statement_id}/revisions"
    occ_field: "expected_jib_statement_version"
    description: |
      Revising a JibStatement whose version has advanced since the client last read it is
      rejected with 412. A revision legitimately supersedes the statement it targets, so two
      revisions built from the same observed version would each supersede the same statement and
      double-reverse Well.billed_to_date_cents; the stale-version check makes the second one
      fail deterministically.
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412

calculations:
  - name: unit_allocation_factor
    trigger: "On POST /land-admin/wells/{well_id}/lease-allocations, and on cascade hop 2 of any Lease EXPIRED transition; writes WellLeaseAllocation.allocation_factor and Well.allocation_factor_total"
    algorithm: aggregation
    formula: |
      committed = [a in WellLeaseAllocation : a.well_id == W.id AND a.allocation_status == COMMITTED]
      if committed is empty:
          every allocation_factor = 0.000000 ; W.allocation_factor_total = 0.000000 ; stop
      total_acres = sum(a.committed_acres for a in committed)          # 2 decimal places
      for a in committed: f[a] = round_half_up(a.committed_acres / total_acres, 6)
      residual = 1.000000 - sum(f[a] for a in committed)               # signed multiple of 0.000001
      order = committed sorted by (committed_acres DESC, created_at ASC)
      f[order[0]] = f[order[0]] + residual
      W.allocation_factor_total = sum(f[a]) == 1.000000 exactly
      each Lease.committed_acres_total = sum of committed_acres over its COMMITTED allocations
      each Lease.held_acres = min(Lease.gross_acres, Lease.committed_acres_total) when
          Lease.tenure_status != EXPIRED, else 0
    input_set: "WellLeaseAllocation rows of the well with allocation_status == COMMITTED; WITHDRAWN rows are excluded from both the numerator and the denominator and keep their last computed allocation_factor frozen"
    constants: {}
    precision: "6 decimal places, round_half_up; the signed residual guarantees the factors sum to exactly 1.000000"

  - name: plugging_liability_estimate
    trigger: "On POST /land-admin/wells (initial value) and recomputed inside the Well TEMPORARILY_ABANDONED -> PLUGGED transition, where the value is then frozen"
    algorithm: threshold
    formula: |
      raw = PLUG_BASE_CENTS + DEPTH_RATE_CENTS_PER_FT * W.total_depth_ft
      W.plugging_liability_cents = min(raw, PLUG_CAP_CENTS)
    input_set: "Well.total_depth_ft only; no cost history participates"
    constants:
      PLUG_BASE_CENTS: 3500000
      DEPTH_RATE_CENTS_PER_FT: 1200
      PLUG_CAP_CENTS: 25000000
    precision: "whole cents; all inputs are integers so no rounding occurs"

  - name: bond_coverage_requirement
    trigger: "Recomputed on POST /land-admin/wells/{well_id}/interests, on POST /land-admin/interest-owners/{owner_id}/compliance-updates, on assignment closing, and read as a precondition by the Well -> PLUGGED transition and by AssignmentTransfer closing"
    algorithm: aggregation
    formula: |
      rows = [wi in WellInterest : wi.owner_id == O.id AND wi.interest_status == ACTIVE
                                   AND Well(wi.well_id).well_status != PLUGGED]
      per_well[wi] = round_half_up(wi.working_interest_pct * Well(wi.well_id).plugging_liability_cents)
      O.required_bond_cents = round_half_up(BOND_COVERAGE_FACTOR * sum(per_well[wi] for wi in rows))
      # AssignmentTransfer.bond_check_required_cents is the SAME formula evaluated for the closing
      # grantee as if the conveyance had already been recorded: the grantee's rows plus
      # transfer_wi_pct on this transfer's well.
    input_set: "ACTIVE WellInterest rows of the owner on wells that are not PLUGGED; SUPERSEDED and TERMINATED rows are excluded"
    constants:
      BOND_COVERAGE_FACTOR: 1.25
    precision: "Per-well products are rounded half-up to whole cents FIRST, then summed, then multiplied by BOND_COVERAGE_FACTOR and rounded half-up again. Multiplying the unrounded sum is explicitly rejected."

  - name: jib_direct_cost_pool
    trigger: "On POST /land-admin/wells/{well_id}/jib-statements (provisional values on the DRAFT) and again on POST /land-admin/jib-statements/{statement_id}/issuance (authoritative values)"
    algorithm: aggregation
    formula: |
      base = [c in CostEntry : c.well_id == S.well_id]
      if S.cost_basis == ACCRUAL:
          included = [c in base : c.cost_status IN {ACCRUED, PAID}
                      AND S.billing_period_start <= c.incurred_date <= S.billing_period_end]
      else:  # S.cost_basis == CASH
          included = [c in base : c.cost_status == PAID AND c.paid_date is not null
                      AND S.billing_period_start <= c.paid_date <= S.billing_period_end]
      S.capital_direct_cents   = sum(c.amount_cents for c in included if c.cost_class == CAPITAL)
      S.operating_direct_cents = sum(c.amount_cents for c in included if c.cost_class == OPERATING)
      S.direct_cost_cents      = S.capital_direct_cents + S.operating_direct_cents
      if included is empty at issuance: reject with ERR_NO_BILLABLE_COSTS
    input_set: "CostEntry rows of the well; the inclusion key is incurred_date under ACCRUAL and paid_date under CASH. Both interval ends are inclusive."
    constants: {}
    precision: "whole cents; integer addition only"
    variants:
      - name: ACCRUAL
        when: "JibStatement.cost_basis == ACCRUAL"
        difference: "Includes ACCRUED and PAID costs keyed on incurred_date. A cost incurred inside the period but settled after it IS billed."
      - name: CASH
        when: "JibStatement.cost_basis == CASH"
        difference: "Includes only PAID costs keyed on paid_date. The same cost incurred inside the period but settled after it is NOT billed, and a cost incurred before the period but settled inside it IS billed - so the two variants produce different direct_cost_cents, overhead_cents (under PERCENTAGE_BASIS) and total_billed_cents for identical CostEntry data."

  - name: overhead_charge
    trigger: "Computed inside POST /land-admin/wells/{well_id}/jib-statements and recomputed inside POST /land-admin/jib-statements/{statement_id}/issuance; writes JibStatement.billable_months and JibStatement.overhead_cents"
    algorithm: tiered_pricing
    formula: |
      billable_months = count of distinct (calendar year, calendar month) pairs having at least one
                        day inside the closed interval [billing_period_start, billing_period_end]
      if S.overhead_rate_class == FIXED_RATE:
          rate = DRILLING_RATE_CENTS_PER_MONTH  if S.activity_class == DRILLING
                 else PRODUCING_RATE_CENTS_PER_MONTH
          raw = WAGE_INDEX_ADJ * rate * billable_months
      else:  # PERCENTAGE_BASIS
          raw = PCT_CAPITAL * S.capital_direct_cents + PCT_OPERATING * S.operating_direct_cents
      S.overhead_cents = min(max(round_half_up(raw), OVERHEAD_FLOOR_CENTS), OVERHEAD_CAP_CENTS)
    input_set: "The statement's own overhead_rate_class, activity_class, billing period and the direct pools produced by calculations.jib_direct_cost_pool. The floor and the cap apply to BOTH branches."
    constants:
      DRILLING_RATE_CENTS_PER_MONTH: 950000
      PRODUCING_RATE_CENTS_PER_MONTH: 95000
      WAGE_INDEX_ADJ: 1.042
      PCT_CAPITAL: 0.05
      PCT_OPERATING: 0.03
      OVERHEAD_FLOOR_CENTS: 25000
      OVERHEAD_CAP_CENTS: 1500000
    precision: "round_half_up to whole cents applied to raw BEFORE the floor and the cap are applied; applying min/max first and rounding afterwards is explicitly rejected"

  - name: non_consent_reallocation
    trigger: "Computed inside POST /land-admin/jib-statements/{statement_id}/issuance, after calculations.jib_direct_cost_pool and calculations.overhead_charge, before calculations.jib_owner_share_rounding"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER. The dependency looks circular - owner shares depend on overhead,
      # overhead depends on the direct pools, and the direct pools are what get reallocated between
      # owners - so the cut is stated explicitly: overhead is always computed from the PRE-
      # reallocation gross pools (step 6) and only its ALLOCATION uses post-reallocation weights.
      # Step 1: owners = owners holding an ACTIVE WellInterest on S.well_id, ordered by
      #         (working_interest_pct DESC, WellInterest.created_at ASC)
      # Step 2: capital_direct_cents / operating_direct_cents from calculations.jib_direct_cost_pool
      # Step 3: afe_capital_cents = sum of included CostEntry.amount_cents where cost_class == CAPITAL
      #         AND afe_id is not null AND Afe(afe_id).afe_status == PARTIALLY_CONSENTED
      #         non_afe_capital_cents = capital_direct_cents - afe_capital_cents
      # Step 4: consent_denominator = Well.consent_working_interest_pct
      #         for consenting o (non_consent_flag == false):
      #             consent_normalized_wi_pct(o) = round_half_up(o.wi / consent_denominator, 6)
      #         for non-consenting o: consent_normalized_wi_pct(o) = 0.000000
      #         signed residual (1.000000 - sum) is added to the consenting owner with the largest
      #         working_interest_pct, tie-break WellInterest.created_at ASC
      # Step 5: exact (unrounded) owner raw shares
      #             operating_raw(o)      = operating_direct_cents * o.wi
      #             non_afe_capital_raw(o)= non_afe_capital_cents * o.wi
      #             afe_capital_raw(o)    = afe_capital_cents * consent_normalized_wi_pct(o)
      #             capital_raw(o)        = non_afe_capital_raw(o) + afe_capital_raw(o)
      # Step 6: overhead_cents already fixed from the GROSS pools - never recomputed here
      # Step 7: overhead_raw(o) = overhead_cents * (capital_raw(o) + operating_raw(o))
      #                           / direct_cost_cents          (direct_cost_cents > 0 guaranteed)
      # Step 8: reporting fields, each rounded half-up to whole cents independently:
      #             non_consent_withheld_cents(o)    = round_half_up(afe_capital_cents * o.wi)
      #                                                for non-consenting o, else 0
      #             non_consent_reallocated_cents(o)  = round_half_up(afe_capital_raw(o)
      #                                                - afe_capital_cents * o.wi)
      #                                                for consenting o, else 0
      #             penalty_accrued_cents(o)          = round_half_up(
      #                                                Afe.non_consent_penalty_multiple
      #                                                * non_consent_withheld_cents(o))
      #                                                for non-consenting o when
      #                                                Afe.cost_class == CAPITAL, else 0
      #         When more than one PARTIALLY_CONSENTED AFE contributes costs, steps 3, 5 and 8 are
      #         evaluated per AFE in Afe.created_at ASC order and the per-AFE rounded amounts are
      #         summed.
      # Step 9: hand capital_raw / operating_raw / overhead_raw to
      #         calculations.jib_owner_share_rounding
    input_set: "ACTIVE WellInterest rows of the well at issuance time, the direct cost pool selected for this statement, and the afe_status of each AFE referenced by an included CAPITAL cost. Costs whose AFE is FULLY_CONSENTED or FAILED are treated as ordinary non-AFE capital and are never reallocated."
    constants: {}
    precision: "All owner-level raw shares stay exact (unrounded) until calculations.jib_owner_share_rounding; only the four reporting fields in step 8 are rounded here"

  - name: jib_owner_share_rounding
    trigger: "Final step of POST /land-admin/jib-statements/{statement_id}/issuance; writes every JibLineItem money field"
    algorithm: waterfall_allocation
    formula: |
      buckets, in this fixed order: b1 = direct_capital, b2 = direct_operating, b3 = overhead
      bucket_total(b1) = S.capital_direct_cents
      bucket_total(b2) = S.operating_direct_cents
      bucket_total(b3) = S.overhead_cents
      # ROUND PER OWNER PER BUCKET FIRST, THEN SUM. Sum-then-round is explicitly rejected.
      for b in [b1, b2, b3]:
          for o in owners: cents(o, b) = round_half_up(raw(o, b))
          residual(b) = bucket_total(b) - sum(cents(o, b) for o in owners)
          target(b) = the owner with the largest working_interest_pct
                      (tie-break WellInterest.created_at ASC); if b == b1 and that owner has
                      consent_normalized_wi_pct == 0, target(b1) = the CONSENTING owner with the
                      largest working_interest_pct (same tie-break)
          cents(target(b), b) += residual(b)
          JibLineItem(target(b)).rounding_residual_cents += residual(b)
      JibLineItem(o).direct_capital_cents   = cents(o, b1)
      JibLineItem(o).direct_operating_cents = cents(o, b2)
      JibLineItem(o).overhead_cents         = cents(o, b3)
      JibLineItem(o).total_billed_cents     = cents(o, b1) + cents(o, b2) + cents(o, b3)
      S.total_billed_cents = S.direct_cost_cents + S.overhead_cents
                           = sum over o of JibLineItem(o).total_billed_cents   # exact identity
    input_set: "One JibLineItem per owner holding an ACTIVE WellInterest on the well at issuance; owners whose ACTIVE interest began after billing_period_end are still included because the snapshot is taken at issuance, not at period end"
    constants: {}
    precision: "round_half_up to whole cents per owner per bucket, then a single signed residual per bucket. Rounding the three buckets together per owner, or summing raw shares before rounding, both produce different cents and are rejected."

  - name: afe_consent_tally
    trigger: "Computed inside POST /land-admin/afes/{afe_id}/election-closures; writes Afe.consent_working_interest_pct, Afe.non_consent_working_interest_pct and selects the branch"
    algorithm: threshold
    formula: |
      submitted = [e in AfeElection : e.afe_id == A.id AND e.election_status == SUBMITTED]
      operator_wi = working_interest_pct of the ACTIVE WellInterest on A.well_id with
                    is_operator == true, or 0.000000 when no such row exists
      consent = round_half_up(operator_wi + sum(e.wi_pct_snapshot for e in submitted
                              if e.election_type == CONSENT and e.owner_id != operator_owner_id), 6)
      A.consent_working_interest_pct = consent
      A.non_consent_working_interest_pct = 1.000000 - consent
      if consent == 0.000000: reject with ERR_NO_CONSENTING_INTEREST
      elif consent == 1.000000: branch FULLY_CONSENTED
      elif consent >= A.minimum_consent_pct: branch PARTIALLY_CONSENTED
      else: branch FAILED
    input_set: "AfeElection rows with election_status == SUBMITTED only; DEEMED_NON_CONSENT and VOIDED rows are excluded. The operator's ACTIVE interest is added without an election row."
    constants: {}
    precision: "6 decimal places, round_half_up; the minimum_consent_pct comparison is inclusive (consent == minimum_consent_pct is PARTIALLY_CONSENTED, not FAILED)"

  - name: revenue_distribution_waterfall
    trigger: "Computed inside POST /land-admin/production-revenues/{revenue_id}/release; writes ProductionRevenue money fields and creates every OwnerDisbursement"
    algorithm: waterfall_allocation
    formula: |
      rate = SEVERANCE_TAX_RATE_OIL if Well.product_type == OIL else SEVERANCE_TAX_RATE_GAS
      R.severance_tax_cents = round_half_up(R.gross_revenue_cents * rate)
      R.net_proceeds_cents  = R.gross_revenue_cents - R.severance_tax_cents
      allocs = [a in WellLeaseAllocation : a.well_id == R.well_id AND a.allocation_status == COMMITTED]
              processed in created_at ASC order
      # tier 1: net proceeds to committed leases
      pool_raw(a) = R.net_proceeds_cents * a.allocation_factor
      pool(a)     = round_half_up(pool_raw(a))
      residual    = R.net_proceeds_cents - sum(pool(a))
      pool(argmax by (allocation_factor DESC, created_at ASC)) += residual
      # tier 2: lessor royalty off the top of each lease pool
      royalty(a)  = round_half_up(pool(a) * Lease(a.lease_id).royalty_rate)
      R.total_royalty_cents = sum(royalty(a))
      wi_pool(a)  = pool(a) - royalty(a)
      # tier 3: post-royalty pool to working-interest owners by NORMALIZED net revenue interest.
      #         Raw net_revenue_interest_pct is net of the lessor royalty already taken at tier 2,
      #         so it is renormalized over the well's ACTIVE holders before it is applied; without
      #         this step the tier would not exhaust wi_pool(a).
      owners = ACTIVE WellInterest rows of the well in created_at ASC order
      nri_denominator = sum(o.net_revenue_interest_pct for o in owners)
      normalized_nri(o) = round_half_up(o.net_revenue_interest_pct / nri_denominator, 6)
      signed residual (1.000000 - sum of normalized_nri) is added to the owner with the largest
        net_revenue_interest_pct, tie-break WellInterest.created_at ASC
      share_raw(a, o)         = wi_pool(a) * normalized_nri(o)
      gross_share_cents(a, o) = round_half_up(share_raw(a, o))
      residual(a) = wi_pool(a) - sum over o of gross_share_cents(a, o)
      gross_share_cents(a, argmax by (net_revenue_interest_pct DESC, created_at ASC)) += residual(a)
      # tier 4: non-consent penalty recovery, rows processed in
      #         (WellLeaseAllocation.created_at ASC, WellInterest.created_at ASC) order
      withheld_recovery_cents(a, o) = min(gross_share_cents(a, o),
                                          remaining_balance(o))
      remaining_balance(o) -= withheld_recovery_cents(a, o)
      net_amount_cents(a, o) = gross_share_cents(a, o) - withheld_recovery_cents(a, o)
      WellInterest(o).non_consent_recoverable_balance_cents = remaining_balance(o) after all rows
      R.total_disbursed_cents = sum over (a, o) of gross_share_cents(a, o)
      # INVARIANT (conserved quantity: cash):
      #   R.gross_revenue_cents == R.severance_tax_cents + R.total_royalty_cents
      #                            + R.total_disbursed_cents
    input_set: "COMMITTED WellLeaseAllocation rows and ACTIVE WellInterest rows of the well, both snapshotted at release time. WITHDRAWN allocations and SUPERSEDED/TERMINATED interests are excluded."
    constants:
      SEVERANCE_TAX_RATE_OIL: 0.046
      SEVERANCE_TAX_RATE_GAS: 0.075
    precision: "whole cents, round_half_up at each tier, with a signed largest-remainder residual per tier so each tier's parts sum exactly to that tier's total; normalized_nri is 6 decimal places and sums to exactly 1.000000"

  - name: statutory_late_interest
    trigger: "Computed inside POST /land-admin/owner-disbursements/{disbursement_id}/payment; writes OwnerDisbursement.late_interest_cents and OwnerDisbursement.interest_basis"
    algorithm: decay_function
    formula: |
      month_end = last calendar day of ProductionRevenue.production_month
      statutory_days = STATUTORY_DAYS_OIL if Well.product_type == OIL else STATUTORY_DAYS_GAS
      R.statutory_due_date = month_end + statutory_days days
      basis = request field interest_basis when supplied, else
              FROM_PROCEEDS_RECEIPT if the row has ever carried suspense_reason == MISSING_TAX_ID,
              else FROM_DUE_DATE
      if basis == FROM_DUE_DATE:
          days_late = max(0, whole days from R.statutory_due_date to date(paid_at))
          annual    = STATUTORY_INTEREST_ANNUAL_PCT
      else:  # FROM_PROCEEDS_RECEIPT
          days_late = max(0, whole days from (month_end + 1 day) to date(paid_at))
          annual    = SUSPENSE_INTEREST_ANNUAL_PCT
      D.late_interest_cents = round_half_up(D.net_amount_cents * annual * days_late / DAY_BASIS)
      D.interest_basis = basis
    input_set: "The single OwnerDisbursement being paid, its parent ProductionRevenue.production_month, and the well's product_type. Suspense history is read from suspense_reason."
    constants:
      STATUTORY_DAYS_OIL: 60
      STATUTORY_DAYS_GAS: 90
      STATUTORY_INTEREST_ANNUAL_PCT: 0.12
      SUSPENSE_INTEREST_ANNUAL_PCT: 0.06
      DAY_BASIS: 365
    precision: "round_half_up to whole cents once, at the end; intermediate day counts are exact integers"
    variants:
      - name: FROM_DUE_DATE
        when: "The row was never suspended for a missing tax id (suspense_reason has never been MISSING_TAX_ID), or the caller passes interest_basis == FROM_DUE_DATE"
        difference: "Interest accrues only after the statutory grace period, at 12% per annum. Days late are counted from statutory_due_date."
      - name: FROM_PROCEEDS_RECEIPT
        when: "The row was suspended for a missing tax id, or the caller passes interest_basis == FROM_PROCEEDS_RECEIPT"
        difference: "Interest accrues from the day after the production month closed, at 6% per annum, because the operator held identified proceeds it could not pay out. For the same disbursement and the same payment date the two variants produce different late_interest_cents - the accrual window is longer but the rate is halved, so neither dominates."

  - name: lease_obligation_deadlines
    trigger: "Recomputed on POST /land-admin/leases, on POST /land-admin/leases/{lease_id}/extension, on POST /land-admin/leases/{lease_id}/obligation-events, on the Well PRODUCING <-> SHUT_IN transitions, and read by every POST /land-admin/obligation-runs evaluation"
    algorithm: interval_merge
    formula: |
      shut_in_next_due_date = null when shut_in_start_date is null, else
          shut_in_start_date + 90 days + shut_in_payments_made * 365 days
      continuous_dev_deadline = null when last_operation_end_date is null, else
          last_operation_end_date + continuous_dev_window_days days
      shut_in_payment_amount_cents = round_half_up(gross_acres * shut_in_royalty_per_acre_cents)
      D_ob = the earlier of shut_in_next_due_date and continuous_dev_deadline, ignoring nulls;
             when the two are equal shut_in_next_due_date wins
      # survival tests, all evaluated on whole calendar dates against the logical clock date D
      primary term survives            while D <= primary_term_end_date
      shut-in holding survives         while shut_in_payments_made >= 1 AND D <= shut_in_next_due_date
      continuous development survives  while D <= continuous_dev_deadline
      OBLIGATION_DUE window            D >= D_ob - OBLIGATION_WARNING_DAYS AND D <= D_ob
      a third SHUT_IN_PAYMENT event (shut_in_payments_made == MAX_SHUT_IN_PAYMENTS) is rejected
          with ERR_SHUT_IN_LIMIT_EXCEEDED
    input_set: "The single Lease being evaluated plus the well_status of every Well it has a COMMITTED allocation to"
    constants:
      SHUT_IN_FIRST_PAYMENT_DAYS: 90
      SHUT_IN_ANNIVERSARY_DAYS: 365
      MAX_SHUT_IN_PAYMENTS: 2
      OBLIGATION_WARNING_DAYS: 30
    precision: "whole calendar dates; every survival comparison is <= (inclusive), so a lease whose deadline equals the clock date is still held and expires only on the following day"

validations:
  # ---- 10-26: authentication, authorization, schema ----
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The value of X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 25
    category: schema
    check: "Every field marked required in the endpoint's input is present and non-null"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 26
    category: schema
    check: "Enum fields carry a declared value; integer cent fields are >= 0; percentage fields are within [0.000000, 1.000000] with at most 6 decimal places; date fields are ISO-8601 calendar dates; production_month matches ^[0-9]{4}-(0[1-9]|1[0-2])$; non_consent_penalty_multiple is within [1.0, 5.0] with at most 1 decimal place"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 27
    category: schema
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list endpoints"

  # ---- 30: path existence, left-to-right ----
  - priority: 30
    category: existence
    check: "lease_id in the path resolves to a Lease"
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/leases/{lease_id}/**"
  - priority: 30
    category: existence
    check: "well_id in the path resolves to a Well"
    error_id: ERR_WELL_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/wells/{well_id}/**"
  - priority: 30
    category: existence
    check: "owner_id in the path resolves to an InterestOwner"
    error_id: ERR_INTEREST_OWNER_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/interest-owners/{owner_id}/**"
  - priority: 30
    category: existence
    check: "interest_id in the path resolves to a WellInterest"
    error_id: ERR_WELL_INTEREST_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/well-interests/{interest_id}/**"
  - priority: 30
    category: existence
    check: "afe_id in the path resolves to an Afe"
    error_id: ERR_AFE_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/afes/{afe_id}/**"
  - priority: 30
    category: existence
    check: "statement_id in the path resolves to a JibStatement"
    error_id: ERR_JIB_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/jib-statements/{statement_id}/**"
  - priority: 30
    category: existence
    check: "dispute_id in the path resolves to a BillingDispute"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/disputes/{dispute_id}/**"
  - priority: 30
    category: existence
    check: "revenue_id in the path resolves to a ProductionRevenue"
    error_id: ERR_PRODUCTION_REVENUE_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/production-revenues/{revenue_id}/**"
  - priority: 30
    category: existence
    check: "disbursement_id in the path resolves to an OwnerDisbursement"
    error_id: ERR_DISBURSEMENT_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/owner-disbursements/{disbursement_id}/**"
  - priority: 30
    category: existence
    check: "transfer_id in the path resolves to an AssignmentTransfer"
    error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "/land-admin/assignment-transfers/{transfer_id}/**"

  # ---- 35: body FK existence, left-to-right in the order the endpoint's input lists them ----
  - priority: 35
    category: existence
    check: "lease_id supplied in a request body resolves to a Lease"
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    applies_to: "POST /land-admin/wells/{well_id}/lease-allocations"
  - priority: 35
    category: existence
    check: "owner_id, assignor_owner_id and assignee_owner_id supplied in a request body each resolve to an InterestOwner, checked in that order"
    error_id: ERR_INTEREST_OWNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /land-admin/wells/{well_id}/interests, POST /land-admin/afes/{afe_id}/elections, POST /land-admin/jib-statements/{statement_id}/disputes, POST /land-admin/wells/{well_id}/assignment-transfers"
  - priority: 35
    category: existence
    check: "afe_id supplied in a cost-entry body resolves to an Afe"
    error_id: ERR_AFE_NOT_FOUND
    http_status: 404
    applies_to: "POST /land-admin/wells/{well_id}/cost-entries"

  # ---- 40-48: identity, segregation of duties, optimistic concurrency ----
  - priority: 40
    category: business_referential
    check: "When X-User-Role is PartnerRepresentative, X-User-ID equals the InterestOwner.id the addressed resource belongs to (BillingDispute.owner_id, OwnerDisbursement.owner_id, AfeElection.owner_id, the owner_id in the request body)"
    error_id: ERR_OWNER_MISMATCH
    http_status: 403
    applies_to: "POST /land-admin/afes/{afe_id}/elections, POST /land-admin/jib-statements/{statement_id}/disputes, POST /land-admin/disputes/{dispute_id}/exchanges, GET /land-admin/owner-disbursements"
  - priority: 45
    category: business_safety
    check: "The X-User-ID resolving a BillingDispute differs from the prepared_by_user_id of the disputed JibStatement - the accountant who prepared a bill may not adjudicate the exception taken against it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /land-admin/disputes/{dispute_id}/resolution"
  - priority: 48
    category: state
    check: "expected_well_version equals the addressed Well's current version"
    error_id: ERR_STALE_WELL_VERSION
    http_status: 412
    applies_to: "POST /land-admin/wells/{well_id}/interests"
  - priority: 48
    category: state
    check: "expected_jib_statement_version equals the addressed JibStatement's current version"
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412
    applies_to: "POST /land-admin/jib-statements/{statement_id}/revisions"

  # ---- 50: own-entity state preconditions ----
  - priority: 49
    category: state
    check: "The addressed entity is not in a terminal state (Lease EXPIRED, Well PLUGGED, JibStatement ADJUSTED, SETTLED or VOID, BillingDispute RESOLVED_UPHELD / RESOLVED_ADJUSTED / EXPIRED, AssignmentTransfer CLOSED, OwnerDisbursement PAID, WellInterest TERMINATED)"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "all POST endpoints that mutate an existing entity"
  - priority: 50
    category: state
    check: "The requested Well well_status change is a declared transition out of the well's current well_status"
    error_id: ERR_WELL_INVALID_STATUS
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/status-changes"
  - priority: 50
    category: state
    check: "The Well has pooling_status == POOLED_FORMING - effectuation is available once, out of the forming state"
    error_id: ERR_POOLING_NOT_FORMING
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/pooling-effectuation"
  - priority: 50
    category: state
    check: "For to_status == DRILLING, the Well has pooling_status == POOLED_EFFECTIVE - a well is not spudded before its pooled unit is in force"
    error_id: ERR_WELL_NOT_POOLED
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/status-changes when to_status == DRILLING"
  - priority: 50
    category: state
    check: "The Lease has extension_option_months > 0 and extension_exercised == false and tenure_status == PRIMARY_TERM"
    error_id: ERR_EXTENSION_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /land-admin/leases/{lease_id}/extension"
  - priority: 50
    category: state
    check: "The Afe has afe_status == ELECTIONS_OPEN"
    error_id: ERR_AFE_ELECTIONS_CLOSED
    http_status: 409
    applies_to: "POST /land-admin/afes/{afe_id}/elections, POST /land-admin/afes/{afe_id}/election-closures"
  - priority: 50
    category: state
    check: "The owner has no AfeElection on this AFE with election_status == SUBMITTED"
    error_id: ERR_ELECTION_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /land-admin/afes/{afe_id}/elections"
  - priority: 50
    category: state
    check: "The JibStatement has statement_status == DRAFT"
    error_id: ERR_STATEMENT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /land-admin/jib-statements/{statement_id}/issuance"
  - priority: 50
    category: state
    check: "The JibStatement has statement_status in {DRAFT, ISSUED}"
    error_id: ERR_STATEMENT_NOT_VOIDABLE
    http_status: 409
    applies_to: "POST /land-admin/jib-statements/{statement_id}/void"
  - priority: 50
    category: state
    check: "The JibStatement has statement_status in {ISSUED, DISPUTED}"
    error_id: ERR_STATEMENT_NOT_DISPUTABLE
    http_status: 409
    applies_to: "POST /land-admin/jib-statements/{statement_id}/disputes"
  - priority: 50
    category: state
    check: "The JibStatement has statement_status == ISSUED and no BillingDispute on it has dispute_status in {OPEN, OPERATOR_RESPONDED, ESCALATED} - a contested bill is settled only after its disputes close"
    error_id: ERR_STATEMENT_NOT_SETTLEABLE
    http_status: 409
    applies_to: "POST /land-admin/jib-statements/{statement_id}/settlement"
  - priority: 50
    category: state
    check: "The BillingDispute has dispute_status == OPEN"
    error_id: ERR_DISPUTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /land-admin/disputes/{dispute_id}/exchanges"
  - priority: 50
    category: state
    check: "The BillingDispute has dispute_status in {OPERATOR_RESPONDED, ESCALATED}"
    error_id: ERR_DISPUTE_NOT_RESOLVABLE
    http_status: 409
    applies_to: "POST /land-admin/disputes/{dispute_id}/resolution, POST /land-admin/disputes/{dispute_id}/exchanges"
  - priority: 50
    category: state
    check: "The ProductionRevenue has distribution_status == ACCRUED"
    error_id: ERR_REVENUE_NOT_ACCRUED
    http_status: 409
    applies_to: "POST /land-admin/production-revenues/{revenue_id}/release"
  - priority: 50
    category: state
    check: "The OwnerDisbursement has disbursement_status == ACCRUED"
    error_id: ERR_DISBURSEMENT_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /land-admin/owner-disbursements/{disbursement_id}/payment"
  - priority: 50
    category: state
    check: "The AssignmentTransfer has transfer_status == NOTICED"
    error_id: ERR_TRANSFER_NOT_PENDING
    http_status: 409
    applies_to: "POST /land-admin/assignment-transfers/{transfer_id}/ppr-elections"
  - priority: 50
    category: state
    check: "The electing owner has no earlier preferential-right election recorded on this transfer"
    error_id: ERR_PPR_ELECTION_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /land-admin/assignment-transfers/{transfer_id}/ppr-elections"
  - priority: 50
    category: state
    check: "The AssignmentTransfer has transfer_status in {PPR_WAIVED, PPR_EXERCISED}"
    error_id: ERR_TRANSFER_NOT_CLOSEABLE
    http_status: 409
    applies_to: "POST /land-admin/assignment-transfers/{transfer_id}/closing"
  - priority: 50
    category: state
    check: "The WellInterest has interest_status == ACTIVE"
    error_id: ERR_INTEREST_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /land-admin/well-interests/{interest_id}/termination, POST /land-admin/afes/{afe_id}/elections"

  # ---- 55: cross-entity state dependencies ----
  - priority: 55
    category: state
    check: "The Well has pooling_status == POOLED_EFFECTIVE - a JIB statement can only be issued for a well whose pooled unit is in force"
    error_id: ERR_WELL_NOT_POOLED
    http_status: 409
    applies_to: "POST /land-admin/jib-statements/{statement_id}/issuance"
  - priority: 55
    category: state
    check: "For to_status == PRODUCING, at least one WellInterest with interest_status == ACTIVE and is_operator == true exists on the well - production is only recognised once an operator of record is on file"
    error_id: ERR_NO_OPERATOR_INTEREST
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/status-changes when to_status == PRODUCING"
  - priority: 55
    category: state
    check: "Every COMMITTED WellLeaseAllocation of the well points at a Lease whose tenure_status != EXPIRED"
    error_id: ERR_LEASE_NOT_HELD
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/pooling-effectuation"
  - priority: 55
    category: state
    check: "The Well has well_status in {PRODUCING, SHUT_IN} - revenue cannot be booked against a well that has never produced or has been plugged"
    error_id: ERR_WELL_NOT_PRODUCING
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/production-revenues"
  - priority: 55
    category: state
    check: "The Lease has tenure_status != EXPIRED at the moment the allocation is committed"
    error_id: ERR_LEASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/lease-allocations"
  - priority: 55
    category: state
    check: "The assignee InterestOwner has tax_id_on_file == true - an interest may not be conveyed to an owner the operator cannot report to the taxing authority"
    error_id: ERR_OWNER_NOT_COMPLIANT
    http_status: 409
    applies_to: "POST /land-admin/assignment-transfers/{transfer_id}/closing"
  - priority: 55
    category: state
    check: "The Well has no JibStatement in statement_status ISSUED or DISPUTED - a well cannot be plugged while partners still owe or contest a bill"
    error_id: ERR_UNSETTLED_STATEMENTS
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/status-changes when to_status == PLUGGED"

  # ---- 60: temporal windows and deadlines ----
  - priority: 60
    category: business_temporal
    check: "billing_period_end is strictly before the logical clock's calendar date - an open period cannot be billed"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /land-admin/jib-statements/{statement_id}/issuance"
  - priority: 60
    category: business_temporal
    check: "billing_period_start <= billing_period_end"
    error_id: ERR_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /land-admin/wells/{well_id}/jib-statements"
  - priority: 60
    category: business_temporal
    check: "The logical clock's calendar date is <= Afe.election_deadline_date (the deadline day itself is still open)"
    error_id: ERR_ELECTION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /land-admin/afes/{afe_id}/elections"
  - priority: 60
    category: business_temporal
    check: "The logical clock's calendar date is > Afe.election_deadline_date - elections may not be closed while the window is still open"
    error_id: ERR_ELECTION_WINDOW_OPEN
    http_status: 422
    applies_to: "POST /land-admin/afes/{afe_id}/election-closures"
  - priority: 60
    category: business_temporal
    check: "For dispute_kind == AUDIT_EXCEPTION, the logical clock's calendar date is <= date(JibStatement.issued_at) + InterestOwner.audit_window_days (the last day of the window is inclusive)"
    error_id: ERR_AUDIT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /land-admin/jib-statements/{statement_id}/disputes"
  - priority: 60
    category: business_temporal
    check: "For dispute_kind == BILLING_DISPUTE, the logical clock's calendar date is <= JibStatement.payment_due_date"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /land-admin/jib-statements/{statement_id}/disputes"
  - priority: 60
    category: business_temporal
    check: "The logical clock's calendar date is <= BillingDispute.response_due_date"
    error_id: ERR_DISPUTE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /land-admin/disputes/{dispute_id}/exchanges"
  - priority: 60
    category: business_temporal
    check: "The logical clock's calendar date is <= BillingDispute.rebuttal_due_date"
    error_id: ERR_REBUTTAL_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /land-admin/disputes/{dispute_id}/exchanges"
  - priority: 60
    category: business_temporal
    check: "The logical clock's calendar date is <= AssignmentTransfer.ppr_deadline_date"
    error_id: ERR_PPR_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /land-admin/assignment-transfers/{transfer_id}/ppr-elections"
  - priority: 60
    category: business_temporal
    check: "Either ppr_waiver_count == ppr_eligible_count (every preferential-right holder has waived) or the logical clock's calendar date is > AssignmentTransfer.ppr_deadline_date"
    error_id: ERR_PPR_WINDOW_OPEN
    http_status: 422
    applies_to: "POST /land-admin/assignment-transfers/{transfer_id}/closing"
  - priority: 60
    category: business_temporal
    check: "notice_date <= effective_date"
    error_id: ERR_EFFECTIVE_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /land-admin/wells/{well_id}/assignment-transfers"
  - priority: 60
    category: business_temporal
    check: "The parent ProductionRevenue has released_at set and date(released_at) <= the logical clock's calendar date"
    error_id: ERR_PAYMENT_BEFORE_RELEASE
    http_status: 422
    applies_to: "POST /land-admin/owner-disbursements/{disbursement_id}/payment"
  - priority: 60
    category: business_temporal
    check: "Lease.shut_in_payments_made < MAX_SHUT_IN_PAYMENTS (2) before a SHUT_IN_PAYMENT obligation event is recorded"
    error_id: ERR_SHUT_IN_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /land-admin/leases/{lease_id}/obligation-events"
  - priority: 60
    category: business_temporal
    check: "current_utc is greater than or equal to the logical clock's current value - the clock never runs backwards"
    error_id: ERR_CLOCK_MOVED_BACKWARD
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 60
    category: business_temporal
    check: "BillingDispute.round_count < MAX_DISPUTE_ROUNDS (2)"
    error_id: ERR_MAX_DISPUTE_ROUNDS_EXCEEDED
    http_status: 422
    applies_to: "POST /land-admin/disputes/{dispute_id}/exchanges"

  # ---- 65: referential eligibility of the parties named in the body ----
  - priority: 65
    category: business_referential
    check: "The InterestOwner named as an interest holder, an electing party, a transfer assignor or a transfer assignee has owner_type == WORKING_INTEREST_PARTNER; royalty and overriding-royalty owners hold no working interest and cannot elect or be conveyed one"
    error_id: ERR_OWNER_TYPE_INVALID
    http_status: 422
    applies_to: "POST /land-admin/wells/{well_id}/interests, POST /land-admin/afes/{afe_id}/elections, POST /land-admin/wells/{well_id}/assignment-transfers"
  - priority: 65
    category: business_referential
    check: "The named owner holds an ACTIVE WellInterest on the AFE's well / the disputed statement's well"
    error_id: ERR_NOT_AN_INTEREST_HOLDER
    http_status: 422
    applies_to: "POST /land-admin/afes/{afe_id}/elections, POST /land-admin/jib-statements/{statement_id}/disputes, POST /land-admin/wells/{well_id}/assignment-transfers"
  - priority: 65
    category: business_referential
    check: "The electing owner (X-User-ID) holds an ACTIVE WellInterest on the transfer's well with preferential_right == true and is neither assignor_owner_id nor assignee_owner_id - i.e. it is one of the ppr_eligible_count holders the notice was served on"
    error_id: ERR_PPR_HOLDER_INVALID
    http_status: 403
    applies_to: "POST /land-admin/assignment-transfers/{transfer_id}/ppr-elections"
  - priority: 65
    category: business_referential
    check: "CostEntry.afe_id, when supplied, names an Afe whose well_id equals the path well_id"
    error_id: ERR_COST_AFE_MISMATCH
    http_status: 422
    applies_to: "POST /land-admin/wells/{well_id}/cost-entries"
  - priority: 65
    category: business_referential
    check: "The operator (the ACTIVE WellInterest with is_operator == true) may not submit an election with election_type == NON_CONSENT against its own operated well"
    error_id: ERR_OPERATOR_CANNOT_NON_CONSENT
    http_status: 422
    applies_to: "POST /land-admin/afes/{afe_id}/elections"
  - priority: 65
    category: business_referential
    check: "calculations.afe_consent_tally yields consent_working_interest_pct > 0.000000 - the candidate consenting set is not empty"
    error_id: ERR_NO_CONSENTING_INTEREST
    http_status: 422
    applies_to: "POST /land-admin/afes/{afe_id}/election-closures"

  # ---- 70: uniqueness, overlap, aggregate constraints ----
  - priority: 70
    category: business_constraint
    check: "lease_number is unique across all Leases"
    error_id: ERR_DUPLICATE_LEASE_NUMBER
    http_status: 409
    applies_to: "POST /land-admin/leases"
  - priority: 70
    category: business_constraint
    check: "api_number is unique across all Wells"
    error_id: ERR_DUPLICATE_API_NUMBER
    http_status: 409
    applies_to: "POST /land-admin/wells"
  - priority: 70
    category: business_constraint
    check: "No other COMMITTED WellLeaseAllocation exists for the same (well_id, lease_id) pair"
    error_id: ERR_DUPLICATE_ALLOCATION
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/lease-allocations"
  - priority: 70
    category: business_constraint
    check: "production_month is unique per well across all ProductionRevenue rows"
    error_id: ERR_DUPLICATE_PRODUCTION_MONTH
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/production-revenues"
  - priority: 70
    category: business_constraint
    check: "The proposed CLOSED interval [billing_period_start, billing_period_end] does not intersect the closed interval of any other JibStatement on the same well whose statement_status != VOID. Closed-interval semantics: two periods that merely touch at an endpoint (one ends 2026-06-30, the next starts 2026-06-30) DO collide."
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/jib-statements"
  - priority: 70
    category: business_constraint
    check: "The proposed HALF-OPEN interval [effective_from, effective_to) does not intersect the half-open interval of any other non-TERMINATED WellInterest for the same (well_id, owner_id) pair. Half-open semantics: two intervals that touch at an endpoint (one ends 2026-06-01, the next starts 2026-06-01) are ADJACENT and legal. effective_to == null means unbounded."
    error_id: ERR_INTEREST_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /land-admin/wells/{well_id}/interests"
  - priority: 70
    category: business_constraint
    check: "No BillingDispute already exists for the same (statement_id, owner_id) pair with dispute_status in {OPEN, OPERATOR_RESPONDED, ESCALATED}"
    error_id: ERR_DUPLICATE_OPEN_DISPUTE
    http_status: 409
    applies_to: "POST /land-admin/jib-statements/{statement_id}/disputes"
  - priority: 70
    category: business_constraint
    check: "committed_acres <= Lease.gross_acres - Lease.committed_acres_total, and committed_acres > 0"
    error_id: ERR_ALLOCATION_EXCEEDS_LEASE
    http_status: 422
    applies_to: "POST /land-admin/wells/{well_id}/lease-allocations"
  - priority: 70
    category: business_constraint
    check: "The well has at least 2 COMMITTED WellLeaseAllocation rows"
    error_id: ERR_POOLING_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /land-admin/wells/{well_id}/pooling-effectuation"
  - priority: 70
    category: business_constraint
    check: "The sum of working_interest_pct over ACTIVE WellInterest rows of the well, including the row being created, is <= 1.000000"
    error_id: ERR_WI_SUM_EXCEEDED
    http_status: 422
    applies_to: "POST /land-admin/wells/{well_id}/interests"
  - priority: 70
    category: business_constraint
    check: "net_revenue_interest_pct <= working_interest_pct on the same WellInterest row"
    error_id: ERR_NRI_EXCEEDS_WI
    http_status: 422
    applies_to: "POST /land-admin/wells/{well_id}/interests"
  - priority: 70
    category: business_constraint
    check: "transfer_wi_pct <= the assignor's ACTIVE working_interest_pct on the well, transfer_nri_pct <= transfer_wi_pct, and transfer_nri_pct <= the assignor's ACTIVE net_revenue_interest_pct"
    error_id: ERR_TRANSFER_EXCEEDS_HOLDING
    http_status: 422
    applies_to: "POST /land-admin/wells/{well_id}/assignment-transfers"
  - priority: 70
    category: business_constraint
    check: "calculations.jib_direct_cost_pool selects at least one CostEntry for the statement's period and cost basis"
    error_id: ERR_NO_BILLABLE_COSTS
    http_status: 422
    applies_to: "POST /land-admin/jib-statements/{statement_id}/issuance"
  - priority: 70
    category: business_constraint
    check: "disputed_amount_cents <= the filing owner's JibLineItem.total_billed_cents on the disputed statement, and disputed_amount_cents > 0"
    error_id: ERR_DISPUTE_AMOUNT_EXCEEDS_BILL
    http_status: 422
    applies_to: "POST /land-admin/jib-statements/{statement_id}/disputes"
  - priority: 70
    category: business_constraint
    check: "adjustment_amount_cents <= BillingDispute.disputed_amount_cents when resolution == ADJUSTED, and adjustment_amount_cents == 0 when resolution == UPHELD"
    error_id: ERR_ADJUSTMENT_EXCEEDS_DISPUTE
    http_status: 422
    applies_to: "POST /land-admin/disputes/{dispute_id}/resolution"

  # ---- 75: fiscal capacity, checked last ----
  - priority: 75
    category: business_fiscal
    check: "The assignee InterestOwner has bond_posted_cents >= AssignmentTransfer.bond_check_required_cents (the coverage test is inclusive at equality)"
    error_id: ERR_INSUFFICIENT_BOND
    http_status: 402
    applies_to: "POST /land-admin/assignment-transfers/{transfer_id}/closing"
  - priority: 75
    category: business_fiscal
    check: "Every InterestOwner with an ACTIVE WellInterest on the well has bond_posted_cents >= its recomputed required_bond_cents before the well may move to PLUGGED"
    error_id: ERR_PLUGGING_BOND_SHORTFALL
    http_status: 402
    applies_to: "POST /land-admin/wells/{well_id}/status-changes when to_status == PLUGGED"
  - priority: 75
    category: business_fiscal
    check: "bonus_paid_cents equals round_half_up(Lease.gross_acres * Lease.extension_bonus_per_acre_cents)"
    error_id: ERR_EXTENSION_BONUS_MISMATCH
    http_status: 402
    applies_to: "POST /land-admin/leases/{lease_id}/extension"
  - priority: 75
    category: business_fiscal
    check: "The InterestOwner has suspense_balance_cents == 0 before its last ACTIVE WellInterest may be terminated"
    error_id: ERR_SUSPENSE_BALANCE_NONZERO
    http_status: 409
    applies_to: "POST /land-admin/well-interests/{interest_id}/termination"

endpoints:
  # ---------- logical clock (test-driving, §1.5 ladder rung 3) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; every deadline, window and expiry rule in this scaffold reads this clock. The clock never moves backwards."
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced; no entity is mutated and no obligation is evaluated as a result"]

  # ---------- Lease ----------
  - method: POST
    path: "/land-admin/leases"
    description: "Records an oil and gas lease in the land inventory"
    roles: [LandAdministrator]
    code: 201
    input: [lease_number, lessor_name, gross_acres, royalty_rate, primary_term_end_date, "extension_option_months?", "extension_bonus_per_acre_cents?", "shut_in_royalty_per_acre_cents?", "continuous_dev_window_days?"]
    output: Lease
    side_effects: ["tenure_status = PRIMARY_TERM", "obligation_status = COMPLIANT", "committed_acres_total = 0, held_acres = 0", "version = 1"]
  - method: GET
    path: "/land-admin/leases"
    description: "Lists leases, newest first by created_at DESC"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer]
    code: 200
    input: ["tenure_status?", "obligation_status?", "lease_number?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []
  - method: GET
    path: "/land-admin/leases/{lease_id}"
    description: "Retrieves one lease with its recomputed obligation deadlines"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: POST
    path: "/land-admin/leases/{lease_id}/extension"
    description: "Exercises the lease's extension option against a paid bonus"
    roles: [LandAdministrator]
    code: 200
    input: [bonus_paid_cents]
    output: Lease
    side_effects: ["extension_exercised = true", "extension_bonus_paid_cents = bonus_paid_cents", "primary_term_end_date advanced by extension_option_months calendar months", "version incremented by 1"]
  - method: POST
    path: "/land-admin/leases/{lease_id}/obligation-events"
    description: "Records a lease-maintenance event: SHUT_IN_PAYMENT, CONTINUOUS_OPERATION or PRODUCTION_ESTABLISHED"
    roles: [LandAdministrator]
    code: 200
    input: [event_type, event_date, "operation_end_date?", "shut_in_start_date?"]
    output: Lease
    side_effects: ["SHUT_IN_PAYMENT: shut_in_start_date set on the first payment, shut_in_payments_made incremented, shut_in_next_due_date recomputed per calculations.lease_obligation_deadlines, tenure_status = SHUT_IN_HELD", "CONTINUOUS_OPERATION: last_operation_end_date = operation_end_date, continuous_dev_deadline recomputed, tenure_status = CONTINUOUS_DEV_HELD", "PRODUCTION_ESTABLISHED: tenure_status = HELD_BY_PRODUCTION", "obligation_status = CURED when it was OBLIGATION_DUE or IN_BREACH", "version incremented by 1"]

  # ---------- Well ----------
  - method: POST
    path: "/land-admin/wells"
    description: "Creates a well in the operator's inventory"
    roles: [LandAdministrator]
    code: 201
    input: [well_name, api_number, product_type, total_depth_ft, "spud_date?"]
    output: Well
    side_effects: ["well_status = PROPOSED", "pooling_status = UNPOOLED", "plugging_liability_cents computed per calculations.plugging_liability_estimate", "allocation_factor_total = 0, consent_working_interest_pct = 0, billed_to_date_cents = 0", "version = 1"]
  - method: GET
    path: "/land-admin/wells"
    description: "Lists wells"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["well_status?", "pooling_status?", "product_type?", "limit?", "offset?"]
    output: Well[]
    side_effects: []
  - method: GET
    path: "/land-admin/wells/{well_id}"
    description: "Retrieves one well including its derived allocation_factor_total, consent_working_interest_pct and billed_to_date_cents ledger"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: Well
    side_effects: []
  - method: POST
    path: "/land-admin/wells/{well_id}/status-changes"
    description: "Drives the Well well_status dimension: PROPOSED -> DRILLING -> PRODUCING <-> SHUT_IN -> TEMPORARILY_ABANDONED -> PLUGGED"
    roles: [LandAdministrator]
    code: 200
    input: [to_status, effective_date, "expected_well_version?"]
    output: Well
    side_effects: ["well_status = to_status", "first_production_date set on the first move to PRODUCING", "shut_in_since set on SHUT_IN and cleared on return to PRODUCING", "PLUGGED: plugging_liability_cents frozen and every ACTIVE WellInterest's bond coverage re-verified per calculations.bond_coverage_requirement", "version incremented by 1"]
  - method: POST
    path: "/land-admin/wells/{well_id}/lease-allocations"
    description: "Commits acreage from a lease to this well's pooled unit"
    roles: [LandAdministrator]
    code: 201
    input: [lease_id, committed_acres]
    output: WellLeaseAllocation
    side_effects: ["allocation_status = COMMITTED", "every allocation_factor on the well and Well.allocation_factor_total recomputed per calculations.unit_allocation_factor", "Lease.committed_acres_total and Lease.held_acres recomputed", "Well.version incremented by 1", "Lease.version incremented by 1"]
  - method: GET
    path: "/land-admin/lease-allocations"
    description: "Lists lease-to-well acreage allocations"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer]
    code: 200
    input: ["well_id?", "lease_id?", "allocation_status?", "limit?", "offset?"]
    output: WellLeaseAllocation[]
    side_effects: []
  - method: GET
    path: "/land-admin/lease-allocations/{allocation_id}"
    description: "Retrieves one lease-to-well acreage allocation with its current allocation_factor"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer]
    code: 200
    input: []
    output: WellLeaseAllocation
    side_effects: []
  - method: POST
    path: "/land-admin/wells/{well_id}/pooling-effectuation"
    description: "Declares the pooled unit effective once at least two leases are committed and every committed lease is still held"
    roles: [LandAdministrator]
    code: 200
    input: [effective_date]
    output: Well
    side_effects: ["pooling_status = POOLED_FORMING -> POOLED_EFFECTIVE", "allocation_factor_total re-verified as exactly 1.000000", "version incremented by 1"]

  # ---------- InterestOwner ----------
  - method: POST
    path: "/land-admin/interest-owners"
    description: "Registers a working-interest partner, royalty owner or overriding-royalty owner"
    roles: [LandAdministrator]
    code: 201
    input: [owner_name, owner_type, contact_email, "tax_id_on_file?", "bond_posted_cents?", "audit_window_days?"]
    output: InterestOwner
    side_effects: ["required_bond_cents = 0, suspense_balance_cents = 0", "version = 1"]
  - method: GET
    path: "/land-admin/interest-owners"
    description: "Lists interest owners"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer]
    code: 200
    input: ["owner_type?", "limit?", "offset?"]
    output: InterestOwner[]
    side_effects: []
  - method: GET
    path: "/land-admin/interest-owners/{owner_id}"
    description: "Retrieves one interest owner including its derived required_bond_cents and suspense_balance_cents"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: InterestOwner
    side_effects: []
  - method: POST
    path: "/land-admin/interest-owners/{owner_id}/compliance-updates"
    description: "Updates an owner's compliance posture: tax id on file, bond posted, contractual audit window"
    roles: [ComplianceOfficer]
    code: 200
    input: ["tax_id_on_file?", "bond_posted_cents?", "audit_window_days?"]
    output: InterestOwner
    side_effects: ["required_bond_cents recomputed per calculations.bond_coverage_requirement", "version incremented by 1"]
  - method: GET
    path: "/land-admin/interest-owners/{id}/jib-line-items"
    description: "Lists every JIB line item billed to this owner across statements (the only discovery channel for line items synthesized by statement issuance)"
    roles: [LandAdministrator, JointInterestAccountant, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["statement_status?", "limit?", "offset?"]
    output: JibLineItem[]
    side_effects: []

  # ---------- WellInterest ----------
  - method: POST
    path: "/land-admin/wells/{well_id}/interests"
    description: "Records a working-interest / net-revenue-interest position on a well over a half-open effective interval. Optimistic concurrency: expected_well_version must equal the well's current version."
    roles: [LandAdministrator]
    code: 201
    input: [owner_id, working_interest_pct, net_revenue_interest_pct, effective_from, expected_well_version, "effective_to?", "is_operator?", "preferential_right?"]
    output: WellInterest
    side_effects: ["interest_status = ACTIVE", "non_consent_flag = false, non_consent_recoverable_balance_cents = 0", "InterestOwner.required_bond_cents recomputed per calculations.bond_coverage_requirement", "Well.consent_working_interest_pct recomputed", "increments Well.version by 1", "version = 1"]
  - method: GET
    path: "/land-admin/well-interests"
    description: "Lists working-interest positions"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["well_id?", "owner_id?", "interest_status?", "non_consent_flag?", "limit?", "offset?"]
    output: WellInterest[]
    side_effects: []
  - method: GET
    path: "/land-admin/well-interests/{interest_id}"
    description: "Retrieves one working-interest position including its non_consent_recoverable_balance_cents"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: WellInterest
    side_effects: []
  - method: POST
    path: "/land-admin/well-interests/{interest_id}/termination"
    description: "Terminates a working-interest position; blocked while the owner still carries a suspense balance"
    roles: [LandAdministrator]
    code: 200
    input: [effective_to]
    output: WellInterest
    side_effects: ["interest_status = TERMINATED", "InterestOwner.required_bond_cents recomputed", "Well.consent_working_interest_pct recomputed", "increments Well.version by 1", "version incremented by 1"]

  # ---------- Afe ----------
  - method: POST
    path: "/land-admin/wells/{well_id}/afes"
    description: "Issues an authorization for expenditure to the well's working-interest partners"
    roles: [LandAdministrator]
    code: 201
    input: [afe_number, operation_type, estimated_cost_cents, cost_class, election_deadline_date, "non_consent_penalty_multiple?", "minimum_consent_pct?"]
    output: Afe
    side_effects: ["afe_status = ELECTIONS_OPEN", "consent_working_interest_pct = 0, non_consent_working_interest_pct = 0", "version = 1"]
  - method: GET
    path: "/land-admin/afes"
    description: "Lists authorizations for expenditure"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["well_id?", "afe_status?", "cost_class?", "limit?", "offset?"]
    output: Afe[]
    side_effects: []
  - method: GET
    path: "/land-admin/afes/{afe_id}"
    description: "Retrieves one AFE with its consent tally"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: Afe
    side_effects: []
  - method: POST
    path: "/land-admin/afes/{afe_id}/elections"
    description: "Submits a partner's consent or non-consent election against an AFE"
    roles: [PartnerRepresentative, LandAdministrator]
    code: 201
    input: [owner_id, election_type]
    output: AfeElection
    side_effects: ["election_status = SUBMITTED", "wi_pct_snapshot copied from the owner's ACTIVE WellInterest.working_interest_pct", "submitted_at = the logical clock", "estimated_penalty_cents = round_half_up(Afe.estimated_cost_cents * wi_pct_snapshot * Afe.non_consent_penalty_multiple) for NON_CONSENT, else 0", "Afe.version incremented by 1", "version = 1"]
  - method: GET
    path: "/land-admin/afe-elections"
    description: "Lists AFE elections, including the DEEMED_NON_CONSENT rows synthesized at election closure"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["afe_id?", "owner_id?", "election_status?", "election_type?", "limit?", "offset?"]
    output: AfeElection[]
    side_effects: []
  - method: GET
    path: "/land-admin/afe-elections/{election_id}"
    description: "Retrieves one AFE election"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: AfeElection
    side_effects: []
  - method: POST
    path: "/land-admin/afes/{afe_id}/election-closures"
    description: "Closes the election window and tallies consent per calculations.afe_consent_tally; silent partners are deemed non-consent"
    roles: [LandAdministrator]
    code: 200
    input: []
    output: Afe
    side_effects: ["elections_closed_at = the logical clock", "consent_working_interest_pct / non_consent_working_interest_pct written", "afe_status = FULLY_CONSENTED, PARTIALLY_CONSENTED or FAILED", "CASCADE hop 1: a DEEMED_NON_CONSENT AfeElection is created for every ACTIVE non-operator working-interest holder that filed no SUBMITTED election; the operator is deemed consenting and never receives a synthesized row", "CASCADE hop 2: WellInterest.non_consent_flag = true for every non-consenting owner; the recoverable balance itself accrues later, at JIB issuance", "CASCADE hop 3: Well.consent_working_interest_pct recomputed and Well.version incremented by 1", "CASCADE hop 4: each newly non-consenting owner's ACCRUED OwnerDisbursement rows move to SUSPENDED with suspense_reason = NON_CONSENT_RECOVERY and InterestOwner.suspense_balance_cents recomputed", "version incremented by 1"]

  # ---------- CostEntry ----------
  - method: POST
    path: "/land-admin/wells/{well_id}/cost-entries"
    description: "Books a joint-account cost against a well, optionally under an AFE"
    roles: [JointInterestAccountant]
    code: 201
    input: [cost_category, cost_class, amount_cents, incurred_date, "afe_id?", "paid_date?"]
    output: CostEntry
    side_effects: ["cost_status = PAID when paid_date is supplied, else ACCRUED", "version = 1"]
  - method: GET
    path: "/land-admin/cost-entries"
    description: "Lists joint-account costs"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer]
    code: 200
    input: ["well_id?", "afe_id?", "cost_status?", "cost_class?", "limit?", "offset?"]
    output: CostEntry[]
    side_effects: []
  - method: GET
    path: "/land-admin/cost-entries/{cost_entry_id}"
    description: "Retrieves one joint-account cost"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer]
    code: 200
    input: []
    output: CostEntry
    side_effects: []
  - method: POST
    path: "/land-admin/cost-entries/{cost_entry_id}/payment"
    description: "Marks an accrued joint-account cost as settled on a given date, which is what moves it into a CASH-basis billing period"
    roles: [JointInterestAccountant]
    code: 200
    input: [paid_date]
    output: CostEntry
    side_effects: ["cost_status = PAID", "paid_date set", "version incremented by 1"]

  # ---------- JibStatement / JibLineItem ----------
  - method: POST
    path: "/land-admin/wells/{well_id}/jib-statements"
    description: "Opens a DRAFT joint interest billing statement for a closed billing period, choosing the cost basis and the overhead rate class"
    roles: [JointInterestAccountant]
    code: 201
    input: [statement_number, billing_period_start, billing_period_end, cost_basis, activity_class, overhead_rate_class]
    output: JibStatement
    side_effects: ["statement_status = DRAFT", "prepared_by_user_id = the acting X-User-ID", "provisional capital_direct_cents / operating_direct_cents / direct_cost_cents per calculations.jib_direct_cost_pool", "provisional billable_months / overhead_cents per calculations.overhead_charge", "total_billed_cents = direct_cost_cents + overhead_cents", "superseded_statement_id = null", "version = 1"]
  - method: GET
    path: "/land-admin/jib-statements"
    description: "Lists JIB statements, including revisions discoverable through superseded_statement_id"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["well_id?", "superseded_statement_id?", "statement_status?", "cost_basis?", "limit?", "offset?"]
    output: JibStatement[]
    side_effects: []
  - method: GET
    path: "/land-admin/jib-statements/{statement_id}"
    description: "Retrieves one JIB statement with its authoritative cost pool, overhead and total"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: JibStatement
    side_effects: []
  - method: GET
    path: "/land-admin/jib-statements/{id}/line-items"
    description: "Lists the per-owner line items synthesized when the statement was issued; the only discovery channel for them"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["owner_id?", "limit?", "offset?"]
    output: JibLineItem[]
    side_effects: []
  - method: POST
    path: "/land-admin/jib-statements/{statement_id}/issuance"
    description: "Issues the statement: recomputes the cost pool, overhead, non-consent reallocation and per-owner rounding, then bills the partners"
    roles: [JointInterestAccountant]
    code: 200
    input: []
    output: JibStatement
    side_effects: ["capital_direct_cents / operating_direct_cents / direct_cost_cents recomputed per calculations.jib_direct_cost_pool", "billable_months / overhead_cents recomputed per calculations.overhead_charge", "consent_normalized_wi_pct, non_consent_withheld_cents, non_consent_reallocated_cents and penalty_accrued_cents computed per calculations.non_consent_reallocation", "one JibLineItem created per ACTIVE working-interest owner per calculations.jib_owner_share_rounding", "total_billed_cents = direct_cost_cents + overhead_cents", "issued_at = the logical clock; payment_due_date = date(issued_at) + 30 days", "statement_status = ISSUED", "Well.billed_to_date_cents += total_billed_cents and Well.version incremented by 1", "WellInterest.non_consent_recoverable_balance_cents += non_consent_withheld_cents + penalty_accrued_cents for each non-consenting owner", "version incremented by 1"]
  - method: POST
    path: "/land-admin/jib-statements/{statement_id}/revisions"
    description: "Supersedes an issued statement with a fresh DRAFT covering the same period. Optimistic concurrency: expected_jib_statement_version must equal the superseded statement's current version."
    roles: [JointInterestAccountant]
    code: 201
    input: [statement_number, expected_jib_statement_version, "cost_basis?", "activity_class?", "overhead_rate_class?"]
    output: JibStatement
    side_effects: ["a new JibStatement is created in DRAFT with superseded_statement_id = the addressed statement and the same billing period", "the addressed statement moves to ADJUSTED", "Well.billed_to_date_cents -= the addressed statement's total_billed_cents and Well.version incremented by 1", "WellInterest.non_consent_recoverable_balance_cents reduced by the withheld and penalty amounts the addressed statement had added", "increments the addressed JibStatement.version by 1", "the new statement's version = 1"]
  - method: POST
    path: "/land-admin/jib-statements/{statement_id}/void"
    description: "Voids a draft or issued statement and reverses every ledger effect it produced"
    roles: [JointInterestAccountant]
    code: 200
    input: [void_reason]
    output: JibStatement
    side_effects: ["statement_status = VOID", "when the statement was ISSUED: Well.billed_to_date_cents -= total_billed_cents, Well.version incremented by 1, and WellInterest.non_consent_recoverable_balance_cents reduced by the withheld and penalty amounts this statement had added", "when the statement was DRAFT: no ledger change", "every JibLineItem of the statement is retained for audit but excluded from all balances", "version incremented by 1"]
  - method: POST
    path: "/land-admin/jib-statements/{statement_id}/settlement"
    description: "Marks an issued statement as settled once no dispute remains open against it"
    roles: [JointInterestAccountant]
    code: 200
    input: [settled_on]
    output: JibStatement
    side_effects: ["statement_status = SETTLED", "Well.billed_to_date_cents unchanged - SETTLED stays inside the billed set", "version incremented by 1"]

  # ---------- BillingDispute ----------
  - method: POST
    path: "/land-admin/jib-statements/{statement_id}/disputes"
    description: "Files an audit exception (partner audit right) or a billing dispute against an issued statement"
    roles: [PartnerRepresentative, AuditReviewer]
    code: 201
    input: [owner_id, dispute_kind, disputed_amount_cents, basis_note]
    output: BillingDispute
    side_effects: ["dispute_status = OPEN, round_count = 0", "filed_at = the logical clock", "response_due_date = date(filed_at) + 60 days; rebuttal_due_date = response_due_date + 30 days", "adjustment_amount_cents = 0, deemed_in_favor_of_partner = false", "JibStatement.statement_status = DISPUTED, which keeps the statement inside Well.billed_to_date_cents", "increments JibStatement.version by 1", "version = 1"]
  - method: GET
    path: "/land-admin/disputes"
    description: "Lists billing disputes and audit exceptions"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["statement_id?", "owner_id?", "dispute_status?", "dispute_kind?", "limit?", "offset?"]
    output: BillingDispute[]
    side_effects: []
  - method: GET
    path: "/land-admin/disputes/{dispute_id}"
    description: "Retrieves one dispute with its response and rebuttal deadlines and round count"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: BillingDispute
    side_effects: []
  - method: POST
    path: "/land-admin/disputes/{dispute_id}/exchanges"
    description: "Records one move in the dispute exchange: exchange_type is OPERATOR_RESPONSE (operator answers), PARTNER_REBUTTAL (partner opens another round) or PARTNER_ESCALATION (partner escalates to the audit reviewer)"
    roles: [JointInterestAccountant, PartnerRepresentative, AuditReviewer]
    code: 200
    input: [exchange_type, exchange_note, "disputed_amount_cents?"]
    output: BillingDispute
    side_effects: ["OPERATOR_RESPONSE: dispute_status = OPERATOR_RESPONDED, operator_responded_at = the logical clock, rebuttal_due_date = date(operator_responded_at) + 30 days", "PARTNER_REBUTTAL: dispute_status = OPEN, round_count incremented by 1, response_due_date = the logical clock's date + 60 days, operator_responded_at cleared", "PARTNER_ESCALATION: dispute_status = ESCALATED", "version incremented by 1"]
  - method: POST
    path: "/land-admin/disputes/{dispute_id}/resolution"
    description: "An independent audit reviewer resolves the dispute: outcome is UPHELD or ADJUSTED. Segregation of duties - the reviewer's X-User-ID must differ from the disputed statement's prepared_by_user_id."
    roles: [AuditReviewer]
    code: 200
    input: [outcome, adjustment_amount_cents]
    output: BillingDispute
    side_effects: ["UPHELD: dispute_status = RESOLVED_UPHELD, adjustment_amount_cents = 0, the JibStatement returns from DISPUTED to ISSUED once no other dispute on it is open", "ADJUSTED: dispute_status = RESOLVED_ADJUSTED and the JibStatement moves DISPUTED -> ADJUSTED", "resolved_by_user_id = the acting X-User-ID", "ADJUSTED CASCADE hop 1: Well.billed_to_date_cents -= the statement's total_billed_cents and Well.version incremented by 1", "ADJUSTED CASCADE hop 2: a superseding DRAFT JibStatement is created with superseded_statement_id = the adjusted statement and the same billing period", "ADJUSTED CASCADE hop 3: every other dispute on the adjusted statement still in OPEN, OPERATOR_RESPONDED or ESCALATED moves to EXPIRED with deemed_in_favor_of_partner = true", "increments JibStatement.version by 1", "version incremented by 1"]

  # ---------- ProductionRevenue / OwnerDisbursement ----------
  - method: POST
    path: "/land-admin/wells/{well_id}/production-revenues"
    description: "Books a month of gross sales proceeds for a producing well"
    roles: [JointInterestAccountant]
    code: 201
    input: [production_month, gross_revenue_cents, volume_units, sale_date]
    output: ProductionRevenue
    side_effects: ["distribution_status = ACCRUED", "statutory_due_date = last calendar day of production_month + 60 days for OIL or + 90 days for GAS", "severance_tax_cents / net_proceeds_cents / total_royalty_cents / total_disbursed_cents all 0 until release", "version = 1"]
  - method: GET
    path: "/land-admin/production-revenues"
    description: "Lists monthly production revenue records"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["well_id?", "distribution_status?", "production_month?", "limit?", "offset?"]
    output: ProductionRevenue[]
    side_effects: []
  - method: GET
    path: "/land-admin/production-revenues/{revenue_id}"
    description: "Retrieves one monthly revenue record with its waterfall totals and statutory_due_date"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: ProductionRevenue
    side_effects: []
  - method: POST
    path: "/land-admin/production-revenues/{revenue_id}/release"
    description: "Runs the revenue waterfall and creates one disbursement per interest owner per committed lease"
    roles: [JointInterestAccountant]
    code: 200
    input: []
    output: ProductionRevenue
    side_effects: ["severance_tax_cents, net_proceeds_cents, total_royalty_cents and total_disbursed_cents computed per calculations.revenue_distribution_waterfall", "one OwnerDisbursement created per (COMMITTED allocation, ACTIVE WellInterest) pair", "each disbursement starts ACCRUED, or SUSPENDED with suspense_reason = MISSING_TAX_ID when the owner has tax_id_on_file == false", "WellInterest.non_consent_recoverable_balance_cents reduced by the recovered amounts", "InterestOwner.suspense_balance_cents recomputed", "distribution_status = RELEASED; released_at = the logical clock", "the invariant gross_revenue_cents == severance_tax_cents + total_royalty_cents + total_disbursed_cents holds after this call", "version incremented by 1"]
  - method: GET
    path: "/land-admin/owner-disbursements"
    description: "Lists owner disbursements; PartnerRepresentative callers may only list their own"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["revenue_id?", "owner_id?", "lease_id?", "disbursement_status?", "suspense_reason?", "limit?", "offset?"]
    output: OwnerDisbursement[]
    side_effects: []
  - method: GET
    path: "/land-admin/owner-disbursements/{disbursement_id}"
    description: "Retrieves one owner disbursement with its withheld recovery, net amount and late interest"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: OwnerDisbursement
    side_effects: []
  - method: POST
    path: "/land-admin/owner-disbursements/{disbursement_id}/suspense-release"
    description: "Lifts a suspense hold once its cause is cured, returning the disbursement to ACCRUED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OwnerDisbursement
    side_effects: ["disbursement_status = ACCRUED; suspense_reason cleared", "InterestOwner.suspense_balance_cents recomputed", "version incremented by 1"]
  - method: POST
    path: "/land-admin/owner-disbursements/{disbursement_id}/payment"
    description: "Pays an accrued disbursement and computes statutory late interest per calculations.statutory_late_interest. interest_basis may be supplied to force a variant; when omitted the rule in that calculation selects it."
    roles: [JointInterestAccountant]
    code: 200
    input: ["interest_basis?"]
    output: OwnerDisbursement
    side_effects: ["late_interest_cents and interest_basis computed per calculations.statutory_late_interest", "paid_at = the logical clock; disbursement_status = PAID", "version incremented by 1"]

  # ---------- AssignmentTransfer ----------
  - method: POST
    path: "/land-admin/wells/{well_id}/assignment-transfers"
    description: "Serves notice of a proposed assignment of working interest, opening the preferential-purchase-right window"
    roles: [LandAdministrator]
    code: 201
    input: [assignor_owner_id, assignee_owner_id, transfer_wi_pct, transfer_nri_pct, sale_price_cents, notice_date, effective_date]
    output: AssignmentTransfer
    side_effects: ["transfer_status = NOTICED, or PPR_WAIVED immediately when ppr_eligible_count == 0", "ppr_deadline_date = notice_date + 30 days", "ppr_eligible_count = the number of ACTIVE WellInterest holders on the well with preferential_right == true excluding the assignor and the named assignee", "ppr_waiver_count = 0; ppr_holder_owner_id = null", "bond_check_required_cents computed per calculations.bond_coverage_requirement for the prospective grantee", "version = 1"]
  - method: GET
    path: "/land-admin/assignment-transfers"
    description: "Lists assignment notices"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: ["well_id?", "assignor_owner_id?", "assignee_owner_id?", "ppr_holder_owner_id?", "transfer_status?", "limit?", "offset?"]
    output: AssignmentTransfer[]
    side_effects: []
  - method: GET
    path: "/land-admin/assignment-transfers/{transfer_id}"
    description: "Retrieves one assignment notice with its preferential-right tally and bond requirement"
    roles: [LandAdministrator, JointInterestAccountant, ComplianceOfficer, AuditReviewer, PartnerRepresentative]
    code: 200
    input: []
    output: AssignmentTransfer
    side_effects: []
  - method: POST
    path: "/land-admin/assignment-transfers/{transfer_id}/ppr-elections"
    description: "A preferential-right holder either EXERCISEs its right to take the interest on the same terms, or WAIVEs it"
    roles: [PartnerRepresentative]
    code: 200
    input: [election]
    output: AssignmentTransfer
    side_effects: ["EXERCISE: transfer_status = PPR_EXERCISED and ppr_holder_owner_id = the electing owner", "WAIVE: ppr_waiver_count incremented by 1; transfer_status = PPR_WAIVED only when ppr_waiver_count reaches ppr_eligible_count, otherwise it stays NOTICED", "bond_check_required_cents recomputed for the prospective grantee", "version incremented by 1"]
  - method: POST
    path: "/land-admin/assignment-transfers/{transfer_id}/closing"
    description: "Records the conveyance: supersedes the assignor's interest and creates the grantee's, conserving the well's total working and net revenue interest"
    roles: [LandAdministrator]
    code: 200
    input: [closing_date]
    output: AssignmentTransfer
    side_effects: ["transfer_status = CLOSED", "the assignor's ACTIVE WellInterest is SUPERSEDED and replaced by a new ACTIVE row reduced by transfer_wi_pct / transfer_nri_pct with effective_from = closing_date", "a new ACTIVE WellInterest is created for the grantee - ppr_holder_owner_id on the preferential-right branch, otherwise assignee_owner_id - with transfer_wi_pct / transfer_nri_pct and effective_from = closing_date", "the sum of working_interest_pct and the sum of net_revenue_interest_pct over ACTIVE interests on the well are unchanged (conserved invariant)", "required_bond_cents recomputed for both parties", "increments Well.version by 1", "version incremented by 1"]

  # ---------- system obligation evaluation ----------
  - method: POST
    path: "/land-admin/obligation-runs"
    description: "Evaluates every time-gated obligation against the logical clock in one pass: lease expiries and obligation warnings, deemed dispute escalations and expiries, deemed preferential-right waivers. Idempotent - a second run at the same clock value changes nothing."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: "{ evaluated_at: datetime, leases_expired: integer, leases_flagged_obligation_due: integer, leases_in_breach: integer, disputes_escalated: integer, disputes_expired: integer, transfers_deemed_waived: integer, allocations_withdrawn: integer, revenues_suspended: integer, disbursements_suspended: integer }"
    side_effects: ["Lease tenure_status and obligation_status transitions whose date preconditions are met", "the four-hop Lease EXPIRED cascade: WellLeaseAllocation WITHDRAWN -> Well POOLED_TERMINATED -> ProductionRevenue SUSPENDED -> OwnerDisbursement SUSPENDED", "BillingDispute OPEN -> ESCALATED past response_due_date and OPERATOR_RESPONDED -> EXPIRED past rebuttal_due_date", "AssignmentTransfer NOTICED -> PPR_WAIVED past ppr_deadline_date", "version incremented by 1 on every entity this run mutates"]

errors:
  # --- authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_OWNER_MISMATCH
    http: 403
    condition: "A PartnerRepresentative addresses a resource whose owner_id differs from its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The audit reviewer resolving a dispute is the same user id that prepared the disputed statement"
  - id: ERR_PPR_HOLDER_INVALID
    http: 403
    condition: "The acting owner is not an eligible preferential-right holder on the addressed transfer"

  # --- schema ---
  - id: ERR_VALIDATION
    http: 400
    condition: "A required input field is missing or null, an enum value is undeclared, a cent field is negative, a percentage falls outside [0.000000, 1.000000] or carries more than 6 decimals, or a date is not a valid ISO-8601 calendar date"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit outside [1, 100] or offset negative"

  # --- existence ---
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "lease_id in the path or body matches no Lease"
  - id: ERR_WELL_NOT_FOUND
    http: 404
    condition: "well_id in the path matches no Well"
  - id: ERR_INTEREST_OWNER_NOT_FOUND
    http: 404
    condition: "owner_id, assignor_owner_id or assignee_owner_id matches no InterestOwner"
  - id: ERR_WELL_INTEREST_NOT_FOUND
    http: 404
    condition: "interest_id in the path matches no WellInterest"
  - id: ERR_AFE_NOT_FOUND
    http: 404
    condition: "afe_id in the path or body matches no Afe"
  - id: ERR_JIB_STATEMENT_NOT_FOUND
    http: 404
    condition: "statement_id in the path matches no JibStatement"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute_id in the path matches no BillingDispute"
  - id: ERR_PRODUCTION_REVENUE_NOT_FOUND
    http: 404
    condition: "revenue_id in the path matches no ProductionRevenue"
  - id: ERR_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "disbursement_id in the path matches no OwnerDisbursement"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "transfer_id in the path matches no AssignmentTransfer"

  # --- optimistic concurrency ---
  - id: ERR_STALE_WELL_VERSION
    http: 412
    condition: "expected_well_version does not equal the addressed Well's current version"
  - id: ERR_STALE_STATEMENT_VERSION
    http: 412
    condition: "expected_jib_statement_version does not equal the addressed JibStatement's current version"

  # --- own-entity state ---
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "A mutation is attempted on an entity already in a terminal state (Lease EXPIRED, Well PLUGGED, JibStatement ADJUSTED / SETTLED / VOID, BillingDispute RESOLVED_UPHELD / RESOLVED_ADJUSTED / EXPIRED, AssignmentTransfer CLOSED, OwnerDisbursement PAID, WellInterest TERMINATED)"
  - id: ERR_WELL_INVALID_STATUS
    http: 409
    condition: "The requested to_status is not a declared transition out of the well's current well_status"
  - id: ERR_POOLING_NOT_FORMING
    http: 409
    condition: "Pooling effectuation attempted on a well whose pooling_status is not POOLED_FORMING (already effective, terminated, or still unpooled)"
  - id: ERR_EXTENSION_NOT_AVAILABLE
    http: 409
    condition: "The lease has no extension option, has already exercised it, or is no longer in PRIMARY_TERM"
  - id: ERR_AFE_ELECTIONS_CLOSED
    http: 409
    condition: "An election or a closure is attempted on an AFE whose afe_status is not ELECTIONS_OPEN"
  - id: ERR_ELECTION_ALREADY_SUBMITTED
    http: 409
    condition: "The owner already has an AfeElection with election_status == SUBMITTED on this AFE"
  - id: ERR_STATEMENT_NOT_DRAFT
    http: 409
    condition: "Issuance attempted on a statement whose statement_status is not DRAFT"
  - id: ERR_STATEMENT_NOT_VOIDABLE
    http: 409
    condition: "Void attempted on a statement whose statement_status is neither DRAFT nor ISSUED"
  - id: ERR_STATEMENT_NOT_DISPUTABLE
    http: 409
    condition: "A dispute is filed on a statement whose statement_status is neither ISSUED nor DISPUTED"
  - id: ERR_STATEMENT_NOT_SETTLEABLE
    http: 409
    condition: "Settlement attempted on a statement that is not ISSUED, or that still carries a BillingDispute in OPEN, OPERATOR_RESPONDED or ESCALATED"
  - id: ERR_DISPUTE_NOT_OPEN
    http: 409
    condition: "An OPERATOR_RESPONSE exchange is attempted on a dispute whose dispute_status is not OPEN"
  - id: ERR_DISPUTE_NOT_RESOLVABLE
    http: 409
    condition: "A resolution, rebuttal or escalation is attempted on a dispute in the wrong dispute_status"
  - id: ERR_REVENUE_NOT_ACCRUED
    http: 409
    condition: "Release attempted on a ProductionRevenue whose distribution_status is not ACCRUED"
  - id: ERR_DISBURSEMENT_NOT_PAYABLE
    http: 409
    condition: "Payment attempted on a disbursement whose disbursement_status is not ACCRUED"
  - id: ERR_TRANSFER_NOT_PENDING
    http: 409
    condition: "A preferential-right election is attempted on a transfer whose transfer_status is not NOTICED"
  - id: ERR_PPR_ELECTION_ALREADY_SUBMITTED
    http: 409
    condition: "The acting owner already recorded a preferential-right election on this transfer"
  - id: ERR_TRANSFER_NOT_CLOSEABLE
    http: 409
    condition: "Closing attempted on a transfer whose transfer_status is neither PPR_WAIVED nor PPR_EXERCISED"
  - id: ERR_INTEREST_NOT_ACTIVE
    http: 409
    condition: "The addressed or referenced WellInterest has interest_status other than ACTIVE"

  # --- cross-entity state ---
  - id: ERR_WELL_NOT_POOLED
    http: 409
    condition: "Statement issuance, or a PROPOSED -> DRILLING status change, attempted while the well's pooling_status is not POOLED_EFFECTIVE"
  - id: ERR_NO_OPERATOR_INTEREST
    http: 409
    condition: "A well is moved to PRODUCING while it carries no ACTIVE WellInterest with is_operator == true"
  - id: ERR_LEASE_NOT_HELD
    http: 409
    condition: "Pooling effectuation attempted while at least one committed lease has tenure_status == EXPIRED"
  - id: ERR_WELL_NOT_PRODUCING
    http: 409
    condition: "Revenue booking attempted on a well whose well_status is neither PRODUCING nor SHUT_IN"
  - id: ERR_LEASE_NOT_ACTIVE
    http: 409
    condition: "An allocation is committed against a Lease whose tenure_status is EXPIRED"
  - id: ERR_OWNER_NOT_COMPLIANT
    http: 409
    condition: "Transfer closing attempted while the grantee has tax_id_on_file == false"
  - id: ERR_UNSETTLED_STATEMENTS
    http: 409
    condition: "A well is moved to PLUGGED while a JibStatement on it is still ISSUED or DISPUTED"

  # --- temporal ---
  - id: ERR_PERIOD_NOT_CLOSED
    http: 422
    condition: "Issuance attempted while billing_period_end is on or after the logical clock's calendar date"
  - id: ERR_PERIOD_INVALID
    http: 422
    condition: "billing_period_start is after billing_period_end"
  - id: ERR_ELECTION_DEADLINE_PASSED
    http: 422
    condition: "An election is submitted after the AFE's election_deadline_date"
  - id: ERR_ELECTION_WINDOW_OPEN
    http: 422
    condition: "Election closure attempted on or before the AFE's election_deadline_date while at least one non-operator ACTIVE interest holder has not yet submitted an election"
  - id: ERR_AUDIT_WINDOW_EXPIRED
    http: 422
    condition: "An AUDIT_EXCEPTION is filed more than audit_window_days after the statement was issued"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 422
    condition: "A BILLING_DISPUTE is filed after the statement's payment_due_date"
  - id: ERR_DISPUTE_DEADLINE_PASSED
    http: 422
    condition: "The operator responds after the dispute's response_due_date"
  - id: ERR_REBUTTAL_DEADLINE_PASSED
    http: 422
    condition: "The partner rebuts or escalates after the dispute's rebuttal_due_date"
  - id: ERR_MAX_DISPUTE_ROUNDS_EXCEEDED
    http: 422
    condition: "A rebuttal is attempted when round_count has already reached MAX_DISPUTE_ROUNDS (2)"
  - id: ERR_PPR_WINDOW_EXPIRED
    http: 422
    condition: "A preferential-right election is attempted after ppr_deadline_date"
  - id: ERR_PPR_WINDOW_OPEN
    http: 422
    condition: "Closing attempted while the preferential-right window is still open and not every eligible holder has waived"
  - id: ERR_EFFECTIVE_DATE_OUT_OF_RANGE
    http: 422
    condition: "effective_date is earlier than notice_date on an assignment notice"
  - id: ERR_PAYMENT_BEFORE_RELEASE
    http: 422
    condition: "Payment attempted before the parent ProductionRevenue has been released"
  - id: ERR_SHUT_IN_LIMIT_EXCEEDED
    http: 422
    condition: "A third shut-in royalty payment is recorded on a lease that has already made MAX_SHUT_IN_PAYMENTS (2)"
  - id: ERR_CLOCK_MOVED_BACKWARD
    http: 422
    condition: "current_utc is earlier than the logical clock's current value"

  # --- referential eligibility ---
  - id: ERR_OWNER_TYPE_INVALID
    http: 422
    condition: "An owner whose owner_type is not WORKING_INTEREST_PARTNER is given a working interest, files an election, or is named as an assignment party"
  - id: ERR_NOT_AN_INTEREST_HOLDER
    http: 422
    condition: "The named owner holds no ACTIVE WellInterest on the relevant well"
  - id: ERR_COST_AFE_MISMATCH
    http: 422
    condition: "A cost entry references an AFE that belongs to a different well"
  - id: ERR_OPERATOR_CANNOT_NON_CONSENT
    http: 422
    condition: "The operator submits a NON_CONSENT election against a well it operates"
  - id: ERR_NO_CONSENTING_INTEREST
    http: 422
    condition: "Election closure yields consent_working_interest_pct == 0.000000, i.e. the consenting candidate set is empty"

  # --- uniqueness, overlap and aggregate constraints ---
  - id: ERR_DUPLICATE_LEASE_NUMBER
    http: 409
    condition: "lease_number already exists"
  - id: ERR_DUPLICATE_API_NUMBER
    http: 409
    condition: "api_number already exists"
  - id: ERR_DUPLICATE_ALLOCATION
    http: 409
    condition: "A COMMITTED allocation already exists for this (well_id, lease_id) pair"
  - id: ERR_DUPLICATE_PRODUCTION_MONTH
    http: 409
    condition: "A ProductionRevenue already exists for this well and production_month"
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 409
    condition: "The proposed closed billing period intersects or touches the closed period of another non-VOID statement on the same well"
  - id: ERR_INTEREST_PERIOD_OVERLAP
    http: 409
    condition: "The proposed half-open effective interval intersects the half-open interval of another non-TERMINATED WellInterest for the same (well, owner) pair; touching endpoints are adjacent and allowed"
  - id: ERR_DUPLICATE_OPEN_DISPUTE
    http: 409
    condition: "An unresolved dispute already exists for this (statement, owner) pair"
  - id: ERR_ALLOCATION_EXCEEDS_LEASE
    http: 422
    condition: "committed_acres exceeds the lease's uncommitted acreage, or is not positive"
  - id: ERR_POOLING_MINIMUM_NOT_MET
    http: 422
    condition: "Pooling effectuation attempted with fewer than two COMMITTED allocations"
  - id: ERR_WI_SUM_EXCEEDED
    http: 422
    condition: "The ACTIVE working-interest total on the well would exceed 1.000000"
  - id: ERR_NRI_EXCEEDS_WI
    http: 422
    condition: "net_revenue_interest_pct exceeds working_interest_pct on the same interest row"
  - id: ERR_TRANSFER_EXCEEDS_HOLDING
    http: 422
    condition: "transfer_wi_pct or transfer_nri_pct exceeds what the assignor actually holds"
  - id: ERR_NO_BILLABLE_COSTS
    http: 422
    condition: "The statement's cost basis and period select no CostEntry at issuance"
  - id: ERR_DISPUTE_AMOUNT_EXCEEDS_BILL
    http: 422
    condition: "disputed_amount_cents exceeds the filing owner's line-item total, or is not positive"
  - id: ERR_ADJUSTMENT_EXCEEDS_DISPUTE
    http: 422
    condition: "adjustment_amount_cents exceeds disputed_amount_cents, or is non-zero on an UPHELD outcome"

  # --- fiscal ---
  - id: ERR_INSUFFICIENT_BOND
    http: 402
    condition: "The grantee's bond_posted_cents is below the transfer's bond_check_required_cents"
  - id: ERR_PLUGGING_BOND_SHORTFALL
    http: 402
    condition: "An owner with an ACTIVE interest on the well has bond_posted_cents below its recomputed required_bond_cents when the well is moved to PLUGGED"
  - id: ERR_EXTENSION_BONUS_MISMATCH
    http: 402
    condition: "bonus_paid_cents does not equal gross_acres * extension_bonus_per_acre_cents"
  - id: ERR_SUSPENSE_BALANCE_NONZERO
    http: 409
    condition: "An owner's last ACTIVE interest is terminated while its suspense_balance_cents is non-zero"

roles:
  - name: LandAdministrator
    description: "The exploration and production land department: maintains lease inventory, wells, pooled units, working-interest and net-revenue-interest positions, AFEs and assignment records"
    identity: opaque
    exclusive_operations: ["create and extend leases", "record lease obligation events", "create wells and drive well_status", "commit lease acreage and effectuate pooling", "create and terminate WellInterest positions (OCC on Well.version)", "issue AFEs and close election windows", "serve assignment notices and record closings", "register interest owners"]
    shared_operations: ["read every lease, well, interest, AFE, election, statement, dispute, revenue and transfer", "set the logical clock", "submit an AFE election on a partner's behalf"]
  - name: JointInterestAccountant
    description: "Prepares joint interest billing statements, books joint-account costs, answers billing disputes, and disburses revenue to interest owners"
    identity: opaque
    exclusive_operations: ["book and settle joint-account cost entries", "open, issue, revise, void and settle JIB statements", "answer disputes with an OPERATOR_RESPONSE exchange", "book monthly production revenue and run the release waterfall", "pay owner disbursements"]
    shared_operations: ["read every well, interest, cost, statement, line item, dispute, revenue and disbursement", "set the logical clock"]
  - name: AuditReviewer
    description: "Independent reviewer of partner audit exceptions; the only role that may resolve a dispute, and never the user who prepared the disputed statement"
    identity: opaque
    exclusive_operations: ["resolve a dispute UPHELD or ADJUSTED"]
