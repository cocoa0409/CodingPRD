# =============================================================================
# Scaffold: standby-generator-service (task_0497)
# Standby Generator Sales & Service (Generac-style)
# Difficulty band: Expert (12 entities, 30 endpoints, 28 errors, 5 calculations,
#                  7 state machines with cycles + parallel dimensions + compound)
# =============================================================================

scenario: |
  497. Standby Generator Sales & Service (Generac style): load assessment & sizing
  (kW), permit & fuel (NG/propane) hookup, install & automatic transfer switch,
  activation & registration, maintenance plan (annual/semi-annual) & exercise log,
  warranty & remote monitoring, repair dispatch, recall

domain_name: standby-generator-service
api_prefix: ""
# Flat topology: entities are peers addressed at root-level collections
# (/projects, /units, /customers, …) rather than nested under one prefix.

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions

  entity_topology: hybrid
  # GeneratorProject is the install-pipeline root; Unit is minted on activation and
  # becomes its own root for service/warranty/recall sub-trees. Customer/Technician/
  # GeneratorModel/RecallCampaign are flat peers referenced by FK.

  state_machine_shape: compound
  # Project pipeline is branching-with-revert; Unit.operating_status is compound
  # (derived from monitoring_health + recall + warranty); Reservation-style cycles
  # appear on WarrantyClaim and RepairDispatch; MaintenancePlan suspend/resume is cyclic.

  relationship_patterns:
    - one_to_many        # Customer -> Projects, Unit -> MaintenanceVisits/ExerciseLogs
    - many_to_many       # RecallCampaign <-> Unit via RecallRemediation junction
    - cross_aggregate    # WarrantyClaim/RepairDispatch reference Unit across the Project aggregate boundary

  role_model: peer_roles
  # Customer owns purchase/registration intent; Technician performs field work;
  # ServiceManager (opaque) runs install gating, dispatch, recall; ComplianceOfficer
  # (opaque) opens recalls and adjudicates warranty. Segregation: the Technician who
  # PERFORMED a MaintenanceVisit cannot ALSO be the one who closes its parent
  # RepairDispatch follow-up (segregation guard on RepairDispatch.close).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login/contact email", constraints: "unique, non-empty" }
      - { name: full_name, type: string, source: input, description: "Homeowner / site owner name" }
      - { name: service_address, type: string, source: input, description: "Physical install address (free text)" }
      - { name: elevation_ft, type: integer, source: input, description: "Site elevation above sea level in feet; used for sizing derate", default: 0, constraints: ">= 0" }
      - { name: phone, type: string, source: input, description: "Contact phone", default: null }

  # ---------------------------------------------------------------------------
  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Technician full name" }
      - { name: license_no, type: string, source: input, description: "Electrical/gas license number", constraints: "unique, non-empty" }
      - { name: gas_certified, type: boolean, source: input, description: "Holds gas-fitting certification (required to sign off propane/NG fuel hookup)", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }
      - { name: open_dispatch_count, type: integer, source: computed, description: "Number of RepairDispatch rows assigned to this tech in DISPATCHED or IN_PROGRESS", default: 0 }

  # ---------------------------------------------------------------------------
  - name: GeneratorModel
    parent: null
    common_fields: false
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU", constraints: "unique, non-empty" }
      - { name: rated_kw, type: number, source: input, description: "Continuous kW rating at sea level", constraints: "> 0" }
      - { name: fuel_types, type: array, source: input, description: "Compatible fuels; subset of {NG, PROPANE}", constraints: "non-empty subset of {NG, PROPANE}" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price in cents", constraints: ">= 0" }
      - { name: warranty_months, type: integer, source: input, description: "Standard warranty length in months", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Catalog availability flag", default: true }

  # ---------------------------------------------------------------------------
  - name: GeneratorProject
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of this project" }
      - { name: model_id, type: string, source: input, description: "FK -> GeneratorModel.id; chosen model (null until sizing approved)", default: null }
      - { name: fuel_type, type: enum, source: input, description: "NG | PROPANE; declared fuel for hookup" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIZED | PERMITTED | INSTALLED | ACTIVATED | CANCELLED", default: DRAFT, constraints: "DRAFT | SIZED | PERMITTED | INSTALLED | ACTIVATED | CANCELLED" }
      - { name: required_kw, type: number, source: computed, description: "Sizing result from latest LoadAssessment under STAGGERED method; null until sized", default: null }
      - { name: sizing_method, type: enum, source: system, description: "STAGGERED | FULL_LOAD; method used to set required_kw", default: STAGGERED, constraints: "STAGGERED | FULL_LOAD" }
      - { name: permit_number, type: string, source: input, description: "Jurisdiction permit number, set at permit step", default: null }
      - { name: permit_status, type: enum, source: system, description: "NONE | APPROVED | REJECTED; set in one permit call per permit_decision", default: NONE, constraints: "NONE | APPROVED | REJECTED" }
      - { name: fuel_hookup_verified, type: boolean, source: computed, description: "True once fuel BTU adequacy check passed at permit step", default: false }
      - { name: ats_amps, type: integer, source: input, description: "Automatic transfer switch ampacity recorded at install", default: null, constraints: "null or > 0" }
      - { name: install_tech_id, type: string, source: input, description: "FK -> Technician.id; tech who performed install (null until installed)", default: null }
      - { name: unit_id, type: string, source: computed, description: "FK -> Unit.id; the Unit minted at activation (null before)", default: null }
      - { name: cancellation_reason, type: string, source: input, description: "Reason captured when project CANCELLED", default: null }

  # ---------------------------------------------------------------------------
  - name: LoadAssessment
    parent: GeneratorProject
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> GeneratorProject.id; owning project" }
      - { name: appliances, type: array, source: input, description: "Array of {name, running_watts, starting_watts}; running/starting in watts", constraints: "non-empty; each running_watts >= 0, starting_watts >= running_watts" }
      - { name: method, type: enum, source: input, description: "STAGGERED | FULL_LOAD; surge-accumulation policy", default: STAGGERED, constraints: "STAGGERED | FULL_LOAD" }
      - { name: computed_required_kw, type: number, source: computed, description: "Result of the load-sizing calculation for this assessment" }
      - { name: peak_demand_w, type: integer, source: computed, description: "Peak watt demand used in the sizing formula" }

  # ---------------------------------------------------------------------------
  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: computed, description: "FK -> GeneratorProject.id; project that produced this unit" }
      - { name: customer_id, type: string, source: computed, description: "FK -> Customer.id; owner" }
      - { name: model_id, type: string, source: computed, description: "FK -> GeneratorModel.id; installed model" }
      - { name: serial_no, type: string, source: input, description: "Manufacturer serial recorded at activation", constraints: "unique, non-empty" }
      - { name: rated_kw, type: number, source: computed, description: "Snapshot of model.rated_kw at activation" }
      - { name: fuel_type, type: enum, source: computed, description: "NG | PROPANE; snapshot of project.fuel_type" }
      - { name: registration_status, type: enum, source: system, description: "UNREGISTERED | REGISTERED", default: UNREGISTERED, constraints: "UNREGISTERED | REGISTERED" }
      - { name: warranty_start, type: datetime, source: system, description: "Activation timestamp; warranty clock origin", default: null }
      - { name: warranty_total_months, type: integer, source: computed, description: "Snapshot of model.warranty_months at activation (extendable by registration bonus)" }
      - { name: warranty_status, type: enum, source: computed, description: "ACTIVE | LAPSED | VOID; VOID after an unremediated recall past deadline", default: ACTIVE, constraints: "ACTIVE | LAPSED | VOID" }
      - { name: monitoring_enabled, type: boolean, source: input, description: "Remote monitoring subscription toggle", default: false }
      - { name: monitoring_health, type: enum, source: computed, description: "OK | DEGRADED | OFFLINE; OK when monitoring on and compliant", default: OFFLINE, constraints: "OK | DEGRADED | OFFLINE" }
      - { name: compliance_score, type: integer, source: computed, description: "Exercise-log compliance 0..100 over trailing window", default: 0, constraints: "0..100" }
      - { name: operating_status, type: enum, source: computed, description: "OPERATIONAL | SERVICE_DUE | NON_COMPLIANT | DECOMMISSIONED; compound derived field", default: OPERATIONAL, constraints: "OPERATIONAL | SERVICE_DUE | NON_COMPLIANT | DECOMMISSIONED" }
      - { name: last_exercise_at, type: datetime, source: computed, description: "Timestamp of most recent SUCCESS ExerciseLog", default: null }
      - { name: runtime_hours, type: number, source: computed, description: "Cumulative runtime hours from exercise + repair logs", default: 0 }

  # ---------------------------------------------------------------------------
  - name: MaintenancePlan
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; covered unit" }
      - { name: frequency, type: enum, source: input, description: "ANNUAL | SEMI_ANNUAL; visits per year (1 or 2)", constraints: "ANNUAL | SEMI_ANNUAL" }
      - { name: monitoring_bundled, type: boolean, source: input, description: "Whether remote monitoring add-on is bundled into the plan", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CANCELLED", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | CANCELLED" }
      - { name: annual_price_cents, type: integer, source: computed, description: "Computed plan price for one year" }
      - { name: visits_per_year, type: integer, source: computed, description: "2 for SEMI_ANNUAL, 1 for ANNUAL" }
      - { name: visits_completed_ytd, type: integer, source: computed, description: "COMPLETED MaintenanceVisits in current plan year", default: 0 }
      - { name: next_due_at, type: datetime, source: computed, description: "Due date of the next required visit", default: null }

  # ---------------------------------------------------------------------------
  - name: MaintenanceVisit
    parent: MaintenancePlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> MaintenancePlan.id; owning plan" }
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; covered unit (denormalized from plan)" }
      - { name: scheduled_for, type: datetime, source: input, description: "Scheduled visit timestamp" }
      - { name: assigned_tech_id, type: string, source: input, description: "FK -> Technician.id; assigned tech", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | MISSED | CANCELLED", default: SCHEDULED, constraints: "SCHEDULED | COMPLETED | MISSED | CANCELLED" }
      - { name: performed_at, type: datetime, source: system, description: "Completion timestamp", default: null }
      - { name: runtime_added_hours, type: number, source: input, description: "Runtime hours logged during this visit", default: 0, constraints: ">= 0" }

  # ---------------------------------------------------------------------------
  - name: ExerciseLog
    parent: Unit
    common_fields: false
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; exercised unit" }
      - { name: occurred_at, type: datetime, source: input, description: "When the self-test ran (logical clock instant)" }
      - { name: result, type: enum, source: input, description: "SUCCESS | FAULT; outcome of the exercise cycle", constraints: "SUCCESS | FAULT" }
      - { name: runtime_minutes, type: integer, source: input, description: "Duration of the exercise run", default: 12, constraints: ">= 0" }

  # ---------------------------------------------------------------------------
  - name: WarrantyClaim
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; claimed unit" }
      - { name: description, type: string, source: input, description: "Defect description" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | APPROVED | DENIED | WITHDRAWN", default: OPEN, constraints: "OPEN | UNDER_REVIEW | APPROVED | DENIED | WITHDRAWN" }
      - { name: resolution, type: enum, source: input, description: "REPAIR_COVERED | PRORATED_REFUND | NO_FAULT_FOUND; set at adjudication", default: null, constraints: "null | REPAIR_COVERED | PRORATED_REFUND | NO_FAULT_FOUND" }
      - { name: refund_cents, type: integer, source: computed, description: "Computed prorated residual refund when resolution=PRORATED_REFUND", default: 0 }
      - { name: refund_basis, type: enum, source: input, description: "CALENDAR | USAGE; proration variant chosen at adjudication", default: CALENDAR, constraints: "CALENDAR | USAGE" }
      - { name: dispatch_id, type: string, source: computed, description: "FK -> RepairDispatch.id; dispatch spawned when APPROVED as REPAIR_COVERED", default: null }

  # ---------------------------------------------------------------------------
  - name: RepairDispatch
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit to service" }
      - { name: origin, type: enum, source: input, description: "WARRANTY | PAID | RECALL; what spawned this dispatch", constraints: "WARRANTY | PAID | RECALL" }
      - { name: warranty_claim_id, type: string, source: system, description: "FK -> WarrantyClaim.id; source claim when origin=WARRANTY", default: null }
      - { name: assigned_tech_id, type: string, source: input, description: "FK -> Technician.id; dispatched tech", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | DISPATCHED | IN_PROGRESS | RESOLVED | CLOSED | CANCELLED", default: REQUESTED, constraints: "REQUESTED | DISPATCHED | IN_PROGRESS | RESOLVED | CLOSED | CANCELLED" }
      - { name: labor_cents, type: integer, source: input, description: "Pre-tax labor line in cents", default: 0, constraints: ">= 0" }
      - { name: parts_cents, type: integer, source: input, description: "Pre-tax parts line in cents", default: 0, constraints: ">= 0" }
      - { name: billable, type: boolean, source: computed, description: "True only when origin=PAID (WARRANTY/RECALL are no-charge)", default: false }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Taxed invoice total under per-line-then-sum rounding; 0 when not billable", default: 0 }
      - { name: resolved_by_tech_id, type: string, source: system, description: "FK -> Technician.id; tech who marked RESOLVED", default: null }
      - { name: runtime_added_hours, type: number, source: input, description: "Runtime hours logged during repair", default: 0, constraints: ">= 0" }

  # ---------------------------------------------------------------------------
  - name: RecallCampaign
    parent: null
    common_fields: true
    fields:
      - { name: model_id, type: string, source: input, description: "FK -> GeneratorModel.id; affected model" }
      - { name: code, type: string, source: input, description: "Recall reference code", constraints: "unique, non-empty" }
      - { name: severity, type: enum, source: input, description: "ADVISORY | MANDATORY; MANDATORY voids warranty + disables unit past deadline", constraints: "ADVISORY | MANDATORY" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED", default: DRAFT, constraints: "DRAFT | OPEN | CLOSED" }
      - { name: opened_at, type: datetime, source: system, description: "Timestamp campaign moved to OPEN; remediation window origin", default: null }
      - { name: remediation_window_days, type: integer, source: input, description: "Days each affected unit has to remediate after OPEN", default: 90, constraints: "> 0" }
      - { name: affected_unit_count, type: integer, source: computed, description: "Count of RecallRemediation rows generated on OPEN", default: 0 }
      - { name: remediated_count, type: integer, source: computed, description: "Count of RecallRemediation rows in COMPLETED", default: 0 }

  # ---------------------------------------------------------------------------
  - name: RecallRemediation
    parent: RecallCampaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> RecallCampaign.id; owning campaign" }
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit to remediate" }
      - { name: deadline_at, type: datetime, source: computed, description: "campaign.opened_at + remediation_window_days" }
      - { name: status, type: enum, source: system, description: "PENDING | SCHEDULED | COMPLETED | OVERDUE", default: PENDING, constraints: "PENDING | SCHEDULED | COMPLETED | OVERDUE" }
      - { name: dispatch_id, type: string, source: system, description: "FK -> RepairDispatch.id; RECALL-origin dispatch created on schedule", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp remediation completed", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- GeneratorProject: branching pipeline with revert (cancel) -------------
  - entity: GeneratorProject
    field: status
    initial_state: DRAFT
    terminal_states: [ACTIVATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SIZED
        trigger: "POST /projects/{project_id}/size"
        actor: ServiceManager
        preconditions:
          - "At least one LoadAssessment exists on the project"
          - "Chosen model_id in body references an active GeneratorModel whose rated_kw >= required_kw from the selected assessment"
          - "Chosen model's fuel_types includes project.fuel_type"
        side_effects:
          - "Sets required_kw and sizing_method from selected LoadAssessment (run_load_sizing output)"
          - "Sets model_id"
          - "increments GeneratorProject.version by 1"

      - from: SIZED
        to: PERMITTED
        trigger: "POST /projects/{project_id}/permit"
        actor: ServiceManager
        preconditions:
          - "permit_decision=APPROVE sets permit_status=APPROVED (a prior REJECTED permit may be re-submitted with APPROVE)"
          - "Fuel BTU adequacy check passes for project.fuel_type (run_fuel_adequacy returns SUFFICIENT)"
        side_effects:
          - "Sets permit_number, permit_status=APPROVED, fuel_hookup_verified=true"
          - "increments GeneratorProject.version by 1"

      - from: PERMITTED
        to: INSTALLED
        trigger: "POST /projects/{project_id}/install"
        actor: Technician
        preconditions:
          - "install_tech_id references a Technician with status=ACTIVE and gas_certified=true"
          - "ats_amps in body > 0"
        side_effects:
          - "Sets install_tech_id, ats_amps"
          - "increments GeneratorProject.version by 1"

      - from: INSTALLED
        to: ACTIVATED
        trigger: "POST /projects/{project_id}/activate"
        actor: ServiceManager
        preconditions:
          - "serial_no in body is unique across all Units"
          - "project.permit_status == APPROVED and fuel_hookup_verified == true"
        side_effects:
          - "Mints a Unit (snapshots model_id, rated_kw, fuel_type, warranty_total_months); warranty_start = current clock"
          - "Unit.operating_status = OPERATIONAL, monitoring_health = OFFLINE, compliance_score = 0"
          - "Sets project.unit_id"
          - "increments GeneratorProject.version by 1"
        note: "ACTIVATED is terminal for the Project; further lifecycle is on the Unit."

      - from: [DRAFT, SIZED, PERMITTED, INSTALLED]
        to: CANCELLED
        trigger: "POST /projects/{project_id}/cancel"
        actor: ServiceManager
        preconditions:
          - "Project not already ACTIVATED or CANCELLED"
        side_effects:
          - "Sets cancellation_reason"
          - "increments GeneratorProject.version by 1"
        note: "Cannot cancel after ACTIVATED — a Unit exists; use decommission path instead."

  # ---- Unit.operating_status: compound, derived from children + recall -------
  - entity: Unit
    field: operating_status
    initial_state: OPERATIONAL
    terminal_states: [DECOMMISSIONED]
    note: "Compound/derived: recomputed by recompute_unit_posture on every child mutation, exercise log, recall transition, or clock advance touching this unit."
    transitions:
      - from: OPERATIONAL
        to: SERVICE_DUE
        trigger: "system (recompute_unit_posture: an ACTIVE MaintenancePlan has next_due_at <= now and no COMPLETED visit covering it)"
        actor: system
        preconditions:
          - "Unit has an ACTIVE MaintenancePlan whose next_due_at <= current clock"
          - "Unit is not NON_COMPLIANT (recall posture dominates)"
        side_effects: []

      - from: SERVICE_DUE
        to: OPERATIONAL
        trigger: "system (recompute_unit_posture: a MaintenanceVisit COMPLETED, advancing next_due_at past now)"
        actor: system
        preconditions:
          - "next_due_at > current clock after the completed visit"
        side_effects: []

      - from: [OPERATIONAL, SERVICE_DUE]
        to: NON_COMPLIANT
        trigger: "system (recompute_unit_posture: a MANDATORY RecallRemediation on this unit is OVERDUE)"
        actor: system
        preconditions:
          - "A RecallRemediation for this unit under a MANDATORY campaign is OVERDUE (deadline passed, not COMPLETED)"
        side_effects:
          - "warranty_status -> VOID"
          - "monitoring_health -> OFFLINE"
        note: "NON_COMPLIANT dominates SERVICE_DUE; recall posture wins over maintenance posture."

      - from: NON_COMPLIANT
        to: OPERATIONAL
        trigger: "system (recompute_unit_posture: the OVERDUE MANDATORY remediation reaches COMPLETED)"
        actor: system
        preconditions:
          - "No MANDATORY RecallRemediation on this unit remains OVERDUE"
        side_effects:
          - "warranty_status recomputed (ACTIVE if within window, else LAPSED)"
        note: "Cyclic: a unit may re-enter NON_COMPLIANT under a later recall."

      - from: [OPERATIONAL, SERVICE_DUE, NON_COMPLIANT]
        to: DECOMMISSIONED
        trigger: "POST /units/{unit_id}/decommission"
        actor: ServiceManager
        preconditions:
          - "No RepairDispatch on this unit in DISPATCHED or IN_PROGRESS"
        side_effects:
          - "ACTIVE/SUSPENDED MaintenancePlans -> CANCELLED"
          - "SCHEDULED MaintenanceVisits -> CANCELLED"
          - "monitoring_enabled -> false, monitoring_health -> OFFLINE"
          - "increments Unit.version by 1"

  # ---- Unit.monitoring_health: parallel dimension on the same Unit row -------
  - entity: Unit
    field: monitoring_health
    initial_state: OFFLINE
    terminal_states: []
    note: "Parallel state axis on Unit, independent of operating_status; driven by monitoring_enabled and compliance_score threshold."
    transitions:
      - from: OFFLINE
        to: OK
        trigger: "system (recompute_unit_posture after monitoring enabled and compliance_score >= 70)"
        actor: system
        preconditions:
          - "monitoring_enabled == true"
          - "compliance_score >= 70"
          - "Unit not NON_COMPLIANT"
        side_effects: []

      - from: OK
        to: DEGRADED
        trigger: "system (recompute_unit_posture after compliance_score drops below 70 while monitoring enabled)"
        actor: system
        preconditions:
          - "monitoring_enabled == true"
          - "compliance_score < 70"
        side_effects: []

      - from: DEGRADED
        to: OK
        trigger: "system (recompute_unit_posture after compliance_score recovers to >= 70)"
        actor: system
        preconditions:
          - "monitoring_enabled == true"
          - "compliance_score >= 70"
        side_effects: []

      - from: [OK, DEGRADED]
        to: OFFLINE
        trigger: "PATCH /units/{unit_id} with monitoring_enabled=false, or system (unit NON_COMPLIANT)"
        actor: "Customer or system"
        preconditions: []
        side_effects: []

  # ---- MaintenancePlan: cyclic suspend/resume -------------------------------
  - entity: MaintenancePlan
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /maintenance-plans/{plan_id}/suspend"
        actor: Customer
        preconditions:
          - "Plan is ACTIVE"
        side_effects:
          - "next_due_at frozen; visits no longer auto-required"
          - "increments MaintenancePlan.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /maintenance-plans/{plan_id}/resume"
        actor: Customer
        preconditions:
          - "Plan is SUSPENDED"
          - "Owning Unit.operating_status != DECOMMISSIONED"
        side_effects:
          - "recompute next_due_at; recompute_unit_posture on owning unit"
          - "increments MaintenancePlan.version by 1"

      - from: [ACTIVE, SUSPENDED]
        to: CANCELLED
        trigger: "POST /maintenance-plans/{plan_id}/cancel, or system (unit decommissioned)"
        actor: "Customer or system"
        preconditions: []
        side_effects:
          - "SCHEDULED MaintenanceVisits on this plan -> CANCELLED"
          - "recompute_unit_posture on owning unit"
          - "increments MaintenancePlan.version by 1"

  # ---- MaintenanceVisit: linear with miss branch ----------------------------
  - entity: MaintenanceVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /maintenance-visits/{visit_id}/complete"
        actor: Technician
        preconditions:
          - "Acting technician == visit.assigned_tech_id"
          - "Owning MaintenancePlan.status == ACTIVE"
          - "Owning Unit.operating_status != DECOMMISSIONED"
        side_effects:
          - "performed_at = current clock"
          - "Unit.runtime_hours += runtime_added_hours (recompute_runtime)"
          - "Plan.visits_completed_ytd += 1; recompute next_due_at"
          - "recompute_unit_posture (may clear SERVICE_DUE)"
          - "increments MaintenanceVisit.version by 1"

      - from: SCHEDULED
        to: MISSED
        trigger: "system (recompute_unit_posture: scheduled_for + GRACE_DAYS < now and not completed)"
        actor: system
        preconditions:
          - "scheduled_for + 7 days < current clock"
        side_effects:
          - "recompute_unit_posture (unit may flip to SERVICE_DUE)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /maintenance-visits/{visit_id}/cancel, or system (plan cancelled / unit decommissioned)"
        actor: "Customer or system"
        preconditions: []
        side_effects:
          - "increments MaintenanceVisit.version by 1"

  # ---- WarrantyClaim: cyclic review (OPEN<->UNDER_REVIEW) + branch -----------
  - entity: WarrantyClaim
    field: status
    initial_state: OPEN
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /warranty-claims/{claim_id}/review"
        actor: ComplianceOfficer
        preconditions:
          - "Unit.warranty_status == ACTIVE at time of review"
        side_effects:
          - "increments WarrantyClaim.version by 1"

      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /warranty-claims/{claim_id}/return-for-info"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments WarrantyClaim.version by 1"
        note: "Revision loop: claim can bounce between OPEN and UNDER_REVIEW any number of times before terminal adjudication."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /warranty-claims/{claim_id}/adjudicate with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "Unit.warranty_status == ACTIVE (not LAPSED, not VOID)"
          - "resolution in {REPAIR_COVERED, PRORATED_REFUND}"
        side_effects:
          - "Sets resolution; if PRORATED_REFUND, computes refund_cents (run_warranty_refund using refund_basis)"
          - "if REPAIR_COVERED, spawns a RepairDispatch(origin=WARRANTY, status=REQUESTED) and sets dispatch_id"
          - "increments WarrantyClaim.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /warranty-claims/{claim_id}/adjudicate with decision=DENY"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Sets resolution=NO_FAULT_FOUND (or null); refund_cents stays 0"
          - "increments WarrantyClaim.version by 1"

      - from: [OPEN, UNDER_REVIEW]
        to: WITHDRAWN
        trigger: "POST /warranty-claims/{claim_id}/withdraw"
        actor: Customer
        preconditions:
          - "Acting customer owns the claimed Unit"
        side_effects:
          - "increments WarrantyClaim.version by 1"

  # ---- RepairDispatch: cyclic (DISPATCHED<->IN_PROGRESS) with segregation ----
  - entity: RepairDispatch
    field: status
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /repair-dispatches/{dispatch_id}/assign"
        actor: ServiceManager
        preconditions:
          - "assigned_tech_id references Technician with status=ACTIVE"
          - "Technician.open_dispatch_count < 5"
        side_effects:
          - "Sets assigned_tech_id; Technician.open_dispatch_count += 1 (recompute_tech_load)"
          - "increments RepairDispatch.version by 1"

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /repair-dispatches/{dispatch_id}/start"
        actor: Technician
        preconditions:
          - "Acting technician == assigned_tech_id"
        side_effects:
          - "increments RepairDispatch.version by 1"

      - from: IN_PROGRESS
        to: DISPATCHED
        trigger: "POST /repair-dispatches/{dispatch_id}/pause"
        actor: Technician
        preconditions:
          - "Acting technician == assigned_tech_id"
        side_effects:
          - "increments RepairDispatch.version by 1"
        note: "Cycle: a dispatch may oscillate DISPATCHED<->IN_PROGRESS across multiple field visits."

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /repair-dispatches/{dispatch_id}/resolve"
        actor: Technician
        preconditions:
          - "Acting technician == assigned_tech_id"
        side_effects:
          - "Sets resolved_by_tech_id = acting technician"
          - "Unit.runtime_hours += runtime_added_hours (recompute_runtime)"
          - "if billable, computes invoice_total_cents (run_repair_invoice)"
          - "if origin=WARRANTY, the source WarrantyClaim already APPROVED — no change"
          - "if origin=RECALL, the linked RecallRemediation -> COMPLETED (cascade)"
          - "Technician.open_dispatch_count -= 1 (recompute_tech_load)"
          - "increments RepairDispatch.version by 1"

      - from: RESOLVED
        to: CLOSED
        trigger: "POST /repair-dispatches/{dispatch_id}/close"
        actor: ServiceManager
        preconditions:
          - "Acting principal (X-User-ID) != resolved_by_tech_id (segregation of duties)"
        side_effects:
          - "recompute_unit_posture on the unit"
          - "increments RepairDispatch.version by 1"

      - from: [REQUESTED, DISPATCHED]
        to: CANCELLED
        trigger: "POST /repair-dispatches/{dispatch_id}/cancel"
        actor: ServiceManager
        preconditions:
          - "Status is REQUESTED or DISPATCHED (cannot cancel once IN_PROGRESS)"
        side_effects:
          - "if was DISPATCHED, Technician.open_dispatch_count -= 1 (recompute_tech_load)"
          - "increments RepairDispatch.version by 1"

  # ---- RecallCampaign: linear with fan-out on OPEN --------------------------
  - entity: RecallCampaign
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /recall-campaigns/{campaign_id}/open"
        actor: ComplianceOfficer
        preconditions:
          - "Campaign is DRAFT"
        side_effects:
          - "opened_at = current clock"
          - "Fan-out: for every ACTIVATED Unit whose model_id == campaign.model_id and operating_status != DECOMMISSIONED, create a RecallRemediation(status=PENDING, deadline_at=opened_at + remediation_window_days)"
          - "Sets affected_unit_count"
          - "increments RecallCampaign.version by 1"
        note: "Fan-out is a parallel direct mutation of many remediations — NOT a transitive cascade."

      - from: OPEN
        to: CLOSED
        trigger: "POST /recall-campaigns/{campaign_id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "No RecallRemediation under this campaign is in PENDING or SCHEDULED state"
        side_effects:
          - "increments RecallCampaign.version by 1"

  # ---- RecallRemediation: branch with overdue + completion cascade ----------
  - entity: RecallRemediation
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /recall-remediations/{remediation_id}/schedule"
        actor: ServiceManager
        preconditions:
          - "Remediation is PENDING (not OVERDUE)"
          - "Owning Unit.operating_status != DECOMMISSIONED"
        side_effects:
          - "Spawns RepairDispatch(origin=RECALL, status=REQUESTED) and sets dispatch_id"
          - "increments RecallRemediation.version by 1"

      - from: [SCHEDULED, OVERDUE]
        to: COMPLETED
        trigger: "system (linked RECALL RepairDispatch reaches RESOLVED)"
        actor: system
        preconditions:
          - "Linked RepairDispatch.status == RESOLVED"
        side_effects:
          - "completed_at = current clock"
          - "Campaign.remediated_count += 1"
          - "recompute_unit_posture on owning unit (NON_COMPLIANT -> OPERATIONAL if this cleared the last overdue MANDATORY remediation, restoring warranty_status)"
          - "increments RecallRemediation.version by 1"
        note: "Cascade tail: dispatch RESOLVED -> remediation COMPLETED -> unit posture recompute -> warranty_status restore. Reachable whether the remediation was SCHEDULED or had already gone OVERDUE."

      - from: [PENDING, SCHEDULED]
        to: OVERDUE
        trigger: "system (recompute on clock advance: deadline_at < now and not COMPLETED)"
        actor: system
        preconditions:
          - "deadline_at < current clock"
        side_effects:
          - "if campaign.severity == MANDATORY: recompute_unit_posture (unit -> NON_COMPLIANT, warranty_status -> VOID)"
        note: "OVERDUE is non-terminal: a remediation in OVERDUE can still reach COMPLETED if its dispatch resolves (see the [SCHEDULED, OVERDUE] -> COMPLETED transition)."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: warranty-claim-create-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /units/{unit_id}/warranty-claims"
    occ_field: "expected_unit_version"
    description: |
      Filing a WarrantyClaim against a Unit whose version has advanced since the
      client last observed it is rejected. This captures the case where the unit's
      warranty_status was changed by another writer (e.g. a recall transition that
      VOIDed the warranty, bumping Unit.version) and the filer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispatch-assign-stale-dispatch
    parent_entity: RepairDispatch
    write_endpoint: "POST /repair-dispatches/{dispatch_id}/assign"
    occ_field: "expected_dispatch_version"
    description: |
      Assigning a technician to a RepairDispatch whose version has advanced since the
      client last observed it is rejected. Captures the case where another writer has
      already assigned (or cancelled) the dispatch, advancing its version, so the
      current assignment is operating on a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- (1) Load sizing — dual-variant (STAGGERED vs FULL_LOAD), combinatorial mode (a)
  - name: run_load_sizing
    trigger: "POST /projects/{project_id}/load-assessments (computes per-assessment), and POST /projects/{project_id}/size (copies selected assessment onto project)"
    algorithm: threshold
    formula: |
      Let R = sum(a.running_watts for a in appliances)            # steady running load
      For each appliance a: surge_delta(a) = a.starting_watts - a.running_watts
      STAGGERED (motor-sequencing assumed): only the single largest surge starts at once
        peak_demand_w = R + max(surge_delta(a) over all a)
      FULL_LOAD (no sequencing): all surges coincide
        peak_demand_w = R + sum(surge_delta(a) over all a)
      required_va = peak_demand_w / POWER_FACTOR
      required_kw = ceil_to_quarter( required_va / 1000 )         # round UP to next 0.25 kW
      where ceil_to_quarter(x) = ceil(x / 0.25) * 0.25
    input_set: "All appliance entries in the LoadAssessment.appliances array; method selects STAGGERED vs FULL_LOAD."
    constants:
      POWER_FACTOR: 0.8
      KW_QUANTUM: 0.25
    precision: "kW to 0.25 increments, always rounded UP (ceil)"
    variants:
      - name: STAGGERED
        when: "LoadAssessment.method == STAGGERED (default)"
        difference: "Adds only the single largest surge_delta to running load (one motor starts at a time)."
      - name: FULL_LOAD
        when: "LoadAssessment.method == FULL_LOAD"
        difference: "Adds the sum of ALL surge_deltas to running load (every motor starts in one combined inrush) — yields a strictly larger required_kw for the same appliances."

  # ---- (2) Warranty refund — dual-variant (CALENDAR vs USAGE), different entity domain (Unit/Claim)
  - name: run_warranty_refund
    trigger: "POST /warranty-claims/{claim_id}/adjudicate with decision=APPROVE and resolution=PRORATED_REFUND"
    algorithm: decay_function
    formula: |
      total = unit.warranty_total_months
      calendar_elapsed = whole months from unit.warranty_start to current clock (floor)
      usage_elapsed    = ceil(unit.runtime_hours / HOURS_PER_MONTH_EQUIV)
      elapsed = (refund_basis == USAGE) ? max(calendar_elapsed, usage_elapsed) : calendar_elapsed
      remaining = max(0, total - elapsed)
      refund_cents = round_half_up( model.unit_price_cents_warranty_value * remaining / total )
      where model.unit_price_cents_warranty_value is the unit's COVERAGE_VALUE_CENTS constant snapshot
    input_set: "Single Unit's warranty_start, warranty_total_months, runtime_hours; refund_basis on the claim."
    constants:
      HOURS_PER_MONTH_EQUIV: 50
      COVERAGE_VALUE_CENTS: 240000
    precision: "2 decimal places (integer cents), round_half_up"
    variants:
      - name: CALENDAR
        when: "WarrantyClaim.refund_basis == CALENDAR (default)"
        difference: "elapsed = calendar months only; ignores runtime hours."
      - name: USAGE
        when: "WarrantyClaim.refund_basis == USAGE"
        difference: "elapsed = max(calendar months, runtime-derived months); a heavily-run unit ages faster, reducing the refund vs CALENDAR for the same dates."

  # ---- (3) Maintenance plan price — combinatorial mode (a): tiered + bundle discount
  - name: run_plan_price
    trigger: "POST /units/{unit_id}/maintenance-plans (on create), recompute on plan frequency/monitoring change"
    algorithm: tiered_pricing
    formula: |
      visit_price = (unit.rated_kw <= 14) ? 18000
                  : (unit.rated_kw <= 24) ? 26000
                  : 34000
      visits_per_year = (frequency == SEMI_ANNUAL) ? 2 : 1
      subtotal = visit_price * visits_per_year + (monitoring_bundled ? MONITORING_ADDON_CENTS : 0)
      if (monitoring_bundled AND frequency == SEMI_ANNUAL):
        annual_price_cents = round_half_up( subtotal * (1 - BUNDLE_DISCOUNT) )   # discount applied to subtotal, THEN rounded
      else:
        annual_price_cents = subtotal
    input_set: "Single MaintenancePlan + its Unit.rated_kw tier."
    constants:
      MONITORING_ADDON_CENTS: 6000
      BUNDLE_DISCOUNT: 0.10
      TIER1_KW: 14
      TIER2_KW: 24
    precision: "integer cents, round_half_up; discount applied to the integer subtotal BEFORE rounding"

  # ---- (4) Repair invoice — combinatorial mode (b): rounding ORDER pinned (per-line then sum)
  - name: run_repair_invoice
    trigger: "POST /repair-dispatches/{dispatch_id}/resolve when dispatch.billable == true"
    algorithm: aggregation
    formula: |
      Only origin=PAID dispatches are billable; WARRANTY and RECALL invoice_total_cents = 0.
      lines = [labor_cents, parts_cents]   (in this fixed order; zero lines are skipped from the sum but each present line is taxed independently)
      PINNED ORDER — round PER LINE, THEN sum:
        invoice_total_cents = sum over each present line L of round_half_up( L * (1 + TAX_RATE) )
      This differs from sum-then-round: e.g. lines [100,100,100] at 8.75% give 327 (per-line) vs 326 (sum-then-round).
    input_set: "Single RepairDispatch labor_cents and parts_cents lines."
    constants:
      TAX_RATE: 0.0875
    precision: "integer cents, round_half_up per line, summed last"

  # ---- (5) Exercise compliance score — weighted_scoring + threshold (monitoring health)
  - name: run_compliance_score
    trigger: "POST /units/{unit_id}/exercise-logs, POST /maintenance-visits/{id}/complete, clock advance touching the unit"
    algorithm: weighted_scoring
    formula: |
      now = current clock
      days_active = whole days from unit.warranty_start to now (floor, min 0)
      expected = floor(days_active / EXERCISE_INTERVAL_DAYS)        # expected weekly exercises so far
      completed = count(ExerciseLog for this unit with result=SUCCESS and occurred_at <= now)
      if expected <= 0:
        compliance_score = 100
      else:
        compliance_score = clamp(round_half_up(100 * completed / expected), 0, 100)
      Threshold side effect: monitoring_health flips OK<->DEGRADED at compliance_score >= 70 (>= , not >),
      provided monitoring_enabled == true and unit not NON_COMPLIANT.
    input_set: "All ExerciseLog rows for the unit with result=SUCCESS and occurred_at <= now."
    constants:
      EXERCISE_INTERVAL_DAYS: 7
      HEALTH_THRESHOLD: 70
    precision: "integer 0..100, round_half_up; FAULT exercises are logged but do NOT count toward completed."

  # ---- (6) Fuel BTU adequacy — threshold gate at permit
  - name: run_fuel_adequacy
    trigger: "POST /projects/{project_id}/permit"
    algorithm: threshold
    formula: |
      required_btu_per_hr = project.required_kw * BTU_PER_KW   (NG and PROPANE use the same per-kW demand here)
      available_btu_per_hr = fuel_supply_btu_per_hr - (existing_load_btu_per_hr or 0)
      result = SUFFICIENT if available_btu_per_hr >= required_btu_per_hr else INSUFFICIENT
    input_set: "project.required_kw (set at SIZED) and the permit-call supply/existing-load body fields."
    constants:
      BTU_PER_KW: 10000
    precision: "integer BTU/hr; >= comparison (boundary inclusive: available == required is SUFFICIENT)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers, POST /technicians (open registration) and GET endpoints which still require headers"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right (parent before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "FK body references (customer_id, model_id, assigned_tech_id, install_tech_id) resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /projects, /size, /install, /maintenance-visits, /repair-dispatches assign"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values valid, numeric ranges respected, appliances array non-empty with starting_watts >= running_watts"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_referential
    check: "Ownership: entity_backed Customer acting on a resource must own it (project.customer_id / unit.customer_id == X-User-ID); Technician acting must be the assigned/install tech"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "customer- and technician-scoped mutations"

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version (Unit for warranty-claim create, RepairDispatch for assign)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /units/{id}/warranty-claims, POST /repair-dispatches/{id}/assign"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_safety
    check: "Recall posture: a Unit that is NON_COMPLIANT cannot accept new MaintenancePlan, MaintenanceVisit completion, or non-RECALL dispatch resolution"
    error_id: ERR_UNIT_NON_COMPLIANT
    http_status: 409
    applies_to: "POST /units/{id}/maintenance-plans, /maintenance-visits/{id}/complete, /repair-dispatches resolve (non-RECALL)"

  - priority: 10
    category: business_safety
    check: "Warranty coverage active: warranty-claim review/adjudicate requires Unit.warranty_status == ACTIVE (not LAPSED, not VOID)"
    error_id: ERR_WARRANTY_LAPSED
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/review, /warranty-claims/{id}/adjudicate"

  - priority: 11
    category: business_constraint
    check: "Install tech qualified: install_tech_id Technician must be ACTIVE and gas_certified=true"
    error_id: ERR_TECH_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /projects/{id}/install"

  - priority: 12
    category: business_constraint
    check: "Sizing adequacy: chosen model rated_kw >= selected assessment required_kw and model fuel_types includes project.fuel_type"
    error_id: ERR_MODEL_UNDERSIZED
    http_status: 409
    applies_to: "POST /projects/{id}/size"

  - priority: 13
    category: business_constraint
    check: "Fuel adequacy: BTU supply for project.fuel_type covers the sized unit (run_fuel_adequacy == SUFFICIENT)"
    error_id: ERR_FUEL_INADEQUATE
    http_status: 409
    applies_to: "POST /projects/{id}/permit"

  - priority: 14
    category: business_constraint
    check: "Serial uniqueness: serial_no at activation is unique across all Units"
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /projects/{id}/activate"

  - priority: 15
    category: business_constraint
    check: "Segregation of duties: the principal closing a RepairDispatch (X-User-ID) must differ from resolved_by_tech_id"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 409
    applies_to: "POST /repair-dispatches/{id}/close"

  - priority: 16
    category: business_constraint
    check: "Tech load cap: a Technician with open_dispatch_count >= 5 cannot be assigned another dispatch"
    error_id: ERR_TECH_OVERLOADED
    http_status: 409
    applies_to: "POST /repair-dispatches/{id}/assign"

  - priority: 17
    category: business_temporal
    check: |
      Technician double-booking (buffered half-open interval on Technician): when scheduling a
      MaintenanceVisit with assigned_tech_id set, reject if that technician already has a
      SCHEDULED visit whose scheduled_for is within VISIT_BUFFER_HOURS (4h) — i.e. the new visit
      lies in the half-open window [other.scheduled_for - 4h, other.scheduled_for + 4h). Equality
      at exactly +4h is allowed (boundary open on the right).
    error_id: ERR_TECH_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /maintenance-plans/{id}/visits (when assigned_tech_id provided)"

  - priority: 18
    category: business_temporal
    check: |
      Unit same-day visit collision (closed day-bucket interval on Unit): reject scheduling a
      MaintenanceVisit when the owning Unit already has a SCHEDULED visit whose scheduled_for
      falls on the SAME UTC calendar day (date buckets are closed intervals [00:00:00, 23:59:59.999]
      of that day; any two timestamps sharing the date collide regardless of hour).
    error_id: ERR_UNIT_VISIT_COLLISION
    http_status: 409
    applies_to: "POST /maintenance-plans/{id}/visits"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock --------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock. Advancing the clock re-runs recompute passes (visit-miss, remediation-overdue, posture)."
    roles: [ServiceManager, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Logical clock = to_iso8601"
      - "Sweeps SCHEDULED visits past grace -> MISSED; PENDING/SCHEDULED remediations past deadline -> OVERDUE; recompute_unit_posture on affected units"

  # ---- Customer ---------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [Anonymous, ServiceManager]
    code: 201
    input: [email, full_name, service_address, "elevation_ft?", "phone?"]
    output: Customer
    side_effects: ["Mints Customer.id used as X-User-ID for the Customer role"]

  - method: GET
    path: "/customers/{customer_id}"
    description: "Get a customer"
    roles: [Customer, ServiceManager, ComplianceOfficer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{customer_id}/projects"
    description: "List a customer's projects (FK reverse-reachability for GeneratorProject.customer_id)"
    roles: [Customer, ServiceManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: GeneratorProject[]
    side_effects: []

  - method: GET
    path: "/customers/{customer_id}/units"
    description: "List a customer's units (FK reverse-reachability for Unit.customer_id)"
