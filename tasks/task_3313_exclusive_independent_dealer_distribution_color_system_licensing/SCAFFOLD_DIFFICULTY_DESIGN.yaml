              as: RegionManager
              captures: { bal2: $.data.coop_balance_cents, pend2: $.data.coop_pending_cents }
          assert:
            - "bal0 == 80 and pend0 == 0 (invoice 40 * 100 == 4000 cents; accrual round_half_up(4000 * 0.02) == 80)"
            - "bal1 == 80 and pend1 == 50 -> approve conserves balance exactly and moves 50 into pending (reservation, not debit): bal1 + pend1 == 130 == bal0 + pend0 + 50"
            - "bal2 == 30 and pend2 == 0 -> pay drains exactly amount_cents from the conserved pool: bal2 + pend2 == bal0 + pend0 - 50 == 30"

