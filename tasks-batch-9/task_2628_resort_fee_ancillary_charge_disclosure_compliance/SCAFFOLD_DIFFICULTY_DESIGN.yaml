              as_user_id: "u-rev-1"
              captures: { p1_v3: $.data.version }
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY27-Q1-ADJACENT", effective_from: "2026-12-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z", expected_property_version: "${p1_v3}" }
              as: RevenueManager
