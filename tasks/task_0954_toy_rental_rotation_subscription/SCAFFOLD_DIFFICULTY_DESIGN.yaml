              captures: { c1: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-BND2-2", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-BND2-3", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
