          assert:
            - "${l1_scr0} == 'PENDING' and ${l1_bill0} == 'UNBILLED'"
            - "${l1_scr1} == 'FLAGGED' but ${l1_bill1} == 'UNBILLED' — the screening move left billing alone"
            - "${l1_scr2} == 'CLEARED' and ${l1_bill2} == 'PROVISIONAL' — one call advanced both dimensions"
