      - name: an_oversized_unit_on_a_village_lot_reports_the_capacity_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LOT_CAPACITY_EXCEEDED]
          - validations[priority=90]
          - calculations.lot_capacity_charge
        distinguishing_aspect: |
          The capacity gate is evaluated before the power gate inside lot_capacity_charge, so a unit that busts
          both budgets on a tiny community lot reports ERR_LOT_CAPACITY_EXCEEDED and never
          ERR_LOT_POWER_EXCEEDED: Village Green yields floor(5000 * 80 / 100) - ceil(1001 * 0.5) = 4000 - 501 =
          3499 usable sqft and round_half_up(400 * 90 / 100, 1) = 360.0 allowed amps, while the Giant Wheel is
          charged 5414 sqft and 375.0 A. The refused reservation must leave the lot ledger at zero.
        test_recipe:
          setup:
            - "Jurisdiction OH; Venue Village Green with lot_area_sqft 5000, power_amps_available 400, expected_attendance 1001, lot_surface GRASS."
            - "Ride Giant Wheel (MAJOR, 4010 sqft, 300 A); Route R1 with one PLANNED stop on Village Green."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: false, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_x15: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_x15}", name: "Village Green", city: "Granville", lot_area_sqft: 5000, power_amps_available: 400, expected_attendance: 1001, lot_surface: "GRASS" }
              as: PlatformAdmin
              captures: { ven_x15: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_x15: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Village Circuit", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_x15: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_x15}", venue_id: "${ven_x15}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_x15: "$.data.id", sv_x15: "$.data.version" }
          trigger:
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_x15}", route_stop_id: "${stop_x15}", expected_route_stop_version: "${sv_x15}" }
              as: LotBoss
              captures: { e_x15: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_LOT_CAPACITY_EXCEEDED\" (0 + 5414 > 3499), not ERR_LOT_POWER_EXCEEDED"
            - "RouteStop.${stop_x15}.allocated_sqft_used == 0, power_amps_used == 0.0 and version == 1 — the refused write is a no-op"
            - "GET /route-stops/${stop_x15}/ride-allocations returns total_count == 0"

      # --- errors already driven at both boundaries by a §1.8 difficulty instance ---
      - name: a_failed_ride_out_of_service_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RIDE_OUT_OF_SERVICE]
          - validations[priority=60]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ride_out_of_service_60_beats_double_booking_70_for_a_failed_ride
          rationale: "That instance returns ERR_RIDE_OUT_OF_SERVICE from a reservation of an OUT_OF_SERVICE ride and asserts it wins over rule 70."

      - name: an_overlapping_ride_occupation_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RIDE_DOUBLE_BOOKED]
          - validations[priority=70]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / ride_occupation_is_closed_and_needs_a_four_hour_transport_buffer
          rationale: "The under-the-buffer trigger there returns HTTP 409 ERR_RIDE_DOUBLE_BOOKED with a 2 h gap against the 4 h transport buffer."

      - name: an_overlapping_crew_shift_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CREW_SHIFT_OVERLAP]
          - validations[priority=71]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_shift_intervals_are_half_open_so_back_to_back_shifts_are_admitted
          rationale: "The one-minute-earlier shift there returns ERR_CREW_SHIFT_OVERLAP while the exactly-abutting shift is admitted."

      - name: the_consecutive_work_day_ceiling_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONSECUTIVE_DAYS_EXCEEDED]
          - validations[priority=62]
        excluded_because:
          difficulty_instance: dual_variant_calc / worker_duty_exposure_scheduled_basis_gate_versus_worked_basis_counter
          rationale: "Booking the day past the jurisdiction ceiling returns ERR_CONSECUTIVE_DAYS_EXCEEDED there, computed on the SCHEDULED_BASIS variant."

      - name: the_permit_lead_time_floor_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PERMIT_LEAD_TIME_VIOLATION]
          - validations[priority=72]
        excluded_because:
          difficulty_instance: boundary_precision_check / permit_lead_time_floor_admits_exact_equality_then_fails_one_second_later
          rationale: "The one-second-late submit there returns ERR_PERMIT_LEAD_TIME_VIOLATION and the exact-equality submit is admitted."

      - name: a_full_inspection_day_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INSPECTION_SLOTS_FULL]
          - validations[priority=73]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / inspection_slot_buckets_are_half_open_utc_days_per_jurisdiction
          rationale: "The third order on a capacity-2 UTC day returns ERR_INSPECTION_SLOTS_FULL there, and the next day's bucket is shown to be free."

      - name: the_lot_power_ceiling_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LOT_POWER_EXCEEDED]
          - validations[priority=91]
        excluded_because:
          difficulty_instance: boundary_precision_check / lot_power_headroom_admits_exact_equality_then_rejects_one_more_amp
          rationale: "The one-amp-past reservation returns ERR_LOT_POWER_EXCEEDED there while the exact-headroom reservation is admitted."

      - name: the_negotiation_round_budget_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
          - validations[priority=84]
        excluded_because:
          difficulty_instance: non_linear_state_machine / contract_negotiation_cycle_dead_ends_at_the_round_budget
          rationale: "The loop is driven to the round ceiling there and the next counter returns ERR_NEGOTIATION_ROUNDS_EXHAUSTED."

      - name: an_unadjudicated_closure_blocking_finalize_is_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CLOSURE_NOT_ADJUDICATED]
          - validations[priority=102]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settlement_finalize_blocked_by_a_child_weather_closure_still_logged
          rationale: "Finalize with a LOGGED child closure returns ERR_CLOSURE_NOT_ADJUDICATED there, and succeeds once the closure is adjudicated."

  # ===========================================================================
  # SECTION 7 — RBAC
  # ===========================================================================
  - section: rbac
    instances:

      - name: every_role_can_perform_its_own_exclusive_operations
        claim_type: role_exclusive_operations_allowed
        grounds:
          - roles.PlatformAdmin
          - roles.RouteManager
          - roles.ContractNegotiator
          - roles.GeneralManager
          - roles.LotBoss
          - roles.ComplianceClerk
          - roles.JurisdictionOfficer
          - roles.SafetyOfficer
          - roles.TicketingAuditor
        distinguishing_aspect: |
          One walk that exercises the exclusive operation of nine of the ten roles in the order the workflow
          demands them, proving the allow-list side of §1.7 rather than the deny side: reference data
          (PlatformAdmin), stop and sequence (RouteManager), draft and send (ContractNegotiator), commit
          (RouteManager), reservation and crew (LotBoss), countersignature (GeneralManager), permit filing
          (ComplianceClerk), permit decision plus inspection result (JurisdictionOfficer), a voluntary
          THIRD_PARTY inspection order (SafetyOfficer) and the wristband batch (TicketingAuditor). Every call
          answers its declared success code.
        test_recipe:
          setup:
            - "Empty system at clock 2026-08-01T00:00:00Z; every call below is made with the role named in as:."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: false, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_r1: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_r1}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_r1: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_r1: "$.data.id" }
            - call: "POST /workers"
              payload: { full_name: "Op One", employment_type: "PERMANENT", hourly_rate_cents: 1600, certified_ride_classes: ["MAJOR"] }
              as: PlatformAdmin
              captures: { op_r1: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_r1: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_r1}", venue_id: "${ven_r1}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_r1: "$.data.id", sv_r1: "$.data.version" }
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_r1}", counterparty_name: "Franklin County Ag Society", revenue_split_pct_operator: 65, guarantee_cents: 900000, ride_minimum_count: 1, settlement_basis: "SPLIT_ONLY" }
              as: ContractNegotiator
              captures: { con_r1: "$.data.id" }
            - call: "POST /routes/${route_r1}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${con_r1}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /routes/${route_r1}/commit"
              payload: {}
              as: RouteManager
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_r1}", route_stop_id: "${stop_r1}", expected_route_stop_version: "${sv_r1}" }
              as: LotBoss
              captures: { alloc_r1: "$.data.id" }
            - call: "POST /contracts/${con_r1}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_r1}", worker_id: "${op_r1}", crew_role: "RIDE_OPERATOR", shift_start: "2026-09-04T12:00:00Z", shift_end: "2026-09-04T20:00:00Z" }
              as: LotBoss
              captures: { crew_r1: "$.data.id" }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_r1}", permit_type: "TRANSPORT", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-09T00:00:00Z", axles_declared: 4 }
              as: ComplianceClerk
              captures: { permt_r1: "$.data.id" }
            - call: "POST /permit-applications/${permt_r1}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /permit-applications/${permt_r1}/decision"
              payload: { decision: "APPROVE" }
              as: JurisdictionOfficer
            - call: "POST /inspection-orders"
              payload: { ride_allocation_id: "${alloc_r1}", authority: "THIRD_PARTY", scheduled_date: "2026-09-02T14:00:00Z" }
              as: SafetyOfficer
              captures: { ord_r1: "$.data.id" }
            - call: "POST /inspection-orders/${ord_r1}/result"
              payload: { result: "PASS" }
              as: JurisdictionOfficer
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_r1}", permit_type: "EVENT", valid_from: "2026-09-04T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: ComplianceClerk
              captures: { perme_r1: "$.data.id" }
            - call: "POST /permit-applications/${perme_r1}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /permit-applications/${perme_r1}/decision"
              payload: { decision: "APPROVE" }
              as: JurisdictionOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${stop_r1}/begin-setup"
              payload: {}
              as: LotBoss
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${stop_r1}/open-gates"
              payload: {}
              as: LotBoss
            - call: "POST /route-stops/${stop_r1}/ticket-sales"
              payload: { channel: "WRISTBAND", units: 100, unit_price_cents: 1000, business_date: "2026-09-04T18:00:00Z" }
              as: TicketingAuditor
              captures: { sale_r1: "$.data.id" }
          assert:
            - "Every POST above answers its §1.5 success code — 201 for the create endpoints, 200 for sequence, send, commit, execute, submit, decision, result, begin-setup and open-gates"
            - "Contract.${con_r1}.status == \"EXECUTED\" and last_sent_by_user_id == \"user-negotiator-1\""
            - "InspectionOrder.${ord_r1}.authority == \"THIRD_PARTY\", status == \"PASSED\", attempt_number == 1, defect_count == 0"
            - "RouteStop.${stop_r1}.status == \"OPEN\" and gross_ticket_revenue_cents == 100000"
            - "No call in the walk returns 401 or 403"

      - name: a_lot_boss_cannot_create_a_route_stop_or_sequence_a_route
        claim_type: role_denied_other_exclusive_operation
        grounds:
          - roles.RouteManager.exclusive_operations
          - roles.LotBoss
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=2]
        distinguishing_aspect: |
          The deny side of the allow-list: LotBoss is on the roles list of many stop endpoints (begin-setup,
          open-gates, teardown) but not on POST /route-stops or POST /routes/{id}/sequence, so both answer
          ERR_ROLE_NOT_PERMITTED (403) at priority 2 — ahead of any existence or state check, which is why the
          sequence attempt reports 403 rather than ERR_ROUTE_HAS_NO_STOPS even though the route is still empty.
        test_recipe:
          setup:
            - "Jurisdiction OH and Venue V1 seeded; Route R1 created and still DRAFT with no stops."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: false, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_r2: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_r2}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_r2: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_r2: "$.data.id" }
          trigger:
            - call: "POST /route-stops"
              payload: { route_id: "${route_r2}", venue_id: "${ven_r2}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: LotBoss
              captures: { e_r2a: "$.data.error_id" }
            - call: "POST /routes/${route_r2}/sequence"
              payload: {}
              as: LotBoss
              captures: { e_r2b: "$.data.error_id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_r2}", venue_id: "${ven_r2}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_r2: "$.data.id" }
          assert:
            - "Stop create as LotBoss: HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "Sequence as LotBoss: HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\" — not ERR_ROUTE_HAS_NO_STOPS, because priority 2 precedes 80"
            - "Same stop payload as RouteManager: HTTP 201 with sequence_index == null and status \"PLANNED\""
            - "GET /routes/${route_r2}/route-stops returns total_count == 1 — the two refused calls wrote nothing"

      - name: the_same_user_cannot_send_and_countersign_the_same_contract
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=50]
          - entities.Contract.fields.last_sent_by_user_id
        distinguishing_aspect: |
          Role membership is not enough: the human identity is tracked on Contract.last_sent_by_user_id, so the
          same X-User-ID that sent the deal is refused at execute with ERR_SEGREGATION_OF_DUTIES (403) even when
          they carry the GeneralManager role, while a different GeneralManager user executes the identical call
          successfully. Priority 50 sits after the state gates, so the refusal is specific to the identity clash
          and the contract stays SENT and re-executable.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Route R1 COMMITTED with stop A PLANNED, Contract C1 SENT by X-User-ID user-gm-9."
          setup_api_calls:
