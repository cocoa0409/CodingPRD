      assert:
      - BoxOrder.${b_ord_a}.pricing_status == PRICED
      - BoxOrder.${b_ord_a}.weight_total_grams == 1800
      - BoxOrder.${b_ord_a}.lines_total_cents == 300
      - GET /produce/box-orders/${b_ord_a}/items?status=INCLUDED returns exactly 2 rows
      - BoxOrder.${b_ord_b}.pricing_status == REVISED
      - BoxOrder.${b_ord_b}.weight_total_grams == 2000
      - BoxOrder.${b_ord_b}.lines_total_cents == 300
      - BoxOrder.${b_ord_b}.lines_total_cents != 380 (the provisional line-major reading of 200 + 180)
      - GET /produce/box-orders/${b_ord_b}/items?status=INCLUDED returns exactly 1 row
      - GET /produce/box-orders/${b_ord_b}/items?status=REMOVED returns exactly 1 row
  - name: quality_credit_cap_then_grace_vs_grace_then_cap
    grounds:
    - calculations.cap_quality_credit
    - diagnostics.credit_ceiling_delta_cents
    - state_machines.QualityClaim.IN_REVIEW_to_UPHELD
    - entities.QualityClaim.fields.credited_cents
    distinguishing_aspect: "The same claim yields two different lawful credits because the two ceilings over a credit are applied in different orders: the grace ceiling first and then the 75 percent line cap as a floor gives 400, while the shipped cap-then-grace order gives 300 \u2014 a 100 cent ceiling delta on identical inputs."
    test_recipe:
      setup:
      - 'Logical clock default 2026-09-01T00:00:00Z. Base box chain: centers DEMO-NE and DEMO-SO (region NE), supplier, lots FD1 (FRUIT, unit_weight 200, unit_cost 100) and FB1 (BAKERY, unit_weight 200, unit_cost 100), awarded and made ready PASS.'
      - 'Customer CRED REGISTERED at DEMO-NE with a WEEKLY subscription and one box order for cycle 1, built with line_plan [{FD1: 5}, {FB1: 4}] and PACKED through the lane rule (NE, transit 2, not insulated) to MEDIUM insulation and 2 coolant units.'
      - A quality claim filed against the FD1 build item at 500 cents, still IN_REVIEW.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Northeast
          region: NE
          insulation_profile: LIGHT
        as: PlatformAdmin
        captures:
          cre_id: $.data.id
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-SO
          name: Demo South
          region: NE
          insulation_profile: LIGHT
        as: PlatformAdmin
      - call: POST /produce/suppliers
        payload:
          name: Borealis Surplus Co
          region: NE
        as: PlatformAdmin
        captures:
          sup2_id: $.data.id
      - call: POST /produce/suppliers/${sup2_id}/lots
        payload:
          fulfillment_center_id: ${cre_id}
          product_name: CR-FD1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 200
          quantity_available: 100
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          cre_fd1: $.data.id
          c1v_fd1: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${cre_fd1}
          supplier_id: ${sup2_id}
          bid_unit_cost_cents: 100
          quantity_offered: 100
        as: Supplier
        as_user_id: ${sup2_id}
      - call: POST /produce/suppliers/${sup2_id}/lots
        payload:
          fulfillment_center_id: ${cre_id}
          product_name: CR-FB1
          category: BAKERY
          procurement_grade: SURPLUS
          unit_weight_grams: 200
          quantity_available: 100
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          cre_fb1: $.data.id
          c1v_fb1: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${cre_fb1}
          supplier_id: ${sup2_id}
          bid_unit_cost_cents: 100
          quantity_offered: 100
        as: Supplier
        as_user_id: ${sup2_id}
      - call: POST /produce/supply-lots/${cre_fd1}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${c1v_fd1}
        as: PlatformAdmin
        captures:
          c2v_fd1: $.data.version
      - call: POST /produce/supply-lots/${cre_fb1}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${c1v_fb1}
        as: PlatformAdmin
        captures:
          c2v_fb1: $.data.version
      - call: POST /produce/supply-lots/${cre_fd1}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${c2v_fd1}
        as: PlatformAdmin
      - call: POST /produce/supply-lots/${cre_fb1}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${c2v_fb1}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: cred@example.com
          full_name: Cred Cara
          service_region: NE
        as: Anonymous
        captures:
          cre_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${cre_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          cre_sub: $.data.id
      - call: POST /produce/box-orders
        payload:
          customer_id: ${cre_cu}
          subscription_id: ${cre_sub}
          serving_cycle_index: 1
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          cre_ord: $.data.id
          cre_ord_v: $.data.version
      - call: POST /produce/box-orders/${cre_ord}/build
        payload:
          expected_box_order_version: ${cre_ord_v}
          line_plan:
          - supply_lot_id: ${cre_fd1}
            units: 5
          - supply_lot_id: ${cre_fb1}
            units: 4
        as: FulfillmentOperator
        as_user_id: ${cre_id}
        captures:
          cre_ord_v2: $.data.version
      - call: POST /produce/box-orders/${cre_ord}/pack
        payload:
          expected_box_order_version: ${cre_ord_v2}
        as: FulfillmentOperator
        as_user_id: ${cre_id}
      - call: GET /produce/box-orders/${cre_ord}/items?status=INCLUDED
        payload: {}
        as: PlatformAdmin
        captures:
          cre_item_fd1: $.data[0].id
      - call: POST /produce/box-orders/${cre_ord}/quality-claims
        payload:
          box_build_item_id: ${cre_item_fd1}
          reason_code: SPOILED
          photo_url: https://cdn.example.com/evo/cred.jpg
          requested_credit_cents: 500
        as: PlatformAdmin
        captures:
          cre_clm: $.data.id
          cre_clm_v: $.data.version
      trigger:
      - call: POST /produce/quality-claims/${cre_clm}/review
        payload:
          outcome: UPHELD
          expected_claim_version: ${cre_clm_v}
        as: PlatformAdmin
      assert:
      - QualityClaim.${cre_clm}.status == UPHELD
      - QualityClaim.${cre_clm}.credited_cents == 300
      - diagnostics.credit_ceiling_delta_cents == 100 (the grace-then-cap reading is 400)
      - QualityClaim.${cre_clm}.credited_cents != 400
      - BoxOrder.${cre_ord}.credit_cents_issued == 300
      - Supplier.${sup2_id}.claims_upheld_total == 1
- rule_id: combinatorial_formula
  instances:
  - name: cold_chain_selection_transit_mandated_heavy_grade
    grounds:
    - calculations.cold_chain_selection
    - entities.ColdChainPack.fields.insulation_grade
    - entities.ColdChainPack.fields.coolant_units
    - state_machines.BoxOrder.BUILDING_to_PACKED
    distinguishing_aspect: "A seasonal WE lane at transit 4 forces insulation HEAVY and a weight-scaled coolant count of 4, where the nearest otherwise-identical NE lane at transit 2 keeps MEDIUM and the flat 2 \u2014 the non-linear min/max interaction of lane, season and weight, not a tier lookup."
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. Center DEMO-WE (region WE, insulation LIGHT), supplier, lot CW1 (FRUIT, unit_weight 160, unit_cost 100, quantity 200), awarded and PASS.
      - Customer Cold Wes REGISTERED at DEMO-WE with a WEEKLY subscription and one DRAFT order for cycle 1.
