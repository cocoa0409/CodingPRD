  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: false_alarm_ratio_cap_strict_inequality_on_verify
        grounds:
          - calculations.false_alarm_ratio
          - validations[priority=5]
          - endpoints.POST_/alarm-funding/alarm-events/{id}/verification
          - entities.AlarmReductionAction.fields.action_status
        distinguishing_aspect: |
          The false-alarm ratio cap is a strict > 35.00 boundary crossing reached through the
          alarm-verification endpoint: at 35 of 100 the ratio is exactly 35.00 and no
          reduction action is raised, while at 36 of 100 it is 36.00 and a SERVICE_REQUIRED
          action is created — a numeric threshold distinct from the empty-collection edge.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
