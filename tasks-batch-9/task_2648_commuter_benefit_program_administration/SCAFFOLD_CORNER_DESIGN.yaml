            - call: "POST /benefits/employers"
              payload: { legal_name: "Full Rollover Co", region_code: "US-WA-SEA", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000, rollover_policy: "FULL_ROLLOVER", rollover_cap_cents: 0 }
