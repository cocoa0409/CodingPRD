# =============================================================================
# SCAFFOLD_CORNER_DESIGN (Section 1.9) — task 1543
# Mobile Heavy-Duty Truck Repair & Roadside. Breadth coverage of every testable
# claim in SCAFFOLD.yaml Sections 1.1-1.7 not already pinned by Section 1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------
  - section: entities
    instances:
      - name: create_fleet_account_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.FleetAccount.fields.payment_terms_days, entities.FleetAccount.fields.status]
        distinguishing_aspect: "Omitting optional payment_terms_days applies the default 30; system fields initialize: status ACTIVE, suspension_reason NONE, month_to_date_spend_cents 0, effective_discount_tier STANDARD, version 1."
        test_recipe:
          setup: ["one rate card exists"]
          setup_api_calls:
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
          trigger:
            - { call: "POST /roadside/fleet-accounts", payload: { company_name: "HaulCo", account_number: "ACCT-1001", billing_email: "ap@haulco.example", per_call_authorization_limit_cents: 100000, monthly_spend_cap_cents: 500000 }, as: OpsAdmin, captures: { fa: $.data.id, terms: $.data.payment_terms_days, st: $.data.status, mtd: $.data.month_to_date_spend_cents, tier: $.data.effective_discount_tier, ver: $.data.version } }
          assert:
            - "terms == 30 (default applied), st == ACTIVE, mtd == 0, tier == STANDARD, ver == 1"
            - "response is 201 with meta.api_request_id present and response_type == object"

      - name: van_stock_reorder_point_default_applied
        claim_type: creation_defaults
        grounds: [entities.VanStockItem.fields.reorder_point]
        distinguishing_aspect: "Omitting reorder_point defaults it to 2 (distinct field and entity from the fleet-terms default)."
        test_recipe:
          setup: ["one technician exists"]
          setup_api_calls:
            - { call: "POST /roadside/technicians", payload: { full_name: "Tom Standard", employee_code: "T-101", certifications: ["ENGINE"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t2: $.data.id } }
          trigger:
            - { call: "POST /roadside/technicians/${t2}/van-stock", payload: { part_number: "ALT-104", description: "Alternator", part_class: "ENGINE", qty_on_hand: 5, unit_cost_cents: 21000, unit_retail_cents: 34999 }, as: OpsAdmin, captures: { vs: $.data.id, rp: $.data.reorder_point, pending: $.data.restock_pending } }
          assert:
            - "rp == 2 (default) and pending == false"

      - name: create_vehicle_duplicate_vin_rejected
        claim_type: uniqueness_constraint
        grounds: ["validations[priority=29]", "errors[ERR_DUPLICATE_VIN]"]
        distinguishing_aspect: "Second vehicle create reusing the same vin fails with ERR_DUPLICATE_VIN while a different vin succeeds; uniqueness is global, not per-fleet."
        test_recipe:
          setup: ["vehicle V1 with vin 1FUJHHDR1LLLW0002 exists"]
          setup_api_calls:
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { veh: $.data.id } }
          trigger:
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-02", make: "Kenworth", model: "T680", year: 2021, odometer_miles: 50000 }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_VIN (409); only one vehicle row exists"

      - name: get_missing_vehicle_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent UUID returns the error envelope with ERR_NOT_FOUND and 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /roadside/vehicles/11111111-2222-4333-8444-555566667777", as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (404); response_type == error; meta.api_request_id present"

      - name: vehicle_create_missing_vin_rejected
        claim_type: required_fields
        grounds: ["validations[priority=6]", entities.Vehicle.fields.vin]
        distinguishing_aspect: "A create body missing the required vin fails ERR_VALIDATION before any state or business rule runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /roadside/vehicles", payload: { unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (400)"

      - name: technician_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=7]", entities.Technician.fields.certifications]
        distinguishing_aspect: "certifications [\"ROCKET\"] is not in the declared enum set; rejected ERR_INVALID_ENUM (400), distinct from the generic shape error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /roadside/technicians", payload: { full_name: "Bad Cert", employee_code: "T-199", certifications: ["ROCKET"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_ENUM (400)"

      - name: unknown_payload_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=6]"]
        distinguishing_aspect: "Strict request shape: an unknown field (nickname) on vehicle create is rejected rather than silently dropped."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000, nickname: "Old Blue" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (400)"

      - name: vehicle_roadworthiness_flips_with_oos_defect_lifecycle
        claim_type: computed_fields
        grounds: [calculations.vehicle_roadworthiness, entities.Vehicle.fields.roadworthiness]
        distinguishing_aspect: "roadworthiness is derived from child defect states: OOS defect create flips ROADWORTHY -> OUT_OF_SERVICE; verify PASS of the last open OOS defect flips it back."
        test_recipe:
          setup:
            - "Vehicle with a completed correcting call: defect attached, repair done (2 calls of setup: the defect record + a correcting service call driven to REPAIR_COMPLETED)."
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { veh: $.data.id, rw0: $.data.roadworthiness } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Tom Standard", employee_code: "T-101", certifications: ["ELECTRICAL"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /roadside/technicians/${t2}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/vehicles/${veh}/inspection-defects", payload: { source: "ROADSIDE_DOT_INSPECTION", defect_code: "393.9", severity: "OOS", citation_reference: "DOT-7788", discovered_at: "2026-08-05T08:00:00Z" }, as: SafetyOfficer, captures: { def: $.data.id, def_status: $.data.status, def_deadline: $.data.correction_deadline_at } }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${veh}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 12", distance_miles_from_depot: 20, symptom_category: "LIGHTING", symptom_description: "marker lamps out per citation" }, as: Dispatcher, captures: { sc: $.data.id } }
            - { call: "POST /roadside/service-calls/${sc}/triage", payload: { severity: "DRIVABLE" }, as: Dispatcher, captures: { sc_v: $.data.version } }
            - { call: "POST /roadside/service-calls/${sc}/dispatches", payload: { technician_id: "${t2}", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T13:00:00Z", planned_travel_miles: 20, expected_service_call_version: "${sc_v}" }, as: Dispatcher, captures: { d1: $.data.id } }
            - { call: "POST /roadside/dispatches/${d1}/accept", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/dispatches/${d1}/depart", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:40:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/dispatches/${d1}/arrive", payload: { actual_travel_miles: 20 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${sc}/diagnose", payload: { diagnosis_summary: "wiring repaired", resolution_path: "ON_SITE_REPAIR" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${sc}/start-repair", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${sc}/complete-repair", payload: { labor_hours_actual: 1.0, completion_odometer_miles: 90020 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/inspection-defects/${def}/attach-call", payload: { service_call_id: "${sc}" }, as: SafetyOfficer, captures: { def_st2: $.data.status } }
            - { call: "POST /roadside/inspection-defects/${def}/mark-corrected", payload: { correction_note: "replaced harness section" }, as: Technician, as_user_id: "${t2}", captures: { def_st3: $.data.status } }
          trigger:
            - { call: "GET /roadside/vehicles/${veh}", as: SafetyOfficer, captures: { rw_mid: $.data.roadworthiness } }
            - { call: "POST /roadside/inspection-defects/${def}/verify", payload: { outcome: "PASS", verification_note: "lamps operational" }, as: SafetyOfficer, captures: { def_st4: $.data.status } }
            - { call: "GET /roadside/vehicles/${veh}", as: SafetyOfficer, captures: { rw_end: $.data.roadworthiness } }
          assert:
            - "rw0 == ROADWORTHY at registration"
            - "after OOS defect create: def_status == OPEN, def_deadline == 2026-08-20T08:00:00Z (discovered + 15 days), and the vehicle read shows OUT_OF_SERVICE"
            - "lifecycle: def_st2 == REPAIR_SCHEDULED, def_st3 == CORRECTED, def_st4 == VERIFIED"
            - "rw_mid == OUT_OF_SERVICE (still open while CORRECTED) and rw_end == ROADWORTHY after verify PASS"

      - name: list_pagination_envelope_and_filtering
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more; the status filter narrows the set before pagination."
        test_recipe:
          setup: ["three rate cards with disjoint windows (2024, 2025, 2026)"]
          setup_api_calls:
            - { call: "POST /roadside/rate-cards", payload: { name: "Y2024", labor_rate_standard_cents: 13000, labor_rate_master_cents: 16000, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 400, travel_time_per_minute_cents: 180, emergency_callout_fee_cents: 20000, parts_tax_rate_bp: 725, effective_from: "2024-01-01T00:00:00Z", effective_to: "2024-12-31T23:59:59Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "Y2025", labor_rate_standard_cents: 14000, labor_rate_master_cents: 17000, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 415, travel_time_per_minute_cents: 190, emergency_callout_fee_cents: 22500, parts_tax_rate_bp: 725, effective_from: "2025-01-01T00:00:00Z", effective_to: "2025-12-31T23:59:59Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "Y2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin }
          trigger:
            - { call: "GET /roadside/rate-cards?limit=2&offset=0", as: Dispatcher }
            - { call: "GET /roadside/rate-cards?limit=2&offset=2", as: Dispatcher }
          assert:
            - "page 1: response_type == array, data has 2 rows, total_count == 3, has_more == true"
            - "page 2: data has 1 row, total_count == 3, has_more == false"

      - name: version_increments_on_every_mutation
        claim_type: system_fields
        grounds: [entities.ServiceCall]
        distinguishing_aspect: "ServiceCall.version starts at 1 and increments by exactly 1 per mutation: create 1, triage 2, dispatch create 3."
        test_recipe:
          setup: ["rate card, vehicle, AVAILABLE technician"]
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Tom Standard", employee_code: "T-101", certifications: ["ENGINE"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /roadside/technicians/${t2}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${veh}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 12", distance_miles_from_depot: 20, symptom_category: "ENGINE_NO_START", symptom_description: "no start" }, as: Dispatcher, captures: { sc: $.data.id, v0: $.data.version } }
            - { call: "POST /roadside/service-calls/${sc}/triage", payload: { severity: "DRIVABLE" }, as: Dispatcher, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /roadside/service-calls/${sc}/dispatches", payload: { technician_id: "${t2}", window_start_at: "2026-08-05T10:00:00Z", window_end_at: "2026-08-05T12:00:00Z", planned_travel_miles: 20, expected_service_call_version: "${v1}" }, as: Dispatcher, captures: { d1: $.data.id } }
            - { call: "GET /roadside/service-calls/${sc}", as: Dispatcher, captures: { v2: $.data.version } }
          assert:
            - "v0 == 1, v1 == 2, v2 == 3 (dispatch create mutated the call: TRIAGED -> DISPATCHED)"

      - name: repeat_of_call_id_self_reference
        claim_type: parent_relationships
        grounds: [entities.ServiceCall.fields.repeat_of_call_id]
        distinguishing_aspect: "The self-referential link new_call.repeat_of_call_id -> original call is asserted inside the Section 1.8 reopen-cycle instance."
        excluded_because:
          difficulty_instance: service_call_closed_reopened_closed_cycle
          rationale: "The comeback confirmation sets repeat_of_call_id on the new call; asserted there via the case-decide side effects."

  # ---------------------------------------------------------------
  - section: state_machines
    instances:
      - name: triage_on_triaged_call_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceCall.RECEIVED_to_TRIAGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "triage is defined only from RECEIVED; a second triage on a TRIAGED call fails and leaves severity/priority unchanged."
        test_recipe:
          setup: ["retail call triaged once (DRIVABLE -> P2)"]
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${veh}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 12", distance_miles_from_depot: 20, symptom_category: "LIGHTING", symptom_description: "lights" }, as: Dispatcher, captures: { sc: $.data.id } }
            - { call: "POST /roadside/service-calls/${sc}/triage", payload: { severity: "DRIVABLE" }, as: Dispatcher, captures: { pr: $.data.priority } }
          trigger:
            - { call: "POST /roadside/service-calls/${sc}/triage", payload: { severity: "BLOCKING" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "pr == P2_URGENT after the first triage"
            - "err == ERR_INVALID_STATE (409); the call's priority remains P2_URGENT (no re-triage)"

      - name: cancel_terminal_lockdown_and_late_cancel_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ServiceCall, "errors[ERR_CALL_ALREADY_TERMINAL]"]
        distinguishing_aspect: "cancel is only declared from {RECEIVED, TRIAGED, DISPATCHED, EN_ROUTE}: from REPAIR_COMPLETED it fails ERR_INVALID_STATE, and from CANCELLED it fails ERR_CALL_ALREADY_TERMINAL - two distinct rejections."
        test_recipe:
          setup: ["call A cancelled at TRIAGED; call B driven to REPAIR_COMPLETED"]
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { vehA: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0003", unit_number: "R-02", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 80000 }, as: Dispatcher, captures: { vehB: $.data.id } }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${vehA}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "site A", distance_miles_from_depot: 20, symptom_category: "LIGHTING", symptom_description: "lights" }, as: Dispatcher, captures: { scA: $.data.id } }
            - { call: "POST /roadside/service-calls/${scA}/triage", payload: { severity: "DEFERRED" }, as: Dispatcher }
            - { call: "POST /roadside/service-calls/${scA}/cancel", payload: { reason: "customer cancelled" }, as: Dispatcher, captures: { stA: $.data.status } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Tom Standard", employee_code: "T-101", certifications: ["ENGINE"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /roadside/technicians/${t2}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${vehB}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "site B", distance_miles_from_depot: 20, symptom_category: "ENGINE_NO_START", symptom_description: "no start" }, as: Dispatcher, captures: { scB: $.data.id } }
            - { call: "POST /roadside/service-calls/${scB}/triage", payload: { severity: "DRIVABLE" }, as: Dispatcher, captures: { scB_v: $.data.version } }
            - { call: "POST /roadside/service-calls/${scB}/dispatches", payload: { technician_id: "${t2}", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T13:00:00Z", planned_travel_miles: 20, expected_service_call_version: "${scB_v}" }, as: Dispatcher, captures: { dB: $.data.id } }
            - { call: "POST /roadside/dispatches/${dB}/accept", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/dispatches/${dB}/depart", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:40:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/dispatches/${dB}/arrive", payload: { actual_travel_miles: 20 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scB}/diagnose", payload: { diagnosis_summary: "fuse", resolution_path: "ON_SITE_REPAIR" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scB}/start-repair", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scB}/complete-repair", payload: { labor_hours_actual: 0.5, completion_odometer_miles: 80020 }, as: Technician, as_user_id: "${t2}" }
          trigger:
            - { call: "POST /roadside/service-calls/${scA}/cancel", payload: { reason: "again" }, as: Dispatcher, captures: { errA: $.data.error_id } }
            - { call: "POST /roadside/service-calls/${scB}/cancel", payload: { reason: "too late" }, as: Dispatcher, captures: { errB: $.data.error_id } }
          assert:
            - "stA == CANCELLED and errA == ERR_CALL_ALREADY_TERMINAL (terminal lockdown)"
            - "errB == ERR_INVALID_STATE (cancel not declared from REPAIR_COMPLETED)"

      - name: dispatch_complete_requires_finished_work
        claim_type: precondition_enforcement
