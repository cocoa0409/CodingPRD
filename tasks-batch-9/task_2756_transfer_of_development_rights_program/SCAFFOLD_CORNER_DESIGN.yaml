              captures: { ev_aug: $.data.id }
            - call: "POST /tdr/evaluations"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", equity_weighting: "ACREAGE_WEIGHTED" }
              as: ProgramAdministrator
              captures: { ev_sep: $.data.id }
          assert:
            - "both evaluations return 201 with status COMPUTED — the two periods are disjoint, so neither supersedes nor collides with the other"
            - "ProgramEvaluation.${ev_aug}.preserved_acres == 100.00 and easement_count == 1"
            - "ProgramEvaluation.${ev_aug}.issued_units == 22, redeemed_units == 0, retired_units == 0, outstanding_units == 22"
            - "ProgramEvaluation.${ev_aug}.equity_index == 100.00 — the only easement in the window sits in an UNDERSERVED area"
            - "ProgramEvaluation.${ev_sep}.preserved_acres == 0.00 and easement_count == 0"
            - "ProgramEvaluation.${ev_sep}.issued_units == 0, redeemed_units == 0, retired_units == 0, outstanding_units == 0"
            - "ProgramEvaluation.${ev_sep}.equity_index == 0.00 — the zero-denominator guard, not an error"
            - "both evaluations report absorption_pct 0.00 (no ACTIVE or SUSPENDED receiving area exists) and total_cash_cents 0"
            - "ConservationEasement rows and Certificate rows are unchanged by either evaluation"

      - name: bonus_sizing_switches_from_the_provisional_to_the_final_variant_at_finalization
        claim_type: variant_selection
        grounds:
          - calculations.receiving_bonus_units
          - entities.ReceivingSiteApplication.fields.provisional_bonus_units
          - entities.ReceivingSiteApplication.fields.allocated_bonus_units
          - endpoints.POST_tdr_receiving-site-applications_id_finalize
        distinguishing_aspect: "One application, one set of inputs, two variants selected purely by CONTEXT: intake writes provisional_bonus_units 8 (half of max_bonus_units, backing ignored) and finalization writes allocated_bonus_units 16 (backing in the min, no halving). The provisional figure is not overwritten at finalization, so both readings remain visible side by side on the same row."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER, DEVELOPER (credited 30000000 cents), MUNICIPAL_BANK parties; appraisal schedule for NB-EAST (1234567 cents, 250 bps)"
            - "ACTIVE SA-EAST (UNDERSERVED); parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for 22 units and certified"
            - "the 22-unit certificate sold PRIVATE to the developer for 30000000 and settled, so the developer holds it"
            - "ACTIVE receiving area RA-CORE (base_density 4.0, max_bonus_pct 0.35, cap 500, design_review_required false)"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
