      - name: data_feed_cycles_monitored_degraded_suspended_and_back_to_monitored
        grounds:
          - state_machines.DataFeed
          - entities.DataFeed.fields.status
          - entities.DataFeed.fields.latest_reject_rate
          - calculations.participant_quality_score
          - entities.Participant.fields.quality_grade
        distinguishing_aspect: |
          DataFeed - a different entity from BreakGlassAccess - is cyclic rather than parallel: the same
          row travels PROVISIONING -> MONITORED -> DEGRADED -> SUSPENDED -> MONITORED, and because the
          quality window only counts MONITORED and DEGRADED feeds, the participant's grade drops to
          UNGRADED while the feed sits in SUSPENDED and returns to the identical 97.25 / A on RESTORE.
        test_recipe:
          setup:
            - "One participant advanced to CONFORMANCE_TESTING with one CCDA data feed in PROVISIONING."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Riverbend Laboratory", org_type: "LAB", declared_annual_patient_volume: 48000, primary_contact_email: "feeds@riverbend.example" }
              as: HieAdmin
              captures: { pE_id: $.data.id }
            - call: "POST /hie/participants/${pE_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pE_id}"
            - call: "POST /hie/participants/${pE_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pE_ver: $.data.version }
            - call: "POST /hie/participants/${pE_id}/data-feeds"
              payload: { feed_type: "CCDA", expected_participant_version: "${pE_ver}" }
              as: HieAdmin
              captures: { feedE_id: $.data.id, feedE_status_initial: $.data.status }
          trigger:
            - call: "POST /hie/data-feeds/${feedE_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 10000, messages_rejected: 300, required_fields_missing_count: 500, duplicate_count: 100, timeliness_p95_seconds: 240 }
              as: HieAdmin
            - call: "GET /hie/data-feeds/${feedE_id}"
              payload: {}
              as: HieAdmin
              captures: { statusE_1: $.data.status, rejectE_1: $.data.latest_reject_rate }
            - call: "POST /hie/data-feeds/${feedE_id}/quality-samples"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-15T00:00:00Z", messages_received: 5000, messages_rejected: 400, required_fields_missing_count: 100, duplicate_count: 50, timeliness_p95_seconds: 200 }
              as: HieAdmin
            - call: "GET /hie/data-feeds/${feedE_id}"
              payload: {}
              as: HieAdmin
              captures: { statusE_2: $.data.status, rejectE_2: $.data.latest_reject_rate, sampleE_count: $.data.sample_count }
            - call: "POST /hie/data-feeds/${feedE_id}/status-transitions"
              payload: { action: "SUSPEND", reason: "Interface engine cutover requested by the participant" }
              as: HieAdmin
              captures: { statusE_3: $.data.status }
            - call: "GET /hie/participants/${pE_id}/scorecard"
              payload: {}
              as: HieAdmin
              captures: { samplesE_suspended: $.data.samples_counted, scoreE_suspended: $.data.quality_score, gradeE_suspended: $.data.grade }
            - call: "POST /hie/data-feeds/${feedE_id}/status-transitions"
              payload: { action: "RESTORE", reason: "Interface engine cutover complete" }
              as: HieAdmin
              captures: { statusE_4: $.data.status }
            - call: "GET /hie/participants/${pE_id}/scorecard"
              payload: {}
              as: HieAdmin
              captures: { samplesE_restored: $.data.samples_counted, scoreE_restored: $.data.quality_score, gradeE_restored: $.data.grade }
          assert:
            - "${feedE_status_initial} == PROVISIONING"
            - "${statusE_1} == MONITORED"
            - "${rejectE_1} == 0.0300"
            - "${statusE_2} == DEGRADED"
            - "${rejectE_2} == 0.0800"
            - "${sampleE_count} == 2"
            - "${statusE_3} == SUSPENDED"
            - "${samplesE_suspended} == 0"
            - "${scoreE_suspended} == null"
            - "${gradeE_suspended} == UNGRADED"
            - "${statusE_4} == MONITORED"
            - "${samplesE_restored} == 2"
            - "${scoreE_restored} == 97.25"
            - "${gradeE_restored} == A"
            - "Participant.${pE_id}.quality_score == 97.25 and Participant.${pE_id}.quality_grade == A after the RESTORE"
  - rule_id: transitive_cascade
    instances:
      - name: unjustified_break_glass_review_cascades_sanction_suspension_feed_and_scorecard
        grounds:
          - calculations.break_glass_sanction_points
          - state_machines.Participant.CERTIFIED_to_SUSPENDED
          - state_machines.DataFeed.MONITORED_to_SUSPENDED
          - calculations.participant_quality_score
          - entities.DataFeed.fields.status_reason
          - entities.Participant.fields.sanction_points_active
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /hie/break-glass-accesses/{id}/review-decision with outcome
          UNJUSTIFIED: link 1 writes sanction_points_awarded, which (link 2) raises
          Participant.sanction_points_active to exactly 12 and only therefore fires CERTIFIED ->
          SUSPENDED, which (link 3) only therefore suspends every MONITORED DataFeed with status_reason
          PARTICIPANT_SUSPENSION_CASCADE, which (link 4) only therefore empties the quality window and
          rewrites quality_score to null and quality_grade to UNGRADED. Each link is caused by the
          previous link, not by the review call itself.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY threshold generation is ACTIVE."
            - "One participant certified end-to-end, with one CCDA data feed in MONITORED carrying a single clean sample that grades it A at 97.45."
            - "That participant contributed one patient record, creating a single-member ACTIVE identity cluster."
            - "One prior LIFE_THREATENING emergency session by clinician clin-f-1 has already been reviewed UNJUSTIFIED, leaving sanction_points_active == 6 and onboarding_status still CERTIFIED because 6 is below SANCTION_SUSPENSION_THRESHOLD."
            - "A second LIFE_THREATENING session by a different clinician clin-f-2 on the same cluster is OPEN and already claimed for review (no cooldown collision, because the cooldown key is (cluster_id, invoking_clinician_user_id))."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-C", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgF_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgF_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
