            - "Bid.${bid_a_id}.status == ACTIVE"

      - name: declaring_default_before_the_grace_date_returns_grace_period_not_elapsed
        claim_type: Temporal validation
        grounds:
          - validations[priority=20]
          - errors[ERR_GRACE_PERIOD_NOT_ELAPSED]
        distinguishing_aspect: "With delivery_end 2026-11-30 the grace boundary is 2026-12-10T23:59:59.999Z; at a clock of 2026-12-05T00:00:00Z the default is refused with ERR_GRACE_PERIOD_NOT_ELAPSED and the contract keeps status ACTIVE and damages_usd 0."
