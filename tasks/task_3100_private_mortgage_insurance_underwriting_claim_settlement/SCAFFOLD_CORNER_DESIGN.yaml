  - section: cross_cutting_layers
    instances:

      - name: cancelling_a_loan_with_a_stale_observed_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-settle-stale-loan-version]
          - errors[ERR_STALE_VERSION]
          - entities.Loan.fields.version
        distinguishing_aspect: "A settlement posted with a loan version the client observed before the claim was approved is refused with 412 ERR_STALE_VERSION, so the third stale-version rule is exercised on its own write endpoint rather than the settlement one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated loan with an approved claim. The loan's version is observed, then advanced by a delinquency report before the settlement is attempted."
          setup_api_calls:
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
