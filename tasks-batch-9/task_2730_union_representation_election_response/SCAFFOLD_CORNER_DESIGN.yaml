      - name: a_non_determinative_objection_cannot_be_sustained
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_OBJECTION_NOT_DETERMINATIVE
          - entities.Objection.fields.affects_results
          - endpoints.POST_objections_id_rule
          - state_machines.Petition.transitions.OBJECTIONS_PENDING_to_TALLY_POSTED
        distinguishing_aspect: |
          affects_results is computed from the PROVISIONAL margin (3) at filing time, so an objection
          alleging 2 affected voters can never be sustained however serious the ground: the SUSTAIN is
          refused with 409 and the rerun cascade must not fire. Overruling it instead drives
          pending_objection_count back to 0 and returns the case to TALLY_POSTED, which is the only way the
          election can still be certified.
