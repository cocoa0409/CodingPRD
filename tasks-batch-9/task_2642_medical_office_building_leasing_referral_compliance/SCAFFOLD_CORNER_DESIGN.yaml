# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml
# Task 2642 — Medical Office Building Leasing & Referral Compliance
#
# §1.9 breadth probe. The nine `section:` values and their `claim_type:` values
# are taken verbatim from references/claim-extraction-guide.md; no categories are
# invented. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs that cite the covering §1.8 instance by name.
#
# Conventions shared by every recipe below:
#   * The logical clock starts at 2026-08-01T00:00:00Z, so any chain that does
#     not call POST /_clock/set_current_utc is running on that date.
#   * The reference building is 100000 sf, market_base_rent_psf_annual 30.00,
#     operating_expense_annual_psf 9.60, 400 stalls, patient_min_reserve_pct 0.60.
#     Published bands therefore are STANDARD_EXAM [24.00, 34.50],
#     IMAGING [29.20, 41.98], PROCEDURE [27.40, 39.39], INFUSION [26.40, 37.95].
#   * Non-physician-owned tenants need no appraisal, which keeps most chains short;
#     appraisal chains are used only where the corner is about appraisals.
#   * Segregation of duties is satisfied by submitting as X-User-ID "agent-001"
#     and certifying as X-User-ID "compliance-001".
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: building_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Building
          - endpoints[POST /buildings]
          - response_envelope.success
        distinguishing_aspect: "POST /buildings with every required field returns 201 and a data object carrying the six inputs plus the derived mix and parking fields at their empty-building values."
        test_recipe:
          setup:
            - "Empty database; the clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c1_b_id: $.data.id }
          trigger:
            - call: "GET /buildings/${c1_b_id}"
              payload: {}
              as: PortfolioAdmin
          assert:
            - "POST /buildings returned HTTP 201 with response_type object and meta.api_request_id present"
            - "Building.${c1_b_id}.name == 'Meridian Medical Plaza', total_rentable_sf == 100000, market_base_rent_psf_annual == 30.00, operating_expense_annual_psf == 9.60, total_parking_stalls == 400, patient_min_reserve_pct == 0.60"
            - "Building.${c1_b_id}.leased_rentable_sf == 0, vacant_rentable_sf == 100000, anchor_rentable_sf == 0, independent_rentable_sf == 0, anchor_share_pct == 0.0000, tenant_mix_posture == BALANCED"
            - "Building.${c1_b_id}.staff_allocated_stalls == 0, patient_allocated_stalls == 0, unallocated_stalls == 400, mix_freeze_override == false"
            - "Building.${c1_b_id}.version == 1"

      - name: suite_retrieval_returns_stored_suite
        claim_type: retrieval
        grounds:
          - entities.Suite
          - endpoints[GET /suites/{id}]
        distinguishing_aspect: "GET /suites/{id} returns the suite exactly as created, including occupancy_status VACANT and the imaging attributes supplied at creation."
        test_recipe:
          setup:
            - "One reference Building with one 8000 sf IMAGING suite created with shielding_certified true and lead_thickness_mm 2.5."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c2_b_id: $.data.id }
            - call: "POST /buildings/${c2_b_id}/suites"
              payload: { suite_number: "150", floor: 1, rentable_sf: 8000, suite_class: "IMAGING", power_amps_available: 600, medical_gas_available: false, shielding_certified: true, lead_thickness_mm: 2.5 }
              as: PortfolioAdmin
              captures: { c2_s_id: $.data.id }
          trigger:
            - call: "GET /suites/${c2_s_id}"
              payload: {}
              as: LeasingAgent
          assert:
            - "GET returns 200 with Suite.${c2_s_id}.building_id == ${c2_b_id}, suite_number == '150', floor == 1, rentable_sf == 8000, suite_class == IMAGING"
            - "Suite.${c2_s_id}.power_amps_available == 600, medical_gas_available == false, shielding_certified == true, lead_thickness_mm == 2.5"
            - "Suite.${c2_s_id}.occupancy_status == VACANT, last_vacated_on == null, version == 1"

      - name: suite_listing_filters_by_class_with_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /buildings/{id}/suites]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two IMAGING suites and one STANDARD_EXAM suite, GET /buildings/{id}/suites?suite_class=IMAGING&limit=1&offset=0 returns exactly one row with total_count 2 and has_more true, and offset=1 returns the other row with has_more false."
        test_recipe:
          setup:
            - "One reference Building with two IMAGING suites (8000 sf and 6000 sf) and one 5000 sf STANDARD_EXAM suite, created in that order."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c3_b_id: $.data.id }
            - call: "POST /buildings/${c3_b_id}/suites"
              payload: { suite_number: "150", floor: 1, rentable_sf: 8000, suite_class: "IMAGING", power_amps_available: 600, shielding_certified: true, lead_thickness_mm: 2.5 }
              as: PortfolioAdmin
              captures: { c3_s1_id: $.data.id }
            - call: "POST /buildings/${c3_b_id}/suites"
              payload: { suite_number: "151", floor: 1, rentable_sf: 6000, suite_class: "IMAGING", power_amps_available: 500, shielding_certified: true, lead_thickness_mm: 2.0 }
              as: PortfolioAdmin
              captures: { c3_s2_id: $.data.id }
            - call: "POST /buildings/${c3_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { c3_s3_id: $.data.id }
          trigger:
            - call: "GET /buildings/${c3_b_id}/suites"
              payload: { suite_class: "IMAGING", limit: 1, offset: 0 }
              as: LeasingAgent
            - call: "GET /buildings/${c3_b_id}/suites"
              payload: { suite_class: "IMAGING", limit: 1, offset: 1 }
              as: LeasingAgent
            - call: "GET /buildings/${c3_b_id}/suites"
              payload: {}
              as: LeasingAgent
          assert:
            - "The first page returns response_type array with exactly one element, that element being ${c3_s1_id}, and meta.total_count == 2, meta.limit == 1, meta.offset == 0, meta.has_more == true"
            - "The second page returns exactly one element, ${c3_s2_id}, with meta.total_count == 2, meta.offset == 1, meta.has_more == false"
            - "The unfiltered, unpaginated listing returns all three suites with meta.total_count == 3, meta.limit == 10 (the declared default), meta.offset == 0 and meta.has_more == false"
            - "${c3_s3_id} never appears in either IMAGING-filtered page"

      - name: lease_get_unknown_id_returns_lease_not_found
        claim_type: not_found
        grounds:
          - validations[7]
          - errors.ERR_LEASE_NOT_FOUND
          - endpoints[GET /leases/{id}]
        distinguishing_aspect: "A syntactically valid UUID that names no Lease returns 404 ERR_LEASE_NOT_FOUND even though the database is non-empty, so the 404 is about the id and not about an empty store."
        test_recipe:
          setup:
            - "One reference Building exists, so the database is not empty, but no Lease has ever been created."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c4_b_id: $.data.id }
          trigger:
            - call: "GET /leases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LeasingAgent
            - call: "GET /leases"
              payload: {}
              as: LeasingAgent
          assert:
            - "The GET by unknown id returns 404 with response_type error and data.error_id == 'ERR_LEASE_NOT_FOUND'"
            - "GET /leases returns 200 with data == [] and meta.total_count == 0"

      - name: tenant_creation_missing_required_npi_rejected
        claim_type: required_fields
        grounds:
          - validations[3]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /tenants]
        distinguishing_aspect: "POST /tenants without the required npi field returns 400 ERR_INVALID_REQUEST and creates nothing, so the follow-up listing of the tenant's compliance cases cannot resolve any tenant."
        test_recipe:
          setup:
            - "Empty database except for one reference Building."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c5_b_id: $.data.id }
          trigger:
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false }
              as: PortfolioAdmin
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568041" }
              as: PortfolioAdmin
              captures: { c5_t_id: $.data.id }
          assert:
            - "The first POST returns 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "The second POST returns 201 with Tenant.${c5_t_id}.npi == '1234568041', compliance_watch_status == CLEAR, referral_compliance_risk_score == 0, strict_cumulative_risk_score == 0, delinquency_event_count == 0"

      - name: building_patient_reserve_pct_defaults_to_sixty_percent
        claim_type: defaults
        grounds:
          - entities.Building.fields.patient_min_reserve_pct
          - calculations.parking_pool_balance
          - validations[46]
          - errors.ERR_PATIENT_PARKING_RESERVE_BREACH
        distinguishing_aspect: "Omitting patient_min_reserve_pct yields 0.60, which is observable as a hard staff ceiling of 160 stalls on a 400-stall building: a STAFF request for 161 is refused and one for 160 is accepted."
        test_recipe:
          setup:
            - "One 100000 sf Building created WITHOUT patient_min_reserve_pct, with 400 total_parking_stalls."
            - "One 5000 sf STANDARD_EXAM suite, one non-physician-owned INDEPENDENT_PRACTICE tenant and one DRAFT DIRECT lease to hang allocations on."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400 }
              as: PortfolioAdmin
              captures: { c6_b_id: $.data.id }
            - call: "POST /buildings/${c6_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { c6_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568051" }
              as: PortfolioAdmin
              captures: { c6_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${c6_b_id}", suite_id: "${c6_s_id}", tenant_id: "${c6_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { c6_l_id: $.data.id }
            - call: "GET /buildings/${c6_b_id}"
              payload: {}
              as: PropertyManager
              captures: { c6_b_v: $.data.version }
          trigger:
            - call: "POST /parking-allocations"
              payload: { expected_building_version: "${c6_b_v}", building_id: "${c6_b_id}", lease_id: "${c6_l_id}", category: "STAFF", stall_count: 161 }
              as: PropertyManager
            - call: "POST /parking-allocations"
              payload: { expected_building_version: "${c6_b_v}", building_id: "${c6_b_id}", lease_id: "${c6_l_id}", category: "STAFF", stall_count: 160 }
              as: PropertyManager
              captures: { c6_pa_id: $.data.id }
          assert:
            - "Building.${c6_b_id}.patient_min_reserve_pct == 0.60 without being supplied"
            - "The 161-stall STAFF request returns 422 ERR_PATIENT_PARKING_RESERVE_BREACH, because 400 - 161 == 239 is below the reserve minimum ceil(400 * 0.60) == 240"
            - "The rejected request did not bump the building version, so the identical expected_building_version ${c6_b_v} is still current for the second call"
            - "The 160-stall STAFF request returns 201 with ParkingAllocation.${c6_pa_id}.status == ACTIVE"
            - "Building.${c6_b_id}.staff_allocated_stalls == 160, patient_allocated_stalls == 0, unallocated_stalls == 240"

      - name: suite_optional_flags_default_false_when_omitted
        claim_type: defaults
        grounds:
          - entities.Suite.fields.medical_gas_available
          - entities.Suite.fields.shielding_certified
          - endpoints[POST /buildings/{id}/suites]
        distinguishing_aspect: "A suite created without medical_gas_available, shielding_certified or lead_thickness_mm reads false, false and null — the values a downstream imaging commencement check depends on."
        test_recipe:
          setup:
            - "One reference Building."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c7_b_id: $.data.id }
          trigger:
            - call: "POST /buildings/${c7_b_id}/suites"
              payload: { suite_number: "150", floor: 1, rentable_sf: 8000, suite_class: "IMAGING", power_amps_available: 600 }
              as: PortfolioAdmin
              captures: { c7_s_id: $.data.id }
          assert:
            - "Suite.${c7_s_id}.medical_gas_available == false"
            - "Suite.${c7_s_id}.shielding_certified == false"
            - "Suite.${c7_s_id}.lead_thickness_mm == null"
            - "Suite.${c7_s_id}.occupancy_status == VACANT"

      - name: lease_term_months_computed_from_closed_term_dates
        claim_type: computed_fields
        grounds:
          - calculations.lease_term_months
          - entities.Lease.fields.term_months
          - validations[30]
        distinguishing_aspect: "A term of 2026-09-01 through 2027-08-31 computes term_months 12, not 11: the closed interval is measured to the exclusive end 2027-09-01, which is the difference between passing and failing the twelve-month minimum."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite and one non-physician-owned INDEPENDENT_PRACTICE tenant."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c8_b_id: $.data.id }
            - call: "POST /buildings/${c8_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { c8_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568061" }
              as: PortfolioAdmin
              captures: { c8_t_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { building_id: "${c8_b_id}", suite_id: "${c8_s_id}", tenant_id: "${c8_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2027-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { c8_l_id: $.data.id }
          assert:
            - "POST returns 201 with Lease.${c8_l_id}.term_months == 12"
            - "Lease.${c8_l_id}.status == DRAFT and fmv_certification_status == NOT_STARTED"
            - "No ERR_MIN_TERM_NOT_MET is raised, because 12 >= 12"

      - name: lease_system_fields_generated_with_version_one
        claim_type: system_fields
        grounds:
          - entities.Lease
          - response_envelope.success
        distinguishing_aspect: "A newly created Lease has a server-minted id, created_at and updated_at equal to the logical clock 2026-08-01T00:00:00Z, and version 1; the client supplies none of them."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite and one non-physician-owned INDEPENDENT_PRACTICE tenant; the clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c9_b_id: $.data.id }
            - call: "POST /buildings/${c9_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { c9_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568071" }
              as: PortfolioAdmin
              captures: { c9_t_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { building_id: "${c9_b_id}", suite_id: "${c9_s_id}", tenant_id: "${c9_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { c9_l_id: $.data.id }
            - call: "GET /leases/${c9_l_id}"
              payload: {}
              as: LeasingAgent
          assert:
            - "Lease.${c9_l_id}.id is a server-generated identifier the request never supplied"
            - "Lease.${c9_l_id}.created_at == '2026-08-01T00:00:00Z' and updated_at == '2026-08-01T00:00:00Z'"
            - "Lease.${c9_l_id}.version == 1"
            - "Lease.${c9_l_id}.revision_round == 0, signed_lease_on_file == false, master_lease_consent_on_file == false, space_sharing_schedule_on_file == false, after_hours_authorized == false, rent_concession_locked == false"

      - name: lease_invalid_lease_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[3]
          - entities.Lease.fields.lease_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "lease_type 'GROUND' is not a declared member of {DIRECT, MASTER, SUBLEASE}, so POST /leases returns 400 ERR_INVALID_REQUEST, and a term whose end precedes its start is refused by the same rule."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite and one non-physician-owned INDEPENDENT_PRACTICE tenant."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c10_b_id: $.data.id }
            - call: "POST /buildings/${c10_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { c10_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568081" }
              as: PortfolioAdmin
              captures: { c10_t_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { building_id: "${c10_b_id}", suite_id: "${c10_s_id}", tenant_id: "${c10_t_id}", lease_type: "GROUND", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
            - call: "POST /leases"
              payload: { building_id: "${c10_b_id}", suite_id: "${c10_s_id}", tenant_id: "${c10_t_id}", lease_type: "DIRECT", term_start: "2029-08-31", term_end: "2026-09-01", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
            - call: "GET /leases"
              payload: { building_id: "${c10_b_id}" }
              as: LeasingAgent
          assert:
            - "The bad-enum POST returns 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "The reversed-term POST returns 400 with data.error_id == 'ERR_INVALID_REQUEST' (term_end > term_start is required), not ERR_MIN_TERM_NOT_MET"
            - "GET /leases?building_id=${c10_b_id} returns meta.total_count == 0 — neither rejected request persisted a row"

      - name: booking_zero_occupant_count_rejected
        claim_type: type_constraints
        grounds:
          - validations[3]
          - entities.SharedSpaceBooking.fields.occupant_count
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "occupant_count must be at least 1, so a booking for 0 occupants returns 400 ERR_INVALID_REQUEST rather than being silently admitted as a zero-seat reservation."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite and a 24-seat WAITING_ROOM shared space open 07:00-19:00."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant on a DRAFT DIRECT lease with SPACE_SHARING_SCHEDULE on file."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { c11_b_id: $.data.id }
            - call: "POST /buildings/${c11_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { c11_s_id: $.data.id }
            - call: "POST /buildings/${c11_b_id}/shared-spaces"
              payload: { name: "Second Floor Shared Waiting Room", space_type: "WAITING_ROOM", capacity_seats: 24, opens_at: "07:00", closes_at: "19:00" }
              as: PortfolioAdmin
              captures: { c11_ss_id: $.data.id }
            - call: "POST /tenants"
