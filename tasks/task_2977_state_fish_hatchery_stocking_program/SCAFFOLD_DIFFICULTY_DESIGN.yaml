            - *k_run2
            - *k_lot_v2
            - call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req2_id}"
                lot_id: "${lot_id}"
                transport_unit_id: "${truck1_id}"
                fish_count: 2500
                scheduled_depart_at: "2026-09-03T06:00:00Z"
                scheduled_return_at: "2026-09-03T12:00:00Z"
                expected_lot_version: "${lot_v2}"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { event4_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /stocking-events/${event4_id}/load"
              payload: { loaded_at: "2026-09-03T06:00:00Z", load_water_temp_c: 12.0, measured_load_lbs: 250.0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T07:59:59Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /stocking-events/${event4_id}/release"
              payload: { arrived_at: "2026-09-03T07:30:00Z", site_water_temp_c: 4.5, tempering_minutes: 48, transport_mortality_count: 0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 409 with error_id ERR_WATER_REST_BUFFER"
            - "Water.${water_a_id}.last_release_at == 2026-09-01T08:00:00Z and released_count_ytd == 2380 (unchanged)"
            - "StockingEvent.${event4_id}.status == IN_TRANSIT and released_count == null"
            - "TransportUnit.${truck1_id}.status == IN_USE"
            - "advancing the clock to exactly 2026-09-03T08:00:00Z and repeating the identical call returns 201 — the far edge is inclusive"

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: spawn_cancel_restores_water_right_and_female_identities
        grounds:
          - conserved_quantities.water-right-conservation
          - state_machines.SpawnEvent.PLANNED_to_CANCELLED
          - entities.Hatchery.fields.water_reserved_af
          - entities.BroodStock.fields.females_reserved
          - endpoints.POST /spawn-events/{id}/cancel
        distinguishing_aspect: |
          One compensation unwinds reservations on TWO different parents at once:
          cancelling the spawn event returns 3.0000 acre-feet to the hatchery's water
          right AND 20 females to the brood group, and it refunds the value stored on
          the event rather than re-projecting it from the hatchery's current density.
          Replaying the cancel must not refund a second time.
        test_recipe:
          setup:
            - "Hatchery SLVC holds an annual_water_right_af of 120.0 with nothing reserved, used or available-adjusted"
            - "Brood group BS-1 has 400 females and is SPAWNING inside its 2026-08-01..2026-10-31 window"
            - "Spawn event S1 is PLANNED for 20 females with a target_release_count of 15000, which reserved water_reserved_af 3.0000 and 20 females"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_brood
            - *k_open
            - *k_spawn1
          trigger:
            - call: "POST /spawn-events/${spawn1_id}/cancel"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 200: SpawnEvent.${spawn1_id}.status == CANCELLED"
            - "SpawnEvent.${spawn1_id}.water_reserved_af remains 3.0000 on the record (the audit trail of what was returned) while eggs_taken stays null"
            - "Hatchery.${hatch_id}.water_reserved_af == 0.0000, water_used_af == 0.0000, water_available_af == 120.0000"
            - "the identity holds: annual_water_right_af 120.0000 == 120.0000 + 0.0000 + 0.0000"
            - "BroodStock.${brood_id}.females_reserved == 0, females_available == 400, females_spent == 0, cumulative_eggs_taken == 0"
            - "BroodStock.${brood_id}.status == SPAWNING — the cancellation does not close the window"
            - "no RearingLot exists for ${spawn1_id}: GET /rearing-lots?spawn_event_id=${spawn1_id} returns total_count 0"
            - "Hatchery.${hatch_id}.operating_posture == OPEN"
            - "re-issuing the identical cancel returns 409 ERR_INVALID_STATE and water_available_af is STILL 120.0000 — no double refund"

      - name: event_abort_restores_fish_budget_and_grant_identities
        grounds:
          - conserved_quantities.fish-count-conservation
          - conserved_quantities.budget-conservation
          - state_machines.StockingEvent.SCHEDULED_to_ABORTED
          - state_machines.StockingRequest.ALLOCATED_to_DEFERRED
          - endpoints.POST /stocking-events/{id}/abort
        distinguishing_aspect: |
          A single abort must reverse a four-way reservation — lot reserved_count,
          hatchery budget_committed_cents, the request's grant and the water's
          allocated_count_ytd — and it must move the 2400 fish back to AVAILABLE
          without touching count_on_hand, which never fell in the first place. An
          implementation that decrements count_on_hand on abort silently destroys
          2400 fish while leaving the printed reserved_count correct.
        test_recipe:
          setup:
            - "The full base chain up to event creation: the lot holds 16000 YEARLING fish with 4000 cumulative mortalities out of an initial 20000 eggs"
            - "Request R1 is ALLOCATED 2400 against Blue Mesa, so Water.allocated_count_ytd is 2400"
            - "Event E1 is SCHEDULED for 2400 fish, which reserved 2400 fish and committed 81000 cents of the 50000000-cent budget"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
          trigger:
            - call: "POST /stocking-events/${event1_id}/abort"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 200: StockingEvent.${event1_id}.status == ABORTED, abort_reason == OPERATOR_ABORT, released_count == 0, aborted_at == 2026-09-01T08:00:00Z"
            - "RearingLot.${lot_id}.reserved_count == 0 and count_on_hand == 16000 — the fish stay in the raceway"
            - "the fish identity holds: initial_count 20000 == count_on_hand 16000 + reserved_count 0 + cumulative_mortality_count 4000 + released 0"
            - "Hatchery.${hatch_id}.budget_committed_cents == 0, budget_spent_cents == 0, budget_available_cents == 50000000"
            - "the budget identity holds: annual_budget_cents 50000000 == 50000000 + 0 + 0"
            - "StockingRequest.${req1_id}.status == DEFERRED, allocated_count == 0, deferral_reason == EVENT_ABORTED, allocated_at == null"
            - "Water.${water_a_id}.allocated_count_ytd == 0 and released_count_ytd == 0"
            - "TransportUnit.${truck1_id}.status == AVAILABLE and current_event_id == null (it was never loaded)"
            - "re-issuing the abort returns 409 ERR_INVALID_STATE and reserved_count is STILL 0 with budget_available_cents STILL 50000000 — no double restoration"

      - name: release_moves_budget_from_committed_to_spent_without_drift
        grounds:
          - conserved_quantities.budget-conservation
          - conserved_quantities.fish-count-conservation
          - state_machines.StockingEvent.IN_TRANSIT_to_RELEASED
          - endpoints.POST /stocking-events/{id}/release
        distinguishing_aspect: |
          The non-reversing half of the same compensating pair: a release moves the
          identical 81000 cents SIDEWAYS from committed to spent instead of back to
          available, and it moves the 2400 fish OUT of count_on_hand instead of back
          into it. Both three-term identities must still balance to the same totals
          as the abort case, which is what distinguishes drift from real conservation.
        test_recipe:
          setup:
            - "The full base chain with E1 IN_TRANSIT: 2400 fish reserved, 81000 cents committed, loaded at 12.0 degrees C"
            - "Blue Mesa has never been stocked, so no rest buffer applies"
            - "The clock stands at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
            - *k_load1
          trigger:
            - call: "POST /stocking-events/${event1_id}/release"
              payload: { arrived_at: "2026-09-01T11:00:00Z", site_water_temp_c: 4.5, tempering_minutes: 48, transport_mortality_count: 20 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 200: StockingEvent.${event1_id}.status == RELEASED, released_count == 2380, released_at == 2026-09-01T08:00:00Z"
            - "Hatchery.${hatch_id}.budget_committed_cents == 0, budget_spent_cents == 81000, budget_available_cents == 49919000"
            - "the budget identity holds: annual_budget_cents 50000000 == 49919000 + 0 + 81000 — the cents moved, they were not refunded"
            - "RearingLot.${lot_id}.reserved_count == 0, count_on_hand == 13600, cumulative_mortality_count == 4020"
            - "the fish identity holds: initial_count 20000 == count_on_hand 13600 + reserved_count 0 + cumulative_mortality_count 4020 + released 2380"
            - "Water.${water_a_id}.released_count_ytd == 2380, allocated_count_ytd == 0, last_release_at == 2026-09-01T08:00:00Z"
            - "StockingRequest.${req1_id}.status == FULFILLED with fulfilled_at == 2026-09-01T08:00:00Z and allocated_count still 2400"
            - "TransportUnit.${truck1_id}.status == AVAILABLE and current_event_id == null"
            - "aborting afterwards returns 409 ERR_INVALID_STATE — RELEASED is terminal, so the spent cents can never be un-spent"
