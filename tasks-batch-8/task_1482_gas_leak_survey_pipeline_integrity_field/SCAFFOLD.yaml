    roles: [IntegrityAnalyst]
    code: 200
    input: []
    output: PipeSegment
    side_effects: ["Cascade Leak -> ABANDONED_SEGMENT", "Cancel PENDING_DISPATCH RepairOrders", "Recompute counters"]

  - method: POST
    path: /pipe-segments/{id}/return-to-service
    description: "Return PipeSegment to service"
    roles: [IntegrityAnalyst]
    code: 200
    input: []
    output: PipeSegment

