    code: 201
    input: [amount_cents]
    output: CaretakingInvoice
    side_effects: ["paid_cents += amount_cents; invoice -> PARTIALLY_PAID or PAID; grower.caretaking_balance_cents -= amount_cents; increments grower.version"]
  - method: POST
    path: /packinghouse/caretaking-invoices/{id}/dispute
