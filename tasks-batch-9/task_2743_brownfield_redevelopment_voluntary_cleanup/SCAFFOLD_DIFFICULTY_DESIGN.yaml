# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Scaffold Difficulty Design
# Task: task_2743_brownfield_redevelopment_voluntary_cleanup
#
# Test-targeting index for the nine §0.5 Difficulty Rules against SCAFFOLD.yaml
# §1.1–§1.7. Every instance grounds in already-declared scaffold elements; this
# file adds no behaviour of its own.
#
# Setup chains are built from per-call YAML anchors (&k_*) defined at first use
# and aliased (*k_*) by later instances, so every instance's chain is the
# literal, executable call sequence with no prose shorthand. The shared prefix
# is:
#   clock 2026-08-01 -> parties -> laboratory -> site -> liability protection
#   -> PHASE_I (findings, submit, APPROVE) -> inquiry completion -> acquisition
#   -> PHASE_II (findings, submit, APPROVE) -> cleanup goals -> VCP enrollment
#   -> eligibility ENROLL -> remedial action plan -> site control -> submit
#   -> technical PASS -> public comment close -> approve -> cost-cap quote/bind
#
# Every money literal below was computed by executing the §1.3 formulas
# (Decimal, ROUND_HALF_UP) against the pinned fixtures; no assertion contains an
# unevaluated expression.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: cleanup_goal_restricted_vs_unrestricted_basis_diverge
        grounds:
          - calculations.risk_based_cleanup_goal
          - entities.CleanupGoal.fields.goal_ugl
          - entities.CleanupGoal.fields.cumulative_cap_applied
          - entities.CleanupGoal.fields.contaminant_count_in_media
          - entities.Site.fields.intended_reuse
        distinguishing_aspect: |
          Dual-variant logic in the risk-assessment entity domain (CleanupGoal):
          one screening level of 5.0 ug/L in SOIL_VAPOR yields goal_ugl 250.00
          under restricted_basis (COMMERCIAL 3.5 x VAPOR_MITIGATION credit 10 /
          attenuation 0.03 = 5833.33, clipped by the two-analyte cumulative cap)
          and 166.67 under unrestricted_basis (forced RESIDENTIAL 1.0, no credit,
          / 0.03) — a divergence of 83.33 ug/L on byte-identical inputs.
        test_recipe:
          setup:
            - "Clock at 2026-08-01; redeveloper, consultant, insurer parties and one laboratory registered."
            - "Site 'Kinnickinnic Rail Yard' UNDER_CONTRACT, intended_reuse COMMERCIAL, institutional_control_committed true, planned_acquisition_date 2026-10-15."
            - "APPROVED PHASE_I carrying TCE SOIL_VAPOR at 480 ug/L against a 5.0 screening level (exceedance_factor 96.00)."
            - "APPROVED PHASE_II (delineation_confidence FULL, delineation_complete true) carrying TCE SOIL_VAPOR 4.80, PCE SOIL_VAPOR 1.90 and BENZENE GROUNDWATER 4.50."
            - "Distinct SOIL_VAPOR analytes with exceedance_factor > 1.0 across APPROVED phases = {TCE, PCE} = 2, so the cumulative cap is 500.0 / 2 = 250.00 ug/L."
          setup_api_calls:
            - &k_clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &k_redev
              call: "POST /parties"
              payload: { legal_name: "Ironbridge Redevelopment LLC", party_type: REDEVELOPER, state_code: "OH" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { redev_id: $.data.id }
            - &k_consult
              call: "POST /parties"
              payload: { legal_name: "Terraline Environmental PC", party_type: CONSULTANT, state_code: "OH", licence_number: "OH-PG-4417" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { consult_id: $.data.id }
            - &k_insurer
              call: "POST /parties"
              payload: { legal_name: "Meridian Specialty Insurance Co", party_type: INSURER, state_code: "OH", licence_number: "OH-INS-2290" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { insurer_id: $.data.id }
            - &k_lab
              call: "POST /laboratories"
              payload: { lab_name: "GreatLakes Analytical", certification_code: "NELAP-OH-118", concurrent_capacity: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { lab_id: $.data.id }
            - &k_site
              call: "POST /sites"
              payload:
                owner_party_id: "${redev_id}"
                site_name: "Kinnickinnic Rail Yard"
                county_code: "OH-039"
                acreage: 12.4
                intended_reuse: COMMERCIAL
                planned_acquisition_date: "2026-10-15"
                institutional_control_committed: true
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { site_id: $.data.id }
            - &k_prot
              call: "POST /liability-protections"
              payload: { site_id: "${site_id}" }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { prot_id: $.data.id }
            - &k_p1
              call: "POST /assessment-phases"
              payload:
                site_id: "${site_id}"
                consultant_party_id: "${consult_id}"
                phase_type: PHASE_I
                field_start_date: "2026-06-01"
                field_end_date: "2026-07-10"
                delineation_confidence: SCREENING
                aai_report_date: "2026-07-20"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { p1_id: $.data.id }
            - &k_p1f
              call: "POST /assessment-phases/${p1_id}/contaminant-findings"
              payload:
                contaminant_code: "TCE"
                media: SOIL_VAPOR
                sample_location_code: "SV-01"
                max_concentration_ugl: 480.0
                screening_level_ugl: 5.0
                delineated: false
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { f1_id: $.data.id }
            - &k_p1sub
              call: "POST /assessment-phases/${p1_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_p1app
              call: "POST /assessment-phases/${p1_id}/review"
              payload: { decision: APPROVE, review_comment: "All appropriate inquiries record accepted." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_inq
              call: "POST /liability-protections/${prot_id}/inquiry-completion"
              payload: { aai_phase_id: "${p1_id}" }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_clock_acq
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &k_acq
              call: "POST /sites/${site_id}/acquisition"
              payload: { acquisition_date: "2026-10-15" }
              as: Redeveloper
              as_user_id: "${redev_id}"
            - &k_clock_dec
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &k_p2
              call: "POST /assessment-phases"
              payload:
                site_id: "${site_id}"
                consultant_party_id: "${consult_id}"
                phase_type: PHASE_II
                field_start_date: "2026-11-01"
                field_end_date: "2026-12-05"
                delineation_confidence: FULL
                delineation_complete: true
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { p2_id: $.data.id }
            - &k_p2fa
              call: "POST /assessment-phases/${p2_id}/contaminant-findings"
              payload:
                contaminant_code: "TCE"
                media: SOIL_VAPOR
                sample_location_code: "SV-11"
                max_concentration_ugl: 24.0
                screening_level_ugl: 5.0
                delineated: true
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_p2fb
              call: "POST /assessment-phases/${p2_id}/contaminant-findings"
              payload:
                contaminant_code: "PCE"
                media: SOIL_VAPOR
                sample_location_code: "SV-12"
                max_concentration_ugl: 4.75
                screening_level_ugl: 2.5
                delineated: true
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_p2fc
              call: "POST /assessment-phases/${p2_id}/contaminant-findings"
              payload:
                contaminant_code: "BENZENE"
                media: GROUNDWATER
                sample_location_code: "MW-03"
                max_concentration_ugl: 22.5
                screening_level_ugl: 5.0
                delineated: true
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_p2sub
              call: "POST /assessment-phases/${p2_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_p2app
              call: "POST /assessment-phases/${p2_id}/review"
              payload: { decision: APPROVE, review_comment: "Delineation complete; remedial planning may proceed." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          trigger:
            - &k_g1
              call: "POST /sites/${site_id}/cleanup-goals"
              payload:
                contaminant_code: "TCE"
                media: SOIL_VAPOR
                screening_level_ugl: 5.0
                basis: RESTRICTED
                control_credit_type: VAPOR_MITIGATION
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - &k_g2
              call: "POST /sites/${site_id}/cleanup-goals"
              payload:
                contaminant_code: "PCE"
                media: SOIL_VAPOR
                screening_level_ugl: 5.0
                basis: UNRESTRICTED
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { g2_id: $.data.id }
          assert:
            - "CleanupGoal.${g1_id}.contaminant_count_in_media == 2"
            - "CleanupGoal.${g1_id}.goal_ugl == 250.00"
            - "CleanupGoal.${g1_id}.cumulative_cap_applied == true"
            - "CleanupGoal.${g2_id}.contaminant_count_in_media == 2"
            - "CleanupGoal.${g2_id}.goal_ugl == 166.67"
            - "CleanupGoal.${g2_id}.cumulative_cap_applied == false"
            - "CleanupGoal.${g1_id}.goal_ugl - CleanupGoal.${g2_id}.goal_ugl == 83.33"
            - "CleanupGoal.${g1_id}.attainment_status == NOT_ATTAINED"
            - "CleanupGoal.${g1_id}.compliant_streak == 0"

      - name: cost_estimate_design_vs_underwriting_basis_diverge
        grounds:
          - calculations.remediation_cost_estimate
          - entities.RemedialActionPlan.fields.total_estimate_cents
          - entities.RemedialActionPlan.fields.contingency_pct
          - entities.CostCapPolicy.fields.underwriting_estimate_cents
          - concurrency_rules[policy-quote-stale-plan]
        distinguishing_aspect: |
          Dual-variant logic in the cost-accounting entity domain (RemedialActionPlan
          vs CostCapPolicy) — a different subject from the CleanupGoal risk domain:
          the same six cost_lines produce total_estimate_cents 115210677 on the
          design_basis (escalated over years_to_construction_start 3, FULL tier
          0.10) and underwriting_estimate_cents 139803445 on the underwriting_basis
          (fixed 5-year escalation, contingency floored at 0.25), a delta of
          24592768 cents that the scaffold requires to be strictly positive.
        test_recipe:
          setup:
            - "Shared prefix through the APPROVED PHASE_II and both cleanup goals."
            - "VCP enrollment ENROLLED on the RESTRICTED_CLOSURE track."
            - "One DRAFT RemedialActionPlan with years_to_construction_start 3, basis phase = the FULL-confidence PHASE_II (max_exceedance_factor 4.80, below the 10.0 adder threshold), and the six pinned cost lines."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_insurer
            - *k_lab
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_clock_dec
            - *k_p2
            - *k_p2fa
            - *k_p2fb
            - *k_p2fc
            - *k_p2sub
            - *k_p2app
            - *k_g1
            - *k_g2
            - &k_enr
              call: "POST /vcp-enrollments"
              payload:
                site_id: "${site_id}"
                program_track: RESTRICTED_CLOSURE
                applicant_statement: "Rail yard redevelopment to commercial reuse with vapor mitigation."
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { enr_id: $.data.id }
            - &k_elig
              call: "POST /vcp-enrollments/${enr_id}/eligibility-decision"
              payload: { decision: ENROLL, decision_note: "AAI complete and institutional control committed." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { enr_v1: $.data.version }
            - &k_planA
              call: "POST /remedial-action-plans"
              payload:
                vcp_enrollment_id: "${enr_id}"
                site_id: "${site_id}"
                remedy_narrative: "Excavation and off-site disposal of impacted soil, pump-and-treat of the shallow aquifer, sub-slab vapor mitigation and 5-year performance monitoring."
                basis_assessment_phase_id: "${p2_id}"
                years_to_construction_start: 3
                cost_lines: &A2_LINES
                  - { cost_category: EXCAVATION_DISPOSAL, media: SOIL, quantity: 100.13, unit_cost_cents: 4325 }
                  - { cost_category: EXCAVATION_DISPOSAL, media: SOIL, quantity: 200.13, unit_cost_cents: 4325 }
                  - { cost_category: EXCAVATION_DISPOSAL, media: SOIL, quantity: 12500, unit_cost_cents: 4325 }
                  - { cost_category: GW_TREATMENT, media: GROUNDWATER, quantity: 875.25, unit_cost_cents: 15750 }
                  - { cost_category: VAPOR_MITIGATION, media: SOIL_VAPOR, quantity: 3.5, unit_cost_cents: 2875000 }
                  - { cost_category: MONITORING, media: GROUNDWATER, quantity: 48, unit_cost_cents: 65500 }
                expected_vcp_enrollment_version: "${enr_v1}"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { planA_id: $.data.id, planA_v: $.data.version }
          trigger:
            - &k_quoteA_draft
              call: "POST /cost-cap-policies"
              payload:
                remedial_action_plan_id: "${planA_id}"
                insurer_party_id: "${insurer_id}"
                policy_reference: "CCP-2743-A"
                term_years: 5
                expected_remedial_action_plan_version: "${planA_v}"
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { polA_id: $.data.id }
          assert:
            - "RemedialActionPlan.${planA_id}.direct_cost_cents == 89787402"
            - "RemedialActionPlan.${planA_id}.escalation_cents == 11313213"
            - "RemedialActionPlan.${planA_id}.contingency_pct == 0.10"
            - "RemedialActionPlan.${planA_id}.contingency_cents == 10110062"
            - "RemedialActionPlan.${planA_id}.oversight_cents == 4000000"
            - "RemedialActionPlan.${planA_id}.total_estimate_cents == 115210677"
            - "CostCapPolicy.${polA_id}.underwriting_estimate_cents == 139803445"
            - "CostCapPolicy.${polA_id}.underwriting_estimate_cents - RemedialActionPlan.${planA_id}.total_estimate_cents == 24592768"
            - "RemedialActionPlan.${planA_id}.total_estimate_cents == 115210677 after the quote (the DESIGN figure is not overwritten by the UNDERWRITING run)"
            - "RemedialActionPlan.${planA_id}.total_funding_need_cents == 115210677 (premium is folded in only on bind)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: per_line_rounding_before_sum_pins_direct_cost_cents
        grounds:
          - calculations.remediation_cost_estimate
          - entities.RemedialActionPlan.fields.cost_lines
          - entities.RemedialActionPlan.fields.direct_cost_cents
        distinguishing_aspect: |
          §0.5 Rule 2 mode (b) — nested rounding where the order decides the cents.
          The six pinned cost lines produce raw products 433062.2500, 865562.2500,
          54062500, 18610003.125, 11571875 and 4244400; rounding each line first
          gives direct_cost_cents 89787402, while summing the raw products
          (89787402.5000) and rounding once gives 89787403. The scaffold pins
          per-line-first, so 89787403 is a defect signature.
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED VCP enrollment (clock 2026-12-10)."
            - "No plan exists yet; the plan create is the calculation trigger."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_insurer
            - *k_lab
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_clock_dec
            - *k_p2
            - *k_p2fa
            - *k_p2fb
            - *k_p2fc
            - *k_p2sub
            - *k_p2app
            - *k_g1
            - *k_g2
            - *k_enr
            - *k_elig
          trigger:
            - *k_planA
          assert:
            - "RemedialActionPlan.${planA_id}.direct_cost_cents == 89787402"
            - "RemedialActionPlan.${planA_id}.direct_cost_cents != 89787403 (the sum-then-round result)"
            - "RemedialActionPlan.${planA_id}.escalation_cents == 11313213"
            - "RemedialActionPlan.${planA_id}.total_estimate_cents == 115210677"
            - "GET /remedial-action-plans/${planA_id} returns cost_lines with 6 elements in the submitted array order"

      - name: premium_derived_before_funding_need_is_written
        grounds:
          - calculations.cost_cap_premium
          - calculations.remediation_cost_estimate
          - entities.CostCapPolicy.fields.limit_cents
          - entities.CostCapPolicy.fields.attachment_point_cents
          - entities.RemedialActionPlan.fields.total_funding_need_cents
          - state_machines.CostCapPolicy.QUOTED_to_BOUND
        distinguishing_aspect: |
          §0.5 Rule 2 mode (c) — circular-looking dependency with a pinned
          evaluation order. total_funding_need_cents = total_estimate_cents +
          premium_cents, and limit_cents looks like a share of the funding need,
          but §1.3 pins limit_cents to the PRE-premium underwriting estimate:
          limit_cents == 50000000 (ceil_to_step(0.30 * 139803445)). An
          implementation that re-entered the post-bind need 118043177 would store
          40000000 instead, so the two orders are distinguishable by one field.
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED enrollment and the DRAFT plan with the six pinned cost lines."
            - "One PROPOSED VAPOR_MITIGATION control on the plan covering BLDG-A-SLAB from 2027-01-01 to 2027-12-31 (satisfies the credited-control check for the RESTRICTED TCE goal)."
            - "Plan driven through submit -> technical PASS -> public comment close -> approve, so it is APPROVED and bindable."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_insurer
            - *k_lab
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_clock_dec
            - *k_p2
            - *k_p2fa
            - *k_p2fb
            - *k_p2fc
            - *k_p2sub
            - *k_p2app
            - *k_g1
            - *k_g2
            - *k_enr
            - *k_elig
            - *k_planA
            - &k_ctlA
              call: "POST /site-controls"
              payload:
                site_id: "${site_id}"
                remedial_action_plan_id: "${planA_id}"
                control_type: VAPOR_MITIGATION
                sub_area_code: "BLDG-A-SLAB"
                coverage_from: "2027-01-01"
                coverage_to: "2027-12-31"
                inspection_interval_days: 90
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { ctlA_id: $.data.id }
            - &k_planAsub
              call: "POST /remedial-action-plans/${planA_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_planAtech
              call: "POST /remedial-action-plans/${planA_id}/technical-review"
              payload: { decision: PASS, review_comment: "Remedy technically adequate." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_planApcc
              call: "POST /remedial-action-plans/${planA_id}/public-comment-close"
              payload: { public_comment_count: 7 }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_planAapp
              call: "POST /remedial-action-plans/${planA_id}/approve"
              payload: {}
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
              captures: { planA_v_appr: $.data.version }
          trigger:
            - &k_quoteA
              call: "POST /cost-cap-policies"
              payload:
                remedial_action_plan_id: "${planA_id}"
                insurer_party_id: "${insurer_id}"
                policy_reference: "CCP-2743-A1"
                term_years: 5
                expected_remedial_action_plan_version: "${planA_v_appr}"
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { polA_id: $.data.id }
            - &k_bindA
              call: "POST /cost-cap-policies/${polA_id}/bind"
              payload: {}
              as: Insurer
              as_user_id: "${insurer_id}"
          assert:
            - "CostCapPolicy.${polA_id}.underwriting_estimate_cents == 139803445"
            - "CostCapPolicy.${polA_id}.attachment_point_cents == 153783790"
            - "CostCapPolicy.${polA_id}.buffer_layer_cents == 13980345"
            - "CostCapPolicy.${polA_id}.limit_cents == 50000000"
            - "CostCapPolicy.${polA_id}.rate_applied == 0.055"
            - "CostCapPolicy.${polA_id}.premium_cents == 2832500"
            - "CostCapPolicy.${polA_id}.status == BOUND"
            - "RemedialActionPlan.${planA_id}.total_estimate_cents == 115210677"
            - "RemedialActionPlan.${planA_id}.total_funding_need_cents == 118043177"
            - "CostCapPolicy.${polA_id}.limit_cents == 50000000 after bind (NOT 40000000, which is what re-deriving the limit from the post-bind funding need 118043177 would yield)"

      - name: premium_rate_tier_ladder_selects_three_distinct_rates
        grounds:
          - calculations.cost_cap_premium
          - entities.CostCapPolicy.fields.rate_applied
          - entities.CostCapPolicy.fields.limit_cents
          - entities.CostCapPolicy.fields.premium_cents
          - concurrency_rules[plan-create-stale-enrollment]
        distinguishing_aspect: |
          §0.5 Rule 2 mode (a) — one formula whose output depends non-linearly on
          three inputs (underwriting estimate, the 10,000,000-cent ceiling step and
          the three-branch limit_ratio ladder) with a max() floor stacked on top.
          Three plans on one enrollment select all three rates from a single code
          path: ratio 0.316622 -> 0.070, 0.357644 -> 0.055, 4.598553 -> 0.045, and
          two of the three premiums are clamped by MIN_PREMIUM_CENTS.
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED enrollment."
