              as: GinOperator
              captures: { m26: $.data.id }
            - call: "POST /gin-ops/modules/${m25}/queue"
              payload: { gin_shift_id: "${s25}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m25}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m25}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-25", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "POST /gin-ops/modules/${m26}/queue"
              payload: { gin_shift_id: "${s26}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m26}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m26}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-26", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/growers/${g}"
              as: CoopAccountant
