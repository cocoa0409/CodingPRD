          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on ProductionOrder.version: a PATCH with the version observed at create succeeds and bumps the version; replaying the same expected version is then rejected with ERR_STALE_VERSION."
        test_recipe:
