    side_effects: ["AWARDED → CANCELLED"]

  # --- CapacityObligation ---
  - method: POST
    path: "/market/obligations"
    description: "Create a capacity obligation for a generator and delivery period"
    roles: [IsoOperator]
    code: 201
    input: [generator_asset_id, delivery_period, obligated_mw, capacity_rate_cents_per_mw]
    output: CapacityObligation
    side_effects: ["status ACTIVE; expected_output_mw = min(obligated_mw, availability_mw); immediate AT_RISK recompute if derated"]
  - method: GET
    path: "/market/obligations/{obligationId}"
    description: "Get an obligation"
    roles: [Trader, SettlementAnalyst, CreditOfficer, IsoOperator]
    code: 200
    input: []
    output: CapacityObligation
    side_effects: []
  - method: GET
    path: "/market/obligations"
    description: "List obligations (filtered)"
    roles: [Trader, SettlementAnalyst, CreditOfficer, IsoOperator]
    code: 200
    input: ["generator_asset_id?", "status?"]
    output: "CapacityObligation[]"
    side_effects: []
  - method: POST
    path: "/market/obligations/{obligationId}/close"
    description: "Close an obligation; runs capacity_stop_loss_close"
    roles: [IsoOperator]
    code: 200
    input: []
    output: CapacityObligation
    side_effects: ["→ CLOSED", "gross_revenue_cents / charged_penalty_cents / forgiven_penalty_cents fixed", "credit re-evaluation"]

  # --- CapacityPerformanceEvent ---
  - method: POST
    path: "/market/operating-days/{operatingDayId}/performance-events"
    description: "Declare a capacity performance event (closed interval; 1h buffer vs sibling events)"
    roles: [IsoOperator]
    code: 201
    input: [start_interval, end_interval]
    output: CapacityPerformanceEvent
    side_effects: ["status DECLARED"]
  - method: GET
    path: "/market/events/{eventId}"
    description: "Get an event"
    roles: [Trader, SettlementAnalyst, CreditOfficer, IsoOperator]
    code: 200
    input: []
    output: CapacityPerformanceEvent
    side_effects: []
  - method: GET
    path: "/market/events"
    description: "List events (filtered)"
    roles: [Trader, SettlementAnalyst, CreditOfficer, IsoOperator]
    code: 200
    input: ["operating_day_id?", "status?"]
    output: "CapacityPerformanceEvent[]"
    side_effects: []
  - method: POST
    path: "/market/events/{eventId}/activate"
    description: "Activate a declared event"
    roles: [IsoOperator]
    code: 200
    input: []
    output: CapacityPerformanceEvent
    side_effects: ["DECLARED → ACTIVE"]
  - method: POST
    path: "/market/events/{eventId}/complete"
    description: "Complete an active event; runs capacity_performance_charge"
    roles: [IsoOperator]
    code: 200
    input: []
    output: CapacityPerformanceEvent
    side_effects: ["ACTIVE → COMPLETED", "penalties/bonuses computed and accrued to obligations", "penalties_collected_cents / bonuses_paid_cents set", "credit_posture_evaluation per affected participant"]

  # --- CollateralPosting ---
  - method: POST
    path: "/market/participants/{participantId}/postings"
    description: "Post collateral (cash or letter of credit)"
    roles: [CreditOfficer]
    code: 201
    input: [amount_cents, instrument_type]
    output: CollateralPosting
    side_effects: ["status POSTED", "posted_collateral_cents += amount_cents", "credit_posture_evaluation (may CURE an OPEN margin call)"]
  - method: GET
    path: "/market/postings/{postingId}"
    description: "Get a posting"
    roles: [Trader, SettlementAnalyst, CreditOfficer, IsoOperator]
    code: 200
    input: []
    output: CollateralPosting
    side_effects: []
  - method: GET
    path: "/market/postings"
    description: "List postings (filtered)"
    roles: [Trader, SettlementAnalyst, CreditOfficer, IsoOperator]
    code: 200
    input: ["market_participant_id?", "status?"]
    output: "CollateralPosting[]"
    side_effects: []
  - method: POST
    path: "/market/postings/{postingId}/release"
    description: "Release a posting back to the participant (no OPEN margin call; sufficiency preserved)"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: CollateralPosting
    side_effects: ["POSTED → RELEASED", "posted_collateral_cents -= amount_cents", "credit_posture_evaluation"]
  - method: POST
    path: "/market/postings/{postingId}/draw"
    description: "ISO draws on a posting to cover a defaulted participant's ISSUED statements (waterfall oldest-first)"
    roles: [IsoOperator]
    code: 200
    input: []
    output: CollateralPosting
    side_effects: ["POSTED → DRAWN", "posted_collateral_cents -= amount_cents", "statement paid_cents waterfall (issued_at ASC, tie created_at ASC); fully covered → PAID"]

  # --- MarginCall ---
  - method: GET
    path: "/market/margin-calls/{marginCallId}"
    description: "Get a margin call"
    roles: [Trader, SettlementAnalyst, CreditOfficer, IsoOperator]
    code: 200
    input: []
    output: MarginCall
    side_effects: []
  - method: GET
    path: "/market/margin-calls"
    description: "List margin calls (filtered)"
    roles: [Trader, SettlementAnalyst, CreditOfficer, IsoOperator]
    code: 200
    input: ["market_participant_id?", "status?"]
    output: "MarginCall[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, malformed, or names an undeclared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is not in the endpoint's role list (e.g. Trader runs a market run; IsoOperator submits an offer; SettlementAnalyst posts collateral)" }
  # --- request / existence ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, enum outside declared set, non-positive amount, interval outside 1..24, start >= end, REGULATION award missing performance_price_cents/mileage_ratio, draw amount exceeds uncovered statement total" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced id does not exist" }
  # --- ownership / OCC ---
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Participant-scoped role acts on a resource owned by a different MarketParticipant" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_operating_day_version != current OperatingDay.version on offer create" }
  - { id: ERR_STALE_ASSET_VERSION, http: 412, condition: "expected_generator_asset_version != current GeneratorAsset.version on telemetry submit" }
  # --- state ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Path-target resource not in a from-state that permits the trigger (incl. terminal-state lockdown and day-epoch ordering violations)" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "A dispute of the same statement is already in FILED or UNDER_REVIEW" }
  - { id: ERR_MARKET_NOT_OPEN, http: 409, condition: "Offer create/submit/withdraw or award create while OperatingDay.status is not DA_OPEN (awards also allowed while DA_GATED)" }
  - { id: ERR_GENERATOR_NOT_AVAILABLE, http: 409, condition: "Offer create/submit references a generator whose status is ON_OUTAGE or DECOMMISSIONED" }
  - { id: ERR_PARTICIPANT_SUSPENDED, http: 409, condition: "Offer submit while the owning participant is SUSPENDED" }
  - { id: ERR_STATEMENT_NOT_FINAL, http: 409, condition: "Dispute filed against a statement whose run_type is PRELIMINARY" }
  - { id: ERR_OPEN_MARGIN_CALL, http: 409, condition: "Posting release while the participant has an OPEN margin call" }
  - { id: ERR_POSTING_NOT_DRAWABLE, http: 409, condition: "Draw attempted while the participant has no DEFAULTED margin call" }
  - { id: ERR_GENERATOR_HAS_OPEN_COMMITMENTS, http: 409, condition: "Decommission with offers in {DRAFT, SUBMITTED}, outages in {SUBMITTED, ACKNOWLEDGED, APPROVED}, or obligations in {ACTIVE, AT_RISK}" }
  - { id: ERR_UNRESOLVED_DISPUTES, http: 409, condition: "Operating day close while any statement of the day is UNDER_DISPUTE" }
  # --- temporal ---
  - { id: ERR_DA_GATE_CLOSED, http: 409, condition: "Offer submit with logical now strictly after OperatingDay.da_gate_close_at (at exactly gate close is accepted)" }
  - { id: ERR_TELEMETRY_WINDOW_CLOSED, http: 409, condition: "Telemetry submit while the operating day is not DA_GATED" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "Dispute filed with logical now strictly after dispute_window_ends_at (at exactly window end is accepted)" }
  # --- constraint ---
  - { id: ERR_OPERATING_DAY_EXISTS, http: 409, condition: "An OperatingDay with the same market_date already exists" }
  - { id: ERR_OBLIGATION_DUPLICATE_PERIOD, http: 409, condition: "An obligation in {ACTIVE, AT_RISK} already exists for this (generator, delivery_period)" }
  - { id: ERR_OUTAGE_OVERLAP, http: 409, condition: "New/resubmitted outage's half-open [start_at, end_at) intersects a same-generator outage in {SUBMITTED, ACKNOWLEDGED, APPROVED}; adjacency (start == other end) is allowed" }
  - { id: ERR_EVENT_BUFFER_VIOLATION, http: 409, condition: "Performance event's closed interval fails the 1-hour buffer rule against a sibling event in {DECLARED, ACTIVE, COMPLETED} on the same day: accepted only if (new.start_interval >= existing.end_interval + 2) OR (existing.start_interval >= new.end_interval + 2) for every sibling — one full gap interval is mandatory; direct adjacency is a violation" }
  - { id: ERR_AWARD_OVERLAPS_OUTAGE, http: 409, condition: "Award's closed interval window intersects (on interval granularity) an APPROVED outage window of the same generator on that day" }
  - { id: ERR_OFFER_MW_EXCEEDS_AVAILABILITY, http: 409, condition: "offered_mw > generator.availability_mw at submit" }
  - { id: ERR_PRICE_DECK_INCOMPLETE, http: 409, condition: "run-day-ahead-market deck lacks a node entry for the pricing_node of a SUBMITTED offer" }
  # --- fiscal ---
  - { id: ERR_CREDIT_HEADROOM_EXCEEDED, http: 409, condition: "Offer submit would push effective_requirement above posted_collateral_cents" }
  - { id: ERR_COLLATERAL_SHORTFALL, http: 409, condition: "Posting release would leave posted_collateral_cents strictly below effective_requirement (equality allowed)" }

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties: the three participant-side roles
# are disjoint functions; an organization MUST assign them to different
# operators. IsoOperator holds all market-authority functions and none of the
# participant-side ones.
# =============================================================================
roles:
  - name: Trader
    description: "Participant-side trading/operations desk: day-ahead offers, meter telemetry, outage reports, generator decommission"
    identity: "entity_backed:MarketParticipant"
    exclusive_operations:
      - "POST /market/operating-days/{operatingDayId}/offers"
      - "POST /market/offers/{offerId}/submit"
      - "POST /market/offers/{offerId}/withdraw"
      - "POST /market/generators/{generatorId}/telemetry"
      - "POST /market/generators/{generatorId}/outages"
      - "POST /market/outages/{outageId}/resubmit"
      - "POST /market/outages/{outageId}/cancel"
      - "POST /market/generators/{generatorId}/decommission"
    shared_operations:
      - "All GET /market/** read endpoints"
  - name: SettlementAnalyst
    description: "Participant-side settlement assurance: validates statements and files/withdraws disputes; may NOT trade or move collateral"
    identity: "entity_backed:MarketParticipant"
    exclusive_operations:
      - "POST /market/statements/{statementId}/disputes"
      - "POST /market/disputes/{disputeId}/withdraw"
    shared_operations:
      - "All GET /market/** read endpoints"
  - name: CreditOfficer
    description: "Participant-side treasury: posts and releases collateral; may NOT trade or file disputes"
    identity: "entity_backed:MarketParticipant"
    exclusive_operations:
      - "POST /market/participants/{participantId}/postings"
      - "POST /market/postings/{postingId}/release"
    shared_operations:
      - "All GET /market/** read endpoints"
  - name: IsoOperator
    description: "Market authority: registers participants/generators, runs the market and settlement epochs, adjudicates outages and disputes, manages awards/obligations/events, draws collateral, sets the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /market/_clock/set_current_utc"
      - "POST /market/participants"
      - "POST /market/participants/{participantId}/evaluate-credit"
      - "POST /market/generators"
      - "POST /market/operating-days"
      - "POST /market/operating-days/{operatingDayId}/run-day-ahead-market"
      - "POST /market/operating-days/{operatingDayId}/close-real-time"
      - "POST /market/operating-days/{operatingDayId}/run-preliminary-settlement"
      - "POST /market/operating-days/{operatingDayId}/run-final-settlement"
      - "POST /market/operating-days/{operatingDayId}/close"
      - "POST /market/outages/{outageId}/acknowledge"
      - "POST /market/outages/{outageId}/approve"
      - "POST /market/outages/{outageId}/deny"
      - "POST /market/disputes/{disputeId}/start-review"
      - "POST /market/disputes/{disputeId}/resolve"
      - "POST /market/operating-days/{operatingDayId}/awards"
      - "POST /market/awards/{awardId}/cancel"
      - "POST /market/obligations"
      - "POST /market/obligations/{obligationId}/close"
      - "POST /market/operating-days/{operatingDayId}/performance-events"
      - "POST /market/events/{eventId}/activate"
      - "POST /market/events/{eventId}/complete"
      - "POST /market/postings/{postingId}/draw"
    shared_operations:
      - "All GET /market/** read endpoints"




