          difficulty_instance: system_decertification_restores_certified_count_and_clears_certifier
          rationale: "§1.2 CERTIFIED -> TESTING is a compensation of the certify transition; the §1.8 compensating_invariant instance of the same name already asserts certified_by_user_id/certified_at cleared and certified_system_count restored with no drift."
        grounds:
          - "§1.2 SystemImplementation CERTIFIED -> TESTING declares 'certified_by_user_id and certified_at cleared (compensation of the certify transition)' plus recomputation of program.certified_system_count."

  # ============================================================================
  # SECTION 3 — calculations
  # ============================================================================
  - section: calculations
    instances:
      - name: payroll_accrual_excludes_offered_and_withdrawn_hires
        claim_type: input_set_filtering
        grounds:
          - "§1.3 cost_at_completion pins accrual_set to Hires whose state IN {ACCEPTED, ONBOARDED} and states explicitly that OFFERED, DECLINED and WITHDRAWN are excluded; pre_opening_days is the half-open span [start_date, projected_opening_date_committed)."
        distinguishing_aspect: "Three hires share identical rate, hours and start_date but only the ACCEPTED one is in the accrual set, so payroll_accrual_cents is 600000 rather than 1200000 or 1800000."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' baselined over a single 30-day CONSTRUCTION_COMPLETE milestone, so projected_opening_date_committed is 2026-10-15 with the clock still at 2026-09-01."
            - "One ROOMS plan (headcount_target 5, wave_start_date 2026-09-10) holding three hires at 2500 cents/hour, 8 hours/day, start_date 2026-09-15: one left OFFERED, one ACCEPTED, one ACCEPTED and then WITHDRAWN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 30, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_cc: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-baseline-1"
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_id}", department: "ROOMS", headcount_target: 5, wave_start_date: "2026-09-10" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { plan_rooms: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_rooms}", full_name: "A. Keeper", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-15" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { hire_accepted: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_rooms}", full_name: "B. Pending", hourly_rate_cents: 3000, scheduled_hours_per_day: 8, start_date: "2026-09-15" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { hire_offered: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_rooms}", full_name: "C. Gone", hourly_rate_cents: 4000, scheduled_hours_per_day: 8, start_date: "2026-09-15" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { hire_withdrawn: "$.data.id" }
