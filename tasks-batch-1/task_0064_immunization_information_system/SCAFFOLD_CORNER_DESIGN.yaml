scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - "entities.Patient.fields.full_name"
          - "entities.Patient.fields.schedule_status"
        distinguishing_aspect: "POST /patients with full_name, date_of_birth, state_code -> 201; response carries id, created_at, version==1, schedule_status==UP_TO_DATE, active_certificate_id==null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "New Child", date_of_birth: "2024-05-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pid: $.data.id }
          assert:
            - "response code == 201"
            - "Patient.${pid}.schedule_status == UP_TO_DATE"
            - "Patient.${pid}.version == 1"
            - "Patient.${pid}.active_certificate_id == null"

      - name: get_patient_not_found
        claim_type: Not Found
        grounds:
          - "entities.Patient"
        distinguishing_aspect: "GET /patients/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_patient_missing_required_field
        claim_type: Required Fields
        grounds:
          - "entities.Patient.fields.date_of_birth"
        distinguishing_aspect: "POST /patients omitting date_of_birth -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "No DOB", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: dob_after_clock_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Patient.fields.date_of_birth"
          - "validations[priority=4]"
        distinguishing_aspect: "date_of_birth after the current clock date -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Clock set to 2026-01-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Future Child", date_of_birth: "2027-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: lot_administered_count_default_zero_and_system
        claim_type: Defaults
        grounds:
          - "entities.VaccineLot.fields.administered_count"
          - "entities.VaccineLot.fields.status"
        distinguishing_aspect: "A freshly created lot has administered_count==0 and status==AVAILABLE; client-supplied values for these computed fields are ignored."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LX", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
          assert:
            - "VaccineLot.${lot_id}.administered_count == 0"
            - "VaccineLot.${lot_id}.status == AVAILABLE"

      - name: duplicate_product_code_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.VaccineProduct.fields.product_code"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "Creating a second product with an existing product_code -> ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["A product C1 exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1B", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"

      - name: product_cross_field_validation_expiration_before_received
        claim_type: Type Constraints
        grounds:
          - "entities.VaccineLot.fields.expiration_date"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Lot with expiration_date not strictly after received_date -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "BAD", received_date: "2025-01-01", expiration_date: "2025-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

  # =========================================================================
  - section: state_machines
    instances:
      - name: adjudicate_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.ProviderReport.SUBMITTED_to_ACCEPTED"
          - "validations[priority=5]"
        distinguishing_aspect: "Adjudicating a report still in DRAFT (never submitted) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A provider and a DRAFT report with line_count 1, not submitted."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { name: "Clinic R", vfc_pin: "PIN-R", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /provider-reports"
              payload: { provider_id: "${prov_id}", line_count: 1 }
              as: ImmunizationRegistrar
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /provider-reports/${rep_id}/adjudicate"
              payload: {}
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: confirm_from_reported_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.AdverseEvent.UNDER_REVIEW_to_CONFIRMED"
          - "validations[priority=5]"
        distinguishing_aspect: "Confirming an AdverseEvent still in REPORTED (skipping review) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A patient with a recorded dose and a REPORTED adverse event."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic S", vfc_pin: "PIN-S", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LS", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child I", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
              captures: { dose_id: $.data.id }
            - call: "POST /adverse-events"
              payload: { immunization_id: "${dose_id}", seriousness: "SERIOUS", symptoms: "fever" }
              as: ImmunizationRegistrar
              captures: { ae_id: $.data.id }
          trigger:
            - call: "POST /adverse-events/${ae_id}/confirm"
              payload: {}
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: reverse_already_reversed_recall_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.LotRecall.ISSUED_to_REVERSED"
        distinguishing_aspect: "Reversing a recall already in REVERSED (terminal) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A lot recalled then reversed once."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LT", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /lots/${lot_id}/recalls"
              payload: { reason: "x" }
              as: ImmunizationRegistrar
              captures: { recall_id: $.data.id }
            - call: "POST /lots/${lot_id}/recalls/${recall_id}/reverse"
              payload: {}
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /lots/${lot_id}/recalls/${recall_id}/reverse"
              payload: {}
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: report_submit_line_count_mismatch
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.ProviderReport.DRAFT_to_SUBMITTED"
          - "errors[ERR_LINE_COUNT_MISMATCH]"
        distinguishing_aspect: "Submitting a report whose attached line count != declared line_count -> ERR_LINE_COUNT_MISMATCH (422)."
        test_recipe:
          setup: ["A report with line_count 2 but only 1 line attached."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic U", vfc_pin: "PIN-U", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LU", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child J", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /provider-reports"
              payload: { provider_id: "${prov_id}", line_count: 2 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /provider-reports/${rep_id}/lines"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", administered_date: "2025-01-01" }
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /provider-reports/${rep_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LINE_COUNT_MISMATCH"

      - name: report_all_reject_branch
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.ProviderReport.SUBMITTED_to_REJECTED"
          - "entities.ProviderReport.fields.rejected_count"
        distinguishing_aspect: "Adjudicating a 1-line report whose only line is on a recalled lot -> status REJECTED, accepted_count 0, rejected_count 1, no Immunization created."
        test_recipe:
          setup: ["Provider report with 1 line on a recalled lot, submitted."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic V", vfc_pin: "PIN-V", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LV", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /lots/${lot_id}/recalls"
              payload: { reason: "recalled" }
              as: ImmunizationRegistrar
            - call: "POST /patients"
              payload: { full_name: "Child K", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /provider-reports"
              payload: { provider_id: "${prov_id}", line_count: 1 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /provider-reports/${rep_id}/lines"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", administered_date: "2025-01-01" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /provider-reports/${rep_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /provider-reports/${rep_id}/adjudicate"
              payload: {}
              as: ImmunizationRegistrar
          assert:
            - "ProviderReport.${rep_id}.status == REJECTED"
            - "ProviderReport.${rep_id}.accepted_count == 0"
            - "ProviderReport.${rep_id}.rejected_count == 1"

      - name: report_all_accept_branch
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.ProviderReport.SUBMITTED_to_ACCEPTED"
          - "entities.ProviderReport.fields.accepted_count"
        distinguishing_aspect: "Adjudicating a 1-line clean report -> status ACCEPTED, accepted_count 1, one Immunization materialized, lot.administered_count 1."
        test_recipe:
          setup: ["Provider report with 1 valid line, submitted."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic W", vfc_pin: "PIN-W", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LW", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child L", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /provider-reports"
              payload: { provider_id: "${prov_id}", line_count: 1 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /provider-reports/${rep_id}/lines"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", administered_date: "2025-01-01" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /provider-reports/${rep_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /provider-reports/${rep_id}/adjudicate"
              payload: {}
              as: ImmunizationRegistrar
          assert:
            - "ProviderReport.${rep_id}.status == ACCEPTED"
            - "ProviderReport.${rep_id}.accepted_count == 1"
            - "VaccineLot.${lot_id}.administered_count == 1"

      - name: confirmed_nonserious_ae_no_contraindication
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.AdverseEvent.UNDER_REVIEW_to_CONFIRMED"
          - "entities.AllergyRecord.fields.origin"
        distinguishing_aspect: "Confirming a NON_SERIOUS adverse event creates NO AllergyRecord (divergent branch); the patient's allergy-records list stays empty."
        test_recipe:
          setup: ["A patient with a recorded dose and a NON_SERIOUS AE moved UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic X", vfc_pin: "PIN-X", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LXX", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child M", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
              captures: { dose_id: $.data.id }
            - call: "POST /adverse-events"
              payload: { immunization_id: "${dose_id}", seriousness: "NON_SERIOUS", symptoms: "soreness" }
              as: ImmunizationRegistrar
              captures: { ae_id: $.data.id }
            - call: "POST /adverse-events/${ae_id}/review"
              payload: {}
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /adverse-events/${ae_id}/confirm"
              payload: {}
              as: ImmunizationRegistrar
            - call: "GET /patients/${pat_id}/allergy-records"
              payload: {}
              as: ImmunizationRegistrar
          assert:
            - "AdverseEvent.${ae_id}.status == CONFIRMED"
            - "GET /patients/${pat_id}/allergy-records returns total_count == 0"

      - name: delete_immunization_blocked_by_open_adverse_event
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Immunization.RECORDED_to_DELETED"
          - "errors[ERR_ADVERSE_EVENT_BLOCKS_DELETE]"
        distinguishing_aspect: "Deleting an immunization referenced by a REPORTED adverse event -> ERR_ADVERSE_EVENT_BLOCKS_DELETE (409)."
        test_recipe:
          setup: ["A recorded dose with a REPORTED adverse event referencing it."]
          setup_api_calls:
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic Y", vfc_pin: "PIN-Y", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LY", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child N", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
              captures: { dose_id: $.data.id }
            - call: "POST /adverse-events"
              payload: { immunization_id: "${dose_id}", seriousness: "SERIOUS", symptoms: "rash" }
              as: ImmunizationRegistrar
          trigger:
            - call: "DELETE /immunizations/${dose_id}"
              payload: {}
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ADVERSE_EVENT_BLOCKS_DELETE"

  # =========================================================================
  - section: calculations
    instances:
      - name: dose_below_min_age_is_invalid_age
        claim_type: Correct Result
        grounds:
          - "calculations.compute_dose_validity"
          - "entities.Immunization.fields.validity"
        distinguishing_aspect: "A DTAP dose at age 37 days (< min_age 42 - grace 4 = 38) records with validity INVALID_AGE and is not counted (dose1 not assigned)."
        test_recipe:
          setup: ["Clock 2026-06-01. DTAP product. Patient dob 2025-01-01. Dose at 2025-02-07 (age 37)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "DTAP", antigen: "DTAP", doses_in_series: 5, min_age_days: 42, recommended_age_days: 60, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { dtap_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic Z", vfc_pin: "PIN-Z", authorized_product_codes: ["DTAP"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${dtap_id}", lot_number: "LZ", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child O", date_of_birth: "2025-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-02-07" }
              as: ImmunizationRegistrar
              captures: { dose_id: $.data.id }
          assert:
            - "Immunization.${dose_id}.validity == INVALID_AGE"

      - name: dose_exactly_at_min_age_minus_grace_is_valid
        claim_type: Correct Result
        grounds:
          - "calculations.compute_dose_validity"
