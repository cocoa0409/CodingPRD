            - call: "POST /backup-provider/retention-change-requests/${rcr1_id}/resubmit"
              payload: { requested_retention_days: 900 }
              as: RetentionOfficer
              captures: { dup_error: $.data.error_id }
            - call: "POST /backup-provider/retention-change-requests/${rcr1_id}/resubmit"
