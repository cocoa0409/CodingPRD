scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_split_provisional_vs_final_diverges_after_revision
        grounds:
          - calculations.fee_split_computation
          - entities.FeeSplit.fields.appraiser_fee_cents
          - entities.FeeSplit.fields.variant
          - state_machines.Order.DELIVERED_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant on the FeeSplit (money) domain: the PROVISIONAL split at placement
          (revision_round=0, appraiser_fee_cents=30000) differs from the FINAL split at
          completion after one revision round (appraiser_fee_cents=27500), a 2500-cent delta
          driven solely by REVISION_PENALTY_PCT.
        test_recipe:
          setup:
            - "Clock pinned 2026-06-01T00:00:00Z."
            - "Appraiser A1 ACTIVE, license_state CA, base_fee_share_pct 0.60."
            - "Lender L with panel [A1], budget 1_000_000 cents."
            - "Property P in CA."
            - "Order O placed (fee 50000, URAR_1004, no rush) -> FeeSplit PROVISIONAL appraiser_fee_cents=30000."
            - "Order assigned to A1; A1 accepts; A1 submits report; compliance opened then finalized FAIL once (one revision round), report resubmitted, re-reviewed PASS, order DELIVERED."
          setup_api_calls:
            - call: "POST /amc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /amc/appraisers"
              payload: { full_name: "A One", license_state: "CA", base_fee_share_pct: 0.60 }
              as: AMCCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender L", approved_panel_appraiser_ids: ["${a1_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "1 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004", rush: false }
              as: LenderUser
              as_user_id: "${l_id}"
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a1_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 2 }
              as: Appraiser
              as_user_id: "${a1_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr1_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr1_id}/finalize"
              payload: { finding_codes: ["USPAP_1004_MIN_COMPS"] }
              as: ComplianceReviewer
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 4 }
              as: Appraiser
              as_user_id: "${a1_id}"
              captures: { rpt2_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr2_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr2_id}/finalize"
              payload: {}
              as: ComplianceReviewer
          trigger:
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { o_v_pre: $.data.version }
            - call: "POST /amc/orders/${o_id}/complete"
              payload: { expected_order_version: "${o_v_pre}" }
              as: AMCCoordinator
            - call: "GET /amc/orders/${o_id}/fee-split"
              payload: {}
              as: AMCCoordinator
              captures: { fee_variant: "$.data[0].variant", fee_appraiser: "$.data[0].appraiser_fee_cents" }
          assert:
            - "GET /amc/orders/${o_id}/fee-split [0].variant == FINAL"
            - "GET /amc/orders/${o_id}/fee-split [0].appraiser_fee_cents == 27500"
            - "GET /amc/orders/${o_id}/fee-split [0].amc_fee_cents == 22500"
            - "GET /amc/orders/${o_id}/fee-split [0].revision_penalty_cents == 2500"

      - name: turnaround_projected_vs_actual_diverges
        grounds:
          - calculations.turnaround_sla
          - entities.Order.fields.sla_hours
          - entities.Assignment.fields.actual_turnaround_hours
          - state_machines.Assignment.ACCEPTED_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant on the Assignment turnaround domain (distinct from the FeeSplit money domain):
          the PROJECTED sla_hours fixed at placement (URAR no-rush = 120) versus the chronological
          ACTUAL actual_turnaround_hours measured from accepted_at to completion (48 whole hours),
          two different numbers for the same assignment.
        test_recipe:
          setup:
            - "Clock pinned 2026-06-01T00:00:00Z at order placement; appraiser accepts at 2026-06-02T00:00:00Z; order completed at 2026-06-04T00:00:00Z (48h after accept)."
            - "Appraiser, lender, property, order placed (URAR_1004 no rush => sla_hours 120), assigned, accepted, report PASS, DELIVERED."
          setup_api_calls:
            - call: "POST /amc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /amc/appraisers"
              payload: { full_name: "A Two", license_state: "TX", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender T", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "2 TX St", state_code: "TX" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 60000, product_type: "URAR_1004", rush: false }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version, o_sla: $.data.sla_hours }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-03T15:00:00Z", inspection_end: "2026-06-03T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 400000, uad_condition_rating: "C2", uad_quality_rating: "Q3", comparable_count: 5 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr_id}/finalize"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /amc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { o_v_pre: $.data.version }
            - call: "POST /amc/orders/${o_id}/complete"
              payload: { expected_order_version: "${o_v_pre}" }
              as: AMCCoordinator
            - call: "GET /amc/assignments/${asg_id}"
              payload: {}
              as: AMCCoordinator
              captures: { act: $.data.actual_turnaround_hours }
          assert:
            - "Order.${o_id}.sla_hours == 120"
            - "GET /amc/assignments/${asg_id} .actual_turnaround_hours == 48"
            - "Order.${o_id}.sla_hours != Assignment.${asg_id}.actual_turnaround_hours"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: panel_score_weighted_nonlinear_three_inputs
        grounds:
          - calculations.appraiser_panel_score
          - entities.Appraiser.fields.panel_score
          - entities.Appraiser.fields.active_assignment_count
          - state_machines.Order.DELIVERED_to_COMPLETED
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — completion_rate, on_time_rate and a nested-min
          load_factor combine under fixed weights with a conditional branch on status; a fresh ACTIVE
          appraiser with no history scores exactly 0.3000 (load_factor=1.0 dominates), not 0.
        test_recipe:
          setup:
            - "Appraiser A ACTIVE with zero completed, zero active, zero on_time at creation."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Fresh A", license_state: "NY", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
          trigger:
            - call: "GET /amc/appraisers/${a_id}"
              payload: {}
              as: AMCCoordinator
              captures: { ps: $.data.panel_score }
          assert:
            - "GET /amc/appraisers/${a_id} .panel_score == 0.3000"
            - "GET /amc/appraisers/${a_id} .active_assignment_count == 0"

      - name: fee_split_rounding_order_pinned_per_component
        grounds:
          - calculations.fee_split_computation
          - entities.FeeSplit.fields.appraiser_fee_cents
          - entities.FeeSplit.fields.amc_fee_cents
          - entities.Order.fields.rush
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — base and rush_premium are each round_half_up
          to whole cents independently THEN summed (per-component-then-sum). With fee=80000, share=0.55,
          rush: base=44000, rush_premium=8000, appraiser=52000; a sum-then-round on the same inputs is
          the wrong order and the scaffold pins per-component.
        test_recipe:
          setup:
            - "Appraiser ACTIVE base_fee_share_pct 0.55, license FL; lender panel [A]; property FL."
            - "Order placed fee 80000 URAR rush=true -> FeeSplit PROVISIONAL appraiser_fee_cents=52000."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Round A", license_state: "FL", base_fee_share_pct: 0.55 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender F", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "3 FL St", state_code: "FL" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 80000, product_type: "URAR_1004", rush: true }
              as: AMCCoordinator
              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /amc/orders/${o_id}/fee-split"
              payload: {}
              as: AMCCoordinator
              captures: { ap: "$.data[0].appraiser_fee_cents" }
          assert:
            - "GET /amc/orders/${o_id}/fee-split [0].appraiser_fee_cents == 52000"
            - "GET /amc/orders/${o_id}/fee-split [0].amc_fee_cents == 28000"
            - "GET /amc/orders/${o_id}/fee-split [0].variant == PROVISIONAL"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_revision_cycle_loops_back_to_under_review
        grounds:
          - state_machines.Report.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Report.REVISION_REQUESTED_to_RESUBMITTED
          - state_machines.Report.RESUBMITTED_to_UNDER_REVIEW
          - entities.Assignment.fields.revision_round
        distinguishing_aspect: |
          Cyclic shape on the Report entity: SUBMITTED->UNDER_REVIEW->REVISION_REQUESTED->RESUBMITTED
          ->UNDER_REVIEW is a true loop (the entity re-enters UNDER_REVIEW), with Assignment.revision_round
          incrementing to 1 on the loop.
        test_recipe:
          setup:
            - "Order assigned, accepted, report submitted, compliance FAIL once (revision), resubmitted, re-reviewed (back UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Cyc A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender C", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "4 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 2 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr_id}/finalize"
              payload: { finding_codes: ["USPAP_1004_MIN_COMPS"] }
              as: ComplianceReviewer
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 4 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt2_id: $.data.id }
          trigger:
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr2_id: $.data.id }
            - call: "GET /amc/reports/${rpt_id}"
              payload: {}
              as: ComplianceReviewer
              captures: { rstat: $.data.status }
            - call: "GET /amc/assignments/${asg_id}"
              payload: {}
              as: AMCCoordinator
              captures: { rr: $.data.revision_round }
          assert:
            - "GET /amc/reports/${rpt_id} .status == UNDER_REVIEW"
            - "GET /amc/assignments/${asg_id} .revision_round == 1"

      - name: rov_branching_fork_changed_vs_upheld
        grounds:
          - state_machines.ReconsiderationOfValue.UNDER_REVIEW_to_VALUE_CHANGED
          - state_machines.ReconsiderationOfValue.UNDER_REVIEW_to_VALUE_UPHELD
          - entities.ReconsiderationOfValue.fields.resolution
          - entities.Order.fields.appraised_value_cents
        distinguishing_aspect: |
          Branching fork on the ReconsiderationOfValue entity (different entity from Report): from UNDER_REVIEW
          the resolve action forks to VALUE_UPHELD (no value change) vs VALUE_CHANGED (Order.appraised_value_cents
          mutated) with divergent side-effect sets per branch; this instance exercises the UPHELD branch leaving
          appraised_value_cents at the delivered 500000.
        test_recipe:
          setup:
            - "Order delivered with appraised_value_cents 500000; ROV opened (requested 505000, delta 1.00%, no second review), moved UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Rov A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender R", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "5 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 5 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr_id}/finalize"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /amc/orders/${o_id}/reconsiderations"
              payload: { requested_value_cents: 505000 }
              as: LenderUser
              as_user_id: "${l_id}"
              captures: { rov_id: $.data.id }
            - call: "POST /amc/reconsiderations/${rov_id}/start-review"
              payload: {}
              as: AMCCoordinator
          trigger:
            - call: "POST /amc/reconsiderations/${rov_id}/resolve"
              payload: {}
              as: AMCCoordinator
              captures: { res: $.data.resolution }
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { av: $.data.appraised_value_cents }
          assert:
            - "POST /amc/reconsiderations/${rov_id}/resolve .resolution == VALUE_UPHELD"
            - "GET /amc/orders/${o_id} .appraised_value_cents == 500000"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: compliance_fail_cascades_review_report_assignment_order_depth3
        grounds:
          - state_machines.ComplianceReview.PENDING_to_FAIL
          - state_machines.Report.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Assignment.ACCEPTED_to_REVISION
          - state_machines.Order.IN_QC_to_IN_PROGRESS
        distinguishing_aspect: |
          Depth-3 cascade from a compliance FAIL: finalize FAIL (ComplianceReview) -> Report REVISION_REQUESTED
          -> that report mutation drives Assignment ACCEPTED->REVISION (revision_round 1) -> that assignment
          mutation drives Order IN_QC->IN_PROGRESS; each link is caused by the prior link, not the original action.
        test_recipe:
          setup:
            - "Order in IN_QC: assigned, accepted, report submitted (2 comparables -> USPAP minimum NOT met), compliance review opened PENDING."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Casc A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender K", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "6 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 2 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /amc/compliance-reviews/${cr_id}/finalize"
              payload: { finding_codes: ["USPAP_1004_MIN_COMPS"] }
              as: ComplianceReviewer
              captures: { outcome: $.data.outcome }
            - call: "GET /amc/reports/${rpt_id}"
              payload: {}
              as: ComplianceReviewer
              captures: { rstat: $.data.status }
            - call: "GET /amc/assignments/${asg_id}"
              payload: {}
              as: AMCCoordinator
              captures: { astat: $.data.status, rr: $.data.revision_round }
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { ostat: $.data.status }
          assert:
            - "POST /amc/compliance-reviews/${cr_id}/finalize .outcome == FAIL"
            - "GET /amc/reports/${rpt_id} .status == REVISION_REQUESTED"
            - "GET /amc/assignments/${asg_id} .status == REVISION"
            - "GET /amc/assignments/${asg_id} .revision_round == 1"
            - "GET /amc/orders/${o_id} .status == IN_PROGRESS"

      - name: rov_value_change_cascades_order_value_then_feesplit_depth2
        grounds:
          - state_machines.ReconsiderationOfValue.UNDER_REVIEW_to_VALUE_CHANGED
          - entities.Order.fields.appraised_value_cents
          - calculations.fee_split_computation
          - entities.FeeSplit.fields.appraiser_fee_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (ROV resolve VALUE_CHANGED, not compliance FAIL): resolve
          sets Order.appraised_value_cents = new_value_cents (link 1), and that order mutation triggers a
          FeeSplit recompute (link 2). Fee total stays conserved (appraiser 30000 + amc 20000 == 50000) since
          base_fee_share_pct is value-independent.
        test_recipe:
          setup:
            - "Order delivered (appraised 500000, fee 50000, share 0.60, FeeSplit appraiser 30000); ROV requested 560000 (delta 12% -> requires second review), UNDER_REVIEW; a post-delivery second compliance review PASS exists."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Rov2 A", license_state: "CA", base_fee_share_pct: 0.60 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender RV", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "7 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 5 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr_id}/finalize"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /amc/orders/${o_id}/reconsiderations"
              payload: { requested_value_cents: 560000 }
              as: LenderUser
              as_user_id: "${l_id}"
              captures: { rov_id: $.data.id }
            - call: "POST /amc/reconsiderations/${rov_id}/start-review"
              payload: {}
              as: AMCCoordinator
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr2_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr2_id}/finalize"
              payload: {}
              as: ComplianceReviewer
          trigger:
            - call: "POST /amc/reconsiderations/${rov_id}/resolve"
              payload: { new_value_cents: 560000 }
              as: AMCCoordinator
              captures: { res: $.data.resolution }
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { av: $.data.appraised_value_cents }
            - call: "GET /amc/orders/${o_id}/fee-split"
              payload: {}
              as: AMCCoordinator
              captures: { ap: "$.data[0].appraiser_fee_cents", amc: "$.data[0].amc_fee_cents" }
          assert:
            - "POST /amc/reconsiderations/${rov_id}/resolve .resolution == VALUE_CHANGED"
            - "GET /amc/orders/${o_id} .appraised_value_cents == 560000"
            - "GET /amc/orders/${o_id}/fee-split [0].appraiser_fee_cents == 30000"
            - "GET /amc/orders/${o_id}/fee-split [0].amc_fee_cents == 20000"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: firewall_safety_beats_referential_eligibility_on_assign
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_AIR_FIREWALL_VIOLATION]
          - errors[ERR_NO_ELIGIBLE_APPRAISER]
        distinguishing_aspect: |
          Category pair business_safety (priority 2, AIR firewall) vs business_referential (priority 5,
          no eligible appraiser): a LenderUser attempts POST assignments on an order whose lender panel is
          empty (so the eligibility filter would also fail); the higher-priority firewall error wins
          (ERR_AIR_FIREWALL_VIOLATION), NOT ERR_NO_ELIGIBLE_APPRAISER.
        test_recipe:
          setup:
            - "Lender with EMPTY panel; property CA; order placed; no eligible appraiser would be found."
          setup_api_calls:
            - call: "POST /amc/lenders"
              payload: { name: "Lender E", approved_panel_appraiser_ids: [], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "8 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: LenderUser
              as_user_id: "${l_id}"
              captures: { o_id: $.data.id, o_v0: $.data.version }
          trigger:
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: LenderUser
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders/${o_id}/assignments .error_id == ERR_AIR_FIREWALL_VIOLATION"
            - "POST /amc/orders/${o_id}/assignments HTTP 403"

      - name: state_beats_fiscal_budget_on_complete
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STALE_ORDER_VERSION]
        distinguishing_aspect: |
          Category pair state (priority 7) vs business_constraint OCC (priority 8): completing an order still
          in PLACED while ALSO passing a stale expected_order_version yields the higher-priority state error
          ERR_INVALID_STATE, not ERR_STALE_ORDER_VERSION.
        test_recipe:
          setup:
            - "Order placed (PLACED, version 1), never assigned; client holds a deliberately stale version 0."
          setup_api_calls:
            - call: "POST /amc/lenders"
              payload: { name: "Lender S", approved_panel_appraiser_ids: [], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "9 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
          trigger:
            - call: "POST /amc/orders/${o_id}/complete"
              payload: { expected_order_version: "${o_v0} - 1" }
              as: AMCCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders/${o_id}/complete .error_id == ERR_INVALID_STATE"
            - "POST /amc/orders/${o_id}/complete HTTP 409"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rov_delta_exactly_threshold_does_not_require_second_review
        grounds:
          - calculations.rov_value_delta
          - entities.ReconsiderationOfValue.fields.requires_second_review
          - entities.ReconsiderationOfValue.fields.value_delta_pct
        distinguishing_aspect: |
          Boundary on the ROV value-delta metric (POST /amc/orders/{id}/reconsiderations): requested 550000 vs
          delivered 500000 = exactly 10.00%, and the threshold is STRICTLY greater (> 10.0), so
          requires_second_review is false at the boundary; 10.00 does not trip it.
        test_recipe:
          setup:
            - "Order delivered with appraised_value_cents 500000."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Bnd A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender B", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "10 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 5 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr_id}/finalize"
              payload: {}
              as: ComplianceReviewer
          trigger:
            - call: "POST /amc/orders/${o_id}/reconsiderations"
              payload: { requested_value_cents: 550000 }
              as: LenderUser
              as_user_id: "${l_id}"
              captures: { dp: $.data.value_delta_pct, rsr: $.data.requires_second_review }
          assert:
            - "POST /amc/orders/${o_id}/reconsiderations .value_delta_pct == 10.00"
            - "POST /amc/orders/${o_id}/reconsiderations .requires_second_review == false"

      - name: no_eligible_appraiser_empty_candidate_set_on_assign
        grounds:
          - calculations.rotation_selector
          - validations[priority=5]
          - errors[ERR_NO_ELIGIBLE_APPRAISER]
        distinguishing_aspect: |
          Empty-set boundary on a different metric and endpoint (rotation candidate set, POST
          /amc/orders/{id}/assignments): the only panel appraiser is SUSPENDED so the candidate set is empty;
          the selector returns ERR_NO_ELIGIBLE_APPRAISER rather than picking anyone.
        test_recipe:
          setup:
            - "One appraiser on panel, then SUSPENDED; property CA matches its license; order placed."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Susp A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/appraisers/${a_id}/status"
              payload: { status: "SUSPENDED" }
              as: AMCCoordinator
            - call: "POST /amc/lenders"
              payload: { name: "Lender NE", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "11 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
          trigger:
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/orders/${o_id}/assignments .error_id == ERR_NO_ELIGIBLE_APPRAISER"
            - "POST /amc/orders/${o_id}/assignments HTTP 422"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_submission_requires_assignment_accepted_pair_report_assignment
        grounds:
          - validations[priority=6]
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - errors[ERR_ASSIGNMENT_NOT_REVISABLE]
        distinguishing_aspect: |
          Cross-entity pair Report->Assignment: a report submission is rejected when the target Assignment is
          still OFFERED (not yet ACCEPTED), with ERR_ASSIGNMENT_NOT_REVISABLE; the Report transition depends on
          the Assignment's state.
        test_recipe:
          setup:
            - "Order assigned; assignment still OFFERED (appraiser has NOT accepted)."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "CrossA", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender X", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "12 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
