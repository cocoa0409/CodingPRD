  - name: info_request_rounds_run_out_on_the_third_review
    claim_type: error_triggerable
    grounds:
    - errors[ERR_INFO_ROUNDS_EXHAUSTED]
    excluded_because:
      difficulty_instance: non_linear_state_machine / support_request_info_request_cycle_exhausts_after_two_rounds
      rationale: That §1.8 instance drives the SUBMITTED <-> INFO_REQUESTED loop twice and asserts ERR_INFO_ROUNDS_EXHAUSTED
        on the third request.
  - name: a_shift_colliding_with_an_enrolled_session_is_rejected
    claim_type: error_triggerable
    grounds:
    - errors[ERR_SHIFT_CONFLICTS_SESSION]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / shift_versus_enrolled_session_closed_interval_with_commute_buffer
      rationale: That §1.8 instance walks the commute-buffer boundary on both sides and asserts ERR_SHIFT_CONFLICTS_SESSION
        for the colliding case.
  - name: a_coach_booked_twice_over_one_interval_is_rejected
    claim_type: error_triggerable
    grounds:
    - errors[ERR_COACH_DOUBLE_BOOKED]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / coach_double_booking_half_open_adjacency_allowed
      rationale: That §1.8 instance asserts the adjacent-is-allowed case and the overlapping ERR_COACH_DOUBLE_BOOKED
        case for the same coach.
  - name: two_overlapping_shifts_for_one_participant_are_rejected
    claim_type: error_triggerable
    grounds:
    - errors[ERR_SHIFT_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / shift_versus_shift_half_open_overlap_across_two_placements
      rationale: That §1.8 instance proves the overlap check spans placements and asserts ERR_SHIFT_OVERLAP.
  - name: a_suspended_participant_cannot_be_funded_or_enrolled
    claim_type: error_triggerable
    grounds:
    - errors[ERR_PARTICIPANT_SUSPENDED]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / suspended_participant_error_beats_per_participant_cap_error
      rationale: That §1.8 instance asserts ERR_PARTICIPANT_SUSPENDED as the winning priority-9 code; the enrolment
        path for the same code is asserted by cross_entity_state_dependency / enrollment_blocked_while_participant_suspended.
  - name: a_full_opening_cannot_take_another_placement
    claim_type: error_triggerable
    grounds:
    - errors[ERR_JOB_OPENING_NOT_OPEN]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / barred_record_category_error_beats_full_opening_error
      rationale: That §1.8 instance fills the opening to remaining_openings 0 and then asserts ERR_JOB_OPENING_NOT_OPEN
        once the higher-priority barred-category violation is repaired.
  - name: a_shift_without_work_authorization_or_outside_the_window_is_rejected
    claim_type: error_triggerable
    grounds:
    - errors[ERR_WORK_NOT_AUTHORIZED]
    - errors[ERR_SHIFT_OUTSIDE_WINDOW]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / work_not_authorized_error_beats_shift_outside_window_error
      rationale: That §1.8 instance violates both rules with one shift, asserts the priority-11 ERR_WORK_NOT_AUTHORIZED,
        then approves the authorization to expose ERR_SHIFT_OUTSIDE_WINDOW.
  - name: a_placement_on_a_non_active_partnership_is_rejected
    claim_type: error_triggerable
    grounds:
    - errors[ERR_PARTNERSHIP_NOT_ACTIVE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / placement_creation_blocked_until_partnership_reaches_active
      rationale: That §1.8 instance sweeps PROSPECT, ENGAGED and SUSPENDED partnerships and asserts ERR_PARTNERSHIP_NOT_ACTIVE
        for each before ACTIVE succeeds.
  - name: a_licensed_opening_without_granted_relief_is_rejected
    claim_type: error_triggerable
    grounds:
    - errors[ERR_LICENSE_RELIEF_REQUIRED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / licensed_opening_requires_participant_license_relief_granted
      rationale: That §1.8 instance walks the petition chain and asserts ERR_LICENSE_RELIEF_REQUIRED at every stage
        except RELIEF_GRANTED.
