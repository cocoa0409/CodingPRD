              payload: { cook_id: "${cook_id}", production_window_id: "${pw_id}", basis: "ACCRUAL_WINDOW", expected_production_window_version: "${pw_v1}" }
              as: FinanceOperator
              as_user_id: "fin-1"
              captures: { ps_id: $.data.id }
          assert:
            - "PayoutStatement.${ps_id}.gross_sales_cents == 2440"
            - "PayoutStatement.${ps_id}.tier_rate == 0.225"
            - "PayoutStatement.${ps_id}.commission_cents == 550"
            - "PayoutStatement.${ps_id}.commission_cents != 549"
            - "PayoutStatement.${ps_id}.net_payout_cents == 1890"
            - "Order.${o1_id}.platform_commission_cents == 275"
            - "Order.${o2_id}.platform_commission_cents == 275"

      - name: spoilage_reserve_evaluated_before_admission
        grounds:
          - calculations.effective_production_capacity
          - entities.ProductionWindow.fields.committed_meals
          - entities.ProductionWindow.fields.spoilage_reserve_meals
          - entities.ProductionWindow.fields.effective_capacity_meals
          - validations[priority=46]
        distinguishing_aspect: |
          Mode (c) - two rules interleave on a single request and the OUTCOME depends on which is
          applied first. With capacity_meals 40 and committed_meals 30 the spoilage reserve must be
          derived from the PRE-admission count (ceil(30 * 0.10) == 3, effective 37) so a 7-meal
          order is admitted at exactly the bound; deriving it from the POST-admission count
          (ceil(37 * 0.10) == 4, effective 36) would reject the same order. The persisted end
          state 37 committed / 4 reserve / 36 effective is only reachable via the pinned order.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Dee is ACTIVE and CLEAR with weekly_capacity_meals 40."
            - "One APPROVED MenuItem priced at 1200 cents per meal."
            - "One OPEN ProductionWindow with capacity_meals 40 holding two orders of quantity 20 and 10, so committed_meals is 30, spoilage_reserve_meals is 3 and effective_capacity_meals is 37."
            - "Logical clock sits at the default 2026-08-01T00:00:00Z, well before the 2026-08-05 cutoff."
