        grounds:
          - state_machines.Installation.PENDING_CONSENT_to_ACTIVE
          - validations[priority=9]
          - errors[ERR_SCOPE_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair Installation -> ScopeRequest: consent succeeds only when
          EVERY scope of the published version has ScopeRequest.status ==
          APPROVED; one PENDING sibling request blocks the installation
          transition with ERR_SCOPE_NOT_APPROVED.
