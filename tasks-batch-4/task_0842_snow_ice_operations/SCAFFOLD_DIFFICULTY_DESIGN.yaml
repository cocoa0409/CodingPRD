              payload: { route_id: "${rt1}", vehicle_id: "${veh}", operator_id: "${op}", assignment_type: "PLOWING", window_start_at: "2026-02-10T01:00:00Z", window_end_at: "2026-02-10T05:00:00Z", planned_material_tons: 2.0, expected_storm_event_version: "${v1}" }
              as: DispatchSupervisor
              captures: { asg1: $.data.id }
            - call: "GET /storm-events/${st}"
              payload: {}
              as: DispatchSupervisor
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /storm-events/${st}/assignments"
              payload: { route_id: "${rt2}", vehicle_id: "${veh}", operator_id: "${op}", assignment_type: "PLOWING", window_start_at: "2026-02-10T03:00:00Z", window_end_at: "2026-02-10T07:00:00Z", planned_material_tons: 2.0, expected_storm_event_version: "${v2}" }
              as: DispatchSupervisor
