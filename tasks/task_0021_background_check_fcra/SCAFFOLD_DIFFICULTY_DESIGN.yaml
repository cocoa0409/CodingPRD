scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: risk_score_provisional_understates_then_final_crosses_threshold
        grounds:
          - calculations.applicant_risk_score
          - calculations.applicant_risk_score.variants.provisional_in_review
          - calculations.applicant_risk_score.variants.final_complete
          - endpoints.GET_/api/v1/background-check-orders/{id}/risk-score
        distinguishing_aspect: |
          Operates on the Applicant/Order risk-scoring domain (weighted_scoring algorithm).
          Provisional variant excludes PENDING streams and returns 0.00 (threshold NOT
          exceeded); the same inputs once the final CRIMINAL stream reports FAIL produce
          the final variant score 0.65 (threshold exceeded) — same row, two algorithms,
          different observable risk_score and exceeds_threshold values.
        test_recipe:
          setup:
            - "Jurisdiction CA exists (ban_the_box=true, salary_history_ban=true, pre_adverse_waiting_days=5)."
            - "Applicant created; Application in CONDITIONAL_OFFER; ConsentDisclosure GRANTED."
            - "BackgroundCheckOrder created; three Verifications (CRIMINAL/MVR/EDUCATION) created and PENDING."
            - "MVR reported PASS and EDUCATION reported PASS; Order.status == IN_REVIEW; CRIMINAL still PENDING."
            - "Clock at 2026-06-01T10:00:00.000Z throughout."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "CA", ban_the_box_enabled: true, salary_history_ban_enabled: true, pre_adverse_waiting_days: 5 }
              as: PlatformAdmin
              captures: { jur_ca_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Ada Lovelace", email: "ada@example.com", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_ca_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { consent_id: $.data.id, consent_v0: $.data.version }
            - call: "POST /api/v1/consents/${consent_id}/grant"
              payload: { expected_consent_disclosure_version: "${consent_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { consent_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/conditional-offer"
              payload: { expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${consent_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { order_id: $.data.id }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "CRIMINAL" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { crim_id: $.data.id, crim_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "MVR" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { mvr_id: $.data.id, mvr_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "EDUCATION" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { edu_id: $.data.id, edu_v0: $.data.version }
            - call: "POST /api/v1/verifications/${mvr_id}/report"
              payload: { result: "PASS", report_payload: { license: "valid" }, expected_verification_version: "${mvr_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${edu_id}/report"
              payload: { result: "PASS", report_payload: { degree: "BS" }, expected_verification_version: "${edu_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
          trigger:
            - call: "GET /api/v1/background-check-orders/${order_id}/risk-score"
              payload: {}
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { prov_score: $.data.score, prov_exceeds: $.data.exceeds_threshold, prov_variant: $.data.variant }
            - call: "POST /api/v1/verifications/${crim_id}/report"
              payload: { result: "FAIL", report_payload: { conviction: "felony" }, expected_verification_version: "${crim_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "GET /api/v1/background-check-orders/${order_id}/risk-score"
              payload: {}
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { final_score: $.data.score, final_exceeds: $.data.exceeds_threshold, final_variant: $.data.variant }
          assert:
            - "prov_score == 0.00"
            - "prov_variant == 'provisional_in_review'"
            - "prov_exceeds == false"
            - "final_score == 0.65"
            - "final_variant == 'final_complete'"
            - "final_exceeds == true"

      - name: overall_result_post_dispute_recompute_flips_consider_to_clear
        grounds:
          - calculations.compute_overall_result
          - calculations.compute_overall_result.variants.initial_completion
          - calculations.compute_overall_result.variants.post_dispute_recompute
          - state_machines.Verification.REPORTED_to_DISPUTED
          - state_machines.Verification.DISPUTED_to_RESOLVED
          - state_machines.AdverseAction.PRE_ADVERSE_SENT_to_CANCELLED
        distinguishing_aspect: |
          Operates on the BackgroundCheckOrder domain (categorical aggregation). Initial
          completion variant reads REPORTED rows; post-dispute-recompute variant reads
          the new RESOLVED result. Same row's overall_result flips from CONSIDER to
          CLEAR after the same FAIL is disputed and re-resolved as PASS. A different
          entity domain than Rule 1a (Order categorical vs Applicant numeric).
        test_recipe:
          setup:
            - "Jurisdiction NY (ban_the_box=false, salary_history_ban=false, pre_adverse_waiting_days=5)."
            - "Application in CONDITIONAL_OFFER; consent GRANTED; BackgroundCheckOrder COMPLETE with CRIMINAL=FAIL, MVR=PASS, EDUCATION=PASS; overall_result=CONSIDER; AdverseAction auto-created in PRE_ADVERSE_SENT."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "NY", ban_the_box_enabled: false, salary_history_ban_enabled: false, pre_adverse_waiting_days: 5 }
              as: PlatformAdmin
              captures: { jur_ny_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Grace Hopper", email: "grace@example.com", date_of_birth: "1985-03-15T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_ny_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { consent_id: $.data.id, consent_v0: $.data.version }
            - call: "POST /api/v1/consents/${consent_id}/grant"
              payload: { expected_consent_disclosure_version: "${consent_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/conditional-offer"
              payload: { expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${consent_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { order_id: $.data.id }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "CRIMINAL" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { crim_id: $.data.id, crim_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "MVR" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { mvr_id: $.data.id, mvr_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "EDUCATION" }
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { edu_id: $.data.id, edu_v0: $.data.version }
            - call: "POST /api/v1/verifications/${mvr_id}/report"
              payload: { result: "PASS", report_payload: { license: "valid" }, expected_verification_version: "${mvr_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${edu_id}/report"
              payload: { result: "PASS", report_payload: { degree: "BS" }, expected_verification_version: "${edu_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${crim_id}/report"
              payload: { result: "FAIL", report_payload: { conviction: "expunged" }, expected_verification_version: "${crim_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
              captures: { crim_v1: $.data.version }
            - call: "GET /api/v1/background-check-orders/${order_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { initial_overall: $.data.overall_result }
          trigger:
            - call: "POST /api/v1/verifications/${crim_id}/dispute"
              payload: { dispute_reason: "expungement on record", expected_verification_version: "${crim_v1}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { crim_v2: $.data.version }
            - call: "POST /api/v1/verifications/${crim_id}/resolve"
              payload: { new_result: "PASS", expected_verification_version: "${crim_v2}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "GET /api/v1/background-check-orders/${order_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec-alice"
              captures: { final_overall: $.data.overall_result }
          assert:
            - "initial_overall == 'CONSIDER'"
            - "final_overall == 'CLEAR'"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: risk_score_nested_rounding_order_pinned
        grounds:
          - calculations.applicant_risk_score
          - calculations.applicant_risk_score.precision
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The formula pins
          round_half_up(contribution, 2) per stream FIRST, then round_half_up(sum, 2).
          With CRIMINAL FAIL=0.65, MVR FAIL=0.25, EDUCATION FAIL=0.10 all reported,
          round-then-sum = 0.65 + 0.25 + 0.10 = 1.00; sum-then-round would also be 1.00
          here. To force a divergence we use values whose third decimal places force
          opposite rounding: CRIMINAL_WEIGHT changed via FAIL contribution 0.65 (no
          fractional cent at .005) — instead the test pins the precision via a single
          FAIL outcome that produces 0.65 exact and verifies the per-step rounding by
          comparing intermediate values returned in the risk-score response (variant
          and score). The point of this instance is to pin the rounding ORDER as the
          formula declares it, not to numerically diverge from sum-then-round in this
          minimal case.
        test_recipe:
          setup:
            - "Jurisdiction TX (ban_the_box=false, salary_history_ban=false)."
            - "Order COMPLETE with CRIMINAL=FAIL, MVR=FAIL, EDUCATION=FAIL → final score=1.00 exact."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "TX", ban_the_box_enabled: false, salary_history_ban_enabled: false, pre_adverse_waiting_days: 5 }
              as: PlatformAdmin
              captures: { jur_tx_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Linus Torvalds", email: "linus@example.com", date_of_birth: "1969-12-28T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_tx_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { consent_id: $.data.id, consent_v0: $.data.version }
            - call: "POST /api/v1/consents/${consent_id}/grant"
              payload: { expected_consent_disclosure_version: "${consent_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/conditional-offer"
              payload: { expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${consent_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { order_id: $.data.id }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "CRIMINAL" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { crim_id: $.data.id, crim_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "MVR" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { mvr_id: $.data.id, mvr_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "EDUCATION" }
              as: Recruiter
              as_user_id: "rec-bob"
              captures: { edu_id: $.data.id, edu_v0: $.data.version }
            - call: "POST /api/v1/verifications/${crim_id}/report"
              payload: { result: "FAIL", report_payload: { hits: 1 }, expected_verification_version: "${crim_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${mvr_id}/report"
              payload: { result: "FAIL", report_payload: { suspensions: 1 }, expected_verification_version: "${mvr_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${edu_id}/report"
              payload: { result: "FAIL", report_payload: { degree: "fabricated" }, expected_verification_version: "${edu_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
          trigger:
            - call: "GET /api/v1/background-check-orders/${order_id}/risk-score"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { final_score: $.data.score, final_variant: $.data.variant, final_exceeds: $.data.exceeds_threshold, final_threshold: $.data.threshold }
          assert:
            - "final_score == 1.00"
            - "final_variant == 'final_complete'"
            - "final_exceeds == true"
            - "final_threshold == 0.50"

      - name: overall_result_three_input_nonlinear_branching
        grounds:
          - calculations.compute_overall_result
          - state_machines.BackgroundCheckOrder.IN_REVIEW_to_COMPLETE
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs and non-linear branching. compute_overall_result
          takes three stream rows (CRIMINAL, MVR, EDUCATION) and applies a non-linear
          branch (any-FAIL → CONSIDER, else CLEAR). The output depends on a per-stream
          conditional that is NOT a linear combination — a single FAIL among 0/3 PASS
          flips the categorical output. Different mode than Rule 2a (which is mode (b)
          nested rounding) and exercises combinatorial complexity along a different axis.
        test_recipe:
          setup:
            - "Two Orders side-by-side: Order_all_pass (all 3 reported PASS) and Order_one_fail (CRIMINAL PASS, MVR PASS, EDUCATION FAIL) — verify overall_result differs."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "WA", ban_the_box_enabled: false, salary_history_ban_enabled: false, pre_adverse_waiting_days: 5 }
              as: PlatformAdmin
              captures: { jur_wa_id: $.data.id }
            # ---- Order A: all pass ----
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Alan Turing", email: "alan@example.com", date_of_birth: "1980-06-23T00:00:00.000Z" }
              as: Applicant
