# =============================================================================
# §1.0–§1.7 Scaffold — Pay-As-You-Go Workers Compensation Premium Reporting
# Task: task_3092_pay_as_you_go_workers_compensation_premium
# =============================================================================

scenario: |
  Pay-As-You-Go Workers Compensation Premium Reporting (Employers Holdings): policy issuance
  with estimated payroll by class code and experience modification application,
  payroll-integrated premium computation where each payroll run reports actual wages by class,
  real-time premium billing eliminating large deposit and audit true-up swings,
  class code assignment disputes and reassignment with retroactive adjustment,
  employee classification review for overtime, severance and executive payroll inclusion rules,
  year-end audit reconciling reported payroll to tax filings,
  policy cancellation for non-reporting when a payroll integration breaks,
  multi-state policy with differing rating rules and monopolistic state exclusions

domain_name: paygo-workers-comp
api_prefix: /wc

complexity_profile:
  primary_archetype: ledger_reconciliation        # two algorithms over the same payroll produce divergent premiums
  secondary_archetype: compliance_audit           # audit windows, segregation of duties, tamper-evident overrides
  complexity_layers:
    - optimistic_concurrency                      # OCC on Policy.version guards dispute/effective-date writes
    - cascading_side_effects                      # report → invoice → paid → audit-eligible chains
    - dual_variant_calculation                    # estimated vs actual premium; gross vs net OT pay basis
    - rate_threshold_triggers                     # minimum premium thresholds; cancellation day thresholds
    - scheduled_deferred_actions                  # effective-dated retroactive class reassignments
  entity_topology: hybrid                         # Policy tree + flat state rating table references
  state_machine_shape: parallel                   # coverage_status × reporting_status × billing_status on Policy
  relationship_patterns:
    - one_to_many
    - cross_aggregate                             # StateRatingTable referenced across policy boundaries
    - self_referential                            # ClassCodeDispute.supersedes_dispute_id
  role_model: segregation_of_duties               # filer != decider on disputes and audits
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: fein, type: string, source: input, description: "Federal EIN; unique across employers" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email; required so billing and audit notices have a recipient" }
      - { name: home_state, type: string, source: input, description: "Employer home state code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: StateRatingTable
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code; unique with effective_from" }
      - { name: effective_from, type: datetime, source: input, description: "Table effective start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Table effective end (exclusive); half-open interval [effective_from, effective_to)" }
      - { name: monopolistic, type: boolean, source: input, description: "True for monopolistic fund states (e.g., OH, WA) — excluded from private PAYG billing" }
      - { name: per_capita_admin_fee_cents, type: integer, source: input, description: "Per-covered-employee admin fee added per payroll run" }
      - { name: expense_constant_cents, type: integer, source: input, description: "Flat expense constant charged once per invoice" }
      - { name: min_payroll_threshold_cents, type: integer, source: input, description: "If state-run premium is below this, the line is replaced by the state minimum premium" }
      - { name: state_minimum_premium_cents, type: integer, source: input, description: "Minimum premium applied when below threshold" }
      - { name: ot_basis, type: enum, source: input, description: "GROSS | NET — whether premium OT hours count at 1.5x wage or straight-time wage" }
      - { name: class_rates, type: array, source: input, description: "Array of {class_code, rate_per_100_cents} — manual rate per $100 of payroll in cents" }
      - { name: max_payroll_per_executive_cents, type: integer, source: input, description: "Weekly cap on executive officer payroll inclusion (class 8809)" }

  - name: Policy
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; owning employer" }
      - { name: policy_number, type: string, source: input, description: "Unique policy number" }
      - { name: effective_date, type: datetime, source: input, description: "Coverage start date (inclusive)" }
      - { name: expiry_date, type: datetime, source: input, description: "Coverage end date (exclusive); term = [effective_date, expiry_date)" }
      - { name: experience_mod, type: number, source: input, description: "Experience modification factor; 3 decimals, e.g. 1.000; applied to manual premium" }
      - { name: coverage_status, type: enum, source: system, description: "PENDING | ACTIVE | CANCELLED | EXPIRED" }
      - { name: reporting_status, type: enum, source: system, description: "COMPLIANT | GRACE | DELINQUENT | NON_REPORTING" }
      - { name: billing_status, type: enum, source: system, description: "CURRENT | OVERDUE | SUSPENDED" }
      - { name: last_report_received_at, type: datetime, source: system, description: "Timestamp of most recent accepted payroll report" }
      - { name: consecutive_missed_cycles, type: integer, source: system, description: "Count of consecutive payroll cycles with no accepted report; reset to 0 on acceptance", default: 0 }
      - { name: cumulative_billed_cents, type: integer, source: computed, description: "Sum of Invoice.total_cents for invoices in ISSUED or PAID" }
      - { name: cumulative_collected_cents, type: integer, source: computed, description: "Sum of Invoice.total_cents for invoices in PAID" }

  - name: PolicyClassCode
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: state_code, type: string, source: input, description: "State this class assignment applies to; must not be monopolistic at bind" }
      - { name: class_code, type: string, source: input, description: "NCCI-style class code, e.g. 8810 clerical, 5645 carpentry, 8809 executive" }
      - { name: estimated_annual_payroll_cents, type: integer, source: input, description: "Estimated annual payroll for this class at issuance" }
      - { name: effective_from, type: datetime, source: system, description: "When this assignment took effect; equals policy.effective_date at issuance, or the dispute's effective_from when created by an APPROVED dispute" }
      - { name: assignment_status, type: enum, source: system, description: "ACTIVE | DISPUTED | REASSIGNED" }

  - name: PayrollIntegration
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: provider, type: string, source: input, description: "Payroll provider name" }
      - { name: connection_status, type: enum, source: system, description: "CONNECTED | DEGRADED | BROKEN" }
      - { name: last_heartbeat_at, type: datetime, source: system, description: "Last successful integration heartbeat" }

  - name: PayrollReport
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: period_start, type: datetime, source: input, description: "Pay period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Pay period end (exclusive); half-open [period_start, period_end)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED" }
      - { name: failure_code, type: string, source: system, description: "When status == REJECTED, the error_id of the failed acceptance check (e.g. ERR_CLASS_CODE_NOT_ON_POLICY); null otherwise" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of the PayrollProvider who submitted; recorded for segregation-of-duties" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied idempotency key; unique per policy" }

  - name: PayrollLine
    parent: PayrollReport
    common_fields: true
    fields:
      - { name: payroll_report_id, type: string, source: system, description: "FK -> PayrollReport.id" }
      - { name: state_code, type: string, source: input, description: "State where wages were earned" }
      - { name: class_code, type: string, source: input, description: "Class code the wages are reported under" }
      - { name: gross_wages_cents, type: integer, source: input, description: "Total gross wages including OT premium portion, severance, executive pay" }
      - { name: ot_premium_cents, type: integer, source: input, description: "Portion of gross attributable to the OT premium half (the 0.5 of time-and-a-half)", default: 0 }
      - { name: severance_cents, type: integer, source: input, description: "Severance pay included in gross", default: 0 }
      - { name: executive_wages_cents, type: integer, source: input, description: "Executive officer wages included in gross (class 8809 basis)", default: 0 }
      - { name: headcount, type: integer, source: input, description: "Covered employees on this line for per-capita fee" }
      - { name: remuneration_basis_cents, type: integer, source: computed, description: "Includable remuneration after exclusions/caps per calculation remuneration_basis" }

  - name: PremiumInvoice
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: payroll_report_id, type: string, source: system, description: "FK -> PayrollReport.id; nullable for audit adjustment invoices" }
      - { name: kind, type: enum, source: system, description: "PAYROLL | RETRO_ADJUSTMENT | AUDIT_TRUEUP | MINIMUM_PREMIUM" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID" }
      - { name: manual_premium_cents, type: integer, source: computed, description: "Sum over lines of basis*rate/100 before experience mod" }
      - { name: experience_mod_applied, type: number, source: computed, description: "Experience mod snapshotted at invoice issuance" }
      - { name: premium_after_mod_cents, type: integer, source: computed, description: "manual_premium * experience_mod, rounded" }
      - { name: per_capita_fees_cents, type: integer, source: computed, description: "Sum of state per-capita admin fees" }
      - { name: expense_constant_cents, type: integer, source: computed, description: "Max expense constant across states on the invoice (charged once)" }
      - { name: total_cents, type: integer, source: computed, description: "Final invoice total" }
      - { name: due_date, type: datetime, source: computed, description: "ISSUED timestamp + 7 days" }

  - name: ClassCodeDispute
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: policy_class_code_id, type: string, source: input, description: "FK -> PolicyClassCode.id; assignment being disputed" }
      - { name: requested_class_code, type: string, source: input, description: "Class code the filer believes is correct" }
      - { name: effective_from, type: datetime, source: input, description: "Retroactive effective date the reassignment should apply from" }
      - { name: supersedes_dispute_id, type: string, source: input, description: "FK -> ClassCodeDispute.id; when re-disputing a previously DECIDED matter (self-referential)" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | DENIED" }
      - { name: resolution_reason, type: string, source: system, description: "Machine-readable reason set on terminal decisions, e.g. 'decided' or 'policy_cancelled'; null while non-terminal" }
      - { name: filed_by, type: string, source: system, description: "X-User-ID of filer; decider must differ (segregation of duties)" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of Underwriter who decided" }

  - name: AuditReconciliation
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: period_start, type: datetime, source: input, description: "Audit period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Audit period end (exclusive)" }
      - { name: status, type: enum, source: system, description: "OPEN | FILED | VERIFIED | CLOSED | WAIVED" }
      - { name: filed_by, type: string, source: system, description: "X-User-ID of the TaxFiler who filed the reconciliation" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of the Auditor; must differ from filed_by" }
      - { name: reported_payroll_cents, type: integer, source: computed, description: "Sum of remuneration basis over ACCEPTED reports in the audit window" }
      - { name: filing_payroll_cents, type: integer, source: computed, description: "Sum of TaxFilingRecord wages in the window" }
      - { name: variance_cents, type: integer, source: computed, description: "filing_payroll_cents - reported_payroll_cents" }
      - { name: trueup_invoice_id, type: string, source: system, description: "FK -> PremiumInvoice.id of the generated AUDIT_TRUEUP invoice, if variance is positive" }

  - name: TaxFilingRecord
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: state_code, type: string, source: input, description: "State of the quarterly tax filing" }
      - { name: quarter, type: string, source: input, description: "Quarter label, e.g. 2026Q3" }
      - { name: period_start, type: datetime, source: input, description: "Filing period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Filing period end (exclusive)" }
      - { name: reported_wages_cents, type: integer, source: input, description: "Wages per state unemployment tax filing" }
      - { name: source, type: enum, source: input, description: "SUI | IRS_941 | MANUAL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Policy
    field: coverage_status
    initial_state: PENDING
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /wc/policies/{id}/bind"
        actor: Underwriter
        preconditions:
          - "at least one PolicyClassCode with assignment_status == ACTIVE exists"
          - "no PolicyClassCode references a monopolistic state"
          - "effective_date <= logical clock < expiry_date"
        side_effects:
          - "creates PayrollIntegration with connection_status CONNECTED"
          - "coverage_status becomes ACTIVE; version increments"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system auto-cancel when reporting_status == NON_REPORTING for NON_REPORTING_CANCEL_DAYS (35) consecutive days, OR POST /wc/policies/{id}/cancel by Underwriter"
        actor: system | Underwriter
        preconditions:
          - "system path: reporting_status == NON_REPORTING and (logical clock - last NON_REPORTING entry) >= 35 days"
        side_effects:
          - "all non-terminal PremiumInvoices in DRAFT are set to VOID"
          - "ISSUED invoices remain payable (earned premium is not waived)"
          - "open ClassCodeDisputes (FILED, UNDER_REVIEW) move to DENIED with resolution_reason policy_cancelled"
          - "open AuditReconciliation (OPEN, FILED) moves to WAIVED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system transition when logical clock reaches expiry_date"
        actor: system
        preconditions: ["logical clock >= expiry_date"]
        side_effects:
          - "opens an AuditReconciliation covering the full policy term with status OPEN"

  - entity: Policy
    field: reporting_status
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: GRACE
        trigger: "system at payroll cycle close when no ACCEPTED PayrollReport covers the closing cycle"
        actor: system
        preconditions: ["consecutive_missed_cycles becomes 1"]
        side_effects: ["increments consecutive_missed_cycles"]
      - from: GRACE
        to: COMPLIANT
        trigger: "acceptance of a PayrollReport covering the missed cycle (POST /wc/payroll-reports with period covering the gap)"
        actor: system
        preconditions: ["report accepted"]
        side_effects: ["consecutive_missed_cycles reset to 0"]
      - from: GRACE
        to: DELINQUENT
        trigger: "system when consecutive_missed_cycles reaches 2"
        actor: system
        preconditions: ["consecutive_missed_cycles == 2"]
        side_effects: []
      - from: DELINQUENT
        to: COMPLIANT
        trigger: "system on acceptance of all missing-cycle reports"
        actor: system
        preconditions: ["all missed cycles now covered by ACCEPTED reports"]
        side_effects: ["consecutive_missed_cycles reset to 0"]
      - from: DELINQUENT
        to: NON_REPORTING
        trigger: "system when consecutive_missed_cycles reaches 3 OR PayrollIntegration.connection_status == BROKEN for 21 consecutive days"
        actor: system
        preconditions: ["consecutive_missed_cycles >= 3 OR integration broken 21+ days"]
        side_effects: ["starts the 35-day auto-cancel clock used by coverage_status ACTIVE -> CANCELLED"]
      - from: NON_REPORTING
        to: COMPLIANT
        trigger: "system on acceptance of all missing-cycle reports while coverage_status still ACTIVE"
        actor: system
        preconditions: ["coverage_status == ACTIVE", "all missed cycles covered"]
        side_effects: ["consecutive_missed_cycles reset to 0; auto-cancel clock cleared"]

  - entity: Policy
    field: billing_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: OVERDUE
        trigger: "system when any ISSUED PremiumInvoice passes due_date unpaid"
        actor: system
        preconditions: ["exists PremiumInvoice with status ISSUED and due_date < logical clock"]
        side_effects: []
      - from: OVERDUE
        to: SUSPENDED
        trigger: "system when an invoice is unpaid 14 days past due_date"
        actor: system
        preconditions: ["exists ISSUED invoice with due_date + 14 days < logical clock"]
        side_effects: ["new PayrollReport submissions are rejected with ERR_BILLING_SUSPENDED"]
      - from: OVERDUE
        to: CURRENT
        trigger: "system when all ISSUED invoices become PAID"
        actor: system
        preconditions: ["no ISSUED invoice with due_date < logical clock remains"]
        side_effects: []
      - from: SUSPENDED
        to: CURRENT
        trigger: "system when all ISSUED invoices become PAID"
        actor: system
        preconditions: ["no unpaid ISSUED invoice remains"]
        side_effects: ["PayrollReport submissions accepted again"]

  - entity: PayrollReport
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system synchronous validation on POST /wc/payroll-reports"
        actor: system
        preconditions:
          - "policy coverage_status == ACTIVE"
          - "policy billing_status != SUSPENDED"
          - "Policy.coverage_status == ACTIVE (else ERR_POLICY_NOT_ACTIVE)"
          - "period_start >= policy.effective_date and period_end <= policy.expiry_date"
          - "no other ACCEPTED or SUBMITTED report overlaps [period_start, period_end) for this policy (half-open overlap)"
          - "every PayrollLine.state_code has a non-monopolistic StateRatingTable effective over the whole period"
          - "every PayrollLine.class_code resolves to a PolicyClassCode with assignment_status == ACTIVE for that state"
        side_effects:
          - "creates a PremiumInvoice kind PAYROLL in status ISSUED via calculation payroll_invoice_total"
          - "sets Policy.last_report_received_at and resets consecutive_missed_cycles; reporting_status may move to COMPLIANT"
          - "Policy.version increments"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system synchronous validation failure on POST /wc/payroll-reports"
        actor: system
        preconditions: ["any acceptance precondition fails"]
        side_effects: ["no invoice created; report retained for audit trail"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system when an APPROVED ClassCodeDispute retroactively reassigns a class covering this report's period"
        actor: system
        preconditions: ["dispute approved with effective_from <= report.period_end"]
        side_effects:
          - "original PAYROLL invoice is VOIDed"
          - "a replacement PAYROLL invoice is recomputed under the new class code"
          - "a RETRO_ADJUSTMENT invoice captures the signed delta between original and replacement totals"

  - entity: PremiumInvoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system immediately upon invoice creation (invoices are issued in the same transaction)"
        actor: system
        preconditions: []
        side_effects: ["sets due_date = issue time + 7 days; recalculates Policy.cumulative_billed_cents"]
      - from: ISSUED
        to: PAID
        trigger: "POST /wc/invoices/{id}/payments"
        actor: EmployerAdmin
        preconditions: ["invoice status == ISSUED", "payment amount_cents == invoice.total_cents (exact full payment only)"]
        side_effects:
          - "recalculates Policy.cumulative_collected_cents"
          - "billing_status may move OVERDUE/SUSPENDED -> CURRENT"
          - "Policy.version increments"
      - from: ISSUED
        to: VOID
        trigger: "system when the underlying report is SUPERSEDED, or POST /wc/invoices/{id}/void by Underwriter for AUDIT_TRUEUP corrections"
        actor: system | Underwriter
        preconditions: ["invoice not PAID"]
        side_effects: ["recalculates Policy.cumulative_billed_cents"]

  - entity: ClassCodeDispute
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /wc/disputes/{id}/open-review"
        actor: Underwriter
        preconditions: ["dispute status == FILED"]
        side_effects: ["PolicyClassCode.assignment_status for the disputed assignment becomes DISPUTED (payroll may still be reported under it)"]
      - from: UNDER_REVIEW
        to: FILED
        trigger: "POST /wc/disputes/{id}/return-to-filed (cyclic rework loop)"
        actor: Underwriter
        preconditions: ["dispute status == UNDER_REVIEW"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /wc/disputes/{id}/decide with decision APPROVED"
        actor: Underwriter
        preconditions:
          - "dispute status == UNDER_REVIEW"
          - "decider X-User-ID != dispute.filed_by (segregation of duties)"
          - "expected_policy_version matches Policy.version (OCC)"
        side_effects:
          - "PolicyClassCode.assignment_status becomes REASSIGNED; a new PolicyClassCode with requested_class_code and assignment_status ACTIVE is created effective from effective_from"
          - "every ACCEPTED PayrollReport whose period intersects [effective_from, expiry_date) is SUPERSEDED and re-invoiced under the new class (see PayrollReport ACCEPTED -> SUPERSEDED cascade)"
          - "Policy.version increments"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /wc/disputes/{id}/decide with decision DENIED"
        actor: Underwriter
        preconditions:
          - "dispute status == UNDER_REVIEW"
          - "decider X-User-ID != dispute.filed_by"
        side_effects: ["PolicyClassCode.assignment_status returns to ACTIVE"]

  - entity: AuditReconciliation
    initial_state: OPEN
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: FILED
        trigger: "POST /wc/audits/{id}/file by TaxFiler"
        actor: TaxFiler
        preconditions:
          - "audit status == OPEN"
          - "at least one TaxFilingRecord covers each quarter intersecting the audit window"
        side_effects:
          - "computes reported_payroll_cents, filing_payroll_cents, variance_cents via calculation audit_variance"
          - "records filed_by"
      - from: FILED
        to: VERIFIED
        trigger: "POST /wc/audits/{id}/verify by Auditor"
        actor: Auditor
        preconditions:
          - "audit status == FILED"
          - "verifier X-User-ID != audit.filed_by (segregation of duties)"
        side_effects:
          - "if variance_cents > 0: generates PremiumInvoice kind AUDIT_TRUEUP for the unreported wages' premium and stores trueup_invoice_id"
          - "records verified_by"
      - from: VERIFIED
        to: CLOSED
        trigger: "system when trueup_invoice_id is null OR the true-up invoice is PAID"
        actor: system
        preconditions: ["no unpaid true-up invoice"]
        side_effects: []
      - from: OPEN
        to: WAIVED
        trigger: "system on policy cancellation, or POST /wc/audits/{id}/waive by Underwriter for expired-term good-faith exits"
        actor: system | Underwriter
        preconditions: ["audit status == OPEN"]
        side_effects: []

  - entity: PayrollIntegration
    initial_state: CONNECTED
    terminal_states: []
    transitions:
      - from: CONNECTED
        to: DEGRADED
        trigger: "POST /wc/integrations/{id}/heartbeat with outcome DEGRADED (or system missed-heartbeat sweep at 7 days)"
        actor: PayrollProvider | system
        preconditions: ["connection_status == CONNECTED"]
        side_effects: []
      - from: DEGRADED
        to: CONNECTED
        trigger: "POST /wc/integrations/{id}/heartbeat with outcome OK"
        actor: PayrollProvider
        preconditions: ["connection_status == DEGRADED"]
        side_effects: ["last_heartbeat_at refreshed"]
      - from: DEGRADED
        to: BROKEN
        trigger: "POST /wc/integrations/{id}/heartbeat with outcome BROKEN, or system sweep at 14 days without heartbeat"
        actor: PayrollProvider | system
        preconditions: ["connection_status == DEGRADED"]
        side_effects: ["starts the 21-day clock feeding Policy.reporting_status NON_REPORTING"]
      - from: BROKEN
        to: CONNECTED
        trigger: "POST /wc/integrations/{id}/heartbeat with outcome OK"
        actor: PayrollProvider
        preconditions: ["connection_status == BROKEN"]
        side_effects: ["21-day broken clock cleared"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: dispute-decide-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /wc/disputes/{id}/decide"
    occ_field: "expected_policy_version"
    description: |
      Deciding a ClassCodeDispute carries an expected_policy_version snapshot of
      the Policy. If the Policy version has advanced since the decider last read
      it (e.g., a payroll report was accepted in between, which mutates policy
      aggregates), the decision is rejected as stale and must be re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: audit-file-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /wc/audits/{id}/file"
    occ_field: "expected_policy_version"
    description: |
      Filing an AuditReconciliation carries an expected_policy_version; any
      mutation of the policy since the filer's last read (new report, invoice
      payment, dispute decision) invalidates the variance snapshot and the
      filing is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: remuneration_basis
    description: "Per PayrollLine includable remuneration: what part of gross wages premium is charged on, honoring OT basis by state, severance exclusion, and the executive weekly cap."
    trigger: "on PayrollReport acceptance, per PayrollLine"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned and must be followed exactly:
      # 1. severance is ALWAYS excluded from remuneration:
      base = gross_wages_cents - severance_cents
      # 2. OT premium portion: if the state's ot_basis == NET, also subtract the
      #    OT premium half; if GROSS, keep it:
      if state.ot_basis == NET: base = base - ot_premium_cents
      # 3. Executive cap: executive_wages_cents is included only up to
      #    state.max_payroll_per_executive_cents per week of the period;
      #    weeks = ceil((period_end - period_start)/7 days). The cap applies to
      #    the executive component only, after steps 1-2 allocate exclusions
      #    proportionally is NOT allowed — exclusions come off non-executive
      #    wages first is NOT the rule either; the rule is: executive component
      #    = min(executive_wages_cents, weeks * max_payroll_per_executive_cents),
      #    non-executive component = base - executive_wages_cents (floor 0),
      #    basis = non-executive component + capped executive component.
      exec_component = min(executive_wages_cents, weeks * max_payroll_per_executive_cents)
      non_exec = max(0, base - executive_wages_cents)
      remuneration_basis_cents = non_exec + exec_component
    input_set: "PayrollLine records of the report being accepted; StateRatingTable effective over the report period for the line's state"
    constants:
      DAYS_PER_WEEK: 7
    precision: "integer cents; all arithmetic exact in cents"
    variants:
      - name: gross_ot_state
        when: "state rating table ot_basis == GROSS"
        difference: "OT premium half remains in basis (only severance excluded)"
      - name: net_ot_state
        when: "state rating table ot_basis == NET"
        difference: "OT premium half excluded from basis — same gross wages yield a lower basis than GROSS"

  - name: manual_premium
    description: "Manual premium per line: basis * rate / 100 with pinned rounding — per-line round-half-up to cents BEFORE summing (round-per-line-then-sum)."
    trigger: "on invoice computation"
    algorithm: tiered_pricing
    formula: |
      # Rounding order PINNED: round each line first, then sum. The alternative
      # (sum exact fractions, then round once) yields different cents and is
      # forbidden.
      line_premium_cents[line] = round_half_up(remuneration_basis_cents[line] * rate_per_100_cents[line] / 100 / 100)
      # rate_per_100_cents is cents of premium per $100 of payroll, so divide by
      # 100 (per-$100) then the cents->dollars factor is already in cents units;
      # concretely: premium_cents = round_half_up(basis_cents * rate_per_100_cents / 10000)
      manual_premium_cents = sum over lines of line_premium_cents[line]
    input_set: "PayrollLine records on the invoice's report; rates from the StateRatingTable effective over the period for each line's (state, class)"
    constants:
      RATE_DIVISOR: 10000
    precision: "integer cents, round_half_up per line BEFORE summation"

  - name: invoice_total
    description: "Full invoice total: experience mod application, per-state minimum premium substitution, per-capita admin fees, and a single expense constant. Circular-looking dependency pinned: minimum-premium substitution happens on the post-mod per-state subtotal BEFORE the expense constant is selected, and the expense constant is the MAX across the states actually appearing on the invoice (not the sum)."
    trigger: "on PayrollReport acceptance (PAYROLL), dispute approval (RETRO_ADJUSTMENT), audit verify (AUDIT_TRUEUP)"
    algorithm: constraint_propagation
    formula: |
      # Pinned evaluation order (circular-looking deps resolved):
      # 1. per-state post-mod subtotal:
      #    state_subtotal[s] = round_half_up(sum of line premiums in s * experience_mod)
      # 2. minimum premium substitution per state:
      #    if state_subtotal[s] < min_payroll_threshold_cents[s]:
      #        state_subtotal[s] = state_minimum_premium_cents[s]
      #    (boundary: strictly less-than triggers; equal does NOT)
      # 3. per-capita admin fees: per_capita_fees = sum over lines of
      #    headcount[line] * per_capita_admin_fee_cents[state(line)]
      # 4. expense constant charged ONCE per invoice = max of
      #    expense_constant_cents over states present (0 states -> 0)
      # 5. premium_after_mod_cents = sum of substituted state subtotals
      # 6. total_cents = premium_after_mod_cents + per_capita_fees + expense_constant
    input_set: "PayrollLine set of the triggering report (or variance wage set for AUDIT_TRUEUP); StateRatingTable per state; Policy.experience_mod snapshotted"
    constants:
      MIN_PREMIUM_BOUNDARY: "strictly less-than triggers substitution"
    precision: "integer cents, round_half_up at steps 1 only"
    variants:
      - name: estimated_issuance_basis
        when: "at policy issuance (bind), for the deposit-estimate quote"
        difference: "uses PolicyClassCode.estimated_annual_payroll_cents as basis instead of actual reported wages; produces the estimate the PAYG design eliminates — stored only as a quote, never invoiced"
      - name: actual_payroll_basis
        when: "on payroll report acceptance"
        difference: "uses actual remuneration_basis_cents per line; same rate table and mod produce a different total than the estimated variant for identical class structure"

  - name: retro_adjustment_delta
    description: "Signed delta between original invoice and recomputed invoice after a retroactive class reassignment; drives the RETRO_ADJUSTMENT invoice."
    trigger: "ClassCodeDispute APPROVED transition"
    algorithm: chronological
    formula: |
      # Process affected reports in chronological order (period_start ASC,
      # tie-break created_at ASC — never id):
      for each ACCEPTED report whose period intersects [dispute.effective_from, policy.expiry_date):
          original_total = report's PAYROLL invoice.total_cents
          recompute invoice under new class code (same formulas, same constants,
              but rate of requested_class_code effective at the report's period)
          delta += replacement_total - original_total
          void original; issue replacement
      RETRO_ADJUSTMENT invoice total_cents = delta (may be negative = credit)
    input_set: "ACCEPTED PayrollReports intersecting the retro window, chronological by period_start ASC then created_at ASC"
    precision: "integer cents"

  - name: audit_variance
    description: "Year-end reconciliation of reported payroll basis vs tax filings."
    trigger: "AuditReconciliation OPEN -> FILED"
    algorithm: aggregation
    formula: |
      # reported side: sum of PayrollLine.remuneration_basis_cents over reports
      #   with status == ACCEPTED and period fully inside [audit.period_start,
      #   audit.period_end) — half-open window, end-exclusive
      # filing side: sum of TaxFilingRecord.reported_wages_cents whose
      #   [period_start, period_end) intersects the audit window — partial
      #   quarters count in full (no proration)
      # variance_cents = filing_payroll_cents - reported_payroll_cents
      # positive variance => under-reported => true-up invoice on the excess
      #   wages using invoice_total with the policy's class mix of the LAST
      #   accepted report in the window
      # zero or negative variance => no invoice (premium is not refunded at audit)
    input_set: "ACCEPTED PayrollReports fully inside window; TaxFilingRecords intersecting window"
    precision: "integer cents"
    variants:
      - name: forward_looking_reported_side
        when: "computing the reported side mid-term for exposure dashboards"
        difference: "includes SUBMITTED-but-not-yet-ACCEPTED reports, producing a higher reported figure and lower apparent variance than the filing-time variant for identical data"
      - name: filing_time_reported_side
        when: "the binding variant used at OPEN -> FILED"
        difference: "counts ACCEPTED reports only; SUBMITTED pending reports excluded"

  - name: cancellation_clock
    description: "Day-count threshold rules for reporting delinquency and auto-cancellation."
    trigger: "system daily sweep against the logical clock"
    algorithm: threshold
    formula: |
      # threshold semantics pinned (>= vs >):
      missed_cycles:  GRACE at == 1, DELINQUENT at == 2, NON_REPORTING at >= 3
      integration broken: NON_REPORTING when broken_days >= 21
      auto-cancel: coverage ACTIVE -> CANCELLED when non_reporting_days >= 35
      (day-counts compare whole UTC days from the transition timestamp;
       exactly 21 days 00:00 qualifies — boundary is inclusive)
    input_set: "Policy records with coverage_status == ACTIVE"
    constants:
      BROKEN_TO_NONREPORTING_DAYS: 21
      NONREPORTING_TO_CANCEL_DAYS: 35
      GRACE_CYCLE_COUNT: 1
      DELINQUENT_CYCLE_COUNT: 2
      NONREPORTING_CYCLE_COUNT: 3
    precision: "whole days, inclusive lower boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is declared", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for the endpoint per RBAC", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path-referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "request body well-formed: required fields present, enum values valid, date ranges start < end", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "target resource in a state from which the requested transition is declared", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "OCC expected_policy_version matches current Policy.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /wc/disputes/{id}/decide", "POST /wc/audits/{id}/file"] }
  - { priority: 7, category: business_safety, check: "segregation of duties: dispute decider != filer; audit verifier != filer", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /wc/disputes/{id}/decide", "POST /wc/audits/{id}/verify"] }
  - { priority: 8, category: business_safety, check: "no PolicyClassCode or PayrollLine may reference a monopolistic state; a PayrollLine in a monopolistic state fails with this error (distinct from ERR_CLASS_CODE_NOT_ON_POLICY, which fires for non-monopolistic states lacking an ACTIVE assignment); policy covering ONLY monopolistic states cannot bind", error_id: ERR_MONOPOLISTIC_STATE_EXCLUDED, http_status: 422, applies_to: ["POST /wc/policies", "POST /wc/policies/{id}/bind", "POST /wc/payroll-reports"] }
  - { priority: 9, category: business_referential, check: "every PayrollLine.class_code maps to a PolicyClassCode for that state with assignment_status in {ACTIVE, DISPUTED} (payroll may still be reported under a disputed class) and effective_from <= report period_end; REASSIGNED or absent assignments fail", error_id: ERR_CLASS_CODE_NOT_ON_POLICY, http_status: 422, applies_to: ["POST /wc/payroll-reports"] }
  - { priority: 10, category: business_temporal, check: "payroll report period within policy term and non-overlapping with existing SUBMITTED/ACCEPTED reports (half-open interval collision)", error_id: ERR_PAYROLL_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /wc/payroll-reports"] }
  - { priority: 11, category: business_temporal, check: "state rating table intervals for one state must not overlap each other; new table rejected if [effective_from, effective_to) collides with an existing table for the same state (adjacent touching intervals allowed — half-open); also each class_code may appear at most once in class_rates", error_id: ERR_RATING_TABLE_OVERLAP, http_status: 409, applies_to: ["POST /wc/state-rating-tables"] }
  - { priority: 12, category: business_temporal, check: "dispute effective_from must be >= policy.effective_date and < logical clock (no future retroactivity)", error_id: ERR_RETRO_WINDOW_INVALID, http_status: 422, applies_to: ["POST /wc/disputes"] }
  - { priority: 13, category: state, check: "payroll report accepted only when policy billing_status != SUSPENDED", error_id: ERR_BILLING_SUSPENDED, http_status: 409, applies_to: ["POST /wc/payroll-reports"] }
  - { priority: 14, category: business_constraint, check: "idempotency: repeated POST /wc/payroll-reports with same idempotency_key returns the original report; conflicting payload with same key rejected", error_id: ERR_IDEMPOTENCY_CONFLICT, http_status: 409, applies_to: ["POST /wc/payroll-reports"] }
  - { priority: 15, category: business_fiscal, check: "invoice payment amount must equal total_cents exactly (no partial, no overpay)", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: ["POST /wc/invoices/{id}/payments"] }
  - { priority: 16, category: business_referential, check: "audit filing requires TaxFilingRecord coverage for every quarter intersecting the audit window", error_id: ERR_TAX_FILING_MISSING, http_status: 422, applies_to: ["POST /wc/audits/{id}/file"] }
  - { priority: 17, category: business_fiscal, check: "a second PAYROLL invoice total would diverge from the first only via supersede flow; direct duplicate invoice creation rejected", error_id: ERR_DUPLICATE_INVOICE, http_status: 409, applies_to: ["system-generated; defensive"] }

