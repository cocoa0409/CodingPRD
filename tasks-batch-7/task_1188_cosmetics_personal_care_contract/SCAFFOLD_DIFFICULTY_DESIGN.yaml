scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (3 instances, different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: formula_cost_standard_vs_current_lot
        grounds:
          - calculations.formula_cost_estimate
          - entities.Formula.fields.cost_estimate_standard_per_kg_cents
          - entities.Formula.fields.cost_estimate_current_lot_per_kg_cents
        distinguishing_aspect: |
          Dual variant on the Formula domain: identical ingredients costed with
          Component.standard_cost_per_kg_cents yield 1700 cents/kg, while the
          current-lot variant's quantity-weighted average of AVAILABLE priced lots
          (10kg @1800 and 30kg @2200 for component B => 2100) yields 1725 cents/kg.
        test_recipe:
          setup:
            - "Customer exists"
            - "Components A (RAW_MATERIAL, standard 1000 c/kg), B (RAW_MATERIAL, standard 2000 c/kg), C (BULK_FRAGRANCE, standard 10000 c/kg) exist"
            - "Formula F: ingredients A 70% / B 25% / C 5%"
            - "Two AVAILABLE lots of B with unit costs 1800 (10kg) and 2200 (30kg) received after formula creation; no priced lots of A or C (fallback to standard)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Glycerin", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 2000 }
              as: ProductionPlanner
              captures: { cb: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Parfum", kind: "BULK_FRAGRANCE", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 10000 }
              as: ProductionPlanner
              captures: { cc: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 70 }, { inci_name: "GLYCERIN", component_id: "${cb}", percentage: 25 }, { inci_name: "PARFUM", component_id: "${cc}", percentage: 5 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/components/${cb}/lots"
              payload: { lot_code: "B1", quantity_received: 10, unit_cost_per_kg_cents: 1800, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /cosmfg/components/${cb}/lots"
              payload: { lot_code: "B2", quantity_received: 30, unit_cost_per_kg_cents: 2200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
          trigger:
            - call: "GET /cosmfg/formulas/${fm}"
              as: FormulationChemist
          assert:
            - "Formula.${fm}.cost_estimate_standard_per_kg_cents == 1700"
            - "Formula.${fm}.cost_estimate_current_lot_per_kg_cents == 1725"
            - "Formula.${fm}.cost_estimate_current_lot_per_kg_cents != Formula.${fm}.cost_estimate_standard_per_kg_cents"

      - name: order_fulfillable_conservative_vs_optimistic
        grounds:
          - calculations.fulfillable_units
          - entities.ProductionOrder.fields.fulfillable_units_conservative
          - entities.ProductionOrder.fields.fulfillable_units_optimistic
        distinguishing_aspect: |
          Dual variant on the ProductionOrder domain (distinct from Formula costing):
          the conservative pool excludes a 300-unit MINOR_VARIANT bottle lot whose
          waiver is PENDING (800 fulfillable), while the optimistic pool counts it
          (1100 fulfillable); identical lots, different answers.
        test_recipe:
          setup:
            - "Customer (min run 1000) exists"
            - "CUSTOMER_SUPPLIED components bottle and cap owned by the customer; raw component A (1000 c/kg)"
            - "Formula F (ACTIVE) with required_components [{bottle,1},{cap,1}] and a single 100% AQUA ingredient"
            - "Bottle lots: 800 WITHIN_SPEC and 300 MINOR_VARIANT (waiver PENDING); cap lot: 1200 WITHIN_SPEC"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Bottle", kind: "PRIMARY_PACK", supply_mode: "CUSTOMER_SUPPLIED", customer_id: "${cust}", standard_cost_per_kg_cents: 0 }
              as: ProductionPlanner
              captures: { bottle: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Cap", kind: "SECONDARY_PACK", supply_mode: "CUSTOMER_SUPPLIED", customer_id: "${cust}", standard_cost_per_kg_cents: 0 }
              as: ProductionPlanner
              captures: { cap: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [{ component_id: "${bottle}", units_per_product: 1 }, { component_id: "${cap}", units_per_product: 1 }] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/components/${bottle}/lots"
              payload: { lot_code: "BT1", quantity_received: 800, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /cosmfg/components/${bottle}/lots"
              payload: { lot_code: "BT2", quantity_received: 300, expires_at: "2027-01-01T00:00:00Z", sensorial_profile: "MINOR_VARIANT" }
              as: ProductionPlanner
            - call: "POST /cosmfg/components/${cap}/lots"
              payload: { lot_code: "CP1", quantity_received: 1200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          assert:
            - "ProductionOrder.${ord}.fulfillable_units_conservative == 800"
            - "ProductionOrder.${ord}.fulfillable_units_optimistic == 1100"
            - "ProductionOrder.${ord}.fulfillable_units_optimistic != ProductionOrder.${ord}.fulfillable_units_conservative"

      - name: batch_closure_actual_vs_standard
        grounds:
          - calculations.batch_closure_charge
          - entities.Batch.fields.batch_charge_cents
          - entities.Batch.fields.batch_charge_standard_cents
        distinguishing_aspect: |
          Dual variant on the Batch domain: closure charge from actual lot costs
          (60kg @1200 + 40kg @800 = 104000 materials, 2% surcharge => 106080) diverges
          from the standard-cost variant (100000 materials, 2% surcharge => 102000).
        test_recipe:
          setup:
            - "Customer, component A (standard 1000 c/kg), ACTIVE formula with 100% AQUA, and a CONFIRMED order of 2000 units exist"
            - "Batch of 100kg planned; lots A1 60kg @1200 and A2 40kg @800 fully allocated to the batch"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A1", quantity_received: 60, unit_cost_per_kg_cents: 1200, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la1: $.data.id }
            - call: "POST /cosmfg/components/${ca}/lots"
              payload: { lot_code: "A2", quantity_received: 40, unit_cost_per_kg_cents: 800, expires_at: "2027-01-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { la2: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/allocations"
              payload: { items: [{ lot_id: "${la1}", quantity: 60, batch_id: "${bt}" }, { lot_id: "${la2}", quantity: 40, batch_id: "${bt}" }] }
              as: ProductionPlanner
            - call: "POST /cosmfg/batches/${bt}/start-mixing"
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/batches/${bt}/reject"
              payload: { reason: "contamination" }
              as: QAManager
          assert:
            - "Batch.${bt}.status == REJECTED"
            - "Batch.${bt}.batch_charge_cents == 106080"
            - "Batch.${bt}.batch_charge_standard_cents == 102000"
            - "Batch.${bt}.batch_charge_cents != Batch.${bt}.batch_charge_standard_cents"

  # ===================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes b, a, c)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_per_line_rounding_then_sum
        grounds:
          - calculations.order_quote_total
          - entities.ProductionOrder.fields.quote_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-ingredient-line THEN
          sum — lines 1000.5 + 1000.5 + 1000 = 3002 cents materials (fee 25000) =>
          28002; the non-conforming sum-then-round order yields 28001.
        test_recipe:
          setup:
            - "Customer (min run 500, STANDARD tier) exists"
            - "Components A and B at 100.05 c/kg, C at 200 c/kg"
            - "Formula: ingredients 40% A / 40% B / 20% C, bulk_mass_per_unit_kg 0.05, ACTIVE"
            - "Order of exactly 500 units"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Round Corp", tier: "STANDARD", minimum_run_units: 500, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "A", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 100.05 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "B", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 100.05 }
              as: ProductionPlanner
              captures: { cb: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "C", kind: "COLORANT", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 200 }
              as: ProductionPlanner
              captures: { cc: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "FR", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "A", component_id: "${ca}", percentage: 40 }, { inci_name: "B", component_id: "${cb}", percentage: 40 }, { inci_name: "C", component_id: "${cc}", percentage: 20 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
          trigger:
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 500 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
          assert:
            - "ProductionOrder.${ord}.quote_total_cents == 28002"

      - name: changeover_multi_input_branch
        grounds:
          - calculations.changeover_minutes
          - entities.FillingRun.fields.changeover_minutes_required
          - validations[priority=21]
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear branch: previous run SKIN with BULK_FRAGRANCE
          ingredient, new run HAIR => DIFFERENT_CLASS base 45 + fragrance carryover 30
          = 75 minutes required; a 30-minute gap is rejected, a 75-minute gap accepted.
        test_recipe:
          setup:
            - "Customer; fragrance component FC (BULK_FRAGRANCE); raw component A"
            - "F1 SKIN (ingredients include FC), F2 HAIR (AQUA only); both ACTIVE; each has a CONFIRMED order with a PLANNED 100kg batch"
            - "Line L with run of F1's order occupying 2026-05-10T08:00Z-10:00Z"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Parfum", kind: "BULK_FRAGRANCE", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 5000 }
              as: ProductionPlanner
              captures: { fc: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F1", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 95 }, { inci_name: "PARFUM", component_id: "${fc}", percentage: 5 }], required_components: [] }
              as: FormulationChemist
              captures: { f1: $.data.id }
            - call: "POST /cosmfg/formulas/${f1}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${f1}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv1: $.data.id }
            - call: "POST /cosmfg/reviews/${rv1}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv1}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${f1}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F2", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "HAIR", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { f2: $.data.id }
            - call: "POST /cosmfg/formulas/${f2}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${f2}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv2: $.data.id }
            - call: "POST /cosmfg/reviews/${rv2}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv2}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${f2}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${f1}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o1: $.data.id }
            - call: "POST /cosmfg/production-orders/${o1}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${o1}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { b1: $.data.id }
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${f2}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { o2: $.data.id }
            - call: "POST /cosmfg/production-orders/${o2}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${o2}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { b2: $.data.id }
            - call: "POST /cosmfg/filling-lines"
              payload: { line_code: "L1" }
              as: ProductionPlanner
              captures: { ln: $.data.id }
            - call: "POST /cosmfg/production-orders/${o1}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${b1}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T10:00:00Z", planned_units: 2000 }
              as: ProductionPlanner
          trigger:
            - call: "POST /cosmfg/production-orders/${o2}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${b2}", scheduled_start: "2026-05-10T10:30:00Z", scheduled_end: "2026-05-10T12:00:00Z", planned_units: 1000 }
              as: ProductionPlanner
              captures: { e_gap: $.data.error_id }
            - call: "POST /cosmfg/production-orders/${o2}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${b2}", scheduled_start: "2026-05-10T11:15:00Z", scheduled_end: "2026-05-10T12:30:00Z", planned_units: 1000 }
              as: ProductionPlanner
              captures: { rn2: $.data.id, req_min: $.data.changeover_minutes_required }
          assert:
            - "First scheduling attempt is rejected with error_id ERR_CHANGEOVER_GAP_VIOLATION (gap 30 < 75)"
            - "Second attempt succeeds and FillingRun.${rn2}.changeover_minutes_required == 75"

      - name: batch_closure_bracket_read_pre_surcharge
        grounds:
          - calculations.batch_closure_charge
          - entities.Batch.fields.batch_charge_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the surcharge bracket is read from
          materials_cents ALONE (990000 < 1000000 => 2%), giving 990000 + 19800 =
          1009800; reading the bracket from the post-surcharge total (1009800 >=
          1000000 => 5%) would wrongly yield 1039500.
        test_recipe:
          setup:
            - "Customer, component D (standard 2475 c/kg), ACTIVE 100%-ingredient formula, CONFIRMED order of 2000 units"
            - "Batch of 400kg (scale factor 8, no approval); lot 400kg @2475 fully allocated"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "D", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 2475 }
              as: ProductionPlanner
              captures: { cd: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "D", component_id: "${cd}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 400 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/components/${cd}/lots"
              payload: { lot_code: "D1", quantity_received: 400, unit_cost_per_kg_cents: 2475, expires_at: "2027-01-01T00:00:00Z" }
