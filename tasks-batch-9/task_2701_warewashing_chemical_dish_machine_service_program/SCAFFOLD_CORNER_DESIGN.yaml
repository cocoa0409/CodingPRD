              captures: { r_2: $.data.id, d_2: $.data.cycle_delta }
            - call: "GET /warewashing/telemetry-readings"
              payload: { placement_id: "${pl_id}" }
              as: PlatformAdmin
              captures: { total: $.total_count }
          assert:
            - "${installed_at} == 2026-08-01T00:00:00Z - install stamps the clock, not wall time"
            - "${err_1} == ${err_2} == ERR_READING_BEFORE_INSTALL with HTTP 422 - one rule, both ends"
            - "${d_1} == 10 and ${d_2} == 300 with ${src_1} == DEVICE from the default"
            - "${total} == 2 - only the two boundary-inclusive readings were stored"

      - name: renewal_is_refused_one_second_before_the_notice_window_opens
        claim_type: Violation → Error
        grounds:
          - validations.renewal_window_open
          - state_machines.ServiceAgreement.status.ACTIVE_to_RENEWAL_PENDING
          - errors[ERR_RENEWAL_WINDOW_NOT_OPEN]
        distinguishing_aspect: |
          The window is [term_end - renewal_notice_days, term_end): with a one-month term ending
          2026-09-01 and a 5-day notice period it opens at 2026-08-27T00:00:00Z. At 2026-08-26T23:59:59Z
          renewal is ERR_RENEWAL_WINDOW_NOT_OPEN (409) even though the agreement is ACTIVE and renewal is
          a legal ACTIVE transition; one second later the clock sweep flips it to RENEWAL_PENDING and the
          same call extends the term to 2026-10-01. Past term_end the state rule at priority 30 takes
          over from the window rule at 60, so an EXPIRED agreement reports a transition error instead.
        test_recipe:
          setup:
            - "One ACTIVE one-month agreement with renewal_notice_days 5, no placements; clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 1, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"], renewal_notice_days: 5 }
              as: AccountManager
              captures: { agr_id: $.data.id, term_end_1: $.data.term_end_date, notice: $.data.renewal_notice_days }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { st_1: $.data.status }
          trigger:
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T23:59:59Z" }
              as: PlatformAdmin
              captures: { moved_1: $.data.agreements_moved_to_renewal_pending }
            - call: "POST /warewashing/service-agreements/${agr_id}/renewal"
              payload: {}
              as: AccountManager
              captures: { err_1: $.data.error_id }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-27T00:00:00Z" }
              as: PlatformAdmin
              captures: { moved_2: $.data.agreements_moved_to_renewal_pending }
            - call: "GET /warewashing/service-agreements/${agr_id}"
              payload: {}
              as: AccountManager
              captures: { st_2: $.data.status }
            - call: "POST /warewashing/service-agreements/${agr_id}/renewal"
              payload: {}
              as: AccountManager
              captures: { st_3: $.data.status, term_end_2: $.data.term_end_date, rc: $.data.renewal_count }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { expired: $.data.agreements_expired }
            - call: "POST /warewashing/service-agreements/${agr_id}/renewal"
              payload: {}
              as: AccountManager
              captures: { err_2: $.data.error_id }
          assert:
            - "${term_end_1} == 2026-09-01 and ${notice} == 5, with ${st_1} == ACTIVE"
            - "${moved_1} == 0 and ${err_1} == ERR_RENEWAL_WINDOW_NOT_OPEN (409) - one second short of the window"
            - "${moved_2} == 1 and ${st_2} == RENEWAL_PENDING - the sweep, not the renewal call, moves the state"
            - "${st_3} == ACTIVE, ${term_end_2} == 2026-10-01 (extended by minimum_term_months because no override was given) and ${rc} == 1"
            - "${expired} == 1 and ${err_2} == ERR_INVALID_STATE_TRANSITION (409) - past term_end the priority-30 state rule answers before the priority-60 window rule"

      - name: a_review_period_must_fall_inside_the_agreement_term
        claim_type: Violation → Error
        grounds:
          - validations.period_within_agreement_term
          - errors[ERR_PERIOD_OUTSIDE_AGREEMENT_TERM]
        distinguishing_aspect: |
          The period is checked against the term of the site's agreement, not against the clock: a window
          starting one day before start_date is ERR_PERIOD_OUTSIDE_AGREEMENT_TERM (422) even though it is
          entirely in the past, and the first legal window starts exactly at start_date. The accepted
          review is stamped INSUFFICIENT_DATA because there are no racks yet - proof that the period
          check ran before, and independently of, the consumption figures.
        test_recipe:
          setup:
            - "One ACTIVE 36-month agreement from 2026-08-01 (term_end 2029-08-01) and one site with no placements."
          setup_api_calls:
            - call: "POST /warewashing/customers"
