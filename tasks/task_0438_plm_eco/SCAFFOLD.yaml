    roles: [ChangeAdmin, QualityEngineer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Set logical clock to to_iso8601 (does NOT auto-fire effectivity/expiry; those are explicit endpoints)"]

  # --- Supplier ---
  - method: POST
    path: "/plm/suppliers"
    description: "Create a Supplier"
    roles: [SupplierManager]
    code: 201
    input: [name, supplier_code]
    output: Supplier
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/plm/suppliers/{id}"
    description: "Get a Supplier"
