            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "NORTHEAST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-1001", ordered_kft: 5.000, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 85.00, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_id: $.data.id }
