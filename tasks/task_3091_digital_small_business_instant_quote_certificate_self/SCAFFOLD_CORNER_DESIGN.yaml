              captures: { ba_inv: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_inv}", raw_description: "invariant", selected_lines: ["GL"], exposure_units: 730, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_inv}"
              captures: { q_i: $.data.id, q_i_v: $.data.version }
            - call: "POST /ins/quotes/${q_i}/bind"
              payload: { expected_quote_version: "${q_i_v}" }
              as: Policyholder
              as_user_id: "${ba_inv}"
              captures: { p_i: $.data.id, p_i_v: $.data.version }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ins/policies/${p_i}/endorsements"
              payload: { endorsement_type: "COVERAGE_ADJUST", effective_at: "2026-10-01T00:00:00Z", expected_policy_version: "${p_i_v}", new_exposure_units: 0 }
              as: Policyholder
              as_user_id: "${ba_inv}"
          trigger:
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /ins/policies/${p_i}"
