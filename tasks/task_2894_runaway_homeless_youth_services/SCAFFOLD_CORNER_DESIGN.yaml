            - "ShelterProgram.${fk_program_id}.occupied_beds == 0"
            - "Youth.${fk_youth_id}.status == PROSPECT"

  - section: state_machines
    instances:
      - name: admission_initial_state_is_pending_screening
        claim_type: initial_state
        grounds:
          - state_machines.Admission.initial_state
          - endpoints[POST /ryhs/admissions]
        distinguishing_aspect: "A youth with no SafetyScreening at all lands in the declared initial state PENDING_SCREENING with admitted_at null, consuming no bed and creating no GuardianNotification - the ACTIVE short-circuit is not taken."
        test_recipe:
          setup:
            - "an OPEN EMERGENCY_SHELTER program with licensed_bed_capacity 2 and age band 12..17"
            - "youth Iris Vance, dob 2010-03-15, age 16 at the default clock, with no screening on file"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { init_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Iris", legal_last_name: "Vance", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { init_youth_id: $.data.id }
          trigger:
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${init_youth_id}", program_id: "${init_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { init_adm_id: $.data.id }
          assert:
            - "the request returns HTTP 201"
            - "Admission.${init_adm_id}.status == PENDING_SCREENING"
            - "Admission.${init_adm_id}.admitted_at == null"
            - "Admission.${init_adm_id}.capacity_blocked == false"
            - "Admission.${init_adm_id}.extension_count == 0"
            - "Admission.${init_adm_id}.requested_at == 2026-08-01T00:00:00Z"
            - "Admission.${init_adm_id}.admitting_user_id == cm-1"
            - "ShelterProgram.${init_program_id}.occupied_beds == 0"
            - "ShelterProgram.${init_program_id}.posture == OPEN"
            - "Youth.${init_youth_id}.status == PROSPECT"
            - "GET /ryhs/admissions/${init_adm_id}/guardian-notifications returns total_count 0"

      - name: screening_cleared_disposition_activates_the_pending_admission
        claim_type: side_effect_execution
        grounds:
          - state_machines.SafetyScreening.SUBMITTED_to_CLEARED
          - state_machines.Admission.PENDING_SCREENING_to_ACTIVE
          - calculations.admission_priority_score
          - calculations.program_posture
          - calculations.youth_risk_posture
        distinguishing_aspect: "Dispositioning the screening CLEARED fires the whole documented cascade in one request: the PENDING_SCREENING admission becomes ACTIVE with priority_score 23, the program takes a bed to utilization_bp 5000, a PENDING GuardianNotification appears with due_at exactly 24h after admitted_at, and the youth becomes SHELTERED with risk_posture RESTRICTED."
        test_recipe:
          setup:
            - "an OPEN EMERGENCY_SHELTER program with licensed_bed_capacity 2 and age band 12..17"
            - "youth Iris Vance, dob 2010-03-15 (age 16), zero outreach contacts and zero cumulative shelter nights, holding a PENDING_SCREENING admission"
            - "a SafetyScreening submitted by worker-1 with an empty indicator set, so score 0 and tier LOW"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { casc_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Iris", legal_last_name: "Vance", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { casc_youth_id: $.data.id }
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${casc_youth_id}", program_id: "${casc_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { casc_adm_id: $.data.id }
            - call: "POST /ryhs/youths/${casc_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { casc_scr_id: $.data.id }
          trigger:
            - call: "POST /ryhs/safety-screenings/${casc_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the request returns HTTP 200"
            - "SafetyScreening.${casc_scr_id}.status == CLEARED"
            - "SafetyScreening.${casc_scr_id}.screener_user_id == worker-1"
            - "SafetyScreening.${casc_scr_id}.disposition_user_id == admin-1"
            - "Admission.${casc_adm_id}.status == ACTIVE"
            - "Admission.${casc_adm_id}.admitted_at == 2026-08-01T00:00:00Z"
            - "Admission.${casc_adm_id}.priority_score == 23"
            - "ShelterProgram.${casc_program_id}.occupied_beds == 1"
            - "ShelterProgram.${casc_program_id}.utilization_bp == 5000"
            - "ShelterProgram.${casc_program_id}.posture == OPEN"
            - "GET /ryhs/admissions/${casc_adm_id}/guardian-notifications returns total_count 1 with status PENDING, attempt_count 0 and due_at 2026-08-02T00:00:00Z"
            - "Youth.${casc_youth_id}.status == SHELTERED"
            - "Youth.${casc_youth_id}.risk_posture == RESTRICTED"

      - name: guardian_notification_attempt_self_loop_overwrites_the_channel
        claim_type: valid_transition
        grounds:
          - state_machines.GuardianNotification.PENDING_to_ATTEMPTED
          - state_machines.GuardianNotification.ATTEMPTED_to_ATTEMPTED
          - endpoints[POST /ryhs/guardian-notifications/{id}/attempt]
        distinguishing_aspect: "The second attempt is an ATTEMPTED -> ATTEMPTED self-loop: attempt_count reaches 2, last_attempt_at advances to the new clock and attempt_channel is OVERWRITTEN with CERTIFIED_MAIL rather than appended, while the youth stays RESTRICTED because nothing is resolved."
        test_recipe:
          setup:
            - "an ACTIVE admission for a CLEARED youth at an OPEN shelter, so a PENDING GuardianNotification with attempt_count 0 exists"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { att_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Sasha", legal_last_name: "Byrne", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { att_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${att_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { att_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${att_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${att_youth_id}", program_id: "${att_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { att_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${att_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { att_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${att_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/guardian-notifications/${att_gn_id}/attempt"
              payload: { attempt_channel: "CERTIFIED_MAIL" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
          assert:
            - "the request returns HTTP 200"
            - "GuardianNotification.${att_gn_id}.status == ATTEMPTED"
            - "GuardianNotification.${att_gn_id}.attempt_count == 2"
            - "GuardianNotification.${att_gn_id}.attempt_channel == CERTIFIED_MAIL"
            - "GuardianNotification.${att_gn_id}.last_attempt_at == 2026-08-01T06:00:00Z"
            - "GuardianNotification.${att_gn_id}.resolved_at == null"
            - "Youth.${att_youth_id}.risk_posture == RESTRICTED"
            - "ShelterProgram.${att_program_id}.overdue_notification_count == 0"

      - name: notification_resolve_contacted_with_zero_attempts_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GuardianNotification.ATTEMPTED_to_CONTACTED
          - validations[priority=22]
          - errors.ERR_NOTIFICATION_UNSAFE_CONTACT
        distinguishing_aspect: "The ATTEMPTED -> CONTACTED precondition attempt_count >= 1 is enforced: resolving a never-attempted PENDING obligation as CONTACTED returns 422 ERR_NOTIFICATION_UNSAFE_CONTACT and leaves the youth RESTRICTED, so no TLP placement is unblocked."
        test_recipe:
          setup:
            - "an ACTIVE admission whose GuardianNotification is PENDING with attempt_count 0"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { unsafe_program_id: $.data.id }
