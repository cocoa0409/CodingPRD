      - name: component_patch_updates_only_the_supplied_field
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /nexus-components/{id}]
          - state_machines.NexusComponent.PENDING_to_PENDING
          - calculations.cost_per_demand_unit
        distinguishing_aspect: |
          PATCH is a partial update: sending planned_growth_share_bp alone must leave the ten
          other stored inputs byte-identical, recompute growth_demand_units (unchanged at
          1962.0000 because no growth input moved) and leave a never-allocated component in
          PENDING rather than marking it STALE. The follow-up allocate then proves the patch
          actually landed: 70% of 900000000 less 100000000 over 1962.0000 gives 270133
          (530000000/1962 = 270132.5, round_half_up) instead of the 247197 the original 6500
          bp produced.
        test_recipe:
          setup:
            - "A DRAFT PLAN_BASED study with a ROADS component created at planned_growth_share_bp 6500 and never allocated, so allocation_status is PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "ROADS", name: "Arterial Roads", demand_unit_label: "trip", existing_los_per_demand_unit: 0.0008, planned_los_per_demand_unit: 0.0006, unit_cost_cents: 250000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_roads_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_roads_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 200000, demand_units_per_dwelling: 1.0100, demand_units_per_1000_nonres_sqft: 3.7500, planned_facility_cost_cents: 900000000, planned_growth_share_bp: 6500, planned_capacity_demand_units: 2000, planned_other_funding_cents: 100000000, existing_tax_credit_per_unit_cents: 0 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_roads_id: $.data.id }
          trigger:
            - call: "PATCH /nexus-components/${comp_roads_id}"
              payload: { planned_growth_share_bp: 7000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "The PATCH returns HTTP 200 with planned_growth_share_bp 7000."
            - "Every other input is untouched: horizon_start_year 2026, horizon_end_year 2030, projected_new_dwelling_units 1200, projected_new_nonres_sqft 200000, demand_units_per_dwelling 1.0100, demand_units_per_1000_nonres_sqft 3.7500, planned_facility_cost_cents 900000000, planned_other_funding_cents 100000000, planned_capacity_demand_units 2000.0000, existing_tax_credit_per_unit_cents 0."
            - "growth_demand_units is still 1962.0000 and allocation_status is still 'PENDING' (NOT 'STALE') because the component had never been allocated; allocated_at stays null."
            - "The component version incremented by exactly one."
            - "The subsequent allocate returns plan_based_cost_per_unit_cents 270133 and adopted_cost_per_unit_cents 270133, proving the patched share was used; standard_based_cost_per_unit_cents is still 200000 and nexus_ratio is still 1.0194."

