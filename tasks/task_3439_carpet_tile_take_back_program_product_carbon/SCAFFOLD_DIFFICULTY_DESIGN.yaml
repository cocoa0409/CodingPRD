          setup:
            - "Collection CIR; batches DL-100 (100 m2) and DL-102 (100 m2, delta_e 0.5) RELEASED."
            - "Site budget exactly 60000 cents; zones Z-1 (DL-100) and Z-2 (DL-102), 50 m2 each."
            - "ORD-1 on Z-1 matches DL-100 itself (available 50 >= 50 exact fit; same dye lot -> factor 1.00): quote 60000. ORD-2 on Z-2 matches DL-102: quote 60000."
