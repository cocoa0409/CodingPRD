  - rule_id: non_linear_state_machine
    instances:
      - name: filing_revision_loop_cycle
        grounds:
          - state_machines.RateFiling.DISAPPROVED_to_DRAFT
          - state_machines.RateFiling.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Entity = RateFiling; shape = cyclic revision loop DRAFT -> SUBMITTED ->
          DISAPPROVED -> DRAFT -> SUBMITTED -> APPROVED -> EFFECTIVE (no cycle limit;
          the same filing object loops back to DRAFT and can reach EFFECTIVE).
        test_recipe:
          setup:
            - "carrier + program (PROPOSED) + guideline + allocation; filing F in DRAFT"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier NL1", naic_code: "NAIC-NL1", contact_email: "uw@nl1.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "NL1 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
          trigger:
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/disapprove", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/revise", payload: {}, as: MGAUnderwriter, captures: { st1: $.data.status } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { st2: $.data.status } }
          assert:
            - "after revise: status == DRAFT (cycle-back succeeded)"
            - "after second submit+approve+mark-effective: status == EFFECTIVE (loop terminates in EFFECTIVE, proving DRAFT re-entry is legal)"
            - "same filing id ${fil} throughout (cycle mutates one row; no new filing created)"

      - name: claim_reopen_cycle_bounded_count
        grounds:
          - state_machines.Claim.DENIED_to_REOPENED
          - state_machines.Claim.REOPENED_to_UNDER_REVIEW
          - validations[priority=10]
        distinguishing_aspect: |
          Entity = Claim (different from RateFiling); shape = cyclic loop DENIED ->
          REOPENED -> UNDER_REVIEW bounded by MAX_REOPENS = 2: the third reopen attempt
          fails with ERR_REOPEN_LIMIT_EXCEEDED while reopened_count stays 2.
