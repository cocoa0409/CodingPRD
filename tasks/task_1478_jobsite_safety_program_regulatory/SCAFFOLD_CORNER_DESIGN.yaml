            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "WEEKLY", due_date: "2026-08-10T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "three items" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "major item", severity: "MAJOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "minor item 1", severity: "MINOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "minor item 2", severity: "MINOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1", captures: { df2: "$.data.id" } }
            - { call: "POST /safety/subcontractors/${s}/probation-review", payload: { action: "DEMOTE" }, as: SafetyManager }
            - { call: "POST /safety/deficiencies/${df2}/submit-correction", payload: { correction_notes: "fixed" }, as: SubcontractorRep, as_user_id: "${s}" }
            - { call: "POST /safety/deficiencies/${df2}/verify", payload: { outcome: "CLOSED", disposition: "CONFIRMED" }, as: SafetyInspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /safety/subcontractors/${s}/probation-review", payload: { action: "RESTORE" }, as: SafetyManager, captures: { st: "$.data.standing", rt: "$.data.compliance_score_realtime" } }
          assert:
            - "HTTP 200 — RESTORE at realtime == 80 is allowed (inclusive >= 80)"
            - "Subcontractor.${s}.standing == GOOD_STANDING and compliance_score_realtime == 80"

  # =====================================================================
  # Section: endpoints (Table 5 claims)
  # =====================================================================
  - section: endpoints
    instances:
      - name: list_pagination_defaults_and_total_count
        claim_type: listing_pagination
        grounds:
          - response_envelope.pagination_defaults
          - response_envelope.pagination_fields
        distinguishing_aspect: "List envelope honors limit/offset with total_count and has_more: two projects, limit=1 -> page 1 has 1 item, total_count 2, has_more true; offset=1 returns the second project, has_more false."
        test_recipe:
          setup: ["two projects exist (created in a known order)"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "Alpha", location: "Seattle", annual_hours_worked: 10000 }, as: SafetyManager, captures: { p1: "$.data.id" } }
            - { call: "POST /safety/projects", payload: { name: "Beta", location: "Kent", annual_hours_worked: 20000 }, as: SafetyManager, captures: { p2: "$.data.id" } }
          trigger:
            - { call: "GET /safety/projects", payload: { limit: 1, offset: 0 }, as: ComplianceAuditor }
            - { call: "GET /safety/projects", payload: { limit: 1, offset: 1 }, as: ComplianceAuditor }
          assert:
            - "page 1: len(data) == 1, total_count == 2, has_more == true, data[0].id == ${p1}"
            - "page 2: len(data) == 1, total_count == 2, has_more == false, data[0].id == ${p2}"
            - "envelope contains meta.api_request_id and response_type == 'array'"

      - name: worker_filter_by_project_and_status
        claim_type: filtered_list
        grounds:
          - endpoints."GET /safety/workers"
        distinguishing_aspect: "Filtered list returns only workers of the requested project (FK reverse-reachability) and composes with the status filter."
        test_recipe:
          setup: ["projects p1, p2; one worker on each; p1's worker ORIENTED (plan active)"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Site A", location: "Seattle", annual_hours_worked: 10000 }, as: SafetyManager, captures: { p1: "$.data.id", p1_v: "$.data.version" } }
            - { call: "POST /safety/projects", payload: { name: "Site B", location: "Kent", annual_hours_worked: 10000 }, as: SafetyManager, captures: { p2: "$.data.id" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p1}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p1_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p1}", full_name: "D Esh", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w1: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p2}", full_name: "E Fry", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w2: "$.data.id" } }
            - { call: "POST /safety/workers/${w1}/complete-orientation", payload: {}, as: SiteSuperintendent }
          trigger:
            - { call: "GET /safety/workers", payload: { project_id: "${p1}" }, as: SafetyManager }
            - { call: "GET /safety/workers", payload: { project_id: "${p1}", status: "ORIENTED" }, as: SafetyManager }
            - { call: "GET /safety/workers", payload: { project_id: "${p1}", status: "CLEARED" }, as: SafetyManager }
          assert:
            - "project filter: total_count == 1 and data[0].id == ${w1}"
            - "status ORIENTED: total_count == 1"
            - "status CLEARED: total_count == 0 (empty array, not an error)"

  # =====================================================================
  # Section: errors (Table 6 claims — triggerability of the catalog)
  # =====================================================================
  - section: errors
    instances:
      - name: get_missing_worker_and_permit_return_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WORKER_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
        distinguishing_aspect: "Typed 404s for non-path-creation resources (worker, permit) spot-check the per-resource error catalog beyond the project case in the entities section."
        test_recipe:
          setup: ["one project exists"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "Existing", location: "Seattle", annual_hours_worked: 10000 }, as: SafetyManager }
          trigger:
            - { call: "GET /safety/workers/00000000-0000-0000-0000-000000000000", payload: {}, as: SafetyManager, captures: { err1: "$.data.error_id" } }
            - { call: "GET /safety/permits/00000000-0000-0000-0000-000000000000", payload: {}, as: SafetyManager, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_WORKER_NOT_FOUND (404)"
            - "err2 == ERR_PERMIT_NOT_FOUND (404)"

      - name: drug_test_window_past_32h_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DRUG_TEST_WINDOW_VIOLATION]
          - calculations.drug_test_window_compliance
        distinguishing_aspect: "Rejected side of the 32-hour window (complement to the accepted exact-boundary side in §1.8): collected_at at occurred_at + 33h fails with 422 and persists no record."
        test_recipe:
          setup: ["project; worker; incident occurred 2026-08-02T08:00:00Z"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Riverton", location: "Tukwila", annual_hours_worked: 27000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "F Gil", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${w}", incident_type: "INJURY", severity: "SERIOUS", occurred_at: "2026-08-02T08:00:00Z", work_related: true, description: "laceration" }, as: SiteSuperintendent, captures: { inc: "$.data.id" } }
          trigger:
            - { call: "POST /safety/drug-tests", payload: { worker_id: "${w}", test_type: "POST_INCIDENT", incident_id: "${inc}", collected_at: "2026-08-03T17:00:00Z" }, as: SafetyManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /safety/drug-tests", payload: { incident_id: "${inc}" }, as: SafetyManager }
          assert:
            - "error_id == ERR_DRUG_TEST_WINDOW_VIOLATION (422)"
            - "no DrugTestRecord persisted for incident ${inc} (list total_count == 0)"

      - name: permit_close_from_requested_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Permit.ISSUED_to_CLOSED
          - errors[ERR_PERMIT_INVALID_STATE]
        distinguishing_aspect: "close on a REQUESTED permit is an invalid-from rejection — only ISSUED permits can close."
        test_recipe:
          setup: ["project with ACTIVE plan; worker CLEARED; huddle CONDUCTED; JHA APPROVED; permit REQUESTED (never issued)"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Fauntleroy", location: "Seattle", annual_hours_worked: 19000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "G Hu", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "edge work" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w}"] }, as: SiteSuperintendent }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "edge", hazards: "fall", controls: "rails" }, as: SiteSuperintendent, captures: { j: "$.data.id" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "FALL_PROTECTION", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T16:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { pm: "$.data.id" } }
          trigger:
            - { call: "POST /safety/permits/${pm}/close", payload: {}, as: SiteSuperintendent, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PERMIT_INVALID_STATE (close requires ISSUED)"

      - name: deficiency_create_on_due_inspection_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INSPECTION_NOT_COMPLETED]
        distinguishing_aspect: "Deficiencies may only be logged against a COMPLETED inspection; a DUE inspection rejects with ERR_INSPECTION_NOT_COMPLETED (cross-entity state gate on Deficiency -> Inspection)."
        test_recipe:
          setup: ["project; inspection still DUE"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Arbor Heights", location: "Seattle", annual_hours_worked: 16000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "DAILY", due_date: "2026-08-05T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
          trigger:
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "premature", severity: "MINOR" }, as: SafetyInspector, as_user_id: "insp-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INSPECTION_NOT_COMPLETED (409)"

      - name: jha_approve_with_unconducted_huddle_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_HUDDLE_NOT_CONDUCTED]
        distinguishing_aspect: "JHA approve requires the linked huddle to be CONDUCTED; a SCHEDULED huddle rejects with ERR_HUDDLE_NOT_CONDUCTED (cross-entity state gate on JHA -> Huddle)."
        test_recipe:
          setup: ["project; huddle SCHEDULED (not conducted); JHA DRAFT linked to it"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "West Edge", location: "Seattle", annual_hours_worked: 14000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-02", topics: "demo" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "demo wall", hazards: "dust", controls: "water" }, as: SiteSuperintendent, captures: { j: "$.data.id" } }
          trigger:
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_HUDDLE_NOT_CONDUCTED (409)"
            - "JobHazardAnalysis.${j}.status remains DRAFT"

      - name: subcontractor_remove_from_good_standing_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Subcontractor.PROBATION_to_REMOVED
          - errors[ERR_SUBCONTRACTOR_INVALID_STANDING]
        distinguishing_aspect: "Removal authority requires PROBATION first: remove from GOOD_STANDING is rejected; the standing machine is two-step by design."
        test_recipe:
          setup: ["project; subcontractor in GOOD_STANDING (score 100)"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "Leschi", location: "Seattle", annual_hours_worked: 21000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/subcontractors", payload: { project_id: "${p}", company_name: "Amp", trade: "electrical" }, as: SafetyManager, captures: { s: "$.data.id" } }
          trigger:
            - { call: "POST /safety/subcontractors/${s}/remove", payload: { reason: "premature" }, as: SafetyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SUBCONTRACTOR_INVALID_STANDING (409)"
            - "Subcontractor.${s}.standing remains GOOD_STANDING"

      - name: deficiency_verify_from_open_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Deficiency.CORRECTION_SUBMITTED_to_VERIFIED_CLOSED
          - errors[ERR_DEFICIENCY_INVALID_STATE]
        distinguishing_aspect: "verify on an OPEN deficiency (correction never submitted) is an invalid-from rejection."
        test_recipe:
          setup: ["project; inspection COMPLETED; deficiency OPEN"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Madison Park", location: "Seattle", annual_hours_worked: 11000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "DAILY", due_date: "2026-08-05T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "cord" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "frayed cord", severity: "MINOR" }, as: SafetyInspector, as_user_id: "insp-1", captures: { df: "$.data.id" } }
          trigger:
            - { call: "POST /safety/deficiencies/${df}/verify", payload: { outcome: "CLOSED", disposition: "CONFIRMED" }, as: SafetyInspector, as_user_id: "insp-2", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DEFICIENCY_INVALID_STATE (verify requires CORRECTION_SUBMITTED)"

      - name: incident_determination_before_investigation_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Incident.UNDER_INVESTIGATION_to_DETERMINATION_MADE
          - errors[ERR_INCIDENT_INVALID_STATE]
        distinguishing_aspect: "The incident pipeline cannot skip investigate: determination on a REPORTED incident is rejected."
        test_recipe:
          setup: ["project; worker; incident REPORTED only"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Brighton", location: "Seattle", annual_hours_worked: 13000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "H Ito", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${w}", incident_type: "INJURY", severity: "MINOR", occurred_at: "2026-08-02T08:00:00Z", work_related: true, description: "bruise" }, as: SiteSuperintendent, captures: { inc: "$.data.id" } }
          trigger:
            - { call: "POST /safety/incidents/${inc}/determination", payload: { medical_treatment_beyond_first_aid: false, days_away_from_work: 0, restricted_duty: false, loss_of_consciousness: false, significant_diagnosis: false }, as: SafetyManager, as_user_id: "sm-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INCIDENT_INVALID_STATE (determination requires UNDER_INVESTIGATION)"

      - name: worker_suspend_from_pending_orientation_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Worker.ORIENTED_to_SUSPENDED
          - state_machines.Worker.CLEARED_to_SUSPENDED
          - errors[ERR_WORKER_INVALID_STATE]
        distinguishing_aspect: "suspend on a PENDING_ORIENTATION worker is an invalid-from rejection (the machine has no PENDING_ORIENTATION -> SUSPENDED edge)."
        test_recipe:
          setup: ["project; worker PENDING_ORIENTATION"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "Dunlap", location: "Seattle", annual_hours_worked: 7000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "I Jung", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
          trigger:
            - { call: "POST /safety/workers/${w}/suspend", payload: { reason: "too early" }, as: SafetyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_WORKER_INVALID_STATE"

      - name: error_permit_time_conflict_excavation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PERMIT_TIME_CONFLICT]
        excluded_because:
          difficulty_instance: excavation_adjacency_allowed_overlap_rejected
          rationale: "Asserted as the failure path of the named §1.8 instance (overlapping permit C)."

      - name: error_jha_not_approved_on_permit_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_JHA_NOT_APPROVED]
        excluded_because:
          difficulty_instance: permit_create_requires_jha_approved
          rationale: "Asserted as the first trigger of the named §1.8 instance."

      - name: error_training_requirement_on_clear
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TRAINING_REQUIREMENT_NOT_MET]
        excluded_because:
          difficulty_instance: worker_clear_requires_verified_cert
          rationale: "Asserted as the first trigger of the named §1.8 instance."

      - name: error_score_threshold_demote
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SCORE_THRESHOLD_NOT_MET]
        excluded_because:
          difficulty_instance: score_threshold_exactly_80_demote_rejected
          rationale: "Asserted as the trigger of the named §1.8 instance."

      - name: error_permit_invalid_state_under_frozen_posture
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PERMIT_INVALID_STATE]
          - errors[ERR_PROJECT_POSTURE_BLOCKED]
        excluded_because:
          difficulty_instance: permit_issue_state_vs_posture_priority
          rationale: "Asserted as the dual-failure priority outcome of the named §1.8 instance."

      - name: worker_suspension_cascade_reason_stamp
        claim_type: cross_entity_side_effect
        grounds:
          - state_machines.Worker.CLEARED_to_SUSPENDED
        excluded_because:
          difficulty_instance: positive_drug_test_suspension_cascade
          rationale: "Worker SUSPENDED with reason POSITIVE_DRUG_TEST and the permit/JHA cascade are asserted in the named §1.8 instance."

  # =====================================================================
  # Section: rbac (Table 7 claims)
  # =====================================================================
  - section: rbac
    instances:
      - name: subcontractor_rep_cannot_create_permits
        claim_type: role_denial
        grounds:
          - roles.SubcontractorRep
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Role check fires at priority 2, before existence/shape checks: SubcontractorRep calling POST /safety/permits is denied with 403 even with a minimal body."
        test_recipe:
          setup: ["project and subcontractor exist (the rep's identity is a real Subcontractor id)"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "North Beach", location: "Seattle", annual_hours_worked: 5000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/subcontractors", payload: { project_id: "${p}", company_name: "Amp", trade: "electrical" }, as: SafetyManager, captures: { s: "$.data.id" } }
          trigger:
            - { call: "POST /safety/permits", payload: {}, as: SubcontractorRep, as_user_id: "${s}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: site_superintendent_cannot_issue_permit
        claim_type: role_denial
        grounds:
          - roles.SiteSuperintendent
          - roles.SafetyManager
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Permit issuance is SafetyManager-exclusive: the superintendent who requested the permit cannot also issue it (peer-role separation on the permit lifecycle)."
        test_recipe:
          setup: ["project exists (role check precedes existence, so a placeholder permit id suffices)"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "North Beach 2", location: "Seattle", annual_hours_worked: 5000 }, as: SafetyManager }
          trigger:
            - { call: "POST /safety/permits/00000000-0000-0000-0000-000000000000/issue", payload: {}, as: SiteSuperintendent, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS (priority 2 fires before the 404 existence check)"

      - name: compliance_auditor_read_only_enforced
        claim_type: role_denial_and_allowance
        grounds:
          - roles.ComplianceAuditor
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "ComplianceAuditor is denied on every write (project create shown) but allowed on the auditor-only reads (drug test list and osha-summary)."
        test_recipe:
          setup: ["project with 200000 hours exists (no incidents needed — summary over an empty year is valid)"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Audit Site", location: "Seattle", annual_hours_worked: 200000 }, as: SafetyManager, captures: { p: "$.data.id" } }
          trigger:
            - { call: "POST /safety/projects", payload: { name: "Denied", location: "X", annual_hours_worked: 1 }, as: ComplianceAuditor, captures: { err: "$.data.error_id" } }
            - { call: "GET /safety/drug-tests", payload: {}, as: ComplianceAuditor }
            - { call: "GET /safety/projects/${p}/osha-summary", payload: { year: 2026 }, as: ComplianceAuditor, captures: { trir: "$.data.trir_final" } }
          assert:
            - "write: HTTP 403 ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /safety/drug-tests: HTTP 200 (auditor-only read)"
            - "GET osha-summary: HTTP 200, trir_final == 0.0 over an empty incident year"

  # =====================================================================
  # Section: cross_cutting_layers (complexity-profile layer claims)
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_project_version_on_second_activation
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[safety-plan-activate-stale-project]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Project.version: after plan A activates (bumping the project version), activating plan B with the pre-activation version is rejected 412 ERR_STALE_VERSION; re-reading and retrying with the fresh version succeeds and supersedes plan A."
        test_recipe:
          setup: ["project (version captured at creation); DRAFT plans A and B"]
          setup_api_calls:
            - { call: "POST /safety/projects", payload: { name: "Capitol Hill", location: "Seattle", annual_hours_worked: 80000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { plA: "$.data.id" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-09-01" }, as: SafetyManager, captures: { plB: "$.data.id" } }
          trigger:
            - { call: "POST /safety/safety-plans/${plA}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager, captures: { a_st: "$.data.status" } }
            - { call: "POST /safety/safety-plans/${plB}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /safety/projects/${p}", payload: {}, as: SafetyManager, captures: { p_v2: "$.data.version", cap: "$.data.current_active_plan_id" } }
            - { call: "POST /safety/safety-plans/${plB}/activate", payload: { expected_project_version: "${p_v2}" }, as: SafetyManager, captures: { b_st: "$.data.status" } }
            - { call: "GET /safety/safety-plans/${plA}", payload: {}, as: SafetyManager, captures: { a_st2: "$.data.status" } }
          assert:
            - "plan A activation succeeds with version ${p_v}: status == ACTIVE"
            - "plan B activation with the SAME captured version ${p_v}: HTTP 412 ERR_STALE_VERSION"
            - "after re-read, Project.version == ${p_v} + 1 and current_active_plan_id == ${plA}"
            - "plan B retry with fresh version: status == ACTIVE"
            - "plan A is then SUPERSEDED (automatic supersede side effect)"

      - name: posture_auto_lifts_but_permits_need_manual_reinstate
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.project_posture
          - state_machines.Permit.SUSPENDED_to_ISSUED
        distinguishing_aspect: "Derived-field reconciliation on incident close: closing the CRITICAL incident lifts posture back to NORMAL automatically, but the cascade-SUSPENDED permit stays SUSPENDED until explicitly reinstated (no automatic reversal of the cascade)."
        test_recipe:
          setup: ["project with ACTIVE plan; worker CLEARED; JHA APPROVED; permit ISSUED; CRITICAL incident (no worker, PROPERTY_DAMAGE) froze posture and suspended the permit; incident investigated and determined non-recordable"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Queen Anne", location: "Seattle", annual_hours_worked: 66000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "J Fox", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "rigging" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w}"] }, as: SiteSuperintendent }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "steel set", hazards: "crush", controls: "tag lines" }, as: SiteSuperintendent, captures: { j: "$.data.id" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "FALL_PROTECTION", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T16:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { pm: "$.data.id" } }
            - { call: "POST /safety/permits/${pm}/issue", payload: {}, as: SafetyManager }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", incident_type: "PROPERTY_DAMAGE", severity: "CRITICAL", occurred_at: "2026-08-02T10:00:00Z", work_related: true, description: "crane struck facade; no worker involved" }, as: SiteSuperintendent, captures: { inc: "$.data.id" } }
            - { call: "POST /safety/incidents/${inc}/investigate", payload: { investigation_notes: "operator error" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/incidents/${inc}/determination", payload: { medical_treatment_beyond_first_aid: false, days_away_from_work: 0, restricted_duty: false, loss_of_consciousness: false, significant_diagnosis: false }, as: SafetyManager, as_user_id: "sm-1" }
          trigger:
            - { call: "POST /safety/incidents/${inc}/close", payload: {}, as: SafetyManager, captures: { inc_st: "$.data.status" } }
            - { call: "GET /safety/projects/${p}", payload: {}, as: SafetyManager, captures: { posture: "$.data.safety_posture" } }
            - { call: "GET /safety/permits/${pm}", payload: {}, as: SafetyManager, captures: { pm_s: "$.data.status" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits/${pm}/reinstate", payload: {}, as: SafetyManager, captures: { pm_s2: "$.data.status" } }
          assert:
            - "after incident close: Incident.${inc}.status == CLOSED and Project.${p}.safety_posture == NORMAL (derived field reconciled)"
            - "Permit.${pm}.status == SUSPENDED still (cascade has no automatic reversal)"
            - "after JHA re-approve + explicit reinstate: Permit.${pm}.status == ISSUED"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_in_response_and_next_read
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - entities.Deficiency.fields.due_at
        distinguishing_aspect: "Immediate consistency: the deficiency-create response already carries the SLA-computed due_at (created_at + 72h for CRITICAL), and the very next project read reflects the incremented open_deficiency_count — no lag, no refresh endpoint."
        test_recipe:
          setup: ["project; inspection COMPLETED at clock 2026-08-01T08:00:00Z"]
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Phinney", location: "Seattle", annual_hours_worked: 17000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "DAILY", due_date: "2026-08-05T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "electrical" }, as: SafetyInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "exposed wiring", severity: "CRITICAL" }, as: SafetyInspector, as_user_id: "insp-1", captures: { df: "$.data.id", due: "$.data.due_at", st: "$.data.status" } }
            - { call: "GET /safety/projects/${p}", payload: {}, as: SafetyManager, captures: { odc: "$.data.open_deficiency_count" } }
          assert:
            - "Deficiency.${df}.due_at == 2026-08-04T08:00:00Z (created_at + 3 days CRITICAL SLA) in the create response"
            - "Deficiency.${df}.status == OPEN"
            - "Project.${p}.open_deficiency_count == 1 on the immediately-following read"
