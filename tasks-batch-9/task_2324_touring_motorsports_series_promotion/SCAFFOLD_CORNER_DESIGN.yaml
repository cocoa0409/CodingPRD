          setup:
            - "One Season with two accepted bookings: ATL for 2026-11-14 and DAL for 2026-12-05"
            - "The ATL stop is fully prepared (segment, tier GA 3200/500, CERTIFIED plan at 1200/6/1/2/1/1, RADIO 500000), taken ON_SALE, sells 100 seats PAID, then sales CLOSED"
