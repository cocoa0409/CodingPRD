          trigger:
            - call: "POST /radio-system/agencies/${agency_s_id}/fee-assessments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_agency_version: "${agency_s_v}" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies/${agency_s_id}/payments"
              payload: { amount_cents: 3400 }
              as: AgencyRadioManager
              as_user_id: "${agency_s_id}"
            - call: "POST /radio-system/agencies/${agency_s_id}/payments"
              payload: { amount_cents: 5000 }
              as: AgencyRadioManager
              as_user_id: "${agency_s_id}"
            - call: "POST /radio-system/agencies/${agency_s_id}/payments"
              payload: { amount_cents: 1 }
              as: AgencyRadioManager
              as_user_id: "${agency_s_id}"
              captures: { overpayment_error_id: "$.data.error_id" }
          assert:
            - "After trigger[0]: MemberAgency.${agency_s_id}.last_assessed_fee_cents == 8400 (SNAPSHOT: 2 units x TIER_1_RATE_CENTS 4200, no surcharge, no late fee)"
