  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_buffered_halfopen_overlap_rejected
        grounds:
          - validations[priority=10]
          - calculations.appointment_overlap_check
          - entities.Appointment.fields.start_utc
          - errors[ERR_APPOINTMENT_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN + 15-min BUFFER geometry on the Appointment resource (counselor calendar): an existing
          09:00-10:00 appointment makes a new 10:10-10:40 booking conflict (gap 10 min < the 15-min buffer),
          rejected with ERR_APPOINTMENT_OVERLAP.
        test_recipe:
          setup:
            - "s15 of c15 has a BOOKED appointment 2026-05-01T09:00Z-10:00Z"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C 15", email: "c15@x.com", hourly_rate_cents: 18000 }
