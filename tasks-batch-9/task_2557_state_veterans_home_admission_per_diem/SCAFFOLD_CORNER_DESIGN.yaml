            - call: "POST /svh/veterans-homes/${home_id}/recognition"
              payload: { action: "RESTORE", effective_date: "2026-08-01" }
              as: StateProgramAdmin
              captures: { hv4: "$.data.version", hstat4: "$.data.recognition_status", hreason4: "$.data.recognition_suspended_reason", hdecert4: "$.data.decertified_unit_count" }
          assert:
            - "hv0 == 1"
            - "hstat0 == RECOGNIZED"
            - "nuv == 1"
            - "hv1 == 2"
            - "duv == 1"
            - "hv2 == 3"
            - "hv2_again == 3"
            - "hv3 == 4"
            - "hstat3 == SUSPENDED"
            - "hreason3 == UNIT_DECERTIFIED"
            - "hv4 == 5"
            - "hstat4 == RECOGNIZED"
            - "hreason4 == null"
            - "hdecert4 == 0"

      - name: layer_cascading_side_effects_stops_inside_the_conditional_band
        claim_type: cascading_side_effects
        grounds:
          - calculations.survey_compliance_score
          - calculations.care_unit_operational_posture
          - validations[priority=70,ERR_UNIT_NOT_CERTIFIED]
          - endpoints[POST /svh/care-units/{id}/survey-result].side_effects
        distinguishing_aspect: |
          One ISOLATED x MINIMAL deficiency scores exactly 1, which is exactly
          CERTIFICATION_CONDITIONAL_THRESHOLD, so the unit lands CONDITIONAL and its posture becomes
          RESTRICTED - and the cascade stops dead there: no waitlist row is cancelled, decertified_unit_count
          stays 0, recognition stays RECOGNIZED, and both homes' and the unit's last_survey_date are stamped.
          A CONDITIONAL unit still fails the admission decision, but at the certification rung 70
          (ERR_UNIT_NOT_CERTIFIED, which demands == CERTIFIED) rather than the posture rung 72 or the bed rung
          90 - both beds are free - while a NEW waitlist entry is still accepted because that check only
          demands != DECERTIFIED. A clean re-survey scores 0, returns the unit to CERTIFIED and OPEN, and the
          identical admission then succeeds.
