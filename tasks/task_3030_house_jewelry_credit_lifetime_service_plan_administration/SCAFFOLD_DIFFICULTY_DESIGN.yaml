# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3030_house_jewelry_credit_lifetime_service_plan_administration
#
# Nine §0.5 Difficulty Rules, exactly two instances each (≥18 instances).
# Every `grounds:` entry resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every `${var}` is bound by a `captures:` on an earlier line of the same
# instance; every `captures:` JSONPath names a field §1.5 declares.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      # --- Instance 1: same inputs, two valid algorithms, different CENTS on
      #     the Repair loss-liability aggregate (a repair-desk metric) ---
      - name: repair_liability_net_reserve_vs_gross_reserve_divergence
        grounds:
          - calculations.repair_loss_liability
          - entities.Repair.fields.loss_liability_cents
          - entities.Repair.fields.store_absorbed_cents
          - validations[priority=16]
        distinguishing_aspect: "Repair is a repair-desk cost-accounting subject: on identical declared_parts_cents=40000, declared_labor_cents=15000, stone_limit_labor_cents=25000 and declared_loss_liability_cents=5000 the NET_RESERVE variant yields store_absorbed_cents and loss_liability_cents 35000 while GROSS_RESERVE yields 38850, a 3850 cent divergence produced purely by whether the warranty reserve is taken on parts alone or on parts plus labor."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store 0142 OPEN, TX, credit_capacity_cents 5000000. Customer Nina created. Natural 0.90ct diamond D1 with no origin_registry. Bundle BUNDLE_180 registered with lifetime_plan_fee_cents 19900, stone_limit_labor_cents 25000, stone_limit_parts_cents 60000, inspection_interval_days 180, inspection_cure_days 30. TX regulation registered. Purchase P1 opened at 450018 and completed, so D1's owner is Nina."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
            - call: "POST /customers"
              payload: { full_name: "Nina Ortiz", email: "nina.ortiz@example.com", state_code: "TX" }
              as: SalesAssociate
              captures: { customer_id: $.data.id }
            - call: "POST /diamonds"
              payload: { stone_code: "ST-0001", stone_kind: "NATURAL", carat: 0.90 }
              as: SalesAssociate
              captures: { diamond_id: $.data.id }
            - call: "POST /protection-bundles"
              payload: { bundle_code: "BUNDLE_180", display_name: "Lifetime Diamond 180", lifetime_plan_fee_cents: 19900, stone_limit_labor_cents: 25000, stone_limit_parts_cents: 60000, inspection_interval_days: 180, inspection_cure_days: 30 }
              as: ChainAdmin
              captures: { bundle_id: $.data.id }
            - call: "POST /service-plan-regulations"
              payload: { state_code: "TX", max_plan_term_months: 60, inspection_required_months: 6, lapse_cure_days: 30, replacement_plus_pct: 1.0, max_inspection_gap_days: 210 }
              as: ChainAdmin
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450018, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id }
            - call: "POST /purchases/${purchase_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /service-plan-registrations"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", diamond_id: "${diamond_id}", store_id: "${store_id}", bundle_id: "${bundle_id}", plan_term_months: 24 }
              as: StoreManager
              captures: { registration_id: $.data.id }
            - call: "POST /service-plan-registrations/${registration_id}/exams"
              payload: { visit_at: "2026-09-10T00:00:00Z", result: "CLAIMED" }
              as: StoreManager
              captures: { registration_v: $.data.version }
          trigger:
            - call: "POST /repairs"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", diamond_id: "${diamond_id}", registration_id: "${registration_id}", failure_class: "SETTING", declared_parts_cents: 40000, declared_labor_cents: 15000, declared_loss_liability_cents: 5000 }
              as: StoreManager
              captures: { repair_id: $.data.id }
          assert:
            - "the NET_RESERVE variant result is Repair.${repair_id}.loss_liability_cents == 35000"
            - "the NET_RESERVE variant result is Repair.${repair_id}.store_absorbed_cents == 35000"
            - "the NET_RESERVE variant result is Repair.${repair_id}.reserve_cents == 2800"
            - "Repair.${repair_id}.insurance_parts_cents == 37200 and customer_parts_cents == 2800"
            - "the GROSS_RESERVE variant would give loss_liability_cents == 38850, so the two valid interpretations differ by exactly 3850 cents on identical inputs"
            - "Repair.${repair_id}.repair_status == INTAKE"

      # --- Instance 2: same inputs, two valid algorithms, different CENTS on
      #     the Customer-level statement rollup (a billing metric) ---
      - name: statement_rollup_sum_then_tier_vs_per_line_tier_divergence
        grounds:
          - calculations.statement_balance_rollup
          - entities.BillingStatement.fields.statement_balance_cents
          - entities.BillingStatement.fields.bucket_totals_cents
          - validations[priority=25]
        distinguishing_aspect: "BillingStatement is a customer-billing subject, distinct from the repair-desk Repair subject of the sibling instance: for the line set (250000 at billable_pct 1.0, 260000 at billable_pct 1.0) SUM_THEN_TIER yields statement_balance_cents == 525300 while PER_LINE_TIER yields 522800, a 2500 cent divergence caused only by whether the tier threshold is crossed on the aggregate or per line."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store 0142 OPEN and ACTIVE. Customer Nina. Registry rows TX TIER_3 and TX TIER_2 registered. Application APP3 for 600000 approved at TIER_3 giving standalone_credit_limit_cents 750000."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
            - call: "POST /customers"
              payload: { full_name: "Nina Ortiz", email: "nina.ortiz@example.com", state_code: "TX" }
              as: SalesAssociate
              captures: { customer_id: $.data.id }
            - call: "POST /credit-limit-registry-state"
              payload: { registry_key: "TX", credit_tier: "TIER_3", base_limit_cents: 750000, min_down_payment_pct: 0.10, registry_type: "STATE", min_ticket_cents: 200000 }
              as: ChainAdmin
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 600000, requested_purchase_amount_cents: 600000, down_payment_cents: 60000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
          trigger:
            - call: "POST /billing-statements"
              payload: { customer_id: "${customer_id}", statement_period: "2026-09", lines: [{ amount_cents: 250000, billable_pct: 1.0, line_status: "BILLABLE" }, { amount_cents: 260000, billable_pct: 1.0, line_status: "BILLABLE" }] }
              as: CustomerService
              captures: { statement_id: $.data.id }
          assert:
            - "the SUM_THEN_TIER variant result is BillingStatement.${statement_id}.statement_balance_cents == 525300"
            - "the PER_LINE_TIER variant would give statement_balance_cents == 522800"
            - "the two valid interpretations differ by exactly 2500 cents on identical line sets"
            - "BillingStatement.${statement_id}.min_payment_due_cents == 5000 (the floor binds, since no payment was allocated)"
            - "BillingStatement.${statement_id}.statement_status == OPEN"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      # --- Instance 1: mode (b) nested rounding where the order matters ---
      - name: trade_up_credit_single_round_vs_per_component_round
        grounds:
          - calculations.trade_up_credit_basis
          - calculations.balance_due_after_trade_up
          - entities.Purchase.fields.trade_up_credit_cents
          - entities.Purchase.fields.net_amount_cents
        distinguishing_aspect: "Mode (b): the formula pins the rounding order explicitly — SINGLE_ROUND rounds once over credited_base = origin.base_price_cents + round(trade_up_credit_cents x 0.10), while PER_COMPONENT_ROUND rounds each of the base and bonus components at 85% independently; for origin.base_price_cents == 450018 and origin.trade_up_credit_cents == 10050 the two orders differ by 1 cent (383370 vs 383369), and the scaffold pins SINGLE_ROUND as authoritative."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store 0142 OPEN and ACTIVE. Customer Nina AT status OPEN via an approved application. Stones ST-0001 and ST-0002 registered. Origin purchase P1 ticketed at 450018 and completed. New purchase P2 ticketed at 900000 and naming P1 as its origin."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
            - call: "POST /customers"
              payload: { full_name: "Nina Ortiz", email: "nina.ortiz@example.com", state_code: "TX" }
              as: SalesAssociate
              captures: { customer_id: $.data.id }
            - call: "POST /credit-limit-registry-state"
              payload: { registry_key: "TX", credit_tier: "TIER_3", base_limit_cents: 2000000, min_down_payment_pct: 0.10, registry_type: "STATE", min_ticket_cents: 200000 }
              as: ChainAdmin
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 900000, down_payment_cents: 90000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /diamonds"
              payload: { stone_code: "ST-0001", stone_kind: "NATURAL", carat: 0.90 }
              as: SalesAssociate
              captures: { origin_diamond_id: $.data.id }
            - call: "POST /diamonds"
              payload: { stone_code: "ST-0002", stone_kind: "NATURAL", carat: 1.25, origin_registry: "KIMBERLEY-TX-9911" }
              as: SalesAssociate
              captures: { new_diamond_id: $.data.id }
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450018, diamond_id: "${origin_diamond_id}" }
              as: SalesAssociate
              captures: { origin_purchase_id: $.data.id }
            - call: "POST /purchases/${origin_purchase_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /purchases/${origin_purchase_id}/trade-up-credit"
              payload: { additional_credit_cents: 10050 }
              as: CustomerService
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 900100, diamond_id: "${new_diamond_id}", origin_purchase_id: "${origin_purchase_id}" }
              as: SalesAssociate
              captures: { new_purchase_id: $.data.id }
          trigger:
            - call: "GET /purchases/${new_purchase_id}/trade-up-preview"
              payload: {}
              as: SalesAssociate
              captures: { preview_credit: $.data.trade_up_credit_cents }
          assert:
            - "Purchase.${new_purchase_id}.trade_up_credit_cents == 383370 (the pinned SINGLE_ROUND order)"
            - "the PER_COMPONENT_ROUND order would give 383369, so the pinned rounding order is load-bearing to the cent"
            - "preview_credit == 383370"
            - "Purchase.${new_purchase_id}.net_amount_cents == 516730"
            - "Purchase.${new_purchase_id}.trade_up_floor_cents == 900036 and the ticket at 900100 clears it by exactly 64 cents"

      # --- Instance 2: mode (c) circular-looking dependency with pinned
      #     evaluation order (fee keyed on the total it is part of) ---
      - name: design_cancellation_fee_depends_on_deposit_and_revision_order
        grounds:
          - calculations.custom_design_deposit_and_forfeit
          - entities.CustomDesignOrder.fields.cancellation_fee_cents
          - entities.CustomDesignOrder.fields.non_refundable_deposit_cents
          - calculations.credit_tier_from_plan_mix_and_inspection_streak
        distinguishing_aspect: "Mode (c): cancellation_fee_cents appears to depend on a total that itself contains it — the pinned evaluation order is (1) deposit_cents stamped at submit from the estimate, (2) revision_fee_cents accumulated from the free-revision counter, (3) costs_incurred_cents = deposit_cents + revision_fee_cents - material_recovery_cents, (4) cancellation_fee_cents = min(deposit_cents, costs_incurred_cents) bounded by the deposit; evaluating the fee before the revision counter produces the wrong cents, and no fixed-point iteration is needed once the order is pinned."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store 0142 OPEN and ACTIVE. Customer Nina opens a custom commission at estimate 250000 with deposit_pct 0.40, then requests three CAD revisions and has the CAD approved and production started."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
            - call: "POST /customers"
              payload: { full_name: "Nina Ortiz", email: "nina.ortiz@example.com", state_code: "TX" }
              as: SalesAssociate
              captures: { customer_id: $.data.id }
            - call: "POST /custom-design-orders"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", estimate_amount_cents: 250000, deposit_pct: 0.40 }
              as: SalesAssociate
              captures: { design_id: $.data.id }
            - call: "POST /custom-design-orders/${design_id}/revisions"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /custom-design-orders/${design_id}/revisions"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /custom-design-orders/${design_id}/revisions"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /custom-design-orders/${design_id}/cad-approval"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /custom-design-orders/${design_id}/start-production"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /custom-design-orders/${design_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
              captures: { design_v: $.data.version }
          assert:
            - "CustomDesignOrder.${design_id}.deposit_cents == 100000 (round(250000 x 0.40), stamped at submit and never recomputed)"
            - "CustomDesignOrder.${design_id}.revision_fee_cents == 2500 (only the third revision is charged, at CAD_REVISION_FEE_CENTS 2500)"
            - "CustomDesignOrder.${design_id}.cancellation_fee_cents == 100000 because costs_incurred_cents 82500 is below the deposit, so the deposit bounds the forfeit"
            - "CustomDesignOrder.${design_id}.non_refundable_deposit_cents == 100000 and refundable_deposit_cents == 0"
            - "CustomDesignOrder.${design_id}.design_status == CANCELLED"
            - "evaluating the fee before the revision counter would give cancellation_fee_cents == 2000, so the pinned evaluation order is observable"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      # --- Instance 1: cyclic machine on PromotionalPlan ---
      - name: promotional_plan_default_reinstate_cycle_and_parallel_status
        grounds:
          - state_machines.PromotionalPlan.DEFAULTED_to_ACCRUING
          - state_machines.PromotionalPlan.ACCRUING_to_PAID
          - entities.PromotionalPlan.fields.plan_status
          - calculations.credit_tier_from_plan_mix_and_inspection_streak
        distinguishing_aspect: "PromotionalPlan is a cyclic machine — ACCRUING -> DEFAULTED -> ACCRUING is reachable through POST /promotional-plans/{id}/reinstate — and additionally carries two independent state dimensions on the same row (plan_status ordered by the deferral clock, and the derived final_settlement_amount_cents whose meaning flips at CAPITALIZED), which no linear A->B->C pipeline exhibits."
        test_recipe:
          setup:
            - "Logical clock advanced past the promo simplicity window plus 90 days. Store 0142 OPEN and ACTIVE. Customer Nina OPEN with an approved application. Purchase P1 at 450018 completed and financed by a PROMO_12_6M plan P."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
            - call: "POST /customers"
              payload: { full_name: "Nina Ortiz", email: "nina.ortiz@example.com", state_code: "TX" }
              as: SalesAssociate
              captures: { customer_id: $.data.id }
            - call: "POST /credit-limit-registry-state"
              payload: { registry_key: "TX", credit_tier: "TIER_3", base_limit_cents: 2000000, min_down_payment_pct: 0.10, registry_type: "STATE", min_ticket_cents: 200000 }
              as: ChainAdmin
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 450018, down_payment_cents: 45002 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /diamonds"
              payload: { stone_code: "ST-0007", stone_kind: "NATURAL", carat: 1.10, origin_registry: "KIMBERLEY-TX-4242" }
              as: SalesAssociate
              captures: { diamond_id: $.data.id }
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450018, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, purchase_v: $.data.version }
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${purchase_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-15T00:00:00Z" }
              as: ChainAdmin
            - call: "POST /plans/default-due"
              payload: {}
              as: CreditAnalyst
            - call: "GET /promotional-plans/${plan_id}"
              payload: {}
              as: CreditAnalyst
              captures: { defaulted_v: $.data.version }
          trigger:
            - call: "POST /promotional-plans/${plan_id}/reinstate"
              payload: { expected_plan_version: "${defaulted_v}" }
              as: CreditAnalyst
              captures: { plan_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-20T00:00:00Z" }
              as: ChainAdmin
            - call: "POST /promotional-plans/${plan_id}/payoff"
              payload: { amount_cents: 515220, expected_plan_version: "${plan_v2}" }
              as: CustomerService
          assert:
            - "after the sweep PromotionalPlan.${plan_id}.plan_status == DEFAULTED and Customer.${customer_id}.account_status == SUSPENDED"
            - "after reinstate PromotionalPlan.${plan_id}.plan_status == ACCRUING again, proving the cycle DEFAULTED -> ACCRUING is reachable"
            - "after reinstate Customer.${customer_id}.account_status == OPEN"
            - "after the payoff PromotionalPlan.${plan_id}.plan_status == PAID and paid_at is non-null"
            - "PromotionalPlan.${plan_id}.deferred_interest_accrued_cents == 0 and merchant_deferral_fee_cents == 0 once PAID"
            - "PromotionalPlan.${plan_id}.final_settlement_amount_cents == 0 while it read 515220 before the payoff, showing the same field changes meaning across the CAPITALIZED/PAID dimension"

      # --- Instance 2: cyclic machine on ServicePlanRegistration ---
      - name: registration_lapse_renew_relapse_cycle_with_branching_grace_path
        grounds:
          - state_machines.ServicePlanRegistration.LAPSED_to_RENEWED
          - state_machines.ServicePlanRegistration.REMINDER_ISSUED_to_GRACE_PERIOD
          - state_machines.ServicePlanRegistration.RENEWED_to_PENDING_INSPECTION
          - entities.ServicePlanRegistration.fields.missed_inspection_count
        distinguishing_aspect: "ServicePlanRegistration is a cyclic machine on an entity other than PromotionalPlan — ACTIVE -> REMINDER_ISSUED -> LAPSED -> RENEWED -> PENDING_INSPECTION -> ACTIVE is a full loop — and its ACTIVE branch forks on visit_at against inspection_due_at into ACTIVE (timely) or GRACE_PERIOD (cured late), so the same trigger produces two different side-effect sets."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store 0142 OPEN and ACTIVE. Customer Nina with OWN diamond and an active registration R whose first inspection has already been claimed."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
            - call: "POST /customers"
              payload: { full_name: "Nina Ortiz", email: "nina.ortiz@example.com", state_code: "TX" }
              as: SalesAssociate
              captures: { customer_id: $.data.id }
            - call: "POST /diamonds"
              payload: { stone_code: "ST-0011", stone_kind: "NATURAL", carat: 0.95 }
              as: SalesAssociate
              captures: { diamond_id: $.data.id }
            - call: "POST /protection-bundles"
              payload: { bundle_code: "BUNDLE_180", display_name: "Lifetime Diamond 180", lifetime_plan_fee_cents: 19900, stone_limit_labor_cents: 25000, stone_limit_parts_cents: 60000, inspection_interval_days: 180, inspection_cure_days: 30 }
              as: ChainAdmin
              captures: { bundle_id: $.data.id }
            - call: "POST /service-plan-regulations"
              payload: { state_code: "TX", max_plan_term_months: 60, inspection_required_months: 6, lapse_cure_days: 30, replacement_plus_pct: 1.0, max_inspection_gap_days: 210 }
              as: ChainAdmin
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 380000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id }
            - call: "POST /purchases/${purchase_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /service-plan-registrations"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", diamond_id: "${diamond_id}", store_id: "${store_id}", bundle_id: "${bundle_id}", plan_term_months: 24 }
              as: StoreManager
              captures: { registration_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ChainAdmin
            - call: "POST /service-plan-registrations/${registration_id}/exams"
              payload: { visit_at: "2026-10-01T00:00:00Z", result: "CLAIMED" }
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /service-plan-registrations/lapse-due"
              payload: {}
              as: CreditAnalyst
            - call: "POST /service-plan-registrations/${registration_id}/renew"
              payload: {}
              as: StoreManager
            - call: "POST /inspection-reminders/run"
              payload: {}
              as: StoreManager
          assert:
            - "after lapse-due ServicePlanRegistration.${registration_id}.coverage_status == LAPSED and missed_inspection_count == 1"
            - "Customer.${customer_id}.lost_inspection_streak == 1 at that point"
            - "after renew ServicePlanRegistration.${registration_id}.coverage_status == RENEWED and renewal_count == 1"
            - "Customer.${customer_id}.lost_inspection_streak == 0 after the renew resets it"
            - "after the reminder sweep ServicePlanRegistration.${registration_id}.coverage_status == PENDING_INSPECTION again, closing the cycle LAPSED -> RENEWED -> PENDING_INSPECTION"
            - "GET /inspection-visits?registration_id=${registration_id} returns exactly 2 rows, one per cycle"

