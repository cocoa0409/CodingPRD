            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 2, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
