          trigger:
            - call: "POST /backup-provider/restore-requests/${rr_r_id}/reverse"
              payload: {}
              as: SystemOperator
              captures: { rr_r_state: $.data.state }
            - call: "GET /backup-provider/accounts/${acct_p_id}"
              payload: {}
