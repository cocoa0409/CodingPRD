            - "the second trigger call returns 201"
            - "RepaymentTransaction.${txn_ok}.savings_applied_cents == 200 and installment_applied_cents == 4601"
            - "Loan.${c_loan1_id}.weekly_installment_cents == 4600 and savings_required_cents == 200"

