  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: container_lot_conservation
        grounds:
          - calculations.container_reservation
          - entities.ContainerLot.fields.quantity_reserved
        distinguishing_aspect: |
          Conserved quantity: container units. For every lot, quantity_received
          == quantity_available + quantity_reserved + quantity_consumed at every
          step — after reserve (1050), after consume-with-release (900 consumed
          + 150 released), and after a schedule-then-cancel compensation (840
          reserved then fully released, zero drift).
        test_recipe:
          setup:
            - "Full pipeline; lot CL-INV 5000 PET_473 QC_PASSED; run1 SCHEDULED (reserve 1050)"
            - "Second RELEASED batch B2 in tank T-C2; run2 CONFIRMED planned 800"
