scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: ticket_provisional_quote_vs_final_charge
    grounds:
    - calculations.ticket_order_pricing
    - entities.TicketOrder.fields.quoted_total_cents
    - entities.TicketOrder.fields.final_total_cents
    distinguishing_aspect: 'Dual-variant pricing on the TicketOrder (money) domain: identical lines

      priced by the provisional variant (pricing_ts = created_at) and by the

      final variant (pricing_ts = paid_at) yield different totals when the

      clock crosses the early-bird cutoff between reserve and pay.

      '
    test_recipe:
      setup:
      - Canonical event, published; clock at 2026-05-10T12:00:00Z (before cutoff)
      - Order with lines ADULT_DAY x3 + CHILD_DAY x2 created -> RESERVED, quoted_total_cents = 8508
      - Clock advanced to 2026-06-20T12:00:00Z (after cutoff)
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
          ev_v: $.data.version
      - call: POST /events/${ev_id}/agreements
        payload:
          agreement_type: LANDOWNER_USE
          document_ref: DOC-LAND-1
          effective_from: '2026-07-01T00:00:00Z'
          effective_until: '2026-07-31T00:00:00Z'
          expected_event_version: ${ev_v}
        as: EventOrganizer
        captures:
          ag_land_id: $.data.id
      - call: POST /agreements/${ag_land_id}/sign
        payload:
          signer_name: Landowner Lee
        as: EventOrganizer
      - call: GET /events/${ev_id}
        as: EventOrganizer
        captures:
          ev_v2: $.data.version
      - call: POST /events/${ev_id}/agreements
        payload:
          agreement_type: INSURANCE_LIABILITY
          document_ref: DOC-INS-1
          coverage_amount_cents: 2000000
          effective_from: '2026-07-01T00:00:00Z'
          effective_until: '2026-07-31T00:00:00Z'
          expected_event_version: ${ev_v2}
        as: EventOrganizer
        captures:
          ag_ins_id: $.data.id
      - call: POST /agreements/${ag_ins_id}/sign
        payload:
          signer_name: Insurer Irene
        as: EventOrganizer
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /events/${ev_id}/publish
        as: EventOrganizer
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-10T12:00:00Z'
        as: EventOrganizer
      - call: POST /events/${ev_id}/ticket-orders
        payload:
          buyer_name: Pat Poe
          lines:
          - line_type: ADULT_DAY
            quantity: 3
          - line_type: CHILD_DAY
            quantity: 2
        as: Spectator
        as_user_id: spec-1
        captures:
          ord_id: $.data.id
          ord_quoted: $.data.quoted_total_cents
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-20T12:00:00Z'
        as: EventOrganizer
      trigger:
      - call: POST /ticket-orders/${ord_id}/pay
        payload:
          payment_method: CARD
          payment_reference: payref-1
        as: Spectator
        as_user_id: spec-1
        captures:
          ord_final: $.data.final_total_cents
      assert:
      - TicketOrder.${ord_id}.quoted_total_cents == 8508
      - TicketOrder.${ord_id}.final_total_cents == 10547
      - TicketOrder.${ord_id}.quoted_total_cents != TicketOrder.${ord_id}.final_total_cents
      - TicketOrder.${ord_id}.status == PAID
  - name: vendor_provisional_fee_vs_final_settlement
    grounds:
    - calculations.vendor_booth_fee
    - entities.Vendor.fields.provisional_fee_cents
    - entities.Vendor.fields.final_fee_cents
    distinguishing_aspect: "Dual-variant fee on the Vendor (settlement) domain \u2014 a different entity\ndomain from ticket pricing: identical frontage/days inputs produce a\nhigher final fee than the\
      \ provisional fee solely because the insurance\ncertificate arrived strictly after the deadline.\n"
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; vendor applied with frontage_feet 20, requested_days 3 and approved -> provisional_fee_cents = 48600
      - Vendor contracts at clock 2026-07-02T09:00:00Z (after the 2026-07-01 insurance deadline) paying 48600
      - Event then published, opened, completed
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
          ev_v: $.data.version
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-07-02T09:00:00Z'
        as: EventOrganizer
      - call: POST /events/${ev_id}/agreements
        payload:
          agreement_type: LANDOWNER_USE
          document_ref: DOC-LAND-1
          effective_from: '2026-07-01T00:00:00Z'
          effective_until: '2026-07-31T00:00:00Z'
          expected_event_version: ${ev_v}
        as: EventOrganizer
        captures:
          ag_land_id: $.data.id
      - call: POST /agreements/${ag_land_id}/sign
        payload:
          signer_name: Landowner Lee
        as: EventOrganizer
      - call: GET /events/${ev_id}
        as: EventOrganizer
        captures:
          ev_v2: $.data.version
      - call: POST /events/${ev_id}/agreements
        payload:
          agreement_type: INSURANCE_LIABILITY
          document_ref: DOC-INS-1
          coverage_amount_cents: 2000000
          effective_from: '2026-07-01T00:00:00Z'
          effective_until: '2026-07-31T00:00:00Z'
          expected_event_version: ${ev_v2}
        as: EventOrganizer
        captures:
          ag_ins_id: $.data.id
      - call: POST /agreements/${ag_ins_id}/sign
        payload:
          signer_name: Insurer Irene
        as: EventOrganizer
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /events/${ev_id}/vendors
        payload:
          business_name: Sutler Sam
          wares_description: Period dry goods
          frontage_feet: 20
          requested_days: 3
        as: Vendor
        captures:
          ve_id: $.data.id
      - call: POST /vendors/${ve_id}/approve
        as: EventOrganizer
        captures:
          ve_prov: $.data.provisional_fee_cents
      - call: POST /vendors/${ve_id}/contract
        payload:
          insurance_cert_ref: CERT-77
          fee_payment_cents: 48600
        as: Vendor
        as_user_id: ${ve_id}
      - call: POST /events/${ev_id}/publish
        as: EventOrganizer
      - call: POST /events/${ev_id}/open-gates
        as: EventOrganizer
      - call: POST /events/${ev_id}/complete
        as: EventOrganizer
      trigger:
      - call: POST /vendors/${ve_id}/settle
        as: EventOrganizer
        captures:
          ve_final: $.data.final_fee_cents
          ve_bal: $.data.balance_due_cents
      assert:
      - Vendor.${ve_id}.provisional_fee_cents == 48600
      - Vendor.${ve_id}.final_fee_cents == 51100
      - Vendor.${ve_id}.balance_due_cents == 2500
      - Vendor.${ve_id}.status == SETTLED
- rule_id: combinatorial_formula
  instances:
  - name: ticket_total_rounded_per_line_then_summed
    grounds:
    - calculations.ticket_order_pricing
    distinguishing_aspect: "Mode (b) nested rounding: the formula pins round-per-line-then-sum \u2014\nround_half_up(2599*3*0.8) = 6238, whereas rounding per unit first would\ngive 2079*3 = 6237; the scaffold's\
      \ pinned order yields quoted total 8508,\none cent above the alternative order's 8507.\n"
    test_recipe:
      setup:
      - Canonical event, published; clock at 2026-05-10T12:00:00Z (early bird applies)
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
          ev_v: $.data.version
      - call: POST /events/${ev_id}/agreements
        payload:
          agreement_type: LANDOWNER_USE
          document_ref: DOC-LAND-1
          effective_from: '2026-07-01T00:00:00Z'
          effective_until: '2026-07-31T00:00:00Z'
          expected_event_version: ${ev_v}
        as: EventOrganizer
        captures:
          ag_land_id: $.data.id
      - call: POST /agreements/${ag_land_id}/sign
        payload:
          signer_name: Landowner Lee
        as: EventOrganizer
      - call: GET /events/${ev_id}
        as: EventOrganizer
        captures:
          ev_v2: $.data.version
      - call: POST /events/${ev_id}/agreements
        payload:
          agreement_type: INSURANCE_LIABILITY
          document_ref: DOC-INS-1
          coverage_amount_cents: 2000000
          effective_from: '2026-07-01T00:00:00Z'
          effective_until: '2026-07-31T00:00:00Z'
          expected_event_version: ${ev_v2}
        as: EventOrganizer
        captures:
          ag_ins_id: $.data.id
      - call: POST /agreements/${ag_ins_id}/sign
        payload:
          signer_name: Insurer Irene
        as: EventOrganizer
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /events/${ev_id}/publish
        as: EventOrganizer
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-10T12:00:00Z'
        as: EventOrganizer
      trigger:
      - call: POST /events/${ev_id}/ticket-orders
        payload:
          buyer_name: Pat Poe
          lines:
          - line_type: ADULT_DAY
            quantity: 3
          - line_type: CHILD_DAY
            quantity: 2
        as: Spectator
        as_user_id: spec-1
        captures:
          ord_id: $.data.id
          ord_quoted: $.data.quoted_total_cents
      assert:
      - TicketOrder.${ord_id}.quoted_total_cents == 8508
      - TicketOrder.${ord_id}.quoted_total_cents != 8507 (the per-unit-first rounding order, which would give 6237 + 1920 + 350)
  - name: vendor_fee_multibranch_floor_discount_surcharge
    grounds:
    - calculations.vendor_booth_fee
    distinguishing_aspect: "Mode (a) multi-input non-linear formula: fee = max(round(feet * days *\nrate * (1 - discount if days >= 3)), min_fee) plus a state-conditional\nlate-insurance surcharge at settlement\
      \ \u2014 three inputs with a nested max\nand two conditional branches, a different mode from per-line rounding.\n"
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN
      - 'Vendor A: frontage 20 ft, 3 days (discount branch); Vendor B: frontage 3 ft, 1 day (floor branch)'
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /events/${ev_id}/vendors
        payload:
          business_name: Sutler Sam
          wares_description: Period dry goods
          frontage_feet: 20
          requested_days: 3
        as: Vendor
        captures:
          ve_a: $.data.id
      - call: POST /events/${ev_id}/vendors
        payload:
          business_name: Tiny Tina
          wares_description: Ribbon and lace
          frontage_feet: 3
          requested_days: 1
        as: Vendor
        captures:
          ve_b: $.data.id
      trigger:
      - call: POST /vendors/${ve_a}/approve
        as: EventOrganizer
        captures:
          fee_a: $.data.provisional_fee_cents
      - call: POST /vendors/${ve_b}/approve
        as: EventOrganizer
        captures:
          fee_b: $.data.provisional_fee_cents
      assert:
      - "Vendor.${ve_a}.provisional_fee_cents == 48600 (max(round(20*3*900*0.9), 5000) \u2014 discount branch)"
      - "Vendor.${ve_b}.provisional_fee_cents == 5000 (max(3*1*900, 5000) \u2014 min-fee floor branch)"
- rule_id: non_linear_state_machine
  instances:
  - name: participant_vetting_revision_loop
    grounds:
    - state_machines.Participant
    distinguishing_aspect: "Participant carries a true cycle \u2014 SUBMITTED -> CHANGES_REQUESTED ->\nSUBMITTED via resubmission \u2014 not a one-way pipeline; the loop can\nrepeat and still terminates\
      \ at VETTED.\n"
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; unit APPROVED; adult participant created (DRAFT)
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /units
        payload:
          event_id: ${ev_id}
          name: 6th Ohio
          unit_type: MILITARY
          portrayal_name: 6th Ohio Volunteer Infantry
          headcount_estimate: 12
        as: UnitCommander
        captures:
          un_id: $.data.id
      - call: POST /units/${un_id}/vet
        payload:
          decision: APPROVE
          notes: roster verified
        as: EventOrganizer
      - call: POST /participants
        payload:
          event_id: ${ev_id}
          unit_id: ${un_id}
          full_name: Ada Adams
          age_at_event: 34
          impression_class: COMBATANT
          persona_description: Federal private, 1864
        as: UnitCommander
        as_user_id: ${un_id}
        captures:
          pa_id: $.data.id
      trigger:
      - call: POST /participants/${pa_id}/submit
        as: UnitCommander
        as_user_id: ${un_id}
        captures:
          st1: $.data.status
      - call: POST /participants/${pa_id}/vet
        payload:
          decision: REQUEST_CHANGES
          notes: replace modern buttons
        as: AuthenticityOfficer
        captures:
          st2: $.data.status
      - call: POST /participants/${pa_id}/submit
        as: UnitCommander
        as_user_id: ${un_id}
        captures:
          st3: $.data.status
      - call: POST /participants/${pa_id}/vet
        payload:
          decision: APPROVE
          notes: corrected
        as: AuthenticityOfficer
        captures:
          st4: $.data.status
      assert:
      - status after first submit == SUBMITTED
      - status after REQUEST_CHANGES == CHANGES_REQUESTED
      - status after resubmit == SUBMITTED (cycle back to an earlier state)
      - status after final APPROVE == VETTED
  - name: event_restriction_cycle
