      - name: day_plan_parking_and_admission_counters_conserved_across_release
        grounds:
          - calculations.admission_allocation
          - state_machines.AccessReservation.CHECKED_IN_to_RELEASED
          - entities.DayPlan.fields.admitted_guest_count
          - entities.DayPlan.fields.parking_stalls_used
          - entities.AccessReservation.fields.allocated_stalls
          - entities.DayPlan.fields.waitlisted_guest_count
        distinguishing_aspect: |
          A different kind of conserved quantity from the season water ledger: a DISCRETE inventory of
          seats and parking stalls, which must always equal a recomputation over the reservation set rather
          than a running counter that is incremented and decremented. The reservation is first checked in -
          a state change that must NOT double-count the party or its stalls - and then released, which must
          return admitted_guest_count and parking_stalls_used to exactly zero and zero the row's own
          allocated_stalls. The lift is deliberately tiny (20 pph, guest_capacity 12) so the counters are
          small enough to state exactly, and the party is a SEASON pass so it bypasses the non-season pool
          and non_season_admitted_count must stay 0 throughout.
