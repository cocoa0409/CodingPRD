    side_effects: []
  - method: GET
    path: "/api/inspections"
    description: "List inspection reports (reverse-reachability for InspectionReport.casting_id)"
    roles: [FoundryAdmin, QualityInspector, WarrantyManager]
    code: 200
    input: ["casting_id?", "status?", "limit?", "offset?"]
    output: "InspectionReport[]"
    side_effects: []
  - method: POST
    path: "/api/inspections/{id}/disposition"
    description: "MRB disposition: ACCEPT | USE_AS_IS | REWORK | SCRAP with per-branch side effects"
    roles: [QualityInspector]
    code: 200
    input: [disposition, "scrap_code?", "return_lot_id?", "mrb_reference?"]
    output: InspectionReport
