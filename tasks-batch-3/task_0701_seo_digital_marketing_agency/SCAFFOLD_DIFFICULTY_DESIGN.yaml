# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_0701_seo_digital_marketing_agency (Expert)
# Nine §0.5 Difficulty Rules × ≥2 instances each = 18 instances.
# Every grounds:/setup_api_calls:/trigger: resolves against SCAFFOLD.yaml §1.1–§1.7.
# Numeric asserts are literals computed from §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ppc_fee_live_estimate_vs_invoiced_final
        grounds:
          - calculations.ppc_management_fee
          - state_machines.AdCampaign.UNBILLED_to_INVOICED
          - entities.AdCampaign.fields.management_fee_cents
        distinguishing_aspect: |
          On the AdCampaign domain, the live_estimate variant recomputes management_fee_cents
          over current spent_cents on every record-spend, while the invoiced_final variant freezes
          the fee at invoice time so a later UPHELD dispute does NOT lower an INVOICED fee — same
          spend history, two different fee values depending on billing_status.
        test_recipe:
          setup:
            - "Direct client (no reseller, base_rate=AGENCY_PPC_PCT=0.20), AUDITED then ACTIVE via an ACTIVE retainer"
            - "AdCampaign LIVE with budget 1,000,000c, spent_cents=800,000c after a record-spend"
            - "Live estimate fee over 800,000c = floor(500000*0.20 + 300000*0.17) = 151,000c"
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Acme Direct", primary_domain: "acme.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 80, content_score: 80, backlink_score: 80 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /ad-campaigns"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", channel: "GOOGLE_ADS", budget_cents: 1000000 }
              as: AccountManager
              captures: { camp_id: $.data.id }
            - call: "POST /ad-campaigns/${camp_id}/launch"
              payload: {}
              as: AccountManager
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 800000 }
              as: AccountManager
              captures: { live_fee: $.data.management_fee_cents }
          trigger:
            - call: "POST /ad-campaigns/${camp_id}/invoice"
              payload: {}
              as: AccountManager
              captures: { final_fee: $.data.management_fee_cents }
          assert:
            - "AdCampaign.${camp_id}.management_fee_cents == 151000 after record-spend (live_estimate)"
            - "AdCampaign.${camp_id}.management_fee_cents == 151000 after invoice (invoiced_final frozen)"
            - "AdCampaign.${camp_id}.billing_status == INVOICED"

      - name: retainer_billing_price_direct_vs_reseller_markup
        grounds:
          - calculations.retainer_billing_price
          - state_machines.Retainer.DRAFT_to_ACTIVE
          - entities.Retainer.fields.billing_price_cents
          - entities.Reseller.fields.markup_pct
        distinguishing_aspect: |
          On the Retainer domain (different entity from ppc_management_fee), the direct variant sets
          billing_price_cents = wholesale_price_cents while the reseller variant applies
          floor(wholesale * (1 + markup_pct)); identical wholesale 200,000c yields 200,000c direct
          versus 260,000c under a 0.30 reseller markup.
        test_recipe:
          setup:
            - "Reseller with markup_pct=0.30"
            - "Reseller client and direct client, each AUDITED, each with a DRAFT retainer at wholesale 200,000c"
          setup_api_calls:
            - call: "POST /resellers"
              payload: { brand_name: "WhiteLabel Co", markup_pct: 0.30 }
              as: AgencyAdmin
              captures: { res_id: $.data.id }
            - call: "POST /clients"
              payload: { company_name: "Reseller Client", primary_domain: "rc.example", reseller_id: "${res_id}" }
              as: AgencyAdmin
              captures: { rcl_id: $.data.id }
            - call: "POST /clients/${rcl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${rcl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { rret_id: $.data.id }
            - call: "POST /clients"
              payload: { company_name: "Direct Client", primary_domain: "dc.example" }
              as: AgencyAdmin
              captures: { dcl_id: $.data.id }
            - call: "POST /clients/${dcl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${dcl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { dret_id: $.data.id }
          trigger:
            - call: "POST /retainers/${rret_id}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { reseller_price: $.data.billing_price_cents }
            - call: "POST /retainers/${dret_id}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { direct_price: $.data.billing_price_cents }
          assert:
            - "Retainer.${rret_id}.billing_price_cents == 260000 (reseller variant)"
            - "Retainer.${dret_id}.billing_price_cents == 200000 (direct variant)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ppc_fee_nested_tier_rounding_order
        grounds:
          - calculations.ppc_management_fee
          - entities.AdCampaign.fields.management_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-tier raw fees are summed THEN floored once over the total,
          not floored per tier. Spend 2,500,000c at base_rate 0.20 spans all three tiers:
          floor(500000*0.20 + 1500000*0.17 + 500000*0.14) = floor(425000.0) = 425,000c.
        test_recipe:
          setup:
            - "Direct ACTIVE client; AdCampaign LIVE with budget 3,000,000c, spent 2,500,000c crossing both tier boundaries"
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Tier Spend", primary_domain: "tier.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 60, content_score: 60, backlink_score: 60 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "DOMINATE", monthly_credits: 40, wholesale_price_cents: 500000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /ad-campaigns"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", channel: "META", budget_cents: 3000000 }
              as: AccountManager
              captures: { camp_id: $.data.id }
            - call: "POST /ad-campaigns/${camp_id}/launch"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 2500000 }
              as: AccountManager
              captures: { fee: $.data.management_fee_cents }
          assert:
            - "AdCampaign.${camp_id}.spent_cents == 2500000"
            - "AdCampaign.${camp_id}.management_fee_cents == 425000 (single floor over summed per-tier fees)"

      - name: account_health_three_input_nonlinear_clamp
        grounds:
          - calculations.account_health_score
          - calculations.rank_momentum
          - state_machines.AdSpendDispute.UNDER_REVIEW_to_DENIED
          - entities.Client.fields.health_score
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear formula: health_score combines a clamped momentum term
          (rank_momentum*2.0 clamped to [-30,30]), an overdue-deliverable penalty, and a dispute
          penalty, then clamps the total to [0,100]. With momentum 40 (term 80 clamps to +30),
          0 overdue, 1 open dispute: clamp(100 + 30 - 0 - 10) = clamp(120) = 100.
        test_recipe:
          setup:
            - "ACTIVE client with one report giving rank_momentum=40.0 (one TRACKING keyword 50->10)"
            - "One OPEN AdSpendDispute against the client's campaign (open_dispute_count=1)"
            - "No overdue deliverables; report generation recomputes health_score"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "Health Co", primary_domain: "health.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 80, content_score: 80, backlink_score: 80 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /keyword-targets"
              payload: { client_id: "${cl_id}", phrase: "best seo agency", search_volume: 1000, difficulty: 40 }
              as: AccountManager
              captures: { kw_id: $.data.id }
            - call: "POST /keyword-targets/${kw_id}/activate-tracking"
              payload: {}
              as: AccountManager
            - call: "POST /keyword-targets/${kw_id}/snapshots"
              payload: { position: 50, organic_traffic: 100, observed_at: "2026-04-05T00:00:00Z" }
              as: AccountManager
            - call: "POST /keyword-targets/${kw_id}/snapshots"
              payload: { position: 10, organic_traffic: 400, observed_at: "2026-04-20T00:00:00Z" }
              as: AccountManager
            - call: "POST /ad-campaigns"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", channel: "BING", budget_cents: 1000000 }
              as: AccountManager
              captures: { camp_id: $.data.id }
            - call: "POST /ad-campaigns/${camp_id}/launch"
              payload: {}
              as: AccountManager
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 500000 }
              as: AccountManager
            - call: "POST /ad-spend-disputes"
              payload: { ad_campaign_id: "${camp_id}", client_id: "${cl_id}", disputed_cents: 100000 }
              as: AccountManager
          trigger:
            - call: "POST /clients/${cl_id}/reports"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: AccountManager
              captures: { momentum: $.data.rank_momentum }
            - call: "GET /clients/${cl_id}"
              payload: {}
              as: AgencyAdmin
              captures: { health: $.data.health_score }
          assert:
            - "Report.rank_momentum == 40.0 (one keyword, first 50 -> last 10)"
            - "Client.${cl_id}.open_dispute_count == 1"
            - "Client.${cl_id}.health_score == 100 (clamp(100 + clamp(40*2.0,-30,30) - 0 - 10) = clamp(100+30-10))"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deliverable_revision_cycle_in_review_to_in_progress
        grounds:
          - state_machines.Deliverable.IN_REVIEW_to_IN_PROGRESS
          - state_machines.Deliverable.IN_PROGRESS_to_IN_REVIEW
          - entities.Deliverable.fields.revision_count
        distinguishing_aspect: |
          On the Deliverable entity, a cyclic revision loop IN_PROGRESS->IN_REVIEW->IN_PROGRESS
          re-enters a prior state and increments revision_count each time request_revision fires,
          unlike a forward-only pipeline.
        test_recipe:
          setup:
            - "ACTIVE client + ACTIVE retainer (monthly_credits 20) + ACTIVE sprint capacity 20"
            - "One CONTENT/STANDARD deliverable (credit_cost 3) driven to IN_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "Rev Co", primary_domain: "rev.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { ret_v: $.data.version }
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "April Push", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp_id: $.data.id }
            - call: "POST /sprints/${sp_id}/start"
              payload: {}
              as: AccountManager
            - call: "POST /deliverables"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", sprint_id: "${sp_id}", kind: "CONTENT", complexity: "STANDARD" }
              as: AccountManager
              captures: { d_id: $.data.id }
            - call: "POST /deliverables/${d_id}/assign"
              payload: { expected_retainer_version: "${ret_v}" }
              as: AccountManager
            - call: "POST /deliverables/${d_id}/start"
              payload: {}
              as: AccountManager
            - call: "POST /deliverables/${d_id}/submit"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /deliverables/${d_id}/request_revision"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { rc1: $.data.revision_count, st1: $.data.status }
            - call: "POST /deliverables/${d_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /deliverables/${d_id}/request_revision"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { rc2: $.data.revision_count }
          assert:
            - "After first request_revision: Deliverable.${d_id}.status == IN_PROGRESS and revision_count == 1"
            - "After second request_revision: Deliverable.${d_id}.revision_count == 2"

      - name: adcampaign_parallel_lifecycle_and_billing_dimensions
        grounds:
          - state_machines.AdCampaign.LIVE_to_PAUSED
          - state_machines.AdCampaign.UNBILLED_to_INVOICED
          - entities.AdCampaign.fields.lifecycle_status
          - entities.AdCampaign.fields.billing_status
        distinguishing_aspect: |
          On the AdCampaign entity, lifecycle_status (DRAFT|LIVE|PAUSED|ENDED) and billing_status
          (UNBILLED|INVOICED|SETTLED) evolve as two independent parallel dimensions on the same row:
          a campaign can be INVOICED while still PAUSED, proving the dimensions do not gate each other.
        test_recipe:
          setup:
            - "Direct ACTIVE client; AdCampaign launched LIVE, spent 300,000c, then PAUSED while still UNBILLED"
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Parallel Co", primary_domain: "par.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 60, content_score: 60, backlink_score: 60 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "STARTER", monthly_credits: 10, wholesale_price_cents: 100000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /ad-campaigns"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", channel: "GOOGLE_ADS", budget_cents: 500000 }
              as: AccountManager
              captures: { camp_id: $.data.id }
            - call: "POST /ad-campaigns/${camp_id}/launch"
              payload: {}
              as: AccountManager
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 300000 }
              as: AccountManager
            - call: "POST /ad-campaigns/${camp_id}/pause"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /ad-campaigns/${camp_id}/invoice"
              payload: {}
              as: AccountManager
              captures: { life: $.data.lifecycle_status, bill: $.data.billing_status, fee: $.data.management_fee_cents }
          assert:
            - "AdCampaign.${camp_id}.lifecycle_status == PAUSED (unchanged by billing transition)"
            - "AdCampaign.${camp_id}.billing_status == INVOICED"
            - "AdCampaign.${camp_id}.management_fee_cents == 60000 (floor(300000*0.20))"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: client_churn_to_retainer_close_to_deliverable_cancel_releases_credits
        grounds:
          - state_machines.Client.ACTIVE_to_CHURNED
          - state_machines.Retainer.ACTIVE_to_CLOSED
          - state_machines.Deliverable.ASSIGNED_to_CANCELLED
          - entities.Retainer.fields.credits_committed
        distinguishing_aspect: |
          Depth-3 cascade from ONE trigger (client churn): Client.churn -> Retainer.CLOSED, and that
          Retainer transition itself -> its non-terminal Deliverable.CANCELLED, and that cancel itself
          -> Retainer.credits_committed decremented. Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "ACTIVE client, ACTIVE retainer (monthly_credits 20), one ASSIGNED deliverable reserving 3 credits"
            - "No binding contract (contract terminated/absent), so churn is permitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "Churn Co", primary_domain: "churn.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { ret_v: $.data.version }
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "Push", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp_id: $.data.id }
            - call: "POST /sprints/${sp_id}/start"
              payload: {}
              as: AccountManager
            - call: "POST /deliverables"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", sprint_id: "${sp_id}", kind: "CONTENT", complexity: "STANDARD" }
              as: AccountManager
              captures: { d_id: $.data.id }
            - call: "POST /deliverables/${d_id}/assign"
              payload: { expected_retainer_version: "${ret_v}" }
              as: AccountManager
          trigger:
            - call: "POST /clients/${cl_id}/churn"
              payload: {}
              as: AccountManager
          assert:
            - "Client.${cl_id}.status == CHURNED"
            - "Retainer.${ret_id}.status == CLOSED"
            - "Deliverable.${d_id}.status == CANCELLED"
            - "Retainer.${ret_id}.credits_committed == 0 (the 3 reserved credits were released by the cascaded cancel)"

      - name: dispute_upheld_to_spend_reduction_to_fee_and_health_recompute
        grounds:
          - state_machines.AdSpendDispute.UNDER_REVIEW_to_UPHELD
          - entities.AdCampaign.fields.spent_cents
          - entities.AdCampaign.fields.management_fee_cents
          - entities.Client.fields.health_score
        distinguishing_aspect: |
          Depth-2+ cascade from a DIFFERENT trigger (dispute resolve UPHELD): resolving UPHELD reduces
          AdCampaign.spent_cents, and that spend change itself recomputes management_fee_cents; the same
          resolution also recomputes Client.open_dispute_count -> health_score. Distinct propagation
          pattern from the churn cascade.
        test_recipe:
          setup:
            - "Direct ACTIVE client; LIVE campaign spent 800,000c (live fee 151,000c); dispute for 300,000c moved to UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Dispute Co", primary_domain: "disp.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /ad-campaigns"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", channel: "GOOGLE_ADS", budget_cents: 1000000 }
              as: AccountManager
              captures: { camp_id: $.data.id }
            - call: "POST /ad-campaigns/${camp_id}/launch"
              payload: {}
              as: AccountManager
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 800000 }
              as: AccountManager
            - call: "POST /ad-spend-disputes"
              payload: { ad_campaign_id: "${camp_id}", client_id: "${cl_id}", disputed_cents: 300000 }
              as: AccountManager
              captures: { dsp_id: $.data.id }
            - call: "POST /ad-spend-disputes/${dsp_id}/review"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /ad-spend-disputes/${dsp_id}/resolve"
              payload: { outcome: "UPHELD" }
              as: AccountManager
            - call: "GET /ad-campaigns/${camp_id}"
              payload: {}
              as: AgencyAdmin
              captures: { spent: $.data.spent_cents, fee: $.data.management_fee_cents }
            - call: "GET /clients/${cl_id}"
              payload: {}
              as: AgencyAdmin
              captures: { health: $.data.health_score }
          assert:
            - "AdSpendDispute.${dsp_id}.status == UPHELD and credited_cents == 300000"
            - "AdCampaign.${camp_id}.spent_cents == 500000 (800000 - 300000)"
            - "AdCampaign.${camp_id}.management_fee_cents == 100000 (floor(500000*0.20))"
            - "Client.${cl_id}.open_dispute_count == 0 and health_score == 100"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assign_invalid_state_beats_insufficient_credits
        grounds:
          - validations[priority=6]
          - validations[priority=19]
          - state_machines.Deliverable.DRAFT_to_ASSIGNED
        distinguishing_aspect: |
          Error-category pair (state @prio6) vs (business_fiscal @prio19): assigning a deliverable that
          is NOT in DRAFT while the retainer also lacks credits returns ERR_INVALID_STATE (the lower
          priority number wins), not ERR_INSUFFICIENT_CREDITS.
        test_recipe:
          setup:
            - "ACTIVE retainer with only 2 credits granted (monthly_credits=2); one CONTENT deliverable (cost 3) already CANCELLED"
            - "Attempt to assign the already-CANCELLED deliverable (not DRAFT) — fails state before fiscal"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: AgencyAdmin
