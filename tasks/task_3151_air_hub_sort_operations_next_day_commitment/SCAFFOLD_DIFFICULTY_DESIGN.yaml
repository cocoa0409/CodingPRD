              as: SortOperator
              captures: { pkg_u1: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-U-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 50000, dimension_weight_grams: 50000 }
              as: SortOperator
              captures: { pkg_u2: $.data.id }
            - call: "POST /airhub/packages/${pkg_u1}/induct"
              payload: { dimension_weight_grams: 70000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_u2}/induct"
              payload: { dimension_weight_grams: 50000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_u1}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_u1}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_u1_v: $.data.version }
            - call: "POST /airhub/packages/${pkg_u2}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_u2}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_u2_v: $.data.version }
            - call: "POST /airhub/moves/${move_a_id}/assign-buildup"
              payload: { package_id: "${pkg_u1}", buildup_id: "${bd_a_id}" }
              as: LoadPlanner
              captures: { move_a_v: $.data.version }
            - call: "POST /airhub/moves/${move_a_id}/load-package"
              payload: { package_id: "${pkg_u1}", expected_load_move_version: "${move_a_v}", expected_package_version: "${pkg_u1_v}" }
              as: LoadPlanner
              captures: { move_a_v2: $.data.version }
            - call: "POST /airhub/moves/${move_a_id}/unload-package"
              payload: { package_id: "${pkg_u1}" }
              as: LoadPlanner
              captures: { move_a_v3: $.data.version }
            - call: "POST /airhub/moves/${move_b_id}/load-package"
              payload: { package_id: "${pkg_u2}", expected_load_move_version: "${move_b_v1}", expected_package_version: "${pkg_u2_v}" }
              as: LoadPlanner
              captures: { move_b_v: $.data.version }
          trigger:
            - call: "POST /airhub/moves/${move_a_id}/load-package"
              payload: { package_id: "${pkg_u2}", expected_load_move_version: "${move_a_v3}", expected_package_version: "${pkg_u2_v}" }
              as: LoadPlanner
              captures: { err_delta_zero_ok: $.data.error_id }
            - call: "POST /airhub/moves/${move_a_id}/load-package"
              payload: { package_id: "${pkg_u2}", expected_load_move_version: "${move_a_v3}", expected_package_version: "${pkg_u2_v}" }
              as: LoadPlanner
              captures: { err_delta_one: $.data.error_id }
          assert:
            - "Buildup.${bd_a_id}.rated_weight_grams == 70000 and container_limit_grams == 70000, so the delta is 0"
            - "the first attempt is NOT rejected by the buildup guard: ${err_delta_zero_ok} != ERR_BUILDUP_UNDER_CAPACITY — a 0-gram delta is outside the strictly-inside window"
            - "the same attempt against the same 100-gram delta is instead refused by the ceiling guard at priority 10: ${err_delta_one} == ERR_LOAD_WEIGHT_EXCEEDED, because Move.${move_a_id}.forward_capacity_grams is 100000 which is not <= SORT_BUDGET_GRAMS_CEILING 350000"
            - "the guard window is (0, 25000]: 0 is allowed, 100 would be rejected on a move whose forward capacity sat inside the ceiling"
            - "Buildup.${bd_a_id}.status == OPEN throughout, so neither attempt flipped the breach state"

