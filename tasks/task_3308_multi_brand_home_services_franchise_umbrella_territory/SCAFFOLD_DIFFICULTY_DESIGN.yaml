              captures: { awarded_allocated: $.data.allocated_households }
            - call: "POST /franchise/agreements/${agt1_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/agreements/${agt1_id}/activate"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "POST /franchise/agreements/${agt1_id}/suspend"
