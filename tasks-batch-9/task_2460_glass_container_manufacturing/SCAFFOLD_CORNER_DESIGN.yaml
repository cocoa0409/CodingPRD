      - name: clock_defaults_to_2026_08_01_for_window_boundaries
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - validations.priority_38
          - state_machines.ColorChange.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Without any clock call the logical now is exactly 2026-08-01T00:00:00Z, so a colour-change window
          ending on that instant completes (the comparison is "on or after") while an otherwise identical
          window ending one second later is refused - the two furnaces differ only in that one second.
        test_recipe:
          setup:
            - "Furnace FUR-E2-A with SCHEDULED ColorChange CC-E2-A to AMBER over 2026-07-30T00:00:00Z..2026-08-01T00:00:00Z"
            - "Furnace FUR-E2-B with SCHEDULED ColorChange CC-E2-B to GREEN over 2026-07-30T00:00:00Z..2026-08-01T00:00:01Z"
            - "No /_clock/set_current_utc call has been made"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E2-A", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { fa: "$.data.id" }
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E2-B", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { fb: "$.data.id" }
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${fa}", to_color: "AMBER", window_start_at: "2026-07-30T00:00:00Z", window_end_at: "2026-08-01T00:00:00Z", transition_loss_tons: 10.00 }
              as: BatchHouseTech
              captures: { cca: "$.data.id" }
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${fb}", to_color: "GREEN", window_start_at: "2026-07-30T00:00:00Z", window_end_at: "2026-08-01T00:00:01Z", transition_loss_tons: 10.00 }
              as: BatchHouseTech
              captures: { ccb: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/color-changes/${cca}/complete"
              payload: {}
              as: BatchHouseTech
          assert:
            - "HTTP 200 and ColorChange.${cca}.status == COMPLETED"
            - "Furnace.${fa}.current_color == AMBER and version == 2"
            - "POST /glass-plant/color-changes/${ccb}/complete returns 409 ERR_WINDOW_NOT_ELAPSED"
            - "Furnace.${fb}.current_color == FLINT and version == 1"
            - "ColorChange.${ccb}.status == SCHEDULED and to_color == GREEN"

      - name: furnace_campaign_sub_resource_scoped_to_parent
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/glass-plant/furnaces/{id}/campaigns
          - entities.Campaign.fields.furnace_id
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The sub-resource read is scoped to the path furnace: FUR-E3-A's two campaigns are returned with
          total_count 2 while FUR-E3-B's campaign is absent, and the status filter narrows the same read to
          the single PLANNED campaign.
        test_recipe:
          setup:
            - "Furnace FUR-E3-A with ACTIVE Campaign CMP-E3-A1 (2026-08-01 to 2026-08-11) and PLANNED Campaign CMP-E3-A2 (2026-08-12 to 2026-08-22)"
            - "Furnace FUR-E3-B with PLANNED Campaign CMP-E3-B1"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E3-A", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
