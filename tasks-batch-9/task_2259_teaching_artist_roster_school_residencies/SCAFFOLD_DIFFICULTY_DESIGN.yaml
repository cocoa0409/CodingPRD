              as: CurriculumSpecialist
            - call: "POST /arts-standards"
              payload: { code: "DA:Re7.1.4", discipline: "DANCE", grade_band: "G3_5", strand: "RESPONDING", description: "Describe movement choices observed in a dance work." }
              as: CurriculumSpecialist
            - call: "POST /lesson-plans"
              payload: { residency_id: "${r1_id}", title: "Story in Motion 1", session_sequence_no: 1, standard_codes: ["DA:Cr1.1.4", "DA:Re7.1.4"], materials_list: "scarves, hand drum" }
              as: RosterCoordinator
              captures: { lp1_id: $.data.id }
            - call: "POST /lesson-plans/${lp1_id}/review"
              payload: { decision: "ALIGN" }
              as: CurriculumSpecialist
            - call: "POST /residencies/${r1_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ProgramDirector
            - call: "GET /residencies/${r1_id}"
              payload: {}
              as: RosterCoordinator
              captures: { r1_v1: $.data.version }
            - call: "POST /sessions"
              payload: { residency_id: "${r1_id}", assigned_artist_id: "${a1_id}", session_date: "2026-09-15", start_time: "09:00", end_time: "10:00", session_type: "REGULAR", lesson_plan_id: "${lp1_id}", expected_residency_version: "${r1_v1}" }
              as: RosterCoordinator
              captures: { sess1_id: $.data.id }
            - call: "POST /sessions/${sess1_id}/confirm"
              payload: { classroom_teacher_name: "Ms. Delgado", co_planning_completed: true }
              as: SchoolLiaison
              as_user_id: "${s1_id}"
            - call: "POST /sessions/${sess1_id}/deliver"
              payload: { students_present_count: 22, minutes_delivered: 60, travel_miles: 20.5, materials_spend_cents: 3000 }
              as: TeachingArtist
              as_user_id: "${a1_id}"
            - call: "GET /residencies/${r1_id}"
              payload: {}
              as: RosterCoordinator
              captures: { r1_v2: $.data.version }
            - call: "POST /sessions"
              payload: { residency_id: "${r1_id}", assigned_artist_id: "${a1_id}", session_date: "2026-09-22", start_time: "09:00", end_time: "10:00", session_type: "REGULAR", lesson_plan_id: "${lp1_id}", expected_residency_version: "${r1_v2}" }
              as: RosterCoordinator
              captures: { sess2_id: $.data.id }
            - call: "POST /sessions/${sess2_id}/confirm"
              payload: { classroom_teacher_name: "Ms. Delgado", co_planning_completed: true }
              as: SchoolLiaison
              as_user_id: "${s1_id}"
          trigger:
            - call: "POST /sessions/${sess2_id}/deliver"
              payload: { students_present_count: 24, minutes_delivered: 60, travel_miles: 14.5, materials_spend_cents: 0 }
              as: TeachingArtist
              as_user_id: "${a1_id}"
            - call: "GET /residencies/${r1_id}"
              payload: {}
              as: ProgramDirector
              captures: { r1_earned: $.data.earned_to_date_cents, r1_projected: $.data.projected_cost_cents }
          assert:
            - "Session.${sess1_id}.payable_cents == 17178"
            - "Session.${sess2_id}.payable_cents == 14276"
            - "Residency.${r1_id}.earned_to_date_cents == 31454"
            - "Residency.${r1_id}.projected_cost_cents == 143246"
            - "${r1_projected} - ${r1_earned} == 111792"
            - "Residency.${r1_id}.sessions_delivered_count == 2"
            - "Residency.${r1_id}.sessions_unscheduled_count == 8"
            - "Residency.${r1_id}.encumbered_cents == 31454"
            - "Residency.${r1_id}.available_cents == 168546"
            - "Residency.${r1_id}.disbursed_cents == 0"

