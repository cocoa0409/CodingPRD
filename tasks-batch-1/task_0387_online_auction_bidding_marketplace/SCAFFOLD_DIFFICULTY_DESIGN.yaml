              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Inv R", format: "BUY_NOW", buy_now_price_cents: 20000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/pay"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /orders/${ord_id}/ship"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders/${ord_id}/deliver"
              payload: {}
              as: Buyer
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /orders/${ord_id}/complete-return"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "Order.${ord_id}.paid_amount_cents == 0"
            - "Order.${ord_id}.payment_status == REFUNDED"
            - "Order.${ord_id}.fulfillment_status == RETURNED"

      - name: order_cancel_conserves_fee_balance_to_zero   # conserved: Account.fee_balance_cents
        grounds:
          - state_machines.Order.AWAITING_PAYMENT_to_CANCELLED
          - calculations.seller_fee_balance
          - entities.Account.fields.fee_balance_cents
          - entities.SellerFeeInvoice.fields.settlement_status
        distinguishing_aspect: |
          Conserved quantity #2 (DIFFERENT type — a seller ledger balance, not an order payment) =
          Account.fee_balance_cents. The forward action (buy-now creates Order+Invoice, debiting fee_balance to
          3630) paired with its compensating action (seller cancels the unpaid order -> Invoice CREDITED) MUST
          restore fee_balance_cents to exactly 0.
        test_recipe:
          setup:
            - "Seller S publishes BUY_NOW 30000; Buyer B buys (Invoice 3630 INVOICED, S.fee_balance_cents 3630); order remains UNPAID."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s18@x.com", display_name: "S18", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
