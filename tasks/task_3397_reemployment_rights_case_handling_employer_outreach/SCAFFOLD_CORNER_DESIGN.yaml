  - section: rbac
    instances:
      - name: proctor_cannot_certify_same_ombudsman
        claim_type: Segregation of duties
        grounds:
          - state_machines.Ombudsman.TRAINEE_to_CERTIFIED
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.TrainingRecord.fields.proctor_id
        distinguishing_aspect: "The coordinator who proctored any of an ombudsman's training records cannot certify that ombudsman: pc-admin's certify attempt fails 403 ERR_SEGREGATION_OF_DUTIES, while pc-lead's succeeds — same ombudsman, same records, different X-User-ID."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Ombudsman with all three core records proctored by pc-admin."
          setup_api_calls:
            - *c_clock
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
          trigger:
            - call: "POST /reemployment/ombudsmen/${omb_id}/state"
