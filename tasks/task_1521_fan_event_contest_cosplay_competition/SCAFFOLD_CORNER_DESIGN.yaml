        claim_type: pagination_with_filtering
        grounds: [response_envelope]
        distinguishing_aspect: "Default pagination (limit 10, offset 0) applies when no params are given: 12 slots yield 10 items with total_count 12 and has_more true; offset 10 yields the remaining 2 with has_more false."
        test_recipe:
          setup: ["Contest with one category; 12 non-overlapping slots on 12 distinct panels P01..P12, all 10:00-11:00"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
