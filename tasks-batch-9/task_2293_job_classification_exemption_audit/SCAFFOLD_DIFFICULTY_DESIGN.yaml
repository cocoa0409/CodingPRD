            - "ExemptionAnalysis.${an_id}.applicable_duty_floor_pct == 50.0"
            - "ExemptionAnalysis.${an_id}.salary_threshold_source == STATE"
            - "ExemptionAnalysis.${an_id}.federal_pass == true"
            - "ExemptionAnalysis.${an_id}.state_pass == false"
            - "ExemptionAnalysis.${an_id}.hce_shortcut_applied == false"
            - "ExemptionAnalysis.${an_id}.outcome == NONEXEMPT"

      - name: back_wage_rounding_order_pinned_round_per_week_before_multiplying
        grounds:
          - calculations.back_wage_exposure
          - entities.BackWageEstimate.fields.week_ot_cents
          - entities.BackWageEstimate.fields.gross_exposure_cents
        distinguishing_aspect: |
          Mode (b) — a pinned evaluation order that changes the arithmetic result. The weekly
          overtime figure 35697.0375 cents is rounded to 35697 BEFORE being multiplied by
          156 weeks and 2 incumbents, giving 11137464. Multiplying first and rounding once at
          the end gives 11137476, a 12-cent difference; the assert pins the correct value and
          the incorrect one so the ordering is genuinely tested.
        test_recipe:
          setup:
            - "Identical setup to back_wage_full_rate_versus_half_time_diverge_on_identical_case: CA StateRule with back_wage_lookback_weeks_override 156, WILLFUL_3Y project, Position with weekly_salary_cents 105769, incumbent_count 2, validated_weekly_hours 49, and one ReclassificationCase with no estimate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, liquidated_damages_multiplier: 1.0, reclass_notice_days: 7, back_wage_lookback_weeks_override: 156 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "WILLFUL_3Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
