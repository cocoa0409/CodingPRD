        title: "Aggregate ceiling of three simultaneous non-exclusive licensees, and the slot recycles when one is blocked"
        resource: "RightsWindow non-exclusive capacity on key (t1, VOD, US) over 2026-10-01..2026-10-31"
        interval_semantics: "Same half-open [start, end) comparator as RT-1, but the constraint is a COUNT (|neighbours| + 1 > MAX_CONCURRENT_NONEXCLUSIVE = 3) rather than pairwise exclusion, and only CLEARED/ACTIVE rows occupy."
