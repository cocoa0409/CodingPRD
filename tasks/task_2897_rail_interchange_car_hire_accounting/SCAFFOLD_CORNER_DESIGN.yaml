              as_user_id: "${cx_id}"
              captures: { cycle_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway Company" }
              as: ClearinghouseAdmin
              captures: { e_mark: "$.data.error_id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, cushioned", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2500 }
              as: ClearinghouseAdmin
              captures: { e_code: "$.data.error_id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange South", road_a_id: "${bn_id}", road_b_id: "${cx_id}" }
              as: ClearinghouseAdmin
              captures: { e_junction: "$.data.error_id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { e_car: "$.data.error_id" }
            - call: "POST /car-hire/settlement-cycles"
              payload: { payer_road_id: "${bn_id}", payee_road_id: "${cx_id}", period_month: "2026-08" }
