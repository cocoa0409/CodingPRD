      - name: no_role_reaches_another_roles_exclusive_operation
        claim_type: Cross-role Denial
        grounds:
          - errors.ERR_UNAUTHORIZED
          - validations.priority_4_role_not_permitted
        distinguishing_aspect: >-
          Authorisation is per endpoint, not per seniority: PlatformAdmin is the most powerful
          role yet still cannot triage feedback or investigate a case, and DevRelManager cannot
          decide the application it just reviewed. Because a call carrying a role outside an
          endpoint's roles list cannot be expressed as a valid structured call, each denial is
          asserted as a role substitution on an otherwise identical request, and the check must
          land before any state precondition — the denial is returned even when the target
          resource is in exactly the right state.
        test_recipe:
          setup:
            - "the pipeline of the previous instance, with A1 UNDER_REVIEW, case C1 OPENED and feedback item F1 SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
