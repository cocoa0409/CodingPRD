          trigger:
            - call: "POST /returns/${ret_a}/approve"
              payload: {}
              as: CreditManager
            - call: "POST /returns/${ret_b}/reject"
              payload: {}
              as: CreditManager
          assert:
            - "Return.${ret_a}.status == APPROVED"
            - "Return.${ret_a}.credit_amount_cents == 400"
            - "Return.${ret_b}.status == REJECTED"
            - "Return.${ret_b}.credit_amount_cents == 0"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: issue_credit_cascade_return_to_customer_to_order_depth3
        grounds:
          - state_machines.Return.APPROVED_to_CREDITED
          - state_machines.Customer.CREDIT_HOLD_to_ACTIVE
          - state_machines.Order.SUBMITTED_to_SUBMITTED
          - entities.Customer.fields.ar_balance_cents
          - entities.Customer.fields.ar_status
        distinguishing_aspect: |
          Depth-3 cascade triggered by issue-credit: Return CREDITED reduces Customer.ar_balance (link1),
          which because it drops at/under credit_limit flips Customer CREDIT_HOLD->ACTIVE (link2 caused by link1),
          which in turn flips that customer's ON_HOLD order's credit_status->PENDING (link3 caused by link2).
        test_recipe:
          setup:
            - "Customer C credit_limit 12000. Order O1 delivered with order_total 11000 (5 cases @2200) -> ar_balance 11000."
            - "Order O2 (3 cases -> 6600) submitted then approved over limit (11000+6600>12000) -> credit_status ON_HOLD, no AR add."
            - "Customer placed on manual CREDIT_HOLD so ar_status==CREDIT_HOLD when issue-credit fires."
            - "Return on O1 36 splits OVERAGE approved: per_split=round(11000/60)=183, goods=6588, fee=round(6588*0.15)=988, credit=5600."
            - "issue-credit reduces ar_balance 11000->5400 (<=12000), releases the hold, and O2 (6600<=12000-5400) returns to PENDING."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2200 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 120 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 12000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v0: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 5 }
              as: SalesRep
              captures: { o1_line: $.data.id }
            - call: "POST /orders/${o1}/submit"
              payload: {}
              as: SalesRep
              captures: { o1_v: $.data.version }
            - call: "POST /orders/${o1}/approve-credit"
              payload: { expected_customer_version: "${cust_v0}" }
              as: CreditManager
            - call: "POST /orders/${o1}/start-pick"
              payload: {}
              as: WarehouseOp
            - call: "GET /shipments"
              payload: { order_id: "${o1}" }
              as: WarehouseOp
              captures: { o1_ship: $.data.0.id }
            - call: "POST /shipments/${o1_ship}/load"
              payload: {}
              as: WarehouseOp
            - call: "POST /shipments/${o1_ship}/pod"
              payload: { pod_signature: "Sig1" }
              as: WarehouseOp
            - call: "GET /customers/${cust}"
              payload: {}
              as: SalesRep
              captures: { cust_v1: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-24T00:00:00Z" }
              as: SalesRep
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 3 }
              as: SalesRep
              captures: { o2_line: $.data.id }
            - call: "POST /orders/${o2}/submit"
              payload: {}
              as: SalesRep
              captures: { o2_v: $.data.version }
            - call: "POST /orders/${o2}/approve-credit"
              payload: { expected_customer_version: "${cust_v1}" }
              as: CreditManager
              captures: { o2_credit_status: $.data.credit_status }
            - call: "POST /customers/${cust}/credit-hold"
              payload: {}
              as: CreditManager
            - call: "POST /returns"
              payload: { customer_id: "${cust}", order_id: "${o1}", order_line_id: "${o1_line}", reason: "OVERAGE", return_splits: 36 }
              as: CreditManager
