      - name: conversion_gates_reject_over_allowance_zero_request_and_frozen_lots
        claim_type: violation_error
        grounds:
          - validations[priority=52]
          - validations[priority=53]
          - errors.ERR_CONVERSION_ALLOWANCE_EXCEEDED
          - errors.ERR_CONVERSION_NOT_PERMITTED
          - calculations.cook_conversion_recovery
        distinguishing_aspect: |
          Cook-and-sell approval passes through the allowance ceiling first and the eligibility
          triple second: 7.000 kg against a 6.000 kg allowance is ALLOWANCE_EXCEEDED, a request
          of 0.000 kg is NOT_PERMITTED, and a previously-frozen lot is NOT_PERMITTED even when
          the requested weight sits comfortably under its allowance -- three refusals across
          two codes on the same endpoint.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Atlantic Cod lot A of 10.000 kg, previously_frozen false, fresh_claim true, cased into slot 1"
            - "Atlantic Cod lot B of 10.000 kg, previously_frozen true, fresh_claim false, cased into slot 2"
            - "three VALUED UNSOLD_FRESH ShrinkEvents: A with 8.000 kg requesting 7.000 kg, A with 2.000 kg requesting nothing, B with 5.000 kg requesting 2.000 kg"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
