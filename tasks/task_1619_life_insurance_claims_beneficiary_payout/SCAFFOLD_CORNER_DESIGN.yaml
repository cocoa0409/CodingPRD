            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${d1}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc1: $.data.id } }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${d2}", claimant_name: "Bob Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc2: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc1}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
