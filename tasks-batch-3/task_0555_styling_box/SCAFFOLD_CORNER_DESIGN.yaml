# =============================================================================
# task_0555_styling_box — §1.9 Scaffold Corner Design (breadth coverage)
# Enumerates testable claims of §1.1–§1.7 not covered by §1.8. Same 7-point
# per-instance contract. Bogus UUID literal used for not-found cases:
# 00000000-0000-4000-8000-000000000000
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: create_client_returns_201_prospect
        claim_type: Creation
        grounds: [entities.Client.fields.status, endpoints]
        distinguishing_aspect: "POST /clients with required fields returns 201 with status==PROSPECT and cadence defaulting to MONTHLY."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
          assert:
            - "HTTP 201; Client.${c}.status == PROSPECT; cadence == MONTHLY; version == 1"

      - name: create_client_missing_region_returns_validation
        claim_type: Required Fields
        grounds: [entities.Client.fields.region_code, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /clients without region_code (required, no default) returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 422; data.error_id == ERR_VALIDATION"

      - name: create_client_bad_region_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Client.fields.region_code, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /clients with region_code not in {CA,NY,OR} returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "TX" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 422; data.error_id == ERR_VALIDATION"

      - name: get_client_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Client, "errors[ERR_CLIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /clients/{bogus} returns 404 ERR_CLIENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /clients/00000000-0000-4000-8000-000000000000", payload: {}, as: OpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404; data.error_id == ERR_CLIENT_NOT_FOUND"

      - name: product_system_counts_initialized_on_create
        claim_type: Computed Fields
        grounds: [entities.Product.fields.available_count, entities.Product.fields.reserved_count, entities.Product.fields.sold_count]
        distinguishing_aspect: "POST /products with total_stock=7 yields available_count==7, reserved_count==0, sold_count==0, status==ACTIVE — client-supplied count fields (if any) ignored."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /products", payload: { sku: "P", name: "P", category: "TOP", size: 8, price_cents: 3000, total_stock: 7 }, as: OpsAdmin, captures: { p: $.data.id } }
          assert:
            - "HTTP 201; Product.${p}.available_count == 7, reserved_count == 0, sold_count == 0, status == ACTIVE"

      - name: style_profile_defaults_learned_to_quiz
        claim_type: Defaults
        grounds: [entities.StyleProfile.fields.learned_top_size, entities.StyleProfile.fields.fit_confidence]
        distinguishing_aspect: "Completing the quiz seeds learned_top_size=quiz_top_size (e.g. 9), learned_shoe_size=quiz_shoe_size, fit_confidence=0, feedback_count=0 before any feedback."
        test_recipe:
          setup: ["Client registered (PROSPECT)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 9, quiz_bottom_size: 10, quiz_shoe_size: 11, price_tier: "PREMIUM" }, as: Client, as_user_id: "${c}", captures: { sp: $.data.id } }
          assert:
            - "HTTP 201; StyleProfile.${sp}.learned_top_size == 9, learned_shoe_size == 11, fit_confidence == 0, feedback_count == 0"

  # ------------------------------------------------------------ State machines
  - section: state_machines
    instances:
      - name: checkout_on_non_delivered_fix_returns_not_delivered
        claim_type: Invalid Transitions
        grounds: [state_machines.Fix.DELIVERED_to_CHECKED_OUT, "errors[ERR_FIX_NOT_DELIVERED]"]
        distinguishing_aspect: "Checkout on a fix still in STYLING returns 409 ERR_FIX_NOT_DELIVERED; no items transition."
        test_recipe:
          setup: ["CA client ACTIVE with a STYLING fix (assigned, no checkout possible)."]
          setup_api_calls:
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
          trigger:
            - { call: "POST /fixes/${fix}/checkout", payload: { kept_item_ids: [] }, as: Client, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; data.error_id == ERR_FIX_NOT_DELIVERED"

      - name: ship_twice_second_returns_not_preview
        claim_type: Idempotency
        grounds: [state_machines.Fix.PREVIEW_to_SHIPPED, "errors[ERR_FIX_NOT_PREVIEW]"]
        distinguishing_aspect: "Shipping an already-SHIPPED fix returns 409 ERR_FIX_NOT_PREVIEW (no second styling-fee charge)."
        test_recipe:
          setup: ["CA client ACTIVE with a fix already SHIPPED (3 items)."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "C", name: "C", category: "SHOE", size: 9, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; data.error_id == ERR_FIX_NOT_PREVIEW"

      - name: request_changes_on_cancelled_fix_returns_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Fix, "errors[ERR_FIX_TERMINAL]"]
        distinguishing_aspect: "request-changes on a CANCELLED fix returns 409 ERR_FIX_TERMINAL (terminal lockdown precedes the PREVIEW-state check)."
        test_recipe:
          setup: ["CA client ACTIVE; a REQUESTED fix cancelled by client cancel (fix -> CANCELLED)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /clients/${c}/cancel", payload: {}, as: Client, as_user_id: "${c}" }
          trigger:
            - { call: "POST /fixes/${fix}/request-changes", payload: {}, as: Client, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; data.error_id == ERR_FIX_TERMINAL"

      - name: assign_on_non_requested_fix_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Fix.REQUESTED_to_STYLING, "errors[ERR_FIX_NOT_STYLING]"]
        distinguishing_aspect: "Assigning an already-STYLING fix returns 409 (fix not in REQUESTED); a second assign is rejected."
        test_recipe:
          setup: ["CA client ACTIVE with a fix already assigned (STYLING)."]
          setup_api_calls:
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
          trigger:
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; data.error_id in {ERR_FIX_NOT_STYLING, ERR_FIX_TERMINAL} — fix already STYLING is not REQUESTED"

      - name: cancel_blocked_by_inflight_shipped_fix
        claim_type: Precondition Enforcement
        grounds: [state_machines.Client.ACTIVE_to_CANCELLED, "errors[ERR_CLIENT_HAS_INFLIGHT_FIX]"]
        distinguishing_aspect: "Cancelling a client with a SHIPPED fix returns 409 ERR_CLIENT_HAS_INFLIGHT_FIX; the client stays ACTIVE."
        test_recipe:
          setup: ["CA client ACTIVE with a fix in SHIPPED (3 items)."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "C", name: "C", category: "SHOE", size: 9, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /clients/${c}/cancel", payload: {}, as: Client, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; data.error_id == ERR_CLIENT_HAS_INFLIGHT_FIX; Client.${c}.status == ACTIVE"

      - name: skip_without_pending_fix_returns_no_pending
        claim_type: Precondition Enforcement
        grounds: [endpoints, "errors[ERR_NO_PENDING_FIX]"]
        distinguishing_aspect: "Skip on an ACTIVE client with no REQUESTED fix returns 409 ERR_NO_PENDING_FIX."
        test_recipe:
          setup: ["CA client ACTIVE with no scheduled fix."]
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
          trigger:
            - { call: "POST /clients/${c}/skip", payload: {}, as: Client, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; data.error_id == ERR_NO_PENDING_FIX"

      - name: profile_completed_twice_returns_exists
        claim_type: Precondition Enforcement
        grounds: [state_machines.Client.PROSPECT_to_ACTIVE, "errors[ERR_STYLEPROFILE_EXISTS]"]
        distinguishing_aspect: "Completing the quiz on an already-ACTIVE client returns 409 ERR_STYLEPROFILE_EXISTS."
        test_recipe:
          setup: ["CA client ACTIVE (profile already completed)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
          trigger:
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 9, quiz_bottom_size: 9, quiz_shoe_size: 10, price_tier: "BUDGET" }, as: Client, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; data.error_id == ERR_STYLEPROFILE_EXISTS"

      - name: submit_preview_too_few_items_returns_too_few
        claim_type: Precondition Enforcement
        grounds: [state_machines.Fix.STYLING_to_PREVIEW, "errors[ERR_FIX_TOO_FEW_ITEMS]"]
        distinguishing_aspect: "submit-preview with only 2 items (< MIN_ITEMS 3) returns 422 ERR_FIX_TOO_FEW_ITEMS."
        test_recipe:
          setup: ["CA client ACTIVE with a STYLING fix holding 2 items."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}" }
          trigger:
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 422; data.error_id == ERR_FIX_TOO_FEW_ITEMS"

      - name: return_receive_restocks_and_closes_fix
        claim_type: Side Effect Execution
        grounds: [state_machines.ReturnShipment.LABEL_ISSUED_to_RECEIVED, state_machines.Fix.CHECKED_OUT_to_CLOSED, calculations.inventory_counts]
        distinguishing_aspect: "Receiving the return of a fix that kept 1 of 3 items restocks the 2 returned items (each Product reserved->available) and closes the fix."
        test_recipe:
          setup: ["CA client checked out a 3-item fix keeping only item1; a ReturnShipment (LABEL_ISSUED) covers items 2 and 3."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "C", name: "C", category: "SHOE", size: 9, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}", captures: { i1: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/mark-delivered", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/checkout", payload: { kept_item_ids: ["${i1}"] }, as: Client, as_user_id: "${c}" }
            - { call: "GET /fixes/${fix}/returns", payload: {}, as: OpsAdmin, captures: { ret: "$.data[0].id" } }
          trigger:
            - { call: "POST /fixes/${fix}/returns/${ret}/receive", payload: {}, as: OpsAdmin }
          assert:
            - "ReturnShipment.${ret}.status == RECEIVED; Fix.${fix}.status == CLOSED"
            - "Product.${p2}.available_count == 5, reserved_count == 0; Product.${p3}.available_count == 5, reserved_count == 0"

      - name: run_checkout_sweep_autocheckout_keepall
        claim_type: Side Effect Execution
        grounds: [state_machines.Fix.DELIVERED_to_CHECKED_OUT, endpoints]
        distinguishing_aspect: "run-checkout-sweep after the deadline auto keeps-all a DELIVERED 3-item fix (subtotal 9000): buy_the_look_applied=true, fix CLOSED."
        test_recipe:
          setup: ["CA client with a 3-item fix (each 3000) DELIVERED at default clock; clock advanced past the deadline."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "C", name: "C", category: "SHOE", size: 9, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
