            - "the owning Creator can enroll a second member with 201"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_item_version_on_revenue_routing_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[route-create-stale-item]
          - endpoints.POST_/api/revenue-routings
        distinguishing_aspect: "Routing against a content item whose version was advanced by the previous routing is rejected with 412 ERR_STALE_VERSION — the OCC check is observable with two strictly sequential calls."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel approved with a reviewed item carrying version 1."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Stale Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_sl: $.data.id }
            - call: "POST /api/channels/${ch_sl}/content-items"
              payload: { title: "Stale Item", duration_seconds: 300, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_sl}"
              captures: { i_sl: $.data.id }
            - call: "POST /api/channels/${ch_sl}/content-items/${i_sl}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_sl}"
            - call: "GET /api/content-items/${i_sl}"
              payload: {}
              as: Any
              captures: { i_slv: $.data.version }
          trigger:
            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_sl}", stream_type: "AD", gross_revenue_cents: 1000, expected_content_item_version: "${i_slv}" }
              as: PlatformAdmin
            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_sl}", stream_type: "AD", gross_revenue_cents: 1000, expected_content_item_version: "${i_slv}" }
              as: PlatformAdmin
              captures: { e_stale: $.data.error_id }
          assert:
            - "the first routing returns 201 and advances ContentItem.${i_sl}.version beyond ${i_slv}"
            - "the second routing returns 412 with error_id ERR_STALE_VERSION"
            - "the item still carries exactly one RevenueRouting"

      - name: takedown_cascade_executes_in_the_declared_hop_order
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Claim.APPEALED_to_TAKEN_DOWN
