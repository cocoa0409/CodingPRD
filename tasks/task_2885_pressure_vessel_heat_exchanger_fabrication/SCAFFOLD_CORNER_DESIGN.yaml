      - name: validation_cross_entity_expired_certificate_blocks_new_job
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=62]
          - errors[ERR_CERTIFICATE_EXPIRED]
          - calculations.certificate_posture
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Job creation depends on the posture of a DIFFERENT entity evaluated against the logical clock: the same POST /vessel-jobs body that succeeds while the certificate is ACTIVE must fail with ERR_CERTIFICATE_EXPIRED once the clock passes expires_on, and a second, still-current certificate must keep working in the same breath — so the gate is per-certificate, not global."
        test_recipe:
          setup:
            - "Certificate CA-U-8922 runs 2026-01-01 to 2026-09-01 and CA-U-8923 runs 2026-01-01 to 2029-01-01; both are ACTIVE with clean finding counters at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8922", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2026-09-01" }
              as: ShopAdmin
              captures: { cert_short: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8923", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
              captures: { cert_long: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_short}", job_number: "J-2885-C37", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_before: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00.000Z" }
              as: ShopAdmin
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_short}", job_number: "J-2885-C38", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { e_expired: $.data.error_id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_long}", job_number: "J-2885-C39", customer_name: "Northline Energy", vessel_type: "HEAT_EXCHANGER", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_after: $.data.id }
          assert:
            - "Before the clock move the identical body succeeded: VesselJob.${job_before}.status == DRAFT on certificate ${cert_short}"
            - "After the clock move CertificateOfAuthorization.${cert_short}.status == EXPIRED and stamping_authorized == false"
            - "HTTP 409 and ${e_expired} == ERR_CERTIFICATE_EXPIRED for the job attempted on the expired certificate"
            - "The unrelated certificate still works: VesselJob.${job_after}.status == DRAFT with required_test_sides == [SHELL_SIDE, TUBE_SIDE] for its HEAT_EXCHANGER type"
            - "GET /vessel-jobs?certificate_id=${cert_short} with limit 10 and offset 0 returns total_count == 1, so the refused create wrote nothing"

      - name: validation_temporal_furnace_window_conflict_detected_at_schedule_time
        claim_type: Temporal validation
        grounds:
          - validations[priority=100]
          - errors[ERR_FURNACE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_furnace_cooldown_buffer_boundaries_both_directions
          rationale: "That §1.8 instance probes the 180-minute cooldown buffer on both sides of an existing charge at one-minute resolution — inside the buffer, exactly on the boundary and just outside — which is the whole temporal-validation surface for the furnace scheduler."

      - name: validation_aggregate_test_bay_capacity_exceeded_by_the_collective
        claim_type: Aggregate validation
        grounds:
          - validations[priority=100]
          - errors[ERR_TEST_BAY_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_test_bay_half_open_windows_with_aggregate_capacity
          rationale: "Each individual hydrostatic window there is legal while the third overlapping one breaches the aggregate limit of two, and the pneumatic case takes the bay exclusively — exactly the each-valid-but-collectively-over claim, including the half-open boundary where windows merely touch."

      - name: validation_priority_conflict_between_state_and_safety_rules
        claim_type: Priority conflict
        grounds:
          - validations[priority=55]
          - validations[priority=64]
        excluded_because:
          difficulty_instance: priority_pair_job_state_outranks_lapsed_welder_on_weld_completion
          rationale: "That instance runs the full 2x2 truth table on one endpoint for a priority-55 versus priority-64 pair, including the cell that proves the masked rule is live, which is strictly more than a single priority-conflict corner."

      - name: validation_cascading_shape_gate_runs_before_the_scheduler
        claim_type: Cascading validation
        grounds:
          - validations[priority=88]
          - validations[priority=100]
          - errors[ERR_EMPTY_WELD_SET]
        excluded_because:
          difficulty_instance: priority_pair_empty_weld_set_outranks_furnace_window_conflict
          rationale: "The dependency runs one way — the priority-100 window check cannot even be evaluated for a charge with no welds, since the soak aggregation over max(weld.thickness_in) would be undefined — and that instance asserts the priority-88 refusal in exactly the cell where both rules are violated, proving the earlier check runs first."

