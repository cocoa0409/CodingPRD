      - name: error_response_envelope_shape_not_found
        claim_type: response_envelope
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Error responses carry meta.api_request_id, response_type 'error', and data.error_id/data.message; success responses carry response_type 'object' and data."
