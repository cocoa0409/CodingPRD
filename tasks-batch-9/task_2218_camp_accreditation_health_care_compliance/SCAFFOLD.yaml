  - method: GET
    path: "/accreditation/deficiencies/{deficiencyId}"
    description: "fetch one deficiency with its severity, base_points, penalty_points and correction_due_date"
    roles: [CampDirector, AccreditationOfficer]
    code: 200
    input: []
