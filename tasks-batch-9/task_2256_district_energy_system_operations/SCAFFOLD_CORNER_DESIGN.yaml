              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-P", name: "Parkside Loop P", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1350.0, rated_capacity_kw: 5000.0 }
