            - "ShipAndDebitClaim.${claim_d}.amount_final_cents == 3000 (audited defaults to registered 700: 10 * (1000 - 700))"
            - "ShipAndDebitClaim.${claim_d}.amount_provisional_cents == 3000"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: msl_quarantine_cascade_depth3
        grounds:
          - state_machines.InventoryLot.AVAILABLE_to_QUARANTINED
          - state_machines.OrderLine.ALLOCATED_to_OPEN
          - calculations.msl_exposure_accrual
          - calculations.order_exposure
        distinguishing_aspect: |
          Depth-3 causal chain triggered by POST /_clock/set_current_utc: lot
          quarantine (link 1) forces reservation release which deallocates the
          order line ALLOCATED -> OPEN (link 2), which itself triggers the
          order's allocated_value_cents recompute 90000 -> 0 (link 3) — a
          different trigger and propagation pattern than the claim-reverse
          cascade.
        test_recipe:
          setup:
            - "Part floor_life_hours 100; lot of 100 AVAILABLE; order line qty 60 ACKNOWLEDGED and ALLOCATED (lot reserved 60 / on_hand 40; order.allocated_value_cents == 90000)"
            - "Exposure opened at 2026-08-01T00:00:00Z; clock advanced 100 hours"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-Q", name: "Quarantine Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_q: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_q}", part_number: "PQ-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_q: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_q}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { lot_q: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust Q", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_q: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_q}", lines: [ { part_id: "${part_q}", quantity: 60, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_q: $.data.id }
            - call: "POST /orders/${o_q}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_q}"
              as: DistributorAdmin
              captures: { l_q: "$.data[0].id" }
            - call: "GET /parts/${part_q}"
              as: DistributorAdmin
              captures: { part_q_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_q}", expected_part_version: "${part_q_v}" }
              as: DistributorAdmin
              captures: { run_q: $.data.id }
            - call: "POST /allocation-runs/${run_q}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /lots/${lot_q}/exposures"
              payload: { note: "opened for kitting" }
              as: WarehouseOps
            - call: "GET /orders/${o_q}"
              as: DistributorAdmin
              captures: { o_q_v_pre: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T04:00:00Z" }
              as: DistributorAdmin
          assert:
            - "InventoryLot.${lot_q}.status == QUARANTINED and .msl_exposure_hours == 100 (link 1)"
            - "InventoryLot.${lot_q}.qty_on_hand == 100 and .qty_reserved == 0 (reservation release)"
            - "OrderLine.${l_q}.status == OPEN and .allocated_qty == 0 (link 2: deallocation caused by the lot quarantine, not by the clock directly)"
            - "CustomerOrder.${o_q}.allocated_value_cents == 0 (link 3: 90000 -> 0 caused by the line deallocation)"
            - "CustomerOrder.${o_q}.open_exposure_cents == 90000 (unchanged: 60 * 1500 still open)"
            - "CustomerOrder.${o_q}.version > ${o_q_v_pre} (cascade bumped the order version)"

      - name: claim_reverse_restore_cascade_depth2
        grounds:
          - state_machines.ShipAndDebitClaim.SETTLED_to_REVERSED
          - state_machines.DesignRegistration.EXHAUSTED_to_APPROVED
          - calculations.debit_balance_reconciliation
        distinguishing_aspect: |
          Depth-2 causal chain triggered by POST /claims/{id}/reverse: the
          reverse restores registration.registered_qty_remaining 0 -> 20
          (link 1), and that restore itself flips the registration EXHAUSTED ->
          APPROVED (link 2) — a different trigger and a quantity-restoration
          propagation, unlike the clock-driven physical cascade.
        test_recipe:
          setup:
            - "Franchised part (standard 1000), lot of 100; APPROVED registration cost 700 max qty 20"
            - "Order line qty 20 allocated and shipped -> claim (qty 20) SUBMITTED, registration EXHAUSTED (remaining 0)"
            - "Claim APPROVED with audited 720 (final 5600) then SETTLED (line open_debit_balance_cents == 5600)"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-V", name: "Reverse Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_v: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_v}", part_number: "PV-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_v: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_v}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust V", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_v: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_v}", part_id: "${part_v}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 20, valid_from: "2026-08-01", valid_to: "2026-12-31" }
              as: SalesRep
              captures: { reg_v: $.data.id }
            - call: "POST /design-registrations/${reg_v}/decision"
              payload: { decision: "APPROVE" }
              as: SupplierAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_v}", lines: [ { part_id: "${part_v}", quantity: 20, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_v: $.data.id }
            - call: "POST /orders/${o_v}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_v}"
              as: DistributorAdmin
              captures: { l_v: "$.data[0].id" }
            - call: "GET /parts/${part_v}"
              as: DistributorAdmin
              captures: { part_v_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_v}", expected_part_version: "${part_v_v}" }
              as: DistributorAdmin
              captures: { run_v: $.data.id }
            - call: "POST /allocation-runs/${run_v}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /orders/${o_v}/lines/${l_v}/ship"
              payload: { qty: 20 }
              as: WarehouseOps
            - call: "GET /claims?order_line_id=${l_v}"
              as: DistributorAdmin
              captures: { claim_v: "$.data[0].id" }
            - call: "POST /claims/${claim_v}/supplier-decision"
              payload: { decision: "APPROVE", audited_cost_cents: 720 }
              as: SupplierAdmin
            - call: "POST /claims/${claim_v}/settle"
              payload: {}
              as: SupplierAdmin
            - call: "GET /manufacturer-lines/${line_v}"
              as: DistributorAdmin
              captures: { line_v_bal_pre: $.data.open_debit_balance_cents }
          trigger:
            - call: "POST /claims/${claim_v}/reverse"
              payload: { reason: "supplier chargeback" }
              as: SupplierAdmin
          assert:
            - "Pre-condition held: ${line_v_bal_pre} == 5600"
            - "ShipAndDebitClaim.${claim_v}.status == REVERSED"
            - "ManufacturerLine.${line_v}.open_debit_balance_cents == 0 (debit compensation)"
            - "DesignRegistration.${reg_v}.registered_qty_remaining == 20 (link 1: restore)"
            - "DesignRegistration.${reg_v}.status == APPROVED (link 2: caused by the remaining-qty restore, not by the reverse directly)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hold_state_beats_temporal_window
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - state_machines.CustomerOrder.ACKNOWLEDGED_to_ON_HOLD
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: the reschedule request
          violates both (order ON_HOLD and reschedule window closed); the
          priority-4 state error ERR_ORDER_ON_HOLD must win over
          ERR_RESCHEDULE_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Line reschedule_window_days 20; part book 1500; lot 100; customer credit_limit_cents 1000"
            - "Order line qty 10 ship_date 2026-08-25 (reschedule deadline 2026-08-05), ACKNOWLEDGED and ALLOCATED"
            - "Failed ship (10 * 1500 = 15000 > 1000) moved the order to ON_HOLD"
            - "Clock at 2026-08-10, past the reschedule deadline"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-H", name: "Hold Line", sourcing_channel: "FRANCHISED", cancel_window_days: 30, reschedule_window_days: 20 }
              as: DistributorAdmin
              captures: { line_h: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_h}", part_number: "PH-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_h: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_h}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust H", credit_limit_cents: 1000 }
              as: DistributorAdmin
              captures: { cust_h: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_h}", lines: [ { part_id: "${part_h}", quantity: 10, ship_date: "2026-08-25" } ] }
              as: SalesRep
              captures: { o_h: $.data.id }
            - call: "POST /orders/${o_h}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_h}"
              as: DistributorAdmin
              captures: { l_h: "$.data[0].id" }
            - call: "GET /parts/${part_h}"
              as: DistributorAdmin
              captures: { part_h_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_h}", expected_part_version: "${part_h_v}" }
              as: DistributorAdmin
              captures: { run_h: $.data.id }
            - call: "POST /allocation-runs/${run_h}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /orders/${o_h}/lines/${l_h}/ship"
              payload: { qty: 10 }
              as: WarehouseOps
              captures: { ship_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistributorAdmin
            - call: "GET /orders/${o_h}"
              as: DistributorAdmin
              captures: { o_h_v: $.data.version }
          trigger:
            - call: "POST /orders/${o_h}/lines/${l_h}/reschedule"
              payload: { new_ship_date: "2026-09-01", expected_order_version: "${o_h_v}" }
              as: SalesRep
              captures: { resch_err: $.data.error_id }
          assert:
            - "${ship_err} == ERR_CREDIT_LIMIT_EXCEEDED and CustomerOrder.${o_h}.status == ON_HOLD"
            - "${resch_err} == ERR_ORDER_ON_HOLD (state priority 4 beats business_temporal priority 7, even though the 2026-08-05 deadline has also passed)"
            - "OrderLine.${l_h}.ship_date remains 2026-08-25 (no partial mutation)"

      - name: safety_beats_fiscal_at_ship
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - calculations.date_code_freshness
          - calculations.credit_check_at_ship
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal: the ship
          request violates both (picked lot's date code is 25 months old vs a
          24-month limit, and the ship value would exceed the credit limit);
          the safety error ERR_DATE_CODE_TOO_OLD must win and the order must
          NOT go ON_HOLD because the fiscal check never runs.
        test_recipe:
          setup:
            - "Part date_code_limit_months 24, book 1500; lot date_code 202408 qty 10 AVAILABLE"
            - "Customer credit_limit_cents 1000; order line qty 5 ship_date 2026-09-10, ACKNOWLEDGED and ALLOCATED at clock 2026-08-01 (lot fresh: 24 months elapsed)"
            - "Clock advanced to 2026-09-01: months_elapsed == 25 > 24 (stale) and ship value 3 * 1500 = 4500 > 1000 (over credit)"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-S", name: "Safety Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_s: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_s}", part_number: "PS-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_s: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_s}", date_code: "202408", qty_received: 10, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { lot_s: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust S", credit_limit_cents: 1000 }
              as: DistributorAdmin
              captures: { cust_s: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_s}", lines: [ { part_id: "${part_s}", quantity: 5, ship_date: "2026-09-10" } ] }
              as: SalesRep
              captures: { o_s: $.data.id }
            - call: "POST /orders/${o_s}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_s}"
              as: DistributorAdmin
              captures: { l_s: "$.data[0].id" }
            - call: "GET /parts/${part_s}"
              as: DistributorAdmin
              captures: { part_s_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_s}", expected_part_version: "${part_s_v}" }
              as: DistributorAdmin
              captures: { run_s: $.data.id }
            - call: "POST /allocation-runs/${run_s}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistributorAdmin
          trigger:
            - call: "POST /orders/${o_s}/lines/${l_s}/ship"
              payload: { qty: 3 }
              as: WarehouseOps
              captures: { ship_err2: $.data.error_id }
          assert:
            - "${ship_err2} == ERR_DATE_CODE_TOO_OLD (business_safety priority 5 beats business_fiscal priority 9)"
            - "CustomerOrder.${o_s}.status == ACKNOWLEDGED (credit check never ran, so no ON_HOLD transition)"
            - "OrderLine.${l_s}.shipped_qty == 0 and InventoryLot.${lot_s}.qty_reserved == 5 (no partial side effects)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: cancel_window_exact_boundary
        grounds:
          - state_machines.OrderLine.OPEN_to_CANCELLED
          - entities.OrderLine.fields.cancel_by_date
          - errors[ERR_CANCEL_WINDOW_CLOSED]
        distinguishing_aspect: |
          Temporal boundary on the cancel endpoint: cancellation is allowed iff
          now < cancel_by_date (strict); at exactly cancel_by_date it is
          rejected — a time-window metric on POST .../cancel, unlike the
          monetary percentage-cap metric on POST /buy-backs.
        test_recipe:
          setup:
            - "Line cancel_window_days 30; two identical ACKNOWLEDGED orders each with one OPEN line qty 5 ship_date 2026-10-01 (cancel_by_date 2026-09-01)"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-C", name: "Cancel Line", sourcing_channel: "FRANCHISED", cancel_window_days: 30, reschedule_window_days: 20 }
              as: DistributorAdmin
              captures: { line_c2: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_c2}", part_number: "PC-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_c: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust C2", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_c2: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_c2}", lines: [ { part_id: "${part_c}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_c1: $.data.id }
            - call: "POST /orders/${o_c1}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust_c2}", lines: [ { part_id: "${part_c}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_c2: $.data.id }
            - call: "POST /orders/${o_c2}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_c1}"
              as: DistributorAdmin
              captures: { l_c1: "$.data[0].id" }
            - call: "GET /order-lines?order_id=${o_c2}"
              as: DistributorAdmin
              captures: { l_c2b: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:00Z" }
              as: DistributorAdmin
          trigger:
            - call: "POST /orders/${o_c2}/lines/${l_c2b}/cancel"
              payload: {}
              as: SalesRep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /orders/${o_c1}/lines/${l_c1}/cancel"
              payload: {}
              as: SalesRep
              captures: { cancel_err: $.data.error_id }
          assert:
            - "At 2026-08-31T23:59:00Z (< cancel_by_date): OrderLine.${l_c2b}.status == CANCELLED"
            - "At exactly 2026-09-01T00:00:00Z (== cancel_by_date): ${cancel_err} == ERR_CANCEL_WINDOW_CLOSED and OrderLine.${l_c1}.status == OPEN"
            - "OrderLine.${l_c1}.cancel_by_date == 2026-09-01 (ship_date 2026-10-01 minus 30 days)"

      - name: buyback_cap_inclusive_boundary
        grounds:
          - calculations.buyback_cap_check
          - calculations.buyback_credit
          - errors[ERR_BUYBACK_CAP_EXCEEDED]
        distinguishing_aspect: |
          Monetary percentage boundary on the buy-back endpoint: the 15%
          trailing-purchases cap is inclusive — landing exactly on the cap
          (148500 cents) succeeds while one unit of credit over it fails — a
          fiscal-threshold metric on POST /buy-backs, unlike the temporal
          cancel-window metric.
        test_recipe:
          setup:
            - "Customer trailing_12mo_purchases_cents 990000 -> cap floor(0.15 * 990000) == 148500"
            - "One line qty 200 SHIPPED at the default clock 2026-08-01 (unit price 1500); per-unit excess credit at tier 1 == 1350"
            - "bb1 qty 109 APPROVED (used 147150); clock remains at the 2026-08-01 default (day 0, tier 1)"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-K", name: "Cap Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_k: $.data.id }
            - call: "POST /parts"
