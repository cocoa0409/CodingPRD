- section: errors
  instances:
  - name: err_unauthenticated_missing_or_unknown_role_header_is_rejected
    claim_type: error_triggerable
    grounds: ['errors[ERR_UNAUTHENTICATED]', validations.priority_1, response_envelope]
    distinguishing_aspect: 'The auth check at priority 1 fires before everything else: a request with
      no X-User-Role, a request with no X-User-ID and a request carrying a role outside the six declared
      roles all return 401 ERR_UNAUTHENTICATED, even when the body and the target id are perfectly valid.'
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', empty database]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      trigger:
      - call: POST /comics/titles
        payload: {name: Nebula Knights, planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500}
        as: (none — X-User-Role header omitted on purpose)
        captures: {e1: $.data.error_id}
      - call: POST /comics/titles
        payload: {name: Nebula Knights, planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500}
        as: Publisher
        captures: {e2: $.data.error_id}
      - call: GET /comics/titles
        payload: {limit: 100, offset: 0}
        as: EditorInChief
      assert: ['first trigger (no X-User-Role header): 401 with error_id == ERR_UNAUTHENTICATED', 'second
          trigger (X-User-Role: Publisher, not one of the six roles): 401 with error_id == ERR_UNAUTHENTICATED',
        an otherwise identical request that omits X-User-ID is also 401 ERR_UNAUTHENTICATED, 'the third
          call proves no Title row was created: total_count == 0', 'every 401 body is the error envelope
          { response_type: ''error'', data: { error_id, message } }']
  - name: err_not_found_family_returns_the_resource_specific_error_id
    claim_type: error_triggerable
    grounds: [validations.priority_4, validations.priority_5, 'errors[ERR_CREATOR_NOT_FOUND]', 'errors[ERR_ASSIGNMENT_NOT_FOUND]',
      'errors[ERR_STAGE_NOT_FOUND]', 'errors[ERR_CATALOG_NOT_FOUND]', 'errors[ERR_RETAILER_NOT_FOUND]',
      'errors[ERR_ORDER_NOT_FOUND]', 'errors[ERR_PRINT_RUN_NOT_FOUND]', 'errors[ERR_STATEMENT_NOT_FOUND]']
    distinguishing_aspect: 'Each resource family has its OWN 404 code rather than a shared generic one:
      eight absent ids across eight paths return eight distinct error_ids, and the body-referenced creator_id
      case (priority 5) is distinguished from the path cases (priority 4).'
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', one GREENLIT title so the body-reference case can
          reach priority 5 with a resolvable path]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
