scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: budget_forecast_provisional_vs_final_on_budgetline
        grounds:
          - calculations.calc_budget_forecast
          - entities.BudgetLine.fields.forecast_cents
          - entities.BudgetLine.fields.forecast_variant
        distinguishing_aspect: |
          Entity domain = BudgetLine (fiscal forecasting). The PROVISIONAL variant
          prorates active differentials over 11 remaining months and weights the
          SUBMITTED-claim pipeline at 0.80, while the FINAL variant counts only
          PAID actuals — identical unit data yields 960000 vs 680000 cents.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z (FY2027 opened 2026-07-01; 11 months remain incl. August)"
            - "BudgetLine for unit ICU-4W FY2027 with allocated 2000000"
            - "Nurse N1 in ICU-4W advanced to CN_II (differential 30000/mo ACTIVE at CN_II criterion)"
            - "N1's certification bonus 150000 ACCRUED unpaid; N1's claim 120000 APPROVED unpaid"
            - "A second claim of 50000 PAID inside FY2027 (drives FINAL actuals term)"
            - "committed_cents = 360000 + 120000 + 150000 = 630000"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/budget-lines"
              payload: { unit: "ICU-4W", fiscal_year: 2027, allocated_cents: 2000000 }
              as: ProgramAdmin
              captures: { bl_id: $.data.id }
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-1", full_name: "Nurse One", hire_date: "2020-01-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { n1_id: $.data.id, n1_v: $.data.version }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-R1", full_name: "Rev One", hire_date: "2019-01-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { rev1_id: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-R2", full_name: "Rev Two", hire_date: "2019-01-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { rev2_id: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-R3", full_name: "Rev Three", hire_date: "2019-01-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { rev3_id: $.data.id }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${n1_id}", target_level: "CN_II", portfolio_narrative: "portfolio", expected_nurse_version: "${n1_v}" }
              as: Nurse
              as_user_id: "${n1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /clinical-ladder/applications/${app1_id}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${n1_id}"
            - call: "POST /clinical-ladder/applications/${app1_id}/assignments"
              payload: { reviewer_nurse_id: "${rev1_id}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${app1_id}/assignments"
              payload: { reviewer_nurse_id: "${rev2_id}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${app1_id}/assignments"
              payload: { reviewer_nurse_id: "${rev3_id}" }
              as: ProgramAdmin
            - call: "GET /clinical-ladder/applications/${app1_id}/assignments"
              payload: {}
              as: ProgramAdmin
              captures: { asg1: "$.data[0].id", asg2: "$.data[1].id", asg3: "$.data[2].id" }
            - call: "POST /clinical-ladder/review-assignments/${asg1}/score"
              payload: { dimension_scores: { leadership: 75, clinical_expertise: 75, professional_development: 75, outcomes: 75 } }
              as: Nurse
              as_user_id: "${rev1_id}"
            - call: "POST /clinical-ladder/review-assignments/${asg2}/score"
              payload: { dimension_scores: { leadership: 75, clinical_expertise: 75, professional_development: 75, outcomes: 75 } }
              as: Nurse
              as_user_id: "${rev2_id}"
            - call: "POST /clinical-ladder/review-assignments/${asg3}/score"
              payload: { dimension_scores: { leadership: 75, clinical_expertise: 75, professional_development: 75, outcomes: 75 } }
              as: Nurse
              as_user_id: "${rev3_id}"
            - call: "GET /clinical-ladder/applications/${app1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { app1_v: $.data.version }
            - call: "POST /clinical-ladder/applications/${app1_id}/decide"
              payload: { outcome: "APPROVE", expected_application_version: "${app1_v}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${n1_id}", track: "SPECIALTY", certifying_body: "ANCC", exam_fee_cents: 200000, obtained_on: "2026-07-15T00:00:00Z", expires_on: "2029-07-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { cert1_id: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${cert1_id}", claimed_amount_cents: 120000 }
              as: Nurse
              as_user_id: "${n1_id}"
              captures: { claim1_id: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims/${claim1_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${cert1_id}", claimed_amount_cents: 50000 }
              as: Nurse
              as_user_id: "${n1_id}"
              captures: { claim2_id: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims/${claim2_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /clinical-ladder/reimbursement-claims/${claim2_id}/pay"
              payload: {}
              as: PayrollOfficer
          trigger:
            - call: "GET /clinical-ladder/budget-lines/${bl_id}"
              payload: {}
              as: ProgramAdmin
              captures: { forecast_prov: $.data.forecast_cents, committed_now: $.data.committed_cents }
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/_ops/run_cycle"
              payload: {}
              as: ProgramAdmin
            - call: "GET /clinical-ladder/budget-lines/${bl_id}"
              payload: {}
              as: ProgramAdmin
              captures: { forecast_final: $.data.forecast_cents, variant_final: $.data.forecast_variant }
          assert:
            - "committed_now == 630000"
            - "forecast_prov == 960000"
            - "variant_final == FINAL"
            - "forecast_final == 680000"
            - "forecast_prov != forecast_final"

      - name: participation_snapshot_vs_live_on_application
        grounds:
          - calculations.calc_participation_window
          - entities.Application.fields.participation_snapshot_points
        distinguishing_aspect: |
          Entity domain = Application/ParticipationEvent (engagement accounting),
          distinct from BudgetLine fiscal forecasting. The snapshot variant freezes
          the 24-month VERIFIED sum at submit; the live variant recomputed at
          decision time includes events verified between submit and decision —
          identical nurse history yields 10 (snapshot) vs 15 (live) points.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z"
            - "Active CN_II criterion with min_participation_points = 10, required_certification_track NONE"
            - "Nurse N with one VERIFIED event of 10 points at 2026-01-15 (inside window)"
            - "One PENDING_VERIFICATION event of 5 points at 2026-02-15, verified AFTER submit"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 10, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-10", full_name: "Snap Nurse", hire_date: "2018-06-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { sn_id: $.data.id, sn_v: $.data.version }
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${sn_id}", event_kind: "QI_PROJECT", points: 10, occurred_on: "2026-01-15T00:00:00Z" }
              as: Nurse
              as_user_id: "${sn_id}"
              captures: { pe1_id: $.data.id }
            - call: "POST /clinical-ladder/participation-events/${pe1_id}/verify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${sn_id}", event_kind: "PRECEPTORSHIP", points: 5, occurred_on: "2026-02-15T00:00:00Z" }
              as: Nurse
              as_user_id: "${sn_id}"
              captures: { pe2_id: $.data.id }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${sn_id}", target_level: "CN_II", portfolio_narrative: "p", expected_nurse_version: "${sn_v}" }
              as: Nurse
              as_user_id: "${sn_id}"
              captures: { sapp_id: $.data.id }
            - call: "POST /clinical-ladder/applications/${sapp_id}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${sn_id}"
              captures: { snap_points: $.data.participation_snapshot_points }
            - call: "POST /clinical-ladder/participation-events/${pe2_id}/verify"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /clinical-ladder/applications/${sapp_id}"
              payload: {}
              as: ProgramAdmin
              captures: { frozen_points: $.data.participation_snapshot_points }
            - call: "GET /clinical-ladder/nurses/${sn_id}/participation-events"
              payload: { status: "VERIFIED" }
              as: ProgramAdmin
          assert:
            - "frozen_points == 10"
            - "live VERIFIED sum after second verify == 15 (10 + 5)"
            - "frozen_points != live sum: snapshot did not retroactively absorb the post-submit verification"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes a / b / c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: maintenance_score_three_input_nonlinear_saturation
        grounds:
          - calculations.calc_maintenance_score
          - validations[priority=23]
        distinguishing_aspect: |
          Mode (a): three inputs (participation points, certification currency
          keyed on nurse level, tenure years) with non-linear interaction — two
          nested min-saturations and a conditional branch on certification track
          — produces exactly 60 at the SUSTAIN boundary and 58 one notch below.
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurse A hired 2021-07-01 (tenure 5 years) with 5 verified points and one CURRENT BASIC certification => 10 + 40 + 10 = 60 exactly"
            - "Nurse B hired 2021-08-01 (tenure 4 years) with identical points and certification => 10 + 40 + 8 = 58"
            - "Both are CN_I (level requirement NONE, so the BASIC cert satisfies the at-or-above branch worth 40); both hold AnniversaryReview OPEN"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-A", full_name: "Nurse A", hire_date: "2021-07-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { na_id: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-B", full_name: "Nurse B", hire_date: "2021-08-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { nb_id: $.data.id }
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${na_id}", event_kind: "QI_PROJECT", points: 5, occurred_on: "2026-03-01T00:00:00Z" }
              as: Nurse
              as_user_id: "${na_id}"
              captures: { pea_id: $.data.id }
            - call: "POST /clinical-ladder/participation-events/${pea_id}/verify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${nb_id}", event_kind: "QI_PROJECT", points: 5, occurred_on: "2026-03-01T00:00:00Z" }
              as: Nurse
              as_user_id: "${nb_id}"
              captures: { peb_id: $.data.id }
            - call: "POST /clinical-ladder/participation-events/${peb_id}/verify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${na_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 40000, obtained_on: "2025-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${nb_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 40000, obtained_on: "2025-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/anniversary-reviews"
              payload: { nurse_id: "${na_id}", review_year: 2026 }
              as: ProgramAdmin
              captures: { ara_id: $.data.id }
            - call: "POST /clinical-ladder/anniversary-reviews"
              payload: { nurse_id: "${nb_id}", review_year: 2026 }
              as: ProgramAdmin
              captures: { arb_id: $.data.id }
          trigger:
            - call: "POST /clinical-ladder/anniversary-reviews/${ara_id}/close"
              payload: { outcome: "SUSTAIN" }
              as: ProgramAdmin
              captures: { ara_outcome: $.data.outcome, ara_score: $.data.maintenance_score }
            - call: "POST /clinical-ladder/anniversary-reviews/${arb_id}/close"
              payload: { outcome: "SUSTAIN" }
              as: ProgramAdmin
              captures: { arb_err: $.data.error_id }
          assert:
            - "ara_outcome == SUSTAIN"
            - "ara_score == 60"
            - "arb_err == ERR_MAINTENANCE_SCORE_INSUFFICIENT"

      - name: certification_bonus_nested_rounding_order
        grounds:
          - calculations.calc_certification_bonus
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — round_half_up(base * multiplier)
          to integer cents FIRST, then add the flat tenure_bonus; a reverse order
          (add then round, or round the sum) yields a different cent total for
          fractional multiplier bases, and first-time vs renewal multiplier changes
          the result by 50000 for identical SPECIALTY data.
        test_recipe:
          setup:
            - "Clock 2026-08-01; unit budgets exist"
            - "Nurse X tenure 5y earns first-time SPECIALTY: rhu(100000*1.5)+0 = 150000"
            - "Nurse Y tenure 12y earns renewal SPECIALTY: rhu(100000*1.0)+25000 = 125000"
            - "Nurse Z tenure 11y earns first-time ADVANCED: rhu(175000*1.5)+25000 = 287500"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/budget-lines"
              payload: { unit: "ICU-4W", fiscal_year: 2027, allocated_cents: 9000000 }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-X", full_name: "Nurse X", hire_date: "2021-08-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { nx_id: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-Y", full_name: "Nurse Y", hire_date: "2014-08-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { ny_id: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-Z", full_name: "Nurse Z", hire_date: "2015-08-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { nz_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${ny_id}", track: "SPECIALTY", certifying_body: "ANCC", exam_fee_cents: 100000, obtained_on: "2020-01-01T00:00:00Z", expires_on: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { ny_old_cert: $.data.id }
          trigger:
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${nx_id}", track: "SPECIALTY", certifying_body: "ANCC", exam_fee_cents: 100000, obtained_on: "2026-07-01T00:00:00Z", expires_on: "2031-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${ny_id}", track: "SPECIALTY", certifying_body: "ANCC", exam_fee_cents: 100000, obtained_on: "2026-07-01T00:00:00Z", expires_on: "2031-07-01T00:00:00Z", renewal_of_id: "${ny_old_cert}" }
              as: ProgramAdmin
              captures: { cy_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${nz_id}", track: "ADVANCED", certifying_body: "ANCC", exam_fee_cents: 200000, obtained_on: "2026-07-01T00:00:00Z", expires_on: "2031-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { cz_id: $.data.id }
            - call: "GET /clinical-ladder/certifications/${cx_id}/certification-bonuses"
              payload: {}
              as: ProgramAdmin
              captures: { bx_amt: "$.data[0].bonus_amount_cents" }
            - call: "GET /clinical-ladder/certifications/${cy_id}/certification-bonuses"
              payload: {}
              as: ProgramAdmin
              captures: { by_amt: "$.data[0].bonus_amount_cents" }
            - call: "GET /clinical-ladder/certifications/${cz_id}/certification-bonuses"
              payload: {}
              as: ProgramAdmin
              captures: { bz_amt: "$.data[0].bonus_amount_cents" }
          assert:
            - "bx_amt == 150000"
            - "by_amt == 125000"
            - "bz_amt == 287500"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle_loop
        grounds:
          - state_machines.Application.IN_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.Application.RETURNED_FOR_REVISION_to_DRAFT
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic shape on Application: DRAFT->SUBMITTED->IN_REVIEW->
          RETURNED_FOR_REVISION->DRAFT loops; each loop burns one review_cycle,
          clears submitted_at, expires PENDING assignments, and the cycle cap of
          3 terminates the loop with ERR_REVIEW_CYCLE_EXHAUSTED on the 4th return.
        test_recipe:
          setup:
            - "Clock 2026-08-01; active CN_II criterion (min_participation 0, NONE track)"
            - "Nurse M with application that has been returned for revision twice already (review_cycle == 2)"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-M", full_name: "Nurse M", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { nm_id: $.data.id, nm_v: $.data.version }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-MR", full_name: "Rev M", hire_date: "2018-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { nmr_id: $.data.id }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${nm_id}", target_level: "CN_II", portfolio_narrative: "v1", expected_nurse_version: "${nm_v}" }
              as: Nurse
              as_user_id: "${nm_id}"
              captures: { mapp_id: $.data.id }
            - call: "POST /clinical-ladder/applications/${mapp_id}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${nm_id}"
            - call: "POST /clinical-ladder/applications/${mapp_id}/assignments"
              payload: { reviewer_nurse_id: "${nmr_id}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${mapp_id}/return-for-revision"
              payload: {}
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${mapp_id}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${nm_id}"
            - call: "POST /clinical-ladder/applications/${mapp_id}/assignments"
              payload: { reviewer_nurse_id: "${nmr_id}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${mapp_id}/return-for-revision"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /clinical-ladder/applications/${mapp_id}"
              payload: {}
              as: ProgramAdmin
              captures: { mapp_status: $.data.status, mapp_cycle: $.data.review_cycle, mapp_submitted: $.data.submitted_at }
            - call: "POST /clinical-ladder/applications/${mapp_id}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${nm_id}"
            - call: "POST /clinical-ladder/applications/${mapp_id}/assignments"
              payload: { reviewer_nurse_id: "${nmr_id}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${mapp_id}/return-for-revision"
              payload: {}
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${mapp_id}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${nm_id}"
            - call: "POST /clinical-ladder/applications/${mapp_id}/assignments"
              payload: { reviewer_nurse_id: "${nmr_id}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${mapp_id}/return-for-revision"
              payload: {}
              as: ProgramAdmin
              captures: { cycle_err: $.data.error_id }
          assert:
            - "after second return: mapp_status == DRAFT and mapp_cycle == 2 and mapp_submitted == null"
            - "third full loop succeeds: review_cycle becomes 3"
            - "fourth return-for-revision fails with cycle_err == ERR_REVIEW_CYCLE_EXHAUSTED"

      - name: nurse_parallel_dimensions_level_vs_differential
        grounds:
          - state_machines.AnniversaryReview.OPEN_to_DEMOTE
          - state_machines.AnniversaryReview.OPEN_to_LAPSE
          - entities.Nurse.fields.differential_status
        distinguishing_aspect: |
          Parallel dimensions on Nurse: current_level (CN_I..CN_IV) and
