# =============================================================================
# task_0720_eap_administration — SCAFFOLD (§1.0–§1.7)
# Employee Assistance Program (EAP) Administration
# =============================================================================

scenario: |
  Employee Assistance Program (EAP) Administration: employer contract & utilization
  model, employee/dependent eligibility & confidentiality, counseling-session
  allotment (per-issue) & referral, 24/7 crisis line & triage, work-life resource &
  legal/financial referral, network-provider & claim, aggregate/anonymized
  reporting, wellness integration

domain_name: eap-administration
api_prefix: /eap

# Difficulty band: EXPERT (§0.4) — 12 entities, 30 endpoints, 27 error codes,
# 4 calculation variants, 5 state machines (cycles + parallel dimensions).
complexity_profile:
  primary_archetype: quota_allocation        # per-issue session allotment, finite pool
  secondary_archetype: compliance_audit      # confidentiality firewall, anonymized reporting
  complexity_layers:
    - optimistic_concurrency                 # OCC on EmployerContract.version + Case.version
    - dual_variant_calculation               # provisional vs final claim cost; estimated vs verified utilization
    - cascading_side_effects                 # contract suspend cascades to cases/sessions/claims
    - rate_threshold_triggers                # k-anonymity threshold, allotment exhaustion, crisis SLA

  entity_topology: flat                       # peer entities linked by FKs; collections at /eap/<segment>
  state_machine_shape: parallel               # Case has parallel clinical_status x funding_status; Claim cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles                       # CareCoordinator, CrisisCounselor, Provider, ProgramAdmin, Employer
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: EmployerContract
    parent: null
    common_fields: true
    fields:
      - { name: employer_name, type: string, source: input, description: "Employer legal name" }
      - { name: sessions_per_issue, type: integer, source: input, description: "Counseling sessions allotted per opened Case (per-issue model)", constraints: ">= 1 and <= 12" }
      - { name: annual_session_cap, type: integer, source: input, description: "Max counseling sessions fundable across the whole contract per program year", constraints: ">= 1" }
      - { name: crisis_sla_minutes, type: integer, source: input, description: "Max minutes from crisis intake to triage disposition before SLA breach", constraints: ">= 1", default: 15 }
      - { name: session_rate_cents, type: integer, source: input, description: "Contracted reimbursement per counseling session in cents (in-network base)", constraints: ">= 0" }
      - { name: annual_reimbursement_budget_cents, type: integer, source: input, description: "Total dollars (cents) the contract will reimburse providers across the program year; final claim adjudication prorates against this, independent of session_rate_cents", constraints: ">= 0" }
      - { name: reporting_min_cohort, type: integer, source: input, description: "k-anonymity floor: aggregate report cells with fewer distinct employees are suppressed", constraints: ">= 1", default: 5 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED — contract lifecycle", default: "ACTIVE" }
      - { name: sessions_committed, type: integer, source: computed, description: "Count of CounselingSession in SCHEDULED or COMPLETED across all cases of this contract (annual-cap consumption)" }
      - { name: utilization_rate, type: number, source: computed, description: "= sessions_committed / annual_session_cap, rounded to 4 decimals (contract-level utilization)" }

  - name: BenefitPlan
    parent: EmployerContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> EmployerContract.id; owning contract" }
      - { name: name, type: string, source: input, description: "Plan name shown to members" }
      - { name: worklife_referrals_per_year, type: integer, source: input, description: "Max work-life/legal/financial Referrals fundable per Employee per program year under this plan", constraints: ">= 0", default: 3 }
      - { name: copay_cents, type: integer, source: input, description: "Member copay per counseling session in cents (subtracted from contract reimbursement on claim)", constraints: ">= 0", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED — plan publication lifecycle", default: "DRAFT" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> EmployerContract.id; sponsoring employer contract" }
      - { name: plan_id, type: string, source: input, description: "FK -> BenefitPlan.id; assigned benefit plan (must belong to contract_id)" }
      - { name: full_name, type: string, source: input, description: "Employee full name (PII, confidentiality-gated)" }
      - { name: external_ref, type: string, source: input, description: "Employer-side payroll reference, unique within contract", constraints: "unique per contract_id" }
      - { name: eligibility_status, type: enum, source: system, description: "ELIGIBLE | GRACE | INELIGIBLE — coverage state", default: "ELIGIBLE" }
      - { name: grace_until, type: datetime, source: system, description: "ISO8601 UTC; while clock <= grace_until an INELIGIBLE-pending employee retains GRACE coverage; null unless in GRACE" }
      - { name: worklife_referrals_used, type: integer, source: computed, description: "Count of Referral with referral_type in {WORKLIFE,LEGAL,FINANCIAL} and status not in {CANCELLED,DENIED} for this employee in current program year" }

  - name: Dependent
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; sponsoring employee" }
      - { name: full_name, type: string, source: input, description: "Dependent full name (PII, confidentiality-gated)" }
      - { name: relationship, type: enum, source: input, description: "SPOUSE | CHILD | OTHER" }
      - { name: eligibility_status, type: enum, source: system, description: "ELIGIBLE | INELIGIBLE — mirrors sponsor but can be revoked independently", default: "ELIGIBLE" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> EmployerContract.id; funding contract (denormalized from subject for cap checks)" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the employee whose benefit funds this case (sponsor of the subject)" }
      - { name: dependent_id, type: string, source: input, description: "FK -> Dependent.id; set when subject is a dependent, else null", default: null }
      - { name: presenting_issue, type: enum, source: input, description: "STRESS | RELATIONSHIP | SUBSTANCE | GRIEF | FINANCIAL_STRESS | OTHER" }
      - { name: clinical_status, type: enum, source: system, description: "Parallel dimension A: INTAKE | OPEN | CLOSED — clinical lifecycle", default: "INTAKE" }
      - { name: funding_status, type: enum, source: system, description: "Parallel dimension B: PENDING | AUTHORIZED | EXHAUSTED | REVOKED — allotment funding lifecycle", default: "PENDING" }
      - { name: session_allotment, type: integer, source: system, description: "Sessions granted to this case; snapshotted from contract.sessions_per_issue at AUTHORIZE" }
      - { name: sessions_used, type: integer, source: computed, description: "Count of CounselingSession on this case in status SCHEDULED or COMPLETED" }
      - { name: sessions_remaining, type: integer, source: computed, description: "= max(0, session_allotment - sessions_used); 0 when funding_status=EXHAUSTED" }

  - name: CounselingSession
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning case" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; counselor delivering the session" }
      - { name: scheduled_for, type: datetime, source: input, description: "ISO8601 UTC start time of the session" }
      - { name: duration_minutes, type: integer, source: input, description: "Planned session length in minutes", constraints: ">= 30 and <= 120", default: 50 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED", default: "SCHEDULED" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Provider/counselor name" }
      - { name: network_status, type: enum, source: input, description: "IN_NETWORK | OUT_OF_NETWORK — affects claim reimbursement variant", default: "IN_NETWORK" }
      - { name: specialties, type: array, source: input, description: "List of presenting_issue enum values this provider handles (referral matching pool)" }
      - { name: accepting, type: boolean, source: input, description: "Whether provider currently accepts new referrals (selector eligibility)", default: true }
      - { name: active_referral_count, type: integer, source: computed, description: "Count of Referral to this provider in status REQUESTED or ACCEPTED (load-balancing rank input)" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case that triggered the referral (null for standalone work-life referrals)", default: null }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; employee the referral is for (work-life/legal/financial cap accounting)" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; assigned provider; null until server selects one", default: null }
      - { name: referral_type, type: enum, source: input, description: "CLINICAL | WORKLIFE | LEGAL | FINANCIAL" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ACCEPTED | DECLINED | COMPLETED | CANCELLED | DENIED", default: "REQUESTED" }

  - name: CrisisContact
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> EmployerContract.id; contract under which the crisis call arrived" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; caller (may be null for anonymous crisis intake)", default: null }
      - { name: opened_at, type: datetime, source: system, description: "ISO8601 UTC; logical clock value when the crisis contact was created (SLA start)" }
      - { name: severity, type: enum, source: input, description: "LOW | MODERATE | HIGH | IMMINENT — caller-reported acuity at intake" }
      - { name: triaged_at, type: datetime, source: system, description: "ISO8601 UTC; logical clock value when triage disposition was recorded; null until triaged" }
      - { name: sla_breached, type: boolean, source: computed, description: "True when minutes between opened_at and triaged_at exceeds contract.crisis_sla_minutes (or, if untriaged, clock now exceeds it)" }
      - { name: status, type: enum, source: system, description: "OPEN | TRIAGED | ESCALATED | RESOLVED", default: "OPEN" }
      - { name: disposition, type: enum, source: system, description: "Set at triage: SELF_HELP | ROUTINE_REFERRAL | URGENT_REFERRAL | EMERGENCY_DISPATCH; null until triaged", default: null }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> EmployerContract.id; payer contract" }
      - { name: session_id, type: string, source: input, description: "FK -> CounselingSession.id; the completed session being claimed" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; payee provider (denormalized from session for reimbursement variant)" }
      - { name: billed_cents, type: integer, source: input, description: "Provider-billed amount in cents", constraints: ">= 0" }
      - { name: provisional_cents, type: integer, source: computed, description: "Estimated reimbursement computed at SUBMIT (see claim_provisional_reimbursement)" }
      - { name: final_cents, type: integer, source: computed, description: "Final adjudicated reimbursement computed at APPROVE (see claim_final_reimbursement); null until approved" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | RESUBMITTED | PAID — cyclic via RESUBMITTED", default: "SUBMITTED" }

  - name: WellnessActivity
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; participant" }
      - { name: activity_type, type: enum, source: input, description: "SCREENING | WEBINAR | CHALLENGE | COACHING" }
      - { name: points, type: integer, source: input, description: "Wellness points earned by this activity", constraints: ">= 0 and <= 100" }
      - { name: completed_on, type: datetime, source: input, description: "ISO8601 UTC date the activity was completed" }

  - name: UtilizationReport
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> EmployerContract.id; scope of the report" }
      - { name: period_start, type: datetime, source: input, description: "ISO8601 UTC inclusive lower bound of the reporting window" }
      - { name: period_end, type: datetime, source: input, description: "ISO8601 UTC exclusive upper bound of the reporting window" }
      - { name: total_cases, type: integer, source: computed, description: "Count of Case created in [period_start, period_end) for the contract" }
      - { name: distinct_employees, type: integer, source: computed, description: "Count of distinct employee_id across those cases (k-anonymity denominator)" }
      - { name: issue_breakdown, type: object, source: computed, description: "Map presenting_issue -> case count; cells with distinct_employees < contract.reporting_min_cohort replaced by the sentinel -1 (suppressed)" }
      - { name: suppressed, type: boolean, source: computed, description: "True when distinct_employees < contract.reporting_min_cohort (whole report suppressed)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Case: PARALLEL dimensions (clinical_status x funding_status) ---
  - entity: Case
    initial_state: "clinical_status=INTAKE, funding_status=PENDING"
    terminal_states: ["clinical_status=CLOSED", "funding_status=REVOKED"]
    transitions:
      # Dimension B (funding) — depends on Dimension A reaching INTAKE/OPEN and on contract state.
      - from: "funding_status=PENDING"
        to: "funding_status=AUTHORIZED"
        trigger: "POST /eap/cases/{id}/authorize"
        actor: CareCoordinator
        preconditions:
          - "Case.clinical_status == INTAKE (cannot authorize a CLOSED case)"
          - "EmployerContract.status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE) — cross-entity dependency Case->EmployerContract"
          - "Employee.eligibility_status IN {ELIGIBLE, GRACE} (ERR_EMPLOYEE_INELIGIBLE) — cross-entity dependency Case->Employee"
          - "contract.sessions_committed + contract.sessions_per_issue <= contract.annual_session_cap (ERR_ANNUAL_CAP_EXCEEDED)"
        side_effects:
          - "Case.session_allotment := EmployerContract.sessions_per_issue (snapshot)"
          - "Case.clinical_status := OPEN (clinical dimension advances in lockstep on first authorize)"
      - from: "funding_status=AUTHORIZED"
        to: "funding_status=EXHAUSTED"
        trigger: "system: CounselingSession reaches SCHEDULED that makes sessions_used == session_allotment"
        actor: system
        preconditions:
          - "Case.sessions_used == Case.session_allotment after the session is counted"
        side_effects:
          - "Case.sessions_remaining := 0"
          - "Further POST /eap/cases/{id}/sessions rejected with ERR_ALLOTMENT_EXHAUSTED"
      - from: "funding_status=AUTHORIZED"
        to: "funding_status=REVOKED"
        trigger: "POST /eap/contracts/{id}/suspend (cascade) or POST /eap/cases/{id}/revoke"
        actor: "system | ProgramAdmin"
        preconditions:
          - "Case.clinical_status != CLOSED"
        side_effects:
          - "All CounselingSession on case in SCHEDULED -> CANCELLED (cascade hop 2)"
          - "Each cancelled session decrements contract.sessions_committed (cascade hop 3 / ledger sync)"
          - "Any Claim for those sessions in SUBMITTED or UNDER_REVIEW -> REJECTED (cascade hop 3)"
      - from: "funding_status=EXHAUSTED"
        to: "funding_status=REVOKED"
        trigger: "POST /eap/cases/{id}/revoke"
        actor: ProgramAdmin
        preconditions:
          - "Case.clinical_status != CLOSED"
        side_effects:
          - "No active sessions remain to cancel (allotment already fully used)"
      # Dimension A (clinical) — can advance/close independently once OPEN.
      - from: "clinical_status=OPEN"
        to: "clinical_status=CLOSED"
        trigger: "POST /eap/cases/{id}/close"
        actor: CareCoordinator
        preconditions:
          - "No CounselingSession on case in SCHEDULED (ERR_CASE_HAS_OPEN_SESSIONS)"
        side_effects:
          - "Case.funding_status retains its value (EXHAUSTED or AUTHORIZED) — funding dimension is NOT forced to a terminal value"

  # --- Claim: CYCLIC (REJECTED -> RESUBMITTED -> UNDER_REVIEW -> ...) ---
  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [PAID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /eap/claims/{id}/review"
        actor: ProgramAdmin
        preconditions:
          - "CounselingSession referenced by session_id is COMPLETED (ERR_SESSION_NOT_COMPLETED) — cross-entity dependency Claim->CounselingSession"
        side_effects:
          - "Claim.provisional_cents already set at SUBMIT; review locks it for adjudication"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /eap/claims/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "EmployerContract.status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "Claim.final_cents := claim_final_reimbursement (may differ from provisional_cents)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /eap/claims/{id}/reject"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Claim.final_cents stays null"
      - from: REJECTED
        to: RESUBMITTED
        trigger: "POST /eap/claims/{id}/resubmit"
        actor: Provider
        preconditions:
          - "billed_cents may be corrected in the resubmit payload"
        side_effects:
          - "Claim.provisional_cents recomputed from corrected billed_cents (cycle re-entry)"
      - from: RESUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /eap/claims/{id}/review"
        actor: ProgramAdmin
        preconditions:
          - "CounselingSession referenced by session_id is COMPLETED"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /eap/claims/{id}/pay"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Claim is terminal; no further transitions"

  # --- CrisisContact: BRANCHING fork-join (triage disposition forks) ---
  - entity: CrisisContact
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /eap/crisis-contacts/{id}/triage"
        actor: CrisisCounselor
        preconditions:
          - "disposition in request is one of SELF_HELP | ROUTINE_REFERRAL | URGENT_REFERRAL | EMERGENCY_DISPATCH"
        side_effects:
          - "CrisisContact.triaged_at := clock now"
          - "CrisisContact.disposition := request disposition"
          - "CrisisContact.sla_breached := (triaged_at - opened_at) minutes > contract.crisis_sla_minutes"
      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /eap/crisis-contacts/{id}/escalate"
        actor: CrisisCounselor
        preconditions:
          - "disposition IN {URGENT_REFERRAL, EMERGENCY_DISPATCH} (ERR_DISPOSITION_NOT_ESCALATABLE) — branch-specific"
        side_effects:
          - "A CLINICAL Referral is created in REQUESTED and provider auto-selected (cross-entity)"
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /eap/crisis-contacts/{id}/resolve"
        actor: CrisisCounselor
        preconditions:
          - "disposition IN {SELF_HELP, ROUTINE_REFERRAL} (ERR_DISPOSITION_NOT_RESOLVABLE) — divergent branch from ESCALATED"
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /eap/crisis-contacts/{id}/resolve"
        actor: CrisisCounselor
        preconditions: []
        side_effects: []

  # --- Referral: BRANCHING with revert (REQUESTED -> {ACCEPTED,DECLINED}); DECLINED re-selects ---
  - entity: Referral
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, DENIED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /eap/referrals/{id}/accept"
        actor: Provider
        preconditions:
          - "Acting Provider.id == Referral.provider_id (ERR_NOT_ASSIGNED_PROVIDER)"
        side_effects:
          - "Provider.active_referral_count unaffected (still counts ACCEPTED)"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /eap/referrals/{id}/decline"
        actor: Provider
        preconditions:
          - "Acting Provider.id == Referral.provider_id"
        side_effects:
          - "Referral.provider_id set to null; provider re-selection available via reassign"
      - from: DECLINED
        to: REQUESTED
        trigger: "POST /eap/referrals/{id}/reassign"
        actor: CareCoordinator
        preconditions:
          - "A new provider is selectable by the provider-selection policy (ERR_NO_PROVIDER_AVAILABLE on empty pool)"
        side_effects:
          - "Referral.provider_id := selected provider (excludes the provider that just declined)"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /eap/referrals/{id}/complete"
        actor: Provider
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /eap/referrals/{id}/cancel"
        actor: CareCoordinator
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "system: work-life cap exceeded at creation time is rejected before create; explicit deny by admin"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  # --- EmployerContract: lifecycle gating child operations ---
  - entity: EmployerContract
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /eap/contracts/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "expected_contract_version matches current version (OCC)"
        side_effects:
          - "increments EmployerContract.version by 1"
          - "All Case with funding_status=AUTHORIZED on this contract -> funding_status=REVOKED (cascade hop 1)"
          - "Each revoked case cancels its SCHEDULED sessions (cascade hop 2) which decrements sessions_committed (cascade hop 3)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /eap/contracts/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "expected_contract_version matches current version (OCC)"
        side_effects:
          - "increments EmployerContract.version by 1"
          - "Previously revoked cases are NOT auto-restored (revocation is permanent)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /eap/contracts/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "expected_contract_version matches current version (OCC)"
        side_effects:
          - "increments EmployerContract.version by 1"
          - "Same revoke cascade as SUSPENDED; contract becomes terminal"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /eap/contracts/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "expected_contract_version matches current version (OCC)"
        side_effects:
          - "increments EmployerContract.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: case-authorize-stale-contract
    parent_entity: EmployerContract
    write_endpoint: "POST /eap/cases/{id}/authorize"
    occ_field: "expected_contract_version"
    description: |
      Authorizing a Case draws session_allotment from the contract and consumes
      against annual_session_cap. If the contract's version has advanced since the
      client last observed it (another writer suspended/reinstated/terminated the
      contract, which legitimately changes whether funding may be drawn and bumps
      sessions_committed via revoke cascades), the authorize is rejected as stale.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: contract-suspend-stale-contract
    parent_entity: EmployerContract
    write_endpoint: "POST /eap/contracts/{id}/suspend"
    occ_field: "expected_contract_version"
    description: |
      Suspending a contract whose version has advanced since the client last read
      it is rejected. Another writer may have already reinstated or terminated it
      (each of which bumps version), so the current writer's view is stale.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # Dual-variant #1 — domain: Claim reimbursement (provisional vs final).
  - name: claim_provisional_reimbursement
    trigger: "POST /eap/claims (SUBMIT) and on resubmit"
    algorithm: forward_looking
    formula: |
      base = contract.session_rate_cents
      if provider.network_status == OUT_OF_NETWORK:
        base = floor(base * OON_FACTOR_NUM / OON_FACTOR_DEN)   # 70%
      gross = min(billed_cents, base)            # never reimburse above contracted base
      provisional_cents = max(0, gross - plan.copay_cents)
    input_set: "single claim's session->provider->contract->plan chain at submit time"
    constants: { OON_FACTOR_NUM: 7, OON_FACTOR_DEN: 10 }
    precision: "integer cents, floor on the OON multiplication step"
    variants:
      - name: provisional
        when: "computed at SUBMIT/RESUBMIT, before annual-cap pressure is known"
        difference: "uses billed_cents as submitted; ignores remaining-cap proration"

  - name: claim_final_reimbursement
    trigger: "POST /eap/claims/{id}/approve (state UNDER_REVIEW -> APPROVED)"
    algorithm: chronological
    formula: |
      # Process this contract's APPROVED+PAID claims in created_at ASC order to find
      # how much annual reimbursement budget is already spent.
      spent = sum(final_cents for claims of contract in {APPROVED, PAID} ordered by created_at ASC, excluding this claim)
      remaining = max(0, contract.annual_reimbursement_budget_cents - spent)
      final_cents = min(provisional_cents, remaining)   # prorate down to remaining budget
    input_set: "all APPROVED/PAID claims of the same contract, created_at ASC; excludes the claim being approved"
    constants: {}
    precision: "integer cents; min() truncates to remaining budget"
    variants:
      - name: final
        when: "computed at APPROVE; reconciles against budget already committed"
        difference: "may be LESS than provisional_cents when remaining budget < provisional (proration); equal otherwise"

  # Dual-variant #2 — domain: Contract utilization (committed/estimated vs verified).
  - name: contract_utilization
    trigger: "any CounselingSession status change; GET /eap/contracts/{id}"
    algorithm: aggregation
    formula: |
      sessions_committed = count(CounselingSession s where s.case.contract_id == contract.id
                                 AND s.status IN {SCHEDULED, COMPLETED})
      utilization_rate = round(sessions_committed / annual_session_cap, 4)   # round_half_up
    input_set: "sessions in SCHEDULED or COMPLETED across all cases of the contract"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: committed
        when: "default contract.utilization_rate (forward-looking: counts SCHEDULED)"
        difference: "includes SCHEDULED sessions not yet delivered"
      - name: verified
        when: "GET /eap/contracts/{id}/utilization?basis=verified"
        difference: "counts only COMPLETED sessions; SCHEDULED excluded — yields a lower or equal rate"

  # Combinatorial #2 (mode b) — nested rounding order pinned for the report.
  - name: report_issue_breakdown
    trigger: "POST /eap/contracts/{id}/reports (utilization report build)"
    algorithm: aggregation
    formula: |
      window = cases with created_at in [period_start, period_end) for contract
      distinct_employees = count(distinct employee_id over window)
      total_cases = count(window)
      if distinct_employees < contract.reporting_min_cohort:
        suppressed = true; issue_breakdown = {} ; all cells = -1 sentinel
      else:
        suppressed = false
        for each presenting_issue value:
          cell_count = count(window where presenting_issue == value)
          cell_distinct = count(distinct employee_id where presenting_issue == value)
          issue_breakdown[value] = (cell_distinct < contract.reporting_min_cohort) ? -1 : cell_count
    input_set: "cases in the half-open window [period_start, period_end) for the contract"
    constants: {}
    precision: "integer counts; -1 sentinel marks suppressed cells"
    variants:
      - name: whole_suppressed
        when: "report-level distinct_employees below k floor"
        difference: "entire breakdown suppressed (every cell -1, suppressed=true)"
      - name: cell_suppressed
        when: "report passes k floor but an individual issue cell is below k"
        difference: "only that cell becomes -1; other cells show true counts"

  # Combinatorial #1 (mode a) — provider-selection ranking with >=3 inputs & tie-break.
  - name: provider_selection
    trigger: "POST /eap/referrals (auto-select on create) and reassign"
    algorithm: weighted_scoring
    formula: |
      candidates = providers where accepting == true
                   AND network_status == IN_NETWORK
                   AND referral.required_specialty IN provider.specialties
                   AND provider.id != excluded_provider_id   # excludes a just-declined provider on reassign
      if candidates is empty: ERR_NO_PROVIDER_AVAILABLE
      # rank ascending by active_referral_count (least-loaded first);
      # tie-break: earliest provider.created_at ASC (NEVER id)
      selected = min(candidates, key=(active_referral_count ASC, created_at ASC))
    input_set: "Provider pool filtered by accepting, network_status, specialty match, exclusion set"
    constants: {}
    precision: "exact integer comparison on active_referral_count; created_at tie-break"

  # Crisis SLA threshold (mode for boundary precision rule).
  - name: crisis_sla_evaluation
    trigger: "POST /eap/crisis-contacts/{id}/triage; GET /eap/crisis-contacts/{id}"
    algorithm: threshold
    formula: |
      elapsed_min = (triaged_at - opened_at) total minutes   # if untriaged, use (clock_now - opened_at)
      sla_breached = elapsed_min > contract.crisis_sla_minutes   # strictly greater; == is within SLA
    input_set: "single crisis contact's opened_at, triaged_at, and its contract.crisis_sla_minutes"
    constants: {}
    precision: "integer minutes; strict > comparison (boundary: elapsed == sla is NOT a breach)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/FK resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric constraints satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all mutating endpoints

  - priority: 5
    category: business_referential
    check: "Cross-FK consistency: plan_id belongs to contract_id; session.case belongs to claim.contract; referral specialty resolvable"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 409
    applies_to: "POST /eap/employees, POST /eap/claims, POST /eap/referrals"

  - priority: 6
    category: state
    check: "Target resource in a legal source state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_contract_version equals EmployerContract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /eap/contracts/{id}/suspend, reinstate, terminate; POST /eap/cases/{id}/authorize"

  - priority: 8
    category: business_referential
    check: "Confidentiality firewall: Employer role may not read Employee/Dependent/Case/CounselingSession PII"
    error_id: ERR_CONFIDENTIALITY_BLOCKED
    http_status: 403
    applies_to: "GET on employees, dependents, cases, sessions"

  - priority: 9
    category: business_safety
    check: "Crisis contact with severity IMMINENT cannot be RESOLVED directly (must escalate first)"
    error_id: ERR_IMMINENT_REQUIRES_ESCALATION
    http_status: 409
    applies_to: "POST /eap/crisis-contacts/{id}/resolve"

  - priority: 10
    category: business_temporal
    check: "CounselingSession.scheduled_for must be >= logical clock now (no back-dated scheduling)"
    error_id: ERR_SESSION_IN_PAST
    http_status: 422
    applies_to: "POST /eap/cases/{id}/sessions"

  - priority: 11
    category: business_temporal
    check: "A provider's sessions may not overlap in time (buffer-free interval collision)"
    error_id: ERR_PROVIDER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /eap/cases/{id}/sessions"

  - priority: 11.5
    category: business_temporal
    check: "A Case may not have two SCHEDULED sessions on the same calendar day (UTC day-bucket adjacency rule, distinct from provider minute-level overlap)"
    error_id: ERR_CASE_SAME_DAY_SESSION
    http_status: 409
    applies_to: "POST /eap/cases/{id}/sessions"

  - priority: 12
    category: business_temporal
    check: "UtilizationReport window: period_start < period_end (half-open, non-empty)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /eap/contracts/{id}/reports"

  - priority: 13
    category: business_fiscal
    check: "Annual session cap: contract.sessions_committed + sessions_per_issue <= annual_session_cap at authorize"
    error_id: ERR_ANNUAL_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /eap/cases/{id}/authorize"

  - priority: 14
    category: business_fiscal
    check: "Per-issue allotment: a case may not schedule more sessions than session_allotment"
    error_id: ERR_ALLOTMENT_EXHAUSTED
    http_status: 409
    applies_to: "POST /eap/cases/{id}/sessions"

  - priority: 15
    category: business_fiscal
    check: "Work-life referral cap: employee.worklife_referrals_used + 1 <= plan.worklife_referrals_per_year for WORKLIFE/LEGAL/FINANCIAL referrals"
    error_id: ERR_WORKLIFE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /eap/referrals"

