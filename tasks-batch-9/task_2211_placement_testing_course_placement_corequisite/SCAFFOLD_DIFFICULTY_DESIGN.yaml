              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { r_050: $.data.id }
            - call: "POST /placement-rules/${r_050}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /students"
              payload: { student_number: "SS", full_name: "Student S", race_ethnicity_code: "MULTI", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { ss: $.data.id, ss_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${ss}", subject_area: "MATH", expected_student_version: "${ss_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det: $.data.id, det_base: $.data.base_confidence_score, det_owner: $.data.determined_by_user_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
