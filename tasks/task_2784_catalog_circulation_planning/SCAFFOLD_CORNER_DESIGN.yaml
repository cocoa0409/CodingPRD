            - "${e_negative} == ERR_INVALID_REQUEST with HTTP 422  # cost_per_thousand_cents must be >= 0"
            - "${e_zero} == ERR_INVALID_REQUEST with HTTP 422  # requested_quantity must be > 0, so zero is not merely a no-op line"
            - "${e_flag} == ERR_INVALID_REQUEST with HTTP 422  # holdout_pct_bps 1000 is inside 0..5000 but is_holdout is false"
            - "${e_channel} == ERR_INVALID_REQUEST with HTTP 422  # ContactEvent.channel is MAIL | EMAIL | DIGITAL only"
            - "GET /catalog-circulation/circulation-lines?drop_id=${d1_id} returns total_count == 0 and GET /catalog-circulation/drops/${d1_id}/presort-batches returns total_count == 0"

      - name: immutable_rows_carry_no_version_and_cannot_be_updated
        claim_type: immutability
        grounds:
          - entities.PostalPresortBatch
          - entities.ContactEvent
          - endpoints[POST /catalog-circulation/drops/{id}/presort-batches]
          - endpoints[POST /catalog-circulation/contact-events]
        distinguishing_aspect: "PostalPresortBatch and ContactEvent are the only two entities declared common_fields: false, so each must expose id and created_at but NOT updated_at and NOT version, and §1.5 must offer no PATCH or DELETE for either. A postal batch that could be edited in place would silently rewrite an already-priced drop's postage; a contact event that could be edited would rewrite fatigue history."
        test_recipe:
          setup:
            - "Season FW26; segment S_A; plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run; drop 1 at page_count 64, in_home 2026-09-15 with an S_A line for 20000, allocated."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_id}", requested_quantity: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 20000 }
              as: CirculationPlanner
              captures: { batch_id: "$.data.id", batch_tier: "$.data.effective_tier", batch_rate: "$.data.rate_cents_per_piece" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "EMAIL", contact_date: "2026-08-01", source: "MANUAL" }
              as: MarketingAnalyst
              captures: { event_id: "$.data.id", event_points: "$.data.weighted_points" }
          assert:
            - "the PostalPresortBatch body carries id and created_at but NO updated_at and NO version field"
            - "the ContactEvent body carries id and created_at but NO updated_at and NO version field"
            - "${batch_tier} == FIVE_DIGIT and ${batch_rate} == 42 and ${event_points} == 12  # both rows are fully priced at creation, because they can never be repriced by an update"
            - "§1.5 declares no PATCH, PUT or DELETE for /catalog-circulation/presort-batches or /catalog-circulation/contact-events, so ${batch_id} and ${event_id} are append-only"
            - "the only way to remove a PostalPresortBatch is the APPROVED -> DRAFT plan revision cascade, which deletes the drop's batches wholesale"

      - name: child_creation_against_a_missing_parent_returns_404
        claim_type: parent_relationships
        grounds:
          - errors[ERR_SEASON_NOT_FOUND]
          - errors[ERR_SEGMENT_NOT_FOUND]
          - errors[ERR_RENTAL_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - validations[priority=32]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Body-borne foreign keys are validated exactly like path ids: a segment naming a missing season, a segment naming a missing parent_segment_id, a line naming a missing housefile_segment_id and a merge-purge run naming a missing element inside input_rental_ids all 404. The array case is the sharp one - one bad element in an otherwise valid list must fail the whole call rather than being silently skipped."
        test_recipe:
          setup:
            - "Season FW26; segment S_A; plan P1 budget 20000000 with drop 1 at page_count 64, in_home 2026-09-15; rental R1 delivered with 25000 gross names."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-A", requested_gross_names: 25000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 2000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { rental_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${rental_id}/model"
              payload: { coop_model_score: 640 }
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${rental_id}/order"
              payload: {}
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${rental_id}/deliver"
              payload: { delivered_gross_names: 25000 }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "00000000-0000-0000-0000-000000000000", segment_code: "S_ORPHAN", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { e_season: "$.data.error_id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_CHILD", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620, parent_segment_id: "00000000-0000-0000-0000-000000000000" }
              as: CirculationPlanner
              captures: { e_parent: "$.data.error_id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "00000000-0000-0000-0000-000000000000", requested_quantity: 5000 }
              as: CirculationPlanner
              captures: { e_seg: "$.data.error_id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: ["${rental_id}", "00000000-0000-0000-0000-000000000000"] }
              as: ListBroker
              captures: { e_rental: "$.data.error_id" }
          assert:
            - "${e_season} == ERR_SEASON_NOT_FOUND with HTTP 404  # a body FK is validated like a path id"
            - "${e_parent} == ERR_SEGMENT_NOT_FOUND with HTTP 404"
            - "${e_seg} == ERR_SEGMENT_NOT_FOUND with HTTP 404"
            - "${e_rental} == ERR_RENTAL_NOT_FOUND with HTTP 404  # one unresolvable element fails the whole array"
            - "no MergePurgeRun was created: GET /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs returns total_count == 0"
            - "the valid element was NOT partially consumed: ProspectListRental.${rental_id}.status == DELIVERED and net_names_delivered == 0"
            - "GET /catalog-circulation/housefile-segments?season_id=${season_id} returns total_count == 1  # only S_A"

      - name: self_referential_segment_cycle_is_rejected
        claim_type: graph_topology
        grounds:
          - errors[ERR_SEGMENT_CYCLE]
          - validations[priority=39]
          - complexity_profile.entity_topology
          - complexity_profile.relationship_patterns
          - entities.HousefileSegment.fields.parent_segment_id
          - endpoints[PATCH /catalog-circulation/housefile-segments/{id}]
        distinguishing_aspect: "The graph topology's self-referential edge needs a cycle guard at three depths: a segment parented to itself, a two-hop cycle created by re-parenting an ancestor to its own descendant, and a cross-season parent. The two-hop case is the one a naive parent_segment_id != id check misses, and the cross-season case shows the guard is scoped by season rather than purely structural."
        test_recipe:
          setup:
            - "Season FW26 with a chain S_TOP -> S_MID -> S_LEAF built by parenting each segment to the previous one, and a second season SS26 with segment S_OTHER."
            - "Parenting S_MID to S_TOP makes S_TOP a non-leaf whose rollup_housefile_count aggregates its descendants."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "SS26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season2_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_TOP", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 10000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { top_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_MID", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 20000, avg_order_value_cents: 18500, historical_response_rate_bps: 620, parent_segment_id: "${top_id}" }
              as: CirculationPlanner
              captures: { mid_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_LEAF", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620, parent_segment_id: "${mid_id}" }
              as: CirculationPlanner
              captures: { leaf_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season2_id}", segment_code: "S_OTHER", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 5000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { other_id: "$.data.id" }
          trigger:
            - call: "PATCH /catalog-circulation/housefile-segments/${mid_id}"
              payload: { parent_segment_id: "${mid_id}" }
              as: CirculationPlanner
              captures: { e_self: "$.data.error_id" }
            - call: "PATCH /catalog-circulation/housefile-segments/${top_id}"
              payload: { parent_segment_id: "${leaf_id}" }
              as: CirculationPlanner
              captures: { e_two_hop: "$.data.error_id" }
            - call: "PATCH /catalog-circulation/housefile-segments/${mid_id}"
              payload: { parent_segment_id: "${other_id}" }
              as: CirculationPlanner
              captures: { e_cross_season: "$.data.error_id" }
          assert:
            - "${e_self} == ERR_SEGMENT_CYCLE with HTTP 422  # depth-0 self-parent"
            - "${e_two_hop} == ERR_SEGMENT_CYCLE with HTTP 422  # S_LEAF is a descendant of S_TOP, so this would close a two-hop loop that parent_segment_id != id cannot detect"
            - "${e_cross_season} == ERR_SEGMENT_CYCLE with HTTP 422  # the parent must live in the same season"
            - "the hierarchy is unchanged: HousefileSegment.${mid_id}.parent_segment_id == ${top_id} and HousefileSegment.${top_id}.parent_segment_id == null"
            - "HousefileSegment.${top_id}.version == 1 and HousefileSegment.${mid_id}.version == 1  # rejected PATCHes do not bump version"
            - "roll-ups survive: HousefileSegment.${top_id}.rollup_housefile_count == 60000, is_leaf == false; HousefileSegment.${mid_id}.rollup_housefile_count == 50000, is_leaf == false; HousefileSegment.${leaf_id}.rollup_housefile_count == 30000, is_leaf == true"

  # ===========================================================================
  # SECTION 2 — state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: rental_lifecycle_advances_requested_through_netted
        claim_type: valid_transition
        grounds:
          - state_machines[ProspectListRental.status]
          - endpoints[POST /catalog-circulation/prospect-list-rentals/{id}/model]
          - endpoints[POST /catalog-circulation/prospect-list-rentals/{id}/order]
          - endpoints[POST /catalog-circulation/prospect-list-rentals/{id}/deliver]
          - calculations.rental_expected_response_rate
        distinguishing_aspect: "Each of the four forward edges is walked in order and each one's own side effect is asserted at the step that produces it: model sets coop_model_score AND expected_response_rate_bps, order sets unit_cost_cents_per_name, deliver sets gross_names, and the merge-purge run - not any rental endpoint - performs DELIVERED -> NETTED. An implementation that computes the response rate at create time, or at order time, fails."
        test_recipe:
          setup:
            - "Season FW26; plan P1 budget 20000000; rental R1 requested for 25000 names at 8500 per thousand, coop score 640."
            - "Coop score 640 falls in the >= 600 band, so the modeled lift is +2000 bps on the 110 bps prospect base: round_half_up(110 * 12000 / 10000) == 132."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-A", requested_gross_names: 25000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 2000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { r1_id: "$.data.id", s_created: "$.data.status", rate_created: "$.data.expected_response_rate_bps", unit_created: "$.data.unit_cost_cents_per_name" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/model"
              payload: { coop_model_score: 640 }
              as: ListBroker
              captures: { s_modeled: "$.data.status", score: "$.data.coop_model_score", rate_modeled: "$.data.expected_response_rate_bps", unit_modeled: "$.data.unit_cost_cents_per_name" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/order"
              payload: {}
              as: ListBroker
              captures: { s_ordered: "$.data.status", unit_ordered: "$.data.unit_cost_cents_per_name" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/deliver"
              payload: { delivered_gross_names: 24000 }
              as: ListBroker
              captures: { s_delivered: "$.data.status", gross: "$.data.gross_names", net_before: "$.data.net_names_delivered" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: ["${r1_id}"] }
              as: ListBroker
              captures: { run_status: "$.data.status" }
            - call: "GET /catalog-circulation/prospect-list-rentals/${r1_id}"
              payload: {}
              as: ListBroker
              captures: { s_netted: "$.data.status", net_after: "$.data.net_names_delivered", ver_netted: "$.data.version" }
          assert:
            - "${s_created} == REQUESTED and ${rate_created} == 0 and ${unit_created} == 0  # nothing is priced or modeled at create time"
            - "${s_modeled} == MODELED, ${score} == 640 and ${rate_modeled} == 132  # the >= 600 coop band lifts 110 bps by 2000 bps"
            - "${unit_modeled} == 0  # the per-name cost is set by order, not by model"
            - "${s_ordered} == ORDERED and ${unit_ordered} == 9  # round_half_up(8500 / 1000) == 9, not the truncated 8"
            - "${s_delivered} == DELIVERED and ${gross} == 24000  # the delivered count overwrites requested_gross_names 25000"
            - "${net_before} == 0  # netting has not happened yet"
            - "${run_status} == COMPLETED and ${s_netted} == NETTED and ${net_after} == 19200  # 24000 less the 2000 bps housefile overlap, applied by the run"
            - "${ver_netted} == 5  # create 1, model 2, order 3, deliver 4, system netting 5"

      - name: a_rental_transition_from_the_wrong_state_is_rejected
        claim_type: invalid_transitions
        grounds:
          - errors[ERR_INVALID_RENTAL_STATE]
          - state_machines[ProspectListRental.status]
          - validations[priority=42]
        distinguishing_aspect: "Three edges are probed from states that do not own them - order from REQUESTED, deliver from REQUESTED, and model from ORDERED - so the rejection cannot be explained by a single 'must be REQUESTED' rule. The model-from-ORDERED probe is the backwards case: an implementation that only checks 'not terminal' would let a broker re-model a list it has already bought."
        test_recipe:
          setup:
            - "Season FW26 with two rentals: R_NEW left at REQUESTED and R_ORD advanced to ORDERED."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-NEW", requested_gross_names: 25000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 2000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { new_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-ORD", requested_gross_names: 25000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 2000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { ord_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${ord_id}/model"
              payload: { coop_model_score: 640 }
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${ord_id}/order"
              payload: {}
              as: ListBroker
              captures: { ord_ver: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/prospect-list-rentals/${new_id}/order"
              payload: {}
              as: ListBroker
              captures: { e_skip_model: "$.data.error_id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${new_id}/deliver"
              payload: { delivered_gross_names: 24000 }
              as: ListBroker
              captures: { e_skip_two: "$.data.error_id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${ord_id}/model"
              payload: { coop_model_score: 900 }
              as: ListBroker
              captures: { e_backwards: "$.data.error_id" }
          assert:
            - "${e_skip_model} == ERR_INVALID_RENTAL_STATE with HTTP 409  # ORDERED is only reachable from MODELED"
            - "${e_skip_two} == ERR_INVALID_RENTAL_STATE with HTTP 409  # two edges cannot be skipped at once"
            - "${e_backwards} == ERR_INVALID_RENTAL_STATE with HTTP 409  # an ORDERED list cannot be re-modeled"
            - "ProspectListRental.${new_id} is unchanged: status == REQUESTED, coop_model_score == null, unit_cost_cents_per_name == 0, gross_names == 0, version == 1"
            - "ProspectListRental.${ord_id} is unchanged: status == ORDERED, coop_model_score == 640, expected_response_rate_bps == 132 and version == ${ord_ver} == 3  # the rejected re-model neither rescored nor bumped the row"

      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines[CirculationPlan.status].initial_state
          - state_machines[Drop.production_status].initial_state
          - state_machines[Drop.measurement_status].initial_state
          - state_machines[CirculationLine.status].initial_state
          - state_machines[TestCell.status].initial_state
          - state_machines[MergePurgeRun.status].initial_state
        distinguishing_aspect: "Six initial states are asserted in one chain, including the two that are easy to get wrong: a Drop carries TWO independent initial states at once (PLANNED and PENDING), and MergePurgeRun's declared initial PENDING is never observable because the create call resolves the fork within the same request. An implementation that persists a run in PENDING, or that starts measurement_status at PLANNED, fails."
        test_recipe:
          setup:
            - "Season FW26; segment S_A; plan P1 budget 20000000; a housefile-only merge-purge run; drop 1 at page_count 64, in_home 2026-09-15; one S_A line allocated so a TestCell can be created."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version", plan_status: "$.data.status", plan_round: "$.data.revision_round" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
              captures: { run_id: "$.data.id", run_status: "$.data.status" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id", prod: "$.data.production_status", meas: "$.data.measurement_status", basis: "$.data.cost_basis" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { line_id: "$.data.id", line_status: "$.data.status" }
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/test-cells"
              payload: { cell_code: "C1", test_type: "OFFER", cell_role: "CONTROL", quantity: 5000 }
              as: MarketingAnalyst
              captures: { cell_status: "$.data.status", cell_sig: "$.data.significance", cell_lift: "$.data.lift_bps" }
          assert:
            - "${plan_status} == DRAFT and ${plan_round} == 0"
            - "${prod} == PLANNED and ${meas} == PENDING  # both Drop dimensions initialise independently in the same create"
            - "${basis} == ESTIMATED_POSTAGE  # a brand-new drop has no presort actuals"
            - "${line_status} == PROPOSED  # creating a line never allocates it"
            - "${cell_status} == PLANNED and ${cell_sig} == UNMEASURED and ${cell_lift} == 0"
            - "${run_status} == COMPLETED and never PENDING  # the declared initial state of MergePurgeRun is resolved inside the create request, so no run is ever readable in PENDING"
            - "GET /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs contains ${run_id} with status COMPLETED"

      - name: terminal_state_transitions_are_rejected_on_cancelled_and_measured_rows
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[CirculationPlan.status].terminal_states
          - state_machines[TestCell.status].terminal_states
          - state_machines[ProspectListRental.status].terminal_states
          - errors[ERR_INVALID_PLAN_STATE]
          - errors[ERR_INVALID_RENTAL_STATE]
        distinguishing_aspect: "Three declared terminal states are probed for every edge that leaves them: a CANCELLED plan refuses cost, approve, request-revision and a second cancel; a CANCELLED rental refuses model and cancel. The second-cancel probes matter because a naive handler treats cancel as idempotent, but the cancel side-effect set credits budget back and would double-credit on replay."
        test_recipe:
          setup:
            - "Season FW26; plan P_DEAD cancelled while still DRAFT; rental R_DEAD cancelled while still REQUESTED."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P_DEAD", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cancel"
              payload: {}
              as: CirculationDirector
              captures: { dead_status: "$.data.status", dead_ver: "$.data.version" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-DEAD", requested_gross_names: 25000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 2000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { r_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r_id}/cancel"
              payload: {}
              as: ListBroker
              captures: { r_status: "$.data.status", r_ver: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              captures: { e_cost: "$.data.error_id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              captures: { e_approve: "$.data.error_id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/request-revision"
              payload: {}
              as: CirculationDirector
              captures: { e_revise: "$.data.error_id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cancel"
              payload: {}
              as: CirculationDirector
              captures: { e_recancel: "$.data.error_id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r_id}/model"
              payload: { coop_model_score: 700 }
              as: ListBroker
              captures: { e_model: "$.data.error_id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r_id}/cancel"
              payload: {}
              as: ListBroker
              captures: { e_rerental: "$.data.error_id" }
          assert:
            - "${dead_status} == CANCELLED and ${r_status} == CANCELLED"
            - "${e_cost} == ERR_INVALID_PLAN_STATE with HTTP 409"
            - "${e_approve} == ERR_INVALID_PLAN_STATE with HTTP 409  # CANCELLED is not UNDER_REVIEW"
            - "${e_revise} == ERR_INVALID_PLAN_STATE with HTTP 409  # neither back-edge starts at CANCELLED"
            - "${e_recancel} == ERR_INVALID_PLAN_STATE with HTTP 409  # cancel is not idempotent, because its side effects credit budget"
            - "${e_model} == ERR_INVALID_RENTAL_STATE with HTTP 409"
            - "${e_rerental} == ERR_INVALID_RENTAL_STATE with HTTP 409  # rental cancel guards on status != CANCELLED"
            - "CirculationPlan.${plan_id}.version == ${dead_ver} and ProspectListRental.${r_id}.version == ${r_ver}  # six rejected calls bumped nothing"

      - name: repeating_a_completed_production_transition_is_rejected_not_ignored
        claim_type: idempotency
        grounds:
          - state_machines[Drop.production_status]
          - errors[ERR_INVALID_DROP_STATE]
          - endpoints[POST /catalog-circulation/drops/{id}/presort]
          - endpoints[POST /catalog-circulation/drops/{id}/mail]
          - endpoints[POST /catalog-circulation/drops/{id}/deliver]
        distinguishing_aspect: "Each production edge is fired twice and the second call must 409 rather than return the drop unchanged. Mail is the dangerous one: its five-hop cascade creates ContactEvent rows, so a handler that treats a repeat mail as a no-op-and-200 would still be wrong if it re-ran the cascade, and one that returns 200 hides the operator error entirely."
        test_recipe:
          setup:
            - "Season FW26; segment S_A; plan P1 budget 20000000 approved by u-director-9 after u-planner-1 costed and submitted it; drop 1 at page_count 64, in_home 2026-09-15, 20000 allocated to S_A, presorted with a single 20000-piece FIVE_DIGIT batch."
