# =============================================================================
# Scaffold: Process Serving & Legal Support (task_0485)
# Difficulty tier: Expert
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Process Serving & Legal Support: service request & document, server assignment
  & territory, attempt log (date/time/GPS) & diligence, service type
  (personal/substitute/posting) & affidavit, rush/stakeout, skip-trace, county
  filing/e-file, proof of service.

domain_name: process-serving-legal-support
api_prefix: /
# Flat/graph topology: Client, County, Server, ServiceRequest, Assignment,
# Filing, Affidavit, SkipTrace, Stakeout, Attempt are peer top-level (or
# sub-resource) collections, so the API root is the prefix rather than a single
# resource path.

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: graph
  # ServiceRequest is the central order; Server<->County is many-to-many through
  # ServerTerritory; Assignment/Attempt/Service/Affidavit/Filing/SkipTrace/
  # Stakeout/InvoiceLine reference across aggregate boundaries by FK.
  state_machine_shape: cyclic
  # ServiceRequest has a reassignment loop (ASSIGNED->SUBMITTED) and Filing has a
  # reject->resubmit loop (REJECTED->SUBMITTED): two cyclic machines on
  # different entities.
  relationship_patterns:
    - one_to_many        # ServiceRequest -> Document/Attempt/Service/Affidavit/Filing/SkipTrace/InvoiceLine
    - many_to_many       # Server <-> County via ServerTerritory
    - cross_aggregate    # Attempt depends on Assignment+Server+County; Filing depends on Affidavit
  role_model: segregation_of_duties
  # The Server who logs attempts and records service cannot also notarize the
  # affidavit; notarization is reserved to a distinct Notary identity.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Law firm / requesting party name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: prepaid_balance_cents, type: integer, source: computed, description: "Funds on deposit; debited when a ServiceRequest invoice is finalized at COMPLETED. Starts 0, raised via deposits.", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — suspended clients cannot submit new requests", constraints: "ACTIVE,SUSPENDED", default: "ACTIVE" }

  - name: County
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "County name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state, e.g. CA" }
      - { name: e_file_enabled, type: boolean, source: input, description: "Whether the county accepts electronic filing", default: false }
      - { name: min_diligent_attempts, type: integer, source: input, description: "Statutory minimum distinct-day attempts before substitute/posting service or NON_EST is permitted in this county", default: 3 }
      - { name: filing_fee_cents, type: integer, source: input, description: "Court filing fee charged per accepted Filing in this county", default: 4000 }
      - { name: max_concurrent_filings, type: integer, source: input, description: "Aggregate cap: number of Filings whose [window_start,window_end) e-file windows may overlap at any instant in this county", default: 2 }

  - name: Server
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Process server full name" }
      - { name: license_no, type: string, source: input, description: "State process-server license number" }
      - { name: max_active_assignments, type: integer, source: input, description: "Capacity: maximum Assignments this server may hold in ACTIVE at once", default: 5 }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of Assignments with status==ACTIVE whose server_id==this.id. Invariant: equals that count exactly.", default: 0 }
      - { name: completed_count, type: integer, source: computed, description: "Count of Assignments with status==COMPLETED whose server_id==this.id.", default: 0 }
      - { name: reliability_score, type: number, source: computed, description: "Performance score in [0,100]; recomputed on every Assignment terminal transition. See calculations.server_reliability_score.", default: 100 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — only ACTIVE servers may receive offers or log attempts", constraints: "ACTIVE,SUSPENDED", default: "ACTIVE" }

  - name: ServerTerritory
    parent: null
    common_fields: false
    fields:
      - { name: server_id, type: string, source: input, description: "FK -> Server.id" }
      - { name: county_id, type: string, source: input, description: "FK -> County.id" }
      # (server_id, county_id) pair is unique — a server covers a county at most once.

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning law firm" }
      - { name: county_id, type: string, source: input, description: "FK -> County.id; county of the service address" }
      - { name: recipient_name, type: string, source: input, description: "Name of the person to be served" }
      - { name: service_address, type: string, source: input, description: "Physical address where service is attempted" }
      - { name: service_lat, type: number, source: input, description: "Latitude of service address (decimal degrees)" }
      - { name: service_lng, type: number, source: input, description: "Longitude of service address (decimal degrees)" }
      - { name: rush, type: boolean, source: input, description: "Rush job; applies rush surcharge and a 48h service deadline", default: false }
      - { name: deadline_utc, type: datetime, source: computed, description: "Statutory/agreed service deadline. = created_at + 48h if rush else created_at + 30 days. Set at SUBMITTED." }
      - { name: skip_trace_requested, type: boolean, source: input, description: "Whether a SkipTrace was ordered for this request", default: false }
      - { name: assignment_id, type: string, source: computed, description: "FK -> Assignment.id; the current non-superseded assignment, else null", default: null }
      - { name: service_type, type: enum, source: computed, description: "PERSONAL | SUBSTITUTE | POSTING — set when service is recorded; null until SERVED", constraints: "PERSONAL,SUBSTITUTE,POSTING", default: null }
      - { name: distinct_attempt_days, type: integer, source: computed, description: "Count of distinct calendar (UTC) days on which a non-superseded Attempt was logged for this request.", default: 0 }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Provisional fee estimated at SUBMITTED. See calculations.service_fee (variant=quoted).", default: 0 }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final billed fee, recomputed on every billable side effect and frozen at COMPLETED. See calculations.service_fee (variant=final).", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ASSIGNED | IN_PROGRESS | SERVED | NON_EST | FILED | COMPLETED | CANCELLED", constraints: "DRAFT,SUBMITTED,ASSIGNED,IN_PROGRESS,SERVED,NON_EST,FILED,COMPLETED,CANCELLED", default: "DRAFT" }

  - name: Document
    parent: ServiceRequest
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id" }
      - { name: doc_type, type: enum, source: input, description: "SUMMONS | SUBPOENA | COMPLAINT | NOTICE | WRIT", constraints: "SUMMONS,SUBPOENA,COMPLAINT,NOTICE,WRIT" }
      - { name: page_count, type: integer, source: input, description: "Number of pages; drives per-page printing line item", constraints: ">=1" }

  - name: Assignment
    parent: ServiceRequest
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id" }
      - { name: server_id, type: string, source: input, description: "FK -> Server.id" }
      - { name: superseded, type: boolean, source: computed, description: "True once a newer Assignment for the same request supersedes this one", default: false }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | ACTIVE | COMPLETED | DECLINED | REASSIGNED | CANCELLED", constraints: "OFFERED,ACCEPTED,ACTIVE,COMPLETED,DECLINED,REASSIGNED,CANCELLED", default: "OFFERED" }

  - name: Attempt
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: service_request_id, type: string, source: computed, description: "FK -> ServiceRequest.id; copied from the assignment for filtered lookups" }
      - { name: attempted_at_utc, type: datetime, source: input, description: "Date/time of the attempt (UTC). Must be <= current clock and within the assignment's ACTIVE lifetime." }
      - { name: gps_lat, type: number, source: input, description: "Latitude where the attempt occurred (decimal degrees)" }
      - { name: gps_lng, type: number, source: input, description: "Longitude where the attempt occurred (decimal degrees)" }
      - { name: outcome, type: enum, source: input, description: "NO_ANSWER | EVADED | BAD_ADDRESS | CONTACT_MADE — CONTACT_MADE enables recording service", constraints: "NO_ANSWER,EVADED,BAD_ADDRESS,CONTACT_MADE" }
      - { name: superseded, type: boolean, source: computed, description: "True if logged under an assignment later REASSIGNED/CANCELLED; superseded attempts do not count toward diligence", default: false }

  - name: Service
    parent: ServiceRequest
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; assignment under which service was effected" }
      - { name: service_type, type: enum, source: input, description: "PERSONAL | SUBSTITUTE | POSTING", constraints: "PERSONAL,SUBSTITUTE,POSTING" }
      - { name: recipient_relation, type: string, source: input, description: "For SUBSTITUTE: relationship of the substitute recipient (e.g. spouse, co-resident); empty otherwise" }
      - { name: served_at_utc, type: datetime, source: input, description: "Timestamp of effective service (UTC)" }

  - name: Affidavit
    parent: ServiceRequest
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id" }
      - { name: service_id, type: string, source: computed, description: "FK -> Service.id; the service this affidavit proves", default: null }
      - { name: declarant_server_id, type: string, source: computed, description: "FK -> Server.id; server who effected service and signs the affidavit" }
      - { name: notary_user_id, type: string, source: computed, description: "Opaque X-User-ID of the Notary who notarized; null until NOTARIZED", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | NOTARIZED | FILED | VOID", constraints: "DRAFT,SIGNED,NOTARIZED,FILED,VOID", default: "DRAFT" }

  - name: SkipTrace
    parent: ServiceRequest
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id" }
      - { name: candidate_addresses, type: array, source: input, description: "Array of candidate address strings to investigate; may be empty", default: [] }
      - { name: located_address, type: string, source: computed, description: "Address confirmed on LOCATED; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | IN_PROGRESS | LOCATED | NOT_LOCATED", constraints: "REQUESTED,IN_PROGRESS,LOCATED,NOT_LOCATED", default: "REQUESTED" }

  - name: Stakeout
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: server_id, type: string, source: computed, description: "FK -> Server.id; copied from the assignment's server" }
      - { name: window_start_utc, type: datetime, source: input, description: "Start of the stakeout window (UTC), inclusive" }
      - { name: window_end_utc, type: datetime, source: input, description: "End of the stakeout window (UTC), exclusive; window is half-open [start,end)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", constraints: "SCHEDULED,COMPLETED,CANCELLED", default: "SCHEDULED" }

  - name: Filing
    parent: ServiceRequest
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id" }
      - { name: county_id, type: string, source: computed, description: "FK -> County.id; copied from the request's county" }
      - { name: affidavit_id, type: string, source: input, description: "FK -> Affidavit.id; the proof of service being filed" }
      - { name: window_start_utc, type: datetime, source: input, description: "Start of the e-file submission window (UTC), inclusive" }
      - { name: window_end_utc, type: datetime, source: input, description: "End of the e-file submission window (UTC), exclusive; half-open [start,end)" }
      - { name: reject_count, type: integer, source: computed, description: "Number of times this filing was rejected and resubmitted", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | ACCEPTED | REJECTED", constraints: "PENDING,SUBMITTED,ACCEPTED,REJECTED", default: "PENDING" }

  - name: InvoiceLine
    parent: ServiceRequest
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id" }
      - { name: kind, type: enum, source: computed, description: "BASE | RUSH | ATTEMPT | SKIP_TRACE | STAKEOUT | FILING | PRINTING", constraints: "BASE,RUSH,ATTEMPT,SKIP_TRACE,STAKEOUT,FILING,PRINTING" }
      - { name: amount_cents, type: integer, source: computed, description: "Line amount in cents, already rounded to whole cents at line level" }
      - { name: voided, type: boolean, source: computed, description: "True if the underlying billable was cancelled/superseded; voided lines excluded from totals", default: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceRequest
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /service-requests/{id}/submit"
        actor: Client
        preconditions:
          - "client.status == ACTIVE (ERR_CLIENT_SUSPENDED)"
          - "At least one Document exists for the request (ERR_NO_DOCUMENT)"
        side_effects:
          - "Set deadline_utc = created_at + 48h if rush else created_at + 30 days"
          - "Compute quoted_fee_cents via calculations.service_fee variant=quoted"
          - "Generate BASE InvoiceLine; PRINTING line (sum of document pages); RUSH line if rush; SKIP_TRACE line if skip_trace_requested"
          - "Recompute final_fee_cents via calculations.service_fee variant=final"

      - from: SUBMITTED
        to: ASSIGNED
        trigger: "POST /assignments/{id}/accept"
        actor: Server
        preconditions:
          - "Assignment.status == ACCEPTED transitioning to ACTIVE bubbles request to ASSIGNED (see Assignment machine)"
        side_effects:
          - "Set ServiceRequest.assignment_id = accepted assignment id"

      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /assignments/{id}/state (to DECLINED or REASSIGNED) or POST /service-requests/{id}/reassign"
        actor: Dispatcher
        preconditions:
          - "The current assignment is leaving ACTIVE without completing"
        note: "Reassignment loop — request returns to the offer pool; cyclic edge."
        side_effects:
          - "Set ServiceRequest.assignment_id = null"
          - "Mark all Attempts under the leaving assignment superseded=true (excluded from diligence)"
          - "Recompute distinct_attempt_days"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /assignments/{id}/attempts"
        actor: Server
        preconditions:
          - "Assignment.status == ACTIVE (ERR_ASSIGNMENT_NOT_ACTIVE)"
        side_effects:
          - "First non-superseded Attempt moves request to IN_PROGRESS"

      - from: IN_PROGRESS
        to: SERVED
        trigger: "POST /service-requests/{id}/services"
        actor: Server
        preconditions:
          - "Latest non-superseded Attempt.outcome == CONTACT_MADE for PERSONAL (ERR_NO_CONTACT_ATTEMPT)"
          - "For SUBSTITUTE/POSTING: distinct_attempt_days >= county.min_diligent_attempts (ERR_DILIGENCE_NOT_MET)"
          - "ServiceRequest.deadline_utc not passed when rush (ERR_DEADLINE_PASSED)"
        side_effects:
          - "Set service_type from the Service; set ServiceRequest.service_type"
          - "Create Affidavit (status=DRAFT, declarant_server_id = assignment.server_id, service_id = new service id)"
          - "Cascade: Assignment ACTIVE -> COMPLETED (bubble-up); Server.active_assignment_count -= 1; Server.completed_count += 1; recompute Server.reliability_score"

      - from: IN_PROGRESS
        to: NON_EST
        trigger: "POST /service-requests/{id}/non-est"
        actor: Server
        preconditions:
          - "distinct_attempt_days >= county.min_diligent_attempts (ERR_DILIGENCE_NOT_MET)"
        note: "Non est inventus — recipient not found after diligent attempts."
        side_effects:
          - "Cascade: Assignment ACTIVE -> COMPLETED; Server.active_assignment_count -= 1; Server.completed_count += 1; recompute Server.reliability_score"

      - from: SERVED
        to: FILED
        trigger: "POST /filings/{id}/state (to ACCEPTED)"
        actor: Dispatcher
        preconditions:
          - "A Filing for this request reached ACCEPTED (see Filing machine)"
        side_effects:
          - "Affidavit.status -> FILED"

      - from: FILED
        to: COMPLETED
        trigger: "POST /service-requests/{id}/complete"
        actor: Dispatcher
        preconditions:
          - "ServiceRequest.status == FILED (ERR_INVALID_STATE)"
        side_effects:
          - "Freeze final_fee_cents (final variant); debit Client.prepaid_balance_cents by final_fee_cents (ERR_INSUFFICIENT_FUNDS if balance < final_fee_cents)"

      - from: NON_EST
        to: COMPLETED
        trigger: "POST /service-requests/{id}/complete"
        actor: Dispatcher
        preconditions:
          - "ServiceRequest.status == NON_EST"
        side_effects:
          - "Freeze final_fee_cents; debit Client.prepaid_balance_cents by final_fee_cents (ERR_INSUFFICIENT_FUNDS)"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /service-requests/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /service-requests/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Mark all OFFERED Assignments for this request DECLINED"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /service-requests/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        note: "Cascade root (depth-4) — see calculations & §1.8 transitive_cascade."
        side_effects:
          - "Cascade L1: current Assignment ACTIVE -> CANCELLED"
          - "Cascade L2 (from Assignment cancel): Server.active_assignment_count -= 1; every SCHEDULED Stakeout under that assignment -> CANCELLED"
          - "Cascade L3 (from Stakeout cancel): void each cancelled stakeout's STAKEOUT InvoiceLine (voided=true)"
          - "Cascade L4 (from line void): recompute ServiceRequest.final_fee_cents over non-voided lines"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /service-requests/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Same cascade as ASSIGNED -> CANCELLED"

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, REASSIGNED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/accept"
        actor: Server
        preconditions:
          - "Server.status == ACTIVE (ERR_SERVER_SUSPENDED)"
          - "Server.active_assignment_count < Server.max_active_assignments (ERR_SERVER_AT_CAPACITY)"
          - "Acting server owns this assignment: X-User-ID == assignment.server_id (ERR_UNAUTHORIZED)"
          - "Assignment not superseded (ERR_ASSIGNMENT_SUPERSEDED)"
        side_effects:
          - "Immediately auto-advance to ACTIVE (see next transition)"

      - from: ACCEPTED
        to: ACTIVE
        trigger: "system (auto on accept)"
        actor: system
        preconditions: []
        side_effects:
          - "Server.active_assignment_count += 1"
          - "Bubble-up: ServiceRequest SUBMITTED -> ASSIGNED; set ServiceRequest.assignment_id"
          - "Supersede any other OFFERED assignment for the same request (status -> REASSIGNED, superseded=true)"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{id}/state (to DECLINED)"
        actor: Server
        preconditions:
          - "Acting server owns this assignment (ERR_UNAUTHORIZED)"
        side_effects: []

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (bubble-up on SERVED / NON_EST)"
        actor: system
        preconditions: []
        note: "Branch into terminal COMPLETED — divergent side-effects vs CANCELLED/REASSIGNED."
        side_effects:
          - "Server.active_assignment_count -= 1; Server.completed_count += 1; recompute Server.reliability_score"

      - from: ACTIVE
        to: REASSIGNED
        trigger: "POST /service-requests/{id}/reassign"
        actor: Dispatcher
        preconditions: []
        note: "Branch into terminal REASSIGNED — frees server but no completion credit."
        side_effects:
          - "Server.active_assignment_count -= 1 (no completed_count change); recompute Server.reliability_score"
          - "Mark Attempts under this assignment superseded=true"
          - "Bubble-down: ServiceRequest ASSIGNED/IN_PROGRESS -> SUBMITTED; assignment_id = null"

      - from: ACTIVE
        to: CANCELLED
        trigger: "system (cascade on ServiceRequest cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "Server.active_assignment_count -= 1; recompute Server.reliability_score"
          - "Every SCHEDULED Stakeout under this assignment -> CANCELLED"

  - entity: SkipTrace
    initial_state: REQUESTED
    terminal_states: [LOCATED, NOT_LOCATED]
    transitions:
      - from: REQUESTED
        to: IN_PROGRESS
        trigger: "POST /skip-traces/{id}/state (to IN_PROGRESS)"
        actor: Server
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: LOCATED
        trigger: "POST /skip-traces/{id}/state (to LOCATED)"
        actor: Server
        preconditions:
          - "candidate_addresses is non-empty (ERR_NO_CANDIDATE_ADDRESS)"
          - "located_address provided in request and is a member of candidate_addresses (ERR_ADDRESS_NOT_CANDIDATE)"
        note: "Branch LOCATED — divergent side-effects (updates request address)."
        side_effects:
          - "Set located_address; update ServiceRequest.service_address to located_address"

      - from: IN_PROGRESS
        to: NOT_LOCATED
        trigger: "POST /skip-traces/{id}/state (to NOT_LOCATED)"
        actor: Server
        preconditions: []
        note: "Branch NOT_LOCATED — no address mutation."
        side_effects: []

  - entity: Affidavit
    initial_state: DRAFT
    terminal_states: [FILED, VOID]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /affidavits/{id}/sign"
        actor: Server
        preconditions:
          - "Acting server is the declarant: X-User-ID == affidavit.declarant_server_id (ERR_UNAUTHORIZED)"
        side_effects: []

      - from: SIGNED
        to: NOTARIZED
        trigger: "POST /affidavits/{id}/notarize"
        actor: Notary
        preconditions:
          - "Acting Notary X-User-ID != affidavit.declarant_server_id (ERR_SEGREGATION_VIOLATION)"
        note: "Segregation of duties — declarant server cannot notarize own affidavit."
        side_effects:
          - "Set notary_user_id = X-User-ID"

      - from: NOTARIZED
        to: FILED
        trigger: "system (on Filing ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: VOID
        trigger: "system (on ServiceRequest cancel after SERVED — not reachable in normal flow)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Stakeout
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /stakeouts/{id}/state (to COMPLETED)"
        actor: Server
        preconditions:
          - "Acting server owns the parent assignment (ERR_UNAUTHORIZED)"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /stakeouts/{id}/state (to CANCELLED) or system cascade"
        actor: Server
        preconditions: []
        side_effects:
          - "Void this stakeout's STAKEOUT InvoiceLine (voided=true); recompute ServiceRequest.final_fee_cents"

  - entity: Filing
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /filings/{id}/state (to SUBMITTED)"
        actor: Dispatcher
        preconditions:
          - "ServiceRequest.status == SERVED (ERR_INVALID_STATE)"
          - "Linked Affidavit.status == NOTARIZED (ERR_AFFIDAVIT_NOT_NOTARIZED)"
          - "county.e_file_enabled == true (ERR_EFILE_NOT_ENABLED)"
          - "Filing e-file window [window_start_utc, window_end_utc) overlaps fewer than county.max_concurrent_filings other SUBMITTED filing windows in this county (ERR_FILING_WINDOW_FULL)"
        side_effects:
          - "Generate FILING InvoiceLine = county.filing_fee_cents; recompute final_fee_cents"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /filings/{id}/state (to ACCEPTED)"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Bubble-up: ServiceRequest SERVED -> FILED; Affidavit NOTARIZED -> FILED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /filings/{id}/state (to REJECTED)"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Void the FILING InvoiceLine for this filing; recompute final_fee_cents"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /filings/{id}/state (to SUBMITTED)"
        actor: Dispatcher
        note: "Reject -> resubmit loop; cyclic edge on a second entity."
        preconditions:
          - "Linked Affidavit.status == NOTARIZED (ERR_AFFIDAVIT_NOT_NOTARIZED)"
          - "Filing window overlaps fewer than county.max_concurrent_filings other SUBMITTED windows (ERR_FILING_WINDOW_FULL)"
        side_effects:
          - "reject_count += 1; regenerate FILING InvoiceLine; recompute final_fee_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-request
    parent_entity: ServiceRequest
    write_endpoint: "POST /service-requests/{id}/assignments"
    occ_field: "expected_service_request_version"
    description: |
      Offering a new Assignment against a ServiceRequest whose version has
      advanced since the client last observed it is rejected. A new OFFERED
      assignment legitimately supersedes any prior OFFERED assignment for the
      same request (the dispatcher re-offers to a better-ranked server); a
      client whose view of the request predates such a supersede is working
      from a stale version and is rejected on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: service_fee
    trigger: "On ServiceRequest SUBMITTED (variant=quoted) and on every billable side effect + at COMPLETED freeze (variant=final)"
    algorithm: tiered_pricing
    formula: |
      # Per-line amounts, each ROUNDED TO WHOLE CENTS AT THE LINE LEVEL,
      # THEN SUMMED (round-per-line-then-sum is the pinned order).
      base_line        = BASE_FEE_CENTS
      printing_line    = ceil( sum(Document.page_count) * PER_PAGE_CENTS )
      rush_line        = RUSH_FEE_CENTS if request.rush else 0
      skip_trace_line  = SKIP_TRACE_FEE_CENTS if request.skip_trace_requested else 0
      # Tiered per-attempt: first FREE_ATTEMPTS billable attempts are free,
      # next tier (up to TIER1_MAX) at ATTEMPT_RATE1_CENTS, beyond at ATTEMPT_RATE2_CENTS.
      n = billable_attempt_count   # see input_set
      tier1 = max(0, min(n, TIER1_MAX) - FREE_ATTEMPTS)
      tier2 = max(0, n - TIER1_MAX)
      attempt_line = tier1 * ATTEMPT_RATE1_CENTS + tier2 * ATTEMPT_RATE2_CENTS
      stakeout_line = sum(STAKEOUT_FEE_CENTS for each non-voided Stakeout)
      filing_line   = sum(amount for non-voided FILING InvoiceLines)   # = county.filing_fee_cents per accepted/submitted filing
      subtotal = base_line + printing_line + rush_line + skip_trace_line
               + attempt_line + stakeout_line + filing_line
      # Rush multiplier applies ONLY to the labor lines (attempt_line + stakeout_line),
      # evaluated AFTER tiering, as an explicit ordered step:
      if request.rush:
        labor = attempt_line + stakeout_line
        rush_uplift = ceil( labor * (RUSH_LABOR_MULT - 1) )   # whole cents
        subtotal += rush_uplift
      fee_cents = subtotal
    input_set: |
      variant=quoted: billable_attempt_count = 0 (no attempts yet at SUBMITTED);
        stakeout_line/filing_line = 0. Quoted is forward-looking from the request
        flags + documents only.
      variant=final: billable_attempt_count = count of Attempts with
        superseded==false under the request's non-superseded assignments
        (regardless of outcome); stakeout_line over Stakeout with status IN
        {SCHEDULED, COMPLETED} (CANCELLED excluded); filing_line over non-voided
        FILING InvoiceLines.
    constants:
      BASE_FEE_CENTS: 7500
      PER_PAGE_CENTS: 25
      RUSH_FEE_CENTS: 5000
      SKIP_TRACE_FEE_CENTS: 9000
      FREE_ATTEMPTS: 1
      TIER1_MAX: 3
      ATTEMPT_RATE1_CENTS: 2500
      ATTEMPT_RATE2_CENTS: 4000
      STAKEOUT_FEE_CENTS: 12000
      RUSH_LABOR_MULT: 1.5
    precision: "whole cents; round each line with ceil() at line level, then sum (round-per-line-then-sum)"
    variants:
      - name: quoted
        when: "Computed at SUBMITTED into quoted_fee_cents"
        difference: "billable_attempt_count fixed at 0; stakeout & filing lines absent"
      - name: final
        when: "Recomputed on every billable side effect into final_fee_cents, frozen at COMPLETED"
        difference: "billable_attempt_count, stakeout, and filing lines reflect realized activity"

  - name: server_reliability_score
    trigger: "On every Assignment terminal transition (COMPLETED, REASSIGNED, CANCELLED) for the server"
    algorithm: weighted_scoring
    formula: |
      # Two variants over the SAME server, DIFFERENT inclusion sets.
      # served = count Assignments(server) with status==COMPLETED whose request reached SERVED
      # nonest = count Assignments(server) with status==COMPLETED whose request reached NON_EST
      # walked = count Assignments(server) with status IN {REASSIGNED, CANCELLED}
      # base_pool depends on variant (see variants)
      good = served * W_SERVED + nonest * W_NONEST
      score_raw = 100.0 * good / max(1, base_pool)
      reliability_score = round_half_up(min(100.0, score_raw), 2)
    input_set: "Assignments whose server_id == this server"
    constants:
      W_SERVED: 1.0
      W_NONEST: 0.5
    precision: "2 decimal places, round_half_up; clamp to [0,100]"
    variants:
      - name: realized
        when: "Used for reliability_score persisted on Server"
        difference: "base_pool = served + nonest + walked (only resolved/terminal assignments). Ignores in-flight ACTIVE assignments."
      - name: projected
        when: "Returned by GET /servers/{id}/reliability-projection for dispatch ranking"
        difference: "base_pool = served + nonest + walked + active_assignment_count (counts in-flight ACTIVE as not-yet-good), yielding a strictly lower-or-equal score; diverges from realized whenever active_assignment_count > 0."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path), scoped correctly"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, page_count>=1, lat/lng numeric"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals current parent version on guarded creates"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /service-requests/{id}/assignments"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Diligence: substitute/posting service and non-est require distinct_attempt_days >= county.min_diligent_attempts"
    error_id: ERR_DILIGENCE_NOT_MET
    http_status: 409
    applies_to: "POST /service-requests/{id}/services, POST /service-requests/{id}/non-est"

  - priority: 8
    category: business_safety
    check: "Affidavit must be NOTARIZED before its Filing may be SUBMITTED"
    error_id: ERR_AFFIDAVIT_NOT_NOTARIZED
    http_status: 409
    applies_to: "POST /filings/{id}/state"

  - priority: 9
    category: business_safety
    check: "Segregation: notarizing Notary X-User-ID must differ from affidavit.declarant_server_id"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 409
    applies_to: "POST /affidavits/{id}/notarize"

  - priority: 10
    category: business_referential
    check: "Assigned server must cover the request's county via a ServerTerritory row"
    error_id: ERR_OUTSIDE_TERRITORY
    http_status: 409
    applies_to: "POST /service-requests/{id}/assignments"

  - priority: 11
    category: business_constraint
    check: "Server territory/capacity & state gates on accept (ACTIVE, under max_active_assignments, not superseded)"
    error_id: ERR_SERVER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /assignments/{id}/accept"

  - priority: 12
    category: business_temporal
    check: "Stakeout window [start,end) must not overlap another non-CANCELLED Stakeout for the same server (adjacency allowed)"
    error_id: ERR_STAKEOUT_OVERLAP
    http_status: 409
    applies_to: "POST /assignments/{id}/stakeouts"

  - priority: 13
    category: business_temporal
    check: "Filing e-file window may overlap at most county.max_concurrent_filings-1 other SUBMITTED filing windows in the county (aggregate capacity)"
    error_id: ERR_FILING_WINDOW_FULL
    http_status: 409
    applies_to: "POST /filings/{id}/state"

  - priority: 14
    category: business_temporal
    check: "Rush requests: service must be recorded on or before deadline_utc (served_at_utc <= deadline_utc, inclusive)"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /service-requests/{id}/services"

  - priority: 15
    category: business_fiscal
    check: "On COMPLETED freeze, client.prepaid_balance_cents must be >= final_fee_cents"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST /service-requests/{id}/complete"

