      - 'SavingsReport.${rep_b}.attested_credit_cents == 80      # min(10880, max(0, 10000 - 9920)): cap remainder pins the credit'
      - SavingsReport.${rep_a}.savings_kwh == 198.400 AND SavingsReport.${rep_b}.savings_kwh == 217.600
      - 'ConversionProgram.${pgm}.budget_balance_cents == 492000  # 500000 - 4*4500 labor + 9920 + 80'
      - 'Sum of attested credits for FY2026 == 10000 == fy_rebate_cap_cents exactly (boundary: min lands ON the cap)'
- rule_id: non_linear_state_machine
  instances:
  - name: outage_reopen_cycle_escalates_priority_keeps_clock
    grounds:
    - state_machines.OutageTicket.RESOLVED_to_REOPENED
    - state_machines.OutageTicket.REOPENED_to_TRIAGED
    - calculations.sla_priority_and_breach
    distinguishing_aspect: 'Cyclic machine on OutageTicket: RESOLVED -> REOPENED -> TRIAGED -> DISPATCHED ->

      RESOLVED. The cycle is observable because the priority ESCALATES one level per reopen

      (STANDARD -> HIGH, sla_hours 96 -> 48) while the SLA clock is NOT reset

      (reported_at frozen at 2026-08-01T00:00:00Z), so the second resolution at 74 elapsed

      hours breaches (74 > 48) even though the first resolution at 48 elapsed hours did not

      (48 <= 96).

      '
