          assert:
            - "Order.${ord1} submitted 14:59 local: date component of promised_ship_date == 2026-08-03 (captured ${promise_1})"
            - "Order.${ord2} submitted exactly 15:00 local: date component of promised_ship_date == 2026-08-04 (captured ${promise_2}) — equality does NOT make the cutoff"

  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: return_creation_gated_by_order_shipped_state
        grounds:
          - state_machines.Return.REQUESTED_to_APPROVED
          - validations[priority=4]
          - state_machines.Order.STOCK_RESERVED_to_SHIPPED
        distinguishing_aspect: |
          Entity pair Return -> Order: a Return may only be created against an
          Order in SHIPPED state; STOCK_RESERVED rejects with ERR_INVALID_STATE
          and SHIPPED accepts. Pair differs from the sibling's
          OrderLine -> Warehouse.
        test_recipe:
          setup:
            - "Warehouse ATL; CORPORATE account; stock product inventory 100; order qty 2 submitted -> STOCK_RESERVED (not yet shipped)"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-100", name: "12x12x12 Box", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 2 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
          trigger:
            - call: "POST /packaging-distribution/returns"
              payload: { order_id: "${ord}", return_type: "STOCK", reason_code: "CHANGED_MIND", lines: [ { order_line_id: "${line}", qty: 1 } ] }
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_1: $.data.error_id }
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
            - call: "POST /packaging-distribution/returns"
              payload: { order_id: "${ord}", return_type: "STOCK", reason_code: "CHANGED_MIND", lines: [ { order_line_id: "${line}", qty: 1 } ] }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ret: $.data.id, ret_status: $.data.status }
          assert:
            - "return against STOCK_RESERVED order: error_id == ERR_INVALID_STATE (captured ${err_1})"
            - "after ship, same return payload succeeds: Return.${ret}.status == REQUESTED (captured ${ret_status})"

      - name: allocation_gated_by_warehouse_active_state
        grounds:
          - calculations.calc_same_day_cutoff
          - validations[priority=13]
          - state_machines.Warehouse.ACTIVE_to_INACTIVE
        distinguishing_aspect: |
          Entity pair OrderLine -> Warehouse: the sourcing selector only
          considers Warehouses with status == ACTIVE, so deactivating the sole
          stocking warehouse empties the candidate set and submit fails with
          ERR_NO_WAREHOUSE_CAPABLE; reactivation restores it. Pair differs
          from the sibling's Return -> Order.
        test_recipe:
          setup:
            - "Warehouse ATL (then deactivated); CORPORATE account; stock product with Inventory at ATL on_hand 100; DRAFT order with one line"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-100", name: "12x12x12 Box", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/warehouses/${wh_atl}/deactivate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 1 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line: $.data.id }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_1: $.data.error_id }
            - call: "POST /packaging-distribution/warehouses/${wh_atl}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { st_2: $.data.status }
            - call: "GET /packaging-distribution/order-lines/${line}"
              payload: {}
              as: PlatformAdmin
              captures: { line_wh: $.data.allocated_warehouse_id, line_status: $.data.status }
          assert:
            - "submit with the only warehouse INACTIVE: error_id == ERR_NO_WAREHOUSE_CAPABLE (captured ${err_1})"
            - "submit after reactivation: Order.status == STOCK_RESERVED (captured ${st_2})"
            - "OrderLine.${line}.status == ALLOCATED and allocated_warehouse_id == ${wh_atl} (captured ${line_status}, ${line_wh})"

  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: price_window_half_open_overlap_and_adjacency
        grounds:
          - validations[priority=12]
          - entities.QuantityBreak.fields.effective_from
          - calculations.calc_order_pricing
        distinguishing_aspect: |
          Half-open [effective_from, effective_to) window semantics on the
          QuantityBreak resource: a window starting exactly at the previous
          window's end is adjacency (allowed), while any strict interior
          intersection is rejected with ERR_OVERLAPPING_PRICE_WINDOW; exclusive
          end is observable in pricing (the 08-10 order prices off the NEW
          window). Semantics differ from the sibling's derived-duration press
          occupancy.
        test_recipe:
          setup:
            - "Product base 500; break A min 50 price 450 window [2026-08-01, 2026-08-10); break B min 50 price 440 window [2026-08-10, 2026-08-20); an overlapping break C [2026-08-05, 2026-08-12) must be rejected; at clock 2026-08-10T12:00 the B window alone is effective"
          setup_api_calls:
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-300", name: "Mailer Box", category: "MAILERS", base_price_cents: 500, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/products/${prod}/quantity-breaks"
              payload: { min_qty: 50, unit_price_cents: 450, sort_seq: 1, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z" }
              as: CatalogManager
              captures: { brk_a: $.data.id }
            - call: "POST /packaging-distribution/products/${prod}/quantity-breaks"
              payload: { min_qty: 50, unit_price_cents: 440, sort_seq: 2, effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z" }
              as: CatalogManager
              captures: { brk_b: $.data.id }
          trigger:
            - call: "POST /packaging-distribution/products/${prod}/quantity-breaks"
              payload: { min_qty: 50, unit_price_cents: 430, sort_seq: 3, effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-08-12T00:00:00Z" }
              as: CatalogManager
              captures: { err_c: $.data.error_id }
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 1000 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 50 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line_unit: $.data.unit_price_cents }
          assert:
            - "break B created successfully (adjacency at 2026-08-10T00:00:00Z is NOT an overlap) — captured id ${brk_b}"
            - "break C rejected: error_id == ERR_OVERLAPPING_PRICE_WINDOW (captured ${err_c}) — [08-05, 08-12) intersects both A and B interiors"
            - "OrderLine.unit_price_cents == 440 at clock 2026-08-10T12:00:00Z (captured ${line_unit}) — A's exclusive end 08-10T00:00 has passed, B governs"

      - name: press_occupancy_derived_duration_back_to_back
        grounds:
          - validations[priority=15]
          - state_machines.CustomPrintJob.QUEUED_to_PLATING
          - entities.CustomPrintJob.fields.occupied_until
        distinguishing_aspect: |
          Derived-duration occupancy semantics on the CustomPrintJob resource:
          a job occupies a press over [started_at, occupied_until) where
          occupied_until = started_at + lead_time_days business days; a second
          job at the same single-press warehouse is rejected DURING the
          occupancy (ERR_PRESS_OCCUPIED) but accepted back-to-back at exactly
          occupied_until. Semantics differ from the sibling's stored
          half-open price windows.
        test_recipe:
          setup:
            - "Warehouse ATL press_count default 1; CORPORATE account; custom product lead_time_days 3; two orders each with one custom line, both submitted at clock 2026-08-03T10:00:00Z -> two QUEUED jobs at ATL"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-C1", name: "Custom 12x12x12", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 5, density_pcf: 20, is_custom_print: true, lead_time_days: 3 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord1: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord1}/lines"
              payload: { product_id: "${prod}", qty: 10, print_artwork_ref: "art-1", over_under_tolerance_pct: 10 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line1: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord1}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord2: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord2}/lines"
              payload: { product_id: "${prod}", qty: 10, print_artwork_ref: "art-2", over_under_tolerance_pct: 10 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { line2: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord2}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "GET /packaging-distribution/custom-print-jobs"
              payload: { order_line_id: "${line1}" }
              as: PlatformAdmin
              captures: { job1: "$.data[0].id" }
            - call: "GET /packaging-distribution/custom-print-jobs"
              payload: { order_line_id: "${line2}" }
              as: PlatformAdmin
              captures: { job2: "$.data[0].id" }
            - call: "POST /packaging-distribution/custom-print-jobs/${job1}/start"
              payload: {}
              as: WarehouseOps
              captures: { job1_until: $.data.occupied_until }
          trigger:
            - call: "POST /packaging-distribution/custom-print-jobs/${job2}/start"
              payload: {}
              as: WarehouseOps
              captures: { err_1: $.data.error_id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/custom-print-jobs/${job2}/start"
              payload: {}
              as: WarehouseOps
              captures: { job2_status: $.data.status, job2_started: $.data.started_at, job2_until: $.data.occupied_until }
          assert:
            - "job1 occupied_until == 2026-08-06T10:00:00Z (captured ${job1_until}: Mon 08-03 + 3 business days)"
            - "job2 start during occupancy: error_id == ERR_PRESS_OCCUPIED (captured ${err_1})"
            - "job2 start at exactly occupied_until succeeds (back-to-back half-open): status == PLATING (captured ${job2_status})"
            - "job2 started_at == 2026-08-06T10:00:00Z and occupied_until == 2026-08-11T10:00:00Z (captured ${job2_started}, ${job2_until}: Thu 08-06 + 3 business days over the weekend)"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: submit_cancel_stock_units_conserved
        grounds:
          - state_machines.Order.STOCK_RESERVED_to_CANCELLED
          - entities.Inventory.fields.available_qty
        distinguishing_aspect: |
          Conserved quantity = physical stock units: a submit/cancel pair must
          leave Inventory.on_hand_qty and reserved_qty bit-identical to their
          pre-submit values (on_hand 100 / reserved 0 before AND after), with
          available_qty returning to 100. Distinct conserved quantity from the
          sibling's receivable cents.
        test_recipe:
          setup:
            - "Warehouse ATL; CORPORATE account; stock product inventory on_hand 100 reorder_point 0; order qty 30"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-100", name: "12x12x12 Box", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
              captures: { inv: $.data.id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 30 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "GET /packaging-distribution/inventory/${inv}"
              payload: {}
              as: WarehouseOps
              captures: { onhand_mid: $.data.on_hand_qty, reserved_mid: $.data.reserved_qty, avail_mid: $.data.available_qty }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord_status: $.data.status, ord_invoice: $.data.invoice_status }
            - call: "GET /packaging-distribution/inventory/${inv}"
              payload: {}
              as: WarehouseOps
              captures: { onhand_end: $.data.on_hand_qty, reserved_end: $.data.reserved_qty, avail_end: $.data.available_qty }
          assert:
            - "after submit: on_hand_qty == 100, reserved_qty == 30, available_qty == 70 (captured ${onhand_mid}, ${reserved_mid}, ${avail_mid})"
            - "after cancel: on_hand_qty == 100, reserved_qty == 0, available_qty == 100 (captured ${onhand_end}, ${reserved_end}, ${avail_end}) — identical to pre-submit"
            - "Order.${ord}.status == CANCELLED, invoice_status == VOID (captured ${ord_status}, ${ord_invoice})"

      - name: invoice_pay_receivable_cents_conserved
        grounds:
          - calculations.calc_open_receivable
          - state_machines.Order.STOCK_RESERVED_to_SHIPPED
        distinguishing_aspect: |
          Conserved quantity = receivable cents: the full lifecycle submit ->
          ship -> invoice-pay must return Account.open_receivable_cents to its
          pre-order baseline of exactly 0, with each intermediate hop matching
          the order's recomputed grand_total (263680 after submit, 248800 after
          final-freight recompute, 0 after pay). Distinct conserved quantity
          from the sibling's stock units.
        test_recipe:
          setup:
            - "Warehouse ATL zone 2; CORPORATE account; stock product class 70, 10 lbs/unit, inventory 500; order ship_zone 5 line qty 100"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-100", name: "12x12x12 Box", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 500 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 100 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "GET /packaging-distribution/accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { rec_1: $.data.open_receivable_cents }
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
            - call: "GET /packaging-distribution/accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { rec_2: $.data.open_receivable_cents }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/invoice/pay"
              payload: {}
              as: AccountApprover
              as_user_id: "${acct}"
              captures: { inv_status: $.data.invoice_status }
            - call: "GET /packaging-distribution/accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { rec_3: $.data.open_receivable_cents }
          assert:
            - "after submit: open_receivable_cents == 263680 (captured ${rec_1})"
            - "after ship: open_receivable_cents == 248800 (captured ${rec_2}: final freight 148800 replaced provisional 163680)"
            - "invoice_status == PAID (captured ${inv_status})"
            - "after pay: open_receivable_cents == 0 (captured ${rec_3}) — back to the exact pre-order baseline, no drift"
