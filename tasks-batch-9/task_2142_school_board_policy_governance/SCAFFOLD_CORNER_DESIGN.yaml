      - name: compliance_sweep_on_an_empty_board_returns_all_zero_counters
        claim_type: Computed read
        grounds:
          - endpoints[POST /governance/compliance-sweeps]
        distinguishing_aspect: "With one policy, no mandates, no waivers and no expiring terms, the sweep is a no-op that still returns its five counters: mandates_marked_overdue 0, waivers_expired 0, members_term_expired 0, policies_recomputed 1 and publications_lapsed 0."
        test_recipe:
          setup: ["One LOCAL_DISCRETION policy exists and nothing else."]
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-9010", title: "Board Retreat Guidelines", category: "GOVERNANCE", legal_requirement_level: "LOCAL_DISCRETION", manual_section: "9000.10" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
          trigger:
            - call: "POST /governance/compliance-sweeps"
              payload: {}
              as: LegalUpdateService
              captures: { overdue: $.data.mandates_marked_overdue, expired: $.data.waivers_expired, terms: $.data.members_term_expired, recomputed: $.data.policies_recomputed, lapsed: $.data.publications_lapsed }
          assert:
            - "HTTP status == 200"
            - "captured overdue == 0"
            - "captured expired == 0"
            - "captured terms == 0"
            - "captured recomputed == 1"
            - "captured lapsed == 0"
            - "Policy.${pol}.compliance_state == COMPLIANT"

