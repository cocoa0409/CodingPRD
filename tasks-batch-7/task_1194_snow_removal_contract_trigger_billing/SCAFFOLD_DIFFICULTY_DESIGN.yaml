            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${eG}", contract_id: "${kG}", subcontractor_id: "${subG}", coverage_start: "2026-12-10T00:00:00Z", coverage_end: "2026-12-10T12:00:00Z" }, as: OpsDispatcher, captures: { caG: $.data.id, caG_status: $.data.status } }
          trigger:
            - { call: "POST /coverage-assignments/${caG}/activate", as: Subcontractor, as_user_id: "${subG}", captures: { act_err: $.data.error_id } }
            - { call: "POST /subcontractors/${subG}/approve", as: PlatformAdmin }
            - { call: "POST /coverage-assignments/${caG}/activate", as: Subcontractor, as_user_id: "${subG}", captures: { caG_status2: $.data.status } }
          assert:
            - "Coverage creation itself succeeds while the sub is PENDING (status == CREATED)"
            - "Activation while PENDING: error_id == ERR_SUBCONTRACTOR_NOT_APPROVED (CoverageAssignment transition gated on Subcontractor.status)"
            - "After PlatformAdmin approval: activation succeeds and status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: coverage_overlap_half_open_adjacency
        grounds:
          - validations[priority=16]
          - entities.CoverageAssignment.fields.coverage_start
          - entities.CoverageAssignment.fields.coverage_end
        distinguishing_aspect: |
          HALF-OPEN [start, end) interval semantics on the CoverageAssignment
          resource (distinct from the closed-interval season semantics): an
          assignment starting exactly when another ends (14:00 == 14:00) is legal
          adjacency, while a one-minute-earlier start (13:59) collides.
        test_recipe:
          setup:
            - "Subcontractor subH APPROVED; three ACTIVE contracts kH1/kH2/kH3 (one site each) all in region NE"
            - "Event eH window 2027-01-10T00:00-23:00; assignment caH1 ACTIVE for (eH, kH1, subH) covering [06:00, 14:00)"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Overlap Holdings", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { clH: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${clH}", name: "Pad 1", address: "1 Pad Row", region_code: "NE", pavement_area_sqft: 8000, requires_loader: false }, as: OpsDispatcher, captures: { sH1: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${clH}", name: "Pad 2", address: "2 Pad Row", region_code: "NE", pavement_area_sqft: 8000, requires_loader: false }, as: OpsDispatcher, captures: { sH2: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${clH}", name: "Pad 3", address: "3 Pad Row", region_code: "NE", pavement_area_sqft: 8000, requires_loader: false }, as: OpsDispatcher, captures: { sH3: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${clH}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 40000, require_photo_verification: false }, as: OpsDispatcher, captures: { kH1: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${kH1}", site_id: "${sH1}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher }
            - { call: "POST /contracts/${kH1}/activate", as: OpsDispatcher }
            - { call: "POST /contracts", payload: { client_id: "${clH}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 40000, require_photo_verification: false }, as: OpsDispatcher, captures: { kH2: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${kH2}", site_id: "${sH2}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher }
            - { call: "POST /contracts/${kH2}/activate", as: OpsDispatcher }
            - { call: "POST /contracts", payload: { client_id: "${clH}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 40000, require_photo_verification: false }, as: OpsDispatcher, captures: { kH3: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${kH3}", site_id: "${sH3}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher }
            - { call: "POST /contracts/${kH3}/activate", as: OpsDispatcher }
            - { call: "POST /subcontractors", payload: { legal_name: "Shiftwork Snow", contact_email: "ops@shiftwork.example", has_loader: true, has_brine_truck: false }, as: OpsDispatcher, captures: { subH: $.data.id } }
            - { call: "POST /subcontractors/${subH}/approve", as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-09T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-10T23:00:00Z", reported_accumulation_inches: 4.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { eH: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${eH}", contract_id: "${kH1}", subcontractor_id: "${subH}", coverage_start: "2027-01-10T06:00:00Z", coverage_end: "2027-01-10T14:00:00Z" }, as: OpsDispatcher, captures: { caH1: $.data.id } }
            - { call: "POST /coverage-assignments/${caH1}/activate", as: Subcontractor, as_user_id: "${subH}" }
          trigger:
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${eH}", contract_id: "${kH2}", subcontractor_id: "${subH}", coverage_start: "2027-01-10T14:00:00Z", coverage_end: "2027-01-10T20:00:00Z" }, as: OpsDispatcher, captures: { caH2: $.data.id, caH2_status: $.data.status } }
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${eH}", contract_id: "${kH3}", subcontractor_id: "${subH}", coverage_start: "2027-01-10T13:59:00Z", coverage_end: "2027-01-10T20:00:00Z" }, as: OpsDispatcher, captures: { caH3_err: $.data.error_id } }
          assert:
            - "Adjacency under half-open semantics: assignment ${caH2} starting at 14:00 exactly when caH1 ends is created (status == CREATED) — touching intervals do not overlap"
            - "One minute earlier (13:59): creation fails with error_id == ERR_COVERAGE_OVERLAP"

      - name: contract_season_overlap_closed_interval
        grounds:
          - validations[priority=15]
          - entities.Contract.fields.season_start
          - entities.Contract.fields.season_end
        distinguishing_aspect: |
          CLOSED [start, end] interval semantics on the Site-coverage resource
          (distinct entity and semantics from the half-open coverage rule): a
          second contract whose season_start touches the incumbent's season_end
          (2027-03-31T23:59:59Z exactly) CONFLICTS, while a start one second past
          the end (2027-04-01T00:00:00Z) links cleanly.
        test_recipe:
          setup:
            - "Site sI covered by ACTIVE contract kI1 with season [2026-11-01T00:00:00Z, 2027-03-31T23:59:59Z]"
            - "DRAFT contracts kI2 (season_start touching kI1's season_end) and kI3 (season_start after it) exist"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Seasonal Holdings", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { clI: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${clI}", name: "Perimeter Lot", address: "14 Boundary Rd", region_code: "NE", pavement_area_sqft: 22000, requires_loader: false }, as: OpsDispatcher, captures: { sI: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${clI}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 40000, require_photo_verification: false }, as: OpsDispatcher, captures: { kI1: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${kI1}", site_id: "${sI}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher }
            - { call: "POST /contracts/${kI1}/activate", as: OpsDispatcher }
            - { call: "POST /contracts", payload: { client_id: "${clI}", contract_type: "PER_PUSH", season_start: "2027-03-31T23:59:59Z", season_end: "2027-11-30T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 41000, require_photo_verification: false }, as: OpsDispatcher, captures: { kI2: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${clI}", contract_type: "PER_PUSH", season_start: "2027-04-01T00:00:00Z", season_end: "2027-11-30T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 41000, require_photo_verification: false }, as: OpsDispatcher, captures: { kI3: $.data.id } }
          trigger:
            - { call: "POST /contract-sites", payload: { contract_id: "${kI2}", site_id: "${sI}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { touch_err: $.data.error_id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${kI3}", site_id: "${sI}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { csI3: $.data.id } }
          assert:
            - "Touching closed intervals conflict: linking kI2 (season_start == incumbent season_end 2027-03-31T23:59:59Z) fails with error_id == ERR_SEASON_WINDOW_OVERLAP"
            - "One second past the end (2027-04-01T00:00:00Z): link ${csI3} is created — closed-interval coverage of site sI by ACTIVE contract kI1 does not extend past its season_end"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: push_count_conserved_by_complete_then_void
        grounds:
          - state_machines.ServiceVisit.COMPLETED_to_VOIDED
          - entities.Contract.fields.season_billable_push_count
          - entities.Contract.fields.unbilled_billable_cents
        distinguishing_aspect: |
          Conserved quantity: the push-count family (season_billable_push_count,
          unbilled_billable_cents) — a completed+verified push followed by its
          compensating void leaves the contract accumulators exactly at their
          pre-action values (0 and 0), matching the invariant count == |visits in
          billable statuses|.
        test_recipe:
          setup:
            - "PER_PUSH contract kJ (trigger 1.0, rate 45000, no photo gate) ACTIVE; visit vJ COMPLETED and event verified (visit BILLABLE_CONFIRMED)"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Conserve Corp", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { clJ: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${clJ}", name: "Ledger Lot", address: "18 Balance Ave", region_code: "NE", pavement_area_sqft: 16000, requires_loader: false }, as: OpsDispatcher, captures: { sJ: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${clJ}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { kJ: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${kJ}", site_id: "${sJ}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { csJ: $.data.id } }
            - { call: "POST /contracts/${kJ}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { eJ: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${eJ}", contract_site_id: "${csJ}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { vJ: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vJ}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vJ}/complete", as: CrewLead }
            - { call: "POST /observations", payload: { storm_event_id: "${eJ}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.0 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${eJ}", source_name: "DTN", observed_at: "2026-12-10T08:00:00Z", accumulation_inches: 2.1 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${eJ}/verify", as: OpsDispatcher }
            - { call: "GET /contracts/${kJ}", as: OpsDispatcher, captures: { kJ_count_pre: $.data.season_billable_push_count, kJ_unbilled_pre: $.data.unbilled_billable_cents } }
          trigger:
            - { call: "POST /visits/${vJ}/void", as: OpsDispatcher, captures: { vJ_exec: $.data.execution_status, vJ_bill: $.data.billing_status } }
            - { call: "GET /contracts/${kJ}", as: OpsDispatcher, captures: { kJ_count_post: $.data.season_billable_push_count, kJ_unbilled_post: $.data.unbilled_billable_cents } }
          assert:
            - "Forward action: after verification, season_billable_push_count == 1 and unbilled_billable_cents == 45000"
            - "Compensating void: visit ${vJ} execution_status == VOIDED and billing_status == NON_BILLABLE"
            - "Invariant restored with zero drift: season_billable_push_count == 0 and unbilled_billable_cents == 0 — exactly the pre-action values, equal to the count of visits in billable statuses (none)"

      - name: billed_cents_conserved_by_issue_then_void
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOIDED
          - entities.Contract.fields.season_billed_cents
          - entities.Client.fields.credit_exposure_cents
        distinguishing_aspect: |
          Conserved quantity: the monetary billed-cents identity (distinct from the
          push-count invariant) — season_billed_cents == sum of total_cents over
          non-voided issued invoices; issuing a 45000-cent invoice then voiding it
          (zero payments, no open disputes) returns both the contract accumulator
          and the client credit exposure to exactly 0.
        test_recipe:
          setup:
            - "PER_PUSH contract kK (rate 45000, trigger 1.0, no photo gate) ACTIVE under client clK (credit 10000000); visit billable; DRAFT invoice invK total 45000"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Balance Sheet Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { clK: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${clK}", name: "Audit Lot", address: "22 Ledger St", region_code: "NE", pavement_area_sqft: 14000, requires_loader: false }, as: OpsDispatcher, captures: { sK: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${clK}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { kK: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${kK}", site_id: "${sK}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { csK: $.data.id } }
            - { call: "POST /contracts/${kK}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { eK: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${eK}", contract_site_id: "${csK}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { vK: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vK}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vK}/complete", as: CrewLead }
            - { call: "POST /observations", payload: { storm_event_id: "${eK}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.0 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${eK}", source_name: "DTN", observed_at: "2026-12-10T08:00:00Z", accumulation_inches: 2.1 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${eK}/verify", as: OpsDispatcher }
            - { call: "POST /invoices", payload: { contract_id: "${kK}", kind: "EVENT", storm_event_id: "${eK}" }, as: OpsDispatcher, captures: { invK: $.data.id } }
            - { call: "POST /invoices/${invK}/issue", as: OpsDispatcher, captures: { invK_status: $.data.status } }
            - { call: "GET /contracts/${kK}", as: OpsDispatcher, captures: { kK_billed_pre: $.data.season_billed_cents } }
            - { call: "GET /clients/${clK}", as: OpsDispatcher, captures: { clK_exp_pre: $.data.credit_exposure_cents } }
          trigger:
            - { call: "POST /invoices/${invK}/void", as: OpsDispatcher, captures: { invK_status2: $.data.status } }
            - { call: "GET /contracts/${kK}", as: OpsDispatcher, captures: { kK_billed_post: $.data.season_billed_cents } }
            - { call: "GET /clients/${clK}", as: OpsDispatcher, captures: { clK_exp_post: $.data.credit_exposure_cents } }
            - { call: "GET /visits/${vK}", as: OpsDispatcher, captures: { vK_bill: $.data.billing_status } }
          assert:
            - "Forward action: after issue, invoice status == ISSUED, Contract.${kK}.season_billed_cents == 45000 and Client.${clK}.credit_exposure_cents == 45000"
            - "Compensating void (paid_cents == 0, no open disputes): invoice status == VOIDED"
            - "Invariant restored with zero drift: season_billed_cents == 0 and credit_exposure_cents == 0 — equal to the sum over non-voided issued invoices (none)"
            - "Line visit ${vK}.billing_status returns to BILLABLE_CONFIRMED"
