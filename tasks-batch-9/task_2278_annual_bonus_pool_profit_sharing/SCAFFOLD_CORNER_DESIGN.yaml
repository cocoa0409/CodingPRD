      - name: pool_and_award_versions_increment_by_one_on_an_accepted_allocation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.allocation-propose-stale-pool
          - endpoints."POST /participant-awards/{awardId}/propose-allocation"
          - entities.BusinessUnitPool.fields.allocated_cents
        distinguishing_aspect: |
          The positive half of the OCC contract: presenting the current pool
          version succeeds, and the write increments the version of both the
          guarded parent and the written child by exactly one — the parent because
          its ledger fields moved, the child because its allocation fields did. The
          next allocation therefore must present pv1 + 1, which is precisely why a
          second write reusing pv1 is stale.
        test_recipe:
          setup:
