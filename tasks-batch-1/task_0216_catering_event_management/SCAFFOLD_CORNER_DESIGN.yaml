            - "Order.${ord_id}.lifecycle_status == DRAFT"

      - name: client_cannot_cancel_other_clients_order
        claim_type: ownership_denied
        grounds: [roles, "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Client whose X-User-ID != the order's client_id invoking cancel is rejected with ERR_NOT_RESOURCE_OWNER (403); entity_backed ownership enforced."
        test_recipe:
          setup: ["A draft order owned by client A; client B attempts to cancel it."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "ClientA", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_a: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "ClientB", billing_email: "b@x.com" }
              as: CateringAdmin
              captures: { cli_b: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_a}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_a}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
          trigger:
