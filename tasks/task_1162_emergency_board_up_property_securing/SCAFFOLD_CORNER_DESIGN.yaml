  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: dispatch_validation_error_family
        claim_type: conditional_action
        grounds: ["errors[ERR_NO_COVERAGE]", "errors[ERR_MARKET_MISMATCH]", "errors[ERR_SUBCONTRACTOR_SUSPENDED]", "errors[ERR_CAPACITY_FULL]", "errors[ERR_INVALID_STATE]", calculations.dispatch_selection]
        distinguishing_aspect: "The dispatch endpoint's five distinct rejection paths each surface their own error: empty selector pool, manual pin without market coverage, pin of a suspended subcontractor, pin of a capacity-saturated subcontractor, and re-dispatch of a non-INTAKE job."
        test_recipe:
          setup: ["Market m3 (TAC) with no coverage rows; market m1 (SEA) with sub sx covered; sub sy covered in m3 with max_concurrent_jobs 1; jobs ja/jb/jc on a TAC property"]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
