  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: compliance_sweep_cascades_item_to_plan_to_agreement_to_transfer_request
        grounds:
          - state_machines.PipItem.status.PENDING_to_OVERDUE
          - state_machines.PropertyImprovementPlan.status.IN_PROGRESS_to_DEFAULTED
          - state_machines.LicenseAgreement.compliance_status.COMPLIANT_to_DEFAULT_NOTICE
          - state_machines.TransferRequest.status.SUBMITTED_to_REFUSED
          - calculations.pip_item_deadline
        distinguishing_aspect: |
          Depth 4, triggered by a single sweep of the improvement plan. Each link is caused strictly
          by the previous one: the sweep moves the LIFE_SAFETY item PENDING → OVERDUE (link 1);
          because that item is CRITICAL/LIFE_SAFETY the plan goes IN_PROGRESS → DEFAULTED (link 2);
          because the plan defaulted the agreement's compliance axis goes COMPLIANT → DEFAULT_NOTICE
          and stamps a cure deadline (link 3); and because the default notice sets
          transfer_consent_blocked, the pending refinancing consent request is auto-REFUSED with
          refusal_reason DEFAULT_NOTICE and no human decision_user_id (link 4). Remove any one link
          and the last one cannot fire.
