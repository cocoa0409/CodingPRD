          assert:
            - "while agreement EXECUTED: ${err_ag} == ERR_AGREEMENT_NOT_ACTIVE (http 409)"
            - "after commence: escrow creation succeeds, ${cl_status} == PENDING and the lot is UNDER_CONTRACT"
            - "second escrow on the same lot: ${err_lot} == ERR_LOT_NOT_OFFERED (http 409)"
  # ---------------------------------------------------------------- Rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: event_venue_half_open_adjacency
        grounds:
          - state_machines.CommunityEvent.PROPOSED_to_SCHEDULED
          - validations[priority=8]
        distinguishing_aspect: |
          Resource: event venue; semantics: half-open exclusive occupation — an event starting
          exactly at another's end_at is NOT an overlap, while a one-hour interior intersection
          is. Distinct from the sales-center aggregate-capacity semantics.
        test_recipe:
          setup:
            - "Active community; event A SCHEDULED at SALES_CENTER [2026-05-20T10:00Z, 2026-05-20T12:00Z) at the default clock (19-day lead)"
            - "Event B PROPOSED at SALES_CENTER [2026-05-20T12:00Z, 2026-05-20T14:00Z) (adjacent); event C PROPOSED at SALES_CENTER [2026-05-20T11:00Z, 2026-05-20T13:00Z) (interior overlap)"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Adjacency Alley", total_planned_units: 50 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/events"
              payload: { community_id: "${c_id}", title: "Morning Tour", venue: "SALES_CENTER", start_at: "2026-05-20T10:00:00Z", end_at: "2026-05-20T12:00:00Z", capacity: 10 }
              as: LifestyleCoordinator
              captures: { ea_id: $.data.id }
            - call: "POST /mpc/events/${ea_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
            - call: "POST /mpc/events"
              payload: { community_id: "${c_id}", title: "Afternoon Tour", venue: "SALES_CENTER", start_at: "2026-05-20T12:00:00Z", end_at: "2026-05-20T14:00:00Z", capacity: 10 }
              as: LifestyleCoordinator
              captures: { eb_id: $.data.id }
            - call: "POST /mpc/events"
              payload: { community_id: "${c_id}", title: "Overlapping Mixer", venue: "SALES_CENTER", start_at: "2026-05-20T11:00:00Z", end_at: "2026-05-20T13:00:00Z", capacity: 10 }
              as: LifestyleCoordinator
              captures: { ec_id: $.data.id }
          trigger:
            - call: "POST /mpc/events/${eb_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
              captures: { eb_status: $.data.status }
            - call: "POST /mpc/events/${ec_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
              captures: { ec_err: $.data.error_id }
          assert:
            - "adjacent event (start == A.end): ${eb_status} == SCHEDULED (half-open intervals, back-to-back allowed)"
            - "interior-overlapping event: ${ec_err} == ERR_VENUE_OVERLAP (http 409)"

      - name: sales_center_aggregate_capacity_overlap
        grounds:
          - entities.SalesCenterAppointment.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          Resource: sales-center tour slots; semantics: AGGREGATE CAPACITY (up to
          MAX_CONCURRENT_TOURS = 3 overlapping BOOKED appointments), not exclusive occupation —
          the 3rd overlapping booking succeeds, the 4th fails, and completing one frees capacity
          for a retry. Different resource and different interval semantics from the venue rule.
        test_recipe:
          setup:
            - "Active community; three BOOKED appointments overlapping 2026-05-02 morning (10:00-11:00, 10:15-11:15, 10:30-11:30)"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Tour Terrace", total_planned_units: 50 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/appointments"
              payload: { community_id: "${c_id}", agent_name: "Agent A", visitor_name: "V1", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T11:00:00Z" }
              as: LifestyleCoordinator
              captures: { ap1_id: $.data.id, ap1_status: $.data.status }
            - call: "POST /mpc/appointments"
              payload: { community_id: "${c_id}", agent_name: "Agent B", visitor_name: "V2", start_at: "2026-05-02T10:15:00Z", end_at: "2026-05-02T11:15:00Z" }
              as: LifestyleCoordinator
              captures: { ap2_id: $.data.id }
            - call: "POST /mpc/appointments"
              payload: { community_id: "${c_id}", agent_name: "Agent C", visitor_name: "V3", start_at: "2026-05-02T10:30:00Z", end_at: "2026-05-02T11:30:00Z" }
              as: LifestyleCoordinator
              captures: { ap3_id: $.data.id }
          trigger:
            - call: "POST /mpc/appointments"
              payload: { community_id: "${c_id}", agent_name: "Agent D", visitor_name: "V4", start_at: "2026-05-02T10:45:00Z", end_at: "2026-05-02T11:45:00Z" }
              as: LifestyleCoordinator
              captures: { err_cap: $.data.error_id }
            - call: "POST /mpc/appointments/${ap1_id}/complete"
              payload: {}
              as: LifestyleCoordinator
            - call: "POST /mpc/appointments"
              payload: { community_id: "${c_id}", agent_name: "Agent D", visitor_name: "V4", start_at: "2026-05-02T10:45:00Z", end_at: "2026-05-02T11:45:00Z" }
              as: LifestyleCoordinator
              captures: { ap5_status: $.data.status }
          assert:
            - "first three overlapping bookings all BOOKED (${ap1_status} == BOOKED)"
            - "fourth overlapping booking: ${err_cap} == ERR_TOUR_CAPACITY_REACHED (http 409)"
            - "after completing one tour, the retried overlapping booking succeeds: ${ap5_status} == BOOKED"
  # ---------------------------------------------------------------- Rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: district_principal_conservation
        grounds:
          - state_machines.ReimbursementPayment.REQUESTED_to_CERTIFIED
          - state_machines.ReimbursementPayment.CERTIFIED_to_REJECTED
          - calculations.reimbursement_waterfall
          - entities.ReimbursementDistrict.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Conserved quantity: advance principal cents. certify (forward) debits outstanding
          principal; reject (compensating) restores it. Invariant pinned:
          advance_principal_cents == outstanding_principal_cents + sum of certified_principal_cents
          over CERTIFIED-or-PAID payments — checked at 10000000 == 9633000 + 367000 mid-flight and
          10000000 == 10000000 + 0 after the compensating reject.
        test_recipe:
          setup:
            - "Active community; district 5.0%; advances 6,000,000c (2026-01-01) and 4,000,000c (2026-03-01); default clock 2026-05-01"
            - "Baseline: advance_principal_cents == outstanding_principal_cents == 10,000,000; no payments"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Ledger Lakes", total_planned_units: 50 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/districts"
              payload: { community_id: "${c_id}", district_name: "CFD 1", interest_rate_annual_pct: 5.0 }
              as: DeclarantController
              captures: { d_id: $.data.id }
            - call: "POST /mpc/advances"
              payload: { district_id: "${d_id}", amount_cents: 6000000, advance_date: "2026-01-01T00:00:00Z" }
              as: DeclarantController
              captures: { adv1_id: $.data.id }
            - call: "POST /mpc/advances"
              payload: { district_id: "${d_id}", amount_cents: 4000000, advance_date: "2026-03-01T00:00:00Z" }
              as: DeclarantController
              captures: { adv2_id: $.data.id }
            - call: "POST /mpc/payments"
              payload: { district_id: "${d_id}", amount_cents: 500000 }
              as: DeclarantController
              captures: { pay_id: $.data.id }
            - call: "POST /mpc/payments/${pay_id}/certify"
              payload: {}
              as: AssociationDirector
              captures: { cert_i: $.data.certified_interest_cents, cert_p: $.data.certified_principal_cents }
            - call: "GET /mpc/districts/${d_id}"
              as: DeclarantController
              captures: { out_mid: $.data.outstanding_principal_cents, prin_mid: $.data.advance_principal_cents, citd_mid: $.data.certified_interest_to_date_cents }
            - call: "GET /mpc/advances/${adv1_id}"
              as: DeclarantController
              captures: { adv1_reimb: $.data.reimbursed_principal_cents, adv1_status: $.data.status }
          trigger:
            - call: "POST /mpc/payments/${pay_id}/reject"
              payload: {}
              as: AssociationDirector
              captures: { pay_status: $.data.status }
          assert:
            - "post-certify: ${cert_i} == 133000 and ${cert_p} == 367000; ${out_mid} == 9633000 and ${prin_mid} == 10000000"
            - "invariant mid-flight: ${prin_mid} == ${out_mid} + ${cert_p} (10000000 == 9633000 + 367000)"
            - "FIFO waterfall: ${adv1_reimb} == 367000 on the oldest advance; ${adv1_status} == PARTIALLY_REIMBURSED; ${citd_mid} == 133000"
            - "compensating reject: ${pay_status} == REJECTED; GET district shows outstanding_principal_cents == 10000000 and certified_interest_to_date_cents == 0; GET advance ${adv1_id} shows reimbursed_principal_cents == 0 and status OUTSTANDING"
            - "invariant restored: advance_principal_cents(10000000) == outstanding(10000000) + certified principal outstanding in CERTIFIED/PAID payments(0)"

      - name: tranche_credit_conservation
        grounds:
          - state_machines.LotClosing.PENDING_to_CLOSED
          - state_machines.LotClosing.CLOSED_to_RESCINDED
          - calculations.takedown_waterfall_allocation
          - entities.TakedownTranche.fields.lots_credited
        distinguishing_aspect: |
          Conserved quantity: waterfall lot credits (a count, not money). close (forward) credits
          a tranche; rescind (compensating) debits exactly the credited tranche. Invariant pinned:
          sum of lots_credited over all tranches == count of CLOSED closings of the agreement —
          and the transition_stage ratchet is explicitly exempt (PARITY is kept at 25.00 pct).
        test_recipe:
          setup:
            - "Active community (4 units); phase SALES_OPEN; builder; ACTIVE agreement committed 2, tranche T1 due 2026-06-30 covering 2 lots"
            - "Lots L1, L2 OFFERED; clock 2026-06-01; both closings CLOSED (T1 SATISFIED, lots_credited 2; community 50.00 pct -> PARITY)"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Conserve Court", total_planned_units: 4 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 4 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/phases/${p1_id}/open-sales"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/builders"
              payload: { community_id: "${c_id}", legal_name: "Conserve Builders", credit_tier: "A" }
              as: DeclarantExecutive
              captures: { b_id: $.data.id }
            - call: "POST /mpc/agreements"
              payload: { community_id: "${c_id}", builder_id: "${b_id}", phase_id: "${p1_id}", base_price_per_lot_cents: 5000000, annual_escalation_pct: 6.0, penalty_per_lot_per_day_cents: 1000, earnest_money_cents: 1000000, total_lots_committed: 2 }
              as: DeclarantController
              captures: { ag_id: $.data.id }
            - call: "POST /mpc/tranches"
              payload: { agreement_id: "${ag_id}", tranche_no: 1, due_date: "2026-06-30T00:00:00Z", lot_count_due: 2 }
              as: DeclarantController
              captures: { t1_id: $.data.id }
            - call: "POST /mpc/agreements/${ag_id}/execute"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/agreements/${ag_id}/commence"
              payload: {}
              as: DeclarantController
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "L1" }
              as: DeclarantExecutive
              captures: { l1_id: $.data.id }
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "L2" }
              as: DeclarantExecutive
              captures: { l2_id: $.data.id }
            - call: "POST /mpc/lots/${l1_id}/offer"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/lots/${l2_id}/offer"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mpc/closings"
              payload: { agreement_id: "${ag_id}", lot_id: "${l1_id}" }
              as: DeclarantController
              captures: { cl1_id: $.data.id }
            - call: "POST /mpc/closings/${cl1_id}/close"
              payload: {}
              as: DeclarantController
            - call: "POST /mpc/closings"
              payload: { agreement_id: "${ag_id}", lot_id: "${l2_id}" }
              as: DeclarantController
              captures: { cl2_id: $.data.id }
            - call: "POST /mpc/closings/${cl2_id}/close"
              payload: {}
              as: DeclarantController
            - call: "GET /mpc/tranches/${t1_id}"
              as: DeclarantController
              captures: { cred_full: $.data.lots_credited, t1_full_status: $.data.status }
            - call: "GET /mpc/communities/${c_id}"
              as: DeclarantExecutive
              captures: { stage_full: $.data.transition_stage, cnt_full: $.data.closed_unit_count }
          trigger:
            - call: "POST /mpc/closings/${cl2_id}/rescind"
              payload: {}
              as: DeclarantExecutive
              captures: { cl2_status: $.data.status }
          assert:
            - "fully closed: ${cred_full} == 2, ${t1_full_status} == SATISFIED, ${cnt_full} == 2, ${stage_full} == PARITY (50.00 pct)"
            - "rescind (clock 2026-06-01 within the 30-day window): ${cl2_status} == RESCINDED"
            - "compensation: GET /mpc/tranches/${t1_id} -> lots_credited == 1 and status == OPEN (2026-06-01 <= due_date 2026-06-30)"
            - "conservation: sum of lots_credited (1) == count of CLOSED closings for the agreement (1); agreement lots_closed_count == 1"
            - "ratchet exemption: community closed_unit_count == 1 (pct recomputes to 25.00) but transition_stage remains PARITY"
            - "lot L2 returns to OFFERED"
