          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule; spec MB-USPS (8000 g ceiling, allows ONE_QUART); facility \"CA-TF-0001\" capacity 200; MANUFACTURER program 500000 / 5000."
