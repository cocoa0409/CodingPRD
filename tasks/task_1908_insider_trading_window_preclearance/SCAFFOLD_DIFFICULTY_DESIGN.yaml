              as: Insider
              as_user_id: "${person_id}"
              captures: { req_id: $.data.id }
            - call: "POST /preclearance-requests/${req_id}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { req_v2: $.data.version }
            - call: "POST /preclearance-requests/${req_id}/decision"
              payload: { outcome: "APPROVE", expected_preclearance_version: "${req_v2}" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /trade-confirmations"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 40, price: 10.00, trade_date: "2026-08-02T00:00:00Z", broker_ref: "BR-D17" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { conf_id: $.data.id }
            - call: "GET /preclearance-requests/${req_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { matched_mid: $.data.matched_quantity, remaining_mid: $.data.remaining_quantity }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: LegalAdmin
            - call: "POST /blackout-windows"
              payload: { kind: "EVENT_DRIVEN", security_ticker: "ACME", start_at: "2026-08-02T00:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
