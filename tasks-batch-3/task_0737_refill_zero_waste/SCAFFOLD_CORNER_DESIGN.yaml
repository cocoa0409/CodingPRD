# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0737
# Breadth probe over the claim-extraction guide sections. Active instances carry
# full test_recipes; corners already covered by a §1.8 instance are emitted as
# excluded_because stubs. Names are unique across §1.8 ∪ §1.9.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: corner_create_member_success
        claim_type: creation
        grounds: [entities.Member.fields.email, entities.Member.fields.membership_tier]
        distinguishing_aspect: "POST /v1/members with email+full_name returns 201 with a server-minted id and membership_tier default BASIC."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/members", payload: { email: "c1@x.com", full_name: "Corner One" }, as: StoreClerk, captures: { mid: "$.data.id" } }
          assert:
            - "HTTP status == 201"
            - "Member.${mid}.membership_tier == BASIC"
            - "Member.${mid}.wallet_balance_cents == 0"

      - name: corner_err_member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/members/{unknown uuid} returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/members/00000000-0000-4000-8000-000000000000", payload: {}, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 404"
            - "captured err == ERR_MEMBER_NOT_FOUND"

      - name: corner_err_product_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.Product.fields.unit_price_cents_per_100g, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /v1/products omitting the required unit_price_cents_per_100g returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/products", payload: { name: "Bad", category: "GRAINS", bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 400"
            - "captured err == ERR_VALIDATION"

      - name: corner_member_computed_balances_start_zero
        claim_type: computed_fields
        grounds: [entities.Member.fields.wallet_balance_cents, entities.Member.fields.deposit_liability_cents, entities.Member.fields.loyalty_points_balance]
        distinguishing_aspect: "A freshly created member projects wallet_balance_cents=0, deposit_liability_cents=0, loyalty_points_balance=0 (empty WalletLedger)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c2@x.com", full_name: "Corner Two" }, as: StoreClerk, captures: { mid: "$.data.id" } }
          trigger:
            - { call: "GET /v1/members/${mid}", payload: {}, as: StoreClerk, captures: { w: "$.data.wallet_balance_cents" } }
          assert:
            - "Member.${mid}.wallet_balance_cents == 0"
            - "Member.${mid}.deposit_liability_cents == 0"
            - "Member.${mid}.loyalty_points_balance == 0"

      - name: corner_container_deposit_derived_from_type
        claim_type: computed_fields
        grounds: [entities.Container.fields.deposit_cents, entities.Container.fields.container_type]
        distinguishing_aspect: "Registering a GLASS_1000 container sets deposit_cents=250 from the type (input deposit is ignored/derived)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/containers", payload: { container_type: "GLASS_1000", declared_tare_g: 400 }, as: StoreClerk, captures: { cid: "$.data.deposit_cents" } }
          assert:
            - "captured cid == 250"

      - name: corner_order_invalid_channel_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Order.fields.fulfillment_channel, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /v1/orders with fulfillment_channel='AIR' (not IN_STORE|DELIVERY) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["a member and a station exist"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c3@x.com", full_name: "Corner Three" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders", payload: { member_id: "${mid}", station_id: "${sid}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z", fulfillment_channel: "AIR" }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 400"
            - "captured err == ERR_VALIDATION"

      - name: corner_err_bin_create_unknown_product_not_found
        claim_type: parent_relationships
        grounds: [entities.BulkBin.fields.product_id, "errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "POST /v1/bins whose product_id FK does not resolve returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["a station exists"]
          setup_api_calls:
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
          trigger:
            - { call: "POST /v1/bins", payload: { product_id: "00000000-0000-4000-8000-000000000000", station_id: "${sid}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 404"
            - "captured err == ERR_PRODUCT_NOT_FOUND"

      - name: corner_list_orders_pagination
        claim_type: listing
        grounds: [entities.Order.fields.member_id, endpoints]
        distinguishing_aspect: "GET /v1/orders?member_id=..&limit=1 over two orders returns one item with total_count=2 and has_more=true in the envelope."
        test_recipe:
          setup: ["a member with two CART orders on distinct non-overlapping station windows"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c4@x.com", full_name: "Corner Four" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${mid}", station_id: "${sid}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk }
            - { call: "POST /v1/orders", payload: { member_id: "${mid}", station_id: "${sid}", fill_window_start_at: "2026-03-02T10:00:00Z", fill_window_end_at: "2026-03-02T11:00:00Z" }, as: StoreClerk }
          trigger:
            - { call: "GET /v1/orders", payload: { member_id: "${mid}", limit: 1, offset: 0 }, as: StoreClerk }
          assert:
            - "response envelope meta present; data is an array of length 1"
            - "total_count == 2 and has_more == true"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: corner_issue_container_already_issued_rejected
        claim_type: invalid_transitions
        grounds: [state_machines.Container.AVAILABLE_to_ISSUED, "errors[ERR_INVALID_CONTAINER_STATE]"]
        distinguishing_aspect: "Issuing a container that is already ISSUED (second issue) returns ERR_INVALID_CONTAINER_STATE; no state change."
        test_recipe:
          setup: ["a member and an AVAILABLE container issued once (now ISSUED)"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c5@x.com", full_name: "Corner Five" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "GLASS_500", declared_tare_g: 250 }, as: StoreClerk, captures: { cid: "$.data.id" } }
            - { call: "POST /v1/containers/${cid}/issue", payload: { member_id: "${mid}" }, as: StoreClerk }
          trigger:
            - { call: "POST /v1/containers/${cid}/issue", payload: { member_id: "${mid}" }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "captured err == ERR_INVALID_CONTAINER_STATE"

      - name: corner_checkout_with_provisional_line_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Order.FILLING_to_FILLED, "errors[ERR_INVALID_ORDER_STATE]"]
        distinguishing_aspect: "Checkout of a FILLING order that still has a PROVISIONAL (unfilled) line returns ERR_INVALID_ORDER_STATE; payment not captured."
        test_recipe:
          setup: ["member; Oats product; station; Oats bin on_hand 5000; BYO container; order in FILLING with one still-PROVISIONAL line"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c6@x.com", full_name: "Corner Six" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { pid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${pid}", station_id: "${sid}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { bid: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${mid}" }, as: StoreClerk, captures: { cid: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${mid}", station_id: "${sid}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { oid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/lines", payload: { product_id: "${pid}", container_id: "${cid}", estimated_gross_g: 700 }, as: StoreClerk, captures: { lid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/start-fill", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/orders/${oid}/checkout", payload: {}, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "captured err == ERR_INVALID_ORDER_STATE"
            - "Order.${oid}.payment_status == UNPAID"

      - name: corner_inspect_available_container_rejected
        claim_type: invalid_transitions
        grounds: [state_machines.Container.RETURNED_to_AVAILABLE, "errors[ERR_INVALID_CONTAINER_STATE]"]
        distinguishing_aspect: "Inspecting a container that is AVAILABLE (never returned) returns ERR_INVALID_CONTAINER_STATE — inspect requires RETURNED or QUARANTINED."
        test_recipe:
          setup: ["an AVAILABLE container"]
          setup_api_calls:
            - { call: "POST /v1/containers", payload: { container_type: "GLASS_500", declared_tare_g: 250 }, as: StoreClerk, captures: { cid: "$.data.id" } }
          trigger:
            - { call: "POST /v1/containers/${cid}/inspect", payload: { result: "CLEAN" }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "captured err == ERR_INVALID_CONTAINER_STATE"

      - name: corner_subscription_run_after_cancel_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Running a CANCELLED subscription returns ERR_INVALID_STATE (state precondition beats the OCC check); no order minted."
        test_recipe:
          setup: ["member; Oats product; station; an ACTIVE subscription then CANCELLED"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c7@x.com", full_name: "Corner Seven" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { pid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
            - { call: "POST /v1/subscriptions", payload: { member_id: "${mid}", product_id: "${pid}", station_id: "${sid}", target_net_g: 500, interval_days: 7 }, as: StoreClerk, captures: { subid: "$.data.id", sv: "$.data.version" } }
            - { call: "POST /v1/subscriptions/${subid}/cancel", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/subscriptions/${subid}/run", payload: { expected_subscription_version: "${sv}" }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "captured err == ERR_INVALID_STATE"

      - name: corner_fill_from_cart_invalid_order_state
        claim_type: invalid_transitions
        grounds: [state_machines.RefillLine.PROVISIONAL_to_FINAL]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_beats_fiscal_on_fill"
          rationale: "Filling a line whose order is still CART returning ERR_INVALID_ORDER_STATE is exactly the state-precondition arm asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: corner_shrink_reconciliation_partial_dispense
        claim_type: correct_result
        grounds: [calculations.shrink_reconciliation, entities.BulkBin.fields.last_shrink_g, entities.BulkBin.fields.on_hand_g]
        distinguishing_aspect: "Bin baseline 5000, one FINAL dispense of net 300 (book 4700), recount physical 4650 -> last_shrink_g=50, on_hand_g=4650, status stays OPEN."
        test_recipe:
          setup: ["member; Oats product; station; Oats bin on_hand 5000 (reorder 100); one line filled to net 300 (bin on_hand 4700)"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c8@x.com", full_name: "Corner Eight" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { pid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${pid}", station_id: "${sid}", capacity_g: 8000, reorder_threshold_g: 100, last_recount_g: 5000 }, as: InventoryManager, captures: { bid: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${mid}" }, as: StoreClerk, captures: { cid: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${mid}", station_id: "${sid}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { oid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/lines", payload: { product_id: "${pid}", container_id: "${cid}", estimated_gross_g: 500 }, as: StoreClerk, captures: { lid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/start-fill", payload: {}, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${lid}/fill", payload: { gross_weight_g: 500, measured_tare_g: 200 }, as: StoreClerk }
          trigger:
            - { call: "POST /v1/bins/${bid}/recount", payload: { physical_g: 4650 }, as: InventoryManager, captures: { shrink: "$.data.last_shrink_g", st: "$.data.status" } }
          assert:
            - "captured shrink == 50"
            - "BulkBin.${bid}.on_hand_g == 4650"
            - "captured st == OPEN"

      - name: corner_order_tax_on_taxable_line
        claim_type: constants_applied
        grounds: [calculations.order_totals, entities.Product.fields.taxable, entities.Order.fields.tax_cents]
        distinguishing_aspect: "One taxable line (net 100 -> goods 100c) with BASIC member and BYO container yields subtotal 100, tax_cents=round_half_up(0.08*100)=8, total 108."
        test_recipe:
          setup: ["BASIC member; taxable product (unit 100, no bulk); station; bin on_hand 5000; BYO container tare 200; order with one line filled to net 100"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c9@x.com", full_name: "Corner Nine", membership_tier: "BASIC" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "SoapTaxable", category: "CLEANING", unit_price_cents_per_100g: 100, bulk_tier_threshold_g: 100000, bulk_tier_price_cents_per_100g: 100, taxable: true }, as: InventoryManager, captures: { pid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${pid}", station_id: "${sid}", capacity_g: 8000, reorder_threshold_g: 100, last_recount_g: 5000 }, as: InventoryManager, captures: { bid: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${mid}" }, as: StoreClerk, captures: { cid: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${mid}", station_id: "${sid}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { oid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/lines", payload: { product_id: "${pid}", container_id: "${cid}", estimated_gross_g: 300 }, as: StoreClerk, captures: { lid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/start-fill", payload: {}, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${lid}/fill", payload: { gross_weight_g: 300, measured_tare_g: 200 }, as: StoreClerk }
          trigger:
            - { call: "POST /v1/orders/${oid}/checkout", payload: {}, as: StoreClerk, captures: { tax: "$.data.tax_cents" } }
          assert:
            - "Order.${oid}.subtotal_cents == 100"
            - "captured tax == 8"
            - "Order.${oid}.total_cents == 108"

      - name: corner_loyalty_final_accrual_value
        claim_type: correct_result
        grounds: [calculations.loyalty_accrual]
        excluded_because:
          difficulty_instance: "dual_variant_calc / loyalty_provisional_vs_final_divergence"
          rationale: "The FINAL loyalty accrual value credited to the member is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: corner_err_products_missing_auth_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /v1/products without a valid X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 401"
            - "captured err == ERR_UNAUTHENTICATED"

      - name: corner_err_tare_exceeds_gross_on_fill
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_TARE_EXCEEDS_GROSS]"]
        distinguishing_aspect: "Filling with measured_tare_g (200) equal to gross_weight_g (200) -> net 0 -> ERR_TARE_EXCEEDS_GROSS (422)."
        test_recipe:
          setup: ["member; Oats product; station; bin on_hand 5000; BYO container tare 200; order FILLING with one PROVISIONAL line"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c10@x.com", full_name: "Corner Ten" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { pid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${pid}", station_id: "${sid}", capacity_g: 8000, reorder_threshold_g: 100, last_recount_g: 5000 }, as: InventoryManager, captures: { bid: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${mid}" }, as: StoreClerk, captures: { cid: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${mid}", station_id: "${sid}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { oid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/lines", payload: { product_id: "${pid}", container_id: "${cid}", estimated_gross_g: 500 }, as: StoreClerk, captures: { lid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/start-fill", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/refill-lines/${lid}/fill", payload: { gross_weight_g: 200, measured_tare_g: 200 }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 422"
            - "captured err == ERR_TARE_EXCEEDS_GROSS"

      - name: corner_err_insufficient_stock_on_fill
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "On a FILLING order (state OK), filling net 300 against a bin with on_hand only 50 returns ERR_INSUFFICIENT_STOCK (409) — the fiscal check, reachable now that state passes."
        test_recipe:
          setup: ["member; Oats product; station; bin on_hand 50 (reorder 0); BYO container tare 200; order FILLING with one PROVISIONAL line"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c11@x.com", full_name: "Corner Eleven" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { pid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${pid}", station_id: "${sid}", capacity_g: 8000, reorder_threshold_g: 0, last_recount_g: 50 }, as: InventoryManager, captures: { bid: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${mid}" }, as: StoreClerk, captures: { cid: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${mid}", station_id: "${sid}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { oid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/lines", payload: { product_id: "${pid}", container_id: "${cid}", estimated_gross_g: 500 }, as: StoreClerk, captures: { lid: "$.data.id" } }
            - { call: "POST /v1/orders/${oid}/start-fill", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/refill-lines/${lid}/fill", payload: { gross_weight_g: 500, measured_tare_g: 200 }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "captured err == ERR_INSUFFICIENT_STOCK"

      - name: corner_err_duplicate_email_on_member_create
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_EMAIL]", entities.Member.fields.email]
        distinguishing_aspect: "Registering a second member with an email already in use returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["a member registered with email dup@x.com"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "dup@x.com", full_name: "First" }, as: StoreClerk, captures: { mid: "$.data.id" } }
          trigger:
            - { call: "POST /v1/members", payload: { email: "dup@x.com", full_name: "Second" }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "captured err == ERR_DUPLICATE_EMAIL"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: corner_member_cannot_create_product_returns_403
        claim_type: role_denial
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Member calling POST /v1/products (an InventoryManager-exclusive op) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["a member exists (acts as itself)"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c12@x.com", full_name: "Corner Twelve" }, as: StoreClerk, captures: { mid: "$.data.id" } }
          trigger:
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: Member, as_user_id: "${mid}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 403"
            - "captured err == ERR_UNAUTHORIZED"

      - name: corner_storeclerk_cannot_recount_bin_returns_403
        claim_type: role_denial
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A StoreClerk calling POST /v1/bins/{id}/recount (InventoryManager-exclusive) is denied with ERR_UNAUTHORIZED (403); peer-role isolation."
        test_recipe:
          setup: ["a product, station, and bin exist"]
          setup_api_calls:
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { pid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${pid}", station_id: "${sid}", capacity_g: 8000, reorder_threshold_g: 100, last_recount_g: 5000 }, as: InventoryManager, captures: { bid: "$.data.id" } }
          trigger:
            - { call: "POST /v1/bins/${bid}/recount", payload: { physical_g: 4900 }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 403"
            - "captured err == ERR_UNAUTHORIZED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_subscription_run_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-run-stale-version]", "errors[ERR_STALE_VERSION]", "validations[priority=10]"]
        distinguishing_aspect: "After a successful run bumps Subscription.version 1->2, a second strictly-sequential run still carrying expected_subscription_version=1 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["member; Oats product; station; an ACTIVE subscription whose create response yields version 1"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "c13@x.com", full_name: "Corner Thirteen" }, as: StoreClerk, captures: { mid: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { pid: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { sid: "$.data.id" } }
            - { call: "POST /v1/subscriptions", payload: { member_id: "${mid}", product_id: "${pid}", station_id: "${sid}", target_net_g: 500, interval_days: 7 }, as: StoreClerk, captures: { subid: "$.data.id", sv: "$.data.version" } }
            - { call: "POST /v1/subscriptions/${subid}/run", payload: { expected_subscription_version: "${sv}" }, as: StoreClerk }
          trigger:
            - { call: "POST /v1/subscriptions/${subid}/run", payload: { expected_subscription_version: "${sv}" }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 412"
            - "captured err == ERR_STALE_VERSION"

      - name: corner_cascading_fill_low_restock
        claim_type: cascading_side_effects
        grounds: [state_machines.BulkBin.OPEN_to_LOW]
        excluded_because:
          difficulty_instance: "transitive_cascade / fill_depletes_bin_low_creates_restock"
          rationale: "The fill -> bin depletion -> LOW -> RestockTask cascade is verified end-to-end by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: corner_immediate_totals_in_checkout_response
        claim_type: immediate
        grounds: [entities.Order.fields.subtotal_cents]
        excluded_because:
          difficulty_instance: "combinatorial_formula / order_subtotal_round_per_line_then_sum"
          rationale: "The checkout response immediately reflecting the recomputed subtotal is asserted by the named §1.8 instance."
