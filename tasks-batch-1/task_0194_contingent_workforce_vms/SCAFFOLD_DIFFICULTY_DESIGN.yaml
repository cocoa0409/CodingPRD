              as: Supplier
              as_user_id: "${s1}"
              captures: { sub_a: $.data.id }
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${s2}", worker_profile_id: "${wkr_b}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${s2}"
              captures: { sub_b: $.data.id }
            - call: "POST /vms/submittals/${sub_a}/shortlist"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_a}/start_interview"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_a}/propose_rate"
              payload: { pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${s1}"
            - call: "POST /vms/submittals/${sub_a}/offer"
              payload: {}
              as: HiringManager
          trigger:
            - call: "POST /vms/submittals/${sub_a}/hire"
              payload: { expected_requisition_version: "${req_v}", start_date: "2026-01-01T00:00:00.000Z", planned_end_date: "2026-06-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "GET /vms/requisitions/${req_id}"
              payload: {}
              as: ProgramManager
              captures: { req_status: $.data.status, fc: $.data.filled_count }
            - call: "GET /vms/submittals/${sub_b}"
              payload: {}
              as: ProgramManager
              captures: { sub_b_status: $.data.status }
            - call: "GET /vms/distributions"
              payload: {}
              as: ProgramManager
          assert:
            - "Requisition.${req_id}.status == FILLED"
            - "Requisition.${req_id}.filled_count == 1"
            - "Submittal.${sub_b}.status == REJECTED"
            - "The Distribution for s2 has status == REVOKED"

      - name: milestone_invoice_bubbles_sow_to_completed
        grounds:
          - state_machines.Milestone.ACCEPTED_to_INVOICED
          - state_machines.StatementOfWork.ACTIVE_to_COMPLETED
          - entities.StatementOfWork.fields.invoiced_value_cents
          - entities.StatementOfWork.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from the milestone-invoice trigger (a DIFFERENT trigger
          than hire): invoicing the last milestone increments SOW.invoiced_value_cents
          (link1) and, because that makes every milestone INVOICED, drives SOW
          ACTIVE->COMPLETED (link2, caused by link1's all-invoiced condition).
        test_recipe:
          setup:
            - "ACTIVE SOW with a single milestone amount 50000, milestone ACCEPTED"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
