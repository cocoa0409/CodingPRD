        grounds:
          - calculations.case_occupancy_window.interval_semantics
          - validations[priority=58]
          - state_machines[ProcedureCase.schedule_status].transitions[schedule].preconditions
        distinguishing_aspect: |
          Boundary of an INTERVAL: the room's occupancy interval is half-open, so
          the test probes block_end_at minus one minute (rejected) and block_end_at
          exactly (accepted). The discriminating pair is one minute wide and the
          boundary instant 15:00 is itself a derived value (14:00 + 20 procedure +
          40 turnover), so an off-by-one in either the arithmetic or the interval
          comparison changes the verdict. The other precision instance probes a
          NUMERIC threshold and a rounding step instead of a time interval.
