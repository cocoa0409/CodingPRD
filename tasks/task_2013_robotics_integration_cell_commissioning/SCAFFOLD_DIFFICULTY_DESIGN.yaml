          trigger:
            - call: "POST /robotics/robot-programs/${rp_id}/code-complete"
              payload: {}
              as: ControlsProgrammer
              as_user_id: "${prog_id}"
            - call: "POST /robotics/robot-programs/${rp_id}/peer-review"
              payload: {}
              as: ControlsProgrammer
