      - name: batches_move_to_reconciled_when_the_period_distributes
        claim_type: side_effect_execution
        grounds:
          - state_machines.AccountingPeriod.USAGE_SEALED_to_DISTRIBUTED
          - state_machines.UsageBatch.MATCHED_to_RECONCILED
          - state_machines.UsageBatch.PARTIALLY_MATCHED_to_RECONCILED
        distinguishing_aspect: |
          Finalizing the last pool bubbles the period to DISTRIBUTED, and that single bubble drags
          BOTH batch shapes to RECONCILED — the fully matched batch and the partially matched one
          alike — even though no call ever addressed a batch. RECONCILED is terminal, so the
          partially matched batch can never be completed afterwards.
        test_recipe:
          setup:
            - "GB/INDIVIDUAL schedule EFFECTIVE at revenue_share_bps 7000 / per_subscriber_minimum_cents 500 / statutory floor 100 millicents / mechanical 4000 / performance 6000, window 2026-01-01..2026-12-31."
            - "Period 2026-06 with two batches: batch A carrying one 300000-play line matched by exact ISRC (-> MATCHED), batch B carrying one 50000-play line whose reported_title matches no work (-> PARTIALLY_MATCHED)."
            - "One pool GB/INDIVIDUAL with subscriber_count 1000 and gross_revenue_cents 1428570, calculated but not yet finalized."
          setup_api_calls:
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-01", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
