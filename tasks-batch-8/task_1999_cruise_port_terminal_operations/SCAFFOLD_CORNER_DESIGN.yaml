            - { call: "GET /port-ops/manifest-entries/${ed}", as: TerminalOperator, captures: { dst: $.data.status } }
          assert:
            - "ManifestEntry.${ed}.status == CARRIED_AWAY"
      - name: call_cancel_compensation_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.PortCall.SCHEDULED_to_CANCELLED
          - state_machines.TransportSlot.QUEUED_to_EXPIRED
        distinguishing_aspect: "Cancelling a SCHEDULED call compensates every dependent: live assignment SUPERSEDED, REQUESTED/APPROVED orders CANCELLED, QUEUED slot EXPIRED, entries CANCELLED."
        test_recipe:
          setup: ["Call SCHEDULED with CONFIRMED assignment, one APPROVED service order, one QUEUED taxi slot, one BOOKED entry"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/service-orders", payload: { kind: "PROVISIONING", units: 5, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: VesselAgent, as_user_id: "${ves}", captures: { so: $.data.id } }
            - { call: "POST /port-ops/service-orders/${so}/approve", as: TerminalOperator, as_user_id: "op-1" }
            - { call: "POST /port-ops/transport-slots", payload: { terminal_id: "${term}", port_call_id: "${pc}", vehicle_class: "TAXI", party_size: 2 }, as: TerminalOperator, captures: { ts: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P1", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/cancel", payload: { reason: "itinerary change" }, as: VesselAgent, as_user_id: "${ves}" }
            - { call: "GET /port-ops/berth-assignments/${ba}", as: Harbormaster, captures: { bast: $.data.status } }
            - { call: "GET /port-ops/service-orders/${so}", as: Harbormaster, captures: { sost: $.data.status } }
            - { call: "GET /port-ops/transport-slots/${ts}", as: TerminalOperator, captures: { tsst: $.data.status } }
