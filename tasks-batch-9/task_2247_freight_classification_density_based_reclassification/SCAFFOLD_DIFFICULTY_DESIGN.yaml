              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version"}
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id"}
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "156600", description: "Machine parts, boxed", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp1: "$.data.id"}
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "CLASS_BASED", base_rate_per_cwt_cents: 4200, discount_pct: 0.35, min_charge_cents: 12500 }
              as: PricingAnalyst
              captures: { rp1: "$.data.id"}
            - call: "POST /ltl/rate-programs/${rp1}/approve"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs/${rp1}/activate"
              payload: { expected_customer_version: "${cust1_v}" }
              as: PricingAnalyst
            - call: "POST /ltl/shipments"
              payload: { customer_id: "${cust1}", origin_terminal_id: "${trm1}", pro_number: "PRO2001", pickup_at: "2026-01-10T08:00:00Z", bol_declared_total_weight_lb: 400 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { sh1: "$.data.id"}
            - call: "POST /ltl/shipments/${sh1}/lines"
              payload: { line_no: 1, commodity_profile_id: "${cp1}", declared_class_code: 70, declared_weight_lb: 400, pieces: 4, declared_length_in: 48.0, declared_width_in: 40.0, declared_height_in: 48.0 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { ln1: "$.data.id"}
            - call: "POST /ltl/shipments/${sh1}/bill"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/capture-events"
              payload: { shipment_id: "${sh1}", device_type: "COMBINED", measured_total_weight_lb: 520, line_measurements: [{line_no: 1, measured_weight_lb: 520, measured_length_in: 48.0, measured_width_in: 40.0, measured_height_in: 48.0}] }
              as: TerminalOperator
              as_user_id: "${trm1}"
              captures: { ce1: "$.data.id"}
            - call: "GET /ltl/correction-notices"
              payload: { shipment_id: "${sh1}" }
              as: ClassificationAuditor
              as_user_id: "aud-1"
              captures: { n1: "$.data[0].id"}
            - call: "POST /ltl/correction-notices/${n1}/issue"
              payload: {}
              as: ClassificationAuditor
              as_user_id: "aud-1"
            - call: "POST /ltl/disputes"
              payload: { correction_notice_id: "${n1}", claim_basis: "DENSITY_RECOMPUTE", evidence_doc_count: 1 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { d1: "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/disputes/${d1}/resolve"
              payload: { outcome: "UPHELD_CARRIER", resolution_note: "Dimensioner evidence stands." }
              as: DisputeReviewer
              as_user_id: "rev-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PricingAnalyst
            - call: "GET /ltl/shipments/${sh1}"
              payload: {}
              as: ClassificationAuditor
              as_user_id: "aud-1"
              captures: { sh1_v: "$.data.version"}
            - call: "POST /ltl/correction-notices"
              payload: { shipment_id: "${sh1}", notice_type: "RECLASS", expected_shipment_version: "${sh1_v}", basis_capture_event_id: "${ce1}" }
              as: ClassificationAuditor
              as_user_id: "aud-1"
              captures: { n2: "$.data.id"}
            - call: "POST /ltl/correction-notices/${n2}/issue"
              payload: {}
              as: ClassificationAuditor
              as_user_id: "aud-1"
            - call: "POST /ltl/disputes"
              payload: { correction_notice_id: "${n2}", claim_basis: "EXCEPTION_AGREEMENT", evidence_doc_count: 2 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { d2: "$.data.id"}
          trigger:
            - call: "POST /ltl/disputes/${d2}/resolve"
