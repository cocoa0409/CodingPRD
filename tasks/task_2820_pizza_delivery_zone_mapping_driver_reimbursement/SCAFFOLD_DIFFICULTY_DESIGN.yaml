  - rule_id: transitive_cascade
    instances:

      - name: door_arrival_four_hop_cascade_to_store_cash_and_drop_posture
        grounds:
          - state_machines.Order.fulfillment_status.EN_ROUTE_to_DELIVERED
          - state_machines.Order.settlement_status.DISCLOSED_to_CHARGED
          - calculations.driver_cash_position
          - entities.Store.fields.safe_deposit_total_cents
          - entities.Driver.fields.cash_posture
          - entities.Store.fields.cash_collected_total_cents
          - entities.ReimbursementLine.fields.line_type
          - endpoints.POST_dispatch_stop_door_arrival
        distinguishing_aspect: |
          One door-arrival call must propagate four hops: (1) DispatchStop
          PENDING -> DELIVERED, (2) the stop's Order moves on BOTH dimensions
          (EN_ROUTE -> DELIVERED and DISCLOSED -> CHARGED) and its timing fields
          are stamped, (3) the Driver's cash_on_hand_cents rises to 2900 which
          re-derives cash_posture to DROP_REQUIRED because the store's
          cash_limit_cents is exactly 2900, and (4) the Store's
          cash_collected_total_cents rises to 2900 while unassigned_order_count
          falls to 0, and a PROVISIONAL_STOP ReimbursementLine of 336 cents is
          written. Stopping at hop 2 leaves cash_posture CLEAR; stopping at hop 3
          leaves the store totals stale.
        test_recipe:
          setup:
            - "A store whose cash_limit_cents is exactly 2900, with the ceiling-40 zone model and one IN_ZONE address at grid 3.00 miles."
            - "A CAR cost model and one QUALIFIED insured CAR driver."
            - "A CASH order of food 2200 plus tip 500 placed at 12:00:00Z, whose computed total_charge_cents is 2900."
            - "That order zone-cleared, fee-disclosed, produced READY, stacked as the only stop on a dispatch which is locked and departed; the clock is then advanced to 12:36:00Z."
