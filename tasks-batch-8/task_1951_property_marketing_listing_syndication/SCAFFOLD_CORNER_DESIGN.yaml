scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_listing_defaults_and_initial_state
        claim_type: defaults
        grounds: [entities.Listing, state_machines.Listing]
        distinguishing_aspect: "A freshly created listing starts DRAFT / NOT_SYNDICATED with relist_count 0, version 1, and null scores."
        test_recipe:
          setup: ["Agent exists"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
          assert:
            - "Listing.lifecycle_status == DRAFT and syndication_posture == NOT_SYNDICATED"
            - "Listing.relist_count == 0 and version == 1"
            - "feedback_score_raw == null and feedback_score_weighted == null"
            - "omitted optional fields (bedrooms, bathrooms, square_feet, marketing_remarks, mls_number) are null"

      - name: create_listing_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Listing, "validations[priority=5]"]
        distinguishing_aspect: "Omitting required field list_price_cents yields 400 ERR_INVALID_REQUEST and no listing is created."
        test_recipe:
          setup: ["Agent exists"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", listing_expires_on: "2027-01-01T00:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST with http 400"

      - name: get_listing_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Listing, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent listing id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /listings/00000000-0000-0000-0000-000000000000", payload: {}, as: MarketingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND with http 404"

      - name: system_fields_client_input_ignored_on_create
        claim_type: system_fields
        grounds: [entities.Agent]
        distinguishing_aspect: "Client-supplied id and version on POST /agents are ignored: server mints the id and version starts at 1."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-9", email: "a@x.com", id: "client-supplied", version: 99 }, as: MarketingDirector, captures: { new_id: $.data.id, new_v: $.data.version } }
          assert:
            - "${new_id} != 'client-supplied' and ${new_v} == 1"

      - name: agent_license_uniqueness_enforced
        claim_type: type_constraints
        grounds: [entities.Agent.fields.license_number, "validations[priority=10]"]
        distinguishing_aspect: "Second agent with the same license_number is rejected with ERR_DUPLICATE_LICENSE."
        test_recipe:
          setup: ["One agent with license LIC-1 exists"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector }
          trigger:
            - { call: "POST /agents", payload: { full_name: "Bob Broker", license_number: "LIC-1", email: "b@x.com" }, as: MarketingDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_LICENSE with http 409"

      - name: create_listing_with_unknown_agent_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.Listing.fields.agent_id, "validations[priority=4]"]
        distinguishing_aspect: "Body FK agent_id that does not resolve is rejected with ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /listings", payload: { agent_id: "00000000-0000-0000-0000-000000000000", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z" }, as: ListingAgent, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND with http 404"

      - name: server_clock_defaults_to_fixed_epoch
        claim_type: system_fields
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Without any clock-set call, server timestamps equal the fixed default 2026-08-01T00:00:00Z, never wall-clock."
        test_recipe:
          setup: ["Empty database; clock never set"]
          setup_api_calls: []
          trigger:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { ts: $.data.created_at } }
          assert:
            - "${ts} == 2026-08-01T00:00:00Z"

      - name: listing_events_seq_monotonic_per_listing
        claim_type: computed_fields
        grounds: [entities.ListingEvent.fields.seq]
        distinguishing_aspect: "ListingEvent.seq increments by 1 per event on the same listing across mixed event types."
        test_recipe:
          setup: ["Complete listing; submitted; approved; activated; one price change"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv: $.data.version } }
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 49500000, expected_listing_version: "${lv}" }, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "GET /listings/${l_id}/events", payload: {}, as: MarketingCoordinator }
          assert:
            - "3 events with seq [1, 2, 3]: STATUS_CHANGE(submit), STATUS_CHANGE(activate), PRICE_CHANGE(49500000)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_review_from_active_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Listing.DRAFT_to_PENDING_REVIEW]
        distinguishing_aspect: "submit-review is only valid from DRAFT; from ACTIVE it fails with ERR_INVALID_STATE and creates no review."
        test_recipe:
          setup: ["ACTIVE listing"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE; lifecycle stays ACTIVE; still exactly 1 ComplianceReview"

      - name: sold_terminal_lockdown_withdraw_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Listing.UNDER_CONTRACT_to_SOLD]
        distinguishing_aspect: "SOLD is terminal: withdraw from SOLD fails with ERR_INVALID_STATE and no cascade fires."
        test_recipe:
          setup: ["Listing driven ACTIVE -> UNDER_CONTRACT -> SOLD"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/mark-under-contract", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/close-sold", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /listings/${l_id}/withdraw", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE; lifecycle stays SOLD; terminal_entered_at stays null"

      - name: feedback_exclude_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.ShowingFeedback.INCLUDED_to_EXCLUDED]
        distinguishing_aspect: "Second exclude on an already EXCLUDED feedback fails with ERR_INVALID_STATE; scores unchanged after the second attempt."
        test_recipe:
          setup: ["ACTIVE listing; one ended window with feedback rating 4"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/showing-windows", payload: { starts_at: "2026-08-01T10:00:00Z", ends_at: "2026-08-01T11:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { w1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: MarketingDirector }
            - { call: "POST /showing-windows/${w1}/feedback", payload: { rating: 4 }, as: ListingAgent, as_user_id: "${a_id}", captures: { fb: $.data.id } }
            - { call: "POST /feedbacks/${fb}/exclude", payload: {}, as: MarketingCoordinator }
          trigger:
            - { call: "POST /feedbacks/${fb}/exclude", payload: {}, as: MarketingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE; feedback stays EXCLUDED; both scores stay null (no INCLUDED rows)"

      - name: media_archive_from_uploaded_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MediaAsset]
        distinguishing_aspect: "archive is valid only from READY or REJECTED; from UPLOADED it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["DRAFT listing with one UPLOADED video"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "VIDEO", file_url: "https://cdn/v.mp4", file_bytes: 999999 }, as: ListingAgent, as_user_id: "${a_id}", captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /media-assets/${v_id}/archive", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE; asset stays UPLOADED"

      - name: subscription_pause_resume_cycle_queues_full_sync
        claim_type: valid_transition
        grounds: [state_machines.FeedSubscription]
        distinguishing_aspect: "SUBSCRIBED -> PAUSED -> SUBSCRIBED cycle works; resume on an ACTIVE listing with ACTIVE portal queues a fresh FULL_SYNC job."
        test_recipe:
          setup: ["ACTIVE listing with one SUBSCRIBED subscription (FULL_SYNC job QUEUED, never dispatched)"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX" }, as: MarketingDirector, captures: { p_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${p_id}" }, as: MarketingCoordinator, captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /feed-subscriptions/${sub_id}/pause", payload: {}, as: MarketingCoordinator }
            - { call: "POST /feed-subscriptions/${sub_id}/resume", payload: {}, as: MarketingCoordinator }
            - { call: "GET /feed-subscriptions/${sub_id}/jobs", payload: {}, as: MarketingCoordinator }
          assert:
            - "after pause: status PAUSED and the original FULL_SYNC job is CANCELLED"
            - "after resume: status SUBSCRIBED and a second FULL_SYNC job exists in QUEUED"

      - name: reactivate_under_contract_cycle_with_status_jobs
        claim_type: valid_transition
        grounds: [state_machines.Listing.ACTIVE_to_UNDER_CONTRACT, state_machines.Listing.UNDER_CONTRACT_to_ACTIVE]
        distinguishing_aspect: "ACTIVE -> UNDER_CONTRACT -> ACTIVE fall-through cycle queues one STATUS_UPDATE job per transition per SUBSCRIBED subscription."
        test_recipe:
          setup: ["ACTIVE listing with one SUBSCRIBED subscription"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX" }, as: MarketingDirector, captures: { p_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${p_id}" }, as: MarketingCoordinator, captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /listings/${l_id}/mark-under-contract", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/reactivate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "GET /listings/${l_id}/feed-events", payload: { job_type: "STATUS_UPDATE" }, as: MarketingCoordinator }
          assert:
            - "lifecycle ends back at ACTIVE"
            - "exactly 2 STATUS_UPDATE jobs exist for the subscription (one per transition)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: relist_fee_exact_discount_threshold_boundary
        claim_type: constants_applied
        grounds: [calculations.relist_fee_calculation]
        distinguishing_aspect: "price_reduction_pct exactly 5.00 triggers the 0.25 discount (fee 15000); 4.80 does not (fee 20000) — the >= boundary on DISCOUNT_THRESHOLD_PCT."
        test_recipe:
          setup: ["Listing price 50000000 activated then WITHDRAWN at 2026-08-01T00:00:00Z; clock 2026-09-02T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
