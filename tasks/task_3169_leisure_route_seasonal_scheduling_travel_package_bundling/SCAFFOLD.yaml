    side_effects: []

  # --- SupplierOffer ---
  - method: POST
    path: "/supplier-offers"
    description: "Register a third-party offer (hotel, rental car, attraction)"
    roles: [FinanceAnalyst]
    code: 201
    input: [supplier_code, component_kind, destination_station_id, net_cost_cents, sell_price_cents]
    output: SupplierOffer
    side_effects: ["offer_status = OPEN"]

  - method: GET
    path: "/supplier-offers"
    description: "List offers"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["supplier_code?", "component_kind?", "destination_station_id?", "offer_status?", "limit?", "offset?"]
    output: "SupplierOffer[]"
    side_effects: []

  - method: GET
    path: "/supplier-offers/{offerId}"
    description: "Get one offer"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: SupplierOffer
    side_effects: []

  # --- Booking / PackageBundle / AncillaryPurchase ---
  - method: POST
    path: "/bookings"
    description: "Create an AIR_ONLY or PACKAGE booking against a SCHEDULED flight"
    roles: [CustomerService]
    code: 201
    input: [flight_instance_id, passenger_count, booking_kind, expected_flight_version, "hotel_offer_id?", "rental_car_offer_id?", "attraction_offer_id?"]
    output: Booking
    side_effects:
      - "base_fare_total_cents snapshot computed"
      - "FlightInstance.seats_sold += passenger_count; FlightInstance.version += 1"
      - "when booking_kind == PACKAGE: PackageBundle created with bundle_price_cents computed; booking.package_bundle_id set"

  - method: GET
    path: "/bookings"
    description: "List bookings"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["flight_instance_id?", "package_bundle_id?", "booking_status?", "booking_kind?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/bookings/{bookingId}"
    description: "Get one booking"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/bookings/{bookingId}/rebook"
    description: "Move a STRANDED booking onto a later SCHEDULED flight on the same route"
    roles: [CustomerService]
    code: 200
    input: [target_flight_instance_id, expected_booking_version]
    output: Booking
    side_effects:
      - "flight_instance_id re-pointed; stranded_until_date cleared"
      - "seats_sold recomputed on both flights"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{bookingId}/cancel"
    description: "Cancel a booking; cascades to ancillaries, bundle, and settlement clawback"
    roles: [CustomerService]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "AncillaryPurchases -> VOIDED; ancillary_total_cents recomputed"
      - "PackageBundle -> CANCELLED; covering PROVISIONAL SupplierSettlements get clawback_cents += net_cost_cents and status -> CLAWED_BACK"
      - "FlightInstance.seats_sold -= passenger_count"

  - method: GET
    path: "/bookings/{bookingId}/bundle"
    description: "Get the bundle for a PACKAGE booking (array of 0 or 1)"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: "PackageBundle[]"
    side_effects: []

  - method: GET
    path: "/package-bundles"
    description: "List package bundles across bookings"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["booking_id?", "hotel_offer_id?", "rental_car_offer_id?", "attraction_offer_id?", "bundle_status?", "limit?", "offset?"]
    output: "PackageBundle[]"
    side_effects: []

  - method: GET
    path: "/package-bundles/{bundleId}"
    description: "Get one bundle"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: PackageBundle
    side_effects: []

  - method: POST
    path: "/bookings/{bookingId}/ancillaries"
    description: "Sell an ancillary (seat / bag / priority) against a CONFIRMED booking"
    roles: [CustomerService]
    code: 201
    input: [ancillary_kind, amount_cents]
    output: AncillaryPurchase
    side_effects: ["purchase_status = ACTIVE", "Booking.ancillary_total_cents recomputed"]

  - method: GET
    path: "/bookings/{bookingId}/ancillaries"
    description: "List ancillaries for a booking"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["purchase_status?", "limit?", "offset?"]
    output: "AncillaryPurchase[]"
    side_effects: []

  - method: POST
    path: "/bookings/{bookingId}/ancillaries/{purchaseId}/void"
    description: "Void one ancillary"
    roles: [CustomerService]
    code: 200
    input: []
    output: AncillaryPurchase
    side_effects: ["purchase_status = VOIDED", "Booking.ancillary_total_cents recomputed"]

  - method: GET
    path: "/ancillary-purchases"
    description: "List ancillary purchases across bookings"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["booking_id?", "purchase_status?", "ancillary_kind?", "limit?", "offset?"]
    output: "AncillaryPurchase[]"
    side_effects: []

  - method: GET
    path: "/ancillary-purchases/{purchaseId}"
    description: "Get one ancillary purchase by id"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: AncillaryPurchase
    side_effects: []

  # --- DisruptionEvent ---
  - method: POST
    path: "/routes/{routeId}/disruptions"
    description: "Declare a disruption cancelling one flight; strands its passengers"
    roles: [OpsController]
    code: 201
    input: [flight_instance_id, reason_code]
    output: DisruptionEvent
    side_effects:
      - "FlightInstance -> CANCELLED with cancelled_by_disruption_id set"
      - "CONFIRMED Bookings on the flight -> STRANDED; stranded_until_date computed (next SCHEDULED flight on route by flight_date ASC, created_at ASC; null if none)"
      - "CrewAssignments on the flight -> RELEASED"

  - method: GET
    path: "/routes/{routeId}/disruptions"
    description: "List disruptions on a route"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["disruption_status?", "limit?", "offset?"]
    output: "DisruptionEvent[]"
    side_effects: []

  - method: GET
    path: "/disruptions"
    description: "List disruptions across routes"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["route_id?", "flight_instance_id?", "disruption_status?", "limit?", "offset?"]
    output: "DisruptionEvent[]"
    side_effects: []

  - method: GET
    path: "/disruptions/{disruptionId}"
    description: "Get one disruption"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: DisruptionEvent
    side_effects: []

  # --- SupplierSettlement ---
  - method: POST
    path: "/supplier-settlements"
    description: "Issue a provisional settlement for one supplier over a period"
    roles: [FinanceAnalyst]
    code: 201
    input: [supplier_code, period_start_date, period_end_date]
    output: SupplierSettlement
    side_effects:
      - "gross_payable_cents computed under PROVISIONAL variant (ACTIVE or CANCELLED bundles in window)"
      - "settlement_status = PROVISIONAL"

  - method: GET
    path: "/supplier-settlements"
    description: "List settlements"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: ["supplier_code?", "settlement_status?", "limit?", "offset?"]
    output: "SupplierSettlement[]"
    side_effects: []

  - method: GET
    path: "/supplier-settlements/{settlementId}"
    description: "Get one settlement"
    roles: [NetworkPlanner, OpsController, CustomerService, FinanceAnalyst, CrewScheduler]
    code: 200
    input: []
    output: SupplierSettlement
    side_effects: []

  - method: POST
    path: "/supplier-settlements/{settlementId}/finalize"
    description: "PROVISIONAL -> FINALIZED; recomputes gross under final variant (ACTIVE bundles only)"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: SupplierSettlement
    side_effects:
      - "gross_payable_cents recomputed under FINAL variant"
      - "counted PackageBundles -> SETTLED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not authorized for this endpoint" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "Station id does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Route id does not exist" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "SeasonWindow id does not exist" }
  - { id: ERR_PUBLICATION_NOT_FOUND, http: 404, condition: "SchedulePublication id does not exist" }
  - { id: ERR_FLIGHT_NOT_FOUND, http: 404, condition: "FlightInstance id does not exist" }
  - { id: ERR_AIRCRAFT_NOT_FOUND, http: 404, condition: "Aircraft id does not exist" }
  - { id: ERR_CREW_BASE_NOT_FOUND, http: 404, condition: "CrewBase id does not exist" }
  - { id: ERR_CREW_MEMBER_NOT_FOUND, http: 404, condition: "CrewMember id does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "SupplierOffer id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Booking id does not exist" }
  - { id: ERR_BUNDLE_NOT_FOUND, http: 404, condition: "PackageBundle id does not exist" }
  - { id: ERR_ANCILLARY_NOT_FOUND, http: 404, condition: "AncillaryPurchase id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "SupplierSettlement id does not exist" }
  - { id: ERR_DISRUPTION_NOT_FOUND, http: 404, condition: "DisruptionEvent id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "CrewAssignment id does not exist" }
  - { id: ERR_ROUTE_NOT_PLANNING, http: 409, condition: "Route activation requires PLANNING posture" }
  - { id: ERR_ROUTE_NOT_ACTIVE, http: 409, condition: "Operation requires SEASONAL_ACTIVE route" }
  - { id: ERR_ROUTE_NOT_SUSPENDED, http: 409, condition: "Reactivation requires SEASONALLY_SUSPENDED route" }
  - { id: ERR_NO_OPEN_SEASON, http: 409, condition: "Activation requires at least one OPEN SeasonWindow" }
  - { id: ERR_ROUTE_HAS_LIVE_FLIGHTS, http: 409, condition: "Close blocked: SCHEDULED flights remain" }
  - { id: ERR_ROUTE_HAS_LIVE_BOOKINGS, http: 409, condition: "Close blocked: non-cancelled bookings remain" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "Operation requires OPEN window" }
  - { id: ERR_WINDOW_NOT_SUSPENDED, http: 409, condition: "Operation requires SUSPENDED window" }
  - { id: ERR_PUBLICATIONS_STILL_LIVE, http: 409, condition: "Window close blocked: PUBLISHED publications remain" }
  - { id: ERR_PUBLICATION_NOT_PUBLISHED, http: 409, condition: "Retire requires PUBLISHED or FROZEN publication" }
  - { id: ERR_PUBLICATION_HAS_BOOKED_FLIGHTS, http: 409, condition: "Retire blocked: SCHEDULED flight with seats_sold > 0 exists" }
  - { id: ERR_FLIGHT_NOT_SCHEDULED, http: 409, condition: "Operation requires SCHEDULED flight" }
  - { id: ERR_BOOKING_NOT_STRANDED, http: 409, condition: "Rebook requires STRANDED booking" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "Cancel requires CONFIRMED, STRANDED, or STRANDED_REBOOKED booking" }
  - { id: ERR_SETTLEMENT_NOT_PROVISIONAL, http: 409, condition: "Finalize requires PROVISIONAL settlement" }
  - { id: ERR_ANCILLARY_NOT_ACTIVE, http: 409, condition: "Void requires ACTIVE ancillary" }
  - { id: ERR_ASSIGNMENT_NOT_ASSIGNED, http: 409, condition: "Release requires ASSIGNED crew assignment" }
  - { id: ERR_AIRCRAFT_HAS_LIVE_FLIGHTS, http: 409, condition: "Retire blocked: SCHEDULED flights reference this tail" }
  - { id: ERR_ROUTE_ENDPOINT_KIND_MISMATCH, http: 422, condition: "Origin must be ORIGIN_SMALL_CITY and destination must be LEISURE_DESTINATION" }
  - { id: ERR_PUBLISH_HORIZON_VIOLATION, http: 422, condition: "first_operating_date fewer than 180 days ahead of the logical clock" }
  - { id: ERR_PUBLICATION_OUTSIDE_WINDOW, http: 422, condition: "Publication dates lie outside their SeasonWindow" }
  - { id: ERR_FREQUENCY_CAP_EXCEEDED, http: 409, condition: "Weekly departures would exceed Route.weekly_frequency_cap" }
  - { id: ERR_UTILIZATION_CAP_EXCEEDED, http: 409, condition: "Daily block minutes would exceed the applicable (peak or non-peak) cap" }
  - { id: ERR_CREW_BASE_MISMATCH, http: 422, condition: "Crew member's base station differs from the route origin station" }
  - { id: ERR_CREW_MEMBER_INACTIVE, http: 422, condition: "Crew member or base not ACTIVE" }
  - { id: ERR_OFFER_WRONG_KIND, http: 422, condition: "SupplierOffer component_kind does not match the bundle slot" }
  - { id: ERR_OFFER_WRONG_DESTINATION, http: 422, condition: "SupplierOffer destination station differs from the route destination" }
  - { id: ERR_OFFER_NOT_OPEN, http: 422, condition: "SupplierOffer not OPEN" }
  - { id: ERR_REBOOK_FLIGHT_INVALID, http: 409, condition: "Rebook target not SCHEDULED on the same route" }
  - { id: ERR_REBOOK_NO_AIRCRAFT, http: 409, condition: "Rebook target has no aircraft assigned" }
  - { id: ERR_REBOOK_CAPACITY_EXCEEDED, http: 409, condition: "Rebook would exceed aircraft seat_capacity" }
  - { id: ERR_SETTLEMENT_PERIOD_OPEN, http: 422, condition: "Finalize before period_end_date has passed" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkPlanner
    description: "Owns route selection, season windows, and schedule publication"
    identity: opaque
    exclusive_operations:
      - "POST /stations"
      - "POST /routes"
      - "POST /routes/{id}/activate | suspend | reactivate | close"
      - "POST /routes/{id}/season-windows (create | suspend | close)"
      - "POST /routes/{id}/publications (create | retire)"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: OpsController
    description: "Owns aircraft, flight-instance operations, and disruptions"
    identity: opaque
    exclusive_operations:
      - "POST /aircraft (create | retire)"
      - "POST /flight-instances/{id}/assign-aircraft"
      - "POST /flight-instances/{id}/mark-operated"
      - "POST /routes/{id}/disruptions"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: CrewScheduler
    description: "Owns crew bases, members, and assignments"
    identity: opaque
    exclusive_operations:
      - "POST /crew-bases"
      - "POST /crew-bases/{id}/members"
      - "POST /flight-instances/{id}/crew-assignments"
      - "DELETE /flight-instances/{id}/crew-assignments/{assignmentId}"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: CustomerService
    description: "Owns bookings, rebooking, cancellation, and ancillaries"
    identity: opaque
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/rebook"
      - "POST /bookings/{id}/cancel"
      - "POST /bookings/{id}/ancillaries (create | void)"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: FinanceAnalyst
    description: "Owns supplier offers and settlements"
    identity: opaque
    exclusive_operations:
      - "POST /supplier-offers"
      - "POST /supplier-settlements (create | finalize)"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
