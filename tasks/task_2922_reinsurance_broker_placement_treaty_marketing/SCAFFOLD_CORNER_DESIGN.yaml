              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /cedents"
              payload: { name: "Paging Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Alpha Re", security_rating: "AA", capacity_limit_minor: 5000000000, max_line_pct: 100.0000, lead_authorised: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { alpha: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Bravo Re", security_rating: "A", capacity_limit_minor: 5000000000, max_line_pct: 100.0000, lead_authorised: false }
              as: PlatformAdmin
