      assert:
      - Facility.${fac}.posture == EVENT_SURGE (link 1)
      - AccessDevice.${d1}.device_mode == EVENT and AccessDevice.${d2}.device_mode == EVENT (link 2)
      - 'ParkingSession.${sess}.fee_mode == EVENT_FLAT and quote fee_cents == 1500 (would be 800 under STANDARD: 2h at 500+300)'
  - name: event_completion_reverses_posture_and_device_mode
    grounds:
    - state_machines.EventBooking.ACTIVE_to_COMPLETED
    - state_machines.Facility.EVENT_SURGE_to_NORMAL
