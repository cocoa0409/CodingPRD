  - rule_id: boundary_precision_check
    instances:
      - name: occupancy_ratio_exactly_1500_is_green
        grounds:
          - calculations.occupancy_cost_ratio
          - entities.SalesForecast.fields.occupancy_ratio_bp
          - entities.SalesForecast.fields.occupancy_band
        distinguishing_aspect: |
          Ratio metric boundary on the submit-committee endpoint: annual
          occupancy 150000000 cents over net 1000000000 yields ratio_bp exactly
          1500; the GREEN band is inclusive (<= 1500), so submission succeeds
          WITHOUT chair_override — one bp higher (1501) would be YELLOW.
        test_recipe:
          setup:
            - "QUALIFIED market; ANALOG stores 900000000 and 1100000000 STANDARD -> net 1000000000 (no drive-time entries -> cannibalization 0)"
            - "Site STANDARD 10000 sqft, asking 15000, cam 0, tax 0 -> annual occupancy exactly 150000000"
            - "Committee: sponsor + chair (E=1, quorum 1)"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro B1500", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
