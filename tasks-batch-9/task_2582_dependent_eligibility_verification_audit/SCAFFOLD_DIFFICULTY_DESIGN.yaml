              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
          assert:
            - "checkpoint A (before trigger step 1): AuditProgram.${prog_id}.in_scope_dependent_count == 3 and pending_dependent_count == 1 and verified_dependent_count == 1 and amnesty_removed_count == 1 and termination_pending_count == 0 and terminated_dependent_count == 0"
            - "checkpoint B (after trigger step 2): AuditProgram.${prog_id}.in_scope_dependent_count == 3 and pending_dependent_count == 0 and verified_dependent_count == 1 and amnesty_removed_count == 1 and termination_pending_count == 1 and terminated_dependent_count == 0"
            - "checkpoint C (after trigger step 4): AuditProgram.${prog_id}.in_scope_dependent_count == 3 and pending_dependent_count == 0 and verified_dependent_count == 1 and amnesty_removed_count == 1 and termination_pending_count == 0 and terminated_dependent_count == 1"
            - "at each of checkpoints A, B and C: in_scope_dependent_count == pending_dependent_count + verified_dependent_count + amnesty_removed_count + termination_pending_count + terminated_dependent_count"
            - "after trigger step 2: AuditCase.${case1_id}.status == ESCALATED and AuditCase.${case1_id}.unverified_dependent_count == 1 and Dependent.${dep3_id}.coverage_status == TERMINATION_PENDING"
            - "after trigger step 4: Dependent.${dep3_id}.coverage_status == TERMINATED and Dependent.${dep3_id}.coverage_end_date == 2026-10-31"
            - "after trigger step 4: AuditCase.${case1_id}.status == ESCALATED (the 30-day appeal window on the 2026-10-17 notice runs to 2026-11-16, so S4 cannot close the case yet)"
            - "after trigger step 4: AuditProgram.${prog_id}.audited_annual_savings_cents == 152500"
            - "after trigger step 4: AuditProgram.${prog_id}.provisional_annual_savings_cents == 732000"

      - name: recovery_cash_conserved_across_demand_payments_and_appeal_void
        grounds:
          - entities.AuditProgram.fields.recovered_total_cents
          - entities.AuditProgram.fields.refund_due_total_cents
          - entities.AuditProgram.fields.recovery_ledger_cents
          - state_machines.ClaimRecovery.PARTIALLY_RECOVERED_to_VOIDED
          - endpoints[POST /claim-recoveries/{id}/payments]
        distinguishing_aspect: |
          Conserved quantity #2 is COLLECTED CASH, a different type of quantity from the headcount partition:
          recovered_total_cents + refund_due_total_cents == 100000 before and after the compensating void, so
          every cent the employer collected is either still booked as recovered or booked as owed back - never
          both and never neither - while recovery_ledger_cents drops 514500 -> 0 because the voided demand is no
          longer collectible.
