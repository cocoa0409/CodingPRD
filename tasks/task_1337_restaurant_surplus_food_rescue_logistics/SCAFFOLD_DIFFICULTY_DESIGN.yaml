  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: agency_commitment_roundtrip_invariant
        grounds:
          - calculations.agency_capacity_commitment
          - state_machines.RescueRun
        distinguishing_aspect: |
          Conserved quantity: agency committed lbs. Invariant:
          committed_cold_held_lbs == sum of estimated_weight_snapshot over
          runs in {PROPOSED, CONFIRMED, PICKED_UP}. The forward actions
          dispatch (45) and accept leave it at 45; the compensating fail
