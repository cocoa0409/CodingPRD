            - "ServiceNight.${n1_id}.verification_status == 'VERIFIED', NOT 'PARTIAL' — the comparison is inclusive"
            - "ServiceNight.${n1_id}.billing_status == 'ACCRUED' — a VERIFIED night contributes 0.0 to a later statement's missed_equivalent_nights"

      - name: night_with_zero_expected_doors_closes_missed_not_vacuously_verified
        grounds:
          - calculations.service_night_verification
          - state_machines.ServiceNight.SCHEDULED_to_MISSED
          - entities.ServiceNight.fields.expected_door_count
          - entities.ServiceNight.fields.coverage_bps
          - calculations.statement_settlement.constants.PARTIAL_NIGHT_WEIGHT
        distinguishing_aspect: |
          Empty-input-set boundary rather than an at-threshold boundary: expected_door_count is 0,
          so the coverage ratio is 0/0 and a naive implementation either divides by zero or treats
          the vacuous "all doors covered" as VERIFIED with coverage_bps 10000. The rule's ordered
          steps check the empty scan set FIRST, forcing coverage_bps 0, verification_status MISSED
          and a 1.0 contribution to any statement's missed_equivalent_nights.
