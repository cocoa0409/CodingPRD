            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-NP", classification: "NON_PERMIT", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
          trigger:
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "NP job", planned_start_at: "2026-08-03T06:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SPACE_NOT_PERMIT_REQUIRED (422)"
            - "GET /rescue-ops/entry-permits?space_id=${sp} returns 0 items"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: corner_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Default pagination is limit 10 / offset 0: 11 personnel records yield total_count 11, has_more true, and 10 items on page 1; offset 10 yields the last item with has_more false."
        test_recipe:
          setup: ["Eleven Personnel records created"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W01", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W02", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W03", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W04", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W05", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W06", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W07", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W08", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W09", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W10", role_qualifications: [] }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "W11", role_qualifications: [] }, as: OperationsManager }
          trigger:
            - { call: "GET /rescue-ops/personnel", as: OperationsManager }
            - { call: "GET /rescue-ops/personnel?limit=10&offset=10", as: OperationsManager }
          assert:
            - "Page 1: response_type == 'array', 10 items, total_count == 11, has_more == true, limit == 10, offset == 0 (defaults applied)"
            - "Page 2 (offset 10): exactly 1 item, has_more == false, total_count == 11"

      - name: corner_success_envelope_shape
        claim_type: creation
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries the fixed envelope: meta.api_request_id (non-empty), meta.api_request_timestamp (ISO8601), response_type ('object' for single-resource, 'array' for lists), and data."
        test_recipe:
          setup: ["One Personnel record created"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
          trigger:
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Env One", role_qualifications: [] }, as: OperationsManager, captures: { p_id: "$.data.id" } }
            - { call: "GET /rescue-ops/personnel", as: OperationsManager }
          assert:
            - "POST response: response_type == 'object'; meta.api_request_id present; meta.api_request_timestamp present; data.id == ${p_id}"
            - "GET list response: response_type == 'array'; pagination fields limit/offset/total_count/has_more all present"
            - "Error responses (e.g., corner_not_found_sweep) carry data.error_id and data.message — verified there"

      - name: corner_fk_reverse_reachability_lists
        claim_type: retrieval
        grounds: ["endpoints[GET /rescue-ops/atmospheric-readings]", "endpoints[GET /rescue-ops/statements/{id}/lines]", entities.EntryPermit.fields.space_id]
        distinguishing_aspect: "Every child collection is reachable from its parent key: readings by permit_id, permits by space_id, statement lines by statement id — all returning arrays."
        test_recipe:
          setup: ["ISSUED permit with one PRE_ENTRY reading; account with one generated OPEN statement (empty)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Reverse Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-RV", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Reverse job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}", captures: { rd: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/statements/generate", payload: { period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }, as: BillingClerk, captures: { stmt: "$.data.id" } }
          trigger:
            - { call: "GET /rescue-ops/atmospheric-readings?permit_id=${per}", as: OperationsManager }
            - { call: "GET /rescue-ops/entry-permits?space_id=${sp}", as: OperationsManager }
            - { call: "GET /rescue-ops/entry-permits?client_account_id=${acct}", as: OperationsManager }
            - { call: "GET /rescue-ops/statements/${stmt}/lines", as: OperationsManager }
          assert:
            - "GET /atmospheric-readings?permit_id=${per} returns exactly [${rd}]"
            - "GET /entry-permits?space_id=${sp} returns exactly [${per}]"
            - "GET /entry-permits?client_account_id=${acct} returns exactly [${per}] (denormalized FK reverse)"
            - "GET /statements/${stmt}/lines returns an empty array (statement OPEN with no lines) with response_type 'array'"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rescue-ops/personnel", as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER when the test omits both headers"
            - "http status == 400 (not 403: malformed context precedes authorization)"

      - name: corner_attendant_cannot_create_client_account
        claim_type: violation_to_error
        grounds: [roles.Attendant, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Attendant (entity-backed role with a valid ATTENDANT-qualified Personnel id) calling POST /client-accounts fails with ERR_FORBIDDEN — endpoint roles list contains only OperationsManager."
        test_recipe:
          setup: ["One ATTENDANT-qualified personnel record"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Forbidden Co", billing_mode: "EVENT", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: Attendant, as_user_id: "${att_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"
            - "No ClientAccount is created"

      - name: corner_identity_qualification_enforced
        claim_type: violation_to_error
        grounds: [roles.EntrySupervisor, "validations[priority=3]", "errors[ERR_IDENTITY_NOT_QUALIFIED]"]
        distinguishing_aspect: "An entity-backed role call whose X-User-ID resolves to a Personnel lacking the role's qualification fails with ERR_IDENTITY_NOT_QUALIFIED (403): an ATTENDANT-only worker cannot act as EntrySupervisor even though the role header is well-formed."
        test_recipe:
          setup: ["Account + space; personnel p1 holds only ATTENDANT qualification"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att Only", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { p1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Identity Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-IQ", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
          trigger:
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Identity job", planned_start_at: "2026-08-03T06:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${p1_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_IDENTITY_NOT_QUALIFIED (403) — priority 3, before existence/shape checks"
            - "No EntryPermit is created"

      - name: corner_sod_verifier_equals_issuer
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: a dual-qualified person (ENTRY_SUPERVISOR + SAFETY_OFFICER) who ISSUED the permit cannot verify its isolation — the verify call fails with ERR_SEGREGATION_OF_DUTIES even though the role itself is permitted."
        test_recipe:
          setup: ["ISSUED permit issued_by dual-qualified personnel d1; PENDING verification created by SafetyOfficer so1"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Dual One", role_qualifications: ["ENTRY_SUPERVISOR", "SAFETY_OFFICER"] }, as: OperationsManager, captures: { dual_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Safe One", role_qualifications: ["SAFETY_OFFICER"] }, as: OperationsManager, captures: { so_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "SoD Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-SOD", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: true, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "SoD job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${dual_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${dual_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/isolation-verifications", payload: { isolation_type: "VENTILATION", evidence_ref: "vent-sod" }, as: SafetyOfficer, as_user_id: "${so_id}", captures: { iso: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/isolation-verifications/${iso}/verify", payload: {}, as: SafetyOfficer, as_user_id: "${dual_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /rescue-ops/isolation-verifications/${iso}/verify", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}", captures: { iso_status: "$.data.status" } }
          assert:
            - "Verify by ${dual_id} (the permit's issuer) fails with ERR_SEGREGATION_OF_DUTIES (403)"
            - "Verify by ${so_id} (different person) succeeds: IsolationVerification.${iso}.status == VERIFIED"

      - name: corner_sod_resolver_equals_reporter
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.Incident.TRIAGED_to_RESOLVED]
        distinguishing_aspect: "Incident segregation: the SafetyOfficer who REPORTED the incident cannot RESOLVE it; a second SafetyOfficer can."
        test_recipe:
          setup: ["Permit manually SUSPENDED; incident REPORTED by so1 and TRIAGED"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Safe One", role_qualifications: ["SAFETY_OFFICER"] }, as: OperationsManager, captures: { so1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Safe Two", role_qualifications: ["SAFETY_OFFICER"] }, as: OperationsManager, captures: { so2_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "SoD2 Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-SD2", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
