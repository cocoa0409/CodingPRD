            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t1_id}", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 8 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_id: $.data.id }
            - call: "POST /wind-ops/work-orders/${wo_id}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", weather_window_id: "${ww_id}", planned_start_utc: "2026-08-10T06:00:00Z", planned_end_utc: "2026-08-10T14:00:00Z" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "GET /wind-ops/spare-parts/${sp_id}"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_id}", component_type: "GEARBOX", estimated_lift_hours: 12, uptower_labor_hours: 0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { r1_id: $.data.id }
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_id}", component_type: "BLADE", estimated_lift_hours: 4, uptower_labor_hours: 0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_type: $.data.error_id }
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_id}", component_type: "GEARBOX", estimated_lift_hours: 6, uptower_labor_hours: 0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { r2_id: $.data.id }
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_id}", component_type: "GEARBOX", estimated_lift_hours: 3, uptower_labor_hours: 0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_unavailable: $.data.error_id }
            - call: "POST /wind-ops/component-replacements/${r2_id}/cancel"
              payload: { cancellation_reason: "second gearbox deferred to next campaign" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/component-replacements/${r1_id}/plan-uptower"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_uptower: $.data.error_id }
            - call: "POST /wind-ops/component-replacements/${r1_id}/reserve-crane"
              payload: { crane_mobilization_id: "${crane_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/component-replacements/${r1_id}/execute"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /wind-ops/spare-parts/${sp_id}/receipts"
              payload: { quantity_received: 3 }
              as: SiteAdmin
              as_user_id: "admin-1"
          assert:
            - "at baseline SparePart.${sp_id} reads quantity_on_hand 2, quantity_reserved 0, quantity_consumed 0, total_units_accounted 2, status IN_STOCK and procurement_flag false"
            - "after creating ${r1_id} the line reads 1 / 1 / 0 with total_units_accounted still 2, status BELOW_REORDER_POINT and procurement_flag true, since 0 < 1 < reorder_point 2"
            - "the BLADE replacement returns ${err_type} == ERR_SPARE_PART_TYPE_MISMATCH and the line is untouched at 1 / 1 / 0 with total 2"
            - "after creating ${r2_id} the line reads 0 / 2 / 0 with total_units_accounted still 2, status OUT_OF_STOCK and procurement_flag true, so a line with nothing on hand still accounts for two units"
            - "the third GEARBOX replacement returns ${err_unavailable} == ERR_SPARE_PART_UNAVAILABLE and the line is untouched at 0 / 2 / 0 with total 2, so a refused draw reserves nothing"
            - "after cancelling ${r2_id} the line reads 1 / 1 / 0 with total 2 and status back to BELOW_REORDER_POINT; the unit returned to quantity_on_hand and NOT to quantity_consumed"
            - "ComponentReplacement.${r2_id}.state == CANCELLED with execution_path null and allocated_crane_cost_cents 0, and CraneMobilization.${crane_id}.state is still REQUESTED because ${r2_id} never held it"
            - "WorkOrder.${wo_id}.state is still IN_PROGRESS after the cancellation, because cascade hop 4 only rewinds a parent that is SCHEDULED"
            - "plan-uptower on ${r1_id} returns ${err_uptower} == ERR_UPTOWER_NOT_PERMITTED, leaves the state PLANNED and the line at 1 / 1 / 0 with total 2"
            - "after reserve-crane the line is STILL 1 / 1 / 0 with total 2, because reserving a crane moves money and not units"
            - "CraneMobilization.${crane_id} reads state MOBILIZED, reserved_replacement_count 1, lift_days 2, standby_days 0, billable_days 2, subtotal_cents 19600000, volume_credit_cents 1176000 and total_crane_cost_cents 18424000, and ComponentReplacement.${r1_id}.allocated_crane_cost_cents == 18424000"
            - "after execute the line reads 1 / 0 / 1 with total_units_accounted still 2, and status is BELOW_REORDER_POINT because status keys on quantity_on_hand alone and ignores the consumed unit"
            - "after execute WindFarm.${farm_id}.maintenance_spend_cents == 18424000 and opex_accrued_cents == 18424000, with landowner_payable_cents, road_maintenance_reserve_cents and community_fund_balance_cents all still 0"
            - "after the receipt of 3 the line reads 4 / 0 / 1 with total_units_accounted 5, status IN_STOCK and procurement_flag false; the receipt is the ONLY step in the whole sequence that changed the conserved total"
            - "at every one of the nine checkpoints above quantity_on_hand + quantity_reserved + quantity_consumed == total_units_accounted holds exactly, with no step leaving a unit in two places or in none"
      - name: farm_opex_ledger_reconciles_to_the_cent_after_a_settlement_is_approved_then_voided
        grounds:
          - entities.WindFarm.fields.opex_accrued_cents
          - entities.WindFarm.fields.landowner_payable_cents
          - entities.WindFarm.fields.road_maintenance_reserve_cents
          - entities.WindFarm.fields.community_fund_balance_cents
          - entities.WindFarm.fields.maintenance_spend_cents
          - endpoints.POST_/wind-ops/landowner-settlements/{id}/approve
          - endpoints.POST_/wind-ops/landowner-settlements/{id}/void
          - state_machines.LandownerSettlement.APPROVED_to_VOID
          - calculations.landowner_royalty_settlement
        distinguishing_aspect: |
          opex_accrued_cents == landowner_payable_cents + road_maintenance_reserve_cents +
          community_fund_balance_cents + maintenance_spend_cents must hold at six checkpoints
          across two independent posting sources. A completed work order books labour into
          maintenance_spend only; a DRAFT settlement books NOTHING even though every amount on it
          is already computed; approval books three different amounts into three different
          buckets, with road_damage_assessment_cents joining the road levy in the reserve but
          never entering landowner_payable_cents; and the void must reverse exactly those three
          amounts, returning opex to the labour figure to the cent while leaving the settlement's
          own computed amounts intact for audit and leaving maintenance_spend untouched. Re-doing
          the cycle on a second settlement for the same parcel and period must land on the same
          total, proving the reversal left no residue that the second approval could double.
        test_recipe:
          setup:
            - "one farm with road_levy_pct 2.5 and community_levy_pct 1.5, and one ONLINE turbine metering 1041750 kWh in the period 2026-07-01 to 2026-08-01"
            - "the metered figure is chosen so royalty_cents lands on 250020, whose 2.5 pct road levy is exactly 6250.5 cents and therefore a genuine round_half_up boundary"
            - "one MAJOR_COMPONENT work order driven to IN_PROGRESS with a crew charging 90000 cents per hour, submitted by planner-1 so a different actor may complete it"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Whitetail Draw", region_code: "WY-S", grid_operator_code: "PACW", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 100000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 0, last_service_operating_hours: 0 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/turbines/${t1_id}/scada-sync"
              payload: { operating_hours_delta: 720, actual_energy_kwh: 1041750, potential_energy_kwh: 1440000 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/crews"
              payload: { wind_farm_id: "${farm_id}", crew_code: "C-CHARLIE", technician_count: 4, certifications: ["GWO_BASIC", "CRANE_BANKSMAN"], max_work_wind_speed_ms: 14.0, daily_hours_capacity: 40, hourly_rate_cents: 90000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /wind-ops/weather-windows"
              payload: { wind_farm_id: "${farm_id}", start_utc: "2026-08-10T00:00:00Z", end_utc: "2026-08-11T00:00:00Z", forecast_wind_speed_ms: 8.0, forecast_gust_ms: 11.0, icing_risk: false }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { ww_id: $.data.id }
            - call: "POST /wind-ops/weather-windows/${ww_id}/confirm"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t1_id}", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 8 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_id: $.data.id }
            - call: "POST /wind-ops/work-orders/${wo_id}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", weather_window_id: "${ww_id}", planned_start_utc: "2026-08-10T06:00:00Z", planned_end_utc: "2026-08-10T14:00:00Z" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /wind-ops/work-orders/${wo_id}/complete"
              payload: { actual_hours: 7.5 }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { farm_v1: $.data.version }
            - call: "POST /wind-ops/farms/${farm_id}/landowner-settlements"
              payload: { parcel_code: "P-14", royalty_basis: "METERED_ONLY", period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z", royalty_pct: 4.0, minimum_payment_cents: 200000, energy_price_cents_per_kwh: 6, road_damage_assessment_cents: 15000, expected_wind_farm_version: "${farm_v1}" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { ls1_id: $.data.id }
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { farm_v2: $.data.version }
            - call: "POST /wind-ops/landowner-settlements/${ls1_id}/approve"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
            - call: "POST /wind-ops/landowner-settlements/${ls1_id}/void"
              payload: { void_reason: "parcel boundary re-survey moved two turbines off P-14" }
              as: CommercialManager
              as_user_id: "comm-1"
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { farm_v3: $.data.version }
            - call: "POST /wind-ops/farms/${farm_id}/landowner-settlements"
              payload: { parcel_code: "P-14", royalty_basis: "METERED_ONLY", period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z", royalty_pct: 4.0, minimum_payment_cents: 200000, energy_price_cents_per_kwh: 6, road_damage_assessment_cents: 15000, expected_wind_farm_version: "${farm_v3}" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { ls2_id: $.data.id }
            - call: "POST /wind-ops/landowner-settlements/${ls2_id}/approve"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
          assert:
            - "checkpoint 1, after complete: WorkOrder.${wo_id}.labor_cost_cents == 675000 from round_half_up(7.5 * 90000), WindFarm.${farm_id}.maintenance_spend_cents == 675000, opex_accrued_cents == 675000 and the three settlement buckets are all 0"
            - "checkpoint 2, after the DRAFT create: LandownerSettlement.${ls1_id}.state == DRAFT with metered_kwh 1041750, deemed_kwh 0, royalty_cents 250020, payment_cents 250020, road_levy_cents 6251 and community_levy_cents 3750"
            - "road_levy_cents 6251 is round_half_up(6250.5) and community_levy_cents 3750 is round_half_up(3750.3), so the two levies round in opposite directions off the same payment"
            - "checkpoint 2 ledger: WindFarm.${farm_id}.opex_accrued_cents is STILL 675000 and landowner_payable_cents is still 0, because a DRAFT settlement posts nothing"
            - "checkpoint 3, after approve: landowner_payable_cents == 250020, road_maintenance_reserve_cents == 21251 (6251 levy plus the 15000 road damage assessment), community_fund_balance_cents == 3750 and opex_accrued_cents == 950021"
            - "950021 == 250020 + 21251 + 3750 + 675000, so the invariant holds exactly at the approved checkpoint and road_damage_assessment_cents never entered landowner_payable_cents"
            - "checkpoint 4, after void: LandownerSettlement.${ls1_id}.state == VOID with the stored void_reason, landowner_payable_cents == 0, road_maintenance_reserve_cents == 0, community_fund_balance_cents == 0 and opex_accrued_cents == 675000, exactly the pre-settlement figure"
            - "the voided settlement still reads payment_cents 250020, road_levy_cents 6251 and community_levy_cents 3750 for audit, so the reversal touched the farm ledger and not the settlement's own arithmetic"
            - "maintenance_spend_cents is 675000 at every one of the six checkpoints, so no settlement operation ever moved the maintenance bucket"
            - "checkpoint 5, after the second create: LandownerSettlement.${ls2_id}.state == DRAFT with payment_cents 250020 recomputed from the same unchanged telemetry, and opex_accrued_cents still 675000"
            - "checkpoint 6, after the second approve: opex_accrued_cents == 950021 again with landowner_payable_cents 250020, proving the void left no residue that this approval could double-count"
            - "WindFarm.${farm_id}.version advanced by exactly 1 per settlement CREATE (from ${farm_v1} to ${farm_v2} across the first create), which is why the second create had to re-read it as ${farm_v3}"
