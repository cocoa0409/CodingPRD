    path: "/employee-health/exposure-contacts/{id}/report-symptom"
    description: "Report symptom onset for a MONITORING contact; StaffEmployee may report only their own contact row"
    roles: [StaffEmployee, EmployeeHealthNurse]
    code: 200
    input: [symptom_onset_date]
    output: ExposureContact
    side_effects: ["symptom_onset_reported = true"]
  - method: POST
    path: "/employee-health/exposure-contacts/{id}/transition"
    description: "CONVERTED_TO_CASE (nurse; requires symptoms reported; escalates event, auto FULL_EXCLUSION restriction) | LOST_TO_FOLLOWUP (safety officer)"
    roles: [EmployeeHealthNurse, SafetyOfficer]
    code: 200
    input: [to_state]
    output: ExposureContact
    side_effects: ["conversion: event MONITORING -> ESCALATED; auto WorkRestriction FULL_EXCLUSION origin CONTACT_CONVERSION"]

  # --- Injury reports / workers' compensation ---
  - method: POST
    path: "/employee-health/employees/{id}/injury-reports"
    description: "File an injury report; optional exposure-case linkage"
    roles: [SafetyOfficer]
    code: 201
    input: [injury_type, injury_datetime, "exposure_case_id?"]
    output: InjuryReport
    side_effects: ["osha_recordable computed per osha_recordable_determination", "origin=MANUAL"]
  - method: GET
    path: "/employee-health/injury-reports"
    description: "List injury reports (filterable by employee_id, exposure_case_id, status)"
    roles: [EmployeeHealthNurse, EmployeeHealthPhysician, ComplianceOfficer, SafetyOfficer, StaffEmployee]
    code: 200
    input: ["employee_id?", "exposure_case_id?", "status?", "limit?", "offset?"]
    output: "InjuryReport[]"
    side_effects: []
  - method: GET
    path: "/employee-health/injury-reports/{id}"
    description: "Read one injury report"
    roles: [EmployeeHealthNurse, EmployeeHealthPhysician, ComplianceOfficer, SafetyOfficer, StaffEmployee]
    code: 200
    input: []
    output: InjuryReport
    side_effects: []
  - method: POST
    path: "/employee-health/injury-reports/{id}/transition"
    description: "Workers' comp lifecycle: WC_SUBMITTED | WC_ACCEPTED | WC_DENIED | APPEALED (WC_DENIED <-> APPEALED loop allowed)"
    roles: [SafetyOfficer]
    code: 200
    input: [to_state]
    output: InjuryReport
    side_effects: ["WC_SUBMITTED assigns wc_claim_number"]

  # --- Vaccination campaigns ---
  - method: POST
    path: "/employee-health/vaccination-campaigns"
    description: "Create a campaign; CLOSED-interval window; same-vaccine_type windows may not overlap or touch (ERR_CAMPAIGN_WINDOW_OVERLAP)"
    roles: [ComplianceOfficer]
    code: 201
    input: [vaccine_type, window_start, window_end, department_scope]
    output: VaccinationCampaign
    side_effects: []
  - method: GET
    path: "/employee-health/vaccination-campaigns"
    description: "List campaigns (filterable by vaccine_type, status)"
    roles: [EmployeeHealthNurse, EmployeeHealthPhysician, ComplianceOfficer, SafetyOfficer, StaffEmployee]
    code: 200
    input: ["vaccine_type?", "status?", "limit?", "offset?"]
    output: "VaccinationCampaign[]"
    side_effects: []
  - method: GET
    path: "/employee-health/vaccination-campaigns/{id}"
    description: "Read one campaign"
    roles: [EmployeeHealthNurse, EmployeeHealthPhysician, ComplianceOfficer, SafetyOfficer, StaffEmployee]
    code: 200
    input: []
    output: VaccinationCampaign
    side_effects: []
  - method: POST
    path: "/employee-health/vaccination-campaigns/{id}/transition"
    description: "OPEN (creates PENDING participations for in-scope ACTIVE employees, ordered by created_at ASC then employee_ref ASC) | CLOSED (requires now > window_end; CASCADE A: delinquency -> hold -> suspension)"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_state]
    output: VaccinationCampaign
    side_effects: ["per VaccinationCampaign state machine incl. CASCADE A"]
  - method: GET
    path: "/employee-health/vaccination-campaigns/{id}/coverage"
    description: "Computed campaign coverage per campaign_coverage_rate (per-department rounding, then mean)"
    roles: [EmployeeHealthNurse, EmployeeHealthPhysician, ComplianceOfficer, SafetyOfficer]
    code: 200
    input: []
    output: "{ administered_count: integer, declined_count: integer, exempted_count: integer, delinquent_count: integer, pending_count: integer, coverage_rate: number }"
    side_effects: []
  - method: GET
    path: "/employee-health/campaign-participations"
    description: "List participations (filterable by campaign_id, employee_id, status); StaffEmployee sees only own rows"
    roles: [EmployeeHealthNurse, EmployeeHealthPhysician, ComplianceOfficer, SafetyOfficer, StaffEmployee]
    code: 200
    input: ["campaign_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: "CampaignParticipation[]"
    side_effects: []
  - method: GET
    path: "/employee-health/campaign-participations/{id}"
    description: "Read one participation"
    roles: [EmployeeHealthNurse, EmployeeHealthPhysician, ComplianceOfficer, SafetyOfficer, StaffEmployee]
    code: 200
    input: []
    output: CampaignParticipation
    side_effects: []
  - method: POST
    path: "/employee-health/campaign-participations/{id}/transition"
    description: "ADMINISTERED (nurse; administered_at inside CLOSED campaign window, inclusive) | DECLINED (the StaffEmployee themself; reason required) | EXEMPTED (physician; exemption_type MEDICAL|RELIGIOUS)"
    roles: [EmployeeHealthNurse, StaffEmployee, EmployeeHealthPhysician]
    code: 200
    input: [to_state, "administered_at?", "declination_reason?", "exemption_type?"]
    output: CampaignParticipation
    side_effects: ["per CampaignParticipation state machine"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_REQUIRED, http: 403, condition: "StaffEmployee acting on a record whose employee_id != X-User-ID (PEP DECLINED, participation DECLINED, report-symptom, or any read of another employee's record)" }
  - { id: ERR_SOD_SOURCE_CONSENT, http: 403, condition: "Source-consent recorder equals the intake recorded_by_user_id of the same ExposureCase (segregation of duties)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path id does not resolve, validated left-to-right" }
  - { id: ERR_STALE_EMPLOYEE_VERSION, http: 412, condition: "expected_employee_version != current Employee.version on screening create (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition/action (incl. repeat component completion, repeat requirement completion)" }
  - { id: ERR_CYCLE_ALREADY_OPEN, http: 409, condition: "Employee already has an AnnualRequirementCycle in OPEN or OVERDUE" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "Release attempted on a hold not in ACTIVE" }
  - { id: ERR_UNDERLYING_REQUIREMENT_UNMET, http: 409, condition: "Hold release blocked: linked cycle not SATISFIED or linked participation not in {ADMINISTERED, DECLINED, EXEMPTED}" }
  - { id: ERR_CASE_CLOSE_BLOCKED, http: 409, condition: "Case close blocked: non-terminal serology follow-ups, unresolved PEP, or ACTIVE linked restriction" }
  - { id: ERR_SOURCE_TESTING_UNRESOLVED, http: 409, condition: "Case EVALUATION -> MANAGEMENT while source_test_status is CONSENT_PENDING or CONSENT_GRANTED" }
  - { id: ERR_EVENT_CLOSE_BLOCKED, http: 409, condition: "Event close blocked: contacts still MONITORING" }
  - { id: ERR_PEP_WINDOW_EXPIRED, http: 422, condition: "PEP STARTED attempted when now > window_deadline (72h inclusive boundary passed)" }
  - { id: ERR_PEP_COURSE_INCOMPLETE, http: 422, condition: "PEP COMPLETED attempted before started_at + 28 days" }
  - { id: ERR_FOLLOWUP_NOT_DUE, http: 409, condition: "Serology result/waive attempted while status is SCHEDULED (or terminal)" }
  - { id: ERR_RESTRICTION_NOT_ACTIVE, http: 409, condition: "Clearance request/decision on a restriction not ACTIVE" }
  - { id: ERR_NO_SYMPTOMS_REPORTED, http: 409, condition: "Contact conversion attempted with symptom_onset_reported == false" }
  - { id: ERR_CAMPAIGN_WINDOW_NOT_ENDED, http: 409, condition: "Campaign close attempted while now <= window_end" }
  - { id: ERR_PARTICIPATION_NOT_PENDING, http: 409, condition: "Participation transition attempted from a non-PENDING status" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 422, condition: "Vaccination administer while employee SUSPENDED (posture gate); cycle creation while employee not ACTIVE" }
  - { id: ERR_COMPONENT_INCOMPLETE, http: 422, condition: "Screening CLEARED decision with required components missing" }
  - { id: ERR_IMMUNITY_NOT_ESTABLISHED, http: 422, condition: "Screening CLEARED decision without latest IMMUNE titer for every REQUIRED_TITER_DISEASES member" }
  - { id: ERR_FIT_TEST_NOT_REQUIRED, http: 422, condition: "FIT_TEST completion recorded for an employee with requires_respirator == false" }
  - { id: ERR_SCREENING_EMPLOYEE_MISMATCH, http: 422, condition: "TiterResult.screening_id belongs to a different employee than the path employee" }
  - { id: ERR_CASE_EMPLOYEE_MISMATCH, http: 422, condition: "exposure_case_id on restriction/injury belongs to a different employee" }
  - { id: ERR_SELF_CONTACT, http: 422, condition: "contact_employee_id equals the event's index_employee_id" }
  - { id: ERR_FUTURE_RESULT_DATE, http: 422, condition: "resulted_at / source_resulted_at after the current logical clock time" }
  - { id: ERR_COMPLETION_OUT_OF_RANGE, http: 422, condition: "completed_at/started_at/serology resulted_at/injury_datetime/exposure_datetime outside its permitted range (future, before cycle creation, before exposure, etc.)" }
  - { id: ERR_ADMINISTER_OUTSIDE_WINDOW, http: 422, condition: "administered_at outside the campaign CLOSED window [window_start, window_end]" }
  - { id: ERR_CONTACT_DATE_OUT_OF_RANGE, http: 422, condition: "contact_date outside [event.infectious_start, now]" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc to_iso8601 not strictly after current logical time" }
  - { id: ERR_WORK_RESTRICTION_OVERLAP, http: 409, condition: "New ACTIVE restriction's half-open [start_date, end_date) intersects an existing ACTIVE restriction of the same employee (null end = +infinity; adjacency permitted)" }
  - { id: ERR_CAMPAIGN_WINDOW_OVERLAP, http: 409, condition: "Same-vaccine_type campaign CLOSED windows intersect or touch (window_start <= existing.window_end AND window_end >= existing.window_start)" }
  - { id: ERR_DUPLICATE_CONTACT, http: 409, condition: "ExposureContact already exists for (event_id, contact_employee_id)" }
  - { id: ERR_DUPLICATE_EMPLOYEE_REF, http: 409, condition: "employee_ref already registered" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, source_patient_ref present iff source_known violated, window_end < window_start" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value not a declared member" }
  - { id: ERR_INSUFFICIENT_JUSTIFICATION, http: 400, condition: "Serology waive reason absent or shorter than 10 characters" }
  - { id: ERR_DECLINATION_REASON_REQUIRED, http: 400, condition: "Participation DECLINED without non-empty declination_reason" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: EmployeeHealthNurse
    description: "Employee health office nurse: intake, screenings, titers, cycle completions, serology results, clearance requests, contact conversion, vaccination administration"
    identity: opaque
    exclusive_operations:
      - "POST /employee-health/employees"
      - "POST /employee-health/employees/{id}/pre-placement-screenings"
      - "POST /employee-health/pre-placement-screenings/{id}/components/complete"
      - "POST /employee-health/employees/{id}/titer-results"
      - "POST /employee-health/annual-requirement-cycles/{id}/completions"
      - "POST /employee-health/employees/{id}/exposure-cases"
      - "POST /employee-health/exposure-cases/{id}/source-testing"
      - "POST /employee-health/work-restrictions/{id}/clearances"
    shared_operations:
      - "POST /employee-health/serology-follow-ups/{id}/transition (RESULTED only)"
      - "POST /employee-health/exposure-contacts/{id}/report-symptom"
      - "POST /employee-health/exposure-contacts/{id}/transition (CONVERTED_TO_CASE only)"
      - "POST /employee-health/campaign-participations/{id}/transition (ADMINISTERED only)"
      - "GET endpoints (all except coverage is open to all non-staff roles)"
  - name: EmployeeHealthPhysician
    description: "Employee health physician: clearance decisions, exposure management, PEP, restrictions, exemptions, serology waivers"
    identity: opaque
    exclusive_operations:
      - "POST /employee-health/pre-placement-screenings/{id}/decide"
      - "POST /employee-health/exposure-cases/{id}/transition"
      - "POST /employee-health/employees/{id}/work-restrictions"
      - "POST /employee-health/return-to-work-clearances/{id}/decide"
    shared_operations:
      - "POST /employee-health/pep-regimens/{id}/transition (STARTED, COMPLETED)"
      - "POST /employee-health/serology-follow-ups/{id}/transition (WAIVED only)"
      - "POST /employee-health/campaign-participations/{id}/transition (EXEMPTED only)"
      - "GET endpoints"
  - name: ComplianceOfficer
    description: "Occupational-health compliance officer: logical clock, annual cycles, hold release, campaigns"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /employee-health/employees/{id}/annual-requirement-cycles"
      - "POST /employee-health/compliance-holds/{id}/release"
      - "POST /employee-health/vaccination-campaigns"
      - "POST /employee-health/vaccination-campaigns/{id}/transition"
    shared_operations:
      - "GET endpoints"
  - name: SafetyOfficer
    description: "Employee safety officer: communicable events, contact tracing enrollment, lost-to-followup, injury reports and workers' compensation lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /employee-health/communicable-events"
      - "POST /employee-health/communicable-events/{id}/advance"
      - "POST /employee-health/communicable-events/{id}/contacts"
      - "POST /employee-health/employees/{id}/injury-reports"
      - "POST /employee-health/injury-reports/{id}/transition"
    shared_operations:
      - "POST /employee-health/exposure-contacts/{id}/transition (LOST_TO_FOLLOWUP only)"
      - "GET endpoints"
  - name: StaffEmployee
    description: "A hospital employee as self-service actor; X-User-ID equals the Employee id. May read only own records; sole actor for own PEP declination, campaign declination, and own symptom reports"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /employee-health/pep-regimens/{id}/transition (DECLINED, own case only)"
      - "POST /employee-health/campaign-participations/{id}/transition (DECLINED, own participation only)"
    shared_operations:
      - "POST /employee-health/exposure-contacts/{id}/report-symptom (own contact row only)"
      - "GET endpoints (self-scoped rows only)"
