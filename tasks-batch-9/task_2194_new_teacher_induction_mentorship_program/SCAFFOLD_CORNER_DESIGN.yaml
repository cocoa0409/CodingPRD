              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
