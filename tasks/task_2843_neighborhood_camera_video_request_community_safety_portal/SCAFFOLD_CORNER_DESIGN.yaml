            - "${s1_exp} == 0 and ${s1_purged} == 0 and ${s1_held} == 0 and ${s1_closed} == 0"
            - "the second sweep at the same clock instant also returns 200"
            - "${s2_at} == 2026-08-12T00:00:00Z"
            - "${s2_exp} == 0 and ${s2_purged} == 0 and ${s2_held} == 0 and ${s2_closed} == 0"
            - "Resident.${r1_id}.version == 1 and Resident.${r2_id}.version == 1 — the sweep bumped nothing"

      - name: resident_post_revise_outside_revision_requested_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /neighborhood-safety/resident-posts/{id}/revise]
          - validations[priority=25]
          - errors.ERR_POST_NOT_REVISABLE
          - state_machines.ResidentPost.state.REVISION_REQUESTED_to_PUBLISHED
        distinguishing_aspect: "revise is legal in exactly one state: it succeeds from REVISION_REQUESTED (clean rewrite scores 0.00 and returns the post to PUBLISHED with revision_count 1), and the very next identical call — now from PUBLISHED — returns 409 ERR_POST_NOT_REVISABLE without touching body, score or revision_count."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; author A plus flaggers N1 and N2, all with alert_radius_m 0; A's post carried location_profiling_count 4 (score 0.46, below the 0.49 threshold, so it published) and has been flagged by both neighbours, so it is FLAGGED at version 3; moderator mod-1 opened a case and mod-2 decided REQUEST_REVISION, so the post is REVISION_REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Author A", email: "authora@example.test", home_x_m: 0, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { a_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Near One", email: "n1@example.test", home_x_m: 10, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Near Two", email: "n2@example.test", home_x_m: 20, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { n2_id: "$.data.id" }
