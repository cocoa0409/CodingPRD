  # =========================================================================
  # RULE 3 - non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: case_parallel_dimensions_advance_independently_of_each_other
        grounds:
          - state_machines.Case.adjudication.DECIDED_to_SANCTION_IMPOSED
          - state_machines.Case.notation.NOT_APPLICABLE_to_PENDING_POSTING
          - state_machines.Case.notation.PENDING_POSTING_to_POSTED
          - entities.Case.fields.notation_status
          - entities.Case.fields.adjudication_status
          - roles.RegistrarOfficer
        distinguishing_aspect: |
          The Case carries TWO independent state dimensions. Imposing a rank-4 sanction moves
          adjudication_status DECIDED -> SANCTION_IMPOSED and, in the same request, drags notation_status
          NOT_APPLICABLE -> PENDING_POSTING; the registrar's subsequent notation/post then moves
          notation_status PENDING_POSTING -> POSTED while leaving adjudication_status at SANCTION_IMPOSED
          untouched, proving the dimensions are not a single linear chain.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z, then advanced to 2026-08-20T10:00:00Z for the hearing"
            - "ENGL department, CURRENT-training reporter (also the ENGL-201 instructor), CURRENT-training chair, three panelists, one student"
            - "formal case on ENGL-201 / 2026FA with SEED-A evidence, ALLEGATION_NOTICE acknowledged, hearing held in ROOM-A"
            - "panel votes RESPONSIBLE/4, RESPONSIBLE/6, NOT_RESPONSIBLE -> panel_severity_recommendation 4, so recommended_ladder_rank is MAX(tier 3, panel 4) == 4 with office band [3,5]"
            - "a rank-4 TRANSCRIPT_NOTATION_ONLY sanction is proposed against the decided case"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Cora Chair", email: "cora@u.edu" }
              as: IntegrityOfficer
              captures: { chair_id: $.data.id }
            - call: "POST /integrity/faculty-members/${chair_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-02-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pat Panel One", email: "pan1@u.edu" }
              as: IntegrityOfficer
              captures: { pan1_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pia Panel Two", email: "pan2@u.edu" }
              as: IntegrityOfficer
              captures: { pan2_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Pim Panel Three", email: "pan3@u.edu" }
              as: IntegrityOfficer
              captures: { pan3_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/hearing-rooms"
              payload: { code: "ROOM-A", seat_capacity: 12, buffer_minutes: 30, sessions_per_day_cap: 2 }
              as: IntegrityOfficer
              captures: { room_a_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Sufficient evidence." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases"
              payload: { report_id: "${report_id}" }
              as: IntegrityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /integrity/cases/${case_id}/pathway"
              payload: { pathway: "FORMAL" }
              as: IntegrityOfficer
            - call: "POST /integrity/cases/${case_id}/notifications"
              payload: { kind: "ALLEGATION_NOTICE", response_window_days: 5 }
              as: IntegrityOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /integrity/notifications/${notice_id}/acknowledge"
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /integrity/hearing-sessions"
              payload: { case_id: "${case_id}", room_id: "${room_a_id}", chair_id: "${chair_id}", panelist_ids: ["${pan1_id}", "${pan2_id}", "${pan3_id}"], start_at: "2026-08-20T10:00:00Z", end_at: "2026-08-20T11:30:00Z" }
              as: IntegrityOfficer
              captures: { session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T10:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/hearing-sessions/${session_id}/convene"
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan1_id}", verdict: "RESPONSIBLE", severity_recommendation: 4 }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan2_id}", verdict: "RESPONSIBLE", severity_recommendation: 6 }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan3_id}", verdict: "NOT_RESPONSIBLE" }
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "POST /integrity/hearing-sessions/${session_id}/decide"
              as: PanelChair
              as_user_id: "${chair_id}"
            - call: "GET /integrity/cases/${case_id}"
              as: IntegrityOfficer
              captures: { case_v_decided: $.data.version }
            - call: "POST /integrity/sanctions"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v_decided}", kind: "TRANSCRIPT_NOTATION_ONLY", ladder_rank: 4, effective_from: "2026-08-21T00:00:00Z" }
              as: IntegrityOfficer
              captures: { sanction_id: $.data.id }
          trigger:
            - call: "POST /integrity/sanctions/${sanction_id}/impose"
              as: IntegrityOfficer
            - call: "POST /integrity/cases/${case_id}/notation/post"
              as: RegistrarOfficer
              captures: { notation_after: $.data.notation_status, adjudication_after: $.data.adjudication_status }
          assert:
            - "immediately after impose: Case.${case_id}.adjudication_status == SANCTION_IMPOSED and Case.${case_id}.notation_status == PENDING_POSTING"
            - "after notation/post: Case.${case_id}.notation_status == POSTED"
            - "after notation/post: Case.${case_id}.adjudication_status is still SANCTION_IMPOSED (the registrar action moves only the notation dimension)"
            - "Case.${case_id}.panel_severity_recommendation == 4 and Case.${case_id}.recommended_ladder_rank == 4"
            - "Case.${case_id}.severity_index == 44.00 and Case.${case_id}.hearing_round == 1"
            - "Sanction.${sanction_id}.status == IMPOSED, Sanction.${sanction_id}.imposed_at == 2026-08-20T10:00:00Z, Sanction.${sanction_id}.adjusted_course_grade_pct == null"
            - "Student.${student_id}.transcript_notation == POSTED and Student.${student_id}.active_sanction_points == 4"
            - "Case.${case_id}.expungement_eligible_at == null (the governing sanction is IMPOSED, not COMPLETED)"

      - name: integrity_report_returned_for_info_cycle_requires_fresh_evidence
        grounds:
          - state_machines.IntegrityReport.SUBMITTED_to_RETURNED_FOR_INFO
          - state_machines.IntegrityReport.RETURNED_FOR_INFO_to_SUBMITTED
          - entities.IntegrityReport.fields.resubmission_count
          - validations[priority=31]
        distinguishing_aspect: |
          IntegrityReport contains a genuine CYCLE: SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED, and the
          re-entry edge carries a guard the first entry does not have - a resubmission is only accepted
          when at least one EvidenceItem was created AFTER returned_at, so the same submit call is
          rejected with ERR_EVIDENCE_INCOMPLETE before the new evidence and accepted after it, while
          resubmission_count advances 0 -> 1.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "a PLAGIARISM report on ENGL-201 / 2026FA carrying SEED-A evidence, already SUBMITTED once"
            - "the officer triages it RETURN_FOR_INFO, so status is RETURNED_FOR_INFO and returned_at is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
