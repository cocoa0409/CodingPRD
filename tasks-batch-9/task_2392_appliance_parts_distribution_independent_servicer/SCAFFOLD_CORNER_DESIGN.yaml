            - "WarrantyClaim.${claim_b_id}.submitted_at == null"

      - name: cert_requirement_is_derived_from_the_resolved_part_not_the_requested_one
        claim_type: cascading_validation
        grounds:
          - validations[priority_25]
          - errors[ERR_TECHNICIAN_CERT_REQUIRED]
          - calculations.supersession_chain_resolution
          - entities.Part.fields.cert_level_required
        distinguishing_aspect: "The requested part is MECHANICAL (cert_level_required NONE) but its supersession target is ELECTRICAL (cert_level_required ADVANCED), so priority 25 must run AFTER chain resolution and reject the line with ERR_TECHNICIAN_CERT_REQUIRED — reading the requested part's requirement would have wrongly passed."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL with will_call_enabled true."
            - "Part P_NEW W10-BOARD-NEW oem_code WHIRLPOOL ELECTRICAL list 13000 ACTIVE (cert_level_required ADVANCED); Part P_OLD W10-PUMP oem_code WHIRLPOOL MECHANICAL list 12999 (cert_level_required NONE), superseded by P_NEW — the supersession keeps the oem_code but changes the category."
            - "ServicerAccount authorized for WHIRLPOOL, NET_30, credit_limit_cents 10000000, holding NO technician certification at all."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-BOARD-NEW", oem_code: "WHIRLPOOL", description: "Replacement control board", category: "ELECTRICAL", list_price_cents: 13000, weight_grams: 400 }
              as: PricingAdmin
              captures: { part_new_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_old_id: $.data.id, part_old_v1: $.data.version }
            - call: "POST /parts/${part_old_id}/supersession"
              payload: { superseded_by_part_id: "${part_new_id}", expected_part_version: "${part_old_v1}" }
              as: PricingAdmin
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-3013" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
          trigger:
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_old_id}", quantity: 1, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { err_cert: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_TECHNICIAN_CERT_REQUIRED"
            - "PartOrder.${order_id}.subtotal_cents == 0"
            - "PartOrder.${order_id}.version == 1"
            - "GET /order-lines?part_order_id=${order_id} returns len(response.data) == 0"

      - name: higher_priority_state_error_wins_over_the_fiscal_error
        claim_type: priority_ordering
        grounds:
          - validations[priority_10]
          - validations[priority_48]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / order_not_draft_state_outranks_credit_limit_fiscal_on_line_add
          rationale: "That §1.8 instance violates the state rule and the credit-limit rule in one call and asserts ERR_ORDER_NOT_DRAFT is returned."

      - name: allocation_depends_on_the_pickup_branch_being_open
        claim_type: cross_entity_validation
        grounds:
          - validations[priority_9]
          - errors[ERR_BRANCH_NOT_OPEN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allocation_blocked_while_the_pickup_branch_is_in_count_freeze
          rationale: "That §1.8 instance asserts both the COUNT_FREEZE failure and the post-reopen success, covering the valid/invalid pair for this cross-entity gate."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: branch_patch_updates_will_call_settings_and_bumps_version
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/branches/{id}
          - entities.Branch.fields.will_call_enabled
          - entities.Branch.fields.cutoff_hour_utc
        distinguishing_aspect: "A PATCH carrying only will_call_enabled and cutoff_hour_utc updates exactly those two fields, leaves name/region_code/overnight_surcharge_cents untouched and moves version from 1 to 2."
        test_recipe:
          setup:
            - "One Branch STL created with will_call_enabled true, cutoff_hour_utc 20, overnight_surcharge_cents 300."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id, branch_a_v1: $.data.version }
          trigger:
            - call: "PATCH /branches/${branch_a_id}"
              payload: { will_call_enabled: false, cutoff_hour_utc: 22 }
              as: PlatformAdmin
          assert:
            - "response.status == 200"
            - "${branch_a_v1} == 1"
            - "Branch.${branch_a_id}.will_call_enabled == false"
            - "Branch.${branch_a_id}.cutoff_hour_utc == 22"
            - "Branch.${branch_a_id}.overnight_surcharge_cents == 300"
            - "Branch.${branch_a_id}.name == St Louis DC"
            - "Branch.${branch_a_id}.branch_status == OPEN"
            - "Branch.${branch_a_id}.version == 2"

      - name: tier_review_promotes_the_account_to_the_highest_qualifying_tier
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/servicer-accounts/{id}/tier-review
          - calculations.pricing_tier_assignment
          - entities.ServicerAccount.fields.rolling_12m_volume_cents
          - entities.ServicerAccount.fields.pricing_tier_id
        distinguishing_aspect: "With 5120000 of INVOICED volume inside TIER_LOOKBACK_DAYS, tier-review moves the account from SILVER (min 0) to GOLD (min 5000000) — the largest eligible floor — and leaves account_status ACTIVE because the lifetime delinquency score is 80."
        test_recipe:
          setup:
            - "PricingTier SILVER (all discounts 0.10, min_annual_volume_cents 0) and PricingTier GOLD (mechanical 0.20, min_annual_volume_cents 5000000)."
            - "Branch STL with will_call_enabled true; Part P4 W10-MOTOR MECHANICAL list 128000, weight 9000 g (SILVER unit 115200, GOLD unit 102400, cert_level_required NONE)."
            - "NET_30 account starting on GOLD with credit_limit_cents 10000000; InventoryRecord (STL, P4) on_hand 60."
            - "A WILL_CALL order for 50 units priced on GOLD (50 * 102400 == 5120000) is credit-approved, allocated and fulfilled, so settlement_status is INVOICED with invoiced_total_cents 5120000."
            - "The account is then moved to SILVER by PATCH so the review has somewhere to promote from."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
