  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depths >=3 and >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: supplier_doc_verify_kit_slot_production_cascade
        grounds:
          - state_machines.Component.SUBMITTED_to_VERIFIED
          - state_machines.PartsKit.STAGING_to_COMPLETE
          - state_machines.ProductionSlot.ASSIGNED_to_IN_PRODUCTION
          - calculations.kit_completeness
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /components/{id}/verify-docs:
          Component VERIFIED (link 1) -> kit_completeness recompute flips the
          bus's PartsKit STAGING -> COMPLETE (link 2) -> the ASSIGNED
          ProductionSlot's kit_status flips NOT_KITTED -> KITTED (link 3) —
          each hop caused by the previous, not by the original request.
