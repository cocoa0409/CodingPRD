        excluded_because:
          difficulty_instance: dual_variant_calc / pack_to_melt_yield_provisional_vs_final_diverge_on_same_lot
          rationale: "The named §1.8 instance asserts both the provisional and the final yield on one lot plus the exact delta produced by the variant switch."

