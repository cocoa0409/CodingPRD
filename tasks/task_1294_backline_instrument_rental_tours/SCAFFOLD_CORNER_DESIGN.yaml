              payload: { gear_unit_id: "${fu}", weight_kg: 5, labor_minutes: 5 }
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${fr}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${fr}/mark-delivered"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${fr}/check-in"
              payload: { checked_in_at: "2026-08-07T09:00:00Z" }
              as: WarehouseTech
            - call: "POST /backline/reservation-lines/${fr}/inspect"
              payload: { damage_present: true, assessed_severity: "MAJOR", repair_estimate_cents: 20000 }
              as: WarehouseTech
            - call: "GET /backline/damage-claims"
              payload: { reservation_line_id: "${fr}" }
              as: OpsManager
              captures: { fdc: "$.data[0].id" }
            - call: "POST /backline/damage-claims/${fdc}/assess"
              payload: {}
              as: OpsManager
            - call: "GET /backline/artists/${fa}"
              as: OpsManager
              captures: { risk_before: $.data.risk_score }
          trigger:
            - call: "POST /backline/damage-claims/${fdc}/waive"
              payload: {}
              as: OpsManager
            - call: "GET /backline/artists/${fa}"
              as: OpsManager
              captures: { risk_after: $.data.risk_score }
          assert:
            - "Artist.${fa}.risk_score == 24 while claim ASSESSED (12 * 2 recency)"
            - "Artist.${fa}.risk_score == 0 after waive (WAIVED exits the input set; full recompute, no drift)"

  # ===========================================================================
  # Section: validations — violation/priority claims
  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers yield ERR_UNAUTHENTICATED 401 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /backline/tours"
              as: Anonymous
              captures: { un_err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401"

      - name: invalid_window_stop_outside_tour
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_INVALID_WINDOW]"
        distinguishing_aspect: "Stop venue_date outside [tour.start_date, tour.end_date] yields ERR_INVALID_WINDOW 422."
        test_recipe:
          setup: ["tour spanning 2026-08-01..2026-08-31"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Window Act" }
              as: OpsManager
              captures: { wa: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${wa}", name: "Window Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { wt: $.data.id }
          trigger:
            - call: "POST /backline/tours/${wt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-09-05T00:00:00Z", load_in_ts: "2026-09-05T10:00:00Z" }
              as: TourManager
              captures: { win_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_WINDOW, http 422"

      - name: substitution_model_not_in_list
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_SUBSTITUTION_NOT_ALLOWED]"
        distinguishing_aspect: "Proposing a substitute model absent from GearModel.substitute_model_ids fails ERR_SUBSTITUTION_NOT_ALLOWED 422."
        test_recipe:
          setup: ["sourced rider line on model with empty substitute list"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Sub Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { sa: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "SB-GTR-A", category: "GUITAR", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { smA: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "SB-GTR-B", category: "GUITAR", daily_rate_cents: 9000, replacement_value_cents: 90000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { smB: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${smA}", serial_number: "SB-U1", home_city_code: "LAX" }
              as: OpsManager
            - call: "POST /backline/tours"
              payload: { artist_id: "${sa}", name: "Sub Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { st: $.data.id }
            - call: "POST /backline/tours/${st}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { ss: $.data.id }
            - call: "POST /backline/tour-stops/${ss}/rider-lines"
              payload: { gear_model_id: "${smA}", quantity: 1 }
              as: TourManager
              captures: { srl: $.data.id }
            - call: "POST /backline/rider-lines/${srl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /backline/rider-lines/${srl}/propose-substitution"
              payload: { substitute_gear_model_id: "${smB}", substitution_reason: "not in list" }
              as: LogisticsCoordinator
              captures: { sub_err: $.data.error_id }
          assert:
            - "error_id == ERR_SUBSTITUTION_NOT_ALLOWED, http 422"

      - name: cross_rental_vendor_not_eligible
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_VENDOR_NOT_ELIGIBLE]"
        distinguishing_aspect: "Creating a cross-rental request against a PENDING vendor (not APPROVED) fails ERR_VENDOR_NOT_ELIGIBLE."
        test_recipe:
          setup: ["vendor PENDING; unsourced-able rider line context with a DRAFT reservation placeholder — use a reservation id from a cross-rental source attempt... simplified: reservation created via cross-rental source path against an APPROVED vendor first, then a second request against the PENDING vendor"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Ven Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { va: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "VE-PA-1", category: "PA", daily_rate_cents: 80000, replacement_value_cents: 600000, weight_class: "HEAVY" }
              as: OpsManager
              captures: { vm: $.data.id }
            - call: "POST /backline/partner-vendors"
              payload: { name: "Pending Co", city_codes: ["LAX"], commission_bps: 1000 }
              as: OpsManager
              captures: { vp: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${va}", name: "Ven Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { vt: $.data.id }
            - call: "POST /backline/tours/${vt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-12T00:00:00Z", load_in_ts: "2026-08-12T10:00:00Z" }
              as: TourManager
              captures: { vs: $.data.id }
            - call: "POST /backline/tour-stops/${vs}/rider-lines"
              payload: { gear_model_id: "${vm}", quantity: 1 }
              as: TourManager
              captures: { vrl: $.data.id }
            - call: "POST /backline/rider-lines/${vrl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-11T00:00:00Z", end_date: "2026-08-13T00:00:00Z", use_cross_rental: true, partner_vendor_id: "${vp}", vendor_rate_cents_per_day: 70000 }
              as: LogisticsCoordinator
              captures: { ven_err: $.data.error_id }
          trigger: []
          assert:
            - "source with PENDING vendor fails: error_id == ERR_VENDOR_NOT_ELIGIBLE, http 422"

      - name: missing_required_field_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /backline/tours without artist_id yields ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /backline/tours"
              payload: { name: "No Artist", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { req_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: flight_case_required_enforcement
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_FLIGHT_CASE_REQUIRED]"
        distinguishing_aspect: "Loading a HEAVY unit's shipment line without a flight_case_id fails ERR_FLIGHT_CASE_REQUIRED."
        test_recipe:
          setup: ["HEAVY unit booked onto shipment without case; shipment LOADING"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Case Act" }
              as: OpsManager
              captures: { ca: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "FC-PA-1", category: "PA", daily_rate_cents: 50000, replacement_value_cents: 500000, weight_class: "HEAVY" }
              as: OpsManager
              captures: { cm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${cm}", serial_number: "FC-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { cu: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ca}", name: "Case Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { ct: $.data.id }
            - call: "POST /backline/shipments"
              payload: { tour_id: "${ct}", from_city_code: "LAX", to_city_code: "NYC", ship_date: "2026-08-09T00:00:00Z", capacity_kg: 500 }
              as: LogisticsCoordinator
              captures: { csh: $.data.id }
            - call: "POST /backline/shipments/${csh}/lines"
              payload: { gear_unit_id: "${cu}", weight_kg: 100, labor_minutes: 30 }
              as: LogisticsCoordinator
              captures: { csl: $.data.id }
            - call: "POST /backline/shipments/${csh}/begin-loading"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /backline/shipment-lines/${csl}/load"
              payload: {}
              as: WarehouseTech
              captures: { fc_err: $.data.error_id }
          assert:
            - "error_id == ERR_FLIGHT_CASE_REQUIRED, http 422"

      - name: insurance_required_at_activation
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_INSURANCE_REQUIRED]"
        distinguishing_aspect: "Activating a tour for a non-waived artist without insurance_policy_id fails ERR_INSURANCE_REQUIRED 422."
        test_recipe:
          setup: ["tour with stop, artist STANDARD not waived, no insurance_policy_id"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Ins Act", tier: "STANDARD" }
              as: OpsManager
              captures: { ia: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ia}", name: "Ins Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { it: $.data.id }
            - call: "POST /backline/tours/${it}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
            - call: "GET /backline/tours/${it}"
              as: TourManager
              captures: { it_v: $.data.version }
          trigger:
            - call: "POST /backline/tours/${it}/activate"
              payload: { expected_tour_version: "${it_v}" }
              as: TourManager
              captures: { ins_err: $.data.error_id }
          assert:
            - "error_id == ERR_INSURANCE_REQUIRED, http 422"

      - name: stale_version_occ_on_tour_activate
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[tour-activate-stale-tour]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Activate with expected_tour_version one behind the current (a stop was added after the client's read) fails 412 ERR_STALE_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["tour with insurance; client reads version, then adds a stop (bumping version), then activates with the stale version"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Occ Act", tier: "STANDARD" }
              as: OpsManager
              captures: { oa: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${oa}", name: "Occ Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", insurance_policy_id: "POL-OCC" }
              as: TourManager
              captures: { ot: $.data.id }
            - call: "GET /backline/tours/${ot}"
              as: TourManager
              captures: { ot_v_stale: $.data.version }
            - call: "POST /backline/tours/${ot}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
          trigger:
            - call: "POST /backline/tours/${ot}/activate"
              payload: { expected_tour_version: "${ot_v_stale}" }
              as: TourManager
              captures: { occ_err: $.data.error_id }
            - call: "GET /backline/tours/${ot}"
              as: TourManager
              captures: { ot_v_fresh: $.data.version }
            - call: "POST /backline/tours/${ot}/activate"
              payload: { expected_tour_version: "${ot_v_fresh}" }
              as: TourManager
              captures: { ot_status: $.data.status }
          assert:
            - "first activate: error_id == ERR_STALE_VERSION, http 412"
            - "second activate with fresh version succeeds: Tour.${ot}.status == ACTIVE"

  # ===========================================================================
  # Section: endpoints — pattern claims
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_envelope
        claim_type: pagination_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "GET /backline/gear-models?limit=2&offset=0 returns meta + response_type array + data with pagination fields total_count and has_more honored; default limit 10 when omitted."
        test_recipe:
          setup: ["three gear models created"]
          setup_api_calls:
            - call: "POST /backline/gear-models"
              payload: { sku: "PG-1", category: "AMP", daily_rate_cents: 1000, replacement_value_cents: 5000, weight_class: "STANDARD" }
              as: OpsManager
            - call: "POST /backline/gear-models"
              payload: { sku: "PG-2", category: "AMP", daily_rate_cents: 1000, replacement_value_cents: 5000, weight_class: "STANDARD" }
              as: OpsManager
            - call: "POST /backline/gear-models"
              payload: { sku: "PG-3", category: "AMP", daily_rate_cents: 1000, replacement_value_cents: 5000, weight_class: "STANDARD" }
              as: OpsManager
          trigger:
            - call: "GET /backline/gear-models"
              payload: { limit: 2, offset: 0 }
              as: OpsManager
          assert:
            - "response envelope has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == array; data length == 2; total_count == 3; has_more == true"
            - "second page (offset 2) returns 1 row, has_more == false"

      - name: gear_unit_availability_computed_read
        claim_type: computed_read
        grounds: [endpoints: "GET /backline/gear-units/{id}/availability"]
