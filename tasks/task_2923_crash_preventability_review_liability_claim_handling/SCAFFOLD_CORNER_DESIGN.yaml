      - name: cyclic_shape_review_case_loops_back_into_deliberation
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ReviewCase.DECIDED_to_DELIBERATION
          - state_machines.ReviewCase.DELIBERATION_to_CLOSED_FINAL
        distinguishing_aspect: "The ReviewCase loop DELIBERATION -> DECIDED -> DELIBERATION is bounded by APPEAL_MAX_ROUNDS, and the second decision lands in CLOSED_FINAL with Crash.appeals_exhausted true rather than in DECIDED."
        excluded_because:
          difficulty_instance: review_case_appeal_cycle_returns_to_deliberation
          rationale: "That §1.8 instance walks the full loop — decide to DECIDED, grant the appeal back to DELIBERATION with determination reset to PENDING, re-ballot, then decide again into CLOSED_FINAL with appeals_exhausted true and a third appeal refused by ERR_APPEALS_EXHAUSTED — which is exactly the cyclic-shape claim plus its termination condition."

      - name: parallel_dimensions_of_claim_advance_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Claim.handling_status
          - state_machines.Claim.reserve_status
        distinguishing_aspect: "handling_status and reserve_status move on disjoint triggers, so a demand creation advances only the first dimension and a reserve revision only the second, while close is the single trigger that advances both."
        excluded_because:
          difficulty_instance: claim_parallel_handling_and_reserve_dimensions
          rationale: "That §1.8 instance interleaves demand creation, reserve revisions and settlement on one claim and asserts the full (handling_status, reserve_status) pair after each step, including that a revision leaves handling_status untouched and that close drives both dimensions to their terminal values."

      - name: guarded_transition_decide_depends_on_crash_evidence_posture
        claim_type: guarded_transitions
        grounds:
          - state_machines.ReviewCase.DELIBERATION_to_DECIDED
          - validations[priority=30]
          - calculations.crash_evidence_posture
        distinguishing_aspect: "DELIBERATION -> DECIDED is guarded by the state of a different entity: the Crash's derived evidence_posture must be COMPLETE or COMPROMISED, so a PARTIAL record blocks a fully-balloted case."
        excluded_because:
          difficulty_instance: decide_blocked_by_crash_evidence_posture_partial
          rationale: "That §1.8 instance holds a quorate case at PARTIAL posture, shows ERR_EVIDENCE_POSTURE_INSUFFICIENT, then preserves the one missing required kind and re-runs the identical decide call to success — the cross-entity guard in both directions."

      - name: cascade_down_decide_reaches_driver_and_terminal
        claim_type: cascade_down
        grounds:
          - state_machines.ReviewCase.DELIBERATION_to_DECIDED
          - state_machines.Crash.UNDER_REVIEW_to_PREVENTABLE
          - calculations.driver_preventable_points
          - calculations.terminal_crash_rate
        distinguishing_aspect: "One decide call propagates four levels down — ReviewCase, Crash, Driver points/tier, Terminal counters and risk_tier — inside a single request."
        excluded_because:
          difficulty_instance: decide_preventable_cascade_depth4_terminal_risk_tier
          rationale: "That §1.8 instance asserts every link of the depth-4 chain in one request and pins the terminal's crash_rate_per_million_miles and risk_tier after the cascade, which subsumes the generic cascade-down claim."

      - name: cross_entity_side_effect_decide_adjusts_claim_risk_scoring
        claim_type: cross_entity
        grounds:
          - state_machines.Crash.UNDER_REVIEW_to_PREVENTABLE
          - calculations.litigation_risk_score
        distinguishing_aspect: "The decide cascade reaches sideways into the Claim aggregate, re-scoring litigation_risk_score, litigation_risk_multiplier and counsel_required for the claim on the same crash."
        excluded_because:
          difficulty_instance: decide_preventable_cascade_depth4_terminal_risk_tier
          rationale: "The same §1.8 cascade instance carries the Claim re-scoring link and asserts the pre- and post-decision score, multiplier and counsel_required values on the sibling Claim."

      - name: bubble_up_last_settled_sibling_completes_the_claim
        claim_type: bubble_up
        grounds:
          - state_machines.Claim.NEGOTIATION_to_SETTLEMENT_COMPLETE
          - state_machines.Demand.OFFER_OUTSTANDING_to_SETTLED
        distinguishing_aspect: "The identical settle trigger keeps the parent in NEGOTIATION while a sibling demand is still open and drives it to SETTLEMENT_COMPLETE only once every sibling is SETTLED or CLOSED_PAID."
        excluded_because:
          difficulty_instance: settle_demand_cascade_depth3_subrogation_ready
          rationale: "That §1.8 instance settles two sibling demands in sequence and asserts the parent stays in NEGOTIATION after the first and bubbles to SETTLEMENT_COMPLETE only after the second, which is the bubble-up claim including the negative half."

      - name: ledger_sync_settlement_updates_claim_money_buckets
        claim_type: ledger_sync
        grounds:
          - state_machines.Claim.NEGOTIATION_to_SETTLEMENT_COMPLETE
          - calculations.settlement_layer_waterfall
          - invariants.claim_exposure_conserved
        distinguishing_aspect: "A settlement moves cents out of outstanding_reserve_cents into indemnity_paid_cents and alae_paid_cents without changing claim_exposure_cents, so the ancestor ledger reconciles exactly before and after."
        excluded_because:
          difficulty_instance: settle_demand_cascade_depth3_subrogation_ready
          rationale: "That §1.8 instance pins every Claim money field before and after each settlement and asserts claim_exposure_cents is unchanged across both, which is precisely the ledger-sync reconciliation claim."

      - name: compensation_rescission_reverses_every_settlement_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Demand.SETTLED_to_OFFER_OUTSTANDING
          - state_machines.Claim.SETTLEMENT_COMPLETE_to_NEGOTIATION
          - state_machines.SubrogationDemand.READY_TO_PURSUE_to_DRAFT
        distinguishing_aspect: "Rescinding a settlement inside the 168-hour window reverses every side effect the settlement applied — demand fields, claim buckets, layer capacity and subrogation readiness — with no residual drift."
        excluded_because:
          difficulty_instance: rescind_settlement_restores_claim_ledger_and_layer_capacity
          rationale: "That §1.8 instance captures the full pre-settlement state, settles, rescinds, and asserts field-by-field restoration including PolicyLayer capacity and the SubrogationDemand's nulled recovery base, plus the rescission_count increment that is the only permitted residue."

      - name: conditional_cascade_spoliation_rescores_only_an_existing_claim
        claim_type: conditional_cascade
        grounds:
          - state_machines.EvidenceItem.REQUESTED_to_PURGED_BEFORE_HOLD
          - state_machines.EvidenceItem.PRESERVED_to_RELEASED
          - calculations.crash_evidence_posture
          - calculations.litigation_risk_score
          - validations[priority=33]
          - errors[ERR_LITIGATION_HOLD_ACTIVE]
        distinguishing_aspect: "The purge endpoint's side-effect set is selected by the item's own state and by whether a Claim exists: purging a REQUESTED item spoliates and re-scores the sibling Claim, while purging a PRESERVED item is refused with ERR_LITIGATION_HOLD_ACTIVE until that Claim is CLOSED."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One Terminal, one Driver, one MODERATE crash with a Claim (no demands) and two evidence items: a PRESERVED FORWARD_CAMERA and a still-REQUESTED TELEMATICS_SNAPSHOT."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Newark Terminal", terminal_code: "NWK02", region_code: "OH", annual_miles_millions: 2.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-3901", full_name: "Dara Ionescu", cdl_number: "OH-CDL-3901", hire_date: "2013-03-13" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T19:00:00Z", notified_at: "2026-07-30T19:10:00Z", location_text: "SR-16 at Cherry Valley Rd", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "FORWARD_CAMERA", source_device_id: "CAM-3901", window_start_at: "2026-07-30T18:00:00Z", window_end_at: "2026-07-30T20:00:00Z", retention_deadline_at: "2026-10-31T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_cam: $.data.id }
            - call: "POST /evidence-items/${ev_cam}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923nwk/cam-3901.mp4", evidence_hash: "7c7c8d8d9e9e0f0f1a1a2b2b3c3c4d4d" }
              as: Dispatcher
              as_user_id: "disp-001"
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "TELEMATICS_SNAPSHOT", source_device_id: "ECM-3901", window_start_at: "2026-07-30T18:00:00Z", window_end_at: "2026-07-30T20:00:00Z", retention_deadline_at: "2026-10-31T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_ecm: $.data.id }
            - call: "POST /claims"
              payload: { crash_id: "${c_id}", claimant_notice_date: "2026-07-31" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_id: $.data.id, score_before: $.data.litigation_risk_score, mult_before: $.data.litigation_risk_multiplier, prov_before: $.data.provisional_reserve_cents }
          trigger:
            - call: "POST /evidence-items/${ev_ecm}/purge"
              payload: { purge_reason: "ECM ring buffer overwritten before the hold letter issued" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { ecm_state: $.data.preservation_state, ecm_reason: $.data.purge_reason }
            - call: "GET /crashes/${c_id}"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { posture_after: $.data.evidence_posture }
            - call: "GET /claims/${cl_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { score_after: $.data.litigation_risk_score, mult_after: $.data.litigation_risk_multiplier, prov_after: $.data.provisional_reserve_cents }
            - call: "POST /evidence-items/${ev_cam}/purge"
              payload: { purge_reason: "retention schedule elapsed" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { e_hold: $.data.error_id }
            - call: "POST /claims/${cl_id}/close"
              payload: {}
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { cl_h: $.data.handling_status }
            - call: "POST /evidence-items/${ev_cam}/purge"
              payload: { purge_reason: "retention schedule elapsed" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { cam_state: $.data.preservation_state }
          assert:
            - "${score_before} == 10 (REPORTED 5 + PARTIAL 5), ${mult_before} == 1.00 and ${prov_before} == 2500000"
            - "${ecm_state} == PURGED_BEFORE_HOLD with ${ecm_reason} echoed — the REQUESTED branch is spoliation, and it is NOT blocked by the open Claim"
            - "${posture_after} == COMPROMISED — spoliation outranks the fact that one required kind is still preserved"
            - "${score_after} == 30 (REPORTED 5 + COMPROMISED 25) and ${mult_after} == 1.15 — the conditional cascade fired because a Claim exists on the crash"
            - "${prov_after} == ${prov_before} — provisional_reserve_cents was frozen at setup and is NOT retro-multiplied by the new posture"
            - "${e_hold} == ERR_LITIGATION_HOLD_ACTIVE with HTTP 409 — the PRESERVED item cannot be released while the Claim is open, and GET /evidence-items/${ev_cam} still reports PRESERVED"
            - "${cl_h} == CLOSED"
            - "${cam_state} == RELEASED — the identical purge call now takes the PRESERVED -> RELEASED branch, and the crash's evidence_posture stays COMPROMISED because the spoliated row is permanent"

  # =========================================================================
  - section: calculations
    instances:

      - name: recordability_codes_emit_in_fixed_order_with_the_hazmat_window
        claim_type: correct_result
        grounds:
          - calculations.crash_recordability
          - entities.Crash.fields.recordability_codes
          - entities.Crash.fields.report_due_at
        distinguishing_aspect: "recordability_codes is emitted in the pinned order [FATALITY, INJURY_TRANSPORTED, DISABLING_TOW, HAZMAT_RELEASE] regardless of which triggers fired, and hazmat shortens the window to 24 hours measured from occurred_at rather than from intake."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One Terminal and one Driver; four crashes exercising four different recordability outcomes."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Orrville Terminal", terminal_code: "ORR02", region_code: "OH", annual_miles_millions: 6.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-4001", full_name: "Emeka Sundqvist", cdl_number: "OH-CDL-4001", hire_date: "2010-10-10" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-31T06:00:00Z", notified_at: "2026-07-31T06:40:00Z", location_text: "I-76 MM 209", severity: "CATASTROPHIC", route_class: "LINEHAUL", tow_away: true, tow_reason: "DISABLING_DAMAGE", injury_transported_count: 2, fatality_count: 1, hazmat_release: true, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_all: $.data.id, codes_all: $.data.recordability_codes, rec_all: $.data.dot_recordable, due_all: $.data.report_due_at, rs_all: $.data.reporting_status }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-31T12:00:00Z", notified_at: "2026-07-31T12:05:00Z", location_text: "Tank farm apron", severity: "MODERATE", route_class: "LOCAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: true, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { codes_haz: $.data.recordability_codes, due_haz: $.data.report_due_at, rs_haz: $.data.reporting_status }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-31T15:00:00Z", notified_at: "2026-07-31T15:10:00Z", location_text: "Customer lot", severity: "MINOR", route_class: "LOCAL", tow_away: true, tow_reason: "CONVENIENCE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { codes_conv: $.data.recordability_codes, rec_conv: $.data.dot_recordable, due_conv: $.data.report_due_at, rs_conv: $.data.reporting_status }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T19:00:00Z", notified_at: "2026-07-30T19:25:00Z", location_text: "US-30 at Kidron Rd", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 1, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { codes_inj: $.data.recordability_codes, due_inj: $.data.report_due_at }
          assert:
            - "${codes_all} == [FATALITY, INJURY_TRANSPORTED, DISABLING_TOW, HAZMAT_RELEASE] in exactly that order — not alphabetical (which would start with DISABLING_TOW) and not payload order"
            - "${rec_all} == true, ${rs_all} == PENDING_FILING and ${due_all} == 2026-08-01T06:00:00Z — the hazmat 24-hour window from occurred_at, NOT 72 hours and NOT measured from notified_at"
            - "${codes_haz} == [HAZMAT_RELEASE] and ${due_haz} == 2026-08-01T12:00:00Z with ${rs_haz} == PENDING_FILING — a release with no injury and no tow is still recordable"
            - "${codes_conv} == [] with ${rec_conv} == false, ${due_conv} == null and ${rs_conv} == NOT_REQUIRED — a tow_away for CONVENIENCE fails the conjunction"
            - "${codes_inj} == [INJURY_TRANSPORTED] and ${due_inj} == 2026-08-02T19:00:00Z — the plain 72-hour window"

      - name: evidence_posture_counts_only_preserved_items_that_bracket_the_crash
        claim_type: input_set_filtering
        grounds:
          - calculations.crash_evidence_posture
          - state_machines.EvidenceItem.PRESERVED_to_RELEASED
          - validations[priority=42]
        distinguishing_aspect: "Only items that are currently PRESERVED and whose half-open window brackets occurred_at satisfy a required kind: an item whose window ENDS exactly at occurred_at does not count, and releasing a counted item drops the posture back to PARTIAL."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One Terminal, one Driver, one MODERATE crash at 2026-07-31T12:00:00Z (required kinds: TELEMATICS_SNAPSHOT and FORWARD_CAMERA) and NO Claim, so releases are never blocked by the litigation hold."
