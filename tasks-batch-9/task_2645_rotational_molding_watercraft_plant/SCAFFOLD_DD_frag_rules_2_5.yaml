      - name: warranty_payout_gross_then_fee_tier_then_storage_deduction
        grounds:
          - calculations.warranty_payout
          - calculations.warranty_reserve_ledger
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.WarrantyClaim.storage_review_status.GUIDANCE_VIOLATED_to_WAIVED
          - entities.WarrantyClaim.fields.pre_fee_gross_cents
          - entities.WarrantyClaim.fields.admin_fee_cents
          - entities.WarrantyClaim.fields.storage_deduction_cents
          - entities.WarrantyClaim.fields.net_payout_cents
          - concurrency_rules[claim-approve-stale-model]
        distinguishing_aspect: |
          This instance is §0.5 Rule 2 MODE (a) — FOUR independent inputs (msrp_cents 300000,
          months_in_service 12 via the PRO_RATA_AGE coverage curve, CLAIM_TYPE_FACTOR, and the
          storage_review_status axis) interacting non-linearly through a tiered rate table,
          rather than the nested rounding of mode (b) or the pinned circular resolution of
          mode (c). Two claims on the same model and the same age separate the interaction:
          the HULL_DEFORMATION claim's gross 240000 selects the ADMIN_FEE top rate 5.00 and the
          COSMETIC claim's gross 72000 selects the 8.00 band, and because the tier is chosen
          from pre_fee_gross_cents BEFORE the 35.00 percent WAIVED deduction, the first claim
          pays a 12000 fee on a post-deduction value of 156000 that would otherwise have been
          charged 8.00 percent (12480).
        test_recipe:
          setup:
            - "ProductModel PM-WAR-KM: KAYAK/MID, msrp_cents 300000, warranty_basis PRO_RATA_AGE, initial_warranty_reserve_cents 500000, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 24.000, nominal_charge_kg 12.000, min_cooling_minutes 30, wall_cv_max_pct 12.00, wall_thickness_min_mm 4.50, impact_test_min_joules 90.00."
            - "Mold MLD-WAR-1, cavity_count 2, nominal_charge_kg 24.000 == 12.000 * 2, service_interval_cycles 10; OvenStation OV-1 and CoolingBay CB-1 as elsewhere; four ACTIVE Technicians with the usual certifications and distinct operator / outfitter / inspector rows."
            - "Customer CUST-WAR is ACTIVE and has storage_guidance_acknowledged_at 2026-08-01T00:00:00Z, which is <= the hulls' delivered_at 2026-08-02T00:00:00Z, so the GUIDANCE_VERIFIED edge is reachable for the second claim."
            - "Warehouse WH-WAR of 20.0000 in one zone Z-A; qualified ResinLot LOT-WAR with received_kg 500.000; ProductionOrder PO-WAR (ordered_qty 2, no demand_bucket_id) released and run through one cycle to DEMOLDED."
            - "Both hulls are trimmed, outfitted (HK-WAR-0001 / HK-WAR-0002) and inspected PASS (wall_cv_pct 1.08, final_warpage_index 0.000), so PO-WAR reaches completed_qty 2 and COMPLETE; both are STORED in Z-A (hull 1 anchor 2.0000, hull 2 nested 1.0000)."
            - "Shipment SHP-WAR out of WH-WAR to destination_zone Z2, trailer_cube_capacity_m3 5.0000, trailer_max_payload_kg 200.000, carries both hulls, so cube_utilization_pct is exactly 60.00 == MIN_SEAL_UTILIZATION_PCT and the seal is admitted; it departs 2026-08-01T15:00:00Z and delivers 2026-08-02T00:00:00Z, setting both units to logistics_status DELIVERED with delivered_at 2026-08-02T00:00:00Z."
            - "The logical clock is then moved to 2027-08-02T00:00:00Z, exactly 12 complete calendar months after delivery, so start-review stamps months_in_service 12 on both claims (<= WARRANTY_TERM_MONTHS 60)."
            - "WarrantyClaim WC-WAR-1 (hull 1, HULL_DEFORMATION, reported_deformation_mm 4.50 >= DEFORMATION_THRESHOLD_MM 3.00) is UNDER_REVIEW with storage_review_status WAIVED (reviewed VIOLATED, then waived by PlantAdmin), and WarrantyClaim WC-WAR-2 (hull 2, COSMETIC) is UNDER_REVIEW with storage_review_status GUIDANCE_VERIFIED. ProductModel.warranty_reserve_cents is still 500000 and warranty_paid_cents 0."
