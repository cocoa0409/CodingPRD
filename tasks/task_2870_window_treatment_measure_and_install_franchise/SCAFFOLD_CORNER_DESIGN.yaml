  # -------------------------------------------------------------------
  # Guide section 4 - Validations (Table 4 + validation patterns)
  # -------------------------------------------------------------------
  - section: validations
    instances:
      - name: one_malformed_body_climbs_the_whole_authorization_ladder
        claim_type: Priority Ordering
        grounds:
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - validations.priority_3_ERR_DESIGNER_NOT_FOUND
          - validations.priority_5_ERR_TERRITORY_OWNERSHIP_REQUIRED
          - validations.priority_7_ERR_INVALID_REQUEST
        distinguishing_aspect: "The SAME invalid body is sent four times and answers with four different error ids, each one rung further up the ladder: role, then existence, then ownership, then finally the shape error the body actually contains. It proves the shape check runs LAST of the four and that no earlier rung leaks the body's defect."
        test_recipe:
          setup:
            - "Two chartered territories T1 (postal 30301) and T2 (postal 30401), and one designer belonging to T1."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/territories"
              payload: { legal_name: "Southmark Window Fashions", postal_codes: ["30401"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t2: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id, v_before: $.data.version }
          trigger:
            - call: "PATCH /blinds/designers/${d1}"
              payload: { status: "RETIRED_PLEASE" }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_role: $.data.error_id }
            - call: "PATCH /blinds/designers/11111111-1111-4111-8111-111111111111"
              payload: { status: "RETIRED_PLEASE" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_missing: $.data.error_id }
            - call: "PATCH /blinds/designers/${d1}"
              payload: { status: "RETIRED_PLEASE" }
              as: Franchisee
              as_user_id: "${t2}"
              captures: { err_owner: $.data.error_id }
            - call: "PATCH /blinds/designers/${d1}"
              payload: { status: "RETIRED_PLEASE" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_shape: $.data.error_id }
            - call: "PATCH /blinds/designers/${d1}"
              payload: { certifications: ["MOTORIZATION"] }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ok_certs: $.data.certifications, v_after: $.data.version }
          assert:
            - "the captured ${err_role} == ERR_ROLE_NOT_PERMITTED (403): PATCH /blinds/designers/{id} lists only Franchisee, so the designer's own call never reaches the body"
            - "the captured ${err_missing} == ERR_DESIGNER_NOT_FOUND (404): the unresolvable path parameter outranks the bad enum in the body"
            - "the captured ${err_owner} == ERR_TERRITORY_OWNERSHIP_REQUIRED (403): T2's franchisee is refused on ownership, not on the body and not with a 404 that would leak whether the row exists"
            - "the captured ${err_shape} == ERR_INVALID_REQUEST (400): only the row's own franchisee gets as far as the undeclared status value"
            - "the four refusals wrote nothing: the captured ${v_before} is unchanged until the last call, Designer.${d1}.status is still ACTIVE and certifications was still []"
            - "the fifth call succeeds: the captured ${ok_certs} == [MOTORIZATION] and ${v_after} == ${v_before} + 1 - exactly one write landed across five requests"

