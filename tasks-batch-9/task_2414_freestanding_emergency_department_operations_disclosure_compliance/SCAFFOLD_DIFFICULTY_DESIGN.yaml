  - rule_id: cross_entity_state_dependency
    instances:
      - name: observation_admission_blocked_by_suspended_facility_then_allowed_after_licence_restored
        grounds:
          - state_machines.Encounter.MSE_COMPLETE_to_OBSERVATION
          - validations[priority=16]
          - calculations.facility_compliance_posture
          - errors[ERR_FACILITY_POSTURE_BLOCKED]
        distinguishing_aspect: |
          Entity pair (Encounter, Facility): the Encounter transition MSE_COMPLETE -> OBSERVATION is
          legal on the encounter's own dimension, yet it is refused while the *Facility* posture is
          SUSPENDED and becomes legal once the licence is restored to ACTIVE and the posture returns
          to OPEN - nothing about the encounter changes between the two attempts.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with observation_bed_count 2, template PUBLISHED and signage ATTESTED, so compliance_posture is OPEN"
            - "One acuity-2 encounter, ACKNOWLEDGED, screened STABLE, sitting in MSE_COMPLETE"
            - "Facility license_status then patched to SUSPENDED, so compliance_posture is SUSPENDED and restricted_service_codes covers all 11 codes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 2, imaging_scope: ["XRAY", "CT"], lab_scope: ["CBC", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 145000, observation_hourly_cents: 42000, network_status_statement: "OUT_OF_NETWORK_ALL_PLANS", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-1101", acuity_level: 2, presenting_service_line: "GENERAL_MEDICAL" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/disclosure-decision"
              payload: { decision: "ACKNOWLEDGED" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
            - call: "POST /encounters/${enc_id}/begin-mse"
              payload: {}
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_id}/complete-mse"
              payload: { stabilization_status: "STABLE" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_v_open: $.data.version }
            - call: "PATCH /facilities/${fac_id}"
              payload: { expected_facility_version: "${fac_v_open}", license_status: "SUSPENDED" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_v_suspended: $.data.version }
          trigger:
            - call: "POST /encounters/${enc_id}/observation"
              payload: { observation_plan_note: "serial troponins" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "PATCH /facilities/${fac_id}"
              payload: { expected_facility_version: "${fac_v_suspended}", license_status: "ACTIVE" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /encounters/${enc_id}/observation"
              payload: { observation_plan_note: "serial troponins" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
          assert:
            - "the first observation attempt returns error_id == ERR_FACILITY_POSTURE_BLOCKED with HTTP 409 and leaves Encounter.${enc_id}.clinical_state == MSE_COMPLETE with observation_bed_held == false"
            - "after the licence is restored, Facility.${fac_id}.compliance_posture == OPEN and restricted_service_codes == []"
            - "the second observation attempt succeeds: Encounter.${enc_id}.clinical_state == OBSERVATION, observation_bed_held == true, observation_started_at == 2026-08-01T08:00:00Z"
            - "Facility.${fac_id}.observation_beds_occupied == 1"
