      - name: occ_stale_claim_version_on_approve_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[refund-approve-stale-claim]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Approving a RefundClaim with a stale expected_claim_version (one below current) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE plan P1; member M1 with a SUBMITTED RefundClaim; the claim's version was bumped by a prior no-op observation."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
