        distinguishing_aspect: "High-volume discount kicks in at exactly s >= 20 COMPLETED sessions (boundary inclusive)."
        test_recipe:
          setup: ["Booking with distance_miles=40 (base=2400); T1 delivers exactly 19 vs exactly 20 sessions on two separate bookings to compare"]
          setup_api_calls:
