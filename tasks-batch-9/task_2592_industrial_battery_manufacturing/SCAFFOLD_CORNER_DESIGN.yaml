              captures: { t1_id: "$.data.id" }
            - call: POST /capacity-tests
              as: QualityInspector
              as_user_id: "${qa_b_id}"
              payload: { assembly_id: "${asm_id}", chamber_id: "${chamber_id}", test_type: CAPACITY, scheduled_start_at: "2026-09-03T10:00:00Z", scheduled_end_at: "2026-09-03T12:00:00Z", draw_kw: 3.00 }
              captures: { t2_id: "$.data.id" }
            - call: POST /capacity-tests
              as: QualityInspector
