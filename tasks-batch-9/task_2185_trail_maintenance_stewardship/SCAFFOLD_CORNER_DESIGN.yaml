      - name: condition_report_priority_score_clamped_at_one_hundred
        claim_type: precision
        grounds:
          - calculations.condition_report_priority_score
          - calculations.condition_report_priority_score.constants.SEVERITY_BASE
          - entities.ConditionReport.fields.priority_score
        distinguishing_aspect: |
          The min(100, ...) clamp is load-bearing: CRITICAL (100) x HIGH exposure (1.25) x HEAVY
          traffic (1.15) computes to 143.75 and must be stored as exactly 100, not 144.
        test_recipe:
          setup:
            - "A HEAVY-traffic segment under one land manager, with one volunteer reporter."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Petra Novak", email: "petra@example.org", waiver_signed_on: "2026-07-01", certifications: [] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { gen_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "HEAVY" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
            - call: "POST /stewardship/condition-reports"
              payload: { trail_segment_id: "${seg_id}", reported_by_volunteer_id: "${gen_id}", hazard_type: "BRIDGE_DAMAGE", severity_class: "CRITICAL", description: "Deck collapsed at the north abutment." }
              as: Volunteer
              as_user_id: "${gen_id}"
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /stewardship/condition-reports/${cr_id}/triage"
              payload: { exposure_class: "HIGH" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { sc: $.data.priority_score, sv: $.data.priority_variant, tsnap: $.data.traffic_class_snapshot }
          assert:
            - "${sc} == 100"
            - "${sc} != 144"
            - "${sv} == INITIAL_TRIAGE"
            - "${tsnap} == HEAVY"
            - "TrailSegment.${seg_id}.hazard_index == 33"
