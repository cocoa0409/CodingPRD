            - { call: "PUT /machines/${mach_fb}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_fb}", slot_id: "${slot_fb}", qty: 10 }, as: VendingTechnician, captures: { ro_fb: $.data.id } }
            - { call: "POST /restock-orders/${ro_fb}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_fb}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_fb}", slot_id: "${slot_fb}", qty: 2, idempotency_key: "fb-1" }, as: Employee, as_user_id: "${emp_fb}", captures: { fb_price: $.data.unit_price_cents, fb_total: $.data.line_total_cents } }
          assert:
            - "IssuanceTransaction.unit_price_cents == 250 (base_list_price fallback)"
            - "IssuanceTransaction.line_total_cents == 500"

      - name: fit_test_expiry_boundary
        claim_type: boundary_edge
        grounds: [calculations.fit_test_validity, "errors[ERR_FIT_TEST_REQUIRED]"]
        distinguishing_aspect: "Fit-test expiry is INCLUSIVE: on expires_on (2027-01-10) the respirator vend still passes; one day later the sweep marks the entry EXPIRED and the identical vend fails ERR_FIT_TEST_REQUIRED."
        test_recipe:
          setup:
            - "RESPIRATOR item CALC-FT base 900; policy limit 10, window 400 days (spans the clock jump)"
            - "Employee with PASS fit test tested_on 2026-01-10 (expires_on 2027-01-10); machine ACTIVE stocked 10"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-FT1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_ft: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "PAINTER-FT" }, as: EHSAdministrator, captures: { role_ft: $.data.id } }
            - { call: "POST /items", payload: { sku: "CALC-FT", name: "Half Mask", category: "RESPIRATOR", base_list_price_cents: 900 }, as: EHSAdministrator, captures: { item_ft: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_ft}", item_id: "${item_ft}", period_limit_qty: 10, period_window_days: 400 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-FT1", full_name: "Painter FT", job_role_id: "${role_ft}", home_cost_center_id: "${cc_ft}" }, as: EHSAdministrator, captures: { emp_ft: $.data.id } }
            - { call: "POST /employees/${emp_ft}/fit-tests", payload: { item_id: "${item_ft}", tested_on: "2026-01-10", result: "PASS" }, as: SafetyOfficer }
            - { call: "POST /machines", payload: { location_code: "LOC-FT1", site_name: "P15", model: "VM-1" }, as: VendingTechnician, captures: { mach_ft: $.data.id, mach_ft_v: $.data.version } }
            - { call: "POST /machines/${mach_ft}/slots", payload: { slot_code: "R1", item_id: "${item_ft}", capacity: 20, par_level: 0, expected_machine_version: "${mach_ft_v}" }, as: VendingTechnician, captures: { slot_ft: $.data.id } }
            - { call: "PUT /machines/${mach_ft}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_ft}", slot_id: "${slot_ft}", qty: 10 }, as: VendingTechnician, captures: { ro_ft: $.data.id } }
            - { call: "POST /restock-orders/${ro_ft}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_ft}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-10T08:00:00Z" }, as: EHSAdministrator }
            - { call: "POST /issuances", payload: { machine_id: "${mach_ft}", slot_id: "${slot_ft}", qty: 1, idempotency_key: "ft-1" }, as: Employee, as_user_id: "${emp_ft}", captures: { ft_ok: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-11T08:00:00Z" }, as: EHSAdministrator }
            - { call: "POST /issuances", payload: { machine_id: "${mach_ft}", slot_id: "${slot_ft}", qty: 1, idempotency_key: "ft-2" }, as: Employee, as_user_id: "${emp_ft}", captures: { ft_err: $.data.error_id } }
          assert:
            - "on expires_on (2027-01-10): vend SUCCEEDS (inclusive expiry)"
            - "on 2027-01-11: vend FAILS with ERR_FIT_TEST_REQUIRED (sweep flipped entry to EXPIRED)"

      - name: inspection_overdue_quarantine_boundary
        claim_type: boundary_edge
        grounds: [calculations.inspection_due_sweep, state_machines.SerializedUnit.INSPECTION_DUE_to_QUARANTINED]
        distinguishing_aspect: "Overdue quarantine fires only when current_date > next_inspection_due_on + 30: at exactly due+30 (2026-08-29) the unit stays INSPECTION_DUE; at due+31 (2026-08-30) it flips to QUARANTINED."
        test_recipe:
          setup:
            - "FALL_PROTECTION item CALC-IQ interval 90, base 12000; policy limit 10/400d; employee; machine ACTIVE; unit vended at 2026-05-01 (next_inspection_due_on 2026-07-30)"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-IQ1", name: "Rigging" }, as: FinanceAnalyst, captures: { cc_iq: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "RIGGER-IQ" }, as: EHSAdministrator, captures: { role_iq: $.data.id } }
            - { call: "POST /items", payload: { sku: "CALC-IQ", name: "Harness", category: "FALL_PROTECTION", base_list_price_cents: 12000, inspection_interval_days: 90 }, as: EHSAdministrator, captures: { item_iq: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_iq}", item_id: "${item_iq}", period_limit_qty: 10, period_window_days: 400 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-IQ1", full_name: "Rigger IQ", job_role_id: "${role_iq}", home_cost_center_id: "${cc_iq}" }, as: EHSAdministrator, captures: { emp_iq: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-IQ1", site_name: "P16", model: "VM-7" }, as: VendingTechnician, captures: { mach_iq: $.data.id, mach_iq_v: $.data.version } }
            - { call: "POST /machines/${mach_iq}/slots", payload: { slot_code: "H1", item_id: "${item_iq}", capacity: 4, par_level: 0, expected_machine_version: "${mach_iq_v}" }, as: VendingTechnician, captures: { slot_iq: $.data.id } }
            - { call: "POST /serialized-units", payload: { item_id: "${item_iq}", serial_number: "SN-IQ-001", slot_id: "${slot_iq}" }, as: EHSAdministrator, captures: { unit_iq: $.data.id } }
            - { call: "PUT /machines/${mach_iq}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_iq}", slot_id: "${slot_iq}", qty: 1, idempotency_key: "iq-1", serialized_unit_id: "${unit_iq}" }, as: Employee, as_user_id: "${emp_iq}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-31T00:00:00Z" }, as: EHSAdministrator }
            - { call: "GET /serialized-units/${unit_iq}", payload: {}, as: Any, captures: { iq_s1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-29T00:00:00Z" }, as: EHSAdministrator }
            - { call: "GET /serialized-units/${unit_iq}", payload: {}, as: Any, captures: { iq_s2: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: EHSAdministrator }
            - { call: "GET /serialized-units/${unit_iq}", payload: {}, as: Any, captures: { iq_s3: $.data.status } }
          assert:
            - "2026-07-31: status == INSPECTION_DUE"
            - "2026-08-29 (due + 30): status == INSPECTION_DUE (grace boundary inclusive)"
            - "2026-08-30 (due + 31): status == QUARANTINED (overdue sweep)"

      - name: restock_par_trigger_exact_threshold
        claim_type: boundary_edge
        grounds: [calculations.restock_par_trigger]
        distinguishing_aspect: "The par trigger fires on <= : slot A at on_hand == par_level (5) spawns an AUTO_PAR order of qty == capacity - on_hand (15); slot B landing at par_level + 1 (5 > 4) spawns nothing."
        test_recipe:
          setup:
            - "GENERAL item CALC-PT base 100; policy limit 10/30d; employee; machine ACTIVE with slot A (cap 20 par 5) stocked 6 and slot B (cap 20 par 4) stocked 6"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-PT1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_pt: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-PT" }, as: EHSAdministrator, captures: { role_pt: $.data.id } }
            - { call: "POST /items", payload: { sku: "CALC-PT", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_pt: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_pt}", item_id: "${item_pt}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-PT1", full_name: "Tech PT", job_role_id: "${role_pt}", home_cost_center_id: "${cc_pt}" }, as: EHSAdministrator, captures: { emp_pt: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-PT1", site_name: "P17", model: "VM-1" }, as: VendingTechnician, captures: { mach_pt: $.data.id, mach_pt_v: $.data.version } }
            - { call: "POST /machines/${mach_pt}/slots", payload: { slot_code: "A1", item_id: "${item_pt}", capacity: 20, par_level: 5, expected_machine_version: "${mach_pt_v}" }, as: VendingTechnician, captures: { slot_pta: $.data.id } }
            - { call: "GET /machines/${mach_pt}", payload: {}, as: Any, captures: { mach_pt_v2: $.data.version } }
            - { call: "POST /machines/${mach_pt}/slots", payload: { slot_code: "B1", item_id: "${item_pt}", capacity: 20, par_level: 4, expected_machine_version: "${mach_pt_v2}" }, as: VendingTechnician, captures: { slot_ptb: $.data.id } }
            - { call: "PUT /machines/${mach_pt}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_pt}", slot_id: "${slot_pta}", qty: 6 }, as: VendingTechnician, captures: { ro_pta: $.data.id } }
            - { call: "POST /restock-orders/${ro_pta}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_pta}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_pt}", slot_id: "${slot_ptb}", qty: 6 }, as: VendingTechnician, captures: { ro_ptb: $.data.id } }
            - { call: "POST /restock-orders/${ro_ptb}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_ptb}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_pt}", slot_id: "${slot_pta}", qty: 1, idempotency_key: "pt-a" }, as: Employee, as_user_id: "${emp_pt}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_pt}", slot_id: "${slot_ptb}", qty: 1, idempotency_key: "pt-b" }, as: Employee, as_user_id: "${emp_pt}" }
            - { call: "GET /restock-orders", payload: { slot_id: "${slot_pta}", status: "SUGGESTED" }, as: Any, captures: { pt_auto_id: "$.data[0].id", pt_auto_qty: "$.data[0].qty", pt_auto_src: "$.data[0].source" } }
            - { call: "GET /restock-orders", payload: { slot_id: "${slot_ptb}", status: "SUGGESTED" }, as: Any }
          assert:
            - "slot A (on_hand 5 == par 5): AUTO_PAR order created with qty == 15 (capacity 20 - on_hand 5), source == AUTO_PAR, status SUGGESTED"
            - "slot B (on_hand 5 > par 4): NO SUGGESTED order exists (empty list)"

      - name: override_consumed_exact_equality_consumes
        claim_type: boundary_edge
        grounds: [state_machines.ManagerOverride.ACTIVE_to_CONSUMED, calculations.effective_limit]
        distinguishing_aspect: "The CONSUMED transition fires exactly at consumed_qty == approved_qty: after the second 1-unit draw the override flips to CONSUMED, and a third draw attempt fails ERR_OVERRIDE_NOT_ACTIVE."
        test_recipe:
          setup:
            - "GENERAL item CALC-OC base 100; policy limit 1/30d; employee at usage 1; manager; ACTIVE override approved 2; machine ACTIVE stocked 10"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-OC1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_oc: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-OC" }, as: EHSAdministrator, captures: { role_oc: $.data.id } }
            - { call: "POST /items", payload: { sku: "CALC-OC", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_oc: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_oc}", item_id: "${item_oc}", period_limit_qty: 1, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-OC1", full_name: "Tech OC", job_role_id: "${role_oc}", home_cost_center_id: "${cc_oc}" }, as: EHSAdministrator, captures: { emp_oc: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-OC1", full_name: "Mgr OC", job_role_id: "${role_oc}", home_cost_center_id: "${cc_oc}", is_manager: true }, as: EHSAdministrator, captures: { mgr_oc: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-OC1", site_name: "P18", model: "VM-1" }, as: VendingTechnician, captures: { mach_oc: $.data.id, mach_oc_v: $.data.version } }
            - { call: "POST /machines/${mach_oc}/slots", payload: { slot_code: "A1", item_id: "${item_oc}", capacity: 20, par_level: 0, expected_machine_version: "${mach_oc_v}" }, as: VendingTechnician, captures: { slot_oc: $.data.id } }
            - { call: "PUT /machines/${mach_oc}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_oc}", slot_id: "${slot_oc}", qty: 10 }, as: VendingTechnician, captures: { ro_oc: $.data.id } }
            - { call: "POST /restock-orders/${ro_oc}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_oc}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_oc}", slot_id: "${slot_oc}", qty: 1, idempotency_key: "oc-0" }, as: Employee, as_user_id: "${emp_oc}" }
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_oc}", item_id: "${item_oc}", approved_qty: 2, valid_from: "2026-05-01", valid_until: "2026-05-31", reason_code: "INCIDENT" }, as: Manager, as_user_id: "${mgr_oc}", captures: { ov_oc: $.data.id } }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_oc}", slot_id: "${slot_oc}", qty: 1, idempotency_key: "oc-1", manager_override_id: "${ov_oc}" }, as: Employee, as_user_id: "${emp_oc}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_oc}", slot_id: "${slot_oc}", qty: 1, idempotency_key: "oc-2", manager_override_id: "${ov_oc}" }, as: Employee, as_user_id: "${emp_oc}" }
            - { call: "GET /manager-overrides/${ov_oc}", payload: {}, as: Any, captures: { oc_status: $.data.status, oc_consumed: $.data.consumed_qty, oc_remaining: $.data.remaining_qty } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_oc}", slot_id: "${slot_oc}", qty: 1, idempotency_key: "oc-3", manager_override_id: "${ov_oc}" }, as: Employee, as_user_id: "${emp_oc}", captures: { oc_err: $.data.error_id } }
          assert:
            - "after two 1-unit draws: consumed_qty == 2 == approved_qty"
            - "ManagerOverride.${ov_oc}.status == CONSUMED (exact-equality transition)"
            - "remaining_qty == 0"
            - "third draw -> ERR_OVERRIDE_NOT_ACTIVE (CONSUMED is terminal)"

      - name: audit_detects_override_consumption_mismatch
        claim_type: correct_result
        grounds: [calculations.audit_exceptions, state_machines.ComplianceAudit.FIELDWORK_to_FINDINGS_FILED]
        distinguishing_aspect: "Override consumption is final at vend and NOT restored by reversal: after one drawn vend is reversed, the override's consumed_qty (1) disagrees with SUM(override_drawn_qty) over POSTED lines (0), so the OVERRIDE_USAGE audit files exactly 1 exception."
        test_recipe:
          setup:
            - "GENERAL item CALC-AM base 100; policy limit 1/30d; employee at usage 1; manager; override approved 2; vend drawn 1 then REVERSED by manager; NO chargeback batch exists for the period"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-AM1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_am: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-AM" }, as: EHSAdministrator, captures: { role_am: $.data.id } }
            - { call: "POST /items", payload: { sku: "CALC-AM", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_am: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_am}", item_id: "${item_am}", period_limit_qty: 1, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-AM1", full_name: "Tech AM", job_role_id: "${role_am}", home_cost_center_id: "${cc_am}" }, as: EHSAdministrator, captures: { emp_am: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-AM1", full_name: "Mgr AM", job_role_id: "${role_am}", home_cost_center_id: "${cc_am}", is_manager: true }, as: EHSAdministrator, captures: { mgr_am: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-AM1", site_name: "P19", model: "VM-1" }, as: VendingTechnician, captures: { mach_am: $.data.id, mach_am_v: $.data.version } }
            - { call: "POST /machines/${mach_am}/slots", payload: { slot_code: "A1", item_id: "${item_am}", capacity: 20, par_level: 0, expected_machine_version: "${mach_am_v}" }, as: VendingTechnician, captures: { slot_am: $.data.id } }
            - { call: "PUT /machines/${mach_am}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_am}", slot_id: "${slot_am}", qty: 10 }, as: VendingTechnician, captures: { ro_am: $.data.id } }
            - { call: "POST /restock-orders/${ro_am}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_am}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_am}", slot_id: "${slot_am}", qty: 1, idempotency_key: "am-0" }, as: Employee, as_user_id: "${emp_am}" }
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_am}", item_id: "${item_am}", approved_qty: 2, valid_from: "2026-05-01", valid_until: "2026-05-31", reason_code: "INCIDENT" }, as: Manager, as_user_id: "${mgr_am}", captures: { ov_am: $.data.id } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_am}", slot_id: "${slot_am}", qty: 1, idempotency_key: "am-1", manager_override_id: "${ov_am}" }, as: Employee, as_user_id: "${emp_am}", captures: { iss_am: $.data.id } }
            - { call: "POST /issuances/${iss_am}/reverse", payload: {}, as: Manager, as_user_id: "${mgr_am}" }
            - { call: "POST /compliance-audits", payload: { scope: "OVERRIDE_USAGE", period_start: "2026-05-01", period_end: "2026-05-31" }, as: ComplianceAuditor, captures: { audit_am: $.data.id } }
            - { call: "POST /compliance-audits/${audit_am}/begin-fieldwork", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "POST /compliance-audits/${audit_am}/file-findings", payload: {}, as: ComplianceAuditor, captures: { am_count: $.data.exceptions_count, am_status: $.data.status } }
          assert:
            - "ComplianceAudit.${audit_am}.exceptions_count == 1 (consumed_qty 1 != POSTED drawn sum 0)"
            - "findings_detail[0].finding_type == OVERRIDE_CONSUMPTION_MISMATCH with entity_id == ${ov_am}"
            - "ComplianceAudit.${audit_am}.status == FINDINGS_FILED"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: create_item_missing_required_sku_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=0]", "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "Request-shape validation runs before existence/business: POST /items without the required sku fails ERR_VALIDATION_FAILED (400), not a later-stage error."
        test_recipe:
          setup: ["A job role exists (ambient fixture)"]
          setup_api_calls:
            - { call: "POST /job-roles", payload: { role_name: "VIEWER-VA" }, as: EHSAdministrator }
          trigger:
            - { call: "POST /items", payload: { name: "No SKU Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { va_err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION_FAILED and HTTP status 400"
            - "no Item row created (GET /items/... list stays empty for sku)"

      - name: vend_with_unknown_machine_id_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_MACHINE_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 3) precedes state/safety/fiscal: a vend naming a non-existent machine fails ERR_MACHINE_NOT_FOUND even though the employee would also fail later checks."
        test_recipe:
          setup: ["Employee fixture exists (cc, role, employee); the vend targets a machine id that was never created"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-VA1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_va: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-VA" }, as: EHSAdministrator, captures: { role_va: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "E-VA1", full_name: "Tech VA", job_role_id: "${role_va}", home_cost_center_id: "${cc_va}" }, as: EHSAdministrator, captures: { emp_va: $.data.id } }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "11111111-2222-4333-8444-555555555555", slot_id: "22222222-3333-4333-8444-666666666666", qty: 1, idempotency_key: "va-1" }, as: Employee, as_user_id: "${emp_va}", captures: { va_err2: $.data.error_id } }
          assert:
            - "error_id == ERR_MACHINE_NOT_FOUND (existence check on machine_id fires first)"
            - "HTTP status 404"

      - name: vend_item_not_entitled
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_ITEM_NOT_ENTITLED]"]
        distinguishing_aspect: "No IssuancePolicy row for (job_role, item) blocks the vend with ERR_ITEM_NOT_ENTITLED even with stock, ACTIVE machine, and fit state all clean."
        test_recipe:
          setup: ["GENERAL item VA-NE stocked 10; employee whose role has NO policy for this item; machine ACTIVE"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-VA2", name: "Ops" }, as: FinanceAnalyst, captures: { cc_vn: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-VN" }, as: EHSAdministrator, captures: { role_vn: $.data.id } }
            - { call: "POST /items", payload: { sku: "VA-NE", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_vn: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "E-VA2", full_name: "Tech VN", job_role_id: "${role_vn}", home_cost_center_id: "${cc_vn}" }, as: EHSAdministrator, captures: { emp_vn: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-VA2", site_name: "P20", model: "VM-1" }, as: VendingTechnician, captures: { mach_vn: $.data.id, mach_vn_v: $.data.version } }
            - { call: "POST /machines/${mach_vn}/slots", payload: { slot_code: "A1", item_id: "${item_vn}", capacity: 20, par_level: 0, expected_machine_version: "${mach_vn_v}" }, as: VendingTechnician, captures: { slot_vn: $.data.id } }
            - { call: "PUT /machines/${mach_vn}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_vn}", slot_id: "${slot_vn}", qty: 10 }, as: VendingTechnician, captures: { ro_vn: $.data.id } }
            - { call: "POST /restock-orders/${ro_vn}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_vn}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_vn}", slot_id: "${slot_vn}", qty: 1, idempotency_key: "vn-1" }, as: Employee, as_user_id: "${emp_vn}", captures: { vn_err: $.data.error_id } }
          assert:
            - "error_id == ERR_ITEM_NOT_ENTITLED (422)"
            - "MachineSlot.${slot_vn}.on_hand_qty == 10 (no decrement on rejection)"

      - name: vend_serialized_qty_must_be_one
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SERIALIZED_QTY_INVALID]"]
        distinguishing_aspect: "FALL_PROTECTION vends are single-unit: qty 2 with a valid serialized_unit_id fails ERR_SERIALIZED_QTY_INVALID before any state change."
        test_recipe:
          setup: ["FALL_PROTECTION item VA-Q2 (interval 90); policy limit 10/30d; employee; machine ACTIVE; two units registered in slot"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-VA3", name: "Rigging" }, as: FinanceAnalyst, captures: { cc_vq: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "RIGGER-VQ" }, as: EHSAdministrator, captures: { role_vq: $.data.id } }
            - { call: "POST /items", payload: { sku: "VA-Q2", name: "Harness", category: "FALL_PROTECTION", base_list_price_cents: 12000, inspection_interval_days: 90 }, as: EHSAdministrator, captures: { item_vq: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_vq}", item_id: "${item_vq}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-VA3", full_name: "Rigger VQ", job_role_id: "${role_vq}", home_cost_center_id: "${cc_vq}" }, as: EHSAdministrator, captures: { emp_vq: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-VA3", site_name: "P21", model: "VM-7" }, as: VendingTechnician, captures: { mach_vq: $.data.id, mach_vq_v: $.data.version } }
            - { call: "POST /machines/${mach_vq}/slots", payload: { slot_code: "H1", item_id: "${item_vq}", capacity: 4, par_level: 0, expected_machine_version: "${mach_vq_v}" }, as: VendingTechnician, captures: { slot_vq: $.data.id } }
            - { call: "POST /serialized-units", payload: { item_id: "${item_vq}", serial_number: "SN-VQ-001", slot_id: "${slot_vq}" }, as: EHSAdministrator, captures: { unit_vq: $.data.id } }
            - { call: "PUT /machines/${mach_vq}", payload: { status: "ACTIVE" }, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_vq}", slot_id: "${slot_vq}", qty: 2, idempotency_key: "vq-1", serialized_unit_id: "${unit_vq}" }, as: Employee, as_user_id: "${emp_vq}", captures: { vq_err: $.data.error_id } }
          assert:
            - "error_id == ERR_SERIALIZED_QTY_INVALID (422)"
            - "SerializedUnit.${unit_vq}.status == IN_STOCK (unchanged)"
            - "MachineSlot.${slot_vq}.on_hand_qty == 1 (unchanged)"

      - name: vend_fall_protection_requires_unit
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SERIALIZED_UNIT_REQUIRED]"]
        distinguishing_aspect: "A FALL_PROTECTION vend without serialized_unit_id fails ERR_SERIALIZED_UNIT_REQUIRED; conversely a GENERAL vend that passes serialized_unit_id fails the same error family."
        test_recipe:
          setup: ["FALL_PROTECTION item VA-RU with a stocked unit; GENERAL item VA-RG stocked 5; policies for both; employee; machine ACTIVE with two slots"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-VA4", name: "Rigging" }, as: FinanceAnalyst, captures: { cc_vr: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "RIGGER-VR" }, as: EHSAdministrator, captures: { role_vr: $.data.id } }
            - { call: "POST /items", payload: { sku: "VA-RU", name: "Harness", category: "FALL_PROTECTION", base_list_price_cents: 12000, inspection_interval_days: 90 }, as: EHSAdministrator, captures: { item_vr: $.data.id } }
            - { call: "POST /items", payload: { sku: "VA-RG", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_vg: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_vr}", item_id: "${item_vr}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_vr}", item_id: "${item_vg}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-VA4", full_name: "Rigger VR", job_role_id: "${role_vr}", home_cost_center_id: "${cc_vr}" }, as: EHSAdministrator, captures: { emp_vr: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-VA4", site_name: "P22", model: "VM-7" }, as: VendingTechnician, captures: { mach_vr: $.data.id, mach_vr_v: $.data.version } }
            - { call: "POST /machines/${mach_vr}/slots", payload: { slot_code: "H1", item_id: "${item_vr}", capacity: 4, par_level: 0, expected_machine_version: "${mach_vr_v}" }, as: VendingTechnician, captures: { slot_vr: $.data.id } }
            - { call: "POST /serialized-units", payload: { item_id: "${item_vr}", serial_number: "SN-VR-001", slot_id: "${slot_vr}" }, as: EHSAdministrator, captures: { unit_vr: $.data.id } }
            - { call: "GET /machines/${mach_vr}", payload: {}, as: Any, captures: { mach_vr_v2: $.data.version } }
            - { call: "POST /machines/${mach_vr}/slots", payload: { slot_code: "G1", item_id: "${item_vg}", capacity: 10, par_level: 0, expected_machine_version: "${mach_vr_v2}" }, as: VendingTechnician, captures: { slot_vg: $.data.id } }
            - { call: "PUT /machines/${mach_vr}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_vr}", slot_id: "${slot_vg}", qty: 5 }, as: VendingTechnician, captures: { ro_vg: $.data.id } }
            - { call: "POST /restock-orders/${ro_vg}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_vg}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_vr}", slot_id: "${slot_vr}", qty: 1, idempotency_key: "vr-1" }, as: Employee, as_user_id: "${emp_vr}", captures: { vr_err1: $.data.error_id } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_vr}", slot_id: "${slot_vg}", qty: 1, idempotency_key: "vr-2", serialized_unit_id: "${unit_vr}" }, as: Employee, as_user_id: "${emp_vr}", captures: { vr_err2: $.data.error_id } }
          assert:
            - "FALL_PROTECTION vend without serialized_unit_id -> ERR_SERIALIZED_UNIT_REQUIRED"
            - "GENERAL vend WITH serialized_unit_id -> ERR_SERIALIZED_UNIT_REQUIRED (unit forbidden for non-serialized items)"

      - name: vend_blocked_while_holding_lapsed_unit
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_REGULATED_ITEM_INSPECTION_DUE]"]
        distinguishing_aspect: "Regulated-item gate: an employee holding a unit of the same item in INSPECTION_DUE cannot vend a replacement until the held unit is inspected; a PASS inspection unblocks the identical vend."
        test_recipe:
          setup:
            - "FALL_PROTECTION item VA-LP (interval 90); policy limit 10/400d; employee; machine ACTIVE; units U1 and U2 in slot"
            - "U1 vended at 2026-05-01 (due 2026-07-30); clock advanced to 2026-07-31 so U1 is INSPECTION_DUE"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-VA5", name: "Rigging" }, as: FinanceAnalyst, captures: { cc_vl: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "RIGGER-VL" }, as: EHSAdministrator, captures: { role_vl: $.data.id } }
            - { call: "POST /items", payload: { sku: "VA-LP", name: "Harness", category: "FALL_PROTECTION", base_list_price_cents: 12000, inspection_interval_days: 90 }, as: EHSAdministrator, captures: { item_vl: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_vl}", item_id: "${item_vl}", period_limit_qty: 10, period_window_days: 400 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-VA5", full_name: "Rigger VL", job_role_id: "${role_vl}", home_cost_center_id: "${cc_vl}" }, as: EHSAdministrator, captures: { emp_vl: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-VA5", site_name: "P23", model: "VM-7" }, as: VendingTechnician, captures: { mach_vl: $.data.id, mach_vl_v: $.data.version } }
            - { call: "POST /machines/${mach_vl}/slots", payload: { slot_code: "H1", item_id: "${item_vl}", capacity: 4, par_level: 0, expected_machine_version: "${mach_vl_v}" }, as: VendingTechnician, captures: { slot_vl: $.data.id } }
            - { call: "POST /serialized-units", payload: { item_id: "${item_vl}", serial_number: "SN-VL-001", slot_id: "${slot_vl}" }, as: EHSAdministrator, captures: { unit_vl1: $.data.id } }
            - { call: "POST /serialized-units", payload: { item_id: "${item_vl}", serial_number: "SN-VL-002", slot_id: "${slot_vl}" }, as: EHSAdministrator, captures: { unit_vl2: $.data.id } }
            - { call: "PUT /machines/${mach_vl}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_vl}", slot_id: "${slot_vl}", qty: 1, idempotency_key: "vl-1", serialized_unit_id: "${unit_vl1}" }, as: Employee, as_user_id: "${emp_vl}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-31T00:00:00Z" }, as: EHSAdministrator }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_vl}", slot_id: "${slot_vl}", qty: 1, idempotency_key: "vl-2", serialized_unit_id: "${unit_vl2}" }, as: Employee, as_user_id: "${emp_vl}", captures: { vl_err: $.data.error_id } }
            - { call: "POST /serialized-units/${unit_vl1}/inspect", payload: { result: "PASS", inspected_on: "2026-08-01" }, as: SafetyOfficer }
            - { call: "POST /issuances", payload: { machine_id: "${mach_vl}", slot_id: "${slot_vl}", qty: 1, idempotency_key: "vl-3", serialized_unit_id: "${unit_vl2}" }, as: Employee, as_user_id: "${emp_vl}", captures: { vl_ok: $.data.id } }
          assert:
            - "while holding INSPECTION_DUE unit U1: vend of U2 -> ERR_REGULATED_ITEM_INSPECTION_DUE"
            - "after U1 PASS inspection: identical vend of U2 succeeds (201)"
            - "SerializedUnit.${unit_vl2}.issued_to_employee_id == ${emp_vl}"

      - name: vend_with_expired_override_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_OVERRIDE_NOT_ACTIVE]", calculations.override_expiry_sweep]
        distinguishing_aspect: "An override whose valid_until (2026-05-10) passed is swept to EXPIRED; referencing it on a beyond-limit vend fails ERR_OVERRIDE_NOT_ACTIVE, and the vend cannot proceed on the base limit either."
        test_recipe:
          setup:
            - "GENERAL item VA-EO base 100; policy limit 1/400d; employee at usage 1; manager; override approved 2 valid 2026-05-01..2026-05-10; machine ACTIVE stocked 10; clock at 2026-05-11 (override swept EXPIRED)"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-VA6", name: "Ops" }, as: FinanceAnalyst, captures: { cc_ve: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-VE" }, as: EHSAdministrator, captures: { role_ve: $.data.id } }
            - { call: "POST /items", payload: { sku: "VA-EO", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_ve: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_ve}", item_id: "${item_ve}", period_limit_qty: 1, period_window_days: 400 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-VA6", full_name: "Tech VE", job_role_id: "${role_ve}", home_cost_center_id: "${cc_ve}" }, as: EHSAdministrator, captures: { emp_ve: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-VA6", full_name: "Mgr VE", job_role_id: "${role_ve}", home_cost_center_id: "${cc_ve}", is_manager: true }, as: EHSAdministrator, captures: { mgr_ve: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-VA6", site_name: "P24", model: "VM-1" }, as: VendingTechnician, captures: { mach_ve: $.data.id, mach_ve_v: $.data.version } }
            - { call: "POST /machines/${mach_ve}/slots", payload: { slot_code: "A1", item_id: "${item_ve}", capacity: 20, par_level: 0, expected_machine_version: "${mach_ve_v}" }, as: VendingTechnician, captures: { slot_ve: $.data.id } }
            - { call: "PUT /machines/${mach_ve}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_ve}", slot_id: "${slot_ve}", qty: 10 }, as: VendingTechnician, captures: { ro_ve: $.data.id } }
            - { call: "POST /restock-orders/${ro_ve}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_ve}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_ve}", slot_id: "${slot_ve}", qty: 1, idempotency_key: "ve-0" }, as: Employee, as_user_id: "${emp_ve}" }
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_ve}", item_id: "${item_ve}", approved_qty: 2, valid_from: "2026-05-01", valid_until: "2026-05-10", reason_code: "PROJECT" }, as: Manager, as_user_id: "${mgr_ve}", captures: { ov_ve: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: EHSAdministrator }
          trigger:
            - { call: "GET /manager-overrides/${ov_ve}", payload: {}, as: Any, captures: { ve_ov_status: $.data.status } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_ve}", slot_id: "${slot_ve}", qty: 1, idempotency_key: "ve-1", manager_override_id: "${ov_ve}" }, as: Employee, as_user_id: "${emp_ve}", captures: { ve_err: $.data.error_id } }
          assert:
            - "ManagerOverride.${ov_ve}.status == EXPIRED (clock sweep, current_date > valid_until)"
            - "vend with expired override -> ERR_OVERRIDE_NOT_ACTIVE"
            - "MachineSlot.${slot_ve}.on_hand_qty == 9 (only the first vend decremented)"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: issuance_idempotent_replay_same_result
        claim_type: idempotency
        grounds:
          - validations[priority=3.7]
          - entities.IssuanceTransaction.fields.idempotency_key
        distinguishing_aspect: "Same idempotency_key with an identical payload returns the ORIGINAL transaction (same id) and decrements on_hand exactly once."
        test_recipe:
          setup: ["GENERAL item EP-ID base 100; policy limit 10/30d; employee; machine ACTIVE stocked 10"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-EP1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_ei: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-EI" }, as: EHSAdministrator, captures: { role_ei: $.data.id } }
            - { call: "POST /items", payload: { sku: "EP-ID", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_ei: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_ei}", item_id: "${item_ei}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-EP1", full_name: "Tech EI", job_role_id: "${role_ei}", home_cost_center_id: "${cc_ei}" }, as: EHSAdministrator, captures: { emp_ei: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-EP1", site_name: "P25", model: "VM-1" }, as: VendingTechnician, captures: { mach_ei: $.data.id, mach_ei_v: $.data.version } }
            - { call: "POST /machines/${mach_ei}/slots", payload: { slot_code: "A1", item_id: "${item_ei}", capacity: 20, par_level: 0, expected_machine_version: "${mach_ei_v}" }, as: VendingTechnician, captures: { slot_ei: $.data.id } }
            - { call: "PUT /machines/${mach_ei}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_ei}", slot_id: "${slot_ei}", qty: 10 }, as: VendingTechnician, captures: { ro_ei: $.data.id } }
            - { call: "POST /restock-orders/${ro_ei}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_ei}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_ei}", slot_id: "${slot_ei}", qty: 2, idempotency_key: "ei-same" }, as: Employee, as_user_id: "${emp_ei}", captures: { ei_id1: $.data.id } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_ei}", slot_id: "${slot_ei}", qty: 2, idempotency_key: "ei-same" }, as: Employee, as_user_id: "${emp_ei}", captures: { ei_id2: $.data.id } }
            - { call: "GET /slots/${slot_ei}", payload: {}, as: Any, captures: { ei_onhand: $.data.on_hand_qty } }
          assert:
            - "second response id == first response id (replay, not a new transaction)"
            - "MachineSlot.${slot_ei}.on_hand_qty == 8 (decremented exactly once)"
            - "GET /issuances?idempotency... shows exactly 1 row for key ei-same"

      - name: idempotency_key_reuse_with_different_payload_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=3.7]
          - errors[ERR_IDEMPOTENCY_CONFLICT]
        distinguishing_aspect: "Same idempotency_key but a DIFFERENT qty fails ERR_IDEMPOTENCY_CONFLICT (409) — the key pins the original payload."
        test_recipe:
          setup: ["GENERAL item EP-IC base 100; policy limit 10/30d; employee; machine ACTIVE stocked 10"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-EP2", name: "Ops" }, as: FinanceAnalyst, captures: { cc_ec: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-EC" }, as: EHSAdministrator, captures: { role_ec: $.data.id } }
            - { call: "POST /items", payload: { sku: "EP-IC", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_ec: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_ec}", item_id: "${item_ec}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-EP2", full_name: "Tech EC", job_role_id: "${role_ec}", home_cost_center_id: "${cc_ec}" }, as: EHSAdministrator, captures: { emp_ec: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-EP2", site_name: "P26", model: "VM-1" }, as: VendingTechnician, captures: { mach_ec: $.data.id, mach_ec_v: $.data.version } }
            - { call: "POST /machines/${mach_ec}/slots", payload: { slot_code: "A1", item_id: "${item_ec}", capacity: 20, par_level: 0, expected_machine_version: "${mach_ec_v}" }, as: VendingTechnician, captures: { slot_ec: $.data.id } }
            - { call: "PUT /machines/${mach_ec}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_ec}", slot_id: "${slot_ec}", qty: 10 }, as: VendingTechnician, captures: { ro_ec: $.data.id } }
            - { call: "POST /restock-orders/${ro_ec}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_ec}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_ec}", slot_id: "${slot_ec}", qty: 2, idempotency_key: "ec-key" }, as: Employee, as_user_id: "${emp_ec}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_ec}", slot_id: "${slot_ec}", qty: 3, idempotency_key: "ec-key" }, as: Employee, as_user_id: "${emp_ec}", captures: { ec_err: $.data.error_id } }
          assert:
            - "error_id == ERR_IDEMPOTENCY_CONFLICT (409)"
            - "MachineSlot.${slot_ec}.on_hand_qty == 8 (only the first request applied)"

      - name: consumption_report_aggregates_posted_only
        claim_type: computed_read
        grounds:
          - endpoints.GET /reports/consumption
          - entities.IssuanceTransaction.fields.status
        distinguishing_aspect: "The consumption report counts only POSTED lines in [period_start, period_end): after vends 3 and 2 and reversing the 2, it reports line_count 1, total_qty 3, total_amount_cents 1350 (base price 450, no contract rows)."
        test_recipe:
          setup: ["Cost center CC-EP3; GENERAL item EP-RP base 450; policy limit 10/30d; employee + manager; machine ACTIVE stocked 10; vends qty 3 and qty 2, the qty-2 line reversed"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-EP3", name: "Ops" }, as: FinanceAnalyst, captures: { cc_rp: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-RP" }, as: EHSAdministrator, captures: { role_rp: $.data.id } }
            - { call: "POST /items", payload: { sku: "EP-RP", name: "Gloves", category: "GENERAL", base_list_price_cents: 450 }, as: EHSAdministrator, captures: { item_rp: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_rp}", item_id: "${item_rp}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-EP3", full_name: "Tech RP", job_role_id: "${role_rp}", home_cost_center_id: "${cc_rp}" }, as: EHSAdministrator, captures: { emp_rp: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-EP3", full_name: "Mgr RP", job_role_id: "${role_rp}", home_cost_center_id: "${cc_rp}", is_manager: true }, as: EHSAdministrator, captures: { mgr_rp: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-EP3", site_name: "P27", model: "VM-1" }, as: VendingTechnician, captures: { mach_rp: $.data.id, mach_rp_v: $.data.version } }
            - { call: "POST /machines/${mach_rp}/slots", payload: { slot_code: "A1", item_id: "${item_rp}", capacity: 20, par_level: 0, expected_machine_version: "${mach_rp_v}" }, as: VendingTechnician, captures: { slot_rp: $.data.id } }
            - { call: "PUT /machines/${mach_rp}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_rp}", slot_id: "${slot_rp}", qty: 10 }, as: VendingTechnician, captures: { ro_rp: $.data.id } }
            - { call: "POST /restock-orders/${ro_rp}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_rp}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_rp}", slot_id: "${slot_rp}", qty: 3, idempotency_key: "rp-1" }, as: Employee, as_user_id: "${emp_rp}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_rp}", slot_id: "${slot_rp}", qty: 2, idempotency_key: "rp-2" }, as: Employee, as_user_id: "${emp_rp}", captures: { iss_rp2: $.data.id } }
            - { call: "POST /issuances/${iss_rp2}/reverse", payload: {}, as: Manager, as_user_id: "${mgr_rp}" }
          trigger:
            - { call: "GET /reports/consumption", payload: { cost_center_id: "${cc_rp}", period_start: "2026-05-01", period_end: "2026-06-01" }, as: Any, captures: { rp_lines: $.data.line_count, rp_qty: $.data.total_qty, rp_amt: $.data.total_amount_cents } }
          assert:
            - "report line_count == 1 (reversed line excluded)"
            - "report total_qty == 3"
            - "report total_amount_cents == 1350 (3 x 450)"
            - "report cost_center_id echoes ${cc_rp}; window [2026-05-01, 2026-06-01) is half-open"

      - name: list_endpoints_filter_and_paginate
        claim_type: listing
        grounds:
          - endpoints.GET /issuances
          - response_envelope.pagination_fields
        distinguishing_aspect: "employee_id filter narrows the list to that employee's rows; limit=1 returns has_more == true with total_count reflecting the full filtered set."
        test_recipe:
          setup: ["Two employees in same cost center; employee A has 2 vends, employee B has 1 vend; GENERAL item EP-LP base 100, policy limit 10/30d; machine ACTIVE stocked 10"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-EP4", name: "Ops" }, as: FinanceAnalyst, captures: { cc_lp: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-LP" }, as: EHSAdministrator, captures: { role_lp: $.data.id } }
            - { call: "POST /items", payload: { sku: "EP-LP", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_lp: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_lp}", item_id: "${item_lp}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-EP4A", full_name: "Tech LA", job_role_id: "${role_lp}", home_cost_center_id: "${cc_lp}" }, as: EHSAdministrator, captures: { emp_lpa: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "E-EP4B", full_name: "Tech LB", job_role_id: "${role_lp}", home_cost_center_id: "${cc_lp}" }, as: EHSAdministrator, captures: { emp_lpb: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-EP4", site_name: "P28", model: "VM-1" }, as: VendingTechnician, captures: { mach_lp: $.data.id, mach_lp_v: $.data.version } }
            - { call: "POST /machines/${mach_lp}/slots", payload: { slot_code: "A1", item_id: "${item_lp}", capacity: 20, par_level: 0, expected_machine_version: "${mach_lp_v}" }, as: VendingTechnician, captures: { slot_lp: $.data.id } }
            - { call: "PUT /machines/${mach_lp}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_lp}", slot_id: "${slot_lp}", qty: 10 }, as: VendingTechnician, captures: { ro_lp: $.data.id } }
            - { call: "POST /restock-orders/${ro_lp}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_lp}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lp}", slot_id: "${slot_lp}", qty: 1, idempotency_key: "lp-a1" }, as: Employee, as_user_id: "${emp_lpa}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lp}", slot_id: "${slot_lp}", qty: 1, idempotency_key: "lp-a2" }, as: Employee, as_user_id: "${emp_lpa}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lp}", slot_id: "${slot_lp}", qty: 1, idempotency_key: "lp-b1" }, as: Employee, as_user_id: "${emp_lpb}" }
          trigger:
            - { call: "GET /issuances", payload: { employee_id: "${emp_lpa}", limit: 1, offset: 0 }, as: Any, captures: { lp_first: "$.data[0].employee_id" } }
            - { call: "GET /issuances", payload: { employee_id: "${emp_lpa}" }, as: Any }
          assert:
            - "filtered list for employee A contains only rows with employee_id == ${emp_lpa}"
            - "with limit=1: response has_more == true and total_count == 2"
            - "unfiltered-by-page list for employee A returns 2 rows; employee B's vend never appears in A's filter"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_machine_not_active_on_vend
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MACHINE_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: vend_blocked_when_machine_offline
          rationale: "Asserted as the failure path of the named §1.8 cross_entity_state_dependency instance."

      - name: error_fit_test_required_on_vend
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FIT_TEST_REQUIRED]
        excluded_because:
          difficulty_instance: vend_fit_test_missing_beats_limit_exceeded
          rationale: "Asserted as the winning error of the named §1.8 priority-pair instance; expiry-side trigger asserted by fit_test_expiry_boundary."

      - name: error_issuance_limit_exceeded_on_vend
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ISSUANCE_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: usage_limit_exact_boundary
          rationale: "Asserted at the exact usage boundary in the named §1.8 instance."

      - name: error_batch_period_overlap_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_BATCH_PERIOD_OVERLAP]
        distinguishing_aspect: "Half-open batch windows per cost center: [2026-05-01, 2026-06-01) then [2026-06-01, 2026-07-01) is ACCEPTED (adjacency), while [2026-05-15, 2026-06-15) is REJECTED with ERR_BATCH_PERIOD_OVERLAP."
        test_recipe:
          setup: ["Cost center CC-ER1; one OPEN batch [2026-05-01, 2026-06-01)"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-ER1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_eb: $.data.id } }
            - { call: "POST /chargeback-batches", payload: { cost_center_id: "${cc_eb}", period_start: "2026-05-01", period_end: "2026-06-01" }, as: FinanceAnalyst, captures: { batch_eb1: $.data.id } }
          trigger:
            - { call: "POST /chargeback-batches", payload: { cost_center_id: "${cc_eb}", period_start: "2026-05-15", period_end: "2026-06-15" }, as: FinanceAnalyst, captures: { eb_err: $.data.error_id } }
            - { call: "POST /chargeback-batches", payload: { cost_center_id: "${cc_eb}", period_start: "2026-06-01", period_end: "2026-07-01" }, as: FinanceAnalyst, captures: { batch_eb2: $.data.id } }
          assert:
            - "overlapping window -> ERR_BATCH_PERIOD_OVERLAP (409)"
            - "adjacent window (start == prior end) ACCEPTED: second batch created with status OPEN"

      - name: error_empty_chargeback_close_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_EMPTY_CHARGEBACK_BATCH]
        distinguishing_aspect: "Closing a batch whose sweep set is empty and adjustment_cents == 0 fails ERR_EMPTY_CHARGEBACK_BATCH — zero-line close is not a legal epoch advance."
        test_recipe:
          setup: ["Cost center CC-ER2; OPEN batch with no vends in period"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-ER2", name: "Ops" }, as: FinanceAnalyst, captures: { cc_ee: $.data.id } }
            - { call: "POST /chargeback-batches", payload: { cost_center_id: "${cc_ee}", period_start: "2026-05-01", period_end: "2026-06-01" }, as: FinanceAnalyst, captures: { batch_ee: $.data.id } }
          trigger:
            - { call: "POST /chargeback-batches/${batch_ee}/close", payload: {}, as: FinanceAnalyst, captures: { ee_err: $.data.error_id } }
          assert:
            - "error_id == ERR_EMPTY_CHARGEBACK_BATCH (422)"
            - "ChargebackBatch.${batch_ee}.status == OPEN (unchanged)"

      - name: error_duplicate_employee_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE_EMPLOYEE_CODE]
        distinguishing_aspect: "employee_code uniqueness is global: second create with the same code fails ERR_DUPLICATE_EMPLOYEE_CODE."
        test_recipe:
          setup: ["Cost center, role, and one employee with code E-DUP"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-ER3", name: "Ops" }, as: FinanceAnalyst, captures: { cc_ed: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-ED" }, as: EHSAdministrator, captures: { role_ed: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "E-DUP", full_name: "First", job_role_id: "${role_ed}", home_cost_center_id: "${cc_ed}" }, as: EHSAdministrator }
          trigger:
            - { call: "POST /employees", payload: { employee_code: "E-DUP", full_name: "Second", job_role_id: "${role_ed}", home_cost_center_id: "${cc_ed}" }, as: EHSAdministrator, captures: { ed_err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_EMPLOYEE_CODE (409)"

      - name: error_service_start_before_window_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_SERVICE_WINDOW_NOT_REACHED]
        distinguishing_aspect: "Starting a ticket before window_start fails ERR_SERVICE_WINDOW_NOT_REACHED; the ticket stays OPEN and the machine state is untouched."
        test_recipe:
          setup: ["Machine ACTIVE; ticket window [2026-05-10T08:00:00Z, 2026-05-10T12:00:00Z); logical clock at default 2026-05-01"]
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "ER-SW", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_es: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-ER4", site_name: "P29", model: "VM-1" }, as: VendingTechnician, captures: { mach_es: $.data.id, mach_es_v: $.data.version } }
            - { call: "POST /machines/${mach_es}/slots", payload: { slot_code: "A1", item_id: "${item_es}", capacity: 10, par_level: 0, expected_machine_version: "${mach_es_v}" }, as: VendingTechnician }
            - { call: "PUT /machines/${mach_es}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /service-tickets", payload: { machine_id: "${mach_es}", issue_code: "PREVENTIVE", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: VendingTechnician, captures: { tkt_es: $.data.id } }
          trigger:
            - { call: "POST /service-tickets/${tkt_es}/start", payload: {}, as: VendingTechnician, captures: { es_err: $.data.error_id } }
          assert:
            - "error_id == ERR_SERVICE_WINDOW_NOT_REACHED (409)"
            - "ServiceTicket.${tkt_es}.status == OPEN"
            - "VendingMachine.${mach_es}.status == ACTIVE"

      - name: error_contract_price_window_conflict_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_CONTRACT_PRICE_WINDOW_CONFLICT]
        distinguishing_aspect: "ContractPrice windows are CLOSED intervals: a second row whose effective_from equals the first row's effective_to (2026-06-30) intersects at that date and is rejected; effective_from one day later (2026-07-01) is accepted."
        test_recipe:
          setup: ["Item ER-CP; existing price row [2026-01-01, 2026-06-30]"]
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "ER-CP", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_ep: $.data.id } }
            - { call: "POST /contract-prices", payload: { item_id: "${item_ep}", min_period_qty: 0, unit_price_cents: 90, effective_from: "2026-01-01", effective_to: "2026-06-30" }, as: EHSAdministrator }
          trigger:
            - { call: "POST /contract-prices", payload: { item_id: "${item_ep}", min_period_qty: 0, unit_price_cents: 95, effective_from: "2026-06-30", effective_to: "2026-12-31" }, as: EHSAdministrator, captures: { ep_err: $.data.error_id } }
            - { call: "POST /contract-prices", payload: { item_id: "${item_ep}", min_period_qty: 0, unit_price_cents: 95, effective_from: "2026-07-01", effective_to: "2026-12-31" }, as: EHSAdministrator, captures: { ep_ok: $.data.id } }
          assert:
            - "effective_from == prior effective_to (shared date 2026-06-30) -> ERR_CONTRACT_PRICE_WINDOW_CONFLICT (closed-interval intersection)"
            - "effective_from == prior effective_to + 1 day ACCEPTED"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_employee_cannot_create_item
        claim_type: rbac_deny
        grounds:
          - validations[priority=2]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - roles.EHSAdministrator
        distinguishing_aspect: "Employee role calling POST /items (EHSAdministrator-exclusive) is denied ERR_INSUFFICIENT_PERMISSIONS (403) before any body validation of consequence."
        test_recipe:
          setup: ["An employee exists so the entity-backed Employee role resolves to a real identity"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-RB1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_rb1: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "RBAC-R1" }, as: EHSAdministrator, captures: { role_rb1: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "E-RB1", full_name: "Tech RB1", job_role_id: "${role_rb1}", home_cost_center_id: "${cc_rb1}" }, as: EHSAdministrator, captures: { emp_rb1: $.data.id } }
          trigger:
            - { call: "POST /items", payload: { sku: "RBAC-X", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: Employee, as_user_id: "${emp_rb1}", captures: { rb_err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS and HTTP status 403"

      - name: rbac_manager_without_flag_cannot_grant_override
        claim_type: rbac_deny
        grounds:
          - validations[priority=2]
          - entities.Employee.fields.is_manager
        distinguishing_aspect: "The Manager role is entity-backed: X-User-ID resolves to an Employee with is_manager == false -> ERR_INSUFFICIENT_PERMISSIONS even though the role name is Manager."
        test_recipe:
          setup: ["Employee non-mgr (is_manager false), target employee, item"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-RB2", name: "Ops" }, as: FinanceAnalyst, captures: { cc_rb: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-RB" }, as: EHSAdministrator, captures: { role_rb: $.data.id } }
            - { call: "POST /items", payload: { sku: "RBAC-M", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_rb: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "E-RB2", full_name: "Tech RB", job_role_id: "${role_rb}", home_cost_center_id: "${cc_rb}" }, as: EHSAdministrator, captures: { emp_rb: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "F-RB2", full_name: "Fake Mgr", job_role_id: "${role_rb}", home_cost_center_id: "${cc_rb}", is_manager: false }, as: EHSAdministrator, captures: { fakemgr_rb: $.data.id } }
          trigger:
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_rb}", item_id: "${item_rb}", approved_qty: 2, valid_from: "2026-05-01", valid_until: "2026-05-31", reason_code: "OTHER" }, as: Manager, as_user_id: "${fakemgr_rb}", captures: { rb_err2: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (is_manager gate)"
            - "GET /manager-overrides?employee_id=${emp_rb} returns zero rows"

      - name: rbac_auditor_cannot_create_machines
        claim_type: rbac_deny
        grounds:
          - validations[priority=2]
          - roles.ComplianceAuditor
        distinguishing_aspect: "ComplianceAuditor is read-only outside its own audit lifecycle: POST /machines is denied ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["Ambient job role exists"]
          setup_api_calls:
            - { call: "POST /job-roles", payload: { role_name: "RBAC-R3" }, as: EHSAdministrator }
          trigger:
            - { call: "POST /machines", payload: { location_code: "LOC-RB3", site_name: "P30", model: "VM-1" }, as: ComplianceAuditor, captures: { rb_err3: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: segregation_self_override_forbidden
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=16]
          - errors[ERR_SELF_OVERRIDE_FORBIDDEN]
        distinguishing_aspect: "A manager (entity-backed Employee) cannot grant an override to their OWN employee id: ERR_SELF_OVERRIDE_FORBIDDEN (403) even with correct role and valid payload."
        test_recipe:
          setup: ["Employee-with-manager-flag mgr_self; item"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-RB4", name: "Ops" }, as: FinanceAnalyst, captures: { cc_rs: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "LEAD-RS" }, as: EHSAdministrator, captures: { role_rs: $.data.id } }
            - { call: "POST /items", payload: { sku: "RBAC-S", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_rs: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-RB4", full_name: "Self Mgr", job_role_id: "${role_rs}", home_cost_center_id: "${cc_rs}", is_manager: true }, as: EHSAdministrator, captures: { mgr_rs: $.data.id } }
          trigger:
            - { call: "POST /manager-overrides", payload: { employee_id: "${mgr_rs}", item_id: "${item_rs}", approved_qty: 2, valid_from: "2026-05-01", valid_until: "2026-05-31", reason_code: "OTHER" }, as: Manager, as_user_id: "${mgr_rs}", captures: { rs_err: $.data.error_id } }
          assert:
            - "error_id == ERR_SELF_OVERRIDE_FORBIDDEN (403) — grantor id == grantee employee_id"
            - "no ManagerOverride row created for ${mgr_rs}"

      - name: segregation_self_reversal_forbidden
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=16]
          - errors[ERR_SELF_REVERSAL_FORBIDDEN]
        distinguishing_aspect: "A manager who vended as an Employee cannot reverse their OWN vend: ERR_SELF_REVERSAL_FORBIDDEN; a DIFFERENT manager reverses it successfully."
        test_recipe:
          setup: ["GENERAL item RBAC-R (limit 10/30d); employee-manager mgrA vends (as Employee); second manager mgrB; machine ACTIVE stocked 5"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-RB5", name: "Ops" }, as: FinanceAnalyst, captures: { cc_rr: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "LEAD-RR" }, as: EHSAdministrator, captures: { role_rr: $.data.id } }
            - { call: "POST /items", payload: { sku: "RBAC-R", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_rr: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_rr}", item_id: "${item_rr}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "M-RB5A", full_name: "Mgr A", job_role_id: "${role_rr}", home_cost_center_id: "${cc_rr}", is_manager: true }, as: EHSAdministrator, captures: { mgr_rr_a: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-RB5B", full_name: "Mgr B", job_role_id: "${role_rr}", home_cost_center_id: "${cc_rr}", is_manager: true }, as: EHSAdministrator, captures: { mgr_rr_b: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-RB5", site_name: "P31", model: "VM-1" }, as: VendingTechnician, captures: { mach_rr: $.data.id, mach_rr_v: $.data.version } }
            - { call: "POST /machines/${mach_rr}/slots", payload: { slot_code: "A1", item_id: "${item_rr}", capacity: 20, par_level: 0, expected_machine_version: "${mach_rr_v}" }, as: VendingTechnician, captures: { slot_rr: $.data.id } }
            - { call: "PUT /machines/${mach_rr}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_rr}", slot_id: "${slot_rr}", qty: 5 }, as: VendingTechnician, captures: { ro_rr: $.data.id } }
            - { call: "POST /restock-orders/${ro_rr}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_rr}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_rr}", slot_id: "${slot_rr}", qty: 1, idempotency_key: "rr-1" }, as: Employee, as_user_id: "${mgr_rr_a}", captures: { iss_rr: $.data.id } }
          trigger:
            - { call: "POST /issuances/${iss_rr}/reverse", payload: {}, as: Manager, as_user_id: "${mgr_rr_a}", captures: { rr_err: $.data.error_id } }
            - { call: "POST /issuances/${iss_rr}/reverse", payload: {}, as: Manager, as_user_id: "${mgr_rr_b}", captures: { rr_status: $.data.status } }
          assert:
            - "self-reversal (mgrA reversing own vend) -> ERR_SELF_REVERSAL_FORBIDDEN (403)"
            - "reversal by different manager mgrB succeeds: status REVERSED"

      - name: safety_officer_fit_test_write_scope
        claim_type: rbac_deny
        grounds:
          - roles.SafetyOfficer
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "SafetyOfficer may POST fit-tests (201) but an Employee may not (ERR_INSUFFICIENT_PERMISSIONS) — write scope is role-exclusive even on a sub-resource of Employee."
        test_recipe:
          setup: ["RESPIRATOR item RBAC-F; employee"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-RB6", name: "Ops" }, as: FinanceAnalyst, captures: { cc_rf: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "PAINTER-RF" }, as: EHSAdministrator, captures: { role_rf: $.data.id } }
            - { call: "POST /items", payload: { sku: "RBAC-F", name: "Half Mask", category: "RESPIRATOR", base_list_price_cents: 900 }, as: EHSAdministrator, captures: { item_rf: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "E-RB6", full_name: "Painter RF", job_role_id: "${role_rf}", home_cost_center_id: "${cc_rf}" }, as: EHSAdministrator, captures: { emp_rf: $.data.id } }
          trigger:
            - { call: "POST /employees/${emp_rf}/fit-tests", payload: { item_id: "${item_rf}", tested_on: "2026-04-15", result: "PASS" }, as: SafetyOfficer, captures: { rf_ft: $.data.fit_tests } }
            - { call: "POST /employees/${emp_rf}/fit-tests", payload: { item_id: "${item_rf}", tested_on: "2026-04-16", result: "PASS" }, as: Employee, as_user_id: "${emp_rf}", captures: { rf_err: $.data.error_id } }
          assert:
            - "SafetyOfficer create: 201, employee.fit_tests gains entry with expires_on == 2027-04-15"
            - "Employee create attempt -> ERR_INSUFFICIENT_PERMISSIONS (403)"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_slot_create_stale_machine_version
        claim_type: stale_version_conflict
        grounds:
          - concurrency_rules[slot-create-stale-machine]
          - validations[priority=3.8]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two strictly sequential planogram creates: the first advances machine.version 1 -> 2; the second, still carrying expected_machine_version == 1, is rejected 412 ERR_STALE_VERSION — no timing dependence."
        test_recipe:
          setup: ["Item; machine COMMISSIONING at version 1 (captured at create)"]
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "OCC-C", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_oc1: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-OC1", site_name: "P32", model: "VM-1" }, as: VendingTechnician, captures: { mach_oc1: $.data.id, mach_oc1_v: $.data.version } }
          trigger:
            - { call: "POST /machines/${mach_oc1}/slots", payload: { slot_code: "A1", item_id: "${item_oc1}", capacity: 10, par_level: 0, expected_machine_version: "${mach_oc1_v}" }, as: VendingTechnician, captures: { slot_oc1: $.data.id } }
            - { call: "POST /machines/${mach_oc1}/slots", payload: { slot_code: "A2", item_id: "${item_oc1}", capacity: 10, par_level: 0, expected_machine_version: "${mach_oc1_v}" }, as: VendingTechnician, captures: { oc1_err: $.data.error_id } }
          assert:
            - "first create succeeds (machine.version was 1)"
            - "second create with the same captured version -> 412 ERR_STALE_VERSION (machine.version is now 2)"
            - "GET /machines/${mach_oc1} shows version == 2 and exactly one slot"

      - name: occ_slot_update_stale_slot_version
        claim_type: stale_version_conflict
        grounds:
          - concurrency_rules[slot-update-stale-slot]
          - validations[priority=3.8]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PUT /slots/{id} with the create-time version (1) succeeds once (slot.version -> 2); repeating the update with the SAME captured version fails 412 ERR_STALE_VERSION and par_level is unchanged."
        test_recipe:
          setup: ["Item; machine COMMISSIONING; slot created (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "OCC-U", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_oc2: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-OC2", site_name: "P33", model: "VM-1" }, as: VendingTechnician, captures: { mach_oc2: $.data.id, mach_oc2_v: $.data.version } }
            - { call: "POST /machines/${mach_oc2}/slots", payload: { slot_code: "A1", item_id: "${item_oc2}", capacity: 10, par_level: 2, expected_machine_version: "${mach_oc2_v}" }, as: VendingTechnician, captures: { slot_oc2: $.data.id, slot_oc2_v: $.data.version } }
          trigger:
            - { call: "PUT /slots/${slot_oc2}", payload: { par_level: 3, expected_slot_version: "${slot_oc2_v}" }, as: VendingTechnician, captures: { oc2_par: $.data.par_level, oc2_v: $.data.version } }
            - { call: "PUT /slots/${slot_oc2}", payload: { par_level: 4, expected_slot_version: "${slot_oc2_v}" }, as: VendingTechnician, captures: { oc2_err: $.data.error_id } }
            - { call: "GET /slots/${slot_oc2}", payload: {}, as: Any, captures: { oc2_final_par: $.data.par_level } }
          assert:
            - "first PUT: par_level == 3, version == 2"
            - "second PUT with stale version -> 412 ERR_STALE_VERSION"
            - "MachineSlot.${slot_oc2}.par_level == 3 (failed write left no drift)"

      - name: layer_rate_threshold_triggers_covered
        claim_type: boundary_edge
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: usage_limit_exact_boundary
          rationale: "Threshold boundary semantics asserted by §1.8 usage_limit_exact_boundary (issuance limit) and restock_load_capacity_exact_boundary (capacity), plus corner restock_par_trigger_exact_threshold (par trigger)."

      - name: layer_cascading_side_effects_covered
        claim_type: side_effect_execution
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: reversal_triggers_restock_autocancel_chain
          rationale: "N-level cascades asserted by §1.8 reversal_triggers_restock_autocancel_chain and service_start_cancels_open_restocks_chain."

      - name: layer_dual_variant_calculation_covered
        claim_type: variant_divergence
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: chargeback_snapshot_vs_rerate_diverge
          rationale: "Both declared dual-variant pairs asserted by §1.8 rule dual_variant_calc instances."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_vend
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.MachineSlot.fields.on_hand_qty
        distinguishing_aspect: "Immediate consistency: the very next GET after a vend reflects the on_hand decrement (12 -> 11) with no settlement lag, and the issuance row is retrievable by id in the same instant."
        test_recipe:
          setup: ["GENERAL item CM-IV base 100; policy limit 10/30d; employee; machine ACTIVE stocked 12"]
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-CM1", name: "Ops" }, as: FinanceAnalyst, captures: { cc_cm: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "TECH-CM" }, as: EHSAdministrator, captures: { role_cm: $.data.id } }
            - { call: "POST /items", payload: { sku: "CM-IV", name: "Gloves", category: "GENERAL", base_list_price_cents: 100 }, as: EHSAdministrator, captures: { item_cm: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_cm}", item_id: "${item_cm}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-CM1", full_name: "Tech CM", job_role_id: "${role_cm}", home_cost_center_id: "${cc_cm}" }, as: EHSAdministrator, captures: { emp_cm: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-CM1", site_name: "P34", model: "VM-1" }, as: VendingTechnician, captures: { mach_cm: $.data.id, mach_cm_v: $.data.version } }
            - { call: "POST /machines/${mach_cm}/slots", payload: { slot_code: "A1", item_id: "${item_cm}", capacity: 20, par_level: 0, expected_machine_version: "${mach_cm_v}" }, as: VendingTechnician, captures: { slot_cm: $.data.id } }
            - { call: "PUT /machines/${mach_cm}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_cm}", slot_id: "${slot_cm}", qty: 12 }, as: VendingTechnician, captures: { ro_cm: $.data.id } }
            - { call: "POST /restock-orders/${ro_cm}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_cm}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_cm}", slot_id: "${slot_cm}", qty: 1, idempotency_key: "cm-1" }, as: Employee, as_user_id: "${emp_cm}", captures: { iss_cm: $.data.id } }
            - { call: "GET /slots/${slot_cm}", payload: {}, as: Any, captures: { cm_onhand: $.data.on_hand_qty } }
            - { call: "GET /issuances/${iss_cm}", payload: {}, as: Any, captures: { cm_iss: $.data.status } }
          assert:
            - "GET slot immediately after vend: on_hand_qty == 11"
            - "GET issuance immediately: status POSTED, all computed pricing fields populated"
