              captures: { obl_count: "$.data[1].period_index", obl2_fye: "$.data[1].fiscal_year_end", obl2_due: "$.data[1].due_at" }
          assert:
            - "after clock to 2028-01-27 (> due 2028-01-26): Rating.status == PUBLISHED and surveillance_posture == GRACE (axes move independently)"
            - "obligation ${ob1} submit -> SUBMITTED_LATE (OVERDUE at submission time)"
            - "after submit: Rating.status == PUBLISHED and surveillance_posture == CURRENT (posture axis recovered; publication axis never moved)"
            - "next period obligation exists with period_index == 2, fiscal_year_end == 2028-06-30T00:00:00Z, due_at == 2029-01-26T00:00:00Z"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: criteria_activation_portfolio_cascade
        grounds:
          - calculations.criteria_review_fanout
          - state_machines.CriteriaVersion.DRAFT_to_ACTIVE
          - state_machines.CriteriaVersion.ACTIVE_to_SUPERSEDED
          - entities.Rating.fields.review_pending
        distinguishing_aspect: "Depth-3 cascade triggered by criteria activation (a different trigger than the clock sweep): activate superseded the prior ACTIVE version (hop 1), which itself fans out CriteriaReviewItem creation and sets Rating.review_pending (hop 2), which itself logs IssuerNotification REVIEW_OPENED issuer communications (hop 3)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO rating PUBLISHED at 2026-09-08T00:00:00Z pinned to criteria GO-2026.1; a second DRAFT criteria version GO-2026.2 (weights 0.25/0.15/0.20/0.15/0.10/0.15) exists for the same segment."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - *get_rating
            - *c_publish
            - *publish_std
            - &mk_cv_go2
              call: "POST /muni/criteria-versions"
              payload: { jurisdiction_code: "US-CA", credit_type: "GENERAL_OBLIGATION", version_label: "GO-2026.2", w_economy: 0.25, w_management: 0.15, w_budgetary_performance: 0.20, w_flexibility: 0.15, w_liquidity: 0.10, w_debt_profile: 0.15 }
              as: SurveillanceOfficer
              captures: { cv_go2: $.data.id }
          trigger:
            - call: "POST /muni/criteria-versions/${cv_go2}/activate"
              payload: {}
              as: SurveillanceOfficer
            - call: "GET /muni/criteria-versions/${cv_go}"
              payload: {}
              as: SurveillanceOfficer
              captures: { cv1_status: $.data.status }
            - call: "GET /muni/review-items"
              payload: { criteria_version_id: "${cv_go2}" }
              as: SurveillanceOfficer
              captures: { ri_id: "$.data[0].id", ri_status: "$.data[0].status", ri_due: "$.data[0].due_at", ri_rating: "$.data[0].rating_id" }
            - call: "GET /muni/ratings/${rating_id}"
              payload: {}
              as: SurveillanceOfficer
              captures: { r_pending: $.data.review_pending }
            - call: "GET /muni/issuers/${iss}/notifications"
              payload: {}
              as: SurveillanceOfficer
          assert:
            - "hop 1: CriteriaVersion.${cv_go}.status == SUPERSEDED and ${cv_go2} is ACTIVE (at most one ACTIVE per segment)"
            - "hop 2: a CriteriaReviewItem exists with criteria_version_id == ${cv_go2}, rating_id == ${rating_id}, status == PENDING, due_at == 2026-12-07T00:00:00Z (activation 2026-09-08T00:00:00Z + 90 days)"
            - "hop 2: Rating.${rating_id}.review_pending == true"
            - "hop 3: IssuerNotification log for ${iss} contains event_type REVIEW_OPENED referencing the created review item"
            - "Rating.${rating_id}.criteria_version_id remains the ORIGINAL pinned version ${cv_go} (version pinning survives activation)"

      - name: clock_delinquency_stepwise_cascade
        grounds:
          - calculations.nondisclosure_sweep
          - state_machines.DisclosureObligation.transitions
          - state_machines.Rating.PUBLISHED_to_WITHDRAWN
          - entities.Issuer.fields.delinquent_flag
        distinguishing_aspect: "Depth-3 cascade triggered by the logical-clock sweep (a different trigger than criteria activation): clock advance flips the obligation (hop 1), each obligation flip re-derives the rating's posture (hop 2), and the DEFAULTED flip withdraws the rating and logs issuer notifications (hop 3) — observed hop-by-hop across three separate clock advances."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO rating PUBLISHED 2026-09-08T00:00:00Z; obligation period 1 due_at 2028-01-26T00:00:00Z."
          setup_api_calls:
