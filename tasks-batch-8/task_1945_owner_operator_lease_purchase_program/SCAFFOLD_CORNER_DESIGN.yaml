            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: LeaseAdmin }
          trigger:
            - { call: "POST /lease-program/maintenance-work-orders/${wo1}/complete", payload: { actual_cost_cents: 50000, odometer_at_service: 100000 }, as: MaintenanceCoordinator, captures: { b1: "$.data.billed_to" } }
