      - name: crew_overlap_zero_gap_boundary
        grounds:
          - calculations.crew_temporal_conflict_install
        distinguishing_aspect: |
          Interval boundary: InstallJob buffer rule treats adjacent jobs (end == start)
          as conflicting if the 60-minute buffer extension overlaps, but as allowed if
          the gap is exactly 60 minutes. Metric: inter-job gap in minutes. Endpoint:
