      - name: locker_hours_ceil_boundary_60_vs_61_minutes
        grounds:
          - calculations.locker_rental_charge
          - entities.LockerRental.fields.hours_billed
        distinguishing_aspect: |
          Boundary on a distinct metric (billed hours via ceil), reached through
          a distinct endpoint POST /locker-rentals: a 60-minute rental bills
