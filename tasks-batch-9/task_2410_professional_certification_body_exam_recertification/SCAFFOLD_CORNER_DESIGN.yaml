      - name: two_form_composition_rules_violated_together_return_the_lower_priority_number
        claim_type: priority_conflict
        grounds:
          - validations[priority=22]
          - validations[priority=35]
          - errors.ERR_ITEM_DOMAIN_MISMATCH
          - errors.ERR_FORM_LENGTH_MISMATCH
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / form_item_domain_mismatch_outranks_form_length_mismatch_on_one_request
          rationale: "That instance sends one POST /forms body that violates priority 22 and priority 35 simultaneously and asserts ERR_ITEM_DOMAIN_MISMATCH wins, which is exactly this claim."
      - name: panel_quorum_check_runs_after_the_trim_arithmetic
        claim_type: cascading
        grounds:
          - validations[priority=36]
          - errors.ERR_PANEL_QUORUM_NOT_MET
          - calculations.angoff_cut_score
        excluded_because:
          difficulty_instance: boundary_precision_check / angoff_quorum_boundary_four_ratings_leave_zero_survivors_and_five_leave_exactly_one
          rationale: "That instance shows the quorum verdict depends on the trim arithmetic (n - 2t >= 1) computed first: four ratings clear min_panelists but leave zero survivors and are refused, five leave exactly one and adopt."
      - name: form_publication_while_the_blueprint_is_deficient_returns_blueprint_deficient
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - errors.ERR_BLUEPRINT_DEFICIENT
          - calculations.blueprint_posture
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / form_publication_gated_on_program_blueprint_posture_toggled_by_item_flagging
          rationale: "That instance drives blueprint_posture DEFICIENT by flagging the only operational item and asserts the publish call is refused ERR_BLUEPRINT_DEFICIENT, then restores it and publishes."
      - name: blueprint_weight_sum_and_stats_eligibility_rejects_a_ninety_point_split_and_a_draft_item
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - validations[priority=42]
          - validations[priority=7]
          - errors.ERR_BLUEPRINT_WEIGHTS_INVALID
          - errors.ERR_ITEM_NOT_ELIGIBLE_FOR_STATS
          - endpoints.POST_/programs
          - endpoints.POST_/items/{id}/response-batches
          - entities.CertificationProgram.fields.domain_specs
          - entities.Item.fields.status
        distinguishing_aspect: |
          Both rules sit BELOW the schema check at priority 7, so a schema-valid body still has
          to satisfy them: domain_specs weighing 60+30 and domain_specs repeating D1 are each
          refused 400 ERR_BLUEPRINT_WEIGHTS_INVALID rather than ERR_INVALID_REQUEST, and a
          response batch aimed at a DRAFT item is refused 422 ERR_ITEM_NOT_ELIGIBLE_FOR_STATS
          rather than accumulating responses on an unreviewed item. All three refusals leave
          zero rows and zero accumulators behind.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX whose domain_specs is [{D1, 100, min_operational_items 1}] — the only programme in the database."
            - "One Item ${draft_id} in status DRAFT authored by isp-author, with response_count 0, p_value null and discrimination_index null."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "RECALL", "stem": "CPX draft item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { draft_id: "$.data.id" }
          trigger:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner W", "credential_code": "CPW", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 60, "min_operational_items": 1}, {"domain_code": "D2", "weight_pct": 30, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { e_sum: "$.data.error_id" }
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner V", "credential_code": "CPV", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 50, "min_operational_items": 1}, {"domain_code": "D1", "weight_pct": 50, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { e_dup: "$.data.error_id" }
            - call: "POST /items/${draft_id}/response-batches"
              payload: {"is_pretest": true, "response_count": 40, "correct_count": 24, "upper_n": 10, "upper_correct": 9, "lower_n": 10, "lower_correct": 3}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { e_stats: "$.data.error_id" }
          assert:
            - "trigger[0] responds 400 with ${e_sum} == ERR_BLUEPRINT_WEIGHTS_INVALID because 60 + 30 != 100"
            - "${e_sum} is not ERR_INVALID_REQUEST — every required field is present and correctly typed, so priority 7 does not fire"
            - "trigger[1] responds 400 with ${e_dup} == ERR_BLUEPRINT_WEIGHTS_INVALID because domain_code D1 appears twice even though the weights total 100"
            - "after trigger[1] GET /programs returns total_count == 1 — neither CPW nor CPV was created"
            - "trigger[2] responds 422 with ${e_stats} == ERR_ITEM_NOT_ELIGIBLE_FOR_STATS while Item.${draft_id}.status == DRAFT"
            - "after trigger[2] Item.${draft_id}.response_count == 0, p_value == null, discrimination_index == null and stat_basis_applied == null"
            - "CertificationProgram.${prog_id}.operational_item_count == 0 and blueprint_posture == DEFICIENT throughout"
