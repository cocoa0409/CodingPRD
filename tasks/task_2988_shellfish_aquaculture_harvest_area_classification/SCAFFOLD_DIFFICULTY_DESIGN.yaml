  - rule_id: transitive_cascade
    instances:

      - name: rainfall_closure_cascades_authorization_void_lot_embargo_shipment_hold
        grounds:
          - state_machines.GrowingArea.OPEN_to_CLOSED_RAINFALL
          - state_machines.HarvestAuthorization.ACTIVE_to_VOIDED
          - state_machines.HarvestLot.TAGGED_to_EMBARGOED
          - state_machines.Shipment.CREATED_to_HELD
          - state_machines.GrowoutUnit.HARVESTING_to_DEPLOYED
          - entities.RainfallEvent.fields.voided_authorization_count
          - entities.HarvestVessel.fields.active_authorization_count
        distinguishing_aspect: |
          A FOUR-HOP chain fired by one rainfall reading on a fifth entity: GrowingArea.harvest_status ->
          HarvestAuthorization VOIDED -> HarvestLot EMBARGOED -> Shipment HELD, with the vessel counter
          and the GrowoutUnit rolled back on the same hop; the entry point is a RainfallEvent that names
          none of the four affected rows.
        test_recipe:
