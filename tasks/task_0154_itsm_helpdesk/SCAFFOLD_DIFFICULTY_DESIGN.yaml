# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# IT Service Management Helpdesk — Expert band
# Nine §0.5 rules × ≥2 instances each (18 instances total).
# Every grounds[] ref resolves to SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sla_due_dates_provisional_vs_final_on_ticket
        grounds:
          - calculations.sla_due_dates
          - state_machines.Ticket.NEW_to_ASSIGNED
          - entities.Ticket.fields.resolve_due_at
        distinguishing_aspect: |
          On the Ticket domain: the provisional variant fixes resolve_due_at at open from the open-time
          priority (P3 -> opened_at+240min), while the final variant on reprioritize to P1 re-derives the
          window (240*0.25=60min) anchored on the ORIGINAL opened_at, yielding resolve_due_at = opened_at+60min.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "SlaPolicy resp=60, resolve=240, ola=120, multipliers {P1:0.25,P2:0.5,P3:1.0,P4:2.0}."
            - "Category default_priority=P3 wired to that policy and a group."
            - "Ticket opened P3 -> resolve_due_at = 2026-06-01T04:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "Service Desk" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Email", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "Mailbox full", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-1"
              captures: { tkt_id: $.data.id }
          trigger:
            - call: "POST /tickets/${tkt_id}/reprioritize"
              payload: { priority: "P1" }
              as: Agent
              as_user_id: "agent-1"
              captures: { res_due: $.data.resolve_due_at }
          assert:
            - "Ticket.${tkt_id}.priority == P1"
            - "Ticket.${tkt_id}.resolve_due_at == 2026-06-01T01:00:00.000Z"
            - "Ticket.${tkt_id}.opened_at == 2026-06-01T00:00:00.000Z (anchor unchanged by final variant)"

      - name: cab_tally_optimistic_approve_vs_pessimistic_veto_on_change
        grounds:
          - calculations.cab_tally
          - state_machines.ChangeRequest.PENDING_CAB_to_APPROVED
          - state_machines.ChangeRequest.PENDING_CAB_to_REJECTED
        distinguishing_aspect: |
          On the ChangeRequest domain (different entity from sla_due_dates): the optimistic variant approves
          when approve_count reaches required_approvals on an APPROVE vote, while the pessimistic variant
          rejects on the very first REJECT vote (veto threshold 1) regardless of approve_count.
        test_recipe:
          setup:
            - "A MEDIUM-risk ChangeRequest (required_approvals=2) submitted to CAB on a ticket."
            - "One APPROVE already cast (approve_count=1, version advanced)."
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "Network" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Net", default_priority: "P2", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "Switch reboot", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-2"
              captures: { tkt_id: $.data.id }
            - call: "POST /change-requests"
              payload: { title: "Reboot core switch", ticket_id: "${tkt_id}", risk: "MEDIUM" }
              as: ChangeManager
              as_user_id: "cm-1"
              captures: { cr_id: $.data.id }
            - call: "POST /change-requests/${cr_id}/submit"
              payload: {}
              as: ChangeManager
              as_user_id: "cm-1"
              captures: { v_submit: $.data.version, req_appr: $.data.required_approvals }
            - call: "POST /change-requests/${cr_id}/votes"
              payload: { decision: "APPROVE", expected_change_request_version: "${v_submit}" }
              as: CabMember
              as_user_id: "cab-1"
          trigger:
            - call: "GET /change-requests/${cr_id}"
              payload: {}
              as: CabMember
              as_user_id: "cab-1"
              captures: { v_after1: $.data.version, st_after1: $.data.state, app1: $.data.approve_count }
            - call: "POST /change-requests/${cr_id}/votes"
              payload: { decision: "APPROVE", expected_change_request_version: "${v_after1}" }
              as: CabMember
              as_user_id: "cab-2"
          assert:
            - "After first APPROVE: ChangeRequest.${cr_id}.state == PENDING_CAB, approve_count == 1 (optimistic: not yet quorum 2)"
            - "After second distinct APPROVE: ChangeRequest.${cr_id}.state == APPROVED, approve_count == 2"
            - "required_approvals == 2 for MEDIUM risk"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sla_effective_resolve_window_three_input_nonlinear
        grounds:
          - calculations.sla_effective_resolve_window
          - entities.Ticket.fields.paused_total_minutes
          - entities.Ticket.fields.reopen_count
        distinguishing_aspect: |
          Mode (a): resolve_due_at = ceil(base*mult) + paused_total_minutes + RESOLVE_REOPEN_PENALTY_MINUTES*reopen_count,
          three interacting inputs with a non-linear ceil applied to base*mult BEFORE the integer additions; a P2 ticket
          (mult 0.5, base 240 -> ceil 120) with 90 paused minutes and 1 reopen yields effective = 120+90+60 = 270.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; SlaPolicy base resolve 240; P2 ticket opened."
            - "Ticket held 90 minutes then resumed (paused_total=90), resolve_due pushed by 90 (=opened+210)."
            - "Ticket resolved then reopened once within window (reopen_count=1) -> +60 penalty -> opened+270."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "Apps" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "App", default_priority: "P2", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "App crash", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-3"
              captures: { tkt_id: $.data.id }
            - call: "POST /tickets/${tkt_id}/assign"
              payload: { assignee_user_id: "agent-3" }
              as: Agent
              as_user_id: "agent-3"
            - call: "POST /tickets/${tkt_id}/start"
              payload: {}
              as: Agent
              as_user_id: "agent-3"
            - call: "POST /tickets/${tkt_id}/hold"
              payload: {}
              as: Agent
              as_user_id: "agent-3"
            - call: "POST /_clock/advance"
              payload: { minutes: 90 }
              as: PlatformAdmin
            - call: "POST /tickets/${tkt_id}/resume"
              payload: {}
              as: Agent
              as_user_id: "agent-3"
            - call: "POST /tickets/${tkt_id}/resolve"
              payload: {}
              as: Agent
              as_user_id: "agent-3"
          trigger:
            - call: "POST /tickets/${tkt_id}/reopen"
              payload: {}
              as: Requester
              as_user_id: "req-3"
              captures: { res_due: $.data.resolve_due_at }
          assert:
            - "Ticket.${tkt_id}.paused_total_minutes == 90"
            - "Ticket.${tkt_id}.reopen_count == 1"
            - "Ticket.${tkt_id}.resolve_due_at == 2026-06-01T04:30:00.000Z (opened 00:00 + ceil(240*0.5)=120 + 90 paused + 60 penalty = 270 min)"

      - name: group_load_score_per_line_round_then_sum
        grounds:
          - calculations.group_load_score
          - entities.AssignmentGroup.fields.queue_depth
          - entities.Ticket.fields.priority
        distinguishing_aspect: |
          Mode (b): five P1 non-breached tickets give per-line round(8/3,2)=2.67 each; per-line-then-sum = 13.35 ->
          round 1dp = 13.4, whereas sum-raw-then-round = 13.333 -> 13.3. The scaffold pins per-line first, so
          load_score == 13.4 (NOT 13.3).
        test_recipe:
          setup:
            - "Group with five P1 tickets, all NEW (non-terminal, non-breached)."
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "LoadGrp" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Crit", default_priority: "P1", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "t1", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-a"
            - call: "POST /tickets"
              payload: { short_description: "t2", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-a"
            - call: "POST /tickets"
              payload: { short_description: "t3", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-a"
            - call: "POST /tickets"
              payload: { short_description: "t4", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-a"
            - call: "POST /tickets"
              payload: { short_description: "t5", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-a"
          trigger:
            - call: "GET /assignment-groups/${grp_id}/load"
              payload: {}
              as: Agent
              as_user_id: "agent-1"
              captures: { score: $.data.load_score }
          assert:
            - "load_score == 13.4 (per-line round-then-sum; NOT 13.3 sum-then-round)"
            - "ticket_count == 5"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_reopen_cycle_resolved_to_in_progress
        grounds:
          - state_machines.Ticket.RESOLVED_to_IN_PROGRESS
          - entities.Ticket.fields.reopen_count
        distinguishing_aspect: |
          Cyclic shape on Ticket: RESOLVED -> IN_PROGRESS via reopen, re-entering a state already visited;
          reopen_count increments to 1 and lifecycle_state returns to IN_PROGRESS (a non-terminal earlier state).
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; a P3 ticket resolved within the reopen window."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "Desk" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Gen", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "Login fails", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-4"
              captures: { tkt_id: $.data.id }
            - call: "POST /tickets/${tkt_id}/assign"
              payload: { assignee_user_id: "agent-4" }
              as: Agent
              as_user_id: "agent-4"
            - call: "POST /tickets/${tkt_id}/start"
              payload: {}
              as: Agent
              as_user_id: "agent-4"
            - call: "POST /tickets/${tkt_id}/resolve"
              payload: {}
              as: Agent
              as_user_id: "agent-4"
          trigger:
            - call: "POST /tickets/${tkt_id}/reopen"
              payload: {}
              as: Requester
              as_user_id: "req-4"
              captures: { st: $.data.lifecycle_state, rc: $.data.reopen_count }
          assert:
            - "Ticket.${tkt_id}.lifecycle_state == IN_PROGRESS"
            - "Ticket.${tkt_id}.reopen_count == 1"

      - name: change_request_cab_fork_to_approved_or_rejected
        grounds:
          - state_machines.ChangeRequest.PENDING_CAB_to_APPROVED
          - state_machines.ChangeRequest.PENDING_CAB_to_REJECTED
        distinguishing_aspect: |
          Branching fork-join on ChangeRequest (a DIFFERENT entity from Ticket): PENDING_CAB forks to APPROVED
          (quorum APPROVE) or REJECTED (veto REJECT), with divergent side-effect sets; here the REJECT branch is
          taken so the linked ticket resumes from a REJECTED change, not an APPROVED one.
        test_recipe:
          setup:
            - "A LOW-risk ChangeRequest (required_approvals=1) submitted to CAB, attached to a ticket in PENDING_CHANGE."
          setup_api_calls:
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "Net2" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "Net2c", default_priority: "P2", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "Firewall rule", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-5"
              captures: { tkt_id: $.data.id }
            - call: "POST /tickets/${tkt_id}/assign"
              payload: { assignee_user_id: "agent-5" }
              as: Agent
              as_user_id: "agent-5"
            - call: "POST /tickets/${tkt_id}/start"
              payload: {}
              as: Agent
              as_user_id: "agent-5"
            - call: "POST /change-requests"
              payload: { title: "FW change", ticket_id: "${tkt_id}", risk: "LOW" }
              as: ChangeManager
              as_user_id: "cm-2"
              captures: { cr_id: $.data.id }
            - call: "POST /change-requests/${cr_id}/submit"
              payload: {}
              as: ChangeManager
              as_user_id: "cm-2"
              captures: { v_sub: $.data.version }
            - call: "POST /tickets/${tkt_id}/attach-change"
              payload: { change_request_id: "${cr_id}" }
              as: Agent
              as_user_id: "agent-5"
          trigger:
            - call: "POST /change-requests/${cr_id}/votes"
              payload: { decision: "REJECT", expected_change_request_version: "${v_sub}" }
              as: CabMember
              as_user_id: "cab-3"
            - call: "GET /tickets/${tkt_id}"
              payload: {}
              as: Agent
              as_user_id: "agent-5"
              captures: { st: $.data.lifecycle_state }
          assert:
            - "ChangeRequest.${cr_id}.state == REJECTED"
            - "Ticket.${tkt_id}.lifecycle_state == IN_PROGRESS (bubble-up resume from REJECT branch)"
            - "Ticket.${tkt_id}.change_request_id == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cab_approve_resumes_ticket_recomputes_resolve_window_depth3
        grounds:
          - state_machines.ChangeRequest.PENDING_CAB_to_APPROVED
          - state_machines.Ticket.PENDING_CHANGE_to_IN_PROGRESS
          - calculations.sla_resume
        distinguishing_aspect: |
          Depth-3 chain from a CAB approve vote: vote APPROVE mutates ChangeRequest (PENDING_CAB->APPROVED);
          THAT mutation bubbles to the linked Ticket (PENDING_CHANGE->IN_PROGRESS); THAT resume mutation in turn
          recomputes the Ticket's resolve_due_at by adding the paused delta. Each link is caused by the prior link.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; P3 ticket IN_PROGRESS, resolve_due opened+240."
            - "LOW-risk change attached -> ticket PENDING_CHANGE, SLA paused at +30 min."
            - "Clock advanced to +120 (90 min paused so far) before the approving vote."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sla-policies"
              payload: { name: "Std", response_target_minutes: 60, resolve_target_minutes: 240, ola_target_minutes: 120, priority_multipliers: { P1: 0.25, P2: 0.5, P3: 1.0, P4: 2.0 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /assignment-groups"
              payload: { name: "Cas" }
              as: PlatformAdmin
              captures: { grp_id: $.data.id }
            - call: "POST /categories"
              payload: { name: "CasC", default_priority: "P3", sla_policy_id: "${pol_id}", default_assignment_group_id: "${grp_id}" }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /tickets"
              payload: { short_description: "Cascade", category_id: "${cat_id}" }
              as: Requester
              as_user_id: "req-6"
              captures: { tkt_id: $.data.id }
            - call: "POST /tickets/${tkt_id}/assign"
              payload: { assignee_user_id: "agent-6" }
              as: Agent
              as_user_id: "agent-6"
            - call: "POST /tickets/${tkt_id}/start"
              payload: {}
              as: Agent
              as_user_id: "agent-6"
            - call: "POST /change-requests"
              payload: { title: "Cas change", ticket_id: "${tkt_id}", risk: "LOW" }
              as: ChangeManager
              as_user_id: "cm-3"
              captures: { cr_id: $.data.id }
            - call: "POST /change-requests/${cr_id}/submit"
              payload: {}
              as: ChangeManager
              as_user_id: "cm-3"
              captures: { v_sub: $.data.version }
            - call: "POST /_clock/advance"
              payload: { minutes: 30 }
              as: PlatformAdmin
            - call: "POST /tickets/${tkt_id}/attach-change"
              payload: { change_request_id: "${cr_id}" }
              as: Agent
              as_user_id: "agent-6"
            - call: "POST /_clock/advance"
              payload: { minutes: 90 }
              as: PlatformAdmin
          trigger:
            - call: "POST /change-requests/${cr_id}/votes"
              payload: { decision: "APPROVE", expected_change_request_version: "${v_sub}" }
              as: CabMember
              as_user_id: "cab-4"
            - call: "GET /tickets/${tkt_id}"
              payload: {}
              as: Agent
              as_user_id: "agent-6"
              captures: { st: $.data.lifecycle_state, rd: $.data.resolve_due_at, pt: $.data.paused_total_minutes }
          assert:
            - "ChangeRequest.${cr_id}.state == APPROVED"
            - "Ticket.${tkt_id}.lifecycle_state == IN_PROGRESS"
            - "Ticket.${tkt_id}.paused_total_minutes == 90"
            - "Ticket.${tkt_id}.resolve_due_at == 2026-06-01T05:30:00.000Z (240 + 90 paused)"

      - name: problem_root_cause_degrades_asset_depth2
        grounds:
          - state_machines.Problem.OPEN_to_ROOT_CAUSE_IDENTIFIED
          - state_machines.Asset.OPERATIONAL_to_DEGRADED
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (identify-root-cause, not a CAB vote): identifying the root cause
          mutates the Problem (OPEN->ROOT_CAUSE_IDENTIFIED) and sets Problem.asset_id; THAT mutation cascades to the
          referenced Asset (OPERATIONAL->DEGRADED).
        test_recipe:
          setup:
            - "An OPERATIONAL asset and an OPEN problem exist."
          setup_api_calls:
            - call: "POST /assets"
              payload: { asset_tag: "SRV-001", kind: "SERVER" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /problems"
              payload: { title: "Disk failures", owner_user_id: "agent-7" }
              as: Agent
              as_user_id: "agent-7"
              captures: { prob_id: $.data.id }
          trigger:
            - call: "POST /problems/${prob_id}/identify-root-cause"
              payload: { asset_id: "${asset_id}" }
              as: Agent
              as_user_id: "agent-7"
            - call: "GET /assets/${asset_id}"
              payload: {}
              as: Agent
              as_user_id: "agent-7"
              captures: { ast: $.data.status }
          assert:
            - "Problem.${prob_id}.state == ROOT_CAUSE_IDENTIFIED"
            - "Problem.${prob_id}.asset_id == ${asset_id}"
            - "Asset.${asset_id}.status == DEGRADED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resolve_change_gating_beats_invalid_state_referential_vs_state
        grounds:
          - validations[priority=5]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair (state priority 5) vs (business_referential priority 9): a resolve attempt on a PENDING_CHANGE ticket
          violates BOTH the lifecycle precondition (IN_PROGRESS required) AND the change-gating rule. The state check
          at priority 5 fires first, so ERR_INVALID_STATE wins (NOT ERR_CHANGE_GATING_RESOLUTION).
        test_recipe:
          setup:
            - "A ticket in PENDING_CHANGE with an open attached change."
          setup_api_calls:
            - call: "POST /sla-policies"
