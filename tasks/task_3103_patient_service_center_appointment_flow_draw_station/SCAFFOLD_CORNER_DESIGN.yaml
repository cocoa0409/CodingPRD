            - "Appointment.${a1}.queue_state == WAITING"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: a_stale_expected_test_order_version_on_appointment_create_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appointment-create-stale-order]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/psc/appointments
        distinguishing_aspect: "OCC on TestOrder.version: the correct captured version succeeds and the same payload carrying the prior version is refused with 412, with no state field differing between the two requests."
        test_recipe:
          setup:
            - "Logical clock set; an ELIGIBLE order, then an intervening resolve that advances its version."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v_seen: $.data.version }
          trigger:
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o1}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v_seen} - 1" }
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 412 and ${err_id} == ERR_STALE_VERSION"
            - "GET /psc/appointments?test_order_id=${o1} returns 0 rows"
            - "TestOrder.${o1}.version is still ${v_seen}"

      - name: appointment_create_with_the_expected_version_succeeds_and_bumps_the_order
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appointment-create-stale-order]
          - entities.TestOrder.fields.version
        distinguishing_aspect: "The positive twin: supplying the freshly captured version is accepted, and the order's version advances by exactly one so the same value is immediately stale for a replayed create."
        test_recipe:
          setup:
            - "Logical clock set; an ELIGIBLE order and its captured version."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v_seen: $.data.version }
          trigger:
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o1}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v_seen}" }
              as: IntakeCoordinator
              captures: { a1: $.data.id }
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o1}", scheduled_start_utc: "2026-09-01T14:30:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v_seen}" }
              as: IntakeCoordinator
              captures: { replay_err: $.data.error_id }
          assert:
            - "the first call returns 201 with Appointment.${a1}.version == 1"
            - "TestOrder.${o1}.version has advanced past ${v_seen}"
            - "${replay_err} == ERR_STALE_VERSION for the replayed create"

      - name: a_terminated_plan_reconciles_every_eligible_order_on_it
        claim_type: derived_field_reconciliation
        grounds:
          - endpoints.PATCH_/psc/insurance-plans/{insurancePlanId}
          - entities.TestOrder.fields.insurance_status
          - entities.TestOrder.fields.est_copay_cents
        distinguishing_aspect: "Terminating a plan is a one-write cascade over every order referencing it: each order's insurance_status, est_copay_cents and est_coinsurance_cents are reconciled from the plan's new state, and each order's version advances."
        test_recipe:
          setup:
            - "Logical clock set; the reference plan seeded with two orders resolved ELIGIBLE against it."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - call: "POST /psc/patients"
              payload: { full_name: "Bo Alvarez", birth_date: "1988-01-11T00:00:00Z", mrn: "MRN-3103-R1" }
              as: IntakeCoordinator
              captures: { p2: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p2}", ordering_provider_npi: "1700111223", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o2: $.data.id }
            - call: "POST /psc/test-orders/${o2}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "PATCH /psc/insurance-plans/${plan_id}"
              payload: { status: "TERMINATED" }
              as: IntakeCoordinator
              captures: { plan_state: $.data.status }
            - call: "GET /psc/test-orders"
              payload: { insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { first_row: "$.data[0].insurance_status" }
          assert:
            - "${plan_state} == TERMINATED"
            - "${first_row} == EXPIRED"
            - "both orders report insurance_status EXPIRED and est_copay_cents 0 and est_coinsurance_cents 0"
            - "GET /psc/test-orders?insurance_plan_id=${plan_id} returns exactly 2 rows"

      - name: wait_bands_respond_to_a_roster_change
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.expected_wait_minutes
          - endpoints.PATCH_/psc/phlebotomists/{phlebotomistId}
          - endpoints.POST_/psc/run-ops
        distinguishing_aspect: "Sending a resolving phlebotomist OFF_DUTY narrows the resolving set and re-derives the published wait on the next read, so the band can cross its WITHIN_WINDOW to EXTENDED boundary without any queue mutation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a center with three ON_DUTY phlebotomists and three earlier WAITING rows ahead of the read row."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - call: "POST /psc/phlebotomists"
              payload: { service_center_id: "${c1}", full_name: "Hana Reed", credential: "RN", shift_start_local_minutes: 420, shift_end_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { ph1: $.data.id }
            - call: "POST /psc/phlebotomists"
              payload: { service_center_id: "${c1}", full_name: "Omar Vela", credential: "LABEL_PBS", shift_start_local_minutes: 420, shift_end_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { ph2: $.data.id }
            - call: "POST /psc/phlebotomists"
              payload: { service_center_id: "${c1}", full_name: "Ines Cruz", credential: "LABEL_PBS", shift_start_local_minutes: 420, shift_end_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { ph3: $.data.id }
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - *k_appt
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
          trigger:
            - call: "GET /psc/appointments/${a1}/queue-status"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
              captures: { band_before: $.data.wait_band, wait_before: $.data.estimated_wait_minutes }
            - call: "PATCH /psc/phlebotomists/${ph2}"
              payload: { status: "OFF_DUTY" }
              as: CenterSupervisor
            - call: "PATCH /psc/phlebotomists/${ph3}"
              payload: { status: "OFF_DUTY" }
              as: CenterSupervisor
            - call: "GET /psc/appointments/${a1}/queue-status"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
              captures: { band_after: $.data.wait_band, wait_after: $.data.estimated_wait_minutes }
          assert:
            - "${band_before} == IMMEDIATE with ${wait_before} == 2 after the ops-run roster scalar of 45 minutes over 15"
            - "${band_after} == WITHIN_WINDOW with ${wait_after} == 2, the roster term now the binding maximum"
            - "Phlebotomist.${ph2}.status == OFF_DUTY and ${ph3}.status == OFF_DUTY"

      - name: a_courier_run_may_be_cancelled_only_while_it_is_empty
        claim_type: conditional_feature_flags
        grounds:
          - state_machines.CourierRun.transitions.PLANNED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The cancel transition is conditional on committed_specimen_count being exactly 0, so an occupied run is refused and an empty one at the same dispatch instant is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; two OUTBOUND runs at distinct dispatch instants, one of which carries a specimen."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T16:00:00Z" }
              as: LabLiaison
              captures: { r_full: $.data.id }
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T17:00:00Z" }
              as: LabLiaison
              captures: { r_empty: $.data.id }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r_full}" }
              as: LabLiaison
          trigger:
            - call: "POST /psc/courier-runs/${r_full}/cancel"
              payload: {}
              as: LabLiaison
              captures: { err_full: $.data.error_id }
            - call: "POST /psc/courier-runs/${r_empty}/cancel"
              payload: {}
              as: LabLiaison
              captures: { empty_state: $.data.status }
          assert:
            - "${err_full} == ERR_INVALID_STATE and CourierRun.${r_full}.status == PLANNED"
            - "${empty_state} == CANCELLED"
            - "Specimen.${s1}.status == ASSIGNED and CourierRun.${r_full}.committed_specimen_count == 1"

      - name: a_second_collection_attempt_accumulates_and_reaches_the_limit
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Appointment.transitions.CHECKED_IN_to_ATTEMPT_LIMIT_REACHED
          - entities.Appointment.fields.attempt_count
          - endpoints.POST_/psc/appointments/{appointmentId}/reschedule
        distinguishing_aspect: "attempt_count is append-only and capped at 2, so a reschedule does NOT reset it and a third attempt on the same order reaches ATTEMPT_LIMIT_REACHED rather than starting over."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a center, an ELIGIBLE order, and an appointment checked in but not drawable."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_phleb
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - *k_appt
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
          trigger:
            - call: "GET /psc/appointments/${a1}"
              payload: {}
              as: IntakeCoordinator
              captures: { attempts_initial: $.data.attempt_count }
            - call: "POST /psc/appointments/${a1}/reschedule"
              payload: { scheduled_start_utc: "2026-09-01T15:00:00Z" }
              as: IntakeCoordinator
              captures: { reschedule_err: $.data.error_id }
          assert:
            - "${attempts_initial} == 0, so a fresh appointment starts with no attempts consumed"
            - "${reschedule_err} != null, since the attempt limit has not yet been reached"
            - "Appointment.${a1}.draw_state is still CHECKED_IN"
            - "Appointment.${a1}.attempt_count is still 0"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: all_appointment_writes_are_visible_in_the_same_response_and_on_an_immediate_reread
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/psc/appointments/{appointmentId}/prepay
          - endpoints.POST_/psc/test-orders/{testOrderId}/estimates
        distinguishing_aspect: "The model is immediate: the balance recomputed by a prepayment appears both in the mutation's own response body and in a subsequent read with no intervening wait."
        test_recipe:
          setup:
            - "Logical clock set; an ELIGIBLE order with an ATTENDED_COLLECTED estimate and an appointment in flight."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_phleb
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - *k_appt
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
            - call: "POST /psc/appointments/${a1}/call"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /psc/appointments/${a1}/start-draw"
              payload: {}
              as: Phlebotomist
              captures: { v_after_draw: $.data.version }
            - call: "POST /psc/test-orders/${o1}/estimates"
              payload: { variant: "ATTENDED_COLLECTED", supersedes_estimate_id: null, expected_test_order_version: "${v_after_draw}" }
              as: IntakeCoordinator
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /psc/appointments/${a1}/prepay"
              payload: { amount_cents: 1500 }
              as: IntakeCoordinator
            - call: "GET /psc/test-orders/${o1}"
              payload: {}
              as: IntakeCoordinator
              captures: { collected: $.data.prepay_collected_cents, remaining: $.data.balance_remaining_cents, resp: $.data.patient_responsibility_cents }
          assert:
            - "${collected} == 1500 and ${resp} == 4000"
            - "${remaining} == 2500, visible immediately on a re-read with no wait"
            - "ResponsibilityEstimate.${e1}.net_patient_cents == 4000, unchanged by the collection"
            - "the balance is derived from the estimate rather than from a stored copy that could lag"

      - name: a_rejection_compensates_rather_than_leaving_a_half_open_order
        claim_type: saga
        grounds:
          - state_machines.TestOrder.transitions.COLLECTED_to_SCHEDULED
          - state_machines.Specimen.transitions.COMPROMISED_to_REJECTED
        excluded_because:
          difficulty_instance: rejection_chain_specimen_order_fasting_gate_depth4
          rationale: "The compensating revert of the order and the pinning of the fasting gate are asserted end to end in that §1.8 instance."

      - name: estimate_revision_supersession_chain_is_queryable
        claim_type: immediate
        grounds:
          - entities.ResponsibilityEstimate.fields.supersedes_estimate_id
          - endpoints.GET_/psc/responsibility-estimates
        distinguishing_aspect: "A revised estimate names its predecessor through the self-referential supersession field, and the filtered list exposes the chain so the revised variant and the original both remain discoverable."
        test_recipe:
          setup:
            - "Logical clock set; an ELIGIBLE order resolved, with one SELF_PAY_LIST estimate already collected."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - call: "POST /psc/test-orders/${o1}/estimates"
              payload: { variant: "SELF_PAY_LIST", supersedes_estimate_id: null, expected_test_order_version: "${v1}" }
              as: IntakeCoordinator
              captures: { e_first: $.data.id, v_after_first: $.data.version }
          trigger:
            - call: "POST /psc/test-orders/${o1}/estimates"
              payload: { variant: "ATTENDED_COLLECTED", supersedes_estimate_id: "${e_first}", expected_test_order_version: "${v_after_first}" }
              as: IntakeCoordinator
              captures: { e_second: $.data.id }
            - call: "GET /psc/responsibility-estimates"
              payload: { supersedes_estimate_id: "${e_first}" }
              as: IntakeCoordinator
              captures: { successor: "$.data[0].id" }
          assert:
            - "${e_second} != ${e_first} and ResponsibilityEstimate.${e_second}.variant == ATTENDED_COLLECTED"
            - "${successor} == ${e_second}, so the chain is discoverable from the predecessor"
            - "GET /psc/test-orders/${o1}/estimates returns exactly 2 rows"
            - "ResponsibilityEstimate.${e_first}.variant == SELF_PAY_LIST and it was not mutated by the revision"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: commit_all_assigns_only_the_window_eligible_subset_of_the_bulk
        claim_type: bulk_operations
        grounds:
          - endpoints.POST_/psc/courier-runs/{courierRunId}/commit-all
          - calculations.unassigned_specimen_assignment_order
          - calculations.specimen_stability_deadline
        distinguishing_aspect: "The bulk call is conservative rather than transactional: it assigns the in-window subset, leaves the out-of-window remainder UNASSIGNED with no per-item error, and reports the run rather than a partial-failure envelope."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. A center whose OUTBOUND run dispatches 2026-09-02T07:00:00Z, and two orders on different panels so their far-past specimens carry different stability windows: an STST tube on CMP at 240 minutes, and an EDTA tube on LACTATE at 60 minutes."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - call: "POST /psc/tube-requirements"
              payload: { test_panel: "CMP", tube_code: "EDTA_LAVENDER", required_volume_ml: 4.0, min_volume_ml: 1.0, order_of_draw: 1, stability_minutes: 240, max_urgency_hours: 24, special_handling_codes: [], is_recollection_eligible: true }
              as: LabLiaison
            - call: "POST /psc/tube-requirements"
              payload: { test_panel: "LACTATE", tube_code: "EDTA_LAVENDER", required_volume_ml: 2.0, min_volume_ml: 0.5, order_of_draw: 1, stability_minutes: 60, max_urgency_hours: 4, special_handling_codes: [], is_recollection_eligible: true }
              as: LabLiaison
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-02T07:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111229", test_panel: "LACTATE", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o_lac: $.data.id }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s_in: $.data.id }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o_lac}", tube_code: "EDTA_LAVENDER", volume_ml: 2.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s_out: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:30:00Z" }
              as: CenterSupervisor
          trigger:
            - call: "POST /psc/courier-runs/${r1}/commit-all"
              payload: {}
              as: LabLiaison
              captures: { committed: $.data.committed_specimen_count }
            - call: "GET /psc/specimens/${s_out}"
              payload: {}
              as: LabLiaison
              captures: { out_status: $.data.status }
          assert:
            - "${committed} == 1, so only the in-window specimen was assigned"
            - "Specimen.${s_in}.status == ASSIGNED and ${out_status} == UNASSIGNED"
            - "the response is an object envelope rather than a partial-failure array"
            - "the out-of-window specimen raised no error and simply stayed put"

      - name: a_staff_pending_hold_expires_by_derived_read_and_never_auto_transitions
        claim_type: scheduled_actions
        grounds:
          - entities.Appointment.fields.draw_hold_expired
          - state_machines.Appointment.transitions.CHECKED_IN_to_STAFF_PENDING
          - endpoints.POST_/psc/run-ops
        distinguishing_aspect: "The hold is a deferred effect resolved only by reading: advancing the clock past draw_hold_expires_utc flips draw_hold_expired to true while draw_state stays STAFF_PENDING, so the expiry is never an automatic transition and cannot be silently reverted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:30:00Z. A PEDIATRIC-capable center whose roster carries only a LABEL_PBS phlebotomist and draw_hold_minutes 30, with an ELIGIBLE PEDIATRIC order checked in."
          setup_api_calls:
            - *k_clock
            - call: "POST /psc/service-centers"
              payload: { name: "Aurora Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 2, open_local_minutes: 480, close_local_minutes: 1020, pediatric_capable: true, draw_hold_minutes: 30 }
              as: CenterSupervisor
              captures: { c1: $.data.id }
            - *k_seed
            - call: "POST /psc/phlebotomists"
              payload: { service_center_id: "${c1}", full_name: "Omar Vela", credential: "LABEL_PBS", shift_start_local_minutes: 420, shift_end_local_minutes: 1020 }
              as: CenterSupervisor
            - call: "POST /psc/patients"
              payload: { full_name: "Kid Sato", birth_date: "2016-03-03T00:00:00Z", mrn: "MRN-3103-D1" }
              as: IntakeCoordinator
              captures: { pk: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${pk}", ordering_provider_npi: "1700111230", test_panel: "CMP", collection_mode: "PEDIATRIC", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { ok_order: $.data.id }
            - call: "POST /psc/test-orders/${ok_order}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { vk: $.data.version }
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${ok_order}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${vk}" }
              as: IntakeCoordinator
              captures: { ak: $.data.id }
            - call: "POST /psc/appointments/${ak}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${pk}"
            - call: "POST /psc/appointments/${ak}/call"
              payload: {}
              as: IntakeCoordinator
              captures: { credential_err: $.data.error_id }
          trigger:
            - call: "GET /psc/appointments/${ak}"
              payload: {}
              as: IntakeCoordinator
              captures: { expired_before: $.data.draw_hold_expired, state_before: $.data.draw_state }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T14:01:00Z" }
              as: CenterSupervisor
            - call: "POST /psc/run-ops"
              payload: { service_center_id: "${c1}" }
              as: CenterSupervisor
            - call: "GET /psc/appointments/${ak}"
              payload: {}
              as: IntakeCoordinator
              captures: { expired_after: $.data.draw_hold_expired, state_after: $.data.draw_state }
          assert:
            - "${credential_err} == ERR_STAFF_CREDENTIAL_INSUFFICIENT"
            - "${state_before} == STAFF_PENDING and ${expired_before} == false"
            - "${expired_after} == true, so the hold expired on the clock alone"
            - "${state_after} == STAFF_PENDING, confirming no automatic transition fired"
            - "Appointment.${ak}.draw_hold_expires_utc == 2026-09-01T14:00:00Z"

      - name: a_center_listing_never_exposes_another_centers_courier_runs
        claim_type: multi_tenancy
        grounds:
          - endpoints.GET_/psc/courier-runs
          - entities.CourierRun.fields.service_center_id
          - endpoints.POST_/psc/courier-runs
        distinguishing_aspect: "Courier runs are partitioned by service_center_id: a filter naming one center returns only that center's runs, so a run planned at a second center never leaks into the first center's listing."
        test_recipe:
          setup:
            - "Logical clock set; two centers, each with one OUTBOUND run at a distinct dispatch instant."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /psc/service-centers"
              payload: { name: "Borealis Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 2, open_local_minutes: 480, close_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { c2: $.data.id }
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T16:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c2}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T17:00:00Z" }
              as: LabLiaison
              captures: { r2: $.data.id }
          trigger:
            - call: "GET /psc/courier-runs"
              payload: { service_center_id: "${c1}" }
              as: LabLiaison
              captures: { first: "$.data[0].id" }
            - call: "GET /psc/courier-runs"
              payload: { service_center_id: "${c2}" }
              as: LabLiaison
              captures: { other: "$.data[0].id" }
          assert:
            - "${first} == ${r1} and ${other} == ${r2}"
            - "the center 1 listing returns exactly 1 row and never ${r2}"
            - "CourierRun.${r1}.service_center_id == ${c1} and CourierRun.${r2}.service_center_id == ${c2}"

      - name: estimate_write_cascades_through_the_order_to_the_balance
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/psc/test-orders/{testOrderId}/estimates
          - entities.TestOrder.fields.balance_remaining_cents
        excluded_because:
          difficulty_instance: estimate_chain_order_balance_to_occ_rejection_depth4
          rationale: "The four-hop cascade from estimate to order balance to version bump is walked call by call in that §1.8 instance."

      - name: wait_and_estimate_dual_variants
        claim_type: dual_variant_calculation
        grounds:
          - calculations.expected_wait_minutes
          - calculations.patient_service_estimate
        excluded_because:
          difficulty_instance: wait_dual_variant_on_appointment_queue
          rationale: "Both dual-variant calculations are asserted with their divergent literals in the two dual_variant_calc §1.8 instances."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: a_booking_past_the_future_horizon_is_rejected
        claim_type: Conditional action
        grounds:
          - errors[ERR_FUTURE_APPOINTMENT_TOO_FAR]
          - validations[priority=7]
          - endpoints.POST_/psc/appointments
        distinguishing_aspect: "The booked slot must fall inside [logical_clock_utc, logical_clock_utc + 10080 minutes]; a start exactly at the far edge is accepted and one minute beyond it is rejected with ERR_FUTURE_APPOINTMENT_TOO_FAR."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a center and two ELIGIBLE orders, so the horizon sits at 2026-09-08T13:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - call: "POST /psc/patients"
              payload: { full_name: "Bo Alvarez", birth_date: "1988-01-11T00:00:00Z", mrn: "MRN-3103-H1" }
              as: IntakeCoordinator
              captures: { p2: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p2}", ordering_provider_npi: "1700111231", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o2: $.data.id }
            - call: "POST /psc/test-orders/${o2}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o1}", scheduled_start_utc: "2026-09-08T13:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v1}" }
              as: IntakeCoordinator
              captures: { a_edge: $.data.id }
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o2}", scheduled_start_utc: "2026-09-08T13:01:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v2}" }
              as: IntakeCoordinator
              captures: { err_far: $.data.error_id }
          assert:
            - "the exact-horizon booking succeeded with Appointment.${a_edge}.scheduled_start_utc == 2026-09-08T13:00:00Z"
            - "${err_far} == ERR_FUTURE_APPOINTMENT_TOO_FAR"
            - "GET /psc/appointments?service_center_id=${c1} returns exactly 1 row"
            - "TestOrder.${o2}.status == SCHEDULED, since the resolve already moved it"
