scaffold_corner_design:
- section: entities
  instances:
  - name: create_property_missing_required_field_returns_invalid_request
    claim_type: required_field
    grounds:
    - entities.RightsProperty.fields.property_code
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required input field rights_fee_cents on property create returns ERR_INVALID_REQUEST (400); no entity is persisted.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /platform/properties
        payload:
          property_code: P-M1
          display_name: Missing
          sport: NFL
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 1
          exclusive_windows_count: 1
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          m1_err: $.data.error_id
      assert:
      - m1_err == ERR_INVALID_REQUEST
  - name: property_sport_enum_rejects_invalid_value
    claim_type: type_constraint
    grounds:
    - entities.RightsProperty.fields.sport
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: sport is an enum; 'CURLING' is not a member and must be rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /platform/properties
        payload:
          property_code: P-M2
          display_name: BadEnum
          sport: CURLING
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 1
          exclusive_windows_count: 1
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          m2_err: $.data.error_id
      assert:
      - m2_err == ERR_INVALID_REQUEST
  - name: viewer_default_tier_applied_when_omitted
    claim_type: defaults
    grounds:
    - entities.Viewer.fields.subscription_tier
    distinguishing_aspect: Viewer created without subscription_tier gets the declared default AD_SUPPORTED.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls:
      - call: POST /platform/viewers
        payload:
          email: d1@x.com
          home_region: '510'
        as: Viewer
        captures:
          v_d1: $.data.id
      trigger:
      - call: GET /platform/viewers/${v_d1}
        payload: {}
        as: PartnerManager
        captures:
          d1_tier: $.data.subscription_tier
      assert:
      - d1_tier == AD_SUPPORTED
  - name: computed_committed_units_ignores_input_override
    claim_type: computed_field
    grounds:
    - entities.CapacityPool.fields.committed_units
    distinguishing_aspect: 'committed_units is source: computed; a create-time client-supplied value is ignored and the server computes 0.'
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls:
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-D
          scope_kind: REGION
          total_units: 10
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_d_id: $.data.id
          pool_d_committed: $.data.committed_units
      trigger:
      - call: GET /platform/capacity-pools/${pool_d_id}
        payload: {}
        as: StreamOps
        captures:
          pool_d_committed2: $.data.committed_units
      assert:
      - pool_d_committed == 0
      - pool_d_committed2 == 0
  - name: get_property_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /platform/properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: RightsManager
        captures:
          nf_err: $.data.error_id
      assert:
      - nf_err == ERR_NOT_FOUND
  - name: list_properties_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope.pagination_fields
    distinguishing_aspect: List endpoint returns pagination fields limit/offset/total_count/has_more with declared defaults (limit 10, offset 0).
    test_recipe:
      setup:
      - Two properties exist
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-L1
          display_name: L1
          sport: NFL
          rights_fee_cents: 100
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 1
          exclusive_windows_count: 1
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
      - call: POST /platform/properties
        payload:
          property_code: P-L2
          display_name: L2
          sport: NBA
          rights_fee_cents: 100
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 1
          exclusive_windows_count: 1
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
      trigger:
      - call: GET /platform/properties
        payload: {}
        as: RightsManager
        captures:
          lst_total: $.data
      assert:
      - response envelope contains total_count == 2 and has_more == false with default limit 10
- section: state_machines
  instances:
  - name: window_cancel_from_terminal_complete_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.StreamingWindow.LIVE_to_COMPLETE
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: COMPLETE is terminal; POST cancel on a COMPLETE window returns ERR_INVALID_STATE and fires no side effects.
    test_recipe:
      setup:
      - Window completed (LIVE -> COMPLETE)
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-S1
          display_name: S1
          sport: MLB
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 3
          exclusive_windows_count: 3
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_s1_id: $.data.id
          p_s1_v: $.data.version
      - call: POST /platform/properties/${p_s1_id}/activate
        payload: {}
        as: RightsManager
      - call: GET /platform/properties/${p_s1_id}
        as: RightsManager
        captures:
          p_s1_v2: $.data.version
      - call: POST /platform/windows
        payload:
          property_id: ${p_s1_id}
          event_code: S1
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-22T18:00:00Z'
          scheduled_end: '2026-09-22T21:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 1
          replay_hours: 24
          expected_property_version: ${p_s1_v2}
        as: RightsManager
        captures:
          w_s1_id: $.data.id
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-S1
          scope_kind: REGION
          total_units: 10
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_s1_id: $.data.id
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_s1_id}
          window_id: ${w_s1_id}
          units: 1
        as: StreamOps
        captures:
          res_s1_id: $.data.id
      - call: POST /platform/capacity-reservations/${res_s1_id}/confirm
        payload: {}
        as: StreamOps
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-22T18:00:00Z'
        as: StreamOps
      - call: POST /platform/windows/${w_s1_id}/go-live
        payload: {}
        as: RightsManager
      - call: POST /platform/windows/${w_s1_id}/complete
        payload: {}
        as: RightsManager
      trigger:
      - call: POST /platform/windows/${w_s1_id}/cancel
        payload: {}
        as: RightsManager
        captures:
          s1_err: $.data.error_id
      assert:
      - s1_err == ERR_INVALID_STATE
  - name: territory_rule_lift_on_live_window_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.TerritoryRule.ACTIVE_to_LIFTED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Blackout lift precondition 'window SCHEDULED' fails once the window is LIVE; obligations are locked at go-live.
    test_recipe:
      setup:
      - Window LIVE; BLACKOUT rule ACTIVE on region 510
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-S2
          display_name: S2
          sport: NFL
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 3
          exclusive_windows_count: 3
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_s2_id: $.data.id
          p_s2_v: $.data.version
      - call: POST /platform/properties/${p_s2_id}/activate
        payload: {}
        as: RightsManager
      - call: GET /platform/properties/${p_s2_id}
        as: RightsManager
        captures:
          p_s2_v2: $.data.version
      - call: POST /platform/windows
        payload:
          property_id: ${p_s2_id}
          event_code: S2
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-23T18:00:00Z'
          scheduled_end: '2026-09-23T21:00:00Z'
          territory_scope:
          - '510'
          - '620'
          regional_block: true
          capacity_required_units: 1
          replay_hours: 0
          expected_property_version: ${p_s2_v2}
        as: RightsManager
        captures:
          w_s2_id: $.data.id
      - call: POST /platform/territory-rules
        payload:
          window_id: ${w_s2_id}
          region_code: '620'
          rule_kind: BLACKOUT
          effective_start: '2026-09-23T17:00:00Z'
          effective_end: '2026-09-23T20:00:00Z'
          broadcast_obligation_ref: BC-S2
        as: RightsManager
        captures:
          rule_s2_id: $.data.id
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-S2
          scope_kind: REGION
          total_units: 10
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_s2_id: $.data.id
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_s2_id}
          window_id: ${w_s2_id}
          units: 1
        as: StreamOps
        captures:
          res_s2_id: $.data.id
      - call: POST /platform/capacity-reservations/${res_s2_id}/confirm
        payload: {}
        as: StreamOps
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-23T18:00:00Z'
        as: StreamOps
      - call: POST /platform/windows/${w_s2_id}/go-live
        payload: {}
        as: RightsManager
      trigger:
      - call: POST /platform/territory-rules/${rule_s2_id}/lift
        payload: {}
        as: RightsManager
        captures:
          s2_err: $.data.error_id
      assert:
      - 's2_err == ERR_INVALID_STATE  # window is LIVE, not SCHEDULED'
  - name: reservation_confirm_after_hold_expiry_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.CapacityReservation.HELD_to_CONFIRMED
    - calculations.capacity_commit
    - errors[ERR_HOLD_EXPIRED]
    distinguishing_aspect: HELD reservation expires at creation + 900s; confirming after the logical clock passes hold_expires_at returns ERR_HOLD_EXPIRED.
    test_recipe:
      setup:
      - Reservation HELD at t0; clock advanced t0 + 901s
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-S3
          display_name: S3
          sport: NBA
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 3
          exclusive_windows_count: 3
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_s3_id: $.data.id
          p_s3_v: $.data.version
      - call: POST /platform/properties/${p_s3_id}/activate
        payload: {}
        as: RightsManager
      - call: GET /platform/properties/${p_s3_id}
        as: RightsManager
        captures:
          p_s3_v2: $.data.version
      - call: POST /platform/windows
        payload:
          property_id: ${p_s3_id}
          event_code: S3
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-24T18:00:00Z'
          scheduled_end: '2026-09-24T21:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 1
          replay_hours: 0
          expected_property_version: ${p_s3_v2}
        as: RightsManager
        captures:
          w_s3_id: $.data.id
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-S3
          scope_kind: REGION
          total_units: 10
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_s3_id: $.data.id
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-24T17:00:00Z'
        as: StreamOps
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_s3_id}
          window_id: ${w_s3_id}
          units: 1
        as: StreamOps
        captures:
          res_s3_id: $.data.id
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-24T17:15:01Z'
        as: StreamOps
      trigger:
      - call: POST /platform/capacity-reservations/${res_s3_id}/confirm
        payload: {}
        as: StreamOps
        captures:
          s3_err: $.data.error_id
      assert:
      - s3_err == ERR_HOLD_EXPIRED
  - name: window_initial_state_is_scheduled
    claim_type: initial_state
