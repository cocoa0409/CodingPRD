              as: AccreditedLab
              captures: { ft_id: $.data.id }
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { s2_sub: $.data.substantiation_state, s2_org: $.data.origin_state }
            - call: "POST /labeling/lab-tests/${ft_id}/results"
              payload: { measured_fibers: [{ fiber_generic_name: "COTTON", measured_pct: 56.9 }, { fiber_generic_name: "POLYESTER", measured_pct: 40.1 }, { fiber_generic_name: "ELASTANE", measured_pct: 3.0 }] }
              as: AccreditedLab
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { s3_sub: $.data.substantiation_state, s3_org: $.data.origin_state }
            - call: "POST /labeling/lab-tests/${ft_id}/retest"
              payload: { specimen_received_at: "2026-08-08T09:00:00Z", results_due_at: "2026-08-10T09:00:00Z" }
              as: AccreditedLab
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { s4_sub: $.data.substantiation_state, s4_org: $.data.origin_state }
            - call: "POST /labeling/lab-tests/${ft_id}/results"
              payload: { measured_fibers: [{ fiber_generic_name: "COTTON", measured_pct: 57.0 }, { fiber_generic_name: "POLYESTER", measured_pct: 40.0 }, { fiber_generic_name: "ELASTANE", measured_pct: 3.0 }] }
              as: AccreditedLab
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { s5_sub: $.data.substantiation_state, s5_org: $.data.origin_state }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "TRIM", country_code: "TR", value_added_usd: 0.40, weight_grams: 10.0, is_ornamentation: true }
