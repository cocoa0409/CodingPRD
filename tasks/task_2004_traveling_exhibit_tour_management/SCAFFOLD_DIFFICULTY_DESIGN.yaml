              payload: { crate_label: "CRATE-01", contents_value_cents: 500000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Poster House", city: "NYC", climate_controlled: true, max_gallery_sqm: 500, local_sponsorship_cap_cents: 50000 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_v: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-04T00:00:00Z", close_date: "2026-10-04T00:00:00Z", teardown_end: "2026-10-07T00:00:00Z", projected_attendance: 2000, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract"
              payload: { base_fee_cents: 300000, sponsorship_credit_cents: 0 }
              as: TourManager
              captures: { contract_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/marketing-kit"
              payload: { language_count: 2, sponsor_logo_slots: 1 }
              as: TourManager
              captures: { kit_id: $.data.id }
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 500000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "RETIRE" }
              as: TourManager
          assert:
            - "Tour.${tour_id}.status == RETIRED"
            - "TourStop.${stop_id}.status == CANCELLED"
            - "ParticipationContract.${contract_id}.status == FINALIZED and final_fee_cents == 0"
            - "MarketingKit.${kit_id}.status == RETIRED"
            - "InsuranceCertificate.${cert_id}.status == VOID"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_temporal_on_stop_booking
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: |
          Pair (state, business_temporal): booking with a stale
          expected_tour_version AND an overlapping venue window returns
          ERR_STALE_VERSION (priority 4), never ERR_VENUE_DOUBLE_BOOKED (8).
        test_recipe:
          setup:
            - "Tour T with one existing stop S1 at venue V for [2026-09-01, 2026-10-07); client holds a stale tour version"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Arms", exhibit_code: "ARMS-2026", crate_count: 1, declared_value_cents: 4000000, refurbishment_gap_days: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
