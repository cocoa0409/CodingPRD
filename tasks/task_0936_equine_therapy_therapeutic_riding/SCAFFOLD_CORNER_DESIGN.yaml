      - name: assessment_filing_with_a_stale_rider_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[assessment-create-stale-rider]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "The OCC parent here is the Rider, not the Session: filing an assessment supersedes the prior one, so a second filing that still carries the pre-supersede rider version is rejected with 412."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z; one rider with an ACTIVE release and one RECORDED assessment already filed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
