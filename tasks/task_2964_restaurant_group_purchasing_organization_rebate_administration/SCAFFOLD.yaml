    side_effects: ["ACTIVE -> SUSPENDED; increments ManufacturerDeal.version by 1."]
  - method: POST
    path: "/manufacturer-deals/{deal_id}/resume"
    description: "Return a SUSPENDED deal to ACTIVE."
    roles: [GpoAdmin]
    code: 200
    input: []
