            - "after the 5th escalation: Provider.${tp_id}.status == SUSPENDED"
            - "link 3: LicenseAgreement.${ta2_id}.status == PROBATION and probation_count == 1 although no call in this recipe ever targeted ${ta2_id} after its activation"
            - "LicenseAgreement.${ta2_id}.version == 3 (create 1 -> activate 2 -> cascade 3), proving the cascade mutation incremented the sibling's version"
            - "LicenseAgreement.${ta1_id}.probation_count == 1 (escalations 4 and 5 found it already PROBATION and did not re-fire the link-1 transition)"

      - name: renewal_batch_three_hop_cascade
        grounds:
          - state_machines.MembershipTerm.ACTIVE_to_RENEWED
          - state_machines.MembershipTerm.ACTIVE_to_LAPSED
          - calculations.household_standing
          - endpoints.POST_/api/_batch/renewal_run
        distinguishing_aspect: |
          Depth-3 chain from the batch sweep (a different trigger than the
          complaint cascade): the sweep mutates the expiring terms (link 1:
          RENEWED/LAPSED); each term mutation recomputes its household's
          standing (link 2: Household.status); each household recomputation
          recomputes its members' standing (link 3: Member.in_good_standing),
          which is observable downstream as an enrollment rejection.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; household A buys a 1-year term with auto_renew_enabled=true; household B buys a 1-year term with auto_renew_enabled=false."
            - "A chapter hosts a DRIVER_SAFETY session 2027-09-05T09:00-11:00Z with capacity 10 (still SCHEDULED at the enrollment attempt)."
