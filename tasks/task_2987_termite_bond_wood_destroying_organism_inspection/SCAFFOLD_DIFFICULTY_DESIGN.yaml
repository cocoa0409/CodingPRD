  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_occupation_half_open_interval_adjacency_allowed
        grounds:
          - validations[priority=113]
          - errors.ERR_INSPECTOR_SCHEDULE_OVERLAP
          - entities.Inspection.scheduled_start_at
          - entities.Inspection.scheduled_end_at
          - endpoints[POST /inspections]
        distinguishing_aspect: |
          Resource entity: Inspector (a person's on-site time). Interval semantics: an explicit
          HALF-OPEN [scheduled_start_at, scheduled_end_at) window bounded by two client-supplied
          instants, capacity 1 per inspector per instant, where touching endpoints are legal in both
          directions. The four rejection shapes (right overlap, containment, containment-by, and the
          allowed adjacency) are all exercised against one 09:00-12:00 booking.
        test_recipe:
          setup:
            - "One FL property P1 and two FL WDO inspectors, insb and insc, both licensed to 2029-06-30."
            - "insb holds one DRAFT inspection occupying 2026-08-10T09:00:00Z .. 2026-08-10T12:00:00Z."
            - "Every probe below is a POST /inspections on the same property with purpose INITIAL, so nothing but the interval and the acting inspector varies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Cleo Ridge", license_number: "FL-10003", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insc: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T12:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { base: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-10T12:00:00Z", scheduled_end_at: "2026-08-10T14:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { after: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-10T07:00:00Z", scheduled_end_at: "2026-08-10T09:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { before: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-10T11:00:00Z", scheduled_end_at: "2026-08-10T13:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { err_straddle: $.data.error_id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-10T09:30:00Z", scheduled_end_at: "2026-08-10T10:30:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { err_inside: $.data.error_id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-10T08:00:00Z", scheduled_end_at: "2026-08-10T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { err_around: $.data.error_id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insc}", purpose: "INITIAL", scheduled_start_at: "2026-08-10T09:30:00Z", scheduled_end_at: "2026-08-10T10:30:00Z" }
              as: FieldInspector
              as_user_id: "${insc}"
              captures: { other: $.data.id }
          assert:
            - "probe 1 (12:00-14:00, previous end == new start) returns 201: adjacency is NOT an overlap because the stored interval excludes its end instant"
            - "probe 2 (07:00-09:00, new end == existing start) returns 201: adjacency is legal on the left edge too"
            - "probe 3 (11:00-13:00) returns ERR_INSPECTOR_SCHEDULE_OVERLAP with HTTP 409 — it straddles the 12:00 seam and collides with BOTH stored intervals"
            - "probe 4 (09:30-10:30, strictly inside 09:00-12:00) returns ERR_INSPECTOR_SCHEDULE_OVERLAP with HTTP 409: containment counts as overlap"
            - "probe 5 (08:00-15:00, strictly containing every booking) returns ERR_INSPECTOR_SCHEDULE_OVERLAP with HTTP 409: containment in the other direction counts too"
            - "probe 6 is the SAME 09:30-10:30 window as the rejected probe 4 but acted by ${insc}, and returns 201 — the contended resource is the inspector, not the property or the calendar slot"
            - "the property now holds 4 inspections (base, after, before, other) and GET /inspections?property_id=${p1} returns total_count 4, so the three rejections created nothing"
            - "the three rejected probes are pure: no sequence_no was consumed by them, and the successful rows' sequence_no values are 1, 2, 3, 4 in creation order"

      - name: property_bond_coverage_occupancy_persists_through_lapse
        grounds:
          - validations[priority=106]
          - errors.ERR_DUPLICATE_ACTIVE_BOND
          - state_machines.Bond.ACTIVE_to_LAPSED
          - state_machines.Bond.LAPSED_to_TERMINATED
          - calculations.bond_term_and_lapse_windows
        distinguishing_aspect: |
          A different resource entity (Property, not Inspector) and genuinely different interval
          semantics: the occupied interval has NO client-supplied end instant. It opens at issuance
          and closes only when the occupying bond reaches TERMINATED, so it survives the whole
          365-day term, the 30-day grace and the 90-day reinstatement window. Capacity is 1 over the
          status set {ACTIVE, LAPSED}, which means the resource stays occupied by a bond that is
          already dead by date. Adjacency is therefore expressed in STATUS, not in timestamps.
