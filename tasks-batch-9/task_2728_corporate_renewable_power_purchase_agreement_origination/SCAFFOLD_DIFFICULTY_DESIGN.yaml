  # ===========================================================================
  # RULE 9 - cross_entity_state_dependency
  # Instance 1: entity pair = Deal <-> Offtaker (the anchor buyer's qualification
  #             gates signature).
  # Instance 2: entity pair = SettlementPeriod <-> RiskEvent (an undecided claim
  #             over the window gates invoicing). Different pair, different
  #             direction of dependency, different error.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: execute_blocked_by_conditional_then_under_review_anchor_offtaker
        grounds:
          - validations.priority_11_ERR_OFFTAKER_NOT_QUALIFIED
          - state_machines.Deal.TERMS_AGREED_to_EXECUTED
          - state_machines.Offtaker.CONDITIONAL_to_UNDER_REVIEW
          - state_machines.Offtaker.UNDER_REVIEW_to_QUALIFIED
          - endpoints.POST_/ppa/deals/{id}/execute
        distinguishing_aspect: |
          The dependency runs from Deal to OFFTAKER: the deal is internally perfect -
          status TERMS_AGREED, credit_status APPROVED, allocation fully confirmed,
          collateral requirement 0.00 - and the only thing standing between it and
          signature is a field on a DIFFERENT entity, Offtaker.qualification_status.
          The block is asserted twice from two different foreign states (CONDITIONAL,
          then UNDER_REVIEW), and the deal is unblocked without touching the deal at
          all: the identical execute request succeeds the moment the buyer reaches
          QUALIFIED. A CONDITIONAL buyer is deliberately allowed to negotiate and to
          clear credit, so the gate cannot be moved earlier in the flow.
        test_recipe:
          setup:
