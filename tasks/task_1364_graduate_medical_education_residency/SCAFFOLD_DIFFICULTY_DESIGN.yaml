  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: complement_revision_cycle_rejected_to_resubmitted
        grounds:
          - state_machines.ComplementApproval
          - concurrency_rules[complement-update-stale-version]
        distinguishing_aspect: |
          ComplementApproval contains a revision CYCLE (SUBMITTED -> REJECTED ->
          PUT edit -> SUBMITTED -> APPROVED -> LOCKED), unlike the linear
          AcademicYear pipeline; the cycle is exercised end-to-end including the
          OCC-guarded edit while REJECTED.
        test_recipe:
          setup:
            - "Program and PLANNING year exist; complement row created (DRAFT, version 1)"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "OBGYN GME", specialty: "OBSTETRICS_GYNECOLOGY", acgme_program_code: "220-00-0006" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 2, approved_positions: 3, annual_funding_budget_cents: 50000000, blended_stipend_cents: 6200000 }, as: ProgramDirector, captures: { comp: "$.data.id", v1: "$.data.version" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/reject", payload: {}, as: DesignatedInstitutionalOfficial, captures: { rej: "$.data.status", v3: "$.data.version" } }
          trigger:
            - { call: "PUT /residency-programs/complement-approvals/${comp}", payload: { approved_positions: 6, expected_complement_approval_version: "${v3}" }, as: ProgramDirector, captures: { v4: "$.data.version" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector, captures: { st2: "$.data.status" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial, captures: { st3: "$.data.status" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/lock", payload: {}, as: DesignatedInstitutionalOfficial, captures: { st4: "$.data.status" } }
          assert:
            - "After reject: status == REJECTED and version == 3 (create 1, submit 2, reject 3)"
            - "PUT while REJECTED succeeds with expected_complement_approval_version == 3: approved_positions == 6, version == 4, status stays REJECTED"
            - "Second submit transitions REJECTED -> SUBMITTED (revision cycle closes the loop)"
            - "approve -> APPROVED, lock -> LOCKED (terminal)"
            - "version increments by exactly 1 on each of the 6 mutations (final version == 7)"

      - name: resident_lifecycle_and_standing_parallel_dimensions
        grounds:
          - state_machines.Resident
          - state_machines.ResidentStanding
          - calculations.standing_resolution
        distinguishing_aspect: |
          Resident carries two PARALLEL state dimensions that evolve
          independently: lifecycle moves ACTIVE -> ON_LEAVE -> ACTIVE while
          standing is UNDER_REMEDIATION, and standing moves
          UNDER_REMEDIATION -> ON_PROBATION -> (lift) -> UNDER_REMEDIATION ->
          GOOD_STANDING while lifecycle stays ACTIVE — including the derived-
          standing recompute where lifting probation does NOT reach
          GOOD_STANDING because a remediation plan is still ACTIVE.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement (4 positions), resident R ACTIVE/GOOD_STANDING"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0007" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 4, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
          trigger:
            - { call: "POST /residency-programs/remediation-plans", payload: { resident_id: "${res}", goals: "Improve sign-out documentation", start_date: "2026-08-01", end_date: "2026-10-30" }, as: ProgramDirector, captures: { rem: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/place-on-leave", payload: {}, as: ProgramDirector, captures: { lc1: "$.data.lifecycle_status", st1: "$.data.standing_status" } }
            - { call: "POST /residency-programs/residents/${res}/return-from-leave", payload: {}, as: ProgramDirector, captures: { lc2: "$.data.lifecycle_status", st2: "$.data.standing_status" } }
            - { call: "POST /residency-programs/probation-cases", payload: { resident_id: "${res}", reason: "Repeated unprofessional conduct" }, as: ProgramDirector, captures: { prob: "$.data.id", st3: "$.data" } }
            - { call: "POST /residency-programs/probation-cases/${prob}/lift", payload: {}, as: ProgramDirector }
            - { call: "GET /residency-programs/residents/${res}", payload: {}, as: ProgramDirector, captures: { lc4: "$.data.lifecycle_status", st4: "$.data.standing_status" } }
            - { call: "POST /residency-programs/remediation-plans/${rem}/complete", payload: { outcome: "SUCCESS" }, as: ProgramDirector }
            - { call: "GET /residency-programs/residents/${res}", payload: {}, as: ProgramDirector, captures: { lc5: "$.data.lifecycle_status", st5: "$.data.standing_status" } }
          assert:
            - "After remediation create: lifecycle_status == ACTIVE and standing_status == UNDER_REMEDIATION (standing moved, lifecycle untouched)"
            - "After place-on-leave: (ON_LEAVE, UNDER_REMEDIATION) — lifecycle moves while standing holds"
            - "After return-from-leave: (ACTIVE, UNDER_REMEDIATION)"
            - "After probation create: (ACTIVE, ON_PROBATION)"
            - "After probation lift: standing_status == UNDER_REMEDIATION, NOT GOOD_STANDING — the still-ACTIVE remediation plan wins the standing_resolution recompute"
            - "After remediation complete SUCCESS: (ACTIVE, GOOD_STANDING) — both dimensions back at nominal with no drift"

      - name: case_log_reject_resubmit_cycle
        grounds:
          - state_machines.ProcedureCaseLog
        distinguishing_aspect: |
          ProcedureCaseLog has a resubmission CYCLE (LOGGED -> REJECTED ->
          LOGGED -> VERIFIED), unlike the ComplementApproval revision cycle —
          different entity, different loop semantics (reviewer rejection returns
          the log to its initial state for another attempt).
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident ACTIVE, one rotation"
            - "One MAJOR_SURGERY case log in LOGGED status"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro Surgery", specialty: "GENERAL_SURGERY", acgme_program_code: "440-00-0008" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog}", name: "Trauma Surgery", min_pgy_level: 1, max_residents_per_block: 3 }, as: ProgramCoordinator, captures: { rot: "$.data.id" } }
            - { call: "POST /residency-programs/procedure-case-logs", payload: { resident_id: "${res}", rotation_id: "${rot}", procedure_category: "MAJOR_SURGERY", performed_date: "2026-08-03", role: "SURGEON" }, as: Resident, as_user_id: "${res}", captures: { cl: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /residency-programs/procedure-case-logs/${cl}/reject", payload: { rejection_reason: "Wrong category" }, as: FacultyEvaluator, as_user_id: "ev-9", captures: { s1: "$.data.status" } }
            - { call: "POST /residency-programs/procedure-case-logs/${cl}/resubmit", payload: {}, as: Resident, as_user_id: "${res}", captures: { s2: "$.data.status" } }
            - { call: "POST /residency-programs/procedure-case-logs/${cl}/verify", payload: {}, as: FacultyEvaluator, as_user_id: "ev-9", captures: { s3: "$.data.status", v4: "$.data.version" } }
          assert:
            - "reject: status == REJECTED (LOGGED -> REJECTED)"
            - "resubmit: status == LOGGED (cycle REJECTED -> LOGGED)"
            - "verify after the cycle: status == VERIFIED, version == 4 (create 1, reject 2, resubmit 3, verify 4)"
            - "GET case-progress for the resident counts this log once (verified_primary == 1 in MAJOR_SURGERY) — the cycle leaves no double count"

      - name: citation_escalation_re_response_cycle
        grounds:
          - state_machines.AccreditationCitation
          - calculations.program_accreditation_status
        distinguishing_aspect: |
          AccreditationCitation has a re-response CYCLE (RESPONSE_SUBMITTED ->
          ESCALATED -> RESPONSE_DRAFTED -> RESPONSE_SUBMITTED -> RESOLVED),
          distinct from the complement and case-log cycles; the program's
          derived accreditation_status tracks the unresolved SERIOUS count
          throughout the loop.
        test_recipe:
          setup:
            - "Program exists with one DIO-recorded SERIOUS citation (OPEN); program accreditation_status flipped to CONTINUED_WITH_WARNING"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0009" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/accreditation-citations", payload: { program_id: "${prog}", citation_code: "IV.A.2", severity: "SERIOUS", area_code: "DUTY_HOURS", due_date: "2026-12-01" }, as: DesignatedInstitutionalOfficial, captures: { cit: "$.data.id" } }
          trigger:
            - { call: "GET /residency-programs/${prog}", payload: {}, as: DesignatedInstitutionalOfficial, captures: { ps1: "$.data.accreditation_status" } }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/draft-response", payload: { response_text: "Root cause: schedule template lacked rest buffers." }, as: ProgramDirector, captures: { s1: "$.data.status" } }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/submit-response", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/escalate", payload: { escalation_reason: "Site visitor found response inadequate" }, as: DesignatedInstitutionalOfficial, captures: { s2: "$.data.status" } }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/draft-response", payload: { response_text: "Revised plan with quarterly audits." }, as: ProgramDirector, captures: { s3: "$.data.status" } }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/submit-response", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/resolve", payload: { resolution_note: "ACGME accepted revised response" }, as: DesignatedInstitutionalOfficial, captures: { s4: "$.data.status" } }
            - { call: "GET /residency-programs/${prog}", payload: {}, as: DesignatedInstitutionalOfficial, captures: { ps2: "$.data.accreditation_status" } }
          assert:
            - "While citation OPEN (SERIOUS, unresolved): program.accreditation_status == CONTINUED_WITH_WARNING"
            - "draft -> RESPONSE_DRAFTED; submit -> RESPONSE_SUBMITTED; escalate -> ESCALATED"
            - "ESCALATED -> draft-response is legal (cycle): status returns to RESPONSE_DRAFTED then RESPONSE_SUBMITTED"
            - "resolve -> RESOLVED; program.accreditation_status returns to CONTINUED (last unresolved SERIOUS cleared)"
            - "Citation version == 7 after six transitions (create 1 + 6 mutations)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 4, 4, 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ccc_unsatisfactory_probation_cascade
        grounds:
          - state_machines.CCCReview.IN_DELIBERATION_to_FINALIZED
          - state_machines.ResidentStanding.GOOD_STANDING_to_ON_PROBATION
          - state_machines.MoonlightingRequest.ACTIVE_to_REVOKED
          - calculations.standing_resolution
          - calculations.official_weekly_duty_hours
        distinguishing_aspect: |
          Depth-4 chain from POST /ccc-reviews/{id}/finalize (UNSATISFACTORY):
          finalize creates ProbationCase ACTIVE -> standing_resolution flips
          resident to ON_PROBATION -> standing sweep REVOKES the resident's
          ACTIVE moonlighting request (decision_reason STANDING_CHANGE) ->
          attributed moonlighting hours drop out of the weekly aggregate
          (summary reads 0.00). Each hop is caused by the previous hop, not by
          the finalize call directly. Trigger differs from the attest-triggered
          and survey-triggered cascades.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident R ACTIVE/GOOD_STANDING"
            - "R has an APPROVED-then-ACTIVATED moonlighting request [2026-08-03, 2026-10-01) 5.00 h/wk (clock 2026-08-10)"
            - "3 milestone evaluations for (R, year, H1) from evaluators ev-1..ev-3; CCC review OPEN then IN_DELIBERATION, chair-1 (not an evaluator)"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0010" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 4, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/moonlighting-requests", payload: { resident_id: "${res}", type: "INTERNAL", site_name: "Metro ICU", start_date: "2026-08-03", end_date: "2026-10-01", hours_per_week: 5.00 }, as: Resident, as_user_id: "${res}", captures: { mr: "$.data.id" } }
            - { call: "POST /residency-programs/moonlighting-requests/${mr}/submit", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/moonlighting-requests/${mr}/approve", payload: {}, as: ProgramDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 2 }, { competency: "MEDICAL_KNOWLEDGE", level: 2 }, { competency: "PROFESSIONALISM", level: 2 }, { competency: "COMMUNICATION", level: 2 }, { competency: "PRACTICE_BASED_LEARNING", level: 2 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 2 } ] }, as: FacultyEvaluator, as_user_id: "ev-1" }
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 2 }, { competency: "MEDICAL_KNOWLEDGE", level: 2 }, { competency: "PROFESSIONALISM", level: 2 }, { competency: "COMMUNICATION", level: 2 }, { competency: "PRACTICE_BASED_LEARNING", level: 2 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 2 } ] }, as: FacultyEvaluator, as_user_id: "ev-2" }
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 2 }, { competency: "MEDICAL_KNOWLEDGE", level: 2 }, { competency: "PROFESSIONALISM", level: 2 }, { competency: "COMMUNICATION", level: 2 }, { competency: "PRACTICE_BASED_LEARNING", level: 2 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 2 } ] }, as: FacultyEvaluator, as_user_id: "ev-3" }
            - { call: "POST /residency-programs/ccc-reviews", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1" }, as: CCCChair, as_user_id: "chair-1", captures: { ccc: "$.data.id" } }
            - { call: "POST /residency-programs/ccc-reviews/${ccc}/begin-deliberation", payload: {}, as: CCCChair, as_user_id: "chair-1" }
            - { call: "GET /residency-programs/moonlighting-requests/${mr}", payload: {}, as: ProgramDirector, captures: { mst: "$.data.status" } }
          trigger:
            - { call: "POST /residency-programs/ccc-reviews/${ccc}/finalize", payload: { outcome: "UNSATISFACTORY", milestone_levels: [ { competency: "PATIENT_CARE", level: 2 }, { competency: "MEDICAL_KNOWLEDGE", level: 2 }, { competency: "PROFESSIONALISM", level: 2 }, { competency: "COMMUNICATION", level: 2 }, { competency: "PRACTICE_BASED_LEARNING", level: 2 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 2 } ] }, as: CCCChair, as_user_id: "chair-1", captures: { cst: "$.data.status" } }
            - { call: "GET /residency-programs/probation-cases", payload: { resident_id: "${res}" }, as: ProgramDirector }
            - { call: "GET /residency-programs/residents/${res}", payload: {}, as: ProgramDirector, captures: { rst: "$.data.standing_status" } }
            - { call: "GET /residency-programs/moonlighting-requests/${mr}", payload: {}, as: ProgramDirector, captures: { mst2: "$.data.status", mreason: "$.data.decision_reason" } }
            - { call: "GET /residency-programs/residents/${res}/duty-hour-summary", payload: { week_start: "2026-08-10" }, as: ProgramDirector, captures: { moon: "$.data.attributed_moonlighting_hours" } }
          assert:
            - "Hop 1: CCCReview.${ccc}.status == FINALIZED and a ProbationCase exists for R with status ACTIVE and reason 'CCC outcome UNSATISFACTORY'"
            - "Hop 2: Resident.${res}.standing_status == ON_PROBATION"
            - "Hop 3: MoonlightingRequest.${mr} was ACTIVE before finalize (captured mst == ACTIVE) and is now REVOKED with decision_reason == STANDING_CHANGE"
            - "Hop 4: duty-hour-summary week 2026-08-10 attributed_moonlighting_hours == 0.00 (was 5.00 while ACTIVE)"
            - "Resident.${res}.lifecycle_status remains ACTIVE (standing cascade does not touch the lifecycle dimension)"

      - name: duty_violation_threshold_auto_remediation_cascade
        grounds:
          - state_machines.DutyHourLog.SUBMITTED_to_ATTESTED
          - calculations.duty_hour_violation_detection
          - state_machines.ResidentStanding.GOOD_STANDING_to_UNDER_REMEDIATION
          - state_machines.MoonlightingRequest.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Depth-5 chain from POST /duty-hour-logs/{id}/attest: the third
          attested short-rest pair creates the 3rd UNRESOLVED violation ->
          auto-creates a RemediationPlan (trigger_source DUTY_HOUR_VIOLATIONS,
          ACTIVE) -> standing_resolution flips the resident to
          UNDER_REMEDIATION -> moonlighting sweep REVOKES the ACTIVE request ->
          attributed hours drop to 0.00. Different trigger than the CCC
          finalize cascade (log attest vs committee action) and different
          intermediate entity (auto-created RemediationPlan vs ProbationCase).
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement, resident R ACTIVE/GOOD_STANDING"
            - "R has an ACTIVE moonlighting request [2026-08-03, 2026-09-01) 2.00 h/wk (approved while GOOD_STANDING with zero logged hours; clock 2026-08-05)"
