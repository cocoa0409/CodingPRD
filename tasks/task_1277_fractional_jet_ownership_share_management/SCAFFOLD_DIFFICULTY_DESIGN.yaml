              as: ProgramAdmin
              captures: { own_id: $.data.id }
            - call: "POST /shares"
              payload: { owner_id: "${own_id}", class_id: "${cls_mid}", fraction_numerator: 1, fraction_denominator: 8, purchase_price_cents: 12000000, schedule_method: "STRAIGHT_LINE", recovery_years: 5 }
              as: ProgramAdmin
              captures: { share_id: $.data.id }
            - call: "POST /shares/${share_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", billing_period: "2026-08" }
              as: FinanceOps
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-11-15T15:00:00Z", estimated_block_hours: 1.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OWNER_STANDING_BLOCKS — BookingRequest transition gated by Owner.state"
            - "BookingRequest.${bk_id}.booking_status remains REQUESTED"
            - "Share.${share_id}.hours_remaining_cy remains 100.00"

      - name: program_close_gated_by_invoice_states
        grounds:
          - state_machines.Program.WINDING_DOWN_to_CLOSED
          - state_machines.Invoice
          - errors[ERR_PROGRAM_NOT_CLOSABLE]
        distinguishing_aspect: |
          Pair Program→Invoice (different pair from Booking→Owner): close is
          valid only when NO invoice is in {OPEN, ISSUED, PAST_DUE, DISPUTED}.
          A single DISPUTED invoice anywhere in the program blocks close with
          ERR_PROGRAM_NOT_CLOSABLE even when all shares are CLOSED.
        test_recipe:
          setup:
            - "Program WINDING_DOWN; the only share CLOSED via settled exit; one invoice left DISPUTED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-CE2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /aircraft-classes"
              payload: { program_id: "${prog_id}", class_code: "MID", hourly_rate_cents: 450000, interchange_upgrade_multiplier_bp: 12500, monthly_fee_base_cents: 2500000, seats: 8 }
              as: ProgramAdmin
