            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Rejectable", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
