              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Introduce shared cache client", summary_internal: "Prerequisite library extraction", lines_changed: 200, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_p: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Adopt shared cache client", summary_internal: "Consumer migration onto the new client", lines_changed: 300, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_d: $.data.id }
            - call: "POST /change-requests/${cr_p}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_d}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_d}/dependencies"
              payload: { to_change_id: "${cr_p}", note: "must land after the library extraction" }
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_d}/approvals"
              payload: { kind: "TECHNICAL", decision: "APPROVE" }
              as: ChangeApprover
              as_user_id: "u-appr-1"
            - call: "GET /releases/${rel_id}"
              payload: {}
              as: ReleaseManager
