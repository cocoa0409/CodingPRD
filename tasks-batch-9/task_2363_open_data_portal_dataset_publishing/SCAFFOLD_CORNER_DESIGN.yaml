              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
            - call: "POST /open-data/ingest-runners"
              payload: { name: "ingest-runner-a", cooldown_minutes: 15 }
              as: PortalAdmin
              captures: { runner_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly Traffic Counts published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
            - call: "POST /open-data/datasets/${ds_id}/screen"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records"
              payload: { dataset_id: "${ds_id}", license_id: "${lic_id}", data_dictionary_field_count: 9, provenance_detail_lines: 24, contact_email: "datasets@dot.city.gov", declared_update_frequency: "WEEKLY", attribution_element_count: 6 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { md_id: "$.data.id" }
            - call: "POST /open-data/metadata-records/${md_id}/submit"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records/${md_id}/decide"
              payload: { decision: "ACCEPT" }
              as: PortalAdmin
            - call: "POST /open-data/privacy-assessments"
              payload: { dataset_id: "${ds_id}", declared_quasi_identifier_count: 2, declared_smallest_cell_size: 20, population_size: 100000 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
              captures: { pa_id: "$.data.id" }
            - call: "PATCH /open-data/privacy-assessments/${pa_id}"
              payload: { verified_smallest_cell_size: 20 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/submit"
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/decide"
              payload: { decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "pr-chief-1"
            - call: "POST /open-data/datasets/${ds_id}/mark-ready"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/datasets/${ds_id}/publish"
              payload: { initial_row_count: 50000 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "GET /open-data/datasets/${ds_id}"
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_v: "$.data.version" }
            - call: "POST /open-data/publication-pipelines"
              payload: { dataset_id: "${ds_id}", runner_id: "${runner_id}", cadence: "WEEKLY", window_start_minute: 540, window_duration_minutes: 120, alert_email: "pipeline-alerts@dot.city.gov", expected_dataset_version: "${ds_v}" }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { pl_id: "$.data.id" }
            - call: "POST /open-data/publication-pipelines/${pl_id}/arm"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/pipeline-runs"
              payload: { pipeline_id: "${pl_id}", scheduled_for_utc: "2026-08-01T09:00:00Z" }
              as: PortalAdmin
              captures: { run1_id: "$.data.id" }
            - call: "POST /open-data/pipeline-runs/${run1_id}/start"
              as: PortalAdmin
            - call: "POST /open-data/pipeline-runs/${run1_id}/report-failure"
              payload: { failure_code: "TIMEOUT" }
              as: PortalAdmin
            - call: "POST /open-data/pipeline-runs"
              payload: { pipeline_id: "${pl_id}", scheduled_for_utc: "2026-08-01T09:00:00Z" }
              as: PortalAdmin
              captures: { run2_id: "$.data.id" }
            - call: "POST /open-data/pipeline-runs/${run2_id}/start"
              as: PortalAdmin
            - call: "POST /open-data/pipeline-runs/${run2_id}/report-failure"
              payload: { failure_code: "TIMEOUT" }
              as: PortalAdmin
            - call: "POST /open-data/pipeline-runs"
              payload: { pipeline_id: "${pl_id}", scheduled_for_utc: "2026-08-01T09:00:00Z" }
              as: PortalAdmin
              captures: { run3_id: "$.data.id" }
            - call: "POST /open-data/pipeline-runs/${run3_id}/start"
              as: PortalAdmin
          trigger:
            - call: "POST /open-data/pipeline-runs/${run3_id}/report-success"
              payload: { rows_ingested: 45000 }
              as: PortalAdmin
          assert:
            - "After failure 1 PublicationPipeline.${pl_id}.consecutive_failure_count == 1 and status == ARMED"
            - "After failure 2 PublicationPipeline.${pl_id}.consecutive_failure_count == 2 and status == ARMED (the limit is 3)"
            - "After failure 2 Department.${dept_id}.credit_balance_units == 90.00, credits_escrowed_units == 4.00, credits_consumed_units == 6.00"
            - "PipelineRun.${run1_id}.status == FAILED with failure_code == TIMEOUT, alert_dispatched == true, total_charge_credits == 3.00, rows_ingested == 0"
            - "Response is 200 with response.data.status == SUCCEEDED and total_charge_credits == 19.00 (subtotal 20.00 with a 5% reliability discount)"
            - "PublicationPipeline.${pl_id}.consecutive_failure_count == 0 and status == ARMED"
            - "Department.${dept_id}.credit_balance_units == 75.00, credits_escrowed_units == 0.00, credits_consumed_units == 25.00"
            - "Dataset.${ds_id}.live_row_count == 45000, currency_status == CURRENT, next_due_at == 2026-08-08T09:00:00Z"

      - name: issue_acceptance_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.Dataset.PUBLISHED_to_UNDER_REMEDIATION
        excluded_because:
          difficulty_instance: transitive_cascade / issue_accept_privacy_remediation_four_hop_chain
          rationale: "That instance verifies all four hops of the acceptance cascade end to end in a single request, including the pipeline suspension and the department posture recomputation."

      - name: priority_score_dual_variant_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.dataset_priority_score
        excluded_because:
          difficulty_instance: dual_variant_calc / priority_score_declared_vs_observed_divergence_after_publish
          rationale: "That instance asserts both variants on one row and the delta produced by the publish switch."

  - section: consistency_model
    instances:
      - name: issue_acceptance_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /open-data/quality-issues/{issueId}/decide
        distinguishing_aspect: "The declared model is immediate, so no sweep, retry or second request is needed: the decide response itself carries the accepted issue with its correction clock, and reads taken straight afterwards already show the remediated dataset and the recomputed department posture."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Dataset 'weekly-traffic-counts' PUBLISHED under department DOT with compliance_posture OPEN and risk_points 0"
            - "One registered member has filed a CRITICAL/PRIVACY issue that has been TRIAGED"
            - "POST /open-data/ops-run is deliberately NOT called anywhere in this instance"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
