    instances:

      - name: unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /api/v1/pets without X-User-Role/X-User-ID returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/pets"
              payload: { owner_id: "00000000-0000-0000-0000-000000000000", name: "Anon", species: "DOG", weight_kg: 10 }
              as: ""
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: forbidden_role_for_endpoint
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /api/v1/sitters/{id}/reinstate by an Owner role returns 403 ERR_FORBIDDEN (PlatformAdmin only)."
        test_recipe:
          setup: ["A SUSPENDED Sitter exists."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "ofb@example.com", full_name: "O FB", phone: "+12025559040" }
              as: Anonymous
