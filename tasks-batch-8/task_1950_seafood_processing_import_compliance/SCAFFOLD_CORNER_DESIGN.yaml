scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: supplier_creation_defaults_and_envelope
        claim_type: creation
        grounds: [entities.ForeignSupplier, response_envelope]
        distinguishing_aspect: "A supplier is created with system-managed defaults: fsvp_status PENDING_EVALUATION, zeroed counters, null risk fields, version 1, server-minted UUID id; success envelope carries meta.api_request_id and response_type object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Pacific Harvest Ltd", country_code: "JP", facility_registration_number: "FRN-C01" }, as: ComplianceManager, captures: { sup_id: "$.data.id" } }
          trigger:
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager }
          assert:
            - "create response: fsvp_status == PENDING_EVALUATION, open_corrective_action_count == 0, total_species_mismatches == 0, total_haccp_deviations == 0, risk_score == null, risk_tier == null, next_evaluation_due == null, version == 1"
            - "id is a server-minted UUID (no type prefix); created_at has three fractional digits"
            - "envelope: meta.api_request_id present, response_type == object"
            - "omitted optional handles_histamine_susceptible_species defaults to false"

      - name: supplier_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.ForeignSupplier.fields.legal_name, "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "Omitting required legal_name on supplier creation fails schema validation with ERR_VALIDATION_FAILED (400) before any state or business rule runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /seafood/suppliers", payload: { country_code: "JP", facility_registration_number: "FRN-C02" }, as: ComplianceManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION_FAILED with http 400"
            - "error envelope carries data.error_id and data.message"

      - name: entry_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.ImportEntry.fields.transport_mode, "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "transport_mode outside {VESSEL, AIR, ROAD} (e.g. TRUCK) is rejected ERR_VALIDATION_FAILED (400); enum closure is enforced at the schema layer."
        test_recipe:
          setup: ["approved supplier exists"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Pacific Harvest Ltd", country_code: "JP", facility_registration_number: "FRN-C03" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
          trigger:
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-C03", species_declared: "TUNA", transport_mode: "TRUCK", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 1000, freight_cost_cents: 0, duty_rate_pct: 0.0, total_weight_kg: 10 }, as: ImportCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION_FAILED with http 400"

      - name: lot_computed_fields_and_ice_deduction
        claim_type: computed_fields
        grounds: [entities.ReceiptLot.fields.quantity_accepted_kg, entities.ReceiptLot.fields.remaining_kg, entities.ReceiptLot.fields.allocated_cost_cents, calculations.entry_cost_allocation]
        distinguishing_aspect: "quantity_accepted_kg is computed as round(100 * (1 - 2.5/100), 3) == 97.500; after accept the single ACCEPTED lot absorbs the entry's full allocatable_total_cents == 1080000 (goods 1000000 + freight 50000 + duty 30000)."
        test_recipe:
          setup: ["approved supplier; RELEASED entry with goods 1000000 / freight 50000 / duty_rate 0.03"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Pacific Harvest Ltd", country_code: "JP", facility_registration_number: "FRN-C04" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-C04", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 1000000, freight_cost_cents: 50000, duty_rate_pct: 0.03, total_weight_kg: 100 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
          trigger:
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Pacific", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO77", harvest_country_code: "US", production_method: "WILD", species_declared: "TUNA", grade: "A", quantity_received_kg: 100, ice_deduction_pct: 2.5, receiving_temp_c: 2.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id", acc: "$.data.quantity_accepted_kg", rem: "$.data.remaining_kg" } }
            - { call: "POST /seafood/haccp-monitoring-records", payload: { hazard_type: "HISTAMINE", receipt_lot_id: "${lot_id}", phase: "SCREENING", measured_value: 30.0, measured_at: "2026-07-25T10:00:00Z" }, as: QualityAssuranceTech }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "DNA_BARCODING", sample_size: 3, verified_species: "TUNA" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector, captures: { alloc: "$.data.allocated_cost_cents" } }
          assert:
            - "create response: quantity_accepted_kg == 97.500, remaining_kg == 97.500, consumed_kg == 0, mislabel_flag == false, cumulative_abuse_minutes == 0, allocated_cost_cents == 0"
            - "accept response: allocated_cost_cents == 1080000 (sole ACCEPTED lot absorbs full allocatable total)"

      - name: label_allergen_statement_computed
        claim_type: computed_fields
        grounds: [entities.ProductLabel.fields.allergen_statement]
        distinguishing_aspect: "allergen_statement is system-computed as 'Contains: Fish (Pacific Cod)' from market_name; it is not an input field."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /seafood/product-labels", payload: { market_name: "Pacific Cod", scientific_name: "Gadus macrocephalus", species: "COD", production_method: "WILD", country_of_origin: "US", keep_frozen_statement: true }, as: ComplianceManager, captures: { lbl_id: "$.data.id", stmt: "$.data.allergen_statement" } }
          assert:
            - "allergen_statement == 'Contains: Fish (Pacific Cod)'"
            - "status == DRAFT, approved_at == null, version == 1"

      - name: supplier_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SUPPLIER_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent supplier UUID returns ERR_SUPPLIER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /seafood/suppliers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ComplianceManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SUPPLIER_NOT_FOUND with http 404"

      - name: receipt_lots_list_pagination
        claim_type: listing
        grounds: [response_envelope.pagination_fields, "endpoints[\"GET /seafood/receipt-lots\"]"]
        distinguishing_aspect: "Filtered list honors limit/offset with total_count and has_more: limit 1 over 2 lots yields has_more true on page 1 and false on page 2; default limit is 10."
        test_recipe:
          setup: ["approved supplier; RELEASED entry; two receipt lots created (UNDER_INSPECTION)"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Pacific Harvest Ltd", country_code: "JP", facility_registration_number: "FRN-C07" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-C07", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 100000, freight_cost_cents: 5000, duty_rate_pct: 0.0, total_weight_kg: 60 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV A", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 30, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV B", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "B", quantity_received_kg: 30, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector }
          trigger:
            - { call: "GET /seafood/receipt-lots?import_entry_id=${ent_id}&limit=1&offset=0", payload: {}, as: ReceivingInspector }
            - { call: "GET /seafood/receipt-lots?import_entry_id=${ent_id}&limit=1&offset=1", payload: {}, as: ReceivingInspector }
          assert:
            - "page 1: response_type == array, exactly 1 row, total_count == 2, has_more == true"
            - "page 2: exactly 1 row, has_more == false"
            - "the two pages return disjoint lot ids"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: entry_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.ImportEntry]
        distinguishing_aspect: "A new ImportEntry starts in DRAFT with null prior_notice_filed_at / prior_notice_confirmation / entry_filed_at / duty_cents / allocatable_total_cents."
        test_recipe:
          setup: ["approved supplier exists"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Pacific Harvest Ltd", country_code: "JP", facility_registration_number: "FRN-S01" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
          trigger:
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-S01", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 1000, freight_cost_cents: 0, duty_rate_pct: 0.0, total_weight_kg: 10 }, as: ImportCoordinator, captures: { ent_id: "$.data.id", st: "$.data.status" } }
          assert:
            - "status == DRAFT; prior_notice_filed_at == null; prior_notice_confirmation == null; entry_filed_at == null; duty_cents == null; allocatable_total_cents == null; version == 1"

      - name: refused_entry_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.ImportEntry.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REFUSED is terminal: after fda-disposition REFUSED, a subsequent file-entry attempt is rejected ERR_INVALID_STATE (409) and no side effects fire."
        test_recipe:
          setup: ["approved supplier; entry advanced to ENTRY_FILED then REFUSED"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Pacific Harvest Ltd", country_code: "JP", facility_registration_number: "FRN-S02" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-S02", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 1000, freight_cost_cents: 0, duty_rate_pct: 0.0, total_weight_kg: 10 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "REFUSED" }, as: ImportCoordinator }
          trigger:
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "entry remains REFUSED; duty_cents remains null"

      - name: accept_rejected_lot_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ReceiptLot.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal for a ReceiptLot: accept after reject is rejected ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["approved supplier; RELEASED entry; lot created then rejected"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Pacific Harvest Ltd", country_code: "JP", facility_registration_number: "FRN-S03" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-S03", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 100000, freight_cost_cents: 5000, duty_rate_pct: 0.0, total_weight_kg: 30 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV A", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 30, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/receipt-lots/${lot_id}/reject", payload: { reason: "falsified catch documents" }, as: ReceivingInspector }
          trigger:
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; lot remains REJECTED"

      - name: reopen_blocked_after_finished_lot_recalled
        claim_type: precondition_enforcement
        grounds: [state_machines.ProcessingBatch.transitions.COMPLETED_to_IN_PROCESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "reopen is guarded by child state: the batch is COMPLETED (valid from-state), yet because one of its FinishedProductLot rows was RECALLED (via a recall cascade from a manual CA), reopen MUST fail ERR_INVALID_STATE — the guard is the child collection's state, not the batch's own."
        test_recipe:
          setup: ["COD batch COMPLETED with zero variance (no CA); one UNLABELED finished lot; MANUAL CA on the batch escalated with the lot in scope -> lot RECALLED while batch remains COMPLETED"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Harbor Fresh", country_code: "US", facility_registration_number: "FRN-S04" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-S04", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 100000, freight_cost_cents: 5000, duty_rate_pct: 0.0, total_weight_kg: 100 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Harbor", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 100, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "SENSORY", sample_size: 2, verified_species: "COD" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "COD", product_form: "FILLET" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_id}", quantity_kg: 100 }, as: ProcessingSupervisor }
            - { call: "GET /seafood/processing-batches/${bat_id}", payload: {}, as: ProcessingSupervisor, captures: { bat_v: "$.data.version" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/complete", payload: { expected_batch_version: "${bat_v}", actual_output_kg: 42.0, trim_waste_kg: 50.0, other_waste_kg: 8.0 }, as: ProcessingSupervisor }
            - { call: "POST /seafood/finished-product-lots", payload: { processing_batch_id: "${bat_id}", net_weight_kg: 42.0 }, as: ProcessingSupervisor, captures: { fin_id: "$.data.id" } }
            - { call: "POST /seafood/corrective-actions", payload: { source_type: "MANUAL", processing_batch_id: "${bat_id}", reason: "in-plant audit hold" }, as: ComplianceManager, as_user_id: "cm-01", captures: { ca_id: "$.data.id" } }
            - { call: "POST /seafood/corrective-actions/${ca_id}/escalate", payload: { reason: "in-plant recall", scope_lot_ids: ["${fin_id}"] }, as: ComplianceManager, as_user_id: "cm-01" }
          trigger:
            - { call: "POST /seafood/processing-batches/${bat_id}/reopen", payload: {}, as: ProcessingSupervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "FinishedProductLot.${fin_id}.status == RECALLED (recall cascade fired while lot was UNLABELED)"
            - "reopen rejected: error_id == ERR_INVALID_STATE with http 409 (child lot is RECALLED)"
            - "ProcessingBatch.${bat_id}.status remains COMPLETED"

      - name: recall_notify_then_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Recall, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recall INITIATED -> NOTIFIED via notify (notified_at stamped); NOTIFIED is terminal so a second notify fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["RELEASED finished lot exists; MANUAL corrective action on the batch escalated with the lot in scope -> Recall INITIATED"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Harbor Fresh", country_code: "US", facility_registration_number: "FRN-S05" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-S05", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 100000, freight_cost_cents: 5000, duty_rate_pct: 0.0, total_weight_kg: 100 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Harbor", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 100, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "SENSORY", sample_size: 2, verified_species: "COD" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "COD", product_form: "FILLET" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_id}", quantity_kg: 100 }, as: ProcessingSupervisor }
            - { call: "GET /seafood/processing-batches/${bat_id}", payload: {}, as: ProcessingSupervisor, captures: { bat_v: "$.data.version" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/complete", payload: { expected_batch_version: "${bat_v}", actual_output_kg: 42.0, trim_waste_kg: 50.0, other_waste_kg: 8.0 }, as: ProcessingSupervisor }
            - { call: "POST /seafood/processing-batches/${bat_id}/reconcile", payload: {}, as: ProcessingSupervisor }
            - { call: "POST /seafood/finished-product-lots", payload: { processing_batch_id: "${bat_id}", net_weight_kg: 42.0 }, as: ProcessingSupervisor, captures: { fin_id: "$.data.id" } }
            - { call: "POST /seafood/product-labels", payload: { market_name: "Pacific Cod", scientific_name: "Gadus macrocephalus", species: "COD", production_method: "WILD", country_of_origin: "US", keep_frozen_statement: true }, as: ComplianceManager, captures: { lbl_id: "$.data.id" } }
            - { call: "POST /seafood/product-labels/${lbl_id}/approve", payload: {}, as: ComplianceManager }
            - { call: "POST /seafood/finished-product-lots/${fin_id}/apply-label", payload: { product_label_id: "${lbl_id}" }, as: ProcessingSupervisor }
            - { call: "POST /seafood/finished-product-lots/${fin_id}/release", payload: {}, as: ComplianceManager }
