scenario: "Multi-Program Social Service Agency Funding Braiding & Client Intake (Catholic Charities): diocesan agency operating many programs across housing, food, counseling, immigration and refugee services with distinct funding streams, single-door client intake with assessment routing into program eligibility screens that differ by funder, funding braiding where one client's services draw from multiple grants with cost allocation and prohibited duplication, government contract compliance with unit-of-service billing and audit-ready documentation, faith-based provider rules on nondiscrimination in service delivery and permissible activities under public funding, volunteer and parish partnership coordination for in-kind support, outcome reporting per funder with differing measures and periods, agency-wide client record confidentiality across programs"

domain_name: "social-service-funding-braiding"
api_prefix: "/api"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# §1.0 Response Envelope (FIXED)
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# §1.1 Entity-Relationship Table
entities:
  - name: Funder
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the funding source
        constraints: non-empty, unique across Funders
      - name: funder_type
        type: enum
        source: input
        description: category of the funding source
        constraints: "one of {FEDERAL, STATE, COUNTY, PRIVATE_FOUNDATION, DIOCESAN, PARISH}"
      - name: allow_faith_based_activity
        type: boolean
        source: input
        description: whether this funder permits public dollars to support an explicitly religious activity component
      - name: requires_time_and_effort_documentation
        type: boolean
        source: input
        description: whether the funder requires documented staff time-and-effort records for allocation
      - name: max_admin_rate_pct
        type: number
        source: input
        description: ceiling on the administrative cost share this funder will reimburse
        constraints: "0.0 <= value <= 0.25"
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: first month of the funder's fiscal year
        constraints: "1 <= value <= 12"
      - name: status
        type: enum
        source: computed
        description: lifecycle of the funding source record
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: public name of the service program
        constraints: non-empty, unique across Programs
      - name: service_domain
        type: enum
        source: input
        description: the service domain this program delivers
        constraints: "one of {HOUSING, FOOD, COUNSELING, IMMIGRATION, REFUGEE}"
      - name: faith_based_activity_offered
        type: boolean
        source: input
        description: whether the program includes an explicitly religious activity component
      - name: nondiscrimination_attested
        type: boolean
        source: input
        description: whether the program has attested it serves clients without regard to religion
        default: false
      - name: capacity_slots
        type: integer
        source: input
        description: maximum number of concurrent open enrollments the program may carry
        constraints: "value >= 0"
      - name: enrolled_slots
        type: integer
        source: computed
        description: computed count of Enrollment rows for this program whose status IN {PENDING, ACTIVE, SUSPENDED}
        default: 0
      - name: active_slots
        type: integer
        source: computed
        description: reporting-only count of Enrollment rows for this program with status == ACTIVE, evaluated under the active_only_count variant of program_capacity_consumption
        default: 0
      - name: match_eligible
        type: boolean
        source: input
        description: whether in-kind contributions to this program count toward a grant matching requirement
        default: false
      - name: status
        type: enum
        source: computed
        description: lifecycle of the program
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"

  - name: Grant
    parent: Funder
    common_fields: true
    fields:
      - name: funder_id
        type: string
        source: input
        description: "FK -> Funder.id; the funding source that made this award"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program this award funds"
      - name: grant_code
        type: string
        source: input
        description: funder-assigned award identifier
        constraints: non-empty, unique across Grants
      - name: total_award_cents
        type: integer
        source: input
        description: total obligated award amount in cents
        constraints: "value >= 0"
      - name: expended_cents
        type: integer
        source: computed
        description: sum of allocated_amount_cents plus admin_amount_cents over CostAllocation rows for this grant whose status IN {COMMITTED}
        default: 0
      - name: obligated_cents
        type: integer
        source: computed
        description: sum of allocated_amount_cents plus admin_amount_cents over CostAllocation rows for this grant whose status IN {PROVISIONAL}
        default: 0
      - name: admin_rate_pct
        type: number
        source: input
        description: administrative cost share applied to allocations drawn from this grant
        constraints: "0.0 <= value <= 0.25"
      - name: allocation_rank
        type: integer
        source: input
        description: braiding precedence of this grant within a program; lower value is drawn first
        constraints: "value >= 1"
      - name: max_in_kind_rate_cents
        type: integer
        source: input
        description: ceiling on the per-hour value credited for in-kind contributions to this grant
        constraints: "value >= 0"
      - name: matching_requirement_pct
        type: number
        source: input
        description: fraction of total_award_cents the grantee must match with in-kind contributions
        constraints: "0.0 <= value <= 1.0"
      - name: cost_allocation_basis
        type: enum
        source: input
        description: the funder-mandated basis for distributing shared costs
        constraints: "one of {DIRECT_ONLY, HEADCOUNT, TIME_AND_EFFORT, SQUARE_FOOTAGE}"
      - name: restricted_purpose
        type: enum
        source: input
        description: the service purpose this award may be spent on
        constraints: "one of {HOUSING_ASSISTANCE, FOOD_DISTRIBUTION, CLINICAL_COUNSELING, LEGAL_IMMIGRATION, REFUGEE_RESETTLEMENT, GENERAL_OPERATING}"
      - name: period_start
        type: datetime
        source: input
        description: first instant of the award period, inclusive
      - name: period_end
        type: datetime
        source: input
        description: last instant of the award period, inclusive
      - name: burn_ratio
        type: number
        source: computed
        description: computed committed-to-award ratio, 6 decimal places round_half_up
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: posture of the award derived by calculation grant_burn_posture
        default: OPEN
        constraints: "one of {OPEN, THROTTLED, FROZEN}"
      - name: posture_computed_at
        type: datetime
        source: computed
        description: logical-clock instant at which status and burn_ratio were last recomputed

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: client legal name
        constraints: non-empty
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 calendar date of birth
      - name: household_size
        type: integer
        source: input
        description: number of persons in the client's household
        constraints: "value >= 1"
      - name: immigration_status
        type: enum
        source: input
        description: immigration category relevant to funder eligibility screens
        constraints: "one of {CITIZEN, LPR, REFUGEE, ASYLEE, UNDOCUMENTED, PENDING_ASYLUM}"
      - name: county_code
        type: string
        source: input
        description: county of residence used by county funders
      - name: confidentiality_tier
        type: enum
        source: input
        description: agency-wide record protection tier governing cross-program sharing
        default: STANDARD
        constraints: "one of {STANDARD, PROTECTED, SEALED}"
      - name: consent_scope
        type: array
        source: input
        description: list of service_domain values the client has consented to share across programs
        default: []
      - name: consent_expires_on
        type: datetime
        source: input
        description: logical-clock instant after which consent_scope no longer authorizes sharing
      - name: open_enrollment_count
        type: integer
        source: computed
        description: computed count of Enrollment rows for this client whose status IN {PENDING, ACTIVE, SUSPENDED}
        default: 0
      - name: shareable_domains
        type: array
        source: computed
        description: reporting-only list of service_domain values this client consents to share, evaluated under the consent_first variant of confidentiality_scope_resolution
        default: []

  - name: IntakeAssessment
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client being assessed at the single door"
      - name: assessment_date
        type: datetime
        source: input
        description: logical-clock instant the assessment was opened
      - name: presenting_needs
        type: array
        source: input
        description: free-text list of needs recorded by the intake specialist
        constraints: at least one element
      - name: requested_domains
        type: array
        source: input
        description: list of service_domain values the client asked to be screened for
        constraints: at least one element
      - name: assessed_by_user_id
        type: string
        source: input
        description: X-User-ID of the IntakeSpecialist who opened the assessment
      - name: routing_outcome
        type: enum
        source: computed
        description: outcome of routing the assessment into program eligibility screens
        default: PENDING
        constraints: "one of {PENDING, ROUTED, NO_ELIGIBLE_PROGRAM, WITHDRAWN}"
      - name: return_reason_code
        type: enum
        source: input
        description: reason the compliance reviewer returned the assessment
        constraints: "one of {INCOMPLETE_INCOME, MISSING_DOCUMENT, WRONG_DOMAIN, null}"
      - name: status
        type: enum
        source: computed
        description: lifecycle state of the assessment
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ROUTED, RETURNED, CLOSED}"

  - name: EligibilityScreen
    parent: IntakeAssessment
    common_fields: true
    fields:
      - name: intake_assessment_id
        type: string
        source: input
        description: "FK -> IntakeAssessment.id; the single-door assessment that spawned this screen"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program being screened for"
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; the funding stream whose eligibility rules govern this screen"
      - name: verified_income_cents
        type: integer
        source: input
        description: documented monthly household income in cents
        constraints: "value >= 0"
      - name: household_size_at_screen
        type: integer
        source: input
        description: household size as verified at screening time
        constraints: "value >= 1"
      - name: determination
        type: enum
        source: computed
        description: eligibility dimension outcome
        default: PENDING
        constraints: "one of {PENDING, ELIGIBLE, INELIGIBLE}"
      - name: denial_reason_code
        type: enum
        source: computed
        description: reason recorded when determination is INELIGIBLE
        constraints: "one of {INCOME_OVER_LIMIT, RESIDENCY, IMMIGRATION_STATUS, PROGRAM_AT_CAPACITY, CONFIDENTIALITY_BAR, null}"
      - name: verification_state
        type: enum
        source: computed
        description: independent documentation-verification dimension on the same row
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED, EXPIRED}"
      - name: screened_at
        type: datetime
        source: computed
        description: logical-clock instant the screen was created

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the enrolled client"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program the client is enrolled in"
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; the grant designated as the primary funder of record"
      - name: enrolled_at
        type: datetime
        source: computed
        description: logical-clock instant the enrollment was created
      - name: exited_at
        type: datetime
        source: computed
        description: logical-clock instant the enrollment reached EXITED
      - name: exit_reason
        type: enum
        source: computed
        description: reason recorded at exit
        constraints: "one of {COMPLETED, WITHDRAWN, TRANSFERRED, GRANT_TERMINATED, NONCOMPLIANCE, null}"
      - name: status
        type: enum
        source: computed
        description: lifecycle state of the enrollment
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, SUSPENDED, EXITED, DENIED}"

  - name: ServiceAuthorization
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this authorization draws against"
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; the grant that bears the authorized units"
      - name: service_code
        type: enum
        source: input
        description: unit-of-service code billed to the funder
        constraints: "one of {HOUSING_RENT_ASSIST, FOOD_PANTRY_BOX, CLINICAL_COUNSELING_HOUR, IMMIGRATION_LEGAL_HOUR, REFUGEE_CASE_MGMT_HOUR}"
      - name: authorized_units
        type: integer
        source: input
        description: number of service units authorized
        constraints: "value >= 1"
      - name: unit_rate_cents
        type: integer
        source: input
        description: contract unit rate in cents for this service code
        constraints: "value >= 1"
      - name: units_delivered
        type: integer
        source: computed
        description: running sum of ServiceDelivery.units_delivered for this authorization whose status IN {DOCUMENTED, BILLED, PAID}
        default: 0
      - name: period_start
        type: datetime
        source: input
        description: first instant the authorization is usable, inclusive
      - name: period_end
        type: datetime
        source: input
        description: last instant the authorization is usable, exclusive
      - name: status
        type: enum
        source: computed
        description: lifecycle state of the authorization
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, EXHAUSTED, EXPIRED, VOIDED}"

  - name: ServiceDelivery
    parent: ServiceAuthorization
    common_fields: true
    fields:
      - name: service_authorization_id
        type: string
        source: input
        description: "FK -> ServiceAuthorization.id; the authorization consumed by this delivery"
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; the grant designated as the primary bearer of this delivery"
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client who received the service"
      - name: service_date
        type: datetime
        source: input
        description: logical-clock instant the service was rendered
      - name: sequence_no
        type: integer
        source: system
        description: server-assigned strictly increasing creation counter, starting at 1, used as the deterministic id-free ordering key for duplication and braiding tie-breaks
        constraints: "strictly increasing across all ServiceDelivery rows; never reused; never derived from id"
      - name: units_delivered
        type: integer
        source: input
        description: units of service rendered on this row
        constraints: "value >= 0"
      - name: unit_rate_cents
        type: integer
        source: input
        description: rate in cents applied to each delivered unit
        constraints: "value >= 0"
      - name: gross_cost_cents
        type: integer
        source: computed
        description: computed as units_delivered multiplied by unit_rate_cents
        default: 0
      - name: allocated_total_cents
        type: integer
        source: computed
        description: computed sum of CostAllocation.allocated_amount_cents over this delivery
        default: 0
      - name: admin_total_cents
        type: integer
        source: computed
        description: computed sum of CostAllocation.admin_amount_cents over this delivery
        default: 0
      - name: alternate_disallowed_cents
        type: integer
        source: computed
        description: reporting-only disallowed total under the lowest_cost_first variant of duplication_disallowance
        default: 0
      - name: documentation_status
        type: enum
        source: computed
        description: whether audit-ready documentation is attached
        default: INCOMPLETE
        constraints: "one of {INCOMPLETE, COMPLETE}"
      - name: status
        type: enum
        source: computed
        description: lifecycle state of the delivery record
        default: DRAFT
        constraints: "one of {DRAFT, DOCUMENTED, BILLED, REJECTED, VOIDED}"

  - name: CostAllocation
    parent: ServiceDelivery
    common_fields: true
    fields:
      - name: service_delivery_id
        type: string
        source: input
        description: "FK -> ServiceDelivery.id; the delivery whose cost is being braided"
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; the grant receiving this allocation line"
      - name: allocation_rank
        type: integer
        source: computed
        description: position of this line in the pinned braiding order, starting at 1
      - name: allocated_amount_cents
        type: integer
        source: computed
        description: program cost in cents drawn from this grant
        default: 0
      - name: admin_amount_cents
        type: integer
        source: computed
        description: administrative share in cents for this line, rounded to integer cents at line level
        default: 0
      - name: allocation_basis
        type: enum
        source: computed
        description: which braiding order produced this line
        constraints: "one of {RANKED_PRIORITY, CHRONOLOGICAL_PERIOD}"
      - name: disallowed_cents
        type: integer
        source: computed
        description: portion of allocated_amount_cents disallowed as prohibited duplication
        default: 0
      - name: status
        type: enum
        source: computed
        description: commitment state of the allocation line
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, COMMITTED, REVERSED}"

  - name: InKindDonation
    parent: null
    common_fields: true
    fields:
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; the grant against which match credit is claimed"
      - name: donor_type
        type: enum
        source: input
        description: who provided the in-kind support
        constraints: "one of {PARISH, VOLUNTEER, CORPORATE}"
      - name: donor_reference
        type: string
        source: input
        description: parish code or volunteer identifier supplied by the coordinator
      - name: donation_date
        type: datetime
        source: input
        description: logical-clock instant the support was provided
      - name: hours
        type: number
        source: input
        description: documented volunteer hours contributed
        constraints: "value >= 0"
      - name: valuation_method
        type: enum
        source: input
        description: how the contribution was valued
        constraints: "one of {IRS_STANDARD_RATE, APPRAISAL, ACTUAL_COST, UNVALUED}"
      - name: rate_cents
        type: integer
        source: input
        description: per-hour valuation in cents supplied by the coordinator
        constraints: "value >= 0"
      - name: value_cents
        type: integer
        source: computed
        description: computed as hours multiplied by the ceilinged hour value, rounded to integer cents
        default: 0
      - name: uncapped_value_cents
        type: integer
        source: computed
        description: reporting-only value computed at the raw rate without the Grant.max_in_kind_rate_cents ceiling
        default: 0
      - name: match_credit_cents
        type: integer
        source: computed
        description: computed match credit after per-hour ceiling and remaining-requirement cap
        default: 0
      - name: status
        type: enum
        source: computed
        description: acceptance state of the in-kind record
        default: ACCEPTED
        constraints: "one of {ACCEPTED, REJECTED, VOIDED}"

  - name: OutcomeReport
    parent: Grant
    common_fields: true
    fields:
      - name: grant_id
        type: string
        source: input
        description: "FK -> Grant.id; the grant this report accounts for"
      - name: measure_code
        type: enum
        source: input
        description: funder-specific performance measure being reported
        constraints: "one of {HOUSING_PLACEMENTS, FOOD_UNITS_DISTRIBUTED, COUNSELING_COMPLETION, IMMIGRATION_CASES_CLOSED, REFUGEE_EMPLOYMENT}"
      - name: reporting_period_start
        type: datetime
        source: input
        description: first instant covered by the report, inclusive
      - name: reporting_period_end
        type: datetime
        source: input
        description: last instant covered by the report, inclusive
      - name: numerator
        type: integer
        source: input
        description: count of successful outcomes claimed
        constraints: "value >= 0"
      - name: denominator
        type: integer
        source: input
        description: count of clients in the reporting universe
        constraints: "value >= 0"
      - name: denominator_basis
        type: enum
        source: computed
        description: which universe definition produced the denominator
        default: ALL_SERVED
        constraints: "one of {ALL_SERVED, COMPLETED_ONLY}"
      - name: rate_pct
        type: number
        source: computed
        description: computed success rate in percent, 2 decimal places round_half_up; null when denominator is below the minimum
        constraints: "null or 0.00 <= value <= 100.00"
      - name: status
        type: enum
        source: computed
        description: lifecycle state of the report
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, RETURNED}"

# §1.2.1 Concurrency Rules (OCC on parent version only)
concurrency_rules:
  - rule_id: authorization-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /api/service-authorizations"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a ServiceAuthorization against an Enrollment whose version has advanced
      since the client last observed it is rejected. This captures the case where the
      enrollment's units_delivered and status have already been advanced by an earlier
      authorization-and-delivery cycle, so the current writer's view of the enrollment
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: delivery-create-stale-authorization
    parent_entity: ServiceAuthorization
    write_endpoint: "POST /api/service-deliveries"
    occ_field: "expected_service_authorization_version"
    description: |
      Recording a ServiceDelivery against a ServiceAuthorization whose version has
      advanced since the client last observed it is rejected. This captures the case
      where a prior delivery against the same authorization has already advanced its
      units_delivered and status, so the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# §1.2 State Machine Table
state_machines:
  - entity: IntakeAssessment
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/intake-assessments/{id}/submit"
        actor: IntakeSpecialist
        preconditions:
          - "status == DRAFT or status == RETURNED"
          - "presenting_needs has at least one element"
          - "requested_domains has at least one element"
        side_effects:
          - "set IntakeAssessment.status = SUBMITTED"
          - "clear IntakeAssessment.return_reason_code to null"
          - "increment IntakeAssessment.version by 1"
      - from: SUBMITTED
        to: ROUTED
        trigger: "POST /api/intake-assessments/{id}/route"
        actor: IntakeSpecialist
        preconditions:
          - "status == SUBMITTED"
          - "at least one EligibilityScreen row with intake_assessment_id == IntakeAssessment.id has verification_state == VERIFIED"
        side_effects:
          - "set IntakeAssessment.status = ROUTED"
          - "set IntakeAssessment.routing_outcome = ROUTED"
          - "set IntakeAssessment.routing_outcome = NO_ELIGIBLE_PROGRAM when every EligibilityScreen row for this assessment carries determination == INELIGIBLE"
          - "increment IntakeAssessment.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /api/intake-assessments/{id}/return"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "return_reason_code is one of {INCOMPLETE_INCOME, MISSING_DOCUMENT, WRONG_DOMAIN}"
        side_effects:
          - "set IntakeAssessment.status = RETURNED"
          - "set every EligibilityScreen row for this assessment to verification_state = EXPIRED"
          - "set every EligibilityScreen row for this assessment with determination == ELIGIBLE back to determination = PENDING"
          - "increment IntakeAssessment.version by 1"
          - "increment each affected EligibilityScreen.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/intake-assessments/{id}/submit"
        actor: IntakeSpecialist
        preconditions:
          - "status == RETURNED"
          - "requested_domains has at least one element"
        side_effects:
          - "set IntakeAssessment.status = SUBMITTED"
          - "increment IntakeAssessment.version by 1"
      - from: ROUTED
        to: CLOSED
        trigger: "system event evaluated after every Enrollment exit and every EligibilityScreen determination write"
        actor: system
        preconditions:
          - "status == ROUTED"
          - "every EligibilityScreen row for this assessment has determination IN {ELIGIBLE, INELIGIBLE}"
          - "every Enrollment row whose client_id == IntakeAssessment.client_id and whose enrolled_at >= IntakeAssessment.assessment_date has status IN {EXITED, DENIED}"
        side_effects:
          - "set IntakeAssessment.status = CLOSED"
          - "set IntakeAssessment.routing_outcome = WITHDRAWN when every Enrollment row for this client reached status == DENIED"
          - "increment IntakeAssessment.version by 1"

  - entity: EligibilityScreen
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "POST /api/eligibility-screens/{id}/determine (verification hop of the independent verification dimension)"
        actor: ComplianceOfficer
        preconditions:
          - "verification_state == UNVERIFIED"
          - "verified_income_cents > 0"
        side_effects:
          - "set EligibilityScreen.verification_state = VERIFIED"
          - "set EligibilityScreen.screened_at to the current logical clock"
          - "increment EligibilityScreen.version by 1"
        note: "Independent dimension 2 (verification_state) advances without touching dimension 1 (determination)."
      - from: PENDING
        to: ELIGIBLE
        trigger: "POST /api/eligibility-screens/{id}/determine"
        actor: ComplianceOfficer
        preconditions:
          - "determination == PENDING"
          - "verification_state == VERIFIED"
          - "the parent IntakeAssessment.status == ROUTED"
          - "confidentiality_scope_resolution returns allowed == true for the client and the screened program's service_domain"
          - "Program.enrolled_slots < Program.capacity_slots for the screened program"
        side_effects:
          - "set EligibilityScreen.determination = ELIGIBLE"
          - "create Enrollment row with status = PENDING, client_id = the assessment's client_id, program_id = EligibilityScreen.program_id, grant_id = EligibilityScreen.grant_id (cascade hop 1)"
          - "increment Program.enrolled_slots for that program by 1 (cascade hop 2)"
          - "when Program.enrolled_slots reaches Program.capacity_slots, set every EligibilityScreen row for that program with determination == PENDING to determination = INELIGIBLE and denial_reason_code = PROGRAM_AT_CAPACITY (cascade hop 3)"
          - "increment EligibilityScreen.version by 1"
      - from: PENDING
        to: INELIGIBLE
        trigger: "POST /api/eligibility-screens/{id}/determine"
        actor: ComplianceOfficer
        preconditions:
          - "determination == PENDING"
          - "verification_state == VERIFIED"
          - "at least one of: verified_income_cents exceeds the program income ceiling, client immigration_status is not accepted by the governing funder, or confidentiality_scope_resolution returns allowed == false"
        side_effects:
          - "set EligibilityScreen.determination = INELIGIBLE"
          - "set EligibilityScreen.denial_reason_code to the first failing check in the order {CONFIDENTIALITY_BAR, INCOME_OVER_LIMIT, IMMIGRATION_STATUS, RESIDENCY, PROGRAM_AT_CAPACITY}"
          - "increment EligibilityScreen.version by 1"
      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "system event fired when the program capacity cascade reaches this row"
        actor: system
        preconditions:
          - "determination == ELIGIBLE"
          - "Program.enrolled_slots >= Program.capacity_slots"
        side_effects:
          - "set EligibilityScreen.determination = INELIGIBLE"
          - "set EligibilityScreen.denial_reason_code = PROGRAM_AT_CAPACITY"
          - "set the Enrollment row created by this screen to status = DENIED"
          - "decrement Program.enrolled_slots by 1"
          - "increment EligibilityScreen.version by 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system event evaluated on every write while the logical clock is at or beyond screened_at + 180 days"
        actor: system
        preconditions:
          - "verification_state == VERIFIED"
          - "determination == PENDING"
        side_effects:
          - "set EligibilityScreen.verification_state = EXPIRED"
          - "increment EligibilityScreen.version by 1"
        note: "Independent dimension 2 transition; dimension 1 stays PENDING."

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: [EXITED, DENIED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /api/enrollments/{id}/activate"
        actor: ProgramManager
        preconditions:
          - "status == PENDING"
          - "the grant identified by Enrollment.grant_id has status IN {OPEN, THROTTLED}"
          - "the program identified by Enrollment.program_id has status == ACTIVE"
          - "the current logical clock is >= Grant.period_start and <= Grant.period_end"
        side_effects:
          - "set Enrollment.status = ACTIVE"
          - "increment Client.open_enrollment_count by 1"
          - "increment Enrollment.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/enrollments/{id}/activate"
        actor: ProgramManager
        preconditions:
          - "status == SUSPENDED"
          - "the grant identified by Enrollment.grant_id has status IN {OPEN, THROTTLED}"
          - "the current logical clock is >= Grant.period_start and <= Grant.period_end"
        side_effects:
          - "set Enrollment.status = ACTIVE"
          - "increment Client.open_enrollment_count by 1"
          - "increment Enrollment.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event fired when the governing grant reaches posture FROZEN"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the grant identified by Enrollment.grant_id has status == FROZEN"
        side_effects:
          - "set Enrollment.status = SUSPENDED"
          - "decrement Client.open_enrollment_count by 1"
          - "increment Enrollment.version by 1"
      - from: PENDING
        to: EXITED
        trigger: "POST /api/enrollments/{id}/exit"
        actor: ProgramManager
        preconditions:
          - "status == PENDING"
          - "exit_reason == WITHDRAWN"
        side_effects:
          - "set Enrollment.status = EXITED"
          - "set Enrollment.exited_at to the current logical clock"
          - "decrement Program.enrolled_slots by 1"
          - "increment Enrollment.version by 1"
      - from: ACTIVE
        to: EXITED
        trigger: "POST /api/enrollments/{id}/exit"
        actor: ProgramManager
        preconditions:
          - "status == ACTIVE"
          - "exit_reason is one of {COMPLETED, WITHDRAWN, TRANSFERRED, GRANT_TERMINATED, NONCOMPLIANCE}"
        side_effects:
          - "set Enrollment.status = EXITED"
          - "set Enrollment.exited_at to the current logical clock"
          - "decrement Program.enrolled_slots by 1"
          - "decrement Client.open_enrollment_count by 1"
          - "set every ServiceAuthorization row for this enrollment with status == ACTIVE to status = EXPIRED"
          - "increment Enrollment.version by 1"
      - from: SUSPENDED
        to: EXITED
        trigger: "POST /api/enrollments/{id}/exit"
        actor: ProgramManager
        preconditions:
          - "status == SUSPENDED"
          - "exit_reason is one of {WITHDRAWN, TRANSFERRED, GRANT_TERMINATED, NONCOMPLIANCE}"
        side_effects:
          - "set Enrollment.status = EXITED"
          - "set Enrollment.exited_at to the current logical clock"
          - "decrement Program.enrolled_slots by 1"
          - "set every ServiceAuthorization row for this enrollment with status == ACTIVE to status = EXPIRED"
          - "increment Enrollment.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "system event fired when the program capacity cascade denies this enrollment"
        actor: system
        preconditions:
          - "status == PENDING"
          - "the eligibility screen that created this enrollment has determination == INELIGIBLE"
        side_effects:
          - "set Enrollment.status = DENIED"
          - "decrement Program.enrolled_slots by 1"
          - "increment Enrollment.version by 1"

  - entity: ServiceDelivery
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: DOCUMENTED
        trigger: "POST /api/service-deliveries/{id}/document"
        actor: ProgramManager
        preconditions:
          - "status == DRAFT"
          - "units_delivered >= 1"
          - "the ServiceAuthorization identified by service_authorization_id has status == ACTIVE"
          - "units_delivered + ServiceAuthorization.units_delivered <= ServiceAuthorization.authorized_units"
          - "the grant identified by grant_id has status IN {OPEN, THROTTLED}"
          - "the current logical clock is >= ServiceAuthorization.period_start and < ServiceAuthorization.period_end"
        side_effects:
          - "set ServiceDelivery.documentation_status = COMPLETE"
          - "set ServiceDelivery.gross_cost_cents = units_delivered * unit_rate_cents"
          - "delete and rewrite the CostAllocation rows for this delivery using braided_cost_allocation (cascade hop 1)"
          - "set ServiceDelivery.allocated_total_cents and ServiceDelivery.admin_total_cents using delivery_unit_cost"
          - "increase Grant.obligated_cents by the sum of allocated_amount_cents plus admin_amount_cents over the rewritten CostAllocation rows for each receiving grant (cascade hop 2)"
          - "recompute Grant.burn_ratio for every receiving grant using grant_burn_posture"
          - "apply the resulting posture transition on each receiving grant; when a grant reaches FROZEN, set every Enrollment row with grant_id == that grant.id and status == ACTIVE to status = SUSPENDED and decrement Client.open_enrollment_count (cascade hop 3)"
          - "increase ServiceAuthorization.units_delivered by units_delivered"
          - "set ServiceAuthorization.status = EXHAUSTED when ServiceAuthorization.units_delivered == ServiceAuthorization.authorized_units"
          - "set ServiceDelivery.status = DOCUMENTED"
          - "increment ServiceDelivery.version by 1"
      - from: DOCUMENTED
        to: BILLED
        trigger: "POST /api/service-deliveries/{id}/bill"
        actor: FinanceOfficer
        preconditions:
          - "status == DOCUMENTED"
          - "documentation_status == COMPLETE"
          - "every grant receiving a CostAllocation line for this delivery has status IN {OPEN, THROTTLED}"
          - "duplication_disallowance returns disallowed_cents == 0 for this delivery"
        side_effects:
          - "set every CostAllocation row for this delivery with status == PROVISIONAL to status = COMMITTED"
          - "decrease Grant.obligated_cents and increase Grant.expended_cents by the same amount for every receiving grant"
          - "recompute Grant.burn_ratio and re-apply the posture transition for every receiving grant"
          - "set ServiceDelivery.status = BILLED"
          - "increment ServiceDelivery.version by 1"
      - from: DOCUMENTED
        to: DRAFT
        trigger: "POST /api/service-deliveries/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "status == DOCUMENTED"
        side_effects:
          - "set every CostAllocation row for this delivery to status = REVERSED with allocated_amount_cents = 0, admin_amount_cents = 0 and disallowed_cents = 0"
          - "decrease Grant.obligated_cents by the pre-void sum of allocated_amount_cents plus admin_amount_cents for every receiving grant"
          - "recompute Grant.burn_ratio and re-apply the posture transition for every receiving grant"
          - "decrease ServiceAuthorization.units_delivered by units_delivered"
          - "set ServiceAuthorization.status = ACTIVE when it was EXHAUSTED"
          - "set ServiceDelivery.documentation_status = INCOMPLETE"
          - "set ServiceDelivery.allocated_total_cents = 0 and ServiceDelivery.admin_total_cents = 0"
          - "set ServiceDelivery.status = DRAFT"
          - "increment ServiceDelivery.version by 1"
      - from: BILLED
        to: VOIDED
        trigger: "POST /api/service-deliveries/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "status == BILLED"
        side_effects:
          - "set every CostAllocation row for this delivery to status = REVERSED"
          - "decrease Grant.expended_cents by the sum of allocated_amount_cents plus admin_amount_cents for every receiving grant"
          - "recompute Grant.burn_ratio and re-apply the posture transition for every receiving grant"
          - "decrease ServiceAuthorization.units_delivered by units_delivered"
          - "set ServiceAuthorization.status = ACTIVE when it was EXHAUSTED"
          - "set ServiceDelivery.status = VOIDED"
          - "increment ServiceDelivery.version by 1"

  - entity: Grant
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: THROTTLED
        trigger: "POST /api/grants/{id}/posture-recompute or system event after any CostAllocation mutation"
        actor: system
        preconditions:
          - "status == OPEN"
          - "burn_ratio >= 0.850000 and burn_ratio < 1.000000"
        side_effects:
          - "set Grant.status = THROTTLED"
          - "set Grant.posture_computed_at to the current logical clock"
          - "increment Grant.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "POST /api/grants/{id}/posture-recompute or system event after any CostAllocation mutation"
        actor: system
        preconditions:
          - "status == OPEN"
          - "burn_ratio >= 1.000000"
        side_effects:
          - "set Grant.status = FROZEN"
          - "set every Enrollment row with grant_id == Grant.id and status == ACTIVE to status = SUSPENDED and decrement Client.open_enrollment_count"
          - "set Grant.posture_computed_at to the current logical clock"
          - "increment Grant.version by 1"
      - from: THROTTLED
        to: FROZEN
        trigger: "system event after any CostAllocation mutation"
        actor: system
        preconditions:
          - "status == THROTTLED"
          - "burn_ratio >= 1.000000"
        side_effects:
          - "set Grant.status = FROZEN"
          - "set every Enrollment row with grant_id == Grant.id and status == ACTIVE to status = SUSPENDED and decrement Client.open_enrollment_count"
          - "set Grant.posture_computed_at to the current logical clock"
          - "increment Grant.version by 1"
      - from: THROTTLED
        to: OPEN
        trigger: "system event after a CostAllocation reversal"
        actor: system
        preconditions:
          - "status == THROTTLED"
          - "burn_ratio < 0.850000"
        side_effects:
          - "set Grant.status = OPEN"
          - "set Grant.posture_computed_at to the current logical clock"
          - "increment Grant.version by 1"
      - from: FROZEN
        to: THROTTLED
        trigger: "system event after a CostAllocation reversal"
        actor: system
        preconditions:
          - "status == FROZEN"
          - "burn_ratio >= 0.850000 and burn_ratio < 1.000000"
        side_effects:
          - "set Grant.status = THROTTLED"
          - "set Grant.posture_computed_at to the current logical clock"
          - "increment Grant.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "system event after a CostAllocation reversal"
        actor: system
        preconditions:
          - "status == FROZEN"
          - "burn_ratio < 0.850000"
        side_effects:
          - "set Grant.status = OPEN"
          - "set Grant.posture_computed_at to the current logical clock"
          - "increment Grant.version by 1"
  - entity: OutcomeReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/outcome-reports/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "status == DRAFT or status == RETURNED"
          - "denominator >= 5"
          - "reporting_period_start >= Grant.period_start and reporting_period_end <= Grant.period_end"
        side_effects:
          - "compute OutcomeReport.rate_pct using outcome_rate"
          - "compute OutcomeReport.denominator_basis using outcome_rate"
          - "evaluate in_kind_match_credit for the governing grant; when the credited total is below matching_requirement_pct * total_award_cents, set OutcomeReport.status = RETURNED instead of SUBMITTED"
          - "set OutcomeReport.status = SUBMITTED when the match requirement is satisfied"
          - "increment OutcomeReport.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/outcome-reports/{id}/submit"
        actor: ProgramManager
        preconditions:
          - "status == RETURNED"
          - "denominator >= 5"
        side_effects:
          - "recompute OutcomeReport.rate_pct using outcome_rate"
          - "set OutcomeReport.status = SUBMITTED"
          - "increment OutcomeReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/outcome-reports/{id}/accept"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "set OutcomeReport.status = ACCEPTED"
          - "increment OutcomeReport.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /api/outcome-reports/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "set OutcomeReport.status = RETURNED"
          - "set OutcomeReport.rate_pct = null"
          - "increment OutcomeReport.version by 1"

# §1.3 Calculation Rules Table
calculations:
  - name: braided_cost_allocation
    trigger: "POST /api/service-deliveries/{id}/document"
    algorithm: waterfall_allocation
    formula: |
      total_cost_cents = ServiceDelivery.units_delivered * ServiceDelivery.unit_rate_cents

      candidates = every Grant row that is either
                     (a) Enrollment.grant_id of the enrollment behind this delivery's
                         ServiceAuthorization.enrollment_id, or
                     (b) ServiceAuthorization.grant_id of this delivery's authorization,
                   restricted to Grant.status IN {OPEN, THROTTLED}

      ORDER (pinned once, before any line is written; NOT re-derived between lines):
        variant ranked_priority     -> Grant.allocation_rank ASC, then Grant.created_at ASC
        variant chronological_period -> Grant.period_start ASC,   then Grant.created_at ASC

      # Pinned evaluation order (circular-looking dependency):
      #   line i's take depends on `residual` AFTER lines 1..i-1,
      #   and `residual` depends on line i's take. The residual is carried
      #   forward through the frozen order; the order is never recomputed.
      residual = total_cost_cents
      for i, grant in enumerate(ORDER, start=1):
          capacity_i = grant.total_award_cents - grant.expended_cents - grant.obligated_cents
          take_i     = min(capacity_i, residual)
          if take_i < 1: take_i = 0            # sub-cent residue is dropped, not carried
          line_i.allocated_amount_cents = take_i
          line_i.admin_amount_cents     = round_half_up(take_i * grant.admin_rate_pct, 0)
          line_i.allocation_rank        = i
          line_i.allocation_basis       = "RANKED_PRIORITY" for the ranked_priority variant,
                                          "CHRONOLOGICAL_PERIOD" for the chronological_period variant
          line_i.status                 = PROVISIONAL
          residual = residual - take_i

      if residual > 0: reject with ERR_ALLOCATION_EXCEEDS_AWARD
      Grant.obligated_cents is incremented only AFTER the whole pass completes.

      WORKED EXAMPLE (identical inputs, both variants):
        delivery: units_delivered = 12, unit_rate_cents = 4500  -> total_cost_cents = 54000
        Grant A: allocation_rank 1, period_start 2026-10-01, total_award_cents 200000,
                 expended_cents 100000, obligated_cents 60000, admin_rate_pct 0.10
                 -> capacity 40000
        Grant B: allocation_rank 2, period_start 2026-09-15, total_award_cents 100000,
                 expended_cents 50000, obligated_cents 30000, admin_rate_pct 0.20
                 -> capacity 20000
        ranked_priority:      A take 40000 (admin 4000), B take 14000 (admin 2800)
                              -> allocated_total_cents 54000, admin_total_cents 6800
        chronological_period: B take 20000 (admin 4000), A take 34000 (admin 3400)
                              -> allocated_total_cents 54000, admin_total_cents 7400
    input_set: "CostAllocation rows for one ServiceDelivery whose status IN {PROVISIONAL}; CostAllocation rows with status IN {COMMITTED, REVERSED} are excluded from the rewrite set"
    constants:
      MIN_ALLOCATION_CENTS: 1
    precision: "integer cents; round_half_up on any fractional intermediate"
    variants:
      - name: ranked_priority
        when: "the governing funder sets cost_allocation_basis IN {DIRECT_ONLY, HEADCOUNT}; this is the base variant"
        difference: "draws grants in ascending Grant.allocation_rank order, so the highest-precedence grant absorbs the full cost first"
      - name: chronological_period
        when: "the governing funder sets cost_allocation_basis IN {TIME_AND_EFFORT, SQUARE_FOOTAGE}"
        difference: "draws grants in ascending Grant.period_start order regardless of allocation_rank, so an older award absorbs cost before a higher-ranked newer award and every admin_amount_cents line differs"

  - name: delivery_unit_cost
    trigger: "POST /api/service-deliveries/{id}/document"
    algorithm: aggregation
    formula: |
      lines = CostAllocation rows for the delivery, ordered by allocation_rank ASC

      PINNED ROUNDING ORDER: round per line, THEN sum.
        admin_amount_cents_i = round_half_up(allocated_amount_cents_i * grant_i.admin_rate_pct, 0)
        admin_total_cents    = sum(admin_amount_cents_i)
      The alternative order (sum the unrounded products, then round once) is NOT used.

      allocated_total_cents = sum(allocated_amount_cents_i)
      delivery_total_cents  = allocated_total_cents + admin_total_cents

      WORKED EXAMPLE (order matters):
        two lines of allocated_amount_cents = 1005 each, both at admin_rate_pct = 0.10
        pinned (round per line, then sum): round_half_up(100.5) + round_half_up(100.5) = 101 + 101 = 202
        rejected order (sum then round):   round_half_up(100.5 + 100.5) = round_half_up(201.0) = 201
    input_set: "CostAllocation rows for one ServiceDelivery whose status IN {PROVISIONAL, COMMITTED}; rows with status == REVERSED are excluded"
    constants:
      ROUNDING_MODE: "round_half_up"
    precision: "integer cents per line, then integer sum; no re-rounding of the sum"
    variants:
      - name: line_level_rounding
        when: "always; this is the only sanctioned order"
        difference: "rounds each allocation line's admin share to integer cents before summing, which yields 202 rather than 201 on the worked example"

  - name: grant_burn_posture
    trigger: "POST /api/grants/{id}/posture-recompute, and every CostAllocation mutation cascade"
    algorithm: threshold
    formula: |
      committed_cents = Grant.expended_cents + Grant.obligated_cents      # base variant
      burn_ratio = 0.0                                                     if Grant.total_award_cents == 0
                 = round_half_up(committed_cents / Grant.total_award_cents, 6)   otherwise

      posture, evaluated in this order (first match wins):
        FROZEN    if burn_ratio >= 1.000000
        THROTTLED if burn_ratio >= 0.850000
        OPEN      otherwise

      BOUNDARY: the comparison is >=, not >. A ratio of exactly 0.850000 is THROTTLED.
                A ratio of exactly 1.000000 is FROZEN.

      WORKED EXAMPLE:
        total_award_cents 100000, expended_cents 40000, obligated_cents 60000
          -> committed 100000, burn_ratio 1.000000, posture FROZEN
        total_award_cents 200000, expended_cents 90000, obligated_cents 80000
          -> committed 170000, burn_ratio 0.850000, posture THROTTLED
    input_set: "CostAllocation rows for the grant whose status IN {PROVISIONAL, COMMITTED}; rows with status == REVERSED contribute nothing"
    constants:
      THROTTLE_THRESHOLD: 0.85
      FREEZE_THRESHOLD: 1.0
      RATIO_SCALE: 6
    precision: "burn_ratio to 6 decimal places, round_half_up"
    variants:
      - name: committed_basis
        when: "the base variant; used for posture gating of every child operation"
        difference: "counts both expended and obligated cents, so a grant can reach FROZEN while its cash spend is still low"
      - name: cash_basis
        when: "reporting-only projection returned by GET /api/grants/{id}; never gates writes"
        difference: "counts expended cents only, so the same grant reports OPEN at burn_ratio 0.400000 where the committed basis reports FROZEN at 1.000000"

  - name: in_kind_match_credit
    trigger: "POST /api/in-kind-donations, and POST /api/outcome-reports/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      eligible_rows = InKindDonation rows where
                        grant_id == Grant.id
                        AND status == ACCEPTED
                        AND valuation_method IN {IRS_STANDARD_RATE, APPRAISAL}
                        AND donation_date >= Grant.period_start
                        AND donation_date <= Grant.period_end
                        AND the Program linked by Grant.program_id has match_eligible == true

      already_credited_cents = sum of match_credit_cents over eligible_rows whose
                               created_at < this row's created_at;
                               ties in created_at are ordered by sequence_no ASC

      hour_value_cents          = min(this.rate_cents, Grant.max_in_kind_rate_cents)
      value_cents               = round_half_up(this.hours * hour_value_cents, 0)
      requirement_cents         = round_half_up(Grant.matching_requirement_pct * Grant.total_award_cents, 0)
      remaining_requirement     = max(requirement_cents - already_credited_cents, 0)
      match_credit_cents        = min(value_cents, remaining_requirement)

      WORKED EXAMPLE:
        Grant.total_award_cents 200000, matching_requirement_pct 0.25 -> requirement_cents 50000
        Grant.max_in_kind_rate_cents 3000
        donation 1: hours 12, rate_cents 3390, IRS_STANDARD_RATE
          -> hour_value min(3390,3000)=3000, value 36000, already 0, credit min(36000,50000) = 36000
        donation 2: hours 6, rate_cents 3000, APPRAISAL
          -> value 18000, already 36000, remaining 14000, credit min(18000,14000) = 14000
        donation 3: hours 10, rate_cents 3000, APPRAISAL
          -> value 30000, already 50000, remaining 0, credit min(30000,0) = 0
        credited total 50000 == requirement_cents 50000
    input_set: "InKindDonation rows with status == ACCEPTED; rows with status IN {REJECTED, VOIDED} are excluded from both value_cents and already_credited_cents"
    constants:
      IRS_VOLUNTEER_HOUR_RATE_CENTS: 3390
    precision: "integer cents; round_half_up"
    variants:
      - name: ceiling_applied
        when: "the base variant; every credit is capped at Grant.max_in_kind_rate_cents per hour"
        difference: "caps the per-hour value, so a 3390-cent IRS-rate donation against a 3000-cent ceiling credits 36000 rather than 40680"
      - name: ceiling_ignored
        when: "diagnostic projection only, surfaced in the donation response as uncapped_value_cents"
        difference: "credits the raw rate, so the same donation yields uncapped_value_cents 40680 against a capped match_credit_cents of 36000"

  - name: outcome_rate
    trigger: "POST /api/outcome-reports/{id}/submit"
    algorithm: aggregation
    formula: |
      window_rows = ServiceDelivery rows where grant_id == Grant.id
                    AND service_date >= reporting_period_start
                    AND service_date <= reporting_period_end

      denominator_universe (variant-dependent, distinct client_id set):
        all_served     -> clients with >= 1 window_row whose status IN {DOCUMENTED, BILLED}
        completed_only -> clients with >= 1 window_row whose status IN {DOCUMENTED, BILLED}
                          AND whose Enrollment for this grant reached status == EXITED
                          with exit_reason == COMPLETED

      denominator_basis = ALL_SERVED for the all_served variant,
                          COMPLETED_ONLY for the completed_only variant
      denominator_effective = |denominator_universe|

      if denominator_effective < 5: rate_pct = null and the report is forced to RETURNED
      else: rate_pct = round_half_up(numerator / denominator_effective * 100, 2)

      WORKED EXAMPLE (identical inputs, both variants):
        window contains deliveries for 30 distinct clients; 18 of them have a
        completed exit; numerator = 12
        all_served:     denominator 30 -> rate_pct = round_half_up(12/30*100, 2) = 40.00
        completed_only: denominator 18 -> rate_pct = round_half_up(12/18*100, 2) = 66.67
    input_set: "ServiceDelivery rows with status IN {DOCUMENTED, BILLED}; rows with status IN {DRAFT, REJECTED, VOIDED} are excluded from the window"
    constants:
      MIN_DENOMINATOR: 5
      RATE_SCALE: 2
    precision: "rate_pct to 2 decimal places, round_half_up; null when the denominator is below MIN_DENOMINATOR"
    variants:
      - name: all_served
        when: "the base variant; used when the funder measures against everyone served"
        difference: "denominates by every client with a documented or billed delivery in the window, producing 40.00 on the worked example"
      - name: completed_only
        when: "used when the funder measures against clients who completed the program"
        difference: "denominates by the subset of those clients whose enrollment exited with COMPLETED, producing 66.67 on the same inputs"

  - name: confidentiality_scope_resolution
    trigger: "POST /api/eligibility-screens/{id}/determine, and GET /api/clients/{id}"
    algorithm: constraint_propagation
    formula: |
      allowed(client, target_domain) evaluated by variant:
        tier_first (base), first match wins:
          client.confidentiality_tier == SEALED    -> false
          client.confidentiality_tier == PROTECTED -> (target_domain IN client.consent_scope)
                                                      AND (clock <= client.consent_expires_on)
          client.confidentiality_tier == STANDARD  -> true
        consent_first:
          (target_domain IN client.consent_scope) AND (clock <= client.consent_expires_on) -> true
          otherwise fall through to the tier_first rules

      WORKED EXAMPLE (identical inputs, both variants):
        client.confidentiality_tier SEALED, consent_scope ["HOUSING"],
        consent_expires_on 2026-12-31T00:00:00Z, clock 2026-09-01T00:00:00Z,
        target_domain "HOUSING"
        tier_first:    false  (SEALED is absolute)
        consent_first: true   (valid consent short-circuits the tier)
    input_set: "the single Client row referenced by the assessment and the service_domain of the Program being screened"
    constants:
      SEALED_IS_ABSOLUTE: true
    precision: "boolean; no rounding"
    variants:
      - name: tier_first
        when: "the base variant; used for every write path (eligibility screening, enrollment creation)"
        difference: "denies a SEALED client even when consent_scope covers the target domain, so the screen is refused with ERR_CONFIDENTIALITY_SCOPE_DENIED"
      - name: consent_first
        when: "read-only projection surfaced in GET /api/clients/{id}/summary as shareable_domains"
        difference: "allows a SEALED client whose consent covers the target domain, so shareable_domains lists HOUSING while the write path still refuses it"

  - name: duplication_disallowance
    trigger: "POST /api/service-deliveries/{id}/bill, and POST /api/service-deliveries"
    algorithm: chronological
    formula: |
      same_day = the logical-clock calendar day (UTC) of this row's service_date
      peer_rows = ServiceDelivery rows D where
                    D.client_id == this.client_id
                    AND D.service_date falls on same_day
                    AND the ServiceAuthorization linked by D.service_authorization_id
                        carries the same service_code as this row's authorization
                    AND D.status IN {DOCUMENTED, BILLED}

      ORDER (pinned): D.created_at ASC, then D.sequence_no ASC.
      The first row in that order is allowed; every later row in that order is disallowed.
      A row is disallowed even when a different grant_id bears it.

      disallowed_cents = sum over disallowed rows of
                         (allocated_total_cents + admin_total_cents)

      WORKED EXAMPLE:
        three same-day FOOD_PANTRY_BOX deliveries for one client, created in order
        (sequence_no 1, 2, 3) with allocated_total_cents + admin_total_cents of
        5000, 5000 and 7500
        allowed: sequence_no 1 only
        disallowed_cents for sequence_no 2 = 5000; for sequence_no 3 = 7500
        billing sequence_no 2 or 3 is rejected with ERR_DUPLICATE_SERVICE_BILLING
    input_set: "ServiceDelivery rows with status IN {DOCUMENTED, BILLED}; rows with status IN {DRAFT, REJECTED, VOIDED} are excluded from peer_rows"
    constants:
      ALLOWED_ROWS_PER_DAY: 1
    precision: "integer cents"
    variants:
      - name: first_by_creation
        when: "the base variant; the earliest created row is the allowed one"
        difference: "allows sequence_no 1 and disallows 2 and 3, so the disallowed total is 12500"
      - name: lowest_cost_first
        when: "diagnostic projection only, surfaced as alternate_disallowed_cents in GET /api/service-deliveries"
        difference: "allows the cheapest row instead, so on the worked example sequence_no 1 and 2 tie at 5000 and both are disallowed while sequence_no 3 is allowed, giving a disallowed total of 10000"

  - name: program_capacity_consumption
    trigger: "POST /api/enrollments, POST /api/enrollments/{id}/exit, and every program capacity cascade"
    algorithm: aggregation
    formula: |
      enrolled_slots(Program P) = count of Enrollment rows where
                                    program_id == P.id
                                    AND status IN {PENDING, ACTIVE, SUSPENDED}
      available_slots(P) = P.capacity_slots - enrolled_slots(P)
      capacity_exhausted(P) = (available_slots(P) <= 0)

      BOUNDARY: available_slots of exactly 0 is exhausted (<=, not <).
                A program with capacity_slots == 0 is exhausted before any enrollment.

      INVARIANT (compensating pair): the sequence
        POST /api/enrollments   (creates a PENDING enrollment)
        POST /api/enrollments/{id}/exit  with exit_reason WITHDRAWN
      leaves enrolled_slots(P) and Client.open_enrollment_count at their pre-create values.
    input_set: "Enrollment rows with status IN {PENDING, ACTIVE, SUSPENDED}; rows with status IN {EXITED, DENIED} are excluded"
    constants:
      COUNTING_STATUSES: [PENDING, ACTIVE, SUSPENDED]
    precision: "integer count"
    variants:
      - name: open_status_count
        when: "the base variant; gates enrollment creation and eligibility determination"
        difference: "counts PENDING and SUSPENDED rows against capacity, so a program at capacity_slots 2 with one PENDING and one ACTIVE enrollment refuses a third"
      - name: active_only_count
        when: "diagnostic projection only, surfaced as active_slots in GET /api/programs"
        difference: "counts ACTIVE rows only, so the same program reports available_slots 1 while the write path refuses the enrollment"

# §1.4 Validation Rules Table (ordered by priority)
# Priority is global and strict: a request that fails several checks returns the
# error of the LOWEST priority number that fails. Business rules are grouped
# 5 (concurrency) < 6 (safety) < 7 (constraint) < 8 (fiscal), so a stale-version
# refusal and a compliance refusal each outrank a capacity or money refusal on
# the same request.
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's roles set"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "every path resource resolves, validated left-to-right in path order; a client path segment resolves against Client.id"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/clients/{id}/intake-assessments, GET /api/clients/{id}"
  - priority: 3
    category: existence
    check: "the program identified in the body or in the screened resource exists"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/grants, POST /api/eligibility-screens, POST /api/enrollments"
  - priority: 3
    category: existence
    check: "the grant identified in the body or in the screened resource exists"
    error_id: ERR_GRANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/grants, POST /api/eligibility-screens, POST /api/enrollments, POST /api/service-authorizations, POST /api/service-deliveries, POST /api/in-kind-donations, POST /api/outcome-reports"
  - priority: 3
    category: existence
    check: "the enrollment identified in the path or in the body exists"
    error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/enrollments/{id}/activate, POST /api/enrollments/{id}/exit, POST /api/service-authorizations"
  - priority: 3
    category: existence
    check: "the service authorization identified in the path or in the body exists"
    error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/service-deliveries"
  - priority: 3
    category: existence
    check: "the service delivery identified in the path exists"
    error_id: ERR_DELIVERY_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/service-deliveries/{id}/document, POST /api/service-deliveries/{id}/bill, POST /api/service-deliveries/{id}/void"
  - priority: 3
    category: existence
    check: "the outcome report identified in the path exists"
    error_id: ERR_OUTCOME_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/outcome-reports/{id}/submit, POST /api/outcome-reports/{id}/accept, POST /api/outcome-reports/{id}/reject"
  - priority: 4
    category: state
    check: "the target resource is in a state that admits this operation; a resource already in a terminal state fails here"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint in §1.5"
  - priority: 4
    category: state
    check: "the parent IntakeAssessment.status == ROUTED before an eligibility screen may be determined"
    error_id: ERR_INTAKE_NOT_ROUTED
    http_status: 409
    applies_to: "POST /api/eligibility-screens/{id}/determine"
  - priority: 4
    category: state
    check: "the governing Grant.status IN {OPEN, THROTTLED}; a grant at posture FROZEN refuses all child writes"
    error_id: ERR_GRANT_FROZEN
    http_status: 409
    applies_to: "POST /api/enrollments, POST /api/enrollments/{id}/activate, POST /api/service-authorizations, POST /api/service-deliveries, POST /api/service-deliveries/{id}/document, POST /api/service-deliveries/{id}/bill"
  - priority: 6
    category: business_safety
    check: "confidentiality_scope_resolution returns allowed == true for the client and the target program's service_domain under the tier_first variant"
    error_id: ERR_CONFIDENTIALITY_SCOPE_DENIED
    http_status: 403
    applies_to: "POST /api/intake-assessments/{id}/eligibility-screens, POST /api/eligibility-screens/{id}/determine, POST /api/enrollments, GET /api/clients/{id}"
  - priority: 6
    category: business_safety
    check: "when the governing Funder.allow_faith_based_activity == false, the Program.faith_based_activity_offered must be false before public funds may be drawn"
    error_id: ERR_FAITH_BASED_ACTIVITY_PROHIBITED
    http_status: 422
    applies_to: "POST /api/grants, POST /api/service-authorizations, POST /api/service-deliveries/{id}/document"
  - priority: 6
    category: business_safety
    check: "the program must carry Program.nondiscrimination_attested == true before it may be screened or enrolled under a FEDERAL or STATE funder"
    error_id: ERR_NONDISCRIMINATION_VIOLATION
    http_status: 422
    applies_to: "POST /api/intake-assessments/{id}/eligibility-screens, POST /api/enrollments, POST /api/programs"
  - priority: 7
    category: business_constraint
    check: "an EligibilityScreen with determination == ELIGIBLE and verification_state == VERIFIED exists for the client, program and grant before an enrollment may be created directly"
    error_id: ERR_ELIGIBILITY_NOT_ESTABLISHED
    http_status: 409
    applies_to: "POST /api/enrollments"
  - priority: 7
    category: business_constraint
    check: "the client holds no Enrollment row with the same program_id whose status IN {PENDING, ACTIVE, SUSPENDED}"
    error_id: ERR_CLIENT_ALREADY_ENROLLED
    http_status: 409
    applies_to: "POST /api/enrollments"
  - priority: 7
    category: business_constraint
    check: "the requested [period_start, period_end) does not overlap any existing ServiceAuthorization for the same enrollment_id and service_code with status IN {DRAFT, ACTIVE, EXHAUSTED}; intervals are half-open, so an existing period_end equal to the new period_start is NOT an overlap"
    error_id: ERR_AUTHORIZATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /api/service-authorizations"
  - priority: 7
    category: business_constraint
    check: "the requested [reporting_period_start, reporting_period_end] does not overlap any existing OutcomeReport for the same grant_id and measure_code with status IN {DRAFT, SUBMITTED, ACCEPTED}; intervals are closed with a mandatory one-day gap, so an existing reporting_period_end equal to the new reporting_period_start IS an overlap"
    error_id: ERR_OUTCOME_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /api/outcome-reports"
  - priority: 7
    category: business_constraint
    check: "the sum of InKindDonation.hours for the same donor_reference within the rolling 7-day window ending at the donation_date does not exceed 40 hours"
    error_id: ERR_INKIND_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /api/in-kind-donations"
  - priority: 7
    category: business_constraint
    check: "Program.enrolled_slots < Program.capacity_slots before a new enrollment or an ELIGIBLE determination may consume a slot"
    error_id: ERR_PROGRAM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/enrollments, POST /api/eligibility-screens/{id}/determine"
  - priority: 8
    category: business_fiscal
    check: "ServiceDelivery.units_delivered >= 1; a zero-unit delivery is never billable"
    error_id: ERR_ZERO_UNITS
    http_status: 422
    applies_to: "POST /api/service-deliveries"
  - priority: 8
    category: business_fiscal
    check: "the enrollment holds at least one ServiceAuthorization with status == ACTIVE covering the current logical clock"
    error_id: ERR_NO_ACTIVE_AUTHORIZATION
    http_status: 409
    applies_to: "POST /api/service-deliveries"
  - priority: 8
    category: business_fiscal
    check: "braided_cost_allocation leaves residual == 0 across the candidate grants"
    error_id: ERR_ALLOCATION_EXCEEDS_AWARD
    http_status: 409
    applies_to: "POST /api/service-deliveries/{id}/document"
  - priority: 8
    category: business_fiscal
    check: "for every receiving grant, Grant.admin_rate_pct <= the governing Funder.max_admin_rate_pct"
    error_id: ERR_ADMIN_RATE_EXCEEDED
    http_status: 422
    applies_to: "POST /api/grants, POST /api/service-deliveries/{id}/document"
  - priority: 8
    category: business_fiscal
    check: "duplication_disallowance returns disallowed_cents == 0 for this delivery"
    error_id: ERR_DUPLICATE_SERVICE_BILLING
    http_status: 409
    applies_to: "POST /api/service-deliveries/{id}/bill"
  - priority: 8
    category: business_fiscal
    check: "in_kind_match_credit leaves the grant's credited total at or above matching_requirement_pct * total_award_cents before an outcome report may be submitted"
    error_id: ERR_MATCH_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /api/outcome-reports/{id}/submit"
  - priority: 8
    category: business_fiscal
    check: "when valuation_method == IRS_STANDARD_RATE, InKindDonation.rate_cents must equal the constant IRS_VOLUNTEER_HOUR_RATE_CENTS of 3390"
    error_id: ERR_INKIND_VALUATION_INVALID
    http_status: 422
    applies_to: "POST /api/in-kind-donations"
  - priority: 5
    category: business_constraint
    check: "the request body carries expected_<parent>_version equal to the parent resource's current version; a mismatch is rejected"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/service-authorizations (expected_enrollment_version), POST /api/service-deliveries (expected_service_authorization_version)"

# §1.5 API Endpoint Table
endpoints:
  - method: POST
    path: "/api/programs"
    description: "create a service program"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, service_domain, faith_based_activity_offered, nondiscrimination_attested, capacity_slots, match_eligible]
    output: Program
    side_effects: ["initialize Program.enrolled_slots = 0", "initialize Program.status = ACTIVE"]
  - method: POST
    path: "/api/funders"
    description: "create a funding source with its compliance flags"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, funder_type, allow_faith_based_activity, requires_time_and_effort_documentation, max_admin_rate_pct, fiscal_year_start_month]
    output: Funder
    side_effects: ["initialize Funder.status = ACTIVE"]
  - method: POST
    path: "/api/grants"
    description: "create a grant award that funds one program"
    roles: [FinanceOfficer]
    code: 201
    input: [funder_id, program_id, grant_code, total_award_cents, admin_rate_pct, allocation_rank, max_in_kind_rate_cents, matching_requirement_pct, cost_allocation_basis, restricted_purpose, period_start, period_end]
    output: Grant
    side_effects: ["initialize Grant.expended_cents = 0 and Grant.obligated_cents = 0", "compute Grant.burn_ratio using grant_burn_posture", "set Grant.status to the computed posture"]
  - method: GET
    path: "/api/grants"
    description: "list grants filtered by funder, program or posture"
    roles: [IntakeSpecialist, ProgramManager, FinanceOfficer, ComplianceOfficer]
    code: 200
    input: ["funder_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Grant[]
    side_effects: []
  - method: GET
    path: "/api/grants/{id}"
    description: "read one grant; returns the gating committed_basis burn_ratio, the reporting-only cash_basis burn_ratio and the child counts"
    roles: [IntakeSpecialist, ProgramManager, FinanceOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: GET
    path: "/api/grants/{id}/outcome-reports"
    description: "list the outcome reports filed against one grant"
    roles: [ProgramManager, ComplianceOfficer]
    code: 200
    input: ["measure_code?", "status?", "limit?", "offset?"]
    output: OutcomeReport[]
    side_effects: []
  - method: GET
    path: "/api/grants/{id}/in-kind-donations"
    description: "list the in-kind contributions credited against one grant"
    roles: [ProgramManager, FinanceOfficer, ComplianceOfficer]
    code: 200
    input: ["donor_type?", "status?", "limit?", "offset?"]
    output: InKindDonation[]
    side_effects: []
  - method: POST
    path: "/api/grants/{id}/posture-recompute"
    description: "recompute burn_ratio and re-apply the posture transition for one grant"
    roles: [FinanceOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: Grant
    side_effects: ["recompute Grant.burn_ratio via grant_burn_posture", "apply the resulting Grant status transition", "on FROZEN, set every ACTIVE Enrollment with grant_id == Grant.id to SUSPENDED", "increment Grant.version by 1"]
  - method: POST
    path: "/api/clients"
    description: "register a client at the single door"
    roles: [IntakeSpecialist]
    code: 201
    input: [full_name, date_of_birth, household_size, immigration_status, county_code, "confidentiality_tier?", "consent_scope?", "consent_expires_on?"]
    output: Client
    side_effects: ["initialize Client.open_enrollment_count = 0"]
  - method: GET
    path: "/api/clients/{id}"
    description: "computed read of one client; returns open_enrollment_count and the consent_first shareable_domains projection alongside the record"
    roles: [IntakeSpecialist, ComplianceOfficer, Client]
    code: 200
    input: []
    output: Client
    side_effects: ["recompute Client.open_enrollment_count via program_capacity_consumption", "compute shareable_domains using the consent_first variant of confidentiality_scope_resolution"]
  - method: POST
    path: "/api/clients/{id}/intake-assessments"
    description: "open a single-door intake assessment for a client"
    roles: [IntakeSpecialist]
    code: 201
    input: [assessment_date, presenting_needs, requested_domains]
    output: IntakeAssessment
    side_effects: ["set IntakeAssessment.assessed_by_user_id from the X-User-ID header", "initialize IntakeAssessment.status = DRAFT and routing_outcome = PENDING"]
  - method: GET
    path: "/api/intake-assessments"
    description: "list intake assessments filtered by client or status"
    roles: [IntakeSpecialist, ComplianceOfficer]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: IntakeAssessment[]
    side_effects: []
  - method: GET
    path: "/api/intake-assessments/{id}"
    description: "read one intake assessment and its routing outcome"
    roles: [IntakeSpecialist, ComplianceOfficer]
    code: 200
    input: []
    output: IntakeAssessment
    side_effects: []
  - method: POST
    path: "/api/intake-assessments/{id}/submit"
    description: "submit an assessment for routing, or resubmit a returned one"
    roles: [IntakeSpecialist]
    code: 200
    input: []
    output: IntakeAssessment
    side_effects: ["apply the DRAFT to SUBMITTED or RETURNED to SUBMITTED transition", "increment IntakeAssessment.version by 1"]
  - method: POST
    path: "/api/intake-assessments/{id}/route"
    description: "route a submitted assessment once at least one of its screens is verified"
    roles: [IntakeSpecialist]
    code: 200
    input: []
    output: IntakeAssessment
    side_effects: ["set IntakeAssessment.status = ROUTED", "set routing_outcome to ROUTED or NO_ELIGIBLE_PROGRAM", "increment IntakeAssessment.version by 1"]
  - method: POST
    path: "/api/intake-assessments/{id}/return"
    description: "compliance review returns a submitted assessment to the intake specialist"
    roles: [ComplianceOfficer]
    code: 200
    input: [return_reason_code]
    output: IntakeAssessment
    side_effects: ["set IntakeAssessment.status = RETURNED", "set every EligibilityScreen for this assessment to verification_state = EXPIRED", "reset every ELIGIBLE screen for this assessment to determination = PENDING", "increment IntakeAssessment.version by 1"]
  - method: POST
    path: "/api/intake-assessments/{id}/eligibility-screens"
    description: "open a funder-specific eligibility screen under an assessment"
    roles: [IntakeSpecialist, ComplianceOfficer]
    code: 201
    input: [program_id, grant_id, verified_income_cents, household_size_at_screen]
    output: EligibilityScreen
    side_effects: ["initialize determination = PENDING and verification_state = UNVERIFIED", "set screened_at to the current logical clock"]
  - method: GET
    path: "/api/eligibility-screens"
    description: "list eligibility screens filtered by assessment, program, grant or determination"
    roles: [IntakeSpecialist, ProgramManager, ComplianceOfficer]
    code: 200
    input: ["intake_assessment_id?", "program_id?", "grant_id?", "determination?", "limit?", "offset?"]
    output: EligibilityScreen[]
    side_effects: []
  - method: GET
    path: "/api/eligibility-screens/{id}"
    description: "read one eligibility screen, both of its independent state dimensions, and its denial reason"
    roles: [IntakeSpecialist, ProgramManager, ComplianceOfficer]
    code: 200
    input: []
    output: EligibilityScreen
    side_effects: []
  - method: POST
    path: "/api/eligibility-screens/{id}/determine"
    description: "advance the verification dimension and then record the determination; an ELIGIBLE determination creates the enrollment and runs the capacity cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [determination, "denial_reason_code?"]
    output: EligibilityScreen
    side_effects: ["set verification_state = VERIFIED when it was UNVERIFIED", "set determination to ELIGIBLE or INELIGIBLE", "on ELIGIBLE, create an Enrollment with status PENDING for the client, program and grant", "on ELIGIBLE, increment Program.enrolled_slots by 1", "when Program.enrolled_slots reaches Program.capacity_slots, set every PENDING screen for that program to INELIGIBLE with denial_reason_code PROGRAM_AT_CAPACITY and set the enrollments those screens created to DENIED", "increment EligibilityScreen.version by 1"]
  - method: POST
    path: "/api/enrollments"
    description: "create a program enrollment directly against an established eligibility screen"
    roles: [ProgramManager]
    code: 201
    input: [client_id, program_id, grant_id]
    output: Enrollment
    side_effects: ["initialize Enrollment.status = PENDING", "set enrolled_at to the current logical clock", "increment Program.enrolled_slots by 1"]
  - method: GET
    path: "/api/enrollments"
    description: "list enrollments filtered by client, program, grant or status"
    roles: [ProgramManager, FinanceOfficer, ComplianceOfficer]
    code: 200
    input: ["client_id?", "program_id?", "grant_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/api/enrollments/{id}"
    description: "read one enrollment with its slot accounting and exit record"
    roles: [ProgramManager, FinanceOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/api/enrollments/{id}/activate"
    description: "activate a pending enrollment, or reinstate one that the grant-freeze cascade suspended"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["set Enrollment.status = ACTIVE", "increment Client.open_enrollment_count by 1 when the prior status was PENDING or SUSPENDED", "increment Enrollment.version by 1"]
  - method: POST
    path: "/api/enrollments/{id}/exit"
    description: "exit an enrollment from PENDING, ACTIVE or SUSPENDED and expire its active authorizations"
    roles: [ProgramManager]
    code: 200
    input: [exit_reason]
    output: Enrollment
    side_effects: ["set Enrollment.status = EXITED and exited_at to the current logical clock", "decrement Program.enrolled_slots by 1", "decrement Client.open_enrollment_count by 1 when the prior status was ACTIVE", "set every ACTIVE ServiceAuthorization for this enrollment to EXPIRED", "increment Enrollment.version by 1"]
  - method: POST
    path: "/api/service-authorizations"
    description: "authorize a block of service units under an enrollment, guarded by enrollment-version OCC"
    roles: [ProgramManager]
    code: 201
    input: [enrollment_id, grant_id, service_code, authorized_units, unit_rate_cents, period_start, period_end, expected_enrollment_version]
    output: ServiceAuthorization
    side_effects: ["initialize ServiceAuthorization.status = ACTIVE and units_delivered = 0", "increments Enrollment.version by 1"]
  - method: GET
    path: "/api/service-authorizations"
    description: "list service authorizations filtered by enrollment, grant or status"
    roles: [ProgramManager, FinanceOfficer]
    code: 200
    input: ["enrollment_id?", "grant_id?", "status?", "limit?", "offset?"]
    output: ServiceAuthorization[]
    side_effects: []
  - method: GET
    path: "/api/service-authorizations/{id}"
    description: "read one authorization with its consumed-unit counter and remaining period"
    roles: [ProgramManager, FinanceOfficer]
    code: 200
    input: []
    output: ServiceAuthorization
    side_effects: []
  - method: POST
    path: "/api/service-deliveries"
    description: "record a unit-of-service delivery, guarded by authorization-version OCC"
    roles: [ProgramManager]
    code: 201
    input: [service_authorization_id, grant_id, client_id, service_date, units_delivered, unit_rate_cents, expected_service_authorization_version]
    output: ServiceDelivery
    side_effects: ["assign ServiceDelivery.sequence_no from the server counter", "initialize ServiceDelivery.status = DRAFT and documentation_status = INCOMPLETE", "set gross_cost_cents = units_delivered * unit_rate_cents", "increments ServiceAuthorization.version by 1"]
  - method: GET
    path: "/api/service-deliveries"
    description: "list deliveries filtered by authorization, grant, client or status; each row carries alternate_disallowed_cents from the lowest_cost_first projection"
    roles: [ProgramManager, FinanceOfficer, ComplianceOfficer]
    code: 200
    input: ["service_authorization_id?", "grant_id?", "client_id?", "status?", "limit?", "offset?"]
    output: ServiceDelivery[]
    side_effects: []
  - method: GET
    path: "/api/service-deliveries/{id}"
    description: "read one delivery with its documentation status, braided totals and duplication projections"
    roles: [ProgramManager, FinanceOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: ServiceDelivery
    side_effects: []
  - method: POST
    path: "/api/service-deliveries/{id}/document"
    description: "attach audit-ready documentation, braid the cost across grants and advance the governing grants' posture"
    roles: [ProgramManager]
    code: 200
    input: []
    output: ServiceDelivery
    side_effects: ["run braided_cost_allocation and rewrite the delivery's CostAllocation rows", "run delivery_unit_cost to set allocated_total_cents and admin_total_cents", "increase Grant.obligated_cents for every receiving grant", "recompute Grant.burn_ratio and apply the posture transition for every receiving grant", "increase ServiceAuthorization.units_delivered", "increment ServiceDelivery.version by 1"]
  - method: POST
    path: "/api/service-deliveries/{id}/bill"
    description: "commit the braided allocations and bill the funders, refusing prohibited duplication"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ServiceDelivery
    side_effects: ["set every PROVISIONAL CostAllocation for this delivery to COMMITTED", "move the same amount from Grant.obligated_cents to Grant.expended_cents for every receiving grant", "recompute Grant.burn_ratio and apply the posture transition for every receiving grant", "increment ServiceDelivery.version by 1"]
  - method: POST
    path: "/api/service-deliveries/{id}/void"
    description: "compensating reversal of a documented or billed delivery"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ServiceDelivery
    side_effects: ["set every CostAllocation for this delivery to REVERSED", "decrease Grant.obligated_cents or Grant.expended_cents by the reversed line totals", "recompute Grant.burn_ratio and apply the posture transition for every receiving grant", "decrease ServiceAuthorization.units_delivered", "increment ServiceDelivery.version by 1"]
  - method: GET
    path: "/api/cost-allocations"
    description: "list cost allocation lines filtered by delivery, grant or status"
    roles: [FinanceOfficer, ComplianceOfficer]
    code: 200
    input: ["service_delivery_id?", "grant_id?", "status?", "limit?", "offset?"]
    output: CostAllocation[]
    side_effects: []
  - method: GET
    path: "/api/cost-allocations/{id}"
    description: "read one braided allocation line with its rank, basis and disallowed amount"
    roles: [FinanceOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: CostAllocation
    side_effects: []
  - method: POST
    path: "/api/in-kind-donations"
    description: "record a parish or volunteer in-kind contribution against a grant and compute its match credit"
    roles: [ProgramManager, FinanceOfficer]
    code: 201
    input: [grant_id, donor_type, donor_reference, donation_date, hours, valuation_method, rate_cents]
    output: InKindDonation
    side_effects: ["compute InKindDonation.value_cents and uncapped_value_cents", "compute InKindDonation.match_credit_cents via in_kind_match_credit", "set InKindDonation.status = ACCEPTED or REJECTED"]
  - method: POST
    path: "/api/outcome-reports"
    description: "open a funder-specific outcome report for a grant and measure"
    roles: [ProgramManager]
    code: 201
    input: [grant_id, measure_code, reporting_period_start, reporting_period_end, numerator, denominator]
    output: OutcomeReport
    side_effects: ["initialize OutcomeReport.status = DRAFT and rate_pct = null"]
  - method: POST
    path: "/api/outcome-reports/{id}/submit"
    description: "compute the outcome rate and submit the report to the funder"
    roles: [ProgramManager]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: ["run outcome_rate to set rate_pct and denominator_basis", "run in_kind_match_credit against the governing grant", "set OutcomeReport.status = SUBMITTED or RETURNED", "increment OutcomeReport.version by 1"]
  - method: POST
    path: "/api/outcome-reports/{id}/accept"
    description: "compliance acceptance of a submitted report"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: ["set OutcomeReport.status = ACCEPTED", "increment OutcomeReport.version by 1"]
  - method: POST
    path: "/api/outcome-reports/{id}/reject"
    description: "compliance rejection returning a submitted report for correction"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: ["set OutcomeReport.status = RETURNED and rate_pct = null", "increment OutcomeReport.version by 1"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "test-driving endpoint: set the logical clock. The server's startup default is 2026-09-01T00:00:00Z and no rule may read real wall-clock time before this endpoint is called."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set the logical clock used by every temporal precondition and by all created_at stamps"]

# §1.6 Error Code Catalog
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing, or X-User-Role is not a declared role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles set"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "the client path segment does not resolve to a Client row"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "the program_id in the body does not resolve to a Program row"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "the grant_id in the body does not resolve to a Grant row"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "the enrollment path segment or body field does not resolve to an Enrollment row"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "the service_authorization_id in the body does not resolve to a ServiceAuthorization row"
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "the service delivery path segment does not resolve to a ServiceDelivery row"
  - id: ERR_OUTCOME_REPORT_NOT_FOUND
    http: 404
    condition: "the outcome report path segment does not resolve to an OutcomeReport row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's current status is not the from-state of any transition this endpoint may trigger, including any attempt to leave a terminal state"
  - id: ERR_INTAKE_NOT_ROUTED
    http: 409
    condition: "POST /api/eligibility-screens/{id}/determine is called while the parent IntakeAssessment.status is not ROUTED"
  - id: ERR_GRANT_FROZEN
    http: 409
    condition: "a child write is attempted against a Grant whose status is FROZEN"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_enrollment_version or expected_service_authorization_version does not equal the parent resource's current version"
  - id: ERR_CONFIDENTIALITY_SCOPE_DENIED
    http: 403
    condition: "confidentiality_scope_resolution returns allowed == false for the client and the target program's service_domain"
  - id: ERR_FAITH_BASED_ACTIVITY_PROHIBITED
    http: 422
    condition: "public funds from a funder with allow_faith_based_activity == false are attached to a program with faith_based_activity_offered == true"
  - id: ERR_NONDISCRIMINATION_VIOLATION
    http: 422
    condition: "a FEDERAL or STATE funded screen or enrollment targets a program whose nondiscrimination_attested is false"
  - id: ERR_ELIGIBILITY_NOT_ESTABLISHED
    http: 409
    condition: "POST /api/enrollments is called with no EligibilityScreen for that client, program and grant carrying determination ELIGIBLE and verification_state VERIFIED"
  - id: ERR_CLIENT_ALREADY_ENROLLED
    http: 409
    condition: "the client already holds an Enrollment for the same program whose status IN {PENDING, ACTIVE, SUSPENDED}"
  - id: ERR_AUTHORIZATION_PERIOD_OVERLAP
    http: 409
    condition: "the requested half-open [period_start, period_end) overlaps an existing ServiceAuthorization for the same enrollment and service_code; touching endpoints are permitted"
  - id: ERR_OUTCOME_PERIOD_OVERLAP
    http: 409
    condition: "the requested closed [reporting_period_start, reporting_period_end] overlaps an existing OutcomeReport for the same grant and measure_code, or abuts it without the mandatory one-day gap"
  - id: ERR_INKIND_HOURS_EXCEEDED
    http: 422
    condition: "a donor_reference would exceed 40 documented hours within the rolling 7-day window ending at the donation_date"
  - id: ERR_PROGRAM_CAPACITY_EXCEEDED
    http: 409
    condition: "Program.enrolled_slots >= Program.capacity_slots at the moment a slot would be consumed"
  - id: ERR_ZERO_UNITS
    http: 422
    condition: "units_delivered is 0 on POST /api/service-deliveries"
  - id: ERR_NO_ACTIVE_AUTHORIZATION
    http: 409
    condition: "the enrollment holds no ServiceAuthorization with status ACTIVE covering the current logical clock"
  - id: ERR_ALLOCATION_EXCEEDS_AWARD
    http: 409
    condition: "braided_cost_allocation leaves a positive residual because the combined remaining capacity of every candidate grant is below the delivery's total cost"
  - id: ERR_ADMIN_RATE_EXCEEDED
    http: 422
    condition: "Grant.admin_rate_pct exceeds the governing Funder.max_admin_rate_pct"
  - id: ERR_DUPLICATE_SERVICE_BILLING
    http: 409
    condition: "duplication_disallowance returns a positive disallowed_cents for the delivery being billed"
  - id: ERR_MATCH_REQUIREMENT_UNMET
    http: 422
    condition: "the grant's credited in-kind total is below matching_requirement_pct * total_award_cents at outcome-report submission"
  - id: ERR_INKIND_VALUATION_INVALID
    http: 422
    condition: "valuation_method is IRS_STANDARD_RATE but rate_cents is not 3390"

# §1.7 RBAC Matrix
roles:
  - name: IntakeSpecialist
    description: "front-door staff who register clients, open and submit assessments, and route them into program screens"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/clients"
      - "POST /api/clients/{id}/intake-assessments"
      - "POST /api/intake-assessments/{id}/submit"
      - "POST /api/intake-assessments/{id}/route"
    shared_operations:
      - "GET /api/clients/{id}"
      - "GET /api/intake-assessments"
      - "GET /api/intake-assessments/{id}"
      - "POST /api/intake-assessments/{id}/eligibility-screens"
      - "GET /api/eligibility-screens"
      - "GET /api/eligibility-screens/{id}"
      - "GET /api/grants"
      - "GET /api/grants/{id}"
  - name: ProgramManager
    description: "program staff who enroll clients, authorize service units, document deliveries and file outcome reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/enrollments"
      - "POST /api/enrollments/{id}/activate"
      - "POST /api/enrollments/{id}/exit"
      - "POST /api/service-authorizations"
      - "POST /api/service-deliveries"
      - "POST /api/service-deliveries/{id}/document"
      - "POST /api/outcome-reports"
      - "POST /api/outcome-reports/{id}/submit"
    shared_operations:
      - "POST /api/in-kind-donations"
      - "GET /api/grants"
      - "GET /api/grants/{id}"
      - "GET /api/grants/{id}/in-kind-donations"
      - "GET /api/grants/{id}/outcome-reports"
      - "GET /api/enrollments"
      - "GET /api/enrollments/{id}"
      - "GET /api/service-authorizations"
      - "GET /api/service-authorizations/{id}"
      - "GET /api/service-deliveries"
      - "GET /api/service-deliveries/{id}"
      - "GET /api/eligibility-screens"
      - "GET /api/eligibility-screens/{id}"
  - name: FinanceOfficer
    description: "fiscal staff who create awards, bill funders, reverse misbillings and value in-kind contributions"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/grants"
      - "POST /api/grants/{id}/posture-recompute"
      - "POST /api/service-deliveries/{id}/bill"
      - "POST /api/service-deliveries/{id}/void"
    shared_operations:
      - "POST /api/in-kind-donations"
      - "GET /api/grants"
      - "GET /api/grants/{id}"
      - "GET /api/grants/{id}/in-kind-donations"
      - "GET /api/cost-allocations"
      - "GET /api/cost-allocations/{id}"
      - "GET /api/enrollments"
      - "GET /api/enrollments/{id}"
      - "GET /api/service-authorizations"
      - "GET /api/service-authorizations/{id}"
      - "GET /api/service-deliveries"
      - "GET /api/service-deliveries/{id}"
  - name: ComplianceOfficer
    description: "review staff who determine eligibility, return defective assessments, recompute posture and accept funder reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/programs"
      - "POST /api/funders"
      - "POST /api/intake-assessments/{id}/return"
      - "POST /api/eligibility-screens/{id}/determine"
      - "POST /api/outcome-reports/{id}/accept"
      - "POST /api/outcome-reports/{id}/reject"
    shared_operations:
      - "POST /api/intake-assessments/{id}/eligibility-screens"
      - "POST /api/grants/{id}/posture-recompute"
      - "GET /api/clients/{id}"
      - "GET /api/intake-assessments"
      - "GET /api/intake-assessments/{id}"
      - "GET /api/eligibility-screens"
      - "GET /api/eligibility-screens/{id}"
      - "GET /api/grants"
      - "GET /api/grants/{id}"
      - "GET /api/grants/{id}/in-kind-donations"
      - "GET /api/grants/{id}/outcome-reports"
      - "GET /api/cost-allocations"
      - "GET /api/cost-allocations/{id}"
      - "GET /api/enrollments"
      - "GET /api/enrollments/{id}"
      - "GET /api/service-deliveries"
      - "GET /api/service-deliveries/{id}"
  - name: Client
    description: "the person receiving services, acting through a self-service portal on their own record only"
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "GET /api/clients/{id}"
  - name: PlatformAdmin
    description: "operator role that drives the logical clock for deterministic temporal testing"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations: []
