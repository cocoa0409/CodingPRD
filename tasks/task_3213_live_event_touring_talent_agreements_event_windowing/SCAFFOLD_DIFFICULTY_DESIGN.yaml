  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_tiered_rate_day_gross_interaction
        grounds:
          - calculations.royalty_line_split
          - entities.MerchSale.fields.royalty_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: rate selection depends on 3 interacting inputs
          (agreement rate_bp, day_gross tier thresholds, per-line rounding) — a
          day gross of exactly 100000 cents keeps the base tier (>=), while
          100001 cents would add +200bp to every line of the day.
        test_recipe:
          setup:
            - "Talent T BOOKABLE with ACTIVE agreement rate 2000bp, likeness granted"
            - "COMPLETED house event HS with two merch lines on 2026-09-05: 2 x 5000 and 3 x 30000 (day gross exactly 100000 cents, the TIER1 boundary)"
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Tier Gal", legal_name: "Tier Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2027-01-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: true, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ContractAdmin
            - call: "POST /touring/arenas"
              payload: { name: "Tier Arena", city: "Orlando", country_code: "US", capacity: 2000, merch_booths: 2, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "B1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-03", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${b1_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${b1_id}/lock"
