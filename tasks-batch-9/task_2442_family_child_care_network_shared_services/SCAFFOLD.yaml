# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not one of the six declared roles, or X-User-ID missing / not resolvable to a row of an entity_backed role's entity"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_PROVIDER_SCOPE_VIOLATION
    http: 403
    condition: "A Provider actor addresses a resource whose provider_id (directly or through contract_id) is not the acting provider"
  - id: ERR_SUBSTITUTE_SCOPE_VIOLATION
    http: 403
    condition: "A Substitute actor accepts or declines an assignment whose substitute_id is not the acting substitute"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The coach conducting a visit is the coach who scheduled it, or the coach closing a compliance review is the coach who opened it"
  # --- existence ---
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "provider id in the path or body matches no Provider"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement id in the path matches no MembershipAgreement"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment id in the path, or an enrollment_id inside a claim line, matches no Enrollment"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract id in the path or body matches no SubsidyContract"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim id in the path matches no SubsidyClaim"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "remittance id in the path matches no Remittance"
  - id: ERR_FOOD_CLAIM_NOT_FOUND
    http: 404
    condition: "food program claim id in the path matches no FoodProgramClaim"
  - id: ERR_SUBSTITUTE_NOT_FOUND
    http: 404
    condition: "substitute id in the path, or requested_substitute_id in the body, matches no Substitute"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment id in the path matches no SubstituteAssignment"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "coaching visit id in the path matches no CoachingVisit"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "compliance review id in the path matches no ComplianceReview"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "group purchase order id in the path matches no GroupPurchaseOrder"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, negative amount, capacity_slots outside 1..12, days_per_week outside 1..5, observation_score outside 0..100, end_at not after start_at, period_month not matching YYYY-MM, or an empty lines / meal_lines array"
  # --- optimistic concurrency ---
  - id: ERR_STALE_PROVIDER_VERSION
    http: 412
    condition: "expected_provider_version on POST /fccn/membership-agreements does not equal the provider's current version"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version on POST /fccn/subsidy-claims does not equal the contract's current version"
  # --- own-entity state ---
  - id: ERR_INVALID_PROVIDER_STATE
    http: 409
    condition: "The provider's membership_status is not a declared from-state of the requested transition"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "The agreement's status is not a declared from-state of counter, revise, execute or withdraw"
  - id: ERR_INVALID_ENROLLMENT_STATE
    http: 409
    condition: "The enrollment's status is not a declared from-state of withdraw or transfer"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "The claim's status is not a declared from-state of submit, advance, reconcile or reject (including a claim HELD by a quality suspension)"
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "The assignment's staffing_status or billing_status is not a declared from-state of accept, decline, complete or invoice"
  - id: ERR_INVALID_VISIT_STATE
    http: 409
    condition: "The coaching visit is not SCHEDULED when conduct is called"
  - id: ERR_INVALID_REVIEW_STATE
    http: 409
    condition: "The review's status is not a declared from-state of submit-cap, reject-cap, close or escalate"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "The group purchase order is not OPEN when commit is called"
  - id: ERR_INVALID_REMITTANCE_STATE
    http: 409
    condition: "The remittance is not POSTED when reverse is called"
  # --- cross-entity state and posture ---
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "The referenced SubsidyContract is SUSPENDED_FOR_QUALITY or TERMINATED when a claim is submitted or a remittance is posted"
  - id: ERR_PROVIDER_POSTURE_BLOCKED
    http: 409
    condition: "network_posture is FROZEN for any provider-initiated write, or RESTRICTED for a new enrollment, subsidy claim or group purchase order"
  # --- business safety ---
  - id: ERR_SUBSTITUTE_CLEARANCE_EXPIRED
    http: 422
    condition: "The requested substitute's clearance_expires_on is earlier than the assignment's end_at"
  - id: ERR_LICENSE_EXPIRED
    http: 422
    condition: "The provider's license_expires_on is earlier than the logical clock date on an enrollment, claim or coverage request"
  # --- business temporal ---
  - id: ERR_SUBSTITUTE_INTERVAL_CONFLICT
    http: 409
    condition: "The requested substitute already holds an OFFERED, CONFIRMED or COMPLETED assignment inside the 30-minute-buffered window around the new interval"
  - id: ERR_COACHING_WINDOW_SATURATED
    http: 409
    condition: "The provider already has 2 SCHEDULED or COMPLETED coaching visits with scheduled_on inside the inclusive plus/minus 29-day window around the requested date"
  - id: ERR_CLAIM_PERIOD_DUPLICATE
    http: 409
    condition: "Another non-REJECTED SubsidyClaim already exists for the same contract and period_month"
  - id: ERR_CAP_DEADLINE_PASSED
    http: 422
    condition: "A corrective action plan is submitted after the review's cap_due_on"
  - id: ERR_VISIT_DATE_IN_PAST
    http: 422
    condition: "scheduled_on is earlier than the logical clock date"
  # --- business referential ---
  - id: ERR_CLAIM_LINE_ENROLLMENT_MISMATCH
    http: 422
    condition: "A claim line's enrollment_id belongs to a different provider than the contract, or names an enrollment with subsidy_certified false"
  - id: ERR_MEAL_LINE_CHILD_UNKNOWN
    http: 422
    condition: "A meal line's child_ref matches no Enrollment child_ref of the claiming provider"
  - id: ERR_RECEIVING_PROVIDER_INELIGIBLE
    http: 422
    condition: "The transfer target is the same provider, is not ACTIVE with network_posture OPEN, is at capacity, or lacks an ACTIVE contract with a free slot for a subsidy-certified child"
  # --- business constraint ---
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "A counter would push round_index above MAX_NEGOTIATION_ROUNDS (3)"
  - id: ERR_MEAL_CAP_EXCEEDED
    http: 422
    condition: "For one child_ref on one service_date, breakfasts + lunches exceeds 2 or snacks exceeds 1"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "The provider's ENROLLED plus TRANSITION_PENDING enrollments already equal capacity_slots"
  - id: ERR_DUPLICATE_CHILD_REF
    http: 409
    condition: "The child_ref is already used by a non-terminal enrollment of the same provider"
  - id: ERR_EXIT_TRANSITIONS_PENDING
    http: 409
    condition: "complete-exit is called while an enrollment is still ENROLLED or TRANSITION_PENDING"
  - id: ERR_CAP_REJECTION_LIMIT_NOT_REACHED
    http: 409
    condition: "escalate is called with cap_rejection_count below 2"
  # --- business fiscal ---
  - id: ERR_SUBSIDY_SLOTS_EXHAUSTED
    http: 409
    condition: "A subsidy-certified enrollment or transfer would commit a slot on a contract whose available_slots is 0"
  - id: ERR_CONTRACT_AUTHORIZATION_EXCEEDED
    http: 402
    condition: "claimed_amount_cents plus the claim's provisional_amount_cents would exceed the contract's authorized_amount_cents at submit"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
roles:
  - name: Anonymous
    description: "An unauthenticated prospective provider who may only file a network application."
    identity: "opaque"
    exclusive_operations:
      - "POST /fccn/providers/apply"
    shared_operations: []
  - name: NetworkAdmin
    description: "Network staff who run recruitment, licensing support, membership negotiation, subsidy contracting, the substitute pool and network exits."
    identity: "opaque"
    exclusive_operations:
      - "POST /fccn/providers/{id}/license-verification"
      - "POST /fccn/providers/{id}/reinstate"
      - "POST /fccn/providers/{id}/exit-network"
      - "POST /fccn/providers/{id}/complete-exit"
      - "POST /fccn/membership-agreements"
      - "POST /fccn/membership-agreements/{id}/revise"
      - "POST /fccn/membership-agreements/{id}/withdraw"
      - "POST /fccn/enrollments/{id}/transfer"
      - "POST /fccn/subsidy-contracts"
      - "POST /fccn/substitutes"
      - "POST /fccn/substitutes/{id}/clearance"
      - "POST /fccn/compliance-reviews/{id}/escalate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /fccn/providers"
      - "GET /fccn/providers/{id} and every provider sub-resource read"
      - "GET /fccn/enrollments, GET /fccn/enrollments/{id}"
      - "GET /fccn/subsidy-contracts/{id} and its claims / remittances reads"
      - "GET /fccn/subsidy-claims/{id}, GET /fccn/food-program-claims/{id}"
      - "GET /fccn/substitutes/{id}, GET /fccn/substitutes/{id}/assignments, GET /fccn/substitute-assignments/{id}"
      - "GET /fccn/membership-agreements/{id}, GET /fccn/compliance-reviews/{id}, GET /fccn/coaching-visits/{id}, GET /fccn/group-purchase-orders/{id}"
  - name: FiscalOfficer
    description: "Shared back-office finance staff who move money: subsidy advances, reconciliation, rejections, agency remittances, food program approval and substitute invoicing. Never touches quality or membership decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /fccn/subsidy-claims/{id}/advance"
      - "POST /fccn/subsidy-claims/{id}/reconcile"
      - "POST /fccn/subsidy-claims/{id}/reject"
      - "POST /fccn/remittances"
      - "POST /fccn/remittances/{id}/reverse"
      - "POST /fccn/food-program-claims/{id}/approve"
      - "POST /fccn/substitute-assignments/{id}/invoice"
    shared_operations:
      - "GET /fccn/providers, GET /fccn/providers/{id}, GET /fccn/providers/{id}/revenue-model"
      - "GET /fccn/providers/{id}/subsidy-contracts, /food-program-claims, /substitute-assignments"
      - "GET /fccn/enrollments, GET /fccn/enrollments/{id}"
      - "GET /fccn/subsidy-contracts/{id} and its claims / remittances reads"
      - "GET /fccn/subsidy-claims/{id}, GET /fccn/food-program-claims/{id}"
      - "GET /fccn/substitutes/{id}, GET /fccn/substitutes/{id}/assignments, GET /fccn/substitute-assignments/{id}"
  - name: QualityCoach
    description: "Coaching and quality-standards staff who schedule and conduct coaching visits and run compliance reviews. Cannot escalate to licensing and cannot close a review they opened."
    identity: "opaque"
    exclusive_operations:
      - "POST /fccn/coaching-visits"
      - "POST /fccn/coaching-visits/{id}/conduct"
      - "POST /fccn/compliance-reviews"
      - "POST /fccn/compliance-reviews/{id}/reject-cap"
      - "POST /fccn/compliance-reviews/{id}/close"
    shared_operations:
      - "GET /fccn/providers, GET /fccn/providers/{id}"
      - "GET /fccn/providers/{id}/coaching-visits, /compliance-reviews"
      - "GET /fccn/compliance-reviews/{id}, GET /fccn/coaching-visits/{id}"
  - name: Provider
    description: "A family child care home acting on its own records: enrollments, subsidy claim drafting, food program claims, coverage requests, group purchasing, agreement negotiation and corrective action plans."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /fccn/membership-agreements/{id}/counter"
      - "POST /fccn/membership-agreements/{id}/execute"
      - "POST /fccn/enrollments"
      - "POST /fccn/enrollments/{id}/withdraw"
      - "POST /fccn/subsidy-claims"
      - "POST /fccn/subsidy-claims/{id}/submit"
      - "POST /fccn/food-program-claims"
      - "POST /fccn/substitute-assignments"
      - "POST /fccn/substitute-assignments/{id}/complete"
      - "POST /fccn/compliance-reviews/{id}/submit-cap"
      - "POST /fccn/group-purchase-orders"
      - "POST /fccn/group-purchase-orders/{id}/commit"
    shared_operations:
      - "GET /fccn/providers/{id} and every provider sub-resource read, scoped to X-User-ID"
      - "GET /fccn/providers/{id}/revenue-model, scoped to X-User-ID"
      - "GET /fccn/enrollments, GET /fccn/enrollments/{id}, scoped to X-User-ID"
      - "GET /fccn/subsidy-contracts/{id} and its claims / remittances reads, scoped to X-User-ID"
      - "GET /fccn/subsidy-claims/{id}, GET /fccn/food-program-claims/{id}, GET /fccn/substitute-assignments/{id}"
      - "GET /fccn/membership-agreements/{id}, GET /fccn/compliance-reviews/{id}, GET /fccn/coaching-visits/{id}, GET /fccn/group-purchase-orders/{id}"
  - name: Substitute
    description: "A pool member who answers coverage offers for their own assignments only."
    identity: "entity_backed:Substitute"
    exclusive_operations:
      - "POST /fccn/substitute-assignments/{id}/accept"
      - "POST /fccn/substitute-assignments/{id}/decline"
    shared_operations:
      - "GET /fccn/substitutes/{id}, scoped to X-User-ID"
      - "GET /fccn/substitutes/{id}/assignments, scoped to X-User-ID"
      - "GET /fccn/substitute-assignments/{id}, scoped to X-User-ID"
