              as: VenueScheduler
              captures: { tr_s: $.data.id }
            - call: "POST /venue/shows/${tr_s}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
            - call: "POST /venue/maintenance-windows"
              payload: { venue_system_id: "${tr_v}", start_time: "2026-09-01T03:30:00Z", end_time: "2026-09-01T04:00:00Z", buffer_minutes: 15 }
              as: VenueOpsEngineer
              captures: { tr_m1: $.data.id }
            - call: "POST /venue/_clock/set_current_utc"
