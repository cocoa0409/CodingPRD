      - name: err_rnd_temporal_guards_hold_the_calendar_and_the_reading_order
        claim_type: guard_ladder
        grounds:
          - errors[ERR_PILOT_RUN_NOT_DUE]
          - errors[ERR_TIMEPOINT_OUT_OF_ORDER]
        distinguishing_aspect: |
          A pilot run cannot start before its booked window opens, and shelf-life readings must
          march strictly forward: repeating the day just recorded is refused exactly like going
          backwards, and the boundary case of starting at the window instant is allowed.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One NONE-regime pilot line and one IDEA project with a DRAFT formulation."
            - "One pilot run booked for 2026-08-10T08:00:00Z to 2026-08-10T16:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-lines"
              payload: { plant_name: "Toledo", line_code: "TOL-51", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 500.00 }
              as: PortfolioAdmin
              captures: { rt_line_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-rt"
              captures: { rt_p_id: $.data.id, rt_p_v1: $.data.version }
            - call: "POST /innovation-projects/${rt_p_id}/formulations"
              payload: { expected_project_version: "${rt_p_v1}", spec_summary: "Toffee inclusion at 12 percent", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 2.5000 }
              as: RnDLead
              captures: { rt_f_id: $.data.id }
            - call: "POST /formulations/${rt_f_id}/pilot-runs"
              payload: { pilot_line_id: "${rt_line_id}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T16:00:00Z", planned_units: 10000, committed_cost_usd: 10000.00 }
              as: RnDLead
              captures: { rt_run_id: $.data.id }
          trigger:
            - call: "POST /pilot-runs/${rt_run_id}/start"
              as: RnDLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-runs/${rt_run_id}/start"
              as: RnDLead
            - call: "POST /pilot-runs/${rt_run_id}/complete"
              payload: { actual_units: 10000 }
              as: RnDLead
            - call: "GET /formulations/${rt_f_id}"
              as: RnDLead
              captures: { rt_f_v: $.data.version }
            - call: "POST /formulations/${rt_f_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${rt_f_v}", duration_days: 180, committed_cost_usd: 20000.00, start_at: "2026-08-11T00:00:00Z" }
              as: RnDLead
              captures: { rt_sls_id: $.data.id }
            - call: "POST /shelf-life-studies/${rt_sls_id}/timepoints"
              payload: { day_index: 30, quality_score: 90.00 }
              as: RnDLead
            - call: "POST /shelf-life-studies/${rt_sls_id}/timepoints"
              payload: { day_index: 30, quality_score: 89.00 }
              as: RnDLead
            - call: "POST /shelf-life-studies/${rt_sls_id}/timepoints"
              payload: { day_index: 20, quality_score: 95.00 }
              as: RnDLead
            - call: "POST /shelf-life-studies/${rt_sls_id}/timepoints"
              payload: { day_index: 60, quality_score: 80.00 }
              as: RnDLead
          assert:
            - "the first start answers 409 ERR_PILOT_RUN_NOT_DUE with PilotRun.${rt_run_id}.status still SCHEDULED"
            - "the second start, issued at exactly window_start, answers 200 with status RUNNING, so the boundary instant is inclusive"
            - "the completion answers 200 with yield_pct 100.00 and moves Formulation.${rt_f_id} to PILOT_PASSED"
            - "the day 30 reading answers 200 with min_quality_score 90.00 and status ACTIVE"
            - "the repeated day 30 reading answers 409 ERR_TIMEPOINT_OUT_OF_ORDER, so equal is not strictly greater"
            - "the day 20 reading answers 409 ERR_TIMEPOINT_OUT_OF_ORDER as well"
            - "the day 60 reading answers 200 and min_quality_score becomes 80.00, while the refused 95.00 never enters the minimum"
            - "ShelfLifeStudy.${rt_sls_id}.timepoints holds exactly two entries, day 30 and day 60"

      - name: err_conditions_window_swaps_at_the_due_instant
        claim_type: boundary_guard_pair
        grounds:
          - errors[ERR_CONDITIONS_NOT_DUE]
          - errors[ERR_CONDITIONS_DUE_PASSED]
        distinguishing_aspect: |
          The two conditions guards are complementary across one instant: at exactly
          conditions_due_at clearing is still permitted and expiry is refused, and one second later
          the pair swaps, so no moment allows both and no moment allows neither.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
