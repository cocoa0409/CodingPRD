        grounds:
          - complexity_profile.consistency_model
          - entities.Booking.fields.status
        distinguishing_aspect: "Immediate consistency: the confirm response itself carries status CONFIRMED and the very next GET (no wait, no replay) returns the identical state and bumped version — no eventual-consistency lag anywhere."
        test_recipe:
          setup: ["QUOTED booking"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME IMM", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
