  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: audit_score_70_passes_69_violates_component_level
        grounds:
          - calculations.audit_compliance
          - entities.RetailAccount.fields.audit_log
        distinguishing_aspect: "Numeric threshold boundary on the audit endpoint: component score exactly 70 passes (threshold is >= 70) while 69 violates — and (69,70,70) still composites to 70, proving violation is component-level, not composite-level."
        test_recipe:
          setup:
            - "Active cash agreement with two retail accounts; clock 2026-09-01."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr
            - *k_activate
            - call: "POST /distributors/${dist_id}/retail-accounts"
              payload: { store_name: "ValueBasket North", delivery_weekdays: ["MON"] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { acct_p_id: $.data.id }
            - call: "POST /distributors/${dist_id}/retail-accounts"
              payload: { store_name: "ValueBasket South", delivery_weekdays: ["TUE"] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { acct_q_id: $.data.id }
          trigger:
            - call: "POST /retail-accounts/${acct_p_id}/audits"
              payload: { audit_date: "2026-09-01", shelf_stock_score: 70, rotation_score: 70, display_score: 70 }
              as: RouteOpsManager
            - call: "POST /retail-accounts/${acct_q_id}/audits"
              payload: { audit_date: "2026-09-01", shelf_stock_score: 69, rotation_score: 70, display_score: 70 }
              as: RouteOpsManager
          assert:
            - "RetailAccount.${acct_p_id}.compliance_score == 70 and its latest audit entry is_violation == false (all components >= 70)"
            - "RetailAccount.${acct_q_id}.compliance_score == 70 (round_half_up(0.4*69+0.3*70+0.3*70) = round_half_up(69.6)) yet its latest audit entry is_violation == true"
            - "RouteAgreement.${agr_id}.strike_count == 1 (only the 69-component audit counts)"
            - "RouteAgreement.${agr_id}.status == ACTIVE (1 strike < 3)"

      - name: confirm_capacity_exact_fit_allowed_one_over_rejected
        grounds:
          - validations[priority=11]
          - errors.ERR_CAPACITY_EXCEEDED
          - state_machines.DailyOrder.SUBMITTED_to_CONFIRMED
        distinguishing_aspect: "Capacity boundary on the confirm endpoint (different metric and endpoint from the audit threshold): allocated + units == capacity is allowed (<=), while one unit over is rejected with ERR_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "Active cash agreement; production day 2026-09-04 with default capacity 100; three SUBMITTED orders of 60, 40, and 1 units for delivery 2026-09-04."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr
            - *k_activate
            - *k_day0904
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "WHT-24", qty: 60 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_a_id: $.data.id }
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "BUN-12", qty: 40 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_b_id: $.data.id }
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "WHT-24", qty: 1 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_c2_id: $.data.id }
            - call: "POST /orders/${ord_a_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /orders/${ord_b_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /orders/${ord_c2_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /orders/${ord_a_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v}" }
              as: RouteOpsManager
            - call: "GET /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-04" }
              as: RouteOpsManager
              captures: { day0904_v2: "$.data[0].version", day0904_alloc2: "$.data[0].allocated_units" }
            - call: "POST /orders/${ord_b_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v2}" }
              as: RouteOpsManager
            - call: "GET /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-04" }
              as: RouteOpsManager
              captures: { day0904_v3: "$.data[0].version", day0904_alloc3: "$.data[0].allocated_units" }
            - call: "POST /orders/${ord_c2_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v3}" }
              as: RouteOpsManager
              captures: { confirm_err: $.data.error_id }
          assert:
            - "DailyOrder.${ord_a_id}.status == CONFIRMED and day0904_alloc2 == 60"
            - "DailyOrder.${ord_b_id}.status == CONFIRMED and day0904_alloc3 == 100 (exact fit: 60 + 40 <= 100 allowed)"
            - "the third confirm returns 409 and confirm_err == ERR_CAPACITY_EXCEEDED (100 + 1 > 100)"
            - "DailyOrder.${ord_c2_id}.status == SUBMITTED (unchanged) and ProductionDay.${day0904_id}.allocated_units stays 100"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_blocked_when_agreement_suspended
        grounds:
          - state_machines.DailyOrder.DRAFT_to_SUBMITTED
          - state_machines.RouteAgreement.ACTIVE_to_SUSPENDED_SERVICE
          - errors.ERR_AGREEMENT_NOT_ACTIVE
        distinguishing_aspect: "Entity pair DailyOrder -> RouteAgreement: the order's DRAFT -> SUBMITTED transition is gated on the agreement's ACTIVE state; the same submit succeeds after reinstate, isolating the cross-entity gate."
        test_recipe:
          setup:
            - "Cash agreement ACTIVE then SUSPENDED_SERVICE; a DRAFT order for delivery 2026-09-05."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr
            - *k_activate
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-05", lines: [{ sku: "WHT-24", qty: 5 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_g_id: $.data.id }
            - call: "POST /agreements/${agr_id}/suspend"
              payload: { reason: "SERVICE_DEFAULT" }
              as: RouteOpsManager
          trigger:
            - call: "POST /orders/${ord_g_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { submit_err2: $.data.error_id }
            - call: "POST /agreements/${agr_id}/reinstate"
              payload: {}
              as: RouteOpsManager
            - call: "POST /orders/${ord_g_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "first submit: 409 and submit_err2 == ERR_AGREEMENT_NOT_ACTIVE; DailyOrder.${ord_g_id}.status stays DRAFT"
            - "after reinstate to ACTIVE, the same submit succeeds and DailyOrder.${ord_g_id}.status == SUBMITTED"

      - name: activate_blocked_until_financing_disbursed
        grounds:
          - state_machines.RouteAgreement.DRAFT_to_ACTIVE
          - state_machines.FinancingPlan.DRAFT_to_ACTIVE
          - errors.ERR_FINANCING_NOT_DISBURSED
        distinguishing_aspect: "Entity pair RouteAgreement -> FinancingPlan (a different pair than DailyOrder -> RouteAgreement): the agreement's DRAFT -> ACTIVE transition is gated on the child plan reaching ACTIVE; with financed_amount 52000 and only a DRAFT plan, activate fails, and succeeds after disburse."
        test_recipe:
          setup:
            - "Financed agreement (financed 52000) in DRAFT with a financing plan created but not yet disbursed."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr_fin
            - *k_plan
          trigger:
            - call: "POST /agreements/${agrf_id}/activate"
              payload: {}
              as: RouteOpsManager
              captures: { act_err: $.data.error_id }
            - *k_disburse
            - *k_activate_fin
          assert:
            - "first activate returns 409 and act_err == ERR_FINANCING_NOT_DISBURSED; RouteAgreement.${agrf_id}.status stays DRAFT and Distributor.${dist_id}.status stays PROSPECT"
            - "after disburse, activate succeeds: RouteAgreement.${agrf_id}.status == ACTIVE and Distributor.${dist_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: production_day_point_date_uniqueness
        grounds:
          - validations[priority=11]
          - errors.ERR_PRODUCTION_DAY_EXISTS
          - entities.ProductionDay.fields.date
        distinguishing_aspect: "Point-date semantics on the Bakery resource: a second ProductionDay for the same bakery and the exact same calendar date collides (equality, not interval intersection); the same date on a different bakery and a different date on the same bakery both pass."
        test_recipe:
          setup:
            - "Two bakeries; clock 2026-09-01."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - call: "POST /bakeries"
              payload: { name: "Northwest Bakery", daily_capacity_units: 50, product_catalog: [{ sku: "WHT-24", display_name: "White 24oz", shelf_life_days: 5, list_price_cents: 320 }] }
              as: CompanyAdmin
              captures: { bakery2_id: $.data.id }
            - call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-04" }
              as: CompanyAdmin
              captures: { pd1_id: $.data.id }
          trigger:
            - call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-04" }
              as: CompanyAdmin
              captures: { pd_err: $.data.error_id }
            - call: "POST /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-05" }
              as: CompanyAdmin
              captures: { pd2_id: $.data.id }
            - call: "POST /bakeries/${bakery2_id}/production-days"
              payload: { date: "2026-09-04" }
              as: CompanyAdmin
              captures: { pd3_id: $.data.id }
          assert:
            - "duplicate (bakery, 2026-09-04) returns 409 and pd_err == ERR_PRODUCTION_DAY_EXISTS"
            - "same bakery on 2026-09-05 succeeds (pd2_id created, capacity 100)"
            - "other bakery on the same 2026-09-04 succeeds (pd3_id created, capacity 50)"

      - name: distributor_agreement_half_open_interval_overlap
        grounds:
          - validations[priority=11]
          - errors.ERR_DISTRIBUTOR_AGREEMENT_OVERLAP
          - entities.RouteAgreement.fields.start_date
        distinguishing_aspect: "Half-open interval semantics on the Distributor resource (different resource and different geometry from the production-day point rule): [2026-09-01, 2027-09-01) intersects [2027-06-01, 2028-06-01) but NOT the adjacent [2027-09-01, 2028-09-01) — end == start is allowed."
        test_recipe:
          setup:
            - "Distributor D1 holds a DRAFT agreement covering [2026-09-01, 2027-09-01); a second LISTED territory exists for the follow-up agreement."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
