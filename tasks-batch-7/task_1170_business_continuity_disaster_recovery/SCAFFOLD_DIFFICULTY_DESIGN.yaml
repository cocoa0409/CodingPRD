# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1170 Business Continuity & Disaster Recovery Program
# 9 rules x 2 instances = 18 instances. Every numeric assert was pre-computed
# from SCAFFOLD.yaml §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: bia_provisional_vs_final_tier1_uplift
        grounds:
          - calculations.bia_criticality_score
          - state_machines.Bia.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          BIA criticality is dual-variant on the BIA entity domain: the same
          inputs yield PROVISIONAL 50.40 while DRAFT and a frozen FINAL 57.96
          once APPROVED (TIER_1 uplift 0.15 applied exactly once) — distinct
          from the vendor-score dual variant, which lives on the Assessment
          entity domain.
        test_recipe:
          setup:
            - "Contact C1 (committee member) exists"
            - "Process P (TIER_1, ACTIVE) exists"
            - "BIA B of P with impact_financial_per_hour=1200, impact_regulatory=LOW, peak_period_flag=true, impact_operational=NONE is APPROVED"
          setup_api_calls:
            - call: "POST /resilience/contacts"
              payload: { full_name: "Rita Committee", email: "rita@x.com", role_title: "Risk Committee" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "Payments", business_unit: "FinOps", owner_contact_id: "${c1_id}", criticality_tier: "TIER_1" }
              as: ResilienceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /resilience/processes/${p_id}/activate"
              payload: {}
              as: ResilienceAdmin
            - call: "POST /resilience/bias"
              payload: { process_id: "${p_id}", cycle_label: "FY2026-H1", rto_target_hours: 4, rpo_target_hours: 1, mtpd_hours: 24, peak_period_flag: true, peak_start_month: 11, peak_end_month: 12, impact_financial_per_hour: 1200, impact_regulatory: "LOW", impact_reputational: "NONE", impact_operational: "NONE" }
              as: BIAAnalyst
              captures: { bia_id: $.data.id, bia_score_prov: $.data.criticality_score, bia_variant_prov: $.data.score_variant }
            - call: "POST /resilience/bias/${bia_id}/submit"
              payload: {}
              as: BIAAnalyst
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c1_id}"
              captures: { bia_score_final: $.data.criticality_score, bia_variant_final: $.data.score_variant, bia_status: $.data.status }
          trigger:
            - call: "GET /resilience/bias/${bia_id}"
              payload: {}
              as: RiskCommittee
              as_user_id: "${c1_id}"
          assert:
            - "setup capture bia_score_prov == 50.40 and bia_variant_prov == PROVISIONAL"
            - "setup capture bia_score_final == 57.96 and bia_variant_final == FINAL and bia_status == APPROVED"
            - "GET after approval still returns criticality_score == 57.96 (frozen, not recomputed from the same inputs)"

      - name: assessment_provisional_vs_final_event_driven_discount
        grounds:
          - calculations.vendor_continuity_score
          - state_machines.Assessment.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Vendor continuity is dual-variant on the Assessment entity domain
          (distinct from the BIA score): identical assessed values produce
          PROVISIONAL 72 while DRAFT and a frozen FINAL 57 at finalize because
          assessment_type EVENT_DRIVEN subtracts 15 exactly once — no tier
          uplift is involved on this domain.
        test_recipe:
          setup:
            - "Contacts C1 (vendor owner) and C2 (finalizing manager) exist"
            - "Process P (TIER_2, ACTIVE) with APPROVED BIA rto_target=8, rpo_target=2"
            - "ThirdParty V (ACTIVE, owner C1)"
            - "Assessment A of V for P: EVENT_DRIVEN, assessed_rto=12, assessed_rpo=4"
          setup_api_calls:
            - call: "POST /resilience/contacts"
              payload: { full_name: "Victor Owner", email: "vown@x.com", role_title: "Vendor Owner" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/contacts"
              payload: { full_name: "Manny Manager", email: "mmgr@x.com", role_title: "Vendor Manager" }
              as: ResilienceAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "Ledger", business_unit: "FinOps", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /resilience/processes/${p_id}/activate"
              payload: {}
              as: ResilienceAdmin
            - call: "POST /resilience/bias"
              payload: { process_id: "${p_id}", cycle_label: "FY2026-H1", rto_target_hours: 8, rpo_target_hours: 2, mtpd_hours: 24, peak_period_flag: false, impact_financial_per_hour: 500, impact_regulatory: "NONE", impact_reputational: "NONE", impact_operational: "LOW" }
              as: BIAAnalyst
              captures: { bia_id: $.data.id }
            - call: "POST /resilience/bias/${bia_id}/submit"
              payload: {}
              as: BIAAnalyst
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c2_id}"
            - call: "POST /resilience/third-parties"
              payload: { name: "Acme DR Services", service_category: "Colocation", criticality_rating: "CRITICAL", owner_contact_id: "${c1_id}" }
              as: VendorManager
              as_user_id: "${c2_id}"
              captures: { v_id: $.data.id }
            - call: "POST /resilience/third-parties/${v_id}/activate"
              payload: {}
              as: VendorManager
              as_user_id: "${c2_id}"
            - call: "POST /resilience/assessments"
              payload: { third_party_id: "${v_id}", process_id: "${p_id}", assessment_type: "EVENT_DRIVEN", assessed_rto_hours: 12, assessed_rpo_hours: 4, rto_required_hours: 6, rpo_required_hours: 1, evidence_doc_ref: "doc-1" }
              as: VendorManager
              as_user_id: "${c2_id}"
              captures: { a_id: $.data.id, a_prov: $.data.continuity_score, a_variant: $.data.score_variant, a_meets: $.data.meets_required_rto }
          trigger:
            - call: "POST /resilience/assessments/${a_id}/finalize"
              payload: {}
              as: VendorManager
              as_user_id: "${c2_id}"
              captures: { a_final: $.data.continuity_score, a_variant2: $.data.score_variant }
          assert:
            - "setup capture a_prov == 72 and a_variant == PROVISIONAL and a_meets == false (12 > required 8 from the APPROVED BIA, not the 6-hour fallback input)"
            - "trigger capture a_final == 57 (72 - 15 event-driven discount) and a_variant2 == FINAL"
            - "GET /resilience/gaps?process_id=${p_id} afterwards contains exactly one auto-created Gap with severity HIGH and gap_type CAPABILITY"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: site_utilization_per_reservation_rounding
        grounds:
          - calculations.site_capacity_utilization
        distinguishing_aspect: |
          Mode (b) nested rounding: utilization rounds each reservation to 1dp
          BEFORE summing — capacity 6 with three overlapping 1-seat CONFIRMED
          reservations yields 50.1; the sum-then-round order would yield 50.0,
          so the pinned rounding order is observable in the last decimal.
        test_recipe:
          setup:
            - "Contacts C1 (creator) exists; clock at 2026-06-01T00:00:00Z"
            - "AlternateSite S (capacity_seats 6, contracted_through 2027-01-01)"
            - "Processes P1, P2, P3 (ACTIVE)"
            - "Three CONFIRMED 1-seat reservations on S, one per process, all covering 2026-06-10"
          setup_api_calls:
            - call: "POST /resilience/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ResilienceAdmin
            - call: "POST /resilience/contacts"
              payload: { full_name: "Sam Site", email: "sam@x.com", role_title: "Site Coordinator" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "P1", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "P2", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "P3", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /resilience/alternate-sites"
              payload: { name: "SiteAlpha", site_type: "HOT", region: "us-east", capacity_seats: 6, contracted_through: "2027-01-01T00:00:00Z", monthly_cost: 9000 }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { s_id: $.data.id }
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p1_id}", purpose: "EXERCISE", seats_reserved: 1, starts_at: "2026-06-10T08:00:00Z", ends_at: "2026-06-10T12:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p2_id}", purpose: "EXERCISE", seats_reserved: 1, starts_at: "2026-06-10T08:00:00Z", ends_at: "2026-06-10T12:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p3_id}", purpose: "EXERCISE", seats_reserved: 1, starts_at: "2026-06-10T08:00:00Z", ends_at: "2026-06-10T12:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
          trigger:
            - call: "GET /resilience/alternate-sites/${s_id}/utilization"
              payload: { probe_at: "2026-06-10T10:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
          assert:
            - "response utilization_pct == 50.1 (per-reservation rounding: 3 x 16.7), NOT 50.0 (sum-then-round)"
            - "response reserved_seats == 3 and capacity_seats == 6"

      - name: attestation_readiness_pinned_evaluation_order
        grounds:
          - calculations.attestation_readiness
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          overdue gap flags feed capability_points, the non-overdue open count
          feeds the multiplier, and only the pinned order makes the value
          well-defined — plan 40 + capability max(0, 25-2*10)=5 + exercise
          MET 25 = 70 with multiplier 1.0 (overdue gaps are excluded from
          open_count), passing the >= 70 gate; a different evaluation order
          (multiplier applied to overdue-inclusive counts) would give 56.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; contacts C1 (signer), C2 (committee)"
            - "Process P (ACTIVE, TIER_2) with APPROVED BIA (rto 4, rpo 1) and APPROVED Plan (rto 4, rpo 1)"
            - "RecoveryCapability CAP of P in VALIDATED (via a standalone run measured 4/1)"
            - "One COMPLETED exercise with result MET (achieved 4/1)"
            - "Exactly two OPEN gaps of P, both overdue (due_date 2026-05-20 < clock)"
          setup_api_calls:
            - call: "POST /resilience/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ResilienceAdmin
            - call: "POST /resilience/contacts"
              payload: { full_name: "Signer Sue", email: "sue@x.com", role_title: "Attestation Signer" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/contacts"
              payload: { full_name: "Committee Kim", email: "kim@x.com", role_title: "Risk Committee" }
              as: ResilienceAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "TradeSettle", business_unit: "Markets", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /resilience/processes/${p_id}/activate"
              payload: {}
              as: ResilienceAdmin
            - call: "POST /resilience/bias"
              payload: { process_id: "${p_id}", cycle_label: "FY2026-H1", rto_target_hours: 4, rpo_target_hours: 1, mtpd_hours: 12, peak_period_flag: false, impact_financial_per_hour: 500, impact_regulatory: "NONE", impact_reputational: "NONE", impact_operational: "LOW" }
              as: BIAAnalyst
              captures: { bia_id: $.data.id }
            - call: "POST /resilience/bias/${bia_id}/submit"
              payload: {}
              as: BIAAnalyst
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans"
              payload: { process_id: "${p_id}", title: "Plan A", version_no: 1, strategy_type: "WARM_SITE", rto_committed_hours: 4, rpo_committed_hours: 1 }
              as: PlanAuthor
              as_user_id: "${c1_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "RECOVERY_STRATEGY", content: "warm site cutover", order_index: 1 }
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "DEPENDENCY_MAP", content: "deps", order_index: 2 }
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "COMMS_PLAN", content: "comms", order_index: 3 }
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "POST /resilience/plans/${plan_id}/submit"
              payload: {}
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "POST /resilience/plans/${plan_id}/approve"
              payload: {}
              as: PlanApprover
              as_user_id: "${c2_id}"
            - call: "POST /resilience/recovery-capabilities"
              payload: { process_id: "${p_id}", capability_type: "DATA_RESTORE", capability_ref_id: "backup-array-1" }
              as: PlanAuthor
              as_user_id: "${c1_id}"
              captures: { cap_id: $.data.id }
            - call: "POST /resilience/validation-runs"
              payload: { capability_id: "${cap_id}", measured_rto_hours: 4, measured_rpo_hours: 1, method: "COMPONENT_TEST", evidence_ref: "ev-1" }
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
            - call: "POST /resilience/exercises"
              payload: { process_id: "${p_id}", plan_id: "${plan_id}", exercise_type: "TABLETOP", scheduled_start: "2026-05-10T09:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
              captures: { ex_id: $.data.id }
            - call: "POST /resilience/exercises/${ex_id}/start"
              payload: {}
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
            - call: "POST /resilience/exercises/${ex_id}/complete"
              payload: { completion_outcome: "MET", achieved_rto_hours: 4, achieved_rpo_hours: 1 }
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
            - call: "POST /resilience/gaps"
              payload: { process_id: "${p_id}", severity: "MEDIUM", description: "gap one", due_date: "2026-05-20T00:00:00Z" }
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "POST /resilience/gaps"
              payload: { process_id: "${p_id}", severity: "LOW", description: "gap two", due_date: "2026-05-20T00:00:00Z" }
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "POST /resilience/attestations"
              payload: { process_id: "${p_id}", attestation_type: "REGULATORY", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: AttestationSigner
              as_user_id: "${c1_id}"
              captures: { att_id: $.data.id, att_score: $.data.readiness_score }
          trigger:
            - call: "POST /resilience/attestations/${att_id}/sign"
              payload: { signer_declaration: true }
              as: AttestationSigner
              as_user_id: "${c1_id}"
          assert:
            - "setup capture att_score == 70 (40 + max(0,25-20) + 25; multiplier 1.0 because overdue gaps are not in open_count)"
            - "sign succeeds (70 >= 70): response status == SIGNED and snapshot_payload recorded"
            - "the pinned-order alternative (0.8 multiplier) would have yielded 56 and been rejected — observed score 70 proves order"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: bia_revision_cycle_decided_by_tracking
        grounds:
          - state_machines.Bia.REJECTED_to_SUBMITTED
          - state_machines.Bia.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          The BIA machine is cyclic (SUBMITTED -> REJECTED -> SUBMITTED) with a
          segregation-of-duties ratchet: decided_by_contact_id persists across
          the loop, so the committee member who rejected round one cannot
          decide round two — the cycle carries state, unlike the Plan loop.
        test_recipe:
          setup:
            - "Contacts C1, C2 (committee) exist; Process P ACTIVE"
            - "BIA B submitted, then REJECTED by C1, then resubmitted"
          setup_api_calls:
            - call: "POST /resilience/contacts"
              payload: { full_name: "Cm One", email: "cm1@x.com", role_title: "Risk Committee" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/contacts"
              payload: { full_name: "Cm Two", email: "cm2@x.com", role_title: "Risk Committee" }
              as: ResilienceAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "Onboarding", business_unit: "Retail", owner_contact_id: "${c1_id}", criticality_tier: "TIER_3" }
              as: ResilienceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /resilience/processes/${p_id}/activate"
              payload: {}
              as: ResilienceAdmin
            - call: "POST /resilience/bias"
              payload: { process_id: "${p_id}", cycle_label: "FY2026-H1", rto_target_hours: 8, rpo_target_hours: 2, mtpd_hours: 24, peak_period_flag: false, impact_financial_per_hour: 300, impact_regulatory: "NONE", impact_reputational: "NONE", impact_operational: "NONE" }
              as: BIAAnalyst
              captures: { bia_id: $.data.id }
            - call: "POST /resilience/bias/${bia_id}/submit"
              payload: {}
              as: BIAAnalyst
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "REJECT" }
              as: RiskCommittee
              as_user_id: "${c1_id}"
            - call: "POST /resilience/bias/${bia_id}/submit"
              payload: {}
              as: BIAAnalyst
              captures: { bia_status: $.data.status }
          trigger:
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c2_id}"
              captures: { final_status: $.data.status, final_variant: $.data.score_variant }
          assert:
            - "setup capture bia_status == SUBMITTED (the REJECTED -> SUBMITTED loop leg succeeded)"
            - "first trigger call is rejected with error_id == ERR_SOD_VIOLATION (C1 decided round one)"
            - "second trigger capture final_status == APPROVED and final_variant == FINAL"

      - name: plan_in_review_reject_loop_back_to_draft
        grounds:
          - state_machines.Plan.DRAFT_to_IN_REVIEW
          - state_machines.Plan.IN_REVIEW_to_DRAFT
        distinguishing_aspect: |
          The Plan machine loops IN_REVIEW -> DRAFT -> IN_REVIEW (a branching
          revert, structurally distinct from the BIA cycle): after rejection
          the plan returns to DRAFT, accepts section edits (which are blocked
          in IN_REVIEW), and can be resubmitted and approved — proving the
          loop is a real revision cycle, not a dead end.
        test_recipe:
          setup:
            - "Contacts C1 (author), C2 (approver) exist; Process P ACTIVE with APPROVED BIA rto 8 / rpo 2"
            - "Plan PL with the three required sections, IN_REVIEW then REJECTED back to DRAFT"
          setup_api_calls:
            - call: "POST /resilience/contacts"
              payload: { full_name: "Author Ann", email: "ann@x.com", role_title: "Plan Author" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/contacts"
              payload: { full_name: "Approver Al", email: "al@x.com", role_title: "Plan Approver" }
              as: ResilienceAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "Claims", business_unit: "Insurance", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /resilience/processes/${p_id}/activate"
              payload: {}
              as: ResilienceAdmin
            - call: "POST /resilience/bias"
              payload: { process_id: "${p_id}", cycle_label: "FY2026-H1", rto_target_hours: 8, rpo_target_hours: 2, mtpd_hours: 24, peak_period_flag: false, impact_financial_per_hour: 300, impact_regulatory: "NONE", impact_reputational: "NONE", impact_operational: "NONE" }
              as: BIAAnalyst
              captures: { bia_id: $.data.id }
            - call: "POST /resilience/bias/${bia_id}/submit"
              payload: {}
              as: BIAAnalyst
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans"
              payload: { process_id: "${p_id}", title: "Claims DR", version_no: 1, strategy_type: "COLD_SITE", rto_committed_hours: 8, rpo_committed_hours: 2 }
              as: PlanAuthor
              as_user_id: "${c1_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "RECOVERY_STRATEGY", content: "s1", order_index: 1 }
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "DEPENDENCY_MAP", content: "s2", order_index: 2 }
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "COMMS_PLAN", content: "s3", order_index: 3 }
