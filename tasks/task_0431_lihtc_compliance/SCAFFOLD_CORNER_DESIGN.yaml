          rationale: "Disqualify cascade recomputing building credit + project posture is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: market_unit_lease_sets_market_rented_immediately
        claim_type: immediate
        grounds:
          - state_machines.Unit.VACANT_NEVER_OCCUPIED_to_MARKET_RENTED
          - entities.Unit.fields.li_status
        distinguishing_aspect: "Leasing a MARKET unit returns the Lease (201) and, in the same request, the unit transitions to MARKET_RENTED (is_low_income_counted stays false) — immediate consistency."
        test_recipe:
          setup: ["Building B with a MARKET br1 unit U_mkt; Household H1 (non-student)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "M1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "MARKET" }
              as: OwnerAgent
              captures: { um_id: $.data.id }
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "H1", household_size: 2, all_full_time_students: false }
              as: OwnerAgent
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /units/${um_id}/lease"
              payload: { household_id: "${h1_id}", monthly_rent_cents: 150000, rent_start_date: "2026-02-01T00:00:00Z", rent_end_date: "2027-02-01T00:00:00Z" }
              as: OwnerAgent
              captures: { l_id: $.data.id }
          assert:
            - "response code == 201"
            - "Unit.${um_id}.li_status == MARKET_RENTED"
            - "Unit.${um_id}.is_low_income_counted == false"
