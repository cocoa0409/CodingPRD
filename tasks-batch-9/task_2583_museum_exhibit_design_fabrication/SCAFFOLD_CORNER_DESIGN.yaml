          Three action endpoints take an empty body, return HTTP 200 rather than 201,
          and each advances exactly one state field of exactly one row. The instance
          pins what they must NOT do: start-review must not compute a cost or move
          money (actual_cost_cents stays null and committed_fabrication_cents stays
