# =============================================================================
# §1.9 Scaffold Corner Design - Commuter Benefit Program Administration
# Breadth probe: every testable claim the §1.1-§1.7 surface declares that the
# nine §0.5 Difficulty Rules in SCAFFOLD_DIFFICULTY_DESIGN.yaml do not already
# cover. Sections and claim_type values come verbatim from
# references/claim-extraction-guide.md; corners already asserted by a §1.8
# instance appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: employer_create_returns_201_with_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.Employer
          - endpoints.POST_/benefits/employers
          - response_envelope.success
        distinguishing_aspect: "A create with every optional policy field supplied explicitly echoes all ten input fields, mints a bare UUID id (no type prefix), starts version at 1 and puts the employer in DRAFT with zero computed roll-ups."
        test_recipe:
          setup:
            - "The database is empty; no employer exists."
          setup_api_calls: []
          trigger:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Ferry Building Commute Co", region_code: "US-CA-SFO", transit_group_limit_cents: 31500, parking_group_limit_cents: 31500, program_cap_cents: 900000, pretax_ratio_cap_pct: 80, spill_policy: "REJECT_OVERAGE", rollover_policy: "FULL_ROLLOVER", rollover_cap_cents: 0, forfeiture_grace_days: 45 }
              as: ProgramAdmin
              captures: { er_id: $.data.id, er_status: $.data.program_status, er_version: $.data.version }
          assert:
            - "the response status is 201"
            - "Employer.${er_id}.legal_name == Ferry Building Commute Co"
            - "Employer.${er_id}.region_code == US-CA-SFO"
            - "Employer.${er_id}.transit_group_limit_cents == 31500"
            - "Employer.${er_id}.parking_group_limit_cents == 31500"
            - "Employer.${er_id}.program_cap_cents == 900000"
            - "Employer.${er_id}.pretax_ratio_cap_pct == 80"
            - "Employer.${er_id}.spill_policy == REJECT_OVERAGE"
            - "Employer.${er_id}.rollover_policy == FULL_ROLLOVER"
            - "Employer.${er_id}.forfeiture_grace_days == 45"
            - "${er_status} == DRAFT"
            - "${er_version} == 1"
            - "${er_id} is a bare UUID with no type prefix"
            - "Employer.${er_id}.total_pretax_committed_cents == 0"
            - "Employer.${er_id}.enrolled_employee_count == 0"
            - "Employer.${er_id}.ordinance_mandate_status == UNASSESSED"
            - "created_at and updated_at are ISO 8601 UTC instants"

      - name: transit_media_get_returns_stored_catalog_row
        claim_type: Retrieval
        grounds:
          - entities.TransitMedia
          - endpoints.GET_/benefits/transit-media/{media_id}
        distinguishing_aspect: "A GET by id returns exactly the stored catalog row - including the ACTIVE status the server minted and the lead_days / replacement_fee_cents defaults - rather than a re-derived or partial projection."
        test_recipe:
          setup:
            - "One transit medium exists: sku NYC-30DAY, media_type PAPER_PASS, region US-NY-NYC, eligible_category_type TRANSIT_PASS, unit_price_cents 13200, created without lead_days or replacement_fee_cents."
          setup_api_calls:
            - call: "POST /benefits/transit-media"
              payload: { sku: "NYC-30DAY", media_type: "PAPER_PASS", region_code: "US-NY-NYC", eligible_category_type: "TRANSIT_PASS", unit_price_cents: 13200 }
              as: OrderDesk
              as_user_id: "desk-catalog"
              captures: { med_id: $.data.id }
          trigger:
            - call: "GET /benefits/transit-media/${med_id}"
              payload: {}
              as: ProgramAdmin
              captures: { got_sku: $.data.sku, got_price: $.data.unit_price_cents, got_status: $.data.status, got_lead: $.data.lead_days, got_fee: $.data.replacement_fee_cents, got_phys: $.data.requires_physical_fulfillment }
          assert:
            - "${got_sku} == NYC-30DAY"
            - "${got_price} == 13200"
            - "${got_status} == ACTIVE"
            - "${got_lead} == 3"
            - "${got_fee} == 500"
            - "${got_phys} == true"
            - "TransitMedia.${med_id}.region_code == US-NY-NYC"
            - "TransitMedia.${med_id}.eligible_category_type == TRANSIT_PASS"
            - "TransitMedia.${med_id}.version == 1"

      - name: employees_list_paginates_with_limit_and_offset
        claim_type: Listing
        grounds:
          - endpoints.GET_/benefits/employees
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three employees on one employer, limit=2/offset=0 returns two rows with total_count 3 and has_more true, and limit=2/offset=2 returns the remaining single row with has_more false - so total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Employer 'Austin Roster Co' is in DRAFT (listing does not require activation) and has exactly three ACTIVE employees AUS-R1, AUS-R2, AUS-R3, all in US-TX-AUS."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Austin Roster Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-R1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-R2", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-R3", work_region_code: "US-TX-AUS", payroll_cycle: "SEMI_MONTHLY", hire_date: "2026-02-03T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /benefits/employees?employer_id=${er_id}&limit=2&offset=0"
              payload: {}
              as: ProgramAdmin
              captures: { first_page_head: "$.data[0].external_ref" }
            - call: "GET /benefits/employees?employer_id=${er_id}&limit=2&offset=2"
              payload: {}
              as: ProgramAdmin
              captures: { second_page_head: "$.data[0].external_ref" }
          assert:
            - "the first response carries exactly 2 Employee objects with total_count 3, limit 2, offset 0 and has_more true"
            - "the second response carries exactly 1 Employee object with total_count 3, limit 2, offset 2 and has_more false"
            - "${first_page_head} == AUS-R1"
            - "${second_page_head} == AUS-R3"
            - "response_type is array on both pages"

      - name: election_get_with_unknown_id_returns_election_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=30]
          - errors.ERR_ELECTION_NOT_FOUND
          - endpoints.GET_/benefits/elections/{election_id}
        distinguishing_aspect: "A syntactically valid but unknown UUID in the path yields the entity-scoped 404 ERR_ELECTION_NOT_FOUND (not a generic 404 and not ERR_INVALID_REQUEST), and no row is created as a side effect."
        test_recipe:
          setup:
            - "The database contains no Election rows."
          setup_api_calls: []
          trigger:
            - call: "GET /benefits/elections/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { nf_error: $.data.error_id }
          assert:
            - "${nf_error} == ERR_ELECTION_NOT_FOUND"
            - "the response status is 404"
            - "response_type is error and data carries both error_id and message"

      - name: employer_create_missing_program_cap_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=32]
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/benefits/employers
        distinguishing_aspect: "program_cap_cents carries no default, so omitting it must be rejected with ERR_INVALID_REQUEST at priority 32 rather than silently defaulting to 0 (which would make every program cap breach unreachable)."
        test_recipe:
          setup:
            - "The database is empty."
          setup_api_calls: []
          trigger:
            - call: "POST /benefits/employers"
              payload: { legal_name: "No Cap Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { req_error: $.data.error_id }
          assert:
            - "${req_error} == ERR_INVALID_REQUEST"
            - "the response status is 422"
            - "no Employer row was created"

      - name: employer_create_omitting_optional_policies_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Employer.fields.pretax_ratio_cap_pct
          - entities.Employer.fields.spill_policy
          - entities.Employer.fields.rollover_policy
          - entities.Employer.fields.rollover_cap_cents
          - entities.Employer.fields.forfeiture_grace_days
        distinguishing_aspect: "Supplying only the five required fields must materialise the five declared policy defaults exactly (100 / SPILL_TO_POSTTAX / CAP_ROLLOVER / 5000 / 30); an implementation that leaves them null changes the exclusion split and the month-close branch."
        test_recipe:
          setup:
            - "The database is empty."
          setup_api_calls: []
          trigger:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Default Policy Co", region_code: "US-IL-CHI", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id, d_ratio: $.data.pretax_ratio_cap_pct, d_spill: $.data.spill_policy, d_roll: $.data.rollover_policy, d_cap: $.data.rollover_cap_cents, d_grace: $.data.forfeiture_grace_days }
          assert:
            - "${d_ratio} == 100"
            - "${d_spill} == SPILL_TO_POSTTAX"
            - "${d_roll} == CAP_ROLLOVER"
            - "${d_cap} == 5000"
            - "${d_grace} == 30"
            - "Employer.${er_id}.program_status == DRAFT"
            - "Employer.${er_id}.version == 1"

      - name: benefit_category_limit_group_computed_from_category_type
        claim_type: Computed Fields
        grounds:
          - entities.BenefitCategory.fields.limit_group
          - endpoints.POST_/benefits/benefit-categories
        distinguishing_aspect: "limit_group is derived, never supplied: TRANSIT_PASS and VANPOOL both compute to TRANSIT (they share one monthly exclusion limit) while PARKING computes to PARKING. Collapsing VANPOOL into its own group would double the employee's available transit headroom."
        test_recipe:
          setup:
            - "Employer 'Group Derivation Co' exists in DRAFT with transit_group_limit_cents 30000 and parking_group_limit_cents 31500."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Group Derivation Co", region_code: "US-WA-SEA", transit_group_limit_cents: 30000, parking_group_limit_cents: 31500, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
          trigger:
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { tp_group: $.data.limit_group, tp_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "VANPOOL", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { vp_group: $.data.limit_group, vp_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "PARKING", monthly_exclusion_limit_cents: 31500 }
              as: ProgramAdmin
              captures: { pk_group: $.data.limit_group, pk_id: $.data.id }
          assert:
            - "${tp_group} == TRANSIT"
            - "${vp_group} == TRANSIT"
            - "${pk_group} == PARKING"
            - "BenefitCategory.${tp_id}.status == ACTIVE"
            - "BenefitCategory.${vp_id}.active_election_count == 0"
            - "BenefitCategory.${pk_id}.pretax_allowed == true"
            - "BenefitCategory.${pk_id}.posttax_allowed == true"

      - name: transit_media_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.TransitMedia.fields.status
          - entities.TransitMedia
          - endpoints.POST_/benefits/transit-media
        distinguishing_aspect: "id, created_at, updated_at, version and the system-owned status are minted by the server: a create body that also carries id, version and status DISCONTINUED must be accepted with those client values IGNORED, leaving status ACTIVE and version 1."
        test_recipe:
          setup:
            - "The database contains no TransitMedia rows."
          setup_api_calls: []
          trigger:
            - call: "POST /benefits/transit-media"
              payload: { sku: "SEA-IGNORE", media_type: "DEBIT_CARD", region_code: "US-WA-SEA", eligible_category_type: "PARKING", unit_price_cents: 9000, id: "11111111-1111-4111-8111-111111111111", version: 77, status: "DISCONTINUED", created_at: "2020-01-01T00:00:00Z" }
              as: OrderDesk
              as_user_id: "desk-catalog"
              captures: { med_id: $.data.id, med_status: $.data.status, med_version: $.data.version }
          assert:
            - "${med_status} == ACTIVE"
            - "${med_version} == 1"
            - "${med_id} != 11111111-1111-4111-8111-111111111111"
            - "TransitMedia.${med_id}.created_at is the server clock instant, not 2020-01-01T00:00:00Z"
            - "TransitMedia.${med_id}.sku == SEA-IGNORE"

      - name: employee_create_with_unknown_payroll_cycle_returns_invalid_enum_value
        claim_type: Type Constraints
        grounds:
          - validations[priority=34]
          - errors.ERR_INVALID_ENUM_VALUE
          - entities.Employee.fields.payroll_cycle
        distinguishing_aspect: "payroll_cycle is constrained to {SEMI_MONTHLY, MONTHLY}; WEEKLY must be rejected with ERR_INVALID_ENUM_VALUE at priority 34 - distinct from the priority 32 ERR_INVALID_REQUEST used for missing or mistyped fields."
        test_recipe:
          setup:
            - "Employer 'Enum Guard Co' exists in DRAFT."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Enum Guard Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
          trigger:
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-ENUM", work_region_code: "US-TX-AUS", payroll_cycle: "WEEKLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { enum_error: $.data.error_id }
          assert:
            - "${enum_error} == ERR_INVALID_ENUM_VALUE"
            - "the response status is 422"
            - "no Employee row was created for employer ${er_id}"

      - name: ledger_entry_rows_are_immutable_and_carry_no_version_field
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
          - endpoints.GET_/benefits/benefit-accounts/{account_id}/ledger-entries
        distinguishing_aspect: "LedgerEntry is declared common_fields: false - it carries only id and created_at, is never updated in place, and §1.5 exposes no PATCH/PUT/DELETE for it. Money movements are corrected by appending a compensating entry, never by editing one."
        test_recipe:
          setup:
            - "Employer 'Ledger Immutability Co' is ACTIVE in US-IL-CHI with one TRANSIT_PASS category, and one employee holds a TRANSIT_PASS BenefitAccount seeded with opening_rollover_cents 1500, which appended exactly one ROLLOVER_IN entry."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Ledger Immutability Co", region_code: "US-IL-CHI", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "CHI-LED-1", work_region_code: "US-IL-CHI", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}", opening_rollover_cents: 1500 }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /benefits/benefit-accounts/${acct_id}/ledger-entries"
              payload: {}
              as: ProgramAdmin
              captures: { le_type: "$.data[0].entry_type", le_amount: "$.data[0].amount_cents", le_after: "$.data[0].balance_after_cents", le_source: "$.data[0].source_entity" }
          assert:
            - "the response carries exactly 1 LedgerEntry object with total_count 1"
            - "${le_type} == ROLLOVER_IN"
            - "${le_amount} == 1500"
            - "${le_after} == 1500"
            - "${le_source} == BenefitAccount"
            - "the LedgerEntry object exposes id and created_at but NO version and NO updated_at field"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for LedgerEntry"

      - name: benefit_account_create_with_unknown_employee_returns_employee_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=38]
          - errors.ERR_EMPLOYEE_NOT_FOUND
          - entities.BenefitAccount.fields.employee_id
        distinguishing_aspect: "A body-supplied FK must resolve before anything else happens: an account create naming an unknown employee_id returns the entity-scoped ERR_EMPLOYEE_NOT_FOUND (404) at priority 38, not ERR_BENEFIT_CATEGORY_NOT_FOUND and not a 422."
        test_recipe:
          setup:
            - "Employer 'FK Guard Co' is ACTIVE in US-TX-AUS with one TRANSIT_PASS category; no employee has been created."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "FK Guard Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "00000000-0000-4000-8000-0000000000ee", benefit_category_id: "${cat_id}" }
              as: ProgramAdmin
              captures: { fk_error: $.data.error_id }
          assert:
            - "${fk_error} == ERR_EMPLOYEE_NOT_FOUND"
            - "the response status is 404"
            - "no BenefitAccount row was created"

      - name: election_referencing_category_without_account_returns_account_mismatch
        claim_type: flat
        grounds:
          - validations[priority=63]
          - errors.ERR_ACCOUNT_MISMATCH
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology means cross-reference integrity is checked pairwise, not by nesting: both the employee and the PARKING category exist and belong to the same employer, but no BenefitAccount exists for that (employee, category) PAIR, so the election create must fail with ERR_ACCOUNT_MISMATCH (422) rather than silently opening an account."
        test_recipe:
          setup:
            - "Employer 'Pairwise Integrity Co' is ACTIVE in US-TX-AUS with TWO ACTIVE categories: TRANSIT_PASS and PARKING."
            - "One employee holds a BenefitAccount for the TRANSIT_PASS category ONLY."
            - "ElectionWindow 2026-08 [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) is OPEN and the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Pairwise Integrity Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_tp_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "PARKING", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_pk_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-PAIR-1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_tp_id}" }
              as: ProgramAdmin
              captures: { acct_tp_id: $.data.id, acct_tp_v: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_pk_id}", pretax_amount_cents: 5000, posttax_amount_cents: 0, expected_account_version: "${acct_tp_v}" }
              as: ProgramAdmin
              captures: { mismatch_error: $.data.error_id }
          assert:
            - "${mismatch_error} == ERR_ACCOUNT_MISMATCH"
            - "the response status is 422"
            - "ElectionWindow.${win_id}.election_count == 0"
            - "BenefitCategory.${cat_pk_id}.active_election_count == 0"
            - "BenefitAccount.${acct_tp_id}.version == ${acct_tp_v}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: election_created_without_media_starts_pending_and_not_required
        claim_type: Initial State
        grounds:
          - state_machines.Election.funding_status.initial_state
          - state_machines.Election.fulfillment_status.initial_state
          - endpoints.POST_/benefits/elections
        distinguishing_aspect: "Both axes are initialised at create time and the fulfillment axis is conditional: omitting media_quantity means entitled_media_units 0, so fulfillment_status starts at NOT_REQUIRED (not AWAITING_ORDER) while funding_status starts at PENDING."
        test_recipe:
          setup:
            - "Employer 'Initial State Co' is ACTIVE in US-TX-AUS with an ACTIVE TRANSIT_PASS category (monthly_exclusion_limit_cents 30000) and transit_group_limit_cents 30000, pretax_ratio_cap_pct 100 (default)."
            - "One ACTIVE employee holds a BenefitAccount for that category at version 1."
            - "ElectionWindow 2026-08 [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) is OPEN; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Initial State Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
