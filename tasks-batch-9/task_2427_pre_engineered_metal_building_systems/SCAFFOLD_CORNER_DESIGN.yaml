              payload: {}
              as: SalesEngineer
              captures: { cfg1_v_locked: $.data.version }
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_locked}" }
              as: Engineer
              captures: { d1_id: $.data.id }
          trigger:
            - call: "GET /engineering-designs/${d1_id}"
              payload: {}
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "PRIMARY_FRAME_MEMBER", mark: "C-1", member_type: "COLUMN", erection_stage: "PRIMARY_FRAME", quantity: 10, length_ft: 24.5, weight_per_ft: 62.35 }
              as: Engineer
            - call: "GET /engineering-designs/${d1_id}"
              payload: {}
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "ANCHOR_PACKAGE", mark: "AB-1", member_type: "ANCHOR_BOLT", erection_stage: "ANCHORAGE", quantity: 10, length_ft: 1.5, weight_per_ft: 2.2 }
              as: Engineer
            - call: "GET /engineering-designs/${d1_id}"
              payload: {}
              as: Engineer
            - call: "POST /engineering-designs/${d1_id}/components"
              payload: { component_class: "CONNECTION_DETAIL", mark: "K-1", member_type: "DETAIL", erection_stage: "PRIMARY_FRAME", connection_type: "KNEE", capacity_moment_kip_ft: 1100 }
              as: Engineer
            - call: "GET /engineering-designs/${d1_id}"
              payload: {}
              as: Engineer
            - call: "GET /engineering-designs/${d1_id}/components"
              payload: {}
              as: Engineer
          assert:
            - "the empty design reads component_count 0, frame_weight_lbs 0.00 and shippable_weight_lbs 0.00"
            - "after C-1: component_count 1, frame_weight_lbs 15275.80 and shippable_weight_lbs 15275.80, from unit_weight_lbs 1527.58 x 10"
            - "after AB-1: component_count 2, frame_weight_lbs still 15275.80 and shippable_weight_lbs 15308.80 — the anchor package ships but is not frame steel"
            - "after K-1: component_count 3 with both weights unchanged at 15275.80 and 15308.80, and the detail row reads unit_weight_lbs 0 and line_weight_lbs 0"
            - "GET /engineering-designs/${d1_id}/components returns the three rows with no version field on any of them"
            - "required_moment_kip_ft and governing_combination are unaffected by the appends: they read 1010.94 and ASD_D_PLUS_0_6W from the first read onward"

      - name: a_criteria_revision_propagates_through_five_dependent_hops
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: jurisdiction_criteria_revision_cascade_depth_five
          rationale: "That §1.8 instance drives the deepest chain in the surface end to end — jurisdiction criteria revision to configuration to design to package to order to load — and asserts every hop plus the rows the cascade must leave alone, which is strictly more than a layer-level smoke test."

      - name: the_preliminary_and_final_price_variants_diverge_by_a_known_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: preliminary_vs_final_price_variant_on_order_release
          rationale: "That §1.8 instance prices the same configuration under both variants — the parametric estimate at quote time and the detailed bill of material at release — and asserts both prices and the signed price_delta_cents, covering the layer completely."

  - section: consistency_model
    instances:
      - name: every_cascade_and_rollup_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Nothing in this surface is deferred or reconciled by a background pass: the response to a single write already carries the recomputed derived fields, and a read issued immediately afterwards agrees with it field for field, including the counterpart rows the write touched."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; AUTHORIZED SILVER builder with a 200000000 c ceiling; LOCKED cfg1 with no accessory kits."
            - "Quote q1 is ISSUED at 8589227 c (SILVER 3 percent on a pre-discount total of 8854873 c)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
            - call: "POST /quotes"
              payload: { builder_id: "${b1_id}", configuration_id: "${cfg1_id}", freight_distance_miles: 240, adjustment_cents: 0 }
              as: SalesEngineer
              captures: { q1_id: $.data.id }
            - call: "POST /quotes/${q1_id}/issue"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /quotes/${q1_id}/accept"
              payload: { job_site_code: "SITE-A", requested_erection_start_date: "2026-09-15T00:00:00Z", site_delivery_capacity: 2 }
              as: Builder
              as_user_id: "${b1_id}"
              captures: { o1_id: $.data.id }
            - call: "GET /builders/${b1_id}"
              payload: {}
              as: SalesEngineer
            - call: "GET /quotes/${q1_id}"
              payload: {}
              as: SalesEngineer
            - call: "GET /orders/${o1_id}"
              payload: {}
              as: SalesEngineer
          assert:
            - "the accept response already reports the new Order with engineering_status ENG_PENDING, production_status PROD_NOT_RELEASED and quoted price 8589227 c carried over"
            - "the immediately following builder read shows credit_used_cents 8589227 and credit_available_cents 191410773 — the ledger moved inside the accept, not afterwards"
            - "the quote read shows status CONSUMED with accepted_at 2026-08-05T00:00:00Z, so the source row was updated in the same transaction"
            - "the order read agrees field for field with the accept response body: no field settles to a different value on a second look"
            - "used + available == credit_limit_cents holds at both observation points, 8589227 + 191410773 == 200000000"
