# =============================================================================
# SCAFFOLD — National Service Member Enrollment, Education Award & Grant
# Monitoring (AmeriCorps-style). §1.0–§1.7.
# Difficulty target: beyond Expert band (16 entities, 63 endpoints, 50+ errors,
# 3+ dual-variant calculations, cyclic + guarded state machines, 4-deep
# compliance cascade, OCC on two parents).
# =============================================================================

scenario: |
  National Service Member Enrollment, Education Award & Grant Monitoring (AmeriCorps): grant competitions awarding member positions to service organizations with matching requirements and cost per member limits, member enrollment with eligibility verification, criminal history checks and position slot assignment, service hour tracking against term categories with minimum hours required for education award eligibility, living allowance disbursement rules and prohibited activities during service hours, education award issuance to a trust with use restrictions for tuition and qualified loans and a use deadline, program compliance monitoring with site visits, member file reviews and corrective action, member grievance and disciplinary release processes affecting award eligibility, performance measurement and national performance measure reporting

domain_name: national-service-americorps
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit        # regulatory gating, audit trail, corrective action, SoD
  secondary_archetype: quota_allocation      # finite position slots competed for, reserved, filled, vacated, refilled
  complexity_layers:
    - optimistic_concurrency                 # OCC on GrantAward.version and EducationAward.version
    - cascading_side_effects                 # overdue-sweep cascade depth 3+, exit cascade depth 3
    - dual_variant_calculation               # cost-per-MSY bases; full vs prorated education award
    - rate_threshold_triggers                # min-hours boundary, 15% proration floor, 10% fundraising cap, 24% match floor
  entity_topology: flat                      # peer entities wired by FK references; no URL nesting of the object tree
  state_machine_shape: cyclic                # application clarification loop, slot refill loop, finding decision loop, measure review loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # enrollment gates on criminal check + grievance + award posture
  role_model: segregation_of_duties          # deciding officer must differ from visit creator; org vs member vs federal roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: GranteeOrganization
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the service organization" }
      - { name: ein, type: string, source: input, description: "Employer identification number; unique across organizations" }
      - { name: org_type, type: enum, source: input, description: "NONPROFIT | PUBLIC_AGENCY | INSTITUTION_OF_HIGHER_ED | TRIBAL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEBARRED; debarred orgs' staff lose write access", default: "ACTIVE" }

  - name: GrantCompetition
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Competition title" }
      - { name: fiscal_year, type: integer, source: input, description: "Federal fiscal year" }
      - { name: application_open_at, type: datetime, source: input, description: "Submissions accepted at or after this instant" }
      - { name: application_close_at, type: datetime, source: input, description: "Submissions accepted at or before this instant; must be > application_open_at" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | AWARDS_FINALIZED", default: "OPEN" }

  - name: GrantApplication
    parent: null
    common_fields: true
    fields:
      - { name: competition_id, type: string, source: input, description: "FK -> GrantCompetition.id" }
      - { name: organization_id, type: string, source: input, description: "FK -> GranteeOrganization.id; must equal caller X-User-ID for GranteeStaff" }
      - { name: federal_share_requested_cents, type: integer, source: input, description: "Requested federal share, integer cents > 0" }
      - { name: slot_requests, type: array, source: input, description: "Array of {term_category, count}; count integer >= 1; term_category in TERM_TABLE" }
      - { name: match_lines, type: array, source: input, description: "Array of {category: CASH|IN_KIND, amount_cents}; the org's match commitment" }
      - { name: allowable_match_commitment_cents, type: integer, source: computed, description: "Sum over match_lines of round_half_up(amount_cents x rate) per line, CASH rate 1.00, IN_KIND rate 0.80 (per-line rounding, then sum)" }
      - { name: total_term_minutes, type: integer, source: computed, description: "Sum over slot_requests of count x TERM_MINUTES[term_category]" }
      - { name: msy_requested, type: number, source: computed, description: "total_term_minutes / 102000, 3 decimal places" }
      - { name: cost_per_msy_federal_cents, type: number, source: computed, description: "round_half_up(federal_share_requested_cents x 102000 / total_term_minutes, 2) — federal-share basis" }
      - { name: cost_per_msy_total_cents, type: number, source: computed, description: "round_half_up((federal_share_requested_cents + allowable_match_commitment_cents) x 102000 / total_term_minutes, 2) — total-cost basis" }
      - { name: clarification_question, type: string, source: system, description: "Set by request-clarification; null otherwise", default: null }
      - { name: clarification_response, type: string, source: system, description: "Set by respond-clarification; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | CLARIFICATION_REQUESTED | AWARDED | REJECTED", default: "DRAFT" }

  - name: GrantAward
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> GrantApplication.id; 1:1 with the awarded application" }
      - { name: organization_id, type: string, source: system, description: "FK -> GranteeOrganization.id; copied from application" }
      - { name: competition_id, type: string, source: system, description: "FK -> GrantCompetition.id; copied from application" }
      - { name: federal_share_awarded_cents, type: integer, source: system, description: "Obligated federal share from the award action" }
      - { name: total_term_minutes, type: integer, source: system, description: "Copied from application; drives slot generation and MSY" }
      - { name: awarded_slot_count, type: integer, source: system, description: "Sum of slot_requests counts; number of PositionSlots created" }
      - { name: cost_per_msy_awarded_cents, type: number, source: computed, description: "round_half_up(federal_share_awarded_cents x 102000 / total_term_minutes, 2)" }
      - { name: allowable_match_cents, type: integer, source: computed, description: "Accumulated allowable match across all match reports (per-line rounding then sum), starts 0" }
      - { name: suspension_reason, type: string, source: system, description: "Reason captured at suspension; null when ACTIVE", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", default: "ACTIVE" }

  - name: PositionSlot
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> GrantAward.id" }
      - { name: term_category, type: enum, source: system, description: "FULL_TIME | HALF_TIME | REDUCED_HALF_TIME | QUARTER_TIME | MINIMUM_TIME | ABBREVIATED_TIME" }
      - { name: slot_index, type: integer, source: system, description: "1-based index within the award, unique per award; selector rank key" }
      - { name: fill_count, type: integer, source: computed, description: "Number of times this slot has reached FILLED; starts 0; a slot may be refilled only while fill_count < 2" }
      - { name: status, type: enum, source: system, description: "OPEN | RESERVED | FILLED | VACATED | RETIRED", default: "OPEN" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; member must be >= 17 years old at enrollment service_start_date" }
      - { name: citizenship_status, type: enum, source: input, description: "US_CITIZEN | US_NATIONAL | LAWFUL_PERMANENT_RESIDENT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEBARRED; DEBARRED after a for-cause release", default: "ACTIVE" }
      - { name: for_cause_release_count, type: integer, source: computed, description: "Number of RELEASED_FOR_CAUSE enrollments; starts 0" }

  - name: CriminalHistoryCheck
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: check_seq, type: integer, source: computed, description: "Per-member monotonically increasing sequence starting at 1; latest check = highest check_seq" }
      - { name: nsopr_status, type: enum, source: system, description: "PENDING | CLEAR | FLAGGED", default: "PENDING" }
      - { name: state_status, type: enum, source: system, description: "PENDING | CLEAR | FLAGGED", default: "PENDING" }
      - { name: fbi_status, type: enum, source: system, description: "PENDING | CLEAR | FLAGGED", default: "PENDING" }
      - { name: adjudication, type: enum, source: computed, description: "PENDING while any component PENDING; CLEARED when all three CLEAR; FLAGGED when any FLAGGED and none PENDING", default: "PENDING" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Set when adjudication leaves PENDING; null otherwise", default: null }

  - name: MemberEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: award_id, type: string, source: system, description: "FK -> GrantAward.id (path parent)" }
      - { name: slot_id, type: string, source: system, description: "FK -> PositionSlot.id; assigned by the slot selector at creation" }
      - { name: term_category, type: enum, source: input, description: "Requested term category; must match an OPEN slot's term_category" }
      - { name: term_minutes, type: integer, source: computed, description: "TERM_MINUTES[term_category]" }
      - { name: service_start_date, type: string, source: input, description: "ISO date; inclusive lower bound of the service period" }
      - { name: service_end_date, type: string, source: input, description: "ISO date; exclusive upper bound of the service period; must be > service_start_date" }
      - { name: certified_minutes, type: integer, source: computed, description: "Sum of minutes over this enrollment's CERTIFIED hour entries; starts 0" }
      - { name: fundraising_certified_minutes, type: integer, source: computed, description: "Sum of minutes over CERTIFIED entries with activity_code FUNDRAISING; starts 0" }
      - { name: allowance_paid_cents, type: integer, source: computed, description: "Sum of amount_cents over all LivingAllowancePayments of this enrollment; starts 0" }
      - { name: suspension_origin, type: enum, source: system, description: "NONE | MANUAL | AWARD_CASCADE", default: "NONE" }
      - { name: exit_reason, type: enum, source: system, description: "SUCCESSFUL | COMPELLING_CIRCUMSTANCE | FOR_CAUSE; null until exit", default: null }
      - { name: exited_at, type: datetime, source: system, description: "Set at exit; null otherwise", default: null }
      - { name: exit_overpayment_cents, type: integer, source: computed, description: "At exit: max(0, allowance_paid_cents - earned_allowance_cents(exit_reason)); null before exit", default: null }
      - { name: education_award_id, type: string, source: system, description: "FK -> EducationAward.id of the issued award; null for FOR_CAUSE exits and before exit", default: null }
      - { name: status, type: enum, source: system, description: "PENDING_CHECKS | ACTIVE | SUSPENDED | EXITED_SUCCESSFUL | EXITED_COMPELLING | RELEASED_FOR_CAUSE | CANCELLED", default: "PENDING_CHECKS" }

  - name: ServiceHourEntry
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> MemberEnrollment.id (path parent)" }
      - { name: service_date, type: string, source: input, description: "ISO date; must be within [service_start_date, service_end_date) of the enrollment" }
      - { name: minutes, type: integer, source: input, description: "Minutes served; 1..48000 (a timesheet entry may cover up to 800 hours)" }
      - { name: activity_code, type: enum, source: input, description: "DIRECT_SERVICE | CAPACITY_BUILDING | TRAINING | FUNDRAISING | PROSELYTIZING | PARTISAN_LOBBYING; the last two are prohibited and can never be certified" }
      - { name: reject_reason, type: string, source: system, description: "Reason recorded at rejection; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | CERTIFIED | REJECTED", default: "PENDING" }

  - name: LivingAllowancePayment
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> MemberEnrollment.id (path parent)" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount, integer cents; 1..ALLOWANCE_PERIOD_MAX_CENTS" }
      - { name: note, type: string, source: input, description: "Optional payment memo", default: null }

  - name: EducationAward
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> MemberEnrollment.id; 1:1 with the exiting enrollment" }
      - { name: term_category, type: enum, source: system, description: "Copied from enrollment" }
      - { name: issued_amount_cents, type: integer, source: computed, description: "Full category award on SUCCESSFUL exit; prorated on COMPELLING_CIRCUMSTANCE exit" }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "issued_amount_cents - sum of APPROVED (non-rescinded) use amounts" }
      - { name: issued_at, type: datetime, source: system, description: "Set to current logical time at exit" }
      - { name: use_deadline_at, type: datetime, source: computed, description: "issued_at + 7 years; uses permitted while current_utc <= use_deadline_at" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_USED | EXHAUSTED | EXPIRED", default: "ISSUED" }

  - name: EducationAwardUse
    parent: null
    common_fields: true
    fields:
      - { name: education_award_id, type: string, source: system, description: "FK -> EducationAward.id (path parent)" }
      - { name: use_type, type: enum, source: input, description: "TUITION | QUALIFIED_LOAN" }
      - { name: amount_cents, type: integer, source: input, description: "Requested disbursement, integer cents > 0" }
      - { name: institution_title_iv, type: boolean, source: input, description: "Required true when use_type == TUITION; ignored for QUALIFIED_LOAN", default: null }
      - { name: decision_note, type: string, source: system, description: "Note recorded at decide; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | APPROVED | DENIED | RESCINDED", default: "PENDING_APPROVAL" }

  - name: ComplianceVisit
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> GrantAward.id (path parent)" }
      - { name: visit_type, type: enum, source: input, description: "SITE_VISIT | FILE_REVIEW" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date; must be >= 30 days away from any other SCHEDULED or CONDUCTED visit of the same award" }
      - { name: created_by_officer_id, type: string, source: system, description: "X-User-ID of the scheduling ComplianceOfficer; segregation-of-duties anchor" }
      - { name: conducted_at, type: datetime, source: system, description: "Set when the visit is conducted; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONDUCTED | CLOSED", default: "SCHEDULED" }

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: system, description: "FK -> ComplianceVisit.id (path parent)" }
      - { name: award_id, type: string, source: system, description: "FK -> GrantAward.id; copied from the visit" }
      - { name: severity, type: enum, source: input, description: "LOW | HIGH" }
      - { name: description, type: string, source: input, description: "Finding narrative" }
      - { name: requirement, type: string, source: system, description: "Corrective requirement set at assign-corrective-action; null before", default: null }
      - { name: due_days, type: integer, source: system, description: "Corrective window in days, 14..90; null before assignment", default: null }
      - { name: due_at, type: datetime, source: system, description: "Assignment time + due_days days; null before assignment", default: null }
      - { name: evidence_note, type: string, source: system, description: "Evidence submitted by the grantee; null otherwise", default: null }
      - { name: submitted_by_org_id, type: string, source: system, description: "X-User-ID of the GranteeStaff who submitted evidence; null otherwise", default: null }
      - { name: decided_by_officer_id, type: string, source: system, description: "X-User-ID of the deciding ComplianceOfficer; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | ACTION_ASSIGNED | EVIDENCE_SUBMITTED | RESOLVED | ESCALATED", default: "OPEN" }

  - name: Grievance
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> MemberEnrollment.id (path parent)" }
      - { name: description, type: string, source: input, description: "Grievance narrative" }
      - { name: outcome, type: enum, source: system, description: "UPHELD | DISMISSED; set at resolution", default: null }
      - { name: status, type: enum, source: system, description: "FILED | ESCALATED | RESOLVED", default: "FILED" }

  - name: PerformanceMeasure
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> GrantAward.id (path parent)" }
      - { name: measure_code, type: enum, source: input, description: "MSY_OUTPUT | BENEFICIARY_OUTCOME | COMMUNITY_OUTCOME (national performance measures)" }
      - { name: target_value, type: integer, source: input, description: "Target for the reporting period; integer > 0" }
      - { name: unit, type: string, source: input, description: "Unit label, e.g. beneficiaries, hours" }
      - { name: latest_period_start, type: string, source: system, description: "ISO date of the latest submitted report period; null before first report", default: null }
      - { name: latest_period_end, type: string, source: system, description: "ISO date; must be >= latest_period_start; null before first report", default: null }
      - { name: latest_actual_value, type: integer, source: system, description: "Actual value from the latest report; integer >= 0; null before first report", default: null }
      - { name: review_comment, type: string, source: system, description: "Comment from the latest review; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | ACCEPTED | RETURNED", default: "OPEN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GranteeOrganization
    initial_state: ACTIVE
    terminal_states: [DEBARRED]
    transitions:
      - from: ACTIVE
        to: DEBARRED
        trigger: "POST /organizations/{orgId}/debar"
        actor: CNCSProgramOfficer
        preconditions: []
        side_effects:
          - "GranteeStaff whose X-User-ID == this org id lose write access (ERR_ORG_DEBARRED) on all org-scoped write endpoints"

  - entity: GrantCompetition
    initial_state: OPEN
    terminal_states: [AWARDS_FINALIZED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /competitions/{competitionId}/close"
        actor: CNCSProgramOfficer
        preconditions:
          - "current_utc > application_close_at (else ERR_INVALID_STATE)"
        side_effects: []
      - from: CLOSED
        to: AWARDS_FINALIZED
        trigger: "system (bubble-up: every application of this competition is AWARDED or REJECTED)"
        actor: system
        preconditions:
          - "Count of applications with status in {DRAFT, UNDER_REVIEW, CLARIFICATION_REQUESTED} == 0"
        side_effects: []

  - entity: GrantApplication
    initial_state: DRAFT
    terminal_states: [AWARDED, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /applications/{applicationId}/submit"
        actor: GranteeStaff
        preconditions:
          - "competition.application_open_at <= current_utc <= competition.application_close_at (else ERR_COMPETITION_WINDOW_CLOSED)"
          - "cost_per_msy_federal_cents <= COST_PER_MSY_CAP_CENTS (else ERR_COST_PER_MSY_EXCEEDS_CAP)"
          - "allowable_match_commitment_cents x 25 >= federal_share_requested_cents x 6 (else ERR_MATCH_BELOW_MINIMUM)"
        side_effects: []
      - from: UNDER_REVIEW
        to: CLARIFICATION_REQUESTED
        trigger: "POST /applications/{applicationId}/request-clarification"
        actor: CNCSProgramOfficer
        preconditions: []
        side_effects:
          - "clarification_question := payload.question"
      - from: CLARIFICATION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{applicationId}/respond-clarification"
        actor: GranteeStaff
        preconditions: []
        side_effects:
          - "clarification_response := payload.response"
        note: "Cycle: UNDER_REVIEW -> CLARIFICATION_REQUESTED -> UNDER_REVIEW may repeat without bound."
      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "POST /applications/{applicationId}/award"
        actor: CNCSProgramOfficer
        preconditions:
          - "competition.status == CLOSED (else ERR_INVALID_STATE)"
          - "payload.federal_share_awarded_cents <= federal_share_requested_cents (else ERR_AWARD_EXCEEDS_REQUEST)"
          - "cost_per_msy computed on awarded amount <= COST_PER_MSY_CAP_CENTS (else ERR_COST_PER_MSY_EXCEEDS_CAP)"
        side_effects:
          - "Create GrantAward (status ACTIVE) copying organization_id, competition_id, total_term_minutes; federal_share_awarded_cents := payload value; allowable_match_cents := 0"
          - "Create one PositionSlot per slot_request unit, slot_index 1..awarded_slot_count in slot_requests array order, status OPEN, fill_count 0"
          - "Competition bubble-up: if all applications terminal, competition -> AWARDS_FINALIZED"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /applications/{applicationId}/reject"
        actor: CNCSProgramOfficer
        preconditions: []
        side_effects:
          - "Competition bubble-up: if all applications terminal, competition -> AWARDS_FINALIZED"
      - from: CLARIFICATION_REQUESTED
        to: REJECTED
        trigger: "POST /applications/{applicationId}/reject"
        actor: CNCSProgramOfficer
        preconditions: []
        side_effects:
          - "Competition bubble-up: if all applications terminal, competition -> AWARDS_FINALIZED"

  - entity: GrantAward
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /awards/{awardId}/suspend OR system (overdue-sweep escalation cascade)"
        actor: CNCSProgramOfficer | system
        preconditions: []
        side_effects:
          - "suspension_reason := payload.reason or 'ESCALATED_FINDING_OVERDUE'"
          - "Every MemberEnrollment of this award with status ACTIVE -> SUSPENDED with suspension_origin := AWARD_CASCADE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /awards/{awardId}/reinstate"
        actor: CNCSProgramOfficer
        preconditions:
          - "No Finding with award_id == this award has status ESCALATED (else ERR_FINDINGS_ESCALATED)"
        side_effects:
          - "suspension_reason := null"
          - "Every MemberEnrollment of this award with status SUSPENDED and suspension_origin == AWARD_CASCADE -> ACTIVE with suspension_origin := NONE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /awards/{awardId}/close"
        actor: CNCSProgramOfficer
        preconditions:
          - "No MemberEnrollment of this award in {PENDING_CHECKS, ACTIVE, SUSPENDED} (else ERR_ENROLLMENTS_OPEN)"
          - "allowable_match_cents x 25 >= federal_share_awarded_cents x 6 (else ERR_MATCH_BELOW_MINIMUM)"
        side_effects:
          - "All PositionSlots of this award with status OPEN -> RETIRED"

  - entity: PositionSlot
    initial_state: OPEN
    terminal_states: [RETIRED]
    transitions:
      - from: OPEN
        to: RESERVED
        trigger: "system (slot selector assigns slot on POST /awards/{awardId}/enrollments)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: FILLED
        trigger: "system (enrollment activated when criminal history check adjudicated CLEARED)"
        actor: system
        preconditions: []
        side_effects:
          - "fill_count += 1"
      - from: RESERVED
        to: OPEN
        trigger: "system (enrollment CANCELLED when check adjudicated FLAGGED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILLED
        to: VACATED
        trigger: "system (enrollment exit, any exit_reason)"
        actor: system
        preconditions: []
        side_effects:
          - "Refill evaluation fires immediately (VACATED -> OPEN or RETIRED)"
      - from: VACATED
        to: OPEN
        trigger: "system (refill evaluation)"
        actor: system
        preconditions:
          - "award.status == ACTIVE"
          - "fill_count < 2"
        side_effects: []
        note: "Slot refill cycle: OPEN -> RESERVED -> FILLED -> VACATED -> OPEN; the cycle terminates when fill_count reaches 2 or the award is not ACTIVE."
      - from: VACATED
        to: RETIRED
        trigger: "system (refill evaluation)"
        actor: system
        preconditions:
          - "award.status != ACTIVE OR fill_count >= 2"
        side_effects: []
      - from: OPEN
        to: RETIRED
        trigger: "system (award close cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [DEBARRED]
    transitions:
      - from: ACTIVE
        to: DEBARRED
        trigger: "system (enrollment exit with exit_reason FOR_CAUSE)"
        actor: system
        preconditions: []
        side_effects:
          - "for_cause_release_count += 1"

  - entity: CriminalHistoryCheck
    initial_state: PENDING
    terminal_states: [CLEARED, FLAGGED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "system (POST /criminal-history-checks/{checkId}/component-results records the last PENDING component and all three are CLEAR)"
        actor: system
        preconditions: []
        side_effects:
          - "adjudicated_at := current_utc"
          - "Every MemberEnrollment with member_id == check.member_id and status PENDING_CHECKS -> ACTIVE; each such enrollment's slot RESERVED -> FILLED (fill_count += 1)"
      - from: PENDING
        to: FLAGGED
        trigger: "system (component-results records the last PENDING component and at least one is FLAGGED)"
        actor: system
        preconditions: []
        side_effects:
          - "adjudicated_at := current_utc"
          - "Every MemberEnrollment with member_id == check.member_id and status PENDING_CHECKS -> CANCELLED; each such enrollment's slot RESERVED -> OPEN"

  - entity: MemberEnrollment
    initial_state: PENDING_CHECKS
    terminal_states: [EXITED_SUCCESSFUL, EXITED_COMPELLING, RELEASED_FOR_CAUSE, CANCELLED]
    transitions:
      - from: PENDING_CHECKS
        to: ACTIVE
        trigger: "system (member's latest criminal history check adjudicated CLEARED)"
        actor: system
        preconditions: []
        side_effects:
          - "slot RESERVED -> FILLED"
      - from: PENDING_CHECKS
        to: CANCELLED
        trigger: "system (member's latest criminal history check adjudicated FLAGGED)"
        actor: system
        preconditions: []
        side_effects:
          - "slot RESERVED -> OPEN"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enrollments/{enrollmentId}/suspend (origin MANUAL) OR system (award suspension cascade, origin AWARD_CASCADE)"
        actor: GranteeStaff | system
        preconditions: []
        side_effects:
          - "suspension_origin := MANUAL | AWARD_CASCADE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /enrollments/{enrollmentId}/reinstate OR system (award reinstate cascade, only origin AWARD_CASCADE)"
        actor: GranteeStaff | system
        preconditions:
          - "award.status == ACTIVE (else ERR_AWARD_SUSPENDED)"
        side_effects:
          - "suspension_origin := NONE"
      - from: ACTIVE
        to: EXITED_SUCCESSFUL
        trigger: "POST /enrollments/{enrollmentId}/exit with exit_reason SUCCESSFUL"
        actor: GranteeStaff
        preconditions:
          - "certified_minutes >= term_minutes (else ERR_MIN_HOURS_NOT_MET)"
        side_effects:
          - "Create EducationAward: issued_amount_cents := AWARD_CENTS[term_category]; issued_at := current_utc; use_deadline_at := issued_at + 7 years; remaining_balance_cents := issued_amount_cents; status ISSUED"
          - "education_award_id := new award id; exited_at := current_utc; exit_overpayment_cents := max(0, allowance_paid_cents - ALLOWANCE_TOTAL_CENTS[term_category])"
          - "slot FILLED -> VACATED (refill evaluation follows)"
      - from: SUSPENDED
        to: EXITED_SUCCESSFUL
        trigger: "POST /enrollments/{enrollmentId}/exit with exit_reason SUCCESSFUL"
        actor: GranteeStaff
        preconditions:
          - "certified_minutes >= term_minutes (else ERR_MIN_HOURS_NOT_MET)"
        side_effects:
          - "Same as ACTIVE -> EXITED_SUCCESSFUL"
      - from: ACTIVE
        to: EXITED_COMPELLING
        trigger: "POST /enrollments/{enrollmentId}/exit with exit_reason COMPELLING_CIRCUMSTANCE"
        actor: GranteeStaff
        preconditions:
          - "certified_minutes x 100 >= 15 x term_minutes (else ERR_PRORATION_FLOOR_NOT_MET)"
        side_effects:
          - "Create EducationAward: issued_amount_cents := round_half_up(AWARD_CENTS[term_category] x certified_minutes / term_minutes) (integer cents); use_deadline_at := current_utc + 7 years; status ISSUED"
          - "education_award_id := new award id; exited_at := current_utc; exit_overpayment_cents := max(0, allowance_paid_cents - floor(ALLOWANCE_TOTAL_CENTS[term_category] x certified_minutes / term_minutes))"
          - "slot FILLED -> VACATED (refill evaluation follows)"
      - from: SUSPENDED
        to: EXITED_COMPELLING
        trigger: "POST /enrollments/{enrollmentId}/exit with exit_reason COMPELLING_CIRCUMSTANCE"
        actor: GranteeStaff
        preconditions:
          - "certified_minutes x 100 >= 15 x term_minutes (else ERR_PRORATION_FLOOR_NOT_MET)"
        side_effects:
          - "Same as ACTIVE -> EXITED_COMPELLING"
      - from: ACTIVE
        to: RELEASED_FOR_CAUSE
        trigger: "POST /enrollments/{enrollmentId}/exit with exit_reason FOR_CAUSE"
        actor: GranteeStaff
        preconditions:
          - "No Grievance of this enrollment has status ESCALATED (else ERR_GRIEVANCE_PENDING)"
        side_effects:
          - "No EducationAward is created (education_award_id stays null)"
          - "member -> DEBARRED; member.for_cause_release_count += 1"
          - "exited_at := current_utc; exit_overpayment_cents := max(0, allowance_paid_cents - floor(ALLOWANCE_TOTAL_CENTS[term_category] x certified_minutes / term_minutes))"
          - "slot FILLED -> VACATED (refill evaluation follows)"
      - from: SUSPENDED
        to: RELEASED_FOR_CAUSE
        trigger: "POST /enrollments/{enrollmentId}/exit with exit_reason FOR_CAUSE"
        actor: GranteeStaff
        preconditions:
          - "No Grievance of this enrollment has status ESCALATED (else ERR_GRIEVANCE_PENDING)"
        side_effects:
          - "Same as ACTIVE -> RELEASED_FOR_CAUSE"

  - entity: ServiceHourEntry
    initial_state: PENDING
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /hour-entries/{entryId}/certify"
        actor: GranteeStaff
        preconditions:
          - "enrollment.status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "activity_code not in {PROSELYTIZING, PARTISAN_LOBBYING} (else ERR_PROHIBITED_ACTIVITY)"
          - "If activity_code == FUNDRAISING: (fundraising_certified_minutes + minutes) x 10 <= (certified_minutes + minutes) (else ERR_FUNDRAISING_CAP_EXCEEDED)"
        side_effects:
          - "enrollment.certified_minutes += minutes"
          - "If activity_code == FUNDRAISING: enrollment.fundraising_certified_minutes += minutes"
      - from: PENDING
        to: REJECTED
        trigger: "POST /hour-entries/{entryId}/reject"
        actor: GranteeStaff
        preconditions: []
        side_effects:
          - "reject_reason := payload.reason"

  - entity: EducationAward
    initial_state: ISSUED
    terminal_states: [EXHAUSTED, EXPIRED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_USED
        trigger: "system (a use APPROVED with remaining_balance_cents > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_USED
        to: ISSUED
        trigger: "system (rescind restores remaining_balance_cents to issued_amount_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXHAUSTED
        trigger: "system (a use APPROVED with remaining_balance_cents == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_USED
        to: EXHAUSTED
        trigger: "system (a use APPROVED with remaining_balance_cents == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (lazy expiry: evaluated on every read and on every state-changing call against the award when current_utc > use_deadline_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_USED
        to: EXPIRED
        trigger: "system (lazy expiry, same rule)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EducationAwardUse
    initial_state: PENDING_APPROVAL
    terminal_states: [APPROVED, DENIED, RESCINDED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /education-award-uses/{useId}/decide with decision APPROVE"
        actor: TrustAdministrator
        preconditions:
          - "award.remaining_balance_cents >= amount_cents re-validated at decide time (else ERR_INSUFFICIENT_AWARD_BALANCE)"
        side_effects:
          - "award.remaining_balance_cents -= amount_cents; award.version += 1"
          - "award.status := EXHAUSTED if remaining == 0 else PARTIALLY_USED"
      - from: PENDING_APPROVAL
        to: DENIED
        trigger: "POST /education-award-uses/{useId}/decide with decision DENY"
        actor: TrustAdministrator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /education-award-uses/{useId}/rescind"
        actor: TrustAdministrator
        preconditions: []
        side_effects:
          - "award.remaining_balance_cents += amount_cents; award.version += 1"
          - "award.status := ISSUED if remaining_balance_cents == issued_amount_cents else PARTIALLY_USED"

  - entity: ComplianceVisit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /compliance-visits/{visitId}/conduct"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "conducted_at := current_utc"
      - from: CONDUCTED
        to: CLOSED
        trigger: "system (bubble-up: at least one Finding exists and every Finding of this visit is RESOLVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Finding
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: OPEN
        to: ACTION_ASSIGNED
        trigger: "POST /findings/{findingId}/assign-corrective-action"
        actor: ComplianceOfficer
        preconditions:
          - "payload.due_days in 14..90 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "requirement := payload.requirement; due_days := payload.due_days; due_at := current_utc + due_days days"
      - from: ACTION_ASSIGNED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /findings/{findingId}/submit-evidence"
        actor: GranteeStaff
        preconditions: []
        side_effects:
          - "evidence_note := payload.evidence_note; submitted_by_org_id := caller X-User-ID"
      - from: ESCALATED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /findings/{findingId}/submit-evidence"
        actor: GranteeStaff
        preconditions: []
        side_effects:
          - "evidence_note := payload.evidence_note; submitted_by_org_id := caller X-User-ID"
      - from: EVIDENCE_SUBMITTED
        to: RESOLVED
        trigger: "POST /findings/{findingId}/decide with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "caller X-User-ID != visit.created_by_officer_id (segregation of duties; else ERR_SOD_VIOLATION)"
        side_effects:
          - "decided_by_officer_id := caller X-User-ID"
          - "Visit bubble-up: if every Finding of the visit is RESOLVED, visit -> CLOSED"
      - from: EVIDENCE_SUBMITTED
        to: ACTION_ASSIGNED
        trigger: "POST /findings/{findingId}/decide with decision REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "caller X-User-ID != visit.created_by_officer_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "decided_by_officer_id := caller X-User-ID; due_at unchanged; corrective cycle repeats"
      - from: ACTION_ASSIGNED
        to: ESCALATED
        trigger: "system (POST /compliance/sweep-overdue finds due_at < current_utc)"
        actor: system
        preconditions: []
        side_effects:
          - "award ACTIVE -> SUSPENDED (cascade hop 2)"
          - "That suspension cascades: every ACTIVE enrollment of the award -> SUSPENDED with suspension_origin AWARD_CASCADE (cascade hop 3)"
      - from: EVIDENCE_SUBMITTED
        to: ESCALATED
        trigger: "system (sweep-overdue finds due_at < current_utc)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as ACTION_ASSIGNED -> ESCALATED"

  - entity: Grievance
    initial_state: FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: FILED
        to: ESCALATED
        trigger: "POST /grievances/{grievanceId}/escalate"
        actor: Member
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /grievances/{grievanceId}/resolve"
        actor: CNCSProgramOfficer
        preconditions: []
        side_effects:
          - "outcome := payload.outcome (UPHELD | DISMISSED)"

  - entity: PerformanceMeasure
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /performance-measures/{measureId}/reports"
        actor: GranteeStaff
        preconditions:
          - "payload.actual_value >= 0 and payload.period_end >= payload.period_start (else ERR_INVALID_REQUEST)"
        side_effects:
          - "latest_period_start/latest_period_end/latest_actual_value := payload values"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /performance-measures/{measureId}/reports"
        actor: GranteeStaff
        preconditions:
          - "payload.actual_value >= 0 and payload.period_end >= payload.period_start (else ERR_INVALID_REQUEST)"
        side_effects:
          - "latest_period_start/latest_period_end/latest_actual_value := payload values (review cycle repeats)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /performance-measures/{measureId}/review with decision ACCEPT"
        actor: CNCSProgramOfficer
        preconditions: []
        side_effects:
          - "review_comment := payload.comment (may be null)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /performance-measures/{measureId}/review with decision RETURN"
        actor: CNCSProgramOfficer
        preconditions:
          - "payload.comment must be non-empty when decision == RETURN (else ERR_INVALID_REQUEST)"
        side_effects:
          - "review_comment := payload.comment"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-award
    parent_entity: GrantAward
    write_endpoint: "POST /awards/{awardId}/enrollments"
    occ_field: "expected_award_version"
    description: |
      Creating a MemberEnrollment against a GrantAward whose version has
      advanced since the client last observed it is rejected. Creating an
      enrollment consumes a slot and bumps award.version, so a second create
      carrying a stale expected_award_version is acting on an out-of-date
      slot ledger.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: award-use-stale-education-award
    parent_entity: EducationAward
    write_endpoint: "POST /education-awards/{educationAwardId}/uses"
    occ_field: "expected_education_award_version"
    description: |
      Requesting an EducationAwardUse against an EducationAward whose version
      has advanced since the client last observed it is rejected. Use creation
      and decisions bump award.version, so a create carrying a stale
      expected_education_award_version is acting on an out-of-date trust
      balance.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: term_table_lookup
    trigger: "application creation (total_term_minutes, msy_requested), enrollment creation (term_minutes), exit (award amount, proration floor, earned allowance), allowance payments"
    algorithm: aggregation
    formula: |
      TERM_MINUTES = { FULL_TIME: 102000, HALF_TIME: 54000, REDUCED_HALF_TIME: 40500,
                       QUARTER_TIME: 27000, MINIMUM_TIME: 18000, ABBREVIATED_TIME: 6000 }
      AWARD_CENTS  = { FULL_TIME: 739500, HALF_TIME: 391500, REDUCED_HALF_TIME: 293625,
                       QUARTER_TIME: 195750, MINIMUM_TIME: 130500, ABBREVIATED_TIME: 43500 }
      ALLOWANCE_TOTAL_CENTS = { FULL_TIME: 2200000, HALF_TIME: 1100000, REDUCED_HALF_TIME: 825000,
                                QUARTER_TIME: 550000, MINIMUM_TIME: 366700, ABBREVIATED_TIME: 122200 }
      total_term_minutes(application) = sum(count * TERM_MINUTES[term_category]) over slot_requests
    constants:
      TERM_MINUTES_FULL_TIME: 102000
      TERM_MINUTES_HALF_TIME: 54000
      TERM_MINUTES_REDUCED_HALF_TIME: 40500
      TERM_MINUTES_QUARTER_TIME: 27000
      TERM_MINUTES_MINIMUM_TIME: 18000
      TERM_MINUTES_ABBREVIATED_TIME: 6000
      AWARD_CENTS_FULL_TIME: 739500
      AWARD_CENTS_HALF_TIME: 391500
      AWARD_CENTS_REDUCED_HALF_TIME: 293625
      AWARD_CENTS_QUARTER_TIME: 195750
      AWARD_CENTS_MINIMUM_TIME: 130500
      AWARD_CENTS_ABBREVIATED_TIME: 43500
      ALLOWANCE_FULL_TIME: 2200000
      ALLOWANCE_HALF_TIME: 1100000
      ALLOWANCE_REDUCED_HALF_TIME: 825000
      ALLOWANCE_QUARTER_TIME: 550000
      ALLOWANCE_MINIMUM_TIME: 366700
      ALLOWANCE_ABBREVIATED_TIME: 122200
    precision: "integer minutes and integer cents; no rounding anywhere"

  - name: cost_per_msy
    trigger: "application creation (both bases computed and stored); submit validation (federal basis); award action validation (federal basis on awarded amount)"
    algorithm: weighted_scoring
    formula: |
      Let M = total_term_minutes (see term_table_lookup).
      federal_basis = round_half_up(federal_share_cents * 102000 / M, 2)
      total_basis   = round_half_up((federal_share_cents + allowable_match_cents_value) * 102000 / M, 2)
      where allowable_match_cents_value is allowable_match_commitment_cents at application time.
      Validation: federal_basis <= COST_PER_MSY_CAP_CENTS (equality allowed).
    constants:
      COST_PER_MSY_CAP_CENTS: 2300000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: federal_basis
        when: "eligibility gate at submit and at award"
        difference: "Numerator is the federal share only; this is the variant the cap constrains."
      - name: total_basis
        when: "stored for compliance monitoring on the application (cost_per_msy_total_cents)"
        difference: "Numerator includes allowable match; for the same application it is strictly larger than federal_basis whenever allowable match > 0, so a submission can pass the cap on federal_basis while its total_basis exceeds the cap."
    key_insight: |
      Same slot_requests and same federal share, two valid cost bases, different
      numbers; the cap binds only the federal basis. Evaluation order is pinned:
      compute total_term_minutes first, then each basis.

  - name: allowable_match
    trigger: "application creation (commitment) and each POST /awards/{awardId}/match-reports (accumulation onto award.allowable_match_cents)"
    algorithm: aggregation
    formula: |
      RATE = { CASH: 1.00, IN_KIND: 0.80 }
      allowable = sum over lines of round_half_up(amount_cents * RATE[category], 0 integer cents)
      PINNED ROUNDING ORDER: round EACH LINE to integer cents first, THEN sum.
      (Sum-then-round can differ: three IN_KIND lines of 100001 cents -> per-line
      80001 x 3 = 240003, but round(300003 * 0.8) = round(240002.4) = 240002.)
      Sufficiency check (submit and award close): allowable * 25 >= federal_share_cents * 6
      (i.e., allowable match >= 24% of the federal share, integer arithmetic, equality allowed).
    constants:
      MATCH_RATE_CASH: 1.00
      MATCH_RATE_IN_KIND: 0.80
      MATCH_MIN_NUMERATOR: 6
      MATCH_MIN_DENOMINATOR: 25
    precision: "integer cents; per-line round_half_up then sum (pinned order)"

  - name: education_award_amount
    trigger: "enrollment exit with exit_reason SUCCESSFUL or COMPELLING_CIRCUMSTANCE"
    algorithm: threshold
    formula: |
      If exit_reason == SUCCESSFUL:
        requires certified_minutes >= term_minutes (boundary: equality eligible)
        issued_amount_cents = AWARD_CENTS[term_category]
      If exit_reason == COMPELLING_CIRCUMSTANCE:
        requires certified_minutes * 100 >= PRORATION_FLOOR_PCT * term_minutes
          (integer arithmetic; boundary: exactly 15% eligible)
        issued_amount_cents = round_half_up(AWARD_CENTS[term_category] * certified_minutes / term_minutes, 0)
      If exit_reason == FOR_CAUSE: no EducationAward is created.
      use_deadline_at = issued_at + 7 years (calendar years).
    constants:
      PRORATION_FLOOR_PCT: 15
      AWARD_USE_DEADLINE_YEARS: 7
    precision: "integer cents, round_half_up"
    variants:
      - name: full_completion
        when: "SUCCESSFUL exit"
        difference: "Flat category amount regardless of hours beyond the minimum."
      - name: prorated_compelling
        when: "COMPELLING_CIRCUMSTANCE exit with certified_minutes in [15%, 100%) of term_minutes"
        difference: "Proportional to certified minutes; for the same term category an enrollment below the minimum yields a strictly smaller award than full_completion (e.g., FULL_TIME at 36000 of 102000 minutes -> 261000 cents vs 739500)."

  - name: living_allowance_gate
    trigger: "POST /enrollments/{enrollmentId}/allowance-payments"
    algorithm: threshold
    formula: |
      enrollment must be ACTIVE (state check precedes all fiscal checks).
      Let T = ALLOWANCE_TOTAL_CENTS[term_category], paid = enrollment.allowance_paid_cents,
          earned_cap = floor(T * enrollment.certified_minutes / enrollment.term_minutes).
      Checks, in this pinned order:
        1. amount_cents > ALLOWANCE_PERIOD_MAX_CENTS            -> ERR_ALLOWANCE_PERIOD_CAP_EXCEEDED
        2. paid + amount_cents > T                              -> ERR_ALLOWANCE_EXHAUSTED
        3. paid + amount_cents > earned_cap                     -> ERR_ALLOWANCE_EARNED_CAP_EXCEEDED
      On success: enrollment.allowance_paid_cents += amount_cents.
      Boundaries: amount_cents == ALLOWANCE_PERIOD_MAX_CENTS allowed;
      paid + amount_cents == earned_cap allowed (<= semantics).
    constants:
      ALLOWANCE_PERIOD_MAX_CENTS: 100000
    precision: "integer cents; floor for earned_cap"
    key_insight: |
      Three-input non-linear gate (nested min: period cap, remaining total,
      hours-earned cap) with a state branch (SUSPENDED blocks everything); the
      binding constraint determines which of three distinct errors fires.

  - name: fundraising_cap_check
    trigger: "POST /hour-entries/{entryId}/certify when activity_code == FUNDRAISING"
    algorithm: threshold
    formula: |
      Allowed iff (fundraising_certified_minutes + minutes) * 10
                  <= (certified_minutes + minutes)
      Integer arithmetic over minutes (no floats). Boundary: a fundraising share
      of exactly 10% of the new total is allowed; one minute more is rejected.
      Evaluation order pinned: the pending entry is INCLUDED in both sides.
    constants:
      FUNDRAISING_CAP_PCT: 10
    precision: "integer minutes"

  - name: exit_overpayment
    trigger: "enrollment exit (any exit_reason)"
    algorithm: aggregation
    formula: |
      If SUCCESSFUL: earned = ALLOWANCE_TOTAL_CENTS[term_category]
      Else: earned = floor(ALLOWANCE_TOTAL_CENTS[term_category] * certified_minutes / term_minutes)
      exit_overpayment_cents = max(0, allowance_paid_cents - earned)
    precision: "integer cents; floor"

  - name: slot_selector
    trigger: "POST /awards/{awardId}/enrollments"
    algorithm: constraint_propagation
    formula: |
      Candidates = PositionSlot where award_id == path award AND status == OPEN
                   AND term_category == payload.term_category
      Ranking: slot_index ASC (unique per award, so no tie is possible;
      tie-break if ever needed: created_at ASC, never id).
      Empty candidate set -> ERR_NO_OPEN_SLOT.
      Selected slot transitions OPEN -> RESERVED as part of enrollment creation.
    key_insight: "Deterministic selector: eligibility filter + unique rank key + explicit empty-set error."

  - name: latest_check_selector
    trigger: "enrollment creation (criminal history gate) and check adjudication cascades"
    algorithm: aggregation
    formula: |
      Latest check for a member = CriminalHistoryCheck with member_id == member
      ordered by check_seq DESC, take 1. check_seq is assigned per member as
      (max existing check_seq) + 1, starting at 1 — strictly monotonic, so no
      tie is possible and no clock or id comparison is ever needed.
      No check exists -> ERR_CRIMINAL_CHECK_OUTSTANDING at enrollment creation.
    key_insight: "check_seq is the deterministic order key; created_at and id are never consulted."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: GranteeStaff X-User-ID equals the target resource's organization_id; Member X-User-ID equals the target's member_id (education-award uses, grievances, member self-reads)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "org-scoped and member-scoped endpoints" }
  - { priority: 4, category: auth, check: "GranteeStaff's organization is not DEBARRED (write endpoints scoped to an org)", error_id: ERR_ORG_DEBARRED, http_status: 403, applies_to: "org-scoped write endpoints" }
  - { priority: 5, category: existence, check: "Path ids resolve left-to-right to existing entities", error_id: "ERR_<ENTITY>_NOT_FOUND", http_status: 404, applies_to: "all" }
  - { priority: 6, category: existence, check: "Body FK references resolve (member_id on enrollment creation)", error_id: ERR_MEMBER_NOT_FOUND, http_status: 404, applies_to: "POST /awards/{awardId}/enrollments" }
  - { priority: 7, category: existence, check: "Request shape: required fields present, enums in domain, ranges valid (minutes 1..48000, due_days 14..90, amount_cents > 0, service_end_date > service_start_date, application_close_at > application_open_at, period_end >= period_start)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 8, category: state, check: "Entity from-state is legal for the requested trigger (generic transition guard; e.g., submit from non-DRAFT, certify non-PENDING entry, resolve non-ESCALATED grievance, close non-ACTIVE award, decide non-EVIDENCE_SUBMITTED finding, conduct non-SCHEDULED visit, award/reject from a terminal application)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 9, category: state, check: "GrantAward posture: enrollment creation, measure creation, match reports require award ACTIVE|specific states; enrollment reinstate and slot refill require award ACTIVE", error_id: ERR_AWARD_SUSPENDED, http_status: 409, applies_to: "enrollment/reinstate, POST /awards/{awardId}/enrollments, measures, match-reports" }
  - { priority: 10, category: state, check: "Enrollment must be ACTIVE for hour-entry creation, certification, and allowance payments", error_id: ERR_ENROLLMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /enrollments/{id}/hour-entries, POST /hour-entries/{id}/certify, POST /enrollments/{id}/allowance-payments" }
  - { priority: 11, category: state, check: "EducationAward must be ISSUED or PARTIALLY_USED to accept a new use; rejected when the STORED status is already EXHAUSTED or EXPIRED at request start (a past deadline with status still ISSUED/PARTIALLY_USED is NOT caught here — it is caught by priority 24)", error_id: ERR_EDUCATION_AWARD_NOT_USABLE, http_status: 409, applies_to: "POST /education-awards/{educationAwardId}/uses" }
  - { priority: 12, category: state, check: "EducationAwardUse must be PENDING_APPROVAL to decide; must be APPROVED to rescind", error_id: ERR_USE_NOT_PENDING, http_status: 409, applies_to: "POST /education-award-uses/{useId}/decide, /rescind" }
  - { priority: 13, category: state, check: "Check integrity: component-results rejected when adjudication already left PENDING; each component recordable once; a second check while one is PENDING rejected", error_id: "ERR_CHECK_ALREADY_ADJUDICATED | ERR_COMPONENT_ALREADY_RECORDED | ERR_CHECK_IN_PROGRESS", http_status: 409, applies_to: "POST /criminal-history-checks/{checkId}/component-results, POST /members/{memberId}/criminal-history-checks" }
  - { priority: 14, category: state, check: "OCC: expected_award_version must equal award.version; expected_education_award_version must equal education_award.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /awards/{awardId}/enrollments, POST /education-awards/{educationAwardId}/uses" }
  - { priority: 15, category: business_safety, check: "Member age >= 17 at service_start_date (date_of_birth + 17 years <= service_start_date)", error_id: ERR_MEMBER_TOO_YOUNG, http_status: 422, applies_to: "POST /awards/{awardId}/enrollments" }
  - { priority: 16, category: business_safety, check: "Member status != DEBARRED (a for-cause release bars re-enrollment)", error_id: ERR_MEMBER_INELIGIBLE, http_status: 422, applies_to: "POST /awards/{awardId}/enrollments" }
  - { priority: 17, category: business_safety, check: "Member has at least one CriminalHistoryCheck (latest by check_seq)", error_id: ERR_CRIMINAL_CHECK_OUTSTANDING, http_status: 422, applies_to: "POST /awards/{awardId}/enrollments" }
  - { priority: 18, category: business_safety, check: "Member's latest check adjudication != FLAGGED (PENDING allowed; enrollment waits in PENDING_CHECKS)", error_id: ERR_CRIMINAL_CHECK_FLAGGED, http_status: 422, applies_to: "POST /awards/{awardId}/enrollments" }
  - { priority: 19, category: business_safety, check: "FOR_CAUSE exit blocked while any Grievance of the enrollment is ESCALATED", error_id: ERR_GRIEVANCE_PENDING, http_status: 409, applies_to: "POST /enrollments/{enrollmentId}/exit" }
  - { priority: 20, category: business_safety, check: "Hour entry with activity_code in {PROSELYTIZING, PARTISAN_LOBBYING} can never be certified", error_id: ERR_PROHIBITED_ACTIVITY, http_status: 422, applies_to: "POST /hour-entries/{entryId}/certify" }
  - { priority: 21, category: business_safety, check: "Segregation of duties: deciding officer's X-User-ID must differ from the visit's created_by_officer_id", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /findings/{findingId}/decide" }
  - { priority: 22, category: business_safety, check: "TUITION uses require institution_title_iv == true", error_id: ERR_INSTITUTION_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /education-awards/{educationAwardId}/uses" }
  - { priority: 23, category: business_temporal, check: "Application submit within [application_open_at, application_close_at] inclusive; competition close requires current_utc > application_close_at", error_id: ERR_COMPETITION_WINDOW_CLOSED, http_status: 422, applies_to: "POST /applications/{id}/submit" }
  - { priority: 24, category: business_temporal, check: "Education award use only while current_utc <= use_deadline_at (equality allowed); on failure this check itself transitions the award to EXPIRED as a side effect. Reads (GET) also lazily flip ISSUED/PARTIALLY_USED -> EXPIRED when past the deadline, without an error.", error_id: ERR_AWARD_USE_DEADLINE_PASSED, http_status: 422, applies_to: "POST /education-awards/{educationAwardId}/uses" }
  - { priority: 25, category: business_temporal, check: "Hour entry service_date within [service_start_date, service_end_date) of the enrollment", error_id: ERR_SERVICE_DATE_OUT_OF_RANGE, http_status: 422, applies_to: "POST /enrollments/{enrollmentId}/hour-entries" }
  - { priority: 26, category: business_constraint, check: "Half-open service-period overlap: member may not hold another enrollment in {PENDING_CHECKS, ACTIVE, SUSPENDED} with [existing.start, existing.end) intersecting [new.start, new.end); adjacency (new.start == existing.end) is allowed", error_id: ERR_SERVICE_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /awards/{awardId}/enrollments" }
  - { priority: 27, category: business_constraint, check: "Visit buffer: new visit's scheduled_date must be >= 30 days away (absolute difference) from every other SCHEDULED or CONDUCTED visit of the same award; exactly 30 days allowed", error_id: ERR_VISIT_TOO_SOON, http_status: 409, applies_to: "POST /awards/{awardId}/compliance-visits" }
  - { priority: 28, category: business_constraint, check: "Slot selector candidate set non-empty for the requested term_category", error_id: ERR_NO_OPEN_SLOT, http_status: 409, applies_to: "POST /awards/{awardId}/enrollments" }
  - { priority: 29, category: business_constraint, check: "Fundraising cap: (fundraising_certified + minutes) x 10 <= (certified + minutes) including the pending entry", error_id: ERR_FUNDRAISING_CAP_EXCEEDED, http_status: 422, applies_to: "POST /hour-entries/{entryId}/certify" }
  - { priority: 30, category: business_constraint, check: "SUCCESSFUL exit requires certified_minutes >= term_minutes (equality eligible)", error_id: ERR_MIN_HOURS_NOT_MET, http_status: 422, applies_to: "POST /enrollments/{enrollmentId}/exit" }
  - { priority: 31, category: business_constraint, check: "COMPELLING_CIRCUMSTANCE exit requires certified_minutes x 100 >= 15 x term_minutes (equality eligible)", error_id: ERR_PRORATION_FLOOR_NOT_MET, http_status: 422, applies_to: "POST /enrollments/{enrollmentId}/exit" }
  - { priority: 32, category: business_constraint, check: "cost_per_msy federal basis <= COST_PER_MSY_CAP_CENTS at submit (requested) and at award (awarded)", error_id: ERR_COST_PER_MSY_EXCEEDS_CAP, http_status: 422, applies_to: "POST /applications/{id}/submit, POST /applications/{id}/award" }
  - { priority: 33, category: business_constraint, check: "federal_share_awarded_cents <= federal_share_requested_cents", error_id: ERR_AWARD_EXCEEDS_REQUEST, http_status: 422, applies_to: "POST /applications/{id}/award" }
  - { priority: 34, category: business_constraint, check: "Match sufficiency: allowable x 25 >= federal x 6 at submit (commitment) and at award close (accumulated reports)", error_id: ERR_MATCH_BELOW_MINIMUM, http_status: 422, applies_to: "POST /applications/{id}/submit, POST /awards/{id}/close" }
  - { priority: 35, category: business_fiscal, check: "Allowance payment <= ALLOWANCE_PERIOD_MAX_CENTS (100000); equality allowed", error_id: ERR_ALLOWANCE_PERIOD_CAP_EXCEEDED, http_status: 422, applies_to: "POST /enrollments/{enrollmentId}/allowance-payments" }
  - { priority: 36, category: business_fiscal, check: "Allowance cumulative: paid + amount <= ALLOWANCE_TOTAL_CENTS[term_category]", error_id: ERR_ALLOWANCE_EXHAUSTED, http_status: 422, applies_to: "POST /enrollments/{enrollmentId}/allowance-payments" }
  - { priority: 37, category: business_fiscal, check: "Allowance earned cap: paid + amount <= floor(total x certified_minutes / term_minutes)", error_id: ERR_ALLOWANCE_EARNED_CAP_EXCEEDED, http_status: 422, applies_to: "POST /enrollments/{enrollmentId}/allowance-payments" }
  - { priority: 38, category: business_fiscal, check: "Education award use amount <= remaining_balance_cents (checked at creation and re-checked at decide)", error_id: ERR_INSUFFICIENT_AWARD_BALANCE, http_status: 422, applies_to: "POST /education-awards/{id}/uses, POST /education-award-uses/{id}/decide" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock -------------------------------------------------
  - { method: POST, path: "/_clock/set_current_utc", description: "Sets the server's logical clock to to_iso8601. The logical clock starts at exactly 2026-09-01T00:00:00Z before any set call and never falls back to wall-clock time.", roles: [CNCSProgramOfficer], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

  # --- organizations --------------------------------------------------------
  - { method: POST, path: "/organizations", description: "Register a service organization", roles: [CNCSProgramOfficer], code: 201, input: [legal_name, ein, org_type], output: GranteeOrganization, side_effects: [] }
  - { method: GET, path: "/organizations/{orgId}", description: "Read one organization", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: [], output: GranteeOrganization, side_effects: [] }
  - { method: POST, path: "/organizations/{orgId}/debar", description: "Debar an organization; its staff lose write access", roles: [CNCSProgramOfficer], code: 200, input: [], output: GranteeOrganization, side_effects: ["org status ACTIVE -> DEBARRED"] }

  # --- competitions ---------------------------------------------------------
  - { method: POST, path: "/competitions", description: "Open a grant competition with an application window", roles: [CNCSProgramOfficer], code: 201, input: [title, fiscal_year, application_open_at, application_close_at], output: GrantCompetition, side_effects: [] }
  - { method: GET, path: "/competitions/{competitionId}", description: "Read one competition", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff, TrustAdministrator, Member], code: 200, input: [], output: GrantCompetition, side_effects: [] }
  - { method: POST, path: "/competitions/{competitionId}/close", description: "Close the competition after the application window ends", roles: [CNCSProgramOfficer], code: 200, input: [], output: GrantCompetition, side_effects: ["status OPEN -> CLOSED"] }

  # --- applications ---------------------------------------------------------
  - { method: POST, path: "/competitions/{competitionId}/applications", description: "Create a DRAFT application (org self-service); computes match/msy/cost fields", roles: [GranteeStaff], code: 201, input: [organization_id, federal_share_requested_cents, slot_requests, match_lines], output: GrantApplication, side_effects: ["computes allowable_match_commitment_cents, total_term_minutes, msy_requested, cost_per_msy_federal_cents, cost_per_msy_total_cents"] }
  - { method: GET, path: "/applications", description: "List applications, optionally filtered", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: ["competition_id?", "organization_id?", "status?", "limit?", "offset?"], output: "GrantApplication[]", side_effects: [] }
  - { method: GET, path: "/applications/{applicationId}", description: "Read one application", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: [], output: GrantApplication, side_effects: [] }
  - { method: POST, path: "/applications/{applicationId}/submit", description: "Submit a DRAFT application for review (window + cost-per-MSY + match gates)", roles: [GranteeStaff], code: 200, input: [], output: GrantApplication, side_effects: ["status DRAFT -> UNDER_REVIEW"] }
  - { method: POST, path: "/applications/{applicationId}/request-clarification", description: "Reviewer asks a clarification question (cycle hop 1)", roles: [CNCSProgramOfficer], code: 200, input: [question], output: GrantApplication, side_effects: ["status UNDER_REVIEW -> CLARIFICATION_REQUESTED"] }
  - { method: POST, path: "/applications/{applicationId}/respond-clarification", description: "Applicant answers; returns to UNDER_REVIEW (cycle hop 2)", roles: [GranteeStaff], code: 200, input: [response], output: GrantApplication, side_effects: ["status CLARIFICATION_REQUESTED -> UNDER_REVIEW"] }
  - { method: POST, path: "/applications/{applicationId}/award", description: "Award the application: creates the GrantAward and all PositionSlots", roles: [CNCSProgramOfficer], code: 201, input: [federal_share_awarded_cents], output: GrantAward, side_effects: ["application -> AWARDED", "creates GrantAward (ACTIVE, version 1)", "creates awarded_slot_count PositionSlots (OPEN, slot_index 1..N)", "competition bubble-up to AWARDS_FINALIZED when all applications terminal"] }
  - { method: POST, path: "/applications/{applicationId}/reject", description: "Reject an application under review or clarification", roles: [CNCSProgramOfficer], code: 200, input: [reason], output: GrantApplication, side_effects: ["status -> REJECTED", "competition bubble-up"] }

  # --- awards ---------------------------------------------------------------
  - { method: GET, path: "/awards", description: "List awards, optionally filtered", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: ["application_id?", "organization_id?", "status?", "limit?", "offset?"], output: "GrantAward[]", side_effects: [] }
  - { method: GET, path: "/awards/{awardId}", description: "Read one award (ledger fields, status)", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: [], output: GrantAward, side_effects: [] }
  - { method: POST, path: "/awards/{awardId}/suspend", description: "Manually suspend an award; cascades to ACTIVE enrollments", roles: [CNCSProgramOfficer], code: 200, input: [reason], output: GrantAward, side_effects: ["award ACTIVE -> SUSPENDED", "ACTIVE enrollments -> SUSPENDED (origin AWARD_CASCADE)"] }
  - { method: POST, path: "/awards/{awardId}/reinstate", description: "Reinstate a suspended award; requires no ESCALATED findings; reactivates cascade-suspended enrollments", roles: [CNCSProgramOfficer], code: 200, input: [], output: GrantAward, side_effects: ["award SUSPENDED -> ACTIVE", "AWARD_CASCADE-suspended enrollments -> ACTIVE"] }
  - { method: POST, path: "/awards/{awardId}/close", description: "Close an award: all enrollments terminal, match minimum met; retires OPEN slots", roles: [CNCSProgramOfficer], code: 200, input: [], output: GrantAward, side_effects: ["award ACTIVE -> CLOSED", "OPEN slots -> RETIRED"] }
  - { method: POST, path: "/awards/{awardId}/match-reports", description: "Report match contributions; per-line rounding accumulated onto award.allowable_match_cents", roles: [GranteeStaff], code: 201, input: [reporting_period_label, lines], output: GrantAward, side_effects: ["allowable_match_cents += per-line-rounded sum of lines", "increments GrantAward.version by 1"] }
  - { method: GET, path: "/awards/{awardId}/slots", description: "List the award's position slots", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: ["status?", "term_category?", "limit?", "offset?"], output: "PositionSlot[]", side_effects: [] }
  - { method: GET, path: "/awards/{awardId}/compliance-visits", description: "List the award's compliance visits", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: ["status?", "limit?", "offset?"], output: "ComplianceVisit[]", side_effects: [] }
  - { method: GET, path: "/awards/{awardId}/performance-measures", description: "List the award's performance measures", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: ["status?", "limit?", "offset?"], output: "PerformanceMeasure[]", side_effects: [] }

  # --- slots ----------------------------------------------------------------
  - { method: GET, path: "/slots/{slotId}", description: "Read one position slot", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: [], output: PositionSlot, side_effects: [] }

  # --- members & criminal history checks -------------------------------------
  - { method: POST, path: "/members/register", description: "Self-register a member", roles: [Anonymous], code: 201, input: [full_name, date_of_birth, citizenship_status], output: Member, side_effects: [] }
  - { method: GET, path: "/members/{memberId}", description: "Read one member", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff, Member], code: 200, input: [], output: Member, side_effects: [] }
  - { method: POST, path: "/members/{memberId}/criminal-history-checks", description: "Initiate a three-component criminal history check (NSOPR, state repository, FBI fingerprint)", roles: [GranteeStaff], code: 201, input: [], output: CriminalHistoryCheck, side_effects: ["check_seq := next per-member sequence"] }
  - { method: GET, path: "/members/{memberId}/criminal-history-checks", description: "List a member's criminal history checks", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff, Member], code: 200, input: ["limit?", "offset?"], output: "CriminalHistoryCheck[]", side_effects: [] }
  - { method: POST, path: "/criminal-history-checks/{checkId}/component-results", description: "Record one component result; the third recorded component adjudicates the check and cascades to the member's PENDING_CHECKS enrollments", roles: [CNCSProgramOfficer], code: 200, input: [component, result], output: CriminalHistoryCheck, side_effects: ["on adjudication CLEARED: member's PENDING_CHECKS enrollments -> ACTIVE, their slots RESERVED -> FILLED (fill_count += 1)", "on adjudication FLAGGED: those enrollments -> CANCELLED, their slots RESERVED -> OPEN"] }

  # --- enrollments ------------------------------------------------------------
  - { method: POST, path: "/awards/{awardId}/enrollments", description: "Enroll a member: safety gates (age, debarment, criminal check), overlap check, deterministic slot selection (OCC on award)", roles: [GranteeStaff], code: 201, input: [member_id, term_category, service_start_date, service_end_date, expected_award_version], output: MemberEnrollment, side_effects: ["slot OPEN -> RESERVED via slot_selector", "increments GrantAward.version by 1", "if member's latest check is CLEARED: enrollment immediately ACTIVE and slot RESERVED -> FILLED"] }
  - { method: GET, path: "/enrollments", description: "List enrollments, optionally filtered", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff, Member], code: 200, input: ["member_id?", "award_id?", "slot_id?", "status?", "limit?", "offset?"], output: "MemberEnrollment[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{enrollmentId}", description: "Read one enrollment (computed hours/allowance fields)", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff, Member], code: 200, input: [], output: MemberEnrollment, side_effects: [] }
  - { method: POST, path: "/enrollments/{enrollmentId}/suspend", description: "Manually suspend an ACTIVE enrollment (origin MANUAL)", roles: [GranteeStaff], code: 200, input: [reason], output: MemberEnrollment, side_effects: ["ACTIVE -> SUSPENDED"] }
  - { method: POST, path: "/enrollments/{enrollmentId}/reinstate", description: "Reinstate a SUSPENDED enrollment; requires award ACTIVE", roles: [GranteeStaff], code: 200, input: [], output: MemberEnrollment, side_effects: ["SUSPENDED -> ACTIVE"] }
  - { method: POST, path: "/enrollments/{enrollmentId}/exit", description: "Exit a member: SUCCESSFUL (full award), COMPELLING_CIRCUMSTANCE (prorated award, 15% floor), FOR_CAUSE (no award; member debarred); slot vacancy + refill evaluation", roles: [GranteeStaff], code: 200, input: [exit_reason], output: MemberEnrollment, side_effects: ["creates EducationAward unless FOR_CAUSE", "FOR_CAUSE: member -> DEBARRED", "slot FILLED -> VACATED -> OPEN (refill) or RETIRED", "computes exit_overpayment_cents"] }
  - { method: GET, path: "/enrollments/{enrollmentId}/hour-entries", description: "List an enrollment's hour entries", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff, Member], code: 200, input: ["status?", "limit?", "offset?"], output: "ServiceHourEntry[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{enrollmentId}/allowance-payments", description: "List an enrollment's living allowance payments", roles: [CNCSProgramOfficer, GranteeStaff, Member], code: 200, input: ["limit?", "offset?"], output: "LivingAllowancePayment[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{enrollmentId}/grievances", description: "List an enrollment's grievances", roles: [CNCSProgramOfficer, GranteeStaff, Member], code: 200, input: ["status?", "limit?", "offset?"], output: "Grievance[]", side_effects: [] }

  # --- hour entries -----------------------------------------------------------
  - { method: POST, path: "/enrollments/{enrollmentId}/hour-entries", description: "Record a service timesheet entry (PENDING)", roles: [GranteeStaff], code: 201, input: [service_date, minutes, activity_code], output: ServiceHourEntry, side_effects: [] }
  - { method: POST, path: "/hour-entries/{entryId}/certify", description: "Certify a PENDING entry: prohibited-activity and fundraising-cap gates; accumulates certified minutes", roles: [GranteeStaff], code: 200, input: [], output: ServiceHourEntry, side_effects: ["PENDING -> CERTIFIED", "enrollment.certified_minutes += minutes", "FUNDRAISING: enrollment.fundraising_certified_minutes += minutes"] }
  - { method: POST, path: "/hour-entries/{entryId}/reject", description: "Reject a PENDING entry with a reason (terminal)", roles: [GranteeStaff], code: 200, input: [reason], output: ServiceHourEntry, side_effects: ["PENDING -> REJECTED"] }

  # --- living allowance payments ----------------------------------------------
  - { method: POST, path: "/enrollments/{enrollmentId}/allowance-payments", description: "Disburse a living allowance payment subject to the three-input gate (period cap, total, earned cap)", roles: [GranteeStaff], code: 201, input: [amount_cents, "note?"], output: LivingAllowancePayment, side_effects: ["enrollment.allowance_paid_cents += amount_cents"] }

  # --- education awards & uses -------------------------------------------------
  - { method: GET, path: "/education-awards", description: "List education awards, optionally filtered", roles: [CNCSProgramOfficer, TrustAdministrator, Member], code: 200, input: ["member_id?", "enrollment_id?", "status?", "limit?", "offset?"], output: "EducationAward[]", side_effects: ["lazy EXPIRED evaluation on read"] }
  - { method: GET, path: "/education-awards/{educationAwardId}", description: "Read one education award", roles: [CNCSProgramOfficer, TrustAdministrator, Member], code: 200, input: [], output: EducationAward, side_effects: ["lazy EXPIRED evaluation on read"] }
  - { method: POST, path: "/education-awards/{educationAwardId}/uses", description: "Request a use of the education award (TUITION at a Title IV institution or QUALIFIED_LOAN repayment); OCC on the award", roles: [Member], code: 201, input: [use_type, amount_cents, "institution_title_iv?", expected_education_award_version], output: EducationAwardUse, side_effects: ["increments EducationAward.version by 1"] }
  - { method: GET, path: "/education-awards/{educationAwardId}/uses", description: "List uses of an education award", roles: [CNCSProgramOfficer, TrustAdministrator, Member], code: 200, input: ["status?", "limit?", "offset?"], output: "EducationAwardUse[]", side_effects: [] }
  - { method: POST, path: "/education-award-uses/{useId}/decide", description: "Trust administrator approves (debits award balance) or denies a pending use", roles: [TrustAdministrator], code: 200, input: [decision, "note?"], output: EducationAwardUse, side_effects: ["APPROVE: award.remaining_balance_cents -= amount; award status -> PARTIALLY_USED or EXHAUSTED; award.version += 1", "DENY: no balance change"] }
  - { method: POST, path: "/education-award-uses/{useId}/rescind", description: "Rescind an APPROVED use; restores the award balance (compensating action)", roles: [TrustAdministrator], code: 200, input: [reason], output: EducationAwardUse, side_effects: ["award.remaining_balance_cents += amount; award status recomputed; award.version += 1"] }

  # --- compliance visits & findings ---------------------------------------------
  - { method: POST, path: "/awards/{awardId}/compliance-visits", description: "Schedule a site visit or file review; 30-day buffer against other visits of the award", roles: [ComplianceOfficer], code: 201, input: [visit_type, scheduled_date], output: ComplianceVisit, side_effects: ["created_by_officer_id := caller X-User-ID"] }
  - { method: POST, path: "/compliance-visits/{visitId}/conduct", description: "Mark a scheduled visit conducted", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceVisit, side_effects: ["SCHEDULED -> CONDUCTED", "conducted_at := current_utc"] }
  - { method: POST, path: "/compliance-visits/{visitId}/findings", description: "Record a finding on a conducted visit", roles: [ComplianceOfficer], code: 201, input: [severity, description], output: Finding, side_effects: ["award_id copied from visit"] }
  - { method: GET, path: "/findings", description: "List findings, optionally filtered", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: ["visit_id?", "award_id?", "status?", "limit?", "offset?"], output: "Finding[]", side_effects: [] }
  - { method: GET, path: "/findings/{findingId}", description: "Read one finding", roles: [CNCSProgramOfficer, ComplianceOfficer, GranteeStaff], code: 200, input: [], output: Finding, side_effects: [] }
  - { method: POST, path: "/findings/{findingId}/assign-corrective-action", description: "Assign corrective action with a 14..90 day window", roles: [ComplianceOfficer], code: 200, input: [requirement, due_days], output: Finding, side_effects: ["OPEN -> ACTION_ASSIGNED", "due_at := current_utc + due_days days"] }
  - { method: POST, path: "/findings/{findingId}/submit-evidence", description: "Grantee submits corrective evidence (from ACTION_ASSIGNED or ESCALATED)", roles: [GranteeStaff], code: 200, input: [evidence_note], output: Finding, side_effects: ["-> EVIDENCE_SUBMITTED"] }
  - { method: POST, path: "/findings/{findingId}/decide", description: "Decide on submitted evidence; deciding officer must differ from the visit creator (SoD); REJECT loops back to ACTION_ASSIGNED", roles: [ComplianceOfficer], code: 200, input: [decision, "note?"], output: Finding, side_effects: ["APPROVE -> RESOLVED; visit bubble-up to CLOSED when all findings RESOLVED", "REJECT -> ACTION_ASSIGNED (cycle)"] }
  - { method: POST, path: "/compliance/sweep-overdue", description: "Escalate every ACTION_ASSIGNED or EVIDENCE_SUBMITTED finding whose due_at < current_utc; cascade suspends the award and its ACTIVE enrollments", roles: [ComplianceOfficer], code: 200, input: [], output: { escalated_finding_ids: "string[]", suspended_award_ids: "string[]", suspended_enrollment_ids: "string[]" }, side_effects: ["finding -> ESCALATED", "award ACTIVE -> SUSPENDED", "ACTIVE enrollments -> SUSPENDED (origin AWARD_CASCADE)"] }

  # --- grievances -----------------------------------------------------------------
  - { method: POST, path: "/enrollments/{enrollmentId}/grievances", description: "Member files a grievance on their own enrollment", roles: [Member], code: 201, input: [description], output: Grievance, side_effects: [] }
  - { method: POST, path: "/grievances/{grievanceId}/escalate", description: "Member escalates the grievance to the federal level; an ESCALATED grievance blocks FOR_CAUSE release", roles: [Member], code: 200, input: [], output: Grievance, side_effects: ["FILED -> ESCALATED"] }
  - { method: POST, path: "/grievances/{grievanceId}/resolve", description: "Federal program officer resolves an escalated grievance", roles: [CNCSProgramOfficer], code: 200, input: [outcome], output: Grievance, side_effects: ["ESCALATED -> RESOLVED"] }

  # --- performance measures ---------------------------------------------------------
  - { method: POST, path: "/awards/{awardId}/performance-measures", description: "Establish a national performance measure on an ACTIVE award", roles: [GranteeStaff], code: 201, input: [measure_code, target_value, unit], output: PerformanceMeasure, side_effects: [] }
  - { method: POST, path: "/performance-measures/{measureId}/reports", description: "Submit a periodic report (from OPEN or RETURNED; the review cycle repeats)", roles: [GranteeStaff], code: 200, input: [period_start, period_end, actual_value], output: PerformanceMeasure, side_effects: ["-> SUBMITTED; latest_* fields updated"] }
  - { method: POST, path: "/performance-measures/{measureId}/review", description: "Federal review of a submitted report: ACCEPT or RETURN (RETURN requires a comment)", roles: [CNCSProgramOfficer], code: 200, input: [decision, "comment?"], output: PerformanceMeasure, side_effects: ["SUBMITTED -> ACCEPTED | RETURNED"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on endpoint, or entity-backed ownership mismatch (wrong org / wrong member)" }
  - { id: ERR_ORG_DEBARRED, http: 403, condition: "GranteeStaff's organization is DEBARRED and the endpoint is an org-scoped write" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum value, or range violation (minutes, due_days, amounts, date ordering)" }
  - { id: ERR_ORGANIZATION_NOT_FOUND, http: 404, condition: "orgId path segment does not resolve" }
  - { id: ERR_COMPETITION_NOT_FOUND, http: 404, condition: "competitionId path segment does not resolve" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "applicationId path segment does not resolve" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "awardId path segment does not resolve" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "slotId path segment does not resolve" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "memberId path segment or member_id body reference does not resolve" }
  - { id: ERR_CHECK_NOT_FOUND, http: 404, condition: "checkId path segment does not resolve" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollmentId path segment does not resolve" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "entryId path segment does not resolve" }
  - { id: ERR_EDUCATION_AWARD_NOT_FOUND, http: 404, condition: "educationAwardId path segment does not resolve" }
  - { id: ERR_USE_NOT_FOUND, http: 404, condition: "useId path segment does not resolve" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "visitId path segment does not resolve" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "findingId path segment does not resolve" }
  - { id: ERR_GRIEVANCE_NOT_FOUND, http: 404, condition: "grievanceId path segment does not resolve" }
  - { id: ERR_MEASURE_NOT_FOUND, http: 404, condition: "measureId path segment does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic transition guard: entity not in a legal from-state for the requested trigger" }
  - { id: ERR_AWARD_SUSPENDED, http: 409, condition: "Operation requires award ACTIVE but award is SUSPENDED (or reinstate of enrollment while award suspended)" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Hour entry creation/certification or allowance payment requires enrollment ACTIVE" }
  - { id: ERR_EDUCATION_AWARD_NOT_USABLE, http: 409, condition: "Use requested on an EXHAUSTED or EXPIRED education award" }
  - { id: ERR_USE_NOT_PENDING, http: 409, condition: "Decide on a non-PENDING_APPROVAL use, or rescind on a non-APPROVED use" }
  - { id: ERR_CHECK_ALREADY_ADJUDICATED, http: 409, condition: "component-results on a check whose adjudication has left PENDING" }
  - { id: ERR_COMPONENT_ALREADY_RECORDED, http: 409, condition: "Recording a component (NSOPR/STATE_REPOSITORY/FBI_FINGERPRINT) that is already CLEAR or FLAGGED" }
  - { id: ERR_CHECK_IN_PROGRESS, http: 409, condition: "Initiating a second criminal history check while one is still PENDING for the member" }
  - { id: ERR_ENROLLMENTS_OPEN, http: 409, condition: "Award close while any enrollment is PENDING_CHECKS, ACTIVE, or SUSPENDED" }
  - { id: ERR_FINDINGS_ESCALATED, http: 409, condition: "Award reinstate while any finding of the award is ESCALATED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_award_version / expected_education_award_version does not match the parent's current version (OCC)" }
