            - { call: "POST /appraisal/comparables/${c11}/verify", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/comparables/${c11}/lock", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/comparables"
