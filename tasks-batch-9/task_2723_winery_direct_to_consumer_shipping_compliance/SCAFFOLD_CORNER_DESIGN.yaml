      - name: a_winery_operator_cannot_lift_a_compliance_suspension_it_did_not_impose
        claim_type: role_gated_transition
        grounds:
          - errors[ERR_COMPLIANCE_REINSTATE_FORBIDDEN]
          - roles.WineryOperator.notes
          - state_machines.ClubSubscription.SUSPENDED_COMPLIANCE_to_ACTIVE
          - endpoints.POST_/dtc/club-subscriptions/{id}/release-hold
        distinguishing_aspect: |
          One endpoint serves two different transitions, and the acting role is part of the guard rather
          than part of the route: WineryOperator is a declared role on release-hold and may end a weather hold,
          but the SUSPENDED_COMPLIANCE -> ACTIVE edge is ComplianceOfficer-only, so the winery's attempt is 403
          ERR_COMPLIANCE_REINSTATE_FORBIDDEN and NOT ERR_UNAUTHORIZED. Dropping reset_missed_runs changes the
          answer again — without the flag the only edge on offer starts from WEATHER_HELD, so the subscription's
          actual state makes it a 409.
        test_recipe:
          setup:
            - "Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment; Ada is ID-verified. Clock 2026-08-01."
            - "A MONTHLY subscription (6 x 750 ml at 2600 c, annual_allotment 6) was due 2026-08-01 and the club run generated and cleared one order, advancing next_run_date to 2026-09-01 and consumed_shipments to 1."
            - "Revoking the TX permit then ran the three-hop cascade: the CLEARED + UNFULFILLED club order went to SUSPENDED_PERMIT, the subscription went ACTIVE -> SUSPENDED_COMPLIANCE with next_run_date null, and Winery.suspended_subscription_count became 1."
            - "missed_run_count is 0 \u2014 this suspension came from the cascade, not from missed runs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-1", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p_tx_id: $.data.id }
            - call: "POST /dtc/state-permits/${p_tx_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/carrier-programs"
              payload: { carrier_code: "GSO", program_name: "Wine Shipper TX", states_served: ["TX"], requires_enrollment: true, adult_signature_service_code: "AS21" }
              as: PlatformAdmin
              captures: { cp_id: $.data.id }
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
              captures: { w_v1: $.data.version }
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ce_id: $.data.id }
            - call: "POST /dtc/carrier-enrollments/${ce_id}/decision"
              payload: { decision: "APPROVED" }
              as: CarrierAgent
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/consumers/${c_id}/id-verification"
              payload: { id_verification_method: "DOCUMENT" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/club-subscriptions"
              payload: { consumer_id: "${c_id}", winery_id: "${w_id}", cadence: "MONTHLY", sku: "CLUB-750", bottles_per_shipment: 6, bottle_ml: 750, unit_price_cents: 2600, next_run_date: "2026-08-01", annual_allotment: 6 }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { cs_id: $.data.id }
            - call: "POST /dtc/club-runs"
              payload: { winery_id: "${w_id}", run_date: "2026-08-01" }
              as: WineryOperator
              as_user_id: "${w_id}"
            - call: "POST /dtc/state-permits/${p_tx_id}/revoke"
              payload: { revocation_reason: "State board suspended the shipper licence" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
          trigger:
            - call: "POST /dtc/club-subscriptions/${cs_id}/release-hold"
              payload: { reset_missed_runs: true }
              as: WineryOperator
              as_user_id: "${w_id}"
            - call: "POST /dtc/club-subscriptions/${cs_id}/release-hold"
              payload: {}
              as: WineryOperator
              as_user_id: "${w_id}"
            - call: "POST /dtc/club-subscriptions/${cs_id}/release-hold"
              payload: { reset_missed_runs: true }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the winery asking for reinstatement: HTTP 403 with error_id \"ERR_COMPLIANCE_REINSTATE_FORBIDDEN\" \u2014 WineryOperator is listed on this endpoint, so this is NOT ERR_UNAUTHORIZED"
            - "the winery asking without the flag: HTTP 409 with error_id \"ERR_INVALID_STATE_TRANSITION\" \u2014 the flagless edge starts at WEATHER_HELD and the subscription is SUSPENDED_COMPLIANCE"
            - "after both refusals ClubSubscription.${cs_id}.status is still \"SUSPENDED_COMPLIANCE\" with next_run_date null, and Winery.${w_id}.suspended_subscription_count is still 1"
            - "the officer with the flag: HTTP 200 with data.status \"ACTIVE\", data.missed_run_count 0 and data.next_run_date \"2026-08-01\" \u2014 the logical clock date, NOT the 2026-09-01 the club run had set"
            - "the cascade counter unwinds: Winery.${w_id}.suspended_subscription_count is 0 and Winery.version advanced by exactly 1 on the reinstatement"
            - "reinstating the subscription does NOT revive the suspended order: the club order's compliance_status is still \"SUSPENDED_PERMIT\", and StatePermit.${p_tx_id}.status is still \"REVOKED\""
            - "the subscription's consumed_shipments is still 1 and remaining_allotment 5 \u2014 reinstatement forgives missed runs, not consumed allotment"
