            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "Cost", question_text: "?", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi_id: $.data.id }
            - call: "POST /v1/rfis/${rfi_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi_id}/answer"
              payload: { answer_text: "premium", cost_impact_flag: true, schedule_impact_flag: false, estimated_cost_cents: 100000 }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/impact-assessments"
              payload: { rfi_id: "${rfi_id}" }
              as: ProjectEngineer
              captures: { ia_id: "$.data[0].id" }
          trigger:
            - call: "POST /v1/rfis/${rfi_id}/close"
              payload: {}
              as: ProjectEngineer
              captures: { err: $.data.error_id }
            - call: "POST /v1/impact-assessments/${ia_id}/price"
              payload: { sub_quote_cents: 100000 }
              as: ProjectEngineer
              as_user_id: "pe-001"
            - call: "POST /v1/impact-assessments/${ia_id}/waive"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "POST /v1/rfis/${rfi_id}/close"
              payload: {}
              as: ProjectEngineer
              captures: { st: $.data.status }
          assert:
            - "err == ERR_ASSESSMENT_OPEN_ON_CLOSE while the assessment is ESTIMATED"
            - "st == CLOSED after the assessment reaches WAIVED"

      - name: revision_submit_requires_project_active
        grounds:
          - state_machines.SubmittalRevision.status
          - state_machines.Project.posture
          - "validations[priority=7]"
        distinguishing_aspect: |
          Pair SubmittalRevision -> Project: submitting a revision while the project is
          SUSPENDED fails ERR_PROJECT_NOT_ACTIVE even though the submittal itself is in a
          revision-accepting state (REGISTERED) — parent posture gates the child write.
        test_recipe:
          setup:
            - "Project with sub C1 and register generated; submittal S REGISTERED; project then SUSPENDED"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Gate3" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "SteelFab", trade: "structural steel" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "051200", lead_time_days: 20, default_need_date: "2026-10-30", responsible_subcontractor_id: "${c1_id}", required_submittal_kinds: ["SHOP_DRAWINGS"] }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /v1/projects/${p_id}/suspend"
              payload: {}
              as: ProjectManager
            - call: "GET /v1/submittals/${sub_id}"
              payload: {}
              as: ProjectEngineer
              captures: { s_v: $.data.version }
          trigger:
            - call: "POST /v1/submittals/${sub_id}/revisions"
              payload: { document_ref: "doc://r0", expected_submittal_version: "${s_v}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROJECT_NOT_ACTIVE"
            - "no revision created: submittal.revision_count stays 0"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_window_buffered_halfopen_exclusion
        grounds:
          - calculations.crew_window_conflict_check
        distinguishing_aspect: |
          Resource Subcontractor, half-open windows + mobilization buffer semantics: a second
          activity starting exactly buffer days after the predecessor's exclusive end
          (2026-09-12 vs end 2026-09-10 + 2) is ALLOWED, while one day earlier (2026-09-11)
          conflicts — adjacency is legal only at gap >= buffer.
        test_recipe:
          setup:
            - "Project ACTIVE (mobilization_buffer_days 2); sub C1; submittal S REGISTERED; activity A on S/C1 [2026-09-01, 2026-09-10)"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "CrewWin" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "ConcCo", trade: "concrete" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "033000", lead_time_days: 5, default_need_date: "2026-09-01", responsible_subcontractor_id: "${c1_id}", required_submittal_kinds: ["PRODUCT_DATA"] }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /v1/projects/${p_id}/installation-activities"
              payload: { submittal_id: "${sub_id}", subcontractor_id: "${c1_id}", start_date: "2026-09-01", end_date: "2026-09-10" }
              as: ProjectEngineer
              captures: { act_a: $.data.id }
          trigger:
            - call: "POST /v1/projects/${p_id}/installation-activities"
              payload: { submittal_id: "${sub_id}", subcontractor_id: "${c1_id}", start_date: "2026-09-12", end_date: "2026-09-20" }
              as: ProjectEngineer
              captures: { act_b: $.data.id }
            - call: "POST /v1/projects/${p_id}/installation-activities"
              payload: { submittal_id: "${sub_id}", subcontractor_id: "${c1_id}", start_date: "2026-09-11", end_date: "2026-09-15" }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "activity B created (gap exactly 2 days == buffer passes)"
            - "err == ERR_CREW_WINDOW_CONFLICT for the 2026-09-11 window (gap 1 < buffer 2)"

      - name: reviewer_window_aggregate_capacity_overlap
        grounds:
          - calculations.reviewer_selector
          - state_machines.SubmittalRevision.status.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Resource Reviewer with aggregate-capacity semantics (up to review_capacity
          overlapping review windows are LEGAL, unlike the strict crew exclusion): the 3rd
          overlapping assignment to a capacity-2 reviewer fails ERR_REVIEWER_AT_CAPACITY, and
          returning one frees the slot so a retry succeeds — capacity is a count of
          overlapping windows, not a boolean lock.
        test_recipe:
          setup:
            - "Project ACTIVE; sub C1 responsible for section with 3 kinds -> S1..S3; reviewer R1 ARCH capacity 2"
            - "Revisions submitted on S1..S3; rev1 and rev2 routed to R1 (open_review_count 2)"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "RevCap" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
