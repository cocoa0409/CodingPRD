scenario: |
  1110. Dust Collection & Combustible-Dust Compliance (NFPA 652 compliance contractor): dust hazard analysis & Kst classification, collector sizing & explosion protection design, filter change interval & differential pressure trend, housekeeping program & audit, hot-work permit interaction, insurance/AHJ inspection findings, retrofit project scoping, incident investigation

domain_name: dust-compliance
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility legal name" }
      - { name: address, type: string, source: input, description: "Physical address" }
      - { name: ahj_authority, type: string, source: input, description: "Authority Having Jurisdiction label (fire marshal, building dept)" }
      - { name: insurer_id, type: string, source: input, description: "Insurer reference used for audit access" }
      - { name: posture, type: enum, source: computed, description: "COMPLIANT | CONDITIONAL | DEFICIENT | STOP_WORK — derived per calc `site_posture_derivation`" }
      - { name: posture_score, type: number, source: computed, description: "0..100 weighted score per calc `site_posture_derivation`" }
      - { name: open_critical_findings, type: integer, source: computed, default: 0, description: "Count of InspectionFinding rows with status=OPEN and severity=CRITICAL at this site" }
      - { name: open_overdue_housekeeping, type: integer, source: computed, default: 0, description: "Count of HousekeepingAudit rows with status=OVERDUE at this site" }
      - { name: hot_work_in_progress, type: integer, source: computed, default: 0, description: "Count of HotWorkPermit rows with status=IN_PROGRESS at this site" }
      - { name: last_dha_id, type: string, source: system, description: "Most recent DHA in APPROVED state; FK -> DHA.id; null when none" }

  - name: DustSample
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: material_name, type: string, source: input, description: "Dust/material trade name" }
      - { name: kst_bar_m_per_s, type: number, source: input, description: "Kst value (bar·m/s); >=0" }
      - { name: pmax_bar_g, type: number, source: input, description: "Pmax (bar-g); >0" }
      - { name: mie_mj, type: number, source: input, description: "Minimum ignition energy (mJ); >0" }
      - { name: sample_class, type: enum, source: computed, description: "ST0 | ST1 | ST2 | ST3 — derived per calc `kst_classify`" }
      - { name: combustible, type: boolean, source: computed, description: "true when kst_bar_m_per_s > 0 else false" }
      - { name: lab_report_ref, type: string, source: input, description: "External laboratory report reference" }

  - name: Collector
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: tag, type: string, source: input, description: "Equipment tag e.g. DC-101" }
      - { name: dust_sample_id, type: string, source: input, description: "FK -> DustSample.id; worst-case dust this collector serves" }
      - { name: design_airflow_acfm, type: integer, source: input, description: "Design airflow ACFM; >0" }
      - { name: filter_area_ft2, type: number, source: input, description: "Net filter area (ft²); >0" }
      - { name: air_to_cloth_ratio, type: number, source: computed, description: "= design_airflow_acfm / filter_area_ft2 (4 dp round_half_up)" }
      - { name: internal_volume_m3, type: number, source: input, description: "Dirty-side internal volume (m³); >0" }
      - { name: pred_max_bar_g, type: number, source: computed, description: "Maximum reduced pressure predicted by calc `explosion_protection_design`" }
      - { name: required_vent_area_m2, type: number, source: computed, description: "Required vent area per calc `explosion_protection_design`" }
      - { name: installed_vent_area_m2, type: number, source: input, default: 0, description: "Actually-installed vent area (m²); >=0" }
      - { name: vent_adequate, type: boolean, source: computed, description: "true iff installed_vent_area_m2 >= required_vent_area_m2" }
      - { name: dp_current_inwc, type: number, source: computed, default: 0, description: "Latest differential pressure reading (in w.c.)" }
      - { name: dp_trend, type: enum, source: computed, default: "STABLE", description: "STABLE | RISING | ALARM_HIGH — derived per calc `dp_trend_derivation`" }
      - { name: filter_change_due, type: boolean, source: computed, default: false, description: "true when dp_current_inwc >= DP_HIGH_ALARM or age>=max days" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → IN_SERVICE → OUT_OF_SERVICE → DECOMMISSIONED" }

  - name: DHA
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: title, type: string, source: input, description: "DHA title" }
      - { name: author_id, type: string, source: input, description: "X-User-ID of ComplianceEngineer author (segregation-of-duties anchor)" }
      - { name: approver_id, type: string, source: system, description: "X-User-ID of ComplianceManager who approved; null until APPROVED" }
      - { name: kst_class_highest, type: enum, source: computed, description: "ST0 | ST1 | ST2 | ST3 — max over linked DustSample.sample_class per calc `dha_kst_rollup`" }
      - { name: risk_score, type: number, source: computed, description: "0..100 composite per calc `dha_risk_score`" }
      - { name: review_due_at, type: datetime, source: computed, description: "Approved_at + REVIEW_PERIOD_DAYS (per calc `dha_review_schedule`)" }
      - { name: overdue, type: boolean, source: computed, default: false, description: "true when review_due_at < current clock" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → SUBMITTED → APPROVED → SUPERSEDED; DRAFT → SUBMITTED → REJECTED → DRAFT (cycle)" }

  - name: HousekeepingProgram
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: target_accumulation_g_per_m2, type: number, source: input, description: "Maximum permitted dust accumulation (g/m²); >0" }
      - { name: frequency_hours, type: integer, source: input, description: "Required hours between audits; >0" }
      - { name: last_audit_at, type: datetime, source: system, description: "Timestamp of most recent PASS/FAIL audit; null until first" }
      - { name: next_due_at, type: datetime, source: computed, description: "= last_audit_at + frequency_hours; null until first audit" }
      - { name: current_posture, type: enum, source: computed, default: "CURRENT", description: "CURRENT | DUE_SOON | OVERDUE per calc `housekeeping_schedule`" }

  - name: HousekeepingAudit
    parent: HousekeepingProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> HousekeepingProgram.id; owning program" }
      - { name: auditor_id, type: string, source: input, description: "X-User-ID of HousekeepingAuditor (must differ from program creator when segregation of duties enabled)" }
      - { name: measured_accumulation_g_per_m2, type: number, source: input, description: "Mass-loading sample; >=0" }
      - { name: pass_threshold_g_per_m2, type: number, source: system, description: "Snapshot of program.target_accumulation_g_per_m2 at audit creation" }
      - { name: pass, type: boolean, source: computed, description: "true iff measured_accumulation_g_per_m2 <= pass_threshold_g_per_m2" }
      - { name: scheduled_for, type: datetime, source: input, description: "Intended audit timestamp" }
      - { name: executed_at, type: datetime, source: system, description: "When result recorded; null until submitted" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED → RECORDED / OVERDUE / SKIPPED" }

  - name: HotWorkPermit
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: collector_id, type: string, source: input, description: "FK -> Collector.id; hot work near/on this collector (optional-scope)" }
      - { name: work_description, type: string, source: input, description: "Description of work" }
      - { name: issuer_id, type: string, source: input, description: "X-User-ID of SafetyManager issuer" }
      - { name: performer_id, type: string, source: input, description: "X-User-ID of HotWorkPerformer (must differ from issuer_id)" }
      - { name: valid_from, type: datetime, source: input, description: "Inclusive start of permit window (half-open [valid_from, valid_to))" }
      - { name: valid_to, type: datetime, source: input, description: "Exclusive end of permit window; must be > valid_from and <= valid_from + 24h" }
      - { name: fire_watch_minutes_after, type: integer, source: input, description: "Post-work fire watch minutes; >=30 per NFPA 51B" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED → IN_PROGRESS → CLOSED / VOIDED / EXPIRED" }

  - name: Inspection
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: inspector_kind, type: enum, source: input, description: "AHJ | INSURER | INTERNAL" }
      - { name: inspector_ref, type: string, source: input, description: "External inspector reference" }
      - { name: conducted_at, type: datetime, source: input, description: "Date of walkdown" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN → SUBMITTED → ACCEPTED / REJECTED" }

  - name: InspectionFinding
    parent: Inspection
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: system, description: "FK -> Inspection.id; parent inspection" }
      - { name: collector_id, type: string, source: input, description: "FK -> Collector.id; nullable; set when finding is collector-specific" }
      - { name: severity, type: enum, source: input, description: "OBSERVATION | MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Finding text" }
      - { name: due_at, type: datetime, source: input, description: "Correct-by date" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN → IN_PROGRESS → RESOLVED → VERIFIED / REOPENED; OPEN → DISPUTED → WITHDRAWN" }

  - name: RetrofitProject
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: trigger_finding_id, type: string, source: input, description: "FK -> InspectionFinding.id; driving CRITICAL finding" }
      - { name: scope_budget_cents, type: integer, source: input, description: "Budget; >0" }
      - { name: estimated_cost_cents, type: integer, source: computed, default: 0, description: "Sum of RetrofitLineItem.cost_cents" }
      - { name: contingency_cents, type: integer, source: computed, default: 0, description: "Per calc `retrofit_contingency` — risk-tiered buffer" }
      - { name: total_projected_cents, type: integer, source: computed, default: 0, description: "= estimated_cost_cents + contingency_cents" }
      - { name: contingency_rounding_cents, type: integer, source: computed, default: 0, description: "Reconciliation remainder from per-line rounding in calc `retrofit_contingency`" }
      - { name: status, type: enum, source: system, default: "SCOPING", description: "SCOPING → ESTIMATED → APPROVED → IN_EXECUTION → CLOSED / CANCELLED" }

  - name: RetrofitLineItem
    parent: RetrofitProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> RetrofitProject.id; owning project" }
      - { name: description, type: string, source: input, description: "Line description" }
      - { name: cost_cents, type: integer, source: input, description: "Line cost; >0" }
      - { name: risk_tier, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }

  - name: Incident
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: occurred_at, type: datetime, source: input, description: "When incident occurred" }
      - { name: collector_id, type: string, source: input, description: "FK -> Collector.id; involved collector (nullable for non-collector incidents)" }
      - { name: kind, type: enum, source: input, description: "FIRE | DEFLAGRATION | EMBER_RELEASE | NEAR_MISS" }
      - { name: description, type: string, source: input, description: "Narrative" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CATASTROPHIC" }
      - { name: root_cause_code, type: enum, source: input, description: "HOUSEKEEPING | HOT_WORK | EQUIPMENT_FAILURE | STATIC_DISCHARGE | UNKNOWN" }
      - { name: investigation_lead_id, type: string, source: input, description: "X-User-ID of IncidentInvestigator; must differ from any HotWorkPermit.issuer_id linked to the incident" }
      - { name: capa_count, type: integer, source: computed, default: 0, description: "Number of CAPAAction rows linked" }
      - { name: capa_open_count, type: integer, source: computed, default: 0, description: "Number of CAPAAction rows with status != CLOSED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN → INVESTIGATING → CAPA_DEFINED → CLOSED / REOPENED" }

  - name: CAPAAction
    parent: Incident
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> Incident.id; owning incident" }
      - { name: description, type: string, source: input, description: "Action text" }
      - { name: owner_id, type: string, source: input, description: "X-User-ID of action owner" }
      - { name: due_at, type: datetime, source: input, description: "Due date" }
      - { name: closed_at, type: datetime, source: system, description: "When closed; null until CLOSED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN → IN_PROGRESS → CLOSED / OVERDUE" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Collector
    initial_state: DRAFT
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: DRAFT
        to: IN_SERVICE
        trigger: "POST /sites/{id}/collectors/{collector_id}/commission"
        actor: ComplianceEngineer
        preconditions:
          - "vent_adequate == true (else ERR_VENT_UNDERSIZED)"
          - "DustSample referenced by dust_sample_id exists and combustible==true"
          - "Site.posture != STOP_WORK (else ERR_POSTURE_STOP_WORK)"
        side_effects:
          - "Recompute Site.posture via calc `site_posture_derivation`"
          - "Increments Site.version by 1"

      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /sites/{id}/collectors/{collector_id}/take_out_of_service"
        actor: ComplianceEngineer
        preconditions:
          - "No HotWorkPermit with collector_id == this.id and status IN (ISSUED, IN_PROGRESS) (else ERR_COLLECTOR_BUSY)"
        side_effects:
          - "If filter_change_due==true, cascade: auto-create InspectionFinding severity=MAJOR on latest OPEN/SUBMITTED Inspection at Site (else create new Inspection with status=OPEN first)"
          - "Recompute Site.posture"
          - "Increments Site.version by 1"

      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /sites/{id}/collectors/{collector_id}/return_to_service"
        actor: ComplianceEngineer
        preconditions:
          - "filter_change_due == false (else ERR_FILTER_CHANGE_REQUIRED)"
          - "Site.posture != STOP_WORK"
        side_effects:
          - "Recompute Site.posture"

      - from: OUT_OF_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /sites/{id}/collectors/{collector_id}/decommission"
        actor: ComplianceManager
        preconditions:
          - "No OPEN/IN_PROGRESS InspectionFinding references this collector"
        side_effects:
          - "Recompute Site.posture"

  - entity: DHA
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sites/{id}/dhas/{dha_id}/submit"
        actor: ComplianceEngineer
        preconditions:
          - "DHA.author_id == X-User-ID"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sites/{id}/dhas/{dha_id}/approve"
        actor: ComplianceManager
        preconditions:
          - "DHA.author_id != X-User-ID (segregation of duties; else ERR_SOD_VIOLATION)"
          - "kst_class_highest is not ST0 for every linked DustSample — at least one combustible dust must be referenced (else ERR_NO_COMBUSTIBLE_DUST)"
        side_effects:
          - "Set approver_id = X-User-ID"
          - "Set review_due_at = now + REVIEW_PERIOD_DAYS"
          - "Site.last_dha_id = this DHA.id"
          - "Any other DHA on the same Site in APPROVED state transitions to SUPERSEDED"
          - "Recompute Site.posture"
          - "Increments Site.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sites/{id}/dhas/{dha_id}/reject"
        actor: ComplianceManager
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /sites/{id}/dhas/{dha_id}/revise"
        actor: ComplianceEngineer
        preconditions:
          - "DHA.author_id == X-User-ID"
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (auto when a newer DHA on same Site is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HousekeepingAudit
    initial_state: SCHEDULED
    terminal_states: [RECORDED, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: RECORDED
        trigger: "POST /sites/{id}/housekeeping-programs/{program_id}/audits/{audit_id}/record"
        actor: HousekeepingAuditor
        preconditions:
          - "Audit.auditor_id == X-User-ID"
          - "Audit.scheduled_for <= current clock (else ERR_AUDIT_NOT_DUE)"
        side_effects:
          - "Set executed_at = current clock; compute pass"
          - "HousekeepingProgram.last_audit_at = executed_at"
          - "HousekeepingProgram.next_due_at = executed_at + frequency_hours"
          - "If pass==false: auto-create InspectionFinding severity=MAJOR on most recent OPEN/SUBMITTED Inspection at Site"
          - "Recompute HousekeepingProgram.current_posture and Site.posture"

      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (auto when current clock > scheduled_for + program.frequency_hours and no audit has yet been RECORDED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increment Site.open_overdue_housekeeping by 1"
          - "Recompute Site.posture"
        note: "OVERDUE audits may still be recorded (recovery path)"

      - from: OVERDUE
        to: RECORDED
        trigger: "POST /sites/{id}/housekeeping-programs/{program_id}/audits/{audit_id}/record"
        actor: HousekeepingAuditor
        preconditions:
          - "Audit.auditor_id == X-User-ID"
        side_effects:
          - "Decrement Site.open_overdue_housekeeping by 1"
          - "Apply same RECORDED side-effects as SCHEDULED->RECORDED"
          - "Recompute Site.posture"

      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /sites/{id}/housekeeping-programs/{program_id}/audits/{audit_id}/skip"
        actor: HousekeepingAuditor
        preconditions:
          - "Audit.auditor_id == X-User-ID"
        side_effects:
          - "Audit excluded from schedule derivation"

  - entity: HotWorkPermit
    initial_state: ISSUED
    terminal_states: [CLOSED, VOIDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: IN_PROGRESS
        trigger: "POST /sites/{id}/hot-work-permits/{permit_id}/start"
        actor: HotWorkPerformer
        preconditions:
          - "Permit.performer_id == X-User-ID"
          - "Site.posture != STOP_WORK (else ERR_POSTURE_STOP_WORK)"
          - "current clock in [valid_from, valid_to) (else ERR_PERMIT_WINDOW_INACTIVE)"
          - "If permit.collector_id is set: Collector.status == IN_SERVICE or OUT_OF_SERVICE (not DECOMMISSIONED)"
          - "No other HotWorkPermit on same Site with overlapping window already IN_PROGRESS (else ERR_PERMIT_OVERLAP)"
        side_effects:
          - "Increment Site.hot_work_in_progress by 1"
          - "Recompute Site.posture"

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /sites/{id}/hot-work-permits/{permit_id}/close"
        actor: HotWorkPerformer
        preconditions:
          - "Permit.performer_id == X-User-ID"
          - "current clock >= valid_to + fire_watch_minutes_after minutes (else ERR_FIRE_WATCH_INCOMPLETE)"
        side_effects:
          - "Decrement Site.hot_work_in_progress by 1"
          - "Recompute Site.posture"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /sites/{id}/hot-work-permits/{permit_id}/void"
        actor: SafetyManager
        preconditions:
          - "Permit.issuer_id == X-User-ID"
        side_effects: []

      - from: ISSUED
        to: EXPIRED
        trigger: "system (auto when current clock > valid_to and status==ISSUED)"
        actor: system
        preconditions: []
        side_effects:
          - "Auto-create InspectionFinding severity=MINOR on most recent OPEN/SUBMITTED Inspection at Site"
          - "Recompute Site.posture"

  - entity: Inspection
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /sites/{id}/inspections/{inspection_id}/submit"
        actor: InspectorUser
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /sites/{id}/inspections/{inspection_id}/accept"
        actor: ComplianceManager
        preconditions:
          - "Every InspectionFinding with this inspection_id has status IN (VERIFIED, WITHDRAWN)"
        side_effects:
          - "Recompute Site.posture"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sites/{id}/inspections/{inspection_id}/reject"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "All OPEN/IN_PROGRESS InspectionFinding rows on this Inspection transition to DISPUTED"

  - entity: InspectionFinding
    initial_state: OPEN
    terminal_states: [VERIFIED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /sites/{id}/inspections/{inspection_id}/findings/{finding_id}/start_work"
        actor: ComplianceEngineer
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /sites/{id}/inspections/{inspection_id}/findings/{finding_id}/resolve"
        actor: ComplianceEngineer
        preconditions: []
        side_effects:
          - "If severity==CRITICAL: decrement Site.open_critical_findings by 1"
          - "Recompute Site.posture"

      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /sites/{id}/inspections/{inspection_id}/findings/{finding_id}/verify"
        actor: ComplianceManager
        preconditions:
          - "Inspector of parent Inspection has signed off (modeled as ComplianceManager verification)"
        side_effects: []

      - from: RESOLVED
        to: REOPENED
        trigger: "POST /sites/{id}/inspections/{inspection_id}/findings/{finding_id}/reopen"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "If severity==CRITICAL: increment Site.open_critical_findings by 1"
          - "Recompute Site.posture"

      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /sites/{id}/inspections/{inspection_id}/findings/{finding_id}/start_work"
        actor: ComplianceEngineer
        preconditions: []
        side_effects: []

      - from: OPEN
        to: DISPUTED
        trigger: "POST /sites/{id}/inspections/{inspection_id}/findings/{finding_id}/dispute"
        actor: ComplianceEngineer
        preconditions: []
        side_effects:
          - "If severity==CRITICAL: decrement Site.open_critical_findings by 1"
          - "Recompute Site.posture"

      - from: DISPUTED
        to: WITHDRAWN
        trigger: "POST /sites/{id}/inspections/{inspection_id}/findings/{finding_id}/withdraw"
        actor: InspectorUser
        preconditions: []
        side_effects: []

  - entity: RetrofitProject
    initial_state: SCOPING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCOPING
        to: ESTIMATED
        trigger: "POST /sites/{id}/retrofit-projects/{project_id}/finalize_estimate"
        actor: ComplianceEngineer
        preconditions:
          - "Project has at least one RetrofitLineItem (else ERR_PROJECT_EMPTY)"
          - "total_projected_cents <= scope_budget_cents (else ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "Recompute estimated_cost_cents, contingency_cents, total_projected_cents via calc `retrofit_contingency`"

      - from: ESTIMATED
        to: APPROVED
        trigger: "POST /sites/{id}/retrofit-projects/{project_id}/approve"
        actor: ComplianceManager
        preconditions:
          - "trigger_finding_id references an InspectionFinding with severity == CRITICAL and status IN (OPEN, IN_PROGRESS, RESOLVED) (else ERR_TRIGGER_FINDING_INVALID)"
        side_effects:
          - "Trigger InspectionFinding transitions to IN_PROGRESS if currently OPEN"
          - "Recompute Site.posture"

      - from: APPROVED
        to: IN_EXECUTION
        trigger: "POST /sites/{id}/retrofit-projects/{project_id}/start_execution"
        actor: ComplianceEngineer
        preconditions:
          - "Site.posture != STOP_WORK"
        side_effects: []

      - from: IN_EXECUTION
        to: CLOSED
        trigger: "POST /sites/{id}/retrofit-projects/{project_id}/close"
        actor: ComplianceManager
        preconditions:
          - "trigger_finding_id's InspectionFinding is in VERIFIED state (else ERR_TRIGGER_FINDING_OPEN)"
        side_effects:
          - "Recompute Site.posture"

      - from: SCOPING
        to: CANCELLED
        trigger: "POST /sites/{id}/retrofit-projects/{project_id}/cancel"
        actor: ComplianceManager
        preconditions: []
        side_effects: []

      - from: ESTIMATED
        to: CANCELLED
        trigger: "POST /sites/{id}/retrofit-projects/{project_id}/cancel"
        actor: ComplianceManager
        preconditions: []
        side_effects: []

  - entity: Incident
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /sites/{id}/incidents/{incident_id}/start_investigation"
        actor: IncidentInvestigator
        preconditions:
          - "Incident.investigation_lead_id == X-User-ID"
          - "investigation_lead_id differs from any HotWorkPermit.issuer_id whose collector_id == Incident.collector_id and whose window contains occurred_at (segregation of duties; else ERR_SOD_VIOLATION)"
        side_effects: []

      - from: INVESTIGATING
        to: CAPA_DEFINED
        trigger: "POST /sites/{id}/incidents/{incident_id}/define_capa"
        actor: IncidentInvestigator
        preconditions:
          - "Incident has at least one CAPAAction (else ERR_CAPA_REQUIRED)"
          - "root_cause_code != UNKNOWN (else ERR_ROOT_CAUSE_REQUIRED)"
        side_effects: []

      - from: CAPA_DEFINED
        to: CLOSED
        trigger: "POST /sites/{id}/incidents/{incident_id}/close"
        actor: ComplianceManager
        preconditions:
          - "capa_open_count == 0 (else ERR_CAPA_OPEN)"
        side_effects:
          - "Recompute Site.posture"

      - from: CLOSED
        to: REOPENED
        trigger: "POST /sites/{id}/incidents/{incident_id}/reopen"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "Recompute Site.posture"

      - from: REOPENED
        to: INVESTIGATING
        trigger: "POST /sites/{id}/incidents/{incident_id}/start_investigation"
        actor: IncidentInvestigator
        preconditions:
          - "Incident.investigation_lead_id == X-User-ID"
        side_effects: []

  - entity: CAPAAction
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /sites/{id}/incidents/{incident_id}/capa-actions/{capa_id}/start"
        actor: IncidentInvestigator
        preconditions:
          - "CAPAAction.owner_id == X-User-ID"
        side_effects:
          - "Incident.capa_open_count unchanged; Incident.updated_at refreshed"

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /sites/{id}/incidents/{incident_id}/capa-actions/{capa_id}/close"
        actor: IncidentInvestigator
        preconditions:
          - "CAPAAction.owner_id == X-User-ID"
        side_effects:
          - "Set closed_at = current clock"
          - "Decrement Incident.capa_open_count by 1"
          - "Recompute Site.posture"

      - from: OPEN
        to: OVERDUE
        trigger: "system (auto when current clock > due_at and status==OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute Site.posture"

      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system (auto when current clock > due_at and status==IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute Site.posture"

      - from: OVERDUE
        to: CLOSED
        trigger: "POST /sites/{id}/incidents/{incident_id}/capa-actions/{capa_id}/close"
        actor: IncidentInvestigator
        preconditions:
          - "CAPAAction.owner_id == X-User-ID"
        side_effects:
          - "Set closed_at = current clock"
          - "Decrement Incident.capa_open_count by 1"
          - "Recompute Site.posture"

  - entity: Site
    initial_state: CONDITIONAL
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: CONDITIONAL
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLIANT
        to: DEFICIENT
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLIANT
        to: STOP_WORK
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONDITIONAL
        to: COMPLIANT
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONDITIONAL
        to: DEFICIENT
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONDITIONAL
        to: STOP_WORK
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEFICIENT
        to: CONDITIONAL
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEFICIENT
        to: STOP_WORK
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STOP_WORK
        to: DEFICIENT
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STOP_WORK
        to: CONDITIONAL
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STOP_WORK
        to: COMPLIANT
        trigger: "system (recompute)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: dha-approve-stale-site
    parent_entity: Site
    write_endpoint: "POST /sites/{id}/dhas/{dha_id}/approve"
    occ_field: expected_site_version
    description: |
      Approving a DHA against a Site whose version has advanced since the
      client last observed it is rejected. Approving a DHA legitimately
      supersedes the previously APPROVED DHA on the same Site, mutates
      Site.last_dha_id, and triggers Site.posture recompute — all of which
      bump Site.version. A stale client view therefore indicates the
      approval may overwrite newer posture or audit state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: retrofit-finalize-stale-project
    parent_entity: RetrofitProject
    write_endpoint: "POST /sites/{id}/retrofit-projects/{project_id}/finalize_estimate"
    occ_field: expected_project_version
    description: |
      Finalizing the estimate of a RetrofitProject whose version has
      advanced since the client last observed it is rejected. Each
      RetrofitLineItem creation, update, or delete on the project
      legitimately mutates the project's estimated_cost_cents and
      contingency_cents and bumps RetrofitProject.version; a stale
      expected version therefore signals the proposed totals were
      derived from a superseded estimate.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: kst_classify
    trigger: "On DustSample create/update"
    algorithm: threshold
    formula: |
      if kst_bar_m_per_s == 0:               sample_class = ST0
      elif kst_bar_m_per_s <= 200:           sample_class = ST1
      elif kst_bar_m_per_s <= 300:           sample_class = ST2
      else:                                  sample_class = ST3
      combustible = (kst_bar_m_per_s > 0)
    input_set: "the DustSample being persisted"
    constants:
      ST1_MAX: 200
      ST2_MAX: 300
    precision: "integer thresholds; boundary values belong to the LOWER band (<=)"
    variants:
      - name: nfpa_standard
        when: "Default NFPA 652 / NFPA 68 bands"
        difference: "ST1<=200, ST2<=300, ST3>300"
      - name: insurer_conservative
        when: "When Site.insurer_id matches a registered conservative insurer flag (modeled as insurer_id startswith 'IC-')"
        difference: "Tighter bands: ST1<=150, ST2<=250, ST3>250 — same inputs produce different sample_class"

  - name: explosion_protection_design
    trigger: "On Collector create/update or when linked DustSample changes"
    algorithm: forward_looking
    formula: |
      # NFPA 68 simplified vent sizing (reduced to a deterministic scalar)
      # Kst and Pmax taken from linked DustSample; V = internal_volume_m3
      Kst = dust_sample.kst_bar_m_per_s
      Pmax = dust_sample.pmax_bar_g
      Pstat = 0.1            # bar-g static activation
      Pred_max = min( Pmax * 0.5, 0.5 + 0.04 * Kst**0.5 )
      Av0 = 0.1 * Kst * V**(2.0/3.0)
      required_vent_area_m2 = Av0 * (Pmax / max(Pred_max, 0.05))**0.5
      # Round required_vent_area_m2 to 3 decimals half-up
      pred_max_bar_g = Pred_max
    input_set: "Collector + linked DustSample"
    constants:
      PSTAT_BAR_G: 0.1
      MIN_PRED: 0.05
    precision: "required_vent_area_m2 to 3 dp round_half_up; pred_max_bar_g to 3 dp round_half_up"
    variants:
      - name: prescriptive
        when: "Default design per NFPA 68 simplified equation"
        difference: "Formula as above"
      - name: performance_based
        when: "When Collector.internal_volume_m3 > 25 (large vessels)"
        difference: "Apply a 1.20 safety multiplier to required_vent_area_m2 AND round to 3 dp; same inputs yield different required_vent_area_m2"

  - name: dp_trend_derivation
    trigger: "On every DPReading create (via POST /sites/{id}/collectors/{id}/dp-readings)"
    algorithm: aggregation
    formula: |
      # Look at last 5 readings (including current). Let xs = last 5 dp_inwc values ordered by created_at ASC.
      # current dp_current_inwc = xs[-1]
      # dp_trend:
      if dp_current_inwc >= DP_HIGH_ALARM: dp_trend = ALARM_HIGH
      elif len(xs) >= 3 and (xs[-1] - xs[-3]) >= DP_SLOPE_DELTA: dp_trend = RISING
      else: dp_trend = STABLE
      filter_change_due = (dp_current_inwc >= DP_HIGH_ALARM) OR \
                          (current_clock - collector.last_filter_change_at >= FILTER_MAX_AGE_DAYS days)
    input_set: "Collector's last 5 DPReading rows, ordered by created_at ASC, tie-break by created_at then by the server-minted reading sequence"
    constants:
      DP_HIGH_ALARM: 6.0
      DP_SLOPE_DELTA: 1.5
      FILTER_MAX_AGE_DAYS: 180
      LOOKBACK: 5
    precision: "2 dp round_half_up for dp values"

  - name: housekeeping_schedule
    trigger: "On HousekeepingProgram create, on HousekeepingAudit RECORDED, on clock advance"
    algorithm: chronological
    formula: |
      if last_audit_at is null:
        current_posture = OVERDUE   # a never-audited program is non-compliant
        next_due_at = null
      else:
        next_due_at = last_audit_at + frequency_hours hours
        if current_clock > next_due_at:                current_posture = OVERDUE
        elif current_clock > next_due_at - 24 hours:   current_posture = DUE_SOON
        else:                                          current_posture = CURRENT
    input_set: "single HousekeepingProgram"
    constants:
      DUE_SOON_WINDOW_HOURS: 24
    precision: "comparison is strict > for both OVERDUE and DUE_SOON transitions"

  - name: dha_kst_rollup
    trigger: "On DHA create/update and on DustSample create/update for a linked sample"
    algorithm: aggregation
    formula: |
      classes = {sample.sample_class for sample in DHA.linked_samples if sample.combustible}
      rank = {ST0:0, ST1:1, ST2:2, ST3:3}
      kst_class_highest = argmax by rank; empty set -> ST0
    input_set: "DustSample rows linked via POST /sites/{id}/dhas/{dha_id}/samples/{sample_id}"
    constants: {}
    precision: "exact rank comparison; ties impossible (max)"

  - name: dha_risk_score
    trigger: "On DHA create/update, on DustSample link/unlink, on clock advance"
    algorithm: weighted_scoring
    formula: |
      # Weighted scoring with tiered sub-components and pinned rounding order.
      # Step 1: per-dust sub-scores (rounded to 2dp half-up per dust, then summed).
      # Step 2: per-collector operational sub-score (rounded to 2dp per collector, then summed).
      # Step 3: aggregate (no further rounding; final float with 2dp).
      dust_sub_total   = sum over linked combustible DustSamples of
                         round( rank(sample_class) * 8 + max(0, 10 - mie_mj), 2 )
      collector_sub    = sum over Site Collectors with status==IN_SERVICE of
                         round( (3 if filter_change_due else 0)
                                + (5 if dp_trend == 'ALARM_HIGH' else 0)
                                + (3 if dp_trend == 'RISING' else 0)
                                + (0 if vent_adequate else 12), 2 )
      finding_sub      = 6 * Site.open_critical_findings + 2 * Site.open_overdue_housekeeping
      hotwork_sub      = 4 * Site.hot_work_in_progress
      raw              = dust_sub_total + collector_sub + finding_sub + hotwork_sub
      risk_score       = min(100, raw)
    input_set: "DHA.linked combustible DustSamples; Site.Collectors with status==IN_SERVICE; Site derived counters"
    constants:
      W_KST: 8
      W_MIE_CAP: 10
      W_FILTER_DUE: 3
      W_DP_ALARM: 5
      W_DP_RISING: 3
      W_VENT_INADEQ: 12
      W_CRITICAL_FINDING: 6
      W_OVERDUE_HK: 2
      W_HOTWORK: 4
      SCORE_CAP: 100
    precision: "2 dp round_half_up, applied PER-DUST and PER-COLLECTOR before summing; DO NOT round only at the end"

  - name: site_posture_derivation
    trigger: "After any mutation that affects Site derived counters or after any of the side-effects listed in §1.2 that call for recompute"
    algorithm: weighted_scoring
    formula: |
      # Two-stage scoring: (a) aggregate score, (b) threshold-map to posture.
      score = 100
      score -= 25 * min(Site.open_critical_findings, 2)
      score -= 10 * min(Site.open_overdue_housekeeping, 3)
      score -= 5  * min(Site.hot_work_in_progress, 3)
      score -= 20 if exists Collector at Site with status==IN_SERVICE and vent_adequate==false
      score -= 15 if exists Incident at Site with status IN (OPEN, INVESTIGATING, CAPA_DEFINED)
      score -= 8  if exists RetrofitProject at Site with status IN (APPROVED, IN_EXECUTION)
      posture_score = max(0, score)
      # Threshold-map — boundaries are INCLUSIVE of the higher band (>=):
      if   Site.open_critical_findings >= 2:   posture = STOP_WORK
      elif posture_score >= 85:                posture = COMPLIANT
      elif posture_score >= 60:                posture = CONDITIONAL
      else:                                    posture = DEFICIENT
      # Note: STOP_WORK overrides threshold bands regardless of score.
    input_set: "Site + derived counters + presence checks over Collector, Incident, RetrofitProject"
    constants:
      COMPLIANT_MIN: 85
      CONDITIONAL_MIN: 60
      STOP_WORK_CRITICALS: 2
    precision: "score arithmetic in integers (subscores are integer penalties); final comparisons use >="

  - name: retrofit_contingency
    trigger: "On RetrofitLineItem create/update/delete AND on RetrofitProject finalize_estimate"
    algorithm: waterfall_allocation
    formula: |
      # Two-step rounding with reconciliation: per-line tiered contingency, then sum, then reconcile.
      # Per line:
      #   LOW    -> 5%  of cost_cents
      #   MEDIUM -> 12% of cost_cents
      #   HIGH   -> 22% of cost_cents
      # Round each per-line contingency to the NEAREST CENT half-up BEFORE summing.
      per_line = [ round(cost * rate, 0) for each line ]   # half-up
      estimated_cost_cents    = sum(line.cost_cents)
      contingency_cents_gross = sum(per_line)
      # Reconciliation: contingency_cents is bucketed by tier; rounding remainder captured
      contingency_cents       = contingency_cents_gross
      contingency_rounding_cents = estimated_cost_cents + contingency_cents - \
                                   (estimated_cost_cents + contingency_cents_gross)
      # Note: contingency_rounding_cents is always 0 in the current scheme but the field exists
      # so a future change in rounding order (e.g., sum-then-round) surfaces drift explicitly.
      total_projected_cents   = estimated_cost_cents + contingency_cents
    input_set: "All RetrofitLineItem rows of the project (no status filter — line items are unstate-machined)"
    constants:
      RATE_LOW: 0.05
      RATE_MEDIUM: 0.12
      RATE_HIGH: 0.22
    precision: "integer cents; per-line round half-up THEN sum (pinned rounding order)"
    variants:
      - name: per_line_then_sum
        when: "Default rounding order"
        difference: "Round each line's contingency to cents, then sum"
      - name: sum_then_round
        when: "Insurer-mandated reporting variant when Site.insurer_id startswith 'IC-'"
        difference: "Sum unrounded per-line contingencies, then round once to cents — produces different contingency_cents for >=2 lines"

  - name: overdue_housekeeping_counter
    trigger: "On HousekeepingAudit -> OVERDUE auto-transition, on HousekeepingAudit RECORDED recovery, on HousekeepingProgram delete"
    algorithm: aggregation
    formula: |
      Site.open_overdue_housekeeping = count of HousekeepingAudit rows
        at this Site (via program_id -> HousekeepingProgram.site_id)
        where status == OVERDUE
    input_set: "HousekeepingAudit rows where status == OVERDUE (status filter mandatory)"
    constants: {}
    precision: "exact integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-Role header present and in the RBAC matrix",                                          error_id: ERR_UNAUTHENTICATED,           http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                  check: "X-User-ID header present when role requires it",                                              error_id: ERR_UNAUTHENTICATED,           http_status: 401, applies_to: "all" }
  - { priority: 3,  category: auth,                  check: "Role is permitted to call this endpoint",                                                     error_id: ERR_UNAUTHORIZED,              http_status: 403, applies_to: "all" }
  - { priority: 4,  category: existence,             check: "Each {id} segment in path resolves (validated left-to-right: Site, then child, then grandchild)", error_id: ERR_NOT_FOUND,                 http_status: 404, applies_to: "all" }
  - { priority: 5,  category: existence,             check: "Optional FK references in body resolve (dust_sample_id, collector_id, trigger_finding_id)",     error_id: ERR_NOT_FOUND,                 http_status: 404, applies_to: "mutating endpoints with optional FKs" }
  - { priority: 6,  category: state,                 check: "Target resource's current state allows the requested transition per §1.2",                      error_id: ERR_INVALID_STATE,             http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7,  category: state,                 check: "Site.posture != STOP_WORK for any state-transition endpoint marked posture-gated",              error_id: ERR_POSTURE_STOP_WORK,         http_status: 409, applies_to: "posture-gated endpoints (commission, return_to_service, hot-work start, retrofit start_execution)" }
  - { priority: 8,  category: business_safety,       check: "Collector.vent_adequate == true before commission",                                             error_id: ERR_VENT_UNDERSIZED,           http_status: 422, applies_to: "POST /sites/{id}/collectors/{collector_id}/commission" }
  - { priority: 9,  category: business_safety,       check: "Collector.filter_change_due == false before return_to_service",                                 error_id: ERR_FILTER_CHANGE_REQUIRED,    http_status: 422, applies_to: "POST /sites/{id}/collectors/{collector_id}/return_to_service" }
  - { priority: 10, category: business_safety,       check: "Hot work window is currently active (valid_from <= now < valid_to)",                            error_id: ERR_PERMIT_WINDOW_INACTIVE,    http_status: 422, applies_to: "POST /sites/{id}/hot-work-permits/{permit_id}/start" }
  - { priority: 11, category: business_safety,       check: "Fire watch period has fully elapsed since valid_to before close",                               error_id: ERR_FIRE_WATCH_INCOMPLETE,     http_status: 422, applies_to: "POST /sites/{id}/hot-work-permits/{permit_id}/close" }
  - { priority: 12, category: business_safety,       check: "No overlapping HotWorkPermit already IN_PROGRESS on same Site (interval overlap)",              error_id: ERR_PERMIT_OVERLAP,            http_status: 422, applies_to: "POST /sites/{id}/hot-work-permits/{permit_id}/start" }
  - { priority: 13, category: business_safety,       check: "At least one combustible DustSample linked before DHA approve",                                 error_id: ERR_NO_COMBUSTIBLE_DUST,       http_status: 422, applies_to: "POST /sites/{id}/dhas/{dha_id}/approve" }
  - { priority: 14, category: business_safety,       check: "Segregation of duties: DHA.approver != DHA.author; Incident lead != related hot-work issuer; Housekeeping auditor != program creator", error_id: ERR_SOD_VIOLATION, http_status: 422, applies_to: "POST .../dhas/{id}/approve, POST .../incidents/{id}/start_investigation, POST .../audits/{id}/record" }
  - { priority: 15, category: business_constraint,   check: "Permit window length: valid_to > valid_from AND valid_to <= valid_from + 24h",                  error_id: ERR_PERMIT_WINDOW_INVALID,     http_status: 422, applies_to: "POST /sites/{id}/hot-work-permits" }
  - { priority: 16, category: business_constraint,   check: "Permit fire_watch_minutes_after >= 30",                                                          error_id: ERR_FIRE_WATCH_TOO_SHORT,      http_status: 422, applies_to: "POST /sites/{id}/hot-work-permits" }
  - { priority: 17, category: business_constraint,   check: "Housekeeping audit not yet due (scheduled_for <= current clock) when transitioning SCHEDULED -> RECORDED", error_id: ERR_AUDIT_NOT_DUE, http_status: 422, applies_to: "POST /sites/{id}/housekeeping-programs/{program_id}/audits/{audit_id}/record" }
  - { priority: 18, category: business_constraint,   check: "Retrofit project has >= 1 line item before finalize_estimate",                                  error_id: ERR_PROJECT_EMPTY,             http_status: 422, applies_to: "POST /sites/{id}/retrofit-projects/{project_id}/finalize_estimate" }
  - { priority: 19, category: business_constraint,   check: "Incident has >= 1 CAPAAction before define_capa",                                                error_id: ERR_CAPA_REQUIRED,             http_status: 422, applies_to: "POST /sites/{id}/incidents/{incident_id}/define_capa" }
  - { priority: 20, category: business_constraint,   check: "Incident root_cause_code != UNKNOWN before define_capa",                                          error_id: ERR_ROOT_CAUSE_REQUIRED,       http_status: 422, applies_to: "POST /sites/{id}/incidents/{incident_id}/define_capa" }
  - { priority: 21, category: business_constraint,   check: "Incident capa_open_count == 0 before close",                                                      error_id: ERR_CAPA_OPEN,                 http_status: 422, applies_to: "POST /sites/{id}/incidents/{incident_id}/close" }
  - { priority: 22, category: business_referential,  check: "RetrofitProject.trigger_finding_id points to a CRITICAL InspectionFinding not yet VERIFIED/WITHDRAWN before approve", error_id: ERR_TRIGGER_FINDING_INVALID, http_status: 422, applies_to: "POST /sites/{id}/retrofit-projects/{project_id}/approve" }
  - { priority: 23, category: business_referential,  check: "RetrofitProject.trigger_finding_id is VERIFIED before project close",                             error_id: ERR_TRIGGER_FINDING_OPEN,      http_status: 422, applies_to: "POST /sites/{id}/retrofit-projects/{project_id}/close" }
  - { priority: 24, category: business_referential,  check: "Collector has no OPEN/IN_PROGRESS InspectionFinding referencing it before decommission",          error_id: ERR_COLLECTOR_HAS_OPEN_FINDING, http_status: 422, applies_to: "POST /sites/{id}/collectors/{collector_id}/decommission" }
  - { priority: 25, category: business_referential,  check: "Collector has no ISSUED/IN_PROGRESS HotWorkPermit referencing it before take_out_of_service",     error_id: ERR_COLLECTOR_BUSY,            http_status: 422, applies_to: "POST /sites/{id}/collectors/{collector_id}/take_out_of_service" }
  - { priority: 26, category: business_fiscal,       check: "RetrofitProject.total_projected_cents <= scope_budget_cents on finalize_estimate",                error_id: ERR_BUDGET_EXCEEDED,           http_status: 422, applies_to: "POST /sites/{id}/retrofit-projects/{project_id}/finalize_estimate" }
  - { priority: 27, category: business_constraint,   check: "OCC: expected_<parent>_version matches parent's current version",                                  error_id: ERR_STALE_VERSION,             http_status: 412, applies_to: "POST /sites/{id}/dhas/{dha_id}/approve, POST /sites/{id}/retrofit-projects/{project_id}/finalize_estimate" }
  - { priority: 28, category: business_constraint,   check: "Required input fields present; enum values in declared sets; numeric ranges respected",           error_id: ERR_INVALID_REQUEST,           http_status: 400, applies_to: "all mutating endpoints" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Site -----
  - { method: POST,   path: "/api/sites",                                                                          roles: [PlatformAdmin],                                          code: 201, input: [name, address, ahj_authority, insurer_id],                                                    output: Site,                    side_effects: ["Site initialized with posture=CONDITIONAL"] }
  - { method: GET,    path: "/api/sites",                                                                          roles: [PlatformAdmin, ComplianceManager, ComplianceEngineer, SafetyManager, HousekeepingAuditor, IncidentInvestigator, InspectorUser], code: 200, input: ["limit?", "offset?", "posture?"], output: "Site[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}",                                                                roles: [PlatformAdmin, ComplianceManager, ComplianceEngineer, SafetyManager, HousekeepingAuditor, IncidentInvestigator, InspectorUser], code: 200, input: [], output: Site, side_effects: [] }
  - { method: PATCH,  path: "/api/sites/{id}",                                                                roles: [PlatformAdmin, ComplianceManager],                          code: 200, input: ["name?", "address?", "ahj_authority?", "insurer_id?"], output: Site, side_effects: ["increments Site.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/recompute_posture",                                              roles: [PlatformAdmin, ComplianceManager],                          code: 200, input: [], output: Site, side_effects: ["run site_posture_derivation; increments Site.version by 1"] }

  # ----- DustSample -----
  - { method: POST,   path: "/api/sites/{id}/dust-samples",                                                   roles: [ComplianceEngineer],                                        code: 201, input: [material_name, kst_bar_m_per_s, pmax_bar_g, mie_mj, lab_report_ref], output: DustSample, side_effects: ["run kst_classify"] }
  - { method: GET,    path: "/api/sites/{id}/dust-samples",                                                   roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: ["limit?", "offset?", "sample_class?", "site_id?"], output: "DustSample[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/dust-samples/{sample_id}",                                              roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: [], output: DustSample, side_effects: [] }
  - { method: PATCH,  path: "/api/sites/{id}/dust-samples/{sample_id}",                                              roles: [ComplianceEngineer],                                        code: 200, input: ["material_name?", "kst_bar_m_per_s?", "pmax_bar_g?", "mie_mj?", "lab_report_ref?"], output: DustSample, side_effects: ["run kst_classify; for each Collector referencing this sample recompute explosion_protection_design; for each DHA linking this sample recompute dha_kst_rollup and dha_risk_score"] }

  # ----- Collector -----
  - { method: POST,   path: "/api/sites/{id}/collectors",                                                     roles: [ComplianceEngineer],                                        code: 201, input: [tag, dust_sample_id, design_airflow_acfm, filter_area_ft2, internal_volume_m3, "installed_vent_area_m2?"], output: Collector, side_effects: ["run explosion_protection_design"] }
  - { method: GET,    path: "/api/sites/{id}/collectors",                                                     roles: [ComplianceEngineer, ComplianceManager, InspectorUser, SafetyManager], code: 200, input: ["limit?", "offset?", "status?", "dust_sample_id?", "site_id?"], output: "Collector[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/collectors/{collector_id}",                                                roles: [ComplianceEngineer, ComplianceManager, InspectorUser, SafetyManager], code: 200, input: [], output: Collector, side_effects: [] }
  - { method: PATCH,  path: "/api/sites/{id}/collectors/{collector_id}",                                                roles: [ComplianceEngineer],                                        code: 200, input: ["tag?", "dust_sample_id?", "design_airflow_acfm?", "filter_area_ft2?", "internal_volume_m3?", "installed_vent_area_m2?"], output: Collector, side_effects: ["run explosion_protection_design; increments Collector.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/collectors/{collector_id}/commission",                                     roles: [ComplianceEngineer],                                        code: 200, input: [], output: Collector, side_effects: ["DRAFT->IN_SERVICE; recompute Site.posture; increments Site.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/collectors/{collector_id}/take_out_of_service",                            roles: [ComplianceEngineer],                                        code: 200, input: [], output: Collector, side_effects: ["IN_SERVICE->OUT_OF_SERVICE; may auto-create MAJOR InspectionFinding; recompute Site.posture; increments Site.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/collectors/{collector_id}/return_to_service",                              roles: [ComplianceEngineer],                                        code: 200, input: [], output: Collector, side_effects: ["OUT_OF_SERVICE->IN_SERVICE; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/collectors/{collector_id}/decommission",                                   roles: [ComplianceManager],                                         code: 200, input: [], output: Collector, side_effects: ["OUT_OF_SERVICE->DECOMMISSIONED; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/collectors/{collector_id}/dp-readings",                                    roles: [ComplianceEngineer, HousekeepingAuditor],                   code: 201, input: [dp_inwc], output: Collector, side_effects: ["append DPReading; run dp_trend_derivation; increments Collector.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/collectors/{collector_id}/record_filter_change",                           roles: [ComplianceEngineer],                                        code: 200, input: [], output: Collector, side_effects: ["set last_filter_change_at = current clock; reset dp_current_inwc=0; filter_change_due=false; increments Collector.version by 1"] }

  # ----- DHA -----
  - { method: POST,   path: "/api/sites/{id}/dhas",                                                           roles: [ComplianceEngineer],                                        code: 201, input: [title, author_id], output: DHA, side_effects: ["run dha_kst_rollup and dha_risk_score"] }
  - { method: GET,    path: "/api/sites/{id}/dhas",                                                           roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: ["limit?", "offset?", "status?", "site_id?"], output: "DHA[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/dhas/{dha_id}",                                                      roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: [], output: DHA, side_effects: [] }
  - { method: POST,   path: "/api/sites/{id}/dhas/{dha_id}/samples/{sample_id}",                                  roles: [ComplianceEngineer],                                        code: 200, input: [], output: DHA, side_effects: ["link DustSample; run dha_kst_rollup and dha_risk_score"] }
  - { method: DELETE, path: "/api/sites/{id}/dhas/{dha_id}/samples/{sample_id}",                                  roles: [ComplianceEngineer],                                        code: 200, input: [], output: DHA, side_effects: ["unlink; run dha_kst_rollup and dha_risk_score"] }
  - { method: POST,   path: "/api/sites/{id}/dhas/{dha_id}/submit",                                               roles: [ComplianceEngineer],                                        code: 200, input: [], output: DHA, side_effects: ["DRAFT->SUBMITTED"] }
  - { method: POST,   path: "/api/sites/{id}/dhas/{dha_id}/approve",                                              roles: [ComplianceManager],                                         code: 200, input: [expected_site_version], output: DHA, side_effects: ["SUBMITTED->APPROVED; supersede prior APPROVED DHA on Site; set Site.last_dha_id; recompute Site.posture; increments Site.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/dhas/{dha_id}/reject",                                               roles: [ComplianceManager],                                         code: 200, input: [], output: DHA, side_effects: ["SUBMITTED->REJECTED"] }
  - { method: POST,   path: "/api/sites/{id}/dhas/{dha_id}/revise",                                               roles: [ComplianceEngineer],                                        code: 200, input: [], output: DHA, side_effects: ["REJECTED->DRAFT"] }

  # ----- HousekeepingProgram -----
  - { method: POST,   path: "/api/sites/{id}/housekeeping-programs",                                          roles: [ComplianceEngineer, ComplianceManager],                     code: 201, input: [name, target_accumulation_g_per_m2, frequency_hours], output: HousekeepingProgram, side_effects: ["run housekeeping_schedule"] }
  - { method: GET,    path: "/api/sites/{id}/housekeeping-programs",                                          roles: [ComplianceEngineer, ComplianceManager, HousekeepingAuditor, InspectorUser], code: 200, input: ["limit?", "offset?", "current_posture?", "site_id?"], output: "HousekeepingProgram[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/housekeeping-programs/{program_id}",                                     roles: [ComplianceEngineer, ComplianceManager, HousekeepingAuditor, InspectorUser], code: 200, input: [], output: HousekeepingProgram, side_effects: [] }

  # ----- HousekeepingAudit -----
  - { method: POST,   path: "/api/sites/{id}/housekeeping-programs/{program_id}/audits",                             roles: [HousekeepingAuditor],                                       code: 201, input: [auditor_id, measured_accumulation_g_per_m2, scheduled_for], output: HousekeepingAudit, side_effects: ["capture pass_threshold_g_per_m2 snapshot"] }
  - { method: GET,    path: "/api/sites/{id}/housekeeping-programs/{program_id}/audits",                             roles: [ComplianceEngineer, ComplianceManager, HousekeepingAuditor, InspectorUser], code: 200, input: ["limit?", "offset?", "status?", "site_id?", "program_id?"], output: "HousekeepingAudit[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/housekeeping-programs/{program_id}/audits/{audit_id}",                        roles: [ComplianceEngineer, ComplianceManager, HousekeepingAuditor, InspectorUser], code: 200, input: [], output: HousekeepingAudit, side_effects: [] }
  - { method: POST,   path: "/api/sites/{id}/housekeeping-programs/{program_id}/audits/{audit_id}/record",                 roles: [HousekeepingAuditor],                                       code: 200, input: [], output: HousekeepingAudit, side_effects: ["SCHEDULED->RECORDED or OVERDUE->RECORDED; may auto-create InspectionFinding; recompute Site.posture; increments Site.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/housekeeping-programs/{program_id}/audits/{audit_id}/skip",                   roles: [HousekeepingAuditor],                                       code: 200, input: [], output: HousekeepingAudit, side_effects: ["SCHEDULED->SKIPPED"] }

  # ----- HotWorkPermit -----
  - { method: POST,   path: "/api/sites/{id}/hot-work-permits",                                               roles: [SafetyManager],                                             code: 201, input: ["collector_id?", work_description, issuer_id, performer_id, valid_from, valid_to, fire_watch_minutes_after], output: HotWorkPermit, side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/hot-work-permits",                                               roles: [SafetyManager, ComplianceManager, ComplianceEngineer, HotWorkPerformer, InspectorUser], code: 200, input: ["limit?", "offset?", "status?", "collector_id?", "site_id?"], output: "HotWorkPermit[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/hot-work-permits/{permit_id}",                                          roles: [SafetyManager, ComplianceManager, ComplianceEngineer, HotWorkPerformer, InspectorUser], code: 200, input: [], output: HotWorkPermit, side_effects: [] }
  - { method: POST,   path: "/api/sites/{id}/hot-work-permits/{permit_id}/start",                                    roles: [HotWorkPerformer],                                          code: 200, input: [], output: HotWorkPermit, side_effects: ["ISSUED->IN_PROGRESS; increments Site.hot_work_in_progress; recompute Site.posture; increments Site.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/hot-work-permits/{permit_id}/close",                                    roles: [HotWorkPerformer],                                          code: 200, input: [], output: HotWorkPermit, side_effects: ["IN_PROGRESS->CLOSED; decrements Site.hot_work_in_progress; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/hot-work-permits/{permit_id}/void",                                     roles: [SafetyManager],                                             code: 200, input: [], output: HotWorkPermit, side_effects: ["ISSUED->VOIDED"] }

  # ----- Inspection / Finding -----
  - { method: POST,   path: "/api/sites/{id}/inspections",                                                    roles: [InspectorUser],                                             code: 201, input: [inspector_kind, inspector_ref, conducted_at], output: Inspection, side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/inspections",                                                    roles: [InspectorUser, ComplianceManager, ComplianceEngineer],       code: 200, input: ["limit?", "offset?", "status?", "inspector_kind?", "site_id?"], output: "Inspection[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/inspections/{inspection_id}",                                               roles: [InspectorUser, ComplianceManager, ComplianceEngineer],       code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/submit",                                        roles: [InspectorUser],                                             code: 200, input: [], output: Inspection, side_effects: ["OPEN->SUBMITTED"] }
  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/accept",                                        roles: [ComplianceManager],                                         code: 200, input: [], output: Inspection, side_effects: ["SUBMITTED->ACCEPTED; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/reject",                                        roles: [ComplianceManager],                                         code: 200, input: [], output: Inspection, side_effects: ["SUBMITTED->REJECTED; cascade OPEN/IN_PROGRESS findings to DISPUTED"] }

  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/findings",                                     roles: [InspectorUser],                                             code: 201, input: ["collector_id?", severity, description, due_at], output: InspectionFinding, side_effects: ["if severity==CRITICAL increment Site.open_critical_findings; recompute Site.posture; increments Site.version by 1"] }
  - { method: GET,    path: "/api/sites/{id}/inspections/{inspection_id}/findings",                                     roles: [InspectorUser, ComplianceManager, ComplianceEngineer],       code: 200, input: ["limit?", "offset?", "status?", "severity?", "site_id?", "inspection_id?", "collector_id?"], output: "InspectionFinding[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/inspections/{inspection_id}/findings/{finding_id}",                                roles: [InspectorUser, ComplianceManager, ComplianceEngineer],       code: 200, input: [], output: InspectionFinding, side_effects: [] }
  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/findings/{finding_id}/start_work",                     roles: [ComplianceEngineer],                                        code: 200, input: [], output: InspectionFinding, side_effects: ["OPEN->IN_PROGRESS or REOPENED->IN_PROGRESS"] }
  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/findings/{finding_id}/resolve",                        roles: [ComplianceEngineer],                                        code: 200, input: [], output: InspectionFinding, side_effects: ["IN_PROGRESS->RESOLVED; if CRITICAL decrement Site.open_critical_findings; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/findings/{finding_id}/verify",                         roles: [ComplianceManager],                                         code: 200, input: [], output: InspectionFinding, side_effects: ["RESOLVED->VERIFIED"] }
  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/findings/{finding_id}/reopen",                         roles: [ComplianceManager],                                         code: 200, input: [], output: InspectionFinding, side_effects: ["RESOLVED->REOPENED; if CRITICAL increment Site.open_critical_findings; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/findings/{finding_id}/dispute",                        roles: [ComplianceEngineer],                                        code: 200, input: [], output: InspectionFinding, side_effects: ["OPEN->DISPUTED; if CRITICAL decrement Site.open_critical_findings; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/inspections/{inspection_id}/findings/{finding_id}/withdraw",                       roles: [InspectorUser],                                             code: 200, input: [], output: InspectionFinding, side_effects: ["DISPUTED->WITHDRAWN"] }

  # ----- RetrofitProject / LineItem -----
  - { method: POST,   path: "/api/sites/{id}/retrofit-projects",                                              roles: [ComplianceEngineer],                                        code: 201, input: [name, trigger_finding_id, scope_budget_cents], output: RetrofitProject, side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/retrofit-projects",                                              roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: ["limit?", "offset?", "status?", "site_id?", "trigger_finding_id?"], output: "RetrofitProject[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/retrofit-projects/{project_id}",                                         roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: [], output: RetrofitProject, side_effects: [] }
  - { method: POST,   path: "/api/sites/{id}/retrofit-projects/{project_id}/line-items",                              roles: [ComplianceEngineer],                                        code: 201, input: [description, cost_cents, risk_tier], output: RetrofitLineItem, side_effects: ["run retrofit_contingency; increments RetrofitProject.version by 1"] }
  - { method: GET,    path: "/api/sites/{id}/retrofit-projects/{project_id}/line-items",                              roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: ["limit?", "offset?", "risk_tier?", "site_id?", "project_id?"], output: "RetrofitLineItem[]", side_effects: [] }
  - { method: PATCH,  path: "/api/sites/{id}/retrofit-projects/{project_id}/line-items/{line_item_id}",                        roles: [ComplianceEngineer],                                        code: 200, input: ["description?", "cost_cents?", "risk_tier?"], output: RetrofitLineItem, side_effects: ["run retrofit_contingency; increments RetrofitProject.version by 1"] }
  - { method: DELETE, path: "/api/sites/{id}/retrofit-projects/{project_id}/line-items/{line_item_id}",                        roles: [ComplianceEngineer],                                        code: 204, input: [], output: null, side_effects: ["run retrofit_contingency; increments RetrofitProject.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/retrofit-projects/{project_id}/finalize_estimate",                       roles: [ComplianceEngineer],                                        code: 200, input: [expected_project_version], output: RetrofitProject, side_effects: ["SCOPING->ESTIMATED; run retrofit_contingency; increments RetrofitProject.version by 1"] }
  - { method: POST,   path: "/api/sites/{id}/retrofit-projects/{project_id}/approve",                                 roles: [ComplianceManager],                                         code: 200, input: [], output: RetrofitProject, side_effects: ["ESTIMATED->APPROVED; trigger InspectionFinding OPEN->IN_PROGRESS if applicable; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/retrofit-projects/{project_id}/start_execution",                         roles: [ComplianceEngineer],                                        code: 200, input: [], output: RetrofitProject, side_effects: ["APPROVED->IN_EXECUTION"] }
  - { method: POST,   path: "/api/sites/{id}/retrofit-projects/{project_id}/close",                                   roles: [ComplianceManager],                                         code: 200, input: [], output: RetrofitProject, side_effects: ["IN_EXECUTION->CLOSED; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/retrofit-projects/{project_id}/cancel",                                  roles: [ComplianceManager],                                         code: 200, input: [], output: RetrofitProject, side_effects: ["SCOPING/ESTIMATED -> CANCELLED"] }

  # ----- Incident / CAPA -----
  - { method: POST,   path: "/api/sites/{id}/incidents",                                                      roles: [ComplianceManager, SafetyManager],                          code: 201, input: [occurred_at, "collector_id?", kind, description, severity, root_cause_code, investigation_lead_id], output: Incident, side_effects: ["recompute Site.posture; increments Site.version by 1"] }
  - { method: GET,    path: "/api/sites/{id}/incidents",                                                      roles: [ComplianceManager, ComplianceEngineer, IncidentInvestigator, SafetyManager, InspectorUser], code: 200, input: ["limit?", "offset?", "status?", "severity?", "collector_id?", "site_id?"], output: "Incident[]", side_effects: [] }
  - { method: GET,    path: "/api/sites/{id}/incidents/{incident_id}",                                                 roles: [ComplianceManager, ComplianceEngineer, IncidentInvestigator, SafetyManager, InspectorUser], code: 200, input: [], output: Incident, side_effects: [] }
  - { method: POST,   path: "/api/sites/{id}/incidents/{incident_id}/start_investigation",                             roles: [IncidentInvestigator],                                      code: 200, input: [], output: Incident, side_effects: ["OPEN->INVESTIGATING or REOPENED->INVESTIGATING"] }
  - { method: POST,   path: "/api/sites/{id}/incidents/{incident_id}/define_capa",                                     roles: [IncidentInvestigator],                                      code: 200, input: [], output: Incident, side_effects: ["INVESTIGATING->CAPA_DEFINED"] }
  - { method: POST,   path: "/api/sites/{id}/incidents/{incident_id}/close",                                           roles: [ComplianceManager],                                         code: 200, input: [], output: Incident, side_effects: ["CAPA_DEFINED->CLOSED; recompute Site.posture"] }
  - { method: POST,   path: "/api/sites/{id}/incidents/{incident_id}/reopen",                                          roles: [ComplianceManager],                                         code: 200, input: [], output: Incident, side_effects: ["CLOSED->REOPENED; recompute Site.posture"] }

  - { method: POST,   path: "/api/sites/{id}/incidents/{incident_id}/capa-actions",                                   roles: [IncidentInvestigator],                                      code: 201, input: [description, owner_id, due_at], output: CAPAAction, side_effects: ["increment Incident.capa_count and capa_open_count by 1"] }
  - { method: GET,    path: "/api/sites/{id}/incidents/{incident_id}/capa-actions",                                   roles: [IncidentInvestigator, ComplianceManager, ComplianceEngineer], code: 200, input: ["limit?", "offset?", "status?", "site_id?", "incident_id?"], output: "CAPAAction[]", side_effects: [] }
  - { method: POST,   path: "/api/sites/{id}/incidents/{incident_id}/capa-actions/{capa_id}/start",                        roles: [IncidentInvestigator],                                      code: 200, input: [], output: CAPAAction, side_effects: ["OPEN->IN_PROGRESS"] }
  - { method: POST,   path: "/api/sites/{id}/incidents/{incident_id}/capa-actions/{capa_id}/close",                        roles: [IncidentInvestigator],                                      code: 200, input: [], output: CAPAAction, side_effects: ["IN_PROGRESS->CLOSED or OVERDUE->CLOSED; decrement Incident.capa_open_count by 1; recompute Site.posture"] }

  # ----- Test-driving (logical clock) -----
  - { method: POST,   path: "/_clock/set_current_utc",                                                         roles: [PlatformAdmin],                                             code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["advances the logical clock; triggers system auto-transitions (CAPA OVERDUE, HotWorkPermit EXPIRED, HousekeepingAudit OVERDUE); server start default is 2026-05-01T00:00:00Z until set"] }

  # ----- Flat parent single-resource GETs (for lint FK sub-resource detection) -----
  - { method: GET,    path: "/api/dust-samples/{id}",                                                          roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: [], output: DustSample, side_effects: [] }
  - { method: GET,    path: "/api/collectors/{id}",                                                            roles: [ComplianceEngineer, ComplianceManager, InspectorUser, SafetyManager], code: 200, input: [], output: Collector, side_effects: [] }
  - { method: GET,    path: "/api/housekeeping-programs/{id}",                                                 roles: [ComplianceEngineer, ComplianceManager, HousekeepingAuditor, InspectorUser], code: 200, input: [], output: HousekeepingProgram, side_effects: [] }
  - { method: GET,    path: "/api/inspections/{id}",                                                           roles: [InspectorUser, ComplianceManager, ComplianceEngineer],       code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: GET,    path: "/api/inspection-findings/{id}",                                                   roles: [InspectorUser, ComplianceManager, ComplianceEngineer],       code: 200, input: [], output: InspectionFinding, side_effects: [] }
  - { method: GET,    path: "/api/retrofit-projects/{id}",                                                     roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: [], output: RetrofitProject, side_effects: [] }
  - { method: GET,    path: "/api/incidents/{id}",                                                             roles: [ComplianceManager, ComplianceEngineer, IncidentInvestigator, SafetyManager, InspectorUser], code: 200, input: [], output: Incident, side_effects: [] }

  # ----- Sub-resource GETs for cross-FK reverse reachability -----
  - { method: GET,    path: "/api/dust-samples/{id}/collectors",                                               roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: ["limit?", "offset?"], output: "Collector[]", side_effects: [] }
  - { method: GET,    path: "/api/housekeeping-programs/{id}/audits",                                          roles: [ComplianceEngineer, ComplianceManager, HousekeepingAuditor, InspectorUser], code: 200, input: ["limit?", "offset?"], output: "HousekeepingAudit[]", side_effects: [] }
  - { method: GET,    path: "/api/collectors/{id}/hot-work-permits",                                           roles: [SafetyManager, ComplianceManager, ComplianceEngineer, HotWorkPerformer, InspectorUser], code: 200, input: ["limit?", "offset?"], output: "HotWorkPermit[]", side_effects: [] }
  - { method: GET,    path: "/api/collectors/{id}/incidents",                                                  roles: [ComplianceManager, ComplianceEngineer, IncidentInvestigator, SafetyManager, InspectorUser], code: 200, input: ["limit?", "offset?"], output: "Incident[]", side_effects: [] }
  - { method: GET,    path: "/api/collectors/{id}/inspection-findings",                                        roles: [InspectorUser, ComplianceManager, ComplianceEngineer],       code: 200, input: ["limit?", "offset?"], output: "InspectionFinding[]", side_effects: [] }
  - { method: GET,    path: "/api/inspections/{id}/findings",                                                  roles: [InspectorUser, ComplianceManager, ComplianceEngineer],       code: 200, input: ["limit?", "offset?"], output: "InspectionFinding[]", side_effects: [] }
  - { method: GET,    path: "/api/inspection-findings/{id}/retrofit-projects",                                 roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: ["limit?", "offset?"], output: "RetrofitProject[]", side_effects: [] }
  - { method: GET,    path: "/api/retrofit-projects/{id}/line-items",                                          roles: [ComplianceEngineer, ComplianceManager, InspectorUser],       code: 200, input: ["limit?", "offset?"], output: "RetrofitLineItem[]", side_effects: [] }
  - { method: GET,    path: "/api/incidents/{id}/capa-actions",                                                roles: [IncidentInvestigator, ComplianceManager, ComplianceEngineer], code: 200, input: ["limit?", "offset?"], output: "CAPAAction[]", side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "Missing or invalid auth headers" }
  - { id: ERR_UNAUTHORIZED,             http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND,                http: 404, condition: "Path id or required body FK does not resolve" }
  - { id: ERR_INVALID_REQUEST,          http: 400, condition: "Missing/invalid required input field, bad enum, or numeric range violation" }
  - { id: ERR_INVALID_STATE,            http: 409, condition: "State machine forbids the requested transition from the current state" }
  - { id: ERR_STALE_VERSION,            http: 412, condition: "expected_<parent>_version does not match parent's current version (OCC)" }
  - { id: ERR_POSTURE_STOP_WORK,        http: 409, condition: "Site.posture == STOP_WORK blocks the requested state transition" }
  - { id: ERR_VENT_UNDERSIZED,          http: 422, condition: "Collector.installed_vent_area_m2 < required_vent_area_m2 at commission" }
  - { id: ERR_FILTER_CHANGE_REQUIRED,   http: 422, condition: "Collector.filter_change_due == true at return_to_service" }
  - { id: ERR_COLLECTOR_BUSY,           http: 422, condition: "An ISSUED/IN_PROGRESS HotWorkPermit references this collector" }
  - { id: ERR_COLLECTOR_HAS_OPEN_FINDING, http: 422, condition: "An OPEN/IN_PROGRESS InspectionFinding references this collector at decommission" }
  - { id: ERR_PERMIT_WINDOW_INVALID,    http: 422, condition: "valid_to <= valid_from OR window > 24h at permit issue" }
  - { id: ERR_PERMIT_WINDOW_INACTIVE,   http: 422, condition: "current clock outside [valid_from, valid_to) at start" }
  - { id: ERR_PERMIT_OVERLAP,           http: 422, condition: "Another permit already IN_PROGRESS with overlapping window on same Site" }
  - { id: ERR_FIRE_WATCH_TOO_SHORT,     http: 422, condition: "fire_watch_minutes_after < 30 at permit issue" }
  - { id: ERR_FIRE_WATCH_INCOMPLETE,    http: 422, condition: "current clock < valid_to + fire_watch_minutes_after at close" }
  - { id: ERR_NO_COMBUSTIBLE_DUST,      http: 422, condition: "DHA approve attempted with no combustible DustSample linked" }
  - { id: ERR_SOD_VIOLATION,            http: 422, condition: "Segregation-of-duties: same X-User-ID attempted two exclusive steps" }
  - { id: ERR_AUDIT_NOT_DUE,            http: 422, condition: "HousekeepingAudit.scheduled_for is in the future relative to current clock" }
  - { id: ERR_PROJECT_EMPTY,            http: 422, condition: "RetrofitProject.finalize_estimate attempted with zero line items" }
  - { id: ERR_BUDGET_EXCEEDED,          http: 422, condition: "total_projected_cents > scope_budget_cents at finalize_estimate" }
  - { id: ERR_TRIGGER_FINDING_INVALID,  http: 422, condition: "RetrofitProject.trigger_finding_id is not a CRITICAL finding in OPEN/IN_PROGRESS/RESOLVED at approve" }
  - { id: ERR_TRIGGER_FINDING_OPEN,     http: 422, condition: "RetrofitProject.trigger_finding_id is not VERIFIED at project close" }
  - { id: ERR_CAPA_REQUIRED,            http: 422, condition: "Incident.define_capa attempted with zero CAPAAction rows" }
  - { id: ERR_ROOT_CAUSE_REQUIRED,      http: 422, condition: "Incident.define_capa attempted while root_cause_code == UNKNOWN" }
  - { id: ERR_CAPA_OPEN,                http: 422, condition: "Incident.close attempted while capa_open_count > 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Site bootstrapper and clock operator; not involved in day-to-day compliance"
    identity: opaque
    exclusive_operations: ["POST /sites", "POST /_clock/set_current_utc", "POST /sites/{id}/recompute_posture"]
    shared_operations: ["GET /sites", "GET /sites/{id}", "PATCH /sites/{id}"]

  - name: ComplianceManager
    description: "Approves DHAs, verifies findings, approves retrofit projects, closes incidents"
    identity: opaque
    exclusive_operations: [
      "POST /sites/{id}/dhas/{id}/approve",
      "POST /sites/{id}/dhas/{id}/reject",
      "POST /sites/{id}/inspections/{id}/accept",
      "POST /sites/{id}/inspections/{id}/reject",
      "POST /sites/{id}/inspections/{iid}/findings/{id}/verify",
      "POST /sites/{id}/inspections/{iid}/findings/{id}/reopen",
      "POST /sites/{id}/retrofit-projects/{id}/approve",
      "POST /sites/{id}/retrofit-projects/{id}/close",
      "POST /sites/{id}/retrofit-projects/{id}/cancel",
      "POST /sites/{id}/collectors/{id}/decommission",
      "POST /sites/{id}/incidents",
      "POST /sites/{id}/incidents/{id}/close",
      "POST /sites/{id}/incidents/{id}/reopen"
    ]
    shared_operations: ["GET reads across all resources", "POST /sites/{id}/housekeeping-programs"]

  - name: ComplianceEngineer
    description: "Authors DHAs, registers dust samples and collectors, performs engineering actions"
    identity: opaque
    exclusive_operations: [
      "POST /sites/{id}/dust-samples",
      "PATCH /sites/{id}/dust-samples/{id}",
      "POST /sites/{id}/collectors",
      "PATCH /sites/{id}/collectors/{id}",
      "POST /sites/{id}/collectors/{id}/commission",
      "POST /sites/{id}/collectors/{id}/take_out_of_service",
      "POST /sites/{id}/collectors/{id}/return_to_service",
      "POST /sites/{id}/collectors/{id}/record_filter_change",
      "POST /sites/{id}/dhas",
      "POST /sites/{id}/dhas/{id}/submit",
      "POST /sites/{id}/dhas/{id}/revise",
      "POST /sites/{id}/dhas/{id}/samples/{sample_id}",
      "DELETE /sites/{id}/dhas/{id}/samples/{sample_id}",
      "POST /sites/{id}/inspections/{iid}/findings/{id}/start_work",
      "POST /sites/{id}/inspections/{iid}/findings/{id}/resolve",
      "POST /sites/{id}/inspections/{iid}/findings/{id}/dispute",
      "POST /sites/{id}/retrofit-projects",
      "POST /sites/{id}/retrofit-projects/{id}/line-items",
      "PATCH /sites/{id}/retrofit-projects/{id}/line-items/{lid}",
      "DELETE /sites/{id}/retrofit-projects/{id}/line-items/{lid}",
      "POST /sites/{id}/retrofit-projects/{id}/finalize_estimate",
      "POST /sites/{id}/retrofit-projects/{id}/start_execution"
    ]
    shared_operations: ["GET reads across all resources", "POST /sites/{id}/housekeeping-programs", "POST /sites/{id}/collectors/{id}/dp-readings"]

  - name: SafetyManager
    description: "Issues and voids hot-work permits; can also declare incidents"
    identity: opaque
    exclusive_operations: [
      "POST /sites/{id}/hot-work-permits",
      "POST /sites/{id}/hot-work-permits/{id}/void"
    ]
    shared_operations: ["GET reads on collectors/permits/incidents", "POST /sites/{id}/incidents"]

  - name: HotWorkPerformer
    description: "Starts and closes hot-work permits under a valid permit"
    identity: opaque
    exclusive_operations: [
      "POST /sites/{id}/hot-work-permits/{id}/start",
      "POST /sites/{id}/hot-work-permits/{id}/close"
    ]
    shared_operations: ["GET /sites/{id}/hot-work-permits", "GET /sites/{id}/hot-work-permits/{id}"]

  - name: HousekeepingAuditor
    description: "Schedules and records housekeeping audits"
    identity: opaque
    exclusive_operations: [
      "POST /sites/{id}/housekeeping-programs/{pid}/audits",
      "POST /sites/{id}/housekeeping-programs/{pid}/audits/{id}/record",
      "POST /sites/{id}/housekeeping-programs/{pid}/audits/{id}/skip"
    ]
    shared_operations: ["GET reads on programs/audits", "POST /sites/{id}/collectors/{id}/dp-readings"]

  - name: InspectorUser
    description: "External AHJ/insurer inspector; files inspections and findings"
    identity: opaque
    exclusive_operations: [
      "POST /sites/{id}/inspections",
      "POST /sites/{id}/inspections/{id}/submit",
      "POST /sites/{id}/inspections/{iid}/findings",
      "POST /sites/{id}/inspections/{iid}/findings/{id}/withdraw"
    ]
    shared_operations: ["GET reads across all resources"]

  - name: IncidentInvestigator
    description: "Leads incident investigations and authors CAPA actions"
    identity: opaque
    exclusive_operations: [
      "POST /sites/{id}/incidents/{id}/start_investigation",
      "POST /sites/{id}/incidents/{id}/define_capa",
      "POST /sites/{id}/incidents/{iid}/capa-actions",
      "POST /sites/{id}/incidents/{iid}/capa-actions/{id}/start",
      "POST /sites/{id}/incidents/{iid}/capa-actions/{id}/close"
    ]
    shared_operations: ["GET reads on incidents/capa-actions/collectors"]
