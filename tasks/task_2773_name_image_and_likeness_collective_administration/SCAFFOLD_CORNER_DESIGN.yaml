      - name: monthly_billing_interval_on_major_gift_pledge_is_rejected
        claim_type: conditional_validation
        grounds: [validations.priority_40_commitment_interval_consistency, errors.ERR_BILLING_INTERVAL_MISMATCH, entities.Commitment.fields.billing_interval]
        distinguishing_aspect: "The interval rule is conditional on kind in both directions: MAJOR_GIFT_PLEDGE demands NONE and RECURRING_SUBSCRIPTION forbids it, so the same billing_interval value is legal for one kind and illegal for the other."
        test_recipe:
          setup: ["One collective with one OPEN tier and one donor whose current version is captured."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Interval Collective", institution_name: "Interval Institution", institution_ipeds_code: "023500", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Int Club", annual_dues_cents: 40000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Int Donor", email: "int@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id, donor_ver: $.data.version }
          trigger:
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "MAJOR_GIFT_PLEDGE", amount_cents: 300000, billing_interval: "MONTHLY", installments_total: 3, expected_donor_member_version: "${donor_ver}" }
              as: CollectiveDirector
              captures: { err_pledge: $.data.error_id }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "RECURRING_SUBSCRIPTION", amount_cents: 5000, billing_interval: "NONE", expected_donor_member_version: "${donor_ver}" }
              as: CollectiveDirector
              captures: { err_sub: $.data.error_id }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "RECURRING_SUBSCRIPTION", amount_cents: 5000, billing_interval: "MONTHLY", expected_donor_member_version: "${donor_ver}" }
              as: CollectiveDirector
              captures: { ok_id: $.data.id, ok_status: $.data.status, ok_interval: $.data.billing_interval }
          assert:
            - "${err_pledge} == ERR_BILLING_INTERVAL_MISMATCH"
            - "${err_sub} == ERR_BILLING_INTERVAL_MISMATCH"
            - "Both rejections return 422."
            - "Neither rejection bumped DonorMember.${donor_id}.version, which is why the third call can reuse the same ${donor_ver}."
            - "${ok_status} == ACTIVE"
            - "${ok_interval} == MONTHLY"
            - "GET /nil/commitments?donor_member_id=${donor_id} returns exactly one row."
            - "MembershipTier.${tier_id}.active_commitment_count == 1"

      - name: structure_change_limit_reached_after_two_changes
        claim_type: aggregate_validation
        grounds: [validations.priority_35_structure_change_limit, global_constants.STRUCTURE_CHANGE_LIMIT, entities.Collective.fields.structure_change_count]
        distinguishing_aspect: "Each individual entity-structure PATCH is valid; only the running structure_change_count makes the third one illegal, and the rejection must leave both the count and the stored entity_structure at their post-second-change values."
        test_recipe:
          setup:
            - "One collective created as NONPROFIT_501C3 with structure_change_count 0."
            - "Two successful changes: NONPROFIT_501C3 -> FOR_PROFIT_LLC -> DONOR_ADVISED_CONDUIT, each with the current expected_collective_version."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Limit Collective", institution_name: "Limit Institution", institution_ipeds_code: "023600", home_state_code: "CA", association_ruleset: "NCAA_2026", entity_structure: "NONPROFIT_501C3" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, ver0: $.data.version, count0: $.data.structure_change_count }
            - call: "PATCH /nil/collectives/${col_id}/entity-structure"
              payload: { entity_structure: "FOR_PROFIT_LLC", expected_collective_version: "${ver0}" }
              as: PlatformAdmin
              captures: { ver1: $.data.version, count1: $.data.structure_change_count, ded1: $.data.charitable_deduction_enabled }
            - call: "PATCH /nil/collectives/${col_id}/entity-structure"
              payload: { entity_structure: "DONOR_ADVISED_CONDUIT", expected_collective_version: "${ver1}" }
              as: PlatformAdmin
              captures: { ver2: $.data.version, count2: $.data.structure_change_count, struct2: $.data.entity_structure }
          trigger:
            - call: "PATCH /nil/collectives/${col_id}/entity-structure"
              payload: { entity_structure: "NONPROFIT_501C3", expected_collective_version: "${ver2}" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${count0} == 0"
            - "${count1} == 1"
            - "${ded1} == false"
            - "${count2} == 2"
            - "${struct2} == DONOR_ADVISED_CONDUIT"
            - "${err_id} == ERR_STRUCTURE_CHANGE_LIMIT"
            - "The response status is 422."
            - "Collective.${col_id}.entity_structure == DONOR_ADVISED_CONDUIT"
            - "Collective.${col_id}.structure_change_count == 2"
            - "Collective.${col_id}.version == ${ver2}"

