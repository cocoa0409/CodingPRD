            - call: "GET /ill/patrons/${patron_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { unpaid_1: $.data.unpaid_balance_cents, late_1: $.data.late_return_count }
          trigger:
            - call: "POST /ill/loans/${loan_id}/charge-settlements"
              payload: { action: "WAIVE" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { billing_2: $.data.billing_status, outstanding_2: $.data.outstanding_cents, paid_overdue_2: $.data.paid_overdue_cents }
            - call: "GET /ill/patrons/${patron_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { unpaid_2: $.data.unpaid_balance_cents }
          assert:
            - "${due_at} == 2026-08-08T00:00:00Z"
            - "${billing_1} == FINE_ACCRUED, ${fine_1} == 750 and ${outstanding_1} == 750 — 5 billable days at 150 cents, with no recall multiplier"
            - "${unpaid_1} == 750 and ${late_1} == 1 — the fine is mirrored into the patron ledger the moment it accrues"
            - "${billing_2} == CHARGE_WAIVED, ${outstanding_2} == 0 and ${paid_overdue_2} == 0"
            - "${unpaid_2} == 0 — the ledger reconciles downward with the loan, leaving no residue"
            - "LoanRecord.${loan_id}.custody_status == RETURN_PREPARED and recall_status == NONE — the waiver touches only the billing dimension"
            - "Patron.${patron_id}.late_return_count == 1 and final_risk_score == 6 — waiving the money does not erase the late-return infraction"

      - name: request_loops_from_offer_pending_back_to_sourcing_and_the_attempt_budget_is_respected
        claim_type: cyclic
        grounds:
          - state_machines.IllRequest.OFFER_PENDING_to_SOURCING
          - state_machines.IllRequest.ESCALATED_POD_to_SOURCING
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / request_cycles_sourcing_offer_pending_twice_then_pod_rejection_resets_attempt_budget
          rationale: "That §1.8 instance drives the SOURCING → OFFER_PENDING → SOURCING loop twice, asserts the ERR_ROTA_ATTEMPTS_EXHAUSTED termination condition at max_attempts, and asserts the POD-rejection reset of attempt_count, which is the whole cyclic claim."

      - name: loan_custody_billing_and_recall_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.LoanRecord.custody_status
          - state_machines.LoanRecord.billing_status
          - state_machines.LoanRecord.recall_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / loan_custody_billing_and_recall_dimensions_advance_independently
          rationale: "That §1.8 instance advances each of the three LoanRecord dimensions on a different trigger and asserts the combined state after every step."

      - name: lender_damage_confirmation_cascades_through_loan_charge_patron_and_standing
        claim_type: cross_entity
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_CONFIRMED_DAMAGED
          - state_machines.LoanRecord.NO_CHARGE_to_DAMAGE_BILLED
          - entities.Patron.fields.final_risk_score
        excluded_because:
          difficulty_instance: transitive_cascade / lender_damage_confirmation_cascades_five_levels_from_shipment_to_patron_block
          rationale: "That §1.8 instance asserts every level of the damage cascade end-to-end, including the notification and the patron block."

      - name: cancellation_reverses_the_commitment_side_effects_without_drift
        claim_type: compensation
        grounds:
          - state_machines.IllRequest.SUPPLY_COMMITTED_to_CANCELLED
          - entities.Partner.fields.borrow_payable_cents
        excluded_because:
          difficulty_instance: compensating_invariant / cancelling_a_committed_request_restores_partner_borrow_payable_without_drift
          rationale: "That §1.8 instance pins a baseline, commits, cancels and asserts the exact restoration of every reversed field."

      - name: offer_acceptance_is_guarded_by_the_partner_status_of_a_different_entity
        claim_type: guarded_transitions
        grounds:
          - state_machines.SupplyOffer.OFFERED_to_ACCEPTED
          - entities.Partner.fields.status
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / offer_acceptance_gate_reads_partner_status_suspended_after_the_offer_opened
          rationale: "That §1.8 instance suspends the Partner after the offer opens and asserts both the guarded refusal and the success once the guard clears."

  # ===========================================================================
  - section: calculations
    instances:

      - name: landed_cost_ranking_reorders_the_rota_once_the_day_penalty_is_applied
        claim_type: correct_result
        grounds:
          - calculations.lender_landed_cost_ranking
          - entities.SupplyOffer.fields.landed_cost_cents
          - entities.SupplyOffer.fields.effective_fee_cents
          - endpoints[POST /ill/requests/{id}/source]
        distinguishing_aspect: "With needed_by 2026-08-04 at clock 2026-08-01 the request has days_available 3, so the DAY_PENALTY_CENTS 250 term lifts the three quotes to landed costs 2250 (NORTHU 2000/4d), 2500 (WESTA 2500/2d) and 2700 (SOUTHC 1200/9d) — the cheapest quote becomes the most expensive lender and the offer goes to NORTHU."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-9020 with default caps."
            - "Three ACTIVE partners on one LOAN rota with selection_policy LANDED_COST: NORTHU quoted 2000 / 4 days (manual_rank 3), WESTA quoted 2500 / 2 days (manual_rank 2), SOUTHC quoted 1200 / 9 days (manual_rank 1)."
            - "All three partners are fresh, so net_borrow_imbalance_items is 0 for each and no IMBALANCE_PENALTY_CENTS term applies."
            - "One request with needed_by 2026-08-04 and max_supply_fee_cents 9000, so no lender is priced out."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9020", full_name: "Pat Reader", email: "pat@u.edu", patron_type: "FACULTY", department: "HIST" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "SOUTHC", name: "South Coast Library", consortium_code: "MIDWEST", base_lending_fee_cents: 1200, avg_turnaround_days: 9, ships_physical: true, supplies_electronic: false, allows_renewals: false, loan_period_days: 21, max_renewals: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { southc_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "WESTA", name: "West Annex Library", consortium_code: "WESTERN", base_lending_fee_cents: 2500, avg_turnaround_days: 2, ships_physical: true, supplies_electronic: false, allows_renewals: false, loan_period_days: 21, max_renewals: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { westa_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
