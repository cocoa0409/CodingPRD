  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submission_mark_ready_depends_on_survey_open
        grounds:
          - state_machines.SurveySubmission.DRAFT_to_READY
          - errors[ERR_SURVEY_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair: SurveySubmission → Survey. mark_ready is only valid
          when the parent Survey.status == OPEN. Closing the survey flips the
          precondition and blocks subsequent mark_ready calls.
        test_recipe:
          setup:
            - "Survey OPEN; submission S1 in DRAFT"
            - "Second submission S2 in DRAFT on the SAME survey"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Analyst", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 10000000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Subject", email: "s@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 9000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject_id}", job_id: "${job_id}", base_salary_annual_cents: 9000000, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub1_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject_id}", job_id: "${job_id}", base_salary_annual_cents: 9000000, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub2_id: $.data.id } }
          trigger:
            # While OPEN, mark_ready works
            - { call: "POST /submissions/${sub1_id}/mark_ready", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { s1_status: $.data.status } }
            # Close the survey — flips the precondition
            - { call: "POST /surveys/${survey_id}/close", payload: {}, as: VendorAdmin }
            # mark_ready on sub2 must now fail
            - { call: "POST /submissions/${sub2_id}/mark_ready", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { err: $.data.error_id } }
          assert:
            - "First mark_ready succeeded (status == READY before close)"
            - "After survey close: error_id == ERR_SURVEY_NOT_OPEN for second mark_ready"
            - "SurveySubmission.${sub2_id}.status == RETURNED (cascade from close)"

      - name: adjustment_submit_depends_on_cycle_open
        grounds:
          - state_machines.MarketAdjustment.DRAFT_to_PENDING_APPROVAL
          - errors[ERR_CYCLE_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair: MarketAdjustment → MarketAdjustmentCycle (different from
          Submission→Survey). submit is only valid when the parent cycle is OPEN;
          locking the cycle flips the precondition.
        test_recipe:
          setup:
            - "Job with PUBLISHED composite; two DRAFT adjustments A1 and A2 on the same cycle"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
