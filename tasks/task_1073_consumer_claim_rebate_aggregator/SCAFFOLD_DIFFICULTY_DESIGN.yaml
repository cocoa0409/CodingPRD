  - rule_id: non_linear_state_machine
    instances:
      - name: claim_needs_info_under_review_cycle
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Claim.NEEDS_INFO_to_UNDER_REVIEW
          - entities.Claim.fields.needs_info_count
        distinguishing_aspect: "Claim is cyclic: request-info -> resubmit -> request-info returns it to NEEDS_INFO with needs_info_count 2, proving a genuine A<->B loop on the Claim entity (not a linear pipeline)."
        test_recipe:
          setup:
            - "FIXED program OPEN; VERIFIED consumer; claim UNDER_REVIEW with a VERIFIED document"
          setup_api_calls:
            - call: "POST /rebate-aggregator/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PC1", settlement_case_id: "CASE_PC1", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 100000, advertised_amount_cents: 20000, per_claim_cap_cents: 30000, eligibility_min_purchase_cents: 5000, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "cy@x.com", full_name: "CY" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cid}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 25000 }
              as: Consumer
              as_user_id: "${cid}"
              captures: { clid: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clid}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "r1" }
              as: Consumer
              as_user_id: "${cid}"
              captures: { docid: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clid}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cid}"
            - call: "POST /rebate-aggregator/documents/${docid}/verify"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clid}/start-review"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clid}/request-info"
              payload: { message: "need receipt" }
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clid}/resubmit"
              payload: {}
              as: Consumer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /rebate-aggregator/claims/${clid}/request-info"
              payload: { message: "still unclear" }
              as: ClaimReviewer
              as_user_id: "rev-1"
          assert:
            - "Claim.${clid}.status == NEEDS_INFO"
            - "Claim.${clid}.needs_info_count == 2"

      - name: payout_failed_initiated_retry_cycle
        grounds:
          - state_machines.Payout.INITIATED_to_FAILED
          - state_machines.Payout.FAILED_to_INITIATED
          - entities.Payout.fields.attempt_count
        distinguishing_aspect: "Payout is cyclic: fail -> retry returns it to INITIATED with attempt_count 2, a genuine loop on the Payout entity — a different entity from the Claim cycle."
        test_recipe:
          setup:
            - "FIXED program OPEN; VERIFIED consumer; approved claim with a Payout in INITIATED, then FAILED"
          setup_api_calls:
            - call: "POST /rebate-aggregator/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PC2", settlement_case_id: "CASE_PC2", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 100000, advertised_amount_cents: 20000, per_claim_cap_cents: 30000, eligibility_min_purchase_cents: 5000, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
              captures: { pver: $.data.version }
            - call: "POST /rebate-aggregator/consumers"
