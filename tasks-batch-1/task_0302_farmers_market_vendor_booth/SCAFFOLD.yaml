# =============================================================================
# SCAFFOLD — Farmers Market & Vendor Booth Management
# Difficulty band: Expert (§0.4)
# Files in this package:
#   SCAFFOLD.yaml                  — §1.0–§1.7 (this file)
#   SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 (depth probe, 9 rules × ≥2 instances)
#   SCAFFOLD_CORNER_DESIGN.yaml     — §1.9 (breadth probe)
# =============================================================================

scenario: |
  Farmers Market & Vendor Booth Management: vendor application & product category,
  booth/stall assignment & map, season vs daily fee & waitlist, market-day check-in
  & attendance, token/voucher reconciliation, sales reporting & commission, weather
  cancellation, permit verification

domain_name: farmers-market-vendor-booth
api_prefix: /

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite booth pool competed for: held, committed, released, waitlist-promoted
  secondary_archetype: ledger_reconciliation # commission: gross-sales accrual vs token-reconciled actual diverge for same data
  complexity_layers:
    - dual_variant_calculation               # commission gross vs reconciled; fee season vs daily proration
    - cascading_side_effects                 # weather cancellation cascades day -> check-ins -> sales -> voucher holds -> ledger
    - optimistic_concurrency                 # waitlist promotion on a stale Booth.version (CREATE-with-supersede)
    - derived_field_reconciliation           # booth occupancy + market fee/commission ledgers reconciled on every mutation

  entity_topology: flat
  # Flat, FK-linked peer entities — every entity has a top-level collection (/markets, /vendors,
  # /booths, /market-days, /booth-assignments, /check-ins, /sales-reports, /voucher-batches,
  # /voucher-redemptions, /permits, /applications). Parent/child links are foreign keys carried in
  # the request body, not nested URL segments. Reverse reachability is provided by filtered list
  # endpoints (e.g., GET /vendors?market_id=..., GET /booth-assignments?booth_id=...).

  state_machine_shape: branching
  # Application: branching with revert (SUBMITTED -> {APPROVED, REJECTED}, REJECTED -> resubmit cycle).
  # BoothAssignment: branching (REQUESTED -> {WAITLISTED, RESERVED} -> ACTIVE -> {COMPLETED, CANCELLED}).
  # MarketDay: posture-style cancellation cascade. CheckIn/SalesReport: short pipelines.

  relationship_patterns:
    - one_to_many        # Market has many Booths, MarketDays, Vendors
    - cross_aggregate    # BoothAssignment links Booth + Vendor; CheckIn links BoothAssignment + MarketDay
    - many_to_many       # Vendor <-> MarketDay is realised through CheckIn / VoucherRedemption

  role_model: peer_roles
  # MarketAdmin (operator, opaque) owns booths/days/cancellation/permit-verification.
  # Vendor (entity_backed) owns own applications, assignments, check-ins, sales reports.
  # MarketManager (opaque) reconciles vouchers and disburses commission.

  consistency_model: immediate
  # All ledger and occupancy recomputation is atomic within the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Market
    parent: null
    common_fields: true       # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Market display name" }
      - { name: season_start_date, type: string, source: input, description: "Season window inclusive start, YYYY-MM-DD" }
      - { name: season_end_date, type: string, source: input, description: "Season window inclusive end, YYYY-MM-DD; must be >= season_start_date" }
      - { name: season_fee_cents, type: integer, source: input, description: "Flat fee for a full-season booth assignment, > 0" }
      - { name: daily_fee_cents, type: integer, source: input, description: "Per-market-day fee for a daily booth assignment, > 0" }
      - { name: commission_bps, type: integer, source: input, description: "Commission rate in basis points applied to vendor gross sales, 0..10000" }
      - { name: voucher_face_value_cents, type: integer, source: input, description: "Cash value of one redeemed token/voucher in cents, > 0" }
      - { name: booth_count, type: integer, source: computed, description: "Number of Booth rows under this market" }
      - { name: total_commission_accrued_cents, type: integer, source: computed, description: "Sum of SalesReport.commission_cents across all RECONCILED sales reports under this market; reconciled-revenue ledger" }
      - { name: total_fees_collected_cents, type: integer, source: computed, description: "Sum of (fee_charged_cents - fee_refunded_cents) for BoothAssignment rows currently in {RESERVED, ACTIVE}; currently-occupying occupancy-fee ledger (REQUESTED/WAITLISTED/CANCELLED/COMPLETED excluded) — see calculations.market_fee_ledger" }
      - { name: voucher_liability_cents, type: integer, source: computed, description: "voucher_face_value_cents * (total tokens redeemed across all RECONCILED VoucherRedemption rows minus tokens already reimbursed); conserved-cash ledger" }

  # ---------------------------------------------------------------------------
  - name: Vendor
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; the market this vendor belongs to" }
      - { name: legal_name, type: string, source: input, description: "Vendor legal/business name" }
      - { name: contact_email, type: string, source: input, description: "Contact email, unique per market" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE; PROSPECT on registration, flips to ACTIVE when the vendor's first Application is APPROVED (bubble-up). No demotion path." }
      - { name: permit_ok, type: boolean, source: computed, description: "Health-permit gate for assignments. true iff EITHER the vendor's APPROVED Application.product_category NOT IN {DAIRY, MEAT, PREPARED_FOOD} (no health permit needed), OR the vendor has at least one Permit with permit_type==HEALTH AND status==VERIFIED AND expiry_date >= the assignment window date under test. Recomputed on permit verify/expire and evaluated at assignment time." }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of CheckIn rows with status NO_SHOW for this vendor; drives waitlist demotion", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Permit
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; owning vendor" }
      - { name: permit_type, type: enum, source: input, description: "HEALTH | FIRE | COTTAGE_FOOD | RESALE" }
      - { name: permit_number, type: string, source: input, description: "Issuing-authority permit number" }
      - { name: issue_date, type: string, source: input, description: "YYYY-MM-DD permit issue date" }
      - { name: expiry_date, type: string, source: input, description: "YYYY-MM-DD permit expiry, inclusive; must be > issue_date" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED | EXPIRED; PENDING on create, VERIFIED/REJECTED by MarketAdmin, EXPIRED by clock sweep" }
      - { name: verified_at, type: string, source: system, description: "ISO 8601 UTC timestamp the permit was VERIFIED; null otherwise" }

  # ---------------------------------------------------------------------------
  - name: Application
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; applicant" }
      - { name: product_category, type: enum, source: input, description: "PRODUCE | DAIRY | MEAT | BAKED_GOODS | PREPARED_FOOD | CRAFTS | FLOWERS" }
      - { name: requires_health_permit, type: boolean, source: computed, description: "true iff product_category IN {DAIRY, MEAT, PREPARED_FOOD}; pins which categories gate APPROVE on a VERIFIED HEALTH permit" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED; REJECTED applications may be resubmitted (REJECTED -> SUBMITTED)" }
      - { name: review_note, type: string, source: input, description: "Reviewer note supplied on APPROVE/REJECT; null until reviewed" }

  # ---------------------------------------------------------------------------
  - name: Booth
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; owning market" }
      - { name: label, type: string, source: input, description: "Map label, unique per market, e.g. A-12" }
      - { name: grid_row, type: integer, source: input, description: "Map grid row, >= 0" }
      - { name: grid_col, type: integer, source: input, description: "Map grid column, >= 0" }
      - { name: size_class, type: enum, source: input, description: "SINGLE | DOUBLE | CORNER; CORNER carries a premium multiplier" }
      - { name: allowed_categories, type: array, source: input, description: "Array of product_category enums this booth may host; empty array means all categories allowed" }
      - { name: status, type: enum, source: computed, description: "OPEN | SEASON_HELD | OUT_OF_SERVICE; SEASON_HELD when a SEASON BoothAssignment in {RESERVED, ACTIVE} occupies it; OUT_OF_SERVICE set by admin" }
      - { name: season_holder_assignment_id, type: string, source: computed, description: "FK -> BoothAssignment.id; the SEASON assignment currently holding this booth, null when OPEN" }

  # ---------------------------------------------------------------------------
  - name: MarketDay
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; owning market" }
      - { name: market_date, type: string, source: input, description: "YYYY-MM-DD; must fall within [season_start_date, season_end_date] inclusive; unique per market" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | CANCELLED; SCHEDULED on create, OPEN on open-day, CLOSED on close-day, CANCELLED on weather cancellation" }
      - { name: opened_at, type: string, source: system, description: "ISO 8601 UTC when the day was opened; null until OPEN" }
      - { name: cancellation_reason, type: enum, source: input, description: "WEATHER | SAFETY | LOW_TURNOUT; null unless CANCELLED" }
      - { name: daily_fee_refundable, type: boolean, source: computed, description: "true iff status==CANCELLED with cancellation_reason==WEATHER; pins which cancellations rebate daily fees" }
      - { name: attendance_count, type: integer, source: computed, description: "Count of CheckIn rows with status PRESENT for this market day" }

  # ---------------------------------------------------------------------------
  - name: BoothAssignment
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; owning market" }
      - { name: booth_id, type: string, source: input, description: "FK -> Booth.id; the requested booth" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; the requesting vendor" }
      - { name: assignment_type, type: enum, source: input, description: "SEASON | DAILY; SEASON holds the booth for the whole season window, DAILY holds it for one market_day" }
      - { name: market_day_id, type: string, source: input, description: "FK -> MarketDay.id; required when assignment_type==DAILY, MUST be omitted/null for SEASON" }
      - { name: status, type: enum, source: system, description: "REQUESTED | WAITLISTED | RESERVED | ACTIVE | COMPLETED | CANCELLED; see §1.2" }
      - { name: waitlist_rank, type: integer, source: computed, description: "1-based position among WAITLISTED assignments on the same booth (+ same market_day for DAILY), ordered by created_at ASC; null unless WAITLISTED" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "Fee locked at RESERVE time; season vs daily proration variant — see calculations.assignment_fee" }
      - { name: fee_refunded_cents, type: integer, source: computed, description: "Amount rebated on weather cancellation; 0 otherwise", default: 0 }

  # ---------------------------------------------------------------------------
  - name: CheckIn
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; owning market" }
      - { name: booth_assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id; the assignment being attended" }
      - { name: market_day_id, type: string, source: input, description: "FK -> MarketDay.id; the day attended" }
      - { name: status, type: enum, source: system, description: "EXPECTED | PRESENT | NO_SHOW; EXPECTED on create, PRESENT on arrival, NO_SHOW on day close without arrival" }
      - { name: arrived_at, type: string, source: system, description: "ISO 8601 UTC arrival timestamp; null until PRESENT" }

  # ---------------------------------------------------------------------------
  - name: SalesReport
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; owning market" }
      - { name: check_in_id, type: string, source: input, description: "FK -> CheckIn.id; the attendance this report covers; unique per check_in" }
      - { name: gross_sales_cents, type: integer, source: input, description: "Vendor self-reported gross sales for the day in cents, >= 0" }
      - { name: tokens_accepted, type: integer, source: input, description: "Count of tokens/vouchers the vendor reports accepting that day, >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RECONCILED | DISPUTED; see §1.2" }
      - { name: commission_cents, type: integer, source: computed, description: "Commission owed; provisional at SUBMITTED (gross-sales basis), final at RECONCILED (token-reconciled basis) — see calculations" }
      - { name: reconciled_token_count, type: integer, source: computed, description: "Token count agreed at reconciliation = min(tokens_accepted, VoucherRedemption tokens attributed to this vendor+day); null until RECONCILED" }

  # ---------------------------------------------------------------------------
  - name: VoucherBatch
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; owning market" }
      - { name: market_day_id, type: string, source: input, description: "FK -> MarketDay.id; the day this batch of tokens was issued for" }
      - { name: tokens_issued, type: integer, source: input, description: "Number of tokens sold/issued to shoppers, > 0" }
      - { name: tokens_redeemed, type: integer, source: computed, description: "Sum of VoucherRedemption.token_count across RECONCILED redemptions for this batch; never exceeds tokens_issued" }
      - { name: status, type: enum, source: system, description: "ISSUED | CLOSED; ISSUED on create, CLOSED when the day is CLOSED or CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: VoucherRedemption
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; owning market" }
      - { name: voucher_batch_id, type: string, source: input, description: "FK -> VoucherBatch.id; batch the tokens came from" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; redeeming vendor" }
      - { name: market_day_id, type: string, source: input, description: "FK -> MarketDay.id; redemption day; must equal the batch's market_day_id" }
      - { name: token_count, type: integer, source: input, description: "Tokens this vendor submits for redemption, > 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | RECONCILED | REVERSED; SUBMITTED on create, RECONCILED by MarketManager, REVERSED on weather cancellation" }
      - { name: reimbursed_cents, type: integer, source: computed, description: "token_count * Market.voucher_face_value_cents, locked at RECONCILED; 0 while SUBMITTED or after REVERSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------- Application: branching with revert (cycle) ----------
  - entity: Application
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{application_id}/start-review"
        actor: MarketAdmin
        preconditions:
          - "Application.status == SUBMITTED"
        side_effects:
          - "Sets Application.updated_at; increments Application.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{application_id}/approve"
        actor: MarketAdmin
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "If Application.requires_health_permit == true, the applicant Vendor has at least one Permit with permit_type==HEALTH AND status==VERIFIED AND expiry_date >= Market.season_start_date (cross-entity dependency Application->Permit)"
        side_effects:
          - "Sets Vendor.status = ACTIVE if it was PROSPECT (bubble-up to parent Vendor)"
          - "Sets review_note from request; increments Application.version and Vendor.version by 1 each"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /applications/{application_id}/reject"
        actor: MarketAdmin
        preconditions:
          - "Application.status == UNDER_REVIEW"
        side_effects:
          - "Sets review_note from request; increments Application.version by 1"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /applications/{application_id}/resubmit"
        actor: Vendor
        preconditions:
          - "Application.status == REJECTED"
          - "Acting Vendor (X-User-ID) owns this application (Application.vendor_id == X-User-ID)"
        side_effects:
          - "Clears review_note to null; increments Application.version by 1"
        note: "Revision loop — REJECTED applications cycle back to SUBMITTED for a fresh review pass."

  # ---------- BoothAssignment: branching allocation + waitlist ----------
  - entity: BoothAssignment
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RESERVED
        trigger: "system, evaluated synchronously inside POST /booth-assignments when the slot is free"
        actor: system
        preconditions:
          - "Vendor.status == ACTIVE"
          - "Vendor.permit_ok == true evaluated against the assignment window (season_start_date for SEASON, MarketDay.market_date for DAILY)"
          - "Booth.allowed_categories is empty OR contains the product_category of the vendor's APPROVED Application"
          - "For SEASON: Booth.status == OPEN (no overlapping SEASON or DAILY occupation across the season window) — see validations resource-overlap"
          - "For DAILY: no RESERVED/ACTIVE assignment (SEASON or DAILY) occupies the booth on that MarketDay"
        side_effects:
          - "Computes and locks fee_charged_cents (calculations.assignment_fee)"
          - "For SEASON: sets Booth.status = SEASON_HELD and Booth.season_holder_assignment_id (cross-entity); increments Booth.version by 1"
          - "Recomputes Market.total_fees_collected_cents (ledger sync); increments Market.version by 1"

      - from: REQUESTED
        to: WAITLISTED
        trigger: "system, evaluated synchronously inside POST /booth-assignments when the slot is occupied"
        actor: system
        preconditions:
          - "Vendor.status == ACTIVE and Vendor.permit_ok == true (same gates as RESERVED)"
          - "The requested slot is already occupied by a RESERVED/ACTIVE assignment"
        side_effects:
          - "Computes waitlist_rank = 1 + count of existing WAITLISTED assignments on the same booth (+ same market_day for DAILY), ordered by created_at ASC"
          - "fee_charged_cents stays 0 while WAITLISTED"

      - from: WAITLISTED
        to: RESERVED
        trigger: "system promotion inside the releasing transition (the cancel/complete of the holding assignment), OR POST /booth-assignments/{assignment_id}/promote by MarketAdmin"
        actor: system
        preconditions:
          - "The booth slot the assignment was waitlisted for is now free"
          - "This assignment has waitlist_rank == 1 (lowest created_at among WAITLISTED on that slot)"
          - "Vendor.permit_ok still true at promotion time"
        side_effects:
          - "Computes and locks fee_charged_cents"
          - "For SEASON: sets Booth.status = SEASON_HELD and Booth.season_holder_assignment_id; increments Booth.version by 1"
          - "Re-ranks remaining WAITLISTED assignments (each surviving waitlist_rank decremented by 1)"
          - "Recomputes Market.total_fees_collected_cents; increments Market.version by 1"

      - from: RESERVED
        to: ACTIVE
        trigger: "POST /booth-assignments/{assignment_id}/activate, OR first CheckIn on a DAILY assignment"
        actor: "MarketAdmin or system"
        preconditions:
          - "BoothAssignment.status == RESERVED"
          - "For DAILY: the MarketDay is OPEN (not CANCELLED/CLOSED)"
        side_effects:
          - "Sets BoothAssignment.updated_at; increments version by 1"

      - from: [RESERVED, ACTIVE]
        to: COMPLETED
        trigger: "POST /booth-assignments/{assignment_id}/complete, OR system when the season ends / DAILY MarketDay CLOSES"
        actor: "MarketAdmin or system"
        preconditions:
          - "BoothAssignment.status IN {RESERVED, ACTIVE}"
        side_effects:
          - "For SEASON: sets Booth.status = OPEN, clears Booth.season_holder_assignment_id (cross-entity); increments Booth.version by 1"
          - "Promotes the rank-1 WAITLISTED assignment on the freed slot to RESERVED (cascade -> the WAITLISTED->RESERVED transition fires, which itself recomputes Market.total_fees_collected_cents)"

      - from: [REQUESTED, WAITLISTED, RESERVED, ACTIVE]
        to: CANCELLED
        trigger: "POST /booth-assignments/{assignment_id}/cancel by Vendor or MarketAdmin, OR system on weather cancellation of the DAILY MarketDay"
        actor: "Vendor, MarketAdmin, or system"
        preconditions:
          - "BoothAssignment.status IN {REQUESTED, WAITLISTED, RESERVED, ACTIVE}"
          - "Vendor cancel requires acting Vendor owns the assignment"
        side_effects:
          - "If it was RESERVED/ACTIVE and SEASON: sets Booth.status = OPEN, clears Booth.season_holder_assignment_id (cross-entity); increments Booth.version by 1"
          - "If it was RESERVED/ACTIVE: promotes the rank-1 WAITLISTED assignment on the freed slot to RESERVED (cascade into WAITLISTED->RESERVED, which recomputes Market.total_fees_collected_cents)"
          - "If it was WAITLISTED: re-ranks the remaining WAITLISTED assignments (each higher rank decremented by 1)"
          - "On weather cancellation only: sets fee_refunded_cents (calculations.fee_refund) and recomputes Market.total_fees_collected_cents; increments Market.version by 1"

  # ---------- MarketDay: lifecycle + weather cancellation cascade ----------
  - entity: MarketDay
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /market-days/{market_day_id}/open"
        actor: MarketAdmin
        preconditions:
          - "MarketDay.status == SCHEDULED"
        side_effects:
          - "Sets opened_at; increments MarketDay.version by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /market-days/{market_day_id}/close"
        actor: MarketAdmin
        preconditions:
          - "MarketDay.status == OPEN"
        side_effects:
          - "Every CheckIn for this day still in EXPECTED -> NO_SHOW (cascade; bumps each Vendor.no_show_strikes)"
          - "Every DAILY BoothAssignment on this day in {RESERVED, ACTIVE} -> COMPLETED (cascade)"
          - "Every VoucherBatch for this day ISSUED -> CLOSED"
          - "Increments MarketDay.version by 1"

      - from: [SCHEDULED, OPEN]
        to: CANCELLED
        trigger: "POST /market-days/{market_day_id}/cancel"
        actor: MarketAdmin
        preconditions:
          - "MarketDay.status IN {SCHEDULED, OPEN}"
          - "cancellation_reason supplied"
        side_effects:
          - "Sets daily_fee_refundable = (cancellation_reason == WEATHER)"
          - "Cascade depth-1: every DAILY BoothAssignment on this day in {REQUESTED, WAITLISTED, RESERVED, ACTIVE} -> CANCELLED"
          - "Cascade depth-2: each such BoothAssignment->CANCELLED, when WEATHER, sets fee_refunded_cents (calculations.fee_refund) and frees its booth slot"
          - "Cascade depth-3: freeing a slot recomputes Market.total_fees_collected_cents (ledger sync on the parent Market)"
          - "Every EXPECTED/PRESENT CheckIn for this day -> NO_SHOW is NOT applied; instead CheckIns for a CANCELLED day are voided: status stays as-is but excluded from attendance_count"
          - "Every RECONCILED/SUBMITTED VoucherRedemption for this day -> REVERSED (reimbursed_cents reset to 0); recomputes Market.voucher_liability_cents"
          - "Every VoucherBatch for this day -> CLOSED"
          - "Increments MarketDay.version by 1"
        note: "Weather cancellation is the master cascade: MarketDay -> BoothAssignment -> Booth/Market ledger, and MarketDay -> VoucherRedemption -> Market voucher ledger."

  # ---------- CheckIn: attendance pipeline ----------
  - entity: CheckIn
    field: status
    initial_state: EXPECTED
    terminal_states: [PRESENT, NO_SHOW]
    transitions:
      - from: EXPECTED
        to: PRESENT
        trigger: "POST /check-ins/{check_in_id}/arrive"
        actor: "Vendor or MarketAdmin"
        preconditions:
          - "CheckIn.status == EXPECTED"
          - "MarketDay.status == OPEN (cross-entity: cannot arrive on a SCHEDULED/CLOSED/CANCELLED day)"
        side_effects:
          - "Sets arrived_at; recomputes MarketDay.attendance_count; if the linked BoothAssignment is RESERVED it transitions to ACTIVE (cascade); increments CheckIn.version by 1"

      - from: EXPECTED
        to: NO_SHOW
        trigger: "system on MarketDay close (day OPEN -> CLOSED), for CheckIns still EXPECTED"
        actor: system
        preconditions:
          - "CheckIn.status == EXPECTED at day close"
        side_effects:
          - "Increments owning Vendor.no_show_strikes (recomputed); increments CheckIn.version by 1"

  # ---------- SalesReport: report -> reconcile (with dispute branch) ----------
  - entity: SalesReport
    field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sales-reports/{sales_report_id}/submit"
        actor: Vendor
        preconditions:
          - "SalesReport.status == DRAFT"
          - "Linked CheckIn.status == PRESENT (cross-entity: only attended days can report sales)"
          - "Acting Vendor owns the SalesReport (via CheckIn -> BoothAssignment.vendor_id)"
        side_effects:
          - "Computes provisional commission_cents on the gross-sales basis (calculations.commission, variant=provisional)"
          - "Increments SalesReport.version by 1"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /sales-reports/{sales_report_id}/dispute"
        actor: MarketManager
        preconditions:
          - "SalesReport.status == SUBMITTED"
        side_effects:
          - "Flags the report; commission_cents unchanged; increments version by 1"

      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /sales-reports/{sales_report_id}/submit by Vendor with corrected figures"
        actor: Vendor
        preconditions:
          - "SalesReport.status == DISPUTED"
        side_effects:
          - "Recomputes provisional commission_cents; increments version by 1"
        note: "Dispute loop — SUBMITTED <-> DISPUTED until the manager reconciles."

      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /sales-reports/{sales_report_id}/reconcile"
        actor: MarketManager
        preconditions:
          - "SalesReport.status == SUBMITTED"
          - "All VoucherRedemption rows for the same vendor+market_day are RECONCILED (cross-entity: SalesReport -> VoucherRedemption)"
        side_effects:
          - "Sets reconciled_token_count = min(tokens_accepted, sum of RECONCILED VoucherRedemption.token_count for this vendor+day)"
          - "Recomputes commission_cents on the token-reconciled basis (calculations.commission, variant=final) — may differ from provisional"
          - "Recomputes Market.total_commission_accrued_cents (ledger sync); increments Market.version by 1"

  # ---------- VoucherRedemption: submit -> reconcile (reverse on weather) ----------
  - entity: VoucherRedemption
    field: status
    initial_state: SUBMITTED
    terminal_states: [REVERSED]
    transitions:
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /voucher-redemptions/{redemption_id}/reconcile"
        actor: MarketManager
        preconditions:
          - "VoucherRedemption.status == SUBMITTED"
          - "MarketDay.status IN {OPEN, CLOSED} (not CANCELLED)"
          - "Running total of RECONCILED token_count for the batch + this token_count <= VoucherBatch.tokens_issued (aggregate overlap on batch capacity)"
        side_effects:
          - "Locks reimbursed_cents = token_count * Market.voucher_face_value_cents"
          - "Recomputes VoucherBatch.tokens_redeemed and Market.voucher_liability_cents (ledger sync); increments Market.version by 1"

      - from: [SUBMITTED, RECONCILED]
        to: REVERSED
        trigger: "system on weather cancellation of the MarketDay"
        actor: system
        preconditions:
          - "Owning MarketDay transitions to CANCELLED"
        side_effects:
          - "Resets reimbursed_cents to 0; recomputes VoucherBatch.tokens_redeemed and Market.voucher_liability_cents (compensating action — voucher cash ledger returns to pre-redemption value)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: season-assignment-stale-booth
    parent_entity: Booth
    write_endpoint: "POST /booth-assignments"
    occ_field: "expected_booth_version"
    description: |
      Creating a SEASON BoothAssignment against a Booth whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just reserved a SEASON assignment on the booth (legitimately
      taking it from OPEN to SEASON_HELD, bumping Booth.version) and the current
      writer's view of the booth as OPEN is therefore stale. Both requests would
      individually succeed against an OPEN booth, so the conflict is a true race
      resolved by stale-version detection, not a state precondition.
    error_id: ERR_STALE_BOOTH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL-VARIANT #1: assignment fee — season flat vs daily proration ----
  - name: assignment_fee
    trigger: "BoothAssignment REQUESTED->RESERVED and WAITLISTED->RESERVED (locks fee_charged_cents)"
    algorithm: tiered_pricing
    formula: |
      size_mult(size_class):
        SINGLE -> 100   # represented in basis-hundredths to keep integer math
        DOUBLE -> 180
        CORNER -> 150
      # SEASON variant (forward-looking over the whole season window):
      if assignment_type == SEASON:
        base = Market.season_fee_cents
        fee_charged_cents = round_half_up( base * size_mult / 100 )
      # DAILY variant (single market day):
      if assignment_type == DAILY:
        base = Market.daily_fee_cents
        fee_charged_cents = round_half_up( base * size_mult / 100 )
    input_set: "Single assignment; size multiplier from the booth, base rate from the market keyed on assignment_type."
    constants:
      SIZE_MULT_SINGLE: 100
      SIZE_MULT_DOUBLE: 180
      SIZE_MULT_CORNER: 150
    precision: "integer cents, round_half_up on the multiplication"
    variants:
      - name: season
        when: "assignment_type == SEASON"
        difference: "Uses Market.season_fee_cents as base — one flat charge covering every market day in the season window."
      - name: daily
        when: "assignment_type == DAILY"
        difference: "Uses Market.daily_fee_cents as base — charged per single market day; N daily assignments cost N*daily, which for the same booth across a full season generally diverges from the one-shot season fee."

  # ---- DUAL-VARIANT #2: commission — provisional gross vs final reconciled ----
  - name: commission
    trigger: "SalesReport DRAFT->SUBMITTED (provisional) and SUBMITTED->RECONCILED (final)"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL (at SUBMITTED): commission on full self-reported gross sales.
      provisional_commission_cents =
        round_half_up( gross_sales_cents * Market.commission_bps / 10000 )

      # FINAL (at RECONCILED): token-reconciled basis. Token-backed sales are the
      # portion of gross sales the market can verify via redeemed vouchers; the
      # market only takes commission on the verified token-backed revenue.
      reconciled_token_count = min(tokens_accepted,
                                   sum(RECONCILED VoucherRedemption.token_count
                                       for this vendor + market_day))
      token_backed_sales_cents = reconciled_token_count * Market.voucher_face_value_cents
      verified_sales_cents = min(gross_sales_cents, token_backed_sales_cents)
      final_commission_cents =
        round_half_up( verified_sales_cents * Market.commission_bps / 10000 )
    input_set: "One SalesReport; final variant additionally sums RECONCILED VoucherRedemption.token_count for the same vendor_id + market_day_id."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "SalesReport.status == SUBMITTED"
        difference: "Basis is full gross_sales_cents — vendor's unverified self-report."
      - name: final
        when: "SalesReport.status == RECONCILED"
        difference: "Basis is verified_sales_cents = min(gross_sales, reconciled_token_count * voucher_face_value); for the same SalesReport row this generally differs from provisional because verified <= gross."

  # ---- COMBINATORIAL (mode c: pinned evaluation order / circular-looking) ----
  - name: market_fee_ledger
    trigger: "Any BoothAssignment enters/leaves {RESERVED, ACTIVE}; weather refund; waitlist promotion"
    algorithm: aggregation
    formula: |
      # Evaluation order is pinned to break the apparent circularity between an
      # assignment's fee and the market ledger:
      #   STEP 1: lock the assignment's own fee_charged_cents (calculations.assignment_fee)
      #           and fee_refunded_cents (calculations.fee_refund) FIRST, in isolation.
      #   STEP 2: ONLY THEN recompute the market aggregate from the now-final per-row values.
      total_fees_collected_cents =
        sum( fee_charged_cents - fee_refunded_cents
             for BoothAssignment where status IN {RESERVED, ACTIVE} )
      # This is the CURRENTLY-OCCUPYING fee ledger: only RESERVED and ACTIVE rows count.
      # A REQUESTED/WAITLISTED/CANCELLED/COMPLETED assignment contributes 0 (excluded). This
      # exclusion is what makes the complete+promote pair conservative — completing the holder
      # drops its 75000 (it leaves {RESERVED,ACTIVE}) and promoting the rank-1 waitlister re-adds
      # an identical 75000, so the ledger is invariant across the pair.
    input_set: "All BoothAssignment rows under the market with status IN {RESERVED, ACTIVE}, summed AFTER per-row fee fields are finalised."
    precision: "integer cents"

  # ---- COMBINATORIAL (mode a: >=3 inputs, nested min, conditional branch) ----
  - name: voucher_liability_ledger
    trigger: "VoucherRedemption SUBMITTED->RECONCILED, ->REVERSED; MarketDay weather cancellation"
    algorithm: aggregation
    formula: |
      # >=3 inputs (face value, per-redemption token_count, reimbursed flag) with a
      # nested min cap against batch issuance and a conditional branch on status.
      for each VoucherBatch b under the market:
        b.tokens_redeemed = min( b.tokens_issued,
                                 sum(r.token_count for r in VoucherRedemption
                                     where r.voucher_batch_id == b.id
                                     AND r.status == RECONCILED) )
      voucher_liability_cents =
        Market.voucher_face_value_cents
        * sum( b.tokens_redeemed for all batches b under the market )
        - reimbursed_to_date_cents
      # reimbursed_to_date_cents tracks cash already disbursed to vendors; on a normal
      # day it lags redemption (liability positive); on REVERSED redemptions the sum
      # term drops and liability is recomputed downward.
    input_set: "All VoucherBatch rows under the market and their RECONCILED VoucherRedemption children, capped per batch by tokens_issued."
    constants:
      MIN_TOKENS: 0
    precision: "integer cents"

  # ---- fee refund on weather cancellation ----
  - name: fee_refund
    trigger: "BoothAssignment ->CANCELLED caused by a WEATHER MarketDay cancellation"
    algorithm: threshold
    formula: |
      if cancellation_reason == WEATHER:
        if assignment_type == DAILY:
          fee_refunded_cents = fee_charged_cents          # full rebate of the day's fee
        if assignment_type == SEASON:
          # SEASON fee is NOT rebated for a single weather day; only the prorated
          # share of one day is. Proration: one day's share of the season fee.
          scheduled_days = count(MarketDay under market with status != CANCELLED at cancel time)
          per_day_share = floor( fee_charged_cents / max(scheduled_days, 1) )
          fee_refunded_cents = per_day_share
      else:
        fee_refunded_cents = 0   # SAFETY / LOW_TURNOUT cancellations are non-refundable
    input_set: "The single cancelled assignment plus, for SEASON, the count of non-CANCELLED MarketDays under the market at cancel time."
    constants:
      DAILY_FULL_REBATE: true
    precision: "integer cents, floor on the season proration"

  # ---- waitlist rank (selector / ordering) ----
  - name: waitlist_rank
    trigger: "BoothAssignment REQUESTED->WAITLISTED (assign), and re-ranked on any WAITLISTED departure/promotion"
    algorithm: chronological
    formula: |
      candidate_set = BoothAssignment rows with status == WAITLISTED on the same
                      booth_id (and same market_day_id when assignment_type == DAILY)
      order candidate_set by created_at ASC   # earliest waitlister ranks first; no id tie-break needed because created_at is unique per row
      waitlist_rank = 1-based position of this assignment in that ordering
      promotion picks the row with waitlist_rank == 1 (earliest created_at)
    input_set: "WAITLISTED assignments on the same slot; promotion always selects the earliest created_at."
    precision: "integer rank starting at 1"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed Vendor acting on a resource it does not own is forbidden"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-referenced resource exists within the market scope, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body required fields present and well-typed; enum values legal; numeric fields satisfy stated bounds (e.g., gross_sales_cents >= 0, token_count > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: business_referential
    check: "DAILY BoothAssignment must carry market_day_id; SEASON must omit it; VoucherRedemption.market_day_id must equal its VoucherBatch.market_day_id; SalesReport.check_in_id must reference a CheckIn whose BoothAssignment.vendor_id matches"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 422
    applies_to: "POST /booth-assignments, POST /voucher-redemptions, POST /sales-reports"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is legal (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_temporal
    check: "MarketDay.market_date within [season_start_date, season_end_date]; DAILY assignment's market_day must be SCHEDULED or OPEN (not CLOSED/CANCELLED); arrive only while MarketDay OPEN"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /market-days, POST /booth-assignments (DAILY), POST /check-ins, arrive"

  - priority: 8
    category: business_safety
    check: "Permit gate: on POST /booth-assignments, Vendor.permit_ok must be true (i.e., the vendor's APPROVED category needs no health permit, OR a VERIFIED unexpired HEALTH permit exists for the assignment window). On /applications/{id}/approve of a requires_health_permit application, a VERIFIED unexpired HEALTH permit is required (else ERR_NO_HEALTH_PERMIT)."
    error_id: ERR_PERMIT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /booth-assignments, POST /applications/{id}/approve"

  - priority: 9
    category: business_constraint
    check: "Booth.allowed_categories (if non-empty) must contain the vendor's APPROVED product_category"
    error_id: ERR_CATEGORY_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /booth-assignments"

  - priority: 10
    category: business_constraint
    check: "Resource temporal-overlap: SEASON assignment rejected if the booth is occupied across the season window; DAILY rejected if the booth is occupied on that market_day. (Occupied -> waitlist path, not a hard error, unless allow_waitlist=false.)"
    error_id: ERR_BOOTH_OCCUPIED
    http_status: 409
    applies_to: "POST /booth-assignments when allow_waitlist == false"

  - priority: 11
    category: business_fiscal
    check: "VoucherRedemption reconcile: running RECONCILED token_count for the batch + this token_count must not exceed VoucherBatch.tokens_issued (aggregate fiscal cap)"
    error_id: ERR_TOKEN_OVERDRAW
    http_status: 409
    applies_to: "voucher-redemptions/reconcile"

  - priority: 12
    category: business_constraint
    check: "OCC: expected_booth_version on a SEASON booth-assignment create must equal current Booth.version"
    error_id: ERR_STALE_BOOTH_VERSION
    http_status: 412
    applies_to: "POST /booth-assignments (SEASON)"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: one SalesReport per CheckIn; one Vendor.contact_email per market; one Booth.label per market; one MarketDay.market_date per market"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /sales-reports, POST /vendors, POST /booths, POST /market-days"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Flat topology: api_prefix "/", every entity exposed as a top-level collection.
  # Parent links are FK fields in the request body; reverse reachability via filtered lists.

  # ---------- Market ----------
  - method: POST
    path: "/markets"
    description: "Create a market with season window and fee/commission/voucher policy"
    roles: [MarketAdmin]
    code: 201
    input: [name, season_start_date, season_end_date, season_fee_cents, daily_fee_cents, commission_bps, voucher_face_value_cents]
    output: Market
    side_effects: ["booth_count=0, all ledger fields=0, version=1"]

  - method: GET
    path: "/markets/{market_id}"
    description: "Get a market including computed ledger fields"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: Market
    side_effects: []

  # ---------- Vendor ----------
  - method: POST
    path: "/vendors"
    description: "Register a vendor under a market (market_id in body)"
    roles: [MarketAdmin, Vendor]
    code: 201
    input: [market_id, legal_name, contact_email]
    output: Vendor
    side_effects: ["status=PROSPECT, no_show_strikes=0, permit_ok=false"]

  - method: GET
    path: "/vendors/{vendor_id}"
    description: "Get a vendor including computed permit_ok and no_show_strikes"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors"
    description: "List vendors; filtered-list reverse-reachability for Vendor.market_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["market_id?", "status?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  # ---------- Permit ----------
  - method: POST
    path: "/permits"
    description: "Submit a permit for verification (vendor_id in body)"
    roles: [MarketAdmin, Vendor]
    code: 201
    input: [vendor_id, permit_type, permit_number, issue_date, expiry_date]
    output: Permit
    side_effects: ["status=PENDING, verified_at=null"]

  - method: GET
    path: "/permits/{permit_id}"
    description: "Get a permit"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits"
    description: "List permits; filtered-list reverse-reachability for Permit.vendor_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["vendor_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/permits/{permit_id}/verify"
    description: "Verify or reject a submitted permit"
    roles: [MarketAdmin]
    code: 200
    input: [decision]   # decision IN {VERIFY, REJECT}
    output: Permit
    side_effects: ["VERIFY: status=VERIFIED, verified_at set, recompute owning Vendor.permit_ok; REJECT: status=REJECTED"]

  # ---------- Application ----------
  - method: POST
    path: "/applications"
    description: "Vendor submits an application with a product category (vendor_id in body)"
    roles: [MarketAdmin, Vendor]
    code: 201
    input: [vendor_id, product_category]
    output: Application
    side_effects: ["status=SUBMITTED, requires_health_permit computed from product_category"]

  - method: GET
    path: "/applications/{application_id}"
    description: "Get an application"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications; filtered-list reverse-reachability for Application.vendor_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["vendor_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{application_id}/start-review"
    description: "Move application SUBMITTED -> UNDER_REVIEW"
    roles: [MarketAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["status=UNDER_REVIEW"]

  - method: POST
    path: "/applications/{application_id}/approve"
    description: "Approve an application (gated by HEALTH permit when required)"
    roles: [MarketAdmin]
    code: 200
    input: [review_note]
    output: Application
    side_effects: ["status=APPROVED, owning Vendor PROSPECT->ACTIVE"]

  - method: POST
    path: "/applications/{application_id}/reject"
    description: "Reject an application under review"
    roles: [MarketAdmin]
    code: 200
    input: [review_note]
    output: Application
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/applications/{application_id}/resubmit"
    description: "Vendor resubmits a rejected application (REJECTED -> SUBMITTED)"
    roles: [Vendor]
    code: 200
    input: []
    output: Application
    side_effects: ["status=SUBMITTED, review_note cleared"]

  # ---------- Booth ----------
  - method: POST
    path: "/booths"
    description: "Create a booth on the market map (market_id in body)"
    roles: [MarketAdmin]
    code: 201
    input: [market_id, label, grid_row, grid_col, size_class, allowed_categories]
    output: Booth
    side_effects: ["status=OPEN, season_holder_assignment_id=null, increments Market.booth_count"]

  - method: GET
    path: "/booths/{booth_id}"
    description: "Get a booth including computed status and season holder"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: Booth
    side_effects: []

  - method: GET
    path: "/booths"
    description: "List booths (the map); filtered-list reverse-reachability for Booth.market_id and Booth.season_holder_assignment_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["market_id?", "season_holder_assignment_id?", "status?", "size_class?", "limit?", "offset?"]
    output: Booth[]
    side_effects: []

  - method: POST
    path: "/booths/{booth_id}/set-service"
    description: "Set a booth OUT_OF_SERVICE or back OPEN (admin map maintenance)"
    roles: [MarketAdmin]
    code: 200
    input: [out_of_service]   # boolean
    output: Booth
    side_effects: ["status flips OUT_OF_SERVICE<->OPEN when not SEASON_HELD"]

  # ---------- MarketDay ----------
  - method: POST
    path: "/market-days"
    description: "Schedule a market day within the season window (market_id in body)"
    roles: [MarketAdmin]
    code: 201
    input: [market_id, market_date]
    output: MarketDay
    side_effects: ["status=SCHEDULED, attendance_count=0"]

  - method: GET
    path: "/market-days/{market_day_id}"
    description: "Get a market day including attendance_count"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: MarketDay
    side_effects: []

  - method: GET
    path: "/market-days"
    description: "List market days; filtered-list reverse-reachability for MarketDay.market_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["market_id?", "status?", "limit?", "offset?"]
    output: MarketDay[]
    side_effects: []

  - method: POST
    path: "/market-days/{market_day_id}/open"
    description: "Open a scheduled market day"
    roles: [MarketAdmin]
    code: 200
    input: []
    output: MarketDay
    side_effects: ["status SCHEDULED->OPEN, opened_at set"]

  - method: POST
    path: "/market-days/{market_day_id}/close"
    description: "Close an open market day (NO_SHOW sweep, DAILY completion, batch close)"
    roles: [MarketAdmin]
    code: 200
    input: []
    output: MarketDay
    side_effects: ["status OPEN->CLOSED; EXPECTED CheckIns->NO_SHOW; RESERVED/ACTIVE DAILY assignments->COMPLETED; VoucherBatch ISSUED->CLOSED"]

  - method: POST
    path: "/market-days/{market_day_id}/cancel"
    description: "Cancel a market day with a reason (WEATHER triggers refund + voucher reversal cascade)"
    roles: [MarketAdmin]
    code: 200
    input: [cancellation_reason]
    output: MarketDay
    side_effects: ["status->CANCELLED; daily_fee_refundable computed; DAILY assignments cancelled + refunded; voucher redemptions REVERSED; batches CLOSED; Market ledgers recomputed"]

  # ---------- BoothAssignment ----------
  - method: POST
    path: "/booth-assignments"
    description: "Request a booth assignment; auto-RESERVED if free, auto-WAITLISTED if occupied (when allow_waitlist). SEASON requires expected_booth_version (OCC). market_id, booth_id, vendor_id in body."
    roles: [MarketAdmin, Vendor]
    code: 201
    input: [market_id, booth_id, vendor_id, assignment_type, "market_day_id?", "allow_waitlist?", "expected_booth_version?"]
    output: BoothAssignment
    side_effects: ["status REQUESTED then ->RESERVED or ->WAITLISTED; fee_charged_cents locked on RESERVE; SEASON sets Booth.status=SEASON_HELD and increments Booth.version by 1; recomputes Market.total_fees_collected_cents and increments Market.version by 1"]

  - method: GET
    path: "/booth-assignments/{assignment_id}"
    description: "Get a booth assignment including fee and waitlist_rank"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: []

  - method: GET
    path: "/booth-assignments"
    description: "List assignments; filtered-list reverse-reachability for BoothAssignment.booth_id, .vendor_id, .market_id, .market_day_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["market_id?", "booth_id?", "vendor_id?", "market_day_id?", "status?", "assignment_type?", "limit?", "offset?"]
    output: BoothAssignment[]
    side_effects: []

  - method: POST
    path: "/booth-assignments/{assignment_id}/activate"
    description: "Activate a reserved assignment (RESERVED->ACTIVE)"
    roles: [MarketAdmin]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["status RESERVED->ACTIVE"]

  - method: POST
    path: "/booth-assignments/{assignment_id}/complete"
    description: "Complete an assignment; frees booth and promotes rank-1 waitlister (cascade)"
    roles: [MarketAdmin]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["status->COMPLETED; SEASON frees booth; rank-1 WAITLISTED promoted to RESERVED; ledger recomputed"]

  - method: POST
    path: "/booth-assignments/{assignment_id}/cancel"
    description: "Cancel an assignment; frees booth and promotes rank-1 waitlister; re-ranks the rest"
    roles: [MarketAdmin, Vendor]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["status->CANCELLED; SEASON frees booth; rank-1 WAITLISTED promoted; remaining WAITLISTED re-ranked; ledger recomputed"]

  - method: POST
    path: "/booth-assignments/{assignment_id}/promote"
    description: "Manually promote a rank-1 WAITLISTED assignment to RESERVED when its slot is free"
    roles: [MarketAdmin]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["status WAITLISTED->RESERVED; fee locked; SEASON sets Booth.status; remaining WAITLISTED re-ranked; ledger recomputed"]

  # ---------- CheckIn ----------
  - method: POST
    path: "/check-ins"
    description: "Create an expected check-in linking an assignment to a market day (market_id in body)"
    roles: [MarketAdmin, Vendor]
    code: 201
    input: [market_id, booth_assignment_id, market_day_id]
    output: CheckIn
    side_effects: ["status=EXPECTED"]

  - method: GET
    path: "/check-ins/{check_in_id}"
    description: "Get a check-in"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: CheckIn
    side_effects: []

  - method: GET
    path: "/check-ins"
    description: "List check-ins; filtered-list reverse-reachability for CheckIn.booth_assignment_id, .market_day_id, .market_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["market_id?", "booth_assignment_id?", "market_day_id?", "status?", "limit?", "offset?"]
    output: CheckIn[]
    side_effects: []

  - method: POST
    path: "/check-ins/{check_in_id}/arrive"
    description: "Mark a check-in PRESENT (EXPECTED->PRESENT); activates a RESERVED assignment"
    roles: [MarketAdmin, Vendor]
    code: 200
    input: []
    output: CheckIn
    side_effects: ["status EXPECTED->PRESENT, arrived_at set; recompute MarketDay.attendance_count; RESERVED assignment->ACTIVE"]

  # ---------- SalesReport ----------
  - method: POST
    path: "/sales-reports"
    description: "Create a draft sales report for a check-in (market_id in body)"
    roles: [MarketAdmin, Vendor]
    code: 201
    input: [market_id, check_in_id, gross_sales_cents, tokens_accepted]
    output: SalesReport
    side_effects: ["status=DRAFT, commission_cents=0"]

  - method: GET
    path: "/sales-reports/{sales_report_id}"
    description: "Get a sales report including commission and reconciled_token_count"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: SalesReport
    side_effects: []

  - method: GET
    path: "/sales-reports"
    description: "List sales reports; filtered-list reverse-reachability for SalesReport.check_in_id, .market_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["market_id?", "check_in_id?", "status?", "limit?", "offset?"]
    output: SalesReport[]
    side_effects: []

  - method: POST
    path: "/sales-reports/{sales_report_id}/submit"
    description: "Submit (or re-submit a disputed) sales report; computes provisional commission"
    roles: [Vendor]
    code: 200
    input: ["gross_sales_cents?", "tokens_accepted?"]
    output: SalesReport
    side_effects: ["status DRAFT/DISPUTED->SUBMITTED; provisional commission_cents computed"]

  - method: POST
    path: "/sales-reports/{sales_report_id}/dispute"
    description: "Manager disputes a submitted sales report (SUBMITTED->DISPUTED)"
    roles: [MarketManager]
    code: 200
    input: []
    output: SalesReport
    side_effects: ["status SUBMITTED->DISPUTED"]

  - method: POST
    path: "/sales-reports/{sales_report_id}/reconcile"
    description: "Manager reconciles a submitted sales report; final token-reconciled commission"
    roles: [MarketManager]
    code: 200
    input: []
    output: SalesReport
    side_effects: ["status SUBMITTED->RECONCILED; reconciled_token_count set; final commission_cents computed; Market.total_commission_accrued_cents recomputed and Market.version incremented"]

  # ---------- VoucherBatch ----------
  - method: POST
    path: "/voucher-batches"
    description: "Issue a batch of tokens/vouchers for a market day (market_id in body)"
    roles: [MarketManager]
    code: 201
    input: [market_id, market_day_id, tokens_issued]
    output: VoucherBatch
    side_effects: ["status=ISSUED, tokens_redeemed=0"]

  - method: GET
    path: "/voucher-batches/{voucher_batch_id}"
    description: "Get a voucher batch including tokens_redeemed"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: VoucherBatch
    side_effects: []

  - method: GET
    path: "/voucher-batches"
    description: "List voucher batches; filtered-list reverse-reachability for VoucherBatch.market_day_id, .market_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["market_id?", "market_day_id?", "status?", "limit?", "offset?"]
    output: VoucherBatch[]
    side_effects: []

  # ---------- VoucherRedemption ----------
  - method: POST
    path: "/voucher-redemptions"
    description: "Vendor submits tokens from a batch for redemption (market_id in body)"
    roles: [MarketManager, Vendor]
    code: 201
    input: [market_id, voucher_batch_id, vendor_id, market_day_id, token_count]
    output: VoucherRedemption
    side_effects: ["status=SUBMITTED, reimbursed_cents=0"]

  - method: GET
    path: "/voucher-redemptions/{redemption_id}"
    description: "Get a voucher redemption including reimbursed_cents"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: []
    output: VoucherRedemption
    side_effects: []

  - method: GET
    path: "/voucher-redemptions"
    description: "List redemptions; filtered-list reverse-reachability for VoucherRedemption.voucher_batch_id, .vendor_id, .market_day_id, .market_id"
    roles: [MarketAdmin, MarketManager, Vendor]
    code: 200
    input: ["market_id?", "voucher_batch_id?", "vendor_id?", "market_day_id?", "status?", "limit?", "offset?"]
    output: VoucherRedemption[]
    side_effects: []

  - method: POST
    path: "/voucher-redemptions/{redemption_id}/reconcile"
    description: "Manager reconciles a submitted redemption; locks reimbursement, caps at batch issuance"
    roles: [MarketManager]
    code: 200
    input: []
    output: VoucherRedemption
    side_effects: ["status SUBMITTED->RECONCILED; reimbursed_cents locked; VoucherBatch.tokens_redeemed and Market.voucher_liability_cents recomputed; Market.version incremented"]

  # ---------- Test-driving (clock) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's notion of current UTC, used to expire permits and gate date-window checks deterministically"
    roles: [MarketAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server clock set; permits with expiry_date < current date that were VERIFIED transition to EXPIRED and recompute owning Vendor.permit_ok"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,    http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role" }
  - { id: ERR_FORBIDDEN_ROLE,     http: 403, condition: "Role not permitted for this operation, or entity_backed Vendor acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND,          http: 404, condition: "Path-referenced resource does not exist within the market scope" }
  - { id: ERR_INVALID_REQUEST,    http: 422, condition: "Missing/malformed required field, illegal enum, or numeric bound violation (e.g., gross_sales_cents < 0, token_count <= 0)" }
  - { id: ERR_REFERENTIAL_MISMATCH, http: 422, condition: "DAILY assignment missing market_day_id (or SEASON supplying one); redemption market_day_id != batch market_day_id; sales-report check-in vendor mismatch" }
  - { id: ERR_INVALID_STATE,      http: 409, condition: "Requested transition illegal from the resource's current state" }
  - { id: ERR_OUTSIDE_WINDOW,     http: 409, condition: "market_date outside season window; DAILY targets a CLOSED/CANCELLED day; arrive attempted on a non-OPEN day" }
  - { id: ERR_PERMIT_NOT_VERIFIED, http: 409, condition: "Vendor lacks a VERIFIED unexpired permit required for the assignment window or the health-gated application approval" }
  - { id: ERR_CATEGORY_NOT_ALLOWED, http: 409, condition: "Vendor's APPROVED product_category not in the booth's non-empty allowed_categories" }
  - { id: ERR_BOOTH_OCCUPIED,     http: 409, condition: "Requested booth slot occupied and allow_waitlist=false, so no waitlist entry is created" }
  - { id: ERR_TOKEN_OVERDRAW,     http: 409, condition: "Reconciling this redemption would push the batch's RECONCILED token total above tokens_issued" }
  - { id: ERR_STALE_BOOTH_VERSION, http: 412, condition: "expected_booth_version on a SEASON assignment create does not match current Booth.version (OCC)" }
  - { id: ERR_DUPLICATE,          http: 409, condition: "Uniqueness violation: duplicate SalesReport per CheckIn, Vendor.contact_email, Booth.label, or MarketDay.market_date within the market" }
  - { id: ERR_NO_HEALTH_PERMIT,   http: 409, condition: "Approving a requires_health_permit application without a VERIFIED HEALTH permit on the vendor (distinct sub-case of permit gate at approval time)" }
  - { id: ERR_WAITLIST_NOT_HEAD,  http: 409, condition: "promote called on a WAITLISTED assignment whose waitlist_rank != 1, or whose slot is still occupied" }
  - { id: ERR_DAY_NOT_OPEN,       http: 409, condition: "Redemption reconcile or check-in arrive on a day whose status forbids it (e.g., reconcile against a CANCELLED day)" }
  - { id: ERR_VALIDATION_BOUNDS,  http: 422, condition: "season_end_date < season_start_date, expiry_date <= issue_date, commission_bps outside 0..10000, or fee/face-value <= 0" }
  - { id: ERR_SALES_NOT_PRESENT,  http: 409, condition: "Submitting a sales report whose CheckIn is not PRESENT" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MarketAdmin
    description: "Market operator: configures markets/booths/days, verifies permits, reviews applications, manages assignments, opens/closes/cancels days."
    identity: "opaque"
    exclusive_operations:
      - "POST /markets — create market"
      - "POST /booths — create booth"
      - "POST /booths/{id}/set-service — booth map maintenance"
      - "POST /market-days — schedule day"
      - "POST /market-days/{id}/open|close|cancel — day lifecycle"
      - "POST /permits/{id}/verify — verify/reject permit"
      - "POST /applications/{id}/start-review|approve|reject — application review"
      - "POST /booth-assignments/{id}/activate|complete|promote — assignment lifecycle"
      - "POST /_clock/set_current_utc — test clock control"
    shared_operations:
      - "POST /vendors — register vendor (shared with Vendor)"
      - "POST /permits — submit permit (shared with Vendor)"
      - "POST /applications — submit application (shared with Vendor)"
      - "POST /booth-assignments — request assignment (shared with Vendor)"
      - "POST /booth-assignments/{id}/cancel — cancel assignment (shared with Vendor)"
      - "POST /check-ins — create check-in (shared with Vendor)"
      - "POST /check-ins/{id}/arrive — arrive (shared with Vendor)"
      - "POST /sales-reports — create report (shared with Vendor)"
      - "POST /voucher-redemptions — submit redemption (shared with Vendor)"
      - "All GET endpoints"

  - name: MarketManager
    description: "Financial operator: issues voucher batches, reconciles redemptions, disputes/reconciles sales reports and commission. Cannot configure the map or review applications."
    identity: "opaque"
    exclusive_operations:
      - "POST /voucher-batches — issue token batch"
      - "POST /voucher-redemptions/{id}/reconcile — reconcile redemption"
      - "POST /sales-reports/{id}/dispute — dispute report"
      - "POST /sales-reports/{id}/reconcile — reconcile report (final commission)"
    shared_operations:
      - "POST /voucher-redemptions — submit redemption (shared with Vendor)"
      - "All GET endpoints"

  - name: Vendor
    description: "Market participant. X-User-ID equals the Vendor.id it acts as. Owns its applications, permits, assignments, check-ins, sales reports, redemptions."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /applications/{id}/resubmit — resubmit own rejected application"
      - "POST /sales-reports/{id}/submit — submit/re-submit own report"
    shared_operations:
      - "POST /vendors — register vendor (shared with MarketAdmin)"
      - "POST /permits — submit own permit"
      - "POST /applications — submit own application"
      - "POST /booth-assignments — request own assignment"
      - "POST /booth-assignments/{id}/cancel — cancel own assignment"
      - "POST /check-ins — create own check-in"
      - "POST /check-ins/{id}/arrive — arrive at own check-in"
      - "POST /sales-reports — create own report"
      - "POST /voucher-redemptions — submit own redemption"
      - "All GET endpoints"
