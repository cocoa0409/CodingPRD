          One request violates a business_safety rule (priority 50, ERR_OVERHEAD_RATE_NOT_CERTIFIED)
          and a business_fiscal rule (priority 83, ERR_NOTHING_TO_INVOICE) at once; the compliance
          error must win, and certifying the fiscal year then exposes the fiscal error on the very
          same request payload, proving both rules were genuinely violated.
