      - call: POST /construction/projects/${p_order}/bid-items
        payload:
          item_code: 2025-390105
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
          overrun_threshold_pct: 15.0
          underrun_threshold_pct: 15.0
        as: Estimator
        captures:
          bi_order: $.data.id
      - call: POST /construction/projects/${p_order}/bid-items/${bi_order}/price
        payload:
          bid_unit_price_cents: 3000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_order}/bid-items/${bi_order}/submit
        payload: {}
        as: Estimator
      - call: POST /construction/surety-commitments
        payload:
          surety_id: ${s_order}
          project_id: ${p_order}
          committed_amount_cents: 12000000
        as: ContractingOfficer
      - call: POST /construction/bonds
        payload:
          project_id: ${p_order}
          surety_id: ${s_order}
          bond_type: PERFORMANCE
          bond_amount_cents: 12000000
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          maintain_bond_horizon_days: 30
        as: Estimator
        captures:
          b_order: $.data.id
      - call: POST /construction/projects/${p_order}/seal-bid
        payload: {}
        as: Estimator
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-12-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects/${p_order}/open-bid
        payload: {}
        as: ContractingOfficer
      - call: POST /construction/bonds/${b_order}/issue
        payload: {}
        as: Surety
        as_user_id: ${s_order}
      - call: POST /construction/projects/${p_order}/start-work
        payload: {}
        as: ProjectManager
      - call: POST /construction/projects/${p_order}/reconciliations
        payload: {}
        as: ContractingOfficer
        captures:
          rc_order: $.data.id
      - call: GET /construction/bid-items/${bi_order}
        payload: {}
        as: Estimator
        captures:
          biv_order: $.data.version
      - call: POST /construction/bid-items/${bi_order}/measurements
        payload:
          measured_quantity: 1000
          measured_at: '2026-12-02T00:00:00Z'
          expected_bid_item_version: ${biv_order}
        as: ProjectManager
        captures:
          m_order: $.data.id
      - call: POST /construction/measurements/${m_order}/approve
        payload: {}
        as: ProjectManager
      trigger:
      - call: GET /construction/projects/${p_order}
        payload: {}
        as: ContractingOfficer
        captures:
          pv_order: $.data.version
      - call: POST /construction/projects/${p_order}/reconciliations/${rc_order}/finalize
        payload:
          expected_project_version: ${pv_order}
        as: ContractingOfficer
      assert:
      - BidItem.${bi_order}.measured_quantity == 1000
      - BidItem.${bi_order}.variance_pct == 0.0
      - BidItem.${bi_order}.renegotiation_required == false
      - QuantityReconciliation.${rc_order}.net_adjustment_cents == 0
      - QuantityReconciliation.${rc_order}.final_contract_value_cents == 3000000
      - QuantityReconciliation.${rc_order}.retention_held_cents == 150000
- rule_id: non_linear_state_machine
  instances:
  - name: project_bid_dimension_cycles_through_recall
    grounds:
    - state_machines.Project.DRAFT_to_SEALED
    - state_machines.Project.SEALED_to_RECALLED
    - state_machines.Project.RECALLED_to_DRAFT
    distinguishing_aspect: 'The Project''s bid dimension is a genuine cycle DRAFT -> SEALED -> RECALLED -> DRAFT —

      after a recall the same project can be re-priced and re-sealed — which is structurally

      impossible for a linear pipeline no matter how many states it lists.

      '
    test_recipe:
      setup:
      - one Project whose BidItem is SUBMITTED before the deadline, already moved DRAFT -> SEALED -> RECALLED once
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5608
          owner_agency_name: Caltrans District 4
          contract_type: UNIT_PRICE
          bid_deadline_at: '2026-12-01T00:00:00Z'
          retention_rate_pct: 5.0
          advertised_dbe_goal_pct: 0.0
        as: Estimator
        captures:
          p_cycle: $.data.id
      - call: POST /construction/projects/${p_cycle}/bid-items
        payload:
          item_code: 2025-390106
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
          overrun_threshold_pct: 15.0
          underrun_threshold_pct: 15.0
        as: Estimator
        captures:
          bi_cycle: $.data.id
      - call: POST /construction/projects/${p_cycle}/bid-items/${bi_cycle}/price
        payload:
          bid_unit_price_cents: 3000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_cycle}/bid-items/${bi_cycle}/submit
        payload: {}
        as: Estimator
      - call: POST /construction/projects/${p_cycle}/seal-bid
        payload: {}
        as: Estimator
      - call: POST /construction/projects/${p_cycle}/recall-bid
        payload:
          reason_code: OWNER_ADDENDUM
        as: ContractingOfficer
      - call: GET /construction/bid-items/${bi_cycle}
        payload: {}
        as: Estimator
        captures:
          biv_cycle: $.data.version
      trigger:
      - call: POST /construction/projects/${p_cycle}/reset-bid
        payload: {}
        as: ContractingOfficer
      - call: POST /construction/projects/${p_cycle}/bid-items/${bi_cycle}/price
        payload:
          bid_unit_price_cents: 3500
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_cycle}/bid-items/${bi_cycle}/submit
        payload: {}
        as: Estimator
      - call: POST /construction/projects/${p_cycle}/seal-bid
        payload: {}
        as: Estimator
      assert:
      - Project.${p_cycle}.bid_status == SEALED
      - Project.${p_cycle}.project_status == PRE_BID
      - Project.${p_cycle}.total_bid_cents == 3500000
      - BidItem.${bi_cycle}.item_status == SUBMITTED
  - name: quote_negotiation_reopens_on_recall
    grounds:
    - state_machines.SubcontractorQuote.RECEIVED_to_CARRIED
    - state_machines.SubcontractorQuote.CARRIED_to_RECEIVED
    - state_machines.Project.SEALED_to_RECALLED
    distinguishing_aspect: 'The recall cascade drives the quote dimension backwards along its own cycle — CARRIED

      returns to RECEIVED and version_round advances — after which the same quote can be

      carried again, so this machine loops in both directions rather than terminating.

      '
    test_recipe:
      setup:
      - one Project with a CARRIED subcontractor quote on trade SWPPP, the project already SEALED
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5609
          owner_agency_name: Caltrans District 4
          contract_type: UNIT_PRICE
          bid_deadline_at: '2026-12-01T00:00:00Z'
          retention_rate_pct: 5.0
          advertised_dbe_goal_pct: 0.0
        as: Estimator
        captures:
          p_qcycle: $.data.id
      - call: POST /construction/projects/${p_qcycle}/bid-items
        payload:
          item_code: 2025-390107
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
          overrun_threshold_pct: 15.0
          underrun_threshold_pct: 15.0
        as: Estimator
        captures:
          bi_qcycle: $.data.id
      - call: POST /construction/projects/${p_qcycle}/bid-items/${bi_qcycle}/price
        payload:
          bid_unit_price_cents: 3000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_qcycle}/bid-items/${bi_qcycle}/submit
        payload: {}
        as: Estimator
      - call: POST /construction/subcontractor-quotes
        payload:
          project_id: ${p_qcycle}
          trade_code: SWPPP
          contact_name: Dana Reyes
          quoted_amount_cents: 18000000
          quote_window_start: '2026-11-01T00:00:00Z'
          quote_window_end: '2026-12-01T00:00:00Z'
          unicap_registered: true
          good_faith_effort_basis: SOLICITED_DBE
        as: Estimator
        captures:
          q_qcycle: $.data.id
      - call: POST /construction/subcontractor-quotes/${q_qcycle}/carry
        payload: {}
        as: Estimator
      - call: POST /construction/projects/${p_qcycle}/seal-bid
        payload: {}
        as: Estimator
      trigger:
      - call: POST /construction/projects/${p_qcycle}/recall-bid
        payload:
          reason_code: ERROR_IN_BID
        as: ContractingOfficer
      assert:
      - SubcontractorQuote.${q_qcycle}.quote_status == RECEIVED
      - SubcontractorQuote.${q_qcycle}.version_round == 2
      - SubcontractorQuote.${q_qcycle}.carried_in_bid == false
      - Project.${p_qcycle}.total_bid_cents == 3000000
- rule_id: transitive_cascade
  instances:
  - name: open_bid_cascade_awards_items_then_recomputes_reconciliation_then_project
    grounds:
    - state_machines.Project.SEALED_to_OPEN
    - state_machines.BidItem.SUBMITTED_to_AWARDED
    - calculations.quantity_variance_adjustment
    - calculations.retention_settlement
    distinguishing_aspect: 'Depth-4 chain from a single trigger whose every hop is caused by the previous hop:

      open-bid moves each BidItem SUBMITTED -> AWARDED, that item transition recomputes the

      reconciliation''s item-level variance, that recompute drives the reconciliation''s money

      fields, and only then does the project''s contract_value_cents and retention_balance_cents

      move — the project write is not caused by open-bid directly.

      '
    test_recipe:
      setup:
      - one SEALED Project whose only BidItem is SUBMITTED at 3000 cents on 1000 TON, with an OPEN QuantityReconciliation already in place
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5610
          owner_agency_name: Caltrans District 4
          contract_type: UNIT_PRICE
