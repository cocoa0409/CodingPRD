# =============================================================================
# PRD Benchmark Seed Tables — State Assessment Administration
# Difficulty target: above the Expert band of SKILL.md §0.4 (deliberate).
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2112. State Assessment Administration
  (state testing program): test window scheduling & session creation, student
  registration & accommodation coding, secure material receipt/return & chain of
  custody, proctor training & test-security affidavit, irregularity/breach
  reporting & invalidation, make-up testing & participation rate, score release &
  data appeal window, results distribution to families

domain_name: state-assessment-administration

# Flat/graph topology: every resource collection is mounted at the URL root, so
# there is no single shared top-level path segment. An empty prefix means paths
# in §1.5 are absolute and complete as written.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions

  entity_topology: graph
  # Peer collections joined by foreign keys, two junction-shaped entities
  # (Registration links a student identity to a Session; CustodyEvent links a
  # MaterialLot to a Session), and two self-referential edges
  # (CustodyEvent.previous_event_id, Registration.makeup_of_registration_id).

  state_machine_shape: cyclic
  # TestWindow has two back-edges (OPEN->PLANNED, SCORING->MAKEUP);
  # IrregularityReport has a RETURNED_FOR_INFO->SUBMITTED revision loop capped at
  # MAX_RETURN_CYCLES; Registration carries three independent state dimensions
  # (attendance_status x accommodation_status x score_status) on one row;
  # IrregularityReport ADJUDICATED forks into four dispositions with disjoint
  # side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The SchoolTestCoordinator codes accommodations but may never decide them; the
  # DistrictTestCoordinator decides them but may never code them. A Proctor files
  # irregularity reports but may never adjudicate them. A make-up Session may not
  # be proctored by the Proctor who ran the original Session.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: District
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable district name.
        constraints: "1..120 characters"
      - name: district_code
        type: string
        source: input
        description: Statewide district identifier; unique across all Districts.
        constraints: "matches ^[A-Z]{2}-[0-9]{4}$"
      - name: state_code
        type: string
        source: input
        description: Two-letter state postal abbreviation the district reports under.
        constraints: "matches ^[A-Z]{2}$"
      - name: replacement_charge_total_cents
        type: integer
        source: computed
        default: 0
        description: >-
          Sum of replacement_charge_cents over every MaterialLot whose district_id is
          this District and whose charge_reversed is false. Recomputed by
          calculations.district_charge_ledger.
      - name: security_assessment_cents
        type: integer
        source: computed
        default: 0
        description: >-
          Net amount billed to the district after the waiver tier is applied; output of
          calculations.district_security_assessment.
      - name: open_discrepancy_count
        type: integer
        source: computed
        default: 0
        description: >-
          COUNT of MaterialLot rows with district_id == this District, status ==
          DISCREPANT and charge_reversed == false.

  - name: School
    parent: District
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> District.id; immutable after creation."
      - name: name
        type: string
        source: input
        description: Human-readable school name.
        constraints: "1..120 characters"
      - name: school_code
        type: string
        source: input
        description: School identifier; unique within the owning District.
        constraints: "matches ^[A-Z]{2}-[0-9]{2}$"
      - name: max_concurrent_seats
        type: integer
        source: input
        description: >-
          Hard ceiling on how many test seats the school can staff at one time; used as
          the second argument of the min() in calculations.session_seat_pressure.
        constraints: ">= 1 and <= 500"

  - name: TestWindow
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Administrative label for the testing window.
        constraints: "1..120 characters"
      - name: subject
        type: enum
        source: input
        description: Subject assessed in this window.
        constraints: "one of ELA, MATH, SCIENCE, SOCIAL_STUDIES"
      - name: grade_band
        type: enum
        source: input
        description: Grade band assessed in this window.
        constraints: "one of G3_5, G6_8, G9_12"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the initial testing period.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the initial testing period.
        constraints: "strictly after window_start"
      - name: makeup_start
        type: datetime
        source: input
        description: Inclusive start of the make-up testing period.
        constraints: "at or after window_end"
      - name: makeup_end
        type: datetime
        source: input
        description: >-
          Inclusive end of the make-up testing period. Extended in place by
          MAKEUP_EXTENSION_DAYS whenever the window reverts SCORING -> MAKEUP.
        constraints: "strictly after makeup_start"
      - name: appeal_window_days
        type: integer
        source: input
        default: 10
        description: Length of the data appeal window measured from released_at.
        constraints: ">= 1 and <= 45"
      - name: min_participation_pct
        type: number
        source: input
        default: 95.0
        description: >-
          Provisional participation percentage the window must reach before SCORING ->
          RELEASED is permitted. Compared with >= (not >).
        constraints: ">= 0.0 and <= 100.0"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Lifecycle phase.
        constraints: "one of PLANNED, OPEN, MAKEUP, SCORING, RELEASED, FINALIZED, CANCELLED"
      - name: released_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which SCORING -> RELEASED executed.
      - name: appeal_window_closes_at
        type: datetime
        source: computed
        default: null
        description: "released_at + appeal_window_days * 24h; null before release."
      - name: participation_rate_provisional_pct
        type: number
        source: computed
        default: null
        description: >-
          Output of the provisional variant of calculations.participation_rate; set on
          MAKEUP -> SCORING and cleared back to null on SCORING -> MAKEUP.
        constraints: "one decimal place, round_half_up"
      - name: participation_rate_final_pct
        type: number
        source: computed
        default: null
        description: >-
          Output of the final variant of calculations.participation_rate; set on
          RELEASED -> FINALIZED.
        constraints: "one decimal place, round_half_up"
      - name: registered_distinct_count
        type: integer
        source: computed
        default: 0
        description: Denominator used by the most recently executed participation variant.
      - name: present_distinct_count
        type: integer
        source: computed
        default: 0
        description: Numerator used by the most recently executed participation variant.
      - name: open_breach_count
        type: integer
        source: computed
        default: 0
        description: >-
          COUNT of IrregularityReport rows scoped to this window whose category is
          SECURITY_BREACH and whose status is in {SUBMITTED, UNDER_REVIEW,
          RETURNED_FOR_INFO}.
      - name: security_hold
        type: boolean
        source: computed
        default: false
        description: "true exactly when open_breach_count > 0."

  - name: Proctor
    parent: School
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; immutable after creation."
      - name: full_name
        type: string
        source: input
        description: Proctor's full name.
        constraints: "1..120 characters"
      - name: email
        type: string
        source: input
        description: Contact address for training notices.
        constraints: "contains exactly one '@'"
      - name: training_status
        type: enum
        source: computed
        default: NOT_TRAINED
        description: >-
          Result of the most recent training completion recorded against this proctor.
        constraints: "one of NOT_TRAINED, FAILED, PASSED"
      - name: quiz_score_pct
        type: number
        source: computed
        default: null
        description: Score of the most recent training completion, one decimal place.
      - name: training_completed_at
        type: datetime
        source: computed
        default: null
        description: >-
          Logical-clock instant of the most recent PASSED training completion; null when
          the proctor has never passed.
      - name: revoked_at
        type: datetime
        source: computed
        default: null
        description: >-
          Logical-clock instant at which a BREACH_CONFIRMED adjudication decertified this
          proctor; null when never revoked.
      - name: certification_status
        type: enum
        source: computed
        default: NOT_CERTIFIED
        description: >-
          Output of calculations.proctor_certification_status. Re-derived on every read
          and on every precondition check that names it.
        constraints: "one of NOT_CERTIFIED, CERTIFIED, EXPIRED, REVOKED"
      - name: strike_count
        type: integer
        source: computed
        default: 0
        description: Number of BREACH_CONFIRMED adjudications attributed to this proctor.
      - name: latest_affidavit_id
        type: string
        source: computed
        default: null
        description: >-
          Id of the SecurityAffidavit most recently created for this proctor (not a
          foreign key constraint; read the full set via GET /security-affidavits with
          proctor_id). Null before the first affidavit.

  - name: SecurityAffidavit
    parent: Proctor
    common_fields: true
    fields:
      - name: proctor_id
        type: string
        source: input
        description: "FK -> Proctor.id; the proctor who signed."
      - name: window_id
        type: string
        source: input
        description: "FK -> TestWindow.id; the window this affidavit covers."
      - name: affidavit_version
        type: string
        source: input
        description: Version string of the affidavit text that was signed.
        constraints: "matches ^[0-9]{4}\\.[0-9]+$"
      - name: signed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the affidavit was recorded.
      - name: signer_user_id
        type: string
        source: system
        description: X-User-ID header value of the signing proctor.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Affidavit lifecycle.
        constraints: "one of ACTIVE, SUPERSEDED, REVOKED"
      - name: revoked_reason
        type: enum
        source: computed
        default: null
        description: Populated only when status becomes REVOKED.
        constraints: "one of BREACH_CONFIRMED"

  - name: Session
    parent: TestWindow
    common_fields: true
    fields:
      - name: window_id
        type: string
        source: input
        description: "FK -> TestWindow.id; immutable after creation."
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; immutable after creation."
      - name: proctor_id
        type: string
        source: computed
        default: null
        description: >-
          FK -> Proctor.id; null until POST /sessions/{session_id}/proctor-assignments
          sets it. Replaced in place by a later assignment while the session is DRAFT.
      - name: room_code
        type: string
        source: input
        description: >-
          Room label; the (school_id, room_code) pair is the resource whose occupancy
          intervals are checked by validations priority 17.
        constraints: "matches ^[A-Z][0-9]{3}$"
      - name: scheduled_start
        type: datetime
        source: input
        description: Planned start instant of the session.
      - name: scheduled_end
        type: datetime
        source: input
        description: Planned end instant of the session.
        constraints: "strictly after scheduled_start"
      - name: seat_capacity
        type: integer
        source: input
        description: Physical seat count of the room as declared at creation.
        constraints: ">= 1 and <= 400"
      - name: session_type
        type: enum
        source: input
        default: INITIAL
        description: >-
          INITIAL sessions live inside [window_start, window_end]; MAKEUP sessions live
          inside [makeup_start, makeup_end].
        constraints: "one of INITIAL, MAKEUP"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Session lifecycle.
        constraints: "one of DRAFT, SCHEDULED, ACTIVE, CLOSED, CANCELLED, INVALIDATED"
      - name: seats_consumed
        type: integer
        source: computed
        default: 0
        description: Output of calculations.session_seat_pressure (demand side).
      - name: effective_seat_capacity
        type: integer
        source: computed
        default: 0
        description: Output of calculations.session_seat_pressure (supply side).
      - name: separate_setting_count
        type: integer
        source: computed
        default: 0
        description: >-
          COUNT of Registrations on this session with attendance_status != WITHDRAWN that
          carry at least one accommodation code whose catalog entry has
          separate_setting == true.
      - name: materials_checked_out
        type: integer
        source: computed
        default: 0
        description: Sum of SESSION_CHECKOUT CustodyEvent quantities naming this session.
      - name: materials_checked_in
        type: integer
        source: computed
        default: 0
        description: Sum of SESSION_CHECKIN CustodyEvent quantities naming this session.
      - name: opened_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of SCHEDULED -> ACTIVE.
      - name: closed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of ACTIVE -> CLOSED.

  - name: Registration
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> Session.id; immutable after creation."
      - name: makeup_of_registration_id
        type: string
        source: input
        default: null
        description: >-
          FK -> Registration.id; null for an initial registration, otherwise the
          registration this make-up seat replaces.
      - name: student_state_id
        type: string
        source: input
        description: >-
          Statewide student identifier. Participation counts DISTINCT values of this
          field, so a make-up seat never inflates the denominator.
        constraints: "matches ^S[0-9]{8}$"
      - name: grade
        type: integer
        source: input
        description: Enrolled grade of the student.
        constraints: ">= 3 and <= 12"
      - name: guardian_email
        type: string
        source: input
        default: null
        description: >-
          Address the family score report is delivered to. When null or empty the
          distribution run suppresses the report instead of delivering it.
      - name: accommodation_codes
        type: array
        source: computed
        default: []
        description: >-
          Codes currently coded on this registration, drawn from the ACCOMMODATION_CATALOG
          of calculations.accommodation_review_routing. Replaced wholesale by each coding call.
        constraints: >-
          each element one of EXTENDED_TIME, SMALL_GROUP, ASSISTIVE_TECH, SEPARATE_ROOM,
          READ_ALOUD, SCRIBE, BRAILLE_FORM; at most 5 elements; no duplicates
      - name: accommodation_status
        type: enum
        source: system
        default: NONE
        description: Review dimension of the registration state.
        constraints: "one of NONE, REQUESTED, APPROVED, REJECTED"
      - name: accommodation_decision_note
        type: string
        source: computed
        default: null
        description: Free-text note recorded by the deciding DistrictTestCoordinator.
      - name: attendance_status
        type: enum
        source: system
        default: PENDING
        description: Attendance dimension of the registration state.
        constraints: "one of PENDING, PRESENT, ABSENT, EXCUSED, WITHDRAWN"
      - name: raw_score
        type: integer
        source: computed
        default: null
        description: >-
          Score recorded by the state; overwritten by corrected_raw_score when an appeal
          is upheld.
        constraints: ">= 0 and <= 100"
      - name: score_status
        type: enum
        source: system
        default: NOT_SCORED
        description: Scoring dimension of the registration state.
        constraints: >-
          one of NOT_SCORED, SCORED, RELEASED, UNDER_APPEAL, CORRECTED, INVALIDATED, FINAL
      - name: report_delivery_status
        type: enum
        source: computed
        default: NOT_QUEUED
        description: >-
          Set by calculations.report_distribution_selection when the window's
          distribution run executes.
        constraints: "one of NOT_QUEUED, DELIVERED, SUPPRESSED"
      - name: report_suppressed_reason
        type: enum
        source: computed
        default: null
        description: Populated only when report_delivery_status becomes SUPPRESSED.
        constraints: "one of UNDER_APPEAL, INVALIDATED, MISSING_GUARDIAN_EMAIL"
      - name: report_delivered_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which the report was marked DELIVERED.
      - name: seats_required
        type: integer
        source: computed
        default: 1
        description: >-
          Per-registration seat demand; 1 plus SEPARATE_SETTING_SEAT_COST when any coded
          accommodation carries separate_setting == true.

  - name: MaterialLot
    parent: TestWindow
    common_fields: true
    fields:
      - name: window_id
        type: string
        source: input
        description: "FK -> TestWindow.id; immutable after creation."
      - name: district_id
        type: string
        source: input
        description: "FK -> District.id; the district the lot ships to."
      - name: lot_code
        type: string
        source: input
        description: Secure lot identifier; unique across all MaterialLots.
        constraints: "matches ^LOT-[A-Z0-9]{2,8}$"
      - name: quantity_shipped
        type: integer
        source: input
        description: Number of secure booklets in the lot as shipped by the state.
        constraints: ">= 1 and <= 5000"
      - name: seal_range_start
        type: integer
        source: input
        description: First seal serial number in the lot.
        constraints: ">= 1"
      - name: seal_range_end
        type: integer
        source: input
        description: Last seal serial number in the lot.
        constraints: "seal_range_end - seal_range_start + 1 must equal quantity_shipped"
      - name: status
        type: enum
        source: system
        default: SHIPPED
        description: Custody lifecycle of the lot.
        constraints: >-
          one of SHIPPED, RECEIVED, IN_DISTRIBUTION, RETURNED_PENDING, RECONCILED,
          DISCREPANT
      - name: quantity_at_district
        type: integer
        source: computed
        default: 0
        description: Booklets currently held by the district (chronological replay bucket).
      - name: quantity_at_school
        type: integer
        source: computed
        default: 0
        description: Booklets currently held by schools (chronological replay bucket).
      - name: quantity_in_sessions
        type: integer
        source: computed
        default: 0
        description: Booklets currently checked out to sessions (chronological replay bucket).
      - name: quantity_destroyed
        type: integer
        source: computed
        default: 0
        description: Booklets documented as destroyed (chronological replay bucket).
      - name: chain_accounted_count
        type: integer
        source: computed
        default: 0
        description: >-
          quantity_at_district + quantity_destroyed after the chronological replay; the
          "chain says" side of calculations.material_reconciliation.
      - name: declared_accounted_count
        type: integer
        source: computed
        default: null
        description: >-
          declared_returned_count + declared_destroyed_count as declared at
          reconciliation; the "paperwork says" side of the same calculation.
      - name: chain_vs_declared_delta
        type: integer
        source: computed
        default: null
        description: "chain_accounted_count - declared_accounted_count."
      - name: missing_count
        type: integer
        source: computed
        default: 0
        description: "max(0, quantity_shipped - declared_accounted_count)."
      - name: seal_broken_count
        type: integer
        source: computed
        default: 0
        description: Broken seals declared at reconciliation; selects the security multiplier.
      - name: replacement_charge_cents
        type: integer
        source: computed
        default: 0
        description: Output of calculations.lot_replacement_charge, rounded per lot.
      - name: charge_reversed
        type: boolean
        source: computed
        default: false
        description: >-
          Set true when the system-generated breach report for this lot is adjudicated
          DISMISSED; excludes the lot's charge from the district ledger.
      - name: reconciled_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which reconciliation executed.

  - name: CustodyEvent
    parent: MaterialLot
    common_fields: false
    fields:
      - name: material_lot_id
        type: string
        source: input
        description: "FK -> MaterialLot.id; the lot whose custody moved."
      - name: previous_event_id
        type: string
        source: computed
        default: null
        description: >-
          FK -> CustodyEvent.id; the immediately preceding CustodyEvent on the same lot,
          null for the lot's first event. Server-derived, never client-supplied.
      - name: session_id
        type: string
        source: input
        default: null
        description: >-
          FK -> Session.id; required for SESSION_CHECKOUT and SESSION_CHECKIN, forbidden
          for all other event types.
      - name: sequence_no
        type: integer
        source: system
        description: 1-based position of this event within its lot's custody chain.
      - name: event_type
        type: enum
        source: input
        description: Kind of custody movement.
        constraints: >-
          one of RECEIPT, TRANSFER_TO_SCHOOL, SESSION_CHECKOUT, SESSION_CHECKIN,
          RETURN_TO_DISTRICT, DESTRUCTION
      - name: quantity
        type: integer
        source: input
        description: Number of booklets moved by this event.
        constraints: ">= 1"
      - name: sealed_count
        type: integer
        source: input
        description: How many of the moved booklets were still sealed.
        constraints: ">= 0 and <= quantity"
      - name: from_holder_type
        type: enum
        source: computed
        description: Bucket the booklets left.
        constraints: "one of STATE, DISTRICT, SCHOOL, SESSION"
      - name: to_holder_type
        type: enum
        source: computed
        description: Bucket the booklets entered.
        constraints: "one of DISTRICT, SCHOOL, SESSION, DESTROYED"
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID header value of the principal that recorded the movement.
      - name: actor_role
        type: enum
        source: system
        description: X-User-Role header value of the principal that recorded the movement.
        constraints: "one of DistrictTestCoordinator, SchoolTestCoordinator, Proctor"
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant at which the movement was recorded.
      - name: chain_balance_after
        type: integer
        source: computed
        description: >-
          quantity_at_district + quantity_at_school + quantity_in_sessions +
          quantity_destroyed evaluated after this event; the conserved quantity of
          calculations.material_reconciliation and therefore always equal to the lot's
          quantity_shipped.
      - name: note
        type: string
        source: input
        default: null
        description: Optional free-text annotation.

  - name: IrregularityReport
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        default: null
        description: >-
          FK -> Session.id; the session the irregularity occurred in. Null exactly when
          the report was generated by a MaterialLot reconciliation.
      - name: registration_id
        type: string
        source: input
        default: null
        description: >-
          FK -> Registration.id; set when the irregularity is student-specific, null
          otherwise.
      - name: reporter_proctor_id
        type: string
        source: computed
        default: null
        description: >-
          FK -> Proctor.id; the proctor who filed the report. Null for
          system-generated reports.
      - name: material_lot_id
        type: string
        source: computed
        default: null
        description: >-
          FK -> MaterialLot.id; set only on system-generated reports raised by a lot
          reconciliation that produced DISCREPANT.
      - name: category
        type: enum
        source: input
        description: Irregularity classification.
        constraints: "one of ADMIN_ERROR, SECURITY_BREACH, TECH_FAILURE, STUDENT_MISCONDUCT"
      - name: severity
        type: enum
        source: input
        description: Severity as judged by the filer.
        constraints: "one of LOW, MEDIUM, HIGH"
      - name: narrative
        type: string
        source: input
        description: Description of what happened.
        constraints: "1..2000 characters"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Report lifecycle.
        constraints: >-
          one of DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, ADJUDICATED, WITHDRAWN
      - name: disposition
        type: enum
        source: computed
        default: null
        description: Adjudication outcome; populated only when status becomes ADJUDICATED.
        constraints: >-
          one of DISMISSED, INVALIDATE_REGISTRATION, INVALIDATE_SESSION, BREACH_CONFIRMED
      - name: return_count
        type: integer
        source: computed
        default: 0
        description: >-
          How many times the report has been returned for more information; capped by
          MAX_RETURN_CYCLES.
      - name: adjudicated_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of UNDER_REVIEW -> ADJUDICATED.
      - name: system_generated
        type: boolean
        source: system
        default: false
        description: true when the report was raised by a lot reconciliation, false otherwise.

  - name: ScoreAppeal
    parent: Registration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the released score being appealed."
      - name: reason_code
        type: enum
        source: input
        description: Grounds for the appeal.
        constraints: >-
          one of SCORING_ERROR, ROSTER_ERROR, ACCOMMODATION_NOT_PROVIDED, IRREGULARITY_IMPACT
      - name: narrative
        type: string
        source: input
        description: Supporting explanation.
        constraints: "1..2000 characters"
      - name: filed_by_role
        type: enum
        source: system
        description: X-User-Role header value of the filer.
        constraints: "one of SchoolTestCoordinator, DistrictTestCoordinator"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID header value of the filer.
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the appeal was filed.
      - name: status
        type: enum
        source: system
        default: FILED
        description: Appeal lifecycle.
        constraints: "one of FILED, UPHELD, DENIED"
      - name: corrected_raw_score
        type: integer
        source: computed
        default: null
        description: Replacement score written onto the registration when the appeal is upheld.
        constraints: ">= 0 and <= 100"
      - name: decided_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the decision.

# =============================================================================
# §1.2 State Machine Table
# Registration carries THREE independent state dimensions on one row; each is
# declared as its own machine via `state_field:`.
# =============================================================================
state_machines:

  - entity: TestWindow
    state_field: status
    initial_state: PLANNED
    terminal_states: [FINALIZED, CANCELLED]
    note: >-
      Two back-edges make this machine non-linear: OPEN -> PLANNED reverts an
      administrative mistake, and SCORING -> MAKEUP reopens make-up testing when
      provisional participation missed the floor.
    transitions:

      - from: PLANNED
        to: OPEN
        trigger: "POST /test-windows/{window_id}/transitions with to_status=OPEN"
        actor: StateAssessmentOfficer
        preconditions:
          - "logical clock now < TestWindow.window_end"
          - "at least one MaterialLot exists with window_id == TestWindow.id"
        side_effects:
          - "TestWindow.status := OPEN"
          - "increments TestWindow.version by 1"

      - from: OPEN
        to: PLANNED
        trigger: "POST /test-windows/{window_id}/transitions with to_status=PLANNED"
        actor: StateAssessmentOfficer
        preconditions:
          - "no Session with window_id == TestWindow.id has status in {ACTIVE, CLOSED, INVALIDATED}"
        side_effects:
          - "TestWindow.status := PLANNED"
          - "cascade hop 1: every Session with window_id == TestWindow.id and status in {DRAFT, SCHEDULED} moves to CANCELLED"
          - "cascade hop 2 (caused by hop 1): every Registration whose session_id is one of those cancelled Sessions and whose attendance_status is PENDING moves to WITHDRAWN"
          - "cascade hop 3 (caused by hop 2): each affected Session recomputes seats_consumed, separate_setting_count and effective_seat_capacity via calculations.session_seat_pressure"
          - "increments TestWindow.version by 1"

      - from: OPEN
        to: MAKEUP
        trigger: "POST /test-windows/{window_id}/transitions with to_status=MAKEUP"
        actor: StateAssessmentOfficer
        preconditions:
          - "logical clock now >= TestWindow.window_end"
          - "no Session with window_id == TestWindow.id has status ACTIVE"
        side_effects:
          - "TestWindow.status := MAKEUP"
          - "increments TestWindow.version by 1"

      - from: MAKEUP
        to: SCORING
        trigger: "POST /test-windows/{window_id}/transitions with to_status=SCORING"
        actor: StateAssessmentOfficer
        preconditions:
          - "logical clock now >= TestWindow.makeup_end"
          - "every Session with window_id == TestWindow.id has status in {CLOSED, CANCELLED, INVALIDATED}"
          - "every MaterialLot with window_id == TestWindow.id has status in {RECONCILED, DISCREPANT}"
        side_effects:
          - "TestWindow.status := SCORING"
          - "runs calculations.participation_rate variant=provisional; writes participation_rate_provisional_pct, registered_distinct_count, present_distinct_count"
          - "increments TestWindow.version by 1"

      - from: SCORING
        to: MAKEUP
        trigger: "POST /test-windows/{window_id}/transitions with to_status=MAKEUP"
        actor: StateAssessmentOfficer
        preconditions:
          - "TestWindow.participation_rate_provisional_pct < TestWindow.min_participation_pct"
        side_effects:
          - "TestWindow.status := MAKEUP"
          - "TestWindow.makeup_end := TestWindow.makeup_end + MAKEUP_EXTENSION_DAYS days"
          - "TestWindow.participation_rate_provisional_pct := null"
          - "increments TestWindow.version by 1"
        note: >-
          The back-edge that makes participation recoverable; without the makeup_end
          extension the reopened phase would already be in the past.

      - from: SCORING
        to: RELEASED
        trigger: "POST /test-windows/{window_id}/transitions with to_status=RELEASED"
        actor: StateAssessmentOfficer
        preconditions:
          - "TestWindow.security_hold == false"
          - "TestWindow.participation_rate_provisional_pct >= TestWindow.min_participation_pct"
          - "every Registration in the window whose attendance_status == PRESENT has score_status in {SCORED, INVALIDATED}"
        side_effects:
          - "TestWindow.status := RELEASED"
          - "TestWindow.released_at := logical clock now"
          - "TestWindow.appeal_window_closes_at := released_at + appeal_window_days * 24h"
          - "every Registration in the window with score_status == SCORED moves to RELEASED"
          - "increments TestWindow.version by 1"

      - from: RELEASED
        to: FINALIZED
        trigger: "POST /test-windows/{window_id}/transitions with to_status=FINALIZED"
        actor: StateAssessmentOfficer
        preconditions:
          - "logical clock now >= TestWindow.appeal_window_closes_at"
          - "no ScoreAppeal with status FILED exists on any Registration in the window"
          - "no IrregularityReport scoped to the window has status in {SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO}"
        side_effects:
          - "every Registration in the window with score_status in {RELEASED, CORRECTED} moves to FINAL"
          - "then runs calculations.participation_rate variant=final; writes participation_rate_final_pct, registered_distinct_count, present_distinct_count"
          - "TestWindow.status := FINALIZED"
          - "increments TestWindow.version by 1"
        note: >-
          Evaluation order is pinned: the RELEASED/CORRECTED -> FINAL flip happens
          BEFORE the final participation numerator is counted.

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /test-windows/{window_id}/transitions with to_status=CANCELLED"
        actor: StateAssessmentOfficer
        preconditions:
          - "no Session exists with window_id == TestWindow.id"
        side_effects:
          - "TestWindow.status := CANCELLED"
          - "increments TestWindow.version by 1"

  - entity: Session
    state_field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED, INVALIDATED]
    transitions:

      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /sessions/{session_id}/transitions with to_status=SCHEDULED"
        actor: SchoolTestCoordinator
        preconditions:
          - "Session.proctor_id is not null"
          - "Proctor(Session.proctor_id).certification_status == CERTIFIED"
          - "a SecurityAffidavit exists with proctor_id == Session.proctor_id, window_id == Session.window_id and status == ACTIVE"
          - "TestWindow(Session.window_id).status == OPEN when session_type == INITIAL, or == MAKEUP when session_type == MAKEUP"
        side_effects:
          - "Session.status := SCHEDULED"
          - "increments Session.version by 1"
        note: >-
          Cross-entity guard: the proctor's certification and affidavit are re-evaluated
          here, not merely at assignment time, because both can lapse in between.

      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /sessions/{session_id}/transitions with to_status=ACTIVE"
        actor: Proctor
        preconditions:
          - "X-User-ID == Session.proctor_id"
          - "logical clock now >= Session.scheduled_start - SESSION_START_GRACE_MINUTES minutes"
          - "logical clock now <= Session.scheduled_end"
          - "TestWindow(Session.window_id).status == OPEN when session_type == INITIAL, or == MAKEUP when session_type == MAKEUP"
          - "no Registration on this Session has accommodation_status == REQUESTED"
          - "Session.materials_checked_out - Session.materials_checked_in >= COUNT(Registrations on this Session with attendance_status != WITHDRAWN)"
        side_effects:
          - "Session.status := ACTIVE"
          - "Session.opened_at := logical clock now"
          - "increments Session.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /sessions/{session_id}/transitions with to_status=CLOSED"
        actor: Proctor
        preconditions:
          - "X-User-ID == Session.proctor_id"
          - "no Registration on this Session has attendance_status == PENDING"
          - "Session.materials_checked_in == Session.materials_checked_out"
        side_effects:
          - "Session.status := CLOSED"
          - "Session.closed_at := logical clock now"
          - "increments Session.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /sessions/{session_id}/transitions with to_status=CANCELLED"
        actor: SchoolTestCoordinator
        preconditions:
          - "Session.materials_checked_out == Session.materials_checked_in"
        side_effects:
          - "Session.status := CANCELLED"
          - "every Registration on this Session with attendance_status == PENDING moves to WITHDRAWN"
          - "Session recomputes seats_consumed, separate_setting_count and effective_seat_capacity"
          - "increments Session.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{session_id}/transitions with to_status=CANCELLED"
        actor: SchoolTestCoordinator
        preconditions:
          - "Session.materials_checked_out == Session.materials_checked_in"
        side_effects:
          - "Session.status := CANCELLED"
          - "every Registration on this Session with attendance_status == PENDING moves to WITHDRAWN"
          - "Session recomputes seats_consumed, separate_setting_count and effective_seat_capacity"
          - "increments Session.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: BREACH_CONFIRMED adjudication decertified Session.proctor_id"
        actor: system
        preconditions:
          - "Proctor(Session.proctor_id).certification_status == REVOKED"
        side_effects:
          - "Session.status := CANCELLED"
          - "every Registration on this Session with attendance_status == PENDING moves to WITHDRAWN"
          - "increments Session.version by 1"

      - from: CLOSED
        to: INVALIDATED
        trigger: "system event: IrregularityReport adjudicated with disposition INVALIDATE_SESSION"
        actor: system
        preconditions:
          - "IrregularityReport.session_id == Session.id"
        side_effects:
          - "Session.status := INVALIDATED"
          - "every Registration on this Session with score_status in {NOT_SCORED, SCORED, RELEASED, UNDER_APPEAL, CORRECTED} moves to INVALIDATED"
          - "increments Session.version by 1"

  - entity: Registration
    state_field: attendance_status
    initial_state: PENDING
    terminal_states: [WITHDRAWN]
    note: Attendance dimension; evolves independently of accommodation_status and score_status.
    transitions:
      - from: PENDING
        to: PRESENT
        trigger: "POST /registrations/{registration_id}/attendance with attendance_status=PRESENT"
        actor: Proctor
        preconditions:
          - "Session(Registration.session_id).status == ACTIVE"
          - "X-User-ID == Session(Registration.session_id).proctor_id"
        side_effects:
          - "Registration.attendance_status := PRESENT"
          - "increments Registration.version by 1"
      - from: PENDING
        to: ABSENT
        trigger: "POST /registrations/{registration_id}/attendance with attendance_status=ABSENT"
        actor: Proctor
        preconditions:
          - "Session(Registration.session_id).status == ACTIVE"
          - "X-User-ID == Session(Registration.session_id).proctor_id"
        side_effects:
          - "Registration.attendance_status := ABSENT"
          - "Registration becomes eligible to be named by a later make-up registration"
          - "increments Registration.version by 1"
      - from: PENDING
        to: EXCUSED
        trigger: "POST /registrations/{registration_id}/attendance with attendance_status=EXCUSED"
        actor: Proctor
        preconditions:
          - "Session(Registration.session_id).status == ACTIVE"
          - "X-User-ID == Session(Registration.session_id).proctor_id"
        side_effects:
          - "Registration.attendance_status := EXCUSED"
          - "Registration becomes eligible to be named by a later make-up registration"
          - "increments Registration.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "system event: owning Session moved to CANCELLED"
        actor: system
        preconditions:
          - "Session(Registration.session_id).status == CANCELLED"
        side_effects:
          - "Registration.attendance_status := WITHDRAWN"
          - "Registration.seats_required no longer counts toward Session.seats_consumed"
          - "increments Registration.version by 1"

  - entity: Registration
    state_field: accommodation_status
    initial_state: NONE
    terminal_states: []
    note: >-
      Review dimension. STANDARD-tier codes auto-approve; any SPECIALIZED-tier code
      forces district review. REJECTED -> REQUESTED is the revision loop.
    transitions:
      - from: NONE
        to: APPROVED
        trigger: "POST /registrations/{registration_id}/accommodation-codings where every code is tier STANDARD"
        actor: SchoolTestCoordinator
        preconditions:
          - "Session(Registration.session_id).status in {DRAFT, SCHEDULED}"
          - "every submitted code exists in ACCOMMODATION_CATALOG"
        side_effects:
          - "Registration.accommodation_codes := submitted codes"
          - "Registration.accommodation_status := APPROVED"
          - "Registration.seats_required recomputed by calculations.session_seat_pressure"
          - "owning Session recomputes separate_setting_count, seats_consumed and effective_seat_capacity"
          - "increments Registration.version by 1"
      - from: NONE
        to: REQUESTED
        trigger: "POST /registrations/{registration_id}/accommodation-codings where at least one code is tier SPECIALIZED"
        actor: SchoolTestCoordinator
        preconditions:
          - "Session(Registration.session_id).status in {DRAFT, SCHEDULED}"
          - "every submitted code exists in ACCOMMODATION_CATALOG"
        side_effects:
          - "Registration.accommodation_codes := submitted codes"
          - "Registration.accommodation_status := REQUESTED"
          - "Registration.seats_required recomputed; owning Session recomputes seat pressure"
          - "increments Registration.version by 1"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /registrations/{registration_id}/accommodation-decisions with decision=APPROVE"
        actor: DistrictTestCoordinator
        preconditions:
          - "X-User-ID == School(Session(Registration.session_id).school_id).district_id"
        side_effects:
          - "Registration.accommodation_status := APPROVED"
          - "Registration.accommodation_decision_note := note"
          - "increments Registration.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /registrations/{registration_id}/accommodation-decisions with decision=REJECT"
        actor: DistrictTestCoordinator
        preconditions:
          - "X-User-ID == School(Session(Registration.session_id).school_id).district_id"
        side_effects:
          - "Registration.accommodation_status := REJECTED"
          - "Registration.accommodation_decision_note := note"
          - "increments Registration.version by 1"
      - from: REJECTED
        to: REQUESTED
        trigger: "POST /registrations/{registration_id}/accommodation-codings where at least one code is tier SPECIALIZED"
        actor: SchoolTestCoordinator
        preconditions:
          - "Session(Registration.session_id).status in {DRAFT, SCHEDULED}"
        side_effects:
          - "Registration.accommodation_codes := submitted codes"
          - "Registration.accommodation_status := REQUESTED"
          - "increments Registration.version by 1"
        note: The revision loop that makes this dimension cyclic.
      - from: REJECTED
        to: APPROVED
        trigger: "POST /registrations/{registration_id}/accommodation-codings where every code is tier STANDARD"
        actor: SchoolTestCoordinator
        preconditions:
          - "Session(Registration.session_id).status in {DRAFT, SCHEDULED}"
        side_effects:
          - "Registration.accommodation_codes := submitted codes"
          - "Registration.accommodation_status := APPROVED"
          - "increments Registration.version by 1"
      - from: APPROVED
        to: REQUESTED
        trigger: "POST /registrations/{registration_id}/accommodation-codings where at least one code is tier SPECIALIZED"
        actor: SchoolTestCoordinator
        preconditions:
          - "Session(Registration.session_id).status in {DRAFT, SCHEDULED}"
        side_effects:
          - "Registration.accommodation_codes := submitted codes"
          - "Registration.accommodation_status := REQUESTED"
          - "increments Registration.version by 1"

  - entity: Registration
    state_field: score_status
    initial_state: NOT_SCORED
    terminal_states: [FINAL, INVALIDATED]
    note: Scoring dimension; carries the appeal revision loop UNDER_APPEAL -> RELEASED.
    transitions:
      - from: NOT_SCORED
        to: SCORED
        trigger: "POST /registrations/{registration_id}/scores"
        actor: StateAssessmentOfficer
        preconditions:
          - "TestWindow(Session(Registration.session_id).window_id).status == SCORING"
          - "Registration.attendance_status == PRESENT"
          - "Session(Registration.session_id).status == CLOSED"
        side_effects:
          - "Registration.raw_score := raw_score"
          - "Registration.score_status := SCORED"
          - "increments Registration.version by 1"
      - from: SCORED
        to: RELEASED
        trigger: "system event: owning TestWindow moved SCORING -> RELEASED"
        actor: system
        preconditions:
          - "TestWindow.status == RELEASED"
        side_effects:
          - "Registration.score_status := RELEASED"
          - "increments Registration.version by 1"
      - from: RELEASED
        to: UNDER_APPEAL
        trigger: "POST /score-appeals naming this registration"
        actor: system
        preconditions:
          - "ScoreAppeal created with status FILED"
        side_effects:
          - "Registration.score_status := UNDER_APPEAL"
          - "increments Registration.version by 1"
      - from: UNDER_APPEAL
        to: CORRECTED
        trigger: "POST /score-appeals/{score_appeal_id}/decisions with decision=UPHELD"
        actor: system
        preconditions:
          - "ScoreAppeal.status == FILED"
          - "corrected_raw_score supplied"
        side_effects:
          - "Registration.raw_score := ScoreAppeal.corrected_raw_score"
          - "Registration.score_status := CORRECTED"
          - "increments Registration.version by 1"
      - from: UNDER_APPEAL
        to: RELEASED
        trigger: "POST /score-appeals/{score_appeal_id}/decisions with decision=DENIED"
        actor: system
        preconditions:
          - "ScoreAppeal.status == FILED"
        side_effects:
          - "Registration.score_status := RELEASED"
          - "increments Registration.version by 1"
        note: Closes the appeal loop by returning the registration to its pre-appeal state.
      - from: SCORED
        to: INVALIDATED
        trigger: "system event: IrregularityReport adjudicated INVALIDATE_REGISTRATION or INVALIDATE_SESSION"
        actor: system
        preconditions:
          - "the adjudicated report names this registration or its session"
        side_effects:
          - "Registration.score_status := INVALIDATED"
          - "increments Registration.version by 1"
      - from: RELEASED
        to: INVALIDATED
        trigger: "system event: IrregularityReport adjudicated INVALIDATE_REGISTRATION or INVALIDATE_SESSION"
        actor: system
        preconditions:
          - "the adjudicated report names this registration or its session"
        side_effects:
          - "Registration.score_status := INVALIDATED"
          - "increments Registration.version by 1"
      - from: UNDER_APPEAL
        to: INVALIDATED
        trigger: "system event: IrregularityReport adjudicated INVALIDATE_REGISTRATION or INVALIDATE_SESSION"
        actor: system
        preconditions:
          - "the adjudicated report names this registration or its session"
        side_effects:
          - "Registration.score_status := INVALIDATED"
          - "the open ScoreAppeal on this registration remains FILED and must be decided before the window can finalize"
          - "increments Registration.version by 1"
      - from: CORRECTED
        to: INVALIDATED
        trigger: "system event: IrregularityReport adjudicated INVALIDATE_REGISTRATION or INVALIDATE_SESSION"
        actor: system
        preconditions:
          - "the adjudicated report names this registration or its session"
        side_effects:
          - "Registration.score_status := INVALIDATED"
          - "increments Registration.version by 1"
      - from: NOT_SCORED
        to: INVALIDATED
        trigger: "system event: IrregularityReport adjudicated INVALIDATE_SESSION"
        actor: system
        preconditions:
          - "the adjudicated report names this registration's session"
        side_effects:
          - "Registration.score_status := INVALIDATED"
          - "increments Registration.version by 1"
      - from: RELEASED
        to: FINAL
        trigger: "system event: owning TestWindow moved RELEASED -> FINALIZED"
        actor: system
        preconditions:
          - "TestWindow.status transitioning to FINALIZED"
        side_effects:
          - "Registration.score_status := FINAL"
          - "increments Registration.version by 1"
      - from: CORRECTED
        to: FINAL
        trigger: "system event: owning TestWindow moved RELEASED -> FINALIZED"
        actor: system
        preconditions:
          - "TestWindow.status transitioning to FINALIZED"
        side_effects:
          - "Registration.score_status := FINAL"
          - "increments Registration.version by 1"

  - entity: MaterialLot
    state_field: status
    initial_state: SHIPPED
    terminal_states: [RECONCILED, DISCREPANT]
    transitions:
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /material-lots/{material_lot_id}/custody-events with event_type=RECEIPT"
        actor: DistrictTestCoordinator
        preconditions:
          - "X-User-ID == MaterialLot.district_id"
          - "quantity == MaterialLot.quantity_shipped"
          - "no prior CustodyEvent exists on this lot"
        side_effects:
          - "CustodyEvent appended with from_holder_type STATE, to_holder_type DISTRICT, sequence_no 1"
          - "MaterialLot.quantity_at_district := quantity"
          - "MaterialLot.status := RECEIVED"
          - "MaterialLot.chain_accounted_count recomputed by calculations.material_reconciliation"
          - "increments MaterialLot.version by 1"
      - from: RECEIVED
        to: IN_DISTRIBUTION
        trigger: "POST /material-lots/{material_lot_id}/custody-events with event_type=TRANSFER_TO_SCHOOL"
        actor: SchoolTestCoordinator
        preconditions:
          - "School(X-User-ID).district_id == MaterialLot.district_id"
          - "quantity <= MaterialLot.quantity_at_district"
        side_effects:
          - "CustodyEvent appended with from_holder_type DISTRICT, to_holder_type SCHOOL"
          - "MaterialLot.quantity_at_district -= quantity; MaterialLot.quantity_at_school += quantity"
          - "MaterialLot.status := IN_DISTRIBUTION"
          - "increments MaterialLot.version by 1"
      - from: IN_DISTRIBUTION
        to: IN_DISTRIBUTION
        trigger: "POST /material-lots/{material_lot_id}/custody-events with event_type=SESSION_CHECKOUT or SESSION_CHECKIN"
        actor: Proctor
        preconditions:
          - "X-User-ID == Session(session_id).proctor_id"
          - "for SESSION_CHECKOUT: Session.status == SCHEDULED and quantity <= MaterialLot.quantity_at_school"
          - "for SESSION_CHECKIN: Session.status == ACTIVE and quantity <= Session.materials_checked_out - Session.materials_checked_in"
        side_effects:
          - "CustodyEvent appended moving booklets between the SCHOOL and SESSION buckets"
          - "Session.materials_checked_out or Session.materials_checked_in increased by quantity"
          - "MaterialLot.quantity_at_school and MaterialLot.quantity_in_sessions adjusted; MaterialLot.status stays IN_DISTRIBUTION"
          - "increments MaterialLot.version by 1"
        note: >-
          A self-loop on the lot's status; the observable movement lives in the bucket
          counters, not in the status field.
      - from: IN_DISTRIBUTION
        to: RETURNED_PENDING
        trigger: "POST /material-lots/{material_lot_id}/custody-events with event_type=RETURN_TO_DISTRICT"
        actor: SchoolTestCoordinator
        preconditions:
          - "School(X-User-ID).district_id == MaterialLot.district_id"
          - "MaterialLot.quantity_in_sessions == 0"
          - "quantity <= MaterialLot.quantity_at_school"
          - "MaterialLot.quantity_at_school - quantity == 0"
        side_effects:
          - "CustodyEvent appended with from_holder_type SCHOOL, to_holder_type DISTRICT"
          - "MaterialLot.quantity_at_school -= quantity; MaterialLot.quantity_at_district += quantity"
          - "MaterialLot.status := RETURNED_PENDING"
          - "increments MaterialLot.version by 1"
        note: >-
          Conditional transition: a partial return that leaves quantity_at_school > 0 is
          rejected by the fourth precondition, so the status only advances when the school
          bucket empties.
      - from: RETURNED_PENDING
        to: RETURNED_PENDING
        trigger: "POST /material-lots/{material_lot_id}/custody-events with event_type=DESTRUCTION"
        actor: DistrictTestCoordinator
        preconditions:
          - "X-User-ID == MaterialLot.district_id"
          - "quantity <= MaterialLot.quantity_at_district"
        side_effects:
          - "CustodyEvent appended with from_holder_type DISTRICT, to_holder_type DESTROYED"
          - "MaterialLot.quantity_at_district -= quantity; MaterialLot.quantity_destroyed += quantity"
          - "increments MaterialLot.version by 1"
      - from: RETURNED_PENDING
        to: RECONCILED
        trigger: "POST /material-lots/{material_lot_id}/reconciliations"
        actor: DistrictTestCoordinator
        preconditions:
          - "X-User-ID == MaterialLot.district_id"
          - "missing_count == 0 and chain_vs_declared_delta == 0 and broken_seal_count == 0"
        side_effects:
          - "MaterialLot.status := RECONCILED"
          - "MaterialLot.declared_accounted_count, chain_vs_declared_delta, missing_count, seal_broken_count, reconciled_at written"
          - "MaterialLot.replacement_charge_cents := 0"
          - "increments MaterialLot.version by 1"
      - from: RETURNED_PENDING
        to: DISCREPANT
        trigger: "POST /material-lots/{material_lot_id}/reconciliations"
        actor: DistrictTestCoordinator
        preconditions:
          - "X-User-ID == MaterialLot.district_id"
          - "missing_count > 0 or chain_vs_declared_delta != 0 or broken_seal_count > 0"
        side_effects:
          - "cascade hop 1: MaterialLot.status := DISCREPANT and replacement_charge_cents := calculations.lot_replacement_charge"
          - "cascade hop 2 (caused by hop 1): District.replacement_charge_total_cents, District.security_assessment_cents and District.open_discrepancy_count recomputed"
          - "cascade hop 3 (caused by hop 1): a system IrregularityReport is created with system_generated true, material_lot_id set, session_id null, category SECURITY_BREACH, severity HIGH and status SUBMITTED"
          - "cascade hop 4 (caused by hop 3): TestWindow(MaterialLot.window_id).open_breach_count recomputed and security_hold set to true"
          - "increments MaterialLot.version by 1"

  - entity: IrregularityReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [ADJUDICATED, WITHDRAWN]
    note: >-
      System-generated reports are created directly in SUBMITTED and skip DRAFT. The
      UNDER_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED loop is capped at MAX_RETURN_CYCLES.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=SUBMITTED"
        actor: Proctor
        preconditions:
          - "X-User-ID == IrregularityReport.reporter_proctor_id"
        side_effects:
          - "IrregularityReport.status := SUBMITTED"
          - "if category == SECURITY_BREACH: TestWindow.open_breach_count recomputed and security_hold set accordingly"
          - "increments IrregularityReport.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=WITHDRAWN"
        actor: Proctor
        preconditions:
          - "X-User-ID == IrregularityReport.reporter_proctor_id"
        side_effects:
          - "IrregularityReport.status := WITHDRAWN"
          - "increments IrregularityReport.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=UNDER_REVIEW"
        actor: StateAssessmentOfficer
        preconditions: []
        side_effects:
          - "IrregularityReport.status := UNDER_REVIEW"
          - "increments IrregularityReport.version by 1"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_INFO
        trigger: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=RETURNED_FOR_INFO"
        actor: StateAssessmentOfficer
        preconditions:
          - "IrregularityReport.system_generated == false"
          - "IrregularityReport.return_count < MAX_RETURN_CYCLES"
        side_effects:
          - "IrregularityReport.status := RETURNED_FOR_INFO"
          - "IrregularityReport.return_count += 1"
          - "increments IrregularityReport.version by 1"
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=SUBMITTED"
        actor: Proctor
        preconditions:
          - "X-User-ID == IrregularityReport.reporter_proctor_id"
        side_effects:
          - "IrregularityReport.status := SUBMITTED"
          - "increments IrregularityReport.version by 1"
        note: The revision loop back-edge.
      - from: UNDER_REVIEW
        to: ADJUDICATED
        trigger: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=ADJUDICATED and disposition=DISMISSED"
        actor: StateAssessmentOfficer
        preconditions: []
        side_effects:
          - "IrregularityReport.status := ADJUDICATED; disposition := DISMISSED; adjudicated_at := now"
          - "if material_lot_id is not null: MaterialLot.charge_reversed := true, then District.replacement_charge_total_cents, District.security_assessment_cents and District.open_discrepancy_count are recomputed"
          - "TestWindow.open_breach_count recomputed; security_hold recomputed"
          - "increments IrregularityReport.version by 1"
      - from: UNDER_REVIEW
        to: ADJUDICATED
        trigger: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=ADJUDICATED and disposition=INVALIDATE_REGISTRATION"
        actor: StateAssessmentOfficer
        preconditions:
          - "IrregularityReport.registration_id is not null"
          - "TestWindow scoped to the report has status != FINALIZED"
        side_effects:
          - "IrregularityReport.status := ADJUDICATED; disposition := INVALIDATE_REGISTRATION"
          - "Registration(registration_id).score_status := INVALIDATED"
          - "TestWindow.open_breach_count recomputed; security_hold recomputed"
          - "increments IrregularityReport.version by 1"
      - from: UNDER_REVIEW
        to: ADJUDICATED
        trigger: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=ADJUDICATED and disposition=INVALIDATE_SESSION"
        actor: StateAssessmentOfficer
        preconditions:
          - "IrregularityReport.session_id is not null"
          - "Session(session_id).status == CLOSED"
          - "TestWindow scoped to the report has status != FINALIZED"
        side_effects:
          - "IrregularityReport.status := ADJUDICATED; disposition := INVALIDATE_SESSION"
          - "Session(session_id).status := INVALIDATED"
          - "every Registration on that Session with score_status in {NOT_SCORED, SCORED, RELEASED, UNDER_APPEAL, CORRECTED} moves to INVALIDATED"
          - "TestWindow.open_breach_count recomputed; security_hold recomputed"
          - "increments IrregularityReport.version by 1"
      - from: UNDER_REVIEW
        to: ADJUDICATED
        trigger: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=ADJUDICATED and disposition=BREACH_CONFIRMED"
        actor: StateAssessmentOfficer
        preconditions:
          - "IrregularityReport.session_id is not null"
          - "Session(session_id).proctor_id is not null"
        side_effects:
          - "cascade hop 1: IrregularityReport.status := ADJUDICATED; disposition := BREACH_CONFIRMED"
          - "cascade hop 2 (caused by hop 1): the SecurityAffidavit with proctor_id == Session(session_id).proctor_id, window_id == Session(session_id).window_id and status ACTIVE moves to REVOKED with revoked_reason BREACH_CONFIRMED"
          - "cascade hop 3 (caused by hop 2): that Proctor gets revoked_at := now, strike_count += 1 and certification_status recomputed to REVOKED"
          - "cascade hop 4 (caused by hop 3): every Session with proctor_id == that proctor and status == SCHEDULED moves to CANCELLED"
          - "cascade hop 5 (caused by hop 4): every Registration on those cancelled Sessions with attendance_status == PENDING moves to WITHDRAWN"
          - "TestWindow.open_breach_count recomputed; security_hold recomputed"
          - "increments IrregularityReport.version by 1"

  - entity: SecurityAffidavit
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /security-affidavits for the same (proctor_id, window_id) pair"
        actor: system
        preconditions:
          - "a newer SecurityAffidavit was created for the same proctor_id and window_id"
        side_effects:
          - "SecurityAffidavit.status := SUPERSEDED"
          - "Proctor.latest_affidavit_id := id of the newer affidavit"
          - "increments SecurityAffidavit.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system event: IrregularityReport adjudicated with disposition BREACH_CONFIRMED"
        actor: system
        preconditions:
          - "the affidavit's proctor_id equals the breached Session's proctor_id and its window_id equals that Session's window_id"
        side_effects:
          - "SecurityAffidavit.status := REVOKED; revoked_reason := BREACH_CONFIRMED"
          - "increments SecurityAffidavit.version by 1"

  - entity: ScoreAppeal
    state_field: status
    initial_state: FILED
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /score-appeals/{score_appeal_id}/decisions with decision=UPHELD"
        actor: StateAssessmentOfficer
        preconditions:
          - "corrected_raw_score is supplied and within 0..100"
          - "Registration(registration_id).score_status == UNDER_APPEAL"
        side_effects:
          - "ScoreAppeal.status := UPHELD; corrected_raw_score written; decided_at := now"
          - "Registration.raw_score := corrected_raw_score; Registration.score_status := CORRECTED"
          - "increments ScoreAppeal.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /score-appeals/{score_appeal_id}/decisions with decision=DENIED"
        actor: StateAssessmentOfficer
        preconditions:
          - "Registration(registration_id).score_status == UNDER_APPEAL"
        side_effects:
          - "ScoreAppeal.status := DENIED; decided_at := now"
          - "Registration.score_status := RELEASED"
          - "increments ScoreAppeal.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: affidavit-supersede-stale-proctor
    parent_entity: Proctor
    write_endpoint: "POST /security-affidavits"
    occ_field: "expected_proctor_version"
    description: |
      Signing a security affidavit against a Proctor whose version has advanced since
      the client last observed it is rejected. Re-signing is a legitimate product
      operation (a new affidavit supersedes the prior ACTIVE one for the same window),
      so the write cannot be resolved by a state precondition; the stale version is the
      only signal that the client's view of the proctor predates another accepted
      affidavit or training update.
    error_id: ERR_STALE_PROCTOR_VERSION
    http_status: 412

  - rule_id: proctor-assignment-supersede-stale-session
    parent_entity: Session
    write_endpoint: "POST /sessions/{session_id}/proctor-assignments"
    occ_field: "expected_session_version"
    description: |
      Assigning a proctor to a Session whose version has advanced since the client last
      observed it is rejected. While the session is DRAFT a later assignment legitimately
      supersedes the earlier one, so a second write is not blocked by any state
      precondition; the stale version is what tells the server the caller never saw the
      assignment that is already in place.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: participation_rate
    trigger: >-
      The provisional variant runs on the TestWindow MAKEUP -> SCORING transition. The
      final variant runs on the TestWindow RELEASED -> FINALIZED transition, AFTER the
      RELEASED/CORRECTED -> FINAL score flip has been applied.
    algorithm: aggregation
    formula: |
      # Both variants count DISTINCT Registration.student_state_id, so a make-up seat
      # for a student already registered never inflates either side.
      #
      # ---- variant = provisional ------------------------------------------------
      D_prov = COUNT(DISTINCT R.student_state_id) over Registrations R where
                 Session(R.session_id).window_id == W.id
                 AND Session(R.session_id).status IN {SCHEDULED, ACTIVE, CLOSED}
                 AND R.attendance_status IN {PENDING, PRESENT, ABSENT, EXCUSED}
      N_prov = COUNT(DISTINCT R.student_state_id) over the SAME filtered set where
                 R.attendance_status == PRESENT
      participation_rate_provisional_pct =
          0.0                                   if D_prov == 0
          round_half_up(N_prov / D_prov * 100, 1)  otherwise
      #
      # ---- variant = final -------------------------------------------------------
      D_final = COUNT(DISTINCT R.student_state_id) over Registrations R where
                 Session(R.session_id).window_id == W.id
                 AND Session(R.session_id).status IN {SCHEDULED, ACTIVE, CLOSED, CANCELLED, INVALIDATED}
                 AND R.attendance_status IN {PENDING, PRESENT, ABSENT, EXCUSED, WITHDRAWN}
      N_final = COUNT(DISTINCT R.student_state_id) over the SAME filtered set where
                 R.score_status == FINAL
      participation_rate_final_pct =
          0.0                                     if D_final == 0
          round_half_up(N_final / D_final * 100, 1)  otherwise
      #
      # ---- rounding order is PINNED ----------------------------------------------
      # Aggregate first, round once. The window rate is NOT the average of per-school
      # rounded rates; per-school rates are never materialised.
      TestWindow.registered_distinct_count := the denominator of the variant just run
      TestWindow.present_distinct_count    := the numerator of the variant just run
    input_set: >-
      All Registrations reachable from the window through Session.window_id. The
      provisional variant excludes registrations sitting in CANCELLED or INVALIDATED
      sessions and excludes WITHDRAWN attendance; the final variant includes both.
    constants:
      PERCENT_DECIMAL_PLACES: 1
    precision: "1 decimal place, round_half_up; a zero denominator yields exactly 0.0"
    variants:
      - name: provisional
        when: TestWindow MAKEUP -> SCORING
        difference: >-
          Numerator is "showed up" (attendance_status == PRESENT) and the denominator
          ignores cancelled/invalidated sessions and withdrawn seats. A student who was
          PRESENT but whose score is invalidated later still counts here.
      - name: final
        when: TestWindow RELEASED -> FINALIZED
        difference: >-
          Numerator is "produced a usable score" (score_status == FINAL after the flip)
          and the denominator restores every seat the provisional variant dropped. For
          identical stored data the two variants return different percentages.

  - name: material_reconciliation
    trigger: >-
      The chain_replay variant runs after every CustodyEvent append. The declared_ledger
      variant runs once, on POST /material-lots/{material_lot_id}/reconciliations, and
      the two are compared to pick RECONCILED vs DISCREPANT.
    algorithm: chronological
    formula: |
      # ---- variant = chain_replay (chronological) --------------------------------
      # Replay this lot's CustodyEvents in sequence_no ASC order (sequence_no is a
      # server-assigned 1-based counter, never a random id) over four buckets that all
      # start at 0:
      at_district = at_school = in_sessions = destroyed = 0
      for e in CustodyEvents(lot) ordered by sequence_no ASC:
          if e.event_type == RECEIPT:            at_district += e.quantity
          if e.event_type == TRANSFER_TO_SCHOOL: at_district -= e.quantity; at_school   += e.quantity
          if e.event_type == SESSION_CHECKOUT:   at_school   -= e.quantity; in_sessions += e.quantity
          if e.event_type == SESSION_CHECKIN:    in_sessions -= e.quantity; at_school   += e.quantity
          if e.event_type == RETURN_TO_DISTRICT: at_school   -= e.quantity; at_district += e.quantity
          if e.event_type == DESTRUCTION:        at_district -= e.quantity; destroyed   += e.quantity
          e.chain_balance_after = at_district + at_school + in_sessions + destroyed
      MaterialLot.quantity_at_district = at_district
      MaterialLot.quantity_at_school   = at_school
      MaterialLot.quantity_in_sessions = in_sessions
      MaterialLot.quantity_destroyed   = destroyed
      MaterialLot.chain_accounted_count = at_district + destroyed
      #
      # CONSERVATION INVARIANT (holds after every event, forward or compensating):
      #   quantity_at_district + quantity_at_school + quantity_in_sessions
      #     + quantity_destroyed == quantity_shipped
      #
      # ---- variant = declared_ledger (aggregation) -------------------------------
      MaterialLot.declared_accounted_count = declared_returned_count + declared_destroyed_count
      MaterialLot.chain_vs_declared_delta  = chain_accounted_count - declared_accounted_count
      MaterialLot.missing_count            = max(0, quantity_shipped - declared_accounted_count)
      MaterialLot.seal_broken_count        = broken_seal_count
      #
      # ---- outcome selection ------------------------------------------------------
      status = RECONCILED  if missing_count == 0 AND chain_vs_declared_delta == 0
                              AND seal_broken_count == 0
               DISCREPANT  otherwise
    input_set: >-
      Every CustodyEvent whose material_lot_id is this lot, ordered by sequence_no ASC;
      plus the three declared counts supplied in the reconciliation request body.
    constants:
      SEQUENCE_START: 1
    precision: "integer booklet counts; no rounding"
    variants:
      - name: chain_replay
        when: after every custody append and again at reconciliation
        difference: >-
          Order-sensitive running accumulator over the physical movements the chain
          recorded; answers "where does the paper trail say the booklets are".
      - name: declared_ledger
        when: at reconciliation only
        difference: >-
          Order-free sum of the two counts the district declares on the reconciliation
          form; answers "how many did the district say it actually has". For the same
          lot the two answers can differ, and their difference IS chain_vs_declared_delta.

  - name: session_seat_pressure
    trigger: >-
      Runs on POST /registrations, on POST /registrations/{registration_id}/accommodation-codings,
      and whenever a Registration's attendance_status moves to or from WITHDRAWN.
    algorithm: threshold
    formula: |
      # Per-registration demand
      has_separate_setting(R) = ANY code in R.accommodation_codes whose ACCOMMODATION_CATALOG
                                entry has separate_setting == true
      R.seats_required = 1 + (SEPARATE_SETTING_SEAT_COST if has_separate_setting(R) else 0)
      #
      # Session-level demand and supply (evaluated over the post-change state)
      live(S)  = Registrations on S with attendance_status != WITHDRAWN
      S.separate_setting_count = COUNT(R in live(S) where has_separate_setting(R))
      S.seats_consumed         = SUM(R.seats_required for R in live(S))
      #
      proctor_span_penalty = max(0,
                                 ceil((S.separate_setting_count - PROCTOR_SPAN_FREE)
                                      / PROCTOR_SPAN_DIVISOR)) * PROCTOR_SPAN_SEAT_COST
      S.effective_seat_capacity = max(0,
                                      min(S.seat_capacity,
                                          School(S.school_id).max_concurrent_seats)
                                      - proctor_span_penalty)
      #
      # Gate: reject the request when S.seats_consumed > S.effective_seat_capacity.
      # Note the non-linearity: one additional separate-setting registration raises
      # seats_consumed by 3 AND can lower effective_seat_capacity by 4 in the same step.
    input_set: >-
      Registrations on the session with attendance_status != WITHDRAWN, the session's own
      seat_capacity, and the owning school's max_concurrent_seats.
    constants:
      SEPARATE_SETTING_SEAT_COST: 2
      PROCTOR_SPAN_FREE: 2
      PROCTOR_SPAN_DIVISOR: 3
      PROCTOR_SPAN_SEAT_COST: 4
    precision: "integers throughout; ceil() is applied to the exact rational quotient"

  - name: accommodation_review_routing
    trigger: "POST /registrations/{registration_id}/accommodation-codings"
    algorithm: constraint_propagation
    formula: |
      for code in submitted accommodation_codes:
          if code not in ACCOMMODATION_CATALOG: reject with ERR_INVALID_REQUEST
      tiers = { ACCOMMODATION_CATALOG[code].tier for code in submitted codes }
      if submitted codes is empty:
          Registration.accommodation_status := NONE
      elif SPECIALIZED in tiers:
          Registration.accommodation_status := REQUESTED     # district review required
      else:
          Registration.accommodation_status := APPROVED      # auto-approved
      Registration.accommodation_codes := submitted codes    # wholesale replacement
      then calculations.session_seat_pressure re-runs for the owning session
    input_set: "The exact code list supplied in the request body; previous codes are discarded."
    constants:
      ACCOMMODATION_CATALOG:
        EXTENDED_TIME:  { tier: STANDARD,    separate_setting: false }
        SMALL_GROUP:    { tier: STANDARD,    separate_setting: true }
        ASSISTIVE_TECH: { tier: STANDARD,    separate_setting: false }
        SEPARATE_ROOM:  { tier: SPECIALIZED, separate_setting: true }
        READ_ALOUD:     { tier: SPECIALIZED, separate_setting: false }
        SCRIBE:         { tier: SPECIALIZED, separate_setting: false }
        BRAILLE_FORM:   { tier: SPECIALIZED, separate_setting: true }
    precision: "exact set membership; no numeric rounding"

  - name: replacement_charge_ledger
    trigger: >-
      Runs on the MaterialLot RETURNED_PENDING -> DISCREPANT transition and again
      whenever a lot's charge_reversed flag flips.
    algorithm: tiered_pricing
    formula: |
      # ---- step 1: per-lot charge, ROUNDED HERE ----------------------------------
      SECURITY_MULTIPLIER(lot) = BROKEN_SEAL_MULTIPLIER if lot.seal_broken_count > 0
                                 else INTACT_SEAL_MULTIPLIER
      lot.replacement_charge_cents =
          round_half_up(lot.missing_count
                        * UNIT_REPLACEMENT_COST_CENTS
                        * SECURITY_MULTIPLIER(lot))          # integer cents, per lot
      #
      # ---- step 2: district roll-up, SUMMED AFTER ROUNDING ------------------------
      District.replacement_charge_total_cents =
          SUM(lot.replacement_charge_cents
              for lot in MaterialLots where lot.district_id == District.id
                                        AND lot.status == DISCREPANT
                                        AND lot.charge_reversed == false)
      District.open_discrepancy_count = COUNT(that same filtered lot set)
      #
      # ORDER IS PINNED: round each lot to whole cents FIRST, then sum the rounded
      # values. Summing the unrounded products and rounding once at the end is WRONG
      # and produces a different total (e.g. two lots each missing 3 booklets with
      # intact seals give 4688 + 4688 = 9376, not round(9375.0) = 9375).
    input_set: >-
      MaterialLots of the district whose status is DISCREPANT and whose charge_reversed
      is false; lots that were reversed by a DISMISSED breach adjudication drop out of
      the sum entirely.
    constants:
      UNIT_REPLACEMENT_COST_CENTS: 1250
      INTACT_SEAL_MULTIPLIER: 1.25
      BROKEN_SEAL_MULTIPLIER: 1.75
    precision: "whole cents, round_half_up, applied once per lot before summation"

  - name: district_security_assessment
    trigger: >-
      Runs immediately after calculations.replacement_charge_ledger, on every
      recomputation of District.replacement_charge_total_cents.
    algorithm: waterfall_allocation
    formula: |
      # The definition looks circular: the assessment is the gross minus a waiver, and
      # the waiver is a percentage that depends on which band the charge falls in. The
      # evaluation order below is PINNED and resolves it.
      #
      # step 1 - read the gross (already rounded and summed by replacement_charge_ledger)
      gross = District.replacement_charge_total_cents
      #
      # step 2 - select the waiver tier from the GROSS, never from the post-waiver net
      waiver_pct = 0.00   if gross < WAIVER_TIER_1_MIN_CENTS
                   0.10   if WAIVER_TIER_1_MIN_CENTS <= gross < WAIVER_TIER_2_MIN_CENTS
                   0.20   if gross >= WAIVER_TIER_2_MIN_CENTS
      #
      # step 3 - round the waiver once, then subtract
      waiver_cents = round_half_up(gross * waiver_pct)
      District.security_assessment_cents = gross - waiver_cents
      #
      # A net-keyed reading (pick the tier from security_assessment_cents) would move a
      # district that sits just above a band edge into the lower band and change the
      # answer; that reading is explicitly rejected.
    input_set: "District.replacement_charge_total_cents only."
    constants:
      WAIVER_TIER_1_MIN_CENTS: 5000
      WAIVER_TIER_2_MIN_CENTS: 20000
    precision: "whole cents, round_half_up on the waiver, subtraction exact"

  - name: proctor_certification_status
    trigger: >-
      Re-derived on every read of a Proctor and on every precondition that names
      certification_status (proctor assignment, session scheduling).
    algorithm: decay_function
    formula: |
      now = logical clock
      if Proctor.revoked_at is not null:
          certification_status = REVOKED
      elif Proctor.training_status != PASSED:
          certification_status = NOT_CERTIFIED
      elif now >= Proctor.training_completed_at + TRAINING_VALID_DAYS days:
          certification_status = EXPIRED
      else:
          certification_status = CERTIFIED
      #
      # training_status itself is written by POST /proctors/{proctor_id}/training-completions:
      #   training_status = PASSED  if quiz_score_pct >= MIN_QUIZ_SCORE_PCT     # >= not >
      #                     FAILED  otherwise
      #   quiz_score_pct        := the submitted score (always overwritten)
      #   training_completed_at := now, ONLY when the result is PASSED; a later FAILED
      #                            attempt leaves the previous PASSED timestamp intact
      #                            but flips training_status to FAILED.
    input_set: "The proctor's own most recent training completion plus the logical clock."
    constants:
      MIN_QUIZ_SCORE_PCT: 80.0
      TRAINING_VALID_DAYS: 365
    precision: "quiz_score_pct compared at 1 decimal place; the boundary value 80.0 PASSES"

  - name: report_distribution_selection
    trigger: "POST /test-windows/{window_id}/report-distribution-runs"
    algorithm: aggregation
    formula: |
      # Candidate set: every Registration reachable from the window through
      # Session.window_id, processed in created_at ASC order (id is never consulted).
      distributed = suppressed = skipped = 0
      for R in candidates ordered by created_at ASC:
          if R.report_delivery_status != NOT_QUEUED:
              skipped += 1;  continue                      # already handled by an earlier run
          elif R.score_status == INVALIDATED:
              R.report_delivery_status = SUPPRESSED
              R.report_suppressed_reason = INVALIDATED;      suppressed += 1
          elif R.score_status == UNDER_APPEAL:
              R.report_delivery_status = SUPPRESSED
              R.report_suppressed_reason = UNDER_APPEAL;     suppressed += 1
          elif R.score_status in {RELEASED, CORRECTED}:
              if R.guardian_email is null or empty:
                  R.report_delivery_status = SUPPRESSED
                  R.report_suppressed_reason = MISSING_GUARDIAN_EMAIL; suppressed += 1
              else:
                  R.report_delivery_status = DELIVERED
                  R.report_delivered_at = now;               distributed += 1
          else:                                              # NOT_SCORED, SCORED, FINAL
              skipped += 1
      response = { distributed_count: distributed,
                   suppressed_count: suppressed,
                   skipped_count: skipped,
                   window_id: W.id }
      # An empty candidate set is not an error: the run returns 0/0/0 with HTTP 200.
    input_set: >-
      Registrations of the window in every score_status; the branch order above is the
      pinned precedence (already-handled beats invalidated beats under-appeal beats
      deliverable).
    constants:
      RERUN_IS_IDEMPOTENT_FOR_HANDLED_ROWS: true
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST rule that fails determines the response error_id and status)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: >-
      X-User-ID and X-User-Role headers are both present and non-empty, and X-User-Role
      is one of StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator,
      Proctor.
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: >-
      The caller's role appears in the endpoint's roles list, AND — for the two
      multiplexing endpoints — the requested sub-operation is one this role owns:
      POST /sessions/{session_id}/transitions allows SchoolTestCoordinator only for
      to_status in {SCHEDULED, CANCELLED} and Proctor only for to_status in
      {ACTIVE, CLOSED}; POST /irregularity-reports/{irregularity_report_id}/transitions
      allows Proctor only for to_status in {SUBMITTED, WITHDRAWN} and
      StateAssessmentOfficer only for to_status in {UNDER_REVIEW, RETURNED_FOR_INFO,
      ADJUDICATED}; POST /material-lots/{material_lot_id}/custody-events allows
      DistrictTestCoordinator only for event_type in {RECEIPT, DESTRUCTION},
      SchoolTestCoordinator only for event_type in {TRANSFER_TO_SCHOOL,
      RETURN_TO_DISTRICT} and Proctor only for event_type in {SESSION_CHECKOUT,
      SESSION_CHECKIN}.
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: >-
      Every path-parameter resource resolves, checked left to right. Emits
      ERR_DISTRICT_NOT_FOUND, ERR_SCHOOL_NOT_FOUND, ERR_TEST_WINDOW_NOT_FOUND,
      ERR_PROCTOR_NOT_FOUND, ERR_SECURITY_AFFIDAVIT_NOT_FOUND, ERR_SESSION_NOT_FOUND,
      ERR_REGISTRATION_NOT_FOUND, ERR_MATERIAL_LOT_NOT_FOUND,
      ERR_CUSTODY_EVENT_NOT_FOUND, ERR_IRREGULARITY_REPORT_NOT_FOUND or
      ERR_SCORE_APPEAL_NOT_FOUND depending on which segment failed.
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path parameters

  - priority: 4
    category: auth
    check: >-
      The acting principal's scope covers the target. SchoolTestCoordinator: X-User-ID
      must equal the School.id the target belongs to (School(school_id) on session
      creation and proctor creation, Session.school_id on session and registration
      writes, and for custody events School(X-User-ID).district_id must equal
      MaterialLot.district_id). DistrictTestCoordinator: X-User-ID must equal
      MaterialLot.district_id for lot writes and
      School(Session(Registration.session_id).school_id).district_id for accommodation
      decisions. Proctor: X-User-ID must equal Session.proctor_id for session
      transitions, attendance and session custody events, must equal the proctor_id in
      the affidavit body, and must equal IrregularityReport.reporter_proctor_id for
      report transitions.
    error_id: ERR_SCOPE_VIOLATION
    http_status: 403
    applies_to: >-
      POST /schools, POST /proctors, POST /proctors/{proctor_id}/training-completions,
      POST /security-affidavits, POST /sessions,
      POST /sessions/{session_id}/proctor-assignments,
      POST /sessions/{session_id}/transitions, POST /registrations,
      POST /registrations/{registration_id}/accommodation-codings,
      POST /registrations/{registration_id}/accommodation-decisions,
      POST /registrations/{registration_id}/attendance,
      POST /material-lots/{material_lot_id}/custody-events,
      POST /material-lots/{material_lot_id}/reconciliations, POST /irregularity-reports,
      POST /irregularity-reports/{irregularity_report_id}/transitions, POST /score-appeals

  - priority: 5
    category: business_constraint
    check: >-
      Request body is well formed: every required field present, every enum value a
      declared member, every numeric field inside its declared range, every string
      matching its declared pattern, datetime fields parseable ISO 8601 UTC, and the
      cross-field arithmetic rules hold (TestWindow.window_end > window_start,
      makeup_start >= window_end, makeup_end > makeup_start; Session.scheduled_end >
      scheduled_start; MaterialLot.seal_range_end - seal_range_start + 1 ==
      quantity_shipped; CustodyEvent.sealed_count <= quantity; CustodyEvent.session_id
      present exactly for SESSION_CHECKOUT and SESSION_CHECKIN; accommodation_codes
      contains no duplicates, at most 5 entries and only catalogued codes;
      ScoreAppeal decision UPHELD requires corrected_raw_score).
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: existence
    check: >-
      Every id supplied in the request body resolves to an existing resource
      (School.district_id, Session.window_id, Session.school_id,
      proctor-assignments.proctor_id, SecurityAffidavit.proctor_id and window_id,
      Registration.session_id and makeup_of_registration_id, MaterialLot.window_id and
      district_id, CustodyEvent.session_id, IrregularityReport.session_id and
      registration_id, ScoreAppeal.registration_id).
    error_id: ERR_REGISTRATION_NOT_FOUND
    http_status: 404
    applies_to: all write endpoints carrying id fields in the body

  - priority: 7
    category: business_constraint
    check: >-
      For POST /security-affidavits, expected_proctor_version equals the current
      Proctor.version; for POST /sessions/{session_id}/proctor-assignments,
      expected_session_version equals the current Session.version.
    error_id: ERR_STALE_PROCTOR_VERSION
    http_status: 412
    applies_to: >-
      POST /security-affidavits, POST /sessions/{session_id}/proctor-assignments

  - priority: 8
    category: state
    check: >-
      The target resource's own status permits the operation. Emits
      ERR_SESSION_NOT_ACCEPTING_REGISTRATIONS when a registration or accommodation
      coding targets a Session whose status is not DRAFT or SCHEDULED;
      ERR_LOT_NOT_AWAITING_RECONCILIATION when a reconciliation targets a lot whose
      status is not RETURNED_PENDING; ERR_SCORE_NOT_RELEASED when an appeal is filed
      against a Registration whose score_status is not RELEASED, or a decision targets an
      appeal whose status is not FILED; ERR_INVALID_STATE_TRANSITION for every other
      state-machine edge that is not declared in §1.2 (including repeating a transition
      that already happened, acting on a terminal state, and requesting a declared edge
      whose precondition on the target resource's OWN fields is unmet - for example
      DRAFT -> SCHEDULED while Session.proctor_id is still null).
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: all state-changing endpoints

  - priority: 9
    category: state
    check: >-
      The governing TestWindow phase permits the operation: session creation and
      DRAFT -> SCHEDULED and SCHEDULED -> ACTIVE require status OPEN for INITIAL
      sessions and MAKEUP for MAKEUP sessions; POST /registrations/{id}/scores requires
      SCORING; POST /score-appeals requires RELEASED;
      POST /test-windows/{window_id}/report-distribution-runs requires RELEASED.
    error_id: ERR_WINDOW_PHASE_INVALID
    http_status: 409
    applies_to: >-
      POST /sessions, POST /sessions/{session_id}/transitions, POST /registrations,
      POST /registrations/{registration_id}/scores, POST /score-appeals,
      POST /test-windows/{window_id}/report-distribution-runs

  - priority: 10
    category: business_safety
    check: >-
      The proctor being assigned, or already assigned to the session being scheduled,
      has certification_status == CERTIFIED (NOT_CERTIFIED, EXPIRED and REVOKED all
      fail).
    error_id: ERR_PROCTOR_NOT_CERTIFIED
    http_status: 422
    applies_to: >-
      POST /sessions/{session_id}/proctor-assignments,
      POST /sessions/{session_id}/transitions with to_status=SCHEDULED

  - priority: 11
    category: business_safety
    check: >-
      A SecurityAffidavit with status ACTIVE exists for the pair (proctor being assigned
      or already assigned, Session.window_id).
    error_id: ERR_AFFIDAVIT_MISSING
    http_status: 422
    applies_to: >-
      POST /sessions/{session_id}/proctor-assignments,
      POST /sessions/{session_id}/transitions with to_status=SCHEDULED

  - priority: 12
    category: business_safety
    check: >-
      Chain-of-custody continuity: the submitted event_type is legal for the lot's
      current status and its required predecessor exists (TRANSFER_TO_SCHOOL before
      RECEIPT, a second RECEIPT, SESSION_CHECKOUT against a session that is not
      SCHEDULED, SESSION_CHECKIN with no open checkout on that session,
      RETURN_TO_DISTRICT while quantity_in_sessions > 0 or leaving quantity_at_school
      above zero, and DESTRUCTION before RETURNED_PENDING all fail here).
    error_id: ERR_CUSTODY_CHAIN_BROKEN
    http_status: 422
    applies_to: POST /material-lots/{material_lot_id}/custody-events

  - priority: 13
    category: business_safety
    check: >-
      Booklet availability: the source bucket holds at least `quantity` booklets, and
      SCHEDULED -> ACTIVE requires Session.materials_checked_out -
      Session.materials_checked_in to be at least the number of Registrations on the
      session whose attendance_status is not WITHDRAWN.
    error_id: ERR_INSUFFICIENT_MATERIALS
    http_status: 422
    applies_to: >-
      POST /material-lots/{material_lot_id}/custody-events,
      POST /sessions/{session_id}/transitions with to_status=ACTIVE

  - priority: 14
    category: business_referential
    check: >-
      Segregation of duties: when makeup_of_registration_id is supplied, the make-up
      Session's proctor_id must differ from the proctor_id of the Session that held the
      original registration (when both are non-null).
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: POST /registrations

  - priority: 15
    category: business_referential
    check: >-
      Make-up linkage eligibility: the original registration has the same
      student_state_id, sits in the same TestWindow, has attendance_status in
      {ABSENT, EXCUSED} or score_status == INVALIDATED, and the target session has
      session_type == MAKEUP.
    error_id: ERR_MAKEUP_NOT_ELIGIBLE
    http_status: 422
    applies_to: POST /registrations

  - priority: 16
    category: business_temporal
    check: >-
      The session interval lies inside its phase bounds: an INITIAL session requires
      window_start <= scheduled_start and scheduled_end <= window_end; a MAKEUP session
      requires makeup_start <= scheduled_start and scheduled_end <= makeup_end.
    error_id: ERR_SESSION_OUTSIDE_WINDOW
    http_status: 422
    applies_to: POST /sessions

  - priority: 17
    category: business_temporal
    check: >-
      Room occupancy conflict on the (school_id, room_code) resource, using HALF-OPEN
      intervals widened by a mandatory turnover buffer: the new session conflicts with an
      existing session at the same school and room whose status is in
      {DRAFT, SCHEDULED, ACTIVE, CLOSED} exactly when
      new.scheduled_start < existing.scheduled_end + ROOM_TURNOVER_BUFFER_MINUTES
      AND existing.scheduled_start < new.scheduled_end + ROOM_TURNOVER_BUFFER_MINUTES.
      A start that lands exactly on existing.scheduled_end + buffer does NOT conflict.
    error_id: ERR_ROOM_TIME_CONFLICT
    http_status: 409
    applies_to: POST /sessions

  - priority: 18
    category: business_temporal
    check: >-
      Proctor availability conflict on the Proctor resource, using CLOSED intervals with
      NO buffer and spanning every school and every window: the assignment conflicts with
      an existing session already assigned to the same proctor whose status is in
      {DRAFT, SCHEDULED, ACTIVE} exactly when
      new.scheduled_start <= existing.scheduled_end
      AND existing.scheduled_start <= new.scheduled_end.
      Touching endpoints (new.start == existing.end) DO conflict.
    error_id: ERR_PROCTOR_TIME_CONFLICT
    http_status: 409
    applies_to: POST /sessions/{session_id}/proctor-assignments

  - priority: 19
    category: business_temporal
    check: >-
      Logical-clock gates on transitions: PLANNED -> OPEN needs now < window_end;
      OPEN -> MAKEUP needs now >= window_end; MAKEUP -> SCORING needs now >= makeup_end;
      RELEASED -> FINALIZED needs now >= appeal_window_closes_at; SCHEDULED -> ACTIVE
      needs scheduled_start - SESSION_START_GRACE_MINUTES <= now <= scheduled_end.
    error_id: ERR_TIMING_PRECONDITION_NOT_MET
    http_status: 422
    applies_to: >-
      POST /test-windows/{window_id}/transitions, POST /sessions/{session_id}/transitions

  - priority: 20
    category: business_temporal
    check: >-
      An appeal may only be filed while the logical clock is strictly before
      TestWindow.appeal_window_closes_at.
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: POST /score-appeals

  - priority: 21
    category: business_constraint
    check: >-
      Code uniqueness: District.district_code unique globally, School.school_code unique
      within its district, MaterialLot.lot_code unique globally.
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /districts, POST /schools, POST /material-lots"

  - priority: 22
    category: business_constraint
    check: >-
      Registration uniqueness: at most one registration per (TestWindow,
      student_state_id) among registrations whose makeup_of_registration_id is null and
      whose attendance_status is not WITHDRAWN; and at most one make-up registration per
      original registration.
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: POST /registrations

  - priority: 23
    category: business_constraint
    check: >-
      After applying the request, Session.seats_consumed must not exceed
      Session.effective_seat_capacity as computed by calculations.session_seat_pressure.
    error_id: ERR_SESSION_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: >-
      POST /registrations, POST /registrations/{registration_id}/accommodation-codings

  - priority: 24
    category: business_constraint
    check: >-
      No Registration on the session may still have accommodation_status == REQUESTED
      when the session is activated.
    error_id: ERR_ACCOMMODATION_NOT_APPROVED
    http_status: 422
    applies_to: "POST /sessions/{session_id}/transitions with to_status=ACTIVE"

  - priority: 25
    category: business_constraint
    check: >-
      A report may be returned for more information at most MAX_RETURN_CYCLES times;
      the next attempt is rejected while the report stays in UNDER_REVIEW.
    error_id: ERR_RETURN_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status=RETURNED_FOR_INFO"

  - priority: 26
    category: business_fiscal
    check: >-
      SCORING -> RELEASED requires participation_rate_provisional_pct >=
      min_participation_pct (compared with >=, so an exact match passes).
    error_id: ERR_PARTICIPATION_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /test-windows/{window_id}/transitions with to_status=RELEASED"

  - priority: 27
    category: business_fiscal
    check: "SCORING -> RELEASED requires TestWindow.security_hold == false."
    error_id: ERR_SECURITY_HOLD_ACTIVE
    http_status: 422
    applies_to: "POST /test-windows/{window_id}/transitions with to_status=RELEASED"

# =============================================================================
# §1.5 API Endpoint Table
# All list endpoints accept `limit` and `offset` and default to created_at ASC.
# =============================================================================
endpoints:

  # --- organisation -----------------------------------------------------------
  - method: POST
    path: "/districts"
    description: Register a district in the state testing program.
    roles: [StateAssessmentOfficer]
    code: 201
    input: [name, district_code, state_code]
    output: District
    side_effects:
      - "District created with replacement_charge_total_cents 0, security_assessment_cents 0, open_discrepancy_count 0"

  - method: GET
    path: "/districts/{district_id}"
    description: Read one district including its live charge ledger fields.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: POST
    path: "/schools"
    description: Register a school under a district.
    roles: [StateAssessmentOfficer]
    code: 201
    input: [district_id, name, school_code, max_concurrent_seats]
    output: School
    side_effects: []

  - method: GET
    path: "/schools/{school_id}"
    description: Read one school.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/schools"
    description: List schools, optionally narrowed to one district (FK reverse lookup for School.district_id).
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["district_id?", "limit?", "offset?"]
    output: School[]
    side_effects: []

  # --- test windows -----------------------------------------------------------
  - method: POST
    path: "/test-windows"
    description: Create a test window with its initial, make-up and appeal periods.
    roles: [StateAssessmentOfficer]
    code: 201
    input: ["name", "subject", "grade_band", "window_start", "window_end", "makeup_start", "makeup_end", "appeal_window_days?", "min_participation_pct?"]
    output: TestWindow
    side_effects:
      - "TestWindow created in status PLANNED with security_hold false and open_breach_count 0"

  - method: GET
    path: "/test-windows/{window_id}"
    description: Read one test window including both participation variants and the security hold.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: TestWindow
    side_effects: []

  - method: GET
    path: "/test-windows"
    description: List test windows.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["subject?", "grade_band?", "status?", "limit?", "offset?"]
    output: TestWindow[]
    side_effects: []

  - method: POST
    path: "/test-windows/{window_id}/transitions"
    description: >-
      Drive the window through its lifecycle. to_status is one of OPEN, PLANNED, MAKEUP,
      SCORING, RELEASED, FINALIZED, CANCELLED; each edge is declared in §1.2.
    roles: [StateAssessmentOfficer]
    code: 200
    input: ["to_status", "reason?"]
    output: TestWindow
    side_effects:
      - "applies the §1.2 TestWindow transition side effects for the requested edge"
      - "runs calculations.participation_rate (provisional on MAKEUP->SCORING, final on RELEASED->FINALIZED)"
      - "cascades registration score_status flips on RELEASED and FINALIZED"
      - "cascades session cancellation and registration withdrawal on the OPEN->PLANNED revert"
      - "increments TestWindow.version by 1"

  - method: POST
    path: "/test-windows/{window_id}/report-distribution-runs"
    description: >-
      Distribute family score reports for every registration in a RELEASED window,
      applying calculations.report_distribution_selection. Returns per-outcome counts;
      an empty candidate set returns zeros with HTTP 200.
    roles: [StateAssessmentOfficer]
    code: 200
    input: []
    output: { distributed_count: integer, suppressed_count: integer, skipped_count: integer, window_id: string }
    side_effects:
      - "sets Registration.report_delivery_status, report_suppressed_reason and report_delivered_at for every candidate"
      - "increments Registration.version by 1 for each registration it touches"

  # --- secure materials and chain of custody ----------------------------------
  - method: POST
    path: "/material-lots"
    description: Ship a secure booklet lot from the state to a district for a window.
    roles: [StateAssessmentOfficer]
    code: 201
    input: [window_id, district_id, lot_code, quantity_shipped, seal_range_start, seal_range_end]
    output: MaterialLot
    side_effects:
      - "MaterialLot created in status SHIPPED with all four custody buckets at 0"

  - method: GET
    path: "/material-lots/{material_lot_id}"
    description: Read one lot including its four custody buckets and reconciliation outcome.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: MaterialLot
    side_effects: []

  - method: GET
    path: "/material-lots"
    description: List lots, optionally by window or district (FK reverse lookup for MaterialLot.window_id and MaterialLot.district_id).
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["window_id?", "district_id?", "status?", "limit?", "offset?"]
    output: MaterialLot[]
    side_effects: []

  - method: POST
    path: "/material-lots/{material_lot_id}/custody-events"
    description: >-
      Append one movement to the lot's custody chain. event_type must match the caller's
      role per validation priority 2; session_id is required for SESSION_CHECKOUT and
      SESSION_CHECKIN and forbidden otherwise.
    roles: [DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 201
    input: ["event_type", "quantity", "sealed_count", "session_id?", "note?"]
    output: CustodyEvent
    side_effects:
      - "CustodyEvent appended with server-assigned sequence_no, previous_event_id, holder types, actor_user_id, actor_role and occurred_at"
      - "re-runs calculations.material_reconciliation variant=chain_replay over the whole chain"
      - "updates MaterialLot bucket counters, chain_accounted_count and status"
      - "updates Session.materials_checked_out or Session.materials_checked_in for session events"
      - "increments MaterialLot.version by 1"

  - method: GET
    path: "/custody-events/{custody_event_id}"
    description: Read one custody-chain entry.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: CustodyEvent
    side_effects: []

  - method: GET
    path: "/custody-events"
    description: >-
      List custody events (FK reverse lookup for CustodyEvent.material_lot_id,
      CustodyEvent.session_id and the self-referential CustodyEvent.previous_event_id).
      Ordered by sequence_no ASC within a lot.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["material_lot_id?", "session_id?", "previous_event_id?", "event_type?", "limit?", "offset?"]
    output: CustodyEvent[]
    side_effects: []

  - method: POST
    path: "/material-lots/{material_lot_id}/reconciliations"
    description: >-
      Close out a returned lot by declaring what the district actually has. Compares the
      declared ledger with the chronological chain replay and lands the lot in
      RECONCILED or DISCREPANT.
    roles: [DistrictTestCoordinator]
    code: 200
    input: [declared_returned_count, declared_destroyed_count, broken_seal_count]
    output: MaterialLot
    side_effects:
      - "runs calculations.material_reconciliation variant=declared_ledger"
      - "on DISCREPANT: runs calculations.replacement_charge_ledger and calculations.district_security_assessment"
      - "on DISCREPANT: creates a system IrregularityReport in SUBMITTED and raises the window's security hold"
      - "increments MaterialLot.version by 1"

  # --- proctors, training and affidavits --------------------------------------
  - method: POST
    path: "/proctors"
    description: Add a proctor to a school roster.
    roles: [SchoolTestCoordinator]
    code: 201
    input: [school_id, full_name, email]
    output: Proctor
    side_effects:
      - "Proctor created with training_status NOT_TRAINED and certification_status NOT_CERTIFIED"

  - method: GET
    path: "/proctors/{proctor_id}"
    description: Read one proctor with certification_status re-derived against the logical clock.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: Proctor
    side_effects: []

  - method: GET
    path: "/proctors"
    description: List proctors (FK reverse lookup for Proctor.school_id).
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["school_id?", "certification_status?", "limit?", "offset?"]
    output: Proctor[]
    side_effects: []

  - method: POST
    path: "/proctors/{proctor_id}/training-completions"
    description: >-
      Record a test-security training attempt. quiz_score_pct >= MIN_QUIZ_SCORE_PCT
      passes; the boundary value itself passes.
    roles: [SchoolTestCoordinator]
    code: 200
    input: [module_version, quiz_score_pct]
    output: Proctor
    side_effects:
      - "writes Proctor.quiz_score_pct and Proctor.training_status"
      - "writes Proctor.training_completed_at only when the attempt passes"
      - "re-derives Proctor.certification_status via calculations.proctor_certification_status"
      - "increments Proctor.version by 1"

  - method: POST
    path: "/security-affidavits"
    description: >-
      Sign the test-security affidavit for one window. A new affidavit supersedes the
      prior ACTIVE affidavit for the same (proctor_id, window_id) pair; the caller must
      supply the Proctor version it last observed.
    roles: [Proctor]
    code: 201
    input: [proctor_id, window_id, affidavit_version, expected_proctor_version]
    output: SecurityAffidavit
    side_effects:
      - "any prior ACTIVE SecurityAffidavit for the same (proctor_id, window_id) moves to SUPERSEDED"
      - "sets Proctor.latest_affidavit_id to the new affidavit"
      - "increments Proctor.version by 1"

  - method: GET
    path: "/security-affidavits/{security_affidavit_id}"
    description: Read one affidavit.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: SecurityAffidavit
    side_effects: []

  - method: GET
    path: "/security-affidavits"
    description: >-
      List affidavits (FK reverse lookup for SecurityAffidavit.proctor_id and
      SecurityAffidavit.window_id).
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["proctor_id?", "window_id?", "status?", "limit?", "offset?"]
    output: SecurityAffidavit[]
    side_effects: []

  # --- sessions ---------------------------------------------------------------
  - method: POST
    path: "/sessions"
    description: >-
      Create a test session in a window. The room occupancy check (half-open intervals
      widened by ROOM_TURNOVER_BUFFER_MINUTES) runs here.
    roles: [SchoolTestCoordinator]
    code: 201
    input: ["window_id", "school_id", "room_code", "scheduled_start", "scheduled_end", "seat_capacity", "session_type?"]
    output: Session
    side_effects:
      - "Session created in DRAFT with proctor_id null, seats_consumed 0 and effective_seat_capacity from calculations.session_seat_pressure"

  - method: GET
    path: "/sessions/{session_id}"
    description: Read one session including its seat pressure and material counters.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: GET
    path: "/sessions"
    description: >-
      List sessions (FK reverse lookup for Session.window_id, Session.school_id and
      Session.proctor_id).
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["window_id?", "school_id?", "proctor_id?", "status?", "session_type?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: POST
    path: "/sessions/{session_id}/proctor-assignments"
    description: >-
      Assign (or reassign) the proctor of a DRAFT session. Runs the certification,
      affidavit and closed-interval proctor availability checks, and requires the Session
      version the caller last observed.
    roles: [SchoolTestCoordinator]
    code: 200
    input: [proctor_id, expected_session_version]
    output: Session
    side_effects:
      - "Session.proctor_id := proctor_id, replacing any previous assignment"
      - "increments Session.version by 1"

  - method: POST
    path: "/sessions/{session_id}/transitions"
    description: >-
      Move a session through its lifecycle. to_status is one of SCHEDULED, ACTIVE,
      CLOSED, CANCELLED; the caller's role must own the requested edge.
    roles: [SchoolTestCoordinator, Proctor]
    code: 200
    input: ["to_status", "reason?"]
    output: Session
    side_effects:
      - "applies the §1.2 Session transition side effects for the requested edge"
      - "on CANCELLED: withdraws every PENDING registration and re-runs calculations.session_seat_pressure"
      - "increments Session.version by 1"

  # --- registrations, accommodations, attendance, scores ----------------------
  - method: POST
    path: "/registrations"
    description: >-
      Register a student into a session. Supplying makeup_of_registration_id creates a
      make-up seat, which triggers the segregation-of-duties and eligibility checks.
    roles: [SchoolTestCoordinator]
    code: 201
    input: ["session_id", "student_state_id", "grade", "guardian_email?", "makeup_of_registration_id?"]
    output: Registration
    side_effects:
      - "Registration created with attendance_status PENDING, accommodation_status NONE, score_status NOT_SCORED, report_delivery_status NOT_QUEUED and seats_required 1"
      - "re-runs calculations.session_seat_pressure for the owning session"
      - "increments Session.version by 1"

  - method: GET
    path: "/registrations/{registration_id}"
    description: Read one registration with all three of its state dimensions.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/registrations"
    description: >-
      List registrations (FK reverse lookup for Registration.session_id and the
      self-referential Registration.makeup_of_registration_id).
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["session_id?", "student_state_id?", "makeup_of_registration_id?", "attendance_status?", "score_status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  - method: POST
    path: "/registrations/{registration_id}/accommodation-codings"
    description: >-
      Replace the registration's accommodation code list. STANDARD-only lists
      auto-approve; any SPECIALIZED code routes the registration to district review.
    roles: [SchoolTestCoordinator]
    code: 200
    input: [accommodation_codes]
    output: Registration
    side_effects:
      - "runs calculations.accommodation_review_routing"
      - "re-runs calculations.session_seat_pressure for the owning session"
      - "increments Registration.version by 1"

  - method: POST
    path: "/registrations/{registration_id}/accommodation-decisions"
    description: >-
      District ruling on a REQUESTED accommodation package. decision is APPROVE or
      REJECT. The coding coordinator may never call this endpoint.
    roles: [DistrictTestCoordinator]
    code: 200
    input: ["decision", "note?"]
    output: Registration
    side_effects:
      - "Registration.accommodation_status := APPROVED or REJECTED; accommodation_decision_note written"
      - "increments Registration.version by 1"

  - method: POST
    path: "/registrations/{registration_id}/attendance"
    description: Record attendance during an ACTIVE session. attendance_status is PRESENT, ABSENT or EXCUSED.
    roles: [Proctor]
    code: 200
    input: [attendance_status]
    output: Registration
    side_effects:
      - "Registration.attendance_status updated"
      - "increments Registration.version by 1"

  - method: POST
    path: "/registrations/{registration_id}/scores"
    description: Record the raw score for a PRESENT test taker while the window is in SCORING.
    roles: [StateAssessmentOfficer]
    code: 200
    input: [raw_score]
    output: Registration
    side_effects:
      - "Registration.raw_score written and score_status := SCORED"
      - "increments Registration.version by 1"

  # --- irregularities ---------------------------------------------------------
  - method: POST
    path: "/irregularity-reports"
    description: >-
      File a testing irregularity against a session, optionally naming one registration.
      The report starts in DRAFT with reporter_proctor_id set from X-User-ID.
    roles: [Proctor]
    code: 201
    input: ["session_id", "registration_id?", "category", "severity", "narrative"]
    output: IrregularityReport
    side_effects:
      - "IrregularityReport created in DRAFT with system_generated false, return_count 0 and reporter_proctor_id from X-User-ID"

  - method: GET
    path: "/irregularity-reports/{irregularity_report_id}"
    description: Read one irregularity report.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: IrregularityReport
    side_effects: []

  - method: GET
    path: "/irregularity-reports"
    description: >-
      List irregularity reports (FK reverse lookup for IrregularityReport.session_id,
      registration_id, reporter_proctor_id and material_lot_id). This is the only way to
      discover the system-generated report a lot discrepancy creates.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["session_id?", "registration_id?", "reporter_proctor_id?", "material_lot_id?", "status?", "category?", "limit?", "offset?"]
    output: IrregularityReport[]
    side_effects: []

  - method: POST
    path: "/irregularity-reports/{irregularity_report_id}/transitions"
    description: >-
      Move a report through submission, review, the return-for-info loop and
      adjudication. to_status is one of SUBMITTED, WITHDRAWN, UNDER_REVIEW,
      RETURNED_FOR_INFO, ADJUDICATED; disposition is required when to_status is
      ADJUDICATED.
    roles: [Proctor, StateAssessmentOfficer]
    code: 200
    input: ["to_status", "disposition?", "note?"]
    output: IrregularityReport
    side_effects:
      - "applies the §1.2 IrregularityReport transition side effects for the requested edge"
      - "ADJUDICATED runs the disposition-specific cascade (dismissal reverses a lot charge; INVALIDATE_REGISTRATION and INVALIDATE_SESSION flip score_status; BREACH_CONFIRMED revokes the affidavit, decertifies the proctor, cancels their SCHEDULED sessions and withdraws those registrations)"
      - "recomputes TestWindow.open_breach_count and TestWindow.security_hold"
      - "increments IrregularityReport.version by 1"

  # --- score appeals ----------------------------------------------------------
  - method: POST
    path: "/score-appeals"
    description: File a data appeal against a released score inside the appeal window.
    roles: [SchoolTestCoordinator, DistrictTestCoordinator]
    code: 201
    input: [registration_id, reason_code, narrative]
    output: ScoreAppeal
    side_effects:
      - "ScoreAppeal created in FILED with filed_by_role, filed_by_user_id and filed_at from the request context"
      - "Registration.score_status := UNDER_APPEAL"
      - "increments Registration.version by 1"

  - method: GET
    path: "/score-appeals/{score_appeal_id}"
    description: Read one appeal.
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: []
    output: ScoreAppeal
    side_effects: []

  - method: GET
    path: "/score-appeals"
    description: List appeals (FK reverse lookup for ScoreAppeal.registration_id).
    roles: [StateAssessmentOfficer, DistrictTestCoordinator, SchoolTestCoordinator, Proctor]
    code: 200
    input: ["registration_id?", "status?", "limit?", "offset?"]
    output: ScoreAppeal[]
    side_effects: []

  - method: POST
    path: "/score-appeals/{score_appeal_id}/decisions"
    description: >-
      Decide a filed appeal. decision is UPHELD (corrected_raw_score required) or DENIED
      (the registration returns to RELEASED).
    roles: [StateAssessmentOfficer]
    code: 200
    input: ["decision", "corrected_raw_score?", "note?"]
    output: ScoreAppeal
    side_effects:
      - "ScoreAppeal.status, corrected_raw_score and decided_at written"
      - "Registration.raw_score and score_status updated per the decision"
      - "increments ScoreAppeal.version by 1"

  # --- test-driving surface ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock. Every timestamp the server stamps and every
      time-gated precondition reads this clock. Before the first call the clock reads
      exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time.
    roles: [StateAssessmentOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "sets the logical clock; no entity is mutated"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: X-User-ID or X-User-Role missing, empty, or naming an unknown role.

  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: >-
      Role is not listed for the endpoint, or the role does not own the requested
      to_status / event_type sub-operation on a multiplexing endpoint.

  - id: ERR_SCOPE_VIOLATION
    http: 403
    condition: >-
      Role is allowed for the endpoint but the acting principal's identity does not own
      the target school, district, proctor record, session or report.

  - id: ERR_DISTRICT_NOT_FOUND
    http: 404
    condition: district_id in the path or request body does not resolve.

  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: school_id in the path or request body does not resolve.

  - id: ERR_TEST_WINDOW_NOT_FOUND
    http: 404
    condition: window_id in the path or request body does not resolve.

  - id: ERR_PROCTOR_NOT_FOUND
    http: 404
    condition: proctor_id in the path or request body does not resolve.

  - id: ERR_SECURITY_AFFIDAVIT_NOT_FOUND
    http: 404
    condition: security_affidavit_id in the path does not resolve.

  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: session_id in the path or request body does not resolve.

  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: >-
      registration_id or makeup_of_registration_id in the path or request body does not
      resolve.

  - id: ERR_MATERIAL_LOT_NOT_FOUND
    http: 404
    condition: material_lot_id in the path does not resolve.

  - id: ERR_CUSTODY_EVENT_NOT_FOUND
    http: 404
    condition: custody_event_id in the path does not resolve.

  - id: ERR_IRREGULARITY_REPORT_NOT_FOUND
    http: 404
    condition: irregularity_report_id in the path does not resolve.

  - id: ERR_SCORE_APPEAL_NOT_FOUND
    http: 404
    condition: score_appeal_id in the path does not resolve.

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: >-
      Missing required body field, unknown enum member, value outside its declared range
      or pattern, unparseable timestamp, seal range that does not match quantity_shipped,
      sealed_count above quantity, session_id supplied for a non-session custody event or
      omitted for a session one, duplicate or uncatalogued accommodation codes, or an
      UPHELD appeal decision with no corrected_raw_score.

  - id: ERR_STALE_PROCTOR_VERSION
    http: 412
    condition: >-
      expected_proctor_version on POST /security-affidavits does not equal the Proctor's
      current version.

  - id: ERR_STALE_SESSION_VERSION
    http: 412
    condition: >-
      expected_session_version on POST /sessions/{session_id}/proctor-assignments does not
      equal the Session's current version.

  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: >-
      The requested state-machine edge is not declared in §1.2 for the resource's current
      state, including repeating a transition that already executed, acting on a terminal
      state, and requesting a declared edge whose precondition on the target resource's own
      fields is unmet (such as scheduling a Session whose proctor_id is still null).

  - id: ERR_WINDOW_PHASE_INVALID
    http: 409
    condition: >-
      The governing TestWindow is not in the phase the operation requires (session work
      outside OPEN/MAKEUP, scoring outside SCORING, appeals or distribution outside
      RELEASED).

  - id: ERR_SESSION_NOT_ACCEPTING_REGISTRATIONS
    http: 409
    condition: >-
      A registration or accommodation coding targets a Session whose status is not DRAFT
      or SCHEDULED.

  - id: ERR_LOT_NOT_AWAITING_RECONCILIATION
    http: 409
    condition: A reconciliation targets a MaterialLot whose status is not RETURNED_PENDING.

  - id: ERR_SCORE_NOT_RELEASED
    http: 409
    condition: >-
      An appeal is filed against a Registration whose score_status is not RELEASED, or a
      decision targets a ScoreAppeal whose status is not FILED.

  - id: ERR_RETURN_CYCLE_LIMIT
    http: 409
    condition: >-
      A third RETURNED_FOR_INFO is requested on a report that already has return_count ==
      MAX_RETURN_CYCLES.

  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: >-
      district_code already exists, school_code already exists inside the district, or
      lot_code already exists.

  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: >-
      The student already holds a non-withdrawn initial registration in the window, or the
      named original registration already has a make-up seat.

  - id: ERR_ROOM_TIME_CONFLICT
    http: 409
    condition: >-
      The proposed session overlaps an existing session in the same school and room once
      both intervals are widened by ROOM_TURNOVER_BUFFER_MINUTES.

  - id: ERR_PROCTOR_TIME_CONFLICT
    http: 409
    condition: >-
      The proctor is already assigned to a non-terminal session whose closed interval
      touches or overlaps this session's closed interval.

  - id: ERR_SESSION_OUTSIDE_WINDOW
    http: 422
    condition: >-
      The session interval is not fully contained in [window_start, window_end] for an
      INITIAL session or [makeup_start, makeup_end] for a MAKEUP session.

  - id: ERR_TIMING_PRECONDITION_NOT_MET
    http: 422
    condition: >-
      A transition was requested before (or after) the logical-clock instant its
      precondition requires.

  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: >-
      An appeal is filed when the logical clock is at or past
      TestWindow.appeal_window_closes_at.

  - id: ERR_PROCTOR_NOT_CERTIFIED
    http: 422
    condition: >-
      The proctor's certification_status is NOT_CERTIFIED, EXPIRED or REVOKED at the
      moment of assignment or scheduling.

  - id: ERR_AFFIDAVIT_MISSING
    http: 422
    condition: >-
      No SecurityAffidavit with status ACTIVE exists for the (proctor, window) pair the
      session belongs to.

  - id: ERR_CUSTODY_CHAIN_BROKEN
    http: 422
    condition: >-
      The custody event's type is illegal for the lot's current status or its required
      predecessor movement is missing.

  - id: ERR_INSUFFICIENT_MATERIALS
    http: 422
    condition: >-
      The source custody bucket holds fewer booklets than the movement requires, or the
      session holds fewer checked-out booklets than it has non-withdrawn registrations.

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: >-
      A make-up registration would place the student with the same proctor who ran the
      original session.

  - id: ERR_MAKEUP_NOT_ELIGIBLE
    http: 422
    condition: >-
      The named original registration is for a different student or window, is not ABSENT
      / EXCUSED / INVALIDATED, or the target session is not of type MAKEUP.

  - id: ERR_SESSION_CAPACITY_EXCEEDED
    http: 422
    condition: >-
      Applying the request would push Session.seats_consumed above
      Session.effective_seat_capacity.

  - id: ERR_ACCOMMODATION_NOT_APPROVED
    http: 422
    condition: >-
      A session activation was requested while at least one of its registrations still has
      accommodation_status REQUESTED.

  - id: ERR_PARTICIPATION_BELOW_MINIMUM
    http: 422
    condition: >-
      SCORING -> RELEASED was requested while participation_rate_provisional_pct is
      strictly below min_participation_pct.

  - id: ERR_SECURITY_HOLD_ACTIVE
    http: 422
    condition: SCORING -> RELEASED was requested while TestWindow.security_hold is true.

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:

  - name: StateAssessmentOfficer
    description: >-
      State-level program owner. Builds the organisational skeleton and the testing
      calendar, ships secure materials, records scores, reviews and adjudicates
      irregularities, decides appeals and releases results. Never touches a session floor
      and never codes an accommodation.
    identity: opaque
    exclusive_operations:
      - "POST /districts"
      - "POST /schools"
      - "POST /test-windows"
      - "POST /test-windows/{window_id}/transitions"
      - "POST /test-windows/{window_id}/report-distribution-runs"
      - "POST /material-lots"
      - "POST /registrations/{registration_id}/scores"
      - "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status in {UNDER_REVIEW, RETURNED_FOR_INFO, ADJUDICATED}"
      - "POST /score-appeals/{score_appeal_id}/decisions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: DistrictTestCoordinator
    description: >-
      District materials and compliance authority. Receives and destroys secure booklets,
      reconciles returned lots, and rules on accommodation packages that school staff
      coded. May never code an accommodation and may never record a score.
    identity: entity_backed:District
    exclusive_operations:
      - "POST /material-lots/{material_lot_id}/custody-events with event_type in {RECEIPT, DESTRUCTION}"
      - "POST /material-lots/{material_lot_id}/reconciliations"
      - "POST /registrations/{registration_id}/accommodation-decisions"
    shared_operations:
      - "POST /score-appeals"
      - "every GET endpoint"

  - name: SchoolTestCoordinator
    description: >-
      School-level administrator. Builds the proctor roster and its training records,
      schedules sessions and rooms, registers students, codes accommodations, and moves
      booklets between the district and the school. May never approve the accommodations
      it codes and may never adjudicate an irregularity.
    identity: entity_backed:School
    exclusive_operations:
      - "POST /proctors"
      - "POST /proctors/{proctor_id}/training-completions"
      - "POST /sessions"
      - "POST /sessions/{session_id}/proctor-assignments"
      - "POST /sessions/{session_id}/transitions with to_status in {SCHEDULED, CANCELLED}"
      - "POST /registrations"
      - "POST /registrations/{registration_id}/accommodation-codings"
      - "POST /material-lots/{material_lot_id}/custody-events with event_type in {TRANSFER_TO_SCHOOL, RETURN_TO_DISTRICT}"
    shared_operations:
      - "POST /score-appeals"
      - "every GET endpoint"

  - name: Proctor
    description: >-
      Room-level test administrator. Signs the security affidavit, checks booklets in and
      out of the room, runs the session, records attendance and files irregularity
      reports. May never adjudicate the reports it files and may never record a score.
    identity: entity_backed:Proctor
    exclusive_operations:
      - "POST /security-affidavits"
      - "POST /sessions/{session_id}/transitions with to_status in {ACTIVE, CLOSED}"
      - "POST /registrations/{registration_id}/attendance"
      - "POST /material-lots/{material_lot_id}/custody-events with event_type in {SESSION_CHECKOUT, SESSION_CHECKIN}"
      - "POST /irregularity-reports"
      - "POST /irregularity-reports/{irregularity_report_id}/transitions with to_status in {SUBMITTED, WITHDRAWN}"
    shared_operations:
      - "every GET endpoint"

# =============================================================================
# Global constants referenced across §1.2–§1.5
# =============================================================================
global_constants:
  DEFAULT_LOGICAL_CLOCK_UTC: "2026-08-01T00:00:00Z"
  SESSION_START_GRACE_MINUTES: 30
  ROOM_TURNOVER_BUFFER_MINUTES: 15
  MAKEUP_EXTENSION_DAYS: 7
  MAX_RETURN_CYCLES: 2
