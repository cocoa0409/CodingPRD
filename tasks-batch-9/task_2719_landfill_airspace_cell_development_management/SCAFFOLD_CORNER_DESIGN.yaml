              as: SiteOperator
              as_user_id: "${lfb_id}"
              captures: { e_body: $.data.error_id }
            - call: "POST /cells/${ca_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lfb_id}"
              captures: { e_path: $.data.error_id }
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${ca_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lfb_id}"
              captures: { e_transitive: $.data.error_id }
            - call: "GET /cells/${ca_id}"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lfb_id}"
              captures: { read_state: $.data.status }
            - call: "POST /cells/${ca_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lfa_id}"
              captures: { ca_state: $.data.status }
          assert:
            - "${e_body} == 'ERR_SITE_SCOPE_VIOLATION' with HTTP 403 — the body landfill_id names LF-A while X-User-ID is LF-B"
            - "${e_path} == 'ERR_SITE_SCOPE_VIOLATION' — the scope is resolved from the addressed Cell's landfill_id"
            - "${e_transitive} == 'ERR_SITE_SCOPE_VIOLATION' — resolved through Cell.landfill_id one hop away from the body's cell_id"
            - "${read_state} == 'DESIGN': the read succeeded for the out-of-scope ScaleOperator because §1.4 priority 6 applies to write endpoints only"
            - "${ca_state} == 'CONSTRUCTION' once the correctly scoped operator repeats the refused call, proving nothing was consumed by the refusals"

      - name: the_submitter_of_a_liner_package_cannot_review_it
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=12]
          - errors[ERR_SEGREGATION_OF_DUTIES]
