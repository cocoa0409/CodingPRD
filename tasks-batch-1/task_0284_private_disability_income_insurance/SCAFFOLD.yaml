# =============================================================================
# PRD Benchmark Seed Tables — Private Disability Income Insurance (Expert)
# =============================================================================

scenario: |
  Private Disability Income Insurance: occupation class/risk, benefit amount & period,
  elimination/waiting period, own-occ vs any-occ, residual/partial benefit, COLA rider,
  claim & continued-disability proof, offset (SSDI/workers comp)

domain_name: private-disability-income-insurance
api_prefix: /disability

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat
  # Flat peer collections under /disability with FK references; Claim carries a
  # shallow sub-resource set (income-reports, disability-proofs, benefit-periods,
  # offset-awards, ledger). No deep URL nesting.
  state_machine_shape: parallel
  # Claim is cyclic (revision loop + APPROVED<->SUSPENDED); Policy carries two
  # independent state dimensions (lifecycle_status x premium_status);
  # BenefitPeriod and OffsetAward are short pipelines.
  relationship_patterns:
    - one_to_many        # Policy 1:N Claim; Claim 1:N BenefitPeriod / OffsetAward / IncomeReport / DisabilityProof
    - cross_aggregate    # ClaimLedger denormalizes BenefitPeriod + OffsetAward sums; Claim approval reads Policy
  role_model: peer_roles
  # Underwriter owns Policy/OccupationClass/Policyholder + premium lifecycle;
  # ClaimsAdjudicator owns claim adjudication, benefit accrual, offset management;
  # Policyholder owns claim filing + proofs + income reports on own policy;
  # SystemOperator owns the deterministic clock.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Insurer
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Insurer / program name" }
      - { name: current_month_index, type: integer, source: system, default: 0, description: "Deterministic clock; integer month epoch. Advanced only via the clock endpoint; never wall-clock." }

  - name: OccupationClass
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id" }
      - { name: code, type: string, source: input, description: "Occupation class code, e.g. '1A', '4A'. Unique per insurer (case-sensitive)." }
      - { name: risk_tier, type: enum, source: input, description: "LOW | MEDIUM | HIGH | DECLINE; DECLINE classes cannot back an activated policy." }
      - { name: max_benefit_months, type: integer, source: input, description: "Cap on benefit_period_months any policy in this class may declare (1..600)." }
      - { name: min_elimination_days, type: integer, source: input, description: "Floor on a policy's elimination_period_days for this class (>= 0)." }
      - { name: own_occ_window_months_cap, type: integer, source: input, description: "Maximum own-occ definition window (months) a policy in this class may declare (>= 0)." }

  - name: Policyholder
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id" }
      - { name: full_name, type: string, source: input, description: "Insured person's legal name" }
      - { name: pre_disability_monthly_income_cents, type: integer, source: input, description: "Baseline indemnity earnings used as the residual loss denominator (> 0)." }

  - name: Policy
    parent: Insurer
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id" }
      - { name: policyholder_id, type: string, source: input, description: "FK -> Policyholder.id" }
      - { name: occupation_class_id, type: string, source: input, description: "FK -> OccupationClass.id" }
      - { name: monthly_benefit_cents, type: integer, source: input, description: "Contractual total-disability monthly benefit (> 0)." }
      - { name: benefit_period_months, type: integer, source: input, description: "Maximum number of benefit months payable across all claims combined (1..occupation_class.max_benefit_months)." }
      - { name: elimination_period_days, type: integer, source: input, description: "Waiting period in days before any benefit accrues (>= occupation_class.min_elimination_days)." }
      - { name: occupation_definition, type: enum, source: input, description: "OWN_OCC | ANY_OCC; governs the disability test the adjudicator applies." }
      - { name: own_occ_window_months, type: integer, source: input, default: 0, description: "For OWN_OCC: months the own-occ test applies before reverting to any-occ (0..occupation_class.own_occ_window_months_cap). Ignored when ANY_OCC." }
      - { name: cola_rider, type: boolean, source: input, default: false, description: "Whether the COLA rider is attached." }
      - { name: cola_annual_rate, type: number, source: input, default: 0, description: "Annual COLA rate as a decimal, e.g. 0.03 (0..0.10). Must be 0 when cola_rider is false." }
      - { name: lifecycle_status, type: enum, source: system, description: "Lifecycle dimension: PENDING -> ACTIVE -> LAPSED | TERMINATED." }
      - { name: premium_status, type: enum, source: system, default: CURRENT, description: "Premium dimension (independent of lifecycle): CURRENT -> GRACE -> DEFAULT; GRACE -> CURRENT on payment." }
      - { name: benefit_months_consumed, type: number, source: computed, default: 0, description: "Sum of benefit_fraction across all ACCRUED BenefitPeriods on this policy's claims (residual months count fractionally), rounded to 4 dp." }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id" }
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: disability_onset_month, type: integer, source: input, description: "Insurer month index on which disability began (>= 0)." }
      - { name: claimed_disability_type, type: enum, source: input, description: "TOTAL | RESIDUAL; RESIDUAL requires an IncomeReport before approval." }
      - { name: elimination_satisfied_month, type: integer, source: computed, description: "onset + ceil(policy.elimination_period_days/30)." }
      - { name: own_occ_expiry_month, type: integer, source: computed, description: "For OWN_OCC: elimination_satisfied_month + policy.own_occ_window_months; equals elimination_satisfied_month for ANY_OCC." }
      - { name: next_proof_due_month, type: integer, source: computed, default: 0, description: "Month index by which the next DisabilityProof must be accepted to keep the claim payable; set on approval, advances PROOF_INTERVAL_MONTHS on each acceptance." }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> UNDER_REVIEW -> {PENDING_INFO -> UNDER_REVIEW (loop)} -> APPROVED -> {SUSPENDED<->APPROVED | BENEFIT_EXHAUSTED | CLOSED} ; or DENIED." }

  - name: IncomeReport
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: effective_month, type: integer, source: input, description: "Insurer month index this income basis takes effect (>= claim.disability_onset_month)." }
      - { name: current_monthly_income_cents, type: integer, source: input, description: "Earnings while disabled for this period (>= 0)." }
      - { name: income_loss_ratio, type: number, source: computed, description: "(pre_disability - current)/pre_disability, floored at 0, rounded to 4 dp." }
      - { name: is_superseded, type: boolean, source: computed, default: false, description: "True once a later IncomeReport with a strictly greater effective_month is accepted on the same claim." }

  - name: DisabilityProof
    parent: Claim
    common_fields: false   # append-only attestation: id + created_at only, immutable
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: attestation_month, type: integer, source: input, description: "Insurer month index the proof attests to (>= claim.disability_onset_month)." }
      - { name: still_disabled, type: boolean, source: input, description: "Attestation that disability continues." }
      - { name: accepted, type: boolean, source: computed, description: "True when still_disabled is true and attestation_month <= claim.next_proof_due_month at submission." }

  - name: BenefitPeriod
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: coverage_month, type: integer, source: input, description: "The single insurer month index this installment covers. Half-open [coverage_month, coverage_month+1) — one month per period; consecutive periods touch but do not overlap." }
      - { name: benefit_fraction, type: number, source: computed, description: "1.0 for TOTAL; residual factor in [0,1] for RESIDUAL (see residual_benefit_factor calc), rounded to 4 dp." }
      - { name: gross_benefit_cents, type: integer, source: computed, description: "COLA-adjusted monthly benefit * benefit_fraction, rounded to the cent (see gross_benefit_cents calc)." }
      - { name: offset_applied_cents, type: integer, source: computed, description: "Sum of effective offsets attributed to this coverage_month (see net_benefit_cents calc)." }
      - { name: net_benefit_cents, type: integer, source: computed, description: "max(0, gross_benefit_cents - offset_applied_cents)." }
      - { name: status, type: enum, source: system, description: "ACCRUED -> REVERSED. Created in ACCRUED; REVERSED when the claim is reversed/denied or the period is voided." }

  - name: OffsetAward
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: offset_source, type: enum, source: input, description: "SSDI | WORKERS_COMP; (claim_id, offset_source) effective windows may not overlap." }
      - { name: monthly_offset_cents, type: integer, source: input, description: "Monthly third-party benefit to offset while ESTIMATED (>= 0). Replaced by final_monthly_offset_cents once FINALIZED." }
      - { name: estimated_offset_cents, type: integer, source: computed, default: 0, description: "Snapshot of monthly_offset_cents taken at create/ESTIMATED time, retained so finalize can compute the (final - estimated) overpayment delta." }
      - { name: final_monthly_offset_cents, type: integer, source: system, default: 0, description: "The reconciled monthly offset supplied at finalize; the effective offset used by net_benefit_cents once status == FINALIZED." }
      - { name: effective_offset_cents, type: integer, source: computed, default: 0, description: "monthly_offset_cents while ESTIMATED; final_monthly_offset_cents while FINALIZED; 0 while VOID. This is the value net_benefit_cents consumes." }
      - { name: start_month, type: integer, source: input, description: "Inclusive first month the offset applies." }
      - { name: end_month, type: integer, source: input, description: "Inclusive last month the offset applies (>= start_month). Closed interval [start_month, end_month]; a new window touching an existing one (end_a == start_b) collides (one-month no-touch buffer)." }
      - { name: status, type: enum, source: system, description: "ESTIMATED -> FINALIZED ; ESTIMATED|FINALIZED -> VOID. ESTIMATED contributes a provisional offset; FINALIZED contributes the reconciled offset." }

  - name: ClaimLedger
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: total_gross_paid_cents, type: integer, source: computed, default: 0, description: "Sum of gross_benefit_cents over ACCRUED BenefitPeriods on this claim." }
      - { name: total_net_paid_cents, type: integer, source: computed, default: 0, description: "Sum of net_benefit_cents over ACCRUED BenefitPeriods on this claim." }
      - { name: overpayment_balance_cents, type: integer, source: computed, default: 0, description: "Conserved quantity: accumulated overpayment when a FINALIZED offset exceeds its prior ESTIMATED snapshot across already-ACCRUED periods. Returns to its prior value when the triggering offset is voided." }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Policy: PARALLEL dimensions (lifecycle_status x premium_status) ----
  - entity: Policy
    initial_state: "lifecycle_status=PENDING, premium_status=CURRENT"
    terminal_states: ["lifecycle_status=TERMINATED"]
    transitions:
      - from: "lifecycle_status=PENDING"
        to: "lifecycle_status=ACTIVE"
        trigger: "POST /disability/policies/{policyId}/activate"
        actor: Underwriter
        preconditions:
          - "Policy lifecycle_status == PENDING (ERR_POLICY_NOT_PENDING)"
          - "OccupationClass.risk_tier != DECLINE (ERR_OCCUPATION_CLASS_DECLINED) — cross-entity Policy->OccupationClass"
        side_effects:
          - "lifecycle_status -> ACTIVE"
          - "increments Policy.version by 1"
      - from: "lifecycle_status=ACTIVE"
        to: "lifecycle_status=LAPSED"
        trigger: "system: premium_status enters DEFAULT (lapse cascade)"
        actor: system
        preconditions:
          - "premium_status transitions GRACE -> DEFAULT"
        side_effects:
          - "lifecycle_status -> LAPSED"
          - "increments Policy.version by 1"
          - "Cascade: every Claim on this policy in status APPROVED transitions APPROVED -> SUSPENDED (no new BenefitPeriods may accrue while suspended)"
      - from: "lifecycle_status=ACTIVE"
        to: "lifecycle_status=TERMINATED"
        trigger: "POST /disability/policies/{policyId}/terminate"
        actor: Underwriter
        preconditions:
          - "Policy lifecycle_status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "No Claim on this policy in status UNDER_REVIEW or PENDING_INFO (ERR_OPEN_CLAIM_EXISTS)"
        side_effects:
          - "lifecycle_status -> TERMINATED"
          - "increments Policy.version by 1"
          - "Cascade: every APPROVED or SUSPENDED Claim on this policy transitions to CLOSED"
      # premium_status dimension — independent axis
      - from: "premium_status=CURRENT"
        to: "premium_status=GRACE"
        trigger: "POST /disability/policies/{policyId}/premium/miss"
        actor: Underwriter
        preconditions:
          - "Policy lifecycle_status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "premium_status == CURRENT (ERR_PREMIUM_NOT_CURRENT)"
        side_effects:
          - "premium_status -> GRACE"
          - "increments Policy.version by 1"
      - from: "premium_status=GRACE"
        to: "premium_status=DEFAULT"
        trigger: "POST /disability/policies/{policyId}/premium/miss"
        actor: Underwriter
        preconditions:
          - "premium_status == GRACE (ERR_PREMIUM_NOT_IN_GRACE)"
        side_effects:
          - "premium_status -> DEFAULT"
          - "increments Policy.version by 1"
          - "Triggers the lifecycle ACTIVE -> LAPSED transition (see lapse cascade above), which itself suspends APPROVED claims"
      - from: "premium_status=GRACE"
        to: "premium_status=CURRENT"
        trigger: "POST /disability/policies/{policyId}/premium/pay"
        actor: Underwriter
        preconditions:
          - "premium_status == GRACE (ERR_PREMIUM_NOT_IN_GRACE)"
        side_effects:
          - "premium_status -> CURRENT"
          - "increments Policy.version by 1"

  # ---- Claim: CYCLIC (revision loop + APPROVED<->SUSPENDED cycle) ----
  - entity: Claim
    initial_state: DRAFT
    terminal_states: [DENIED, CLOSED, BENEFIT_EXHAUSTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /disability/claims/{id}/submit"
        actor: Policyholder
        preconditions:
          - "Claim status == DRAFT (ERR_CLAIM_NOT_DRAFT)"
          - "Policy.lifecycle_status == ACTIVE (ERR_POLICY_NOT_ACTIVE) — cross-entity Claim->Policy"
          - "claimed_disability_type == RESIDUAL implies >= 1 IncomeReport exists on this claim (ERR_RESIDUAL_INCOME_REPORT_REQUIRED)"
        side_effects:
          - "increments Claim.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /disability/claims/{id}/begin-review"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: PENDING_INFO
        trigger: "POST /disability/claims/{id}/request-info"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
        side_effects:
          - "increments Claim.version by 1"
      - from: PENDING_INFO
        to: UNDER_REVIEW
        trigger: "POST /disability/claims/{id}/resume-review"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim status == PENDING_INFO (ERR_CLAIM_NOT_PENDING_INFO)"
        side_effects:
          - "increments Claim.version by 1"
        note: "Revision loop closes the cycle UNDER_REVIEW -> PENDING_INFO -> UNDER_REVIEW."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /disability/claims/{id}/approve"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "Policy.lifecycle_status == ACTIVE (ERR_POLICY_NOT_ACTIVE) — cross-entity Claim->Policy"
          - "Policy.premium_status != DEFAULT (ERR_PREMIUM_IN_DEFAULT) — cross-entity Claim->Policy"
          - "Insurer.current_month_index >= claim.elimination_satisfied_month (ERR_ELIMINATION_NOT_SATISFIED) — boundary >="
          - "Policy.benefit_months_consumed < Policy.benefit_period_months (ERR_BENEFIT_PERIOD_EXHAUSTED) — boundary"
        side_effects:
          - "increments Claim.version by 1"
          - "Creates ClaimLedger for this claim (all totals 0) if not present"
          - "Sets next_proof_due_month = elimination_satisfied_month + PROOF_INTERVAL_MONTHS"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /disability/claims/{id}/deny"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
        side_effects:
          - "increments Claim.version by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /disability/claims/{id}/suspend  (or system lapse cascade)"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim status == APPROVED (ERR_CLAIM_NOT_APPROVED)"
        side_effects:
          - "increments Claim.version by 1"
        note: "Cycle leg APPROVED -> SUSPENDED. Also fired by the Policy lapse cascade."
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /disability/claims/{id}/reinstate"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim status == SUSPENDED (ERR_CLAIM_NOT_SUSPENDED)"
          - "Policy.lifecycle_status == ACTIVE (ERR_POLICY_NOT_ACTIVE) — cross-entity Claim->Policy"
        side_effects:
          - "increments Claim.version by 1"
        note: "Cycle leg SUSPENDED -> APPROVED closes the APPROVED<->SUSPENDED cycle."
      - from: APPROVED
        to: DENIED
        trigger: "POST /disability/claims/{id}/reverse"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim status == APPROVED (ERR_CLAIM_NOT_APPROVED)"
        side_effects:
          - "increments Claim.version by 1"
          - "Compensation cascade: every ACCRUED BenefitPeriod on this claim -> REVERSED; ClaimLedger.total_gross_paid_cents, total_net_paid_cents, overpayment_balance_cents recomputed to 0; Policy.benefit_months_consumed decreased by the sum of reversed benefit_fraction (conserved-quantity invariant)."
      - from: APPROVED
        to: BENEFIT_EXHAUSTED
        trigger: "system: BenefitPeriod accrual drives Policy.benefit_months_consumed >= Policy.benefit_period_months"
        actor: system
        preconditions:
          - "Policy.benefit_months_consumed >= Policy.benefit_period_months after the accrual side-effect"
        side_effects:
          - "increments Claim.version by 1"
        note: "Terminal exhaustion reached by the accrual cascade; no further BenefitPeriods may accrue."
      - from: APPROVED
        to: CLOSED
        trigger: "POST /disability/claims/{id}/close (or Policy terminate cascade)"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim status == APPROVED (ERR_CLAIM_NOT_APPROVED)"
        side_effects:
          - "increments Claim.version by 1"

  # ---- BenefitPeriod: short pipeline ----
  - entity: BenefitPeriod
    initial_state: ACCRUED
    terminal_states: [REVERSED]
    transitions:
      - from: ACCRUED
        to: REVERSED
        trigger: "POST /disability/benefit-periods/{benefitPeriodId}/void  (or claim reverse cascade)"
        actor: ClaimsAdjudicator
        preconditions:
          - "BenefitPeriod status == ACCRUED (ERR_BENEFIT_PERIOD_NOT_ACCRUED)"
          - "Parent Claim status IN {APPROVED, SUSPENDED} (ERR_CLAIM_NOT_PAYABLE) — cross-entity BenefitPeriod->Claim"
        side_effects:
          - "increments BenefitPeriod.version by 1"
          - "Ledger sync: ClaimLedger totals recomputed; Policy.benefit_months_consumed -= this period's benefit_fraction"

  # ---- OffsetAward: estimate -> finalize -> void ----
  - entity: OffsetAward
    initial_state: ESTIMATED
    terminal_states: [VOID]
    transitions:
      - from: ESTIMATED
        to: FINALIZED
        trigger: "POST /disability/offset-awards/{offsetAwardId}/finalize"
        actor: ClaimsAdjudicator
        preconditions:
          - "OffsetAward status == ESTIMATED (ERR_OFFSET_NOT_ESTIMATED)"
          - "Parent Claim status == APPROVED (ERR_CLAIM_NOT_APPROVED) — cross-entity OffsetAward->Claim"
        side_effects:
          - "Sets final_monthly_offset_cents to the supplied value (defaults to estimated_offset_cents when omitted); effective_offset_cents now resolves to final_monthly_offset_cents"
          - "increments OffsetAward.version by 1"
          - "Cascade: each ACCRUED BenefitPeriod whose coverage_month is in [start_month,end_month] has offset_applied_cents and net_benefit_cents recomputed; ClaimLedger.total_net_paid_cents recomputed; the positive delta max(0, final_monthly_offset_cents - estimated_offset_cents) per covered ACCRUED month accrues to ClaimLedger.overpayment_balance_cents."
      - from: ESTIMATED
        to: VOID
        trigger: "POST /disability/offset-awards/{offsetAwardId}/void"
        actor: ClaimsAdjudicator
        preconditions:
          - "OffsetAward status IN {ESTIMATED, FINALIZED} (ERR_OFFSET_NOT_VOIDABLE)"
        side_effects:
          - "increments OffsetAward.version by 1"
          - "Compensation: affected ACCRUED BenefitPeriods recompute offset_applied_cents/net_benefit_cents excluding this award; ClaimLedger.total_net_paid_cents and overpayment_balance_cents return to their pre-finalize values (conserved-quantity invariant)."
      - from: FINALIZED
        to: VOID
        trigger: "POST /disability/offset-awards/{offsetAwardId}/void"
        actor: ClaimsAdjudicator
        preconditions:
          - "OffsetAward status IN {ESTIMATED, FINALIZED} (ERR_OFFSET_NOT_VOIDABLE)"
        side_effects:
          - "increments OffsetAward.version by 1"
          - "Compensation: as above; overpayment_balance_cents returns to its pre-finalize value (the finalize delta is undone exactly)."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: income-report-supersede-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /disability/claims/{id}/income-reports"
    occ_field: "expected_claim_version"
    description: |
      Accepting a new IncomeReport recertifies the residual income basis and
      supersedes the prior current-income report on the claim (the prior report's
      is_superseded flips to true and the residual benefit_fraction recomputes for
      subsequent accruals). A create whose expected_claim_version no longer matches
      the claim's current version is rejected: the client's view of the claim is
      stale because another recertification or status transition already advanced
      the claim's version, so this report would supersede on top of an out-of-date
      basis.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Rule 1 dual-variant #1: residual benefit factor (Claim/IncomeReport income domain) ----
  - name: residual_benefit_factor
    trigger: "BenefitPeriod accrual on a RESIDUAL claim; recomputed when a new IncomeReport supersedes the basis"
    algorithm: threshold
    formula: |
      For TOTAL claims: benefit_fraction = 1.0 always.
      For RESIDUAL claims:
      Let R = income_loss_ratio of the non-superseded IncomeReport with the
              greatest effective_month <= coverage_month (tie-break created_at ASC,
              never id); if none exists, R = 0.
      VARIANT proportionate (default):
        if R < MIN_LOSS_RATIO:            benefit_fraction = 0.0
        elif R >= PRESUMED_TOTAL_RATIO:   benefit_fraction = 1.0   # presumptive total
        else:                             benefit_fraction = round(R, 4)
      VARIANT presumptive_total (applies when policy.occupation_definition == OWN_OCC
               AND coverage_month < claim.own_occ_expiry_month):
        if R >= MIN_LOSS_RATIO:           benefit_fraction = 1.0   # any qualifying loss pays in full
        else:                             benefit_fraction = 0.0
    input_set: "The single non-superseded IncomeReport in effect for coverage_month (is_superseded == false, greatest effective_month <= coverage_month); ties broken by created_at ASC then never by id."
    constants:
      MIN_LOSS_RATIO: 0.20          # below this, no residual benefit
      PRESUMED_TOTAL_RATIO: 0.80    # at or above this, treat as total disability
    precision: "income_loss_ratio and benefit_fraction rounded to 4 decimal places, round_half_up"
    variants:
      - name: proportionate
        when: "RESIDUAL claim outside the own-occ window, or ANY_OCC policy"
        difference: "Pays the proportionate loss fraction between MIN_LOSS_RATIO and PRESUMED_TOTAL_RATIO; only R>=0.80 presumes total."
      - name: presumptive_total
        when: "RESIDUAL claim, OWN_OCC policy, coverage_month < own_occ_expiry_month"
        difference: "Any loss at or above MIN_LOSS_RATIO pays the full benefit (fraction 1.0); the 0.20..0.80 proportionate band collapses to full."

  # ---- Rule 2 mode (a): COLA-compounded gross benefit (>=3 inputs, nested min, branch) ----
  - name: gross_benefit_cents
    trigger: "BenefitPeriod accrual"
    algorithm: weighted_scoring
    formula: |
      years_elapsed = floor( (coverage_month - claim.elimination_satisfied_month) / 12 )
      if policy.cola_rider == false OR years_elapsed <= 0:
        cola_multiplier = 1.0
      else:
        # compound annual COLA, capped
        cola_multiplier = min( (1 + policy.cola_annual_rate) ** years_elapsed, MAX_COLA_MULTIPLIER )
      cola_adjusted_cents = round_half_up( policy.monthly_benefit_cents * cola_multiplier )   # to the cent
      gross_benefit_cents = round_half_up( cola_adjusted_cents * benefit_fraction )           # to the cent
    input_set: "policy.monthly_benefit_cents, policy.cola_annual_rate, years_elapsed since elimination satisfied, benefit_fraction for the coverage_month"
    constants:
      MAX_COLA_MULTIPLIER: 2.0      # COLA compounding caps benefit at 2x base
    precision: "cents; round_half_up applied independently at each of the two rounding steps (cola_adjusted first, then gross)"

  # ---- Rule 2 mode (c): net benefit waterfall with pinned evaluation order ----
  - name: net_benefit_cents
    trigger: "BenefitPeriod accrual; recomputed on OffsetAward finalize/void"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER IS PINNED (the value is well-defined only in this order):
        step 1: benefit_fraction      (residual_benefit_factor calc)
        step 2: gross_benefit_cents   (gross_benefit_cents calc, consumes benefit_fraction)
        step 3: offset_applied_cents = sum over non-VOID OffsetAwards on this claim whose
                  [start_month,end_month] contains coverage_month, of each award's
                  effective_offset_cents (monthly_offset_cents while ESTIMATED,
                  final_monthly_offset_cents while FINALIZED).
                  WORKERS_COMP awards are summed before SSDI awards (fixed order so the
                  running sum is deterministic), though the final sum is order-free.
        step 4: net_benefit_cents = max(OFFSET_FLOOR_CENTS, gross_benefit_cents - offset_applied_cents)
    input_set: "All non-VOID OffsetAwards on the claim whose closed window contains coverage_month; gross_benefit_cents from step 2"
    constants:
      OFFSET_FLOOR_CENTS: 0          # net benefit never goes negative
    precision: "cents; integer arithmetic after gross rounding"
    variants:
      - name: provisional_offset
        when: "Offset is ESTIMATED at accrual time"
        difference: "Uses the award's monthly_offset_cents (estimated); net_benefit_cents is provisional."
      - name: final_offset
        when: "Offset has been FINALIZED"
        difference: "Uses final_monthly_offset_cents (reconciled); the positive (final - estimated_offset_cents) delta over already-accrued covered months accrues to overpayment_balance_cents."

  # ---- ClaimLedger aggregation ----
  - name: claim_ledger_totals
    trigger: "BenefitPeriod accrual/void; OffsetAward finalize/void; claim reverse"
    algorithm: aggregation
    formula: |
      total_gross_paid_cents = sum of gross_benefit_cents over BenefitPeriods on this claim with status == ACCRUED
      total_net_paid_cents   = sum of net_benefit_cents   over BenefitPeriods on this claim with status == ACCRUED
      overpayment_balance_cents is maintained incrementally: on OffsetAward finalize, add
        sum over covered ACCRUED months of max(0, final_monthly_offset_cents - estimated_offset_cents);
        on void of a previously-finalized award, subtract exactly that same sum.
    input_set: "BenefitPeriods on the claim with status == ACCRUED; ordered by coverage_month ASC then created_at ASC (never id)."
    precision: "cents (integer sums)"

  # ---- elimination & own-occ derived months ----
  - name: claim_window_months
    trigger: "Claim creation; read at approval and accrual"
    algorithm: threshold
    formula: |
      elimination_satisfied_month = claim.disability_onset_month + ceil(policy.elimination_period_days / DAYS_PER_MONTH)
      if policy.occupation_definition == OWN_OCC:
        own_occ_expiry_month = elimination_satisfied_month + policy.own_occ_window_months
      else:
        own_occ_expiry_month = elimination_satisfied_month
    input_set: "claim.disability_onset_month, policy.elimination_period_days, policy.occupation_definition, policy.own_occ_window_months"
    constants:
      DAYS_PER_MONTH: 30
      PROOF_INTERVAL_MONTHS: 3       # continued-disability proof cadence
    precision: "integer month indices; ceil for elimination conversion"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed Policyholder must own the targeted claim's policy"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "FK fields in body reference existing resources"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: "create endpoints carrying FK body fields"

  - priority: 5
    category: state
    check: "Optimistic concurrency: when expected_claim_version is supplied, it must equal Claim.version"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /disability/claims/{id}/income-reports"
    note: "Checked before business logic on the write endpoint."

  - priority: 6
    category: state
    check: "Target resource (or, for OffsetAward CREATE, the parent Claim) is in the correct state for the operation. Transition endpoints check the entity's own from-state; OffsetAward CREATE checks parent Claim.status == APPROVED (ERR_CLAIM_NOT_APPROVED). This state gate is evaluated before the OffsetAward overlap check (priority 8)."
    error_id: "ERR_*_NOT_* (e.g. ERR_CLAIM_NOT_UNDER_REVIEW; ERR_CLAIM_NOT_APPROVED for offset CREATE)"
    http_status: 409
    applies_to: "all transition endpoints; POST .../offset-awards"

  - priority: 7
    category: business_referential
    check: "RESIDUAL claim must have >= 1 IncomeReport before submission"
    error_id: ERR_RESIDUAL_INCOME_REPORT_REQUIRED
    http_status: 422
    applies_to: "POST /disability/claims/{id}/submit"

  - priority: 8
    category: business_temporal
    check: "OffsetAward window [start_month,end_month] must not overlap an existing non-VOID OffsetAward of the same offset_source on the claim (closed interval; touching collides). Checked only after the priority-6 parent-state gate (claim APPROVED) passes."
    error_id: ERR_OFFSET_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /disability/claims/{id}/offset-awards"

  - priority: 9
    category: business_temporal
    check: "BenefitPeriod coverage_month must not duplicate an existing ACCRUED BenefitPeriod on the claim (half-open one-month interval; consecutive months allowed)"
    error_id: ERR_COVERAGE_MONTH_OCCUPIED
    http_status: 409
    applies_to: "POST /disability/claims/{id}/benefit-periods"

  - priority: 10
    category: business_constraint
    check: "BenefitPeriod accrual requires parent Claim.status == APPROVED (cross-entity)"
    error_id: ERR_CLAIM_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /disability/claims/{id}/benefit-periods"

  - priority: 11
    category: business_constraint
    check: "Accrual coverage_month must be >= claim.elimination_satisfied_month and <= claim.next_proof_due_month (continued-disability proof must be current)"
    error_id: ERR_PROOF_NOT_CURRENT
    http_status: 422
    applies_to: "POST /disability/claims/{id}/benefit-periods"

  - priority: 12
    category: business_fiscal
    check: "Accrual must not drive Policy.benefit_months_consumed beyond Policy.benefit_period_months (would-exceed); equality is allowed and exhausts"
    error_id: ERR_BENEFIT_PERIOD_WOULD_EXCEED
    http_status: 422
    applies_to: "POST /disability/claims/{id}/benefit-periods"

  - priority: 13
    category: business_constraint
    check: "Field-shape: enums in declared set; integers in range; cola_annual_rate == 0 when cola_rider == false; own_occ_window_months <= occupation_class.own_occ_window_months_cap; elimination_period_days >= occupation_class.min_elimination_days; benefit_period_months <= occupation_class.max_benefit_months"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "create endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Insurer + clock ----
  - method: POST
    path: "/disability/insurers"
    description: "Create an insurer program"
    roles: [Underwriter]
    code: 201
    input: [name]
    output: Insurer
    side_effects: ["current_month_index initialized to 0"]
  - method: GET
    path: "/disability/insurers/{insurerId}"
    description: "Get insurer (includes current_month_index)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: Insurer
    side_effects: []
  - method: POST
    path: "/disability/insurers/{insurerId}/clock/advance"
    description: "Advance the deterministic clock (operations/test driver)"
    roles: [SystemOperator]
    code: 200
    input: [by_months]
    output: Insurer
    side_effects: ["current_month_index += by_months (1..100000)"]

  # ---- OccupationClass ----
  - method: POST
    path: "/disability/occupation-classes"
    description: "Create an occupation/risk class"
    roles: [Underwriter]
    code: 201
    input: [insurer_id, code, risk_tier, max_benefit_months, min_elimination_days, own_occ_window_months_cap]
    output: OccupationClass
    side_effects: []
  - method: GET
    path: "/disability/occupation-classes"
    description: "List occupation classes (filtered-list reverse-reachability for Insurer FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: ["insurer_id?"]
    output: "OccupationClass[]"
    side_effects: []
  - method: GET
    path: "/disability/occupation-classes/{occupationClassId}"
    description: "Get an occupation class"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: OccupationClass
    side_effects: []

  # ---- Policyholder ----
  - method: POST
    path: "/disability/policyholders"
    description: "Register a policyholder"
    roles: [Underwriter]
    code: 201
    input: [insurer_id, full_name, pre_disability_monthly_income_cents]
    output: Policyholder
    side_effects: []
  - method: GET
    path: "/disability/policyholders"
    description: "List policyholders (filtered-list reverse-reachability for Insurer FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: ["insurer_id?"]
    output: "Policyholder[]"
    side_effects: []
  - method: GET
    path: "/disability/policyholders/{policyholderId}"
    description: "Get a policyholder"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: Policyholder
    side_effects: []

  # ---- Policy ----
  - method: POST
    path: "/disability/policies"
    description: "Issue a policy (PENDING/CURRENT)"
    roles: [Underwriter]
    code: 201
    input: [insurer_id, policyholder_id, occupation_class_id, monthly_benefit_cents, benefit_period_months, elimination_period_days, occupation_definition, "own_occ_window_months?", "cola_rider?", "cola_annual_rate?"]
    output: Policy
    side_effects: ["lifecycle_status=PENDING, premium_status=CURRENT, benefit_months_consumed=0"]
  - method: GET
    path: "/disability/policies"
    description: "List policies (filtered-list reverse-reachability for Insurer FK, Policyholder FK, OccupationClass FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: ["insurer_id?", "policyholder_id?", "occupation_class_id?"]
    output: "Policy[]"
    side_effects: []
  - method: GET
    path: "/disability/policies/{policyId}"
    description: "Get a policy (includes benefit_months_consumed, both status dimensions)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: POST
    path: "/disability/policies/{policyId}/activate"
    description: "Activate a PENDING policy"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["lifecycle_status -> ACTIVE", "increments Policy.version by 1"]
  - method: POST
    path: "/disability/policies/{policyId}/terminate"
    description: "Terminate an ACTIVE policy"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["lifecycle_status -> TERMINATED", "increments Policy.version by 1", "cascade: APPROVED/SUSPENDED claims -> CLOSED"]
  - method: POST
    path: "/disability/policies/{policyId}/premium/miss"
    description: "Record a missed premium (CURRENT->GRACE, then GRACE->DEFAULT)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["premium_status advances", "increments Policy.version by 1", "GRACE->DEFAULT also lapses lifecycle and suspends APPROVED claims"]
  - method: POST
    path: "/disability/policies/{policyId}/premium/pay"
    description: "Pay premium during grace (GRACE->CURRENT)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["premium_status -> CURRENT", "increments Policy.version by 1"]

  # ---- Claim ----
  - method: POST
    path: "/disability/claims"
    description: "File a claim in DRAFT against a policy"
    roles: [Policyholder]
    code: 201
    input: [insurer_id, policy_id, disability_onset_month, claimed_disability_type]
    output: Claim
    side_effects: ["status=DRAFT", "computes elimination_satisfied_month and own_occ_expiry_month"]
  - method: GET
    path: "/disability/claims"
    description: "List claims (filtered-list reverse-reachability for Insurer FK and Policy FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: ["insurer_id?", "policy_id?"]
    output: "Claim[]"
    side_effects: []
  - method: GET
    path: "/disability/claims/{id}"
    description: "Get a claim (includes computed window months, next_proof_due_month, version)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/disability/claims/{id}/submit"
    description: "Submit a DRAFT claim"
    roles: [Policyholder]
    code: 200
    input: []
    output: Claim
    side_effects: ["status DRAFT -> SUBMITTED", "increments Claim.version by 1"]
  - method: POST
    path: "/disability/claims/{id}/begin-review"
    description: "Move a SUBMITTED claim to UNDER_REVIEW"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status SUBMITTED -> UNDER_REVIEW", "increments Claim.version by 1"]
  - method: POST
    path: "/disability/claims/{id}/request-info"
    description: "Move UNDER_REVIEW claim to PENDING_INFO (revision loop)"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status UNDER_REVIEW -> PENDING_INFO", "increments Claim.version by 1"]
  - method: POST
    path: "/disability/claims/{id}/resume-review"
    description: "Move PENDING_INFO claim back to UNDER_REVIEW (closes the cycle)"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status PENDING_INFO -> UNDER_REVIEW", "increments Claim.version by 1"]
  - method: POST
    path: "/disability/claims/{id}/approve"
    description: "Approve an UNDER_REVIEW claim"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status UNDER_REVIEW -> APPROVED", "increments Claim.version by 1", "creates ClaimLedger", "sets next_proof_due_month"]
  - method: POST
    path: "/disability/claims/{id}/deny"
    description: "Deny an UNDER_REVIEW claim"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status UNDER_REVIEW -> DENIED", "increments Claim.version by 1"]
  - method: POST
    path: "/disability/claims/{id}/suspend"
    description: "Suspend an APPROVED claim"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status APPROVED -> SUSPENDED", "increments Claim.version by 1"]
  - method: POST
    path: "/disability/claims/{id}/reinstate"
    description: "Reinstate a SUSPENDED claim"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status SUSPENDED -> APPROVED", "increments Claim.version by 1"]
  - method: POST
    path: "/disability/claims/{id}/reverse"
    description: "Reverse an APPROVED claim (compensation cascade)"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status APPROVED -> DENIED", "increments Claim.version by 1", "all ACCRUED BenefitPeriods -> REVERSED", "ClaimLedger totals -> 0", "Policy.benefit_months_consumed reduced by reversed benefit_fraction sum"]
  - method: POST
    path: "/disability/claims/{id}/close"
    description: "Close an APPROVED claim"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status APPROVED -> CLOSED", "increments Claim.version by 1"]

  # ---- IncomeReport (residual basis) ----
  - method: POST
    path: "/disability/claims/{id}/income-reports"
    description: "Record/recertify residual income basis (OCC-guarded supersede)"
    roles: [Policyholder]
    code: 201
    input: [effective_month, current_monthly_income_cents, expected_claim_version]
    output: IncomeReport
    side_effects: ["computes income_loss_ratio", "supersedes prior report with strictly lesser effective_month (is_superseded=true)", "increments Claim.version by 1"]
  - method: GET
    path: "/disability/claims/{id}/income-reports"
    description: "List income reports on a claim (sub-resource reverse-reachability for Claim FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: "IncomeReport[]"
    side_effects: []

  # ---- DisabilityProof (continued-disability proof) ----
  - method: POST
    path: "/disability/claims/{id}/disability-proofs"
    description: "Submit a continued-disability proof"
    roles: [Policyholder]
    code: 201
    input: [attestation_month, still_disabled]
    output: DisabilityProof
    side_effects: ["computes accepted", "on acceptance: claim.next_proof_due_month += PROOF_INTERVAL_MONTHS", "increments Claim.version by 1"]
  - method: GET
    path: "/disability/claims/{id}/disability-proofs"
    description: "List disability proofs on a claim (sub-resource reverse-reachability for Claim FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: "DisabilityProof[]"
    side_effects: []

  # ---- BenefitPeriod (accrual ledger lines) ----
  - method: POST
    path: "/disability/claims/{id}/benefit-periods"
    description: "Accrue a benefit installment for one coverage_month"
    roles: [ClaimsAdjudicator]
    code: 201
    input: [coverage_month]
    output: BenefitPeriod
    side_effects: ["computes benefit_fraction, gross_benefit_cents, offset_applied_cents, net_benefit_cents", "status=ACCRUED", "Policy.benefit_months_consumed += benefit_fraction", "ClaimLedger totals recomputed", "if consumed >= benefit_period_months: Claim -> BENEFIT_EXHAUSTED"]
  - method: GET
    path: "/disability/claims/{id}/benefit-periods"
    description: "List benefit periods on a claim (sub-resource reverse-reachability for Claim FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: "BenefitPeriod[]"
    side_effects: []
  - method: GET
    path: "/disability/benefit-periods"
    description: "List benefit periods (filtered-list reverse-reachability for Policy FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: ["policy_id?", "claim_id?"]
    output: "BenefitPeriod[]"
    side_effects: []
  - method: GET
    path: "/disability/benefit-periods/{benefitPeriodId}"
    description: "Get a benefit period"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: BenefitPeriod
    side_effects: []
  - method: POST
    path: "/disability/benefit-periods/{benefitPeriodId}/void"
    description: "Void (reverse) an ACCRUED benefit period"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: BenefitPeriod
    side_effects: ["status ACCRUED -> REVERSED", "increments BenefitPeriod.version by 1", "ClaimLedger totals recomputed", "Policy.benefit_months_consumed -= benefit_fraction"]

  # ---- OffsetAward ----
  - method: POST
    path: "/disability/claims/{id}/offset-awards"
    description: "Record an estimated SSDI/workers-comp offset window (requires parent Claim.status == APPROVED, checked before the overlap check)"
    roles: [ClaimsAdjudicator]
    code: 201
    input: [offset_source, monthly_offset_cents, start_month, end_month]
    output: OffsetAward
    side_effects: ["status=ESTIMATED", "estimated_offset_cents = monthly_offset_cents", "effective_offset_cents = monthly_offset_cents", "recompute net_benefit_cents on covered ACCRUED BenefitPeriods", "ClaimLedger.total_net_paid_cents recomputed"]
  - method: GET
    path: "/disability/claims/{id}/offset-awards"
    description: "List offset awards on a claim (sub-resource reverse-reachability for Claim FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: "OffsetAward[]"
    side_effects: []
  - method: GET
    path: "/disability/offset-awards/{offsetAwardId}"
    description: "Get an offset award"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: OffsetAward
    side_effects: []
  - method: POST
    path: "/disability/offset-awards/{offsetAwardId}/finalize"
    description: "Finalize an estimated offset (reconciliation cascade); final_monthly_offset_cents defaults to estimated_offset_cents when omitted"
    roles: [ClaimsAdjudicator]
    code: 200
    input: ["final_monthly_offset_cents?"]
    output: OffsetAward
    side_effects: ["status ESTIMATED -> FINALIZED", "final_monthly_offset_cents set (defaults to estimated_offset_cents)", "effective_offset_cents -> final_monthly_offset_cents", "increments OffsetAward.version by 1", "recompute covered ACCRUED BenefitPeriods", "positive (final - estimated) delta over covered accrued months accrues to ClaimLedger.overpayment_balance_cents"]
  - method: POST
    path: "/disability/offset-awards/{offsetAwardId}/void"
    description: "Void an offset award (compensation)"
    roles: [ClaimsAdjudicator]
    code: 200
    input: []
    output: OffsetAward
    side_effects: ["status -> VOID", "increments OffsetAward.version by 1", "recompute covered ACCRUED BenefitPeriods excluding this award", "overpayment_balance_cents returns to pre-finalize value"]

  # ---- ClaimLedger (computed read) ----
  - method: GET
    path: "/disability/claims/{id}/ledger"
    description: "Get the claim ledger (sub-resource reverse-reachability for Claim FK)"
    roles: [Underwriter, ClaimsAdjudicator, Policyholder, SystemOperator]
    code: 200
    input: []
    output: "ClaimLedger[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-Role or X-User-ID header missing/malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for the operation, or Policyholder does not own the targeted claim's policy" }
  - { id: ERR_INSURER_NOT_FOUND, http: 404, condition: "Insurer id (path or FK body) does not exist" }
  - { id: ERR_OCCUPATION_CLASS_NOT_FOUND, http: 404, condition: "OccupationClass id (path or FK body) does not exist" }
  - { id: ERR_POLICYHOLDER_NOT_FOUND, http: 404, condition: "Policyholder id (path or FK body) does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "Policy id (path or FK body) does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id (path or FK body) does not exist" }
  - { id: ERR_BENEFIT_PERIOD_NOT_FOUND, http: 404, condition: "BenefitPeriod id in path does not exist" }
  - { id: ERR_OFFSET_AWARD_NOT_FOUND, http: 404, condition: "OffsetAward id in path does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Field-shape violation: missing required field, bad enum, out-of-range integer, cola_annual_rate>0 while cola_rider false, or window/elimination/benefit caps violated against the occupation class" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version != Claim.version on income-report create (OCC)" }
  - { id: ERR_POLICY_NOT_PENDING, http: 409, condition: "activate on a policy whose lifecycle_status != PENDING" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "operation requires Policy.lifecycle_status == ACTIVE (terminate, premium/miss first leg, claim submit/approve/reinstate)" }
  - { id: ERR_OCCUPATION_CLASS_DECLINED, http: 409, condition: "activate a policy whose occupation class risk_tier == DECLINE" }
  - { id: ERR_PREMIUM_NOT_CURRENT, http: 409, condition: "premium/miss when premium_status != CURRENT (expected first miss)" }
  - { id: ERR_PREMIUM_NOT_IN_GRACE, http: 409, condition: "premium/pay or second premium/miss when premium_status != GRACE" }
  - { id: ERR_PREMIUM_IN_DEFAULT, http: 409, condition: "claim approve while Policy.premium_status == DEFAULT" }
  - { id: ERR_OPEN_CLAIM_EXISTS, http: 409, condition: "terminate a policy while a claim is UNDER_REVIEW or PENDING_INFO" }
  - { id: ERR_CLAIM_NOT_DRAFT, http: 409, condition: "submit a claim whose status != DRAFT" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "begin-review a claim whose status != SUBMITTED" }
  - { id: ERR_CLAIM_NOT_UNDER_REVIEW, http: 409, condition: "request-info/approve/deny a claim whose status != UNDER_REVIEW" }
  - { id: ERR_CLAIM_NOT_PENDING_INFO, http: 409, condition: "resume-review a claim whose status != PENDING_INFO" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "suspend/reverse/close/offset-finalize requires Claim.status == APPROVED" }
  - { id: ERR_CLAIM_NOT_SUSPENDED, http: 409, condition: "reinstate a claim whose status != SUSPENDED" }
  - { id: ERR_CLAIM_NOT_PAYABLE, http: 409, condition: "benefit-period accrual when parent claim != APPROVED, or void when parent claim not in {APPROVED, SUSPENDED}" }
  - { id: ERR_RESIDUAL_INCOME_REPORT_REQUIRED, http: 422, condition: "submit a RESIDUAL claim with no IncomeReport" }
  - { id: ERR_ELIMINATION_NOT_SATISFIED, http: 409, condition: "approve before Insurer.current_month_index >= elimination_satisfied_month (boundary >=)" }
  - { id: ERR_BENEFIT_PERIOD_EXHAUSTED, http: 409, condition: "approve when Policy.benefit_months_consumed already >= benefit_period_months" }
  - { id: ERR_BENEFIT_PERIOD_WOULD_EXCEED, http: 422, condition: "accrual would drive benefit_months_consumed beyond benefit_period_months (would-exceed; equality allowed and exhausts)" }
  - { id: ERR_PROOF_NOT_CURRENT, http: 422, condition: "accrual coverage_month < elimination_satisfied_month, or > claim.next_proof_due_month (continued-disability proof lapsed)" }
  - { id: ERR_COVERAGE_MONTH_OCCUPIED, http: 409, condition: "an ACCRUED BenefitPeriod already covers this coverage_month on the claim" }
  - { id: ERR_OFFSET_WINDOW_OVERLAP, http: 409, condition: "offset window collides with an existing non-VOID OffsetAward of the same offset_source (closed interval; touching collides)" }
  - { id: ERR_OFFSET_NOT_ESTIMATED, http: 409, condition: "finalize an offset whose status != ESTIMATED" }
  - { id: ERR_OFFSET_NOT_VOIDABLE, http: 409, condition: "void an offset whose status == VOID already" }
  - { id: ERR_BENEFIT_PERIOD_NOT_ACCRUED, http: 409, condition: "void a benefit period whose status != ACCRUED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Underwriter
    description: "Issues and administers policies, occupation classes, policyholders, and the premium lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /disability/insurers"
      - "POST /disability/occupation-classes"
      - "POST /disability/policyholders"
      - "POST /disability/policies"
      - "POST /disability/policies/{policyId}/activate"
      - "POST /disability/policies/{policyId}/terminate"
      - "POST /disability/policies/{policyId}/premium/miss"
      - "POST /disability/policies/{policyId}/premium/pay"
    shared_operations:
      - "all GET reads"
  - name: Policyholder
    description: "The insured; files claims, submits continued-disability proofs and residual income reports against their own policy"
    identity: "entity_backed:Policyholder"
    exclusive_operations:
      - "POST /disability/claims"
      - "POST /disability/claims/{id}/submit"
      - "POST /disability/claims/{id}/income-reports"
      - "POST /disability/claims/{id}/disability-proofs"
    shared_operations:
      - "all GET reads"
  - name: ClaimsAdjudicator
    description: "Adjudicates claims, accrues benefit periods, manages offsets"
    identity: opaque
    exclusive_operations:
      - "POST /disability/claims/{id}/begin-review"
      - "POST /disability/claims/{id}/request-info"
      - "POST /disability/claims/{id}/resume-review"
      - "POST /disability/claims/{id}/approve"
      - "POST /disability/claims/{id}/deny"
      - "POST /disability/claims/{id}/suspend"
      - "POST /disability/claims/{id}/reinstate"
      - "POST /disability/claims/{id}/reverse"
      - "POST /disability/claims/{id}/close"
      - "POST /disability/claims/{id}/benefit-periods"
      - "POST /disability/benefit-periods/{benefitPeriodId}/void"
      - "POST /disability/claims/{id}/offset-awards"
      - "POST /disability/offset-awards/{offsetAwardId}/finalize"
      - "POST /disability/offset-awards/{offsetAwardId}/void"
    shared_operations:
      - "all GET reads"
  - name: SystemOperator
    description: "Operates the deterministic clock; no business adjudication powers"
    identity: opaque
    exclusive_operations:
      - "POST /disability/insurers/{insurerId}/clock/advance"
    shared_operations:
      - "all GET reads"
