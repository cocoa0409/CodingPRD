              as: FieldCoordinator
              captures: { a1: $.data.id }
            - call: "POST /ops/storm-events"
              payload: { name: "Tropical Storm Eve" }
              as: CommandCenterAdmin
              captures: { se2: $.data.id, se2_v: $.data.version }
            - call: "POST /ops/storm-events/${se2}/units"
              payload: { unit_code: "U-1002", address: "9 Gulf Dr" }
