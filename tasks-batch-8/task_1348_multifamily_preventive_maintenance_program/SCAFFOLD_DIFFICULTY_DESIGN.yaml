        grounds:
          - validations[priority=9]
          - errors[ERR_UNIT_ENTRY_OVERLAP]
        distinguishing_aspect: |
          Semantics = half-open per-visit intervals [start, start+duration) on
          the Unit resource: a second visit starting exactly when the first
