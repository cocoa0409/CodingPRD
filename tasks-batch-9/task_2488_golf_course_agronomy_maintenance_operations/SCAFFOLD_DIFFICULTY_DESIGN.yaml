              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /maintenance-windows/${win1_id}/complete"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T08:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
          trigger:
            - call: "POST /applications/${app1_id}/void"
              payload: { void_reason: "SAFETY_VIOLATION" }
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "before the trigger PlanTask.${task1_id}.status == COMPLETED, AgronomicPlan.${plan_id}.status == CLOSED, committed_nitrogen_lb == 4.68, TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 2.113"
            - "link 1: Application.${app1_id}.record_status == VOIDED, void_reason == SAFETY_VIOLATION, posting_status still NOT_REQUIRED"
            - "link 1: TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 0.000 and rei_expires_at == null"
            - "link 1 fork: Applicator.${appl_a_id}.license_status == SUSPENDED and suspended_at == 2026-08-12T08:00:00Z"
            - "link 2: PlanTask.${task1_id}.status == SCHEDULED"
            - "link 3: AgronomicPlan.${plan_id}.status == ACTIVE"
            - "link 3: AgronomicPlan.${plan_id}.committed_nitrogen_lb == 4.68 — the ledger value is unchanged because COMPLETED and SCHEDULED are both in the ledger set, so only the lifecycle state moves"
            - "TurfArea.${green7_id}.nitrogen_projected_lb_per_1000 == 0.850 (the task's 0.85 is counted again now that it is SCHEDULED)"

      - name: equipment_retirement_defers_dependent_window_and_releases_commitment
        grounds:
          - state_machines.EquipmentUnit.IN_SERVICE_to_RETIRED
          - state_machines.MaintenanceWindow.SCHEDULED_to_DEFERRED
          - state_machines.PlanTask.SCHEDULED_to_PLANNED
          - entities.MaintenanceWindow.fields.required_unit_type
          - calculations.plan_nitrogen_commitment_lb
        distinguishing_aspect: |
          Depth 3 from a fleet trigger: POST /equipment-units/{id}/retire
          causes the defer of exactly the windows whose required_unit_type has
          no IN_SERVICE unit left, which causes the task reversion, which
          causes the ledger debit. The trigger, the selection predicate (unit
          type exhaustion rather than an interval intersection) and the
          surviving decoy window all differ from the frost and void instances.
        test_recipe:
          setup:
            - "One course and one 5500 sq ft hole 7 green."
            - "A single-task 2026 plan with an 8.00 lb budget at 0.85 lb per 1000, approved and scheduled onto a FERTILITY window that requires a SPRAYER, so committed_nitrogen_lb is 4.68."
            - "A second, unscheduled MOWING window that requires a TRIPLEX_GREENS_MOWER."
            - "Exactly one IN_SERVICE SPRAYER and one IN_SERVICE TRIPLEX_GREENS_MOWER on the course."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 8.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", window_start: "2026-08-12T05:00:00Z", window_end: "2026-08-12T07:00:00Z", crew_size: 3, required_unit_type: "SPRAYER" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win_spray_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "MOWING", window_start: "2026-08-13T05:00:00Z", window_end: "2026-08-13T06:00:00Z", crew_size: 2, required_unit_type: "TRIPLEX_GREENS_MOWER" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win_mow_id: $.data.id }
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${win_spray_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /equipment-units"
              payload: { course_id: "${course_id}", unit_type: "SPRAYER", model_year: 2022, purchase_cost: 62000, expected_life_hours: 5000, service_interval_hours: 200, avg_daily_hours: 2.0, initial_engine_hours: 1000 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { sprayer_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { course_id: "${course_id}", unit_type: "TRIPLEX_GREENS_MOWER", model_year: 2024, purchase_cost: 41000, expected_life_hours: 6000, service_interval_hours: 250, avg_daily_hours: 3.0, initial_engine_hours: 300 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { triplex_id: $.data.id }
          trigger:
            - call: "POST /equipment-units/${sprayer_id}/retire"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "before the trigger AgronomicPlan.${plan_id}.committed_nitrogen_lb == 4.68 and PlanTask.${task1_id}.status == SCHEDULED"
            - "link 1: EquipmentUnit.${sprayer_id}.status == RETIRED and replaced_by_unit_id == null"
            - "link 2: MaintenanceWindow.${win_spray_id}.status == DEFERRED, deferral_count == 1, plan_task_id still ${task1_id}"
            - "link 3: PlanTask.${task1_id}.status == PLANNED"
            - "link 4: AgronomicPlan.${plan_id}.committed_nitrogen_lb == 0.00 and status is still ACTIVE (a PLANNED task is not terminal, so no bubble-up to CLOSED)"
            - "TurfArea.${green7_id}.nitrogen_projected_lb_per_1000 == 0.850 is invariant across the whole cascade, because the projection counts PLANNED and SCHEDULED alike while the plan ledger counts only SCHEDULED and COMPLETED"
            - "the decoy is untouched: MaintenanceWindow.${win_mow_id}.status == SCHEDULED and deferral_count == 0, since an IN_SERVICE TRIPLEX_GREENS_MOWER remains"
            - "EquipmentUnit.${triplex_id}.status == IN_SERVICE"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: buffer_zone_safety_outranks_license_category_referential
        grounds:
          - validations[priority=30]
          - validations[priority=35]
          - errors.ERR_BUFFER_ZONE_VIOLATION
          - errors.ERR_LICENSE_CATEGORY_MISMATCH
        distinguishing_aspect: |
          Pair of categories business_safety (30) against business_referential
          (35) on POST /applications. Both conditions hold in the same request:
          the swath is 40 ft from water under a 50 ft buffer, and a
          CAT_7_AQUATIC licence does not authorise a CAT_3_TURF product. The
          safety rule wins, so the response is ERR_BUFFER_ZONE_VIOLATION and
          the licence mismatch is never reported.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course and one 5500 sq ft green whose distance_to_water_ft is 40."
            - "One applicator licensed CAT_7_AQUATIC only, licence valid through 2027-06-30."
            - "One product requiring CAT_3_TURF with min_buffer_ft 50 and a 15 mph wind ceiling."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Wren Alvarez", license_number: "OR-CAT7-33003", license_category: "CAT_7_AQUATIC", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_c_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Greenside WDG", epa_reg_no: "4321-99", requires_license_category: "CAT_3_TURF", rei_hours: 12, min_buffer_ft: 50, max_wind_speed_mph: 15, posting_required: true, nitrogen_pct: 0 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "${prod_id}", applicator_id: "${appl_c_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 100, wind_speed_mph: 5, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_c_id}"
          assert:
            - "response is 422 with error_id == ERR_BUFFER_ZONE_VIOLATION"
            - "error_id != ERR_LICENSE_CATEGORY_MISMATCH even though that condition also holds"
            - "no Application row is created: GET /applications?turf_area_id=${green7_id} returns total_count == 0"
            - "TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 0.000 and rei_expires_at == null"

      - name: rei_safety_outranks_play_conflict_temporal
        grounds:
          - validations[priority=32]
          - validations[priority=40]
          - errors.ERR_REI_ACTIVE
          - errors.ERR_WINDOW_CONFLICTS_PLAY
        distinguishing_aspect: |
          A different pair of categories, business_safety (32) against
          business_temporal (40), and a different endpoint (POST
          /maintenance-windows). The proposed window starts inside a running
          restricted-entry interval and also lands inside a SHOTGUN_START
          event's whole-course occupancy; the crew-safety rule outranks the
          play-conflict rule, so ERR_REI_ACTIVE is returned.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T06:00:00Z."
            - "One course and one 5500 sq ft hole 7 green."
            - "One posted application of a 24 hour restricted-entry product on that green at the clock instant, so TurfArea.rei_expires_at is 2026-08-11T06:00:00Z."
            - "One SHOTGUN_START event on 2026-08-11 from 05:00Z to 10:00Z over 18 holes, which occupies every hole for its whole interval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-11001", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Fairway Guard SC", epa_reg_no: "1234-56", requires_license_category: "CAT_3_TURF", rei_hours: 24, min_buffer_ft: 25, max_wind_speed_mph: 12, posting_required: true, nitrogen_pct: 0 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { fung_id: $.data.id }
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "${fung_id}", applicator_id: "${appl_a_id}", applied_at: "2026-08-10T06:00:00Z", rate_lb_per_acre: 200, wind_speed_mph: 5, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /play-events"
              payload: { course_id: "${course_id}", event_type: "SHOTGUN_START", start_at: "2026-08-11T05:00:00Z", end_at: "2026-08-11T10:00:00Z", holes_in_play: 18, field_size: 144 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { shotgun_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "MOWING", window_start: "2026-08-11T05:30:00Z", window_end: "2026-08-11T05:45:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "response is 409 with error_id == ERR_REI_ACTIVE"
            - "error_id != ERR_WINDOW_CONFLICTS_PLAY even though the window falls inside the shotgun occupancy of hole 7"
            - "no MaintenanceWindow row is created: GET /maintenance-windows?turf_area_id=${green7_id} returns total_count == 0"
            - "TurfArea.${green7_id}.rei_expires_at is still 2026-08-11T06:00:00Z"

      - name: plan_state_outranks_nitrogen_budget_fiscal
        grounds:
          - validations[priority=17]
          - validations[priority=51]
          - errors.ERR_PLAN_STATE_INVALID
          - errors.ERR_NITROGEN_BUDGET_EXCEEDED
        distinguishing_aspect: |
          A third pair of categories, state (17) against business_fiscal (51),
          on POST /plan-tasks/{id}/schedule. The plan is still SUBMITTED and the
          scheduling would also blow a 4.00 lb budget with a 4.68 lb
          commitment; the lifecycle rule is checked first, so the caller sees
          ERR_PLAN_STATE_INVALID and learns nothing about the budget.
        test_recipe:
          setup:
            - "One course and one 5500 sq ft hole 7 green."
            - "One 2026 plan with a deliberately tight 4.00 lb nitrogen budget carrying one PLANNED FERTILITY task at 0.85 lb per 1000, whose commitment_lb is 4.68."
            - "The plan is submitted by agro-1 and left SUBMITTED — never approved."
            - "One SCHEDULED window inside the task's planned window."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 4.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", window_start: "2026-08-12T05:00:00Z", window_end: "2026-08-12T07:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win1_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
          trigger:
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${win1_id}", expected_plan_version: "${plan_v_submitted}" }
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "response is 409 with error_id == ERR_PLAN_STATE_INVALID"
            - "error_id != ERR_NITROGEN_BUDGET_EXCEEDED even though 4.68 exceeds the 4.00 budget"
            - "PlanTask.${task1_id}.status is still PLANNED and commitment_lb == 4.68"
            - "AgronomicPlan.${plan_id}.status == SUBMITTED, committed_nitrogen_lb == 0.00, version == ${plan_v_submitted}"
            - "MaintenanceWindow.${win1_id}.plan_task_id == null"

      - name: pump_flow_constraint_outranks_water_allocation_fiscal
        grounds:
          - validations[priority=45]
          - validations[priority=50]
          - errors.ERR_PUMP_FLOW_CAPACITY
          - errors.ERR_WATER_ALLOCATION_EXCEEDED
          - calculations.irrigation_run_allotment
        distinguishing_aspect: |
          A fourth pair of categories, business_constraint (45) against
          business_fiscal (50), on POST /irrigation-runs. The second run's own
          134.33 gpm plus the 2.84 gpm already booked in the same interval is
          137.17 gpm against a 50 gpm station, and its 8060.0 gal allotment also
          exceeds the 5000 gal annual allocation; the hydraulic limit is checked
          before the fiscal one.
        test_recipe:
          setup:
            - "One course with a 5000 gal annual allocation."
            - "One 5500 sq ft hole 7 green and one 130000 sq ft hole 7 fairway."
            - "One WELL station with a 10000 gal daily cap, a 50 gpm ceiling and 2 zones, so neither the daily cap nor the zone count binds."
            - "One SCHEDULED run on the green from 04:00Z to 05:00Z at a 5 point deficit: 170.5 gal at 2.84 gpm."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 5000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "FAIRWAY", hole_number: 7, area_sq_ft: 130000, mowing_height_mm: 12.7, distance_to_water_ft: 15, soil_type: "NATIVE_LOAM" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { fw7_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "WELL", max_flow_gpm: 50, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 10000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_id: $.data.id, pump_v1: $.data.version }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green7_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 5, expected_pump_station_version: "${pump_v1}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_a_id: $.data.id }
            - call: "GET /pump-stations/${pump_id}"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_v_now: $.data.version }
          trigger:
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${fw7_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_v_now}" }
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "the booked run has IrrigationRun.${run_a_id}.allotted_gal == 170.5 and flow_gpm == 2.84"
            - "the rejected run would have been 8060.0 gal at 134.33 gpm, so 2.84 + 134.33 == 137.17 gpm against a 50 gpm ceiling"
            - "response is 409 with error_id == ERR_PUMP_FLOW_CAPACITY"
            - "error_id != ERR_WATER_ALLOCATION_EXCEEDED even though 8060.0 gal exceeds the 5000 gal allocation"
            - "error_id != ERR_PUMP_ZONE_CAPACITY: the intersecting count is 1 + 1 == 2, exactly the station's max_concurrent_zones"
            - "no second IrrigationRun row exists: GET /irrigation-runs?pump_station_id=${pump_id} returns total_count == 1"
            - "PumpStation.${pump_id}.withdrawn_today_gal == 0 and Course.${course_id}.water_used_gal == 0"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: plan_ledger_exactly_at_budget_then_one_nickel_over
        grounds:
          - validations[priority=51]
          - calculations.plan_nitrogen_commitment_lb
          - entities.AgronomicPlan.fields.nitrogen_budget_lb
        distinguishing_aspect: |
          Metric: the plan nitrogen ledger in pounds, on POST
          /plan-tasks/{id}/schedule, at its INCLUSIVE upper endpoint. The
          budget is set to exactly the 7.91 lb the first two tasks commit, so
          the equality case is accepted, and the next 0.05 lb task is refused.
          No other instance pins this metric or this endpoint.
        test_recipe:
          setup:
            - "One course with a 5500 sq ft hole 7 green, a 4300 sq ft hole 12 green and a 5000 sq ft hole 3 green."
            - "One 2026 plan whose nitrogen_budget_lb is exactly 7.91."
