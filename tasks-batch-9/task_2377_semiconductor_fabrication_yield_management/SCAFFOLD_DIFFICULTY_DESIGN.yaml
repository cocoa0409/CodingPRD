  # =====================================================================
  # R9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: equipment_capacity_hours_restored_exactly_on_abort
        grounds:
          - calculations.equipment_capacity_hours_ledger
          - state_machines.StepRun.OPEN_to_ABORTED
          - state_machines.StepRun.OPEN_to_COMPLETED
          - entities.StepRun.fields.reserved_hours
        distinguishing_aspect: |
          Conserved quantity: Equipment.available_capacity_hours, which must always equal
          INITIAL_CAPACITY_HOURS minus completed actual hours minus open reservations. A
          track-in/track-out pair converts a 2.00 h reservation into 2.00 h of consumption, and a
          second track-in followed by an abort must give the full 2.00 h back and leave
          hours_since_pm untouched — so the ledger returns to exactly 718.00 with zero drift
          rather than double-charging or leaking the reservation.
        test_recipe:
          setup:
            - "FLOW-A RELEASED with seq 10 LITHO 2.0h and seq 20 ETCH 3.0h."
            - "LITHO-1 (purge_buffer_hours 0.0) carries CH_L1, QUALIFIED at 2026-08-01T00:00:00Z; available_capacity_hours 720.00, hours_since_pm 0.0, state IDLE."
            - "Operator OP-001 certified for LITHO/ETCH/CMP and GOWNED."
            - "PLAN-A COMMITTED; LOT-001 and LOT-002 (3 wafers each, STANDARD) both released at current_step_seq 0."
            - "No step-run exists yet, so the ledger is at its initial value."
            - "The logical clock reads 2026-08-01T00:00:00Z at the start of the trigger."
