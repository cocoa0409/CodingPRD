            - "MinePlan.${plan_v}.status remains SUBMITTED"

      - name: inspector_cannot_decide_contest
        claim_type: role_denial
        grounds:
          - roles.CommissionJudge
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Contest decisions belong to the independent commission: the inspector who issued the citation cannot decide the contest (403 ERR_UNAUTHORIZED) — segregation between enforcement and adjudication."
        test_recipe:
          setup:
