  - method: GET
    path: "/deliverables/{id}"
    description: "Get a deliverable"
    roles: [AgencyAdmin, AccountManager, Client]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: GET
    path: "/deliverables"
    description: "List deliverables; filter by client_id, retainer_id, or sprint_id (reverse-reachability for Deliverable.client_id, Deliverable.retainer_id, Deliverable.sprint_id)"
    roles: [AgencyAdmin, AccountManager, Client]
    code: 200
    input: ["client_id?", "retainer_id?", "sprint_id?", "status?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: POST
    path: "/deliverables/{id}/assign"
    description: "DRAFT -> ASSIGNED; reserves credits (OCC on Retainer.version)"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: [expected_retainer_version]
    output: Deliverable
    side_effects: ["Retainer.credits_committed += credit_cost; Sprint.committed_credits += credit_cost; increments Retainer.version by 1"]
  - method: POST
    path: "/deliverables/{id}/start"
    description: "ASSIGNED -> IN_PROGRESS"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: POST
    path: "/deliverables/{id}/submit"
    description: "IN_PROGRESS -> IN_REVIEW"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: POST
    path: "/deliverables/{id}/request_revision"
    description: "IN_REVIEW -> IN_PROGRESS (revision loop)"
    roles: [Client]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["revision_count += 1"]
  - method: POST
    path: "/deliverables/{id}/approve"
    description: "IN_REVIEW -> APPROVED; commits credits to consumed"
    roles: [Client]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["Retainer.credits_committed -= credit_cost; credits_consumed += credit_cost"]
  - method: POST
    path: "/deliverables/{id}/reject"
    description: "ASSIGNED/IN_PROGRESS/IN_REVIEW -> REJECTED; releases reserved credits"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["Retainer.credits_committed -= credit_cost; Sprint.committed_credits -= credit_cost"]
  - method: POST
    path: "/deliverables/{id}/cancel"
    description: "Non-terminal -> CANCELLED; conditional credit release"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["conditional release of committed credits if was reserved"]

