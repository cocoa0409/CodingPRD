# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Farm-Box Aggregator — 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: line_pricing_estimated_vs_final_weight
        grounds:
          - calculations.line_pricing
          - entities.OrderLine.fields.estimated_line_cents
          - entities.OrderLine.fields.final_line_cents
          - state_machines.OrderLine.ALLOCATED_to_PACKED
        distinguishing_aspect: "Dual variant lives on the OrderLine domain: same offering (price_per_kg 800) and same 3 units yield estimated_line_cents=1200 (estimated weight 0.5/unit) but final_line_cents=1360 (measured 1.7kg)."
        test_recipe:
          setup:
            - "Farm (commission 0.15, snap_authorized) with a WEIGHT tomato product (price_per_kg 800, est_weight 0.5, snap_eligible); OPEN cycle C1; offering offered_qty 100; a customer with a CART order carrying one tomato line qty 3 (estimated_line_cents=1200); order checked out then cycle cut off so the line is ALLOCATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "Downtown Pickup", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 800 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Heirloom Tomatoes", category: "PRODUCE", pricing_mode: "WEIGHT", price_per_kg_cents: 800, estimated_weight_kg: 0.5, snap_eligible: true }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_tom_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_tom_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_tom_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_tom_id}", requested_qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_tom_id: $.data.id, est_tom: $.data.estimated_line_cents }
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /market-cycles/${cycle_id}/cutoff"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /order-lines/${line_tom_id}/pack"
              payload: { fulfilled_qty: 3, actual_weight_kg: 1.7 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { fin_tom: $.data.final_line_cents }
          assert:
            - "OrderLine.${line_tom_id}.estimated_line_cents == 1200"
            - "OrderLine.${line_tom_id}.final_line_cents == 1360"
            - "OrderLine.${line_tom_id}.price_delta_cents == 160"
            - "OrderLine.${line_tom_id}.line_status == PACKED"

      - name: order_owed_estimated_vs_final_reconciliation
        grounds:
          - calculations.order_benefit_application
          - entities.Order.fields.customer_owed_cents
          - entities.Order.fields.final_total_cents
          - state_machines.Order.ALLOCATED_to_FULFILLED
        distinguishing_aspect: "Dual variant lives on the Order/Customer domain (distinct from the OrderLine pricing variant): the same order's customer_owed_cents is 900 under the estimated variant at checkout but 1060 under the final variant at fulfillment because SNAP/Double-Up are frozen while gross rises 2500->2660."
        test_recipe:
          setup:
            - "Same farm/hub/customer (snap 800) and OPEN cycle; three lines: tomatoes WEIGHT qty3 (est 1200), eggs FIXED 400 qty2 (800), flowers FIXED 500 qty1 (500, non-snap). Checkout freezes snap_applied=800, doubleup_match=800, customer_owed=900. Cycle cut off, all three lines packed (tomatoes measured 1.7kg -> 1360)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "Downtown Pickup", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 800 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Heirloom Tomatoes", category: "PRODUCE", pricing_mode: "WEIGHT", price_per_kg_cents: 800, estimated_weight_kg: 0.5, snap_eligible: true }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_tom_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Eggs", category: "DAIRY", pricing_mode: "FIXED", unit_price_cents: 400, snap_eligible: true }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_egg_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Cut Flowers", category: "OTHER", pricing_mode: "FIXED", unit_price_cents: 500, snap_eligible: false }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_flower_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_tom_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_tom_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_egg_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_egg_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_flower_id}", offered_qty: 50 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_flower_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_tom_id}", requested_qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_tom_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_egg_id}", requested_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_egg_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_flower_id}", requested_qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_flower_id: $.data.id }
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { owed_est: $.data.customer_owed_cents }
            - call: "POST /market-cycles/${cycle_id}/cutoff"
              payload: {}
              as: PlatformAdmin
            - call: "POST /order-lines/${line_tom_id}/pack"
              payload: { fulfilled_qty: 3, actual_weight_kg: 1.7 }
              as: Farm
              as_user_id: "${farm_id}"
            - call: "POST /order-lines/${line_egg_id}/pack"
              payload: { fulfilled_qty: 2 }
              as: Farm
              as_user_id: "${farm_id}"
            - call: "POST /order-lines/${line_flower_id}/pack"
              payload: { fulfilled_qty: 1 }
              as: Farm
              as_user_id: "${farm_id}"
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: PlatformAdmin
              captures: { owed_fin: $.data.customer_owed_cents }
          assert:
            - "checkout response customer_owed_cents == 900 (estimated variant)"
            - "Order.${order_id}.customer_owed_cents == 1060 (final variant after fulfill)"
            - "Order.${order_id}.final_total_cents == 2660"
            - "Order.${order_id}.snap_applied_cents == 800 and Order.${order_id}.doubleup_match_cents == 800 (frozen)"

  - rule_id: combinatorial_formula
    instances:
      - name: benefit_application_nested_min_max_mode_a
        grounds:
          - calculations.order_benefit_application
          - entities.Order.fields.snap_applied_cents
          - entities.Order.fields.doubleup_match_cents
          - entities.Order.fields.customer_owed_cents
        distinguishing_aspect: "Mode (a): the checkout formula nests min/max over >=3 inputs (snap_balance 800, eligible_subtotal 2000, DOUBLEUP_CAP 2000, doubleup_used 0) with a conditional snap_eligible filter, yielding snap_applied=800, doubleup_match=min(800,2000)=800, owed=max(0,2500-1600)=900."
        test_recipe:
          setup:
            - "Farm/hub/customer (snap 800, doubleup_used 0) and OPEN cycle with three offerings; CART order with tomato line qty3 (est 1200, snap-eligible), egg line qty2 (800, snap-eligible), flower line qty1 (500, non-eligible). Eligible subtotal 2000, gross subtotal 2500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "Downtown Pickup", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 800 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Heirloom Tomatoes", category: "PRODUCE", pricing_mode: "WEIGHT", price_per_kg_cents: 800, estimated_weight_kg: 0.5, snap_eligible: true }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_tom_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Eggs", category: "DAIRY", pricing_mode: "FIXED", unit_price_cents: 400, snap_eligible: true }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_egg_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Cut Flowers", category: "OTHER", pricing_mode: "FIXED", unit_price_cents: 500, snap_eligible: false }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_flower_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_tom_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_tom_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_egg_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_egg_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_flower_id}", offered_qty: 50 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_flower_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_tom_id}", requested_qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_egg_id}", requested_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_flower_id}", requested_qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { owed: $.data.customer_owed_cents }
          assert:
            - "Order.${order_id}.eligible_subtotal_cents == 2000"
            - "Order.${order_id}.snap_applied_cents == 800"
            - "Order.${order_id}.doubleup_match_cents == 800"
            - "Order.${order_id}.customer_owed_cents == 900"
            - "Customer.${cust_id}.snap_balance_cents == 0 and Customer.${cust_id}.doubleup_used_cents == 800"

      - name: settlement_commission_per_line_rounding_mode_b
        grounds:
          - calculations.vendor_settlement_payout
          - entities.VendorSettlement.fields.commission_cents
          - entities.VendorSettlement.fields.net_payout_cents
          - concurrency_rules[settlement-create-stale-farm]
        distinguishing_aspect: "Mode (b): commission rounds PER LINE then sums — two FULFILLED lines of 1010 @ 0.15 give round(151.5)+round(151.5)=152+152=304, whereas sum-then-round gives round(2020*0.15)=303; the scaffold pins per-line, so commission_cents=304 and net_payout_cents=1716."
        test_recipe:
          setup:
            - "Farm (commission 0.15) with a WEIGHT non-snap product (price_per_kg 2020); cycle with an offering; a customer (snap 0) orders two units of that product on separate lines; both packed at actual weight 0.5kg (final 1010 each), order fulfilled, cycle settled. Farm.version observed just before settlement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Sun Farm", region_code: "R2", commission_pct: 0.15, snap_authorized: false }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "R2 Pickup", hub_type: "PICKUP", slot_capacity: 100, region_code: "R2" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Bo", snap_balance_cents: 0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Sweet Corn", category: "PRODUCE", pricing_mode: "WEIGHT", price_per_kg_cents: 2020, estimated_weight_kg: 0.6, snap_eligible: false }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C2", region_code: "R2", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_id}", requested_qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line1_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_id}", requested_qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line2_id: $.data.id }
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /market-cycles/${cycle_id}/cutoff"
              payload: {}
              as: PlatformAdmin
            - call: "POST /order-lines/${line1_id}/pack"
              payload: { fulfilled_qty: 1, actual_weight_kg: 0.5 }
              as: Farm
              as_user_id: "${farm_id}"
            - call: "POST /order-lines/${line2_id}/pack"
              payload: { fulfilled_qty: 1, actual_weight_kg: 0.5 }
              as: Farm
              as_user_id: "${farm_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: PlatformAdmin
            - call: "POST /market-cycles/${cycle_id}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "GET /farms/${farm_id}"
              payload: {}
              as: PlatformAdmin
              captures: { farm_v: $.data.version }
          trigger:
            - call: "POST /farms/${farm_id}/settlements"
              payload: { market_cycle_id: "${cycle_id}", expected_farm_version: "${farm_v}" }
              as: PlatformAdmin
              captures: { settlement_id: $.data.id }
          assert:
            - "VendorSettlement.${settlement_id}.gross_sales_cents == 2020"
            - "VendorSettlement.${settlement_id}.commission_cents == 304"
            - "VendorSettlement.${settlement_id}.net_payout_cents == 1716"
            - "VendorSettlement.${settlement_id}.line_count == 2"

  - rule_id: non_linear_state_machine
    instances:
      - name: orderline_branching_pack_short_substitute
        grounds:
          - state_machines.OrderLine.ALLOCATED_to_PACKED
          - state_machines.OrderLine.ALLOCATED_to_SHORTED
          - state_machines.OrderLine.ALLOCATED_to_SUBSTITUTED
          - entities.OrderLine.fields.line_status
        distinguishing_aspect: "OrderLine is a branching fork-join: from ALLOCATED the same trigger endpoint routes to PACKED (fulfilled==allocated), SHORTED (fulfilled<allocated), or SUBSTITUTED (substitute_offering_id given), each with a divergent side-effect set; this is non-linear on the OrderLine entity."
        test_recipe:
          setup:
            - "Farm/hub/customer/OPEN cycle with two offerings of a FIXED egg product (400) each offered_qty 100; one order with two egg lines qty2 and qty2, checked out, cycle cut off so both lines ALLOCATED (allocated_qty 2 each)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farms"
              payload: { name: "Green Acres", region_code: "R1", commission_pct: 0.15, snap_authorized: true }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /pickup-hubs"
              payload: { name: "Downtown Pickup", hub_type: "PICKUP", slot_capacity: 100, region_code: "R1" }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ada", snap_balance_cents: 0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /farms/${farm_id}/products"
              payload: { name: "Eggs", category: "DAIRY", pricing_mode: "FIXED", unit_price_cents: 400, snap_eligible: false }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { prod_egg_id: $.data.id }
            - call: "POST /market-cycles"
              payload: { cycle_code: "C1", region_code: "R1", order_open_at: "2026-06-02T00:00:00Z", order_cutoff_at: "2026-06-05T00:00:00Z", fulfillment_date: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_egg_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_a_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/offerings"
              payload: { product_id: "${prod_egg_id}", offered_qty: 100 }
              as: Farm
              as_user_id: "${farm_id}"
              captures: { off_b_id: $.data.id }
            - call: "POST /market-cycles/${cycle_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { market_cycle_id: "${cycle_id}", pickup_hub_id: "${hub_id}", fulfillment_type: "PICKUP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_a_id}", requested_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_short_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { offering_id: "${off_a_id}", requested_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_sub_id: $.data.id }
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /market-cycles/${cycle_id}/cutoff"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /order-lines/${line_short_id}/pack"
              payload: { fulfilled_qty: 1 }
              as: Farm
              as_user_id: "${farm_id}"
