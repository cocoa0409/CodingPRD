  - rule_id: cross_entity_state_dependency
    instances:
      - name: negotiation_acceptance_gated_by_campaign_plan_state
        grounds:
          - validations[priority 17]
          - validations[priority 18]
          - errors.ERR_CAMPAIGN_PLAN_NOT_APPROVED
          - state_machines.Campaign.PENDING_CLIENT_APPROVAL_to_APPROVED
          - state_machines.ChannelAllocation.DRAFT_to_LOCKED
          - state_machines.Negotiation.SELLER_COUNTER_to_ACCEPTED
        distinguishing_aspect: |
          The same accept call is issued twice against a negotiation whose own status, terms
          and version never change between the attempts. It fails with
          ERR_CAMPAIGN_PLAN_NOT_APPROVED while the campaign sits in
          PENDING_CLIENT_APPROVAL and succeeds once the client approves - a write whose
          legality is decided entirely by two other entities (Campaign.plan_status and the
          allocation that only reaches LOCKED as a side effect of that approval).
        test_recipe:
          setup:
            - "one advertiser, one seller and a 30,000,000 cent campaign whose plan has been submitted but not approved, so plan_status is PENDING_CLIENT_APPROVAL and its single allocation is still DRAFT"
            - "a negotiation on that allocation countered by the seller to 3,000,000 impressions at CPM 2100, so it sits in SELLER_COUNTER at round_number 2"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Wexford Airlines", category_code: "TRAVEL", credit_limit_cents: 90000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv12_id: $.data.id }
            - call: "POST /upfront/sellers"
              payload: { name: "Skyline Sports Net", platform_types: ["LINEAR", "CTV"], make_good_capacity_impressions: 6000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel12_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv12_id}", name: "Fly Q4", target_demo: "A25-54", universe_thousands: 100000, reach_goal_pct: 40.0, frequency_goal: 3.0, total_budget_cents: 30000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c12_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c12_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2000, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al14_id: $.data.id }
            - call: "POST /upfront/campaigns/${c12_id}/submit-plan"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
            - call: "POST /upfront/negotiations"
              payload: { campaign_id: "${c12_id}", seller_id: "${sel12_id}", channel_allocation_id: "${al14_id}", market: "UPFRONT", channel: "LINEAR_TV", requested_impressions: 3000000, opening_cpm_cents: 1950, guarantee_pct: 100, make_good_provision: "MAKE_GOOD_UNITS", option_pct_ceiling: 25 }
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { n16_id: $.data.id, n16_v1: $.data.version }
            - call: "POST /upfront/negotiations/${n16_id}/counter"
              payload: { expected_negotiation_version: "${n16_v1}", counter_cpm_cents: 2100, counter_impressions: 3000000 }
              as: SellerRep
              as_user_id: "${sel12_id}"
              captures: { n16_v2: $.data.version }
          trigger:
            - call: "POST /upfront/negotiations/${n16_id}/accept"
              payload: {}
              as: AgencyBuyer
              as_user_id: "buyer-01"
            - call: "POST /upfront/campaigns/${c12_id}/approve-plan"
              payload: {}
              as: AdvertiserClient
              as_user_id: "${adv12_id}"
            - call: "POST /upfront/negotiations/${n16_id}/accept"
              payload: {}
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { b15_id: $.data.id }
          assert:
            - "the first accept trigger returns 409 with error_id ERR_CAMPAIGN_PLAN_NOT_APPROVED (priority 17 wins over the DRAFT-allocation violation at priority 18)"
            - "Negotiation.${n16_id}.status == SELLER_COUNTER and Negotiation.${n16_id}.version == ${n16_v2} and Negotiation.${n16_id}.round_number == 2 after the refusal"
            - "the make-goods and buys lists for this campaign are unchanged by the refusal: no Buy exists with negotiation_id ${n16_id}"
            - "after approve-plan: Campaign.${c12_id}.plan_status == APPROVED and ChannelAllocation.${al14_id}.status == LOCKED"
            - "the second accept trigger returns 201 and Negotiation.${n16_id}.status == ACCEPTED with accepted_cpm_cents 2100 and accepted_impressions 3000000"
            - "Buy.${b15_id}.net_media_cost_cents == 6300000 and Buy.${b15_id}.commission_rate == 0.0550 and Buy.${b15_id}.agency_commission_cents == 346500 and Buy.${b15_id}.gross_cost_cents == 6646500"
            - "Buy.${b15_id}.buy_status == PENDING_PLACEMENT and Campaign.${c12_id}.committed_gross_cents == 0 (acceptance commits no budget)"

