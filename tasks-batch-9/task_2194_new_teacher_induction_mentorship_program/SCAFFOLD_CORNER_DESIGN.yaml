            - "GET /observation-cycles/${oc1_id} reports phase == \"ABANDONED\" and abandoned_at == \"2026-08-04T12:00:00Z\""
            - "GET /mentors/${mentor_id} reports active_caseload_count == 0 and certification_status == \"CERTIFIED\" — the mentor is untouched apart from the released slot"
            - "GET /sites/${site_id} reports active_match_count == 0"

      - name: void_reconciles_ancestor_minute_ledger
        claim_type: ledger_sync
        grounds: [state_machines.ContactLog.transitions.VERIFIED_to_VOIDED, entities.Mentor.fields.verified_minutes_lifetime]
        excluded_because:
          difficulty_instance: compensating_invariant / void_restores_verified_minute_ledger
          rationale: "The before/after reconciliation of the match, mentor and novice minute ledgers across a VOID is the whole subject of the named §1.8 instance."

      - name: clawback_reverses_paid_stipend_without_drift
        claim_type: compensation
        grounds: [state_machines.StipendDisbursement.transitions.PAID_to_CLAWED_BACK, entities.Mentor.fields.stipend_clawed_back_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / clawback_conserves_stipend_cents
          rationale: "The named §1.8 instance asserts that the clawback moves every cent from stipend_paid_cents to stipend_clawed_back_cents while the disbursement's own net_cents is preserved."

      - name: session_cancel_zeroes_credit_only_for_its_own_session
        claim_type: conditional_cascade
        grounds: [state_machines.SeminarSession.transitions.SCHEDULED_to_CANCELLED, calculations.novice_readiness_index, entities.SeminarSession.fields.credited_attendance_count]
        distinguishing_aspect: "Cancellation must be scoped: only attendance credit booked against the cancelled session is withdrawn. The already-HELD sibling session keeps its credited_attendance_count, and because a CANCELLED session never entered the readiness denominator, the readiness index is unchanged even though credited_seminar_sessions drops."
        test_recipe:
          setup: ["Cohort NORTH-2026 owns two 90-minute sessions in ISO week 2026-W32 — session_index 1 on 2026-08-05 which is already HELD, and session_index 2 on 2026-08-06 which is still SCHEDULED. The single enrolled novice holds a PRESENT 90-minute attendance row on each, so credited_seminar_sessions is 2 while held_sessions is 1. The logical clock is at 2026-08-05T11:00:00Z."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 2 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 1, topic: "Classroom routines", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:30:00Z" }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 2, topic: "Formative assessment", scheduled_start: "2026-08-06T09:00:00Z", scheduled_end: "2026-08-06T10:30:00Z" }
              as: ProgramAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /seminar-attendances"
              payload: { session_id: "${s1_id}", novice_id: "${novice_id}", attendance_status: "PRESENT", minutes_attended: 90 }
              as: SiteInductionLead
              as_user_id: "${site_id}"
              captures: { att1_id: $.data.id }
            - call: "POST /seminar-attendances"
              payload: { session_id: "${s2_id}", novice_id: "${novice_id}", attendance_status: "PRESENT", minutes_attended: 90 }
              as: SiteInductionLead
              as_user_id: "${site_id}"
              captures: { att2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T11:00:00Z" }
              as: ProgramAdmin
            - call: "POST /seminar-sessions/${s1_id}/status"
              payload: { status: "HELD" }
              as: ProgramAdmin
          trigger:
            - call: "POST /seminar-sessions/${s2_id}/status"
              payload: { status: "CANCELLED", cancel_reason: "Facilitator unavailable" }
              as: ProgramAdmin
          assert:
