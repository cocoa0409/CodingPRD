  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_lounge_capacity_exceeded
        grounds:
          - calculations.lounge_bay_overlap
          - validations[priority=11]
          - entities.Lounge.fields.bay_count
          - errors[ERR_SLOT_CONFLICT]
        distinguishing_aspect: >
          With bay_count=1, a second OVERLAPPING lounge slot (09:00-10:00 vs
          09:30-10:30) is rejected because concurrent_count (1) >= bay_count (1) —
          aggregate-capacity interval semantics on the Lounge resource (back-to-back
          would be allowed; only true overlap is rejected).
        test_recipe:
          setup:
            - "Clock 2026-06-22; MYERS LOUNGE; lounge bay_count=1, supply 5; first appointment 09:00-10:00 SCHEDULED."
