# =============================================================================
# task_0891 — Restitution & Court-Fee Collection — seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Restitution & Court-Fee Collection: obligation & judgment ledger, payment plan
  & ability-to-pay, disbursement to victim, delinquency & civil-judgment/license-hold,
  wage-assignment, amnesty/waiver, aging & write-off, reporting

domain_name: restitution-court-fee-collection
api_prefix: /collections

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - waterfall_allocation
    - cascading_side_effects
    - optimistic_concurrency
    # also present: derived_field_reconciliation, scheduled/deferred (logical clock)
  entity_topology: flat
  # peer entities linked by FK references in request bodies; top-level collections
  # under a shared /collections prefix; no parent-id nesting in URL paths.
  state_machine_shape: cyclic
  # PaymentPlan cycles ACTIVE<->DEFAULTED; Obligation forks to SATISFIED/WAIVED/WRITTEN_OFF.
  relationship_patterns:
    - one_to_many        # Case -> Obligation/Payment/PaymentPlan/WageAssignment/EnforcementAction
    - cross_aggregate    # Obligation/Disbursement reference Victim across the Case aggregate
  role_model: segregation_of_duties
  # Clerk records money in; Supervisor approves waivers/write-offs/reversals; the
  # same X-User-ID cannot both request and approve a waiver.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Case
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: case_number, type: string, source: input, description: "Court docket / case number (unique)" }
      - { name: defendant_name, type: string, source: input, description: "Name of the obligor (defendant)" }
      - { name: status, type: enum, source: computed, description: "OPEN | SATISFIED — SATISFIED iff total_assessed_cents > 0 and balance_cents == 0; recomputed on every child mutation" }
      - { name: delinquency_status, type: enum, source: system, default: CURRENT, description: "CURRENT | DELINQUENT — flipped to DELINQUENT by the delinquency sweep when an ACTIVE plan defaults; reset to CURRENT when a plan is reinstated" }
      - { name: total_assessed_cents, type: integer, source: computed, description: "Sum of Obligation.assessed_amount_cents over all obligations of this case" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Sum of Obligation.paid_amount_cents over all obligations (equivalently sum of POSTED Payment.amount_cents)" }
      - { name: total_waived_cents, type: integer, source: computed, description: "Sum of Obligation.waived_amount_cents over all obligations" }
      - { name: total_written_off_cents, type: integer, source: computed, description: "Sum of Obligation.assessed_amount_cents minus prior paid/waived for obligations whose status == WRITTEN_OFF" }
      - { name: balance_cents, type: integer, source: computed, description: "Sum of Obligation.balance_cents over obligations whose status is not WRITTEN_OFF and not WAIVED" }

  - name: Victim
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Victim / payee name" }
      - { name: payable_balance_cents, type: integer, source: computed, description: "Restitution collected for this victim from POSTED payments minus sum of Disbursement.amount_cents in status PENDING or PAID; never negative" }

  - name: Obligation
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this obligation belongs to" }
      - { name: victim_id, type: string, source: input, description: "FK -> Victim.id; required when obligation_type == RESTITUTION, forbidden otherwise" }
      - { name: obligation_type, type: enum, source: input, description: "RESTITUTION | COURT_FEE | FINE | SURCHARGE" }
      - { name: assessed_amount_cents, type: integer, source: input, description: "Amount assessed by the court, in cents; must be > 0" }
      - { name: priority_rank, type: integer, source: input, default: "derived from obligation_type via DEFAULT_PRIORITY_RANK", description: "Waterfall priority; lower is paid first; defaults RESTITUTION=1, COURT_FEE=2, FINE=3, SURCHARGE=4" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Sum of per-obligation allocation amounts from POSTED payments; decreases when a payment is reversed" }
      - { name: waived_amount_cents, type: integer, source: computed, description: "Sum of approved WaiverRequest.requested_amount_cents applied to this obligation" }
      - { name: balance_cents, type: integer, source: computed, description: "max(0, assessed_amount_cents - paid_amount_cents - waived_amount_cents); reported as 0 when status is WRITTEN_OFF or WAIVED" }
      - { name: status, type: enum, source: system, default: OUTSTANDING, description: "OUTSTANDING | PARTIALLY_PAID | SATISFIED | WAIVED | WRITTEN_OFF" }

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this plan governs" }
      - { name: monthly_income_cents, type: integer, source: input, description: "Obligor declared gross monthly income, in cents; must be >= 0" }
      - { name: monthly_expenses_cents, type: integer, source: input, description: "Obligor declared allowable monthly expenses, in cents; must be >= 0" }
      - { name: ability_to_pay_method, type: enum, source: input, description: "NET_DISPOSABLE | GROSS_INCOME — selects the ability-to-pay basis" }
      - { name: monthly_amount_cents, type: integer, source: computed, description: "Installment amount from the ability_to_pay_installment calculation at creation time" }
      - { name: next_due_date, type: datetime, source: computed, description: "On activation: activation clock date + PLAN_DUE_INTERVAL_DAYS; null while PROPOSED/SUPERSEDED" }
      - { name: missed_payment_count, type: integer, source: system, default: 0, description: "Incremented by the delinquency sweep each time the plan defaults; reset to 0 on reinstatement" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | ACTIVE | DEFAULTED | COMPLETED | SUPERSEDED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this payment is posted against" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0 and <= case balance_cents at posting time" }
      - { name: allocation_method, type: enum, source: input, description: "STATUTORY_PRIORITY | PRO_RATA — how the amount is distributed across outstanding obligations" }
      - { name: allocations, type: array, source: system, description: "Ledger lines produced at posting: list of { obligation_id, amount_cents }; frozen once POSTED, cleared on reversal for accounting purposes" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | REVERSED" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: victim_id, type: string, source: input, description: "FK -> Victim.id; the payee" }
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case whose collected restitution funds this disbursement" }
      - { name: amount_cents, type: integer, source: input, description: "Disbursement amount in cents; must be > 0 and <= Victim.payable_balance_cents at creation time" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | VOIDED — PENDING is the issued/committed state; VOIDED reverses the ledger debit" }

  - name: WageAssignment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case whose obligor is subject to withholding" }
      - { name: employer_name, type: string, source: input, description: "Employer executing the withholding order" }
      - { name: monthly_withhold_cents, type: integer, source: input, description: "Monthly amount withheld, in cents; must be > 0" }
      - { name: effective_start_date, type: datetime, source: input, description: "Inclusive start of the withholding interval (closed interval)" }
      - { name: effective_end_date, type: datetime, source: input, description: "Inclusive end of the withholding interval; must be >= effective_start_date" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TERMINATED" }

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the delinquent case; set by the delinquency cascade, never by a client body" }
      - { name: type, type: enum, source: system, description: "CIVIL_JUDGMENT | LICENSE_HOLD — created by the delinquency cascade" }
      - { name: amount_cents, type: integer, source: system, description: "For CIVIL_JUDGMENT: case balance_cents captured at docketing; 0 for LICENSE_HOLD" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | LIFTED — LIFTED covers both civil-judgment vacatur and license-hold release" }

  - name: WaiverRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case whose obligation is to be waived" }
      - { name: obligation_id, type: string, source: input, description: "FK -> Obligation.id; the obligation to waive against" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested waiver amount in cents; must be > 0" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requester, captured at creation for segregation-of-duties enforcement" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approver; null unless status == APPROVED" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | DENIED" }

  - name: AmnestyProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program label" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive window start (half-open interval [start_date, end_date))" }
      - { name: end_date, type: datetime, source: input, description: "Exclusive window end; must be > start_date" }
      - { name: waiver_pct, type: number, source: input, description: "Maximum fraction of an obligation's assessed_amount_cents that may be waived during the window; 0 < waiver_pct <= 1" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Obligation
    initial_state: OUTSTANDING
    terminal_states: [SATISFIED, WAIVED, WRITTEN_OFF]
    transitions:
      - from: OUTSTANDING
        to: PARTIALLY_PAID
        trigger: "POST /collections/payments (cascade: allocation applied leaves 0 < paid+waived < assessed)"
        actor: system
        preconditions:
          - "Allocation from the posted payment is > 0 but does not fully cover balance_cents"
        side_effects:
          - "paid_amount_cents increases by the allocated amount"
          - "Case aggregates recomputed (derived_field_reconciliation)"

      - from: OUTSTANDING
        to: SATISFIED
        trigger: "POST /collections/payments (cascade: allocation covers full balance)"
        actor: system
        preconditions:
          - "paid_amount_cents + waived_amount_cents == assessed_amount_cents after allocation"
        side_effects:
          - "paid_amount_cents increases; balance_cents becomes 0"
          - "If RESTITUTION: Victim.payable_balance_cents increases by the restitution collected (cascade link)"
          - "Case aggregates recomputed; Case.status becomes SATISFIED if case balance_cents == 0"

      - from: PARTIALLY_PAID
        to: SATISFIED
        trigger: "POST /collections/payments (cascade: remaining balance covered)"
        actor: system
        preconditions:
          - "paid_amount_cents + waived_amount_cents == assessed_amount_cents after allocation"
        side_effects:
          - "balance_cents becomes 0"
          - "If RESTITUTION: Victim.payable_balance_cents increases by the restitution collected (cascade link)"
          - "Case aggregates recomputed; Case.status becomes SATISFIED if case balance_cents == 0"

      - from: SATISFIED
        to: PARTIALLY_PAID
        trigger: "POST /collections/payments/{payment_id}/reverse (compensation)"
        actor: system
        preconditions:
          - "Reversal reduces paid_amount_cents so 0 < paid+waived < assessed"
        side_effects:
          - "paid_amount_cents decreases by the reversed allocation"
          - "If RESTITUTION: Victim.payable_balance_cents decreases by the reversed restitution (compensation)"
          - "Case aggregates recomputed"

      - from: PARTIALLY_PAID
        to: OUTSTANDING
        trigger: "POST /collections/payments/{payment_id}/reverse (compensation)"
        actor: system
        preconditions:
          - "Reversal reduces paid_amount_cents to 0"
        side_effects:
          - "paid_amount_cents decreases to 0"
          - "Case aggregates recomputed"

      - from: OUTSTANDING
        to: WAIVED
        trigger: "POST /collections/waiver-requests/{waiver_request_id}/approve"
        actor: CollectionsSupervisor
        preconditions:
          - "requested_amount_cents <= balance_cents (ERR_WAIVER_EXCEEDS_BALANCE)"
          - "requested_amount_cents <= floor(assessed_amount_cents * active AmnestyProgram.waiver_pct) (ERR_WAIVER_EXCEEDS_AMNESTY_CAP)"
        side_effects:
          - "waived_amount_cents increases by requested_amount_cents; balance_cents becomes 0 when fully waived"
          - "Case aggregates recomputed (total_waived_cents increases)"

      - from: PARTIALLY_PAID
        to: WAIVED
        trigger: "POST /collections/waiver-requests/{waiver_request_id}/approve"
        actor: CollectionsSupervisor
        preconditions:
          - "requested_amount_cents == remaining balance_cents (partial-then-waive settles the rest)"
        side_effects:
          - "waived_amount_cents increases; balance_cents becomes 0"
          - "Case aggregates recomputed"

      - from: OUTSTANDING
        to: WRITTEN_OFF
        trigger: "POST /collections/obligations/{obligation_id}/write-off"
        actor: CollectionsSupervisor
        preconditions:
          - "Obligation age in days (current clock - created_at) >= WRITEOFF_AGE_DAYS (ERR_WRITEOFF_TOO_EARLY)"
          - "balance_cents > 0 (ERR_NOTHING_TO_WRITE_OFF)"
        side_effects:
          - "total_written_off_cents on Case increases by balance_cents; obligation removed from case balance_cents"

      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "POST /collections/obligations/{obligation_id}/write-off"
        actor: CollectionsSupervisor
        preconditions:
          - "Obligation age >= WRITEOFF_AGE_DAYS; balance_cents > 0"
        side_effects:
          - "Remaining balance_cents written off; Case aggregates recomputed"

  - entity: PaymentPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /collections/payment-plans/{payment_plan_id}/activate"
        actor: CollectionsSupervisor
        preconditions:
          - "Case.status == OPEN (ERR_CASE_NOT_OPEN) — cross-entity dependency"
          - "No other PaymentPlan for the case is already ACTIVE (ERR_ACTIVE_PLAN_EXISTS)"
        side_effects:
          - "next_due_date = current clock date + PLAN_DUE_INTERVAL_DAYS"

      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /collections/payment-plans (a newer plan is created for the same case)"
        actor: system
        preconditions:
          - "A newer PaymentPlan is created for the same case while this one is still PROPOSED"
        side_effects:
          - "This plan becomes SUPERSEDED; the newer plan is the case's live proposal"

      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /collections/delinquency-sweep"
        actor: SystemAdmin
        preconditions:
          - "current clock date - next_due_date in days >= DELINQUENCY_GRACE_DAYS"
        side_effects:
          - "missed_payment_count += 1"
          - "Case.delinquency_status becomes DELINQUENT (cascade link 1)"
          - "An EnforcementAction of type CIVIL_JUDGMENT is docketed for the case (cascade link 2)"
          - "The docketed CIVIL_JUDGMENT triggers an EnforcementAction of type LICENSE_HOLD (cascade link 3)"

      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /collections/payment-plans/{payment_plan_id}/reinstate"
        actor: CollectionsSupervisor
        preconditions:
          - "Case.status == OPEN"
        side_effects:
          - "missed_payment_count reset to 0"
          - "next_due_date = current clock date + PLAN_DUE_INTERVAL_DAYS"
          - "Case.delinquency_status reset to CURRENT"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /collections/payments (cascade: case balance_cents reaches 0)"
        actor: system
        preconditions:
          - "Case balance_cents == 0 after the payment cascade"
        side_effects:
          - "Plan marked COMPLETED"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /collections/payments/{payment_id}/reverse"
        actor: CollectionsSupervisor
        preconditions:
          - "Payment.status == POSTED (ERR_INVALID_STATE)"
          - "No restitution collected by this payment has already been disbursed, i.e. reversal keeps every affected Victim.payable_balance_cents >= 0 (ERR_DISBURSEMENT_ALREADY_MADE)"
        side_effects:
          - "Each obligation's paid_amount_cents decreased by its allocation (compensation, reverse of the posting cascade)"
          - "Affected obligations revert SATISFIED->PARTIALLY_PAID or PARTIALLY_PAID->OUTSTANDING"
          - "Affected Victim.payable_balance_cents decreased by reversed restitution"
          - "Case aggregates recomputed; total_paid_cents returns to its pre-posting value"

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: VOIDED
        trigger: "POST /collections/disbursements/{disbursement_id}/void"
        actor: FinanceOfficer
        preconditions:
          - "Disbursement.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "Victim.payable_balance_cents credited back by amount_cents (compensation)"

  - entity: WageAssignment
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /collections/wage-assignments/{wage_assignment_id}/terminate"
        actor: FinanceOfficer
        preconditions:
          - "WageAssignment.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Withholding interval freed; its capacity no longer counts toward MAX_MONTHLY_WITHHOLD_CENTS"

  - entity: EnforcementAction
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /collections/enforcement-actions/{enforcement_action_id}/lift"
        actor: CollectionsSupervisor
        preconditions:
          - "Case.delinquency_status == CURRENT (ERR_CASE_STILL_DELINQUENT) — cross-entity dependency"
        side_effects:
          - "EnforcementAction marked LIFTED"

  - entity: WaiverRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /collections/waiver-requests/{waiver_request_id}/approve"
        actor: CollectionsSupervisor
        preconditions:
          - "X-User-ID of approver != requested_by_user_id (ERR_SOD_CONFLICT) — segregation of duties"
          - "An AmnestyProgram window covers the current clock date (ERR_NO_ACTIVE_AMNESTY)"
          - "requested_amount_cents <= obligation balance_cents (ERR_WAIVER_EXCEEDS_BALANCE)"
          - "requested_amount_cents <= floor(obligation assessed_amount_cents * AmnestyProgram.waiver_pct) (ERR_WAIVER_EXCEEDS_AMNESTY_CAP)"
        side_effects:
          - "approved_by_user_id set; target obligation transitions toward WAIVED (see Obligation machine)"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /collections/waiver-requests/{waiver_request_id}/deny"
        actor: CollectionsSupervisor
        preconditions:
          - "X-User-ID of denier != requested_by_user_id (ERR_SOD_CONFLICT)"
        side_effects:
          - "No change to obligation; request closed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /collections/payment-plans"
    occ_field: "expected_case_version"
    description: |
      Creating a PaymentPlan against a Case whose version has advanced since the
      client last observed it is rejected on a stale version. A newly created plan
      legitimately supersedes any still-PROPOSED plan on the case, so a second
      create that carries a stale expected_case_version is rejected rather than
      silently superseding a proposal the client never saw.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: payment_allocation
    trigger: "POST /collections/payments — distribute amount_cents across outstanding obligations of the case"
    algorithm: waterfall_allocation
    formula: |
      Candidate obligations = obligations of case with status in {OUTSTANDING, PARTIALLY_PAID}
      and balance_cents > 0, ordered by priority_rank ASC, then created_at ASC (tie-break).
      STATUTORY_PRIORITY: walk the ordered list; for each obligation allocate
        min(remaining_payment, obligation.balance_cents); stop when payment exhausted.
      PRO_RATA: total = sum(balance_cents over candidates).
        For each candidate: share = floor(amount_cents * balance_cents / total).
        remainder = amount_cents - sum(shares).
        Distribute the remainder one cent at a time to candidates in priority_rank ASC,
        then created_at ASC order until the remainder is exhausted.
      Each obligation's paid_amount_cents += its allocation; a { obligation_id, amount_cents }
      line is appended to Payment.allocations for every non-zero allocation.
    input_set: "Obligations of the case in {OUTSTANDING, PARTIALLY_PAID} with balance_cents > 0"
    constants:
      DEFAULT_PRIORITY_RANK: { RESTITUTION: 1, COURT_FEE: 2, FINE: 3, SURCHARGE: 4 }
    precision: "integer cents; floor on per-obligation pro-rata share; remainder distributed by priority then created_at"
    variants:
      - name: statutory_priority
        when: "allocation_method == STATUTORY_PRIORITY"
        difference: "Fills highest-priority obligations completely before touching the next; a lower-priority obligation gets nothing until higher ones are satisfied"
      - name: pro_rata
        when: "allocation_method == PRO_RATA"
        difference: "Splits the payment proportionally to each candidate's balance; floor per share then remainder to priority order — same payment yields different per-obligation paid amounts than statutory"

  - name: ability_to_pay_installment
    trigger: "POST /collections/payment-plans — compute monthly_amount_cents at creation"
    algorithm: threshold
    formula: |
      basis = (ability_to_pay_method == NET_DISPOSABLE)
                ? max(0, monthly_income_cents - monthly_expenses_cents)
                : monthly_income_cents
      raw = round_half_up(basis * ABILITY_TO_PAY_RATE)
      monthly = max(MIN_INSTALLMENT_CENTS, raw)
      monthly = min(monthly, case.balance_cents)   # never charge more than is owed
      monthly_amount_cents = monthly
    input_set: "The single case referenced by case_id; case.balance_cents at plan creation time"
    constants:
      ABILITY_TO_PAY_RATE: 0.10
      MIN_INSTALLMENT_CENTS: 2500
    precision: "integer cents; round_half_up on basis * rate"
    variants:
      - name: net_disposable
        when: "ability_to_pay_method == NET_DISPOSABLE"
        difference: "basis = income - expenses (disposable); yields a smaller installment than gross for the same declared income/expenses"
      - name: gross_income
        when: "ability_to_pay_method == GROSS_INCOME"
        difference: "basis = gross income; ignores expenses, yielding a larger installment for identical inputs"

  - name: case_balance_reconciliation
    trigger: "Any obligation mutation (payment posting/reversal, waiver approval, write-off)"
    algorithm: aggregation
    formula: |
      For each obligation: balance_cents = 0 if status in {WRITTEN_OFF, WAIVED}
        else max(0, assessed_amount_cents - paid_amount_cents - waived_amount_cents).
      Case.total_assessed_cents = sum(assessed_amount_cents over all obligations).
      Case.total_paid_cents     = sum(paid_amount_cents over all obligations).
      Case.total_waived_cents   = sum(waived_amount_cents over all obligations).
      Case.balance_cents        = sum(balance_cents over obligations with status not in {WRITTEN_OFF, WAIVED}).
      Case.status = SATISFIED iff total_assessed_cents > 0 and balance_cents == 0 else OPEN.
    input_set: "All obligations of the case regardless of status (status-filtered per line above)"
    precision: "integer cents"

  - name: victim_payable_balance
    trigger: "Restitution obligation satisfied/reverted; disbursement created or voided"
    algorithm: aggregation
    formula: |
      collected = sum over POSTED payment allocation lines that target a RESTITUTION obligation
                  whose victim_id == this victim, of the allocated amount_cents.
      disbursed = sum of Disbursement.amount_cents for this victim with status in {PENDING, PAID}.
      payable_balance_cents = collected - disbursed   (invariant: always >= 0)
    input_set: "POSTED payment allocations to this victim's restitution obligations; PENDING/PAID disbursements to this victim"
    precision: "integer cents"

  - name: delinquency_evaluation
    trigger: "POST /collections/delinquency-sweep"
    algorithm: threshold
    formula: |
      For each PaymentPlan with status == ACTIVE and next_due_date != null:
        days_past_due = floor((current_clock_utc - next_due_date) / 1 day)
        if days_past_due >= DELINQUENCY_GRACE_DAYS: the plan defaults (see PaymentPlan machine).
    input_set: "All ACTIVE PaymentPlans with a non-null next_due_date"
    constants:
      DELINQUENCY_GRACE_DAYS: 30
      PLAN_DUE_INTERVAL_DAYS: 30
    precision: "whole days, floor; boundary is inclusive (>= grace defaults)"

  - name: writeoff_aging_eligibility
    trigger: "POST /collections/obligations/{obligation_id}/write-off; GET /collections/reports/aging"
    algorithm: threshold
    formula: |
      age_days = floor((current_clock_utc - obligation.created_at) / 1 day)
      eligible = age_days >= WRITEOFF_AGE_DAYS and balance_cents > 0
      Aging buckets by age_days: [0,30], [31,90], [91,365], [366, WRITEOFF_AGE_DAYS-1], and writeoff-eligible ( >= WRITEOFF_AGE_DAYS ).
    input_set: "Obligations with status in {OUTSTANDING, PARTIALLY_PAID}"
    constants:
      WRITEOFF_AGE_DAYS: 1825
    precision: "whole days, floor; boundary inclusive (>= age defaults to eligible)"

  - name: wage_withhold_capacity
    trigger: "POST /collections/wage-assignments"
    algorithm: interval_merge
    formula: |
      New assignment interval N = [effective_start_date, effective_end_date] (closed).
      Overlapping set = ACTIVE WageAssignments of the same case whose closed interval
        intersects N (they share at least one instant).
      If monthly_withhold_cents(N) + sum(monthly_withhold_cents over overlapping set)
        > MAX_MONTHLY_WITHHOLD_CENTS -> reject (ERR_WITHHOLD_CAPACITY_EXCEEDED).
    input_set: "ACTIVE WageAssignments of the same case whose closed effective interval intersects the new interval"
    constants:
      MAX_MONTHLY_WITHHOLD_CENTS: 50000
    precision: "integer cents; closed-interval intersection (shared endpoints count as overlap); aggregate-capacity semantics"

  - name: amnesty_window_overlap
    trigger: "POST /collections/amnesty-programs"
    algorithm: interval_merge
    formula: |
      New window W = [start_date, end_date) (half-open).
      For every existing AmnestyProgram window E = [E.start_date, E.end_date):
        overlap iff W.start_date < E.end_date and E.start_date < W.end_date.
      Any overlap -> reject (ERR_AMNESTY_WINDOW_OVERLAP).
      Adjacency (W.start_date == E.end_date, or W.end_date == E.start_date) is allowed.
    input_set: "All existing AmnestyProgram windows"
    precision: "date comparison; half-open intervals; adjacency permitted (no shared interior)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path ids and body FK references exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums valid, amounts integers > 0 where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST endpoints

  - priority: 5
    category: state
    check: "Optimistic-concurrency: expected_case_version matches Case.version on plan creation"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /collections/payment-plans"

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (activate, reinstate, reverse, void, terminate, lift, approve, deny, write-off)"

  - priority: 7
    category: business_referential
    check: "victim_id required and present when obligation_type == RESTITUTION; forbidden for non-restitution; waiver obligation_id must belong to the named case_id"
    error_id: ERR_VICTIM_REQUIRED
    http_status: 422
    applies_to: "POST /collections/obligations, POST /collections/waiver-requests"

  - priority: 8
    category: business_temporal
    check: "Waiver approval requires an AmnestyProgram window covering the current clock date; wage-assignment effective_end_date >= effective_start_date"
    error_id: ERR_NO_ACTIVE_AMNESTY
    http_status: 409
    applies_to: "POST /collections/waiver-requests/{id}/approve, POST /collections/wage-assignments"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: the X-User-ID approving/denying a waiver must differ from requested_by_user_id"
    error_id: ERR_SOD_CONFLICT
    http_status: 409
    applies_to: "POST /collections/waiver-requests/{id}/approve, POST /collections/waiver-requests/{id}/deny"

  - priority: 10
    category: business_constraint
    check: "Interval / uniqueness / cap constraints: amnesty windows non-overlapping; wage aggregate withhold <= cap; only one ACTIVE plan per case; case_number unique; waiver amount <= amnesty cap; write-off aging met"
    error_id: ERR_WITHHOLD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /collections/amnesty-programs, POST /collections/wage-assignments, plan activate, waiver approve, write-off"

  - priority: 11
    category: business_fiscal
    check: "Amount checks: payment <= case balance; disbursement <= victim payable; waiver <= obligation balance; reversal keeps victim payable >= 0"
    error_id: ERR_AMOUNT_EXCEEDS_BALANCE
    http_status: 409
    applies_to: "POST /collections/payments, POST /collections/disbursements, waiver approve, payment reverse"

# =============================================================================
# §1.5 API Endpoint Table (38 endpoints)
# =============================================================================
endpoints:
  # ---- Case ----
  - method: POST
    path: "/collections/cases"
    description: "Create a Case"
    roles: [CollectionsClerk]
    code: 201
    input: [case_number, defendant_name]
    output: Case
    side_effects: ["status=OPEN, delinquency_status=CURRENT, all aggregates initialized to 0"]

  - method: GET
    path: "/collections/cases/{case_id}"
    description: "Get a Case with recomputed aggregates and version"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: Case
    side_effects: []

  # ---- Victim ----
  - method: POST
    path: "/collections/victims"
    description: "Create a Victim (restitution payee)"
    roles: [CollectionsClerk]
    code: 201
    input: [name]
    output: Victim
    side_effects: ["payable_balance_cents=0"]

  - method: GET
    path: "/collections/victims/{victim_id}"
    description: "Get a Victim with recomputed payable_balance_cents"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: Victim
    side_effects: []

  # ---- Obligation ----
  - method: POST
    path: "/collections/obligations"
    description: "Create an Obligation on a case"
    roles: [CollectionsClerk]
    code: 201
    input: [case_id, obligation_type, assessed_amount_cents, "victim_id?", "priority_rank?"]
    output: Obligation
    side_effects: ["status=OUTSTANDING", "Case aggregates recomputed (increments Case.version)"]

  - method: GET
    path: "/collections/obligations/{obligation_id}"
    description: "Get an Obligation with recomputed paid/waived/balance"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: Obligation
    side_effects: []

  - method: GET
    path: "/collections/obligations"
    description: "List obligations filtered by case, victim, or status (reverse-reachability for Obligation.case_id and Obligation.victim_id)"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: ["case_id?", "victim_id?", "status?", "limit?", "offset?"]
    output: Obligation[]
    side_effects: []

  - method: POST
    path: "/collections/obligations/{obligation_id}/write-off"
    description: "Write off an aged obligation (aging & write-off)"
    roles: [CollectionsSupervisor]
    code: 200
    input: []
    output: Obligation
    side_effects: ["status=WRITTEN_OFF", "Case aggregates recomputed"]

  # ---- PaymentPlan ----
  - method: POST
    path: "/collections/payment-plans"
    description: "Create a payment plan; computes monthly_amount_cents via ability-to-pay; supersedes any still-PROPOSED plan (OCC on Case.version)"
    roles: [CollectionsClerk]
    code: 201
    input: [case_id, monthly_income_cents, monthly_expenses_cents, ability_to_pay_method, expected_case_version]
    output: PaymentPlan
    side_effects: ["status=PROPOSED", "monthly_amount_cents computed", "any still-PROPOSED plan for the case -> SUPERSEDED", "increments Case.version by 1"]

  - method: GET
    path: "/collections/payment-plans/{payment_plan_id}"
    description: "Get a PaymentPlan"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []

  - method: GET
    path: "/collections/payment-plans"
    description: "List payment plans filtered by case (reverse-reachability for PaymentPlan.case_id)"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []

  - method: POST
    path: "/collections/payment-plans/{payment_plan_id}/activate"
    description: "Activate a PROPOSED plan"
    roles: [CollectionsSupervisor]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status=ACTIVE", "next_due_date set to clock + PLAN_DUE_INTERVAL_DAYS"]

  - method: POST
    path: "/collections/payment-plans/{payment_plan_id}/reinstate"
    description: "Reinstate a DEFAULTED plan"
    roles: [CollectionsSupervisor]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status=ACTIVE", "missed_payment_count=0", "next_due_date reset", "Case.delinquency_status=CURRENT"]

  # ---- Payment ----
  - method: POST
    path: "/collections/payments"
    description: "Post a payment and allocate it across obligations"
    roles: [CollectionsClerk]
    code: 201
    input: [case_id, amount_cents, allocation_method]
    output: Payment
    side_effects: ["status=POSTED", "allocations computed", "obligations paid_amount_cents updated (cascade)", "victim payable updated for restitution", "case aggregates recomputed", "active plan may COMPLETE"]

  - method: GET
    path: "/collections/payments/{payment_id}"
    description: "Get a Payment including its allocation lines"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/collections/payments"
    description: "List payments filtered by case (reverse-reachability for Payment.case_id)"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/collections/payments/{payment_id}/reverse"
    description: "Reverse a posted payment (compensation)"
    roles: [CollectionsSupervisor]
    code: 200
    input: []
    output: Payment
    side_effects: ["status=REVERSED", "obligation paid_amount_cents restored", "victim payable restored", "case aggregates recomputed"]

  # ---- Disbursement ----
  - method: POST
    path: "/collections/disbursements"
    description: "Disburse collected restitution to a victim"
    roles: [FinanceOfficer]
    code: 201
    input: [victim_id, case_id, amount_cents]
    output: Disbursement
    side_effects: ["status=PENDING", "Victim.payable_balance_cents debited by amount_cents"]

  - method: GET
    path: "/collections/disbursements/{disbursement_id}"
    description: "Get a Disbursement"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/collections/disbursements"
    description: "List disbursements filtered by victim or case (reverse-reachability for Disbursement.victim_id and Disbursement.case_id)"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: ["victim_id?", "case_id?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  - method: POST
    path: "/collections/disbursements/{disbursement_id}/void"
    description: "Void a disbursement (compensation)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status=VOIDED", "Victim.payable_balance_cents credited back"]

  # ---- WageAssignment ----
  - method: POST
    path: "/collections/wage-assignments"
    description: "Issue a wage-assignment withholding order"
    roles: [FinanceOfficer]
    code: 201
    input: [case_id, employer_name, monthly_withhold_cents, effective_start_date, effective_end_date]
    output: WageAssignment
    side_effects: ["status=ACTIVE", "aggregate withhold capacity checked over overlapping ACTIVE assignments"]

  - method: GET
    path: "/collections/wage-assignments/{wage_assignment_id}"
    description: "Get a WageAssignment"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: WageAssignment
    side_effects: []

  - method: GET
    path: "/collections/wage-assignments"
    description: "List wage assignments filtered by case (reverse-reachability for WageAssignment.case_id)"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: WageAssignment[]
    side_effects: []

  - method: POST
    path: "/collections/wage-assignments/{wage_assignment_id}/terminate"
    description: "Terminate an ACTIVE wage assignment"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: WageAssignment
    side_effects: ["status=TERMINATED", "capacity freed"]

  # ---- EnforcementAction (cascade-created; no POST create) ----
  - method: GET
    path: "/collections/enforcement-actions/{enforcement_action_id}"
    description: "Get an EnforcementAction"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []

  - method: GET
    path: "/collections/enforcement-actions"
    description: "List enforcement actions filtered by case or type (reverse-reachability for EnforcementAction.case_id; only discovery channel for cascade-created rows)"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: ["case_id?", "type?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []

  - method: POST
    path: "/collections/enforcement-actions/{enforcement_action_id}/lift"
    description: "Lift a civil judgment (vacate) or license hold (release)"
    roles: [CollectionsSupervisor]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["status=LIFTED"]

  # ---- WaiverRequest ----
  - method: POST
    path: "/collections/waiver-requests"
    description: "Request an amnesty/waiver against an obligation"
    roles: [CollectionsClerk, CollectionsSupervisor]
    code: 201
    input: [case_id, obligation_id, requested_amount_cents]
    output: WaiverRequest
    side_effects: ["status=REQUESTED", "requested_by_user_id = X-User-ID"]

  - method: GET
    path: "/collections/waiver-requests/{waiver_request_id}"
    description: "Get a WaiverRequest"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: WaiverRequest
    side_effects: []

  - method: GET
    path: "/collections/waiver-requests"
    description: "List waiver requests filtered by case or obligation (reverse-reachability for WaiverRequest.case_id and WaiverRequest.obligation_id)"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: ["case_id?", "obligation_id?", "limit?", "offset?"]
    output: WaiverRequest[]
    side_effects: []

  - method: POST
    path: "/collections/waiver-requests/{waiver_request_id}/approve"
    description: "Approve a waiver (segregation of duties + amnesty window + caps)"
    roles: [CollectionsSupervisor]
    code: 200
    input: []
    output: WaiverRequest
    side_effects: ["status=APPROVED", "approved_by_user_id set", "obligation waived_amount_cents increased (cascade)"]

  - method: POST
    path: "/collections/waiver-requests/{waiver_request_id}/deny"
    description: "Deny a waiver"
    roles: [CollectionsSupervisor]
    code: 200
    input: []
    output: WaiverRequest
    side_effects: ["status=DENIED"]

  # ---- AmnestyProgram ----
  - method: POST
    path: "/collections/amnesty-programs"
    description: "Create an amnesty program window (non-overlapping)"
    roles: [SystemAdmin]
    code: 201
    input: [name, start_date, end_date, waiver_pct]
    output: AmnestyProgram
    side_effects: ["window non-overlap checked"]

  - method: GET
    path: "/collections/amnesty-programs/{amnesty_program_id}"
    description: "Get an AmnestyProgram"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: []
    output: AmnestyProgram
    side_effects: []

  # ---- System / reporting ----
  - method: POST
    path: "/collections/_clock/set_current_utc"
    description: "Set the server logical clock (test-driving). Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never uses wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no entity mutations"]

  - method: POST
    path: "/collections/delinquency-sweep"
    description: "Evaluate all ACTIVE plans against the clock and default those past the grace window (delinquency & civil-judgment/license-hold cascade)"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: "{ defaulted_plan_ids: string[], enforcement_action_ids: string[] }"
    side_effects: ["ACTIVE plans past grace -> DEFAULTED", "case delinquency + enforcement cascade fires"]

  - method: GET
    path: "/collections/reports/aging"
    description: "Portfolio aging & write-off eligibility report (reporting)"
    roles: [CollectionsClerk, CollectionsSupervisor, FinanceOfficer, SystemAdmin]
    code: 200
    input: ["case_id?"]
    output: "{ bucket_0_30_cents: integer, bucket_31_90_cents: integer, bucket_91_365_cents: integer, bucket_366_plus_cents: integer, writeoff_eligible_cents: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, non-positive amount where positive required" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match current Case.version on plan creation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits the requested transition (also covers ERR_PAYMENT_NOT_POSTED sense on reverse)" }
  - { id: ERR_VICTIM_REQUIRED, http: 422, condition: "victim_id missing for a RESTITUTION obligation, or supplied for a non-restitution obligation" }
  - { id: ERR_OBLIGATION_CASE_MISMATCH, http: 422, condition: "Waiver obligation_id does not belong to the named case_id" }
  - { id: ERR_NO_ACTIVE_AMNESTY, http: 409, condition: "No AmnestyProgram window covers the current clock date at waiver approval" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "effective_end_date < effective_start_date, or amnesty end_date <= start_date" }
  - { id: ERR_SOD_CONFLICT, http: 409, condition: "Approver/denier X-User-ID equals the waiver's requested_by_user_id" }
  - { id: ERR_AMNESTY_WINDOW_OVERLAP, http: 409, condition: "New amnesty window overlaps an existing one (half-open; adjacency allowed)" }
  - { id: ERR_WITHHOLD_CAPACITY_EXCEEDED, http: 409, condition: "Aggregate monthly withhold over overlapping ACTIVE wage assignments exceeds MAX_MONTHLY_WITHHOLD_CENTS" }
  - { id: ERR_ACTIVE_PLAN_EXISTS, http: 409, condition: "Case already has an ACTIVE payment plan when activating another" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "Plan activation/reinstatement requires Case.status == OPEN" }
  - { id: ERR_CASE_STILL_DELINQUENT, http: 409, condition: "Enforcement action cannot be lifted while Case.delinquency_status == DELINQUENT" }
  - { id: ERR_WAIVER_EXCEEDS_BALANCE, http: 409, condition: "Requested waiver amount exceeds the obligation's current balance_cents" }
  - { id: ERR_WAIVER_EXCEEDS_AMNESTY_CAP, http: 409, condition: "Requested waiver amount exceeds floor(assessed_amount_cents * AmnestyProgram.waiver_pct)" }
  - { id: ERR_WRITEOFF_TOO_EARLY, http: 409, condition: "Obligation age is below WRITEOFF_AGE_DAYS at write-off" }
  - { id: ERR_NOTHING_TO_WRITE_OFF, http: 409, condition: "Obligation balance_cents is 0 at write-off" }
  - { id: ERR_AMOUNT_EXCEEDS_BALANCE, http: 409, condition: "Payment exceeds case balance, disbursement exceeds victim payable, or reversal would drive a victim payable below 0" }
  - { id: ERR_CASE_NUMBER_TAKEN, http: 409, condition: "case_number already used by another case" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CollectionsClerk
    description: "Front-line clerk who records money owed and money in: cases, victims, obligations, payment plans, payments, waiver requests"
    identity: opaque
    exclusive_operations:
      - "POST /collections/cases"
      - "POST /collections/victims"
      - "POST /collections/obligations"
      - "POST /collections/payment-plans"
      - "POST /collections/payments"
    shared_operations:
      - "POST /collections/waiver-requests (shared with CollectionsSupervisor)"
      - "GET on all resources"

  - name: CollectionsSupervisor
    description: "Supervisor who approves waivers/denials, write-offs, payment reversals, plan activation/reinstatement, and enforcement lifts; may also request waivers"
    identity: opaque
    exclusive_operations:
      - "POST /collections/obligations/{id}/write-off"
      - "POST /collections/payment-plans/{id}/activate"
      - "POST /collections/payment-plans/{id}/reinstate"
      - "POST /collections/payments/{id}/reverse"
      - "POST /collections/enforcement-actions/{id}/lift"
      - "POST /collections/waiver-requests/{id}/approve"
      - "POST /collections/waiver-requests/{id}/deny"
    shared_operations:
      - "POST /collections/waiver-requests (shared with CollectionsClerk)"
      - "GET on all resources"

  - name: FinanceOfficer
    description: "Treasury role that disburses restitution to victims and issues/terminates wage-assignment orders"
    identity: opaque
    exclusive_operations:
      - "POST /collections/disbursements"
      - "POST /collections/disbursements/{id}/void"
      - "POST /collections/wage-assignments"
      - "POST /collections/wage-assignments/{id}/terminate"
    shared_operations:
      - "GET on all resources"

  - name: SystemAdmin
    description: "Operational role that configures amnesty programs, sets the logical clock, and runs the delinquency sweep"
    identity: opaque
    exclusive_operations:
      - "POST /collections/amnesty-programs"
      - "POST /collections/_clock/set_current_utc"
      - "POST /collections/delinquency-sweep"
    shared_operations:
      - "GET on all resources"
