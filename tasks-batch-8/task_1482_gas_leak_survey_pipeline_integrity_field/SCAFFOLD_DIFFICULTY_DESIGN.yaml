scaffold_difficulty_design:
  # =============================================================================
  # Rule 1: dual_variant_calc — two valid approaches produce different results,
  # on DIFFERENT entity domains.
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: leak_grade_hca_vs_non_hca
        grounds:
          - calculations.leak_grade
          - entities.PipeSegment.fields.is_high_consequence_area
          - entities.Leak.fields.grade
        distinguishing_aspect: |
          leak_grade on a Leak entity (leak-grading domain): same input readings
          (bar_hole 30 pct LEL, distance_to_building 25 ft, concentration 8000 ppm,
          is_migration_evidence=false) produce grade=G1 on a non-HCA segment
          (standard_grade variant) but escalate G2->G1 boundary on HCA
          (conservative_grade variant). Entity domain = Leak/PipeSegment.
        test_recipe:
          setup:
            - "PipeSegment A: material=STEEL, install_year=2000, pressure_class=DISTRIBUTION, is_high_consequence_area=false, diameter=6.0, length=1000.0, op_pressure=60.0, segment_code=SEG-NONHCA-1"
            - "PipeSegment B: same fields but is_high_consequence_area=true, segment_code=SEG-HCA-1"
            - "FieldTechnician T1 (employee_code=FT-1) with qualified_methods=[WALKING]"
            - "Instrument I1 in IN_SERVICE status (CGI type, calibrated_at=now, due_at > now)"
            - "SurveyRoute R1 with survey_method=WALKING, window covering current clock, status=DISPATCHED"
            - "SurveyRun SR1 referencing R1/I1 with status=SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /integrity-analysts"
              payload: { employee_code: "IA-1", full_name: "Analyst One" }
              as: IntegrityAnalyst
              captures: { ia_id: $.data.id }
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-001", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 101.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-NONHCA-1", install_year: 2000, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { seg_a_id: $.data.id }
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-HCA-1", install_year: 2000, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: true }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { seg_b_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-1", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_a_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_b_id}", sequence_index: 2 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
              payload: { route_id: "${route_id}", instrument_id: "${instr_id}", distance_covered_feet: 2000.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { run_id: $.data.id }
            - call: "POST /survey-runs/${run_id}/submit"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
          trigger:
            - call: "POST /leaks"
              payload: { segment_id: "${seg_a_id}", survey_run_id: "${run_id}", concentration_ppm: 8000.0, distance_to_building_feet: 25.0, bar_hole_reading_pct_lel: 30.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { leak_a_id: $.data.id, leak_a_grade: $.data.grade }
            - call: "POST /leaks"
              payload: { segment_id: "${seg_b_id}", survey_run_id: "${run_id}", concentration_ppm: 8000.0, distance_to_building_feet: 25.0, bar_hole_reading_pct_lel: 30.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { leak_b_id: $.data.id, leak_b_grade: $.data.grade }
          assert:
            - "Leak.${leak_a_id}.grade == G1 (bar_hole 30 >= 25 crosses G1_LEL_THRESHOLD_PCT on non-HCA)"
            - "Leak.${leak_b_id}.grade == G1 (same input on HCA still G1 at this input level)"
            - "Second assertion pair (G3-boundary differential): two additional leaks with bar_hole=4, concentration=500, distance_to_building=200.0 produce grade=G3 on non-HCA, grade=G2 on HCA (conservative escalation)"

      - name: risk_score_provisional_vs_final
        grounds:
          - calculations.risk_score
          - entities.PipeSegment.fields.risk_score
          - state_machines.Leak.REPAIRED_PENDING_VERIFICATION_to_VERIFIED_CLEARED
        distinguishing_aspect: |
          risk_score on a PipeSegment entity (integrity-risk domain, distinct from
          Leak/grade domain): provisional variant computed at SurveyRoute completion
          uses pre-completion counters, while final variant computed at
          VERIFIED_CLEARED transition uses post-completion counters. For a segment
          with one G2 leak open at completion, provisional risk_score includes
          leak_score = 1.5*0.30 = 0.45 contribution, while final risk_score after
          VERIFIED_CLEARED has leak_score = 0 — divergent numbers on identical
          segment physical data.
        test_recipe:
          setup:
            - "PipeSegment SEG-P1: CAST_IRON install_year=1980 (age=46 at 2026), DISTRIBUTION non-HCA, diameter=8.0, length=2000.0, op_pressure=30.0"
            - "One G2 Leak OPEN on SEG-P1 (concentration=15000, distance=30, bar_hole=10)"
            - "RepairOrder created + dispatched + ON_SITE + WORK_COMPLETE"
            - "Post-repair SurveyRun ACCEPTED exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /integrity-analysts"
              payload: { employee_code: "IA-1", full_name: "Analyst One" }
              as: IntegrityAnalyst
              captures: { ia_id: $.data.id }
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-002", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 100.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-P1", install_year: 1980, material: "CAST_IRON", diameter_inches: 8.0, length_feet: 2000.0, operating_pressure_psi: 30.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { seg_id: $.data.id, seg_v: $.data.version }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-P1", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
              payload: { route_id: "${route_id}", instrument_id: "${instr_id}", distance_covered_feet: 2000.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { run_id: $.data.id }
            - call: "POST /survey-runs/${run_id}/submit"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "POST /survey-runs/${run_id}/accept"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
            - call: "POST /leaks"
              payload: { segment_id: "${seg_id}", survey_run_id: "${run_id}", concentration_ppm: 15000.0, distance_to_building_feet: 30.0, bar_hole_reading_pct_lel: 10.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { leak_id: $.data.id, leak_v: $.data.version }
            - call: "POST /survey-routes/${route_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "GET /pipe-segments/${seg_id}"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { provisional_risk: $.data.risk_score }
            - call: "POST /compliance-officers"
              payload: { employee_code: "CO-1", full_name: "Officer One", jurisdiction_scope: ["PHMSA", "STATE_PUC"] }
              as: IntegrityAnalyst
              captures: { co_id: $.data.id }
            - call: "POST /leaks/${leak_id}/schedule-repair"
              payload: { repair_method: "CLAMP", expected_leak_version: "${leak_v}" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { order_id: $.data.id }
            - call: "POST /repair-crews"
              payload: { crew_code: "CR-1", home_region: "NORTH", is_qualified_excavation: false, max_concurrent_orders: 3 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { crew_id: $.data.id }
            - call: "POST /repair-orders/${order_id}/dispatch"
              payload: { crew_id: "${crew_id}" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /repair-orders/${order_id}/arrive-on-site"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /repair-orders/${order_id}/mark-work-complete"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
          trigger:
            - call: "POST /leaks/${leak_id}/verify-clear"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "GET /pipe-segments/${seg_id}"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { final_risk: $.data.risk_score }
          assert:
            - "provisional_risk > final_risk (provisional includes leak_score=0.45 contribution from open G2 leak; final drops it after VERIFIED_CLEARED)"
            - "Leak.${leak_id}.status == VERIFIED_CLEARED"
            - "PipeSegment.${seg_id}.open_grade2_count == 0"

  # =============================================================================
  # Rule 2: combinatorial_formula — instances in DIFFERENT modes (a/b/c).
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: resurvey_interval_multifactor_nonlinear
        grounds:
          - calculations.resurvey_interval
          - entities.PipeSegment.fields.next_survey_due_at
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction. The
          resurvey_interval formula combines pressure_class (enum tier
          selection), is_high_consequence_area (boolean doubling), open leak
          counts by grade (piecewise factor), and CP anomaly presence
          (multiplicative 0.5). A TRANSMISSION+HCA segment with one OPEN G2 leak
          and one OPEN CP anomaly yields interval_days = floor(90 * 0.5 * 0.5) =
          22 days, a non-linear result distinct from each factor independently.
        test_recipe:
          setup:
            - "PipeSegment SEG-RS: TRANSMISSION + HCA, install_year=2015, material=STEEL, diameter=24.0, length=5000.0, op_pressure=800.0"
            - "SurveyRoute completed covering SEG-RS"
            - "One G2 Leak OPEN on SEG-RS"
            - "One CathodicProtectionReading on SEG-RS with is_anomalous=true, anomaly_status=OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /integrity-analysts"
              payload: { employee_code: "IA-1", full_name: "Analyst One" }
              as: IntegrityAnalyst
              captures: { ia_id: $.data.id }
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-003", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 100.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-RS", install_year: 2015, material: "STEEL", diameter_inches: 24.0, length_feet: 5000.0, operating_pressure_psi: 800.0, pressure_class: "TRANSMISSION", is_high_consequence_area: true }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { seg_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-RS", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
              payload: { route_id: "${route_id}", instrument_id: "${instr_id}", distance_covered_feet: 5000.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { run_id: $.data.id }
            - call: "POST /survey-runs/${run_id}/submit"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "POST /survey-runs/${run_id}/accept"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
            - call: "POST /leaks"
              payload: { segment_id: "${seg_id}", survey_run_id: "${run_id}", concentration_ppm: 15000.0, distance_to_building_feet: 30.0, bar_hole_reading_pct_lel: 10.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "POST /cp-readings"
              payload: { segment_id: "${seg_id}", test_point_id: "TP-1", pipe_to_soil_potential_mv: -700.0, instant_off_potential_mv: -800.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
          trigger:
            - call: "POST /survey-routes/${route_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "GET /pipe-segments/${seg_id}"
              payload: {}
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { next_due: $.data.next_survey_due_at }
          assert:
            - "PipeSegment.${seg_id}.next_survey_due_at == 2026-08-23T00:00:00Z (route completed at 2026-08-01, interval_days=floor(90*0.5*0.5)=22)"

      - name: report_payload_nested_rounding_order
        grounds:
          - calculations.report_payload_generation
          - entities.ComplianceReport.fields.report_payload_uri
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. The report_payload_generation
          formula pins: round each component ratio to 4 decimal places (round_half_up)
          FIRST, then assemble into the final payload — never re-round after summing.
          A different order (sum-then-round) yields different 4-decimal values when
          component rounding errors compound. The scaffold pins one order explicitly.
        test_recipe:
          setup:
            - "Three leaks VERIFIED_CLEARED in window with on-time flags: [on_time, on_time, late] -> on_time_rate = round(2/3, 4) = 0.6667"
            - "Seven CP readings in window with 3 anomalous -> cp_anomaly_rate = round(3/7, 4) = 0.4286"
            - "A ComplianceReport DRAFT with these stats available"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /integrity-analysts"
              payload: { employee_code: "IA-1", full_name: "Analyst One" }
              as: IntegrityAnalyst
              captures: { ia_id: $.data.id }
            - call: "POST /compliance-officers"
              payload: { employee_code: "CO-1", full_name: "Officer One", jurisdiction_scope: ["PHMSA"] }
              as: IntegrityAnalyst
              captures: { co_id: $.data.id }
            - call: "POST /compliance-reports"
              payload: { reporting_period_start: "2026-01-01T00:00:00Z", reporting_period_end: "2026-12-31T23:59:59Z", regulator: "PHMSA" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { report_id: $.data.id }
          trigger:
            - call: "GET /compliance-reports/${report_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
          assert:
            - "The report's nested rounding rule pins round-half-up at 4 decimals per ratio BEFORE assembly; formula text explicit; test verifies scaffolding pins rounding order via formula field text (assertion is on the formula's stated order — actual numeric check would require populated leak data in the window)"

  # =============================================================================
  # Rule 3: non_linear_state_machine — on DIFFERENT entities.
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: leak_regrade_cyclic_self_loop
        grounds:
          - state_machines.Leak.OPEN_to_OPEN
          - entities.Leak.fields.regrade_count
        distinguishing_aspect: |
          Cyclic (OPEN -> OPEN self-loop on Leak): the same Leak entity can be
          re-graded up to MAX_REGRADE_COUNT (3) times without leaving OPEN,
          mutating grade / repair_due_at / counters per iteration. A linear
          pipeline cannot express this; the cycle is bounded by regrade_count.
        test_recipe:
          setup:
            - "PipeSegment SEG-L1 with one OPEN G3 Leak (low input values)"
            - "FieldTechnician T1 assigned to segment's SurveyRun"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /integrity-analysts"
              payload: { employee_code: "IA-1", full_name: "Analyst One" }
              as: IntegrityAnalyst
              captures: { ia_id: $.data.id }
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
