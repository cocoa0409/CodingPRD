        distinguishing_aspect: |
          The soil_test_id FK resolves to a real row, so this is not a 404: the budget is
          rejected because the test's field_id points at South 20 while the budget rations
          North 40, which is the cross-parent arm of validation 34.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with a COVERED permit and a DRAFT 2026 plan"
