              as: SalesCoordinator
              captures: { cert_id: $.data.id }
            - call: "POST /nursery/orders"
              payload: { broker_id: "${broker_id}", requested_ship_date: "2026-02-09T00:00:00Z" }
              as: SalesCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /nursery/orders/${order_id}/lines"
              payload: { availability_entry_id: "${e1}", quantity: 20 }
