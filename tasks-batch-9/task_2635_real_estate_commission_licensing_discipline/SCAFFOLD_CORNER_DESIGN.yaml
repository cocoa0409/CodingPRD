          assert:
            - "the first sweep returns 200 with expired_licensee_count == 0, escalated_audit_count == 0, defaulted_order_count == 0, restored_licensee_count == 0 and suspended_provider_count == 0 - nothing is due at 2026-08-01T00:00:00Z"
