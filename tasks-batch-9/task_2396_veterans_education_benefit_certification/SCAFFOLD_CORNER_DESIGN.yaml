          setup:
            - "Clock 2026-08-01. CHAIN-A reference data with student V-1001 COE-verified and a DRAFT certification for 12 of 12 residential credits whose version at creation is captured as 1; one accepted tuition report at gross 3000000 / fees 150000 / tuition aid 200000."
