# =============================================================================
# Threading & Brow Salon — Walk-in Queue & Quick-Service Operations API
# Scaffold seed tables (§1.0–§1.7). Expert difficulty.
# =============================================================================

scenario: |
  Threading & Brow Salon: walk-in queue & quick-service menu, technician & chair,
  membership/package, add-on (tint/wax), retail, sanitation/license, loyalty, no-show

domain_name: threading-brow-salon
api_prefix: /salon-svc

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # finite chair+technician pool the walk-in queue competes for
  secondary_archetype: temporal_windowing       # chair occupation intervals + sanitation downtime windows
  complexity_layers:
    - optimistic_concurrency                    # seating a member onto a chair off a stale salon view
    - cascading_side_effects                    # cancel/void visit -> release chair, demote queue, reverse loyalty + package
    - dual_variant_calculation                  # provisional visit estimate vs finalized settlement total
    - rate_threshold_triggers                   # no-show strike escalation; loyalty redemption threshold; package depletion
    - derived_field_reconciliation              # queue position, salon active-occupancy count, member loyalty balance

  entity_topology: hybrid
  # Salon is the aggregate root (tree) but Chair, Technician, Member, ServiceVisit
  # carry cross-cutting FK associations (visit references chair + technician + member).

  state_machine_shape: parallel
  # ServiceVisit carries two independent dimensions (service_status x payment_status).
  # QueueTicket is cyclic (WAITING<->CALLED re-queue). Chair has an occupancy+sanitation cycle.

  relationship_patterns:
    - one_to_many        # Salon -> Chairs / Technicians / Members / QueueTickets / ServiceVisits
    - cross_aggregate    # ServiceVisit references Chair, Technician, Member, QueueTicket
    - polymorphic        # VisitLineItem.item_ref_id points to AddOn OR RetailProduct (discriminated by line_type)

  role_model: peer_roles
  # FrontDeskAgent owns queue+seating, Technician owns service execution,
  # SalonManager owns lifecycle/licensing/pricing, Member acts on own loyalty/membership.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Salon
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Salon trade name" }
      - { name: license_number, type: string, source: input, description: "State cosmetology establishment license number" }
      - { name: license_expiry, type: datetime, source: input, description: "ISO 8601 UTC; date the establishment license lapses" }
      - { name: license_status, type: enum, source: computed, description: "ACTIVE if current_clock < license_expiry else LAPSED; recomputed on read and on seating attempts. Values: ACTIVE | LAPSED" }
      - { name: loyalty_earn_rate_bps, type: integer, source: input, default: 500, description: "Loyalty points earned per finalized dollar, in basis points (500 = 5 points per $1 settled). >=0" }
      - { name: active_occupancy_count, type: integer, source: computed, description: "Count of Chairs in OCCUPIED state right now; derived, starts 0" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED. Gates all seating/queue operations. Values: OPEN | CLOSED" }

  - name: Technician
    parent: Salon
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: salon_id, type: string, source: system, description: "FK -> Salon.id; owning salon" }
      - { name: display_name, type: string, source: input, description: "Technician name shown on the floor" }
      - { name: certified_addon_codes, type: array, source: input, default: [], description: "AddOn.code values this technician is certified to perform (e.g. ['TINT','WAX']); empty = threading only" }
      - { name: sanitation_cert_expiry, type: datetime, source: input, description: "ISO 8601 UTC; bloodborne/sanitation certification expiry. Tech cannot be assigned after this instant." }
      - { name: status, type: enum, source: system, description: "AVAILABLE | BUSY | OFF_SHIFT. AVAILABLE means free to be assigned. Values: AVAILABLE | BUSY | OFF_SHIFT" }

  - name: Chair
    parent: Salon
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: salon_id, type: string, source: system, description: "FK -> Salon.id; owning salon" }
      - { name: label, type: string, source: input, description: "Chair label e.g. 'Brow Bar 1'" }
      - { name: sanitation_minutes, type: integer, source: input, default: 5, description: "Minutes the chair must sit in SANITIZING after a visit ends before it can be seated again. >=0" }
      - { name: sanitation_ready_at, type: datetime, source: computed, description: "ISO 8601 UTC; instant the chair leaves SANITIZING. Set to visit_end + sanitation_minutes when a visit completes. Null while never used." }
      - { name: status, type: enum, source: system, description: "OPEN | OCCUPIED | SANITIZING | OUT_OF_SERVICE. Values: OPEN | OCCUPIED | SANITIZING | OUT_OF_SERVICE" }

  - name: Member
    parent: Salon
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as Member" }
      - { name: salon_id, type: string, source: system, description: "FK -> Salon.id; salon the member belongs to" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: phone, type: string, source: input, description: "Contact phone; unique within salon" }
      - { name: loyalty_balance, type: integer, source: computed, description: "Redeemable loyalty points = sum(LoyaltyLedgerEntry.points) for this member. Starts 0. Floored at 0." }
      - { name: no_show_strikes, type: integer, source: computed, description: "Running count of un-expired no-show strikes; starts 0. Drives BANNED status at threshold." }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | BANNED. SUSPENDED blocks queue join until cleared; BANNED is terminal. Values: ACTIVE | SUSPENDED | BANNED" }

  - name: ServiceMenuItem
    parent: Salon
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: salon_id, type: string, source: system, description: "FK -> Salon.id; owning salon" }
      - { name: code, type: string, source: input, description: "Short service code e.g. 'BROW_THREAD'; unique within salon" }
      - { name: name, type: string, source: input, description: "Display name e.g. 'Eyebrow Threading'" }
      - { name: base_price_cents, type: integer, source: input, description: "List price in integer cents. >0" }
      - { name: est_minutes, type: integer, source: input, description: "Estimated chair time in minutes for the quick-service menu item. >0" }
      - { name: package_eligible, type: boolean, source: input, default: false, description: "Whether this item can be drawn from a MembershipPackage credit" }
      - { name: status, type: enum, source: system, description: "LISTED | RETIRED. RETIRED items cannot start new visits. Values: LISTED | RETIRED" }

  - name: AddOn
    parent: Salon
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: salon_id, type: string, source: system, description: "FK -> Salon.id; owning salon" }
      - { name: code, type: string, source: input, description: "Add-on code e.g. 'TINT' | 'WAX'; unique within salon" }
      - { name: name, type: string, source: input, description: "Display name e.g. 'Brow Tint'" }
      - { name: price_cents, type: integer, source: input, description: "Add-on price in integer cents. >0" }
      - { name: requires_certification, type: boolean, source: input, default: true, description: "Whether the assigned technician must list this add-on's code in certified_addon_codes" }
      - { name: status, type: enum, source: system, description: "LISTED | RETIRED. Values: LISTED | RETIRED" }

  - name: RetailProduct
    parent: Salon
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: salon_id, type: string, source: system, description: "FK -> Salon.id; owning salon" }
      - { name: sku, type: string, source: input, description: "Retail SKU; unique within salon" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Unit retail price in integer cents. >0" }
      - { name: stock_qty, type: integer, source: computed, description: "On-hand units. Decremented when a retail line is added, restored on void. >=0" }
      - { name: initial_stock_qty, type: integer, source: input, default: 0, description: "Seeded on-hand units at creation. >=0" }

  - name: MembershipPackage
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: salon_id, type: string, source: system, description: "FK -> Salon.id; owning salon" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; package owner" }
      - { name: tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD; sets discount_bps and included credit count. Values: BRONZE | SILVER | GOLD" }
      - { name: discount_bps, type: integer, source: computed, description: "Member discount in basis points applied to service+add-on subtotal. BRONZE=500, SILVER=1000, GOLD=1500." }
      - { name: total_credits, type: integer, source: computed, description: "Prepaid package-eligible service credits granted at activation. BRONZE=4, SILVER=8, GOLD=12." }
      - { name: credits_remaining, type: integer, source: computed, description: "Unused service credits. Decremented when a package_eligible service is settled from this package; restored on void. >=0" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | DEPLETED | CANCELLED. PENDING until first payment; ACTIVE while credits_remaining>0; DEPLETED at 0; CANCELLED terminal. Values: PENDING | ACTIVE | DEPLETED | CANCELLED" }

  - name: QueueTicket
    parent: Salon
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: salon_id, type: string, source: system, description: "FK -> Salon.id; salon whose queue this ticket sits in" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the walk-in member" }
      - { name: service_menu_item_id, type: string, source: system, description: "FK -> ServiceMenuItem.id; requested quick-service item" }
      - { name: joined_at, type: datetime, source: system, description: "ISO 8601 UTC; instant the ticket entered the WAITING queue. Drives FIFO order and position." }
      - { name: position, type: integer, source: computed, description: "1-based FIFO rank among WAITING tickets in the same salon, ordered by joined_at ASC then id is NOT used; ties broken by created_at ASC. 0 when not WAITING." }
      - { name: called_count, type: integer, source: computed, description: "Number of times this ticket has been CALLED then re-queued. Starts 0; increments on each re-queue." }
      - { name: status, type: enum, source: system, description: "WAITING | CALLED | SEATED | NO_SHOW | CANCELLED. Cyclic WAITING<->CALLED. Values: WAITING | CALLED | SEATED | NO_SHOW | CANCELLED" }

  - name: ServiceVisit
    parent: Salon
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: salon_id, type: string, source: system, description: "FK -> Salon.id; owning salon" }
      - { name: queue_ticket_id, type: string, source: system, description: "FK -> QueueTicket.id; the ticket that was seated into this visit" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the served member" }
      - { name: chair_id, type: string, source: system, description: "FK -> Chair.id; chair the member is seated in" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; assigned technician" }
      - { name: service_menu_item_id, type: string, source: system, description: "FK -> ServiceMenuItem.id; the primary service performed" }
      - { name: membership_package_id, type: string, source: input, description: "FK -> MembershipPackage.id; optional package to draw a credit + discount from. Null = pay full price." }
      - { name: seated_at, type: datetime, source: system, description: "ISO 8601 UTC; instant the member was seated (visit created)." }
      - { name: ended_at, type: datetime, source: computed, description: "ISO 8601 UTC; instant service_status reached COMPLETED. Null until completed." }
      - { name: used_package_credit, type: boolean, source: computed, description: "True when finalization drew a credit from membership_package_id. Drives credit restore on void." }
      - { name: estimate_total_cents, type: integer, source: computed, description: "Provisional charge computed at seating from list prices + provisional add-ons (none yet); recomputed as lines change." }
      - { name: final_total_cents, type: integer, source: computed, description: "Finalized settlement total computed at COMPLETED; 0 until then." }
      - { name: loyalty_earned, type: integer, source: computed, description: "Loyalty points credited at finalization from final_total_cents. 0 until COMPLETED; reversed on void." }
      - { name: service_status, type: enum, source: system, description: "IN_SERVICE | COMPLETED | VOIDED. Independent dimension. Values: IN_SERVICE | COMPLETED | VOIDED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | SETTLED | REFUNDED. Independent dimension; SETTLED only allowed once service_status=COMPLETED. Values: UNPAID | SETTLED | REFUNDED" }

  - name: VisitLineItem
    parent: ServiceVisit
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: service_visit_id, type: string, source: system, description: "FK -> ServiceVisit.id; owning visit" }
      - { name: line_type, type: enum, source: input, description: "ADDON | RETAIL. Discriminates item_ref_id target entity. Values: ADDON | RETAIL" }
      - { name: item_ref_id, type: string, source: input, description: "Polymorphic id: AddOn.id when line_type=ADDON, RetailProduct.id when line_type=RETAIL. Resolved against line_type." }
      - { name: quantity, type: integer, source: input, default: 1, description: "Units. RETAIL may be >1; ADDON must be exactly 1. >=1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of the referenced item's price at the time the line was added (immutable thereafter)." }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity." }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED. VOIDED lines are excluded from settlement. Values: ACTIVE | VOIDED" }

  - name: LoyaltyLedgerEntry
    parent: Member
    common_fields: false   # append-only event; carries id + created_at only
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the member whose balance this entry adjusts" }
      - { name: service_visit_id, type: string, source: system, description: "FK -> ServiceVisit.id; the visit that produced this entry (null for manual adjustments)" }
      - { name: entry_type, type: enum, source: system, description: "EARN | REDEEM | REVERSAL | ADJUSTMENT. Values: EARN | REDEEM | REVERSAL | ADJUSTMENT" }
      - { name: points, type: integer, source: system, description: "Signed point delta; EARN/ADJUSTMENT(+) positive, REDEEM negative, REVERSAL opposite of the entry it reverses." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Salon: open/close lifecycle -----------------------------------------
  - entity: Salon
    initial_state: CLOSED
    terminal_states: []
    transitions:
      - from: CLOSED
        to: OPEN
        trigger: "POST /salon-svc/salons/{salonId}/open"
        actor: SalonManager
        preconditions:
          - "license_status must be ACTIVE: current clock < license_expiry, else ERR_LICENSE_LAPSED"
        side_effects:
          - "status -> OPEN; queue and seating operations become permitted"
          - "increments Salon.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /salon-svc/salons/{salonId}/close"
        actor: SalonManager
        preconditions:
          - "No Chair in OCCUPIED state (active_occupancy_count == 0), else ERR_SALON_HAS_ACTIVE_VISITS"
        side_effects:
          - "status -> CLOSED"
          - "All WAITING and CALLED QueueTickets -> CANCELLED (cascade down)"
          - "increments Salon.version by 1"

  # ---- QueueTicket: cyclic WAITING<->CALLED, plus seat/no-show -------------
  - entity: QueueTicket
    initial_state: WAITING
    terminal_states: [SEATED, NO_SHOW, CANCELLED]
    transitions:
      - from: WAITING
        to: CALLED
        trigger: "POST /salon-svc/queue-tickets/{ticketId}/call"
        actor: FrontDeskAgent
        preconditions:
          - "Salon.status == OPEN, else ERR_SALON_NOT_OPEN"
          - "Ticket is the lowest-position WAITING ticket OR caller passes allow_skip=true (ERR_QUEUE_ORDER_VIOLATION if a lower position is skipped without allow_skip)"
        side_effects:
          - "status -> CALLED; positions of remaining WAITING tickets recomputed (bubble: queue compaction)"
      - from: CALLED
        to: WAITING
        trigger: "POST /salon-svc/queue-tickets/{ticketId}/requeue"
        actor: FrontDeskAgent
        preconditions:
          - "called_count < MAX_RECALLS (=2), else ERR_RECALL_LIMIT_REACHED"
        side_effects:
          - "status -> WAITING; joined_at unchanged so FIFO position is restored; called_count += 1"
          - "positions recomputed for the salon's WAITING set"
        note: "Cyclic edge: a called member who steps away can be put back without losing their place; cycle is bounded by MAX_RECALLS."
      - from: CALLED
        to: SEATED
        trigger: "POST /salon-svc/service-visits"
        actor: FrontDeskAgent
        preconditions:
          - "Ticket.status == CALLED, else ERR_TICKET_NOT_CALLED"
          - "Chosen chair_id is in OPEN state past sanitation, else ERR_CHAIR_NOT_OPEN / ERR_CHAIR_NOT_SANITIZED"
          - "Chosen technician_id is in AVAILABLE state, else ERR_TECHNICIAN_NOT_AVAILABLE"
          - "Chosen technician's sanitation_cert_expiry is in the future, else ERR_TECH_CERT_EXPIRED"
        side_effects:
          - "status -> SEATED; a ServiceVisit is created (IN_SERVICE/UNPAID)"
          - "Chair OPEN -> OCCUPIED; Technician AVAILABLE -> BUSY; Salon.active_occupancy_count += 1 (cross-entity cascade)"
      - from: CALLED
        to: NO_SHOW
        trigger: "POST /salon-svc/queue-tickets/{ticketId}/no-show"
        actor: FrontDeskAgent
        preconditions:
          - "Ticket.status == CALLED, else ERR_TICKET_NOT_CALLED"
        side_effects:
          - "status -> NO_SHOW; Member gains a no-show strike (LoyaltyLedgerEntry not created; strike tracked via no_show recompute) -> may SUSPEND/BAN member (transitive cascade: ticket->member strike->member.status)"
      - from: [WAITING, CALLED]
        to: CANCELLED
        trigger: "POST /salon-svc/queue-tickets/{ticketId}/cancel"
        actor: FrontDeskAgent
        preconditions: []
        side_effects:
          - "status -> CANCELLED; positions recomputed for remaining WAITING tickets"

  # ---- ServiceVisit: PARALLEL dimensions service_status x payment_status ----
  - entity: ServiceVisit
    initial_state: IN_SERVICE          # service_status dimension initial; payment_status initial = UNPAID
    terminal_states: [VOIDED]          # terminal on the service dimension
    transitions:
      # --- service_status dimension ---
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /salon-svc/service-visits/{visitId}/complete"
        actor: Technician
        preconditions:
          - "service_status == IN_SERVICE, else ERR_VISIT_NOT_IN_SERVICE"
        side_effects:
          - "service_status -> COMPLETED; ended_at = current clock"
          - "final_total_cents computed via finalize_settlement calculation over ACTIVE lines + service, applying package credit + discount"
          - "If membership_package_id set and service is package_eligible and package has credits_remaining>0: used_package_credit=true; MembershipPackage.credits_remaining -= 1 (transitive: package may go ACTIVE->DEPLETED)"
          - "Chair OCCUPIED -> SANITIZING with sanitation_ready_at = ended_at + sanitation_minutes; Technician BUSY -> AVAILABLE; Salon.active_occupancy_count -= 1 (cross-entity cascade)"
      - from: [IN_SERVICE, COMPLETED]
        to: VOIDED
        trigger: "POST /salon-svc/service-visits/{visitId}/void"
        actor: SalonManager
        preconditions:
          - "service_status != VOIDED, else ERR_VISIT_ALREADY_VOIDED"
        side_effects:
          - "service_status -> VOIDED"
          - "If chair still OCCUPIED by this visit: Chair OCCUPIED -> SANITIZING (sanitation_ready_at = current clock + sanitation_minutes); Technician BUSY -> AVAILABLE; Salon.active_occupancy_count -= 1"
          - "If used_package_credit: MembershipPackage.credits_remaining += 1 (transitive: DEPLETED -> ACTIVE compensation)"
          - "If payment_status == SETTLED: payment_status -> REFUNDED; loyalty REVERSAL LoyaltyLedgerEntry of -loyalty_earned written; RetailProduct.stock_qty restored for each RETAIL line (deep compensating cascade)"
          - "All ACTIVE VisitLineItems -> VOIDED"
        note: "Compensating action: a void must leave member loyalty_balance and retail stock at their pre-visit values."
      # --- payment_status dimension (independent of service except the COMPLETED guard) ---
      - from: UNPAID
        to: SETTLED
        trigger: "POST /salon-svc/service-visits/{visitId}/settle"
        actor: FrontDeskAgent
        preconditions:
          - "service_status == COMPLETED (cross-dimension guard), else ERR_VISIT_NOT_COMPLETED"
          - "payment_status == UNPAID, else ERR_VISIT_NOT_UNPAID"
          - "If redeem_points supplied: Member.loyalty_balance >= redeem_points, else ERR_INSUFFICIENT_LOYALTY"
        side_effects:
          - "payment_status -> SETTLED"
          - "If redeem_points>0: REDEEM LoyaltyLedgerEntry of -redeem_points written; settlement reduced by redeem_points * POINT_VALUE_CENTS (floored at 0)"
          - "EARN LoyaltyLedgerEntry of +loyalty_earned written; Member.loyalty_balance recomputed"
        note: "Parallel dimension: settle only legal after the service dimension is COMPLETED; the two dimensions advance independently otherwise."

  # ---- Chair: occupancy + sanitation cycle ---------------------------------
  - entity: Chair
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: OCCUPIED
        trigger: "POST /salon-svc/service-visits (seating)"
        actor: FrontDeskAgent
        preconditions:
          - "Chair.status == OPEN, else ERR_CHAIR_NOT_OPEN"
          - "current clock >= sanitation_ready_at when sanitation_ready_at is set, else ERR_CHAIR_NOT_SANITIZED"
        side_effects:
          - "status -> OCCUPIED"
      - from: OCCUPIED
        to: SANITIZING
        trigger: "system (visit complete or void)"
        actor: system
        preconditions: []
        side_effects:
          - "sanitation_ready_at = visit end instant + sanitation_minutes"
      - from: SANITIZING
        to: OPEN
        trigger: "POST /salon-svc/chairs/{chairId}/mark-sanitized"
        actor: FrontDeskAgent
        preconditions:
          - "current clock >= sanitation_ready_at, else ERR_SANITATION_WINDOW_OPEN"
        side_effects:
          - "status -> OPEN"
      - from: [OPEN, SANITIZING]
        to: OUT_OF_SERVICE
        trigger: "POST /salon-svc/chairs/{chairId}/take-out-of-service"
        actor: SalonManager
        preconditions:
          - "Chair.status != OCCUPIED, else ERR_CHAIR_OCCUPIED"
        side_effects:
          - "status -> OUT_OF_SERVICE"
      - from: OUT_OF_SERVICE
        to: OPEN
        trigger: "POST /salon-svc/chairs/{chairId}/return-to-service"
        actor: SalonManager
        preconditions: []
        side_effects:
          - "status -> OPEN; sanitation_ready_at cleared to null"

  # ---- MembershipPackage: activation + depletion ---------------------------
  - entity: MembershipPackage
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /salon-svc/packages/{packageId}/activate"
        actor: Member
        preconditions:
          - "Member.status == ACTIVE, else ERR_MEMBER_NOT_ACTIVE"
        side_effects:
          - "status -> ACTIVE; discount_bps, total_credits, credits_remaining set from tier"
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (last credit consumed at visit finalization)"
        actor: system
        preconditions:
          - "credits_remaining reaches 0"
        side_effects:
          - "status -> DEPLETED"
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (credit restored by a visit void)"
        actor: system
        preconditions:
          - "credits_remaining becomes > 0 via void compensation"
        side_effects:
          - "status -> ACTIVE (cyclic compensation edge)"
      - from: [PENDING, ACTIVE]
        to: CANCELLED
        trigger: "POST /salon-svc/packages/{packageId}/cancel"
        actor: Member
        preconditions: []
        side_effects:
          - "status -> CANCELLED; credits_remaining frozen; no further credit draws permitted"

  # ---- VisitLineItem: active/void lifecycle --------------------------------
  - entity: VisitLineItem
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /salon-svc/visit-line-items/{lineId}/void (manual) or ServiceVisit void cascade"
        actor: FrontDeskAgent
        preconditions:
          - "Owning ServiceVisit.service_status == IN_SERVICE for the manual void, else ERR_VISIT_NOT_IN_SERVICE"
          - "Line.status == ACTIVE (idempotency: voiding a VOIDED line is rejected)"
        side_effects:
          - "status -> VOIDED; line excluded from estimate/settlement recompute"
          - "If line_type == RETAIL: RetailProduct.stock_qty += quantity (restore)"
        note: "Also fired as a cascade when the parent ServiceVisit is voided (all ACTIVE lines -> VOIDED)."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: seat-visit-stale-salon
    parent_entity: Salon
    write_endpoint: "POST /salon-svc/service-visits"
    occ_field: "expected_salon_version"
    description: |
      Seating a member into a ServiceVisit against a Salon whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. The salon's version bumps whenever a chair is seated or freed
      (active_occupancy_count changes) or the salon opens/closes; a client that
      read the salon before another seating completed is working from a stale
      occupancy view and must re-read before seating.
    error_id: ERR_STALE_SALON_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Variant pair #1 (ServiceVisit cost): provisional estimate vs final ---
  - name: visit_estimate_total
    trigger: "ServiceVisit creation (seating) and whenever a VisitLineItem is added/voided while IN_SERVICE"
    algorithm: aggregation
    formula: |
      # Provisional, list-price view BEFORE any package credit/discount is applied.
      service_part = ServiceMenuItem.base_price_cents
      addon_part   = sum(line.line_total_cents for line in lines
                         where line.status == ACTIVE and line.line_type == ADDON)
      retail_part  = sum(line.line_total_cents for line in lines
                         where line.status == ACTIVE and line.line_type == RETAIL)
      estimate_total_cents = service_part + addon_part + retail_part
    input_set: "ACTIVE VisitLineItems on this visit + the visit's ServiceMenuItem list price. Excludes VOIDED lines."
    precision: "integer cents, no rounding (all inputs already integer cents)"
    variants:
      - name: provisional
        when: "service_status == IN_SERVICE"
        difference: "Uses list prices; ignores membership discount and package credits; retail counted at full unit price."

  - name: finalize_settlement
    trigger: "ServiceVisit complete transition (service_status IN_SERVICE -> COMPLETED)"
    algorithm: tiered_pricing
    formula: |
      # FINAL view. Evaluation order is PINNED:
      # 1. discountable = service_part + addon_part  (RETAIL is never discounted)
      # 2. apply membership discount to the discountable subtotal ONLY:
      #      if membership_package_id set and package.status == ACTIVE:
      #          discount_cents = floor(discountable * package.discount_bps / 10000)
      #      else: discount_cents = 0
      # 3. credit draw: if service.package_eligible and membership_package_id set
      #      and package.status == ACTIVE and package.credits_remaining > 0:
      #          used_package_credit = true
      #          service_part_charged = 0           # the credit fully covers the service line
      #      else:
      #          used_package_credit = false
      #          service_part_charged = service_part
      #    NOTE: when a credit is drawn, the discount in step 2 is recomputed over
      #    addon_part ONLY (service line is free), so step 2 and step 3 are evaluated
      #    in the order 3-then-2 for the discountable base. PINNED: credit decision
      #    first, THEN discount over whatever service+addon remains chargeable.
      #      discountable_after_credit = service_part_charged + addon_part
      #      discount_cents = floor(discountable_after_credit * discount_bps / 10000)
      # 4. final_total_cents = service_part_charged + addon_part - discount_cents + retail_part
      # 5. loyalty_earned = floor(final_total_cents/100 * salon.loyalty_earn_rate_bps / 100)
      #      (earn computed BEFORE any settle-time point redemption; redemption reduces
      #       cash owed at settle, not points earned)
    input_set: "ACTIVE lines at completion + ServiceMenuItem + MembershipPackage (if any) + Salon.loyalty_earn_rate_bps"
    constants:
      POINT_VALUE_CENTS: 5     # each redeemed loyalty point is worth 5 cents at settle
    precision: "integer cents; each floor() applied at its own step (per-step rounding, NOT sum-then-round)"
    variants:
      - name: final
        when: "service_status == COMPLETED"
        difference: "Applies package credit (zeroes service line) then membership discount over remaining service+addon; retail excluded from discount; produces final_total_cents which generally differs from the provisional estimate_total_cents for the same lines."

  # ---- Variant pair #2 (Member risk): no-show strike scoring ----------------
  - name: no_show_strike_score
    trigger: "QueueTicket CALLED -> NO_SHOW transition; recomputed on member read"
    algorithm: threshold
    formula: |
      strikes = no_show_strikes (running count of un-expired strikes)
      # state escalation evaluated at strike time:
      if strikes >= BAN_THRESHOLD:        member.status = BANNED      # terminal
      elif strikes >= SUSPEND_THRESHOLD:  member.status = SUSPENDED
      else:                               member.status = ACTIVE (unchanged)
    input_set: "Count of NO_SHOW events for this member that are still un-expired."
    constants:
      SUSPEND_THRESHOLD: 2     # 2nd strike suspends
      BAN_THRESHOLD: 4         # 4th strike bans
    precision: "integer strike count; boundary is >= (exactly 2 suspends, exactly 4 bans)"
    variants:
      - name: instantaneous
        when: "evaluated at the moment a NO_SHOW is recorded"
        difference: "Uses current un-expired strike count; risk scoring on the Member domain, distinct from the cost accounting on ServiceVisit."

  # ---- Queue position derivation -------------------------------------------
  - name: queue_position
    trigger: "QueueTicket join, call, requeue, cancel, no-show; salon close cascade"
    algorithm: chronological
    formula: |
      candidates = QueueTickets where salon_id == this.salon_id and status == WAITING
      order candidates by joined_at ASC, then created_at ASC   # NO use of id
      position = 1-based index in that ordering
      tickets not in WAITING have position = 0
    input_set: "WAITING QueueTickets in the same salon only."
    precision: "integer 1-based rank; deterministic FIFO, tie-break created_at ASC"

  # ---- Member loyalty balance reconciliation -------------------------------
  - name: loyalty_balance
    trigger: "Any LoyaltyLedgerEntry write (EARN/REDEEM/REVERSAL/ADJUSTMENT)"
    algorithm: aggregation
    formula: |
      loyalty_balance = max(0, sum(entry.points for entry in LoyaltyLedgerEntry
                                   where entry.member_id == member.id))
    input_set: "All LoyaltyLedgerEntry rows for the member (append-only); none excluded."
    precision: "integer points, floored at 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; entity_backed Member acting on another member's resource is denied"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (salonId, then ticketId/visitId/chairId/technicianId/memberId/packageId)"
    error_id: "ERR_SALON_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_CHAIR_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_LINE_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: existence
    check: "Body-referenced resources exist (chair_id, technician_id, membership_package_id, item_ref_id, service_menu_item_id)"
    error_id: "ERR_CHAIR_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_ADDON_NOT_FOUND | ERR_RETAIL_NOT_FOUND | ERR_SERVICE_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: "POST service-visits, POST line-items"

  - priority: 5
    category: state
    check: "Salon must be OPEN for queue join, call, requeue, seating, settle"
    error_id: ERR_SALON_NOT_OPEN
    http_status: 409
    applies_to: "queue + seating + settle endpoints"

  - priority: 6
    category: state
    check: "Target resource in correct state for its transition (ticket CALLED to seat, visit IN_SERVICE to complete, visit COMPLETED to settle, chair OPEN to seat, technician AVAILABLE to assign, etc.)"
    error_id: "ERR_TICKET_NOT_CALLED | ERR_VISIT_NOT_IN_SERVICE | ERR_VISIT_NOT_COMPLETED | ERR_VISIT_NOT_UNPAID | ERR_VISIT_ALREADY_VOIDED | ERR_CHAIR_NOT_OPEN | ERR_TECHNICIAN_NOT_AVAILABLE | ERR_MEMBER_NOT_ACTIVE"
    http_status: 409
    applies_to: "transition endpoints"

  - priority: 7
    category: business_safety
    check: "License must be ACTIVE (clock < license_expiry) to open salon / seat a visit"
    error_id: ERR_LICENSE_LAPSED
    http_status: 403
    applies_to: "POST /salon-svc/salons/{id}/open, POST service-visits"

  - priority: 8
    category: business_safety
    check: "Assigned Technician's sanitation_cert_expiry must be in the future (clock < expiry) at seating"
    error_id: ERR_TECH_CERT_EXPIRED
    http_status: 403
    applies_to: "POST service-visits"

  - priority: 9
    category: business_safety
    check: "Member.status must be ACTIVE to join the queue (SUSPENDED/BANNED blocked)"
    error_id: ERR_MEMBER_BLOCKED
    http_status: 403
    applies_to: "POST queue-tickets"

  - priority: 10
    category: business_constraint
    check: "Chair sanitation window: current clock >= sanitation_ready_at before seating; mark-sanitized only after window"
    error_id: "ERR_CHAIR_NOT_SANITIZED | ERR_SANITATION_WINDOW_OPEN"
    http_status: 409
    applies_to: "POST service-visits, POST chairs/{id}/mark-sanitized"

  - priority: 11
    category: business_constraint
    check: "Add-on certification: technician must list the add-on's code in certified_addon_codes when AddOn.requires_certification=true"
    error_id: ERR_TECH_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST service-visits (with add-on lines), POST line-items (ADDON)"

  - priority: 12
    category: business_constraint
    check: "Queue FIFO order: calling a ticket that is not lowest-position WAITING requires allow_skip=true"
    error_id: ERR_QUEUE_ORDER_VIOLATION
    http_status: 409
    applies_to: "POST queue-tickets/{id}/call"

  - priority: 13
    category: business_constraint
    check: "Recall limit: a ticket may be requeued at most MAX_RECALLS (2) times"
    error_id: ERR_RECALL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST queue-tickets/{id}/requeue"

  - priority: 14
    category: business_constraint
    check: "Retail stock: RETAIL line quantity must not exceed RetailProduct.stock_qty"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST line-items (RETAIL)"

  - priority: 15
    category: business_constraint
    check: "ADDON line quantity must be exactly 1; line cannot be added to a non IN_SERVICE visit"
    error_id: "ERR_INVALID_LINE_QUANTITY | ERR_VISIT_NOT_IN_SERVICE"
    http_status: 409
    applies_to: "POST line-items"

  - priority: 16
    category: business_fiscal
    check: "Loyalty redemption: redeem_points must not exceed Member.loyalty_balance"
    error_id: ERR_INSUFFICIENT_LOYALTY
    http_status: 402
    applies_to: "POST service-visits/{id}/settle"

  - priority: 17
    category: business_temporal
    check: "Salon close requires zero OCCUPIED chairs (active_occupancy_count == 0)"
    error_id: ERR_SALON_HAS_ACTIVE_VISITS
    http_status: 409
    applies_to: "POST /salon-svc/salons/{id}/close"

  - priority: 18
    category: business_referential
    check: "VisitLineItem.line_type must match the referenced entity kind (ADDON->AddOn, RETAIL->RetailProduct)"
    error_id: ERR_LINE_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST line-items"

  - priority: 19
    category: business_constraint
    check: "OCC: expected_salon_version must equal current Salon.version on seating"
    error_id: ERR_STALE_SALON_VERSION
    http_status: 412
    applies_to: "POST service-visits"

  - priority: 20
    category: business_constraint
    check: "Uniqueness within salon: Member.phone, ServiceMenuItem.code, AddOn.code, RetailProduct.sku"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST members, service-menu-items, add-ons, retail-products"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute ISO 8601 UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [SalonManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set; license_status/chair sanitation/cert checks read this value"]

  # ---- Salon ---------------------------------------------------------------
  - method: POST
    path: "/salon-svc/salons"
    description: "Create a salon (starts CLOSED)."
    roles: [SalonManager]
    code: 201
    input: [name, license_number, license_expiry, "loyalty_earn_rate_bps?"]
    output: Salon
    side_effects: ["status=CLOSED; active_occupancy_count=0; version=1"]

  - method: GET
    path: "/salon-svc/salons"
    description: "List salons (paginated)."
    roles: [SalonManager, FrontDeskAgent, Technician, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Salon[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/salons/{salonId}"
    description: "Get a salon; license_status and active_occupancy_count recomputed on read."
    roles: [SalonManager, FrontDeskAgent, Technician, Member]
    code: 200
    input: []
    output: Salon
    side_effects: ["recompute license_status, active_occupancy_count"]

  - method: POST
    path: "/salon-svc/salons/{salonId}/open"
    description: "Open the salon for business."
    roles: [SalonManager]
    code: 200
    input: [expected_salon_version]
    output: Salon
    side_effects: ["status CLOSED->OPEN; increments Salon.version by 1"]

  - method: POST
    path: "/salon-svc/salons/{salonId}/close"
    description: "Close the salon; cancels remaining queue tickets."
    roles: [SalonManager]
    code: 200
    input: [expected_salon_version]
    output: Salon
    side_effects: ["status OPEN->CLOSED; WAITING/CALLED tickets->CANCELLED; increments Salon.version by 1"]

  # ---- Technician ----------------------------------------------------------
  - method: POST
    path: "/salon-svc/technicians"
    description: "Register a technician (salon_id in body)."
    roles: [SalonManager]
    code: 201
    input: [salon_id, display_name, sanitation_cert_expiry, "certified_addon_codes?"]
    output: Technician
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/salon-svc/technicians"
    description: "List technicians; filter by salon_id (reverse-reachability for Technician.salon_id)."
    roles: [SalonManager, FrontDeskAgent, Technician]
    code: 200
    input: ["salon_id?", "status?", "limit?", "offset?"]
    output: "Technician[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/technicians/{technicianId}"
    description: "Get a technician."
    roles: [SalonManager, FrontDeskAgent, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # ---- Chair ---------------------------------------------------------------
  - method: POST
    path: "/salon-svc/chairs"
    description: "Add a chair (starts OPEN; salon_id in body)."
    roles: [SalonManager]
    code: 201
    input: [salon_id, label, "sanitation_minutes?"]
    output: Chair
    side_effects: ["status=OPEN; sanitation_ready_at=null"]

  - method: GET
    path: "/salon-svc/chairs"
    description: "List chairs; filter by salon_id (reverse-reachability for Chair.salon_id)."
    roles: [SalonManager, FrontDeskAgent, Technician]
    code: 200
    input: ["salon_id?", "status?", "limit?", "offset?"]
    output: "Chair[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/chairs/{chairId}"
    description: "Get a chair."
    roles: [SalonManager, FrontDeskAgent, Technician]
    code: 200
    input: []
    output: Chair
    side_effects: []

  - method: POST
    path: "/salon-svc/chairs/{chairId}/mark-sanitized"
    description: "Mark a SANITIZING chair OPEN once its sanitation window has elapsed."
    roles: [FrontDeskAgent, SalonManager]
    code: 200
    input: []
    output: Chair
    side_effects: ["status SANITIZING->OPEN (clock>=sanitation_ready_at)"]

  - method: POST
    path: "/salon-svc/chairs/{chairId}/take-out-of-service"
    description: "Take a non-occupied chair out of service."
    roles: [SalonManager]
    code: 200
    input: []
    output: Chair
    side_effects: ["status->OUT_OF_SERVICE"]

  - method: POST
    path: "/salon-svc/chairs/{chairId}/return-to-service"
    description: "Return an out-of-service chair to OPEN."
    roles: [SalonManager]
    code: 200
    input: []
    output: Chair
    side_effects: ["status OUT_OF_SERVICE->OPEN; sanitation_ready_at=null"]

  # ---- Member --------------------------------------------------------------
  - method: POST
    path: "/salon-svc/members"
    description: "Register a member (salon_id in body; phone unique within salon)."
    roles: [FrontDeskAgent, SalonManager]
    code: 201
    input: [salon_id, full_name, phone]
    output: Member
    side_effects: ["status=ACTIVE; loyalty_balance=0; no_show_strikes=0"]

  - method: GET
    path: "/salon-svc/members"
    description: "List members; filter by salon_id (reverse-reachability for Member.salon_id)."
    roles: [SalonManager, FrontDeskAgent]
    code: 200
    input: ["salon_id?", "phone?", "status?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/members/{memberId}"
    description: "Get a member; loyalty_balance and no_show_strikes recomputed on read."
    roles: [SalonManager, FrontDeskAgent, Member]
    code: 200
    input: []
    output: Member
    side_effects: ["recompute loyalty_balance, no_show_strikes"]

  - method: POST
    path: "/salon-svc/members/{memberId}/loyalty-adjustments"
    description: "Manager grants/deducts loyalty points (writes an ADJUSTMENT ledger entry)."
    roles: [SalonManager]
    code: 201
    input: [points]
    output: LoyaltyLedgerEntry
    side_effects: ["ADJUSTMENT LoyaltyLedgerEntry written; Member.loyalty_balance recomputed"]

  # ---- LoyaltyLedgerEntry (reverse-reachability) ---------------------------
  - method: GET
    path: "/salon-svc/loyalty-entries"
    description: "List loyalty ledger entries; filter by member_id or service_visit_id (reverse-reachability for LoyaltyLedgerEntry.member_id and .service_visit_id)."
    roles: [SalonManager, FrontDeskAgent, Member]
    code: 200
    input: ["member_id?", "service_visit_id?", "entry_type?", "limit?", "offset?"]
    output: "LoyaltyLedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/loyalty-entries/{entryId}"
    description: "Get a loyalty ledger entry (derives LoyaltyLedgerEntry collection segment)."
    roles: [SalonManager, FrontDeskAgent, Member]
    code: 200
    input: []
    output: LoyaltyLedgerEntry
    side_effects: []

  # ---- MembershipPackage ---------------------------------------------------
  - method: POST
    path: "/salon-svc/packages"
    description: "Create a membership package for a member (member_id in body; starts PENDING)."
    roles: [FrontDeskAgent, SalonManager]
    code: 201
    input: [member_id, tier]
    output: MembershipPackage
    side_effects: ["status=PENDING; discount_bps/total_credits/credits_remaining derived from tier"]

  - method: GET
    path: "/salon-svc/packages"
    description: "List packages; filter by member_id or salon_id (reverse-reachability for MembershipPackage.member_id and .salon_id)."
    roles: [SalonManager, FrontDeskAgent, Member]
    code: 200
    input: ["member_id?", "salon_id?", "status?", "limit?", "offset?"]
    output: "MembershipPackage[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/packages/{packageId}"
    description: "Get a membership package."
    roles: [SalonManager, FrontDeskAgent, Member]
    code: 200
    input: []
    output: MembershipPackage
    side_effects: []

  - method: POST
    path: "/salon-svc/packages/{packageId}/activate"
    description: "Activate a PENDING package (first payment)."
    roles: [Member, FrontDeskAgent]
    code: 200
    input: []
    output: MembershipPackage
    side_effects: ["status PENDING->ACTIVE"]

  - method: POST
    path: "/salon-svc/packages/{packageId}/cancel"
    description: "Cancel a package."
    roles: [Member, SalonManager]
    code: 200
    input: []
