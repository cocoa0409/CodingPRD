              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/waves"
              payload: { name: "FW", field_window_start: "2026-06-01T00:00:00Z", field_window_end: "2026-06-30T00:00:00Z", rotation_cooldown_days: 0 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { wave_id: $.data.id }
            - call: "POST /waves/${wave_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /shoppers"
              payload: { full_name: "Fee Shop", email: "fee@x.test", home_lat: 40.0, home_lng: -74.0, tax_id_on_file: true }
              as: Anonymous
              captures: { shopper_id: $.data.id }
            - call: "POST /shoppers/${shopper_id}/certification-attempts"
              payload: { raw_score: 90, scenario_family: "RETAIL" }
              as: QaValidator
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-05T00:00:00Z" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { rej_asg_id: $.data.id }
            - call: "POST /assignments/${rej_asg_id}/accept"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${rej_asg_id}/evidence"
              payload: { kind: "PHOTO", object_uri: "s3://e/a.jpg" }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { p1: $.data.id }
            - call: "POST /evidence/${p1}/review"
              payload: { decision: "APPROVE" }
              as: QaValidator
            - call: "POST /assignments/${rej_asg_id}/scorecard"
              payload: { section_scores_json: { greeting: 60, cleanliness: 60 } }
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${rej_asg_id}/submit"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${rej_asg_id}/reject"
              payload: {}
              as: QaValidator
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-20T00:00:00Z" }
              as: ClientManager
