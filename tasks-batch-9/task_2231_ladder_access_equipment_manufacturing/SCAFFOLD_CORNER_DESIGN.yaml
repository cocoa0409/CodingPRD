      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-20T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
