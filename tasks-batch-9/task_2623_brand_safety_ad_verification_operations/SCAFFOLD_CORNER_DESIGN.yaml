              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/sports" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 9000, in_view_impressions: 9000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_id: $.data.id }
            - call: "POST /ivt-findings"
              payload: { batch_id: "${batch_id}", ivt_class: "GENERAL_BOT", flagged_impressions: 300, confidence: 0.90, detector_note: "Known crawler UA" }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { f_bot: $.data.id }
            - call: "POST /ivt-findings"
              payload: { batch_id: "${batch_id}", ivt_class: "DATACENTER", flagged_impressions: 500, confidence: 0.90, detector_note: "Cloud ASN" }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { f_dc: $.data.id }
            - call: "POST /ivt-findings"
              payload: { batch_id: "${batch_id}", ivt_class: "SIVT_AD_FARM", flagged_impressions: 200, confidence: 0.90, detector_note: "Ad farm cluster" }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { f_farm: $.data.id }
            - call: "POST /ivt-findings"
              payload: { batch_id: "${batch_id}", ivt_class: "SIVT_HIJACKED_DEVICE", flagged_impressions: 9000, confidence: 0.90, detector_note: "Unverified device-hijack hypothesis" }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { f_hijack: $.data.id }
            - call: "POST /ivt-findings"
              payload: { batch_id: "${batch_id}", ivt_class: "DATACENTER", flagged_impressions: 4000, confidence: 0.90, detector_note: "Overbroad ASN range" }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { f_bad: $.data.id }
          trigger:
            - call: "POST /ivt-findings/${f_bot}/confirm"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /ivt-findings/${f_dc}/confirm"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /ivt-findings/${f_farm}/confirm"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /ivt-findings/${f_bad}/confirm"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /ivt-findings/${f_bad}/retract"
              payload: { retract_reason: "ASN range included a residential block" }
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches/${batch_id}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches/${batch_id}/certify"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
          assert:
            - "After confirming GENERAL_BOT 300 alone: ivt_impressions == 300 and ivt_rate == 0.0300"
            - "After also confirming DATACENTER 500: ivt_impressions == 500, NOT 800 - the GIVT family contributes its maximum, not the sum of its detectors"
            - "After also confirming SIVT_AD_FARM 200: ivt_impressions == 700 (GIVT 500 + SIVT 200, families are additive), ivt_rate == 0.0700, sophistication_flag == true, net_billable_impressions == 9300"
            - "After confirming DATACENTER 4000: ivt_impressions == 4200 (GIVT max moves to 4000) and ivt_rate == 0.4200"
            - "After retracting it: ivt_impressions == 700 again, ivt_rate == 0.0700, net_billable_impressions == 9300, sophistication_flag == true - the family maximum falls back to 500 rather than sticking at its high-water mark"
            - "IvtFinding.${f_hijack}.status is still PROPOSED and its 9000 impressions never entered any aggregate at any point"
            - "IvtFinding.${f_bad}.status == RETRACTED with retract_reason stored"
            - "After score: coverage_rate == 0.9000, qualified_in_view_impressions == 9000, viewability_rate == 1.0000, assessed_tier == SAFE, suitability_breach_flag == false"
            - "After certify: scoring_status == QUARANTINED because ivt_rate 0.0700 exceeds the pinned ceiling 0.02, even though coverage_rate 0.9000 and suitability both passed; Publisher.${pub_id}.quarantined_batch_count == 1 and certified_batch_count == 0"
            - "700 + 9300 == 10000 == measured_impressions (INVARIANT_IMPRESSION_CONSERVATION, money-neutral half)"

      - name: mfa_score_rounds_each_component_before_summing
        claim_type: precision
        grounds:
          - calculations.mfa_score
          - entities.Publisher.sourced_traffic_pct
        distinguishing_aspect: |
          Four components are each rounded to 2 decimals half-up BEFORE the
          sum: 4.936 -> 4.94, 6.675 -> 6.68 and 1.677 -> 1.68 give 13.30,
          whereas summing the raw values (4.936 + 0 + 6.675 + 1.677 = 13.288)
          and rounding once gives 13.29. The same fixture also pins both
          refresh bands, whose edges are (0, 15] and (15, 30].
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; publisher with sourced_traffic_pct 0.33375, so sourced_points is round_half_up(0.33375 * 20, 2) == 6.68."
            - "Three pages classified MODEL [GENERAL] with ad_density_ratio 0.1234 (density_points round_half_up(12.34 * 0.4, 2) == 4.94) and originality_score 88.82 (originality_points round_half_up(11.18 * 0.15, 2) == 1.68), differing only in refresh_seconds: 0, 15 and 16."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.33375 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/p0" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_0: $.data.id, page_0_ver: $.data.version }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/p15" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_15: $.data.id, page_15_ver: $.data.version }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/p16" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_16: $.data.id, page_16_ver: $.data.version }
          trigger:
            - call: "POST /page-classifications"
              payload: { page_id: "${page_0}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_0_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.1234, refresh_seconds: 0, originality_score: 88.82 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_0: $.data.id, mfa_0: $.data.mfa_score }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_15}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_15_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.1234, refresh_seconds: 15, originality_score: 88.82 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_15: $.data.id, mfa_15: $.data.mfa_score }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_16}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_16_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.1234, refresh_seconds: 16, originality_score: 88.82 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_16: $.data.id, mfa_16: $.data.mfa_score }
          assert:
            - "${mfa_0} == 13.30 exactly (4.94 + 0.00 + 6.68 + 1.68); the value 13.29 produced by summing the unrounded components is wrong"
            - "${mfa_15} == 38.30 (refresh_seconds 15 is inside the fast band (0, 15] and scores 25.00)"
            - "${mfa_16} == 25.30 (refresh_seconds 16 falls into the medium band (15, 30] and scores 12.00)"
            - "All three classifications have mfa_flag == false (13.30, 38.30 and 25.30 are all below the 70.00 threshold) and Publisher.${pub_id}.mfa_page_count == 0"
            - "All three classifications have base_risk_points == 0, adjusted_risk_points == 0.00 and assigned_tier == SAFE - no MFA multiplier is applied because mfa_flag is false"

