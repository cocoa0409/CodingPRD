# =============================================================================
# §1.9 Scaffold Corner Design — School Threat Assessment Team
# Breadth coverage of every §1.1–§1.7 testable claim not already covered by
# §1.8. Sections and claim_type values follow references/claim-extraction-guide.md.
# All timestamps use the logical clock (default 2026-08-01T00:00:00Z).
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_case_returns_initial_state_and_system_fields
        claim_type: creation
        grounds: [entities.ThreatCase, state_machines.ThreatCase]
        distinguishing_aspect: "POST /threat-cases with all required fields returns 201 with status INTAKE (initial state), version 1, and system defaults (consecutive_missed_count 0, escalation_flag false, risk_level null, triage_priority null)."
        test_recipe:
          setup: ["One school exists"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Init HS", school_code: "INI", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-INI", reporter_channel: "TIP_LINE", summary: "initial state check" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id, st: $.data.status, ver: $.data.version, lvl: $.data.risk_level, esc: $.data.escalation_flag, missed: $.data.consecutive_missed_count }
          assert:
            - "response: status == INTAKE, version == 1, risk_level == null, triage_priority == null, escalation_flag == false, consecutive_missed_count == 0"
            - "response id is a server-minted UUID (no type prefix); created_at/updated_at present in ISO8601 UTC"

      - name: create_case_missing_school_id_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ThreatCase.fields.school_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field school_id is rejected with 400 ERR_INVALID_REQUEST before any existence processing."
        test_recipe:
          setup: ["Empty database is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "POST /threat-cases"
              payload: { subject_alias: "STU-X", reporter_channel: "TIP_LINE", summary: "no school" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: create_case_invalid_reporter_channel_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ThreatCase.fields.reporter_channel, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "reporter_channel outside {TIP_LINE, STAFF_REFERRAL} is a 400 enum violation."
        test_recipe:
          setup: ["One school exists"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Enum HS", school_code: "ENU", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-E", reporter_channel: "PARENT_HOTLINE", summary: "bad enum" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: get_case_with_unknown_id_returns_case_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CASE_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but non-existent case id returns 404 ERR_CASE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "GET /threat-cases/11111111-2222-3333-4444-555555555555"
              as: TeamLead
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and error_id == ERR_CASE_NOT_FOUND"

      - name: school_creation_applies_retention_days_default
        claim_type: defaults
        grounds: [entities.School.fields.retention_days]
        distinguishing_aspect: "Omitting retention_days on school creation applies the documented default 365."
        test_recipe:
          setup: ["Empty database is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "POST /schools"
              payload: { name: "Default ES", school_code: "DEF", enrollment_count: 300 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id, ret: $.data.retention_days }
          assert:
            - "response retention_days == 365"

      - name: school_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.School.fields.school_code, "errors[ERR_DUPLICATE_SCHOOL_CODE]"]
        distinguishing_aspect: "A second school with an existing school_code is rejected with 409 ERR_DUPLICATE_SCHOOL_CODE."
        test_recipe:
          setup: ["School with code DUP exists"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "First", school_code: "DUP", enrollment_count: 100 }
              as: DistrictAdministrator
          trigger:
            - call: "POST /schools"
              payload: { name: "Second", school_code: "DUP", enrollment_count: 200 }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_DUPLICATE_SCHOOL_CODE"

      - name: create_case_with_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.ThreatCase.fields.screening_score, entities.ThreatCase.fields.risk_level]
        distinguishing_aspect: "Client-supplied computed/system fields (screening_score, risk_level, status) in the create body are ignored; the response carries server defaults."
        test_recipe:
          setup: ["One school exists"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Ignore HS", school_code: "IGN", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-IGN", reporter_channel: "TIP_LINE", summary: "computed fields ignored", screening_score: 6, risk_level: "IMMINENT", status: "PLAN_ACTIVE" }
              as: IntakeCoordinator
              captures: { st: $.data.status, score: $.data.screening_score, lvl: $.data.risk_level }
          assert:
            - "response status == INTAKE, screening_score == null, risk_level == null (client input for computed/system fields ignored)"

      - name: list_cases_paginates_with_envelope_fields
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /threat-cases honors limit/offset and reports total_count and has_more per the fixed envelope (defaults limit=10)."
        test_recipe:
          setup: ["One school with three cases"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Page HS", school_code: "PAG", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-P1", reporter_channel: "TIP_LINE", summary: "p1" }
              as: IntakeCoordinator
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-P2", reporter_channel: "TIP_LINE", summary: "p2" }
              as: IntakeCoordinator
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-P3", reporter_channel: "STAFF_REFERRAL", summary: "p3" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /threat-cases"
              payload: { limit: 2, offset: 0 }
              as: TeamLead
            - call: "GET /threat-cases"
              payload: { limit: 2, offset: 2 }
              as: TeamLead
          assert:
            - "page 1: exactly 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): exactly 1 item, total_count == 3, has_more == false"
            - "items are ordered by created_at ASC (STU-P1, STU-P2, STU-P3)"

      - name: document_and_audit_event_are_append_only_shape
        claim_type: immutability
        grounds: [entities.CaseDocument, entities.AuditEvent]
        distinguishing_aspect: "common_fields:false entities: CaseDocument and AuditEvent responses expose id and created_at but no version/updated_at, and no update or delete endpoints exist for them."
        test_recipe:
          setup: ["One INTAKE case with one document; case creation has emitted an audit event"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Append HS", school_code: "APP", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-APP", reporter_channel: "TIP_LINE", summary: "append-only" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/documents"
              payload: { doc_type: "INTAKE_NOTE", body: "first note" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /threat-cases/${case_id}/documents"
              as: TeamLead
            - call: "GET /threat-cases/${case_id}/audit-events"
              as: TeamLead
          assert:
            - "documents[0] has id and created_at but no version and no updated_at fields"
            - "audit-events[0] has id and created_at but no version and no updated_at fields; action == CASE_CREATED, actor_role == IntakeCoordinator"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: unknown_role_returns_unauthenticated_header_error
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "An unrecognized X-User-Role value fails validation priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before role authorization."
        test_recipe:
          setup: ["Empty database is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "GET /threat-cases"
              as: Superintendent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: triage_missing_priority_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=2.5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A structurally incomplete action body (missing triage_priority) fails the format check at priority 2.5, before state evaluation."
        test_recipe:
          setup: ["One INTAKE case"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Format HS", school_code: "FMT", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-F", reporter_channel: "TIP_LINE", summary: "format" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_notes: "missing priority field" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: body_school_fk_not_found_returns_404
        claim_type: violation_to_error
        grounds: ["validations[priority=3.6]", "errors[ERR_SCHOOL_NOT_FOUND]"]
        distinguishing_aspect: "A body-referenced school_id that does not exist yields 404 ERR_SCHOOL_NOT_FOUND at the body-FK existence check."
        test_recipe:
          setup: ["Empty database is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "POST /threat-cases"
              payload: { school_id: "11111111-2222-3333-4444-555555555555", subject_alias: "STU-NF", reporter_channel: "TIP_LINE", summary: "bad school" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and error_id == ERR_SCHOOL_NOT_FOUND"

      - name: interview_body_case_fk_not_found_returns_404
        claim_type: violation_to_error
        grounds: ["validations[priority=3.6]", "errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "A body-referenced case_id that does not exist yields 404 ERR_CASE_NOT_FOUND (same existence tier, different reference field)."
        test_recipe:
          setup: ["Empty database is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "POST /interviews"
              payload: { case_id: "11111111-2222-3333-4444-555555555555", interviewee_type: "WITNESS", starts_at: "2026-08-05T10:00:00Z", ends_at: "2026-08-05T11:00:00Z" }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and error_id == ERR_CASE_NOT_FOUND"

      - name: plan_cadence_beyond_level_max_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=6.1]", "errors[ERR_CADENCE_TOO_LONG]"]
        distinguishing_aspect: "cadence_days 31 on a MODERATE case (max 30) is rejected with 422 ERR_CADENCE_TOO_LONG."
        test_recipe:
          setup: ["Case in UNDER_ASSESSMENT with FINALIZED MODERATE assessment (score 30)"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Cadence HS", school_code: "CAD", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-CAD", reporter_channel: "TIP_LINE", summary: "cadence" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
          trigger:
            - call: "POST /management-plans"
              payload: { case_id: "${case_id}", cadence_mode: "FROM_COMPLETION", cadence_days: 31, conditions: ["x"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and error_id == ERR_CADENCE_TOO_LONG"

      - name: sod_finalize_by_creator_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SOD_SELF_APPROVAL]", state_machines.RiskAssessment.SUBMITTED_to_FINALIZED]
        distinguishing_aspect: "Segregation of duties: finalizing a SUBMITTED assessment while carrying the same X-User-ID as its creator is rejected with 403 ERR_SOD_SELF_APPROVAL; a different TeamLead user succeeds."
        test_recipe:
          setup: ["Case in UNDER_ASSESSMENT with a SUBMITTED assessment created by ta_1"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "SoD HS", school_code: "SOD", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-SOD", reporter_channel: "TIP_LINE", summary: "sod" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
          trigger:
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: ta_1
              captures: { err: $.data.error_id }
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_9
              captures: { st: $.data.status }
          assert:
            - "finalize as user ta_1 (the creator): 403 ERR_SOD_SELF_APPROVAL"
            - "finalize as user tl_9 (different user): 200, status == FINALIZED"

      - name: sod_reentry_approve_by_proposer_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SOD_SELF_APPROVAL]", state_machines.ReEntryPlan.PROPOSED_to_APPROVED]
        distinguishing_aspect: "Segregation of duties on the second guarded transition: approving a PROPOSED re-entry plan with the proposer's X-User-ID is 403 ERR_SOD_SELF_APPROVAL (state precondition passes, so the safety check is the one that fires)."
        test_recipe:
          setup: ["Case REMOVED; re-entry plan PROPOSED by ta_1"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "SoD2 HS", school_code: "SD2", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-SD2", reporter_channel: "TIP_LINE", summary: "sod reentry" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /threat-cases/${case_id}/remove"
              payload: { removal_type: "EMERGENCY_REMOVAL", removal_reason: "safety hold" }
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /re-entry-plans"
              payload: { case_id: "${case_id}", conditions: ["counseling intake"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /re-entry-plans/${rep_id}/approve"
              payload: {}
              as: TeamLead
              as_user_id: ta_1
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403 and error_id == ERR_SOD_SELF_APPROVAL (plan is PROPOSED, so priority-4 state passes and the priority-5 SoD check fires)"

      - name: priority_conflict_reentry_state_beats_sod
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        excluded_because:
          difficulty_instance: reentry_approve_state_error_beats_sod
          rationale: "Dual-failure priority assertion (state vs business_safety) is the failure path of the named §1.8 instance."

      - name: priority_conflict_interview_quota_beats_overlap
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: interview_quota_error_beats_overlap
          rationale: "Dual-failure priority assertion (business_constraint vs business_temporal) is the failure path of the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: triage_emergent_autocreates_urgent_le_referral
        claim_type: side_effect_execution
        grounds: [state_machines.ThreatCase.INTAKE_to_TRIAGED, entities.Referral.fields.auto_created]
        distinguishing_aspect: "Triaging with priority EMERGENT auto-creates a LAW_ENFORCEMENT URGENT referral in SENT status (sla_due_at = +72h); ROUTINE triage creates none."
        test_recipe:
          setup: ["Two INTAKE cases on one school"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Emerg HS", school_code: "EMG", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-EM1", reporter_channel: "TIP_LINE", summary: "emergent" }
              as: IntakeCoordinator
              captures: { case_a: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-EM2", reporter_channel: "TIP_LINE", summary: "routine" }
              as: IntakeCoordinator
              captures: { case_b: $.data.id }
          trigger:
            - call: "POST /threat-cases/${case_a}/triage"
              payload: { triage_priority: "EMERGENT", triage_notes: "credible and imminent" }
              as: IntakeCoordinator
              captures: { st_a: $.data.status, pr_a: $.data.triage_priority }
            - call: "POST /threat-cases/${case_b}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "standard" }
              as: IntakeCoordinator
            - call: "GET /threat-cases/${case_a}/referrals"
              payload: { referral_type: "LAW_ENFORCEMENT" }
              as: TeamLead
              captures: { ref_auto : "$.data[0].auto_created", ref_urg : "$.data[0].urgency", ref_st : "$.data[0].status" }
            - call: "GET /threat-cases/${case_b}/referrals"
              as: TeamLead
          assert:
            - "EMERGENT triage: case TRIAGED with triage_priority == EMERGENT and one auto-created referral (auto_created == true, urgency == URGENT, status == SENT, sla_due_at == created_at + 72 hours)"
            - "ROUTINE triage: GET referrals returns total_count == 0"

      - name: screening_on_intake_case_returns_not_triaged
        claim_type: invalid_transition
        grounds: [state_machines.ThreatCase.TRIAGED_to_UNDER_ASSESSMENT, "errors[ERR_CASE_NOT_TRIAGED]"]
        distinguishing_aspect: "Screening requires TRIAGED; invoking it on an INTAKE case yields 409 ERR_CASE_NOT_TRIAGED with no state change."
        test_recipe:
          setup: ["One INTAKE case"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Seq HS", school_code: "SEQ", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-SEQ", reporter_channel: "TIP_LINE", summary: "skip triage" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_CASE_NOT_TRIAGED; case remains INTAKE with screening_score null"

      - name: triage_twice_returns_not_in_intake
        claim_type: invalid_transition
        grounds: [state_machines.ThreatCase.INTAKE_to_TRIAGED, "errors[ERR_CASE_NOT_IN_INTAKE]"]
        distinguishing_aspect: "A second triage on an already-TRIAGED case is rejected (no silent idempotency): 409 ERR_CASE_NOT_IN_INTAKE."
        test_recipe:
          setup: ["One TRIAGED case"]
          setup_api_calls:
