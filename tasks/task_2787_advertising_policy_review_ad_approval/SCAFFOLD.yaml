    side_effects: ["assigns sequence_index = previous max + 1 and creative_version_at_run", "creates one ClassifierDecision per submitted decision with disposition, country_multiplier_applied and assessed_points from calculations.screening_disposition", "writes outcome, decision_count, max_confidence and provisional_risk_score", "drives the AdCreative review_status transition for the outcome and its full cascade", "increments AdCreative.screening_run_count and AdCreative.version by 1"]

  - method: GET
    path: "/ad-policy/ad-creatives/{id}/screening-runs"
    description: "List the creative's screening runs, ordered by sequence_index ASC"
    roles: [PolicyAdmin, PolicyReviewer, IntegrityAnalyst, Advertiser]
    code: 200
    input: ["limit?", "offset?"]
    output: ScreeningRun[]
    side_effects: []

  - method: GET
    path: "/ad-policy/screening-runs/{id}"
    description: "Read one screening run"
    roles: [PolicyAdmin, PolicyReviewer, IntegrityAnalyst, Advertiser]
    code: 200
    input: []
    output: ScreeningRun
    side_effects: []

  - method: GET
    path: "/ad-policy/screening-runs/{id}/classifier-decisions"
    description: "List the decisions emitted by one run, ordered by created_at ASC"
    roles: [PolicyAdmin, PolicyReviewer, IntegrityAnalyst, Advertiser]
    code: 200
