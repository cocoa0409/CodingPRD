  # =================================================================
  # Cross-Cutting — Optimistic Concurrency (OCC)
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: change_plan_stale_subscription_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-change-plan-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly-sequential change-plan calls: the first with the observed version succeeds (version -> 2), a second reusing the now-stale expected_subscription_version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A household with an owner and a BASIC subscription observed at version 1."]
          setup_api_calls:
            - call: "POST /households"
              payload: { primary_email: "occ@x.test", display_name: "OCC" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "BASIC", period_start: "2025-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub}/change-plan"
              payload: { tier: "PLUS", expected_subscription_version: "${sub_v}" }
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /subscriptions/${sub}/change-plan"
              payload: { tier: "PREMIUM", expected_subscription_version: "${sub_v}" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { err: $.data.error_id }
          assert:
            - "first change-plan succeeds; Subscription.${sub}.tier == PLUS and version == 2"
            - "second change-plan (stale expected_subscription_version) returns HTTP 412 with error_id == ERR_STALE_VERSION"

