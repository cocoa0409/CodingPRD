              as: PlatformAdmin
            - call: "POST /api/profit-periods/${pp2_id}/line-items"
              payload: { category: "REVENUE", amount_cents: 9000000, entry_status: "FINALIZED", expected_profit_period_version: "${pp2_v}" }
              as: OperationsAuditor
            - call: "GET /api/profit-periods/${pp2_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp2_v2: $.data.version }
            - call: "POST /api/profit-periods/${pp2_id}/line-items"
