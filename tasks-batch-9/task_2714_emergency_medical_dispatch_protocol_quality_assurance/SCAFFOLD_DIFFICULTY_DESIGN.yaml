            - call: "POST /audit-programs"
              payload: { name: "Delta EMD QA", accreditation_body: "IAED", target_compliance_pct: 90.0, watch_floor_pct: 80.0, high_risk_target_pct: 85.0, hours_owed_restriction_threshold: 6.0 }
