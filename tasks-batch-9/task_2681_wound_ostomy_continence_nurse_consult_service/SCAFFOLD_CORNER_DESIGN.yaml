        distinguishing_aspect: "One request violates priority 6 and priority 15 at once, and the lower number must win even though its HTTP status (422) is the less obvious choice for a state problem. Isolating each violation in turn proves the ordering is real rather than an accident of evaluation order."
        test_recipe:
          setup:
