scenario: |
  Generate task harder than expert level!

  2520. Cosmetics Facility Registration & Product Listing (cosmetics regulatory compliance): manufacturing and processing facility registration with biennial renewal and ownership change updates, product listing submission with ingredient identification and category codes, responsible person designation and label contact information requirements, adverse event recordkeeping with serious event reporting deadlines, safety substantiation documentation for each product with supporting toxicological review, fragrance allergen disclosure and professional-use labeling distinctions, good manufacturing practice compliance and inspection readiness, recall authority response, market withdrawal execution and distribution record production

domain_name: cosmetics-facility-registration-product-listing
api_prefix: "/cosmetics"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: hybrid
  # Facility is the registration aggregate root (RegistrationPeriod, OwnershipChangeUpdate,
  # InspectionEngagement, ComplianceLedgerEntry hang off it); ProductListing is a second
  # aggregate root (ProductIngredient, SafetySubstantiation -> ToxicologicalReviewItem,
  # AdverseEvent, RecallAction -> MarketWithdrawal, DistributionRecord). DistributionRecord
  # is cross_aggregate (listing_id + withdrawal_id); ComplianceLedgerEntry is polymorphic
  # (subject_entity + subject_id).

  state_machine_shape: parallel
  state_machine_shape_secondary: cyclic
  # ProductListing carries two independent dimensions (listing_status x safety_status);
  # RecallAction and Facility are cyclic (plan-revision rounds; lapse -> late renewal ->
  # registered); InspectionEngagement branches fork-style on the readiness score.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  # Peer ownership (FacilityRegistrant owns the facility surface, ResponsiblePersonAgent owns
  # the listing surface, RegulatoryReviewer owns registration/listing/substantiation decisions,
  # EnforcementOfficer owns inspection/recall/withdrawal decisions) PLUS two hard segregation
  # rules keyed on X-User-ID (see roles[].segregation_rules and validations[priority=30]).

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the §0.4 Expert band: 14 entities, 55 endpoints, 44 error codes,
  # 9 calculations (3 dual-variant), 7 state machines, 3 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Facility
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: facility_name
        type: string
        source: input
        description: Legal name of the manufacturing or processing establishment.
        constraints: "1-200 chars, non-blank"
      - name: owner_operator_name
        type: string
        source: input
        description: Current owner/operator of record; overwritten when an OwnershipChangeUpdate is ACCEPTED.
        constraints: "1-200 chars"
      - name: facility_type
        type: enum
        source: input
        description: Regulated activity performed at the establishment.
        constraints: "enum: MANUFACTURER | PROCESSOR | BOTH"
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the establishment.
        constraints: "exactly 2 uppercase letters"
      - name: state_or_province
        type: string
        source: input
        description: Sub-national administrative division of the establishment.
        constraints: "1-64 chars"
      - name: facility_fei
        type: string
        source: system
        description: Registration number minted on the first APPROVE registration-decision.
        default: null
        constraints: "format FEI-NNNNNN, zero-padded to 6 digits, assigned in ascending order of the approving Facility.created_at; null until first approval"
      - name: registration_status
        type: enum
        source: system
        description: Registration lifecycle dimension (see state_machines.Facility).
        default: DRAFT
        constraints: "enum: DRAFT | PENDING_REVIEW | REGISTERED | RENEWAL_DUE | LAPSED | REJECTED"
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived enforcement posture gating child operations; recomputed by calculations.facility_compliance_posture after every mutation that can change its inputs.
        default: OPEN
        constraints: "enum: OPEN | RESTRICTED | FROZEN"
      - name: serious_event_points
        type: number
        source: computed
        description: Sum of AdverseEvent.event_points over the facility's listings (calculations.facility_serious_event_points).
        default: 0.00
        constraints: "2 decimals, 0.00-100.00"
      - name: registration_cycle_count
        type: integer
        source: system
        description: Number of RegistrationPeriod rows ever created for this facility (initial + renewals).
        default: 0
        constraints: ">= 0"
      - name: current_period_start
        type: datetime
        source: computed
        description: period_start of the RegistrationPeriod with status ACTIVE; null when none exists.
        default: null
        constraints: "date-only ISO 8601 (YYYY-MM-DD)"
      - name: current_period_end
        type: datetime
        source: computed
        description: period_end of the RegistrationPeriod with status ACTIVE (inclusive last day); null when none exists.
        default: null
        constraints: "date-only ISO 8601"
      - name: renewal_window_open_date
        type: datetime
        source: computed
        description: current_period_end minus RENEWAL_WINDOW_DAYS; earliest date a renewal is accepted.
        default: null
        constraints: "date-only ISO 8601"
      - name: grace_end_date
        type: datetime
        source: computed
        description: current_period_end plus GRACE_DAYS; last date a LATE_RENEWAL is accepted.
        default: null
        constraints: "date-only ISO 8601"
      - name: listed_product_count
        type: integer
        source: computed
        description: Count of ProductListing rows with facility_id == this.id AND listing_status == LISTED.
        default: 0
        constraints: ">= 0"
      - name: open_serious_event_count
        type: integer
        source: computed
        description: Count of AdverseEvent rows on this facility's listings with seriousness == SERIOUS AND report_status IN {REPORT_DUE, REPORT_OVERDUE}.
        default: 0
        constraints: ">= 0"
      - name: gmp_readiness_score
        type: number
        source: computed
        description: readiness_score of the InspectionEngagement for this facility with the greatest created_at among those whose status IN {OBSERVATIONS_ISSUED, RESPONSE_SUBMITTED, CLOSED_NAI, CLOSED_VAI, ESCALATED_OAI}; null when none.
        default: null
        constraints: "2 decimals, 0.00-100.00"
      - name: last_inspection_outcome
        type: enum
        source: computed
        description: outcome_class of the same InspectionEngagement selected for gmp_readiness_score; null when none.
        default: null
        constraints: "enum: NAI | VAI | OAI | null"
      - name: abbreviated_renewal_eligible
        type: boolean
        source: computed
        description: true iff compliance_posture == OPEN AND no OwnershipChangeUpdate with facility_id == this.id has status == ACCEPTED with change_effective_date BETWEEN current_period_start AND current_period_end (both inclusive).
        default: true
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no type prefix; identity only, never a business-decision input.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC with three fractional digits.
      - name: updated_at
        type: datetime
        source: system
        description: ISO 8601 UTC with three fractional digits, refreshed on every mutation including cascaded side effects.
      - name: version
        type: integer
        source: system
        description: Starts at 1, increments by exactly 1 on every mutation; OCC target for concurrency_rules.ownership-change-file-stale-facility.
        default: 1

  - name: RegistrationPeriod
    parent: Facility
    common_fields: true
    entity_kind: resource
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; set when the period is minted by a registration-decision APPROVE or a renewal."
      - name: period_kind
        type: enum
        source: system
        description: How the period was minted.
        constraints: "enum: INITIAL | RENEWAL | LATE_RENEWAL"
      - name: period_start
        type: datetime
        source: system
        description: First day of coverage, inclusive (closed-closed interval semantics).
        constraints: "date-only ISO 8601"
      - name: period_end
        type: datetime
        source: system
        description: Last day of coverage, inclusive (closed-closed interval semantics).
        constraints: "date-only ISO 8601"
      - name: renewal_window_open_date
        type: datetime
        source: computed
        description: period_end minus RENEWAL_WINDOW_DAYS (90).
        constraints: "date-only ISO 8601"
      - name: grace_end_date
        type: datetime
        source: computed
        description: period_end plus GRACE_DAYS (60).
        constraints: "date-only ISO 8601"
      - name: sequence_index
        type: integer
        source: system
        description: 1-based ordinal of this period within the facility, assigned in ascending created_at order.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: ACTIVE for the coverage period currently in force; EXPIRED once a successor period is minted or the sweep observes the facility past grace_end_date.
        default: ACTIVE
        constraints: "enum: ACTIVE | EXPIRED"

  - name: OwnershipChangeUpdate
    parent: Facility
    common_fields: true
    entity_kind: resource
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; taken from the {id} path segment of the filing endpoint."
      - name: new_owner_operator_name
        type: string
        source: input
        description: Owner/operator that takes over the establishment.
        constraints: "1-200 chars"
      - name: change_effective_date
        type: datetime
        source: input
        description: Calendar date on which the ownership transfer took effect.
        constraints: "date-only ISO 8601"
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the filing was accepted by the server.
      - name: filing_deadline_at
        type: datetime
        source: computed
        description: change_effective_date plus OWNERSHIP_FILING_DAYS (60), truncated to 23:59:59.999Z of that day.
      - name: is_late_filing
        type: boolean
        source: computed
        description: true iff filed_at > filing_deadline_at.
        default: false
      - name: status
        type: enum
        source: system
        description: Filing lifecycle (see state_machines.OwnershipChangeUpdate).
        default: FILED
        constraints: "enum: FILED | SUPERSEDED | ACCEPTED | REJECTED"
      - name: decision_note
        type: string
        source: input
        description: Free-text note recorded by the deciding RegulatoryReviewer.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the RegulatoryReviewer that decided the filing; null while FILED or SUPERSEDED.
        default: null

  - name: ResponsiblePerson
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name printed as the responsible person on the label.
        constraints: "1-200 chars"
      - name: us_address_line
        type: string
        source: input
        description: Domestic address used for label contact purposes.
        constraints: "1-300 chars"
      - name: contact_phone
        type: string
        source: input
        description: Voice number reachable for adverse-event intake.
        constraints: "7-32 chars"
      - name: contact_email
        type: string
        source: input
        description: Electronic contact for adverse-event intake.
        constraints: "must contain exactly one @"
      - name: designation_cap
        type: integer
        source: input
        description: Maximum number of listings this responsible person may hold in listing_status IN {SUBMITTED, LISTED} at once.
        default: 25
        constraints: "1-500"
      - name: active_designation_count
        type: integer
        source: computed
        description: Count of ProductListing rows with responsible_person_id == this.id AND listing_status IN {SUBMITTED, LISTED}.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: ACTIVE iff active_designation_count >= 1, otherwise DORMANT.
        default: DORMANT
        constraints: "enum: ACTIVE | DORMANT"

  - name: ProductListing
    parent: Facility
    common_fields: true
    entity_kind: resource
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the establishment that manufactures or processes the product."
      - name: responsible_person_id
        type: string
        source: input
        description: "FK -> ResponsiblePerson.id; current label-of-record designee, replaced by the transfer endpoint."
      - name: product_name
        type: string
        source: input
        description: Trade name of the cosmetic product.
        constraints: "1-200 chars"
      - name: category_code
        type: string
        source: input
        description: Cosmetic product category code declared on the listing.
        constraints: "must be a member of calculations.listing_category_validation.constants.CATEGORY_CODE_REGISTRY"
      - name: product_form
        type: enum
        source: input
        description: Determines which fragrance-allergen disclosure threshold applies.
        constraints: "enum: LEAVE_ON | RINSE_OFF"
      - name: professional_use_only
        type: boolean
        source: input
        description: true when the product is labeled for use only by licensed professionals; suppresses fragrance-allergen label disclosure requirements and halves adverse-event points.
        default: false
      - name: professional_use_statement_present
        type: boolean
        source: input
        description: true when the label carries the professional-use-only statement.
        default: false
      - name: label_contact_type
        type: enum
        source: input
        description: Channel disclosed on the label for adverse-event reporting.
        constraints: "enum: DOMESTIC_ADDRESS | DOMESTIC_PHONE | ELECTRONIC_CONTACT"
      - name: label_contact_value
        type: string
        source: input
        description: Literal contact string printed on the label.
        constraints: "1-300 chars"
      - name: lot_authorized_units
        type: integer
        source: input
        description: Per-lot authorized unit ceiling enforced by validations[priority=54] across overlapping-or-touching distribution windows of the same lot_code.
        default: 0
        constraints: ">= 0"
      - name: listing_number
        type: string
        source: system
        description: Minted on the first LIST decision; format CPL-NNNNNN zero-padded to 6 digits, assigned in ascending order of the listing's created_at; null before listing.
        default: null
      - name: listing_status
        type: enum
        source: system
        description: Submission dimension of the parallel state machine (see state_machines.ProductListing).
        default: DRAFT
        constraints: "enum: DRAFT | SUBMITTED | LISTED | RETURNED | SUSPENDED | DELISTED"
      - name: safety_status
        type: enum
        source: system
        description: Substantiation dimension of the parallel state machine; evolves independently of listing_status.
        default: UNSUBSTANTIATED
        constraints: "enum: UNSUBSTANTIATED | UNDER_SUBSTANTIATION | SUBSTANTIATED | REVALIDATION_REQUIRED | SUBSTANTIATION_FAILED"
      - name: suspension_reason
        type: enum
        source: system
        description: Why the listing sits in SUSPENDED; cleared to null on restoration.
        default: null
        constraints: "enum: FACILITY_LAPSED | RECALL_ESCALATION | null"
      - name: allergen_disclosure_complete
        type: boolean
        source: computed
        description: Output of calculations.allergen_disclosure_completeness over this listing's ProductIngredient rows.
        default: true
      - name: undisclosed_allergen_count
        type: integer
        source: computed
        description: Count of ProductIngredient rows on this listing with disclosure_required == true AND label_disclosed == false.
        default: 0
        constraints: ">= 0"
      - name: distributed_units_total
        type: integer
        source: computed
        description: Sum of DistributionRecord.units_shipped over rows with listing_id == this.id (no status filter; every record counts).
        default: 0
        constraints: ">= 0"
      - name: open_recall_count
        type: integer
        source: computed
        description: Count of RecallAction rows with listing_id == this.id AND status NOT IN {CLOSED_EFFECTIVE, ESCALATED_MANDATORY}.
        default: 0
        constraints: ">= 0"
      - name: marketable
        type: boolean
        source: computed
        description: true iff listing_status == LISTED AND safety_status == SUBSTANTIATED AND allergen_disclosure_complete == true AND the parent Facility.compliance_posture != FROZEN.
        default: false

  - name: ProductIngredient
    parent: ProductListing
    common_fields: true
    entity_kind: resource
    fields:
      - name: listing_id
        type: string
        source: system
        description: "FK -> ProductListing.id; taken from the {id} path segment."
      - name: inci_name
        type: string
        source: input
        description: International Nomenclature of Cosmetic Ingredients name; unique per listing.
        constraints: "1-120 chars; case-insensitive unique within listing_id"
      - name: cas_number
        type: string
        source: input
        description: Chemical Abstracts Service registry number, when assigned.
        default: null
      - name: function_code
        type: enum
        source: input
        description: Functional role of the ingredient in the formulation.
        constraints: "enum: FRAGRANCE | PRESERVATIVE | COLORANT | SURFACTANT | ACTIVE | OTHER"
      - name: concentration_pct
        type: number
        source: input
        description: Weight-by-weight concentration in percent.
        constraints: "> 0 and <= 100, at most 4 decimal places"
      - name: is_fragrance_allergen
        type: boolean
        source: input
        description: true when the substance is on the fragrance-allergen list subject to label disclosure.
        default: false
      - name: label_disclosed
        type: boolean
        source: input
        description: true when the ingredient is separately named on the label.
        default: false
      - name: is_data_gap_flag
        type: boolean
        source: input
        description: true when the ingredient carries an unresolved toxicological data gap; drives the FULL-review penalty in calculations.substantiation_adequacy_score.
        default: false
      - name: disclosure_required
        type: boolean
        source: computed
        description: Output of calculations.allergen_disclosure_completeness for this row.
        default: false

  - name: SafetySubstantiation
    parent: ProductListing
    common_fields: true
    entity_kind: resource
    fields:
      - name: listing_id
        type: string
        source: system
        description: "FK -> ProductListing.id; taken from the {id} path segment of the create endpoint."
      - name: assessor_name
        type: string
        source: input
        description: Name of the safety assessor who signed the substantiation dossier.
        constraints: "1-200 chars"
      - name: assessment_basis
        type: enum
        source: input
        description: Methodological basis of the dossier.
        constraints: "enum: PRODUCT_SPECIFIC | INGREDIENT_READ_ACROSS | PANEL_MONOGRAPH"
      - name: status
        type: enum
        source: system
        description: Dossier lifecycle (see state_machines.SafetySubstantiation).
        default: DRAFT
        constraints: "enum: DRAFT | SUBMITTED | ADEQUATE | DEFICIENT | REVALIDATION_REQUIRED | SUPERSEDED"
      - name: review_mode
        type: enum
        source: system
        description: Variant selector recorded from the most recent review-decision call.
        default: null
        constraints: "enum: SCREENING | FULL | null"
      - name: adequacy_score
        type: number
        source: computed
        description: Output of calculations.substantiation_adequacy_score under review_mode; null until the first decision.
        default: null
        constraints: "2 decimals, 0.00-100.00"
      - name: screening_reviewer_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the reviewer that issued the SCREENING decision; null when never screened.
        default: null
      - name: full_reviewer_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the reviewer that issued the FULL decision; null when never fully reviewed.
        default: null
      - name: revision_round
        type: integer
        source: system
        description: Number of times this dossier has entered SUBMITTED; increments on every submit including re-submits after DEFICIENT or REVALIDATION_REQUIRED.
        default: 0
        constraints: "0-99"
      - name: data_gap_present
        type: boolean
        source: computed
        description: true iff any ProductIngredient with listing_id == this.listing_id has is_data_gap_flag == true.
        default: false
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent review-decision; null before the first decision.
        default: null

  - name: ToxicologicalReviewItem
    parent: SafetySubstantiation
    common_fields: true
    entity_kind: resource
    fields:
      - name: substantiation_id
        type: string
        source: system
        description: "FK -> SafetySubstantiation.id; taken from the {id} path segment."
      - name: evidence_type
        type: enum
        source: input
        description: Class of toxicological evidence supplied.
        constraints: "enum: CLINICAL_SAFETY_STUDY | IN_VITRO_TOXICOLOGY | READ_ACROSS_ANALOG | HISTORICAL_USE_DOSSIER | LITERATURE_REVIEW"
      - name: reviewer_credential
        type: enum
        source: input
        description: Credential of the toxicologist attesting to this evidence item.
        constraints: "enum: BOARD_CERTIFIED_TOXICOLOGIST | ERT | QUALIFIED_SAFETY_ASSESSOR | OTHER"
      - name: citation
        type: string
        source: input
        description: Bibliographic or dossier citation for the evidence item.
        constraints: "1-300 chars"
      - name: screening_contribution
        type: number
        source: computed
        description: Per-item contribution under the SCREENING variant of calculations.substantiation_adequacy_score.
        default: 0.00
        constraints: "2 decimals"
      - name: full_contribution
        type: number
        source: computed
        description: Per-item contribution under the FULL variant of calculations.substantiation_adequacy_score, before the per-evidence_type cap is applied.
        default: 0.00
        constraints: "2 decimals"

  - name: AdverseEvent
    parent: ProductListing
    common_fields: true
    entity_kind: resource
    fields:
      - name: listing_id
        type: string
        source: system
        description: "FK -> ProductListing.id; taken from the {id} path segment."
      - name: event_description
        type: string
        source: input
        description: Narrative of the reported health effect.
        constraints: "1-1000 chars"
      - name: received_at
        type: datetime
        source: input
        description: Instant the responsible person received the report; must not exceed the logical clock.
        constraints: "ISO 8601 UTC"
      - name: seriousness
        type: enum
        source: input
        description: Seriousness classification at intake; may be raised once by the reclassify endpoint.
        constraints: "enum: SERIOUS | NON_SERIOUS"
      - name: outcome_code
        type: enum
        source: input
        description: Coded clinical outcome.
        constraints: "enum: DEATH | HOSPITALIZATION | DISFIGUREMENT | SERIOUS_PERSISTENT | INFECTION | NONE"
      - name: report_status
        type: enum
        source: system
        description: Reporting lifecycle (see state_machines.AdverseEvent).
        default: RECORDED
        constraints: "enum: RECORDED | RETAINED | REPORT_DUE | REPORTED_TIMELY | REPORTED_LATE | REPORT_OVERDUE"
      - name: deadline_basis_at
        type: datetime
        source: system
        description: received_at for events intaken as SERIOUS; reclassified_at for events raised to SERIOUS later. Null for NON_SERIOUS events.
        default: null
      - name: deadline_at
        type: datetime
        source: computed
        description: Output of calculations.serious_event_report_deadline over deadline_basis_at; null for NON_SERIOUS events.
        default: null
      - name: reclassified_at
        type: datetime
        source: system
        description: Logical-clock instant at which seriousness was raised to SERIOUS; null when never reclassified.
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant the report was transmitted; null until reported.
        default: null
      - name: lateness_days
        type: integer
        source: computed
        description: max(0, calendar-date difference between date(deadline_at) and date(submitted_at)); 0 while unreported.
        default: 0
        constraints: ">= 0"
      - name: event_points
        type: number
        source: computed
        description: Per-event contribution from calculations.facility_serious_event_points; 0.00 for NON_SERIOUS and for SERIOUS events still in REPORT_DUE.
        default: 0.00
        constraints: "2 decimals"
      - name: retention_until
        type: datetime
        source: computed
        description: >
          date(received_at) plus RETENTION_YEARS_SERIOUS_OR_PROFESSIONAL (6) when seriousness == SERIOUS
          or the event's listing has professional_use_only == true, else plus RETENTION_YEARS_CONSUMER (3).
          Rebased on received_at, never on reclassified_at.
        constraints: "date-only ISO 8601"

  - name: InspectionEngagement
    parent: Facility
    common_fields: true
    entity_kind: resource
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; taken from the {id} path segment."
      - name: inspection_type
        type: enum
        source: input
        description: Nature of the GMP engagement; drives the same-type buffer in validations[priority=42].
        constraints: "enum: GMP_ROUTINE | FOR_CAUSE | PREANNOUNCED_FOLLOWUP"
      - name: window_start
        type: datetime
        source: input
        description: First day of the on-site window, inclusive (half-open interval [window_start, window_end)).
        constraints: "date-only ISO 8601"
      - name: window_end
        type: datetime
        source: input
        description: Exclusive upper bound of the on-site window; window_start < window_end required.
        constraints: "date-only ISO 8601"
      - name: status
        type: enum
        source: system
        description: Engagement lifecycle (see state_machines.InspectionEngagement).
        default: SCHEDULED
        constraints: "enum: SCHEDULED | OBSERVATIONS_ISSUED | RESPONSE_SUBMITTED | CLOSED_NAI | CLOSED_VAI | ESCALATED_OAI"
      - name: observation_count
        type: integer
        source: computed
        description: Number of observation objects supplied on the observations call.
        default: 0
        constraints: ">= 0"
      - name: category_subscores
        type: object
        source: computed
        description: "Map of the five GMP categories to their 2-decimal subscores from calculations.gmp_readiness_score; keys: PERSONNEL, PREMISES, EQUIPMENT, RAW_MATERIALS, RECORDKEEPING."
        default: null
      - name: readiness_score
        type: number
        source: computed
        description: Output of calculations.gmp_readiness_score; null until observations are issued.
        default: null
        constraints: "2 decimals, 0.00-100.00"
      - name: outcome_class
        type: enum
        source: computed
        description: NAI when readiness_score >= 85.00, VAI when 70.00 <= readiness_score < 85.00, OAI when readiness_score < 70.00; null until observations are issued.
        default: null
        constraints: "enum: NAI | VAI | OAI | null"
      - name: response_due_at
        type: datetime
        source: computed
        description: Observation-issuance instant plus RESPONSE_WINDOW_DAYS (15), truncated to 23:59:59.999Z of that day; null when the engagement closed NAI without observations.
        default: null
      - name: response_submitted_at
        type: datetime
        source: system
        description: Logical-clock instant the facility's written response was accepted; null until submitted.
        default: null
      - name: response_summary
        type: string
        source: input
        description: Corrective-action narrative supplied with the facility's response.
        default: null

  - name: RecallAction
    parent: ProductListing
    common_fields: true
    entity_kind: resource
    fields:
      - name: listing_id
        type: string
        source: system
        description: "FK -> ProductListing.id; taken from the {id} path segment."
      - name: initiation_basis
        type: enum
        source: input
        description: Whether the action was ordered by the agency or offered voluntarily.
        constraints: "enum: MANDATORY_ORDER | VOLUNTARY_NOTICE"
      - name: hazard_class
        type: enum
        source: input
        description: Health-hazard classification of the recalled product.
        constraints: "enum: CLASS_I | CLASS_II | CLASS_III"
      - name: status
        type: enum
        source: system
        description: Recall lifecycle including the plan-revision cycle (see state_machines.RecallAction).
        default: PLAN_REQUIRED
        constraints: "enum: PLAN_REQUIRED | PLAN_SUBMITTED | PLAN_REJECTED | PLAN_ACCEPTED | EXECUTING | EXTENDED | CLOSED_EFFECTIVE | ESCALATED_MANDATORY"
      - name: plan_round
        type: integer
        source: system
        description: Number of plan submissions made; increments on every plan call and is capped by MAX_PLAN_ROUNDS (3).
        default: 0
        constraints: "0-3"
      - name: corrective_summary
        type: string
        source: input
        description: Narrative of the most recently submitted recall plan.
        default: null
      - name: distribution_depth
        type: enum
        source: input
        description: Depth to which the most recently submitted plan reaches the distribution chain.
        default: null
        constraints: "enum: WHOLESALE | RETAIL | CONSUMER | null"
      - name: plan_submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent plan submission; null before the first plan.
        default: null
      - name: plan_decision_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the EnforcementOfficer that issued the most recent plan-decision; segregation input for validations[priority=30].
        default: null
      - name: plan_decision_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent plan-decision; null before the first decision.
        default: null
      - name: effectiveness_rate_final
        type: number
        source: computed
        description: verified_recovery_rate of the MarketWithdrawal whose VERIFIED_BASIS effectiveness-check most recently drove this recall out of EXECUTING; null until then.
        default: null
        constraints: "2 decimals, 0.00-100.00"
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no type prefix; identity only.
      - name: version
        type: integer
        source: system
        description: Starts at 1, increments by exactly 1 on every mutation; OCC target for concurrency_rules.withdrawal-create-stale-recall.
        default: 1

  - name: MarketWithdrawal
    parent: RecallAction
    common_fields: true
    entity_kind: resource
    fields:
      - name: recall_action_id
        type: string
        source: system
        description: "FK -> RecallAction.id; taken from the {id} path segment of the create endpoint."
      - name: scope_depth
        type: enum
        source: input
        description: Distribution depth this withdrawal execution covers.
        constraints: "enum: WHOLESALE | RETAIL | CONSUMER"
      - name: status
        type: enum
        source: system
        description: Execution lifecycle (see state_machines.MarketWithdrawal).
        default: OPEN
        constraints: "enum: OPEN | RECORDS_PRODUCED | INTERIM_REVIEWED | CLOSED_EFFECTIVE | EXTENDED_INEFFECTIVE | SUPERSEDED"
      - name: records_produced_count
        type: integer
        source: computed
        description: Count of DistributionRecord rows with withdrawal_id == this.id.
        default: 0
        constraints: ">= 0"
      - name: shipped_units_total
        type: integer
        source: computed
        description: Sum of DistributionRecord.units_shipped over rows with withdrawal_id == this.id.
        default: 0
        constraints: ">= 0"
      - name: reported_recovered_units
        type: integer
        source: computed
        description: Sum of (units_reported_returned + units_reported_destroyed + units_in_transit_returns) over rows with withdrawal_id == this.id.
        default: 0
        constraints: ">= 0"
      - name: verified_recovered_units
        type: integer
        source: computed
        description: Sum of (units_verified_returned + units_verified_destroyed) over rows with withdrawal_id == this.id.
        default: 0
        constraints: ">= 0"
      - name: outstanding_units_total
        type: integer
        source: computed
        description: Sum of DistributionRecord.units_outstanding over rows with withdrawal_id == this.id.
        default: 0
        constraints: ">= 0"
      - name: reported_recovery_rate
        type: number
        source: computed
        description: REPORTED_BASIS variant output of calculations.withdrawal_recovery_rate; null until an interim check runs.
        default: null
        constraints: "2 decimals, 0.00-100.00"
      - name: provisional_verified_rate
        type: number
        source: computed
        description: Step-1 provisional rate of the VERIFIED_BASIS variant, retained because the unreachable-credit tier is keyed on it and never on the final rate.
        default: null
        constraints: "2 decimals, 0.00-100.00"
      - name: unreachable_credit_pct
        type: integer
        source: computed
        description: Step-2 tier percentage selected from provisional_verified_rate.
        default: null
        constraints: "one of 0, 3, 6"
      - name: adjusted_denominator_units
        type: integer
        source: computed
        description: Step-3 denominator, shipped_units_total minus floor(shipped_units_total * unreachable_credit_pct / 100).
        default: null
        constraints: ">= 0"
      - name: verified_recovery_rate
        type: number
        source: computed
        description: Step-4 VERIFIED_BASIS output of calculations.withdrawal_recovery_rate; null until a verified check runs.
        default: null
        constraints: "2 decimals, 0.00-100.00"
      - name: effectiveness_verdict
        type: enum
        source: computed
        description: EFFECTIVE iff verified_recovery_rate >= 90.00, else NOT_EFFECTIVE; null until a VERIFIED_BASIS check runs.
        default: null
        constraints: "enum: EFFECTIVE | NOT_EFFECTIVE | null"
      - name: effectiveness_reviewer_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the EnforcementOfficer that ran the most recent effectiveness-check; segregation input for validations[priority=30].
        default: null

  - name: DistributionRecord
    parent: ProductListing
    common_fields: true
    entity_kind: resource
    fields:
      - name: listing_id
        type: string
        source: system
        description: "FK -> ProductListing.id; taken from the {id} path segment of the create endpoint."
      - name: withdrawal_id
        type: string
        source: system
        description: "FK -> MarketWithdrawal.id; null until a records-production call links this record, cleared back to null when that withdrawal is SUPERSEDED."
        default: null
      - name: lot_code
        type: string
        source: input
        description: Manufacturing lot identifier; scopes the closed-closed window conflict rule and the lot capacity ceiling.
        constraints: "1-40 chars"
      - name: consignee_name
        type: string
        source: input
        description: Name of the receiving trade customer.
        constraints: "1-200 chars"
      - name: consignee_class
        type: enum
        source: input
        description: Tier of the receiving customer in the distribution chain.
        constraints: "enum: WHOLESALE | RETAIL | CONSUMER"
      - name: ship_date
        type: datetime
        source: input
        description: First day of the distribution window, inclusive.
        constraints: "date-only ISO 8601"
      - name: delivery_date
        type: datetime
        source: input
        description: Last day of the distribution window, inclusive (closed-closed semantics); ship_date <= delivery_date required.
        constraints: "date-only ISO 8601"
      - name: units_shipped
        type: integer
        source: input
        description: Units released to the consignee.
        constraints: "> 0"
      - name: units_reported_returned
        type: integer
        source: system
        description: Consignee-asserted returned units, accumulated by REPORTED_RETURN recovery entries.
        default: 0
        constraints: ">= 0"
      - name: units_reported_destroyed
        type: integer
        source: system
        description: Consignee-asserted destroyed units, accumulated by REPORTED_DESTRUCTION recovery entries.
        default: 0
        constraints: ">= 0"
      - name: units_in_transit_returns
        type: integer
        source: system
        description: Units asserted to be in transit back, accumulated by IN_TRANSIT_RETURN recovery entries.
        default: 0
        constraints: ">= 0"
      - name: units_verified_returned
        type: integer
        source: system
        description: Units whose physical return was verified, accumulated by VERIFIED_RETURN recovery entries.
        default: 0
        constraints: ">= 0"
      - name: units_verified_destroyed
        type: integer
        source: system
        description: Units whose destruction was witnessed, accumulated by VERIFIED_DESTRUCTION recovery entries.
        default: 0
        constraints: ">= 0"
      - name: units_outstanding
        type: integer
        source: computed
        description: units_shipped minus (units_verified_returned + units_verified_destroyed); reported and in-transit buckets never reduce it.
        default: 0
        constraints: ">= 0"

  - name: ComplianceLedgerEntry
    parent: Facility
    common_fields: false
    entity_kind: event
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; the facility whose compliance history the entry belongs to."
      - name: entry_type
        type: enum
        source: system
        description: Class of recorded fact.
        constraints: "enum: POSTURE_CHANGE | UNIT_MOVEMENT | STATE_TRANSITION | DEADLINE_BREACH | ADVERSE_EVENT_REPORT | INSPECTION_OUTCOME | RECALL_DECISION | WITHDRAWAL_CLOSURE | OWNERSHIP_CHANGE"
      - name: subject_entity
        type: string
        source: system
        description: Polymorphic discriminator naming the entity type of subject_id; one of Facility, ProductListing, AdverseEvent, InspectionEngagement, RecallAction, MarketWithdrawal, DistributionRecord, OwnershipChangeUpdate.
      - name: subject_id
        type: string
        source: system
        description: Polymorphic pointer resolved as <subject_entity>.id; not a declared foreign key because the target type varies per row.
      - name: signed_units_delta
        type: integer
        source: system
        description: Signed unit movement for UNIT_MOVEMENT entries (positive when units become verified-recovered, negative on reversal); 0 for all other entry_types.
        default: 0
      - name: posture_before
        type: enum
        source: system
        description: compliance_posture immediately before the recorded fact; null for non-POSTURE_CHANGE entries.
        default: null
        constraints: "enum: OPEN | RESTRICTED | FROZEN | null"
      - name: posture_after
        type: enum
        source: system
        description: compliance_posture immediately after the recorded fact; null for non-POSTURE_CHANGE entries.
        default: null
        constraints: "enum: OPEN | RESTRICTED | FROZEN | null"
      - name: detail
        type: string
        source: system
        description: Human-readable description of the recorded fact.
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant of the recorded fact.
      - name: sequence_no
        type: integer
        source: system
        description: 1-based per-facility monotonic counter assigned in append order; the ledger is append-only, so no update or delete endpoint exists.
        constraints: ">= 1"
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no type prefix; identity only.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC with three fractional digits.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Facility
    initial_state: DRAFT
    terminal_states: [REJECTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /cosmetics/facilities/{id}/submit-registration"
        actor: FacilityRegistrant
        preconditions:
          - "registration_status == DRAFT"
          - "facility_name, owner_operator_name, facility_type, country_code, state_or_province all non-blank"
        side_effects:
          - "sets registration_status = PENDING_REVIEW"
          - "increments Facility.version by 1"
      - from: PENDING_REVIEW
        to: REGISTERED
        trigger: "POST /cosmetics/facilities/{id}/registration-decision with decision = APPROVE"
        actor: RegulatoryReviewer
        preconditions:
          - "registration_status == PENDING_REVIEW"
        side_effects:
          - "mints facility_fei as FEI- plus the 6-digit zero-padded ordinal of this facility among all approved facilities ordered by Facility.created_at ASC"
          - "creates RegistrationPeriod{period_kind: INITIAL, period_start: date(logical clock now), period_end: per calculations.registration_period_bounds, sequence_index: 1, status: ACTIVE}"
          - "increments registration_cycle_count by 1"
          - "recomputes current_period_start, current_period_end, renewal_window_open_date, grace_end_date from the ACTIVE period"
          - "recomputes compliance_posture per calculations.facility_compliance_posture (OPEN)"
          - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION, subject_entity: Facility, subject_id: facility.id, detail: 'registration approved'}"
          - "increments Facility.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /cosmetics/facilities/{id}/registration-decision with decision = REJECT"
        actor: RegulatoryReviewer
        preconditions:
          - "registration_status == PENDING_REVIEW"
        side_effects:
          - "sets registration_status = REJECTED (terminal; no listing may ever be created against this facility)"
          - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION, subject_entity: Facility}"
          - "increments Facility.version by 1"
      - from: REGISTERED
        to: RENEWAL_DUE
        trigger: "POST /cosmetics/_ops/compliance-sweep (step 1)"
        actor: system
        preconditions:
          - "registration_status == REGISTERED"
          - "date(logical clock now) >= renewal_window_open_date"
          - "date(logical clock now) <= current_period_end"
        side_effects:
          - "sets registration_status = RENEWAL_DUE"
          - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION, subject_entity: Facility, detail: 'renewal window open'}"
          - "increments Facility.version by 1"
        note: "Advisory only — RENEWAL_DUE does not gate listing operations; validations[priority=20] admits both REGISTERED and RENEWAL_DUE."
      - from: REGISTERED
        to: LAPSED
        trigger: "POST /cosmetics/_ops/compliance-sweep (step 1)"
        actor: system
        preconditions:
          - "registration_status IN {REGISTERED, RENEWAL_DUE}"
          - "date(logical clock now) > current_period_end"
        side_effects:
          - "CASCADE hop 1 — sets registration_status = LAPSED and recomputes compliance_posture, which becomes FROZEN because calculations.facility_compliance_posture forces FROZEN while registration_status == LAPSED"
          - "CASCADE hop 2 — caused by hop 1: every ProductListing with facility_id == this facility and listing_status IN {SUBMITTED, LISTED} moves to SUSPENDED with suspension_reason = FACILITY_LAPSED, processed in ascending ProductListing.created_at order"
          - "CASCADE hop 3 — caused by hop 2: for each listing suspended in hop 2, its ResponsiblePerson.active_designation_count is decremented by 1"
          - "CASCADE hop 4 — caused by hop 3: any ResponsiblePerson whose active_designation_count reached 0 in hop 3 flips status to DORMANT"
          - "recomputes facility.listed_product_count and each affected listing's marketable flag (false)"
          - "sets the ACTIVE RegistrationPeriod.status = EXPIRED"
          - "appends ComplianceLedgerEntry{entry_type: POSTURE_CHANGE, posture_before, posture_after: FROZEN} then one STATE_TRANSITION entry per suspended listing, in the same hop-2 order"
          - "increments Facility.version by 1 and each touched ProductListing.version / ResponsiblePerson.version by 1"
      - from: RENEWAL_DUE
        to: LAPSED
        trigger: "POST /cosmetics/_ops/compliance-sweep (step 1)"
        actor: system
        preconditions:
          - "registration_status == RENEWAL_DUE"
          - "date(logical clock now) > current_period_end"
        side_effects:
          - "identical four-hop cascade to the REGISTERED -> LAPSED transition above"
      - from: RENEWAL_DUE
        to: REGISTERED
        trigger: "POST /cosmetics/facilities/{id}/renewals"
        actor: FacilityRegistrant
        preconditions:
          - "registration_status IN {REGISTERED, RENEWAL_DUE, LAPSED}"
          - "date(logical clock now) >= renewal_window_open_date, else ERR_RENEWAL_WINDOW_NOT_OPEN"
          - "date(logical clock now) <= grace_end_date, else ERR_GRACE_PERIOD_EXPIRED"
          - "when renewal_kind == ABBREVIATED: abbreviated_renewal_eligible == true, else ERR_ABBREVIATED_RENEWAL_NOT_ELIGIBLE"
        side_effects:
          - "sets the ACTIVE RegistrationPeriod.status = EXPIRED"
          - "creates RegistrationPeriod{period_kind: RENEWAL when date(now) <= prior period_end else LATE_RENEWAL, period_start: prior period_end + 1 day, period_end: per calculations.registration_period_bounds, sequence_index: prior + 1, status: ACTIVE}"
          - "increments registration_cycle_count by 1; sets registration_status = REGISTERED"
          - "recomputes current_period_start/current_period_end/renewal_window_open_date/grace_end_date and compliance_posture"
          - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION, subject_entity: Facility, detail: 'renewal accepted'}"
          - "increments Facility.version by 1"
      - from: REGISTERED
        to: REGISTERED
        trigger: "POST /cosmetics/facilities/{id}/renewals (renewal window already open but the sweep has not yet flipped the status)"
        actor: FacilityRegistrant
        preconditions:
          - "registration_status == REGISTERED"
          - "date(logical clock now) >= renewal_window_open_date"
        side_effects:
          - "same period-minting side effects as the RENEWAL_DUE -> REGISTERED transition; the cycle re-enters REGISTERED with registration_cycle_count incremented"
      - from: LAPSED
        to: REGISTERED
        trigger: "POST /cosmetics/facilities/{id}/renewals inside the grace window"
        actor: FacilityRegistrant
        preconditions:
          - "registration_status == LAPSED"
          - "date(logical clock now) <= grace_end_date, else ERR_GRACE_PERIOD_EXPIRED"
        side_effects:
          - "mints the successor RegistrationPeriod with period_kind = LATE_RENEWAL and period_start = prior period_end + 1 day (gap-free, closed-closed)"
          - "sets registration_status = REGISTERED and recomputes compliance_posture (FROZEN lifts unless points or an escalation still hold it)"
          - "COMPENSATION cascade, hop 1 -> hop 3: every ProductListing of this facility with listing_status == SUSPENDED AND suspension_reason == FACILITY_LAPSED returns to LISTED with suspension_reason = null (hop 1), which re-increments its ResponsiblePerson.active_designation_count (hop 2), which flips any DORMANT ResponsiblePerson back to ACTIVE (hop 3)"
          - "recomputes facility.listed_product_count and each restored listing's marketable flag"
          - "appends ComplianceLedgerEntry{entry_type: POSTURE_CHANGE} plus one STATE_TRANSITION entry per restored listing, in ascending ProductListing.created_at order"
          - "increments Facility.version by 1"
        note: "Listings suspended with suspension_reason = RECALL_ESCALATION are NOT restored — the conditional cascade only touches FACILITY_LAPSED suspensions."

  - entity: ProductListing
    initial_state: DRAFT
    terminal_states: [DELISTED]
    shape: parallel
    parallel_dimensions:
      listing_status:
        initial: DRAFT
        terminal: [DELISTED]
        note: "Submission/marketing dimension."
      safety_status:
        initial: UNSUBSTANTIATED
        terminal: []
        note: "Substantiation dimension; advances only through SafetySubstantiation transitions and posture cascades, never through listing-decision calls."
    transitions:
      - dimension: listing_status
        from: DRAFT
        to: SUBMITTED
        trigger: "POST /cosmetics/listings/{id}/submit"
        actor: ResponsiblePersonAgent
        preconditions:
          - "listing_status IN {DRAFT, RETURNED}"
          - "parent Facility.registration_status IN {REGISTERED, RENEWAL_DUE}, else ERR_FACILITY_NOT_REGISTERED"
          - "parent Facility.compliance_posture != FROZEN, else ERR_FACILITY_POSTURE_FROZEN"
          - "safety_status == SUBSTANTIATED, else ERR_SUBSTANTIATION_NOT_ADEQUATE"
          - "allergen_disclosure_complete == true, else ERR_ALLERGEN_DISCLOSURE_INCOMPLETE"
          - "professional_use_only == false OR professional_use_statement_present == true, else ERR_PROFESSIONAL_USE_LABEL_REQUIRED"
          - "ResponsiblePerson.active_designation_count < ResponsiblePerson.designation_cap, else ERR_DESIGNATION_CAP_EXCEEDED"
        side_effects:
          - "sets listing_status = SUBMITTED"
          - "increments ResponsiblePerson.active_designation_count by 1 and sets ResponsiblePerson.status = ACTIVE"
          - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION, subject_entity: ProductListing}"
          - "increments ProductListing.version and ResponsiblePerson.version by 1"
      - dimension: listing_status
        from: RETURNED
        to: SUBMITTED
        trigger: "POST /cosmetics/listings/{id}/submit (resubmission after a RETURN decision)"
        actor: ResponsiblePersonAgent
        preconditions:
          - "identical to the DRAFT -> SUBMITTED preconditions"
        side_effects:
          - "identical to the DRAFT -> SUBMITTED side effects; this edge closes the submit/return cycle"
      - dimension: listing_status
        from: SUBMITTED
        to: LISTED
        trigger: "POST /cosmetics/listings/{id}/listing-decision with decision = LIST"
        actor: RegulatoryReviewer
        preconditions:
          - "listing_status == SUBMITTED"
          - "parent Facility.compliance_posture != FROZEN, else ERR_FACILITY_POSTURE_FROZEN"
        side_effects:
          - "mints listing_number as CPL- plus the 6-digit zero-padded ordinal of this listing among all listed listings ordered by ProductListing.created_at ASC (only on the first LIST decision; a relisting keeps the original number)"
          - "increments parent Facility.listed_product_count by 1"
          - "recomputes marketable"
          - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION, subject_entity: ProductListing}"
          - "increments ProductListing.version by 1"
      - dimension: listing_status
        from: SUBMITTED
        to: RETURNED
        trigger: "POST /cosmetics/listings/{id}/listing-decision with decision = RETURN"
        actor: RegulatoryReviewer
        preconditions:
          - "listing_status == SUBMITTED"
        side_effects:
          - "sets listing_status = RETURNED"
          - "decrements ResponsiblePerson.active_designation_count by 1 and sets ResponsiblePerson.status = DORMANT when it reaches 0"
          - "increments ProductListing.version and ResponsiblePerson.version by 1"
      - dimension: listing_status
        from: LISTED
        to: SUSPENDED
        trigger: "system cascade hop 2 of Facility REGISTERED/RENEWAL_DUE -> LAPSED, or hop 2 of RecallAction PLAN_SUBMITTED -> ESCALATED_MANDATORY"
        actor: system
        preconditions:
          - "listing_status IN {SUBMITTED, LISTED}"
        side_effects:
          - "sets suspension_reason = FACILITY_LAPSED (facility cascade) or RECALL_ESCALATION (recall cascade)"
          - "decrements ResponsiblePerson.active_designation_count by 1, which flips ResponsiblePerson.status to DORMANT at 0"
          - "decrements parent Facility.listed_product_count by 1 when the prior status was LISTED"
          - "recomputes marketable (false)"
      - dimension: listing_status
        from: SUSPENDED
        to: LISTED
        trigger: "system compensation cascade of Facility LAPSED -> REGISTERED (late renewal)"
        actor: system
        preconditions:
          - "listing_status == SUSPENDED"
          - "suspension_reason == FACILITY_LAPSED (RECALL_ESCALATION suspensions are excluded)"
        side_effects:
          - "sets suspension_reason = null, re-increments ResponsiblePerson.active_designation_count, re-increments Facility.listed_product_count, recomputes marketable"
      - dimension: listing_status
        from: LISTED
        to: DELISTED
        trigger: "POST /cosmetics/listings/{id}/delist"
        actor: ResponsiblePersonAgent | EnforcementOfficer
        preconditions:
          - "listing_status IN {LISTED, SUSPENDED, RETURNED}"
          - "open_recall_count == 0, else ERR_OPEN_RECALL_BLOCKS_DELIST"
        side_effects:
          - "sets listing_status = DELISTED (terminal) and suspension_reason = null"
          - "decrements ResponsiblePerson.active_designation_count by 1 when the prior status was SUBMITTED or LISTED, flipping status to DORMANT at 0"
          - "decrements parent Facility.listed_product_count by 1 when the prior status was LISTED"
          - "recomputes marketable (false)"
      - dimension: safety_status
        from: UNSUBSTANTIATED
        to: UNDER_SUBSTANTIATION
        trigger: "POST /cosmetics/substantiations/{id}/submit"
        actor: ResponsiblePersonAgent
        preconditions:
          - "the submitted SafetySubstantiation.listing_id == this listing"
        side_effects:
          - "sets safety_status = UNDER_SUBSTANTIATION; recomputes marketable"
      - dimension: safety_status
        from: UNDER_SUBSTANTIATION
        to: SUBSTANTIATED
        trigger: "POST /cosmetics/substantiations/{id}/review-decision resulting in ADEQUATE"
        actor: RegulatoryReviewer
        preconditions:
          - "calculations.substantiation_adequacy_score under the supplied review_mode >= ADEQUACY_PASS (60.00)"
        side_effects:
          - "sets safety_status = SUBSTANTIATED; recomputes marketable"
      - dimension: safety_status
        from: UNDER_SUBSTANTIATION
        to: SUBSTANTIATION_FAILED
        trigger: "POST /cosmetics/substantiations/{id}/review-decision resulting in DEFICIENT"
        actor: RegulatoryReviewer
        preconditions:
          - "calculations.substantiation_adequacy_score under the supplied review_mode < ADEQUACY_PASS (60.00)"
        side_effects:
          - "sets safety_status = SUBSTANTIATION_FAILED; recomputes marketable (false). listing_status is untouched — a LISTED product stays LISTED and merely becomes non-marketable."
      - dimension: safety_status
        from: SUBSTANTIATED
        to: REVALIDATION_REQUIRED
        trigger: "system cascade hop 3 of any posture escalation from OPEN to RESTRICTED or FROZEN"
        actor: system
        preconditions:
          - "safety_status == SUBSTANTIATED"
          - "a SafetySubstantiation with status == ADEQUATE exists for this listing"
        side_effects:
          - "sets safety_status = REVALIDATION_REQUIRED and the ADEQUATE SafetySubstantiation.status = REVALIDATION_REQUIRED"
          - "recomputes marketable (false)"
      - dimension: safety_status
        from: REVALIDATION_REQUIRED
        to: UNDER_SUBSTANTIATION
        trigger: "POST /cosmetics/substantiations/{id}/submit (revalidation resubmission)"
        actor: ResponsiblePersonAgent
        preconditions:
          - "the resubmitted SafetySubstantiation.status == REVALIDATION_REQUIRED"
        side_effects:
          - "sets safety_status = UNDER_SUBSTANTIATION; closes the substantiation revision cycle"
      - dimension: safety_status
        from: SUBSTANTIATED
        to: UNSUBSTANTIATED
        trigger: "POST /cosmetics/listings/{id}/substantiations (a fresh dossier supersedes the prior one)"
        actor: ResponsiblePersonAgent
        preconditions:
          - "safety_status IN {UNDER_SUBSTANTIATION, SUBSTANTIATED, REVALIDATION_REQUIRED, SUBSTANTIATION_FAILED}"
        side_effects:
          - "every SafetySubstantiation of this listing with status != SUPERSEDED moves to SUPERSEDED"
          - "sets safety_status = UNSUBSTANTIATED and recomputes marketable (false) even when listing_status == LISTED"

  - entity: SafetySubstantiation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cosmetics/substantiations/{id}/submit"
        actor: ResponsiblePersonAgent
        preconditions:
          - "status IN {DRAFT, DEFICIENT, REVALIDATION_REQUIRED}"
          - "at least one ToxicologicalReviewItem exists with substantiation_id == this.id, else ERR_NO_REVIEW_ITEMS"
          - "the listing's parent Facility.compliance_posture != FROZEN, else ERR_FACILITY_POSTURE_FROZEN"
        side_effects:
          - "increments revision_round by 1"
          - "sets ProductListing.safety_status = UNDER_SUBSTANTIATION"
          - "recomputes data_gap_present from the listing's ProductIngredient rows"
          - "increments SafetySubstantiation.version and ProductListing.version by 1"
      - from: SUBMITTED
        to: ADEQUATE
        trigger: "POST /cosmetics/substantiations/{id}/review-decision"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED"
          - "when review_mode == FULL and screening_reviewer_user_id is non-null: X-User-ID != screening_reviewer_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "calculations.substantiation_adequacy_score(review_mode) >= 60.00"
        side_effects:
          - "sets review_mode, adequacy_score, decided_at, and either screening_reviewer_user_id (SCREENING) or full_reviewer_user_id (FULL) to X-User-ID"
          - "writes screening_contribution and full_contribution onto every ToxicologicalReviewItem of this dossier"
          - "sets ProductListing.safety_status = SUBSTANTIATED and recomputes ProductListing.marketable"
          - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION, subject_entity: ProductListing, detail: 'substantiation adequate'}"
          - "increments SafetySubstantiation.version and ProductListing.version by 1"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /cosmetics/substantiations/{id}/review-decision"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED"
          - "calculations.substantiation_adequacy_score(review_mode) < 60.00"
        side_effects:
          - "same bookkeeping fields as the ADEQUATE edge"
          - "sets ProductListing.safety_status = SUBSTANTIATION_FAILED and recomputes marketable"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /cosmetics/substantiations/{id}/submit (revision)"
        actor: ResponsiblePersonAgent
        preconditions:
          - "status == DEFICIENT"
          - "at least one ToxicologicalReviewItem exists"
        side_effects:
          - "increments revision_round by 1; sets ProductListing.safety_status = UNDER_SUBSTANTIATION; closes the review cycle"
      - from: ADEQUATE
        to: REVALIDATION_REQUIRED
        trigger: "system cascade hop 3 of any posture escalation from OPEN to RESTRICTED or FROZEN"
        actor: system
        preconditions:
          - "status == ADEQUATE"
        side_effects:
          - "sets status = REVALIDATION_REQUIRED"
          - "sets ProductListing.safety_status = REVALIDATION_REQUIRED and recomputes marketable (false)"
          - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION, subject_entity: ProductListing, detail: 'revalidation required'}"
      - from: REVALIDATION_REQUIRED
        to: SUBMITTED
        trigger: "POST /cosmetics/substantiations/{id}/submit (revalidation)"
        actor: ResponsiblePersonAgent
        preconditions:
          - "status == REVALIDATION_REQUIRED"
          - "the listing's parent Facility.compliance_posture != FROZEN"
        side_effects:
          - "increments revision_round by 1; sets ProductListing.safety_status = UNDER_SUBSTANTIATION"
      - from: ADEQUATE
        to: SUPERSEDED
        trigger: "POST /cosmetics/listings/{id}/substantiations (a newer dossier is filed for the same listing)"
        actor: ResponsiblePersonAgent
        preconditions:
          - "status != SUPERSEDED"
        side_effects:
          - "sets status = SUPERSEDED (terminal; no further submit or review-decision is accepted)"
          - "sets ProductListing.safety_status = UNSUBSTANTIATED and recomputes marketable"

  - entity: AdverseEvent
    initial_state: RECORDED
    terminal_states: [REPORTED_TIMELY, REPORTED_LATE]
    shape: branching
    transitions:
      - from: RECORDED
        to: RETAINED
        trigger: "POST /cosmetics/listings/{id}/adverse-events with seriousness = NON_SERIOUS (automatic within the create request)"
        actor: system
        preconditions:
          - "seriousness == NON_SERIOUS"
        side_effects:
          - "sets report_status = RETAINED, deadline_basis_at = null, deadline_at = null, event_points = 0.00"
          - "sets retention_until = date(received_at) + 3 years (6 years when the parent ProductListing.professional_use_only == true)"
          - "leaves Facility.serious_event_points and Facility.compliance_posture unchanged"
      - from: RECORDED
        to: REPORT_DUE
        trigger: "POST /cosmetics/listings/{id}/adverse-events with seriousness = SERIOUS (automatic within the create request)"
        actor: system
        preconditions:
          - "seriousness == SERIOUS"
        side_effects:
          - "sets deadline_basis_at = received_at and deadline_at per calculations.serious_event_report_deadline"
          - "increments parent ProductListing.open_serious_event_count and Facility.open_serious_event_count by 1"
          - "sets retention_until = date(received_at) + 6 years"
      - from: RETAINED
        to: REPORT_DUE
        trigger: "POST /cosmetics/adverse-events/{id}/reclassify with seriousness = SERIOUS"
        actor: RegulatoryReviewer | ResponsiblePersonAgent
        preconditions:
          - "report_status == RETAINED"
          - "seriousness == NON_SERIOUS before the call (a SERIOUS -> SERIOUS reclassification is rejected with ERR_INVALID_ADVERSE_EVENT_STATE)"
        side_effects:
          - "sets seriousness = SERIOUS, reclassified_at = logical clock now"
          - "REBASES the clock: deadline_basis_at = reclassified_at (NOT received_at) and deadline_at = per calculations.serious_event_report_deadline on the new basis"
          - "increments ProductListing.open_serious_event_count and Facility.open_serious_event_count by 1"
          - "extends retention_until to date(received_at) + 6 years"
      - from: REPORT_DUE
        to: REPORTED_TIMELY
        trigger: "POST /cosmetics/adverse-events/{id}/report"
        actor: ResponsiblePersonAgent
        preconditions:
          - "report_status IN {REPORT_DUE, REPORT_OVERDUE}"
          - "logical clock now <= deadline_at"
        side_effects:
          - "sets submitted_at = logical clock now, lateness_days = 0"
          - "computes event_points per calculations.facility_serious_event_points with the TIMELY base"
          - "decrements ProductListing.open_serious_event_count and Facility.open_serious_event_count by 1"
          - "recomputes Facility.serious_event_points and Facility.compliance_posture"
          - "appends ComplianceLedgerEntry{entry_type: ADVERSE_EVENT_REPORT, subject_entity: AdverseEvent}"
      - from: REPORT_DUE
        to: REPORTED_LATE
        trigger: "POST /cosmetics/adverse-events/{id}/report"
        actor: ResponsiblePersonAgent
        preconditions:
          - "report_status IN {REPORT_DUE, REPORT_OVERDUE}"
          - "logical clock now > deadline_at"
        side_effects:
          - "CASCADE hop 1 — sets submitted_at, lateness_days = ceil days of (now - deadline_at), event_points per calculations.facility_serious_event_points with the LATE base"
          - "CASCADE hop 2 — caused by hop 1: recomputes Facility.serious_event_points (sum of all per-event points, capped at 100.00) and Facility.compliance_posture, which may escalate OPEN -> RESTRICTED (>= 10.00) or -> FROZEN (>= 25.00)"
          - "CASCADE hop 3 — caused by an escalation in hop 2: every SafetySubstantiation with status == ADEQUATE under any ProductListing of this facility moves to REVALIDATION_REQUIRED, in ascending (ProductListing.created_at, SafetySubstantiation.created_at) order"
          - "CASCADE hop 4 — caused by hop 3: each such ProductListing.safety_status becomes REVALIDATION_REQUIRED and its marketable flag becomes false"
          - "decrements ProductListing.open_serious_event_count and Facility.open_serious_event_count by 1"
          - "appends ComplianceLedgerEntry{entry_type: ADVERSE_EVENT_REPORT} then, only when the posture changed, one POSTURE_CHANGE entry, then one STATE_TRANSITION entry per revalidated listing"
      - from: REPORT_DUE
        to: REPORT_OVERDUE
        trigger: "POST /cosmetics/_ops/compliance-sweep (step 2)"
        actor: system
        preconditions:
          - "report_status == REPORT_DUE"
          - "logical clock now > deadline_at"
        side_effects:
          - "sets lateness_days = ceil days of (now - deadline_at) and event_points per calculations.facility_serious_event_points with the OVERDUE base"
          - "runs the same hop-2 through hop-4 cascade as the REPORTED_LATE edge (points -> posture -> substantiation -> listing)"
          - "leaves open_serious_event_count unchanged — the event is still unreported"
      - from: REPORT_OVERDUE
        to: REPORTED_LATE
        trigger: "POST /cosmetics/adverse-events/{id}/report (catch-up filing)"
        actor: ResponsiblePersonAgent
        preconditions:
          - "report_status == REPORT_OVERDUE"
        side_effects:
          - "recomputes event_points with the LATE base instead of the OVERDUE base, which strictly LOWERS the contribution, then recomputes Facility.serious_event_points and Facility.compliance_posture — a de-escalation from RESTRICTED back to OPEN is possible and does NOT restore any REVALIDATION_REQUIRED substantiation"
          - "decrements ProductListing.open_serious_event_count and Facility.open_serious_event_count by 1"

  - entity: InspectionEngagement
    initial_state: SCHEDULED
    terminal_states: [CLOSED_NAI, CLOSED_VAI, ESCALATED_OAI]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: CLOSED_NAI
        trigger: "POST /cosmetics/facilities/{id}/inspections/{inspection_id}/observations"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SCHEDULED"
          - "calculations.gmp_readiness_score >= NAI_THRESHOLD (85.00)"
        side_effects:
          - "FORK branch A (no-action-indicated): stores category_subscores, readiness_score, observation_count, sets outcome_class = NAI and response_due_at = null"
          - "sets Facility.gmp_readiness_score = readiness_score and Facility.last_inspection_outcome = NAI"
          - "appends ComplianceLedgerEntry{entry_type: INSPECTION_OUTCOME, subject_entity: InspectionEngagement}"
      - from: SCHEDULED
        to: OBSERVATIONS_ISSUED
        trigger: "POST /cosmetics/facilities/{id}/inspections/{inspection_id}/observations"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SCHEDULED"
          - "calculations.gmp_readiness_score < NAI_THRESHOLD (85.00)"
        side_effects:
          - "FORK branch B: stores category_subscores, readiness_score, observation_count, outcome_class = PENDING_RESPONSE"
          - "sets response_due_at = logical clock now + 15 days truncated to 23:59:59.999Z"
          - "sets Facility.gmp_readiness_score = readiness_score; Facility.last_inspection_outcome stays unchanged until the engagement closes"
      - from: OBSERVATIONS_ISSUED
        to: RESPONSE_SUBMITTED
        trigger: "POST /cosmetics/facilities/{id}/inspections/{inspection_id}/response"
        actor: FacilityRegistrant
        preconditions:
          - "status == OBSERVATIONS_ISSUED"
          - "logical clock now <= response_due_at, else ERR_INSPECTION_RESPONSE_WINDOW_CLOSED"
          - "response_summary non-blank"
        side_effects:
          - "sets response_submitted_at = logical clock now and stores response_summary"
          - "the engagement now REJOINS the pending-close queue; the terminal outcome is decided by the sweep, not by this call"
      - from: RESPONSE_SUBMITTED
        to: CLOSED_VAI
        trigger: "POST /cosmetics/_ops/compliance-sweep (step 3, join branch)"
        actor: system
        preconditions:
          - "status == RESPONSE_SUBMITTED"
          - "readiness_score >= VAI_THRESHOLD (70.00)"
        side_effects:
          - "sets outcome_class = VAI and Facility.last_inspection_outcome = VAI"
          - "leaves Facility.compliance_posture unchanged"
          - "appends ComplianceLedgerEntry{entry_type: INSPECTION_OUTCOME}"
      - from: RESPONSE_SUBMITTED
        to: ESCALATED_OAI
        trigger: "POST /cosmetics/_ops/compliance-sweep (step 3, join branch)"
        actor: system
        preconditions:
          - "status == RESPONSE_SUBMITTED"
          - "readiness_score < VAI_THRESHOLD (70.00)"
        side_effects:
          - "CASCADE hop 1 — sets outcome_class = OAI and Facility.last_inspection_outcome = OAI"
          - "CASCADE hop 2 — caused by hop 1: recomputes Facility.compliance_posture, which is forced to at least RESTRICTED by the ESCALATED_OAI clause of calculations.facility_compliance_posture"
          - "CASCADE hop 3 / hop 4 — caused by the hop-2 escalation: ADEQUATE substantiations -> REVALIDATION_REQUIRED and their listings' safety_status -> REVALIDATION_REQUIRED with marketable false"
          - "appends ComplianceLedgerEntry{entry_type: INSPECTION_OUTCOME} then POSTURE_CHANGE then one STATE_TRANSITION per revalidated listing"
      - from: OBSERVATIONS_ISSUED
        to: ESCALATED_OAI
        trigger: "POST /cosmetics/_ops/compliance-sweep (step 3, no-response branch)"
        actor: system
        preconditions:
          - "status == OBSERVATIONS_ISSUED"
          - "logical clock now > response_due_at (the registrant never responded)"
        side_effects:
          - "identical cascade to the RESPONSE_SUBMITTED -> ESCALATED_OAI edge, regardless of how high readiness_score was"

  - entity: RecallAction
    initial_state: PLAN_REQUIRED
    terminal_states: [CLOSED_EFFECTIVE, ESCALATED_MANDATORY]
    shape: cyclic
    transitions:
      - from: PLAN_REQUIRED
        to: PLAN_SUBMITTED
        trigger: "POST /cosmetics/recall-actions/{id}/plan"
        actor: ResponsiblePersonAgent
        preconditions:
          - "status IN {PLAN_REQUIRED, PLAN_REJECTED}"
          - "plan_round < MAX_PLAN_ROUNDS (3), else ERR_RECALL_PLAN_ROUNDS_EXHAUSTED"
          - "corrective_summary non-blank and distribution_depth IN {CONSUMER, RETAIL, WHOLESALE}"
        side_effects:
          - "increments plan_round by 1; sets plan_submitted_at = logical clock now"
          - "increments RecallAction.version by 1"
      - from: PLAN_SUBMITTED
        to: PLAN_ACCEPTED
        trigger: "POST /cosmetics/recall-actions/{id}/plan-decision with decision = ACCEPT"
        actor: EnforcementOfficer
        preconditions:
          - "status == PLAN_SUBMITTED"
        side_effects:
          - "sets plan_decision_user_id = X-User-ID and plan_decision_at = logical clock now — this user is thereafter barred from the withdrawal effectiveness-check on any withdrawal under this recall (segregation of duties)"
          - "appends ComplianceLedgerEntry{entry_type: RECALL_DECISION, subject_entity: RecallAction}"
          - "increments RecallAction.version by 1"
      - from: PLAN_SUBMITTED
        to: PLAN_REJECTED
        trigger: "POST /cosmetics/recall-actions/{id}/plan-decision with decision = REJECT"
        actor: EnforcementOfficer
        preconditions:
          - "status == PLAN_SUBMITTED"
          - "plan_round < MAX_PLAN_ROUNDS (3) OR initiation_basis == VOLUNTARY_NOTICE — a voluntary notice is never escalated to a mandatory recall by rejection alone, so even its third rejection lands here with plan_round == 3"
        side_effects:
          - "sets plan_decision_user_id and plan_decision_at; the sponsor may resubmit, closing the plan cycle"
          - "increments RecallAction.version by 1"
      - from: PLAN_REJECTED
        to: PLAN_SUBMITTED
        trigger: "POST /cosmetics/recall-actions/{id}/plan (revised plan)"
        actor: ResponsiblePersonAgent
        preconditions:
          - "status == PLAN_REJECTED"
          - "plan_round < MAX_PLAN_ROUNDS (3), else ERR_RECALL_PLAN_ROUNDS_EXHAUSTED — a VOLUNTARY_NOTICE recall sitting in PLAN_REJECTED with plan_round == 3 is the state that makes validations[priority=47] reachable"
        side_effects:
          - "increments plan_round by 1 — the cycle admits at most 3 submissions, so this edge can fire at most twice"
      - from: PLAN_SUBMITTED
        to: ESCALATED_MANDATORY
        trigger: "POST /cosmetics/recall-actions/{id}/plan-decision with decision = REJECT while plan_round == MAX_PLAN_ROUNDS (3) and initiation_basis == MANDATORY_ORDER"
        actor: EnforcementOfficer
        preconditions:
          - "status == PLAN_SUBMITTED"
          - "plan_round == 3 (loop-termination condition)"
          - "initiation_basis == MANDATORY_ORDER — only an agency-ordered recall escalates on the third rejection; a VOLUNTARY_NOTICE recall takes the PLAN_REJECTED edge instead and is then frozen out of further submissions by validations[priority=47]"
        side_effects:
          - "CASCADE hop 1 — sets status = ESCALATED_MANDATORY (terminal); no further plan submission is accepted"
          - "CASCADE hop 2 — caused by hop 1: the parent ProductListing moves to SUSPENDED with suspension_reason = RECALL_ESCALATION when its listing_status was SUBMITTED or LISTED"
          - "CASCADE hop 3 — caused by hop 2: the listing's ResponsiblePerson.active_designation_count is decremented and flips to DORMANT at 0"
          - "CASCADE hop 4 — caused by hop 1: the parent Facility.compliance_posture is recomputed to FROZEN by the ESCALATED_MANDATORY clause, which in turn moves every ADEQUATE substantiation of the facility to REVALIDATION_REQUIRED and its listing's safety_status to REVALIDATION_REQUIRED"
          - "appends ComplianceLedgerEntry{entry_type: RECALL_DECISION} then POSTURE_CHANGE then one STATE_TRANSITION per touched listing"
      - from: PLAN_ACCEPTED
        to: EXECUTING
        trigger: "POST /cosmetics/recall-actions/{id}/withdrawals"
        actor: EnforcementOfficer | ResponsiblePersonAgent
        preconditions:
          - "status IN {PLAN_ACCEPTED, EXECUTING, EXTENDED}"
          - "expected_recall_action_version matches RecallAction.version, else ERR_STALE_RECALL_VERSION"
        side_effects:
          - "creates MarketWithdrawal{status: OPEN}; supersedes any prior non-terminal withdrawal of this recall"
          - "increments RecallAction.version by 1"
      - from: EXECUTING
        to: EXECUTING
        trigger: "POST /cosmetics/recall-actions/{id}/withdrawals (a replacement withdrawal round)"
        actor: EnforcementOfficer | ResponsiblePersonAgent
        preconditions:
          - "status == EXECUTING"
        side_effects:
          - "self-loop: the prior withdrawal becomes SUPERSEDED and its DistributionRecord links are released (withdrawal_id = null)"
      - from: EXECUTING
        to: CLOSED_EFFECTIVE
        trigger: "POST /cosmetics/withdrawals/{id}/effectiveness-check with basis = VERIFIED_BASIS yielding EFFECTIVE"
        actor: EnforcementOfficer
        preconditions:
          - "status == EXECUTING"
          - "the withdrawal's verified_recovery_rate >= EFFECTIVENESS_THRESHOLD (90.00)"
        side_effects:
          - "sets effectiveness_rate_final = the withdrawal's verified_recovery_rate; status = CLOSED_EFFECTIVE (terminal)"
          - "decrements parent ProductListing.open_recall_count by 1 and recomputes marketable"
          - "a listing suspended with suspension_reason = RECALL_ESCALATION is NOT restored by this edge"
      - from: EXECUTING
        to: EXTENDED
        trigger: "POST /cosmetics/withdrawals/{id}/effectiveness-check with basis = VERIFIED_BASIS yielding NOT_EFFECTIVE"
        actor: EnforcementOfficer
        preconditions:
          - "status == EXECUTING"
          - "the withdrawal's verified_recovery_rate < EFFECTIVENESS_THRESHOLD (90.00)"
        side_effects:
          - "sets status = EXTENDED; the withdrawal becomes EXTENDED_INEFFECTIVE; open_recall_count is unchanged"
      - from: EXTENDED
        to: EXECUTING
        trigger: "POST /cosmetics/recall-actions/{id}/withdrawals (extended round)"
        actor: EnforcementOfficer | ResponsiblePersonAgent
        preconditions:
          - "status == EXTENDED"
        side_effects:
          - "closes the execution cycle: a new OPEN withdrawal is minted and the EXTENDED_INEFFECTIVE predecessor becomes SUPERSEDED"

  - entity: MarketWithdrawal
    initial_state: OPEN
    terminal_states: [CLOSED_EFFECTIVE, SUPERSEDED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: RECORDS_PRODUCED
        trigger: "POST /cosmetics/withdrawals/{id}/records-production"
        actor: ResponsiblePersonAgent
        preconditions:
          - "status == OPEN"
          - "every distribution_record_id in the payload exists and has listing_id == the recall's listing_id, else ERR_DISTRIBUTION_RECORD_LISTING_MISMATCH"
          - "the payload lists at least one record, else ERR_NO_DISTRIBUTION_RECORDS"
        side_effects:
          - "sets DistributionRecord.withdrawal_id = this withdrawal for every listed record"
          - "sets records_produced_count = count of linked records and shipped_units_total = sum of their units_shipped"
          - "sets outstanding_units_total = shipped_units_total (nothing verified yet) and both recovery rates to 0.00"
      - from: RECORDS_PRODUCED
        to: INTERIM_REVIEWED
        trigger: "POST /cosmetics/withdrawals/{id}/effectiveness-check with basis = REPORTED_BASIS"
        actor: EnforcementOfficer
        preconditions:
          - "status IN {RECORDS_PRODUCED, INTERIM_REVIEWED}"
          - "records_produced_count > 0"
          - "X-User-ID != the parent RecallAction.plan_decision_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "computes reported_recovery_rate per calculations.withdrawal_recovery_rate variant REPORTED_BASIS and stores reported_recovered_units"
          - "sets effectiveness_verdict = INTERIM and effectiveness_reviewer_user_id = X-User-ID"
          - "does NOT touch verified_recovery_rate, the parent RecallAction, or the listing"
      - from: INTERIM_REVIEWED
        to: INTERIM_REVIEWED
        trigger: "POST /cosmetics/withdrawals/{id}/effectiveness-check with basis = REPORTED_BASIS (repeat interim review)"
        actor: EnforcementOfficer
        preconditions:
          - "status == INTERIM_REVIEWED"
        side_effects:
          - "self-loop: recomputes reported_recovery_rate against the current recovery entries; the withdrawal stays reviewable indefinitely under the reported basis"
      - from: RECORDS_PRODUCED
        to: CLOSED_EFFECTIVE
        trigger: "POST /cosmetics/withdrawals/{id}/effectiveness-check with basis = VERIFIED_BASIS"
        actor: EnforcementOfficer
        preconditions:
          - "status IN {RECORDS_PRODUCED, INTERIM_REVIEWED}"
          - "calculations.withdrawal_recovery_rate variant VERIFIED_BASIS >= EFFECTIVENESS_THRESHOLD (90.00)"
          - "X-User-ID != the parent RecallAction.plan_decision_user_id"
        side_effects:
          - "stores provisional_verified_rate, unreachable_credit_pct, adjusted_denominator_units, verified_recovery_rate, verified_recovered_units, outstanding_units_total"
          - "sets effectiveness_verdict = EFFECTIVE and status = CLOSED_EFFECTIVE (terminal)"
          - "moves the parent RecallAction to CLOSED_EFFECTIVE with effectiveness_rate_final = verified_recovery_rate, decrementing ProductListing.open_recall_count"
          - "appends ComplianceLedgerEntry{entry_type: WITHDRAWAL_CLOSURE, subject_entity: MarketWithdrawal}"
      - from: INTERIM_REVIEWED
        to: EXTENDED_INEFFECTIVE
        trigger: "POST /cosmetics/withdrawals/{id}/effectiveness-check with basis = VERIFIED_BASIS"
        actor: EnforcementOfficer
        preconditions:
          - "status IN {RECORDS_PRODUCED, INTERIM_REVIEWED}"
          - "calculations.withdrawal_recovery_rate variant VERIFIED_BASIS < EFFECTIVENESS_THRESHOLD (90.00)"
        side_effects:
          - "stores the same four pinned intermediate fields, sets effectiveness_verdict = NOT_EFFECTIVE and status = EXTENDED_INEFFECTIVE"
          - "moves the parent RecallAction to EXTENDED"
      - from: EXTENDED_INEFFECTIVE
        to: SUPERSEDED
        trigger: "POST /cosmetics/recall-actions/{id}/withdrawals (a successor withdrawal is opened)"
        actor: EnforcementOfficer | ResponsiblePersonAgent
        preconditions:
          - "status IN {OPEN, RECORDS_PRODUCED, INTERIM_REVIEWED, EXTENDED_INEFFECTIVE}"
        side_effects:
          - "sets status = SUPERSEDED (terminal)"
          - "releases every linked DistributionRecord (withdrawal_id = null) so the successor round can re-produce them, and zeroes records_produced_count / shipped_units_total / outstanding_units_total"
          - "the per-record verified unit tallies are preserved on DistributionRecord, so the conservation invariant still balances after the release"

  - entity: OwnershipChangeUpdate
    initial_state: FILED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    shape: branching
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /cosmetics/ownership-changes/{id}/decision with decision = ACCEPT"
        actor: RegulatoryReviewer
        preconditions:
          - "status == FILED"
        side_effects:
          - "sets Facility.owner_operator_name = new_owner_operator_name"
          - "sets Facility.abbreviated_renewal_eligible = false — an accepted ownership change disqualifies the facility from the abbreviated renewal path for the remainder of the current period"
          - "appends ComplianceLedgerEntry{entry_type: OWNERSHIP_CHANGE, subject_entity: OwnershipChangeUpdate}"
          - "increments Facility.version and OwnershipChangeUpdate.version by 1"
      - from: FILED
        to: REJECTED
        trigger: "POST /cosmetics/ownership-changes/{id}/decision with decision = REJECT"
        actor: RegulatoryReviewer
        preconditions:
          - "status == FILED"
        side_effects:
          - "stores decision_note and decided_by_user_id; the facility's owner_operator_name and abbreviated_renewal_eligible are untouched"
      - from: FILED
        to: SUPERSEDED
        trigger: "POST /cosmetics/facilities/{id}/ownership-changes (a newer filing arrives for the same facility)"
        actor: FacilityRegistrant
        preconditions:
          - "status == FILED"
        side_effects:
          - "every FILED update of this facility moves to SUPERSEDED before the new row is inserted, so at most one FILED update exists per facility"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC — the only sanctioned concurrency mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: ownership-change-file-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /cosmetics/facilities/{id}/ownership-changes"
    occ_field: "expected_facility_version"
    description: |
      Filing an ownership change against a facility whose version has advanced since the caller last
      observed it is rejected: the new filing supersedes every FILED update, so a caller working from
      a stale Facility snapshot would discard a filing it never saw.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    contention_shape: create_with_supersede
    serial_observability: |
      Two ownership-change filings against the same facility are BOTH legal in isolation and in
      either order: the facility is REGISTERED, no state precondition distinguishes them, and each
      filing supersedes the previous FILED row. Run serially, filing B after filing A yields two
      rows (A SUPERSEDED, B FILED). Under OCC, an agent that read Facility.version before A's
      filing and then submits B with that stale expected_facility_version must be rejected with
      ERR_STALE_FACILITY_VERSION (412) — the observable difference is that the caller's decision to
      supersede was based on a facility snapshot that no longer exists.
    mechanics:
      - "the caller obtains version from GET /cosmetics/facilities/{id}"
      - "the endpoint compares expected_facility_version against Facility.version and rejects on mismatch before any other business validation except auth, role, 404 and ownership"
      - "on success the endpoint supersedes prior FILED updates, inserts the new update, and increments Facility.version by exactly 1"
      - "a replay of the same request with the now-stale version fails, so the filing is not idempotent"
  - rule_id: transfer-designation-stale-listing
    parent_entity: ProductListing
    write_endpoint: "POST /cosmetics/listings/{id}/transfer-responsible-person"
    occ_field: "expected_listing_version"
    description: |
      Transferring the responsible-person designation on a listing whose version has advanced since
      the caller last observed it is rejected: the designation-slot layout the caller reasoned about
      no longer exists, and applying the move would decrement the wrong ResponsiblePerson.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
    contention_shape: create_with_supersede
    serial_observability: |
      Transferring a listing from responsible person A to B and then from B to C are both legal
      in isolation and in either order (each merely moves one designation slot). Serially, the
      second transfer starts from the designation counts the first left behind. A caller holding a
      pre-transfer expected_listing_version is therefore reasoning about a designation-slot layout
      that has already changed — it must be rejected with ERR_STALE_LISTING_VERSION (412) rather
      than silently decrementing the wrong ResponsiblePerson.
    mechanics:
      - "the caller obtains version from GET /cosmetics/listings/{id}"
      - "the version check runs immediately after the ownership check and before the designation-cap check, so a stale version wins over ERR_DESIGNATION_CAP_EXCEEDED"
      - "on success the outgoing ResponsiblePerson.active_designation_count is decremented (DORMANT at 0), the incoming one incremented (ACTIVE), and ProductListing.version incremented by exactly 1"
  - rule_id: withdrawal-create-stale-recall
    parent_entity: RecallAction
    write_endpoint: "POST /cosmetics/recall-actions/{id}/withdrawals"
    occ_field: "expected_recall_action_version"
    description: |
      Opening a withdrawal round under a recall action whose version has advanced since the caller
      last observed it is rejected: the new round supersedes the predecessor withdrawal and releases
      its distribution-record links, so a stale caller would silently discard produced records.
    error_id: ERR_STALE_RECALL_VERSION
    http_status: 412
    contention_shape: create_with_supersede
    serial_observability: |
      Opening two successive withdrawal rounds under one EXECUTING recall is legal in isolation and
      in either order — each new round supersedes the previous withdrawal and releases its
      distribution-record links. Serially, round 2 supersedes round 1. A caller that read
      RecallAction.version before round 1 was opened and then opens its own round with that stale
      version would silently discard round 1's produced records; OCC rejects it with
      ERR_STALE_RECALL_VERSION (412).
    mechanics:
      - "the caller obtains version from GET /cosmetics/recall-actions/{id}"
      - "the version check precedes the recall-status check, so a stale version wins over ERR_INVALID_RECALL_STATE"
      - "on success the predecessor withdrawal becomes SUPERSEDED, its DistributionRecord.withdrawal_id links are nulled, the new OPEN withdrawal is inserted, and RecallAction.version is incremented by exactly 1"

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: registration_period_bounds
    applies_to: RegistrationPeriod
    algorithm_type: chronological
    trigger: "registration approval (Facility PENDING_REVIEW -> REGISTERED) and every accepted renewal"
    inputs:
      - "period_start (date): date(logical clock now) for an INITIAL period; prior_period.period_end + 1 day for a RENEWAL or LATE_RENEWAL period"
      - "the facility's prior ACTIVE RegistrationPeriod, when one exists"
    formula: |
      anchor_year  = period_start.year + REGISTRATION_TERM_YEARS (2)
      anchor_month = period_start.month
      anchor_day   = min(period_start.day, days_in_month(anchor_year, anchor_month))   # clamps 02-29/31-day rollovers
      period_end   = date(anchor_year, anchor_month, anchor_day) - 1 day               # closed-closed interval
      renewal_window_open_date = period_end - RENEWAL_WINDOW_DAYS (90 days)
      grace_end_date           = period_end + GRACE_PERIOD_DAYS (60 days)
      sequence_index           = 1 for INITIAL, else prior.sequence_index + 1
      period_kind = INITIAL   when no prior period exists
                    RENEWAL   when date(now) <= prior.period_end
                    LATE_RENEWAL when date(now) >  prior.period_end
      Successor periods are contiguous and gap-free: successor.period_start == prior.period_end + 1 day,
      even for a LATE_RENEWAL filed inside the grace window, so the biennial cadence never drifts.
    constants:
      REGISTRATION_TERM_YEARS: 2
      RENEWAL_WINDOW_DAYS: 90
      GRACE_PERIOD_DAYS: 60
    precision: "whole dates; all comparisons use date(logical clock now) in UTC, never the timestamp"
    input_set: "the single ACTIVE RegistrationPeriod of the facility, plus the newly minted one"
    worked_examples:
      - "period_start 2026-08-01 -> period_end 2028-07-31, renewal_window_open_date 2028-05-02, grace_end_date 2028-09-29"
      - "renewal accepted 2028-06-15 (inside the window) -> successor period_start 2028-08-01, period_end 2030-07-31, renewal_window_open_date 2030-05-02, grace_end_date 2030-09-29, period_kind RENEWAL, sequence_index 2"
      - "late renewal accepted 2028-09-10 (after period_end 2028-07-31, inside grace) -> successor period_start 2028-08-01 (still prior end + 1 day), period_end 2030-07-31, period_kind LATE_RENEWAL"
      - "period_start 2026-02-29 in a leap year -> anchor_day min(29, days_in_month(2028, 2) = 29) = 29 -> period_end 2028-02-28"
      - "period_start 2024-08-31 -> anchor 2026-08-31 -> period_end 2026-08-30"

  - name: facility_serious_event_points
    applies_to: Facility
    algorithm_type: weighted_scoring
    difficulty_rule: "R2 mode (a) — per-item rounding before aggregation"
    trigger: "every AdverseEvent report, sweep-driven overdue marking, and reclassification"
    inputs:
      - "AdverseEvent.report_status, AdverseEvent.lateness_days, ProductListing.professional_use_only"
    formula: |
      For EACH AdverseEvent of every ProductListing under the facility whose report_status is in
      {REPORTED_TIMELY, REPORTED_LATE, REPORT_OVERDUE}:
        base            = REPORT_BASE[report_status]
        lateness_factor = min(LATENESS_FACTOR_CAP, 1.0 + LATENESS_STEP * lateness_days)
        professional_relief = PROFESSIONAL_RELIEF_FACTOR when the event's listing has
                              professional_use_only == true, else 1.0
        event_points    = round(base * lateness_factor * professional_relief, 2)   # ROUNDED PER EVENT
      Facility.serious_event_points = min(POINTS_CAP, round(sum(event_points), 2))
      MODE (a) DISCIPLINE: each event's contribution is rounded to 2 decimals FIRST and the rounded
      contributions are then summed. Summing the unrounded products and rounding once at the end is
      wrong and is observably different (see the worked examples).
    constants:
      REPORT_BASE: "{REPORTED_TIMELY: 2, REPORTED_LATE: 5, REPORT_OVERDUE: 9}"
      LATENESS_STEP: 0.1
      LATENESS_FACTOR_CAP: 2.0
      PROFESSIONAL_RELIEF_FACTOR: 0.5
      POINTS_CAP: 100.00
    precision: "2 decimals, ROUND_HALF_UP, per event and again on the sum"
    input_set: "AdverseEvent rows with report_status IN {REPORTED_TIMELY, REPORTED_LATE, REPORT_OVERDUE}; RECORDED, RETAINED and REPORT_DUE rows contribute 0.00"
    worked_examples:
      - "REPORTED_LATE, lateness_days 9, consumer listing -> 5 * min(2.0, 1.9) * 1.0 = 9.50 (posture stays OPEN, 9.50 < 10.00)"
      - "REPORTED_LATE, lateness_days 10, consumer listing -> 5 * 2.0 = 10.00 (posture escalates to RESTRICTED at exactly 10.00)"
      - "REPORTED_LATE, lateness_days 10, professional_use_only listing -> 5 * 2.0 * 0.5 = 5.00"
      - "REPORTED_LATE, lateness_days 1 -> 5 * 1.1 = 5.50"
      - "REPORT_OVERDUE, lateness_days 9 -> 9 * 1.9 = 17.10; the same event later filed late becomes 9.50, a de-escalation"
      - "REPORTED_TIMELY -> 2 * 1.0 = 2.00"
      - "two professional-use REPORTED_LATE events at lateness_days 3 each: per-event round(5 * 1.3 * 0.5, 2) = round(3.25, 2) = 3.25 -> sum 6.50 (identical here) versus a third event at lateness_days 1: round(2.75, 2) = 2.75 -> total 9.25, still OPEN"

  - name: facility_compliance_posture
    applies_to: Facility
    algorithm_type: threshold
    trigger: "any change to serious_event_points, registration_status, inspection outcome_class, or recall status"
    inputs:
      - "Facility.serious_event_points, Facility.registration_status"
      - "InspectionEngagement.status for every inspection of the facility"
      - "RecallAction.status for every recall under every listing of the facility"
    formula: |
      points_posture = FROZEN     when serious_event_points >= POSTURE_FROZEN_POINTS (25.00)
                       RESTRICTED when serious_event_points >= POSTURE_RESTRICTED_POINTS (10.00)
                       OPEN       otherwise
      override_posture = FROZEN     when registration_status == LAPSED
                                     OR any RecallAction of the facility is ESCALATED_MANDATORY
                         RESTRICTED when any InspectionEngagement of the facility is ESCALATED_OAI
                         OPEN       otherwise
      compliance_posture = max_by_rank(points_posture, override_posture)
                           with rank OPEN(0) < RESTRICTED(1) < FROZEN(2)
      An escalation whose RESULT is RESTRICTED or FROZEN while the previous posture was OPEN fires
      the revalidation cascade (ADEQUATE substantiations -> REVALIDATION_REQUIRED). A de-escalation
      never reverses that cascade.
    constants:
      POSTURE_RESTRICTED_POINTS: 10.00
      POSTURE_FROZEN_POINTS: 25.00
    precision: "comparisons on the 2-decimal serious_event_points value with >= (inclusive at both thresholds)"
    input_set: "all inspections of the facility and all recalls reachable through its listings, in any status"
    worked_examples:
      - "serious_event_points 9.50, no overrides -> OPEN"
      - "serious_event_points 10.00, no overrides -> RESTRICTED (inclusive boundary)"
      - "serious_event_points 24.99 -> RESTRICTED; 25.00 -> FROZEN"
      - "serious_event_points 0.00 but one ESCALATED_OAI inspection -> RESTRICTED"
      - "serious_event_points 0.00 but one ESCALATED_MANDATORY recall -> FROZEN"
      - "serious_event_points 30.00 and registration_status LAPSED -> FROZEN (both paths agree)"

  - name: serious_event_report_deadline
    applies_to: AdverseEvent
    algorithm_type: threshold
    trigger: "creation of a SERIOUS event and every reclassification of a RETAINED event to SERIOUS"
    inputs:
      - "AdverseEvent.received_at (input, must not be in the future)"
      - "AdverseEvent.reclassified_at (system, logical clock now at reclassification)"
    formula: |
      deadline_basis_at = reclassified_at when reclassified_at is non-null, else received_at
      deadline_at       = end_of_day_utc(date(deadline_basis_at) + SERIOUS_REPORT_DAYS (15))
                          where end_of_day_utc(d) = d at 23:59:59.999Z
      lateness_days     = 0 when submitted_at <= deadline_at
                          else ceil((submitted_at - deadline_at) / 1 day)
      A reclassification REBASES the clock on reclassified_at, which can only ever push the deadline
      later than a received_at-based deadline would have been; the original received_at is retained
      for retention_until but is no longer the deadline basis.
    constants:
      SERIOUS_REPORT_DAYS: 15
      RETENTION_YEARS_CONSUMER: 3
      RETENTION_YEARS_SERIOUS_OR_PROFESSIONAL: 6
    precision: "millisecond-resolution UTC instants; the deadline is inclusive (submitted_at == deadline_at is TIMELY)"
    input_set: "the single AdverseEvent being created, reclassified or reported"
    worked_examples:
      - "received_at 2026-08-05T10:00:00Z, SERIOUS at creation -> deadline_basis_at 2026-08-05T10:00:00Z, deadline_at 2026-08-20T23:59:59.999Z"
      - "submitted_at 2026-08-20T23:59:59.999Z -> lateness_days 0 -> REPORTED_TIMELY, event_points 2.00"
      - "submitted_at 2026-08-21T00:00:00.000Z -> lateness_days 1 -> REPORTED_LATE, event_points 5.50"
      - "submitted_at 2026-08-30T12:00:00Z -> lateness_days ceil(9.50) = 10 -> REPORTED_LATE, event_points 10.00"
      - "received NON_SERIOUS 2026-08-05, reclassified SERIOUS 2026-08-25T09:30:00Z -> deadline_basis_at 2026-08-25T09:30:00Z, deadline_at 2026-09-09T23:59:59.999Z (NOT 2026-08-20)"

  - name: allergen_disclosure_completeness
    applies_to: ProductListing
    algorithm_type: threshold
    trigger: "every ingredient create, every listing submit, and every professional-use flag evaluation"
    inputs:
      - "ProductIngredient.is_fragrance_allergen, ProductIngredient.concentration_pct, ProductIngredient.label_disclosed"
      - "ProductListing.product_form, ProductListing.professional_use_only"
    formula: |
      threshold = ALLERGEN_THRESHOLD_LEAVE_ON (0.001) when listing.product_form == LEAVE_ON
                  ALLERGEN_THRESHOLD_RINSE_OFF (0.01) when listing.product_form == RINSE_OFF
      For each ingredient of the listing:
        disclosure_required = is_fragrance_allergen
                              AND concentration_pct >= threshold          # INCLUSIVE at the threshold
                              AND listing.professional_use_only == false  # professional-use products are exempt
      undisclosed_allergen_count   = count of ingredients with disclosure_required == true AND label_disclosed == false
      allergen_disclosure_complete = (undisclosed_allergen_count == 0)
      An empty required set (no fragrance allergens, every allergen below threshold, or a
      professional-use-only listing) yields complete == true — the vacuous case must NOT be treated
      as incomplete.
      Flipping professional_use_only from true to false RE-DERIVES disclosure_required for every
      ingredient, so a listing that was complete while professional-use-only can become incomplete.
    constants:
      ALLERGEN_THRESHOLD_LEAVE_ON: 0.001
      ALLERGEN_THRESHOLD_RINSE_OFF: 0.01
    precision: "concentration_pct stored with 4 decimals; the comparison is >= on the stored 4-decimal value"
    input_set: "all ProductIngredient rows of the listing"
    worked_examples:
      - "LEAVE_ON, allergen at 0.0010, label_disclosed false -> disclosure_required true -> undisclosed_allergen_count 1, complete false"
      - "LEAVE_ON, allergen at 0.0009, label_disclosed false -> below threshold -> disclosure_required false -> complete true"
      - "RINSE_OFF, allergen at 0.0100 undisclosed -> complete false; the same 0.0010 concentration in a RINSE_OFF listing -> complete true"
      - "professional_use_only true, allergen at 0.5000 undisclosed -> disclosure_required false -> complete true (exempt)"
      - "listing with zero ingredients -> undisclosed_allergen_count 0, complete true"

  - name: substantiation_adequacy_score
    applies_to: SafetySubstantiation
    algorithm_type: weighted_scoring
    difficulty_rule: "R1 instance A — dual-variant calculation (SCREENING vs FULL review mode)"
    trigger: "POST /cosmetics/substantiations/{id}/review-decision"
    inputs:
      - "every ToxicologicalReviewItem of the dossier (evidence_type, reviewer_credential)"
      - "review_mode supplied on the decision call (SCREENING | FULL)"
      - "SafetySubstantiation.data_gap_present, derived from the listing's ProductIngredient.is_data_gap_flag rows"
    variants:
      - name: SCREENING
        formula: |
          For each review item: item_value = round(EVIDENCE_WEIGHT[evidence_type] * CREDENTIAL_FACTOR[reviewer_credential], 2)
          adequacy_score = round(sum(item_value), 2)
          No per-evidence_type cap, no read-across discount, no data-gap penalty, no ceiling.
        applies_when: "review_mode == SCREENING (an initial triage pass by the first reviewer)"
      - name: FULL
        formula: |
          For each review item: item_value = round(EVIDENCE_WEIGHT[evidence_type] * CREDENTIAL_FACTOR[reviewer_credential], 2)
                                            then, when evidence_type == READ_ACROSS_ANALOG,
                                            item_value = round(item_value * READ_ACROSS_DISCOUNT (0.5), 2)
          Group the item_values by evidence_type, sum within each group, then cap each group at
          EVIDENCE_TYPE_CAP (40.00).
          adequacy_score = round(max(0.00, sum(capped group totals) - (DATA_GAP_PENALTY (15.00) when
                           data_gap_present else 0.00)), 2)
        applies_when: "review_mode == FULL (the substantive review; mandatory for any dossier whose listing has an is_data_gap_flag ingredient)"
    variant_divergence: |
      The two variants are deliberately NOT monotone transforms of each other: the same item set can
      pass under SCREENING and fail under FULL, and the FULL decision is the one that gates
      marketing. review_mode is caller-supplied, so a dossier reviewed twice under different modes
      produces two different adequacy_score values on the same underlying evidence. Whichever mode
      produced the latest decision determines ProductListing.safety_status.
    constants:
      EVIDENCE_WEIGHT: "{CLINICAL_SAFETY_STUDY: 40, IN_VITRO_TOXICOLOGY: 25, READ_ACROSS_ANALOG: 20, HISTORICAL_USE_DOSSIER: 10, LITERATURE_REVIEW: 5}"
      CREDENTIAL_FACTOR: "{BOARD_CERTIFIED_TOXICOLOGIST: 1.0, ERT: 1.0, QUALIFIED_SAFETY_ASSESSOR: 0.6, OTHER: 0.3}"
      READ_ACROSS_DISCOUNT: 0.5
      EVIDENCE_TYPE_CAP: 40.00
      DATA_GAP_PENALTY: 15.00
      ADEQUACY_PASS: 60.00
    precision: "2 decimals, ROUND_HALF_UP, applied per item, again after the read-across discount, and again on the final total"
    input_set: "all ToxicologicalReviewItem rows whose substantiation_id == this dossier; at least one is required (ERR_NO_REVIEW_ITEMS)"
    worked_examples:
      - "canonical pass: CLINICAL_SAFETY_STUDY/BOARD_CERTIFIED_TOXICOLOGIST (40.00) + IN_VITRO_TOXICOLOGY/ERT (25.00), data_gap_present false -> SCREENING 65.00 ADEQUATE and FULL 65.00 ADEQUATE (the two variants agree here)"
      - "DIVERGENCE case, arithmetic only: CLINICAL_SAFETY_STUDY/BOARD_CERTIFIED_TOXICOLOGIST (40.00) + READ_ACROSS_ANALOG/BOARD_CERTIFIED_TOXICOLOGIST (20.00) + READ_ACROSS_ANALOG/BOARD_CERTIFIED_TOXICOLOGIST (20.00) + LITERATURE_REVIEW/QUALIFIED_SAFETY_ASSESSOR (round(5 * 0.6, 2) = 3.00), data_gap_present true -> the SCREENING formula would yield 40.00 + 20.00 + 20.00 + 3.00 = 83.00 while FULL yields 40.00 + min(40.00, 10.00 + 10.00) + 3.00 - 15.00 = 48.00 (DEFICIENT). Only the FULL number is observable through the API: validations[priority=36] forbids a SCREENING decision on a data-gap dossier, so 83.00 is a formula-level comparison, never a response value"
      - "OBSERVABLE divergence (no data gap, so both modes are admissible): READ_ACROSS_ANALOG/BOARD_CERTIFIED_TOXICOLOGIST x3 + IN_VITRO_TOXICOLOGY/QUALIFIED_SAFETY_ASSESSOR (round(25 * 0.6, 2) = 15.00) -> SCREENING = 20.00 + 20.00 + 20.00 + 15.00 = 75.00 (ADEQUATE) while FULL = min(40.00, 10.00 + 10.00 + 10.00) + 15.00 = 45.00 (DEFICIENT); the same dossier can therefore be DEFICIENT on a FULL pass and ADEQUATE on a later SCREENING pass, a 30.00 delta"
      - "per-evidence_type cap: two CLINICAL_SAFETY_STUDY/BOARD_CERTIFIED_TOXICOLOGIST items + IN_VITRO_TOXICOLOGY/ERT, no data gap -> SCREENING 105.00, FULL min(40.00, 80.00) + 25.00 = 65.00 (both ADEQUATE, still divergent)"
      - "credential drag: CLINICAL_SAFETY_STUDY/OTHER = round(40 * 0.3, 2) = 12.00; three such items -> SCREENING 36.00 DEFICIENT and FULL min(40.00, 36.00) = 36.00 DEFICIENT"
      - "boundary: HISTORICAL_USE_DOSSIER/BOARD_CERTIFIED_TOXICOLOGIST (10.00) x 6 -> FULL min(40.00, 60.00) = 40.00 DEFICIENT even though the raw sum reaches the pass mark"

  - name: gmp_readiness_score
    applies_to: InspectionEngagement
    algorithm_type: weighted_scoring
    difficulty_rule: "R2 mode (b) — pinned rounding order: round each weighted term, THEN sum"
    trigger: "POST /cosmetics/facilities/{id}/inspections/{inspection_id}/observations"
    inputs:
      - "the observations payload: a list of {category, severity} items, category IN {PERSONNEL, PREMISES, EQUIPMENT, RAW_MATERIALS, RECORDKEEPING}, severity IN {MINOR, MAJOR, CRITICAL}"
    formula: |
      Step 1 — per-category deduction points:
        deduction[c] = sum(SEVERITY_POINTS[severity]) over the observations in category c
                       (0 for a category with no observations)
      Step 2 — per-category subscore, rounded to 2 decimals:
        subscore[c] = round(100 - 100 * min(deduction[c], DEDUCTION_CAP (30)) / DEDUCTION_CAP, 2)
      Step 3 — weighted terms, EACH ROUNDED to 2 decimals BEFORE summation:
        term[c] = round(subscore[c] * CATEGORY_WEIGHT[c], 2)
      Step 4 — readiness_score = round(sum(term[c] for the five categories), 2)
      MODE (b) DISCIPLINE: the rounding boundary sits between step 3 and step 4. Summing the
      unrounded products and rounding once at the end is a DIFFERENT function and is observably
      wrong by 0.01 on the pinned cases below. category_subscores stores the step-2 values verbatim.
      observation_count is the number of items in the payload.
    constants:
      SEVERITY_POINTS: "{MINOR: 1, MAJOR: 3, CRITICAL: 6}"
      DEDUCTION_CAP: 30
      CATEGORY_WEIGHT: "{PERSONNEL: 0.15, PREMISES: 0.20, EQUIPMENT: 0.15, RAW_MATERIALS: 0.20, RECORDKEEPING: 0.30}"
      NAI_THRESHOLD: 85.00
      VAI_THRESHOLD: 70.00
    precision: "2 decimals, ROUND_HALF_UP, at step 2, step 3 and step 4; the weights sum to exactly 1.00"
    input_set: "the observations submitted on this one call; every category is scored, including categories with zero observations (subscore 100.00)"
    worked_examples:
      - "no observations at all -> every subscore 100.00, terms 15.00 / 20.00 / 15.00 / 20.00 / 30.00 -> readiness_score 100.00 -> CLOSED_NAI"
      - "deductions PERSONNEL 1, PREMISES 1, EQUIPMENT 1, RAW_MATERIALS 0, RECORDKEEPING 1 -> subscores 96.67 / 96.67 / 96.67 / 100.00 / 96.67 -> terms 14.50 / 19.33 / 14.50 / 20.00 / 29.00 -> readiness_score 97.33 (the unpinned single-rounding variant yields 97.34) -> CLOSED_NAI"
      - "deductions PERSONNEL 7, PREMISES 11, EQUIPMENT 13, RAW_MATERIALS 5, RECORDKEEPING 8 -> subscores 76.67 / 63.33 / 56.67 / 83.33 / 73.33 -> terms 11.50 / 12.67 / 8.50 / 16.67 / 22.00 -> readiness_score 71.34 (the unpinned variant yields 71.33) -> OBSERVATIONS_ISSUED, then CLOSED_VAI on the sweep because 71.34 >= 70.00"
      - "deductions PERSONNEL 13, PREMISES 20, EQUIPMENT 16, RAW_MATERIALS 14, RECORDKEEPING 17 -> subscores 56.67 / 33.33 / 46.67 / 53.33 / 43.33 -> terms 8.50 / 6.67 / 7.00 / 10.67 / 13.00 -> readiness_score 45.84 (unpinned 45.83) -> OBSERVATIONS_ISSUED, then ESCALATED_OAI on the sweep because 45.84 < 70.00"
      - "deduction cap: 12 CRITICAL observations in PREMISES = 72 points, capped at 30 -> subscore 0.00, term 0.00"

  - name: withdrawal_recovery_rate
    applies_to: MarketWithdrawal
    algorithm_type: aggregation
    difficulty_rule: "R1 instance B — dual-variant calculation (REPORTED_BASIS vs VERIFIED_BASIS); R2 mode (c) — the unreachable credit is keyed on the PROVISIONAL rate, not the final one"
    trigger: "POST /cosmetics/withdrawals/{id}/effectiveness-check"
    inputs:
      - "the linked DistributionRecord rows (withdrawal_id == this withdrawal): units_shipped and the five recovery buckets"
      - "basis supplied on the call (REPORTED_BASIS | VERIFIED_BASIS)"
    variants:
      - name: REPORTED_BASIS
        formula: |
          shipped_units_total    = sum(units_shipped)
          reported_recovered_units = sum(units_reported_returned + units_reported_destroyed + units_in_transit_returns)
          reported_recovery_rate = round(100 * reported_recovered_units / shipped_units_total, 2)
          The reported basis credits consignee assertions and in-transit units and applies NO
          unreachable-consignee credit; it never closes the withdrawal (verdict INTERIM).
        applies_when: "basis == REPORTED_BASIS (interim progress review, repeatable)"
      - name: VERIFIED_BASIS
        formula: |
          Four PINNED steps, in this order:
            (1) verified_recovered_units  = sum(units_verified_returned + units_verified_destroyed)
                provisional_verified_rate = round(100 * verified_recovered_units / shipped_units_total, 2)
            (2) unreachable_credit_pct = 0 when provisional_verified_rate >= UNREACHABLE_TIER_HIGH (90.00)
                                         3 when provisional_verified_rate >= UNREACHABLE_TIER_MID (80.00)
                                         6 otherwise
                --- the tier is selected from the PROVISIONAL rate and is NEVER re-selected from the
                    final rate, even when the final rate crosses into a different tier ---
            (3) adjusted_denominator_units = shipped_units_total
                                             - floor(shipped_units_total * unreachable_credit_pct / 100)
            (4) verified_recovery_rate = round(100 * verified_recovered_units / adjusted_denominator_units, 2)
          outstanding_units_total = shipped_units_total - verified_recovered_units
          effectiveness_verdict   = EFFECTIVE when verified_recovery_rate >= EFFECTIVENESS_THRESHOLD (90.00) else NOT_EFFECTIVE
        applies_when: "basis == VERIFIED_BASIS (the closing review; only this variant can move the withdrawal and its RecallAction to a terminal state)"
    variant_divergence: |
      On the same records the two variants disagree in both directions: REPORTED_BASIS is inflated by
      unverified assertions and in-transit units, while VERIFIED_BASIS is inflated by the
      unreachable-consignee denominator shrink. Only VERIFIED_BASIS decides EFFECTIVE / NOT_EFFECTIVE.
      MODE (c) DISCIPLINE: because step 4 raises the rate above the provisional rate, a naive
      implementation that re-derives unreachable_credit_pct from the final rate (or iterates the
      four steps to a fixed point) reports a different number — see the third worked example.
    constants:
      UNREACHABLE_TIER_HIGH: 90.00
      UNREACHABLE_TIER_MID: 80.00
      UNREACHABLE_CREDIT_HIGH_PCT: 0
      UNREACHABLE_CREDIT_MID_PCT: 3
      UNREACHABLE_CREDIT_LOW_PCT: 6
      EFFECTIVENESS_THRESHOLD: 90.00
    precision: "2 decimals, ROUND_HALF_UP on both rates; the step-3 credit is a floor to whole units; unit tallies are integers"
    input_set: "DistributionRecord rows currently linked to this withdrawal; records released by a SUPERSEDED predecessor are excluded"
    worked_examples:
      - "shipped 1500; reported returned+destroyed+in-transit 830; verified returned+destroyed 700 -> REPORTED_BASIS 55.33 (verdict INTERIM) while VERIFIED_BASIS provisional 46.67 -> tier 6% -> credit floor(90.0) = 90 -> denominator 1410 -> verified_recovery_rate 49.65 -> NOT_EFFECTIVE"
      - "MODE (c) case: shipped 1500, verified 1345 -> provisional_verified_rate 89.67 (below 90.00, so tier MID at 3%) -> credit floor(45.0) = 45 -> denominator 1455 -> verified_recovery_rate 92.44 -> EFFECTIVE. Re-selecting the tier from 92.44 would give 0% credit, denominator 1500 and a rate of 89.67 -> NOT_EFFECTIVE. The pinned single pass is authoritative."
      - "shipped 1000, verified 950 -> provisional 95.00 -> tier 0% -> denominator 1000 -> verified_recovery_rate 95.00 -> EFFECTIVE"
      - "shipped 1000, verified 0 -> provisional 0.00 -> tier 6% -> credit 60 -> denominator 940 -> verified_recovery_rate 0.00 -> NOT_EFFECTIVE"
      - "boundary: shipped 1000, verified 900 -> provisional 90.00 (inclusive) -> tier 0% -> verified_recovery_rate 90.00 -> EFFECTIVE"

  - name: distribution_unit_conservation
    applies_to: DistributionRecord
    algorithm_type: aggregation
    difficulty_rule: "R9 — compensating invariant: physical units are conserved across recovery entries and reversals"
    trigger: "POST /cosmetics/withdrawals/{id}/recovery-entries and every withdrawal state change"
    inputs:
      - "recovery entries of kind REPORTED_RETURN | REPORTED_DESTRUCTION | IN_TRANSIT_RETURN | VERIFIED_RETURN | VERIFIED_DESTRUCTION | CORRECTION_REVERSAL, each carrying distribution_record_id and units"
    formula: |
      Per-record bucket accumulation (each entry adds its units to exactly one bucket):
        units_reported_returned  += units of REPORTED_RETURN entries
        units_reported_destroyed += units of REPORTED_DESTRUCTION entries
        units_in_transit_returns += units of IN_TRANSIT_RETURN entries
        units_verified_returned  += units of VERIFIED_RETURN entries
        units_verified_destroyed += units of VERIFIED_DESTRUCTION entries
      A CORRECTION_REVERSAL entry names a target bucket and SUBTRACTS its units from that bucket; it
      may not drive any bucket below 0 (ERR_REVERSAL_EXCEEDS_RECORDED).
      Derived, re-derived on every entry:
        units_outstanding = units_shipped - (units_verified_returned + units_verified_destroyed)
      INVARIANT 1 (per record): units_verified_returned + units_verified_destroyed + units_outstanding
                                == units_shipped, always, after every entry and every reversal.
      INVARIANT 2 (per withdrawal): sum over linked records of (verified + outstanding)
                                == MarketWithdrawal.shipped_units_total, and
                                MarketWithdrawal.outstanding_units_total == sum(units_outstanding).
      INVARIANT 3 (ledger): every VERIFIED_RETURN / VERIFIED_DESTRUCTION appends
        ComplianceLedgerEntry{entry_type: UNIT_MOVEMENT, signed_units_delta: +units} and every
        CORRECTION_REVERSAL of a verified bucket appends one with signed_units_delta: -units, so
        sum(signed_units_delta) over a record's UNIT_MOVEMENT entries always equals
        units_verified_returned + units_verified_destroyed.
      GUARD: verified units may never exceed what is still outstanding —
        units of a VERIFIED_RETURN or VERIFIED_DESTRUCTION entry <= units_outstanding before the
        entry, else ERR_RECOVERY_EXCEEDS_OUTSTANDING. Reported and in-transit buckets are NOT
        capped by units_outstanding and do not reduce it.
    constants: {}
    precision: "whole units; no rounding anywhere in this rule"
    input_set: "recovery entries whose distribution_record_id resolves to a record currently linked to the withdrawal (ERR_RECORD_NOT_IN_WITHDRAWAL otherwise)"
    worked_examples:
      - "three records shipped 600 / 500 / 400 (shipped_units_total 1500); VERIFIED_RETURN 400 / 200 / 100 -> outstanding 200 / 300 / 300 -> per-record invariant holds and outstanding_units_total 800 with 700 + 800 == 1500"
      - "CORRECTION_REVERSAL of 100 against record 1's units_verified_returned -> 300 verified, 300 outstanding; ledger deltas +400 then -100 sum to 300, matching the bucket"
      - "VERIFIED_RETURN 250 against a record with units_outstanding 200 -> ERR_RECOVERY_EXCEEDS_OUTSTANDING (400) and no bucket moves"
      - "CORRECTION_REVERSAL of 500 against a bucket holding 400 -> ERR_REVERSAL_EXCEEDS_RECORDED and no bucket moves"
      - "REPORTED_RETURN 600 on a record with units_shipped 600 and units_verified_returned 0 -> allowed; units_outstanding stays 600 (reported assertions never reduce outstanding)"

  - name: listing_category_validation
    applies_to: ProductListing
    algorithm_type: threshold
    trigger: "POST /cosmetics/listings (category_code acceptance) and POST /cosmetics/listings/{id}/submit (label-contact adequacy)"
    inputs:
      - "ProductListing.category_code, ProductListing.label_contact_type, ProductListing.label_contact_value, ProductListing.professional_use_only"
    formula: |
      category_code must be a key of CATEGORY_CODE_REGISTRY, else ERR_UNKNOWN_CATEGORY_CODE.
      professional_use_permitted = CATEGORY_CODE_REGISTRY[category_code].professional_use_permitted
      A listing with professional_use_only == true whose category is not professional-use-permitted
      is rejected at submit with ERR_PROFESSIONAL_USE_LABEL_REQUIRED.
      Label-contact adequacy at submit:
        required_contact_channels = {DOMESTIC_ADDRESS, ELECTRONIC_CONTACT} when professional_use_only == false
                                    {DOMESTIC_ADDRESS, DOMESTIC_PHONE, ELECTRONIC_CONTACT} when professional_use_only == true
        label_contact_type must be in required_contact_channels AND label_contact_value must be
        non-blank, else ERR_LABEL_CONTACT_REQUIRED.
        A consumer product may therefore NOT satisfy the label-contact requirement with
        DOMESTIC_PHONE alone, while a professional-use product may.
    constants:
      CATEGORY_CODE_REGISTRY: |
        {
          "01A": {label: "Baby shampoos",              professional_use_permitted: false},
          "02C": {label: "Bath oils and salts",        professional_use_permitted: false},
          "03B": {label: "Eyeliner",                   professional_use_permitted: true},
          "05G": {label: "Hair straighteners",         professional_use_permitted: true},
          "07A": {label: "Blushers",                   professional_use_permitted: false},
          "08D": {label: "Nail extension preparations", professional_use_permitted: true},
          "11E": {label: "Skin peels",                 professional_use_permitted: true},
          "12A": {label: "Suntan gels and lotions",    professional_use_permitted: false}
        }
    precision: "exact string match on the registry key; codes are case-sensitive"
    input_set: "the single ProductListing being created or submitted"
    worked_examples:
      - "category_code 03B, professional_use_only true, professional_use_statement_present true, label_contact_type DOMESTIC_PHONE -> accepted at submit"
      - "category_code 07A, professional_use_only true -> ERR_PROFESSIONAL_USE_LABEL_REQUIRED at submit (blushers are not professional-use-permitted)"
      - "category_code 07A, professional_use_only false, label_contact_type DOMESTIC_PHONE -> ERR_LABEL_CONTACT_REQUIRED at submit"
      - "category_code 99Z -> ERR_UNKNOWN_CATEGORY_CODE at create"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND is listed in the target endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "{id} path segment resolves to a Facility"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "all /cosmetics/facilities/{id}/** endpoints"
  - priority: 4
    category: existence
    check: "responsible_person_id (path segment or create payload) resolves to a ResponsiblePerson"
    error_id: ERR_RESPONSIBLE_PERSON_NOT_FOUND
    http_status: 404
    applies_to: "GET /cosmetics/responsible-persons/{id}, POST /cosmetics/listings, POST /cosmetics/listings/{id}/transfer-responsible-person"
  - priority: 5
    category: existence
    check: "{id} path segment (or facility_id/listing_id in a create payload) resolves to a ProductListing"
    error_id: ERR_LISTING_NOT_FOUND
    http_status: 404
    applies_to: "all /cosmetics/listings/{id}/** endpoints"
  - priority: 6
    category: existence
    check: "{id} path segment resolves to a SafetySubstantiation"
    error_id: ERR_SUBSTANTIATION_NOT_FOUND
    http_status: 404
    applies_to: "all /cosmetics/substantiations/{id}/** endpoints"
  - priority: 7
    category: existence
    check: "{id} path segment resolves to an AdverseEvent"
    error_id: ERR_ADVERSE_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /cosmetics/adverse-events/{id}/report, POST /cosmetics/adverse-events/{id}/reclassify"
  - priority: 8
    category: existence
    check: "{inspection_id} path segment resolves to an InspectionEngagement whose facility_id matches the {id} segment"
    error_id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /cosmetics/facilities/{id}/inspections/{inspection_id}/observations, POST /cosmetics/facilities/{id}/inspections/{inspection_id}/response"
  - priority: 9
    category: existence
    check: "{id} path segment resolves to a RecallAction"
    error_id: ERR_RECALL_ACTION_NOT_FOUND
    http_status: 404
    applies_to: "all /cosmetics/recall-actions/{id}/** endpoints"
  - priority: 10
    category: existence
    check: "{id} path segment resolves to a MarketWithdrawal"
    error_id: ERR_WITHDRAWAL_NOT_FOUND
    http_status: 404
    applies_to: "all /cosmetics/withdrawals/{id}/** endpoints"
  - priority: 11
    category: existence
    check: "{id} path segment resolves to an OwnershipChangeUpdate"
    error_id: ERR_OWNERSHIP_CHANGE_NOT_FOUND
    http_status: 404
    applies_to: "POST /cosmetics/ownership-changes/{id}/decision"
  - priority: 12
    category: existence
    check: "every distribution_record_id in a records-production or recovery-entry payload resolves to a DistributionRecord, validated in payload order"
    error_id: ERR_DISTRIBUTION_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /cosmetics/distribution-records/{id}, POST /cosmetics/withdrawals/{id}/records-production, POST /cosmetics/withdrawals/{id}/recovery-entries"
  - priority: 13
    category: auth
    check: |
      Ownership: a FacilityRegistrant's X-User-ID must equal the target facility's id (resolved
      through the entity's ancestry: listing.facility_id, inspection.facility_id,
      ownership_change.facility_id). A ResponsiblePersonAgent's X-User-ID must equal the target
      listing's responsible_person_id (resolved through substantiation.listing_id,
      adverse_event.listing_id, recall_action.listing_id and withdrawal.recall_action_id ->
      listing). The two create-root endpoints (POST /cosmetics/facilities and
      POST /cosmetics/responsible-persons) have no ownership target and skip this check.
      Opaque roles (RegulatoryReviewer, EnforcementOfficer, SystemOperator) are never ownership-checked.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include FacilityRegistrant or ResponsiblePersonAgent, except the two create-root endpoints"
  - priority: 14
    category: existence
    check: "request body conforms to the endpoint's input schema: required fields present, types correct, enums in range, string lengths and numeric bounds respected, and any declared date ordering parsed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 15
    category: business_constraint
    check: "category_code is a key of calculations.listing_category_validation.constants.CATEGORY_CODE_REGISTRY"
    error_id: ERR_UNKNOWN_CATEGORY_CODE
    http_status: 422
    applies_to: "POST /cosmetics/listings"
  - priority: 16
    category: business_constraint
    check: "window_start < window_end for an inspection window (half-open) and ship_date <= delivery_date for a distribution window (closed-closed)"
    error_id: ERR_INVALID_WINDOW_BOUNDS
    http_status: 422
    applies_to: "POST /cosmetics/facilities/{id}/inspections, POST /cosmetics/listings/{id}/distribution-records"
  - priority: 17
    category: state
    check: "expected_facility_version equals Facility.version"
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    applies_to: "POST /cosmetics/facilities/{id}/ownership-changes"
    note: "concurrency_rules.ownership-change-file-stale-facility; runs before every state precondition on the facility."
  - priority: 18
    category: state
    check: "expected_listing_version equals ProductListing.version"
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
    applies_to: "POST /cosmetics/listings/{id}/transfer-responsible-person"
    note: "concurrency_rules.transfer-designation-stale-listing; outranks the designation-cap check at priority 53."
  - priority: 19
    category: state
    check: "expected_recall_action_version equals RecallAction.version"
    error_id: ERR_STALE_RECALL_VERSION
    http_status: 412
    applies_to: "POST /cosmetics/recall-actions/{id}/withdrawals"
    note: "concurrency_rules.withdrawal-create-stale-recall; outranks ERR_INVALID_RECALL_STATE at priority 28."
  - priority: 20
    category: state
    check: "the governing Facility.registration_status is in {REGISTERED, RENEWAL_DUE} — RENEWAL_DUE is admitted, LAPSED / DRAFT / PENDING_REVIEW / REJECTED are not"
    error_id: ERR_FACILITY_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /cosmetics/listings, POST /cosmetics/listings/{id}/submit, POST /cosmetics/facilities/{id}/inspections, POST /cosmetics/listings/{id}/distribution-records"
  - priority: 21
    category: state
    check: "the governing Facility.compliance_posture != FROZEN"
    error_id: ERR_FACILITY_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /cosmetics/listings/{id}/submit, POST /cosmetics/listings/{id}/listing-decision, POST /cosmetics/substantiations/{id}/submit, POST /cosmetics/listings/{id}/distribution-records"
  - priority: 22
    category: state
    check: "Facility.registration_status admits the requested transition per state_machines.Facility (submit-registration requires DRAFT; registration-decision requires PENDING_REVIEW; renewals require REGISTERED, RENEWAL_DUE or LAPSED)"
    error_id: ERR_INVALID_FACILITY_STATE
    http_status: 409
    applies_to: "POST /cosmetics/facilities/{id}/submit-registration, POST /cosmetics/facilities/{id}/registration-decision, POST /cosmetics/facilities/{id}/renewals"
  - priority: 23
    category: state
    check: "OwnershipChangeUpdate.status == FILED"
    error_id: ERR_INVALID_OWNERSHIP_CHANGE_STATE
    http_status: 409
    applies_to: "POST /cosmetics/ownership-changes/{id}/decision"
  - priority: 24
    category: state
    check: "ProductListing.listing_status admits the requested transition per state_machines.ProductListing (submit requires DRAFT or RETURNED; listing-decision requires SUBMITTED; delist requires LISTED, SUSPENDED or RETURNED; ingredient creation, substantiation creation and a responsible-person transfer require a non-DELISTED listing)"
    error_id: ERR_INVALID_LISTING_STATE
    http_status: 409
    applies_to: "POST /cosmetics/listings/{id}/submit, POST /cosmetics/listings/{id}/listing-decision, POST /cosmetics/listings/{id}/delist, POST /cosmetics/listings/{id}/ingredients, POST /cosmetics/listings/{id}/substantiations, POST /cosmetics/listings/{id}/transfer-responsible-person"
    note: "R5 pair: this state check strictly outranks the business_safety allergen check at priority 32 — a RETURNED-but-incomplete listing that is re-submitted reports the allergen error, while a DELISTED-and-incomplete listing reports this one."
  - priority: 25
    category: state
    check: "SafetySubstantiation.status admits the requested transition (submit requires DRAFT, DEFICIENT or REVALIDATION_REQUIRED; review-decision requires SUBMITTED; review-item creation requires DRAFT, DEFICIENT or REVALIDATION_REQUIRED)"
    error_id: ERR_INVALID_SUBSTANTIATION_STATE
    http_status: 409
    applies_to: "POST /cosmetics/substantiations/{id}/submit, POST /cosmetics/substantiations/{id}/review-decision, POST /cosmetics/substantiations/{id}/review-items"
  - priority: 26
    category: state
    check: "AdverseEvent.report_status admits the requested transition (report requires REPORT_DUE or REPORT_OVERDUE; reclassify requires RETAINED with seriousness == NON_SERIOUS)"
    error_id: ERR_INVALID_ADVERSE_EVENT_STATE
    http_status: 409
    applies_to: "POST /cosmetics/adverse-events/{id}/report, POST /cosmetics/adverse-events/{id}/reclassify"
  - priority: 27
    category: state
    check: "InspectionEngagement.status admits the requested transition (observations require SCHEDULED; response requires OBSERVATIONS_ISSUED)"
    error_id: ERR_INVALID_INSPECTION_STATE
    http_status: 409
    applies_to: "POST /cosmetics/facilities/{id}/inspections/{inspection_id}/observations, POST /cosmetics/facilities/{id}/inspections/{inspection_id}/response"
  - priority: 28
    category: state
    check: "RecallAction.status admits the requested transition (plan requires PLAN_REQUIRED or PLAN_REJECTED; plan-decision requires PLAN_SUBMITTED; withdrawal creation requires PLAN_ACCEPTED, EXECUTING or EXTENDED)"
    error_id: ERR_INVALID_RECALL_STATE
    http_status: 409
    applies_to: "POST /cosmetics/recall-actions/{id}/plan, POST /cosmetics/recall-actions/{id}/plan-decision, POST /cosmetics/recall-actions/{id}/withdrawals"
  - priority: 29
    category: state
    check: "MarketWithdrawal.status admits the requested operation (records-production requires OPEN; recovery-entries require RECORDS_PRODUCED or INTERIM_REVIEWED; effectiveness-check requires RECORDS_PRODUCED or INTERIM_REVIEWED)"
    error_id: ERR_INVALID_WITHDRAWAL_STATE
    http_status: 409
    applies_to: "POST /cosmetics/withdrawals/{id}/records-production, POST /cosmetics/withdrawals/{id}/recovery-entries, POST /cosmetics/withdrawals/{id}/effectiveness-check"
  - priority: 30
    category: auth
    check: |
      Segregation of duties, keyed on X-User-ID:
      (a) the EnforcementOfficer recorded in the parent RecallAction.plan_decision_user_id may not
          run POST /cosmetics/withdrawals/{id}/effectiveness-check on any withdrawal of
          that recall, under either basis;
      (b) the RegulatoryReviewer recorded in SafetySubstantiation.screening_reviewer_user_id may not
          issue a review-decision with review_mode == FULL on the same dossier.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cosmetics/withdrawals/{id}/effectiveness-check, POST /cosmetics/substantiations/{id}/review-decision"
    note: "Deliberately placed AFTER the withdrawal-state check at priority 29: a barred officer is rejected with 403 only once the withdrawal is in a reviewable state, so a barred officer hitting an OPEN withdrawal receives ERR_INVALID_WITHDRAWAL_STATE (409) instead."
  - priority: 31
    category: business_safety
    check: "ProductListing.safety_status == SUBSTANTIATED"
    error_id: ERR_SUBSTANTIATION_NOT_ADEQUATE
    http_status: 422
    applies_to: "POST /cosmetics/listings/{id}/submit"
  - priority: 32
    category: business_safety
    check: "calculations.allergen_disclosure_completeness yields allergen_disclosure_complete == true for the listing"
    error_id: ERR_ALLERGEN_DISCLOSURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /cosmetics/listings/{id}/submit"
  - priority: 33
    category: business_safety
    check: "when professional_use_only == true: professional_use_statement_present == true AND the category_code is professional-use-permitted per calculations.listing_category_validation"
    error_id: ERR_PROFESSIONAL_USE_LABEL_REQUIRED
    http_status: 422
    applies_to: "POST /cosmetics/listings/{id}/submit"
  - priority: 34
    category: business_safety
    check: "label_contact_type is in the channel set calculations.listing_category_validation requires for this listing's professional_use_only flag, and label_contact_value is non-blank"
    error_id: ERR_LABEL_CONTACT_REQUIRED
    http_status: 422
    applies_to: "POST /cosmetics/listings/{id}/submit"
  - priority: 35
    category: business_safety
    check: "the dossier has at least one ToxicologicalReviewItem"
    error_id: ERR_NO_REVIEW_ITEMS
    http_status: 422
    applies_to: "POST /cosmetics/substantiations/{id}/submit"
  - priority: 36
    category: business_safety
    check: "when SafetySubstantiation.data_gap_present == true, review_mode must be FULL — a screening pass may not clear a dossier whose listing has an is_data_gap_flag ingredient"
    error_id: ERR_FULL_REVIEW_REQUIRED_FOR_DATA_GAP
    http_status: 422
    applies_to: "POST /cosmetics/substantiations/{id}/review-decision"
  - priority: 37
    category: business_temporal
    check: "date(logical clock now) >= Facility.renewal_window_open_date"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /cosmetics/facilities/{id}/renewals"
  - priority: 38
    category: business_temporal
    check: "date(logical clock now) <= Facility.grace_end_date"
    error_id: ERR_GRACE_PERIOD_EXPIRED
    http_status: 422
    applies_to: "POST /cosmetics/facilities/{id}/renewals"
  - priority: 39
    category: business_temporal
    check: "received_at <= logical clock now"
    error_id: ERR_RECEIVED_AT_IN_FUTURE
    http_status: 422
    applies_to: "POST /cosmetics/listings/{id}/adverse-events"
  - priority: 40
    category: business_temporal
    check: "the requested inspection window [window_start, window_end) lies entirely within the facility's current registration period [current_period_start, current_period_end] (window_end - 1 day <= current_period_end)"
    error_id: ERR_INSPECTION_OUTSIDE_REGISTRATION_PERIOD
    http_status: 422
    applies_to: "POST /cosmetics/facilities/{id}/inspections"
    note: "R5 pair: strictly outranks the business_constraint overlap check at priority 43 — a window that both falls outside the period and overlaps an existing engagement reports THIS error."
  - priority: 41
    category: business_temporal
    check: "logical clock now <= InspectionEngagement.response_due_at"
    error_id: ERR_INSPECTION_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /cosmetics/facilities/{id}/inspections/{inspection_id}/response"
  - priority: 42
    category: business_constraint
    check: "no existing non-terminal InspectionEngagement of the same facility with the SAME inspection_type starts within SAME_TYPE_BUFFER_DAYS (7) of the requested window: the requested [window_start, window_end) must be separated from every same-type window by at least 7 days of clear air on both sides"
    error_id: ERR_INSPECTION_TYPE_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /cosmetics/facilities/{id}/inspections"
    note: "Outranks the raw overlap check at priority 43, so two overlapping GMP_ROUTINE windows report the buffer error while two overlapping windows of DIFFERENT types report the overlap error."
  - priority: 43
    category: business_constraint
    check: "the requested half-open window [window_start, window_end) does not overlap any existing non-terminal InspectionEngagement window of the same facility; adjacency is allowed (existing window_end == requested window_start is legal)"
    error_id: ERR_INSPECTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /cosmetics/facilities/{id}/inspections"
  - priority: 44
    category: business_constraint
    check: "the requested closed-closed distribution window [ship_date, delivery_date] does not overlap OR TOUCH any existing DistributionRecord window of the same listing with the same lot_code (touching endpoints collide: existing delivery_date == requested ship_date is a conflict)"
    error_id: ERR_LOT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /cosmetics/listings/{id}/distribution-records"
    note: "R8 pair with priority 43: the inspection rule is half-open with adjacency allowed, this one is closed-closed with adjacency forbidden."
  - priority: 45
    category: business_constraint
    check: "no existing ProductIngredient of the same listing has the same inci_name (case-insensitive)"
    error_id: ERR_DUPLICATE_INGREDIENT
    http_status: 409
    applies_to: "POST /cosmetics/listings/{id}/ingredients"
  - priority: 46
    category: business_constraint
    check: "when renewal_kind == ABBREVIATED: Facility.abbreviated_renewal_eligible == true (an accepted OwnershipChangeUpdate clears the flag for the remainder of the period)"
    error_id: ERR_ABBREVIATED_RENEWAL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /cosmetics/facilities/{id}/renewals"
  - priority: 47
    category: business_constraint
    check: |
      RecallAction.plan_round < MAX_PLAN_ROUNDS (3) before accepting another plan submission. The
      state that makes this rule reachable is a VOLUNTARY_NOTICE recall whose third plan was
      rejected: it stays in PLAN_REJECTED with plan_round == 3 (a MANDATORY_ORDER recall would have
      escalated to ESCALATED_MANDATORY instead and would fail earlier at validations[priority=28]).
    error_id: ERR_RECALL_PLAN_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /cosmetics/recall-actions/{id}/plan"
  - priority: 48
    category: business_constraint
    check: "ProductListing.open_recall_count == 0"
    error_id: ERR_OPEN_RECALL_BLOCKS_DELIST
    http_status: 409
    applies_to: "POST /cosmetics/listings/{id}/delist"
  - priority: 49
    category: business_constraint
    check: "the incoming responsible_person_id differs from the listing's current responsible_person_id"
    error_id: ERR_TRANSFER_TARGET_SAME_PERSON
    http_status: 422
    applies_to: "POST /cosmetics/listings/{id}/transfer-responsible-person"
  - priority: 50
    category: business_referential
    check: "every distribution_record_id in a records-production payload belongs to the listing named by the withdrawal's RecallAction.listing_id"
    error_id: ERR_DISTRIBUTION_RECORD_LISTING_MISMATCH
    http_status: 422
    applies_to: "POST /cosmetics/withdrawals/{id}/records-production"
  - priority: 51
    category: business_referential
    check: "every distribution_record_id in a recovery-entry payload has withdrawal_id == the withdrawal in the path"
    error_id: ERR_RECORD_NOT_IN_WITHDRAWAL
    http_status: 422
    applies_to: "POST /cosmetics/withdrawals/{id}/recovery-entries"
    note: "R5 pair: strictly outranks the business_fiscal ERR_RECOVERY_EXCEEDS_OUTSTANDING at priority 55 — an unlinked record with an over-large unit count reports THIS error."
  - priority: 52
    category: business_referential
    check: "the records-production payload names at least one distribution_record_id, and the effectiveness-check target has records_produced_count > 0"
    error_id: ERR_NO_DISTRIBUTION_RECORDS
    http_status: 422
    applies_to: "POST /cosmetics/withdrawals/{id}/records-production, POST /cosmetics/withdrawals/{id}/effectiveness-check"
  - priority: 53
    category: business_fiscal
    check: "the receiving ResponsiblePerson.active_designation_count < designation_cap (25) — evaluated on the incoming designee for a transfer and on the current designee for a submit"
    error_id: ERR_DESIGNATION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /cosmetics/listings/{id}/submit, POST /cosmetics/listings/{id}/transfer-responsible-person"
  - priority: 54
    category: business_fiscal
    check: "sum(units_shipped) over the listing's existing DistributionRecord rows with the same lot_code, plus the requested units_shipped, must not exceed ProductListing.lot_authorized_units — an aggregate check that each individual record can pass while the collection fails"
    error_id: ERR_LOT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /cosmetics/listings/{id}/distribution-records"
  - priority: 55
    category: business_fiscal
    check: "for a VERIFIED_RETURN or VERIFIED_DESTRUCTION recovery entry: units <= the target record's units_outstanding before the entry"
    error_id: ERR_RECOVERY_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /cosmetics/withdrawals/{id}/recovery-entries"
  - priority: 56
    category: business_fiscal
    check: "for a CORRECTION_REVERSAL entry: units <= the current balance of the named target bucket on that record"
    error_id: ERR_REVERSAL_EXCEEDS_RECORDED
    http_status: 422
    applies_to: "POST /cosmetics/withdrawals/{id}/recovery-entries"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Path-parameter convention: the addressed resource's own id is always {id};
# a nested child id keeps its explicit name ({inspection_id}).
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/cosmetics/facilities"
    description: "Register a manufacturing or processing establishment as a DRAFT record. This is a create-root endpoint: X-User-ID is not ownership-checked, and the returned Facility.id is the value a FacilityRegistrant sends as X-User-ID on every later facility call."
    roles: [FacilityRegistrant]
    code: 201
    input: [facility_name, owner_operator_name, facility_type, country_code, state_or_province]
    output: Facility
    side_effects:
      - "creates Facility{registration_status: DRAFT, compliance_posture: OPEN, serious_event_points: 0.00, registration_cycle_count: 0, abbreviated_renewal_eligible: true, gmp_readiness_score: null, version: 1}"
  - method: GET
    path: "/cosmetics/facilities/{id}"
    description: "Read one facility, including its derived period bounds, posture, points and counters. Primary source of Facility.version for the ownership-change OCC rule."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/cosmetics/facilities"
    description: "List facilities, filterable by registration status and compliance posture."
    roles: [RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["registration_status?", "compliance_posture?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []
  - method: POST
    path: "/cosmetics/facilities/{id}/submit-registration"
    description: "Submit a DRAFT facility registration for agency review."
    roles: [FacilityRegistrant]
    code: 200
    input: []
    output: Facility
    side_effects:
      - "Facility DRAFT -> PENDING_REVIEW"
      - "increments Facility.version by 1"
  - method: POST
    path: "/cosmetics/facilities/{id}/registration-decision"
    description: "Approve or reject a PENDING_REVIEW registration. Approval mints facility_fei and the INITIAL RegistrationPeriod."
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision, "decision_note?"]
    output: Facility
    side_effects:
      - "Facility PENDING_REVIEW -> REGISTERED (APPROVE) or REJECTED (REJECT)"
      - "on APPROVE: mints facility_fei, creates the INITIAL RegistrationPeriod per calculations.registration_period_bounds, sets current_period_start/current_period_end/renewal_window_open_date/grace_end_date, increments registration_cycle_count"
      - "recomputes compliance_posture per calculations.facility_compliance_posture"
      - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION}"
      - "increments Facility.version by 1"
  - method: POST
    path: "/cosmetics/facilities/{id}/renewals"
    description: "File a biennial renewal. Accepts STANDARD always and ABBREVIATED only while abbreviated_renewal_eligible is true; usable inside the renewal window, and after lapse while inside the 60-day grace window."
    roles: [FacilityRegistrant]
    code: 201
    input: [renewal_kind]
    output: RegistrationPeriod
    side_effects:
      - "expires the ACTIVE RegistrationPeriod and creates the successor per calculations.registration_period_bounds (period_kind RENEWAL or LATE_RENEWAL)"
      - "sets Facility.registration_status = REGISTERED and increments registration_cycle_count"
      - "recompiles the facility's derived period fields and compliance_posture"
      - "when the facility was LAPSED: restores every ProductListing suspended with suspension_reason = FACILITY_LAPSED and re-increments the affected ResponsiblePerson.active_designation_count (compensating cascade)"
      - "appends ComplianceLedgerEntry{entry_type: POSTURE_CHANGE} plus one STATE_TRANSITION per restored listing"
      - "increments Facility.version by 1"
  - method: GET
    path: "/cosmetics/facilities/{id}/registration-periods"
    description: "List the facility's registration periods in ascending sequence_index order — the audit trail of the biennial cadence."
    roles: [FacilityRegistrant, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["status?"]
    output: RegistrationPeriod[]
    side_effects: []
  - method: POST
    path: "/cosmetics/facilities/{id}/ownership-changes"
    description: "File an ownership or owner-operator change for the facility. OCC write endpoint for concurrency_rules.ownership-change-file-stale-facility: expected_facility_version must equal the Facility.version the caller last observed."
    roles: [FacilityRegistrant]
    code: 201
    input: [new_owner_operator_name, change_effective_date, expected_facility_version]
    output: OwnershipChangeUpdate
    side_effects:
      - "rejects with ERR_STALE_FACILITY_VERSION (412) when expected_facility_version != Facility.version"
      - "moves every FILED OwnershipChangeUpdate of this facility to SUPERSEDED"
      - "creates OwnershipChangeUpdate{status: FILED, filed_at: logical clock now, filing_deadline_at: change_effective_date + 60 days, is_late_filing: filed_at > filing_deadline_at}"
      - "increments Facility.version by 1"
  - method: GET
    path: "/cosmetics/facilities/{id}/ownership-changes"
    description: "List the facility's ownership-change filings, newest first."
    roles: [FacilityRegistrant, RegulatoryReviewer, SystemOperator]
    code: 200
    input: ["status?"]
    output: OwnershipChangeUpdate[]
    side_effects: []
  - method: POST
    path: "/cosmetics/ownership-changes/{id}/decision"
    description: "Accept or reject a FILED ownership-change update. Acceptance rewrites the facility's owner_operator_name and clears abbreviated_renewal_eligible."
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision, "decision_note?"]
    output: OwnershipChangeUpdate
    side_effects:
      - "OwnershipChangeUpdate FILED -> ACCEPTED or REJECTED; stores decided_by_user_id = X-User-ID"
      - "on ACCEPT: sets Facility.owner_operator_name and Facility.abbreviated_renewal_eligible = false, appends ComplianceLedgerEntry{entry_type: OWNERSHIP_CHANGE}, increments Facility.version by 1"
  - method: GET
    path: "/cosmetics/facilities/{id}/ledger-entries"
    description: "Append-only compliance history of the facility in ascending sequence_no order; the reconciliation channel for posture changes and unit movements."
    roles: [FacilityRegistrant, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["entry_type?", "subject_entity?", "limit?", "offset?"]
    output: ComplianceLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/cosmetics/facilities/{id}/inspections"
    description: "Schedule a GMP inspection engagement on a half-open [window_start, window_end) window that must sit inside the facility's current registration period."
    roles: [RegulatoryReviewer]
    code: 201
    input: [inspection_type, window_start, window_end]
    output: InspectionEngagement
    side_effects:
      - "creates InspectionEngagement{status: SCHEDULED, observation_count: 0, readiness_score: null, outcome_class: null}"
  - method: GET
    path: "/cosmetics/facilities/{id}/inspections"
    description: "List the facility's inspection engagements in ascending window_start order."
    roles: [FacilityRegistrant, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["status?", "inspection_type?"]
    output: InspectionEngagement[]
    side_effects: []
  - method: POST
    path: "/cosmetics/facilities/{id}/inspections/{inspection_id}/observations"
    description: "Issue the inspection observations. Scores GMP readiness per calculations.gmp_readiness_score and forks the engagement: >= 85.00 closes it NAI, below that issues observations with a 15-day response window."
    roles: [RegulatoryReviewer]
    code: 200
    input: [observations]
    output: InspectionEngagement
    side_effects:
      - "computes category_subscores, readiness_score and observation_count"
      - "InspectionEngagement SCHEDULED -> CLOSED_NAI (readiness_score >= 85.00) or -> OBSERVATIONS_ISSUED with response_due_at = now + 15 days at 23:59:59.999Z"
      - "sets Facility.gmp_readiness_score; on CLOSED_NAI also sets Facility.last_inspection_outcome = NAI"
      - "appends ComplianceLedgerEntry{entry_type: INSPECTION_OUTCOME} on closure"
  - method: POST
    path: "/cosmetics/facilities/{id}/inspections/{inspection_id}/response"
    description: "Submit the establishment's written response to issued observations, inside the response window. The terminal outcome is decided by the compliance sweep, not by this call."
    roles: [FacilityRegistrant]
    code: 200
    input: [response_summary]
    output: InspectionEngagement
    side_effects:
      - "InspectionEngagement OBSERVATIONS_ISSUED -> RESPONSE_SUBMITTED; stores response_submitted_at and response_summary"
  - method: POST
    path: "/cosmetics/responsible-persons"
    description: "Create a responsible person (the label-of-record designee). Create-root endpoint: X-User-ID is not ownership-checked, and the returned ResponsiblePerson.id is the value a ResponsiblePersonAgent sends as X-User-ID thereafter."
    roles: [ResponsiblePersonAgent]
    code: 201
    input: [legal_name, us_address_line, contact_phone, contact_email, "designation_cap?"]
    output: ResponsiblePerson
    side_effects:
      - "creates ResponsiblePerson{status: DORMANT, active_designation_count: 0, designation_cap: 25 unless overridden}"
  - method: GET
    path: "/cosmetics/responsible-persons/{id}"
    description: "Read one responsible person, including the live active_designation_count that the designation cap is checked against."
    roles: [ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: []
    output: ResponsiblePerson
    side_effects: []
  - method: POST
    path: "/cosmetics/listings"
    description: "Create a DRAFT product listing under a registered facility, naming its responsible person, category code, product form and label contact channel."
    roles: [ResponsiblePersonAgent]
    code: 201
    input: [facility_id, responsible_person_id, product_name, category_code, product_form, "professional_use_only?", "professional_use_statement_present?", label_contact_type, label_contact_value, "lot_authorized_units?"]
    output: ProductListing
    side_effects:
      - "creates ProductListing{listing_status: DRAFT, safety_status: UNSUBSTANTIATED, allergen_disclosure_complete: true, undisclosed_allergen_count: 0, distributed_units_total: 0, open_recall_count: 0, open_serious_event_count: 0, marketable: false, version: 1}"
      - "rejects with ERR_UNKNOWN_CATEGORY_CODE when category_code is not in the registry"
  - method: GET
    path: "/cosmetics/listings/{id}"
    description: "Read one listing with both state dimensions, its allergen and recall counters, and the version the transfer OCC rule checks."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: []
    output: ProductListing
    side_effects: []
  - method: GET
    path: "/cosmetics/listings"
    description: "List product listings, filterable by owning facility, responsible person, and either state dimension."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["facility_id?", "responsible_person_id?", "listing_status?", "safety_status?", "limit?", "offset?"]
    output: ProductListing[]
    side_effects: []
  - method: POST
    path: "/cosmetics/listings/{id}/ingredients"
    description: "Add an ingredient to a listing, including its fragrance-allergen flag, concentration and label-disclosure state."
    roles: [ResponsiblePersonAgent]
    code: 201
    input: [inci_name, "cas_number?", function_code, concentration_pct, "is_fragrance_allergen?", "label_disclosed?", "is_data_gap_flag?"]
    output: ProductIngredient
    side_effects:
      - "computes ProductIngredient.disclosure_required per calculations.allergen_disclosure_completeness"
      - "recomputes ProductListing.undisclosed_allergen_count, allergen_disclosure_complete and marketable"
      - "recomputes SafetySubstantiation.data_gap_present on any non-SUPERSEDED dossier of the listing"
  - method: GET
    path: "/cosmetics/listings/{id}/ingredients"
    description: "List the listing's ingredients in ascending created_at order, with per-ingredient disclosure_required."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["is_fragrance_allergen?"]
    output: ProductIngredient[]
    side_effects: []
  - method: POST
    path: "/cosmetics/listings/{id}/submit"
    description: "Submit the listing for agency review. Gates on facility registration and posture, substantiation adequacy, allergen-disclosure completeness, professional-use labeling, label contact channel and the designee's designation cap."
    roles: [ResponsiblePersonAgent]
    code: 200
    input: []
    output: ProductListing
    side_effects:
      - "ProductListing DRAFT or RETURNED -> SUBMITTED"
      - "increments ResponsiblePerson.active_designation_count by 1 and sets its status = ACTIVE"
      - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION}"
      - "increments ProductListing.version and ResponsiblePerson.version by 1"
  - method: POST
    path: "/cosmetics/listings/{id}/listing-decision"
    description: "List or return a SUBMITTED listing. LIST mints the listing_number and makes the product marketable; RETURN releases the designation slot."
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision, "decision_note?"]
    output: ProductListing
    side_effects:
      - "ProductListing SUBMITTED -> LISTED (LIST) or -> RETURNED (RETURN)"
      - "on LIST: mints listing_number, increments Facility.listed_product_count, recomputes marketable"
      - "on RETURN: decrements ResponsiblePerson.active_designation_count and flips it to DORMANT at 0"
      - "increments ProductListing.version by 1"
  - method: POST
    path: "/cosmetics/listings/{id}/transfer-responsible-person"
    description: "Move the listing's responsible-person designation to another designee. OCC write endpoint for concurrency_rules.transfer-designation-stale-listing."
    roles: [ResponsiblePersonAgent]
    code: 200
    input: [responsible_person_id, expected_listing_version]
    output: ProductListing
    side_effects:
      - "rejects with ERR_STALE_LISTING_VERSION (412) when expected_listing_version != ProductListing.version"
      - "sets ProductListing.responsible_person_id to the incoming designee"
      - "when the listing occupies a designation slot (listing_status IN {SUBMITTED, LISTED}): decrements the outgoing ResponsiblePerson.active_designation_count (DORMANT at 0) and increments the incoming one (ACTIVE), conserving the total slot count"
      - "increments ProductListing.version by 1 and each touched ResponsiblePerson.version by 1"
  - method: POST
    path: "/cosmetics/listings/{id}/delist"
    description: "Withdraw the product from the listing register. Blocked while any recall on the listing is open."
    roles: [ResponsiblePersonAgent, EnforcementOfficer]
    code: 200
    input: ["reason?"]
    output: ProductListing
    side_effects:
      - "ProductListing LISTED, SUSPENDED or RETURNED -> DELISTED; clears suspension_reason"
      - "releases the designation slot when one was held, decrements Facility.listed_product_count when the prior status was LISTED"
      - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION}"
      - "increments ProductListing.version by 1"
  - method: POST
    path: "/cosmetics/listings/{id}/substantiations"
    description: "Open a safety-substantiation dossier for the listing. Any earlier non-SUPERSEDED dossier is superseded and the listing's safety_status resets to UNSUBSTANTIATED."
    roles: [ResponsiblePersonAgent]
    code: 201
    input: [assessor_name, assessment_basis]
    output: SafetySubstantiation
    side_effects:
      - "creates SafetySubstantiation{status: DRAFT, revision_round: 0, adequacy_score: null, review_mode: null}"
      - "moves every prior non-SUPERSEDED dossier of the listing to SUPERSEDED"
      - "sets ProductListing.safety_status = UNSUBSTANTIATED and recomputes marketable"
      - "sets data_gap_present from the listing's is_data_gap_flag ingredients"
  - method: GET
    path: "/cosmetics/listings/{id}/substantiations"
    description: "List the listing's substantiation dossiers, newest first, including superseded ones."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["status?"]
    output: SafetySubstantiation[]
    side_effects: []
  - method: GET
    path: "/cosmetics/substantiations/{id}"
    description: "Read one substantiation dossier, including adequacy_score, review_mode, revision_round and both reviewer ids used by the segregation-of-duties rule."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: []
    output: SafetySubstantiation
    side_effects: []
  - method: POST
    path: "/cosmetics/substantiations/{id}/review-items"
    description: "Attach a toxicological evidence item to a dossier that is still editable (DRAFT, DEFICIENT or REVALIDATION_REQUIRED)."
    roles: [ResponsiblePersonAgent]
    code: 201
    input: [evidence_type, reviewer_credential, citation]
    output: ToxicologicalReviewItem
    side_effects:
      - "creates ToxicologicalReviewItem{screening_contribution: 0.00, full_contribution: 0.00} — the contributions are filled in by the review decision"
  - method: GET
    path: "/cosmetics/substantiations/{id}/review-items"
    description: "List a dossier's toxicological evidence items with the per-item contributions each variant assigned."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["evidence_type?"]
    output: ToxicologicalReviewItem[]
    side_effects: []
  - method: POST
    path: "/cosmetics/substantiations/{id}/submit"
    description: "Submit or resubmit the dossier for review. Requires at least one evidence item and a non-frozen facility."
    roles: [ResponsiblePersonAgent]
    code: 200
    input: []
    output: SafetySubstantiation
    side_effects:
      - "SafetySubstantiation DRAFT, DEFICIENT or REVALIDATION_REQUIRED -> SUBMITTED; increments revision_round by 1"
      - "sets ProductListing.safety_status = UNDER_SUBSTANTIATION and recomputes marketable"
      - "refreshes data_gap_present from the listing's ingredients"
      - "increments SafetySubstantiation.version and ProductListing.version by 1"
  - method: POST
    path: "/cosmetics/substantiations/{id}/review-decision"
    description: "Score the dossier under the requested review_mode per calculations.substantiation_adequacy_score and rule it ADEQUATE (>= 60.00) or DEFICIENT. A FULL decision may not be issued by the reviewer who ran the SCREENING pass."
    roles: [RegulatoryReviewer]
    code: 200
    input: [review_mode]
    output: SafetySubstantiation
    side_effects:
      - "computes adequacy_score, stores review_mode and decided_at, and records X-User-ID in screening_reviewer_user_id (SCREENING) or full_reviewer_user_id (FULL)"
      - "writes screening_contribution and full_contribution onto every ToxicologicalReviewItem of the dossier"
      - "SafetySubstantiation SUBMITTED -> ADEQUATE or DEFICIENT"
      - "sets ProductListing.safety_status = SUBSTANTIATED or SUBSTANTIATION_FAILED and recomputes marketable"
      - "appends ComplianceLedgerEntry{entry_type: STATE_TRANSITION}"
      - "increments SafetySubstantiation.version and ProductListing.version by 1"
  - method: POST
    path: "/cosmetics/listings/{id}/adverse-events"
    description: "Record an adverse event against a listing. A SERIOUS event immediately becomes REPORT_DUE with a 15-day deadline; a NON_SERIOUS event is RETAINED for the recordkeeping period only."
    roles: [ResponsiblePersonAgent]
    code: 201
    input: [event_description, received_at, seriousness, "outcome_code?"]
    output: AdverseEvent
    side_effects:
      - "creates AdverseEvent{report_status: RECORDED} then applies the automatic transition to REPORT_DUE (SERIOUS) or RETAINED (NON_SERIOUS)"
      - "on SERIOUS: sets deadline_basis_at = received_at and deadline_at per calculations.serious_event_report_deadline, increments ProductListing.open_serious_event_count and Facility.open_serious_event_count"
      - "sets retention_until per the retention constants"
  - method: GET
    path: "/cosmetics/listings/{id}/adverse-events"
    description: "List the listing's adverse events with their report status, deadlines, lateness and per-event points."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["seriousness?", "report_status?"]
    output: AdverseEvent[]
    side_effects: []
  - method: POST
    path: "/cosmetics/adverse-events/{id}/report"
    description: "File the serious-event report. Timeliness is judged against deadline_at; the resulting points feed the facility's posture, which can cascade into substantiation revalidation."
    roles: [ResponsiblePersonAgent]
    code: 200
    input: ["report_narrative?"]
    output: AdverseEvent
    side_effects:
      - "AdverseEvent REPORT_DUE or REPORT_OVERDUE -> REPORTED_TIMELY or REPORTED_LATE; sets submitted_at, lateness_days and event_points"
      - "recomputes Facility.serious_event_points and Facility.compliance_posture"
      - "on escalation out of OPEN: moves every ADEQUATE SafetySubstantiation of the facility to REVALIDATION_REQUIRED and each such ProductListing.safety_status to REVALIDATION_REQUIRED with marketable false"
      - "decrements ProductListing.open_serious_event_count and Facility.open_serious_event_count"
      - "appends ComplianceLedgerEntry{entry_type: ADVERSE_EVENT_REPORT} plus POSTURE_CHANGE and per-listing STATE_TRANSITION entries when the posture moved"
  - method: POST
    path: "/cosmetics/adverse-events/{id}/reclassify"
    description: "Reclassify a RETAINED non-serious event as SERIOUS. The 15-day clock is rebased on the reclassification instant, not on received_at."
    roles: [RegulatoryReviewer, ResponsiblePersonAgent]
    code: 200
    input: [seriousness, "outcome_code?"]
    output: AdverseEvent
    side_effects:
      - "AdverseEvent RETAINED -> REPORT_DUE; sets reclassified_at = logical clock now, deadline_basis_at = reclassified_at and a new deadline_at"
      - "increments ProductListing.open_serious_event_count and Facility.open_serious_event_count"
      - "extends retention_until to the 6-year serious-event term"
  - method: POST
    path: "/cosmetics/listings/{id}/recall-actions"
    description: "Open a recall action against a listing, either as an agency order or a voluntary notice."
    roles: [EnforcementOfficer]
    code: 201
    input: [initiation_basis, hazard_class]
    output: RecallAction
    side_effects:
      - "creates RecallAction{status: PLAN_REQUIRED, plan_round: 0}"
      - "increments ProductListing.open_recall_count by 1 and recomputes marketable"
  - method: GET
    path: "/cosmetics/listings/{id}/recall-actions"
    description: "List the recall actions opened against a listing."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["status?"]
    output: RecallAction[]
    side_effects: []
  - method: GET
    path: "/cosmetics/recall-actions/{id}"
    description: "Read one recall action, including plan_round, the plan-decision user id used by the segregation-of-duties rule, and the version the withdrawal OCC rule checks."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: []
    output: RecallAction
    side_effects: []
  - method: POST
    path: "/cosmetics/recall-actions/{id}/plan"
    description: "Submit or revise the recall plan. At most MAX_PLAN_ROUNDS (3) submissions are accepted; the third rejection escalates the action to a mandatory recall."
    roles: [ResponsiblePersonAgent]
    code: 200
    input: [corrective_summary, distribution_depth]
    output: RecallAction
    side_effects:
      - "RecallAction PLAN_REQUIRED or PLAN_REJECTED -> PLAN_SUBMITTED; increments plan_round and sets plan_submitted_at"
      - "increments RecallAction.version by 1"
  - method: POST
    path: "/cosmetics/recall-actions/{id}/plan-decision"
    description: "Accept or reject a submitted recall plan. A rejection at plan_round 3 escalates a MANDATORY_ORDER recall to ESCALATED_MANDATORY and fires the four-hop suspension cascade; a VOLUNTARY_NOTICE recall instead returns to PLAN_REJECTED with plan_round 3, after which any further plan submission is refused with ERR_RECALL_PLAN_ROUNDS_EXHAUSTED."
    roles: [EnforcementOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: RecallAction
    side_effects:
      - "stores plan_decision_user_id = X-User-ID and plan_decision_at — this user is barred from the effectiveness-check on this recall's withdrawals"
      - "RecallAction PLAN_SUBMITTED -> PLAN_ACCEPTED, PLAN_REJECTED, or ESCALATED_MANDATORY when plan_round == 3 AND initiation_basis == MANDATORY_ORDER"
      - "on ESCALATED_MANDATORY: suspends the listing with suspension_reason = RECALL_ESCALATION, releases its designation slot, forces Facility.compliance_posture = FROZEN and moves the facility's ADEQUATE substantiations to REVALIDATION_REQUIRED"
      - "appends ComplianceLedgerEntry{entry_type: RECALL_DECISION} plus POSTURE_CHANGE and STATE_TRANSITION entries on escalation"
      - "increments RecallAction.version by 1"
  - method: POST
    path: "/cosmetics/recall-actions/{id}/withdrawals"
    description: "Open a market-withdrawal execution round under an accepted or extended recall. OCC write endpoint for concurrency_rules.withdrawal-create-stale-recall."
    roles: [EnforcementOfficer, ResponsiblePersonAgent]
    code: 201
    input: [scope_depth, expected_recall_action_version]
    output: MarketWithdrawal
    side_effects:
      - "rejects with ERR_STALE_RECALL_VERSION (412) when expected_recall_action_version != RecallAction.version"
      - "moves any prior non-terminal MarketWithdrawal of this recall to SUPERSEDED and releases its DistributionRecord links (withdrawal_id = null)"
      - "creates MarketWithdrawal{status: OPEN, records_produced_count: 0, shipped_units_total: 0, outstanding_units_total: 0, reported_recovery_rate: 0.00, verified_recovery_rate: 0.00}"
      - "RecallAction PLAN_ACCEPTED, EXECUTING or EXTENDED -> EXECUTING"
      - "increments RecallAction.version by 1"
  - method: GET
    path: "/cosmetics/recall-actions/{id}/withdrawals"
    description: "List the withdrawal rounds opened under a recall action, newest first."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["status?"]
    output: MarketWithdrawal[]
    side_effects: []
  - method: GET
    path: "/cosmetics/withdrawals/{id}"
    description: "Read one withdrawal round with every pinned intermediate of the verified-basis calculation (provisional rate, unreachable credit, adjusted denominator, final rate)."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: []
    output: MarketWithdrawal
    side_effects: []
  - method: POST
    path: "/cosmetics/withdrawals/{id}/records-production"
    description: "Produce the distribution records for the withdrawal — the regulator-facing document production step. Links each named record to this withdrawal and fixes the shipped-unit denominator."
    roles: [ResponsiblePersonAgent]
    code: 200
    input: [distribution_record_ids]
    output: MarketWithdrawal
    side_effects:
      - "sets DistributionRecord.withdrawal_id for every named record"
      - "MarketWithdrawal OPEN -> RECORDS_PRODUCED; sets records_produced_count, shipped_units_total and outstanding_units_total"
  - method: POST
    path: "/cosmetics/withdrawals/{id}/recovery-entries"
    description: "Post one recovery movement against a produced distribution record: reported, in-transit, verified, or a correction reversal. Verified movements are capped by the record's outstanding units; reversals are capped by the target bucket's balance."
    roles: [ResponsiblePersonAgent]
    code: 201
    input: [entry_kind, distribution_record_id, units, "reversal_target_bucket?"]
    output: DistributionRecord
    side_effects:
      - "accumulates the named bucket on the DistributionRecord (or subtracts it for CORRECTION_REVERSAL) and re-derives units_outstanding"
      - "recomputes MarketWithdrawal.reported_recovered_units, verified_recovered_units and outstanding_units_total"
      - "on a verified movement or its reversal: appends ComplianceLedgerEntry{entry_type: UNIT_MOVEMENT, signed_units_delta: +units or -units}"
      - "recomputes ProductListing.distributed_units_total"
  - method: POST
    path: "/cosmetics/withdrawals/{id}/effectiveness-check"
    description: "Run the effectiveness review. REPORTED_BASIS is an interim, repeatable review; VERIFIED_BASIS applies the pinned four-step unreachable-consignee adjustment and closes the round (and its recall) as EFFECTIVE or EXTENDED_INEFFECTIVE. The officer who decided the recall plan is barred from this call."
    roles: [EnforcementOfficer]
    code: 200
    input: [basis]
    output: MarketWithdrawal
    side_effects:
      - "REPORTED_BASIS: computes reported_recovered_units and reported_recovery_rate, sets effectiveness_verdict = INTERIM and effectiveness_reviewer_user_id, moves the withdrawal to INTERIM_REVIEWED (self-loop when already there)"
      - "VERIFIED_BASIS: computes provisional_verified_rate, unreachable_credit_pct, adjusted_denominator_units and verified_recovery_rate per calculations.withdrawal_recovery_rate"
      - "VERIFIED_BASIS: MarketWithdrawal -> CLOSED_EFFECTIVE (>= 90.00) or EXTENDED_INEFFECTIVE, and the parent RecallAction -> CLOSED_EFFECTIVE (setting effectiveness_rate_final and decrementing ProductListing.open_recall_count) or EXTENDED"
      - "appends ComplianceLedgerEntry{entry_type: WITHDRAWAL_CLOSURE} on closure"
  - method: POST
    path: "/cosmetics/listings/{id}/distribution-records"
    description: "Record a shipment of the product to a consignee over a closed-closed [ship_date, delivery_date] window. Windows of the same lot_code may not overlap or touch, and the lot's aggregate units may not exceed lot_authorized_units."
    roles: [ResponsiblePersonAgent]
    code: 201
    input: [lot_code, consignee_name, consignee_class, ship_date, delivery_date, units_shipped]
    output: DistributionRecord
    side_effects:
      - "creates DistributionRecord{withdrawal_id: null, every recovery bucket 0, units_outstanding: units_shipped}"
      - "increments ProductListing.distributed_units_total by units_shipped"
  - method: GET
    path: "/cosmetics/distribution-records"
    description: "List distribution records, filterable by listing, by withdrawal linkage, and by lot code."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: ["listing_id?", "withdrawal_id?", "lot_code?", "limit?", "offset?"]
    output: DistributionRecord[]
    side_effects: []
  - method: GET
    path: "/cosmetics/distribution-records/{id}"
    description: "Read one distribution record with all five recovery buckets and the derived units_outstanding used by the conservation invariant."
    roles: [FacilityRegistrant, ResponsiblePersonAgent, RegulatoryReviewer, EnforcementOfficer, SystemOperator]
    code: 200
    input: []
    output: DistributionRecord
    side_effects: []
  - method: POST
    path: "/cosmetics/_clock/set_current_utc"
    description: "Test-driving endpoint (last rung of the §1.5 priority ladder): set the server's logical clock to any UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — that is the mandatory startup default, and the server MUST NOT fall back to real wall-clock time. Every deadline, window and period comparison in this scaffold reads the logical clock."
    roles: [SystemOperator]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects:
      - "sets the logical clock; performs no state transitions of its own"
  - method: POST
    path: "/cosmetics/_ops/compliance-sweep"
    description: "Ops-run checkpoint. Executes three ordered steps against the logical clock: (1) registration lapse and renewal-due marking, (2) serious-event overdue marking, (3) inspection closure and escalation. Idempotent for a fixed clock value — a second call with an unchanged clock reports all-zero counts."
    roles: [SystemOperator]
    code: 200
    input: []
    output: "{ renewal_due_facility_count: integer, lapsed_facility_count: integer, suspended_listing_count: integer, overdue_event_count: integer, closed_vai_count: integer, escalated_oai_count: integer, revalidation_required_count: integer, swept_at: string }"
    side_effects:
      - "STEP 1 — facilities in ascending Facility.created_at order: REGISTERED -> RENEWAL_DUE when the renewal window is open, and REGISTERED/RENEWAL_DUE -> LAPSED past current_period_end, firing the four-hop lapse cascade (posture FROZEN, listings SUSPENDED, designation counts decremented, responsible persons DORMANT) and expiring the ACTIVE RegistrationPeriod; because that posture move is an escalation out of OPEN it also fires the substantiation-revalidation cascade of calculations.facility_compliance_posture (every ADEQUATE SafetySubstantiation of the facility -> REVALIDATION_REQUIRED, each such ProductListing.safety_status -> REVALIDATION_REQUIRED), counted in revalidation_required_count"
      - "STEP 2 — adverse events in ascending AdverseEvent.created_at order: REPORT_DUE -> REPORT_OVERDUE past deadline_at, recomputing per-event points, facility points, posture, and the substantiation-revalidation cascade; appends ComplianceLedgerEntry{entry_type: DEADLINE_BREACH} per event"
      - "STEP 3 — inspections in ascending InspectionEngagement.created_at order: RESPONSE_SUBMITTED -> CLOSED_VAI (readiness_score >= 70.00) or ESCALATED_OAI, and OBSERVATIONS_ISSUED -> ESCALATED_OAI once response_due_at has passed; an OAI outcome forces posture >= RESTRICTED and fires the revalidation cascade"
      - "returns the per-step counts and the swept_at instant; step order is fixed so a facility that lapses in step 1 also has its events swept in step 2 within the same call"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog (one entry per §1.4 priority; every code is triggerable)
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or blank"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "the {id} facility segment does not resolve to a Facility"
  - id: ERR_RESPONSIBLE_PERSON_NOT_FOUND
    http: 404
    condition: "a responsible_person_id in the path or payload does not resolve to a ResponsiblePerson"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "the {id} listing segment, or a facility_id/listing_id in a payload, does not resolve to a ProductListing"
  - id: ERR_SUBSTANTIATION_NOT_FOUND
    http: 404
    condition: "the {id} substantiation segment does not resolve to a SafetySubstantiation"
  - id: ERR_ADVERSE_EVENT_NOT_FOUND
    http: 404
    condition: "the {id} adverse-event segment does not resolve to an AdverseEvent"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "the {inspection_id} segment does not resolve to an InspectionEngagement of the facility named in the path"
  - id: ERR_RECALL_ACTION_NOT_FOUND
    http: 404
    condition: "the {id} recall-action segment does not resolve to a RecallAction"
  - id: ERR_WITHDRAWAL_NOT_FOUND
    http: 404
    condition: "the {id} withdrawal segment does not resolve to a MarketWithdrawal"
  - id: ERR_OWNERSHIP_CHANGE_NOT_FOUND
    http: 404
    condition: "the {id} ownership-change segment does not resolve to an OwnershipChangeUpdate"
  - id: ERR_DISTRIBUTION_RECORD_NOT_FOUND
    http: 404
    condition: "a distribution_record_id in a records-production or recovery-entry payload does not resolve to a DistributionRecord"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a FacilityRegistrant acts on a facility whose id differs from X-User-ID, or a ResponsiblePersonAgent acts on a listing whose responsible_person_id differs from X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "request body fails the endpoint's input schema: missing required field, wrong type, out-of-range enum, or a violated length/numeric bound"
  - id: ERR_UNKNOWN_CATEGORY_CODE
    http: 422
    condition: "category_code is not a key of CATEGORY_CODE_REGISTRY"
  - id: ERR_INVALID_WINDOW_BOUNDS
    http: 422
    condition: "window_start >= window_end on an inspection, or ship_date > delivery_date on a distribution record"
  - id: ERR_STALE_FACILITY_VERSION
    http: 412
    condition: "expected_facility_version does not equal the current Facility.version on an ownership-change filing"
  - id: ERR_STALE_LISTING_VERSION
    http: 412
    condition: "expected_listing_version does not equal the current ProductListing.version on a responsible-person transfer"
  - id: ERR_STALE_RECALL_VERSION
    http: 412
    condition: "expected_recall_action_version does not equal the current RecallAction.version on a withdrawal creation"
  - id: ERR_FACILITY_NOT_REGISTERED
    http: 409
    condition: "the governing facility's registration_status is not REGISTERED or RENEWAL_DUE"
  - id: ERR_FACILITY_POSTURE_FROZEN
    http: 409
    condition: "the governing facility's compliance_posture is FROZEN"
  - id: ERR_INVALID_FACILITY_STATE
    http: 409
    condition: "the facility's registration_status does not admit the requested registration transition"
  - id: ERR_INVALID_OWNERSHIP_CHANGE_STATE
    http: 409
    condition: "the ownership-change update is not FILED"
  - id: ERR_INVALID_LISTING_STATE
    http: 409
    condition: "the listing's listing_status does not admit the requested operation"
  - id: ERR_INVALID_SUBSTANTIATION_STATE
    http: 409
    condition: "the substantiation's status does not admit the requested operation"
  - id: ERR_INVALID_ADVERSE_EVENT_STATE
    http: 409
    condition: "the adverse event's report_status does not admit the requested report or reclassification"
  - id: ERR_INVALID_INSPECTION_STATE
    http: 409
    condition: "the inspection engagement's status does not admit issuing observations or submitting a response"
  - id: ERR_INVALID_RECALL_STATE
    http: 409
    condition: "the recall action's status does not admit the requested plan, decision or withdrawal creation"
  - id: ERR_INVALID_WITHDRAWAL_STATE
    http: 409
    condition: "the withdrawal's status does not admit records production, a recovery entry, or an effectiveness check"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the recall's plan-decision officer running an effectiveness check, or the dossier's screening reviewer issuing the FULL decision"
  - id: ERR_SUBSTANTIATION_NOT_ADEQUATE
    http: 422
    condition: "the listing's safety_status is not SUBSTANTIATED at submit"
  - id: ERR_ALLERGEN_DISCLOSURE_INCOMPLETE
    http: 422
    condition: "the listing has at least one fragrance allergen at or above its product-form threshold that is not label_disclosed"
  - id: ERR_PROFESSIONAL_USE_LABEL_REQUIRED
    http: 422
    condition: "professional_use_only is true while the professional-use statement is absent or the category code is not professional-use-permitted"
  - id: ERR_LABEL_CONTACT_REQUIRED
    http: 422
    condition: "the label contact channel is not admissible for this listing's professional-use flag, or label_contact_value is blank"
  - id: ERR_NO_REVIEW_ITEMS
    http: 422
    condition: "a substantiation is submitted with zero ToxicologicalReviewItem rows"
  - id: ERR_FULL_REVIEW_REQUIRED_FOR_DATA_GAP
    http: 422
    condition: "review_mode is SCREENING on a dossier whose data_gap_present is true"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 422
    condition: "a renewal is filed before the facility's renewal_window_open_date"
  - id: ERR_GRACE_PERIOD_EXPIRED
    http: 422
    condition: "a renewal is filed after the facility's grace_end_date"
  - id: ERR_RECEIVED_AT_IN_FUTURE
    http: 422
    condition: "an adverse event's received_at is after the logical clock"
  - id: ERR_INSPECTION_OUTSIDE_REGISTRATION_PERIOD
    http: 422
    condition: "the requested inspection window is not contained in the facility's current registration period"
  - id: ERR_INSPECTION_RESPONSE_WINDOW_CLOSED
    http: 422
    condition: "an observation response is submitted after response_due_at"
  - id: ERR_INSPECTION_TYPE_BUFFER_VIOLATION
    http: 409
    condition: "the requested window is within 7 days of an existing non-terminal engagement of the SAME inspection_type at the facility"
  - id: ERR_INSPECTION_WINDOW_OVERLAP
    http: 409
    condition: "the requested half-open window overlaps an existing non-terminal engagement window at the facility (adjacency is allowed)"
  - id: ERR_LOT_WINDOW_CONFLICT
    http: 409
    condition: "the requested closed-closed distribution window overlaps or touches an existing window of the same listing and lot_code"
  - id: ERR_DUPLICATE_INGREDIENT
    http: 409
    condition: "an ingredient with the same inci_name already exists on the listing"
  - id: ERR_ABBREVIATED_RENEWAL_NOT_ELIGIBLE
    http: 422
    condition: "renewal_kind is ABBREVIATED while the facility's abbreviated_renewal_eligible is false"
  - id: ERR_RECALL_PLAN_ROUNDS_EXHAUSTED
    http: 409
    condition: "a further recall plan is submitted while plan_round has already reached MAX_PLAN_ROUNDS (3) — the reachable case is a VOLUNTARY_NOTICE recall left in PLAN_REJECTED by its third rejection"
  - id: ERR_OPEN_RECALL_BLOCKS_DELIST
    http: 409
    condition: "a delist is attempted while the listing's open_recall_count is greater than 0"
  - id: ERR_TRANSFER_TARGET_SAME_PERSON
    http: 422
    condition: "a transfer names the responsible person the listing is already designated to"
  - id: ERR_DISTRIBUTION_RECORD_LISTING_MISMATCH
    http: 422
    condition: "a produced distribution record belongs to a different listing than the withdrawal's recalled listing"
  - id: ERR_RECORD_NOT_IN_WITHDRAWAL
    http: 422
    condition: "a recovery entry names a distribution record that is not linked to the withdrawal in the path"
  - id: ERR_NO_DISTRIBUTION_RECORDS
    http: 422
    condition: "records production names zero records, or an effectiveness check runs on a withdrawal with records_produced_count == 0"
  - id: ERR_DESIGNATION_CAP_EXCEEDED
    http: 422
    condition: "the receiving responsible person already holds designation_cap active designations"
  - id: ERR_LOT_CAPACITY_EXCEEDED
    http: 422
    condition: "the lot's aggregate units_shipped including the requested record would exceed lot_authorized_units"
  - id: ERR_RECOVERY_EXCEEDS_OUTSTANDING
    http: 422
    condition: "a verified recovery entry exceeds the target record's units_outstanding"
  - id: ERR_REVERSAL_EXCEEDS_RECORDED
    http: 422
    condition: "a correction reversal exceeds the current balance of the named bucket"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: FacilityRegistrant
    description: "The establishment's registrant of record: creates and renews the facility registration, files ownership changes, and answers inspection observations."
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /cosmetics/facilities"
      - "POST /cosmetics/facilities/{id}/submit-registration"
      - "POST /cosmetics/facilities/{id}/renewals"
      - "POST /cosmetics/facilities/{id}/ownership-changes"
      - "POST /cosmetics/facilities/{id}/inspections/{inspection_id}/response"
    shared_operations:
      - "GET /cosmetics/facilities/{id}"
      - "GET /cosmetics/facilities/{id}/registration-periods"
      - "GET /cosmetics/facilities/{id}/ownership-changes"
      - "GET /cosmetics/facilities/{id}/ledger-entries"
      - "GET /cosmetics/facilities/{id}/inspections"
      - "GET /cosmetics/listings, GET /cosmetics/listings/{id} and the listing sub-resource GETs"
      - "GET /cosmetics/distribution-records and GET /cosmetics/distribution-records/{id}"
    ownership_rule: "X-User-ID MUST equal the Facility.id reached from the path (directly, or via listing.facility_id / inspection.facility_id / ownership_change.facility_id); POST /cosmetics/facilities is the create-root exception."
  - name: ResponsiblePersonAgent
    description: "The responsible person named on the label: files listings, ingredients and substantiation dossiers, records and reports adverse events, submits recall plans, produces distribution records and posts recovery entries."
    identity: "entity_backed:ResponsiblePerson"
    exclusive_operations:
      - "POST /cosmetics/responsible-persons"
      - "POST /cosmetics/listings"
      - "POST /cosmetics/listings/{id}/ingredients"
      - "POST /cosmetics/listings/{id}/submit"
      - "POST /cosmetics/listings/{id}/transfer-responsible-person"
      - "POST /cosmetics/listings/{id}/substantiations"
      - "POST /cosmetics/substantiations/{id}/review-items"
      - "POST /cosmetics/substantiations/{id}/submit"
      - "POST /cosmetics/listings/{id}/adverse-events"
      - "POST /cosmetics/adverse-events/{id}/report"
      - "POST /cosmetics/recall-actions/{id}/plan"
      - "POST /cosmetics/listings/{id}/distribution-records"
      - "POST /cosmetics/withdrawals/{id}/records-production"
      - "POST /cosmetics/withdrawals/{id}/recovery-entries"
    shared_operations:
      - "POST /cosmetics/adverse-events/{id}/reclassify (with RegulatoryReviewer)"
      - "POST /cosmetics/listings/{id}/delist (with EnforcementOfficer)"
      - "POST /cosmetics/recall-actions/{id}/withdrawals (with EnforcementOfficer)"
      - "every GET in §1.5 except GET /cosmetics/facilities"
    ownership_rule: "X-User-ID MUST equal the ProductListing.responsible_person_id reached from the path (directly, or via substantiation.listing_id, adverse_event.listing_id, recall_action.listing_id, or withdrawal -> recall_action -> listing); POST /cosmetics/responsible-persons is the create-root exception, and POST /cosmetics/listings compares X-User-ID against the payload's responsible_person_id."
  - name: RegulatoryReviewer
    description: "Agency reviewer: decides registrations, ownership changes and listings, scores substantiation dossiers, schedules inspections and issues observations."
    identity: opaque
    exclusive_operations:
      - "POST /cosmetics/facilities/{id}/registration-decision"
      - "POST /cosmetics/ownership-changes/{id}/decision"
      - "POST /cosmetics/listings/{id}/listing-decision"
      - "POST /cosmetics/substantiations/{id}/review-decision"
      - "POST /cosmetics/facilities/{id}/inspections"
      - "POST /cosmetics/facilities/{id}/inspections/{inspection_id}/observations"
    shared_operations:
      - "POST /cosmetics/adverse-events/{id}/reclassify (with ResponsiblePersonAgent)"
      - "GET /cosmetics/facilities and every other GET in §1.5"
    ownership_rule: "none — an opaque operator id. X-User-ID is persisted on SafetySubstantiation.screening_reviewer_user_id / full_reviewer_user_id and OwnershipChangeUpdate.decided_by_user_id but is never required to equal any entity's id."
  - name: EnforcementOfficer
    description: "Agency enforcement officer: opens recall actions, rules on recall plans, and runs withdrawal effectiveness reviews."
    identity: opaque
    exclusive_operations:
      - "POST /cosmetics/listings/{id}/recall-actions"
      - "POST /cosmetics/recall-actions/{id}/plan-decision"
      - "POST /cosmetics/withdrawals/{id}/effectiveness-check"
    shared_operations:
      - "POST /cosmetics/recall-actions/{id}/withdrawals (with ResponsiblePersonAgent)"
      - "POST /cosmetics/listings/{id}/delist (with ResponsiblePersonAgent)"
      - "GET /cosmetics/facilities and every other GET in §1.5"
    ownership_rule: "none — an opaque operator id, persisted on RecallAction.plan_decision_user_id and MarketWithdrawal.effectiveness_reviewer_user_id for the segregation-of-duties comparison only."
  - name: SystemOperator
    description: "Platform operator: drives the logical clock and runs the compliance sweep checkpoint."
    identity: opaque
    exclusive_operations:
      - "POST /cosmetics/_clock/set_current_utc"
      - "POST /cosmetics/_ops/compliance-sweep"
    shared_operations:
      - "every GET in §1.5"
    ownership_rule: "none — an opaque operator id that is never compared to an entity id."
segregation_rules:
  - name: recall-plan-decider-may-not-verify-effectiveness
    description: |
      The EnforcementOfficer X-User-ID recorded in RecallAction.plan_decision_user_id may not run
      POST /cosmetics/withdrawals/{id}/effectiveness-check on any withdrawal under that recall,
      under either basis. Enforced at validations[priority=30] with ERR_SEGREGATION_OF_DUTIES (403);
      a second, distinct EnforcementOfficer id must perform the review, and its id is stored on
      MarketWithdrawal.effectiveness_reviewer_user_id.
    roles_involved: [EnforcementOfficer]
  - name: screening-reviewer-may-not-issue-full-decision
    description: |
      The RegulatoryReviewer X-User-ID recorded in SafetySubstantiation.screening_reviewer_user_id
      may not issue a review-decision with review_mode == FULL on the same dossier. A SCREENING
      decision by reviewer A therefore forces reviewer B for the FULL pass — which is exactly the
      pass whose variant can flip an ADEQUATE screening result to DEFICIENT.
    roles_involved: [RegulatoryReviewer]
