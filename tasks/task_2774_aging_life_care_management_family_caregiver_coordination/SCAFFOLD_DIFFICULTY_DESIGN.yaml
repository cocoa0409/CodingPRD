  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: comprehensive_acuity_exactly_seventy_is_elevated
        grounds:
          - calculations.assessment_composite_acuity
          - calculations.client_risk_posture
          - entities.Client.fields.risk_posture
          - entities.Client.fields.acuity_score
          - state_machines.Assessment.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Numeric-threshold boundary on the acuity metric, reached through PATCH
          /care/assessments/{assessmentId}/state: ACUITY_ELEVATED_THRESHOLD is inclusive, so a
          weighted score of exactly 3.50 -> 70 yields ELEVATED while 3.45 -> 69 yields ROUTINE; a
          strict `> 70` implementation returns ROUTINE for the 70 case.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "Care manager Dana (author) and supervisor Iris (reviewer)."
            - "Client Gwen with a SUBMITTED assessment scored safety 3, cognition 4, adl 4, medical_complexity 4, social_support 2, finances 2 (weighted 3.50)."
            - "Client Hollis with a SUBMITTED assessment identical except social_support 1 (weighted 3.45)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Gwen Halloran", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli_g: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Hollis Rankin", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli_h: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli_g}", care_manager_id: "${cm_dana}", domain_scores: { adl: 4, cognition: 4, medical_complexity: 4, social_support: 2, safety: 3, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm_g: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli_h}", care_manager_id: "${cm_dana}", domain_scores: { adl: 4, cognition: 4, medical_complexity: 4, social_support: 1, safety: 3, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm_h: $.data.id }
            - call: "PATCH /care/assessments/${asm_g}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { screen_g: $.data.screening_acuity }
            - call: "PATCH /care/assessments/${asm_h}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { screen_h: $.data.screening_acuity }
          trigger:
            - call: "PATCH /care/assessments/${asm_g}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { comp_g: $.data.comprehensive_acuity }
            - call: "PATCH /care/assessments/${asm_h}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { comp_h: $.data.comprehensive_acuity }
          assert:
            - "Assessment.${asm_g}.screening_acuity == 63 and Assessment.${asm_h}.screening_acuity == 60"
            - "Assessment.${asm_g}.comprehensive_acuity == 70"
            - "Assessment.${asm_h}.comprehensive_acuity == 69"
            - "Client.${cli_g}.acuity_score == 70 and Client.${cli_g}.risk_posture == ELEVATED"
            - "Client.${cli_h}.acuity_score == 69 and Client.${cli_h}.risk_posture == ROUTINE"
            - "The two clients differ by exactly one point of social_support, so ELEVATED at 70 is attributable to the inclusive comparison alone"

      - name: invoice_issue_with_empty_final_line_set_rejected
        grounds:
          - validations[priority=73]
          - errors[ERR_NO_BILLABLE_ACTIVITY]
          - calculations.invoice_totals
          - state_machines.Invoice.DRAFT_to_ISSUED
          - entities.Invoice.fields.line_entry_ids
        distinguishing_aspect: |
          A DIFFERENT boundary metric on a DIFFERENT endpoint from the acuity threshold: an
          empty-collection edge reached through PATCH /care/invoices/{invoiceId}/state, where the
          PROVISIONAL line set has exactly one member (so creation succeeds) but the FINAL line set
          recomputes to zero members because the only candidate is still SUBMITTED, and issuing must
          fail rather than issue a zero-value invoice.
        test_recipe:
