              payload: { project_id: "${proj_b1}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_b1: $.data.id, tx_b1_v0: $.data.version }
            - call: "POST /projects/${proj_b1}/zones"
              payload: { transformer_id: "${tx_b1}", label: "Z" }
              as: LightingDesigner
              captures: { zone_b1: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_b1}", model_code: "F80", category: "SPOT", wattage_w: 80, purchase_price_cents: 1000 }
              as: LightingDesigner
              captures: { f1: $.data.id }
            - call: "POST /fixtures/${f1}/assign-zone"
              payload: { zone_id: "${zone_b1}", expected_transformer_version: "${tx_b1_v0}" }
              as: LightingDesigner
              captures: { tx_b1_v1: $.data.version }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_b1}", model_code: "F80", category: "SPOT", wattage_w: 80, purchase_price_cents: 1000 }
              as: LightingDesigner
              captures: { f2: $.data.id }
            - call: "POST /fixtures/${f2}/assign-zone"
              payload: { zone_id: "${zone_b1}", expected_transformer_version: "${tx_b1_v1}" }
              as: LightingDesigner
              captures: { tx_b1_v2: $.data.version }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_b1}", model_code: "F80", category: "SPOT", wattage_w: 80, purchase_price_cents: 1000 }
              as: LightingDesigner
              captures: { f3: $.data.id }
            - call: "POST /fixtures/${f3}/assign-zone"
              payload: { zone_id: "${zone_b1}", expected_transformer_version: "${tx_b1_v2}" }
