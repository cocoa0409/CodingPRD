        excluded_because:
          difficulty_instance: dual_variant_calc / return_premium_pro_rata_vs_short_rate
          rationale: "PRO_RATA vs SHORT_RATE divergence is the core assertion of the named §1.8 instance."

      - name: statement_round_per_line
        claim_type: Precision
        grounds:
          - "calculations.commission_statement_rollup"
        excluded_because:
          difficulty_instance: combinatorial_formula / statement_round_per_line_then_sum_order
          rationale: "Round-per-line-then-sum precision is asserted by the named §1.8 instance."

