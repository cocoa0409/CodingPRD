        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_DUPLICATE_ACTIVE_ALERT]
        distinguishing_aspect: |
          Category pair (business_safety, business_constraint): publishing alert2
          as its own drafter while a duplicate active alert exists violates both
          rule 7 (SoD) and rule 8 (duplicate); ERR_SEGREGATION_OF_DUTIES must win.
          A third publisher then surfaces the constraint error — same request, the
          surviving error changes with the actor, proving order not coincidence.
        test_recipe:
          setup:
            - "alert1 (title 'Tech Support Refund Scam', related business B) DRAFTED by dir-1 and PUBLISHED by dir-2"
            - "alert2 with the identical (title, related_business_id) drafted by dir-2, still DRAFT"
