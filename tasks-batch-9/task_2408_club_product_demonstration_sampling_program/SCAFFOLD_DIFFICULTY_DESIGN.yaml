  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: restricted_club_status_blocks_food_approval_while_admitting_non_food
        grounds:
          - validations[priority=31]
          - entities.Club.fields.club_status
          - entities.DemoEvent.fields.event_type
          - state_machines.DemoEvent.transitions.SUBMITTED_to_CONFIRMED
          - errors[ERR_CLUB_NOT_OPEN]
        distinguishing_aspect: |
          Approval eligibility is not a property of the DemoEvent at all: two
          events sitting in identical SUBMITTED states at the same club on the
          same date diverge purely on Club.club_status crossed with their own
          computed event_type. With the club RESTRICTED, the NON_FOOD_DEMO
          event approves to CONFIRMED and the FOOD_SAMPLING event is refused
          with ERR_CLUB_NOT_OPEN; flipping the club back to OPEN — a PATCH on
          a completely different resource, with no call on the event — makes
          the byte-identical APPROVE succeed. The gate is therefore a
          two-dimensional cross-entity predicate, not a one-way status check.
        test_recipe:
          setup:
            - "Club C created OPEN with daily_event_capacity 4 and food_station_count 2."
            - "FOOD product PF (category BAKERY) and NON_FOOD product PN (category HOUSEHOLD), so the two events never contend on category or food station counts."
            - "DemoEvent F (PF, 2026-09-14 MIDDAY, requested_sample_cases 4) and DemoEvent N (PN, 2026-09-14 MORNING, requested_sample_cases 2), both SUBMITTED and not yet approved."
            - "Club patched to club_status RESTRICTED before any approval is attempted; no event row is touched by that PATCH."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Merrivale Brands", billing_email: "ap@merrivale.example", program_tier: "STANDARD", credit_limit_cents: 4000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-5314", name: "Merrivale Club 5314", region_code: "SE", club_tier: "STANDARD", daily_event_capacity: 4, food_station_count: 2, health_permit_expires_on: "2027-12-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "MB-CRO-314", name: "Butter Croissant Bites", category: "BAKERY", requires_food_handling: true, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 175, samples_per_case: 60, weekly_sample_case_pool: 24 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "MB-BIN-315", name: "Stackable Storage Bin", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 1900, samples_per_case: 4, weekly_sample_case_pool: 24 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { pn_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${pf_id}", event_date: "2026-09-14", day_part: "MIDDAY", requested_sample_cases: 4, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { f_id: "$.data.id" }
            - call: "POST /demo-events/${f_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${pn_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { n_id: "$.data.id" }
            - call: "POST /demo-events/${n_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "PATCH /clubs/${club_id}"
              payload: { club_status: "RESTRICTED" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_status_restricted: "$.data.club_status" }
          trigger:
            - call: "POST /demo-events/${f_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { err_food: "$.data.error_id" }
            - call: "POST /demo-events/${n_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { n_status: "$.data.booking_status", n_allocated: "$.data.allocated_sample_cases" }
            - call: "PATCH /clubs/${club_id}"
              payload: { club_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
            - call: "POST /demo-events/${f_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { f_status: "$.data.booking_status", f_allocated: "$.data.allocated_sample_cases" }
          assert:
            - "${club_status_restricted} == RESTRICTED"
            - "DemoEvent.${f_id}.event_type == FOOD_SAMPLING"
            - "DemoEvent.${n_id}.event_type == NON_FOOD_DEMO"
            - "${err_food} == ERR_CLUB_NOT_OPEN"
            - "the first APPROVE responds with HTTP 409"
            - "${n_status} == CONFIRMED"
            - "${n_allocated} == 2"
            - "${f_status} == CONFIRMED"
            - "${f_allocated} == 4"
            - "DemoEvent.${f_id}.approved_at is not null"
            - "DemoEvent.${f_id}.staffing_status == UNSTAFFED"
            - "GET /clubs/${club_id}/capacity?event_date=2026-09-14 -> confirmed_count == 2"

      - name: variance_flagged_reconciliation_on_another_entity_blocks_invoice_issue
        grounds:
          - validations[priority=46]
          - entities.SampleReconciliation.fields.recon_status
          - state_machines.SampleReconciliation.transitions.VARIANCE_FLAGGED_to_WRITTEN_OFF
          - state_machines.EventInvoice.transitions.DRAFT_to_ISSUED
          - calculations.sample_reconciliation_variance
          - errors[ERR_RECONCILIATION_UNRESOLVED]
        distinguishing_aspect: |
          The invoice is a perfectly well-formed DRAFT and nothing about it or
          its DemoEvent changes, yet ISSUE is refused because a THIRD entity —
          the event's SampleReconciliation — sits in VARIANCE_FLAGGED with
          10 units unaccounted for out of 240 delivered (variance_pct 4.17,
          above VARIANCE_TOLERANCE_PCT 2.00). Resolving that row via write-off
          books a 2100-cent shrink cost and moves it to WRITTEN_OFF, after
          which the identical ISSUE succeeds and rolls 60500 cents onto the
          manufacturer's receivable. Unlike the club-status instance, the
          blocking entity is downstream of the event rather than its parent,
          and the unblocking action is a state transition on that entity rather
          than a field edit.
        test_recipe:
          setup:
            - "Manufacturer M program_tier STANDARD with credit_limit_cents 5000000, so no credit hold can confound the ISSUE result."
            - "Club C club_tier STANDARD; FOOD product P with samples_per_case 60 and unit_cost_cents 210."
            - "DemoEvent E on 2026-09-14 MORNING, requested_sample_cases 4, no add-ons; 4 cases shipped and received in full so cases_delivered is 4 and units_delivered is 240."
            - "One LEAD demonstrator at hourly_rate_cents 2500 works 08:15Z-12:45Z for billable_hours 4.50; event CLOSED_OUT and booking_status COMPLETED."
            - "Reconciliation filed as 200 sampled + 20 wasted + 10 returned = 230, leaving variance_units 10 and variance_pct 4.17 -> VARIANCE_FLAGGED."
            - "Invoice created in DRAFT: BASE 42000 (42000 x STANDARD 1.0 x MORNING 1.0) + STAFFING 13500 (4.50 x 2500 x LEAD 1.2) + HANDLING 3600 (4 x 900) + COLD_CHAIN 1400 (4 x 350) = subtotal 60500, discount 0, total_due 60500."
