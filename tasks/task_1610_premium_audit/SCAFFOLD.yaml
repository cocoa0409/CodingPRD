    roles: [AuditManager]
    code: 200
    input: [auditor_id]
    output: AuditWorkOrder
    side_effects: ["assigned_auditor_id set; allowed only from {SELECTED, RECORDS_REQUESTED}", "territory mismatch -> ERR_AUDITOR_TERRITORY_MISMATCH", "AuditWorkOrder.version increments"]
  - method: POST
    path: "/audit-work-orders/{id}/records-requests"
    description: "Create a records request (transitions SELECTED -> RECORDS_REQUESTED). Precondition: work order status in {SELECTED, RECORDS_REQUESTED} else ERR_INVALID_STATE_TRANSITION"
    roles: [AuditManager]
    code: 201
    input: [request_type]
    output: RecordsRequest
    side_effects: ["work order SELECTED -> RECORDS_REQUESTED", "due_at = requested_at + 15 days", "AuditWorkOrder.version increments"]
  - method: POST
    path: "/audit-work-orders/{id}/appointments"
