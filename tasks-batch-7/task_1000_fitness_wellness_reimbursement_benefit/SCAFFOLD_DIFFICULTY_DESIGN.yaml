  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_verify_requires_provider_active
        grounds:
          - state_machines.Visit.RECORDED_to_VERIFIED
          - state_machines.Provider.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair Visit -> Provider: a RECORDED visit cannot be verified while its provider is
          SUSPENDED, even though the visit row itself is in a reviewable state.
        test_recipe:
          setup: ["Standard fixture; visit v1 RECORDED; provider then SUSPENDED"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T08:00:00Z", check_out_at: "2026-05-02T09:00:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v1: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/suspend", payload: {}, as: BenefitsAdmin }
          trigger:
            - { call: "POST /api/visits/${v1}/verify", payload: {}, as: ClaimsReviewer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROVIDER_NOT_ACTIVE"
            - "Visit.${v1}.status remains RECORDED"

      - name: claim_pay_requires_funding_active
        grounds:
          - state_machines.Claim.UNPAID_to_PAID
          - state_machines.FundingAccount.FUNDED_to_SUSPENDED
        distinguishing_aspect: |
          Pair Claim -> FundingAccount: an APPROVED claim with its HOLD already placed cannot be
          paid while the employer's funding account is SUSPENDED.
        test_recipe:
          setup: ["Standard fixture; claim 3000 APPROVED (hold placed); funding account then SUSPENDED"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/funding-accounts", payload: { employer_id: "${emp_id}", benefit_year: 2026, initial_deposit_cents: 100000 }, as: BenefitsAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-P", line_items: [ { description: "gym", unit_amount_cents: 3000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/claims/${c_id}/start-review", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/claims/${c_id}/approve", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/funding-accounts/${fund_id}/suspend", payload: {}, as: BenefitsAdmin }
          trigger:
            - { call: "POST /api/claims/${c_id}/pay", payload: {}, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FUNDING_NOT_ACTIVE"
            - "Claim.${c_id}.payment_status remains UNPAID"

      - name: claim_create_requires_member_eligible
        grounds:
          - state_machines.Member.ELIGIBLE_to_SUSPENDED
          - validations[priority=4]
        distinguishing_aspect: |
          Pair Claim -> Member: a member flipped ELIGIBLE -> SUSPENDED cannot submit new claims
          even though the enrollment row remains ACTIVE.
        test_recipe:
          setup: ["Standard fixture; member then SUSPENDED"]
          setup_api_calls:
