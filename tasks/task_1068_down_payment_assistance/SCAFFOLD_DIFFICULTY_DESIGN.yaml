      - name: session_enrollment_overlap_for_applicant
        grounds:
          - validations[priority=13]
          - errors[ERR_SESSION_TIME_CONFLICT]
          - entities.EducationSession.fields.start_at
          - entities.EducationSession.fields.end_at
        distinguishing_aspect: |
          Applicant-scoped closed-interval overlap with a 30-minute buffer (SESSION_BUFFER_MINUTES): the
