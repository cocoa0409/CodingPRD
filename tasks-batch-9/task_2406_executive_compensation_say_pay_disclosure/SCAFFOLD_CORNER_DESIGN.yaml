              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies/${acme_id}/executives"
              payload: { full_name: "Dana Reyes", role_title: "CEO", is_neo: true, base_salary_usd: 1200000, sti_target_pct: 150.00 }
              as: CompConsultant
              captures: { ceo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/screen"
              payload: {}
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/approve"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/pay-programs"
              payload: { issuer_company_id: "${acme_id}", peer_group_id: "${pg_id}", ceo_executive_id: "${ceo_id}", fiscal_year: 2026, salary_pct: 15.00, sti_pct: 25.00, lti_pct: 60.00, lti_performance_share_pct: 60.00, sti_max_multiple: 2.0, tsr_percentile_rank: 30.00, meeting_date: "2027-05-12T00:00:00Z" }
              as: CompConsultant
              captures: { pp_id: $.data.id, pp_v0: $.data.version }
            - call: "POST /exec-comp/pay-programs/${pp_id}/outreach-engagements"
              payload: { investor_name: "BlackRock", investor_key: "BLACKROCK", ownership_pct: 20.00, channel: "MEETING" }
              as: InvestorRelationsLead
              captures: { e1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/outreach-engagements/${e1_id}/schedule"
              payload: { window_start: "2027-03-01T00:00:00Z", window_end: "2027-03-12T00:00:00Z" }
              as: InvestorRelationsLead
              captures: { err_past: $.data.error_id }
            - call: "POST /exec-comp/outreach-engagements/${e1_id}/schedule"
              payload: { window_start: "2027-03-10T00:00:00Z", window_end: "2027-03-12T00:00:00Z" }
              as: InvestorRelationsLead
          assert:
            - "${err_past} == 'ERR_ENGAGEMENT_WINDOW_IN_PAST' with HTTP status 422"
            - "after the rejected call OutreachEngagement.${e1_id}.engagement_status == REQUESTED and window_start is null"
            - "the second call returns 200 with engagement_status == SCHEDULED"
            - "OutreachEngagement.${e1_id}.window_start == '2027-03-10T00:00:00Z' and window_end == '2027-03-12T00:00:00Z'"
            - "PayProgram.${pp_id}.outreach_coverage_pct == 0.00 — scheduling alone does not count"

      - name: an_out_of_band_peer_is_rejected_under_size_match_but_admitted_under_the_analogue_waiver
        claim_type: conditional_validation
        grounds:
          - validations.priority_42_ERR_PEER_OUTSIDE_SIZE_BAND
          - entities.PeerGroupMember.fields.inclusion_reason
          - entities.PeerGroupMember.fields.in_size_band
        distinguishing_aspect: |
          The band rule is conditional on the declared inclusion_reason: FOXT's 0.4000 revenue ratio is rejected
          with ERR_PEER_OUTSIDE_SIZE_BAND (422) under SIZE_MATCH, yet the identical company and identical ratios are
          accepted under BUSINESS_MODEL_ANALOG — and the accepted row still records in_size_band false, so the waiver
          suppresses the rejection without falsifying the measurement.
        test_recipe:
          setup:
            - "ACME issuer (revenue 10,000,000,000) and FOXT peer (revenue 4,000,000,000, market cap 8,000,000,000)."
            - "A DRAFT RAW_MEDIAN peer group with no members."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Foxtrot Micro", ticker: "FOXT", is_issuer: false, gics_sector: "TECH", revenue_usd: 4000000000, market_cap_usd: 8000000000, share_price_usd: 20.00, ceo_tdc_usd: 5000000 }
              as: CompConsultant
              captures: { foxt_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
          trigger:
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${foxt_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { err_band: $.data.error_id }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${foxt_id}", inclusion_reason: "BUSINESS_MODEL_ANALOG", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { mem_f: $.data.id }
          assert:
            - "${err_band} == 'ERR_PEER_OUTSIDE_SIZE_BAND' with HTTP status 422"
            - "the waived add returns 201 with PeerGroupMember.${mem_f}.inclusion_reason == BUSINESS_MODEL_ANALOG"
            - "PeerGroupMember.${mem_f}.revenue_ratio == 0.4000 and market_cap_ratio == 0.4000"
            - "PeerGroupMember.${mem_f}.in_size_band == false — the waiver does not rewrite the measurement"
            - "PeerGroup.${pg_id}.accepted_member_count == 1"

      - name: the_lower_priority_bound_check_is_never_reached_once_the_state_gate_fires
        claim_type: priority_ordering
        grounds:
          - validations.priority_11_ERR_PROGRAM_NOT_MUTABLE
          - validations.priority_39_ERR_MIX_COMPONENT_OUT_OF_BOUNDS
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / program_immutability_outranks_mix_component_bounds
          rationale: "That instance violates both rules in one request and asserts the priority-11 error is returned, then isolates each rule to prove both are independently reachable."

      - name: the_referential_gate_runs_before_the_numeric_cap_it_depends_on
        claim_type: cascading_validation
        grounds:
          - validations.priority_25_ERR_PEER_GROUP_NOT_APPROVED
          - validations.priority_46_ERR_TDC_EXCEEDS_BENCHMARK_CAP
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / peer_group_referential_gate_outranks_benchmark_cap_at_program_approval
          rationale: "That instance shows the cap check cannot even be evaluated until the peer group is APPROVED, then approves the group so the cap check runs and fires on its own."

  # =========================================================================
  - section: endpoints
    instances:

      - name: the_pay_for_performance_computed_read_matches_the_stored_program_fields
        claim_type: computed_read
        grounds:
          - endpoints[GET /exec-comp/pay-programs/{id}/pay-for-performance]
          - calculations.pay_for_performance_alignment
          - calculations.realized_and_realizable_pay
          - entities.PayProgram.fields.degree_of_alignment
        distinguishing_aspect: |
          The computed read is a projection of stored state, not an independent recomputation: with one GRANTED
          100,000-unit PSU marked at 50.00 it returns realized 0.00 against realizable 5,000,000.00, pay_percentile_rank
