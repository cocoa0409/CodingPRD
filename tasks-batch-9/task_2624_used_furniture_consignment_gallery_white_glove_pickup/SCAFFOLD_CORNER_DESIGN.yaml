          - errors[ERR_AGREEMENT_NOT_FOUND]
        distinguishing_aspect: "The topology is flat, so ConsignmentItem reaches its owner only through the body FK agreement_id; an id that resolves to no ConsignmentAgreement answers ERR_AGREEMENT_NOT_FOUND with HTTP 404 rather than creating an orphan with a null consignor_id."
        test_recipe:
