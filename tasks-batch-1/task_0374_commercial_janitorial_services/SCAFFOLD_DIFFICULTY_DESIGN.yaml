# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: Commercial Janitorial Services (task_0374)
# Difficulty tier: Expert. Nine §0.5 rules × 2 instances each = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7. Every numeric
# assert literal was computed against the relevant §1.3 formula + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_actual_labor_minutes_on_same_visit
        grounds:
          - calculations.estimate_labor_minutes
          - calculations.actual_labor_minutes
          - entities.Visit.fields.estimated_labor_min
          - entities.Visit.fields.actual_labor_min
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          On the same Visit, estimate_labor_minutes is a forward sqft-projection
          (Site.cleanable_sqft / 50) while actual_labor_minutes is a chronological
          sum of clocked TimeEntry minutes; for sqft=10000 with a single 60-minute
          clocked entry the two diverge (200 vs 60) — the dual-variant subject is
          a Visit's labor minutes.
        test_recipe:
          setup:
            - "An ACTIVE account and ACTIVE site (cleanable_sqft=10000, floor_type=CARPET)."
            - "An AVAILABLE crew."
            - "A ROUTINE Visit on 2026-06-16, planned 09:00–10:00, started and IN_PROGRESS with one COMPLETED TimeEntry clocked 08:00→09:00 (60 min)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 10000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { visit_id: $.data.id, est_min: $.data.estimated_labor_min }
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${visit_id}", crew_id: "${crew_id}", clock_in_min: 480 }
              as: FieldSupervisor
              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/clock-out"
              payload: { clock_out_min: 540 }
              as: FieldSupervisor
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: FieldSupervisor
              captures: { actual_min: $.data.actual_labor_min, est_after: $.data.estimated_labor_min }
          assert:
            - "Visit.${visit_id}.estimated_labor_min == 200"
            - "Visit.${visit_id}.actual_labor_min == 60"
            - "Visit.${visit_id}.estimated_labor_min != Visit.${visit_id}.actual_labor_min"

      - name: provisional_vs_final_period_total_on_billing_period
        grounds:
          - calculations.compute_period_total
          - entities.BillingPeriod.fields.total_cents
          - entities.BillingPeriod.fields.holdback_cents
          - state_machines.BillingPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          On the same BillingPeriod the provisional variant forces holdback_cents=0
          (quality not yet final) while the final variant (on close) computes
          holdback from mean_quality_score vs Site.quality_target; with base=300000
          and a deficient mean the period total moves from 300000 (provisional) to
          285000 (final) — the dual-variant subject is a BillingPeriod's cents total,
          a different entity domain than instance one's Visit minutes.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (quality_target=85), AVAILABLE crew."
            - "An ACTIVE ServiceContract (monthly_base_cents=300000, hourly_rate_cents=6000, quality_holdback_pct=0.05)."
            - "An OPEN BillingPeriod for 2026-06 (base_cents=300000, total_cents=300000 provisional)."
            - "One COMPLETED ROUTINE visit in the period with an Inspection score=50 (below target 85) so the period mean is deficient."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 10000, floor_type: "CARPET", quality_target: 85 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000, quality_holdback_pct: 0.05 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id, prov_total: $.data.total_cents }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-10", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${visit_id}", crew_id: "${crew_id}", clock_in_min: 480 }
              as: FieldSupervisor
              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/clock-out"
              payload: { clock_out_min: 540 }
              as: FieldSupervisor
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: FieldSupervisor
            - call: "POST /inspections"
              payload: { visit_id: "${visit_id}", score: 50 }
              as: FieldSupervisor
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_ver: $.data.version }
          trigger:
            - call: "POST /billing-periods/${period_id}/close"
              payload: { expected_account_version: "${acct_ver}" }
              as: AccountManager
              captures: { final_total: $.data.total_cents, final_holdback: $.data.holdback_cents }
          assert:
            - "BillingPeriod.${period_id}.total_cents was 300000 while OPEN (provisional, holdback 0)"
            - "BillingPeriod.${period_id}.holdback_cents == 15000 after CLOSED (final)"
            - "BillingPeriod.${period_id}.total_cents == 285000 after CLOSED (final)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: periodic_charge_tiered_overage_mode_a
        grounds:
          - calculations.periodic_charge_cents
          - entities.PeriodicJob.fields.quoted_hours
          - entities.Visit.fields.actual_labor_min
          - entities.ServiceContract.fields.hourly_rate_cents
          - state_machines.PeriodicJob.REQUESTED_to_DISPATCHED
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (a): periodic_charge_cents combines >=3 inputs (quoted_min, actual_min,
          hourly_rate_cents) with a non-linear max()/conditional tier — straight
          minutes billed at the base per-minute rate, overage minutes (actual beyond
          quote) billed at 1.5x; quoted 2h (120 min), actual 200 min, rate 6000 →
          straight 12000 + overage 12000 = 24000 cents.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (floor_type=VCT), AVAILABLE crew."
            - "An ACTIVE ServiceContract (hourly_rate_cents=6000)."
            - "A PeriodicJob (job_type=STRIP_WAX, quoted_hours=2) DISPATCHED, producing a PERIODIC Visit."
            - "The PERIODIC Visit started, with one COMPLETED TimeEntry clocked 08:00→11:20 (200 min)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "VCT" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew", shift_capacity_min: 480 }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "POST /periodic-jobs"
              payload: { site_id: "${site_id}", job_type: "STRIP_WAX", quoted_hours: 2, requested_date: "2026-06-12" }
              as: AccountManager
              captures: { job_id: $.data.id }
            - call: "POST /periodic-jobs/${job_id}/dispatch"
              payload: { crew_id: "${crew_id}", service_date: "2026-06-12", planned_start_min: 480, planned_end_min: 720 }
              as: FieldSupervisor
              captures: { visit_id: $.data.visit_id }
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${visit_id}", crew_id: "${crew_id}", clock_in_min: 480 }
              as: FieldSupervisor
              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/clock-out"
              payload: { clock_out_min: 680 }
              as: FieldSupervisor
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: FieldSupervisor
            - call: "GET /billing-periods/${period_id}"
              payload: {}
              as: AccountManager
              captures: { period_periodic: $.data.periodic_cents }
          assert:
            - "Visit.${visit_id}.actual_labor_min == 200"
            - "BillingPeriod.${period_id}.periodic_cents == 24000"

      - name: period_total_pinned_holdback_eval_order_mode_c
        grounds:
          - calculations.compute_period_total
          - entities.BillingPeriod.fields.base_cents
          - entities.BillingPeriod.fields.holdback_cents
          - entities.BillingPeriod.fields.total_cents
          - state_machines.BillingPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (c): compute_period_total has a circular-looking dependency — holdback
          could read as a fraction of the total, but evaluation order is pinned so
          holdback_cents = round(base_cents * quality_holdback_pct) keyed off base
          (step 1), then total = base + periodic - credit - holdback (step 6); for
          base=300000, periodic=24000, credit=0, deficient mean → holdback 15000,
          total 309000 — a different mode (order-pinned cycle) than instance one's
          tiered max() formula.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (floor_type=VCT, quality_target=85), AVAILABLE crew."
            - "An ACTIVE ServiceContract (monthly_base_cents=300000, hourly_rate_cents=6000, quality_holdback_pct=0.05, callback_credit_pct=0.10)."
            - "An OPEN BillingPeriod for 2026-06 (base_cents=300000)."
            - "A COMPLETED PERIODIC visit capturing periodic_cents=24000 (quoted 2h, actual 200 min, rate 6000)."
            - "A COMPLETED ROUTINE visit with Inspection score=70 (below target 85) so mean_quality_score is deficient."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "VCT", quality_target: 85 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew", shift_capacity_min: 480 }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000, callback_credit_pct: 0.10, quality_holdback_pct: 0.05 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "POST /periodic-jobs"
              payload: { site_id: "${site_id}", job_type: "STRIP_WAX", quoted_hours: 2, requested_date: "2026-06-12" }
              as: AccountManager
              captures: { job_id: $.data.id }
            - call: "POST /periodic-jobs/${job_id}/dispatch"
              payload: { crew_id: "${crew_id}", service_date: "2026-06-12", planned_start_min: 480, planned_end_min: 720 }
              as: FieldSupervisor
              captures: { pvisit_id: $.data.visit_id }
            - call: "POST /visits/${pvisit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${pvisit_id}", crew_id: "${crew_id}", clock_in_min: 480 }
              as: FieldSupervisor
              captures: { pte_id: $.data.id }
            - call: "POST /time-entries/${pte_id}/clock-out"
              payload: { clock_out_min: 680 }
              as: FieldSupervisor
            - call: "POST /visits/${pvisit_id}/complete"
              payload: {}
              as: FieldSupervisor
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-14", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { rvisit_id: $.data.id }
            - call: "POST /visits/${rvisit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${rvisit_id}", crew_id: "${crew_id}", clock_in_min: 60 }
              as: FieldSupervisor
              captures: { rte_id: $.data.id }
            - call: "POST /time-entries/${rte_id}/clock-out"
              payload: { clock_out_min: 120 }
              as: FieldSupervisor
            - call: "POST /visits/${rvisit_id}/complete"
              payload: {}
              as: FieldSupervisor
            - call: "POST /inspections"
              payload: { visit_id: "${rvisit_id}", score: 70 }
              as: FieldSupervisor
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_ver: $.data.version }
          trigger:
            - call: "POST /billing-periods/${period_id}/close"
              payload: { expected_account_version: "${acct_ver}" }
              as: AccountManager
              captures: { final_total: $.data.total_cents, final_holdback: $.data.holdback_cents }
          assert:
            - "BillingPeriod.${period_id}.holdback_cents == 15000 (round(300000*0.05), keyed off base not total)"
            - "BillingPeriod.${period_id}.total_cents == 309000 (300000 + 24000 - 0 - 15000)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: complaint_cyclic_resolved_reopen_to_open
        grounds:
          - state_machines.Complaint.CALLBACK_SCHEDULED_to_RESOLVED
          - state_machines.Complaint.RESOLVED_to_OPEN
          - entities.Complaint.fields.status
          - entities.Complaint.fields.severity
          - entities.Complaint.fields.callback_visit_id
        distinguishing_aspect: |
          Complaint is cyclic: a MAJOR complaint that reaches RESOLVED can loop back
          to OPEN via reopen (RESOLVED -> OPEN), clearing callback_visit_id while the
          posted credit is NOT clawed back — a true A->...->A cycle on the Complaint
          entity, not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (contact_user_id=cc-1), AVAILABLE crew, ACTIVE contract, OPEN period for 2026-06."
            - "A MAJOR Complaint acknowledged, callback scheduled, the callback Visit completed, then RESOLVED."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "POST /complaints"
              payload: { site_id: "${site_id}", severity: "MAJOR", description: "Lobby not cleaned" }
              as: ClientContact
              as_user_id: "cc-1"
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/acknowledge"
              payload: {}
              as: FieldSupervisor
            - call: "POST /complaints/${complaint_id}/schedule-callback"
              payload: { crew_id: "${crew_id}", service_date: "2026-06-18", planned_start_min: 600, planned_end_min: 660 }
              as: FieldSupervisor
              captures: { cb_visit_id: $.data.callback_visit_id }
            - call: "POST /visits/${cb_visit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${cb_visit_id}", crew_id: "${crew_id}", clock_in_min: 600 }
              as: FieldSupervisor
              captures: { cb_te_id: $.data.id }
            - call: "POST /time-entries/${cb_te_id}/clock-out"
              payload: { clock_out_min: 660 }
              as: FieldSupervisor
            - call: "POST /visits/${cb_visit_id}/complete"
              payload: {}
              as: FieldSupervisor
            - call: "POST /complaints/${complaint_id}/resolve"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /complaints/${complaint_id}/reopen"
              payload: {}
              as: ClientContact
              as_user_id: "cc-1"
              captures: { status_after: $.data.status, cb_after: $.data.callback_visit_id }
          assert:
            - "Complaint.${complaint_id}.status == OPEN (cycle back from RESOLVED)"
            - "Complaint.${complaint_id}.callback_visit_id == null after reopen"
            - "Complaint.${complaint_id}.credit_applied_cents == 45000 still (credit not clawed back)"

      - name: billing_period_cyclic_closed_reopened_closed
        grounds:
          - state_machines.BillingPeriod.OPEN_to_CLOSED
          - state_machines.BillingPeriod.CLOSED_to_REOPENED
          - state_machines.BillingPeriod.REOPENED_to_CLOSED
          - entities.BillingPeriod.fields.status
        distinguishing_aspect: |
          BillingPeriod is cyclic on a different entity than Complaint: it loops
          CLOSED -> REOPENED -> CLOSED, deleting then re-emitting InvoiceLines, so the
          same period revisits CLOSED via a revision loop rather than advancing once.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, ACTIVE contract (base 300000), an OPEN period for 2026-06 that has been CLOSED once."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { ver0: $.data.version }
            - call: "POST /billing-periods/${period_id}/close"
              payload: { expected_account_version: "${ver0}" }
              as: AccountManager
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { ver1: $.data.version }
            - call: "POST /billing-periods/${period_id}/reopen"
              payload: { expected_account_version: "${ver1}" }
              as: AccountManager
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { ver2: $.data.version }
          trigger:
            - call: "POST /billing-periods/${period_id}/close"
              payload: { expected_account_version: "${ver2}" }
              as: AccountManager
              captures: { status_after: $.data.status }
          assert:
            - "BillingPeriod.${period_id}.status == CLOSED again after the REOPENED -> CLOSED loop"
            - "GET /billing-periods/${period_id}/invoice-lines returns the re-emitted BASE line (one InvoiceLine present)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: periodic_visit_complete_cascade_depth3
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - state_machines.PeriodicJob.DISPATCHED_to_BILLED
          - calculations.compute_period_total
          - entities.BillingPeriod.fields.periodic_cents
          - entities.BillingPeriod.fields.total_cents
          - entities.PeriodicJob.fields.status
        distinguishing_aspect: |
          Depth-3 chain from POST /visits/{id}/complete on a PERIODIC visit: (1) Visit
          -> COMPLETED; (2) completion captures the visit into its BillingPeriod,
          growing periodic_cents and recomputing total_cents; (3) the linked
          PeriodicJob, gated on its Visit reaching COMPLETED, flips DISPATCHED ->
          BILLED. Each link is caused by the prior — Visit COMPLETED drives the
          BillingPeriod capture and the PeriodicJob bill.
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (floor_type=VCT), AVAILABLE crew, ACTIVE contract (base 300000, rate 6000), OPEN period 2026-06."
            - "A PeriodicJob (STRIP_WAX, quoted_hours=2) DISPATCHED → SCHEDULED PERIODIC Visit, started, with one COMPLETED TimeEntry clocked 08:00→10:00 (120 min, no overage)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "VCT" }
              as: AccountManager
