  - rule_id: transitive_cascade
    instances:
      - name: valuation_closes_product_then_flags_carrier_then_reopens_review
        grounds:
          - calculations.valuation_net_yield
          - state_machines.ProductType.OPEN_to_CLOSED_TO_NEW
          - state_machines.DiligenceReview.UNDER_REVIEW_to_INFO_REQUESTED
          - entities.Carrier.fields.watch_list_flag
          - endpoints[POST /policy-valuations]
        distinguishing_aspect: |
          One POST /policy-valuations produces a three-link chain in which each link is caused by
          the previous one: the second consecutive sub-150 bps net yield closes the ProductType
          (link 1), the newly CLOSED_TO_NEW product sets Carrier.watch_list_flag = true (link 2),
