              as: DistributorAdmin
              captures: { part_oq: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_oq}", date_code: "202601", qty_received: 5, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust OQ", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_oq: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_oq}", lines: [ { part_id: "${part_oq}", quantity: 10, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_oq: $.data.id }
            - call: "POST /orders/${o_oq}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_oq}"
              as: DistributorAdmin
              captures: { l_oq: "$.data[0].id" }
            - call: "GET /parts/${part_oq}"
              as: DistributorAdmin
              captures: { part_oq_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_oq}", expected_part_version: "${part_oq_v}" }
              as: DistributorAdmin
              captures: { run_oq: $.data.id }
            - call: "POST /allocation-runs/${run_oq}/publish"
              payload: {}
              as: DistributorAdmin
