# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (non-difficulty claims)
# Blow Molding & Bottle Plant. Sections follow the claim-extraction guide.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Customer.fields.default_logistics_mode, entities.Customer.fields.status]
        distinguishing_aspect: "Omitting default_logistics_mode yields WAREHOUSE; status starts ACTIVE; version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id", mode: "$.data.default_logistics_mode", st: "$.data.status", v: "$.data.version" } }
          assert:
            - "response 201; default_logistics_mode == WAREHOUSE; status == ACTIVE; version == 1; id is a bare UUID; created_at has 3 fractional digits"

      - name: bottle_spec_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.BottleSpec.fields.target_weight_g, "validations[priority=3]"]
        distinguishing_aspect: "Omitting required target_weight_g yields 400 ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup: ["customer ACME exists"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing target_weight_g); no BottleSpec created"

      - name: bottle_spec_create_with_server_id_returns_invalid_request
        claim_type: system_fields
        grounds: [entities.BottleSpec, "validations[priority=3]"]
        distinguishing_aspect: "Client-supplied id (a system field) is an unknown input field and is rejected."
        test_recipe:
          setup: ["customer ACME exists"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/bottle-specs", payload: { id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (unknown field id)"

      - name: mold_effective_cavities_computed_and_reconciled
        claim_type: computed_fields
        grounds: [entities.Mold.fields.effective_cavities, calculations.effective_cavitation]
        distinguishing_aspect: "effective_cavities tracks OPEN blockouts: 8 -> 7 after one blockout, back to 8 after clear; client cannot set it."
        test_recipe:
          setup: ["mold M8 (8 cavities) created and installed on line L1"]
          setup_api_calls:
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer, captures: { mold_v: "$.data.version" } }
            - { call: "POST /plant/molds/${mold_id}/cavity-blockouts", payload: { cavity_index: 4, reason: "DAMAGE", expected_mold_version: "${mold_v}" }, as: ProcessEngineer, captures: { blk_id: "$.data.id" } }
          trigger:
            - { call: "GET /plant/molds/${mold_id}", as: ProcessEngineer, captures: { eff1: "$.data.effective_cavities", cnt1: "$.data.active_blockout_count" } }
            - { call: "POST /plant/cavity-blockouts/${blk_id}/clear", as: ProcessEngineer }
            - { call: "GET /plant/molds/${mold_id}", as: ProcessEngineer, captures: { eff2: "$.data.effective_cavities", cnt2: "$.data.active_blockout_count" } }
          assert:
            - "after blockout: effective_cavities == 7, active_blockout_count == 1"
            - "after clear: effective_cavities == 8, active_blockout_count == 0"

      - name: get_missing_bottle_spec_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_BOTTLE_SPEC_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields 404 ERR_BOTTLE_SPEC_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/bottle-specs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_BOTTLE_SPEC_NOT_FOUND; http 404"

      - name: material_lot_list_pagination
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "limit=2 over 3 lots returns total_count 3, has_more true; offset=2 returns 1 row, has_more false; default limit is 10."
        test_recipe:
          setup: ["three material lots R-1, R-2, R-3 exist"]
          setup_api_calls:
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-1", received_kg: 100 }, as: PlantAdmin }
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-2", received_kg: 100 }, as: PlantAdmin }
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-3", received_kg: 100 }, as: PlantAdmin }
          trigger:
            - { call: "GET /plant/material-lots", payload: { limit: 2, offset: 0 }, as: QualityTechnician }
            - { call: "GET /plant/material-lots", payload: { limit: 2, offset: 2 }, as: QualityTechnician }
          assert:
            - "page 1: exactly 2 rows (R-1, R-2 in created_at ASC order), total_count == 3, has_more == true"
            - "page 2: exactly 1 row (R-3), total_count == 3, has_more == false"

  - section: state_machines
    instances:
      - name: bottle_spec_starts_in_draft
        claim_type: initial_state
        grounds: [state_machines.BottleSpec]
        distinguishing_aspect: "New spec is DRAFT with content_revision 1 and null qualified_revision."
        test_recipe:
          setup: ["customer ACME exists"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { st: "$.data.status", crev: "$.data.content_revision" } }
          assert:
            - "status == DRAFT; content_revision == 1; qualified_revision is null"

      - name: submit_from_qualified_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.BottleSpec.transitions]
        distinguishing_aspect: "submit is defined only from DRAFT and REVISION_REQUESTED; from QUALIFIED it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["spec S1 fully QUALIFIED"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (QUALIFIED is not a valid from-state for submit)"

      - name: retire_then_submit_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BottleSpec]
        distinguishing_aspect: "RETIRED is terminal; any further action returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["spec S1 in DRAFT then retired"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/retire", as: ProcessEngineer, captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "retire from DRAFT succeeded (status == RETIRED)"
            - "submit afterwards -> error_id == ERR_ALREADY_TERMINAL"

      - name: qualification_review_request_more_data_cycles
        claim_type: valid_transition
        grounds: [state_machines.QualificationRun.CUSTOMER_REVIEW_to_EXECUTED]
        distinguishing_aspect: "REQUEST_MORE_DATA loops CUSTOMER_REVIEW -> EXECUTED without consuming round_no; re-execute then re-submit works."
        test_recipe:
          setup: ["qualification run Q1 in CUSTOMER_REVIEW"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
          trigger:
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "REQUEST_MORE_DATA", review_note: "re-weigh cavity 5" }, as: CustomerQualityRep, as_user_id: "${cust_id}", captures: { st1: "$.data.status" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.0, weight_spread_g: 0.3, visual_defects: 0 }, as: ProcessEngineer, captures: { st2: "$.data.status", tol: "$.data.weight_within_tolerance" } }
          assert:
            - "after REQUEST_MORE_DATA: status == EXECUTED (cycle), round_no still 1"
            - "re-execute from EXECUTED succeeds; weight_within_tolerance == true"

      - name: material_lot_release_hold_release_cycle
        claim_type: valid_transition
        grounds: [state_machines.MaterialLot.RELEASED_to_QUARANTINED, state_machines.MaterialLot.QUARANTINED_to_RELEASED]
        distinguishing_aspect: "RELEASED -> QUARANTINED -> RELEASED cycle is allowed (QC re-hold loop)."
        test_recipe:
          setup: ["material lot R-1 QUARANTINED"]
          setup_api_calls:
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-1", received_kg: 100 }, as: PlantAdmin, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/material-lots/${lot_id}/release", as: QualityTechnician, captures: { st1: "$.data.status" } }
            - { call: "POST /plant/material-lots/${lot_id}/hold", as: QualityTechnician, captures: { st2: "$.data.status" } }
            - { call: "POST /plant/material-lots/${lot_id}/release", as: QualityTechnician, captures: { st3: "$.data.status" } }
          assert:
            - "statuses: RELEASED -> QUARANTINED -> RELEASED (cycle legal, version increments each step)"

      - name: run_close_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.ProductionRun]
        distinguishing_aspect: "Second close of a CLOSED run returns ERR_INVALID_STATE; no double debit of material."
        test_recipe:
          setup: ["run R1 CLOSED (lot R-100 debited 360 kg)"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "POST /plant/production-orders", payload: { bottle_spec_id: "${spec_id}", quantity_ordered: 3000, planned_weight_g: 22 }, as: ProductionScheduler, captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /plant/production-orders/${ord_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-02T10:00:00Z", planned_end: "2026-08-02T14:00:00Z", expected_production_order_version: "${ord_v}" }, as: ProductionScheduler }
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-100", received_kg: 500 }, as: PlantAdmin, captures: { mlot_id: "$.data.id" } }
            - { call: "POST /plant/material-lots/${mlot_id}/release", as: QualityTechnician }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer }
            - { call: "POST /plant/production-orders/${ord_id}/release", as: ProductionScheduler }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/production-runs", payload: { production_order_id: "${ord_id}", machine_line_id: "${line_id}", mold_id: "${mold_id}", material_lot_id: "${mlot_id}" }, as: ProcessEngineer, captures: { run_id: "$.data.id" } }
            - { call: "POST /plant/production-runs/${run_id}/close", payload: { cycles_completed: 2000, good_count: 11880, scrap_count: 120, actual_drawdown_kg: 360.0 }, as: ProcessEngineer }
          trigger:
            - { call: "POST /plant/production-runs/${run_id}/close", payload: { cycles_completed: 2000, good_count: 11880, scrap_count: 120, actual_drawdown_kg: 360.0 }, as: ProcessEngineer, captures: { err: "$.data.error_id" } }
            - { call: "GET /plant/material-lots/${mlot_id}", as: QualityTechnician, captures: { cons: "$.data.consumed_kg" } }
          assert:
            - "second close -> error_id == ERR_INVALID_STATE"
            - "MaterialLot.consumed_kg still == 360.0 (no double debit)"

      - name: blockout_clear_twice_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CavityBlockout]
        distinguishing_aspect: "CLEARED is terminal; a second clear returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["mold M8 INSTALLED; blockout on cavity 4 opened then cleared"]
          setup_api_calls:
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer, captures: { mold_v: "$.data.version" } }
            - { call: "POST /plant/molds/${mold_id}/cavity-blockouts", payload: { cavity_index: 4, reason: "DAMAGE", expected_mold_version: "${mold_v}" }, as: ProcessEngineer, captures: { blk_id: "$.data.id" } }
            - { call: "POST /plant/cavity-blockouts/${blk_id}/clear", as: ProcessEngineer, captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /plant/cavity-blockouts/${blk_id}/clear", as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "first clear: status == CLEARED, cleared_at set"
            - "second clear -> error_id == ERR_ALREADY_TERMINAL"

      - name: order_cancel_from_running_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ProductionOrder]
        distinguishing_aspect: "Cancel is defined from DRAFT/SCHEDULED/RELEASED/HELD only; a RUNNING order must be held first."
        test_recipe:
          setup: ["order O1 RUNNING (run OPEN)"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
