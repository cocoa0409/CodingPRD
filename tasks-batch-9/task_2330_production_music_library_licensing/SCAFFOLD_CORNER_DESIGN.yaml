  - section: endpoints
    instances:

      - name: royalty_preview_is_a_side_effect_free_computed_read
        claim_type: computed_read
        grounds:
          - endpoints["GET /music-library/composers/{composer_id}/royalty-preview"].output
          - endpoints["GET /music-library/composers/{composer_id}/royalty-preview"].side_effects
          - calculations[statement_settlement]
        distinguishing_aspect: |
          The preview evaluates the same settlement engine as statement creation but must leave no trace:
          Composer.version is unchanged, no statement row appears, no ledger entry is stamped, and calling
          it twice returns byte-identical figures — and because it always returns both variant grosses, an
          overlapping real statement can still be created for the previewed window afterwards.
        test_recipe:
          setup:
            - "One composer with tax_withholding_pct 0.30 and a single manual ADJUSTMENT of 40000 recognised at the initial clock."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP", payee_country: "US", tax_withholding_pct: 0.30 }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/royalty-ledger-entries"
              payload: { composer_id: "${c1}", source_type: "ADJUSTMENT", amount_cents: 40000, memo: "Library-wide catalogue bonus" }
              as: RoyaltyAccountant
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
              captures: { c1_v: $.data.version }
          trigger:
            - call: "GET /music-library/composers/${c1}/royalty-preview?period_start=2026-08-01T00:00:00Z&period_end=2026-08-31T00:00:00Z&basis=ACCRUAL"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "ACCRUAL" }
              as: RoyaltyAccountant
            - call: "GET /music-library/composers/${c1}/royalty-preview?period_start=2026-08-01T00:00:00Z&period_end=2026-08-31T00:00:00Z&basis=ACCRUAL"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "ACCRUAL" }
              as: Composer
              as_user_id: "${c1}"
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
            - call: "GET /music-library/royalty-statements?composer_id=${c1}"
              payload: { composer_id: "${c1}" }
              as: RoyaltyAccountant
            - call: "GET /music-library/royalty-ledger-entries?composer_id=${c1}"
