            - call: GET /production-windows/${w_id}
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
              captures: { committed_1: "$.data.committed_meals", reserve_1: "$.data.spoilage_reserve_meals", eff_1: "$.data.effective_capacity_meals" }
            - call: POST /_clock/set_current_utc
