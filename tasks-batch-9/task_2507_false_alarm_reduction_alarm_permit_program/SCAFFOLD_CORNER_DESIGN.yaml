          trigger:
            - call: "POST /false-alarm-program/penalty-invoices/${inv1_id}/adjustments"
              payload: { adjustment_kind: "REDUCE", reason: "Clerk attempted to reduce past zero.", expected_penalty_invoice_version: "${inv1_v}", amount_cents: 6000 }
