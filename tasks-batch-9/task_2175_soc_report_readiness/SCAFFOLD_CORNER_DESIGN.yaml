  - section: calculations
    instances:
      - name: corner_monthly_evidence_calendar_tiles_three_half_open_periods
        claim_type: correct_result
        grounds: ["calculations.evidence_calendar_generation", "endpoints.POST_/soc/controls/{control_id}/evidence-calendar", "entities.EvidenceRequest.fields.due_date"]
        distinguishing_aspect: "A MONTHLY control on a 90-day observation window produces exactly floor(90/30) = 3 EvidenceRequest rows tiled as [09-01,10-01), [10-01,10-31), [10-31,11-30), each with due_date = period_end + 5 days and status SCHEDULED."
        test_recipe:
          setup:
            - "Engagement 'Calendar' in SCOPING with observation window 2026-09-01 to 2026-11-30 (90 days)."
            - "Control M-01 is MONTHLY and carries no EvidenceRequest rows yet."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Calendar", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "M-01", title: "Monthly access review", frequency: "MONTHLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 12 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { m01: $.data.id }
          trigger:
            - call: "POST /soc/controls/${m01}/evidence-calendar"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { er0: "$.data[0].id", er1: "$.data[1].id", er2: "$.data[2].id" }
          assert:
            - "HTTP status == 201 and the response data array length == 3"
            - "EvidenceRequest.${er0}.period_index == 0, period_start == 2026-09-01T00:00:00.000Z, period_end == 2026-10-01T00:00:00.000Z, due_date == 2026-10-06T00:00:00.000Z"
            - "EvidenceRequest.${er1}.period_index == 1, period_start == 2026-10-01T00:00:00.000Z, period_end == 2026-10-31T00:00:00.000Z, due_date == 2026-11-05T00:00:00.000Z"
            - "EvidenceRequest.${er2}.period_index == 2, period_start == 2026-10-31T00:00:00.000Z, period_end == 2026-11-30T00:00:00.000Z, due_date == 2026-12-05T00:00:00.000Z"
            - "every generated EvidenceRequest has status == SCHEDULED"
            - "Control.${m01}.evidence_scheduled_count == 3"

      - name: corner_adhoc_evidence_calendar_yields_one_full_window_period
        claim_type: correct_result
        grounds: ["calculations.evidence_calendar_generation", "entities.Control.fields.frequency"]
        distinguishing_aspect: "An ADHOC control bypasses the PERIOD_DAYS tiling entirely and produces exactly one EvidenceRequest spanning the whole observation window, with due_date 2026-12-05."
        test_recipe:
          setup:
            - "Engagement 'AdHoc' in SCOPING with observation window 2026-09-01 to 2026-11-30."
            - "Control A-01 is ADHOC and carries no EvidenceRequest rows yet."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "AdHoc", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "A-01", title: "Emergency change review", frequency: "ADHOC", automation: "MANUAL", risk_rating: "LOW", population_size: 3 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { a01: $.data.id }
          trigger:
            - call: "POST /soc/controls/${a01}/evidence-calendar"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { er0: "$.data[0].id" }
          assert:
            - "the response data array length == 1"
            - "EvidenceRequest.${er0}.period_index == 0"
            - "EvidenceRequest.${er0}.period_start == 2026-09-01T00:00:00.000Z"
            - "EvidenceRequest.${er0}.period_end == 2026-11-30T00:00:00.000Z"
            - "EvidenceRequest.${er0}.due_date == 2026-12-05T00:00:00.000Z"
            - "Control.${a01}.evidence_scheduled_count == 1"

      - name: corner_bridge_letter_coverage_days_counts_both_closed_endpoints
        claim_type: correct_result
        grounds: ["calculations.bridge_letter_coverage_days", "entities.BridgeLetter.fields.coverage_days"]
        distinguishing_aspect: "coverage_days = floor((as_of_date - coverage_start)/86400) + 1, so a single-instant letter has coverage_days 1 and a 2026-11-30 to 2026-12-31 letter has coverage_days 32 — an exclusive reading would give 0 and 31."
        test_recipe:
          setup:
            - "Engagement 'Bridge Math' exists; bridge letters are drafted without any lifecycle preconditions."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Bridge Math", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /soc/bridge-letters"
              payload: { engagement_id: "${eng}", coverage_start: "2026-11-30T00:00:00.000Z", as_of_date: "2026-11-30T00:00:00.000Z" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { bl_one: $.data.id }
            - call: "POST /soc/bridge-letters"
              payload: { engagement_id: "${eng}", coverage_start: "2026-11-30T00:00:00.000Z", as_of_date: "2026-12-31T00:00:00.000Z" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { bl_month: $.data.id }
          assert:
            - "BridgeLetter.${bl_one}.coverage_days == 1"
            - "BridgeLetter.${bl_one}.status == DRAFT"
            - "BridgeLetter.${bl_one}.issued_at == null"
            - "BridgeLetter.${bl_month}.coverage_days == 32"
            - "BridgeLetter.${bl_month}.supersedes_bridge_letter_id == null"

      - name: corner_bridge_letter_beyond_max_days_rejected
        claim_type: constants_applied
        grounds: ["calculations.bridge_letter_coverage_days", "entities.BridgeLetter.fields.as_of_date", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "MAX_BRIDGE_DAYS is 120; a letter spanning 2026-11-30 to 2027-04-30 has coverage_days 152 and is rejected with 422 ERR_VALIDATION, and no BridgeLetter row is stored."
        test_recipe:
          setup:
            - "Engagement 'Too Long' exists with no bridge letters."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Too Long", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /soc/bridge-letters"
              payload: { engagement_id: "${eng}", coverage_start: "2026-11-30T00:00:00.000Z", as_of_date: "2027-04-30T00:00:00.000Z" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_VALIDATION"
            - "GET /soc/bridge-letters?engagement_id=${eng} returns total_count == 0"

      - name: corner_gap_debt_tier_one_boundary_at_base_ten_adds_no_surcharge
        claim_type: threshold_boundary
        grounds: ["calculations.gap_debt_points", "calculations.engagement_gap_posture", "entities.Engagement.fields.base_debt_points"]
        distinguishing_aspect: "base_debt exactly 10 selects TIER_1_RATE 0.00 so gap_debt_points is 10.00 with gap_posture OPEN; adding one more LOW gap makes base_debt 11, selects 0.15, and gives surcharge 1.65 with gap_debt_points 12.65 and gap_posture RESTRICTED."
        test_recipe:
          setup:
            - "Engagement 'Tier Edge' in SCOPING with three OPEN MANUAL gaps: HIGH, LOW, LOW, giving base_debt exactly 10."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Tier Edge", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "HIGH", description: "Access review gap" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g1: $.data.id }
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "LOW", description: "Asset tagging" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g2: $.data.id }
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "LOW", description: "Runbook stale" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g3: $.data.id }
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { base_at10: $.data.base_debt_points, sur_at10: $.data.surcharge_points, debt_at10: $.data.gap_debt_points, posture_at10: $.data.gap_posture }
          trigger:
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "LOW", description: "Training log incomplete" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g4: $.data.id }
            - call: "GET /soc/engagements/${eng}/readiness-summary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { base_at11: $.data.base_debt_points, sur_at11: $.data.surcharge_points, debt_at11: $.data.gap_debt_points, posture_at11: $.data.gap_posture }
          assert:
            - "${base_at10} == 10"
            - "${sur_at10} == 0.00"
            - "${debt_at10} == 10.00"
            - "${posture_at10} == OPEN"
            - "${base_at11} == 11"
            - "${sur_at11} == 1.65"
            - "${debt_at11} == 12.65"
            - "${posture_at11} == RESTRICTED"

      - name: corner_readiness_score_is_zero_when_no_criteria_are_in_scope
