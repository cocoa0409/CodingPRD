      - name: caseload_capacity_equality_boundary
        grounds:
          - calculations.caseload_load
          - validations[priority=31]
          - errors[ERR_CASELOAD_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric = caseload units, endpoint = POST /cases/{id}/assign. The capacity check is >= (equality
          PERMITTED): attorney with available_units exactly 5 accepts a weight-5 EXTENDED case (landing at
