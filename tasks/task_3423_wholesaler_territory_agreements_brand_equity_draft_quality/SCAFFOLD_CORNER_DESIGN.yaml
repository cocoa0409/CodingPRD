              as: BrewerAdmin
              captures: { aocc_id: $.data.id, aocc_v: $.data.version }
          trigger:
            - call: "POST /agreements/${aocc_id}/amendments"
              payload: { expected_agreement_version: "${aocc_v}", share_target_pct: 50 }
              as: BrewerAdmin
              captures: { aocc_v2: $.data.version }
            - call: "POST /agreements/${aocc_id}/amendments"
              payload: { expected_agreement_version: "${aocc_v}", share_target_pct: 60 }
              as: BrewerAdmin
              captures: { occ_err: $.data.error_id }
          assert:
            - "First amendment: HTTP 200 and aocc_v2 == 2 (version advanced)"
            - "Second amendment replaying the observed version: HTTP 412 and occ_err == ERR_STALE_VERSION"
            - "Agreement.${aocc_id}.share_target_pct == 50 (the losing amendment changed nothing) and amendment_log has exactly 1 entry"

