            - "the 11:14 start returns HTTP 409 with error_id == ERR_PROCTOR_INTERVAL_CONFLICT even though [09:00,11:00) and [11:14,13:14) do not overlap — the 15-minute buffer, not the raw interval, is what collides (gap 14 < 15)"
            - "the rejected attempt leaves no session: GET /exam-sessions?proctor_id=${proc_id} returns total_count 1, and Proctor.${proc_id}.reserved_minutes is still 120"
