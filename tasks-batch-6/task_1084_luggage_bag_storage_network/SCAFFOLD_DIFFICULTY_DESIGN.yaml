  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: location_daily_capacity_halfopen_adjacent_ok
        grounds:
          - validations[priority=9]
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.Location.fields.daily_bag_capacity
        distinguishing_aspect: |
          Location capacity uses half-open [check_in, check_out) per-day bag-sum: a booking [06-12,06-15) overlapping
          a full [06-10,06-13) booking is rejected, but an adjacent [06-13,06-15) booking is allowed (no shared day).
        test_recipe:
          setup:
            - "OPEN location cap 3; a first 3-bag booking for 2026-06-10..2026-06-13 fills every day."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "NONE", per_bag_coverage_cents: 0, premium_cents_per_bag_day: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 3, oversize_capacity: 3, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v1: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-13", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 }, { declared_value_cents: 1000, dimension_sum_cm: 100 }, { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v1}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg1: $.data.id }
            - call: "GET /locations/${loc_id}"
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { loc_v2: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-12", check_out_date: "2026-06-15", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v2}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-13", check_out_date: "2026-06-15", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v2}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { adj_id: $.data.id, adj_status: $.data.status }
          assert:
            - "Overlapping [06-12,06-15) booking fails with error_id == ERR_CAPACITY_EXCEEDED"
            - "Adjacent [06-13,06-15) booking succeeds (status RESERVED) — half-open, no shared day"

      - name: host_concurrency_closed_interval_count
        grounds:
          - validations[priority=9]
          - errors[ERR_HOST_CONCURRENCY_EXCEEDED]
          - entities.Host.fields.max_concurrent_bookings
        distinguishing_aspect: |
          Host max_concurrent_bookings uses a closed-interval COUNT of overlapping active bookings across all the
          host's locations (a different resource entity and different interval semantics than Location's per-day bag-sum).
        test_recipe:
          setup:
            - "Host max_concurrent 1 with two OPEN locations; one active booking on location A for 2026-06-10..2026-06-13."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com", max_concurrent_bookings: 1 }
