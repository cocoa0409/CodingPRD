        grounds: [endpoints.accept, entities.Mission.fields.acuity_tier]
        distinguishing_aspect: "accept returns 201 with a Mission whose transport_class, acuity_tier and destination_facility are snapshots of the request (acceptance score 5.8 -> ALS), version 1, status PLANNING — and the request flips to ACCEPTED."
