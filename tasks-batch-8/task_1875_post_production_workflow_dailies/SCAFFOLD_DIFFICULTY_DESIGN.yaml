  # ------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dailies_publish_requires_batch_ready
        grounds:
          - state_machines.DailiesPackage.DRAFT_to_PUBLISHED
          - state_machines.MediaBatch
        distinguishing_aspect: |
          DailiesPackage publish transition is gated on MediaBatch.status ==
          READY (DailiesPackage <-> MediaBatch pair). If the batch is still in
          PROXYING, publish is rejected with ERR_INVALID_STATE even when the
          watermark profile and distribution list are valid.
        test_recipe:
          setup:
            - "Project P ACTIVE; Batch B in PROXYING (not READY); DailiesPackage DP DRAFT referencing B"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PD", client_code: "CL013", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
