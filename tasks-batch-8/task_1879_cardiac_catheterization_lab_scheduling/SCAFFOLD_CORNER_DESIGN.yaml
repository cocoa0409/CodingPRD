      - name: stemi_activation_with_no_eligible_room_returns_no_stemi_room
        claim_type: violation_to_error
        grounds: ["calculations.bump_room_selector", "errors[ERR_NO_STEMI_ROOM]"]
        distinguishing_aspect: "Selector fallback: the only room has a case IN_PROGRESS, so a STEMI activation fails ERR_NO_STEMI_ROOM and persists nothing (IN_PROGRESS cases are never bumped)."
        test_recipe:
          setup: ["Room R with an URGENT case IN_PROGRESS; no other rooms"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
