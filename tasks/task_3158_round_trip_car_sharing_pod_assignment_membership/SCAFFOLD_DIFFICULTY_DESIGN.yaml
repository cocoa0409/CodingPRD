              as: FleetAdmin
              captures: { veh_h1_id: $.data.id, veh_h1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_cora_id}", pod_id: "${pod_cls_id}", vehicle_id: "${veh_h1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_h1_ver}" }
              as: Member
