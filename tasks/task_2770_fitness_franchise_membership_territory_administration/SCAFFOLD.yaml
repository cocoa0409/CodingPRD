    roles: [BrandAdministrator]
    code: 200
    input: ["note?"]
    output: MembershipPlanTemplate
    side_effects: ["status -> PUBLISHED", "increments MembershipPlanTemplate.version by 1"]

  - method: GET
    path: "/franchise/plan-templates/{id}"
    description: "Reads one plan template including monthly_dues_cents, floor_price_cents and cancellation_notice_days."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: MembershipPlanTemplate
    side_effects: []

  - method: GET
    path: "/franchise/plan-templates"
    description: "Lists plan templates, optionally filtered by status."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MembershipPlanTemplate[]
    side_effects: []

  # ---- Promotion ----
  - method: POST
    path: "/franchise/promotions"
    description: "A franchisee files a promotional price for brand review (created PENDING_REVIEW). discount_pct may not exceed MAX_FRANCHISE_DISCOUNT_PCT, and the closed [starts_on, ends_on] window may not overlap or sit within PROMO_COOLING_GAP_DAYS of another PENDING_REVIEW or APPROVED promotion for the same (franchisee_id, plan_template_id)."
    roles: [FranchiseOwner]
