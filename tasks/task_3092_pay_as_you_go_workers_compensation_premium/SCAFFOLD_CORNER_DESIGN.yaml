              as: PayrollProvider
              captures: { cd_mon_status: $.data.status, cd_mon_fail: $.data.failure_code }
          assert:
            - "report status == REJECTED with failure_code ERR_MONOPOLISTIC_STATE_EXCLUDED (not ERR_CLASS_CODE_NOT_ON_POLICY, though both conditions hold)"

      - name: unauthenticated_request_rejected_before_everything
        claim_type: Priority Ordering
        grounds: ['validations.priority-1', 'errors.ERR_UNAUTHENTICATED']
        distinguishing_aspect: "Missing auth headers short-circuit at priority 1: even a request that would also fail existence and state checks returns 401 ERR_UNAUTHENTICATED."
