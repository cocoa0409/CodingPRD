# =============================================================================
# Weight Management & Nutrition Program — Scaffold Seed Tables (Expert tier)
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys here)
# =============================================================================

scenario: |
  Weight Management & Nutrition Program: intake assessment, plan tier
  (coaching/Rx/meal), weigh-in & biometric tracking, milestone/goal, coach
  assignment & messaging, recurring billing, HSA/FSA eligibility, program
  graduation

domain_name: weight-management-nutrition-program
api_prefix: /wm

# Selected structural DNA (Expert difficulty per §0.4).
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat            # all collections are peers under /wm; scoping via FK + filtered lists
  state_machine_shape: parallel    # Enrollment carries parallel clinical_status x billing_status; IntakeAssessment cycles
  relationship_patterns:
    - one_to_many                  # Program -> Member/Coach/Enrollment; Enrollment -> WeighIn/Goal/Invoice
    - many_to_many                 # Coach <-> Enrollment via CoachAssignment
    - cross_aggregate              # RxAuthorization references EligibilityDetermination; Enrollment references IntakeAssessment + PlanCatalogItem
  role_model: peer_roles           # Member, Coach own different surfaces; ProgramAdmin + Clinician + BillingAgent operate
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: description, type: string, source: input, required: false, description: "Optional description" }
      - { name: current_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Deterministic program clock; advanced only via POST /wm/programs/{id}/clock-set" }
      - { name: coach_max_active_members, type: integer, source: input, default: 50, description: "Aggregate-capacity cap: max ACTIVE CoachAssignments a single Coach may hold in this program" }

  - name: PlanCatalogItem
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: tier, type: enum, source: input, description: "Plan tier", constraints: "one of COACHING | RX | MEAL" }
      - { name: name, type: string, source: input, description: "Display name of the plan" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring monthly fee in cents (>= 0)" }
      - { name: enrollment_fee_cents, type: integer, source: input, default: 0, description: "One-time enrollment fee in cents charged on the first invoice (>= 0)" }
      - { name: requires_rx, type: boolean, source: computed, description: "True iff tier == RX; RX plans require an ISSUED RxAuthorization before clinical activation" }
      - { name: hsa_fsa_default_eligible, type: boolean, source: input, default: false, description: "Whether the plan's recurring fee is presumptively HSA/FSA eligible before per-member determination" }
      - { name: active, type: boolean, source: system, default: true, description: "False once retired; retired plans reject new enrollments" }

  - name: Member
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Unique within program (case-insensitive)" }
      - { name: height_cm, type: number, source: input, description: "Height in centimetres (> 0); used for BMI" }
      - { name: baseline_weight_kg, type: number, source: computed, default: null, description: "Weight (kg) captured from the APPROVED IntakeAssessment; null until intake approved" }
      - { name: latest_weight_kg, type: number, source: computed, default: null, description: "Weight (kg) from the most recent COUNTED WeighIn; null until first counted weigh-in" }
      - { name: latest_lean_mass_kg, type: number, source: computed, default: null, description: "Lean mass (kg) from the most recent COUNTED WeighIn carrying body_fat_pct; null otherwise" }
      - { name: scale_progress_pct, type: number, source: computed, default: 0, description: "Scale-weight progress percent vs baseline; see calculations.scale_progress_pct" }
      - { name: lean_adjusted_progress_pct, type: number, source: computed, default: 0, description: "Lean-mass-adjusted progress percent; see calculations.lean_adjusted_progress_pct" }
      - { name: account_balance_cents, type: integer, source: computed, default: 0, description: "Member credit ledger in cents; positive = credit owed to member. Conserved quantity for refund invariant." }
      - { name: status, type: enum, source: system, description: "REGISTERED -> INTAKE_PENDING -> ENROLLED -> GRADUATED / WITHDRAWN", constraints: "REGISTERED|INTAKE_PENDING|ENROLLED|GRADUATED|WITHDRAWN" }

  - name: Coach
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: full_name, type: string, source: input, description: "Coach full name" }
      - { name: email, type: string, source: input, description: "Unique within program (case-insensitive)" }
      - { name: specialty, type: enum, source: input, default: GENERAL, description: "Coach specialty", constraints: "GENERAL|DIETITIAN|CLINICAL" }
      - { name: active_member_count, type: integer, source: computed, default: 0, description: "Count of CoachAssignments in ACTIVE status. Conserved quantity for assign/unassign invariant; basis for capacity cap check." }
      - { name: accepting, type: boolean, source: input, default: true, description: "False suspends new assignments; existing assignments unaffected" }

  - name: IntakeAssessment
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the assessed member" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; owning program (copied from member)" }
      - { name: weight_kg, type: number, source: input, description: "Reported baseline weight in kg (> 0)" }
      - { name: bmi, type: number, source: computed, description: "= weight_kg / (member.height_cm/100)^2, round 1 decimal; see calculations.bmi" }
      - { name: comorbidity_count, type: integer, source: input, default: 0, description: "Count of qualifying comorbidities (>= 0)" }
      - { name: risk_band, type: enum, source: computed, description: "LOW|MODERATE|HIGH derived from bmi + comorbidity_count; see calculations.intake_risk_band" }
      - { name: review_notes, type: string, source: input, required: false, description: "Reviewer notes captured on review/revision transitions" }
      - { name: revision_round, type: integer, source: computed, default: 0, description: "Increments each time the assessment re-enters SUBMITTED via NEEDS_REVISION (cycle counter)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> UNDER_REVIEW -> {APPROVED | NEEDS_REVISION -> SUBMITTED ...}", constraints: "DRAFT|SUBMITTED|UNDER_REVIEW|NEEDS_REVISION|APPROVED|REJECTED" }

  - name: Enrollment
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the enrolled member" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; owning program (copied from member)" }
      - { name: plan_id, type: string, source: input, description: "FK -> PlanCatalogItem.id; chosen plan tier" }
      - { name: intake_assessment_id, type: string, source: input, description: "FK -> IntakeAssessment.id; must be APPROVED at activation" }
      - { name: billing_anchor_utc, type: datetime, source: computed, default: null, description: "UTC instant clinical activation occurred; first billing cycle starts here" }
      - { name: cycle_length_days, type: integer, source: input, default: 30, description: "Length of each recurring billing cycle in days (1..90)" }
      - { name: clinical_status, type: enum, source: system, description: "Parallel dimension 1: PENDING_CLINICAL -> ACTIVE -> GRADUATED / WITHDRAWN", constraints: "PENDING_CLINICAL|ACTIVE|GRADUATED|WITHDRAWN" }
      - { name: billing_status, type: enum, source: system, description: "Parallel dimension 2: UNBILLED -> CURRENT -> PAST_DUE / CLOSED", constraints: "UNBILLED|CURRENT|PAST_DUE|CLOSED" }
      - { name: cycles_billed, type: integer, source: computed, default: 0, description: "Count of non-VOID Invoices generated for this enrollment" }
      - { name: graduation_eligible, type: boolean, source: computed, default: false, description: "True iff a PRIMARY Goal is ACHIEVED and >= MIN_COUNTED_WEIGHINS counted weigh-ins exist; see calculations.graduation_eligibility" }

  - name: Goal
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member (copied from enrollment)" }
      - { name: kind, type: enum, source: input, description: "PRIMARY (target weight, drives graduation) or SECONDARY", constraints: "PRIMARY|SECONDARY" }
      - { name: target_weight_kg, type: number, source: input, description: "Target weight in kg (> 0, < baseline_weight_kg)" }
      - { name: progress_pct, type: number, source: computed, default: 0, description: "= clamp(0,100, (baseline - latest)/(baseline - target) * 100), round 2; see calculations.goal_progress_pct" }
      - { name: status, type: enum, source: system, description: "OPEN -> ACHIEVED / CLOSED", constraints: "OPEN|ACHIEVED|CLOSED" }

  - name: Milestone
    parent: Goal
    common_fields: true
    fields:
      - { name: goal_id, type: string, source: input, description: "FK -> Goal.id; the goal this milestone marks progress toward" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; owning enrollment (copied from goal)" }
      - { name: threshold_pct, type: integer, source: input, description: "Progress percent that triggers this milestone (one of 25, 50, 75, 100)", constraints: "25|50|75|100" }
      - { name: achieved_at_utc, type: datetime, source: computed, default: null, description: "UTC instant the milestone auto-achieved; null while PENDING" }
      - { name: achieved_weight_kg, type: number, source: computed, default: null, description: "latest_weight_kg snapshot at achievement" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACHIEVED / VOIDED", constraints: "PENDING|ACHIEVED|VOIDED" }

  - name: WeighIn
    parent: Enrollment
    common_fields: false   # append-only event log: only id + created_at
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member (copied from enrollment)" }
      - { name: weight_kg, type: number, source: input, description: "Recorded weight in kg (> 0)" }
      - { name: body_fat_pct, type: number, source: input, required: false, description: "Optional body-fat percent (0..70); enables lean-mass tracking" }
      - { name: lean_mass_kg, type: number, source: computed, default: null, description: "= weight_kg * (1 - body_fat_pct/100), round 2, when body_fat_pct present; else null" }
      - { name: recorded_utc, type: datetime, source: computed, description: "Program.current_utc at the moment of recording" }
      - { name: counts, type: boolean, source: input, default: true, description: "When false the weigh-in is logged for audit but excluded from baseline/latest/progress/graduation aggregates" }

  - name: CoachAssignment
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; assigned enrollment" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; assigned coach" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member (copied from enrollment)" }
      - { name: assigned_at_utc, type: datetime, source: computed, description: "Program.current_utc at assignment" }
      - { name: ended_at_utc, type: datetime, source: computed, default: null, description: "Program.current_utc at unassignment/closure" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> ENDED", constraints: "ACTIVE|ENDED" }

  - name: MessageThread
    parent: CoachAssignment
    common_fields: true
    fields:
      - { name: coach_assignment_id, type: string, source: input, description: "FK -> CoachAssignment.id; the assignment this thread belongs to" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; owning enrollment (copied from assignment)" }
      - { name: subject, type: string, source: input, description: "Thread subject" }
      - { name: message_count, type: integer, source: computed, default: 0, description: "Count of Messages posted to this thread" }
      - { name: status, type: enum, source: system, description: "OPEN -> ARCHIVED", constraints: "OPEN|ARCHIVED" }

  - name: Message
    parent: MessageThread
    common_fields: false   # append-only: only id + created_at
    fields:
      - { name: message_thread_id, type: string, source: input, description: "FK -> MessageThread.id; owning thread" }
      - { name: sender_role, type: enum, source: system, description: "MEMBER or COACH, derived from caller role", constraints: "MEMBER|COACH" }
      - { name: sender_user_id, type: string, source: system, description: "X-User-ID of the sender" }
      - { name: body, type: string, source: input, description: "Message text (1..4000 chars)" }
      - { name: posted_utc, type: datetime, source: computed, description: "Program.current_utc at posting" }

  - name: Invoice
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; billed enrollment" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; billed member" }
      - { name: cycle_index, type: integer, source: computed, description: "0-based sequence within the enrollment (cycle 0 carries enrollment_fee)" }
      - { name: period_start_utc, type: datetime, source: computed, description: "Half-open cycle start, inclusive" }
      - { name: period_end_utc, type: datetime, source: computed, description: "Half-open cycle end, exclusive (= start + cycle_length_days)" }
      - { name: line_items, type: array, source: computed, description: "List of {code, amount_cents}; codes RECURRING_FEE, ENROLLMENT_FEE, PRORATION_CREDIT" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded amounts; see calculations.invoice_total (round-per-line then sum)" }
      - { name: hsa_fsa_eligible_cents, type: integer, source: computed, description: "Portion of subtotal_cents that is HSA/FSA reimbursable; see calculations.hsa_fsa_eligible_amount" }
      - { name: prorated, type: boolean, source: computed, default: false, description: "True iff this invoice carries a PRORATION_CREDIT line from early cancellation" }
      - { name: status, type: enum, source: system, description: "ISSUED -> PAID / VOID", constraints: "ISSUED|PAID|VOID" }

  - name: EligibilityDetermination
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; assessed member" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; owning program (copied from member)" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrollment whose plan eligibility is determined" }
      - { name: composite_score, type: number, source: computed, description: "Combinatorial eligibility score over bmi/comorbidity/tier; see calculations.eligibility_composite_score" }
      - { name: hsa_fsa_eligible, type: boolean, source: computed, default: false, description: "True iff APPROVED with composite_score >= ELIGIBILITY_THRESHOLD (35); gates HSA/FSA invoice classification" }
      - { name: determined_utc, type: datetime, source: computed, default: null, description: "UTC the determination was approved/denied; null while PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED / DENIED", constraints: "PENDING|APPROVED|DENIED" }

  - name: RxAuthorization
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the RX-tier enrollment" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the member (copied from enrollment)" }
      - { name: eligibility_determination_id, type: string, source: input, description: "FK -> EligibilityDetermination.id; must be APPROVED at issuance" }
      - { name: clinician_user_id, type: string, source: system, description: "X-User-ID of the issuing Clinician" }
      - { name: qualifying_bmi, type: number, source: computed, default: null, description: "BMI snapshot used for the >= threshold gate at issuance; null until ISSUED" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> ISSUED / DENIED / REVOKED", constraints: "REQUESTED|ISSUED|DENIED|REVOKED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IntakeAssessment
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wm/intake-assessments/{assessmentId}/submit"
        actor: Member
        preconditions:
          - "Assessment in DRAFT (ERR_INVALID_STATE)"
          - "weight_kg > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "bmi computed from member.height_cm; risk_band computed"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /wm/intake-assessments/{assessmentId}/start-review"
        actor: Clinician
        preconditions:
          - "Assessment in SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: UNDER_REVIEW
        to: NEEDS_REVISION
        trigger: "POST /wm/intake-assessments/{assessmentId}/request-revision"
        actor: Clinician
        preconditions:
          - "Assessment in UNDER_REVIEW (ERR_INVALID_STATE)"
          - "review_notes non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "review_notes stored"

      - from: NEEDS_REVISION
        to: SUBMITTED
        trigger: "POST /wm/intake-assessments/{assessmentId}/submit"
        actor: Member
        preconditions:
          - "Assessment in NEEDS_REVISION (ERR_INVALID_STATE)"
          - "weight_kg > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "revision_round += 1"
          - "bmi recomputed; risk_band recomputed"
        note: "Cycle: NEEDS_REVISION -> SUBMITTED -> UNDER_REVIEW -> NEEDS_REVISION ... (Rule 3 cyclic shape)"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /wm/intake-assessments/{assessmentId}/approve"
        actor: Clinician
        preconditions:
          - "Assessment in UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "member.baseline_weight_kg = assessment.weight_kg"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /wm/intake-assessments/{assessmentId}/reject"
        actor: Clinician
        preconditions:
          - "Assessment in UNDER_REVIEW (ERR_INVALID_STATE)"
          - "review_notes non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "review_notes stored"

  - entity: Enrollment
    initial_state: PENDING_CLINICAL   # clinical_status initial value
    terminal_states: [GRADUATED, WITHDRAWN]   # terminal values of clinical_status
    transitions:
      # --- clinical_status dimension (parallel dim 1) ---
      - from: PENDING_CLINICAL
        to: ACTIVE
        trigger: "POST /wm/enrollments/{enrollmentId}/activate"
        actor: ProgramAdmin
        preconditions:
          - "clinical_status == PENDING_CLINICAL (ERR_INVALID_STATE)"
          - "Referenced IntakeAssessment.status == APPROVED (ERR_INTAKE_NOT_APPROVED) [cross-entity: Enrollment depends on IntakeAssessment]"
          - "If plan.tier == RX: an RxAuthorization for this enrollment in ISSUED status MUST exist (ERR_RX_AUTHORIZATION_REQUIRED) [cross-entity: Enrollment depends on RxAuthorization]"
          - "plan.active == true (ERR_PLAN_RETIRED)"
        side_effects:
          - "clinical_status = ACTIVE; member.status = ENROLLED"
          - "billing_anchor_utc = program.current_utc"
          - "billing_status: UNBILLED -> CURRENT (auto)"
          - "Invoice cycle 0 generated (RECURRING_FEE + ENROLLMENT_FEE line items, calculations.invoice_total); cycles_billed = 1"

      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /wm/enrollments/{enrollmentId}/graduate"
        actor: ProgramAdmin
        preconditions:
          - "clinical_status == ACTIVE (ERR_INVALID_STATE)"
          - "graduation_eligible == true (ERR_GRADUATION_CRITERIA_NOT_MET) — PRIMARY Goal ACHIEVED AND >= MIN_COUNTED_WEIGHINS counted weigh-ins"
        side_effects:
          - "clinical_status = GRADUATED; member.status = GRADUATED"
          - "CASCADE depth>=3 (Rule 4): every OPEN Goal -> CLOSED; each Goal CLOSED transition VOIDs that goal's PENDING Milestones; the goal-closure step then ends every ACTIVE CoachAssignment of the enrollment -> ENDED (coach.active_member_count -= 1 each); each CoachAssignment ENDED transition ARCHIVES its OPEN MessageThreads"
          - "Final settlement Invoice issued with PRORATION_CREDIT if current cycle unfinished (calculations.invoice_proration final variant); member.account_balance_cents += proration_credit_cents; billing_status -> CLOSED"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /wm/enrollments/{enrollmentId}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "clinical_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "clinical_status = WITHDRAWN; member.status = WITHDRAWN"
          - "CASCADE depth>=2 (Rule 4): every OPEN Goal -> CLOSED; each Goal CLOSED transition VOIDs that goal's PENDING Milestones"
          - "every ACTIVE CoachAssignment -> ENDED (coach.active_member_count -= 1); OPEN MessageThreads ARCHIVED"
          - "Final settlement Invoice issued with PRORATION_CREDIT for unused days (calculations.invoice_proration final variant); member.account_balance_cents += proration_credit_cents (refund invariant, Rule 9); billing_status -> CLOSED"

      - from: PENDING_CLINICAL
        to: WITHDRAWN
        trigger: "POST /wm/enrollments/{enrollmentId}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "clinical_status == PENDING_CLINICAL (ERR_INVALID_STATE)"
        side_effects:
          - "clinical_status = WITHDRAWN; member.status = WITHDRAWN"
          - "No invoice was ever issued (cycles_billed == 0): no proration, no refund; account_balance_cents unchanged; billing_status -> CLOSED"

      # --- billing_status dimension (parallel dim 2; evolves independently while clinical_status ACTIVE) ---
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /wm/invoices/{invoiceId}/mark-past-due"
        actor: BillingAgent
        preconditions:
          - "enrollment.billing_status == CURRENT (ERR_INVALID_STATE)"
          - "Target Invoice.status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "billing_status = PAST_DUE (clinical_status unchanged — parallel dimensions)"

      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /wm/invoices/{invoiceId}/pay"
        actor: BillingAgent
        preconditions:
          - "Target Invoice.status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "Invoice.status -> PAID; if billing_status == PAST_DUE then billing_status = CURRENT"

  - entity: EligibilityDetermination
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /wm/eligibility-determinations/{determinationId}/approve"
        actor: Clinician
        preconditions:
          - "Determination in PENDING (ERR_INVALID_STATE)"
          - "composite_score >= ELIGIBILITY_THRESHOLD (ERR_ELIGIBILITY_SCORE_BELOW_THRESHOLD)"
        side_effects:
          - "hsa_fsa_eligible = true; determined_utc = program.current_utc"

      - from: PENDING
        to: DENIED
        trigger: "POST /wm/eligibility-determinations/{determinationId}/deny"
        actor: Clinician
        preconditions:
          - "Determination in PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "hsa_fsa_eligible = false; determined_utc = program.current_utc"

  - entity: RxAuthorization
    initial_state: REQUESTED
    terminal_states: [ISSUED, DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /wm/rx-authorizations/{rxId}/issue"
        actor: Clinician
        preconditions:
          - "RxAuthorization in REQUESTED (ERR_INVALID_STATE)"
          - "expected_enrollment_version matches Enrollment.version (ERR_STALE_ENROLLMENT_VERSION) [OCC]"
          - "Referenced EligibilityDetermination.status == APPROVED (ERR_ELIGIBILITY_NOT_APPROVED) [cross-entity: RxAuthorization depends on EligibilityDetermination]"
          - "Member BMI >= RX_BMI_MIN (30.0) OR (BMI >= RX_BMI_COMORBID_MIN (27.0) AND member's APPROVED intake comorbidity_count >= 1) (ERR_BMI_BELOW_RX_THRESHOLD) [boundary precision]"
        side_effects:
          - "qualifying_bmi snapshotted; clinician_user_id stored; enrollment.version += 1"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /wm/rx-authorizations/{rxId}/deny"
        actor: Clinician
        preconditions:
          - "RxAuthorization in REQUESTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: ISSUED
        to: REVOKED
        trigger: "POST /wm/rx-authorizations/{rxId}/revoke"
        actor: Clinician
        preconditions:
          - "RxAuthorization in ISSUED (ERR_INVALID_STATE)"
          - "Enrollment.clinical_status != ACTIVE (ERR_ENROLLMENT_ACTIVE_RX_LOCKED) — cannot revoke an authorization an ACTIVE RX enrollment relies on"
        side_effects: []

  - entity: Goal
    initial_state: OPEN
    terminal_states: [ACHIEVED, CLOSED]
    transitions:
      - from: OPEN
        to: ACHIEVED
        trigger: "system (automatic when progress_pct >= 100 after a counted WeighIn is recorded)"
        actor: system
        preconditions:
          - "Goal.status == OPEN"
          - "progress_pct >= 100.0 (boundary: exactly 100 achieves)"
        side_effects:
          - "All PENDING Milestones (threshold_pct <= 100) of this goal -> ACHIEVED (achieved_at_utc, achieved_weight_kg set)"
          - "If kind == PRIMARY: enrollment.graduation_eligible recomputed (calculations.graduation_eligibility)"

      - from: OPEN
        to: CLOSED
        trigger: "system (cascade from enrollment graduate/withdraw)"
        actor: system
        preconditions:
          - "Goal.status == OPEN"
        side_effects:
          - "Each PENDING Milestone of this goal -> VOIDED"

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [ACHIEVED, VOIDED]
    transitions:
      - from: PENDING
        to: ACHIEVED
        trigger: "system (automatic when owning Goal.progress_pct >= threshold_pct after a counted WeighIn)"
        actor: system
        preconditions:
          - "Milestone.status == PENDING"
          - "owning Goal.progress_pct >= threshold_pct (boundary: >= not >)"
        side_effects:
          - "achieved_at_utc = program.current_utc; achieved_weight_kg = member.latest_weight_kg"

      - from: PENDING
        to: VOIDED
        trigger: "system (cascade from Goal CLOSED)"
        actor: system
        preconditions:
          - "Milestone.status == PENDING"
        side_effects: []

  - entity: CoachAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /wm/coach-assignments/{assignmentId}/end   OR system cascade from enrollment graduate/withdraw"
        actor: ProgramAdmin | system
        preconditions:
          - "CoachAssignment.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "ended_at_utc = program.current_utc; coach.active_member_count -= 1 (load conservation, Rule 9)"
          - "Owning OPEN MessageThreads -> ARCHIVED"

  - entity: MessageThread
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: ARCHIVED
        trigger: "POST /wm/message-threads/{threadId}/archive   OR system cascade from CoachAssignment ENDED"
        actor: Coach | ProgramAdmin | system
        preconditions:
          - "MessageThread.status == OPEN (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /wm/invoices/{invoiceId}/pay"
        actor: BillingAgent
        preconditions:
          - "Invoice.status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "If enrollment.billing_status == PAST_DUE: billing_status -> CURRENT"

      - from: ISSUED
        to: VOID
        trigger: "POST /wm/invoices/{invoiceId}/void"
        actor: BillingAgent
        preconditions:
          - "Invoice.status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
          - "Invoice.cycle_index > 0 (ERR_CANNOT_VOID_INITIAL_INVOICE) — the cycle-0 enrollment invoice is immutable"
        side_effects:
          - "member.account_balance_cents += invoice.subtotal_cents (reversal credit); enrollment.cycles_billed -= 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version — sole sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: weighin-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /wm/weigh-ins"
    occ_field: "expected_enrollment_version"
    description: |
      Recording a WeighIn against an Enrollment whose version has advanced since
      the client last observed it is rejected. A counted WeighIn recomputes
      member latest_weight/progress, Goal progress, and may auto-achieve
      Milestones — all of which bump enrollment.version. A writer holding a stale
      view of the enrollment must re-read before posting another weigh-in.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

  - rule_id: rx-issue-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /wm/rx-authorizations/{rxId}/issue"
    occ_field: "expected_enrollment_version"
    description: |
      Issuing an RxAuthorization against an Enrollment whose version has advanced
      since the client last observed it is rejected. Another writer may have just
      issued/denied an authorization or recorded a weigh-in, advancing
      enrollment.version; the current issuer's view is therefore stale.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bmi
    trigger: "IntakeAssessment submit / resubmit; read on RxAuthorization issue"
    algorithm: arithmetic
    formula: |
      bmi = weight_kg / ( (member.height_cm / 100.0) ^ 2 )
      round to 1 decimal place, round_half_up
    input_set: "single IntakeAssessment.weight_kg + parent Member.height_cm"
    precision: "1 decimal place, round_half_up"

  - name: intake_risk_band
    trigger: "IntakeAssessment submit / resubmit"
    algorithm: threshold
    formula: |
      if bmi >= 35.0 OR comorbidity_count >= 2: risk_band = HIGH
      elif bmi >= 30.0 OR comorbidity_count == 1: risk_band = MODERATE
      else: risk_band = LOW
    input_set: "single IntakeAssessment (bmi, comorbidity_count)"
    constants: { HIGH_BMI: 35.0, MOD_BMI: 30.0 }

  - name: scale_progress_pct
    trigger: "counted WeighIn recorded; member read"
    algorithm: aggregation
    formula: |
      # Variant A of the dual-variant progress pair (Rule 1, Member domain).
      if baseline_weight_kg is null or latest_weight_kg is null: scale_progress_pct = 0
      else:
        lost  = baseline_weight_kg - latest_weight_kg
        denom = baseline_weight_kg * GOAL_FRACTION       # nominal 10%-of-body-weight target band
        scale_progress_pct = round_half_up(clamp(0, 100, (lost / denom) * 100), 2)
    input_set: "Member.baseline_weight_kg, Member.latest_weight_kg (from latest COUNTED WeighIn)"
    constants: { GOAL_FRACTION: 0.10 }
    precision: "2 decimals, round_half_up"
    variants:
      - name: scale_weight
        when: "default; uses raw scale-weight delta"
        difference: "ignores body composition entirely"

  - name: lean_adjusted_progress_pct
    trigger: "counted WeighIn carrying body_fat_pct recorded; member read"
    algorithm: aggregation
    formula: |
      # Variant B of the dual-variant progress pair (Rule 1, Member domain).
      # Same member, DIFFERENT algorithm -> different number than scale_progress_pct.
      if baseline_weight_kg is null or latest_lean_mass_kg is null: lean_adjusted_progress_pct = 0
      else:
        baseline_lean = baseline_weight_kg * (1 - ASSUMED_BASELINE_FAT)     # assumed 30% baseline body fat
        fat_lost      = (baseline_weight_kg - baseline_lean) - (latest_weight_kg - latest_lean_mass_kg)
        denom         = baseline_weight_kg * GOAL_FRACTION
        lean_adjusted_progress_pct = round_half_up(clamp(0, 100, (fat_lost / denom) * 100), 2)
    input_set: "Member.baseline_weight_kg, latest_weight_kg, latest_lean_mass_kg"
    constants: { GOAL_FRACTION: 0.10, ASSUMED_BASELINE_FAT: 0.30 }
    precision: "2 decimals, round_half_up"
    variants:
      - name: lean_mass_adjusted
        when: "latest counted WeighIn carries body_fat_pct"
        difference: "credits only fat-mass loss, not total scale loss; diverges from scale_progress_pct for the same member"

  - name: goal_progress_pct
    trigger: "counted WeighIn recorded; goal read"
    algorithm: threshold
    formula: |
      if member.latest_weight_kg is null: progress_pct = 0
      else:
        span = baseline_weight_kg - target_weight_kg     # > 0 by validation ERR_TARGET_NOT_BELOW_BASELINE
        lost = baseline_weight_kg - member.latest_weight_kg
        progress_pct = round_half_up(clamp(0, 100, (lost / span) * 100), 2)
      # boundary: progress_pct >= 100.0 auto-achieves the goal (>= not >)
    input_set: "Goal.target_weight_kg, Member.baseline_weight_kg, Member.latest_weight_kg"
    precision: "2 decimals, round_half_up"

  - name: eligibility_composite_score
    trigger: "EligibilityDetermination create; read on approve"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial (Rule 2 mode a): >=3 inputs, nested min/max + conditional branches.
      bmi_pts        = min(BMI_CAP, max(0, (bmi - BMI_BASE) * BMI_WEIGHT))       # 0..40
      comorbid_pts   = min(COMORBID_CAP, comorbidity_count * COMORBID_WEIGHT)    # 0..30
      tier_pts       = (20 if plan.tier == RX else 10 if plan.tier == COACHING else 5)
      composite_score = round_half_up(bmi_pts + comorbid_pts + tier_pts, 2)
      # hsa_fsa_eligible set true only when this determination is APPROVED and composite_score >= ELIGIBILITY_THRESHOLD
    input_set: "member's APPROVED IntakeAssessment (bmi, comorbidity_count) + enrollment.plan.tier"
    constants: { ELIGIBILITY_THRESHOLD: 35, BMI_BASE: 25.0, BMI_WEIGHT: 4, COMORBID_WEIGHT: 15, BMI_CAP: 40, COMORBID_CAP: 30 }
    precision: "2 decimals, round_half_up"

  - name: invoice_total
    trigger: "Enrollment activate (cycle 0); bill-next-cycle (recurring)"
    algorithm: aggregation
    formula: |
      # Combinatorial (Rule 2 mode b): ROUND-PER-LINE-ITEM THEN SUM (pinned order).
      # Each line amount is rounded to integer cents independently, THEN summed.
      # (Summing raw then rounding once is FORBIDDEN.)
      lines = [ {code: RECURRING_FEE, amount_cents: round_half_up(plan.monthly_fee_cents)} ]
      if cycle_index == 0 and plan.enrollment_fee_cents > 0:
        lines.append({code: ENROLLMENT_FEE, amount_cents: round_half_up(plan.enrollment_fee_cents)})
      subtotal_cents = sum(line.amount_cents for line in lines)   # sum of already-rounded ints
    input_set: "PlanCatalogItem.monthly_fee_cents, enrollment_fee_cents, Invoice.cycle_index"
    precision: "integer cents; round each line then sum"
    variants:
      - name: provisional_full_cycle
        when: "at activation / recurring generation"
        difference: "charges full monthly fee for the entire cycle regardless of days actually used (forward-looking estimate)"

  - name: invoice_proration
    trigger: "Enrollment graduate / withdraw before current cycle end"
    algorithm: chronological
    formula: |
      # FINAL variant — paired with invoice_total's provisional variant (Rule 1, Invoice domain).
      elapsed_days = floor( (program.current_utc - current_invoice.period_start_utc) / SECONDS_PER_DAY )
      elapsed_days = clamp(0, cycle_length_days, elapsed_days)
      unused_days  = cycle_length_days - elapsed_days
      daily_rate_cents = round_half_up(plan.monthly_fee_cents / cycle_length_days)   # round-per-line: round rate before multiply
      proration_credit_cents = daily_rate_cents * unused_days
      # settlement invoice line: {code: PRORATION_CREDIT, amount_cents: -proration_credit_cents}
      member.account_balance_cents += proration_credit_cents
    input_set: "current ISSUED Invoice period_start, Program.current_utc, plan.monthly_fee_cents, cycle_length_days"
    constants: { SECONDS_PER_DAY: 86400 }
    precision: "integer cents; daily rate rounded before multiply"
    variants:
      - name: final_day_counted
        when: "at graduate/withdraw mid-cycle"
        difference: "credits unused whole days at rounded daily rate; chronological day count vs forward-looking full charge"

  - name: hsa_fsa_eligible_amount
    trigger: "Invoice generation"
    algorithm: aggregation
    formula: |
      # If the member has an APPROVED EligibilityDetermination for this enrollment
      # whose hsa_fsa_eligible == true: RECURRING_FEE + PRORATION_CREDIT lines count.
      # ENROLLMENT_FEE is NEVER reimbursable.
      if no APPROVED+eligible EligibilityDetermination for this enrollment: hsa_fsa_eligible_cents = 0
      else:
        eligible = sum(line.amount_cents for line in line_items if line.code == RECURRING_FEE)
        eligible += sum(line.amount_cents for line in line_items if line.code == PRORATION_CREDIT)  # negative
        hsa_fsa_eligible_cents = max(0, eligible)
    input_set: "Invoice.line_items, member's APPROVED EligibilityDetermination.hsa_fsa_eligible for this enrollment"
    precision: "integer cents"

  - name: graduation_eligibility
    trigger: "Goal ACHIEVED; counted WeighIn recorded; read on graduate"
    algorithm: threshold
    formula: |
      counted_weighins     = count of WeighIns for enrollment with counts == true
      has_primary_achieved = exists Goal with kind == PRIMARY and status == ACHIEVED
      graduation_eligible  = has_primary_achieved AND counted_weighins >= MIN_COUNTED_WEIGHINS
    input_set: "Enrollment's PRIMARY Goals (status filter ACHIEVED), counted WeighIns (counts==true)"
    constants: { MIN_COUNTED_WEIGHINS: 3 }

  - name: coach_active_load
    trigger: "CoachAssignment create (-> ACTIVE) / end (-> ENDED)"
    algorithm: aggregation
    formula: |
      # Conserved quantity (Rule 9): coach.active_member_count == count of that
      # coach's CoachAssignments in ACTIVE status, at all times. An assign followed
      # by its end leaves the count unchanged.
      coach.active_member_count = count(CoachAssignment where coach_id == coach.id and status == ACTIVE)
      # capacity gate: a new ACTIVE assignment is rejected when active_member_count
      # would become strictly greater than program.coach_max_active_members.
    input_set: "coach's CoachAssignments (status filter ACTIVE)"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource IDs exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Body schema well-formed: required fields present, types correct, enums valid, numeric ranges (height_cm>0, weight_kg>0, body_fat_pct in 0..70, cycle_length_days 1..90, threshold_pct in {25,50,75,100})"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: business_referential
    check: "Body FK ids (program_id, member_id, plan_id, enrollment_id, coach_id, goal_id, intake_assessment_id, eligibility_determination_id, coach_assignment_id, message_thread_id) reference existing resources in the same program"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "all create endpoints with body FKs"

  - priority: 6
    category: business_referential
    check: "Member email unique within program (case-insensitive); Coach email unique within program"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /wm/members, POST /wm/coaches"

  - priority: 7
    category: concurrency
    check: "When expected_enrollment_version supplied, it must equal Enrollment.version (OCC, §1.2.1)"
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    applies_to: "POST /wm/weigh-ins, POST /wm/rx-authorizations/{rxId}/issue"
    note: "OCC check runs after existence/auth, before business logic"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_referential
    check: "Enrollment.intake_assessment_id must reference an IntakeAssessment belonging to the same member as member_id"
    error_id: ERR_INTAKE_MEMBER_MISMATCH
    http_status: 409
    applies_to: "POST /wm/enrollments"

  - priority: 10
    category: business_referential
    check: "Goal.target_weight_kg must be > 0 and strictly less than member.baseline_weight_kg"
    error_id: ERR_TARGET_NOT_BELOW_BASELINE
    http_status: 409
    applies_to: "POST /wm/goals"

  - priority: 11
    category: business_constraint
    check: "Plan must be active (not retired) to enroll or activate"
    error_id: ERR_PLAN_RETIRED
    http_status: 409
    applies_to: "POST /wm/enrollments, POST /wm/enrollments/{enrollmentId}/activate"

  - priority: 12
    category: state
    check: "Enrollment activation requires referenced IntakeAssessment.status == APPROVED"
    error_id: ERR_INTAKE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /wm/enrollments/{enrollmentId}/activate"

  - priority: 13
    category: business_safety
    check: "RX-tier enrollment activation requires an ISSUED RxAuthorization for the enrollment"
    error_id: ERR_RX_AUTHORIZATION_REQUIRED
    http_status: 409
    applies_to: "POST /wm/enrollments/{enrollmentId}/activate (RX tier)"

  - priority: 14
    category: business_referential
    check: "RxAuthorization issuance requires referenced EligibilityDetermination.status == APPROVED"
    error_id: ERR_ELIGIBILITY_NOT_APPROVED
    http_status: 409
    applies_to: "POST /wm/rx-authorizations/{rxId}/issue"

  - priority: 15
    category: business_safety
    check: "RxAuthorization issuance requires member BMI >= RX_BMI_MIN (30.0), OR BMI >= RX_BMI_COMORBID_MIN (27.0) with member's APPROVED intake comorbidity_count >= 1"
    error_id: ERR_BMI_BELOW_RX_THRESHOLD
    http_status: 409
    applies_to: "POST /wm/rx-authorizations/{rxId}/issue"

  - priority: 16
    category: business_constraint
    check: "An Enrollment may have at most one ACTIVE CoachAssignment at a time (no overlapping active coverage on the enrollment resource)"
    error_id: ERR_ENROLLMENT_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /wm/coach-assignments"

  - priority: 17
    category: business_constraint
    check: "A new ACTIVE assignment must not push the coach's active_member_count strictly above program.coach_max_active_members"
    error_id: ERR_COACH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /wm/coach-assignments"

  - priority: 18
    category: business_temporal
    check: "A new billing cycle's half-open [period_start, period_end) must not overlap an existing non-VOID Invoice period for the enrollment (adjacency at the shared instant is allowed)"
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /wm/enrollments/{enrollmentId}/bill-next-cycle"

  - priority: 19
    category: business_fiscal
    check: "EligibilityDetermination approval requires composite_score >= ELIGIBILITY_THRESHOLD (35)"
    error_id: ERR_ELIGIBILITY_SCORE_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /wm/eligibility-determinations/{determinationId}/approve"

  - priority: 20
    category: state
    check: "Graduation requires graduation_eligible == true"
    error_id: ERR_GRADUATION_CRITERIA_NOT_MET
    http_status: 409
    applies_to: "POST /wm/enrollments/{enrollmentId}/graduate"

  - priority: 21
    category: business_constraint
    check: "Message body must be 1..4000 chars; posting requires owning CoachAssignment ACTIVE and MessageThread OPEN"
    error_id: ERR_THREAD_NOT_OPEN
    http_status: 409
    applies_to: "POST /wm/message-threads/{threadId}/messages"

# =============================================================================
# §1.5 API Endpoint Table   (flat topology under /wm; FK scoping via filters)
# =============================================================================
endpoints:
  # --- Program + clock ---
  - { method: POST, path: "/wm/programs", description: "Create a program", roles: [ProgramAdmin], code: 201, input: [name, "description?", "coach_max_active_members?"], output: Program, side_effects: ["current_utc initialized to epoch 1970-01-01T00:00:00.000Z"] }
  - { method: GET, path: "/wm/programs", description: "List programs", roles: [ProgramAdmin, Clinician, BillingAgent, Coach, Member], code: 200, input: [], output: "Program[]", side_effects: [] }
  - { method: GET, path: "/wm/programs/{programId}", description: "Get a program", roles: [ProgramAdmin, Clinician, BillingAgent, Coach, Member], code: 200, input: [], output: Program, side_effects: [] }
  - { method: POST, path: "/wm/programs/{programId}/clock-set", description: "Set the deterministic program clock", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: Program, side_effects: ["current_utc = to_iso8601 (must be >= prior current_utc)"] }

  # --- Plan catalog ---
  - { method: POST, path: "/wm/plans", description: "Create a plan catalog item", roles: [ProgramAdmin], code: 201, input: [program_id, tier, name, monthly_fee_cents, "enrollment_fee_cents?", "hsa_fsa_default_eligible?"], output: PlanCatalogItem, side_effects: ["requires_rx = (tier==RX); active=true"] }
  - { method: GET, path: "/wm/plans", description: "List plans (filter by program/tier)", roles: [ProgramAdmin, Clinician, BillingAgent, Coach, Member], code: 200, input: ["program_id?", "tier?"], output: "PlanCatalogItem[]", side_effects: [] }
  - { method: GET, path: "/wm/plans/{planId}", description: "Get a plan", roles: [ProgramAdmin, Clinician, BillingAgent, Coach, Member], code: 200, input: [], output: PlanCatalogItem, side_effects: [] }
  - { method: POST, path: "/wm/plans/{planId}/retire", description: "Retire a plan (blocks new enrollments)", roles: [ProgramAdmin], code: 200, input: [], output: PlanCatalogItem, side_effects: ["active=false"] }

  # --- Members ---
  - { method: POST, path: "/wm/members", description: "Register a member", roles: [ProgramAdmin, Member], code: 201, input: [program_id, full_name, email, height_cm], output: Member, side_effects: ["status=REGISTERED; account_balance_cents=0"] }
  - { method: GET, path: "/wm/members", description: "List members (filter by program/status)", roles: [ProgramAdmin, Clinician, BillingAgent, Coach], code: 200, input: ["program_id?", "status?"], output: "Member[]", side_effects: [] }
  - { method: GET, path: "/wm/members/{memberId}", description: "Get a member (computed progress fields)", roles: [ProgramAdmin, Clinician, BillingAgent, Coach, Member], code: 200, input: [], output: Member, side_effects: [] }

  # --- Coaches ---
  - { method: POST, path: "/wm/coaches", description: "Create a coach", roles: [ProgramAdmin], code: 201, input: [program_id, full_name, email, "specialty?", "accepting?"], output: Coach, side_effects: ["active_member_count=0"] }
  - { method: GET, path: "/wm/coaches", description: "List coaches (filter by program)", roles: [ProgramAdmin, Clinician, BillingAgent, Coach, Member], code: 200, input: ["program_id?"], output: "Coach[]", side_effects: [] }
  - { method: GET, path: "/wm/coaches/{coachId}", description: "Get a coach (active_member_count)", roles: [ProgramAdmin, Clinician, BillingAgent, Coach, Member], code: 200, input: [], output: Coach, side_effects: [] }
  - { method: PATCH, path: "/wm/coaches/{coachId}", description: "Update coach accepting / specialty", roles: [ProgramAdmin, Coach], code: 200, input: ["accepting?", "specialty?"], output: Coach, side_effects: [] }

  # --- Intake assessments ---
  - { method: POST, path: "/wm/intake-assessments", description: "Create a DRAFT intake assessment", roles: [ProgramAdmin, Member], code: 201, input: [member_id, weight_kg, "comorbidity_count?"], output: IntakeAssessment, side_effects: ["status=DRAFT; member.status=INTAKE_PENDING; program_id copied from member"] }
  - { method: GET, path: "/wm/intake-assessments", description: "List intake assessments (filter by member/program/status)", roles: [ProgramAdmin, Clinician, Member], code: 200, input: ["member_id?", "program_id?", "status?"], output: "IntakeAssessment[]", side_effects: [] }
  - { method: GET, path: "/wm/intake-assessments/{assessmentId}", description: "Get an intake assessment", roles: [ProgramAdmin, Clinician, Member], code: 200, input: [], output: IntakeAssessment, side_effects: [] }
  - { method: POST, path: "/wm/intake-assessments/{assessmentId}/submit", description: "Submit / resubmit (cycle)", roles: [ProgramAdmin, Member], code: 200, input: ["weight_kg?", "comorbidity_count?"], output: IntakeAssessment, side_effects: ["DRAFT|NEEDS_REVISION -> SUBMITTED; bmi+risk_band computed; revision_round++ on resubmit"] }
  - { method: POST, path: "/wm/intake-assessments/{assessmentId}/start-review", description: "Begin clinical review", roles: [Clinician], code: 200, input: [], output: IntakeAssessment, side_effects: ["SUBMITTED -> UNDER_REVIEW"] }
  - { method: POST, path: "/wm/intake-assessments/{assessmentId}/request-revision", description: "Request revision (cycle back)", roles: [Clinician], code: 200, input: [review_notes], output: IntakeAssessment, side_effects: ["UNDER_REVIEW -> NEEDS_REVISION"] }
  - { method: POST, path: "/wm/intake-assessments/{assessmentId}/approve", description: "Approve intake", roles: [Clinician], code: 200, input: [], output: IntakeAssessment, side_effects: ["UNDER_REVIEW -> APPROVED; member.baseline_weight_kg set"] }
  - { method: POST, path: "/wm/intake-assessments/{assessmentId}/reject", description: "Reject intake", roles: [Clinician], code: 200, input: [review_notes], output: IntakeAssessment, side_effects: ["UNDER_REVIEW -> REJECTED"] }

  # --- Enrollments ---
  - { method: POST, path: "/wm/enrollments", description: "Create a PENDING_CLINICAL enrollment", roles: [ProgramAdmin], code: 201, input: [member_id, plan_id, intake_assessment_id, "cycle_length_days?"], output: Enrollment, side_effects: ["clinical_status=PENDING_CLINICAL; billing_status=UNBILLED; program_id copied from member"] }
  - { method: GET, path: "/wm/enrollments", description: "List enrollments (filter by member/program/plan/intake/status)", roles: [ProgramAdmin, Clinician, BillingAgent, Coach, Member], code: 200, input: ["member_id?", "program_id?", "plan_id?", "intake_assessment_id?", "clinical_status?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/wm/enrollments/{enrollmentId}", description: "Get an enrollment", roles: [ProgramAdmin, Clinician, BillingAgent, Coach, Member], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/wm/enrollments/{enrollmentId}/activate", description: "Clinically activate; issue cycle-0 invoice", roles: [ProgramAdmin], code: 200, input: [], output: Enrollment, side_effects: ["clinical_status->ACTIVE; billing_status->CURRENT; member.status=ENROLLED; billing_anchor_utc set; cycle-0 Invoice issued; cycles_billed=1"] }
  - { method: POST, path: "/wm/enrollments/{enrollmentId}/bill-next-cycle", description: "Generate the next recurring Invoice", roles: [BillingAgent], code: 201, input: [], output: Invoice, side_effects: ["new Invoice (cycle_index = cycles_billed); cycles_billed++; period validated non-overlapping (calculations.invoice_total)"] }
  - { method: POST, path: "/wm/enrollments/{enrollmentId}/graduate", description: "Graduate the program (cascade)", roles: [ProgramAdmin], code: 200, input: [], output: Enrollment, side_effects: ["clinical_status->GRADUATED; cascade close Goals->void Milestones->end CoachAssignments->archive threads; final prorated Invoice; billing_status->CLOSED"] }
  - { method: POST, path: "/wm/enrollments/{enrollmentId}/withdraw", description: "Withdraw (cascade + refund)", roles: [ProgramAdmin], code: 200, input: [], output: Enrollment, side_effects: ["clinical_status->WITHDRAWN; cascade close Goals->void Milestones; end CoachAssignments; final prorated Invoice; member.account_balance_cents += proration credit; billing_status->CLOSED"] }

  # --- Weigh-ins (event log, OCC-guarded) ---
  - { method: POST, path: "/wm/weigh-ins", description: "Record a weigh-in", roles: [ProgramAdmin, Coach, Member], code: 201, input: [enrollment_id, weight_kg, "body_fat_pct?", "counts?", expected_enrollment_version], output: WeighIn, side_effects: ["lean_mass computed; member latest_weight/lean/progress recomputed; Goal progress recomputed; Milestones auto-achieve; graduation_eligible recomputed; enrollment.version += 1"] }
  - { method: GET, path: "/wm/weigh-ins", description: "List weigh-ins (filter by enrollment/member/counts)", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: ["enrollment_id?", "member_id?", "counts?"], output: "WeighIn[]", side_effects: [] }
  - { method: GET, path: "/wm/weigh-ins/{weighInId}", description: "Get a weigh-in", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: [], output: WeighIn, side_effects: [] }

  # --- Goals + milestones ---
  - { method: POST, path: "/wm/goals", description: "Create a goal", roles: [ProgramAdmin, Coach], code: 201, input: [enrollment_id, kind, target_weight_kg], output: Goal, side_effects: ["status=OPEN; progress_pct computed; member_id copied from enrollment"] }
  - { method: GET, path: "/wm/goals", description: "List goals (filter by enrollment/member/kind/status)", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: ["enrollment_id?", "member_id?", "kind?", "status?"], output: "Goal[]", side_effects: [] }
  - { method: GET, path: "/wm/goals/{goalId}", description: "Get a goal", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: [], output: Goal, side_effects: [] }
  - { method: POST, path: "/wm/milestones", description: "Define a milestone on a goal", roles: [ProgramAdmin, Coach], code: 201, input: [goal_id, threshold_pct], output: Milestone, side_effects: ["status=PENDING; enrollment_id copied from goal"] }
  - { method: GET, path: "/wm/milestones", description: "List milestones (filter by goal/enrollment/status)", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: ["goal_id?", "enrollment_id?", "status?"], output: "Milestone[]", side_effects: [] }
  - { method: GET, path: "/wm/milestones/{milestoneId}", description: "Get a milestone", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: [], output: Milestone, side_effects: [] }

  # --- Coach assignments ---
  - { method: POST, path: "/wm/coach-assignments", description: "Assign a coach to an enrollment", roles: [ProgramAdmin], code: 201, input: [enrollment_id, coach_id], output: CoachAssignment, side_effects: ["status=ACTIVE; coach.active_member_count += 1; capacity + single-active checks; member_id copied from enrollment"] }
  - { method: GET, path: "/wm/coach-assignments", description: "List coach assignments (filter by coach/enrollment/member/status)", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: ["coach_id?", "enrollment_id?", "member_id?", "status?"], output: "CoachAssignment[]", side_effects: [] }
  - { method: GET, path: "/wm/coach-assignments/{assignmentId}", description: "Get a coach assignment", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: [], output: CoachAssignment, side_effects: [] }
  - { method: POST, path: "/wm/coach-assignments/{assignmentId}/end", description: "End an assignment", roles: [ProgramAdmin], code: 200, input: [], output: CoachAssignment, side_effects: ["status=ENDED; coach.active_member_count -= 1; OPEN threads archived"] }

  # --- Messaging ---
  - { method: POST, path: "/wm/message-threads", description: "Open a message thread on an assignment", roles: [ProgramAdmin, Coach, Member], code: 201, input: [coach_assignment_id, subject], output: MessageThread, side_effects: ["status=OPEN; message_count=0; enrollment_id copied from assignment"] }
  - { method: GET, path: "/wm/message-threads", description: "List threads (filter by assignment/enrollment/status)", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: ["coach_assignment_id?", "enrollment_id?", "status?"], output: "MessageThread[]", side_effects: [] }
  - { method: GET, path: "/wm/message-threads/{threadId}", description: "Get a message thread", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: [], output: MessageThread, side_effects: [] }
  - { method: POST, path: "/wm/message-threads/{threadId}/archive", description: "Archive a thread", roles: [ProgramAdmin, Coach], code: 200, input: [], output: MessageThread, side_effects: ["status=ARCHIVED"] }
  - { method: POST, path: "/wm/message-threads/{threadId}/messages", description: "Post a message", roles: [Coach, Member], code: 201, input: [body], output: Message, side_effects: ["sender_role+sender_user_id from caller; posted_utc set; thread.message_count += 1"] }
  - { method: GET, path: "/wm/messages", description: "List messages (filter by thread)", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: ["message_thread_id?"], output: "Message[]", side_effects: [] }
  - { method: GET, path: "/wm/messages/{messageId}", description: "Get a message", roles: [ProgramAdmin, Clinician, Coach, Member], code: 200, input: [], output: Message, side_effects: [] }

  # --- Invoices ---
  - { method: GET, path: "/wm/invoices", description: "List invoices (filter by enrollment/member/status)", roles: [ProgramAdmin, BillingAgent, Member], code: 200, input: ["enrollment_id?", "member_id?", "status?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/wm/invoices/{invoiceId}", description: "Get an invoice (computed totals, hsa/fsa)", roles: [ProgramAdmin, BillingAgent, Member], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/wm/invoices/{invoiceId}/pay", description: "Mark an invoice paid", roles: [BillingAgent], code: 200, input: [], output: Invoice, side_effects: ["status=PAID; if billing_status PAST_DUE -> CURRENT"] }
  - { method: POST, path: "/wm/invoices/{invoiceId}/mark-past-due", description: "Mark enrollment billing past due", roles: [BillingAgent], code: 200, input: [], output: Invoice, side_effects: ["enrollment.billing_status CURRENT -> PAST_DUE"] }
  - { method: POST, path: "/wm/invoices/{invoiceId}/void", description: "Void a non-initial invoice", roles: [BillingAgent], code: 200, input: [], output: Invoice, side_effects: ["status=VOID; member.account_balance_cents += subtotal_cents; cycles_billed -= 1"] }

  # --- Eligibility determinations ---
  - { method: POST, path: "/wm/eligibility-determinations", description: "Create a PENDING eligibility determination", roles: [ProgramAdmin, Clinician], code: 201, input: [member_id, enrollment_id], output: EligibilityDetermination, side_effects: ["composite_score computed; status=PENDING; program_id copied from member"] }
  - { method: GET, path: "/wm/eligibility-determinations", description: "List determinations (filter by member/program/enrollment/status)", roles: [ProgramAdmin, Clinician, BillingAgent, Member], code: 200, input: ["member_id?", "program_id?", "enrollment_id?", "status?"], output: "EligibilityDetermination[]", side_effects: [] }
  - { method: GET, path: "/wm/eligibility-determinations/{determinationId}", description: "Get a determination", roles: [ProgramAdmin, Clinician, BillingAgent, Member], code: 200, input: [], output: EligibilityDetermination, side_effects: [] }
  - { method: POST, path: "/wm/eligibility-determinations/{determinationId}/approve", description: "Approve determination", roles: [Clinician], code: 200, input: [], output: EligibilityDetermination, side_effects: ["status=APPROVED; hsa_fsa_eligible=true; determined_utc set"] }
  - { method: POST, path: "/wm/eligibility-determinations/{determinationId}/deny", description: "Deny determination", roles: [Clinician], code: 200, input: [], output: EligibilityDetermination, side_effects: ["status=DENIED; hsa_fsa_eligible=false; determined_utc set"] }

  # --- Rx authorizations (OCC-guarded issue) ---
  - { method: POST, path: "/wm/rx-authorizations", description: "Request an Rx authorization", roles: [ProgramAdmin, Clinician], code: 201, input: [enrollment_id, eligibility_determination_id], output: RxAuthorization, side_effects: ["status=REQUESTED; member_id copied from enrollment"] }
  - { method: GET, path: "/wm/rx-authorizations", description: "List Rx authorizations (filter by enrollment/member/determination/status)", roles: [ProgramAdmin, Clinician, Member], code: 200, input: ["enrollment_id?", "member_id?", "eligibility_determination_id?", "status?"], output: "RxAuthorization[]", side_effects: [] }
  - { method: GET, path: "/wm/rx-authorizations/{rxId}", description: "Get an Rx authorization", roles: [ProgramAdmin, Clinician, Member], code: 200, input: [], output: RxAuthorization, side_effects: [] }
  - { method: POST, path: "/wm/rx-authorizations/{rxId}/issue", description: "Issue an Rx authorization (BMI gate, OCC)", roles: [Clinician], code: 200, input: [expected_enrollment_version], output: RxAuthorization, side_effects: ["status=ISSUED; qualifying_bmi snapshotted; clinician_user_id stored; enrollment.version += 1"] }
  - { method: POST, path: "/wm/rx-authorizations/{rxId}/deny", description: "Deny an Rx authorization", roles: [Clinician], code: 200, input: [], output: RxAuthorization, side_effects: ["status=DENIED"] }
  - { method: POST, path: "/wm/rx-authorizations/{rxId}/revoke", description: "Revoke an issued Rx authorization", roles: [Clinician], code: 200, input: [], output: RxAuthorization, side_effects: ["status=REVOKED"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / not-found ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Program not found (path or body program_id)" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "PlanCatalogItem not found (path or body plan_id)" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member not found (path or body member_id)" }
  - { id: ERR_COACH_NOT_FOUND, http: 404, condition: "Coach not found (path or body coach_id)" }
  - { id: ERR_INTAKE_NOT_FOUND, http: 404, condition: "IntakeAssessment not found (path or body intake_assessment_id)" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment not found (path or body enrollment_id)" }
  - { id: ERR_GOAL_NOT_FOUND, http: 404, condition: "Goal not found (path or body goal_id)" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "Milestone not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "CoachAssignment not found (path or body coach_assignment_id)" }
  - { id: ERR_THREAD_NOT_FOUND, http: 404, condition: "MessageThread not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice not found" }
  - { id: ERR_ELIGIBILITY_NOT_FOUND, http: 404, condition: "EligibilityDetermination not found (path or body eligibility_determination_id)" }
  - { id: ERR_RX_NOT_FOUND, http: 404, condition: "RxAuthorization not found" }

  # --- input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, type mismatch, invalid enum, or out-of-range numeric" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Member/Coach email already used within program (case-insensitive)" }

  # --- concurrency (OCC) ---
  - { id: ERR_STALE_ENROLLMENT_VERSION, http: 412, condition: "expected_enrollment_version does not match Enrollment.version" }

  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "Invoice must be in ISSUED status for pay/void/mark-past-due" }
  - { id: ERR_CANNOT_VOID_INITIAL_INVOICE, http: 409, condition: "Cycle-0 enrollment invoice cannot be voided" }

  # --- business referential / constraint ---
  - { id: ERR_INTAKE_MEMBER_MISMATCH, http: 409, condition: "intake_assessment_id references an assessment not belonging to the enrolling member" }
  - { id: ERR_INTAKE_NOT_APPROVED, http: 409, condition: "Enrollment activation requires its IntakeAssessment in APPROVED status" }
  - { id: ERR_TARGET_NOT_BELOW_BASELINE, http: 409, condition: "Goal target_weight_kg not strictly below member baseline_weight_kg (or baseline null)" }
  - { id: ERR_PLAN_RETIRED, http: 409, condition: "Plan is retired and cannot accept enrollments or activation" }
  - { id: ERR_ENROLLMENT_ALREADY_ASSIGNED, http: 409, condition: "Enrollment already has an ACTIVE coach assignment" }
  - { id: ERR_COACH_CAPACITY_EXCEEDED, http: 409, condition: "Coach already holds coach_max_active_members ACTIVE assignments" }
  - { id: ERR_BILLING_PERIOD_OVERLAP, http: 409, condition: "New billing cycle period overlaps an existing non-VOID invoice period" }
  - { id: ERR_THREAD_NOT_OPEN, http: 409, condition: "Cannot post: thread not OPEN or owning assignment not ACTIVE" }

  # --- business safety / fiscal (clinical gates) ---
  - { id: ERR_RX_AUTHORIZATION_REQUIRED, http: 409, condition: "RX-tier enrollment activation requires an ISSUED RxAuthorization" }
  - { id: ERR_ELIGIBILITY_NOT_APPROVED, http: 409, condition: "RxAuthorization issuance requires an APPROVED EligibilityDetermination" }
  - { id: ERR_BMI_BELOW_RX_THRESHOLD, http: 409, condition: "Member BMI below RX issuance threshold (30.0, or 27.0 with >=1 comorbidity)" }
  - { id: ERR_ELIGIBILITY_SCORE_BELOW_THRESHOLD, http: 409, condition: "composite_score below ELIGIBILITY_THRESHOLD (35) on approval" }
  - { id: ERR_GRADUATION_CRITERIA_NOT_MET, http: 409, condition: "graduation_eligible is false (no ACHIEVED primary goal or too few counted weigh-ins)" }
  - { id: ERR_ENROLLMENT_ACTIVE_RX_LOCKED, http: 409, condition: "Cannot revoke an RxAuthorization while its enrollment is clinically ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Operates program, plans, members, coaches, enrollment lifecycle, coach assignments"
    identity: opaque
    exclusive_operations:
      - "POST /wm/programs — create program"
      - "POST /wm/programs/{id}/clock-set — set clock"
      - "POST /wm/plans — create plan"
      - "POST /wm/plans/{id}/retire — retire plan"
      - "POST /wm/coaches — create coach"
      - "POST /wm/enrollments — create enrollment"
      - "POST /wm/enrollments/{id}/activate — activate"
      - "POST /wm/enrollments/{id}/graduate — graduate"
      - "POST /wm/enrollments/{id}/withdraw — withdraw"
      - "POST /wm/coach-assignments — assign coach"
      - "POST /wm/coach-assignments/{id}/end — end assignment"
    shared_operations:
      - "POST /wm/members — register member (also Member)"
      - "PATCH /wm/coaches/{id} — update coach (also Coach)"
      - "POST /wm/intake-assessments (+submit) — (also Member)"
      - "POST /wm/weigh-ins — record weigh-in (also Coach, Member)"
      - "POST /wm/goals, /wm/milestones — (also Coach)"
      - "POST /wm/message-threads (+archive) — (also Coach/Member)"
      - "POST /wm/eligibility-determinations — create (also Clinician)"
      - "POST /wm/rx-authorizations — request (also Clinician)"
      - "GET endpoints — read program data"

  - name: Clinician
    description: "Clinical reviewer: intake review, eligibility approval, Rx authorization"
    identity: opaque
    exclusive_operations:
      - "POST /wm/intake-assessments/{id}/start-review — begin review"
      - "POST /wm/intake-assessments/{id}/request-revision — request revision"
      - "POST /wm/intake-assessments/{id}/approve — approve intake"
      - "POST /wm/intake-assessments/{id}/reject — reject intake"
      - "POST /wm/eligibility-determinations/{id}/approve — approve eligibility"
      - "POST /wm/eligibility-determinations/{id}/deny — deny eligibility"
      - "POST /wm/rx-authorizations/{id}/issue — issue Rx (BMI gate, OCC)"
      - "POST /wm/rx-authorizations/{id}/deny — deny Rx"
      - "POST /wm/rx-authorizations/{id}/revoke — revoke Rx"
    shared_operations:
      - "POST /wm/eligibility-determinations — create (also ProgramAdmin)"
      - "POST /wm/rx-authorizations — request (also ProgramAdmin)"
      - "GET endpoints — read clinical data"

  - name: BillingAgent
    description: "Manages recurring billing and invoice lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /wm/enrollments/{id}/bill-next-cycle — generate cycle invoice"
      - "POST /wm/invoices/{id}/pay — pay invoice"
      - "POST /wm/invoices/{id}/mark-past-due — mark past due"
      - "POST /wm/invoices/{id}/void — void invoice"
    shared_operations:
      - "GET endpoints — read billing data"

  - name: Coach
    description: "Assigned coach: weigh-ins, goals/milestones, messaging on own assignments"
    identity: "entity_backed:Coach"
    exclusive_operations: []
    shared_operations:
      - "POST /wm/weigh-ins — record weigh-in (also ProgramAdmin, Member)"
      - "POST /wm/goals, /wm/milestones — (also ProgramAdmin)"
      - "POST /wm/message-threads (+archive) — (also ProgramAdmin/Member)"
      - "POST /wm/message-threads/{id}/messages — post message (also Member)"
      - "PATCH /wm/coaches/{id} — update self accepting (also ProgramAdmin)"
      - "GET endpoints — read assigned data"

  - name: Member
    description: "The program participant: registration, intake, own weigh-ins, own messaging"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /wm/members — register self (also ProgramAdmin)"
      - "POST /wm/intake-assessments (+submit) — (also ProgramAdmin)"
      - "POST /wm/weigh-ins — record own weigh-in (also ProgramAdmin/Coach)"
      - "POST /wm/message-threads (+messages) — (also Coach)"
      - "GET endpoints — read own data"
