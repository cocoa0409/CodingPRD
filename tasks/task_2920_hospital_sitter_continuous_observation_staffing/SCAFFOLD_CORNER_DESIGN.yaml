              as: StaffingCoordinator
              captures: { ofsa: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u49}", full_name: "Officer Sitter B", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { ofsb: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${ofa}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions under one-to-one watch" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { ofoa: $.data.id, ofoa_v1: $.data.version }
            - call: "POST /observation/orders"
              payload: { patient_id: "${ofb}", ordering_provider_user_id: "prov-1", risk_categories: ["ELOPEMENT"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Elopement risk, awaiting a sitter" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { ofob: $.data.id }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${ofoa}", staff_id: "${ofsa}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${ofoa_v1}" }
              as: StaffingCoordinator
              captures: { ofaa: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${ofaa}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${ofsa}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/safety-events"
              payload: { order_id: "${ofoa}", event_kind: "FALL_WITH_INJURY", narrative: "Fall from chair with a wrist fracture", assignment_id: "${ofaa}" }
              as: Sitter
              as_user_id: "${ofsa}"
              captures: { ofev1: $.data.id }
            - call: "POST /observation/safety-events/${ofev1}/open-incident-review"
              payload: {}
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /observation/safety-events"
              payload: { order_id: "${ofob}", event_kind: "ELOPEMENT_ATTEMPT", narrative: "Found at the stairwell door" }
              as: Sitter
              as_user_id: "${ofsb}"
              captures: { ofev2: $.data.id }
            - call: "POST /observation/safety-events/${ofev2}/escalate-response"
              payload: { response_actions: ["VERBAL_REDIRECTION", "SECURITY_NOTIFIED"] }
              as: SafetyOfficer
              as_user_id: "safety-1"
          trigger:
            - call: "POST /observation/safety-events/${ofev1}/close"
              payload: { resolution: "STAFF_RETRAINING_REQUIRED", review_findings: "Bed alarm not enabled at shift start" }
