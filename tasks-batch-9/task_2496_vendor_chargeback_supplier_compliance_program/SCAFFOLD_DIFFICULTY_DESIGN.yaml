              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r_shp_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
