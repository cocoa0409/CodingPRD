# SCAFFOLD_CORNER_DESIGN.yaml — task_2620_domain_name_dispute_resolution
# §1.9 breadth probe. One instance per applicable row of references/claim-extraction-guide.md,
# walked against SCAFFOLD.yaml §1.1-§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub instead of a recipe. Logical clock default 2026-08-01T00:00:00Z.
scaffold_corner_design:

  - section: entities
    instances:

      - name: registrar_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Registrar
          - endpoints.POST_/udrp/registrars
        distinguishing_aspect: "POST /udrp/registrars with all four inputs returns 201 and a Registrar carrying status ACTIVE, overdue_verification_count 0, version 1 and created_at equal to the logical clock."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
          trigger:
            - call: "POST /udrp/registrars"
              payload: { name: "Northwind Registrar", iana_id: "IANA-9001", contact_email: "abuse@northwind.example", verification_response_hours: 72 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id", reg_ver: "$.data.version" }
            - call: "GET /udrp/registrars/${reg_id}"
              payload: {}
              as: ProviderAdmin
              captures: { reg_status: "$.data.status", reg_overdue: "$.data.overdue_verification_count" }
          assert:
            - "HTTP 201 with response_type object"
            - "Registrar.${reg_id}.name == 'Northwind Registrar', iana_id == 'IANA-9001', contact_email == 'abuse@northwind.example'"
            - "Registrar.${reg_id}.verification_response_hours == 72 (the supplied value, not the default 48)"
            - "Registrar.${reg_id}.status == ACTIVE, overdue_verification_count == 0"
            - "Registrar.${reg_id}.version == 1 and created_at == updated_at == 2026-08-01T00:00:00Z"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: registrar_and_panelist_defaults_apply_when_optional_inputs_are_omitted
        claim_type: defaults
        grounds:
          - entities.Registrar.fields.verification_response_hours
          - entities.Registrar.fields.lock_sla_hours
          - entities.Panelist.fields.max_overlapping_engagements
          - entities.Panelist.fields.status
        distinguishing_aspect: "Omitting verification_response_hours yields 48 and lock_sla_hours yields 24; omitting max_overlapping_engagements yields 5 with Panelist.status AVAILABLE and active_case_load 0."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
          trigger:
            - call: "POST /udrp/registrars"
              payload: { name: "Default Registrar", iana_id: "IANA-9002", contact_email: "abuse@defaultreg.example" }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id", hours: "$.data.verification_response_hours", sla: "$.data.lock_sla_hours" }
            - call: "POST /udrp/panelists"
              payload: { full_name: "Default Panelist", nationality_code: "DE", roster_admitted_at: "2020-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { pan_id: "$.data.id", cap: "$.data.max_overlapping_engagements", pan_status: "$.data.status" }
          assert:
            - "Registrar.${reg_id}.verification_response_hours == 48 and lock_sla_hours == 24"
            - "Panelist.${pan_id}.max_overlapping_engagements == 5, status == AVAILABLE, active_case_load == 0"
            - "Panelist.${pan_id}.firm_name is null and specializations == [], the declared defaults for the omitted optional inputs"
            - "Panelist.${pan_id}.unavailable_from is null and unavailable_to is null"

      - name: case_creation_computes_money_fields_and_system_fields_at_filing
        claim_type: computed_fields
        grounds:
          - calculations.filing_fee_assessment
          - entities.Case.fields.case_number
          - entities.Case.fields.required_seat_count
          - entities.Case.fields.assessed_fee_cents
          - entities.Case.fields.fee_variant_applied
        distinguishing_aspect: "A filed single-member case carries required_seat_count 1, assessed_fee_cents 150000, complainant_share_cents 150000, respondent_share_cents 0, honoraria_pool_cents 105000, fee_variant_applied PROVISIONAL, paid_cents 0 and a server-minted case_number."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9003 with domain compute.example; complainant Compute Ltd (country_code GB)."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Compute Registrar", iana_id: "IANA-9003", contact_email: "abuse@computereg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "compute.example", registrar_id: "${reg_id}", registrant_name_public: "Compute Holder", registrant_email_public: "compute@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Compute Ltd", country_code: "GB", email: "ip@compute.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
          trigger:
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id", case_no: "$.data.case_number", assessed: "$.data.assessed_fee_cents" }
            - call: "GET /udrp/complainants/${cpl_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { open_cases: "$.data.open_case_count" }
          assert:
            - "Case.${case_id}.status == FILED, version == 1, created_at == 2026-08-01T00:00:00Z"
            - "Case.${case_id}.panel_election == SINGLE and expedited_requested == false, the declared defaults for the omitted optional inputs"
            - "Case.${case_id}.required_seat_count == 1 and respondent_panel_election == NONE"
            - "Case.${case_id}.assessed_fee_cents == 150000, complainant_share_cents == 150000, respondent_share_cents == 0, honoraria_pool_cents == 105000"
            - "Case.${case_id}.fee_variant_applied == PROVISIONAL and deadline_variant_applied == PROVISIONAL"
            - "Case.${case_id}.paid_cents == 0, complainant_paid_cents == 0, respondent_paid_cents == 0, deficiency_round_count == 0"
            - "Case.${case_id}.case_number is a non-null server-minted string that the client never supplied"
            - "Complainant.${cpl_id}.open_case_count == 1"

      - name: domain_listing_is_paginated_and_filterable_with_a_correct_envelope
        claim_type: listing
        grounds:
          - endpoints.GET_/udrp/domains
          - entities.DomainName.fields.lock_status
        distinguishing_aspect: "With three domains on one registrar, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9004 with three UNLOCKED domains page1.example, page2.example and page3.example created in that order."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Paging Registrar", iana_id: "IANA-9004", contact_email: "abuse@pagingreg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "page1.example", registrar_id: "${reg_id}", registrant_name_public: "Page One", registrant_email_public: "p1@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_1_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "page2.example", registrar_id: "${reg_id}", registrant_name_public: "Page Two", registrant_email_public: "p2@proxy.example", registration_date: "2020-02-01T00:00:00Z", expiry_date: "2027-02-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_2_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "page3.example", registrar_id: "${reg_id}", registrant_name_public: "Page Three", registrant_email_public: "p3@proxy.example", registration_date: "2020-03-01T00:00:00Z", expiry_date: "2027-03-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_3_id: "$.data.id" }
            - call: "POST /udrp/domains/${dom_3_id}/lock"
              payload: { lock_status: "LOCKED" }
              as: ProviderAdmin
          trigger:
            - call: "GET /udrp/domains"
              payload: { registrar_id: "${reg_id}", limit: 2, offset: 0 }
              as: ProviderAdmin
              captures: { page_a_total: "$.meta.total_count", page_a_first: "$.data[0].domain_name" }
            - call: "GET /udrp/domains"
              payload: { registrar_id: "${reg_id}", limit: 2, offset: 2 }
              as: ProviderAdmin
              captures: { page_b_total: "$.meta.total_count", page_b_first: "$.data[0].domain_name" }
            - call: "GET /udrp/domains"
              payload: { lock_status: "LOCKED" }
              as: ProviderAdmin
              captures: { locked_total: "$.meta.total_count", locked_first: "$.data[0].domain_name" }
          assert:
            - "First page: meta.total_count == 3, meta.has_more == true, 2 rows returned, data[0].domain_name == 'page1.example' and data[1].domain_name == 'page2.example' in created_at ASC order"
            - "Second page: meta.total_count == 3, meta.has_more == false, 1 row returned, data[0].domain_name == 'page3.example'"
            - "The lock_status filter returns exactly 1 row: meta.total_count == 1 with data[0].domain_name == 'page3.example'"
            - "meta.limit == 2 and meta.offset == 2 are echoed on the second page"
            - "response_type == array on every one of the three reads"

      - name: unknown_case_id_read_returns_case_not_found
        claim_type: not_found
        grounds:
          - validations[priority=30].ERR_CASE_NOT_FOUND
          - endpoints.GET_/udrp/cases/{id}
        distinguishing_aspect: "GET /udrp/cases/{id} with an id no Case row carries returns ERR_CASE_NOT_FOUND with HTTP 404 and no data payload."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; the database holds no Case row at all."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
          trigger:
            - call: "GET /udrp/cases/00000000-0000-4000-8000-000000000901"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == 'ERR_CASE_NOT_FOUND'"
            - "response_type == error and data.message is a non-empty string"
            - "No Case row is created as a side effect of the failed read"

      - name: unknown_domain_panelist_appointment_and_decision_ids_are_not_found
        claim_type: not_found
        grounds:
          - validations[priority=31].ERR_DOMAIN_NOT_FOUND
          - validations[priority=32].ERR_PANELIST_NOT_FOUND
          - validations[priority=33].ERR_APPOINTMENT_NOT_FOUND
          - validations[priority=34].ERR_DECISION_NOT_FOUND
        distinguishing_aspect: "Each root-entity path emits its OWN 404 code - ERR_DOMAIN_NOT_FOUND, ERR_PANELIST_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND and ERR_DECISION_NOT_FOUND - rather than one generic not-found."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; the database holds no DomainName, Panelist, PanelistAppointment or Decision row."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
          trigger:
            - call: "GET /udrp/domains/00000000-0000-4000-8000-000000000902"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_dom: "$.data.error_id" }
            - call: "GET /udrp/panelists/00000000-0000-4000-8000-000000000903"
              payload: {}
              as: ProviderAdmin
              captures: { err_pan: "$.data.error_id" }
            - call: "GET /udrp/appointments/00000000-0000-4000-8000-000000000904"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_apt: "$.data.error_id" }
            - call: "GET /udrp/decisions/00000000-0000-4000-8000-000000000905"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_dec: "$.data.error_id" }
          assert:
            - "The domain read returns HTTP 404 with data.error_id == 'ERR_DOMAIN_NOT_FOUND'"
            - "The panelist read returns HTTP 404 with data.error_id == 'ERR_PANELIST_NOT_FOUND'"
            - "The appointment read returns HTTP 404 with data.error_id == 'ERR_APPOINTMENT_NOT_FOUND'"
            - "The decision read returns HTTP 404 with data.error_id == 'ERR_DECISION_NOT_FOUND'"
            - "All four responses carry response_type == error and no data.id"

      - name: case_creation_rejects_a_missing_required_input_field
        claim_type: required_fields
        grounds:
          - validations[priority=38].ERR_INVALID_REQUEST
          - endpoints.POST_/udrp/cases
        distinguishing_aspect: "POST /udrp/cases without remedy_requested returns ERR_INVALID_REQUEST with HTTP 400 and creates no Case row, while the identical body with remedy_requested present succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9005 with domain required.example; complainant Required SA (country_code GB)."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Required Registrar", iana_id: "IANA-9005", contact_email: "abuse@requiredreg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "required.example", registrar_id: "${reg_id}", registrant_name_public: "Required Holder", registrant_email_public: "required@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Required SA", country_code: "GB", email: "ip@required.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
          trigger:
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /udrp/cases"
              payload: { complainant_id: "${cpl_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_total: "$.meta.total_count" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
          assert:
            - "The body without remedy_requested returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /udrp/cases?complainant_id=${cpl_id} then returns meta.total_count == 0 - the rejected request wrote nothing"
            - "Complainant.${cpl_id}.open_case_count == 0 after the rejection"
            - "The retry with remedy_requested TRANSFER succeeds with HTTP 201: Case.${case_id}.status == FILED"

      - name: two_letter_code_and_enum_and_amount_constraints_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.Complainant.fields.country_code
          - entities.FeeTransaction.fields.amount_cents
          - entities.Case.fields.remedy_requested
          - validations[priority=38].ERR_INVALID_REQUEST
        distinguishing_aspect: "country_code 'fra' (three lowercase letters), remedy_requested 'DELETE' (undeclared enum member) and amount_cents 0 (the one excluded integer) each return ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9006 with domain types.example; complainant Types Ltd (country_code GB) and one FILED case on that domain."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Types Registrar", iana_id: "IANA-9006", contact_email: "abuse@typesreg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "types.example", registrar_id: "${reg_id}", registrant_name_public: "Types Holder", registrant_email_public: "types@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Types Ltd", country_code: "GB", email: "ip@types.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Lowercase Ltd", country_code: "fra", email: "ip@lowercase.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_code: "$.data.error_id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "DELETE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 0, reference: "ZERO" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_amount: "$.data.error_id" }
            - call: "GET /udrp/cases/${case_id}/fee-transactions"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ledger_total: "$.meta.total_count" }
          assert:
            - "country_code 'fra' returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' - the constraint is exactly 2 uppercase letters"
            - "remedy_requested 'DELETE' returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' - the enum admits only TRANSFER and CANCELLATION"
            - "amount_cents 0 returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' - the declared range excludes 0 while admitting negatives"
            - "GET /udrp/cases/${case_id}/fee-transactions returns meta.total_count == 0 and Case.${case_id}.paid_cents == 0"

      - name: ground_sufficiency_status_is_computed_from_evidence_count_and_never_supplied
        claim_type: computed_fields
        grounds:
          - calculations.ground_sufficiency_evaluation
          - entities.ComplaintGround.fields.sufficiency_status
          - entities.ComplaintGround.fields.evidence_count
        distinguishing_aspect: "evidence_count 0 writes sufficiency_status DEFICIENT and evidence_count 1 writes SUFFICIENT, because MIN_EVIDENCE_PER_GROUND is 1 and the comparison is >=."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9007 with domain suff.example; complainant Suff Ltd (country_code GB) and one FILED case."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Suff Registrar", iana_id: "IANA-9007", contact_email: "abuse@suffreg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "suff.example", registrar_id: "${reg_id}", registrant_name_public: "Suff Holder", registrant_email_public: "suff@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Suff Ltd", country_code: "GB", email: "ip@suff.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "SUFF is a registered mark with no exhibits attached yet.", evidence_count: 0, similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { g_zero_id: "$.data.id", g_zero_status: "$.data.sufficiency_status" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The registrant offered the name for sale, exhibit attached.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { g_one_id: "$.data.id", g_one_status: "$.data.sufficiency_status" }
          assert:
            - "ComplaintGround.${g_zero_id}.sufficiency_status == DEFICIENT for evidence_count 0"
            - "ComplaintGround.${g_one_id}.sufficiency_status == SUFFICIENT for evidence_count 1, the inclusive threshold"
            - "ComplaintGround.${g_one_id}.similarity_claim is null and cited_decision_ids == [], the declared defaults"
            - "GET /udrp/cases/${case_id}/grounds returns meta.total_count == 2 in created_at ASC order"

      - name: fee_transaction_and_panel_vote_rows_are_immutable_and_carry_no_version
        claim_type: immutability
        grounds:
          - entities.FeeTransaction
          - entities.PanelVote
          - endpoints.GET_/udrp/cases/{id}/fee-transactions
        distinguishing_aspect: "FeeTransaction is declared common_fields false, so §1.5 exposes no update or delete endpoint for it and the row carries no version field; a correcting entry is a NEW negative row, and the original amount_cents is unchanged."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9008 with domain immut.example; complainant Immut Ltd (country_code GB) and one FILED case carrying a 150000 FILING_FEE row."
