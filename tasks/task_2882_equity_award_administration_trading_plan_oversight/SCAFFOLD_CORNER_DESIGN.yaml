  # ===========================================================================
  - section: rbac
    instances:

      - name: auditor_cannot_perform_any_write_operation
        claim_type: exclusive_operations
        grounds:
          - roles.Auditor
          - validations[priority=10]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints[GET /equity-plans/{id}/burn-rate-summary]
        distinguishing_aspect: |
          Auditor appears in the roles list of every read endpoint and of none of the writes:
          the same identity that reads the plan and the burn-rate summary successfully is
          refused with ERR_ROLE_NOT_PERMITTED (403) on POST /equity-plans, POST /grants and
          POST /trading-windows.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; one ACTIVE plan and one ACTIVE participant created by admin-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
