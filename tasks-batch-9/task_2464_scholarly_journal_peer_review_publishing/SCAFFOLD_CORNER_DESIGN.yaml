      - name: integrity_block_bars_the_advance
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_INTEGRITY_BLOCK]
        excluded_because:
          difficulty_instance: validation_priority_conflict / integrity_block_outranks_formatting_non_compliance
          rationale: "That §1.8 instance already stages a BLOCK screening on a manuscript that is also formatting-non-compliant and pins ERR_INTEGRITY_BLOCK as the reported error."

      - name: high_severity_ethics_case_freezes_the_decision
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_ETHICS_HOLD]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / decision_blocked_by_open_high_severity_ethics_case
          rationale: "The ERR_ETHICS_HOLD trigger and its release after resolution are the entire subject of that §1.8 instance."

      - name: issued_invoice_blocks_publication
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_UNPAID_APC_INVOICE]
        excluded_because:
          difficulty_instance: conserved_quantity / publication_blocked_by_second_issued_invoice_then_allowed_after_waiver
          rationale: "That §1.8 instance already blocks publication on a second ISSUED invoice and then completes it after the waiver, covering both sides of ERR_UNPAID_APC_INVOICE."

