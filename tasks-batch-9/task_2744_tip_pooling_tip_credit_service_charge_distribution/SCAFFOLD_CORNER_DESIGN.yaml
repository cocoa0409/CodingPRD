          assert:
            - "GET /locations/${loc_id} reports applicable_min_wage_cents == 1650 and max_tip_credit_per_hour_cents == 0: the state wage beats the 725 federal constant and no credit is available"
            - "the first trigger call returns HTTP 201 with contributing_shift_count == 1, participant_count == 2, total_contributed_cents == 15000, service_charge_tips_cents == 8000, cc_fee_deducted_cents == 0, net_pool_cents == 23000, total_share_weight == 14"
            - "total_contributed_cents is 15000 == round_half_up(0.15 * gross_sales 100000), not 3000 == 15% of the 20000 declared tips: contribution_basis GROSS_SALES_PCT selects the other basis"
            - "cc_fee_deducted_cents is 0, not the 360 == round_half_up(0.03 * 12000 charged tips) the shift's own bps would imply: PROHIBITED and cc_fee_pass_through false each independently zero the deduction"
            - "GET /service-charges/${charge_id} reports treatment == TIPS, status == ALLOCATED, allocated_pool_id == ${pool_id}, allocated_pay_period_id == null"
            - "after the second trigger call GET /pool-allocations?shift_tip_pool_id=${pool_id} reports total_count == 2: Dee with share_weight 10, allocated_cents 16429, remainder_cent_awarded true, and Eli with share_weight 4, allocated_cents 6571, remainder_cent_awarded false"
