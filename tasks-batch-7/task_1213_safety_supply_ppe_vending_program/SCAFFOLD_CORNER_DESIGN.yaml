        claim_type: side_effect_execution
        grounds: [state_machines.Employee.ACTIVE_to_TERMINATED, state_machines.ManagerOverride.ACTIVE_to_REVOKED]
        distinguishing_aspect: "Terminating an employee cascade-revokes their ACTIVE override (cross-entity cascade down), leaving consumed_qty untouched."
