            - { call: "GET /api/advertiser-accounts/${adv}", payload: {}, as: FinanceAnalyst, captures: { exposure: $.data.exposure_cents } }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { cv3: $.data.version } }
            - { call: "POST /api/flights/${flC}/confirm", payload: { expected_campaign_version: "${cv3}" }, as: SalesPlanner, captures: { err: $.data.error_id } }
          assert:
            - "Confirm B succeeds: exposure 1150000 + 800000 == 1950000 == credit_limit (equality allowed), Flight.${flB}.status == BOOKED"
            - "AdvertiserAccount.${adv}.exposure_cents == 1950000"
            - "Confirm C rejected: error_id == ERR_CREDIT_LIMIT_EXCEEDED (1950000 + 800000 = 2750000 > 1950000)"
      - name: loop_slot_equality_boundary_on_create
        grounds:
          - calculations.loop_slot_capacity
          - validations[priority=11]
        distinguishing_aspect: |
          Metric = integer loop-slot count (different metric from money); endpoint =
          POST /api/flights (different endpoint from confirm). Filling the loop to
          EXACTLY slots_total succeeds; one slot over is rejected.
        test_recipe:
          setup:
            - "PUBLISHED digital card (base 400000, ill 0.15, t1 100000/0.10, t2 250000/0.25); DIGITAL face FD (illuminated, 300000, loop_slots_total 8) with permit to 2026-12-31"
            - "Advertiser, campaign 2026-08-01..2026-10-31 in DRAFT; flight D1 HELD 2026-08-10..2026-09-06 with loop_slots 4"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "DIGITAL", base_weekly_cents: 400000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-DIGI-1", structure_code: "ST-D1", market_code: "NYC", display_type: "DIGITAL", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576, loop_slots_total: 8 }, as: InventoryManager, captures: { fd: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${fd}", permit_number: "P-D1", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${fd}", payload: {}, as: SalesPlanner, captures: { fd_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-10-31" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fd}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", loop_slots: 4, expected_face_version: "${fd_v}" }, as: SalesPlanner, captures: { d1: $.data.id, d1_weekly: $.data.pinned_weekly_cents } }
          trigger:
            - { call: "GET /api/faces/${fd}", payload: {}, as: SalesPlanner, captures: { fd_v2: $.data.version } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fd}", rate_card_id: "${rc}", start_date: "2026-08-17", end_date: "2026-09-13", loop_slots: 4, expected_face_version: "${fd_v2}" }, as: SalesPlanner, captures: { d2: $.data.id, d2_status: $.data.status } }
            - { call: "GET /api/faces/${fd}", payload: {}, as: SalesPlanner, captures: { fd_v3: $.data.version } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fd}", rate_card_id: "${rc}", start_date: "2026-08-24", end_date: "2026-09-20", loop_slots: 1, expected_face_version: "${fd_v3}" }, as: SalesPlanner, captures: { err: $.data.error_id } }
          assert:
            - "D1 pinned_weekly_cents == 143750 (round_half_up(575000 x 4/8))"
            - "D2 created: 4 + 4 == 8 == loop_slots_total (equality allowed), status == HELD"
            - "D3 rejected: error_id == ERR_LOOP_CAPACITY_EXCEEDED (4 + 4 + 1 = 9 > 8)"

  # =================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: flight_creation_gated_by_face_posture
        grounds:
          - state_machines.Face.AVAILABLE_to_UNDER_MAINTENANCE
          - validations[priority=7]
          - entities.Face.fields.booking_posture
        distinguishing_aspect: |
          Entity pair = Flight <- Face. POST /api/flights is rejected while the face is
          UNDER_MAINTENANCE (posture RESTRICTED) and succeeds once the work order
          completes and the face returns to AVAILABLE (posture OPEN) — the flight's
          creatability is fully derived from the other entity's state.
        test_recipe:
          setup:
            - "PUBLISHED static card; static face F1 (illuminated, 300000) with permit to 2026-12-31; advertiser (limit 90000000); campaign C1 2026-08-01..2026-09-30 DRAFT"
            - "MaintenanceWorkOrder on F1 SCHEDULED for 2026-08-05T06:00:00Z..2026-08-05T18:00:00Z then IN_PROGRESS (face cascades to UNDER_MAINTENANCE)"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/maintenance-work-orders", payload: { face_id: "${f1}", order_type: "STRUCTURAL_REPAIR", description: "panel refit" }, as: ComplianceOfficer, captures: { wo: $.data.id } }
            - { call: "PUT /api/maintenance-work-orders/${wo}", payload: { status: "SCHEDULED", scheduled_start: "2026-08-05T06:00:00Z", scheduled_end: "2026-08-05T18:00:00Z" }, as: ComplianceOfficer }
            - { call: "PUT /api/maintenance-work-orders/${wo}", payload: { status: "IN_PROGRESS" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version, posture_blocked: $.data.booking_posture } }
          trigger:
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { err: $.data.error_id } }
            - { call: "PUT /api/maintenance-work-orders/${wo}", payload: { status: "COMPLETED" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v2: $.data.version, posture_open: $.data.booking_posture } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v2}" }, as: SalesPlanner, captures: { fl: $.data.id, fl_status: $.data.status } }
          assert:
            - "While work order IN_PROGRESS: Face.booking_posture == RESTRICTED and create fails with error_id == ERR_FACE_NOT_BOOKABLE"
            - "After COMPLETED (no sibling IN_PROGRESS): Face.status == AVAILABLE, booking_posture == OPEN"
            - "Second create succeeds: Flight.${fl}.status == HELD"
      - name: campaign_settle_gated_by_makegood_resolution
        grounds:
          - state_machines.Campaign.INVOICED_to_SETTLED
          - state_machines.Flight.MISSED_to_LIVE
          - calculations.make_good_credit
        distinguishing_aspect: |
          Entity pair = Campaign <- MakeGood (different pair from Flight<-Face).
          billing_status INVOICED -> SETTLED is rejected while any MakeGood of any flight
          of the campaign is PROPOSED, and passes once the make-good is APPROVED ->
