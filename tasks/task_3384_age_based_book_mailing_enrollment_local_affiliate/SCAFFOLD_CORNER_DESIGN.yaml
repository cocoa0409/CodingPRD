            - call: "GET /library/affiliates/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { e_aff: $.data.error_id }
            - call: "POST /library/affiliates"
              payload: { name: "Ghost Affiliate", state_program_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", postal_prefixes: ["372"], contact_email: "g@g.org" }
              as: PlatformAdmin
              captures: { e_sp_body: $.data.error_id }
          assert:
            - "e_title == ERR_TITLE_NOT_FOUND (404)"
            - "e_po == ERR_PRINT_ORDER_NOT_FOUND (404)"
            - "e_wave == ERR_WAVE_NOT_FOUND (404)"
            - "e_item == ERR_ITEM_NOT_FOUND (404)"
            - "e_inv == ERR_INVOICE_NOT_FOUND (404)"
            - "e_ac == ERR_ADDRESS_CHANGE_NOT_FOUND (404)"
            - "e_aff == ERR_AFFILIATE_NOT_FOUND (404)"
            - "e_sp_body == ERR_STATE_PROGRAM_NOT_FOUND (body FK existence, 404)"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request without X-User-Role / X-User-ID fails 401 ERR_UNAUTHENTICATED before role, existence, or shape checks."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
