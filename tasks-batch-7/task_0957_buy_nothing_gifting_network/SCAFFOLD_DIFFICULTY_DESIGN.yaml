              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /v1/pickup-plans"
              payload: { claim_id: "${c1}", window_start: "2026-05-11T10:00:00Z", window_end: "2026-05-11T11:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { pp1: $.data.id }
            - call: "POST /v1/pickup-plans/${pp1}/confirm"
              as: Member
