            - "PatientRecord.${rec_s8b_id}.identity_state == MERGED_SUBSUMED and clinical_element_count == 0"
            - "PatientRecord.${rec_s8a_id}.clinical_element_count == 10 and subsumed_member_count == 1"
            - "DuplicateCandidatePair.${pair_s8_id}.queue_state == RESOLVED_MERGED"
            - "PropagationTask.${task_s8_id}.state == SENT (the rejected unmerge cancelled nothing)"

      - name: send_a_task_on_a_paused_downstream_system_is_rejected_then_allowed
        claim_type: guarded_transitions
        grounds:
          - state_machines.PropagationTask.QUEUED_to_SENT
          - validations[priority=32]
          - state_machines.DownstreamSystem
        distinguishing_aspect: "The QUEUED -> SENT transition is guarded by a different entity's state: with DownstreamSystem.status PAUSED the send returns 409 ERR_DOWNSTREAM_SYSTEM_PAUSED, and the byte-identical send succeeds the moment the system is patched back to ACTIVE."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-S9."
            - "One DownstreamSystem PS-SYS created ACTIVE with propagation_mode BATCH, ack_required true and max_concurrent_dispatch 2."
            - "One PatientRecord S9-1000 whose OverlayCorrection (affected_clinical_element_count 2) has been applied, leaving one QUEUED PropagationTask with propagation_deadline_at 2026-08-04T00:00:00Z."
            - "PS-SYS is then patched to status PAUSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-S9", name: "Guarded Transition Clinic", region_code: "US-AR", registrar_headcount: 1 }
              as: MpiAdmin
              captures: { site_s9_id: $.data.id }
            - call: "POST /mpi/downstream-systems"
              payload: { system_code: "PS-SYS", name: "Pausable System", propagation_mode: "BATCH", ack_required: true, max_concurrent_dispatch: 2 }
              as: MpiAdmin
              captures: { sys_s9_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s9_id}", mrn: "S9-1000", last_name: "Ferreira", first_name: "Tiago", dob: "1989-09-19", sex: "M", ssn_last4: "1717", postal_code: "72201", phone: "5015550101", clinical_element_count: 5 }
              as: IdentityAnalyst
              captures: { rec_s9_id: $.data.id, rec_s9_v0: $.data.version }
            - call: "POST /mpi/overlay-corrections"
              payload: { record_id: "${rec_s9_id}", overlay_type: "DEMOGRAPHIC_OVERWRITE", corrected_field_snapshot: { phone: "5015550199" }, affected_clinical_element_count: 2, encounter_from_date: "2026-07-11", encounter_to_date: "2026-07-12", expected_record_version: "${rec_s9_v0}" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { ov_s9_id: $.data.id }
            - call: "POST /mpi/overlay-corrections/${ov_s9_id}/apply"
              payload: {}
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "GET /mpi/propagation-tasks"
              payload: { overlay_correction_id: "${ov_s9_id}" }
              as: MpiAdmin
              captures: { task_s9_id: "$.data[0].id" }
            - call: "PATCH /mpi/downstream-systems/${sys_s9_id}"
              payload: { status: "PAUSED" }
              as: MpiAdmin
              captures: { sys_s9_status: $.data.status }
          trigger:
            - call: "POST /mpi/propagation-tasks/${task_s9_id}/send"
              payload: { dispatch_window_start_at: "2026-08-02T13:00:00Z", dispatch_window_end_at: "2026-08-02T14:00:00Z" }
              as: MpiAdmin
            - call: "PATCH /mpi/downstream-systems/${sys_s9_id}"
              payload: { status: "ACTIVE" }
              as: MpiAdmin
            - call: "POST /mpi/propagation-tasks/${task_s9_id}/send"
              payload: { dispatch_window_start_at: "2026-08-02T13:00:00Z", dispatch_window_end_at: "2026-08-02T14:00:00Z" }
              as: MpiAdmin
          assert:
            - "${sys_s9_status} == \"PAUSED\""
            - "First trigger call: HTTP 409 with $.data.error_id == \"ERR_DOWNSTREAM_SYSTEM_PAUSED\""
            - "After the first trigger call: PropagationTask.${task_s9_id}.state == QUEUED and attempt_count == 0 and version == 1"
            - "Third trigger call: HTTP 200 with $.data.state == SENT and $.data.attempt_count == 1 and $.data.dispatch_window_start_at == \"2026-08-02T13:00:00Z\" and $.data.dispatch_window_end_at == \"2026-08-02T14:00:00Z\""
            - "DownstreamSystem.${sys_s9_id}.status == ACTIVE and unacked_task_count == 1"

      - name: pair_queue_cycles_back_through_under_review
        claim_type: cyclic
        grounds:
          - state_machines.DuplicateCandidatePair.RECOMMENDED_MERGE_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: pair_queue_recommend_return_recommend_cycle
          rationale: "The cyclic-shape claim (UNDER_REVIEW -> RECOMMENDED_MERGE -> UNDER_REVIEW -> RECOMMENDED_MERGE with monotonic version) is the whole subject of that §1.8 instance."

      - name: propagation_task_retry_cycle_reuses_the_sent_state
        claim_type: cyclic
        grounds:
          - state_machines.PropagationTask.SENT_to_FAILED
          - state_machines.PropagationTask.FAILED_to_SENT
        excluded_because:
          difficulty_instance: propagation_task_sent_failed_sent_retry_cycle
          rationale: "That §1.8 instance walks QUEUED -> SENT -> FAILED -> SENT and asserts attempt_count, last_error_code retention and version."

      - name: merge_side_effects_are_fully_compensated_by_unmerge
        claim_type: compensation
        grounds:
          - state_machines.PatientRecord.MERGED_SUBSUMED_to_ACTIVE
        excluded_because:
          difficulty_instance: unmerge_restores_cluster_elements_and_enterprise_ids
          rationale: "The compensation side-effect pattern (undo transition reverses every original side effect with no drift) is asserted field by field there."

      - name: merge_state_bubbles_up_from_its_propagation_task
        claim_type: bubble_up
        grounds:
          - state_machines.MergeOperation.PENDING_PROPAGATION_to_COMPLETED
        excluded_because:
          difficulty_instance: merge_completes_only_after_ack_required_task_is_acked
          rationale: "That §1.8 instance asserts the merge stays PENDING_PROPAGATION through QUEUED and SENT and only completes when the child task reaches ACKED."

      - name: unmerge_closes_remediation_only_when_one_was_opened
        claim_type: conditional_cascade
        grounds:
          - state_machines.ContaminationRemediation.OPEN_to_CLOSED
        excluded_because:
          difficulty_instance: unmerge_closes_merge_remediation_and_cancels_queued_task
          rationale: "The conditional cascade (remediation closed only because the merge moved more than 25 elements, plus task cancellation) is asserted there."

  - section: calculations
    instances:

      - name: prefix_agreement_awards_exactly_half_the_attribute_weight
        claim_type: correct_result
        grounds:
          - calculations.pair_match_score
          - global_constants.PARTIAL_AGREEMENT_FRACTION
          - global_constants.PREFIX_COMPARE_CHARS
        distinguishing_aspect: "Two attributes that agree only on their first PREFIX_COMPARE_CHARS characters each contribute exactly half their weight (12.50 of 25.00 and 5.00 of 10.00), while phone - which has no partial-credit rule - contributes 0.00 despite sharing a long prefix."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-C1 and one MatchRuleSet RS-BASE (weights last_name 25.00, first_name 15.00, dob 25.00, ssn_last4 15.00, sex 5.00, postal_code 10.00, phone 5.00)."
            - "Two PatientRecord rows: last_name Brannigan vs Brandeis (both start 'Bra'), postal_code 68102 vs 68155 (both start '681'), phone 4025550101 vs 4025550202 (share 7 characters), everything else identical."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-C1", name: "Prefix Agreement Clinic", region_code: "US-NE", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_c1_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_c1_id}", mrn: "C1-1000", last_name: "Brannigan", first_name: "Colette", dob: "1983-05-14", sex: "F", ssn_last4: "7788", postal_code: "68102", phone: "4025550101", clinical_element_count: 3 }
              as: IdentityAnalyst
              captures: { rec_c1a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_c1_id}", mrn: "C1-2000", last_name: "Brandeis", first_name: "Colette", dob: "1983-05-14", sex: "F", ssn_last4: "7788", postal_code: "68155", phone: "4025550202", clinical_element_count: 2 }
              as: IdentityAnalyst
              captures: { rec_c1b_id: $.data.id }
          trigger:
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_c1a_id}", record_b_id: "${rec_c1b_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 201"
            - "$.data.attribute_score_breakdown == {\"last_name\": 12.50, \"first_name\": 15.00, \"dob\": 25.00, \"ssn_last4\": 15.00, \"sex\": 5.00, \"postal_code\": 5.00, \"phone\": 0.00}"
            - "$.data.raw_score == 77.50 and $.data.match_score == 77.50 (12.50 + 15.00 + 25.00 + 15.00 + 5.00 + 5.00 + 0.00)"
            - "$.data.conflict_flags == [] (ssn_last4 agrees, and biometric_template_hash and insurance_member_id are null on both sides)"
            - "$.data.classification == POTENTIAL_DUPLICATE and $.data.queue_state == NEW"
            - "$.data.base_band == P2 and $.data.effective_score == 77.50 and $.data.priority_band == P2"
            - "$.data.subject_record_mrn == \"C1-2000\" (identical created_at, so the lexicographically greater mrn is the subject)"

      - name: dob_day_month_transposition_scores_half_agreement
        claim_type: correct_result
        grounds:
          - calculations.pair_match_score
          - global_constants.PARTIAL_AGREEMENT_FRACTION
        distinguishing_aspect: "A 1985-03-07 vs 1985-07-03 day/month transposition earns 12.50 rather than 25.00, which is exactly what keeps the pair at 82.50 POTENTIAL_DUPLICATE instead of the 95.00 AUTO_LINK an identical dob would have produced."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-C2 and one MatchRuleSet RS-BASE."
            - "Two PatientRecord rows identical on last_name, first_name, ssn_last4, sex and postal_code, both leaving phone null, whose dob values are 1985-03-07 and 1985-07-03 (same year, month and day swapped, and 03 != 07 so the transposition rule applies)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
