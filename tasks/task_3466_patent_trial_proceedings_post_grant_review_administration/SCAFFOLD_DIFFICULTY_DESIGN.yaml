          assert:
            - "after motion 1 is FILED, amendment_slots_available == 0 and the second motion is rejected 422 with error_id == ERR_AMENDMENT_QUOTA_EXCEEDED"
            - "WITHDRAWN returns the slot: the rejected second filing becomes possible and motion 3 is created 201"
            - "after motion 3, amendment_slots_available == 0 and the invariant holds at every step: slots_available + count(cycle-0 motions in {FILED, GRANTED, DENIED}) == 1 (motion 1 WITHDRAWN is excluded from the count)"
            - "AmendmentMotion.${mtn19a_id}.status == WITHDRAWN and AmendmentMotion.${mtn19c_id}.status == FILED"
