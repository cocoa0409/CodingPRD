  - section: state_machines
    instances:

      - name: corner_investigation_starts_open_on_creation
        claim_type: Initial State
        grounds:
          - state_machines.Investigation.initial_state
          - endpoints[POST /licensing/investigations]
          - entities.Investigation.fields.assigned_investigator_user_id
        distinguishing_aspect: "A sting case opened with origin STING and no complaint lands in the declared initial_state OPEN with closed_on and finding_severity null, and assigned_investigator_user_id stamped from the caller's X-User-ID rather than from the body."
        test_recipe:
          setup:
            - "clock at 2026-08-01, empty Investigation table"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /licensing/investigations"
              payload: { origin: "STING", subject_business_name: "Unlicensed Bob Remodeling" }
              as: Investigator
              as_user_id: "inv-sting-1"
              captures: { inv_id: $.data.id, inv_status: $.data.status }
          assert:
            - "response http status == 201"
            - "${inv_status} == OPEN"
            - "Investigation.${inv_id}.origin == STING"
            - "Investigation.${inv_id}.complaint_id == null"
            - "Investigation.${inv_id}.assigned_investigator_user_id == inv-sting-1"
            - "Investigation.${inv_id}.finding_severity == null"
            - "Investigation.${inv_id}.closed_on == null"

      - name: corner_withdrawing_a_draft_application_reaches_the_terminal_state
        claim_type: Valid Transition
        grounds:
          - state_machines.LicenseApplication.DRAFT_to_WITHDRAWN
          - endpoints[POST /licensing/license-applications/{id}/withdraw]
        distinguishing_aspect: "DRAFT -> WITHDRAWN is a declared transition with no cross-entity effect: the row reads WITHDRAWN and no License is ever minted for that application."
        test_recipe:
          setup:
            - "clock at 2026-08-01, a C-10 classification, a licensee, an exam-qualified qualifier and one DRAFT application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Withdraw Electric LLC", entity_type: "LLC", contact_email: "wd@x.test" }
              as: LicensingAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Will Withdraw", verified_experience_months: 60 }
              as: LicensingAnalyst
              captures: { qi_id: $.data.id }
