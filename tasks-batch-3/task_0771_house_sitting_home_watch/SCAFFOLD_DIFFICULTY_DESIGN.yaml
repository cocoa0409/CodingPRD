  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_assign_unassign_cycle
        grounds:
          - state_machines.Booking.PENDING_ASSIGNMENT_to_SCHEDULED
          - state_machines.Booking.SCHEDULED_to_PENDING_ASSIGNMENT
          - entities.Booking.fields.sitter_id
        distinguishing_aspect: "Booking exhibits a cycle SCHEDULED→PENDING_ASSIGNMENT→SCHEDULED: unassign clears sitter_id and returns to the pool, and a re-assign moves it back to SCHEDULED — not a linear pipeline."
        test_recipe:
          setup:
            - "Sitter CLEARED + BOND; MEDIUM property; VACATION booking 2026-06-01 assigned (SCHEDULED, one visit, DRAFT invoice)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "MEDIUM", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/background-checks"
              payload: { sitter_id: "${st_id}", provider_ref: "PRV-1", expires_at: "2027-01-01T00:00:00Z" }
