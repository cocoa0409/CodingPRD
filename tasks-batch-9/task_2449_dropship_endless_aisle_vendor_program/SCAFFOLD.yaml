scenario: |
  Generate task harder than expert level!

  2449. Dropship & Endless Aisle Vendor Program (retail dropship operations): vendor onboarding with
  integration testing on catalog, inventory and order messages, item setup with lead time, shipping
  method and geographic serviceability by vendor, inventory availability refresh cadence with oversell
  protection and safety buffers, order transmission, acknowledgment and shipment confirmation with
  service level requirements, customer-facing delivery promise calculation from vendor performance
  history, returns routing to the vendor or retailer with restocking and reverse freight ownership,
  vendor scorecard on ship time, cancellation rate and defect rate, cost and margin structure with
  commission versus wholesale models

domain_name: "dropship-endless-aisle-vendor-program"
api_prefix: "/dropship"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: graph
  # DropshipItem is self-referential (fallback_item_id) forming an endless-aisle substitution chain;
  # ServiceabilityRule is a Vendor x zone x ship_method junction; DropshipOrderLine joins
  # DropshipOrder x DropshipItem; ReturnAuthorization joins DropshipOrderLine x Vendor. No strict
  # ownership tree exists: items, rules, blackouts, snapshots and scorecards are peers hanging off
  # Vendor, and orders reach vendors only transitively through items.

  state_machine_shape: parallel
  # DropshipOrder carries two independent axes on one row (fulfillment_status x financial_status),
  # DropshipOrderLine is cyclic (TRANSMITTED -> BACKORDERED -> TRANSMITTED via retransmit),
  # Vendor is cyclic (INTEGRATION_TESTING self-loop per round; ACTIVE <-> SUSPENDED),
  # DropshipItem is cyclic (ACTIVE <-> SUPPRESSED),
  # ReturnAuthorization is branching (AUTHORIZED forks on routing_destination with divergent
  # side-effect sets, and REJECTED is reachable from two different from-states).

  relationship_patterns:
    - one_to_many          # Vendor -> DropshipItem / ServiceabilityRule / VendorBlackout / VendorScorecard
    - many_to_many         # DropshipOrder <-> DropshipItem through DropshipOrderLine
    - self_referential     # DropshipItem.fallback_item_id -> DropshipItem.id
    - cross_aggregate      # ReturnAuthorization.routed_vendor_id reaches across the order aggregate

  role_model: segregation_of_duties
  # The opaque operator id that certified a vendor's integration round MUST NOT be the id that
  # activates the vendor for live traffic (Vendor.certified_by_user_id != X-User-ID on activate).

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 11 entities / 44 endpoints / 39 validations / 39 error codes / 11 calculations (3 with variants) /
  # 6 state machines (2 cyclic, 1 parallel-dimension, 1 branching, 1 compound-derived) /
  # 2 OCC races. Density target: every calculation reads at least two entities, and every
  # cascade crosses at least two aggregate boundaries.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: vendor_code
        type: string
        source: input
        description: "Trading-partner code used on catalog/inventory/order EDI messages."
        constraints: "1..32 chars, uppercase alnum and hyphen; globally unique (ERR_DUPLICATE_VENDOR_CODE)"
      - name: legal_name
        type: string
        source: input
        description: "Vendor legal entity name."
        constraints: "1..200 chars"
      - name: cost_model
        type: enum
        source: input
        description: "Which cost-and-margin structure applies to every line sourced from this vendor."
        constraints: "one of {COMMISSION, WHOLESALE}"
      - name: commission_rate_bps
        type: integer
        source: input
        description: "Basis points of retail the retailer retains under the COMMISSION model."
        default: null
        constraints: "required and 0..5000 when cost_model==COMMISSION; MUST be omitted or null when cost_model==WHOLESALE (ERR_COST_MODEL_FIELD_MISMATCH)"
      - name: wholesale_discount_bps
        type: integer
        source: input
        description: "Basis points off the item's wholesale list price the retailer receives under the WHOLESALE model."
        default: null
        constraints: "required and 0..5000 when cost_model==WHOLESALE; MUST be omitted or null when cost_model==COMMISSION (ERR_COST_MODEL_FIELD_MISMATCH)"
      - name: inventory_refresh_cadence_minutes
        type: integer
        source: input
        description: "Contracted maximum gap between inventory feed messages from this vendor."
        constraints: "1..1440"
      - name: safety_buffer_units
        type: integer
        source: input
        description: "Units held back from every item's availability as oversell protection."
        default: 0
        constraints: ">= 0"
      - name: oversell_grace_units
        type: integer
        source: input
        description: "Units of deliberate oversell the vendor accepts above buffered on-hand."
        default: 0
        constraints: ">= 0"
      - name: default_lead_time_days
        type: integer
        source: input
        description: "Fallback fulfillment lead time applied to items that omit lead_time_days."
        constraints: "0..60"
      - name: ack_sla_hours
        type: integer
        source: input
        description: "Hours after transmission within which the vendor must acknowledge a line."
        default: 24
        constraints: "1..168"
      - name: ship_sla_grace_hours
        type: integer
        source: input
        description: "Grace hours added on top of item lead time to form the ship-confirm deadline."
        default: 12
        constraints: "0..168"
      - name: onboarding_status
        type: enum
        source: system
        description: "Vendor onboarding lifecycle state; see §1.2 Vendor state machine."
        default: DRAFT
        constraints: "one of {DRAFT, INTEGRATION_TESTING, CERTIFIED, ACTIVE, SUSPENDED}"
      - name: integration_round
        type: integer
        source: system
        description: "Current integration-testing round; incremented by every begin-integration call."
        default: 0
        constraints: ">= 0"
      - name: certified_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the VendorOpsAnalyst that certified the current round; null before certification."
        default: null
      - name: activated_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the MerchandiseManager that activated the vendor; null before activation."
        default: null
      - name: suspension_reason
        type: enum
        source: system
        description: "Why the vendor is SUSPENDED; cleared to null on reinstate."
        default: null
        constraints: "one of {SCORECARD_PROBATION, MANUAL_OPS} or null"
      - name: performance_tier
        type: enum
        source: computed
        description: "Tier copied from the latest PUBLISHED VendorScorecard; see calculations.vendor_scorecard_metrics."
        default: UNRATED
        constraints: "one of {UNRATED, PLATINUM, GOLD, SILVER, WATCH, PROBATION}"
      - name: promise_padding_days
        type: integer
        source: computed
        description: "Calendar days of padding the QUOTED delivery promise adds for this vendor; derived from performance_tier."
        default: 2
        constraints: "0..5"
      - name: settlement_balance_cents
        type: integer
        source: computed
        description: "Cents owed to the vendor for shipped units and surcharges; see calculations.vendor_settlement_ledger."
        default: 0
      - name: chargeback_balance_cents
        type: integer
        source: computed
        description: "Cents charged back to the vendor for authorized returns it owns; see calculations.vendor_settlement_ledger."
        default: 0

  - name: IntegrationTest
    parent: Vendor
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor whose message integration is under test. Taken from the path."
      - name: message_type
        type: enum
        source: input
        description: "Which trading-partner message family this run exercises."
        constraints: "one of {CATALOG, INVENTORY, ORDER, SHIP_CONFIRM}"
      - name: round_number
        type: integer
        source: system
        description: "Copied from Vendor.integration_round at creation time; freezes the run to a round."
        constraints: ">= 1"
      - name: sample_payload_digest
        type: string
        source: input
        description: "Hex digest of the sample message the vendor submitted for this run."
        constraints: "8..64 hex chars"
      - name: reported_error_count
        type: integer
        source: input
        description: "Vendor-self-reported parse errors in the sample payload; advisory only, does not decide status."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Run lifecycle; only a VendorOpsAnalyst evaluation moves it off PENDING."
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED}"
      - name: evaluated_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the analyst that evaluated this run; null while PENDING."
        default: null
      - name: defect_notes
        type: string
        source: input
        description: "Analyst free-text notes captured on evaluation; null while PENDING."
        default: null
        constraints: "0..500 chars"
      - name: evaluated_at
        type: datetime
        source: system
        description: "Logical-clock instant the run was evaluated; null while PENDING."
        default: null

  - name: DropshipItem
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the dropship vendor that owns this offer."
      - name: fallback_item_id
        type: string
        source: input
        description: "FK -> DropshipItem.id; endless-aisle substitute offer for the same sku at another vendor. Null when this offer has no substitute."
        default: null
        constraints: "MUST NOT equal this item's own id and MUST reference an item with an identical sku (ERR_FALLBACK_INVALID)"
      - name: sku
        type: string
        source: input
        description: "Retailer SKU this vendor offer fulfills; several vendors may offer the same sku."
        constraints: "1..40 chars"
      - name: lead_time_days
        type: integer
        source: input
        description: "Contracted calendar days from transmission to hand-off to the carrier."
        constraints: "0..60"
      - name: ship_method
        type: enum
        source: input
        description: "Shipping method this offer ships by; must match a ServiceabilityRule to be orderable to a zone."
        constraints: "one of {GROUND, TWO_DAY, FREIGHT_LTL}"
      - name: unit_retail_cents
        type: integer
        source: input
        description: "Customer-facing unit price in cents."
        constraints: ">= 1"
      - name: unit_wholesale_cost_cents
        type: integer
        source: input
        description: "Vendor wholesale list price per unit in cents."
        default: null
        constraints: "required and >= 1 when the owning vendor's cost_model==WHOLESALE (ERR_COST_MODEL_FIELD_MISMATCH); ignored under COMMISSION"
      - name: reverse_freight_owner
        type: enum
        source: input
        description: "Default party paying reverse freight on non-defect returns of this offer."
        constraints: "one of {VENDOR, RETAILER}"
      - name: restock_policy
        type: enum
        source: input
        description: "Where returned units are restocked when the return routes to this offer's vendor."
        constraints: "one of {VENDOR_RESTOCK, RETAILER_RESTOCK, DESTROY}"
      - name: defect_window_days
        type: integer
        source: input
        description: "Days after ShipmentConfirmation.ship_date during which a return may be requested."
        default: 30
        constraints: "1..365"
      - name: status
        type: enum
        source: system
        description: "Offer lifecycle; see §1.2 DropshipItem state machine."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPPRESSED}"
      - name: suppression_reason
        type: enum
        source: system
        description: "Why the offer is SUPPRESSED; cleared to null when the offer returns to ACTIVE."
        default: null
        constraints: "one of {MANUAL, VENDOR_SUSPENDED, ZERO_AVAILABILITY} or null"
      - name: effective_on_hand_units
        type: integer
        source: computed
        description: "On-hand units the platform will trust right now; 0 when no snapshot covers the clock or the feed is stale. See calculations.available_to_promise_units."
        default: 0
      - name: inventory_is_stale
        type: boolean
        source: computed
        description: "True when the age of last_inventory_refresh_at exceeds the vendor cadence times STALE_CADENCE_MULTIPLIER."
        default: true
      - name: reserved_units
        type: integer
        source: computed
        description: "Units held by open order lines (PENDING_TRANSMIT, TRANSMITTED, ACKNOWLEDGED, BACKORDERED)."
        default: 0
      - name: available_units
        type: integer
        source: computed
        description: "Orderable units after safety buffer, oversell grace and reservations. See calculations.available_to_promise_units."
        default: 0
      - name: last_inventory_refresh_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent InventorySnapshot creation for this offer; null until the first feed."
        default: null
      - name: lifetime_reserved_units
        type: integer
        source: computed
        description: "Monotonic count of units ever reserved by order lines on this offer."
        default: 0
      - name: lifetime_released_units
        type: integer
        source: computed
        description: "Monotonic count of reserved units ever released without shipping (vendor cancellation, ack rejection, retransmit away)."
        default: 0
      - name: lifetime_shipped_units
        type: integer
        source: computed
        description: "Monotonic count of reserved units ever consumed by a ShipmentConfirmation."
        default: 0
      - name: unit_cost_cents
        type: integer
        source: computed
        description: "Cost to the retailer for one unit of this offer under the owning vendor's cost_model. See calculations.line_cost_and_order_margin."
        default: 0

  - name: ServiceabilityRule
    parent: Vendor
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor whose geographic coverage this row declares. Taken from the path."
      - name: zone_code
        type: string
        source: input
        description: "Destination zone this vendor can serve, e.g. US-WEST."
        constraints: "1..16 chars, uppercase alnum and hyphen"
      - name: ship_method
        type: enum
        source: input
        description: "Shipping method covered by this row."
        constraints: "one of {GROUND, TWO_DAY, FREIGHT_LTL}"
      - name: transit_days
        type: integer
        source: input
        description: "Calendar days in transit from vendor hand-off to the customer in this zone."
        constraints: "1..30"
      - name: cutoff_hour_utc
        type: integer
        source: input
        description: "UTC hour of day at or after which same-day hand-off is no longer possible; the promise calculation rolls over one day."
        constraints: "0..23"
      - name: surcharge_cents
        type: integer
        source: input
        description: "Per-line surcharge added to order cost when a line ships under this row."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Coverage row lifecycle; INACTIVE rows never match at transmission."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"
      - name: inactivated_by_suspension
        type: boolean
        source: system
        description: "True when this row was flipped INACTIVE by a vendor suspension cascade; only such rows are restored by reinstate."
        default: false

  - name: VendorBlackout
    parent: Vendor
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor closed for hand-off during this window. Taken from the path."
      - name: start_date
        type: string
        source: input
        description: "First calendar date (UTC, YYYY-MM-DD) on which the vendor cannot hand off."
        constraints: "ISO date; <= end_date (ERR_INVALID_INTERVAL)"
      - name: end_date
        type: string
        source: input
        description: "Last calendar date (UTC, YYYY-MM-DD) on which the vendor cannot hand off; window is fully closed on both ends."
        constraints: "ISO date; >= start_date (ERR_INVALID_INTERVAL)"
      - name: reopen_buffer_days
        type: integer
        source: input
        description: "Mandatory clear days that must separate this window from any other ACTIVE window on the same vendor."
        default: 1
        constraints: "0..14"
      - name: reason
        type: enum
        source: input
        description: "Why the vendor is closed."
        constraints: "one of {HOLIDAY, PEAK_FREEZE, CAPACITY, SYSTEM_CUTOVER}"
      - name: status
        type: enum
        source: system
        description: "Window lifecycle; only ACTIVE windows block transmission and push delivery promises."
        default: ACTIVE
        constraints: "one of {ACTIVE, CANCELLED}"

  - name: InventorySnapshot
    parent: DropshipItem
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> DropshipItem.id; the offer whose on-hand this feed message reports. Taken from the path."
      - name: on_hand_units
        type: integer
        source: input
        description: "Units the vendor reports on hand for the window."
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the window this on-hand figure applies to."
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the window; null means open-ended."
        default: null
        constraints: "when non-null MUST be strictly greater than effective_from (ERR_INVALID_INTERVAL)"
      - name: source
        type: enum
        source: input
        description: "Whether the figure arrived on the vendor feed or was keyed by an operator."
        constraints: "one of {VENDOR_FEED, MANUAL_ADJUST}"
      - name: status
        type: enum
        source: system
        description: "ACTIVE snapshots participate in availability; SUPERSEDED ones were auto-closed by a later open-ended feed."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"
      - name: feed_sequence
        type: integer
        source: system
        description: "1-based per-item counter assigned in created_at ASC order."
        constraints: ">= 1"

  - name: DropshipOrder
    parent: null
    common_fields: true
    fields:
      - name: order_ref
        type: string
        source: input
        description: "Retailer order reference."
        constraints: "1..40 chars; globally unique (ERR_DUPLICATE_ORDER_REF)"
      - name: customer_zone_code
        type: string
        source: input
        description: "Destination zone of the shipping address; matched against ServiceabilityRule.zone_code."
        constraints: "1..16 chars, uppercase alnum and hyphen"
      - name: placed_at
        type: datetime
        source: system
        description: "Logical-clock instant the order was created."
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Derived from the statuses of this order's lines; see §1.2 DropshipOrder machine (fulfillment axis)."
        default: OPEN
        constraints: "one of {OPEN, PARTIALLY_SHIPPED, SHIPPED, CANCELLED}"
      - name: financial_status
        type: enum
        source: computed
        description: "Derived from shipped value and refunds; evolves independently of fulfillment_status on the same row."
        default: PENDING
        constraints: "one of {PENDING, CAPTURED, PARTIALLY_REFUNDED, REFUNDED}"
      - name: quoted_promise_date
        type: string
        source: computed
        description: "Customer-facing delivery date computed at order creation by the QUOTED variant of calculations.delivery_promise_date."
      - name: recomputed_promise_date
        type: string
        source: computed
        description: "Delivery date recomputed at transmission by the RECOMPUTED variant; null until the order is transmitted."
        default: null
      - name: promise_variant_in_effect
        type: enum
        source: computed
        description: "Which promise variant currently governs the customer-facing date."
        default: QUOTED
        constraints: "one of {QUOTED, RECOMPUTED}"
      - name: total_retail_cents
        type: integer
        source: computed
        description: "Sum of extended retail over non-cancelled lines; see calculations.line_cost_and_order_margin."
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: "Sum of line cost plus per-line serviceability surcharge over non-cancelled lines."
        default: 0
      - name: margin_cents
        type: integer
        source: computed
        description: "total_retail_cents - total_cost_cents."
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Sum of refund_cents over this order's ReturnAuthorization rows in status AUTHORIZED or RECEIVED."
        default: 0
      - name: net_retail_cents
        type: integer
        source: computed
        description: "total_retail_cents - refunded_cents; the money-conservation counterpart of refunded_cents."
        default: 0
      - name: retailer_absorbed_cents
        type: integer
        source: computed
        description: "Reverse-freight cents the retailer absorbed because a return routed to RETAILER_DC."
        default: 0

  - name: DropshipOrderLine
    parent: DropshipOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> DropshipOrder.id; the order this line belongs to."
      - name: item_id
        type: string
        source: input
        description: "FK -> DropshipItem.id; the vendor offer currently sourcing this line. Rewritten by retransmit."
      - name: line_number
        type: integer
        source: system
        description: "1-based position of the line within the order, assigned in request order."
        constraints: ">= 1"
      - name: quantity
        type: integer
        source: input
        description: "Units ordered on this line."
        constraints: ">= 1"
      - name: unit_retail_cents
        type: integer
        source: system
        description: "DropshipItem.unit_retail_cents frozen at order creation; unaffected by later item price edits."
      - name: unit_cost_cents
        type: integer
        source: computed
        description: "Cost per unit frozen at the most recent transmission of this line; 0 while PENDING_TRANSMIT."
        default: 0
      - name: surcharge_cents
        type: integer
        source: computed
        description: "ServiceabilityRule.surcharge_cents of the row matched at the most recent transmission; 0 while PENDING_TRANSMIT."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Line lifecycle; see §1.2 DropshipOrderLine machine (cyclic through BACKORDERED)."
        default: PENDING_TRANSMIT
        constraints: "one of {PENDING_TRANSMIT, TRANSMITTED, ACKNOWLEDGED, BACKORDERED, SHIPPED, CANCELLED_BY_VENDOR}"
      - name: transmitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transmission; null before the first."
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant the vendor acknowledged; reset to null on retransmit."
        default: null
      - name: shipped_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ShipmentConfirmation; null until shipped."
        default: null
      - name: ack_deadline_at
        type: datetime
        source: computed
        description: "transmitted_at + vendor.ack_sla_hours; see calculations.line_sla_deadlines."
        default: null
      - name: ship_deadline_at
        type: datetime
        source: computed
        description: "transmitted_at + item.lead_time_days*24h + vendor.ship_sla_grace_hours; see calculations.line_sla_deadlines."
        default: null
      - name: ack_sla_breached
        type: boolean
        source: computed
        description: "True when acknowledged_at > ack_deadline_at, or when the clock is past ack_deadline_at while still TRANSMITTED."
        default: false
      - name: ship_sla_breached
        type: boolean
        source: computed
        description: "True when shipped_at > ship_deadline_at."
        default: false
      - name: transmit_attempt_count
        type: integer
        source: system
        description: "Number of times this line has been transmitted, including retransmissions."
        default: 0
      - name: line_promise_date
        type: string
        source: computed
        description: "Per-line delivery promise date; the order's promise is the max over its non-cancelled lines."
      - name: returned_units
        type: integer
        source: computed
        description: "Units covered by this line's ReturnAuthorization rows in status AUTHORIZED or RECEIVED."
        default: 0

  - name: ShipmentConfirmation
    parent: DropshipOrderLine
    common_fields: false
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> DropshipOrderLine.id; the line this confirmation ships. Taken from the path."
      - name: carrier
        type: enum
        source: input
        description: "Carrier that took the parcel."
        constraints: "one of {UPS, FEDEX, USPS, LTL_CARRIER}"
      - name: tracking_number
        type: string
        source: input
        description: "Carrier tracking identifier."
        constraints: "4..40 chars"
      - name: ship_date
        type: string
        source: input
        description: "Calendar date (UTC, YYYY-MM-DD) of hand-off; anchors the return defect window."
      - name: shipped_units
        type: integer
        source: input
        description: "Units handed off; must equal the line quantity (partial line shipment is not supported)."
        constraints: "MUST equal DropshipOrderLine.quantity (ERR_INVALID_REQUEST)"
      - name: package_count
        type: integer
        source: input
        description: "Parcels in the shipment."
        default: 1
        constraints: ">= 1"
      - name: ship_hours
        type: number
        source: computed
        description: "Hours from line.transmitted_at to the confirming clock instant, 2 decimals; feeds scorecard ship time."
      - name: on_time
        type: boolean
        source: computed
        description: "True when the confirming clock instant is <= line.ship_deadline_at."

  - name: ReturnAuthorization
    parent: DropshipOrderLine
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> DropshipOrderLine.id; the shipped line being returned."
      - name: routed_vendor_id
        type: string
        source: computed
        description: "FK -> Vendor.id; vendor selected to receive the return. Null while REQUESTED and null whenever routing_destination is RETAILER_DC."
        default: null
      - name: reason_code
        type: enum
        source: input
        description: "Customer-stated return reason; drives fee waiver and reverse-freight ownership."
        constraints: "one of {DEFECTIVE, NOT_AS_DESCRIBED, BUYER_REMORSE, LATE_DELIVERY}"
      - name: quantity_returned
        type: integer
        source: input
        description: "Units the customer is returning."
        constraints: ">= 1 and <= line.quantity - line.returned_units (ERR_RETURN_QUANTITY_EXCEEDS_SHIPPED)"
      - name: status
        type: enum
        source: system
        description: "Return lifecycle; see §1.2 ReturnAuthorization machine (branching)."
        default: REQUESTED
        constraints: "one of {REQUESTED, AUTHORIZED, RECEIVED, REJECTED}"
      - name: routing_destination
        type: enum
        source: computed
        description: "Where the physical goods go; chosen by calculations.return_routing_selection. Null while REQUESTED."
        default: null
        constraints: "one of {VENDOR, RETAILER_DC} or null"
      - name: reverse_freight_owner
        type: enum
        source: computed
        description: "Party paying reverse freight for this return; see calculations.return_financials."
        default: null
        constraints: "one of {VENDOR, RETAILER} or null"
      - name: restock_disposition
        type: enum
        source: computed
        description: "What happens to the returned units on receipt."
        default: null
        constraints: "one of {VENDOR_RESTOCK, RETAILER_RESTOCK, DESTROY} or null"
      - name: refund_base_cents
        type: integer
        source: computed
        description: "quantity_returned * line.unit_retail_cents; the tier key for the restocking fee."
        default: null
      - name: restocking_fee_cents
        type: integer
        source: computed
        description: "Fee withheld from the refund; see calculations.return_financials."
        default: null
      - name: customer_freight_charge_cents
        type: integer
        source: computed
        description: "Reverse freight billed to the customer; non-zero only for RETAILER-owned freight on BUYER_REMORSE."
        default: null
      - name: refund_cents
        type: integer
        source: computed
        description: "Cash refunded to the customer once AUTHORIZED."
        default: null
      - name: vendor_chargeback_cents
        type: integer
        source: computed
        description: "Cents debited from Vendor.settlement_balance_cents and credited to Vendor.chargeback_balance_cents on authorization."
        default: null
      - name: restocked_units
        type: integer
        source: computed
        description: "Units credited back to inventory on receipt; 0 when restock_disposition is DESTROY."
        default: 0
      - name: rejection_reason
        type: enum
        source: system
        description: "Why the return was REJECTED; null otherwise."
        default: null
        constraints: "one of {OUTSIDE_DEFECT_WINDOW, NOT_RECEIVED, POLICY} or null"

  - name: VendorScorecard
    parent: Vendor
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor scored. Taken from the path."
      - name: period_start
        type: string
        source: input
        description: "Inclusive first calendar date (UTC, YYYY-MM-DD) of the scoring period."
      - name: period_end
        type: string
        source: input
        description: "Inclusive last calendar date (UTC, YYYY-MM-DD) of the scoring period."
        constraints: ">= period_start (ERR_INVALID_INTERVAL)"
      - name: metric_variant
        type: enum
        source: input
        description: "Which of the two sanctioned rate definitions to use; see calculations.vendor_scorecard_metrics."
        default: EVENT_EQUAL
        constraints: "one of {EVENT_EQUAL, UNIT_WEIGHTED}"
      - name: seeded_prior_avg_ship_hours
        type: number
        source: input
        description: "Pre-go-live ship-time history to import; honored only when the period contains zero in-system transmitted lines."
        default: null
        constraints: "> 0 when present"
      - name: seeded_prior_on_time_ship_rate_bps
        type: integer
        source: input
        description: "Pre-go-live on-time rate to import; honored only when the period contains zero in-system transmitted lines."
        default: null
        constraints: "0..10000 when present"
      - name: seeded_prior_cancellation_rate_bps
        type: integer
        source: input
        description: "Pre-go-live cancellation rate to import; honored only when the period contains zero in-system transmitted lines."
        default: null
        constraints: "0..10000 when present"
      - name: seeded_prior_defect_rate_bps
        type: integer
        source: input
        description: "Pre-go-live defect rate to import; honored only when the period contains zero in-system transmitted lines."
        default: null
        constraints: "0..10000 when present"
      - name: transmitted_line_count
        type: integer
        source: computed
        description: "Lines of this vendor with transmitted_at date inside the period."
        default: 0
      - name: shipped_line_count
        type: integer
        source: computed
        description: "Subset of transmitted lines now in status SHIPPED."
        default: 0
      - name: cancelled_line_count
        type: integer
        source: computed
        description: "Subset of transmitted lines now in status CANCELLED_BY_VENDOR."
        default: 0
      - name: defect_return_count
        type: integer
        source: computed
        description: "ReturnAuthorization rows in status AUTHORIZED or RECEIVED with reason_code in {DEFECTIVE, NOT_AS_DESCRIBED} on shipped lines of the period."
        default: 0
      - name: transmitted_unit_count
        type: integer
        source: computed
        description: "Sum of quantity over the transmitted lines of the period."
        default: 0
      - name: shipped_unit_count
        type: integer
        source: computed
        description: "Sum of quantity over the shipped lines of the period."
        default: 0
      - name: cancelled_unit_count
        type: integer
        source: computed
        description: "Sum of quantity over the cancelled lines of the period."
        default: 0
      - name: defect_unit_count
        type: integer
        source: computed
        description: "Sum of quantity_returned over the counted defect returns of the period."
        default: 0
      - name: on_time_ship_rate_bps
        type: integer
        source: computed
        description: "Basis points of shipped volume that met ship_deadline_at; null when the period has no in-system transmitted lines and no seed."
        default: null
      - name: cancellation_rate_bps
        type: integer
        source: computed
        description: "Basis points of transmitted volume cancelled by the vendor; null when unrated."
        default: null
      - name: defect_rate_bps
        type: integer
        source: computed
        description: "Basis points of shipped volume returned as defective or not-as-described; null when unrated."
        default: null
      - name: avg_ship_hours
        type: number
        source: computed
        description: "Mean ShipmentConfirmation.ship_hours over shipped lines of the period, 2 decimals; null when unrated."
        default: null
      - name: composite_score
        type: number
        source: computed
        description: "0..100 weighted score, 2 decimals; null when unrated. See calculations.vendor_scorecard_metrics."
        default: null
      - name: tier
        type: enum
        source: computed
        description: "Threshold banding of composite_score."
        default: UNRATED
        constraints: "one of {UNRATED, PLATINUM, GOLD, SILVER, WATCH, PROBATION}"
      - name: promise_padding_days
        type: integer
        source: computed
        description: "Padding days the tier implies for the QUOTED promise variant."
        default: 2
        constraints: "0..5"
      - name: status
        type: enum
        source: system
        description: "DRAFT scorecards do not affect the vendor; publishing copies tier and padding onto the Vendor."
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED}"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; null while DRAFT."
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Vendor
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic in two places: the INTEGRATION_TESTING self-loop (one loop per failed round) and the ACTIVE <-> SUSPENDED pair."
    transitions:
      - from: DRAFT
        to: INTEGRATION_TESTING
        trigger: "POST /dropship/vendors/{id}/begin-integration"
        actor: VendorOpsAnalyst
        preconditions:
          - "vendor.onboarding_status == DRAFT"
        side_effects:
          - "vendor.integration_round = 1"
          - "vendor.certified_by_user_id = null"
          - "increments Vendor.version by 1"
      - from: INTEGRATION_TESTING
        to: INTEGRATION_TESTING
        trigger: "POST /dropship/vendors/{id}/begin-integration"
        actor: VendorOpsAnalyst
        preconditions:
          - "vendor.onboarding_status == INTEGRATION_TESTING"
          - "at least one IntegrationTest with vendor_id == vendor.id AND round_number == vendor.integration_round AND status == FAILED exists (else ERR_VENDOR_INVALID_STATE)"
        side_effects:
          - "vendor.integration_round = vendor.integration_round + 1"
          - "prior-round IntegrationTest rows are left untouched; they stay frozen at their round_number and no longer count toward certification"
          - "increments Vendor.version by 1"
        note: "The revision loop of the onboarding workflow: a failed round is retried by opening a new round, not by mutating the failed runs."
      - from: INTEGRATION_TESTING
        to: CERTIFIED
        trigger: "POST /dropship/vendors/{id}/certify"
        actor: VendorOpsAnalyst
        preconditions:
          - "vendor.onboarding_status == INTEGRATION_TESTING"
          - "for every message_type in {CATALOG, INVENTORY, ORDER, SHIP_CONFIRM} there exists an IntegrationTest with vendor_id == vendor.id AND round_number == vendor.integration_round AND status == PASSED (else ERR_INTEGRATION_INCOMPLETE)"
        side_effects:
          - "vendor.certified_by_user_id = X-User-ID of the calling analyst"
          - "increments Vendor.version by 1"
      - from: CERTIFIED
        to: ACTIVE
        trigger: "POST /dropship/vendors/{id}/activate"
        actor: MerchandiseManager
        preconditions:
          - "vendor.onboarding_status == CERTIFIED"
          - "X-User-ID != vendor.certified_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "count of ServiceabilityRule with vendor_id == vendor.id AND status == ACTIVE >= 1 (else ERR_NO_SERVICEABILITY_COVERAGE)"
        side_effects:
          - "vendor.activated_by_user_id = X-User-ID of the calling merchandise manager"
          - "increments Vendor.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dropship/vendors/{id}/suspend"
        actor: MerchandiseManager | PlatformAdmin
        preconditions:
          - "vendor.onboarding_status == ACTIVE"
        side_effects:
          - "vendor.suspension_reason = MANUAL_OPS"
          - "CASCADE hop 1: every ServiceabilityRule with vendor_id == vendor.id AND status == ACTIVE is set to status INACTIVE with inactivated_by_suspension = true"
          - "CASCADE hop 2 (caused by hop 1 removing the vendor's live coverage): every DropshipItem with vendor_id == vendor.id AND status == ACTIVE is set to status SUPPRESSED with suppression_reason = VENDOR_SUSPENDED, and its available_units is recomputed to 0"
          - "CASCADE hop 3 (caused by hop 2 suppressing those offers): every DropshipOrderLine with item_id in the hop-2 item set AND status == PENDING_TRANSMIT is set to status BACKORDERED"
          - "CASCADE hop 4 (caused by hop 3): every DropshipOrder owning a hop-3 line has its fulfillment_status re-derived by calculations.order_fulfillment_rollup"
          - "increments Vendor.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: a VendorScorecard whose tier == PROBATION is published (POST /dropship/scorecards/{id}/publish)"
        actor: system
        preconditions:
          - "vendor.onboarding_status == ACTIVE"
          - "the scorecard being published has tier == PROBATION"
        side_effects:
          - "vendor.suspension_reason = SCORECARD_PROBATION"
          - "the identical four-hop cascade declared on the manual ACTIVE -> SUSPENDED transition runs"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dropship/vendors/{id}/reinstate"
        actor: MerchandiseManager
        preconditions:
          - "vendor.onboarding_status == SUSPENDED"
          - "if vendor.suspension_reason == SCORECARD_PROBATION then the vendor's latest PUBLISHED VendorScorecard (greatest period_end, tie-break greatest created_at) MUST have tier != PROBATION (else ERR_VENDOR_INVALID_STATE)"
        side_effects:
          - "vendor.suspension_reason = null"
          - "every ServiceabilityRule with vendor_id == vendor.id AND inactivated_by_suspension == true is set to status ACTIVE with inactivated_by_suspension = false"
          - "caused by the previous hop restoring coverage: every DropshipItem with vendor_id == vendor.id AND status == SUPPRESSED AND suppression_reason == VENDOR_SUSPENDED is set to status ACTIVE with suppression_reason = null, and its available_units is recomputed"
          - "increments Vendor.version by 1"
        note: "Lines pushed to BACKORDERED by the suspension are NOT auto-restored; they must be retransmitted explicitly."

  - entity: IntegrationTest
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /dropship/integration-tests/{id}/evaluate with outcome == PASS"
        actor: VendorOpsAnalyst
        preconditions:
          - "integration_test.status == PENDING (else ERR_INTEGRATION_TEST_INVALID_STATE)"
          - "the owning Vendor.onboarding_status == INTEGRATION_TESTING (else ERR_VENDOR_INVALID_STATE)"
          - "integration_test.round_number == vendor.integration_round (else ERR_INTEGRATION_TEST_INVALID_STATE)"
        side_effects:
          - "integration_test.evaluated_by_user_id = X-User-ID of the calling analyst"
          - "integration_test.evaluated_at = logical clock"
          - "integration_test.defect_notes = request defect_notes when supplied, else null"
      - from: PENDING
        to: FAILED
        trigger: "POST /dropship/integration-tests/{id}/evaluate with outcome == FAIL"
        actor: VendorOpsAnalyst
        preconditions:
          - "integration_test.status == PENDING (else ERR_INTEGRATION_TEST_INVALID_STATE)"
          - "the owning Vendor.onboarding_status == INTEGRATION_TESTING (else ERR_VENDOR_INVALID_STATE)"
          - "integration_test.round_number == vendor.integration_round (else ERR_INTEGRATION_TEST_INVALID_STATE)"
          - "request defect_notes is present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "integration_test.evaluated_by_user_id = X-User-ID of the calling analyst"
          - "integration_test.evaluated_at = logical clock"
          - "integration_test.defect_notes = request defect_notes"
          - "the owning vendor becomes eligible for the INTEGRATION_TESTING self-loop (a new round)"

  - entity: DropshipItem
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic: ACTIVE <-> SUPPRESSED. Three distinct suppression causes are distinguished by suppression_reason and each has its own restore path."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /dropship/items/{id}/activate"
        actor: MerchandiseManager
        preconditions:
          - "item.status == DRAFT"
          - "the owning Vendor.onboarding_status == ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
          - "at least one ServiceabilityRule with vendor_id == item.vendor_id AND status == ACTIVE AND ship_method == item.ship_method exists (else ERR_NO_SERVICEABILITY_COVERAGE)"
          - "if vendor.cost_model == WHOLESALE then item.unit_wholesale_cost_cents is non-null (else ERR_COST_MODEL_FIELD_MISMATCH)"
        side_effects:
          - "item.unit_cost_cents recomputed by calculations.line_cost_and_order_margin (unit stage)"
          - "item.effective_on_hand_units, item.inventory_is_stale and item.available_units recomputed by calculations.available_to_promise_units"
          - "increments DropshipItem.version by 1"
      - from: ACTIVE
        to: SUPPRESSED
        trigger: "POST /dropship/items/{id}/suppress"
        actor: MerchandiseManager | PlatformAdmin
        preconditions:
          - "item.status == ACTIVE"
        side_effects:
          - "item.suppression_reason = MANUAL"
          - "item.available_units = 0"
          - "increments DropshipItem.version by 1"
      - from: ACTIVE
        to: SUPPRESSED
        trigger: "system event: vendor suspension cascade hop 2"
        actor: system
        preconditions:
          - "item.status == ACTIVE"
          - "the owning vendor transitioned ACTIVE -> SUSPENDED in this request"
        side_effects:
          - "item.suppression_reason = VENDOR_SUSPENDED"
          - "item.available_units = 0"
      - from: ACTIVE
        to: SUPPRESSED
        trigger: "system event: an InventorySnapshot creation leaves available_units == 0 AND effective_on_hand_units == 0"
        actor: system
        preconditions:
          - "item.status == ACTIVE"
          - "the recompute triggered by POST /dropship/items/{id}/inventory-snapshots yields available_units == 0 AND effective_on_hand_units == 0"
        side_effects:
          - "item.suppression_reason = ZERO_AVAILABILITY"
        note: "Only InventorySnapshot creation can trigger this auto-suppression. Reservation changes from order/line transitions never auto-suppress an offer."
      - from: SUPPRESSED
        to: ACTIVE
        trigger: "POST /dropship/items/{id}/activate"
        actor: MerchandiseManager
        preconditions:
          - "item.status == SUPPRESSED"
          - "item.suppression_reason in {MANUAL, ZERO_AVAILABILITY} (a VENDOR_SUSPENDED offer can only be restored by vendor reinstate, else ERR_ITEM_INVALID_STATE)"
          - "the owning Vendor.onboarding_status == ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
          - "at least one ServiceabilityRule with vendor_id == item.vendor_id AND status == ACTIVE AND ship_method == item.ship_method exists (else ERR_NO_SERVICEABILITY_COVERAGE)"
        side_effects:
          - "item.suppression_reason = null"
          - "item.unit_cost_cents, item.effective_on_hand_units, item.inventory_is_stale and item.available_units recomputed"
          - "increments DropshipItem.version by 1"
      - from: SUPPRESSED
        to: ACTIVE
        trigger: "system event: vendor reinstate cascade"
        actor: system
        preconditions:
          - "item.status == SUPPRESSED AND item.suppression_reason == VENDOR_SUSPENDED"
          - "the owning vendor transitioned SUSPENDED -> ACTIVE in this request"
        side_effects:
          - "item.suppression_reason = null"
          - "item.available_units recomputed"
      - from: SUPPRESSED
        to: ACTIVE
        trigger: "system event: an InventorySnapshot creation lifts available_units above 0"
        actor: system
        preconditions:
          - "item.status == SUPPRESSED AND item.suppression_reason == ZERO_AVAILABILITY"
          - "the recompute triggered by POST /dropship/items/{id}/inventory-snapshots yields available_units > 0"
        side_effects:
          - "item.suppression_reason = null"

  - entity: DropshipOrder
    initial_state: "fulfillment_status=OPEN + financial_status=PENDING"
    terminal_states: ["fulfillment_status in {SHIPPED, CANCELLED}", "financial_status == REFUNDED"]
    note: |
      Two independent state dimensions live on one DropshipOrder row and advance on different
      triggers: fulfillment_status is re-derived from line statuses (compound), financial_status is
      re-derived from shipped value and refunds. A single order can be fulfillment_status=SHIPPED with
      financial_status=PARTIALLY_REFUNDED, or fulfillment_status=OPEN with financial_status=PENDING
      while a line sits BACKORDERED. Neither axis constrains the other.
    transitions:
      - from: "fulfillment_status=OPEN"
        to: "fulfillment_status=PARTIALLY_SHIPPED"
        trigger: "system event: POST /dropship/order-lines/{id}/ship-confirm (calculations.order_fulfillment_rollup)"
        actor: system
        preconditions:
          - "at least one line of the order has status == SHIPPED"
          - "at least one line of the order has status in {PENDING_TRANSMIT, TRANSMITTED, ACKNOWLEDGED, BACKORDERED}"
        side_effects:
          - "order.total_retail_cents, order.total_cost_cents, order.margin_cents re-derived"
          - "increments DropshipOrder.version by 1"
      - from: "fulfillment_status in {OPEN, PARTIALLY_SHIPPED}"
        to: "fulfillment_status=SHIPPED"
        trigger: "system event: POST /dropship/order-lines/{id}/ship-confirm (calculations.order_fulfillment_rollup)"
        actor: system
        preconditions:
          - "no line of the order has status in {PENDING_TRANSMIT, TRANSMITTED, ACKNOWLEDGED, BACKORDERED}"
          - "at least one line of the order has status == SHIPPED"
        side_effects:
          - "order.total_retail_cents, order.total_cost_cents, order.margin_cents re-derived"
          - "increments DropshipOrder.version by 1"
      - from: "fulfillment_status in {OPEN, PARTIALLY_SHIPPED}"
        to: "fulfillment_status=CANCELLED"
        trigger: "system event: POST /dropship/order-lines/{id}/cancel or acknowledge with ack_disposition == REJECTED (calculations.order_fulfillment_rollup)"
        actor: system
        preconditions:
          - "every line of the order has status == CANCELLED_BY_VENDOR"
        side_effects:
          - "order.total_retail_cents = 0, order.total_cost_cents = 0, order.margin_cents = 0"
          - "caused by fulfillment_status reaching CANCELLED while financial_status == PENDING: financial_status is set to REFUNDED with order.refunded_cents = 0 and order.net_retail_cents = 0"
          - "increments DropshipOrder.version by 1"
      - from: "financial_status=PENDING"
        to: "financial_status=CAPTURED"
        trigger: "system event: POST /dropship/order-lines/{id}/ship-confirm"
        actor: system
        preconditions:
          - "at least one line of the order has status == SHIPPED"
          - "order.refunded_cents == 0"
        side_effects:
          - "order.net_retail_cents = order.total_retail_cents"
      - from: "financial_status=CAPTURED"
        to: "financial_status=PARTIALLY_REFUNDED"
        trigger: "system event: POST /dropship/returns/{id}/authorize"
        actor: system
        preconditions:
          - "0 < order.refunded_cents < order.total_retail_cents"
        side_effects:
          - "order.net_retail_cents = order.total_retail_cents - order.refunded_cents"
      - from: "financial_status in {CAPTURED, PARTIALLY_REFUNDED}"
        to: "financial_status=REFUNDED"
        trigger: "system event: POST /dropship/returns/{id}/authorize"
        actor: system
        preconditions:
          - "order.refunded_cents >= order.total_retail_cents"
        side_effects:
          - "order.net_retail_cents = order.total_retail_cents - order.refunded_cents"
      - from: "financial_status=PARTIALLY_REFUNDED"
        to: "financial_status=CAPTURED"
        trigger: "system event: POST /dropship/returns/{id}/reject on an AUTHORIZED return"
        actor: system
        preconditions:
          - "after the reversal, order.refunded_cents == 0"
        side_effects:
          - "order.net_retail_cents = order.total_retail_cents"
        note: "The compensating leg of the financial axis; PARTIALLY_REFUNDED is not terminal."

  - entity: DropshipOrderLine
    initial_state: PENDING_TRANSMIT
    terminal_states: [SHIPPED, CANCELLED_BY_VENDOR]
    note: "Cyclic: TRANSMITTED -> BACKORDERED -> TRANSMITTED, with the retransmit hop free to move the line to a different vendor's offer."
    transitions:
      - from: PENDING_TRANSMIT
        to: TRANSMITTED
        trigger: "POST /dropship/orders/{id}/transmit"
        actor: PlatformAdmin | MerchandiseManager
        preconditions:
          - "line.status == PENDING_TRANSMIT"
          - "item.status == ACTIVE (else ERR_ITEM_INVALID_STATE)"
          - "the item's Vendor.onboarding_status == ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
          - "a ServiceabilityRule with vendor_id == item.vendor_id AND status == ACTIVE AND zone_code == order.customer_zone_code AND ship_method == item.ship_method exists (else ERR_ZONE_NOT_SERVICEABLE)"
          - "no VendorBlackout with vendor_id == item.vendor_id AND status == ACTIVE AND start_date <= clock_date <= end_date exists (else ERR_VENDOR_BLACKOUT)"
        side_effects:
          - "line.transmitted_at = logical clock; line.transmit_attempt_count += 1"
          - "line.unit_cost_cents and line.surcharge_cents pinned by calculations.line_cost_and_order_margin"
          - "line.ack_deadline_at and line.ship_deadline_at pinned by calculations.line_sla_deadlines"
          - "line.line_promise_date re-derived by calculations.delivery_promise_date variant RECOMPUTED"
          - "order.total_retail_cents / total_cost_cents / margin_cents re-derived"
          - "order.recomputed_promise_date = max(line_promise_date) over non-cancelled lines; order.promise_variant_in_effect = RECOMPUTED"
          - "increments DropshipOrder.version by 1"
      - from: TRANSMITTED
        to: ACKNOWLEDGED
        trigger: "POST /dropship/order-lines/{id}/acknowledge with ack_disposition == ACCEPTED"
        actor: VendorUser
        preconditions:
          - "line.status == TRANSMITTED (else ERR_LINE_INVALID_STATE)"
          - "X-User-ID == the item's vendor_id (else ERR_VENDOR_SCOPE_VIOLATION)"
        side_effects:
          - "line.acknowledged_at = logical clock"
          - "line.ack_sla_breached = (acknowledged_at > line.ack_deadline_at)"
      - from: TRANSMITTED
        to: BACKORDERED
        trigger: "POST /dropship/order-lines/{id}/acknowledge with ack_disposition == BACKORDERED"
        actor: VendorUser
        preconditions:
          - "line.status == TRANSMITTED (else ERR_LINE_INVALID_STATE)"
          - "X-User-ID == the item's vendor_id (else ERR_VENDOR_SCOPE_VIOLATION)"
        side_effects:
          - "line.acknowledged_at = logical clock"
          - "line.ack_sla_breached = (acknowledged_at > line.ack_deadline_at)"
          - "reserved units are NOT released: the line is still open and item.reserved_units is unchanged"
          - "the owning order's fulfillment_status is re-derived (BACKORDERED counts as open)"
      - from: TRANSMITTED
        to: CANCELLED_BY_VENDOR
        trigger: "POST /dropship/order-lines/{id}/acknowledge with ack_disposition == REJECTED, or POST /dropship/order-lines/{id}/cancel"
        actor: VendorUser
        preconditions:
          - "line.status == TRANSMITTED (else ERR_LINE_INVALID_STATE)"
          - "X-User-ID == the item's vendor_id (else ERR_VENDOR_SCOPE_VIOLATION)"
        side_effects:
          - "CASCADE hop 1: line.status = CANCELLED_BY_VENDOR; item.reserved_units -= line.quantity; item.lifetime_released_units += line.quantity; item.available_units recomputed"
          - "CASCADE hop 2 (caused by hop 1 changing the line's status): order.total_retail_cents / total_cost_cents / margin_cents are re-derived over the remaining non-cancelled lines and order.fulfillment_status is re-derived by calculations.order_fulfillment_rollup"
          - "CASCADE hop 3 (caused by hop 2 landing fulfillment_status on CANCELLED while financial_status == PENDING): order.financial_status = REFUNDED, order.refunded_cents = 0, order.net_retail_cents = 0"
          - "CASCADE hop 4 (caused by hop 3 closing the order out unfulfilled): a vendor cancellation penalty of CANCELLATION_PENALTY_CENTS per cancelled line of that vendor on this order is posted - vendor.chargeback_balance_cents += penalty and vendor.settlement_balance_cents -= penalty"
          - "increments DropshipItem.version by 1 and DropshipOrder.version by 1"
      - from: ACKNOWLEDGED
        to: CANCELLED_BY_VENDOR
        trigger: "POST /dropship/order-lines/{id}/cancel"
        actor: VendorUser
        preconditions:
          - "line.status == ACKNOWLEDGED (else ERR_LINE_INVALID_STATE)"
          - "X-User-ID == the item's vendor_id (else ERR_VENDOR_SCOPE_VIOLATION)"
        side_effects:
          - "identical four-hop cascade to the TRANSMITTED -> CANCELLED_BY_VENDOR transition"
      - from: BACKORDERED
        to: CANCELLED_BY_VENDOR
        trigger: "POST /dropship/order-lines/{id}/cancel"
        actor: VendorUser
        preconditions:
          - "line.status == BACKORDERED (else ERR_LINE_INVALID_STATE)"
          - "X-User-ID == the item's vendor_id (else ERR_VENDOR_SCOPE_VIOLATION)"
        side_effects:
          - "identical four-hop cascade to the TRANSMITTED -> CANCELLED_BY_VENDOR transition"
      - from: BACKORDERED
        to: TRANSMITTED
        trigger: "POST /dropship/order-lines/{id}/retransmit"
        actor: PlatformAdmin | MerchandiseManager
        preconditions:
          - "line.status == BACKORDERED (else ERR_LINE_INVALID_STATE)"
          - "calculations.retransmit_target_selection returns a non-empty candidate set (else ERR_NO_ELIGIBLE_FALLBACK_VENDOR and the line stays BACKORDERED)"
        side_effects:
          - "the previously sourcing item releases the reservation: old_item.reserved_units -= line.quantity, old_item.lifetime_released_units += line.quantity, old_item.available_units recomputed"
          - "line.item_id = the selected target item id"
          - "the selected item takes the reservation: new_item.reserved_units += line.quantity, new_item.lifetime_reserved_units += line.quantity, new_item.available_units recomputed"
          - "line.acknowledged_at = null; line.ack_sla_breached = false"
          - "line.transmitted_at = logical clock; line.transmit_attempt_count += 1"
          - "line.unit_retail_cents is NOT changed (the customer price is frozen at order creation)"
          - "line.unit_cost_cents and line.surcharge_cents re-pinned against the new item and its vendor's matched ServiceabilityRule"
          - "line.ack_deadline_at and line.ship_deadline_at re-pinned; line.line_promise_date re-derived by variant RECOMPUTED"
          - "order.total_retail_cents / total_cost_cents / margin_cents and order.recomputed_promise_date re-derived"
          - "increments DropshipOrder.version by 1"
        note: "The cycle closes here: a retransmitted line is TRANSMITTED again and may be acknowledged, backordered again, cancelled or shipped."
      - from: ACKNOWLEDGED
        to: SHIPPED
        trigger: "POST /dropship/order-lines/{id}/ship-confirm"
        actor: VendorUser
        preconditions:
          - "line.status == ACKNOWLEDGED (a TRANSMITTED line MUST be acknowledged first, else ERR_LINE_INVALID_STATE)"
          - "X-User-ID == the item's vendor_id (else ERR_VENDOR_SCOPE_VIOLATION)"
          - "request shipped_units == line.quantity (else ERR_INVALID_REQUEST)"
        side_effects:
          - "a ShipmentConfirmation row is created with ship_hours and on_time computed"
          - "line.shipped_at = logical clock; line.ship_sla_breached = (shipped_at > line.ship_deadline_at)"
          - "item.reserved_units -= line.quantity; item.lifetime_shipped_units += line.quantity; item.available_units recomputed"
          - "vendor.settlement_balance_cents += line.unit_cost_cents * line.quantity + line.surcharge_cents"
          - "order.fulfillment_status re-derived by calculations.order_fulfillment_rollup; order.financial_status advances PENDING -> CAPTURED"
          - "increments DropshipItem.version by 1 and DropshipOrder.version by 1"

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [RECEIVED, REJECTED]
    note: "Branching: authorization forks on routing_destination with disjoint side-effect sets, and REJECTED is reachable from two different from-states with different reversal obligations."
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /dropship/returns/{id}/authorize"
        actor: CareAgent | MerchandiseManager
        preconditions:
          - "ra.status == REQUESTED (else ERR_RETURN_INVALID_STATE)"
          - "the referenced DropshipOrderLine.status == SHIPPED (else ERR_LINE_INVALID_STATE)"
          - "clock_date <= ShipmentConfirmation.ship_date + item.defect_window_days (else ERR_OUTSIDE_DEFECT_WINDOW)"
        side_effects:
          - "routing_destination, routed_vendor_id and restock_disposition set by calculations.return_routing_selection"
          - "refund_base_cents, restocking_fee_cents, customer_freight_charge_cents, refund_cents, reverse_freight_owner and vendor_chargeback_cents set by calculations.return_financials"
          - "line.returned_units += ra.quantity_returned"
          - "order.refunded_cents += ra.refund_cents; order.net_retail_cents = order.total_retail_cents - order.refunded_cents; order.financial_status re-derived"
          - "BRANCH routing_destination == VENDOR: routed_vendor_id = the selected vendor id; vendor.chargeback_balance_cents += ra.vendor_chargeback_cents; vendor.settlement_balance_cents -= ra.vendor_chargeback_cents; order.retailer_absorbed_cents unchanged"
          - "BRANCH routing_destination == RETAILER_DC: routed_vendor_id = null; ra.vendor_chargeback_cents = 0; no vendor balance moves; order.retailer_absorbed_cents += REVERSE_FREIGHT_FLAT_CENTS"
          - "increments DropshipOrder.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /dropship/returns/{id}/reject"
        actor: MerchandiseManager
        preconditions:
          - "ra.status == REQUESTED (else ERR_RETURN_INVALID_STATE)"
        side_effects:
          - "ra.rejection_reason = request rejection_reason"
          - "no financial or inventory effect: refund_cents, vendor_chargeback_cents and line.returned_units are untouched"
      - from: AUTHORIZED
        to: REJECTED
        trigger: "POST /dropship/returns/{id}/reject"
        actor: MerchandiseManager
        preconditions:
          - "ra.status == AUTHORIZED (else ERR_RETURN_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: line.returned_units -= ra.quantity_returned"
          - "COMPENSATION: order.refunded_cents -= ra.refund_cents; order.net_retail_cents = order.total_retail_cents - order.refunded_cents; order.financial_status re-derived (PARTIALLY_REFUNDED -> CAPTURED when refunded_cents returns to 0)"
          - "COMPENSATION on the VENDOR branch: vendor.chargeback_balance_cents -= ra.vendor_chargeback_cents; vendor.settlement_balance_cents += ra.vendor_chargeback_cents"
          - "COMPENSATION on the RETAILER_DC branch: order.retailer_absorbed_cents -= REVERSE_FREIGHT_FLAT_CENTS"
          - "ra.rejection_reason = request rejection_reason; the computed financial fields are retained for audit but no longer counted anywhere"
          - "increments DropshipOrder.version by 1"
        note: "Compensating leg for the monetary conservation invariant: vendor.settlement_balance_cents + vendor.chargeback_balance_cents is unchanged by the authorize/reject pair and each component returns to its pre-authorization value."
      - from: AUTHORIZED
        to: RECEIVED
        trigger: "POST /dropship/returns/{id}/receive"
        actor: VendorUser | PlatformAdmin
        preconditions:
          - "ra.status == AUTHORIZED (else ERR_RETURN_INVALID_STATE)"
          - "when the caller is VendorUser: X-User-ID == ra.routed_vendor_id (else ERR_VENDOR_SCOPE_VIOLATION)"
        side_effects:
          - "ra.restocked_units = ra.quantity_returned when ra.restock_disposition in {VENDOR_RESTOCK, RETAILER_RESTOCK}, else 0"
          - "no reservation counters move: returns never touch reserved_units, lifetime_reserved_units, lifetime_released_units or lifetime_shipped_units"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: snapshot-create-stale-item
    parent_entity: DropshipItem
    write_endpoint: "POST /dropship/items/{id}/inventory-snapshots"
    occ_field: "expected_item_version"
    description: |
      Posting an inventory feed message for an offer whose version has advanced since the client
      last observed it is rejected. A feed message legitimately supersedes the offer's prior
      open-ended snapshot (auto-closing it), so a second create carrying the pre-supersede version
      would otherwise be accepted on top of an offer whose on-hand baseline has already moved.
      The OCC check turns that into a deterministic stale-version rejection.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

  - rule_id: scorecard-publish-stale-vendor
    parent_entity: Vendor
    write_endpoint: "POST /dropship/scorecards/{id}/publish"
    occ_field: "expected_vendor_version"
    description: |
      Publishing a scorecard against a vendor whose version has advanced since the client last
      observed it is rejected. Publication legitimately supersedes whatever tier and promise padding
      the vendor currently carries, so a publish that still carries the pre-supersede vendor version
      is acting on a stale view of the vendor's performance posture.
    error_id: ERR_STALE_VENDOR_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: available_to_promise_units
    trigger: "On InventorySnapshot creation, on DropshipItem activate/suppress, on every reservation change (order create, line cancel, retransmit, ship-confirm), and on every read of DropshipItem"
    algorithm: threshold
    formula: |
      vendor = Vendor[item.vendor_id]

      # (a) snapshot selection - explicit filter, window, and tie-break
      candidates = InventorySnapshot rows with item_id == item.id
                   AND status == ACTIVE
                   AND effective_from <= clock
                   AND (effective_to is null OR clock < effective_to)      # half-open window
      current_snapshot = the candidate with the greatest effective_from;
                         when two candidates tie on effective_from, the one with the greatest created_at;
                         null when candidates is empty

      # (b) feed staleness - refresh cadence with oversell protection
      stale_limit_minutes = vendor.inventory_refresh_cadence_minutes * STALE_CADENCE_MULTIPLIER
      age_minutes = floor((clock - item.last_inventory_refresh_at) / 60 seconds)
      item.inventory_is_stale = true when item.last_inventory_refresh_at is null
                               else (age_minutes > stale_limit_minutes)
      # exactly at the limit the feed is FRESH; one minute past it the feed is STALE

      # (c) trusted on-hand
      item.effective_on_hand_units = 0 when (current_snapshot is null OR item.inventory_is_stale)
                                     else current_snapshot.on_hand_units

      # (d) availability with safety buffer and oversell grace
      item.available_units = 0 when item.status != ACTIVE
                             else max(0, item.effective_on_hand_units
                                         - vendor.safety_buffer_units
                                         + vendor.oversell_grace_units
                                         - item.reserved_units)
    input_set: |
      Only InventorySnapshot rows with status == ACTIVE whose half-open window [effective_from,
      effective_to) contains the logical clock. SUPERSEDED rows are excluded. reserved_units counts
      DropshipOrderLine rows with status in {PENDING_TRANSMIT, TRANSMITTED, ACKNOWLEDGED, BACKORDERED}
      pointing at this item; SHIPPED and CANCELLED_BY_VENDOR lines are excluded.
    constants:
      STALE_CADENCE_MULTIPLIER: 3
    precision: "integer units, no rounding; the max(0, ...) floor applies after all terms"
    note: |
      Order creation gates on this output twice, in this order: ERR_INVENTORY_STALE first
      (inventory_is_stale == true), then ERR_INSUFFICIENT_AVAILABILITY (quantity > available_units).
      A request for exactly available_units units is accepted (<=), one more unit is rejected.

  - name: item_reservation_conservation
    trigger: "After every request that creates an order line, cancels a line, retransmits a line, or ship-confirms a line"
    algorithm: aggregation
    formula: |
      order create      : item.reserved_units += line.quantity ; item.lifetime_reserved_units += line.quantity
      line -> CANCELLED_BY_VENDOR : item.reserved_units -= line.quantity ; item.lifetime_released_units += line.quantity
      line retransmit   : old_item.reserved_units -= line.quantity ; old_item.lifetime_released_units += line.quantity
                          new_item.reserved_units += line.quantity ; new_item.lifetime_reserved_units += line.quantity
      line -> SHIPPED   : item.reserved_units -= line.quantity ; item.lifetime_shipped_units += line.quantity

      INVARIANT (conserved quantity: physical units), MUST hold for every DropshipItem after every request:
        item.reserved_units
          == item.lifetime_reserved_units - item.lifetime_released_units - item.lifetime_shipped_units
    input_set: "Every DropshipItem row; the three lifetime counters are monotonically non-decreasing and are never reset."
    constants: {}
    precision: "integer units"
    note: "ReturnAuthorization transitions never touch any of these four counters, so a return can never introduce drift."

  - name: line_cost_and_order_margin
    trigger: "Unit stage on DropshipItem create/activate/PATCH; line stage on every transmission (POST /dropship/orders/{id}/transmit and POST /dropship/order-lines/{id}/retransmit); order stage on every line status or line cost change"
    algorithm: tiered_pricing
    formula: |
      # UNIT STAGE - the only place cents are rounded
      vendor = Vendor[item.vendor_id]
      if vendor.cost_model == COMMISSION:
          item.unit_cost_cents = round_half_up(item.unit_retail_cents * (10000 - vendor.commission_rate_bps) / 10000)
      else:  # WHOLESALE
          item.unit_cost_cents = round_half_up(item.unit_wholesale_cost_cents * (10000 - vendor.wholesale_discount_bps) / 10000)

      # LINE STAGE - pinned at each transmission, never re-read afterwards
      line.unit_cost_cents = item.unit_cost_cents as of the transmission instant
      line.surcharge_cents = matched_serviceability_rule.surcharge_cents

      # ORDER STAGE
      counted = DropshipOrderLine rows of the order with status != CANCELLED_BY_VENDOR
      order.total_retail_cents = sum over counted of (line.quantity * line.unit_retail_cents)
      order.total_cost_cents   = sum over counted of (line.quantity * line.unit_cost_cents + line.surcharge_cents)
      order.margin_cents       = order.total_retail_cents - order.total_cost_cents

      # PINNED ROUNDING ORDER (normative)
      # Cents are rounded exactly once, at the UNIT stage. The rounded unit cost is then multiplied by
      # quantity and the products are summed. The alternative order - multiply the unrounded unit cost
      # by quantity (or sum unrounded extended amounts) and round the total - is FORBIDDEN and yields a
      # different number: retail 1999 at 1500 bps commission over quantity 4 gives
      #   round-per-unit-then-multiply = round_half_up(1699.15) * 4 = 1699 * 4 = 6796
      #   multiply-then-round          = round_half_up(6796.60)     = 6797
      # The scaffold pins 6796.
    input_set: |
      Lines with status != CANCELLED_BY_VENDOR contribute to order totals. A line still in
      PENDING_TRANSMIT contributes unit_cost_cents = 0 and surcharge_cents = 0 (cost is unknown until
      the vendor and coverage row are pinned at transmission), so total_cost_cents is retail-only for
      an untransmitted order.
    constants: {}
    precision: "whole cents, round_half_up, applied once at the unit stage"
    variants:
      - name: commission_model
        when: "Vendor.cost_model == COMMISSION"
        difference: "Cost is derived from the customer-facing unit_retail_cents net of commission_rate_bps; unit_wholesale_cost_cents is ignored entirely."
      - name: wholesale_model
        when: "Vendor.cost_model == WHOLESALE"
        difference: "Cost is derived from item.unit_wholesale_cost_cents net of wholesale_discount_bps; unit_retail_cents does not enter the cost side at all, so margin moves independently of price changes."

  - name: line_sla_deadlines
    trigger: "On every transmission of a line (POST /dropship/orders/{id}/transmit, POST /dropship/order-lines/{id}/retransmit); breach flags refreshed on acknowledge, ship-confirm and every line read"
    algorithm: interval_merge
    formula: |
      vendor = Vendor[DropshipItem[line.item_id].vendor_id]
      item   = DropshipItem[line.item_id]
      line.ack_deadline_at  = line.transmitted_at + vendor.ack_sla_hours hours
      line.ship_deadline_at = line.transmitted_at + item.lead_time_days * 24 hours + vendor.ship_sla_grace_hours hours

      line.ack_sla_breached  = (line.acknowledged_at is non-null AND line.acknowledged_at > line.ack_deadline_at)
                               OR (line.status == TRANSMITTED AND clock > line.ack_deadline_at)
      line.ship_sla_breached = (line.shipped_at is non-null AND line.shipped_at > line.ship_deadline_at)

      # ShipmentConfirmation fields
      shipment.ship_hours = round_half_up((clock - line.transmitted_at) in hours, 2)
      shipment.on_time    = (clock <= line.ship_deadline_at)      # exactly at the deadline is ON TIME
    input_set: "Only the line's most recent transmission matters; a retransmit resets both deadlines and clears ack_sla_breached."
    constants: {}
    precision: "ship_hours to 2 decimal places, round_half_up; deadlines to whole seconds"

  - name: delivery_promise_date
    trigger: "QUOTED variant on POST /dropship/orders; RECOMPUTED variant on POST /dropship/orders/{id}/transmit and POST /dropship/order-lines/{id}/retransmit; both variants exposed side by side by GET /dropship/orders/{id}/promise"
    algorithm: forward_looking
    formula: |
      item   = DropshipItem[line.item_id]
      vendor = Vendor[item.vendor_id]
      order  = DropshipOrder[line.order_id]

      # coverage row selection (explicit filter + ranking + tie-break)
      rows = ServiceabilityRule with vendor_id == item.vendor_id AND status == ACTIVE
             AND zone_code == order.customer_zone_code AND ship_method == item.ship_method
      rule = the row in rows with the smallest transit_days; tie-break the smallest created_at.
             When rows is empty the promise is undefined and the calling transition raises
             ERR_ZONE_NOT_SERVICEABLE.

      anchor    = line.transmitted_at   for variant RECOMPUTED
                  order.placed_at       for variant QUOTED
      base_date = date_utc(anchor)
      rollover  = 1 when hour_utc(anchor) >= rule.cutoff_hour_utc else 0

      # variant-specific lead time and padding
      if variant == QUOTED:
          lead_days    = item.lead_time_days
          padding_days = vendor.promise_padding_days
      else:  # RECOMPUTED
          sc = the VendorScorecard of vendor with status == PUBLISHED having the greatest period_end;
               tie-break the greatest created_at; null when none is published
          lead_days    = max(1, ceil(sc.avg_ship_hours / 24)) when sc is non-null AND sc.avg_ship_hours is non-null
                         else item.lead_time_days
          padding_days = 0

      raw_date = base_date + rollover + lead_days + rule.transit_days + padding_days   # whole calendar days

      # blackout push: only the resulting date is pushed, one day at a time
      promise = raw_date
      while a VendorBlackout exists with vendor_id == item.vendor_id AND status == ACTIVE
            AND start_date <= promise <= end_date:
          promise = promise + 1 day
      line.line_promise_date = promise

      # order rollup
      order.quoted_promise_date     = max(line QUOTED promise)     over lines with status != CANCELLED_BY_VENDOR
      order.recomputed_promise_date = max(line RECOMPUTED promise) over lines with status != CANCELLED_BY_VENDOR
      order.promise_variant_in_effect = RECOMPUTED once any line of the order has been transmitted, else QUOTED

      # computed read exposed by GET /dropship/orders/{id}/promise
      promise_divergence_days = 0 when order.recomputed_promise_date is null
                                else (order.quoted_promise_date - order.recomputed_promise_date) in whole days
      # positive when the observed-performance promise beats the contracted one, negative when it is worse
    input_set: |
      Lines with status == CANCELLED_BY_VENDOR are excluded from both rollups. Only ACTIVE
      ServiceabilityRule rows and only ACTIVE VendorBlackout rows participate. Only PUBLISHED
      VendorScorecard rows feed the RECOMPUTED lead time; DRAFT scorecards are invisible here.
    constants:
      PROMISE_DEFAULT_PADDING_DAYS: 2
    precision: "whole calendar days, UTC dates, no partial days"
    variants:
      - name: QUOTED
        when: "Computed at order creation for the customer-facing promise, before any vendor has seen the order"
        difference: "Uses the item's CONTRACTED lead_time_days plus the vendor's tier-derived promise_padding_days. It is deliberately pessimistic: padding is largest for the worst tier."
      - name: RECOMPUTED
        when: "Computed at transmission and at every retransmission, once a real vendor and coverage row are pinned"
        difference: "Replaces contracted lead time with OBSERVED performance, ceil(avg_ship_hours/24) from the latest PUBLISHED scorecard, and drops padding to 0. For identical order data a GOLD vendor with avg_ship_hours 40.0, item lead_time_days 3, transit_days 4 and padding 1 yields QUOTED = placed_date + 8 days but RECOMPUTED = transmit_date + 6 days."

  - name: order_fulfillment_rollup
    trigger: "On every DropshipOrderLine status change (transmit, acknowledge, cancel, retransmit, ship-confirm) and on the vendor-suspension cascade"
    algorithm: aggregation
    formula: |
      lines         = all DropshipOrderLine rows with order_id == order.id
      open_set      = lines with status in {PENDING_TRANSMIT, TRANSMITTED, ACKNOWLEDGED, BACKORDERED}
      shipped_set   = lines with status == SHIPPED
      cancelled_set = lines with status == CANCELLED_BY_VENDOR

      if count(cancelled_set) == count(lines):        order.fulfillment_status = CANCELLED
      elif count(open_set) == 0 and count(shipped_set) > 0:  order.fulfillment_status = SHIPPED
      elif count(shipped_set) > 0 and count(open_set) > 0:   order.fulfillment_status = PARTIALLY_SHIPPED
      else:                                           order.fulfillment_status = OPEN
    input_set: "Every line of the order regardless of status; an order with zero shipped lines and at least one open line stays OPEN."
    constants: {}
    precision: "enum, no arithmetic"
    note: "Cancelled lines are excluded from the all-shipped test, so an order with one shipped and one cancelled line becomes SHIPPED, not PARTIALLY_SHIPPED."

  - name: return_routing_selection
    trigger: "POST /dropship/returns/{id}/authorize"
    algorithm: constraint_propagation
    formula: |
      line    = DropshipOrderLine[ra.line_id]
      L_item  = DropshipItem[line.item_id]

      # (a) candidate pool - explicit, id-free
      pool = { L_item } union ({ DropshipItem[L_item.fallback_item_id] } when L_item.fallback_item_id is non-null else {})
      pool = pool restricted to rows whose sku == L_item.sku

      # (b) eligibility filter - every clause must hold
      eligible = candidates C in pool such that
          Vendor[C.vendor_id].onboarding_status == ACTIVE
          AND no VendorBlackout exists with vendor_id == C.vendor_id AND status == ACTIVE
              AND start_date <= date_utc(clock) <= end_date
          AND ( latest_published_scorecard(C.vendor_id) is null
                OR latest_published_scorecard(C.vendor_id).defect_rate_bps is null
                OR latest_published_scorecard(C.vendor_id).defect_rate_bps <= DEFECT_ROUTING_MAX_DEFECT_RATE_BPS )

      # (c) ranking expression, ascending, first row wins
      #   1. latest_published_scorecard(C.vendor_id).defect_rate_bps ASC, null or absent treated as 10000
      #   2. C.unit_cost_cents ASC
      #   3. C.created_at ASC        <-- final tie-break; C.id is NEVER consulted
      winner = first row of eligible under that ordering

      # (d) outcome, including the empty-pool fallback
      if eligible is non-empty:
          ra.routing_destination  = VENDOR
          ra.routed_vendor_id     = winner.vendor_id
          ra.restock_disposition  = winner.restock_policy       # may be VENDOR_RESTOCK, RETAILER_RESTOCK or DESTROY
      else:
          ra.routing_destination  = RETAILER_DC
          ra.routed_vendor_id     = null
          ra.restock_disposition  = RETAILER_RESTOCK

      latest_published_scorecard(v) = the VendorScorecard with vendor_id == v AND status == PUBLISHED
                                      having the greatest period_end; tie-break the greatest created_at
    input_set: "At most two candidate offers - the line's current offer and its declared endless-aisle fallback - both restricted to the same sku. DRAFT scorecards never affect eligibility or ranking."
    constants:
      DEFECT_ROUTING_MAX_DEFECT_RATE_BPS: 1500
    precision: "enum selection, no arithmetic"

  - name: return_financials
    trigger: "POST /dropship/returns/{id}/authorize (and reversed verbatim by POST /dropship/returns/{id}/reject on an AUTHORIZED return)"
    algorithm: waterfall_allocation
    formula: |
      line = DropshipOrderLine[ra.line_id]
      item = DropshipItem[line.item_id]

      # EVALUATION ORDER IS NORMATIVE. The fee tier is keyed on the PRE-FEE base, never on refund_cents,
      # which is what makes the apparent circularity (refund depends on fee, fee tier depends on amount)
      # well defined. For refund_base_cents = 20500 the pinned answer is fee_rate_bps = 1000 and
      # refund_cents = 17155; keying the tier on the post-fee amount (17155) would give 500 bps and a
      # different refund, and is FORBIDDEN.
      step 1: ra.refund_base_cents = ra.quantity_returned * line.unit_retail_cents
      step 2: fee_rate_bps = 0    when ra.refund_base_cents < 5000
                             500  when 5000 <= ra.refund_base_cents < 20000
                             1000 when ra.refund_base_cents >= 20000
      step 3: ra.restocking_fee_cents = 0 when ra.reason_code in FEE_WAIVED_REASONS
                                        else round_half_up(ra.refund_base_cents * fee_rate_bps / 10000)
      step 4: ra.reverse_freight_owner = VENDOR when ra.reason_code in VENDOR_FREIGHT_REASONS
                                         else item.reverse_freight_owner
      step 5: ra.customer_freight_charge_cents = REVERSE_FREIGHT_FLAT_CENTS
                  when (ra.reverse_freight_owner == RETAILER AND ra.reason_code == BUYER_REMORSE) else 0
      step 6: ra.refund_cents = ra.refund_base_cents - ra.restocking_fee_cents - ra.customer_freight_charge_cents
      step 7: ra.vendor_chargeback_cents =
                  0 when ra.routing_destination == RETAILER_DC
                  else ra.quantity_returned * line.unit_cost_cents
                       + (REVERSE_FREIGHT_FLAT_CENTS when ra.reverse_freight_owner == VENDOR else 0)
    input_set: "Exactly one ReturnAuthorization row and the line/item it points at; line.unit_retail_cents and line.unit_cost_cents are the values frozen on the line, not the current item values."
    constants:
      REVERSE_FREIGHT_FLAT_CENTS: 1295
      FEE_WAIVED_REASONS: "{DEFECTIVE, NOT_AS_DESCRIBED, LATE_DELIVERY}"
      VENDOR_FREIGHT_REASONS: "{DEFECTIVE, NOT_AS_DESCRIBED}"
      RESTOCK_FEE_TIER_BPS: "{ base < 5000: 0, 5000 <= base < 20000: 500, base >= 20000: 1000 }"
    precision: "whole cents, round_half_up, single rounding at step 3"

  - name: vendor_settlement_ledger
    trigger: "Credit on POST /dropship/order-lines/{id}/ship-confirm; chargeback on POST /dropship/returns/{id}/authorize routed to VENDOR and on the vendor-cancellation cascade hop 4; reversal on POST /dropship/returns/{id}/reject from AUTHORIZED"
    algorithm: aggregation
    formula: |
      ship-confirm credit:
        vendor.settlement_balance_cents += line.unit_cost_cents * line.quantity + line.surcharge_cents

      chargeback posting (always a matched pair on the same vendor):
        vendor.chargeback_balance_cents += A
        vendor.settlement_balance_cents -= A
        where A = ra.vendor_chargeback_cents           for a return authorized to routing_destination VENDOR
              A = CANCELLATION_PENALTY_CENTS * (count of this order's lines whose current item belongs to
                  that vendor and whose status == CANCELLED_BY_VENDOR after the cascade)
                                                       for cascade hop 4 of a fully cancelled order

      reversal (reject an AUTHORIZED return): the exact pair posted by that return is undone -
        vendor.chargeback_balance_cents -= ra.vendor_chargeback_cents
        vendor.settlement_balance_cents += ra.vendor_chargeback_cents

      INVARIANT (conserved quantity: monetary cents), MUST hold for every Vendor after every request:
        vendor.settlement_balance_cents + vendor.chargeback_balance_cents
          == sum over every DropshipOrderLine L with L.status == SHIPPED
             AND DropshipItem[L.item_id].vendor_id == vendor.id
             of (L.unit_cost_cents * L.quantity + L.surcharge_cents)
    input_set: |
      Only SHIPPED lines enter the right-hand side, valued at the unit_cost_cents and surcharge_cents
      frozen on the line at its last transmission. Every chargeback is a matched debit/credit pair, so
      no posting or reversal can move the sum.
    constants:
      CANCELLATION_PENALTY_CENTS: 500
    precision: "whole cents, integer arithmetic only"

  - name: vendor_scorecard_metrics
    trigger: "POST /dropship/vendors/{id}/scorecards (computation) and POST /dropship/scorecards/{id}/publish (propagation of tier and promise_padding_days onto the Vendor)"
    algorithm: weighted_scoring
    formula: |
      # (a) population - source entity, explicit status filter, inclusive window, attribution rule
      population = DropshipOrderLine rows L such that
                     DropshipItem[L.item_id].vendor_id == scorecard.vendor_id
                     AND L.transmitted_at is non-null
                     AND scorecard.period_start <= date_utc(L.transmitted_at) <= scorecard.period_end
      # a retransmitted line is attributed to the vendor of its CURRENT item_id and to its LATEST transmitted_at
      shipped         = population with status == SHIPPED
      cancelled       = population with status == CANCELLED_BY_VENDOR
      on_time_shipped = shipped whose ShipmentConfirmation.on_time == true
      defect_returns  = ReturnAuthorization rows with status in {AUTHORIZED, RECEIVED}
                        AND reason_code in {DEFECTIVE, NOT_AS_DESCRIBED} AND line_id in shipped

      transmitted_line_count = count(population) ; shipped_line_count = count(shipped)
      cancelled_line_count   = count(cancelled)  ; defect_return_count = count(defect_returns)
      transmitted_unit_count = sum of L.quantity over population
      shipped_unit_count     = sum of L.quantity over shipped
      cancelled_unit_count   = sum of L.quantity over cancelled
      defect_unit_count      = sum of quantity_returned over defect_returns

      # (b) empty-population gate
      if transmitted_line_count == 0:
          if all four seeded_prior_* inputs are null:
              on_time_ship_rate_bps = cancellation_rate_bps = defect_rate_bps = null
              avg_ship_hours = null ; composite_score = null
              tier = UNRATED ; promise_padding_days = PROMISE_DEFAULT_PADDING_DAYS
              STOP
          else:
              on_time_ship_rate_bps = seeded_prior_on_time_ship_rate_bps, defaulting to 0     when omitted
              cancellation_rate_bps = seeded_prior_cancellation_rate_bps, defaulting to 10000 when omitted
              defect_rate_bps       = seeded_prior_defect_rate_bps,       defaulting to 10000 when omitted
              avg_ship_hours        = seeded_prior_avg_ship_hours,        defaulting to null   when omitted
              GOTO (d)
      else:
          all four seeded_prior_* inputs are IGNORED   # imported history never overrides live data
          GOTO (c)

      # (c) rate computation - two sanctioned variants
      if metric_variant == EVENT_EQUAL:
          on_time_ship_rate_bps = 0 when shipped_line_count == 0
                                  else round_half_up(10000 * count(on_time_shipped) / shipped_line_count)
          cancellation_rate_bps = round_half_up(10000 * cancelled_line_count / transmitted_line_count)
          defect_rate_bps       = 0 when shipped_line_count == 0
                                  else round_half_up(10000 * defect_return_count / shipped_line_count)
      else:  # UNIT_WEIGHTED
          on_time_ship_rate_bps = 0 when shipped_unit_count == 0
                                  else round_half_up(10000 * (sum of L.quantity over on_time_shipped) / shipped_unit_count)
          cancellation_rate_bps = round_half_up(10000 * cancelled_unit_count / transmitted_unit_count)
          defect_rate_bps       = 0 when shipped_unit_count == 0
                                  else round_half_up(10000 * defect_unit_count / shipped_unit_count)
      avg_ship_hours = null when shipped_line_count == 0
                       else round_half_up((sum of ShipmentConfirmation.ship_hours over shipped) / shipped_line_count, 2)

      # (d) composite, tier, padding
      composite_bps   = round_half_up(WEIGHT_ON_TIME * on_time_ship_rate_bps
                                      + WEIGHT_CANCEL * (10000 - cancellation_rate_bps)
                                      + WEIGHT_DEFECT * (10000 - defect_rate_bps), 0)
      composite_score = round_half_up(composite_bps / 100, 2)
      tier = UNRATED  when composite_score is null
             PLATINUM when composite_score >= 95
             GOLD     when composite_score >= 90
             SILVER   when composite_score >= 80
             WATCH    when composite_score >= 70
             PROBATION otherwise
      promise_padding_days = TIER_PADDING_DAYS[tier]

      # (e) publication propagation
      on publish: vendor.performance_tier = scorecard.tier
                  vendor.promise_padding_days = scorecard.promise_padding_days
                  and, when scorecard.tier == PROBATION and vendor.onboarding_status == ACTIVE,
                  the vendor is suspended with suspension_reason = SCORECARD_PROBATION
    input_set: |
      Lines are attributed by their CURRENT item_id and their LATEST transmitted_at, so a line
      retransmitted from vendor A to vendor B in the same period counts only against B. Only
      ReturnAuthorization rows in status AUTHORIZED or RECEIVED count as defects; REQUESTED and
      REJECTED rows do not. DRAFT scorecards never touch the Vendor row.
    constants:
      WEIGHT_ON_TIME: 0.50
      WEIGHT_CANCEL: 0.30
      WEIGHT_DEFECT: 0.20
      TIER_THRESHOLDS: "{ PLATINUM: 95, GOLD: 90, SILVER: 80, WATCH: 70 }"
      TIER_PADDING_DAYS: "{ UNRATED: 2, PLATINUM: 0, GOLD: 1, SILVER: 2, WATCH: 3, PROBATION: 5 }"
      PROMISE_DEFAULT_PADDING_DAYS: 2
    precision: "rates as integer basis points (round_half_up); composite_bps integer; composite_score 2 decimals; avg_ship_hours 2 decimals"
    variants:
      - name: EVENT_EQUAL
        when: "scorecard.metric_variant == EVENT_EQUAL (the default) - every order line counts once regardless of how many units it carries"
        difference: "Rates are counts over counts. One shipped line of 1 unit and one cancelled line of 9 units gives cancellation_rate_bps 5000 and composite_score 85.00 (tier SILVER)."
      - name: UNIT_WEIGHTED
        when: "scorecard.metric_variant == UNIT_WEIGHTED - each line is weighted by its quantity"
        difference: "Rates are unit sums over unit sums. The identical two lines give cancellation_rate_bps 9000 and composite_score 73.00 (tier WATCH) - a two-band tier swing on unchanged data."

  - name: retransmit_target_selection
    trigger: "POST /dropship/order-lines/{id}/retransmit"
    algorithm: topological
    formula: |
      line    = DropshipOrderLine[line_id]
      order   = DropshipOrder[line.order_id]
      L_item  = DropshipItem[line.item_id]

      # (a) candidate pool - the endless-aisle fallback chain walked from the current offer,
      #     following fallback_item_id at most MAX_FALLBACK_HOPS times, excluding L_item itself.
      #     A repeated item id terminates the walk (the chain is treated as a DAG; a cycle stops here).
      chain = [ L_item.fallback_item_id, then that item's fallback_item_id, ... ] up to MAX_FALLBACK_HOPS
              entries, stopping early at null or at an already-visited item
      pool  = chain entries, excluding L_item

      # (b) eligibility filter
      eligible = candidates C in pool such that
          C.sku == L_item.sku
          AND C.status == ACTIVE
          AND Vendor[C.vendor_id].onboarding_status == ACTIVE
          AND a ServiceabilityRule exists with vendor_id == C.vendor_id AND status == ACTIVE
              AND zone_code == order.customer_zone_code AND ship_method == C.ship_method
          AND no VendorBlackout exists with vendor_id == C.vendor_id AND status == ACTIVE
              AND start_date <= date_utc(clock) <= end_date
          AND C.inventory_is_stale == false
          AND C.available_units >= line.quantity

      # (c) ranking expression, ascending, first row wins
      #   1. matched ServiceabilityRule.transit_days ASC
      #   2. C.unit_cost_cents ASC
      #   3. C.created_at ASC        <-- final tie-break; C.id is NEVER consulted

      # (d) fallback when the candidate set is empty
      #   the request is rejected with ERR_NO_ELIGIBLE_FALLBACK_VENDOR (422) and the line
      #   stays BACKORDERED with no side effects at all
    input_set: "Only ACTIVE offers of the same sku reachable through the fallback chain, whose vendor is ACTIVE, unblacked-out, serviceable to the order's zone, with a fresh feed and enough availability for the whole line quantity. Partial sourcing is not supported."
    constants:
      MAX_FALLBACK_HOPS: 3
    precision: "enum/entity selection, no arithmetic"

# =============================================================================
# 1.4 Validation Rules Table (strictly ordered; lower priority number wins)
# =============================================================================
validations:

  # --- authentication / authorization (1-2) ---
  - priority: 1
    rule: "The X-User-Role header is present and holds one of PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser, CareAgent; when the role is VendorUser the X-User-ID header is also present"
    error_id: ERR_UNAUTHENTICATED
    category: authentication
    applies_to: "every endpoint"
  - priority: 2
    rule: "The caller's role appears in the endpoint's allowed_roles"
    error_id: ERR_UNAUTHORIZED
    category: authorization
    applies_to: "every endpoint"

  # --- existence (3-10), checked in URL order: outermost path segment first ---
  - priority: 3
    rule: "vendor_id in the path or body resolves to an existing Vendor"
    error_id: ERR_VENDOR_NOT_FOUND
    category: existence
    applies_to: "all /dropship/vendors/... endpoints; POST /dropship/items (vendor_id body field)"
  - priority: 4
    rule: "item_id in the path or body resolves to an existing DropshipItem"
    error_id: ERR_ITEM_NOT_FOUND
    category: existence
    applies_to: "all /dropship/items/... endpoints; POST /dropship/orders (line item_id); POST /dropship/order-lines/{id}/retransmit"
  - priority: 5
    rule: "order_id in the path resolves to an existing DropshipOrder"
    error_id: ERR_ORDER_NOT_FOUND
    category: existence
    applies_to: "GET /dropship/orders/{id}, GET /dropship/orders/{id}/promise, POST /dropship/orders/{id}/transmit"
  - priority: 6
    rule: "line_id in the path or body resolves to an existing DropshipOrderLine"
    error_id: ERR_LINE_NOT_FOUND
    category: existence
    applies_to: "all /dropship/order-lines/... endpoints; POST /dropship/returns (line_id body field)"
  - priority: 7
    rule: "return_id in the path resolves to an existing ReturnAuthorization"
    error_id: ERR_RETURN_NOT_FOUND
    category: existence
    applies_to: "GET /dropship/returns/{id}, POST /dropship/returns/{id}/authorize, /receive, /reject"
  - priority: 8
    rule: "scorecard_id in the path resolves to an existing VendorScorecard"
    error_id: ERR_SCORECARD_NOT_FOUND
    category: existence
    applies_to: "POST /dropship/scorecards/{id}/publish"
  - priority: 9
    rule: "test_id in the path resolves to an existing IntegrationTest"
    error_id: ERR_INTEGRATION_TEST_NOT_FOUND
    category: existence
    applies_to: "POST /dropship/integration-tests/{id}/evaluate"
  - priority: 10
    rule: "blackout_id in the path resolves to an existing VendorBlackout whose vendor_id equals the path vendor_id"
    error_id: ERR_BLACKOUT_NOT_FOUND
    category: existence
    applies_to: "DELETE /dropship/vendors/{id}/blackouts/{blackout_id}"

  # --- tenant/actor scoping (11) ---
  - priority: 11
    rule: "When the caller's role is VendorUser, every Vendor reached by the request (directly by path vendor_id, or transitively through item.vendor_id for an item/line/return) has id == X-User-ID"
    error_id: ERR_VENDOR_SCOPE_VIOLATION
    category: authorization_scope
    applies_to: "GET /dropship/vendors/{id}, GET /dropship/vendors/{id}/scorecards, GET /dropship/items/{id}, GET /dropship/order-lines/{id}, POST /dropship/order-lines/{id}/acknowledge, /ship-confirm, /cancel"

  # --- structural / syntactic (12-16) ---
  - priority: 12
    rule: "All required body fields are present, are of the declared type, fall inside declared numeric ranges (commission_rate_bps and wholesale_discount_bps in 0..10000, cutoff_hour_utc in 0..23, quantity >= 1, quantity_returned >= 1, inventory_refresh_cadence_minutes >= 1, safety_buffer_units >= 0, oversell_grace_units >= 0, lead_time_days >= 0, page limit in 1..200, offset >= 0), and every enum-typed field holds one of its declared values"
    error_id: ERR_INVALID_REQUEST
    category: structural
    applies_to: "every POST, PATCH and filtered GET"
  - priority: 13
    rule: "Interval endpoints are ordered: InventorySnapshot effective_to is null or strictly greater than effective_from; VendorBlackout end_date >= start_date; VendorScorecard period_end >= period_start"
    error_id: ERR_INVALID_INTERVAL
    category: structural
    applies_to: "POST /dropship/items/{id}/inventory-snapshots, POST /dropship/vendors/{id}/blackouts, POST /dropship/vendors/{id}/scorecards"
  - priority: 14
    rule: "The cost fields supplied match the vendor's cost_model: a COMMISSION vendor requires commission_rate_bps and rejects wholesale_discount_bps; a WHOLESALE vendor requires wholesale_discount_bps and rejects commission_rate_bps. On POST /dropship/items, a COMMISSION vendor's item requires unit_retail_cents only and rejects unit_wholesale_cost_cents, while a WHOLESALE vendor's item requires both"
    error_id: ERR_COST_MODEL_FIELD_MISMATCH
    category: structural_conditional
    applies_to: "POST /dropship/vendors, POST /dropship/items, PATCH /dropship/items/{id}"
  - priority: 15
    rule: "vendor_code is unique across all Vendor rows"
    error_id: ERR_DUPLICATE_VENDOR_CODE
    category: uniqueness
    applies_to: "POST /dropship/vendors"
  - priority: 16
    rule: "order_ref is unique across all DropshipOrder rows"
    error_id: ERR_DUPLICATE_ORDER_REF
    category: uniqueness
    applies_to: "POST /dropship/orders"

  # --- optimistic concurrency (17-18) ---
  - priority: 17
    rule: "expected_item_version equals the current DropshipItem.version"
    error_id: ERR_STALE_ITEM_VERSION
    category: concurrency
    applies_to: "POST /dropship/items/{id}/inventory-snapshots"
  - priority: 18
    rule: "expected_vendor_version equals the current Vendor.version of the scorecard's vendor"
    error_id: ERR_STALE_VENDOR_VERSION
    category: concurrency
    applies_to: "POST /dropship/scorecards/{id}/publish"

  # --- own-entity state (19-25) ---
  - priority: 19
    rule: "The Vendor's onboarding_status permits the requested transition (begin-integration from DRAFT or INTEGRATION_TESTING; certify from INTEGRATION_TESTING; activate from CERTIFIED; suspend from ACTIVE; reinstate from SUSPENDED)"
    error_id: ERR_VENDOR_INVALID_STATE
    category: state
    applies_to: "POST /dropship/vendors/{id}/begin-integration, /certify, /activate, /suspend, /reinstate"
  - priority: 20
    rule: "The DropshipItem's status permits the requested transition (activate from DRAFT or SUPPRESSED; suppress from ACTIVE; PATCH only from DRAFT or SUPPRESSED) and a suppressed item may only be restored by the actor class that owns its suppression_reason"
    error_id: ERR_ITEM_INVALID_STATE
    category: state
    applies_to: "POST /dropship/items/{id}/activate, /suppress, PATCH /dropship/items/{id}"
  - priority: 21
    rule: "Every item referenced by a new order line is orderable: item.status == ACTIVE"
    error_id: ERR_ITEM_NOT_ORDERABLE
    category: state
    applies_to: "POST /dropship/orders"
  - priority: 22
    rule: "The DropshipOrderLine's status permits the requested transition (acknowledge from TRANSMITTED; ship-confirm from ACKNOWLEDGED; cancel from TRANSMITTED, ACKNOWLEDGED or BACKORDERED; retransmit from BACKORDERED; transmit only when the order has at least one PENDING_TRANSMIT line)"
    error_id: ERR_LINE_INVALID_STATE
    category: state
    applies_to: "POST /dropship/orders/{id}/transmit, POST /dropship/order-lines/{id}/acknowledge, /ship-confirm, /cancel, /retransmit; POST /dropship/returns and POST /dropship/returns/{id}/authorize (the line must be SHIPPED)"
  - priority: 23
    rule: "The ReturnAuthorization's status permits the requested transition (authorize from REQUESTED; receive from AUTHORIZED; reject from REQUESTED or AUTHORIZED)"
    error_id: ERR_RETURN_INVALID_STATE
    category: state
    applies_to: "POST /dropship/returns/{id}/authorize, /receive, /reject"
  - priority: 24
    rule: "The VendorScorecard's status is DRAFT"
    error_id: ERR_SCORECARD_INVALID_STATE
    category: state
    applies_to: "POST /dropship/scorecards/{id}/publish"
  - priority: 25
    rule: "The IntegrationTest's status is PENDING and its round_number equals the vendor's current integration_round"
    error_id: ERR_INTEGRATION_TEST_INVALID_STATE
    category: state
    applies_to: "POST /dropship/integration-tests/{id}/evaluate"

  # --- cross-entity state guards (26-28) ---
  - priority: 26
    rule: "The Vendor that owns the target row is in onboarding_status ACTIVE: item activation, order-line acknowledge, ship-confirm and retransmit all require an ACTIVE vendor; POST /dropship/items requires a vendor in CERTIFIED or ACTIVE"
    error_id: ERR_VENDOR_NOT_ACTIVE
    category: cross_entity_state
    applies_to: "POST /dropship/items, POST /dropship/items/{id}/activate, POST /dropship/order-lines/{id}/acknowledge, /ship-confirm, /retransmit"
  - priority: 27
    rule: "The X-User-ID activating a vendor differs from the vendor's certified_by_user_id, and the X-User-ID evaluating an IntegrationTest differs from the X-User-ID that created that IntegrationTest"
    error_id: ERR_SEGREGATION_OF_DUTIES
    category: business_safety
    applies_to: "POST /dropship/vendors/{id}/activate, POST /dropship/integration-tests/{id}/evaluate"
  - priority: 28
    rule: "The Vendor has at least one PASSED IntegrationTest for each of the four message_type values CATALOG, INVENTORY, ORDER and SHIP_CONFIRM, all at the vendor's current integration_round"
    error_id: ERR_INTEGRATION_INCOMPLETE
    category: business_referential
    applies_to: "POST /dropship/vendors/{id}/certify"

  # --- coverage / referential business rules (29-32) ---
  - priority: 29
    rule: "The Vendor has at least one ServiceabilityRule with status ACTIVE; for item activation that rule must additionally match the item's ship_method"
    error_id: ERR_NO_SERVICEABILITY_COVERAGE
    category: business_referential
    applies_to: "POST /dropship/vendors/{id}/activate, POST /dropship/items/{id}/activate"
  - priority: 30
    rule: "When fallback_item_id is supplied it resolves to an existing DropshipItem with the same sku, a different vendor_id, and it is not the item itself"
    error_id: ERR_FALLBACK_INVALID
    category: business_referential
    applies_to: "POST /dropship/items, PATCH /dropship/items/{id}"
  - priority: 31
    rule: "For every requested order line an ACTIVE ServiceabilityRule exists for the item's vendor matching the order's customer_zone_code and the item's ship_method"
    error_id: ERR_ZONE_NOT_SERVICEABLE
    category: business_referential
    applies_to: "POST /dropship/orders, POST /dropship/orders/{id}/transmit"
  - priority: 32
    rule: "No ACTIVE VendorBlackout of the item's vendor covers the current logical date (start_date <= date_utc(clock) <= end_date)"
    error_id: ERR_VENDOR_BLACKOUT
    category: cross_entity_state
    applies_to: "POST /dropship/orders/{id}/transmit, POST /dropship/order-lines/{id}/retransmit"

  # --- temporal window rules (33-35) ---
  - priority: 33
    rule: "A new InventorySnapshot's half-open window [effective_from, effective_to) does not overlap the window of any ACTIVE snapshot of the same item; adjacency, where one window's effective_to equals the next window's effective_from, is permitted"
    error_id: ERR_SNAPSHOT_WINDOW_OVERLAP
    category: business_temporal
    applies_to: "POST /dropship/items/{id}/inventory-snapshots"
  - priority: 34
    rule: "A new VendorBlackout's fully-closed interval [start_date, end_date] neither overlaps nor sits within reopen_buffer_days of any ACTIVE blackout of the same vendor; the new start_date must exceed an earlier blackout's end_date by more than that blackout's reopen_buffer_days, and touching intervals are rejected"
    error_id: ERR_BLACKOUT_WINDOW_CONFLICT
    category: business_temporal
    applies_to: "POST /dropship/vendors/{id}/blackouts"
  - priority: 35
    rule: "The return request arrives inside the defect window: date_utc(clock) <= date_utc(line.shipped_at) + item.defect_window_days; the last day of the window is inclusive"
    error_id: ERR_OUTSIDE_DEFECT_WINDOW
    category: business_temporal
    applies_to: "POST /dropship/returns, POST /dropship/returns/{id}/authorize"

  # --- quantity and fiscal rules (36-39) ---
  - priority: 36
    rule: "quantity_returned plus line.returned_units does not exceed the line's shipped quantity"
    error_id: ERR_RETURN_QUANTITY_EXCEEDS_SHIPPED
    category: business_fiscal
    applies_to: "POST /dropship/returns"
  - priority: 37
    rule: "The item's inventory feed is fresh: item.inventory_is_stale == false"
    error_id: ERR_INVENTORY_STALE
    category: business_fiscal
    applies_to: "POST /dropship/orders"
  - priority: 38
    rule: "Each requested quantity is at most the item's available_units (effective on-hand net of safety buffer, plus oversell grace, net of existing reservations)"
    error_id: ERR_INSUFFICIENT_AVAILABILITY
    category: business_fiscal
    applies_to: "POST /dropship/orders"
  - priority: 39
    rule: "The retransmit_target_selection candidate set is non-empty after filtering"
    error_id: ERR_NO_ELIGIBLE_FALLBACK_VENDOR
    category: business_fiscal
    applies_to: "POST /dropship/order-lines/{id}/retransmit"

# =============================================================================
# 1.5 API Endpoint Table   (every path is prefixed by api_prefix "/dropship")
# =============================================================================
endpoints:

  # --------------------------- Vendor onboarding ---------------------------
  - method: POST
    path: "/dropship/vendors"
    description: "Register a dropship vendor in DRAFT. The cost model is fixed here and decides which rate field is required and which is rejected."
    roles: [PlatformAdmin, VendorOpsAnalyst]
    code: 201
    input: ["vendor_code", "legal_name", "cost_model", "commission_rate_bps?", "wholesale_discount_bps?", "inventory_refresh_cadence_minutes?", "safety_buffer_units?", "oversell_grace_units?", "default_lead_time_days?", "ack_sla_hours?", "ship_sla_grace_hours?", "promise_padding_days?"]
    output: Vendor
    side_effects:
      - "onboarding_status = DRAFT; integration_round = 0; performance_tier = UNRATED"
      - "promise_padding_days defaults to PROMISE_DEFAULT_PADDING_DAYS (2); settlement_balance_cents = 0; chargeback_balance_cents = 0"

  - method: GET
    path: "/dropship/vendors/{id}"
    description: "Read one vendor, including onboarding_status, performance_tier, promise_padding_days and both ledger balances."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser, CareAgent]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: POST
    path: "/dropship/vendors/{id}/begin-integration"
    description: "Open an integration round. From DRAFT it opens round 1; from INTEGRATION_TESTING it opens the next round and requires at least one FAILED test in the current round."
    roles: [VendorOpsAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "onboarding_status = INTEGRATION_TESTING; integration_round advanced per the Vendor state machine"
      - "increments Vendor.version by 1"

  - method: POST
    path: "/dropship/vendors/{id}/integration-tests"
    description: "Record an integration test run for one message type at the vendor's current integration_round."
    roles: [VendorOpsAnalyst, PlatformAdmin]
    code: 201
    input: [message_type, sample_payload_digest]
    output: IntegrationTest
    side_effects:
      - "status = PENDING; round_number = vendor.integration_round"
      - "created_by user identity is retained so the evaluator segregation-of-duties check has something to compare against"

  - method: GET
    path: "/dropship/vendors/{id}/integration-tests"
    description: "List the vendor's integration test runs (FK reverse-reachability for IntegrationTest.vendor_id)."
    roles: [PlatformAdmin, VendorOpsAnalyst, VendorUser]
    code: 200
    input: ["message_type?", "status?", "round_number?", "limit?", "offset?"]
    output: IntegrationTest[]
    side_effects: []

  - method: POST
    path: "/dropship/integration-tests/{id}/evaluate"
    description: "Pass or fail a PENDING integration test. The evaluator must not be the user who recorded the run."
    roles: [VendorOpsAnalyst, PlatformAdmin]
    code: 200
    input: ["outcome", "reported_error_count?", "defect_notes?"]
    output: IntegrationTest
    side_effects:
      - "status = PASSED when outcome == PASS, FAILED when outcome == FAIL"
      - "evaluated_by_user_id = X-User-ID; evaluated_at = logical clock"
      - "increments IntegrationTest.version by 1"

  - method: POST
    path: "/dropship/vendors/{id}/certify"
    description: "Certify the vendor once all four message types have a PASSED test in the current round."
    roles: [VendorOpsAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "onboarding_status = CERTIFIED; certified_by_user_id = X-User-ID"
      - "increments Vendor.version by 1"

  - method: POST
    path: "/dropship/vendors/{id}/activate"
    description: "Activate a CERTIFIED vendor. Segregation of duties: the activating X-User-ID must differ from certified_by_user_id, and the vendor needs live geographic coverage."
    roles: [MerchandiseManager, PlatformAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "onboarding_status = ACTIVE; activated_by_user_id = X-User-ID"
      - "increments Vendor.version by 1"

  - method: POST
    path: "/dropship/vendors/{id}/suspend"
    description: "Suspend an ACTIVE vendor and run the four-hop suspension cascade over its coverage rows, offers, untransmitted lines and their orders."
    roles: [MerchandiseManager, PlatformAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "onboarding_status = SUSPENDED; suspension_reason = MANUAL_OPS"
      - "cascade hop 1: ACTIVE ServiceabilityRule rows -> INACTIVE with inactivated_by_suspension = true"
      - "cascade hop 2: ACTIVE DropshipItem rows -> SUPPRESSED with suppression_reason = VENDOR_SUSPENDED, available_units = 0"
      - "cascade hop 3: PENDING_TRANSMIT lines on those offers -> BACKORDERED"
      - "cascade hop 4: owning orders have fulfillment_status re-derived by calculations.order_fulfillment_rollup"
      - "increments Vendor.version by 1"

  - method: POST
    path: "/dropship/vendors/{id}/reinstate"
    description: "Return a SUSPENDED vendor to ACTIVE, restoring the coverage rows and offers the suspension took down. A probation suspension requires a newer non-PROBATION published scorecard first."
    roles: [MerchandiseManager, PlatformAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "onboarding_status = ACTIVE; suspension_reason = null"
      - "ServiceabilityRule rows with inactivated_by_suspension == true -> ACTIVE with the flag cleared"
      - "DropshipItem rows suppressed with reason VENDOR_SUSPENDED -> ACTIVE with suppression_reason = null and available_units recomputed"
      - "lines pushed to BACKORDERED by the suspension are NOT restored"
      - "increments Vendor.version by 1"

  # --------------------- Serviceability and blackouts ---------------------
  - method: POST
    path: "/dropship/vendors/{id}/serviceability-rules"
    description: "Declare geographic serviceability for the vendor: one zone / ship-method pair with transit days, a hand-off cutoff hour and an optional surcharge."
    roles: [MerchandiseManager, PlatformAdmin]
    code: 201
    input: ["zone_code", "ship_method", "transit_days", "cutoff_hour_utc", "surcharge_cents?"]
    output: ServiceabilityRule
    side_effects:
      - "status = ACTIVE; inactivated_by_suspension = false"

  - method: GET
    path: "/dropship/vendors/{id}/serviceability-rules"
    description: "List the vendor's coverage rows (FK reverse-reachability for ServiceabilityRule.vendor_id)."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser]
    code: 200
    input: ["zone_code?", "ship_method?", "status?", "limit?", "offset?"]
    output: ServiceabilityRule[]
    side_effects: []

  - method: POST
    path: "/dropship/vendors/{id}/blackouts"
    description: "Declare a fully-closed date interval during which the vendor accepts no hand-offs. A new interval must clear every existing ACTIVE interval by more than that interval's reopen_buffer_days."
    roles: [PlatformAdmin, VendorOpsAnalyst]
    code: 201
    input: ["start_date", "end_date", "reason", "reopen_buffer_days?"]
    output: VendorBlackout
    side_effects:
      - "status = ACTIVE; reopen_buffer_days defaults to 1"

  - method: GET
    path: "/dropship/vendors/{id}/blackouts"
    description: "List the vendor's blackout windows (FK reverse-reachability for VendorBlackout.vendor_id)."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VendorBlackout[]
    side_effects: []

  - method: DELETE
    path: "/dropship/vendors/{id}/blackouts/{blackout_id}"
    description: "Cancel a blackout window. The row is retained in status CANCELLED so it stops constraining transmission and promise dates without vanishing from the audit trail."
    roles: [PlatformAdmin, VendorOpsAnalyst]
    code: 200
    input: []
    output: VendorBlackout
    side_effects:
      - "status = CANCELLED; the window no longer blocks transmission, retransmission or promise dates"

  # ---------------------------- Item setup ----------------------------
  - method: POST
    path: "/dropship/items"
    description: "Create a vendor offer for a sku in DRAFT, with lead time, ship method, reverse-freight ownership, restock policy and an optional endless-aisle fallback offer at another vendor."
    roles: [MerchandiseManager, PlatformAdmin]
    code: 201
    input: ["vendor_id", "sku", "unit_retail_cents", "ship_method", "lead_time_days?", "unit_wholesale_cost_cents?", "fallback_item_id?", "reverse_freight_owner?", "restock_policy?", "defect_window_days?"]
    output: DropshipItem
    side_effects:
      - "status = DRAFT; lead_time_days defaults to the vendor's default_lead_time_days"
      - "unit_cost_cents derived by calculations.line_cost_and_order_margin (unit stage) from the vendor's cost_model"
      - "reserved_units = 0; effective_on_hand_units = 0; available_units = 0; inventory_is_stale = true; all three lifetime counters = 0"

  - method: GET
    path: "/dropship/items/{id}"
    description: "Read one vendor offer including its live availability view (effective_on_hand_units, inventory_is_stale, reserved_units, available_units) and its reservation lifetime counters."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser, CareAgent]
    code: 200
    input: []
    output: DropshipItem
    side_effects:
      - "effective_on_hand_units, inventory_is_stale and available_units are re-derived on read by calculations.available_to_promise_units so staleness reflects the current logical clock"

  - method: GET
    path: "/dropship/items"
    description: "List vendor offers with filtering and pagination (FK reverse-reachability for DropshipItem.vendor_id and DropshipItem.fallback_item_id)."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, CareAgent]
    code: 200
    input: ["vendor_id?", "fallback_item_id?", "status?", "sku?", "limit?", "offset?"]
    output: DropshipItem[]
    side_effects: []

  - method: PATCH
    path: "/dropship/items/{id}"
    description: "Amend a DRAFT or SUPPRESSED offer's commercial terms. An ACTIVE offer is immutable so that transmitted lines cannot have their basis moved underneath them."
    roles: [MerchandiseManager, PlatformAdmin]
    code: 200
    input: ["lead_time_days?", "unit_retail_cents?", "unit_wholesale_cost_cents?", "ship_method?", "fallback_item_id?", "reverse_freight_owner?", "restock_policy?", "defect_window_days?"]
    output: DropshipItem
    side_effects:
      - "unit_cost_cents re-derived by calculations.line_cost_and_order_margin (unit stage)"
      - "increments DropshipItem.version by 1"

  - method: POST
    path: "/dropship/items/{id}/activate"
    description: "Make the offer orderable. Requires an ACTIVE vendor and an ACTIVE coverage row matching the offer's ship_method."
    roles: [MerchandiseManager, PlatformAdmin]
    code: 200
    input: []
    output: DropshipItem
    side_effects:
      - "status = ACTIVE; suppression_reason = null"
      - "unit_cost_cents, effective_on_hand_units, inventory_is_stale and available_units recomputed"
      - "increments DropshipItem.version by 1"

  - method: POST
    path: "/dropship/items/{id}/suppress"
    description: "Manually take an ACTIVE offer off the endless aisle."
    roles: [MerchandiseManager, PlatformAdmin]
    code: 200
    input: []
    output: DropshipItem
    side_effects:
      - "status = SUPPRESSED; suppression_reason = MANUAL; available_units = 0"
      - "increments DropshipItem.version by 1"

  - method: POST
    path: "/dropship/items/{id}/inventory-snapshots"
    description: "Post a vendor inventory feed message for the offer over a half-open window. Optimistically concurrent on the offer via expected_item_version."
    roles: [VendorUser, VendorOpsAnalyst, PlatformAdmin]
    code: 201
    input: ["on_hand_units", "effective_from", "feed_sequence", "expected_item_version", "effective_to?", "source?"]
    output: InventorySnapshot
    side_effects:
      - "status = ACTIVE; any ACTIVE snapshot of the same item whose window is strictly earlier and open-ended is set to SUPERSEDED with its effective_to closed at the new effective_from"
      - "item.last_inventory_refresh_at = logical clock"
      - "item.effective_on_hand_units, item.inventory_is_stale and item.available_units re-derived by calculations.available_to_promise_units"
      - "auto-suppression: an ACTIVE offer whose recompute yields available_units == 0 AND effective_on_hand_units == 0 becomes SUPPRESSED with suppression_reason = ZERO_AVAILABILITY; a ZERO_AVAILABILITY offer whose recompute yields available_units > 0 returns to ACTIVE"
      - "increments DropshipItem.version by 1"

  - method: GET
    path: "/dropship/items/{id}/inventory-snapshots"
    description: "List the offer's feed messages (FK reverse-reachability for InventorySnapshot.item_id)."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser]
    code: 200
    input: ["status?", "source?", "limit?", "offset?"]
    output: InventorySnapshot[]
    side_effects: []

  # ------------------------------ Orders ------------------------------
  - method: POST
    path: "/dropship/orders"
    description: "Place a customer order against one or more vendor offers. Each requested line reserves units, freezes the retail price and receives a customer-facing QUOTED delivery promise."
    roles: [CareAgent, PlatformAdmin, MerchandiseManager]
    code: 201
    input: [order_ref, customer_zone_code, lines]
    output: DropshipOrder
    side_effects:
      - "one DropshipOrderLine per requested line, status PENDING_TRANSMIT, line_number assigned in request order starting at 1, unit_retail_cents frozen from the item"
      - "item.reserved_units += quantity and item.lifetime_reserved_units += quantity for each line; item.available_units recomputed"
      - "placed_at = logical clock; fulfillment_status = OPEN; financial_status = PENDING"
      - "quoted_promise_date and each line_promise_date set by calculations.delivery_promise_date variant QUOTED; promise_variant_in_effect = QUOTED"
      - "total_retail_cents, total_cost_cents and margin_cents set by calculations.line_cost_and_order_margin (order stage); refunded_cents = 0; net_retail_cents = total_retail_cents; retailer_absorbed_cents = 0"

  - method: GET
    path: "/dropship/orders/{id}"
    description: "Read one order with both state dimensions, both promise dates and the full money view."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, CareAgent]
    code: 200
    input: []
    output: DropshipOrder
    side_effects: []

  - method: GET
    path: "/dropship/orders/{id}/promise"
    description: "Computed read that returns the customer-facing promise under both variants side by side plus their divergence in whole days."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, CareAgent]
    code: 200
    input: []
    output: "{ order_id: string, quoted_promise_date: date, recomputed_promise_date: date, promise_variant_in_effect: string, promise_divergence_days: integer }"
    side_effects: []

  - method: POST
    path: "/dropship/orders/{id}/transmit"
    description: "Transmit every PENDING_TRANSMIT line of the order to its vendor, pinning cost, surcharge, SLA deadlines and the RECOMPUTED promise from vendor performance history."
    roles: [PlatformAdmin, MerchandiseManager]
    code: 200
    input: []
    output: DropshipOrder
    side_effects:
      - "each PENDING_TRANSMIT line -> TRANSMITTED with transmitted_at = logical clock and transmit_attempt_count += 1"
      - "line.unit_cost_cents and line.surcharge_cents pinned by calculations.line_cost_and_order_margin (line stage)"
      - "line.ack_deadline_at and line.ship_deadline_at pinned by calculations.line_sla_deadlines"
      - "line.line_promise_date and order.recomputed_promise_date set by calculations.delivery_promise_date variant RECOMPUTED; promise_variant_in_effect = RECOMPUTED"
      - "order totals re-derived; increments DropshipOrder.version by 1"

  # ---------------------------- Order lines ----------------------------
  - method: GET
    path: "/dropship/order-lines/{id}"
    description: "Read one order line with its frozen price and cost, SLA deadlines, breach flags and line-level promise date."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser, CareAgent]
    code: 200
    input: []
    output: DropshipOrderLine
    side_effects:
      - "ack_sla_breached is re-derived on read against the current logical clock for a line still in TRANSMITTED"

  - method: GET
    path: "/dropship/order-lines"
    description: "List order lines with filtering and pagination (FK reverse-reachability for DropshipOrderLine.order_id and DropshipOrderLine.item_id)."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser, CareAgent]
    code: 200
    input: ["order_id?", "item_id?", "status?", "limit?", "offset?"]
    output: DropshipOrderLine[]
    side_effects: []

  - method: POST
    path: "/dropship/order-lines/{id}/acknowledge"
    description: "Vendor acknowledgment of a transmitted line. ack_disposition forks the line to ACKNOWLEDGED, BACKORDERED or CANCELLED_BY_VENDOR."
    roles: [VendorUser, PlatformAdmin]
    code: 200
    input: [ack_disposition]
    output: DropshipOrderLine
    side_effects:
      - "acknowledged_at = logical clock; ack_sla_breached = (acknowledged_at > ack_deadline_at)"
      - "ACCEPTED -> status ACKNOWLEDGED; BACKORDERED -> status BACKORDERED with the reservation retained; REJECTED -> status CANCELLED_BY_VENDOR and the full four-hop cancellation cascade runs"

  - method: POST
    path: "/dropship/order-lines/{id}/ship-confirm"
    description: "Vendor shipment confirmation for an ACKNOWLEDGED line. Creates the immutable ShipmentConfirmation record carrying ship_hours and the on_time verdict."
    roles: [VendorUser, PlatformAdmin]
    code: 201
    input: ["carrier", "tracking_number", "shipped_units", "package_count?"]
    output: ShipmentConfirmation
    side_effects:
      - "ShipmentConfirmation created with ship_date = date of the logical clock, ship_hours and on_time computed by calculations.line_sla_deadlines"
      - "line.status = SHIPPED; line.shipped_at = logical clock; line.ship_sla_breached = (shipped_at > ship_deadline_at)"
      - "item.reserved_units -= quantity; item.lifetime_shipped_units += quantity; item.available_units recomputed"
      - "vendor.settlement_balance_cents += line.unit_cost_cents * line.quantity + line.surcharge_cents"
      - "order.fulfillment_status re-derived; order.financial_status PENDING -> CAPTURED"
      - "increments DropshipItem.version by 1 and DropshipOrder.version by 1"

  - method: POST
    path: "/dropship/order-lines/{id}/cancel"
    description: "Vendor cancellation of an open line, running the four-hop cascade down to the vendor cancellation penalty."
    roles: [VendorUser, PlatformAdmin]
    code: 200
    input: []
    output: DropshipOrderLine
    side_effects:
      - "cascade hop 1: line.status = CANCELLED_BY_VENDOR; item.reserved_units -= quantity; item.lifetime_released_units += quantity"
      - "cascade hop 2: order totals and fulfillment_status re-derived"
      - "cascade hop 3: a fully cancelled order moves financial_status PENDING -> REFUNDED with refunded_cents = 0 and net_retail_cents = 0"
      - "cascade hop 4: CANCELLATION_PENALTY_CENTS per cancelled line of that vendor is posted as a matched pair on the vendor's ledger"
      - "increments DropshipItem.version by 1 and DropshipOrder.version by 1"

  - method: POST
    path: "/dropship/order-lines/{id}/retransmit"
    description: "Re-source a BACKORDERED line onto an eligible endless-aisle fallback offer selected by calculations.retransmit_target_selection, closing the TRANSMITTED -> BACKORDERED -> TRANSMITTED cycle."
    roles: [PlatformAdmin, MerchandiseManager]
    code: 200
    input: []
    output: DropshipOrderLine
    side_effects:
      - "the reservation moves from the old offer to the selected offer, updating reserved_units and the lifetime counters on both"
      - "line.item_id = selected offer; acknowledged_at = null; ack_sla_breached = false; status = TRANSMITTED"
      - "transmitted_at = logical clock; transmit_attempt_count += 1; cost, surcharge, both deadlines and the RECOMPUTED promise re-pinned against the new vendor"
      - "unit_retail_cents is NOT changed; order totals and recomputed_promise_date re-derived"
      - "increments DropshipOrder.version by 1"

  - method: GET
    path: "/dropship/order-lines/{id}/shipment-confirmations"
    description: "List the line's shipment confirmations (FK reverse-reachability for ShipmentConfirmation.line_id; length 0 or 1)."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser, CareAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: ShipmentConfirmation[]
    side_effects: []

  # ------------------------------ Returns ------------------------------
  - method: POST
    path: "/dropship/returns"
    description: "Open a return request against a shipped line inside its defect window."
    roles: [CareAgent, PlatformAdmin]
    code: 201
    input: [line_id, reason_code, quantity_returned]
    output: ReturnAuthorization
    side_effects:
      - "status = REQUESTED; routing_destination, routed_vendor_id, restock_disposition and every money field stay null or 0 until authorization"

  - method: GET
    path: "/dropship/returns/{id}"
    description: "Read one return authorization with its routing decision, reverse-freight ownership and the full refund waterfall."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser, CareAgent]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []

  - method: GET
    path: "/dropship/returns"
    description: "List return authorizations with filtering and pagination (FK reverse-reachability for ReturnAuthorization.line_id and ReturnAuthorization.routed_vendor_id)."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser, CareAgent]
    code: 200
    input: ["line_id?", "routed_vendor_id?", "status?", "reason_code?", "limit?", "offset?"]
    output: ReturnAuthorization[]
    side_effects: []

  - method: POST
    path: "/dropship/returns/{id}/authorize"
    description: "Authorize the return: route it to a vendor or to the retailer DC, assign reverse-freight ownership and restocking, and run the refund waterfall."
    roles: [CareAgent, MerchandiseManager, PlatformAdmin]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects:
      - "status = AUTHORIZED; routing_destination, routed_vendor_id and restock_disposition set by calculations.return_routing_selection"
      - "refund_base_cents, restocking_fee_cents, reverse_freight_owner, customer_freight_charge_cents, refund_cents and vendor_chargeback_cents set by calculations.return_financials"
      - "line.returned_units += quantity_returned"
      - "order.refunded_cents += refund_cents; order.net_retail_cents re-derived; order.financial_status re-derived"
      - "VENDOR branch: a matched chargeback pair is posted on the routed vendor's ledger; RETAILER_DC branch: order.retailer_absorbed_cents += REVERSE_FREIGHT_FLAT_CENTS instead"
      - "increments DropshipOrder.version by 1"

  - method: POST
    path: "/dropship/returns/{id}/receive"
    description: "Record physical receipt of an authorized return at its routed destination and settle restocking."
    roles: [VendorUser, PlatformAdmin, CareAgent]
    code: 200
    input: ["restocked_units?"]
    output: ReturnAuthorization
    side_effects:
      - "status = RECEIVED; restocked_units = quantity_returned when restock_disposition is VENDOR_RESTOCK or RETAILER_RESTOCK, else 0"
      - "no reservation counter and no ledger balance moves"

  - method: POST
    path: "/dropship/returns/{id}/reject"
    description: "Reject a return. From REQUESTED nothing is reversed because nothing was posted; from AUTHORIZED every side effect of the authorization is compensated exactly."
    roles: [MerchandiseManager, PlatformAdmin]
    code: 200
    input: [rejection_reason]
    output: ReturnAuthorization
    side_effects:
      - "status = REJECTED; rejection_reason recorded"
      - "from AUTHORIZED only: line.returned_units, order.refunded_cents, order.net_retail_cents, order.financial_status, the vendor ledger pair and order.retailer_absorbed_cents are all restored to their pre-authorization values"
      - "increments DropshipOrder.version by 1 when compensation runs"

  # --------------------------- Scorecards ---------------------------
  - method: POST
    path: "/dropship/vendors/{id}/scorecards"
    description: "Compute a DRAFT scorecard for the vendor over an inclusive date period. The seeded_prior_* inputs are honored only when the period contains zero transmitted lines; otherwise they are ignored."
    roles: [VendorOpsAnalyst, PlatformAdmin]
    code: 201
    input: ["period_start", "period_end", "metric_variant?", "seeded_prior_avg_ship_hours?", "seeded_prior_on_time_ship_rate_bps?", "seeded_prior_cancellation_rate_bps?", "seeded_prior_defect_rate_bps?"]
    output: VendorScorecard
    side_effects:
      - "status = DRAFT; metric_variant defaults to EVENT_EQUAL"
      - "all counts, unit sums, rates, avg_ship_hours, composite_score, tier and promise_padding_days set by calculations.vendor_scorecard_metrics"
      - "the Vendor row is NOT touched: a DRAFT scorecard never changes performance_tier or promise_padding_days"

  - method: GET
    path: "/dropship/vendors/{id}/scorecards"
    description: "List the vendor's scorecards (FK reverse-reachability for VendorScorecard.vendor_id)."
    roles: [PlatformAdmin, VendorOpsAnalyst, MerchandiseManager, VendorUser]
    code: 200
    input: ["status?", "metric_variant?", "limit?", "offset?"]
    output: VendorScorecard[]
    side_effects: []

  - method: POST
    path: "/dropship/scorecards/{id}/publish"
    description: "Publish a DRAFT scorecard onto its vendor. Optimistically concurrent on the vendor via expected_vendor_version."
    roles: [PlatformAdmin]
    code: 200
    input: [expected_vendor_version]
    output: VendorScorecard
    side_effects:
      - "status = PUBLISHED; published_at = logical clock"
      - "vendor.performance_tier = scorecard.tier; vendor.promise_padding_days = scorecard.promise_padding_days"
      - "a PROBATION tier on an ACTIVE vendor suspends it with suspension_reason = SCORECARD_PROBATION and runs the full four-hop suspension cascade"
      - "increments Vendor.version by 1"

  # ------------------------- Test-driving surface -------------------------
  - method: POST
    path: "/dropship/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC instant so cadence staleness, SLA deadlines, defect windows, blackout dates and scorecard periods are deterministic. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "every subsequent request evaluates staleness, deadlines, windows and date arithmetic against this instant"
      - "no entity row is mutated by the call itself"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role is absent or not one of the five declared roles, or the role is VendorUser and X-User-ID is absent"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "The vendor_id in the path or in the POST /dropship/items body matches no Vendor row"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "The item_id in the path, in a POST /dropship/orders line, or in a fallback_item_id reference matches no DropshipItem row"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "The order id in the path matches no DropshipOrder row"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "The line id in the path or the line_id in the POST /dropship/returns body matches no DropshipOrderLine row"
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "The return id in the path matches no ReturnAuthorization row"
  - id: ERR_SCORECARD_NOT_FOUND
    http: 404
    condition: "The scorecard id in the path matches no VendorScorecard row"
  - id: ERR_INTEGRATION_TEST_NOT_FOUND
    http: 404
    condition: "The integration-test id in the path matches no IntegrationTest row"
  - id: ERR_BLACKOUT_NOT_FOUND
    http: 404
    condition: "The blackout_id in the path matches no VendorBlackout row, or matches a row whose vendor_id differs from the path vendor id"
  - id: ERR_VENDOR_SCOPE_VIOLATION
    http: 403
    condition: "A VendorUser caller reaches a Vendor, offer, line or return that does not belong to the vendor whose id equals X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, a field has the wrong type, a numeric field falls outside its declared range, an enum field holds an undeclared value, or ship-confirm supplies shipped_units != line.quantity"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "A snapshot's effective_to is not strictly after effective_from, a blackout's end_date precedes its start_date, or a scorecard's period_end precedes its period_start"
  - id: ERR_COST_MODEL_FIELD_MISMATCH
    http: 422
    condition: "The supplied rate or cost fields contradict the vendor's cost_model: a COMMISSION vendor given wholesale_discount_bps, a WHOLESALE vendor given commission_rate_bps, a WHOLESALE vendor's offer created or activated without unit_wholesale_cost_cents, or a COMMISSION vendor's offer given unit_wholesale_cost_cents"
  - id: ERR_DUPLICATE_VENDOR_CODE
    http: 409
    condition: "The submitted vendor_code already exists on another Vendor row"
  - id: ERR_DUPLICATE_ORDER_REF
    http: 409
    condition: "The submitted order_ref already exists on another DropshipOrder row"
  - id: ERR_STALE_ITEM_VERSION
    http: 412
    condition: "expected_item_version on POST /dropship/items/{id}/inventory-snapshots does not equal the offer's current version"
  - id: ERR_STALE_VENDOR_VERSION
    http: 412
    condition: "expected_vendor_version on POST /dropship/scorecards/{id}/publish does not equal the scorecard's vendor's current version"
  - id: ERR_VENDOR_INVALID_STATE
    http: 409
    condition: "The vendor's onboarding_status does not permit the requested transition; also raised when a new integration round is opened with no FAILED test in the current round, and when a SCORECARD_PROBATION suspension is reinstated while the latest PUBLISHED scorecard still has tier PROBATION"
  - id: ERR_ITEM_INVALID_STATE
    http: 409
    condition: "The offer's status does not permit the requested transition; also raised when an offer suppressed with reason VENDOR_SUSPENDED is activated directly instead of via vendor reinstate, and when an ACTIVE offer is PATCHed"
  - id: ERR_ITEM_NOT_ORDERABLE
    http: 409
    condition: "A POST /dropship/orders line references an offer whose status is not ACTIVE"
  - id: ERR_LINE_INVALID_STATE
    http: 409
    condition: "The line's status does not permit the requested transition; also raised when POST /dropship/orders/{id}/transmit finds no PENDING_TRANSMIT line, and when a return is opened or authorized against a line that is not SHIPPED"
  - id: ERR_RETURN_INVALID_STATE
    http: 409
    condition: "The return's status does not permit the requested transition"
  - id: ERR_SCORECARD_INVALID_STATE
    http: 409
    condition: "A scorecard that is already PUBLISHED is published again"
  - id: ERR_INTEGRATION_TEST_INVALID_STATE
    http: 409
    condition: "The integration test is not PENDING, or its round_number does not equal the vendor's current integration_round"
  - id: ERR_VENDOR_NOT_ACTIVE
    http: 409
    condition: "The vendor owning the target row is not ACTIVE: offer activation, line acknowledge, ship-confirm and retransmit all require it, and offer creation requires CERTIFIED or ACTIVE"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID activating a vendor equals its certified_by_user_id, or the X-User-ID evaluating an integration test equals the X-User-ID that recorded that test"
  - id: ERR_INTEGRATION_INCOMPLETE
    http: 422
    condition: "Certification is attempted while at least one of CATALOG, INVENTORY, ORDER or SHIP_CONFIRM has no PASSED integration test at the vendor's current integration_round"
  - id: ERR_NO_SERVICEABILITY_COVERAGE
    http: 422
    condition: "Vendor activation finds no ACTIVE ServiceabilityRule, or offer activation finds none matching the offer's ship_method"
  - id: ERR_FALLBACK_INVALID
    http: 422
    condition: "fallback_item_id points at the offer itself, at an offer with a different sku, or at an offer belonging to the same vendor"
  - id: ERR_ZONE_NOT_SERVICEABLE
    http: 422
    condition: "No ACTIVE ServiceabilityRule of the offer's vendor matches the order's customer_zone_code together with the offer's ship_method"
  - id: ERR_VENDOR_BLACKOUT
    http: 422
    condition: "An ACTIVE VendorBlackout of the offer's vendor covers the current logical date, so the line cannot be handed off"
  - id: ERR_SNAPSHOT_WINDOW_OVERLAP
    http: 409
    condition: "A new feed message's half-open window overlaps an ACTIVE snapshot of the same offer; windows that merely touch (one window's effective_to equals the next window's effective_from) are accepted"
  - id: ERR_BLACKOUT_WINDOW_CONFLICT
    http: 409
    condition: "A new blackout overlaps an ACTIVE blackout of the same vendor, or starts within reopen_buffer_days of that blackout's end_date"
  - id: ERR_OUTSIDE_DEFECT_WINDOW
    http: 422
    condition: "The return is opened or authorized after the offer's defect_window_days have elapsed from the line's ship date; the final day of the window is still inside it"
  - id: ERR_RETURN_QUANTITY_EXCEEDS_SHIPPED
    http: 422
    condition: "quantity_returned plus the line's already-returned units exceeds the quantity that shipped on the line"
  - id: ERR_INVENTORY_STALE
    http: 409
    condition: "The offer's inventory feed has not refreshed within inventory_refresh_cadence_minutes * STALE_CADENCE_MULTIPLIER, so on-hand cannot be trusted for a new reservation"
  - id: ERR_INSUFFICIENT_AVAILABILITY
    http: 409
    condition: "A requested line quantity exceeds the offer's available_units after the safety buffer, oversell grace and existing reservations are applied"
  - id: ERR_NO_ELIGIBLE_FALLBACK_VENDOR
    http: 422
    condition: "Retransmission finds no eligible offer in the endless-aisle fallback chain that is ACTIVE, at an ACTIVE and unblacked-out vendor, serviceable to the order's zone, with a fresh feed and enough availability for the whole line quantity"

# =============================================================================
# 1.7 RBAC Matrix   (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Retail platform operator. Break-glass access across the whole surface and the only role that may publish a scorecard onto a vendor or drive the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /dropship/scorecards/{id}/publish"
      - "POST /dropship/_clock/set_current_utc"
    shared_operations:
      - "every other endpoint in §1.5; PlatformAdmin appears in the roles list of all of them"

  - name: VendorOpsAnalyst
    description: "Runs vendor onboarding and integration testing, declares blackout windows and computes DRAFT scorecards. May certify a vendor but may never activate one."
    identity: "opaque"
    exclusive_operations:
      - "POST /dropship/vendors/{id}/begin-integration"
      - "POST /dropship/vendors/{id}/integration-tests"
      - "POST /dropship/integration-tests/{id}/evaluate"
      - "POST /dropship/vendors/{id}/certify"
      - "POST /dropship/vendors/{id}/scorecards"
    shared_operations:
      - "POST /dropship/vendors"
      - "POST /dropship/vendors/{id}/blackouts and DELETE /dropship/vendors/{id}/blackouts/{blackout_id} (with PlatformAdmin)"
      - "POST /dropship/items/{id}/inventory-snapshots (with VendorUser)"
      - "all GET reads except GET /dropship/orders/{id} scoped reads it shares with CareAgent"
    note: "Segregation of duties: certification and activation are split between this role and MerchandiseManager, and the ERR_SEGREGATION_OF_DUTIES check additionally forbids the same X-User-ID from doing both."

  - name: MerchandiseManager
    description: "Owns the assortment and the commercial relationship: activates and suspends vendors, sets geographic serviceability, creates and amends offers, and adjudicates returns."
    identity: "opaque"
    exclusive_operations:
      - "POST /dropship/vendors/{id}/activate"
      - "POST /dropship/vendors/{id}/suspend"
      - "POST /dropship/vendors/{id}/reinstate"
      - "POST /dropship/vendors/{id}/serviceability-rules"
      - "POST /dropship/items"
      - "PATCH /dropship/items/{id}"
      - "POST /dropship/items/{id}/activate"
      - "POST /dropship/items/{id}/suppress"
      - "POST /dropship/returns/{id}/reject"
    shared_operations:
      - "POST /dropship/orders (with CareAgent and PlatformAdmin)"
      - "POST /dropship/orders/{id}/transmit and POST /dropship/order-lines/{id}/retransmit (with PlatformAdmin only)"
      - "POST /dropship/returns/{id}/authorize (with CareAgent)"
      - "all GET reads"
    note: "Cannot certify a vendor and cannot record or evaluate integration tests: those belong to VendorOpsAnalyst."

  - name: VendorUser
    description: "A dropship vendor acting on its own account: posts inventory feed messages, acknowledges, ships, cancels its own lines and receives returns routed to it."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /dropship/order-lines/{id}/acknowledge"
      - "POST /dropship/order-lines/{id}/ship-confirm"
      - "POST /dropship/order-lines/{id}/cancel"
    shared_operations:
      - "POST /dropship/items/{id}/inventory-snapshots (with VendorOpsAnalyst and PlatformAdmin)"
      - "POST /dropship/returns/{id}/receive (with PlatformAdmin and CareAgent)"
      - "read access to its own vendor row, offers, integration tests, coverage rows, blackouts, scorecards, lines, shipment confirmations and returns"
    note: "X-User-ID equals the acting Vendor.id. Every reachable Vendor must be that vendor or the request is rejected with ERR_VENDOR_SCOPE_VIOLATION; there is no cross-vendor read path."

  - name: CareAgent
    description: "Customer care: places customer orders, quotes and re-quotes the delivery promise, opens and authorizes returns."
    identity: "opaque"
    exclusive_operations:
      - "POST /dropship/returns"
    shared_operations:
      - "POST /dropship/orders (with MerchandiseManager and PlatformAdmin)"
      - "POST /dropship/returns/{id}/authorize (with MerchandiseManager and PlatformAdmin)"
      - "POST /dropship/returns/{id}/receive (with VendorUser and PlatformAdmin)"
      - "GET /dropship/orders/{id}, GET /dropship/orders/{id}/promise, GET /dropship/order-lines, GET /dropship/returns and the other read endpoints"
    note: "Cannot transmit an order, cannot reject a return and cannot touch vendor onboarding or assortment."
