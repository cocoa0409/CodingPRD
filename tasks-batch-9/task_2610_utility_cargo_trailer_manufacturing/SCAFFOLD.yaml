# ---------------------------------------------------------------------------
# §1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message_template: "Authentication headers missing or role unrecognized"
    triggered_by: "validations priority 10"
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    message_template: "Role {role} may not call {method} {path}"
    triggered_by: "validations priority 20"
  - error_id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    message_template: "Dealer {actor_id} may not act on records belonging to dealer {dealer_id}"
    triggered_by: "validations priority 25"
  - error_id: ERR_MODEL_NOT_FOUND
    http_status: 404
    message_template: "Trailer model {model_id} not found"
    triggered_by: "validations priority 30 and 35"
  - error_id: ERR_DEALER_NOT_FOUND
    http_status: 404
    message_template: "Dealer {dealer_id} not found"
    triggered_by: "validations priority 30 and 35"
  - error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    message_template: "Trailer unit {unit_id} not found"
    triggered_by: "validations priority 30 and 35"
  - error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    message_template: "Dealer order {order_id} not found"
    triggered_by: "validations priority 30 and 35"
  - error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    message_template: "Warranty claim {claim_id} not found"
    triggered_by: "validations priority 30"
  - error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    message_template: "{resource_type} {resource_id} not found"
    triggered_by: "validations priority 30 and 35 for WeldJig, TestLane, RoadTest and OptionInstall"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message_template: "Invalid request: {detail}"
    triggered_by: "validations priority 40"
  - error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
    message_template: "expected_dealer_version {expected} is stale; dealer is at version {actual}"
    triggered_by: "validations priority 45 (concurrency_rules.order-allocation-stale-dealer)"
  - error_id: ERR_STALE_JIG_VERSION
    http_status: 412
    message_template: "expected_weld_jig_version {expected} is stale; jig is at version {actual}"
    triggered_by: "validations priority 46 (concurrency_rules.jig-reservation-stale-jig)"
  - error_id: ERR_UNIT_BUILD_STATE_INVALID
    http_status: 409
    message_template: "Trailer unit is in build_status {status}; this step requires one of {allowed}"
    triggered_by: "validations priority 50"
  - error_id: ERR_COMPLIANCE_STAGE_OUT_OF_ORDER
    http_status: 409
    message_template: "Systems stage {stage} cannot run while compliance_status is {status}"
    triggered_by: "validations priority 51"
  - error_id: ERR_MODEL_STATE_INVALID
    http_status: 409
    message_template: "Trailer model is in certification_status {status}; this step requires one of {allowed}"
    triggered_by: "validations priority 52"
  - error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    message_template: "Dealer order is in status {status}; this step requires one of {allowed}"
    triggered_by: "validations priority 53"
  - error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    message_template: "Warranty claim is in status {status} with {shipped}/{total} lines shipped; this step is not available"
    triggered_by: "validations priority 54"
  - error_id: ERR_LABEL_ALREADY_ISSUED
    http_status: 409
    message_template: "Trailer unit already carries issued certification label {vin}"
    triggered_by: "validations priority 55"
  - error_id: ERR_ROAD_TEST_ALREADY_RESULTED
    http_status: 409
    message_template: "Road test {road_test_id} is already {status}"
    triggered_by: "validations priority 56"
  - error_id: ERR_OPTION_NOT_REMOVABLE
    http_status: 409
