  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_reserve_then_cancel_leaves_seats_reserved
        grounds:
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - entities.Trip.fields.seats_reserved
          - entities.Reservation.fields.seat_count
        distinguishing_aspect: "Conserved quantity = Trip.seats_reserved (seat count): invariant Trip.seats_reserved == sum(seat_count over reservation_status IN {RESERVED,CHECKED_IN,COMPLETED}); reserving 2 seats then cancelling that reservation restores seats_reserved to its pre-reserve value 0 with zero drift."
        test_recipe:
          setup:
            - "Trip SCHEDULED with seats_reserved 0; one reservation of 2 seats is created then cancelled."
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 100000, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-09T15:00:00Z", duration_min: 40, distance_miles: 10.0 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r_id}", expected_trip_version: "${trip_v0}", seat_count: 2, pay_now: true }
              as: Rider
              as_user_id: "${r_id}"
              captures: { res_id: $.data.id, seats_mid: $.data.seat_count }
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Rider
              as_user_id: "${r_id}"
              captures: { res_status: $.data.reservation_status }
          assert:
            - "Reservation.${res_id}.reservation_status == CANCELLED"
            - "Trip.${trip_id}.seats_reserved == 0"
            - "Member.${r_id}.wallet_balance_cents == 50000"

      - name: subsidy_budget_conservation_reserve_then_cancel_leaves_consumed
        grounds:
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - entities.EmployerProgram.fields.subsidy_consumed_cents
          - entities.SubsidyLedgerEntry.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = EmployerProgram.subsidy_consumed_cents (money/budget, distinct from the seat count of the sibling invariant): invariant subsidy_consumed_cents == signed sum of SubsidyLedgerEntry.amount_cents; a reserve (no DEBIT yet) then cancel leaves subsidy_consumed_cents at 0 with no net ledger movement."
        test_recipe:
          setup:
            - "Fresh program subsidy_consumed_cents 0; reserve pay_now then cancel before any finalize; ledger nets to 0."
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 100000, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-09T15:00:00Z", duration_min: 40, distance_miles: 10.0, hov_lane_used: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r_id}", expected_trip_version: "${trip_v0}", seat_count: 1, pay_now: true }
              as: Rider
              as_user_id: "${r_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Rider
              as_user_id: "${r_id}"
              captures: { res_status: $.data.reservation_status }
          assert:
            - "Reservation.${res_id}.reservation_status == CANCELLED"
            - "EmployerProgram.${prog_id}.subsidy_consumed_cents == 0"
            - "Member.${r_id}.wallet_balance_cents == 50000"
