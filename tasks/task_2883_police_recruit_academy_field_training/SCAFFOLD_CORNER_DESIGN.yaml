            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          trigger:
            - call: "POST /course-sessions/${cs1_id}/deliver"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "GET /academy-classes/${class_id}"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
            - call: "GET /recruits/${rec_id}"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
            - call: "GET /recruits/${rec_id}/certification-progress"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
            - call: "GET /attendance-records"
              payload: { course_session_id: "${cs1_id}" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
            - call: "POST /course-sessions/${cs1_id}/attendance"
              payload: { recruit_id: "${rec_id}", status: "PRESENT", present_hours: 2.00 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { e1: $.data.error_id }
            - call: "GET /attendance-records"
              payload: { course_session_id: "${cs1_id}" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
            - call: "GET /academy-classes/${class_id}"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
            - call: "POST /course-sessions/${cs1_id}/void-delivery"
              payload: { reason: "instructor recalled to duty" }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "GET /academy-classes/${class_id}"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
            - call: "GET /recruits/${rec_id}"
              payload: {}
