  # ===========================================================================
  # RULE 3 - non_linear_state_machine
  # Two instances on DIFFERENT entities and DIFFERENT non-linear shapes:
  # a true cycle on IdentityProofingSession, and two genuinely independent
  # parallel state dimensions on DigitalCredential.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: proofing_session_returned_reopens_collecting_and_reverifies
        grounds: "state_machines[IdentityProofingSession] (shape cyclic): COLLECTING -> SUBMITTED -> RETURNED -> COLLECTING -> SUBMITTED -> VERIFIED"
        distinguishing_aspect: "A genuine CYCLE on IdentityProofingSession: the RETURNED -> COLLECTING edge is fired by appending evidence, not by an explicit reopen call, and the loop is observable because submission_count is monotonic across laps (1 then 2) while return_reason is cleared on re-entry. The resubmission penalty makes the second lap's adjudication_score strictly lower (515) than a naive one-lap score (540) over identical evidence."
