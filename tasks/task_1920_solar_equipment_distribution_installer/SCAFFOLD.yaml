scenario: |
  1920. Solar Equipment Distribution & Installer Channel (CED Greentech): module/inverter compatibility & design tool, allocation & container arrival scheduling, tariff/duty impact on landed cost, installer credit & progress-payment terms, warranty registration & RMA to manufacturer, permit-package documentation support, damaged-in-transit claim, stranded inventory & technology obsolescence

domain_name: solar-distribution-installer
api_prefix: /solar-dist

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite inventory pool competed across projects
  secondary_archetype: ledger_reconciliation # provisional vs final landed cost; progress-payment ledger
  complexity_layers:
    - optimistic_concurrency                 # OCC on InventoryLot.version for allocation create
    - cascading_side_effects                 # RMA → credit memo → installer credit exposure; container arrival → lot receipt → allocation fulfilment
    - dual_variant_calculation               # provisional vs final landed cost; progress-payment schedule variants
    - derived_field_reconciliation           # Installer.credit_exposure_cents; InventoryLot.available_qty; Project.allocated_value_cents
    - scheduled_deferred_actions             # Container arrival at ETA; obsolescence sweep at end of each UTC day
    - rate_threshold_triggers                # Credit hold threshold, progress-payment percentage breakpoints

  entity_topology: flat                      # peer entities with cross-aggregate FK references
  state_machine_shape: compound              # Project has payment_status × fulfillment_status; Container drives lot; RMA drives credit memo
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # Allocation spans Project × InventoryLot; RmaClaim spans Installer × Product
    - self_referential                       # CompatibilityRule pairs Product↔Product
  role_model: hierarchical_override          # DistributionAdmin > ChannelManager > InstallerRep; CreditOfficer is orthogonal gate
  consistency_model: immediate               # all state changes atomic in a single request; derived fields refreshed in the same transaction

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer SKU; unique per product" }
      - { name: product_kind, type: enum, source: input, description: "MODULE | INVERTER | RACKING | BOS" }
      - { name: manufacturer_name, type: string, source: input, description: "Manufacturer legal name (used on RMA and warranty registration)" }
      - { name: wattage_w, type: integer, source: input, description: "Module nameplate watts; required for MODULE, else 0" }
      - { name: ac_output_w, type: integer, source: input, description: "Inverter continuous AC output watts; required for INVERTER, else 0" }
      - { name: dc_input_max_w, type: integer, source: input, description: "Inverter max DC input watts; required for INVERTER, else 0" }
      - { name: technology_generation, type: integer, source: input, description: "Monotonic generation index (1..N); lower is older; used by obsolescence sweep" }
      - { name: hts_code, type: string, source: input, description: "Harmonized Tariff Schedule code; drives tariff rate lookup" }
      - { name: list_price_cents, type: integer, source: input, description: "Distributor list price per unit, in cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED | OBSOLETE" }

  - name: CompatibilityRule
    parent: null
    common_fields: true
    fields:
      - { name: module_product_id, type: string, source: input, description: "FK -> Product.id; the MODULE product; self-referential pair member" }
      - { name: inverter_product_id, type: string, source: input, description: "FK -> Product.id; the INVERTER product; self-referential pair member" }
      - { name: max_modules_per_inverter, type: integer, source: input, description: "Maximum module count the inverter can drive under this rule" }
      - { name: min_modules_per_inverter, type: integer, source: input, description: "Minimum module count required for string stability" }
      - { name: effective_from, type: datetime, source: input, description: "UTC timestamp from which the rule applies" }
      - { name: effective_to, type: datetime, source: input, description: "UTC timestamp after which the rule no longer applies (null = open-ended)", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: TariffRate
    parent: null
    common_fields: true
    fields:
      - { name: hts_code, type: string, source: input, description: "HTS code this rate applies to (matches Product.hts_code)" }
      - { name: duty_rate_bp, type: integer, source: input, description: "Duty rate in basis points (1/100 of 1%); e.g. 1450 = 14.50%" }
      - { name: effective_from, type: datetime, source: input, description: "UTC timestamp from which the rate applies" }
      - { name: effective_to, type: datetime, source: input, description: "UTC timestamp after which the rate no longer applies (null = open-ended)", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }

  - name: Installer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Installer company legal name" }
      - { name: license_number, type: string, source: input, description: "State contractor license number" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Approved open-account credit limit in cents" }
      - { name: progress_payment_pct_bp, type: integer, source: input, description: "Progress-payment percentage at delivery, basis points; remainder due at permission-to-operate. E.g. 8000 = 80% at delivery, 20% at PTO" }
      - { name: payment_terms_days, type: integer, source: input, description: "Net-N terms; invoice due N days after invoice_date" }
      - { name: credit_exposure_cents, type: integer, source: computed, description: "Sum over non-terminal Invoices of (balance_due_cents); recomputed on invoice issue, payment post, RMA credit memo, write-off" }
      - { name: credit_hold, type: boolean, source: computed, description: "true iff credit_exposure_cents >= credit_limit_cents; gates new allocation" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | TERMINATED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; which product this lot holds" }
      - { name: lot_code, type: string, source: input, description: "Physical lot/batch code from the manufacturer" }
      - { name: qty_on_hand, type: integer, source: system, description: "Physical units currently in warehouse; increases on container receipt, decreases on shipment/damage write-off" }
      - { name: qty_allocated, type: integer, source: system, description: "Units currently allocated to non-terminal projects" }
      - { name: qty_available, type: integer, source: computed, description: "qty_on_hand - qty_allocated - qty_quarantined; never negative" }
      - { name: qty_quarantined, type: integer, source: system, description: "Units held for damage/RMA inspection; unavailable for allocation" }
      - { name: unit_cost_cents_provisional, type: integer, source: computed, description: "Landed cost per unit using provisional duty estimate; refined at receipt" }
      - { name: unit_cost_cents_final, type: integer, source: computed, description: "Landed cost per unit using actual duty/tariff at receipt; null until received" }
      - { name: received_at, type: datetime, source: system, description: "UTC timestamp when the parent container was received (null until then)", default: null }
      - { name: stranded_at, type: datetime, source: system, description: "UTC timestamp when obsolescence sweep marked this lot stranded (null if not stranded)", default: null }
      - { name: status, type: enum, source: system, description: "IN_TRANSIT | ON_HAND | DEPLETED | STRANDED | WRITTEN_OFF" }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: container_number, type: string, source: input, description: "Ocean container number; unique per shipment" }
      - { name: bol_number, type: string, source: input, description: "Bill of lading number" }
      - { name: origin_port, type: string, source: input, description: "Port of loading" }
      - { name: eta_utc, type: datetime, source: input, description: "Current best estimate of arrival (UTC); may be revised" }
      - { name: actual_arrival_utc, type: datetime, source: system, description: "UTC timestamp of actual arrival (null until received)", default: null }
      - { name: freight_cost_cents, type: integer, source: input, description: "Total ocean freight cost for this container in cents" }
      - { name: insurance_cost_cents, type: integer, source: input, description: "Total marine insurance cost in cents" }
      - { name: status, type: enum, source: system, description: "BOOKED | IN_TRANSIT | ARRIVED | RECEIVED | CLOSED | CANCELLED" }

  - name: ContainerLine
    parent: Container
    common_fields: true
    fields:
      - { name: container_id, type: string, source: system, description: "FK -> Container.id; parent container" }
      - { name: inventory_lot_id, type: string, source: system, description: "FK -> InventoryLot.id; lot provisioned for this line at booking" }
      - { name: qty_booked, type: integer, source: input, description: "Units booked on this line" }
      - { name: qty_received, type: integer, source: system, description: "Units actually received (set at receipt; 0 until then)" }
      - { name: qty_damaged, type: integer, source: system, description: "Units damaged in transit (set at receipt; 0 until then)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; redundant with lot.product_id, kept for receipt-time audit" }
      - { name: declared_unit_value_cents, type: integer, source: input, description: "Declared customs value per unit, cents; drives duty computation" }

  - name: Project
    parent: Installer
    common_fields: true
    fields:
      - { name: installer_id, type: string, source: system, description: "FK -> Installer.id; owning installer" }
      - { name: project_name, type: string, source: input, description: "Installer-facing project name" }
      - { name: site_postal_code, type: string, source: input, description: "Job site postal code; drives permit-package jurisdiction" }
      - { name: system_size_kw_dc, type: number, source: computed, description: "Total module DC watts / 1000; derived from BillOfMaterials at design lock" }
      - { name: module_product_id, type: string, source: input, description: "FK -> Product.id; chosen MODULE product" }
      - { name: inverter_product_id, type: string, source: input, description: "FK -> Product.id; chosen INVERTER product" }
      - { name: module_qty, type: integer, source: input, description: "Number of modules in the design" }
      - { name: inverter_qty, type: integer, source: input, description: "Number of inverters in the design" }
      - { name: compatibility_rule_id, type: string, source: system, description: "FK -> CompatibilityRule.id; the rule that authorized the module↔inverter pairing; pinned at design lock, immutable thereafter" }
      - { name: design_locked_at, type: datetime, source: system, description: "UTC timestamp of design freeze (null until locked)", default: null }
      - { name: allocated_value_cents, type: integer, source: computed, description: "Sum over OPEN/SHIPPED Allocations of (qty_allocated × lot.unit_cost_cents_final-or-provisional); refreshes on allocation create/release/ship and on lot cost finalization" }
      - { name: invoiced_value_cents, type: integer, source: computed, description: "Sum over non-terminal Invoices of (amount_cents); refreshes on invoice issue/void" }
      - { name: paid_value_cents, type: integer, source: computed, description: "Sum over posted Payments of amount_cents; refreshes on payment post/reversal" }
      - { name: payment_status, type: enum, source: system, description: "UNBILLED | PROGRESS_BILLED | PTO_BILLED | PAID_IN_FULL | WRITTEN_OFF (parallel dimension 1)" }
      - { name: fulfillment_status, type: enum, source: system, description: "DESIGN | ALLOCATED | PARTIALLY_SHIPPED | SHIPPED | COMPLETE | CANCELLED (parallel dimension 2)" }

  - name: Allocation
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: inventory_lot_id, type: string, source: input, description: "FK -> InventoryLot.id; lot to draw from" }
      - { name: qty_allocated, type: integer, source: input, description: "Units to reserve" }
      - { name: unit_cost_cents_at_allocation, type: integer, source: system, description: "Snapshot of lot.unit_cost_cents_final if set else lot.unit_cost_cents_provisional at allocation time; immutable" }
      - { name: expected_lot_version, type: integer, source: input, description: "OCC guard: InventoryLot.version the client last observed; rejected with ERR_STALE_LOT_VERSION if mismatched" }
      - { name: allocated_at, type: datetime, source: system, description: "UTC timestamp when the allocation was placed" }
      - { name: released_at, type: datetime, source: system, description: "UTC timestamp when released (null until then)", default: null }
      - { name: shipped_at, type: datetime, source: system, description: "UTC timestamp when shipped (null until then)", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | SHIPPED | RELEASED | CANCELLED" }

  - name: Invoice
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: installer_id, type: string, source: system, description: "FK -> Installer.id; denormalized from Project for credit ledger" }
      - { name: invoice_kind, type: enum, source: input, description: "PROGRESS | PTO | CREDIT_MEMO | WRITE_OFF" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed from progress_payment_pct_bp × allocated_value_cents (PROGRESS) or remainder (PTO); CREDIT_MEMO/WRITE_OFF supplied by issuer" }
      - { name: balance_due_cents, type: integer, source: computed, description: "amount_cents - sum(posted Payments); goes to 0 on full pay" }
      - { name: invoice_date, type: datetime, source: system, description: "UTC timestamp the invoice is issued" }
      - { name: due_date, type: datetime, source: computed, description: "invoice_date + installer.payment_terms_days; recomputed if installer terms change before issue" }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIALLY_PAID | PAID | VOID | PAST_DUE" }

  - name: Payment
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; invoice being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0 and <= invoice.balance_due_cents at post time" }
      - { name: posted_at, type: datetime, source: system, description: "UTC timestamp when posted" }
      - { name: reversed_at, type: datetime, source: system, description: "UTC timestamp when reversed (null until then)", default: null }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED" }

  - name: RmaClaim
    parent: null
    common_fields: true
    fields:
      - { name: installer_id, type: string, source: input, description: "FK -> Installer.id; claimant" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; defective product" }
      - { name: allocation_id, type: string, source: input, description: "FK -> Allocation.id; the SHIPPED allocation that delivered the defective unit" }
      - { name: qty_claimed, type: integer, source: input, description: "Units claimed defective; must be <= qty on the referenced allocation" }
      - { name: qty_approved, type: integer, source: system, description: "Units approved by manufacturer; set at APPROVED transition" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "qty_approved × allocation.unit_cost_cents_at_allocation; credited via CREDIT_MEMO" }
      - { name: manufacturer_rma_number, type: string, source: input, description: "Manufacturer-side RMA tracking number (null until manufacturer responds)", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | CREDIT_ISSUED | CLOSED" }

  - name: PermitPackage
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: ahj_code, type: string, source: input, description: "Authority Having Jurisdiction code (city/county permit office)" }
      - { name: required_documents, type: array, source: system, description: "List of document slugs required for this AHJ (derived from module+inverter product docs at creation)" }
      - { name: submitted_documents, type: array, source: system, description: "List of document slugs already uploaded" }
      - { name: submitted_at, type: datetime, source: system, description: "UTC timestamp when the package was submitted to AHJ (null until then)", default: null }
      - { name: approved_at, type: datetime, source: system, description: "UTC timestamp when AHJ approved (null until then)", default: null }
      - { name: status, type: enum, source: system, description: "ASSEMBLING | SUBMITTED | APPROVED | REJECTED | WITHDRAWN" }

  - name: DamageClaim
    parent: Container
    common_fields: true
    fields:
      - { name: container_id, type: string, source: system, description: "FK -> Container.id; container being claimed against" }
      - { name: container_line_id, type: string, source: input, description: "FK -> ContainerLine.id; specific line with damage" }
      - { name: qty_damaged, type: integer, source: input, description: "Units damaged; must equal the line's qty_damaged at receipt" }
      - { name: claimed_amount_cents, type: integer, source: computed, description: "qty_damaged × (declared_unit_value_cents + allocated freight per unit); rounded per-line then summed per claim" }
      - { name: filed_at, type: datetime, source: system, description: "UTC timestamp when claim was filed" }
      - { name: settled_at, type: datetime, source: system, description: "UTC timestamp when settled (null until then)", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | SETTLED | DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: ACTIVE
    terminal_states: [OBSOLETE]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: POST /solar-dist/products/{productId}/discontinue
        actor: DistributionAdmin
        preconditions:
          - "Product must be in ACTIVE (ERR_PRODUCT_NOT_ACTIVE)"
        side_effects:
          - "All CompatibilityRules referencing this product with status=ACTIVE → RETIRED (set effective_to=now)"
      - from: DISCONTINUED
        to: OBSOLETE
        trigger: "system (obsolescence sweep, end of each UTC day): product OBSOLETE when technology_generation < (max generation for that product_kind) - OBSOLESCENCE_GENERATION_LAG AND no InventoryLots reference it with qty_on_hand > 0"
        actor: system
        preconditions:
          - "Product must be in DISCONTINUED"
          - "No InventoryLot with product_id=this AND qty_on_hand > 0 (any state except WRITTEN_OFF)"
          - "technology_generation < (current max generation for product_kind) - OBSOLESCENCE_GENERATION_LAG"
        side_effects:
          - "All OPEN Allocations referencing lots of this product → CANCELLED"
          - "Project.allocated_value_cents recomputed for each affected project"

  - entity: CompatibilityRule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: POST /solar-dist/compatibility-rules/{ruleId}/retire OR cascaded from Product DISCONTINUED
        actor: DistributionAdmin | system
        preconditions:
          - "Rule must be in ACTIVE (ERR_RULE_NOT_ACTIVE)"
        side_effects:
          - "set effective_to = now if null"
          - "If any Project has compatibility_rule_id = this AND design_locked_at IS NULL → reject with ERR_RULE_IN_USE (cannot retire while referenced by unlocked designs)"

  - entity: Installer
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: POST /solar-dist/installers/{installerId}/activate
        actor: ChannelManager
        preconditions:
          - "credit_limit_cents > 0 (ERR_CREDIT_LIMIT_REQUIRED)"
          - "progress_payment_pct_bp BETWEEN 0 AND 10000 (ERR_INVALID_PROGRESS_PCT)"
          - "payment_terms_days > 0 (ERR_INVALID_PAYMENT_TERMS)"
        side_effects:
          - "credit_exposure_cents initialized to 0"
          - "credit_hold = false"
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /solar-dist/installers/{installerId}/suspend
        actor: CreditOfficer
        preconditions:
          - "Installer must be in ACTIVE (ERR_INSTALLER_NOT_ACTIVE)"
        side_effects:
          - "All OPEN Allocations on this installer's Projects → CANCELLED"
          - "Project.fulfillment_status → CANCELLED for Projects with all allocations terminal AND payment_status = UNBILLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /solar-dist/installers/{installerId}/reinstate
        actor: CreditOfficer
        preconditions:
          - "Installer must be in SUSPENDED (ERR_INSTALLER_NOT_SUSPENDED)"
          - "credit_exposure_cents < credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /solar-dist/installers/{installerId}/terminate
        actor: CreditOfficer
        preconditions:
          - "credit_exposure_cents == 0 (ERR_OUTSTANDING_BALANCE)"
          - "No Projects with payment_status NOT IN {PAID_IN_FULL, WRITTEN_OFF} OR fulfillment_status NOT IN {COMPLETE, CANCELLED}"
        side_effects:
          - "All remaining OPEN Allocations → CANCELLED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /solar-dist/installers/{installerId}/terminate
        actor: CreditOfficer
        preconditions:
          - "credit_exposure_cents == 0"
          - "No Projects with payment_status NOT IN {PAID_IN_FULL, WRITTEN_OFF} OR fulfillment_status NOT IN {COMPLETE, CANCELLED}"
        side_effects: []

  - entity: Container
    initial_state: BOOKED
    terminal_states: [RECEIVED, CLOSED, CANCELLED]
    transitions:
      - from: BOOKED
        to: IN_TRANSIT
        trigger: POST /solar-dist/containers/{containerId}/depart
        actor: DistributionAdmin
        preconditions:
          - "Container must be in BOOKED (ERR_CONTAINER_NOT_BOOKED)"
        side_effects: []
      - from: IN_TRANSIT
        to: ARRIVED
        trigger: POST /solar-dist/containers/{containerId}/arrive
        actor: DistributionAdmin
        preconditions:
          - "Container must be in IN_TRANSIT (ERR_CONTAINER_NOT_IN_TRANSIT)"
          - "actual_arrival_utc is set by this call"
        side_effects:
          - "actual_arrival_utc = now"
      - from: ARRIVED
        to: RECEIVED
        trigger: POST /solar-dist/containers/{containerId}/receive
        actor: DistributionAdmin
        preconditions:
          - "Container must be in ARRIVED (ERR_CONTAINER_NOT_ARRIVED)"
          - "Every ContainerLine must have qty_received + qty_damaged == qty_booked (ERR_RECEIPT_QTY_MISMATCH)"
        side_effects:
          - "For each ContainerLine: compute landed cost (see landed_cost calculation); set InventoryLot.qty_on_hand += qty_received; set InventoryLot.unit_cost_cents_final; set InventoryLot.received_at = now; transition InventoryLot IN_TRANSIT → ON_HAND"
          - "For each ContainerLine with qty_damaged > 0: set InventoryLot.qty_quarantined += qty_damaged"
          - "Recompute Project.allocated_value_cents for every Project holding OPEN allocations against any of these lots (final cost replaces provisional snapshot going forward; Allocation.unit_cost_cents_at_allocation unchanged)"
      - from: RECEIVED
        to: CLOSED
        trigger: POST /solar-dist/containers/{containerId}/close
        actor: DistributionAdmin
        preconditions:
          - "All DamageClaims against this container must be in {SETTLED, DENIED} (ERR_OPEN_DAMAGE_CLAIMS)"
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: POST /solar-dist/containers/{containerId}/cancel
        actor: DistributionAdmin
        preconditions:
          - "Container must be in BOOKED (ERR_CONTAINER_NOT_CANCELLABLE)"
        side_effects:
          - "All InventoryLots under this container → WRITTEN_OFF (qty_on_hand=0)"

  - entity: InventoryLot
    initial_state: IN_TRANSIT
    terminal_states: [DEPLETED, WRITTEN_OFF]
    transitions:
      - from: IN_TRANSIT
        to: ON_HAND
        trigger: "system (cascade from Container receive)"
        actor: system
        preconditions: []
        side_effects:
          - "qty_on_hand += qty_received"
          - "unit_cost_cents_final computed via landed_cost"
          - "received_at = now"
      - from: ON_HAND
        to: DEPLETED
        trigger: "system (automatic when qty_on_hand drops to 0 AND qty_allocated = 0 AND qty_quarantined = 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_HAND
        to: STRANDED
        trigger: "system (obsolescence sweep): lot ON_HAND with qty_on_hand > 0 AND parent Product DISCONTINUED for >= STRANDED_AGE_DAYS"
        actor: system
        preconditions:
          - "qty_on_hand > 0"
          - "Product.status = DISCONTINUED"
          - "Product.discontinued_at >= STRANDED_AGE_DAYS ago"
        side_effects:
          - "stranded_at = now"
          - "All OPEN Allocations against this lot → CANCELLED; qty_allocated released"
      - from: STRANDED
        to: WRITTEN_OFF
        trigger: POST /solar-dist/inventory-lots/{lotId}/write-off
        actor: CreditOfficer
        preconditions:
          - "Lot must be in STRANDED (ERR_LOT_NOT_STRANDED)"
          - "qty_allocated must be 0 (ERR_ALLOCATIONS_OUTSTANDING)"
        side_effects:
          - "qty_on_hand → 0; qty_quarantined → 0"
          - "Loss is recognized on DistributionAdmin ledger (no entity change)"
      - from: IN_TRANSIT
        to: WRITTEN_OFF
        trigger: "system (cascade from Container cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Project
    initial_state: DESIGN  # fulfillment_status = DESIGN, payment_status = UNBILLED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      # --- fulfillment_status dimension ---
      - from: DESIGN
        to: ALLOCATED
        trigger: "system (automatic when design locked AND at least one Allocation exists with status=OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "design_locked_at = now (set by POST /solar-dist/projects/{id}/lock-design, see below)"
      - from: ALLOCATED
        to: PARTIALLY_SHIPPED
        trigger: "system (automatic when at least one Allocation → SHIPPED and at least one remains OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: SHIPPED
        trigger: "system (automatic when all non-CANCELLED Allocations → SHIPPED)"
        actor: system
        preconditions: []
        side_effects:
          - "Issue PROGRESS invoice (see Invoice POST): payment_status UNBILLED → PROGRESS_BILLED"
      - from: PARTIALLY_SHIPPED
        to: SHIPPED
        trigger: "system (automatic when last OPEN Allocation → SHIPPED)"
        actor: system
        preconditions: []
        side_effects:
          - "Issue PROGRESS invoice if not yet issued; else no-op"
      - from: SHIPPED
        to: COMPLETE
        trigger: POST /solar-dist/projects/{projectId}/complete
        actor: InstallerRep
        preconditions:
          - "fulfillment_status = SHIPPED"
          - "payment_status = PAID_IN_FULL (ERR_UNPAID_BALANCE)"
          - "PermitPackage for this project must be in APPROVED (ERR_PERMIT_NOT_APPROVED)"
        side_effects: []
      - from: DESIGN
        to: CANCELLED
        trigger: POST /solar-dist/projects/{projectId}/cancel
        actor: InstallerRep | ChannelManager
        preconditions:
          - "fulfillment_status IN {DESIGN, ALLOCATED} (ERR_PROJECT_NOT_CANCELLABLE)"
          - "No SHIPPED Allocations (ERR_SHIPPED_ALLOCATIONS_EXIST)"
        side_effects:
          - "All OPEN Allocations → CANCELLED; qty_allocated released on each lot"
          - "allocated_value_cents → 0"
      - from: ALLOCATED
        to: CANCELLED
        trigger: POST /solar-dist/projects/{projectId}/cancel
        actor: InstallerRep | ChannelManager
        preconditions:
          - "fulfillment_status IN {DESIGN, ALLOCATED}"
          - "No SHIPPED Allocations"
        side_effects:
          - "All OPEN Allocations → CANCELLED"
      # --- payment_status dimension (independent) ---
      - from: UNBILLED
        to: PROGRESS_BILLED
        trigger: "system (when PROGRESS invoice issued on fulfillment → SHIPPED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROGRESS_BILLED
        to: PTO_BILLED
        trigger: POST /solar-dist/projects/{projectId}/invoice-pto
        actor: ChannelManager
        preconditions:
          - "payment_status = PROGRESS_BILLED (ERR_PROGRESS_NOT_BILLED)"
          - "PermitPackage APPROVED (ERR_PERMIT_NOT_APPROVED)"
          - "fulfillment_status = SHIPPED"
        side_effects:
          - "Issue PTO invoice for the remainder ((10000 - progress_payment_pct_bp)/10000 × allocated_value_cents)"
      - from: PTO_BILLED
        to: PAID_IN_FULL
        trigger: "system (when sum of posted Payments across all invoices on project == invoiced_value_cents AND invoiced_value_cents > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROGRESS_BILLED
        to: PAID_IN_FULL
        trigger: "system (when allocated_value_cents == 0 due to full RMA credit and all invoices are PAID or VOID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROGRESS_BILLED
        to: WRITTEN_OFF
        trigger: POST /solar-dist/projects/{projectId}/write-off
        actor: CreditOfficer
        preconditions:
          - "Installer in SUSPENDED or TERMINATED"
          - "Outstanding balance > 0"
        side_effects:
          - "Issue WRITE_OFF invoice equal to outstanding balance (offsets to 0 net recognized)"
      - from: PTO_BILLED
        to: WRITTEN_OFF
        trigger: POST /solar-dist/projects/{projectId}/write-off
        actor: CreditOfficer
        preconditions:
          - "Installer in SUSPENDED or TERMINATED"
        side_effects: []

  - entity: Allocation
    initial_state: OPEN
    terminal_states: [SHIPPED, RELEASED, CANCELLED]
    transitions:
      - from: OPEN
        to: SHIPPED
        trigger: POST /solar-dist/allocations/{allocationId}/ship
        actor: DistributionAdmin
        preconditions:
          - "Allocation must be OPEN (ERR_ALLOCATION_NOT_OPEN)"
          - "Lot status = ON_HAND (ERR_LOT_NOT_ON_HAND)"
          - "Lot.qty_available >= qty_allocated (ERR_INSUFFICIENT_QTY) — must hold after any concurrent releases"
        side_effects:
          - "Lot.qty_on_hand -= qty_allocated; Lot.qty_allocated -= qty_allocated (the units leave the building; allocation reservation released)"
          - "Project.allocated_value_cents recomputed (this allocation now contributes via shipped value path)"
          - "Project.fulfillment_status re-evaluated (may → PARTIALLY_SHIPPED or SHIPPED; if SHIPPED, cascades to PROGRESS invoice issue)"
      - from: OPEN
        to: RELEASED
        trigger: POST /solar-dist/allocations/{allocationId}/release
        actor: InstallerRep | ChannelManager
        preconditions:
          - "Allocation must be OPEN (ERR_ALLOCATION_NOT_OPEN)"
        side_effects:
          - "Lot.qty_allocated -= qty_allocated"
          - "Project.allocated_value_cents recomputed"
          - "released_at = now"
      - from: OPEN
        to: CANCELLED
        trigger: "system (cascade from Project cancel, Installer suspend/terminate, Product obsolete, Lot stranded)"
        actor: system
        preconditions: []
        side_effects:
          - "Lot.qty_allocated -= qty_allocated"
          - "Project.allocated_value_cents recomputed"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "system (when first Payment posted with amount < balance_due_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "balance_due_cents -= payment.amount_cents"
          - "Installer.credit_exposure_cents recomputed"
      - from: OPEN
        to: PAST_DUE
        trigger: "system (automatic when now > due_date AND balance_due_cents > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Installer.credit_hold re-evaluated (still based on credit_exposure vs credit_limit; PAST_DUE itself is a state, not a separate hold)"
      - from: PARTIALLY_PAID
        to: PAST_DUE
        trigger: "system (automatic when now > due_date AND balance_due_cents > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: PAID
        trigger: "system (when a posted Payment brings balance_due_cents to 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Installer.credit_exposure_cents recomputed"
          - "Project payment_status re-evaluated (may → PAID_IN_FULL)"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (when a posted Payment brings balance_due_cents to 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Installer.credit_exposure_cents recomputed"
      - from: PAST_DUE
        to: PAID
        trigger: "system (when a posted Payment brings balance_due_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: VOID
        trigger: POST /solar-dist/invoices/{invoiceId}/void
        actor: CreditOfficer
        preconditions:
          - "Invoice in OPEN with balance_due_cents == amount_cents (no payments posted)"
        side_effects:
          - "Installer.credit_exposure_cents recomputed"
          - "Project.invoiced_value_cents recomputed"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: POST /solar-dist/payments/{paymentId}/reverse
        actor: CreditOfficer
        preconditions:
          - "Payment must be POSTED (ERR_PAYMENT_NOT_POSTED)"
          - "Invoice not in PAID with all other payments REVERSED (would create negative paid_value_cents)"
        side_effects:
          - "Invoice.balance_due_cents += amount_cents"
          - "Invoice status reverts PAID → OPEN or PARTIALLY_PAID based on remaining balance"
          - "Installer.credit_exposure_cents recomputed"
          - "Project.paid_value_cents recomputed; payment_status re-evaluated"

  - entity: RmaClaim
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /solar-dist/rma-claims/{rmaId}/submit
        actor: InstallerRep
        preconditions:
          - "Allocation referenced must be in SHIPPED (ERR_ALLOCATION_NOT_SHIPPED)"
          - "qty_claimed > 0 AND qty_claimed <= allocation.qty_allocated (ERR_INVALID_QTY_CLAIMED)"
        side_effects:
          - "manufacturer_rma_number may be populated by issuer"
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /solar-dist/rma-claims/{rmaId}/approve
        actor: ChannelManager
        preconditions:
          - "Claim must be in SUBMITTED (ERR_RMA_NOT_SUBMITTED)"
          - "qty_approved > 0 AND qty_approved <= qty_claimed"
        side_effects:
          - "credit_amount_cents = qty_approved × allocation.unit_cost_cents_at_allocation"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /solar-dist/rma-claims/{rmaId}/reject
        actor: ChannelManager
        preconditions:
          - "Claim must be in SUBMITTED"
        side_effects: []
      - from: APPROVED
        to: CREDIT_ISSUED
        trigger: POST /solar-dist/rma-claims/{rmaId}/issue-credit
        actor: CreditOfficer
        preconditions:
          - "Claim must be in APPROVED (ERR_RMA_NOT_APPROVED)"
        side_effects:
          - "Create Invoice with invoice_kind=CREDIT_MEMO, amount_cents = -credit_amount_cents, applied against installer's open invoices oldest-first by invoice_date ASC, then created_at ASC"
          - "Installer.credit_exposure_cents recomputed"
          - "Project.allocated_value_cents NOT adjusted (the units already shipped; this is a credit, not a return-to-stock)"
      - from: CREDIT_ISSUED
        to: CLOSED
        trigger: POST /solar-dist/rma-claims/{rmaId}/close
        actor: CreditOfficer
        preconditions:
          - "Claim must be CREDIT_ISSUED"
        side_effects: []

  - entity: PermitPackage
    initial_state: ASSEMBLING
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: ASSEMBLING
        to: SUBMITTED
        trigger: POST /solar-dist/permit-packages/{packageId}/submit
        actor: InstallerRep
        preconditions:
          - "Project.design_locked_at IS NOT NULL (ERR_DESIGN_NOT_LOCKED)"
          - "submitted_documents MUST cover every entry in required_documents (ERR_MISSING_REQUIRED_DOCS)"
        side_effects:
          - "submitted_at = now"
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /solar-dist/permit-packages/{packageId}/approve
        actor: ChannelManager
        preconditions:
          - "Package must be SUBMITTED (ERR_PACKAGE_NOT_SUBMITTED)"
        side_effects:
          - "approved_at = now"
          - "Project payment_status PTO_BILLED path is now eligible"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /solar-dist/permit-packages/{packageId}/reject
        actor: ChannelManager
        preconditions:
          - "Package must be SUBMITTED"
        side_effects: []
      - from: REJECTED
        to: ASSEMBLING
        trigger: POST /solar-dist/permit-packages/{packageId}/reassemble
        actor: InstallerRep
        preconditions:
          - "Package must be REJECTED"
        side_effects:
          - "submitted_at = null; submitted_documents preserved; required_documents recomputed if design changed"
      - from: ASSEMBLING
        to: WITHDRAWN
        trigger: POST /solar-dist/permit-packages/{packageId}/withdraw
        actor: InstallerRep
        preconditions:
          - "Package must be ASSEMBLING or REJECTED"
        side_effects: []

  - entity: DamageClaim
    initial_state: DRAFT
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: POST /solar-dist/damage-claims/{claimId}/file
        actor: DistributionAdmin
        preconditions:
          - "Container must be in RECEIVED (ERR_CONTAINER_NOT_RECEIVED)"
          - "qty_damaged == container_line.qty_damaged (ERR_CLAIM_QTY_MISMATCH)"
        side_effects:
          - "filed_at = now"
          - "claimed_amount_cents computed per damage_claim_amount calculation"
      - from: FILED
        to: SETTLED
        trigger: POST /solar-dist/damage-claims/{claimId}/settle
        actor: CreditOfficer
        preconditions:
          - "Claim must be FILED (ERR_CLAIM_NOT_FILED)"
        side_effects:
          - "settled_at = now"
          - "InventoryLot.qty_quarantined -= qty_damaged; qty_on_hand -= qty_damaged (units are not returned to sellable stock)"
      - from: FILED
        to: DENIED
        trigger: POST /solar-dist/damage-claims/{claimId}/deny
        actor: CreditOfficer
        preconditions:
          - "Claim must be FILED"
        side_effects:
          - "InventoryLot.qty_quarantined -= qty_damaged; qty_on_hand -= qty_damaged (written off as shrinkage either way)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-lot-version
    parent_entity: InventoryLot
    write_endpoint: "POST /solar-dist/projects/{projectId}/allocations"
    occ_field: "expected_lot_version"
    description: |
      Creating an Allocation against an InventoryLot whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another writer has just placed, released, or shipped an allocation against
      the same lot (each legitimately mutating qty_allocated and therefore
      qty_available), so the current writer's view of the lot is stale.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: container-receive-stale-container-version
    parent_entity: Container
    write_endpoint: "POST /solar-dist/containers/{containerId}/receive"
    occ_field: "expected_container_version"
    description: |
      Receiving a Container whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has just
      departed/arrived/updated ETA on the same container — each a legitimate
      state change the current writer may have missed.
    error_id: ERR_STALE_CONTAINER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: landed_cost_per_unit
    trigger: "Container receipt (ARRIVED → RECEIVED)"
    algorithm: waterfall_allocation
    formula: |
      For each ContainerLine on the container, in order of (created_at ASC, line index ASC):
        base_cost_cents   = qty_booked × declared_unit_value_cents
        duty_cents        = round_half_up(base_cost_cents × tariff.duty_rate_bp / 10000)
        freight_share     = round_half_up(container.freight_cost_cents × (base_cost_cents / total_declared_value_cents))
        insurance_share   = round_half_up(container.insurance_cost_cents × (base_cost_cents / total_declared_value_cents))
        landed_total      = base_cost_cents + duty_cents + freight_share + insurance_share
        unit_cost_cents_final = round_half_up(landed_total / qty_received)   # divide by RECEIVED qty, not booked
      Tariff lookup: TariffRate with hts_code == product.hts_code AND
        effective_from <= container.actual_arrival_utc AND (effective_to IS NULL OR container.actual_arrival_utc < effective_to);
        pick the most recent effective_from on ties (created_at DESC).
    input_set: "All ContainerLines on the receiving Container; only TariffRates ACTIVE at container.actual_arrival_utc"
    constants:
      CENTS_PRECISION: 2
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up at every division step"
    variants:
      - name: provisional_landed_cost
        when: "Container not yet received (BOOKED or IN_TRANSIT or ARRIVED) — used to populate InventoryLot.unit_cost_cents_provisional"
        difference: "duty_cents uses the TariffRate effective at booking time (container.created_at), not at actual_arrival_utc; freight_share and insurance_share use the same waterfall but with total_declared_value_cents across all lines; qty_received is unknown so divide by qty_booked. Provisional and final landed cost differ whenever (a) the tariff rate changed between booking and arrival, or (b) qty_received != qty_booked (damage/short)."
      - name: final_landed_cost
        when: "Container RECEIVED — populates InventoryLot.unit_cost_cents_final"
        difference: "Uses tariff at actual_arrival_utc and actual qty_received as denominator."

  - name: progress_invoice_amount
    trigger: "Project fulfillment_status → SHIPPED (PROGRESS invoice issue)"
    algorithm: tiered_pricing
    formula: |
      Let avc = Project.allocated_value_cents (recomputed at issue time using
      shipped allocations' unit_cost_cents_at_allocation; for lots whose
      unit_cost_cents_final is set, that value; else provisional).
      progress_amount_cents = round_half_up(avc × installer.progress_payment_pct_bp / 10000)
    input_set: "Project.allocated_value_cents at invoice time"
    constants:
      BP_BASE: 10000
    precision: "integer cents, round_half_up"
    variants:
      - name: pto_invoice_amount
        when: "Permission-to-operate milestone (PermitPackage APPROVED and POST /invoice-pto)"
        difference: "pto_amount_cents = avc - progress_amount_cents (i.e. the remainder, NOT a recompute against a second percentage). Together the two invoice amounts sum exactly to avc; any rounding residue lands on the PTO invoice."

  - name: credit_exposure
    trigger: "Invoice issue, Payment post/reverse, Invoice void, RMA credit issue, Project write-off"
    algorithm: aggregation
    formula: |
      Installer.credit_exposure_cents = Σ over Invoices where
        invoice.installer_id == installer.id
        AND invoice.status IN {OPEN, PARTIALLY_PAID, PAST_DUE}
        AND invoice.invoice_kind != WRITE_OFF
        of balance_due_cents
      credit_hold = (credit_exposure_cents >= credit_limit_cents)
      Boundary: hold engages AT equality (>=), not above.
    input_set: "Invoices in non-terminal states for this installer; WRITE_OFF invoices excluded (the write-off already recognized the loss)"
    precision: "integer cents"

  - name: allocated_value_cents
    trigger: "Allocation create/ship/release/cancel; Container receive (final cost replaces provisional going forward)"
    algorithm: aggregation
    formula: |
      Project.allocated_value_cents = Σ over Allocations where
        allocation.project_id == project.id
        AND allocation.status IN {OPEN, SHIPPED}
        of (qty_allocated × unit_cost_cents_at_allocation)
      unit_cost_cents_at_allocation is the lot's FINAL cost when set, else PROVISIONAL;
      the snapshot is taken at allocation time and is immutable thereafter.
    input_set: "Project's non-terminal allocations"
    precision: "integer cents"

  - name: damage_claim_amount
    trigger: "DamageClaim DRAFT → FILED"
    algorithm: waterfall_allocation
    formula: |
      For the referenced ContainerLine:
        freight_per_unit_cents = round_half_up(container.freight_cost_cents / Σ line.qty_booked)
        claimed_amount_cents = qty_damaged × (declared_unit_value_cents + freight_per_unit_cents)
      (Insurance share is NOT included in damage claims — only base value + freight.)
    precision: "integer cents, round_half_up"
    constants:
      ROUNDING: round_half_up

  - name: rma_credit_amount
    trigger: "RmaClaim SUBMITTED → APPROVED (set credit_amount_cents)"
    algorithm: aggregation
    formula: |
      credit_amount_cents = qty_approved × allocation.unit_cost_cents_at_allocation
      (Snapshot pricing, not current lot cost — this is the price the installer
      actually paid, not the replacement cost.)
    precision: "integer cents"

  - name: compatibility_check
    trigger: "POST /solar-dist/projects/{id}/lock-design"
    algorithm: constraint_propagation
    formula: |
      Find CompatibilityRule where
        module_product_id  == project.module_product_id
        AND inverter_product_id == project.inverter_product_id
        AND status == ACTIVE
        AND effective_from <= now
        AND (effective_to IS NULL OR now < effective_to)
      If multiple match, pick the one with the latest effective_from (ties: created_at DESC).
      Reject if none matches: ERR_NO_COMPATIBILITY_RULE.
      Reject if project.module_qty < rule.min_modules_per_inverter × project.inverter_qty
              OR project.module_qty > rule.max_modules_per_inverter × project.inverter_qty:
              ERR_STRING_SIZE_VIOLATION.
      Pin rule.id into Project.compatibility_rule_id; freeze it.
      Also reject if Product(module).status != ACTIVE OR Product(inverter).status != ACTIVE: ERR_PRODUCT_NOT_ACTIVE.
    input_set: "ACTIVE CompatibilityRules effective now"
    constants:
      STRING_SAFETY: min ≤ module_qty/inverter_qty ≤ max

  - name: obsolescence_sweep
    trigger: "System, end of each UTC day"
    algorithm: threshold
    formula: |
      For each Product p where p.status == DISCONTINUED:
        max_gen = max(technology_generation) over all Products with same product_kind (any status)
        IF p.technology_generation < max_gen - OBSOLESCENCE_GENERATION_LAG
           AND no InventoryLot references p with qty_on_hand > 0:
          p → OBSOLETE
      For each InventoryLot l where l.status == ON_HAND AND l.product.status == DISCONTINUED:
        IF (now - product.discontinued_at) >= STRANDED_AGE_DAYS:
          l → STRANDED
    constants:
      OBSOLESCENCE_GENERATION_LAG: 2    # product falls 2+ generations behind current max
      STRANDED_AGE_DAYS: 90             # lot stranded 90 days after its product is discontinued
    precision: "integer days; timestamp comparisons strict < and >="

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (per resource type)"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "Target resource must be in correct state for operation (per state machine preconditions)"
    error_id: "varies (ERR_PRODUCT_NOT_ACTIVE, ERR_INSTALLER_NOT_ACTIVE, ERR_ALLOCATION_NOT_OPEN, ERR_CONTAINER_NOT_*, ERR_INVOICE_*, ERR_RMA_*, ERR_PACKAGE_*, ERR_CLAIM_*)"
    http_status: 409
    applies_to: all state transition endpoints

  - priority: 5
    category: business_safety
    check: "Compatibility rule exists AND string-size within bounds at design lock"
    error_id: "ERR_NO_COMPATIBILITY_RULE | ERR_STRING_SIZE_VIOLATION"
    http_status: 422
    applies_to: "POST /solar-dist/projects/{id}/lock-design"

  - priority: 6
    category: business_referential
    check: "Referenced products must be ACTIVE and the FK chain (Project→Installer, Allocation→Lot, ContainerLine→Lot, RmaClaim→Allocation, DamageClaim→ContainerLine) must be intact and non-terminal"
    error_id: "ERR_PRODUCT_NOT_ACTIVE | ERR_INSTALLER_NOT_ACTIVE | ERR_LOT_NOT_ON_HAND | ERR_ALLOCATION_NOT_SHIPPED"
    http_status: 409
    applies_to: "design lock, allocation create, allocation ship, RMA submit, damage claim file"

  - priority: 7
    category: business_constraint
    check: "Credit hold gate: installer.credit_hold == false AND (credit_exposure_cents + qty_allocated × unit_cost_cents_provisional) < credit_limit_cents for the new allocation"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /solar-dist/projects/{id}/allocations"

  - priority: 8
    category: business_constraint
    check: "Inventory availability: lot.qty_available >= requested qty_allocated"
    error_id: ERR_INSUFFICIENT_QTY
    http_status: 409
    applies_to: "POST /solar-dist/projects/{id}/allocations, POST /solar-dist/allocations/{id}/ship"

  - priority: 9
    category: business_temporal
    check: "Container receipt quantity reconciliation: for every line, qty_received + qty_damaged == qty_booked; ETA updates only allowed while BOOKED or IN_TRANSIT"
    error_id: "ERR_RECEIPT_QTY_MISMATCH | ERR_CONTAINER_NOT_UPDATABLE"
    http_status: 409
    applies_to: "POST /solar-dist/containers/{id}/receive, PATCH /solar-dist/containers/{id}"

  - priority: 10
    category: business_fiscal
    check: "Payment amount bounds: 0 < amount_cents <= invoice.balance_due_cents; invoice not VOID"
    error_id: "ERR_INVALID_PAYMENT_AMOUNT | ERR_INVOICE_VOID"
    http_status: 422
    applies_to: "POST /solar-dist/invoices/{id}/payments"

  - priority: 11
    category: business_fiscal
    check: "Invoice-PTO requires PROGRESS_BILLED, PermitPackage APPROVED, fulfillment SHIPPED"
    error_id: "ERR_PROGRESS_NOT_BILLED | ERR_PERMIT_NOT_APPROVED"
    http_status: 409
    applies_to: "POST /solar-dist/projects/{id}/invoice-pto"

  - priority: 12
    category: business_referential
    check: "Installer termination requires credit_exposure_cents == 0 and no in-flight projects"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 402
    applies_to: "POST /solar-dist/installers/{id}/terminate"

  - priority: 13
    category: business_safety
    check: "Permit submission requires all required documents uploaded and design locked"
    error_id: "ERR_MISSING_REQUIRED_DOCS | ERR_DESIGN_NOT_LOCKED"
    http_status: 422
    applies_to: "POST /solar-dist/permit-packages/{id}/submit"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_<parent>_version must match current parent version"
    error_id: "ERR_STALE_LOT_VERSION | ERR_STALE_CONTAINER_VERSION"
    http_status: 412
    applies_to: "POST /solar-dist/projects/{id}/allocations, POST /solar-dist/containers/{id}/receive"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/solar-dist/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical UTC clock. Server default at startup is 2026-08-01T00:00:00Z; this endpoint overrides it. Used to advance time past ETA, due_date, obsolescence lag, and stranded-age thresholds without wall-clock waits."
    roles: [DistributionAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Re-run obsolescence_sweep and past_due marking immediately after the clock moves"

  # --- Product ---
  - method: POST
    path: "/solar-dist/products"
    description: "Create a Product"
    roles: [DistributionAdmin]
    code: 201
    input: [sku, product_kind, manufacturer_name, wattage_w, ac_output_w, dc_input_max_w, technology_generation, hts_code, list_price_cents]
    output: Product
    side_effects:
      - "status = ACTIVE"
      - "wattage_w required iff product_kind == MODULE; ac_output_w and dc_input_max_w required iff product_kind == INVERTER (else 0)"

  - method: GET
    path: "/solar-dist/products"
    description: "List products, with optional filters"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "product_kind?", "status?", "manufacturer_name?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/products/{productId}"
    description: "Get a product"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/solar-dist/products/{productId}/discontinue"
    description: "Discontinue a product; retires its ACTIVE compatibility rules"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Product
    side_effects:
      - "Product.status → DISCONTINUED"
      - "All ACTIVE CompatibilityRules referencing this product → RETIRED"

  # --- CompatibilityRule ---
  - method: POST
    path: "/solar-dist/compatibility-rules"
    description: "Create a CompatibilityRule (module↔inverter pairing)"
    roles: [DistributionAdmin]
    code: 201
    input: [module_product_id, inverter_product_id, max_modules_per_inverter, min_modules_per_inverter, effective_from, "effective_to?"]
    output: CompatibilityRule
    side_effects:
      - "status = ACTIVE"
      - "Validates that referenced products exist, are of correct kind (MODULE/INVERTER), and are ACTIVE"

  - method: GET
    path: "/solar-dist/compatibility-rules"
    description: "List compatibility rules"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "module_product_id?", "inverter_product_id?", "status?"]
    output: "CompatibilityRule[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/compatibility-rules/{ruleId}"
    description: "Get a compatibility rule"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: CompatibilityRule
    side_effects: []

  - method: POST
    path: "/solar-dist/compatibility-rules/{ruleId}/retire"
    description: "Retire a rule"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: CompatibilityRule
    side_effects: ["status → RETIRED; effective_to = now if null"]

  # --- TariffRate ---
  - method: POST
    path: "/solar-dist/tariff-rates"
    description: "Create a TariffRate"
    roles: [DistributionAdmin]
    code: 201
    input: [hts_code, duty_rate_bp, effective_from, "effective_to?"]
    output: TariffRate
    side_effects:
      - "status = ACTIVE"
      - "If another ACTIVE TariffRate exists with same hts_code AND overlapping effective window, reject with ERR_TARIFF_WINDOW_OVERLAP"

  - method: GET
    path: "/solar-dist/tariff-rates"
    description: "List tariff rates"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "hts_code?", "status?"]
    output: "TariffRate[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/tariff-rates/{rateId}"
    description: "Get a tariff rate"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: TariffRate
    side_effects: []

  # --- Installer ---
  - method: POST
    path: "/solar-dist/installers"
    description: "Create an Installer (in ONBOARDING)"
    roles: [ChannelManager]
    code: 201
    input: [legal_name, license_number, credit_limit_cents, progress_payment_pct_bp, payment_terms_days]
    output: Installer
    side_effects:
      - "status = ONBOARDING"
      - "credit_exposure_cents = 0; credit_hold = false"

  - method: GET
    path: "/solar-dist/installers"
    description: "List installers"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Installer[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/installers/{installerId}"
    description: "Get an installer"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: Installer
    side_effects: []

  - method: POST
    path: "/solar-dist/installers/{installerId}/activate"
    description: "Activate an installer (from ONBOARDING)"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Installer
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/solar-dist/installers/{installerId}/suspend"
    description: "Suspend an installer; cancels their OPEN allocations"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: Installer
    side_effects:
      - "status → SUSPENDED"
      - "All OPEN Allocations on this installer's projects → CANCELLED"

  - method: POST
    path: "/solar-dist/installers/{installerId}/reinstate"
    description: "Reinstate a suspended installer"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: Installer
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/solar-dist/installers/{installerId}/terminate"
    description: "Terminate an installer (only if zero exposure and no in-flight projects)"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: Installer
    side_effects: ["status → TERMINATED"]

  # --- Container ---
  - method: POST
    path: "/solar-dist/containers"
    description: "Book a container"
    roles: [DistributionAdmin]
    code: 201
    input: [container_number, bol_number, origin_port, eta_utc, freight_cost_cents, insurance_cost_cents]
    output: Container
    side_effects:
      - "status = BOOKED"

  - method: GET
    path: "/solar-dist/containers"
    description: "List containers"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Container[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/containers/{containerId}"
    description: "Get a container"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: Container
    side_effects: []

  - method: PATCH
    path: "/solar-dist/containers/{containerId}"
    description: "Update container ETA / costs while BOOKED or IN_TRANSIT"
    roles: [DistributionAdmin]
    code: 200
    input: ["eta_utc?", "freight_cost_cents?", "insurance_cost_cents?"]
    output: Container
    side_effects:
      - "Recompute provisional landed cost on all attached InventoryLots (booking-time tariff stays; only freight/insurance shares move)"
      - "Increments Container.version by 1"

  - method: POST
    path: "/solar-dist/containers/{containerId}/depart"
    description: "Mark container departed origin"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Container
    side_effects: ["status → IN_TRANSIT; increments Container.version by 1"]

  - method: POST
    path: "/solar-dist/containers/{containerId}/arrive"
    description: "Mark container arrived at destination port"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Container
    side_effects: ["status → ARRIVED; actual_arrival_utc = now; increments Container.version by 1"]

  - method: POST
    path: "/solar-dist/containers/{containerId}/receive"
    description: "Receive a container: receipts every line, computes final landed cost, transitions lots to ON_HAND"
    roles: [DistributionAdmin]
    code: 200
    input: [expected_container_version, "line_receipts"]   # line_receipts: [{ container_line_id, qty_received, qty_damaged }]
    output: Container
    side_effects:
      - "Per line: validate qty_received + qty_damaged == qty_booked"
      - "Per line: compute landed_cost_per_unit; set InventoryLot.qty_on_hand, qty_quarantined, unit_cost_cents_final, received_at; lot → ON_HAND"
      - "status → RECEIVED; increments Container.version by 1"

  - method: POST
    path: "/solar-dist/containers/{containerId}/close"
    description: "Close a received container (after all damage claims settle)"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Container
    side_effects: ["status → CLOSED"]

  - method: POST
    path: "/solar-dist/containers/{containerId}/cancel"
    description: "Cancel a booked container"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Container
    side_effects: ["status → CANCELLED; all attached InventoryLots → WRITTEN_OFF"]

  # --- ContainerLine ---
  - method: POST
    path: "/solar-dist/containers/{containerId}/lines"
    description: "Add a container line (creates the corresponding InventoryLot in IN_TRANSIT)"
    roles: [DistributionAdmin]
    code: 201
    input: [product_id, qty_booked, declared_unit_value_cents]
    output: ContainerLine
    side_effects:
      - "Create InventoryLot for this product with status=IN_TRANSIT, qty_on_hand=0, unit_cost_cents_provisional computed using tariff at booking time"
      - "container_id and inventory_lot_id populated"

  - method: GET
    path: "/solar-dist/containers/{containerId}/lines"
    description: "List lines on a container"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContainerLine[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/containers/{containerId}/lines/{lineId}"
    description: "Get a container line"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: ContainerLine
    side_effects: []

  # Top-level ContainerLine list (filtered) — required for FK reverse-reachability of
  # ContainerLine.{product_id, inventory_lot_id, container_id}
  - method: GET
    path: "/solar-dist/container-lines"
    description: "List all container lines, filterable"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "container_id?", "inventory_lot_id?", "product_id?"]
    output: "ContainerLine[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/container-lines/{lineId}"
    description: "Get a container line by id (top-level alias; registers container-lines collection)"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: ContainerLine
    side_effects: []

  # --- InventoryLot ---
  - method: GET
    path: "/solar-dist/inventory-lots"
    description: "List inventory lots"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "product_id?", "status?"]
    output: "InventoryLot[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/inventory-lots/{lotId}"
    description: "Get an inventory lot"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: POST
    path: "/solar-dist/inventory-lots/{lotId}/write-off"
    description: "Write off a stranded lot"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["status → WRITTEN_OFF; qty_on_hand and qty_quarantined → 0"]

  # --- Project ---
  - method: POST
    path: "/solar-dist/installers/{installerId}/projects"
    description: "Create a Project (in DESIGN)"
    roles: [InstallerRep, ChannelManager]
    code: 201
    input: [project_name, site_postal_code, module_product_id, inverter_product_id, module_qty, inverter_qty]
    output: Project
    side_effects:
      - "fulfillment_status = DESIGN; payment_status = UNBILLED"
      - "Installer must be ACTIVE"

  - method: GET
    path: "/solar-dist/installers/{installerId}/projects"
    description: "List an installer's projects"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "fulfillment_status?", "payment_status?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/projects/{projectId}"
    description: "Get a project"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: Project
    side_effects: []

  # Top-level Project list — registers `projects` collection and supports FK reverse-reachability
  - method: GET
    path: "/solar-dist/projects"
    description: "List all projects across installers (filterable)"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "installer_id?", "module_product_id?", "inverter_product_id?", "compatibility_rule_id?", "fulfillment_status?", "payment_status?"]
    output: "Project[]"
    side_effects: []

  - method: POST
    path: "/solar-dist/projects/{projectId}/lock-design"
    description: "Lock the design; validates compatibility and string size; pins compatibility_rule_id; computes system_size_kw_dc"
    roles: [InstallerRep, ChannelManager]
    code: 200
    input: []
    output: Project
    side_effects:
      - "design_locked_at = now"
      - "compatibility_rule_id pinned"
      - "system_size_kw_dc computed"
      - "Auto-create PermitPackage for this project in ASSEMBLING with required_documents derived from module+inverter product docs"

  - method: POST
    path: "/solar-dist/projects/{projectId}/cancel"
    description: "Cancel a project (DESIGN or ALLOCATED only)"
    roles: [InstallerRep, ChannelManager]
    code: 200
    input: []
    output: Project
    side_effects:
      - "fulfillment_status → CANCELLED"
      - "All OPEN Allocations → CANCELLED"

  - method: POST
    path: "/solar-dist/projects/{projectId}/complete"
    description: "Mark project complete (SHIPPED + PAID_IN_FULL + permit APPROVED)"
    roles: [InstallerRep]
    code: 200
    input: []
    output: Project
    side_effects: ["fulfillment_status → COMPLETE"]

  - method: POST
    path: "/solar-dist/projects/{projectId}/invoice-pto"
    description: "Issue PTO invoice for the remainder"
    roles: [ChannelManager]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Invoice created with invoice_kind=PTO, amount_cents = avc - progress_amount_cents"
      - "Project.payment_status → PTO_BILLED"
      - "Installer.credit_exposure_cents recomputed"

  - method: POST
    path: "/solar-dist/projects/{projectId}/write-off"
    description: "Write off a project's outstanding balance"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "WRITE_OFF invoice created equal to outstanding balance"
      - "payment_status → WRITTEN_OFF"
      - "Installer.credit_exposure_cents recomputed (write-off excluded from exposure)"

  # --- Allocation ---
  - method: POST
    path: "/solar-dist/projects/{projectId}/allocations"
    description: "Create an Allocation against an InventoryLot"
    roles: [InstallerRep, ChannelManager]
    code: 201
    input: [inventory_lot_id, qty_allocated, expected_lot_version]
    output: Allocation
    side_effects:
      - "Allocation.status = OPEN; allocated_at = now"
      - "Snapshot unit_cost_cents_at_allocation (final if set, else provisional)"
      - "Lot.qty_allocated += qty_allocated"
      - "Project.allocated_value_cents recomputed"
      - "If design locked and this is the first OPEN allocation: fulfillment_status → ALLOCATED"
      - "Installer.credit_hold re-evaluated"
      - "Increments InventoryLot.version by 1"

  - method: GET
    path: "/solar-dist/projects/{projectId}/allocations"
    description: "List allocations on a project"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Allocation[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/allocations/{allocationId}"
    description: "Get an allocation"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  # Top-level Allocation list — supports FK reverse-reachability for project_id, inventory_lot_id
  - method: GET
    path: "/solar-dist/allocations"
    description: "List all allocations (filterable)"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "project_id?", "inventory_lot_id?", "status?"]
    output: "Allocation[]"
    side_effects: []

  - method: POST
    path: "/solar-dist/allocations/{allocationId}/ship"
    description: "Ship an OPEN allocation"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: Allocation
    side_effects:
      - "status → SHIPPED; shipped_at = now"
      - "Lot.qty_on_hand -= qty_allocated; Lot.qty_allocated -= qty_allocated"
      - "Project.fulfillment_status re-evaluated (→ PARTIALLY_SHIPPED or SHIPPED; if SHIPPED, cascades to PROGRESS invoice issue)"
      - "Increments InventoryLot.version by 1; increments Allocation.version by 1"

  - method: POST
    path: "/solar-dist/allocations/{allocationId}/release"
    description: "Release an OPEN allocation (return units to available pool)"
    roles: [InstallerRep, ChannelManager]
    code: 200
    input: []
    output: Allocation
    side_effects:
      - "status → RELEASED; released_at = now"
      - "Lot.qty_allocated -= qty_allocated"
      - "Project.allocated_value_cents recomputed"
      - "Increments InventoryLot.version by 1"

  # --- Invoice ---
  - method: GET
    path: "/solar-dist/projects/{projectId}/invoices"
    description: "List invoices on a project"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "invoice_kind?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/installers/{installerId}/invoices"
    description: "List an installer's invoices (credit ledger view)"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "invoice_kind?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  # Top-level Invoice list — supports FK reverse-reachability for project_id, installer_id
  - method: GET
    path: "/solar-dist/invoices"
    description: "List all invoices (filterable)"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "project_id?", "installer_id?", "status?", "invoice_kind?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/solar-dist/invoices/{invoiceId}/void"
    description: "Void an OPEN invoice with no payments"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → VOID; credit_exposure recomputed"]

  # --- Payment ---
  - method: POST
    path: "/solar-dist/invoices/{invoiceId}/payments"
    description: "Post a payment against an invoice"
    roles: [InstallerRep, CreditOfficer]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects:
      - "Payment.status = POSTED; posted_at = now"
      - "Invoice.balance_due_cents -= amount_cents; status re-evaluated (OPEN→PARTIALLY_PAID or →PAID)"
      - "Installer.credit_exposure_cents recomputed"
      - "Project.paid_value_cents recomputed; payment_status re-evaluated"

  - method: GET
    path: "/solar-dist/invoices/{invoiceId}/payments"
    description: "List payments on an invoice"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/payments/{paymentId}"
    description: "Get a payment"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # Top-level Payment list — supports FK reverse-reachability for invoice_id
  - method: GET
    path: "/solar-dist/payments"
    description: "List all payments (filterable)"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "invoice_id?", "status?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/solar-dist/payments/{paymentId}/reverse"
    description: "Reverse a posted payment"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Payment → REVERSED; reversed_at = now"
      - "Invoice balance_due_cents += amount_cents; status reverts PAID → PARTIALLY_PAID or OPEN"
      - "credit_exposure and paid_value recomputed"

  # --- RmaClaim ---
  - method: POST
    path: "/solar-dist/rma-claims"
    description: "Create an RMA claim (DRAFT)"
    roles: [InstallerRep]
    code: 201
    input: [installer_id, product_id, allocation_id, qty_claimed]
    output: RmaClaim
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/solar-dist/rma-claims"
    description: "List RMA claims"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "installer_id?", "product_id?", "allocation_id?", "status?"]
    output: "RmaClaim[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/rma-claims/{rmaId}"
    description: "Get an RMA claim"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: RmaClaim
    side_effects: []

  - method: POST
    path: "/solar-dist/rma-claims/{rmaId}/submit"
    description: "Submit a DRAFT claim to the manufacturer"
    roles: [InstallerRep]
    code: 200
    input: []
    output: RmaClaim
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/solar-dist/rma-claims/{rmaId}/approve"
    description: "Approve a submitted claim (channel side, on manufacturer response)"
    roles: [ChannelManager]
    code: 200
    input: [qty_approved, "manufacturer_rma_number?"]
    output: RmaClaim
    side_effects:
      - "status → APPROVED; qty_approved set"
      - "credit_amount_cents computed"

  - method: POST
    path: "/solar-dist/rma-claims/{rmaId}/reject"
    description: "Reject a submitted claim"
    roles: [ChannelManager]
    code: 200
    input: []
    output: RmaClaim
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/solar-dist/rma-claims/{rmaId}/issue-credit"
    description: "Issue the credit memo against installer open invoices"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "CREDIT_MEMO invoice created with amount_cents = -credit_amount_cents"
      - "Applied oldest-first against installer's OPEN/PARTIALLY_PAID/PAST_DUE invoices by invoice_date ASC then created_at ASC"
      - "Each target invoice balance_due_cents reduced (floor 0); any residual credit sits as a negative-balance invoice"
      - "RmaClaim → CREDIT_ISSUED"
      - "credit_exposure recomputed"

  - method: POST
    path: "/solar-dist/rma-claims/{rmaId}/close"
    description: "Close a credit-issued claim"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: RmaClaim
    side_effects: ["status → CLOSED"]

  # --- PermitPackage ---
  - method: GET
    path: "/solar-dist/projects/{projectId}/permit-packages"
    description: "List permit packages for a project"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PermitPackage[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/permit-packages/{packageId}"
    description: "Get a permit package"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: PermitPackage
    side_effects: []

  # Top-level PermitPackage list — supports FK reverse-reachability for project_id
  - method: GET
    path: "/solar-dist/permit-packages"
    description: "List all permit packages (filterable)"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "project_id?", "status?"]
    output: "PermitPackage[]"
    side_effects: []

  - method: POST
    path: "/solar-dist/permit-packages/{packageId}/documents"
    description: "Upload a document to the package"
    roles: [InstallerRep]
    code: 200
    input: [document_slug]
    output: PermitPackage
    side_effects: ["document_slug appended to submitted_documents (idempotent on re-upload of same slug)"]

  - method: POST
    path: "/solar-dist/permit-packages/{packageId}/submit"
    description: "Submit the package to AHJ"
    roles: [InstallerRep]
    code: 200
    input: []
    output: PermitPackage
    side_effects: ["status → SUBMITTED; submitted_at = now"]

  - method: POST
    path: "/solar-dist/permit-packages/{packageId}/approve"
    description: "Mark package approved by AHJ"
    roles: [ChannelManager]
    code: 200
    input: []
    output: PermitPackage
    side_effects: ["status → APPROVED; approved_at = now"]

  - method: POST
    path: "/solar-dist/permit-packages/{packageId}/reject"
    description: "Mark package rejected by AHJ"
    roles: [ChannelManager]
    code: 200
    input: []
    output: PermitPackage
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/solar-dist/permit-packages/{packageId}/reassemble"
    description: "Re-open a rejected package"
    roles: [InstallerRep]
    code: 200
    input: []
    output: PermitPackage
    side_effects: ["status → ASSEMBLING; submitted_at cleared"]

  - method: POST
    path: "/solar-dist/permit-packages/{packageId}/withdraw"
    description: "Withdraw an assembling/rejected package"
    roles: [InstallerRep]
    code: 200
    input: []
    output: PermitPackage
    side_effects: ["status → WITHDRAWN"]

  # --- DamageClaim ---
  - method: POST
    path: "/solar-dist/containers/{containerId}/damage-claims"
    description: "Create a damage claim against a container line"
    roles: [DistributionAdmin]
    code: 201
    input: [container_line_id, qty_damaged]
    output: DamageClaim
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/solar-dist/containers/{containerId}/damage-claims"
    description: "List damage claims on a container"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DamageClaim[]"
    side_effects: []

  - method: GET
    path: "/solar-dist/damage-claims/{claimId}"
    description: "Get a damage claim"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []

  # Top-level DamageClaim list — supports FK reverse-reachability for container_id, container_line_id
  - method: GET
    path: "/solar-dist/damage-claims"
    description: "List all damage claims (filterable)"
    roles: [DistributionAdmin, ChannelManager, InstallerRep, CreditOfficer]
    code: 200
    input: ["limit?", "offset?", "container_id?", "container_line_id?", "status?"]
    output: "DamageClaim[]"
    side_effects: []

  - method: POST
    path: "/solar-dist/damage-claims/{claimId}/file"
    description: "File a draft damage claim"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status → FILED; filed_at = now; claimed_amount_cents computed"]

  - method: POST
    path: "/solar-dist/damage-claims/{claimId}/settle"
    description: "Settle a filed damage claim (carrier pays)"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: DamageClaim
    side_effects:
      - "status → SETTLED; settled_at = now"
      - "Lot.qty_quarantined -= qty_damaged; qty_on_hand -= qty_damaged"

  - method: POST
    path: "/solar-dist/damage-claims/{claimId}/deny"
    description: "Deny a filed damage claim"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: DamageClaim
    side_effects:
      - "status → DENIED"
      - "Lot.qty_quarantined -= qty_damaged; qty_on_hand -= qty_damaged (shrinkage)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }

  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Generic request validation failure (missing required field, malformed type)" }
  - { id: ERR_INVALID_PROGRESS_PCT, http: 400, condition: "progress_payment_pct_bp outside [0, 10000]" }
  - { id: ERR_INVALID_PAYMENT_TERMS, http: 400, condition: "payment_terms_days must be > 0" }
  - { id: ERR_CREDIT_LIMIT_REQUIRED, http: 400, condition: "credit_limit_cents must be > 0 at activation" }
  - { id: ERR_INVALID_QTY_CLAIMED, http: 422, condition: "qty_claimed must be > 0 and <= source allocation qty" }
  - { id: ERR_INVALID_PAYMENT_AMOUNT, http: 422, condition: "Payment amount must be > 0 and <= invoice balance_due_cents" }

  # --- Not Found ---
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product not found" }
  - { id: ERR_RULE_NOT_FOUND, http: 404, condition: "CompatibilityRule not found" }
  - { id: ERR_TARIFF_NOT_FOUND, http: 404, condition: "TariffRate not found" }
  - { id: ERR_INSTALLER_NOT_FOUND, http: 404, condition: "Installer not found" }
  - { id: ERR_CONTAINER_NOT_FOUND, http: 404, condition: "Container not found" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "ContainerLine not found" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "InventoryLot not found" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Project not found" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Allocation not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice not found" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Payment not found" }
  - { id: ERR_RMA_NOT_FOUND, http: 404, condition: "RmaClaim not found" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "PermitPackage not found" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "DamageClaim not found" }

  # --- State ---
  - { id: ERR_PRODUCT_NOT_ACTIVE, http: 409, condition: "Product must be ACTIVE for this operation" }
  - { id: ERR_RULE_NOT_ACTIVE, http: 409, condition: "CompatibilityRule must be ACTIVE" }
  - { id: ERR_RULE_IN_USE, http: 409, condition: "Cannot retire a rule referenced by an unlocked project design" }
  - { id: ERR_INSTALLER_NOT_ACTIVE, http: 409, condition: "Installer must be ACTIVE" }
  - { id: ERR_INSTALLER_NOT_SUSPENDED, http: 409, condition: "Installer must be SUSPENDED for reinstate" }
  - { id: ERR_CONTAINER_NOT_BOOKED, http: 409, condition: "Container must be BOOKED" }
  - { id: ERR_CONTAINER_NOT_IN_TRANSIT, http: 409, condition: "Container must be IN_TRANSIT" }
  - { id: ERR_CONTAINER_NOT_ARRIVED, http: 409, condition: "Container must be ARRIVED" }
  - { id: ERR_CONTAINER_NOT_RECEIVED, http: 409, condition: "Container must be RECEIVED" }
  - { id: ERR_CONTAINER_NOT_CANCELLABLE, http: 409, condition: "Container can only be cancelled while BOOKED" }
  - { id: ERR_CONTAINER_NOT_UPDATABLE, http: 409, condition: "Container fields may only be updated while BOOKED or IN_TRANSIT" }
  - { id: ERR_RECEIPT_QTY_MISMATCH, http: 409, condition: "qty_received + qty_damaged != qty_booked on a line" }
  - { id: ERR_LOT_NOT_ON_HAND, http: 409, condition: "InventoryLot must be ON_HAND for allocation ship" }
  - { id: ERR_LOT_NOT_STRANDED, http: 409, condition: "InventoryLot must be STRANDED for write-off" }
  - { id: ERR_ALLOCATIONS_OUTSTANDING, http: 409, condition: "Lot has non-terminal allocations blocking write-off" }
  - { id: ERR_PROJECT_NOT_CANCELLABLE, http: 409, condition: "Project in SHIPPED/PARTIALLY_SHIPPED/COMPLETE/CANCELLED cannot be cancelled" }
  - { id: ERR_SHIPPED_ALLOCATIONS_EXIST, http: 409, condition: "Cannot cancel a project with SHIPPED allocations" }
  - { id: ERR_ALLOCATION_NOT_OPEN, http: 409, condition: "Allocation must be OPEN" }
  - { id: ERR_ALLOCATION_NOT_SHIPPED, http: 409, condition: "Allocation must be SHIPPED for RMA" }
  - { id: ERR_PROGRESS_NOT_BILLED, http: 409, condition: "PTO invoice requires payment_status=PROGRESS_BILLED" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "PermitPackage must be APPROVED for PTO invoice or project completion" }
  - { id: ERR_UNPAID_BALANCE, http: 409, condition: "Cannot complete project while payment_status != PAID_IN_FULL" }
  - { id: ERR_INVOICE_VOID, http: 409, condition: "Cannot post a payment to a VOID invoice" }
  - { id: ERR_PAYMENT_NOT_POSTED, http: 409, condition: "Payment must be POSTED to reverse" }
  - { id: ERR_RMA_NOT_SUBMITTED, http: 409, condition: "RMA must be SUBMITTED to approve/reject" }
  - { id: ERR_RMA_NOT_APPROVED, http: 409, condition: "RMA must be APPROVED to issue credit" }
  - { id: ERR_PACKAGE_NOT_SUBMITTED, http: 409, condition: "PermitPackage must be SUBMITTED" }
  - { id: ERR_DESIGN_NOT_LOCKED, http: 409, condition: "Design must be locked before permit submission or allocation" }
  - { id: ERR_CLAIM_NOT_FILED, http: 409, condition: "DamageClaim must be FILED" }
  - { id: ERR_CLAIM_QTY_MISMATCH, http: 409, condition: "DamageClaim.qty_damaged must equal container line qty_damaged" }
  - { id: ERR_OPEN_DAMAGE_CLAIMS, http: 409, condition: "Container cannot close while damage claims are unsettled" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 402, condition: "Installer credit_exposure_cents must be 0 to terminate" }

  # --- Business (constraint / fiscal) ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Allocation would push credit exposure to/over credit limit" }
  - { id: ERR_INSUFFICIENT_QTY, http: 409, condition: "Lot does not have enough qty_available" }
  - { id: ERR_NO_COMPATIBILITY_RULE, http: 422, condition: "No ACTIVE CompatibilityRule covers the module↔inverter pair at lock time" }
  - { id: ERR_STRING_SIZE_VIOLATION, http: 422, condition: "module_qty / inverter_qty ratio outside [min, max] modules per inverter" }
  - { id: ERR_MISSING_REQUIRED_DOCS, http: 422, condition: "Permit submission requires every document in required_documents" }
  - { id: ERR_TARIFF_WINDOW_OVERLAP, http: 409, condition: "An ACTIVE TariffRate already covers this hts_code over the proposed effective window" }

  # --- OCC ---
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version does not match current InventoryLot.version" }
  - { id: ERR_STALE_CONTAINER_VERSION, http: 412, condition: "expected_container_version does not match current Container.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistributionAdmin
    description: "Runs the distribution warehouse side: products, compatibility rules, tariffs, containers, receipts, allocation shipment, damage claim filing"
    identity: opaque
    exclusive_operations:
      - "POST /solar-dist/products — create product"
      - "POST /solar-dist/products/{id}/discontinue"
      - "POST /solar-dist/compatibility-rules — create rule"
      - "POST /solar-dist/compatibility-rules/{id}/retire"
      - "POST /solar-dist/tariff-rates"
      - "POST /solar-dist/containers — book"
      - "PATCH /solar-dist/containers/{id}"
      - "POST /solar-dist/containers/{id}/depart|arrive|receive|close|cancel"
      - "POST /solar-dist/containers/{id}/lines"
      - "POST /solar-dist/containers/{id}/damage-claims"
      - "POST /solar-dist/damage-claims/{id}/file"
      - "POST /solar-dist/allocations/{id}/ship"
      - "POST /solar-dist/_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"

  - name: ChannelManager
    description: "Manages installer channel: onboarding, project oversight, PTO invoicing, RMA approval, permit approval"
    identity: opaque
    exclusive_operations:
      - "POST /solar-dist/installers — create"
      - "POST /solar-dist/installers/{id}/activate"
      - "POST /solar-dist/projects/{id}/invoice-pto"
      - "POST /solar-dist/rma-claims/{id}/approve|reject"
      - "POST /solar-dist/permit-packages/{id}/approve|reject"
    shared_operations:
      - "POST /solar-dist/installers/{id}/projects — create project (shared with InstallerRep)"
      - "POST /solar-dist/projects/{id}/lock-design (shared with InstallerRep)"
      - "POST /solar-dist/projects/{id}/cancel (shared with InstallerRep)"
      - "POST /solar-dist/projects/{id}/allocations (shared with InstallerRep)"
      - "POST /solar-dist/allocations/{id}/release (shared with InstallerRep)"
      - "GET reads across all resources"

  - name: InstallerRep
    description: "Acts on behalf of an installer company: designs projects, allocates inventory, submits permits, files RMAs, posts payments"
    identity: "entity_backed:Installer"
    exclusive_operations:
      - "POST /solar-dist/rma-claims — create (installer_id must equal X-User-ID)"
      - "POST /solar-dist/rma-claims/{id}/submit"
      - "POST /solar-dist/permit-packages/{id}/documents|submit|reassemble|withdraw"
      - "POST /solar-dist/projects/{id}/complete"
    shared_operations:
      - "POST /solar-dist/installers/{id}/projects — create project (only when installer_id == X-User-ID; else ERR_INSUFFICIENT_PERMISSIONS)"
      - "POST /solar-dist/projects/{id}/lock-design (only on own projects)"
      - "POST /solar-dist/projects/{id}/cancel (only on own projects)"
      - "POST /solar-dist/projects/{id}/allocations (only on own projects)"
      - "POST /solar-dist/allocations/{id}/release (only on own projects)"
      - "POST /solar-dist/invoices/{id}/payments (only on own invoices; shared with CreditOfficer)"
      - "GET reads across all resources"

  - name: CreditOfficer
    description: "Controls credit: suspend/reinstate/terminate installers, void invoices, reverse payments, issue RMA credits, write off stranded lots and bad debt, settle/deny damage claims"
    identity: opaque
    exclusive_operations:
      - "POST /solar-dist/installers/{id}/suspend|reinstate|terminate"
      - "POST /solar-dist/invoices/{id}/void"
      - "POST /solar-dist/payments/{id}/reverse"
      - "POST /solar-dist/rma-claims/{id}/issue-credit|close"
      - "POST /solar-dist/projects/{id}/write-off"
      - "POST /solar-dist/inventory-lots/{id}/write-off"
      - "POST /solar-dist/damage-claims/{id}/settle|deny"
    shared_operations:
      - "POST /solar-dist/invoices/{id}/payments (shared with InstallerRep)"
      - "GET reads across all resources"
