              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Thornbury Guild Court", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-42.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/plans/${plan_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 1182500, contingency_pct: 0.10, financing_source: "OWNER_EQUITY", expected_plan_version: "${plan_v}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { budget_id: $.data.id }
            - call: "POST /pip/capital-budgets/${budget_id}/approve"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/capital-budgets/${budget_id}/lock"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          trigger:
            - call: "POST /pip/items/${item_id}/start"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { started_status: $.data.status }
            - call: "GET /pip/plans/${plan_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/properties/${prop_id}/risk-summary"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { snapshot: $.data.snapshot_score }
            - call: "GET /pip/franchisee-accounts/${fr_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          assert:
            - "${started_status} == \"IN_PROGRESS\" straight out of the write's own response body"
            - "the plan read immediately afterwards shows status == IN_EXECUTION with no intervening call"
            - "${snapshot} == 100 with snapshot_posture COMPLIANT, funding_gap_cents 0 and funding_gap_penalty 0"
            - "the risk summary's projected_score == 100 as well, since no unstarted item is due inside the 30-day horizon"
            - "FranchiseeAccount.${fr_id}.standing == GOOD in the same chain"
            - "Property.${prop_id}.compliance_risk_score == 100 and open_plan_count == 1"
