              as_user_id: "compliance-1"
          trigger:
            - call: "POST /recruitment/commission-entries/${e1_id}/disposition"
              payload: { action: "PAY" }
              as: FinanceOfficer
              as_user_id: "finance-2"
              captures: { err_pay: "$.data.error_id" }
            - call: "POST /recruitment/agencies/${ag1_id}/posture-actions"
              payload: { action: "REINSTATE", reason: "Inquiry closed" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/commission-entries/${e1_id}/disposition"
              payload: { action: "PAY" }
              as: FinanceOfficer
              as_user_id: "finance-2"
          assert:
            - "the first PAY returns HTTP 422 with data.error_id == \"ERR_AGENCY_POSTURE_BLOCKED\" and CommissionEntry.${e1_id}.state stays \"APPROVED\" with paid_by_user_id == null"
            - "Agency.${ag1_id}.compliance_posture == \"WATCH\" after REINSTATE"
            - "the second PAY returns HTTP 200, CommissionEntry.${e1_id}.state == \"PAID\", .approved_by_user_id == \"finance-1\", .paid_by_user_id == \"finance-2\""
            - "AgentContract.${c1_id}.status == \"SUSPENDED\" (payment does not depend on the contract state, only on the agency posture)"
            - "Agency.${ag1_id}.net_earned_commission_cents == 113828 and .clawback_liability_cents == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusive_territory_cooloff_shadow_blocks_adjacent_interval
        grounds:
          - calculations.territory_exclusive_occupancy
          - validations[priority=65]
          - errors[ERR_TERRITORY_EXCLUSIVITY_CONFLICT]
          - endpoints["GET /recruitment/territory-occupancy"]
        distinguishing_aspect: |
          Overlap semantics one: half-open intervals plus a 30-day TRAILING cool-off buffer on
          EXCLUSIVE occupation, so a request starting exactly on the incumbent's end_date
          (2026-12-01) is rejected while the same request starting on the cool-off end
          (2026-12-31) is accepted - the conflict comes from the buffer, not from any shared
          instant.
        test_recipe:
          setup:
            - "Agency ag1 holds an ACTIVE EXCLUSIVE IN assignment over [2026-08-01, 2026-12-01) on contract c1."
            - "Agency ag2 has its own DRAFT contract c2 with exclusivity_model EXCLUSIVE_ALLOWED over the same term window."
            - "Logical clock stays at 2026-08-01, so neither assignment can be swept to EXPIRED."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Sunrise Education Consultants", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 2, sanctions_screen_passed: true, reference_check_count: 3 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-2026-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id" }
            - call: "POST /recruitment/contracts/${c1_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "EXCLUSIVE", start_date: "2026-08-01", end_date: "2026-12-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { t1_id: "$.data.id" }
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Global Pathways Partners", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag2_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag2_id}", contract_ref: "CTR-2026-002", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 4000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c2_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/contracts/${c2_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "EXCLUSIVE", start_date: "2026-12-01", end_date: "2027-03-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_cooloff: "$.data.error_id" }
            - call: "GET /recruitment/territory-occupancy"
              payload: { country_code: "IN", at_date: "2026-12-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts/${c2_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "EXCLUSIVE", start_date: "2026-12-31", end_date: "2027-03-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { t2_id: "$.data.id" }
          assert:
            - "the 2026-12-01 request returns HTTP 409 with data.error_id == \"ERR_TERRITORY_EXCLUSIVITY_CONFLICT\" even though [2026-12-01, 2027-03-01) shares no instant with [2026-08-01, 2026-12-01)"
            - "GET /recruitment/territory-occupancy?country_code=IN&at_date=2026-12-15 returns exclusive_active_count == 0, non_exclusive_active_count == 0, exclusive_cooloff_until == \"2026-12-31\", exclusive_slot_available == false"
            - "the 2026-12-31 request returns HTTP 201; TerritoryAssignment.${t2_id}.start_date == \"2026-12-31\", .status == \"ACTIVE\", .contract_id == ${c2_id}"
            - "TerritoryAssignment.${t1_id}.status == \"ACTIVE\" and .end_date == \"2026-12-01\" (the incumbent is untouched by either attempt)"
            - "count(TerritoryAssignment where contract_id == ${c2_id}) == 1"

      - name: commission_schedule_contiguous_tiling_rejects_overlap_and_gap
        grounds:
          - validations[priority=67]
          - validations[priority=68]
          - errors[ERR_SCHEDULE_INTERVAL_CONFLICT]
          - errors[ERR_SCHEDULE_GAP]
          - concurrency_rules[schedule-create-stale-contract]
          - entities.CommissionSchedule.fields.version_no
        distinguishing_aspect: |
          Overlap semantics two on a different resource: rate cards must TILE the contract term
          with neither overlap nor gap, so 2026-10-15 is rejected as an overlap
          (ERR_SCHEDULE_INTERVAL_CONFLICT), 2026-11-15 is rejected as a gap (ERR_SCHEDULE_GAP)
          and only the exact seam 2026-11-01 is accepted - a zero-tolerance adjacency rule
          rather than the buffered exclusion of the territory rule.
        test_recipe:
          setup:
            - "Contract c1 for agency ag1 runs 2026-08-01..2027-07-31 and already carries rate card v1 over [2026-08-01, 2026-11-01)."
            - "The contract version observed after that first rate card is captured for the OCC field of every subsequent attempt."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Sunrise Education Consultants", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 2, sanctions_screen_passed: true, reference_check_count: 3 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-2026-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id", c1_v0: "$.data.version" }
            - call: "POST /recruitment/contracts/${c1_id}/commission-schedules"
              payload: { effective_from: "2026-08-01", effective_to: "2026-11-01", deposit_rate_bps: 400, enrollment_rate_bps: 500, census_rate_bps: 200, persistence_rate_bps: 150, rate_cap_bps: 600, per_milestone_cap_cents: 150000, clawback_window_days: 120, expected_contract_version: "${c1_v0}" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { s1_id: "$.data.id" }
            - call: "GET /recruitment/contracts/${c1_id}"
              payload: {}
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_v1: "$.data.version" }
          trigger:
            - call: "POST /recruitment/contracts/${c1_id}/commission-schedules"
              payload: { effective_from: "2026-10-15", effective_to: "2027-02-01", deposit_rate_bps: 420, enrollment_rate_bps: 520, census_rate_bps: 210, persistence_rate_bps: 160, rate_cap_bps: 600, per_milestone_cap_cents: 150000, clawback_window_days: 120, expected_contract_version: "${c1_v1}" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /recruitment/contracts/${c1_id}/commission-schedules"
              payload: { effective_from: "2026-11-15", effective_to: "2027-02-01", deposit_rate_bps: 420, enrollment_rate_bps: 520, census_rate_bps: 210, persistence_rate_bps: 160, rate_cap_bps: 600, per_milestone_cap_cents: 150000, clawback_window_days: 120, expected_contract_version: "${c1_v1}" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_gap: "$.data.error_id" }
            - call: "POST /recruitment/contracts/${c1_id}/commission-schedules"
              payload: { effective_from: "2026-11-01", effective_to: "2027-02-01", deposit_rate_bps: 420, enrollment_rate_bps: 520, census_rate_bps: 210, persistence_rate_bps: 160, rate_cap_bps: 600, per_milestone_cap_cents: 150000, clawback_window_days: 120, expected_contract_version: "${c1_v1}" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { s2_id: "$.data.id" }
          assert:
            - "the 2026-10-15 attempt returns HTTP 409 with data.error_id == \"ERR_SCHEDULE_INTERVAL_CONFLICT\""
            - "the 2026-11-15 attempt returns HTTP 409 with data.error_id == \"ERR_SCHEDULE_GAP\""
            - "the 2026-11-01 attempt returns HTTP 201; CommissionSchedule.${s2_id}.version_no == 2 and .effective_from == \"2026-11-01\""
            - "count(CommissionSchedule where contract_id == ${c1_id}) == 2 (neither rejected attempt persisted a row)"
            - "AgentContract.${c1_id}.version increased by exactly 1 relative to ${c1_v1} (only the accepted append bumped the parent version)"
            - "CommissionSchedule.${s1_id}.effective_to == \"2026-11-01\" and CommissionSchedule.${s2_id}.effective_from == \"2026-11-01\" tile with zero gap and zero overlap"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdrawal_clawback_restores_zero_net_with_paid_liability
        grounds:
          - calculations.withdrawal_clawback_ledger
          - calculations.agency_commission_ledger_balance
          - state_machines.CommissionEntry.PAID_to_CLAWED_BACK
          - entities.Agency.fields.net_earned_commission_cents
          - entities.Agency.fields.clawback_liability_cents
        distinguishing_aspect: |
          The conserved quantity is monetary: a withdrawal strictly before Program.census_date
          claws back 100% of both accruals (113828 + 142285), so the agency's
          net_earned_commission_cents returns to exactly 0 while clawback_liability_cents
          retains 113828 - the portion that had already been PAID and therefore left the
          institution.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED with ACTIVE contract c1 (cap 5000000) and no scorecards, so every accrual is priced at tier UNRATED."
            - "Application a1 on MSCS-2026 (census_date 2026-09-30) registered DEPOSIT_PAID on 2026-09-05 (113828 cents, APPROVED by finance-1 then PAID by finance-2) and ENROLLED on 2026-09-10 (142285 cents, still ACCRUED)."
            - "Agency.net_earned_commission_cents is 256113 and clawback_liability_cents is 0 immediately before the trigger."
            - "Logical clock is at 2026-09-20, still before the program census date."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Sunrise Education Consultants", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 2, sanctions_screen_passed: true, reference_check_count: 3 }
