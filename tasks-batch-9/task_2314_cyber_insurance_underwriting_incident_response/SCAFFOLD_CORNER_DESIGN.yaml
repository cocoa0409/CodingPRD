      - name: renewal_control_credit_binds_at_twelve_percent_of_the_pre_credit_premium
        claim_type: constraint_propagation
        grounds:
          - calculations.renewal_premium_adjustment.formula
          - calculations.renewal_premium_adjustment.constants.CONTROL_CREDIT_CAP_PCT
          - entities.RenewalAssessment.fields.premium_adjustment_pct
        distinguishing_aspect: |
          Five verified controls earn a raw credit of 3750.00, but CONTROL_CREDIT_CAP_PCT holds it to
          3244.21 — twelve percent of the 27035.10 pre-credit premium — so the renewal lands on 23790.89 and
          the adjustment is -0.1640 rather than the -0.1683 an uncapped credit would give.
        test_recipe:
          setup:
            - "Aurora Health policy with premium_usd 28458.00, no claims at all, so policy_loss_ratio is 0.0000 and the tier adjustment is -0.05; aggregation_flagged is false."
            - "Clock at 2027-05-05T00:00:00Z, inside the 90-day renewal window before period_end 2027-08-01T00:00:00Z."
            - "A RenewalAssessment requiring all five catalog controls, all five submitted and all five verified, so status is CONDITIONS_MET with verified_control_keys of length 5."
            - "The policy version is captured for the OCC field."
