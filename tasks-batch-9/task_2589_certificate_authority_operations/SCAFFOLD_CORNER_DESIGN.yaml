            - "the fourth trigger returns HTTP 201 with ${second_crl_number} == 2, this_update 2026-08-01T23:00:00Z (60 minutes of overlap, at least the required 30) and next_update 2026-08-02T22:00:00Z (23 hours, within the 24 hour ceiling)"
