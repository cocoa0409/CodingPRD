scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: license_fee_estimate_vs_final_diverge
        grounds:
          - calculations.application_fee_estimate
          - calculations.issuance_fee_final
          - entities.Application.fields.estimated_fee
          - entities.License.fields.final_fee
        distinguishing_aspect: |
          The estimate (on Application, declared_employee_count=12, no inspection fee) yields 660.00
          while the final fee (on License, verified_employee_count=15 + two passed inspections) yields
          825.00 — same subject application but different numeric result, 165.00 delta.
        test_recipe:
          setup:
            - "ActivityCategory HIGH risk, required_inspection_count=2, requires_zoning_check=true, term 12, allowed_zones includes C1."
            - "Business GOOD standing in zone C1."
            - "Application declared_employee_count=12, requested_zone_code=C1, submitted (estimate computed), zoning CLEARED."
            - "Two inspections recorded PASSED with verified_employee_count=15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "FOOD_SERVICE", risk_tier: "HIGH", activity_base_risk: 40, required_inspection_count: 2, requires_zoning_check: true, term_months: 12, allowed_zones: ["C1","C2"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Acme Eats", owner_name: "A Owner", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 12, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { est_fee: $.data.estimated_fee }
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /inspections"
              payload: { application_id: "${app_id}", inspector_user_id: "insp-1" }
              as: InspectionOfficer
              captures: { insp1_id: $.data.id }
            - call: "POST /inspections/${insp1_id}/record"
              payload: { result: "PASSED", verified_employee_count: 15, failed_item_count: 0 }
              as: InspectionOfficer
            - call: "POST /inspections"
              payload: { application_id: "${app_id}", inspector_user_id: "insp-1" }
              as: InspectionOfficer
              captures: { insp2_id: $.data.id }
            - call: "POST /inspections/${insp2_id}/record"
              payload: { result: "PASSED", verified_employee_count: 15, failed_item_count: 0 }
              as: InspectionOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id, final_fee: $.data.final_fee }
          assert:
            - "Application.${app_id}.estimated_fee == 660.00"
            - "License.${lic_id}.final_fee == 825.00"
            - "License.${lic_id}.final_fee != Application.${app_id}.estimated_fee"

      - name: business_risk_provisional_vs_audited_diverge
        grounds:
          - calculations.compliance_risk_score
          - entities.Business.fields.compliance_risk_score
          - state_machines.Application.ZONING_CLEARED_to_APPROVED
          - state_machines.License.ACTIVE_to_DELINQUENT
        distinguishing_aspect: |
          On a different entity domain (Business, not License fee): the PROVISIONAL score at approval is
          40 (base only, 0 violations) while the AUDITED recompute after delinquency is 75 (base 40 +
          3 failed items*5=15 capped contribution + 20 delinquency), a different result for the same Business.
        test_recipe:
          setup:
            - "ActivityCategory HIGH activity_base_risk=40, required_inspection_count=1, requires_zoning_check=true, term 12, allowed_zones C1."
            - "Business GOOD; Application submitted, zoned CLEARED, one inspection PASSED with failed_item_count=3, then APPROVED (PROVISIONAL score 40) and ISSUED."
            - "Clock advanced past expiry+grace so assess-delinquency demotes the business (AUDITED recompute)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "HAZ_PLANT", risk_tier: "HIGH", activity_base_risk: 40, required_inspection_count: 1, requires_zoning_check: true, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Risk Co", owner_name: "R Owner", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 4, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /inspections"
              payload: { application_id: "${app_id}", inspector_user_id: "insp-9" }
              as: InspectionOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/record"
              payload: { result: "PASSED", verified_employee_count: 4, failed_item_count: 3 }
              as: InspectionOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-02T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /licenses/${lic_id}/assess-delinquency"
              payload: {}
              as: LicensingOfficer
          assert:
            - "Business.${biz_id}.compliance_risk_score == 75"
            - "Business.${biz_id}.standing == DELINQUENT"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: issuance_fee_nonlinear_multi_input
        grounds:
          - calculations.issuance_fee_final
          - entities.License.fields.final_fee
          - entities.Application.fields.zoning_status
        distinguishing_aspect: |
          Mode (a) non-linear: final_fee = base[tier] + PER_EMPLOYEE*verified + variance(branch on
          zoning_status) + PER_INSPECTION*count(PASSED) — ≥4 inputs with a conditional branch on
          zoning_status. MEDIUM, verified 6, variance branch active, 1 inspection -> 505.00.
        test_recipe:
          setup:
            - "ActivityCategory MEDIUM, required_inspection_count=1, requires_zoning_check=true, allowed_zones=[C1] (so a request in I2 forces VARIANCE_REQUIRED)."
            - "Application requested_zone_code=I2 (not allowed) -> zoning VARIANCE_REQUIRED; one inspection PASSED verified 6; approved+issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "RETAIL_MED", risk_tier: "MEDIUM", activity_base_risk: 20, required_inspection_count: 1, requires_zoning_check: true, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Var Shop", owner_name: "V Owner", zone_code: "I2" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 4, requested_zone_code: "I2" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
              captures: { zstat: $.data.zoning_status }
            - call: "POST /inspections"
              payload: { application_id: "${app_id}", inspector_user_id: "insp-3" }
              as: InspectionOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/record"
              payload: { result: "PASSED", verified_employee_count: 6, failed_item_count: 0 }
              as: InspectionOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id, final_fee: $.data.final_fee }
          assert:
            - "Application.${app_id}.zoning_status == VARIANCE_REQUIRED"
            - "License.${lic_id}.final_fee == 505.00"

      - name: variance_surcharge_recompute_order_pinned
        grounds:
          - calculations.application_fee_estimate
          - state_machines.Application.SUBMITTED_to_VARIANCE_REQUIRED
          - entities.Application.fields.estimated_fee
        distinguishing_aspect: |
          Mode (c) order-pinned dependency: estimated_fee is first computed at submit (660.00 for HIGH,
          12 emp, no variance) then RE-derived on the SUBMITTED->VARIANCE_REQUIRED transition adding the
          150.00 surcharge -> 810.00; the scaffold pins that the surcharge applies only after the zoning
          branch resolves, so evaluation order is well-defined.
        test_recipe:
          setup:
            - "ActivityCategory HIGH requires_zoning_check=true allowed_zones=[C1]."
            - "Application declared 12 employees requesting zone I9 (not allowed) -> submit estimate 660.00, then zoning-check forces VARIANCE_REQUIRED and recomputes 810.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "BAR_HIGH", risk_tier: "HIGH", activity_base_risk: 35, required_inspection_count: 0, requires_zoning_check: true, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Late Bar", owner_name: "L Owner", zone_code: "I9" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 12, requested_zone_code: "I9" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { est_at_submit: $.data.estimated_fee }
          trigger:
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
              captures: { est_after_variance: $.data.estimated_fee, zstat: $.data.zoning_status }
          assert:
            - "Application.${app_id}.estimated_fee == 810.00"
            - "Application.${app_id}.zoning_status == VARIANCE_REQUIRED"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: license_delinquent_renew_active_cycle
        grounds:
          - state_machines.License.ACTIVE_to_DELINQUENT
          - state_machines.License.DELINQUENT_to_ACTIVE
          - entities.License.fields.status
        distinguishing_aspect: |
          Cyclic shape on License: ACTIVE -> DELINQUENT (assess-delinquency) -> ACTIVE (renew) is a
          revision loop returning to a prior state, not a linear pipeline. After renew the license is
          ACTIVE again with renewal_count incremented.
        test_recipe:
          setup:
            - "License ACTIVE issued at 2026-06-01 with term 12 (expires 2027-06-01)."
            - "Clock moved to 2027-08-02 (62 days overdue) -> assess-delinquency -> DELINQUENT."
            - "Outstanding RENEWAL_FEE and DELINQUENCY_PENALTY settled, then renew within window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "CYCLE_MED", risk_tier: "MEDIUM", activity_base_risk: 20, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Loop Co", owner_name: "L2 Owner", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 2, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-02T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /licenses/${lic_id}/assess-delinquency"
              payload: {}
              as: LicensingOfficer
            - call: "GET /licenses/${lic_id}/fee-assessments"
              payload: {}
              as: LicensingOfficer
              captures: { fee0_id: "$.data[0].id", fee1_id: "$.data[1].id" }
            - call: "POST /fee-assessments/${fee0_id}/settle"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /fee-assessments/${fee1_id}/settle"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
          trigger:
            - call: "POST /licenses/${lic_id}/renew"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { st: $.data.status, rc: $.data.renewal_count }
          assert:
            - "License.${lic_id}.status == ACTIVE"
            - "License.${lic_id}.renewal_count == 1"

      - name: application_branch_zoning_clear_vs_variance
        grounds:
          - state_machines.Application.SUBMITTED_to_ZONING_CLEARED
          - state_machines.Application.SUBMITTED_to_VARIANCE_REQUIRED
          - entities.Application.fields.status
        distinguishing_aspect: |
          Branching fork on a different entity (Application): from SUBMITTED the same zoning-check
          trigger forks to ZONING_CLEARED (allowed zone) OR VARIANCE_REQUIRED (disallowed zone) with
          divergent side effects (variance branch adds 150.00 surcharge), confirming non-linear shape.
        test_recipe:
          setup:
            - "Two applications under the same HIGH category allowed_zones=[C1]: one requesting C1 (clears), one requesting Z9 (variance)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "FORK_CAT", risk_tier: "HIGH", activity_base_risk: 30, required_inspection_count: 0, requires_zoning_check: true, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Fork Biz A", owner_name: "FA", zone_code: "C1" }
              as: Applicant
              captures: { biz_a: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Fork Biz B", owner_name: "FB", zone_code: "Z9" }
              as: Applicant
              captures: { biz_b: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_a}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_a}"
              captures: { app_a: $.data.id }
            - call: "POST /applications/${app_a}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_a}"
            - call: "POST /applications"
              payload: { business_id: "${biz_b}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "Z9" }
              as: Applicant
              as_user_id: "${biz_b}"
              captures: { app_b: $.data.id }
            - call: "POST /applications/${app_b}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_b}"
            - call: "POST /applications/${app_a}/zoning-check"
              payload: {}
              as: LicensingOfficer
              captures: { st_a: $.data.status }
          trigger:
            - call: "POST /applications/${app_b}/zoning-check"
              payload: {}
              as: LicensingOfficer
              captures: { st_b: $.data.status }
          assert:
            - "Application.${app_a}.status == ZONING_CLEARED"
            - "Application.${app_b}.status == VARIANCE_REQUIRED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: revoke_cascade_endorsement_transfer_business_depth3
        grounds:
          - state_machines.License.DELINQUENT_to_REVOKED
          - state_machines.Endorsement.ACTIVE_to_VOIDED
          - state_machines.OwnershipTransfer.REQUESTED_to_CANCELLED
          - entities.Business.fields.standing
        distinguishing_aspect: |
          Depth-3 cascade from License revoke: revoke -> License REVOKED; that mutation voids the
          attached Endorsement; the revoke also cancels the pending OwnershipTransfer, and that cancel
          itself zeroes the transfer_fee; and the revoke flips Business.standing=REVOKED and sets
          prior_revocation_flag — each hop caused by the prior, not by the original call directly.
        test_recipe:
          setup:
            - "License DELINQUENT (>90 days overdue) with one ACTIVE Endorsement and one REQUESTED OwnershipTransfer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "REVK_MED", risk_tier: "MEDIUM", activity_base_risk: 20, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Revoke Co", owner_name: "RC", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Buyer Co", owner_name: "BC", zone_code: "C1" }
              as: Applicant
              captures: { buyer_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 2, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id }
            - call: "POST /endorsements"
              payload: { license_id: "${lic_id}", kind: "LATE_HOURS", condition_text: "Close by 02:00" }
              as: LicensingOfficer
              captures: { end_id: $.data.id }
            - call: "POST /transfers"
              payload: { license_id: "${lic_id}", from_business_id: "${biz_id}", to_business_id: "${buyer_id}" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-10T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /licenses/${lic_id}/assess-delinquency"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /licenses/${lic_id}/revoke"
              payload: {}
              as: LicensingOfficer
              captures: { st: $.data.status }
          assert:
            - "License.${lic_id}.status == REVOKED"
            - "Endorsement.${end_id}.status == VOIDED"
            - "OwnershipTransfer.${tr_id}.status == CANCELLED"
            - "OwnershipTransfer.${tr_id}.transfer_fee == 0"
            - "Business.${biz_id}.standing == REVOKED"
            - "Business.${biz_id}.prior_revocation_flag == true"

      - name: delinquency_cascade_business_standing_riskscore_depth2
        grounds:
          - state_machines.License.ACTIVE_to_DELINQUENT
          - entities.Business.fields.standing
          - entities.Business.fields.compliance_risk_score
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (assess-delinquency, not revoke): assess-delinquency
          -> License DELINQUENT; that mutation flips Business.standing=DELINQUENT; the standing flip then
          drives the AUDITED compliance_risk_score recompute (+20 delinquency weight). Two caused hops.
        test_recipe:
          setup:
            - "License ACTIVE issued, clock moved past expiry+grace; business GOOD before delinquency."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "DELQ_LOW", risk_tier: "LOW", activity_base_risk: 10, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Delq Co", owner_name: "DC", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
