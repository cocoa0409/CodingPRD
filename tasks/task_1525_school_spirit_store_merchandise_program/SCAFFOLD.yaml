# =============================================================================
# SCAFFOLD — School Spirit Store & Merchandise Program (task_1525)
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  School Spirit Store & Merchandise Program (school activities office): inventory
  by size/design & seasonal drop, pre-order vs stock model & fulfillment, POS at
  events & cash handling controls, licensing/trademark approval for logos, profit
  allocation to activity accounts, online store & pickup at school, size/exchange
  policy, vendor selection & minimum order

domain_name: school-spirit-store
api_prefix: /spirit-store

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota / allocation        # finite physical stock: on_hand vs reserved_online vs preorder demand
  secondary_archetype: compliance / audit      # licensing approval gates + cash drawer segregation of duties
  complexity_layers:
    - optimistic_concurrency                   # OCC on MerchProgram.version (drop create) and Design.version (licensing transitions)
    - cascading_side_effects                   # design revocation chain; PO receipt chain; allocation waterfall
    - dual_variant_calculation                 # campaign units provisional-vs-final; inventory FIFO vs weighted-avg
    - ops_run_checkpoint                       # run-ops advances epoch: pickup expiry, drop auto-close
  entity_topology: flat                        # peer entities joined by FK references; list endpoints carry filter params
  state_machine_shape: cyclic                  # Design revision loop; Order parallel dims; EventSale recount loop; Campaign fork
  relationship_patterns:
    - one_to_many                              # program -> everything; campaign -> preorders; event -> orders
    - cross_aggregate                          # PurchaseOrder -> Vendor + ProductVariant + PreOrderCampaign; ExchangeRequest -> Order + ProductVariant
    - polymorphic                              # Order.channel changes required FK (event_id) and fulfillment dimension semantics
  role_model: segregation_of_duties            # drawer opener != drawer counter; design creator (StoreManager) cannot self-approve licensing
  consistency_model: immediate                 # all cascades atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: MerchProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name (e.g., '2026 Spirit Store')" }
      - { name: school_year, type: string, source: input, description: "Academic year label, e.g. '2026-2027'" }
      - { name: status, type: enum, source: system, description: "SETUP | ACTIVE | CLOSED | RECONCILED" }
      - { name: over_short_tolerance_cents, type: integer, source: input, default: 500, description: "Cash drawer over/short tolerance; |over_short| <= tolerance auto-reconciles (>= boundary: exactly at tolerance passes)" }
      - { name: exchange_window_days, type: integer, source: input, default: 14, description: "Days after fulfillment during which an exchange may be opened (inclusive last day)" }
      - { name: pickup_window_days, type: integer, source: input, default: 7, description: "Days an online order stays READY_FOR_PICKUP before expiry" }
      - { name: register_buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory gap between POS event bookings on the same register (closed-interval buffer semantics)" }
      - { name: deposit_floor_cents, type: integer, source: input, default: 500, description: "Minimum preorder deposit regardless of percentage" }
      - { name: valuation_method, type: enum, source: input, description: "FIFO | WEIGHTED_AVG — default inventory valuation method for reporting" }
      - { name: undistributed_profit_cents, type: integer, source: computed, description: "Recognized sales margin not yet allocated to activity accounts; starts 0; incremented by order/preorder margins and profit adjustments; decremented by refunds and allocation posting" }
      - { name: distributed_profit_cents, type: integer, source: computed, description: "Cumulative profit posted to activity accounts; starts 0" }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic ops epoch counter, starts 0, +1 per run-ops" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: contact_email, type: string, source: input, description: "Vendor contact email" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | SUSPENDED" }
      - { name: quotes, type: array, source: input, default: [], description: "Array of {design_id, unit_cost_cents, min_order_qty, production_days, status: ACTIVE|RETIRED}; at most one ACTIVE quote per design per vendor" }

  - name: Design
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: name, type: string, source: input, description: "Design name" }
      - { name: artwork_ref, type: string, source: input, description: "Artwork file/reference descriptor" }
      - { name: royalty_pct, type: number, source: input, description: "Licensor royalty as fraction of sales price, 0..1 inclusive" }
      - { name: licensing_fee_cents, type: integer, source: input, description: "One-time licensing fee, amortized into landed cost over each receiving PO's qty_ordered" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | REVOKED" }
      - { name: revision_count, type: integer, source: system, description: "Starts 0; +1 on every REJECTED -> SUBMITTED resubmission" }
      - { name: rejection_reason, type: string, source: system, description: "Note captured at rejection; null otherwise" }

  - name: ProductVariant
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: design_id, type: string, source: input, description: "FK -> Design.id; the design printed on this SKU" }
      - { name: drop_id, type: string, source: input, description: "FK -> SeasonalDrop.id; nullable — set only for seasonal drop SKUs" }
      - { name: size, type: enum, source: input, description: "XS | S | M | L | XL | 2XL | ONE_SIZE" }
      - { name: unit_price_cents, type: integer, source: input, description: "List sale price" }
      - { name: reorder_point, type: integer, source: input, default: 0, description: "Low-stock threshold on available_qty" }
      - { name: on_hand_qty, type: integer, source: system, description: "Physical units on shelf; starts 0; +PO receipts, -POS sales, -preorder fulfill, +/- exchange swap, +online expiry release" }
      - { name: reserved_online_qty, type: integer, source: system, description: "Units held for unfulfilled online orders and approved exchanges; starts 0" }
      - { name: available_qty, type: integer, source: computed, description: "on_hand_qty - reserved_online_qty; never allowed negative" }
      - { name: landed_unit_cost_cents, type: integer, source: computed, description: "Latest receipt's unit_cost + round_half_up(licensing_fee_cents / PO.qty_ordered); 0 until first receipt" }
      - { name: low_stock, type: boolean, source: computed, description: "available_qty <= reorder_point" }
      - { name: sellable, type: boolean, source: computed, description: "program.status==ACTIVE AND design.status==APPROVED AND (drop_id null OR drop.status==OPEN)" }

  - name: SeasonalDrop
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: name, type: string, source: input, description: "Drop name (e.g., 'Fall Kickoff Drop')" }
      - { name: opens_at, type: datetime, source: input, description: "Sales window open, half-open [opens_at, closes_at)" }
      - { name: closes_at, type: datetime, source: input, description: "Sales window close (exclusive bound)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | SETTLED" }
      - { name: settled_margin_cents, type: integer, source: computed, description: "Snapshot of net margin attributed to this drop's variants at settle; null until SETTLED" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: variant_id, type: string, source: input, description: "FK -> ProductVariant.id; SKU being produced" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; producing vendor" }
      - { name: campaign_id, type: string, source: system, description: "FK -> PreOrderCampaign.id; set when auto-created by campaign lock; null for stock POs" }
      - { name: qty_ordered, type: integer, source: input, description: "Units ordered (auto-created campaign POs: max(paid demand per variant, quote.min_order_qty))" }
      - { name: qty_received, type: integer, source: system, description: "Cumulative units received; starts 0" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Unit cost captured from the selected vendor quote at creation" }
      - { name: auto_created, type: boolean, source: system, description: "True when created by campaign lock selector; false for manager-created stock POs" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PARTIALLY_RECEIVED | RECEIVED | CANCELLED" }

  - name: PreOrderCampaign
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: design_id, type: string, source: input, description: "FK -> Design.id; design offered by this campaign" }
      - { name: unit_price_cents, type: integer, source: input, description: "Preorder unit price (applies to all sizes)" }
      - { name: deposit_pct, type: number, source: input, description: "Fraction of total due at placement, 0..1 inclusive" }
      - { name: goal_units, type: integer, source: input, description: "Paid units required for production; lock succeeds iff paid_units >= goal_units (equality passes)" }
      - { name: opens_at, type: datetime, source: input, description: "Earliest the campaign may be opened" }
      - { name: closes_at, type: datetime, source: input, description: "Lock requires clock >= closes_at" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | IN_PRODUCTION | FULFILLING | CLOSED | CANCELLED" }
      - { name: placed_units, type: integer, source: computed, description: "Sum of qty over preorders in PLACED, PAID, or FULFILLED (provisional, forward-looking)" }
      - { name: paid_units, type: integer, source: computed, description: "Sum of qty over preorders in PAID or FULFILLED (final, lock-authoritative)" }
      - { name: selected_vendor_id, type: string, source: system, description: "FK -> Vendor.id chosen by quote selector at lock; null until locked" }

  - name: PreOrder
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: campaign_id, type: string, source: input, description: "FK -> PreOrderCampaign.id" }
      - { name: variant_id, type: string, source: input, description: "FK -> ProductVariant.id; variant.design_id must equal campaign.design_id" }
      - { name: customer_user_id, type: string, source: input, description: "Opaque customer (student/parent) id placing the preorder" }
      - { name: qty, type: integer, source: input, description: "Units preordered, >= 1" }
      - { name: status, type: enum, source: system, description: "PLACED | PAID | FULFILLED | CANCELLED | REFUNDED" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "max(program.deposit_floor_cents, round_half_up(unit_price_cents * qty * deposit_pct))" }
      - { name: balance_due_cents, type: integer, source: computed, description: "unit_price_cents * qty - deposit_due_cents" }
      - { name: deposit_paid_cents, type: integer, source: system, description: "Deposit collected; starts 0" }
      - { name: balance_paid_cents, type: integer, source: system, description: "Balance collected; starts 0" }
      - { name: refunded_cents, type: integer, source: system, description: "Total refunded to customer; starts 0" }

  - name: EventSale
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: name, type: string, source: input, description: "Event name (e.g., 'Homecoming Game')" }
      - { name: register_location, type: string, source: input, description: "Physical register/location identifier; bookings on the same register obey the buffer rule" }
      - { name: starts_at, type: datetime, source: input, description: "Event window start (closed interval)" }
      - { name: ends_at, type: datetime, source: input, description: "Event window end (closed interval)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | COUNTED | FLAGGED | RECONCILED | CANCELLED" }
      - { name: opening_float_cents, type: integer, source: system, description: "Cash float counted at drawer open; null until OPEN" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the cashier who opened the drawer" }
      - { name: cash_sales_cents, type: integer, source: system, description: "Cumulative CASH order totals while OPEN; starts 0" }
      - { name: card_sales_cents, type: integer, source: system, description: "Cumulative CARD order totals while OPEN; starts 0" }
      - { name: cash_refunds_cents, type: integer, source: system, description: "Cumulative CASH refunds while OPEN; starts 0" }
      - { name: closing_counted_cents, type: integer, source: system, description: "Physical cash counted at close; null until first count" }
      - { name: counted_by_user_id, type: string, source: system, description: "X-User-ID of the counter; must differ from opened_by_user_id" }
      - { name: over_short_cents, type: integer, source: computed, description: "closing_counted_cents - (opening_float_cents + cash_sales_cents - cash_refunds_cents); null until counted" }
      - { name: reconcile_note, type: string, source: system, description: "Director note recorded on manual reconcile from FLAGGED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: channel, type: enum, source: input, description: "EVENT_POS | ONLINE" }
      - { name: event_id, type: string, source: input, description: "FK -> EventSale.id; required iff channel==EVENT_POS, must be null for ONLINE" }
      - { name: customer_user_id, type: string, source: input, description: "Opaque customer id" }
      - { name: payment_method, type: enum, source: input, description: "CASH | CARD" }
      - { name: lines, type: array, source: input, description: "Array of {variant_id, qty, discount_pct?}; unit price captured server-side from ProductVariant.unit_price_cents; discount_pct defaults 0" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of per-line round_half_up(unit_price_cents * qty * (1 - discount_pct)); per-line rounding pinned, then sum" }
      - { name: margin_cents, type: integer, source: computed, description: "Sum over lines of (line_total - qty * landed_unit_cost_cents_at_sale)" }
      - { name: payment_status, type: enum, source: system, description: "PAID | PARTIALLY_REFUNDED | REFUNDED — independent parallel dimension" }
      - { name: fulfillment_status, type: enum, source: system, description: "POS_FULFILLED | PICKUP_PENDING | READY_FOR_PICKUP | PICKED_UP | EXPIRED_RELEASED — independent parallel dimension; POS orders start POS_FULFILLED, online start PICKUP_PENDING" }
      - { name: refunded_cents, type: integer, source: system, description: "Cumulative refunds against this order; starts 0" }
      - { name: ready_at, type: datetime, source: system, description: "When marked READY_FOR_PICKUP; null otherwise" }
      - { name: expires_at, type: datetime, source: system, description: "ready_at + program.pickup_window_days; null until ready" }
      - { name: picked_up_at, type: datetime, source: system, description: "When picked up; null otherwise" }

  - name: ExchangeRequest
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the purchase being exchanged" }
      - { name: original_variant_id, type: string, source: input, description: "FK -> ProductVariant.id; must appear in the order's lines" }
      - { name: new_variant_id, type: string, source: input, description: "FK -> ProductVariant.id; must share original_variant_id's design_id and differ in size" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | COMPLETED | REJECTED" }
      - { name: differential_cents, type: integer, source: computed, description: "new_variant.unit_price_cents - original line unit price; positive = customer owes, negative = refund owed" }
      - { name: condition, type: enum, source: system, description: "RESALEABLE | DAMAGED; recorded at completion; DAMAGED units are written off, not restocked" }

  - name: ActivityAccount
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: name, type: string, source: input, description: "Club/activity name (e.g., 'Band', 'Drama')" }
      - { name: allocation_weight, type: number, source: input, description: "Relative profit share weight, > 0" }
      - { name: cap_cents, type: integer, source: input, description: "Maximum cumulative allocation this account may hold; null = uncapped" }
      - { name: balance_cents, type: integer, source: system, description: "Cumulative allocated profit credited; starts 0" }

  - name: AllocationRun
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MerchProgram.id; owning program" }
      - { name: distributable_cents, type: integer, source: input, description: "Amount to distribute; must be >= 1 and <= program.undistributed_profit_cents at creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | REVERSED" }
      - { name: lines, type: array, source: computed, description: "Array of {account_id, credit_cents, capped} computed at creation by the waterfall; frozen on the run" }
      - { name: posted_at, type: datetime, source: system, description: "When posted; null until POSTED" }

# =============================================================================
# §1.2 State Machine Table (11 machines)
# =============================================================================
state_machines:
  - entity: MerchProgram
    initial_state: SETUP
    terminal_states: [RECONCILED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /spirit-store/programs/{programId}/lifecycle {to_state: ACTIVE}"
        actor: ActivitiesDirector
        preconditions:
          - "status == SETUP (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /spirit-store/programs/{programId}/lifecycle {to_state: CLOSED}"
        actor: ActivitiesDirector
        preconditions:
          - "status == ACTIVE"
          - "Every EventSale of the program in {RECONCILED, CANCELLED} AND every PreOrderCampaign in {CLOSED, CANCELLED} (else ERR_UNRESOLVED_OPERATIONS)"
        side_effects: []
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /spirit-store/programs/{programId}/lifecycle {to_state: RECONCILED}"
        actor: ActivitiesDirector
        preconditions:
          - "status == CLOSED"
          - "undistributed_profit_cents == 0 (else ERR_PROFIT_NOT_FULLY_ALLOCATED)"
          - "No AllocationRun of the program in DRAFT (else ERR_UNRESOLVED_OPERATIONS)"
        side_effects: []

  - entity: Vendor
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "PATCH /spirit-store/vendors/{vendorId} {status: APPROVED}"
        actor: StoreManager
        preconditions: ["status == PENDING (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "PATCH /spirit-store/vendors/{vendorId} {status: SUSPENDED}"
        actor: StoreManager
        preconditions: ["status == APPROVED"]
        side_effects:
          - "Vendor's quotes become ineligible for the campaign lock selector while SUSPENDED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "PATCH /spirit-store/vendors/{vendorId} {status: APPROVED}"
        actor: StoreManager
        preconditions: ["status == SUSPENDED"]
        side_effects: []

  - entity: Design
    initial_state: DRAFT
    terminal_states: [REVOKED]
    note: "Cyclic revision loop: REJECTED -> SUBMITTED allowed repeatedly (revision_count increments)"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /spirit-store/designs/{designId}/licensing-transition {to_state: SUBMITTED}"
        actor: LicensingCoordinator
        preconditions: ["status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /spirit-store/designs/{designId}/licensing-transition {to_state: SUBMITTED}"
        actor: LicensingCoordinator
        preconditions:
          - "status == REJECTED"
          - "expected_design_version matches design.version (else ERR_STALE_VERSION, OCC rule design-resubmit-stale-version)"
        side_effects:
          - "revision_count += 1"
          - "rejection_reason -> null"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /spirit-store/designs/{designId}/licensing-transition {to_state: APPROVED}"
        actor: LicensingCoordinator
        preconditions: ["status == SUBMITTED"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /spirit-store/designs/{designId}/licensing-transition {to_state: REJECTED, note}"
        actor: LicensingCoordinator
        preconditions: ["status == SUBMITTED"]
        side_effects: ["rejection_reason <- note"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /spirit-store/designs/{designId}/licensing-transition {to_state: REVOKED, note}"
        actor: LicensingCoordinator
        preconditions: ["status == APPROVED"]
        side_effects:
          - "(link 1) Every ProductVariant with design_id == this design recomputes sellable -> false"
          - "(link 2, caused by link 1) Every PreOrderCampaign of this design in {OPEN, IN_PRODUCTION} auto-transitions to CANCELLED because its design is no longer sellable"
          - "(link 3, caused by link 2) Each such campaign's PreOrders in PAID auto-transition to REFUNDED with refunded_cents = deposit_paid_cents + balance_paid_cents; PLACED ones -> CANCELLED"
          - "Each refund reverses any recognized margin (preorder margins are recognized at fulfill, so pre-fulfillment refunds move no program profit)"

  - entity: SeasonalDrop
    initial_state: SCHEDULED
    terminal_states: [SETTLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /spirit-store/seasonal-drops/{dropId}/transition {to_state: OPEN}"
        actor: StoreManager
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE_TRANSITION)"
          - "logical clock >= opens_at (else ERR_DROP_WINDOW_NOT_STARTED)"
        side_effects: ["sellable recomputed for all variants with drop_id == this drop"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /spirit-store/seasonal-drops/{dropId}/transition {to_state: CLOSED} or system (run-ops when clock >= closes_at)"
        actor: "StoreManager or system"
        preconditions: ["status == OPEN"]
        side_effects: ["sellable recomputed -> false for all variants with drop_id == this drop"]
      - from: CLOSED
        to: SETTLED
        trigger: "POST /spirit-store/seasonal-drops/{dropId}/transition {to_state: SETTLED}"
        actor: StoreManager
        preconditions: ["status == CLOSED"]
        side_effects:
          - "settled_margin_cents <- sum of margin_cents over Orders (payment_status in {PAID, PARTIALLY_REFUNDED}) containing at least one line whose variant.drop_id == this drop, minus refunded portions already netted in margin recognition"

  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    note: "PARTIALLY_RECEIVED loops via repeated receive calls until qty_received == qty_ordered"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /spirit-store/purchase-orders/{poId}/submit"
        actor: StoreManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "vendor.status == APPROVED (else ERR_VENDOR_NOT_APPROVED)"
          - "variant.design.status == APPROVED (else ERR_DESIGN_NOT_LICENSED)"
          - "qty_ordered >= quote.min_order_qty for the vendor's ACTIVE quote on the variant's design (else ERR_MIN_ORDER_QTY)"
        side_effects: []
      - from: SUBMITTED
        to: PARTIALLY_RECEIVED
        trigger: "POST /spirit-store/purchase-orders/{poId}/receive {qty} where qty_received + qty < qty_ordered"
        actor: StoreManager
        preconditions:
          - "status in {SUBMITTED, PARTIALLY_RECEIVED}"
          - "qty >= 1 and qty_received + qty <= qty_ordered (else ERR_INVALID_REQUEST)"
        side_effects:
          - "qty_received += qty; variant.on_hand_qty += qty"
          - "variant.landed_unit_cost_cents <- unit_cost_cents + round_half_up(design.licensing_fee_cents / qty_ordered)"
      - from: PARTIALLY_RECEIVED
        to: PARTIALLY_RECEIVED
        trigger: "POST /spirit-store/purchase-orders/{poId}/receive {qty} (partial receipt loop)"
        actor: StoreManager
        preconditions: ["same as SUBMITTED -> PARTIALLY_RECEIVED"]
        side_effects: ["same as SUBMITTED -> PARTIALLY_RECEIVED"]
      - from: SUBMITTED
        to: RECEIVED
        trigger: "POST /spirit-store/purchase-orders/{poId}/receive {qty} where qty_received + qty == qty_ordered (exact equality completes)"
        actor: StoreManager
        preconditions: ["same as partial receive"]
        side_effects:
          - "same stock/landed-cost side effects as partial receive"
          - "(link 1) variant.on_hand_qty increases"
          - "(link 2, caused by link 1) if campaign_id set and ALL PurchaseOrders of that campaign are RECEIVED, the campaign auto-transitions IN_PRODUCTION -> FULFILLING"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /spirit-store/purchase-orders/{poId}/cancel"
        actor: StoreManager
        preconditions: ["status in {DRAFT, SUBMITTED}"]
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /spirit-store/purchase-orders/{poId}/cancel"
        actor: StoreManager
        preconditions: ["status in {DRAFT, SUBMITTED}"]
        side_effects: []

  - entity: PreOrderCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: "Branching fork at lock: OPEN -> IN_PRODUCTION (goal met) or OPEN -> CANCELLED (goal unmet); bubble-up auto-close"
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /spirit-store/preorder-campaigns/{campaignId}/open"
        actor: StoreManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "logical clock >= opens_at (else ERR_CAMPAIGN_NOT_OPEN)"
          - "design.status == APPROVED (else ERR_DESIGN_NOT_LICENSED)"
          - "No other campaign of the same design in {OPEN, IN_PRODUCTION, FULFILLING} (else ERR_DUPLICATE_ACTIVE_CAMPAIGN)"
        side_effects: []
      - from: OPEN
        to: IN_PRODUCTION
        trigger: "POST /spirit-store/preorder-campaigns/{campaignId}/lock (goal-met branch)"
        actor: StoreManager
        preconditions:
          - "status == OPEN (else ERR_CAMPAIGN_NOT_OPEN)"
          - "logical clock >= closes_at (else ERR_CAMPAIGN_WINDOW_STILL_OPEN)"
          - "paid_units >= goal_units (equality passes; otherwise the CANCELLED branch fires)"
          - "Quote selector finds at least one eligible vendor (else ERR_NO_ELIGIBLE_VENDOR; campaign stays OPEN)"
        side_effects:
          - "selected_vendor_id <- selector result (eligible: vendor APPROVED AND quote ACTIVE on campaign design; rank unit_cost_cents ASC, tie production_days ASC, tie vendor.created_at ASC)"
          - "For each ProductVariant of the design with paid demand > 0: auto-create PurchaseOrder {campaign_id, variant_id, vendor_id: selected_vendor_id, qty_ordered: max(demand, quote.min_order_qty), unit_cost_cents from quote, status SUBMITTED, auto_created true}"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /spirit-store/preorder-campaigns/{campaignId}/lock (goal-unmet branch) OR POST /spirit-store/preorder-campaigns/{campaignId}/cancel (manual abandon) OR system (design revoked cascade)"
        actor: "StoreManager or system"
        preconditions:
          - "Lock branch: status == OPEN, clock >= closes_at, paid_units < goal_units"
          - "Manual cancel: status in {DRAFT, OPEN}"
          - "Cascade: status in {OPEN, IN_PRODUCTION} and design REVOKED"
        side_effects:
          - "Every PreOrder in PAID -> REFUNDED with refunded_cents = deposit_paid_cents + balance_paid_cents"
          - "Every PreOrder in PLACED -> CANCELLED"
      - from: IN_PRODUCTION
        to: FULFILLING
        trigger: "system (automatic when all of the campaign's PurchaseOrders reach RECEIVED)"
        actor: system
        preconditions: ["All PurchaseOrders with campaign_id == this campaign in RECEIVED"]
        side_effects: []
      - from: FULFILLING
        to: CLOSED
        trigger: "system (automatic when every PAID preorder of the campaign reaches FULFILLED — bubble-up)"
        actor: system
        preconditions: ["No PreOrder of the campaign remains in PAID"]
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /spirit-store/preorder-campaigns/{campaignId}/cancel"
        actor: StoreManager
        preconditions: ["status in {DRAFT, OPEN}"]
        side_effects: []
        note: "DRAFT campaigns have no preorders; no refund side effects"

  - entity: PreOrder
    initial_state: PLACED
    terminal_states: [FULFILLED, CANCELLED, REFUNDED]
    transitions:
      - from: PLACED
        to: PAID
        trigger: "POST /spirit-store/preorders/{preorderId}/pay {phase: DEPOSIT}"
        actor: Customer
        preconditions:
          - "status == PLACED (else ERR_PREORDER_NOT_PAYABLE)"
          - "campaign.status == OPEN (else ERR_CAMPAIGN_NOT_OPEN)"
          - "amount_cents == deposit_due_cents (less -> ERR_DEPOSIT_SHORTFALL; more -> ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "deposit_paid_cents <- amount_cents"
          - "campaign placed_units/paid_units recomputed"
      - from: PAID
        to: FULFILLED
        trigger: "POST /spirit-store/preorders/{preorderId}/fulfill (after balance paid via /pay {phase: BALANCE})"
        actor: StoreManager
        preconditions:
          - "status == PAID (else ERR_INVALID_STATE_TRANSITION)"
          - "campaign.status == FULFILLING (else ERR_CAMPAIGN_NOT_OPEN)"
          - "balance_paid_cents == balance_due_cents (else ERR_DEPOSIT_SHORTFALL)"
          - "variant.available_qty >= qty (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "variant.on_hand_qty -= qty"
          - "program.undistributed_profit_cents += (unit_price_cents*qty - qty*variant.landed_unit_cost_cents) minus round_half_up(royalty_pct * unit_price_cents * qty) — margin net of royalty"
          - "If this was the last PAID preorder, campaign auto-closes (bubble-up)"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /spirit-store/preorders/{preorderId}/cancel OR system (campaign cancel cascade)"
        actor: "Customer or system"
        preconditions: ["status == PLACED (customer); cascade may also target PLACED"]
        side_effects: ["campaign placed_units recomputed"]
      - from: PAID
        to: REFUNDED
        trigger: "system (campaign CANCELLED cascade)"
        actor: system
        preconditions: ["status == PAID"]
        side_effects: ["refunded_cents = deposit_paid_cents + balance_paid_cents"]

  - entity: EventSale
    initial_state: SCHEDULED
    terminal_states: [RECONCILED, CANCELLED]
    note: "Recount loop: FLAGGED -> COUNTED via repeated close-count until within tolerance or manually reconciled"
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /spirit-store/event-sales/{eventId}/open-drawer"
        actor: StudentCashier
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE_TRANSITION)"
          - "logical clock <= ends_at (else ERR_EVENT_WINDOW_PASSED)"
        side_effects:
          - "opening_float_cents <- payload; opened_by_user_id <- X-User-ID"
      - from: OPEN
        to: COUNTED
        trigger: "POST /spirit-store/event-sales/{eventId}/close-count (auto-continues to RECONCILED when |over_short| <= tolerance)"
        actor: Treasurer
        preconditions:
          - "status in {OPEN, FLAGGED}"
          - "X-User-ID != opened_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "closing_counted_cents <- payload; counted_by_user_id <- X-User-ID"
          - "over_short_cents computed (cash_over_short_calc)"
          - "if |over_short_cents| <= program.over_short_tolerance_cents: status continues to RECONCILED (boundary: exactly equal passes); else status stays FLAGGED"
      - from: FLAGGED
        to: COUNTED
        trigger: "POST /spirit-store/event-sales/{eventId}/close-count (recount loop)"
        actor: Treasurer
        preconditions: ["same as OPEN -> COUNTED"]
        side_effects: ["same as OPEN -> COUNTED (closing_counted_cents overwritten)"]
      - from: FLAGGED
        to: RECONCILED
        trigger: "POST /spirit-store/event-sales/{eventId}/reconcile {note}"
        actor: ActivitiesDirector
        preconditions: ["status == FLAGGED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["reconcile_note <- note"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /spirit-store/event-sales/{eventId}/cancel"
        actor: StoreManager
        preconditions: ["status == SCHEDULED (an OPEN event must be counted, not cancelled)"]
        side_effects: []

  - entity: Order
    initial_state: "PAID x (POS_FULFILLED | PICKUP_PENDING)"
    terminal_states: ["REFUNDED x any", "any x PICKED_UP", "any x EXPIRED_RELEASED", "PAID x POS_FULFILLED"]
    note: "PARALLEL dimensions: payment_status (PAID -> PARTIALLY_REFUNDED -> REFUNDED) evolves independently of fulfillment_status"
    transitions:
      - from: PAID
        to: PARTIALLY_REFUNDED
        trigger: "POST /spirit-store/orders/{orderId}/refund {amount_cents < total_cents}"
        actor: Treasurer
        preconditions:
          - "payment_status in {PAID, PARTIALLY_REFUNDED}"
          - "refunded_cents + amount_cents < total_cents"
          - "POS orders: parent event status == OPEN (else ERR_DRAWER_NOT_OPEN); ONLINE orders: fulfillment_status in {PICKUP_PENDING, READY_FOR_PICKUP} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "refunded_cents += amount_cents"
          - "program.undistributed_profit_cents -= round_half_up(margin_cents * amount_cents / total_cents)"
          - "ONLINE only: reserved_online_qty released proportionally per refunded whole units; POS CASH: event.cash_refunds_cents += amount_cents"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /spirit-store/orders/{orderId}/refund (amount brings refunded_cents == total_cents)"
        actor: Treasurer
        preconditions: ["same as PAID -> PARTIALLY_REFUNDED"]
        side_effects:
          - "same as above, plus ONLINE: fulfillment_status -> EXPIRED_RELEASED if not yet PICKED_UP, full remaining reservation released"
      - from: PAID
        to: REFUNDED
        trigger: "POST /spirit-store/orders/{orderId}/refund {amount_cents == total_cents}"
        actor: Treasurer
        preconditions: ["same as above"]
        side_effects: ["same as above"]
      - from: PICKUP_PENDING
        to: READY_FOR_PICKUP
        trigger: "POST /spirit-store/orders/{orderId}/fulfillment-transition {to_state: READY_FOR_PICKUP}"
        actor: StoreManager
        preconditions: ["fulfillment_status == PICKUP_PENDING (else ERR_PICKUP_NOT_READY)"]
        side_effects: ["ready_at <- clock; expires_at <- clock + program.pickup_window_days"]
      - from: READY_FOR_PICKUP
        to: PICKED_UP
        trigger: "POST /spirit-store/orders/{orderId}/fulfillment-transition {to_state: PICKED_UP}"
        actor: StoreManager
        preconditions:
          - "fulfillment_status == READY_FOR_PICKUP (else ERR_PICKUP_NOT_READY)"
          - "logical clock <= expires_at (else ERR_PICKUP_EXPIRED)"
        side_effects:
          - "picked_up_at <- clock"
          - "variant.on_hand_qty -= qty per line; reserved_online_qty -= qty per line"
      - from: READY_FOR_PICKUP
        to: EXPIRED_RELEASED
        trigger: "system (run-ops when clock > expires_at)"
        actor: system
        preconditions: ["fulfillment_status == READY_FOR_PICKUP and clock > expires_at"]
        side_effects:
          - "reserved_online_qty -= qty per line (stock released)"
          - "payment_status -> REFUNDED; refunded_cents <- total_cents; program.undistributed_profit_cents -= margin_cents"

  - entity: ExchangeRequest
    initial_state: PENDING
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /spirit-store/exchanges/{exchangeId}/decision {decision: APPROVED}"
        actor: Treasurer
        preconditions:
          - "status == PENDING (else ERR_INVALID_STATE_TRANSITION)"
          - "new_variant.available_qty >= 1 (else ERR_INSUFFICIENT_STOCK)"
        side_effects: ["new_variant.reserved_online_qty += 1 (unit held for swap)"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /spirit-store/exchanges/{exchangeId}/decision {decision: REJECTED, note}"
        actor: Treasurer
        preconditions: ["status == PENDING"]
        side_effects: []
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /spirit-store/exchanges/{exchangeId}/complete {condition, amount_collected_cents?}"
        actor: Treasurer
        preconditions:
          - "status == APPROVED"
          - "if differential_cents > 0: amount_collected_cents == differential_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "original_variant: on_hand_qty += 1 if condition == RESALEABLE, else written off (no restock)"
          - "new_variant: reserved_online_qty -= 1 AND on_hand_qty -= 1"
          - "differential_cents < 0: refund recorded against original order (order.refunded_cents += -differential_cents; payment_status may move to PARTIALLY_REFUNDED)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: drop-create-stale-program
    parent_entity: MerchProgram
    write_endpoint: "POST /spirit-store/seasonal-drops"
    occ_field: expected_program_version
    description: |
      Creating a SeasonalDrop against a MerchProgram whose version has advanced
      since the client last observed it is rejected. A prior drop creation (or any
      other program mutation) legitimately advanced the program's merchandising
      epoch, so the stale writer's view of the program configuration is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: design-resubmit-stale-version
    parent_entity: Design
    write_endpoint: "POST /spirit-store/designs/{designId}/licensing-transition"
    occ_field: expected_design_version
    description: |
      Any licensing transition against a Design whose version has advanced since the
      client last observed it is rejected. This captures the case where a resubmission
      or decision was already recorded (advancing revision state) and the current
      writer's view of the design is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (9 calculations)
# =============================================================================
calculations:
  - name: order_total_calc
    trigger: "POST /spirit-store/orders (at creation)"
    algorithm: aggregation
    formula: |
      for each line in lines (in request order):
        line_total[line] = round_half_up(unit_price_cents_of(variant) * qty * (1 - discount_pct))
      total_cents = sum(line_total)            # ROUND PER LINE, THEN SUM — pinned order
      margin_cents = sum(line_total[line] - qty[line] * variant.landed_unit_cost_cents_at_sale)
    input_set: "All lines of the request; unit price from ProductVariant.unit_price_cents at sale time"
    precision: "integer cents; round_half_up per line"
    constants: {}
    note: "Mode (b) nested-rounding: 3 lines of 333c at 10% off => per-line 300+300+300=900; sum-then-round would give 899. The scaffold pins per-line-then-sum."

  - name: preorder_deposit_calc
    trigger: "POST /spirit-store/preorders (at placement)"
    algorithm: threshold
    formula: |
      raw = round_half_up(campaign.unit_price_cents * qty * campaign.deposit_pct)
      deposit_due_cents = max(program.deposit_floor_cents, raw)
      balance_due_cents = campaign.unit_price_cents * qty - deposit_due_cents
    input_set: "The preorder's campaign + program deposit_floor_cents"
    precision: "integer cents; round_half_up"
    constants: {}

  - name: campaign_units_projection
    trigger: "read of campaign placed_units / paid_units; lock branch decision"
    algorithm: aggregation
    formula: |
      provisional (placed_units, forward-looking while OPEN):
        sum(qty) over preorders in {PLACED, PAID, FULFILLED}
      final (paid_units, lock-authoritative):
        sum(qty) over preorders in {PAID, FULFILLED}
      lock branch: IN_PRODUCTION iff paid_units >= goal_units else CANCELLED
    input_set: "PreOrders of the campaign filtered by status sets above; CANCELLED/REFUNDED always excluded"
    variants:
      - name: provisional
        when: "campaign OPEN — planning view includes unpaid PLACED demand"
        difference: "counts PLACED units; a campaign can show placed_units >= goal_units yet still cancel at lock"
      - name: final
        when: "at lock"
        difference: "excludes PLACED; identical data yields a smaller number whenever unpaid preorders exist"

  - name: stock_valuation_calc
    trigger: "GET /spirit-store/programs/{programId}/valuation (method override optional; default program.valuation_method)"
    algorithm: chronological
    formula: |
      FIFO: receipt layers = (received_at, qty, landed_unit_cost_cents) per RECEIVED/PARTIALLY_RECEIVED PO receipt,
            ordered received_at ASC then created_at ASC; consume layers against units sold/fulfilled in chronological
            order; valuation = sum over remaining layer units of qty * landed cost.
      WEIGHTED_AVG: per variant, avg = total_received_cost / total_received_qty (round_half_up to cents);
            valuation = sum over variants of on_hand_qty * avg.
      Same inputs produce different results whenever receipt costs differ across layers.
    input_set: "All PurchaseOrders of the program with qty_received > 0; all stock decrements (POS sales, fulfillments, exchange swaps) in chronological order"
    precision: "integer cents; round_half_up for WEIGHTED_AVG per-variant average"
    variants:
      - name: fifo
        when: "method==FIFO"
        difference: "remaining value uses newest layers' costs"
      - name: weighted_avg
        when: "method==WEIGHTED_AVG"
        difference: "remaining value uses blended average cost"

  - name: cash_over_short_calc
    trigger: "POST /spirit-store/event-sales/{eventId}/close-count"
    algorithm: threshold
    formula: |
      expected_drawer = opening_float_cents + cash_sales_cents - cash_refunds_cents
      over_short_cents = closing_counted_cents - expected_drawer
      if abs(over_short_cents) <= program.over_short_tolerance_cents: next status RECONCILED
      else: next status FLAGGED                      # boundary: exactly at tolerance reconciles
    input_set: "The event's drawer fields and program tolerance"
    precision: "integer cents; no rounding"
    constants: {}

  - name: allocation_waterfall_calc
    trigger: "POST /spirit-store/allocation-runs (lines computed and frozen at creation)"
    algorithm: waterfall_allocation
    formula: |
      inputs: distributable_cents D, accounts {(weight w_i, cap cap_i, balance b_i)}, rounding dust rule.
      1. W = sum of w_i over ALL accounts of the program
      2. raw_i = floor(D * w_i / W)
      3. credit_i = min(raw_i, remaining headroom h_i = cap_i - b_i) for capped accounts; uncapped h_i = infinity
      4. overflow = sum(max(0, raw_i - h_i)); redistribute overflow iteratively to uncapped-or-under-cap accounts
         proportional to their weights renormalized among recipients (floor each share); repeat until no overflow
         or no eligible recipient (if all capped: distribution is partial and run creation fails with
         ERR_ALLOCATION_EXCEEDS_PROFIT only when D > undistributed; capped-overflow with no recipient leaves
         undistributed remainder on the program — allowed and reported on the run)
      5. dust = D - sum(credit_i) after floors; assign dust to the eligible account with the largest weight;
         tie-break: created_at ASC
      CONSERVED: sum(credit_i) == D - undistributed_remainder; when no account is capped, sum(credit_i) == D exactly.
    input_set: "All ActivityAccounts of the program (any balance), the run's distributable_cents"
    precision: "integer cents; floor for shares; dust assigned deterministically"
    constants: {}

  - name: exchange_differential_calc
    trigger: "POST /spirit-store/exchanges (at creation)"
    algorithm: aggregation
    formula: |
      original_unit = unit price captured on the original order line for original_variant_id
      differential_cents = new_variant.unit_price_cents - original_unit
      positive: customer owes amount at complete; negative: refund owed at complete; zero: even swap
    input_set: "Original order line and new variant list price"
    precision: "integer cents"
    constants: {}

  - name: vendor_quote_selector
    trigger: "POST /spirit-store/preorder-campaigns/{campaignId}/lock (goal-met branch)"
    algorithm: constraint_propagation
    formula: |
      eligible = vendors v where v.status == APPROVED AND exists q in v.quotes:
        q.design_id == campaign.design_id AND q.status == ACTIVE
      rank: q.unit_cost_cents ASC, then q.production_days ASC, then v.created_at ASC
      empty eligible set -> ERR_NO_ELIGIBLE_VENDOR, campaign stays OPEN
      winner's quote supplies unit_cost_cents and min_order_qty for all auto-created POs
    input_set: "All vendors of the program and their quotes"
    constants: {}

  - name: landed_cost_calc
    trigger: "POST /spirit-store/purchase-orders/{poId}/receive (each receipt)"
    algorithm: aggregation
    formula: |
      fee_per_unit = round_half_up(design.licensing_fee_cents / po.qty_ordered)
      landed_unit_cost_cents = po.unit_cost_cents + fee_per_unit
      latest receipt wins (variant field overwritten on every receipt)
    input_set: "The receiving PO and its variant's design"
    precision: "integer cents; round_half_up"
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.7 (including Customer ownership: X-User-ID must equal the resource's customer_user_id for preorder cancel/pay and exchange create)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist, left to right (program, then resource)"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_DESIGN_NOT_FOUND | ERR_VARIANT_NOT_FOUND | ERR_DROP_NOT_FOUND | ERR_PO_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_PREORDER_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_EXCHANGE_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_ALLOCATION_RUN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Body FK references exist (design_id, variant_id, vendor_id, campaign_id, event_id, order_id, original/new_variant_id) and belong to the same program"
    error_id: "ERR_*_NOT_FOUND family (same ids as priority 3)"
    http_status: 404
    applies_to: "creation endpoints with body FKs"
  - priority: 5
    category: business_constraint
    check: "Request schema: required fields present, enum values valid, ranges valid (qty >= 1, pct in 0..1, closes_at > opens_at, ends_at > starts_at, amount_cents >= 1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 6
    category: state
    check: "Program gate: program.status == ACTIVE for catalog, campaign, event, order, preorder, exchange writes; program.status == CLOSED for allocation post"
    error_id: "ERR_PROGRAM_NOT_ACTIVE | ERR_PROGRAM_NOT_CLOSED"
    http_status: 409
    applies_to: "program-scoped writes"
  - priority: 7
    category: state
    check: "Target resource in a valid from-state for the requested transition (incl. ERR_CAMPAIGN_NOT_OPEN, ERR_DROP_NOT_OPEN, ERR_DRAWER_NOT_OPEN, ERR_PREORDER_NOT_PAYABLE, ERR_PREORDER_NOT_CANCELLABLE, ERR_PICKUP_NOT_READY, ERR_PICKUP_EXPIRED, ERR_EVENT_WINDOW_PASSED, ERR_VENDOR_NOT_APPROVED, else ERR_INVALID_STATE_TRANSITION)"
    error_id: "state error family"
    http_status: 409
    applies_to: "transition and state-dependent endpoints"
  - priority: 8
    category: business_safety
    check: "Licensing gate: selling, preordering, or submitting a PO requires design.status == APPROVED; REVOKED design on a sale attempt yields ERR_LICENSE_REVOKED; non-approved yields ERR_DESIGN_NOT_LICENSED"
    error_id: "ERR_LICENSE_REVOKED | ERR_DESIGN_NOT_LICENSED"
    http_status: 409
    applies_to: "POST /orders, POST /preorders, POST /purchase-orders/{id}/submit, POST /preorder-campaigns/{id}/open"
  - priority: 9
    category: business_temporal
    check: "Temporal windows: drop sales window open (ERR_DROP_NOT_OPEN), drop window overlap on create (ERR_DROP_WINDOW_OVERLAP), register buffer conflict (ERR_EVENT_REGISTER_CONFLICT), campaign window for open/lock (ERR_CAMPAIGN_NOT_OPEN / ERR_CAMPAIGN_WINDOW_STILL_OPEN), exchange window (ERR_EXCHANGE_WINDOW_CLOSED)"
    error_id: "temporal error family"
    http_status: 409
    applies_to: "windowed endpoints"
  - priority: 10
    category: business_constraint
    check: "Constraint satisfaction: stock sufficiency (ERR_INSUFFICIENT_STOCK), vendor minimum order qty (ERR_MIN_ORDER_QTY), duplicate active campaign per design (ERR_DUPLICATE_ACTIVE_CAMPAIGN), duplicate variant (design,size) per program (ERR_DUPLICATE_VARIANT), preorder variant matches campaign design (ERR_VARIANT_DESIGN_MISMATCH), exchange same-design different-size (ERR_EXCHANGE_VARIANT_MISMATCH), segregation of duties counted_by != opened_by (ERR_SEGREGATION_OF_DUTIES), unresolved sub-resources at program close (ERR_UNRESOLVED_OPERATIONS)"
    error_id: "constraint error family"
    http_status: 422
    applies_to: "constraint-checked endpoints"
  - priority: 11
    category: business_fiscal
    check: "Fiscal: deposit/balance exact amounts (ERR_DEPOSIT_SHORTFALL below, ERR_PAYMENT_AMOUNT_MISMATCH above/mismatched), refund within paid amount (ERR_REFUND_EXCEEDS_PAID), allocation within undistributed profit (ERR_ALLOCATION_EXCEEDS_PROFIT), reconcile precondition profit fully allocated (ERR_PROFIT_NOT_FULLY_ALLOCATED)"
    error_id: "fiscal error family"
    http_status: 402
    applies_to: "payment and allocation endpoints"
  - priority: 12
    category: business_constraint
    check: "Selector result exists: campaign lock goal-met branch requires an eligible vendor quote"
    error_id: ERR_NO_ELIGIBLE_VENDOR
    http_status: 422
    applies_to: "POST /spirit-store/preorder-campaigns/{campaignId}/lock"
  - priority: 13
    category: state
    check: "OCC: expected_program_version matches MerchProgram.version on drop create; expected_design_version matches Design.version on licensing transitions"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /spirit-store/seasonal-drops, POST /spirit-store/designs/{designId}/licensing-transition"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- MerchProgram ---
  - { method: POST, path: "/spirit-store/programs", description: "Create a MerchProgram (status SETUP)", roles: [ActivitiesDirector], code: 201, input: [name, school_year, valuation_method, "over_short_tolerance_cents?", "exchange_window_days?", "pickup_window_days?", "register_buffer_minutes?", "deposit_floor_cents?"], output: MerchProgram, side_effects: ["undistributed_profit_cents=0, distributed_profit_cents=0, ops_run_index=0"] }
  - { method: GET, path: "/spirit-store/programs", description: "List programs", roles: [ActivitiesDirector, StoreManager, Treasurer, LicensingCoordinator, StudentCashier], code: 200, input: ["limit?", "offset?"], output: "MerchProgram[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/programs/{programId}", description: "Get one program", roles: [ActivitiesDirector, StoreManager, Treasurer, LicensingCoordinator, StudentCashier], code: 200, input: [], output: MerchProgram, side_effects: [] }
  - { method: POST, path: "/spirit-store/programs/{programId}/lifecycle", description: "Program lifecycle transition (ACTIVE|CLOSED|RECONCILED)", roles: [ActivitiesDirector], code: 200, input: [to_state], output: MerchProgram, side_effects: ["increments MerchProgram.version by 1"] }
  - { method: POST, path: "/spirit-store/programs/{programId}/profit-adjustments", description: "Post a manual profit adjustment (e.g., donation, fundraiser sweep) to undistributed profit", roles: [ActivitiesDirector], code: 201, input: [amount_cents, reason], output: MerchProgram, side_effects: ["undistributed_profit_cents += amount_cents", "increments MerchProgram.version by 1"] }
  - { method: GET, path: "/spirit-store/programs/{programId}/valuation", description: "Computed read: inventory valuation under program.valuation_method or ?method override", roles: [ActivitiesDirector, StoreManager, Treasurer], code: 200, input: ["method?"], output: "{ method: string, total_value_cents: integer, per_variant: array }", side_effects: [] }
  - { method: POST, path: "/spirit-store/programs/{programId}/run-ops", description: "Ops-run checkpoint: advances ops_run_index; auto-closes OPEN drops with closes_at <= clock; expires READY_FOR_PICKUP orders with expires_at < clock (EXPIRED_RELEASED + refund + reservation release)", roles: [ActivitiesDirector], code: 200, input: [], output: MerchProgram, side_effects: ["ops_run_index += 1", "epoch side effects per description"] }

  # --- Vendor ---
  - { method: POST, path: "/spirit-store/vendors", description: "Create a Vendor (status PENDING) with optional quotes", roles: [StoreManager], code: 201, input: [program_id, name, contact_email, "quotes?"], output: Vendor, side_effects: [] }
  - { method: GET, path: "/spirit-store/vendors", description: "List vendors", roles: [ActivitiesDirector, StoreManager, Treasurer], code: 200, input: ["program_id?", "limit?", "offset?"], output: "Vendor[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/vendors/{vendorId}", description: "Get one vendor", roles: [ActivitiesDirector, StoreManager, Treasurer], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: PATCH, path: "/spirit-store/vendors/{vendorId}", description: "Update vendor status (APPROVED|SUSPENDED) and/or replace quotes array", roles: [StoreManager], code: 200, input: ["status?", "quotes?"], output: Vendor, side_effects: ["status transitions per Vendor machine; increments Vendor.version by 1"] }

  # --- Design ---
  - { method: POST, path: "/spirit-store/designs", description: "Create a Design (status DRAFT)", roles: [StoreManager], code: 201, input: [program_id, name, artwork_ref, royalty_pct, licensing_fee_cents], output: Design, side_effects: ["revision_count=0"] }
  - { method: GET, path: "/spirit-store/designs", description: "List designs", roles: [ActivitiesDirector, StoreManager, Treasurer, LicensingCoordinator], code: 200, input: ["program_id?", "limit?", "offset?"], output: "Design[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/designs/{designId}", description: "Get one design", roles: [ActivitiesDirector, StoreManager, Treasurer, LicensingCoordinator], code: 200, input: [], output: Design, side_effects: [] }
  - { method: POST, path: "/spirit-store/designs/{designId}/licensing-transition", description: "Licensing workflow transition (SUBMITTED|APPROVED|REJECTED|REVOKED); OCC-guarded", roles: [LicensingCoordinator], code: 200, input: [to_state, expected_design_version, "note?"], output: Design, side_effects: ["transition per Design machine incl. REVOKED cascade", "increments Design.version by 1"] }

  # --- ProductVariant ---
  - { method: POST, path: "/spirit-store/product-variants", description: "Create a SKU (design x size); unique (design_id,size) per program", roles: [StoreManager], code: 201, input: [program_id, design_id, size, unit_price_cents, "drop_id?", "reorder_point?"], output: ProductVariant, side_effects: ["on_hand_qty=0, reserved_online_qty=0"] }
  - { method: GET, path: "/spirit-store/product-variants", description: "List variants (FK reverse-reachability for design_id, drop_id)", roles: [ActivitiesDirector, StoreManager, Treasurer, StudentCashier], code: 200, input: ["program_id?", "design_id?", "drop_id?", "limit?", "offset?"], output: "ProductVariant[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/product-variants/{variantId}", description: "Get one variant", roles: [ActivitiesDirector, StoreManager, Treasurer, StudentCashier], code: 200, input: [], output: ProductVariant, side_effects: [] }

  # --- SeasonalDrop ---
  - { method: POST, path: "/spirit-store/seasonal-drops", description: "Create a SeasonalDrop; half-open window [opens_at, closes_at) must not overlap any other non-terminal... any other drop window of the same program (adjacency allowed); OCC-guarded on MerchProgram.version", roles: [StoreManager], code: 201, input: [program_id, name, opens_at, closes_at, expected_program_version], output: SeasonalDrop, side_effects: ["increments MerchProgram.version by 1"] }
  - { method: GET, path: "/spirit-store/seasonal-drops", description: "List drops", roles: [ActivitiesDirector, StoreManager, Treasurer], code: 200, input: ["program_id?", "limit?", "offset?"], output: "SeasonalDrop[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/seasonal-drops/{dropId}", description: "Get one drop", roles: [ActivitiesDirector, StoreManager, Treasurer], code: 200, input: [], output: SeasonalDrop, side_effects: [] }
  - { method: POST, path: "/spirit-store/seasonal-drops/{dropId}/transition", description: "Drop lifecycle transition (OPEN|CLOSED|SETTLED)", roles: [StoreManager], code: 200, input: [to_state], output: SeasonalDrop, side_effects: ["per SeasonalDrop machine incl. settle margin snapshot"] }

  # --- PurchaseOrder ---
  - { method: POST, path: "/spirit-store/purchase-orders", description: "Create a stock PurchaseOrder (status DRAFT); unit_cost captured from the vendor's ACTIVE quote on the variant's design (404/422 if none: ERR_NO_ELIGIBLE_VENDOR)", roles: [StoreManager], code: 201, input: [program_id, variant_id, vendor_id, qty_ordered], output: PurchaseOrder, side_effects: ["qty_received=0, auto_created=false"] }
  - { method: GET, path: "/spirit-store/purchase-orders", description: "List POs (FK reverse-reachability for variant_id, vendor_id, campaign_id)", roles: [ActivitiesDirector, StoreManager, Treasurer], code: 200, input: ["program_id?", "variant_id?", "vendor_id?", "campaign_id?", "limit?", "offset?"], output: "PurchaseOrder[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/purchase-orders/{poId}", description: "Get one PO", roles: [ActivitiesDirector, StoreManager, Treasurer], code: 200, input: [], output: PurchaseOrder, side_effects: [] }
  - { method: POST, path: "/spirit-store/purchase-orders/{poId}/submit", description: "Submit a DRAFT PO (validates vendor approved, design licensed, min order qty)", roles: [StoreManager], code: 200, input: [], output: PurchaseOrder, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/spirit-store/purchase-orders/{poId}/receive", description: "Receive qty against a SUBMITTED/PARTIALLY_RECEIVED PO; exact completion flips to RECEIVED and fires campaign bubble-up", roles: [StoreManager], code: 200, input: [qty], output: PurchaseOrder, side_effects: ["qty_received += qty; variant.on_hand_qty += qty; landed_unit_cost recomputed; campaign IN_PRODUCTION -> FULFILLING when all campaign POs RECEIVED"] }
  - { method: POST, path: "/spirit-store/purchase-orders/{poId}/cancel", description: "Cancel a DRAFT or SUBMITTED PO", roles: [StoreManager], code: 200, input: [], output: PurchaseOrder, side_effects: [] }

  # --- PreOrderCampaign ---
  - { method: POST, path: "/spirit-store/preorder-campaigns", description: "Create a preorder campaign (status DRAFT)", roles: [StoreManager], code: 201, input: [program_id, design_id, unit_price_cents, deposit_pct, goal_units, opens_at, closes_at], output: PreOrderCampaign, side_effects: [] }
  - { method: GET, path: "/spirit-store/preorder-campaigns", description: "List campaigns (FK reverse-reachability for design_id, selected_vendor_id)", roles: [ActivitiesDirector, StoreManager, Treasurer, Customer], code: 200, input: ["program_id?", "design_id?", "selected_vendor_id?", "limit?", "offset?"], output: "PreOrderCampaign[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/preorder-campaigns/{campaignId}", description: "Get one campaign (incl. placed_units / paid_units projections)", roles: [ActivitiesDirector, StoreManager, Treasurer, Customer], code: 200, input: [], output: PreOrderCampaign, side_effects: [] }
  - { method: POST, path: "/spirit-store/preorder-campaigns/{campaignId}/open", description: "Open a DRAFT campaign", roles: [StoreManager], code: 200, input: [], output: PreOrderCampaign, side_effects: ["status -> OPEN"] }
  - { method: POST, path: "/spirit-store/preorder-campaigns/{campaignId}/lock", description: "Lock an OPEN campaign: goal-met -> IN_PRODUCTION + vendor selector + auto POs; goal-unmet -> CANCELLED + refund cascade", roles: [StoreManager], code: 200, input: [], output: PreOrderCampaign, side_effects: ["per PreOrderCampaign lock branch side effects"] }
  - { method: POST, path: "/spirit-store/preorder-campaigns/{campaignId}/cancel", description: "Manager abandons a DRAFT or OPEN campaign; OPEN cancel fires the refund cascade", roles: [StoreManager], code: 200, input: [], output: PreOrderCampaign, side_effects: ["OPEN: PAID preorders REFUNDED, PLACED CANCELLED"] }

  # --- PreOrder ---
  - { method: POST, path: "/spirit-store/preorders", description: "Place a preorder (status PLACED; deposit computed)", roles: [Customer], code: 201, input: [program_id, campaign_id, variant_id, customer_user_id, qty], output: PreOrder, side_effects: ["deposit_due_cents/balance_due_cents computed; campaign placed_units recomputed"] }
  - { method: GET, path: "/spirit-store/preorders", description: "List preorders (FK reverse-reachability for campaign_id, variant_id)", roles: [ActivitiesDirector, StoreManager, Treasurer, Customer], code: 200, input: ["program_id?", "campaign_id?", "variant_id?", "customer_user_id?", "limit?", "offset?"], output: "PreOrder[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/preorders/{preorderId}", description: "Get one preorder", roles: [ActivitiesDirector, StoreManager, Treasurer, Customer], code: 200, input: [], output: PreOrder, side_effects: [] }
  - { method: POST, path: "/spirit-store/preorders/{preorderId}/pay", description: "Pay deposit (phase=DEPOSIT while PLACED) or balance (phase=BALANCE while PAID and campaign IN_PRODUCTION/FULFILLING)", roles: [Customer], code: 200, input: [phase, amount_cents], output: PreOrder, side_effects: ["per PreOrder pay transition"] }
  - { method: POST, path: "/spirit-store/preorders/{preorderId}/fulfill", description: "Fulfill a PAID preorder against on-hand stock", roles: [StoreManager], code: 200, input: [], output: PreOrder, side_effects: ["on_hand -= qty; program profit += margin net of royalty; possible campaign auto-close"] }
  - { method: POST, path: "/spirit-store/preorders/{preorderId}/cancel", description: "Customer cancels a PLACED preorder (or PAID while campaign still OPEN — deposit refunded)", roles: [Customer], code: 200, input: [], output: PreOrder, side_effects: ["PAID cancel while OPEN: refunded_cents = deposit_paid_cents"] }

  # --- EventSale ---
  - { method: POST, path: "/spirit-store/event-sales", description: "Schedule a POS event; register bookings obey closed-interval + buffer conflict rule", roles: [StoreManager], code: 201, input: [program_id, name, register_location, starts_at, ends_at], output: EventSale, side_effects: [] }
  - { method: GET, path: "/spirit-store/event-sales", description: "List events", roles: [ActivitiesDirector, StoreManager, Treasurer, StudentCashier], code: 200, input: ["program_id?", "limit?", "offset?"], output: "EventSale[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/event-sales/{eventId}", description: "Get one event (incl. drawer totals and over_short)", roles: [ActivitiesDirector, StoreManager, Treasurer, StudentCashier], code: 200, input: [], output: EventSale, side_effects: [] }
  - { method: POST, path: "/spirit-store/event-sales/{eventId}/open-drawer", description: "Open the cash drawer with a starting float; records opener identity", roles: [StudentCashier], code: 200, input: [opening_float_cents], output: EventSale, side_effects: ["status -> OPEN; opened_by_user_id recorded"] }
  - { method: POST, path: "/spirit-store/event-sales/{eventId}/close-count", description: "Count the drawer (counter != opener); computes over_short; auto RECONCILED within tolerance else FLAGGED; recount allowed from FLAGGED", roles: [Treasurer], code: 200, input: [closing_counted_cents], output: EventSale, side_effects: ["per EventSale machine"] }
  - { method: POST, path: "/spirit-store/event-sales/{eventId}/reconcile", description: "Director override: reconcile a FLAGGED event with a note", roles: [ActivitiesDirector], code: 200, input: [note], output: EventSale, side_effects: ["status -> RECONCILED; reconcile_note recorded"] }
  - { method: POST, path: "/spirit-store/event-sales/{eventId}/cancel", description: "Cancel a SCHEDULED event", roles: [StoreManager], code: 200, input: [], output: EventSale, side_effects: [] }

  # --- Order ---
  - { method: POST, path: "/spirit-store/orders", description: "Create an order. EVENT_POS: event must be OPEN (drawer open); stock decremented immediately; event totals updated. ONLINE: drop rules per variant; stock reserved (reserved_online_qty += qty); fulfillment PICKUP_PENDING.", roles: [StudentCashier, Customer], code: 201, input: [program_id, channel, customer_user_id, payment_method, lines, "event_id?"], output: Order, side_effects: ["total_cents/margin_cents computed; program.undistributed_profit_cents += margin_cents; channel-specific stock and event effects"] }
  - { method: GET, path: "/spirit-store/orders", description: "List orders (FK reverse-reachability for event_id)", roles: [ActivitiesDirector, StoreManager, Treasurer, StudentCashier, Customer], code: 200, input: ["program_id?", "event_id?", "variant_id?", "customer_user_id?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/orders/{orderId}", description: "Get one order", roles: [ActivitiesDirector, StoreManager, Treasurer, StudentCashier, Customer], code: 200, input: [], output: Order, side_effects: [] }
  - { method: POST, path: "/spirit-store/orders/{orderId}/fulfillment-transition", description: "Online fulfillment transition (READY_FOR_PICKUP | PICKED_UP)", roles: [StoreManager], code: 200, input: [to_state], output: Order, side_effects: ["per Order fulfillment machine"] }
  - { method: POST, path: "/spirit-store/orders/{orderId}/refund", description: "Refund an order fully or partially; POS CASH refunds adjust event drawer totals; ONLINE refunds release reservations", roles: [Treasurer], code: 200, input: [amount_cents], output: Order, side_effects: ["per Order refund transitions incl. profit reversal"] }

  # --- ExchangeRequest ---
  - { method: POST, path: "/spirit-store/exchanges", description: "Open a size exchange for a fulfilled order line within the exchange window; Customer may only open on own order", roles: [Customer, Treasurer], code: 201, input: [program_id, order_id, original_variant_id, new_variant_id], output: ExchangeRequest, side_effects: ["differential_cents computed"] }
  - { method: GET, path: "/spirit-store/exchanges", description: "List exchanges (FK reverse-reachability for order_id, original_variant_id, new_variant_id)", roles: [ActivitiesDirector, StoreManager, Treasurer, Customer], code: 200, input: ["program_id?", "order_id?", "original_variant_id?", "new_variant_id?", "limit?", "offset?"], output: "ExchangeRequest[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/exchanges/{exchangeId}", description: "Get one exchange", roles: [ActivitiesDirector, StoreManager, Treasurer, Customer], code: 200, input: [], output: ExchangeRequest, side_effects: [] }
  - { method: POST, path: "/spirit-store/exchanges/{exchangeId}/decision", description: "Approve (reserves new unit) or reject an exchange", roles: [Treasurer], code: 200, input: [decision, "note?"], output: ExchangeRequest, side_effects: ["APPROVED: new_variant.reserved_online_qty += 1"] }
  - { method: POST, path: "/spirit-store/exchanges/{exchangeId}/complete", description: "Complete an approved exchange: settle differential, restock or write off original, decrement new unit", roles: [Treasurer], code: 200, input: [condition, "amount_collected_cents?"], output: ExchangeRequest, side_effects: ["per ExchangeRequest complete side effects"] }

  # --- ActivityAccount ---
  - { method: POST, path: "/spirit-store/activity-accounts", description: "Create an activity account", roles: [ActivitiesDirector], code: 201, input: [program_id, name, allocation_weight, "cap_cents?"], output: ActivityAccount, side_effects: ["balance_cents=0"] }
  - { method: GET, path: "/spirit-store/activity-accounts", description: "List activity accounts", roles: [ActivitiesDirector, Treasurer], code: 200, input: ["program_id?", "limit?", "offset?"], output: "ActivityAccount[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/activity-accounts/{accountId}", description: "Get one activity account", roles: [ActivitiesDirector, Treasurer], code: 200, input: [], output: ActivityAccount, side_effects: [] }

  # --- AllocationRun ---
  - { method: POST, path: "/spirit-store/allocation-runs", description: "Create a DRAFT allocation run; waterfall lines computed and frozen", roles: [Treasurer], code: 201, input: [program_id, distributable_cents], output: AllocationRun, side_effects: ["lines computed by allocation_waterfall_calc"] }
  - { method: GET, path: "/spirit-store/allocation-runs", description: "List allocation runs", roles: [ActivitiesDirector, Treasurer], code: 200, input: ["program_id?", "limit?", "offset?"], output: "AllocationRun[]", side_effects: [] }
  - { method: GET, path: "/spirit-store/allocation-runs/{runId}", description: "Get one allocation run", roles: [ActivitiesDirector, Treasurer], code: 200, input: [], output: AllocationRun, side_effects: [] }
  - { method: POST, path: "/spirit-store/allocation-runs/{runId}/post", description: "Post a DRAFT run (program must be CLOSED): credits account balances, moves profit to distributed", roles: [Treasurer], code: 200, input: [], output: AllocationRun, side_effects: ["account.balance_cents += credit per line; program.undistributed_profit_cents -= sum(credits); program.distributed_profit_cents += sum(credits)"] }
  - { method: POST, path: "/spirit-store/allocation-runs/{runId}/reverse", description: "Reverse a POSTED run: debits accounts back, restores undistributed profit (compensating action)", roles: [Treasurer], code: 200, input: [], output: AllocationRun, side_effects: ["account.balance_cents -= credit per line; program.undistributed_profit_cents += sum(credits); program.distributed_profit_cents -= sum(credits)"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/spirit-store/_clock/set_current_utc", description: "Set the server's logical clock (ISO8601). DEFAULT: before any set call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.", roles: [ActivitiesDirector], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for endpoint, or Customer acting on another customer's resource" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "programId or program_id does not exist" }
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "vendor id/reference does not exist" }
  - { id: ERR_DESIGN_NOT_FOUND, http: 404, condition: "design id/reference does not exist" }
  - { id: ERR_VARIANT_NOT_FOUND, http: 404, condition: "variant id/reference does not exist" }
  - { id: ERR_DROP_NOT_FOUND, http: 404, condition: "drop id/reference does not exist" }
  - { id: ERR_PO_NOT_FOUND, http: 404, condition: "purchase order id does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "campaign id/reference does not exist" }
  - { id: ERR_PREORDER_NOT_FOUND, http: 404, condition: "preorder id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event id/reference does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id/reference does not exist" }
  - { id: ERR_EXCHANGE_NOT_FOUND, http: 404, condition: "exchange id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "activity account id does not exist" }
  - { id: ERR_ALLOCATION_RUN_NOT_FOUND, http: 404, condition: "allocation run id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/enum/range violation (missing required field, bad enum, qty < 1, pct outside 0..1, closes_at <= opens_at, receive qty invalid, etc.)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Write requires program.status == ACTIVE" }
  - { id: ERR_PROGRAM_NOT_CLOSED, http: 409, condition: "Allocation post requires program.status == CLOSED" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested transition not allowed from current state (generic machine violation)" }
  - { id: ERR_DESIGN_NOT_LICENSED, http: 409, condition: "Design not in APPROVED status where licensing approval is required (and not REVOKED)" }
  - { id: ERR_LICENSE_REVOKED, http: 409, condition: "Design was REVOKED; selling/ordering its variants is forbidden" }
  - { id: ERR_DROP_NOT_OPEN, http: 409, condition: "Online sale of a drop variant requires the drop to be OPEN" }
  - { id: ERR_DROP_WINDOW_NOT_STARTED, http: 409, condition: "Drop open attempted before opens_at" }
  - { id: ERR_DROP_WINDOW_OVERLAP, http: 409, condition: "Drop window [opens_at, closes_at) overlaps an existing drop window of the same program (half-open; adjacency allowed)" }
  - { id: ERR_EVENT_REGISTER_CONFLICT, http: 409, condition: "Event booking collides with another non-CANCELLED event on the same register under closed-interval + register_buffer_minutes rule" }
  - { id: ERR_EVENT_WINDOW_PASSED, http: 409, condition: "open-drawer attempted after the event's ends_at" }
  - { id: ERR_DRAWER_NOT_OPEN, http: 409, condition: "POS sale or POS refund requires event status == OPEN" }
  - { id: ERR_VENDOR_NOT_APPROVED, http: 409, condition: "PO submit requires vendor.status == APPROVED" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "Operation requires campaign in a specific status (OPEN for preorder/pay-deposit/open-window; FULFILLING for fulfill)" }
  - { id: ERR_CAMPAIGN_WINDOW_STILL_OPEN, http: 409, condition: "Lock attempted before closes_at" }
  - { id: ERR_DUPLICATE_ACTIVE_CAMPAIGN, http: 409, condition: "Another campaign of the same design is already OPEN/IN_PRODUCTION/FULFILLING" }
  - { id: ERR_DUPLICATE_VARIANT, http: 409, condition: "A variant with the same (design_id, size) already exists in the program" }
  - { id: ERR_VARIANT_DESIGN_MISMATCH, http: 422, condition: "Preorder variant's design_id does not match the campaign's design_id" }
  - { id: ERR_PREORDER_NOT_PAYABLE, http: 409, condition: "Pay attempted on a preorder not in a payable state (or wrong phase for state)" }
  - { id: ERR_PREORDER_NOT_CANCELLABLE, http: 409, condition: "Customer cancel attempted after campaign lock (campaign not OPEN) or on terminal preorder" }
  - { id: ERR_PICKUP_NOT_READY, http: 409, condition: "Fulfillment transition not allowed from current fulfillment_status" }
  - { id: ERR_PICKUP_EXPIRED, http: 409, condition: "Pickup attempted after expires_at" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "available_qty insufficient for sale/fulfill/exchange-approve" }
  - { id: ERR_MIN_ORDER_QTY, http: 422, condition: "qty_ordered below the vendor quote's min_order_qty" }
  - { id: ERR_NO_ELIGIBLE_VENDOR, http: 422, condition: "No APPROVED vendor with an ACTIVE quote for the design (campaign lock goal-met branch or manual PO without quote)" }
  - { id: ERR_EXCHANGE_VARIANT_MISMATCH, http: 422, condition: "Exchange new variant must share the original variant's design and differ in size; original variant must appear in the order's lines" }
  - { id: ERR_EXCHANGE_WINDOW_CLOSED, http: 422, condition: "Exchange opened after fulfillment + program.exchange_window_days (last day inclusive)" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "refunded_cents + amount_cents > total_cents" }
  - { id: ERR_DEPOSIT_SHORTFALL, http: 402, condition: "Payment amount below the due amount for the phase (deposit or balance)" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount exceeds/mismatches the exact due amount (overpay deposit/balance; exchange differential not collected exactly)" }
  - { id: ERR_ALLOCATION_EXCEEDS_PROFIT, http: 422, condition: "distributable_cents > program.undistributed_profit_cents (or < 1)" }
  - { id: ERR_UNRESOLVED_OPERATIONS, http: 409, condition: "Program close/reconcile blocked by non-terminal EventSales, PreOrderCampaigns, or DRAFT allocation runs" }
  - { id: ERR_PROFIT_NOT_FULLY_ALLOCATED, http: 409, condition: "Program reconcile requires undistributed_profit_cents == 0" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "close-count X-User-ID equals opened_by_user_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ActivitiesDirector
    description: "School activities office director; owns program lifecycle, profit adjustments, allocation governance, drawer discrepancy override, ops runs, clock"
    identity: opaque
    exclusive_operations:
      - "POST /spirit-store/programs, POST .../lifecycle, POST .../profit-adjustments, POST .../run-ops"
      - "POST /spirit-store/event-sales/{id}/reconcile (FLAGGED override)"
      - "POST /spirit-store/activity-accounts"
      - "POST /spirit-store/_clock/set_current_utc"
    shared_operations:
      - "GET read endpoints per §1.5 roles"
  - name: StoreManager
    description: "Spirit store manager; owns catalog (vendors, designs as creator, variants, drops), purchase orders, campaigns, events scheduling, fulfillment"
    identity: opaque
    exclusive_operations:
      - "POST/PATCH /spirit-store/vendors*"
      - "POST /spirit-store/designs (creator — cannot approve own submission; licensing is LicensingCoordinator's)"
      - "POST /spirit-store/product-variants, /seasonal-drops*, /purchase-orders*, /preorder-campaigns*"
      - "POST /spirit-store/event-sales (schedule), /event-sales/{id}/cancel"
      - "POST /spirit-store/orders/{id}/fulfillment-transition, POST /spirit-store/preorders/{id}/fulfill"
    shared_operations:
      - "GET read endpoints per §1.5 roles"
  - name: LicensingCoordinator
    description: "District licensing/trademark officer; sole approver of design artwork (segregated from design creator)"
    identity: opaque
    exclusive_operations:
      - "POST /spirit-store/designs/{id}/licensing-transition"
    shared_operations:
      - "GET /spirit-store/designs*, GET /spirit-store/programs*"
  - name: Treasurer
    description: "Finance officer; counts drawers (never the opener), refunds, exchange decisions, allocation runs"
    identity: opaque
    exclusive_operations:
      - "POST /spirit-store/event-sales/{id}/close-count"
      - "POST /spirit-store/orders/{id}/refund"
      - "POST /spirit-store/exchanges/{id}/decision, /complete"
      - "POST /spirit-store/allocation-runs*, /post, /reverse"
    shared_operations:
      - "GET read endpoints per §1.5 roles"
  - name: StudentCashier
    description: "Student worker staffing the POS at events; opens drawers and rings up event sales"
    identity: opaque
    exclusive_operations:
      - "POST /spirit-store/event-sales/{id}/open-drawer"
      - "POST /spirit-store/orders with channel EVENT_POS"
    shared_operations:
      - "GET read endpoints per §1.5 roles"
  - name: Customer
    description: "Student/parent buyer at the online store; places preorders and online orders; ownership checked via X-User-ID == customer_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /spirit-store/preorders, /preorders/{id}/pay, /preorders/{id}/cancel (own only)"
      - "POST /spirit-store/orders with channel ONLINE"
      - "POST /spirit-store/exchanges (own orders only)"
    shared_operations:
      - "GET /spirit-store/preorder-campaigns*, GET /spirit-store/preorders*, GET /spirit-store/orders*, GET /spirit-store/exchanges*"
