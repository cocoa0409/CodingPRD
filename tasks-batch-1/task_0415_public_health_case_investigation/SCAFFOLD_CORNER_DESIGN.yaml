              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_SCHEDULED_MONITORING"

      - name: transfer_not_resolvable_when_already_accepted
        claim_type: Violation to Error
        grounds:
          - errors[ERR_TRANSFER_NOT_RESOLVABLE]
          - state_machines.JurisdictionTransfer.REQUESTED_to_ACCEPTED
        distinguishing_aspect: |
          A transfer already ACCEPTED rejects a second resolve (PUT status=REJECTED) with 409
          ERR_TRANSFER_NOT_RESOLVABLE — terminal transfer guard.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdictions J1 and J2; case CA in J1 interviewed; transfer TR opened to J2 then ACCEPTED."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 2", fips_code: "06002" }
              as: JurisdictionAdmin
              captures: { j2: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-A", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ca: $.data.id }
            - call: "POST /surveillance/cases/${ca}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "GET /surveillance/cases/${ca}"
              as: EpiAnalyst
              captures: { ca_v: $.data.version }
            - call: "POST /surveillance/jurisdiction-transfers"
              payload: { program_id: "${prog}", case_id: "${ca}", to_jurisdiction_id: "${j2}", expected_case_version: "${ca_v}" }
              as: EpiAnalyst
              captures: { tr: $.data.id }
            - call: "PUT /surveillance/jurisdiction-transfers/${tr}"
