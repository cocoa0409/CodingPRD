  - name: validation_cascading_advocacy_objection_covered_by_difficulty_design
    claim_type: cascading_validation
    grounds:
    - validations[priority=8]
    - state_machines.DonorCandidate.advocacy.DISCLOSED_to_OBJECTED
    excluded_because:
      difficulty_instance: transitive_cascade / advocate_objection_four_hop_chain_teardown
      rationale: That §1.8 instance validates the whole four-hop consequence set of one refusal-triggering
        determination, which is the cascading-validation claim.
  - name: validation_aggregate_follow_up_threshold_covered_by_difficulty_design
    claim_type: aggregate_validation
    grounds:
    - validations[priority=21]
    - calculations.program_follow_up_compliance
    excluded_because:
      difficulty_instance: boundary_precision_check / follow_up_completeness_threshold_and_due_on_boundary
      rationale: That §1.8 instance pins both the per-row completeness threshold and the program-level
        aggregate on their exact boundaries, which is the aggregate-validation claim.
  - name: validation_state_before_clearance_priority_pair_covered_by_difficulty_design
    claim_type: priority_ordering
    grounds:
    - validations[priority=8]
    - validations[priority=12]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / state_transition_precedes_clearance_safety_on_reattestation
      rationale: That §1.8 instance forces priority 8 and priority 12 to fire on one request and asserts
        the lower number answers, which is the priority-ordering claim for that pair.
