  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: statement_min_payout_boundary_2500_vs_2499
        grounds:
          - calculations.statement_settlement
          - entities.RoyaltyStatement.fields.payout_status
          - entities.RoyaltyStatement.fields.net_payable_cents
          - validations[priority=47]
          - errors[ERR_STATEMENT_NOT_PAYABLE]
          - state_machines.RoyaltyStatement.FINALIZED_to_PAID
        distinguishing_aspect: |
          Numeric-threshold boundary on the MIN_PAYOUT_CENTS metric reached through
          POST /music-library/royalty-statements: gross 3571 yields net exactly 2500 and
          payout_status PAYABLE, while gross 3570 yields net 2499 and HELD_BELOW_MINIMUM, so the
          comparison must be net < 2500 and not net <= 2500 (both cases share withholding 1071).
        test_recipe:
          setup:
            - "Two composers, each with tax_withholding_pct 0.30 and no agreement (so outstanding_advance_cents is 0)."
            - "Composer C1 holds a single manual ADJUSTMENT ledger entry of 3571 cents; composer C2 holds a single manual ADJUSTMENT entry of 3570 cents."
            - "Both entries are stamped at the logical clock 2026-08-01T00:00:00Z, inside the statement window 2026-08-01..2026-08-31."
            - "Each composer's current version has been read so the OCC value passed at statement creation is fresh."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Boundary Composer One", pro_affiliation: "ASCAP", payee_country: "US", tax_withholding_pct: 0.30 }
              as: RightsManager
              captures: { c1: $.data.id }
            - call: "POST /music-library/composers"
              payload: { display_name: "Boundary Composer Two", pro_affiliation: "ASCAP", payee_country: "US", tax_withholding_pct: 0.30 }
              as: RightsManager
              captures: { c2: $.data.id }
            - call: "POST /music-library/royalty-ledger-entries"
              payload: { composer_id: "${c1}", source_type: "ADJUSTMENT", amount_cents: 3571, memo: "boundary at the minimum" }
              as: RoyaltyAccountant
              as_user_id: "acct-1"
            - call: "POST /music-library/royalty-ledger-entries"
              payload: { composer_id: "${c2}", source_type: "ADJUSTMENT", amount_cents: 3570, memo: "boundary one cent below" }
              as: RoyaltyAccountant
              as_user_id: "acct-1"
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
              captures: { c1_v: $.data.version }
            - call: "GET /music-library/composers/${c2}"
              payload: {}
              as: RoyaltyAccountant
              captures: { c2_v: $.data.version }
          trigger:
            - call: "POST /music-library/royalty-statements"
              payload: { composer_id: "${c1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "ACCRUAL", expected_composer_version: "${c1_v}" }
              as: RoyaltyAccountant
              as_user_id: "acct-1"
              captures: { st1: $.data.id }
            - call: "POST /music-library/royalty-statements"
              payload: { composer_id: "${c2}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "ACCRUAL", expected_composer_version: "${c2_v}" }
              as: RoyaltyAccountant
              as_user_id: "acct-1"
              captures: { st2: $.data.id }
            - call: "POST /music-library/royalty-statements/${st2}/finalize"
              payload: {}
              as: RoyaltyAccountant
              as_user_id: "acct-1"
            - call: "POST /music-library/royalty-statements/${st2}/pay"
              payload: { payment_reference: "WIRE-0002" }
              as: RoyaltyAccountant
              as_user_id: "acct-2"
            - call: "POST /music-library/royalty-statements/${st1}/finalize"
              payload: {}
              as: RoyaltyAccountant
              as_user_id: "acct-1"
            - call: "POST /music-library/royalty-statements/${st1}/pay"
              payload: { payment_reference: "WIRE-0001" }
              as: RoyaltyAccountant
              as_user_id: "acct-2"
          assert:
            - "RoyaltyStatement.${st1}.gross_cents == 3571, recouped_cents == 0, withholding_cents == 1071, net_payable_cents == 2500"
            - "RoyaltyStatement.${st1}.payout_status == PAYABLE (net exactly at MIN_PAYOUT_CENTS is payable)"
            - "RoyaltyStatement.${st2}.gross_cents == 3570, recouped_cents == 0, withholding_cents == 1071, net_payable_cents == 2499"
            - "RoyaltyStatement.${st2}.payout_status == HELD_BELOW_MINIMUM (one cent below is held)"
            - "both statements report line_count == 1"
            - "the pay call on ${st2} returns error_id == ERR_STATEMENT_NOT_PAYABLE with status 409 and leaves RoyaltyStatement.${st2}.status == FINALIZED"
            - "RoyaltyStatement.${st1}.status == PAID with finalized_by_user_id == acct-1 and paid_by_user_id == acct-2"
            - "Composer.${c1}.lifetime_paid_cents == 2500 and Composer.${c2}.lifetime_paid_cents == 0"
            - "Composer.${c1}.accrued_unpaid_cents == 0 after the sweep (the entry now carries statement_id ${st1})"

      - name: pool_empty_eligible_set_retains_distributable_with_no_ledger
        grounds:
          - calculations.blanket_pool_distribution
          - entities.UsageReport.fields.pool_allocations
          - entities.UsageReport.fields.reported_minutes_total
          - entities.UsageReport.fields.reported_credits_total
          - entities.BlanketAgreement.fields.pool_distributed_cents
          - state_machines.UsageReport.SUBMITTED_to_ACCEPTED
          - validations[priority=40]
        distinguishing_aspect: |
          A different metric and a different endpoint from the payout boundary: the empty-collection
          edge of the waterfall allocation reached through POST /music-library/usage-reports/{id}/accept.
          The report's only cue sheet is still COLLECTED, so the eligible set is empty:
          reported_minutes_total is 0, pool_cents is still 100000 and pool_admin_fee_cents 15000, and
          pool_distributable_cents 85000 is retained with pool_allocations == [] and zero ledger entries.
        test_recipe:
          setup:
