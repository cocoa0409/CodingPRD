        distinguishing_aspect: |
          Numeric-threshold boundary on the capture endpoint: measured_speed_mph == speed_limit_mph (40==40) is
          NOT a violation (strict >), rejected with ERR_NO_VIOLATION; 41 would be a violation.
        test_recipe:
          setup:
            - "SPEED camera limit=40 ACTIVE; capture attempt at measured_speed_mph=40 (exactly the limit)."
