      - name: damage_charge_nested_branch_over_three_inputs
        grounds:
          - calculations.damage_charge
          - calculations.depreciated_replacement_value
          - entities.DamageAssessment.fields.disposition
          - entities.DamageAssessment.fields.charge_amount
        distinguishing_aspect: |
          MODE (a) — A FORMULA WITH THREE INPUTS AND NON-LINEAR INTERACTION. condition,
          repair_cost_estimate and the derived drv combine through a conditional branch and
          a nested min/max, so two lines with the SAME drv of 840.00 produce 840.00
          (MISSING, no salvage) and 420.00 (MAJOR over threshold, salvage recovered) — the
          more severe finding costs twice as much as the more expensive repair quote.
        test_recipe:
          setup:
            - "The canonical VACANT project staged, its lease term complete and its pickup IN_PROGRESS at 2026-10-13T09:00:00Z."
            - "Two OWNED lines: the SOFA (drv 840.00) and the BED (drv 630.00)."
          setup_api_calls: *v_staged
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/leases/${lease_id}/mark-term-complete"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /staging/pickups?project_id=${proj_id}"
              payload: {}
              as: StagingCoordinator
              captures: { pickup_id: "$.data[0].id" }
            - call: "POST /staging/pickups/${pickup_id}/start"
              payload: {}
              as: StagingCoordinator
