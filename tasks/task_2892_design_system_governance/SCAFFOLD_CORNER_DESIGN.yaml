            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/releases"
              payload: { semver_base: "2.1.0" }
              as: SystemAdmin
              captures: { rel_id: $.data.id }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Badge density scale", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: false }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { required: $.data.required_evidence_kinds }
            - call: "POST /design-system/contribution-proposals/${prop_id}/acceptance-evidence"
              payload: { evidence_kinds: ["A11Y_AUTOMATED", "TOKEN_COMPLIANCE"], evidence_url: "https://ds.example.com/evidence/density" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "APPROVE", notes: "fine" }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "ENGINEERING_REVIEW", verdict: "APPROVE", notes: "fine" }
              as: EngineeringReviewer
              as_user_id: "eng-1"
              captures: { ready_state: $.data.resulting_proposal_state }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { comp_v_pre: $.data.version }
            - call: "POST /design-system/components/${comp_id}/dependencies"
              payload: { provider_component_id: "${provider}", pinned_provider_major: 1 }
              as: DesignSystemLead
              captures: { dep_state: $.data.compatibility_state }
          trigger:
            - call: "POST /design-system/contribution-proposals/${prop_id}/accept"
              payload: { release_id: "${rel_id}", expected_component_version: "${comp_v_pre}" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { err: $.data.error_id }
            - call: "GET /design-system/contribution-proposals/${prop_id}"
              payload: {}
              as: DesignSystemLead
              captures: { state_mid: $.data.state, released_mid: $.data.released_in_release_id, accepted_mid: $.data.accepted_at }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { comp_v_now: $.data.version }
            - call: "POST /design-system/contribution-proposals/${prop_id}/accept"
              payload: { release_id: "${rel_id}", expected_component_version: "${comp_v_now}" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { state_after: $.data.state, released_after: $.data.released_in_release_id, class_after: $.data.effective_change_class }
          assert:
            - "${required} == [A11Y_AUTOMATED, TOKEN_COMPLIANCE] and ${ready_state} == READY_FOR_ACCEPTANCE"
            - "${dep_state} == COMPATIBLE and ${comp_v_now} == ${comp_v_pre} + 1"
            - "${err} == ERR_STALE_COMPONENT_VERSION"
            - "HTTP status == 412"
            - "${state_mid} == READY_FOR_ACCEPTANCE and ${released_mid} == null and ${accepted_mid} == null"
            - "${state_after} == ACCEPTED and ${released_after} == ${rel_id} and ${class_after} == MINOR"

      - name: a_second_token_write_with_the_first_reads_version_is_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules["token-create-stale-token-set"]
          - validations[priority=9]
          - errors[ERR_STALE_TOKEN_SET_VERSION]
          - endpoints["POST /design-system/tokens"]
        distinguishing_aspect: |
          Every token write bumps the parent TokenSet's version, so a second create that replays
          the version read before the first one must be refused with ERR_STALE_TOKEN_SET_VERSION
          at 412 even though the token's own (name, brand, mode) tuple is unique and nothing else
          is wrong. The refusal must write nothing (token_count stays 1, version stays 2), and the
          same payload with the re-read version must then succeed - and a PUT on the new token
          bumps the set's version again, showing the guard covers updates as well as creates.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "TokenSet `core` at version 1 with no tokens"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id, v0: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.surface", category: "COLOR", expected_token_set_version: "${v0}", raw_value: "#FFFFFF" }
              as: DesignSystemLead
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "space.md", category: "SPACING", expected_token_set_version: "${v0}", raw_value: "16px" }
              as: DesignSystemLead
              captures: { err: $.data.error_id }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v_mid: $.data.version, count_mid: $.data.token_count }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "space.md", category: "SPACING", expected_token_set_version: "${v_mid}", raw_value: "16px" }
              as: DesignSystemLead
              captures: { second_id: $.data.id, second_value: $.data.resolved_value }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v_after: $.data.version, count_after: $.data.token_count }
            - call: "PUT /design-system/tokens/${second_id}"
              payload: { expected_token_set_version: "${v_after}", raw_value: "20px" }
              as: DesignSystemLead
              captures: { updated_value: $.data.resolved_value, token_version: $.data.version }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v_final: $.data.version }
          assert:
            - "${v0} == 1"
            - "${err} == ERR_STALE_TOKEN_SET_VERSION"
            - "HTTP status == 412"
            - "${v_mid} == 2 and ${count_mid} == 1 (the stale create wrote nothing)"
            - "${second_id} != ${first_id} and ${second_value} == 16px with HTTP status 201"
            - "${v_after} == 3 and ${count_after} == 2"
            - "${updated_value} == 20px and ${token_version} == 2"
            - "${v_final} == 4"

      - name: four_hop_chain_from_accept_to_the_team_debt_counter
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / breaking_change_accept_cascades_four_hops_to_team_counter
          rationale: "End-to-end verification of the longest declared cascade, hop by hop, is exactly what the named §1.8 instance does; the sunset cascade is covered by its sibling instance."

      - name: both_variants_computed_from_one_data_set
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / a11y_governance_sweep_scores_below_latest_evidence
          rationale: "Both §1.8 dual_variant_calc instances already compute the two variants over identical rows and assert the delta, for the a11y score and the adoption index respectively."

      - name: the_version_pinned_at_submit_is_the_one_checked_at_acceptance
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_profile.complexity_layers
          - validations[priority=14]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / acceptance_refused_because_pinned_token_set_version_advanced_after_review
          rationale: "The named §1.8 instance pins at submit, advances the token set after review and asserts the refusal at acceptance, which is the whole content of this layer."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_already_correct_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.platform_coverage_state
          - calculations.a11y_conformance_score
          - calculations.team_adoption_index
        distinguishing_aspect: |
          Nothing in this domain is allowed to lag: the ship response itself must already carry
          status SHIPPED and the recomputed conformance_score, and a read of the owning component
          issued immediately afterwards must already show shipped_platform_count 1, coverage_state
          WEB_ONLY and the rolled-up governance_conformance_score - with no second request, no
          retry and no sleep. The same holds for a scan filing: the team's adoption_index_latest
          is already updated when the scan's own response returns, and the dashboard read that
          follows agrees with it.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` owns Component `badge` with a PLANNED WEB implementation carrying clean AUTOMATED and MANUAL AA audits"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id, index_before: $.data.adoption_index_latest }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id, coverage_before: $.data.coverage_state, score_before: $.data.governance_conformance_score }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.96 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 5, evidence_url: "https://ds.example.com/a11y/web-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { auto_load: $.data.defect_load }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/web-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
          trigger:
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.96 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { ship_status: $.data.status, ship_score: $.data.conformance_score, ship_at: $.data.shipped_at }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { coverage_after: $.data.coverage_state, count_after: $.data.shipped_platform_count, score_after: $.data.governance_conformance_score }
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "CODE_SCAN", window_start_at: "2026-07-01T00:00:00.000Z", window_end_at: "2026-07-31T00:00:00.000Z", system_instance_count: 8, legacy_instance_count: 2, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { scan_ratio: $.data.adoption_ratio }
            - call: "GET /design-system/teams/${team_id}"
              payload: {}
              as: DesignSystemLead
              captures: { index_after: $.data.adoption_index_latest }
            - call: "GET /design-system/teams/${team_id}/dashboard"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { dash_index: $.data.adoption_index, dash_code: $.data.code_scan_ratio }
          assert:
            - "${coverage_before} == NONE and ${score_before} == 0.00 and ${index_before} == 0.00"
            - "${auto_load} == 5"
            - "${ship_status} == SHIPPED and ${ship_score} == 98.00 and ${ship_at} == 2026-08-01T00:00:00.000Z"
            - "${coverage_after} == WEB_ONLY and ${count_after} == 1 and ${score_after} == 98.00"
            - "${scan_ratio} == 80.00 and ${index_after} == 56.00"
            - "${dash_index} == 56.00 and ${dash_code} == 80.00"
            - "no call is repeated and no delay is inserted anywhere in this recipe"
