          setup:
            - "An acquired lease stream whose closed deal carries revenue_share_bps 2500."
            - "Two RECORDED COLOCATION_ADDED amendment events of 1000002 cents each, so the cumulative shares are 500002 and 1500002."
            - "The per-event rounding is visible: a single sum-then-round pass over gross 2000004 would have stored 500001 for the landowner."
