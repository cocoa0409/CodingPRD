              payload: { score: 90 }
              as: Worker
              as_user_id: "${w1}"
              captures: { att1: $.data.id }
          assert:
            - "QualificationExamAttempt.${att1}.outcome == PASSED and sequence == 1"
            - "GET /mkt/worker-qualifications?worker_id=${w1} returns exactly 1 row with source == EXAM, status == ACTIVE and score == 90"

