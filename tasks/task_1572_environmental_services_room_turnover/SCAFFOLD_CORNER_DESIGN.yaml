            - "err_second == ERR_OUTBREAK_ALREADY_ACTIVE (409): unit already had an ACTIVE event"
            - "err_lift_declared == ERR_OUTBREAK_INVALID_STATE (409): lift requires ACTIVE"
            - "err_cancel_active == ERR_OUTBREAK_INVALID_STATE (409): cancel requires DECLARED"
            - "Final: OutbreakEvent.${e1}.status == LIFTED AND OutbreakEvent.${e2}.status == CANCELLED"
            - "u_posture == NORMAL (no ACTIVE event remains after the lift) AND u_ver == 3 (create, activate, lift)"

