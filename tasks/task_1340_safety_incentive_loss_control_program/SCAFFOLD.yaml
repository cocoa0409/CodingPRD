  - { method: POST, path: "/safety/committee-meetings/{id}/action-items", description: "Create an action item in a HELD | MINUTES_PUBLISHED meeting", roles: [CommitteeChair], code: 201, input: [assignee_id, description, due_date, "hazard_id?"], output: ActionItem, side_effects: ["meeting.open_action_count += 1"] }
  - { method: GET, path: "/safety/committee-meetings/{id}/action-items", description: "List action items of a meeting", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, ContractorRep, CarrierConsultant], code: 200, input: ["status?", "limit?", "offset?"], output: "ActionItem[]", side_effects: [] }

  - { method: GET, path: "/safety/action-items", description: "List action items globally", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, ContractorRep, CarrierConsultant], code: 200, input: ["meeting_id?", "assignee_id?", "status?", "hazard_id?", "limit?", "offset?"], output: "ActionItem[]", side_effects: [] }
  - { method: GET, path: "/safety/action-items/{id}", description: "Read one action item", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, ContractorRep, CarrierConsultant], code: 200, input: [], output: ActionItem, side_effects: [] }
  - { method: POST, path: "/safety/action-items/{id}/complete", description: "ASSIGNED|ESCALATED -> COMPLETED (assignee or chair)", roles: [Supervisor, SafetyManager, CommitteeChair], code: 200, input: ["completed_at?"], output: ActionItem, side_effects: [] }
  - { method: POST, path: "/safety/action-items/{id}/verify", description: "COMPLETED -> VERIFIED (PASS) or -> ASSIGNED (FAIL, new due_date)", roles: [CommitteeChair], code: 200, input: [outcome, "outcome_note?", "due_date?"], output: ActionItem, side_effects: ["PASS: ACTION_VERIFIED event for assignee; meeting.open_action_count -= 1"] }
  - { method: POST, path: "/safety/action-items/{id}/reassign", description: "ESCALATED -> ASSIGNED; optional carry-over to another meeting (counts conserved)", roles: [CommitteeChair], code: 200, input: [due_date, "assignee_id?", "meeting_id?"], output: ActionItem, side_effects: ["meeting.open_action_count adjusted on both meetings when meeting_id changes"] }

  - { method: POST, path: "/safety/contractor-orgs", description: "Register a contractor (DRAFT)", roles: [ContractorRep, EHSAdmin], code: 201, input: [name, contact_email, emr, trir, safety_audit_pct, insurance_cert_expires_on], output: ContractorOrg, side_effects: [] }
  - { method: GET, path: "/safety/contractor-orgs", description: "List contractors", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, ContractorRep, CarrierConsultant], code: 200, input: ["status?", "suspension_claim_id?", "limit?", "offset?"], output: "ContractorOrg[]", side_effects: [] }
  - { method: GET, path: "/safety/contractor-orgs/{id}", description: "Read one contractor", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, ContractorRep, CarrierConsultant], code: 200, input: [], output: ContractorOrg, side_effects: [] }
  - { method: POST, path: "/safety/contractor-orgs/{id}/submit", description: "DRAFT|CONDITIONAL|SUSPENDED|EXPIRED -> UNDER_REVIEW; recomputes prequal_score", roles: [ContractorRep], code: 200, input: ["emr?", "trir?", "safety_audit_pct?", "insurance_cert_expires_on?"], output: ContractorOrg, side_effects: ["prequal_score and computed_decision recomputed"] }
  - { method: POST, path: "/safety/contractor-orgs/{id}/decide", description: "UNDER_REVIEW -> APPROVED|CONDITIONAL|REJECTED; decision must match computed band", roles: [SafetyManager], code: 200, input: [decision], output: ContractorOrg, side_effects: ["APPROVE sets prequal_valid_until = now + 365 days"] }
  - { method: POST, path: "/safety/contractor-orgs/{id}/suspend", description: "APPROVED -> SUSPENDED", roles: [SafetyManager, EHSAdmin], code: 200, input: [suspension_reason, "suspension_claim_id?"], output: ContractorOrg, side_effects: [] }

  - { method: POST, path: "/safety/claims", description: "Report a claim (REPORTED)", roles: [SafetyManager, EHSAdmin], code: 201, input: [program_id, occurred_on, kind, incurred_cents, "employee_id?", "contractor_org_id?"], output: ClaimRecord, side_effects: ["effective_incurred_cents computed"] }
  - { method: GET, path: "/safety/claims", description: "List claims", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, CarrierConsultant], code: 200, input: ["program_id?", "status?", "kind?", "employee_id?", "contractor_org_id?", "limit?", "offset?"], output: "ClaimRecord[]", side_effects: [] }
  - { method: GET, path: "/safety/claims/{id}", description: "Read one claim", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, CarrierConsultant], code: 200, input: [], output: ClaimRecord, side_effects: [] }
  - { method: POST, path: "/safety/claims/{id}/accept", description: "REPORTED -> ACCEPTED; optional incurred update", roles: [SafetyManager], code: 200, input: ["incurred_cents?"], output: ClaimRecord, side_effects: ["effective_incurred_cents recomputed"] }
  - { method: POST, path: "/safety/claims/{id}/deny", description: "REPORTED -> DENIED", roles: [SafetyManager], code: 200, input: [reason], output: ClaimRecord, side_effects: [] }
  - { method: POST, path: "/safety/claims/{id}/close", description: "ACCEPTED -> CLOSED; optional final incurred", roles: [SafetyManager], code: 200, input: ["final_incurred_cents?"], output: ClaimRecord, side_effects: ["effective_incurred_cents recomputed"] }

  - { method: POST, path: "/safety/loss-control-recommendations", description: "Carrier issues a recommendation (ISSUED)", roles: [CarrierConsultant], code: 201, input: [program_id, carrier_name, priority, description, due_date], output: LossControlRecommendation, side_effects: [] }
  - { method: GET, path: "/safety/loss-control-recommendations", description: "List recommendations", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, CarrierConsultant], code: 200, input: ["program_id?", "status?", "priority?", "evidence_control_id?", "limit?", "offset?"], output: "LossControlRecommendation[]", side_effects: [] }
  - { method: GET, path: "/safety/loss-control-recommendations/{id}", description: "Read one recommendation", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, CarrierConsultant], code: 200, input: [], output: LossControlRecommendation, side_effects: [] }
  - { method: POST, path: "/safety/loss-control-recommendations/{id}/respond", description: "ISSUED|OVERDUE|CARRIER_REJECTED -> RESPONSE_SUBMITTED", roles: [SafetyManager], code: 200, input: [response_text, "evidence_control_id?"], output: LossControlRecommendation, side_effects: ["responded_by set"] }
  - { method: POST, path: "/safety/loss-control-recommendations/{id}/review-response", description: "RESPONSE_SUBMITTED -> CLOSED_ACCEPTED | CARRIER_REJECTED", roles: [CarrierConsultant], code: 200, input: [outcome, "review_note?"], output: LossControlRecommendation, side_effects: ["reviewed_by set"] }

  - { method: GET, path: "/safety/incentive-awards", description: "List awards", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, CarrierConsultant], code: 200, input: ["program_id?", "employee_id?", "status?", "tier?", "limit?", "offset?"], output: "IncentiveAward[]", side_effects: [] }
  - { method: GET, path: "/safety/incentive-awards/{id}", description: "Read one award", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, CarrierConsultant], code: 200, input: [], output: IncentiveAward, side_effects: [] }
  - { method: POST, path: "/safety/incentive-awards/{id}/approve", description: "CALCULATED -> APPROVED; reserves budget", roles: [EHSAdmin], code: 200, input: [], output: IncentiveAward, side_effects: ["program.remaining_budget_cents -= payout_cents"] }
  - { method: POST, path: "/safety/incentive-awards/{id}/pay", description: "APPROVED -> PAID", roles: [EHSAdmin], code: 200, input: [], output: IncentiveAward, side_effects: [] }
  - { method: POST, path: "/safety/incentive-awards/{id}/void", description: "CALCULATED|APPROVED -> VOIDED; restores reserved budget when APPROVED", roles: [EHSAdmin], code: 200, input: [void_reason], output: IncentiveAward, side_effects: ["program.remaining_budget_cents += payout_cents when voiding from APPROVED"] }

  - { method: GET, path: "/safety/incentive-events", description: "List point ledger events", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, CarrierConsultant], code: 200, input: ["program_id?", "employee_id?", "source_type?", "limit?", "offset?"], output: "IncentiveEvent[]", side_effects: [] }
  - { method: GET, path: "/safety/incentive-events/{id}", description: "Read one event", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, CarrierConsultant], code: 200, input: [], output: IncentiveEvent, side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role is not a declared role or X-User-ID is missing" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint, or entity-backed ownership check failed (ContractorRep acting on a different ContractorOrg; non-chair completing another employee's action item)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-supplied FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, severity/probability outside 1..5, negative money/count, scheduled_end <= scheduled_start, missing note/due_date on FAIL outcome, missing reason on deny/void, contractor resubmit with no metric change" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's current state does not permit the requested transition (generic transition violation)" }
  - { id: ERR_PROGRAM_NOT_DRAFT, http: 409, condition: "Incentive-config patch or activation attempted on a program not in DRAFT" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Hazard/observation/recommendation creation or hazard reopen attempted against a program not in ACTIVE" }
  - { id: ERR_PROGRAM_NOT_CLOSED, http: 409, condition: "Award approve or reconcile attempted while the program is not CLOSED" }
  - { id: ERR_PROGRAM_ALREADY_ACTIVE, http: 409, condition: "Activating a program while another SafetyProgram is ACTIVE" }
  - { id: ERR_CONTRACTOR_NOT_UNDER_REVIEW, http: 409, condition: "decide attempted on a ContractorOrg not in UNDER_REVIEW" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_program_version does not match the SafetyProgram's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same X-User-ID attempted a check-and-balance pair: control verifier == implementer, action-item verifier == assignee, or observation triager == reporter" }
  - { id: ERR_PROGRAM_RESTRICTED, http: 422, condition: "Contractor APPROVE decision blocked because the ACTIVE program's posture is RESTRICTED" }
  - { id: ERR_DECISION_CONTRADICTS_SCORE, http: 422, condition: "decide decision differs from computed_decision implied by the banded prequal_score" }
  - { id: ERR_MEETING_OVERLAP, http: 409, condition: "New meeting's half-open interval overlaps another SCHEDULED|HELD meeting of the same program" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "An ASSIGNED TrainingAssignment already exists for the same employee_id + course_id" }
  - { id: ERR_CERTIFICATION_ACTIVE, http: 409, condition: "Employee holds a live certification for the same course whose remaining validity exceeds the renewal window" }
  - { id: ERR_FUTURE_DATE_NOT_ALLOWED, http: 422, condition: "occurred_at / implemented_at / completed_at lies after the logical now" }
  - { id: ERR_INSURANCE_CERT_EXPIRED, http: 422, condition: "Contractor submit with insurance_cert_expires_on before the logical today" }
  - { id: ERR_EMPLOYEE_INACTIVE, http: 422, condition: "Training assignment create/complete for an INACTIVE employee" }
  - { id: ERR_HAZARD_NOT_OPEN, http: 422, condition: "Triage LINK_EXISTING targets a CLOSED hazard" }
  - { id: ERR_CONTROL_NOT_VERIFIED, http: 422, condition: "LCR response cites an evidence control that is not VERIFIED" }
  - { id: ERR_OPEN_HAZARDS_REMAIN, http: 422, condition: "Program close blocked: hazards still in OPEN|ASSESSED|CONTROLS_PLANNED|IN_PROGRESS|PENDING_VERIFICATION" }
  - { id: ERR_OPEN_RECOMMENDATIONS_REMAIN, http: 422, condition: "Program close blocked: recommendations still in ISSUED|OVERDUE|RESPONSE_SUBMITTED|CARRIER_REJECTED" }
  - { id: ERR_OPEN_MEETINGS_REMAIN, http: 422, condition: "Program close blocked: meetings still in SCHEDULED|HELD" }
  - { id: ERR_UNPAID_AWARDS_REMAIN, http: 422, condition: "Program reconcile blocked: awards still in CALCULATED|APPROVED" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "Distinct committee-member attendees below program.quorum_min" }
  - { id: ERR_INCENTIVE_BUDGET_EXCEEDED, http: 422, condition: "Award approve would drive reserved payouts above incentive_budget_cents" }
  - { id: ERR_PAYROLL_INCOMPLETE, http: 422, condition: "Activation blocked: payroll_by_class/elr_by_class missing a hazard class or carrying non-positive payroll" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EHSAdmin
    description: "Program administrator; configures programs, catalog data, runs sweep, approves/pays/voids awards; also performs loss-control program close-out"
    identity: opaque
    exclusive_operations: ["POST /safety/programs", "PATCH /safety/programs/{id}/incentive-config", "POST /safety/programs/{id}/activate", "POST /safety/programs/{id}/close", "POST /safety/programs/{id}/reconcile", "POST /safety/programs/{id}/sweep", "POST /safety/job-roles", "POST /safety/training-courses", "POST /safety/employees", "POST /safety/employees/{id}/deactivate", "POST /safety/incentive-awards/{id}/approve", "POST /safety/incentive-awards/{id}/pay", "POST /safety/incentive-awards/{id}/void", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints", "POST /safety/hazards", "POST /safety/hazards/{id}/controls", "POST /safety/training-assignments", "POST /safety/training-assignments/{id}/complete", "POST /safety/training-assignments/{id}/reassign", "POST /safety/contractor-orgs", "POST /safety/contractor-orgs/{id}/suspend", "POST /safety/claims", "POST /safety/emr-forecasts", "POST /safety/committee-meetings"]
  - name: SafetyManager
    description: "EHS manager; assesses hazards, plans and verifies controls, triages observations, decides contractor prequalification, manages claims, responds to carrier recommendations"
    identity: "entity_backed:Employee"
    exclusive_operations: ["POST /safety/hazards/{id}/assess", "POST /safety/hazards/{id}/reopen", "POST /safety/controls/{id}/verify", "POST /safety/observations/{id}/triage", "POST /safety/contractor-orgs/{id}/decide", "POST /safety/claims/{id}/accept", "POST /safety/claims/{id}/deny", "POST /safety/claims/{id}/close", "POST /safety/loss-control-recommendations/{id}/respond"]
    shared_operations: ["all GET endpoints", "POST /safety/hazards", "POST /safety/hazards/{id}/controls", "POST /safety/controls/{id}/implement", "POST /safety/observations", "POST /safety/contractor-orgs/{id}/suspend", "POST /safety/claims", "POST /safety/emr-forecasts", "POST /safety/training-assignments", "POST /safety/training-assignments/{id}/complete", "POST /safety/training-assignments/{id}/reassign", "POST /safety/action-items/{id}/complete"]
  - name: Supervisor
    description: "Line supervisor; reports hazards, implements controls, submits observations, assigns and completes training, completes own action items"
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations: ["all GET endpoints", "POST /safety/hazards", "POST /safety/controls/{id}/implement", "POST /safety/observations", "POST /safety/training-assignments", "POST /safety/training-assignments/{id}/complete", "POST /safety/training-assignments/{id}/reassign", "POST /safety/action-items/{id}/complete"]
  - name: Employee
    description: "Frontline worker; submits observations/near misses and reads program data"
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations: ["all GET endpoints", "POST /safety/observations"]
  - name: CommitteeChair
    description: "Safety committee chair; runs meetings, creates/verifies/reassigns action items"
    identity: "entity_backed:Employee"
    exclusive_operations: ["POST /safety/committee-meetings/{id}/hold", "POST /safety/committee-meetings/{id}/publish-minutes", "POST /safety/committee-meetings/{id}/cancel", "POST /safety/committee-meetings/{id}/action-items", "POST /safety/action-items/{id}/verify", "POST /safety/action-items/{id}/reassign"]
    shared_operations: ["all GET endpoints", "POST /safety/committee-meetings", "POST /safety/action-items/{id}/complete"]
  - name: ContractorRep
    description: "Contractor company representative; registers the org and submits prequalification for its own org only (X-User-ID == ContractorOrg.id after creation)"
    identity: "entity_backed:ContractorOrg"
    exclusive_operations: ["POST /safety/contractor-orgs/{id}/submit"]
    shared_operations: ["all GET endpoints", "POST /safety/contractor-orgs"]
  - name: CarrierConsultant
    description: "Insurance carrier loss-control consultant; issues recommendations and adjudicates employer responses"
    identity: opaque
    exclusive_operations: ["POST /safety/loss-control-recommendations", "POST /safety/loss-control-recommendations/{id}/review-response"]
    shared_operations: ["all GET endpoints"]
