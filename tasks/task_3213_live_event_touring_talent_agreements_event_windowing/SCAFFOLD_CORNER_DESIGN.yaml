      - name: distribution_window_revoke_and_terminal_lockdown
        claim_type: conditional_action
        grounds: [state_machines.DistributionWindow, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A PROVISIONAL window can be revoked directly; a REVOKED window rejects publish and further revokes."
        test_recipe:
          setup: ["PREMIUM event PE 2026-09-20; partner SP with spanning right; one PROVISIONAL LIVE window DW"]
          setup_api_calls:
