  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_tmi_revision_stale_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[tmi-revision-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a revision and re-activation have twice bumped the TMI version, a second revision carrying the originally observed version is rejected 412 ERR_STALE_VERSION — the TMI is legitimately ACTIVE again, so only OCC can reject it."
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, 13:00-15:00Z (zero flights); tmi_v captured at version after activation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
