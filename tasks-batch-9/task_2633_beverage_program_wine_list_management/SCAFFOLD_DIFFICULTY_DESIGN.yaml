          The contended resource is a physical preservation slot (venue_id, slot_index) and the
          occupied interval is CLOSED-CLOSED with a zero buffer, so the instant T ==
          preservation_expires_at still belongs to the incumbent and the reopen is refused; one second
          later the same request succeeds and, as a side effect, drags the incumbent through
          OPEN_to_EXPIRED_on_reopen. The expiry instant itself is derived
          (RED + ARGON = 192 hours from 2026-09-01T12:00:00Z = 2026-09-09T12:00:00Z), so the test also
