          - errors[ERR_ENGAGEMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics 1 (CLOSED intervals on the Asset's engagement calendar): a new
          engagement whose window_start equals the prior window_end is REJECTED as overlapping
          (adjacency counts as overlap); a one-day gap is accepted and activatable.
