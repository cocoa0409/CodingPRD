              captures: { st2: $.data.status }
          assert:
            - "${loc0} == UNLOCATED"
            - "${err} == ERR_DEBTOR_NOT_LOCATED"
            - "${loc1} == LOCATED"
            - "${traces} == 1"
            - "${st2} == SERVED"
            - "DebtorExamination.${ex_id}.served_on == 2026-08-01"

