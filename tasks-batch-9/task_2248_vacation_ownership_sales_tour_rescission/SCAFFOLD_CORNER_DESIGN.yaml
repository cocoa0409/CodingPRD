            - "trigger 3 returns 201 with TourBooking.${b1}.scheduled_start_utc == 2026-08-01T01:00:00.000Z and scheduled_end_utc == 2026-08-01T03:00:00.000Z"
            - "trigger 5 returns 422 with error_id ERR_TOUR_SLOT_IN_PAST -- the gate is re-run against new_scheduled_start_utc"
            - "trigger 6 shows status == RESCHEDULE_PENDING, reschedule_count == 0 and scheduled_start_utc still 2026-08-01T01:00:00.000Z"

