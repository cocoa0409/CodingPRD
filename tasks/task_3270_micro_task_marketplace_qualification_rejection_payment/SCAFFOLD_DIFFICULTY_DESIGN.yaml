  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: submit_requires_acting_worker_active
        grounds:
          - state_machines.Assignment.transitions.ACCEPTED_to_SUBMITTED
          - errors.ERR_WORKER_SUSPENDED
          - validations[priority=5]
        distinguishing_aspect: "An ACCEPTED Assignment cannot reach SUBMITTED while its Worker row is SUSPENDED — the Assignment transition reads the Worker entity's status, not the Assignment's own state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One 1-slot 100c HIT published; worker W1 accepts the slot (assignment stays ACCEPTED and within its 300-minute limit); the admin then suspends W1."
