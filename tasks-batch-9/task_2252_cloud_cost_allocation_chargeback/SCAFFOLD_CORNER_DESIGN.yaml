                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { inv_id: "$.data[0].id" }
              - call: "POST /finops/chargeback-invoices/${inv_id}/issue"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            trigger:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-08-12T00:00:01Z" }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/disputes"
                payload: { chargeback_invoice_id: "${inv_id}", reason_code: "UNTAGGED_ABSORPTION", claimed_credit_cents: 1000, narrative: "not our storage" }
                as: BusinessUnitOwner
                as_user_id: "${bu_id}"
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-08-12T00:00:00Z" }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/disputes"
                payload: { chargeback_invoice_id: "${inv_id}", reason_code: "UNTAGGED_ABSORPTION", claimed_credit_cents: 1000, narrative: "not our storage" }
