              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response code == 401"
            - "response error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Order.fields.version, endpoints]
        distinguishing_aspect: "Order.version is 1 at creation, 2 after quote, 3 after mark_authorized — incremented by exactly 1 on each mutation."
        test_recipe:
          setup: ["a created then quoted then authorized order"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZL1", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CL1", display_name: "CL1", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "vi@x.com", full_name: "VI C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2027-08-05", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id, v_create: $.data.version }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v_quote: $.data.version }
          trigger:
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { v_auth: $.data.version }
          assert:
            - "Order.${ord_id}.version after create == 1"
            - "Order.${ord_id}.version after quote == 2"
            - "Order.${ord_id}.version after authorize == 3"

      - name: dual_variant_estimate_final_already_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.compute_quote_estimate, calculations.compute_final_total]
        excluded_because:
          difficulty_instance: dual_variant_calc / order_estimate_vs_final_diverge_on_wire_and_subs
          rationale: "Estimate-vs-final divergence asserted by that §1.8 instance."

      - name: redelivery_cascade_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.QualityClaim.APPROVED_to_RESOLVED]
        excluded_because:
          difficulty_instance: transitive_cascade / claim_refund_resolve_cascades_payment_then_wallet
          rationale: "The resolve->refund->wallet cascade is asserted by that §1.8 instance."

