  # ---------------------------------------------------------------- Rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payment_pay_state_vs_fiscal_priority
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - state_machines.ReimbursementPayment.CERTIFIED_to_PAID
        distinguishing_aspect: |
          Error-category pair state x business_fiscal: re-paying an already PAID payment while
          district available funds are 0 violates both the from-state rule (priority 4) and the
          funds rule (priority 10); the state error ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Active community; district 5.0%; advance 6,000,000c on 2026-01-01; levy 500,000c COLLECTED (available funds 500,000c)"
            - "Payment of 500,000c CERTIFIED (interest 99,438c, principal 400,562c) then PAID — funds now 0; any further pay would also fail fiscally"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Priority Pines", total_planned_units: 50 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/districts"
              payload: { community_id: "${c_id}", district_name: "PID 3", interest_rate_annual_pct: 5.0 }
              as: DeclarantController
              captures: { d_id: $.data.id }
            - call: "POST /mpc/advances"
              payload: { district_id: "${d_id}", amount_cents: 6000000, advance_date: "2026-01-01T00:00:00Z" }
              as: DeclarantController
            - call: "POST /mpc/levies"
              payload: { district_id: "${d_id}", levy_year: 2026, amount_cents: 500000 }
              as: DeclarantController
              captures: { levy_id: $.data.id }
            - call: "POST /mpc/levies/${levy_id}/collect"
              payload: {}
              as: DeclarantController
            - call: "POST /mpc/payments"
              payload: { district_id: "${d_id}", amount_cents: 500000 }
              as: DeclarantController
              captures: { pay_id: $.data.id }
            - call: "POST /mpc/payments/${pay_id}/certify"
              payload: {}
              as: AssociationDirector
              captures: { cert_i: $.data.certified_interest_cents, cert_p: $.data.certified_principal_cents }
            - call: "POST /mpc/payments/${pay_id}/pay"
              payload: {}
              as: DeclarantController
            - call: "GET /mpc/districts/${d_id}"
              as: DeclarantController
              captures: { funds_after: $.data.available_funds_cents }
          trigger:
            - call: "POST /mpc/payments/${pay_id}/pay"
              payload: {}
              as: DeclarantController
              captures: { err: $.data.error_id }
          assert:
            - "certification sanity: ${cert_i} == 99438 and ${cert_p} == 400562 (single 6,000,000c advance, 120 days, 5% daily-compound)"
            - "after pay: ${funds_after} == 0 (500,000 collected - 500,000 paid), so the fiscal rule is also violated"
            - "re-pay of the PAID payment returns ${err} == ERR_INVALID_STATE (http 409), never ERR_INSUFFICIENT_DISTRICT_FUNDS"

      - name: event_lead_time_vs_venue_overlap_priority
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.CommunityEvent.PROPOSED_to_SCHEDULED
        distinguishing_aspect: |
          Error-category pair business_temporal x business_constraint (different from
          state x business_fiscal): an event violating the 14-day lead AND overlapping an
          occupied venue must return ERR_EVENT_LEAD_TIME (priority 7), not ERR_VENUE_OVERLAP
          (priority 8).
        test_recipe:
          setup:
            - "Active community; event A SCHEDULED at SALES_CENTER [2026-05-20T10:00Z, 2026-05-20T12:00Z) at the default clock (19-day lead, valid)"
            - "Event C PROPOSED at SALES_CENTER [2026-05-06T11:00Z, 2026-05-06T12:00Z) — 5-day lead violation AND half-open overlap with A"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Overlap Oaks", total_planned_units: 50 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/events"
              payload: { community_id: "${c_id}", title: "Model Tour A", venue: "SALES_CENTER", start_at: "2026-05-20T10:00:00Z", end_at: "2026-05-20T12:00:00Z", capacity: 10 }
              as: LifestyleCoordinator
              captures: { ea_id: $.data.id }
            - call: "POST /mpc/events/${ea_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
            - call: "POST /mpc/events"
              payload: { community_id: "${c_id}", title: "Rushed Mixer", venue: "SALES_CENTER", start_at: "2026-05-06T11:00:00Z", end_at: "2026-05-06T12:00:00Z", capacity: 10 }
              as: LifestyleCoordinator
              captures: { ec_id: $.data.id }
          trigger:
            - call: "POST /mpc/events/${ec_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_EVENT_LEAD_TIME (http 422): the priority-7 temporal failure masks the priority-8 venue-overlap failure"
            - "GET /mpc/events/${ec_id}: status remains PROPOSED"
  # ---------------------------------------------------------------- Rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: tranche_exact_fill_boundary
        grounds:
          - calculations.takedown_waterfall_allocation
          - state_machines.TakedownTranche.OPEN_to_SATISFIED
          - state_machines.LotPurchaseAgreement.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Boundary on lot-count (>= vs >): the closing that brings lots_credited exactly equal
          to lot_count_due flips the tranche to SATISFIED; one fewer leaves it OPEN. Reached via
          POST /mpc/closings/{clid}/close.
        test_recipe:
          setup:
            - "Active community (10 units); phase SALES_OPEN; builder; ACTIVE agreement committed 2 with a single tranche T1 due 2026-06-30 covering 2 lots"
            - "Lots L1, L2 OFFERED; clock 2026-06-01 (T1 OPEN); first closing already CLOSED (lots_credited 1)"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Boundary Brook", total_planned_units: 10 }
