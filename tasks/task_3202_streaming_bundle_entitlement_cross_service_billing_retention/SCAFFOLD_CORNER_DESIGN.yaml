          - roles.PlatformAdmin
        distinguishing_aspect: "DistributorOps calling POST /streaming/retention-offers returns 403 ERR_UNAUTHORIZED (PlatformAdmin-exclusive), while GET /streaming/revenue-report IS allowed for DistributorOps (distributor reporting access)."
        test_recipe:
