      - name: notice_scheduled_at_exactly_the_lead_time_boundary_succeeds
        claim_type: satisfaction_to_pass
        grounds: ["validations.ERR_NOTICE_LEAD_TIME_TOO_SHORT", "state_machines.ProjectSegment.notice_state.PENDING_to_SCHEDULED", "endpoints.POST /pavement/project-segments/{id}/notice"]
        distinguishing_aspect: "The satisfaction side of the 72-hour rule, at the exact boundary: a notice window starting 2026-08-04T00:00:00Z under a 2026-08-01T00:00:00Z clock is EXACTLY 72 hours out and is accepted (notice_state PENDING -> SCHEDULED, notice_round 1), while the sibling line's window one second earlier at 2026-08-03T23:59:59Z is refused — so the comparison is >= NOTICE_LEAD_HOURS, not >."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Maple St and Oak St candidates are both FUNDED in an ADOPTED 20,000,000 scenario; a DRAFT Z1 project carries one line on each (work windows 2026-09-01 -> 2026-09-15 and 2026-09-16 -> 2026-09-30)."
            - "Both lines are work_state PLANNED and notice_state PENDING, which the notice precondition admits."
            - "The two lines sit on DIFFERENT segments, so the priority-70 notice-window conflict rule cannot fire on either call."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
