              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION with http 412 (TMI is ACTIVE — the state gate passes; only the version check can and does reject)"
            - "TMI remains ACTIVE with revision_count == 1"

      - name: occ_flight_update_stale_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[flight-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "An ETA-only update replayed with the pre-update version is rejected 412 ERR_STALE_VERSION; ETA updates never change a state that would reject a repeat, so OCC is the only correct rejection."
        test_recipe:
          setup:
            - "one flight (no program); f_v captured at creation (version 1)"
          setup_api_calls:
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id, f_v: $.data.version }
          trigger:
            - call: "POST /atfm/flights/${f1}/updates"
              payload: { new_eta: "2026-09-15T13:20:00Z", expected_flight_version: "${f_v}" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { v_after: $.data.version }
            - call: "POST /atfm/flights/${f1}/updates"
              payload: { new_eta: "2026-09-15T13:25:00Z", expected_flight_version: "${f_v}" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { err: $.data.error_id }
          assert:
            - "v_after == 2 (first update succeeded and bumped the version)"
            - "err == ERR_STALE_VERSION with http 412 (replayed stale version rejected; estimated_arrival remains 13:20)"

      - name: version_increments_on_mutation
        claim_type: version_increment
        grounds:
          - entities.Flight
        distinguishing_aspect: "common_fields versioning: a flight created outside any program has version 1; exactly one ETA update brings it to version 2 — no cascade inflates the count."
