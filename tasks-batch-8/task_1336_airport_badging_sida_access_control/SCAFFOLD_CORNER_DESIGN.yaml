# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Airport Badging & SIDA Access Control
# Breadth probe over §1.1–§1.7 claims not covered by §1.8. Logical clock default
# is 2026-08-01T00:00:00Z. Sections/claim_types per claim-extraction-guide.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: sponsor_created_with_defaults
        claim_type: creation
        grounds: [entities.Sponsor, endpoints.POST /badging/sponsors]
        distinguishing_aspect: "A created sponsor starts ACTIVE with active_badge_count 0, suspended_at null, and system-minted id/version."
        test_recipe:
          setup: ["Nothing required beyond an empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s_id: $.data.id, s_status: $.data.status, s_cnt: $.data.active_badge_count, s_sus: $.data.suspended_at, s_ver: $.data.version } }
          assert:
            - "${s_id} is a server-minted UUID and ${s_ver} == 1"
            - "${s_status} == ACTIVE, ${s_cnt} == 0, ${s_sus} == null"

      - name: applicant_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Applicant.fields.government_id_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required government_id_number is rejected with ERR_INVALID_REQUEST (400); no applicant is persisted."
        test_recipe:
          setup: ["Sponsor s1 exists and is ACTIVE"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /badging/sponsors/${s1}/applicants afterwards returns an empty list"

      - name: training_completion_expiry_computed_from_course
        claim_type: computed_fields
        grounds: [entities.TrainingCompletion.fields.expires_at, calculations.training_currency_check]
        distinguishing_aspect: "expires_at is server-computed as completed_at + per-course validity (calendar months): SIDA_INITIAL 12mo and AOA_SAFETY 24mo yield 2027-06-01 and 2028-06-01 for the same 2026-06-01 completion date."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE with applicant a1"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer, captures: { e1: $.data.expires_at } }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer, captures: { e2: $.data.expires_at } }
          assert:
            - "${e1} == 2027-06-01T00:00:00Z (12-month validity)"
            - "${e2} == 2028-06-01T00:00:00Z (24-month validity)"
            - "TrainingCompletion responses carry no version/updated_at keys (common_fields: false, immutable record)"

      - name: sponsor_applicants_list_pagination
        claim_type: listing
        grounds: ["endpoints.GET /badging/sponsors/{id}/applicants", response_envelope.pagination_defaults]
        distinguishing_aspect: "The sub-resource list honors limit/offset and reports total_count and has_more: two applicants paginate as 1 + 1 with has_more true then false."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE with two applicants"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ben Okafor", date_of_birth: "1988-05-02", government_id_number: "G1002" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
          trigger:
            - { call: "GET /badging/sponsors/${s1}/applicants?limit=1&offset=0", payload: {}, as: BadgingOfficer, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /badging/sponsors/${s1}/applicants?limit=1&offset=1", payload: {}, as: BadgingOfficer, captures: { second_id: "$.data[0].id" } }
          assert:
            - "page 1: data length == 1, total_count == 2, has_more == true, and ${first_id} == ${a1} (created_at ascending)"
            - "page 2: data length == 1, total_count == 2, has_more == false, and ${second_id} == ${a2}"

      - name: get_badge_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_BADGE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Reading a badge id that does not exist yields ERR_BADGE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /badging/badges/11111111-2222-3333-4444-555555555555", payload: {}, as: BadgingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BADGE_NOT_FOUND with HTTP 404"

      - name: suspend_sponsor_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SPONSOR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Acting on a non-existent sponsor id yields ERR_SPONSOR_NOT_FOUND before any state check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/sponsors/11111111-2222-3333-4444-555555555555/suspend", payload: { reason: "x" }, as: SecurityManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SPONSOR_NOT_FOUND with HTTP 404"

      - name: create_application_with_unknown_applicant_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_APPLICANT_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A body FK reference to a non-existent applicant yields ERR_APPLICANT_NOT_FOUND; existence of the referenced applicant is evaluated before sponsor-ownership comparison."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /badging/applications", payload: { applicant_id: "11111111-2222-3333-4444-555555555555", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_APPLICANT_NOT_FOUND with HTTP 404"

      - name: record_chrc_unknown_application_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A transition call on a non-existent application id yields ERR_APPLICATION_NOT_FOUND before any state check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/applications/11111111-2222-3333-4444-555555555555/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_APPLICATION_NOT_FOUND with HTTP 404"

      - name: revoke_escort_privilege_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ESCORT_PRIVILEGE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Revoking a non-existent escort privilege id yields ERR_ESCORT_PRIVILEGE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/escort-privileges/11111111-2222-3333-4444-555555555555/revoke", payload: {}, as: SecurityManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ESCORT_PRIVILEGE_NOT_FOUND with HTTP 404"

      - name: sustain_violation_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_VIOLATION_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Sustaining a non-existent violation id yields ERR_VIOLATION_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/violations/11111111-2222-3333-4444-555555555555/sustain", payload: {}, as: SecurityManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VIOLATION_NOT_FOUND with HTTP 404"

      - name: close_audit_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_AUDIT_CYCLE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Closing a non-existent audit cycle id yields ERR_AUDIT_CYCLE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/audit-cycles/11111111-2222-3333-4444-555555555555/close", payload: {}, as: Auditor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_AUDIT_CYCLE_NOT_FOUND with HTTP 404"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: application_created_in_submitted_state
        claim_type: initial_state
        grounds: [state_machines.BadgeApplication]
        distinguishing_aspect: "A new application starts in SUBMITTED with application_expires_at = submitted_at + 90 days = 2026-10-30T00:00:00Z at the default clock, and null outcome fields."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE with applicant a1"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { st: $.data.status, exp: $.data.application_expires_at, chrc: $.data.chrc_outcome, sta: $.data.sta_outcome, sub: $.data.submitted_at, sp: $.data.sponsor_id } }
          assert:
            - "${st} == SUBMITTED and ${sub} == 2026-08-01T00:00:00Z (default logical clock)"
            - "${exp} == 2026-10-30T00:00:00Z (submitted_at + 90 days)"
            - "${chrc} == null and ${sta} == null"
            - "${sp} == ${s1} (sponsor denormalized from the applicant)"

      - name: record_sta_on_submitted_application_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BadgeApplication.STA_PENDING_to_PENDING_REQUIREMENTS, "errors[ERR_APPLICATION_NOT_OPEN]"]
        distinguishing_aspect: "record-sta-result is only valid from STA_PENDING; calling it on a SUBMITTED application fails with ERR_APPLICATION_NOT_OPEN and leaves the application untouched."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 with application ap1 in SUBMITTED (no CHRC recorded)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
          trigger:
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /badging/applications/${ap1}", payload: {}, as: BadgingOfficer, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_APPLICATION_NOT_OPEN"
            - "${st} == SUBMITTED (no side effects fired)"

      - name: chrc_fail_denies_application_with_reason
        claim_type: valid_transition
        grounds: [state_machines.BadgeApplication.SUBMITTED_to_DENIED]
        distinguishing_aspect: "A CHRC FAIL moves the application SUBMITTED -> DENIED with denial_reason CHRC_FAILED and chrc_outcome FAIL recorded."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 with application ap1 in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
          trigger:
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "FAIL" }, as: BadgingOfficer, captures: { st: $.data.status, rs: $.data.denial_reason, oc: $.data.chrc_outcome } }
          assert:
            - "${st} == DENIED, ${rs} == CHRC_FAILED, ${oc} == FAIL"

      - name: sta_denied_denies_application_with_reason
        claim_type: valid_transition
        grounds: [state_machines.BadgeApplication.STA_PENDING_to_DENIED]
        distinguishing_aspect: "An STA DENIED outcome moves the application STA_PENDING -> DENIED with denial_reason STA_DENIED."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 with application ap1 in STA_PENDING (CHRC PASS recorded)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
          trigger:
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "DENIED" }, as: BadgingOfficer, captures: { st: $.data.status, rs: $.data.denial_reason, oc: $.data.sta_outcome } }
          assert:
            - "${st} == DENIED, ${rs} == STA_DENIED, ${oc} == DENIED"

      - name: withdraw_denied_application_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BadgeApplication, "errors[ERR_APPLICATION_NOT_OPEN]"]
        distinguishing_aspect: "DENIED is terminal: withdrawing a denied application fails with ERR_APPLICATION_NOT_OPEN."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 whose application ap1 was DENIED at CHRC"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "FAIL" }, as: BadgingOfficer }
          trigger:
            - { call: "POST /badging/applications/${ap1}/withdraw", payload: {}, as: SponsorSignatory, as_user_id: "${s1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_APPLICATION_NOT_OPEN"

      - name: mark_returned_on_returned_badge_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Badge, "errors[ERR_BADGE_NOT_INACTIVE]"]
        distinguishing_aspect: "RETURNED is terminal: a second mark-returned fails with ERR_BADGE_NOT_INACTIVE and returned_at does not move."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds badge b1 (B201); b1 was revoked at the default clock and then returned"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B201" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/badges/${b1}/revoke", payload: { reason: "terminated" }, as: SecurityManager }
            - { call: "POST /badging/badges/${b1}/mark-returned", payload: {}, as: BadgingOfficer, captures: { st1: $.data.status, rt1: $.data.returned_at } }
          trigger:
            - { call: "POST /badging/badges/${b1}/mark-returned", payload: {}, as: BadgingOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: BadgingOfficer, captures: { rt2: $.data.returned_at } }
          assert:
            - "first return: ${st1} == RETURNED and ${rt1} == 2026-08-01T00:00:00Z"
            - "second return: ${err} == ERR_BADGE_NOT_INACTIVE and ${rt2} == ${rt1} (unchanged)"

      - name: revoke_escort_privilege_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EscortPrivilege, "errors[ERR_ESCORT_NOT_GRANTED]"]
        distinguishing_aspect: "REVOKED is terminal: a second revoke fails with ERR_ESCORT_NOT_GRANTED."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE SIDA badge b1 (B301) with GRANTED escort privilege ep1 (already revoked once)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B301" }, as: BadgingOfficer, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 3, expected_badge_version: "${bv1}" }, as: SecurityManager, as_user_id: "mgr-1", captures: { ep1: $.data.id } }
            - { call: "POST /badging/escort-privileges/${ep1}/revoke", payload: {}, as: SecurityManager, as_user_id: "mgr-1", captures: { st1: $.data.status, rs1: $.data.revoked_reason } }
          trigger:
            - { call: "POST /badging/escort-privileges/${ep1}/revoke", payload: {}, as: SecurityManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "first revoke: ${st1} == REVOKED and ${rs1} == MANUAL"
            - "second revoke: ${err} == ERR_ESCORT_NOT_GRANTED"

      - name: dismiss_dismissed_violation_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Violation, "errors[ERR_VIOLATION_NOT_OPEN]"]
        distinguishing_aspect: "DISMISSED is terminal: dismissing an already-dismissed violation fails with ERR_VIOLATION_NOT_OPEN."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE STERILE badge b1 (B401); violation v1 (FAILURE_TO_DISPLAY) recorded by off-1 and already dismissed by mgr-1"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B401" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "FAILURE_TO_DISPLAY", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, as_user_id: "off-1", captures: { v1: $.data.id } }
            - { call: "POST /badging/violations/${v1}/dismiss", payload: {}, as: SecurityManager, as_user_id: "mgr-1", captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /badging/violations/${v1}/dismiss", payload: {}, as: SecurityManager, as_user_id: "mgr-2", captures: { err: $.data.error_id } }
          assert:
            - "first dismiss: ${st1} == DISMISSED"
            - "second dismiss: ${err} == ERR_VIOLATION_NOT_OPEN"

      - name: close_closed_audit_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AuditCycle, "errors[ERR_AUDIT_NOT_OPEN]"]
        distinguishing_aspect: "CLOSED is terminal: closing an already-closed audit fails with ERR_AUDIT_NOT_OPEN and the frozen figures do not change."
        test_recipe:
          setup: ["Audit cycle au1 over [2026-01-01, 2027-01-01) already CLOSED"]
          setup_api_calls:
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Auditor, captures: { au1: $.data.id } }
            - { call: "POST /badging/audit-cycles/${au1}/close", payload: {}, as: Auditor, captures: { st1: $.data.status, rate1: $.data.recovery_rate_pct } }
          trigger:
            - { call: "POST /badging/audit-cycles/${au1}/close", payload: {}, as: Auditor, captures: { err: $.data.error_id } }
            - { call: "GET /badging/audit-cycles/${au1}", payload: {}, as: Auditor, captures: { rate2: $.data.recovery_rate_pct } }
          assert:
            - "first close: ${st1} == CLOSED and ${rate1} == 100.00 (empty scope)"
            - "second close: ${err} == ERR_AUDIT_NOT_OPEN and ${rate2} == ${rate1} (frozen)"

      - name: suspend_already_suspended_sponsor_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Sponsor, "errors[ERR_SPONSOR_NOT_ACTIVE]"]
        distinguishing_aspect: "SUSPENDED is terminal for sponsors: a second suspend fails with ERR_SPONSOR_NOT_ACTIVE."
        test_recipe:
          setup: ["Sponsor s1 already SUSPENDED by mgr-1"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/sponsors/${s1}/suspend", payload: { reason: "directive" }, as: SecurityManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /badging/sponsors/${s1}/suspend", payload: { reason: "again" }, as: SecurityManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SPONSOR_NOT_ACTIVE"

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: audit_empty_scope_closes_compliant_100
        claim_type: correct_result
        grounds: [calculations.audit_recovery_rate, entities.AuditCycle.fields.recovery_rate_pct]
        distinguishing_aspect: "Empty-set convention: an audit window with zero deactivations closes with scoped_count 0, accounted_count 0, recovery_rate_pct exactly 100.00, empty per_class_rates, and outcome COMPLIANT."
        test_recipe:
          setup: ["No badges have ever been deactivated (fresh database)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Auditor, captures: { au1: $.data.id } }
            - { call: "POST /badging/audit-cycles/${au1}/close", payload: {}, as: Auditor, captures: { scoped: $.data.scoped_count, accounted: $.data.accounted_count, rate: $.data.recovery_rate_pct, outcome: $.data.outcome, pc: $.data.per_class_rates } }
          assert:
            - "${scoped} == 0 and ${accounted} == 0"
            - "${rate} == 100.00 and ${outcome} == COMPLIANT"
            - "${pc} == [] (no badge classes in scope)"

      - name: provisional_rate_null_when_no_badges_due
        claim_type: correct_result
        grounds: [calculations.audit_recovery_rate, entities.AuditCycle.fields.recovery_rate_provisional_pct]
        distinguishing_aspect: "While OPEN, the provisional denominator counts only badges whose return_deadline has passed; with one scoped badge due 2026-09-09 and the clock at 2026-08-10, due_scoped_count is 0 and recovery_rate_provisional_pct is null (not 100.00)."
        test_recipe:
          setup:
            - "Sponsor s1 ACTIVE; applicant a1 holds STERILE badge b1 (B501)"
            - "b1 revoked at 2026-08-10 (return_deadline 2026-09-09); audit au1 OPEN over [2026-01-01, 2027-01-01); clock remains 2026-08-10"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B501" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/badges/${b1}/revoke", payload: { reason: "terminated" }, as: SecurityManager }
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Auditor, captures: { au1: $.data.id } }
          trigger:
            - { call: "GET /badging/audit-cycles/${au1}", payload: {}, as: Auditor, captures: { due: $.data.due_scoped_count, due_acc: $.data.due_accounted_count, prov: $.data.recovery_rate_provisional_pct, fin: $.data.recovery_rate_pct } }
          assert:
            - "${due} == 0 (b1's deadline 2026-09-09 is after the 2026-08-10 clock, so nothing is due yet)"
            - "${due_acc} == 0 and ${prov} == null (null-when-none-due convention)"
            - "${fin} == null while the audit is OPEN"

      - name: violation_points_assigned_from_type_constants
        claim_type: constants_applied
        grounds: [calculations.violation_points_and_suspension, entities.Violation.fields.points]
        distinguishing_aspect: "Points are server-assigned from violation_type per the constants table: FAILURE_TO_DISPLAY 3, ESCORT_VIOLATION 6, UNAUTHORIZED_AREA 6, SECURITY_BREACH 12."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE SIDA badge b1 (B601)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B601" }, as: BadgingOfficer, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "FAILURE_TO_DISPLAY", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, captures: { p1: $.data.points, s1v: $.data.status } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "ESCORT_VIOLATION", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, captures: { p2: $.data.points } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "UNAUTHORIZED_AREA", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, captures: { p3: $.data.points } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "SECURITY_BREACH", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, captures: { p4: $.data.points } }
          assert:
            - "${p1} == 3, ${p2} == 6, ${p3} == 6, ${p4} == 12"
            - "${s1v} == RECORDED (no points are active until sustain; the badge stays ACTIVE throughout recording)"

      - name: violation_window_excludes_exactly_24_months_old
        claim_type: precision
        grounds: [calculations.violation_points_and_suspension]
        distinguishing_aspect: "The 24-month window is strictly-greater: a violation occurring exactly at now - 24 months is excluded. v_old (2024-08-10) counts when sustained at 2026-08-01 but drops out of the window once the clock reaches 2026-08-10, so a later 6-point sustain totals 6, not 12, and the badge stays ACTIVE."
        test_recipe:
          setup:
            - "Sponsor s1 ACTIVE; applicant a1 holds ACTIVE SIDA badge b1 (B701)"
            - "v_old (FAILURE_TO_DISPLAY, 3 pts, occurred 2024-08-10T00:00:00Z) sustained at the default clock 2026-08-01 (inside the window then: floor 2024-08-01)"
            - "Logical clock advanced to 2026-08-10; v1 (ESCORT_VIOLATION, 6 pts, occurred 2026-08-05) RECORDED"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B701" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "FAILURE_TO_DISPLAY", occurred_at: "2024-08-10T00:00:00Z" }, as: BadgingOfficer, captures: { v_old: $.data.id } }
            - { call: "POST /badging/violations/${v_old}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "ESCORT_VIOLATION", occurred_at: "2026-08-05T00:00:00Z" }, as: BadgingOfficer, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /badging/violations/${v1}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { bst: $.data.status } }
          assert:
            - "at 2026-08-10 the window floor is 2024-08-10; v_old occurred exactly at the floor and is EXCLUDED (strictly-greater rule)"
            - "windowed points = 6 (v1 alone), below the 12 threshold: ${bst} == ACTIVE"

      - name: badge_expiry_sweep_at_exact_expiry
        claim_type: precision
        grounds: [calculations.badge_expiry_computation, state_machines.Badge.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "Expiry is inclusive at the boundary instant: one day before expires_at the badge remains ACTIVE; at exactly expires_at the clock sweep moves it to EXPIRED with deactivated_at == expires_at and return_deadline == expires_at + 30 days."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE STERILE badge b1 (B801) with expires_at 2027-06-01 (completion 2026-06-01)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B801" }, as: BadgingOfficer, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2027-05-31T00:00:00Z" }, as: BadgingOfficer }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: BadgingOfficer, captures: { st_pre: $.data.status } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: BadgingOfficer, captures: { st_post: $.data.status, dact: $.data.deactivated_at, rdl: $.data.return_deadline } }
          assert:
            - "2027-05-31: ${st_pre} == ACTIVE"
            - "2027-06-01 (exactly expires_at): ${st_post} == EXPIRED, ${dact} == 2027-06-01T00:00:00Z, ${rdl} == 2027-07-01T00:00:00Z"

      - name: application_expiry_sweep_at_exact_deadline
        claim_type: precision
        grounds: [calculations.application_deadline, state_machines.BadgeApplication]
        distinguishing_aspect: "The 90-day application window is inclusive at its end: at expires_at - 1 day the application stays SUBMITTED; at exactly application_expires_at the sweep moves it to EXPIRED."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1's SIDA application ap1 rests in SUBMITTED (created at the 2026-08-01 default clock, application_expires_at 2026-10-30)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
          trigger:
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-10-29T00:00:00Z" }, as: BadgingOfficer }
            - { call: "GET /badging/applications/${ap1}", payload: {}, as: BadgingOfficer, captures: { st_pre: $.data.status } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: BadgingOfficer }
            - { call: "GET /badging/applications/${ap1}", payload: {}, as: BadgingOfficer, captures: { st_post: $.data.status } }
          assert:
            - "2026-10-29: ${st_pre} == SUBMITTED"
            - "2026-10-30 (exactly application_expires_at): ${st_post} == EXPIRED"

      - name: access_zone_class_denied
        claim_type: correct_result
        grounds: [calculations.access_decision]
        distinguishing_aspect: "STERILE is not in SECURE_ID_AREA's allowed classes [SIDA]: the check returns 201 with decision DENIED and denial_reason DENIED_ZONE_CLASS (denial is a logged decision, not an error)."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE STERILE badge b1 (B901)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B901" }, as: BadgingOfficer, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /badging/access-checks", payload: { zone_code: "SECURE_ID_AREA", badge_id: "${b1}" }, as: AccessControlSystem, captures: { d: $.data.decision, r: $.data.denial_reason, z: $.data.zone_code } }
          assert:
            - "${d} == DENIED and ${r} == DENIED_ZONE_CLASS and ${z} == SECURE_ID_AREA"

      - name: access_escort_zone_forbidden
        claim_type: correct_result
        grounds: [calculations.access_decision]
        distinguishing_aspect: "SECURE_ID_AREA has escorted_entry_allowed = false: even a SIDA badge with a GRANTED escort privilege is DENIED / DENIED_ESCORT_NOT_PERMITTED when escortee_count > 0."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE SIDA badge b1 (B1001) with a GRANTED escort privilege (max_escortees 3)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1001" }, as: BadgingOfficer, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 3, expected_badge_version: "${bv1}" }, as: SecurityManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /badging/access-checks", payload: { zone_code: "SECURE_ID_AREA", badge_id: "${b1}", escortee_count: 1 }, as: AccessControlSystem, captures: { d: $.data.decision, r: $.data.denial_reason } }
          assert:
            - "${d} == DENIED and ${r} == DENIED_ESCORT_NOT_PERMITTED (zone forbids escorted entry regardless of privilege)"

      - name: access_escort_without_privilege
        claim_type: correct_result
        grounds: [calculations.access_decision]
        distinguishing_aspect: "STERILE_CONCOURSE allows escorted entry, but a SIDA badge with no GRANTED escort privilege is DENIED / DENIED_ESCORT_NOT_PERMITTED when escortee_count > 0; the same badge with escortee_count 0 is ALLOWED."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE SIDA badge b1 (B1101) with NO escort privilege"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1101" }, as: BadgingOfficer, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /badging/access-checks", payload: { zone_code: "STERILE_CONCOURSE", badge_id: "${b1}" }, as: AccessControlSystem, captures: { d0: $.data.decision } }
            - { call: "POST /badging/access-checks", payload: { zone_code: "STERILE_CONCOURSE", badge_id: "${b1}", escortee_count: 2 }, as: AccessControlSystem, captures: { d1: $.data.decision, r1: $.data.denial_reason } }
          assert:
            - "unescorted: ${d0} == ALLOWED"
            - "escorting without privilege: ${d1} == DENIED and ${r1} == DENIED_ESCORT_NOT_PERMITTED"

      - name: escort_capacity_boundary_inclusive
        claim_type: precision
        grounds: [calculations.access_decision]
        distinguishing_aspect: "The capacity comparison is inclusive: escortee_count == max_escortees (3) is ALLOWED while escortee_count == max_escortees + 1 (4) is DENIED / DENIED_ESCORT_CAPACITY."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE SIDA badge b1 (B1201) with a GRANTED escort privilege (max_escortees 3)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1201" }, as: BadgingOfficer, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 3, expected_badge_version: "${bv1}" }, as: SecurityManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /badging/access-checks", payload: { zone_code: "AOA_MOVEMENT", badge_id: "${b1}", escortee_count: 3 }, as: AccessControlSystem, captures: { d_ok: $.data.decision } }
            - { call: "POST /badging/access-checks", payload: { zone_code: "AOA_MOVEMENT", badge_id: "${b1}", escortee_count: 4 }, as: AccessControlSystem, captures: { d_over: $.data.decision, r_over: $.data.denial_reason } }
          assert:
            - "escortee_count == max_escortees: ${d_ok} == ALLOWED"
            - "escortee_count == max_escortees + 1: ${d_over} == DENIED and ${r_over} == DENIED_ESCORT_CAPACITY"

      - name: access_badgeless_attempt_denied_no_badge
        claim_type: correct_result
        grounds: [calculations.access_decision]
        distinguishing_aspect: "A check with no badge_id is always DENIED / DENIED_NO_BADGE — even at PUBLIC_TERMINAL — and is still logged as an AccessEvent with badge_id null."
        test_recipe:
          setup: ["Empty database (no badges exist)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/access-checks", payload: { zone_code: "PUBLIC_TERMINAL" }, as: AccessControlSystem, captures: { d: $.data.decision, r: $.data.denial_reason, b: $.data.badge_id } }
          assert:
            - "${d} == DENIED and ${r} == DENIED_NO_BADGE and ${b} == null"

  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request sent without X-User-ID / X-User-Role headers fails priority-1 authentication with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role, existence, or state check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { err: $.data.error_id } }
          assert:
            - "the request is sent with the X-User-ID and X-User-Role headers REMOVED: ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with HTTP 400"

      - name: sponsor_delinquency_blocks_issuance_at_return_deadline
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", calculations.sponsor_delinquency_check, "errors[ERR_SPONSOR_DELINQUENT]"]
        distinguishing_aspect: "The overdue comparison is inclusive of return_deadline: with a LOST badge due 2026-09-09, issuance succeeds at 2026-09-08 (not yet overdue) and fails with ERR_SPONSOR_DELINQUENT at exactly 2026-09-09."
        test_recipe:
          setup:
            - "Sponsor s1 (quota 5) with: a1's badge b1 (B1301, STERILE) reported LOST at 2026-08-10 (return_deadline 2026-09-09)"
            - "a2's STERILE application ap2 READY (created at the default clock, expires 2026-10-30)"
            - "a3's STERILE application ap3 READY (created at 2026-09-08, expires 2026-12-07)"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1301" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ben Okafor", date_of_birth: "1988-05-02", government_id_number: "G1002" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/badges/${b1}/report-lost", payload: { report_type: "LOST" }, as: BadgingOfficer }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Cory Pell", date_of_birth: "1995-03-03", government_id_number: "G1003" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a3: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a3}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap3: $.data.id } }
            - { call: "POST /badging/applications/${ap3}/record-chrc", payload: { fingerprint_submitted_at: "2026-09-08T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap3}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a3}", course_code: "STERILE_INITIAL", completed_at: "2026-09-01T00:00:00Z" }, as: BadgingOfficer }
          trigger:
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B1302" }, as: BadgingOfficer, captures: { ok: $.data.status } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-09-09T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap3}/issue-badge", payload: { badge_number: "B1303" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "2026-09-08 (deadline not yet reached): ${ok} == ACTIVE"
            - "2026-09-09 (exactly return_deadline, inclusive): ${err} == ERR_SPONSOR_DELINQUENT"

      - name: second_open_application_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_OPEN_APPLICATION_EXISTS]"]
        distinguishing_aspect: "An applicant may hold at most one non-terminal application: a second POST /badging/applications while the first is SUBMITTED fails with ERR_OPEN_APPLICATION_EXISTS."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 has application ap1 in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
          trigger:
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OPEN_APPLICATION_EXISTS (even though the requested class differs)"

      - name: duplicate_badge_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_BADGE_NUMBER_TAKEN]", entities.Badge.fields.badge_number]
        distinguishing_aspect: "badge_number is globally unique: issuing a second badge (different applicant) with an already-used number fails with ERR_BADGE_NUMBER_TAKEN."
        test_recipe:
          setup: ["Sponsor s1 (quota 5) with READY STERILE applications ap1 (a1) and ap2 (a2)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ben Okafor", date_of_birth: "1988-05-02", government_id_number: "G1002" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap2: $.data.id } }
            - { call: "POST /badging/applications/${ap2}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap2}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a2}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B900" }, as: BadgingOfficer }
          trigger:
            - { call: "POST /badging/applications/${ap2}/issue-badge", payload: { badge_number: "B900" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BADGE_NUMBER_TAKEN"

      - name: record_chrc_invalid_enum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]", entities.BadgeApplication.fields.chrc_outcome]
        distinguishing_aspect: "An outcome value outside the {PASS, FAIL} enum is rejected with ERR_INVALID_REQUEST (400) before any state transition."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 with application ap1 in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
          trigger:
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "MAYBE" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /badging/applications/${ap1}", payload: {}, as: BadgingOfficer, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_INVALID_REQUEST and ${st} == SUBMITTED (unchanged)"

      - name: audit_window_end_before_start_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.AuditCycle.fields.window_end]
        distinguishing_aspect: "window_end <= window_start is a malformed range, rejected with ERR_INVALID_REQUEST (400) — not an overlap/gap error."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /badging/audit-cycles", payload: { window_start: "2027-01-01T00:00:00Z", window_end: "2026-01-01T00:00:00Z" }, as: Auditor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"

      - name: reinstate_before_suspension_served_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SUSPENSION_NOT_SERVED]", state_machines.Badge.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "A points-driven suspension (12 pts -> +7 days, suspended_until 2026-08-08) cannot be reinstated at 2026-08-07; at exactly 2026-08-08 (inclusive >= boundary) reinstate by a different manager succeeds."
        test_recipe:
          setup:
            - "Sponsor s1 ACTIVE; applicant a1 holds SIDA badge b1 (B1501)"
            - "v1 (UNAUTHORIZED_AREA, 6) and v2 (ESCORT_VIOLATION, 6) sustained by mgr-1 at the default clock -> 12 points, badge SUSPENDED with suspended_until 2026-08-08, suspended_by mgr-1"
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1501" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "UNAUTHORIZED_AREA", occurred_at: "2026-08-02T00:00:00Z" }, as: BadgingOfficer, captures: { v1: $.data.id } }
            - { call: "POST /badging/violations/${v1}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "POST /badging/violations", payload: { badge_id: "${b1}", violation_type: "ESCORT_VIOLATION", occurred_at: "2026-08-03T00:00:00Z" }, as: BadgingOfficer, captures: { v2: $.data.id } }
            - { call: "POST /badging/violations/${v2}/sustain", payload: {}, as: SecurityManager, as_user_id: "mgr-1", captures: { v2st: $.data.status } }
          trigger:
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: SecurityManager }
            - { call: "POST /badging/badges/${b1}/reinstate", payload: {}, as: SecurityManager, as_user_id: "mgr-2", captures: { err: $.data.error_id } }
            - { call: "POST /badging/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: SecurityManager }
            - { call: "POST /badging/badges/${b1}/reinstate", payload: {}, as: SecurityManager, as_user_id: "mgr-2", captures: { st: $.data.status, by: $.data.suspended_by, until: $.data.suspended_until } }
          assert:
            - "setup reached 12 points: ${v2st} == SUSTAINED and badge auto-suspended"
            - "2026-08-07 (one day early): ${err} == ERR_SUSPENSION_NOT_SERVED"
            - "2026-08-08 (exactly suspended_until, inclusive): ${st} == ACTIVE, ${by} == null, ${until} == null"

      - name: grant_escort_on_suspended_badge_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_BADGE_NOT_ACTIVE]", "concurrency_rules[escort-grant-stale-badge]"]
        distinguishing_aspect: "State is checked before the OCC version check: granting an escort privilege on a SUSPENDED badge fails with ERR_BADGE_NOT_ACTIVE even when expected_badge_version is correct."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds SIDA badge b1 (B1601), suspended by mgr-1 (badge version advanced to 2)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1601" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/badges/${b1}/suspend", payload: { reason: "review" }, as: SecurityManager, as_user_id: "mgr-1" }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: SecurityManager, captures: { bv2: $.data.version } }
          trigger:
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 3, expected_badge_version: "${bv2}" }, as: SecurityManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BADGE_NOT_ACTIVE (priority-5 state beats the priority-6 OCC check even though the version is fresh)"

      - name: replace_lost_badge_rejected
        claim_type: violation_to_error
        grounds: [state_machines.Badge.ACTIVE_to_VOIDED, "errors[ERR_BADGE_NOT_REPLACEABLE]"]
        distinguishing_aspect: "LOST badges are not replaceable — a lost badge stays on the audit books until physically returned; replace fails with ERR_BADGE_NOT_REPLACEABLE and the badge remains LOST with its return_deadline intact."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1's STERILE badge b1 (B1701) was reported LOST at the default clock (return_deadline 2026-08-31)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1701" }, as: BadgingOfficer, captures: { b1: $.data.id } }
            - { call: "POST /badging/badges/${b1}/report-lost", payload: { report_type: "LOST" }, as: SponsorSignatory, as_user_id: "${s1}" }
          trigger:
            - { call: "POST /badging/badges/${b1}/replace", payload: { badge_number: "B1701R" }, as: BadgingOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /badging/badges/${b1}", payload: {}, as: BadgingOfficer, captures: { st: $.data.status, rdl: $.data.return_deadline } }
          assert:
            - "${err} == ERR_BADGE_NOT_REPLACEABLE"
            - "${st} == LOST and ${rdl} == 2026-08-31T00:00:00Z (return obligation survives; the loss stays auditable)"

      - name: reinstate_active_badge_rejected
        claim_type: violation_to_error
        grounds: [state_machines.Badge.SUSPENDED_to_ACTIVE, "errors[ERR_BADGE_NOT_SUSPENDED]"]
        distinguishing_aspect: "reinstate is only valid from SUSPENDED: calling it on an ACTIVE badge fails with ERR_BADGE_NOT_SUSPENDED."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE STERILE badge b1 (B1801)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "STERILE" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "STERILE_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1801" }, as: BadgingOfficer, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /badging/badges/${b1}/reinstate", payload: {}, as: SecurityManager, as_user_id: "mgr-2", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BADGE_NOT_SUSPENDED"

      - name: grant_escort_max_out_of_range_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.EscortPrivilege.fields.max_escortees]
        distinguishing_aspect: "max_escortees outside 1..10 is rejected with ERR_INVALID_REQUEST before the OCC or state logic creates anything."
        test_recipe:
          setup: ["Sponsor s1 ACTIVE; applicant a1 holds ACTIVE SIDA badge b1 (B1901)"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s1}", full_name: "Ana Rios", date_of_birth: "1990-01-01", government_id_number: "G1001" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { a1: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a1}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s1}", captures: { ap1: $.data.id } }
            - { call: "POST /badging/applications/${ap1}/record-chrc", payload: { fingerprint_submitted_at: "2026-08-01T00:00:00Z", outcome: "PASS" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/record-sta-result", payload: { outcome: "CLEARED" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "SIDA_INITIAL", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/training-completions", payload: { applicant_id: "${a1}", course_code: "AOA_SAFETY", completed_at: "2026-06-01T00:00:00Z" }, as: BadgingOfficer }
            - { call: "POST /badging/applications/${ap1}/issue-badge", payload: { badge_number: "B1901" }, as: BadgingOfficer, captures: { b1: $.data.id, bv1: $.data.version } }
          trigger:
            - { call: "POST /badging/badges/${b1}/escort-privileges", payload: { max_escortees: 11, expected_badge_version: "${bv1}" }, as: SecurityManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /badging/badges/${b1}/escort-privileges afterwards returns an empty list"

      - name: withdraw_other_sponsors_application_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_SPONSOR_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "SponsorSignatory ownership: a signatory of sponsor s1 cannot withdraw sponsor s2's application — ERR_SPONSOR_OWNERSHIP_MISMATCH (403), even though the role itself is allowed to withdraw."
        test_recipe:
          setup: ["Sponsors s1 and s2 both ACTIVE; applicant a2 belongs to s2 with application ap2 in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /badging/sponsors", payload: { name: "AeroFuel", sponsor_code: "AF", active_badge_quota: 5 }, as: SecurityManager, captures: { s1: $.data.id } }
            - { call: "POST /badging/sponsors", payload: { name: "SkyChefs", sponsor_code: "SC", active_badge_quota: 5 }, as: SecurityManager, captures: { s2: $.data.id } }
            - { call: "POST /badging/applicants", payload: { sponsor_id: "${s2}", full_name: "Ben Okafor", date_of_birth: "1988-05-02", government_id_number: "G1002" }, as: SponsorSignatory, as_user_id: "${s2}", captures: { a2: $.data.id } }
            - { call: "POST /badging/applications", payload: { applicant_id: "${a2}", badge_class: "SIDA" }, as: SponsorSignatory, as_user_id: "${s2}", captures: { ap2: $.data.id } }
          trigger:
            - { call: "POST /badging/applications/${ap2}/withdraw", payload: {}, as: SponsorSignatory, as_user_id: "${s1}", captures: { err: $.data.error_id } }
            - { call: "GET /badging/applications/${ap2}", payload: {}, as: BadgingOfficer, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_SPONSOR_OWNERSHIP_MISMATCH with HTTP 403"
            - "${st} == SUBMITTED (unchanged)"

  # ---------------------------------------------------------------------------
