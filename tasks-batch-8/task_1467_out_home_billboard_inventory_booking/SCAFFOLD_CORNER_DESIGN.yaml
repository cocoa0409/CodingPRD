            - { call: "POST /api/permits", payload: { face_id: "${fd}", permit_number: "P-D9", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${fd}", payload: {}, as: SalesPlanner, captures: { fd_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
          trigger:
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fd}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", loop_slots: 1, expected_face_version: "${fd_v}" }, as: SalesPlanner, captures: { weekly: $.data.pinned_weekly_cents, gross: $.data.gross_cents, weeks: $.data.weeks } }
