              as: FeedyardManager
            - call: "POST /feedlot/health-events"
              payload: { lot_id: "${l_id}", treatment_date: "2026-08-01", drug_product: "DRAXXIN", withdrawal_days: 0, head_treated: 2, treatment_cost_cents: 5000 }
              as: CattleHealthTech
          trigger:
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-02", head_count: 7, cause: "RESPIRATORY", insured: false }
              as: CattleHealthTech
              captures: { d_value: $.data.loss_value_cents }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { l_cur: $.data.head_count_current, l_deaths: $.data.total_deaths, l_dlc: $.data.total_death_loss_cents }
            - call: "GET /feedlot/lots/${l_id}/assignments"
