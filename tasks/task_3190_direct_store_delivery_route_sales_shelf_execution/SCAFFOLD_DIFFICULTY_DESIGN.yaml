  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: delivery_cascades_through_lot_day_and_settlement
        grounds:
          - state_machines.StoreOrder.SUBMITTED_to_DELIVERED
          - state_machines.RouteSettlement.transitions
          - calculations.settlement_reconciliation
        distinguishing_aspect: |
          Depth-3 cascade triggered by order delivery: deliver mutates
          TruckInventoryLot.delivered_cases; the lot mutation recomputes
          RouteDay.delivered_cases; the day mutation recomputes the OPEN
          RouteSettlement's gross/forward/chronological fields. Each hop is
          caused by the previous hop, not by the deliver call directly.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store FULL_RETAIL. Product P at 500 cents; 100 cases exp 2026-09-20 in lot L; day started."
            - "Order 1 (30 cases) delivered. Settlement opened (gross 15000, both expected variants 15000)."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
