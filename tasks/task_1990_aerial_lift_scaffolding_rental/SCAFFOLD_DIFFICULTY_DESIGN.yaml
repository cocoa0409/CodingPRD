      - name: fail_inspection_quarantines_unit_cancels_line
        grounds:
          - state_machines.InspectionRecord.SUBMITTED_to_CERTIFIED
          - state_machines.EquipmentUnit.AVAILABLE_to_QUARANTINED
          - state_machines.RentalLine.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 cascade originating at POST /inspection-records/{id}/certify with a
          FAIL result: certification mutates EquipmentUnit AVAILABLE -> QUARANTINED
          (link 1); that unit mutation itself cancels every RESERVED RentalLine on the
          unit (link 2). Different triggering transition than the claim-charge cascade.
        test_recipe:
          setup:
            - "Class S19F (daily 14500, weekly 43500, monthly 99000, min 1, height 25); unit AVAILABLE with current inspection"
            - "Contract (DRAFT) holds one RESERVED line on the unit, window 2026-09-01..2026-09-10"
