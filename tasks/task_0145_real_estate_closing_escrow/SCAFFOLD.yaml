# =============================================================================
# Real Estate Closing & Third-Party Escrow benchmark seed tables
# =============================================================================

scenario: |
  Real Estate Closing & Third-Party Escrow: Earnest Money, Title search,
  Title Insurance, CC&R, Closing Disclosure 3-day rule, Wire Fraud protection,
  1031 exchange. A neutral escrow agent receives an Earnest Money Deposit
  (EMD), orders a Title Search, binds Owner's and Lender's Title Insurance,
  discloses CC&R restrictions, issues a Closing Disclosure (CD) that must
  age 3 business days before close, verifies wire-disbursement instructions
  through an out-of-band confirmation to defeat wire-fraud, and — when the
  parties elect — interlocks the closing with a §1031 like-kind exchange
  whose realized gain is split into recognized (taxable boot) and deferred
  components that MUST sum to the realized gain.

domain_name: real-estate-closing-escrow
api_prefix: /escrow-files

# =============================================================================
# Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - scheduled_deferred_actions     # 3-business-day CD waiting period, clock advance
    - cascading_side_effects         # CD revision invalidates prior ack, restarts clock, voids approvals
    - dual_variant_calculation       # buyer-default vs seller-default EMD disposition; cost-basis vs FMV gain
    - rate_threshold_triggers        # title insurance tier breakpoints, EMD floor, boot threshold

  entity_topology: flat
  # Flat with foreign keys: every artifact (EMD, TitleSearch, TitleInsurancePolicy,
  # CCRDisclosure, ClosingDisclosure, WireInstruction, Disbursement, Exchange1031)
  # references EscrowFile by escrow_file_id; none are nested under a parent URL.

  state_machine_shape: branching
  # Branching with revert and cycle: ClosingDisclosure ISSUED→ACKNOWLEDGED→READY_TO_FUND
  # OR ISSUED→REVISED→ISSUED (cycle restarts the 3-day clock). EscrowFile diamond:
  # OPEN→{CONTINGENT_TITLE, CONTINGENT_CD, CONTINGENT_WIRE}→READY_TO_CLOSE.

  relationship_patterns:
    - one_to_many                    # EscrowFile has many ClosingDisclosure versions
    - cross_aggregate                # Disbursement references Exchange1031 via qualified intermediary
    - polymorphic                    # WireInstruction.beneficiary_kind ∈ {SELLER, LENDER_PAYOFF, QUALIFIED_INTERMEDIARY, TAX_AUTHORITY}

  role_model: segregation_of_duties
  # Escrow officer who issued the CD MUST NOT be the same operator who
  # approves the wire disbursement (anti-fraud). Title officer is a peer role
  # owning the TitleSearch + TitleInsurancePolicy entities. Buyer and Seller
  # are entity-backed party roles.

  consistency_model: immediate

# =============================================================================
# Response envelope (FIXED — emit verbatim per §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: full_name,        type: string,   source: input,    description: "Legal name on contract" }
      - { name: party_kind,       type: enum,     source: input,    description: "BUYER | SELLER | LENDER | QUALIFIED_INTERMEDIARY", constraints: "enum closed set" }
      - { name: contact_email,    type: string,   source: input,    description: "Email used for out-of-band wire confirmation callbacks" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: street_address,   type: string,   source: input,    description: "Subject property address" }
      - { name: parcel_id,        type: string,   source: input,    description: "County assessor parcel number" }
      - { name: hoa_annual_dues,  type: number,   source: input,    description: "Annual HOA dues in USD (proration input)", default: 0 }
      - { name: tax_annual,       type: number,   source: input,    description: "Annual property tax in USD (proration input)", default: 0 }

  - name: EscrowFile
    parent: null
    common_fields: true
    fields:
      - { name: property_id,           type: string,   source: input,    description: "FK to Property" }
      - { name: buyer_party_id,        type: string,   source: input,    description: "FK to Party (party_kind=BUYER)" }
      - { name: seller_party_id,       type: string,   source: input,    description: "FK to Party (party_kind=SELLER)" }
      - { name: lender_party_id,       type: string,   source: input,    description: "FK to Party (party_kind=LENDER); nullable for cash deals" }
      - { name: qi_party_id,           type: string,   source: input,    description: "FK to Party (party_kind=QUALIFIED_INTERMEDIARY); set iff §1031 elected" }
      - { name: purchase_price,        type: number,   source: input,    description: "Agreed sale price in USD" }
      - { name: loan_amount,           type: number,   source: input,    description: "Mortgage principal in USD; 0 for cash deals", default: 0 }
      - { name: closing_date_planned,  type: datetime, source: input,    description: "Planned funding date (ISO 8601 UTC)" }
      - { name: status,                type: enum,     source: system,   description: "OPEN → CONTINGENT_TITLE → CONTINGENT_CD → CONTINGENT_WIRE → READY_TO_CLOSE → CLOSED / CANCELLED", constraints: "enum closed set" }
      - { name: is_1031_exchange,      type: boolean,  source: input,    default: false, description: "True iff buyer/seller elected §1031 like-kind exchange" }

  - name: EarnestMoneyDeposit
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id,    type: string, source: input,    description: "FK to EscrowFile" }
      - { name: amount,            type: number, source: input,    description: "Deposit amount in USD" }
      - { name: forfeited_amount,  type: number, source: computed, default: 0, description: "Amount disposed to seller on RELEASED_TO_SELLER; else 0" }
      - { name: refunded_amount,   type: number, source: computed, default: 0, description: "Amount returned to buyer on RELEASED_TO_BUYER; else 0" }
      - { name: status,            type: enum,   source: system,   description: "PENDING_FUNDS → HELD → RELEASED_TO_SELLER / RELEASED_TO_BUYER / SPLIT", constraints: "enum closed set" }
      - { name: split_buyer_share, type: number, source: input,    default: 0, description: "Buyer share on SPLIT release; sum with seller share = amount" }
      - { name: split_seller_share, type: number, source: input,   default: 0, description: "Seller share on SPLIT release" }

  - name: TitleSearch
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id,        type: string,   source: input,    description: "FK to EscrowFile" }
      - { name: chain_of_title_clean,  type: boolean,  source: input,    description: "True if no breaks in chain" }
      - { name: open_liens_total,      type: number,   source: input,    default: 0, description: "Sum of unreleased lien balances in USD" }
      - { name: encumbrance_count,     type: integer,  source: input,    default: 0, description: "Count of recorded easements/encumbrances" }
      - { name: status,                type: enum,     source: system,   description: "ORDERED → COMPLETED → CLEARED / DEFECTIVE", constraints: "enum closed set" }

  - name: TitleInsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id,        type: string,   source: input,    description: "FK to EscrowFile" }
      - { name: policy_kind,           type: enum,     source: input,    description: "OWNERS | LENDERS", constraints: "enum closed set" }
      - { name: insured_amount,        type: number,   source: input,    description: "Liability face amount in USD" }
      - { name: simultaneous_issue,    type: boolean,  source: input,    default: false, description: "True iff a peer OWNERS policy already BOUND on same EscrowFile when LENDERS policy is created" }
      - { name: premium,               type: number,   source: computed, description: "Premium in USD; computed by calc title_insurance_premium" }
      - { name: status,                type: enum,     source: system,   description: "QUOTED → BOUND → VOIDED", constraints: "enum closed set" }

  - name: CCRDisclosure
    parent: null
    common_fields: false  # immutable signed record — only id + created_at
    fields:
      - { name: escrow_file_id,        type: string,   source: input,    description: "FK to EscrowFile" }
      - { name: ccr_document_hash,     type: string,   source: input,    description: "SHA-256 hex of the CC&R document delivered to buyer" }
      - { name: buyer_acknowledged_at, type: datetime, source: system,   description: "ISO timestamp buyer signed acknowledgment" }
      - { name: material_restrictions, type: array,    source: input,    description: "Enumerated material restriction codes (e.g., RENTAL_BAN, SHORT_TERM_RENTAL_BAN, ARCHITECTURAL_REVIEW)" }

  - name: ClosingDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id,        type: string,   source: input,    description: "FK to EscrowFile" }
      - { name: version_number,        type: integer,  source: system,   description: "Monotone counter starting at 1; new revision = previous + 1" }
      - { name: cash_to_close,         type: number,   source: computed, description: "Computed by calc cash_to_close" }
      - { name: total_loan_costs,      type: number,   source: input,    default: 0, description: "Bundled loan-origination costs in USD" }
      - { name: seller_credits,        type: number,   source: input,    default: 0, description: "Credits from seller to buyer at closing" }
      - { name: prorated_tax_credit,   type: number,   source: computed, description: "Seller's share of annual tax pro-rated; cents per calc cash_to_close" }
      - { name: prorated_hoa_credit,   type: number,   source: computed, description: "Seller's share of annual HOA pro-rated; cents per calc cash_to_close" }
      - { name: seller_days_owned,     type: integer,  source: input,    description: "Days from Jan 1 of closing year through closing_date_planned (inclusive)" }
      - { name: issued_at,             type: datetime, source: system,   description: "ISO timestamp of latest ISSUED transition (revision resets this)" }
      - { name: earliest_funding_at,   type: datetime, source: computed, description: "issued_at + 3 business days (US federal holidays observed)" }
      - { name: buyer_acknowledged_at, type: datetime, source: system,   description: "Set on ACK transition; cleared on REVISED" }
      - { name: status,                type: enum,     source: system,   description: "DRAFT → ISSUED → ACKNOWLEDGED → READY_TO_FUND ; ISSUED→REVISED→ISSUED cycle resets clock", constraints: "enum closed set: DRAFT, ISSUED, ACKNOWLEDGED, READY_TO_FUND, REVISED, VOIDED" }
      - { name: triggering_change_kind, type: enum,    source: input,    default: NONE, description: "Reason for revision: NONE | APR_DELTA_OVER_THRESHOLD | LOAN_PRODUCT_CHANGE | PREPAYMENT_PENALTY_ADDED | FEE_DELTA_UNDER_THRESHOLD" }

  - name: WireInstruction
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id,    type: string, source: input,  description: "FK to EscrowFile" }
      - { name: beneficiary_kind,  type: enum,   source: input,  description: "SELLER | LENDER_PAYOFF | QUALIFIED_INTERMEDIARY | TAX_AUTHORITY", constraints: "enum closed set" }
      - { name: beneficiary_party_id, type: string, source: input, description: "FK to Party; must match a Party with matching party_kind" }
      - { name: routing_number,    type: string, source: input,  description: "ABA routing number; 9 digits" }
      - { name: account_number_last4, type: string, source: input, description: "Last 4 of beneficiary account; full number stored elsewhere" }
      - { name: confirmation_callback_at, type: datetime, source: system, description: "Out-of-band callback completion timestamp" }
      - { name: confirmed_by_user_id,    type: string,   source: system, description: "Operator id who completed callback (segregation-of-duties subject)" }
      - { name: status,            type: enum,   source: system, description: "DRAFT → PENDING_CONFIRMATION → CONFIRMED → VOIDED / REJECTED_FRAUD_FLAG", constraints: "enum closed set" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id,         type: string, source: input,    description: "FK to EscrowFile" }
      - { name: wire_instruction_id,    type: string, source: input,    description: "FK to WireInstruction; must be CONFIRMED" }
      - { name: amount,                 type: number, source: input,    description: "Amount disbursed in USD" }
      - { name: approved_by_user_id,    type: string, source: system,   description: "Operator who approved (must differ from CD issuer per SoD)" }
      - { name: status,                 type: enum,   source: system,   description: "PROPOSED → APPROVED → SENT → SETTLED / REVERSED", constraints: "enum closed set" }

  - name: Exchange1031
    parent: null
    common_fields: true
    fields:
      - { name: escrow_file_id,         type: string, source: input,    description: "FK to EscrowFile; only when EscrowFile.is_1031_exchange=true" }
      - { name: relinquished_basis,     type: number, source: input,    description: "Adjusted basis of relinquished property in USD" }
      - { name: relinquished_sale_price, type: number, source: input,   description: "Sale price of relinquished property in USD" }
      - { name: cash_boot_received,     type: number, source: input,    default: 0, description: "Non-like-kind cash received by exchanger" }
      - { name: mortgage_relief,        type: number, source: input,    default: 0, description: "Excess of relinquished debt paid off over debt assumed on replacement" }
      - { name: realized_gain,          type: number, source: computed, description: "relinquished_sale_price - relinquished_basis (computed)" }
      - { name: recognized_gain,        type: number, source: computed, description: "min(realized_gain, cash_boot_received + mortgage_relief)" }
      - { name: deferred_gain,          type: number, source: computed, description: "realized_gain - recognized_gain (conserved invariant)" }
      - { name: identification_deadline_at, type: datetime, source: system, description: "closing_date_planned of relinquished sale + 45 days" }
      - { name: exchange_deadline_at,   type: datetime, source: system,    description: "closing_date_planned of relinquished sale + 180 days" }
      - { name: status,                 type: enum,   source: system,   description: "INITIATED → IDENTIFIED → CLOSED_DEFERRED / FAILED_TAXABLE", constraints: "enum closed set" }

  - name: AuditEvent
    parent: null
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: escrow_file_id,    type: string, source: system,  description: "FK to EscrowFile" }
      - { name: subject_kind,      type: enum,   source: system,  description: "EMD | TITLE_SEARCH | TITLE_POLICY | CCR | CD | WIRE | DISBURSEMENT | EXCHANGE_1031", constraints: "enum closed set" }
      - { name: subject_id,        type: string, source: system,  description: "Id of the subject entity" }
      - { name: actor_user_id,     type: string, source: system,  description: "Operator who triggered the event (X-User-ID)" }
      - { name: actor_role,        type: string, source: system,  description: "X-User-Role at time of event" }
      - { name: action,            type: string, source: system,  description: "State transition name or mutation name (e.g., 'CD_REVISED', 'WIRE_CONFIRMED')" }
      - { name: payload_hash,      type: string, source: system,  description: "SHA-256 hex of canonical request body for tamper-evidence" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: EscrowFile
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: CONTINGENT_TITLE
        trigger: "POST /escrow-files/{id}/advance (auto-evaluated on TitleSearch.status changes)"
        actor: system
        preconditions: ["EarnestMoneyDeposit on this escrow file in HELD"]
        side_effects: ["AuditEvent appended"]
      - from: CONTINGENT_TITLE
        to: CONTINGENT_CD
        trigger: "POST /escrow-files/{id}/advance (auto-evaluated)"
        actor: system
        preconditions:
          - "TitleSearch.status = CLEARED"
          - "TitleInsurancePolicy with policy_kind=OWNERS exists in status BOUND"
          - "CCRDisclosure exists for this escrow_file_id"
        side_effects: ["AuditEvent appended"]
      - from: CONTINGENT_CD
        to: CONTINGENT_WIRE
        trigger: "POST /escrow-files/{id}/advance"
        actor: system
        preconditions:
          - "ClosingDisclosure on this file in status READY_TO_FUND"
        side_effects: ["AuditEvent appended"]
      - from: CONTINGENT_WIRE
        to: READY_TO_CLOSE
        trigger: "POST /escrow-files/{id}/advance"
        actor: system
        preconditions:
          - "All required WireInstruction rows for this file in status CONFIRMED (one per beneficiary_kind that has a non-zero disbursement)"
        side_effects: ["AuditEvent appended"]
      - from: READY_TO_CLOSE
        to: CLOSED
        trigger: "POST /escrow-files/{id}/close"
        actor: EscrowOfficer
        preconditions:
          - "All Disbursement rows in status SETTLED"
          - "If is_1031_exchange=true: Exchange1031 in CLOSED_DEFERRED or FAILED_TAXABLE"
        side_effects:
          - "EarnestMoneyDeposit auto-credited to seller (RELEASED_TO_SELLER) if status=HELD"
          - "AuditEvent appended"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /escrow-files/{id}/cancel"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "Cascade: EarnestMoneyDeposit disposes by cancel_reason (calc emd_disposition)"
          - "Cascade: TitleSearch in ORDERED → archived; TitleInsurancePolicy in QUOTED → VOIDED"
          - "AuditEvent appended"
      - from: CONTINGENT_TITLE
        to: CANCELLED
        trigger: "POST /escrow-files/{id}/cancel"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "Cascade: EMD disposes by cancel_reason"
          - "AuditEvent appended"
      - from: CONTINGENT_CD
        to: CANCELLED
        trigger: "POST /escrow-files/{id}/cancel"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "Cascade: EMD disposes by cancel_reason"
          - "AuditEvent appended"
      - from: CONTINGENT_WIRE
        to: CANCELLED
        trigger: "POST /escrow-files/{id}/cancel"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "Cascade: EMD disposes by cancel_reason"
          - "AuditEvent appended"

  - entity: EarnestMoneyDeposit
    initial_state: PENDING_FUNDS
    terminal_states: [RELEASED_TO_SELLER, RELEASED_TO_BUYER, SPLIT]
    transitions:
      - from: PENDING_FUNDS
        to: HELD
        trigger: "POST /earnest-money/{id}/fund"
        actor: EscrowOfficer
        preconditions: ["amount >= 0.01 * EscrowFile.purchase_price (ERR_EMD_BELOW_FLOOR)"]
        side_effects: ["AuditEvent appended"]
      - from: HELD
        to: RELEASED_TO_SELLER
        trigger: "Cascade from EscrowFile CLOSED, or POST /earnest-money/{id}/release with reason=BUYER_DEFAULT"
        actor: system
        preconditions: []
        side_effects:
          - "forfeited_amount := amount"
          - "AuditEvent appended"
      - from: HELD
        to: RELEASED_TO_BUYER
        trigger: "Cascade from EscrowFile CANCELLED with cancel_reason=SELLER_DEFAULT or TITLE_DEFECT, or POST /earnest-money/{id}/release with that reason"
        actor: system
        preconditions: []
        side_effects:
          - "refunded_amount := amount"
          - "AuditEvent appended"
      - from: HELD
        to: SPLIT
        trigger: "POST /earnest-money/{id}/release with reason=MUTUAL_RELEASE"
        actor: EscrowOfficer
        preconditions:
          - "split_buyer_share + split_seller_share == amount (exact equality required; ERR_EMD_SPLIT_INVARIANT)"
        side_effects:
          - "refunded_amount := split_buyer_share; forfeited_amount := split_seller_share"
          - "AuditEvent appended"

  - entity: TitleSearch
    initial_state: ORDERED
    terminal_states: [CLEARED, DEFECTIVE]
    transitions:
      - from: ORDERED
        to: COMPLETED
        trigger: "PATCH /title-searches/{id} (TitleOfficer submits findings)"
        actor: TitleOfficer
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: COMPLETED
        to: CLEARED
        trigger: "POST /title-searches/{id}/clear"
        actor: TitleOfficer
        preconditions:
          - "chain_of_title_clean = true"
          - "open_liens_total = 0"
        side_effects: ["AuditEvent appended"]
      - from: COMPLETED
        to: DEFECTIVE
        trigger: "POST /title-searches/{id}/mark-defective"
        actor: TitleOfficer
        preconditions: []
        side_effects:
          - "Any TitleInsurancePolicy on same escrow_file_id in QUOTED → VOIDED"
          - "AuditEvent appended"

  - entity: TitleInsurancePolicy
    initial_state: QUOTED
    terminal_states: [VOIDED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /title-policies/{id}/bind"
        actor: TitleOfficer
        preconditions:
          - "TitleSearch on same escrow_file_id in status CLEARED"
          - "If policy_kind=LENDERS: an OWNERS policy on same escrow_file_id is already in BOUND (ERR_LENDERS_REQUIRES_OWNERS)"
        side_effects: ["AuditEvent appended"]
      - from: QUOTED
        to: VOIDED
        trigger: "POST /title-policies/{id}/void or cascade from TitleSearch DEFECTIVE"
        actor: TitleOfficer
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: BOUND
        to: VOIDED
        trigger: "POST /title-policies/{id}/void"
        actor: TitleOfficer
        preconditions: ["EscrowFile.status IN {OPEN, CONTINGENT_TITLE, CONTINGENT_CD}"]
        side_effects: ["AuditEvent appended"]

  - entity: ClosingDisclosure
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /closing-disclosures/{id}/issue"
        actor: EscrowOfficer
        preconditions:
          - "EscrowFile.status IN {CONTINGENT_CD}"
          - "cash_to_close has been computed via calc cash_to_close"
        side_effects:
          - "issued_at := server_now"
          - "earliest_funding_at := issued_at + 3 business days (US federal holidays observed)"
          - "AuditEvent appended"
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /closing-disclosures/{id}/acknowledge (actor=Buyer)"
        actor: Buyer
        preconditions:
          - "X-User-ID matches EscrowFile.buyer_party_id"
        side_effects:
          - "buyer_acknowledged_at := server_now"
          - "AuditEvent appended"
      - from: ACKNOWLEDGED
        to: READY_TO_FUND
        trigger: "POST /closing-disclosures/{id}/promote (auto-evaluated; system can also fire on clock advance)"
        actor: system
        preconditions:
          - "server_now >= earliest_funding_at (3 business-day cooling-off complete; ERR_CD_WAITING_PERIOD)"
        side_effects: ["AuditEvent appended"]
      - from: ISSUED
        to: REVISED
        trigger: "POST /closing-disclosures/{id}/revise with triggering_change_kind"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "If triggering_change_kind IN {APR_DELTA_OVER_THRESHOLD, LOAN_PRODUCT_CHANGE, PREPAYMENT_PENALTY_ADDED}: clock will fully restart on next ISSUE"
          - "If triggering_change_kind = FEE_DELTA_UNDER_THRESHOLD: clock will NOT restart (earliest_funding_at preserved from prior issue)"
          - "AuditEvent appended"
      - from: ACKNOWLEDGED
        to: REVISED
        trigger: "POST /closing-disclosures/{id}/revise"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "buyer_acknowledged_at := null (acknowledgment invalidated)"
          - "If triggering_change_kind IN {APR_DELTA_OVER_THRESHOLD, LOAN_PRODUCT_CHANGE, PREPAYMENT_PENALTY_ADDED}: clock restarts on next ISSUE"
          - "AuditEvent appended"
      - from: REVISED
        to: ISSUED
        trigger: "POST /closing-disclosures/{id}/issue (re-issue after revision)"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "version_number := previous + 1"
          - "If prior REVISED set triggering_change_kind to a major change: issued_at := server_now AND earliest_funding_at := issued_at + 3 business days"
          - "If prior REVISED set triggering_change_kind = FEE_DELTA_UNDER_THRESHOLD: issued_at := server_now BUT earliest_funding_at preserved from the prior version"
          - "AuditEvent appended"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /closing-disclosures/{id}/void or cascade from EscrowFile CANCELLED"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: ISSUED
        to: VOIDED
        trigger: "Cascade from EscrowFile CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent appended"]

  - entity: WireInstruction
    initial_state: DRAFT
    terminal_states: [VOIDED, REJECTED_FRAUD_FLAG]
    transitions:
      - from: DRAFT
        to: PENDING_CONFIRMATION
        trigger: "POST /wire-instructions/{id}/submit"
        actor: EscrowOfficer
        preconditions:
          - "beneficiary_party_id resolves to a Party whose party_kind matches beneficiary_kind mapping (SELLER↔SELLER, LENDER_PAYOFF↔LENDER, QUALIFIED_INTERMEDIARY↔QUALIFIED_INTERMEDIARY, TAX_AUTHORITY↔(any party of kind TAX_AUTHORITY OR system))"
        side_effects: ["AuditEvent appended"]
      - from: PENDING_CONFIRMATION
        to: CONFIRMED
        trigger: "POST /wire-instructions/{id}/confirm-callback"
        actor: EscrowOfficer
        preconditions:
          - "Actor X-User-ID differs from CD issuer (segregation-of-duties; ERR_SOD_VIOLATION) — checked against the operator who triggered the latest ClosingDisclosure ISSUED transition"
          - "Request body includes callback_completed=true AND callback_channel ∈ {VOICE_VERIFIED, IN_PERSON_VERIFIED}"
        side_effects:
          - "confirmation_callback_at := server_now"
          - "confirmed_by_user_id := actor"
          - "AuditEvent appended"
      - from: PENDING_CONFIRMATION
        to: REJECTED_FRAUD_FLAG
        trigger: "POST /wire-instructions/{id}/flag-fraud"
        actor: EscrowOfficer
        preconditions: []
        side_effects:
          - "Cascade: any Disbursement on this wire in PROPOSED/APPROVED → REVERSED"
          - "AuditEvent appended"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /wire-instructions/{id}/void"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /wire-instructions/{id}/void"
        actor: EscrowOfficer
        preconditions:
          - "No Disbursement on this wire in status SENT or SETTLED (ERR_WIRE_LOCKED_BY_DISBURSEMENT)"
        side_effects: ["AuditEvent appended"]

  - entity: Disbursement
    initial_state: PROPOSED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /disbursements/{id}/approve"
        actor: DisbursementApprover
        preconditions:
          - "WireInstruction.status = CONFIRMED"
          - "EscrowFile.status = READY_TO_CLOSE (or CONTINGENT_WIRE if this is the final approval that will advance it)"
          - "Actor X-User-ID differs from CD issuer on same EscrowFile (segregation-of-duties; ERR_SOD_VIOLATION)"
        side_effects: ["AuditEvent appended"]
      - from: APPROVED
        to: SENT
        trigger: "POST /disbursements/{id}/send"
        actor: DisbursementApprover
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: SENT
        to: SETTLED
        trigger: "POST /disbursements/{id}/settle (back-office confirmation)"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: PROPOSED
        to: REVERSED
        trigger: "POST /disbursements/{id}/reverse or cascade from WireInstruction REJECTED_FRAUD_FLAG"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: APPROVED
        to: REVERSED
        trigger: "POST /disbursements/{id}/reverse or cascade from WireInstruction REJECTED_FRAUD_FLAG"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: SENT
        to: REVERSED
        trigger: "POST /disbursements/{id}/reverse (recall request before settlement)"
        actor: EscrowOfficer
        preconditions: []
        side_effects: ["AuditEvent appended"]

  - entity: Exchange1031
    initial_state: INITIATED
    terminal_states: [CLOSED_DEFERRED, FAILED_TAXABLE]
    transitions:
      - from: INITIATED
        to: IDENTIFIED
        trigger: "POST /exchanges/{id}/identify (taxpayer identifies replacement property)"
        actor: EscrowOfficer
        preconditions:
          - "server_now <= identification_deadline_at (45-day rule; ERR_1031_45DAY_LAPSED)"
        side_effects: ["AuditEvent appended"]
      - from: IDENTIFIED
        to: CLOSED_DEFERRED
        trigger: "POST /exchanges/{id}/close-deferred"
        actor: EscrowOfficer
        preconditions:
          - "server_now <= exchange_deadline_at (180-day rule; ERR_1031_180DAY_LAPSED)"
          - "Disbursement to QUALIFIED_INTERMEDIARY beneficiary in status SETTLED exists"
          - "Invariant: recognized_gain + deferred_gain == realized_gain (ERR_1031_GAIN_INVARIANT)"
        side_effects:
          - "AuditEvent appended"
      - from: INITIATED
        to: FAILED_TAXABLE
        trigger: "POST /exchanges/{id}/fail or system on clock advance past identification_deadline_at"
        actor: system
        preconditions: []
        side_effects:
          - "recognized_gain := realized_gain (entire gain becomes taxable)"
          - "deferred_gain := 0"
          - "AuditEvent appended"
      - from: IDENTIFIED
        to: FAILED_TAXABLE
        trigger: "POST /exchanges/{id}/fail or system on clock advance past exchange_deadline_at"
        actor: system
        preconditions: []
        side_effects:
          - "recognized_gain := realized_gain"
          - "deferred_gain := 0"
          - "AuditEvent appended"

# =============================================================================
# Section 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two operators simultaneously fund the same EarnestMoneyDeposit"
    guarantee: "At most one transition PENDING_FUNDS→HELD succeeds; the loser sees ERR_INVALID_STATE because the row has already advanced"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on EarnestMoneyDeposit.status"

  - scenario: "Two operators simultaneously revise an ISSUED ClosingDisclosure (one major-change, one fee-only)"
    guarantee: "Exactly one revise succeeds; the loser's PATCH/state transition is rejected because version no longer matches"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    serialization: "First-writer-wins on ClosingDisclosure.version (OCC); the survivor's triggering_change_kind determines whether earliest_funding_at restarts"

  - scenario: "Two operators simultaneously confirm a WireInstruction callback; both pass non-SoD preconditions individually but only one is the CD issuer's non-conflict peer"
    guarantee: "Exactly one CONFIRMED transition succeeds; loser is rejected because row already CONFIRMED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on WireInstruction.status"

  - scenario: "Same operator who issued the CD attempts to confirm a WireInstruction in parallel with another operator"
    guarantee: "The SoD-violating actor's request is rejected even if it arrives first"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    serialization: "Per-request actor identity check; serialization not relevant because the loser fails authorization, not OCC"

  - scenario: "EscrowFile cancel and EscrowFile close fired concurrently on a READY_TO_CLOSE file"
    guarantee: "Exactly one terminal transition succeeds; loser sees ERR_INVALID_STATE because the file already reached a terminal state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on EscrowFile.status"

  - scenario: "Two Disbursement.approve calls on the same proposed Disbursement"
    guarantee: "Exactly one APPROVED transition succeeds; loser sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Disbursement.status"

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: title_insurance_premium
    trigger: "Computed when a TitleInsurancePolicy row is created (POST /title-policies) and frozen on BIND"
    algorithm: tiered_pricing
    input_set: "Single TitleInsurancePolicy row; tiering is on insured_amount; simultaneous-issue discount applies only when policy_kind=LENDERS AND simultaneous_issue=true AND a peer OWNERS policy on the same escrow_file_id is already in BOUND at creation time"
    formula: |
      tiered_base(insured_amount):
        thousands = insured_amount / 1000  (decimal, exact)
        t1_thousands = min(thousands, 100.0)
        t2_thousands = min(max(thousands - 100.0, 0.0), 400.0)        # span (100, 500]
        t3_thousands = max(thousands - 500.0, 0.0)
        base = t1_thousands * TIER1_RATE + t2_thousands * TIER2_RATE + t3_thousands * TIER3_RATE

      if policy_kind == OWNERS:
        premium = max(round_half_up(base, 2), OWNERS_MIN_PREMIUM)

      else if policy_kind == LENDERS:
        if simultaneous_issue == true:
          premium = max(round_half_up(base * SIMULTANEOUS_DISCOUNT_FACTOR, 2),
                        LENDERS_MIN_PREMIUM)
        else:
          premium = max(round_half_up(base, 2), LENDERS_MIN_PREMIUM)
    constants:
      TIER1_RATE: 5.00                  # $5 per $1,000 on the first $100,000
      TIER2_RATE: 4.00                  # $4 per $1,000 from $100,001 to $500,000
      TIER3_RATE: 3.00                  # $3 per $1,000 above $500,000
      OWNERS_MIN_PREMIUM: 300.00
      LENDERS_MIN_PREMIUM: 200.00
      SIMULTANEOUS_DISCOUNT_FACTOR: 0.40
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: cash_to_close
    trigger: "Computed at POST /closing-disclosures (DRAFT creation) and re-frozen on every REVISED→ISSUED transition"
    algorithm: aggregation
    input_set: |
      Inputs are pulled from EscrowFile (purchase_price, loan_amount), Property
      (tax_annual, hoa_annual_dues), and from the ClosingDisclosure row itself
      (total_loan_costs, seller_credits, seller_days_owned). EMD credit equals
      the sum of EarnestMoneyDeposit.amount for EMDs on this escrow_file_id
      whose status is HELD at the moment the calculation fires; EMDs in
      PENDING_FUNDS, RELEASED_TO_*, or SPLIT are excluded.
    formula: |
      # Step 1: pro-rate each line item to cents independently (rounding-order-pinned: per-item then sum)
      tax_credit_raw   = (Property.tax_annual       * seller_days_owned) / 365.0
      hoa_credit_raw   = (Property.hoa_annual_dues  * seller_days_owned) / 365.0
      prorated_tax_credit = round_half_up(tax_credit_raw, 2)        # PIN: round before summing
      prorated_hoa_credit = round_half_up(hoa_credit_raw, 2)

      # Step 2: EMD credit
      emd_credited = sum(EMD.amount where EMD.escrow_file_id = this.escrow_file_id AND EMD.status = HELD)

      # Step 3: combine (each summand already at 2dp; final sum is exact in cents)
      cash_to_close = (purchase_price
                      - loan_amount
                      - emd_credited
                      - seller_credits
                      - prorated_tax_credit
                      - prorated_hoa_credit
                      + total_loan_costs)
    constants:
      YEAR_BASIS_DAYS: 365              # 365-day proration; leap year ignored by design
    precision: "2 decimal places, round_half_up; ROUND-ORDER PIN: per-line-item first, then sum"
    variants: []

  - name: emd_disposition
    trigger: "EscrowFile CANCELLED, or POST /earnest-money/{id}/release"
    algorithm: forward_looking
    input_set: "EarnestMoneyDeposit in HELD for this escrow_file_id"
    formula: |
      # Two valid algorithms on the same EMD row produce different disposition.
      # The scaffold pins ONE: the variant chosen is dictated by the cancel_reason
      # supplied at the cancel/release call.

      # Variant A — BUYER_DEFAULT (default branch when escrow cancels because
      # buyer failed a contingency they controlled, e.g. financing waiver, or
      # buyer walked away after the inspection period closed):
      #   forfeited_amount := EMD.amount
      #   refunded_amount  := 0
      #   target_status    := RELEASED_TO_SELLER

      # Variant B — SELLER_DEFAULT / TITLE_DEFECT (cancel because seller failed
      # to deliver clear title or violated CC&R disclosure obligations):
      #   forfeited_amount := 0
      #   refunded_amount  := EMD.amount
      #   target_status    := RELEASED_TO_BUYER

      # Variant C — MUTUAL_RELEASE (parties agree to a split):
      #   forfeited_amount := split_seller_share
      #   refunded_amount  := split_buyer_share
      #   target_status    := SPLIT
      #   invariant: split_buyer_share + split_seller_share == EMD.amount  (else ERR_EMD_SPLIT_INVARIANT)

      # COMPENSATING-INVARIANT: at any time,
      #   EMD.amount == forfeited_amount + refunded_amount   (once not in PENDING_FUNDS/HELD)
      # and the global pool over all EMDs is conserved.
    constants: {}
    precision: "2 decimal places exact (no rounding; cents conserved)"
    variants:
      - name: buyer_default
        when: "cancel_reason = BUYER_DEFAULT"
        difference: "Forfeits to seller; refunded_amount = 0; status RELEASED_TO_SELLER"
      - name: seller_default
        when: "cancel_reason IN {SELLER_DEFAULT, TITLE_DEFECT}"
        difference: "Refunds to buyer; forfeited_amount = 0; status RELEASED_TO_BUYER"
      - name: mutual_split
        when: "cancel_reason = MUTUAL_RELEASE"
        difference: "Splits per supplied shares; requires shares sum to amount exactly"

  - name: section_1031_gain
    trigger: "Computed on Exchange1031 creation and re-frozen on each state transition"
    algorithm: threshold
    input_set: "Single Exchange1031 row"
    formula: |
      realized_gain   = round_half_up(relinquished_sale_price - relinquished_basis, 2)
      boot_total      = round_half_up(cash_boot_received + mortgage_relief, 2)

      # Variant A — successful deferral (status will reach CLOSED_DEFERRED):
      recognized_gain = min(realized_gain, boot_total)            # taxable boot
      deferred_gain   = realized_gain - recognized_gain           # carried into replacement basis

      # Variant B — failed exchange (status reaches FAILED_TAXABLE because
      # 45-day or 180-day deadline lapsed):
      recognized_gain = realized_gain                             # entire gain recognized
      deferred_gain   = 0

      # COMPENSATING-INVARIANT (both variants):
      #   recognized_gain + deferred_gain == realized_gain
      # The §1.4 validation ERR_1031_GAIN_INVARIANT enforces this on every read.
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: deferred_success
        when: "Exchange1031 reaches CLOSED_DEFERRED on time"
        difference: "recognized_gain = min(realized_gain, boot_total); the rest defers"
      - name: failed_taxable
        when: "Exchange1031 reaches FAILED_TAXABLE via 45- or 180-day lapse"
        difference: "recognized_gain = realized_gain; deferred_gain = 0"

  - name: cd_business_day_clock
    trigger: "ClosingDisclosure ISSUED transition AND every REVISED→ISSUED re-issue"
    algorithm: threshold
    input_set: "Single ClosingDisclosure row; uses server clock and US federal holiday set"
    formula: |
      # Business-day arithmetic: a "business day" is Mon–Sat (per CFPB Regulation Z
      # §1026.19(f) — Saturdays count as business days for the rescission/cooling-off
      # window) MINUS US federal holidays.
      US_FEDERAL_HOLIDAYS = { New Year's Day (Jan 1), MLK Day (3rd Mon Jan),
        Washington's Birthday (3rd Mon Feb), Memorial Day (last Mon May),
        Juneteenth (Jun 19), Independence Day (Jul 4), Labor Day (1st Mon Sep),
        Columbus Day (2nd Mon Oct), Veterans Day (Nov 11), Thanksgiving (4th Thu Nov),
        Christmas Day (Dec 25) }
      observed_holiday(date) = if holiday falls on Sunday, observed Monday; else the holiday date itself

      def is_business_day(d):
        return d.weekday() != SUNDAY and d not in observed_holiday set

      # Issuance: count starts on the day AFTER issued_at
      def add_3_business_days(issued_at):
        d = issued_at.date() + 1 day
        counted = 0
        while counted < 3:
          if is_business_day(d): counted += 1; if counted == 3: return d at 00:00 UTC
          d += 1 day

      earliest_funding_at = add_3_business_days(issued_at)

      # Revision rules:
      # - If triggering_change_kind ∈ {APR_DELTA_OVER_THRESHOLD, LOAN_PRODUCT_CHANGE,
      #     PREPAYMENT_PENALTY_ADDED}: earliest_funding_at FULLY RESTARTS at re-issue
      # - If triggering_change_kind = FEE_DELTA_UNDER_THRESHOLD: earliest_funding_at
      #     is PRESERVED from the prior issued version (clock continues; no restart)
    constants:
      WAITING_PERIOD_BUSINESS_DAYS: 3
    precision: "Whole-day; comparison is server_now >= earliest_funding_at"
    variants:
      - name: major_change_restart
        when: "Revision flagged with a major-change triggering_change_kind"
        difference: "earliest_funding_at restarts from new issued_at"
      - name: fee_only_continue
        when: "Revision flagged FEE_DELTA_UNDER_THRESHOLD"
        difference: "earliest_funding_at is carried over unchanged"

# =============================================================================
# Table 4: Validation Rules (§1.4) — ordered by priority
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is one of the known roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-id and body-FK references resolve to existing entities, evaluated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Foreign-key party_kind agreement: WireInstruction.beneficiary_party_id must reference a Party whose party_kind matches beneficiary_kind"
    error_id: ERR_BENEFICIARY_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /wire-instructions, PATCH /wire-instructions/{id}"

  - priority: 5
    category: state
    check: "Target entity is in a from-state permitted by §1.2 for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All state-transition endpoints"

  - priority: 6
    category: state
    check: "Cross-entity state precondition: ClosingDisclosure issue requires EscrowFile.status=CONTINGENT_CD; Exchange1031.close-deferred requires its Disbursement to QI in SETTLED"
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "POST /closing-disclosures/{id}/issue, POST /exchanges/{id}/close-deferred, POST /escrow-files/{id}/advance"

  - priority: 7
    category: business_safety
    check: "Wire fraud Segregation-of-Duties: the actor confirming a WireInstruction OR approving a Disbursement must NOT be the operator who triggered the latest ClosingDisclosure ISSUED transition on the same escrow_file_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /wire-instructions/{id}/confirm-callback, POST /disbursements/{id}/approve"

  - priority: 8
    category: business_safety
    check: "Out-of-band callback channel must be VOICE_VERIFIED or IN_PERSON_VERIFIED; callback_completed must be true"
    error_id: ERR_WIRE_CALLBACK_MISSING
    http_status: 422
    applies_to: "POST /wire-instructions/{id}/confirm-callback"

  - priority: 9
    category: business_temporal
    check: "ClosingDisclosure 3-business-day cooling-off: server_now >= earliest_funding_at"
    error_id: ERR_CD_WAITING_PERIOD
    http_status: 409
    applies_to: "POST /closing-disclosures/{id}/promote, POST /escrow-files/{id}/advance (when target=CONTINGENT_WIRE)"

  - priority: 10
    category: business_temporal
    check: "§1031 45-day identification deadline: server_now <= identification_deadline_at"
    error_id: ERR_1031_45DAY_LAPSED
    http_status: 409
    applies_to: "POST /exchanges/{id}/identify"

  - priority: 11
    category: business_temporal
    check: "§1031 180-day exchange deadline: server_now <= exchange_deadline_at"
    error_id: ERR_1031_180DAY_LAPSED
    http_status: 409
    applies_to: "POST /exchanges/{id}/close-deferred"

  - priority: 12
    category: business_referential
    check: "TitleInsurancePolicy with policy_kind=LENDERS requires an OWNERS policy on the same escrow_file_id in status BOUND at the moment of bind"
    error_id: ERR_LENDERS_REQUIRES_OWNERS
    http_status: 409
    applies_to: "POST /title-policies/{id}/bind"

  - priority: 13
    category: business_referential
    check: "TitleSearch must be CLEARED before any policy on same escrow_file_id binds"
    error_id: ERR_TITLE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /title-policies/{id}/bind"

  - priority: 14
    category: business_constraint
    check: "EMD floor: amount >= 0.01 * EscrowFile.purchase_price (use >= — exactly 1% allowed)"
    error_id: ERR_EMD_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /earnest-money, PATCH /earnest-money/{id}, POST /earnest-money/{id}/fund"

  - priority: 15
    category: business_constraint
    check: "MUTUAL_RELEASE split invariant: split_buyer_share + split_seller_share == EMD.amount (exact equality, no rounding tolerance)"
    error_id: ERR_EMD_SPLIT_INVARIANT
    http_status: 422
    applies_to: "POST /earnest-money/{id}/release (when reason=MUTUAL_RELEASE)"

  - priority: 16
    category: business_constraint
    check: "§1031 gain invariant: recognized_gain + deferred_gain == realized_gain on every Exchange1031 read; checked again on close-deferred"
    error_id: ERR_1031_GAIN_INVARIANT
    http_status: 422
    applies_to: "POST /exchanges/{id}/close-deferred, GET /exchanges/{id}"

  - priority: 17
    category: business_constraint
    check: "CCRDisclosure must be acknowledged before EscrowFile can advance past CONTINGENT_TITLE"
    error_id: ERR_CCR_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /escrow-files/{id}/advance"

  - priority: 18
    category: business_fiscal
    check: "Total Disbursement.amount across SETTLED+SENT+APPROVED must not exceed escrow pool (sum of all EMDs in HELD + EscrowFile.loan_amount + buyer cash-to-close); the residual after seller, lender payoff, QI, and tax payments must be zero"
    error_id: ERR_DISBURSEMENT_OVERDRAW
    http_status: 422
    applies_to: "POST /disbursements, POST /disbursements/{id}/approve"

  - priority: 19
    category: business_constraint
    check: "Idempotency-Key header required on every POST and state-change endpoint; replay with mismatched body rejected"
    error_id: ERR_IDEMPOTENCY_REPLAY_MISMATCH
    http_status: 409
    applies_to: "All POST and state-transition endpoints"

  - priority: 20
    category: state
    check: "Optimistic concurrency: when request includes version, it must equal the row's current version"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "All PATCH and state-transition endpoints"

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # ---- Parties ----
  - method: POST
    path: "/parties"
    description: "Create a Party (buyer, seller, lender, qualified intermediary)"
    roles: [EscrowOfficer]
    code: 201
    input: [full_name, party_kind, contact_email]
    output: Party
    side_effects: []

  - method: GET
    path: "/parties/{partyId}"
    description: "Read a Party"
    roles: [EscrowOfficer, TitleOfficer, DisbursementApprover, Buyer, Seller]
    code: 200
    input: []
    output: Party
    side_effects: []

  # ---- Properties ----
  - method: POST
    path: "/properties"
    description: "Create a Property"
    roles: [EscrowOfficer]
    code: 201
    input: [street_address, parcel_id, hoa_annual_dues, tax_annual]
    output: Property
    side_effects: []

  - method: GET
    path: "/properties/{propertyId}"
    description: "Read a Property"
    roles: [EscrowOfficer, TitleOfficer, Buyer, Seller]
    code: 200
    input: []
    output: Property
    side_effects: []

  # ---- EscrowFile ----
  - method: POST
    path: "/escrow-files"
    description: "Open an escrow file"
    roles: [EscrowOfficer]
    code: 201
    input: [property_id, buyer_party_id, seller_party_id, "lender_party_id?", "qi_party_id?", purchase_price, "loan_amount?", closing_date_planned, "is_1031_exchange?"]
    output: EscrowFile
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/escrow-files/{escrowFileId}"
    description: "Read an escrow file"
    roles: [EscrowOfficer, TitleOfficer, DisbursementApprover, Buyer, Seller]
    code: 200
    input: []
    output: EscrowFile
    side_effects: []

  - method: GET
    path: "/escrow-files"
    description: "List escrow files (filter by status, buyer_party_id, seller_party_id; pagination)"
    roles: [EscrowOfficer, TitleOfficer, DisbursementApprover]
    code: 200
    input: ["status?", "buyer_party_id?", "seller_party_id?", "limit?", "offset?"]
    output: "EscrowFile[]"
    side_effects: []

  - method: POST
    path: "/escrow-files/{escrowFileId}/advance"
    description: "Evaluate next-state transitions and advance the escrow file if preconditions met"
    roles: [EscrowOfficer]
    code: 200
    input: []
    output: EscrowFile
    side_effects: ["Status advances per §1.2 EscrowFile state machine; can chain CONTINGENT_*→ next state if all preconditions met"]

  - method: POST
    path: "/escrow-files/{escrowFileId}/close"
    description: "Close the escrow file (READY_TO_CLOSE → CLOSED)"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: EscrowFile
    side_effects: ["Cascade EMD HELD→RELEASED_TO_SELLER if not already disposed"]

  - method: POST
    path: "/escrow-files/{escrowFileId}/cancel"
    description: "Cancel the escrow file with a reason"
    roles: [EscrowOfficer]
    code: 200
    input: [cancel_reason, version]
    output: EscrowFile
    side_effects: ["Cascade per §1.2: EMD disposes by cancel_reason; QUOTED title policies VOIDED; ORDERED title search archived"]

  # ---- EarnestMoneyDeposit ----
  - method: POST
    path: "/earnest-money"
    description: "Create an EMD record (status PENDING_FUNDS)"
    roles: [EscrowOfficer]
    code: 201
    input: [escrow_file_id, amount]
    output: EarnestMoneyDeposit
    side_effects: []

  - method: GET
    path: "/earnest-money/{emdId}"
    description: "Read an EMD"
    roles: [EscrowOfficer, Buyer, Seller]
    code: 200
    input: []
    output: EarnestMoneyDeposit
    side_effects: []

  - method: POST
    path: "/earnest-money/{emdId}/fund"
    description: "Mark EMD funded (PENDING_FUNDS → HELD)"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: EarnestMoneyDeposit
    side_effects: ["status=HELD"]

  - method: POST
    path: "/earnest-money/{emdId}/release"
    description: "Release EMD per cancel_reason (HELD → RELEASED_TO_SELLER | RELEASED_TO_BUYER | SPLIT)"
    roles: [EscrowOfficer]
    code: 200
    input: [reason, "split_buyer_share?", "split_seller_share?", version]
    output: EarnestMoneyDeposit
    side_effects: ["Per calc emd_disposition"]

  # ---- TitleSearch ----
  - method: POST
    path: "/title-searches"
    description: "Order a title search"
    roles: [EscrowOfficer, TitleOfficer]
    code: 201
    input: [escrow_file_id]
    output: TitleSearch
    side_effects: ["status=ORDERED"]

  - method: PATCH
    path: "/title-searches/{titleSearchId}"
    description: "Submit findings (ORDERED → COMPLETED)"
    roles: [TitleOfficer]
    code: 200
    input: [chain_of_title_clean, open_liens_total, encumbrance_count, version]
    output: TitleSearch
    side_effects: ["status=COMPLETED"]

  - method: POST
    path: "/title-searches/{titleSearchId}/clear"
    description: "Mark a completed title search CLEARED"
    roles: [TitleOfficer]
    code: 200
    input: [version]
    output: TitleSearch
    side_effects: ["status=CLEARED"]

  - method: POST
    path: "/title-searches/{titleSearchId}/mark-defective"
    description: "Mark a completed title search DEFECTIVE; cascades VOIDED to QUOTED policies"
    roles: [TitleOfficer]
    code: 200
    input: [version]
    output: TitleSearch
    side_effects: ["Any QUOTED TitleInsurancePolicy on same escrow_file_id → VOIDED"]

  - method: GET
    path: "/title-searches/{titleSearchId}"
    description: "Read a title search"
    roles: [EscrowOfficer, TitleOfficer, Buyer, Seller]
    code: 200
    input: []
    output: TitleSearch
    side_effects: []

  # ---- TitleInsurancePolicy ----
  - method: POST
    path: "/title-policies"
    description: "Quote a title insurance policy (premium computed)"
    roles: [TitleOfficer]
    code: 201
    input: [escrow_file_id, policy_kind, insured_amount, "simultaneous_issue?"]
    output: TitleInsurancePolicy
    side_effects: ["premium := calc title_insurance_premium; status=QUOTED"]

  - method: GET
    path: "/title-policies/{policyId}"
    description: "Read a title policy"
    roles: [EscrowOfficer, TitleOfficer, Buyer, Seller]
    code: 200
    input: []
    output: TitleInsurancePolicy
    side_effects: []

  - method: POST
    path: "/title-policies/{policyId}/bind"
    description: "Bind a quoted policy"
    roles: [TitleOfficer]
    code: 200
    input: [version]
    output: TitleInsurancePolicy
    side_effects: ["status=BOUND"]

  - method: POST
    path: "/title-policies/{policyId}/void"
    description: "Void a quoted or bound policy"
    roles: [TitleOfficer]
    code: 200
    input: [version]
    output: TitleInsurancePolicy
    side_effects: ["status=VOIDED"]

  # ---- CCRDisclosure ----
  - method: POST
    path: "/ccr-disclosures"
    description: "Record buyer acknowledgment of CC&R disclosure (immutable, append-only)"
    roles: [Buyer]
    code: 201
    input: [escrow_file_id, ccr_document_hash, material_restrictions]
    output: CCRDisclosure
    side_effects: ["buyer_acknowledged_at := server_now"]

  - method: GET
    path: "/ccr-disclosures/{ccrId}"
    description: "Read a CC&R disclosure record"
    roles: [EscrowOfficer, Buyer, Seller, TitleOfficer]
    code: 200
    input: []
    output: CCRDisclosure
    side_effects: []

  # ---- ClosingDisclosure ----
  - method: POST
    path: "/closing-disclosures"
    description: "Create a CD draft for an escrow file (version 1)"
    roles: [EscrowOfficer]
    code: 201
    input: [escrow_file_id, total_loan_costs, seller_credits, seller_days_owned]
    output: ClosingDisclosure
    side_effects: ["status=DRAFT; cash_to_close := calc cash_to_close; version_number=1"]

  - method: GET
    path: "/closing-disclosures/{cdId}"
    description: "Read a closing disclosure"
    roles: [EscrowOfficer, Buyer, Seller]
    code: 200
    input: []
    output: ClosingDisclosure
    side_effects: []

  - method: POST
    path: "/closing-disclosures/{cdId}/issue"
    description: "Issue the CD (DRAFT → ISSUED, or REVISED → ISSUED at next version)"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: ClosingDisclosure
    side_effects: ["issued_at := server_now; earliest_funding_at := per calc cd_business_day_clock"]

  - method: POST
    path: "/closing-disclosures/{cdId}/acknowledge"
    description: "Buyer acknowledges receipt of the issued CD"
    roles: [Buyer]
    code: 200
    input: [version]
    output: ClosingDisclosure
    side_effects: ["buyer_acknowledged_at := server_now"]

  - method: POST
    path: "/closing-disclosures/{cdId}/promote"
    description: "Promote ACKNOWLEDGED CD to READY_TO_FUND once cooling-off complete"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: ClosingDisclosure
    side_effects: ["status=READY_TO_FUND"]

  - method: POST
    path: "/closing-disclosures/{cdId}/revise"
    description: "Revise an ISSUED or ACKNOWLEDGED CD with a reason; restart-or-preserve clock per reason"
    roles: [EscrowOfficer]
    code: 200
    input: [triggering_change_kind, "total_loan_costs?", "seller_credits?", "seller_days_owned?", version]
    output: ClosingDisclosure
    side_effects: ["status=REVISED; buyer_acknowledged_at cleared; cash_to_close recomputed at next issue"]

  - method: POST
    path: "/closing-disclosures/{cdId}/void"
    description: "Void a CD draft or cascade target"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: ClosingDisclosure
    side_effects: ["status=VOIDED"]

  # ---- WireInstruction ----
  - method: POST
    path: "/wire-instructions"
    description: "Create a wire instruction (DRAFT)"
    roles: [EscrowOfficer]
    code: 201
    input: [escrow_file_id, beneficiary_kind, beneficiary_party_id, routing_number, account_number_last4]
    output: WireInstruction
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/wire-instructions/{wireId}"
    description: "Read a wire instruction"
    roles: [EscrowOfficer, DisbursementApprover]
    code: 200
    input: []
    output: WireInstruction
    side_effects: []

  - method: POST
    path: "/wire-instructions/{wireId}/submit"
    description: "Submit a DRAFT wire (DRAFT → PENDING_CONFIRMATION)"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: WireInstruction
    side_effects: ["status=PENDING_CONFIRMATION"]

  - method: POST
    path: "/wire-instructions/{wireId}/confirm-callback"
    description: "Confirm out-of-band callback (PENDING_CONFIRMATION → CONFIRMED); enforces SoD"
    roles: [EscrowOfficer, DisbursementApprover]
    code: 200
    input: [callback_completed, callback_channel, version]
    output: WireInstruction
    side_effects: ["status=CONFIRMED; confirmed_by_user_id := actor"]

  - method: POST
    path: "/wire-instructions/{wireId}/flag-fraud"
    description: "Flag a suspect wire (PENDING_CONFIRMATION → REJECTED_FRAUD_FLAG); cascades REVERSED to dependent disbursements"
    roles: [EscrowOfficer, DisbursementApprover]
    code: 200
    input: [version]
    output: WireInstruction
    side_effects: ["status=REJECTED_FRAUD_FLAG; cascade Disbursement PROPOSED/APPROVED → REVERSED"]

  - method: POST
    path: "/wire-instructions/{wireId}/void"
    description: "Void a wire (DRAFT or CONFIRMED with no active disbursement)"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: WireInstruction
    side_effects: ["status=VOIDED"]

  # ---- Disbursement ----
  - method: POST
    path: "/disbursements"
    description: "Propose a disbursement against a confirmed wire (PROPOSED)"
    roles: [EscrowOfficer]
    code: 201
    input: [escrow_file_id, wire_instruction_id, amount]
    output: Disbursement
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/disbursements/{disbId}"
    description: "Read a disbursement"
    roles: [EscrowOfficer, DisbursementApprover]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: POST
    path: "/disbursements/{disbId}/approve"
    description: "Approve a proposed disbursement (PROPOSED → APPROVED); enforces SoD"
    roles: [DisbursementApprover]
    code: 200
    input: [version]
    output: Disbursement
    side_effects: ["status=APPROVED; approved_by_user_id := actor"]

  - method: POST
    path: "/disbursements/{disbId}/send"
    description: "Send an approved disbursement (APPROVED → SENT)"
    roles: [DisbursementApprover]
    code: 200
    input: [version]
    output: Disbursement
    side_effects: ["status=SENT"]

  - method: POST
    path: "/disbursements/{disbId}/settle"
    description: "Mark a sent disbursement settled (SENT → SETTLED) once bank confirms"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: Disbursement
    side_effects: ["status=SETTLED"]

  - method: POST
    path: "/disbursements/{disbId}/reverse"
    description: "Reverse a disbursement from PROPOSED/APPROVED/SENT"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: Disbursement
    side_effects: ["status=REVERSED"]

  # ---- Exchange1031 ----
  - method: POST
    path: "/exchanges"
    description: "Initiate a §1031 exchange tied to an escrow file"
    roles: [EscrowOfficer]
    code: 201
    input: [escrow_file_id, relinquished_basis, relinquished_sale_price, "cash_boot_received?", "mortgage_relief?"]
    output: Exchange1031
    side_effects: ["calc section_1031_gain frozen on row; identification_deadline_at := closing_date_planned + 45 days; exchange_deadline_at := closing_date_planned + 180 days; status=INITIATED"]

  - method: GET
    path: "/exchanges/{exchangeId}"
    description: "Read an exchange"
    roles: [EscrowOfficer, Buyer, Seller]
    code: 200
    input: []
    output: Exchange1031
    side_effects: []

  - method: POST
    path: "/exchanges/{exchangeId}/identify"
    description: "Taxpayer identifies replacement property (INITIATED → IDENTIFIED); enforces 45-day rule"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: Exchange1031
    side_effects: ["status=IDENTIFIED"]

  - method: POST
    path: "/exchanges/{exchangeId}/close-deferred"
    description: "Close as deferred (IDENTIFIED → CLOSED_DEFERRED); enforces 180-day rule and invariant"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: Exchange1031
    side_effects: ["status=CLOSED_DEFERRED"]

  - method: POST
    path: "/exchanges/{exchangeId}/fail"
    description: "Mark exchange failed (recognized_gain := realized_gain; deferred_gain := 0)"
    roles: [EscrowOfficer]
    code: 200
    input: [version]
    output: Exchange1031
    side_effects: ["status=FAILED_TAXABLE; recognized_gain := realized_gain; deferred_gain := 0"]

  # ---- AuditEvent ----
  - method: GET
    path: "/escrow-files/{escrowFileId}/audit-events"
    description: "List audit events for an escrow file (read-only; ordered by created_at asc)"
    roles: [EscrowOfficer, DisbursementApprover, TitleOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # ---- Test-driving endpoints ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance server clock to a specified ISO 8601 UTC instant (test-only; required to exercise CD 3-business-day rule, §1031 45-day and 180-day deadlines)"
    roles: [EscrowOfficer]
    code: 200
    input: [to]
    output: "object: { now: ISO8601 }"
    side_effects: ["Triggers system-actor sweeps: Exchange1031 INITIATED→FAILED_TAXABLE past 45d; IDENTIFIED→FAILED_TAXABLE past 180d"]

  - method: POST
    path: "/_clock/now"
    description: "Read current server clock"
    roles: [EscrowOfficer, TitleOfficer, DisbursementApprover, Buyer, Seller]
    code: 200
    input: []
    output: "object: { now: ISO8601 }"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,            http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE,             http: 403, condition: "Role not permitted for this endpoint per §1.7 RBAC" }
  - { id: ERR_NOT_FOUND,                  http: 404, condition: "Path or body reference does not resolve" }
  - { id: ERR_BENEFICIARY_KIND_MISMATCH,  http: 422, condition: "WireInstruction.beneficiary_party_id has party_kind incompatible with beneficiary_kind" }
  - { id: ERR_INVALID_STATE,              http: 409, condition: "Entity not in required from-state for transition" }
  - { id: ERR_CROSS_ENTITY_STATE,         http: 409, condition: "Cross-entity precondition unsatisfied (e.g., EscrowFile not CONTINGENT_CD; QI Disbursement not SETTLED; CC&R not acknowledged)" }
  - { id: ERR_SOD_VIOLATION,              http: 403, condition: "Same operator who issued the latest CD is attempting to confirm a wire or approve a disbursement on the same escrow_file_id" }
  - { id: ERR_WIRE_CALLBACK_MISSING,      http: 422, condition: "callback_completed not true or callback_channel not in {VOICE_VERIFIED, IN_PERSON_VERIFIED}" }
  - { id: ERR_CD_WAITING_PERIOD,          http: 409, condition: "ClosingDisclosure has not aged 3 business days since latest qualifying issuance" }
  - { id: ERR_1031_45DAY_LAPSED,          http: 409, condition: "§1031 identification deadline (issue + 45 days) has passed" }
  - { id: ERR_1031_180DAY_LAPSED,         http: 409, condition: "§1031 exchange deadline (issue + 180 days) has passed" }
  - { id: ERR_1031_GAIN_INVARIANT,        http: 422, condition: "recognized_gain + deferred_gain != realized_gain on an Exchange1031 row" }
  - { id: ERR_LENDERS_REQUIRES_OWNERS,    http: 409, condition: "Attempted to bind a LENDERS policy with no BOUND OWNERS policy on the same escrow_file_id" }
  - { id: ERR_TITLE_NOT_CLEARED,          http: 409, condition: "Title search not CLEARED at policy bind time" }
  - { id: ERR_EMD_BELOW_FLOOR,            http: 422, condition: "EMD.amount < 0.01 * EscrowFile.purchase_price" }
  - { id: ERR_EMD_SPLIT_INVARIANT,        http: 422, condition: "split_buyer_share + split_seller_share != EMD.amount on a MUTUAL_RELEASE" }
  - { id: ERR_CCR_NOT_ACKNOWLEDGED,       http: 409, condition: "CCRDisclosure missing for escrow file when advancing past CONTINGENT_TITLE" }
  - { id: ERR_DISBURSEMENT_OVERDRAW,      http: 422, condition: "Sum of disbursements would exceed escrow pool" }
  - { id: ERR_IDEMPOTENCY_REPLAY_MISMATCH, http: 409, condition: "Same Idempotency-Key, different body" }
  - { id: ERR_VERSION_MISMATCH,           http: 409, condition: "version supplied does not match current row version" }
  - { id: ERR_WIRE_LOCKED_BY_DISBURSEMENT, http: 409, condition: "Attempt to void a CONFIRMED wire with active Disbursement (SENT or SETTLED)" }
  - { id: ERR_BAD_REQUEST,                http: 400, condition: "General malformed request (missing field, bad type, out-of-range numeric)" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: EscrowOfficer
    description: "Neutral third-party escrow agent who manages the file lifecycle, issues CDs, submits wires, settles disbursements, runs the closing"
    identity: opaque
    exclusive_operations:
      - "POST /escrow-files (open file)"
      - "POST /escrow-files/{id}/advance"
      - "POST /escrow-files/{id}/close"
      - "POST /escrow-files/{id}/cancel"
      - "POST /earnest-money + /fund + /release"
      - "POST /closing-disclosures (create draft)"
      - "POST /closing-disclosures/{id}/issue"
      - "POST /closing-disclosures/{id}/promote"
      - "POST /closing-disclosures/{id}/revise"
      - "POST /closing-disclosures/{id}/void"
      - "POST /wire-instructions (create + submit + void)"
      - "POST /disbursements (propose)"
      - "POST /disbursements/{id}/settle"
      - "POST /disbursements/{id}/reverse"
      - "POST /exchanges + /identify + /close-deferred + /fail"
      - "POST /_clock/advance"
    shared_operations:
      - "POST /title-searches (peer with TitleOfficer)"
      - "POST /wire-instructions/{id}/confirm-callback (peer with DisbursementApprover; subject to SoD)"
      - "POST /wire-instructions/{id}/flag-fraud (peer with DisbursementApprover)"
      - "GET endpoints (read access)"

  - name: TitleOfficer
    description: "Third-party title insurance underwriter responsible for title search findings, policy quotes, and binding"
    identity: opaque
    exclusive_operations:
      - "PATCH /title-searches/{id} (submit findings)"
      - "POST /title-searches/{id}/clear"
      - "POST /title-searches/{id}/mark-defective"
      - "POST /title-policies (quote)"
      - "POST /title-policies/{id}/bind"
      - "POST /title-policies/{id}/void"
    shared_operations:
      - "POST /title-searches (peer with EscrowOfficer)"
      - "GET endpoints (read access on escrow files, parties, properties, CCR, policies)"

  - name: DisbursementApprover
    description: "Operator with disbursement-approval authority — segregated from CD issuance to defeat wire fraud"
    identity: opaque
    exclusive_operations:
      - "POST /disbursements/{id}/approve"
      - "POST /disbursements/{id}/send"
    shared_operations:
      - "POST /wire-instructions/{id}/confirm-callback (peer with EscrowOfficer; subject to SoD)"
      - "POST /wire-instructions/{id}/flag-fraud (peer with EscrowOfficer)"
      - "GET endpoints (escrow files, wires, disbursements, audit events)"

  - name: Buyer
    description: "Buyer party in the transaction. Acts only on artifacts they sign or acknowledge."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /closing-disclosures/{id}/acknowledge (must be Party.id == EscrowFile.buyer_party_id)"
      - "POST /ccr-disclosures (must be Party.id == EscrowFile.buyer_party_id for the referenced escrow file)"
    shared_operations:
      - "GET endpoints (their own escrow file, EMD, CD, CCR, title artifacts, exchange)"

  - name: Seller
    description: "Seller party in the transaction. Read-only on most artifacts; cannot mutate state."
    identity: "entity_backed:Party"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints (their own escrow file, EMD, CD, CCR, title artifacts, exchange)"
