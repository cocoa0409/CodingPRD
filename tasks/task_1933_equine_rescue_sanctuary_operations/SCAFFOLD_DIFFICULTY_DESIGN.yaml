# =============================================================================
# Task 1933: Equine Rescue & Sanctuary Operations — §1.8 Test Targeting Index
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: care_plan_actuarial_vs_straight_line_divergence
        grounds:
          - calculations.lifetime_care_cost_projection
          - entities.SanctuaryCarePlan.fields.variant
          - state_machines.SanctuaryCarePlan.DRAFT_to_SUPERSEDED
        distinguishing_aspect: |
          Same horse (age 10, LIGHT), two variants: STRAIGHT_LINE yields
          total_lifetime_cost_cents=6930000 / monthly=38500; ACTUARIAL yields
          total=6059405 / monthly=33663 — identical inputs, mortality-weighted
          escalation produces a different number (entity domain: SanctuaryCarePlan).
        test_recipe:
          setup:
            - "Horse H (age_years=10, breed_class=LIGHT) in SANCTUARY status"
            - "Horse version captured after designation for OCC"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 10, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: REHABILITATION }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/horses/${h}/designate-sanctuary", payload: { reason: "unrideable" }, as: SanctuaryDirector }
            - { call: "GET /rescue-ops/horses/${h}", as: SanctuaryDirector, captures: { h_v2: $.data.version } }
          trigger:
            - { call: "POST /rescue-ops/sanctuary-care-plans", payload: { horse_id: "${h}", expected_horse_version: "${h_v2}", variant: STRAIGHT_LINE }, as: SanctuaryDirector, captures: { plan1: $.data.id } }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan1}", as: SanctuaryDirector, captures: { sl_total: $.data.total_lifetime_cost_cents, sl_monthly: $.data.monthly_cost_cents } }
            - { call: "GET /rescue-ops/horses/${h}", as: SanctuaryDirector, captures: { h_v3: $.data.version } }
            - { call: "POST /rescue-ops/sanctuary-care-plans", payload: { horse_id: "${h}", expected_horse_version: "${h_v3}", variant: ACTUARIAL }, as: SanctuaryDirector, captures: { plan2: $.data.id } }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan2}", as: SanctuaryDirector, captures: { ac_total: $.data.total_lifetime_cost_cents, ac_monthly: $.data.monthly_cost_cents } }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan1}", as: SanctuaryDirector, captures: { plan1_status: $.data.status } }
          assert:
            - "SanctuaryCarePlan.${plan1}: projected_months == 180 AND monthly_cost_cents == 38500 AND total_lifetime_cost_cents == 6930000"
            - "SanctuaryCarePlan.${plan2}: projected_months == 180 AND monthly_cost_cents == 33663 AND total_lifetime_cost_cents == 6059405"
            - "SanctuaryCarePlan.${plan1}.status == SUPERSEDED after plan2 creation"
            - "6059405 != 6930000 (variants diverge on identical horse data)"

      - name: feed_supply_tight_vs_committed_divergence
        grounds:
          - calculations.feed_supply_projection
          - entities.FeedLot.fields.quantity_lbs
        distinguishing_aspect: |
          Same lots and demand, two variants: with an open ORDERED purchase order
          for 300 lbs, days_of_supply_tight=31.23 (usable 600 only) while
          days_of_supply_committed=46.84 (600+300 inbound) — divergent outputs on
          identical data (entity domain: FeedLot/PurchaseOrder, distinct from the
          care-plan instance's domain).
        test_recipe:
          setup:
            - "Horse A (1000 lbs, BCS 3) and Horse B (900 lbs, BCS 5), both QUARANTINE (resident; grass demand 21.35 lbs/day, August multiplier 0.9)"
            - "GRASS_HAY: 600 lbs usable on hand; 300 lbs open ORDERED remainder"
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "A", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 3, training_level: GREEN }, as: IntakeCoordinator, captures: { ha: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "B", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 900, age_years: 7, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { hb: $.data.id } }
            - { call: "POST /rescue-ops/purchase-orders", payload: { feed_type: GRASS_HAY, quantity_lbs: 600, unit_cents_per_lb: 10 }, as: BarnManager, captures: { po1: $.data.id } }
            - { call: "POST /rescue-ops/purchase-orders/${po1}/mark-ordered", payload: {}, as: BarnManager }
            - { call: "POST /rescue-ops/purchase-orders/${po1}/receive", payload: { quantity_received_lbs: 600, expiry_date: "2026-12-01T00:00:00Z" }, as: BarnManager }
            - { call: "POST /rescue-ops/purchase-orders", payload: { feed_type: GRASS_HAY, quantity_lbs: 300, unit_cents_per_lb: 10 }, as: BarnManager, captures: { po2: $.data.id } }
            - { call: "POST /rescue-ops/purchase-orders/${po2}/mark-ordered", payload: {}, as: BarnManager }
          trigger:
            - { call: "GET /rescue-ops/feed-inventory/summary", as: BarnManager, captures: { summaries: $.data.summaries } }
          assert:
            - "summary entry for GRASS_HAY: usable_lbs == 600 AND inbound_ordered_lbs == 300"
            - "summary entry for GRASS_HAY: daily_demand_lbs == 21.35"
            - "summary entry for GRASS_HAY: days_of_supply_tight == 31.23"
            - "summary entry for GRASS_HAY: days_of_supply_committed == 46.84"
            - "summary entry for GRASS_HAY: reorder_required == false"
            - "31.23 != 46.84 (variants diverge whenever an order is open)"

      - name: adoption_fee_quoted_vs_final_divergence
        grounds:
          - calculations.adoption_fee_calculation
          - entities.AdoptionApplication.fields.quoted_fee_cents
          - entities.AdoptionApplication.fields.final_fee_cents
        distinguishing_aspect: |
          Same application: QUOTED snapshot at approve = 90000 cents (sponsor
          subsidy applied: 100000 * 0.90); after the sponsor cancels, the FINAL
          recompute at finalize = 100000 — the fee gate rejects the 90000-paid
          application until the 10000-cent top-up (entity domain:
          AdoptionApplication; mechanism distinct from both other instances).
        test_recipe:
          setup:
            - "Horse H (age 8, TRAINED_RIDDEN) ADOPTABLE; base fee 85000 + 15000 = 100000"
            - "Sponsor SP with ACTIVE sponsorship of 20000 cents/month on H (>= 19250 threshold -> subsidy applies)"
            - "Application APP approved at 2026-08-15, quoted_fee_cents=90000, fee_paid_cents=90000"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1050, age_years: 8, body_condition_score: 5, training_level: TRAINED_RIDDEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: ADOPTABLE }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/sponsors", payload: { name: "SP", contact_email: "sp@x.com" }, as: Sponsor, captures: { sp: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships", payload: { sponsor_id: "${sp}", horse_id: "${h}", monthly_pledge_cents: 20000 }, as: Sponsor, as_user_id: "${sp}", captures: { ssp: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships/${ssp}/activate", payload: {}, as: Sponsor, as_user_id: "${sp}" }
            - { call: "POST /rescue-ops/adopters", payload: { full_name: "Ad One", contact_email: "a1@x.com", experience_level: EXPERT, has_stall_facility: true }, as: Adopter, captures: { ad: $.data.id } }
            - { call: "POST /rescue-ops/adoption-applications", payload: { adopter_id: "${ad}", horse_id: "${h}", proposed_pickup_date: "2026-08-20T00:00:00Z" }, as: Adopter, as_user_id: "${ad}", captures: { app: $.data.id } }
            - { call: "POST /rescue-ops/adoption-applications/${app}/start-review", payload: {}, as: AdoptionOfficer, as_user_id: "officer-1" }
            - { call: "POST /rescue-ops/home-checks", payload: { application_id: "${app}", scheduled_date: "2026-08-15T10:00:00Z" }, as: AdoptionOfficer, as_user_id: "officer-1", captures: { hc: $.data.id } }
            - { call: "POST /rescue-ops/home-checks/${hc}/complete", payload: { outcome: PASSED }, as: AdoptionOfficer, as_user_id: "officer-1" }
            - { call: "POST /rescue-ops/adoption-applications/${app}/approve", payload: {}, as: AdoptionOfficer, as_user_id: "officer-2", captures: { quoted: $.data.quoted_fee_cents } }
            - { call: "POST /rescue-ops/adoption-applications/${app}/pay-fee", payload: { amount_cents: 90000 }, as: Adopter, as_user_id: "${ad}" }
          trigger:
            - { call: "POST /rescue-ops/sponsorships/${ssp}/cancel", payload: {}, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/adoption-applications/${app}/finalize", payload: {}, as: AdoptionOfficer, as_user_id: "officer-2", captures: { err: $.data.error_id } }
            - { call: "POST /rescue-ops/adoption-applications/${app}/pay-fee", payload: { amount_cents: 10000 }, as: Adopter, as_user_id: "${ad}" }
            - { call: "POST /rescue-ops/adoption-applications/${app}/finalize", payload: {}, as: AdoptionOfficer, as_user_id: "officer-2", captures: { final_fee: $.data.final_fee_cents, app_status: $.data.status } }
          assert:
            - "quoted == 90000 (subsidy applied at approve)"
            - "first finalize rejected with error_id == ERR_ADOPTION_FEE_UNPAID (FINAL recompute is 100000 != 90000 paid)"
            - "after 10000-cent top-up, finalize succeeds: status == FINALIZED AND final_fee_cents == 100000"
            - "final_fee_cents (100000) != quoted_fee_cents (90000): variant divergence observable in the settlement gate"

  - rule_id: combinatorial_formula
    instances:
      - name: adoption_fee_tiered_pair_combination
        grounds:
          - calculations.adoption_fee_calculation
          - entities.Horse.fields.bonded_companion_id
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with tiered-rate selection and
          conditional branches — two age bands (8 -> 85000 tier; 20 -> 35000
          tier), two training adjustments (+15000 / -10000), and the bonded-pair
          branch (0.75 factor) combine to exactly 93750 cents.
        test_recipe:
          setup:
            - "Horse H2 (age 20, GREEN, 800 lbs, BCS 5) ADOPTABLE"
            - "Horse H1 (age 8, TRAINED_RIDDEN, 1000 lbs, BCS 5) with bonded_companion_id=H2, ADOPTABLE"
            - "Application with adopt_with_bonded_companion=true APPROVED; no sponsorships (subsidy branch not taken)"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H2", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 800, age_years: 20, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h2: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h2}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev2: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev2}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h2}", as: IntakeCoordinator, captures: { q2: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q2}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h2}/release-quarantine", payload: { target_status: ADOPTABLE }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/horses", payload: { name: "H1", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 8, body_condition_score: 5, training_level: TRAINED_RIDDEN, bonded_companion_id: "${h2}" }, as: IntakeCoordinator, captures: { h1: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-27T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h1}", evaluation_type: MEDICAL, scheduled_date: "2026-08-27T12:00:00Z" }, as: IntakeCoordinator, captures: { ev1: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev1}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h1}", as: IntakeCoordinator, captures: { q1: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-29T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q1}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h1}/release-quarantine", payload: { target_status: ADOPTABLE }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/adopters", payload: { full_name: "Ad Pair", contact_email: "ap@x.com", experience_level: EXPERT, has_stall_facility: true }, as: Adopter, captures: { ad: $.data.id } }
            - { call: "POST /rescue-ops/adoption-applications", payload: { adopter_id: "${ad}", horse_id: "${h1}", proposed_pickup_date: "2026-09-05T00:00:00Z", adopt_with_bonded_companion: true }, as: Adopter, as_user_id: "${ad}", captures: { app: $.data.id } }
            - { call: "POST /rescue-ops/adoption-applications/${app}/start-review", payload: {}, as: AdoptionOfficer, as_user_id: "officer-1" }
            - { call: "POST /rescue-ops/home-checks", payload: { application_id: "${app}", scheduled_date: "2026-08-29T10:00:00Z" }, as: AdoptionOfficer, as_user_id: "officer-1", captures: { hc: $.data.id } }
            - { call: "POST /rescue-ops/home-checks/${hc}/complete", payload: { outcome: PASSED }, as: AdoptionOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /rescue-ops/adoption-applications/${app}/approve", payload: {}, as: AdoptionOfficer, as_user_id: "officer-2", captures: { quoted: $.data.quoted_fee_cents } }
          assert:
            - "quoted == 93750 (fee(H1)=85000+15000=100000; fee(H2)=35000-10000=25000; pair factor 0.75 * 125000 = 93750)"
            - "AdoptionApplication.${app}.status == APPROVED AND Horse.${h1}.status == ADOPTION_PENDING"
            - "Horse.${h2}.status == ADOPTABLE (companion is not locked until finalize)"

      - name: purchase_order_per_lot_rounding_order
        grounds:
          - calculations.purchase_order_cost
          - entities.PurchaseOrder.fields.actual_total_cents
          - entities.PurchaseOrder.fields.estimated_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: 3 lots x 333 lbs @ 7.5 cents/lb — pinned
          per-lot-then-sum gives actual_total_cents=7494 while the create-time
          single-rounding estimate gives 7493; the 1-cent divergence plus the
          surcharge-on-rounded-sum (600) and grand total (8094) pin the order.
        test_recipe:
          setup:
            - "PurchaseOrder for 999 lbs GRASS_HAY @ 7.5 cents/lb, ORDERED, received in three lots of 333 lbs"
          setup_api_calls:
            - { call: "POST /rescue-ops/purchase-orders", payload: { feed_type: GRASS_HAY, quantity_lbs: 999, unit_cents_per_lb: 7.5 }, as: BarnManager, captures: { po: $.data.id, est: $.data.estimated_total_cents } }
            - { call: "POST /rescue-ops/purchase-orders/${po}/mark-ordered", payload: {}, as: BarnManager }
          trigger:
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 333, expiry_date: "2026-09-01T00:00:00Z" }, as: BarnManager }
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 333, expiry_date: "2026-09-02T00:00:00Z" }, as: BarnManager }
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 333, expiry_date: "2026-09-03T00:00:00Z" }, as: BarnManager, captures: { status: $.data.status } }
            - { call: "GET /rescue-ops/purchase-orders/${po}", as: BarnManager, captures: { actual: $.data.actual_total_cents, surcharge: $.data.delivery_surcharge_cents, grand: $.data.grand_total_cents, recv: $.data.received_lbs } }
          assert:
            - "est == 7493 (single-rounding estimate at create)"
            - "actual == 7494 (sum of per-lot rounded 2498 x 3)"
            - "actual != est — rounding order is observable"
            - "surcharge == 600 (round_half_up(7494 * 0.08) = round_half_up(599.52))"
            - "grand == 8094 AND recv == 999 AND status == RECEIVED"

  - rule_id: non_linear_state_machine
    instances:
      - name: horse_quarantine_reentry_cycle
        grounds:
          - state_machines.Horse.ADOPTABLE_to_QUARANTINE
          - state_machines.Horse.QUARANTINE_to_ADOPTABLE
          - state_machines.CareServiceAppointment.REQUESTED_to_CANCELLED
        distinguishing_aspect: |
          Horse machine is cyclic (A->B->A): an ADOPTABLE horse re-enters
          QUARANTINE on exposure (cancelling its REQUESTED farrier appointment)
          and is released back to ADOPTABLE after a second clearance — the same
          state is reached twice through two distinct quarantine episodes.
        test_recipe:
          setup:
            - "Horse H ADOPTABLE (first quarantine episode CLEARED)"
            - "Farrier F; one REQUESTED FARRIER_TRIM appointment for H"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Far F", specialty: FARRIER }, as: SanctuaryDirector, captures: { far_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 9, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q1: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q1}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: ADOPTABLE }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${far_id}", service_type: FARRIER_TRIM, scheduled_start: "2026-08-16T09:00:00Z", scheduled_end: "2026-08-16T09:45:00Z" }, as: IntakeCoordinator, captures: { appt: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/horses/${h}/quarantine", payload: { min_days: 7, reason: "EXPOSURE" }, as: IntakeCoordinator, captures: { q2: $.data.id } }
            - { call: "GET /rescue-ops/care-service-appointments/${appt}", as: IntakeCoordinator, captures: { appt_status: $.data.status, appt_reason: $.data.cancellation_reason } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-20T12:00:00Z" }, as: IntakeCoordinator, captures: { ev2: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev2}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q2}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
