            - "density 15.0001 -> freight_class == \"77.5\" (captured ${c2})"
            - "density 1.0 -> freight_class == \"500\" (captured ${c3})"

      - name: oversize_surcharge_distance_and_heavy_line_tiers
        claim_type: constants_applied
        grounds:
          - calculations.calc_freight_and_oversize
        distinguishing_aspect: "Oversize surcharge stacks tiers: base 8900 + 2500 when zone_distance >= 4 + 5000 when a line exceeds 150 lbs; order A (nearest-cover warehouse RNO, dist 2, 100 lbs) pays 8900, order B (requested RNO vs ship_zone 3 -> dist 4, 200 lbs) pays 16400."
        test_recipe:
          setup: ["warehouses ATL zone 2 and RNO zone 7 (both oversize_capable); account default ATL; oversize product weight 100 lbs/unit density 12 inventory at both; order A ship_zone 5 qty 1 (selector picks nearest cover: RNO, dist 2, 100 lbs -> 8900 only); order B ship_zone 3 qty 2 requested_warehouse_code RNO (dist |3-7| == 4 -> +2500; 200 lbs > 150 -> +5000)"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
