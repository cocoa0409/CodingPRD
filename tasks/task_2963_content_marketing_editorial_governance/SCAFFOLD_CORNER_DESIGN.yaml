      - name: campaign_close_is_refused_while_an_item_is_still_open
        claim_type: Error triggerable
        grounds:
          - errors[ERR_CAMPAIGN_HAS_OPEN_ITEMS]
          - validations[priority=17]
          - endpoints[POST /editorial/campaigns/{id}/close]
        distinguishing_aspect: "The close gate at priority 17 counts items in DRAFT, IN_REVIEW, CHANGES_REQUESTED and READY, so the same close is refused three times as the single item walks DRAFT -> IN_REVIEW -> READY, and each refusal must run the depth-3 cascade zero times. PUBLISHED is not in the counted set, so the fourth close succeeds and only then does the cascade lock the slot and archive the brief."
