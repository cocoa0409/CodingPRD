              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/pickup-slots"
              payload: { bake_day_id: "${bd_id}", slot_start_utc: "2026-08-12T14:00:00Z", slot_end_utc: "2026-08-12T16:00:00Z", decorator_capacity_units: 28 }
              as: CakeDesk
