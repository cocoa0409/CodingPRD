        grounds:
          - endpoints[GET /rmn/advertisers/{id}/credit-summary]
          - calculations.advertiser_credit_exposure
          - validations[priority=73]
        distinguishing_aspect: "The child's own credit_limit_cents is only 100000 yet a 2000000-cent plan approves, because priority 73 evaluates the parent's 50000000 effective limit; the credit-summary read then shows the child carrying credit_exposure_cents 2000000 while the parent's own exposure stays 0 — exposure does not roll up."
        test_recipe:
          setup:
            - "Parent advertiser NRDV is ACTIVE with credit_limit_cents 50000000 and holds no BudgetPlan of its own."
            - "Child advertiser NRDV-KIDS is ACTIVE with parent_advertiser_id pointing at NRDV and credit_limit_cents 100000; its 2026-Q3 plan committed at 2000000 (trade_fund_share_cents 0) is APPROVED."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Nordvale Kids LLC", brand_code: "NRDVK", service_model: "SELF_SERVE", credit_limit_cents: 100000, self_serve_daily_spend_cap_cents: 5000000, parent_advertiser_id: "${adv_id}" }
