  - method: POST
    path: "/discipline-incidents/{id}/consequences"
    description: "Attach a consequence to an under-review incident (OSS cascades to attendance)"
    roles: [Administrator]
    code: 201
    input: [type, "start_day_index?", "duration_days?"]
    output: DisciplineConsequence
    side_effects: ["status = ACTIVE", "OSS writes SYSTEM_SUSPENSION attendance + supersedes existing; DailyAttendance + present_days recomputed"]
  - method: GET
    path: "/discipline-incidents/{id}/consequences"
    description: "List consequences attached to an incident"
    roles: [Teacher, Administrator, Registrar, Parent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DisciplineConsequence[]"
    side_effects: []
  - method: GET
    path: "/discipline-consequences"
    description: "List/filter discipline consequences across incidents"
    roles: [Teacher, Administrator, Registrar, Parent]
    code: 200
    input: ["enrollment_id?", "incident_id?", "status?", "limit?", "offset?"]
    output: "DisciplineConsequence[]"
    side_effects: []
  - method: GET
    path: "/discipline-consequences/{id}"
    description: "Get a discipline consequence"
    roles: [Teacher, Administrator, Registrar, Parent]
    code: 200
    input: []
    output: DisciplineConsequence
    side_effects: []
  - method: POST
    path: "/discipline-consequences/{id}/rescind"
    description: "Rescind an active consequence (reverses attendance cascade)"
    roles: [Administrator]
    code: 200
    input: []
    output: DisciplineConsequence
    side_effects: ["status -> RESCINDED", "SYSTEM_SUSPENSION attendance reversed; superseded records restored; DailyAttendance + present_days recomputed"]

  # ---- ADA funding state report ----
  - method: POST
    path: "/ada-funding-reports"
    description: "Draft an ADA funding report snapshot for a school through a day"
    roles: [Registrar, StateReportingOfficer]
    code: 201
    input: [school_id, as_of_day_index]
    output: AdaFundingReport
    side_effects: ["status = DRAFT", "drafter_user_id = X-User-ID", "method_used/total_ada/funded_enrollment_count computed (ada_funding_total)"]
  - method: GET
    path: "/ada-funding-reports"
    description: "List/filter ADA funding reports"
    roles: [Registrar, StateReportingOfficer, Administrator]
    code: 200
    input: ["school_id?", "status?", "limit?", "offset?"]
    output: "AdaFundingReport[]"
    side_effects: []
  - method: GET
    path: "/ada-funding-reports/{id}"
    description: "Get an ADA funding report"
    roles: [Registrar, StateReportingOfficer, Administrator]
    code: 200
    input: []
    output: AdaFundingReport
    side_effects: []
  - method: POST
    path: "/ada-funding-reports/{id}/recompute"
    description: "Recompute a DRAFT report's totals against current data"
    roles: [Registrar, StateReportingOfficer]
    code: 200
    input: []
    output: AdaFundingReport
    side_effects: ["total_ada/funded_enrollment_count recomputed (ada_funding_total)", "increments AdaFundingReport.version by 1"]
  - method: POST
    path: "/ada-funding-reports/{id}/certify"
    description: "Certify a DRAFT report (OCC-guarded, SoD vs drafter)"
    roles: [StateReportingOfficer]
    code: 200
    input: [expected_report_version]
    output: AdaFundingReport
    side_effects: ["status -> CERTIFIED", "certifier_user_id = X-User-ID", "totals frozen", "increments AdaFundingReport.version by 1"]
  - method: POST
    path: "/ada-funding-reports/{id}/reject"
    description: "Reject a DRAFT report (SoD vs drafter)"
    roles: [StateReportingOfficer]
    code: 200
    input: []
    output: AdaFundingReport
    side_effects: ["status -> REJECTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_GUARDIAN_OF_STUDENT, http: 403, condition: "Parent X-User-ID is not a linked guardian of the targeted student" }
  # not found
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "School id does not resolve" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student id does not resolve" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not resolve" }
  - { id: ERR_COURSE_NOT_FOUND, http: 404, condition: "Course id does not resolve" }
  - { id: ERR_SECTION_NOT_FOUND, http: 404, condition: "Section id does not resolve" }
  - { id: ERR_SCHEDULE_ASSIGNMENT_NOT_FOUND, http: 404, condition: "ScheduleAssignment id does not resolve" }
  - { id: ERR_ATTENDANCE_RECORD_NOT_FOUND, http: 404, condition: "AttendanceRecord id does not resolve" }
  - { id: ERR_STANDARD_SCORE_NOT_FOUND, http: 404, condition: "StandardScore id does not resolve" }
  - { id: ERR_REPORT_CARD_NOT_FOUND, http: 404, condition: "ReportCard id does not resolve" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "DisciplineIncident id does not resolve" }
  - { id: ERR_CONSEQUENCE_NOT_FOUND, http: 404, condition: "DisciplineConsequence id does not resolve" }
  - { id: ERR_ADA_REPORT_NOT_FOUND, http: 404, condition: "AdaFundingReport id does not resolve" }
  # input
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, unknown enum" }
  - { id: ERR_DUPLICATE_COURSE_CODE, http: 409, condition: "course_code already exists within the school" }
  - { id: ERR_DUPLICATE_STATE_STUDENT_ID, http: 409, condition: "state_student_id already exists within the school" }
  # OCC
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  # enrollment state
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Enrollment must be ACTIVE for this operation" }
  - { id: ERR_INVALID_EXIT_DAY, http: 422, condition: "exit_day_index < entry_day_index" }
  - { id: ERR_EXIT_DAY_IN_FUTURE, http: 422, condition: "exit_day_index > current_school_day_index" }
  - { id: ERR_PRESENCE_ON_RECORD, http: 409, condition: "mark-no-show attempted while a PRESENT attendance record exists" }
  - { id: ERR_PARENT_NOT_ACTIVE, http: 409, condition: "Child created against a non-ACTIVE enrollment or non-OPEN section" }
  # section
  - { id: ERR_SECTION_NOT_OPEN, http: 409, condition: "Section must be OPEN" }
  - { id: ERR_SECTION_NOT_CLOSED, http: 409, condition: "Section must be CLOSED to reopen" }
  - { id: ERR_SECTION_CAPACITY_EXCEEDED, http: 409, condition: "ENROLLED assignments would exceed Section.capacity" }
  # scheduling / attendance
  - { id: ERR_SCHEDULE_PERIOD_CONFLICT, http: 409, condition: "Enrollment already has an ENROLLED assignment in that period" }
  - { id: ERR_ATTENDANCE_OUTSIDE_WINDOW, http: 422, condition: "day_index outside the enrollment's active membership window" }
  # gradebook / report card
  - { id: ERR_INVALID_GRADE_INPUT, http: 422, condition: "mastery_level/percentage_points missing or out of range for the course grading_mode" }
  - { id: ERR_REPORT_CARD_NOT_DRAFT, http: 409, condition: "Report card must be DRAFT or REOPENED to finalize" }
  - { id: ERR_REPORT_CARD_NOT_FINALIZED, http: 409, condition: "Report card must be FINALIZED to reopen" }
  - { id: ERR_INCOMPLETE_GRADES, http: 409, condition: "An ENROLLED section has no StandardScore at finalize time" }
  # discipline
  - { id: ERR_INCIDENT_NOT_REFERRED, http: 409, condition: "Incident must be REFERRED to begin review" }
  - { id: ERR_INCIDENT_NOT_UNDER_REVIEW, http: 409, condition: "Incident must be UNDER_REVIEW for this operation" }
  - { id: ERR_INCIDENT_NOT_DISMISSIBLE, http: 409, condition: "Incident must be REFERRED or UNDER_REVIEW to dismiss" }
  - { id: ERR_NOT_ASSIGNED_ADJUDICATOR, http: 403, condition: "Only the administrator who began review may adjudicate or attach a consequence" }
  - { id: ERR_NO_CONSEQUENCE_RECORDED, http: 409, condition: "Cannot adjudicate before a consequence exists" }
  - { id: ERR_INVALID_CONSEQUENCE, http: 422, condition: "Suspension duration/start invalid for the consequence type" }
  - { id: ERR_SUSPENSION_CAP_EXCEEDED, http: 422, condition: "WEAPON OSS duration exceeds the 10-day statutory cap" }
  - { id: ERR_CONSEQUENCE_NOT_ACTIVE, http: 409, condition: "Consequence must be ACTIVE to rescind" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting user is the same identity that filed/drafted; segregation of duties violated" }
  # ADA report
  - { id: ERR_REPORT_NOT_DRAFT, http: 409, condition: "ADA report must be DRAFT to certify/reject/recompute" }
  - { id: ERR_ATTENDANCE_NOT_POSTED, http: 409, condition: "An in-scope active enrollment has no attendance posted through as_of_day_index" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Front-office enrollment + scheduling authority; owns student/enrollment/course/section/schedule lifecycle and may post attendance corrections."
    identity: "opaque"
    exclusive_operations:
      - "POST /schools — create school"
      - "POST /schools/{id}/clock/advance — advance clock"
      - "POST /students — create student"
      - "POST /students/{id}/guardians — link guardian"
      - "POST /enrollments — enroll"
      - "POST /enrollments/{id}/withdraw — withdraw"
      - "POST /enrollments/{id}/mark-no-show — mark no-show"
      - "POST /courses — create course"
      - "POST /sections — create section"
      - "POST /sections/{id}/close — close section"
      - "POST /sections/{id}/reopen — reopen section"
      - "POST /schedule-assignments — seat assignment"
      - "POST /schedule-assignments/{id}/drop — drop assignment"
    shared_operations:
      - "POST /attendance-records, POST /attendance-records/{id}/correct — with Teacher"
      - "POST /report-cards — with Teacher"
      - "POST /ada-funding-reports, POST /ada-funding-reports/{id}/recompute — with StateReportingOfficer"
      - "GET reads across schools/students/enrollments/courses/sections/attendance/reports"

  - name: Teacher
    description: "Instructional staff for assigned sections; posts attendance, records standards scores, finalizes report cards, files discipline referrals."
    identity: "opaque"
    exclusive_operations:
      - "POST /standard-scores — record standards score"
      - "POST /report-cards/{id}/finalize — finalize report card"
    shared_operations:
      - "POST /attendance-records, POST /attendance-records/{id}/correct — with Registrar"
      - "POST /report-cards — with Registrar"
      - "POST /discipline-incidents — file referral (with Administrator)"
      - "GET reads on assigned sections/students/attendance/grades/report cards"

  - name: Administrator
    description: "Principal/assistant principal; adjudicates discipline with segregation of duties, attaches consequences, reopens report cards."
    identity: "opaque"
    exclusive_operations:
      - "POST /discipline-incidents/{id}/begin-review — open review"
      - "POST /discipline-incidents/{id}/adjudicate — adjudicate"
      - "POST /discipline-incidents/{id}/dismiss — dismiss"
      - "POST /discipline-incidents/{id}/consequences — attach consequence"
      - "POST /discipline-consequences/{id}/rescind — rescind consequence"
      - "POST /report-cards/{id}/reopen — reopen report card"
    shared_operations:
      - "POST /discipline-incidents — file referral (with Teacher)"
      - "GET reads across the school"

  - name: StateReportingOfficer
    description: "District/state reporting authority; certifies or rejects ADA funding reports under segregation of duties from the drafter."
    identity: "opaque"
    exclusive_operations:
      - "POST /ada-funding-reports/{id}/certify — certify report"
      - "POST /ada-funding-reports/{id}/reject — reject report"
    shared_operations:
      - "POST /ada-funding-reports, POST /ada-funding-reports/{id}/recompute — with Registrar"
      - "GET reads on enrollments/attendance/reports"

  - name: Parent
    description: "Guardian portal user; read-only access scoped to their own linked child(ren)."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /students/{id}/portal-summary — own child only (guardian-checked)"
      - "GET /students/{id}, GET /enrollments/{id}/daily-attendance, GET /report-cards, GET /discipline-incidents — own child only"
