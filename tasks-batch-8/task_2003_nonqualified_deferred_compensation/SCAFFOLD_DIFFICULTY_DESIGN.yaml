          - state_machines.ElectionWindow.SCHEDULED_to_OPEN
        distinguishing_aspect: |
          Pair DeferralElection -> ElectionWindow: a GENERAL election may be
          created only while the referenced window is OPEN; the same create call
          flips from ERR_WINDOW_NOT_OPEN (window SCHEDULED at default clock) to
          201 after the clock sweep opens the window.
