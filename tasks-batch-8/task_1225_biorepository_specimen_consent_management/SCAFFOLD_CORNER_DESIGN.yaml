  - section: rbac
    instances:
      - name: committee_reviewer_cannot_create_storage_unit
        claim_type: rbac_denial
        grounds:
          - "roles[CommitteeReviewer]"
          - "roles[BiobankAdmin]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Peer-role separation: CommitteeReviewer attempting a BiobankAdmin-exclusive operation (POST /storage-units) is denied 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-RBAC", setpoint_c: -80.0 }, as: CommitteeReviewer, as_user_id: "rev-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response 403; data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: lab_technician_cannot_confirm_destruction
        claim_type: rbac_denial
        grounds:
          - "roles[LabTechnician]"
          - "roles[QualityOfficer]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Confirm-execution is QualityOfficer-exclusive; a LabTechnician is denied 403 even when the order is PENDING and confirmable."
        test_recipe:
          setup: ["specimen accessioned; destruction order PENDING created by qo-1"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-RBAC2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp_id: "$.data.id" } }
            - { call: "POST /biobank/destruction-orders", payload: { specimen_id: "${sp_id}", reason: "OTHER" }, as: QualityOfficer, as_user_id: "qo-1", captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/destruction-orders/${o_id}/confirm-execution", payload: {}, as: LabTechnician, as_user_id: "lab-9", captures: { err: "$.data.error_id" } }
          assert:
            - "response 403; data.error_id == ERR_INSUFFICIENT_PERMISSIONS; GET /biobank/destruction-orders/${o_id} -> status remains PENDING"

      - name: reviewer_identity_recorded_on_vote
        claim_type: identity_semantics
        grounds:
          - "roles[CommitteeReviewer]"
          - "entities.ReviewVote.fields.reviewer_user_id"
        distinguishing_aspect: "Opaque identity mapping: the vote row persists reviewer_user_id exactly equal to the X-User-ID header, enabling duplicate-vote and SoD checks."
        test_recipe:
          setup: ["agreement ACTIVE; request UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni ID", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-ID", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 5.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "identity recording check vote ok" }, as: CommitteeReviewer, as_user_id: "rev-7", captures: { voter: "$.data.reviewer_user_id" } }
          assert:
            - "response 201; data.reviewer_user_id == rev-7"
            - "GET /biobank/sample-requests/${rq_id} -> requester_user_id == researcher-1"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_specimen_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[aliquot-create-stale-specimen]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on Specimen.version: after a first aliquot creation advances the version, a second creation carrying the original expected_specimen_version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["specimen SP-OCC 100ml ACCESSIONED at version 1"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-OCC1" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 100.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
          trigger:
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 10.0, expected_specimen_version: "${sp_v}" }, as: LabTechnician, captures: { a_id: "$.data.id" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 10.0, expected_specimen_version: "${sp_v}" }, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "First creation -> 201 (version 1 matched; specimen.version now 2)"
            - "Second creation with the same stale expected_specimen_version -> 412 ERR_STALE_VERSION"

      - name: occ_stale_consent_version_on_amend_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[consent-amend-stale-consent]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on ConsentRecord.version: a second amendment against the same observed version fails 412 (the first amendment already superseded the record and bumped its version)."
        test_recipe:
          setup: ["donor with ACTIVE consent at version 1"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-OCC2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id", c_v: "$.data.version" } }
          trigger:
            - { call: "POST /biobank/consent-records/${c_id}/amendments", payload: { permitted_uses: ["GENERAL_RESEARCH", "DISEASE_SPECIFIC"], effective_from: "2026-05-01T00:00:00Z", expected_consent_record_version: "${c_v}" }, as: ConsentCoordinator, captures: { c_new: "$.data.id" } }
            - { call: "POST /biobank/consent-records/${c_id}/amendments", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z", expected_consent_record_version: "${c_v}" }, as: ConsentCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "First amendment -> 201; old consent SUPERSEDED with version 2; new consent ${c_new} ACTIVE with supersedes_consent_id == ${c_id}"
            - "Second amendment with stale version -> 412 ERR_STALE_VERSION"

      - name: version_increments_on_withdraw
        claim_type: optimistic_concurrency
        grounds:
          - "entities.ConsentRecord"
          - "state_machines.ConsentRecord.ACTIVE_to_WITHDRAWAL_PENDING"
        distinguishing_aspect: "Common-field version discipline: withdraw increments ConsentRecord.version by exactly 1 and refreshes updated_at."
        test_recipe:
          setup: ["donor with ACTIVE consent"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-OCC3" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id", c_v: "$.data.version" } }
          trigger:
            - { call: "POST /biobank/consent-records/${c_id}/withdraw", payload: {}, as: ConsentCoordinator, captures: { c_v2: "$.data.version" } }
          assert:
            - "data.version after withdraw == captured pre-withdraw version + 1; status == WITHDRAWAL_PENDING; grace_deadline == 2026-05-04T00:00:00Z"

      - name: sweep_does_not_finalize_early
        claim_type: scheduled_actions
        grounds:
          - "calculations.withdrawal_grace_deadline"
          - "endpoints[POST /biobank/sweeps/process-due]"
        distinguishing_aspect: "Deferred action discipline: one hour before grace_deadline the sweep finalizes nothing (withdrawals_finalized == 0, status stays WITHDRAWAL_PENDING)."
        test_recipe:
          setup: ["consent withdrawn at default clock; clock at 2026-05-03T23:00:00Z (one hour before the 2026-05-04T00:00:00Z deadline)"]
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-SCH1" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/consent-records/${c_id}/withdraw", payload: {}, as: ConsentCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T23:00:00Z" }, as: BiobankAdmin }
          trigger:
            - { call: "POST /biobank/sweeps/process-due", payload: {}, as: BiobankAdmin, captures: { n_wd: "$.data.withdrawals_finalized" } }
          assert:
            - "data.withdrawals_finalized == 0; GET /biobank/consent-records/${c_id} -> status == WITHDRAWAL_PENDING"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: fulfill_effects_immediately_visible
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
