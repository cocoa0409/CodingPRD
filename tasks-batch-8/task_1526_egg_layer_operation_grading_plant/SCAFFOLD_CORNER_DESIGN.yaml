  - section: calculations
    instances:
      - name: feed_fifo_crosses_price_layers_in_delivery_order
        claim_type: correct_result
        grounds: [calculations.feed_fifo_costing, entities.ProductionDay.fields.feed_cost_cents, entities.FeedDelivery.fields.remaining_kg]
        distinguishing_aspect: "Chronological FIFO: a 150 kg issuance against layers D1 100 kg @ 50c (delivered 2026-07-01) and D2 100 kg @ 60c (2026-07-10) costs 100x50 + 50x60 = 8000c — order-sensitive; D1 ends DEPLETED (remaining_kg 0) and D2 keeps 50 kg. The POST response itself carries the computed feed_cost_cents (immediate consistency)."
        test_recipe:
          setup: ["farm; house; LAYING flock; feed deliveries D1 (100 kg @ 50c, 2026-07-01) and D2 (100 kg @ 60c, 2026-07-10)"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Fifo Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/feed-deliveries"
