# =============================================================================
# PRD Benchmark Scaffold — Task 2948
# In-Store Sushi Kiosk Franchise Operations
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  2948. In-Store Sushi Kiosk Franchise Operations (Hissho Sushi): host-store
  license agreement with revenue share and space obligations, franchise chef
  placement, training and certification, daily production plan by store traffic
  with acidification and time/temperature control records, HACCP variance
  documentation for sushi rice acidification, raw fish sourcing, parasite
  destruction records and cold chain, discard and markdown rules on unsold
  packs, host store point-of-sale integration and settlement, food safety
  audits and kiosk closure protocol

domain_name: "sushi-kiosk-franchise-ops"
api_prefix: "/kiosk-ops"

complexity_profile:
  difficulty_level: expert
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # 11 of 15 entities are top-level peers joined only by FK body fields; two
  # entities carry self-referential supersede edges (ProductionPlan,
  # SettlementStatement); Kiosk<->Chef is a mutual reference pair. Only four
  # append-only records nest in the URL (Certification, ColdChainReading,
  # DiscardEvent, AuditFinding).

  state_machine_shape: parallel
  # Kiosk carries two independent dimensions (operational_state x
  # sanitation_posture). FoodSafetyAudit and SettlementStatement are cyclic
  # (reverification rounds / dispute-revise rounds); RiceBatch is branching
  # with divergent side-effect sets per branch; Chef is cyclic via
  # recertification.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: HostStore
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Grocery host store display name"
      - name: banner_chain
        type: string
        source: input
        description: "Retail banner that owns the host store"
      - name: store_number
        type: string
        source: input
        description: "Banner-assigned store number"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code of the host store"
        constraints: "exactly 2 uppercase letters"
      - name: weekly_traffic_count
        type: integer
        source: input
        description: "Measured weekly shopper traffic used to derive daily traffic"
        constraints: ">= 0"
      - name: sushi_space_sqft
        type: integer
        source: input
        description: "Square footage the host store declares for the sushi kiosk at registration"
        constraints: ">= 0"
      - name: refrigerated_case_linear_ft
        type: number
        source: input
        description: "Linear feet of refrigerated case dedicated to sushi packs"
        constraints: "> 0"
      - name: refrigerated_case_capacity_packs
        type: integer
        source: input
        description: "Physical pack capacity of the refrigerated case, shared by every kiosk of this host store"
        constraints: "> 0"
      - name: pos_integration_status
        type: enum
        source: system
        description: "Point-of-sale integration state of the host store"
        default: NOT_CONNECTED
        constraints: "NOT_CONNECTED | CONNECTED | SUSPENDED"
      - name: pos_terminal_count
        type: integer
        source: system
        description: "Terminal count reported by the last pos-integration call"
        default: 0
      - name: attested_sushi_space_sqft
        type: integer
        source: system
        description: "Square footage measured by the most recent space attestation; null until first attestation"
        default: null
      - name: attested_case_linear_ft
        type: number
        source: system
        description: "Case linear feet measured by the most recent space attestation; null until first attestation"
        default: null
      - name: last_attested_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) of the most recent space attestation; null until first attestation"
        default: null
      - name: space_compliance_state
        type: enum
        source: computed
        description: "COMPLIANT when the latest attestation meets every space obligation of every ACTIVE LicenseAgreement of this host store; DEFICIENT when it does not; UNVERIFIED before the first attestation"
        default: UNVERIFIED
        constraints: "UNVERIFIED | COMPLIANT | DEFICIENT"

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - name: host_store_id
        type: string
        source: input
        description: "FK -> HostStore.id; the host store licensed to operate kiosks"
      - name: status
        type: enum
        source: system
        description: "License lifecycle state"
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUSPENDED | TERMINATED"
      - name: revenue_share_model
        type: enum
        source: input
        description: "Selects which revenue-share variant is binding on settlement statements of this agreement"
        constraints: "GROSS_SALES | NET_OF_MARKDOWN"
      - name: markdown_policy
        type: enum
        source: input
        description: "Selects which markdown-price variant is binding for pack lots produced under this agreement"
        constraints: "PRORATED_REMAINING_LIFE | FLAT_STEP"
      - name: min_space_sqft_obligation
        type: integer
        source: input
        description: "Minimum sushi square footage the host store owes under the license"
        constraints: "> 0"
      - name: min_case_linear_ft_obligation
        type: number
        source: input
        description: "Minimum refrigerated case linear feet the host store owes under the license"
        constraints: "> 0"
      - name: space_credit_cents_per_sqft
        type: integer
        source: input
        description: "Cents credited back to the host store per square foot of attested shortfall on a settlement statement"
        constraints: ">= 0"
      - name: effective_from
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD) the license covers"
      - name: effective_to
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD) the license covers"
      - name: space_shortfall_sqft
        type: integer
        source: computed
        description: "max(0, min_space_sqft_obligation - coalesce(HostStore.attested_sushi_space_sqft, HostStore.sushi_space_sqft)); recomputed on every space attestation"
        default: 0
      - name: active_kiosk_count
        type: integer
        source: computed
        description: "Count of Kiosk rows with license_agreement_id == this.id and operational_state == OPERATING"
        default: 0
      - name: lifetime_share_accrued_cents
        type: integer
        source: computed
        description: "Conserved ledger: sum of net_due_cents over SettlementStatement rows of this agreement whose status IN {ISSUED, ACKNOWLEDGED, PAID}"
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: "Reason text recorded by the suspend transition; null otherwise"
        default: null

  - name: Kiosk
    parent: null
    common_fields: true
    fields:
      - name: license_agreement_id
        type: string
        source: input
        description: "FK -> LicenseAgreement.id; the license the kiosk operates under"
      - name: kiosk_code
        type: string
        source: input
        description: "Operator-facing kiosk code, unique within the license agreement"
      - name: case_footprint_sqft
        type: integer
        source: input
        description: "Square footage this kiosk occupies inside the host store sushi space"
        constraints: "> 0"
      - name: lead_chef_id
        type: string
        source: system
        description: "FK -> Chef.id; the certified chef of record set by the commission transition; null while PROVISIONING"
        default: null
      - name: operational_state
        type: enum
        source: system
        description: "First state dimension: kiosk operating lifecycle, independent of sanitation_posture"
        default: PROVISIONING
        constraints: "PROVISIONING | OPERATING | SUSPENDED | DECOMMISSIONED"
      - name: sanitation_posture
        type: enum
        source: computed
        description: "Second state dimension: food-safety posture derived from risk_points and open critical findings, independent of operational_state"
        default: CLEAR
        constraints: "CLEAR | WATCH | RESTRICTED | LOCKDOWN"
      - name: daily_pack_cap
        type: integer
        source: computed
        description: "floor(HostStore.refrigerated_case_linear_ft * CASE_PACKS_PER_LINEAR_FT), frozen at commission time"
        default: 0
      - name: certified_chef_count
        type: integer
        source: computed
        description: "Count of Chef rows with assigned_kiosk_id == this.id and status == CERTIFIED"
        default: 0
      - name: risk_points
        type: integer
        source: computed
        description: "Output of the kiosk_risk_points calculation; floor 0, ceiling 40"
        default: 0
      - name: open_critical_finding_count
        type: integer
        source: computed
        description: "Count of AuditFinding rows with severity == CRITICAL and status == OPEN across all audits of this kiosk"
        default: 0
      - name: consecutive_clean_audits
        type: integer
        source: computed
        description: "Number of consecutive FoodSafetyAudit rows of this kiosk that reached CLOSED with zero findings, reset to 0 by any audit that produces a finding"
        default: 0
      - name: commissioned_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) the kiosk was commissioned; null while PROVISIONING"
        default: null
      - name: suspension_reason
        type: string
        source: system
        description: "Reason text recorded by the most recent suspend transition; null otherwise"
        default: null

  - name: Chef
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Franchise chef full name"
      - name: assigned_kiosk_id
        type: string
        source: system
        description: "FK -> Kiosk.id; kiosk the chef is placed at; null until placement"
        default: null
      - name: status
        type: enum
        source: system
        description: "Chef training and certification lifecycle state"
        default: CANDIDATE
        constraints: "CANDIDATE | TRAINEE | CERTIFIED | SUSPENDED"
      - name: training_hours_logged
        type: number
        source: computed
        description: "Cumulative sum of training_hours over every training call for this chef"
        default: 0
      - name: food_handler_cert_expires_at
        type: datetime
        source: computed
        description: "expires_at of the FOOD_HANDLER Certification of this chef with status == VALID and the latest expires_at; null when none"
        default: null
      - name: haccp_cert_expires_at
        type: datetime
        source: computed
        description: "expires_at of the HACCP_RICE_ACIDIFICATION Certification of this chef with status == VALID and the latest expires_at; null when none"
        default: null
      - name: valid_cert_count
        type: integer
        source: computed
        description: "Count of Certification rows of this chef with status == VALID"
        default: 0

  - name: Certification
    parent: Chef
    common_fields: true
    fields:
      - name: chef_id
        type: string
        source: system
        description: "FK -> Chef.id; taken from the path, never from the body"
      - name: cert_type
        type: enum
        source: input
        description: "Certification subject"
        constraints: "FOOD_HANDLER | HACCP_RICE_ACIDIFICATION | PARASITE_DESTRUCTION_VERIFIER"
      - name: exam_score
        type: number
        source: input
        description: "Certification exam score out of 100"
        constraints: ">= 0 and <= 100"
      - name: issued_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the certification was issued"
      - name: valid_days
        type: integer
        source: input
        description: "Validity window length in days"
        constraints: "> 0"
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + valid_days days, ISO 8601 UTC with three fractional digits"
      - name: status
        type: enum
        source: computed
        description: "VALID while the logical clock is before expires_at and no revocation happened; EXPIRED once the clock reaches expires_at; REVOKED after a revoke call"
        default: VALID
        constraints: "VALID | EXPIRED | REVOKED"
      - name: revocation_reason
        type: string
        source: system
        description: "Reason text recorded by the revoke transition; null otherwise"
        default: null

  - name: ProductionPlan
    parent: null
    common_fields: true
    fields:
      - name: kiosk_id
        type: string
        source: input
        description: "FK -> Kiosk.id; the kiosk the plan schedules production for"
      - name: production_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the plan produces for"
      - name: traffic_forecast
        type: integer
        source: input
        description: "Forecast shopper traffic for production_date, supplied by the planner"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Production plan lifecycle state"
        default: DRAFT
        constraints: "DRAFT | RELEASED | LOCKED | RECONCILED | VOIDED"
      - name: planned_pack_count
        type: integer
        source: computed
        description: "Output of the daily_production_allocation calculation, frozen at create time"
      - name: planned_rice_kg
        type: number
        source: computed
        description: "round_half_up(planned_pack_count * RICE_KG_PER_PACK, 2)"
      - name: posture_factor_applied
        type: number
        source: computed
        description: "POSTURE_FACTOR value selected from Kiosk.sanitation_posture at create time"
      - name: binding_cap_source
        type: enum
        source: computed
        description: "Which of the three ceilings produced the minimum in daily_production_allocation; ties resolve in the order DEMAND, CASE_CAPACITY, STAFFING"
        constraints: "DEMAND | CASE_CAPACITY | STAFFING"
      - name: actual_pack_count
        type: integer
        source: computed
        description: "Sum of pack_count over PackLot rows whose rice_batch_id belongs to this plan and whose status IN {ON_SHELF, MARKED_DOWN, SOLD_OUT}; DISCARDED and VOIDED lots are excluded"
        default: 0
      - name: forecast_variance_pct
        type: number
        source: computed
        description: "Set only by the reconcile transition: round_half_up((actual_pack_count - planned_pack_count) / planned_pack_count * 100, 2); null before reconcile"
        default: null
      - name: superseded_plan_id
        type: string
        source: system
        description: "FK -> ProductionPlan.id; set on the newly created plan when it supersedes an existing DRAFT plan for the same kiosk_id and production_date; null otherwise"
        default: null
      - name: void_reason
        type: string
        source: system
        description: "Reason text recorded when the plan moves to VOIDED, including cascade reasons; null otherwise"
        default: null

  - name: RiceBatch
    parent: null
    common_fields: true
    fields:
      - name: production_plan_id
        type: string
        source: input
        description: "FK -> ProductionPlan.id; the plan this batch produces against"
      - name: chef_id
        type: string
        source: input
        description: "FK -> Chef.id; the chef who mixed the batch"
      - name: rice_kg
        type: number
        source: input
        description: "Kilograms of cooked rice in the batch"
        constraints: "> 0"
      - name: vinegar_liters
        type: number
        source: input
        description: "Liters of seasoned vinegar added during mixing"
        constraints: "> 0"
      - name: hold_start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the batch entered ambient hold; start of the time/temperature control window"
      - name: hold_end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the batch leaves ambient hold; end of the time/temperature control window"
      - name: status
        type: enum
        source: system
        description: "Rice batch acidification and disposition state"
        default: MIXING
        constraints: "MIXING | ACIDIFYING | APPROVED | VARIANCE_REQUIRED | VARIANCE_PENDING | VARIANCE_APPROVED | REJECTED | CONSUMED"
      - name: measured_ph
        type: number
        source: system
        description: "pH recorded by the acidification-reading call; null before it"
        default: null
      - name: ph_measured_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant supplied with the acidification reading; null before it"
        default: null
      - name: max_temp_c
        type: number
        source: system
        description: "Maximum ambient hold temperature in Celsius recorded by the acidification-reading call; null before it"
        default: null
      - name: exposure_minutes
        type: integer
        source: computed
        description: "floor((hold_end_at - hold_start_at) in seconds / 60), computed by the verify-ttc transition"
        default: null
      - name: max_pack_yield
        type: integer
        source: computed
        description: "floor(rice_kg / RICE_KG_PER_PACK); ceiling on the pack_count of pack lots drawn from this batch"
      - name: documented_ph
        type: number
        source: system
        description: "pH written into the HACCP variance documentation by the variance-request call; null otherwise"
        default: null
      - name: documented_hold_minutes
        type: integer
        source: system
        description: "Ambient hold minutes written into the HACCP variance documentation by the variance-request call; null otherwise"
        default: null
      - name: corrective_narrative
        type: string
        source: system
        description: "Corrective-action narrative written into the HACCP variance documentation; null otherwise"
        default: null
      - name: variance_submitted_by_chef_id
        type: string
        source: system
        description: "FK -> Chef.id; chef who filed the HACCP variance documentation; null otherwise"
        default: null
      - name: variance_reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityAuditor who decided the variance; audit trail only, never an input to any business decision"
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: "Reason text recorded when the batch moves to REJECTED, including cascade reasons; null otherwise"
        default: null

  - name: FishLot
    parent: null
    common_fields: true
    fields:
      - name: kiosk_id
        type: string
        source: input
        description: "FK -> Kiosk.id; kiosk that received the lot"
      - name: species
        type: enum
        source: input
        description: "Raw fish species received"
        constraints: "TUNA_YELLOWFIN | SALMON_ATLANTIC | HAMACHI | SHRIMP_COOKED"
      - name: supplier_code
        type: string
        source: input
        description: "Approved supplier code printed on the lot tag"
      - name: harvest_method
        type: enum
        source: input
        description: "Harvest provenance claimed on the supplier certificate"
        constraints: "WILD | AQUACULTURE_EXEMPT"
      - name: net_weight_kg
        type: number
        source: input
        description: "Net weight of the lot in kilograms at receiving"
        constraints: "> 0"
      - name: received_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the lot was received"
      - name: receiving_temp_c
        type: number
        source: input
        description: "Product temperature in Celsius measured at receiving"
      - name: status
        type: enum
        source: system
        description: "Fish lot sourcing and release state"
        default: RECEIVED
        constraints: "RECEIVED | QUARANTINED | RELEASED | CONSUMED | DESTROYED"
      - name: parasite_destruction_required
        type: boolean
        source: computed
        description: "false when species == SHRIMP_COOKED, or when species == SALMON_ATLANTIC and harvest_method == AQUACULTURE_EXEMPT; true otherwise"
      - name: destruction_method
        type: enum
        source: system
        description: "Freezing regime recorded by the parasite-destruction call; null before it"
        default: null
        constraints: "FREEZE_MINUS20_7DAYS | FREEZE_MINUS35_15HRS | FREEZE_MINUS35_THEN_MINUS20_24HRS"
      - name: freeze_start_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the freezing regime started; null before the parasite-destruction call"
        default: null
      - name: freeze_end_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the freezing regime ended; null before the parasite-destruction call"
        default: null
      - name: freeze_min_temp_c
        type: number
        source: system
        description: "Lowest product temperature in Celsius attained during the regime; null before the parasite-destruction call"
        default: null
      - name: freeze_effective_hours
        type: number
        source: computed
        description: "round_half_up((freeze_end_at - freeze_start_at) in seconds / 3600, 2); null before the parasite-destruction call"
        default: null
      - name: parasite_destruction_compliant
        type: boolean
        source: computed
        description: "Output of the parasite_destruction_compliance calculation; true by definition when parasite_destruction_required is false"
        default: false
      - name: attested_by_chef_id
        type: string
        source: system
        description: "FK -> Chef.id; chef who attested the parasite destruction record; null before the parasite-destruction call"
        default: null
      - name: cold_chain_breach_minutes
        type: integer
        source: computed
        description: "Output of the cold_chain_breach_minutes calculation over every ColdChainReading of this lot"
        default: 0
      - name: allocated_kg
        type: number
        source: computed
        description: "Sum of consumed_fish_kg over PackLot rows of this lot whose status != VOIDED"
        default: 0
      - name: remaining_kg
        type: number
        source: computed
        description: "round_half_up(net_weight_kg - allocated_kg, 3); conserved against net_weight_kg at all times"
      - name: quarantine_reason
        type: string
        source: system
        description: "Reason text recorded when the lot moves to QUARANTINED or DESTROYED; null otherwise"
        default: null

  - name: ColdChainReading
    parent: FishLot
    common_fields: false
    fields:
      - name: fish_lot_id
        type: string
        source: system
        description: "FK -> FishLot.id; taken from the path, never from the body"
      - name: recorded_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant of the temperature reading"
      - name: temp_c
        type: number
        source: input
        description: "Product temperature in Celsius at recorded_at"
      - name: interval_minutes_from_previous
        type: integer
        source: computed
        description: "Whole minutes between the previous reading of the same lot (ordered by recorded_at ASC, tie-break created_at ASC) and this one; null for the first reading"
        default: null
      - name: breach_minutes_attributed
        type: integer
        source: computed
        description: "Minutes this reading's inbound interval contributes to the lot's breach total, per the cold_chain_breach_minutes per-interval rule; 0 for the first reading"
        default: 0
      - name: lot_breach_minutes_after
        type: integer
        source: computed
        description: "FishLot.cold_chain_breach_minutes immediately after this reading was applied"
        default: 0

  - name: PackLot
    parent: null
    common_fields: true
    fields:
      - name: rice_batch_id
        type: string
        source: input
        description: "FK -> RiceBatch.id; the approved rice batch the packs were built from"
      - name: fish_lot_id
        type: string
        source: input
        description: "FK -> FishLot.id; the released fish lot the packs draw from"
      - name: sku_code
        type: string
        source: input
        description: "Pack SKU code"
      - name: pack_count
        type: integer
        source: input
        description: "Number of retail packs built in this lot"
        constraints: "> 0"
      - name: list_price_cents
        type: integer
        source: input
        description: "Full shelf price per pack in cents"
        constraints: "> 0"
      - name: produced_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the packs were placed in the case"
      - name: shelf_expiry_at
        type: datetime
        source: computed
        description: "produced_at + SHELF_LIFE_MINUTES minutes"
      - name: status
        type: enum
        source: system
        description: "Pack lot shelf state"
        default: ON_SHELF
        constraints: "ON_SHELF | MARKED_DOWN | SOLD_OUT | DISCARDED | VOIDED"
      - name: markdown_price_cents
        type: integer
        source: computed
        description: "Binding markdown price selected by LicenseAgreement.markdown_policy, set by the markdown transition; null before it"
        default: null
      - name: advisory_markdown_price_cents
        type: integer
        source: computed
        description: "The non-binding markdown variant computed on the same inputs, recorded for franchisor reporting; null before the markdown transition"
        default: null
      - name: markdown_variant_applied
        type: enum
        source: computed
        description: "Which markdown variant was binding at markdown time"
        default: null
        constraints: "PRORATED_REMAINING_LIFE | FLAT_STEP"
      - name: consumed_fish_kg
        type: number
        source: computed
        description: "round_half_up(pack_count * FISH_KG_PER_PACK, 3); debited from FishLot.allocated_kg while status != VOIDED"
      - name: sold_count
        type: integer
        source: computed
        description: "Sum of units_sold over reconciled PosSalesFeed lines that name this pack lot"
        default: 0
      - name: discarded_count
        type: integer
        source: computed
        description: "Sum of discarded_count over DiscardEvent rows of this pack lot"
        default: 0
      - name: unsold_count
        type: integer
        source: computed
        description: "pack_count - sold_count - discarded_count; conserved at all times"
      - name: void_reason
        type: string
        source: system
        description: "Reason text recorded when the lot moves to VOIDED; null otherwise"
        default: null

  - name: DiscardEvent
    parent: PackLot
    common_fields: false
    fields:
      - name: pack_lot_id
        type: string
        source: system
        description: "FK -> PackLot.id; taken from the path, never from the body"
      - name: reason
        type: enum
        source: input
        description: "Why the packs were discarded; drives settlement credit eligibility"
        constraints: "SHELF_LIFE_EXPIRED | TEMP_ABUSE | AUDIT_LOCKDOWN | VARIANCE_REJECTED"
      - name: discarded_count
        type: integer
        source: computed
        description: "Number of packs destroyed by this event"
        constraints: "> 0"
      - name: unit_value_cents
        type: integer
        source: computed
        description: "PackLot.list_price_cents at the moment of the discard"
      - name: discard_value_cents
        type: integer
        source: computed
        description: "discarded_count * unit_value_cents"
      - name: settlement_credit_eligible
        type: boolean
        source: computed
        description: "true when reason IN {SHELF_LIFE_EXPIRED, TEMP_ABUSE}; false when reason IN {AUDIT_LOCKDOWN, VARIANCE_REJECTED}"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that recorded the discard; audit trail only, never an input to any business decision"

  - name: PosSalesFeed
    parent: null
    common_fields: true
    fields:
      - name: host_store_id
        type: string
        source: input
        description: "FK -> HostStore.id; the host store whose registers produced the feed"
      - name: business_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the register totals belong to"
      - name: gross_sales_cents
        type: integer
        source: input
        description: "Total sushi sales rung at the host store registers for business_date, markdown sales included"
        constraints: ">= 0"
      - name: markdown_sales_cents
        type: integer
        source: input
        description: "Portion of gross_sales_cents rung at a marked-down price"
        constraints: ">= 0 and <= gross_sales_cents"
      - name: full_price_units
        type: integer
        source: input
        description: "Pack units rung at full price"
        constraints: ">= 0"
      - name: markdown_units
        type: integer
        source: input
        description: "Pack units rung at a marked-down price"
        constraints: ">= 0"
      - name: lines
        type: array
        source: input
        description: "Per-pack-lot register lines, each an object { pack_lot_id, units_sold, was_markdown }; may be empty when the host register cannot attribute units"
        default: []
      - name: status
        type: enum
        source: system
        description: "Feed reconciliation state"
        default: SUBMITTED
        constraints: "SUBMITTED | RECONCILED | REJECTED"
      - name: reconciled_unit_total
        type: integer
        source: computed
        description: "Sum of units_sold over lines, set by the reconcile transition"
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: "Reason text recorded by the reject transition; null otherwise"
        default: null

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - name: license_agreement_id
        type: string
        source: input
        description: "FK -> LicenseAgreement.id; the agreement being settled"
      - name: period_start
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD) of the settlement period, inclusive"
      - name: period_end
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD) of the settlement period, inclusive"
      - name: status
        type: enum
        source: system
        description: "Settlement statement lifecycle state"
        default: DRAFT
        constraints: "DRAFT | ISSUED | ACKNOWLEDGED | DISPUTED | PAID | VOID"
      - name: gross_sales_cents
        type: integer
        source: computed
        description: "Sum of PosSalesFeed.gross_sales_cents over feeds of the agreement's host store with status == RECONCILED and business_date between period_start and period_end inclusive"
        default: 0
      - name: markdown_sales_cents
        type: integer
        source: computed
        description: "Same input set as gross_sales_cents, summing markdown_sales_cents"
        default: 0
      - name: settlement_base_cents
        type: integer
        source: computed
        description: "gross_sales_cents under the GROSS_SALES variant; gross_sales_cents - markdown_sales_cents under the NET_OF_MARKDOWN variant"
        default: 0
      - name: binding_share_cents
        type: integer
        source: computed
        description: "Tiered share on the base of the variant named by LicenseAgreement.revenue_share_model"
        default: 0
      - name: advisory_share_cents
        type: integer
        source: computed
        description: "Tiered share on the base of the other variant, reported but not billed"
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: "binding_share_cents - advisory_share_cents"
        default: 0
      - name: space_shortfall_credit_cents
        type: integer
        source: computed
        description: "Space obligation credit, capped at SPACE_CREDIT_CAP_PCT of binding_share_cents"
        default: 0
      - name: period_discard_value_cents
        type: integer
        source: computed
        description: "Sum of DiscardEvent.discard_value_cents over EVERY discard event dated inside the period, credit-eligible or not; reported for transparency and never netted against the share"
        default: 0
      - name: discard_credit_cents
        type: integer
        source: computed
        description: "Credit for settlement-eligible discards only, capped at DISCARD_CREDIT_CAP_PCT of binding_share_cents; an AUDIT_LOCKDOWN or VARIANCE_REJECTED discard raises period_discard_value_cents without raising this field"
        default: 0
      - name: net_due_cents
        type: integer
        source: computed
        description: "max(0, binding_share_cents - space_shortfall_credit_cents - discard_credit_cents)"
        default: 0
      - name: binding_variant
        type: enum
        source: computed
        description: "Which revenue-share variant was binding at issue time"
        default: null
        constraints: "GROSS_SALES | NET_OF_MARKDOWN"
      - name: revision_round
        type: integer
        source: computed
        description: "Starts at 1; incremented by every revise transition out of DISPUTED"
        default: 1
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FranchisorOps user that created the DRAFT; compared against the issuing user for segregation of duties"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FranchisorOps user that issued the statement; null before issue"
        default: null
      - name: superseded_statement_id
        type: string
        source: system
        description: "FK -> SettlementStatement.id; set on the newly created DRAFT when it supersedes an existing DRAFT for the same agreement and period; null otherwise"
        default: null
      - name: dispute_reason
        type: string
        source: system
        description: "Reason text recorded by the dispute transition; null otherwise"
        default: null
      - name: revision_note
        type: string
        source: system
        description: "Note recorded by the most recent revise transition; null otherwise"
        default: null
      - name: void_reason
        type: string
        source: system
        description: "Reason text recorded when the statement moves to VOID, including supersede cascades; null otherwise"
        default: null
      - name: paid_amount_cents
        type: integer
        source: system
        description: "Amount remitted by the host store; null before payment"
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant of remittance; null before payment"
        default: null

  - name: FoodSafetyAudit
    parent: null
    common_fields: true
    fields:
      - name: kiosk_id
        type: string
        source: input
        description: "FK -> Kiosk.id; the kiosk under audit"
      - name: scheduled_for
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the audit is scheduled for"
      - name: status
        type: enum
        source: system
        description: "Audit lifecycle state; REVERIFICATION can cycle back to CORRECTIVE_ACTION_PENDING"
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | CORRECTIVE_ACTION_PENDING | REVERIFICATION | CLOSED | ESCALATED_CLOSURE"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityAuditor that created the audit; the verifying auditor must differ from it"
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityAuditor that performed the last verification; null before the first verify call"
        default: null
      - name: round_count
        type: integer
        source: computed
        description: "Corrective-action round counter; starts at 1 and increments on every failed verification"
        default: 1
      - name: critical_finding_count
        type: integer
        source: computed
        description: "Count of AuditFinding rows of this audit with severity == CRITICAL"
        default: 0
      - name: open_finding_count
        type: integer
        source: computed
        description: "Count of AuditFinding rows of this audit with status == OPEN"
        default: 0
      - name: score
        type: integer
        source: computed
        description: "max(0, 100 - sum of risk_points over AuditFinding rows of this audit with status IN {OPEN, CORRECTED})"
        default: 100
      - name: closure_outcome
        type: enum
        source: computed
        description: "PASS when the audit reached CLOSED with no findings at all; PASS_AFTER_CORRECTION when it reached CLOSED through a reverification; ESCALATED when it reached ESCALATED_CLOSURE; null before either"
        default: null
        constraints: "PASS | PASS_AFTER_CORRECTION | ESCALATED"

  - name: AuditFinding
    parent: FoodSafetyAudit
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: system
        description: "FK -> FoodSafetyAudit.id; taken from the path, never from the body"
      - name: severity
        type: enum
        source: input
        description: "Finding severity, which fixes its risk weight"
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: finding_code
        type: string
        source: input
        description: "Standard finding code from the Hissho audit checklist"
      - name: description
        type: string
        source: input
        description: "Auditor narrative for the finding"
      - name: status
        type: enum
        source: system
        description: "Finding remediation state"
        default: OPEN
        constraints: "OPEN | CORRECTED | VERIFIED | WAIVED"
      - name: risk_points
        type: integer
        source: computed
        description: "SEVERITY_POINTS[severity]: MINOR 1, MAJOR 4, CRITICAL 10"
      - name: correction_note
        type: string
        source: system
        description: "Chef narrative recorded by the correct transition; null otherwise"
        default: null
      - name: waiver_rationale
        type: string
        source: system
        description: "FranchisorOps narrative recorded by the waive transition; null otherwise"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /kiosk-ops/license-agreements/{id}/activate"
        actor: FranchisorOps
        preconditions:
          - "status == DRAFT"
          - "HostStore.pos_integration_status == CONNECTED"
        side_effects:
          - "recomputes space_shortfall_sqft from the host store's attested figures"
          - "re-derives HostStore.space_compliance_state against this agreement's obligations"
          - "increments LicenseAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /kiosk-ops/license-agreements/{id}/suspend"
        actor: FranchisorOps
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "records suspension_reason"
          - "every Kiosk of this agreement with operational_state == OPERATING is suspended, running the full kiosk-suspension cascade for each"
          - "sets active_kiosk_count to 0"
          - "increments LicenseAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /kiosk-ops/license-agreements/{id}/activate"
        actor: FranchisorOps
        preconditions:
          - "status == SUSPENDED"
          - "HostStore.pos_integration_status == CONNECTED"
        side_effects:
          - "clears suspension_reason"
          - "kiosks are NOT auto-reinstated; each requires its own reinstate call"
          - "increments LicenseAgreement.version by 1"
        note: "DRAFT->ACTIVE and SUSPENDED->ACTIVE share one endpoint; the agreement cycles ACTIVE<->SUSPENDED any number of times"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /kiosk-ops/license-agreements/{id}/terminate"
        actor: FranchisorOps
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
          - "no SettlementStatement of this agreement has status IN {ISSUED, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "every Kiosk of this agreement with operational_state IN {PROVISIONING, OPERATING, SUSPENDED} moves to DECOMMISSIONED"
          - "sets active_kiosk_count to 0"
          - "increments LicenseAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /kiosk-ops/license-agreements/{id}/terminate"
        actor: FranchisorOps
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
          - "no SettlementStatement of this agreement has status IN {ISSUED, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "same as ACTIVE->TERMINATED"
          - "increments LicenseAgreement.version by 1"

  - entity: Chef
    initial_state: CANDIDATE
    terminal_states: []
    transitions:
      - from: CANDIDATE
        to: TRAINEE
        trigger: "POST /kiosk-ops/chefs/{id}/training"
        actor: FranchisorOps
        preconditions:
          - "status == CANDIDATE"
        side_effects:
          - "adds training_hours to training_hours_logged"
      - from: TRAINEE
        to: TRAINEE
        trigger: "POST /kiosk-ops/chefs/{id}/training"
        actor: FranchisorOps
        preconditions:
          - "status == TRAINEE"
        side_effects:
          - "adds training_hours to training_hours_logged"
        note: "self-loop: training hours accumulate across any number of calls"
      - from: TRAINEE
        to: CERTIFIED
        trigger: "POST /kiosk-ops/chefs/{id}/certifications (system evaluation after each issuance)"
        actor: FranchisorOps
        preconditions:
          - "status == TRAINEE"
          - "training_hours_logged >= MIN_TRAINING_HOURS"
          - "a Certification with cert_type == FOOD_HANDLER and status == VALID exists"
          - "a Certification with cert_type == HACCP_RICE_ACIDIFICATION and status == VALID exists"
        side_effects:
          - "recomputes food_handler_cert_expires_at, haccp_cert_expires_at, valid_cert_count"
          - "if assigned_kiosk_id is not null, recomputes Kiosk.certified_chef_count on that kiosk"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /kiosk-ops/chefs/{id}/certifications/{certification_id}/revoke, or the clock-set endpoint expiring a required certification"
        actor: QualityAuditor
        preconditions:
          - "status == CERTIFIED"
          - "the revoked or expired certification has cert_type IN {FOOD_HANDLER, HACCP_RICE_ACIDIFICATION}"
        side_effects:
          - "recomputes valid_cert_count and the two cert expiry fields"
          - "if assigned_kiosk_id is not null, decrements Kiosk.certified_chef_count and recomputes that kiosk's posture inputs"
          - "the kiosk is NOT auto-suspended; production plans created afterwards see the reduced staffing ceiling"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /kiosk-ops/chefs/{id}/certifications (system evaluation after each issuance)"
        actor: FranchisorOps
        preconditions:
          - "status == SUSPENDED"
          - "training_hours_logged >= MIN_TRAINING_HOURS"
          - "a Certification with cert_type == FOOD_HANDLER and status == VALID exists"
          - "a Certification with cert_type == HACCP_RICE_ACIDIFICATION and status == VALID exists"
        side_effects:
          - "recomputes valid_cert_count and the two cert expiry fields"
          - "if assigned_kiosk_id is not null, increments Kiosk.certified_chef_count"
        note: "recertification cycle: CERTIFIED -> SUSPENDED -> CERTIFIED any number of times"

  - entity: Kiosk
    dimension: operational_state
    initial_state: PROVISIONING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROVISIONING
        to: OPERATING
        trigger: "POST /kiosk-ops/kiosks/{id}/commission"
        actor: FranchisorOps
        preconditions:
          - "operational_state == PROVISIONING"
          - "LicenseAgreement.status == ACTIVE"
          - "HostStore.pos_integration_status == CONNECTED"
          - "HostStore.space_compliance_state == COMPLIANT"
          - "the chef named by lead_chef_id has status == CERTIFIED and assigned_kiosk_id == this kiosk"
          - "that chef's haccp_cert_expires_at is strictly after the logical clock"
        side_effects:
          - "sets lead_chef_id and commissioned_on"
          - "freezes daily_pack_cap = floor(HostStore.refrigerated_case_linear_ft * CASE_PACKS_PER_LINEAR_FT)"
          - "recomputes certified_chef_count"
          - "re-derives sanitation_posture from risk_points (CLEAR on a fresh kiosk)"
          - "increments LicenseAgreement.active_kiosk_count by 1"
      - from: OPERATING
        to: SUSPENDED
        trigger: "POST /kiosk-ops/kiosks/{id}/suspend, or the ESCALATED_CLOSURE audit transition, or the LicenseAgreement suspend cascade"
        actor: FranchisorOps
        preconditions:
          - "operational_state == OPERATING"
        side_effects:
          - "records suspension_reason"
          - "CASCADE LINK 1: every ProductionPlan of this kiosk with status IN {DRAFT, RELEASED, LOCKED} moves to VOIDED with void_reason KIOSK_SUSPENDED"
          - "CASCADE LINK 2: because those plans became VOIDED, every RiceBatch of each voided plan with status NOT IN {REJECTED, CONSUMED} moves to REJECTED with rejection_reason PLAN_VOIDED"
          - "CASCADE LINK 3: because those plans became VOIDED, every PackLot whose rice batch belongs to one of those voided plans and whose status is ON_SHELF or MARKED_DOWN moves to DISCARDED and one DiscardEvent with reason AUDIT_LOCKDOWN and discarded_count == the lot's unsold_count is appended; this link fires whether the batch itself was rejectable or had already been CONSUMED by the pack lot"
          - "SIBLING OF LINK 3: also because those plans became VOIDED, their RiceBatches not already REJECTED or CONSUMED move to REJECTED with rejection_reason PLAN_VOIDED"
          - "CASCADE LINK 4: because those DiscardEvents were appended, every SettlementStatement of this kiosk's LicenseAgreement with status == DRAFT recomputes period_discard_value_cents, discard_credit_cents and net_due_cents from its preview input set; an AUDIT_LOCKDOWN discard raises the first of the three and leaves the other two unchanged"
          - "decrements LicenseAgreement.active_kiosk_count by 1"
          - "sanitation_posture is NOT changed by this transition; the two dimensions move independently"
      - from: SUSPENDED
        to: OPERATING
        trigger: "POST /kiosk-ops/kiosks/{id}/reinstate"
        actor: FranchisorOps
        preconditions:
          - "operational_state == SUSPENDED"
          - "LicenseAgreement.status == ACTIVE"
          - "sanitation_posture != LOCKDOWN"
          - "no FoodSafetyAudit of this kiosk has status IN {IN_PROGRESS, CORRECTIVE_ACTION_PENDING, REVERIFICATION}"
          - "the chef named by lead_chef_id has status == CERTIFIED"
        side_effects:
          - "clears suspension_reason"
          - "recomputes certified_chef_count and re-derives sanitation_posture"
          - "increments LicenseAgreement.active_kiosk_count by 1"
        note: "OPERATING <-> SUSPENDED is a cycle traversable any number of times"
      - from: OPERATING
        to: DECOMMISSIONED
        trigger: "POST /kiosk-ops/kiosks/{id}/decommission, or the LicenseAgreement terminate cascade"
        actor: FranchisorOps
        preconditions:
          - "operational_state IN {PROVISIONING, OPERATING, SUSPENDED}"
          - "no PackLot of this kiosk has status IN {ON_SHELF, MARKED_DOWN}"
        side_effects:
          - "runs the same four cascade links as OPERATING->SUSPENDED for any remaining non-terminal plans and batches"
          - "sets active_kiosk_count on the LicenseAgreement to the recounted number of OPERATING kiosks"
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /kiosk-ops/kiosks/{id}/decommission, or the LicenseAgreement terminate cascade"
        actor: FranchisorOps
        preconditions:
          - "operational_state IN {PROVISIONING, OPERATING, SUSPENDED}"
          - "no PackLot of this kiosk has status IN {ON_SHELF, MARKED_DOWN}"
        side_effects:
          - "same as OPERATING->DECOMMISSIONED"
      - from: PROVISIONING
        to: DECOMMISSIONED
        trigger: "POST /kiosk-ops/kiosks/{id}/decommission, or the LicenseAgreement terminate cascade"
        actor: FranchisorOps
        preconditions:
          - "operational_state IN {PROVISIONING, OPERATING, SUSPENDED}"
        side_effects:
          - "no cascade fires: a PROVISIONING kiosk owns no plans"

  - entity: Kiosk
    dimension: sanitation_posture
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: WATCH
        trigger: "system re-derivation of sanitation_posture after any risk-input change"
        actor: system
        preconditions:
          - "kiosk_risk_points result >= WATCH_THRESHOLD and < RESTRICTED_THRESHOLD"
          - "open_critical_finding_count == 0"
        side_effects:
          - "later ProductionPlan creations apply POSTURE_FACTOR[WATCH]"
      - from: WATCH
        to: RESTRICTED
        trigger: "system re-derivation of sanitation_posture after any risk-input change"
        actor: system
        preconditions:
          - "kiosk_risk_points result >= RESTRICTED_THRESHOLD and < LOCKDOWN_THRESHOLD"
          - "open_critical_finding_count == 0"
        side_effects:
          - "later ProductionPlan creations apply POSTURE_FACTOR[RESTRICTED]"
      - from: RESTRICTED
        to: LOCKDOWN
        trigger: "system re-derivation of sanitation_posture after any risk-input change"
        actor: system
        preconditions:
          - "kiosk_risk_points result >= LOCKDOWN_THRESHOLD, OR open_critical_finding_count >= 1"
        side_effects:
          - "ProductionPlan creation on this kiosk is refused with ERR_KIOSK_POSTURE_LOCKDOWN"
          - "every ProductionPlan of this kiosk with status IN {DRAFT, RELEASED} moves to VOIDED with void_reason POSTURE_LOCKDOWN"
          - "operational_state is NOT changed; a LOCKDOWN kiosk stays OPERATING until an explicit suspend"
      - from: CLEAR
        to: LOCKDOWN
        trigger: "system re-derivation of sanitation_posture when a CRITICAL finding is submitted against the kiosk"
        actor: system
        preconditions:
          - "open_critical_finding_count >= 1"
        side_effects:
          - "ProductionPlan creation on this kiosk is refused with ERR_KIOSK_POSTURE_LOCKDOWN"
          - "every ProductionPlan of this kiosk with status IN {DRAFT, RELEASED} moves to VOIDED with void_reason POSTURE_LOCKDOWN"
          - "operational_state is NOT changed; a LOCKDOWN kiosk stays OPERATING until an explicit suspend"
        note: "the CRITICAL override jumps straight from CLEAR to LOCKDOWN, skipping the WATCH and RESTRICTED bands, so the posture dimension is not a monotone ladder"
      - from: LOCKDOWN
        to: WATCH
        trigger: "system re-derivation of sanitation_posture after findings are VERIFIED or WAIVED"
        actor: system
        preconditions:
          - "kiosk_risk_points result >= WATCH_THRESHOLD and < RESTRICTED_THRESHOLD"
          - "open_critical_finding_count == 0"
        side_effects:
          - "posture gating is lifted for later plan creations"
      - from: LOCKDOWN
        to: CLEAR
        trigger: "system re-derivation of sanitation_posture after findings are VERIFIED or WAIVED"
        actor: system
        preconditions:
          - "kiosk_risk_points result < WATCH_THRESHOLD"
          - "open_critical_finding_count == 0"
        side_effects:
          - "posture gating is lifted for later plan creations"
      - from: RESTRICTED
        to: CLEAR
        trigger: "system re-derivation of sanitation_posture after findings are VERIFIED or WAIVED"
        actor: system
        preconditions:
          - "kiosk_risk_points result < WATCH_THRESHOLD"
          - "open_critical_finding_count == 0"
        side_effects:
          - "posture gating is lifted for later plan creations"
      - from: WATCH
        to: CLEAR
        trigger: "system re-derivation of sanitation_posture after findings are VERIFIED or WAIVED"
        actor: system
        preconditions:
          - "kiosk_risk_points result < WATCH_THRESHOLD"
          - "open_critical_finding_count == 0"
        side_effects:
          - "posture gating is lifted for later plan creations"
    note: "Second, independent state dimension on the same Kiosk row. sanitation_posture and operational_state never constrain each other's transitions; only the two together decide whether production may be planned."

  - entity: Certification
    initial_state: VALID
    terminal_states: [REVOKED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "POST /kiosk-ops/_clock/set_current_utc advancing the logical clock to or past expires_at"
        actor: system
        preconditions:
          - "status == VALID"
          - "logical clock >= expires_at"
        side_effects:
          - "recomputes Chef.valid_cert_count and the owning chef's two cert expiry fields"
          - "if cert_type IN {FOOD_HANDLER, HACCP_RICE_ACIDIFICATION} and the chef is CERTIFIED, the chef moves to SUSPENDED"
      - from: VALID
        to: REVOKED
        trigger: "POST /kiosk-ops/chefs/{id}/certifications/{certification_id}/revoke"
        actor: QualityAuditor
        preconditions:
          - "status == VALID"
        side_effects:
          - "records revocation_reason"
          - "recomputes Chef.valid_cert_count and the owning chef's two cert expiry fields"
          - "if cert_type IN {FOOD_HANDLER, HACCP_RICE_ACIDIFICATION} and the chef is CERTIFIED, the chef moves to SUSPENDED and the assigned kiosk's certified_chef_count is decremented"

  - entity: ProductionPlan
    initial_state: DRAFT
    terminal_states: [RECONCILED, VOIDED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /kiosk-ops/production-plans/{id}/release"
        actor: FranchiseChef
        preconditions:
          - "status == DRAFT"
          - "Kiosk.operational_state == OPERATING"
          - "Kiosk.sanitation_posture != LOCKDOWN"
          - "planned_pack_count > 0"
        side_effects:
          - "the plan becomes the only plan rice batches may be created against for its kiosk and date"
      - from: RELEASED
        to: LOCKED
        trigger: "POST /kiosk-ops/production-plans/{id}/lock"
        actor: FranchiseChef
        preconditions:
          - "status == RELEASED"
          - "at least one RiceBatch of this plan has status IN {APPROVED, VARIANCE_APPROVED, CONSUMED}"
        side_effects:
          - "no further RiceBatch may be created against the plan"
      - from: LOCKED
        to: RECONCILED
        trigger: "POST /kiosk-ops/production-plans/{id}/reconcile"
        actor: FranchisorOps
        preconditions:
          - "status == LOCKED"
          - "every PosSalesFeed of the kiosk's host store with business_date == production_date has status IN {RECONCILED, REJECTED}"
        side_effects:
          - "recomputes actual_pack_count"
          - "sets forecast_variance_pct from the plan_forecast_variance calculation"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /kiosk-ops/production-plans/{id}/void, supersede by a newer DRAFT plan for the same kiosk and production_date, the kiosk-suspension cascade, or the posture LOCKDOWN re-derivation"
        actor: FranchisorOps
        preconditions:
          - "status IN {DRAFT, RELEASED, LOCKED}"
        side_effects:
          - "records void_reason: the reason supplied to POST /kiosk-ops/production-plans/{id}/void on the manual path, or SUPERSEDED, KIOSK_SUSPENDED or POSTURE_LOCKDOWN when the void is cascade-driven"
          - "every RiceBatch of this plan with status NOT IN {REJECTED, CONSUMED} moves to REJECTED with rejection_reason PLAN_VOIDED"
          - "every PackLot whose rice batch belongs to this plan and whose status is ON_SHELF or MARKED_DOWN moves to DISCARDED with a DiscardEvent whose reason is AUDIT_LOCKDOWN, which is NOT settlement_credit_eligible"
          - "actual_pack_count is recomputed after those discards"
      - from: RELEASED
        to: VOIDED
        trigger: "POST /kiosk-ops/production-plans/{id}/void, the kiosk-suspension cascade, or the posture LOCKDOWN re-derivation"
        actor: FranchisorOps
        preconditions:
          - "status IN {DRAFT, RELEASED, LOCKED}"
        side_effects:
          - "same as DRAFT->VOIDED"
      - from: LOCKED
        to: VOIDED
        trigger: "POST /kiosk-ops/production-plans/{id}/void or the kiosk-suspension cascade"
        actor: FranchisorOps
        preconditions:
          - "status IN {DRAFT, RELEASED, LOCKED}"
        side_effects:
          - "same as DRAFT->VOIDED"

  - entity: RiceBatch
    initial_state: MIXING
    terminal_states: [REJECTED]
    transitions:
      - from: MIXING
        to: ACIDIFYING
        trigger: "POST /kiosk-ops/rice-batches/{id}/acidification-reading"
        actor: FranchiseChef
        preconditions:
          - "status == MIXING"
          - "ProductionPlan.status == RELEASED"
        side_effects:
          - "records measured_ph, ph_measured_at, max_temp_c"
      - from: ACIDIFYING
        to: APPROVED
        trigger: "POST /kiosk-ops/rice-batches/{id}/verify-ttc"
        actor: FranchiseChef
        preconditions:
          - "status == ACIDIFYING"
          - "rice_acidification_disposition evaluates to APPROVED"
        side_effects:
          - "sets exposure_minutes"
          - "no risk points are added on this branch"
      - from: ACIDIFYING
        to: VARIANCE_REQUIRED
        trigger: "POST /kiosk-ops/rice-batches/{id}/verify-ttc"
        actor: FranchiseChef
        preconditions:
          - "status == ACIDIFYING"
          - "rice_acidification_disposition evaluates to VARIANCE_REQUIRED"
        side_effects:
          - "sets exposure_minutes"
          - "the batch may not be packed until a variance is documented and approved"
      - from: ACIDIFYING
        to: REJECTED
        trigger: "POST /kiosk-ops/rice-batches/{id}/verify-ttc"
        actor: FranchiseChef
        preconditions:
          - "status == ACIDIFYING"
          - "rice_acidification_disposition evaluates to REJECTED"
        side_effects:
          - "sets exposure_minutes and rejection_reason TTC_HARD_FAIL"
          - "this branch is not documentable: no variance path exists out of REJECTED"
      - from: VARIANCE_REQUIRED
        to: VARIANCE_PENDING
        trigger: "POST /kiosk-ops/rice-batches/{id}/variance-request"
        actor: FranchiseChef
        preconditions:
          - "status == VARIANCE_REQUIRED"
          - "the acting chef has a VALID Certification with cert_type == HACCP_RICE_ACIDIFICATION"
        side_effects:
          - "records documented_ph, documented_hold_minutes, corrective_narrative, variance_submitted_by_chef_id"
      - from: VARIANCE_PENDING
        to: VARIANCE_APPROVED
        trigger: "POST /kiosk-ops/rice-batches/{id}/variance-decision with decision == APPROVE"
        actor: QualityAuditor
        preconditions:
          - "status == VARIANCE_PENDING"
          - "documented_ph <= VARIANCE_PH_CEILING"
          - "documented_hold_minutes <= EXPOSURE_LIMIT_MIN"
        side_effects:
          - "records variance_reviewed_by_user_id"
          - "adds VARIANCE_APPROVED_POINTS to the kiosk's risk inputs and re-derives sanitation_posture"
      - from: VARIANCE_PENDING
        to: REJECTED
        trigger: "POST /kiosk-ops/rice-batches/{id}/variance-decision with decision == REJECT"
        actor: QualityAuditor
        preconditions:
          - "status == VARIANCE_PENDING"
        side_effects:
          - "records variance_reviewed_by_user_id and rejection_reason VARIANCE_DENIED"
          - "no pack lot can ever be built from this batch"
      - from: APPROVED
        to: CONSUMED
        trigger: "POST /kiosk-ops/pack-lots"
        actor: FranchiseChef
        preconditions:
          - "status IN {APPROVED, VARIANCE_APPROVED}"
        side_effects:
          - "the batch is spent; a second pack lot against it is refused"
      - from: VARIANCE_APPROVED
        to: CONSUMED
        trigger: "POST /kiosk-ops/pack-lots"
        actor: FranchiseChef
        preconditions:
          - "status IN {APPROVED, VARIANCE_APPROVED}"
        side_effects:
          - "same as APPROVED->CONSUMED"
      - from: CONSUMED
        to: REJECTED
        trigger: "POST /kiosk-ops/rice-batches/{id}/revoke-variance"
        actor: QualityAuditor
        preconditions:
          - "status == CONSUMED"
          - "documented_ph IS NOT NULL (the batch shipped on an approved HACCP variance)"
        side_effects:
          - "records rejection_reason VARIANCE_REVOKED"
          - "every PackLot of this batch with status IN {ON_SHELF, MARKED_DOWN} moves to DISCARDED and one DiscardEvent with reason VARIANCE_REJECTED and discarded_count == the lot's unsold_count is appended"
          - "because those pack lots left the shelf, the owning ProductionPlan recomputes actual_pack_count"
          - "removes VARIANCE_APPROVED_POINTS from the kiosk's risk inputs and re-derives sanitation_posture"
        note: "revert edge out of a near-terminal state; the discards it creates are NOT settlement-credit eligible"
      - from: MIXING
        to: REJECTED
        trigger: "the plan-void cascade"
        actor: system
        preconditions:
          - "status NOT IN {REJECTED, CONSUMED}"
          - "the owning ProductionPlan moved to VOIDED"
        side_effects:
          - "records rejection_reason PLAN_VOIDED"
      - from: ACIDIFYING
        to: REJECTED
        trigger: "the plan-void cascade"
        actor: system
        preconditions:
          - "status NOT IN {REJECTED, CONSUMED}"
          - "the owning ProductionPlan moved to VOIDED"
        side_effects:
          - "records rejection_reason PLAN_VOIDED"
      - from: APPROVED
        to: REJECTED
        trigger: "the plan-void cascade"
        actor: system
        preconditions:
          - "status NOT IN {REJECTED, CONSUMED}"
          - "the owning ProductionPlan moved to VOIDED"
        side_effects:
          - "records rejection_reason PLAN_VOIDED"
          - "every PackLot of this batch with status IN {ON_SHELF, MARKED_DOWN} moves to DISCARDED with a DiscardEvent whose reason is AUDIT_LOCKDOWN"

  - entity: FishLot
    initial_state: RECEIVED
    terminal_states: [DESTROYED]
    transitions:
      - from: RECEIVED
        to: RELEASED
        trigger: "POST /kiosk-ops/fish-lots/{id}/release"
        actor: QualityAuditor
        preconditions:
          - "status == RECEIVED"
          - "parasite_destruction_required == false OR parasite_destruction_compliant == true"
          - "cold_chain_breach_minutes <= QUARANTINE_BREACH_LIMIT_MIN"
        side_effects:
          - "remaining_kg is set to net_weight_kg minus allocated_kg"
          - "the lot becomes eligible as a PackLot fish source"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /kiosk-ops/fish-lots/{id}/cold-chain-readings pushing cold_chain_breach_minutes above QUARANTINE_BREACH_LIMIT_MIN"
        actor: system
        preconditions:
          - "status IN {RECEIVED, RELEASED}"
          - "cold_chain_breach_minutes > QUARANTINE_BREACH_LIMIT_MIN"
        side_effects:
          - "records quarantine_reason COLD_CHAIN_BREACH"
          - "adds COLD_CHAIN_BREACH_POINTS to the kiosk's risk inputs and re-derives sanitation_posture"
      - from: RELEASED
        to: QUARANTINED
        trigger: "POST /kiosk-ops/fish-lots/{id}/cold-chain-readings pushing cold_chain_breach_minutes above QUARANTINE_BREACH_LIMIT_MIN"
        actor: system
        preconditions:
          - "status IN {RECEIVED, RELEASED}"
          - "cold_chain_breach_minutes > QUARANTINE_BREACH_LIMIT_MIN"
        side_effects:
          - "records quarantine_reason COLD_CHAIN_BREACH"
          - "CASCADE: every PackLot built from this lot with status IN {ON_SHELF, MARKED_DOWN} moves to DISCARDED with a DiscardEvent whose reason is TEMP_ABUSE"
          - "CASCADE: because those pack lots left the shelf, each affected ProductionPlan recomputes actual_pack_count"
          - "adds COLD_CHAIN_BREACH_POINTS to the kiosk's risk inputs and re-derives sanitation_posture"
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /kiosk-ops/fish-lots/{id}/release"
        actor: QualityAuditor
        preconditions:
          - "status == QUARANTINED"
          - "a release_rationale is supplied"
          - "parasite_destruction_required == false OR parasite_destruction_compliant == true"
        side_effects:
          - "clears quarantine_reason"
          - "the accumulated cold_chain_breach_minutes are NOT reset, so a single further breach re-quarantines immediately"
        note: "cycle edge: RELEASED -> QUARANTINED -> RELEASED may repeat any number of times"
      - from: QUARANTINED
        to: DESTROYED
        trigger: "POST /kiosk-ops/fish-lots/{id}/destroy"
        actor: QualityAuditor
        preconditions:
          - "status IN {RECEIVED, QUARANTINED}"
        side_effects:
          - "remaining_kg is set to 0"
      - from: RECEIVED
        to: DESTROYED
        trigger: "POST /kiosk-ops/fish-lots/{id}/destroy"
        actor: QualityAuditor
        preconditions:
          - "status IN {RECEIVED, QUARANTINED}"
        side_effects:
          - "remaining_kg is set to 0"
      - from: RELEASED
        to: CONSUMED
        trigger: "POST /kiosk-ops/pack-lots consuming the last available kilogram"
        actor: system
        preconditions:
          - "status == RELEASED"
          - "remaining_kg after the allocation equals 0"
        side_effects:
          - "the lot is no longer selectable as a fish source"
      - from: CONSUMED
        to: RELEASED
        trigger: "POST /kiosk-ops/pack-lots/{id}/void restoring mass to the lot"
        actor: system
        preconditions:
          - "status == CONSUMED"
          - "remaining_kg after the restoration is greater than 0"
        side_effects:
          - "allocated_kg is decreased and remaining_kg increased by exactly the voided lot's consumed_fish_kg"
        note: "compensating edge out of CONSUMED; net drift across allocate-then-void must be exactly zero"

  - entity: PackLot
    initial_state: ON_SHELF
    terminal_states: [SOLD_OUT, DISCARDED, VOIDED]
    transitions:
      - from: ON_SHELF
        to: MARKED_DOWN
        trigger: "POST /kiosk-ops/pack-lots/{id}/markdown"
        actor: FranchiseChef
        preconditions:
          - "status == ON_SHELF"
          - "the logical clock is strictly before shelf_expiry_at"
          - "unsold_count > 0"
        side_effects:
          - "sets markdown_price_cents from the binding markdown variant and advisory_markdown_price_cents from the other variant"
          - "sets markdown_variant_applied"
      - from: ON_SHELF
        to: SOLD_OUT
        trigger: "POST /kiosk-ops/pos-sales-feeds/{id}/reconcile consuming the full remaining count"
        actor: system
        preconditions:
          - "status IN {ON_SHELF, MARKED_DOWN}"
          - "unsold_count after applying the reconciled units equals 0"
        side_effects:
          - "sold_count and unsold_count are updated"
      - from: MARKED_DOWN
        to: SOLD_OUT
        trigger: "POST /kiosk-ops/pos-sales-feeds/{id}/reconcile consuming the full remaining count"
        actor: system
        preconditions:
          - "status IN {ON_SHELF, MARKED_DOWN}"
          - "unsold_count after applying the reconciled units equals 0"
        side_effects:
          - "sold_count and unsold_count are updated"
      - from: ON_SHELF
        to: DISCARDED
        trigger: "POST /kiosk-ops/pack-lots/{id}/discard, the shelf-expiry sweep on clock advance, or a cold-chain / variance / lockdown cascade"
        actor: FranchiseChef
        preconditions:
          - "status IN {ON_SHELF, MARKED_DOWN}"
          - "unsold_count > 0"
        side_effects:
          - "appends exactly one DiscardEvent with discarded_count == unsold_count and discard_value_cents from the discard valuation rule"
          - "sets discarded_count and drives unsold_count to 0"
          - "the owning ProductionPlan recomputes actual_pack_count"
          - "every DRAFT SettlementStatement covering the discard date recomputes period_discard_value_cents and, when the DiscardEvent is settlement_credit_eligible, discard_credit_cents and net_due_cents as well"
      - from: MARKED_DOWN
        to: DISCARDED
        trigger: "POST /kiosk-ops/pack-lots/{id}/discard, the shelf-expiry sweep on clock advance, or a cold-chain / variance / lockdown cascade"
        actor: FranchiseChef
        preconditions:
          - "status IN {ON_SHELF, MARKED_DOWN}"
          - "unsold_count > 0"
        side_effects:
          - "same as ON_SHELF->DISCARDED, valued at markdown_price_cents rather than list_price_cents"
      - from: ON_SHELF
        to: VOIDED
        trigger: "POST /kiosk-ops/pack-lots/{id}/void"
        actor: FranchisorOps
        preconditions:
          - "status == ON_SHELF"
          - "sold_count == 0"
        side_effects:
          - "restores consumed_fish_kg to the source FishLot exactly, decreasing allocated_kg and increasing remaining_kg"
          - "if the source FishLot was CONSUMED it returns to RELEASED"
          - "the owning ProductionPlan recomputes actual_pack_count"
          - "records void_reason"

  - entity: PosSalesFeed
    initial_state: SUBMITTED
    terminal_states: [RECONCILED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /kiosk-ops/pos-sales-feeds/{id}/reconcile"
        actor: FranchisorOps
        preconditions:
          - "status == SUBMITTED"
          - "HostStore.pos_integration_status == CONNECTED"
          - "every lines[].pack_lot_id resolves to a PackLot whose kiosk belongs to this host store"
          - "for every line, units_sold <= that pack lot's unsold_count"
        side_effects:
          - "sets reconciled_unit_total to the sum of lines[].units_sold"
          - "decrements each referenced PackLot's unsold_count and increments its sold_count; lots driven to zero become SOLD_OUT"
          - "the feed's sales totals become available to settlement"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /kiosk-ops/pos-sales-feeds/{id}/reject"
        actor: FranchisorOps
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "records rejection_reason"
          - "a REJECTED feed contributes zero to settlement but still satisfies the plan-reconcile precondition"

  - entity: SettlementStatement
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /kiosk-ops/settlement-statements/{id}/issue"
        actor: FranchisorOps
        preconditions:
          - "status == DRAFT"
          - "at least one PosSalesFeed with status == RECONCILED falls inside [period_start, period_end]"
          - "the issuing X-User-ID differs from created_by_user_id"
        side_effects:
          - "freezes all money fields"
          - "records issued_by_user_id"
          - "adds binding_share_cents to LicenseAgreement.lifetime_share_accrued_cents"
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /kiosk-ops/settlement-statements/{id}/acknowledge"
        actor: HostStoreManager
        preconditions:
          - "status == ISSUED"
          - "the acting host store manager owns the statement's host store"
        side_effects: []
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /kiosk-ops/settlement-statements/{id}/dispute"
        actor: HostStoreManager
        preconditions:
          - "status == ISSUED"
          - "the acting host store manager owns the statement's host store"
        side_effects:
          - "records dispute_reason"
          - "subtracts binding_share_cents from LicenseAgreement.lifetime_share_accrued_cents"
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /kiosk-ops/settlement-statements/{id}/revise"
        actor: FranchisorOps
        preconditions:
          - "status == DISPUTED"
          - "revision_round < 3"
        side_effects:
          - "increments revision_round by 1"
          - "recomputes every money field from the current reconciled feeds and discard events"
          - "records revision_note and clears issued_by_user_id"
        note: "cycle edge DRAFT -> ISSUED -> DISPUTED -> DRAFT, bounded by revision_round < 3"
      - from: ACKNOWLEDGED
        to: PAID
        trigger: "POST /kiosk-ops/settlement-statements/{id}/pay"
        actor: HostStoreManager
        preconditions:
          - "status == ACKNOWLEDGED"
          - "paid_amount_cents equals net_due_cents exactly"
        side_effects:
          - "records paid_amount_cents and paid_at"
      - from: DRAFT
        to: VOID
        trigger: "POST /kiosk-ops/settlement-statements/{id}/void or supersede by a newer DRAFT statement for the same agreement and period"
        actor: FranchisorOps
        preconditions:
          - "status IN {DRAFT, ISSUED, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "records void_reason"
          - "if the statement had reached ISSUED or ACKNOWLEDGED, subtracts its binding_share_cents from LicenseAgreement.lifetime_share_accrued_cents so the lifetime accrual returns to its pre-issue value exactly"
      - from: ISSUED
        to: VOID
        trigger: "POST /kiosk-ops/settlement-statements/{id}/void"
        actor: FranchisorOps
        preconditions:
          - "status IN {DRAFT, ISSUED, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "same as DRAFT->VOID, including the exact lifetime-accrual reversal"
      - from: ACKNOWLEDGED
        to: VOID
        trigger: "POST /kiosk-ops/settlement-statements/{id}/void"
        actor: FranchisorOps
        preconditions:
          - "status IN {DRAFT, ISSUED, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "same as DRAFT->VOID"
      - from: DISPUTED
        to: VOID
        trigger: "POST /kiosk-ops/settlement-statements/{id}/void"
        actor: FranchisorOps
        preconditions:
          - "status IN {DRAFT, ISSUED, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "same as DRAFT->VOID"

  - entity: FoodSafetyAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED, ESCALATED_CLOSURE]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /kiosk-ops/audits/{id}/start"
        actor: QualityAuditor
        preconditions:
          - "status == SCHEDULED"
          - "the logical clock is at or after scheduled_for"
        side_effects:
          - "records opened_by_user_id from the X-User-ID header"
          - "findings may now be appended"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /kiosk-ops/audits/{id}/submit with zero findings recorded"
        actor: QualityAuditor
        preconditions:
          - "status == IN_PROGRESS"
          - "critical_finding_count == 0"
          - "open_finding_count == 0"
        side_effects:
          - "sets score from the audit_score calculation and closure_outcome PASS"
          - "increments Kiosk.consecutive_clean_audits by 1 and subtracts CLEAN_AUDIT_CREDIT from the kiosk's risk inputs, then re-derives sanitation_posture"
        note: "a zero-finding audit skips the whole corrective-action branch: IN_PROGRESS goes straight to a terminal state"
      - from: IN_PROGRESS
        to: CORRECTIVE_ACTION_PENDING
        trigger: "POST /kiosk-ops/audits/{id}/submit with at least one finding recorded"
        actor: QualityAuditor
        preconditions:
          - "status == IN_PROGRESS"
          - "open_finding_count > 0"
        side_effects:
          - "sets score from the audit_score calculation"
          - "adds the severity-weighted finding points to the kiosk's risk inputs, resets Kiosk.consecutive_clean_audits to 0 and re-derives sanitation_posture"
          - "if critical_finding_count > 0 the kiosk's sanitation_posture is forced to LOCKDOWN regardless of the risk total"
      - from: CORRECTIVE_ACTION_PENDING
        to: REVERIFICATION
        trigger: "POST /kiosk-ops/audits/{id}/request-reverification"
        actor: HostStoreManager
        preconditions:
          - "status == CORRECTIVE_ACTION_PENDING"
          - "every AuditFinding of this audit has status IN {CORRECTED, WAIVED}"
        side_effects:
          - "increments round_count by 1"
      - from: REVERIFICATION
        to: CLOSED
        trigger: "POST /kiosk-ops/audits/{id}/verify with outcome == PASS"
        actor: QualityAuditor
        preconditions:
          - "status == REVERIFICATION"
          - "the verifying X-User-ID differs from opened_by_user_id"
        side_effects:
          - "every CORRECTED finding moves to VERIFIED and its risk_points are removed from the kiosk's risk inputs"
          - "records verified_by_user_id and closure_outcome PASS_AFTER_CORRECTION"
          - "re-derives Kiosk.sanitation_posture from the reduced risk total; a kiosk in LOCKDOWN with no remaining open critical findings may return to CLEAR, WATCH or RESTRICTED"
      - from: REVERIFICATION
        to: CORRECTIVE_ACTION_PENDING
        trigger: "POST /kiosk-ops/audits/{id}/verify with outcome == FAIL while round_count < MAX_CORRECTIVE_ROUNDS"
        actor: QualityAuditor
        preconditions:
          - "status == REVERIFICATION"
          - "round_count < MAX_CORRECTIVE_ROUNDS"
          - "the verifying X-User-ID differs from opened_by_user_id"
        side_effects:
          - "every CORRECTED finding returns to OPEN and its risk_points are re-applied to the kiosk's risk inputs"
          - "re-derives Kiosk.sanitation_posture"
        note: "cycle edge: CORRECTIVE_ACTION_PENDING -> REVERIFICATION -> CORRECTIVE_ACTION_PENDING, bounded by round_count"
      - from: REVERIFICATION
        to: ESCALATED_CLOSURE
        trigger: "POST /kiosk-ops/audits/{id}/verify with outcome == FAIL when round_count == MAX_CORRECTIVE_ROUNDS"
        actor: QualityAuditor
        preconditions:
          - "status == REVERIFICATION"
          - "round_count == MAX_CORRECTIVE_ROUNDS"
          - "the verifying X-User-ID differs from opened_by_user_id"
        side_effects:
          - "records verified_by_user_id and closure_outcome ESCALATED"
          - "CASCADE LINK 1: the audited Kiosk moves OPERATING -> SUSPENDED with suspension_reason AUDIT_ESCALATION and sanitation_posture LOCKDOWN"
          - "CASCADE LINK 2: because the kiosk became SUSPENDED, its ProductionPlans in {DRAFT, RELEASED, LOCKED} move to VOIDED with void_reason KIOSK_SUSPENDED"
          - "CASCADE LINK 3: because those plans became VOIDED, every PackLot whose rice batch belongs to one of them and whose status is ON_SHELF or MARKED_DOWN moves to DISCARDED with a DiscardEvent whose reason is AUDIT_LOCKDOWN, and their RiceBatches not already REJECTED or CONSUMED move to REJECTED"
          - "CASCADE LINK 4: because those DiscardEvents were appended, every DRAFT SettlementStatement covering the discard date recomputes period_discard_value_cents, discard_credit_cents and net_due_cents; an AUDIT_LOCKDOWN discard raises the first of the three and leaves the other two unchanged"
        note: "the same 4-link chain the Kiosk suspend endpoint drives, reached here from an audit rather than an operator action"

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: OPEN
        to: CORRECTED
        trigger: "POST /kiosk-ops/audits/{id}/findings/{finding_id}/correct"
        actor: HostStoreManager
        preconditions:
          - "status == OPEN"
          - "FoodSafetyAudit.status == CORRECTIVE_ACTION_PENDING"
        side_effects:
          - "records correction_note and decrements FoodSafetyAudit.open_finding_count"
      - from: CORRECTED
        to: VERIFIED
        trigger: "POST /kiosk-ops/audits/{id}/verify with outcome == PASS"
        actor: QualityAuditor
        preconditions:
          - "status == CORRECTED"
          - "FoodSafetyAudit.status == REVERIFICATION"
        side_effects:
          - "the finding's risk_points are removed from the kiosk's risk inputs"
          - "if severity == CRITICAL, decrements Kiosk.open_critical_finding_count"
      - from: CORRECTED
        to: OPEN
        trigger: "POST /kiosk-ops/audits/{id}/verify with outcome == FAIL while round_count < MAX_CORRECTIVE_ROUNDS"
        actor: QualityAuditor
        preconditions:
          - "status == CORRECTED"
          - "FoodSafetyAudit.status == REVERIFICATION"
        side_effects:
          - "clears correction_note and increments FoodSafetyAudit.open_finding_count"
        note: "revert edge: a finding can bounce OPEN -> CORRECTED -> OPEN"
      - from: OPEN
        to: WAIVED
        trigger: "POST /kiosk-ops/audits/{id}/findings/{finding_id}/waive"
        actor: QualityAuditor
        preconditions:
          - "status == OPEN"
          - "severity == MINOR"
          - "FoodSafetyAudit.status == CORRECTIVE_ACTION_PENDING"
        side_effects:
          - "records waiver_rationale, decrements FoodSafetyAudit.open_finding_count and removes the finding's risk_points from the kiosk's risk inputs"
        note: "MAJOR and CRITICAL findings are never waivable; only correction clears them"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-kiosk
    parent_entity: Kiosk
    write_endpoint: "POST /kiosk-ops/production-plans"
    occ_field: "expected_kiosk_version"
    description: |
      Creating a ProductionPlan against a Kiosk whose version has advanced since the
      client last observed it is rejected with a stale-version error. A newly created
      DRAFT plan legitimately supersedes any prior DRAFT plan for the same kiosk and
      production_date, so a writer holding an outdated view of the kiosk would otherwise
      silently void a plan it never saw. The stale check forces the writer to re-read
      the kiosk before the supersede takes effect.
    error_id: ERR_STALE_KIOSK_VERSION
    http_status: 412

  - rule_id: settlement-create-stale-license
    parent_entity: LicenseAgreement
    write_endpoint: "POST /kiosk-ops/settlement-statements"
    occ_field: "expected_license_agreement_version"
    description: |
      Creating a SettlementStatement against a LicenseAgreement whose version has
      advanced since the client last observed it is rejected with a stale-version error.
      A new DRAFT statement legitimately supersedes a prior DRAFT statement for the same
      agreement and period, and the money fields are derived from the agreement's
      revenue_share_model and space obligations, so a writer holding a stale agreement
      view would compute a statement against superseded terms.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: daily_production_allocation
    trigger: "POST /kiosk-ops/production-plans (computes planned_pack_count, planned_rice_kg, posture_factor_applied, binding_cap_source)"
    algorithm: threshold
    formula: |
      # Step 1 - traffic demand
      demand_packs = floor(traffic_forecast * ATTACH_RATE)

      # Step 2 - the host store's refrigerated case ceiling
      case_cap = min(
        HostStore.refrigerated_case_capacity_packs,
        floor(HostStore.refrigerated_case_linear_ft * CASE_PACKS_PER_LINEAR_FT)
      )

      # Step 3 - certified staffing ceiling
      staffing_cap = Kiosk.certified_chef_count * PACKS_PER_CERTIFIED_CHEF

      # Step 4 - the binding cap is the minimum of the three, and binding_cap_source
      # records which one bound. Ties are broken in this fixed precedence order:
      #   DEMAND, then CASE_CAPACITY, then STAFFING
      raw_cap = min(demand_packs, case_cap, staffing_cap)
      binding_cap_source = the first of [DEMAND, CASE_CAPACITY, STAFFING]
                           whose own value equals raw_cap

      # Step 5 - the sanitation posture attenuates the cap AFTER the minimum is taken,
      # never before; attenuating each candidate first would change which cap binds.
      posture_factor_applied = POSTURE_FACTOR[Kiosk.sanitation_posture]
      planned_pack_count = floor(raw_cap * posture_factor_applied)

      # Step 6 - rice mass, 2 dp round_half_up
      planned_rice_kg = round_half_up(planned_pack_count * RICE_KG_PER_PACK, 2)

      # A LOCKDOWN posture yields planned_pack_count == 0, and the plan cannot be
      # released because release requires planned_pack_count > 0.
    input_set: "the plan's Kiosk (for certified_chef_count and sanitation_posture) and that kiosk's LicenseAgreement.host_store (for case capacity); Chefs count toward certified_chef_count only while status == CERTIFIED"
    constants:
      ATTACH_RATE: 0.018
      CASE_PACKS_PER_LINEAR_FT: 9
      PACKS_PER_CERTIFIED_CHEF: 200
      RICE_KG_PER_PACK: 0.12
      POSTURE_FACTOR_CLEAR: 1.00
      POSTURE_FACTOR_WATCH: 0.85
      POSTURE_FACTOR_RESTRICTED: 0.50
      POSTURE_FACTOR_LOCKDOWN: 0.00
    precision: "planned_pack_count is an integer (floor at each step); planned_rice_kg is 2 decimal places, round_half_up"
    variants: []

  - name: rice_acidification_disposition
    trigger: "POST /kiosk-ops/rice-batches/{id}/verify-ttc (sets exposure_minutes and selects the ACIDIFYING exit branch)"
    algorithm: threshold
    formula: |
      exposure_minutes = whole minutes between hold_start_at and hold_end_at
                         (both inclusive endpoints of a closed interval, so an exactly
                          240-minute hold has exposure_minutes == 240)

      ph_ok       = measured_ph <= PH_LIMIT          # 4.20 exactly passes
      time_ok     = exposure_minutes <= EXPOSURE_LIMIT_MIN   # 240 exactly passes
      temp_ok     = max_temp_c <= MAX_HOLD_TEMP_C            # 21.0 exactly passes

      if ph_ok and time_ok and temp_ok:
          disposition = APPROVED
      elif (not ph_ok) and measured_ph <= VARIANCE_PH_CEILING and time_ok and temp_ok:
          # marginally high pH with clean time/temperature is documentable
          disposition = VARIANCE_REQUIRED
      elif ph_ok and (not time_ok) and exposure_minutes <= EXPOSURE_LIMIT_MIN + 60 and temp_ok:
          # a modest time overrun with in-spec pH and temperature is documentable
          disposition = VARIANCE_REQUIRED
      else:
          # pH above the variance ceiling, a temperature excursion, or more than one
          # failing parameter at all is never documentable
          disposition = REJECTED
    input_set: "the single RiceBatch's own measured_ph, hold window and max_temp_c; no aggregation"
    constants:
      PH_LIMIT: 4.20
      VARIANCE_PH_CEILING: 4.60
      EXPOSURE_LIMIT_MIN: 240
      MAX_HOLD_TEMP_C: 21.0
    precision: "pH compared at 2 decimal places; exposure_minutes is a whole number of minutes; temperature at 1 decimal place"
    variants: []

  - name: rice_yield_ceiling
    trigger: "POST /kiosk-ops/rice-batches (max_pack_yield) and POST /kiosk-ops/pack-lots (pack_count ceiling check)"
    algorithm: aggregation
    formula: |
      max_pack_yield = floor(RiceBatch.rice_kg / RICE_KG_PER_PACK)
      # A PackLot whose pack_count exceeds max_pack_yield is rejected with
      # ERR_RICE_YIELD_EXCEEDED; equality is allowed.
      consumed_fish_kg = round_half_up(pack_count * FISH_KG_PER_PACK, 3)
      # The source FishLot must satisfy remaining_kg >= consumed_fish_kg; equality
      # is allowed and drives the lot to CONSUMED.
    input_set: "the referenced RiceBatch and FishLot rows only"
    constants:
      RICE_KG_PER_PACK: 0.12
      FISH_KG_PER_PACK: 0.045
    precision: "max_pack_yield integer via floor; consumed_fish_kg 3 decimal places, round_half_up"
    variants: []

  - name: cold_chain_breach_minutes
    trigger: "POST /kiosk-ops/fish-lots/{id}/cold-chain-readings (sets the reading's breach_minutes_attributed and the lot's cold_chain_breach_minutes)"
    algorithm: chronological
    formula: |
      # Readings are processed in recorded_at ASC order; ties on recorded_at are broken
      # by created_at ASC. The lot's received_at with receiving_temp_c is the implicit
      # first reading of the series.
      #
      # For each consecutive pair (prev, curr):
      #   gap = interval_minutes_from_previous
      #         = whole minutes between prev.recorded_at and curr.recorded_at
      #
      #   if prev.temp_c > COLD_LIMIT_C and curr.temp_c > COLD_LIMIT_C:
      #       segment = gap                       # fully out of temperature
      #   elif prev.temp_c > COLD_LIMIT_C or curr.temp_c > COLD_LIMIT_C:
      #       segment = round_half_up(gap / 2, 0) # exactly one endpoint above limit:
      #                                           # the midpoint rule attributes half
      #   else:
      #       segment = 0
      #
      #   breach_minutes_attributed = segment      # rounded per interval, stored per row
      #
      # lot.cold_chain_breach_minutes = SUM of the per-interval rounded segments.
      #
      # ROUNDING ORDER IS LOAD-BEARING: each interval is rounded to a whole minute
      # BEFORE the sum. Summing the raw halves and rounding once at the end yields a
      # different total whenever two or more half-intervals have odd gaps.
      #
      # A temperature exactly equal to COLD_LIMIT_C is compliant (> not >=).
      #
      # If cold_chain_breach_minutes > QUARANTINE_BREACH_LIMIT_MIN the lot is
      # quarantined; exactly QUARANTINE_BREACH_LIMIT_MIN does not quarantine.
    input_set: "all ColdChainReading rows of the fish lot plus the lot's own received_at / receiving_temp_c as the series origin; readings on other lots are never mixed in"
    constants:
      COLD_LIMIT_C: 4.4
      QUARANTINE_BREACH_LIMIT_MIN: 30
    precision: "per-interval minutes rounded to 0 decimal places, round_half_up, then summed as integers"
    variants: []

  - name: parasite_destruction_compliance
    trigger: "POST /kiosk-ops/fish-lots/{id}/parasite-destruction (sets freeze_effective_hours and parasite_destruction_compliant)"
    algorithm: threshold
    formula: |
      # Step 1 - exemption test, evaluated before any freeze arithmetic
      if FishLot.harvest_method == AQUACULTURE_EXEMPT
         or FishLot.species IN {TUNA_YELLOWFIN, SHRIMP_COOKED}:
          parasite_destruction_required = false
          parasite_destruction_compliant = true      # vacuously satisfied, no record needed
      else:
          parasite_destruction_required = true

          # Step 2 - effective duration, whole hours, truncated toward zero
          freeze_effective_hours = floor(minutes(freeze_start_at, freeze_end_at) / 60)

          # Step 3 - the declared destruction_method selects BOTH thresholds; the
          # achieved data must satisfy the regime that was declared, not merely some
          # regime. Declaring the 15-hour method and then holding -22 C for 200 hours
          # is NOT compliant, because -22 C never reaches the -35 C the method claims.
          if destruction_method == FREEZE_MINUS35_15HRS:
              required_temp_c  = REGIME_MINUS35_TEMP_C     # -35.0
              required_hours   = REGIME_MINUS35_HOURS      # 15
          elif destruction_method == FREEZE_MINUS35_THEN_MINUS20_24HRS:
              required_temp_c  = REGIME_MINUS35_TEMP_C     # -35.0
              required_hours   = REGIME_MINUS35_THEN_MINUS20_HOURS   # 24
          else:  # FREEZE_MINUS20_7DAYS
              required_temp_c  = REGIME_MINUS20_TEMP_C     # -20.0
              required_hours   = REGIME_MINUS20_HOURS      # 168

          parasite_destruction_compliant =
              freeze_min_temp_c <= required_temp_c
              and freeze_effective_hours >= required_hours

      # Both comparisons are inclusive: exactly -20.0 C held for exactly 168 hours
      # under FREEZE_MINUS20_7DAYS is compliant. 167 hours is not.
      # A required-but-not-compliant lot cannot be RELEASED:
      # ERR_PARASITE_DESTRUCTION_INCOMPLETE.
    input_set: "the single FishLot row; no aggregation across lots"
    constants:
      REGIME_MINUS35_HOURS: 15
      REGIME_MINUS35_THEN_MINUS20_HOURS: 24
      REGIME_MINUS20_HOURS: 168
      REGIME_MINUS35_TEMP_C: -35.0
      REGIME_MINUS20_TEMP_C: -20.0
    precision: "freeze_effective_hours is a whole number of hours, truncated toward zero; temperatures compared at 1 decimal place"
    variants: []

  - name: pack_markdown_price
    trigger: "POST /kiosk-ops/pack-lots (sets shelf_expiry_at) and POST /kiosk-ops/pack-lots/{id}/markdown (sets markdown_price_cents, advisory_markdown_price_cents, markdown_variant_applied)"
    algorithm: decay_function
    formula: |
      shelf_expiry_at   = produced_at + SHELF_LIFE_MINUTES minutes
      remaining_minutes = whole minutes from the logical clock to shelf_expiry_at,
                          clamped into [0, SHELF_LIFE_MINUTES]
      floor_price_cents = round_half_up(list_price_cents * MARKDOWN_FLOOR_PCT, 0)

      # Variant A - PRORATED_REMAINING_LIFE
      prorated = max(
        round_half_up(list_price_cents * remaining_minutes / SHELF_LIFE_MINUTES, 0),
        floor_price_cents
      )

      # Variant B - FLAT_STEP
      flat = max(
        round_half_up(list_price_cents * FLAT_STEP_RETAINED_PCT, 0),
        floor_price_cents
      )

      # The BINDING variant is the one named by the owning
      # LicenseAgreement.markdown_policy; the other is stored as advisory only.
      markdown_price_cents          = the binding variant's value
      advisory_markdown_price_cents = the other variant's value
      markdown_variant_applied      = LicenseAgreement.markdown_policy

      # The two variants diverge in BOTH directions over the shelf life: early in the
      # window the prorated price is the higher of the two, late in the window it is
      # pinned to the floor and is the lower of the two. Only markdown_price_cents
      # values the pack for discard and for markdown sales; the advisory number never
      # touches money.
    input_set: "the single PackLot plus the markdown_policy of the LicenseAgreement reached through PackLot -> RiceBatch -> ProductionPlan -> Kiosk -> LicenseAgreement"
    constants:
      SHELF_LIFE_MINUTES: 720
      MARKDOWN_FLOOR_PCT: 0.30
      FLAT_STEP_RETAINED_PCT: 0.50
    precision: "cents, 0 decimal places, round_half_up"
    variants:
      - name: PRORATED_REMAINING_LIFE
        when: "LicenseAgreement.markdown_policy == PRORATED_REMAINING_LIFE"
        difference: "price falls linearly with remaining shelf life and only then clamps to the 30% floor, so an early markdown is priced well above the flat step"
      - name: FLAT_STEP
        when: "LicenseAgreement.markdown_policy == FLAT_STEP"
        difference: "a single 50%-of-list step is applied regardless of how much shelf life remains, so it is cheaper than prorated early and dearer than prorated late"

  - name: discard_valuation
    trigger: "any transition that moves a PackLot to DISCARDED (appends exactly one DiscardEvent)"
    algorithm: aggregation
    formula: |
      discarded_count  = PackLot.unsold_count at the moment of the discard
      unit_value_cents = PackLot.markdown_price_cents if PackLot.status == MARKED_DOWN
                         else PackLot.list_price_cents
      discard_value_cents = discarded_count * unit_value_cents

      # Which discards the franchisor shares in is a policy decision, not a
      # consequence of the discard's size:
      settlement_credit_eligible =
        reason IN {SHELF_LIFE_EXPIRED, TEMP_ABUSE}     # normal spoilage and cold-chain
      # AUDIT_LOCKDOWN and VARIANCE_REJECTED discards are NOT credit eligible: they
      # arise from the franchisee's own compliance failure.

      # Conservation invariant on every pack lot at all times:
      #   pack_count == sold_count + discarded_count + unsold_count
    input_set: "the discarded PackLot and the reason supplied by the triggering transition"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: revenue_share_settlement
    trigger: "POST /kiosk-ops/settlement-statements and POST /kiosk-ops/settlement-statements/{id}/revise"
    algorithm: tiered_pricing
    formula: |
      # ---- Step 1: assemble the sales inputs -------------------------------------
      # Only PosSalesFeed rows with status == RECONCILED whose business_date falls in
      # the CLOSED interval [period_start, period_end] contribute. SUBMITTED and
      # REJECTED feeds contribute nothing.
      gross_sales_cents    = SUM(feed.gross_sales_cents)
      markdown_sales_cents = SUM(feed.markdown_sales_cents)

      # ---- Step 2: pick the settlement base (DUAL VARIANT) -----------------------
      if LicenseAgreement.revenue_share_model == GROSS_SALES:
          settlement_base_cents = gross_sales_cents
      else:  # NET_OF_MARKDOWN
          settlement_base_cents = gross_sales_cents - markdown_sales_cents

      # ---- Step 3: marginal tiered share on the base -----------------------------
      # Marginal, NOT average: each tier's rate applies only to the portion of the
      # base inside that tier.
      tier1 = min(settlement_base_cents, TIER1_CEILING) * TIER1_RATE
      tier2 = clamp(settlement_base_cents - TIER1_CEILING, 0, TIER2_CEILING - TIER1_CEILING) * TIER2_RATE
      tier3 = max(settlement_base_cents - TIER2_CEILING, 0) * TIER3_RATE
      binding_share_cents = round_half_up(tier1 + tier2 + tier3, 0)

      # The advisory share is the SAME tier ladder run over the OTHER model's base.
      advisory_share_cents = the same computation with the other revenue_share_model
      variance_cents       = binding_share_cents - advisory_share_cents

      # ---- Steps 4-6: credits, in this PINNED evaluation order -------------------
      # Both caps are keyed on binding_share_cents, i.e. the share BEFORE any credit
      # is applied. Re-ordering the steps, or keying the discard cap on the
      # already-reduced amount, changes the result.
      #
      # Step 4 - space obligation credit
      raw_space_credit  = HostStore.space_shortfall_sqft * LicenseAgreement.space_credit_cents_per_sqft
      space_cap         = round_half_up(binding_share_cents * SPACE_CREDIT_CAP_PCT, 0)
      space_shortfall_credit_cents = min(raw_space_credit, space_cap)
      #
      # Step 5 - discard credit
      # Every discard dated inside the period is totalled for transparency, whether or
      # not the franchisor shares in it. Only the eligible subset feeds the credit, so
      # an AUDIT_LOCKDOWN or VARIANCE_REJECTED discard moves period_discard_value_cents
      # while leaving discard_credit_cents and net_due_cents untouched.
      period_discard_value_cents = SUM(DiscardEvent.discard_value_cents) over ALL events
                               whose created_at date falls in [period_start, period_end]
      eligible_discard_value = SUM(DiscardEvent.discard_value_cents) over events whose
                               settlement_credit_eligible == true and whose created_at
                               date falls in [period_start, period_end]
      raw_discard_credit = round_half_up(eligible_discard_value * DISCARD_CREDIT_PCT, 0)
      discard_cap        = round_half_up(binding_share_cents * DISCARD_CREDIT_CAP_PCT, 0)
      discard_credit_cents = min(raw_discard_credit, discard_cap)
      #
      # Step 6 - net amount due from the host store, floored at zero
      net_due_cents = max(
        binding_share_cents - space_shortfall_credit_cents - discard_credit_cents,
        0
      )
      binding_variant = LicenseAgreement.revenue_share_model
    input_set: "RECONCILED PosSalesFeed rows of the agreement's host store dated inside the closed period, plus credit-eligible DiscardEvents dated inside the same closed period; VOID statements of the same period are excluded from every sum"
    constants:
      TIER1_CEILING: 2000000
      TIER1_RATE: 0.12
      TIER2_CEILING: 5000000
      TIER2_RATE: 0.14
      TIER3_RATE: 0.16
      SPACE_CREDIT_CAP_PCT: 0.25
      DISCARD_CREDIT_PCT: 0.40
      DISCARD_CREDIT_CAP_PCT: 0.10
    precision: "integer cents; round_half_up applied once per named money field, never to intermediate tier products"
    variants:
      - name: GROSS_SALES
        when: "LicenseAgreement.revenue_share_model == GROSS_SALES"
        difference: "the base is the full gross, so markdown revenue is shared and the tier ladder is entered further up; produces the larger binding_share_cents"
      - name: NET_OF_MARKDOWN
        when: "LicenseAgreement.revenue_share_model == NET_OF_MARKDOWN"
        difference: "markdown revenue is subtracted before the ladder, which can also drop the base into a lower tier; produces the smaller binding_share_cents and a negative variance_cents when it is the advisory side"

  - name: kiosk_risk_points
    trigger: "any audit submit/verify, any finding correct/waive, any approved or revoked rice variance, and any cold-chain quarantine (recomputes Kiosk.risk_points and re-derives sanitation_posture)"
    algorithm: weighted_scoring
    formula: |
      risk_points =
            SEVERITY_POINTS_MINOR    * (count of AuditFinding rows on this kiosk with severity == MINOR    and status in {OPEN, CORRECTED})
          + SEVERITY_POINTS_MAJOR    * (count of AuditFinding rows on this kiosk with severity == MAJOR    and status in {OPEN, CORRECTED})
          + SEVERITY_POINTS_CRITICAL * (count of AuditFinding rows on this kiosk with severity == CRITICAL and status in {OPEN, CORRECTED})
          + VARIANCE_APPROVED_POINTS * (count of RiceBatch rows on this kiosk with status == VARIANCE_APPROVED or that were CONSUMED while carrying an approved variance)
          + COLD_CHAIN_BREACH_POINTS * (count of FishLot rows on this kiosk currently QUARANTINED with quarantine_reason == COLD_CHAIN_BREACH)
          - CLEAN_AUDIT_CREDIT       * Kiosk.consecutive_clean_audits

      risk_points = clamp(risk_points, 0, RISK_CEILING)   # floor 0, ceiling 40

      # Posture derivation from the clamped total. Each band is inclusive at its lower
      # bound, so exactly 8 is WATCH and exactly 18 is RESTRICTED.
      if Kiosk.open_critical_finding_count > 0:
          sanitation_posture = LOCKDOWN          # override, regardless of the total
      elif risk_points >= LOCKDOWN_THRESHOLD:    # >= 30
          sanitation_posture = LOCKDOWN
      elif risk_points >= RESTRICTED_THRESHOLD:  # >= 18
          sanitation_posture = RESTRICTED
      elif risk_points >= WATCH_THRESHOLD:       # >= 8
          sanitation_posture = WATCH
      else:
          sanitation_posture = CLEAR

      # CORRECTED findings still count as risk until the reverification PASSES;
      # VERIFIED and WAIVED findings drop out. Because the ceiling clamps before the
      # thresholds are read, a kiosk cannot be pushed past LOCKDOWN and then fail to
      # come back when findings are cleared.
    input_set: "AuditFinding rows reachable through FoodSafetyAudit.kiosk_id, RiceBatch rows reachable through ProductionPlan.kiosk_id, FishLot rows with kiosk_id == this kiosk, plus the kiosk's own consecutive_clean_audits"
    constants:
      SEVERITY_POINTS_MINOR: 1
      SEVERITY_POINTS_MAJOR: 4
      SEVERITY_POINTS_CRITICAL: 10
      VARIANCE_APPROVED_POINTS: 3
      COLD_CHAIN_BREACH_POINTS: 6
      CLEAN_AUDIT_CREDIT: 2
      WATCH_THRESHOLD: 8
      RESTRICTED_THRESHOLD: 18
      LOCKDOWN_THRESHOLD: 30
      RISK_CEILING: 40
    precision: "integer points"
    variants: []

  - name: audit_score
    trigger: "POST /kiosk-ops/audits/{id}/submit (sets score, critical_finding_count, open_finding_count)"
    algorithm: weighted_scoring
    formula: |
      deductions = DEDUCT_MINOR    * (findings with severity == MINOR)
                 + DEDUCT_MAJOR    * (findings with severity == MAJOR)
                 + DEDUCT_CRITICAL * (findings with severity == CRITICAL)
      score = max(AUDIT_SCORE_BASE - deductions, 0)
      critical_finding_count = count of findings with severity == CRITICAL
      open_finding_count     = count of findings with status == OPEN
      # score is frozen at submit; later corrections do not raise it.
    input_set: "every AuditFinding of this audit, regardless of status, as of the submit call"
    constants:
      AUDIT_SCORE_BASE: 100
      DEDUCT_MINOR: 2
      DEDUCT_MAJOR: 8
      DEDUCT_CRITICAL: 20
      MAX_CORRECTIVE_ROUNDS: 2
    precision: "integer, 0..100"
    variants: []

  - name: chef_certification_readiness
    trigger: "POST /kiosk-ops/chefs/{id}/certifications and POST /kiosk-ops/_clock/set_current_utc (recomputes Chef.valid_cert_count and the chef's status)"
    algorithm: threshold
    formula: |
      valid_cert_count = count of Certification rows of this chef with status == VALID
      has_food_handler = a VALID Certification with cert_type == FOOD_HANDLER exists
                         whose expires_at is strictly after the logical clock
      has_haccp        = a VALID Certification with cert_type == HACCP_RICE_ACIDIFICATION exists
                         whose expires_at is strictly after the logical clock

      if training_hours_logged >= MIN_TRAINING_HOURS and has_food_handler and has_haccp:
          status = CERTIFIED
      elif training_hours_logged > 0:
          status = TRAINEE
      else:
          status = CANDIDATE
      # Exactly MIN_TRAINING_HOURS is enough (>=). A chef who loses either mandatory
      # certification while CERTIFIED moves to SUSPENDED rather than back to TRAINEE.
      # Only CERTIFIED chefs count toward Kiosk.certified_chef_count, which is the
      # staffing cap input of daily_production_allocation.
    input_set: "the chef's own Certification rows only, evaluated against the logical clock"
    constants:
      MIN_TRAINING_HOURS: 24
    precision: "integer hours and counts"
    variants: []

  - name: plan_forecast_variance
    trigger: "POST /kiosk-ops/production-plans/{id}/reconcile (sets actual_pack_count and forecast_variance_pct)"
    algorithm: aggregation
    formula: |
      actual_pack_count = SUM(PackLot.pack_count) over pack lots whose rice_batch_id
                          belongs to this plan and whose status IN
                          {ON_SHELF, MARKED_DOWN, SOLD_OUT}
                          # DISCARDED and VOIDED lots are excluded, which is why a
                          # discard cascade changes an already-computed actual.
      if planned_pack_count == 0:
          forecast_variance_pct = 0.00
      else:
          forecast_variance_pct = round_half_up(
            (actual_pack_count - planned_pack_count) * 100 / planned_pack_count, 2)
      # Negative means the kiosk under-produced against the traffic forecast.
    input_set: "PackLot rows reachable through this plan's RiceBatch rows only"
    constants: {}
    precision: "2 decimal places, round_half_up; signed"
    variants: []

  - name: space_obligation_compliance
    trigger: "POST /kiosk-ops/host-stores/{id}/space-attestation and POST /kiosk-ops/license-agreements/{id}/activate"
    algorithm: threshold
    formula: |
      space_shortfall_sqft = max(
        LicenseAgreement.min_space_sqft_obligation - HostStore.attested_sushi_space_sqft, 0)

      if HostStore.last_attested_on IS NULL:
          space_compliance_state = UNVERIFIED
      elif space_shortfall_sqft == 0
           and HostStore.attested_case_linear_ft >= LicenseAgreement.min_case_linear_ft_obligation:
          space_compliance_state = COMPLIANT
      else:
          space_compliance_state = DEFICIENT

      # Both obligations are inclusive: attesting exactly the obligation is COMPLIANT.
      # An UNVERIFIED store cannot have its agreement activated
      # (ERR_SPACE_OBLIGATION_DEFICIENT), but a DEFICIENT store CAN: the shortfall is
      # priced into the settlement as a credit rather than blocking operations.
    input_set: "the HostStore row and, when an agreement exists, that agreement's two obligation fields"
    constants: {}
    precision: "sqft integer; linear feet 1 decimal place"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (strictly ordered; lower priority number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /kiosk-ops/_clock/set_current_utc"
    description: "Evaluated before anything else, including path-parameter existence. A request missing either header is rejected even when the referenced resources do not exist."

  - priority: 2
    category: auth
    check: "X-User-Role is one of the four declared roles AND that role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all except POST /kiosk-ops/_clock/set_current_utc"
    description: "Role authorization precedes existence checks: a FranchiseChef calling a FranchisorOps-only endpoint with a non-existent id receives 403, never 404."

  - priority: 3
    category: auth
    check: "for entity-backed roles the acting identity owns the target: a HostStoreManager may only act on resources reachable from its own HostStore, and a FranchiseChef may only act on resources reachable from its assigned Kiosk"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "every endpoint whose roles list contains HostStoreManager or FranchiseChef"
    description: "Ownership is a scoping check, not a business rule; it fires before any state or business validation on the target."

  - priority: 4
    category: existence
    check: "every id referenced by the request exists — path parameters first in left-to-right order, then request-body foreign keys in the order the body fields are declared in the endpoint's input"
    error_id: "the entity-specific NOT_FOUND error"
    http_status: 404
    applies_to: "all"
    description: "The declared left-to-right order is observable: a call carrying two bad ids returns the error for the leftmost one."

  - priority: 5
    category: schema
    check: "required fields present, types correct, enum values within the declared set, numeric ranges respected, ISO 8601 instants well formed, and every start/end pair ordered start < end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Schema validation runs AFTER existence so that a syntactically bad body against a non-existent parent still yields 404."

  - priority: 6
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: "the entity-specific INVALID_STATE error"
    http_status: 409
    applies_to: "every state-transition endpoint"
    description: "State is checked before optimistic-concurrency and before every business rule. A terminal-state target is always a state error, never a business error."

  - priority: 7
    category: concurrency
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "the §1.2.1 rule's error_id"
    http_status: 412
    applies_to: "POST /kiosk-ops/production-plans, POST /kiosk-ops/settlement-statements"
    description: "OCC sits between state and business validation: a stale version against an otherwise business-invalid body returns 412."

  - priority: 8
    category: business_safety
    check: "food-safety gates: the acting chef is CERTIFIED with unexpired HACCP and food-handler certifications; the rice batch backing a pack lot is APPROVED or VARIANCE_APPROVED; the fish lot is RELEASED with parasite destruction satisfied and no unresolved cold-chain breach; the kiosk's sanitation_posture is not LOCKDOWN; a documented variance's pH does not exceed VARIANCE_PH_CEILING"
    error_id: "the specific safety error"
    http_status: 422
    applies_to: "POST /kiosk-ops/rice-batches, POST /kiosk-ops/rice-batches/{id}/variance-request, POST /kiosk-ops/rice-batches/{id}/variance-decision, POST /kiosk-ops/pack-lots, POST /kiosk-ops/fish-lots/{id}/release, POST /kiosk-ops/production-plans/{id}/release, POST /kiosk-ops/kiosks/{id}/commission"
    description: "Safety outranks every other business category. Nothing that could put unsafe product on a shelf may be masked by a referential or fiscal complaint."

  - priority: 9
    category: business_temporal
    check: "time-window rules: a new rice batch's [hold_start_at, hold_end_at) must not overlap another non-REJECTED batch's window on the same kiosk; a production plan's production_date must fall inside the agreement's [effective_from, effective_to]; a settlement period must not overlap a non-VOID statement of the same agreement; an audit may not be started before scheduled_for"
    error_id: "the specific temporal error"
    http_status: 422
    applies_to: "POST /kiosk-ops/rice-batches, POST /kiosk-ops/production-plans, POST /kiosk-ops/settlement-statements, POST /kiosk-ops/audits/{id}/start"
    description: "Rice-hold windows are half-open, so a batch starting exactly when another ends is accepted; settlement periods are closed intervals, so sharing an endpoint date is an overlap."

  - priority: 10
    category: business_referential
    check: "cross-aggregate coherence: a pack lot's rice batch and fish lot must belong to the same kiosk; a POS feed line must reference a pack lot of the feed's own host store; a plan may only be reconciled once every feed for its date is terminal"
    error_id: "the specific referential error"
    http_status: 422
    applies_to: "POST /kiosk-ops/pack-lots, POST /kiosk-ops/pos-sales-feeds/{id}/reconcile, POST /kiosk-ops/production-plans/{id}/reconcile"
    description: "Referential coherence ranks below safety, which is the ordering that PRIORITY PAIR 2 exercises."

  - priority: 11
    category: business_constraint
    check: "capacity and cardinality limits: pack_count must not exceed the rice batch's max_pack_yield; a kiosk's live pack total must not exceed daily_pack_cap; the host store's refrigerated case must not be over-committed; only one POS feed may exist per host store and business_date; reverification requires every finding resolved; only MINOR findings are waivable"
    error_id: "the specific constraint error"
    http_status: 422
    applies_to: "POST /kiosk-ops/pack-lots, POST /kiosk-ops/pos-sales-feeds, POST /kiosk-ops/audits/{id}/request-reverification, POST /kiosk-ops/audits/{id}/findings/{finding_id}/waive"
    description: "Aggregate limits are evaluated after per-row referential checks because they need the referenced rows resolved first."

  - priority: 12
    category: business_fiscal
    check: "money gates: a statement may not be issued with no RECONCILED sales in its period; a payment must equal net_due_cents exactly; a fish allocation may not exceed remaining_kg; segregation of duties on statement issue and audit verification"
    error_id: "the specific fiscal error"
    http_status: 422
    applies_to: "POST /kiosk-ops/settlement-statements/{id}/issue, POST /kiosk-ops/settlement-statements/{id}/pay, POST /kiosk-ops/pack-lots, POST /kiosk-ops/audits/{id}/verify"
    description: "The last category. PRIORITY PAIR 1 exercises the fact that a state error at priority 6 pre-empts a fiscal error here."

  - priority: 6
    category: state
    check: "PRIORITY PAIR 1 (state beats fiscal): issuing a VOID settlement statement that also has zero RECONCILED feeds in its period returns ERR_SETTLEMENT_INVALID_STATE (priority 6, 409), never ERR_NO_SETTLEABLE_SALES (priority 12, 422)"
    error_id: ERR_SETTLEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /kiosk-ops/settlement-statements/{id}/issue"
    description: "Recorded here as an explicit ordering claim; the substantive rules live at priorities 6 and 12."

  - priority: 8
    category: business_safety
    check: "PRIORITY PAIR 2 (safety beats referential): creating a pack lot whose rice batch is REJECTED and whose fish lot belongs to a different kiosk returns ERR_RICE_BATCH_NOT_APPROVED (priority 8, 422), never ERR_CROSS_KIOSK_REFERENCE (priority 10, 422). Both are 422, so only the error_id distinguishes them."
    error_id: ERR_RICE_BATCH_NOT_APPROVED
    http_status: 422
    applies_to: "POST /kiosk-ops/pack-lots"
    description: "Recorded here as an explicit ordering claim; the substantive rules live at priorities 8 and 10."

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving surface ---------------------------------------------------
  - method: POST
    path: "/kiosk-ops/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock to the supplied instant. Every deadline, shelf-life, expiry, hold-window and freeze-duration rule reads this clock and never the host wall clock. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z, which is the mandatory startup default; it MUST NOT fall back to real wall-clock time. Advancing the clock also runs the shelf-expiry sweep, which discards every ON_SHELF or MARKED_DOWN pack lot whose shelf_expiry_at is at or before the new instant, and expires every Certification whose expires_at is at or before the new instant."
    roles: [FranchisorOps, HostStoreManager, FranchiseChef, QualityAuditor]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects:
      - "moves PackLot rows past shelf_expiry_at to DISCARDED with a DiscardEvent whose reason is SHELF_LIFE_EXPIRED"
      - "moves Certification rows past expires_at to EXPIRED and suspends any Chef left without both mandatory certifications"
      - "recomputes Kiosk.risk_points and re-derives sanitation_posture for every affected kiosk"

  # --- host stores -----------------------------------------------------------
  - method: POST
    path: "/kiosk-ops/host-stores"
    description: "Registers a grocery or convenience host store that can accept an in-store sushi kiosk."
    roles: [FranchisorOps]
    code: 201
    input: ["name", "banner_chain", "store_number", "state_code", "weekly_traffic_count", "sushi_space_sqft", "refrigerated_case_linear_ft", "refrigerated_case_capacity_packs"]
    output: HostStore
    side_effects:
      - "sets pos_integration_status to NOT_CONNECTED and space_compliance_state to UNVERIFIED"

  - method: GET
    path: "/kiosk-ops/host-stores/{id}"
    description: "Retrieves one host store including its POS integration and space compliance state."
    roles: [FranchisorOps, HostStoreManager, QualityAuditor]
    code: 200
    input: []
    output: HostStore
    side_effects: []

  - method: GET
    path: "/kiosk-ops/host-stores"
    description: "Lists host stores with pagination, optionally filtered by banner chain, POS integration state or space compliance state."
    roles: [FranchisorOps, QualityAuditor]
    code: 200
    input: ["banner_chain?", "pos_integration_status?", "space_compliance_state?", "limit?", "offset?"]
    output: HostStore[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/host-stores/{id}/pos-integration"
    description: "Connects, suspends or disconnects the host store's point-of-sale integration and records how many lanes are wired to the kiosk."
    roles: [HostStoreManager]
    code: 200
    input: ["pos_integration_status", "pos_terminal_count"]
    output: HostStore
    side_effects:
      - "sets pos_integration_status and pos_terminal_count"
      - "a store whose integration is not CONNECTED cannot have a POS sales feed reconciled"

  - method: POST
    path: "/kiosk-ops/host-stores/{id}/space-attestation"
    description: "Records the host store manager's periodic attestation of the square footage and refrigerated case frontage actually dedicated to the kiosk."
    roles: [HostStoreManager]
    code: 200
    input: ["attested_sushi_space_sqft", "attested_case_linear_ft", "attested_on"]
    output: HostStore
    side_effects:
      - "sets attested_sushi_space_sqft, attested_case_linear_ft and last_attested_on"
      - "recomputes space_compliance_state and the agreement's space_shortfall_sqft via space_obligation_compliance"

  # --- license agreements ----------------------------------------------------
  - method: POST
    path: "/kiosk-ops/license-agreements"
    description: "Drafts the host-store license agreement carrying the revenue share model, markdown policy and minimum space obligations."
    roles: [FranchisorOps]
    code: 201
    input: ["host_store_id", "revenue_share_model", "markdown_policy", "min_space_sqft_obligation", "min_case_linear_ft_obligation", "space_credit_cents_per_sqft", "effective_from", "effective_to"]
    output: LicenseAgreement
    side_effects:
      - "starts in DRAFT with lifetime_share_accrued_cents 0 and active_kiosk_count 0"

  - method: GET
    path: "/kiosk-ops/license-agreements/{id}"
    description: "Retrieves one license agreement including its lifetime accrued share."
    roles: [FranchisorOps, HostStoreManager, QualityAuditor]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []

  - method: GET
    path: "/kiosk-ops/license-agreements"
    description: "Lists license agreements with pagination, optionally filtered by host store or status."
    roles: [FranchisorOps, HostStoreManager, QualityAuditor]
    code: 200
    input: ["host_store_id?", "status?", "limit?", "offset?"]
    output: LicenseAgreement[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/license-agreements/{id}/activate"
    description: "Activates a drafted agreement once the host store has attested its space obligations."
    roles: [FranchisorOps]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects:
      - "moves the agreement DRAFT -> ACTIVE"
      - "recomputes space_shortfall_sqft from the store's current attestation"

  - method: POST
    path: "/kiosk-ops/license-agreements/{id}/suspend"
    description: "Suspends an active agreement, which suspends every kiosk operating under it."
    roles: [FranchisorOps]
    code: 200
    input: ["suspension_reason"]
    output: LicenseAgreement
    side_effects:
      - "moves the agreement ACTIVE -> SUSPENDED"
      - "every OPERATING Kiosk under the agreement moves to SUSPENDED, driving the four-link production/batch/pack/settlement cascade"

  - method: POST
    path: "/kiosk-ops/license-agreements/{id}/reinstate"
    description: "Returns a suspended agreement to ACTIVE. Kiosks are NOT reinstated automatically and must be reinstated one by one."
    roles: [FranchisorOps]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects:
      - "moves the agreement SUSPENDED -> ACTIVE and clears suspension_reason"

  - method: POST
    path: "/kiosk-ops/license-agreements/{id}/terminate"
    description: "Terminates the agreement permanently and decommissions every kiosk under it."
    roles: [FranchisorOps]
    code: 200
    input: ["termination_reason"]
    output: LicenseAgreement
    side_effects:
      - "moves the agreement to TERMINATED"
      - "every non-DECOMMISSIONED Kiosk under the agreement moves to DECOMMISSIONED and active_kiosk_count becomes 0"

  # --- chefs and certifications ---------------------------------------------
  - method: POST
    path: "/kiosk-ops/chefs"
    description: "Registers a franchise sushi chef candidate."
    roles: [FranchisorOps]
    code: 201
    input: ["full_name"]
    output: Chef
    side_effects:
      - "starts in CANDIDATE with training_hours_logged 0 and valid_cert_count 0"

  - method: GET
    path: "/kiosk-ops/chefs/{id}"
    description: "Retrieves one chef including training hours, certification expiry instants and assignment."
    roles: [FranchisorOps, FranchiseChef, QualityAuditor, HostStoreManager]
    code: 200
    input: []
    output: Chef
    side_effects: []

  - method: GET
    path: "/kiosk-ops/chefs"
    description: "Lists chefs with pagination, optionally filtered by assigned kiosk or status."
    roles: [FranchisorOps, QualityAuditor, HostStoreManager]
    code: 200
    input: ["assigned_kiosk_id?", "status?", "limit?", "offset?"]
    output: Chef[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/chefs/{id}/training"
    description: "Logs completed training hours against a chef, promoting a CANDIDATE to TRAINEE on the first entry."
    roles: [FranchisorOps]
    code: 200
    input: ["hours", "curriculum_code"]
    output: Chef
    side_effects:
      - "adds hours to training_hours_logged"
      - "moves CANDIDATE -> TRAINEE on the first logged hours, and TRAINEE -> TRAINEE on every later entry"

  - method: POST
    path: "/kiosk-ops/chefs/{id}/certifications"
    description: "Issues a certification to a chef. A chef with at least MIN_TRAINING_HOURS logged and both mandatory certifications valid becomes CERTIFIED."
    roles: [QualityAuditor]
    code: 201
    input: ["cert_type", "exam_score", "issued_at", "valid_days"]
    output: Certification
    side_effects:
      - "computes expires_at as issued_at plus valid_days and stores the certification as VALID"
      - "recomputes Chef.valid_cert_count and the chef's two cert expiry fields"
      - "promotes the chef TRAINEE -> CERTIFIED once training_hours_logged >= MIN_TRAINING_HOURS and both FOOD_HANDLER and HACCP_RICE_ACIDIFICATION are valid"
      - "increments Kiosk.certified_chef_count when the newly certified chef is already assigned to a kiosk"

  - method: GET
    path: "/kiosk-ops/chefs/{id}/certifications"
    description: "Lists every certification ever issued to the chef, including EXPIRED and REVOKED rows."
    roles: [FranchisorOps, QualityAuditor, FranchiseChef]
    code: 200
    input: ["cert_type?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/chefs/{id}/certifications/{certification_id}/revoke"
    description: "Revokes one of a chef's certifications, suspending the chef if a mandatory certification is lost."
    roles: [QualityAuditor]
    code: 200
    input: ["revocation_reason"]
    output: Certification
    side_effects:
      - "moves the certification VALID -> REVOKED"
      - "recomputes Chef.valid_cert_count and may move the chef CERTIFIED -> SUSPENDED"
      - "decrements the assigned Kiosk.certified_chef_count, which lowers the staffing cap used by daily_production_allocation"

  - method: POST
    path: "/kiosk-ops/chefs/{id}/placement"
    description: "Places a certified chef at a kiosk, optionally as its lead chef."
    roles: [FranchisorOps]
    code: 200
    input: ["assigned_kiosk_id", "as_lead_chef"]
    output: Chef
    side_effects:
      - "sets Chef.assigned_kiosk_id"
      - "increments Kiosk.certified_chef_count when the chef is CERTIFIED"
      - "sets Kiosk.lead_chef_id when as_lead_chef is true"

  # --- kiosks ----------------------------------------------------------------
  - method: POST
    path: "/kiosk-ops/kiosks"
    description: "Provisions a kiosk under an active license agreement."
    roles: [FranchisorOps]
    code: 201
    input: ["license_agreement_id", "kiosk_code", "case_footprint_sqft"]
    output: Kiosk
    side_effects:
      - "starts in PROVISIONING with sanitation_posture CLEAR, risk_points 0 and certified_chef_count 0"

  - method: GET
    path: "/kiosk-ops/kiosks/{id}"
    description: "Retrieves one kiosk including both of its independent state dimensions."
    roles: [FranchisorOps, HostStoreManager, FranchiseChef, QualityAuditor]
    code: 200
    input: []
    output: Kiosk
    side_effects: []

  - method: GET
    path: "/kiosk-ops/kiosks"
    description: "Lists kiosks with pagination, optionally filtered by agreement, lead chef, operational state or sanitation posture."
    roles: [FranchisorOps, HostStoreManager, QualityAuditor]
    code: 200
    input: ["license_agreement_id?", "lead_chef_id?", "operational_state?", "sanitation_posture?", "limit?", "offset?"]
    output: Kiosk[]
    side_effects: []

  - method: GET
    path: "/kiosk-ops/kiosks/{id}/risk-summary"
    description: "Computed read returning the kiosk's current risk decomposition: the per-severity open finding counts, approved-variance count, quarantined-lot count, clean-audit credit, the clamped total and the posture band it lands in."
    roles: [FranchisorOps, QualityAuditor]
    code: 200
    input: []
    output: '{ kiosk_id: string, minor_open: integer, major_open: integer, critical_open: integer, approved_variance_count: integer, quarantined_lot_count: integer, clean_audit_credit: integer, raw_risk_points: integer, risk_points: integer, sanitation_posture: string, posture_forced_by_critical: boolean }'
    side_effects: []

  - method: POST
    path: "/kiosk-ops/kiosks/{id}/commission"
    description: "Commissions a provisioned kiosk for production. Requires a lead chef who is CERTIFIED with both mandatory certifications unexpired against the current logical clock."
    roles: [FranchisorOps]
    code: 200
    input: ["commissioned_on"]
    output: Kiosk
    side_effects:
      - "moves the kiosk PROVISIONING -> OPERATING"
      - "increments LicenseAgreement.active_kiosk_count by 1"

  - method: POST
    path: "/kiosk-ops/kiosks/{id}/suspend"
    description: "Suspends an operating kiosk and drives the four-link cascade through plans, rice batches, pack lots and draft settlements."
    roles: [FranchisorOps, QualityAuditor]
    code: 200
    input: ["suspension_reason"]
    output: Kiosk
    side_effects:
      - "moves the kiosk OPERATING -> SUSPENDED and forces sanitation_posture to LOCKDOWN"
      - "CASCADE: ProductionPlans in {DRAFT, RELEASED, LOCKED} move to VOIDED"
      - "CASCADE: because those plans became VOIDED, their RiceBatches not already REJECTED or CONSUMED move to REJECTED"
      - "CASCADE: because those plans became VOIDED, every PackLot whose rice batch belongs to one of them and whose status is ON_SHELF or MARKED_DOWN moves to DISCARDED with a DiscardEvent whose reason is AUDIT_LOCKDOWN"
      - "CASCADE: DRAFT SettlementStatements covering the discard date recompute period_discard_value_cents, discard_credit_cents and net_due_cents"
      - "decrements LicenseAgreement.active_kiosk_count by 1"

  - method: POST
    path: "/kiosk-ops/kiosks/{id}/reinstate"
    description: "Returns a suspended kiosk to OPERATING once its sanitation posture is no longer LOCKDOWN. Voided plans are never revived."
    roles: [FranchisorOps]
    code: 200
    input: []
    output: Kiosk
    side_effects:
      - "moves the kiosk SUSPENDED -> OPERATING and clears suspension_reason"
      - "increments LicenseAgreement.active_kiosk_count by 1"

  - method: POST
    path: "/kiosk-ops/kiosks/{id}/decommission"
    description: "Permanently removes a kiosk from the host store."
    roles: [FranchisorOps]
    code: 200
    input: ["decommission_reason"]
    output: Kiosk
    side_effects:
      - "moves the kiosk to DECOMMISSIONED"
      - "unassigns every Chef whose assigned_kiosk_id is this kiosk and clears lead_chef_id"

  # --- production plans ------------------------------------------------------
  - method: POST
    path: "/kiosk-ops/production-plans"
    description: "Creates the daily production plan for a kiosk and date. The pack and rice targets are derived from store traffic, refrigerated case capacity, certified staffing and the kiosk's sanitation posture. A new DRAFT plan supersedes any prior DRAFT plan for the same kiosk and date, so the caller must supply the kiosk version it last observed."
    roles: [FranchiseChef, FranchisorOps]
    code: 201
    input: ["kiosk_id", "production_date", "traffic_forecast", "expected_kiosk_version"]
    output: ProductionPlan
    side_effects:
      - "computes planned_pack_count, planned_rice_kg, posture_factor_applied and binding_cap_source via daily_production_allocation"
      - "any prior DRAFT plan for the same kiosk and production_date moves to VOIDED with void_reason SUPERSEDED and the new plan records its id in superseded_plan_id"
      - "increments Kiosk.version by 1"

  - method: GET
    path: "/kiosk-ops/production-plans/{id}"
    description: "Retrieves one production plan including which cap bound and the posture factor that was applied."
    roles: [FranchisorOps, HostStoreManager, FranchiseChef, QualityAuditor]
    code: 200
    input: []
    output: ProductionPlan
    side_effects: []

  - method: GET
    path: "/kiosk-ops/production-plans"
    description: "Lists production plans with pagination, optionally filtered by kiosk, production date, status or the plan they superseded."
    roles: [FranchisorOps, HostStoreManager, FranchiseChef, QualityAuditor]
    code: 200
    input: ["kiosk_id?", "production_date?", "status?", "superseded_plan_id?", "limit?", "offset?"]
    output: ProductionPlan[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/production-plans/{id}/release"
    description: "Releases a drafted plan to the production floor. Blocked while the kiosk is not OPERATING or its sanitation posture is LOCKDOWN."
    roles: [FranchiseChef]
    code: 200
    input: []
    output: ProductionPlan
    side_effects:
      - "moves the plan DRAFT -> RELEASED"
      - "rice batches may now be created against the plan"

  - method: POST
    path: "/kiosk-ops/production-plans/{id}/lock"
    description: "Closes the plan to further rice batches once at least one batch has been approved or consumed."
    roles: [FranchiseChef]
    code: 200
    input: []
    output: ProductionPlan
    side_effects:
      - "moves the plan RELEASED -> LOCKED"

  - method: POST
    path: "/kiosk-ops/production-plans/{id}/reconcile"
    description: "Reconciles the locked plan against what was actually produced and sold, once every POS feed for the plan date is terminal."
    roles: [FranchisorOps]
    code: 200
    input: []
    output: ProductionPlan
    side_effects:
      - "moves the plan LOCKED -> RECONCILED"
      - "recomputes actual_pack_count and forecast_variance_pct via plan_forecast_variance"

  - method: POST
    path: "/kiosk-ops/production-plans/{id}/void"
    description: "Voids a plan that has not yet been reconciled, rejecting every rice batch that is not already terminal."
    roles: [FranchisorOps]
    code: 200
    input: ["void_reason"]
    output: ProductionPlan
    side_effects:
      - "moves the plan to VOIDED"
      - "RiceBatches not already REJECTED or CONSUMED move to REJECTED with rejection_reason PLAN_VOIDED"
      - "PackLots of those batches in {ON_SHELF, MARKED_DOWN} move to DISCARDED with DiscardEvents whose reason is AUDIT_LOCKDOWN"

  # --- rice batches ----------------------------------------------------------
  - method: POST
    path: "/kiosk-ops/rice-batches"
    description: "Starts a sushi rice batch against a released plan, opening its acidification hold window. The mixing chef must be CERTIFIED and the hold window must not overlap another live batch on the same kiosk."
    roles: [FranchiseChef]
    code: 201
    input: ["production_plan_id", "chef_id", "rice_kg", "vinegar_liters", "hold_start_at", "hold_end_at"]
    output: RiceBatch
    side_effects:
      - "starts in MIXING and computes max_pack_yield via rice_yield_ceiling"

  - method: GET
    path: "/kiosk-ops/rice-batches/{id}"
    description: "Retrieves one rice batch including its acidification measurements and any HACCP variance documentation."
    roles: [FranchisorOps, FranchiseChef, QualityAuditor]
    code: 200
    input: []
    output: RiceBatch
    side_effects: []

  - method: GET
    path: "/kiosk-ops/rice-batches"
    description: "Lists rice batches with pagination, optionally filtered by plan, mixing chef, variance filer or status."
    roles: [FranchisorOps, FranchiseChef, QualityAuditor]
    code: 200
    input: ["production_plan_id?", "chef_id?", "variance_submitted_by_chef_id?", "status?", "limit?", "offset?"]
    output: RiceBatch[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/rice-batches/{id}/acidification-reading"
    description: "Records the batch's measured pH and the maximum temperature observed during the hold, closing the mixing step."
    roles: [FranchiseChef]
    code: 200
    input: ["measured_ph", "ph_measured_at", "max_temp_c"]
    output: RiceBatch
    side_effects:
      - "moves the batch MIXING -> ACIDIFYING and stores measured_ph, ph_measured_at and max_temp_c"

  - method: POST
    path: "/kiosk-ops/rice-batches/{id}/verify-ttc"
    description: "Evaluates the batch's time and temperature control record and selects the disposition: APPROVED, VARIANCE_REQUIRED, or an outright REJECTED that no documentation can rescue."
    roles: [FranchiseChef, QualityAuditor]
    code: 200
    input: []
    output: RiceBatch
    side_effects:
      - "computes exposure_minutes and applies rice_acidification_disposition to pick the ACIDIFYING exit branch"

  - method: POST
    path: "/kiosk-ops/rice-batches/{id}/variance-request"
    description: "Files the HACCP variance documentation for a batch whose acidification record fell outside limits but inside the documentable band. Only a chef holding a valid HACCP_RICE_ACIDIFICATION certification may file it."
    roles: [FranchiseChef]
    code: 200
    input: ["documented_ph", "documented_hold_minutes", "corrective_narrative"]
    output: RiceBatch
    side_effects:
      - "moves the batch VARIANCE_REQUIRED -> VARIANCE_PENDING and records variance_submitted_by_chef_id from the acting chef"

  - method: POST
    path: "/kiosk-ops/rice-batches/{id}/variance-decision"
    description: "The quality auditor approves or rejects the filed HACCP variance. The filing chef may never decide their own variance."
    roles: [QualityAuditor]
    code: 200
    input: ["decision", "review_note"]
    output: RiceBatch
    side_effects:
      - "moves the batch VARIANCE_PENDING -> VARIANCE_APPROVED or VARIANCE_PENDING -> REJECTED"
      - "an approval adds VARIANCE_APPROVED_POINTS to Kiosk.risk_points and re-derives sanitation_posture"

  - method: POST
    path: "/kiosk-ops/rice-batches/{id}/revoke-variance"
    description: "Revokes an already-approved HACCP variance on a consumed batch after the fact, pulling every pack lot built from it off the shelf."
    roles: [QualityAuditor]
    code: 200
    input: ["revocation_rationale"]
    output: RiceBatch
    side_effects:
      - "moves the batch CONSUMED -> REJECTED with rejection_reason VARIANCE_REVOKED"
      - "PackLots of the batch in {ON_SHELF, MARKED_DOWN} move to DISCARDED with DiscardEvents whose reason is VARIANCE_REJECTED and which are NOT settlement_credit_eligible"
      - "the owning ProductionPlan recomputes actual_pack_count"
      - "removes VARIANCE_APPROVED_POINTS from Kiosk.risk_points and re-derives sanitation_posture"

  # --- fish lots, parasite destruction and cold chain ------------------------
  - method: POST
    path: "/kiosk-ops/fish-lots"
    description: "Receives a raw fish lot at a kiosk, recording the supplier, harvest provenance and receiving temperature. The receiving temperature is the origin of the lot's cold-chain series."
    roles: [FranchiseChef]
    code: 201
    input: ["kiosk_id", "species", "supplier_code", "harvest_method", "net_weight_kg", "received_at", "receiving_temp_c"]
    output: FishLot
    side_effects:
      - "starts in RECEIVED with allocated_kg 0 and cold_chain_breach_minutes 0"
      - "derives parasite_destruction_required from species and harvest_method, and sets parasite_destruction_compliant true for exempt lots"

  - method: GET
    path: "/kiosk-ops/fish-lots/{id}"
    description: "Retrieves one fish lot including its parasite-destruction record, accumulated cold-chain breach minutes and remaining mass."
    roles: [FranchisorOps, FranchiseChef, QualityAuditor]
    code: 200
    input: []
    output: FishLot
    side_effects: []

  - method: GET
    path: "/kiosk-ops/fish-lots"
    description: "Lists fish lots with pagination, optionally filtered by kiosk, attesting chef, species or status."
    roles: [FranchisorOps, FranchiseChef, QualityAuditor]
    code: 200
    input: ["kiosk_id?", "attested_by_chef_id?", "species?", "status?", "limit?", "offset?"]
    output: FishLot[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/fish-lots/{id}/parasite-destruction"
    description: "Records the freezing regime applied to a lot that requires parasite destruction, and evaluates whether the achieved temperature and duration satisfy the regime that was declared."
    roles: [FranchiseChef]
    code: 200
    input: ["destruction_method", "freeze_start_at", "freeze_end_at", "freeze_min_temp_c", "attested_by_chef_id"]
    output: FishLot
    side_effects:
      - "computes freeze_effective_hours and parasite_destruction_compliant via parasite_destruction_compliance"

  - method: POST
    path: "/kiosk-ops/fish-lots/{id}/cold-chain-readings"
    description: "Appends one immutable cold-chain temperature reading to the lot and recomputes the lot's accumulated breach minutes. Crossing the quarantine limit quarantines the lot and pulls its pack lots off the shelf."
    roles: [FranchiseChef, QualityAuditor]
    code: 201
    input: ["recorded_at", "temp_c"]
    output: ColdChainReading
    side_effects:
      - "computes the reading's interval_minutes_from_previous and breach_minutes_attributed via cold_chain_breach_minutes and stores lot_breach_minutes_after"
      - "updates FishLot.cold_chain_breach_minutes to the sum of the per-interval rounded attributions"
      - "a total above QUARANTINE_BREACH_LIMIT_MIN moves the lot to QUARANTINED, discards its ON_SHELF and MARKED_DOWN pack lots with reason TEMP_ABUSE, recomputes each affected ProductionPlan.actual_pack_count, and adds COLD_CHAIN_BREACH_POINTS to Kiosk.risk_points"

  - method: GET
    path: "/kiosk-ops/fish-lots/{id}/cold-chain-readings"
    description: "Lists the lot's cold-chain readings in recorded_at ascending order with the breach minutes each interval contributed. This is the only channel through which cascade-created readings are discoverable."
    roles: [FranchisorOps, FranchiseChef, QualityAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ColdChainReading[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/fish-lots/{id}/release"
    description: "Releases a received or quarantined lot for production. Requires parasite destruction to be satisfied and, for a quarantined lot, an explicit release rationale."
    roles: [QualityAuditor]
    code: 200
    input: ["release_rationale?"]
    output: FishLot
    side_effects:
      - "moves the lot RECEIVED -> RELEASED or QUARANTINED -> RELEASED and sets remaining_kg"
      - "clears quarantine_reason without resetting cold_chain_breach_minutes, so one further breach interval re-quarantines the lot"

  - method: POST
    path: "/kiosk-ops/fish-lots/{id}/destroy"
    description: "Destroys a received or quarantined lot, zeroing its remaining mass."
    roles: [QualityAuditor]
    code: 200
    input: ["destruction_rationale"]
    output: FishLot
    side_effects:
      - "moves the lot to DESTROYED and sets remaining_kg to 0"

  # --- pack lots, markdown and discards --------------------------------------
  - method: POST
    path: "/kiosk-ops/pack-lots"
    description: "Builds a pack lot from an approved rice batch and a released fish lot, consuming rice yield and fish mass. Both sources must belong to the same kiosk."
    roles: [FranchiseChef]
    code: 201
    input: ["rice_batch_id", "fish_lot_id", "sku_code", "pack_count", "list_price_cents", "produced_at"]
    output: PackLot
    side_effects:
      - "starts in ON_SHELF with sold_count 0, discarded_count 0 and unsold_count equal to pack_count"
      - "computes shelf_expiry_at as produced_at plus SHELF_LIFE_MINUTES and consumed_fish_kg via rice_yield_ceiling"
      - "moves the RiceBatch to CONSUMED"
      - "increases FishLot.allocated_kg and decreases remaining_kg by consumed_fish_kg, moving the lot to CONSUMED when remaining_kg reaches 0"
      - "the owning ProductionPlan recomputes actual_pack_count, so a plan's actual is live from the moment packs are built and is not deferred to reconcile"

  - method: GET
    path: "/kiosk-ops/pack-lots/{id}"
    description: "Retrieves one pack lot including both markdown prices and its sold/discarded/unsold decomposition."
    roles: [FranchisorOps, HostStoreManager, FranchiseChef, QualityAuditor]
    code: 200
    input: []
    output: PackLot
    side_effects: []

  - method: GET
    path: "/kiosk-ops/pack-lots"
    description: "Lists pack lots with pagination, optionally filtered by rice batch, fish lot, sku or status."
    roles: [FranchisorOps, HostStoreManager, FranchiseChef, QualityAuditor]
    code: 200
    input: ["rice_batch_id?", "fish_lot_id?", "sku_code?", "status?", "limit?", "offset?"]
    output: PackLot[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/pack-lots/{id}/markdown"
    description: "Marks down the unsold packs of a lot before its shelf expiry. Both markdown variants are computed; only the one named by the license agreement's markdown_policy is binding."
    roles: [FranchiseChef]
    code: 200
    input: []
    output: PackLot
    side_effects:
      - "moves the lot ON_SHELF -> MARKED_DOWN"
      - "sets markdown_price_cents, advisory_markdown_price_cents and markdown_variant_applied via pack_markdown_price"

  - method: POST
    path: "/kiosk-ops/pack-lots/{id}/discard"
    description: "Discards the unsold packs of a lot, appending exactly one discard event valued at the lot's currently effective price."
    roles: [FranchiseChef, QualityAuditor]
    code: 200
    input: ["reason"]
    output: PackLot
    side_effects:
      - "moves the lot to DISCARDED, sets discarded_count and drives unsold_count to 0"
      - "appends one DiscardEvent with unit_value_cents, discard_value_cents and settlement_credit_eligible via discard_valuation"
      - "the owning ProductionPlan recomputes actual_pack_count"
      - "DRAFT SettlementStatements covering the discard date recompute period_discard_value_cents, discard_credit_cents and net_due_cents"

  - method: GET
    path: "/kiosk-ops/pack-lots/{id}/discard-events"
    description: "Lists the discard events appended against this pack lot. Cascade-created discard events appear nowhere else."
    roles: [FranchisorOps, HostStoreManager, QualityAuditor]
    code: 200
    input: ["reason?", "limit?", "offset?"]
    output: DiscardEvent[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/pack-lots/{id}/void"
    description: "Voids a pack lot that has sold nothing, returning its fish mass to the source lot exactly."
    roles: [FranchisorOps]
    code: 200
    input: ["void_reason"]
    output: PackLot
    side_effects:
      - "moves the lot ON_SHELF -> VOIDED"
      - "decreases FishLot.allocated_kg and increases remaining_kg by exactly consumed_fish_kg, returning a CONSUMED lot to RELEASED"
      - "the owning ProductionPlan recomputes actual_pack_count"

  # --- POS integration and settlement ---------------------------------------
  - method: POST
    path: "/kiosk-ops/pos-sales-feeds"
    description: "Submits the host store's daily point-of-sale extract for the kiosk, one feed per store and business date."
    roles: [HostStoreManager]
    code: 201
    input: ["host_store_id", "business_date", "gross_sales_cents", "markdown_sales_cents", "full_price_units", "markdown_units", "lines"]
    output: PosSalesFeed
    side_effects:
      - "starts in SUBMITTED with reconciled_unit_total 0"

  - method: GET
    path: "/kiosk-ops/pos-sales-feeds/{id}"
    description: "Retrieves one POS sales feed including its per-pack-lot lines."
    roles: [FranchisorOps, HostStoreManager]
    code: 200
    input: []
    output: PosSalesFeed
    side_effects: []

  - method: GET
    path: "/kiosk-ops/pos-sales-feeds"
    description: "Lists POS sales feeds with pagination, optionally filtered by host store, business date or status."
    roles: [FranchisorOps, HostStoreManager]
    code: 200
    input: ["host_store_id?", "business_date?", "status?", "limit?", "offset?"]
    output: PosSalesFeed[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/pos-sales-feeds/{id}/reconcile"
    description: "Accepts the feed, applying its lines to the referenced pack lots. Requires the host store's POS integration to be CONNECTED."
    roles: [FranchisorOps]
    code: 200
    input: []
    output: PosSalesFeed
    side_effects:
      - "moves the feed SUBMITTED -> RECONCILED and sets reconciled_unit_total"
      - "increments each referenced PackLot.sold_count and decrements unsold_count, moving lots whose unsold_count reaches 0 to SOLD_OUT"
      - "the feed's sales totals become settleable"

  - method: POST
    path: "/kiosk-ops/pos-sales-feeds/{id}/reject"
    description: "Rejects a feed that cannot be trusted. A rejected feed contributes nothing to settlement but still lets its plan date be reconciled."
    roles: [FranchisorOps]
    code: 200
    input: ["rejection_reason"]
    output: PosSalesFeed
    side_effects:
      - "moves the feed SUBMITTED -> REJECTED"

  - method: POST
    path: "/kiosk-ops/settlement-statements"
    description: "Drafts the revenue-share settlement for an agreement period. Both revenue-share variants are computed and the money fields are derived from the agreement's terms, so the caller must supply the agreement version it last observed. A new DRAFT supersedes any prior DRAFT for the same agreement and period."
    roles: [FranchisorOps]
    code: 201
    input: ["license_agreement_id", "period_start", "period_end", "expected_license_agreement_version"]
    output: SettlementStatement
    side_effects:
      - "computes every money field via revenue_share_settlement, including binding_share_cents, advisory_share_cents, variance_cents, both credits and net_due_cents"
      - "records created_by_user_id from the X-User-ID header and revision_round 1"
      - "any prior DRAFT statement for the same agreement and period moves to VOID and the new statement records its id in superseded_statement_id"
      - "increments LicenseAgreement.version by 1"

  - method: GET
    path: "/kiosk-ops/settlement-statements/{id}"
    description: "Retrieves one settlement statement including the binding and advisory share, the variance between them and both credits."
    roles: [FranchisorOps, HostStoreManager]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: []

  - method: GET
    path: "/kiosk-ops/settlement-statements"
    description: "Lists settlement statements with pagination, optionally filtered by agreement, status or the statement they superseded."
    roles: [FranchisorOps, HostStoreManager]
    code: 200
    input: ["license_agreement_id?", "status?", "superseded_statement_id?", "limit?", "offset?"]
    output: SettlementStatement[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/settlement-statements/{id}/issue"
    description: "Issues the statement to the host store, freezing its money fields. Requires at least one reconciled feed in the period and an issuing user who is not the user who created the draft."
    roles: [FranchisorOps]
    code: 200
    input: []
    output: SettlementStatement
    side_effects:
      - "moves the statement DRAFT -> ISSUED and records issued_by_user_id"
      - "adds binding_share_cents to LicenseAgreement.lifetime_share_accrued_cents"

  - method: POST
    path: "/kiosk-ops/settlement-statements/{id}/acknowledge"
    description: "The host store manager accepts the issued statement."
    roles: [HostStoreManager]
    code: 200
    input: []
    output: SettlementStatement
    side_effects:
      - "moves the statement ISSUED -> ACKNOWLEDGED"

  - method: POST
    path: "/kiosk-ops/settlement-statements/{id}/dispute"
    description: "The host store manager disputes the issued statement, reversing its accrual until it is revised."
    roles: [HostStoreManager]
    code: 200
    input: ["dispute_reason"]
    output: SettlementStatement
    side_effects:
      - "moves the statement ISSUED -> DISPUTED"
      - "subtracts binding_share_cents from LicenseAgreement.lifetime_share_accrued_cents"

  - method: POST
    path: "/kiosk-ops/settlement-statements/{id}/revise"
    description: "Returns a disputed statement to DRAFT and recomputes it from the current reconciled feeds and credit-eligible discards. Bounded by revision_round."
    roles: [FranchisorOps]
    code: 200
    input: ["revision_note"]
    output: SettlementStatement
    side_effects:
      - "moves the statement DISPUTED -> DRAFT and increments revision_round by 1"
      - "recomputes every money field via revenue_share_settlement and clears issued_by_user_id"

  - method: POST
    path: "/kiosk-ops/settlement-statements/{id}/pay"
    description: "Records the host store's payment. The amount must equal net_due_cents exactly."
    roles: [HostStoreManager]
    code: 200
    input: ["paid_amount_cents", "paid_at"]
    output: SettlementStatement
    side_effects:
      - "moves the statement ACKNOWLEDGED -> PAID and records paid_amount_cents and paid_at"

  - method: POST
    path: "/kiosk-ops/settlement-statements/{id}/void"
    description: "Voids a statement that has not been paid, reversing any accrual it had already booked so the agreement's lifetime accrual returns to its pre-issue value exactly."
    roles: [FranchisorOps]
    code: 200
    input: ["void_reason"]
    output: SettlementStatement
    side_effects:
      - "moves the statement to VOID"
      - "subtracts binding_share_cents from LicenseAgreement.lifetime_share_accrued_cents when the statement had reached ISSUED or ACKNOWLEDGED"

  # --- food safety audits ----------------------------------------------------
  - method: POST
    path: "/kiosk-ops/audits"
    description: "Schedules a food safety audit of a kiosk."
    roles: [QualityAuditor]
    code: 201
    input: ["kiosk_id", "scheduled_for"]
    output: FoodSafetyAudit
    side_effects:
      - "starts in SCHEDULED with round_count 0 and no findings"

  - method: GET
    path: "/kiosk-ops/audits/{id}"
    description: "Retrieves one food safety audit including its round count, score and closure outcome."
    roles: [FranchisorOps, HostStoreManager, QualityAuditor]
    code: 200
    input: []
    output: FoodSafetyAudit
    side_effects: []

  - method: GET
    path: "/kiosk-ops/audits"
    description: "Lists food safety audits with pagination, optionally filtered by kiosk or status."
    roles: [FranchisorOps, HostStoreManager, QualityAuditor]
    code: 200
    input: ["kiosk_id?", "status?", "limit?", "offset?"]
    output: FoodSafetyAudit[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/audits/{id}/start"
    description: "Opens the scheduled audit for finding entry. Cannot be started before its scheduled instant."
    roles: [QualityAuditor]
    code: 200
    input: []
    output: FoodSafetyAudit
    side_effects:
      - "moves the audit SCHEDULED -> IN_PROGRESS and records opened_by_user_id from the X-User-ID header"

  - method: POST
    path: "/kiosk-ops/audits/{id}/findings"
    description: "Records one finding against an in-progress audit."
    roles: [QualityAuditor]
    code: 201
    input: ["severity", "finding_code", "description"]
    output: AuditFinding
    side_effects:
      - "starts the finding in OPEN with risk_points from the severity weighting"
      - "increments FoodSafetyAudit.open_finding_count and, for CRITICAL, Kiosk.open_critical_finding_count"

  - method: GET
    path: "/kiosk-ops/audits/{id}/findings"
    description: "Lists the audit's findings with their severity, risk points and current status."
    roles: [FranchisorOps, HostStoreManager, QualityAuditor]
    code: 200
    input: ["severity?", "status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/audits/{id}/submit"
    description: "Submits the audit. A zero-finding audit closes immediately and earns a clean-audit credit; any finding sends the audit into corrective action and re-derives the kiosk's sanitation posture."
    roles: [QualityAuditor]
    code: 200
    input: []
    output: FoodSafetyAudit
    side_effects:
      - "computes score, critical_finding_count and open_finding_count via audit_score"
      - "moves the audit IN_PROGRESS -> CLOSED with closure_outcome PASS when there are no findings, incrementing Kiosk.consecutive_clean_audits"
      - "moves the audit IN_PROGRESS -> CORRECTIVE_ACTION_PENDING otherwise, resetting Kiosk.consecutive_clean_audits to 0"
      - "recomputes Kiosk.risk_points and re-derives sanitation_posture, forcing LOCKDOWN when any CRITICAL finding is open"

  - method: POST
    path: "/kiosk-ops/audits/{id}/findings/{finding_id}/correct"
    description: "The host store manager records the corrective action taken against one open finding."
    roles: [HostStoreManager]
    code: 200
    input: ["correction_note"]
    output: AuditFinding
    side_effects:
      - "moves the finding OPEN -> CORRECTED and decrements FoodSafetyAudit.open_finding_count"

  - method: POST
    path: "/kiosk-ops/audits/{id}/findings/{finding_id}/waive"
    description: "The quality auditor waives a minor finding outright. MAJOR and CRITICAL findings are never waivable."
    roles: [QualityAuditor]
    code: 200
    input: ["waiver_rationale"]
    output: AuditFinding
    side_effects:
      - "moves the finding OPEN -> WAIVED"
      - "decrements FoodSafetyAudit.open_finding_count and removes the finding's risk_points from Kiosk.risk_points, re-deriving sanitation_posture"

  - method: POST
    path: "/kiosk-ops/audits/{id}/request-reverification"
    description: "The host store manager asks for reverification once every finding is corrected or waived."
    roles: [HostStoreManager]
    code: 200
    input: []
    output: FoodSafetyAudit
    side_effects:
      - "moves the audit CORRECTIVE_ACTION_PENDING -> REVERIFICATION and increments round_count by 1"

  - method: POST
    path: "/kiosk-ops/audits/{id}/verify"
    description: "The quality auditor reverifies the corrections. A pass closes the audit and clears the risk; a fail either returns the audit to corrective action or, once the corrective-round budget is spent, escalates to kiosk closure. The verifying user may never be the user who opened the audit."
    roles: [QualityAuditor]
    code: 200
    input: ["outcome", "verification_note"]
    output: FoodSafetyAudit
    side_effects:
      - "on PASS: moves every CORRECTED finding to VERIFIED, moves the audit to CLOSED with closure_outcome PASS_AFTER_CORRECTION, records verified_by_user_id, and re-derives Kiosk.sanitation_posture from the reduced risk total"
      - "on FAIL below the round budget: returns every CORRECTED finding to OPEN and the audit to CORRECTIVE_ACTION_PENDING, re-applying their risk_points"
      - "on FAIL at the round budget: moves the audit to ESCALATED_CLOSURE with closure_outcome ESCALATED and drives the full four-link kiosk suspension cascade through plans, batches, pack lots and draft settlements"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication and authorization (priorities 1-3) ---------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header is absent, or present with an empty string value"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not one of the four declared roles, or is not listed in the target endpoint's roles"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "an entity-backed actor targets a resource outside its own scope: a HostStoreManager acting on another store's agreement, feed or statement, or a FranchiseChef acting on a kiosk other than the one they are assigned to"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "the acting X-User-ID is the same user that performed the incompatible earlier step: issuing a settlement statement they created, verifying an audit they opened, or deciding a rice variance they filed"

  # --- schema (priority 5) ---------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, a value has the wrong type, an enum value is outside the declared set, a numeric range constraint is violated, an ISO 8601 instant is malformed, or a start/end pair is not strictly ordered"

  # --- existence (priority 4) -----------------------------------------------
  - id: ERR_HOST_STORE_NOT_FOUND
    http: 404
    condition: "the referenced host store id does not exist"
  - id: ERR_LICENSE_AGREEMENT_NOT_FOUND
    http: 404
    condition: "the referenced license agreement id does not exist"
  - id: ERR_KIOSK_NOT_FOUND
    http: 404
    condition: "the referenced kiosk id does not exist"
  - id: ERR_CHEF_RECORD_NOT_FOUND
    http: 404
    condition: "the referenced chef id or certification id does not exist, or the certification does not belong to the chef in the path"
  - id: ERR_PRODUCTION_RECORD_NOT_FOUND
    http: 404
    condition: "the referenced production plan, rice batch or pack lot id does not exist"
  - id: ERR_SOURCING_RECORD_NOT_FOUND
    http: 404
    condition: "the referenced fish lot or cold-chain reading id does not exist"
  - id: ERR_SETTLEMENT_RECORD_NOT_FOUND
    http: 404
    condition: "the referenced POS sales feed or settlement statement id does not exist"
  - id: ERR_AUDIT_RECORD_NOT_FOUND
    http: 404
    condition: "the referenced audit id or finding id does not exist, or the finding does not belong to the audit in the path"

  # --- state (priority 6) ---------------------------------------------------
  - id: ERR_LICENSE_INVALID_STATE
    http: 409
    condition: "the license agreement is not in a state from which the requested transition is declared, including any attempt to act on a TERMINATED agreement"
  - id: ERR_KIOSK_INVALID_STATE
    http: 409
    condition: "the kiosk is not in a state from which the requested transition is declared, including commissioning a kiosk that is already OPERATING or acting on a DECOMMISSIONED kiosk"
  - id: ERR_CHEF_INVALID_STATE
    http: 409
    condition: "the chef is not in a state permitting the operation, including placing a CANDIDATE or issuing a certification against a chef that is not a TRAINEE or CERTIFIED"
  - id: ERR_CERTIFICATION_INVALID_STATE
    http: 409
    condition: "the certification is EXPIRED or already REVOKED and cannot be revoked again"
  - id: ERR_PLAN_INVALID_STATE
    http: 409
    condition: "the production plan is not in a state from which the requested transition is declared, including releasing an already-RELEASED plan or acting on a VOIDED or RECONCILED plan"
  - id: ERR_RICE_BATCH_INVALID_STATE
    http: 409
    condition: "the rice batch is not in a state from which the requested transition is declared, including filing a variance on an APPROVED batch or revoking a variance on a batch that is not CONSUMED"
  - id: ERR_FISH_LOT_INVALID_STATE
    http: 409
    condition: "the fish lot is not in a state from which the requested transition is declared, including releasing a DESTROYED lot or appending a cold-chain reading to a DESTROYED lot"
  - id: ERR_PACK_LOT_INVALID_STATE
    http: 409
    condition: "the pack lot is not in a state from which the requested transition is declared, including marking down a lot that is already MARKED_DOWN, DISCARDED, SOLD_OUT or VOIDED"
  - id: ERR_POS_FEED_INVALID_STATE
    http: 409
    condition: "the POS sales feed is no longer SUBMITTED and can be neither reconciled nor rejected again"
  - id: ERR_SETTLEMENT_INVALID_STATE
    http: 409
    condition: "the settlement statement is not in a state from which the requested transition is declared, including issuing a VOID or already-ISSUED statement, revising a statement that is not DISPUTED, or voiding a PAID statement"
  - id: ERR_AUDIT_INVALID_STATE
    http: 409
    condition: "the audit is not in a state from which the requested transition is declared, including submitting an audit that was never started or verifying an audit that is not in REVERIFICATION"
  - id: ERR_FINDING_INVALID_STATE
    http: 409
    condition: "the finding is not OPEN when a correction or waiver is attempted, or not CORRECTED when reverification touches it"

  # --- optimistic concurrency (priority 7) ----------------------------------
  - id: ERR_STALE_KIOSK_VERSION
    http: 412
    condition: "expected_kiosk_version does not equal the kiosk's current version at the moment a production plan is created"
  - id: ERR_STALE_LICENSE_VERSION
    http: 412
    condition: "expected_license_agreement_version does not equal the agreement's current version at the moment a settlement statement is created"

  # --- business_safety (priority 8) -----------------------------------------
  - id: ERR_CHEF_NOT_CERTIFIED
    http: 422
    condition: "the chef mixing a rice batch, or the lead chef of a kiosk being commissioned, is not in status CERTIFIED"
  - id: ERR_HACCP_CERT_EXPIRED
    http: 422
    condition: "the chef filing a HACCP variance, or the lead chef of a kiosk being commissioned, has no VALID HACCP_RICE_ACIDIFICATION or FOOD_HANDLER certification against the current logical clock"
  - id: ERR_RICE_BATCH_NOT_APPROVED
    http: 422
    condition: "the rice batch backing a pack lot is not APPROVED or VARIANCE_APPROVED"
  - id: ERR_VARIANCE_PH_ABOVE_CEILING
    http: 422
    condition: "the documented pH on a filed HACCP variance exceeds VARIANCE_PH_CEILING, or the documented hold minutes exceed EXPOSURE_LIMIT_MIN, so the variance is not approvable"
  - id: ERR_PARASITE_DESTRUCTION_INCOMPLETE
    http: 422
    condition: "a fish lot requiring parasite destruction is released while parasite_destruction_compliant is false, because no freezing record was filed or the achieved temperature and duration do not satisfy the declared regime"
  - id: ERR_COLD_CHAIN_BREACH_BLOCKS_RELEASE
    http: 422
    condition: "a fish lot is released while its accumulated cold_chain_breach_minutes exceeds QUARANTINE_BREACH_LIMIT_MIN and no release rationale was supplied"
  - id: ERR_KIOSK_POSTURE_LOCKDOWN
    http: 422
    condition: "production is planned, released or packed at a kiosk whose sanitation_posture is LOCKDOWN"
  - id: ERR_FISH_LOT_NOT_RELEASED
    http: 422
    condition: "the fish lot backing a pack lot is not in status RELEASED"

  # --- business_temporal (priority 9) ---------------------------------------
  - id: ERR_ACIDIFICATION_WINDOW_OVERLAP
    http: 422
    condition: "a new rice batch's half-open [hold_start_at, hold_end_at) window overlaps the window of another non-REJECTED batch on the same kiosk; a batch beginning exactly when another ends does not overlap"
  - id: ERR_PLAN_DATE_OUTSIDE_AGREEMENT
    http: 422
    condition: "the production_date falls outside the license agreement's closed [effective_from, effective_to] term"
  - id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http: 422
    condition: "the requested closed [period_start, period_end] interval shares at least one date with a non-VOID settlement statement of the same agreement"
  - id: ERR_AUDIT_NOT_YET_DUE
    http: 422
    condition: "an audit is started before its scheduled_for instant"
  - id: ERR_PACK_SHELF_LIFE_EXPIRED
    http: 422
    condition: "a markdown is attempted at or after the pack lot's shelf_expiry_at"

  # --- business_referential (priority 10) -----------------------------------
  - id: ERR_CROSS_KIOSK_REFERENCE
    http: 422
    condition: "a pack lot's rice batch and fish lot resolve to different kiosks, or a POS feed line references a pack lot produced at a kiosk outside the feed's host store"
  - id: ERR_PERIOD_FEED_NOT_RECONCILED
    http: 422
    condition: "a production plan is reconciled while a POS sales feed for its host store and production_date is still SUBMITTED"
  - id: ERR_POS_NOT_CONNECTED
    http: 422
    condition: "a POS sales feed is reconciled while the host store's pos_integration_status is not CONNECTED"

  # --- business_constraint (priority 11) ------------------------------------
  - id: ERR_RICE_YIELD_EXCEEDED
    http: 422
    condition: "a pack lot's pack_count exceeds the rice batch's max_pack_yield"
  - id: ERR_PACK_CAP_EXCEEDED
    http: 422
    condition: "the pack lots live against a plan would exceed the plan's planned_pack_count, or the kiosk's live pack total would exceed daily_pack_cap"
  - id: ERR_CASE_CAPACITY_EXCEEDED
    http: 422
    condition: "the aggregate live pack count across the host store's kiosks would exceed the refrigerated case capacity derived from the attested case frontage"
  - id: ERR_DUPLICATE_FEED_FOR_DATE
    http: 422
    condition: "a POS sales feed already exists for the same host store and business_date and is not REJECTED"
  - id: ERR_OPEN_FINDINGS_BLOCK_REVERIFICATION
    http: 422
    condition: "reverification is requested while at least one finding of the audit is still OPEN"
  - id: ERR_FINDING_NOT_WAIVABLE
    http: 422
    condition: "a waiver is attempted on a finding whose severity is MAJOR or CRITICAL"
  - id: ERR_CORRECTIVE_ROUNDS_EXHAUSTED
    http: 422
    condition: "reverification is requested after the audit has already reached ESCALATED_CLOSURE, or a revision is requested on a statement whose revision_round has reached its bound"

  # --- business_fiscal (priority 12) ----------------------------------------
  - id: ERR_NO_SETTLEABLE_SALES
    http: 422
    condition: "a settlement statement is issued while no POS sales feed with status RECONCILED falls inside its closed period"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount_cents does not equal the statement's net_due_cents exactly"
  - id: ERR_INSUFFICIENT_FISH_INVENTORY
    http: 422
    condition: "the fish mass a pack lot would consume exceeds the source lot's remaining_kg"
  - id: ERR_SPACE_OBLIGATION_DEFICIENT
    http: 422
    condition: "a license agreement is activated while its host store's space_compliance_state is UNVERIFIED, meaning the manager has never attested the dedicated space"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FranchisorOps
    description: "Hissho franchisor operations staff. Owns the commercial surface: host store registration, license agreements, kiosk provisioning and lifecycle, POS feed adjudication, settlement statements, plan reconciliation and pack-lot voids. Not a food-safety authority and cannot certify chefs or decide HACCP variances."
    identity: "opaque"
    exclusive_operations:
      - "POST /kiosk-ops/host-stores"
      - "POST /kiosk-ops/license-agreements and its activate, suspend, reinstate and terminate actions"
      - "POST /kiosk-ops/chefs"
      - "POST /kiosk-ops/chefs/{id}/training"
      - "POST /kiosk-ops/chefs/{id}/placement"
      - "POST /kiosk-ops/kiosks and its commission, reinstate and decommission actions"
      - "POST /kiosk-ops/production-plans/{id}/reconcile"
      - "POST /kiosk-ops/production-plans/{id}/void"
      - "POST /kiosk-ops/pack-lots/{id}/void"
      - "POST /kiosk-ops/pos-sales-feeds/{id}/reconcile and reject"
      - "POST /kiosk-ops/settlement-statements and its issue, revise and void actions"
    shared_operations:
      - "POST /kiosk-ops/production-plans (shared with FranchiseChef)"
      - "POST /kiosk-ops/kiosks/{id}/suspend (shared with QualityAuditor)"
      - "every GET in the catalogue except the chef-scoped certification list"

  - name: HostStoreManager
    description: "Manager of the grocery or convenience store hosting the kiosk. Attests the dedicated space and case frontage, runs the POS integration, submits the daily sales extract, and drives the host-store side of settlement and audit corrective action. Scoped strictly to its own HostStore."
    identity: "entity_backed:HostStore"
    exclusive_operations:
      - "POST /kiosk-ops/host-stores/{id}/pos-integration"
      - "POST /kiosk-ops/host-stores/{id}/space-attestation"
      - "POST /kiosk-ops/pos-sales-feeds"
      - "POST /kiosk-ops/settlement-statements/{id}/acknowledge, dispute and pay"
      - "POST /kiosk-ops/audits/{id}/findings/{finding_id}/correct"
      - "POST /kiosk-ops/audits/{id}/request-reverification"
    shared_operations:
      - "read access to its own store's agreements, kiosks, plans, pack lots, feeds, statements and audits"

  - name: FranchiseChef
    description: "The placed franchise sushi chef. Owns everything that touches product: plan release, rice mixing and acidification records, HACCP variance filing, fish receiving and freezing records, cold-chain readings, pack building, markdown and discard. Scoped strictly to the Kiosk they are assigned to, and cannot decide their own variance."
    identity: "entity_backed:Chef"
    exclusive_operations:
      - "POST /kiosk-ops/production-plans/{id}/release"
      - "POST /kiosk-ops/production-plans/{id}/lock"
      - "POST /kiosk-ops/rice-batches"
      - "POST /kiosk-ops/rice-batches/{id}/acidification-reading"
      - "POST /kiosk-ops/rice-batches/{id}/variance-request"
      - "POST /kiosk-ops/fish-lots"
      - "POST /kiosk-ops/fish-lots/{id}/parasite-destruction"
      - "POST /kiosk-ops/pack-lots"
      - "POST /kiosk-ops/pack-lots/{id}/markdown"
    shared_operations:
      - "POST /kiosk-ops/production-plans (shared with FranchisorOps)"
      - "POST /kiosk-ops/rice-batches/{id}/verify-ttc (shared with QualityAuditor)"
      - "POST /kiosk-ops/fish-lots/{id}/cold-chain-readings (shared with QualityAuditor)"
      - "POST /kiosk-ops/pack-lots/{id}/discard (shared with QualityAuditor)"
      - "read access to its own kiosk's plans, batches, lots and packs"

  - name: QualityAuditor
    description: "Independent food-safety and quality authority. Issues and revokes chef certifications, decides and revokes HACCP rice variances, releases or destroys fish lots, and runs the whole audit lifecycle up to kiosk closure. Deliberately holds no commercial powers: cannot register stores, write agreements, submit feeds or touch settlement money."
    identity: "opaque"
    exclusive_operations:
      - "POST /kiosk-ops/chefs/{id}/certifications"
      - "POST /kiosk-ops/chefs/{id}/certifications/{certification_id}/revoke"
      - "POST /kiosk-ops/rice-batches/{id}/variance-decision"
      - "POST /kiosk-ops/rice-batches/{id}/revoke-variance"
      - "POST /kiosk-ops/fish-lots/{id}/release"
      - "POST /kiosk-ops/fish-lots/{id}/destroy"
      - "POST /kiosk-ops/audits and its start, submit and verify actions"
      - "POST /kiosk-ops/audits/{id}/findings"
      - "POST /kiosk-ops/audits/{id}/findings/{finding_id}/waive"
    shared_operations:
      - "POST /kiosk-ops/kiosks/{id}/suspend (shared with FranchisorOps)"
      - "POST /kiosk-ops/rice-batches/{id}/verify-ttc (shared with FranchiseChef)"
      - "POST /kiosk-ops/fish-lots/{id}/cold-chain-readings (shared with FranchiseChef)"
      - "POST /kiosk-ops/pack-lots/{id}/discard (shared with FranchiseChef)"
      - "read access across every kiosk, plan, batch, lot, pack and audit"

# =============================================================================
# Segregation of duties (role_model: segregation_of_duties)
# =============================================================================
segregation_of_duties:
  - rule: "the X-User-ID issuing a settlement statement must differ from created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule: "the X-User-ID verifying an audit must differ from opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule: "a HACCP variance is filed by a FranchiseChef and decided by a QualityAuditor; the two roles are disjoint, so the filer can never decide"
    error_id: ERR_FORBIDDEN_ROLE
