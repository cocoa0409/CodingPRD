              captures: { a1_id: $.data.id }
            - call: "POST /plan-admin/remittance-batches"
              payload: { plan_id: "${p403_id}", pay_period_start: "2026-07-01", pay_period_end: "2026-07-16", withholding_date: "2026-07-15", total_elective_deferral_cents: 100000, line_items: [{ vendor_account_id: "${a1_id}", elective_deferral_cents: 100000, employer_contribution_cents: 0 }] }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { batch_id: $.data.id }
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/remittance-batches/${batch_id}/deposit"
              payload: { deposit_date: "2026-09-30" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "GET /plan-admin/remittance-batches/${batch_id}/corrections"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { corr_id: "$.data[0].id" }
          trigger:
            - call: "POST /plan-admin/remittance-batches/${batch_id}/corrections/${corr_id}/settle"
              payload: { settlement_reference: "VFCP-2026-0042" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /plan-admin/remittance-batches/${batch_id}/corrections/${corr_id}/settle"
              payload: { settlement_reference: "VFCP-2026-0042-DUP" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
          assert:
            - "before settlement: Plan.${p403_id}.open_correction_count == 1, matching the single OPEN RemittanceCorrection, and SUM of pending_lost_earnings_cents == 658 matching that correction's lost_earnings_total_cents"
            - "after settlement: RemittanceCorrection.${corr_id}.state == SETTLED, settlement_reference == VFCP-2026-0042, settled_by_user_id == co-2"
            - "after settlement: Plan.${p403_id}.open_correction_count == 0, matching zero OPEN corrections"
            - "after settlement: VendorAccount.${a1_id}.pending_lost_earnings_cents == 0, so the sum side of the invariant is 0 as well"
            - "after settlement: Plan.${p403_id}.compliance_posture == CLEAR"
            - "after settlement: RemittanceBatch.${batch_id}.compliance_state == CORRECTED while deposit_state stays DEPOSITED"
            - "after settlement: VendorAccount.${a1_id}.ytd_elective_deferrals_cents == 100000 — settling a correction does not unwind the deposit"
            - "the repeat settlement responds 409 with data.error_id == ERR_CORRECTION_NOT_SETTLEABLE and leaves open_correction_count at 0"
