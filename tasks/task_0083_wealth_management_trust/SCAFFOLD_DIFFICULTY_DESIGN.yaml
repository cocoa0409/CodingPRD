              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/terminate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/filings"
              payload: {}
              as: TrustAdmin
              captures: { filing_id: $.data.id }
            - call: "POST /filings/${filing_id}/file"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /trusts/${trust_id}/terminate/finalize"
              payload: {}
              as: TrustAdmin
              captures: { st: $.data.status }
            - call: "GET /trusts/${trust_id}/gst-events"
              payload: {}
              as: TrustAdmin
          assert:
            - "Trust.${trust_id}.status == TERMINATED"
            - "GET /trusts/${trust_id}/gst-events total_count == 0"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2; different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: distribution_pay_blocked_when_trust_revoked
        grounds:
          - state_machines.Distribution.APPROVED_to_PAID
          - state_machines.Trust.ACTIVE_to_REVOKED
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair Distribution -> Trust: the APPROVED_to_PAID transition's valid-next-state set
          depends on the owning Trust's status (must be ACTIVE or TERMINATING). After the REVOCABLE
          trust is REVOKED, an already-APPROVED distribution can no longer be PAID and pay returns
          ERR_INVALID_STATE — Distribution payability is gated by Trust state (distinct pair from
          instance 2's TaxFiling->TrustAccount).
        test_recipe:
          setup:
            - "ACTIVE REVOCABLE trust with 5000000 principal; one MANDATORY distribution of 10000 to non-skip Ben A, APPROVED (proposer t1, approver t2); then grantor REVOKES the trust (ACTIVE -> REVOKED)."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G C7a", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Prop T" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Appr T" }
              as: TrustAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "C7a Trust", grantor_id: "${g_id}", trust_type: "REVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t2_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 10000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t1_id}" }
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /distributions/${dist_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t2_id}"
            - call: "POST /trusts/${trust_id}/revoke"
              payload: {}
              as: Grantor
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: tax_filing_file_blocked_when_account_open
        grounds:
          - state_machines.TaxFiling.DRAFT_to_FILED
          - state_machines.TrustAccount.OPEN_to_CLOSED
          - entities.TrustAccount.fields.status
        distinguishing_aspect: |
          Different entity pair TaxFiling -> TrustAccount: a DRAFT TaxFiling cannot be FILED while its
          owning TrustAccount is still OPEN. Filing a never-closed account is rejected with
          ERR_INVALID_STATE — TaxFiling validity depends on TrustAccount state (distinct pair from
          Distribution->Trust).
        test_recipe:
          setup:
            - "ACTIVE non-grantor trust; account OPEN (NOT closed) with taxable_income=2000000; a DRAFT filing created on it (creation does not require CLOSED, only filing does)."
            - "Note: POST /accounts/{id}/filings does not require the account to be CLOSED; only file does. So the DRAFT filing is created while OPEN."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G C7b", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T C7b" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "C7b Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", is_grantor_trust: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 1, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 2000000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/filings"
              payload: {}
              as: TrustAdmin
              captures: { filing_id: $.data.id }
          trigger:
            - call: "POST /filings/${filing_id}/file"
              payload: {}
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2; different interval semantics & resources)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: account_period_half_open_overlap_rejected_abutting_allowed
        grounds:
          - validations[priority=8]
          - entities.TrustAccount.fields.period_start
          - entities.TrustAccount.fields.period_end
        distinguishing_aspect: |
          Half-open interval semantics on the Trust resource: a second account [2025-06-01, 2026-06-01)
          that overlaps an existing [2025-01-01, 2026-01-01) is rejected with ERR_ACCOUNT_PERIOD_OVERLAP,
          whereas an exactly-abutting period [2026-01-01, 2027-01-01) (period_end == next period_start)
          is ALLOWED — the distinguishing geometric treatment is adjacency-permitted half-open intervals.
        test_recipe:
          setup:
            - "A trust (any status) with one existing account [2025-01-01, 2026-01-01)."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G B8a", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "B8a Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct1_id: $.data.id }
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2026, period_start: "2026-01-01T00:00:00.000Z", period_end: "2027-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_abut_id: $.data.id }
          trigger:
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-06-01T00:00:00.000Z", period_end: "2026-06-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "The abutting account ${acct_abut_id} was created successfully (201)"
            - "The overlapping trigger returns status 409 and data.error_id == ERR_ACCOUNT_PERIOD_OVERLAP"

      - name: trustee_term_closed_interval_buffer_gap_conflict
        grounds:
          - validations[priority=9]
          - entities.TrusteeAppointment.fields.term_start
          - entities.TrusteeAppointment.fields.term_end
        distinguishing_aspect: |
          Closed-interval-plus-buffer semantics on the (Trust, Trustee) seat resource: a re-appointment
          of the SAME trustee starting 2030-01-15 — 14 days after the prior term_end 2030-01-01, inside
          the 30-day TRUSTEE_GAP_DAYS buffer — is rejected with ERR_TRUSTEE_TERM_CONFLICT even though the
          intervals do not overlap. This differs from instance 1's adjacency-allowed half-open geometry.
        test_recipe:
          setup:
            - "A trust with one ACTIVE appointment of trustee T1 for [2025-01-01, 2030-01-01]."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G B8b", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Seat T1" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "B8b Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { app1_id: $.data.id }
          trigger:
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2030-01-15T00:00:00.000Z", term_end: "2035-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_TRUSTEE_TERM_CONFLICT"

  # =========================================================================
  # Rule 9 — compensating_invariant (>= 2; different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: distribution_pay_reverse_preserves_liquid_corpus
        grounds:
          - state_machines.Distribution.APPROVED_to_PAID
          - state_machines.Distribution.PAID_to_REVERSED
          - entities.Trust.fields.principal_balance_cents
          - entities.Trust.fields.income_balance_cents
        distinguishing_aspect: |
          Conserved quantity Q1 = Trust.principal_balance_cents + Trust.income_balance_cents. Paying a
          50000 distribution then REVERSING it restores Q1 to its pre-pay value 6500000 (principal
          5000000 + income 1500000) with zero drift — the reverse credit is the exact inverse of the
          pay debit.
        test_recipe:
          setup:
            - "ACTIVE non-grantor trust; account OPEN principal=5000000 (contribution), income=1500000 (INTEREST); one MANDATORY distribution 50000 to non-skip Ben A, APPROVED then PAID; Q1 pre-pay = 6500000."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G I9a", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Prop T" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Appr T" }
              as: TrustAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "I9a Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", capital_gains_to_income: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t2_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 1500000, receipt_kind: "INTEREST" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 50000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t1_id}" }
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /distributions/${dist_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t2_id}"
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Trustee
              as_user_id: "${t1_id}"
          trigger:
            - call: "POST /distributions/${dist_id}/reverse"
              payload: {}
              as: TrustAdmin
            - call: "GET /trusts/${trust_id}"
              payload: {}
              as: TrustAdmin
              captures: { prin: $.data.principal_balance_cents, inc: $.data.income_balance_cents }
          assert:
            - "Trust.${trust_id}.principal_balance_cents == 5000000"
            - "Trust.${trust_id}.income_balance_cents == 1500000"
            - "principal_balance_cents + income_balance_cents == 6500000 (Q1 restored, zero drift)"

      - name: gst_exemption_allocate_release_preserves_pool
        grounds:
          - state_machines.GstExemptionAllocation.ALLOCATED_to_RELEASED
          - entities.Grantor.fields.gst_exemption_remaining_cents
          - entities.Trust.fields.gst_exemption_allocated_cents
        distinguishing_aspect: |
          Different conserved quantity Q2 = Grantor.gst_exemption_remaining_cents +
          Trust.gst_exemption_allocated_cents == Grantor.gst_exemption_total_cents (1399000000). Allocating
          2000000 then RELEASING it restores Grantor.gst_exemption_remaining_cents to 1399000000 and
          Trust.gst_exemption_allocated_cents to 0 with zero drift in the GST exemption pool.
        test_recipe:
          setup:
            - "ACTIVE trust owned by grantor G with default gst_exemption_total_cents=1399000000; 5000000 principal; no skip beneficiaries (so release is permitted -- no GstEvent consumes the allocation)."
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G I9b", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T I9b" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "I9b Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "GET /trusts/${trust_id}"
              payload: {}
              as: TrustAdmin
              captures: { tv: $.data.version }
            - call: "POST /trusts/${trust_id}/gst-exemption-allocations"
              payload: { grantor_id: "${g_id}", amount_cents: 2000000, expected_trust_version: "${tv}" }
              as: TrustAdmin
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "DELETE /trusts/${trust_id}/gst-exemption-allocations/${alloc_id}"
              payload: {}
              as: TrustAdmin
            - call: "GET /grantors/${g_id}"
              payload: {}
              as: TrustAdmin
              captures: { remaining: $.data.gst_exemption_remaining_cents }
            - call: "GET /trusts/${trust_id}"
              payload: {}
              as: TrustAdmin
              captures: { allocated: $.data.gst_exemption_allocated_cents }
          assert:
            - "Grantor.${g_id}.gst_exemption_remaining_cents == 1399000000"
            - "Trust.${trust_id}.gst_exemption_allocated_cents == 0"
            - "remaining + allocated == 1399000000 (Q2 restored, zero drift)"
