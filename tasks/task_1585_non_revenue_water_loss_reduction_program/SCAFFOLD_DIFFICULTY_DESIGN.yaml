scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: water_balance_provisional_vs_audited_nrw
        grounds:
          - calculations.water_balance_nrw
          - state_machines.WaterBalancePeriod.SUBMITTED_to_FINALIZED
          - entities.WaterBalancePeriod.fields.nrw_pct
        distinguishing_aspect: |
          Same WaterBalancePeriod inputs produce nrw_pct 28.0 under the PROVISIONAL
          variant (status SUBMITTED) and 27.5 under the AUDITED variant (status
          FINALIZED) because the audited variant subtracts min(0.50, base*0.10) = 0.50
          percentage points — a dual-variant calculation on the water-balance domain.
        test_recipe:
          setup:
            - "DMA with connection_count 5000, mains_length_km 120.0 exists (posture OPEN, version captured)"
            - "WaterBalancePeriod 2026-01-01..2026-04-01 with SIV=1000000, billed=720000, unbilled=40000, unauth=15000, meter_inacc=25000, created by user ua-1 and submitted"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-DV1", name: "Dual Variant One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_dv1: $.data.id, dma_dv1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_dv1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_dv1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_dv1: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_dv1}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
          trigger:
            - call: "GET /nrw/water-balance-periods/${wbp_dv1}"
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { prov_pct: $.data.nrw_pct }
            - call: "POST /nrw/water-balance-periods/${wbp_dv1}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
          assert:
            - "captured provisional nrw_pct == 28.0"
            - "WaterBalancePeriod.${wbp_dv1}.nrw_pct == 27.5 after finalize"
            - "WaterBalancePeriod.${wbp_dv1}.status == FINALIZED"
            - "WaterBalancePeriod.${wbp_dv1}.ili == 24.39"

      - name: intervention_bcr_provisional_vs_bankable
        grounds:
          - calculations.intervention_benefit_cost
          - state_machines.InterventionProposal.SUBMITTED_to_APPROVED
          - entities.InterventionProposal.fields.benefit_cost_ratio
        distinguishing_aspect: |
          Identical InterventionProposal inputs produce benefit_cost_ratio 1.0 under
          the PROVISIONAL discount rate (7%) at submit and 1.26 under the BANKABLE
          rate (4%) at approve — a dual-variant calculation on the intervention
          cost-benefit domain, distinct from the water-balance domain.
        test_recipe:
          setup:
            - "DMA exists (posture OPEN, version captured)"
            - "InterventionProposal MID-tier: capital_cost 1271281.68, annual_om_cost 10000, expected_volume_saved 100000, submitted (PROVISIONAL BCR computed)"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-DV2", name: "Dual Variant Two", connection_count: 3000, mains_length_km: 80.0, target_nrw_pct: 18.0 }
              as: ProgramDirector
              captures: { dma_dv2: $.data.id }
            - call: "POST /nrw/intervention-proposals"
              payload: { dma_id: "${dma_dv2}", kind: "LEAK_REPAIR_PROGRAM", capital_cost: 1271281.68, annual_om_cost: 10000, expected_volume_saved_m3_per_year: 100000 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { ip_dv2: $.data.id, bcr_prov: $.data.benefit_cost_ratio }
            - call: "POST /nrw/intervention-proposals/${ip_dv2}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
          trigger:
            - call: "POST /nrw/intervention-proposals/${ip_dv2}/approve"
              payload: {}
              as: ProgramDirector
          assert:
            - "captured provisional benefit_cost_ratio == 1.0"
            - "InterventionProposal.${ip_dv2}.benefit_cost_ratio == 1.26 after approve (BANKABLE)"
            - "InterventionProposal.${ip_dv2}.status == APPROVED"
            - "InterventionProposal.${ip_dv2}.payback_years == 10.6"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) and (c))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: leak_priority_multi_input_conditional_branch
        grounds:
          - calculations.leak_repair_priority
          - entities.Leak.fields.repair_priority_score
          - entities.Leak.fields.priority_band
        distinguishing_aspect: |
          Mode (a): the leak score has >= 3 inputs (estimated_loss_lps,
          repair_cost_estimate, presence of an ACTIVE PressureProject, current
          status) with non-linear interaction — a nested min(100, ...) cap plus a
          conditional 1.25 multiplier branch keyed on sibling-entity state. Leak A
          (2.0 lps, 8000 cost, no project) scores 18.92 (P3); identical Leak B
          under a DMA with an ACTIVE pressure project scores 23.65 (P2).
        test_recipe:
          setup:
            - "DMA-A plain (no pressure project); DMA-B with an APPROVED PressureProject activated (clock advanced to planned_start)"
            - "Both DMAs have an IN_FIELD LeakSurvey"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-CF1A", name: "Combo One A", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_cf1a: $.data.id }
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-CF1B", name: "Combo One B", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_cf1b: $.data.id }
            - call: "POST /nrw/pressure-projects"
              payload: { dma_id: "${dma_cf1b}", name: "PRV B", planned_start: "2026-08-01T00:00:00Z", planned_end: "2026-09-01T00:00:00Z", baseline_pressure_m: 60.0, target_pressure_m: 42.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { pp_cf1: $.data.id }
            - call: "POST /nrw/pressure-projects/${pp_cf1}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /nrw/pressure-projects/${pp_cf1}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /nrw/leak-surveys"
              payload: { dma_id: "${dma_cf1a}", planned_start: "2026-08-02T00:00:00Z", planned_end: "2026-08-10T00:00:00Z", method: "ACOUSTIC", crew_lead_user_id: "fs-1" }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { sv_cf1a: $.data.id }
            - call: "POST /nrw/leak-surveys"
              payload: { dma_id: "${dma_cf1b}", planned_start: "2026-08-02T00:00:00Z", planned_end: "2026-08-10T00:00:00Z", method: "ACOUSTIC", crew_lead_user_id: "fs-1" }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { sv_cf1b: $.data.id }
            - call: "POST /nrw/leak-surveys/${sv_cf1a}/start"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leak-surveys/${sv_cf1b}/start"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
          trigger:
            - call: "POST /nrw/leaks"
              payload: { survey_id: "${sv_cf1a}", location_description: "Main & 1st", estimated_loss_lps: 2.0, detected_at: "2026-08-02T02:00:00Z", repair_cost_estimate: 8000 }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { leak_a: $.data.id }
            - call: "POST /nrw/leaks"
              payload: { survey_id: "${sv_cf1b}", location_description: "Main & 2nd", estimated_loss_lps: 2.0, detected_at: "2026-08-02T03:00:00Z", repair_cost_estimate: 8000 }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { leak_b: $.data.id }
          assert:
            - "Leak.${leak_a}.repair_priority_score == 18.92"
            - "Leak.${leak_a}.priority_band == P3"
            - "Leak.${leak_b}.repair_priority_score == 23.65"
            - "Leak.${leak_b}.priority_band == P2"
            - "Leak.${leak_a}.annualized_loss_m3 == 63072.0"

      - name: intervention_bcr_pinned_evaluation_order
        grounds:
          - calculations.intervention_benefit_cost
          - entities.InterventionProposal.fields.benefit_cost_ratio
          - entities.InterventionProposal.fields.payback_years
        distinguishing_aspect: |
          Mode (c): the BCR formula has a circular-looking dependency — the tier
          selection reads expected_volume_saved_m3_per_year, the discounted benefit
          reads the tier value, and the ratio reads the discounted benefit and the
          discounted cost — so the scaffold pins evaluation order (tiers -> pv_factor
          -> pv_benefit -> pv_cost -> ratio). A HIGH-tier proposal (300000 m3/yr,
          900000 capital, 20000 om) yields PROVISIONAL BCR 4.43 and payback 2.0
          years; computing with a different order (e.g. averaging tier values)
          produces a different number.
        test_recipe:
          setup:
            - "DMA exists (posture OPEN)"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-CF2", name: "Combo Two", connection_count: 2000, mains_length_km: 50.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_cf2: $.data.id }
          trigger:
            - call: "POST /nrw/intervention-proposals"
              payload: { dma_id: "${dma_cf2}", kind: "PRESSURE_MANAGEMENT", capital_cost: 900000, annual_om_cost: 20000, expected_volume_saved_m3_per_year: 300000 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { ip_cf2: $.data.id }
          assert:
            - "InterventionProposal.${ip_cf2}.benefit_cost_ratio == 4.43"
            - "InterventionProposal.${ip_cf2}.payback_years == 2.0"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: leak_repair_rework_cycle
        grounds:
          - state_machines.Leak.REPAIRED_to_REOPENED
          - state_machines.Leak.REOPENED_to_REPAIR_SCHEDULED
          - calculations.leak_repair_priority
        distinguishing_aspect: |
          Cyclic machine on Leak: REPAIRED -> REOPENED -> REPAIR_SCHEDULED -> REPAIRED
          forms a rework loop; the REOPENED recompute applies the 1.10 REOPEN_MULTIPLIER,
          so a leak that re-enters scheduling after reopen carries a strictly higher
          score than its pre-repair value (23.65 -> 26.02 for the 2.0-lps/8000-cost
          leak under an active pressure project).
        test_recipe:
          setup:
            - "DMA with an ACTIVE PressureProject and an IN_FIELD LeakSurvey"
            - "Leak (2.0 lps, cost 8000) driven REPORTED -> VERIFIED -> REPAIR_SCHEDULED -> REPAIRED (cost 7500)"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-NL1", name: "Nonlinear One", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_nl1: $.data.id }
            - call: "POST /nrw/pressure-projects"
              payload: { dma_id: "${dma_nl1}", name: "PRV NL1", planned_start: "2026-08-01T00:00:00Z", planned_end: "2026-09-01T00:00:00Z", baseline_pressure_m: 60.0, target_pressure_m: 42.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { pp_nl1: $.data.id }
            - call: "POST /nrw/pressure-projects/${pp_nl1}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /nrw/pressure-projects/${pp_nl1}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /nrw/leak-surveys"
              payload: { dma_id: "${dma_nl1}", planned_start: "2026-08-02T00:00:00Z", planned_end: "2026-08-10T00:00:00Z", method: "CORRELATOR", crew_lead_user_id: "fs-1" }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { sv_nl1: $.data.id }
            - call: "POST /nrw/leak-surveys/${sv_nl1}/start"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks"
              payload: { survey_id: "${sv_nl1}", location_description: "Valve 9", estimated_loss_lps: 2.0, detected_at: "2026-08-02T02:00:00Z", repair_cost_estimate: 8000 }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { leak_nl1: $.data.id }
            - call: "POST /nrw/leaks/${leak_nl1}/verify"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks/${leak_nl1}/schedule-repair"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks/${leak_nl1}/complete-repair"
              payload: { actual_repair_cost: 7500 }
              as: FieldSupervisor
              as_user_id: "fs-1"
          trigger:
            - call: "POST /nrw/leaks/${leak_nl1}/reopen"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks/${leak_nl1}/schedule-repair"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
          assert:
            - "Leak.${leak_nl1}.status == REPAIR_SCHEDULED after the rework loop"
            - "Leak.${leak_nl1}.repair_priority_score == 26.02 (23.65 * 1.10)"
            - "Leak.${leak_nl1}.actual_repair_cost == 7500 (retained across the cycle)"

      - name: unauthorized_case_parallel_dimensions
        grounds:
          - state_machines.UnauthorizedConsumptionCase
          - entities.UnauthorizedConsumptionCase.fields.investigation_status
          - entities.UnauthorizedConsumptionCase.fields.billing_adjustment_status
        distinguishing_aspect: |
          Parallel state dimensions on UnauthorizedConsumptionCase:
          investigation_status (OPEN -> EVIDENCE_GATHERING -> SUBSTANTIATED -> CLOSED)
          and billing_adjustment_status (NONE -> PROPOSED -> APPROVED -> POSTED)
          evolve as independent axes on one row; billing transitions are gated on
          investigation_status == SUBSTANTIATED but the close transition reads the
          billing axis (SUBSTANTIATED x PROPOSED rejects close; SUBSTANTIATED x
          POSTED allows it).
        test_recipe:
          setup:
            - "DMA exists; case opened, evidence begun, substantiated (loss 1200), adjustment proposed 5000 by investigator inv-1"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-NL2", name: "Nonlinear Two", connection_count: 800, mains_length_km: 20.0, target_nrw_pct: 12.0 }
              as: ProgramDirector
              captures: { dma_nl2: $.data.id }
            - call: "POST /nrw/unauthorized-consumption-cases"
              payload: { dma_id: "${dma_nl2}", service_location_ref: "LOC-77", opened_at: "2026-08-01T00:00:00Z" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { case_nl2: $.data.id }
            - call: "POST /nrw/unauthorized-consumption-cases/${case_nl2}/begin-evidence"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /nrw/unauthorized-consumption-cases/${case_nl2}/substantiate"
              payload: { estimated_loss_m3: 1200 }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /nrw/unauthorized-consumption-cases/${case_nl2}/propose-adjustment"
              payload: { proposed_adjustment_amount: 5000 }
              as: Investigator
              as_user_id: "inv-1"
          trigger:
            - call: "POST /nrw/unauthorized-consumption-cases/${case_nl2}/close"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
              captures: { close_err: $.data.error_id }
            - call: "POST /nrw/unauthorized-consumption-cases/${case_nl2}/approve-adjustment"
              payload: {}
              as: ProgramDirector
            - call: "POST /nrw/unauthorized-consumption-cases/${case_nl2}/post-adjustment"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /nrw/unauthorized-consumption-cases/${case_nl2}/close"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
          assert:
            - "first close rejected with ERR_INVALID_STATE (billing axis PROPOSED)"
            - "after approve+post: billing_adjustment_status == POSTED"
            - "UnauthorizedConsumptionCase.${case_nl2}.posted_adjustment_amount == 5000"
            - "final close succeeds: investigation_status == CLOSED while billing stays POSTED"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: benchmark_submit_freezes_dma_blocks_finalize
        grounds:
          - state_machines.BenchmarkReport.DRAFT_to_SUBMITTED
          - state_machines.DistrictMeteredArea.RESTRICTED_to_FROZEN
          - validations[priority=6]
          - calculations.benchmark_nrw_aggregation
        distinguishing_aspect: |
          Depth-3 chain triggered by BenchmarkReport submit: (1) report submit
          computes/freeze snapshot -> (2) each listed DMA's posture mutates to FROZEN
          -> (3) that posture mutation itself rejects an in-flight WaterBalancePeriod
          finalize on the same DMA with ERR_DMA_FROZEN — the third hop is caused by
          the second, not by the submit directly.
        test_recipe:
          setup:
            - "DMA with a FINALIZED balance (Jan-Mar window) AND a second balance in SUBMITTED state (Apr-Jun window) — DMA posture RESTRICTED before report submit"
            - "BenchmarkReport DRAFT covering 2026 full year listing this DMA; report version captured"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-TC1", name: "Cascade One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_tc1: $.data.id, dma_tc1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_tc1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_tc1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_tc1a: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_tc1a}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/water-balance-periods/${wbp_tc1a}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
            - call: "GET /nrw/dmas/${dma_tc1}"
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { dma_tc1_v2: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_tc1}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", system_input_volume_m3: 900000, billed_authorized_m3: 700000, unbilled_authorized_m3: 30000, unauthorized_consumption_m3: 12000, metering_inaccuracy_m3: 20000, expected_dma_version: "${dma_tc1_v2}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_tc1b: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_tc1b}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/benchmark-reports"
              payload: { reporting_year: 2026, reporting_period_start: "2026-01-01T00:00:00Z", reporting_period_end: "2026-12-31T00:00:00Z", dma_ids: ["${dma_tc1}"] }
              as: RegulatorLiaison
              captures: { br_tc1: $.data.id, br_tc1_v: $.data.version }
          trigger:
            - call: "POST /nrw/benchmark-reports/${br_tc1}/submit"
              payload: { expected_report_version: "${br_tc1_v}" }
              as: RegulatorLiaison
            - call: "POST /nrw/water-balance-periods/${wbp_tc1b}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
              captures: { fin_err: $.data.error_id }
          assert:
            - "BenchmarkReport.${br_tc1}.status == SUBMITTED"
            - "BenchmarkReport.${br_tc1}.utility_nrw_pct == 27.5"
            - "DistrictMeteredArea.${dma_tc1}.posture == FROZEN"
            - "finalize after freeze rejected: captured error_id == ERR_DMA_FROZEN"
            - "WaterBalancePeriod.${wbp_tc1b}.status remains SUBMITTED"

      - name: meter_test_fail_flags_meter_then_replace_spawns_successor
        grounds:
          - state_machines.MeterAccuracyTest.SCHEDULED_to_COMPLETED
          - state_machines.CustomerMeter.IN_SERVICE_to_FLAGGED_FOR_REPLACEMENT
          - state_machines.CustomerMeter.FLAGGED_FOR_REPLACEMENT_to_REPLACED
        distinguishing_aspect: |
          Depth-2 chain triggered by MeterAccuracyTest complete: (1) test completes
          with result FAIL -> (2) parent CustomerMeter cascades to
          FLAGGED_FOR_REPLACEMENT and last_test_accuracy_pct updates — the meter
          mutation is caused by the test completion, and the subsequent replace
          transition (reachable only because of that flag) spawns the successor
          meter; a different trigger than the benchmark-submit cascade.
        test_recipe:
          setup:
            - "DMA exists; CustomerMeter serial SN-TC2 policy ACCURACY_BASED IN_SERVICE; a SCHEDULED accuracy test exists"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-TC2", name: "Cascade Two", connection_count: 600, mains_length_km: 15.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { dma_tc2: $.data.id }
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_tc2}", serial_number: "SN-TC2", size_mm: 20, installed_at: "2020-01-01T00:00:00Z", replacement_policy: "ACCURACY_BASED" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_tc2: $.data.id }
            - call: "POST /nrw/meter-accuracy-tests"
              payload: { meter_id: "${m_tc2}", tested_at: "2026-08-01T10:00:00Z", flow_rate_lps: 0.5 }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { t_tc2: $.data.id }
          trigger:
            - call: "POST /nrw/meter-accuracy-tests/${t_tc2}/complete"
              payload: { registered_volume_m3: 97.99, reference_volume_m3: 100.0 }
              as: MeterTechnician
              as_user_id: "mt-1"
            - call: "POST /nrw/customer-meters/${m_tc2}/replace"
              payload: { serial_number: "SN-TC2-NEW" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_tc2_new: $.data.id }
          assert:
            - "MeterAccuracyTest.${t_tc2}.accuracy_pct == 97.99"
            - "MeterAccuracyTest.${t_tc2}.result == FAIL"
            - "CustomerMeter.${m_tc2}.status == REPLACED after the replace"
            - "CustomerMeter.${m_tc2}.last_test_accuracy_pct == 97.99"
            - "successor CustomerMeter.${m_tc2_new}.status == IN_SERVICE and serial_number == SN-TC2-NEW"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_dma_state_error_beats_missing_prerequisite
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_DMA_FROZEN]
          - errors[ERR_MISSING_PREREQUISITE]
        distinguishing_aspect: |
          Pair (state vs business_referential): a WaterBalancePeriod finalize fired
          while the DMA is FROZEN by a submitted BenchmarkReport surfaces
          ERR_DMA_FROZEN (priority 6) even though the period would also fail a later
          content check — the state-category error wins over the
          business_referential one.
        test_recipe:
          setup:
            - "DMA FROZEN by a SUBMITTED BenchmarkReport; a second WaterBalancePeriod sits in SUBMITTED under that DMA"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-PP1", name: "Priority One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_pp1: $.data.id, dma_pp1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_pp1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_pp1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_pp1a: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_pp1a}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/water-balance-periods/${wbp_pp1a}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
            - call: "GET /nrw/dmas/${dma_pp1}"
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { dma_pp1_v2: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_pp1}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", system_input_volume_m3: 900000, billed_authorized_m3: 700000, unbilled_authorized_m3: 30000, unauthorized_consumption_m3: 12000, metering_inaccuracy_m3: 20000, expected_dma_version: "${dma_pp1_v2}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_pp1b: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_pp1b}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/benchmark-reports"
              payload: { reporting_year: 2026, reporting_period_start: "2026-01-01T00:00:00Z", reporting_period_end: "2026-12-31T00:00:00Z", dma_ids: ["${dma_pp1}"] }
              as: RegulatorLiaison
              captures: { br_pp1: $.data.id, br_pp1_v: $.data.version }
            - call: "POST /nrw/benchmark-reports/${br_pp1}/submit"
              payload: { expected_report_version: "${br_pp1_v}" }
              as: RegulatorLiaison
          trigger:
            - call: "POST /nrw/water-balance-periods/${wbp_pp1b}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
              captures: { err_pp1: $.data.error_id }
          assert:
            - "captured error_id == ERR_DMA_FROZEN (state category, priority 6)"
            - "NOT ERR_MISSING_PREREQUISITE (business_referential, priority 10)"

      - name: segregation_error_beats_bcr_fiscal_gate
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_BCR_BELOW_THRESHOLD]
        distinguishing_aspect: |
          Pair (business_safety vs business_fiscal): two different endpoints show the
          ordering — approve-adjustment by the substantiating user fails with
          ERR_SEGREGATION_OF_DUTIES (priority 7) even when the case content is fine;
          and a below-threshold InterventionProposal approve by a privileged role
          fails with ERR_BCR_BELOW_THRESHOLD (priority 11) only after passing
          safety-level checks. The safety-category error precedes the fiscal one.
        test_recipe:
          setup:
            - "Case substantiated by inv-1 with adjustment PROPOSED (amount 5000)"
            - "Separate DMA holds a SUBMITTED InterventionProposal with PROVISIONAL BCR 0.71"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-PP2", name: "Priority Two", connection_count: 800, mains_length_km: 20.0, target_nrw_pct: 12.0 }
              as: ProgramDirector
              captures: { dma_pp2: $.data.id }
            - call: "POST /nrw/unauthorized-consumption-cases"
              payload: { dma_id: "${dma_pp2}", service_location_ref: "LOC-88", opened_at: "2026-08-01T00:00:00Z" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { case_pp2: $.data.id }
            - call: "POST /nrw/unauthorized-consumption-cases/${case_pp2}/begin-evidence"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /nrw/unauthorized-consumption-cases/${case_pp2}/substantiate"
              payload: { estimated_loss_m3: 500 }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /nrw/unauthorized-consumption-cases/${case_pp2}/propose-adjustment"
              payload: { proposed_adjustment_amount: 5000 }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-PP2B", name: "Priority Two B", connection_count: 900, mains_length_km: 25.0, target_nrw_pct: 12.0 }
              as: ProgramDirector
              captures: { dma_pp2b: $.data.id }
            - call: "POST /nrw/intervention-proposals"
              payload: { dma_id: "${dma_pp2b}", kind: "METER_REPLACEMENT_PROGRAM", capital_cost: 900000, annual_om_cost: 25000, expected_volume_saved_m3_per_year: 60000 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { ip_pp2: $.data.id }
            - call: "POST /nrw/intervention-proposals/${ip_pp2}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
          trigger:
            - call: "POST /nrw/unauthorized-consumption-cases/${case_pp2}/approve-adjustment"
              payload: {}
              as: ProgramDirector
              as_user_id: "inv-1"
              captures: { err_sod: $.data.error_id }
            - call: "POST /nrw/intervention-proposals/${ip_pp2}/approve"
              payload: {}
              as: ProgramDirector
              captures: { err_bcr: $.data.error_id }
          assert:
            - "approve-adjustment by the substantiator: error_id == ERR_SEGREGATION_OF_DUTIES"
            - "InterventionProposal.${ip_pp2}.benefit_cost_ratio == 0.71"
            - "approve below threshold: error_id == ERR_BCR_BELOW_THRESHOLD"
            - "InterventionProposal.${ip_pp2}.status remains SUBMITTED"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: night_flow_signal_exact_threshold_boundaries
        grounds:
          - calculations.night_flow_signal
          - entities.NightFlowAssessment.fields.leak_signal
        distinguishing_aspect: |
          Inclusive >= thresholds on the litres-per-second metric via POST
          /nrw/night-flow-assessments/{id}/analyze: net 15.0 lps maps CRITICAL
          (>= MNF_CRITICAL_LPS 15.0), net 5.0 maps ELEVATED (>= 5.0), net 4.99
          maps NONE — exact-boundary semantics on the night-flow metric.
        test_recipe:
          setup:
            - "DMA with a FINALIZED balance (so pct branch is computable); three RECORDED assessments at net 15.0 / 5.0 / 4.99 lps (non-overlapping windows with 1h buffers)"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-BP1", name: "Boundary One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_bp1: $.data.id, dma_bp1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_bp1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_bp1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_bp1: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_bp1}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/water-balance-periods/${wbp_bp1}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
            - call: "POST /nrw/night-flow-assessments"
              payload: { dma_id: "${dma_bp1}", window_start: "2026-08-02T01:00:00Z", window_end: "2026-08-02T04:00:00Z", measured_mnf_lps: 18.0, expected_legitimate_night_use_lps: 3.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { nf_crit: $.data.id }
            - call: "POST /nrw/night-flow-assessments"
              payload: { dma_id: "${dma_bp1}", window_start: "2026-08-02T05:00:00Z", window_end: "2026-08-02T08:00:00Z", measured_mnf_lps: 8.0, expected_legitimate_night_use_lps: 3.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { nf_elev: $.data.id }
            - call: "POST /nrw/night-flow-assessments"
              payload: { dma_id: "${dma_bp1}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T12:00:00Z", measured_mnf_lps: 7.99, expected_legitimate_night_use_lps: 3.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { nf_none: $.data.id }
          trigger:
            - call: "POST /nrw/night-flow-assessments/${nf_crit}/analyze"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/night-flow-assessments/${nf_elev}/analyze"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/night-flow-assessments/${nf_none}/analyze"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
          assert:
            - "NightFlowAssessment.${nf_crit}.net_night_flow_lps == 15.0 and leak_signal == CRITICAL"
            - "NightFlowAssessment.${nf_crit}.net_night_flow_pct == 11.66"
            - "NightFlowAssessment.${nf_elev}.net_night_flow_lps == 5.0 and leak_signal == ELEVATED"
            - "NightFlowAssessment.${nf_none}.net_night_flow_lps == 4.99 and leak_signal == NONE"

      - name: meter_accuracy_pass_fail_exact_boundaries
        grounds:
          - calculations.meter_replacement_due
          - entities.MeterAccuracyTest.fields.result
          - entities.MeterAccuracyTest.fields.accuracy_pct
        distinguishing_aspect: |
          Inclusive boundaries on the accuracy-percentage metric via POST
          /nrw/meter-accuracy-tests/{id}/complete: 98.00 PASSES (>= 98.0), 97.99
          FAILS, 102.00 PASSES (<= ceiling), 102.01 FAILS — exact-precision
          semantics on a different metric (accuracy %, not lps) reached through a
          different endpoint.
        test_recipe:
          setup:
            - "DMA with four meters (ACCURACY_BASED policy) each holding one SCHEDULED test"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-BP2", name: "Boundary Two", connection_count: 600, mains_length_km: 15.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { dma_bp2: $.data.id }
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_bp2}", serial_number: "SN-BP2-1", size_mm: 15, installed_at: "2020-06-01T00:00:00Z", replacement_policy: "ACCURACY_BASED" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_bp2_1: $.data.id }
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_bp2}", serial_number: "SN-BP2-2", size_mm: 15, installed_at: "2020-06-01T00:00:00Z", replacement_policy: "ACCURACY_BASED" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_bp2_2: $.data.id }
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_bp2}", serial_number: "SN-BP2-3", size_mm: 15, installed_at: "2020-06-01T00:00:00Z", replacement_policy: "ACCURACY_BASED" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_bp2_3: $.data.id }
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_bp2}", serial_number: "SN-BP2-4", size_mm: 15, installed_at: "2020-06-01T00:00:00Z", replacement_policy: "ACCURACY_BASED" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_bp2_4: $.data.id }
            - call: "POST /nrw/meter-accuracy-tests"
              payload: { meter_id: "${m_bp2_1}", tested_at: "2026-08-01T09:00:00Z", flow_rate_lps: 0.5 }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { t_bp2_1: $.data.id }
            - call: "POST /nrw/meter-accuracy-tests"
              payload: { meter_id: "${m_bp2_2}", tested_at: "2026-08-01T09:05:00Z", flow_rate_lps: 0.5 }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { t_bp2_2: $.data.id }
            - call: "POST /nrw/meter-accuracy-tests"
              payload: { meter_id: "${m_bp2_3}", tested_at: "2026-08-01T09:10:00Z", flow_rate_lps: 0.5 }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { t_bp2_3: $.data.id }
            - call: "POST /nrw/meter-accuracy-tests"
              payload: { meter_id: "${m_bp2_4}", tested_at: "2026-08-01T09:15:00Z", flow_rate_lps: 0.5 }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { t_bp2_4: $.data.id }
          trigger:
            - call: "POST /nrw/meter-accuracy-tests/${t_bp2_1}/complete"
              payload: { registered_volume_m3: 98.0, reference_volume_m3: 100.0 }
              as: MeterTechnician
              as_user_id: "mt-1"
            - call: "POST /nrw/meter-accuracy-tests/${t_bp2_2}/complete"
              payload: { registered_volume_m3: 97.99, reference_volume_m3: 100.0 }
              as: MeterTechnician
              as_user_id: "mt-1"
            - call: "POST /nrw/meter-accuracy-tests/${t_bp2_3}/complete"
              payload: { registered_volume_m3: 102.0, reference_volume_m3: 100.0 }
              as: MeterTechnician
              as_user_id: "mt-1"
            - call: "POST /nrw/meter-accuracy-tests/${t_bp2_4}/complete"
              payload: { registered_volume_m3: 102.01, reference_volume_m3: 100.0 }
              as: MeterTechnician
              as_user_id: "mt-1"
          assert:
            - "MeterAccuracyTest.${t_bp2_1}.result == PASS (98.00 inclusive boundary)"
            - "CustomerMeter.${m_bp2_1}.status remains IN_SERVICE"
            - "MeterAccuracyTest.${t_bp2_2}.result == FAIL (97.99)"
            - "CustomerMeter.${m_bp2_2}.status == FLAGGED_FOR_REPLACEMENT"
            - "MeterAccuracyTest.${t_bp2_3}.result == PASS (102.00 ceiling inclusive)"
            - "MeterAccuracyTest.${t_bp2_4}.result == FAIL (102.01 over ceiling)"
            - "CustomerMeter.${m_bp2_4}.status == FLAGGED_FOR_REPLACEMENT"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: leak_verify_gated_on_survey_in_field
        grounds:
          - state_machines.Leak.REPORTED_to_VERIFIED
          - state_machines.LeakSurvey
          - validations[priority=5]
        distinguishing_aspect: |
          Pair (Leak -> LeakSurvey): a Leak may only transition REPORTED -> VERIFIED
          while its parent LeakSurvey.status == IN_FIELD; if the survey was
          completed first, verify is rejected with ERR_INVALID_STATE even though
          the leak itself is in a valid from-state.
        test_recipe:
          setup:
            - "DMA OPEN; survey started (IN_FIELD); one leak REPORTED"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-CE1", name: "Cross One", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_ce1: $.data.id }
            - call: "POST /nrw/leak-surveys"
              payload: { dma_id: "${dma_ce1}", planned_start: "2026-08-02T00:00:00Z", planned_end: "2026-08-10T00:00:00Z", method: "NOISE_LOGGER", crew_lead_user_id: "fs-1" }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { sv_ce1: $.data.id }
            - call: "POST /nrw/leak-surveys/${sv_ce1}/start"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks"
              payload: { survey_id: "${sv_ce1}", location_description: "Hydrant 4", estimated_loss_lps: 1.0, detected_at: "2026-08-02T04:00:00Z", repair_cost_estimate: 4000 }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { leak_ce1: $.data.id }
            - call: "POST /nrw/leak-surveys/${sv_ce1}/complete"
              payload: { coverage_pct: 80.0 }
              as: FieldSupervisor
              as_user_id: "fs-1"
          trigger:
            - call: "POST /nrw/leaks/${leak_ce1}/verify"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { err_ce1: $.data.error_id }
          assert:
            - "captured error_id == ERR_INVALID_STATE"
            - "Leak.${leak_ce1}.status remains REPORTED"
            - "LeakSurvey.${sv_ce1}.status == COMPLETED"

      - name: benchmark_submit_gated_on_finalized_balances
        grounds:
          - state_machines.BenchmarkReport.DRAFT_to_SUBMITTED
          - state_machines.WaterBalancePeriod
          - validations[priority=10]
          - errors[ERR_MISSING_PREREQUISITE]
        distinguishing_aspect: |
          Pair (BenchmarkReport -> WaterBalancePeriod/DistrictMeteredArea): report
          submit requires every listed DMA to own a FINALIZED, non-SUPERSEDED
          WaterBalancePeriod fully inside the reporting window; a DMA whose latest
          balance is merely SUBMITTED fails with ERR_MISSING_PREREQUISITE — a
          different entity pair than Leak->LeakSurvey.
        test_recipe:
          setup:
            - "DMA whose only WaterBalancePeriod is in SUBMITTED (not FINALIZED); BenchmarkReport DRAFT listing that DMA"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-CE2", name: "Cross Two", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_ce2: $.data.id, dma_ce2_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_ce2}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_ce2_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_ce2: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_ce2}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/benchmark-reports"
              payload: { reporting_year: 2026, reporting_period_start: "2026-01-01T00:00:00Z", reporting_period_end: "2026-12-31T00:00:00Z", dma_ids: ["${dma_ce2}"] }
              as: RegulatorLiaison
              captures: { br_ce2: $.data.id, br_ce2_v: $.data.version }
          trigger:
            - call: "POST /nrw/benchmark-reports/${br_ce2}/submit"
              payload: { expected_report_version: "${br_ce2_v}" }
              as: RegulatorLiaison
              captures: { err_ce2: $.data.error_id }
          assert:
            - "captured error_id == ERR_MISSING_PREREQUISITE"
            - "BenchmarkReport.${br_ce2}.status remains DRAFT"
            - "DistrictMeteredArea.${dma_ce2}.posture remains RESTRICTED (not FROZEN)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: water_balance_half_open_touching_allowed_overlap_rejected
        grounds:
          - validations[priority=8]
          - entities.WaterBalancePeriod.fields.period_end
          - errors[ERR_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Half-open [start, end) semantics on the WaterBalancePeriod resource: a
          second period starting exactly at the first's period_end is ACCEPTED
          (touching boundary), while a period starting one hour before it is
          REJECTED with ERR_WINDOW_CONFLICT — no buffer, adjacency allowed.
        test_recipe:
          setup:
            - "DMA with one DRAFT balance 2026-01-01..2026-04-01 (DMA version tracked)"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-TO1", name: "Temporal One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_to1: $.data.id, dma_to1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_to1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_to1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
          trigger:
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_to1}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", system_input_volume_m3: 900000, billed_authorized_m3: 700000, unbilled_authorized_m3: 30000, unauthorized_consumption_m3: 12000, metering_inaccuracy_m3: 20000, expected_dma_version: "${dma_to1_v} + 1" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_to1_ok: $.data.id }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_to1}", period_start: "2026-06-30T23:00:00Z", period_end: "2026-10-01T00:00:00Z", system_input_volume_m3: 800000, billed_authorized_m3: 600000, unbilled_authorized_m3: 25000, unauthorized_consumption_m3: 10000, metering_inaccuracy_m3: 18000, expected_dma_version: "${dma_to1_v} + 2" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { err_to1: $.data.error_id }
          assert:
            - "touching boundary accepted: second period created with id ${wbp_to1_ok}"
            - "overlapping period rejected: captured error_id == ERR_WINDOW_CONFLICT"

      - name: night_flow_one_hour_buffer_semantics
        grounds:
          - validations[priority=8]
          - entities.NightFlowAssessment.fields.window_start
          - errors[ERR_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Buffer semantics on the NightFlowAssessment resource (different from
          half-open touching): a new window starting exactly 59 minutes after the
          prior window's end is REJECTED; starting exactly 1 hour after is
          ACCEPTED — adjacency alone is insufficient; the resource demands a
          1-hour gap, a different interval arithmetic than the balance period.
        test_recipe:
          setup:
            - "DMA with one RECORDED assessment 2026-08-02T01:00..04:00Z"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-TO2", name: "Temporal Two", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_to2: $.data.id }
            - call: "POST /nrw/night-flow-assessments"
              payload: { dma_id: "${dma_to2}", window_start: "2026-08-02T01:00:00Z", window_end: "2026-08-02T04:00:00Z", measured_mnf_lps: 6.0, expected_legitimate_night_use_lps: 2.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
          trigger:
            - call: "POST /nrw/night-flow-assessments"
              payload: { dma_id: "${dma_to2}", window_start: "2026-08-02T04:59:00Z", window_end: "2026-08-02T07:00:00Z", measured_mnf_lps: 6.0, expected_legitimate_night_use_lps: 2.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { err_to2: $.data.error_id }
            - call: "POST /nrw/night-flow-assessments"
              payload: { dma_id: "${dma_to2}", window_start: "2026-08-02T05:00:00Z", window_end: "2026-08-02T08:00:00Z", measured_mnf_lps: 6.0, expected_legitimate_night_use_lps: 2.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { nf_to2_ok: $.data.id }
          assert:
            - "59-minute gap rejected: captured error_id == ERR_WINDOW_CONFLICT"
            - "exact 1-hour gap accepted: assessment ${nf_to2_ok} created"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: benchmark_return_restores_dma_posture_conservation
        grounds:
          - state_machines.BenchmarkReport.SUBMITTED_to_RETURNED
          - state_machines.DistrictMeteredArea
          - state_machines.BenchmarkReport.RETURNED_to_SUBMITTED
        distinguishing_aspect: |
          Conserved quantity: the count of DMAs in posture == FROZEN attributable to
          this report. Submit (freeze) paired with return (compensation) leaves every
          listed DMA's posture back at its pre-submit value: DMA.posture OPEN before
          submit, FROZEN after submit, OPEN again after return — zero net drift in
          the open-posture population.
        test_recipe:
          setup:
            - "DMA with a FINALIZED balance (posture OPEN — nothing else gating); BenchmarkReport DRAFT over it"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-CI1", name: "Compensating One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_ci1: $.data.id, dma_ci1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_ci1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_ci1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_ci1: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_ci1}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/water-balance-periods/${wbp_ci1}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
            - call: "POST /nrw/benchmark-reports"
              payload: { reporting_year: 2026, reporting_period_start: "2026-01-01T00:00:00Z", reporting_period_end: "2026-12-31T00:00:00Z", dma_ids: ["${dma_ci1}"] }
              as: RegulatorLiaison
              captures: { br_ci1: $.data.id, br_ci1_v: $.data.version }
          trigger:
            - call: "POST /nrw/benchmark-reports/${br_ci1}/submit"
              payload: { expected_report_version: "${br_ci1_v}" }
              as: RegulatorLiaison
            - call: "POST /nrw/benchmark-reports/${br_ci1}/return"
              payload: {}
              as: RegulatorLiaison
          assert:
            - "DistrictMeteredArea.${dma_ci1}.posture == OPEN before submit (precondition observed via finalize success)"
            - "after submit: posture FROZEN; after return: posture OPEN again"
            - "BenchmarkReport.${br_ci1}.status == RETURNED"
            - "net drift in FROZEN-DMA count attributable to this report == 0"

      - name: meter_replace_conserves_active_serial_population
        grounds:
          - state_machines.CustomerMeter.FLAGGED_FOR_REPLACEMENT_to_REPLACED
          - state_machines.CustomerMeter
        distinguishing_aspect: |
          Conserved quantity: the number of CustomerMeter rows in status IN_SERVICE
          for the DMA across a flag+replace pair. Flag moves one row out of
          IN_SERVICE; replace moves the old row to REPLACED and spawns exactly one
          successor IN_SERVICE — the IN_SERVICE population returns to its original
          count (different conserved quantity: row-population conservation, not
          posture-state conservation).
        test_recipe:
          setup:
            - "DMA with exactly two meters IN_SERVICE (SN-CI2-A, SN-CI2-B); A flagged for replacement"
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-CI2", name: "Compensating Two", connection_count: 600, mains_length_km: 15.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { dma_ci2: $.data.id }
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_ci2}", serial_number: "SN-CI2-A", size_mm: 20, installed_at: "2019-01-01T00:00:00Z", replacement_policy: "ACCURACY_BASED" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_ci2_a: $.data.id }
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_ci2}", serial_number: "SN-CI2-B", size_mm: 20, installed_at: "2021-01-01T00:00:00Z", replacement_policy: "ACCURACY_BASED" }
              as: MeterTechnician
              as_user_id: "mt-1"
            - call: "POST /nrw/customer-meters/${m_ci2_a}/flag-replacement"
              payload: {}
              as: MeterTechnician
              as_user_id: "mt-1"
          trigger:
            - call: "POST /nrw/customer-meters/${m_ci2_a}/replace"
              payload: { serial_number: "SN-CI2-A2" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_ci2_a2: $.data.id }
            - call: "GET /nrw/dmas/${dma_ci2}/customer-meters?status=IN_SERVICE"
              as: MeterTechnician
              as_user_id: "mt-1"
          assert:
            - "old CustomerMeter.${m_ci2_a}.status == REPLACED"
            - "successor CustomerMeter.${m_ci2_a2}.status == IN_SERVICE with serial SN-CI2-A2"
            - "IN_SERVICE meter count for the DMA == 2 (conserved across flag+replace)"
            - "total meter rows for the DMA == 3 (REPLACED rows persist, nothing deleted)"

