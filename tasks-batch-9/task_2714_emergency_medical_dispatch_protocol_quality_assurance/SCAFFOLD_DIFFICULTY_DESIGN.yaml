              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cB1_id: $.data.id }
            - call: "POST /dispatchers/${dB_id}/call-records"
              payload: { call_reference: "C-2003", call_type: "CHEST_PAIN", received_at: "2026-08-07T09:00:00Z", dispatched_determinant_code: "10-C-4" }
