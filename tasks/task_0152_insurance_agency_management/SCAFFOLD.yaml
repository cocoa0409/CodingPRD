scenario: "Insurance Agency Management: book of business, ACORD policy download, commission split/override, renewal pipeline, carrier appointment, producer license tracking, premium trust accounting, cancellation/reinstatement"
domain_name: insurance-agency-management
api_prefix: ""

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (Carrier, Producer, Account, Policy, ...) linked by foreign
  # keys, not nested in URL paths. Policies reference Account + Carrier + Product;
  # commissions reference Policy + Producer; ledger entries reference TrustAccount
  # + Policy. No strict ownership tree.

  state_machine_shape: cyclic
  # Policy carries a lifecycle with a reinstatement cycle (CANCELLED -> ACTIVE)
  # and a renewal cycle that spawns a successor Policy. Appointment and License
  # add branching/parallel dimensions. Not a pure linear pipeline.

  relationship_patterns:
    - one_to_many        # Account -> Policy; Policy -> CommissionSplit; Carrier -> Appointment
    - many_to_many       # Producer <-> Carrier via Appointment (junction); Producer <-> Carrier via License is per-state
    - self_referential   # Policy.renewed_from_policy_id -> Policy.id (renewal chain / linked list)
    - cross_aggregate    # CommissionStatement aggregates across Policy + CommissionSplit; TrustLedgerEntry crosses Policy + TrustAccount

  role_model: peer_roles
  # AgencyAdmin owns carriers/products/appointments/trust config; Producer owns
  # their own book; AccountManager owns endorsements/renewals/downloads;
  # TrustAccountant owns the premium trust ledger and disbursements. Distinct
  # resource ownership with a few shared read operations.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Carrier (insurance company) legal name.
      - name: naic_code
        type: string
        source: input
        description: 5-digit NAIC company identifier; unique across carriers.
        constraints: "exactly 5 digits; unique"
      - name: status
        type: enum
        source: system
        description: "Carrier lifecycle. One of {PROSPECTIVE, ACTIVE, SUSPENDED, TERMINATED}."
        default: PROSPECTIVE
        constraints: "enum: PROSPECTIVE, ACTIVE, SUSPENDED, TERMINATED"
      - name: download_supported
        type: boolean
        source: input
        description: Whether this carrier supports ACORD policy download (AL3/XML feed).
        default: false
      - name: default_new_business_commission_pct
        type: number
        source: input
        description: "Default new-business commission rate (fraction 0..1) applied to a Policy's first term when the Product does not override it."
        constraints: "0 <= x <= 1"
      - name: default_renewal_commission_pct
        type: number
        source: input
        description: "Default renewal commission rate (fraction 0..1) applied to renewal terms when the Product does not override it."
        constraints: "0 <= x <= 1"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier underwriting this product."
      - name: line_of_business
        type: enum
        source: input
        description: "Line of business. One of {AUTO, HOME, GL, WC, UMBRELLA}."
        constraints: "enum: AUTO, HOME, GL, WC, UMBRELLA"
      - name: name
        type: string
        source: input
        description: Product display name.
      - name: new_business_commission_pct
        type: number
        source: input
        description: "Optional product-level new-business commission override (fraction 0..1). Null means fall back to Carrier.default_new_business_commission_pct."
        default: null
        constraints: "null or 0 <= x <= 1"
      - name: renewal_commission_pct
        type: number
        source: input
        description: "Optional product-level renewal commission override (fraction 0..1). Null means fall back to Carrier.default_renewal_commission_pct."
        default: null
        constraints: "null or 0 <= x <= 1"
      - name: cancellation_basis
        type: enum
        source: input
        description: "How return premium is computed on cancellation. One of {PRO_RATA, SHORT_RATE}. Drives the dual-variant return-premium calculation."
        constraints: "enum: PRO_RATA, SHORT_RATE"

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Producer (licensed agent) full legal name.
      - name: npn
        type: string
        source: input
        description: National Producer Number; unique across producers.
        constraints: "unique; non-empty"
      - name: status
        type: enum
        source: system
        description: "Producer employment status. One of {ACTIVE, INACTIVE}. INACTIVE producers cannot be assigned commission splits."
        default: ACTIVE
        constraints: "enum: ACTIVE, INACTIVE"
      - name: default_split_pct
        type: number
        source: input
        description: "Default share of agency commission (fraction 0..1) this producer receives on policies they write; seeds the writing-producer split."
        constraints: "0 <= x <= 1"

  - name: License
    parent: null
    common_fields: true
    fields:
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the producer holding this license."
      - name: state_code
        type: string
        source: input
        description: "US state two-letter code the license is issued in."
        constraints: "exactly 2 uppercase letters"
      - name: line_of_business
        type: enum
        source: input
        description: "Line of business the license authorizes. One of {AUTO, HOME, GL, WC, UMBRELLA}."
        constraints: "enum: AUTO, HOME, GL, WC, UMBRELLA"
      - name: effective_date
        type: datetime
        source: input
        description: "ISO 8601 date the license became effective."
      - name: expiration_date
        type: datetime
        source: input
        description: "ISO 8601 date the license expires (exclusive: license is valid for timestamps strictly before this instant)."
      - name: status
        type: enum
        source: computed
        description: "Derived validity at server-now. ACTIVE when effective_date <= now < expiration_date; EXPIRED when now >= expiration_date; PENDING when now < effective_date."
        constraints: "enum: ACTIVE, EXPIRED, PENDING"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier the producer is appointed with."
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the appointed producer."
      - name: state_code
        type: string
        source: input
        description: "US state two-letter code the appointment authorizes business in."
        constraints: "exactly 2 uppercase letters"
      - name: status
        type: enum
        source: system
        description: "Appointment lifecycle. One of {REQUESTED, APPROVED, ACTIVE, TERMINATED}."
        default: REQUESTED
        constraints: "enum: REQUESTED, APPROVED, ACTIVE, TERMINATED"
      - name: requested_at
        type: datetime
        source: system
        description: "Server timestamp when appointment was requested."

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Insured client / account name (the book-of-business client).
      - name: servicing_producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the producer who services this account's book."
      - name: account_type
        type: enum
        source: input
        description: "One of {PERSONAL, COMMERCIAL}."
        constraints: "enum: PERSONAL, COMMERCIAL"
      - name: active_policy_count
        type: integer
        source: computed
        description: "Count of Policies under this Account whose status IN {ACTIVE, PENDING_RENEWAL}. Recomputed on every policy state change."
        default: 0

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account this policy belongs to."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the carrier product underwriting this policy."
      - name: writing_producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the producer of record who wrote this policy."
      - name: renewed_from_policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the prior-term policy this policy renews from. Null for new business. Forms the self-referential renewal chain."
        default: null
      - name: state_code
        type: string
        source: input
        description: "US state two-letter code the risk is located in; gates license & appointment checks."
        constraints: "exactly 2 uppercase letters"
      - name: annual_premium_cents
        type: integer
        source: input
        description: "Full-term annual written premium in integer cents (the gross premium for the term)."
        constraints: "x > 0"
      - name: effective_date
        type: datetime
        source: input
        description: "ISO 8601 policy term start (inclusive)."
      - name: expiration_date
        type: datetime
        source: input
        description: "ISO 8601 policy term end (exclusive). Term length = expiration_date - effective_date in whole days."
      - name: term_kind
        type: enum
        source: system
        description: "NEW_BUSINESS when renewed_from_policy_id is null, else RENEWAL. Selects which commission rate variant applies."
        constraints: "enum: NEW_BUSINESS, RENEWAL"
      - name: status
        type: enum
        source: system
        description: "Policy lifecycle. One of {QUOTED, BOUND, ACTIVE, PENDING_RENEWAL, CANCELLED, EXPIRED, REINSTATED, NON_RENEWED}."
        default: QUOTED
        constraints: "enum: QUOTED, BOUND, ACTIVE, PENDING_RENEWAL, CANCELLED, EXPIRED, REINSTATED, NON_RENEWED"
      - name: cancellation_date
        type: datetime
        source: system
        description: "ISO 8601 effective date of cancellation; null until CANCELLED. Used as the as-of point for return-premium days-unearned."
        default: null
      - name: cancellation_reason
        type: enum
        source: system
        description: "One of {INSURED_REQUEST, NON_PAYMENT, UNDERWRITING}. Set on cancellation; null otherwise. NON_PAYMENT always cancels pro-rata regardless of Product.cancellation_basis."
        default: null
        constraints: "null or enum: INSURED_REQUEST, NON_PAYMENT, UNDERWRITING"
      - name: return_premium_cents
        type: integer
        source: computed
        description: "Unearned premium refunded to the insured on cancellation, in integer cents; computed by the return-premium calculation. 0 until CANCELLED."
        default: 0
      - name: earned_premium_cents
        type: integer
        source: computed
        description: "Premium retained by the carrier as of cancellation = annual_premium_cents - return_premium_cents. 0 until CANCELLED."
        default: 0
      - name: download_source
        type: enum
        source: system
        description: "How the policy entered the system. One of {MANUAL, ACORD_DOWNLOAD}. ACORD_DOWNLOAD policies are created already BOUND by the carrier feed."
        default: MANUAL
        constraints: "enum: MANUAL, ACORD_DOWNLOAD"

  - name: CommissionSplit
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy whose agency commission this split allocates."
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the producer receiving this share."
      - name: split_pct
        type: number
        source: input
        description: "Fraction (0..1) of the agency commission allocated to this producer for this policy."
        constraints: "0 < x <= 1"
      - name: role
        type: enum
        source: input
        description: "One of {WRITING, SERVICING, OVERRIDE}. OVERRIDE shares are paid on top and are exempt from the 100% writing+servicing sum cap."
        constraints: "enum: WRITING, SERVICING, OVERRIDE"
      - name: status
        type: enum
        source: system
        description: "One of {DRAFT, LOCKED}. Splits lock when the policy first becomes ACTIVE; LOCKED splits are immutable."
        default: DRAFT
        constraints: "enum: DRAFT, LOCKED"

  - name: TrustAccount
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Premium trust (fiduciary) bank account display name.
      - name: state_code
        type: string
        source: input
        description: "US state two-letter code this trust account is held for; unique (one trust account per state)."
        constraints: "exactly 2 uppercase letters; unique"
      - name: balance_cents
        type: integer
        source: computed
        description: "Current ledger balance in integer cents = sum of all posted TrustLedgerEntry.amount_cents for this account. Recomputed on every posting."
        default: 0
      - name: minimum_balance_cents
        type: integer
        source: input
        description: "Required fiduciary floor; a disbursement may not drop balance_cents below this value."
        default: 0
        constraints: "x >= 0"

  - name: TrustLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: trust_account_id
        type: string
        source: input
        description: "FK -> TrustAccount.id; the trust account this entry posts to."
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy this premium movement relates to. Null for opening-balance entries."
        default: null
      - name: entry_type
        type: enum
        source: system
        description: "One of {PREMIUM_RECEIPT, CARRIER_REMITTANCE, COMMISSION_DISBURSEMENT, RETURN_PREMIUM_REFUND, OPENING_BALANCE}. Sign of amount_cents is fixed by type."
        constraints: "enum: PREMIUM_RECEIPT, CARRIER_REMITTANCE, COMMISSION_DISBURSEMENT, RETURN_PREMIUM_REFUND, OPENING_BALANCE"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed integer cents. PREMIUM_RECEIPT and OPENING_BALANCE are positive; CARRIER_REMITTANCE, COMMISSION_DISBURSEMENT, RETURN_PREMIUM_REFUND are negative (money leaving trust)."

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the producer this statement pays."
      - name: period_start
        type: datetime
        source: input
        description: "ISO 8601 inclusive start of the statement period."
      - name: period_end
        type: datetime
        source: input
        description: "ISO 8601 exclusive end of the statement period."
      - name: gross_commission_cents
        type: integer
        source: computed
        description: "Sum of this producer's commission accruals on policies that became ACTIVE within [period_start, period_end). Computed by the statement-aggregation calculation."
        default: 0
      - name: chargeback_cents
        type: integer
        source: computed
        description: "Sum of commission clawed back for policies cancelled within [period_start, period_end) where the cancellation produced a return premium."
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: "gross_commission_cents - chargeback_cents; may be negative if chargebacks exceed accruals in the period."
        default: 0
      - name: status
        type: enum
        source: system
        description: "One of {OPEN, FINALIZED, PAID}. OPEN recomputes on read; FINALIZED freezes the figures; PAID after disbursement posts."
        default: OPEN
        constraints: "enum: OPEN, FINALIZED, PAID"

  - name: RenewalTask
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the expiring policy this renewal task tracks."
      - name: stage
        type: enum
        source: system
        description: "Renewal pipeline stage. One of {IDENTIFIED, REVIEW, QUOTED, OFFERED, COMPLETED, LOST}. Cyclic: OFFERED may return to REVIEW for re-quote."
        default: IDENTIFIED
        constraints: "enum: IDENTIFIED, REVIEW, QUOTED, OFFERED, COMPLETED, LOST"
      - name: target_effective_date
        type: datetime
        source: input
        description: "ISO 8601 intended effective date of the renewal term (typically the expiring policy's expiration_date)."
      - name: requote_count
        type: integer
        source: computed
        description: "Number of times this task cycled OFFERED -> REVIEW. Increments on each re-quote loop."
        default: 0
      - name: successor_policy_id
        type: string
        source: system
        description: "FK -> Policy.id; the renewal policy created when this task COMPLETED. Null until completion."
        default: null

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: system
        description: "Server's authoritative 'now' for license/appointment validity and renewal-window checks. Settable via the test-driving clock endpoint; defaults to real wall-clock if never set."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Carrier
    initial_state: PROSPECTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECTIVE
        to: ACTIVE
        trigger: "POST /carriers/{id}/activate"
        actor: AgencyAdmin
        preconditions:
          - "Carrier.naic_code is present and 5 digits"
          - "expected_carrier_version matches Carrier.version"
        side_effects:
          - "Carrier.status = ACTIVE"
          - "increments Carrier.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /carriers/{id}/suspend"
        actor: AgencyAdmin
        preconditions:
          - "expected_carrier_version matches Carrier.version"
        side_effects:
          - "Carrier.status = SUSPENDED"
          - "no new Policy may be bound against this carrier's products while SUSPENDED"
          - "increments Carrier.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /carriers/{id}/activate"
        actor: AgencyAdmin
        preconditions:
          - "expected_carrier_version matches Carrier.version"
        side_effects:
          - "Carrier.status = ACTIVE"
          - "increments Carrier.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /carriers/{id}/terminate"
        actor: AgencyAdmin
        preconditions:
          - "no Policy under this carrier's products is in status IN {ACTIVE, PENDING_RENEWAL, REINSTATED}"
          - "expected_carrier_version matches Carrier.version"
        side_effects:
          - "Carrier.status = TERMINATED"
          - "all Appointments with this carrier_id and status IN {REQUESTED, APPROVED, ACTIVE} transition to TERMINATED (cascade down)"
          - "increments Carrier.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /carriers/{id}/terminate"
        actor: AgencyAdmin
        preconditions:
          - "no Policy under this carrier's products is in status IN {ACTIVE, PENDING_RENEWAL, REINSTATED}"
          - "expected_carrier_version matches Carrier.version"
        side_effects:
          - "Carrier.status = TERMINATED"
          - "all Appointments with this carrier_id and status IN {REQUESTED, APPROVED, ACTIVE} transition to TERMINATED (cascade down)"
          - "increments Carrier.version by 1"

  - entity: Appointment
    initial_state: REQUESTED
    terminal_states: [TERMINATED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /appointments/{id}/approve"
        actor: AgencyAdmin
        preconditions:
          - "Carrier.status == ACTIVE for this appointment's carrier_id"
          - "Producer.status == ACTIVE for this appointment's producer_id"
        side_effects:
          - "Appointment.status = APPROVED"
          - "increments Appointment.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /appointments/{id}/activate"
        actor: AgencyAdmin
        preconditions:
          - "the appointment's Producer holds a License with matching state_code whose computed status == ACTIVE (cross-entity dependency on License)"
        side_effects:
          - "Appointment.status = ACTIVE"
          - "increments Appointment.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /appointments/{id}/terminate"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "Appointment.status = TERMINATED"
          - "increments Appointment.version by 1"
      - from: REQUESTED
        to: TERMINATED
        trigger: "POST /appointments/{id}/terminate"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "Appointment.status = TERMINATED"
          - "increments Appointment.version by 1"
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /appointments/{id}/terminate"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "Appointment.status = TERMINATED"
          - "increments Appointment.version by 1"

  - entity: Policy
    initial_state: QUOTED
    terminal_states: [EXPIRED, NON_RENEWED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /policies/{id}/bind"
        actor: Producer
        preconditions:
          - "Carrier.status == ACTIVE for the policy's product's carrier (cross-entity dependency on Carrier)"
          - "writing_producer holds an ACTIVE License matching Policy.state_code and Product.line_of_business"
          - "an Appointment with status == ACTIVE exists for (writing_producer_id, carrier_id, Policy.state_code)"
          - "expected_policy_version matches Policy.version"
        side_effects:
          - "Policy.status = BOUND"
          - "increments Policy.version by 1"
        note: "ACORD_DOWNLOAD policies are created directly in BOUND, skipping this manual bind."
      - from: BOUND
        to: ACTIVE
        trigger: "POST /policies/{id}/activate"
        actor: AccountManager
        preconditions:
          - "server-now (SystemClock.current_utc) >= Policy.effective_date"
          - "expected_policy_version matches Policy.version"
        side_effects:
          - "Policy.status = ACTIVE"
          - "all CommissionSplit rows for this policy transition DRAFT -> LOCKED (cascade down)"
          - "writing producer's commission accrual is computed via commission-accrual calc and becomes eligible for the next OPEN CommissionStatement"
          - "Account.active_policy_count recomputed (bubble up)"
          - "increments Policy.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "cancellation_date is within [effective_date, expiration_date)"
          - "expected_policy_version matches Policy.version"
        side_effects:
          - "Policy.status = CANCELLED; set cancellation_date, cancellation_reason"
          - "return_premium_cents computed via return-premium calc (pro-rata or short-rate per Product.cancellation_basis; NON_PAYMENT forces pro-rata)"
          - "earned_premium_cents = annual_premium_cents - return_premium_cents"
          - "a RETURN_PREMIUM_REFUND TrustLedgerEntry for -return_premium_cents posts to the state's TrustAccount (cross-entity ledger sync)"
          - "the writing producer's commission on this policy is charged back proportionally to the unearned fraction (cross-entity to CommissionStatement chargeback)"
          - "Account.active_policy_count recomputed (bubble up)"
          - "increments Policy.version by 1"
      - from: CANCELLED
        to: REINSTATED
        trigger: "POST /policies/{id}/reinstate"
        actor: AccountManager
        preconditions:
          - "Policy.cancellation_reason != UNDERWRITING (underwriting cancellations are not reinstatable)"
          - "server-now (SystemClock.current_utc) < Policy.expiration_date"
          - "expected_policy_version matches Policy.version"
        side_effects:
          - "Policy.status = REINSTATED"
          - "return_premium_cents reset to 0 and earned_premium_cents reset to 0 (compensation)"
          - "a reversing PREMIUM_RECEIPT TrustLedgerEntry of +prior_return_premium posts to the state's TrustAccount, restoring the refunded amount (compensation invariant)"
          - "the prior chargeback is reversed: the producer's accrual is restored (compensation)"
          - "Account.active_policy_count recomputed (bubble up)"
          - "increments Policy.version by 1"
        note: "REINSTATED behaves like ACTIVE for coverage and renewal eligibility."
      - from: ACTIVE
        to: PENDING_RENEWAL
        trigger: "POST /renewal-tasks (creates a RenewalTask for this policy) OR system flag when within renewal window"
        actor: AccountManager
        preconditions:
          - "server-now (SystemClock.current_utc) >= (Policy.expiration_date - 60 days) [renewal window opens 60 days before expiration]"
        side_effects:
          - "Policy.status = PENDING_RENEWAL"
          - "a RenewalTask is created in stage IDENTIFIED for this policy (cross-entity)"
          - "Account.active_policy_count unchanged (PENDING_RENEWAL still counts as active)"
          - "increments Policy.version by 1"
      - from: REINSTATED
        to: PENDING_RENEWAL
        trigger: "POST /renewal-tasks"
        actor: AccountManager
        preconditions:
          - "server-now (SystemClock.current_utc) >= (Policy.expiration_date - 60 days)"
        side_effects:
          - "Policy.status = PENDING_RENEWAL"
          - "a RenewalTask is created in stage IDENTIFIED for this policy (cross-entity)"
          - "increments Policy.version by 1"
      - from: PENDING_RENEWAL
        to: EXPIRED
        trigger: "POST /policies/{id}/expire (renewal completed elsewhere or lapse)"
        actor: AccountManager
        preconditions:
          - "server-now (SystemClock.current_utc) >= Policy.expiration_date"
        side_effects:
          - "Policy.status = EXPIRED"
          - "Account.active_policy_count recomputed (bubble up)"
          - "increments Policy.version by 1"
      - from: PENDING_RENEWAL
        to: NON_RENEWED
        trigger: "POST /policies/{id}/non-renew"
        actor: AccountManager
        preconditions:
          - "the policy's RenewalTask is in stage LOST"
          - "expected_policy_version matches Policy.version"
        side_effects:
          - "Policy.status = NON_RENEWED"
          - "Account.active_policy_count recomputed (bubble up)"
          - "increments Policy.version by 1"

  - entity: RenewalTask
    initial_state: IDENTIFIED
    terminal_states: [COMPLETED, LOST]
    transitions:
      - from: IDENTIFIED
        to: REVIEW
        trigger: "POST /renewal-tasks/{id}/advance"
        actor: AccountManager
        preconditions:
          - "the linked Policy.status == PENDING_RENEWAL"
        side_effects:
          - "RenewalTask.stage = REVIEW"
          - "increments RenewalTask.version by 1"
      - from: REVIEW
        to: QUOTED
        trigger: "POST /renewal-tasks/{id}/advance"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "RenewalTask.stage = QUOTED"
          - "increments RenewalTask.version by 1"
      - from: QUOTED
        to: OFFERED
        trigger: "POST /renewal-tasks/{id}/advance"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "RenewalTask.stage = OFFERED"
          - "increments RenewalTask.version by 1"
      - from: OFFERED
        to: REVIEW
        trigger: "POST /renewal-tasks/{id}/requote"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "RenewalTask.stage = REVIEW (cycle back for re-quote)"
          - "increments RenewalTask.requote_count by 1"
          - "increments RenewalTask.version by 1"
        note: "Cyclic edge: OFFERED -> REVIEW models negotiation/re-quote rounds."
      - from: OFFERED
        to: COMPLETED
        trigger: "POST /renewal-tasks/{id}/complete"
        actor: AccountManager
        preconditions:
          - "the linked Policy.status == PENDING_RENEWAL"
          - "a successor Policy payload is provided (creates the renewal-term Policy)"
        side_effects:
          - "RenewalTask.stage = COMPLETED"
          - "a successor Policy is created in status BOUND with renewed_from_policy_id = linked policy, term_kind = RENEWAL (cross-entity creation)"
          - "RenewalTask.successor_policy_id set to the new policy id"
          - "the linked (expiring) Policy transitions PENDING_RENEWAL -> EXPIRED (cross-entity cascade)"
          - "Account.active_policy_count recomputed (bubble up)"
          - "increments RenewalTask.version by 1"
      - from: OFFERED
        to: LOST
        trigger: "POST /renewal-tasks/{id}/lose"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "RenewalTask.stage = LOST"
          - "increments RenewalTask.version by 1"
      - from: REVIEW
        to: LOST
        trigger: "POST /renewal-tasks/{id}/lose"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "RenewalTask.stage = LOST"
          - "increments RenewalTask.version by 1"

  - entity: CommissionStatement
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /commission-statements/{id}/finalize"
        actor: TrustAccountant
        preconditions:
          - "period_end <= server-now (SystemClock.current_utc) [cannot finalize a period that has not ended]"
          - "expected_commissionstatement_version matches CommissionStatement.version"
        side_effects:
          - "gross_commission_cents, chargeback_cents, net_payable_cents frozen at current computed values"
          - "CommissionStatement.status = FINALIZED"
          - "increments CommissionStatement.version by 1"
      - from: FINALIZED
        to: PAID
        trigger: "POST /commission-statements/{id}/pay"
        actor: TrustAccountant
        preconditions:
          - "net_payable_cents > 0"
          - "the state TrustAccount balance after disbursement stays >= minimum_balance_cents"
          - "expected_commissionstatement_version matches CommissionStatement.version"
        side_effects:
          - "a COMMISSION_DISBURSEMENT TrustLedgerEntry of -net_payable_cents posts to the relevant TrustAccount (cross-entity ledger sync)"
          - "TrustAccount.balance_cents recomputed (derived-field reconciliation)"
          - "CommissionStatement.status = PAID"
          - "increments CommissionStatement.version by 1"
      - from: FINALIZED
        to: OPEN
        trigger: "POST /commission-statements/{id}/reopen"
        actor: TrustAccountant
        preconditions:
          - "CommissionStatement.status == FINALIZED (not yet PAID)"
          - "expected_commissionstatement_version matches CommissionStatement.version"
        side_effects:
          - "CommissionStatement.status = OPEN (figures recompute on next read)"
          - "increments CommissionStatement.version by 1"
        note: "Revert edge: FINALIZED -> OPEN lets an accountant correct a premature finalize."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: split-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /commission-splits"
    occ_field: "expected_policy_version"
    description: |
      Adding a CommissionSplit against a Policy whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has already activated the policy (which locks the
      existing splits and bumps Policy.version), so the current writer's view
      of the policy — and of which splits remain mutable — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: ledger-post-stale-trust
    parent_entity: TrustAccount
    write_endpoint: "POST /trust-accounts/{id}/entries"
    occ_field: "expected_trustaccount_version"
    description: |
      Posting a manual TrustLedgerEntry against a TrustAccount whose version
      has advanced since the client last read the balance is rejected. This
      captures the case where another posting (e.g. a return-premium refund
      cascade) has already moved the balance, so the current writer's view of
      the available balance is stale and its disbursement could breach the
      minimum-balance floor.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: return_premium
    trigger: "Policy ACTIVE/REINSTATED -> CANCELLED transition (POST /policies/{id}/cancel)"
    algorithm: chronological
    formula: |
      term_days   = days_between(effective_date, expiration_date)        # whole days, exclusive end
      unearned_days = days_between(cancellation_date, expiration_date)   # whole days from cancel (incl) to expiration (excl)
      # DUAL VARIANT — selected by Product.cancellation_basis, overridden to PRO_RATA when reason == NON_PAYMENT:
      if effective_basis == PRO_RATA:
          # exact unearned fraction, round half up to whole cents
          return_premium_cents = round_half_up(annual_premium_cents * unearned_days / term_days)
      elif effective_basis == SHORT_RATE:
          # carrier keeps a penalty: refund 90% of the pro-rata unearned amount
          pro_rata = annual_premium_cents * unearned_days / term_days
          return_premium_cents = round_half_up(pro_rata * (1 - SHORT_RATE_PENALTY))
      earned_premium_cents = annual_premium_cents - return_premium_cents
    input_set: "single Policy being cancelled; term_days and unearned_days derive from its own date fields; effective_basis = PRO_RATA if cancellation_reason==NON_PAYMENT else Product.cancellation_basis"
    constants:
      SHORT_RATE_PENALTY: 0.10
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up applied once at the end of each branch"
    variants:
      - name: pro_rata
        when: "Product.cancellation_basis == PRO_RATA, OR cancellation_reason == NON_PAYMENT (override)"
        difference: "refund the full unearned fraction; no penalty"
      - name: short_rate
        when: "Product.cancellation_basis == SHORT_RATE AND cancellation_reason != NON_PAYMENT"
        difference: "refund only (1 - SHORT_RATE_PENALTY) of the pro-rata unearned amount; carrier retains the 10% short-rate penalty"

  - name: producer_commission_accrual
    trigger: "Policy BOUND -> ACTIVE transition (POST /policies/{id}/activate); recomputed for the writing producer's split"
    algorithm: tiered_pricing
    formula: |
      # Step 1: pick the carrier-level rate by term kind (commission rate selection)
      if Policy.term_kind == NEW_BUSINESS:
          base_rate = Product.new_business_commission_pct
                      if Product.new_business_commission_pct is not null
                      else Carrier.default_new_business_commission_pct
      else:  # RENEWAL
          base_rate = Product.renewal_commission_pct
                      if Product.renewal_commission_pct is not null
                      else Carrier.default_renewal_commission_pct
      # Step 2: agency commission on the term
      agency_commission_cents = round_half_up(annual_premium_cents * base_rate)
      # Step 3: VOLUME TIER bonus on the agency rate when the account's written premium this term is large
      #   tiers are over annual_premium_cents of THIS policy:
      #   <  1_000_00       -> tier_multiplier = 1.00
      #   >= 1_000_00 and < 5_000_00 -> 1.05
      #   >= 5_000_00       -> 1.10   (boundary at exactly 5_000_00 uses 1.10)
      agency_commission_cents = round_half_up(agency_commission_cents * tier_multiplier)
      # Step 4: each producer's accrual = agency_commission * split_pct, summed across that producer's splits
      #   WRITING + SERVICING split_pct must sum to exactly 1.0; OVERRIDE is additive on top.
      producer_accrual_cents = round_half_up(agency_commission_cents * split_pct)   # per split, round each line
    input_set: "the activating Policy and its LOCKED CommissionSplit rows; rate from Product override else Carrier default by term_kind; tier from this policy's annual_premium_cents"
    constants:
      TIER1_CEIL_CENTS: 100000
      TIER2_CEIL_CENTS: 500000
      TIER1_MULT: 1.00
      TIER2_MULT: 1.05
      TIER3_MULT: 1.10
      ROUNDING: round_half_up
    precision: "integer cents; round agency_commission after rate, round again after tier multiplier, then round EACH per-producer split line independently (round-per-line, then the statement sums the rounded lines)"
    variants:
      - name: new_business_rate
        when: "Policy.term_kind == NEW_BUSINESS"
        difference: "uses new-business rate (Product override else Carrier default_new_business_commission_pct)"
      - name: renewal_rate
        when: "Policy.term_kind == RENEWAL"
        difference: "uses renewal rate (Product override else Carrier default_renewal_commission_pct), which is normally lower"

  - name: commission_statement_rollup
    trigger: "GET /commission-statements/{id} while status==OPEN (recompute on read); frozen on finalize"
    algorithm: aggregation
    formula: |
      # gross: sum of producer_commission_accrual for policies that became ACTIVE in window
      gross_commission_cents = sum(
          producer_accrual_cents(split)
          for split in CommissionSplit
          where split.producer_id == statement.producer_id
            and split.status == LOCKED
            and split.policy.status IN {ACTIVE, REINSTATED, PENDING_RENEWAL, CANCELLED, EXPIRED, NON_RENEWED}
            and split.policy.activated_at in [period_start, period_end)     # the BOUND->ACTIVE timestamp
      )
      # chargeback: proportional clawback for policies cancelled in window
      chargeback_cents = sum(
          round_half_up( producer_accrual_cents(split) * (return_premium_cents / annual_premium_cents) )
          for split in CommissionSplit
          where split.producer_id == statement.producer_id
            and split.policy.status == CANCELLED
            and split.policy.cancellation_date in [period_start, period_end)
      )
      net_payable_cents = gross_commission_cents - chargeback_cents
    input_set: "all LOCKED CommissionSplit rows for the statement's producer; gross filtered by policy activation timestamp in window; chargeback filtered by cancellation_date in window; window is [period_start inclusive, period_end exclusive)"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; sum of already-rounded per-policy accrual lines (round-per-line then sum, matching producer_commission_accrual); chargeback rounded per policy then summed"
    variants:
      - name: open_live
        when: "CommissionStatement.status == OPEN"
        difference: "figures recompute from current policy/split state on every read (live view)"
      - name: finalized_frozen
        when: "CommissionStatement.status IN {FINALIZED, PAID}"
        difference: "figures are the snapshot frozen at finalize time and do NOT change even if underlying policies later cancel"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires AgencyAdmin"

  - priority: 2
    category: auth
    check: "the X-User-Role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path/body id references an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "request body parses, required fields present, types/enums valid, numeric fields in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "expected_<parent>_version matches the parent entity's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "all endpoints declaring an expected_*_version input"

  - priority: 7
    category: business_referential
    check: "uniqueness — Carrier.naic_code unique; Producer.npn unique; TrustAccount.state_code unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /carriers, POST /producers, POST /trust-accounts"

  - priority: 8
    category: business_safety
    check: "on bind, the writing producer holds an ACTIVE License matching Policy.state_code and Product.line_of_business (compliance: cannot transact without a valid license)"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /policies/{id}/bind"

  - priority: 9
    category: business_safety
    check: "on bind, an ACTIVE Appointment exists for (writing_producer_id, carrier_id, Policy.state_code) (compliance: producer must be appointed with the carrier in that state)"
    error_id: ERR_NOT_APPOINTED
    http_status: 422
    applies_to: "POST /policies/{id}/bind"

  - priority: 10
    category: business_constraint
    check: "on appointment activate, producer holds an ACTIVE License for the appointment's state_code"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /appointments/{id}/activate"

  - priority: 11
    category: business_constraint
    check: "Carrier.status must be ACTIVE to bind a policy against its products"
    error_id: ERR_CARRIER_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /policies/{id}/bind"

  - priority: 12
    category: business_constraint
    check: "License effective_date must be strictly before expiration_date; Policy effective_date strictly before expiration_date; CommissionStatement period_start strictly before period_end"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /licenses, POST /policies, POST /commission-statements"

  - priority: 13
    category: business_constraint
    check: "a producer cannot be assigned a CommissionSplit while Producer.status == INACTIVE"
    error_id: ERR_PRODUCER_INACTIVE
    http_status: 422
    applies_to: "POST /commission-splits"

  - priority: 14
    category: business_constraint
    check: "sum of split_pct across WRITING+SERVICING splits on a policy must be <= 1.0 (OVERRIDE splits excluded from cap); adding a split that breaches the cap is rejected"
    error_id: ERR_SPLIT_OVER_ALLOCATED
    http_status: 422
    applies_to: "POST /commission-splits"

  - priority: 15
    category: business_temporal
    check: "cancellation_date must fall within [Policy.effective_date, Policy.expiration_date); a cancel dated outside the term is rejected"
    error_id: ERR_CANCEL_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /policies/{id}/cancel"

  - priority: 16
    category: business_temporal
    check: "reinstatement only allowed while server-now < Policy.expiration_date AND cancellation_reason != UNDERWRITING"
    error_id: ERR_REINSTATE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /policies/{id}/reinstate"

  - priority: 17
    category: business_temporal
    check: "a RenewalTask may only be created (policy -> PENDING_RENEWAL) when server-now >= expiration_date - 60 days (renewal window open)"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /renewal-tasks"

  - priority: 18
    category: business_referential
    check: "at most one non-terminal RenewalTask (stage NOT IN {COMPLETED, LOST}) may exist per policy"
    error_id: ERR_DUPLICATE_RENEWAL_TASK
    http_status: 409
    applies_to: "POST /renewal-tasks"

  - priority: 19
    category: business_fiscal
    check: "a disbursement (commission payment or manual negative entry) may not drop TrustAccount.balance_cents below minimum_balance_cents"
    error_id: ERR_TRUST_MINIMUM_BREACH
    http_status: 422
    applies_to: "POST /commission-statements/{id}/pay, POST /trust-accounts/{id}/entries"

  - priority: 20
    category: business_fiscal
    check: "a CommissionStatement with net_payable_cents <= 0 cannot be paid"
    error_id: ERR_NOTHING_PAYABLE
    http_status: 422
    applies_to: "POST /commission-statements/{id}/pay"

  - priority: 21
    category: business_temporal
    check: "a CommissionStatement cannot be finalized until its period_end is at or before server-now"
    error_id: ERR_VALIDATION_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /commission-statements/{id}/finalize"

  - priority: 22
    category: business_temporal
    check: "a producer may not hold two Licenses for the same (state_code, line_of_business) whose [effective_date, expiration_date) intervals overlap; the new license is rejected if its half-open interval intersects an existing one. Half-open semantics: touching at the boundary (existing.expiration_date == new.effective_date) is NOT an overlap and is allowed."
    error_id: ERR_LICENSE_OVERLAP
    http_status: 409
    applies_to: "POST /licenses"

  - priority: 23
    category: business_temporal
    check: "a successor renewal Policy created on renewal-task completion must be gap-free and overlap-free with the expiring term: successor.effective_date must equal the expiring policy's expiration_date exactly (adjacency, not interval-intersection). A successor that starts before the prior term ends (overlap) or after it ends (gap) is rejected."
    error_id: ERR_RENEWAL_TERM_NOT_ADJACENT
    http_status: 422
    applies_to: "POST /renewal-tasks/{id}/complete"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Carrier ----
  - method: POST
    path: "/carriers"
    description: "Create a carrier (starts PROSPECTIVE)."
    roles: [AgencyAdmin]
    code: 201
    input: [name, naic_code, "download_supported?", default_new_business_commission_pct, default_renewal_commission_pct]
    output: Carrier
    side_effects: ["Carrier created in PROSPECTIVE"]

  - method: GET
    path: "/carriers/{id}"
    description: "Fetch a carrier."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/carriers"
    description: "List carriers (paginated; optional status filter)."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  - method: POST
    path: "/carriers/{id}/activate"
    description: "Activate a PROSPECTIVE or SUSPENDED carrier."
    roles: [AgencyAdmin]
    code: 200
    input: [expected_carrier_version]
    output: Carrier
    side_effects: ["Carrier.status -> ACTIVE", "increments Carrier.version by 1"]

  - method: POST
    path: "/carriers/{id}/suspend"
    description: "Suspend an ACTIVE carrier (blocks new binds)."
    roles: [AgencyAdmin]
    code: 200
    input: [expected_carrier_version]
    output: Carrier
    side_effects: ["Carrier.status -> SUSPENDED", "increments Carrier.version by 1"]

  - method: POST
    path: "/carriers/{id}/terminate"
    description: "Terminate a carrier; cascades Appointments to TERMINATED."
    roles: [AgencyAdmin]
    code: 200
    input: [expected_carrier_version]
    output: Carrier
    side_effects:
      - "Carrier.status -> TERMINATED"
      - "all non-terminal Appointments for this carrier -> TERMINATED (cascade down)"
      - "increments Carrier.version by 1"

  # ---- Product ----
  - method: POST
    path: "/products"
    description: "Create a product under a carrier."
    roles: [AgencyAdmin]
    code: 201
    input: [carrier_id, line_of_business, name, "new_business_commission_pct?", "renewal_commission_pct?", cancellation_basis]
    output: Product
    side_effects: ["Product created"]

  - method: GET
    path: "/products/{id}"
    description: "Fetch a product."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List products; filter by carrier_id for FK reverse-reachability."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: ["carrier_id?", "line_of_business?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # ---- Producer ----
  - method: POST
    path: "/producers"
    description: "Create a producer (ACTIVE)."
    roles: [AgencyAdmin]
    code: 201
    input: [full_name, npn, default_split_pct]
    output: Producer
    side_effects: ["Producer created ACTIVE"]

  - method: GET
    path: "/producers/{id}"
    description: "Fetch a producer."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: []
    output: Producer
    side_effects: []

  - method: GET
    path: "/producers"
    description: "List producers."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Producer[]
    side_effects: []

  - method: POST
    path: "/producers/{id}/deactivate"
    description: "Mark a producer INACTIVE."
    roles: [AgencyAdmin]
    code: 200
    input: [expected_producer_version]
    output: Producer
    side_effects: ["Producer.status -> INACTIVE", "increments Producer.version by 1"]

  # ---- License ----
  - method: POST
    path: "/licenses"
    description: "Record a producer license."
    roles: [AgencyAdmin]
    code: 201
    input: [producer_id, state_code, line_of_business, effective_date, expiration_date]
    output: License
    side_effects: ["License created; status computed at read"]

  - method: GET
    path: "/licenses/{id}"
    description: "Fetch a license (status computed at server-now)."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licenses"
    description: "List licenses; filter by producer_id (FK reverse-reachability) and/or state_code."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: ["producer_id?", "state_code?", "line_of_business?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Request a carrier appointment for a producer in a state."
    roles: [AgencyAdmin]
    code: 201
    input: [carrier_id, producer_id, state_code]
    output: Appointment
    side_effects: ["Appointment created REQUESTED"]

  - method: GET
    path: "/appointments/{id}"
    description: "Fetch an appointment."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/appointments"
    description: "List appointments; filter by carrier_id and/or producer_id (FK reverse-reachability)."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: ["carrier_id?", "producer_id?", "state_code?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: POST
    path: "/appointments/{id}/approve"
    description: "Approve a REQUESTED appointment."
    roles: [AgencyAdmin]
    code: 200
    input: [expected_appointment_version]
    output: Appointment
    side_effects: ["Appointment.status -> APPROVED", "increments Appointment.version by 1"]

  - method: POST
    path: "/appointments/{id}/activate"
    description: "Activate an APPROVED appointment (requires producer ACTIVE license in state)."
    roles: [AgencyAdmin]
    code: 200
    input: [expected_appointment_version]
    output: Appointment
    side_effects: ["Appointment.status -> ACTIVE", "increments Appointment.version by 1"]

  - method: POST
    path: "/appointments/{id}/terminate"
    description: "Terminate an appointment."
    roles: [AgencyAdmin]
    code: 200
    input: [expected_appointment_version]
    output: Appointment
    side_effects: ["Appointment.status -> TERMINATED", "increments Appointment.version by 1"]

  # ---- Account ----
  - method: POST
    path: "/accounts"
    description: "Create a book-of-business account."
    roles: [AgencyAdmin, AccountManager]
    code: 201
    input: [name, servicing_producer_id, account_type]
    output: Account
    side_effects: ["Account created; active_policy_count = 0"]

  - method: GET
    path: "/accounts/{id}"
    description: "Fetch an account (active_policy_count computed)."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List accounts; filter by servicing_producer_id (FK reverse-reachability)."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: ["servicing_producer_id?", "account_type?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  # ---- Policy ----
  - method: POST
    path: "/policies"
    description: "Create a policy (manual: QUOTED; download_source=ACORD_DOWNLOAD via flag: created BOUND)."
    roles: [AgencyAdmin, Producer, AccountManager]
    code: 201
    input: [account_id, product_id, writing_producer_id, state_code, annual_premium_cents, effective_date, expiration_date, "renewed_from_policy_id?", "acord_download?"]
    output: Policy
    side_effects:
      - "Policy created QUOTED (or BOUND with download_source=ACORD_DOWNLOAD when acord_download=true)"
      - "term_kind = RENEWAL if renewed_from_policy_id present else NEW_BUSINESS"

  - method: GET
    path: "/policies/{id}"
    description: "Fetch a policy with all computed fields."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/policies"
    description: "List policies; filter by account_id, product_id, writing_producer_id, renewed_from_policy_id (FK reverse-reachability) and status."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: ["account_id?", "product_id?", "writing_producer_id?", "renewed_from_policy_id?", "status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: POST
    path: "/policies/{id}/bind"
    description: "Bind a QUOTED policy (license + appointment + carrier checks)."
    roles: [Producer]
    code: 200
    input: [expected_policy_version]
    output: Policy
    side_effects: ["Policy.status -> BOUND", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/activate"
    description: "Activate a BOUND policy; locks splits, accrues commission, recomputes account count."
    roles: [AccountManager]
    code: 200
    input: [expected_policy_version]
    output: Policy
    side_effects:
      - "Policy.status -> ACTIVE"
      - "all CommissionSplit DRAFT -> LOCKED (cascade)"
      - "producer commission accrual computed"
      - "Account.active_policy_count recomputed (bubble up)"
      - "increments Policy.version by 1"

  - method: POST
    path: "/policies/{id}/cancel"
    description: "Cancel an ACTIVE/REINSTATED policy; computes return premium, posts trust refund, charges back commission."
    roles: [AccountManager]
    code: 200
    input: [expected_policy_version, cancellation_date, cancellation_reason]
    output: Policy
    side_effects:
      - "Policy.status -> CANCELLED; cancellation_date, cancellation_reason set"
      - "return_premium_cents + earned_premium_cents computed (return_premium calc)"
      - "RETURN_PREMIUM_REFUND TrustLedgerEntry posts (cross-entity ledger sync)"
      - "TrustAccount.balance_cents recomputed (derived-field reconciliation)"
      - "commission chargeback recorded against the producer (cross-entity)"
      - "Account.active_policy_count recomputed (bubble up)"
      - "increments Policy.version by 1"

  - method: POST
    path: "/policies/{id}/reinstate"
    description: "Reinstate a CANCELLED policy (not underwriting, before expiration); reverses refund and chargeback."
    roles: [AccountManager]
    code: 200
    input: [expected_policy_version]
    output: Policy
    side_effects:
      - "Policy.status -> REINSTATED"
      - "return_premium_cents and earned_premium_cents reset to 0 (compensation)"
      - "reversing PREMIUM_RECEIPT TrustLedgerEntry of +prior_return_premium posts (compensation invariant)"
      - "TrustAccount.balance_cents recomputed"
      - "prior commission chargeback reversed (compensation)"
      - "Account.active_policy_count recomputed (bubble up)"
      - "increments Policy.version by 1"

  - method: POST
    path: "/policies/{id}/expire"
    description: "Expire a PENDING_RENEWAL policy."
    roles: [AccountManager]
    code: 200
    input: [expected_policy_version]
    output: Policy
    side_effects: ["Policy.status -> EXPIRED", "Account.active_policy_count recomputed", "increments Policy.version by 1"]

  - method: POST
    path: "/policies/{id}/non-renew"
    description: "Non-renew a PENDING_RENEWAL policy whose RenewalTask is LOST."
    roles: [AccountManager]
    code: 200
    input: [expected_policy_version]
    output: Policy
    side_effects: ["Policy.status -> NON_RENEWED", "Account.active_policy_count recomputed", "increments Policy.version by 1"]

  # ---- CommissionSplit ----
  - method: POST
    path: "/commission-splits"
    description: "Add a commission split to a policy (OCC on Policy.version)."
    roles: [AgencyAdmin, Producer]
    code: 201
    input: [policy_id, producer_id, split_pct, role, expected_policy_version]
    output: CommissionSplit
    side_effects: ["CommissionSplit created DRAFT", "increments Policy.version by 1"]

  - method: GET
    path: "/commission-splits"
    description: "List commission splits; filter by policy_id and/or producer_id (FK reverse-reachability)."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: ["policy_id?", "producer_id?", "limit?", "offset?"]
    output: CommissionSplit[]
    side_effects: []

  - method: GET
    path: "/commission-splits/{id}"
    description: "Fetch one commission split."
    roles: [AgencyAdmin, Producer, AccountManager, TrustAccountant]
    code: 200
    input: []
    output: CommissionSplit
    side_effects: []

  # ---- TrustAccount + ledger ----
  - method: POST
    path: "/trust-accounts"
    description: "Create a premium trust account for a state (unique per state)."
    roles: [TrustAccountant]
    code: 201
    input: [name, state_code, "minimum_balance_cents?"]
    output: TrustAccount
    side_effects: ["TrustAccount created; balance_cents = 0"]

  - method: GET
    path: "/trust-accounts/{id}"
    description: "Fetch a trust account (balance_cents computed)."
    roles: [AgencyAdmin, TrustAccountant]
    code: 200
    input: []
    output: TrustAccount
    side_effects: []

  - method: GET
    path: "/trust-accounts"
    description: "List trust accounts; filter by state_code."
    roles: [AgencyAdmin, TrustAccountant]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: TrustAccount[]
    side_effects: []

  - method: POST
    path: "/trust-accounts/{id}/entries"
    description: "Post a manual ledger entry (OCC on TrustAccount.version; e.g. opening balance or premium receipt)."
    roles: [TrustAccountant]
    code: 201
    input: [entry_type, amount_cents, "policy_id?", expected_trustaccount_version]
    output: TrustLedgerEntry
    side_effects:
      - "TrustLedgerEntry posted"
      - "TrustAccount.balance_cents recomputed (derived-field reconciliation)"
      - "increments TrustAccount.version by 1"

  - method: GET
    path: "/trust-accounts/{id}/entries"
    description: "List ledger entries for a trust account (FK reverse-reachability: TrustLedgerEntry.trust_account_id)."
    roles: [AgencyAdmin, TrustAccountant]
    code: 200
    input: ["policy_id?", "entry_type?", "limit?", "offset?"]
    output: TrustLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/trust-ledger-entries"
    description: "List ledger entries; filter by policy_id (FK reverse-reachability: TrustLedgerEntry.policy_id) and/or trust_account_id."
    roles: [AgencyAdmin, TrustAccountant]
    code: 200
    input: ["policy_id?", "trust_account_id?", "entry_type?", "limit?", "offset?"]
    output: TrustLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/trust-ledger-entries/{id}"
    description: "Fetch one ledger entry (establishes the trust-ledger-entries collection segment for FK reverse-reachability)."
    roles: [AgencyAdmin, TrustAccountant]
    code: 200
    input: []
    output: TrustLedgerEntry
    side_effects: []

  # ---- CommissionStatement ----
  - method: POST
    path: "/commission-statements"
    description: "Open a commission statement for a producer over a period."
    roles: [TrustAccountant]
    code: 201
    input: [producer_id, period_start, period_end]
    output: CommissionStatement
    side_effects: ["CommissionStatement created OPEN"]

  - method: GET
    path: "/commission-statements/{id}"
    description: "Fetch a statement; OPEN recomputes gross/chargeback/net live, FINALIZED/PAID return frozen figures."
    roles: [AgencyAdmin, Producer, TrustAccountant]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["if OPEN: recompute gross_commission_cents, chargeback_cents, net_payable_cents"]

  - method: GET
    path: "/commission-statements"
    description: "List statements; filter by producer_id (FK reverse-reachability)."
    roles: [AgencyAdmin, Producer, TrustAccountant]
    code: 200
    input: ["producer_id?", "status?", "limit?", "offset?"]
    output: CommissionStatement[]
    side_effects: []

  - method: POST
    path: "/commission-statements/{id}/finalize"
    description: "Freeze a statement's figures (period must have ended)."
    roles: [TrustAccountant]
    code: 200
    input: [expected_commissionstatement_version]
    output: CommissionStatement
    side_effects: ["figures frozen", "CommissionStatement.status -> FINALIZED", "increments CommissionStatement.version by 1"]

  - method: POST
    path: "/commission-statements/{id}/reopen"
    description: "Revert a FINALIZED (unpaid) statement to OPEN."
    roles: [TrustAccountant]
    code: 200
    input: [expected_commissionstatement_version]
    output: CommissionStatement
    side_effects: ["CommissionStatement.status -> OPEN", "increments CommissionStatement.version by 1"]

  - method: POST
    path: "/commission-statements/{id}/pay"
    description: "Pay a FINALIZED statement; posts a COMMISSION_DISBURSEMENT to trust."
    roles: [TrustAccountant]
    code: 200
    input: [expected_commissionstatement_version, trust_account_id]
    output: CommissionStatement
    side_effects:
      - "COMMISSION_DISBURSEMENT TrustLedgerEntry of -net_payable_cents posts (cross-entity ledger sync)"
      - "TrustAccount.balance_cents recomputed (derived-field reconciliation)"
      - "CommissionStatement.status -> PAID"
      - "increments CommissionStatement.version by 1"

  # ---- RenewalTask ----
  - method: POST
    path: "/renewal-tasks"
    description: "Open a renewal task for an ACTIVE/REINSTATED policy in its renewal window (moves policy -> PENDING_RENEWAL)."
    roles: [AccountManager]
    code: 201
    input: [policy_id, target_effective_date]
    output: RenewalTask
    side_effects:
      - "RenewalTask created IDENTIFIED"
      - "linked Policy.status -> PENDING_RENEWAL (cross-entity)"
      - "increments Policy.version by 1"

  - method: GET
    path: "/renewal-tasks/{id}"
    description: "Fetch a renewal task."
    roles: [AgencyAdmin, AccountManager, Producer]
    code: 200
    input: []
    output: RenewalTask
    side_effects: []

  - method: GET
    path: "/renewal-tasks"
    description: "List renewal tasks; filter by policy_id and/or successor_policy_id (FK reverse-reachability) and/or stage."
    roles: [AgencyAdmin, AccountManager, Producer]
    code: 200
    input: ["policy_id?", "successor_policy_id?", "stage?", "limit?", "offset?"]
    output: RenewalTask[]
    side_effects: []

  - method: POST
    path: "/renewal-tasks/{id}/advance"
    description: "Advance a renewal task one forward stage (IDENTIFIED->REVIEW->QUOTED->OFFERED)."
    roles: [AccountManager]
    code: 200
    input: [expected_renewaltask_version]
    output: RenewalTask
    side_effects: ["RenewalTask.stage advances one step", "increments RenewalTask.version by 1"]

  - method: POST
    path: "/renewal-tasks/{id}/requote"
    description: "Cycle an OFFERED task back to REVIEW (re-quote round)."
    roles: [AccountManager]
    code: 200
    input: [expected_renewaltask_version]
    output: RenewalTask
    side_effects: ["RenewalTask.stage -> REVIEW", "increments RenewalTask.requote_count by 1", "increments RenewalTask.version by 1"]

  - method: POST
    path: "/renewal-tasks/{id}/complete"
    description: "Complete an OFFERED task; creates successor renewal Policy and expires the prior policy."
    roles: [AccountManager]
    code: 200
    input: [expected_renewaltask_version, annual_premium_cents, effective_date, expiration_date]
    output: RenewalTask
    side_effects:
      - "successor Policy created BOUND (term_kind=RENEWAL, renewed_from_policy_id=linked policy)"
      - "RenewalTask.successor_policy_id set"
      - "linked Policy PENDING_RENEWAL -> EXPIRED (cross-entity cascade)"
      - "Account.active_policy_count recomputed (bubble up)"
      - "increments RenewalTask.version by 1"

  - method: POST
    path: "/renewal-tasks/{id}/lose"
    description: "Mark a renewal task LOST (from REVIEW or OFFERED)."
    roles: [AccountManager]
    code: 200
    input: [expected_renewaltask_version]
    output: RenewalTask
    side_effects: ["RenewalTask.stage -> LOST", "increments RenewalTask.version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's authoritative current_utc for license/appointment/renewal-window checks."
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: SystemClock
    side_effects: ["SystemClock.current_utc set; affects all subsequent now-dependent computations"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this endpoint per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "body fails to parse, missing required field, bad type, invalid enum, or out-of-range numeric"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not allowed from the resource's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version (OCC)"
  - id: ERR_DUPLICATE
    http: 409
    condition: "uniqueness violation: Carrier.naic_code, Producer.npn, or TrustAccount.state_code already exists"
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 422
    condition: "the required producer license (matching state and line of business) is not ACTIVE at server-now"
  - id: ERR_NOT_APPOINTED
    http: 422
    condition: "no ACTIVE appointment exists for the (producer, carrier, state) needed to bind"
  - id: ERR_CARRIER_NOT_ACTIVE
    http: 422
    condition: "the policy's carrier is not in status ACTIVE when binding"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "a start date is not strictly before its corresponding end date"
  - id: ERR_PRODUCER_INACTIVE
    http: 422
    condition: "a commission split targets a producer whose status is INACTIVE"
  - id: ERR_SPLIT_OVER_ALLOCATED
    http: 422
    condition: "WRITING+SERVICING split_pct sum on a policy would exceed 1.0"
  - id: ERR_CANCEL_OUT_OF_TERM
    http: 422
    condition: "cancellation_date is outside [effective_date, expiration_date)"
  - id: ERR_REINSTATE_NOT_ALLOWED
    http: 422
    condition: "reinstatement attempted after expiration_date, or on an UNDERWRITING cancellation"
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 422
    condition: "renewal task creation attempted before the 60-day pre-expiration window opens"
  - id: ERR_DUPLICATE_RENEWAL_TASK
    http: 409
    condition: "a non-terminal RenewalTask already exists for this policy"
  - id: ERR_TRUST_MINIMUM_BREACH
    http: 422
    condition: "a disbursement would drop TrustAccount.balance_cents below minimum_balance_cents"
  - id: ERR_NOTHING_PAYABLE
    http: 422
    condition: "attempt to pay a statement whose net_payable_cents <= 0"
  - id: ERR_VALIDATION_PERIOD_NOT_ENDED
    http: 422
    condition: "attempt to finalize a commission statement whose period_end is in the future relative to server-now"
  - id: ERR_LICENSE_OVERLAP
    http: 409
    condition: "a new license's [effective_date, expiration_date) interval overlaps an existing license for the same producer, state, and line of business (half-open: boundary touch allowed)"
  - id: ERR_RENEWAL_TERM_NOT_ADJACENT
    http: 422
    condition: "a successor renewal policy's effective_date does not equal the expiring policy's expiration_date (gap or overlap between consecutive terms)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: AgencyAdmin
    description: "Agency administrator: manages carriers, products, producers, licenses, appointments. Operational super-user for the configuration surface."
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers, activate/suspend/terminate carriers"
      - "POST /products"
      - "POST /producers, POST /producers/{id}/deactivate"
      - "POST /licenses"
      - "POST /appointments, approve/activate/terminate appointments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /accounts (with AccountManager)"
      - "POST /commission-splits (with Producer)"
      - "all GET reads"

  - name: Producer
    description: "Licensed producer: writes/binds their own policies and proposes commission splits. Entity-backed; X-User-ID equals a Producer.id."
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /policies/{id}/bind"
    shared_operations:
      - "POST /policies (with AgencyAdmin, AccountManager)"
      - "POST /commission-splits (with AgencyAdmin)"
      - "GET reads of carriers, products, producers, licenses, appointments, accounts, policies, splits, renewal-tasks, commission-statements"

  - name: AccountManager
    description: "Account manager: services the book — activates/cancels/reinstates policies, drives renewal pipeline, runs ACORD downloads."
    identity: "opaque"
    exclusive_operations:
      - "POST /policies/{id}/activate, /cancel, /reinstate, /expire, /non-renew"
      - "POST /renewal-tasks and all renewal-task transitions (advance/requote/complete/lose)"
    shared_operations:
      - "POST /accounts (with AgencyAdmin)"
      - "POST /policies (with AgencyAdmin, Producer)"
      - "GET reads of carriers, products, producers, licenses, appointments, accounts, policies, renewal-tasks"

  - name: TrustAccountant
    description: "Premium-trust accountant: owns trust accounts, ledger postings, and commission statement lifecycle (finalize/reopen/pay). Segregated from producers."
    identity: "opaque"
    exclusive_operations:
      - "POST /trust-accounts, POST /trust-accounts/{id}/entries"
      - "POST /commission-statements, finalize/reopen/pay statements"
    shared_operations:
      - "GET reads of carriers, products, producers, accounts, policies, splits, trust-accounts, ledger entries, commission-statements"
