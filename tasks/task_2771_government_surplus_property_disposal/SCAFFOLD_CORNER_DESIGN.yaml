# ===========================================================================
# §1.9 Scaffold Corner Design — task 2771 Government Surplus Property Disposal
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against this scaffold's §1.1-§1.7 and emits one instance per applicable row.
# `section:` values are the guide's nine sections; `claim_type:` values come
# from that section's own tables. Corners already asserted by a §1.8 instance
# are emitted as `excluded_because:` stubs naming that instance.
#
# Convention shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   users     ProgramAdmin=admin-01, SurplusAssessor=assessor-01,
#             DisposalOfficer=officer-01, ClearanceTechnician=tech-01,
#             FinanceController=finance-01, AgencyOfficer=${agency_id},
#             Bidder=${bidder_id}
#   clock     every chain sets the logical clock explicitly before its first write
#   nonce id  00000000-0000-4000-8000-000000000000 is used as the "no such row" id
# ===========================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: entity_agency_create_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Agency
          - entities.Agency.fields.status
          - entities.Agency.fields.federal_donee_status
          - entities.Agency.fields.proceeds_account_balance_cents
          - endpoints[POST /agencies]
        distinguishing_aspect: "Creating an Agency with only the three required inputs must fill every defaulted field from §1.1 — status ACTIVE, federal_donee_status NONE, donee_certification_expires_on null, both ledger counters 0 — and mint version 1."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; empty participant registry"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
          assert:
            - "response code 201 and response_type == \"object\""
            - "Agency.${ag}.status == ACTIVE and federal_donee_status == NONE"
            - "Agency.${ag}.donee_certification_expires_on == null"
            - "Agency.${ag}.proceeds_account_balance_cents == 0 and posted_distribution_count == 0"
            - "Agency.${ag}.version == 1 and created_at == updated_at"
            - "Agency.${ag}.id is a bare UUID with no type prefix"

      - name: entity_agency_get_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /agencies/{id}]
          - entities.Agency.fields.agency_code
        distinguishing_aspect: "GET /agencies/{id} must return the same field values the create response returned, with no re-derivation and no version bump from a read."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one CERTIFIED nonprofit registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "Hill Country Food Relief", agency_code: "NPO-13", agency_type: "ELIGIBLE_NONPROFIT", federal_donee_status: "CERTIFIED", donee_certification_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
          trigger:
            - call: "GET /agencies/${ag}"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
          assert:
            - "response code 200, response_type == \"object\""
            - "data.name == \"Hill Country Food Relief\", agency_code == \"NPO-13\", agency_type == ELIGIBLE_NONPROFIT"
            - "data.federal_donee_status == CERTIFIED and donee_certification_expires_on == 2027-06-30"
            - "data.version == 1 — a read never mutates the row"

      - name: entity_agency_list_pagination_envelope_fields
        claim_type: listing
        grounds:
          - endpoints[GET /agencies]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list envelope must carry limit, offset, total_count and has_more; total_count counts the whole filtered set rather than the returned page, so has_more is true on page 1 of a 3-row set with limit 2 and false on page 2."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; three organizations registered: two STATE_AGENCY and one LOCAL_GOVERNMENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Parks Division", agency_code: "PARKS-02", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "City of Cedar Park", agency_code: "CITY-77", agency_type: "LOCAL_GOVERNMENT" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "GET /agencies?limit=2&offset=0"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /agencies?limit=2&offset=2"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /agencies?agency_type=STATE_AGENCY"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "page 1: response_type == \"array\", len(data) == 2, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "page 2: len(data) == 1, offset == 2, total_count == 3, has_more == false"
            - "the filtered read returns total_count == 2 and has_more == false with the default limit 10 applied"
            - "the two pages share no id — offset paging over an unmutated set does not repeat rows"

      - name: entity_agency_get_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=12]
          - errors.ERR_AGENCY_NOT_FOUND
        distinguishing_aspect: "A syntactically valid UUID that names no row must return 404 ERR_AGENCY_NOT_FOUND rather than an empty 200 envelope."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; registry contains no row with the probed id"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "GET /agencies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response code 404, response_type == \"error\", data.error_id == \"ERR_AGENCY_NOT_FOUND\""
            - "data.message is a non-empty string"
            - "GET /agencies still reports total_count 0 — the probe created nothing"

      - name: entity_turn_in_missing_required_custody_location_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /turn-ins]
        distinguishing_aspect: "custody_location carries no default in §1.1, so omitting it is a 400 ERR_INVALID_REQUEST; supplying an empty string also fails the 1..120 character constraint, while remarks may be omitted freely."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one ACTIVE STATE_AGENCY organization"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
          trigger:
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { err: "$.data.error_id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { err2: "$.data.error_id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
          assert:
            - "the first call returns 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "the empty-string call also returns 400 ERR_INVALID_REQUEST — the 1..120 char constraint is part of priority 6"
            - "the third call returns 201 with TurnIn.${ti}.custody_location == \"Austin Yard 4\" and remarks == null"
            - "GET /turn-ins?turning_in_agency_id=${ag} returns total_count 1 — neither rejected call persisted a row"

      - name: entity_turn_in_system_and_computed_fields_on_create
        claim_type: system_fields
        grounds:
          - entities.TurnIn.fields.status
          - entities.TurnIn.fields.asset_count
          - entities.TurnIn.fields.appraised_total_cents
          - entities.TurnIn.fields.submitted_at
        distinguishing_aspect: "Every system and computed field on a fresh TurnIn is server-minted: status DRAFT, asset_count 0, appraised_total_cents 0, submitted_at / reviewed_at / rejection_reason null, version 1 — none of them are inputs on POST /turn-ins."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one ACTIVE STATE_AGENCY organization"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
          trigger:
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4", remarks: "Fleet rotation batch 12" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
          assert:
            - "response code 201; TurnIn.${ti}.status == DRAFT — the initial_state of the §1.2 TurnIn machine"
            - "TurnIn.${ti}.asset_count == 0 and appraised_total_cents == 0"
            - "TurnIn.${ti}.submitted_at == null, reviewed_at == null, rejection_reason == null"
            - "TurnIn.${ti}.version == 1 and created_at is ISO 8601 UTC with three fractional digits"
            - "TurnIn.${ti}.turning_in_agency_id == ${ag} and remarks == \"Fleet rotation batch 12\""

      - name: entity_asset_creation_with_optional_flags_sets_clearance_axis
        claim_type: creation
        grounds:
          - endpoints[POST /assets]
          - entities.SurplusAsset.fields.clearance_status
          - entities.SurplusAsset.fields.disposition_status
          - state_machines.SurplusAsset.transitions[NOT_REQUIRED->REQUIRED_PENDING]
        distinguishing_aspect: "The two status axes are initialised independently at create: a data-bearing restricted asset starts INTAKE on the disposition axis and REQUIRED_PENDING on the clearance axis, while a plain asset starts INTAKE / NOT_REQUIRED, and no assessment has run so condition_code and fair_market_value_cents are both null."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one DRAFT turn-in owned by DOT-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
          trigger:
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "RESTRICTED_MILITARY", description: "Armoured hull section, demil required", acquisition_cost_cents: 870400, acquisition_date: "2020-06-30", is_data_bearing: true, is_restricted: true, demil_code: "B" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_r: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Lateral file cabinets, single pallet", acquisition_cost_cents: 104500, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_p: "$.data.id" }
          assert:
            - "both calls return 201"
            - "SurplusAsset.${a_r}.disposition_status == INTAKE and clearance_status == REQUIRED_PENDING — is_data_bearing or is_restricted opens the clearance gate at birth"
            - "SurplusAsset.${a_r}.demil_code == B, is_data_bearing == true, is_restricted == true"
            - "SurplusAsset.${a_p}.disposition_status == INTAKE and clearance_status == NOT_REQUIRED"
            - "SurplusAsset.${a_p}.is_data_bearing == false and is_restricted == false — the declared defaults"
            - "both assets report condition_code == null and fair_market_value_cents == null before any assessment"
            - "TurnIn.${ti}.asset_count == 2 and appraised_total_cents == 0 in the same request cycle"

      - name: entity_asset_computed_condition_and_value_fields
        claim_type: computed_fields
        grounds:
          - entities.SurplusAsset.fields.fair_market_value_cents
          - entities.SurplusAsset.fields.condition_code
          - calculations.asset_fair_market_value
        distinguishing_aspect: "condition_code and fair_market_value_cents are computed onto the asset by the assessment write, not supplied by the client: a C1 asset acquired 2005-01-01 lands on the FLOOR_AGE_FACTOR of 0.20 and is valued at 200000 rather than its 1000000 acquisition cost."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one DRAFT turn-in with a single 2005 asset: FURNITURE, cost 1000000, acquired 2005-01-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Conference room table set, 2005 vintage", acquisition_cost_cents: 1000000, acquisition_date: "2005-01-01" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
          trigger:
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
          assert:
            - "response code 201 with the ConditionAssessment row; assessor_user_id == assessor-01 is stamped from X-User-ID, not from the payload"
            - "SurplusAsset.${a1}.condition_code == C1 — copied from the governing assessment"
            - "SurplusAsset.${a1}.fair_market_value_cents == 200000 — elapsed_days 7882, full_years 21, so 1 - 0.10 * 21 is negative and age_factor clamps to FLOOR_AGE_FACTOR 0.20, giving round_half_up(1000000 * 1.00 * 0.20 * 1.00)"
            - "SurplusAsset.${a1}.disposition_status == ASSESSED and version == 2"
            - "TurnIn.${ti}.appraised_total_cents == 200000 in the same request cycle"

      - name: entity_asset_invalid_category_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=7]
          - errors.ERR_INVALID_ENUM_VALUE
          - entities.SurplusAsset.fields.category
          - entities.SurplusAsset.fields.acquisition_cost_cents
        distinguishing_aspect: "An out-of-set enum value is 422 ERR_INVALID_ENUM_VALUE while a numeric-range breach on the same endpoint is 400 ERR_INVALID_REQUEST — the two constraint families do not collapse into one code."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one DRAFT turn-in owned by DOT-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
          trigger:
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "WATERCRAFT", description: "Patrol skiff", acquisition_cost_cents: 500000, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { err: "$.data.error_id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Zero-cost donation", acquisition_cost_cents: 0, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { err2: "$.data.error_id" }
          assert:
            - "the WATERCRAFT call returns 422 with data.error_id == \"ERR_INVALID_ENUM_VALUE\" — category admits only {VEHICLE, IT_EQUIPMENT, FURNITURE, HEAVY_EQUIPMENT, RESTRICTED_MILITARY}"
            - "the zero-cost call returns 400 with data.error_id == \"ERR_INVALID_REQUEST\" — acquisition_cost_cents carries a > 0 constraint"
            - "TurnIn.${ti}.asset_count == 0 and GET /assets?turn_in_id=${ti} returns total_count 0"

      - name: entity_asset_component_of_self_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=17]
          - errors.ERR_ASSET_COMPONENT_CYCLE
          - entities.SurplusAsset.fields.component_of_asset_id
        distinguishing_aspect: "The self-referential component link is guarded three ways by one rule: a parent on a different turn-in, a parent that is the row itself, and a parent that would close a cycle all return 422 ERR_ASSET_COMPONENT_CYCLE, while a sibling on the same turn-in links successfully."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "two DRAFT turn-ins for DOT-01: turn-in A holding asset P, turn-in B empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti_a: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 5" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti_b: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti_a}", category: "HEAVY_EQUIPMENT", description: "Mobile crane, base unit", acquisition_cost_cents: 4000000, acquisition_date: "2022-03-01" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_p: "$.data.id" }
          trigger:
            - call: "POST /assets"
              payload: { turn_in_id: "${ti_b}", category: "HEAVY_EQUIPMENT", description: "Crane boom section, cross-turn-in parent", acquisition_cost_cents: 900000, acquisition_date: "2022-03-01", component_of_asset_id: "${a_p}" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { err: "$.data.error_id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti_a}", category: "HEAVY_EQUIPMENT", description: "Crane boom section", acquisition_cost_cents: 900000, acquisition_date: "2022-03-01", component_of_asset_id: "${a_p}" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_c: "$.data.id" }
          assert:
            - "the cross-turn-in link returns 422 with data.error_id == \"ERR_ASSET_COMPONENT_CYCLE\" — component_of_asset_id must name an asset on the same turn_in_id"
            - "the same-turn-in link returns 201 with SurplusAsset.${a_c}.component_of_asset_id == ${a_p}"
            - "GET /assets?component_of_asset_id=${a_p} returns total_count 1 and its single row is ${a_c}"
            - "SurplusAsset.${a_p}.component_of_asset_id == null — the parent is untouched by the child write, and its version stays 1"
            - "TurnIn.${ti_b}.asset_count == 0 — the refused child left no row behind"

      - name: entity_condition_assessment_is_immutable_audit_row
        claim_type: immutability
        grounds:
          - entities.ConditionAssessment
          - entities.ConditionAssessment.fields.superseded
          - state_machines.SurplusAsset.transitions[ASSESSED->ASSESSED]
        distinguishing_aspect: "ConditionAssessment is declared common_fields: false, so it carries id and created_at but no version and no updated_at, and §1.5 exposes no update or delete route: a re-appraisal appends a second row and flips the first row's superseded flag instead of editing it."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one SUBMITTED turn-in with a single FURNITURE asset, cost 1000000, acquired 2026-01-10, already assessed C5 / functional / repair 0 -> fair_market_value_cents 300000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Modular workstation cluster", acquisition_cost_cents: 1000000, acquisition_date: "2026-01-10" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
