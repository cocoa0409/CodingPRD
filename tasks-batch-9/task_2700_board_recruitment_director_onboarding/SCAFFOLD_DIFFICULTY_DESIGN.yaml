      - name: resignation_notice_cascades_director_to_assignment_to_committee_ledger_and_voids_draft_award
        grounds:
          - state_machines.Director.SEATED_to_RESIGNED
          - state_machines.CommitteeAssignment.ACTIVE_to_ENDED
          - state_machines.Committee.AT_STRENGTH_to_UNDER_STRENGTH
          - state_machines.DirectorCompensationAward.DRAFT_to_VOIDED
          - calculations.committee_seat_ledger
          - entities.CommitteeAssignment.fields.ended_reason_code
        distinguishing_aspect: |
          A single departure-notice call fans out along a different chain than the screen cascade -
          Director -> CommitteeAssignment -> Committee derived seat ledger, and Director ->
          DirectorCompensationAward - so the same trigger both ends a child row and re-derives an ancestor's
          computed posture (AT_STRENGTH back to UNDER_STRENGTH) while voiding an unrelated DRAFT sibling.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 (all thresholds default)."
            - "One SEATED director appointed_on 2022-01-01 with shares_held 2000."
            - "An AUDIT committee with authorized_seats 5 and min_seats 1, carrying one ACTIVE CHAIR assignment for that director, so filled_seats is 1 and the derived posture is AT_STRENGTH."
            - "One DirectorCompensationAward for cycle 2026 still in status DRAFT."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Rita Resigner", email: "rita@issuer.example", birth_date: "1968-06-06", appointed_on: "2022-01-01", initial_service_status: "SEATED", shares_held: 2000 }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "AUDIT", name: "Audit Committee", authorized_seats: 5, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_id: $.data.id, comm_v1: $.data.version }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${dir_id}", term_start_on: "2026-01-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v1}", seat_role: "CHAIR" }
              as: CorporateSecretary
              captures: { asg_id: $.data.id }
            - call: "POST /governance/assignments/${asg_id}/activate"
              payload: {}
              as: CorporateSecretary
            - call: "POST /governance/directors/${dir_id}/comp-awards"
              payload: { cycle_year: 2026, service_start_on: "2026-01-01", service_end_on: "2026-12-31", share_price_cents: 90000, shares_held: 2000 }
              as: CorporateSecretary
              captures: { award_id: $.data.id }
          trigger:
            - call: "POST /governance/directors/${dir_id}/departure-notice"
              payload: { notice_type: "RESIGNATION", effective_on: "2026-08-15" }
              as: CorporateSecretary
          assert:
            - "hop 1: Director.${dir_id}.service_status == \"RESIGNED\" and retirement_notice_at is not null"
            - "hop 2: CommitteeAssignment.${asg_id}.status == \"ENDED\", ended_reason_code == \"RETIREMENT_NOTICE\", ended_at is not null"
            - "hop 3: Committee.${comm_id}.filled_seats == 0 and status == \"UNDER_STRENGTH\""
            - "hop 3 (parallel branch): DirectorCompensationAward.${award_id}.status == \"VOIDED\""
            - "Before the trigger: Committee.${comm_id}.filled_seats == 1 and status == \"AT_STRENGTH\""
            - "Director.${dir_id}.onboarding_status and compliance_status are unchanged by the departure notice"

