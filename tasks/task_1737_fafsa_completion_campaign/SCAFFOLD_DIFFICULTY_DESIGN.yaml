            - { call: "POST /fafsa/aid-records/${arB}/status-events", as: DataImporter, payload: { fafsa_status: "VERIFICATION_SELECTED", effective_date: "2027-02-02" } }
            - { call: "GET /fafsa/staff-profiles/${spec}", as: CampaignAdmin, captures: { cnt2: $.data.active_case_count, st2: $.data.status } }
