          - calculations.eligible_device_set
        excluded_because:
          difficulty_instance: transitive_cascade / resident_opt_out_cascades_five_levels_to_agency_open_request_counter
          rationale: "The five-level chain Resident -> Device -> ConsentSolicitation -> VideoRequest -> Agency is the whole point of the §1.8 transitive_cascade instance, which already walks every intermediate row and asserts the terminal counter. A separate corner instance would repeat that fixture verbatim with a shorter assertion list."

      - name: notification_fatigue_tiers_at_their_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.notification_fatigue_budget
          - entities.Resident.fields.fatigue_state
          - entities.NotificationDispatch.fields.suppressed
        excluded_because:
          difficulty_instance: combinatorial_formula / fatigue_tier_snapshot_read_once_not_retiered_mid_batch
          rationale: "The §1.8 combinatorial_formula instance already pins the tier at each boundary of notifications_sent_today and then proves the tier is snapshotted once per fan-out rather than recomputed per recipient, which subsumes a plain boundary probe of the same three thresholds."

