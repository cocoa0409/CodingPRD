      - name: parent_designation_change_cascades_through_ownership_to_grants
        grounds:
          - state_machines.Subaward.CLEARED_to_BLOCKED
          - calculations.organization_effective_designation
          - calculations.subaward_screening_outcome
          - concurrency_rules.organization-designate-stale-org
          - endpoints.POST_/foreign-organizations/{organization_id}/designate
        distinguishing_aspect: |
          Designating the PARENT organization reaches a grant three entities away: the 60% hop
          imputes SDN to the child at depth 1, the child's subaward is re-screened UNDER ITS
          STORED VARIANT and moves CLEARED -> BLOCKED with 40 + 10*5 = 90 points, the project's
          security dimension drops to SUSPENDED with reason SUBAWARD_BLOCKED, and only then are
          the project's grants suspended with reason PROJECT_SUSPENDED. Re-screening under the
