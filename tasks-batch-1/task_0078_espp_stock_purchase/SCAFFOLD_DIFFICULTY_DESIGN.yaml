scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lookback_price_min_vs_purchase_only_on_purchase
        grounds:
          - calculations.lookback_purchase_price
          - entities.Plan.fields.lookback_enabled
          - state_machines.PurchasePeriod.CERTIFIED_to_PURCHASED
        distinguishing_aspect: |
          Same FMV inputs (grant 1000c, purchase 1200c, discount 15%) yield a
          different per-share price on a Purchase depending on Plan.lookback_enabled:
          850c with lookback (min base) vs 1020c without — variant logic on the
          Purchase/Plan pricing domain.
        test_recipe:
          setup:
            - "Plan A lookback_enabled=true, discount 15; Plan B lookback_enabled=false, discount 15"
            - "Two offerings, grant_fmv 1000c each, one under each plan; purchase_date_fmv 1200c"
            - "One participant enrolled in each, with 100000c accumulated contributions"
            - "Both batches certified by an officer; run by a different admin"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "AcmeLB", max_contribution_rate_pct: 15, discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_lb_id: $.data.id }
            - call: "POST /plans"
              payload: { company_name: "AcmeNoLB", max_contribution_rate_pct: 15, discount_pct: 15, lookback_enabled: false, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_nolb_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "p1@x.com", full_name: "P One", employee_id: "E1" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { p1_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "p2@x.com", full_name: "P Two", employee_id: "E2" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { p2_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_lb_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_lb_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_nolb_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_nolb_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${p1_id}", offering_period_id: "${off_lb_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${p1_id}"
              captures: { enr_lb_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${p2_id}", offering_period_id: "${off_nolb_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${p2_id}"
              captures: { enr_nolb_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_lb_id}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_nolb_id}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_lb_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_nolb_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_lb_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_lb_id: $.data.id }
            - call: "POST /offering-periods/${off_nolb_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_nolb_id: $.data.id }
            - call: "POST /purchase-periods/${pp_lb_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_nolb_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_lb_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_lb_v: $.data.version }
            - call: "POST /purchase-periods/${pp_nolb_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_nolb_v: $.data.version }
          trigger:
            - call: "POST /purchase-periods/${pp_lb_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_lb_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_nolb_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_nolb_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "GET /purchases"
              payload: { enrollment_id: "${enr_lb_id}" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { purch_lb_id: "$.data[0].id" }
            - call: "GET /purchases"
              payload: { enrollment_id: "${enr_nolb_id}" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { purch_nolb_id: "$.data[0].id" }
          assert:
            - "Purchase ${purch_lb_id}.price_per_share_cents == 850"
            - "Purchase ${purch_nolb_id}.price_per_share_cents == 1020"

      - name: qualifying_vs_disqualifying_ordinary_income_on_disposition
        grounds:
          - calculations.qualifying_ordinary_income
          - calculations.disqualifying_ordinary_income
          - state_machines.Disposition.create_to_RECORDED
        distinguishing_aspect: |
          Identical Disposition inputs (100 shares, price paid 850c, sale 1500c)
          produce ordinary_income_cents 15000 under the qualifying formula
          (grant-discount lesser-of) vs 35000 under the disqualifying formula
          (purchase-date-FMV spread) — dual-variant logic on the Disposition domain,
          a different entity from instance 1's Purchase pricing.
        test_recipe:
          setup:
            - "A purchased ShareLot of 100 shares, price_per_share 850c, grant_fmv 1000c, purchase_date_fmv 1200c"
            - "grant_date 2022-01-01, purchase_date 2022-06-30"
            - "Two equal lots so one can be sold qualifying and one disqualifying"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "Disp Co", discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_d_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "dq@x.com", full_name: "D Q", employee_id: "EDQ" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pq_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "dd@x.com", full_name: "D D", employee_id: "EDD" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pd_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_d_id}", grant_date: "2022-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_d_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pq_id}", offering_period_id: "${off_d_id}", contribution_rate_pct: 15 }
              as: Participant
              as_user_id: "${pq_id}"
              captures: { enr_q_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pd_id}", offering_period_id: "${off_d_id}", contribution_rate_pct: 15 }
              as: Participant
              as_user_id: "${pd_id}"
              captures: { enr_d_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_q_id}", pay_date: "2022-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_d_id}", pay_date: "2022-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_d_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_d_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2022-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_d_id: $.data.id }
            - call: "POST /purchase-periods/${pp_d_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_d_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_d_v: $.data.version }
            - call: "POST /purchase-periods/${pp_d_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_d_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "GET /share-lots"
              payload: { participant_id: "${pq_id}" }
              as: Participant
              as_user_id: "${pq_id}"
              captures: { lot_q_id: "$.data[0].id" }
            - call: "GET /share-lots"
              payload: { participant_id: "${pd_id}" }
              as: Participant
              as_user_id: "${pd_id}"
              captures: { lot_d_id: "$.data[0].id" }
          trigger:
            - call: "POST /dispositions"
              payload: { share_lot_id: "${lot_q_id}", participant_id: "${pq_id}", sale_date: "2024-06-30T00:00:00.000Z", shares_sold: 100, sale_price_per_share_cents: 1500 }
              as: Participant
              as_user_id: "${pq_id}"
              captures: { disp_q_id: $.data.id }
            - call: "POST /dispositions"
              payload: { share_lot_id: "${lot_d_id}", participant_id: "${pd_id}", sale_date: "2022-12-31T00:00:00.000Z", shares_sold: 100, sale_price_per_share_cents: 1500 }
              as: Participant
              as_user_id: "${pd_id}"
              captures: { disp_d_id: $.data.id }
          assert:
            - "Disposition.${disp_q_id}.disposition_type == QUALIFYING"
            - "Disposition.${disp_q_id}.ordinary_income_cents == 15000"
            - "Disposition.${disp_d_id}.disposition_type == DISQUALIFYING"
            - "Disposition.${disp_d_id}.ordinary_income_cents == 35000"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: accrual_cap_waterfall_min_of_cap_and_cash
        grounds:
          - calculations.annual_accrual_cap_allocation
          - calculations.lookback_purchase_price
          - entities.AccrualLedger.fields.remaining_capacity_cents
        distinguishing_aspect: |
          Mode (a): non-linear formula with >=3 inputs and nested min over two
          floor branches — shares = min(floor(remaining_grant_capacity/grant_fmv),
          floor(contributions/price)). With remaining cap 1000c and grant_fmv 1000c
          the cap branch (1 share) binds below the cash branch (117 shares).
        test_recipe:
          setup:
            - "Participant already accrued 2,499,000c of grant value in calendar 2024 (remaining cap 1000c)"
            - "New batch in 2024 with grant_fmv 1000c, purchase_fmv 1200c, price 850c"
            - "Enrollment accumulated 100000c"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "CapCo", discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_c_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "cap@x.com", full_name: "Cap P", employee_id: "ECAP" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pc_id: $.data.id }
            # Offering 1: buys 2499 shares at grant value -> 2,499,000c accrued in 2024.
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_c_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 6, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_c1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pc_id}", offering_period_id: "${off_c1_id}", contribution_rate_pct: 15 }
              as: Participant
              as_user_id: "${pc_id}"
              captures: { enr_c1_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_c1_id}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 20000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_c1_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_c1_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-05-31T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_c1_id: $.data.id }
            - call: "POST /purchase-periods/${pp_c1_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_c1_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_c1_v: $.data.version }
            - call: "POST /purchase-periods/${pp_c1_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_c1_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            # Offering 2: second 2024 batch, only 1000c cap remains.
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_c_id}", grant_date: "2024-07-01T00:00:00.000Z", duration_months: 6, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_c2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pc_id}", offering_period_id: "${off_c2_id}", contribution_rate_pct: 15 }
              as: Participant
              as_user_id: "${pc_id}"
              captures: { enr_c2_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_c2_id}", pay_date: "2024-08-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_c2_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_c2_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-12-31T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_c2_id: $.data.id }
            - call: "POST /purchase-periods/${pp_c2_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_c2_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_c2_v: $.data.version }
          trigger:
            - call: "POST /purchase-periods/${pp_c2_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_c2_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "GET /purchases"
              payload: { enrollment_id: "${enr_c2_id}" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { purch_c2_id: "$.data[0].id" }
          assert:
            - "Purchase ${purch_c2_id}.shares_purchased == 1 (cap branch binds: floor(1000/1000))"
            - "Purchase ${purch_c2_id}.spend_cents == 850"
            - "Purchase ${purch_c2_id}.residual_cents == 99150"
            - "Purchase ${purch_c2_id}.grant_date_value_applied_cents == 1000"

      - name: lookback_price_rounding_half_up_per_share
        grounds:
          - calculations.lookback_purchase_price
          - entities.Purchase.fields.price_per_share_cents
        distinguishing_aspect: |
          Mode (b): rounding-order-sensitive — the discount is round_half_up at the
          per-share price BEFORE multiplying by shares. With applicable_fmv 999c,
          999*0.85=849.15 rounds to 849c per share; a sum-then-round order would
          give a different total. The scaffold pins per-share rounding first.
        test_recipe:
          setup:
            - "Plan lookback on, discount 15, grant_fmv 999c, purchase_fmv 1200c -> applicable 999c"
            - "Enrollment with 100000c accumulated"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "RoundCo", discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_r_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "round@x.com", full_name: "R P", employee_id: "ERND" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pr_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_r_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 999 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_r_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pr_id}", offering_period_id: "${off_r_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${pr_id}"
              captures: { enr_r_id: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${enr_r_id}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 1000000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_r_id}/close-enrollment"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /offering-periods/${off_r_id}/purchase-periods"
              payload: { sequence_index: 1, purchase_date: "2024-06-30T00:00:00.000Z", purchase_date_fmv_cents: 1200 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pp_r_id: $.data.id }
            - call: "POST /purchase-periods/${pp_r_id}/open"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /purchase-periods/${pp_r_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: officer1
              captures: { pp_r_v: $.data.version }
          trigger:
            - call: "POST /purchase-periods/${pp_r_id}/run-purchase"
              payload: { expected_purchase_period_version: "${pp_r_v}" }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "GET /purchases"
              payload: { enrollment_id: "${enr_r_id}" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { purch_r_id: "$.data[0].id" }
          assert:
            - "Purchase ${purch_r_id}.price_per_share_cents == 849"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_suspend_resume_cycle
        grounds:
          - state_machines.Enrollment.ENROLLED_to_SUSPENDED
          - state_machines.Enrollment.SUSPENDED_to_ENROLLED
        distinguishing_aspect: |
          Enrollment is a cyclic machine: ENROLLED->SUSPENDED->ENROLLED loop on the
          same row. After suspend then resume the status returns to ENROLLED and
          version is 3 (two transitions from version 1).
        test_recipe:
          setup:
            - "An ENROLLED enrollment in an OPEN offering"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "CycCo" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { plan_cy_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "cyc@x.com", full_name: "Cy P", employee_id: "ECYC" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { pcy_id: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${plan_cy_id}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { off_cy_id: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${pcy_id}", offering_period_id: "${off_cy_id}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${pcy_id}"
              captures: { enr_cy_id: $.data.id }
            - call: "POST /enrollments/${enr_cy_id}/suspend"
              payload: {}
              as: Participant
              as_user_id: "${pcy_id}"
          trigger:
            - call: "POST /enrollments/${enr_cy_id}/resume"
              payload: {}
              as: Participant
              as_user_id: "${pcy_id}"
              captures: { enr_cy_status: $.data.status, enr_cy_ver: $.data.version }
          assert:
            - "Enrollment.${enr_cy_id}.status == ENROLLED"
            - "Enrollment.${enr_cy_id}.version == 3"

      - name: disposition_branching_qualifying_vs_disqualifying_sideeffects
        grounds:
          - state_machines.Disposition.create_to_RECORDED
          - calculations.disposition_classification
          - state_machines.ShareLot.OPEN_to_FULLY_DISPOSED
        distinguishing_aspect: |
          Disposition is a branching machine on a different entity than Enrollment:
          the single create transition forks on disposition_type into two divergent
          side-effect sets (qualifying lesser-of vs disqualifying purchase-spread
          income), and full sale cascades the ShareLot to FULLY_DISPOSED.
        test_recipe:
          setup:
            - "A purchased ShareLot of 100 shares, price 850c, grant_fmv 1000c, purchase_fmv 1200c, grant 2022-01-01 purchase 2022-06-30"
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "BrCo", discount_pct: 15, lookback_enabled: true, annual_purchase_limit_usd: 25000 }
              as: PlanAdministrator
