  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_accept_requires_showcase_open_entry_to_showcase
        grounds:
          - state_machines.ShowcaseEntry.SUBMITTED_to_ACCEPTED
          - entities.Showcase.fields.status
          - entities.ShowcaseEntry.fields.status
        distinguishing_aspect: "ShowcaseEntry's SUBMITTED->ACCEPTED transition depends on the parent Showcase being OPEN; accepting an entry whose Showcase has moved to JUDGING (via close-entries) is rejected ERR_INVALID_STATE — a ShowcaseEntry->Showcase dependency."
        test_recipe:
          setup:
            - "An OPEN showcase with one SUBMITTED entry; after the deadline the showcase is moved to JUDGING (the SUBMITTED entry was swept to REJECTED). A second entry submitted before deadline but not yet accepted is used; we then close to JUDGING and attempt accept."
            - "Simpler: showcase OPEN, one entry SUBMITTED, advance clock past deadline, close-entries (entry -> REJECTED, showcase -> JUDGING); attempt accept on that entry fails ERR_INVALID_STATE because it is no longer SUBMITTED and showcase no longer OPEN."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "Create", code: "CRE8", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
