  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_versus_business_temporal_pair_on_material_release_declare
        grounds:
          - validations[priority=9]
          - validations[priority=29]
          - state_machines.MaterialRelease.RELEASED_to_SHIPPED
        distinguishing_aspect: |
          The conflict pair is (state, business_temporal): a declare request that is both issued against an already
          RELEASED release and issued after its planned release date returns the state error
          ERR_INVALID_PREFAB_TRANSITION with 409, never ERR_MATERIAL_RELEASE_DEADLINE - the state row outranks the
          temporal row in the ordered table.
        test_recipe:
          setup:
            - "project P-PR2 with an empty material gate set and a coordinated model version"
            - "one MaterialRelease for MC_CABLE with planned_release_iso 2026-09-10T00:00:00Z, declared while the clock reads 2026-09-05T00:00:00Z so it sits in RELEASED"
            - "the clock then advances to 2026-09-20T00:00:00Z, past the planned release date"
          setup_api_calls:
            - call: "POST /projects"
              payload: { project_code: "P-3333-PR2", project_name: "Deck R", jurisdiction_key: "J1", planned_value_cents: 100000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 2, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 100, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: true, material_gate_commodities: [] }
