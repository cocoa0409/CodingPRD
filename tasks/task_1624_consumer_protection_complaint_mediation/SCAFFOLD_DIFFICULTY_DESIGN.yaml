# =============================================================================
# §1.8 Scaffold Difficulty Design — Consumer Protection Complaint Mediation
# Test Targeting Index: 9 Difficulty Rules x >=2 instances (20 total).
# Every instance replays from empty DB using only §1.5 endpoints.
# Logical clock default at startup: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Business vs Restitution)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: d_rating_lifetime_vs_rolling12m
        grounds:
          - calculations.business_rating_calc
          - entities.Business.fields.rating_method
          - entities.Business.fields.rating_score
          - entities.Business.fields.rating_tier
        distinguishing_aspect: |
          BUSINESS-domain rating has two variants over the identical published set:
          LIFETIME counts all demerits (15+5=20 -> score 80, tier B) while
          ROLLING_12M weights the 14-month-old complaint at 0.25
          (round_half_up(15*0.25+5)=9 -> score 91, tier A). Same data, different
          score AND tier; the other Rule-1 instance lives on the Restitution domain.
        test_recipe:
          setup:
            - "Business (SMALL, rating_method LIFETIME) has K1 CLOSED_UNRESOLVED published 2025-07-21 and K2 SETTLED published 2026-07-19"
            - "Pre-switch state at 2026-08-01: rating_score == 80, rating_tier == B, published_complaint_count == 2"
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "C One", email: "c1@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "RateCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/mediators"
              payload: { full_name: "Med One", employee_ref: "EMP-1" }
              as: UnitDirector
              captures: { med: $.data.id }
            - call: "POST /consumer-protection/mediation-rooms"
              payload: { room_name: "Room A", capacity: 8, location: "Salem" }
              as: UnitDirector
              captures: { room: $.data.id }
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: UnitDirector
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2025-05-20", incident_state: "OR", category: "REFUND_REFUSAL", description: "k1", amount_in_dispute_cents: 2000 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k1: $.data.id }
            - call: "POST /consumer-protection/complaints/${k1}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k1}/notify-business"
              payload: {}
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-02T00:00:00Z" }
              as: UnitDirector
            - call: "POST /consumer-protection/complaints/${k1}/offer-mediation"
              payload: {}
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k1}/mediation-sessions"
              payload: { mediator_id: "${med}", room_id: "${room}", starts_at: "2025-07-10T10:00:00Z", ends_at: "2025-07-10T11:00:00Z" }
              as: Mediator
              as_user_id: "${med}"
              captures: { s1: $.data.id }
            - call: "POST /consumer-protection/mediation-sessions/${s1}/confirm"
              payload: {}
              as: Consumer
              as_user_id: "${con}"
            - call: "POST /consumer-protection/mediation-sessions/${s1}/confirm"
              payload: {}
