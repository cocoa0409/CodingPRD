              as: CatalogCurator
            - call: "POST /items/DD-1002/attributes"
              payload: { attribute_name: "Connection Size", attribute_value: "1 inch", unit_of_measure: "inch" }
              as: CatalogCurator
            - call: "POST /items/DD-1003/attributes"
              payload: { attribute_name: "Connection Size", attribute_value: "80 mm", unit_of_measure: "mm" }
              as: CatalogCurator
