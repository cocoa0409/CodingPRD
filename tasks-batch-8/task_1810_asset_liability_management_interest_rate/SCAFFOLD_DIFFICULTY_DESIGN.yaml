  - rule_id: transitive_cascade
    instances:
      - name: effectiveness_fail_cascades_to_coverage_breach
        grounds:
          - state_machines.HedgeRelationship.ACTIVE_to_DEDESIGNATED
          - calculations.hedge_coverage_floor_check
        distinguishing_aspect: |
          Depth-3 chain triggered by effectiveness-test creation: test FAIL ->
          hedge H2 auto-DEDESIGNATED -> that mutation recomputes
          book.hedged_notional_cents 90,000,000 -> 60,000,000 -> the decrease
          below min_hedged_notional_cents 65,000,000 creates a HEDGE_COVERAGE
          LimitBreach (OPEN, run_id null). Each hop is caused by the previous
          mutation, not by the test call. Sibling cascade is triggered by run
          creation, a different trigger.
        test_recipe:
          setup:
            - "Book1 ACTIVE (floor 65,000,000); H1 ACTIVE 60,000,000 [2026-08,2027-08) DOLLAR_OFFSET on L1; H2 ACTIVE 30,000,000 [2027-08,2028-08) DOLLAR_OFFSET on L1; clock at 2027-08-01; hedged_notional 90,000,000"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 65000000 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 60000000, fixed_rate_bps: 350 }, as: TreasuryAnalyst, captures: { h1: $.data.id } }
            - { call: "POST /hedges/${h1}/designate", payload: { start_month: "2026-08", end_month: "2027-08", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /hedges/${h1}/activate", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 30000000, fixed_rate_bps: 360 }, as: TreasuryAnalyst, captures: { h2: $.data.id } }
            - { call: "POST /hedges/${h2}/designate", payload: { start_month: "2027-08", end_month: "2028-08", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: TreasuryAnalyst }
            - { call: "POST /hedges/${h2}/activate", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          trigger:
            - { call: "POST /hedges/${h2}/effectiveness-tests", payload: { test_month: "2027-08", hedge_value_change_cents: 3900000, hedged_item_value_change_cents: -5000000 }, as: ModelRiskValidator, captures: { t: $.data.id } }
          assert:
            - "HedgeEffectivenessTest.${t}.offset_ratio == 0.7800"
            - "HedgeEffectivenessTest.${t}.result == FAIL"
            - "HedgeRelationship.${h2}.status == DEDESIGNATED"
            - "AlmBook.${b}.hedged_notional_cents == 60000000"
            - "GET /breaches?book_id=${b} returns exactly 1 LimitBreach with metric == HEDGE_COVERAGE, status == OPEN, run_id == null, limit_id == null, period_month == 2027-08"

      - name: breach_creation_reverts_submitted_report
        grounds:
          - state_machines.AlcoReport.SUBMITTED_to_DRAFT
          - calculations.alco_report_aggregates
        distinguishing_aspect: |
          Depth-2 chain triggered by SimulationRun creation: a breaching run
          opens a LimitBreach (period 2026-08) -> that breach creation mutates
          the period's SUBMITTED AlcoReport back to DRAFT and resets
          submitted_by_user_id. Different trigger (run creation) and different
          depth than the effectiveness-test cascade.
        test_recipe:
          setup:
            - "Book1 ACTIVE; sets approved; NII limit 5.0 and EVE limit 12.0 ACTIVE; six REGULATORY_PRESET scenarios; six runs created and PUBLISHED (7 breaches open: U4 2, U3 2, U2 1, D3 1, D4 1); report 2026-08 created, coverage complete, SUBMITTED by an-1"
