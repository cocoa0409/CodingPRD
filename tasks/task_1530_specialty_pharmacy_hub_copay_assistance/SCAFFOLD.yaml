scenario: 'Specialty Pharmacy Hub & Copay Assistance (manufacturer hub services): patient enrollment & benefits investigation, prior authorization submission & appeal support, copay card/foundation assistance
  matching & accumulator rules, shipment scheduling with cold chain & refill adherence outreach, nurse education & injection training, limited-distribution drug access & pharmacy selection, adverse-event
  reporting to manufacturer, outcomes reporting to payer

  '
domain_name: specialty-pharmacy-hub
api_prefix: /hub
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  - optimistic_concurrency
  - selector_policy
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: DrugProgram
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Program (drug) display name
  - name: manufacturer_name
    type: string
    source: input
    description: Manufacturer sponsoring the hub program
  - name: diagnosis_code
    type: string
    source: input
    description: ICD-10-style diagnosis code this program covers
  - name: requires_injection_training
    type: boolean
    source: input
    description: When true, first-fill shipment requires >= 1 completed nurse training session
  - name: requires_cold_chain
    type: boolean
    source: input
    description: When true, shipments must satisfy transit_hours <= max_transit_hours
  - name: max_transit_hours
    type: integer
    source: input
    description: Maximum allowed shipment transit hours when cold chain is required
  - name: min_days_between_fills
    type: integer
    source: input
    description: Minimum gap in days between a delivered fill's delivered_date and the next fill's requested_delivery_date
  - name: copay_card_per_fill_cap_cents
    type: integer
    source: input
    description: Copay card maximum payout per fill, cents
  - name: copay_card_annual_cap_cents
    type: integer
    source: input
    description: Copay card maximum annual benefit per patient, cents
  - name: default_days_supply
    type: integer
    source: input
    description: Default days of therapy supplied per fill
- name: FoundationPool
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Charitable foundation fund name
  - name: diagnosis_code
    type: string
    source: input
    description: Diagnosis code this fund covers; eligibility requires exact match with Enrollment.diagnosis_code
  - name: total_funding_cents
    type: integer
    source: input
    description: Total fund endowment, cents; immutable after creation
  - name: grant_amount_cents
    type: integer
    source: input
    description: Fixed grant size reserved per matched patient, cents
  - name: coverage_pct
    type: integer
    source: input
    description: Percent of per-fill patient cost share the grant covers (0-100)
  - name: start_date
    type: string
    source: input
    description: Fund window start date (YYYY-MM-DD), inclusive
  - name: end_date
    type: string
    source: input
    description: Fund window end date (YYYY-MM-DD), inclusive
  - name: remaining_balance_cents
    type: integer
    source: computed
    description: Decremented by grant_amount_cents at match; incremented by the grant's undisbursed remainder at release/supersede
- name: Enrollment
  parent: null
  common_fields: true
  fields:
  - name: program_id
    type: string
    source: input
    description: FK -> DrugProgram.id; program the patient enrolls into
  - name: patient_ref
    type: string
    source: input
    description: External patient identifier (de-identified reference)
  - name: diagnosis_code
    type: string
    source: input
    description: Patient diagnosis code used for foundation eligibility matching
  - name: case_manager_id
    type: string
    source: system
    description: X-User-ID of the creating CaseManager (audit only; no ownership restriction)
  - name: status
    type: enum
    source: system
    default: INTAKE
    description: INTAKE | BENEFITS_VERIFIED | PA_PENDING | PA_DENIED | APPROVED | ACTIVE | DENIED_CLOSED | DISCONTINUED
  - name: training_sessions_completed
    type: integer
    source: system
    default: 0
    description: Count of NurseVisit completions; gates first fill when program.requires_injection_training
  - name: fills_delivered_count
    type: integer
    source: system
    default: 0
    description: Count of shipments reaching DELIVERED
  - name: therapy_start_date
    type: string
    source: system
    description: delivered_date of the first DELIVERED shipment; null until first delivery
  - name: payer_accumulated_oop_cents
    type: integer
    source: system
    default: 0
    description: Payer-side out-of-pocket accumulator; accrued per shipment split variant, capped at BI.oop_max_cents
  - name: remaining_oop_cents
    type: integer
    source: system
    description: = BI.oop_max_cents - payer_accumulated_oop_cents; null until benefits investigation exists
  - name: pdc_confirmed_pct
    type: number
    source: computed
    description: PDC adherence counting only DELIVERED shipments; null until therapy_start_date set (see pdc_adherence)
  - name: pdc_provisional_pct
    type: number
    source: computed
    description: PDC adherence counting SHIPPED + DELIVERED shipments; null until therapy_start_date set (see pdc_adherence)
- name: BenefitsInvestigation
  parent: Enrollment
  common_fields: false
  fields:
  - name: enrollment_id
    type: string
    source: system
    description: FK -> Enrollment.id; exactly one BI per enrollment
  - name: payer_name
    type: string
    source: input
    description: Payer / plan name
  - name: member_id
    type: string
    source: input
    description: Member identifier at the payer
  - name: requires_prior_auth
    type: boolean
    source: input
    description: Whether the plan requires prior authorization for this drug
  - name: plan_has_accumulator
    type: boolean
    source: input
    description: True when the plan runs a copay accumulator program (manufacturer assistance excluded from OOP accrual)
  - name: patient_cost_share_cents
    type: integer
    source: input
    description: Patient responsibility per fill before assistance, cents
  - name: oop_max_cents
    type: integer
    source: input
    description: Patient annual out-of-pocket maximum, cents
- name: PriorAuthorization
  parent: Enrollment
  common_fields: true
  fields:
  - name: enrollment_id
    type: string
    source: system
    description: FK -> Enrollment.id
  - name: clinical_notes
    type: string
    source: input
    description: Clinical justification submitted to payer
  - name: payer_reference
    type: string
    source: input
    description: Payer-facing reference number
  - name: status
    type: enum
    source: system
    default: SUBMITTED
    description: SUBMITTED | APPEALED | APPROVED | DENIED | DENIED_FINAL
  - name: appeal_round
    type: integer
    source: system
    default: 0
    description: Number of appeals filed; increments on each DENIED -> APPEALED; hard cap MAX_APPEAL_ROUNDS = 2
  - name: decision_rationale
    type: string
    source: system
    description: Rationale recorded with the latest payer decision; null until first decision
- name: CopayAssistance
  parent: Enrollment
  common_fields: true
  fields:
  - name: enrollment_id
    type: string
    source: system
    description: FK -> Enrollment.id; at most one non-terminal assistance per enrollment (re-match supersedes)
  - name: assistance_type
    type: enum
    source: input
    description: COPAY_CARD | FOUNDATION
  - name: foundation_pool_id
    type: string
    source: system
    description: FK -> FoundationPool.id; set only for FOUNDATION grants, null for COPAY_CARD
  - name: matched_by_user_id
    type: string
    source: system
    description: X-User-ID of the FinancialCounselor who ran the match; segregation-of-duties anchor for release
  - name: status
    type: enum
    source: system
    description: RESERVED | ACTIVE | EXHAUSTED | RELEASED
  - name: per_fill_cap_cents
    type: integer
    source: system
    description: Copied from DrugProgram.copay_card_per_fill_cap_cents for COPAY_CARD; null for FOUNDATION
  - name: coverage_pct
    type: integer
    source: system
    description: Copied from FoundationPool.coverage_pct for FOUNDATION; null for COPAY_CARD
  - name: annual_benefit_cap_cents
    type: integer
    source: system
    description: 'COPAY_CARD: DrugProgram.copay_card_annual_cap_cents; FOUNDATION: pool grant_amount_cents'
  - name: remaining_annual_benefit_cents
    type: integer
    source: system
    description: Starts at annual_benefit_cap_cents; debited per shipped fill; credited on spoil reversal
  - name: disbursed_cents
    type: integer
    source: system
    default: 0
    description: Cumulative assistance paid out across shipped fills; reversed on spoil
  - name: returned_cents
    type: integer
    source: system
    default: 0
    description: 'Undisbursed remainder returned to the funding source at release/supersede (FOUNDATION: credited to pool)'
- name: Shipment
  parent: Enrollment
  common_fields: true
  fields:
  - name: enrollment_id
    type: string
    source: system
    description: FK -> Enrollment.id
  - name: fill_number
    type: integer
    source: system
    description: 'Per-enrollment sequence: max(existing fill_number) + 1, starting at 1'
  - name: fill_type
    type: enum
    source: system
    description: FIRST_FILL when no prior DELIVERED shipment exists for the enrollment, else REFILL
  - name: requested_delivery_date
    type: string
    source: input
    description: Requested delivery date (YYYY-MM-DD); must be >= current logical clock date
  - name: transit_hours
    type: integer
    source: input
    description: Planned transit duration in hours; cold-chain gate compares against program max
  - name: days_supply
    type: integer
    source: input
    description: Days of therapy this fill supplies; feeds PDC adherence
  - name: status
    type: enum
    source: system
    description: REQUESTED | SCHEDULED | SHIPPED | DELIVERED | SPOILED | CANCELLED
  - name: patient_cost_share_cents
    type: integer
    source: system
    description: Frozen copy of BenefitsInvestigation.patient_cost_share_cents at creation
  - name: assistance_pay_cents
    type: integer
    source: system
    description: Assistance portion applied at ship time; null until SHIPPED
  - name: patient_pay_cents
    type: integer
    source: system
    description: Patient portion at ship time; null until SHIPPED
  - name: payer_accumulator_delta_cents
    type: integer
    source: system
    description: Amount accrued to payer OOP accumulator at ship time (variant-dependent); null until SHIPPED
  - name: delivered_date
    type: string
    source: system
    description: Actual delivery date supplied on deliver; null until DELIVERED
- name: NurseVisit
  parent: Enrollment
  common_fields: true
  fields:
  - name: enrollment_id
    type: string
    source: system
    description: FK -> Enrollment.id
  - name: nurse_id
    type: string
    source: input
    description: Opaque X-User-ID of the assigned NurseEducator; scheduling-overlap resource key and completion-ownership anchor
  - name: window_start
    type: datetime
    source: input
    description: Visit window start (ISO8601 UTC); half-open interval start
  - name: window_end
    type: datetime
    source: input
    description: Visit window end (ISO8601 UTC), exclusive; must be strictly after window_start
  - name: status
    type: enum
    source: system
    default: SCHEDULED
    description: SCHEDULED | COMPLETED | NO_SHOW
  - name: completed_by_user_id
    type: string
    source: system
    description: X-User-ID that resolved the visit; null until resolved
- name: AdverseEvent
  parent: Enrollment
  common_fields: true
  fields:
  - name: enrollment_id
    type: string
    source: system
    description: FK -> Enrollment.id
  - name: awareness_at
    type: datetime
    source: input
    description: When hub staff became aware of the event (ISO8601 UTC); must be <= current logical clock time
  - name: seriousness
    type: enum
    source: input
    description: SERIOUS | NON_SERIOUS
  - name: description
    type: string
    source: input
    description: Event narrative
  - name: reported_by_user_id
    type: string
    source: system
    description: X-User-ID of the reporter (CaseManager or NurseEducator)
  - name: status
    type: enum
    source: system
    default: REPORTED
    description: REPORTED | ACKNOWLEDGED
- name: OutcomeReport
  parent: Enrollment
  common_fields: true
  fields:
  - name: enrollment_id
    type: string
    source: system
    description: FK -> Enrollment.id
  - name: period_start
    type: string
    source: input
    description: Reporting period start date (YYYY-MM-DD), inclusive
  - name: period_end
    type: string
    source: input
    description: Reporting period end date (YYYY-MM-DD), exclusive; must be after period_start
  - name: created_by_user_id
    type: string
    source: system
    description: X-User-ID of the creating CaseManager
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | SUBMITTED | SUPERSEDED
  - name: fills_delivered_count
    type: integer
    source: computed
    description: Shipments DELIVERED with delivered_date in [period_start, period_end)
  - name: adverse_event_count
    type: integer
    source: computed
    description: AdverseEvents with status in {REPORTED, ACKNOWLEDGED} and awareness_at date in [period_start, period_end)
  - name: total_assistance_cents
    type: integer
    source: computed
    description: Sum of assistance_pay_cents over shipments DELIVERED with delivered_date in [period_start, period_end)
  - name: pdc_pct
    type: number
    source: computed
    description: Confirmed-variant PDC evaluated with window end = period_end (see pdc_adherence)
state_machines:
- entity: Enrollment
  initial_state: INTAKE
  terminal_states:
  - DENIED_CLOSED
  - DISCONTINUED
  transitions:
  - from: INTAKE
    to: BENEFITS_VERIFIED
    trigger: POST /hub/enrollments/{id}/benefits-investigation (side effect of BI creation when requires_prior_auth = true)
    actor: CaseManager
    preconditions:
    - enrollment.status == INTAKE
    - no BenefitsInvestigation exists yet for the enrollment
    side_effects:
    - enrollment.remaining_oop_cents := BI.oop_max_cents
  - from: BENEFITS_VERIFIED
    to: APPROVED
    trigger: POST /hub/enrollments/{id}/benefits-investigation (side effect of BI creation when requires_prior_auth = false)
    actor: CaseManager
    preconditions:
    - BI requires_prior_auth == false
    side_effects:
    - enrollment.remaining_oop_cents := BI.oop_max_cents
    - CopayAssistance RESERVED -> ACTIVE if one exists (see CopayAssistance machine)
    - REQUESTED shipments with no RESERVED assistance on the enrollment -> SCHEDULED
  - from: BENEFITS_VERIFIED
    to: PA_PENDING
    trigger: POST /hub/enrollments/{id}/prior-authorization (side effect of PA creation)
    actor: CaseManager
    preconditions:
    - BI requires_prior_auth == true
    side_effects: []
  - from: PA_PENDING
    to: APPROVED
    trigger: POST /hub/prior-authorizations/{id}/decision with outcome=APPROVED (side effect)
    actor: PayerReviewer
    preconditions:
    - linked PriorAuthorization transitioned SUBMITTED|APPEALED -> APPROVED
    side_effects:
    - 'CopayAssistance RESERVED -> ACTIVE if one exists (chain link: enrollment approval activates the reservation)'
    - REQUESTED shipments with no RESERVED assistance on the enrollment -> SCHEDULED
  - from: PA_PENDING
    to: PA_DENIED
    trigger: POST /hub/prior-authorizations/{id}/decision with outcome=DENIED (side effect)
    actor: PayerReviewer
    preconditions:
    - linked PriorAuthorization transitioned to DENIED
    side_effects: []
  - from: PA_DENIED
    to: PA_PENDING
    trigger: POST /hub/prior-authorizations/{id}/appeal (side effect; appeal cycle)
    actor: CaseManager
    preconditions:
    - linked PriorAuthorization transitioned DENIED -> APPEALED
    side_effects: []
  - from: PA_PENDING
    to: DENIED_CLOSED
    trigger: POST /hub/prior-authorizations/{id}/decision with outcome=DENIED when appeal_round == MAX_APPEAL_ROUNDS (side effect; enrollment sits in PA_PENDING while the final appeal is under review)
    actor: PayerReviewer
    preconditions:
    - linked PriorAuthorization transitioned APPEALED -> DENIED_FINAL
    side_effects:
    - CopayAssistance in {RESERVED, ACTIVE, EXHAUSTED} -> RELEASED with returned_cents computed and funding source credited
    - Shipments in {REQUESTED, SCHEDULED} -> CANCELLED
  - from: APPROVED
    to: ACTIVE
    trigger: POST /hub/shipments/{id}/deliver for the enrollment's first DELIVERED shipment (side effect)
    actor: PharmacyPartner
    preconditions:
    - shipment is the enrollment's first DELIVERED shipment
    side_effects:
    - enrollment.therapy_start_date := shipment.delivered_date
    - enrollment.fills_delivered_count += 1
  - from: ACTIVE
    to: ACTIVE
    trigger: POST /hub/shipments/{id}/deliver for a non-first DELIVERED shipment (side effect; self-loop bookkeeping)
    actor: PharmacyPartner
    preconditions: []
    side_effects:
    - enrollment.fills_delivered_count += 1
    - recompute enrollment.pdc_confirmed_pct and enrollment.pdc_provisional_pct
  - from: BENEFITS_VERIFIED
    to: DISCONTINUED
    trigger: POST /hub/enrollments/{id}/discontinue
    actor: CaseManager
    preconditions: []
    side_effects:
    - 'cascade: non-terminal CopayAssistance -> RELEASED (funds returned)'
    - 'cascade: Shipments in {REQUESTED, SCHEDULED} -> CANCELLED'
  - from: PA_PENDING
    to: DISCONTINUED
    trigger: POST /hub/enrollments/{id}/discontinue
    actor: CaseManager
    preconditions: []
    side_effects:
    - 'cascade: non-terminal CopayAssistance -> RELEASED'
    - 'cascade: Shipments in {REQUESTED, SCHEDULED} -> CANCELLED'
  - from: PA_DENIED
    to: DISCONTINUED
    trigger: POST /hub/enrollments/{id}/discontinue
    actor: CaseManager
    preconditions: []
    side_effects:
    - 'cascade: non-terminal CopayAssistance -> RELEASED'
    - 'cascade: Shipments in {REQUESTED, SCHEDULED} -> CANCELLED'
  - from: APPROVED
    to: DISCONTINUED
    trigger: POST /hub/enrollments/{id}/discontinue
    actor: CaseManager
    preconditions: []
    side_effects:
    - 'cascade: non-terminal CopayAssistance -> RELEASED'
    - 'cascade: Shipments in {REQUESTED, SCHEDULED} -> CANCELLED'
  - from: ACTIVE
    to: DISCONTINUED
    trigger: POST /hub/enrollments/{id}/discontinue
    actor: CaseManager
    preconditions: []
    side_effects:
    - 'cascade: non-terminal CopayAssistance -> RELEASED'
    - 'cascade: Shipments in {REQUESTED, SCHEDULED} -> CANCELLED'
- entity: PriorAuthorization
  initial_state: SUBMITTED
  terminal_states:
  - APPROVED
  - DENIED_FINAL
  transitions:
  - from: SUBMITTED
    to: APPROVED
    trigger: POST /hub/prior-authorizations/{id}/decision with outcome=APPROVED
    actor: PayerReviewer
    preconditions: []
    side_effects:
    - pa.decision_rationale := rationale
    - 'CASCADE A link 1: Enrollment PA_PENDING -> APPROVED'
  - from: APPEALED
    to: APPROVED
    trigger: POST /hub/prior-authorizations/{id}/decision with outcome=APPROVED
    actor: PayerReviewer
    preconditions: []
    side_effects:
    - pa.decision_rationale := rationale
    - 'CASCADE A link 1: Enrollment PA_PENDING -> APPROVED'
  - from: SUBMITTED
    to: DENIED
    trigger: POST /hub/prior-authorizations/{id}/decision with outcome=DENIED
    actor: PayerReviewer
    preconditions:
    - appeal_round < MAX_APPEAL_ROUNDS (0 < 2 always true here)
    side_effects:
    - pa.decision_rationale := rationale
    - Enrollment PA_PENDING -> PA_DENIED
  - from: APPEALED
    to: DENIED
    trigger: POST /hub/prior-authorizations/{id}/decision with outcome=DENIED while appeal_round < MAX_APPEAL_ROUNDS
    actor: PayerReviewer
    preconditions:
    - appeal_round < 2
    side_effects:
    - pa.decision_rationale := rationale
    - Enrollment PA_PENDING -> PA_DENIED
  - from: APPEALED
    to: DENIED_FINAL
    trigger: POST /hub/prior-authorizations/{id}/decision with outcome=DENIED when appeal_round == MAX_APPEAL_ROUNDS
    actor: PayerReviewer
    preconditions:
    - appeal_round == 2
    side_effects:
    - pa.decision_rationale := rationale
    - Enrollment PA_PENDING -> DENIED_CLOSED (enrollment sits in PA_PENDING while the final appeal is under review)
  - from: DENIED
    to: APPEALED
    trigger: POST /hub/prior-authorizations/{id}/appeal
    actor: CaseManager
    preconditions:
    - pa.status == DENIED
    - pa.appeal_round < 2
    side_effects:
    - pa.appeal_round += 1
    - Enrollment PA_DENIED -> PA_PENDING
- entity: CopayAssistance
  initial_state: RESERVED
  terminal_states:
  - RELEASED
  transitions:
  - from: RESERVED
    to: ACTIVE
    trigger: 'system: enrollment reaches APPROVED (from PA_PENDING via PA approval, or from BENEFITS_VERIFIED when no PA required); or immediately at match time when enrollment.status IN {APPROVED, ACTIVE}'
    actor: system
    preconditions:
    - enrollment.status IN {APPROVED, ACTIVE}
    side_effects:
    - 'CASCADE A link 3 (chain hop caused by this activation): REQUESTED shipments on the enrollment with financial clearance now open -> SCHEDULED'
  - from: ACTIVE
    to: EXHAUSTED
    trigger: 'system: after a ship-time disbursement leaves remaining_annual_benefit_cents == 0'
    actor: system
    preconditions:
    - remaining_annual_benefit_cents == 0
    side_effects: []
  - from: EXHAUSTED
    to: ACTIVE
    trigger: 'system: a spoil reversal restores remaining_annual_benefit_cents > 0 (auto-revert)'
    actor: system
    preconditions:
    - remaining_annual_benefit_cents > 0 after reversal
    side_effects: []
  - from: RESERVED
    to: RELEASED
    trigger: POST /hub/copay-assistances/{id}/release, superseded by a new match, or enrollment terminated
    actor: FinancialCounselor
    preconditions:
    - 'manual release: X-User-ID != matched_by_user_id (segregation of duties)'
    side_effects:
    - returned_cents := annual_benefit_cap_cents - disbursed_cents
    - 'FOUNDATION: FoundationPool.remaining_balance_cents += returned_cents'
  - from: ACTIVE
    to: RELEASED
    trigger: POST /hub/copay-assistances/{id}/release, superseded by a new match, or enrollment terminated
    actor: FinancialCounselor
    preconditions:
    - 'manual release: X-User-ID != matched_by_user_id (segregation of duties)'
    side_effects:
    - returned_cents := annual_benefit_cap_cents - disbursed_cents
    - 'FOUNDATION: FoundationPool.remaining_balance_cents += returned_cents'
  - from: EXHAUSTED
    to: RELEASED
    trigger: POST /hub/copay-assistances/{id}/release, superseded by a new match, or enrollment terminated
    actor: FinancialCounselor
    preconditions:
    - 'manual release: X-User-ID != matched_by_user_id (segregation of duties)'
    side_effects:
    - returned_cents := annual_benefit_cap_cents - disbursed_cents (== cap, since disbursed == cap when EXHAUSTED)
    - 'FOUNDATION: FoundationPool.remaining_balance_cents += returned_cents'
- entity: Shipment
  initial_state: REQUESTED
  terminal_states:
  - DELIVERED
  - SPOILED
  - CANCELLED
  transitions:
  - from: REQUESTED
    to: SCHEDULED
    trigger: 'system: enrollment reaches APPROVED/ACTIVE AND no RESERVED CopayAssistance blocks financial clearance (evaluated on enrollment approval and on assistance activation); REQUESTED is entered
      only when created while enrollment == PA_PENDING'
    actor: system
    preconditions:
    - enrollment.status IN {APPROVED, ACTIVE}
    - no CopayAssistance in RESERVED for the enrollment
    side_effects: []
    note: shipments created while enrollment IN {APPROVED, ACTIVE} enter SCHEDULED directly at creation
  - from: SCHEDULED
    to: SHIPPED
    trigger: POST /hub/shipments/{id}/ship
    actor: PharmacyPartner
    preconditions:
    - shipment.status == SCHEDULED
    - enrollment.status IN {APPROVED, ACTIVE}
    - no CopayAssistance in RESERVED for the enrollment
    side_effects:
    - run patient_responsibility_split (COPAY_CARD) or foundation_split (FOUNDATION) when a non-terminal assistance with remaining_annual_benefit_cents > 0 exists; else assistance_pay_cents := 0
    - shipment.assistance_pay_cents / patient_pay_cents / payer_accumulator_delta_cents := split outputs
    - 'debit CopayAssistance: remaining_annual_benefit_cents -= assistance_pay_cents; disbursed_cents += assistance_pay_cents (EXHAUSTED auto-transition may fire)'
    - accrue Enrollment.payer_accumulated_oop_cents = min(BI.oop_max_cents, existing + payer_accumulator_delta_cents); remaining_oop_cents = oop_max_cents - payer_accumulated_oop_cents
  - from: SHIPPED
    to: DELIVERED
    trigger: POST /hub/shipments/{id}/deliver
    actor: PharmacyPartner
    preconditions:
    - shipment.status == SHIPPED
    side_effects:
    - shipment.delivered_date := input delivered_date
    - 'first delivery: Enrollment APPROVED -> ACTIVE, therapy_start_date set; otherwise fills_delivered_count += 1 and PDC fields recompute'
  - from: SHIPPED
    to: SPOILED
    trigger: POST /hub/shipments/{id}/spoil (cold-chain excursion / damaged in transit)
    actor: PharmacyPartner
    preconditions:
    - shipment.status == SHIPPED
    side_effects:
    - 'CASCADE B link 1 (compensation on the assistance that funded this fill): CopayAssistance.remaining_annual_benefit_cents += assistance_pay_cents; disbursed_cents -= assistance_pay_cents (skip when
      assistance_pay_cents == 0 or assistance RELEASED)'
    - 'CASCADE B link 2 (caused by link 1''s reversal): Enrollment.payer_accumulated_oop_cents -= payer_accumulator_delta_cents (floor 0); remaining_oop_cents = oop_max_cents - payer_accumulated_oop_cents'
    - assistance EXHAUSTED -> ACTIVE auto-revert fires if remaining_annual_benefit_cents > 0
  - from: REQUESTED
    to: CANCELLED
    trigger: 'system: enrollment DENIED_CLOSED or DISCONTINUED cascade'
    actor: system
    preconditions: []
    side_effects: []
  - from: SCHEDULED
    to: CANCELLED
    trigger: 'system: enrollment DENIED_CLOSED or DISCONTINUED cascade'
    actor: system
    preconditions: []
    side_effects: []
- entity: NurseVisit
  initial_state: SCHEDULED
  terminal_states:
  - COMPLETED
  - NO_SHOW
  transitions:
  - from: SCHEDULED
    to: COMPLETED
    trigger: POST /hub/nurse-visits/{id}/resolve with outcome=COMPLETED
    actor: NurseEducator
    preconditions:
    - X-User-ID == visit.nurse_id (assigned nurse only)
    side_effects:
    - visit.completed_by_user_id := X-User-ID
    - Enrollment.training_sessions_completed += 1 (bumps enrollment.version)
  - from: SCHEDULED
    to: NO_SHOW
    trigger: POST /hub/nurse-visits/{id}/resolve with outcome=NO_SHOW
    actor: NurseEducator
    preconditions:
    - X-User-ID == visit.nurse_id
    side_effects:
    - visit.completed_by_user_id := X-User-ID
    note: rescheduling is modeled as creating a new NurseVisit; NO_SHOW is terminal
- entity: AdverseEvent
  initial_state: REPORTED
  terminal_states:
  - ACKNOWLEDGED
  transitions:
  - from: REPORTED
    to: ACKNOWLEDGED
    trigger: POST /hub/adverse-events/{id}/acknowledge
    actor: ManufacturerMonitor
    preconditions:
    - ae.status == REPORTED
    side_effects: []
- entity: OutcomeReport
  initial_state: DRAFT
  terminal_states:
  - SUBMITTED
  - SUPERSEDED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /hub/outcome-reports/{id}/submit
    actor: CaseManager
    preconditions:
    - report.status == DRAFT
    side_effects: []
  - from: DRAFT
    to: SUPERSEDED
    trigger: 'system: a new OutcomeReport is created for the same enrollment with an overlapping period'
    actor: system
    preconditions:
    - new report's [period_start, period_end) overlaps this report's period
    side_effects: []
concurrency_rules:
- rule_id: copay-match-stale-enrollment
  parent_entity: Enrollment
  write_endpoint: POST /hub/enrollments/{id}/copay-assistance/match
  occ_field: expected_enrollment_version
  description: 'Running a copay-assistance match against an Enrollment whose version has

    advanced since the client last observed it is rejected. A successful match

    supersedes any non-terminal assistance and increments enrollment.version,

    so a second writer carrying the previously observed version is acting on a

    stale view of the enrollment.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: outcome-report-stale-enrollment
  parent_entity: Enrollment
  write_endpoint: POST /hub/enrollments/{id}/outcome-reports
  occ_field: expected_enrollment_version
  description: 'Creating an OutcomeReport against an Enrollment whose version has advanced

    since the client last observed it is rejected. A successful create

    supersedes overlapping DRAFT reports and increments enrollment.version,

    so a writer carrying the previously observed version is stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: patient_responsibility_split
  trigger: POST /hub/shipments/{id}/ship when the enrollment's non-terminal CopayAssistance has assistance_type == COPAY_CARD and remaining_annual_benefit_cents > 0
  algorithm: waterfall_allocation
  formula: "inputs: shipment.patient_cost_share_cents (frozen from BI at creation),\n        assistance.per_fill_cap_cents, assistance.remaining_annual_benefit_cents\nassistance_pay_cents = min(per_fill_cap_cents,\
    \ remaining_annual_benefit_cents, patient_cost_share_cents)\npatient_pay_cents    = patient_cost_share_cents - assistance_pay_cents\npayer_accumulator_delta_cents = per variant below\nEvaluation order\
    \ is fixed: assistance_pay first, then patient_pay, then the variant delta.\nWhen no non-terminal assistance exists (or remaining == 0): assistance_pay = 0,\npatient_pay = patient_cost_share_cents,\
    \ and the delta variant still applies.\n"
  input_set: the shipment being shipped; the enrollment's unique non-terminal CopayAssistance (status IN {ACTIVE, EXHAUSTED}); the enrollment's BenefitsInvestigation (for the accumulator variant flag)
  constants:
    MIN_ASSISTANCE_PAY: 0
  precision: integer cents; no rounding required
  variants:
  - name: accumulator_plan
    when: BenefitsInvestigation.plan_has_accumulator == true
    difference: payer_accumulator_delta_cents = patient_pay_cents (manufacturer assistance is EXCLUDED from the patient's OOP accrual)
  - name: non_accumulator_plan
    when: BenefitsInvestigation.plan_has_accumulator == false
    difference: payer_accumulator_delta_cents = patient_pay_cents + assistance_pay_cents = patient_cost_share_cents (assistance COUNTS toward OOP)
- name: foundation_split
  trigger: POST /hub/shipments/{id}/ship when the enrollment's non-terminal CopayAssistance has assistance_type == FOUNDATION and remaining_annual_benefit_cents > 0
  algorithm: waterfall_allocation
  formula: 'inputs: shipment.patient_cost_share_cents, assistance.coverage_pct, assistance.remaining_annual_benefit_cents

    raw_pay       = patient_cost_share_cents * coverage_pct / 100

    rounded_pay   = round_half_up(raw_pay) to whole cents          # STEP 1: round THIS fill first

    assistance_pay_cents = min(rounded_pay, remaining_annual_benefit_cents)

    patient_pay_cents    = patient_cost_share_cents - assistance_pay_cents

    disbursed_cents accumulates the PER-FILL rounded amounts       # STEP 2: sum after rounding

    PINNED ORDER: round per fill, then sum. Computing the annual total first and

    rounding once (sum-then-round) is a DIFFERENT, non-conforming algorithm and

    yields different cents (e.g. cost_share 999 @ 50% over 3 fills: 500+500+500 = 1500

    vs round(1498.5) = 1499).

    payer_accumulator_delta_cents follows the same accumulator/non-accumulator variant

    rule as patient_responsibility_split, keyed on BI.plan_has_accumulator.

    '
  input_set: the shipment being shipped; the enrollment's unique non-terminal FOUNDATION CopayAssistance; the enrollment's BenefitsInvestigation
  constants:
    ROUNDING: round_half_up
  precision: integer cents; round_half_up applied per fill before any summation
  variants: []
- name: pdc_adherence
  trigger: evaluated at read time for Enrollment.pdc_confirmed_pct / pdc_provisional_pct; evaluated on POST /hub/enrollments/{id}/shipments for the refill gate; evaluated at OutcomeReport creation for pdc_pct
    (confirmed variant, window end = period_end)
  algorithm: aggregation
  formula: 'window_days  = max(1, (evaluation_date - enrollment.therapy_start_date) in whole days)

    covered_days = min(window_days, SUM(shipment.days_supply) over the variant''s input set)

    pdc_pct      = round_half_up(100 * covered_days / window_days, 1 decimal)

    REFILL GATE (threshold): refill shipment creation requires pdc_confirmed_pct >= 80.0

    (exactly 80.0 PASSES the gate) evaluated at the current logical clock date.

    '
  input_set: 'confirmed variant:  shipments of the enrollment with status == DELIVERED only

    provisional variant: shipments of the enrollment with status IN {SHIPPED, DELIVERED}

    Both variants exclude SPOILED and CANCELLED shipments. evaluation_date is the

    current logical clock date (or period_end for outcome reports). Null when

    therapy_start_date is null.

    '
  constants:
    REFILL_MIN_PDC_PCT: 80.0
  precision: 1 decimal place, round_half_up
  variants:
  - name: confirmed
    when: default; used for the refill gate, outcome reports, and Enrollment.pdc_confirmed_pct
    difference: counts DELIVERED shipments only
  - name: provisional
    when: Enrollment.pdc_provisional_pct (forward-looking adherence outreach view)
    difference: counts SHIPPED + DELIVERED shipments; for identical data provisional >= confirmed, strictly greater whenever a SHIPPED-not-delivered fill exists
- name: assistance_match_selector
  trigger: POST /hub/enrollments/{id}/copay-assistance/match with assistance_type == FOUNDATION
  algorithm: weighted_scoring
  formula: "eligibility filter: pools where pool.diagnosis_code == enrollment.diagnosis_code\n  AND pool.start_date <= current clock date <= pool.end_date\n  AND pool.remaining_balance_cents >= pool.grant_amount_cents\n\
    ranking: coverage_pct DESC\ntie-break 1: earliest start_date\ntie-break 2: created_at ASC\nfallback: empty candidate set -> ERR_NO_ELIGIBLE_FOUNDATION (no assistance created,\nno pool mutated, enrollment.version\
    \ NOT incremented)\nOn success: pool.remaining_balance_cents -= pool.grant_amount_cents; new\nCopayAssistance copies coverage_pct and sets annual_benefit_cap_cents := grant_amount_cents.\n"
  input_set: all FoundationPool entities
  constants: {}
  precision: n/a
  variants: []
- name: outcome_report_metrics
  trigger: POST /hub/enrollments/{id}/outcome-reports
  algorithm: aggregation
  formula: "fills_delivered_count   = COUNT(shipments WHERE enrollment_id matches AND status == DELIVERED\n                           AND period_start <= delivered_date < period_end)\nadverse_event_count\
    \     = COUNT(adverse_events WHERE enrollment_id matches\n                           AND status IN {REPORTED, ACKNOWLEDGED}\n                           AND period_start <= date(awareness_at) < period_end)\n\
    total_assistance_cents  = SUM(shipment.assistance_pay_cents) over the same shipment set\n                           as fills_delivered_count\npdc_pct                 = pdc_adherence confirmed variant\
    \ with evaluation_date := period_end\n                           (null when therapy_start_date is null or period_end <= therapy_start_date)\nWindow semantics are half-open [period_start, period_end):\
    \ a delivery exactly on\nperiod_end is EXCLUDED.\n"
  input_set: shipments and adverse events of the enrollment, filtered as above
  constants: {}
  precision: counts and cents are integers; pdc_pct 1 decimal round_half_up
  variants: []
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present; role is one of the seven declared roles
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: X-User-Role is listed in the endpoint's roles; for NurseVisit resolve, X-User-ID must equal visit.nurse_id
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: path identifiers resolve left-to-right (program, enrollment, child resource)
  error_id: ERR_ENROLLMENT_NOT_FOUND
  http_status: 404
  applies_to: 'all endpoints with path ids (per-resource variants: ERR_DRUG_PROGRAM_NOT_FOUND, ERR_FOUNDATION_POOL_NOT_FOUND, ERR_PRIOR_AUTHORIZATION_NOT_FOUND, ERR_COPAY_ASSISTANCE_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND,
    ERR_NURSE_VISIT_NOT_FOUND, ERR_ADVERSE_EVENT_NOT_FOUND, ERR_OUTCOME_REPORT_NOT_FOUND)'
- priority: 3.5
  category: existence
  check: 'request body schema: required fields present, types valid, enum values in range, dates parse; requested_delivery_date >= current clock date; awareness_at <= current clock time'
  error_id: ERR_VALIDATION
  http_status: 400
  applies_to: all POST endpoints
- priority: 4
  category: state
  check: 'target entity is not terminal and is in a valid from-state for the operation: terminal enrollment (DISCONTINUED | DENIED_CLOSED) rejects all child-mutating operations (ERR_ENROLLMENT_DISCONTINUED);
    terminal PA/assistance/shipment/visit/AE/report reject further transitions (ERR_ALREADY_TERMINAL); wrong non-terminal from-state (ERR_INVALID_TRANSITION); shipment creation requires enrollment IN {PA_PENDING,
    APPROVED, ACTIVE} (ERR_ENROLLMENT_NOT_READY_FOR_SHIPMENT); outcome report creation requires enrollment IN {ACTIVE, DISCONTINUED} (ERR_INVALID_TRANSITION); OCC expected_enrollment_version mismatch (ERR_STALE_VERSION)'
  error_id: ERR_ALREADY_TERMINAL
  http_status: 409
  applies_to: state-transition and child-creation endpoints (ERR_STALE_VERSION is 412 on the two OCC endpoints)
- priority: 5
  category: business_safety
  check: 'compliance/safety gates: cold-chain transit_hours <= program.max_transit_hours when program.requires_cold_chain (shipment create); AE reported within AE_REPORT_WINDOW_HOURS of awareness_at (AE
    create); grant release forbidden when X-User-ID == assistance.matched_by_user_id (segregation of duties)'
  error_id: ERR_COLD_CHAIN_EXCEEDED
  http_status: 422
  applies_to: shipment create (ERR_COLD_CHAIN_EXCEEDED); AE create (ERR_AE_REPORT_WINDOW_MISSED); assistance release (ERR_SEGREGATION_OF_DUTY, 403)
- priority: 6
  category: business_constraint
  check: 'domain constraints: first-fill requires training_sessions_completed >= 1 when program.requires_injection_training; refill requires pdc_confirmed_pct >= 80.0; PA creation requires BI.requires_prior_auth
    == true; visit window_end > window_start; outcome report period must not overlap a SUBMITTED report for the enrollment'
  error_id: ERR_TRAINING_INCOMPLETE
  http_status: 422
  applies_to: shipment create (ERR_TRAINING_INCOMPLETE, ERR_ADHERENCE_TOO_LOW); PA create (ERR_PA_NOT_REQUIRED); visit create (ERR_VISIT_WINDOW_INVALID); report create (ERR_REPORT_PERIOD_CLOSED)
- priority: 7
  category: business_temporal
  check: 'temporal conflicts: new NurseVisit window overlaps (half-open) another SCHEDULED visit for the same nurse_id; refill requested_delivery_date < latest DELIVERED shipment''s delivered_date + program.min_days_between_fills'
  error_id: ERR_VISIT_WINDOW_OVERLAP
  http_status: 409
  applies_to: visit create (ERR_VISIT_WINDOW_OVERLAP, 409); shipment create (ERR_REFILL_SPACING_VIOLATION, 422)
- priority: 8
  category: business_fiscal
  check: 'funding capacity: foundation match finds at least one eligible pool per assistance_match_selector'
  error_id: ERR_NO_ELIGIBLE_FOUNDATION
  http_status: 422
  applies_to: POST /hub/enrollments/{id}/copay-assistance/match
endpoints:
- method: POST
  path: /hub/drug-programs
  description: Create a manufacturer drug program (configuration).
  roles:
  - HubAdmin
  code: 201
  input:
  - name
  - manufacturer_name
  - diagnosis_code
  - requires_injection_training
  - requires_cold_chain
  - max_transit_hours
  - min_days_between_fills
  - copay_card_per_fill_cap_cents
  - copay_card_annual_cap_cents
  - default_days_supply
  output: DrugProgram
  side_effects: []
- method: POST
  path: /hub/foundation-pools
  description: Create a charitable foundation funding pool. remaining_balance_cents initializes to total_funding_cents.
  roles:
  - HubAdmin
  code: 201
  input:
  - name
  - diagnosis_code
  - total_funding_cents
  - grant_amount_cents
  - coverage_pct
  - start_date
  - end_date
  output: FoundationPool
  side_effects:
  - remaining_balance_cents := total_funding_cents
- method: GET
  path: /hub/foundation-pools/{id}
  description: Read a foundation pool (balance visibility for reconciliation).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: FoundationPool
  side_effects: []
- method: POST
  path: /hub/enrollments
  description: Enroll a patient into a drug program. Creates Enrollment in INTAKE.
  roles:
  - CaseManager
  code: 201
  input:
  - program_id
  - patient_ref
  - diagnosis_code
  output: Enrollment
  side_effects:
  - case_manager_id := X-User-ID
  - status := INTAKE
- method: GET
  path: /hub/enrollments/{id}
  description: Read one enrollment including computed adherence and OOP fields.
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: Enrollment
  side_effects: []
- method: GET
  path: /hub/enrollments
  description: List enrollments with optional filters and envelope pagination. Results sorted by created_at ASC (stable chronological order).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input:
  - status?
  - program_id?
  - limit?
  - offset?
  output: Enrollment[]
  side_effects: []
- method: POST
  path: /hub/enrollments/{id}/discontinue
  description: Discontinue a non-terminal enrollment; cascades release assistance and cancel pending shipments.
  roles:
  - CaseManager
  code: 200
  input:
  - reason?
  output: Enrollment
  side_effects:
  - enrollment -> DISCONTINUED
  - cascade per Enrollment machine
- method: POST
  path: /hub/enrollments/{id}/benefits-investigation
  description: Record the benefits investigation (immutable once created). Moves enrollment INTAKE -> BENEFITS_VERIFIED, or -> APPROVED when requires_prior_auth is false.
  roles:
  - CaseManager
  code: 201
  input:
  - payer_name
  - member_id
  - requires_prior_auth
  - plan_has_accumulator
  - patient_cost_share_cents
  - oop_max_cents
  output: BenefitsInvestigation
  side_effects:
  - enrollment status transition per Enrollment machine
  - enrollment.remaining_oop_cents := oop_max_cents
- method: GET
  path: /hub/enrollments/{id}/benefits-investigation
  description: Fetch the enrollment's benefits investigation (array of length 0 or 1). Results sorted by created_at ASC (stable chronological order).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: BenefitsInvestigation[]
  side_effects: []
- method: POST
  path: /hub/enrollments/{id}/prior-authorization
  description: Create and submit a prior authorization (enters SUBMITTED). Enrollment must be BENEFITS_VERIFIED with BI.requires_prior_auth == true.
  roles:
  - CaseManager
  code: 201
  input:
  - clinical_notes
  - payer_reference
  output: PriorAuthorization
  side_effects:
  - enrollment BENEFITS_VERIFIED -> PA_PENDING
  - appeal_round := 0
- method: GET
  path: /hub/enrollments/{id}/prior-authorizations
  description: List prior authorizations for an enrollment. Results sorted by created_at ASC (stable chronological order).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: PriorAuthorization[]
  side_effects: []
- method: POST
  path: /hub/prior-authorizations/{id}/decision
  description: Payer records an APPROVED or DENIED decision on a SUBMITTED or APPEALED PA. Drives enrollment and (on approval) assistance/shipment cascades.
  roles:
  - PayerReviewer
  code: 200
  input:
  - outcome
  - rationale?
  output: PriorAuthorization
  side_effects:
  - PA state per machine
  - CASCADE A on APPROVED
  - enrollment PA_PENDING -> PA_DENIED on DENIED
  - enrollment PA_PENDING -> DENIED_CLOSED on DENIED_FINAL
- method: POST
  path: /hub/prior-authorizations/{id}/appeal
  description: Appeal a DENIED PA (appeal_round < 2). PA DENIED -> APPEALED; enrollment PA_DENIED -> PA_PENDING.
  roles:
  - CaseManager
  code: 200
  input:
  - clinical_notes?
  output: PriorAuthorization
  side_effects:
  - appeal_round += 1
  - enrollment PA_DENIED -> PA_PENDING
- method: POST
  path: /hub/enrollments/{id}/copay-assistance/match
  description: Match the enrollment to copay card terms or a foundation grant. OCC-guarded; supersedes (RELEASES) any existing non-terminal assistance. FOUNDATION uses assistance_match_selector. New assistance
    is RESERVED unless enrollment IN {APPROVED, ACTIVE} (then ACTIVE).
  roles:
  - FinancialCounselor
  code: 201
  input:
  - assistance_type
  - expected_enrollment_version
  output: CopayAssistance
  side_effects:
  - verify expected_enrollment_version == enrollment.version else ERR_STALE_VERSION
  - existing non-terminal CopayAssistance -> RELEASED with returned_cents computed (pool credited for FOUNDATION)
  - 'FOUNDATION: selected pool.remaining_balance_cents -= grant_amount_cents'
  - increments Enrollment.version by 1
- method: POST
  path: /hub/copay-assistances/{id}/release
  description: 'Manually release a non-terminal assistance and return its undisbursed remainder to the funding source. Segregation of duties: releaser must differ from matched_by_user_id.'
  roles:
  - FinancialCounselor
  code: 200
  input: []
  output: CopayAssistance
  side_effects:
  - assistance -> RELEASED
  - returned_cents computed
  - 'FOUNDATION: pool.remaining_balance_cents += returned_cents'
- method: GET
  path: /hub/enrollments/{id}/copay-assistances
  description: List copay assistance records for an enrollment. Results sorted by created_at ASC (stable chronological order).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: CopayAssistance[]
  side_effects: []
- method: GET
  path: /hub/foundation-pools/{id}/copay-assistances
  description: List grants drawn from a foundation pool. Results sorted by created_at ASC (stable chronological order).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: CopayAssistance[]
  side_effects: []
- method: POST
  path: /hub/enrollments/{id}/nurse-visits
  description: Schedule a nurse education / injection training visit. Half-open window overlap per nurse_id is rejected; adjacency allowed.
  roles:
  - CaseManager
  code: 201
  input:
  - nurse_id
  - window_start
  - window_end
  output: NurseVisit
  side_effects:
  - status := SCHEDULED
- method: GET
  path: /hub/enrollments/{id}/nurse-visits
  description: List nurse visits for an enrollment. Results sorted by created_at ASC (stable chronological order).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: NurseVisit[]
  side_effects: []
- method: POST
  path: /hub/nurse-visits/{id}/resolve
  description: Assigned nurse resolves a SCHEDULED visit as COMPLETED or NO_SHOW. COMPLETED increments enrollment.training_sessions_completed.
  roles:
  - NurseEducator
  code: 200
  input:
  - outcome
  output: NurseVisit
  side_effects:
  - visit -> COMPLETED | NO_SHOW
  - 'COMPLETED: enrollment.training_sessions_completed += 1 (bumps enrollment.version)'
- method: POST
  path: /hub/enrollments/{id}/shipments
  description: Request a fill shipment. Validates enrollment readiness, training gate (first fill), cold-chain gate, refill adherence gate (pdc_confirmed_pct >= 80.0) and refill spacing. Enters SCHEDULED
    when enrollment IN {APPROVED, ACTIVE} and no RESERVED assistance blocks, else REQUESTED.
  roles:
  - CaseManager
  code: 201
  input:
  - requested_delivery_date
  - transit_hours
  - days_supply
  output: Shipment
  side_effects:
  - fill_number / fill_type assigned
  - patient_cost_share_cents frozen from BI
- method: GET
  path: /hub/enrollments/{id}/shipments
  description: List shipments for an enrollment. Results sorted by created_at ASC (stable chronological order).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: Shipment[]
  side_effects: []
- method: POST
  path: /hub/shipments/{id}/ship
  description: Pharmacy ships a SCHEDULED shipment; applies the assistance split and accrues the payer OOP accumulator.
  roles:
  - PharmacyPartner
  code: 200
  input: []
  output: Shipment
  side_effects:
  - shipment SCHEDULED -> SHIPPED
  - patient_responsibility_split or foundation_split
  - assistance debit
  - enrollment OOP accrual
- method: POST
  path: /hub/shipments/{id}/deliver
  description: Confirm delivery. First delivery activates therapy (enrollment APPROVED -> ACTIVE, therapy_start_date set).
  roles:
  - PharmacyPartner
  code: 200
  input:
  - delivered_date
  output: Shipment
  side_effects:
  - shipment SHIPPED -> DELIVERED
  - enrollment activation / fills_delivered_count += 1
  - PDC recompute
- method: POST
  path: /hub/shipments/{id}/spoil
  description: Report a SHIPPED shipment spoiled (cold-chain excursion). Reverses the assistance disbursement and the payer OOP accrual.
  roles:
  - PharmacyPartner
  code: 200
  input:
  - reason?
  output: Shipment
  side_effects:
  - shipment SHIPPED -> SPOILED
  - 'CASCADE B: assistance credit then enrollment accumulator rollback'
- method: POST
  path: /hub/enrollments/{id}/adverse-events
  description: Report an adverse event (enters REPORTED). Awareness must be within AE_REPORT_WINDOW_HOURS = 24 of the current logical clock time.
  roles:
  - CaseManager
  - NurseEducator
  code: 201
  input:
  - awareness_at
  - seriousness
  - description
  output: AdverseEvent
  side_effects:
  - reported_by_user_id := X-User-ID
  - status := REPORTED
- method: GET
  path: /hub/enrollments/{id}/adverse-events
  description: List adverse events for an enrollment. Results sorted by created_at ASC (stable chronological order).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: AdverseEvent[]
  side_effects: []
- method: POST
  path: /hub/adverse-events/{id}/acknowledge
  description: Manufacturer acknowledges receipt of a REPORTED adverse event.
  roles:
  - ManufacturerMonitor
  code: 200
  input: []
  output: AdverseEvent
  side_effects:
  - ae REPORTED -> ACKNOWLEDGED
- method: POST
  path: /hub/enrollments/{id}/outcome-reports
  description: Create a DRAFT outcomes report with computed metrics for [period_start, period_end). OCC-guarded; supersedes overlapping DRAFTs; overlapping SUBMITTED report -> ERR_REPORT_PERIOD_CLOSED.
  roles:
  - CaseManager
  code: 201
  input:
  - period_start
  - period_end
  - expected_enrollment_version
  output: OutcomeReport
  side_effects:
  - verify expected_enrollment_version else ERR_STALE_VERSION
  - overlapping DRAFTs -> SUPERSEDED
  - outcome_report_metrics computed
  - increments Enrollment.version by 1
- method: GET
  path: /hub/enrollments/{id}/outcome-reports
  description: List outcome reports for an enrollment. Results sorted by created_at ASC (stable chronological order).
  roles:
  - HubAdmin
  - CaseManager
  - FinancialCounselor
  - NurseEducator
  - PharmacyPartner
  - PayerReviewer
  - ManufacturerMonitor
  code: 200
  input: []
  output: OutcomeReport[]
  side_effects: []
- method: POST
  path: /hub/outcome-reports/{id}/submit
  description: Submit a DRAFT outcomes report to the payer (terminal).
  roles:
  - CaseManager
  code: 200
  input: []
  output: OutcomeReport
  side_effects:
  - report DRAFT -> SUBMITTED
- method: POST
  path: /hub/_clock/set_current_utc
  description: Set the server's logical clock (ISO8601 UTC). Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time.
  roles:
  - HubAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - logical clock advanced; time-dependent computed fields (PDC) reflect the new clock on next read
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing/blank X-User-Role or X-User-ID header, or unrecognized role
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted on this endpoint; or NurseVisit resolve attempted by a user whose X-User-ID != visit.nurse_id
- id: ERR_VALIDATION
  http: 400
  condition: 'Malformed body: missing required field, bad type, unknown enum value, unparseable date, requested_delivery_date in the past, or awareness_at in the future'
- id: ERR_ENROLLMENT_NOT_FOUND
  http: 404
  condition: enrollment id in path does not exist
- id: ERR_DRUG_PROGRAM_NOT_FOUND
  http: 404
  condition: program id does not exist (enrollment creation)
- id: ERR_FOUNDATION_POOL_NOT_FOUND
  http: 404
  condition: foundation pool id in path does not exist
- id: ERR_PRIOR_AUTHORIZATION_NOT_FOUND
  http: 404
  condition: PA id in path does not exist
- id: ERR_COPAY_ASSISTANCE_NOT_FOUND
  http: 404
  condition: copay assistance id in path does not exist
- id: ERR_SHIPMENT_NOT_FOUND
  http: 404
  condition: shipment id in path does not exist
- id: ERR_NURSE_VISIT_NOT_FOUND
  http: 404
  condition: nurse visit id in path does not exist
- id: ERR_ADVERSE_EVENT_NOT_FOUND
  http: 404
  condition: adverse event id in path does not exist
- id: ERR_OUTCOME_REPORT_NOT_FOUND
  http: 404
  condition: outcome report id in path does not exist
- id: ERR_INVALID_TRANSITION
  http: 409
  condition: Operation not valid from the resource's current (non-terminal) state — e.g. appeal a SUBMITTED PA, ship a REQUESTED shipment, submit a SUBMITTED report, create PA when enrollment not BENEFITS_VERIFIED,
    create outcome report when enrollment not IN {ACTIVE, DISCONTINUED}
- id: ERR_ALREADY_TERMINAL
  http: 409
  condition: Transition attempted on a terminal PA / assistance / shipment / visit / AE / report
- id: ERR_ENROLLMENT_DISCONTINUED
  http: 409
  condition: Child-mutating operation attempted while enrollment is DISCONTINUED or DENIED_CLOSED
- id: ERR_ENROLLMENT_NOT_READY_FOR_SHIPMENT
  http: 409
  condition: Shipment creation while enrollment not IN {PA_PENDING, APPROVED, ACTIVE}
- id: ERR_PA_NOT_REQUIRED
  http: 422
  condition: PA created when the enrollment's BI says requires_prior_auth == false
- id: ERR_NO_ELIGIBLE_FOUNDATION
  http: 422
  condition: FOUNDATION match with an empty eligible pool set per assistance_match_selector
- id: ERR_TRAINING_INCOMPLETE
  http: 422
  condition: First-fill shipment while program.requires_injection_training and enrollment.training_sessions_completed == 0
- id: ERR_COLD_CHAIN_EXCEEDED
  http: 422
  condition: program.requires_cold_chain and shipment transit_hours > program.max_transit_hours
- id: ERR_ADHERENCE_TOO_LOW
  http: 422
  condition: Refill shipment while pdc_confirmed_pct < 80.0 (exactly 80.0 passes)
- id: ERR_REFILL_SPACING_VIOLATION
  http: 422
  condition: Refill requested_delivery_date earlier than latest DELIVERED shipment's delivered_date + min_days_between_fills
- id: ERR_VISIT_WINDOW_INVALID
  http: 422
  condition: Nurse visit window_end <= window_start
- id: ERR_VISIT_WINDOW_OVERLAP
  http: 409
  condition: New visit window [start, end) overlaps another SCHEDULED visit for the same nurse_id; touching windows (end == start) allowed
- id: ERR_AE_REPORT_WINDOW_MISSED
  http: 422
  condition: Adverse event reported more than AE_REPORT_WINDOW_HOURS (24h) after awareness_at
- id: ERR_REPORT_PERIOD_CLOSED
  http: 422
  condition: New outcome report period overlaps an existing SUBMITTED report for the enrollment
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_enrollment_version != enrollment.version on an OCC-guarded write
- id: ERR_SEGREGATION_OF_DUTY
  http: 403
  condition: Grant release attempted by the same X-User-ID that matched the assistance
roles:
- name: HubAdmin
  description: Hub platform administrator; owns program/foundation configuration and the logical clock
  identity: opaque
  exclusive_operations:
  - POST /hub/drug-programs
  - POST /hub/foundation-pools
  - POST /hub/_clock/set_current_utc
  shared_operations:
  - all GET endpoints
- name: CaseManager
  description: Hub case manager; runs enrollment, benefits investigation, PA submission/appeals, shipment scheduling, visit scheduling, AE reporting, outcome reports, discontinuation
  identity: opaque
  exclusive_operations:
  - POST /hub/enrollments
  - POST /hub/enrollments/{id}/benefits-investigation
  - POST /hub/enrollments/{id}/prior-authorization
  - POST /hub/prior-authorizations/{id}/appeal
  - POST /hub/enrollments/{id}/nurse-visits
  - POST /hub/enrollments/{id}/shipments
  - POST /hub/enrollments/{id}/outcome-reports
  - POST /hub/outcome-reports/{id}/submit
  - POST /hub/enrollments/{id}/discontinue
  shared_operations:
  - POST /hub/enrollments/{id}/adverse-events (with NurseEducator)
  - all GET endpoints
- name: FinancialCounselor
  description: Patient-services financial counselor; runs copay card / foundation matching and grant release (release requires a different counselor than the matcher)
  identity: opaque
  exclusive_operations:
  - POST /hub/enrollments/{id}/copay-assistance/match
  - POST /hub/copay-assistances/{id}/release
  shared_operations:
  - all GET endpoints
- name: NurseEducator
  description: Hub nurse; resolves only visits assigned to their own X-User-ID; may report adverse events
  identity: opaque
  exclusive_operations:
  - POST /hub/nurse-visits/{id}/resolve (only when X-User-ID == visit.nurse_id)
  shared_operations:
  - POST /hub/enrollments/{id}/adverse-events (with CaseManager)
  - all GET endpoints
- name: PharmacyPartner
  description: Limited-distribution specialty pharmacy operator; ships, delivers, and spoils shipments
  identity: opaque
  exclusive_operations:
  - POST /hub/shipments/{id}/ship
  - POST /hub/shipments/{id}/deliver
  - POST /hub/shipments/{id}/spoil
  shared_operations:
  - all GET endpoints
- name: PayerReviewer
  description: Payer-side reviewer; records prior authorization decisions
  identity: opaque
  exclusive_operations:
  - POST /hub/prior-authorizations/{id}/decision
  shared_operations:
  - all GET endpoints
- name: ManufacturerMonitor
  description: Manufacturer drug-safety monitor; acknowledges adverse event reports
  identity: opaque
  exclusive_operations:
  - POST /hub/adverse-events/{id}/acknowledge
  shared_operations:
  - all GET endpoints
