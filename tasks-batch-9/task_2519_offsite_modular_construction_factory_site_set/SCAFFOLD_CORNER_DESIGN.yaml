              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { review_note: "R1" }
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE" }
              as: DesignEngineer
              as_user_id: "eng-002"
            - call: "POST /modular/permits"
              payload: { project_id: "${proj}", track: "STATE_MODULAR_PROGRAM", scope: "PLAN_REVIEW" }
              as: ProgramAdmin
              captures: { permit: "$.data.id" }
            - call: "POST /modular/permits/${permit}/decide"
              payload: { decision: "APPROVE" }
              as: StateProgramOfficer
            - call: "POST /modular/agencies"
              payload: { name: "Cascade Inspection Services", agency_code: "CIS", accredited_state_codes: ["WA"], per_inspection_fee_cents: 120000 }
              as: ProgramAdmin
              captures: { agency: "$.data.id" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m1: "$.data.id" }
            - call: "POST /modular/modules/${m1}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-02T14:00:00Z" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/modules/${m1}/advance-station"
              payload: { stations_advanced: 6 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/inspections"
              payload: { module_id: "${m1}", agency_id: "${agency}", stage: "IN_PLANT" }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
              captures: { i1: "$.data.id" }
            - call: "POST /modular/inspections/${i1}/record-result"
              payload: { result: "PASS", defect_count: 0, severity_max: 0 }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
            - call: "POST /modular/inspections"
              payload: { module_id: "${m1}", agency_id: "${agency}", stage: "FINAL_FACTORY" }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
              captures: { i2: "$.data.id" }
            - call: "POST /modular/inspections/${i2}/record-result"
              payload: { result: "PASS", defect_count: 0, severity_max: 0 }
              as: ThirdPartyInspector
              as_user_id: "${agency}"
            - call: "POST /modular/shipments"
              payload: { project_id: "${proj}", carrier_code: "NWHEAVY", route_state_codes: ["WA"], planned_departure_at: "2026-09-08T13:00:00Z", planned_arrival_at: "2026-09-08T21:00:00Z" }
              as: TransportCoordinator
              captures: { ship: "$.data.id", shipv: "$.data.version" }
            - call: "POST /modular/shipments/${ship}/load-module"
              payload: { module_id: "${m1}", expected_shipment_version: "${shipv}" }
              as: TransportCoordinator
              captures: { shipv2: "$.data.version" }
          trigger:
            - call: "POST /modular/shipments/${ship}/route-survey"
              payload: { survey_completed_at: "2026-09-01T09:00:00Z", permit_expires_at: "2026-09-20T00:00:00Z" }
              as: TransportCoordinator
              captures: { s1: "$.data.status", rs1: "$.data.route_survey_state" }
            - call: "POST /modular/shipments/${ship}/dispatch"
              as: TransportCoordinator
              captures: { s2: "$.data.status", dep: "$.data.dispatched_at" }
            - call: "POST /modular/shipments/${ship}/deliver"
              as: TransportCoordinator
              captures: { s3: "$.data.status", arr: "$.data.delivered_at" }
          assert:
            - "${s1} == 'PERMITTED' and ${rs1} == 'COMPLETED' — a STANDARD load goes DRAFT -> PERMITTED directly"
            - "${s2} == 'DISPATCHED' and ${dep} == '2026-09-01T08:00:00.000Z' (the logical clock, not a payload value)"
            - "${s3} == 'DELIVERED' and ${arr} == '2026-09-01T08:00:00.000Z'"
            - "GET /modular/modules/${m1} reports site_status == 'DELIVERED' after the chain, having passed through IN_TRANSIT on dispatch"
            - "GET /modular/projects/${proj} reports phase == 'SHIPPING'"

      - name: shipment_dispatch_from_draft_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[Shipment.status]
          - validations[priority=51]
          - endpoints[POST /modular/shipments/{shipmentId}/dispatch]
        distinguishing_aspect: |
          Dispatch declares two preconditions — status PERMITTED and at least one loaded module. An
          empty DRAFT shipment violates both and must be refused with the single declared error
          rather than dispatching an empty truck.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; an empty DRAFT shipment exists"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
