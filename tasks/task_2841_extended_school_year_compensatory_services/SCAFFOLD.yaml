scenario: |
  2841. Extended School Year & Compensatory Services (district special education services): eligibility determination criteria including regression and recoupment analysis, service minutes and staffing plan for the summer program, transportation and related-services coordination for a shortened calendar, compensatory education award calculation from missed services with delivery plans, provider assignment, tracking of delivered versus owed minutes and makeup scheduling, parent agreement and dispute resolution over the compensatory amount, documentation for due process and complaint investigations, budget coding across federal and local funds

domain_name: "extended-school-year-compensatory-services"
api_prefix: "/esy"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities joined by explicit foreign keys. Only three URL families nest
  # (student-scoped reads, program-scoped reads, provider-scoped reads) and those
  # nestings are read-only reverse-reachability paths, not ownership trees: every
  # write endpoint addresses its resource collection directly and carries its
  # parents as FK fields in the body.

  state_machine_shape: cyclic
  # CompensatoryAward carries TWO independent state dimensions (negotiation_status
  # x delivery_status); negotiation_status cycles PARENT_REVIEW -> DISPUTED ->
  # PARENT_REVIEW on every revision round and delivery_status cycles FULFILLED ->
  # IN_PROGRESS when a delivered makeup session is voided. EligibilityDetermination
  # cycles PARENT_REVIEW -> DRAFT on parent objection; ServiceCommitment cycles
  # ACTIVE -> SUSPENDED -> ACTIVE; MakeupSession branches SCHEDULED -> {DELIVERED,
  # NO_SHOW_PARENT, CANCELLED_DISTRICT} with a different side-effect set per branch.

  relationship_patterns:
    - one_to_many          # EsyProgram -> ServiceCommitment, CompensatoryAward -> MakeupSession
    - many_to_many         # Provider <-> ServiceCommitment via ProviderAssignment
    - self_referential     # MakeupSession.supersedes_session_id -> MakeupSession.id
    - cross_aggregate      # DueProcessRecord (student aggregate) gates ServiceCommitment (program aggregate)

  role_model: segregation_of_duties
  # The SpedDirector who finalizes an EligibilityDetermination MUST NOT be the
  # CaseManager user id that analyzed it, and the SpedDirector who resolves a
  # compensatory dispute MUST NOT be the user id that authored the proposal.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: student_number
        type: string
        source: input
        description: District student number printed on the IEP cover sheet
        constraints: "required; unique across all Student rows; 1..16 chars"
      - name: first_name
        type: string
        source: input
        description: Legal first name
        constraints: "required; 1..40 chars"
      - name: last_name
        type: string
        source: input
        description: Legal last name
        constraints: "required; 1..40 chars"
      - name: grade_band
        type: enum
        source: input
        description: Grade band used to pick the summer staffing ratio
        constraints: "required; one of PRE_K, K_5, MS_6_8, HS_9_12"
      - name: primary_disability
        type: enum
        source: input
        description: Primary IDEA disability category
        constraints: "required; one of AUTISM, INTELLECTUAL_DISABILITY, SPECIFIC_LEARNING_DISABILITY, SPEECH_LANGUAGE_IMPAIRMENT, EMOTIONAL_DISTURBANCE, MULTIPLE_DISABILITIES"
      - name: iep_weekly_minutes_total
        type: integer
        source: input
        description: Total weekly special-education service minutes on the school-year IEP
        constraints: "required; 1..3000"
      - name: transportation_required
        type: boolean
        source: input
        description: IEP marks transportation as a related service
        default: false
      - name: home_school_code
        type: string
        source: input
        description: Attendance-area school code
        constraints: "required; 1..12 chars"
      - name: esy_eligibility_status
        type: enum
        source: computed
        description: Mirror of the FINALIZED EligibilityDetermination recommendation for the current school year; written only by the FINALIZED transition
        default: "NOT_DETERMINED"
        constraints: "one of NOT_DETERMINED, ELIGIBLE, INELIGIBLE, PENDING_DATA"
      - name: pending_award_minutes
        type: integer
        source: computed
        description: "See calculations.student_minutes_ledger: sum of ServiceCommitment.compensable_owed_minutes over every ServiceCommitment whose student_id equals this Student.id and whose status != TERMINATED"
        default: 0
      - name: outstanding_owed_minutes
        type: integer
        source: computed
        description: "See calculations.student_minutes_ledger: sum of CompensatoryAward.remaining_owed_minutes over awards of this student whose negotiation_status IN {AGREED, CLOSED}"
        default: 0
      - name: delivered_makeup_minutes_total
        type: integer
        source: computed
        description: "See calculations.student_minutes_ledger: sum of CompensatoryAward.delivered_minutes over every award of this student"
        default: 0
      - name: esy_service_alert
        type: boolean
        source: computed
        description: "True iff pending_award_minutes >= AUTO_AWARD_THRESHOLD_MINUTES (60); flags the case for compensatory review"
        default: false
      - name: stay_put_active
        type: boolean
        source: computed
        description: "True iff at least one DueProcessRecord with student_id == this Student.id has status == OPEN AND record_type IN {COMPLAINT, DUE_PROCESS_HEARING}; an OPEN MEDIATION_AGREEMENT does not raise it. See calculations.student_minutes_ledger"
        default: false

  - name: EligibilityDetermination
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student whose ESY eligibility is being determined"
        constraints: "required; Student must exist"
      - name: school_year
        type: string
        source: input
        description: School year the determination applies to
        constraints: "required; format YYYY-YYYY, e.g. 2026-2027"
      - name: analysis_variant
        type: enum
        source: input
        description: Selects which variant of calculations.regression_recoupment_analysis runs on analyze
        constraints: "required; one of PROBE_BASED, TEAM_JUDGMENT"
      - name: skill_probes
        type: array
        source: input
        description: >-
          Ordered array of probe objects, each
          { skill_domain: enum(READING_FLUENCY|MATH_COMPUTATION|EXPRESSIVE_LANGUAGE|SELF_REGULATION|ADAPTIVE_SKILLS),
          pre_break_mastery_pct: number 0..100, post_break_mastery_pct: number 0..100,
          recoupment_days_observed: integer 0..120, trials_count: integer 0..50 }.
          Array order is the pinned evaluation order for calculations.regression_recoupment_analysis.
        constraints: "required; 1..8 entries; pre_break_mastery_pct must be > 0"
      - name: status
        type: enum
        source: system
        description: Determination workflow state
        default: "DRAFT"
        constraints: "one of DRAFT, PARENT_REVIEW, PARENT_AGREED, FINALIZED, WITHDRAWN"
      - name: max_regression_pct
        type: number
        source: computed
        description: "Largest per-probe regression percentage produced by calculations.regression_recoupment_analysis; 1 decimal place, round_half_up"
        default: 0
      - name: max_recoupment_days
        type: integer
        source: computed
        description: Largest recoupment day count considered by the selected analysis variant (observed for PROBE_BASED, projected for TEAM_JUDGMENT)
        default: 0
      - name: criteria_met_count
        type: integer
        source: computed
        description: Number of probe domains that satisfied BOTH the regression and the recoupment test under the selected variant
        default: 0
      - name: data_sufficiency
        type: enum
        source: computed
        description: "SUFFICIENT unless the PROBE_BASED variant sees a probe with trials_count < MIN_TRIALS_PER_PROBE; TEAM_JUDGMENT always yields SUFFICIENT"
        default: "SUFFICIENT"
        constraints: "one of SUFFICIENT, INSUFFICIENT"
      - name: eligibility_recommendation
        type: enum
        source: computed
        description: Recommendation written by analyze and copied onto Student.esy_eligibility_status by finalize
        default: "PENDING_DATA"
        constraints: "one of ELIGIBLE, INELIGIBLE, PENDING_DATA"
      - name: objection_round_count
        type: integer
        source: computed
        description: Count of PARENT_REVIEW -> DRAFT objection cycles this determination has been through
        default: 0
      - name: analyzed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CaseManager whose analyze call last computed this determination; the segregation-of-duties check on finalize compares against it
        default: null
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the SpedDirector who finalized the determination
        default: null
      - name: parent_comment
        type: string
        source: input
        description: Free-text comment supplied with the most recent parent response
        default: null
        constraints: "0..500 chars"

  - name: EsyProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Program name, e.g. "Summer 2027 ESY - Elementary"
        constraints: "required; 1..80 chars"
      - name: school_year
        type: string
        source: input
        description: School year the summer session belongs to
        constraints: "required; format YYYY-YYYY"
      - name: session_start_date
        type: string
        source: input
        description: First calendar date of the shortened summer session (inclusive)
        constraints: "required; ISO 8601 date YYYY-MM-DD"
      - name: session_end_date
        type: string
        source: input
        description: Last calendar date of the shortened summer session (inclusive)
        constraints: "required; ISO 8601 date; must be >= session_start_date"
      - name: instructional_weekdays
        type: array
        source: input
        description: Weekdays the shortened calendar actually runs, e.g. ["MON","TUE","WED","THU"]
        constraints: "required; 1..5 distinct entries from MON, TUE, WED, THU, FRI"
      - name: blackout_dates
        type: array
        source: input
        description: Planned non-instructional dates inside the session window (holidays, staff development)
        default: []
        constraints: "each entry ISO 8601 date inside [session_start_date, session_end_date]"
      - name: cancelled_dates
        type: array
        source: system
        description: Dates removed from the calendar after the fact by POST /esy/programs/{program_id}/cancel-day
        default: []
      - name: daily_minutes_cap
        type: integer
        source: input
        description: Maximum service minutes any single student may be scheduled for on one instructional day
        constraints: "required; 1..480"
      - name: instructional_days_count
        type: integer
        source: computed
        description: "Count of dates d in [session_start_date, session_end_date] where weekday(d) IN instructional_weekdays AND d NOT IN blackout_dates AND d NOT IN cancelled_dates"
        default: 0
      - name: instructional_week_count
        type: integer
        source: computed
        description: Count of distinct ISO weeks that contain at least one instructional date
        default: 0
      - name: status
        type: enum
        source: system
        description: Program lifecycle state
        default: "PLANNING"
        constraints: "one of PLANNING, STAFFING_LOCKED, OPEN, CLOSED"

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Provider display name
        constraints: "required; 1..60 chars"
      - name: role_type
        type: enum
        source: input
        description: Credentialed role; gates which ServiceCommitment.service_type values this provider may cover
        constraints: "required; one of SPED_TEACHER, SLP, OT, PT, COUNSELOR, PARAEDUCATOR"
      - name: credential_expires_on
        type: string
        source: input
        description: Last date the credential is valid (inclusive)
        constraints: "required; ISO 8601 date"
      - name: rate_cents_per_minute
        type: integer
        source: input
        description: Fully loaded cost per service minute in cents; the multiplier in calculations.fund_charge_waterfall
        constraints: "required; 1..2000"
      - name: max_weekly_minutes
        type: integer
        source: input
        description: Contractual weekly service-minute ceiling for this provider
        constraints: "required; 1..3000"
      - name: assigned_weekly_minutes
        type: integer
        source: computed
        description: "Sum of covered_weekly_minutes over every ProviderAssignment with provider_id == this Provider.id and status == ACTIVE"
        default: 0
      - name: status
        type: enum
        source: system
        description: Staffing availability
        default: "ACTIVE"
        constraints: "one of ACTIVE, ON_LEAVE, INACTIVE"

  - name: ServiceCommitment
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> EsyProgram.id; the summer program this commitment is planned inside"
        constraints: "required; EsyProgram must exist and be in status PLANNING"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student receiving the service"
        constraints: "required; Student.esy_eligibility_status must be ELIGIBLE"
      - name: transportation_run_id
        type: string
        source: input
        description: "FK -> TransportationRun.id; nullable; the bus run that carries this student to the session. Occupies one seat while commitment.status IN {PLANNED, ASSIGNED, ACTIVE, SUSPENDED}"
        default: null
      - name: service_type
        type: enum
        source: input
        description: Service line this commitment covers
        constraints: "required; one of SPECIALIZED_INSTRUCTION, SPEECH, OT, PT, COUNSELING"
      - name: iep_weekly_minutes
        type: integer
        source: input
        description: Weekly minutes for this service line taken from the school-year IEP; the input to calculations.esy_service_minutes_plan
        constraints: "required; 1..1500"
      - name: staffing_ratio
        type: enum
        source: input
        description: Summer staffing ratio agreed by the IEP team
        constraints: "required; one of ONE_TO_ONE, ONE_TO_THREE, ONE_TO_SIX, GROUP_TEN"
      - name: planned_total_minutes
        type: integer
        source: computed
        description: "Output of calculations.esy_service_minutes_plan. PINNED AT CREATION: never recomputed when blackout_dates or cancelled_dates change afterwards - the shortfall surfaces through compensable_owed_minutes instead"
        default: 0
      - name: weekly_minutes_committed
        type: integer
        source: computed
        description: "Output of calculations.esy_service_minutes_plan: round_half_up(planned_total_minutes / program.instructional_week_count); pinned at creation"
        default: 0
      - name: daily_minutes
        type: integer
        source: computed
        description: "Output of calculations.esy_service_minutes_plan: round_half_up(weekly_minutes_committed / len(program.instructional_weekdays)); the minutes_scheduled written on a system day-cancellation ServiceLog; pinned at creation"
        default: 0
      - name: delivered_minutes
        type: integer
        source: computed
        description: "See calculations.commitment_minutes_ledger: sum of minutes_delivered over ServiceLog rows of this commitment with status == VERIFIED"
        default: 0
      - name: compensable_owed_minutes
        type: integer
        source: computed
        description: "See calculations.commitment_minutes_ledger: sum of (minutes_scheduled - minutes_delivered) over ServiceLog rows of this commitment with status == VERIFIED and outcome IN {MISSED_DISTRICT, PARTIAL}"
        default: 0
      - name: status
        type: enum
        source: system
        description: Commitment lifecycle state
        default: "PLANNED"
        constraints: "one of PLANNED, ASSIGNED, ACTIVE, SUSPENDED, COMPLETED, TERMINATED"

  - name: ProviderAssignment
    parent: null
    common_fields: true
    fields:
      - name: commitment_id
        type: string
        source: input
        description: "FK -> ServiceCommitment.id; the commitment this provider covers"
        constraints: "required; ServiceCommitment must exist and be in status PLANNED or ASSIGNED"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the staff member being assigned"
        constraints: "required; Provider.status must be ACTIVE"
      - name: weekday
        type: enum
        source: input
        description: Weekday of the recurring service block
        constraints: "required; one of MON, TUE, WED, THU, FRI; must be a member of the program's instructional_weekdays"
      - name: start_time
        type: string
        source: input
        description: Block start, local school time
        constraints: "required; HH:MM 24-hour"
      - name: end_time
        type: string
        source: input
        description: Block end, local school time; the occupied interval is HALF-OPEN [start_time, end_time)
        constraints: "required; HH:MM 24-hour; must be > start_time"
      - name: effective_from
        type: string
        source: input
        description: First date the recurring block applies (inclusive)
        constraints: "required; ISO 8601 date inside the program session window"
      - name: effective_to
        type: string
        source: input
        description: Last date the recurring block applies (inclusive)
        constraints: "required; ISO 8601 date >= effective_from and inside the program session window"
      - name: covered_weekly_minutes
        type: integer
        source: input
        description: Weekly minutes this assignment covers; charged against Provider.max_weekly_minutes
        constraints: "required; 1..3000"
      - name: covered_total_minutes
        type: integer
        source: computed
        description: "covered_weekly_minutes * (number of distinct ISO weeks in [effective_from, effective_to] that contain at least one instructional date of the program)"
        default: 0
      - name: base_cost_cents
        type: integer
        source: computed
        description: "STEP 1 of calculations.fund_charge_waterfall: provider.rate_cents_per_minute * covered_total_minutes"
        default: 0
      - name: indirect_cost_cents
        type: integer
        source: computed
        description: "STEP 3 of calculations.fund_charge_waterfall: round_half_up(base_cost_cents * INDIRECT_RATE_BY_SOURCE[charged_fund_source])"
        default: 0
      - name: total_charge_cents
        type: integer
        source: computed
        description: "base_cost_cents + indirect_cost_cents; the exact amount added to and later released from FundAllocation.encumbered_amount_cents"
        default: 0
      - name: charged_fund_source
        type: enum
        source: computed
        description: fund_source of the FundAllocation selected by the STEP 2 waterfall
        default: null
        constraints: "one of IDEA_611_FEDERAL, IDEA_619_FEDERAL, LOCAL_GENERAL"
      - name: charged_budget_code
        type: string
        source: computed
        description: "budget_code of the FundAllocation selected by the STEP 2 waterfall; (program_id, budget_code) is unique so this pair resolves the allocation for audit"
        default: null
      - name: status
        type: enum
        source: system
        description: Assignment lifecycle state
        default: "ACTIVE"
        constraints: "one of ACTIVE, RELEASED, SUPERSEDED"
      - name: release_reason
        type: string
        source: system
        description: Reason recorded when the assignment left ACTIVE
        default: null

  - name: TransportationRun
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> EsyProgram.id; the program whose shortened calendar this run serves"
        constraints: "required; EsyProgram must exist and status must be PLANNING or STAFFING_LOCKED or OPEN"
      - name: route_code
        type: string
        source: input
        description: Route/vehicle identifier; the resource whose occupancy the overlap and turnaround rules protect
        constraints: "required; 1..12 chars"
      - name: service_date
        type: string
        source: input
        description: Instructional date the run operates on
        constraints: "required; ISO 8601 date; must be an instructional date of the program"
      - name: window_start_time
        type: string
        source: input
        description: Start of the run window; the occupied interval is CLOSED [window_start_time, window_end_time]
        constraints: "required; HH:MM 24-hour"
      - name: window_end_time
        type: string
        source: input
        description: End of the run window (inclusive)
        constraints: "required; HH:MM 24-hour; must be > window_start_time"
      - name: vehicle_capacity_seats
        type: integer
        source: input
        description: Wheelchair-adjusted seat count for the assigned vehicle
        constraints: "required; 1..40"
      - name: seats_committed
        type: integer
        source: computed
        description: "Count of ServiceCommitment rows with transportation_run_id == this run and status IN {PLANNED, ASSIGNED, ACTIVE, SUSPENDED}; COMPLETED and TERMINATED commitments release their seat"
        default: 0
      - name: status
        type: enum
        source: system
        description: Run state
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, CANCELLED"

  - name: ServiceLog
    parent: null
    common_fields: true
    fields:
      - name: commitment_id
        type: string
        source: input
        description: "FK -> ServiceCommitment.id; the commitment this session belonged to"
        constraints: "required; ServiceCommitment must exist"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; nullable; null on system-generated day-cancellation logs"
        default: null
      - name: service_date
        type: string
        source: input
        description: Date the session was scheduled for
        constraints: "required; ISO 8601 date; must be an instructional date of the commitment's program"
      - name: outcome
        type: enum
        source: input
        description: What actually happened; only MISSED_DISTRICT and PARTIAL create district liability
        constraints: "required; one of DELIVERED, PARTIAL, MISSED_DISTRICT, MISSED_PARENT, MISSED_STUDENT_ABSENT"
      - name: minutes_scheduled
        type: integer
        source: input
        description: Minutes the student was scheduled to receive that day
        constraints: "required; 1..480"
      - name: minutes_delivered
        type: integer
        source: input
        description: Minutes actually delivered
        constraints: "required; 0..480; must be <= minutes_scheduled; must equal minutes_scheduled when outcome == DELIVERED; must be 0 when outcome starts with MISSED_"
      - name: miss_reason_code
        type: enum
        source: input
        description: Reason code required whenever outcome != DELIVERED
        default: null
        constraints: "one of WEATHER, STAFF_ABSENCE, TRANSPORT_FAILURE, PARENT_CANCELLED, STUDENT_ILL, OTHER"
      - name: status
        type: enum
        source: system
        description: Only VERIFIED rows enter the minute ledgers and the compensatory award input set
        default: "VERIFIED"
        constraints: "one of VERIFIED, VOIDED"
      - name: generated_by
        type: enum
        source: system
        description: Provenance of the row
        default: "PROVIDER"
        constraints: "one of PROVIDER, CASE_MANAGER, SYSTEM_DAY_CANCELLATION"
      - name: void_reason
        type: string
        source: system
        description: Reason recorded by the compliance void action
        default: null

  - name: CompensatoryAward
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student owed compensatory education"
        constraints: "required; Student must exist"
      - name: source_program_id
        type: string
        source: input
        description: "FK -> EsyProgram.id; the program whose VERIFIED ServiceLog rows form the award input set and whose FundAllocation rows are charged"
        constraints: "required; EsyProgram must exist"
      - name: calculation_variant
        type: enum
        source: input
        description: Selects which variant of calculations.compensatory_award_minutes runs
        constraints: "required; one of MINUTE_FOR_MINUTE, QUALITATIVE_BENEFIT"
      - name: computed_minutes
        type: integer
        source: computed
        description: Output of calculations.compensatory_award_minutes; recomputed on create and on every propose
        default: 0
      - name: proposed_minutes
        type: integer
        source: system
        description: Minutes the district most recently offered the parent
        default: null
      - name: agreed_minutes
        type: integer
        source: system
        description: Minutes finally owed; written when negotiation_status becomes AGREED (parent acceptance or director resolution)
        default: null
      - name: delivered_minutes
        type: integer
        source: computed
        description: "See calculations.award_delivery_ledger: sum of minutes_delivered over MakeupSession rows of this award with status == DELIVERED"
        default: 0
      - name: scheduled_minutes
        type: integer
        source: computed
        description: "See calculations.award_delivery_ledger: sum of minutes_planned over MakeupSession rows of this award with status == SCHEDULED"
        default: 0
      - name: remaining_owed_minutes
        type: integer
        source: computed
        description: "See calculations.award_delivery_ledger: max(0, coalesce(agreed_minutes, 0) - delivered_minutes - forfeited_minutes)"
        default: 0
      - name: forfeited_minutes
        type: integer
        source: computed
        description: "Minutes written off by the parent-no-show forfeiture rule once parent_no_show_count reaches MAX_PARENT_NO_SHOWS"
        default: 0
      - name: negotiation_status
        type: enum
        source: system
        description: Dimension 1 of the parallel state machine - the parent-agreement / dispute-resolution axis
        default: "DRAFT"
        constraints: "one of DRAFT, PARENT_REVIEW, AGREED, DISPUTED, MEDIATION, DECLINED, CLOSED"
      - name: delivery_status
        type: enum
        source: system
        description: Dimension 2 of the parallel state machine - the makeup-delivery axis; evolves independently of negotiation_status
        default: "NOT_STARTED"
        constraints: "one of NOT_STARTED, SCHEDULING, IN_PROGRESS, FULFILLED, LAPSED"
      - name: dispute_round_count
        type: integer
        source: computed
        description: Number of parent DISPUTE responses recorded; at MAX_DISPUTE_ROUNDS the next dispute escalates straight to MEDIATION
        default: 0
      - name: parent_no_show_count
        type: integer
        source: computed
        description: Count of MakeupSession rows of this award with status == NO_SHOW_PARENT
        default: 0
      - name: delivery_deadline_date
        type: string
        source: system
        description: Last date makeup minutes may be delivered; set to clock_date + DELIVERY_WINDOW_DAYS when negotiation_status becomes AGREED, extended by DEADLINE_EXTENSION_DAYS on each CANCELLED_DISTRICT session
        default: null
      - name: severity_factor
        type: number
        source: computed
        description: Multiplier selected from max_regression_pct of the student's FINALIZED EligibilityDetermination; only the QUALITATIVE_BENEFIT variant applies it
        default: 1.0
      - name: verified_missed_log_count
        type: integer
        source: computed
        description: Count of ServiceLog rows that entered the award input set
        default: 0
      - name: excluded_log_count
        type: integer
        source: computed
        description: Count of ServiceLog rows of the same student and program that were excluded from the input set (VOIDED, DELIVERED, MISSED_PARENT, MISSED_STUDENT_ABSENT)
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the CaseManager whose most recent propose call set proposed_minutes; the segregation-of-duties check on resolve-dispute compares against it
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the SpedDirector who resolved the dispute
        default: null

  - name: MakeupSession
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: "FK -> CompensatoryAward.id; the award these minutes pay down"
        constraints: "required; award negotiation_status must be AGREED"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider who will deliver the makeup minutes"
        constraints: "required; Provider.status must be ACTIVE"
      - name: supersedes_session_id
        type: string
        source: input
        description: "FK -> MakeupSession.id; nullable; the SCHEDULED session this one replaces. When present, that session moves to SUPERSEDED and its minutes_planned return to the schedulable pool"
        default: null
      - name: session_date
        type: string
        source: input
        description: Date the makeup session is booked for
        constraints: "required; ISO 8601 date; must be >= the current logical clock date and <= award.delivery_deadline_date"
      - name: start_time
        type: string
        source: input
        description: Session start; the occupied interval is HALF-OPEN [start_time, end_time) on session_date
        constraints: "required; HH:MM 24-hour"
      - name: end_time
        type: string
        source: input
        description: Session end
        constraints: "required; HH:MM 24-hour; must be > start_time"
      - name: minutes_planned
        type: integer
        source: input
        description: Minutes this session is scheduled to deliver
        constraints: "required; 1..480"
      - name: minutes_delivered
        type: integer
        source: system
        description: Minutes credited when the outcome was logged DELIVERED
        default: 0
      - name: status
        type: enum
        source: system
        description: Branching session outcome state
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, DELIVERED, NO_SHOW_PARENT, CANCELLED_DISTRICT, SUPERSEDED, VOIDED"
      - name: charge_cents
        type: integer
        source: computed
        description: "Amount expended for this session when DELIVERED: base = provider.rate_cents_per_minute * minutes_delivered, plus the selected fund's indirect rate, per calculations.fund_charge_waterfall"
        default: 0
      - name: charged_fund_source
        type: enum
        source: computed
        description: fund_source of the FundAllocation the delivered session was expended against
        default: null
        constraints: "one of IDEA_611_FEDERAL, IDEA_619_FEDERAL, LOCAL_GENERAL"
      - name: charged_budget_code
        type: string
        source: computed
        description: budget_code of the FundAllocation the delivered session was expended against
        default: null
      - name: outcome_note
        type: string
        source: system
        description: Note recorded with the outcome log
        default: null

  - name: FundAllocation
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> EsyProgram.id; the program whose charges draw on this allocation"
        constraints: "required; EsyProgram must exist"
      - name: fund_source
        type: enum
        source: input
        description: Funding stream; also fixes the waterfall priority and the indirect-cost rate
        constraints: "required; one of IDEA_611_FEDERAL, IDEA_619_FEDERAL, LOCAL_GENERAL"
      - name: budget_code
        type: string
        source: input
        description: District budget string charges are coded to
        constraints: "required; 1..24 chars; unique per (program_id, budget_code)"
      - name: authorized_amount_cents
        type: integer
        source: input
        description: Board-authorized ceiling for this allocation
        constraints: "required; 1..100000000"
      - name: encumbered_amount_cents
        type: integer
        source: computed
        description: "Sum of total_charge_cents over ProviderAssignment rows charged to this allocation with status == ACTIVE"
        default: 0
      - name: expended_amount_cents
        type: integer
        source: computed
        description: "Sum of charge_cents over MakeupSession rows charged to this allocation with status == DELIVERED"
        default: 0
      - name: compensatory_expended_cents
        type: integer
        source: computed
        description: "Portion of expended_amount_cents that came from compensatory makeup delivery; the quantity the supplement-not-supplant cap constrains"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "authorized_amount_cents - encumbered_amount_cents - expended_amount_cents; the conserved quantity of the fund_encumbrance_conservation invariant"
        default: 0
      - name: status
        type: enum
        source: system
        description: Allocation state; only OPEN allocations may be selected by the waterfall
        default: "OPEN"
        constraints: "one of OPEN, FROZEN, CLOSED"

  - name: DueProcessRecord
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student the filing concerns"
        constraints: "required; Student must exist"
      - name: record_type
        type: enum
        source: input
        description: "Filing type. COMPLAINT and DUE_PROCESS_HEARING assert stay-put and freeze service reductions and dispute arbitration; MEDIATION_AGREEMENT does not"
        constraints: "required; one of COMPLAINT, DUE_PROCESS_HEARING, MEDIATION_AGREEMENT"
      - name: filed_on
        type: string
        source: input
        description: Date the filing was received
        constraints: "required; ISO 8601 date"
      - name: allegation_summary
        type: string
        source: input
        description: Narrative of the allegation or the mediated agreement, carried into the due-process packet
        constraints: "required; 1..500 chars"
      - name: status
        type: enum
        source: system
        description: Investigation state
        default: "OPEN"
        constraints: "one of OPEN, RESOLVED, DISMISSED"
      - name: stay_put_active
        type: boolean
        source: computed
        description: "True iff status == OPEN AND record_type IN {COMPLAINT, DUE_PROCESS_HEARING}"
        default: false
      - name: resolution_note
        type: string
        source: system
        description: Note recorded when the record left OPEN
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant the record left OPEN, ISO 8601 UTC with three fractional digits
        default: null

state_machines:
  - entity: EligibilityDetermination
    initial_state: DRAFT
    terminal_states: [FINALIZED, WITHDRAWN]
    shape: "branching with revert (PARENT_REVIEW -> DRAFT objection cycle)"
    transitions:
      - from: DRAFT
        to: PARENT_REVIEW
        trigger: "POST /esy/eligibility-determinations/{determination_id}/analyze"
        actor: CaseManager
        preconditions:
          - "status == DRAFT"
          - "len(skill_probes) >= MIN_PROBE_DOMAINS (2), else ERR_INSUFFICIENT_PROBE_DATA"
          - "every probe has pre_break_mastery_pct > 0, else ERR_INVALID_REQUEST"
        side_effects:
          - "runs calculations.regression_recoupment_analysis under the row's analysis_variant"
          - "writes max_regression_pct, max_recoupment_days, criteria_met_count, data_sufficiency, eligibility_recommendation"
          - "writes analyzed_by_user_id = X-User-ID of the caller"
          - "increments EligibilityDetermination.version by 1"
      - from: PARENT_REVIEW
        to: PARENT_AGREED
        trigger: "POST /esy/eligibility-determinations/{determination_id}/parent-response with response == AGREE"
        actor: ParentGuardian
        preconditions:
          - "status == PARENT_REVIEW"
          - "X-User-ID == determination.student_id, else ERR_NOT_STUDENT_GUARDIAN"
        side_effects:
          - "writes parent_comment"
          - "increments EligibilityDetermination.version by 1"
      - from: PARENT_REVIEW
        to: DRAFT
        trigger: "POST /esy/eligibility-determinations/{determination_id}/parent-response with response == OBJECT"
        actor: ParentGuardian
        preconditions:
          - "status == PARENT_REVIEW"
          - "X-User-ID == determination.student_id, else ERR_NOT_STUDENT_GUARDIAN"
        side_effects:
          - "objection_round_count += 1"
          - "clears analyzed_by_user_id to null so the next analyze call re-establishes authorship"
          - "increments EligibilityDetermination.version by 1"
        note: "The objection cycle: the team may re-run analyze (optionally after amending skill_probes) and send the determination back to PARENT_REVIEW."
      - from: PARENT_REVIEW
        to: WITHDRAWN
        trigger: "POST /esy/eligibility-determinations/{determination_id}/parent-response with response == WITHDRAW"
        actor: ParentGuardian
        preconditions:
          - "status == PARENT_REVIEW"
          - "X-User-ID == determination.student_id, else ERR_NOT_STUDENT_GUARDIAN"
        side_effects:
          - "Student.esy_eligibility_status is left untouched"
          - "increments EligibilityDetermination.version by 1"
      - from: PARENT_AGREED
        to: FINALIZED
        trigger: "POST /esy/eligibility-determinations/{determination_id}/finalize"
        actor: SpedDirector
        preconditions:
          - "status == PARENT_AGREED"
          - "X-User-ID != determination.analyzed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "writes finalized_by_user_id = X-User-ID of the caller"
          - "cross-entity: Student.esy_eligibility_status = determination.eligibility_recommendation"
          - "increments Student.version by 1 and refreshes Student.updated_at"
          - "increments EligibilityDetermination.version by 1"

  - entity: EsyProgram
    initial_state: PLANNING
    terminal_states: [CLOSED]
    shape: "linear with one OPEN -> OPEN self transition (day cancellation)"
    transitions:
      - from: PLANNING
        to: STAFFING_LOCKED
        trigger: "POST /esy/programs/{program_id}/status with target_status == STAFFING_LOCKED"
        actor: ProgramCoordinator
        preconditions:
          - "status == PLANNING"
          - "at least one ServiceCommitment with program_id == this program exists in status ASSIGNED, else ERR_INVALID_STATE"
        side_effects:
          - "further POST /esy/service-commitments for this program are rejected with ERR_INVALID_STATE"
          - "increments EsyProgram.version by 1"
      - from: STAFFING_LOCKED
        to: OPEN
        trigger: "POST /esy/programs/{program_id}/status with target_status == OPEN"
        actor: ProgramCoordinator
        preconditions:
          - "status == STAFFING_LOCKED"
          - "every ServiceCommitment of this program with status IN {PLANNED, ASSIGNED} is in status ASSIGNED (i.e. has at least one ACTIVE ProviderAssignment), else ERR_INVALID_STATE"
        side_effects:
          - "increments EsyProgram.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /esy/programs/{program_id}/cancel-day"
        actor: ProgramCoordinator
        preconditions:
          - "status == OPEN"
          - "service_date is an instructional date of this program, else ERR_NOT_INSTRUCTIONAL_DATE"
        side_effects:
          - "cancelled_dates += service_date; instructional_days_count and instructional_week_count recomputed"
          - "CASCADE LINK 1 (EsyProgram -> ServiceLog): for every ServiceCommitment of this program with status == ACTIVE, a ServiceLog is created with service_date, outcome MISSED_DISTRICT, minutes_scheduled = commitment.daily_minutes, minutes_delivered = 0, miss_reason_code = the request's cancellation_reason, status VERIFIED, generated_by SYSTEM_DAY_CANCELLATION, provider_id null. Commitments in PLANNED, ASSIGNED, SUSPENDED, COMPLETED or TERMINATED are skipped (conditional cascade)"
          - "CASCADE LINK 2 (ServiceLog -> ServiceCommitment): each new ServiceLog row re-runs calculations.commitment_minutes_ledger on its commitment, raising compensable_owed_minutes by minutes_scheduled and bumping ServiceCommitment.version by 1"
          - "CASCADE LINK 3 (ServiceCommitment -> Student): each commitment whose compensable_owed_minutes changed re-runs calculations.student_minutes_ledger, raising Student.pending_award_minutes and bumping Student.version by 1"
          - "CASCADE LINK 4 (Student threshold): when the recomputed Student.pending_award_minutes >= AUTO_AWARD_THRESHOLD_MINUTES (60), Student.esy_service_alert flips to true"
          - "FAN-OUT (not part of the cascade chain): every TransportationRun of this program with service_date == the cancelled date and status == SCHEDULED moves to CANCELLED"
          - "planned_total_minutes, weekly_minutes_committed and daily_minutes on existing ServiceCommitment rows are NOT recomputed"
          - "increments EsyProgram.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /esy/programs/{program_id}/status with target_status == CLOSED"
        actor: ProgramCoordinator
        preconditions:
          - "status == OPEN"
        side_effects:
          - "every ServiceCommitment of this program with status IN {ACTIVE, SUSPENDED} moves to COMPLETED (cascade down, conditional: PLANNED and ASSIGNED rows move to TERMINATED)"
          - "each commitment leaving {PLANNED, ASSIGNED, ACTIVE, SUSPENDED} releases its transportation seat, so TransportationRun.seats_committed is recomputed"
          - "every ACTIVE ProviderAssignment of those commitments moves to RELEASED with release_reason 'PROGRAM_CLOSED', which releases its total_charge_cents from FundAllocation.encumbered_amount_cents"
          - "increments EsyProgram.version by 1"
      - from: PLANNING
        to: CLOSED
        trigger: "POST /esy/programs/{program_id}/status with target_status == CLOSED"
        actor: ProgramCoordinator
        preconditions:
          - "status == PLANNING"
        side_effects:
          - "every ServiceCommitment of this program moves to TERMINATED"
          - "increments EsyProgram.version by 1"

  - entity: ServiceCommitment
    initial_state: PLANNED
    terminal_states: [COMPLETED, TERMINATED]
    shape: "cyclic (ACTIVE -> SUSPENDED -> ACTIVE)"
    transitions:
      - from: PLANNED
        to: ASSIGNED
        trigger: "system: first ProviderAssignment for this commitment reaches status ACTIVE (POST /esy/provider-assignments)"
        actor: system
        preconditions:
          - "status == PLANNED"
        side_effects:
          - "increments ServiceCommitment.version by 1 (this is the bump that makes a second create carrying the stale expected_commitment_version fail)"
      - from: ASSIGNED
        to: ACTIVE
        trigger: "POST /esy/service-commitments/{commitment_id}/status with target_status == ACTIVE"
        actor: ProgramCoordinator
        preconditions:
          - "status == ASSIGNED"
          - "cross-entity: the commitment's EsyProgram.status == OPEN, else ERR_INVALID_STATE"
        side_effects:
          - "the commitment becomes eligible for system day-cancellation ServiceLog rows"
          - "increments ServiceCommitment.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /esy/service-commitments/{commitment_id}/status with target_status == SUSPENDED"
        actor: ProgramCoordinator | ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
          - "cross-entity: Student.stay_put_active == false, else ERR_STAY_PUT_BLOCKED"
        side_effects:
          - "the commitment stops receiving system day-cancellation ServiceLog rows"
          - "the transportation seat is retained (seats_committed unchanged)"
          - "increments ServiceCommitment.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /esy/service-commitments/{commitment_id}/status with target_status == ACTIVE"
        actor: ProgramCoordinator
        preconditions:
          - "status == SUSPENDED"
          - "cross-entity: the commitment's EsyProgram.status == OPEN, else ERR_INVALID_STATE"
        side_effects:
          - "increments ServiceCommitment.version by 1"
        note: "Completes the ACTIVE -> SUSPENDED -> ACTIVE cycle; the same status endpoint drives both directions."
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: POST /esy/programs/{program_id}/status with target_status == CLOSED"
        actor: system
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "releases the transportation seat: TransportationRun.seats_committed recomputed"
          - "increments ServiceCommitment.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /esy/service-commitments/{commitment_id}/status with target_status == TERMINATED"
        actor: ProgramCoordinator | ComplianceOfficer
        preconditions:
          - "status IN {PLANNED, ASSIGNED, ACTIVE, SUSPENDED}"
          - "cross-entity: Student.stay_put_active == false, else ERR_STAY_PUT_BLOCKED"
        side_effects:
          - "CASCADE LINK 1 (ServiceCommitment -> ProviderAssignment): every ACTIVE ProviderAssignment of this commitment moves to RELEASED with release_reason 'COMMITMENT_TERMINATED'"
          - "CASCADE LINK 2 (ProviderAssignment -> FundAllocation): each released assignment subtracts exactly its total_charge_cents from the charged allocation's encumbered_amount_cents, so available_cents rises by the same amount"
          - "CASCADE LINK 3 (ProviderAssignment -> Provider): each released assignment subtracts its covered_weekly_minutes from Provider.assigned_weekly_minutes"
          - "releases the transportation seat: TransportationRun.seats_committed recomputed"
          - "increments ServiceCommitment.version by 1"

  - entity: ProviderAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED, SUPERSEDED]
    shape: "linear with compensation"
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /esy/provider-assignments/{assignment_id}/release"
        actor: ProgramCoordinator
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "COMPENSATION: FundAllocation.encumbered_amount_cents -= assignment.total_charge_cents on the allocation identified by (charged_fund_source, charged_budget_code); available_cents returns to its pre-assignment value"
          - "Provider.assigned_weekly_minutes -= covered_weekly_minutes"
          - "if no ACTIVE ProviderAssignment remains on the commitment and commitment.status == ASSIGNED, the commitment reverts to PLANNED"
          - "increments ProviderAssignment.version by 1 and ServiceCommitment.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a new ProviderAssignment is created for the same commitment_id and the same service line"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "same three compensating effects as RELEASED, with release_reason 'SUPERSEDED_BY_NEW_ASSIGNMENT'"
          - "increments ProviderAssignment.version by 1"
        note: "This legitimate supersede is exactly why POST /esy/provider-assignments needs OCC on ServiceCommitment.version - see concurrency_rules.assignment-create-stale-commitment."

  - entity: TransportationRun
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    shape: linear
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: POST /esy/programs/{program_id}/cancel-day cancels this run's service_date"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "run.service_date == the cancelled date"
        side_effects:
          - "seats_committed is frozen at its current value; ServiceCommitment.transportation_run_id references are left in place for audit"
          - "increments TransportationRun.version by 1"

  - entity: ServiceLog
    initial_state: VERIFIED
    terminal_states: [VOIDED]
    shape: "linear with compensation"
    transitions:
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /esy/service-logs/{log_id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "status == VERIFIED"
        side_effects:
          - "COMPENSATION: the row leaves every ledger input set, so calculations.commitment_minutes_ledger re-runs and ServiceCommitment.delivered_minutes / compensable_owed_minutes return to their pre-log values"
          - "calculations.student_minutes_ledger re-runs, so Student.pending_award_minutes and Student.esy_service_alert return to their pre-log values"
          - "increments ServiceLog.version by 1, ServiceCommitment.version by 1 and Student.version by 1"

  - entity: CompensatoryAward
    dimension: negotiation_status
    initial_state: DRAFT
    terminal_states: [DECLINED, CLOSED]
    shape: "cyclic (PARENT_REVIEW -> DISPUTED -> PARENT_REVIEW revision rounds) with a threshold escalation to MEDIATION"
    note: "Dimension 1 of 2 parallel dimensions on the same row; delivery_status evolves independently and neither dimension's transitions gate the other's except where explicitly stated."
    transitions:
      - from: DRAFT
        to: PARENT_REVIEW
        trigger: "POST /esy/compensatory-awards/{award_id}/propose"
        actor: CaseManager
        preconditions:
          - "negotiation_status == DRAFT"
          - "proposed_minutes IN [computed_minutes, floor(computed_minutes * MAX_PROPOSAL_MULTIPLE)], else ERR_PROPOSAL_OUT_OF_RANGE"
        side_effects:
          - "re-runs calculations.compensatory_award_minutes and rewrites computed_minutes, severity_factor, verified_missed_log_count, excluded_log_count before the range check"
          - "writes proposed_minutes and authored_by_user_id = X-User-ID of the caller"
          - "increments CompensatoryAward.version by 1"
      - from: PARENT_REVIEW
        to: AGREED
        trigger: "POST /esy/compensatory-awards/{award_id}/parent-response with response == AGREE"
        actor: ParentGuardian
        preconditions:
          - "negotiation_status == PARENT_REVIEW"
          - "X-User-ID == award.student_id, else ERR_NOT_STUDENT_GUARDIAN"
        side_effects:
          - "agreed_minutes = proposed_minutes"
          - "delivery_deadline_date = date(current logical clock) + DELIVERY_WINDOW_DAYS (180)"
          - "cross-entity: Student.outstanding_owed_minutes recomputed by calculations.student_minutes_ledger; Student.version += 1"
          - "increments CompensatoryAward.version by 1"
      - from: PARENT_REVIEW
        to: DISPUTED
        trigger: "POST /esy/compensatory-awards/{award_id}/parent-response with response == DISPUTE"
        actor: ParentGuardian
        preconditions:
          - "negotiation_status == PARENT_REVIEW"
          - "X-User-ID == award.student_id, else ERR_NOT_STUDENT_GUARDIAN"
          - "dispute_round_count + 1 < MAX_DISPUTE_ROUNDS (2)"
        side_effects:
          - "dispute_round_count += 1"
          - "increments CompensatoryAward.version by 1"
      - from: PARENT_REVIEW
        to: MEDIATION
        trigger: "POST /esy/compensatory-awards/{award_id}/parent-response with response == DISPUTE"
        actor: ParentGuardian
        preconditions:
          - "negotiation_status == PARENT_REVIEW"
          - "X-User-ID == award.student_id, else ERR_NOT_STUDENT_GUARDIAN"
          - "dispute_round_count + 1 >= MAX_DISPUTE_ROUNDS (2) - threshold escalation"
        side_effects:
          - "dispute_round_count += 1"
          - "increments CompensatoryAward.version by 1"
        note: "Rate/threshold trigger: the SAME request body produces DISPUTED on the first dispute and MEDIATION on the second."
      - from: DISPUTED
        to: PARENT_REVIEW
        trigger: "POST /esy/compensatory-awards/{award_id}/propose"
        actor: CaseManager
        preconditions:
          - "negotiation_status == DISPUTED"
          - "proposed_minutes IN [computed_minutes, floor(computed_minutes * MAX_PROPOSAL_MULTIPLE)], else ERR_PROPOSAL_OUT_OF_RANGE"
        side_effects:
          - "rewrites proposed_minutes and authored_by_user_id = X-User-ID of the caller"
          - "increments CompensatoryAward.version by 1"
        note: "Closes the negotiation cycle: propose -> parent DISPUTE -> propose again."
      - from: PARENT_REVIEW
        to: DECLINED
        trigger: "POST /esy/compensatory-awards/{award_id}/parent-response with response == DECLINE"
        actor: ParentGuardian
        preconditions:
          - "negotiation_status == PARENT_REVIEW"
          - "X-User-ID == award.student_id, else ERR_NOT_STUDENT_GUARDIAN"
        side_effects:
          - "agreed_minutes stays null; no minutes ever enter Student.outstanding_owed_minutes"
          - "increments CompensatoryAward.version by 1"
      - from: DISPUTED
        to: AGREED
        trigger: "POST /esy/compensatory-awards/{award_id}/resolve-dispute"
        actor: SpedDirector
        preconditions:
          - "negotiation_status IN {DISPUTED, MEDIATION}"
          - "X-User-ID != award.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "arbitrated_minutes IN [computed_minutes, floor(computed_minutes * MAX_PROPOSAL_MULTIPLE)], else ERR_PROPOSAL_OUT_OF_RANGE"
          - "cross-entity: Student.stay_put_active == false, else ERR_STAY_PUT_BLOCKED"
        side_effects:
          - "agreed_minutes = arbitrated_minutes; resolved_by_user_id = X-User-ID of the caller"
          - "delivery_deadline_date = date(current logical clock) + DELIVERY_WINDOW_DAYS (180)"
          - "cross-entity: Student.outstanding_owed_minutes recomputed; Student.version += 1"
          - "increments CompensatoryAward.version by 1"
      - from: MEDIATION
        to: AGREED
        trigger: "POST /esy/compensatory-awards/{award_id}/resolve-dispute"
        actor: SpedDirector
        preconditions:
          - "negotiation_status == MEDIATION"
          - "X-User-ID != award.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "arbitrated_minutes IN [computed_minutes, floor(computed_minutes * MAX_PROPOSAL_MULTIPLE)], else ERR_PROPOSAL_OUT_OF_RANGE"
          - "cross-entity: Student.stay_put_active == false, else ERR_STAY_PUT_BLOCKED"
        side_effects:
          - "same effects as DISPUTED -> AGREED; resolution_mode ARBITRATION is recorded in resolved_by_user_id's audit trail"
          - "increments CompensatoryAward.version by 1"
      - from: AGREED
        to: CLOSED
        trigger: "system: delivery_status reaches FULFILLED or LAPSED"
        actor: system
        preconditions:
          - "negotiation_status == AGREED"
          - "delivery_status IN {FULFILLED, LAPSED}"
        side_effects:
          - "the award stops accepting new MakeupSession rows (ERR_INVALID_STATE)"
          - "cross-entity: Student.outstanding_owed_minutes recomputed (CLOSED awards still contribute remaining_owed_minutes, which is 0 for FULFILLED and > 0 for LAPSED)"
          - "increments CompensatoryAward.version by 1"

  - entity: CompensatoryAward
    dimension: delivery_status
    initial_state: NOT_STARTED
    terminal_states: [LAPSED]
    shape: "parallel dimension with a FULFILLED -> IN_PROGRESS cycle on void"
    note: "Dimension 2 of 2. Driven entirely by MakeupSession outcomes and the logical clock; runs on the same row as negotiation_status."
    transitions:
      - from: NOT_STARTED
        to: SCHEDULING
        trigger: "system: first MakeupSession created for this award (POST /esy/makeup-sessions)"
        actor: system
        preconditions:
          - "delivery_status == NOT_STARTED"
          - "negotiation_status == AGREED"
        side_effects:
          - "scheduled_minutes recomputed by calculations.award_delivery_ledger"
          - "increments CompensatoryAward.version by 1"
      - from: SCHEDULING
        to: IN_PROGRESS
        trigger: "system: first MakeupSession of this award reaches status DELIVERED"
        actor: system
        preconditions:
          - "delivery_status == SCHEDULING"
          - "resulting remaining_owed_minutes > 0"
        side_effects:
          - "delivered_minutes and remaining_owed_minutes recomputed"
          - "increments CompensatoryAward.version by 1"
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "system: a MakeupSession outcome brings remaining_owed_minutes to 0"
        actor: system
        preconditions:
          - "delivery_status IN {SCHEDULING, IN_PROGRESS}"
          - "remaining_owed_minutes == 0"
        side_effects:
          - "triggers the negotiation dimension AGREED -> CLOSED transition"
          - "increments CompensatoryAward.version by 1"
      - from: FULFILLED
        to: IN_PROGRESS
        trigger: "system: a DELIVERED MakeupSession of this award is voided (POST /esy/makeup-sessions/{session_id}/log-outcome with outcome == VOIDED)"
        actor: system
        preconditions:
          - "delivery_status == FULFILLED"
          - "resulting remaining_owed_minutes > 0"
        side_effects:
          - "negotiation_status returns from CLOSED to AGREED"
          - "increments CompensatoryAward.version by 1"
        note: "The cycle on the delivery dimension; it is what makes the owed_minutes_conservation invariant observable."
      - from: SCHEDULING
        to: LAPSED
        trigger: "system: evaluated at the start of every request whose path or body references this award, when date(current logical clock) > delivery_deadline_date"
        actor: system
        preconditions:
          - "delivery_status IN {SCHEDULING, IN_PROGRESS}"
          - "remaining_owed_minutes > 0"
          - "date(current logical clock) > delivery_deadline_date"
        side_effects:
          - "every SCHEDULED MakeupSession of this award stays SCHEDULED but new sessions are rejected with ERR_MAKEUP_OUTSIDE_WINDOW"
          - "triggers the negotiation dimension AGREED -> CLOSED transition"
          - "increments CompensatoryAward.version by 1"

  - entity: MakeupSession
    initial_state: SCHEDULED
    terminal_states: [NO_SHOW_PARENT, CANCELLED_DISTRICT, SUPERSEDED, VOIDED]
    shape: "branching fork (SCHEDULED -> {DELIVERED, NO_SHOW_PARENT, CANCELLED_DISTRICT}) with divergent side-effect sets per branch"
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /esy/makeup-sessions/{session_id}/log-outcome with outcome == DELIVERED"
        actor: RelatedServiceProvider
        preconditions:
          - "status == SCHEDULED"
          - "X-User-ID == session.provider_id, else ERR_NOT_ASSIGNED_PROVIDER"
          - "minutes_delivered supplied and IN [1, minutes_planned], else ERR_INVALID_REQUEST"
          - "cross-entity: award.negotiation_status IN {AGREED, CLOSED} and award.delivery_status != LAPSED, else ERR_INVALID_STATE"
        side_effects:
          - "BRANCH-SPECIFIC: minutes_delivered credited; charge_cents / charged_fund_source / charged_budget_code written by calculations.fund_charge_waterfall and FundAllocation.expended_amount_cents and compensatory_expended_cents raised by charge_cents"
          - "CASCADE LINK 1 (MakeupSession -> CompensatoryAward): delivered_minutes, scheduled_minutes and remaining_owed_minutes recomputed; delivery_status advances"
          - "CASCADE LINK 2 (CompensatoryAward -> Student): calculations.student_minutes_ledger re-runs, lowering Student.outstanding_owed_minutes and raising Student.delivered_makeup_minutes_total; Student.version += 1"
          - "CASCADE LINK 3 (Student -> DueProcessRecord): when the recomputed Student.outstanding_owed_minutes == 0, every DueProcessRecord of that student with status == OPEN and record_type == MEDIATION_AGREEMENT moves to RESOLVED with resolution_note 'OWED_MINUTES_SATISFIED' and resolved_at = current logical clock"
          - "increments MakeupSession.version by 1"
      - from: SCHEDULED
        to: NO_SHOW_PARENT
        trigger: "POST /esy/makeup-sessions/{session_id}/log-outcome with outcome == NO_SHOW_PARENT"
        actor: RelatedServiceProvider
        preconditions:
          - "status == SCHEDULED"
          - "X-User-ID == session.provider_id, else ERR_NOT_ASSIGNED_PROVIDER"
        side_effects:
          - "BRANCH-SPECIFIC: NO minutes are credited and NO fund is charged"
          - "award.parent_no_show_count += 1"
          - "FORFEITURE THRESHOLD: when the recomputed parent_no_show_count >= MAX_PARENT_NO_SHOWS (2), award.forfeited_minutes += this session's minutes_planned, which lowers remaining_owed_minutes and Student.outstanding_owed_minutes"
          - "increments MakeupSession.version by 1 and CompensatoryAward.version by 1"
      - from: SCHEDULED
        to: CANCELLED_DISTRICT
        trigger: "POST /esy/makeup-sessions/{session_id}/log-outcome with outcome == CANCELLED_DISTRICT"
        actor: RelatedServiceProvider
        preconditions:
          - "status == SCHEDULED"
          - "X-User-ID == session.provider_id, else ERR_NOT_ASSIGNED_PROVIDER"
        side_effects:
          - "BRANCH-SPECIFIC: NO minutes are credited, NO fund is charged, and the minutes return to the schedulable pool (scheduled_minutes drops by minutes_planned so remaining_owed_minutes is unchanged)"
          - "award.delivery_deadline_date extended by DEADLINE_EXTENSION_DAYS (30)"
          - "increments MakeupSession.version by 1 and CompensatoryAward.version by 1"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system: a new MakeupSession is created with supersedes_session_id == this session id"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "minutes_planned leaves award.scheduled_minutes"
          - "increments MakeupSession.version by 1"
      - from: DELIVERED
        to: VOIDED
        trigger: "POST /esy/makeup-sessions/{session_id}/log-outcome with outcome == VOIDED"
        actor: ComplianceOfficer
        preconditions:
          - "status == DELIVERED"
        side_effects:
          - "COMPENSATION: minutes_delivered leaves award.delivered_minutes, so remaining_owed_minutes and Student.outstanding_owed_minutes return to their pre-delivery values"
          - "COMPENSATION: FundAllocation.expended_amount_cents and compensatory_expended_cents both drop by charge_cents, so available_cents returns to its pre-delivery value"
          - "delivery_status may cycle FULFILLED -> IN_PROGRESS and negotiation_status CLOSED -> AGREED"
          - "increments MakeupSession.version by 1, CompensatoryAward.version by 1 and Student.version by 1"

  - entity: FundAllocation
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: "cyclic (OPEN -> FROZEN -> OPEN)"
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "PATCH /esy/fund-allocations/{allocation_id} with status == FROZEN"
        actor: SpedDirector
        preconditions:
          - "status == OPEN"
        side_effects:
          - "the allocation is skipped by the calculations.fund_charge_waterfall candidate filter"
          - "increments FundAllocation.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "PATCH /esy/fund-allocations/{allocation_id} with status == OPEN"
        actor: SpedDirector
        preconditions:
          - "status == FROZEN"
        side_effects:
          - "the allocation re-enters the waterfall candidate set"
          - "increments FundAllocation.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /esy/fund-allocations/{allocation_id} with status == CLOSED"
        actor: SpedDirector
        preconditions:
          - "status IN {OPEN, FROZEN}"
          - "encumbered_amount_cents == 0, else ERR_INVALID_STATE"
        side_effects:
          - "increments FundAllocation.version by 1"

  - entity: DueProcessRecord
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    shape: branching
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "PATCH /esy/due-process-records/{record_id} with status == RESOLVED, or system when the student's outstanding_owed_minutes reaches 0 and record_type == MEDIATION_AGREEMENT"
        actor: ComplianceOfficer | system
        preconditions:
          - "status == OPEN"
        side_effects:
          - "stay_put_active becomes false; cross-entity: Student.stay_put_active is recomputed, unblocking ServiceCommitment SUSPENDED / TERMINATED transitions and award dispute resolution"
          - "resolved_at = current logical clock; Student.version += 1"
          - "increments DueProcessRecord.version by 1"
      - from: OPEN
        to: DISMISSED
        trigger: "PATCH /esy/due-process-records/{record_id} with status == DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN"
        side_effects:
          - "stay_put_active becomes false; Student.stay_put_active recomputed; Student.version += 1"
          - "increments DueProcessRecord.version by 1"

concurrency_rules:
  - rule_id: assignment-create-stale-commitment
    parent_entity: ServiceCommitment
    write_endpoint: "POST /esy/provider-assignments"
    occ_field: "expected_commitment_version"
    description: |
      Creating a ProviderAssignment against a ServiceCommitment whose version has
      advanced since the client last read it is rejected with a stale-version
      error. The product deliberately allows a new assignment on the same service
      line to supersede the incumbent one (ProviderAssignment ACTIVE -> SUPERSEDED),
      so a second create is perfectly legal on its own terms - which is exactly why
      the writer must prove its view of the commitment (its staffing roster, its
      PLANNED/ASSIGNED status and its pinned minute plan) is current before the
      server silently releases someone else's encumbrance.
    error_id: ERR_STALE_COMMITMENT_VERSION
    http_status: 412
  - rule_id: makeup-create-stale-award
    parent_entity: CompensatoryAward
    write_endpoint: "POST /esy/makeup-sessions"
    occ_field: "expected_award_version"
    description: |
      Scheduling a MakeupSession against a CompensatoryAward whose version has
      advanced since the client last read it is rejected with a stale-version
      error. Booking additional makeup minutes is a legal operation any scheduler
      may perform, so nothing in the state machine stops a second booking; the
      stale-version check is what stops a scheduler from over-booking against an
      obsolete remaining_owed_minutes, an obsolete delivery_deadline_date, or an
      agreed_minutes figure a director has since revised.
    error_id: ERR_STALE_AWARD_VERSION
    http_status: 412

calculations:
  - name: regression_recoupment_analysis
    trigger: "POST /esy/eligibility-determinations/{determination_id}/analyze"
    algorithm: weighted_scoring
    formula: |
      # Evaluate every probe in the pinned array order of
      # EligibilityDetermination.skill_probes (index 0 first). Array order is the
      # evaluation order; created_at is irrelevant because probes are embedded.
      regression_pct(probe) =
        round_half_up(
          (probe.pre_break_mastery_pct - probe.post_break_mastery_pct)
          * 100 / probe.pre_break_mastery_pct,
          1)                                        # 1 decimal place
      # Probes whose post_break_mastery_pct >= pre_break_mastery_pct yield 0.0.

      max_regression_pct = max(regression_pct(p) for p in skill_probes)   # 1 dp

      # --- variant-specific per-probe qualification test ---------------------
      # PROBE_BASED (observed recoupment):
      #   recoupment_days(p) = p.recoupment_days_observed
      #   qualifies(p) = regression_pct(p) >= REGRESSION_PCT_THRESHOLD
      #                  AND recoupment_days(p) >= RECOUPMENT_DAYS_THRESHOLD
      # TEAM_JUDGMENT (projected recoupment, no observation trusted):
      #   recoupment_days(p) = ceil(regression_pct(p) / RECOUPMENT_RATE_PCT_PER_DAY)
      #   qualifies(p) = regression_pct(p) >  REGRESSION_PCT_THRESHOLD
      #                  AND recoupment_days(p) >  RECOUPMENT_DAYS_THRESHOLD

      max_recoupment_days = max(recoupment_days(p) for p in skill_probes)  # integer
      criteria_met_count  = count of probes where qualifies(p)

      # --- data sufficiency --------------------------------------------------
      # PROBE_BASED requires trial evidence per probe:
      #   data_sufficiency = SUFFICIENT iff
      #     len(skill_probes) >= MIN_PROBE_DOMAINS
      #     AND every probe has trials_count >= MIN_TRIALS_PER_PROBE
      # TEAM_JUDGMENT ignores trials_count entirely:
      #   data_sufficiency = SUFFICIENT iff len(skill_probes) >= MIN_PROBE_DOMAINS

      # --- recommendation ----------------------------------------------------
      if data_sufficiency == INSUFFICIENT:
          eligibility_recommendation = PENDING_DATA
      elif max_regression_pct >= SEVERE_REGRESSION_PCT:
          eligibility_recommendation = ELIGIBLE     # severe-regression override,
                                                    # bypasses MIN_QUALIFYING_DOMAINS
      elif criteria_met_count >= MIN_QUALIFYING_DOMAINS:
          eligibility_recommendation = ELIGIBLE
      else:
          eligibility_recommendation = INELIGIBLE
    input_set: |
      Only the EligibilityDetermination.skill_probes array of the target row, in
      array order. Probes are never read from other determinations, not even other
      determinations of the same student in the same school_year.
    constants:
      REGRESSION_PCT_THRESHOLD: 25.0
      RECOUPMENT_DAYS_THRESHOLD: 20
      MIN_QUALIFYING_DOMAINS: 2
      SEVERE_REGRESSION_PCT: 45.0
      MIN_TRIALS_PER_PROBE: 3
      MIN_PROBE_DOMAINS: 2
      RECOUPMENT_RATE_PCT_PER_DAY: 1.2
    precision: "regression_pct: 1 decimal place, round_half_up. recoupment_days: integer, ceil for the projected form. Comparisons use the rounded 1-dp value, never the raw quotient."
    variants:
      - name: PROBE_BASED
        when: "EligibilityDetermination.analysis_variant == PROBE_BASED (the district collected post-break probe data)"
        difference: |
          Uses each probe's OBSERVED recoupment_days_observed, tests both criteria
          with inclusive >= comparisons, and requires trials_count >=
          MIN_TRIALS_PER_PROBE on every probe for data_sufficiency == SUFFICIENT.
      - name: TEAM_JUDGMENT
        when: "EligibilityDetermination.analysis_variant == TEAM_JUDGMENT (no post-break probe data; the IEP team projects recoupment from the regression magnitude)"
        difference: |
          Discards recoupment_days_observed and PROJECTS
          ceil(regression_pct / RECOUPMENT_RATE_PCT_PER_DAY) instead, tests both
          criteria with strict > comparisons, and ignores trials_count for
          sufficiency. Identical probe data therefore yields a different
          criteria_met_count and can flip eligibility_recommendation.

  - name: esy_service_minutes_plan
    trigger: "POST /esy/service-commitments (planned_total_minutes, weekly_minutes_committed and daily_minutes are pinned at creation)"
    algorithm: chronological
    formula: |
      # STEP 1 - build the instructional-day calendar of the commitment's program.
      instructional_dates =
        [ d for d in inclusive_date_range(program.session_start_date,
                                          program.session_end_date)
          if weekday_name(d) in program.instructional_weekdays
             and d not in program.blackout_dates
             and d not in program.cancelled_dates ]
      program.instructional_days_count = len(instructional_dates)
      # ISO weeks, i.e. Monday-anchored (year, week) buckets.
      weeks = group instructional_dates by iso_week(d), ascending
      program.instructional_week_count = len(weeks)
      if program.instructional_days_count == 0: error ERR_NO_INSTRUCTIONAL_DAYS

      # STEP 2 - per-week prorated minutes, ROUNDED PER WEEK THEN SUMMED.
      # nominal_weekday_count = len(program.instructional_weekdays)
      per_week_minutes[w] =
        round_half_up(iep_weekly_minutes * len(weeks[w]) / nominal_weekday_count, 0)
      planned_total_minutes = sum(per_week_minutes[w] for w in weeks)   # in week order
      # NOTE: rounding each week first and summing is NOT the same as summing the
      # exact per-week quotients and rounding once at the end. The per-week form is
      # normative.

      # STEP 3 - averaged commitments.
      weekly_minutes_committed = round_half_up(planned_total_minutes / len(weeks), 0)
      daily_minutes            = round_half_up(weekly_minutes_committed
                                               / nominal_weekday_count, 0)

      # STEP 4 - daily load cap (uses the maximum single-week load, not the average).
      max_daily_load = max(per_week_minutes[w] / len(weeks[w]) for w in weeks)
      if max_daily_load > program.daily_minutes_cap:
          error ERR_DAILY_MINUTES_CAP_EXCEEDED
    input_set: |
      The commitment's EsyProgram calendar fields as they read AT CREATION TIME
      (session_start_date, session_end_date, instructional_weekdays,
      blackout_dates, cancelled_dates) plus the request's iep_weekly_minutes.
      planned_total_minutes, weekly_minutes_committed and daily_minutes are pinned
      at creation and are NEVER recomputed when the program calendar later changes
      (e.g. a POST /esy/programs/{program_id}/cancel-day adds a cancelled date).
      Only program.instructional_days_count and instructional_week_count move.
    constants:
      WEEK_ANCHOR: "ISO-8601 Monday-anchored weeks"
    precision: "All minute figures are integers, round_half_up at every step. Rounding happens per week (STEP 2) before summation, and again at each averaging step."
    variants: []

  - name: compensatory_award_minutes
    trigger: "POST /esy/compensatory-awards and re-run on POST /esy/compensatory-awards/{award_id}/propose"
    algorithm: aggregation
    formula: |
      # STEP 1 - collect the district-fault deficit across the source program.
      eligible_logs =
        [ L for L in ServiceLog
          if L.status == VERIFIED
             and L.commitment.student_id == award.student_id
             and L.commitment.program_id == award.source_program_id
             and L.outcome in {MISSED_DISTRICT, PARTIAL} ]
      district_missed_minutes =
        sum(L.minutes_scheduled - L.minutes_delivered for L in eligible_logs)
      verified_missed_log_count = len(eligible_logs)
      excluded_log_count =
        count of ServiceLog rows matching the student+program that were skipped
        because status == VOIDED or outcome in {DELIVERED, MISSED_PARENT,
        MISSED_STUDENT_ABSENT}

      # STEP 2 - severity factor from the student's FINALIZED determination.
      # max_regression_pct comes from the most recent FINALIZED
      # EligibilityDetermination of this student, ordered by created_at ASC and
      # taking the last row. If there is none, severity_factor = 1.00.
      severity_factor =
          1.00 if max_regression_pct <  25.0
        else 1.25 if max_regression_pct <  45.0
        else 1.50

      # STEP 3 - variant-specific raw minutes.
      # MINUTE_FOR_MINUTE:  raw = district_missed_minutes
      # QUALITATIVE_BENEFIT: raw = district_missed_minutes * severity_factor
      #                      then rounded to the nearest MINUTE_ROUNDING_UNIT.

      # STEP 4 - clamp.
      computed_minutes = min(rounded_raw, ANNUAL_CAP_MINUTES)
      if computed_minutes < MIN_AWARDABLE_MINUTES: error ERR_NO_COMPENSABLE_MINUTES

      # helper
      round_half_up_to_multiple(x, u) = floor(x / u + 0.5) * u
    input_set: |
      VERIFIED ServiceLog rows with outcome MISSED_DISTRICT or PARTIAL belonging to
      commitments of (award.student_id, award.source_program_id). VOIDED logs and
      logs whose outcome is DELIVERED, MISSED_PARENT or MISSED_STUDENT_ABSENT are
      excluded - parent- and illness-driven misses are not compensable. Severity
      reads only the most recent FINALIZED EligibilityDetermination of the student.
    constants:
      MINUTE_ROUNDING_UNIT: 15
      ANNUAL_CAP_MINUTES: 3600
      MIN_AWARDABLE_MINUTES: 30
      SEVERITY_FACTOR_LOW: 1.00
      SEVERITY_FACTOR_MODERATE: 1.25
      SEVERITY_FACTOR_SEVERE: 1.50
      SEVERITY_MODERATE_FLOOR_PCT: 25.0
      SEVERITY_SEVERE_FLOOR_PCT: 45.0
      MAX_PROPOSAL_MULTIPLE: 1.5
    precision: "Integer minutes. MINUTE_FOR_MINUTE is exact and is NOT rounded to the 15-minute unit. QUALITATIVE_BENEFIT rounds the product to the nearest 15 with round_half_up_to_multiple, so a .5 remainder rounds up."
    variants:
      - name: MINUTE_FOR_MINUTE
        when: "CompensatoryAward.calculation_variant == MINUTE_FOR_MINUTE (the default district remedy: one owed minute per missed minute)"
        difference: |
          severity_factor is computed and stored for the audit record but is NOT
          applied, and no 15-minute rounding is applied. computed_minutes equals
          district_missed_minutes exactly (subject only to the annual cap).
      - name: QUALITATIVE_BENEFIT
        when: "CompensatoryAward.calculation_variant == QUALITATIVE_BENEFIT (the remedy is scaled by the regression severity documented at eligibility)"
        difference: |
          Multiplies district_missed_minutes by severity_factor and then rounds the
          product to the nearest MINUTE_ROUNDING_UNIT. Identical logs therefore
          yield a strictly larger award whenever severity_factor > 1.00, and the
          rounding can move the result off the raw product in either direction.

  - name: fund_charge_waterfall
    trigger: "POST /esy/provider-assignments and POST /esy/makeup-sessions/{session_id}/log-outcome with outcome == DELIVERED"
    algorithm: waterfall_allocation
    formula: |
      # The five steps run in exactly this order. No step is ever revisited.

      # STEP 1 - direct cost.
      # ProviderAssignment: chargeable_minutes = covered_total_minutes
      #   covered_total_minutes = covered_weekly_minutes
      #                           * program.instructional_week_count
      # MakeupSession:      chargeable_minutes = minutes_delivered
      base_cost_cents = provider.rate_cents_per_minute * chargeable_minutes

      # STEP 2 - bucket selection, on BASE COST ONLY.
      candidates = [ F in FundAllocation
                     where F.program_id == program.id
                       and F.status == OPEN ]
                   ordered by index_of(F.fund_source, FUND_PRIORITY) ASC,
                             then F.created_at ASC
      selected = first F in candidates with F.available_cents >= base_cost_cents
      if selected is None: error ERR_NO_FUND_WITH_CAPACITY
      # Every candidate is FROZEN or CLOSED -> ERR_FUND_FROZEN instead, when at
      # least one allocation for the program exists and none of them is OPEN.

      # STEP 3 - indirect cost, at the SELECTED source's rate.
      indirect_cost_cents =
        round_half_up(base_cost_cents * INDIRECT_RATE_BY_SOURCE[selected.fund_source], 0)
      total_charge_cents = base_cost_cents + indirect_cost_cents

      # STEP 4 - overage check. STEP 2 IS NOT RE-RUN.
      if total_charge_cents > selected.available_cents:
          error ERR_FUND_INDIRECT_OVERAGE
      # The request fails even when a lower-priority OPEN allocation could have
      # absorbed the full total_charge_cents. Selection is base-only and final.

      # STEP 5 - post.
      # ProviderAssignment: selected.encumbered_amount_cents += total_charge_cents
      # MakeupSession:      selected.expended_amount_cents    += total_charge_cents
      #                     selected.compensatory_expended_cents += total_charge_cents
      #   and for makeup sessions only, the federal supplanting cap applies FIRST:
      #   if selected.fund_source in {IDEA_611_FEDERAL, IDEA_619_FEDERAL}
      #      and selected.compensatory_expended_cents + total_charge_cents
      #          > round_half_up(selected.authorized_amount_cents
      #                          * FEDERAL_COMP_CAP_PCT, 0):
      #        error ERR_SUPPLANT_RESTRICTION
      # available_cents = authorized_amount_cents - encumbered_amount_cents
      #                                           - expended_amount_cents
    input_set: |
      FundAllocation rows of the charged EsyProgram with status == OPEN only.
      FROZEN and CLOSED allocations never enter the candidate list. The candidate
      order is the fixed FUND_PRIORITY list, with created_at ASC as the only
      tie-break within one fund_source; allocation id is never a decision input.
    constants:
      FUND_PRIORITY: [IDEA_611_FEDERAL, IDEA_619_FEDERAL, LOCAL_GENERAL]
      INDIRECT_RATE_IDEA_611_FEDERAL: 0.08
      INDIRECT_RATE_IDEA_619_FEDERAL: 0.08
      INDIRECT_RATE_LOCAL_GENERAL: 0.145
      FEDERAL_COMP_CAP_PCT: 0.25
    precision: "All money is integer cents, round_half_up on the indirect product. The indirect rate is applied to base_cost_cents only, never compounded on a prior indirect amount."
    variants: []

  - name: commitment_minutes_ledger
    trigger: "any ServiceLog create or void, and any POST /esy/programs/{program_id}/cancel-day that synthesizes logs"
    algorithm: aggregation
    formula: |
      logs = [ L for L in ServiceLog
               where L.commitment_id == commitment.id and L.status == VERIFIED ]
      delivered_minutes = sum(L.minutes_delivered for L in logs)
      compensable_owed_minutes =
        sum(L.minutes_scheduled - L.minutes_delivered for L in logs
            if L.outcome in {MISSED_DISTRICT, PARTIAL})
    input_set: "VERIFIED ServiceLog rows of the commitment only; VOIDED rows leave both sums, which is what makes the void a clean compensation."
    constants: {}
    precision: "Integer minutes; full recompute from the log set on every change, never an incremental delta."
    variants: []

  - name: award_delivery_ledger
    trigger: "any MakeupSession create, supersede, or POST /esy/makeup-sessions/{session_id}/log-outcome"
    algorithm: aggregation
    formula: |
      sessions = MakeupSession rows with award_id == award.id
      delivered_minutes = sum(S.minutes_delivered for S in sessions
                              if S.status == DELIVERED)
      scheduled_minutes = sum(S.minutes_planned for S in sessions
                              if S.status == SCHEDULED)
      # forfeited_minutes is NOT recomputed here; it is accumulated by the
      # NO_SHOW_PARENT forfeiture threshold and persists.
      remaining_owed_minutes =
        max(0, (agreed_minutes or 0) - delivered_minutes - forfeited_minutes)
      # Overbooking guard, evaluated on POST /esy/makeup-sessions:
      if scheduled_minutes + new_session.minutes_planned
         > remaining_owed_minutes:
           error ERR_OVERBOOKED_MAKEUP_MINUTES
      # A superseding session's minutes_planned is compared AFTER the superseded
      # session has left scheduled_minutes.
    input_set: |
      MakeupSession rows of the award. SUPERSEDED, VOIDED, NO_SHOW_PARENT and
      CANCELLED_DISTRICT rows contribute to neither sum; only DELIVERED rows credit
      delivered_minutes and only SCHEDULED rows hold schedulable capacity.
    constants:
      MAX_PARENT_NO_SHOWS: 2
      DELIVERY_WINDOW_DAYS: 180
      DEADLINE_EXTENSION_DAYS: 30
    precision: "Integer minutes; remaining_owed_minutes is clamped at 0 and never negative."
    variants: []

  - name: student_minutes_ledger
    trigger: "any change to a ServiceCommitment ledger, any CompensatoryAward negotiation or delivery change, and any DueProcessRecord status change"
    algorithm: aggregation
    formula: |
      pending_award_minutes =
        sum(C.compensable_owed_minutes for C in ServiceCommitment
            where C.student_id == student.id and C.status != TERMINATED)
      esy_service_alert = (pending_award_minutes >= AUTO_AWARD_THRESHOLD_MINUTES)

      outstanding_owed_minutes =
        sum(max(0, A.agreed_minutes - A.delivered_minutes - A.forfeited_minutes)
            for A in CompensatoryAward
            where A.student_id == student.id
              and A.negotiation_status in {AGREED, CLOSED})
      delivered_makeup_minutes_total =
        sum(A.delivered_minutes for A in CompensatoryAward
            where A.student_id == student.id)

      stay_put_active =
        any(R.status == OPEN for R in DueProcessRecord
            where R.student_id == student.id
              and R.record_type in {COMPLAINT, DUE_PROCESS_HEARING})
    input_set: |
      Non-TERMINATED ServiceCommitment rows for pending minutes; CompensatoryAward
      rows in negotiation_status AGREED or CLOSED for outstanding minutes (DRAFT,
      PARENT_REVIEW, DISPUTED, MEDIATION and DECLINED awards contribute nothing);
      OPEN COMPLAINT and DUE_PROCESS_HEARING records for stay-put. An OPEN
      MEDIATION_AGREEMENT record does NOT raise stay_put_active.
    constants:
      AUTO_AWARD_THRESHOLD_MINUTES: 60
    precision: "Integer minutes; every field is a full recompute over the current row sets."
    variants: []

  - name: provider_load_and_conflict
    trigger: "POST /esy/provider-assignments"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN weekly intervals: [start_time, end_time). Two ACTIVE assignments
      # of the same provider on the same weekday collide iff
      #   new.start_time < existing.end_time AND existing.start_time < new.end_time
      # so 09:00-10:00 and 10:00-11:00 do NOT collide (touching endpoints are fine),
      # and the effective_from / effective_to date ranges must also intersect on the
      # inclusive form: new.effective_from <= existing.effective_to
      #                 and existing.effective_from <= new.effective_to
      # Collision -> ERR_PROVIDER_TIME_CONFLICT.

      covered_weekly_minutes = supplied by the request
      covered_total_minutes  = covered_weekly_minutes
                               * program.instructional_week_count
      # Aggregate capacity check across all ACTIVE assignments of the provider:
      if sum(A.covered_weekly_minutes for A in ACTIVE assignments of provider)
         + covered_weekly_minutes > provider.max_weekly_minutes:
           error ERR_PROVIDER_CAPACITY_EXCEEDED
      provider.assigned_weekly_minutes = the recomputed sum after success
    input_set: "ACTIVE ProviderAssignment rows of the same provider only; RELEASED and SUPERSEDED rows neither block nor consume capacity."
    constants: {}
    precision: "Times are minute-resolution HH:MM strings compared lexicographically; integer minutes throughout."
    variants: []

  - name: transport_run_occupancy
    trigger: "POST /esy/transportation-runs and POST /esy/service-commitments carrying a transportation_run_id"
    algorithm: interval_merge
    formula: |
      # CLOSED daily intervals: [window_start_time, window_end_time]. Two SCHEDULED
      # runs of the same route_code on the same service_date collide iff
      #   new.window_start_time <= existing.window_end_time
      #   AND existing.window_start_time <= new.window_end_time
      # so 07:00-07:45 and 07:45-08:30 DO collide - a touching endpoint is a
      # conflict here, unlike ProviderAssignment's half-open windows.
      # Collision -> ERR_RUN_WINDOW_OVERLAP.
      # Otherwise, consecutive runs of the same route must leave a turnaround gap:
      #   gap_minutes = minutes_between(earlier.window_end_time,
      #                                 later.window_start_time)
      #   if 0 < gap_minutes < ROUTE_TURNAROUND_MINUTES:
      #        error ERR_ROUTE_TURNAROUND_VIOLATION

      seats_committed = count of ServiceCommitment rows with
        transportation_run_id == run.id and
        status IN {PLANNED, ASSIGNED, ACTIVE, SUSPENDED}
      # COMPLETED and TERMINATED commitments release their seat.
      if seats_committed + 1 > run.vehicle_capacity_seats:
          error ERR_RUN_CAPACITY_EXCEEDED
    input_set: "SCHEDULED TransportationRun rows of the same route_code and service_date for window checks; non-TERMINATED ServiceCommitment rows for seat occupancy (COMPLETED commitments still hold their seat for the audit record, TERMINATED ones release it)."
    constants:
      ROUTE_TURNAROUND_MINUTES: 15
    precision: "Minute-resolution HH:MM comparisons; integer seat counts."
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND that role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when X-User-Role == ParentGuardian, X-User-ID equals the student_id of the addressed EligibilityDetermination or CompensatoryAward (or the addressed Student itself)"
    error_id: ERR_NOT_STUDENT_GUARDIAN
    http_status: 403
    applies_to: "GET /esy/students/{student_id}, GET /esy/students/{id}/eligibility-determinations, GET /esy/eligibility-determinations/{determination_id}, POST /esy/eligibility-determinations/{determination_id}/parent-response, GET /esy/compensatory-awards/{award_id}, POST /esy/compensatory-awards/{award_id}/parent-response"
  - priority: 4
    category: auth
    check: "when X-User-Role == RelatedServiceProvider, X-User-ID equals the provider_id of the addressed MakeupSession or of the ServiceLog's commitment assignment"
    error_id: ERR_NOT_ASSIGNED_PROVIDER
    http_status: 403
    applies_to: "POST /esy/makeup-sessions/{session_id}/log-outcome, POST /esy/service-logs"
  - priority: 5
    category: existence
    check: "every resource id in the request path exists, validated left to right"
    error_id: "ERR_STUDENT_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_SERVICE_LOG_NOT_FOUND | ERR_AWARD_NOT_FOUND | ERR_MAKEUP_SESSION_NOT_FOUND | ERR_FUND_ALLOCATION_NOT_FOUND | ERR_DUE_PROCESS_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body exists (student_id, program_id, provider_id, commitment_id, award_id, transportation_run_id, supersedes_session_id, source_program_id)"
    error_id: "the matching *_NOT_FOUND error for the referenced entity"
    http_status: 404
    applies_to: "all write endpoints carrying a foreign key in the body"
  - priority: 7
    category: business_constraint
    check: "request body shape: all required inputs present, enum values in range, integers non-negative, dates ISO-8601 YYYY-MM-DD, times HH:MM, end strictly after start, minutes_delivered <= minutes_scheduled"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 8
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"
  - priority: 9
    category: state
    check: "the target resource is in a state from which the requested transition exists, including cross-entity state guards (EsyProgram.status == OPEN for ServiceCommitment ASSIGNED -> ACTIVE; award.negotiation_status AGREED and delivery_status != LAPSED for makeup scheduling; FundAllocation.encumbered_amount_cents == 0 for CLOSED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition and child-creation endpoints"
  - priority: 10
    category: state
    check: "expected_commitment_version / expected_award_version equals the current version of the named parent row"
    error_id: "ERR_STALE_COMMITMENT_VERSION | ERR_STALE_AWARD_VERSION"
    http_status: 412
    applies_to: "POST /esy/provider-assignments, POST /esy/makeup-sessions"
  - priority: 11
    category: business_safety
    check: "the student has no OPEN COMPLAINT or DUE_PROCESS_HEARING record (Student.stay_put_active == false) before services are suspended or terminated or a dispute is arbitrated"
    error_id: ERR_STAY_PUT_BLOCKED
    http_status: 409
    applies_to: "POST /esy/service-commitments/{commitment_id}/status with target_status IN {SUSPENDED, TERMINATED}, POST /esy/compensatory-awards/{award_id}/resolve-dispute"
  - priority: 12
    category: business_safety
    check: "the provider's credential_expires_on is on or after the last date the assignment or session covers (assignment: effective_to; makeup session: session_date)"
    error_id: ERR_PROVIDER_CREDENTIAL_EXPIRED
    http_status: 422
    applies_to: "POST /esy/provider-assignments, POST /esy/makeup-sessions"
  - priority: 13
    category: business_safety
    check: "the provider's status == ACTIVE"
    error_id: ERR_PROVIDER_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /esy/provider-assignments, POST /esy/makeup-sessions"
  - priority: 14
    category: business_referential
    check: "the provider's role_type is permitted for the commitment's service_type (SPECIALIZED_INSTRUCTION requires SPED_TEACHER or PARAEDUCATOR; SPEECH requires SLP; OT requires OT; PT requires PT; COUNSELING requires COUNSELOR)"
    error_id: ERR_PROVIDER_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /esy/provider-assignments"
  - priority: 15
    category: business_constraint
    check: "the acting user is not the same user who produced the artifact being approved (finalize vs analyzed_by_user_id, resolve-dispute vs authored_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /esy/eligibility-determinations/{determination_id}/finalize, POST /esy/compensatory-awards/{award_id}/resolve-dispute"
  - priority: 16
    category: business_temporal
    check: "no ACTIVE assignment of the same provider overlaps the requested weekday half-open window [start_time, end_time) within an intersecting effective date range"
    error_id: ERR_PROVIDER_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /esy/provider-assignments"
  - priority: 17
    category: business_temporal
    check: "no SCHEDULED run of the same route_code on the same service_date overlaps the requested closed window [window_start_time, window_end_time]"
    error_id: ERR_RUN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /esy/transportation-runs"
  - priority: 18
    category: business_temporal
    check: "consecutive non-overlapping runs of the same route_code on the same service_date leave a gap of at least ROUTE_TURNAROUND_MINUTES (15)"
    error_id: ERR_ROUTE_TURNAROUND_VIOLATION
    http_status: 422
    applies_to: "POST /esy/transportation-runs"
  - priority: 19
    category: business_temporal
    check: "the makeup session's session_date is on or before the award's delivery_deadline_date and on or after the date of the current logical clock"
    error_id: ERR_MAKEUP_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /esy/makeup-sessions"
  - priority: 20
    category: business_temporal
    check: "the transportation run's service_date and the service log's service_date are instructional dates of the program (correct weekday, not blacked out, not cancelled) and inside [session_start_date, session_end_date]"
    error_id: ERR_NOT_INSTRUCTIONAL_DATE
    http_status: 422
    applies_to: "POST /esy/transportation-runs, POST /esy/service-logs, POST /esy/programs/{program_id}/cancel-day"
  - priority: 21
    category: business_constraint
    check: "the commitment's student has Student.esy_eligibility_status == ELIGIBLE"
    error_id: ERR_STUDENT_NOT_ESY_ELIGIBLE
    http_status: 422
    applies_to: "POST /esy/service-commitments"
  - priority: 22
    category: business_constraint
    check: "the program calendar yields at least one instructional day"
    error_id: ERR_NO_INSTRUCTIONAL_DAYS
    http_status: 422
    applies_to: "POST /esy/service-commitments"
  - priority: 23
    category: business_constraint
    check: "the plan's maximum single-week daily load does not exceed the program's daily_minutes_cap"
    error_id: ERR_DAILY_MINUTES_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /esy/service-commitments"
  - priority: 24
    category: business_constraint
    check: "the determination carries at least MIN_PROBE_DOMAINS (2) skill probes"
    error_id: ERR_INSUFFICIENT_PROBE_DATA
    http_status: 422
    applies_to: "POST /esy/eligibility-determinations/{determination_id}/analyze"
  - priority: 25
    category: business_constraint
    check: "computed_minutes is at least MIN_AWARDABLE_MINUTES (30)"
    error_id: ERR_NO_COMPENSABLE_MINUTES
    http_status: 422
    applies_to: "POST /esy/compensatory-awards"
  - priority: 26
    category: business_constraint
    check: "proposed_minutes (or arbitrated_minutes) lies in [computed_minutes, floor(computed_minutes * MAX_PROPOSAL_MULTIPLE)]"
    error_id: ERR_PROPOSAL_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /esy/compensatory-awards/{award_id}/propose, POST /esy/compensatory-awards/{award_id}/resolve-dispute"
  - priority: 27
    category: business_constraint
    check: "scheduled_minutes + the new session's minutes_planned does not exceed remaining_owed_minutes"
    error_id: ERR_OVERBOOKED_MAKEUP_MINUTES
    http_status: 422
    applies_to: "POST /esy/makeup-sessions"
  - priority: 28
    category: business_constraint
    check: "no VERIFIED ServiceLog already exists for the same (commitment_id, service_date)"
    error_id: ERR_DUPLICATE_SERVICE_LOG
    http_status: 409
    applies_to: "POST /esy/service-logs"
  - priority: 29
    category: business_constraint
    check: "(program_id, budget_code) is unique across FundAllocation"
    error_id: ERR_DUPLICATE_BUDGET_CODE
    http_status: 409
    applies_to: "POST /esy/fund-allocations"
  - priority: 30
    category: business_constraint
    check: "no non-terminal CompensatoryAward already exists for the same (student_id, source_program_id)"
    error_id: ERR_DUPLICATE_AWARD
    http_status: 409
    applies_to: "POST /esy/compensatory-awards"
  - priority: 31
    category: business_constraint
    check: "the aggregate weekly load of the provider's ACTIVE assignments plus the requested covered_weekly_minutes does not exceed provider.max_weekly_minutes"
    error_id: ERR_PROVIDER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /esy/provider-assignments"
  - priority: 32
    category: business_constraint
    check: "the referenced transportation run has a free seat (seats_committed < vehicle_capacity_seats)"
    error_id: ERR_RUN_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /esy/service-commitments"
  - priority: 33
    category: business_fiscal
    check: "at least one FundAllocation of the program is in status OPEN"
    error_id: ERR_FUND_FROZEN
    http_status: 409
    applies_to: "POST /esy/provider-assignments, POST /esy/makeup-sessions/{session_id}/log-outcome"
  - priority: 34
    category: business_fiscal
    check: "some OPEN allocation, taken in FUND_PRIORITY order, has available_cents >= base_cost_cents"
    error_id: ERR_NO_FUND_WITH_CAPACITY
    http_status: 422
    applies_to: "POST /esy/provider-assignments, POST /esy/makeup-sessions/{session_id}/log-outcome"
  - priority: 35
    category: business_fiscal
    check: "the selected allocation's available_cents covers base_cost_cents + indirect_cost_cents (checked without re-selecting a different allocation)"
    error_id: ERR_FUND_INDIRECT_OVERAGE
    http_status: 422
    applies_to: "POST /esy/provider-assignments, POST /esy/makeup-sessions/{session_id}/log-outcome"
  - priority: 36
    category: business_fiscal
    check: "compensatory charges against a federal allocation stay within FEDERAL_COMP_CAP_PCT (0.25) of its authorized_amount_cents"
    error_id: ERR_SUPPLANT_RESTRICTION
    http_status: 422
    applies_to: "POST /esy/makeup-sessions/{session_id}/log-outcome"

priority_conflict_pairs:
  - pair_id: state-beats-fiscal
    higher: {priority: 9, category: state, error_id: ERR_INVALID_STATE}
    lower: {priority: 33, category: business_fiscal, error_id: ERR_FUND_FROZEN}
    note: "A release request against an already-RELEASED assignment whose program's only allocation is FROZEN violates both; ERR_INVALID_STATE wins."
  - pair_id: safety-beats-referential
    higher: {priority: 12, category: business_safety, error_id: ERR_PROVIDER_CREDENTIAL_EXPIRED}
    lower: {priority: 14, category: business_referential, error_id: ERR_PROVIDER_ROLE_MISMATCH}
    note: "An expired SLP assigned to a SPECIALIZED_INSTRUCTION commitment violates both; the safety check wins."
  - pair_id: temporal-beats-fiscal
    higher: {priority: 19, category: business_temporal, error_id: ERR_MAKEUP_OUTSIDE_WINDOW}
    lower: {priority: 27, category: business_constraint, error_id: ERR_OVERBOOKED_MAKEUP_MINUTES}
    note: "A session booked past the delivery deadline AND for more minutes than are owed returns the temporal error."

endpoints:
  # ---------------------------------------------------------------- reads (19)
  - method: GET
    path: "/esy/students/{student_id}"
    description: "Fetch one student with all derived ledger fields (esy_eligibility_status, pending_award_minutes, outstanding_owed_minutes, delivered_makeup_minutes_total, esy_service_alert, stay_put_active)."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer, ParentGuardian]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/esy/students/{id}/eligibility-determinations"
    description: "List every eligibility determination of one student, ordered created_at ASC."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer, ParentGuardian]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityDetermination[]
    side_effects: []
  - method: GET
    path: "/esy/students/{id}/due-process-records"
    description: "List every complaint, hearing and mediation-agreement record of one student, ordered created_at ASC."
    roles: [CaseManager, SpedDirector, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: DueProcessRecord[]
    side_effects: []
  - method: GET
    path: "/esy/eligibility-determinations/{determination_id}"
    description: "Fetch one eligibility determination including the analysed regression/recoupment outputs and the embedded skill_probes array."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer, ParentGuardian]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: []
  - method: GET
    path: "/esy/programs/{program_id}"
    description: "Fetch one ESY program with its derived instructional_days_count and instructional_week_count."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer]
    code: 200
    input: []
    output: EsyProgram
    side_effects: []
  - method: GET
    path: "/esy/programs/{id}/fund-allocations"
    description: "List the program's fund allocations in FUND_PRIORITY order then created_at ASC - the same order the charge waterfall walks."
    roles: [ProgramCoordinator, SpedDirector, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: FundAllocation[]
    side_effects: []
  - method: GET
    path: "/esy/programs/{id}/transportation-runs"
    description: "List the program's transportation runs, ordered service_date ASC then window_start_time ASC then created_at ASC."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: TransportationRun[]
    side_effects: []
  - method: GET
    path: "/esy/providers/{provider_id}"
    description: "Fetch one provider with the derived assigned_weekly_minutes load."
    roles: [ProgramCoordinator, SpedDirector, ComplianceOfficer, RelatedServiceProvider]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: GET
    path: "/esy/providers/{id}/provider-assignments"
    description: "List every assignment held by one provider, ordered created_at ASC."
    roles: [ProgramCoordinator, SpedDirector, ComplianceOfficer, RelatedServiceProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: ProviderAssignment[]
    side_effects: []
  - method: GET
    path: "/esy/service-commitments"
    description: "Filterable, paginated list of service commitments, ordered created_at ASC. Filters combine with AND."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer]
    code: 200
    input: ["program_id?", "student_id?", "transportation_run_id?", "status?", "limit?", "offset?"]
    output: ServiceCommitment[]
    side_effects: []
  - method: GET
    path: "/esy/service-commitments/{commitment_id}"
    description: "Fetch one service commitment with its pinned minute plan and its delivered / compensable ledger fields."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer]
    code: 200
    input: []
    output: ServiceCommitment
    side_effects: []
  - method: GET
    path: "/esy/service-commitments/{id}/provider-assignments"
    description: "List every assignment on one commitment (ACTIVE, RELEASED and SUPERSEDED alike), ordered created_at ASC."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ProviderAssignment[]
    side_effects: []
  - method: GET
    path: "/esy/service-logs"
    description: "Filterable, paginated list of service logs, ordered service_date ASC then created_at ASC. This is the only discovery channel for the MISSED_DISTRICT logs synthesized by a day cancellation."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer, RelatedServiceProvider]
    code: 200
    input: ["commitment_id?", "provider_id?", "service_date?", "outcome?", "limit?", "offset?"]
    output: ServiceLog[]
    side_effects: []
  - method: GET
    path: "/esy/service-logs/{log_id}"
    description: "Fetch one service log."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer, RelatedServiceProvider]
    code: 200
    input: []
    output: ServiceLog
    side_effects: []
  - method: GET
    path: "/esy/compensatory-awards"
    description: "Filterable, paginated list of compensatory awards, ordered created_at ASC."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer]
    code: 200
    input: ["student_id?", "source_program_id?", "negotiation_status?", "limit?", "offset?"]
    output: CompensatoryAward[]
    side_effects: []
  - method: GET
    path: "/esy/compensatory-awards/{award_id}"
    description: "Fetch one compensatory award with both state dimensions and the full minute ledger. Reading the award also triggers the lazy delivery-deadline lapse evaluation."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer, ParentGuardian]
    code: 200
    input: []
    output: CompensatoryAward
    side_effects: ["evaluates the SCHEDULING|IN_PROGRESS -> LAPSED transition against the current logical clock"]
  - method: GET
    path: "/esy/compensatory-awards/{award_id}/due-process-packet"
    description: "Computed read: the documentation packet an investigator needs - the award's minute ledger, the eligible/excluded log counts, the negotiation round history and the makeup delivery summary."
    roles: [SpedDirector, ComplianceOfficer]
    code: 200
    input: []
    output:
      award_id: string
      student_id: string
      calculation_variant: string
      severity_factor: number
      computed_minutes: integer
      proposed_minutes: integer
      agreed_minutes: integer
      delivered_minutes: integer
      scheduled_minutes: integer
      forfeited_minutes: integer
      remaining_owed_minutes: integer
      verified_missed_log_count: integer
      excluded_log_count: integer
      dispute_round_count: integer
      parent_no_show_count: integer
      negotiation_status: string
      delivery_status: string
      delivery_deadline_date: string
      open_due_process_record_count: integer
    side_effects: []
  - method: GET
    path: "/esy/makeup-sessions"
    description: "Filterable, paginated list of makeup sessions, ordered session_date ASC then created_at ASC."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer, RelatedServiceProvider]
    code: 200
    input: ["award_id?", "provider_id?", "supersedes_session_id?", "status?", "limit?", "offset?"]
    output: MakeupSession[]
    side_effects: []
  - method: GET
    path: "/esy/makeup-sessions/{session_id}"
    description: "Fetch one makeup session with its fund coding."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer, RelatedServiceProvider]
    code: 200
    input: []
    output: MakeupSession
    side_effects: []

  # --------------------------------------------------------------- writes (28)
  - method: POST
    path: "/esy/students"
    description: "Register a student. esy_eligibility_status starts at NOT_DETERMINED and every ledger field starts at 0."
    roles: [CaseManager]
    code: 201
    input: ["student_number", "first_name", "last_name", "grade_band", "primary_disability", "iep_weekly_minutes_total", "home_school_code", "transportation_required?"]
    output: Student
    side_effects: []
  - method: POST
    path: "/esy/eligibility-determinations"
    description: "Open an ESY eligibility determination in DRAFT with its regression probe set embedded."
    roles: [CaseManager]
    code: 201
    input: [student_id, school_year, analysis_variant, skill_probes]
    output: EligibilityDetermination
    side_effects: []
  - method: POST
    path: "/esy/eligibility-determinations/{determination_id}/analyze"
    description: "Run the regression / recoupment analysis under the row's analysis_variant and move DRAFT -> PARENT_REVIEW. Optionally replaces skill_probes first, which is how the team responds to a parent objection."
    roles: [CaseManager]
    code: 200
    input: ["skill_probes?"]
    output: EligibilityDetermination
    side_effects: ["calculations.regression_recoupment_analysis", "writes analyzed_by_user_id", "state_machines.EligibilityDetermination DRAFT -> PARENT_REVIEW"]
  - method: POST
    path: "/esy/eligibility-determinations/{determination_id}/parent-response"
    description: "Parent responds to the determination: AGREE, OBJECT (returns it to DRAFT and increments objection_round_count) or WITHDRAW."
    roles: [ParentGuardian]
    code: 200
    input: ["response", "parent_comment?"]
    output: EligibilityDetermination
    side_effects: ["state_machines.EligibilityDetermination PARENT_REVIEW -> PARENT_AGREED | DRAFT | WITHDRAWN"]
  - method: POST
    path: "/esy/eligibility-determinations/{determination_id}/finalize"
    description: "Director finalizes an agreed determination and writes the recommendation onto the student. Requires a different user than the analyst."
    roles: [SpedDirector]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: ["writes Student.esy_eligibility_status and bumps Student.version", "state_machines.EligibilityDetermination PARENT_AGREED -> FINALIZED"]
  - method: POST
    path: "/esy/programs"
    description: "Create a summer ESY program in PLANNING and derive its instructional calendar."
    roles: [ProgramCoordinator]
    code: 201
    input: ["name", "school_year", "session_start_date", "session_end_date", "instructional_weekdays", "daily_minutes_cap", "blackout_dates?"]
    output: EsyProgram
    side_effects: ["derives instructional_days_count and instructional_week_count"]
  - method: POST
    path: "/esy/programs/{program_id}/status"
    description: "Drive the program lifecycle: STAFFING_LOCKED, OPEN or CLOSED."
    roles: [ProgramCoordinator]
    code: 200
    input: [target_status]
    output: EsyProgram
    side_effects: ["state_machines.EsyProgram transitions", "CLOSED cascades commitments to COMPLETED/TERMINATED, releases assignments and their encumbrances, and frees transportation seats"]
  - method: POST
    path: "/esy/programs/{program_id}/cancel-day"
    description: "Cancel one instructional day of an OPEN program (weather, closure, staffing). Synthesizes MISSED_DISTRICT service logs for every ACTIVE commitment and cascades the owed-minute ledgers up to the student."
    roles: [ProgramCoordinator]
    code: 200
    input: [service_date, cancellation_reason]
    output: EsyProgram
    side_effects: ["appends service_date to cancelled_dates and re-derives the calendar counts", "creates one MISSED_DISTRICT ServiceLog per ACTIVE commitment", "calculations.commitment_minutes_ledger", "calculations.student_minutes_ledger", "flips Student.esy_service_alert at AUTO_AWARD_THRESHOLD_MINUTES", "cancels SCHEDULED transportation runs on that date"]
  - method: POST
    path: "/esy/fund-allocations"
    description: "Authorize a budget code against a program from one federal or local fund source."
    roles: [SpedDirector]
    code: 201
    input: [program_id, fund_source, budget_code, authorized_amount_cents]
    output: FundAllocation
    side_effects: ["derives available_cents"]
  - method: PATCH
    path: "/esy/fund-allocations/{allocation_id}"
    description: "Freeze, unfreeze or close a budget code."
    roles: [SpedDirector]
    code: 200
    input: [status]
    output: FundAllocation
    side_effects: ["state_machines.FundAllocation transitions", "changes the waterfall candidate set"]
  - method: POST
    path: "/esy/providers"
    description: "Register a provider with a credential expiry, a billing rate and a weekly minute ceiling."
    roles: [ProgramCoordinator]
    code: 201
    input: [full_name, role_type, credential_expires_on, rate_cents_per_minute, max_weekly_minutes]
    output: Provider
    side_effects: []
  - method: PATCH
    path: "/esy/providers/{provider_id}"
    description: "Update a provider's availability, credential expiry or weekly ceiling."
    roles: [ProgramCoordinator]
    code: 200
    input: ["status?", "credential_expires_on?", "max_weekly_minutes?"]
    output: Provider
    side_effects: []
  - method: POST
    path: "/esy/transportation-runs"
    description: "Schedule a route window on one service date. Enforces closed-interval window exclusivity and the route turnaround gap."
    roles: [ProgramCoordinator]
    code: 201
    input: [program_id, route_code, service_date, window_start_time, window_end_time, vehicle_capacity_seats]
    output: TransportationRun
    side_effects: ["calculations.transport_run_occupancy"]
  - method: POST
    path: "/esy/service-commitments"
    description: "Commit an eligible student's IEP service to a program, pinning the prorated minute plan against the calendar as it reads right now, and optionally seating the student on a transportation run."
    roles: [CaseManager, ProgramCoordinator]
    code: 201
    input: ["program_id", "student_id", "service_type", "iep_weekly_minutes", "staffing_ratio", "transportation_run_id?"]
    output: ServiceCommitment
    side_effects: ["calculations.esy_service_minutes_plan pins planned_total_minutes, weekly_minutes_committed and daily_minutes", "calculations.transport_run_occupancy raises TransportationRun.seats_committed when transportation_run_id is supplied"]
  - method: POST
    path: "/esy/service-commitments/{commitment_id}/status"
    description: "Drive the commitment lifecycle: ACTIVE, SUSPENDED or TERMINATED."
    roles: [ProgramCoordinator, ComplianceOfficer]
    code: 200
    input: [target_status]
    output: ServiceCommitment
    side_effects: ["state_machines.ServiceCommitment transitions", "TERMINATED releases every ACTIVE assignment, its fund encumbrance and its provider load, and frees the transportation seat"]
  - method: POST
    path: "/esy/provider-assignments"
    description: "Assign a provider to a commitment for a weekly half-open time window, price the assignment through the fund waterfall, and encumber the selected budget code. A new assignment on the same service line supersedes the incumbent one, so the caller must prove its view of the commitment is current."
    roles: [ProgramCoordinator]
    code: 201
    input: [commitment_id, provider_id, weekday, start_time, end_time, effective_from, effective_to, covered_weekly_minutes, expected_commitment_version]
    output: ProviderAssignment
    side_effects: ["calculations.provider_load_and_conflict", "calculations.fund_charge_waterfall encumbers total_charge_cents", "state_machines.ServiceCommitment PLANNED -> ASSIGNED", "state_machines.ProviderAssignment ACTIVE -> SUPERSEDED on the incumbent"]
  - method: POST
    path: "/esy/provider-assignments/{assignment_id}/release"
    description: "Release an assignment, reversing its fund encumbrance and its provider load exactly."
    roles: [ProgramCoordinator]
    code: 200
    input: [release_reason]
    output: ProviderAssignment
    side_effects: ["state_machines.ProviderAssignment ACTIVE -> RELEASED", "decrements FundAllocation.encumbered_amount_cents by total_charge_cents", "decrements Provider.assigned_weekly_minutes by covered_weekly_minutes"]
  - method: POST
    path: "/esy/service-logs"
    description: "Record what actually happened on one instructional date for one commitment."
    roles: [RelatedServiceProvider, CaseManager]
    code: 201
    input: ["commitment_id", "service_date", "outcome", "minutes_scheduled", "minutes_delivered", "provider_id?", "miss_reason_code?"]
    output: ServiceLog
    side_effects: ["calculations.commitment_minutes_ledger", "calculations.student_minutes_ledger"]
  - method: POST
    path: "/esy/service-logs/{log_id}/void"
    description: "Void a verified log; every ledger it fed returns to its prior value."
    roles: [ComplianceOfficer]
    code: 200
    input: [void_reason]
    output: ServiceLog
    side_effects: ["state_machines.ServiceLog VERIFIED -> VOIDED", "calculations.commitment_minutes_ledger", "calculations.student_minutes_ledger"]
  - method: POST
    path: "/esy/compensatory-awards"
    description: "Open a compensatory-education award in DRAFT / NOT_STARTED and compute the owed minutes from the student's missed services in the source program under the chosen calculation variant."
    roles: [CaseManager]
    code: 201
    input: [student_id, source_program_id, calculation_variant]
    output: CompensatoryAward
    side_effects: ["calculations.compensatory_award_minutes writes computed_minutes, severity_factor, verified_missed_log_count and excluded_log_count"]
  - method: POST
    path: "/esy/compensatory-awards/{award_id}/propose"
    description: "Propose an award amount to the parent (DRAFT -> PARENT_REVIEW, or DISPUTED -> PARENT_REVIEW for a revised offer). Recomputes computed_minutes before range-checking the proposal."
    roles: [CaseManager]
    code: 200
    input: [proposed_minutes]
    output: CompensatoryAward
    side_effects: ["calculations.compensatory_award_minutes", "writes authored_by_user_id", "state_machines.CompensatoryAward negotiation transitions"]
  - method: POST
    path: "/esy/compensatory-awards/{award_id}/parent-response"
    description: "Parent responds to the proposed amount: AGREE, DISPUTE (escalating to MEDIATION once the dispute rounds reach MAX_DISPUTE_ROUNDS) or DECLINE."
    roles: [ParentGuardian]
    code: 200
    input: [response]
    output: CompensatoryAward
    side_effects: ["state_machines.CompensatoryAward PARENT_REVIEW -> AGREED | DISPUTED | MEDIATION | DECLINED", "AGREE sets agreed_minutes and delivery_deadline_date and raises Student.outstanding_owed_minutes"]
  - method: POST
    path: "/esy/compensatory-awards/{award_id}/resolve-dispute"
    description: "Director arbitrates a disputed or mediated award. Requires a different user than the author and no open stay-put record."
    roles: [SpedDirector]
    code: 200
    input: [arbitrated_minutes]
    output: CompensatoryAward
    side_effects: ["state_machines.CompensatoryAward DISPUTED|MEDIATION -> AGREED", "writes agreed_minutes, resolved_by_user_id and delivery_deadline_date", "raises Student.outstanding_owed_minutes"]
  - method: POST
    path: "/esy/makeup-sessions"
    description: "Book a makeup session against an agreed award, optionally superseding a previously scheduled session. Rejects bookings past the delivery deadline, beyond the remaining owed minutes, or against a stale view of the award."
    roles: [CaseManager, ProgramCoordinator]
    code: 201
    input: ["award_id", "provider_id", "session_date", "start_time", "end_time", "minutes_planned", "expected_award_version", "supersedes_session_id?"]
    output: MakeupSession
    side_effects: ["calculations.award_delivery_ledger", "state_machines.CompensatoryAward NOT_STARTED -> SCHEDULING", "state_machines.MakeupSession SCHEDULED -> SUPERSEDED on the superseded row"]
  - method: POST
    path: "/esy/makeup-sessions/{session_id}/log-outcome"
    description: "Record the outcome of a booked makeup session (DELIVERED, NO_SHOW_PARENT, CANCELLED_DISTRICT) or void a delivered one. Each branch has a different side-effect set."
    roles: [RelatedServiceProvider, ComplianceOfficer]
    code: 200
    input: ["outcome", "minutes_delivered?", "outcome_note?"]
    output: MakeupSession
    side_effects: ["state_machines.MakeupSession branch transitions", "DELIVERED runs calculations.fund_charge_waterfall and expends the selected budget code", "calculations.award_delivery_ledger", "calculations.student_minutes_ledger", "auto-resolves OPEN MEDIATION_AGREEMENT due-process records once outstanding_owed_minutes reaches 0"]
  - method: POST
    path: "/esy/due-process-records"
    description: "File a complaint, a due-process hearing request or a mediation agreement for a student. COMPLAINT and DUE_PROCESS_HEARING raise stay-put protection immediately."
    roles: [ComplianceOfficer]
    code: 201
    input: [student_id, record_type, filed_on, allegation_summary]
    output: DueProcessRecord
    side_effects: ["recomputes Student.stay_put_active and bumps Student.version"]
  - method: PATCH
    path: "/esy/due-process-records/{record_id}"
    description: "Resolve or dismiss a due-process record, lifting stay-put protection."
    roles: [ComplianceOfficer]
    code: 200
    input: ["status", "resolution_note?"]
    output: DueProcessRecord
    side_effects: ["state_machines.DueProcessRecord OPEN -> RESOLVED | DISMISSED", "recomputes Student.stay_put_active and bumps Student.version"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to an explicit ISO-8601 instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z - the server MUST NOT fall back to real wall-clock time. Every deadline, lapse and expiry rule in this domain reads this clock."
    roles: [CaseManager, ProgramCoordinator, SpedDirector, ComplianceOfficer, RelatedServiceProvider, ParentGuardian]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["re-evaluates CompensatoryAward delivery lapse on the next request that references an award"]

errors:
  # ------------------------------------------------------------ auth (5)
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_STUDENT_GUARDIAN
    http: 403
    condition: "a ParentGuardian addresses a student, determination or award whose student_id is not the caller's X-User-ID"
  - id: ERR_NOT_ASSIGNED_PROVIDER
    http: 403
    condition: "a RelatedServiceProvider logs an outcome for a makeup session or a service delivery that is not assigned to the caller"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the finalizing or arbitrating user is the same user who analysed the determination or authored the award proposal"
  # ---------------------------------------------------------- not found (12)
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id in the path or body matches no Student"
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "determination_id in the path matches no EligibilityDetermination"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id or source_program_id matches no EsyProgram"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "provider_id in the path or body matches no Provider"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "commitment_id in the path or body matches no ServiceCommitment"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id in the path matches no ProviderAssignment"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "transportation_run_id in the body matches no TransportationRun"
  - id: ERR_SERVICE_LOG_NOT_FOUND
    http: 404
    condition: "log_id in the path matches no ServiceLog"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "award_id in the path or body matches no CompensatoryAward"
  - id: ERR_MAKEUP_SESSION_NOT_FOUND
    http: 404
    condition: "session_id in the path or supersedes_session_id in the body matches no MakeupSession"
  - id: ERR_FUND_ALLOCATION_NOT_FOUND
    http: 404
    condition: "allocation_id in the path matches no FundAllocation"
  - id: ERR_DUE_PROCESS_RECORD_NOT_FOUND
    http: 404
    condition: "record_id in the path matches no DueProcessRecord"
  # ------------------------------------------------------ request shape (2)
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input field is missing, an enum value is out of range, a number is negative, a date or time is malformed, end is not strictly after start, or minutes_delivered exceeds minutes_scheduled / minutes_planned"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset negative"
  # ------------------------------------------------- state and concurrency (3)
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition does not exist from the resource's current state, or a cross-entity state guard fails (program not OPEN, award not AGREED, allocation still encumbered)"
  - id: ERR_STALE_COMMITMENT_VERSION
    http: 412
    condition: "expected_commitment_version does not match ServiceCommitment.version"
  - id: ERR_STALE_AWARD_VERSION
    http: 412
    condition: "expected_award_version does not match CompensatoryAward.version"
  # --------------------------------------------- safety and referential (4)
  - id: ERR_STAY_PUT_BLOCKED
    http: 409
    condition: "the student has an OPEN COMPLAINT or DUE_PROCESS_HEARING record, so services may not be suspended or terminated and a dispute may not be arbitrated"
  - id: ERR_PROVIDER_CREDENTIAL_EXPIRED
    http: 422
    condition: "the provider's credential_expires_on falls before the last date the assignment or session covers"
  - id: ERR_PROVIDER_NOT_ACTIVE
    http: 422
    condition: "the provider's status is ON_LEAVE or INACTIVE"
  - id: ERR_PROVIDER_ROLE_MISMATCH
    http: 422
    condition: "the provider's role_type is not permitted for the commitment's service_type"
  # ------------------------------------------------------------ temporal (5)
  - id: ERR_PROVIDER_TIME_CONFLICT
    http: 409
    condition: "the provider already holds an ACTIVE assignment whose half-open weekday window overlaps the requested one within an intersecting effective date range"
  - id: ERR_RUN_WINDOW_OVERLAP
    http: 409
    condition: "a SCHEDULED run of the same route_code on the same service_date has a closed window that touches or overlaps the requested one"
  - id: ERR_ROUTE_TURNAROUND_VIOLATION
    http: 422
    condition: "two non-overlapping runs of the same route_code on the same service_date leave a gap shorter than ROUTE_TURNAROUND_MINUTES"
  - id: ERR_MAKEUP_OUTSIDE_WINDOW
    http: 422
    condition: "the makeup session's session_date falls after the award's delivery_deadline_date or before the current logical clock date"
  - id: ERR_NOT_INSTRUCTIONAL_DATE
    http: 422
    condition: "the supplied service_date is not an instructional date of the program (wrong weekday, blacked out, already cancelled, or outside the session range)"
  # ---------------------------------------------------------- constraint (12)
  - id: ERR_STUDENT_NOT_ESY_ELIGIBLE
    http: 422
    condition: "the student's esy_eligibility_status is not ELIGIBLE"
  - id: ERR_NO_INSTRUCTIONAL_DAYS
    http: 422
    condition: "the program's calendar yields zero instructional days"
  - id: ERR_DAILY_MINUTES_CAP_EXCEEDED
    http: 422
    condition: "the plan's maximum single-week daily load exceeds the program's daily_minutes_cap"
  - id: ERR_INSUFFICIENT_PROBE_DATA
    http: 422
    condition: "fewer than MIN_PROBE_DOMAINS skill probes are attached to the determination being analysed"
  - id: ERR_NO_COMPENSABLE_MINUTES
    http: 422
    condition: "the computed award falls below MIN_AWARDABLE_MINUTES"
  - id: ERR_PROPOSAL_OUT_OF_RANGE
    http: 422
    condition: "proposed_minutes or arbitrated_minutes falls outside [computed_minutes, floor(computed_minutes * MAX_PROPOSAL_MULTIPLE)]"
  - id: ERR_OVERBOOKED_MAKEUP_MINUTES
    http: 422
    condition: "already-scheduled minutes plus the new session's minutes_planned exceed the award's remaining_owed_minutes"
  - id: ERR_DUPLICATE_SERVICE_LOG
    http: 409
    condition: "a VERIFIED ServiceLog already exists for the same commitment_id and service_date"
  - id: ERR_DUPLICATE_BUDGET_CODE
    http: 409
    condition: "the (program_id, budget_code) pair already exists"
  - id: ERR_DUPLICATE_AWARD
    http: 409
    condition: "a non-terminal CompensatoryAward already exists for the same student_id and source_program_id"
  - id: ERR_PROVIDER_CAPACITY_EXCEEDED
    http: 422
    condition: "the provider's ACTIVE weekly load plus the requested covered_weekly_minutes exceeds max_weekly_minutes"
  - id: ERR_RUN_CAPACITY_EXCEEDED
    http: 422
    condition: "the transportation run has no free seat (seats_committed already equals vehicle_capacity_seats)"
  # -------------------------------------------------------------- fiscal (4)
  - id: ERR_FUND_FROZEN
    http: 409
    condition: "the program has fund allocations but none of them is OPEN"
  - id: ERR_NO_FUND_WITH_CAPACITY
    http: 422
    condition: "no OPEN allocation of the program has available_cents >= base_cost_cents"
  - id: ERR_FUND_INDIRECT_OVERAGE
    http: 422
    condition: "the allocation selected on base cost cannot absorb base_cost_cents + indirect_cost_cents; selection is never retried against a lower-priority allocation"
  - id: ERR_SUPPLANT_RESTRICTION
    http: 422
    condition: "a compensatory charge would push a federal allocation's compensatory_expended_cents past FEDERAL_COMP_CAP_PCT of its authorized amount"

roles:
  - name: CaseManager
    description: "Special-education case manager: owns the student record, the eligibility determination and the compensatory-award proposal, and books makeup services."
    identity: opaque
    exclusive_operations:
      - "POST /esy/students"
      - "POST /esy/eligibility-determinations"
      - "POST /esy/eligibility-determinations/{determination_id}/analyze"
      - "POST /esy/compensatory-awards"
      - "POST /esy/compensatory-awards/{award_id}/propose"
    shared_operations:
      - "POST /esy/service-commitments (with ProgramCoordinator)"
      - "POST /esy/service-logs (with RelatedServiceProvider)"
      - "POST /esy/makeup-sessions (with ProgramCoordinator)"
      - "all GET reads of students, determinations, commitments, logs, awards and makeup sessions"
      - "POST /_clock/set_current_utc"
  - name: ProgramCoordinator
    description: "Summer-program coordinator: owns the ESY calendar, the provider roster, the transportation runs and the staffing assignments."
    identity: opaque
    exclusive_operations:
      - "POST /esy/programs"
      - "POST /esy/programs/{program_id}/status"
      - "POST /esy/programs/{program_id}/cancel-day"
      - "POST /esy/providers"
      - "PATCH /esy/providers/{provider_id}"
      - "POST /esy/transportation-runs"
      - "POST /esy/provider-assignments"
      - "POST /esy/provider-assignments/{assignment_id}/release"
    shared_operations:
      - "POST /esy/service-commitments (with CaseManager)"
      - "POST /esy/service-commitments/{commitment_id}/status (with ComplianceOfficer)"
      - "POST /esy/makeup-sessions (with CaseManager)"
      - "all GET reads except the student's due-process records and the due-process packet"
      - "POST /_clock/set_current_utc"
  - name: SpedDirector
    description: "District special-education director: the approving authority. Finalizes determinations, arbitrates disputed awards and authorizes budget codes. Segregation of duties forbids approving one's own analysis or proposal."
    identity: opaque
    exclusive_operations:
      - "POST /esy/eligibility-determinations/{determination_id}/finalize"
      - "POST /esy/compensatory-awards/{award_id}/resolve-dispute"
      - "POST /esy/fund-allocations"
      - "PATCH /esy/fund-allocations/{allocation_id}"
    shared_operations:
      - "GET /esy/compensatory-awards/{award_id}/due-process-packet (with ComplianceOfficer)"
      - "GET /esy/students/{id}/due-process-records (with CaseManager and ComplianceOfficer)"
      - "all other GET reads"
      - "POST /_clock/set_current_utc"
  - name: ComplianceOfficer
    description: "Due-process and complaint investigator: files and closes due-process records, voids bad documentation, and may suspend or terminate a commitment on compliance grounds."
    identity: opaque
    exclusive_operations:
      - "POST /esy/due-process-records"
      - "PATCH /esy/due-process-records/{record_id}"
      - "POST /esy/service-logs/{log_id}/void"
    shared_operations:
      - "POST /esy/service-commitments/{commitment_id}/status (with ProgramCoordinator)"
      - "POST /esy/makeup-sessions/{session_id}/log-outcome with outcome VOIDED (with RelatedServiceProvider for the delivery outcomes)"
      - "GET /esy/compensatory-awards/{award_id}/due-process-packet (with SpedDirector)"
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: RelatedServiceProvider
    description: "The SLP, OT, PT, counsellor, sped teacher or paraeducator who actually delivers the service and records what happened. X-User-ID is a Provider id."
    identity: "entity_backed:Provider"
    exclusive_operations: []
    shared_operations:
      - "POST /esy/service-logs (with CaseManager)"
      - "POST /esy/makeup-sessions/{session_id}/log-outcome with outcome DELIVERED, NO_SHOW_PARENT or CANCELLED_DISTRICT (with ComplianceOfficer for VOIDED)"
      - "GET /esy/providers/{provider_id}, GET /esy/providers/{id}/provider-assignments, GET /esy/service-logs, GET /esy/service-logs/{log_id}, GET /esy/makeup-sessions, GET /esy/makeup-sessions/{session_id}"
      - "POST /_clock/set_current_utc"
  - name: ParentGuardian
    description: "The student's parent or guardian: the only party who can agree to, object to, dispute or decline a determination or a compensatory amount. X-User-ID is a Student id."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /esy/eligibility-determinations/{determination_id}/parent-response"
      - "POST /esy/compensatory-awards/{award_id}/parent-response"
    shared_operations:
      - "GET /esy/students/{student_id}, GET /esy/students/{id}/eligibility-determinations, GET /esy/eligibility-determinations/{determination_id}, GET /esy/compensatory-awards/{award_id} - each restricted to the caller's own student record"
      - "POST /_clock/set_current_utc"
