  - section: validations
    instances:

      - name: existence_checked_left_to_right_in_nested_path
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
        distinguishing_aspect: "POST /membership/members/{bogus}/entitlements/{bogus}/close with both ids bogus reports the member (leftmost) as not found — ERR_NOT_FOUND — never an entitlement-level error."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /membership/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/entitlements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/close"
              payload: {}
              as: BenefitsOfficer
              captures: { err_lr: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: duplicate_evidence_content_hash_conflict
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_DUPLICATE_EVIDENCE]
        distinguishing_aspect: "Uploading a second document with the same content_hash to the same case is rejected ERR_DUPLICATE_EVIDENCE (409); the same hash on a DIFFERENT case is legal."
        test_recipe:
          setup:
            - "Two INTAKE cases A and B; case A already holds a document with content_hash dup1."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Dup One", applicant_dob: "1980-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_d1: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_d1}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2010-01-01", content_hash: "dup1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Dup Two", applicant_dob: "1981-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_d2: $.data.id }
          trigger:
            - call: "POST /membership/eligibility-cases/${c_d1}/evidence"
              payload: { doc_type: "NGB22", issuing_authority: "NGB", issued_on: "2011-01-01", content_hash: "dup1" }
              as: EligibilityApplicant
              captures: { err_dup: $.data.error_id }
            - call: "POST /membership/eligibility-cases/${c_d2}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2010-01-01", content_hash: "dup1" }
              as: EligibilityApplicant
              captures: { doc_d2: $.data.id }
          assert:
            - "Same-case duplicate: error_id == ERR_DUPLICATE_EVIDENCE (409)"
            - "Cross-case reuse of the same hash succeeds (201) — uniqueness scope is per case"

      - name: duplicate_orders_number_conflict
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_ORDER]
        distinguishing_aspect: "A second deployment order with an existing orders_number is rejected ERR_DUPLICATE_ORDER even when every other field differs."
        test_recipe:
          setup:
            - "Member M ACTIVE with order ORD-DUP registered."
          setup_api_calls:
            - call: "POST /membership/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Dup Dan", applicant_dob: "1990-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_dd: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_dd}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-5", service_start_date: "2012-01-01", discharge_characterization: "STILL_SERVING" }
              as: EligibilityApplicant
              captures: { sr_dd: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_dd}/evidence"
              payload: { doc_type: "LEAVE_EARNINGS_STATEMENT", issuing_authority: "DFAS", issued_on: "2026-08-01", covers_service_record_id: "${sr_dd}", content_hash: "dd1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_dd}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_dd}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_dd}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_dd: $.data.member_id }
            - call: "GET /membership/members/${m_dd}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_dd_v: $.data.version }
            - call: "POST /membership/members/${m_dd}/deployment-orders"
              payload: { orders_number: "ORD-DUP", theater: "CENTCOM", start_date: "2026-09-01", end_date: "2026-10-01", scra_eligible: false, expected_member_version: "${m_dd_v}" }
              as: VerificationOfficer
            - call: "GET /membership/members/${m_dd}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_dd_v2: $.data.version }
          trigger:
            - call: "POST /membership/members/${m_dd}/deployment-orders"
              payload: { orders_number: "ORD-DUP", theater: "EUCOM", start_date: "2027-01-01", end_date: "2027-02-01", scra_eligible: false, expected_member_version: "${m_dd_v2}" }
              as: VerificationOfficer
              captures: { err_do: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_ORDER (409); no second order persisted"

      - name: same_officer_reconstruct_then_approve_denied_sod
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The officer who performed record_reconstruction cannot APPROVE the same case: decide with the reconstructing officer's X-User-ID fails ERR_SEGREGATION_OF_DUTIES (403); a different officer's approval succeeds."
        test_recipe:
          setup:
            - "Case UNDER_REVIEW, reconstruction recorded by officer-A, records verified."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Sod Steve", applicant_dob: "1985-05-05", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_so: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_so}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-6", service_start_date: "2006-01-01", service_end_date: "2012-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_so: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_so}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2012-02-01", covers_service_record_id: "${sr_so}", content_hash: "so1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_so}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_so}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "rebuilt" }
              as: VerificationOfficer
              as_user_id: "officer-A"
          trigger:
            - call: "POST /membership/eligibility-cases/${c_so}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
              captures: { err_sod: $.data.error_id }
            - call: "POST /membership/eligibility-cases/${c_so}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_so: $.data.member_id }
          assert:
            - "Same-officer decide: error_id == ERR_SEGREGATION_OF_DUTIES (403); case stays UNDER_REVIEW"
            - "Different-officer decide succeeds; EligibilityCase.${c_so}.status == APPROVED and member_id == ${m_so}"

      - name: product_category_gate_on_entitlement_open
        claim_type: Violation → Error
        grounds:
          - validations[priority=15]
          - errors[ERR_PRODUCT_CATEGORY_FORBIDDEN]
        distinguishing_aspect: "A FAMILY_CHILD member cannot open an entitlement whose offering allows only VETERAN_HONORABLE — ERR_PRODUCT_CATEGORY_FORBIDDEN (422); the same member succeeds on an offering whose allowed_categories include FAMILY_CHILD."
        test_recipe:
          setup:
            - "Child member C ACTIVE; offerings OFF_VET (VETERAN_HONORABLE only) and OFF_ALL (all six categories)."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Gate Gary", applicant_dob: "1974-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_gt: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_gt}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-6", service_start_date: "1994-01-01", service_end_date: "2000-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_gt: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_gt}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2000-02-01", covers_service_record_id: "${sr_gt}", content_hash: "gt1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_gt}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_gt}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_gt}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_gt: $.data.member_id }
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Gate Kid", applicant_dob: "2001-01-01", basis_type: "FAMILY_DERIVATION", sponsor_member_id: "${m_gt}", claimed_relationship: "CHILD" }
              as: EligibilityApplicant
              captures: { c_gk: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_gk}/evidence"
              payload: { doc_type: "BIRTH_CERTIFICATE", issuing_authority: "TX VR", issued_on: "2001-02-01", content_hash: "gk1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_gk}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_gk}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_gk: $.data.member_id }
            - call: "POST /membership/product-offerings"
              payload: { product_code: "VET_ONLY", product_line: "INVESTMENT", product_name: "Veteran Brokerage", allowed_categories: ["VETERAN_HONORABLE"] }
              as: ProductAdministrator
              captures: { off_vet: $.data.id }
            - call: "POST /membership/product-offerings"
              payload: { product_code: "ALL_CAT", product_line: "BANKING", product_name: "Everyday Checking", allowed_categories: ["OFFICER_CADET", "ENLISTED_ACTIVE", "VETERAN_HONORABLE", "FAMILY_SPOUSE", "FAMILY_WIDOW", "FAMILY_CHILD"] }
              as: ProductAdministrator
              captures: { off_all: $.data.id }
          trigger:
            - call: "POST /membership/members/${m_gk}/entitlements"
              payload: { product_offering_id: "${off_vet}" }
              as: Member
              as_user_id: "${m_gk}"
              captures: { err_gate: $.data.error_id }
            - call: "POST /membership/members/${m_gk}/entitlements"
              payload: { product_offering_id: "${off_all}" }
              as: Member
              as_user_id: "${m_gk}"
              captures: { ent_ok: $.data.id }
          assert:
            - "VET_ONLY open: error_id == ERR_PRODUCT_CATEGORY_FORBIDDEN (422)"
            - "ALL_CAT open succeeds: ProductEntitlement.${ent_ok}.status == OPEN, grandfathered == false"

      - name: extended_lineage_proof_requires_two_doc_types
        claim_type: Conditional validation
        grounds:
          - validations[priority=13]
          - calculations.eligibility_category_assignment
        distinguishing_aspect: "adoption_or_divorce_flag == true switches the approval rule: a case carrying only ONE doc_type at SELF_DECLARED channel fails ERR_LINEAGE_PROOF_INSUFFICIENT; the identical case without the flag approves cleanly — the conditional variant changes validation behavior."
        test_recipe:
          setup:
            - "Sponsor S ACTIVE. Case F1 (adoption_or_divorce_flag true) with one BIRTH_CERTIFICATE; case F2 (flag false, different applicant) with one BIRTH_CERTIFICATE."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Lin Larry", applicant_dob: "1972-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_ll2: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_ll2}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-6", service_start_date: "1992-01-01", service_end_date: "1998-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_ll2: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_ll2}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "1998-02-01", covers_service_record_id: "${sr_ll2}", content_hash: "ll2" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_ll2}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_ll2}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_ll2}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_ll2: $.data.member_id }
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Adopt Ann", applicant_dob: "2000-01-01", basis_type: "FAMILY_DERIVATION", sponsor_member_id: "${m_ll2}", claimed_relationship: "CHILD", adoption_or_divorce_flag: true }
              as: EligibilityApplicant
              captures: { c_ad: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_ad}/evidence"
              payload: { doc_type: "BIRTH_CERTIFICATE", issuing_authority: "TX VR", issued_on: "2000-02-01", content_hash: "ad1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_ad}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Plain Pam", applicant_dob: "2000-06-01", basis_type: "FAMILY_DERIVATION", sponsor_member_id: "${m_ll2}", claimed_relationship: "CHILD" }
              as: EligibilityApplicant
              captures: { c_pp: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_pp}/evidence"
              payload: { doc_type: "BIRTH_CERTIFICATE", issuing_authority: "TX VR", issued_on: "2000-07-01", content_hash: "pp1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_pp}/submit"
              payload: {}
              as: EligibilityApplicant
          trigger:
            - call: "POST /membership/eligibility-cases/${c_ad}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { err_lp: $.data.error_id }
            - call: "POST /membership/eligibility-cases/${c_pp}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_pp: $.data.member_id }
          assert:
            - "Flagged case: error_id == ERR_LINEAGE_PROOF_INSUFFICIENT (one doc_type at SELF_DECLARED fails the extended chain rule)"
            - "Unflagged case with the same single-document evidence: APPROVED, member minted (conditional rule only fires on the flag)"

      - name: stale_version_on_link_household_412
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[household-link-stale-member]
          - validations[priority=19]
        distinguishing_aspect: "Linking with expected_member_version one behind the member's current version fails ERR_STALE_VERSION (412); re-reading and retrying with the fresh version succeeds and bumps version by exactly 1."
        test_recipe:
          setup:
            - "Member M ACTIVE (version captured); household H exists."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Occ Olga", applicant_dob: "1986-06-06", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_ol: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_ol}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-5", service_start_date: "2006-01-01", service_end_date: "2012-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_ol: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_ol}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2012-02-01", covers_service_record_id: "${sr_ol}", content_hash: "ol1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_ol}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_ol}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_ol}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_ol: $.data.member_id }
            - call: "POST /membership/households"
              payload: { household_name: "Olga House", primary_member_id: "${m_ol}" }
              as: Member
              as_user_id: "${m_ol}"
              captures: { h_ol: $.data.id }
            - call: "POST /membership/households"
              payload: { household_name: "Other House", primary_member_id: "${m_ol}" }
              as: Member
              as_user_id: "${m_ol}"
              captures: { h_ol2: $.data.id }
            - call: "POST /membership/members/${m_ol}/delink-household"
              payload: {}
              as: Member
              as_user_id: "${m_ol}"
            - call: "GET /membership/members/${m_ol}"
              payload: {}
              as: Member
              as_user_id: "${m_ol}"
              captures: { v_ol: $.data.version }
            - call: "POST /membership/members/${m_ol}/link-household"
              payload: { household_id: "${h_ol}", expected_member_version: "${v_ol}" }
              as: Member
              as_user_id: "${m_ol}"
          trigger:
            - call: "POST /membership/members/${m_ol}/link-household"
              payload: { household_id: "${h_ol2}", expected_member_version: "${v_ol}" }
              as: Member
              as_user_id: "${m_ol}"
              captures: { err_occ: $.data.error_id }
            - call: "GET /membership/members/${m_ol}"
              payload: {}
              as: Member
              as_user_id: "${m_ol}"
              captures: { v_ol2: $.data.version }
            - call: "POST /membership/members/${m_ol}/link-household"
              payload: { household_id: "${h_ol2}", expected_member_version: "${v_ol2}" }
              as: Member
              as_user_id: "${m_ol}"
          assert:
            - "Stale link (v_ol captured before the interim link bumped the version): error_id == ERR_STALE_VERSION, HTTP 412"
            - "Retry with the fresh version succeeds; Member.${m_ol}.household_id == ${h_ol2} and version incremented by 1"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: product_matrix_computed_read
        claim_type: Computed read
        grounds:
          - endpoints.GET_/membership/members/{memberId}/product-matrix
          - calculations.product_availability_matrix
        distinguishing_aspect: "GET product-matrix reflects the category gate: with one BANKING offering allowing VETERAN_HONORABLE, a VETERAN_HONORABLE member reads available_facet_count 6 with the BANKING group AVAILABLE and INVESTMENT/INSURANCE/DEPLOYMENT all-UNAVAILABLE."
        test_recipe:
          setup:
            - "VETERAN_HONORABLE member M; one BANKING offering gated to VETERAN_HONORABLE."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Mat Mary", applicant_dob: "1982-02-02", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_mm: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_mm}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-6", service_start_date: "2002-01-01", service_end_date: "2008-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_mm: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_mm}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2008-02-01", covers_service_record_id: "${sr_mm}", content_hash: "mm1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_mm}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_mm}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_mm}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_mm: $.data.member_id }
            - call: "POST /membership/product-offerings"
              payload: { product_code: "CK_VET", product_line: "BANKING", product_name: "Veteran Checking", allowed_categories: ["VETERAN_HONORABLE"] }
              as: ProductAdministrator
          trigger:
            - call: "GET /membership/members/${m_mm}/product-matrix"
              payload: {}
              as: Member
              as_user_id: "${m_mm}"
          assert:
            - "available_facet_count == 6"
            - "facets.BANKING == AVAILABLE and facets.INSURANCE == facets.INVESTMENT == facets.DEPLOYMENT == UNAVAILABLE"
            - "eligibility_category == VETERAN_HONORABLE, status == ACTIVE, deployment_posture == NONE"

      - name: duty_station_change_closes_prior_interval
        claim_type: Cross-reference link
        grounds:
          - endpoints.PATCH_/membership/addresses/{addressId}
          - validations[priority=30]
        distinguishing_aspect: "A PCS move is a two-call cross-reference: POST the new is_duty_station APO address whose effective_from equals the day the prior duty interval is closed to via PATCH — legal because the close removes the overlap; posting the same new address WITHOUT the PATCH first fails ERR_DUTY_STATION_CONFLICT."
