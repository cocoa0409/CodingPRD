  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: jeopardy_fraction_four_decimal_threshold_boundary
        grounds:
          - calculations.incidental_take_authorization
          - calculations.incidental_take_authorization.constants.JEOPARDY_FRACTION_THRESHOLD
          - calculations.incidental_take_authorization.precision
          - entities.BiologicalOpinion.fields.jeopardy_fraction
          - entities.BiologicalOpinion.fields.conclusion
          - endpoints["POST /consultations/{id}/biological-opinion"]
        distinguishing_aspect: >-
          METRIC: jeopardy_fraction, a 4-decimal RATIO compared with >= against
          0.0500, probed on POST /consultations/{id}/biological-opinion. Two
          species differing by one individual in recovery_unit_population (81 vs
          80) straddle the threshold from identical exposure and identical
          density, so the boundary is crossed by the denominator rather than by
          the reported quantity.
        test_recipe:
          setup:
            - "SP-81 and SP-80 are both ENDANGERED with take_density_per_acre 0.40 and season months 4..7; they differ only in recovery_unit_population (81 and 80)."
            - "Action A carries one FIELD_SURVEY DETECTED determination for SP-81 with habitat_overlap_acres 10.00 (no critical habitat unit), so exposed_acres 10.00 and authorized_take_units 4.00."
            - "Its consultation is taken to OPINION_ISSUED and the just-below-threshold fraction is captured."
            - "Action B is the mirror image for SP-80, taken as far as UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Rana draytonii", common_name: "California red-legged frog", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 81, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_81_id: "$.data.id"}
            - call: "POST /species"
              payload: {scientific_name: "Ambystoma californiense", common_name: "California tiger salamander", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 80, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_80_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_a_id: "$.data.id"}
            - call: "POST /project-actions/${action_a_id}/presence-determinations"
              payload: {species_id: "${species_81_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 10.00, survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_a_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {cons_a: "$.data.active_consultation_id", effect_a: "$.data.effect_determination"}
            - call: "POST /consultations/${cons_a}/biological-assessment"
              payload: {ba_narrative: "Effects analysis for 10.00 acres of occupied SP-81 habitat.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /consultations/${cons_a}/biological-opinion"
              payload: {}
              as: WildlifeAgency
              as_user_id: "fws-user-issuer"
              captures: {fraction_81: "$.data.jeopardy_fraction", conclusion_81: "$.data.conclusion", rpa_81: "$.data.rpa_required", take_81: "$.data.authorized_take_units", trigger_81: "$.data.reinitiation_trigger_units"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase II", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_b_id: "$.data.id"}
            - call: "POST /project-actions/${action_b_id}/presence-determinations"
              payload: {species_id: "${species_80_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 10.00, survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_b_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {cons_b: "$.data.active_consultation_id"}
            - call: "POST /consultations/${cons_b}/biological-assessment"
              payload: {ba_narrative: "Effects analysis for 10.00 acres of occupied SP-80 habitat.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
          trigger:
            - call: "POST /consultations/${cons_b}/biological-opinion"
              payload: {}
              as: WildlifeAgency
              as_user_id: "fws-user-issuer"
              captures: {bo_b_id: "$.data.id"}
          assert:
            - "the captured ${take_81} == 4.00 (10.00 acres * 0.40 individuals per acre) and ${trigger_81} == 3.60 (4.00 * 0.90)"
            - "the captured ${fraction_81} == 0.0494 (round_half_up(4.00 / 81, 4) from 0.0493827...), ${conclusion_81} == 'NO_JEOPARDY' and ${rpa_81} == false — one ten-thousandth below the threshold"
            - "the trigger returns 201 with authorized_take_units == 4.00 and jeopardy_fraction == 0.0500 (4.00 / 80 exactly)"
            - "the trigger's conclusion == 'JEOPARDY' and rpa_required == true: the comparison is >= against the ROUNDED fraction, so exactly 0.0500 is a jeopardy conclusion"
            - "conclusion is 'JEOPARDY' and not 'JEOPARDY_WITH_RPA' because rpa_description was omitted, and rpa_description is null in the response"
            - "the trigger's reinitiation_trigger_units == 3.60 — identical to the NO_JEOPARDY opinion, so the boundary moves the conclusion without moving the take budget"
            - "GET /project-actions/${action_b_id} reports status == 'CONSULTATION_CONCLUDED': issuing a JEOPARDY opinion never fails, it only blocks the later plan approval"
            - "a third opinion on a species with recovery_unit_population 100 and the same exposure would give jeopardy_fraction 0.0400 and 'NO_JEOPARDY', confirming the threshold is not simply 'any positive fraction'"

