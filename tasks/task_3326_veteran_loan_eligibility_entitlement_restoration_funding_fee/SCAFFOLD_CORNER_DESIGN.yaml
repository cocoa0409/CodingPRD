      - call: POST /va-loans/veterans/${vs5}/loans
        payload:
          coe_id: ${coes5}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 20000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loans5: $.data.id
      - call: POST /va-loans/appraisers
        payload:
          name: App T5a
