      - name: parallel_referral_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Referral
        excluded_because:
          difficulty_instance: non_linear_state_machine / referral_intake_dimension_advances_while_consent_dimension_stays_put
          rationale: "That §1.8 instance is exactly the two-dimension independence claim, asserting intake_status and consent_status separately after each write."

      - name: compensating_side_effects_reverse_on_undo
        claim_type: compensation
        grounds:
          - state_machines.ServiceLine.STAFFED_to_UNSTAFFED
        excluded_because:
          difficulty_instance: compensating_invariant / unstaffing_restores_the_providers_exact_pre_staffing_minute_and_travel_figures
          rationale: "The undo-with-no-drift claim is the entire subject of that §1.8 instance, including the tiered travel term."

      - name: cross_entity_side_effect_from_consent_to_case_and_provider
        claim_type: cross_entity
        grounds:
          - state_machines.Referral.EVALUATION_AUTHORIZED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: transitive_cascade / consent_revocation_cascades_referral_case_assessments_and_chair_capacity
          rationale: "The four-hop consent revocation cascade already asserts the referral, case, assessment and chair-capacity effects."

      - name: ledger_sync_of_provider_minutes_on_child_state_change
        claim_type: ledger_sync
        grounds:
          - calculations.provider_assigned_weekly_minutes
        excluded_because:
          difficulty_instance: transitive_cascade / kindergarten_exit_cascades_plan_lines_provider_minutes_and_seat_release
          rationale: "The exit cascade reconciles the provider minute ledger and the site seat ledger from the child side in one request."

      - name: conditional_cascade_skips_terminal_children
        claim_type: conditional_cascade
        grounds:
          - state_machines.ServicePlan.PENDING_PARENT_CONSENT_to_DECLINED
        excluded_because:
          difficulty_instance: compensating_invariant / iep_seat_count_is_conserved_across_reservation_refusal_and_re_reservation
          rationale: "The refusal path there discontinues the non-terminal line and releases the seat, which is the conditional-cascade claim."

      - name: guarded_transition_requires_a_related_entity_state
        claim_type: guarded_transitions
        grounds:
          - validations[priority=13]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_creation_reads_the_referral_consent_dimension_not_its_intake_dimension
          rationale: "Guarded-transition semantics are asserted there in both directions, with the two Referral dimensions reported by different errors."

  - section: calculations
    instances:

      - name: referral_timeline_reports_both_anchors_and_crosses_the_at_risk_boundary
        claim_type: threshold
        grounds:
          - calculations.referral_evaluation_due_date
          - calculations.evaluation_timeline_compliance
          - endpoints[GET /child-find/referrals/{id}/timeline]
        distinguishing_aspect: |
          The compliance read exposes all three candidate dates and applies only
          the one the pathway selects: a STANDARD_60_DAY referral reports the
          third-birthday cap 2026-08-01 for information while its due date stays
          the consent-anchored 2026-09-30. days_remaining then walks the AT_RISK
          edge exactly - 11 days left is ON_TIME, 10 days is AT_RISK, and a day
          past the due date is OVERDUE with a negative days_remaining.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One child born 2023-08-01 with part_c_enrolled false, so the pathway is STANDARD_60_DAY and the third birthday 2026-08-01 is already behind the referral."
