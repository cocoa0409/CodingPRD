# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x 2 instances = 18 instances. Every recipe replays from empty DB
# using only endpoints declared in SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: unmatched_income_provisional_spread_vs_final_suspense
        grounds:
          - calculations.split_pool_allocation
          - calculations.provisional_unmatched_spread
          - state_machines.RoyaltyStatement.MATCHING_REVIEW_to_ALLOCATED
          - state_machines.RoyaltyStatement.ALLOCATED_to_FINALIZED
          - entities.RoyaltyStatement.fields.suspense_cents
        distinguishing_aspect: |
          Royalty-allocation domain: identical statement data yields different
          per-writer amounts under the two variants — provisional (allocate)
          spreads unmatched gross pro-rata across matched lines; final
          (finalize) routes unmatched gross to suspense_cents instead.
        test_recipe:
          setup:
            - "Writers W1, W2; Works K1 (writer W1 10000bp + publisher 10000bp) and K2 (writer W2 10000bp + publisher 10000bp), both with CONFIRMED split sets and REGISTERED registration_status"
            - "Licensee L; one statement: 3 lines gross 6000 (matched K1), 4000 (matched K2), 2000 (unmatched); header gross 12000"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "Writer One", ipi_number: "00000000101", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /writers", payload: { legal_name: "Writer Two", ipi_number: "00000000102", pro_affiliation: "BMI" }, as: PublisherAdmin, captures: { w2: $.data.id } }
            - { call: "POST /works", payload: { title: "Song K1", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k1: $.data.id, k1_code: $.data.work_code, k1_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k1}", expected_work_version: "${k1_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss1: $.data.id } }
            - { call: "POST /split-sets/${ss1}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss1}", as: PublisherAdmin, captures: { ss1_l1: "$.data[0].id", ss1_l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${ss1_l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${ss1_l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /works", payload: { title: "Song K2", grant_date: "1995-01-01T00:00:00Z" }, as: PublisherAdmin, captures: { k2: $.data.id, k2_code: $.data.work_code, k2_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k2}", expected_work_version: "${k2_v}", lines: [ { participant_type: WRITER, writer_id: "${w2}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss2: $.data.id } }
            - { call: "POST /split-sets/${ss2}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss2}", as: PublisherAdmin, captures: { ss2_l1: "$.data[0].id", ss2_l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${ss2_l1}/confirm", payload: {}, as: Writer, as_user_id: "${w2}" }
            - { call: "POST /split-lines/${ss2_l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k1}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg1: $.data.id } }
            - { call: "POST /society-registrations/${reg1}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg1}/acknowledge", payload: { society_work_number: "880000001" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg1}/register", payload: { iswc: "T-900000001-1" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations", payload: { work_id: "${k2}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg2: $.data.id } }
            - { call: "POST /society-registrations/${reg2}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg2}/acknowledge", payload: { society_work_number: "880000002" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg2}/register", payload: { iswc: "T-900000002-2" }, as: CopyrightSpecialist }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 12000, lines: [ { line_number: 1, reported_title: "Song K1", reported_work_code: "${k1_code}", gross_cents: 6000 }, { line_number: 2, reported_title: "Song K2", reported_work_code: "${k2_code}", gross_cents: 4000 }, { line_number: 3, reported_title: "Unknown Track", gross_cents: 2000 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
            - { call: "POST /royalty-statements/${st}/match", payload: {}, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements/${st}/allocate", payload: {}, as: RoyaltyAnalyst }
            - { call: "GET /allocation-lines?statement_id=${st}&writer_id=${w1}", as: RoyaltyAnalyst, captures: { w1_prov: "$.data[0].provisional_amount_cents" } }
            - { call: "GET /allocation-lines?statement_id=${st}&writer_id=${w2}", as: RoyaltyAnalyst, captures: { w2_prov: "$.data[0].provisional_amount_cents" } }
            - { call: "GET /royalty-statements/${st}", as: RoyaltyAnalyst, captures: { st_susp_prov: $.data.suspense_cents, st_alloc_prov: $.data.allocated_total_cents } }
            - { call: "POST /royalty-statements/${st}/finalize", payload: {}, as: RoyaltyAnalyst }
            - { call: "GET /allocation-lines?statement_id=${st}&writer_id=${w1}", as: RoyaltyAnalyst, captures: { w1_fin: "$.data[0].final_amount_cents" } }
            - { call: "GET /allocation-lines?statement_id=${st}&writer_id=${w2}", as: RoyaltyAnalyst, captures: { w2_fin: "$.data[0].final_amount_cents" } }
            - { call: "GET /royalty-statements/${st}", as: RoyaltyAnalyst, captures: { st_susp_fin: $.data.suspense_cents, st_alloc_fin: $.data.allocated_total_cents } }
          assert:
            - "${w1_prov} == 3600 (provisional spread: 6000 + floor(2000*6000/10000) = 7200 effective; writer pool floor(7200/2) = 3600)"
            - "${w2_prov} == 2400 (4000 + 800 = 4800 effective; pool 2400)"
            - "${st_susp_prov} == 0 and ${st_alloc_prov} == 12000"
            - "${w1_fin} == 3000 and ${w2_fin} == 2000 (final variant: no spread)"
            - "${st_susp_fin} == 2000 and ${st_alloc_fin} == 10000"
            - "${w1_prov} != ${w1_fin} — identical input data, different variant results"

      - name: audit_claim_actual_vs_extrapolated_valuation
        grounds:
          - calculations.audit_claim_valuation
          - entities.LicenseeAudit.fields.claim_amount_cents
          - state_machines.LicenseeAudit.FIELDWORK_to_FINDINGS_ISSUED
        distinguishing_aspect: |
          Audit domain (different entity domain from royalty allocation):
          identical findings inputs produce claim 40000 under ACTUAL_SHORTFALL
          but 160000 under EXTRAPOLATED.
        test_recipe:
          setup:
            - "Licensee L; audit A over 2025-H1 with valuation_method ACTUAL_SHORTFALL; audit B over 2025-H2 with EXTRAPOLATED (adjacent closed periods share no date)"
          setup_api_calls:
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /licensee-audits", payload: { licensee_id: "${lic}", period_start: "2025-01-01T00:00:00Z", period_end: "2025-06-30T23:59:59Z", valuation_method: "ACTUAL_SHORTFALL" }, as: Auditor, captures: { aud_a: $.data.id } }
            - { call: "POST /licensee-audits/${aud_a}/begin-fieldwork", payload: {}, as: Auditor }
            - { call: "POST /licensee-audits", payload: { licensee_id: "${lic}", period_start: "2025-07-01T00:00:00Z", period_end: "2025-12-31T23:59:59Z", valuation_method: "EXTRAPOLATED" }, as: Auditor, captures: { aud_b: $.data.id } }
            - { call: "POST /licensee-audits/${aud_b}/begin-fieldwork", payload: {}, as: Auditor }
          trigger:
            - { call: "POST /licensee-audits/${aud_a}/issue-findings", payload: { actual_shortfall_cents: 40000 }, as: Auditor, captures: { claim_a: $.data.claim_amount_cents } }
            - { call: "POST /licensee-audits/${aud_b}/issue-findings", payload: { actual_shortfall_cents: 40000, sampled_base_cents: 250000, reported_base_cents: 1000000 }, as: Auditor, captures: { claim_b: $.data.claim_amount_cents } }
          assert:
            - "${claim_a} == 40000 (ACTUAL_SHORTFALL returns the proven shortfall)"
            - "${claim_b} == 160000 (EXTRAPOLATED: floor(40000 * 1000000 / 250000))"
            - "${claim_a} != ${claim_b} — same proven shortfall, different valuation variant"

  - rule_id: combinatorial_formula
    instances:
      - name: split_allocation_per_line_floor_then_remainder
        grounds:
          - calculations.split_pool_allocation
          - entities.AllocationLine.fields.provisional_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-line floor THEN
          remainder distribution (remainder cent to the largest share_bp,
          tie-break SplitLine.created_at ASC), and pins the pool split as
          floor-to-writer-pool with the odd cent going to the publisher pool.
          Sum-then-round would give a different cent assignment.
        test_recipe:
          setup:
            - "Writers W1, W2, W3; Work K with split set: W1 3333bp, W2 3333bp, W3 3334bp, publisher 10000bp; work REGISTERED"
            - "One statement with a single matched line gross 9999 cents, territory US (no sub-publisher), header gross 9999"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000000201", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /writers", payload: { legal_name: "W2", ipi_number: "00000000202", pro_affiliation: "BMI" }, as: PublisherAdmin, captures: { w2: $.data.id } }
            - { call: "POST /writers", payload: { legal_name: "W3", ipi_number: "00000000203", pro_affiliation: "SESAC" }, as: PublisherAdmin, captures: { w3: $.data.id } }
            - { call: "POST /works", payload: { title: "Rounding Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_code: $.data.work_code, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 3333 }, { participant_type: WRITER, writer_id: "${w2}", share_bp: 3333 }, { participant_type: WRITER, writer_id: "${w3}", share_bp: 3334 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id", l3: "$.data[2].id", l4: "$.data[3].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: Writer, as_user_id: "${w2}" }
            - { call: "POST /split-lines/${l3}/confirm", payload: {}, as: Writer, as_user_id: "${w3}" }
            - { call: "POST /split-lines/${l4}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000010" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000010-1" }, as: CopyrightSpecialist }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 9999, lines: [ { line_number: 1, reported_title: "Rounding Song", reported_work_code: "${k_code}", gross_cents: 9999 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
            - { call: "POST /royalty-statements/${st}/match", payload: {}, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements/${st}/allocate", payload: {}, as: RoyaltyAnalyst }
            - { call: "GET /allocation-lines?statement_id=${st}", as: RoyaltyAnalyst, captures: { a0: "$.data[0].provisional_amount_cents", a1: "$.data[1].provisional_amount_cents", a2: "$.data[2].provisional_amount_cents", a3: "$.data[3].provisional_amount_cents" } }
            - { call: "GET /royalty-statements/${st}", as: RoyaltyAnalyst, captures: { tot: $.data.allocated_total_cents, ret: $.data.retained_cents } }
          assert:
            - "${a0} == 1666 (writer pool floor(9999/2)=4999; floor(4999*3333/10000)=1666)"
            - "${a1} == 1666"
            - "${a2} == 1667 (remainder 4999-4998=1 cent goes to largest share_bp 3334 = W3)"
            - "${a3} == 5000 (publisher pool = net - writer_pool = 9999-4999; odd cent lands in publisher pool)"
            - "${tot} == 9999 and ${ret} == 0 (gross conserved: allocated + retained + suspense == gross)"

      - name: recoupment_waterfall_multifactor_chain
        grounds:
          - calculations.writer_recoupment_waterfall
          - state_machines.Advance.PAID_to_RECOUPING
          - state_machines.Advance.RECOUPING_to_RECOUPED
        distinguishing_aspect: |
          Mode (a) formula with >= 3 inputs and non-linear interaction: nested
          min(remaining x recoup_rate, outstanding) over a state- and
          chronological-ordered advance chain — different from instance
          split_allocation_per_line_floor_then_remainder's mode (b).
        test_recipe:
          setup:
            - "Writer W with two PAID advances: A1 3000 @ 10000bp (paid first), A2 2000 @ 5000bp (paid one logical day later)"
            - "Work K with W at 10000bp writer share + publisher 10000bp, CONFIRMED and REGISTERED"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W", ipi_number: "00000000301", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w: $.data.id, w_v1: $.data.version } }
            - { call: "POST /works", payload: { title: "Waterfall Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_code: $.data.work_code, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000020" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000020-1" }, as: CopyrightSpecialist }
            - { call: "POST /advances", payload: { writer_id: "${w}", expected_writer_version: "${w_v1}", agreement_ref: "A1", amount_cents: 3000, recoup_rate_bp: 10000 }, as: PublisherAdmin, captures: { a1: $.data.id } }
            - { call: "POST /advances/${a1}/approve", payload: {}, as: FinanceManager }
            - { call: "POST /advances/${a1}/pay", payload: {}, as: FinanceManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PublisherAdmin }
            - { call: "GET /writers/${w}", as: PublisherAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /advances", payload: { writer_id: "${w}", expected_writer_version: "${w_v2}", agreement_ref: "A2", amount_cents: 2000, recoup_rate_bp: 5000 }, as: PublisherAdmin, captures: { a2: $.data.id } }
            - { call: "POST /advances/${a2}/approve", payload: {}, as: FinanceManager }
            - { call: "POST /advances/${a2}/pay", payload: {}, as: FinanceManager }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 2000, lines: [ { line_number: 1, reported_title: "Waterfall Song", reported_work_code: "${k_code}", gross_cents: 2000 } ] }, as: RoyaltyAnalyst, captures: { st1: $.data.id } }
            - { call: "POST /royalty-statements/${st1}/match", payload: {}, as: RoyaltyAnalyst }
            - { call: "POST /royalty-statements/${st1}/allocate", payload: {}, as: RoyaltyAnalyst }
            - { call: "POST /royalty-statements/${st1}/finalize", payload: {}, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", gross_amount_cents: 5000, lines: [ { line_number: 1, reported_title: "Waterfall Song", reported_work_code: "${k_code}", gross_cents: 5000 } ] }, as: RoyaltyAnalyst, captures: { st2: $.data.id } }
            - { call: "POST /royalty-statements/${st2}/match", payload: {}, as: RoyaltyAnalyst }
            - { call: "POST /royalty-statements/${st2}/allocate", payload: {}, as: RoyaltyAnalyst }
            - { call: "POST /royalty-statements/${st2}/finalize", payload: {}, as: RoyaltyAnalyst }
            - { call: "GET /advances/${a1}", as: PublisherAdmin, captures: { a1_status: $.data.status, a1_rec: $.data.recouped_cents, a1_out: $.data.outstanding_cents } }
            - { call: "GET /advances/${a2}", as: PublisherAdmin, captures: { a2_status: $.data.status, a2_rec: $.data.recouped_cents, a2_out: $.data.outstanding_cents } }
            - { call: "GET /writers/${w}", as: PublisherAdmin, captures: { w_pay: $.data.payable_balance_cents, w_adv_out: $.data.advance_outstanding_cents } }
          assert:
            - "After S1 finalize (writer final 1000): A1 recouped 1000, outstanding 2000, status RECOUPING; A2 untouched"
            - "${a1_status} == RECOUPED and ${a1_rec} == 3000 and ${a1_out} == 0 (S2: budget 2500, applied min(2500, 2000) = 2000, exact-zero crossing)"
            - "${a2_status} == RECOUPING and ${a2_rec} == 250 and ${a2_out} == 1750 (budget floor(500 * 5000/10000) = 250, NOT the full 500 remainder)"
            - "${w_pay} == 250 and ${w_adv_out} == 1750"

  - rule_id: non_linear_state_machine
    instances:
      - name: split_set_dispute_revision_cycle
        grounds:
          - state_machines.SplitSet.PENDING_CONFIRMATIONS_to_DISPUTED
          - state_machines.SplitSet.DISPUTED_to_DRAFT
          - state_machines.SplitSet.PENDING_CONFIRMATIONS_to_CONFIRMED
          - state_machines.SplitLine.PENDING_to_REJECTED
        distinguishing_aspect: |
          Cyclic machine on SplitSet: DRAFT -> PENDING_CONFIRMATIONS ->
          DISPUTED -> DRAFT -> PENDING_CONFIRMATIONS -> CONFIRMED, with the
          compound bubble-up that line-level rejections/confirmations drive
          the parent set's state.
        test_recipe:
          setup:
            - "Writers W1, W2; Work K; SplitSet S in PENDING_CONFIRMATIONS with lines W1 6000bp, W2 4000bp, publisher 10000bp"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000000401", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /writers", payload: { legal_name: "W2", ipi_number: "00000000402", pro_affiliation: "BMI" }, as: PublisherAdmin, captures: { w2: $.data.id } }
            - { call: "POST /works", payload: { title: "Cycle Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 6000 }, { participant_type: WRITER, writer_id: "${w2}", share_bp: 4000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id", l3: "$.data[2].id" } }
          trigger:
            - { call: "POST /split-lines/${l2}/reject", payload: { reason: "share too low" }, as: Writer, as_user_id: "${w2}" }
            - { call: "GET /split-sets/${ss}", as: PublisherAdmin, captures: { st_disputed: $.data.status, why: $.data.dispute_reason } }
            - { call: "POST /split-sets/${ss}/revise", payload: { lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 5000 }, { participant_type: WRITER, writer_id: "${w2}", share_bp: 5000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin }
            - { call: "GET /split-sets/${ss}", as: PublisherAdmin, captures: { st_draft: $.data.status, why2: $.data.dispute_reason } }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { n1: "$.data[0].id", n1_st: "$.data[0].confirmation_status", n1_sh: "$.data[0].share_bp" } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "POST /split-lines/${n1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { n2: "$.data[1].id", n3: "$.data[2].id" } }
            - { call: "POST /split-lines/${n2}/confirm", payload: {}, as: Writer, as_user_id: "${w2}" }
            - { call: "POST /split-lines/${n3}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-sets/${ss}", as: PublisherAdmin, captures: { st_final: $.data.status } }
          assert:
            - "${st_disputed} == DISPUTED and ${why} == 'share too low' (line rejection bubbles up)"
            - "${st_draft} == DRAFT and ${why2} == null (revise completes the cycle back to DRAFT)"
            - "After revise the set has exactly 3 lines, all PENDING, first line share_bp 5000 (${n1_st} == PENDING, ${n1_sh} == 5000)"
            - "${st_final} == CONFIRMED (last confirmation bubbles up)"

      - name: licensee_audit_appeal_cycle
        grounds:
          - state_machines.LicenseeAudit.FINDINGS_ISSUED_to_UNDER_APPEAL
          - state_machines.LicenseeAudit.UNDER_APPEAL_to_FINDINGS_ISSUED
          - calculations.audit_claim_valuation
        distinguishing_aspect: |
          Cyclic machine on LicenseeAudit (different entity from SplitSet):
          FIELDWORK -> FINDINGS_ISSUED -> UNDER_APPEAL -> FINDINGS_ISSUED, and
          the second issue-findings recomputes claim_amount_cents from new
          inputs rather than preserving the first claim.
        test_recipe:
          setup:
            - "Licensee L; EXTRAPOLATED audit over calendar 2025, in FIELDWORK"
          setup_api_calls:
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /licensee-audits", payload: { licensee_id: "${lic}", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T23:59:59Z", valuation_method: "EXTRAPOLATED" }, as: Auditor, captures: { aud: $.data.id } }
            - { call: "POST /licensee-audits/${aud}/begin-fieldwork", payload: {}, as: Auditor }
          trigger:
            - { call: "POST /licensee-audits/${aud}/issue-findings", payload: { actual_shortfall_cents: 40000, sampled_base_cents: 250000, reported_base_cents: 1000000 }, as: Auditor, captures: { claim1: $.data.claim_amount_cents, st1: $.data.status } }
            - { call: "POST /licensee-audits/${aud}/appeal", payload: { reason: "licensee disputes sample" }, as: Auditor, captures: { st2: $.data.status } }
            - { call: "POST /licensee-audits/${aud}/issue-findings", payload: { actual_shortfall_cents: 30000, sampled_base_cents: 250000, reported_base_cents: 1000000 }, as: Auditor, captures: { claim2: $.data.claim_amount_cents, st3: $.data.status } }
          assert:
            - "${st1} == FINDINGS_ISSUED and ${claim1} == 160000"
            - "${st2} == UNDER_APPEAL (cycle loops back)"
            - "${st3} == FINDINGS_ISSUED and ${claim2} == 120000 (floor(30000*1000000/250000); claim recomputed, not retained)"

  - rule_id: transitive_cascade
    instances:
      - name: statement_finalize_recoupment_chain
        grounds:
          - state_machines.RoyaltyStatement.ALLOCATED_to_FINALIZED
          - calculations.writer_recoupment_waterfall
          - state_machines.Advance.RECOUPING_to_RECOUPED
          - calculations.writer_balance_rollup
          - calculations.work_royalty_rollup
        distinguishing_aspect: |
          Depth-4 chain from POST /royalty-statements/{id}/finalize: statement
          FINALIZED -> AllocationLine rows mutated to FINAL with
          advance_applied_cents -> Advance.recouped_cents/outstanding_cents
          mutated -> Advance auto-transitions RECOUPING->RECOUPED at exact
          zero -> Writer payable/lifetime/advance_outstanding and Work rollup
          recomputed. Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Writer W with one PAID advance A (1000 @ 10000bp); Work K with W 10000bp + publisher 10000bp CONFIRMED and REGISTERED"
            - "Statement S1 (period Q1) with one matched line gross 2000, ALLOCATED"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W", ipi_number: "00000000501", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w: $.data.id, w_v: $.data.version } }
            - { call: "POST /works", payload: { title: "Cascade Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_code: $.data.work_code, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000030" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000030-1" }, as: CopyrightSpecialist }
            - { call: "POST /advances", payload: { writer_id: "${w}", expected_writer_version: "${w_v}", agreement_ref: "A", amount_cents: 1000 }, as: PublisherAdmin, captures: { adv: $.data.id } }
            - { call: "POST /advances/${adv}/approve", payload: {}, as: FinanceManager }
            - { call: "POST /advances/${adv}/pay", payload: {}, as: FinanceManager }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 2000, lines: [ { line_number: 1, reported_title: "Cascade Song", reported_work_code: "${k_code}", gross_cents: 2000 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
            - { call: "POST /royalty-statements/${st}/match", payload: {}, as: RoyaltyAnalyst }
            - { call: "POST /royalty-statements/${st}/allocate", payload: {}, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements/${st}/finalize", payload: {}, as: RoyaltyAnalyst, captures: { st_status: $.data.status } }
            - { call: "GET /allocation-lines?statement_id=${st}&writer_id=${w}", as: RoyaltyAnalyst, captures: { al_status: "$.data[0].status", al_fin: "$.data[0].final_amount_cents", al_applied: "$.data[0].advance_applied_cents", al_net: "$.data[0].net_payable_cents" } }
            - { call: "GET /advances/${adv}", as: PublisherAdmin, captures: { adv_status: $.data.status, adv_rec: $.data.recouped_cents, adv_out: $.data.outstanding_cents } }
            - { call: "GET /writers/${w}", as: PublisherAdmin, captures: { w_pay: $.data.payable_balance_cents, w_life: $.data.lifetime_earned_cents, w_advout: $.data.advance_outstanding_cents } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { k_collected: $.data.total_collected_cents } }
          assert:
            - "${st_status} == FINALIZED (link 1)"
            - "${al_status} == FINAL and ${al_fin} == 1000 and ${al_applied} == 1000 and ${al_net} == 0 (link 2: allocation mutated, waterfall applied)"
            - "${adv_status} == RECOUPED and ${adv_rec} == 1000 and ${adv_out} == 0 (link 3: advance mutation caused auto-transition at exact zero)"
            - "${w_pay} == 0 and ${w_life} == 1000 and ${w_advout} == 0 (link 4: writer rollups recomputed)"
            - "${k_collected} == 2000 (work rollup recomputed)"

      - name: termination_effective_rights_reversion_chain
        grounds:
          - state_machines.TerminationClaim.NOTICE_FILED_to_EFFECTIVE
          - state_machines.Work.copyright_status_UNFILED_FILED_COPCO_REGISTERED_to_TERMINATED
          - state_machines.SplitSet.DRAFT_PENDING_CONFIRMATIONS_DISPUTED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (POST
          /termination-claims/{id}/make-effective): claim EFFECTIVE ->
          Work.copyright_status TERMINATED -> non-terminal SplitSets CANCELLED
          -> their PENDING SplitLines REJECTED (while CONFIRMED lines survive:
          conditional cascade).
        test_recipe:
          setup:
            - "Work K (grant 1990-06-15; window [2025-06-15, 2030-06-15]) with a SplitSet in PENDING_CONFIRMATIONS: writer line CONFIRMED, publisher line still PENDING"
            - "TerminationClaim for K with intended_effective_date 2028-06-15 (notice window [2018-06-15, 2026-06-15])"
            - "Logical clock at 2026-01-01 (inside notice window; claim derived NOTICE_WINDOW_OPEN)"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000000601", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Old Catalog Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /termination-claims", payload: { work_id: "${k}", statute_basis: "SEC_203", intended_effective_date: "2028-06-15T00:00:00Z" }, as: CopyrightSpecialist, captures: { tc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: PublisherAdmin }
            - { call: "POST /termination-claims/${tc}/file-notice", payload: { notice_ref: "N-2026-001" }, as: CopyrightSpecialist }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-06-15T00:00:00Z" }, as: PublisherAdmin }
            - { call: "POST /termination-claims/${tc}/make-effective", payload: {}, as: CopyrightSpecialist, captures: { tc_st: $.data.status } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { k_cop: $.data.copyright_status } }
            - { call: "GET /split-sets/${ss}", as: PublisherAdmin, captures: { ss_st: $.data.status } }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1_st: "$.data[0].confirmation_status", l2_st: "$.data[1].confirmation_status", l2_why: "$.data[1].rejection_reason" } }
          assert:
            - "${tc_st} == EFFECTIVE (trigger)"
            - "${k_cop} == TERMINATED (link 1: cross-entity)"
            - "${ss_st} == CANCELLED (link 2: cascade from work state, not from the endpoint directly)"
            - "${l2_st} == REJECTED and ${l2_why} == 'WORK_RIGHTS_TERMINATED' (link 3: cascade from set cancellation)"
            - "${l1_st} == CONFIRMED (conditional cascade: only PENDING lines rejected)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminated_work_safety_beats_split_sum_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_WORK_RIGHTS_TERMINATED]
          - errors[ERR_SPLIT_SUM_INVALID]
        distinguishing_aspect: |
          Error-category pair business_safety (P6) vs business_constraint (P9):
          one request violating both (TERMINATED work AND writer pool 9000bp)
          must return ERR_WORK_RIGHTS_TERMINATED, not ERR_SPLIT_SUM_INVALID.
        test_recipe:
          setup:
            - "Work K terminated via a full termination chain (grant 1990-06-15; intended effective 2028-06-15; notice filed at clock 2026-01-01; effective at clock 2028-06-15)"
            - "Writer W1 exists"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000000701", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Terminated Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id } }
            - { call: "POST /termination-claims", payload: { work_id: "${k}", statute_basis: "SEC_203", intended_effective_date: "2028-06-15T00:00:00Z" }, as: CopyrightSpecialist, captures: { tc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: PublisherAdmin }
            - { call: "POST /termination-claims/${tc}/file-notice", payload: { notice_ref: "N-1" }, as: CopyrightSpecialist }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-06-15T00:00:00Z" }, as: PublisherAdmin }
            - { call: "POST /termination-claims/${tc}/make-effective", payload: {}, as: CopyrightSpecialist }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { k_v: $.data.version } }
          trigger:
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 9000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_WORK_RIGHTS_TERMINATED (safety P6 beats constraint P9 although the writer pool sums to 9000 != 10000)"

      - name: suspended_sub_publisher_referential_beats_coverage_overlap_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SUB_PUBLISHER_NOT_ACTIVE]
          - errors[ERR_COVERAGE_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_referential (P7) vs business_temporal
          (P8) — different pair from the other instance: activating an
          agreement whose sub-publisher is SUSPENDED AND whose coverage
          overlaps an ACTIVE agreement must return ERR_SUB_PUBLISHER_NOT_ACTIVE.
        test_recipe:
          setup:
