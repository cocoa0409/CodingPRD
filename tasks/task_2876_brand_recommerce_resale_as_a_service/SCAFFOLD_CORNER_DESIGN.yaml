      - name: channel_crud_and_campaign_subresource_routing
        claim_type: standard_crud
        grounds:
          - endpoints[POST /recommerce/channels]
          - endpoints[GET /recommerce/channels/{id}]
          - endpoints[PATCH /recommerce/channels/{id}]
          - endpoints[GET /recommerce/channels/{id}/markdown-campaigns]
        distinguishing_aspect: "A channel round-trips create → read → PATCH status with version incrementing only on the PATCH, and its markdown-campaign sub-resource listing goes from total_count 0 to total_count 1 while a second channel's listing stays empty — proving the sub-resource is scoped by the path id and not a global listing."
        test_recipe:
          setup:
            - "Two channels are created; only the first receives a markdown campaign."
          setup_api_calls:
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-MP", channel_type: "RESALE_MARKETPLACE", allowed_assortment: "RESALE_ONLY", max_resale_price_ratio_bp: 7000, region_code: "US-CA" }
