# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3215_spring_training_complex_operations_roster_assignment
#
# 20 instances across the nine §0.5 Difficulty Rules. Every instance grounds in
# elements already declared in SCAFFOLD.yaml §1.1–§1.7 and replays its
# setup_api_calls against that same scaffold's §1.2 / §1.4 / §1.6.
# All numeric assertions are pre-computed literals from the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: recognition_raise_and_void_are_equal_and_opposite
        grounds:
          - calculations.RecognitionAllocation
          - calculations.RecognitionAllocation.variants.RECOGNITION_RAISE
          - calculations.RecognitionAllocation.variants.RECOGNITION_VOID
          - endpoints.POST_/camp-ops/sponsorships/{sponsorshipId}/recognize
          - endpoints.POST_/camp-ops/sponsorships/{sponsorshipId}/void-settlement
        distinguishing_aspect: "On the Sponsorship/HostCommunityRecord domain the RECOGNITION_RAISE variant adds exactly 62500 cents to recognition_funded_cents while RECOGNITION_VOID subtracts the same 62500 from the identical corpus, so the community ledger's conserved quantity returns to its pre-raise value."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z on a DEDICATED-track complex with a host-community agreement carrying ticket_price_cents 2500 and major/minor sponsorship bases 250000/100000."
            - "One MAJOR-bucket published workout group on that complex with exactly one member pitcher."
            - "One UNCOMMITTED sponsorship is absent; instead one LOCAL sponsorship for 20000 cents is contributed to over its full commitment, settled, then recognized."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /camp-ops/community-agreements"
              payload: { complex_id: "${cx_id}", stadium_name: "Sloan Park", lease_start_date: "2026-01-01T00:00:00Z", lease_end_date: "2026-03-31T23:59:59Z", annual_rent_cents: 250000, sponsorship_minor_league_base_cents: 100000, sponsorship_major_league_base_cents: 250000, ticket_price_cents: 2500, ticket_sellout_capacity: 100 }
              as: CommunityLiaison
              captures: { ag_id: $.data.id }
            - call: "POST /camp-ops/community-agreements/${ag_id}/activate"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/community-agreements/${ag_id}/host-community-record"
              payload: { agreement_id: "${ag_id}" }
              as: CommunityLiaison
              captures: { hcr_id: $.data.id }
            - call: "POST /camp-ops/host-community-records/${hcr_id}/open-ticketing"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/host-community-records/${hcr_id}/sell-tickets"
              payload: { quantity: 2 }
              as: CommunityLiaison
            - call: "POST /camp-ops/players"
              payload: { full_name: "Ari Calvo", idp_number: "IDP-40101", position_code: "P", acquisition_channel: "CAMP_INVITEE", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx_id}" }
              as: RosterManager
              captures: { pl_id: $.data.id }
            - call: "POST /camp-ops/players/${pl_id}/roster-record"
              payload: { player_id: "${pl_id}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl_id}/program-profile"
              payload: { player_id: "${pl_id}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl_id}/camp-invitations"
              payload: { player_id: "${pl_id}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
              captures: { inv_id: $.data.id }
            - call: "POST /camp-ops/players/${pl_id}/physicals"
              payload: { player_id: "${pl_id}", scheduled_visit_date: "2026-01-02T00:00:00Z" }
              as: TeamPhysician
              captures: { ph_id: $.data.id }
            - call: "POST /camp-ops/physicals/${ph_id}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/complexes/${cx_id}/workout-groups"
              payload: { complex_id: "${cx_id}", roster_bucket: "MAJOR", group_name: "Pitchers Group A", facility_kind: "FIELD", capacity_units: 40 }
              as: ComplexDirector
              captures: { wg_id: $.data.id, wg_v: $.data.version }
            - call: "POST /camp-ops/workout-groups/${wg_id}/assignments"
              payload: { workout_group_id: "${wg_id}", player_id: "${pl_id}", roster_bucket: "MAJOR", assignment_kind: "ACTIVE_WORKOUT", expected_group_version: "${wg_v}" }
              as: FieldCoordinator
            - call: "POST /camp-ops/workout-groups/${wg_id}/publish"
              payload: { expected_group_version: "${wg_v}" }
              as: ComplexDirector
            - call: "POST /camp-ops/host-community-records/${hcr_id}/sponsorships"
              payload: { host_community_record_id: "${hcr_id}", sponsor_name: "Desert Auto Group", sponsor_tier: "LOCAL", committed_amount_cents: 20000 }
              as: CommunityLiaison
              captures: { sp_id: $.data.id }
            - call: "POST /camp-ops/sponsorships/${sp_id}/contribute"
              payload: { amount_cents: 20000, direction: "CONTRIBUTE" }
              as: CommunityLiaison
            - call: "POST /camp-ops/sponsorships/${sp_id}/settle"
              payload: {}
              as: CommunityLiaison
          trigger:
            - call: "POST /camp-ops/sponsorships/${sp_id}/recognize"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/sponsorships/${sp_id}/void-settlement"
              payload: {}
              as: CommunityLiaison
          assert:
            - "after recognize, HostCommunityRecord.${hcr_id}.recognition_funded_cents == 62500"
            - "after recognize, HostCommunityRecord.${hcr_id}.community_ledger_cents == 5000"
            - "after recognize, HostCommunityRecord.${hcr_id}.ledger_gap_cents == -57500"
            - "after void-settlement, HostCommunityRecord.${hcr_id}.recognition_funded_cents == 0"
            - "after void-settlement, HostCommunityRecord.${hcr_id}.ledger_gap_cents == 5000"
            - "Sponsorship.${sp_id}.reconciliation_status == SETTLEMENT_VOIDED and fulfillment_completed == false"

      - name: travel_funding_diverges_between_agreement_and_reimbursement
        grounds:
          - calculations.TravelCostAllocation
          - calculations.TravelCostAllocation.variants.AGREEMENT_FUND_PER_LEG
          - calculations.TravelCostAllocation.variants.REIMBURSEMENT_HOLDBACK
          - calculations.TravelFundingSourceCalculation
          - calculations.TravelFundingSourceCalculation.variants.CLUB_REIMBURSED
        distinguishing_aspect: "One 50000-cent AIR arrangement at 300 miles is confirmed twice on the same complex — once while the host-community agreement is ACTIVE (funding_source AGREEMENT_FUND, agreement_funded_cents 49750) and once after the agreement has been terminated (funding_source REIMBURSEMENT, reimbursement_cents 47500) — so identical inputs land on different numbers purely through the funding-source selector."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex with an ACTIVE host-community agreement carrying ticket_price_cents 2500 and major/minor sponsorship bases 250000/100000."
            - "One domestic pitcher with a sent-letter invitation and a cleared physical; a second domestic pitcher on the same complex with no agreement in play."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Riverview Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /camp-ops/community-agreements"
              payload: { complex_id: "${cx_id}", stadium_name: "Riverview Park", lease_start_date: "2026-01-01T00:00:00Z", lease_end_date: "2026-03-31T23:59:59Z", annual_rent_cents: 250000, sponsorship_minor_league_base_cents: 100000, sponsorship_major_league_base_cents: 250000, ticket_price_cents: 2500, ticket_sellout_capacity: 100 }
              as: CommunityLiaison
              captures: { ag_id: $.data.id }
            - call: "POST /camp-ops/community-agreements/${ag_id}/activate"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/community-agreements/${ag_id}/host-community-record"
              payload: { agreement_id: "${ag_id}" }
              as: CommunityLiaison
              captures: { hcr_id: $.data.id }
            - call: "POST /camp-ops/host-community-records/${hcr_id}/open-ticketing"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/host-community-records/${hcr_id}/sell-tickets"
              payload: { quantity: 4 }
              as: CommunityLiaison
            - call: "POST /camp-ops/players"
              payload: { full_name: "Nico Ferran", idp_number: "IDP-40201", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx_id}" }
              as: RosterManager
              captures: { pl_a: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Owen Marsh", idp_number: "IDP-40202", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx_id}" }
              as: RosterManager
              captures: { pl_b: $.data.id }
            - call: "POST /camp-ops/players/${pl_a}/roster-record"
              payload: { player_id: "${pl_a}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl_b}/roster-record"
              payload: { player_id: "${pl_b}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl_a}/program-profile"
              payload: { player_id: "${pl_a}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl_b}/program-profile"
              payload: { player_id: "${pl_b}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl_a}/camp-invitations"
              payload: { player_id: "${pl_a}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
              captures: { inv_a: $.data.id, inv_a_v: $.data.version }
            - call: "POST /camp-ops/players/${pl_b}/camp-invitations"
              payload: { player_id: "${pl_b}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
              captures: { inv_b: $.data.id, inv_b_v: $.data.version }
            - call: "POST /camp-ops/players/${pl_a}/physicals"
              payload: { player_id: "${pl_a}", scheduled_visit_date: "2026-01-02T00:00:00Z" }
              as: TeamPhysician
              captures: { ph_a: $.data.id }
            - call: "POST /camp-ops/players/${pl_b}/physicals"
              payload: { player_id: "${pl_b}", scheduled_visit_date: "2026-01-02T00:00:00Z" }
              as: TeamPhysician
              captures: { ph_b: $.data.id }
            - call: "POST /camp-ops/physicals/${ph_a}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/physicals/${ph_b}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/camp-invitations/${inv_a}/send-letter"
              payload: {}
              as: TravelCoordinator
            - call: "POST /camp-ops/camp-invitations/${inv_b}/send-letter"
              payload: {}
              as: TravelCoordinator
          trigger:
            - call: "POST /camp-ops/camp-invitations/${inv_a}/travel-arrangement"
              payload: { camp_invitation_id: "${inv_a}", mode: "AIR", travel_radius_miles: 300, departure_at: "2026-01-20T00:00:00Z", travel_cost_cents: 50000, confirm: true, expected_invitation_version: "${inv_a_v}" }
              as: TravelCoordinator
              captures: { ta_a: $.data.id }
            - call: "POST /camp-ops/community-agreements/${ag_id}/terminate"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/camp-invitations/${inv_b}/travel-arrangement"
              payload: { camp_invitation_id: "${inv_b}", mode: "AIR", travel_radius_miles: 300, departure_at: "2026-01-20T00:00:00Z", travel_cost_cents: 50000, confirm: true, expected_invitation_version: "${inv_b_v}" }
              as: TravelCoordinator
              captures: { ta_b: $.data.id }
          assert:
            - "TravelArrangement.${ta_a}.status == CONFIRMED and TravelArrangement.${ta_a}.funding_source == AGREEMENT_FUND"
            - "TravelArrangement.${ta_a}.agreement_funded_cents == 49750 and TravelArrangement.${ta_a}.reimbursement_cents == 0"
            - "TravelArrangement.${ta_a}.reimbursement_status == NOT_LIABLE"
            - "HostCommunityRecord.${hcr_id}.agreement_funded_cents == 0 after the agreement was terminated"
            - "TravelArrangement.${ta_b}.status == CONFIRMED and TravelArrangement.${ta_b}.funding_source == REIMBURSEMENT"
            - "TravelArrangement.${ta_b}.agreement_funded_cents == 0 and TravelArrangement.${ta_b}.reimbursement_cents == 47500"
            - "TravelArrangement.${ta_b}.reimbursement_status == LIABLE"
            - "the two arrangements share identical mode, radius and cost yet differ by exactly 2250 cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: throwing_requirement_band_uses_phase_allowance_and_day_of_game_bump
        grounds:
          - calculations.ThrowingProgramRequirementCalculation
          - calculations.ThrowingProgramRequirementCalculation.variants.PHASE_BOUNDED
          - calculations.ThrowingProgramRequirementCalculation.variants.LIVE_UNBOUNDED
          - calculations.ThrowingProgramRequirementCalculation.constants.PHASE_CATCH_ALLOWANCE_PERMILLE
          - calculations.ThrowingProgramRequirementCalculation.constants.DAY_OF_GAME_REQUIRED_THROWS
        distinguishing_aspect: "The same 250 accumulated throws reads MET at PHASE_3 (band 250..290) and UNMET at PHASE_4 (band 300..340), so the phase's per-mille allowance plus the day-of-game bump decides the outcome rather than the raw workload."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Pitcher with target_catch_play_throws 200, target_bullpen_sessions 2, cleared physical."
            - "Group assignment active; throwing program at PHASE_2 with one 200-throw and one 50-throw CATCH_PLAY session already logged."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Diego Ruelas", idp_number: "IDP-40301", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx_id}" }
              as: RosterManager
              captures: { pl_id: $.data.id }
            - call: "POST /camp-ops/players/${pl_id}/roster-record"
              payload: { player_id: "${pl_id}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl_id}/program-profile"
              payload: { player_id: "${pl_id}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl_id}/camp-invitations"
              payload: { player_id: "${pl_id}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
            - call: "POST /camp-ops/players/${pl_id}/physicals"
              payload: { player_id: "${pl_id}", scheduled_visit_date: "2026-01-02T00:00:00Z" }
              as: TeamPhysician
              captures: { ph_id: $.data.id }
            - call: "POST /camp-ops/physicals/${ph_id}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/complexes/${cx_id}/workout-groups"
              payload: { complex_id: "${cx_id}", roster_bucket: "MAJOR", group_name: "Pitchers Group A", facility_kind: "FIELD", capacity_units: 40 }
              as: ComplexDirector
              captures: { wg_id: $.data.id, wg_v: $.data.version }
            - call: "POST /camp-ops/workout-groups/${wg_id}/assignments"
              payload: { workout_group_id: "${wg_id}", player_id: "${pl_id}", roster_bucket: "MAJOR", assignment_kind: "REHAB", expected_group_version: "${wg_v}" }
              as: FieldCoordinator
              captures: { ga_id: $.data.id }
            - call: "POST /camp-ops/workout-groups/${wg_id}/publish"
              payload: { expected_group_version: "${wg_v}" }
              as: ComplexDirector
            - call: "POST /camp-ops/group-assignments/${ga_id}/throw-programs"
              payload: { group_assignment_id: "${ga_id}", target_catch_play_throws: 200, target_bullpen_sessions: 2 }
              as: PitchingCoordinator
              captures: { tp_id: $.data.id }
            - call: "POST /camp-ops/throw-programs/${tp_id}/sessions"
              payload: { throw_program_id: "${tp_id}", logged_at: "2026-01-05T00:00:00Z", session_kind: "CATCH_PLAY", play_catch_throws: 200 }
              as: PitchingCoordinator
            - call: "POST /camp-ops/throw-programs/${tp_id}/sessions"
              payload: { throw_program_id: "${tp_id}", logged_at: "2026-01-05T00:00:00Z", session_kind: "CATCH_PLAY", play_catch_throws: 50 }
              as: PitchingCoordinator
            - call: "POST /camp-ops/throw-programs/${tp_id}/advance-phase"
              payload: { direction: "ADVANCE" }
              as: PitchingCoordinator
            - call: "POST /camp-ops/throw-programs/${tp_id}/advance-phase"
              payload: { direction: "ADVANCE" }
              as: PitchingCoordinator
          trigger:
            - call: "GET /camp-ops/throw-programs/${tp_id}"
              payload: {}
              as: PitchingCoordinator
              captures: { phase_after_two: $.data.program_phase }
          assert:
            - "ThrowProgram.${tp_id}.program_phase == PHASE_3"
            - "ThrowProgram.${tp_id}.cumulative_throws == 250"
            - "ThrowProgram.${tp_id}.schedule_requirement_throws == 250"
            - "ThrowProgram.${tp_id}.requirement_status == MET"
            - "the PHASE_4 band would be 300..340 for the same target, so the same 250 throws is UNMET one phase later"

      - name: travel_cost_allocation_selects_the_radius_band_then_scales_once
        grounds:
          - calculations.TravelCostAllocation.constants.MODE_RADIUS_DISCOUNT
          - calculations.TravelCostAllocation.constants.HOLDBACK_PERMILLE
          - calculations.TravelCostAllocation.variants.AGREEMENT_FUND_PER_LEG
          - calculations.TravelCostAllocation.variants.REIMBURSEMENT_HOLDBACK
        distinguishing_aspect: "TravelCostAllocation picks one of three radius bands (<=100, <=300, otherwise) and then applies a single mode-specific per-mille scale before one floor divide, so a 50000-cent BUS arrangement at 400 miles pays 48500 while a 50000-cent AIR arrangement at 300 miles pays 49750 — a 1250-cent gap produced only by the band and mode selection."
