  - rule_id: compensating_invariant
    instances:
      - name: compensating_grant_then_rescind_conserves_bursar_money
        grounds:
          - calculations.bursar_money_conservation_invariant
          - state_machines.OptOutRequest.GRANTED_to_RESCINDED
          - state_machines.StudentCharge.REFUNDED_to_POSTED
          - state_machines.StudentCharge.REVOKED_to_RESTORED
          - entities.LedgerEntry
        distinguishing_aspect: |
          Conserved quantity #1 is MONEY: a grant followed by its compensating rescind must leave the
          charge's ledger sum and the student's bursar balance at exactly their pre-grant values
          (9450), with precisely two extra append-only rows (-9450 then +9450) and zero drift, even
          though the balance legitimately passes through 0 in between.
        test_recipe:
          setup:
            - "Base FA26 fixture: two charges of 9450 cents; each charge has exactly one CHARGE/INITIAL_POST LedgerEntry and each student's bursar_balance_cents is 9450."
            - "S-1001 files an opt-out on 2026-08-26 that is not yet decided."
