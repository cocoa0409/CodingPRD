      - name: approval_filling_program_pool_to_the_cent_succeeds_while_one_cent_short_is_rejected
        grounds:
          - calculations.state_benefit_award_cents
          - calculations.program_pool_ledger
          - validations[priority=76]
          - state_machines.StateBenefitApplication.SUBMITTED_to_APPROVED
          - errors[ERR_PROGRAM_POOL_EXHAUSTED]
        distinguishing_aspect: |
          The pool guard is allocated_cents + benefit_amount_cents <= annual_pool_cents. Two identical
          22-credit tuition applications (22 * 45000 = 990000 gross, fee band 0.00 below 2000000 so the net
          equals the gross) are approved against two programs whose only difference is the pool: 990000
          accepts to the cent and 989999 refuses by one cent. An implementation using a strict < on the
          pool guard fails the first; one that compares against the gross-minus-nothing incorrectly, or
          that applies an administration fee below the 2000000 band, changes both outcomes.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "StateProgram prog_exact TUITION_WAIVER fiscal_year 2026 with annual_pool_cents 990000, max_award_cents 990000, min_rating_pct 0, requires_wartime false."
            - "StateProgram prog_short identical except annual_pool_cents 989999."
            - "Veteran vet with discharge VERIFIED and intake_status SCREENED, combined_rating_pct 0 (both programs have min_rating_pct 0 so validations[priority=74] passes)."
            - "SUBMITTED applications app_exact against prog_exact and app_short against prog_short, each requesting 22 tuition credits; the two rows have different program_ids so validations[priority=73] does not fire."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
