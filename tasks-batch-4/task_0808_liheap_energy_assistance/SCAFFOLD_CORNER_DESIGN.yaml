# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7 beyond the nine Difficulty Rules.
# section:/claim_type: values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: household_creation_returns_all_fields
        claim_type: Creation
        grounds: [entities.Household]
        distinguishing_aspect: "POST /liheap/households with all required fields returns 201 with a server-minted id, created_at, version=1, and every input field echoed."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Ann Bell", household_size: 2, annual_income_cents: 1500000, state_code: "CA", county: "Yuba", has_elderly_or_disabled: false, has_child_under_6: true, heating_source: "ELECTRICITY" }
              as: Caseworker
              captures: { hh_id: "$.data.id", ver: "$.data.version" }
          assert:
            - "response status == 201"
            - "Household.${hh_id}.household_size == 2"
            - "Household.${hh_id}.heating_source == ELECTRICITY"
            - "captured ver == 1"

      - name: get_household_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Household, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /liheap/households/{unknown-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /liheap/households/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 404"
            - "captured err == ERR_NOT_FOUND"

      - name: create_application_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Application, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /liheap/applications without season_year returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["a household exists"]
          setup_api_calls:
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Cy Dole", household_size: 1, annual_income_cents: 900000, state_code: "CA", county: "Trinity", heating_source: "PROPANE" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", program_component: "HEATING" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 400"
            - "captured err == ERR_VALIDATION"

      - name: funding_pool_available_computed_on_create
        claim_type: Computed Fields
        grounds: [entities.FundingPool.fields.available_cents, calculations.pool_accounting]
        distinguishing_aspect: "On create, available_cents == total_allocation_cents and reserved_cents == disbursed_cents == 0; status == OPEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 500000, depletion_threshold_cents: 50000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id" }
          assert:
            - "FundingPool.${pool_id}.available_cents == 500000"
            - "FundingPool.${pool_id}.reserved_cents == 0"
            - "FundingPool.${pool_id}.disbursed_cents == 0"
            - "FundingPool.${pool_id}.status == OPEN"

      - name: utility_account_original_obligation_computed
        claim_type: Computed Fields
        grounds: [entities.UtilityAccount.fields.original_obligation_cents]
        distinguishing_aspect: "On create, original_obligation_cents == current_balance_cents + arrearage_cents (30000+20000=50000), lifetime_credited_cents == 0, reconnection_eligible == false."
        test_recipe:
          setup: ["a household and a vendor exist"]
          setup_api_calls:
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Di Enns", household_size: 2, annual_income_cents: 1200000, state_code: "CA", county: "Plumas", heating_source: "NATURAL_GAS" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/vendors"
              payload: { name: "PlumasGas", vendor_type: "GAS", remittance_account: "rpg-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "PG-1", service_type: "HEATING", current_balance_cents: 30000, arrearage_cents: 20000, is_disconnected: true }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
          assert:
            - "UtilityAccount.${ua_id}.original_obligation_cents == 50000"
            - "UtilityAccount.${ua_id}.lifetime_credited_cents == 0"
            - "UtilityAccount.${ua_id}.reconnection_eligible == false"

  - section: state_machines
    instances:
      - name: approve_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Application.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approve on a DRAFT (never submitted) application returns 409 ERR_INVALID_STATE; only SUBMITTED applications can be approved."
        test_recipe:
          setup: ["a DRAFT application exists"]
          setup_api_calls:
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Ed Frey", household_size: 2, annual_income_cents: 1200000, state_code: "CA", county: "Amador", heating_source: "ELECTRICITY" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/applications/${app_id}/approve"
              payload: {}
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "captured err == ERR_INVALID_STATE"
            - "Application.${app_id}.status == DRAFT"

      - name: vendor_enroll_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Vendor.PENDING_to_ENROLLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Enrolling an already-ENROLLED vendor returns 409 ERR_INVALID_STATE (the transition requires status==PENDING)."
        test_recipe:
          setup: ["an ENROLLED vendor exists"]
          setup_api_calls:
            - call: "POST /liheap/vendors"
              payload: { name: "TwiceGas", vendor_type: "GAS", remittance_account: "rtg-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "captured err == ERR_INVALID_STATE"
            - "Vendor.${vendor_id}.status == ENROLLED"

      - name: resolve_breached_crisis_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CrisisBenefit.OPEN_to_BREACHED, state_machines.CrisisBenefit.OPEN_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a BREACHED (terminal) crisis returns 409 ERR_INVALID_STATE; no transitions leave a terminal state."
        test_recipe:
          setup: ["a CRISIS pool, household, account, and an OPEN crisis whose deadline has passed and been breached"]
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "CRISIS", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { cpool_id: "$.data.id" }
            - call: "POST /liheap/vendors"
              payload: { name: "BreachOil", vendor_type: "OIL", remittance_account: "rbo-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Fi Gray", household_size: 2, annual_income_cents: 1200000, state_code: "CA", county: "Nevada", heating_source: "FUEL_OIL" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "BO-1", service_type: "HEATING", current_balance_cents: 40000, arrearage_cents: 0 }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
            - call: "POST /liheap/crisis-benefits"
              payload: { household_id: "${hh_id}", utility_account_id: "${ua_id}", funding_pool_id: "${cpool_id}", crisis_type: "NO_HEAT" }
              as: Caseworker
              captures: { crisis_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /liheap/crisis-benefits/${crisis_id}/breach"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /liheap/crisis-benefits/${crisis_id}/resolve"
              payload: {}
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "captured err == ERR_INVALID_STATE"
            - "CrisisBenefit.${crisis_id}.status == BREACHED"

      - name: weatherization_referral_schedule_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.WeatherizationReferral.REFERRED_to_SCHEDULED]
        distinguishing_aspect: "A REFERRED referral transitions to SCHEDULED via POST /schedule."
        test_recipe:
          setup: ["a REFERRED weatherization referral exists"]
          setup_api_calls:
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Gi Hull", household_size: 5, annual_income_cents: 2000000, state_code: "CA", county: "Sierra", has_elderly_or_disabled: true, heating_source: "PROPANE" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/weatherization-referrals"
              payload: { household_id: "${hh_id}", referral_reason: "HIGH_ENERGY_BURDEN" }
              as: Caseworker
              captures: { ref_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/weatherization-referrals/${ref_id}/schedule"
              payload: {}
              as: Caseworker
              captures: { st: "$.data.status" }
          assert:
            - "captured st == SCHEDULED"
            - "WeatherizationReferral.${ref_id}.status == SCHEDULED"

      - name: income_document_reject_transition
        claim_type: Valid Transition
        grounds: [state_machines.IncomeDocument.PENDING_to_REJECTED, entities.IncomeDocument.fields.status]
        distinguishing_aspect: "Verify with outcome=REJECTED moves a PENDING income document to REJECTED (does not set verified_income_cents)."
        test_recipe:
          setup: ["a household with a DRAFT application and one PENDING income document"]
          setup_api_calls:
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Hy Ives", household_size: 2, annual_income_cents: 1200000, state_code: "CA", county: "Alpine", heating_source: "ELECTRICITY" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/income-documents"
              payload: { application_id: "${app_id}", doc_type: "SELF_ATTESTATION", reported_income_cents: 1200000 }
              as: Caseworker
              captures: { doc_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/income-documents/${doc_id}/verify"
              payload: { outcome: "REJECTED" }
              as: Caseworker
              captures: { st: "$.data.status" }
          assert:
            - "captured st == REJECTED"
            - "IncomeDocument.${doc_id}.status == REJECTED"

  - section: validations
    instances:
      - name: pledge_nonexistent_vendor_returns_invalid_reference
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REFERENCE]"]
        distinguishing_aspect: "Pledge create naming a non-existent vendor_id (all other refs valid, application APPROVED) returns 422 ERR_INVALID_REFERENCE."
        test_recipe:
          setup: ["OPEN HEATING pool, approved application, valid utility account, but the pledge names a bogus vendor_id"]
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id", pool_v: "$.data.version" }
            - call: "POST /liheap/vendors"
              payload: { name: "RefGas", vendor_type: "GAS", remittance_account: "rrg-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Iggy Jung", household_size: 3, annual_income_cents: 1700000, state_code: "CA", county: "Mono", heating_source: "NATURAL_GAS" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "RG-1", service_type: "HEATING", current_balance_cents: 40000, arrearage_cents: 0 }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
            - call: "POST /liheap/income-documents"
              payload: { application_id: "${app_id}", doc_type: "PAYSTUB", reported_income_cents: 1700000 }
              as: Caseworker
              captures: { doc_id: "$.data.id" }
            - call: "POST /liheap/income-documents/${doc_id}/verify"
              payload: { outcome: "VERIFIED", verified_income_cents: 1700000 }
              as: Caseworker
            - call: "POST /liheap/applications/${app_id}/approve"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /liheap/pledges"
              payload: { application_id: "${app_id}", vendor_id: "00000000-0000-4000-8000-0000000000ff", funding_pool_id: "${pool_id}", utility_account_id: "${ua_id}", pledge_type: "HEATING", pledged_amount_cents: 30000, benefit_period_start: "2026-03-01T00:00:00Z", benefit_period_end: "2026-03-15T00:00:00Z", expected_pool_version: "${pool_v}" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "captured err == ERR_INVALID_REFERENCE"

      - name: pledge_component_mismatch_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_POOL_COMPONENT_MISMATCH]"]
        distinguishing_aspect: "A COOLING pledge_type drawn on a HEATING pool returns 422 ERR_POOL_COMPONENT_MISMATCH (pledge_type must map to pool.program_component)."
        test_recipe:
          setup: ["OPEN HEATING pool, ENROLLED vendor, approved application, valid account; pledge_type COOLING"]
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id", pool_v: "$.data.version" }
            - call: "POST /liheap/vendors"
              payload: { name: "MixGas", vendor_type: "GAS", remittance_account: "rmg-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Ji Kort", household_size: 3, annual_income_cents: 1700000, state_code: "CA", county: "Del Norte", heating_source: "NATURAL_GAS" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "MG-1", service_type: "HEATING", current_balance_cents: 40000, arrearage_cents: 0 }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
            - call: "POST /liheap/income-documents"
              payload: { application_id: "${app_id}", doc_type: "PAYSTUB", reported_income_cents: 1700000 }
              as: Caseworker
              captures: { doc_id: "$.data.id" }
            - call: "POST /liheap/income-documents/${doc_id}/verify"
              payload: { outcome: "VERIFIED", verified_income_cents: 1700000 }
              as: Caseworker
            - call: "POST /liheap/applications/${app_id}/approve"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /liheap/pledges"
              payload: { application_id: "${app_id}", vendor_id: "${vendor_id}", funding_pool_id: "${pool_id}", utility_account_id: "${ua_id}", pledge_type: "COOLING", pledged_amount_cents: 30000, benefit_period_start: "2026-03-01T00:00:00Z", benefit_period_end: "2026-03-15T00:00:00Z", expected_pool_version: "${pool_v}" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "captured err == ERR_POOL_COMPONENT_MISMATCH"

      - name: reconnection_pledge_connected_account_returns_error
        claim_type: Conditional validation
        grounds: ["validations[priority=15]", "errors[ERR_ACCOUNT_NOT_DISCONNECTED]"]
        distinguishing_aspect: "A RECONNECTION pledge on a utility account that is not disconnected returns 422 ERR_ACCOUNT_NOT_DISCONNECTED; drawn from a CRISIS pool (RECONNECTION maps to CRISIS)."
        test_recipe:
          setup: ["OPEN CRISIS pool, ENROLLED vendor, approved application, connected (is_disconnected=false) account"]
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "CRISIS", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { cpool_id: "$.data.id", cpool_v: "$.data.version" }
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { hpool_id: "$.data.id" }
            - call: "POST /liheap/vendors"
              payload: { name: "ReconElec", vendor_type: "ELECTRIC", remittance_account: "rre-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Ki Lund", household_size: 3, annual_income_cents: 1700000, state_code: "CA", county: "Lassen", heating_source: "ELECTRICITY" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "RE-1", service_type: "ELECTRIC", current_balance_cents: 40000, arrearage_cents: 10000, is_disconnected: false }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
            - call: "POST /liheap/income-documents"
              payload: { application_id: "${app_id}", doc_type: "PAYSTUB", reported_income_cents: 1700000 }
              as: Caseworker
              captures: { doc_id: "$.data.id" }
            - call: "POST /liheap/income-documents/${doc_id}/verify"
              payload: { outcome: "VERIFIED", verified_income_cents: 1700000 }
              as: Caseworker
            - call: "POST /liheap/applications/${app_id}/approve"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /liheap/pledges"
              payload: { application_id: "${app_id}", vendor_id: "${vendor_id}", funding_pool_id: "${cpool_id}", utility_account_id: "${ua_id}", pledge_type: "RECONNECTION", pledged_amount_cents: 10000, benefit_period_start: "2026-03-01T00:00:00Z", benefit_period_end: "2026-03-15T00:00:00Z", expected_pool_version: "${cpool_v}" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "captured err == ERR_ACCOUNT_NOT_DISCONNECTED"

      - name: pledge_unenrolled_vendor_returns_error
        claim_type: Cross-entity validation
        grounds: ["validations[priority=16]", "errors[ERR_VENDOR_NOT_ENROLLED]"]
        distinguishing_aspect: "Pledge create against a PENDING (not ENROLLED) vendor returns 409 ERR_VENDOR_NOT_ENROLLED."
        test_recipe:
          setup: ["OPEN HEATING pool, approved application, valid account, but the vendor is still PENDING (never enrolled)"]
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id", pool_v: "$.data.version" }
            - call: "POST /liheap/vendors"
              payload: { name: "PendingGas", vendor_type: "GAS", remittance_account: "rpn-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Lo Mant", household_size: 3, annual_income_cents: 1700000, state_code: "CA", county: "Yolo", heating_source: "NATURAL_GAS" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "PN-1", service_type: "HEATING", current_balance_cents: 40000, arrearage_cents: 0 }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
