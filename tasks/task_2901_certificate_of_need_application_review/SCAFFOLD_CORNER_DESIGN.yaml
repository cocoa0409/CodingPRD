      - name: empty_user_id_header_returns_unauthenticated_before_any_other_check
        claim_type: error_triggerability
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "An empty-string X-User-ID counts as absent, so the request fails with ERR_UNAUTHENTICATED (401) even though the body is also invalid (population_projection missing) — priority 1 outranks the priority-3 shape check."
        test_recipe:
          setup:
            - "Empty database; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
