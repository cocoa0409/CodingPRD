              captures: { b: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /lease-admin/leases/${lease_id}/critical-dates"
              payload: { kind: EXPIRATION, due_date: "2027-12-31", advance_notice_days: 0 }
              as: PropertyManager
              captures: { cd_old: $.data.id }
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: PortfolioManager
              captures: { lv: $.data.version }
            - call: "POST /lease-admin/leases/${lease_id}/amendments"
              payload: { kind: EXTENSION, effective_date: "2027-06-01", new_expiration_date: "2029-12-31" }
              as: PortfolioManager
              captures: { a: $.data.id }
