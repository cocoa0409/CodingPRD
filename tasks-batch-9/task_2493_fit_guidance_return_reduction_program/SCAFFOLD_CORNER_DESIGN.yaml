              as_user_id: "analyst-7"
            - call: "POST /fit-program/size-charts"
              payload: { chart_code: "STD-TOPS-X1", size_system: "US_ALPHA", category_code: "TOPS", rows: [{ size_label: "S", sort_index: 0, body_chest_min_mm: 820, body_chest_max_mm: 859, body_waist_min_mm: 740, body_waist_max_mm: 779, conversion_us_alpha: "S", conversion_us_numeric: "2", conversion_eu: "34", conversion_uk: "6" }, { size_label: "M", sort_index: 1, body_chest_min_mm: 860, body_chest_max_mm: 899, body_waist_min_mm: 780, body_waist_max_mm: 819, conversion_us_alpha: "M", conversion_us_numeric: "4", conversion_eu: "36", conversion_uk: "8" }] }
              as: MerchOpsAdmin
              captures: { chart_id: $.data.id }
            - call: "POST /fit-program/size-charts/${chart_id}/standardize"
              payload: {}
              as: MerchOpsAdmin
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { stale_ver: $.data.version }
            - call: "POST /fit-program/catalog-items/${item_id}/pdp-enhancement"
              payload: { model_measurements_published: true, detail_image_count: 4, model_height_cm: 178, model_worn_size_label: "M" }
              as: MerchOpsAdmin
              captures: { ver_after_pdp: $.data.version }
          trigger:
            - call: "POST /fit-program/size-chart-mappings"
              payload: { item_id: "${item_id}", chart_id: "${chart_id}", expected_item_version: "${stale_ver}", size_label_pairs: [{ spec_size_label: "S", chart_size_label: "S" }, { spec_size_label: "M", chart_size_label: "M" }] }
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { err_id: $.data.error_id }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { fresh_ver: $.data.version, readiness_after_denial: $.data.fit_readiness }
            - call: "POST /fit-program/size-chart-mappings"
              payload: { item_id: "${item_id}", chart_id: "${chart_id}", expected_item_version: "${fresh_ver}", size_label_pairs: [{ spec_size_label: "S", chart_size_label: "S" }, { spec_size_label: "M", chart_size_label: "M" }] }
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { mapping_id: $.data.id, mapping_status: $.data.status, coverage: $.data.coverage_bp }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { ver_after_mapping: $.data.version, readiness_after_mapping: $.data.fit_readiness }
          assert:
            - "${stale_ver} == 2"
            - "${ver_after_pdp} == 3"
            - "${err_id} == \"ERR_STALE_ITEM_VERSION\""
            - "http_status == 412"
            - "${readiness_after_denial} == \"UNVERIFIED\""
            - "${fresh_ver} == 3"
            - "${mapping_status} == \"ACTIVE\""
            - "${coverage} == 10000"
            - "${readiness_after_mapping} == \"CHART_MAPPED\""
            - "${ver_after_mapping} == 4"
            - "count(SizeChartMapping where item_id == ${item_id}) == 1"
            - "SizeChartMapping.${mapping_id}.superseded_reason == null"

      - name: override_creation_with_a_stale_expected_customer_profile_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.override-create-stale-customer-profile
          - errors[ERR_STALE_CUSTOMER_PROFILE_VERSION]
          - validations[priority=11]
          - endpoints[POST /fit-program/customer-profiles/{id}/return-policy-overrides]
        distinguishing_aspect: |
          Each accepted override bumps CustomerProfile.version, so a client that reads version 1,
          writes a TOPS override and then reuses version 1 for a BOTTOMS override is refused 412
          ERR_STALE_CUSTOMER_PROFILE_VERSION - the second write is on a different category and
          therefore never touches priority 23's overlap check. Retrying with version 2 succeeds,
          leaving exactly two CUSTOMER_OVERRIDE rows and version 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One shopper profile with no overrides."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-x2@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "GET /fit-program/customer-profiles/${customer_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { ver_1: $.data.version, tier: $.data.tier, policy_class: $.data.policy_class }
            - call: "POST /fit-program/customer-profiles/${customer_id}/return-policy-overrides"
              payload: { category_code: "TOPS", window_days: 45, restocking_applies: false, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z", expected_customer_profile_version: "${ver_1}" }
              as: MerchOpsAdmin
              captures: { tops_override_id: $.data.id, tops_scope: $.data.scope }
          trigger:
            - call: "POST /fit-program/customer-profiles/${customer_id}/return-policy-overrides"
              payload: { category_code: "BOTTOMS", window_days: 60, restocking_applies: false, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z", expected_customer_profile_version: "${ver_1}" }
              as: MerchOpsAdmin
              captures: { err_id: $.data.error_id }
            - call: "GET /fit-program/customer-profiles/${customer_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { ver_2: $.data.version }
            - call: "POST /fit-program/customer-profiles/${customer_id}/return-policy-overrides"
              payload: { category_code: "BOTTOMS", window_days: 60, restocking_applies: false, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z", expected_customer_profile_version: "${ver_2}" }
              as: MerchOpsAdmin
              captures: { bottoms_override_id: $.data.id, bottoms_scope: $.data.scope, bottoms_window: $.data.window_days }
            - call: "GET /fit-program/return-policies"
              payload: { customer_profile_id: "${customer_id}", scope: "CUSTOMER_OVERRIDE" }
              as: MerchOpsAdmin
              captures: { override_total: $.total_count }
            - call: "GET /fit-program/customer-profiles/${customer_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { ver_3: $.data.version }
          assert:
            - "${ver_1} == 1"
            - "${tier} == \"STANDARD\""
            - "${policy_class} == \"STANDARD_WINDOW\""
            - "${tops_scope} == \"CUSTOMER_OVERRIDE\""
            - "${err_id} == \"ERR_STALE_CUSTOMER_PROFILE_VERSION\""
            - "http_status == 412"
            - "${ver_2} == 2"
            - "${bottoms_scope} == \"CUSTOMER_OVERRIDE\""
            - "${bottoms_window} == 60"
            - "${override_total} == 2"
            - "${ver_3} == 3"
            - "ReturnPolicy.${tops_override_id}.customer_profile_id == ${customer_id}"
            - "ReturnPolicy.${tops_override_id}.window_days == 45"
            - "ReturnPolicy.${bottoms_override_id}.category_code == \"BOTTOMS\""

      - name: ops_run_ages_an_abuse_strike_out_of_the_trailing_window
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /fit-program/ops-runs]
          - calculations.customer_abuse_and_policy_class
          - state_machines.CustomerProfile.abuse_status.WATCH_to_CLEAR
        distinguishing_aspect: |
          Nothing about the stored data changes between the two reads - the same single
          RESOLVED_REFUNDED CHANGE_OF_MIND case with a positive refund is still there - yet the
          checkpoint at a later clock recomputes abuse_strike_count to 0 because the strike
          predicate is strict (requested_at 2026-01-10 is not later than clock 2026-07-10 minus
          180 days, i.e. 2026-01-11). The ops-run reports the flip as abuse_downgrades 1 and the
          profile walks WATCH -> CLEAR; return_rate_bp stays 10000 and does not block the shopper
          because purchase_line_count 1 is under ABUSE_RATE_MIN_LINES.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; TOPS 30-day default policy effective from 2026-01-01."
            - "One shopper with a single line delivered 2026-01-05 whose CHANGE_OF_MIND case is classified by auditor-1 and resolved by auditor-2 on 2026-01-10, putting the profile at one strike."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-x3@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-01-05T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "CHANGE_OF_MIND" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_id: $.data.id, requested_at: $.data.requested_at }
            - call: "POST /fit-program/return-cases/${case_id}/classify"
              payload: { reason_code: "CHANGE_OF_MIND" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
              captures: { cooling_status: $.data.status }
            - call: "POST /fit-program/return-cases/${case_id}/resolve"
              payload: { item_condition: "RESELLABLE_A" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
              captures: { resolved_status: $.data.status, fee: $.data.restocking_fee_cents, refund: $.data.refund_amount_cents, total_cost: $.data.total_cost_cents }
            - call: "GET /fit-program/customer-profiles/${customer_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { strikes_before: $.data.abuse_strike_count, abuse_before: $.data.abuse_status, class_before: $.data.policy_class, rate_before: $.data.return_rate_bp }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: MerchOpsAdmin
          trigger:
            - call: "POST /fit-program/ops-runs"
              payload: {}
              as: MerchOpsAdmin
              captures: { downgrades: $.data.abuse_downgrades, swept: $.data.items_swept, watch_flips: $.data.watch_flips, chronic_flips: $.data.chronic_flips }
            - call: "GET /fit-program/customer-profiles/${customer_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { strikes_after: $.data.abuse_strike_count, abuse_after: $.data.abuse_status, class_after: $.data.policy_class, rate_after: $.data.return_rate_bp, refunded_total: $.data.refunded_total_cents }
          assert:
            - "${requested_at} == \"2026-01-10T00:00:00Z\""
            - "${cooling_status} == \"COOLING_OFF\""
            - "${resolved_status} == \"RESOLVED_REFUNDED\""
            - "${fee} == 0"
            - "${refund} == 2295"
            - "${total_cost} == 1330"
            - "${strikes_before} == 1"
            - "${abuse_before} == \"WATCH\""
            - "${class_before} == \"STANDARD_WINDOW\""
            - "${rate_before} == 10000"
            - "${downgrades} == 1"
            - "${swept} == 1"
            - "${watch_flips} == 0"
            - "${chronic_flips} == 0"
            - "${strikes_after} == 0"
            - "${abuse_after} == \"CLEAR\""
            - "${class_after} == \"STANDARD_WINDOW\""
            - "${rate_after} == 10000"
            - "${refunded_total} == 2295"
            - "ReturnCase.${case_id}.status == \"RESOLVED_REFUNDED\""
            - "CustomerProfile.${customer_id}.change_of_mind_count == 1"

      - name: chronic_flip_propagates_three_levels_from_one_resolve
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.CatalogItem.listing_status.LISTED_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / chronic_flip_cascade_suspends_listing_reopens_spec_and_debits_vendor
          rationale: "That instance verifies the full resolve -> score -> listing/readiness -> specification -> vendor chain end to end, including the intermediate values at each level."

      - name: both_savings_variants_run_on_one_intervention
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.intervention_savings.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / intervention_savings_attributed_vs_cohort_chronological_divergence
          rationale: "That instance reads the same intervention under both variants and pins the delta, which is exactly the dual-variant claim for this layer."

      - name: void_reconciles_every_derived_aggregate_it_touches
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
          - state_machines.ReturnCase.status.RESOLVED_REFUNDED_to_VOIDED
        excluded_because:
          difficulty_instance: compensating_invariant / void_returns_return_cost_ledger_and_refund_total_to_zero
          rationale: "That instance walks the void compensation across ReturnCostPosting, CustomerProfile and CatalogItem aggregates and asserts each restored value."

      - name: feedback_retraction_reconciles_the_item_signal_pool
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
          - endpoints[POST /fit-program/fit-feedback/{id}/retract]
        excluded_because:
          difficulty_instance: compensating_invariant / feedback_retraction_restores_item_fit_signal_pool
          rationale: "That instance retracts one of several feedback rows and asserts the pool returns to exactly its prior total rather than to zero."

  - section: consistency_model
    instances:
      - name: immediate_consistency_exposes_the_fit_signal_pool_in_the_same_request_cycle
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.CatalogItem.fields.fit_signal_weight_total
          - entities.FitFeedback.fields.signal_weight
          - endpoints[POST /fit-program/fit-feedback]
        distinguishing_aspect: |
          The consistency model is immediate, so the purchaser's review is reflected in the item's
          denormalised counters on the very next read with no ops-run and no delay: weight 200
          (the reviewer has a DELIVERED line on this item, not the non-purchaser 100) and
          active_fit_feedback_count 1. A second reviewer's non-purchase feedback lands in the same
          read cycle too, taking the pool to 300 while the count reaches 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; shopper P holds a DELIVERED line on the item, shopper Q holds none."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "purchaser-p@example.com" }
              as: MerchOpsAdmin
              captures: { customer_p_id: $.data.id }
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "browser-q@example.com" }
              as: MerchOpsAdmin
              captures: { customer_q_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_p_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id, line_status: $.data.status }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { pool_start: $.data.fit_signal_weight_total, count_start: $.data.active_fit_feedback_count }
          trigger:
            - call: "POST /fit-program/fit-feedback"
              payload: { item_id: "${item_id}", customer_profile_id: "${customer_p_id}", purchased_size_label: "M", fit_verdict: "SLIGHTLY_LARGE", comment: "roomy through the chest" }
              as: Customer
              as_user_id: "${customer_p_id}"
              captures: { p_feedback_id: $.data.id, p_weight: $.data.signal_weight, p_offset: $.data.verdict_offset_centi }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { pool_after_p: $.data.fit_signal_weight_total, count_after_p: $.data.active_fit_feedback_count }
            - call: "POST /fit-program/fit-feedback"
              payload: { item_id: "${item_id}", customer_profile_id: "${customer_q_id}", purchased_size_label: "M", fit_verdict: "TRUE_TO_SIZE" }
              as: Customer
              as_user_id: "${customer_q_id}"
              captures: { q_feedback_id: $.data.id, q_weight: $.data.signal_weight, q_offset: $.data.verdict_offset_centi }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { pool_after_q: $.data.fit_signal_weight_total, count_after_q: $.data.active_fit_feedback_count }
            - call: "GET /fit-program/fit-feedback"
              payload: { item_id: "${item_id}", status: "ACTIVE" }
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { active_total: $.total_count, first_weight: "$.data[0].signal_weight" }
          assert:
            - "${line_status} == \"DELIVERED\""
            - "${pool_start} == 0"
            - "${count_start} == 0"
            - "${p_weight} == 200"
            - "${p_offset} == -50"
            - "${pool_after_p} == 200"
            - "${count_after_p} == 1"
            - "${q_weight} == 100"
            - "${q_offset} == 0"
            - "${pool_after_q} == 300"
            - "${count_after_q} == 2"
            - "${active_total} == 2"
            - "${first_weight} == 200"
            - "FitFeedback.${p_feedback_id}.status == \"ACTIVE\""
            - "FitFeedback.${q_feedback_id}.status == \"ACTIVE\""
            - "CatalogItem.${item_id}.fit_signal_weight_total == 300"
