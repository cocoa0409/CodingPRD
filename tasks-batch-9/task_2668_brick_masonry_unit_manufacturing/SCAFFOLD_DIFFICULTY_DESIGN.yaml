            - "Plant P1 ACTIVE with pits PIT-CLAY-A and PIT-SHALE-B, each 5000.00 proven reserve tons"
            - "Formulation F1 QUALIFIED at 50/50 shares, clay_tons_per_thousand_units 3.20"
            - "Kiln K1 with 5 positions; kiln cars C1 and C2, each 12000 green units"
            - "Run R2 already SET on C2 and LOADED into scheduled kiln run KR1 at position 3, so 16.00 tons per pit are already CONSUMED"
            - "Run R1 freshly created on C1 and still SETTING, so a further 16.00 tons per pit are COMMITTED"
