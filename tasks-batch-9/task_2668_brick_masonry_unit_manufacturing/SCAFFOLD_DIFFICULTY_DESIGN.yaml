  # =======================================================================
  # RULE 8 - resource_temporal_overlap
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: kiln_firing_window_closed_interval_with_cooldown_buffer_collides_on_touch
        grounds:
          - validations[priority=38]
          - entities.Kiln.fields.cooldown_buffer_hours
          - endpoints["POST /kiln-runs"]
        distinguishing_aspect: |
          The contended resource is the KILN and its interval semantics are CLOSED and
          BUFFER-INFLATED: every run occupies [start_at, end_at + cooldown_buffer_hours]
          and touching endpoints COLLIDE, so a run whose inflated end lands exactly on an
          existing run's start is rejected, and so is a run starting exactly at an
          existing run's inflated end. The other instance in this rule contends the KILN
          CAR, whose interval is HALF-OPEN with ZERO buffer and where exact adjacency is
          explicitly ALLOWED - the same clock instants therefore produce opposite verdicts
          depending on which resource is being reserved.
        test_recipe:
          setup:
            - "Plant P1 ACTIVE, formulation F1 QUALIFIED"
            - "Kiln K1 with position_count 5, setpoint_peak_c 1050 and cooldown_buffer_hours 6.0"
            - "KilnRun KR1 SCHEDULED on K1 for [2026-08-05T00:00:00Z, 2026-08-07T00:00:00Z], which inflates to [2026-08-05T00:00:00Z, 2026-08-07T06:00:00Z]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
            - call: "POST /plants/${p1}/kilns"
              payload: { kiln_code: "K1", position_count: 5, setpoint_peak_c: 1050, cooldown_buffer_hours: 6.0 }
              as: PlantAdmin
              captures: { k1: "$.data.id" }
            - call: "POST /kiln-runs"
              payload: { kiln_id: "${k1}", formulation_id: "${f1}", run_code: "KR1", start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-07T00:00:00Z", planned_peak_temp_c: 1050, planned_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr1: "$.data.id", kr1_status: "$.data.status" }
          trigger:
            - call: "POST /kiln-runs"
              payload: { kiln_id: "${k1}", formulation_id: "${f1}", run_code: "KR0", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-04T18:00:00Z", planned_peak_temp_c: 1050, planned_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { err_before: "$.data.error_id" }
            - call: "POST /kiln-runs"
              payload: { kiln_id: "${k1}", formulation_id: "${f1}", run_code: "KR2", start_at: "2026-08-07T06:00:00Z", end_at: "2026-08-09T00:00:00Z", planned_peak_temp_c: 1050, planned_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { err_after: "$.data.error_id" }
            - call: "POST /kiln-runs"
              payload: { kiln_id: "${k1}", formulation_id: "${f1}", run_code: "KR3", start_at: "2026-08-07T07:00:00Z", end_at: "2026-08-09T00:00:00Z", planned_peak_temp_c: 1050, planned_soak_hours: 3.0 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kr3_status: "$.data.status" }
            - call: "GET /kiln-runs"
              payload: { kiln_id: "${k1}" }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { kiln_run_total: "$.data[0].id" }
          assert:
            - "${kr1_status} == SCHEDULED, so KR1 occupies the inflated closed interval [2026-08-05T00:00:00Z, 2026-08-07T06:00:00Z]"
            - "${err_before} == ERR_KILN_WINDOW_CONFLICT with HTTP 409 - KR0's own inflated end is 2026-08-04T18:00 plus 6.0 h == 2026-08-05T00:00:00Z, which TOUCHES KR1's start; a half-open reading would wrongly accept this"
            - "${err_after} == ERR_KILN_WINDOW_CONFLICT with HTTP 409 - KR2 starts exactly at KR1's inflated end 2026-08-07T06:00:00Z, which also TOUCHES"
            - "${kr3_status} == SCHEDULED - one hour later, 2026-08-07T07:00:00Z, clears the buffer and is accepted"
            - "Comparing the raw end_at values alone would have accepted KR2 at 2026-08-07T06:00:00Z on the grounds that it is after KR1's end_at 2026-08-07T00:00:00Z - the 6.0 h cooldown buffer is the whole point"
            - "${kiln_run_total} is one of exactly two persisted KilnRuns on K1 (KR1 and KR3); the two rejected creations persisted nothing"

      - name: kiln_car_occupancy_half_open_interval_allows_exact_adjacency
        grounds:
          - validations[priority=39]
          - state_machines.KilnCar.IN_KILN_to_IDLE
          - endpoints["POST /kiln-runs/{id}/load"]
        distinguishing_aspect: |
          The contended resource is the KILN CAR and its interval semantics are HALF-OPEN
          with ZERO buffer: [start_at, end_at) means a car handed off at the exact instant
          its previous firing ended is legal, while any genuine straddle is rejected.
          Three separate kilns are used so that the kiln-window rule at priority 38 can
          never be the cause of either verdict, isolating the car constraint. This is the
          opposite endpoint convention from the kiln instance in this rule, and the
          conflict is detected on a load call against an already-persisted KilnRun rather
          than on a creation.
        test_recipe:
