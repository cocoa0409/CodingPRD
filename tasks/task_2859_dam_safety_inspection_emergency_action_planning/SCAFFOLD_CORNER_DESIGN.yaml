              as: ProgramAdmin
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Copycat Dam", nid_code: "ST00124", height_ft: 41, gross_storage_acre_ft: 300, crest_elevation_ft: 900.0, normal_pool_elevation_ft: 896.0, year_completed: 1981, registered_at: "2020-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam2_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Sam Okoye", license_number: "PE-44121", license_expires_at: "2030-06-30T00:00:00Z", certified_hazard_classes: ["LOW"] }
