            - "ACME security; accounts A1 (100 sh) and A2 (100 sh), lots acq 2026-04-01"
            - "RIGHTS_OFFERING 1:1, subscription 400c, 1000 offered, oversubscription allowed, deadline 2026-05-20T16:00:00Z, CONFIRMED + captured at 2026-05-15 (entitled rights 100 each)"
