        claim_type: role_denial
        grounds:
          - roles.CustomerPlanner
          - roles.PlantManager
          - endpoints.POST_/supply-agreements/{id}/amend
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "amend is PlantManager-exclusive: even the owning customer (X-User-ID == agreement.customer_id) is rejected 403 ERR_UNAUTHORIZED at priority 2 — before the OCC version check at priority 5 ever runs."
        test_recipe:
          setup:
            - "Logical clock default. Agreement RENEGOTIATING (version 3) after sign and open-renegotiation by the owning customer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
