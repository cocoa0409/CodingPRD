        grounds:
          - calculations.disclosure_packet_page_count
          - calculations.disclosure_packet_page_count.constants.SUMMARY_SUBSTITUTION_THRESHOLD_PAGES
          - calculations.disclosure_packet_page_count.constants.SUMMARY_PAGE_COUNT
          - entities.RecordsRequest.fields.packet_page_count
        distinguishing_aspect: "The substitution test is strict greater-than and single-pass: a student whose certified pages total exactly 500 keeps packet_page_count 500, while a sibling student at 501 pages swaps its 51 discipline pages for the 3-page summary and lands at 453 — a value below the threshold that is never re-tested."
