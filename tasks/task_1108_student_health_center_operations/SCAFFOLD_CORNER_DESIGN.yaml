scaffold_corner_design:
  # ==================================================================
  # Section: entities (Table 1 claims)
  # ==================================================================
  - section: entities
    instances:
      - name: student_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Student]
        distinguishing_aspect: "A student created with only required fields starts ENROLLED, posture CLEAR, no holds, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /shc/students", payload: { external_ref: "S1", full_name: "Default Dan" }, as: HealthAdmin, captures: { stu: $.data.id } }
          trigger:
            - { call: "GET /shc/students/${stu}", payload: {}, as: Any }
          assert:
            - "trigger[0]: enrollment_status == ENROLLED (default applied)"
            - "trigger[0]: compliance_posture == CLEAR and active_hold_types == [] (computed defaults)"
            - "trigger[0]: version == 1 and id/created_at/updated_at present (system fields)"

      - name: student_get_returns_not_found
        claim_type: not_found
        grounds: [entities.Student, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 with the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /shc/students/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 404, error_id == ERR_NOT_FOUND, and body carries data.error_id plus data.message"

      - name: student_create_duplicate_ref_rejected
        claim_type: type_constraints
        grounds: [entities.Student.fields.external_ref, "errors[ERR_DUPLICATE_STUDENT_REF]"]
        distinguishing_aspect: "external_ref is unique: second create with the same ref fails 409."
        test_recipe:
          setup: ["one student with external_ref S2 exists"]
          setup_api_calls:
            - { call: "POST /shc/students", payload: { external_ref: "S2", full_name: "First" }, as: HealthAdmin }
          trigger:
            - { call: "POST /shc/students", payload: { external_ref: "S2", full_name: "Second" }, as: HealthAdmin, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 409, error_id == ERR_DUPLICATE_STUDENT_REF"

      - name: student_create_computed_posture_input_ignored
        claim_type: computed_fields
        grounds: [entities.Student.fields.compliance_posture]
        distinguishing_aspect: "Client-supplied compliance_posture is ignored: the server always derives it (CLEAR on create)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /shc/students", payload: { external_ref: "S3", full_name: "Sneaky", compliance_posture: "REGISTRATION_HOLD" }, as: HealthAdmin, captures: { stu: $.data.id } }
          assert:
            - "trigger[0]: HTTP 201, compliance_posture == CLEAR (client input for computed field ignored)"

      - name: student_create_missing_required_full_name
        claim_type: required_fields
        grounds: [entities.Student.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required field full_name yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /shc/students", payload: { external_ref: "S4" }, as: HealthAdmin, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 400, error_id == ERR_INVALID_REQUEST"

      - name: student_create_invalid_enum_enrollment
        claim_type: type_constraints
        grounds: [entities.Student.fields.enrollment_status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "enrollment_status outside {ENROLLED, LEAVE, WITHDRAWN} yields 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /shc/students", payload: { external_ref: "S5", full_name: "Enum Ed", enrollment_status: "PHD" }, as: HealthAdmin, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 400, error_id == ERR_INVALID_REQUEST"

  # ==================================================================
  # Section: state_machines (Table 2 claims)
  # ==================================================================
  - section: state_machines
    instances:
      - name: appointment_initial_state_booked
        claim_type: initial_state
        grounds: [state_machines.Appointment]
        distinguishing_aspect: "Newly booked appointment starts BOOKED with cancel_reason NONE."
        test_recipe:
          setup: ["clock 2026-05-01; student; provider"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S10", full_name: "Init State" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr A", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
          trigger:
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
          assert:
            - "trigger[0]: HTTP 201, status == BOOKED, cancel_reason == NONE"

      - name: appointment_invalid_transitions
        claim_type: invalid_transition
        grounds: [state_machines.Appointment, "errors[ERR_APPOINTMENT_NOT_BOOKED]", "errors[ERR_APPOINTMENT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Check-in from CANCELLED fails; cancel from COMPLETED (terminal lockdown) fails."
        test_recipe:
          setup: ["clock 2026-05-01; ENROLLED student; provider; appt1 BOOKED (will be cancelled); appt2 driven to COMPLETED via fee-covered urgent encounter"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S11", full_name: "Trans Test" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr B", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: FrontDeskStaff, captures: { appt1: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt2: $.data.id } }
            - { call: "POST /shc/appointments/${appt2}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc2: $.data.id } }
            - { call: "POST /shc/encounters/${enc2}/close", payload: {}, as: Clinician }
            - { call: "POST /shc/appointments/${appt1}/cancel", payload: {}, as: FrontDeskStaff }
          trigger:
            - { call: "POST /shc/appointments/${appt1}/check-in", payload: {}, as: FrontDeskStaff, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/appointments/${appt2}/cancel", payload: {}, as: FrontDeskStaff, captures: { err2: $.data.error_id } }
          assert:
            - "setup_api_calls[5]: appt2 encounter closed (fee-covered urgent, no invoice needed) so Appointment.${appt2}.status == COMPLETED"
            - "trigger[0]: HTTP 409, error_id == ERR_APPOINTMENT_NOT_BOOKED (check-in from CANCELLED)"
            - "trigger[1]: HTTP 409, error_id == ERR_APPOINTMENT_NOT_CANCELLABLE (cancel from terminal COMPLETED)"

      - name: appointment_no_show_by_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.Appointment]
        distinguishing_aspect: "A BOOKED appointment whose scheduled_end passes under the logical clock becomes NO_SHOW via the sweep, with no client call."
        test_recipe:
          setup: ["clock 2026-05-01; BOOKED appointment 2026-05-02T10:00-10:30"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S12", full_name: "No Show" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr C", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "FOLLOW_UP", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
          trigger:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: HealthAdmin }
            - { call: "GET /shc/appointments/${appt}", payload: {}, as: Any }
          assert:
            - "trigger[1]: Appointment.${appt}.status == NO_SHOW"

      - name: encounter_close_gates_and_child_lockout
        claim_type: precondition_enforcement
        grounds: [state_machines.Encounter, "errors[ERR_UNRESOLVED_CLINICAL_WORK]", "errors[ERR_BILLING_NOT_CODED]", "errors[ERR_ENCOUNTER_NOT_OPEN]"]
        distinguishing_aspect: "Close is gated on terminal children (lab REVIEWED) and on billing coded for chargeable encounters; after close the encounter rejects new children."
        test_recipe:
          setup: ["clock 2026-05-01; ENROLLED student; provider; enc1 urgent with an ORDERED lab; enc2 SPORTS_PHYSICAL (chargeable) with no invoice"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S13", full_name: "Gate Test" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr D", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: FrontDeskStaff, captures: { appt1: $.data.id } }
            - { call: "POST /shc/appointments/${appt1}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc1: $.data.id } }
            - { call: "POST /shc/encounters/${enc1}/lab-orders", payload: { test_code: "CBC" }, as: Clinician, captures: { lab1: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt2: $.data.id } }
            - { call: "POST /shc/appointments/${appt2}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc2: $.data.id } }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "GATE1", medication_name: "Gate Drug", initial_on_hand: 10, reorder_threshold: 0 }, as: Pharmacist, captures: { stk: $.data.id } }
          trigger:
            - { call: "POST /shc/encounters/${enc1}/close", payload: {}, as: Clinician, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/encounters/${enc2}/close", payload: {}, as: Clinician, captures: { err2: $.data.error_id } }
            - { call: "POST /shc/encounters/${enc2}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 3000 } ] }, as: BillingOfficer, captures: { inv: $.data.id } }
            - { call: "POST /shc/encounters/${enc2}/close", payload: {}, as: Clinician }
            - { call: "POST /shc/encounters/${enc2}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 1 }, as: Clinician, captures: { err3: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 409, error_id == ERR_UNRESOLVED_CLINICAL_WORK (lab ORDERED, not REVIEWED)"
            - "trigger[1]: HTTP 409, error_id == ERR_BILLING_NOT_CODED (chargeable SPORTS_PHYSICAL without invoice)"
            - "trigger[3]: HTTP 200, Encounter.${enc2}.status == CLOSED and appointment ${appt2} becomes COMPLETED"
            - "trigger[4]: HTTP 409, error_id == ERR_ENCOUNTER_NOT_OPEN (real stock id passes existence P3; the CLOSED encounter state check P4 fires)"

      - name: prescription_invalid_transition_matrix
        claim_type: invalid_transition
        grounds: [state_machines.Prescription, "errors[ERR_PRESCRIPTION_NOT_CANCELLABLE]", "errors[ERR_DISPENSE_QUANTITY_EXCEEDS]", "errors[ERR_INSUFFICIENT_STOCK]", "errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "Partially-dispensed prescriptions cannot be cancelled; dispense beyond remaining, beyond stock, and zero-quantity each fail with their own error."
        test_recipe:
          setup: ["clock 2026-05-01; ENROLLED student; urgent encounter open; stock 10 units threshold 0; rx1 qty 5 (2 dispensed), rx2 qty 20, rx3 qty 5"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S14", full_name: "Rx Matrix" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr E", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/medication-stocks", payload: { medication_code: "MTRX", medication_name: "Matrix Drug", initial_on_hand: 10, reorder_threshold: 0 }, as: Pharmacist, captures: { stk: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 5 }, as: Clinician, captures: { rx1: $.data.id } }
            - { call: "POST /shc/prescriptions/${rx1}/dispense", payload: { quantity: 2 }, as: Pharmacist }
            - { call: "POST /shc/encounters/${enc}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 20 }, as: Clinician, captures: { rx2: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/prescriptions", payload: { medication_stock_id: "${stk}", quantity: 5 }, as: Clinician, captures: { rx3: $.data.id } }
          trigger:
            - { call: "POST /shc/prescriptions/${rx1}/cancel", payload: {}, as: Clinician, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/prescriptions/${rx1}/dispense", payload: { quantity: 4 }, as: Pharmacist, captures: { err2: $.data.error_id } }
            - { call: "POST /shc/prescriptions/${rx2}/dispense", payload: { quantity: 20 }, as: Pharmacist, captures: { err3: $.data.error_id } }
            - { call: "POST /shc/prescriptions/${rx3}/dispense", payload: { quantity: 0 }, as: Pharmacist, captures: { err4: $.data.error_id } }
          assert:
            - "trigger[0]: HTTP 409, error_id == ERR_PRESCRIPTION_NOT_CANCELLABLE (rx1 PARTIALLY_DISPENSED)"
            - "trigger[1]: HTTP 422, error_id == ERR_DISPENSE_QUANTITY_EXCEEDS (4 > remaining 3)"
            - "trigger[2]: HTTP 409, error_id == ERR_INSUFFICIENT_STOCK (20 > on_hand 8 after the 2-unit dispense)"
            - "trigger[3]: HTTP 422, error_id == ERR_INVALID_QUANTITY (quantity must be > 0)"

      - name: invoice_lifecycle_error_chain
        claim_type: invalid_transition
        grounds: [state_machines.Invoice, state_machines.Payment, "errors[ERR_INVOICE_NOT_PAYABLE]", "errors[ERR_INVOICE_NOT_DRAFT]", "errors[ERR_INVOICE_EXISTS]", "errors[ERR_OVERPAYMENT]", "errors[ERR_PAYMENT_NOT_VOIDABLE]"]
        distinguishing_aspect: "Full billing state ladder: payment on DRAFT, re-issue, duplicate invoice, overpayment, terminal PAID lockdown, and double-void each fail with their own error while the happy path interleaves."
        test_recipe:
          setup: ["clock 2026-05-01; student (no policy -> self-pay); SPORTS_PHYSICAL encounter open"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S15", full_name: "Bill Chain" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr F", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "SPORTS_PHYSICAL", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 5000 } ] }, as: BillingOfficer, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /shc/invoices/${inv}/payments", payload: { amount_cents: 100, method: "CARD" }, as: BillingOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /shc/invoices/${inv}/issue", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/invoices/${inv}/issue", payload: {}, as: BillingOfficer, captures: { err2: $.data.error_id } }
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "SPORTS_FEE", charge_cents: 5000 } ] }, as: BillingOfficer, captures: { err3: $.data.error_id } }
            - { call: "POST /shc/invoices/${inv}/payments", payload: { amount_cents: 5001, method: "CARD" }, as: BillingOfficer, captures: { err4: $.data.error_id } }
            - { call: "POST /shc/invoices/${inv}/payments", payload: { amount_cents: 5000, method: "CARD" }, as: BillingOfficer, captures: { pay: $.data.id } }
            - { call: "POST /shc/invoices/${inv}/payments", payload: { amount_cents: 1, method: "CARD" }, as: BillingOfficer, captures: { err5: $.data.error_id } }
            - { call: "POST /shc/payments/${pay}/void", payload: {}, as: BillingOfficer }
            - { call: "POST /shc/payments/${pay}/void", payload: {}, as: BillingOfficer, captures: { err6: $.data.error_id } }
            - { call: "GET /shc/invoices/${inv}", payload: {}, as: Any }
          assert:
            - "trigger[0]: HTTP 409, error_id == ERR_INVOICE_NOT_PAYABLE (DRAFT)"
            - "trigger[1]: status == ISSUED, variant == FINAL, due_date == '2026-05-31', balance_cents == 5000"
            - "trigger[2]: HTTP 409, error_id == ERR_INVOICE_NOT_DRAFT"
            - "trigger[3]: HTTP 409, error_id == ERR_INVOICE_EXISTS"
            - "trigger[4]: HTTP 422, error_id == ERR_OVERPAYMENT (5001 > balance 5000)"
            - "trigger[5]: payment POSTED; invoice balance_cents == 0 and status == PAID (exact-boundary payoff)"
            - "trigger[6]: HTTP 409, error_id == ERR_INVOICE_NOT_PAYABLE (PAID terminal)"
            - "trigger[7]: payment VOIDED; invoice balance_cents == 5000, status == ISSUED (due date still future)"
            - "trigger[8]: HTTP 409, error_id == ERR_PAYMENT_NOT_VOIDABLE"

      - name: invoice_rejected_for_fee_covered_encounter
        claim_type: conditional_action
        grounds: [entities.Encounter.fields.fee_covered, "errors[ERR_INVOICE_NOT_ALLOWED]"]
        distinguishing_aspect: "Fee-covered encounters (urgent visit, ENROLLED student) never carry an invoice; generation is rejected."
        test_recipe:
          setup: ["clock 2026-05-01; ENROLLED student; urgent encounter open"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S16", full_name: "Fee Covered" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr G", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
          trigger:
            - { call: "POST /shc/encounters/${enc}/invoice", payload: { lines: [ { service_category: "CONSULT", charge_cents: 5000 } ] }, as: BillingOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /shc/encounters/${enc}/close", payload: {}, as: Clinician }
          assert:
            - "trigger[0]: HTTP 409, error_id == ERR_INVOICE_NOT_ALLOWED"
            - "trigger[1]: HTTP 200 — fee-covered encounter closes with no invoice; Encounter.fee_covered == true"

      - name: lab_order_invalid_transition_matrix
        claim_type: invalid_transition
        grounds: [state_machines.LabOrder, "errors[ERR_LAB_ORDER_NOT_COLLECTED]", "errors[ERR_LAB_ORDER_NOT_RESULTED]", "errors[ERR_LAB_ORDER_NOT_ORDERED]", "errors[ERR_REPORTABLE_CODE_REQUIRED]"]
        distinguishing_aspect: "Result before collect, review before result, double collect, and reportable flag without a disease code each fail distinctly."
        test_recipe:
          setup: ["clock 2026-05-01; ENROLLED student; urgent encounter open; lab1 with reportable code; lab2 without"]
          setup_api_calls:
            - { call: "POST /shc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: HealthAdmin }
            - { call: "POST /shc/students", payload: { external_ref: "S17", full_name: "Lab Matrix" }, as: HealthAdmin, captures: { stu: $.data.id } }
            - { call: "POST /shc/providers", payload: { full_name: "Dr H", provider_type: "CLINICIAN" }, as: HealthAdmin, captures: { prov: $.data.id } }
            - { call: "POST /shc/appointments", payload: { student_id: "${stu}", provider_id: "${prov}", visit_type: "PRIMARY_URGENT", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: FrontDeskStaff, captures: { appt: $.data.id } }
            - { call: "POST /shc/appointments/${appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { enc: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/lab-orders", payload: { test_code: "FLU_PCR", reportable_disease_code: "INFLUENZA" }, as: Clinician, captures: { lab1: $.data.id } }
            - { call: "POST /shc/encounters/${enc}/lab-orders", payload: { test_code: "CBC" }, as: Clinician, captures: { lab2: $.data.id } }
          trigger:
