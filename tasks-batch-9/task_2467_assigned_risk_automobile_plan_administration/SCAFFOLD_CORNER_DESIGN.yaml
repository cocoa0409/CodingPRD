      - name: per_line_rounding_is_not_sum_then_round
        claim_type: precision
        grounds:
          - calculations.annual_premium.precision
          - calculations.annual_premium.formula
        excluded_because:
          difficulty_instance: per_line_rounding_then_sum_pins_annual_premium
          rationale: "That instance is built on the documented 237340-versus-237339 divergence: it asserts the three rounded coverage lines individually and their sum, so the sum-then-round implementation is falsified."
      - name: expense_tier_boundaries_are_exclusive
        claim_type: tiered_pricing
        grounds:
          - calculations.plan_expense_charge.constants
          - calculations.plan_expense_charge.precision
        excluded_because:
          difficulty_instance: expense_charge_tier_read_from_pre_charge_premium
          rationale: "That instance straddles the 150000 boundary on purpose and distinguishes tier selection from the pre-charge premium (7417) from selection off the charge-inclusive total (5933), covering the tier-boundary claim."
      - name: surcharge_step_function_at_the_band_edge
        claim_type: threshold
        grounds:
          - calculations.surcharge_points
          - calculations.annual_premium.constants.SURCHARGE_FACTOR
        excluded_because:
          difficulty_instance: surcharge_factor_step_boundary_at_exactly_six_points
          rationale: "That instance tests 5, 6 and the 1095-day window edge that decides between them, which is exactly the threshold-1 / threshold / threshold+1 claim for the step function."
      - name: refund_variants_diverge_on_the_same_data
        claim_type: variant_divergence
        grounds:
          - calculations.earned_premium_at_cancellation.variants
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: cancellation_refund_pro_rata_versus_short_rate_divergence
          rationale: "That instance cancels the identical policy on the identical day under both variants and asserts both earned figures and the delta, which is the variant-divergence claim in full."
      - name: posture_ladder_reaches_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.carrier_performance_and_posture.formula
          - calculations.carrier_performance_and_posture.precision
        excluded_because:
          difficulty_instance: second_upheld_complaint_cascades_into_suspension_rescission_and_requeue
          rationale: "That instance walks the score from 100 to 80 to 60 with the clamp applied after each individual adjustment and asserts the ordered ladder landing on SUSPENDED, then propagates that posture through the assignment book."
  - section: validations
    instances:
      - name: every_declared_unique_identifier_is_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=11][error_id=ERR_DUPLICATE_IDENTIFIER]
          - errors[ERR_DUPLICATE_IDENTIFIER]
          - entities.Carrier.fields.naic_code
          - entities.Producer.fields.license_number
          - entities.Applicant.fields.driver_license_number
          - entities.Vehicle.fields.vin
          - entities.PlanPeriod.fields.period_code
        distinguishing_aspect: |
          Five different uniqueness scopes, one error id, and all of them are global rather than
          per-parent: a VIN already registered to ANOTHER applicant is still a duplicate, which is
          what stops the same car from being insured twice through the plan. Each collision returns
          409 and writes nothing.
