            - "trigger call 4 returns HTTP 200 with Entry.${e_a}.registration_status == ACCEPTED and crew_weight_kg 163.8"
            - "trigger call 7 returns HTTP 200 with Entry.${e_b}.registration_status == ACCEPTED, registered_crew_count 1 and crew_weight_kg 78.0"
            - "Division.${div_a}.accepted_entry_count == 2 and assigned_entry_count == 2 at the end"
            - "Division.${div_a}.status is still PROVISIONAL: acceptance alone never confirms a division"

      - name: merge_without_same_hull_scope_sibling_returns_no_merge_target
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_MERGE_TARGET]
          - validations[priority 31 ERR_NO_MERGE_TARGET]
          - calculations.division_merge_target_selection
        distinguishing_aspect: |
          A sibling division only counts as a merge target when its boat_type_filter equals the
          source's or is ANY, so a MONOHULL division whose only sibling is MULTIHULL answers 409
          ERR_NO_MERGE_TARGET and stays PROVISIONAL - and the identical merge call succeeds the
          moment a second MONOHULL division exists.
        test_recipe:
          setup:
            - "A regatta with the notice of race published, fleet_minimum 2, and two divisions with no entries: A (MONOHULL 165.0-175.0) and M (MULTIHULL 170.0-172.0), each min_entries 2."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", planned_race_count: 6, fleet_minimum: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 165.0, rating_band_high: 175.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_a: $.data.id } }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "M", boat_type_filter: "MULTIHULL", rating_band_low: 170.0, rating_band_high: 172.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_m: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/divisions/${div_a}/merge", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "B", boat_type_filter: "ANY", rating_band_low: 176.0, rating_band_high: 200.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_b: $.data.id } }
            - { call: "POST /regatta-ops/divisions/${div_a}/merge", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_NO_MERGE_TARGET and leaves Division.${div_a}.status == PROVISIONAL with merged_into_division_id null"
            - "trigger call 3 returns HTTP 200 with Division.${div_a}.status == MERGED and merged_into_division_id == ${div_b}: an ANY sibling is in scope for a MONOHULL source"
            - "Division.${div_m}.status == PROVISIONAL throughout: it was never a candidate"
            - "no Entry row was re-pointed, because division ${div_a} held none"

      - name: start_sequence_rejected_by_pending_si_then_by_missing_staffing
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SAILING_INSTRUCTIONS_NOT_EFFECTIVE]
          - errors[ERR_STAFFING_INCOMPLETE]
          - validations[priority 15 ERR_SAILING_INSTRUCTIONS_NOT_EFFECTIVE]
          - validations[priority 20 ERR_STAFFING_INCOMPLETE]
        distinguishing_aspect: |
          An SI amendment published after racing opened re-arms the priority-15 gate even though the
          regatta is already RACING: with the clock at 2026-08-01 the start sequence answers 409
          ERR_SAILING_INSTRUCTIONS_NOT_EFFECTIVE and never reaches the staffing check, and only once
          the clock passes the amendment's effective_utc does the same call fall through to 422
          ERR_STAFFING_INCOMPLETE, twice, until PRO, TIMEKEEPER and SIGNALS are all confirmed.
        test_recipe:
          setup:
            - "A light RACING world: regatta with fleet_minimum 2 and jury_quorum_required 2, NOR revision 1 and SI revision 1 (effective 2026-07-15) published, division A (MONOHULL 150.0-230.0, min_entries 2) CONFIRMED with two assigned entries, a SEATED jury panel, racing opened."
            - "After racing opened, SI revision 2 is published effective 2026-08-06T00:00:00Z, which is later than the initial logical clock 2026-08-01T00:00:00Z."
            - "Race 1 is DISTANCE_COASTAL, 6.0 nm, scheduled 2026-08-06T14:00:00Z, so the coverage window is 13:30-16:00 and the required positions are PRO, TIMEKEEPER and SIGNALS."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
