  # ==================================================== cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_program_patch_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[program-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the creation version (1) succeeds and bumps version to 2; replaying the same PATCH with the stale version 1 -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Cycle + program (auto_waitlist_activation default false)"]
          setup_api_calls:
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "OCC1", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "PATCH /enrollment/programs/${p_id}"
              payload: { auto_waitlist_activation: true, expected_program_version: "${p_v}" }
              as: EnrollmentManager
              captures: { p_v2: $.data.version }
            - call: "PATCH /enrollment/programs/${p_id}"
              payload: { target_enrollment: 3, expected_program_version: "${p_v}" }
              as: EnrollmentManager
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds; Program.version == 2 (${p_v} + 1) and auto_waitlist_activation == true"
            - "Second PATCH with the stale version -> ERR_STALE_VERSION (412); target_enrollment unchanged at 2"

      - name: occ_aid_offer_create_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[aid-offer-create-stale-application]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "POST /enrollment/aid-offers with expected_application_version one behind the observed version -> ERR_STALE_VERSION (412); with the exact observed version -> 201 and the application's version increments by 1."
        test_recipe:
          setup: ["Cycle OPEN; program budget 5000000 tuition 5000000; ADMITTED application (score 90)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "OCC2", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 5000000, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Occ A", email: "occ@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 90, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1: $.data.id }
            - { call: "POST /enrollment/reviews/${r1}/submit", payload: { score_academic: 90, score_fit: 90, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2: $.data.id }
            - { call: "POST /enrollment/reviews/${r2}/submit", payload: { score_academic: 90, score_fit: 90, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/applications/${app_id}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /enrollment/aid-offers"
              payload: { application_id: "${app_id}", fund_type: "MERIT", expected_application_version: "${app_v} - 1" }
              as: FinancialAidOfficer
              captures: { err: $.data.error_id }
            - call: "POST /enrollment/aid-offers"
              payload: { application_id: "${app_id}", fund_type: "MERIT", expected_application_version: "${app_v}" }
              as: FinancialAidOfficer
              captures: { offer_id: $.data.id }
            - call: "GET /enrollment/applications/${app_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { app_v_after: $.data.version }
          assert:
            - "Stale create -> ERR_STALE_VERSION (412); no offer persisted"
            - "Fresh create -> 201, AidOffer ${offer_id} OFFERED with amount_cents == 1750000"
            - "Application.version advanced from ${app_v} to ${app_v_after} == ${app_v} + 1"

