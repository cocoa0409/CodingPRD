  - { method: POST, path: "/retention-boxes/{id}/purge", description: "Purge a stored box (STORED -> DESTROYED)", roles: [AccountManager], code: 200, input: [], output: RetentionBox, side_effects: ["status -> DESTROYED", "barcode freed"] }

  # ----- RetrievalRequest -----
  - { method: POST, path: "/retrieval-requests", description: "Open a retrieval request against a box", roles: [AccountManager], code: 201,
      input: [box_id, account_id, priority, requested_by], output: RetrievalRequest, side_effects: ["status := PENDING", "delivered_period := -1"] }
  - { method: GET, path: "/retrieval-requests/{id}", description: "Get a retrieval request", roles: [AccountManager, PlantOperator, ComplianceOfficer], code: 200, input: [], output: RetrievalRequest, side_effects: [] }
  - { method: GET, path: "/retrieval-requests", description: "List retrieval requests, filterable by box_id and account_id (reverse-reachability for RetrievalRequest.box_id and .account_id)", roles: [AccountManager, PlantOperator, ComplianceOfficer], code: 200,
      input: ["box_id?", "account_id?", "status?", "limit?", "offset?"], output: "RetrievalRequest[]", side_effects: [] }
  - { method: POST, path: "/retrieval-requests/{id}/fulfill", description: "Fulfill a retrieval (PENDING -> DELIVERED; charge snapshot)", roles: [PlantOperator], code: 200,
      input: [], output: RetrievalRequest, side_effects: ["retrieval_charge_cents := retrieval_charge calc", "delivered_period := account.current_period_index", "box STORED -> OUT_FOR_RETRIEVAL"] }
  - { method: POST, path: "/retrieval-requests/{id}/start-return", description: "Begin box return (DELIVERED -> RETURN_PENDING)", roles: [AccountManager], code: 200, input: [], output: RetrievalRequest, side_effects: [] }
  - { method: POST, path: "/retrieval-requests/{id}/return", description: "Complete box return (RETURN_PENDING -> RETURNED)", roles: [PlantOperator], code: 200, input: [], output: RetrievalRequest, side_effects: ["box OUT_FOR_RETRIEVAL -> STORED"] }
  - { method: POST, path: "/retrieval-requests/{id}/refuse-return", description: "Refuse return (RETURN_PENDING -> DELIVERED; box stays out)", roles: [PlantOperator], code: 200, input: [], output: RetrievalRequest, side_effects: ["cycle back to DELIVERED"] }
  - { method: POST, path: "/retrieval-requests/{id}/cancel", description: "Cancel a pending retrieval (PENDING -> CANCELLED)", roles: [AccountManager], code: 200, input: [], output: RetrievalRequest, side_effects: [] }

  # ----- ComplianceHold -----
  - { method: POST, path: "/compliance-holds", description: "Place a litigation/audit/regulatory hold on a box or order", roles: [ComplianceOfficer], code: 201,
      input: [account_id, subject_type, subject_id, reason], output: ComplianceHold, side_effects: ["status := ACTIVE"] }
  - { method: GET, path: "/compliance-holds/{id}", description: "Get a compliance hold", roles: [ComplianceOfficer, AccountManager], code: 200, input: [], output: ComplianceHold, side_effects: [] }
  - { method: GET, path: "/compliance-holds", description: "List compliance holds, filterable by account_id and subject_id (reverse-reachability for ComplianceHold.account_id)", roles: [ComplianceOfficer, AccountManager], code: 200,
      input: ["account_id?", "subject_id?", "status?", "limit?", "offset?"], output: "ComplianceHold[]", side_effects: [] }
  - { method: POST, path: "/compliance-holds/{id}/release", description: "Release a hold (ACTIVE -> RELEASED)", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceHold, side_effects: ["status -> RELEASED"] }

  # ----- StorageInvoice -----
  - { method: GET, path: "/storage-invoices/{id}", description: "Get a storage invoice", roles: [ComplianceOfficer, AccountManager], code: 200, input: [], output: StorageInvoice, side_effects: [] }
  - { method: GET, path: "/storage-invoices", description: "List storage invoices, filterable by account_id (reverse-reachability for StorageInvoice.account_id)", roles: [ComplianceOfficer, AccountManager], code: 200,
      input: ["account_id?", "period_index?", "status?", "limit?", "offset?"], output: "StorageInvoice[]", side_effects: [] }
  - { method: POST, path: "/storage-invoices/{id}/pay", description: "Mark a storage invoice paid (ISSUED -> PAID)", roles: [ComplianceOfficer], code: 200, input: [], output: StorageInvoice, side_effects: ["status -> PAID"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header absent/malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for the operation" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Account id in path/body does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "ServiceOrder id does not exist" }
  - { id: ERR_BOX_NOT_FOUND, http: 404, condition: "RetentionBox id does not exist" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "RetrievalRequest id does not exist" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Other referenced resource (location, container, rate card, certificate, invoice, hold) not found, or polymorphic subject_id unresolved" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_serviceorder_version != current ServiceOrder.version on reschedule" }
  - { id: ERR_ORDER_NOT_SCHEDULED, http: 409, condition: "dispatch on an order not in SCHEDULED" }
  - { id: ERR_ORDER_NOT_EN_ROUTE, http: 409, condition: "shred-on-site or off-site confirm-pickup on an order not in EN_ROUTE" }
  - { id: ERR_ORDER_NOT_DROP_OFF_READY, http: 409, condition: "drop-off confirm-pickup on an order not in SCHEDULED" }
  - { id: ERR_ORDER_NOT_PICKED_UP, http: 409, condition: "receive-at-plant on an order not in PICKED_UP" }
  - { id: ERR_ORDER_NOT_AT_PLANT, http: 409, condition: "destroy on an order not in AT_PLANT" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel on an order not in SCHEDULED or EN_ROUTE" }
  - { id: ERR_DISPATCH_NOT_APPLICABLE, http: 409, condition: "dispatch on a DROP_OFF order (no dispatch hop)" }
  - { id: ERR_MODE_NOT_ON_SITE, http: 409, condition: "shred-on-site on an order whose service_mode != ON_SITE" }
  - { id: ERR_MODE_NOT_OFF_SITE, http: 409, condition: "confirm-pickup from EN_ROUTE on an order whose service_mode != OFF_SITE_PICKUP" }
  - { id: ERR_MODE_NOT_DROP_OFF, http: 409, condition: "confirm-pickup from SCHEDULED on an order whose service_mode != DROP_OFF" }
  - { id: ERR_WEIGH_IN_REQUIRED, http: 409, condition: "shred-on-site or receive-at-plant with no WeightTicket recorded" }
  - { id: ERR_CERTIFICATE_ALREADY_ISSUED, http: 409, condition: "cancel attempted after a DestructionCertificate exists for the order" }
  - { id: ERR_SUBJECT_ON_HOLD, http: 409, condition: "destroy/purge/dispatch/fulfill/drop-off-pickup on a subject with an ACTIVE ComplianceHold" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "destroy witnessed by the same user id recorded as order.assigned_tech_id" }
  - { id: ERR_RETENTION_NOT_ELAPSED, http: 409, condition: "purge before account.current_period_index >= box.destroy_after_period" }
  - { id: ERR_SLOT_CONFLICT, http: 409, condition: "order window (half-open [start,end)) overlaps a non-terminal order sharing a container" }
  - { id: ERR_ONSITE_BUFFER_CONFLICT, http: 409, condition: "two ON_SITE orders at the same location have buffered (closed) windows that overlap within ONSITE_BUFFER_MINUTES" }
  - { id: ERR_BOX_NOT_INGESTED, http: 409, condition: "shelve on a box not in INGESTED" }
  - { id: ERR_BOX_NOT_STORED, http: 409, condition: "purge or fulfill on a box not in STORED" }
  - { id: ERR_BOX_NOT_OUT, http: 409, condition: "return on a box not in OUT_FOR_RETRIEVAL" }
  - { id: ERR_REQUEST_NOT_PENDING, http: 409, condition: "fulfill on a request not in PENDING" }
  - { id: ERR_REQUEST_NOT_DELIVERED, http: 409, condition: "start-return on a request not in DELIVERED" }
  - { id: ERR_RETURN_NOT_PENDING, http: 409, condition: "return or refuse-return on a request not in RETURN_PENDING" }
  - { id: ERR_REQUEST_NOT_CANCELLABLE, http: 409, condition: "cancel on a request not in PENDING" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "release on a hold not in ACTIVE" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "create order/request or suspend on an account not in ACTIVE" }
  - { id: ERR_ACCOUNT_NOT_SUSPENDED, http: 409, condition: "reactivate on an account not in SUSPENDED" }
  - { id: ERR_ACCOUNT_NOT_CLOSABLE, http: 409, condition: "close on an account not in ACTIVE/SUSPENDED" }
  - { id: ERR_OUTSTANDING_BOXES, http: 409, condition: "close with boxes still in INGESTED/STORED/OUT_FOR_RETRIEVAL" }
  - { id: ERR_OUTSTANDING_ORDERS, http: 409, condition: "close with service orders in a non-terminal state" }
  - { id: ERR_CONTAINER_LOCATION_MISMATCH, http: 409, condition: "a container in container_ids belongs to a different account or location than the order" }
  - { id: ERR_DUPLICATE_BARCODE, http: 409, condition: "retention box barcode already used by a non-DESTROYED box on the account" }
  - { id: ERR_INVALID_FIELD_VALUE, http: 422, condition: "negative weight, non-positive capacity, negative free_periods, rush_multiplier_bps < 10000, slot_end <= slot_start, or invalid enum member" }
  - { id: ERR_NO_ACTIVE_RATE_CARD, http: 409, condition: "pricing operation (order create, weigh-in finalize, retrieval fulfill, period close) with no ACTIVE rate card on the account" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Owns accounts, rate cards, compliance holds, certificate voids, billing periods, invoices"
    identity: opaque
    exclusive_operations:
      - "POST /accounts, /accounts/{id}/suspend, /reactivate, /close"
      - "POST /rate-cards, /rate-cards/{id}/activate"
      - "POST /accounts/{id}/credit, /accounts/{id}/advance-period"
      - "POST /compliance-holds, /compliance-holds/{id}/release"
      - "POST /certificates/{id}/void"
      - "POST /storage-invoices/{id}/pay, /destruction-invoices/{id}/pay"
    shared_operations:
      - "GET reads across accounts, orders, boxes, requests, certificates, custody-events, invoices, holds"

  - name: AccountManager
    description: "Customer-facing operator: locations, orders, retrieval requests, purges, cancellations"
    identity: opaque
    exclusive_operations:
      - "POST /locations"
      - "POST /service-orders/{id}/reschedule"
      - "POST /service-orders/{id}/cancel"
      - "POST /retention-boxes/{id}/purge"
      - "POST /retrieval-requests, /retrieval-requests/{id}/cancel, /start-return"
      - "POST /containers/{id}/retire"
    shared_operations:
      - "POST /service-orders, /containers, /retention-boxes (with peers)"
      - "GET account-scoped reads"

  - name: FieldTechnician
    description: "Takes physical custody: container placement, dispatch, weigh-in, on-site shred, pickup. Custody-taker side of SoD."
    identity: opaque
    exclusive_operations:
      - "POST /service-orders/{id}/dispatch"
      - "POST /service-orders/{id}/shred-on-site"
      - "POST /service-orders/{id}/confirm-pickup"
    shared_operations:
      - "POST /service-orders, /containers (with AccountManager)"
      - "POST /service-orders/{id}/weigh-in (with PlantOperator)"
      - "GET orders/containers/custody-events/weight-tickets"

  - name: PlantOperator
    description: "Plant-side custody and storage: receive-at-plant, weigh-in, shelve, retrieval fulfill/return, box ingest"
    identity: opaque
    exclusive_operations:
      - "POST /service-orders/{id}/receive-at-plant"
      - "POST /retention-boxes/{id}/shelve"
      - "POST /retrieval-requests/{id}/fulfill, /return, /refuse-return"
    shared_operations:
      - "POST /service-orders/{id}/weigh-in (with FieldTechnician)"
      - "POST /retention-boxes (with AccountManager)"
      - "GET orders/boxes/requests/custody-events"

  - name: DestructionWitness
    description: "Independent witness who signs final destruction. Witness side of SoD — must not equal the custody-taker."
    identity: opaque
    exclusive_operations:
      - "POST /service-orders/{id}/destroy"
    shared_operations:
      - "GET orders/custody-events/certificates"
