            - "data.cnt_after == 1 && data.fee_after == 18"
            - "the void response carries the voided posting's id as data.void_id and its decision is reset out of the licence's accrual"
            - "GET /fee-ledger-entries?license_id=${lic} reports total_count == 3 — two MARGINAL_PRICING rows and one VOID_REVERSAL row at -18 cents"

      - name: endpoint_migration_event_list_filters_by_both_endpoint_variants
