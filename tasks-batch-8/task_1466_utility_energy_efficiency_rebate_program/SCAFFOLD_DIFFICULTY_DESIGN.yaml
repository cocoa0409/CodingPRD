  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_service_address_half_open_window
        grounds:
          - calculations.fraud_risk_score
          - entities.FraudFlag.fields.flag_kind
        distinguishing_aspect: |
          Resource: service_address (entity: RebateApplication). Interval
          semantics: half-open trailing 30-day window anchored on invoice_date
          [invoice_date - 30d, invoice_date). The right endpoint (current
          application's invoice_date) is EXCLUDED — so two applications with
          identical invoice_date do NOT trigger the flag; one 14 days prior IS
          included (within window). Existence-trigger (any match), not count.
