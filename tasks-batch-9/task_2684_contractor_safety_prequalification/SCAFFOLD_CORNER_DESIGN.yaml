          - entities.InsuranceCertificate.fields.available_aggregate
        distinguishing_aspect: "Creation seeds the verification dimension at PENDING while simultaneously materializing the independent lifecycle dimension from the clock: a certificate whose window has already opened is CURRENT, and a second one whose window opens later is NOT_YET_EFFECTIVE - the two dimensions are set by the same request but from different inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Contractor Acme registered with no certificates and open_severe_incident_count 0."
          setup_api_calls:
