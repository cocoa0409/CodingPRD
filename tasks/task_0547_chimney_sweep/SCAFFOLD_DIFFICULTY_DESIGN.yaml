# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Chimney Sweep & Fireplace Service — 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_sweep_provisional_vs_final
        grounds:
          - calculations.sweep_service_cost
          - entities.ServiceJob.fields.sweep_provisional_cost_cents
          - entities.ServiceJob.fields.sweep_final_cost_cents
          - state_machines.ServiceJob.CONDITIONS
        distinguishing_aspect: "Same ServiceJob yields sweep_provisional_cost_cents=27500 (expected class 1, no glaze) and sweep_final_cost_cents=50500 (measured class 3, glaze) — the two variants operate on the sweep-cost subject of the ServiceJob/SweepLog domain."
        test_recipe:
          setup:
            - "A ServiceJob with inspection_level=2, expected_creosote_class=1, trip_zone=B (provisional sweep = 24000+0+0+3500 = 27500)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Ada Ember", service_address: "1 Hearth Ln", phone: "555-0100" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tom Soot", cert_level: "CSIA_ADVANCED" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 2, expected_creosote_class: 1, trip_zone: "B" }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /service-jobs/${job_id}/sweep"
              payload: { measured_creosote_class: 3, glaze_present: true }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "ServiceJob.${job_id}.sweep_provisional_cost_cents == 27500"
            - "ServiceJob.${job_id}.sweep_final_cost_cents == 50500"
            - "ServiceJob.${job_id}.sweep_provisional_cost_cents != ServiceJob.${job_id}.sweep_final_cost_cents"

      - name: dvc_warranty_labor_only_vs_parts_inclusive
        grounds:
          - calculations.warranty_claim_credit
          - entities.Warranty.fields.coverage_type
          - entities.Warranty.fields.last_claim_credit_cents
          - state_machines.Warranty.ISSUED_to_CLAIMED
        distinguishing_aspect: "For identical labor=8000, parts=4000, term=12, elapsed=3, LABOR_ONLY credits 8000 while PARTS_INCLUSIVE credits 11000 — the dual variant lives in the Warranty domain, distinct from the sweep-cost domain of dvc_sweep_provisional_vs_final."
        test_recipe:
          setup:
            - "Clock at 2026-06-01. Two COMPLETED repair orders each final=12000, labor=8000 (parts=4000). Warranty W1 LABOR_ONLY and W2 PARTS_INCLUSIVE, both term_months=12 issued 2026-06-01. Clock advanced to 2026-09-01 (elapsed 3 months)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /customers"
              payload: { name: "Ada Ember", service_address: "1 Hearth Ln", phone: "555-0100" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tom Soot", cert_level: "MASTER" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, repair_authorization_cents: 100000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /service-jobs/${job_id}/safety-check"
              payload: { co_ppm: 3, draft_ok: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "CAP-STD", quoted_cost_cents: 12000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro1_id: $.data.id }
            - call: "POST /repair-orders/${ro1_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
            - call: "POST /repair-orders/${ro1_id}/transitions"
              payload: { action: "START" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders/${ro1_id}/transitions"
              payload: { action: "COMPLETE", final_cost_cents: 12000, labor_cents: 8000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "LINER", part_sku: "LNR-SS6", quoted_cost_cents: 12000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro2_id: $.data.id }
            - call: "POST /repair-orders/${ro2_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
            - call: "POST /repair-orders/${ro2_id}/transitions"
              payload: { action: "START" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders/${ro2_id}/transitions"
              payload: { action: "COMPLETE", final_cost_cents: 12000, labor_cents: 8000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /warranties"
              payload: { repair_order_id: "${ro1_id}", service_job_id: "${job_id}", coverage_type: "LABOR_ONLY", term_months: 12 }
              as: BillingClerk
              captures: { w1_id: $.data.id }
            - call: "POST /warranties"
              payload: { repair_order_id: "${ro2_id}", service_job_id: "${job_id}", coverage_type: "PARTS_INCLUSIVE", term_months: 12 }
              as: BillingClerk
              captures: { w2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /warranties/${w1_id}/file-claim"
              payload: { claimed_repair_type: "CAP" }
              as: BillingClerk
            - call: "POST /warranties/${w2_id}/file-claim"
              payload: { claimed_repair_type: "LINER" }
              as: BillingClerk
          assert:
            - "Warranty.${w1_id}.last_claim_credit_cents == 8000"
            - "Warranty.${w2_id}.last_claim_credit_cents == 11000"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: cf_sweep_tiered_selection_mode_a
        grounds:
          - calculations.sweep_service_cost
          - entities.ServiceJob.fields.inspection_level
          - entities.ServiceJob.fields.trip_zone
          - entities.SweepLog.fields.measured_creosote_class
        distinguishing_aspect: "Mode (a): the final sweep cost = SWEEP_BASE_CENTS[3] + CREOSOTE_SURCHARGE_CENTS[2] + 0 + TRIP_FEE_CENTS[C] = 40000+6000+0+7000 = 53000 selects across three independent tier tables plus a conditional glaze branch (>=3 inputs, non-linear tier selection)."
        test_recipe:
          setup:
            - "A ServiceJob with inspection_level=3, trip_zone=C."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Bee Flue", service_address: "2 Hearth Ln", phone: "555-0101" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "FACTORY_BUILT", appliance_type: "PELLET", flue_count: 2 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Sam Ash", cert_level: "CSIA_ADVANCED" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 3, trip_zone: "C" }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /service-jobs/${job_id}/sweep"
              payload: { measured_creosote_class: 2, glaze_present: false }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "ServiceJob.${job_id}.sweep_final_cost_cents == 53000"

      - name: cf_invoice_disposal_fee_rounding_order_mode_b
        grounds:
          - calculations.invoice_total
          - entities.ServiceJob.fields.invoice_total_cents
          - entities.RepairOrder.fields.final_cost_cents
          - state_machines.ServiceJob.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Mode (b): rounding order matters — per-line disposal fees on lines [15000, 1050, 1050] give invoice_total=17869, whereas summing amounts then rounding the fee once gives 17870; the scaffold pins per-line rounding, distinct from cf_sweep_tiered_selection_mode_a's tier selection."
        test_recipe:
          setup:
            - "A COMPLETED-ready ServiceJob (inspection_level=1, trip_zone=A) with sweep_final=15000 (measured class 1) and two COMPLETED repair orders each final_cost_cents=1050; job is IN_PROGRESS with posture SAFE and no open repairs."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Cy Cinder", service_address: "3 Hearth Ln", phone: "555-0102" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ivy Flue", cert_level: "MASTER" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04", window_start_ts: 1746342000, window_end_ts: 1746374400, capacity_minutes: 300 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, trip_zone: "A", repair_authorization_cents: 100000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job_id}", technician_id: "${tech_id}", start_ts: 1746345600, end_ts: 1746351000 }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/transitions"
              payload: { action: "DEPART" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /appointments/${appt_id}/transitions"
              payload: { action: "ARRIVE" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /service-jobs/${job_id}/safety-check"
              payload: { co_ppm: 4, draft_ok: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /service-jobs/${job_id}/sweep"
              payload: { measured_creosote_class: 1, glaze_present: false }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "CAP-STD", quoted_cost_cents: 1050 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro1_id: $.data.id }
            - call: "POST /repair-orders/${ro1_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
            - call: "POST /repair-orders/${ro1_id}/transitions"
              payload: { action: "START" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders/${ro1_id}/transitions"
              payload: { action: "COMPLETE", final_cost_cents: 1050, labor_cents: 1050 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "DAMPER", part_sku: "DMP-TOP", quoted_cost_cents: 1050 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro2_id: $.data.id }
            - call: "POST /repair-orders/${ro2_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
            - call: "POST /repair-orders/${ro2_id}/transitions"
              payload: { action: "START" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders/${ro2_id}/transitions"
              payload: { action: "COMPLETE", final_cost_cents: 1050, labor_cents: 1050 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /service-jobs/${job_id}/complete"
              payload: {}
              as: BillingClerk
          assert:
            - "ServiceJob.${job_id}.invoice_total_cents == 17869"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_servicejob_parallel_dimensions
        grounds:
          - state_machines.ServiceJob.SCHEDULED_to_IN_PROGRESS
          - state_machines.ServiceJob.PENDING_to_SAFE
          - entities.ServiceJob.fields.job_status
          - entities.ServiceJob.fields.safety_posture
        distinguishing_aspect: "ServiceJob carries two independent axes: after ARRIVE job_status=IN_PROGRESS with posture still PENDING, a PASS safety-check moves posture to SAFE without touching job_status, and a class-3 sweep then moves posture to CONDITIONS while job_status stays IN_PROGRESS — parallel dimensions on ServiceJob."
        test_recipe:
          setup:
            - "A ServiceJob booked on a RouteDay, appointment driven to ON_SITE so job_status=IN_PROGRESS while safety_posture is still PENDING."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Deb Draft", service_address: "4 Hearth Ln", phone: "555-0103" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Al Draft", cert_level: "CSIA_BASIC" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04", window_start_ts: 1746342000, window_end_ts: 1746374400, capacity_minutes: 300 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 2 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job_id}", technician_id: "${tech_id}", start_ts: 1746345600, end_ts: 1746351000 }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/transitions"
              payload: { action: "DEPART" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /appointments/${appt_id}/transitions"
              payload: { action: "ARRIVE" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /service-jobs/${job_id}/safety-check"
              payload: { co_ppm: 4, draft_ok: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /service-jobs/${job_id}/sweep"
              payload: { measured_creosote_class: 3 }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "ServiceJob.${job_id}.job_status == IN_PROGRESS"
            - "ServiceJob.${job_id}.safety_posture == CONDITIONS"

      - name: nlsm_repairorder_block_resume_cycle
        grounds:
          - state_machines.RepairOrder.IN_PROGRESS_to_BLOCKED
          - state_machines.RepairOrder.BLOCKED_to_IN_PROGRESS
          - entities.RepairOrder.fields.status
        distinguishing_aspect: "RepairOrder cycles IN_PROGRESS -> BLOCKED -> IN_PROGRESS via BLOCK then RESUME, returning to IN_PROGRESS — a genuine cycle on a different entity than ServiceJob."
        test_recipe:
          setup:
            - "A RepairOrder in IN_PROGRESS on a job whose posture is SAFE."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Eve Ash", service_address: "5 Hearth Ln", phone: "555-0104" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ray Ember", cert_level: "MASTER" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, repair_authorization_cents: 50000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /service-jobs/${job_id}/safety-check"
              payload: { co_ppm: 2, draft_ok: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "LINER", part_sku: "LNR-AL", quoted_cost_cents: 20000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "START" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "BLOCK" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "RESUME" }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "RepairOrder.${ro_id}.status == IN_PROGRESS"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: tc_jobcancel_appointment_routeday_depth3
        grounds:
          - state_machines.ServiceJob.CANCELLED
          - state_machines.Appointment.CANCELLED
          - entities.RouteDay.fields.booked_minutes
          - calculations.routeday_booked_minutes
        distinguishing_aspect: "Trigger POST /service-jobs/{id}/cancel: L1 job->CANCELLED causes L2 its Appointment->CANCELLED, which itself causes L3 RouteDay.booked_minutes to drop by the appointment's 90 on_site_minutes (90 -> 0) — three chained hops."
        test_recipe:
          setup:
            - "A ServiceJob (job_status=SCHEDULED) with one SCHEDULED Appointment of 90 on_site_minutes; RouteDay.booked_minutes=90."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Fay Grate", service_address: "6 Hearth Ln", phone: "555-0105" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "PREFAB_METAL", appliance_type: "GAS_INSERT", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Gus Grate", cert_level: "CSIA_ADVANCED" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04", window_start_ts: 1746342000, window_end_ts: 1746374400, capacity_minutes: 300 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job_id}", technician_id: "${tech_id}", start_ts: 1746345600, end_ts: 1746351000 }
              as: Dispatcher
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /service-jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
          assert:
            - "ServiceJob.${job_id}.job_status == CANCELLED"
            - "Appointment.${appt_id}.status == CANCELLED"
            - "RouteDay.${rd_id}.booked_minutes == 0"

      - name: tc_repaircancel_committed_cost_depth2
        grounds:
          - state_machines.RepairOrder.CANCELLED
          - entities.ServiceJob.fields.committed_cost_cents
          - calculations.committed_cost
        distinguishing_aspect: "Trigger POST /repair-orders/{id}/transitions action=CANCEL (a different trigger than tc_jobcancel): L1 the order->CANCELLED causes L2 the parent ServiceJob.committed_cost_cents to be recomputed, dropping from 35000 to 23000."
        test_recipe:
          setup:
            - "A ServiceJob with sweep_provisional=15000 (inspection_level 1, trip A) and two active RepairOrders provisional 12000 and 8000, so committed_cost_cents=35000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Hal Hearth", service_address: "7 Hearth Ln", phone: "555-0106" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ida Ash", cert_level: "MASTER" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, trip_zone: "A", repair_authorization_cents: 100000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "CAP-SS", quoted_cost_cents: 12000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro1_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "DAMPER", part_sku: "DMP-THR", quoted_cost_cents: 8000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro2_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro1_id}/transitions"
              payload: { action: "CANCEL" }
              as: Dispatcher
          assert:
            - "ServiceJob.${job_id}.committed_cost_cents == 23000"
            - "RepairOrder.${ro1_id}.status == CANCELLED"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_state_beats_safety_on_warranty_issue
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_REPAIR_NOT_COMPLETED]
          - errors[ERR_JOB_UNSAFE]
        distinguishing_aspect: "Issuing a warranty against a non-COMPLETED repair on an UNSAFE job violates both a state rule (priority 7) and a business_safety rule (priority 9); the lower-numbered state check wins, returning ERR_REPAIR_NOT_COMPLETED — the pair is state vs business_safety."
        test_recipe:
          setup:
            - "A ServiceJob whose posture is UNSAFE (failed safety-check) and a RepairOrder still in APPROVED (not COMPLETED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Jo Kindle", service_address: "8 Hearth Ln", phone: "555-0107" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ken Coal", cert_level: "CSIA_ADVANCED" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 2, repair_authorization_cents: 100000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "CAP-STD", quoted_cost_cents: 9000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
            - call: "POST /service-jobs/${job_id}/safety-check"
              payload: { co_ppm: 12, draft_ok: false }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /warranties"
              payload: { repair_order_id: "${ro_id}", service_job_id: "${job_id}", coverage_type: "LABOR_ONLY", term_months: 12 }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_REPAIR_NOT_COMPLETED"
            - "http_status == 409"

      - name: ppvc_referential_beats_fiscal_on_repair_create
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_UNKNOWN_PART]
          - errors[ERR_REPAIR_COST_EXCEEDS_AUTH]
        distinguishing_aspect: "Proposing a repair with an unknown part_sku and a quoted cost above the job authorization violates a business_referential rule (priority 10) and a business_fiscal rule (priority 12); the referential check wins, returning ERR_UNKNOWN_PART — the pair is business_referential vs business_fiscal, distinct from the state/safety pair."
        test_recipe:
          setup:
            - "A ServiceJob with repair_authorization_cents=1000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Lea Log", service_address: "9 Hearth Ln", phone: "555-0108" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Moe Mantle", cert_level: "CSIA_BASIC" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, repair_authorization_cents: 1000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "BOGUS-999", quoted_cost_cents: 50000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNKNOWN_PART"
            - "http_status == 422"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: bpc_co_ppm_unsafe_threshold
        grounds:
          - calculations.safety_posture_derivation
          - entities.SafetyCheck.fields.co_ppm
          - entities.SafetyCheck.fields.outcome
          - state_machines.ServiceJob.UNSAFE
        distinguishing_aspect: "co_ppm exactly 9 crosses the CO_UNSAFE_PPM boundary (>=): outcome=FAIL and posture=UNSAFE, whereas co_ppm=8 would PASS to SAFE — a numeric threshold boundary reached through POST /service-jobs/{id}/safety-check."
        test_recipe:
          setup:
            - "A fresh ServiceJob with posture PENDING."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Ned Nook", service_address: "10 Hearth Ln", phone: "555-0109" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "GAS_INSERT", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Opal Oak", cert_level: "MASTER" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 2 }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /service-jobs/${job_id}/safety-check"
              payload: { co_ppm: 9, draft_ok: true }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { sc_outcome: $.data.outcome }
          assert:
            - "SafetyCheck.${sc_outcome} == FAIL"
            - "ServiceJob.${job_id}.safety_posture == UNSAFE"

      - name: bpc_zero_duration_appointment_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_APPOINTMENT_WINDOW]
          - entities.Appointment.fields.on_site_minutes
        distinguishing_aspect: "An appointment with start_ts == end_ts has zero on_site_minutes (a zero-quantity edge, distinct from the CO numeric threshold) and is rejected with ERR_INVALID_APPOINTMENT_WINDOW at POST /appointments."
        test_recipe:
          setup:
            - "A RouteDay and a DRAFT ServiceJob ready to book."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Pat Pyre", service_address: "11 Hearth Ln", phone: "555-0110" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Quinn Quill", cert_level: "CSIA_BASIC" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04", window_start_ts: 1746342000, window_end_ts: 1746374400, capacity_minutes: 300 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job_id}", technician_id: "${tech_id}", start_ts: 1746345600, end_ts: 1746345600 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_APPOINTMENT_WINDOW"
            - "http_status == 422"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_repair_start_requires_job_posture_safe
        grounds:
          - state_machines.RepairOrder.APPROVED_to_IN_PROGRESS
          - entities.ServiceJob.fields.safety_posture
          - errors[ERR_JOB_UNSAFE]
        distinguishing_aspect: "RepairOrder START from APPROVED is rejected with ERR_JOB_UNSAFE when the parent ServiceJob.safety_posture is UNSAFE — RepairOrder's valid transitions depend on ServiceJob state (pair RepairOrder->ServiceJob)."
        test_recipe:
          setup:
            - "An APPROVED RepairOrder on a ServiceJob whose posture was driven to UNSAFE by a failed safety-check."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Rae Reek", service_address: "12 Hearth Ln", phone: "555-0111" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Sid Smoke", cert_level: "MASTER" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 2, repair_authorization_cents: 50000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "CAP-STD", quoted_cost_cents: 9000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
            - call: "POST /service-jobs/${job_id}/safety-check"
              payload: { co_ppm: 15, draft_ok: false, spillage_detected: true }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "START" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_JOB_UNSAFE"
            - "RepairOrder.${ro_id}.status == APPROVED"

      - name: cesd_warranty_issue_requires_repair_completed
        grounds:
          - state_machines.Warranty.ISSUED
          - entities.RepairOrder.fields.status
          - errors[ERR_REPAIR_NOT_COMPLETED]
        distinguishing_aspect: "Issuing a Warranty is rejected with ERR_REPAIR_NOT_COMPLETED while the referenced RepairOrder is IN_PROGRESS (not COMPLETED) even on a SAFE job — Warranty's create depends on RepairOrder state (pair Warranty->RepairOrder), a different entity pair than the START/posture case."
        test_recipe:
          setup:
            - "A SAFE ServiceJob with a RepairOrder in IN_PROGRESS (started but not completed)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Tia Tinder", service_address: "13 Hearth Ln", phone: "555-0112" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Uri Umber", cert_level: "CSIA_ADVANCED" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, repair_authorization_cents: 50000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /service-jobs/${job_id}/safety-check"
              payload: { co_ppm: 2, draft_ok: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "LINER", part_sku: "LNR-SS6", quoted_cost_cents: 20000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "APPROVE" }
              as: Dispatcher
            - call: "POST /repair-orders/${ro_id}/transitions"
              payload: { action: "START" }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /warranties"
              payload: { repair_order_id: "${ro_id}", service_job_id: "${job_id}", coverage_type: "PARTS_INCLUSIVE", term_months: 24 }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_REPAIR_NOT_COMPLETED"
            - "http_status == 409"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_technician_buffer_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
          - entities.Appointment.fields.start_ts
          - entities.Appointment.fields.end_ts
        distinguishing_aspect: "A second appointment for the same technician starting only 10 minutes after the first ends is rejected: half-open intervals plus a 30-minute TRAVEL_BUFFER require a >=30-minute gap, so the pairwise adjacency/buffer test fails with ERR_TECHNICIAN_DOUBLE_BOOKED."
        test_recipe:
          setup:
            - "A RouteDay for one technician with capacity_minutes=600 and a first appointment 08:00-09:30 (90 min); a second DRAFT job to book at 09:40."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Val Vent", service_address: "14 Hearth Ln", phone: "555-0113" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Wes Wick", cert_level: "MASTER" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04", window_start_ts: 1746342000, window_end_ts: 1746374400, capacity_minutes: 600 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job1_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job2_id: $.data.id }
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job1_id}", technician_id: "${tech_id}", start_ts: 1746345600, end_ts: 1746351000 }
              as: Dispatcher
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job2_id}", technician_id: "${tech_id}", start_ts: 1746351600, end_ts: 1746355200 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TECHNICIAN_DOUBLE_BOOKED"
            - "http_status == 409"

      - name: rto_routeday_capacity_aggregate
        grounds:
          - validations[priority=12]
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
          - entities.RouteDay.fields.capacity_minutes
          - calculations.routeday_booked_minutes
        distinguishing_aspect: "With capacity_minutes=120 and a first booking of 90 minutes, a second non-overlapping 60-minute appointment (spaced past the buffer) is rejected because aggregate booked_minutes+60=150 exceeds capacity — an aggregate-capacity interval semantic, distinct from the pairwise-buffer test."
        test_recipe:
          setup:
            - "A RouteDay with capacity_minutes=120 holding one 90-minute appointment (booked_minutes=90); a second job to book a 60-minute slot spaced 40 minutes after the first (buffer OK)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Xan Xyle", service_address: "15 Hearth Ln", phone: "555-0114" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Yes Yule", cert_level: "CSIA_ADVANCED" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04", window_start_ts: 1746342000, window_end_ts: 1746374400, capacity_minutes: 120 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job1_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job2_id: $.data.id }
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job1_id}", technician_id: "${tech_id}", start_ts: 1746345600, end_ts: 1746351000 }
              as: Dispatcher
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job2_id}", technician_id: "${tech_id}", start_ts: 1746353400, end_ts: 1746357000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ROUTE_CAPACITY_EXCEEDED"
            - "http_status == 402"
            - "RouteDay.${rd_id}.booked_minutes == 90"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: ci_committed_cost_repair_cancel_money
        grounds:
          - calculations.committed_cost
          - entities.ServiceJob.fields.committed_cost_cents
          - state_machines.RepairOrder.CANCELLED
        distinguishing_aspect: "Conserved quantity (money): committed_cost_cents == sweep_provisional_cost_cents + sum(provisional_cost_cents of non-REJECTED/non-CANCELLED orders). Creating then cancelling a 12000 order leaves committed_cost_cents back at 23000 (=15000+8000) with zero drift."
        test_recipe:
          setup:
            - "A ServiceJob (sweep_provisional=15000) with one surviving 8000 RepairOrder, plus a 12000 RepairOrder that will be created and cancelled."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Zed Zephyr", service_address: "16 Hearth Ln", phone: "555-0115" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "WOOD_STOVE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ann Andiron", cert_level: "MASTER" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1, trip_zone: "A", repair_authorization_cents: 100000 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "DAMPER", part_sku: "DMP-THR", quoted_cost_cents: 8000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_keep_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { service_job_id: "${job_id}", repair_type: "CAP", part_sku: "CAP-STD", quoted_cost_cents: 12000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ro_cancel_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_cancel_id}/transitions"
              payload: { action: "CANCEL" }
              as: Dispatcher
          assert:
            - "ServiceJob.${job_id}.committed_cost_cents == 23000"

      - name: ci_routeday_minutes_appointment_cancel_time
        grounds:
          - calculations.routeday_booked_minutes
          - entities.RouteDay.fields.booked_minutes
          - state_machines.Appointment.CANCELLED
        distinguishing_aspect: "Conserved quantity (minutes): RouteDay.booked_minutes == sum(on_site_minutes of live appointments). Booking a 90-minute and a 120-minute slot (booked=210) then cancelling the 90-minute one restores booked_minutes to 120 exactly — a time/capacity conserved quantity, different from the money invariant."
        test_recipe:
          setup:
            - "A RouteDay (capacity 600) with two live appointments: 90 min and 120 min, booked_minutes=210."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Bo Bellows", service_address: "17 Hearth Ln", phone: "555-0116" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /chimneys"
              payload: { customer_id: "${cust_id}", chimney_type: "MASONRY", appliance_type: "OPEN_FIREPLACE", flue_count: 1 }
              as: Dispatcher
              captures: { chim_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Cy Cricket", cert_level: "CSIA_ADVANCED" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04", window_start_ts: 1746342000, window_end_ts: 1746374400, capacity_minutes: 600 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job1_id: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_id: "${cust_id}", chimney_id: "${chim_id}", inspection_level: 1 }
              as: Dispatcher
              captures: { job2_id: $.data.id }
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job1_id}", technician_id: "${tech_id}", start_ts: 1746345600, end_ts: 1746351000 }
              as: Dispatcher
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments"
              payload: { route_day_id: "${rd_id}", service_job_id: "${job2_id}", technician_id: "${tech_id}", start_ts: 1746353400, end_ts: 1746360600 }
              as: Dispatcher
              captures: { appt2_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt1_id}/transitions"
              payload: { action: "CANCEL" }
              as: Dispatcher
          assert:
            - "RouteDay.${rd_id}.booked_minutes == 120"
            - "Appointment.${appt1_id}.status == CANCELLED"
