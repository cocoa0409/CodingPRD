# =============================================================================
# Task 1868 — Silo, Bin & Bulk-Solids Handling Service
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: site_creation_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.CustomerSite"
        distinguishing_aspect: "POST /sites with only required fields applies documented defaults: contract_discount_pct 0, capital_threshold_cents 500000, credit_hold false, site_posture NORMAL."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Defaults Site", state_code: "IA" }
              as: ServiceManager
              captures: { sd: $.data.id }
          trigger:
            - call: "GET /sites/${sd}"
              payload: {}
              as: ServiceManager
          assert:
            - "contract_discount_pct == 0"
            - "capital_threshold_cents == 500000"
            - "credit_hold == false"
            - "site_posture == NORMAL"
            - "version == 1 and created_at present"

      - name: site_creation_missing_required_returns_validation
        claim_type: required_fields
        grounds:
          - "entities.CustomerSite"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /sites without name/state_code is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: vessel_creation_computed_fields_initialized
        claim_type: computed_fields
        grounds:
          - "entities.Vessel"
        distinguishing_aspect: "Vessel creation initializes computed fields: current_inventory_tons echoes opening_inventory_tons 12.5, flow_posture NORMAL, scale_status IN_TOLERANCE."
        test_recipe:
          setup: ["Site exists."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "V Site", state_code: "IA" }
              as: ServiceManager
              captures: { sv: $.data.id }
          trigger:
            - call: "POST /vessels"
              payload: { site_id: "${sv}", name: "BIN-1", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 20, opening_inventory_tons: 12.5 }
              as: ServiceManager
              captures: { vv1: $.data.id }
          assert:
            - "current_inventory_tons == 12.5 (implicit opening anchor)"
            - "flow_posture == NORMAL and scale_status == IN_TOLERANCE"
            - "replenishment_policy == TARGET_FILL, target_fill_pct == 90, cover_days == 7, default_usage_tons == 1.0, moisture_limit_pct == 12.0, error_basis == OF_READING (defaults)"

      - name: vessel_invalid_enum_kind_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Vessel.fields.vessel_kind"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "vessel_kind outside {SILO, BIN, HOPPER} is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Site exists."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Enum Site", state_code: "IA" }
              as: ServiceManager
              captures: { se: $.data.id }
          trigger:
            - call: "POST /vessels"
              payload: { site_id: "${se}", name: "X", vessel_kind: "PYRAMID", capacity_tons: 50, material_name: "salt", reorder_point_pct: 20 }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: level_reading_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - "entities.LevelReading.fields.level_pct"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "level_pct 101 (> 100) is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Site and vessel exist."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Range Site", state_code: "IA" }
              as: ServiceManager
              captures: { sr: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sr}", name: "SILO-1", vessel_kind: "SILO", capacity_tons: 100, material_name: "corn", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vr: $.data.id }
          trigger:
            - call: "POST /level-readings"
              payload: { vessel_id: "${vr}", measured_at: "2026-08-02T00:00:00Z", level_pct: 101 }
              as: PlantOperator
              as_user_id: "${sr}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: reading_immutable_event_shape
        claim_type: immutability
        grounds:
          - "entities.LevelReading"
        distinguishing_aspect: "LevelReading (common_fields: false) response carries id and created_at but no version or updated_at; no update endpoint exists for it."
        test_recipe:
          setup: ["Site and vessel exist; reading above reorder point so no order is created."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Imm Site", state_code: "IA" }
              as: ServiceManager
              captures: { si: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${si}", name: "SILO-2", vessel_kind: "SILO", capacity_tons: 100, material_name: "corn", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vi: $.data.id }
          trigger:
            - call: "POST /level-readings"
              payload: { vessel_id: "${vi}", measured_at: "2026-08-02T00:00:00Z", level_pct: 55.0 }
              as: PlantOperator
              as_user_id: "${si}"
              captures: { rid: $.data.id }
          assert:
            - "response contains id and created_at"
            - "response does NOT contain version or updated_at keys"
            - "GET /vessels/${vi}/level-readings returns total_count == 1 containing ${rid}"

      - name: site_create_extra_field_rejected
        claim_type: system_fields
        grounds:
          - "entities.CustomerSite"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Client-supplied system field id in a create body is an unknown field and rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "X", state_code: "IA", id: "00000000-0000-0000-0000-0000000000aa" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: vessel_create_computed_field_input_rejected
        claim_type: computed_fields
        grounds:
          - "entities.Vessel.fields.flow_posture"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Client-supplied computed field flow_posture in a create body is rejected with ERR_VALIDATION; computed fields are never client-writable."
        test_recipe:
          setup: ["Site exists."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "CF Site", state_code: "IA" }
              as: ServiceManager
              captures: { scf: $.data.id }
          trigger:
            - call: "POST /vessels"
              payload: { site_id: "${scf}", name: "BIN-9", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 20, flow_posture: "FLOW_IMPAIRED" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: order_happy_path_triggered_dispatched_received
        claim_type: valid_transition
        grounds:
          - "state_machines.ReplenishmentOrder"
        distinguishing_aspect: "TRIGGERED -> DISPATCHED -> RECEIVED happy path succeeds and inventory rises by delivered_tons (anchor 60.0 + 12.0 = 72.0)."
        test_recipe:
          setup: ["Site, vessel (capacity 100, reorder 30, target 90). Reading 60.0 anchors inventory 60.0; reading 25.0 then triggers order (65.0 t)."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HP Site", state_code: "IA" }
              as: ServiceManager
              captures: { shp: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${shp}", name: "SILO-HP", vessel_kind: "SILO", capacity_tons: 100, material_name: "corn", reorder_point_pct: 30, target_fill_pct: 90 }
              as: ServiceManager
              captures: { vhp: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${vhp}", measured_at: "2026-08-02T00:00:00Z", level_pct: 60.0 }
              as: PlantOperator
              as_user_id: "${shp}"
            - call: "POST /level-readings"
              payload: { vessel_id: "${vhp}", measured_at: "2026-08-03T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${shp}"
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${vhp}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { ohp: "$.data[0].id" }
            - call: "POST /replenishment-orders/${ohp}/dispatch"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /replenishment-orders/${ohp}/receive"
              payload: { delivered_tons: 12.0, received_at: "2026-08-04T00:00:00Z" }
              as: PlantOperator
              as_user_id: "${shp}"
          assert:
            - "order status == RECEIVED, delivered_tons == 12.0"
            - "GET /vessels/${vhp} current_inventory_tons == 37.0 (anchor 25.0 + 12.0; the 2026-08-03 reading at 25.0 is the anchor)"
            - "vessel flow_posture == NORMAL after receive"

      - name: order_receive_from_triggered_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.ReplenishmentOrder.DISPATCHED_to_RECEIVED"
          - "errors[ERR_INVALID_ORDER_STATE]"
        distinguishing_aspect: "Receiving a TRIGGERED (not yet DISPATCHED) order fails with ERR_INVALID_ORDER_STATE."
        test_recipe:
          setup: ["Site, vessel; reading 25.0 auto-creates a TRIGGERED order."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "IS Site", state_code: "IA" }
              as: ServiceManager
              captures: { sis: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sis}", name: "SILO-IS", vessel_kind: "SILO", capacity_tons: 100, material_name: "corn", reorder_point_pct: 30, target_fill_pct: 90 }
              as: ServiceManager
              captures: { vis: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${vis}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${sis}"
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${vis}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { ois: "$.data[0].id" }
          trigger:
            - call: "POST /replenishment-orders/${ois}/receive"
              payload: { delivered_tons: 5.0, received_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              as_user_id: "${sis}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ORDER_STATE"
            - "order remains TRIGGERED; vessel current_inventory_tons == 25.0"

      - name: order_cancel_from_received_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ReplenishmentOrder"
          - "errors[ERR_INVALID_ORDER_STATE]"
        distinguishing_aspect: "RECEIVED is terminal for cancel: cancelling a RECEIVED order fails with ERR_INVALID_ORDER_STATE (only void compensates)."
        test_recipe:
          setup: ["Order RECEIVED for the vessel (reading 25.0 -> order -> dispatch -> receive 5.0 t)."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "TL Site", state_code: "IA" }
              as: ServiceManager
              captures: { stl: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${stl}", name: "SILO-TL", vessel_kind: "SILO", capacity_tons: 100, material_name: "corn", reorder_point_pct: 30, target_fill_pct: 90 }
              as: ServiceManager
              captures: { vtl: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${vtl}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${stl}"
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${vtl}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { otl: "$.data[0].id" }
            - call: "POST /replenishment-orders/${otl}/dispatch"
              payload: {}
              as: ServiceManager
            - call: "POST /replenishment-orders/${otl}/receive"
              payload: { delivered_tons: 5.0, received_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              as_user_id: "${stl}"
          trigger:
            - call: "POST /replenishment-orders/${otl}/cancel"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ORDER_STATE"
            - "order remains RECEIVED; vessel current_inventory_tons == 30.0"

      - name: ticket_complete_from_scheduled_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.ServiceTicket.IN_PROGRESS_to_COMPLETED"
          - "errors[ERR_INVALID_TICKET_STATE]"
        distinguishing_aspect: "Completing a SCHEDULED (never started) ticket fails with ERR_INVALID_TICKET_STATE even when the acting technician is the assignee."
        test_recipe:
          setup: ["Site, vessel, technician TTc; ticket APPROVED then SCHEDULED to TTc."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "TC Site", state_code: "IA" }
              as: ServiceManager
              captures: { stc: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${stc}", name: "BIN-TC", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vtc: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech C", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { ttc2: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${stc}", vessel_id: "${vtc}", job_type: "INSPECTION", requires_entry: false, est_hours: 2, crew_size: 1 }
              as: ServiceManager
              captures: { ttc3: $.data.id }
            - call: "POST /service-tickets/${ttc3}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${ttc3}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${stc}"
            - call: "POST /service-tickets/${ttc3}/schedule"
              payload: { technician_id: "${ttc2}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: ServiceManager
          trigger:
            - call: "POST /service-tickets/${ttc3}/complete"
              payload: { actual_hours: 2, mileage_miles: 0, disposal_tons: 0 }
              as: Technician
              as_user_id: "${ttc2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TICKET_STATE"
            - "ticket remains SCHEDULED; no invoice fields set"

      - name: ticket_approve_after_decline_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ServiceTicket.QUOTED_to_DECLINED"
          - "errors[ERR_INVALID_TICKET_STATE]"
        distinguishing_aspect: "DECLINED is terminal: approving a declined ticket fails with ERR_INVALID_TICKET_STATE."
        test_recipe:
          setup: ["Site, vessel; ticket QUOTED then DECLINED by the owning operator."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "TD Site", state_code: "IA" }
              as: ServiceManager
              captures: { std: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${std}", name: "BIN-TD", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vtd: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${std}", vessel_id: "${vtd}", job_type: "DIAGNOSIS", requires_entry: false, est_hours: 2, crew_size: 1 }
              as: ServiceManager
              captures: { ttd2: $.data.id }
            - call: "POST /service-tickets/${ttd2}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${ttd2}/decline"
              payload: {}
              as: PlantOperator
              as_user_id: "${std}"
          trigger:
            - call: "POST /service-tickets/${ttd2}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${std}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TICKET_STATE"
            - "ticket remains DECLINED"

      - name: permit_close_from_draft_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.EntryPermit.ACTIVE_to_CLOSED"
          - "errors[ERR_INVALID_PERMIT_STATE]"
        distinguishing_aspect: "Closing a DRAFT permit fails with ERR_INVALID_PERMIT_STATE."
        test_recipe:
          setup: ["Site, vessel, technician; entry-requiring ticket APPROVED; permit in DRAFT."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "PC Site", state_code: "IA" }
              as: ServiceManager
              captures: { spc: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${spc}", name: "BIN-PC", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vpc: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech P", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { ttp: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${spc}", vessel_id: "${vpc}", job_type: "CLEANOUT", requires_entry: true, est_hours: 4, crew_size: 1 }
              as: ServiceManager
              captures: { tpc: $.data.id }
            - call: "POST /service-tickets/${tpc}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${tpc}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${spc}"
            - call: "POST /entry-permits"
              payload: { vessel_id: "${vpc}", ticket_id: "${tpc}", entrant_technician_id: "${ttp}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: SafetyOfficer
              captures: { ppc: $.data.id }
          trigger:
            - call: "POST /entry-permits/${ppc}/close"
              payload: { findings: "NONE" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_PERMIT_STATE"
            - "permit remains DRAFT"

      - name: dispatch_twice_second_attempt_invalid
        claim_type: idempotency
        grounds:
          - "state_machines.ReplenishmentOrder.TRIGGERED_to_DISPATCHED"
          - "errors[ERR_INVALID_ORDER_STATE]"
        distinguishing_aspect: "Repeating the dispatch trigger on an already-DISPATCHED order fails with ERR_INVALID_ORDER_STATE (no silent no-op)."
        test_recipe:
          setup: ["Order DISPATCHED for the vessel."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "DT Site", state_code: "IA" }
              as: ServiceManager
              captures: { sdt: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sdt}", name: "SILO-DT", vessel_kind: "SILO", capacity_tons: 100, material_name: "corn", reorder_point_pct: 30, target_fill_pct: 90 }
              as: ServiceManager
              captures: { vdt: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${vdt}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${sdt}"
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${vdt}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { odt: "$.data[0].id" }
            - call: "POST /replenishment-orders/${odt}/dispatch"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /replenishment-orders/${odt}/dispatch"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ORDER_STATE"
            - "order remains DISPATCHED (exactly-once transition)"

      - name: permit_close_with_findings_autocreates_diagnosis_ticket
        claim_type: side_effect_execution
        grounds:
          - "state_machines.EntryPermit.ACTIVE_to_CLOSED"
          - "entities.ServiceTicket.fields.source_permit_id"
        distinguishing_aspect: "Closing an ACTIVE permit with findings BRIDGING_OBSERVED auto-creates a DRAFT DIAGNOSIS ticket (est_hours 4, crew_size 1, requires_entry false, source_permit_id set) with estimate_cents == 38000."
        test_recipe:
          setup: ["Site (discount 0), vessel NORMAL, technician; entry-requiring ticket APPROVED; permit ISSUED then ACTIVATED."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "FD Site", state_code: "IA" }
              as: ServiceManager
              captures: { sfd: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sfd}", name: "BIN-FD", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vfd: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech F", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { ttf: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${sfd}", vessel_id: "${vfd}", job_type: "CLEANOUT", requires_entry: true, est_hours: 4, crew_size: 1 }
              as: ServiceManager
              captures: { tfd: $.data.id }
            - call: "POST /service-tickets/${tfd}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${tfd}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${sfd}"
            - call: "POST /entry-permits"
              payload: { vessel_id: "${vfd}", ticket_id: "${tfd}", entrant_technician_id: "${ttf}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: SafetyOfficer
              captures: { pfd: $.data.id }
            - call: "POST /entry-permits/${pfd}/issue"
              payload: { lockout_checklist_confirmed: true }
              as: SafetyOfficer
            - call: "POST /entry-permits/${pfd}/activate"
              payload: { oxygen_pct: 20.9, combustible_pct: 1.0 }
              as: SafetyOfficer
          trigger:
            - call: "POST /entry-permits/${pfd}/close"
              payload: { findings: "BRIDGING_OBSERVED" }
              as: SafetyOfficer
          assert:
            - "permit status == CLOSED"
            - "GET /service-tickets?source_permit_id=${pfd} returns total_count == 1"
            - "auto ticket: job_type == DIAGNOSIS, status == DRAFT, requires_entry == false, est_hours == 4, crew_size == 1, vessel_id == ${vfd}"
            - "auto ticket estimate_cents == 38000 (9500 x 4 x 1, NORMAL posture multiplier 1.0, discount 0)"

      - name: start_entry_ticket_requires_active_permit
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ServiceTicket.SCHEDULED_to_IN_PROGRESS"
