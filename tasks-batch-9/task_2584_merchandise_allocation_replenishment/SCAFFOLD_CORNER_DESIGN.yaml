            - call: "GET /allocation/assortment-actions"
              payload: { item_id: "${i1_id}", store_id: "${s1_id}" }
              as: AllocationManager
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /allocation/assortment-actions"
