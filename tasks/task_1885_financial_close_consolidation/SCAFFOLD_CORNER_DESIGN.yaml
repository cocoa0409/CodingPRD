  # ===========================================================================
  - section: rbac
    instances:
      - name: auditor_read_only_cannot_mutate
        claim_type: rbac_denial
        grounds: ["roles.Auditor"]
        distinguishing_aspect: "Auditor has the full GET surface but zero mutation rights: a POST by Auditor is rejected ERR_FORBIDDEN."
        test_recipe:
          setup: ["Period exists"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
          trigger:
            - call: "POST /close/periods/${per_id}/open"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "Auditor attempting to open a period rejected with ERR_FORBIDDEN (read-only role)"
            - "Auditor CAN GET /close/periods/${per_id} (read surface allowed)"

      - name: approver_cannot_create_journal_entry
        claim_type: rbac_denial
        grounds: ["roles.Approver", "roles.Preparer"]
        distinguishing_aspect: "The Approver role cannot perform the Preparer-exclusive JE create (peer-role separation in the SoD model)."
