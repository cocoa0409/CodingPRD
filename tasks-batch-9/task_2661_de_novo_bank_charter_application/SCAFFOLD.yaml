scenario: |
  Generate task harder than expert level!

  2661. De Novo Bank Charter Application (bank organizing group): organizer group composition,
  background checks and management qualification assessment, business plan with three-year
  projections, capital adequacy and stress scenarios, capital raise structuring with escrow of
  subscriptions until approval, charter application to the chartering authority and deposit
  insurance application in parallel, policy and procedure development across lending, compliance,
  information security and risk, core system selection, vendor contracts and pre-opening
  operational readiness examination, conditional approval requirements and pre-opening field
  visit, first three-year heightened supervision and business plan deviation approvals

domain_name: de-novo-bank-charter-application
api_prefix: /de-novo

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only four read paths nest
  # (organizers, capital-raises, vendor-contracts, readiness-exams under a group;
  # stress-scenarios under a plan; conditions under a filing; conversion-windows
  # under a vendor contract) and every other collection is addressed at the top
  # level with FK query filters.

  state_machine_shape: cyclic
  # RegulatoryFiling loops FILED -> ADDITIONAL_INFO_REQUESTED -> FILED with a hard
  # round ceiling; Subscription carries two independent state dimensions
  # (funding_state x clearance_state); OrganizingGroup.stage is compound (derived
  # from both filings) and revertible (PRE_OPENING -> CONDITIONALLY_APPROVED).

  relationship_patterns:
    - one_to_many
    - self_referential      # BusinessPlan.supersedes_plan_id -> BusinessPlan.id
    - cross_aggregate       # RegulatoryFiling.pinned_business_plan_id, DeviationRequest.baseline_plan_id
    - polymorphic_none

  role_model: segregation_of_duties
  # The organizer who drafts a policy can never be the organizer who board-adopts
  # it; the chartering authority and the deposit insurer each decide only their own
  # filing; the escrow agent alone touches subscription money.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 55 endpoints / 54 error codes / 11 calculations (4 with variants)
  # / 9 state machines. Density target: every calculation reads fields owned by at
  # least two entities, and every terminal gate is guarded by a cross-entity check.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: OrganizingGroup
    parent: null
    common_fields: true
    description: >
      The bank organizing group. Root aggregate; its `stage` is compound (derived from
      both RegulatoryFilings) and gates every pre-opening child operation.
    fields:
      - name: proposed_bank_name
        type: string
        source: input
        description: Proposed legal name of the de novo bank.
        constraints: 1..120 chars, non-blank
      - name: home_state_code
        type: string
        source: input
        description: Two-letter code of the state of the proposed main office.
        constraints: exactly 2 uppercase letters
      - name: charter_type
        type: enum
        source: input
        description: Charter being sought; selects the base leverage requirement in `capital_adequacy_verdict`.
        constraints: "one of {NATIONAL, STATE_MEMBER, STATE_NONMEMBER}"
      - name: target_opening_date
        type: datetime
        source: input
        description: Planned first day of business; bounds the legal ConversionWindow range.
        constraints: ISO 8601 UTC, must be strictly after the logical clock at group creation
      - name: stage
        type: enum
        source: system
        description: Charter-project stage. Compound - transitions to CONDITIONALLY_APPROVED and back are derived from both RegulatoryFilings.
        default: ORGANIZING
        constraints: "one of {ORGANIZING, FILING_READY, UNDER_REVIEW, CONDITIONALLY_APPROVED, PRE_OPENING, OPEN, ABANDONED}"
      - name: composition_status
        type: enum
        source: computed
        description: Output of `group_composition_assessment`; recomputed on every Organizer create and every background/waiver result.
        default: FORMING
        constraints: "one of {FORMING, COMPOSITION_MET, COMPOSITION_DEFICIENT}"
      - name: organizer_count
        type: integer
        source: computed
        description: Count of Organizer rows with this group_id.
        default: 0
      - name: independent_organizer_count
        type: integer
        source: computed
        description: Count of Organizer rows with this group_id and is_independent == true.
        default: 0
      - name: max_affiliation_count
        type: integer
        source: computed
        description: Largest number of this group's Organizers sharing a single affiliation_code.
        default: 0
      - name: management_composite_score
        type: number
        source: computed
        description: Output of `management_composite_score`; two decimal places. 0.00 when no eligible organizer exists.
        default: 0
      - name: opening_blocked_reason
        type: enum
        source: system
        description: Why opening is currently blocked; set by cascades, cleared to NONE when the blocking cause is resolved.
        default: NONE
        constraints: "one of {NONE, FILING_INFO_REQUESTED, EXAM_DEFICIENT, ESCROW_SHORTFALL}"
      - name: supervision_started_at
        type: datetime
        source: system
        description: Logical-clock instant at which stage became OPEN; null before that. Anchors the three-year heightened-supervision window.
        default: null
      - name: supervision_year_index
        type: integer
        source: computed
        description: Output of `heightened_supervision_window`; 0 while supervision_started_at is null, else 1..4 (4 means supervision has lapsed).
        default: 0

  - name: Organizer
    parent: OrganizingGroup
    common_fields: true
    description: >
      A member of the organizing group. Carries two independent background dimensions
      (fingerprint_state x credit_state) whose product derives qualification_status.
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> OrganizingGroup.id; supplied by the nested creation path.
      - name: full_name
        type: string
        source: input
        description: Organizer legal name.
        constraints: 1..120 chars, non-blank
      - name: role_on_board
        type: enum
        source: input
        description: Proposed role; the four key officer roles must all be filled and qualified for COMPOSITION_MET.
        constraints: "one of {PROPOSED_CEO, PROPOSED_CFO, PROPOSED_CRO, PROPOSED_CCO, DIRECTOR, INVESTOR_ONLY}"
      - name: is_independent
        type: boolean
        source: input
        description: True when the organizer has no employment or control relationship with any other organizer.
      - name: affiliation_code
        type: string
        source: input
        description: Opaque affiliation identifier used only by the concentration check in `group_composition_assessment`.
        constraints: 1..32 chars, non-blank
      - name: banking_years
        type: integer
        source: input
        description: Years of regulated banking experience; capped at 20 inside `organizer_qualification_subscore`.
        constraints: 0..60
      - name: regulatory_experience_score
        type: integer
        source: input
        description: Examiner-assigned regulatory-experience rating fed into `organizer_qualification_subscore`.
        constraints: 0..100
      - name: fingerprint_state
        type: enum
        source: system
        description: First background dimension; advanced only by POST /organizers/{id}/background-result with dimension FINGERPRINT.
        default: PENDING
        constraints: "one of {PENDING, CLEARED, FLAGGED}"
      - name: credit_state
        type: enum
        source: system
        description: Second background dimension; advanced independently of fingerprint_state.
        default: PENDING
        constraints: "one of {PENDING, CLEARED, ADVERSE}"
      - name: adverse_finding_type
        type: enum
        source: system
        description: Category of the adverse background finding, recorded when a dimension resolves FLAGGED or ADVERSE.
        default: NONE
        constraints: "one of {NONE, FINANCIAL_CRIME, REGULATORY_ENFORCEMENT, PERSONAL_BANKRUPTCY}"
      - name: qualification_subscore
        type: integer
        source: computed
        description: Output of `organizer_qualification_subscore`; integer, round_half_up at 0 decimals.
        default: 0
      - name: waiver_granted
        type: boolean
        source: system
        description: True once the chartering authority grants a management-qualification waiver.
        default: false
      - name: waiver_rationale
        type: string
        source: system
        description: Free text recorded with the waiver; null when waiver_granted is false.
        default: null
      - name: qualification_status
        type: enum
        source: computed
        description: Compound of the two background dimensions plus qualification_subscore and waiver_granted; see `organizer_qualification_status`.
        default: PENDING
        constraints: "one of {PENDING, QUALIFIED, DISQUALIFIED, WAIVER_GRANTED}"

  - name: BusinessPlan
    parent: OrganizingGroup
    common_fields: true
    description: >
      A three-year business plan. Self-referential via supersedes_plan_id; version-pinned
      onto a RegulatoryFiling at conditional approval.
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> OrganizingGroup.id
      - name: supersedes_plan_id
        type: string
        source: input
        description: FK -> BusinessPlan.id; the plan this revision replaces. Null for the first plan of a group.
        default: null
      - name: plan_revision_index
        type: integer
        source: computed
        description: 1 when supersedes_plan_id is null, else superseded_plan.plan_revision_index + 1.
        default: 1
      - name: status
        type: enum
        source: system
        description: Plan lifecycle. PINNED is written by the CHARTERING_AUTHORITY filing's CONDITIONALLY_APPROVED decision.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, PINNED, SUPERSEDED}"
      - name: opening_tier1_capital_cents
        type: integer
        source: input
        description: Tier 1 capital the bank expects to hold on opening day; the escrow release must deliver at least this much.
        constraints: ">= 100000000 (USD 1,000,000)"
      - name: projected_assets_y1_cents
        type: integer
        source: input
        description: Year-1 projected total assets in cents.
        constraints: "> 0"
      - name: projected_assets_y2_cents
        type: integer
        source: input
        description: Year-2 projected total assets in cents.
        constraints: "> 0"
      - name: projected_assets_y3_cents
        type: integer
        source: input
        description: Year-3 projected total assets in cents.
        constraints: "> 0"
      - name: projected_loans_y1_cents
        type: integer
        source: input
        description: Year-1 projected gross loans in cents; stress credit losses are struck against this.
        constraints: ">= 0 and <= projected_assets_y1_cents"
      - name: projected_loans_y2_cents
        type: integer
        source: input
        description: Year-2 projected gross loans in cents.
        constraints: ">= 0 and <= projected_assets_y2_cents"
      - name: projected_loans_y3_cents
        type: integer
        source: input
        description: Year-3 projected gross loans in cents; drives concentration_bps in `capital_adequacy_verdict`.
        constraints: ">= 0 and <= projected_assets_y3_cents"
      - name: projected_deposits_y1_cents
        type: integer
        source: input
        description: Year-1 projected total deposits in cents; baseline for DEPOSIT_GROWTH deviations.
        constraints: ">= 0"
      - name: projected_deposits_y2_cents
        type: integer
        source: input
        description: Year-2 projected total deposits in cents.
        constraints: ">= 0"
      - name: projected_deposits_y3_cents
        type: integer
        source: input
        description: Year-3 projected total deposits in cents.
        constraints: ">= 0"
      - name: projected_net_income_y1_cents
        type: integer
        source: input
        description: Year-1 projected net income in cents; negative during the customary de novo loss years.
      - name: projected_net_income_y2_cents
        type: integer
        source: input
        description: Year-2 projected net income in cents.
      - name: projected_net_income_y3_cents
        type: integer
        source: input
        description: Year-3 projected net income in cents.
      - name: projected_branch_count
        type: integer
        source: input
        description: Branches planned by end of year 3; baseline for BRANCH_COUNT deviations.
        constraints: ">= 1"
      - name: stress_scenario_count
        type: integer
        source: computed
        description: Count of StressScenario rows with this business_plan_id.
        default: 0
      - name: breach_scenario_count
        type: integer
        source: computed
        description: Count of this plan's StressScenarios whose governing_breach_year_index != 0.
        default: 0
      - name: worst_governing_min_leverage_ratio_bps
        type: integer
        source: computed
        description: Minimum of governing_min_leverage_ratio_bps over this plan's StressScenarios; 0 when the plan has no scenario.
        default: 0

  - name: StressScenario
    parent: BusinessPlan
    common_fields: true
    description: >
      One stress overlay on a BusinessPlan. Both capital paths (static and dynamic) are
      computed and stored; scenario_code selects which one governs.
    fields:
      - name: business_plan_id
        type: string
        source: input
        description: FK -> BusinessPlan.id; supplied by the nested creation path.
      - name: scenario_code
        type: enum
        source: input
        description: Severity band. BASELINE is governed by STATIC_BALANCE_SHEET; ADVERSE and SEVERELY_ADVERSE by DYNAMIC_GROWTH.
        constraints: "one of {BASELINE, ADVERSE, SEVERELY_ADVERSE}; unique per (business_plan_id, scenario_code)"
      - name: credit_loss_rate_bps
        type: integer
        source: input
        description: Annual credit-loss rate in basis points struck against projected loans.
        constraints: 0..5000
      - name: nim_compression_bps
        type: integer
        source: input
        description: Net-interest-margin compression in basis points struck against projected assets.
        constraints: 0..2000
      - name: expense_overrun_cents
        type: integer
        source: input
        description: One-off pre-opening expense overrun charged against capital in stress year 1 only.
        constraints: ">= 0"
      - name: static_min_leverage_ratio_bps
        type: integer
        source: computed
        description: Output of `stress_leverage_path` under the STATIC_BALANCE_SHEET variant.
        default: 0
      - name: static_breach_year_index
        type: integer
        source: computed
        description: Earliest stress year 1..3 whose STATIC_BALANCE_SHEET ratio is below DE_NOVO_FLOOR_LEVERAGE_BPS; 0 when none.
        default: 0
      - name: dynamic_min_leverage_ratio_bps
        type: integer
        source: computed
        description: Output of `stress_leverage_path` under the DYNAMIC_GROWTH variant.
        default: 0
      - name: dynamic_breach_year_index
        type: integer
        source: computed
        description: Earliest stress year 1..3 whose DYNAMIC_GROWTH ratio is below DE_NOVO_FLOOR_LEVERAGE_BPS; 0 when none.
        default: 0
      - name: governing_variant
        type: enum
        source: computed
        description: STATIC_BALANCE_SHEET when scenario_code == BASELINE, else DYNAMIC_GROWTH.
        constraints: "one of {STATIC_BALANCE_SHEET, DYNAMIC_GROWTH}"
      - name: governing_min_leverage_ratio_bps
        type: integer
        source: computed
        description: static_min_leverage_ratio_bps when governing_variant is STATIC_BALANCE_SHEET, else dynamic_min_leverage_ratio_bps.
        default: 0
      - name: governing_breach_year_index
        type: integer
        source: computed
        description: static_breach_year_index or dynamic_breach_year_index, chosen by governing_variant.
        default: 0

  - name: CapitalRaise
    parent: OrganizingGroup
    common_fields: true
    description: >
      The stock offering whose subscription money sits in escrow until the charter is
      approved. Carries both the forward-looking and the cleared escrow positions.
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> OrganizingGroup.id
      - name: status
        type: enum
        source: system
        description: Raise lifecycle; ESCROW_LOCKED can revert to OPEN when cleared escrow falls back below the minimum.
        default: STRUCTURING
        constraints: "one of {STRUCTURING, OPEN, ESCROW_LOCKED, RELEASED, REFUNDED}"
      - name: target_gross_cents
        type: integer
        source: input
        description: Gross offering target in cents.
        constraints: "> 0"
      - name: minimum_gross_cents
        type: integer
        source: input
        description: Minimum gross proceeds required before escrow may be locked.
        constraints: "> 0 and <= target_gross_cents"
      - name: offering_price_cents_per_share
        type: integer
        source: input
        description: Price per share in cents; Subscription.amount_cents is derived from it.
        constraints: "> 0"
      - name: max_shares
        type: integer
        source: input
        description: Ceiling on the sum of shares across PLEDGED and FUNDED subscriptions.
        constraints: "> 0"
      - name: organizational_expense_claim_cents
        type: integer
        source: input
        description: Organizational expenses the organizers claim back out of the release; capped by `escrow_release_allocation`.
        constraints: ">= 0"
      - name: subscribed_shares
        type: integer
        source: computed
        description: Sum of Subscription.shares over this raise where funding_state IN {PLEDGED, FUNDED}.
        default: 0
      - name: pledged_gross_cents
        type: integer
        source: computed
        description: Output of `escrow_position` SUBSCRIPTION_BASIS variant - sum of amount_cents where funding_state IN {PLEDGED, FUNDED}.
        default: 0
      - name: funded_gross_cents
        type: integer
        source: computed
        description: Sum of amount_cents where funding_state == FUNDED, regardless of clearance_state.
        default: 0
      - name: cleared_escrow_cents
        type: integer
        source: computed
        description: Output of `escrow_position` CLEARED_BASIS variant - sum of amount_cents where funding_state == FUNDED AND clearance_state == CLEARED.
        default: 0
      - name: projected_reimbursement_cents
        type: integer
        source: computed
        description: Output of `escrow_release_allocation`.reimbursement_cents, recomputed on every escrow-affecting change.
        default: 0
      - name: projected_net_release_cents
        type: integer
        source: computed
        description: Output of `escrow_release_allocation`.net_release_cents, recomputed on every escrow-affecting change.
        default: 0
      - name: released_net_cents
        type: integer
        source: system
        description: projected_net_release_cents frozen at the instant status became RELEASED; 0 until then.
        default: 0
      - name: refunded_gross_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this raise where funding_state == REFUNDED.
        default: 0

  - name: Subscription
    parent: CapitalRaise
    common_fields: true
    description: >
      One stock subscription. Two independent state dimensions - funding_state (money) and
      clearance_state (investor screening) - and escrow credit requires both to be terminal-good.
    fields:
      - name: capital_raise_id
        type: string
        source: input
        description: FK -> CapitalRaise.id
      - name: organizer_id
        type: string
        source: input
        description: FK -> Organizer.id; null for a non-organizer investor.
        default: null
      - name: subscriber_name
        type: string
        source: input
        description: Legal name of the subscriber as it appears on the subscription agreement.
        constraints: 1..120 chars, non-blank
      - name: shares
        type: integer
        source: input
        description: Number of shares subscribed.
        constraints: "> 0"
      - name: amount_cents
        type: integer
        source: computed
        description: shares * CapitalRaise.offering_price_cents_per_share, frozen at creation.
      - name: funding_state
        type: enum
        source: system
        description: Money dimension; advanced only by POST /subscriptions/{id}/funding.
        default: PLEDGED
        constraints: "one of {PLEDGED, FUNDED, REFUNDED}"
      - name: clearance_state
        type: enum
        source: system
        description: Screening dimension; advanced only by POST /subscriptions/{id}/screening-result, independently of funding_state.
        default: UNSCREENED
        constraints: "one of {UNSCREENED, SCREENING, CLEARED, REJECTED}"
      - name: counts_toward_escrow
        type: boolean
        source: computed
        description: True exactly when funding_state == FUNDED AND clearance_state == CLEARED.
        default: false

  - name: RegulatoryFiling
    parent: OrganizingGroup
    common_fields: true
    description: >
      One application to one authority. The charter application and the deposit insurance
      application progress independently and both must reach CONDITIONALLY_APPROVED before
      pre-opening.
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> OrganizingGroup.id
      - name: authority
        type: enum
        source: input
        description: Which authority receives this filing; only that authority's examiner role may decide it.
        constraints: "one of {CHARTERING_AUTHORITY, DEPOSIT_INSURER}; unique per (group_id, authority)"
      - name: pinned_business_plan_id
        type: string
        source: input
        description: FK -> BusinessPlan.id; the plan version this filing is judged against. Pinned to PINNED status on conditional approval.
      - name: status
        type: enum
        source: system
        description: Filing lifecycle; FILED and ADDITIONAL_INFO_REQUESTED form a cycle bounded by MAX_INFO_ROUNDS.
        default: DRAFT
        constraints: "one of {DRAFT, FILED, ADDITIONAL_INFO_REQUESTED, CONDITIONALLY_APPROVED, DENIED, FINAL_APPROVED}"
      - name: info_request_round
        type: integer
        source: system
        description: Number of additional-information rounds consumed so far; incremented on every entry into ADDITIONAL_INFO_REQUESTED.
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent transition into FILED; null while DRAFT.
        default: null
      - name: decision_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent examiner decision; null before the first decision.
        default: null
      - name: condition_total_count
        type: integer
        source: computed
        description: Count of ApprovalCondition rows with this filing_id, in any status.
        default: 0
      - name: open_blocking_condition_count
        type: integer
        source: computed
        description: Output of `filing_condition_posture`; count of this filing's conditions with is_pre_opening_blocking == true AND status IN {OPEN, EVIDENCE_SUBMITTED, FAILED}.
        default: 0
      - name: settled_condition_count
        type: integer
        source: computed
        description: Count of this filing's conditions with status IN {SATISFIED, WAIVED}.
        default: 0
      - name: pre_opening_clearance
        type: boolean
        source: computed
        description: True exactly when status == CONDITIONALLY_APPROVED AND open_blocking_condition_count == 0.
        default: false

  - name: ApprovalCondition
    parent: RegulatoryFiling
    common_fields: true
    description: >
      One condition attached to a conditional approval. Conditions can be reopened after being
      satisfied, which is the compensating half of the condition-count invariant.
    fields:
      - name: filing_id
        type: string
        source: input
        description: FK -> RegulatoryFiling.id; supplied by the nested creation path.
      - name: condition_code
        type: string
        source: input
        description: Short authority-assigned code for the condition.
        constraints: 1..40 chars, non-blank, unique per filing_id
      - name: category
        type: enum
        source: input
        description: Subject area of the condition; POLICY conditions are re-failed when a matching PolicyDocument is rejected.
        constraints: "one of {CAPITAL, MANAGEMENT, POLICY, VENDOR, INSURANCE}"
      - name: is_pre_opening_blocking
        type: boolean
        source: input
        description: True when the condition must be settled before the group may enter PRE_OPENING.
      - name: deadline_utc
        type: datetime
        source: input
        description: Logical-clock deadline for evidence submission.
        constraints: ISO 8601 UTC, must be strictly after the logical clock at creation
      - name: status
        type: enum
        source: system
        description: Condition lifecycle; REOPENED adjudication returns it to OPEN.
        default: OPEN
        constraints: "one of {OPEN, EVIDENCE_SUBMITTED, SATISFIED, FAILED, WAIVED}"
      - name: evidence_reference
        type: string
        source: system
        description: Reference string recorded with the most recent evidence submission; null until first submission.
        default: null
      - name: adjudication_count
        type: integer
        source: system
        description: Number of adjudications applied to this condition; increments on every adjudicate call including REOPENED.
        default: 0

  - name: PolicyDocument
    parent: OrganizingGroup
    common_fields: true
    description: >
      One policy in one of the four required domains. Drafting and board adoption are
      segregated - the drafter can never be the adopter.
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> OrganizingGroup.id
      - name: domain
        type: enum
        source: input
        description: Policy domain; all four domains must reach EXAMINER_ACCEPTED before PRE_OPENING.
        constraints: "one of {LENDING, COMPLIANCE_BSA_AML, INFORMATION_SECURITY, RISK_MANAGEMENT}"
      - name: drafted_by_organizer_id
        type: string
        source: input
        description: FK -> Organizer.id; the organizer who authored the draft.
      - name: adopted_by_organizer_id
        type: string
        source: system
        description: FK -> Organizer.id; set from X-User-ID on board adoption. Null while DRAFT.
        default: null
      - name: document_title
        type: string
        source: input
        description: Title of the policy document.
        constraints: 1..160 chars, non-blank
      - name: status
        type: enum
        source: system
        description: Policy lifecycle; examiner rejection from EXAMINER_ACCEPTED is what starts the deepest cascade.
        default: DRAFT
        constraints: "one of {DRAFT, BOARD_ADOPTED, EXAMINER_ACCEPTED, REJECTED}"
      - name: adopted_at
        type: datetime
        source: system
        description: Logical-clock instant of board adoption; null while DRAFT.
        default: null
      - name: finding_note
        type: string
        source: system
        description: Examiner note recorded with the most recent review; null before first review.
        default: null

  - name: VendorContract
    parent: OrganizingGroup
    common_fields: true
    description: >
      A third-party service contract, including the core processing system. Acts as the shared
      resource whose conversion windows are capacity-limited.
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> OrganizingGroup.id
      - name: service_domain
        type: enum
        source: input
        description: Service the vendor provides; at most one contract per (group_id, service_domain) may be SELECTED or SIGNED.
        constraints: "one of {CORE_PROCESSING, DIGITAL_BANKING, BSA_MONITORING, ITSM}"
      - name: vendor_name
        type: string
        source: input
        description: Vendor legal name.
        constraints: 1..120 chars, non-blank
      - name: annual_cost_cents
        type: integer
        source: input
        description: Annual contract cost in cents.
        constraints: ">= 0"
      - name: contract_term_months
        type: integer
        source: input
        description: Contract term in months.
        constraints: 1..120
      - name: due_diligence_score
        type: integer
        source: input
        description: Vendor due-diligence rating; CRITICAL contracts require at least MIN_CRITICAL_DUE_DILIGENCE_SCORE to be SELECTED.
        constraints: 0..100
      - name: criticality
        type: enum
        source: input
        description: Vendor criticality tier; CRITICAL raises the due-diligence bar and the conversion-window requirement.
        constraints: "one of {CRITICAL, SIGNIFICANT, ROUTINE}"
      - name: status
        type: enum
        source: system
        description: Contract lifecycle; TERMINATED cascades every RESERVED or CONFIRMED conversion window to CANCELLED.
        default: EVALUATING
        constraints: "one of {EVALUATING, SELECTED, SIGNED, TERMINATED}"
      - name: active_window_count
        type: integer
        source: computed
        description: Count of this contract's ConversionWindows with status IN {RESERVED, CONFIRMED}.
        default: 0

  - name: ConversionWindow
    parent: VendorContract
    common_fields: true
    description: >
      A core-system conversion/migration window booked against a vendor contract. Adjacency is
      permitted; the vendor supports at most MAX_CONCURRENT_CONVERSIONS overlapping windows.
    fields:
      - name: vendor_contract_id
        type: string
        source: input
        description: FK -> VendorContract.id
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the conversion window.
        constraints: ISO 8601 UTC
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the conversion window; must be strictly after window_start_utc.
        constraints: ISO 8601 UTC, > window_start_utc
      - name: status
        type: enum
        source: system
        description: Window lifecycle.
        default: RESERVED
        constraints: "one of {RESERVED, CONFIRMED, CANCELLED}"
      - name: duration_hours
        type: number
        source: computed
        description: (window_end_utc - window_start_utc) in hours, two decimal places, round_half_up.
        default: 0

  - name: ReadinessExam
    parent: OrganizingGroup
    common_fields: true
    description: >
      The pre-opening operational readiness examination / field visit. Two exams on the same
      group may not occupy overlapping buffer-extended windows.
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> OrganizingGroup.id; supplied by the nested creation path.
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the on-site window.
        constraints: ISO 8601 UTC
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the on-site window; must be strictly after window_start_utc.
        constraints: ISO 8601 UTC, > window_start_utc
      - name: exam_scope
        type: enum
        source: input
        description: Scope of the visit.
        constraints: "one of {FULL_SCOPE, TARGETED_FOLLOW_UP}"
      - name: status
        type: enum
        source: system
        description: Exam lifecycle; CANCELLED is written only by the cascade that pulls the group out of PRE_OPENING.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PASSED, DEFICIENT, CANCELLED}"
      - name: buffer_end_utc
        type: datetime
        source: computed
        description: window_end_utc + EXAM_BUFFER_HOURS; the exclusive end of the buffer-extended occupation interval.
      - name: finding_count
        type: integer
        source: system
        description: Number of examination findings recorded with the result; 0 until a result is posted.
        default: 0

  - name: DeviationRequest
    parent: OrganizingGroup
    common_fields: true
    description: >
      A request to deviate from the pinned business plan during the three-year heightened
      supervision period.
    fields:
      - name: group_id
        type: string
        source: input
        description: FK -> OrganizingGroup.id
      - name: baseline_plan_id
        type: string
        source: input
        description: FK -> BusinessPlan.id; the pinned plan the deviation is measured against.
      - name: metric
        type: enum
        source: input
        description: Which plan dimension is deviating; selects the baseline expression in `deviation_magnitude`.
        constraints: "one of {ASSET_GROWTH, LOAN_GROWTH, DEPOSIT_GROWTH, BRANCH_COUNT}"
      - name: actual_value
        type: integer
        source: input
        description: Observed value - cents for ASSET_GROWTH, LOAN_GROWTH and DEPOSIT_GROWTH, a count for BRANCH_COUNT.
        constraints: ">= 0"
      - name: narrative
        type: string
        source: input
        description: Organizer explanation of the deviation.
        constraints: 1..500 chars, non-blank
      - name: supervision_year_index_at_request
        type: integer
        source: computed
        description: OrganizingGroup.supervision_year_index frozen at creation; selects which plan year supplies the baseline.
        default: 0
      - name: baseline_value
        type: integer
        source: computed
        description: Output of `deviation_magnitude`.baseline; frozen at creation.
        default: 0
      - name: deviation_bps
        type: integer
        source: computed
        description: Output of `deviation_magnitude`.deviation_bps; frozen at creation.
        default: 0
      - name: requires_regulator_approval
        type: boolean
        source: computed
        description: True exactly when deviation_bps >= DEVIATION_APPROVAL_THRESHOLD_BPS.
        default: false
      - name: status
        type: enum
        source: system
        description: AUTO_ACCEPTED at creation when requires_regulator_approval is false, else SUBMITTED and awaiting a decision.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, AUTO_ACCEPTED, APPROVED, DENIED, ESCALATED}"
      - name: decision_note
        type: string
        source: system
        description: Examiner note recorded with the decision; null until decided.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: OrganizingGroup
    initial_state: ORGANIZING
    terminal_states: [OPEN, ABANDONED]
    note: >
      Compound and revertible. Entry into CONDITIONALLY_APPROVED is derived from both
      RegulatoryFilings; PRE_OPENING can be lost again when either filing leaves
      CONDITIONALLY_APPROVED or an exam comes back DEFICIENT.
    transitions:
      - from: ORGANIZING
        to: FILING_READY
        trigger: "POST /de-novo/organizing-groups/{group_id}/advance with target_stage=FILING_READY"
        actor: CharterCounsel
        preconditions:
          - "group.composition_status == COMPOSITION_MET"
          - "group.management_composite_score >= MIN_MANAGEMENT_COMPOSITE_SCORE (70.00)"
          - "at least one BusinessPlan with group_id == group.id AND status == SUBMITTED exists"
        side_effects:
          - "group.stage = FILING_READY"
          - "group.opening_blocked_reason = NONE"
          - "increments OrganizingGroup.version by 1"
      - from: FILING_READY
        to: UNDER_REVIEW
        trigger: "system event: the first RegulatoryFiling of the group transitions DRAFT -> FILED"
        actor: system
        preconditions:
          - "group.stage == FILING_READY"
        side_effects:
          - "group.stage = UNDER_REVIEW"
          - "increments OrganizingGroup.version by 1"
      - from: UNDER_REVIEW
        to: CONDITIONALLY_APPROVED
        trigger: "system event: a RegulatoryFiling decision leaves both of the group's filings in CONDITIONALLY_APPROVED"
        actor: system
        preconditions:
          - "count(RegulatoryFiling where group_id == group.id AND status == CONDITIONALLY_APPROVED) == 2"
        side_effects:
          - "group.stage = CONDITIONALLY_APPROVED"
          - "group.opening_blocked_reason = NONE"
          - "increments OrganizingGroup.version by 1"
      - from: UNDER_REVIEW
        to: ORGANIZING
        trigger: "system event: a RegulatoryFiling decision sets status = DENIED"
        actor: system
        preconditions:
          - "the deciding filing's status becomes DENIED"
        side_effects:
          - "group.stage = ORGANIZING"
          - "group.opening_blocked_reason = FILING_INFO_REQUESTED"
          - "every BusinessPlan of the group with status == PINNED reverts to status SUBMITTED"
          - "increments OrganizingGroup.version by 1"
      - from: CONDITIONALLY_APPROVED
        to: PRE_OPENING
        trigger: "POST /de-novo/organizing-groups/{group_id}/advance with target_stage=PRE_OPENING"
        actor: CharterCounsel
        preconditions:
          - "both of the group's RegulatoryFilings have status == CONDITIONALLY_APPROVED"
          - "the group's CapitalRaise has status IN {ESCROW_LOCKED, RELEASED}"
          - "for each domain in {LENDING, COMPLIANCE_BSA_AML, INFORMATION_SECURITY, RISK_MANAGEMENT} there is a PolicyDocument of the group with that domain and status == EXAMINER_ACCEPTED"
          - "every VendorContract of the group with criticality == CRITICAL has status == SIGNED, and at least one of them has service_domain == CORE_PROCESSING"
        side_effects:
          - "group.stage = PRE_OPENING"
          - "group.opening_blocked_reason = NONE"
          - "increments OrganizingGroup.version by 1"
      - from: PRE_OPENING
        to: CONDITIONALLY_APPROVED
        trigger: "system event: either RegulatoryFiling of the group leaves CONDITIONALLY_APPROVED, or a ReadinessExam of the group resolves DEFICIENT"
        actor: system
        preconditions:
          - "group.stage == PRE_OPENING"
        side_effects:
          - "group.stage = CONDITIONALLY_APPROVED"
          - "group.opening_blocked_reason = FILING_INFO_REQUESTED when a filing left CONDITIONALLY_APPROVED, EXAM_DEFICIENT when an exam resolved DEFICIENT"
          - "every ReadinessExam of the group with status == SCHEDULED becomes CANCELLED"
          - "increments OrganizingGroup.version by 1"
      - from: PRE_OPENING
        to: OPEN
        trigger: "POST /de-novo/organizing-groups/{group_id}/advance with target_stage=OPEN"
        actor: CharterCounsel
        preconditions:
          - "both of the group's RegulatoryFilings have status == FINAL_APPROVED"
          - "at least one ReadinessExam of the group has status == PASSED"
          - "the group's CapitalRaise has status == RELEASED"
          - "group.opening_blocked_reason == NONE"
        side_effects:
          - "group.stage = OPEN"
          - "group.supervision_started_at = current logical clock"
          - "recompute group.supervision_year_index via `heightened_supervision_window` (becomes 1)"
          - "increments OrganizingGroup.version by 1"
      - from: ORGANIZING
        to: ABANDONED
        trigger: "POST /de-novo/organizing-groups/{group_id}/advance with target_stage=ABANDONED"
        actor: CharterCounsel
        preconditions:
          - "group.stage IN {ORGANIZING, FILING_READY, UNDER_REVIEW, CONDITIONALLY_APPROVED}"
        side_effects:
          - "group.stage = ABANDONED"
          - "every Subscription of the group's CapitalRaise with funding_state == FUNDED becomes funding_state = REFUNDED"
          - "because those subscriptions left FUNDED, the raise's cleared_escrow_cents, funded_gross_cents, pledged_gross_cents and refunded_gross_cents are recomputed"
          - "because cleared_escrow_cents reached 0, the CapitalRaise status becomes REFUNDED"
          - "increments OrganizingGroup.version by 1"
        note: "Same transition is declared from FILING_READY, UNDER_REVIEW and CONDITIONALLY_APPROVED with identical preconditions and side effects."

  - entity: Organizer
    initial_state: "fingerprint_state=PENDING x credit_state=PENDING"
    terminal_states: []
    note: >
      PARALLEL DIMENSIONS. fingerprint_state and credit_state advance independently on the same
      row; qualification_status is the compound derived from both plus qualification_subscore
      and waiver_granted. No ordering between the two dimensions is imposed.
    transitions:
      - from: "fingerprint_state=PENDING"
        to: "fingerprint_state=CLEARED"
        trigger: "POST /de-novo/organizers/{organizer_id}/background-result with dimension=FINGERPRINT, outcome=CLEARED"
        actor: CharteringExaminer
        preconditions:
          - "organizer.fingerprint_state == PENDING"
        side_effects:
          - "organizer.fingerprint_state = CLEARED"
          - "recompute organizer.qualification_subscore via `organizer_qualification_subscore`"
          - "recompute organizer.qualification_status via `organizer_qualification_status`"
          - "recompute the group's composition_status, organizer_count, independent_organizer_count, max_affiliation_count and management_composite_score"
          - "increments OrganizingGroup.version by 1"
      - from: "fingerprint_state=PENDING"
        to: "fingerprint_state=FLAGGED"
        trigger: "POST /de-novo/organizers/{organizer_id}/background-result with dimension=FINGERPRINT, outcome=FLAGGED"
        actor: CharteringExaminer
        preconditions:
          - "organizer.fingerprint_state == PENDING"
          - "adverse_finding_type is supplied and is not NONE"
        side_effects:
          - "organizer.fingerprint_state = FLAGGED and organizer.adverse_finding_type = the supplied value"
          - "organizer.qualification_status = DISQUALIFIED unless organizer.waiver_granted is true"
          - "recompute the group's composition_status and management_composite_score"
          - "increments OrganizingGroup.version by 1"
      - from: "credit_state=PENDING"
        to: "credit_state=CLEARED"
        trigger: "POST /de-novo/organizers/{organizer_id}/background-result with dimension=CREDIT, outcome=CLEARED"
        actor: CharteringExaminer
        preconditions:
          - "organizer.credit_state == PENDING"
        side_effects:
          - "organizer.credit_state = CLEARED"
          - "recompute organizer.qualification_subscore and organizer.qualification_status"
          - "recompute the group's composition_status and management_composite_score"
          - "increments OrganizingGroup.version by 1"
      - from: "credit_state=PENDING"
        to: "credit_state=ADVERSE"
        trigger: "POST /de-novo/organizers/{organizer_id}/background-result with dimension=CREDIT, outcome=ADVERSE"
        actor: CharteringExaminer
        preconditions:
          - "organizer.credit_state == PENDING"
          - "adverse_finding_type is supplied and is not NONE"
        side_effects:
          - "organizer.credit_state = ADVERSE and organizer.adverse_finding_type = the supplied value"
          - "organizer.qualification_status = DISQUALIFIED unless organizer.waiver_granted is true"
          - "recompute the group's composition_status and management_composite_score"
          - "increments OrganizingGroup.version by 1"
      - from: "qualification_status=DISQUALIFIED"
        to: "qualification_status=WAIVER_GRANTED"
        trigger: "POST /de-novo/organizers/{organizer_id}/qualification-waiver"
        actor: CharteringExaminer
        preconditions:
          - "organizer.qualification_status == DISQUALIFIED"
          - "organizer.waiver_granted == false"
        side_effects:
          - "organizer.waiver_granted = true, organizer.waiver_rationale = the supplied rationale"
          - "organizer.qualification_status = WAIVER_GRANTED"
          - "recompute the group's composition_status and management_composite_score"
          - "increments OrganizingGroup.version by 1"
        note: "The waiver does NOT alter fingerprint_state or credit_state - the two dimensions keep their adverse values."

  - entity: BusinessPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /de-novo/business-plans/{plan_id}/submit"
        actor: LeadOrganizer
        preconditions:
          - "plan.status == DRAFT"
          - "plan.stress_scenario_count >= 1"
          - "group.composition_status == COMPOSITION_MET"
          - "for every StressScenario of the plan, governing_min_leverage_ratio_bps >= DE_NOVO_FLOOR_LEVERAGE_BPS (800)"
          - "`capital_adequacy_verdict` for this plan evaluates to ADEQUATE"
        side_effects:
          - "plan.status = SUBMITTED"
          - "increments BusinessPlan.version by 1"
      - from: SUBMITTED
        to: PINNED
        trigger: "system event: the group's CHARTERING_AUTHORITY RegulatoryFiling receives decision CONDITIONALLY_APPROVED and its pinned_business_plan_id == plan.id"
        actor: system
        preconditions:
          - "plan.status == SUBMITTED"
        side_effects:
          - "plan.status = PINNED"
          - "increments BusinessPlan.version by 1"
      - from: PINNED
        to: SUBMITTED
        trigger: "system event: the group's CHARTERING_AUTHORITY RegulatoryFiling receives decision DENIED"
        actor: system
        preconditions:
          - "plan.status == PINNED"
        side_effects:
          - "plan.status = SUBMITTED"
          - "increments BusinessPlan.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: another BusinessPlan is created with supersedes_plan_id == plan.id"
        actor: system
        preconditions:
          - "plan.status IN {DRAFT, SUBMITTED}"
          - "plan.status != PINNED"
        side_effects:
          - "plan.status = SUPERSEDED"
          - "increments BusinessPlan.version by 1"
        note: "Same transition is declared from SUBMITTED. A PINNED plan can never be superseded; the create is rejected with ERR_PLAN_PINNED_NOT_SUPERSEDABLE."

  - entity: RegulatoryFiling
    initial_state: DRAFT
    terminal_states: [DENIED, FINAL_APPROVED]
    note: >
      CYCLIC. FILED -> ADDITIONAL_INFO_REQUESTED -> FILED repeats while
      info_request_round < MAX_INFO_ROUNDS (3); the round that would exceed the ceiling
      is converted into DENIED instead of another information request.
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /de-novo/regulatory-filings/{filing_id}/file"
        actor: CharterCounsel
        preconditions:
          - "filing.status == DRAFT"
          - "group.stage IN {FILING_READY, UNDER_REVIEW}"
          - "filing.pinned_business_plan_id references a BusinessPlan whose status IN {SUBMITTED, PINNED} and whose group_id == filing.group_id"
        side_effects:
          - "filing.status = FILED, filing.filed_at = current logical clock"
          - "if group.stage == FILING_READY then group.stage = UNDER_REVIEW"
          - "increments RegulatoryFiling.version by 1"
      - from: ADDITIONAL_INFO_REQUESTED
        to: FILED
        trigger: "POST /de-novo/regulatory-filings/{filing_id}/file"
        actor: CharterCounsel
        preconditions:
          - "filing.status == ADDITIONAL_INFO_REQUESTED"
          - "filing.info_request_round <= MAX_INFO_ROUNDS (3)"
        side_effects:
          - "filing.status = FILED, filing.filed_at = current logical clock"
          - "increments RegulatoryFiling.version by 1"
      - from: FILED
        to: ADDITIONAL_INFO_REQUESTED
        trigger: "POST /de-novo/regulatory-filings/{filing_id}/decision with decision=ADDITIONAL_INFO_REQUESTED"
        actor: "CharteringExaminer for authority CHARTERING_AUTHORITY, InsuranceExaminer for authority DEPOSIT_INSURER"
        preconditions:
          - "filing.status == FILED"
          - "filing.info_request_round + 1 <= MAX_INFO_ROUNDS (3)"
        side_effects:
          - "filing.info_request_round += 1"
          - "filing.status = ADDITIONAL_INFO_REQUESTED, filing.decision_at = current logical clock"
          - "increments RegulatoryFiling.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /de-novo/regulatory-filings/{filing_id}/decision with decision=DENIED, or with decision=ADDITIONAL_INFO_REQUESTED when info_request_round is already MAX_INFO_ROUNDS"
        actor: "CharteringExaminer for authority CHARTERING_AUTHORITY, InsuranceExaminer for authority DEPOSIT_INSURER"
        preconditions:
          - "filing.status == FILED"
        side_effects:
          - "filing.status = DENIED, filing.decision_at = current logical clock"
          - "because this filing became DENIED, if filing.authority == CHARTERING_AUTHORITY then the pinned BusinessPlan reverts PINNED -> SUBMITTED"
          - "because this filing became DENIED, the group reverts to stage ORGANIZING with opening_blocked_reason = FILING_INFO_REQUESTED"
          - "increments RegulatoryFiling.version by 1"
        note: "When decision=ADDITIONAL_INFO_REQUESTED arrives with info_request_round == MAX_INFO_ROUNDS the request is refused with ERR_INFO_ROUND_LIMIT_EXCEEDED and nothing mutates; the explicit DENIED decision is the only way to close the loop."
      - from: FILED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /de-novo/regulatory-filings/{filing_id}/decision with decision=CONDITIONALLY_APPROVED"
        actor: "CharteringExaminer for authority CHARTERING_AUTHORITY, InsuranceExaminer for authority DEPOSIT_INSURER"
        preconditions:
          - "filing.status == FILED"
          - "the acting examiner role matches filing.authority"
        side_effects:
          - "filing.status = CONDITIONALLY_APPROVED, filing.decision_at = current logical clock"
          - "if filing.authority == CHARTERING_AUTHORITY, the pinned BusinessPlan transitions SUBMITTED -> PINNED"
          - "recompute filing.pre_opening_clearance via `filing_condition_posture`"
          - "if both of the group's filings are now CONDITIONALLY_APPROVED, group.stage UNDER_REVIEW -> CONDITIONALLY_APPROVED"
          - "increments RegulatoryFiling.version by 1"
      - from: CONDITIONALLY_APPROVED
        to: ADDITIONAL_INFO_REQUESTED
        trigger: "system event: filing.open_blocking_condition_count rises from 0 to a positive number because a previously settled blocking condition was reopened or failed"
        actor: system
        preconditions:
          - "filing.status == CONDITIONALLY_APPROVED"
          - "filing.open_blocking_condition_count > 0"
          - "filing.info_request_round + 1 <= MAX_INFO_ROUNDS (3)"
        side_effects:
          - "filing.info_request_round += 1"
          - "filing.status = ADDITIONAL_INFO_REQUESTED and filing.pre_opening_clearance = false"
          - "because this filing left CONDITIONALLY_APPROVED, group.stage PRE_OPENING -> CONDITIONALLY_APPROVED with opening_blocked_reason = FILING_INFO_REQUESTED"
          - "increments RegulatoryFiling.version by 1"
      - from: CONDITIONALLY_APPROVED
        to: FINAL_APPROVED
        trigger: "POST /de-novo/regulatory-filings/{filing_id}/decision with decision=FINAL_APPROVED"
        actor: "CharteringExaminer for authority CHARTERING_AUTHORITY, InsuranceExaminer for authority DEPOSIT_INSURER"
        preconditions:
          - "filing.status == CONDITIONALLY_APPROVED"
          - "filing.open_blocking_condition_count == 0"
          - "group.stage == PRE_OPENING"
          - "at least one ReadinessExam of the group has status == PASSED"
        side_effects:
          - "filing.status = FINAL_APPROVED, filing.decision_at = current logical clock"
          - "increments RegulatoryFiling.version by 1"

  - entity: CapitalRaise
    initial_state: STRUCTURING
    terminal_states: [RELEASED, REFUNDED]
    transitions:
      - from: STRUCTURING
        to: OPEN
        trigger: "POST /de-novo/capital-raises/{raise_id}/open"
        actor: CharterCounsel
        preconditions:
          - "raise.status == STRUCTURING"
          - "group.stage IN {ORGANIZING, FILING_READY, UNDER_REVIEW, CONDITIONALLY_APPROVED}"
        side_effects:
          - "raise.status = OPEN"
          - "increments CapitalRaise.version by 1"
      - from: OPEN
        to: ESCROW_LOCKED
        trigger: "POST /de-novo/capital-raises/{raise_id}/lock-escrow"
        actor: EscrowAgent
        preconditions:
          - "raise.status == OPEN"
          - "count(Subscription where capital_raise_id == raise.id AND counts_toward_escrow == true) >= 1"
          - "raise.cleared_escrow_cents >= raise.minimum_gross_cents"
        side_effects:
          - "raise.status = ESCROW_LOCKED"
          - "increments CapitalRaise.version by 1"
      - from: ESCROW_LOCKED
        to: OPEN
        trigger: "system event: raise.cleared_escrow_cents falls below raise.minimum_gross_cents after a subscription screening rejection or refund"
        actor: system
        preconditions:
          - "raise.status == ESCROW_LOCKED"
          - "raise.cleared_escrow_cents < raise.minimum_gross_cents"
        side_effects:
          - "raise.status = OPEN"
          - "group.opening_blocked_reason = ESCROW_SHORTFALL"
          - "because the raise left ESCROW_LOCKED, every ApprovalCondition with category == CAPITAL and status == SATISFIED on either of the group's filings is returned to status OPEN and its adjudication_count is incremented"
          - "because those conditions returned to OPEN, each affected filing's open_blocking_condition_count and settled_condition_count are recomputed"
          - "if that recompute raises a CONDITIONALLY_APPROVED filing's open_blocking_condition_count from 0 to a positive number, that filing cascades CONDITIONALLY_APPROVED -> ADDITIONAL_INFO_REQUESTED with info_request_round += 1"
          - "increments CapitalRaise.version by 1"
      - from: ESCROW_LOCKED
        to: RELEASED
        trigger: "POST /de-novo/capital-raises/{raise_id}/release-escrow"
        actor: EscrowAgent
        preconditions:
          - "raise.status == ESCROW_LOCKED"
          - "group.stage == PRE_OPENING"
          - "both of the group's RegulatoryFilings have pre_opening_clearance == true"
          - "raise.projected_net_release_cents >= the opening_tier1_capital_cents of the BusinessPlan pinned on the group's CHARTERING_AUTHORITY filing"
        side_effects:
          - "raise.status = RELEASED"
          - "raise.released_net_cents = raise.projected_net_release_cents"
          - "increments CapitalRaise.version by 1"
      - from: OPEN
        to: REFUNDED
        trigger: "system event: group.stage becomes ABANDONED"
        actor: system
        preconditions:
          - "raise.status IN {STRUCTURING, OPEN, ESCROW_LOCKED}"
        side_effects:
          - "every Subscription of the raise with funding_state == FUNDED becomes REFUNDED"
          - "raise.cleared_escrow_cents, funded_gross_cents, pledged_gross_cents and refunded_gross_cents are recomputed"
          - "raise.status = REFUNDED"
          - "increments CapitalRaise.version by 1"
        note: "Same transition is declared from STRUCTURING and ESCROW_LOCKED."

  - entity: Subscription
    initial_state: "funding_state=PLEDGED x clearance_state=UNSCREENED"
    terminal_states: ["funding_state=REFUNDED", "clearance_state=REJECTED"]
    note: >
      PARALLEL DIMENSIONS on one row. funding_state tracks the money, clearance_state tracks
      investor screening; they advance in either order and only their conjunction
      (FUNDED x CLEARED) credits escrow.
    transitions:
      - from: "funding_state=PLEDGED"
        to: "funding_state=FUNDED"
        trigger: "POST /de-novo/subscriptions/{subscription_id}/funding with funding_event=FUND"
        actor: EscrowAgent
        preconditions:
          - "subscription.funding_state == PLEDGED"
          - "raise.status == OPEN"
        side_effects:
          - "subscription.funding_state = FUNDED"
          - "recompute subscription.counts_toward_escrow"
          - "recompute raise.funded_gross_cents, raise.cleared_escrow_cents, raise.projected_reimbursement_cents and raise.projected_net_release_cents"
          - "increments Subscription.version by 1"
      - from: "funding_state=FUNDED"
        to: "funding_state=REFUNDED"
        trigger: "POST /de-novo/subscriptions/{subscription_id}/funding with funding_event=REFUND"
        actor: EscrowAgent
        preconditions:
          - "subscription.funding_state == FUNDED"
          - "raise.status IN {OPEN, ESCROW_LOCKED}"
        side_effects:
          - "subscription.funding_state = REFUNDED and counts_toward_escrow = false"
          - "recompute raise.pledged_gross_cents, funded_gross_cents, cleared_escrow_cents, refunded_gross_cents, projected_reimbursement_cents, projected_net_release_cents and subscribed_shares"
          - "if the recomputed cleared_escrow_cents is below raise.minimum_gross_cents and raise.status == ESCROW_LOCKED then the raise reverts ESCROW_LOCKED -> OPEN with its own cascade"
          - "increments Subscription.version by 1"
      - from: "clearance_state=UNSCREENED"
        to: "clearance_state=SCREENING"
        trigger: "POST /de-novo/subscriptions/{subscription_id}/screening-result with outcome=SCREENING"
        actor: EscrowAgent
        preconditions:
          - "subscription.clearance_state == UNSCREENED"
        side_effects:
          - "subscription.clearance_state = SCREENING"
          - "increments Subscription.version by 1"
      - from: "clearance_state=UNSCREENED"
        to: "clearance_state=CLEARED"
        trigger: "POST /de-novo/subscriptions/{subscription_id}/screening-result with outcome=CLEARED"
        actor: EscrowAgent
        preconditions:
          - "subscription.clearance_state IN {UNSCREENED, SCREENING}"
        side_effects:
          - "subscription.clearance_state = CLEARED"
          - "recompute subscription.counts_toward_escrow"
          - "recompute raise.cleared_escrow_cents, projected_reimbursement_cents and projected_net_release_cents"
          - "increments Subscription.version by 1"
        note: "Same transition is declared from clearance_state=SCREENING."
      - from: "clearance_state=CLEARED"
        to: "clearance_state=REJECTED"
        trigger: "POST /de-novo/subscriptions/{subscription_id}/screening-result with outcome=REJECTED"
        actor: EscrowAgent
        preconditions:
          - "subscription.clearance_state IN {UNSCREENED, SCREENING, CLEARED}"
        side_effects:
          - "subscription.clearance_state = REJECTED and counts_toward_escrow = false"
          - "if subscription.funding_state == FUNDED then subscription.funding_state = REFUNDED"
          - "because the subscription stopped counting toward escrow, raise.cleared_escrow_cents, refunded_gross_cents, projected_reimbursement_cents and projected_net_release_cents are recomputed"
          - "because the recomputed cleared_escrow_cents is below raise.minimum_gross_cents while raise.status == ESCROW_LOCKED, the raise reverts ESCROW_LOCKED -> OPEN and group.opening_blocked_reason = ESCROW_SHORTFALL"
          - "because the raise left ESCROW_LOCKED, every ApprovalCondition with category == CAPITAL and status == SATISFIED on the group's filings returns to OPEN and each affected filing's counts are recomputed"
          - "if that recompute raises a CONDITIONALLY_APPROVED filing's open_blocking_condition_count from 0 to a positive number, that filing cascades CONDITIONALLY_APPROVED -> ADDITIONAL_INFO_REQUESTED with info_request_round += 1"
          - "increments Subscription.version by 1"
        note: "Same transition is declared from clearance_state=UNSCREENED and clearance_state=SCREENING."

  - entity: ApprovalCondition
    initial_state: OPEN
    terminal_states: [WAIVED]
    note: "Branching with a rework cycle: EVIDENCE_SUBMITTED can go forward to SATISFIED, sideways to FAILED, and FAILED can return to EVIDENCE_SUBMITTED."
    transitions:
      - from: OPEN
        to: EVIDENCE_SUBMITTED
        trigger: "POST /de-novo/approval-conditions/{condition_id}/evidence"
        actor: CharterCounsel
        preconditions:
          - "condition.status IN {OPEN, FAILED}"
          - "the current logical clock is strictly before condition.deadline_utc"
        side_effects:
          - "condition.status = EVIDENCE_SUBMITTED and condition.evidence_reference = the supplied reference"
          - "recompute the filing's open_blocking_condition_count and settled_condition_count via `filing_condition_posture`"
          - "increments ApprovalCondition.version by 1"
        note: "Same transition is declared from FAILED."
      - from: EVIDENCE_SUBMITTED
        to: SATISFIED
        trigger: "POST /de-novo/approval-conditions/{condition_id}/adjudicate with disposition=SATISFIED"
        actor: "CharteringExaminer for a CHARTERING_AUTHORITY filing, InsuranceExaminer for a DEPOSIT_INSURER filing"
        preconditions:
          - "condition.status == EVIDENCE_SUBMITTED"
          - "the acting examiner role matches the parent filing's authority"
        side_effects:
          - "condition.status = SATISFIED and condition.adjudication_count += 1"
          - "recompute filing.open_blocking_condition_count, filing.settled_condition_count and filing.pre_opening_clearance"
          - "increments ApprovalCondition.version by 1"
      - from: EVIDENCE_SUBMITTED
        to: FAILED
        trigger: "POST /de-novo/approval-conditions/{condition_id}/adjudicate with disposition=FAILED"
        actor: "CharteringExaminer for a CHARTERING_AUTHORITY filing, InsuranceExaminer for a DEPOSIT_INSURER filing"
        preconditions:
          - "condition.status == EVIDENCE_SUBMITTED"
        side_effects:
          - "condition.status = FAILED and condition.adjudication_count += 1"
          - "recompute filing.open_blocking_condition_count, filing.settled_condition_count and filing.pre_opening_clearance"
          - "if the filing was CONDITIONALLY_APPROVED and open_blocking_condition_count rose from 0, the filing cascades CONDITIONALLY_APPROVED -> ADDITIONAL_INFO_REQUESTED"
          - "increments ApprovalCondition.version by 1"
      - from: SATISFIED
        to: OPEN
        trigger: "POST /de-novo/approval-conditions/{condition_id}/adjudicate with disposition=REOPENED"
        actor: "CharteringExaminer for a CHARTERING_AUTHORITY filing, InsuranceExaminer for a DEPOSIT_INSURER filing"
        preconditions:
          - "condition.status == SATISFIED (WAIVED is terminal and cannot be reopened)"
        side_effects:
          - "condition.status = OPEN and condition.adjudication_count += 1"
          - "recompute filing.open_blocking_condition_count, filing.settled_condition_count and filing.pre_opening_clearance"
          - "if the filing was CONDITIONALLY_APPROVED and open_blocking_condition_count rose from 0, the filing cascades CONDITIONALLY_APPROVED -> ADDITIONAL_INFO_REQUESTED"
          - "increments ApprovalCondition.version by 1"
        note: "This is the compensating half of `condition_settlement_invariant` - it must restore filing.open_blocking_condition_count to its pre-satisfaction value exactly."
      - from: OPEN
        to: WAIVED
        trigger: "POST /de-novo/approval-conditions/{condition_id}/adjudicate with disposition=WAIVED"
        actor: "CharteringExaminer for a CHARTERING_AUTHORITY filing, InsuranceExaminer for a DEPOSIT_INSURER filing"
        preconditions:
          - "condition.status IN {OPEN, EVIDENCE_SUBMITTED, FAILED}"
        side_effects:
          - "condition.status = WAIVED and condition.adjudication_count += 1"
          - "recompute filing.open_blocking_condition_count, filing.settled_condition_count and filing.pre_opening_clearance"
          - "increments ApprovalCondition.version by 1"

  - entity: PolicyDocument
    initial_state: DRAFT
    terminal_states: [REJECTED]
    note: >
      Branching with revert: EXAMINER_ACCEPTED can be pulled back to REJECTED, which starts the
      deepest cascade in the scaffold. REJECTED is terminal for the document itself - remediation
      is a brand new PolicyDocument for the same domain, which the domain-uniqueness precondition
      now permits because the rejected one no longer counts as adopted.
    transitions:
      - from: DRAFT
        to: BOARD_ADOPTED
        trigger: "POST /de-novo/policy-documents/{policy_id}/adopt"
        actor: "LeadOrganizer or IndependentDirector"
        preconditions:
          - "policy.status == DRAFT"
          - "X-User-ID is the id of an Organizer whose group_id == policy.group_id"
          - "X-User-ID != policy.drafted_by_organizer_id (segregation of duties)"
          - "the acting Organizer's qualification_status IN {QUALIFIED, WAIVER_GRANTED}"
          - "no other PolicyDocument of the same group and same domain has status IN {BOARD_ADOPTED, EXAMINER_ACCEPTED}"
        side_effects:
          - "policy.status = BOARD_ADOPTED, policy.adopted_by_organizer_id = X-User-ID, policy.adopted_at = current logical clock"
          - "increments PolicyDocument.version by 1"
      - from: BOARD_ADOPTED
        to: EXAMINER_ACCEPTED
        trigger: "POST /de-novo/policy-documents/{policy_id}/examiner-review with outcome=ACCEPTED"
        actor: CharteringExaminer
        preconditions:
          - "policy.status == BOARD_ADOPTED"
        side_effects:
          - "policy.status = EXAMINER_ACCEPTED and policy.finding_note = the supplied note"
          - "increments PolicyDocument.version by 1"
      - from: EXAMINER_ACCEPTED
        to: REJECTED
        trigger: "POST /de-novo/policy-documents/{policy_id}/examiner-review with outcome=REJECTED"
        actor: CharteringExaminer
        preconditions:
          - "policy.status IN {BOARD_ADOPTED, EXAMINER_ACCEPTED}"
        side_effects:
          - "policy.status = REJECTED and policy.finding_note = the supplied note"
          - "because the policy became REJECTED, every ApprovalCondition with category == POLICY and status == SATISFIED on the group's CHARTERING_AUTHORITY filing becomes FAILED and its adjudication_count is incremented"
          - "because those conditions became FAILED, that filing's open_blocking_condition_count and settled_condition_count are recomputed and pre_opening_clearance becomes false"
          - "because open_blocking_condition_count rose from 0 while the filing was CONDITIONALLY_APPROVED, the filing transitions CONDITIONALLY_APPROVED -> ADDITIONAL_INFO_REQUESTED and info_request_round += 1"
          - "because that filing left CONDITIONALLY_APPROVED, group.stage PRE_OPENING -> CONDITIONALLY_APPROVED and group.opening_blocked_reason = FILING_INFO_REQUESTED"
          - "because the group left PRE_OPENING, every ReadinessExam of the group with status == SCHEDULED becomes CANCELLED"
          - "increments PolicyDocument.version by 1"
        note: "Five-link transitive cascade: policy -> conditions -> filing counts/state -> group stage -> scheduled exams. Each link is caused by the previous one, not by the original call."

  - entity: VendorContract
    initial_state: EVALUATING
    terminal_states: [TERMINATED]
    transitions:
      - from: EVALUATING
        to: SELECTED
        trigger: "POST /de-novo/vendor-contracts/{contract_id}/advance with target_status=SELECTED"
        actor: CharterCounsel
        preconditions:
          - "contract.status == EVALUATING"
          - "no other VendorContract of the same group and same service_domain has status IN {SELECTED, SIGNED}"
          - "if contract.criticality == CRITICAL then contract.due_diligence_score >= MIN_CRITICAL_DUE_DILIGENCE_SCORE (70)"
        side_effects:
          - "contract.status = SELECTED"
          - "increments VendorContract.version by 1"
      - from: SELECTED
        to: SIGNED
        trigger: "POST /de-novo/vendor-contracts/{contract_id}/advance with target_status=SIGNED"
        actor: CharterCounsel
        preconditions:
          - "contract.status == SELECTED"
        side_effects:
          - "contract.status = SIGNED"
          - "increments VendorContract.version by 1"
      - from: SELECTED
        to: TERMINATED
        trigger: "POST /de-novo/vendor-contracts/{contract_id}/advance with target_status=TERMINATED"
        actor: CharterCounsel
        preconditions:
          - "contract.status IN {EVALUATING, SELECTED, SIGNED}"
          - "group.stage != OPEN"
        side_effects:
          - "contract.status = TERMINATED"
          - "because the contract became TERMINATED, every ConversionWindow of the contract with status IN {RESERVED, CONFIRMED} becomes CANCELLED"
          - "because those windows were cancelled, contract.active_window_count is recomputed to 0"
          - "increments VendorContract.version by 1"
        note: "Same transition is declared from EVALUATING and SIGNED."

  - entity: ConversionWindow
    initial_state: RESERVED
    terminal_states: [CANCELLED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /de-novo/conversion-windows/{window_id}/confirm"
        actor: CharterCounsel
        preconditions:
          - "window.status == RESERVED"
          - "the parent VendorContract.status == SIGNED"
        side_effects:
          - "window.status = CONFIRMED"
          - "increments ConversionWindow.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "system event: the parent VendorContract becomes TERMINATED"
        actor: system
        preconditions:
          - "window.status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "window.status = CANCELLED"
          - "recompute VendorContract.active_window_count"
          - "increments ConversionWindow.version by 1"
        note: "Same transition is declared from CONFIRMED."

  - entity: ReadinessExam
    initial_state: SCHEDULED
    terminal_states: [PASSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /de-novo/readiness-exams/{exam_id}/result with outcome=PASSED"
        actor: CharteringExaminer
        preconditions:
          - "exam.status == SCHEDULED"
          - "group.stage == PRE_OPENING"
          - "the current logical clock is at or after exam.window_start_utc"
        side_effects:
          - "exam.status = PASSED and exam.finding_count = the supplied finding_count"
          - "increments ReadinessExam.version by 1"
      - from: SCHEDULED
        to: DEFICIENT
        trigger: "POST /de-novo/readiness-exams/{exam_id}/result with outcome=DEFICIENT"
        actor: CharteringExaminer
        preconditions:
          - "exam.status == SCHEDULED"
          - "group.stage == PRE_OPENING"
          - "the current logical clock is at or after exam.window_start_utc"
        side_effects:
          - "exam.status = DEFICIENT and exam.finding_count = the supplied finding_count"
          - "because the exam resolved DEFICIENT, group.stage PRE_OPENING -> CONDITIONALLY_APPROVED and group.opening_blocked_reason = EXAM_DEFICIENT"
          - "because the group left PRE_OPENING, every other ReadinessExam of the group with status == SCHEDULED becomes CANCELLED"
          - "increments ReadinessExam.version by 1"
      - from: DEFICIENT
        to: SCHEDULED
        trigger: "POST /de-novo/organizing-groups/{group_id}/readiness-exams creating a TARGETED_FOLLOW_UP exam after a DEFICIENT one"
        actor: CharteringExaminer
        preconditions:
          - "a prior ReadinessExam of the group has status == DEFICIENT"
          - "group.stage == CONDITIONALLY_APPROVED or PRE_OPENING"
          - "the new window does not collide with any prior exam's buffer-extended interval"
        side_effects:
          - "a new ReadinessExam row is created with status = SCHEDULED; the DEFICIENT exam is left untouched as the audit record"
          - "increments OrganizingGroup.version by 1"
        note: "Re-examination loop - the group can cycle DEFICIENT -> new SCHEDULED exam -> PASSED any number of times."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: group.stage leaves PRE_OPENING for any reason"
        actor: system
        preconditions:
          - "exam.status == SCHEDULED"
        side_effects:
          - "exam.status = CANCELLED"
          - "increments ReadinessExam.version by 1"

  - entity: DeviationRequest
    initial_state: SUBMITTED
    terminal_states: [AUTO_ACCEPTED, APPROVED, DENIED, ESCALATED]
    transitions:
      - from: SUBMITTED
        to: AUTO_ACCEPTED
        trigger: "system event: immediately after POST /de-novo/deviation-requests computes deviation_magnitude and requires_regulator_approval == false"
        actor: system
        preconditions:
          - "deviation.status == SUBMITTED"
          - "deviation.requires_regulator_approval == false, i.e. deviation.deviation_bps < DEVIATION_APPROVAL_THRESHOLD_BPS (1000)"
        side_effects:
          - "deviation.status = AUTO_ACCEPTED with no examiner involvement; the creation response already carries AUTO_ACCEPTED"
          - "no version bump beyond the one implied by creation"
        note: >
          A sub-threshold deviation is self-clearing, so the creation response never shows SUBMITTED
          for it. Only requests at or above the approval threshold remain SUBMITTED and wait for an
          examiner decision.
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /de-novo/deviation-requests/{deviation_id}/decision with decision=APPROVED"
        actor: CharteringExaminer
        preconditions:
          - "deviation.status == SUBMITTED"
          - "group.stage == OPEN"
          - "group.supervision_year_index BETWEEN 1 AND SUPERVISION_YEARS (3)"
        side_effects:
          - "deviation.status = APPROVED and deviation.decision_note = the supplied note"
          - "increments DeviationRequest.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /de-novo/deviation-requests/{deviation_id}/decision with decision=DENIED"
        actor: CharteringExaminer
        preconditions:
          - "deviation.status == SUBMITTED"
        side_effects:
          - "deviation.status = DENIED and deviation.decision_note = the supplied note"
          - "increments DeviationRequest.version by 1"
      - from: SUBMITTED
        to: ESCALATED
        trigger: "POST /de-novo/deviation-requests/{deviation_id}/decision with decision=ESCALATED"
        actor: CharteringExaminer
        preconditions:
          - "deviation.status == SUBMITTED"
          - "deviation.deviation_bps >= DEVIATION_ESCALATION_THRESHOLD_BPS (2500)"
        side_effects:
          - "deviation.status = ESCALATED and deviation.decision_note = the supplied note"
          - "increments DeviationRequest.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: business-plan-create-stale-group
    parent_entity: OrganizingGroup
    write_endpoint: "POST /de-novo/business-plans"
    occ_field: "expected_group_version"
    description: |
      Creating a BusinessPlan against an OrganizingGroup whose version has advanced since
      the client last observed it is rejected with a stale-version error. A plan create
      legitimately supersedes the prior plan of the group, so a writer holding an outdated
      view of the group (its composition, its background results, or an already-created
      newer plan) must re-read before writing.
    error_id: ERR_STALE_GROUP_VERSION
    http_status: 412

  - rule_id: conversion-window-reserve-stale-vendor-contract
    parent_entity: VendorContract
    write_endpoint: "POST /de-novo/conversion-windows"
    occ_field: "expected_vendor_contract_version"
    description: |
      Reserving a ConversionWindow against a VendorContract whose version has advanced since
      the client last observed it is rejected with a stale-version error. Reservations
      consume the contract's finite concurrent-conversion capacity, so a writer whose view
      of active_window_count is outdated must re-read the contract before reserving.
    error_id: ERR_STALE_VENDOR_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: organizer_qualification_subscore
    trigger: "On Organizer creation and on every POST /de-novo/organizers/{organizer_id}/background-result"
    algorithm: weighted_scoring
    formula: |
      experience_component = 0.40 * (min(organizer.banking_years, 20) / 20) * 100
      regulatory_component = 0.35 * organizer.regulatory_experience_score
      integrity_component  = 0.25 * (100 if organizer.fingerprint_state == CLEARED else 0)
      raw = experience_component + regulatory_component + integrity_component
      organizer.qualification_subscore = round_half_up(raw, 0)      # INTEGER, per-organizer
    input_set: "Fields of the single Organizer row only. credit_state does NOT enter the subscore; it only enters qualification_status."
    constants:
      BANKING_YEARS_CAP: 20
      EXPERIENCE_WEIGHT: 0.40
      REGULATORY_WEIGHT: 0.35
      INTEGRITY_WEIGHT: 0.25
      MIN_QUALIFYING_SUBSCORE: 50
    precision: "round_half_up to 0 decimal places; the unrounded raw value is never persisted."

  - name: organizer_qualification_status
    trigger: "Immediately after organizer_qualification_subscore on Organizer creation, background-result and qualification-waiver"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top-down; the FIRST matching clause wins.
      if organizer.waiver_granted == true:                              status = WAIVER_GRANTED
      elif organizer.fingerprint_state == FLAGGED
           or organizer.credit_state == ADVERSE:                        status = DISQUALIFIED
      elif organizer.fingerprint_state == PENDING
           or organizer.credit_state == PENDING:                        status = PENDING
      elif organizer.qualification_subscore < MIN_QUALIFYING_SUBSCORE:  status = DISQUALIFIED
      else:                                                            status = QUALIFIED
    input_set: "The single Organizer row: both background dimensions, waiver_granted, qualification_subscore."
    constants:
      MIN_QUALIFYING_SUBSCORE: 50
    precision: "Not applicable - enum output."

  - name: management_composite_score
    trigger: "On Organizer creation, on every background-result, and on every qualification-waiver"
    algorithm: weighted_scoring
    formula: |
      eligible = [Organizer o where o.group_id == group.id AND o.role_on_board != INVESTOR_ONLY],
                 ordered by o.created_at ASC (order is irrelevant to the sum but is pinned so
                 the reference implementation and the tests iterate identically)
      if len(eligible) == 0: group.management_composite_score = 0.00
      else:
        # PINNED ROUNDING ORDER - round each organizer's subscore to an INTEGER first
        # (that rounding already happened in organizer_qualification_subscore and the
        # persisted integer is what enters the sum), THEN average, THEN round to 2dp.
        subscore_sum = sum(o.qualification_subscore for o in eligible)     # integers
        group.management_composite_score = round_half_up(subscore_sum / len(eligible), 2)
    input_set: "All Organizers of the group whose role_on_board != INVESTOR_ONLY, in any qualification_status."
    constants:
      MIN_MANAGEMENT_COMPOSITE_SCORE: 70.00
    precision: >
      Two decimal places, round_half_up, applied ONCE at the end. The forbidden alternative -
      averaging the unrounded raw subscores and rounding only the average - produces a different
      cent value (for the canonical five-organizer fixture: 71.80 pinned vs 71.68 unpinned).

  - name: group_composition_assessment
    trigger: "On Organizer creation, on every background-result, and on every qualification-waiver"
    algorithm: aggregation
    formula: |
      members = [Organizer o where o.group_id == group.id]           # every row, no status filter
      group.organizer_count = count(members)
      group.independent_organizer_count = count(o in members where o.is_independent == true)
      group.max_affiliation_count = max over distinct o.affiliation_code of
                                    count(o in members with that affiliation_code)
                                    (0 when members is empty)
      key_roles_filled = { o.role_on_board for o in members
                           if o.role_on_board IN {PROPOSED_CEO, PROPOSED_CFO, PROPOSED_CRO, PROPOSED_CCO}
                           and o.qualification_status IN {QUALIFIED, WAIVER_GRANTED} }
      disqualified_count = count(o in members where o.qualification_status == DISQUALIFIED)

      if group.organizer_count < MIN_ORGANIZERS:            composition_status = FORMING
      elif group.independent_organizer_count >= MIN_INDEPENDENT_ORGANIZERS
           and len(key_roles_filled) == 4
           and disqualified_count == 0
           and group.max_affiliation_count <= floor(group.organizer_count / 2):
                                                            composition_status = COMPOSITION_MET
      else:                                                 composition_status = COMPOSITION_DEFICIENT
    input_set: "Every Organizer row of the group regardless of qualification_status; qualification_status is read, never filtered on, for the counts."
    constants:
      MIN_ORGANIZERS: 5
      MIN_INDEPENDENT_ORGANIZERS: 3
      AFFILIATION_CONCENTRATION_DIVISOR: 2
    precision: "Integer counts; floor division for the affiliation ceiling."

  - name: stress_leverage_path
    trigger: "On StressScenario creation (both variants are computed and both are persisted)"
    algorithm: chronological
    formula: |
      # Years are processed in ascending index order 1, 2, 3. capital carries forward.
      capital = plan.opening_tier1_capital_cents
      for t in [1, 2, 3]:                                  # ORDER PINNED, ascending
        if variant == DYNAMIC_GROWTH:
          assets_t = plan.projected_assets_y{t}_cents
          loans_t  = plan.projected_loans_y{t}_cents
        else:                                              # STATIC_BALANCE_SHEET
          assets_t = plan.projected_assets_y1_cents        # balance sheet held at year 1
          loans_t  = plan.projected_loans_y1_cents
        credit_loss_t = round_half_up(loans_t  * scenario.credit_loss_rate_bps / 10000, 0)
        nim_hit_t     = round_half_up(assets_t * scenario.nim_compression_bps  / 10000, 0)
        overrun_t     = scenario.expense_overrun_cents if t == 1 else 0
        stressed_ni_t = plan.projected_net_income_y{t}_cents - credit_loss_t - nim_hit_t - overrun_t
        capital       = capital + stressed_ni_t
        ratio_bps_t   = floor(capital * 10000 / assets_t)   # integer floor, toward -infinity
      min_leverage_ratio_bps = min(ratio_bps_1, ratio_bps_2, ratio_bps_3)
      breach_year_index      = smallest t in [1,2,3] with ratio_bps_t < DE_NOVO_FLOOR_LEVERAGE_BPS,
                               else 0
      # Both variants are stored:
      scenario.static_min_leverage_ratio_bps / static_breach_year_index   <- STATIC_BALANCE_SHEET run
      scenario.dynamic_min_leverage_ratio_bps / dynamic_breach_year_index <- DYNAMIC_GROWTH run
      scenario.governing_variant = STATIC_BALANCE_SHEET if scenario.scenario_code == BASELINE
                                   else DYNAMIC_GROWTH
      scenario.governing_min_leverage_ratio_bps / governing_breach_year_index
                                   <- the pair selected by governing_variant
      # then on the parent plan:
      plan.stress_scenario_count = count(StressScenario where business_plan_id == plan.id)
      plan.breach_scenario_count = count(those with governing_breach_year_index != 0)
      plan.worst_governing_min_leverage_ratio_bps =
            min(governing_min_leverage_ratio_bps over those scenarios), or 0 when there are none
    input_set: "The one StressScenario row plus the twelve projection fields of its parent BusinessPlan. No other scenario of the plan participates in a scenario's own path."
    constants:
      DE_NOVO_FLOOR_LEVERAGE_BPS: 800
      STRESS_YEARS: 3
    precision: "Cent-level integers throughout; each per-year loss is rounded to whole cents with round_half_up BEFORE being subtracted; ratios are floored to whole basis points."
    variants:
      - name: STATIC_BALANCE_SHEET
        when: "Governs when scenario_code == BASELINE; always computed and stored for every scenario."
        difference: >
          The balance sheet is frozen at the year-1 projection: assets_t and loans_t are
          projected_assets_y1_cents / projected_loans_y1_cents for all three years, so losses do
          not scale with growth and the denominator never grows.
      - name: DYNAMIC_GROWTH
        when: "Governs when scenario_code IN {ADVERSE, SEVERELY_ADVERSE}; always computed and stored."
        difference: >
          Assets and loans follow the plan year by year, so credit losses grow with the loan book
          while the ratio denominator grows with assets. For the canonical fixture plan with
          credit_loss_rate_bps=185 and nim_compression_bps=40 this yields min 636 bps with a
          year-3 breach, where STATIC_BALANCE_SHEET on the identical inputs yields min 1246 bps
          and no breach at all.

  - name: capital_adequacy_verdict
    trigger: "Evaluated on POST /de-novo/business-plans/{plan_id}/submit and served by GET /de-novo/organizing-groups/{group_id}/capital-adequacy"
    algorithm: threshold
    formula: |
      # Step 1 - concentration of the year-3 book (integer basis points, floored)
      concentration_bps = floor(plan.projected_loans_y3_cents * 10000 / plan.projected_assets_y3_cents)
      # Step 2 - concentration add-on, 5 bps per full 10 bps above the 6500 bps trip point
      concentration_add_on_bps = 0 if concentration_bps <= CONCENTRATION_TRIP_BPS
                                 else floor((concentration_bps - CONCENTRATION_TRIP_BPS) / 10) * 5
      # Step 3 - stress add-on, 25 bps per breaching scenario
      risk_add_on_bps = 25 * plan.breach_scenario_count + concentration_add_on_bps
      # Step 4 - nested min/max over the charter-type tier and the risk-adjusted floor
      base_required_bps = 800 if group.charter_type == NATIONAL
                          else 850 if group.charter_type == STATE_MEMBER
                          else 900                                    # STATE_NONMEMBER
      required_leverage_bps = min(REQUIRED_LEVERAGE_CEILING_BPS,
                                  max(base_required_bps,
                                      DE_NOVO_FLOOR_LEVERAGE_BPS + risk_add_on_bps))
      # Step 5 - verdict
      verdict = ADEQUATE if plan.worst_governing_min_leverage_ratio_bps >= required_leverage_bps
                else DEFICIENT
    input_set: "The BusinessPlan's year-3 projections, its aggregated StressScenario fields (breach_scenario_count, worst_governing_min_leverage_ratio_bps), and the OrganizingGroup's charter_type. Scenarios in no particular order - only the aggregate enters."
    constants:
      DE_NOVO_FLOOR_LEVERAGE_BPS: 800
      CONCENTRATION_TRIP_BPS: 6500
      REQUIRED_LEVERAGE_CEILING_BPS: 1200
      BREACH_ADD_ON_BPS_PER_SCENARIO: 25
    precision: "Integer basis points; both divisions floor."
    note: >
      Four independent inputs (charter_type tier, breach count, year-3 concentration, worst
      governing ratio) interact non-linearly through nested min/max, so the same plan is ADEQUATE
      at 805 bps required under a NATIONAL charter and DEFICIENT at 900 bps required under a
      STATE_NONMEMBER charter with no change to any projection.

  - name: subscription_amount
    trigger: "On POST /de-novo/subscriptions"
    algorithm: aggregation
    formula: |
      subscription.amount_cents = subscription.shares * raise.offering_price_cents_per_share
      # The price is read from the parent CapitalRaise at creation time and pinned into the row;
      # amount_cents is never recomputed if the raise is edited later.
    input_set: "The new Subscription's shares plus the parent CapitalRaise's offering_price_cents_per_share."
    constants: {}
    precision: "Exact integer multiplication - no rounding is possible."

  - name: escrow_position
    trigger: "On Subscription creation, on every funding event, and on every screening-result"
    algorithm: aggregation
    formula: |
      subs = [Subscription s where s.capital_raise_id == raise.id]
      raise.subscribed_shares      = sum(s.shares      for s in subs if s.funding_state IN {PLEDGED, FUNDED})
      raise.pledged_gross_cents    = sum(s.amount_cents for s in subs if s.funding_state IN {PLEDGED, FUNDED})
      raise.funded_gross_cents     = sum(s.amount_cents for s in subs if s.funding_state == FUNDED)
      raise.refunded_gross_cents   = sum(s.amount_cents for s in subs if s.funding_state == REFUNDED)
      for each s: s.counts_toward_escrow = (s.funding_state == FUNDED and s.clearance_state == CLEARED)
      raise.cleared_escrow_cents   = sum(s.amount_cents for s in subs if s.counts_toward_escrow)
      # The variant below decides which of these totals the escrow gate reads.
      escrow_position_cents = pledged_gross_cents  (SUBSCRIPTION_BASIS)
                              or cleared_escrow_cents (CLEARED_BASIS)
    input_set: >
      All Subscriptions of the raise. PLEDGED and FUNDED rows both feed the subscription basis;
      only FUNDED-and-CLEARED rows feed the cleared basis; REFUNDED rows feed neither and are
      tracked separately in refunded_gross_cents.
    constants: {}
    precision: "Exact cent integers - the sums never round, so a rejected screening must remove the whole subscription amount, not a rounded share of it."
    variants:
      - name: SUBSCRIPTION_BASIS
        when: >
          Reported on GET /de-novo/capital-raises/{raise_id} as pledged_gross_cents and used by the
          OPEN-state oversubscription guard (pledged shares against max_shares).
        difference: >
          Counts every subscription that has not been refunded, whether or not it has been funded
          and whether or not its investor screening has cleared. It is the marketing view of the
          raise and is always greater than or equal to the cleared basis.
      - name: CLEARED_BASIS
        when: >
          The ONLY basis the escrow gate accepts - it governs
          POST /de-novo/capital-raises/{raise_id}/lock-escrow, the minimum_gross_cents test, the
          ESCROW_LOCKED -> OPEN auto-revert, and escrow_release_allocation.
        difference: >
          Requires BOTH funding_state == FUNDED AND clearance_state == CLEARED. A subscription that
          is funded but whose investor screening was later rejected is inside the subscription basis
          and outside the cleared basis, so the two bases diverge by exactly that subscription's
          amount_cents and a raise can look fully subscribed while being un-lockable.

  - name: escrow_release_allocation
    trigger: "On Subscription screening/funding changes (projection refresh) and on POST /de-novo/capital-raises/{raise_id}/release-escrow (final)"
    algorithm: waterfall_allocation
    formula: |
      gross_cents = raise.cleared_escrow_cents                       # CLEARED_BASIS, never pledged
      # BUCKET 1 - organizational expense reimbursement, capped at a percentage of GROSS escrow
      reimbursement_cap_cents = round_half_up(ORG_EXPENSE_REIMBURSEMENT_CAP_PCT * gross_cents, 0)
      raise.projected_reimbursement_cents = min(raise.organizational_expense_claim_cents,
                                                reimbursement_cap_cents)
      # BUCKET 2 - everything left over is the capital that actually opens the bank
      raise.projected_net_release_cents = gross_cents - raise.projected_reimbursement_cents
      # On release-escrow only:
      raise.released_net_cents = raise.projected_net_release_cents
    input_set: "raise.cleared_escrow_cents (CLEARED_BASIS aggregate) and raise.organizational_expense_claim_cents. The claim is a single input figure, not a sum over rows."
    constants:
      ORG_EXPENSE_REIMBURSEMENT_CAP_PCT: 0.05
    precision: "The cap is rounded to whole cents with round_half_up BEFORE the min() is taken; the net is then exact subtraction so gross always reconciles to reimbursement + net."
    note: >
      Combinatorial mode (c) - the cap base is GROSS cleared escrow, NOT escrow net of the
      reimbursement. The plausible alternative reading, 'reimbursement may not exceed 5% of the
      capital actually released', is a fixed point r = 0.05 * (gross - r) and yields a different
      answer: on gross 4,150,000,000 with a claim of 260,000,000 the specified rule reimburses
      207,500,000 and releases 3,942,500,000, while the alternative reimburses 197,619,048 and
      releases 3,952,380,952. Only the gross-based reading is correct. When the claim is below the
      cap the two readings coincide, so the divergence is only observable with an over-cap claim.

  - name: filing_condition_posture
    trigger: "On ApprovalCondition creation, on every adjudicate, and on every cascade that changes a condition's status"
    algorithm: aggregation
    formula: |
      conds = [ApprovalCondition c where c.filing_id == filing.id]
      filing.condition_total_count = count(conds)
      filing.settled_condition_count =
            count(c in conds where c.status IN {SATISFIED, WAIVED})
      filing.open_blocking_condition_count =
            count(c in conds where c.is_pre_opening_blocking == true
                              and c.status IN {OPEN, EVIDENCE_SUBMITTED, FAILED})
      filing.pre_opening_clearance =
            (filing.status IN {CONDITIONALLY_APPROVED, FINAL_APPROVED}
             and filing.open_blocking_condition_count == 0)
    input_set: >
      Every ApprovalCondition of the filing. Non-blocking conditions are counted in
      condition_total_count and settled_condition_count but can never keep
      open_blocking_condition_count above zero.
    constants: {}
    precision: "Integer counts. condition_total_count is conserved by REOPENED - only the split between settled and open blocking moves."

  - name: exam_buffer_occupation
    trigger: "On POST /de-novo/organizing-groups/{group_id}/readiness-exams"
    algorithm: interval_merge
    formula: |
      # Each exam occupies its own window PLUS a trailing report-writing buffer.
      exam.buffer_end_utc = exam.window_end_utc + EXAM_BUFFER_HOURS hours
      effective_interval(exam) = [exam.window_start_utc, exam.buffer_end_utc)   # HALF-OPEN
      occupants = [ReadinessExam e where e.group_id == group.id
                                    and e.status IN {SCHEDULED, DEFICIENT, PASSED}]
                  # CANCELLED exams release their interval; every other status still holds it
      conflict = any e in occupants where
                 new.window_start_utc < e.buffer_end_utc
                 AND e.window_start_utc < new.buffer_end_utc
      # Half-open semantics: a new exam starting EXACTLY at an existing exam's buffer_end_utc is
      # allowed; starting one second earlier is a conflict.
    input_set: "All non-CANCELLED ReadinessExams of the same OrganizingGroup. Exams of other groups never conflict; the examiner team is modelled as group-scoped."
    constants:
      EXAM_BUFFER_HOURS: 48
    precision: "Whole-second UTC comparisons; the buffer is added to the END only, never to the start."
    note: >
      Capacity is one exam at a time (any overlap is a conflict), and the resource is the
      OrganizingGroup itself. Contrast with conversion_capacity_occupation, which allows two
      mutually overlapping occupants of a different resource and adds no buffer.

  - name: conversion_capacity_occupation
    trigger: "On POST /de-novo/conversion-windows"
    algorithm: aggregation
    formula: |
      new_window.duration_hours = round_half_up(
            (new.window_end_utc - new.window_start_utc) in seconds / 3600, 2)
      occupants = [ConversionWindow w where w.vendor_contract_id == contract.id
                                       and w.status IN {RESERVED, CONFIRMED}]
      overlapping = [w in occupants where new.window_start_utc < w.window_end_utc
                                     AND w.window_start_utc < new.window_end_utc]
      # AGGREGATE capacity, not pairwise exclusion:
      contract.active_window_count = count(occupants)
      conflict = count(overlapping) >= MAX_CONCURRENT_CONVERSIONS
      # Strict half-open interval, NO buffer: a window starting exactly when another ends is
      # adjacent, not overlapping, and does not consume capacity.
    input_set: "All RESERVED and CONFIRMED ConversionWindows of the SAME VendorContract. CANCELLED windows are excluded. Windows of sibling contracts are irrelevant even for the same group."
    constants:
      MAX_CONCURRENT_CONVERSIONS: 2
    precision: "duration_hours to 2 decimal places, round_half_up. Overlap comparisons are exact whole-second UTC."
    note: >
      Different interval semantics from exam_buffer_occupation on purpose: bare half-open windows
      with adjacency explicitly allowed, aggregate capacity of two rather than one, and the
      resource is the VendorContract rather than the OrganizingGroup.

  - name: deviation_magnitude
    trigger: "On POST /de-novo/deviation-requests"
    algorithm: threshold
    formula: |
      baseline_field = {
        ASSET_GROWTH:   baseline_plan.projected_assets_y{n}_cents,
        LOAN_GROWTH:    baseline_plan.projected_loans_y{n}_cents,
        DEPOSIT_GROWTH: baseline_plan.projected_deposits_y{n}_cents,
        BRANCH_COUNT:   baseline_plan.projected_branch_count,
      }[deviation.metric]
      n = deviation.supervision_year_index_at_request = group.supervision_year_index
      deviation.baseline_value = baseline_field
      if deviation.baseline_value == 0:
        deviation.deviation_bps = 0 if deviation.actual_value == 0 else DEVIATION_ESCALATION_THRESHOLD_BPS
      else:
        deviation.deviation_bps = floor(abs(deviation.actual_value - deviation.baseline_value)
                                        * 10000 / abs(deviation.baseline_value))
      deviation.requires_regulator_approval =
            deviation.deviation_bps >= DEVIATION_APPROVAL_THRESHOLD_BPS
    input_set: "The one DeviationRequest row, the pinned baseline BusinessPlan's projection for the metric AND for the group's current supervision year, and group.supervision_year_index."
    constants:
      DEVIATION_APPROVAL_THRESHOLD_BPS: 1000
      DEVIATION_ESCALATION_THRESHOLD_BPS: 2500
    precision: "Integer basis points, floored. The magnitude is absolute - a shortfall of 10% and an overshoot of 10% both land on 1000 bps and both require approval."
    note: >
      At exactly DEVIATION_APPROVAL_THRESHOLD_BPS the request requires approval and stays
      SUBMITTED; one basis point below it self-clears to AUTO_ACCEPTED on creation.

  - name: heightened_supervision_window
    trigger: "On OrganizingGroup stage change to OPEN, on POST /de-novo/_clock/set_current_utc, and on DeviationRequest creation"
    algorithm: chronological
    formula: |
      if group.supervision_started_at is null:      group.supervision_year_index = 0
      else:
        elapsed_days = floor((current_utc - group.supervision_started_at) in seconds / 86400)
        raw_index = floor(elapsed_days / 365) + 1
        group.supervision_year_index = raw_index if raw_index <= SUPERVISION_YEARS else 0
      # index 0 means either 'not yet opened' or 'heightened supervision has expired'; both
      # states reject deviation requests, but with different errors.
    input_set: "group.supervision_started_at (set when the group reaches OPEN) and the current logical clock."
    constants:
      SUPERVISION_YEARS: 3
      DAYS_PER_SUPERVISION_YEAR: 365
    precision: "Floor division on whole days; day 364 after opening is still supervision year 1, day 365 is year 2, and day 1095 is the first day outside the window."

  - name: escrow_conservation_invariant
    trigger: "Asserted after every Subscription funding event and every screening-result"
    algorithm: aggregation
    formula: |
      # Conserved quantity: CENTS OF ESCROWED CAPITAL.
      # For every CapitalRaise at every point in time:
      cleared_escrow_cents == sum(s.amount_cents for s in subscriptions of the raise
                                  if s.counts_toward_escrow)
      pledged_gross_cents + refunded_gross_cents ==
            sum(s.amount_cents for s in subscriptions of the raise)
      # A FUND followed by a REFUND of the same subscription must restore
      # cleared_escrow_cents to its exact pre-FUND value - no partial-cent residue, no
      # double subtraction when the subscription was also screening-rejected.
      # A screening rejection of a funded-and-cleared subscription must lower
      # cleared_escrow_cents by exactly that subscription's amount_cents and must move
      # exactly that amount out of funded_gross_cents into refunded_gross_cents, leaving
      # funded_gross_cents + refunded_gross_cents unchanged by the rejection.
    input_set: "All Subscriptions of the raise plus the raise's own aggregate fields."
    constants: {}
    precision: "Exact cent equality - the invariant is an equality, not a tolerance."

  - name: condition_settlement_invariant
    trigger: "Asserted after every ApprovalCondition adjudicate and after every cascade that touches conditions"
    algorithm: aggregation
    formula: |
      # Conserved quantity: THE COUNT OF CONDITIONS ON A FILING.
      # For every RegulatoryFiling at every point in time:
      condition_total_count == count(all ApprovalConditions of the filing)
      condition_total_count is NEVER changed by any adjudication - only creation changes it.
      # A SATISFIED -> REOPENED -> EVIDENCE_SUBMITTED -> SATISFIED round trip must restore
      # settled_condition_count and open_blocking_condition_count to their exact pre-REOPEN
      # values, and must leave adjudication_count strictly higher (the audit trail grows even
      # though the counts return).
    input_set: "All ApprovalConditions of the filing plus the filing's own aggregate counts."
    constants: {}
    precision: "Exact integer equality."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority - lowest number wins)
# =============================================================================
# Domain ordering rationale: this is a prudential-supervision domain, so the ladder runs
#   auth -> schema -> existence -> optimistic concurrency -> own state -> other entity's state
#   -> safety/compliance -> referential integrity -> constraint/uniqueness/capacity
#   -> temporal -> fiscal.
# Fiscal checks are deliberately LAST: a request that is fiscally impossible but also
# mis-staged reports the staging error, never the money error.
validations:
  # --- Band 1: authentication and authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The supplied X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: >
      For the entity-backed roles LeadOrganizer and IndependentDirector, X-User-ID is the id of an
      existing Organizer row whose group_id is the group in scope for the request (the group in the
      path, or the group of the parent entity in the path, or the group_id in the body)
    error_id: ERR_ORGANIZER_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "every endpoint whose roles list contains LeadOrganizer or IndependentDirector"

  # --- Band 2: request schema ------------------------------------------------
  - priority: 4
    category: business_constraint
    check: >
      Every required input field is present and well-typed; every enum field holds a declared
      member (charter_type, role_on_board, scenario_code, authority, category, domain,
      service_domain, criticality, metric, exam_scope, dimension, outcome, decision, disposition,
      funding_event, target_stage, target_status); integers are non-negative where the domain
      demands it; banking_years is 0..60; regulatory_experience_score and due_diligence_score are
      0..100; credit_loss_rate_bps and nim_compression_bps are 0..5000; contract_term_months is
      1..120; shares is >= 1; waiver_rationale, narrative and evidence_reference are >= 20
      characters; home_state_code is exactly two uppercase letters; limit is 1..100 and offset >= 0
      on every list endpoint
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  # --- Band 3: existence ----------------------------------------------------
  - priority: 5
    category: existence
    check: "Every path parameter resolves to an existing row, validated left-to-right"
    error_id: "ERR_GROUP_NOT_FOUND | ERR_ORGANIZER_NOT_FOUND | ERR_BUSINESS_PLAN_NOT_FOUND | ERR_STRESS_SCENARIO_NOT_FOUND | ERR_CAPITAL_RAISE_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_CONDITION_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_VENDOR_CONTRACT_NOT_FOUND | ERR_CONVERSION_WINDOW_NOT_FOUND | ERR_EXAM_NOT_FOUND | ERR_DEVIATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 6
    category: existence
    check: >
      Every foreign key supplied in the request BODY resolves to an existing row: group_id,
      capital_raise_id, organizer_id, business_plan_id, supersedes_plan_id, pinned_business_plan_id,
      drafted_by_organizer_id, vendor_contract_id, baseline_plan_id
    error_id: "ERR_GROUP_NOT_FOUND | ERR_ORGANIZER_NOT_FOUND | ERR_BUSINESS_PLAN_NOT_FOUND | ERR_CAPITAL_RAISE_NOT_FOUND | ERR_VENDOR_CONTRACT_NOT_FOUND"
    http_status: 404
    applies_to: "every POST that accepts a foreign key in its body"

  # --- Band 4: optimistic concurrency ---------------------------------------
  - priority: 7
    category: state
    check: "expected_group_version equals the current OrganizingGroup.version"
    error_id: ERR_STALE_GROUP_VERSION
    http_status: 412
    applies_to: "POST /de-novo/business-plans"

  - priority: 8
    category: state
    check: "expected_vendor_contract_version equals the current VendorContract.version"
    error_id: ERR_STALE_VENDOR_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /de-novo/conversion-windows"

  # --- Band 5: the target row's own state -----------------------------------
  - priority: 9
    category: state
    check: "group.stage permits the requested target_stage per the OrganizingGroup state machine"
    error_id: ERR_STAGE_TRANSITION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /de-novo/organizing-groups/{group_id}/advance"

  - priority: 10
    category: state
    check: "group.stage IN {ORGANIZING, FILING_READY} when adding an organizer; group.stage NOT IN {OPEN, ABANDONED} when creating a business plan, capital raise, policy document or vendor contract"
    error_id: ERR_GROUP_STAGE_LOCKED
    http_status: 409
    applies_to: "POST /de-novo/organizing-groups/{group_id}/organizers, POST /de-novo/business-plans, POST /de-novo/capital-raises, POST /de-novo/policy-documents, POST /de-novo/vendor-contracts"

  - priority: 11
    category: state
    check: "The addressed background dimension is still PENDING (fingerprint_state for dimension=FINGERPRINT, credit_state for dimension=CREDIT)"
    error_id: ERR_BACKGROUND_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /de-novo/organizers/{organizer_id}/background-result"

  - priority: 12
    category: state
    check: "organizer.qualification_status == DISQUALIFIED and organizer.waiver_granted == false"
    error_id: ERR_WAIVER_NOT_APPLICABLE
    http_status: 409
