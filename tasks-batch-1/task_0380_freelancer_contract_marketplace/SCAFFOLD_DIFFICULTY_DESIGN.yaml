            - call: "POST /disputes/${d2}/assign-arbitration"
              payload: {}
              as: Arbitrator
            - call: "POST /disputes/${d2}/resolve"
              payload: { arbitrator_award_cents: 0 }
              as: Arbitrator
            - call: "POST /contracts/${contract_id}/milestones/${ml3}/submit-work"
              payload: {}
              as: Freelancer
              as_user_id: "${fl_id}"
            - call: "POST /contracts/${contract_id}/milestones/${ml3}/dispute"
              payload: { raised_by: "CLIENT", reason: "bad3", claimed_release_cents: 30000 }
              as: Client
              as_user_id: "${client_id}"
              captures: { d3: $.data.id }
            - call: "POST /disputes/${d3}/assign-arbitration"
              payload: {}
              as: Arbitrator
            - call: "POST /disputes/${d3}/resolve"
              payload: { arbitrator_award_cents: 0 }
              as: Arbitrator
            - call: "POST /contracts/${contract_id}/milestones/${mpay}/submit-work"
              payload: {}
              as: Freelancer
              as_user_id: "${fl_id}"
            - call: "POST /contracts/${contract_id}/milestones/${mpay}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /contracts/${contract_id}/milestones/${mpay}/release"
              payload: { expected_contract_version: "${cv4}" }
              as: Client
