        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_VIOLATION]"]
        distinguishing_aspect: "The AccountAdmin who cleared a distribution (adminA) attempting to also substantiate it returns ERR_SEGREGATION_VIOLATION (two-person control on cleared_by_user_id)."
