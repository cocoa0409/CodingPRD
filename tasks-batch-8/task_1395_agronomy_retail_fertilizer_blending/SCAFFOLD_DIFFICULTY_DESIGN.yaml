        distinguishing_aspect: |
          Metric: timestamp instant via POST /agronomy/prepay-contracts/{id}/fund —
          a different metric (time, not mass) on a different endpoint. Funding at
          exactly the deadline instant is ADMITTED (inclusive <=); one second past
          is REJECTED.
        test_recipe:
          setup:
            - "Grower; MOP product + sheet 44500; FALL program (deadline 2026-11-15T23:59:59Z, discount 0.05, deposit 0.30, penalty 0.10); contract 20 t signed at default clock"
