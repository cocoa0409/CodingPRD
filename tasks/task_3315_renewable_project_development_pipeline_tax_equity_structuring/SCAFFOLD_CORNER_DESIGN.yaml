              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${m4}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "COMMISSIONING" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "COMMERCIAL_OPERATION", sequence_no: 5, planned_date: "2027-11-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m5: $.data.id }
            - call: "POST /api/construction-milestones/${m5}/submit-evidence"
              payload: { evidence_uri: "s3://ev/fo5", work_date: "2027-11-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${m5}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/tax-equity-partnerships/${ps}/distributions"
              payload: { amount_usd: 100000.01, period_end_date: "2027-12-31T00:00:00Z" }
              as: TaxCounsel
            - call: "GET /api/tax-equity-partnerships/${ps}"
              as: TaxCounsel
              captures: { psv: $.data.version }
            - call: "POST /api/tax-equity-partnerships/${ps}/distributions"
              payload: { amount_usd: 50000.00, period_end_date: "2028-03-31T00:00:00Z" }
              as: TaxCounsel
          trigger:
            - call: "POST /api/tax-equity-partnerships/${ps}/transitions"
              payload: { to: "FLIPPED", expected_partnership_version: "${psv}" }
              as: TaxCounsel
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_VERSION (412): the second distribution advanced the partnership version past ${psv}, so the flip's OCC check refuses it even though state and IRR would pass"
            - "TaxEquityPartnership.${ps}.status remains PRE_FLIP_OPERATING"

      - name: derived_total_itc_reconciles_after_qualification
        claim_type: derived_field_reconciliation
        grounds: [entities.Project.fields.total_itc_credits_usd, calculations.itc_credit_amount]
        distinguishing_aspect: "Project.total_itc_credits_usd is a denormalized mirror: 0.00 before QUALIFIED, exactly qualified_credit_usd after, and recomputed (not accumulated) on each qualification."
        test_recipe:
