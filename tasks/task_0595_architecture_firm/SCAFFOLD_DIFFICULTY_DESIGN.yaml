              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "DD", weight_bp: 2000, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CD", weight_bp: 4000, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 2000, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /submittals"
              payload: { project_id: "${proj}", consultant_firm_id: "${firm_id}", spec_section: "05 12 00" }
              as: ConsultantRep
