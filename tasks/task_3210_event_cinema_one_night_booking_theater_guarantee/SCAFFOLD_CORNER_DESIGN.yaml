  # ===========================================================================
  - section: state_machines
    instances:

      - name: failed_delivery_blocks_key_issuance_permanently
        claim_type: Terminal State Lockdown
        grounds:
          - entities.ContentDelivery.fields.status
          - state_machines.ContentDelivery.DELIVERED_to_FAILED
          - endpoints.POST_/content-deliveries/{id}/mark-failed
          - errors[ERR_DELIVERY_NOT_VERIFIED]
        distinguishing_aspect: "FAILED is a terminal delivery state, not a transient one: a corrupt package can never be promoted to VERIFIED, so its booking's key stays unissuable until a replacement package is registered and verified."
        test_recipe:
          setup:
            - "Standard CA fixture, booking ON_SALE with one screening and a delivery whose received checksum already mismatches the expected one."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "FILE", content_checksum: "sha256:expected0000", scheduled_delivery_utc: "2026-11-25T00:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_bad: $.data.id }
            - call: "POST /event-cinema/content-deliveries/${cd_bad}/mark-delivered"
              payload: { delivered_checksum: "sha256:corrupt9999" }
              as: PlatformOps
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T18:00:00Z", not_valid_after_utc: "2026-12-01T21:00:00Z" }
              as: PlatformOps
              captures: { key_id: $.data.id }
          trigger:
            - call: "POST /event-cinema/content-deliveries/${cd_bad}/mark-failed"
              payload: {}
              as: ContentOfficer
              captures: { failed_state: $.data.status }
            - call: "POST /event-cinema/content-deliveries/${cd_bad}/verify"
              payload: {}
              as: ContentOfficer
              captures: { verify_err: "$.data.error_id" }
            - call: "POST /event-cinema/keys/${key_id}/issue"
              payload: {}
              as: PlatformOps
              captures: { issue_err2: "$.data.error_id" }
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "FILE", content_checksum: "sha256:good1111", scheduled_delivery_utc: "2026-11-25T00:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_good: $.data.id }
            - call: "POST /event-cinema/content-deliveries/${cd_good}/mark-delivered"
              payload: { delivered_checksum: "sha256:good1111" }
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries/${cd_good}/verify"
              payload: {}
              as: PlatformOps
              captures: { good_state: $.data.status }
            - call: "POST /event-cinema/keys/${key_id}/issue"
              payload: {}
              as: PlatformOps
              captures: { key_issued: $.data.issuance_status }
          assert:
            - "the corrupt package is terminal — ${failed_state} == FAILED"
            - "a failed package can never be promoted to verified — ${verify_err} == ERR_DELIVERY_NOT_VERIFIED at 409"
            - "while only the failed package exists the key cannot be issued — ${issue_err2} == ERR_DELIVERY_NOT_VERIFIED"
            - "a replacement package verifies normally — ${good_state} == VERIFIED"
            - "with a verified package on the booking the key finally issues — ${key_issued} == ISSUED"
