  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_suppressed_plan_submit
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.ActionPlan
        distinguishing_aspect: |
          Pair: state (p5 ERR_INVALID_STATE) vs business_safety (p6
          ERR_CONFIDENTIALITY). The plan is driven to REJECTED while its unit
          snapshot is visible; then the unit's min_n_threshold is raised to 20
          and the snapshot recomputed into numeric_suppressed=true. A submit
          attempt now violates p5 (REJECTED is not a valid from-state for
          submit) AND p6 (suppressed snapshot). The scaffold's ordering pins
          ERR_INVALID_STATE (p5 < p6) as the winner.
        test_recipe:
          setup:
            - "REPORTED census cycle; Unit I min_n=3 with exactly 3 submitted respondents -> snapshot initially visible"
            - "Plan for Unit I driven DRAFT->SUBMITTED->REJECTED while visible"
            - "HRAdmin then PATCHes Unit I min_n_threshold to 20 and PeopleAnalyst recomputes the DIRECT snapshot -> numeric_suppressed == true"
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Prio Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { pr_bank: $.data.id }
            - call: "POST /engagement/item-banks/${pr_bank}/items"
              payload: { item_code: "PR-01", dimension: "WORKLOAD", weight: 1.0 }
              as: HRAdmin
              captures: { pr_i1: $.data.id }
