              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 1 }
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-Z", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_z_id: $.data.id }
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-G", suite_id: "${suite_id}", qualification_type: "GOWNING", expires_on: "2027-06-01T00:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { pq_g_id: $.data.id }
          trigger:
            - call: "POST /personnel-qualifications/${pq_a_id}/qualify"
