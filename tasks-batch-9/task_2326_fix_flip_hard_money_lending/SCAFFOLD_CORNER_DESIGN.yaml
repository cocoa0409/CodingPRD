            - call: "PATCH /lending/properties/${p1}/valuation"
              payload: { appraisal_date: "2026-08-10", arv_cents: 33000000 }
              as: LoanOfficer
              captures: { p1_ver2: $.data.version }
          assert:
            - "both properties are 201 with distinct bare-UUID ids (no \"prop_\" style prefix) and version == 1"
            - "created_at is ISO 8601 UTC with three fractional digits and equals the logical clock instant 2026-08-10T09:00:00.000Z, not the wall clock"
            - "status == UNDER_CONTRACT on both rows (the initial state is system-assigned; the caller cannot set it)"
            - "trigger 3: version == 2 and updated_at > created_at while created_at and id are unchanged — a mutation bumps the version by exactly one"
            - "trigger 3: arv_cents == 33000000 and appraisal_date == 2026-08-10 while purchase_price_cents is untouched at 20000000"

