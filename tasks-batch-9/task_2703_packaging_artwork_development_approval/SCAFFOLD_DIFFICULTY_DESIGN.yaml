            - call: "POST /review-tasks/${t_2_reg}/decision"
              payload: {decision: "APPROVED", comment: "Regulatory copy approved."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /review-tasks/${t_2_legal}/decision"
              payload: {decision: "APPROVED", comment: "No legal exposure."}
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "POST /review-tasks/${t_2_qa}/decision"
              payload: {decision: "APPROVED", comment: "Quality sign-off."}
              as: QualityReviewer
