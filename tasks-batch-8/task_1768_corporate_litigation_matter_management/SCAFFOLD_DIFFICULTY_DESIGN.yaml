- rule_id: transitive_cascade
  instances:
    - name: settlement_execute_cascade_matter_hold_custodian_workorder_vendor
      grounds:
        - state_machines.SettlementRequest.APPROVED_to_EXECUTED
        - state_machines.Matter.SETTLEMENT_PENDING_to_RESOLVED
        - state_machines.LitigationHold.ISSUED_to_RELEASED
        - state_machines.HoldCustodian.transitions
        - state_machines.VendorWorkOrder.AUTHORIZED_to_CANCELLED
        - calculations.vendor_capacity_rollup
      distinguishing_aspect: |
        Depth-4 transitive cascade from the execute trigger: settlement EXECUTED causes
        Matter SETTLEMENT_PENDING->RESOLVED (link 1), which releases the ISSUED hold (link 2),
        which releases its ACKNOWLEDGED custodian (link 3), while the same matter cascade
        cancels the AUTHORIZED work order (link 2') which releases vendor committed_gb (link 3')
        — each link caused by the previous, not by the original execute call.
      test_recipe:
        setup:
          - "an ACTIVE matter with APPROVED budget, ACTIVE engagement, an ACKNOWLEDGED hold with one ACKNOWLEDGED custodian, and an AUTHORIZED work order of 100 GB against a vendor (committed_gb=100)"
          - "a settlement for 5000000 submitted, under review, fully approved (single-approval amount under a TIER_2 policy ceiling 10000000) so the matter is SETTLEMENT_PENDING"
          - "a payment request for the settlement created, submitted, and FINANCE_APPROVED (staged) so execute is permitted"
          - "logical clock at default"
