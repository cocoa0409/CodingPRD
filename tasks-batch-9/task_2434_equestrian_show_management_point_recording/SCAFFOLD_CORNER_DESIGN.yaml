  # ===========================================================================
  # 2. State Machines (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Show.initial_state
          - state_machines.ShowClass.initial_state
          - state_machines.RingSlot.initial_state
          - state_machines.Ring.initial_state
          - state_machines.Entry.initial_state
          - state_machines.ClassEntry.initial_state
          - state_machines.ComplianceCase.initial_state
          - state_machines.CoverageShift.initial_state
          - state_machines.OfficialAssignment.initial_state
        distinguishing_aspect: |
          Nine machines, nine initial states, and two of them are not the obvious
          "first enum member": Entry is born with the pair (RECEIVED, UNBILLED)
          across its two independent dimensions, and OfficialAssignment is born
          ACTIVE (there is no PENDING chair). An implementation that starts a
          RingSlot at RUNNING, or a CoverageShift at ACTIVE, is caught here.
        test_recipe:
          setup:
            - "One show carried to APPROVED with a JUMPER division, class 101 OPEN and class 102 left untouched at creation."
            - "One rider, one horse, one judge, one steward."
          setup_api_calls:
