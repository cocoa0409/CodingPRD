  - name: occ_appraise_stale_collateral_version_returns_412
    claim_type: occ_stale_version
    grounds:
    - concurrency_rules[appraisal-stale-collateral]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: A second appraisal carrying the pre-appraisal collateral version is rejected with 412; the first appraisal's value (9,000,000) stands.
    test_recipe:
      setup:
      - PLEDGED collateral appraised 10,000,000; client holds version ${cv1}
      setup_api_calls:
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
          assoc: $.data.id
      - call: POST /borrowers
        payload:
          association_id: ${assoc}
          legal_name: Sunrise Farms LLC
          tax_id: 41-0000001
          county: BLACKHAWK
        as: LoanOfficer
        captures:
          bor: $.data.id
      - call: POST /loan-accounts
        payload:
          borrower_id: ${bor}
          requested_commitment_cents: 50000000
          rate_bps: 700
          season_year: 2026
          maturity_date: '2027-02-28T00:00:00Z'
        as: LoanOfficer
        captures:
          loan: $.data.id
      - call: POST /collateral
        payload:
          loan_account_id: ${loan}
          collateral_type: EQUIPMENT
          description: Sprayer
          appraised_value_cents: 10000000
        as: LoanOfficer
        captures:
          col: $.data.id
          cv1: $.data.version
      - call: POST /collateral/${col}/appraise
        payload:
          appraised_value_cents: 9000000
          expected_collateral_version: ${cv1}
        as: LoanOfficer
        captures:
          val: $.data.appraised_value_cents
      trigger:
      - call: POST /collateral/${col}/appraise
        payload:
          appraised_value_cents: 8000000
          expected_collateral_version: ${cv1}
        as: LoanOfficer
        captures:
          err: $.data.error_id
      - call: GET /collateral/${col}
        as: LoanOfficer
        captures:
          val_end: $.data.appraised_value_cents
          cv2: $.data.version
      assert:
      - 'first appraisal landed: appraised_value_cents == 9000000 (${val})'
      - 'stale second appraisal: error_id == ERR_STALE_VERSION (${err}), HTTP 412'
      - value still 9000000 (${val_end}) and version == ${cv1} + 1 (${cv2})
  - name: ops_run_activates_and_expires_deferrals
