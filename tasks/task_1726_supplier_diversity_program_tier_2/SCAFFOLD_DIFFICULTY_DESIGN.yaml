  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: scorecard_attribution_depends_on_certification_state
        grounds:
          - calculations.diverse_spend_attribution
          - state_machines.Certification.VERIFIED_to_REVOKED
          - state_machines.Scorecard
        distinguishing_aspect: |
          Pair Scorecard x Certification: the same POSTED spend record is attributable
          while the certification is VERIFIED and becomes unattributable once the
          certification is REVOKED by an audit — the snapshot keeps the old figure until
          recompute, proving the derived value is gated by the other entity's state.
        test_recipe:
          setup:
            - "BU AERO; diverse supplier with VERIFIED SELF_CERT covering 2026-02-05"
            - "Spend 100000 txn/pay 2026-02-05; GENERATED scorecard for 2026-Q1 shows direct diverse 100000"
            - "OPEN audit case (auditor-9) on the certification"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Self Cert Co", tax_id: "T-SCC", kind: "DIVERSE", contact_email: "s@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "SELF_CERT", certifying_body: "SELF", certificate_number: "SC-1", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 100000, transaction_date: "2026-02-05", payment_date: "2026-02-05" }
              as: DiversityAnalyst
            - call: "POST /api/v1/business-units/${bu_id}/scorecards"
              payload: { reporting_period: "2026-Q1", attribution_basis: "ACCRUAL" }
              as: DiversityAnalyst
              captures: { sc_id: $.data.id, sc_pre: $.data.direct_diverse_spend_cents }
            - call: "POST /api/v1/audit-cases"
              payload: { supplier_id: "${sup_id}", certification_id: "${cert_id}", reason: "DATA_QUALITY_FLAG" }
              as: Auditor
              as_user_id: auditor-9
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/audit-cases/${case_id}/record-outcome"
              payload: { outcome: "FAILED" }
              as: Auditor
              as_user_id: auditor-9
            - call: "GET /api/v1/scorecards/${sc_id}"
              payload: {}
              as: DiversityAnalyst
              captures: { sc_snapshot: $.data.direct_diverse_spend_cents }
          trigger:
            - call: "POST /api/v1/scorecards/${sc_id}/recompute"
              payload: {}
              as: DiversityAnalyst
              captures: { sc_post: $.data.direct_diverse_spend_cents, sc_total: $.data.total_spend_cents }
          assert:
            - "sc_pre == 100000 while the certification was VERIFIED"
            - "sc_snapshot == 100000 after the FAILED audit (snapshot not mutated by the cascade)"
            - "sc_post == 0 after recompute — REVOKED certifications never qualify"
            - "sc_total == 100000 (revocation does not change total spend)"

      - name: sourcing_award_depends_on_invitation_state
        grounds:
          - state_machines.SourcingEvent.OPEN_to_AWARDED
          - state_machines.BidderInvitation.INVITED_to_BID_SUBMITTED
          - errors[ERR_SUPPLIER_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Pair SourcingEvent x BidderInvitation: the award transition is rejected while the
          winner's invitation is INVITED, and succeeds for the same event, winner, and
          amount once that invitation flips to BID_SUBMITTED — the child entity's state
          gates the parent's transition.
        test_recipe:
          setup:
            - "BU AERO (lead-1); ACTIVE diverse supplier with VERIFIED MBE cert"
            - "OPEN event with required_diverse_bidders 0 and estimated_value_cents 100000; supplier invited (INVITED, not yet responded)"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Gate Co", tax_id: "T-GTE", kind: "DIVERSE", contact_email: "g@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-G", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/sourcing-events"
              payload: { business_unit_id: "${bu_id}", title: "Gate valves", estimated_value_cents: 100000, required_diverse_bidders: 0 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_id: $.data.id }
            - call: "POST /api/v1/sourcing-events/${ev_id}/open"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
            - call: "POST /api/v1/sourcing-events/${ev_id}/invitations"
              payload: { supplier_id: "${sup_id}" }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /api/v1/sourcing-events/${ev_id}/award"
              payload: { award_supplier_id: "${sup_id}", award_amount_cents: 90000 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { err: $.data.error_id }
            - call: "POST /api/v1/invitations/${inv_id}/respond"
              payload: { response: "BID_SUBMITTED" }
              as: BusinessUnitLead
              as_user_id: lead-1
            - call: "POST /api/v1/sourcing-events/${ev_id}/award"
              payload: { award_supplier_id: "${sup_id}", award_amount_cents: 90000 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_status: $.data.status }
          assert:
            - "First award fails: err == ERR_SUPPLIER_NOT_ELIGIBLE because the invitation is INVITED, not BID_SUBMITTED"
            - "After respond flips the invitation to BID_SUBMITTED, the identical award succeeds: ev_status == AWARDED"
            - "The invitation is WON after the award"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: certification_closed_window_boundary_overlap
        grounds:
          - state_machines.Certification.UNDER_REVIEW_to_VERIFIED
          - validations[priority=6]
          - errors[ERR_CERT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on Certification: windows share the boundary day
          2026-06-30 -> overlap rejected; a renewal starting the next day 2026-07-01 ->
          accepted. Adjacency is NOT a gap under inclusive semantics.
        test_recipe:
          setup:
            - "Clock set back to 2026-02-01 so both windows verify against it"
            - "Supplier with VERIFIED MBE cert covering 2026-01-01..2026-06-30"
            - "Second MBE cert submitted with valid_from 2026-06-30 (shared boundary day), UNDER_REVIEW"
            - "Third MBE cert submitted with valid_from 2026-07-01 (day after), UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DiversityAdmin
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Overlap Co", tax_id: "T-OVL", kind: "DIVERSE", contact_email: "o@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-1", valid_from: "2026-01-01", valid_to: "2026-06-30" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { c1: $.data.id }
            - call: "POST /api/v1/certifications/${c1}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${c1}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-2", valid_from: "2026-06-30", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { c2: $.data.id }
            - call: "POST /api/v1/certifications/${c2}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-3", valid_from: "2026-07-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { c3: $.data.id }
            - call: "POST /api/v1/certifications/${c3}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
          trigger:
            - call: "POST /api/v1/certifications/${c2}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { err: $.data.error_id }
            - call: "POST /api/v1/certifications/${c3}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { st3: $.data.status }
          assert:
            - "err == ERR_CERT_WINDOW_OVERLAP — [2026-01-01, 2026-06-30] and [2026-06-30, 2026-12-31] share the boundary day under closed-interval semantics"
            - "c2 remains UNDER_REVIEW after the rejection"
            - "st3 == VERIFIED — [2026-07-01, 2026-12-31] starts the day after the existing window ends, so no overlap"

      - name: engagement_half_open_window_with_buffer
        grounds:
          - validations[priority=6]
          - errors[ERR_ENGAGEMENT_OVERLAP]
          - entities.DevelopmentEngagement.fields.start_date
          - entities.DevelopmentEngagement.fields.end_date
        distinguishing_aspect: |
          Half-open interval + 30-day buffer semantics on DevelopmentEngagement: a new
          engagement starting 2026-07-29 (29 days after the existing one's 2026-06-30
          exclusive end) is rejected; starting exactly 2026-07-30 (end + 30 days) is
          accepted. Different geometry than the certification closed-window rule.
        test_recipe:
          setup:
            - "Supplier with an ENROLLED MENTORING engagement on half-open window [2026-03-01, 2026-06-30)"
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Mentee Co", tax_id: "T-MEN", kind: "DIVERSE", contact_email: "m@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/development-engagements"
              payload: { track: "MENTORING", start_date: "2026-03-01", end_date: "2026-06-30", mentor_name: "Mentor A", capacity_score_before: 40 }
              as: DiversityAnalyst
              captures: { eng1: $.data.id, eng1_status: $.data.status }
          trigger:
            - call: "POST /api/v1/suppliers/${sup_id}/development-engagements"
              payload: { track: "CAPABILITY_BUILDING", start_date: "2026-07-29", end_date: "2026-10-31", mentor_name: "Mentor B", capacity_score_before: 50 }
              as: DiversityAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /api/v1/suppliers/${sup_id}/development-engagements"
              payload: { track: "CAPABILITY_BUILDING", start_date: "2026-07-30", end_date: "2026-10-31", mentor_name: "Mentor B", capacity_score_before: 50 }
              as: DiversityAnalyst
              captures: { eng2: $.data.id, eng2_status: $.data.status }
          assert:
            - "eng1_status == ENROLLED on creation"
            - "err == ERR_ENGAGEMENT_OVERLAP — 2026-07-29 is less than 30 days after the existing window's exclusive end 2026-06-30"
            - "eng2_status == ENROLLED — start exactly at end_date + 30 days (2026-07-30) satisfies the buffer"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: spend_void_reimport_conserves_net_posted
        grounds:
          - state_machines.SpendRecord.POSTED_to_VOIDED
          - entities.BusinessUnit.fields.lifetime_imported_spend_cents
          - entities.BusinessUnit.fields.lifetime_voided_spend_cents
        distinguishing_aspect: |
          Conserved quantity = net posted spend cents: import 100000, void it, re-import
          100000 leaves lifetime_imported - lifetime_voided == 100000, exactly the value
          before the void/re-post pair; the lifetime counters themselves are monotonic
          (imported 200000, voided 100000).
        test_recipe:
          setup:
            - "BU AERO; a DIVERSE supplier (no certification needed — the invariant is about counters)"
            - "R1 imported for 100000 (net posted == 100000)"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Ledger Co", tax_id: "T-LED", kind: "DIVERSE", contact_email: "l@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 100000, transaction_date: "2026-02-01", payment_date: "2026-02-10" }
              as: DiversityAnalyst
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /api/v1/spend-records/${r1}/void"
              payload: {}
              as: DiversityAnalyst
              captures: { r1_status: $.data.status }
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 100000, transaction_date: "2026-02-01", payment_date: "2026-02-10" }
              as: DiversityAnalyst
              captures: { r2: $.data.id }
            - call: "GET /api/v1/business-units/${bu_id}"
              payload: {}
              as: DiversityAdmin
              captures: { imp: $.data.lifetime_imported_spend_cents, voided: $.data.lifetime_voided_spend_cents }
          assert:
            - "r1_status == VOIDED"
            - "imp == 200000 (both imports counted; void never decrements the imported counter)"
            - "voided == 100000"
            - "Invariant: imp - voided == 100000 == sum of amount_cents over POSTED records (only R2) — identical to the net posted spend before the void/re-post pair"

      - name: tier2_approval_supersession_conserves_single_approved
        grounds:
          - state_machines.Tier2Report.SUBMITTED_to_APPROVED
          - state_machines.Tier2Report.APPROVED_to_SUPERSEDED
          - entities.Scorecard.fields.tier2_diverse_spend_cents
        distinguishing_aspect: |
          Conserved quantity = cardinality of the APPROVED set per (prime, period):
          approving a corrected report supersedes the earlier one, so exactly one APPROVED
          report exists at all times and the scorecard's tier-2 roll-up reflects the sole
          APPROVED total (80000), never the sum of both (180000).
        test_recipe:
          setup:
            - "BU AERO; prime; diverse supplier with VERIFIED MBE cert covering 2026-03-31 (Q1 period end)"
            - "Report RA (100000 diverse cents) approved; scorecard generated showing tier2 100000"
            - "Report RB for the same prime + period (80000 diverse cents) submitted"
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Prime Build Inc", tax_id: "T-PB", kind: "PRIME", contact_email: "p@x.com" }
              as: DiversityAnalyst
              captures: { prime_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Diverse Parts Co", tax_id: "T-DP", kind: "DIVERSE", contact_email: "d@x.com" }
              as: DiversityAnalyst
              captures: { sD: $.data.id }
            - call: "POST /api/v1/suppliers/${sD}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-DP", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { certD: $.data.id }
            - call: "POST /api/v1/certifications/${certD}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
            - call: "POST /api/v1/certifications/${certD}/verify"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/tier-2-reports"
              payload:
                prime_supplier_id: ${prime_id}
                business_unit_id: ${bu_id}
                reporting_period: "2026-Q1"
                lines:
                  - { diverse_supplier_id: "${sD}", gross_subcontract_cents: 100000, diverse_share_pct: 100.00 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { repA: $.data.id }
            - call: "POST /api/v1/tier-2-reports/${repA}/submit"
              payload: {}
              as: PrimeContact
              as_user_id: ${prime_id}
            - call: "POST /api/v1/tier-2-reports/${repA}/approve"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
            - call: "POST /api/v1/business-units/${bu_id}/scorecards"
              payload: { reporting_period: "2026-Q1", attribution_basis: "ACCRUAL" }
              as: DiversityAnalyst
              captures: { sc_id: $.data.id, sc_t2_pre: $.data.tier2_diverse_spend_cents }
            - call: "POST /api/v1/tier-2-reports"
              payload:
                prime_supplier_id: ${prime_id}
                business_unit_id: ${bu_id}
                reporting_period: "2026-Q1"
                lines:
                  - { diverse_supplier_id: "${sD}", gross_subcontract_cents: 80000, diverse_share_pct: 100.00 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { repB: $.data.id }
            - call: "POST /api/v1/tier-2-reports/${repB}/submit"
              payload: {}
              as: PrimeContact
              as_user_id: ${prime_id}
          trigger:
            - call: "POST /api/v1/tier-2-reports/${repB}/approve"
              payload: {}
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { rb_status: $.data.status }
            - call: "GET /api/v1/tier-2-reports/${repA}"
              payload: {}
              as: DiversityAdmin
              captures: { ra_status: $.data.status }
            - call: "POST /api/v1/scorecards/${sc_id}/recompute"
              payload: {}
              as: DiversityAnalyst
              captures: { sc_t2_post: $.data.tier2_diverse_spend_cents }
          assert:
            - "rb_status == APPROVED and ra_status == SUPERSEDED"
            - "GET /api/v1/tier-2-reports?prime_supplier_id&reporting_period=2026-Q1&status=APPROVED returns total_count == 1 and that row's id == ${repB}"
            - "sc_t2_pre == 100000 and sc_t2_post == 80000 — the roll-up reflects the sole APPROVED report, not the 180000 sum"

