    input: [store_id, full_name, "window_cooldown_minutes?"]
    output: Picker
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/v1/pickers"
    description: "List pickers (filterable by store_id)"
    roles: [PlatformAdmin, StoreOps, Picker]
    code: 200
    input: ["store_id?"]
    output: "Picker[]"
    side_effects: []

  - method: GET
    path: "/v1/pickers/{pickerId}"
    description: "Get a picker"
    roles: [PlatformAdmin, StoreOps, Picker]
    code: 200
    input: []
    output: Picker
    side_effects: []

  # ---- Product ----
  - method: POST
    path: "/v1/products"
    description: "Create a product in a store catalog"
    roles: [PlatformAdmin, StoreOps]
    code: 201
    input: [store_id, sku, name, pricing_mode, unit_price_cents, "ebt_eligible?", "age_restricted?", "cold_chain?", "on_hand_qty?"]
    output: Product
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/v1/products"
    description: "List products (filterable by store_id, sku)"
    roles: [PlatformAdmin, StoreOps, Customer, Picker]
    code: 200
    input: ["store_id?", "sku?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/v1/products/{productId}"
    description: "Get a product"
    roles: [PlatformAdmin, StoreOps, Customer, Picker]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/v1/products/{productId}/discontinue"
    description: "Discontinue a product"
    roles: [PlatformAdmin, StoreOps]
    code: 200
    input: []
    output: Product
    side_effects: ["status=DISCONTINUED"]

  # ---- FulfillmentSlot ----
  - method: POST
    path: "/v1/slots"
    description: "Create a fulfillment slot; rejects window overlap with an existing slot of the same store and slot_type"
    roles: [PlatformAdmin, StoreOps]
    code: 201
    input: [store_id, slot_type, window_start, window_end, capacity]
    output: FulfillmentSlot
    side_effects: ["status=OPEN, booked_count=0"]

  - method: GET
    path: "/v1/slots"
    description: "List slots (filterable by store_id, slot_type)"
    roles: [PlatformAdmin, StoreOps, Customer]
    code: 200
    input: ["store_id?", "slot_type?"]
    output: "FulfillmentSlot[]"
    side_effects: []

  - method: GET
    path: "/v1/slots/{slotId}"
    description: "Get a slot"
    roles: [PlatformAdmin, StoreOps, Customer]
    code: 200
    input: []
    output: FulfillmentSlot
    side_effects: []

  - method: POST
    path: "/v1/slots/{slotId}/close"
    description: "Close a slot (blocks new placements)"
    roles: [PlatformAdmin, StoreOps]
    code: 200
    input: []
    output: FulfillmentSlot
    side_effects: ["status=CLOSED"]

  # ---- Order ----
  - method: POST
    path: "/v1/orders"
    description: "Place an order: books a slot (OCC on slot version), creates lines, computes estimated totals"
    roles: [Customer, StoreOps]
    code: 201
    input: [store_id, customer_id, slot_id, expected_slot_version, lines, "tip_cents?"]
    output: Order
    side_effects:
      - "create one OrderLine per lines[] entry; compute each estimated_line_cents"
      - "compute Order.estimated_total_cents, estimated_ebt_eligible_cents"
      - "FulfillmentSlot.booked_count += 1; increments FulfillmentSlot.version by 1; slot -> FULL if booked_count == capacity"
      - "fulfillment_status=PLACED, payment_status=AUTHORIZED"

  - method: GET
    path: "/v1/orders"
    description: "List orders (filterable by store_id, customer_id, slot_id, picker_id)"
    roles: [PlatformAdmin, StoreOps, Customer, Picker]
    code: 200
    input: ["store_id?", "customer_id?", "slot_id?", "picker_id?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/v1/orders/{orderId}"
    description: "Get an order"
    roles: [PlatformAdmin, StoreOps, Customer, Picker]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/v1/orders/{orderId}/claim"
    description: "Picker claims order; fulfillment_status PLACED -> PICKING; enforces picker window non-overlap"
    roles: [Picker]
    code: 200
    input: [window_start, window_end]
    output: Order
    side_effects: ["picker_id set, fulfillment_status=PICKING"]

  - method: POST
    path: "/v1/orders/{orderId}/stage"
    description: "Stage a picked order; PICKING -> STAGED; sets staged_at, recomputes final totals"
    roles: [Picker]
    code: 200
    input: []
    output: Order
    side_effects: ["staged_at set, fulfillment_status=STAGED, final totals recomputed"]

  - method: POST
    path: "/v1/orders/{orderId}/capture"
    description: "Capture payment; AUTHORIZED -> CAPTURED; runs split-tender allocation, debits EBT balance, creates Payment"
    roles: [StoreOps]
    code: 200
    input: []
    output: Order
    side_effects: ["ebt/card charged, snap balance debited, Payment created, payment_status=CAPTURED, net_captured_cents set"]

  - method: POST
    path: "/v1/orders/{orderId}/handoff"
    description: "Hand off a staged, captured order; STAGED -> HANDED_OFF; enforces age + cold-chain gates"
    roles: [StoreOps]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status=HANDED_OFF"]

  - method: POST
    path: "/v1/orders/{orderId}/cancel"
    description: "Cancel an order; cascades line cancellation, slot release (version bump), and payment void/refund"
    roles: [Customer, StoreOps]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status=CANCELLED, lines CANCELLED, slot booked_count decremented + version bumped, payment VOIDED or REFUNDED"]

  # ---- OrderLine ----
  - method: POST
    path: "/v1/order-lines"
    description: "Add a line to a PLACED order before claim (cart edit); computes estimated_line_cents"
    roles: [Customer, StoreOps]
    code: 201
    input: [order_id, product_id, requested_qty, "estimated_weight_kg?", "substitution_policy?"]
    output: OrderLine
    side_effects: ["status=PENDING, estimated_line_cents computed, Order.estimated totals recomputed"]

  - method: GET
    path: "/v1/order-lines"
    description: "List order lines (filterable by order_id, product_id)"
    roles: [PlatformAdmin, StoreOps, Customer, Picker]
    code: 200
    input: ["order_id?", "product_id?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/v1/order-lines/{lineId}"
    description: "Get an order line"
    roles: [PlatformAdmin, StoreOps, Customer, Picker]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: POST
    path: "/v1/order-lines/{lineId}/pick"
    description: "Mark a line PICKED; records picked_qty/actual_weight_kg; recomputes final_line_cents"
    roles: [Picker]
    code: 200
    input: ["picked_qty?", "actual_weight_kg?"]
    output: OrderLine
    side_effects: ["status=PICKED, final_line_cents recomputed"]

  - method: POST
    path: "/v1/order-lines/{lineId}/out-of-stock"
    description: "Mark a line OUT_OF_STOCK. From PENDING during PICKING: line contributes 0, no refund. From PICKED on a STAGED+captured order: refund cascade."
    roles: [Picker, StoreOps]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["status=OUT_OF_STOCK, final_line_cents=0; if PICKED+captured: Refund created + refunded_total/payment_status/net_captured recompute + final_total recompute"]

  # ---- Substitution ----
  - method: POST
    path: "/v1/substitutions"
    description: "Propose a substitute product for a PENDING line; computes substitute_line_cents"
    roles: [Picker]
    code: 201
    input: [order_line_id, substitute_product_id, substitute_qty, "substitute_weight_kg?"]
    output: Substitution
    side_effects: ["status=PROPOSED, substitute_line_cents computed"]

  - method: GET
    path: "/v1/substitutions"
    description: "List substitutions (filterable by order_line_id, substitute_product_id)"
    roles: [PlatformAdmin, StoreOps, Customer, Picker]
    code: 200
    input: ["order_line_id?", "substitute_product_id?"]
    output: "Substitution[]"
    side_effects: []

  - method: GET
    path: "/v1/substitutions/{subId}"
    description: "Get a substitution"
    roles: [PlatformAdmin, StoreOps, Customer, Picker]
    code: 200
    input: []
    output: Substitution
    side_effects: []

  - method: POST
    path: "/v1/substitutions/{subId}/accept"
    description: "Accept a proposed substitution; line -> SUBSTITUTED; enforces policy and price ceiling"
    roles: [Customer, Picker]
    code: 200
    input: []
    output: Substitution
    side_effects: ["status=ACCEPTED, line=SUBSTITUTED, final_line_cents set"]

  - method: POST
    path: "/v1/substitutions/{subId}/reject"
    description: "Reject a proposed substitution; line stays PENDING"
    roles: [Customer, Picker]
    code: 200
    input: []
    output: Substitution
    side_effects: ["status=REJECTED"]

  # ---- Payment (capture record discovery) ----
