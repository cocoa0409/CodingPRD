      - name: read_back_of_an_order_line_is_field_for_field_identical_to_its_creation_response
        claim_type: retrieval
        grounds:
          - endpoints.GET /order-lines/{lineId}
          - entities.OrderLine
          - endpoints.POST /customer-orders/{orderId}/lines
        distinguishing_aspect: "The single-resource GET is a pure read: its body matches the creation response field for field -- including the computed provisional price, the null final price and the initial status pair -- and issuing the same GET twice changes neither version nor updated_at, so no derived field is recomputed on read."
        test_recipe:
          setup:
            - "Route R1, AMBIENT zone A1, SKU AMB-1 (700 cents, 100 units), a BASIC customer and that customer's DRAFT order with no lines yet."
          setup_api_calls:
            - call: "POST /delivery-routes"
