# =============================================================================
# SCAFFOLD.yaml — Payer Contract Modeling & Underpayment Recovery
# Hospital managed care contracting benchmark seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Payer Contract Modeling & Underpayment Recovery (hospital managed care contracting): contract term abstraction & rate loading, expected reimbursement calculation per claim, variance detection & underpayment queue, appeal/collection with payer & escalation matrix, contract renegotiation modeling with volume mix, carve-out/stop-loss & outlier provision handling, silent-PPO & wrap-network identification, rate escalator & term expiration alerts

domain_name: payer-contract-underpayment
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency      # OCC on PayerContract.version for amendment/proposal create-with-supersede
    - cascading_side_effects      # amendment-application -> reprice -> variance -> case queue/restate chains
    - dual_variant_calculation    # PROSPECTIVE vs RETROSPECTIVE pricing; same_store vs mix_shifted modeling
    - rate_threshold_triggers     # variance queue threshold (max of abs/rel), volume tiers, stop-loss/outlier triggers
  entity_topology: flat           # all 15 entities are peers at /api/<collection>; links are FK fields
  state_machine_shape: parallel   # Claim carries two independent state dimensions; other entities cyclic/branching
  relationship_patterns:
    - one_to_many                 # Payer->PayerContract, PayerContract->ContractTerm/..., Claim->ClaimLine/Remittance
    - self_referential            # PayerContract.prior_contract_id (renewal chain); RateAmendment.supersedes_amendment_id
    - cross_aggregate             # Claim -> PayerContract / NetworkAgreement; Appeal -> UnderpaymentCase -> Claim
  role_model: segregation_of_duties  # amendment creator cannot approve own amendment; case claimer cannot write off own case
  consistency_model: immediate    # every mutation + cascade is atomic within the request/clock-sweep call

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities; flat topology, FK links)
# Date convention: all domain date fields are calendar dates (YYYY-MM-DD);
# the logical clock is a UTC datetime; "today" = UTC date part of the clock.
# =============================================================================
entities:
  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Payer organization legal name" }
      - { name: payer_type, type: enum, source: input, description: "COMMERCIAL | MEDICARE_ADVANTAGE | MEDICAID_MCO | WORKERS_COMP" }
      - { name: appeal_deadline_days, type: integer, source: input, default: 45, description: "Days allowed to file each appeal level, measured from the triggering event date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; owning payer" }
      - { name: contract_code, type: string, source: input, description: "Human code; unique per payer across all contracts" }
      - { name: effective_date, type: datetime, source: input, description: "First covered service date (calendar date, inclusive)" }
      - { name: expiration_date, type: datetime, source: input, description: "Last covered service date (calendar date, inclusive); must be >= effective_date" }
      - { name: prior_contract_id, type: string, source: input, default: null, description: "FK -> PayerContract.id; renewal-chain predecessor, same payer required" }
      - { name: payment_terms_days, type: integer, source: input, default: 30, description: "Payer payment terms in days" }
      - { name: underpayment_threshold_cents, type: integer, source: input, default: 5000, description: "Absolute variance floor that queues an underpayment case" }
      - { name: underpayment_threshold_bp, type: integer, source: input, default: 100, description: "Relative variance floor in basis points of expected reimbursement" }
      - { name: volume_tiers, type: array, source: input, default: [], description: "List of { service_category, min_annual_units, rate_adjustment_bp }; min_annual_units strictly increasing per service_category; rate_adjustment_bp in [-2000, 2000]" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | TERMINATED | SUPERSEDED" }
      - { name: open_underpayment_cents, type: integer, source: computed, description: "Sum of current_outstanding_cents over this contract's UnderpaymentCases with status NOT IN {RECOVERED, DENIED_FINAL, WRITTEN_OFF, WITHDRAWN}; derived at read, never stored, does not bump version" }

  - name: ContractTerm
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> PayerContract.id; owning contract" }
      - { name: service_category, type: enum, source: input, description: "INPATIENT_MEDICAL | INPATIENT_SURGICAL | OUTPATIENT_SURGERY | EMERGENCY | OBSERVATION | IMAGING | LAB; unique per contract" }
      - { name: rate_model, type: enum, source: input, description: "PER_DIEM | CASE_RATE | PERCENT_OF_CHARGE | DRG_BASE" }
      - { name: base_rate_cents, type: integer, source: input, default: null, description: "Per-diem day rate / case rate / DRG base rate; required unless rate_model = PERCENT_OF_CHARGE" }
      - { name: percent_of_charge_bp, type: integer, source: input, default: null, description: "Basis points of billed charge; required iff rate_model = PERCENT_OF_CHARGE" }

  - name: CarveOutProvision
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> PayerContract.id; owning contract" }
      - { name: carve_type, type: enum, source: input, description: "IMPLANT | HIGH_COST_DRUG | TRANSPLANT | NICU" }
      - { name: revenue_codes, type: array, source: input, description: "Non-empty list of revenue codes whose claim lines are carved out of base pricing" }
      - { name: rate_model, type: enum, source: input, description: "PERCENT_OF_CHARGE | INVOICE_COST_PLUS" }
      - { name: percent_bp, type: integer, source: input, default: null, description: "Basis points of line charge; required iff rate_model = PERCENT_OF_CHARGE" }
      - { name: invoice_markup_bp, type: integer, source: input, default: null, description: "Markup over ClaimLine.invoice_cost_cents; required iff rate_model = INVOICE_COST_PLUS" }
      - { name: max_cap_cents, type: integer, source: input, default: null, description: "Optional per-line cap applied after rounding" }

  - name: StopLossProvision
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> PayerContract.id; owning contract" }
      - { name: provision_type, type: enum, source: input, description: "STOP_LOSS (floor: pays percent of total charges) | OUTLIER (add-on: marginal percent of charges above threshold)" }
      - { name: service_category, type: enum, source: input, default: null, description: "Category the provision applies to; null = wildcard for all categories of the contract" }
      - { name: threshold_cents, type: integer, source: input, description: "Total billed charges trigger level (> 0)" }
      - { name: rate_bp, type: integer, source: input, description: "STOP_LOSS: percent of total charges paid; OUTLIER: marginal percent of (charges - threshold)" }

  - name: RateEscalator
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> PayerContract.id; owning contract" }
      - { name: effective_date, type: datetime, source: input, description: "First service date the escalator applies to; must lie within the contract term" }
      - { name: escalator_bp, type: integer, source: input, description: "Escalation in basis points (> 0)" }
      - { name: applies_to_category, type: enum, source: input, default: null, description: "Service category escalated; null = all categories" }
      - { name: compounding, type: boolean, source: input, default: true, description: "true: multiplies running multiplier; false: adds bp/10000 to running multiplier" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | APPLIED | VOIDED" }
      - { name: applied_date, type: datetime, source: system, default: null, description: "Date the clock sweep applied the escalator" }

  - name: RateAmendment
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> PayerContract.id; amended contract" }
      - { name: supersedes_amendment_id, type: string, source: input, default: null, description: "FK -> RateAmendment.id; prior amendment on the same contract this one replaces" }
      - { name: effective_date, type: datetime, source: input, description: "Date the amendment takes effect; must lie within the contract term" }
      - { name: retroactive_to_date, type: datetime, source: input, default: null, description: "Optional earlier date; claims with anchor >= this date are repriced when the amendment becomes EFFECTIVE" }
      - { name: term_overrides, type: array, source: input, description: "Non-empty list of { service_category, base_rate_cents?, percent_of_charge_bp? }; categories must exist as ContractTerms on the contract" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | EFFECTIVE | SUPERSEDED | VOIDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (segregation-of-duties anchor)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approver" }

  - name: NetworkAgreement
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; payer accessing the network" }
      - { name: network_name, type: string, source: input, description: "Wrap / PPO network name" }
      - { name: wrap_rate_bp, type: integer, source: input, description: "Basis points of billed charge paid under this wrap agreement (0 < bp <= 10000)" }
      - { name: precedence_rank, type: integer, source: input, description: "Lower rank wins tie-breaks after wrap_rate_bp DESC" }
      - { name: effective_date, type: datetime, source: input, description: "First covered service date (inclusive)" }
      - { name: expiration_date, type: datetime, source: input, description: "Last covered service date (inclusive)" }
      - { name: status, type: enum, source: system, description: "REGISTERED | VERIFIED | FLAGGED_SUSPECT | RETIRED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; adjudicating payer" }
      - { name: claim_number, type: string, source: input, description: "Unique per payer" }
      - { name: patient_account_number, type: string, source: input, description: "Hospital account reference" }
      - { name: service_category, type: enum, source: input, description: "Same enum as ContractTerm.service_category" }
      - { name: admission_date, type: datetime, source: input, description: "First service date (calendar date)" }
      - { name: discharge_date, type: datetime, source: input, description: "Last service date; >= admission_date; <= today; anchor date for all pricing windows" }
      - { name: total_billed_charges_cents, type: integer, source: input, description: "UB-04 total charges (>= 0); independent of line sum" }
      - { name: drg_weight, type: number, source: input, default: null, description: "3-decimal DRG weight; required at price time when the resolved term is DRG_BASE" }
      - { name: pricing_status, type: enum, source: system, description: "UNPRICED | PRICED | REPRICED (independent dimension 1)" }
      - { name: remittance_status, type: enum, source: system, description: "AWAITING_REMITTANCE | REMITTANCE_POSTED | VARIANCE_FLAGGED | RECONCILED (independent dimension 2)" }
      - { name: priced_contract_id, type: string, source: system, default: null, description: "FK -> PayerContract.id; contract selected by pricing resolution" }
      - { name: network_agreement_id, type: string, source: system, default: null, description: "FK -> NetworkAgreement.id; wrap agreement selected when no contract covers the claim" }
      - { name: network_flag, type: enum, source: system, description: "NONE | WRAP_CONFIRMED | SILENT_PPO_SUSPECT | OUT_OF_NETWORK" }
      - { name: pricing_variant, type: enum, source: system, default: null, description: "PROSPECTIVE (initial pricing) | RETROSPECTIVE (reprice under current amendments/escalators)" }
      - { name: expected_reimbursement_cents, type: integer, source: computed, description: "Most recent pricing result; null until priced" }
      - { name: original_expected_cents, type: integer, source: system, default: null, description: "Immutable result of the first successful pricing (PROSPECTIVE snapshot)" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Sum of paid_amount_cents over POSTED remittances only" }
      - { name: variance_cents, type: integer, source: computed, description: "expected_reimbursement_cents - paid_amount_cents (null until priced)" }
      - { name: pricing_trace, type: object, source: computed, description: "Step audit: { resolution_path, contract_id, term_id, base_amount_cents, escalated_amount_cents, volume_tier_bp, carve_out_cents, outlier_cents, stop_loss_cents, wrap_rate_bp, final_expected_cents }" }

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; parent claim (path parameter)" }
      - { name: revenue_code, type: string, source: input, description: "UB-04 revenue code" }
      - { name: service_date, type: datetime, source: input, description: "Line date; must lie within [claim.admission_date, claim.discharge_date] inclusive" }
      - { name: charge_cents, type: integer, source: input, description: "Line charge (>= 0)" }
      - { name: units, type: integer, source: input, default: 1, description: "Service units (>= 1)" }
      - { name: invoice_cost_cents, type: integer, source: input, default: null, description: "Acquisition cost; required only when matched by an INVOICE_COST_PLUS carve-out" }
      - { name: is_carve_out, type: boolean, source: computed, description: "True when the line's revenue_code matches a CarveOutProvision of the priced contract" }
      - { name: priced_amount_cents, type: integer, source: computed, description: "Per-line rounded priced amount (round_half_up) from the last pricing run" }

  - name: Remittance
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; paid claim" }
      - { name: appeal_id, type: string, source: system, default: null, description: "FK -> Appeal.id; set when source = APPEAL_RECOVERY" }
      - { name: paid_amount_cents, type: integer, source: input, description: "Amount paid (>= 0; zero-payment denials allowed)" }
      - { name: remittance_date, type: datetime, source: input, description: "Payer remittance date (<= today)" }
      - { name: adjustment_reason_code, type: enum, source: input, default: OTHER, description: "CONTRACTUAL | DENIAL | SILENT_PPO_DISCOUNT | APPEAL_RECOVERY | OTHER" }
      - { name: source, type: enum, source: system, description: "REMITTANCE_835 (payer remit) | APPEAL_RECOVERY (system-created on appeal outcome)" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED" }

  - name: UnderpaymentCase
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; at most one case per claim with status NOT IN {RECOVERED, DENIED_FINAL, WRITTEN_OFF, WITHDRAWN}" }
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; denormalized from claim" }
      - { name: contract_id, type: string, source: system, default: null, description: "FK -> PayerContract.id; denormalized from claim.priced_contract_id (null for wrap/out-of-network claims)" }
      - { name: original_variance_cents, type: integer, source: system, description: "Claim variance at case creation; restated to current claim variance on reprice-driven updates" }
      - { name: current_outstanding_cents, type: integer, source: computed, description: "original_variance_cents - recovered_to_date_cents - write_off_amount_cents" }
      - { name: recovered_to_date_cents, type: integer, source: computed, description: "Sum of Appeal.recovered_amount_cents for this case's appeals with outcome IN {PAID_IN_FULL, PARTIAL_PAYMENT}, net of reversals of their APPEAL_RECOVERY remittances" }
      - { name: write_off_amount_cents, type: integer, source: system, default: 0, description: "Amount written off (full outstanding only)" }
      - { name: escalation_level, type: integer, source: system, default: 0, description: "0 = no appeal yet; 1..4 = active appeal level" }
      - { name: status, type: enum, source: system, description: "QUEUED | UNDER_REVIEW | APPEAL_L1 | APPEAL_L2 | MEDIATION | ARBITRATION | RECOVERED | DENIED_FINAL | WRITTEN_OFF | WITHDRAWN" }
      - { name: claimed_by_user_id, type: string, source: system, default: null, description: "X-User-ID that picked the case up (segregation-of-duties anchor for write-off)" }
      - { name: queued_date, type: datetime, source: system, description: "Calendar date the case entered QUEUED" }
      - { name: appeal_filing_deadline, type: datetime, source: computed, description: "queued_date + payer.appeal_deadline_days; level-1 appeals must be created on or before this date" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> UnderpaymentCase.id; appealed case" }
      - { name: level, type: integer, source: input, description: "1 | 2 | 3 | 4; must match the level the case is eligible to file next" }
      - { name: channel, type: enum, source: system, description: "Derived from level: 1=INTERNAL_REVIEW, 2=FORMAL_APPEAL, 3=MEDIATION, 4=ARBITRATION" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | CLOSED | EXPIRED | WITHDRAWN" }
      - { name: outcome, type: enum, source: system, description: "PENDING | PAID_IN_FULL | PARTIAL_PAYMENT | DENIED | EXPIRED" }
      - { name: filed_date, type: datetime, source: system, default: null, description: "Date filed (clock date at file)" }
      - { name: response_due_date, type: datetime, source: computed, default: null, description: "filed_date + RESPONSE_DAYS[level]; EXPIRED when today > response_due_date" }
      - { name: outcome_recorded_date, type: datetime, source: system, default: null, description: "Date outcome recorded / expired; base date for the next level's filing window" }
      - { name: recovered_amount_cents, type: integer, source: system, default: 0, description: "Recovered amount; PAID_IN_FULL sets it to the case outstanding at outcome time" }

  - name: ContractProposal
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> PayerContract.id; contract being renegotiated" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Negotiation round; increments on each COUNTERED -> SUBMITTED resubmission" }
      - { name: proposed_terms, type: array, source: input, description: "Non-empty list of { service_category, rate_model, base_rate_cents?, percent_of_charge_bp? }; categories must exist as ContractTerms on the contract" }
      - { name: projected_volume_mix, type: array, source: input, description: "List of { service_category, annual_units }; units are patient-days for PER_DIEM, cases for CASE_RATE/DRG_BASE, charge cents for PERCENT_OF_CHARGE" }
      - { name: modeled_contract_version, type: integer, source: system, default: null, description: "PayerContract.version pinned at run_model time" }
      - { name: baseline_same_store_cents, type: integer, source: computed, default: null, description: "Annual revenue at trailing actual volume x current rates" }
      - { name: delta_same_store_cents, type: integer, source: computed, default: null, description: "Modeled minus baseline at trailing actual volume" }
      - { name: baseline_mix_shifted_cents, type: integer, source: computed, default: null, description: "Annual revenue at projected volume mix x current rates" }
      - { name: delta_mix_shifted_cents, type: integer, source: computed, default: null, description: "Modeled minus baseline at projected volume mix" }
      - { name: is_stale, type: boolean, source: computed, description: "true when status = MODELED/SUBMITTED/COUNTERED and modeled_contract_version != contract.version" }
      - { name: status, type: enum, source: system, description: "DRAFT | MODELED | SUBMITTED | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN" }

  - name: ContractAlert
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PayerContract.id; subject contract" }
      - { name: escalator_id, type: string, source: system, default: null, description: "FK -> RateEscalator.id; set for ESCALATOR_UPCOMING alerts" }
      - { name: amendment_id, type: string, source: system, default: null, description: "FK -> RateAmendment.id; set for AMENDMENT_EFFECTIVE alerts" }
      - { name: alert_type, type: enum, source: system, description: "TERM_EXPIRING_90 | TERM_EXPIRING_30 | TERM_EXPIRED | ESCALATOR_UPCOMING | AMENDMENT_EFFECTIVE" }
      - { name: trigger_date, type: datetime, source: system, description: "Calendar date the sweep generated the alert" }
      - { name: status, type: enum, source: system, description: "TRIGGERED | ACKNOWLEDGED | DISMISSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Payer
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/payers/{id}/deactivate"
        actor: ContractManager
        preconditions: []
        side_effects:
          - "Blocks subsequent claim creation and contract creation/activation for this payer (ERR_PAYER_INACTIVE)"

  - entity: PayerContract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/payer-contracts/{id}/activate"
        actor: ContractManager
        preconditions:
          - "Payer status = ACTIVE (ERR_PAYER_INACTIVE)"
          - "expiration_date > today (ERR_CONTRACT_WINDOW_INVALID)"
        side_effects:
          - "increments PayerContract.version by 1"
          - "If this contract's prior_contract_id references a contract in ACTIVE or SUSPENDED status, that contract transitions to SUPERSEDED (renewal cascade) and its version increments by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/payer-contracts/{id}/suspend"
        actor: ContractManager
        preconditions: []
        side_effects:
          - "increments PayerContract.version by 1"
          - "Suspension blocks amendment approval, escalator/term mutation and proposal submission; claim pricing continues under suspended contracts"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/payer-contracts/{id}/resume"
        actor: ContractManager
        preconditions:
          - "expiration_date > today (ERR_CONTRACT_WINDOW_INVALID)"
        side_effects:
          - "increments PayerContract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/payer-contracts/{id}/terminate"
        actor: ContractManager
        preconditions: []
        side_effects:
          - "increments PayerContract.version by 1"
          - "Claims with anchor dates inside the term remain priceable under the terminated contract (runout)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/payer-contracts/{id}/terminate"
        actor: ContractManager
        preconditions: []
        side_effects:
          - "increments PayerContract.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep when today > expiration_date)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PayerContract.version by 1"
          - "Creates ContractAlert TERM_EXPIRED"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a successor contract referencing this contract via prior_contract_id is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PayerContract.version by 1"

  - entity: RateAmendment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/rate-amendments/{id}/approve"
        actor: ContractManager
        preconditions:
          - "Contract status = ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "created_by_user_id != X-User-ID (ERR_SOD_AMENDMENT_SELF_APPROVE)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "increments RateAmendment.version by 1"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "system (clock sweep when effective_date <= today)"
        actor: system
        preconditions: []
        side_effects:
          - "increments RateAmendment.version by 1 and PayerContract.version by 1"
          - "Any other EFFECTIVE amendment on the same contract listed in this amendment's supersede chain transitions to SUPERSEDED (version +1)"
          - "Creates ContractAlert AMENDMENT_EFFECTIVE (deduped per amendment)"
          - "If retroactive_to_date is set: every Claim with priced_contract_id = this contract, pricing_status IN {PRICED, REPRICED}, and discharge_date >= retroactive_to_date is repriced RETROSPECTIVE (link 1 of the reprice cascade); each repriced claim recomputes variance and remittance_status (link 2); each variance flip creates a new QUEUED UnderpaymentCase or restates the active case's original/current outstanding (link 3)"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/rate-amendments/{id}/void OR system (a new amendment is created on the same contract, voiding the prior pending one)"
        actor: ContractManager | system
        preconditions: []
        side_effects:
          - "increments RateAmendment.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /api/rate-amendments/{id}/void OR system (a new amendment is created on the same contract, voiding the prior pending one)"
        actor: ContractManager | system
        preconditions: []
        side_effects:
          - "increments RateAmendment.version by 1"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (clock sweep applies a newer amendment whose supersedes_amendment_id chain reaches this amendment)"
        actor: system
        preconditions: []
        side_effects:
          - "increments RateAmendment.version by 1"
    note: "At most one pending (DRAFT or APPROVED) amendment per contract; creating a new amendment voids the prior pending one. EFFECTIVE amendments never lose effect retroactively; supersession only changes the 'latest' marker."

  - entity: RateEscalator
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: APPLIED
        trigger: "system (clock sweep when effective_date <= today)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> APPLIED, applied_date = today, version +1"
          - "Does NOT reprice existing claims on its own (escalators bind by service-date anchor at pricing time)"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /api/rate-escalators/{id}/void"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: APPLIED
        to: VOIDED
        trigger: "POST /api/rate-escalators/{id}/void"
        actor: ContractManager
        preconditions: []
        side_effects:
          - "version +1"
          - "Reprice cascade: every Claim with priced_contract_id = this escalator's contract, pricing_status IN {PRICED, REPRICED}, and discharge_date >= escalator.effective_date is repriced RETROSPECTIVE; variance and remittance_status recompute per claim; active UnderpaymentCases are restated and new cases are queued when variance crosses the threshold"

  - entity: NetworkAgreement
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: VERIFIED
        trigger: "POST /api/network-agreements/{id}/verify"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: FLAGGED_SUSPECT
        to: VERIFIED
        trigger: "POST /api/network-agreements/{id}/verify"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: VERIFIED
        to: FLAGGED_SUSPECT
        trigger: "POST /api/network-agreements/{id}/flag_suspect"
        actor: RevenueIntegrityAnalyst
        preconditions: []
        side_effects:
          - "version +1"
          - "Existing claims priced WRAP_CONFIRMED under this agreement are NOT auto-repriced; only future pricing runs see the new status"
      - from: REGISTERED
        to: RETIRED
        trigger: "POST /api/network-agreements/{id}/retire"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: VERIFIED
        to: RETIRED
        trigger: "POST /api/network-agreements/{id}/retire"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: FLAGGED_SUSPECT
        to: RETIRED
        trigger: "POST /api/network-agreements/{id}/retire"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]

  - entity: Claim
    dimension: pricing_status
    initial_state: UNPRICED
    terminal_states: []
    transitions:
      - from: UNPRICED
        to: PRICED
        trigger: "POST /api/claims/{id}/price"
        actor: RevenueIntegrityAnalyst
        preconditions:
          - "Claim has >= 1 ClaimLine (ERR_CLAIM_HAS_NO_LINES)"
          - "If the resolved contract term is DRG_BASE, claim.drg_weight is present (ERR_MISSING_DRG_WEIGHT)"
          - "If a contract covers the anchor date, a ContractTerm for claim.service_category must exist on it (ERR_NO_MATCHING_TERM)"
        side_effects:
          - "Runs expected_reimbursement (PROSPECTIVE variant); sets expected_reimbursement_cents, original_expected_cents, pricing_trace, pricing_variant=PROSPECTIVE"
          - "Resolves priced_contract_id / network_agreement_id / network_flag via pricing_contract_resolution"
          - "version +1"
      - from: PRICED
        to: REPRICED
        trigger: "POST /api/claims/{id}/reprice OR system (amendment-application or escalator-void reprice cascade)"
        actor: RevenueIntegrityAnalyst | system
        preconditions: []
        side_effects:
          - "Runs expected_reimbursement (RETROSPECTIVE variant); updates expected_reimbursement_cents and pricing_trace; original_expected_cents unchanged; pricing_variant=RETROSPECTIVE"
          - "variance_cents recomputed; remittance_status re-evaluated (RECONCILED <-> VARIANCE_FLAGGED flips allowed)"
          - "Active UnderpaymentCase restated (original_variance_cents := claim.variance_cents, outstanding recomputed); if no active case and variance >= queue threshold, a new QUEUED case is created"
          - "version +1"
      - from: REPRICED
        to: REPRICED
        trigger: "POST /api/claims/{id}/reprice OR system (reprice cascade)"
        actor: RevenueIntegrityAnalyst | system
        preconditions: []
        side_effects: ["same as PRICED -> REPRICED"]

  - entity: Claim
    dimension: remittance_status
    initial_state: AWAITING_REMITTANCE
    terminal_states: []
    transitions:
      - from: AWAITING_REMITTANCE
        to: REMITTANCE_POSTED
        trigger: "POST /api/remittances (first POSTED remittance on the claim)"
        actor: RevenueIntegrityAnalyst | system
        preconditions:
          - "Claim pricing_status IN {PRICED, REPRICED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "paid_amount_cents recomputed; immediately re-evaluates into VARIANCE_FLAGGED or RECONCILED"
      - from: REMITTANCE_POSTED
        to: VARIANCE_FLAGGED
        trigger: "system (after any paid/expected change: variance_cents >= queue threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "If no active UnderpaymentCase exists for the claim, one is created in QUEUED with original_variance_cents = variance_cents, queued_date = today, payer_id/contract_id denormalized from the claim"
          - "If an active case exists, it is restated (original_variance_cents := variance_cents; outstanding recomputed)"
      - from: REMITTANCE_POSTED
        to: RECONCILED
        trigger: "system (after any paid/expected change: variance_cents < queue threshold)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VARIANCE_FLAGGED
        to: RECONCILED
        trigger: "system (reprice or remittance reversal drops variance below the queue threshold)"
        actor: system
        preconditions: []
        side_effects: ["Active case, if any, is restated but never auto-closed"]
      - from: RECONCILED
        to: VARIANCE_FLAGGED
        trigger: "system (reprice or remittance reversal raises variance to >= the queue threshold)"
        actor: system
        preconditions: []
        side_effects: ["Same case creation/restatement side effects as REMITTANCE_POSTED -> VARIANCE_FLAGGED"]
      - from: VARIANCE_FLAGGED
        to: AWAITING_REMITTANCE
        trigger: "system (all POSTED remittances reversed, none remain)"
        actor: system
        preconditions: []
        side_effects: ["Active case is restated; when claim variance is recomputed against zero payments the case outstanding reflects full expected amount"]
      - from: RECONCILED
        to: AWAITING_REMITTANCE
        trigger: "system (all POSTED remittances reversed, none remain)"
        actor: system
        preconditions: []
        side_effects: []
    note: "REMITTANCE_POSTED is a transient observation state: the same mutation that sets it immediately re-evaluates variance and lands on VARIANCE_FLAGGED or RECONCILED. pricing_status and remittance_status evolve independently."

  - entity: Remittance
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /api/remittances/{id}/reverse"
        actor: FinanceDirector
        preconditions:
          - "If source = APPEAL_RECOVERY, the linked appeal's case must NOT be in a terminal status (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "claim.paid_amount_cents recomputed over remaining POSTED remittances (link 1 of reversal cascade)"
          - "claim.variance_cents and remittance_status re-evaluated (link 2)"
          - "Case consequences (link 3): restate active case; or create a new QUEUED case when variance >= threshold and no active case exists (including when the prior case is terminal RECOVERED); or drop remittance_status to AWAITING_REMITTANCE when no POSTED remittance remains"
          - "version +1"

  - entity: UnderpaymentCase
    initial_state: QUEUED
    terminal_states: [RECOVERED, DENIED_FINAL, WRITTEN_OFF, WITHDRAWN]
    transitions:
      - from: QUEUED
        to: UNDER_REVIEW
        trigger: "POST /api/underpayment-cases/{id}/pick_up"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions: []
        side_effects: ["claimed_by_user_id = X-User-ID", "version +1"]
      - from: UNDER_REVIEW
        to: APPEAL_L1
        trigger: "POST /api/appeals with level = 1"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions:
          - "level must equal case.escalation_level + 1 (progression), or equal case.escalation_level when the most recent appeal at that level is WITHDRAWN (refile); otherwise ERR_APPEAL_LEVEL_MISMATCH"
          - "No other appeal on this case in DRAFT or FILED (ERR_APPEAL_ALREADY_OPEN)"
          - "today <= case.appeal_filing_deadline (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: ["escalation_level = 1 (progression); unchanged on same-level refile", "version +1"]
      - from: APPEAL_L1
        to: APPEAL_L2
        trigger: "POST /api/appeals with level = 2"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions:
          - "level must equal case.escalation_level + 1 (progression), or equal case.escalation_level when the most recent appeal at that level is WITHDRAWN (refile); otherwise ERR_APPEAL_LEVEL_MISMATCH"
          - "No other appeal on this case in DRAFT or FILED (ERR_APPEAL_ALREADY_OPEN)"
          - "The case's most recent non-WITHDRAWN level-1 appeal has outcome IN {DENIED, EXPIRED, PARTIAL_PAYMENT} (ERR_ESCALATION_BLOCKED)"
          - "Filing window: when a qualifying level-1 outcome exists, today <= that appeal's outcome_recorded_date + payer.appeal_deadline_days; when no level-1 appeal has a recorded outcome the window check is vacuous and the escalation-evidence check decides (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: ["escalation_level = 2 (progression); unchanged on same-level refile", "version +1"]
      - from: APPEAL_L2
        to: MEDIATION
        trigger: "POST /api/appeals with level = 3"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions:
          - "level must equal case.escalation_level + 1 (progression), or equal case.escalation_level when the most recent appeal at that level is WITHDRAWN (refile); otherwise ERR_APPEAL_LEVEL_MISMATCH"
          - "No other appeal on this case in DRAFT or FILED (ERR_APPEAL_ALREADY_OPEN)"
          - "The case's most recent non-WITHDRAWN level-2 appeal has outcome IN {DENIED, EXPIRED, PARTIAL_PAYMENT} (ERR_ESCALATION_BLOCKED)"
          - "Filing window: when a qualifying level-2 outcome exists, today <= that appeal's outcome_recorded_date + payer.appeal_deadline_days; otherwise vacuous (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: ["escalation_level = 3 (progression); unchanged on same-level refile", "version +1"]
      - from: MEDIATION
        to: ARBITRATION
        trigger: "POST /api/appeals with level = 4"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions:
          - "level must equal case.escalation_level + 1 (progression), or equal case.escalation_level when the most recent appeal at that level is WITHDRAWN (refile); otherwise ERR_APPEAL_LEVEL_MISMATCH"
          - "No other appeal on this case in DRAFT or FILED (ERR_APPEAL_ALREADY_OPEN)"
          - "The case's most recent non-WITHDRAWN level-3 appeal has outcome IN {DENIED, EXPIRED, PARTIAL_PAYMENT} (ERR_ESCALATION_BLOCKED)"
          - "Filing window: when a qualifying level-3 outcome exists, today <= that appeal's outcome_recorded_date + payer.appeal_deadline_days; otherwise vacuous (ERR_APPEAL_WINDOW_CLOSED)"
          - "current_outstanding_cents >= ARBITRATION_MIN_OUTSTANDING_CENTS (ERR_ESCALATION_MIN_NOT_MET)"
        side_effects: ["escalation_level = 4 (progression); unchanged on same-level refile", "version +1"]
      - from: APPEAL_L1
        to: RECOVERED
        trigger: "system (level-1 appeal outcome PAID_IN_FULL, or any paid change drives current_outstanding_cents to 0)"
        actor: system
        preconditions: []
        side_effects: ["version +1"]
      - from: APPEAL_L2
        to: RECOVERED
        trigger: "system (level-2 appeal outcome PAID_IN_FULL, or outstanding reaches 0)"
        actor: system
        preconditions: []
        side_effects: ["version +1"]
      - from: MEDIATION
        to: RECOVERED
        trigger: "system (level-3 appeal outcome PAID_IN_FULL, or outstanding reaches 0)"
        actor: system
        preconditions: []
        side_effects: ["version +1"]
      - from: ARBITRATION
        to: RECOVERED
        trigger: "system (level-4 appeal outcome PAID_IN_FULL, or outstanding reaches 0)"
        actor: system
        preconditions: []
        side_effects: ["version +1"]
      - from: UNDER_REVIEW
        to: RECOVERED
        trigger: "system (a direct remittance or reprice drives current_outstanding_cents to 0 before any appeal)"
        actor: system
        preconditions: []
        side_effects: ["version +1"]
      - from: ARBITRATION
        to: DENIED_FINAL
        trigger: "system (level-4 appeal outcome DENIED, or level-4 appeal expires)"
        actor: system
        preconditions: []
        side_effects: ["version +1"]
      - from: UNDER_REVIEW
        to: WRITTEN_OFF
        trigger: "POST /api/underpayment-cases/{id}/write_off"
        actor: FinanceDirector
        preconditions:
          - "claimed_by_user_id != X-User-ID (ERR_SOD_WRITE_OFF_SELF)"
          - "amount_cents == current_outstanding_cents (ERR_WRITE_OFF_AMOUNT_MISMATCH)"
          - "current_outstanding_cents <= WRITE_OFF_DIRECTOR_CAP_CENTS (ERR_WRITE_OFF_CAP_EXCEEDED)"
        side_effects:
          - "write_off_amount_cents = amount_cents; current_outstanding_cents = 0"
          - "version +1"
      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /api/underpayment-cases/{id}/withdraw"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions: []
        side_effects: ["version +1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/underpayment-cases/{id}/withdraw"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions: []
        side_effects: ["version +1"]
    note: "Appeal creation is the escalation trigger. Refile at the current level is allowed only when the most recent appeal at that level is WITHDRAWN; progression requires the most recent non-WITHDRAWN prior-level appeal outcome IN {DENIED, EXPIRED, PARTIAL_PAYMENT}."

  - entity: Appeal
    initial_state: DRAFT
    terminal_states: [CLOSED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /api/appeals/{id}/file"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions: []
        side_effects:
          - "filed_date = today; response_due_date = filed_date + RESPONSE_DAYS[level]"
          - "version +1"
      - from: FILED
        to: CLOSED
        trigger: "POST /api/appeals/{id}/record_outcome"
        actor: RecoveryManager
        preconditions:
          - "outcome = PARTIAL_PAYMENT requires 0 < recovered_amount_cents < case.current_outstanding_cents (ERR_RECOVERY_AMOUNT_INVALID)"
        side_effects:
          - "outcome_recorded_date = today; version +1"
          - "PAID_IN_FULL: recovered_amount_cents = case.current_outstanding_cents; creates an APPEAL_RECOVERY Remittance on the claim for that amount; claim paid/variance recompute; case current_outstanding_cents -> 0 and case -> RECOVERED"
          - "PARTIAL_PAYMENT: recovered_amount_cents = input; creates an APPEAL_RECOVERY Remittance for recovered_amount_cents; claim paid/variance recompute; case outstanding reduced; case stays at its current level"
          - "DENIED: no remittance; if level = 4 the case -> DENIED_FINAL"
      - from: FILED
        to: EXPIRED
        trigger: "system (clock sweep when today > response_due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "outcome = EXPIRED; outcome_recorded_date = today; version +1"
          - "if level = 4 the case -> DENIED_FINAL"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/appeals/{id}/withdraw"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions: []
        side_effects: ["version +1; case stays at its current level and may file a fresh appeal at the same level"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /api/appeals/{id}/withdraw"
        actor: RevenueIntegrityAnalyst | RecoveryManager
        preconditions: []
        side_effects: ["version +1; case stays at its current level and may file a fresh appeal at the same level"]

  - entity: ContractProposal
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: MODELED
        trigger: "POST /api/contract-proposals/{id}/run_model"
        actor: ContractAnalyst
        preconditions: []
        side_effects:
          - "Runs proposal_volume_modeling; sets baseline_same_store_cents, delta_same_store_cents, baseline_mix_shifted_cents, delta_mix_shifted_cents"
          - "modeled_contract_version = contract.version; version +1"
      - from: MODELED
        to: SUBMITTED
        trigger: "POST /api/contract-proposals/{id}/submit"
        actor: ContractManager
        preconditions:
          - "Contract status = ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "is_stale = false (ERR_PROPOSAL_STALE)"
        side_effects: ["version +1"]
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /api/contract-proposals/{id}/record_counter"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /api/contract-proposals/{id}/submit"
        actor: ContractManager
        preconditions:
          - "Contract status = ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "is_stale = false (ERR_PROPOSAL_STALE)"
        side_effects: ["round_number += 1", "version +1"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/contract-proposals/{id}/accept"
        actor: FinanceDirector
        preconditions:
          - "is_stale = false (ERR_PROPOSAL_STALE)"
        side_effects:
          - "Creates the successor PayerContract in DRAFT: contract_code = input successor_contract_code, effective_date = input successor_effective_date, expiration_date = input successor_expiration_date, prior_contract_id = this contract, thresholds/volume_tiers copied from this contract, and one ContractTerm per proposed_terms entry"
          - "version +1"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /api/contract-proposals/{id}/accept"
        actor: FinanceDirector
        preconditions:
          - "is_stale = false (ERR_PROPOSAL_STALE)"
        side_effects: ["same successor-contract creation as SUBMITTED -> ACCEPTED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/contract-proposals/{id}/reject"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /api/contract-proposals/{id}/reject"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/contract-proposals/{id}/withdraw OR system (a new proposal is created for the same contract, withdrawing the prior open one)"
        actor: ContractManager | ContractAnalyst | system
        preconditions: []
        side_effects: ["version +1"]
      - from: MODELED
        to: WITHDRAWN
        trigger: "POST /api/contract-proposals/{id}/withdraw OR system (superseded by a newly created proposal on the same contract)"
        actor: ContractManager | ContractAnalyst | system
        preconditions: []
        side_effects: ["version +1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/contract-proposals/{id}/withdraw OR system (superseded by a newly created proposal on the same contract)"
        actor: ContractManager | ContractAnalyst | system
        preconditions: []
        side_effects: ["version +1"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /api/contract-proposals/{id}/withdraw OR system (superseded by a newly created proposal on the same contract)"
        actor: ContractManager | ContractAnalyst | system
        preconditions: []
        side_effects: ["version +1"]

  - entity: ContractAlert
    initial_state: TRIGGERED
    terminal_states: [ACKNOWLEDGED, DISMISSED]
    transitions:
      - from: TRIGGERED
        to: ACKNOWLEDGED
        trigger: "POST /api/contract-alerts/{id}/acknowledge"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: TRIGGERED
        to: DISMISSED
        trigger: "POST /api/contract-alerts/{id}/dismiss"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]
      - from: ACKNOWLEDGED
        to: DISMISSED
        trigger: "POST /api/contract-alerts/{id}/dismiss"
        actor: ContractManager
        preconditions: []
        side_effects: ["version +1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on PayerContract.version only)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-contract
    parent_entity: PayerContract
    write_endpoint: "POST /api/rate-amendments"
    occ_field: "expected_contract_version"
    description: |
      Creating a RateAmendment against a PayerContract whose version has advanced
      since the client last observed it is rejected. A successful create voids the
      contract's prior pending amendment and bumps the contract version, so a
      second create carrying the older observed version is working from stale
      contract state and must be refused.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: proposal-create-stale-contract
    parent_entity: PayerContract
    write_endpoint: "POST /api/contract-proposals"
    occ_field: "expected_contract_version"
    description: |
      Creating a ContractProposal against a PayerContract whose version has
      advanced since the client last observed it is rejected. A successful create
      withdraws the contract's prior open proposal and bumps the contract
      version, so a second create carrying the older observed version is working
      from stale contract state and must be refused.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. round_half_up to whole cents at every pinned
# rounding point. "anchor" = claim.discharge_date. "today" = UTC date of clock.
# =============================================================================
calculations:
  - name: pricing_contract_resolution
    trigger: "Claim price / reprice"
    algorithm: constraint_propagation
    formula: |
      Step 1 (contract path): candidates = PayerContracts with payer_id = claim.payer_id,
        status != DRAFT, effective_date <= anchor <= expiration_date.
        Rank: effective_date DESC; tie-break created_at ASC. Winner = first.
        A direct contract ALWAYS beats every network agreement.
      Step 2 (wrap path, only when step 1 is empty): candidates = NetworkAgreements
        with payer_id = claim.payer_id, status = VERIFIED,
        effective_date <= anchor <= expiration_date.
        Rank: wrap_rate_bp DESC, then precedence_rank ASC, then created_at ASC.
        Winner -> network_flag = WRAP_CONFIRMED, network_agreement_id = winner.
      Step 3 (suspect path, only when steps 1-2 are empty): if any NetworkAgreement
        matches payer_id + date window with status IN {REGISTERED, FLAGGED_SUSPECT}
        -> network_flag = SILENT_PPO_SUSPECT; expected = total_billed_charges_cents
        (no discount is entitled).
      Step 4 (otherwise): network_flag = OUT_OF_NETWORK;
        expected = total_billed_charges_cents.
      When network_flag = NONE, priced_contract_id = step-1 winner and
        network_agreement_id = null; otherwise priced_contract_id = null.
    input_set: "Claim being priced; payer's PayerContracts and NetworkAgreements"
    constants:
      SELECTION_RULE_CONTRACT: "effective_date DESC, created_at ASC"
      SELECTION_RULE_WRAP: "wrap_rate_bp DESC, precedence_rank ASC, created_at ASC"
    precision: "integer cents"
    variants: []

  - name: amendment_rate_resolution
    trigger: "Any rate lookup during pricing or proposal modeling"
    algorithm: chronological
    formula: |
      For a contract + service_category + anchor date d, the effective rate fields are the
      ContractTerm's base values overridden by RateAmendments of the contract with
      status = EFFECTIVE whose applicability date <= d, where
        applicability_date = retroactive_to_date when set, else effective_date.
      When several EFFECTIVE amendments override the same category at date d, the one with
      the greatest applicability_date wins; tie-break: created_at ASC.
      Amendment overrides REPLACE base_rate_cents and/or percent_of_charge_bp field-by-field
      (fields absent from term_overrides keep the term's value).
      Escalators always apply ON TOP of the amended base (amendment first, escalator second).
    input_set: "ContractTerm; EFFECTIVE RateAmendments of the contract"
    constants:
      TIE_BREAK: "created_at ASC"
    precision: "integer cents"
    variants: []

  - name: base_expected_amount
    trigger: "Claim price / reprice (CONTRACT resolution path only)"
    algorithm: tiered_pricing
    formula: |
      term = ContractTerm on resolved contract with service_category = claim.service_category,
      with rate fields resolved through amendment_rate_resolution at the claim's anchor date.
      Dispatch on term.rate_model:
        PER_DIEM: covered_days = max(1, (discharge_date - admission_date) in calendar days);
          raw per-day amount = term.base_rate_cents (escalation applied per-day, see
          escalator_adjustment).
        CASE_RATE: base = term.base_rate_cents (per claim).
        DRG_BASE: base = round_half_up(term.base_rate_cents * claim.drg_weight).
        PERCENT_OF_CHARGE: per-line over NON-carve-out lines:
          line_amount = round_half_up(line.charge_cents * term.percent_of_charge_bp / 10000);
          base = sum(line_amount).  # PINNED: round per line, THEN sum (never sum-then-round)
      Carve-out-eligible lines (revenue_code matches a CarveOutProvision) are EXCLUDED
      from the PERCENT_OF_CHARGE base; they price via carve_out_pricing instead.
      For PER_DIEM / CASE_RATE / DRG_BASE the base is claim-level; carve-outs ADD on top.
    input_set: "Resolved ContractTerm; claim lines; claim.drg_weight for DRG_BASE"
    constants:
      MIN_COVERED_DAYS: 1
    precision: "integer cents, round_half_up per pinned rounding point"
    variants:
      - name: line_level_percent
        when: "rate_model = PERCENT_OF_CHARGE"
        difference: "round each line to cents then sum; differs from round(sum * bp) by up to (line_count-1) cents"
      - name: claim_level_flat
        when: "rate_model IN {PER_DIEM, CASE_RATE, DRG_BASE}"
        difference: "single claim-level amount; lines only contribute carve-outs"

  - name: escalator_adjustment
    trigger: "Claim price / reprice after base_expected_amount (CONTRACT path)"
    algorithm: chronological
    formula: |
      applicable = RateEscalators on the resolved contract with status = APPLIED and
        (applies_to_category IS NULL OR applies_to_category = claim.service_category),
        processed in effective_date ASC order.
      Running multiplier m starts at 1. For each escalator in order:
        compounding = true:  m = m * (1 + escalator_bp / 10000)
        compounding = false: m = m + escalator_bp / 10000
      PER_DIEM proration (mid-stay effective dates): each calendar day d of the stay
        [admission_date, discharge_date) gets its OWN multiplier m_d computed over only
        those escalators with effective_date <= d; the day rate is
        round_half_up(base_rate_cents * m_d); base-with-escalation = sum of day rates.
      Non-PER_DIEM: escalated = round_half_up(base * m) with m evaluated at anchor.
    input_set: "APPLIED RateEscalators of the resolved contract; claim stay dates"
    constants:
      BP_DENOMINATOR: 10000
    precision: "integer cents, round_half_up per day (PER_DIEM) or once (other models)"
    variants: []

  - name: volume_tier_adjustment
    trigger: "Claim price / reprice after escalator_adjustment (CONTRACT path)"
    algorithm: threshold
    formula: |
      tier_set = contract.volume_tiers entries with service_category = claim.service_category.
      Window W = [anchor - 364 days, anchor] inclusive.
      Trailing units U over Claims with priced_contract_id = this contract,
        pricing_status IN {PRICED, REPRICED}, service_category = claim's category,
        discharge_date IN W, EXCLUDING the claim currently being priced:
        PER_DIEM -> U = sum of covered_days; CASE_RATE / DRG_BASE -> U = count of claims;
        PERCENT_OF_CHARGE -> U = sum of total_billed_charges_cents.
      Selected tier = entry with the greatest min_annual_units such that U >= min_annual_units
        (inclusive boundary: U == min_annual_units SELECTS the tier); none -> no adjustment.
      tiered = round_half_up(escalated * (1 + rate_adjustment_bp / 10000)).
    input_set: "Priced claims of the same contract + category inside the trailing window"
    constants:
      WINDOW_DAYS: 364
      BOUNDARY: "inclusive (>=)"
    precision: "integer cents, round_half_up once"
    variants: []

  - name: carve_out_pricing
    trigger: "Claim price / reprice after volume_tier_adjustment (CONTRACT path)"
    algorithm: aggregation
    formula: |
      For each claim line whose revenue_code appears in some CarveOutProvision of the
      resolved contract (line.is_carve_out = true):
        PERCENT_OF_CHARGE: raw = line.charge_cents * provision.percent_bp / 10000
        INVOICE_COST_PLUS: raw = line.invoice_cost_cents * (1 + provision.invoice_markup_bp / 10000)
          (line.invoice_cost_cents missing -> ERR_INVALID_REQUEST at price time)
        line_amount = round_half_up(raw); if provision.max_cap_cents set:
          line_amount = min(line_amount, provision.max_cap_cents)   # cap per line
      carve_out_cents = sum(line_amount)   # PINNED: per-line round-then-sum
      A line matching multiple provisions uses the provision whose CarveOutProvision.created_at
      is earliest; the line is counted once.
    input_set: "Claim lines; CarveOutProvisions of the resolved contract"
    constants: {}
    precision: "integer cents, round_half_up per line before summing"
    variants: []

  - name: stop_loss_outlier_overlay
    trigger: "Claim price / reprice after carve_out_pricing (CONTRACT path)"
    algorithm: threshold
    formula: |
      provisions = StopLossProvisions of the resolved contract whose service_category is
        NULL or equals claim.service_category.
      PINNED EVALUATION ORDER:
        (1) outlier: for the OUTLIER provision (at most one applies; category-specific beats
            wildcard), if total_billed_charges_cents >= threshold_cents:
            outlier_cents = round_half_up((total_billed_charges_cents - threshold_cents) * rate_bp / 10000)
            else outlier_cents = 0.
        (2) subtotal = tiered_base + carve_out_cents + outlier_cents.
        (3) stop-loss: for the STOP_LOSS provision (category-specific beats wildcard), if
            total_billed_charges_cents >= threshold_cents:
            stop_loss_cents = round_half_up(total_billed_charges_cents * rate_bp / 10000)
            final = max(subtotal, stop_loss_cents)
            else final = subtotal.
      Boundary is INCLUSIVE (>=) for both provision types.
    input_set: "Claim; StopLossProvisions of the resolved contract"
    constants:
      BOUNDARY: "inclusive (>=)"
    precision: "integer cents, round_half_up at each provision"
    variants: []

  - name: wrap_network_pricing
    trigger: "Claim price / reprice (WRAP_CONFIRMED resolution path only)"
    algorithm: tiered_pricing
    formula: |
      Per line: line_amount = round_half_up(line.charge_cents * agreement.wrap_rate_bp / 10000);
      expected = sum(line_amount).   # same round-per-line-then-sum pin as base_expected_amount
      No escalators, tiers, carve-outs, or stop-loss apply on the wrap path.
    input_set: "Claim lines; selected NetworkAgreement"
    constants: {}
    precision: "integer cents, round_half_up per line"
    variants: []

  - name: expected_reimbursement
    trigger: "Claim price / reprice (orchestrates the pricing chain)"
    algorithm: tiered_pricing
    formula: |
      resolution = pricing_contract_resolution(claim)
      if resolution in {SILENT_PPO_SUSPECT, OUT_OF_NETWORK}: expected = total_billed_charges_cents
      if resolution = WRAP_CONFIRMED: expected = wrap_network_pricing(claim)
      if resolution = CONTRACT:
        base = base_expected_amount(claim)
        escalated = escalator_adjustment(base, claim)
        tiered = volume_tier_adjustment(escalated, claim)
        carve = carve_out_pricing(claim)
        expected = stop_loss_outlier_overlay(tiered, carve, claim)
      pricing_trace records every intermediate amount.
    input_set: "Claim + lines; contract graph; network agreements"
    constants: {}
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: PROSPECTIVE
        when: "initial POST /api/claims/{id}/price"
        difference: "prices with the amendments/escalators effective at pricing time; result frozen into original_expected_cents and never overwritten"
      - name: RETROSPECTIVE
        when: "POST /api/claims/{id}/reprice or amendment/escalator cascade"
        difference: "prices with the CURRENT amendment chain (retroactive overrides reach back to retroactive_to_date) and current APPLIED escalators; overwrites expected_reimbursement_cents but never original_expected_cents; identical claim data yields a different number whenever the effective rate set changed between the two runs"

  - name: variance_and_queue_threshold
    trigger: "Any change to claim expected or paid (price, reprice, remittance post/reverse, appeal recovery)"
    algorithm: threshold
    formula: |
      variance_cents = expected_reimbursement_cents - paid_amount_cents
      threshold = max(contract.underpayment_threshold_cents,
                      round_half_up(expected_reimbursement_cents * contract.underpayment_threshold_bp / 10000))
      (wrap / silent-PPO / out-of-network claims: threshold = max(5000, round_half_up(expected * 100 / 10000)) — system defaults)
      UNDERPAYMENT iff variance_cents >= threshold (inclusive boundary queues the case).
      variance_cents < threshold (including negative overpayment) -> RECONCILED, no case.
    input_set: "The claim and its priced contract (or system defaults)"
    constants:
      DEFAULT_THRESHOLD_CENTS: 5000
      DEFAULT_THRESHOLD_BP: 100
      BOUNDARY: "inclusive (>=)"
    precision: "integer cents, round_half_up on the relative leg"
    variants: []

  - name: case_outstanding_recompute
    trigger: "Appeal outcome recorded; APPEAL_RECOVERY remittance reversed; claim reprice or variance change on a claim with an active case; write_off"
    algorithm: aggregation
    formula: |
      recovered_to_date_cents = sum over the case's appeals with outcome IN
        {PAID_IN_FULL, PARTIAL_PAYMENT} of appeal.recovered_amount_cents,
        MINUS the paid_amount_cents of every REVERSED APPEAL_RECOVERY remittance
        linked to those appeals (a reversal cancels its recovery).
      On reprice/variance restatement: original_variance_cents := claim.variance_cents.
      current_outstanding_cents = original_variance_cents - recovered_to_date_cents - write_off_amount_cents
      INVARIANT (case money ledger): for every case in any status,
        original_variance_cents == current_outstanding_cents + recovered_to_date_cents + write_off_amount_cents
      Case auto-transitions to RECOVERED exactly when current_outstanding_cents = 0 is
      reached by a payment/recovery (not by write-off, which uses WRITTEN_OFF).
    input_set: "The case, its appeals, their remittances"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: appeal_response_deadline
    trigger: "Appeal file; escalation eligibility check; clock sweep expiry"
    algorithm: chronological
    formula: |
      channel(level): 1 -> INTERNAL_REVIEW, 2 -> FORMAL_APPEAL, 3 -> MEDIATION, 4 -> ARBITRATION.
      response_due_date = filed_date + RESPONSE_DAYS[level] (calendar days).
      EXPIRED when today > response_due_date (the due date itself is still timely).
      Level-1 filing window: today <= case.queued_date + payer.appeal_deadline_days.
      Level-n (n > 1) filing window: today <= level-(n-1) appeal.outcome_recorded_date
        + payer.appeal_deadline_days.
    input_set: "Appeal; case; payer"
    constants:
      RESPONSE_DAYS_LEVEL_1: 30
      RESPONSE_DAYS_LEVEL_2: 30
      RESPONSE_DAYS_LEVEL_3: 45
      RESPONSE_DAYS_LEVEL_4: 60
      ARBITRATION_MIN_OUTSTANDING_CENTS: 100000
      WRITE_OFF_DIRECTOR_CAP_CENTS: 250000
    precision: "calendar dates"
    variants: []

  - name: proposal_volume_modeling
    trigger: "POST /api/contract-proposals/{id}/run_model"
    algorithm: forward_looking
    formula: |
      Window W = [today - 364 days, today]. For each service_category c with a ContractTerm
      on the contract, trailing units T[c] over claims priced under the contract with
      discharge_date IN W and pricing_status IN {PRICED, REPRICED}:
        PER_DIEM -> sum covered_days; CASE_RATE / DRG_BASE -> claim count;
        PERCENT_OF_CHARGE -> sum total_billed_charges_cents.
      current_unit(c) = rate effective at today (term base resolved through
        amendment_rate_resolution at anchor = today, incl. APPLIED escalators per
        escalator_adjustment; DRG_BASE evaluated at weight 1.000).
      proposed_unit(c) = proposed_terms entry for c if present, else current_unit(c).
      mix(c) = projected_volume_mix entry for c if present, else T[c].
      SAME_STORE:   baseline = sum_c T[c] * current_unit(c);
                    modeled  = sum_c T[c] * proposed_unit(c);
                    delta_same_store_cents = modeled - baseline (stored with baseline_same_store_cents).
      MIX_SHIFTED:  baseline = sum_c mix(c) * current_unit(c);
                    modeled  = sum_c mix(c) * proposed_unit(c);
                    delta_mix_shifted_cents = modeled - baseline (stored with baseline_mix_shifted_cents).
      Both variants run on identical inputs and are stored side by side; they differ
      whenever projected mix differs from trailing actuals.
    input_set: "Contract, its terms and APPLIED escalators, trailing priced claims, proposal payload"
    constants:
      WINDOW_DAYS: 364
      DRG_NORMALIZED_WEIGHT: "1.000"
    precision: "integer cents, round_half_up per category product before summing"
    variants:
      - name: same_store
        when: "always computed"
        difference: "holds volume at trailing actuals on both sides; isolates the pure rate effect"
      - name: mix_shifted
        when: "always computed"
        difference: "applies the projected volume mix on both sides; conflates rate and volume-mix effects"

  - name: clock_sweep
    trigger: "Server startup (at the default clock 2026-08-01T00:00:00Z) and every POST /api/_clock/set_current_utc"
    algorithm: chronological
    formula: |
      PINNED SWEEP ORDER (each step completes before the next):
      (1) RateEscalators SCHEDULED with effective_date <= today -> APPLIED (applied_date = today).
      (2) RateAmendments APPROVED with effective_date <= today -> EFFECTIVE, oldest
          effective_date ASC, tie-break created_at ASC; each application supersedes the
          amendments in its supersede chain, emits AMENDMENT_EFFECTIVE, and runs the
          retroactive reprice cascade when retroactive_to_date is set.
      (3) Appeals FILED with today > response_due_date -> EXPIRED (level 4 also drives
          the case to DENIED_FINAL).
      (4) PayerContracts ACTIVE with today > expiration_date -> EXPIRED (+ TERM_EXPIRED alert).
      (5) Alert generation (deduped; never duplicates an existing alert of the same key):
          TERM_EXPIRING_90: contract ACTIVE/SUSPENDED and 0 <= expiration_date - today <= 90
            (key: contract_id + alert_type).
          TERM_EXPIRING_30: same with 0 <= expiration_date - today <= 30
            (both alerts fire when inside 30 days).
          ESCALATOR_UPCOMING: escalator SCHEDULED and 0 <= effective_date - today <= 30
            (key: contract_id + alert_type + escalator_id).
          AMENDMENT_EFFECTIVE: emitted in step 2 (key: contract_id + alert_type + amendment_id).
          TERM_EXPIRED: emitted in step 4 (key: contract_id + alert_type).
      Backward clock moves are permitted; all steps are idempotent and dedupe keys prevent
      duplicate alerts.
    input_set: "All escalators, amendments, appeals, contracts, alerts"
    constants:
      EXPIRING_90_DAYS: 90
      EXPIRING_30_DAYS: 30
      ESCALATOR_UPCOMING_DAYS: 30
      BOUNDARY: "inclusive (<= days remaining) for alert windows; expiry when today > date"
    precision: "calendar dates"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first matching failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The caller's role must appear in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present; enum values valid; integers in range (amounts >= 0, bp in (0, 10000] where applicable); dates well-formed; effective_date <= expiration_date; admission_date <= discharge_date; discharge_date and remittance_date not after today; unknown body fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "Path and body resource ids must exist (payer, contract, term, provision, escalator, amendment, agreement, claim, case, appeal, proposal, alert)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_referential
    check: "OCC: expected_contract_version must equal the contract's current version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /api/rate-amendments; POST /api/contract-proposals"
  - priority: 6
    category: state
    check: "Target entity must be in a valid from-state for the requested transition (incl. claim priced before remittance; case under review for write-off/level-1 appeal; appeal DRAFT/FILED guards; proposal run_model/submit/accept guards; terminal states reject every action). Also: direct term/carve-out/stop-loss creation requires contract DRAFT (ERR_CONTRACT_NOT_DRAFT); escalator creation requires contract DRAFT or ACTIVE; amendment creation requires contract ACTIVE or SUSPENDED; amendment approval and proposal submission require contract ACTIVE (ERR_CONTRACT_NOT_ACTIVE); proposal submit/accept requires is_stale = false (ERR_PROPOSAL_STALE)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_CONTRACT_NOT_DRAFT | ERR_CONTRACT_NOT_ACTIVE | ERR_PROPOSAL_STALE"
    http_status: 409
    applies_to: "all transition and config-creation endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: amendment approver must differ from amendment creator; write-off approver must differ from the case's claimed_by_user_id"
    error_id: "ERR_SOD_AMENDMENT_SELF_APPROVE | ERR_SOD_WRITE_OFF_SELF"
    http_status: 409
    applies_to: "POST /api/rate-amendments/{id}/approve; POST /api/underpayment-cases/{id}/write_off"
  - priority: 8
    category: business_referential
    check: "Cross-entity reference consistency: payer must be ACTIVE for claim/contract creation and contract activation (ERR_PAYER_INACTIVE); prior_contract_id must belong to the same payer (ERR_PRIOR_CONTRACT_MISMATCH); supersedes_amendment_id must belong to the same contract (ERR_AMENDMENT_SUPERSEDE_MISMATCH); appeal level must equal the level the case is eligible to file next (ERR_APPEAL_LEVEL_MISMATCH); resolved contract lacking the claim's service_category term (ERR_NO_MATCHING_TERM)"
    error_id: "ERR_PAYER_INACTIVE | ERR_PRIOR_CONTRACT_MISMATCH | ERR_AMENDMENT_SUPERSEDE_MISMATCH | ERR_APPEAL_LEVEL_MISMATCH | ERR_NO_MATCHING_TERM"
    http_status: 409
    applies_to: "creation and transition endpoints with cross-entity references"
  - priority: 9
    category: business_temporal
    check: "Temporal window rules: amendment effective_date and escalator effective_date within the contract term (ERR_AMENDMENT_EFFECTIVE_OUT_OF_TERM / ERR_ESCALATOR_OUT_OF_TERM); contract windows of the same payer may not share any date unless renewal-linked via prior_contract_id, and renewal-linked pairs may share at most one boundary date (ERR_CONTRACT_WINDOW_OVERLAP); network agreements of the same payer + network_name may not share any date (ERR_NETWORK_AGREEMENT_OVERLAP); claim line service_date within [admission_date, discharge_date] (ERR_LINE_OUTSIDE_STAY); appeal filing windows per level (ERR_APPEAL_WINDOW_CLOSED)"
    error_id: "ERR_AMENDMENT_EFFECTIVE_OUT_OF_TERM | ERR_ESCALATOR_OUT_OF_TERM | ERR_CONTRACT_WINDOW_OVERLAP | ERR_NETWORK_AGREEMENT_OVERLAP | ERR_LINE_OUTSIDE_STAY | ERR_APPEAL_WINDOW_CLOSED"
    http_status: 409
    applies_to: "contract/amendment/escalator/agreement/claim-line/appeal creation"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and consistency: contract_code unique per payer (ERR_DUPLICATE_CONTRACT_CODE); service_category unique per contract (ERR_DUPLICATE_SERVICE_CATEGORY); claim_number unique per payer (ERR_DUPLICATE_CLAIM_NUMBER); at most one non-terminal UnderpaymentCase per claim (ERR_CASE_ALREADY_ACTIVE); at most one DRAFT/FILED appeal per case (ERR_APPEAL_ALREADY_OPEN); escalator effective_date unique per contract (ERR_ESCALATOR_DATE_COLLISION); rate parameter coherence (base_rate_cents / percent_of_charge_bp presence per rate_model, carve-out fields per rate_model, strictly increasing volume tier mins, provision thresholds > 0) (ERR_INVALID_RATE_PARAMETERS); DRG weight present for DRG_BASE pricing (ERR_MISSING_DRG_WEIGHT); claim has lines at price time (ERR_CLAIM_HAS_NO_LINES); write-off amount equals full outstanding (ERR_WRITE_OFF_AMOUNT_MISMATCH); partial recovery within (0, outstanding) (ERR_RECOVERY_AMOUNT_INVALID); volume tier adjustment bounds"
    error_id: "ERR_DUPLICATE_CONTRACT_CODE | ERR_DUPLICATE_SERVICE_CATEGORY | ERR_DUPLICATE_CLAIM_NUMBER | ERR_CASE_ALREADY_ACTIVE | ERR_APPEAL_ALREADY_OPEN | ERR_ESCALATOR_DATE_COLLISION | ERR_INVALID_RATE_PARAMETERS | ERR_MISSING_DRG_WEIGHT | ERR_CLAIM_HAS_NO_LINES | ERR_WRITE_OFF_AMOUNT_MISMATCH | ERR_RECOVERY_AMOUNT_INVALID"
    http_status: 422
    applies_to: "creation and transition endpoints"
  - priority: 11
    category: business_fiscal
    check: "Money guards: resulting POSTED remittance total must not exceed total_billed_charges_cents (ERR_REMITTANCE_EXCEEDS_CHARGES); write-off outstanding must be within WRITE_OFF_DIRECTOR_CAP_CENTS (ERR_WRITE_OFF_CAP_EXCEEDED); arbitration requires current_outstanding_cents >= ARBITRATION_MIN_OUTSTANDING_CENTS (ERR_ESCALATION_MIN_NOT_MET)"
    error_id: "ERR_REMITTANCE_EXCEEDS_CHARGES | ERR_WRITE_OFF_CAP_EXCEEDED | ERR_ESCALATION_MIN_NOT_MET"
    http_status: 409
    applies_to: "POST /api/remittances; POST /api/underpayment-cases/{id}/write_off; POST /api/appeals (level 4)"
  - priority: 12
    category: business_constraint
    check: "Escalation evidence: creating an appeal at level n > 1 requires the most recent non-WITHDRAWN level-(n-1) appeal to have outcome IN {DENIED, EXPIRED, PARTIAL_PAYMENT}"
    error_id: ERR_ESCALATION_BLOCKED
    http_status: 409
    applies_to: "POST /api/appeals"

# =============================================================================
# §1.5 API Endpoint Table (flat topology under /api)
# GET roles enumerate all seven declared roles explicitly.
# =============================================================================
endpoints:
  # --- Payer ---
  - method: POST
    path: "/api/payers"
    description: "Create a payer"
    roles: [ContractManager]
    code: 201
    input: [name, payer_type, "appeal_deadline_days?"]
    output: Payer
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/api/payers/{id}"
    description: "Get a payer"
    roles: [ContractAnalyst, ContractManager, RevenueIntegrityAnalyst, RecoveryManager, FinanceDirector, SystemAdmin, Auditor]
    code: 200
    input: []
    output: Payer
    side_effects: []
  - method: GET
    path: "/api/payers"
    description: "List payers"
    roles: [ContractAnalyst, ContractManager, RevenueIntegrityAnalyst, RecoveryManager, FinanceDirector, SystemAdmin, Auditor]
    code: 200
    input: ["status?"]
    output: "Payer[]"
    side_effects: []
  - method: POST
    path: "/api/payers/{id}/deactivate"
    description: "Deactivate a payer"
    roles: [ContractManager]
    code: 200
    input: []
    output: Payer
    side_effects: ["status -> INACTIVE; increments Payer.version by 1"]

  # --- PayerContract ---
  - method: POST
    path: "/api/payer-contracts"
    description: "Create a contract (DRAFT). Window overlap and renewal-link rules apply."
    roles: [ContractAnalyst]
    code: 201
    input: [payer_id, contract_code, effective_date, expiration_date, "prior_contract_id?", "payment_terms_days?", "underpayment_threshold_cents?", "underpayment_threshold_bp?", "volume_tiers?"]
    output: PayerContract
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/payer-contracts/{id}"
    description: "Get a contract"
    roles: [ContractAnalyst, ContractManager, RevenueIntegrityAnalyst, RecoveryManager, FinanceDirector, SystemAdmin, Auditor]
    code: 200
    input: []
    output: PayerContract
    side_effects: []
  - method: GET
    path: "/api/payer-contracts"
    description: "List contracts"
    roles: [ContractAnalyst, ContractManager, RevenueIntegrityAnalyst, RecoveryManager, FinanceDirector, SystemAdmin, Auditor]
    code: 200
    input: ["payer_id?", "prior_contract_id?", "status?"]
    output: "PayerContract[]"
    side_effects: []
  - method: POST
    path: "/api/payer-contracts/{id}/activate"
    description: "Activate a DRAFT contract; supersedes the renewal predecessor when that predecessor is ACTIVE or SUSPENDED"
    roles: [ContractManager]
    code: 200
    input: []
    output: PayerContract
    side_effects: ["status -> ACTIVE", "increments PayerContract.version by 1", "renewal predecessor -> SUPERSEDED (version +1) when applicable"]
  - method: POST
    path: "/api/payer-contracts/{id}/suspend"
    description: "Suspend an ACTIVE contract (pricing continues; amendments/proposals blocked)"
    roles: [ContractManager]
    code: 200
    input: []
    output: PayerContract
    side_effects: ["status -> SUSPENDED", "increments PayerContract.version by 1"]
  - method: POST
    path: "/api/payer-contracts/{id}/resume"
    description: "Resume a SUSPENDED contract"
    roles: [ContractManager]
    code: 200
    input: []
    output: PayerContract
