              as: ElectionsClerk
              captures: { av2_status: $.data.status }
          assert:
            - "${pae_count_1} == 1 and ${pae_status_1} == \"ACTIVE\" — one non-forwardable result is below the threshold of 2"
            - "${av2_status} == \"FAILED\" and link 1: GET /vote-by-mail/ballot-requests/${br2} returns status == \"ADDRESS_HOLD\" with forwarding_class == \"NON_FORWARDABLE\""
            - "link 2: GET /vote-by-mail/permanent-absentee-enrollments/${pae1} returns consecutive_undeliverable_count == 2, status == \"SUSPENDED\" and suspension_reason_code == \"ADDRESS_NON_FORWARDABLE\""
            - "link 3: GET /vote-by-mail/voters/${v1} returns permanent_absentee_active == false"
            - "link 3: GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=ENROLLMENT_SUSPENDED returns exactly 1 entry with subject_entity == \"PermanentAbsenteeEnrollment\" and subject_id == ${pae1}"
            - "GET /vote-by-mail/ballot-requests/${br1} returns status == \"SUPERSEDED\" — the earlier ADDRESS_HOLD request is superseded by the later one, which is what makes the second failure consecutive"

  - rule_id: priority_pair_validation_conflict
    instances:
