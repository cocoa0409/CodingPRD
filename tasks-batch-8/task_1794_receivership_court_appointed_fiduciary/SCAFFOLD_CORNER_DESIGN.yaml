# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Receivership & Court-Appointed Fiduciary Administration
# Sections and claim_types follow references/claim-extraction-guide.md.
# Logical clock default is 2026-08-01T00:00:00Z unless a recipe sets it.
# Instance names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: case_creation_returns_active_with_zeroed_computed_fields
        claim_type: creation
        grounds: [entities.Case, state_machines.Case]
        distinguishing_aspect: "POST /v1/cases returns 201 with status ACTIVE, all computed totals zeroed, posture NORMAL, report_overdue false, version 1."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3001", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { st: $.data.status, cash: $.data.cash_on_hand_cents, tot: $.data.allowed_claims_total_cents, posture: $.data.posture, overdue: $.data.report_overdue, ver: $.data.version }
          assert:
            - "${st} == ACTIVE, ${cash} == 0, ${tot} == 0, ${posture} == NORMAL, ${overdue} == false, ${ver} == 1"

      - name: case_creation_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Case.fields.debtor_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field debtor_name is rejected with ERR_INVALID_REQUEST (400); no case is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3002", court_jurisdiction: "S.D.N.Y.", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: case_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Case.fields.cash_on_hand_cents]
        distinguishing_aspect: "Client-supplied cash_on_hand_cents in the create payload is ignored — the computed field initializes to 0 regardless."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3003", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000, cash_on_hand_cents: 999999 }
              as: Court
              captures: { cash: $.data.cash_on_hand_cents }
          assert:
            - "${cash} == 0 — injected value 999999 was ignored"

      - name: get_case_unknown_id_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but non-existent case id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: claims_list_pagination_and_status_filter
        claim_type: listing
        grounds: [endpoints.GET /v1/claims, response_envelope]
        distinguishing_aspect: "GET /v1/claims composes case_id + status filters with limit/offset pagination; envelope exposes total_count and has_more."
        test_recipe:
          setup:
            - "Case ACTIVE; three claims FILED (A 10000, B 20000, C 30000); claim A then determined ALLOWED"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3005", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor A", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 10000 }
              as: Creditor
              captures: { ca: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor B", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 20000 }
              as: Creditor
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor C", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 30000 }
              as: Creditor
            - call: "POST /v1/claims/${ca}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 10000 }
              as: Receiver
          trigger:
            - call: "GET /v1/claims?case_id=${case_id}&status=FILED"
              as: Receiver
            - call: "GET /v1/claims?case_id=${case_id}&limit=2&offset=0"
              as: Receiver
          assert:
            - "status=FILED filter returns exactly 2 rows (Creditor B and C); total_count == 2"
            - "limit=2 page returns 2 rows with total_count == 3 and has_more == true"

      - name: claim_invalid_creditor_type_returns_400
        claim_type: type_constraints
        grounds: [entities.Claim.fields.creditor_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A creditor_type outside the declared enum (SECURED | PRIORITY_TAX | PRIORITY_WAGE | GENERAL_UNSECURED | INVESTOR) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Case ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3006", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Odd Creditor", creditor_type: BANKER, filed_amount_cents: 10000 }
              as: Creditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: engagement_hourly_missing_rate_returns_400
        claim_type: type_constraints
        grounds: [entities.Engagement.fields.hourly_rate_cents, "validations[priority=3]"]
        distinguishing_aspect: "Conditional requirement: HOURLY engagement without hourly_rate_cents is rejected; CONTINGENT engagement carrying hourly_rate_cents is equally rejected."
        test_recipe:
          setup: ["Case ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3007", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, fee_cap_cents: 1000000 }
              as: Receiver
              captures: { err1: $.data.error_id }
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "A. Accountant", firm_name: "Acct LLC", role_type: ACCOUNTANT, fee_arrangement: CONTINGENT, contingency_pct: 0.10, hourly_rate_cents: 20000, fee_cap_cents: 1000000 }
              as: Receiver
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_REQUEST — HOURLY requires hourly_rate_cents"
            - "${err2} == ERR_INVALID_REQUEST — hourly_rate_cents is forbidden on CONTINGENT"

      - name: claim_with_missing_collateral_asset_returns_404
        claim_type: parent_relationships
        grounds: [entities.Claim.fields.collateral_asset_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: a SECURED claim referencing a non-existent collateral asset is rejected with ERR_NOT_FOUND."
        test_recipe:
          setup: ["Case ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3008", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Secured Bank", creditor_type: SECURED, filed_amount_cents: 100000, collateral_asset_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: Creditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: asset_created_in_identified_state
        claim_type: initial_state
        grounds: [state_machines.Asset]
        distinguishing_aspect: "A newly marshalled asset starts IDENTIFIED with liquidation_value_cents null."
        test_recipe:
          setup: ["Case ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3009", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Forklift", asset_class: EQUIPMENT, estimated_value_cents: 25000 }
              as: Receiver
              captures: { st: $.data.status, lv: $.data.liquidation_value_cents }
          assert:
            - "${st} == IDENTIFIED and ${lv} is null"

      - name: asset_liquidate_from_liquidated_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Asset.IDENTIFIED_to_LIQUIDATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Liquidating an already-LIQUIDATED asset is rejected with ERR_INVALID_STATE; the second call changes nothing."
        test_recipe:
          setup: ["Case ACTIVE; asset liquidated once"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3010", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Forklift", asset_class: EQUIPMENT, estimated_value_cents: 25000 }
              as: Receiver
              captures: { aid: $.data.id }
            - call: "POST /v1/assets/${aid}/liquidate"
              payload: { liquidation_value_cents: 20000 }
              as: Receiver
          trigger:
            - call: "POST /v1/assets/${aid}/liquidate"
              payload: { liquidation_value_cents: 99999 }
              as: Receiver
              captures: { err: $.data.error_id }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { cash: $.data.cash_on_hand_cents }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "${cash} == 20000 — the rejected second liquidation did not double-count proceeds"

      - name: asset_terminal_lockdown_abandon_after_liquidation
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Asset]
        distinguishing_aspect: "LIQUIDATED is terminal: abandon on a LIQUIDATED asset fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Case ACTIVE; asset already LIQUIDATED"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3011", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Forklift", asset_class: EQUIPMENT, estimated_value_cents: 25000 }
              as: Receiver
              captures: { aid: $.data.id }
            - call: "POST /v1/assets/${aid}/liquidate"
              payload: { liquidation_value_cents: 20000 }
              as: Receiver
          trigger:
            - call: "POST /v1/assets/${aid}/abandon"
              payload: {}
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: engagement_exhausted_auto_transition_at_cap
        claim_type: side_effect_execution
        grounds: [state_machines.Engagement.APPROVED_to_EXHAUSTED, calculations.engagement_fee_cap]
        distinguishing_aspect: "Auto-transition with boundary precision: when a fee payment brings total_fees_paid_cents to EXACTLY fee_cap_cents (>=), the engagement flips APPROVED -> EXHAUSTED and a subsequent fee application is rejected with ERR_ENGAGEMENT_NOT_APPROVED."
        test_recipe:
          setup:
            - "Case ACTIVE; cash 100000; engagement COUNSEL APPROVED with fee_cap_cents 100000"
            - "Fee application for 100000 APPROVED at 100000"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3012", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 100000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 100000 }
              as: Receiver
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 100000 }
              as: Receiver
              captures: { eng_id: $.data.id }
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", time_entries: [ { hours: 1.0, rate_cents: 100000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { fid: $.data.id }
            - call: "POST /v1/fee-applications/${fid}/decide"
              payload: { decision: APPROVE, approved_amount_cents: 100000 }
              as: Court
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /v1/fee-applications/${fid}/pay"
              payload: { expected_case_version: "${v1}" }
              as: Receiver
              captures: { pay_st: $.data.status }
            - call: "GET /v1/engagements/${eng_id}"
              as: Receiver
              captures: { eng_st: $.data.status, eng_paid: $.data.total_fees_paid_cents }
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", time_entries: [ { hours: 1.0, rate_cents: 20000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { err2: $.data.error_id }
          assert:
            - "${pay_st} == PAID and ${eng_paid} == 100000"
            - "${eng_st} == EXHAUSTED — hitting the cap exactly (>=) triggers the auto-transition"
            - "${err2} == ERR_ENGAGEMENT_NOT_APPROVED — EXHAUSTED engagements reject new applications"

      - name: plan_executed_bubble_up_when_last_payment_paid
        claim_type: side_effect_execution
        grounds: [state_machines.DistributionPlan.APPROVED_to_EXECUTED, state_machines.DistributionPayment.SCHEDULED_to_PAID]
        distinguishing_aspect: "Bubble-up: paying the plan's last SCHEDULED payment auto-transitions the plan APPROVED -> EXECUTED in the same request chain."
        test_recipe:
          setup: ["Case with cash 50000; one GENERAL claim ALLOWED 50000; plan APPROVED (single payment 50000)"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3013", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 50000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 50000 }
              as: Receiver
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Trade Supplier", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 50000 }
              as: Creditor
              captures: { c1: $.data.id }
            - call: "POST /v1/claims/${c1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 50000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { plan_id: $.data.id }
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "GET /v1/claims/${c1}/payments"
              as: Receiver
              captures: { pay_id: "$.data[0].id" }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /v1/distribution-payments/${pay_id}/pay"
              payload: { expected_case_version: "${v1}" }
              as: Receiver
              captures: { pay_st: $.data.status }
            - call: "GET /v1/distribution-plans/${plan_id}"
              as: Receiver
              captures: { plan_st: $.data.status }
          assert:
            - "${pay_st} == PAID"
            - "${plan_st} == EXECUTED — bubble-up fired on the last SCHEDULED payment resolving"

      - name: payment_cancelled_on_claim_reconsider_conditional_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.DistributionPayment.SCHEDULED_to_CANCELLED, state_machines.Claim.ALLOWED_to_FILED]
        distinguishing_aspect: "Conditional cascade: reconsidering an ALLOWED claim while the case is DISTRIBUTING cancels only that claim's SCHEDULED payments (never PAID ones), moves no cash, and — with no SCHEDULED rows left — bubbles the plan to EXECUTED."
        test_recipe:
          setup: ["Case with cash 50000; one GENERAL claim ALLOWED 50000; plan APPROVED (single payment 50000 SCHEDULED); case DISTRIBUTING"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3014", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 50000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 50000 }
              as: Receiver
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Trade Supplier", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 50000 }
              as: Creditor
              captures: { c1: $.data.id }
            - call: "POST /v1/claims/${c1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 50000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { plan_id: $.data.id }
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "GET /v1/claims/${c1}/payments"
              as: Receiver
              captures: { pay_id: "$.data[0].id" }
          trigger:
            - call: "POST /v1/claims/${c1}/reconsider"
              payload: {}
              as: Court
              captures: { c_st: $.data.status }
            - call: "GET /v1/claims/${c1}/payments"
              as: Receiver
              captures: { pay_st: "$.data[0].status" }
            - call: "GET /v1/distribution-plans/${plan_id}"
              as: Receiver
              captures: { plan_st: $.data.status }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { cash: $.data.cash_on_hand_cents }
          assert:
            - "${c_st} == FILED and ${pay_st} == CANCELLED"
            - "${cash} == 50000 — a SCHEDULED payment never debited cash, so cancellation moves nothing"
            - "${plan_st} == EXECUTED — no SCHEDULED rows remain"

      - name: decide_on_decided_engagement_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Engagement.PROPOSED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the same adjudication trigger on an already-decided engagement is rejected with ERR_INVALID_STATE — the second decision is not a silent no-op."
        test_recipe:
          setup: ["Case ACTIVE; engagement decided APPROVED"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3015", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 1000000 }
              as: Receiver
              captures: { eng_id: $.data.id }
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Court
          trigger:
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Court
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE — engagement is no longer PROPOSED"

      - name: determine_from_allowed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.FILED_to_ALLOWED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Determine is only defined from FILED: determining an already-ALLOWED claim (without a reconsider in between) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Case ACTIVE; claim GENERAL 40000 already ALLOWED"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3016", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor A", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 40000 }
              as: Creditor
              captures: { cid: $.data.id }
            - call: "POST /v1/claims/${cid}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 40000 }
              as: Receiver
          trigger:
            - call: "POST /v1/claims/${cid}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 39000 }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: wage_priority_cap_splits_buckets
        claim_type: constants_applied
        grounds: [calculations.claim_priority_determination]
        distinguishing_aspect: "WAGE_PRIORITY_CAP_CENTS == 1515000 caps the PRIORITY bucket: a 2000000 wage claim splits into priority 1515000 + general 485000."
        test_recipe:
          setup: ["Case ACTIVE; PRIORITY_WAGE claim filed 2000000"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3017", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Wage Claimant", creditor_type: PRIORITY_WAGE, filed_amount_cents: 2000000 }
              as: Creditor
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /v1/claims/${cid}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 2000000 }
              as: Receiver
              captures: { pri: $.data.priority_allowed_cents, gen: $.data.general_allowed_cents }
          assert:
            - "${pri} == 1515000 (capped at WAGE_PRIORITY_CAP_CENTS)"
            - "${gen} == 485000 (excess flows to the GENERAL bucket)"
            - "${pri} + ${gen} == 2000000 (bucket conservation)"

      - name: waterfall_reserve_subtracted_and_empty_classes_skipped
        claim_type: input_set_filtering
        grounds: [calculations.distribution_waterfall]
        distinguishing_aspect: "The pool subtracts the reserve (cash 100000 - reserve 30000 = pool 70000); classes with no allowed buckets are skipped entirely — no zero-amount payment rows are generated."
        test_recipe:
          setup: ["Case ACTIVE; cash 100000; one GENERAL claim ALLOWED 70000; plan reserve 30000"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3018", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 100000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 100000 }
              as: Receiver
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Trade Supplier", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 70000 }
              as: Creditor
              captures: { c1: $.data.id }
            - call: "POST /v1/claims/${c1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 70000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 30000 }
              as: Receiver
              captures: { plan_id: $.data.id, snap: $.data.pool_snapshot_cents }
          trigger:
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "GET /v1/distribution-plans/${plan_id}/payments"
              as: Receiver
              captures: { amt0: "$.data[0].scheduled_amount_cents", cls0: "$.data[0].priority_class" }
          assert:
            - "${snap} == 70000 — provisional pool is cash minus reserve"
            - "Exactly one payment row exists: ${amt0} == 70000 with ${cls0} == GENERAL"
            - "No SECURED, PRIORITY, or INVESTOR rows exist (empty classes skipped)"

      - name: report_overdue_flag_transitions_with_clock
        claim_type: correct_result
        grounds: [calculations.reporting_calendar, entities.Case.fields.report_overdue]
        distinguishing_aspect: "report_overdue uses a strict > against next_report_period_start + interval: at exactly 2026-08-31T00:00:00Z it is false, one second later true; filing the period-1 report while overdue resets the flag to false."
        test_recipe:
          setup: ["Case ACTIVE, appointment 2026-08-01T00:00:00Z, interval 30 days; no reports filed"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3019", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { od1: $.data.report_overdue }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: SystemAdmin
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { od2: $.data.report_overdue }
            - call: "POST /v1/status-reports"
              payload: { case_id: "${case_id}", report_type: PERIODIC, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", narrative: "period 1" }
              as: Receiver
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { od3: $.data.report_overdue }
          assert:
            - "${od1} == false — exactly at the boundary (strictly-greater rule)"
            - "${od2} == true — one second past 2026-08-31T00:00:00Z with no report filed"
            - "${od3} == false — filing the period-1 report advances next_report_period_start to 2026-08-31, whose deadline 2026-09-30 is still ahead"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_with_unknown_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "An X-User-Role value outside the declared role set is rejected with ERR_UNAUTHENTICATED (401) before any other check."
