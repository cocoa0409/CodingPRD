          assert:
            - "QualifyingMove.${move_id}.student_age_at_move == 19"
            - "at submit CertificateOfEligibility.${coe_id}.provisional_eligibility_end_on == 2029-06-14 - add_months(2026-06-15, 36) minus one day, with no age clip"
            - "after approve CertificateOfEligibility.${coe_id}.eligibility_start_on == 2026-07-01"
            - "after approve CertificateOfEligibility.${coe_id}.eligibility_end_on == 2029-05-19 - min(uncapped 2029-06-30, age_out_on 2029-05-19)"
            - "after approve CertificateOfEligibility.${coe_id}.age_out_capped == true"
            - "the created EligibilityTerm has term_start_on == 2026-07-01 and term_end_on == 2029-05-19, not 2029-06-30"
            - "Student.${stu_id}.eligibility_status == ELIGIBLE and eligibility_expires_on == 2029-05-19"

      - name: corner_term_sweep_advances_one_step_per_call
        claim_type: chronological
        grounds:
          - calculations.eligibility_term_sweep
