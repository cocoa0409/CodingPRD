              as_user_id: "${pw_nurse}"
              captures: { pw_e1: $.data.id }
            - call: "POST /clinical-ladder/participation-events/${pw_e1}/verify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${pw_nurse}", event_kind: "QI_PROJECT", points: 5, occurred_on: "2026-08-01T00:00:00Z" }
              as: Nurse
              as_user_id: "${pw_nurse}"
              captures: { pw_e2: $.data.id }
            - call: "POST /clinical-ladder/participation-events/${pw_e2}/verify"
