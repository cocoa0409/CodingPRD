# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1513_forklift_fleet_sales_rental_service
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ============================================================ 1. Entities
  - section: entities
    instances:
      - name: customer_create_applies_defaults
        claim_type: defaults
        grounds:
          - entities.Customer.fields.discount_pct
          - entities.Customer.fields.account_status
          - entities.Customer.fields.outstanding_balance_cents
        distinguishing_aspect: "Omitting discount_pct yields 0; system fields default: outstanding 0, holds 0, available == credit_limit, account_status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Default Co", credit_limit_cents: 500000 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "GET /fleet/customers/${c_id}"
              as: SalesRep
          assert:
            - "Customer.${c_id}.discount_pct == 0"
            - "Customer.${c_id}.outstanding_balance_cents == 0 and credit_holds_cents == 0"
            - "Customer.${c_id}.available_credit_cents == 500000"
            - "Customer.${c_id}.account_status == ACTIVE"

      - name: unit_create_computed_fields_initialized
        claim_type: computed_fields
        grounds:
          - entities.Unit.fields.next_pm_due_hours
          - entities.Unit.fields.hour_meter
          - entities.Unit.fields.utilization_pct_90d
        distinguishing_aspect: "On create, hour_meter 0, last_pm_hours 0, next_pm_due_hours == pm_interval_hours, posture PM_OK, availability AVAILABLE, utilization 0.0; fuel_program mirrors power_type."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-ENT1", model: "8FBCU25", power_type: "BATTERY", disposition: "RENTAL_FLEET", daily_rate_cents: 16000, weekly_rate_cents: 75000, monthly_rate_cents: 220000, pm_interval_hours: 300 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
          trigger:
            - call: "GET /fleet/units/${u_id}"
              as: FleetManager
          assert:
            - "Unit.${u_id}.hour_meter == 0 and last_pm_hours == 0"
            - "Unit.${u_id}.next_pm_due_hours == 300"
            - "Unit.${u_id}.maintenance_posture == PM_OK and availability_status == AVAILABLE"
            - "Unit.${u_id}.fuel_program == BATTERY  (mirrors power_type)"
            - "Unit.${u_id}.utilization_pct_90d == 0.0"
            - "Unit.${u_id}.version == 1"

      - name: get_nonexistent_unit_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fleet/units/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FleetManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: create_customer_missing_required_name
        claim_type: required_fields
        grounds:
          - entities.Customer.fields.name
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "Missing required input field name -> 400 ERR_INVALID_REQUEST before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/customers"
              payload: { credit_limit_cents: 500000 }
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: create_unit_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Unit.fields.power_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "power_type outside {BATTERY, LP} is rejected as a shape error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-ENT2", model: "X", power_type: "DIESEL", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: rental_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more; default limit is 10."
        test_recipe:
          setup:
            - "Customer; two RENTAL_FLEET units; two RESERVED contracts (one per unit)"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Page Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-PG1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u1_id: "$.data.id", u1_v: "$.data.version" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-PG2", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u2_id: "$.data.id", u2_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u1_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-03", expected_unit_version: "${u1_v}" }
              as: RentalCoordinator
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u2_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-03", expected_unit_version: "${u2_v}" }
              as: RentalCoordinator
          trigger:
            - call: "GET /fleet/rental-contracts"
              payload: { customer_id: "${c_id}", limit: 1, offset: 0 }
              as: RentalCoordinator
          assert:
            - "response data array length == 1"
            - "total_count == 2 and has_more == true"
            - "limit == 1 and offset == 0 echoed in pagination fields"

      - name: immutable_event_entities_have_no_update
        claim_type: immutability
        grounds:
          - entities.MeterReading
          - entities.FuelEvent
        distinguishing_aspect: "MeterReading and FuelEvent are append-only (common_fields false): no PUT/PATCH/DELETE endpoint exists for them and they carry no version field."
        test_recipe:
          setup:
            - "Unit exists; one meter reading recorded"
          setup_api_calls:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-ENT3", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/units/${u_id}/meter-readings"
              payload: { reading_hours: 10 }
              as: FleetManager
              captures: { mr_id: "$.data.id" }
          assert:
            - "MeterReading.${mr_id} response carries id and created_at but no version / updated_at field"
            - "no PUT/PATCH/DELETE route exists for /fleet/units/{id}/meter-readings/{readingId}"

  # ============================================================ 2. State machines
  - section: state_machines
    instances:
      - name: accept_draft_quote_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Quote
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ACCEPT is not a valid transition from DRAFT (submit must come first) -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Customer with certified operator; DRAFT quote with one line"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "SM Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/operators"
              payload: { customer_id: "${c_id}", full_name: "Op SM", badge_number: "B-SM" }
              as: TrainingRegistrar
              captures: { op_id: "$.data.id" }
            - call: "POST /fleet/operators/${op_id}/certifications"
              payload: { cert_class: "SIT_DOWN", expires_at: "2027-01-01T00:00:00Z" }
              as: TrainingRegistrar
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "NEW_CONFIG", valid_until: "2026-09-01" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Line", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
          trigger:
            - call: "POST /fleet/quotes/${q_id}/accept"
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE  (DRAFT -> ACCEPTED not a transition)"
            - "Quote.${q_id}.status == DRAFT"

      - name: quote_expiry_sweep_on_clock_advance
        claim_type: auto_transition
        grounds:
          - state_machines.Quote.SUBMITTED_to_EXPIRED
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Advancing the logical clock past valid_until flips SUBMITTED -> EXPIRED without any direct call on the quote."
        test_recipe:
          setup: ["Customer; quote valid_until 2026-09-01 submitted at default clock"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Expiry Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "NEW_CONFIG", valid_until: "2026-09-01" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Line", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: FleetManager
          assert:
            - "Quote.${q_id}.status == EXPIRED after clock advance"
            - "EXPIRED is terminal: subsequent accept returns ERR_INVALID_STATE"

      - name: return_reserved_contract_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RentalContract
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RETURN requires ON_RENT; returning a RESERVED (never checked out) contract is rejected and no billing occurs."
        test_recipe:
          setup: ["Customer; unit; RESERVED contract"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "SM2 Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-SM2", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-03", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/rental-contracts/${rc_id}/return"
              payload: { return_date: "2026-08-03", return_hours: 10 }
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "RentalContract.${rc_id}.status == RESERVED and final_charge_cents is null"
            - "Customer.${c_id}.credit_holds_cents unchanged (30000 hold retained)"

      - name: certification_auto_expires_on_clock
        claim_type: auto_transition
        grounds:
          - state_machines.Certification.ACTIVE_to_EXPIRED
        distinguishing_aspect: "Certification flips ACTIVE -> EXPIRED when the logical clock passes expires_at; renew from EXPIRED restores ACTIVE with renewed_count 1."
        test_recipe:
          setup: ["Customer; operator with cert expiring 2026-09-01 (ACTIVE at default clock)"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Cert Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/operators"
              payload: { customer_id: "${c_id}", full_name: "Op Cert", badge_number: "B-C1" }
              as: TrainingRegistrar
              captures: { op_id: "$.data.id" }
            - call: "POST /fleet/operators/${op_id}/certifications"
              payload: { cert_class: "STAND_UP", expires_at: "2026-09-01T00:00:00Z" }
              as: TrainingRegistrar
              captures: { cert_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: FleetManager
            - call: "POST /fleet/certifications/${cert_id}/renew"
              payload: { new_expires_at: "2027-09-01T00:00:00Z" }
              as: TrainingRegistrar
          assert:
            - "after clock advance: Certification.${cert_id}.status == EXPIRED (observable via GET /fleet/operators/${op_id}/certifications)"
            - "after renew from EXPIRED: status == ACTIVE, expires_at == 2027-09-01T00:00:00Z, renewed_count == 1"

      - name: sold_unit_rejects_meter_reading
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Unit
          - errors[ERR_INVALID_STATE]
          - validations[priority=5]
        distinguishing_aspect: "SOLD is terminal for fleet operations: meter readings on a SOLD unit are rejected."
        test_recipe:
          setup:
            - "Customer with certified operator; USED_SALE unit reconditioned to LISTED; USED_UNIT_SALE quote accepted -> unit SOLD"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Sold Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/operators"
              payload: { customer_id: "${c_id}", full_name: "Op Sold", badge_number: "B-S1" }
              as: TrainingRegistrar
              captures: { op_id: "$.data.id" }
            - call: "POST /fleet/operators/${op_id}/certifications"
              payload: { cert_class: "SIT_DOWN", expires_at: "2027-01-01T00:00:00Z" }
              as: TrainingRegistrar
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-SOLD", model: "8FGCU25", power_type: "LP", disposition: "USED_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/reconditioning-orders"
              payload: { unit_id: "${u_id}", notes: "full recon" }
              as: FleetManager
              captures: { ro_id: "$.data.id" }
            - call: "POST /fleet/reconditioning-orders/${ro_id}/complete"
              payload: { qc_result: "PASS", listing_price_cents: 2500000 }
              as: FleetManager
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "USED_UNIT_SALE", unit_id: "${u_id}", valid_until: "2026-09-01" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Used truck as-listed", qty: 1, unit_price_cents: 2500000 }
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/accept"
              as: SalesRep
          trigger:
            - call: "POST /fleet/units/${u_id}/meter-readings"
              payload: { reading_hours: 10 }
              as: FleetManager
              captures: { err: "$.data.error_id" }
          assert:
            - "Unit.${u_id}.availability_status == SOLD after quote accept"
            - "error_id == ERR_INVALID_STATE  (SOLD units reject new meter readings)"

      - name: servicecall_release_redispatch_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.ServiceCall.DISPATCHED_to_OPEN
          - state_machines.ServiceCall.OPEN_to_DISPATCHED
        distinguishing_aspect: "After release, the same call can be dispatched to a DIFFERENT technician; assignment and window fields are re-written."
        test_recipe:
          setup: ["Customer; unit; technicians T1 and T2; call dispatched to T1 then released"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Cycle SC", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-SC1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "T One", home_branch: "BR1", van_stock: [] }
              as: ServiceDispatcher
              captures: { t1_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "T Two", home_branch: "BR1", van_stock: [] }
              as: ServiceDispatcher
              captures: { t2_id: "$.data.id" }
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "BREAKDOWN", priority: "STANDARD", required_parts: [] }
              as: ServiceDispatcher
              captures: { sc_id: "$.data.id" }
            - call: "POST /fleet/service-calls/${sc_id}/dispatch"
              payload: { technician_id: "${t1_id}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ServiceDispatcher
            - call: "POST /fleet/service-calls/${sc_id}/release"
              as: ServiceDispatcher
          trigger:
            - call: "POST /fleet/service-calls/${sc_id}/dispatch"
              payload: { technician_id: "${t2_id}", scheduled_start: "2026-08-02T10:30:00Z", scheduled_end: "2026-08-02T11:30:00Z" }
              as: ServiceDispatcher
          assert:
            - "ServiceCall.${sc_id}.status == DISPATCHED"
            - "ServiceCall.${sc_id}.technician_id == ${t2_id}"
            - "overlapping the released T1 window is allowed because release freed T1's window"

      - name: recon_qc_fail_loop_then_pass
        claim_type: valid_transition
        grounds:
          - state_machines.ReconditioningOrder
        distinguishing_aspect: "complete with qc_result FAIL keeps the order IN_PROGRESS and increments qc_fail_count; a later PASS completes it and lists the unit."
        test_recipe:
          setup: ["USED_SALE unit with an IN_PROGRESS reconditioning order"]
          setup_api_calls:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-RC1", model: "8FGCU25", power_type: "LP", disposition: "USED_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/reconditioning-orders"
              payload: { unit_id: "${u_id}" }
              as: FleetManager
              captures: { ro_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/reconditioning-orders/${ro_id}/complete"
              payload: { qc_result: "FAIL" }
              as: FleetManager
            - call: "POST /fleet/reconditioning-orders/${ro_id}/complete"
              payload: { qc_result: "PASS", listing_price_cents: 1999000 }
              as: FleetManager
          assert:
            - "after FAIL: ReconditioningOrder.${ro_id}.status == IN_PROGRESS and qc_fail_count == 1"
            - "after PASS: status == COMPLETED and listing_price_cents == 1999000"
            - "Unit.${u_id}.availability_status == LISTED and resale_price_cents == 1999000"

      - name: second_inspection_approve_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.LeaseInspection.SUBMITTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "At most one APPROVED inspection per lease: approving a second SUBMITTED inspection is rejected."
        test_recipe:
          setup: ["Customer; NEW_SALE unit; lease returned; two SUBMITTED inspections"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Insp Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-IN1", model: "8FGCU25", power_type: "LP", disposition: "NEW_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2025-08-01", end_date: "2026-08-01", allowed_hours: 1000, excess_hour_rate_cents: 500, residual_value_cents: 800000 }
              as: LeaseManager
              captures: { l_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts/${l_id}/return"
              payload: { return_date: "2026-08-01" }
              as: LeaseManager
            - call: "POST /fleet/lease-contracts/${l_id}/inspections"
              payload: { condition_grade: "A", hours_at_return: 900, appraised_value_cents: 850000 }
              as: LeaseManager
              captures: { i1_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts/${l_id}/inspections"
              payload: { condition_grade: "D", hours_at_return: 900, appraised_value_cents: 100000 }
              as: LeaseManager
              captures: { i2_id: "$.data.id" }
            - call: "POST /fleet/inspections/${i1_id}/approve"
              as: LeaseManager
          trigger:
            - call: "POST /fleet/inspections/${i2_id}/approve"
              as: LeaseManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "LeaseInspection.${i2_id}.status == SUBMITTED"

      - name: settle_without_approved_inspection_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.LeaseContract.RETURNED_to_SETTLED
          - errors[ERR_INSPECTION_NOT_APPROVED]
        distinguishing_aspect: "Settle requires an APPROVED inspection; with only a SUBMITTED inspection the settle returns ERR_INSPECTION_NOT_APPROVED."
        test_recipe:
          setup: ["Customer; NEW_SALE unit; lease returned; one SUBMITTED (not approved) inspection"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Settle Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-ST1", model: "8FGCU25", power_type: "LP", disposition: "NEW_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2025-08-01", end_date: "2026-08-01", allowed_hours: 1000, excess_hour_rate_cents: 500, residual_value_cents: 800000 }
              as: LeaseManager
              captures: { l_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts/${l_id}/return"
              payload: { return_date: "2026-08-01" }
              as: LeaseManager
            - call: "POST /fleet/lease-contracts/${l_id}/inspections"
              payload: { condition_grade: "B", hours_at_return: 1200, appraised_value_cents: 530000 }
              as: LeaseManager
          trigger:
            - call: "POST /fleet/lease-contracts/${l_id}/settle"
              as: LeaseManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INSPECTION_NOT_APPROVED"
            - "LeaseContract.${l_id}.status == RETURNED and settlement_total_cents is null"

  # ============================================================ 3. Calculations
  - section: calculations
    instances:
      - name: fuel_swap_fee_math
        claim_type: correct_result
        grounds:
          - calculations.fuel_event_cost
        distinguishing_aspect: "SWAP cost = flat fee 2500 + kWh * 12: a 50 kWh swap costs 3100 cents; a 0 kWh swap costs exactly the 2500 fee."
        test_recipe:
          setup: ["BATTERY unit"]
          setup_api_calls:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-CAL1", model: "8FBCU25", power_type: "BATTERY", disposition: "RENTAL_FLEET", daily_rate_cents: 16000, weekly_rate_cents: 75000, monthly_rate_cents: 220000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/units/${u_id}/fuel-events"
              payload: { event_type: "SWAP", kwh: 50 }
              as: FleetManager
              captures: { ev_cost: "$.data.cost_cents" }
          assert:
            - "FuelEvent.cost_cents == 3100  (2500 + 50*12)"

      - name: pm_resolve_resets_interval
        claim_type: correct_result
        grounds:
          - calculations.pm_due_evaluation
          - state_machines.ServiceCall.DISPATCHED_to_CLOSED
        distinguishing_aspect: "Resolving a PM call resets last_pm_hours to the current hour_meter and pushes next_pm_due_hours out by pm_interval_hours; posture returns to PM_OK."
        test_recipe:
          setup:
            - "Customer; unit pm_interval 500 driven to hour_meter 500 (PM_DUE, auto PM call exists); manual PM call created and dispatched to technician"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "PM Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-PM1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "Tech PM", home_branch: "BR1", van_stock: [ { part_number: "P-OIL", qty: 4 } ] }
              as: ServiceDispatcher
              captures: { t_id: "$.data.id" }
            - call: "POST /fleet/units/${u_id}/meter-readings"
              payload: { reading_hours: 500 }
              as: FleetManager
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "PM", priority: "STANDARD", required_parts: [ { part_number: "P-OIL", qty: 1 } ] }
              as: ServiceDispatcher
              captures: { sc_id: "$.data.id" }
            - call: "POST /fleet/service-calls/${sc_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }
              as: ServiceDispatcher
          trigger:
            - call: "POST /fleet/service-calls/${sc_id}/resolve"
              payload: { used_parts: [ { part_number: "P-OIL", qty: 1 } ] }
              as: Technician
              as_user_id: "${t_id}"
          assert:
            - "Unit.${u_id}.maintenance_posture == PM_OK"
            - "Unit.${u_id}.last_pm_hours == 500 and next_pm_due_hours == 1000"
            - "ServiceCall.${sc_id}.status == CLOSED"
            - "Technician.${t_id} van_stock P-OIL qty == 3  (4 - 1 consumed)"

      - name: utilization_pct_90d_after_return
        claim_type: correct_result
        grounds:
          - calculations.fleet_utilization
        distinguishing_aspect: "A 10-day RETURNED rental inside the trailing 90-day window yields utilization 11.1 (10/90*100, 1 decimal round_half_up); a unit with no qualifying contracts yields 0.0."
        test_recipe:
          setup: ["Customer; unit; contract 2026-08-01 -> 2026-08-11 checked out and returned on time at 40 hours"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Util Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-UT1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-11", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
            - call: "POST /fleet/rental-contracts/${rc_id}/checkout"
              as: RentalCoordinator
            - call: "POST /fleet/rental-contracts/${rc_id}/return"
              payload: { return_date: "2026-08-11", return_hours: 40 }
              as: RentalCoordinator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: FleetManager
            - call: "GET /fleet/units/${u_id}"
              as: FleetManager
          assert:
            - "Unit.${u_id}.utilization_pct_90d == 11.1  (10 rented days in trailing 90-day window)"

      - name: rental_overage_undiscounted
        claim_type: correct_result
        grounds:
          - calculations.rental_billing
        distinguishing_aspect: "Late return: overage days billed at 1.5x daily rate and never discounted. 4-day DAILY contract (tier 60000), customer discount 10%, returned 2 days late: final = round(60000*0.9) + 2*22500 = 54000 + 45000 = 99000."
        test_recipe:
          setup: ["Customer discount 0.10, credit 10000000; unit rates 15000/70000/210000; contract 2026-08-01 -> 2026-08-05 checked out"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Late Co", credit_limit_cents: 10000000, discount_pct: 0.10 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-OV1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-05", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
            - call: "POST /fleet/rental-contracts/${rc_id}/checkout"
              as: RentalCoordinator
          trigger:
            - call: "POST /fleet/rental-contracts/${rc_id}/return"
              payload: { return_date: "2026-08-07", return_hours: 40 }
              as: RentalCoordinator
          assert:
            - "RentalContract.${rc_id}.provisional_estimate_cents == 54000  (4*15000*0.9)"
            - "RentalContract.${rc_id}.final_charge_cents == 99000  (54000 + 2*22500; overage undiscounted)"

      - name: quote_total_recompute_covered
        claim_type: correct_result
        grounds:
          - calculations.quote_pricing
        excluded_because:
          difficulty_instance: combinatorial_formula / quote_discount_rounding_order
          rationale: "Subtotal/discount/tax/total asserted there with exact literals."

      - name: lease_wear_table_covered
        claim_type: constants_applied
        grounds:
          - calculations.lease_settlement
        excluded_because:
          difficulty_instance: combinatorial_formula / lease_settlement_prediscount_tier
          rationale: "Grade-B wear charge 150000 asserted there; same table drives A/C/D rows."

  # ============================================================ 4. Validations
  - section: validations
    instances:
      - name: hour_meter_regression_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_HOUR_METER_REGRESSION]
        distinguishing_aspect: "A reading not strictly greater than the current hour_meter (500 -> 400) is rejected; the meter never runs backwards."
        test_recipe:
          setup: ["Unit with hour_meter already at 500"]
          setup_api_calls:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/units/${u_id}/meter-readings"
              payload: { reading_hours: 500 }
              as: FleetManager
          trigger:
            - call: "POST /fleet/units/${u_id}/meter-readings"
              payload: { reading_hours: 400 }
              as: FleetManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_HOUR_METER_REGRESSION"
            - "Unit.${u_id}.hour_meter == 500  (unchanged)"

      - name: rental_end_before_start_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "end_date <= start_date is a request-shape violation caught before any business check."
        test_recipe:
          setup: ["Customer; RENTAL_FLEET unit"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Shape Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V2", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-10", end_date: "2026-08-01", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: rental_unknown_unit_returns_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Body-referenced unit_id that does not exist yields 404 ERR_NOT_FOUND (existence precedes state and business checks)."
        test_recipe:
          setup: ["Customer; one real unit (its live version supplies the OCC placeholder)"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Ghost Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V2B", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { real_u_id: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-03", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: fuel_program_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_FUEL_PROGRAM_MISMATCH]
        distinguishing_aspect: "CHARGE events only apply to BATTERY-program units; CHARGE on an LP unit is rejected."
        test_recipe:
          setup: ["LP unit"]
          setup_api_calls:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V3", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/units/${u_id}/fuel-events"
              payload: { event_type: "CHARGE", kwh: 50 }
              as: FleetManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FUEL_PROGRAM_MISMATCH"
            - "GET /fleet/units/${u_id}/fuel-events returns empty array"

      - name: van_stock_insufficient_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_VAN_STOCK_INSUFFICIENT]
        distinguishing_aspect: "Dispatch requiring 99 of a part stocked at 5 is rejected; no partial hold is taken."
        test_recipe:
          setup: ["Customer; unit; technician with van_stock [{P-100, 5}]; OPEN call requiring [{P-100, 99}]"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Parts Short", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V4", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "Tech Short", home_branch: "BR1", van_stock: [ { part_number: "P-100", qty: 5 } ] }
              as: ServiceDispatcher
              captures: { t_id: "$.data.id" }
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "BREAKDOWN", priority: "STANDARD", required_parts: [ { part_number: "P-100", qty: 99 } ] }
              as: ServiceDispatcher
              captures: { sc_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/service-calls/${sc_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ServiceDispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_VAN_STOCK_INSUFFICIENT"
            - "Technician.${t_id} van_stock P-100 qty == 5  (no partial decrement)"
            - "ServiceCall.${sc_id}.status == OPEN"

      - name: quote_accept_without_certified_operator_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_NO_CERTIFIED_OPERATOR]
        distinguishing_aspect: "Safety gate: the customer must have at least one operator with an ACTIVE certification before a quote can be accepted."
        test_recipe:
          setup: ["Customer with NO operators; quote with one line, submitted"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "NoCert Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "NEW_CONFIG", valid_until: "2026-09-01" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Line", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
          trigger:
            - call: "POST /fleet/quotes/${q_id}/accept"
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NO_CERTIFIED_OPERATOR"
            - "Quote.${q_id}.status == SUBMITTED"

      - name: accept_expired_quote_returns_quote_expired
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_QUOTE_EXPIRED]
        distinguishing_aspect: "Accept with the logical clock past valid_until (quote still SUBMITTED, no sweep ran) raises ERR_QUOTE_EXPIRED — the temporal check, not the state check."
        test_recipe:
          setup: ["Customer with certified operator; quote valid_until 2026-07-01 (before default clock), submitted"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Expired Q", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/operators"
              payload: { customer_id: "${c_id}", full_name: "Op Q", badge_number: "B-Q1" }
              as: TrainingRegistrar
              captures: { op_id: "$.data.id" }
            - call: "POST /fleet/operators/${op_id}/certifications"
              payload: { cert_class: "SIT_DOWN", expires_at: "2027-01-01T00:00:00Z" }
              as: TrainingRegistrar
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "NEW_CONFIG", valid_until: "2026-07-01" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Line", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
          trigger:
            - call: "POST /fleet/quotes/${q_id}/accept"
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_QUOTE_EXPIRED  (default clock 2026-08-01 > valid_until 2026-07-01)"
            - "Quote.${q_id}.status == SUBMITTED"

      - name: used_sale_accept_requires_listed_unit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNIT_NOT_LISTED]
          - state_machines.Quote.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "A USED_UNIT_SALE quote can only be accepted while the referenced unit is LISTED; an AVAILABLE (not yet reconditioned) used unit blocks acceptance."
        test_recipe:
          setup: ["Customer with certified operator; USED_SALE unit still AVAILABLE (no recon); USED_UNIT_SALE quote submitted"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Used Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/operators"
              payload: { customer_id: "${c_id}", full_name: "Op U", badge_number: "B-U1" }
              as: TrainingRegistrar
              captures: { op_id: "$.data.id" }
            - call: "POST /fleet/operators/${op_id}/certifications"
              payload: { cert_class: "SIT_DOWN", expires_at: "2027-01-01T00:00:00Z" }
              as: TrainingRegistrar
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V5", model: "8FGCU25", power_type: "LP", disposition: "USED_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "USED_UNIT_SALE", unit_id: "${u_id}", valid_until: "2026-09-01" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Used truck", qty: 1, unit_price_cents: 2500000 }
              as: SalesRep
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
          trigger:
            - call: "POST /fleet/quotes/${q_id}/accept"
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNIT_NOT_LISTED  (unit AVAILABLE, not LISTED)"
            - "Unit.${u_id}.availability_status == AVAILABLE"

      - name: rental_create_over_credit_limit_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: "Provisional estimate 378000 exceeds available credit 100000 -> ERR_CREDIT_LIMIT_EXCEEDED at creation; no hold is placed."
        test_recipe:
          setup: ["Customer credit_limit 100000, discount 0.10; RENTAL_FLEET unit rates 15000/70000/210000"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Broke Co", credit_limit_cents: 100000, discount_pct: 0.10 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V6", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-09-10", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_CREDIT_LIMIT_EXCEEDED  (provisional 378000 > available 100000)"
            - "Customer.${c_id}.credit_holds_cents == 0"

      - name: rental_create_wrong_disposition_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_UNIT_DISPOSITION_MISMATCH]
        distinguishing_aspect: "Rental create on a NEW_SALE unit violates the disposition gate (rental requires RENTAL_FLEET)."
        test_recipe:
          setup: ["Customer; NEW_SALE unit"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Disp Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V7", model: "8FGCU25", power_type: "LP", disposition: "NEW_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-03", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNIT_DISPOSITION_MISMATCH"

      - name: cancelled_window_frees_overlap
        claim_type: satisfaction_passes
        grounds:
          - validations[priority=17]
        distinguishing_aspect: "The overlap input set excludes CANCELLED contracts: after cancelling C1, a new contract over C1's exact window succeeds."
        test_recipe:
          setup: ["Customer; unit; C1 RESERVED 2026-08-01 -> 2026-08-10 then CANCELLED"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Free Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V8", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-10", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc1_id: "$.data.id" }
            - call: "POST /fleet/rental-contracts/${rc1_id}/cancel"
              as: RentalCoordinator
            - call: "GET /fleet/units/${u_id}"
              as: RentalCoordinator
              captures: { u_v2: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-10", expected_unit_version: "${u_v2}" }
              as: RentalCoordinator
              captures: { rc2_id: "$.data.id" }
          assert:
            - "RentalContract.${rc2_id}.status == RESERVED  (CANCELLED window does not block)"
            - "RentalContract.${rc1_id}.status == CANCELLED"

      - name: checkout_pm_overdue_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_PM_OVERDUE]
        distinguishing_aspect: "Checkout of a RESERVED contract on a PM_DUE unit is rejected on safety grounds even though the unit is AVAILABLE."
        test_recipe:
          setup: ["Customer; unit driven to 500 hours (PM_DUE, still AVAILABLE); RESERVED contract created with fresh unit version"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "PM Gate", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-V9", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/units/${u_id}/meter-readings"
              payload: { reading_hours: 500 }
              as: FleetManager
            - call: "GET /fleet/units/${u_id}"
              as: FleetManager
              captures: { u_v2: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-03", expected_unit_version: "${u_v2}" }
              as: RentalCoordinator
              captures: { rc_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/rental-contracts/${rc_id}/checkout"
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PM_OVERDUE"
            - "RentalContract.${rc_id}.status == RESERVED"
            - "Unit.${u_id}.availability_status == AVAILABLE  (posture is PM_DUE but availability independent)"

  # ============================================================ 5. Endpoints
  - section: endpoints
    instances:
      - name: success_envelope_shape
        claim_type: response_envelope
        grounds:
          - response_envelope.success
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Envelope Co", credit_limit_cents: 500000 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "GET /fleet/customers/${c_id}"
              as: FleetManager
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == object"
            - "data.id == ${c_id}"

      - name: error_envelope_shape
        claim_type: response_envelope
        grounds:
          - response_envelope.error
        distinguishing_aspect: "Every error response carries response_type == error and data.error_id plus data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fleet/units/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FleetManager
              captures: { err: "$.data.error_id", msg: "$.data.message" }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"

      - name: lease_return_flips_unit_to_used_inventory
        claim_type: side_effect_execution
        grounds:
          - state_machines.LeaseContract.ACTIVE_to_RETURNED
          - state_machines.Unit
        distinguishing_aspect: "Lease return both restores availability (ON_LEASE -> AVAILABLE) and reclassifies the unit (disposition -> USED_SALE), feeding the used-unit reconditioning pipeline."
        test_recipe:
          setup: ["Customer; NEW_SALE unit; ACTIVE lease"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Offlease Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-EP1", model: "8FGCU25", power_type: "LP", disposition: "NEW_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2025-08-01", end_date: "2026-08-01", allowed_hours: 1000, excess_hour_rate_cents: 500, residual_value_cents: 800000 }
              as: LeaseManager
              captures: { l_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/lease-contracts/${l_id}/return"
              payload: { return_date: "2026-08-01" }
              as: LeaseManager
          assert:
            - "Unit.${u_id}.availability_status == AVAILABLE"
            - "Unit.${u_id}.disposition == USED_SALE"
            - "LeaseContract.${l_id}.status == RETURNED"

      - name: van_stock_restock_adds_qty
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /fleet/technicians/{id}/van-stock]
          - entities.Technician.fields.van_stock
        distinguishing_aspect: "Restock accumulates onto the existing van entry (5 + 3 = 8) and creates the entry when absent."
        test_recipe:
          setup: ["Technician with van_stock [{P-100, 5}]"]
          setup_api_calls:
            - call: "POST /fleet/technicians"
              payload: { full_name: "Tech Stock", home_branch: "BR1", van_stock: [ { part_number: "P-100", qty: 5 } ] }
              as: ServiceDispatcher
              captures: { t_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/technicians/${t_id}/van-stock"
              payload: { part_number: "P-100", qty: 3 }
              as: ServiceDispatcher
            - call: "POST /fleet/technicians/${t_id}/van-stock"
              payload: { part_number: "P-200", qty: 2 }
              as: ServiceDispatcher
          assert:
            - "Technician.${t_id} van_stock P-100 qty == 8"
            - "Technician.${t_id} van_stock P-200 qty == 2  (new entry created)"

  # ============================================================ 6. Errors
  - section: errors
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fleet/units/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status == 401"

      - name: account_credit_hold_blocks_new_rental
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ACCOUNT_CREDIT_HOLD]
          - validations[priority=20]
        distinguishing_aspect: "After a settle flips the customer to CREDIT_HOLD, a new rental create is rejected with ERR_ACCOUNT_CREDIT_HOLD (not a state or overlap error)."
        test_recipe:
          setup:
            - "Customer credit_limit 100000; NEW_SALE unit; lease settled at 468000 -> CREDIT_HOLD"
            - "Separate RENTAL_FLEET unit available"
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Hold Co", credit_limit_cents: 100000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-E1L", model: "8FGCU25", power_type: "LP", disposition: "NEW_SALE", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { ul_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts"
              payload: { unit_id: "${ul_id}", customer_id: "${c_id}", start_date: "2025-08-01", end_date: "2026-08-01", allowed_hours: 1000, excess_hour_rate_cents: 500, residual_value_cents: 800000 }
              as: LeaseManager
              captures: { l_id: "$.data.id" }
            - call: "POST /fleet/lease-contracts/${l_id}/return"
              payload: { return_date: "2026-08-01" }
              as: LeaseManager
            - call: "POST /fleet/lease-contracts/${l_id}/inspections"
              payload: { condition_grade: "B", hours_at_return: 1200, appraised_value_cents: 530000 }
              as: LeaseManager
              captures: { i_id: "$.data.id" }
            - call: "POST /fleet/inspections/${i_id}/approve"
              as: LeaseManager
            - call: "POST /fleet/lease-contracts/${l_id}/settle"
              as: LeaseManager
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-E1R", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { ur_id: "$.data.id", ur_v: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${ur_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-03", expected_unit_version: "${ur_v}" }
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ACCOUNT_CREDIT_HOLD"
            - "Customer.${c_id}.account_status == CREDIT_HOLD"

  # ============================================================ 7. RBAC
  - section: rbac
    instances:
      - name: salesrep_cannot_dispatch_returns_forbidden
        claim_type: role_denial
        grounds:
          - roles[SalesRep]
          - endpoints[POST /fleet/service-calls/{id}/dispatch]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "SalesRep (quotes/customers) cannot dispatch service calls — ServiceDispatcher-exclusive operation."
        test_recipe:
          setup: ["Customer; unit; OPEN service call; ACTIVE technician"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "RBAC Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-RB1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "Tech RB", home_branch: "BR1", van_stock: [] }
              as: ServiceDispatcher
              captures: { t_id: "$.data.id" }
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "BREAKDOWN", priority: "STANDARD", required_parts: [] }
              as: ServiceDispatcher
              captures: { sc_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/service-calls/${sc_id}/dispatch"
              payload: { technician_id: "${t_id}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: SalesRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHORIZED and HTTP status == 403"
            - "ServiceCall.${sc_id}.status == OPEN"

      - name: technician_cannot_resolve_others_call
        claim_type: role_denial
        grounds:
          - roles[Technician]
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Technician is entity_backed: resolve requires X-User-ID == service_call.technician_id; the assigned technician succeeds, another technician is rejected."
        test_recipe:
          setup: ["Customer; unit; technicians T1 (assigned) and T2; call dispatched to T1"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Own Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-RB2", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "T Assigned", home_branch: "BR1", van_stock: [] }
              as: ServiceDispatcher
              captures: { t1_id: "$.data.id" }
            - call: "POST /fleet/technicians"
              payload: { full_name: "T Other", home_branch: "BR1", van_stock: [] }
              as: ServiceDispatcher
              captures: { t2_id: "$.data.id" }
            - call: "POST /fleet/service-calls"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", call_type: "BREAKDOWN", priority: "STANDARD", required_parts: [] }
              as: ServiceDispatcher
              captures: { sc_id: "$.data.id" }
            - call: "POST /fleet/service-calls/${sc_id}/dispatch"
              payload: { technician_id: "${t1_id}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ServiceDispatcher
          trigger:
            - call: "POST /fleet/service-calls/${sc_id}/resolve"
              payload: { used_parts: [] }
              as: Technician
              as_user_id: "${t2_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /fleet/service-calls/${sc_id}/resolve"
              payload: { used_parts: [] }
              as: Technician
              as_user_id: "${t1_id}"
          assert:
            - "T2 resolve: error_id == ERR_UNAUTHORIZED and HTTP status == 403"
            - "T1 resolve succeeds: ServiceCall.${sc_id}.status == CLOSED"

      - name: registrar_cannot_create_units
        claim_type: role_denial
        grounds:
          - roles[TrainingRegistrar]
          - endpoints[POST /fleet/units]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "TrainingRegistrar (operators/certifications) cannot create fleet units — FleetManager-exclusive."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-RB3", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: TrainingRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHORIZED and HTTP status == 403"

  # ============================================================ 8. Cross-cutting complexity layers
  - section: complexity_layers
    instances:
      - name: cl_occ_stale_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[rental-create-stale-unit]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating a rental contract with the unit version observed before a prior create (1 vs current 2) is rejected 412 ERR_STALE_VERSION even though the requested window itself is valid."
        test_recipe:
          setup: ["Customer; unit (version captured at creation); first contract created, advancing the unit version"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "OCC Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-OCC1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-05", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { rc1_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-09-01", end_date: "2026-09-05", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_STALE_VERSION and HTTP status == 412  (non-overlapping September window would otherwise succeed)"
            - "no second contract persisted: GET /fleet/rental-contracts?unit_id=${u_id} total_count == 1"

      - name: cl_version_increments_on_mutation
        claim_type: occ_version_increments
        grounds:
          - concurrency_rules[rental-create-stale-unit]
          - entities.Unit
        distinguishing_aspect: "Unit.version starts at 1 and increments by exactly 1 per mutation (e.g. rental contract creation bumps it to 2)."
        test_recipe:
          setup: ["Customer; unit created at version 1"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Ver Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-OCC2", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-03", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
            - call: "GET /fleet/units/${u_id}"
              as: RentalCoordinator
              captures: { u_v2: "$.data.version" }
          assert:
            - "unit version at creation (${u_v}) == 1"
            - "unit version after rental create == 2"

      - name: cl_clock_default_before_first_set
        claim_type: scheduled_clock_default
        grounds:
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z — a quote submitted without touching the clock is stamped with that instant."
        test_recipe:
          setup: ["Customer; DRAFT quote with one line; clock never set"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Clock Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/quotes"
              payload: { customer_id: "${c_id}", kind: "NEW_CONFIG", valid_until: "2026-12-31" }
              as: SalesRep
              captures: { q_id: "$.data.id" }
            - call: "POST /fleet/quotes/${q_id}/lines"
              payload: { description: "Line", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
          trigger:
            - call: "POST /fleet/quotes/${q_id}/submit"
              as: SalesRep
          assert:
            - "Quote.${q_id}.submitted_at == 2026-08-01T00:00:00Z  (server default logical clock, not wall clock)"

      - name: cl_cascade_return_pm_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RentalContract.ON_RENT_to_RETURNED
        excluded_because:
          difficulty_instance: transitive_cascade / rental_return_pm_cascade
          rationale: "Depth-3 cascade asserted link-by-link there."

      - name: cl_cascade_settle_hold_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.LeaseContract.RETURNED_to_SETTLED
        excluded_because:
          difficulty_instance: transitive_cascade / lease_settle_credit_hold_cascade
          rationale: "Depth-3 cascade asserted link-by-link there."

      - name: cl_dual_variant_covered
        claim_type: dual_variant_calculation
        grounds:
          - calculations.rental_billing
          - calculations.fuel_event_cost
        excluded_because:
          difficulty_instance: dual_variant_calc / rental_billing_provisional_vs_final
          rationale: "Both variant pairs asserted there and in fuel_cost_battery_vs_lp."

      - name: cl_threshold_trigger_covered
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.pm_due_evaluation
        excluded_because:
          difficulty_instance: boundary_precision_check / pm_due_at_exact_interval
          rationale: ">= boundary at exactly 500 hours asserted there."

  # ============================================================ 9. Consistency model
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_side_effects
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the credit hold placed by rental creation is visible on the very next GET of the customer — no lag, no reconciliation pass."
        test_recipe:
          setup: ["Customer; unit; one RESERVED contract (provisional 30000 for 2 days)"]
          setup_api_calls:
            - call: "POST /fleet/customers"
              payload: { name: "Imm Co", credit_limit_cents: 10000000, discount_pct: 0 }
              as: SalesRep
              captures: { c_id: "$.data.id" }
            - call: "POST /fleet/units"
              payload: { serial_number: "SN-IM1", model: "8FGCU25", power_type: "LP", disposition: "RENTAL_FLEET", daily_rate_cents: 15000, weekly_rate_cents: 70000, monthly_rate_cents: 210000, pm_interval_hours: 500 }
              as: FleetManager
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /fleet/rental-contracts"
              payload: { unit_id: "${u_id}", customer_id: "${c_id}", start_date: "2026-08-01", end_date: "2026-08-03", expected_unit_version: "${u_v}" }
              as: RentalCoordinator
            - call: "GET /fleet/customers/${c_id}"
              as: RentalCoordinator
          assert:
            - "Customer.${c_id}.credit_holds_cents == 30000 immediately after the create call returns"
            - "Customer.${c_id}.available_credit_cents == 9970000"
