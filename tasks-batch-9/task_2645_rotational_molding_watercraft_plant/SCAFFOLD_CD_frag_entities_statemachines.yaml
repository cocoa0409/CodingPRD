            - call: "POST /cooling-bays/${bay}/mark-down"
              payload: { down_reason: "chiller pump seized again" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /molding-cycles/${cyc}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
