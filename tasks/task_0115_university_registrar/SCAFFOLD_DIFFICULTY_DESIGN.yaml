          - calculations.enrollment_refund
          - calculations.tuition_owed
          - entities.Student.fields.tuition_owed_cents
        distinguishing_aspect: "Conserved quantity = the student's net tuition (tuition_owed_cents), a different conserved quantity from seat occupancy: a full-refund DROP charges 150000 then credits 150000, leaving tuition_owed_cents == 0 (no money drift)."
