  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: derived_has_cognitive_condition_reconciles_on_supersede
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Member.fields.has_cognitive_condition
          - state_machines.MedicalRecordItem.VERIFIED_to_SUPERSEDED
        distinguishing_aspect: "Derived-field reconciliation across the full lifecycle: false at creation, true after a COGNITIVE item verifies, false again after that item is superseded (no other cognitive items) — each source mutation recomputes the denormalized flag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE member with one VERIFIED COGNITIVE item."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
