            - "the response status is 412"
            - "GET /grain/freight-bookings?fleet_id=${fleet_id} returns total_count == 1"
            - "FreightBooking.${bk1_id}.status == REQUESTED"

      - name: new_risk_limit_supersedes_the_prior_active_limit
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.RiskLimit.ACTIVE_to_SUPERSEDED
          - endpoints["POST /grain/risk-limits"]
        distinguishing_aspect: "With a freshly re-read desk version the second limit is accepted, the first flips to SUPERSEDED, and exactly one ACTIVE limit remains for (desk, CORN)."
        test_recipe:
          setup:
            - "One desk carrying one ACTIVE CORN risk limit."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD53", name: "Corner Desk 53", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id, dv0: $.data.version }
            - call: "POST /grain/risk-limits"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", max_unpriced_bushels: 100000, max_net_short_lots: 40, expected_desk_version: "${dv0}" }
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { rl1_id: $.data.id }
            - call: "GET /grain/trading-desks/${desk_id}"
              payload: {}
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { dv1: $.data.version }
          trigger:
            - call: "POST /grain/risk-limits"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", max_unpriced_bushels: 250000, max_net_short_lots: 80, expected_desk_version: "${dv1}" }
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { rl2_id: $.data.id }
          assert:
            - "the response is HTTP 201 and RiskLimit.${rl2_id}.status == ACTIVE"
            - "RiskLimit.${rl1_id}.status == SUPERSEDED"
            - "GET /grain/risk-limits?desk_id=${desk_id}&status=ACTIVE returns total_count == 1"
            - "TradingDesk.${desk_id}.version is greater than ${dv1}"

      - name: cascading_side_effects_from_delivery_apply
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DeliveryTicket.GRADED_to_APPLIED
        excluded_because:
          difficulty_instance: transitive_cascade / delivery_apply_settles_contract_lifts_hedge_recomputes_desk
          rationale: "The full four-hop chain and every intermediate field value are asserted by the named §1.8 cascade instance."

      - name: rate_threshold_trigger_at_the_restricted_posture_breakpoint
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.desk_credit_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / risk_limit_accepts_exactly_at_ceiling_rejects_one_bushel_over
          rationale: "The inclusive 0.8000 posture breakpoint is asserted as credit_utilization == 0.8000 with posture RESTRICTED in the corner instance deferred_contract_on_a_restricted_desk_returns_desk_restricted, and the analogous strictly-greater ceiling semantics are asserted by the named §1.8 boundary instance."

