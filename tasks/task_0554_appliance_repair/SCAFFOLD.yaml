# =============================================================================
# task_0554_appliance_repair — Appliance Repair & Extended-Warranty Service
# Difficulty band: Expert
# =============================================================================

scenario: |
  554. Appliance Repair & Extended-Warranty Service (Sears Home Services style):
  service request & appliance lookup, dispatch window & route, diagnostic fee &
  estimate approval, parts order & truck stock, warranty (mfg/extended/home-warranty)
  routing, second-trip & callback, recall/safety, payment

domain_name: appliance-repair
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (Customer, Appliance, WarrantyContract,
  # Technician, ServiceZone, Part, ServiceRequest, Appointment, Estimate,
  # PartsOrder, Payment, RecallNotice, TruckStockItem). URL paths are flat
  # top-level collections plus a few action sub-paths under /service-requests.

  state_machine_shape: cyclic
  # ServiceRequest revisits SCHEDULED via the second-trip / callback loop;
  # PartsOrder revisits ORDERED via the BACKORDERED retry loop. Estimate adds a
  # branching fork (APPROVED / DECLINED / SUPERSEDED).

  relationship_patterns:
    - one_to_many          # Customer→Appliance, ServiceRequest→Appointment, etc.
    - cross_aggregate      # ServiceRequest reservations mutate a Technician's TruckStockItem

  role_model: peer_roles
  # Customer owns Appliances/ServiceRequests; Technician owns TruckStock and drives
  # diagnosis/repair; Dispatcher schedules; ServiceAdmin manages catalog/warranty/recalls.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Homeowner full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: address, type: string, source: input, description: "Service address (free text)" }

  - name: Appliance
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of this appliance" }
      - { name: brand, type: string, source: input, description: "Manufacturer brand, e.g. Kenmore" }
      - { name: model, type: string, source: input, description: "Model code; recall matching is by (brand, model)" }
      - { name: serial_number, type: string, source: input, description: "Serial number" }
      - { name: purchase_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of purchase; drives age in health score" }
      - { name: recall_status, type: enum, source: computed, description: "CLEAR | RECALLED — RECALLED iff some RecallNotice with status ACTIVE matches this brand+model" }
      - { name: completed_repair_count, type: integer, source: computed, description: "Count of ServiceRequest with status COMPLETED referencing this appliance" }
      - { name: health_score, type: integer, source: computed, description: "post_completion variant of appliance_health_score (see 1.3), 0..100" }

  - name: WarrantyContract
    parent: null
    common_fields: true
    fields:
      - { name: appliance_id, type: string, source: input, description: "FK -> Appliance.id; covered appliance" }
      - { name: coverage_type, type: enum, source: input, description: "MANUFACTURER | EXTENDED | HOME_WARRANTY" }
      - { name: coverage_start, type: string, source: input, description: "ISO date; coverage active on service_date iff coverage_start <= service_date (inclusive)" }
      - { name: coverage_end, type: string, source: input, description: "ISO date; coverage active on service_date iff service_date <= coverage_end (inclusive)" }
      - { name: deductible_cents, type: integer, source: input, description: "Per-repair deductible / trade-call fee in cents; must be 0 for MANUFACTURER", default: 0 }
      - { name: coverage_cap_cents, type: integer, source: input, description: "Lifetime coverage cap in cents" }
      - { name: claimed_cents, type: integer, source: computed, description: "Cumulative warranty-covered amount committed against this contract", default: 0 }
      - { name: remaining_coverage_cents, type: integer, source: computed, description: "= coverage_cap_cents - claimed_cents" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Catalog part number; unique" }
      - { name: name, type: string, source: input, description: "Human-readable part name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Catalog unit price in cents" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: status, type: enum, source: system, description: "ON_DUTY | OFF_DUTY (see 1.2); default ON_DUTY", default: ON_DUTY }

  - name: TruckStockItem
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; owner of this truck stock line" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; stocked part" }
      - { name: quantity_on_hand, type: integer, source: input, description: "Physical units on the truck (decremented on consumption)" }
      - { name: quantity_reserved, type: integer, source: computed, description: "Units reserved to APPROVED repairs but not yet consumed", default: 0 }
      - { name: quantity_available, type: integer, source: computed, description: "= quantity_on_hand - quantity_reserved" }

  - name: ServiceZone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Zone display name" }
      - { name: max_concurrent_appointments, type: integer, source: input, description: "Aggregate capacity: max BOOKED appointments whose windows overlap a given window" }

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; requesting customer" }
      - { name: appliance_id, type: string, source: input, description: "FK -> Appliance.id; appliance under repair" }
      - { name: assigned_technician_id, type: string, source: computed, description: "FK -> Technician.id; technician on the current appointment (set on scheduling), null until first schedule" }
      - { name: covering_contract_id, type: string, source: computed, description: "FK -> WarrantyContract.id; contract selected at diagnosis, null if warranty_routing == NONE" }
      - { name: reported_issue, type: string, source: input, description: "Customer-reported symptom" }
      - { name: status, type: enum, source: system, description: "INTAKE | SCHEDULED | DIAGNOSED | APPROVED | AWAITING_PARTS | COMPLETED | DECLINED | SAFETY_HOLD (see 1.2)" }
      - { name: warranty_routing, type: enum, source: computed, description: "NONE | MANUFACTURER | EXTENDED | HOME_WARRANTY; set at diagnosis by warranty_contract_selector (1.3)" }
      - { name: diagnostic_fee_cents, type: integer, source: computed, description: "Provisional diagnostic fee set at diagnosis: 8900 if warranty_routing==NONE else 0", default: 0 }
      - { name: health_score_at_diagnosis, type: integer, source: computed, description: "at_diagnosis variant of appliance_health_score captured at diagnosis" }
      - { name: final_parts_total_cents, type: integer, source: computed, description: "Actual consumed-parts total, set at completion", default: 0 }
      - { name: final_labor_total_cents, type: integer, source: computed, description: "Actual labor total from actual_labor_tasks, set at completion", default: 0 }
      - { name: final_repair_subtotal_cents, type: integer, source: computed, description: "= final_parts_total_cents + final_labor_total_cents", default: 0 }
      - { name: warranty_covered_cents, type: integer, source: computed, description: "Warranty-covered portion (provisional at approval, reconciled at completion)", default: 0 }
      - { name: customer_responsibility_cents, type: integer, source: computed, description: "Customer out-of-pocket repair portion (see warranty_customer_responsibility 1.3)", default: 0 }
      - { name: amount_due_cents, type: integer, source: computed, description: "Total owed by customer: on DECLINED = diagnostic_fee owed; on COMPLETED = customer_responsibility_cents", default: 0 }
      - { name: visit_count, type: integer, source: computed, description: "Number of BOOKED appointments ever created for this request", default: 0 }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id; request being visited" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; assigned technician" }
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; dispatch zone" }
      - { name: window_start, type: datetime, source: input, description: "ISO8601 dispatch window start (half-open [start,end))" }
      - { name: window_end, type: datetime, source: input, description: "ISO8601 dispatch window end; must be > window_start" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED (see 1.2)" }

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id; request this estimate belongs to" }
      - { name: labor_tasks, type: array, source: input, description: "Array of {minutes:int}; labor line items (see labor_cost 1.3)" }
      - { name: required_parts, type: array, source: input, description: "Array of {part_id:string, quantity:int}; parts the repair needs" }
      - { name: estimated_parts_total_cents, type: integer, source: computed, description: "Sum over required_parts of Part.unit_price_cents * quantity" }
      - { name: estimated_labor_total_cents, type: integer, source: computed, description: "labor_cost over labor_tasks (round-up per task then sum)" }
      - { name: estimated_repair_subtotal_cents, type: integer, source: computed, description: "= estimated_parts_total_cents + estimated_labor_total_cents" }
      - { name: estimated_diagnostic_fee_cents, type: integer, source: computed, description: "diagnostic_fee_assessment provisional value on this estimate" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "estimate variant of repair_cost (see 1.3)" }
      - { name: estimated_customer_responsibility_cents, type: integer, source: computed, description: "Provisional customer out-of-pocket under warranty_customer_responsibility" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | APPROVED | DECLINED | SUPERSEDED (see 1.2)" }

  - name: PartsOrder
    parent: null
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id; request needing the depot part" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; ordered part" }
      - { name: quantity, type: integer, source: input, description: "Units ordered from depot" }
      - { name: status, type: enum, source: system, description: "ORDERED | BACKORDERED | RECEIVED | CANCELLED (see 1.2)" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id; request being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered in cents; must equal ServiceRequest.amount_due_cents" }
      - { name: method, type: enum, source: input, description: "CARD | CHECK | CASH" }
      - { name: status, type: enum, source: system, description: "RECORDED (terminal, set on creation)" }

  - name: RecallNotice
    parent: null
    common_fields: true
    fields:
      - { name: brand, type: string, source: input, description: "Brand the recall targets" }
      - { name: model, type: string, source: input, description: "Model the recall targets; matches Appliance by (brand, model)" }
      - { name: description, type: string, source: input, description: "Safety description" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVE | RESCINDED (see 1.2)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceRequest
    initial_state: INTAKE
    terminal_states: [COMPLETED, DECLINED, SAFETY_HOLD]
    transitions:
      - from: INTAKE
        to: SCHEDULED
        trigger: "POST /service-requests/{id}/appointments"
        actor: Dispatcher
        preconditions:
          - "Appliance.recall_status == CLEAR (ERR_SAFETY_RECALL_HOLD)"
          - "Technician.status == ON_DUTY (ERR_TECHNICIAN_OFF_DUTY)"
          - "No buffered timeline conflict on the technician (ERR_TECH_DOUBLE_BOOKED)"
          - "Zone concurrent-window capacity not exceeded (ERR_ZONE_CAPACITY_EXCEEDED)"
          - "window_end > window_start (ERR_VALIDATION)"
        side_effects:
          - "Create Appointment{status:BOOKED} for this request/technician/zone/window"
          - "Set ServiceRequest.assigned_technician_id = Appointment.technician_id"
          - "Increment ServiceRequest.visit_count by 1"
      - from: AWAITING_PARTS
        to: SCHEDULED
        trigger: "POST /service-requests/{id}/appointments"
        actor: Dispatcher
        preconditions:
          - "Every PartsOrder for this request has status RECEIVED (ERR_PARTS_NOT_READY)"
          - "Appliance.recall_status == CLEAR (ERR_SAFETY_RECALL_HOLD)"
          - "Technician.status == ON_DUTY (ERR_TECHNICIAN_OFF_DUTY)"
          - "No buffered timeline conflict on the technician (ERR_TECH_DOUBLE_BOOKED)"
          - "Zone concurrent-window capacity not exceeded (ERR_ZONE_CAPACITY_EXCEEDED)"
        side_effects:
          - "Create Appointment{status:BOOKED} (callback visit)"
          - "Set ServiceRequest.assigned_technician_id = Appointment.technician_id"
          - "Increment ServiceRequest.visit_count by 1"
        note: "Cyclic loop back into SCHEDULED — the callback visit."
      - from: SCHEDULED
        to: DIAGNOSED
        trigger: "POST /service-requests/{id}/diagnose"
        actor: Technician
        preconditions:
          - "Acting Technician.id == ServiceRequest.assigned_technician_id (ERR_NOT_OWNER)"
          - "No Estimate already exists for this request (ERR_INVALID_STATE)"
          - "Appliance.recall_status == CLEAR (ERR_SAFETY_RECALL_HOLD)"
        side_effects:
          - "Run warranty_contract_selector -> set warranty_routing and covering_contract_id"
          - "Set diagnostic_fee_cents = 8900 if warranty_routing==NONE else 0"
          - "Set health_score_at_diagnosis = appliance_health_score(at_diagnosis)"
          - "Create Estimate{status:PENDING_APPROVAL} with estimated_* computed from labor_tasks/required_parts"
          - "Current BOOKED Appointment -> COMPLETED"
      - from: DIAGNOSED
        to: APPROVED
        trigger: "POST /estimates/{id}/decision (decision=APPROVE)"
        actor: Customer
        preconditions:
          - "Acting Customer.id == ServiceRequest.customer_id (ERR_NOT_OWNER)"
          - "Estimate.status == PENDING_APPROVAL (ERR_ESTIMATE_NOT_PENDING)"
          - "Appliance.recall_status == CLEAR (ERR_SAFETY_RECALL_HOLD)"
          - "For every required_parts line, assigned technician's TruckStockItem.quantity_available >= quantity (ERR_INSUFFICIENT_TRUCK_STOCK)"
        side_effects:
          - "Estimate -> APPROVED"
          - "Reserve parts: for each required_parts line, TruckStockItem.quantity_reserved += quantity (compensating_invariant: truck_stock)"
          - "Commit warranty claim: covering_contract.claimed_cents += provisional warranty_covered_cents (compensating_invariant: warranty_ledger)"
          - "Set ServiceRequest.warranty_covered_cents / customer_responsibility_cents to provisional values"
      - from: DIAGNOSED
        to: DECLINED
        trigger: "POST /estimates/{id}/decision (decision=DECLINE)"
        actor: Customer
        preconditions:
          - "Acting Customer.id == ServiceRequest.customer_id (ERR_NOT_OWNER)"
          - "Estimate.status == PENDING_APPROVAL (ERR_ESTIMATE_NOT_PENDING)"
        side_effects:
          - "Estimate -> DECLINED"
          - "Set ServiceRequest.amount_due_cents = diagnostic_fee_cents (diagnostic owed, no repair)"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /service-requests/{id}/complete"
        actor: Technician
        preconditions:
          - "Acting Technician.id == ServiceRequest.assigned_technician_id (ERR_NOT_OWNER)"
          - "Appliance.recall_status == CLEAR (ERR_SAFETY_RECALL_HOLD)"
        side_effects:
          - "Consume parts: for each required_parts line, TruckStockItem.quantity_on_hand -= quantity and quantity_reserved -= quantity"
          - "Compute final_labor_total_cents from actual_labor_tasks (labor_cost), final_parts_total_cents from required_parts"
          - "Set final_repair_subtotal_cents; reconcile warranty_covered_cents to final; adjust covering_contract.claimed_cents by (final_covered - provisional_covered)"
          - "Set customer_responsibility_cents and amount_due_cents (final)"
          - "Appliance.completed_repair_count += 1 (recomputes Appliance.health_score)"
          - "Current BOOKED Appointment -> COMPLETED"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /service-requests/{id}/complete"
        actor: Technician
        preconditions:
          - "Acting Technician.id == ServiceRequest.assigned_technician_id (ERR_NOT_OWNER)"
          - "An APPROVED Estimate exists for this request (callback visit) (ERR_INVALID_STATE)"
          - "Appliance.recall_status == CLEAR (ERR_SAFETY_RECALL_HOLD)"
        side_effects:
          - "Same completion side-effects as APPROVED->COMPLETED"
        note: "Second half of the callback loop: repair finished on the return visit."
      - from: APPROVED
        to: AWAITING_PARTS
        trigger: "POST /service-requests/{id}/second-trip"
        actor: Technician
        preconditions:
          - "Acting Technician.id == ServiceRequest.assigned_technician_id (ERR_NOT_OWNER)"
        side_effects:
          - "Create PartsOrder{status:ORDERED} for the requested depot part (transitive cascade origin)"
          - "Current BOOKED Appointment -> CANCELLED (caused by entering AWAITING_PARTS)"
          - "Cancelled appointment releases its zone concurrent-window slot (caused by the appointment cancellation)"
      - from: SCHEDULED
        to: SAFETY_HOLD
        trigger: "system: RecallNotice activation cascade"
        actor: system
        preconditions:
          - "Appliance.recall_status became RECALLED (a matching RecallNotice reached ACTIVE)"
        side_effects:
          - "Current BOOKED Appointment -> CANCELLED and its zone slot released"
      - from: APPROVED
        to: SAFETY_HOLD
        trigger: "system: RecallNotice activation cascade"
        actor: system
        preconditions:
          - "Appliance.recall_status became RECALLED (a matching RecallNotice reached ACTIVE)"
        side_effects:
          - "Release reservations: for each required_parts line, TruckStockItem.quantity_reserved -= quantity (compensating_invariant: truck_stock)"
          - "Reverse warranty claim: covering_contract.claimed_cents -= committed warranty_covered_cents (compensating_invariant: warranty_ledger)"
          - "Current BOOKED Appointment -> CANCELLED and its zone slot released"
        note: "Applies analogously from INTAKE / DIAGNOSED / AWAITING_PARTS; only the reservation/claim reversal differs by whether an APPROVED reservation exists."

  - entity: Estimate
    initial_state: PENDING_APPROVAL
    terminal_states: [APPROVED, DECLINED, SUPERSEDED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /estimates/{id}/decision (decision=APPROVE)"
        actor: Customer
        preconditions: ["Drives ServiceRequest DIAGNOSED->APPROVED (see above)"]
        side_effects: ["Parent ServiceRequest transitions to APPROVED"]
      - from: PENDING_APPROVAL
        to: DECLINED
        trigger: "POST /estimates/{id}/decision (decision=DECLINE)"
        actor: Customer
        preconditions: ["Drives ServiceRequest DIAGNOSED->DECLINED"]
        side_effects: ["Parent ServiceRequest transitions to DECLINED"]
      - from: PENDING_APPROVAL
        to: SUPERSEDED
        trigger: "POST /service-requests/{id}/estimates (technician issues a revised estimate)"
        actor: Technician
        preconditions: ["A prior PENDING_APPROVAL estimate exists on the request"]
        side_effects: ["Prior estimate -> SUPERSEDED; a fresh PENDING_APPROVAL estimate is created; ServiceRequest.version += 1"]
        note: "Branching fork: divergent side-effect sets for APPROVED vs DECLINED vs SUPERSEDED."

  - entity: PartsOrder
    initial_state: ORDERED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /parts-orders/{id}/status (to_status=RECEIVED)"
        actor: Technician
        preconditions: []
        side_effects: []
      - from: ORDERED
        to: BACKORDERED
        trigger: "POST /parts-orders/{id}/status (to_status=BACKORDERED)"
        actor: Technician
        preconditions: []
        side_effects: []
      - from: BACKORDERED
        to: ORDERED
        trigger: "POST /parts-orders/{id}/status (to_status=ORDERED)"
        actor: Technician
        preconditions: []
        side_effects: []
        note: "Cyclic retry loop ORDERED<->BACKORDERED."
      - from: ORDERED
        to: CANCELLED
        trigger: "system: parent ServiceRequest reaches a terminal/hold state"
        actor: system
        preconditions: []
        side_effects: []
      - from: BACKORDERED
        to: CANCELLED
        trigger: "system: parent ServiceRequest reaches a terminal/hold state"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "system: diagnose or complete on the parent ServiceRequest"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "system: second-trip, estimate decline, or recall cascade on the parent ServiceRequest"
        actor: system
        preconditions: []
        side_effects: ["Release the zone concurrent-window slot occupied by this appointment"]

  - entity: Technician
    initial_state: ON_DUTY
    terminal_states: []
    transitions:
      - from: ON_DUTY
        to: OFF_DUTY
        trigger: "POST /technicians/{id}/status (to_status=OFF_DUTY)"
        actor: Technician
        preconditions: ["Acting Technician.id == path technician id OR actor is ServiceAdmin (ERR_NOT_OWNER)"]
        side_effects: []
      - from: OFF_DUTY
        to: ON_DUTY
        trigger: "POST /technicians/{id}/status (to_status=ON_DUTY)"
        actor: Technician
        preconditions: []
        side_effects: []

  - entity: RecallNotice
    initial_state: ISSUED
    terminal_states: [RESCINDED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /recalls/{id}/status (to_status=ACTIVE)"
        actor: ServiceAdmin
        preconditions: []
        side_effects:
          - "Every Appliance matching (brand, model) -> recall_status RECALLED (cascade link 1)"
          - "Every non-terminal ServiceRequest on a now-RECALLED appliance -> SAFETY_HOLD, reversing any reservation/claim (cascade link 2)"
          - "Each SAFETY_HOLD request's BOOKED Appointment -> CANCELLED, releasing its zone slot (cascade link 3)"
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /recalls/{id}/status (to_status=RESCINDED)"
        actor: ServiceAdmin
        preconditions: []
        side_effects:
          - "Matching appliances with no other ACTIVE recall -> recall_status CLEAR"
        note: "One-way for requests: SAFETY_HOLD requests are terminal and do not auto-resume."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: estimate-revision-stale-request
    parent_entity: ServiceRequest
    write_endpoint: "POST /service-requests/{id}/estimates"
    occ_field: "expected_service_request_version"
    description: |
      Issuing a revised Estimate against a ServiceRequest whose version has
      advanced since the technician last read it is rejected. A revised estimate
      legitimately supersedes the current PENDING_APPROVAL estimate while the
      request stays in DIAGNOSED, so a second sequential revision that still
      carries the previously observed version encodes a stale view of the
      request (another revision already superseded the estimate and advanced the
      version). The stale-version writer is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: labor_cost
    trigger: "estimate creation (diagnose / revision) and repair completion"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round-up PER TASK, THEN sum.
      labor_cost_cents = 0
      for task in labor_tasks:          # each task = { minutes: int }
        quarters = ceil(task.minutes / 15)      # round UP each task independently
        labor_cost_cents += quarters * LABOR_QUARTER_CENTS
      return labor_cost_cents
      # Note: summing minutes first then rounding (ceil(total/15)) is WRONG and
      # generally yields a smaller value; do not do it.
    input_set: "All labor_tasks on the estimate (for estimate variant) or all actual_labor_tasks passed to complete (for final variant)"
    constants: { LABOR_QUARTER_CENTS: 3000 }
    precision: "integer cents; ceil at the per-task quarter-hour step"

  - name: repair_cost
    trigger: "estimate variant on diagnose/revision; final variant on complete"
    algorithm: forward_looking
    formula: |
      repair_subtotal_cents = parts_total_cents + labor_cost_cents
      total_cents = repair_subtotal_cents + diagnostic_effective_cents   # diagnostic per diagnostic_fee_assessment
    input_set: "estimate variant uses Estimate.required_parts + Estimate.labor_tasks; final variant uses ServiceRequest.required_parts (as reserved) + actual_labor_tasks"
    constants: {}
    precision: "integer cents"
    variants:
      - name: estimate
        when: "computed at diagnosis and on each revision; stored on Estimate.estimated_* fields"
        difference: "Uses the technician's ESTIMATED labor_tasks; parts priced at catalog unit_price_cents * estimated quantity"
      - name: final
        when: "computed at completion; stored on ServiceRequest.final_* fields"
        difference: "Uses ACTUAL labor tasks recorded at completion; parts = the reserved required_parts actually consumed. Diverges from estimate whenever actual labor differs from estimated labor."

  - name: warranty_customer_responsibility
    trigger: "estimate variant on diagnose; final variant on complete"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs (repair_subtotal, cap_remaining, deductible, routing, recall)
      # with nested min/max and branch-on-state — evaluation order pinned below.
      cap_remaining = coverage_cap_cents - claimed_cents        # 0 if no contract
      if recall_applies:                                        # active recall covers repair
        warranty_covered = 0; customer_responsibility = 0
      elif routing == NONE:
        warranty_covered = 0
        customer_responsibility = repair_subtotal + diagnostic_effective_cents
      elif routing == MANUFACTURER:
        warranty_covered = min(repair_subtotal, cap_remaining)
        customer_responsibility = repair_subtotal - warranty_covered     # over-cap overflow only
      elif routing in (EXTENDED, HOME_WARRANTY):
        warranty_covered = min(repair_subtotal, cap_remaining)
        customer_responsibility = deductible_cents + (repair_subtotal - warranty_covered)
      return (warranty_covered, customer_responsibility)
    input_set: "repair_subtotal from repair_cost; cap_remaining/deductible from covering WarrantyContract; routing from ServiceRequest; recall_applies from Appliance.recall_status"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "at APPROVE, from the estimate subtotal; committed to claimed_cents"
        difference: "warranty_covered based on estimated repair subtotal"
      - name: final
        when: "at COMPLETE, from the final subtotal; claimed_cents reconciled by the delta"
        difference: "warranty_covered based on actual repair subtotal"

  - name: diagnostic_fee_assessment
    trigger: "diagnosis (provisional) and completion / decline (effective)"
    algorithm: threshold
    formula: |
      # CIRCULAR-LOOKING dependency, order pinned:
      # (1) compute repair_subtotal = parts_total + labor_cost
      # (2) diagnostic_effective depends on the subtotal TIER + approval, NOT on total
      # (3) total = repair_subtotal + diagnostic_effective
      if routing != NONE:
        diagnostic_effective_cents = 0                 # warranty routings waive it
      elif request_completed AND repair_subtotal >= WAIVER_THRESHOLD_CENTS:
        diagnostic_effective_cents = 0                 # waived when repair approved+done and big enough
      else:
        diagnostic_effective_cents = DIAGNOSTIC_FEE_CENTS
    input_set: "routing, repair_subtotal (from repair_cost), whether the request reached COMPLETED"
    constants: { DIAGNOSTIC_FEE_CENTS: 8900, WAIVER_THRESHOLD_CENTS: 15000 }
    precision: "integer cents; boundary is >= (subtotal exactly 15000 waives)"

  - name: appliance_health_score
    trigger: "at_diagnosis variant at diagnosis; post_completion variant is Appliance.health_score, recomputed on completion"
    algorithm: weighted_scoring
    formula: |
      age_years = floor((service_date - purchase_date) / 365 days)   # service_date = diagnosis appointment window_start date
      raw = 100 - age_years*W_AGE - prior_repairs*W_REPAIR - (RECALLED ? W_RECALL : 0)
      score = max(0, min(100, raw))
    input_set: "appliance purchase_date; prior_repairs = count of this appliance's COMPLETED ServiceRequests; recall_status"
    constants: { W_AGE: 5, W_REPAIR: 8, W_RECALL: 20 }
    precision: "integer 0..100 with floor/ceiling clamp"
    variants:
      - name: at_diagnosis
        when: "captured on ServiceRequest.health_score_at_diagnosis at diagnosis"
        difference: "prior_repairs EXCLUDES the current in-flight request (which is not yet COMPLETED)"
      - name: post_completion
        when: "Appliance.health_score after this request completes"
        difference: "prior_repairs INCLUDES the just-completed request (+1), lowering the score by W_REPAIR"

  - name: warranty_contract_selector
    trigger: "diagnosis"
    algorithm: forward_looking
    formula: |
      candidates = WarrantyContract where appliance_id == request.appliance_id
                   AND coverage_start <= service_date <= coverage_end   # inclusive both ends
      if candidates empty: routing = NONE; covering_contract_id = null
      else:
        rank order (best first): MANUFACTURER(0) < EXTENDED(1) < HOME_WARRANTY(2)
        tie-break within same coverage_type: earliest created_at ASC
        pick best; routing = its coverage_type; covering_contract_id = its id
    input_set: "Active-by-date WarrantyContracts for the appliance; service_date = diagnosis appointment window_start date"
    constants: {}
    precision: "deterministic selection; created_at tie-break, never id"

  - name: technician_timeline_conflict
    trigger: "appointment creation (schedule / reschedule)"
    algorithm: interval_merge
    formula: |
      # PAIRWISE, half-open [start,end), with a symmetric travel BUFFER.
      conflict(existing, new) =
        (new.window_start < existing.window_end + BUFFER)
        AND (existing.window_start < new.window_end + BUFFER)
      # over all BOOKED appointments of the SAME technician. Any conflict rejects.
    input_set: "BOOKED Appointments whose technician_id == candidate technician"
    constants: { TRAVEL_BUFFER_MIN: 30 }
    precision: "minute granularity; adjacency within 30 min is a conflict"

  - name: zone_capacity_conflict
    trigger: "appointment creation (schedule / reschedule)"
    algorithm: aggregation
    formula: |
      # AGGREGATE capacity, half-open [start,end), NO buffer.
      overlapping = count of BOOKED Appointments in the SAME zone where
        (new.window_start < a.window_end) AND (a.window_start < new.window_end)
      if overlapping + 1 > zone.max_concurrent_appointments: reject
    input_set: "BOOKED Appointments whose zone_id == candidate zone"
    constants: {}
    precision: "integer count; strict overlap, adjacency (gap==0) does NOT count"

  - name: truck_stock_availability
    trigger: "reserve (approve), consume (complete), release (recall/hold)"
    algorithm: aggregation
    formula: |
      quantity_available = quantity_on_hand - quantity_reserved
      reserve(q):  quantity_reserved += q
      release(q):  quantity_reserved -= q       # exact inverse of reserve
      consume(q):  quantity_on_hand -= q ; quantity_reserved -= q
    input_set: "the assigned technician's TruckStockItem for each required part"
    constants: {}
    precision: "integer units; reserve boundary is quantity_available >= q (>=, not >)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per RBAC (1.7)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "Estimate is PENDING_APPROVAL when a decision is submitted"
    error_id: ERR_ESTIMATE_NOT_PENDING
    http_status: 409
    applies_to: "POST /estimates/{id}/decision"

  - priority: 6
    category: business_referential
    check: "Acting Customer/Technician owns the resource (X-User-ID equals the FK owner)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "diagnose, complete, second-trip, estimate revision, estimate decision, payments, truck-stock, technician status"

  - priority: 7
    category: business_safety
    check: "Appliance.recall_status == CLEAR for schedule/diagnose/approve/complete"
    error_id: ERR_SAFETY_RECALL_HOLD
    http_status: 409
    applies_to: "appointments, diagnose, estimate approve, complete"

  - priority: 8
    category: business_referential
    check: "Assigned Technician.status == ON_DUTY when scheduling; all PartsOrders RECEIVED when rescheduling from AWAITING_PARTS"
    error_id: ERR_TECHNICIAN_OFF_DUTY
    http_status: 409
    applies_to: "POST /service-requests/{id}/appointments"

  - priority: 9
    category: business_referential
    check: "Rescheduling from AWAITING_PARTS requires every PartsOrder RECEIVED"
    error_id: ERR_PARTS_NOT_READY
    http_status: 409
    applies_to: "POST /service-requests/{id}/appointments (from AWAITING_PARTS)"

  - priority: 10
    category: business_temporal
    check: "Technician has no buffered timeline conflict (technician_timeline_conflict)"
    error_id: ERR_TECH_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /service-requests/{id}/appointments"

  - priority: 11
    category: business_constraint
    check: "Zone concurrent-window capacity not exceeded (zone_capacity_conflict)"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /service-requests/{id}/appointments"

  - priority: 12
    category: business_constraint
    check: "TruckStockItem uniqueness: at most one line per (technician_id, part_id)"
    error_id: ERR_DUPLICATE_TRUCK_STOCK
    http_status: 409
    applies_to: "POST /truck-stock"

  - priority: 13
    category: business_fiscal
    check: "Assigned technician has quantity_available >= quantity for every required_parts line at approval"
    error_id: ERR_INSUFFICIENT_TRUCK_STOCK
    http_status: 409
    applies_to: "POST /estimates/{id}/decision (APPROVE)"

  - priority: 14
    category: business_fiscal
    check: "Payment.amount_cents equals ServiceRequest.amount_due_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /service-requests/{id}/payments"

  - priority: 15
    category: state
    check: "expected_service_request_version matches ServiceRequest.version (OCC on revision)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /service-requests/{id}/estimates"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [ServiceAdmin]
    code: 201
    input: [full_name, email, phone, address]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Appliance ---
  - method: POST
    path: "/appliances"
    description: "Register an appliance for a customer"
    roles: [Customer, ServiceAdmin]
    code: 201
    input: [customer_id, brand, model, serial_number, purchase_date]
    output: Appliance
    side_effects: ["recall_status computed CLEAR (or RECALLED if a matching ACTIVE recall already exists)"]
  - method: GET
    path: "/appliances/{id}"
    description: "Fetch an appliance (recall_status, health_score, completed_repair_count)"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: Appliance
    side_effects: []
  - method: GET
    path: "/appliances"
    description: "List/lookup appliances; filter by owner"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: ["customer_id?"]
    output: Appliance[]
    side_effects: []

  # --- WarrantyContract ---
  - method: POST
    path: "/warranty-contracts"
    description: "Create a warranty contract on an appliance"
    roles: [ServiceAdmin]
    code: 201
    input: [appliance_id, coverage_type, coverage_start, coverage_end, deductible_cents, coverage_cap_cents]
    output: WarrantyContract
    side_effects: ["claimed_cents=0; remaining_coverage_cents=coverage_cap_cents"]
  - method: GET
    path: "/warranty-contracts/{id}"
    description: "Fetch a warranty contract (claimed_cents, remaining_coverage_cents)"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: WarrantyContract
    side_effects: []
  - method: GET
    path: "/warranty-contracts"
    description: "List warranty contracts; filter by appliance"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: ["appliance_id?"]
    output: WarrantyContract[]
    side_effects: []

  # --- Part ---
  - method: POST
    path: "/parts"
    description: "Create a catalog part"
    roles: [ServiceAdmin]
    code: 201
    input: [part_number, name, unit_price_cents]
    output: Part
    side_effects: []

  # --- Technician ---
  - method: POST
    path: "/technicians"
    description: "Create a technician"
    roles: [ServiceAdmin]
    code: 201
    input: [full_name]
    output: Technician
    side_effects: ["status=ON_DUTY"]
  - method: GET
    path: "/technicians/{id}"
    description: "Fetch a technician (status)"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: POST
    path: "/technicians/{id}/status"
    description: "Toggle technician ON_DUTY/OFF_DUTY"
    roles: [Technician, ServiceAdmin]
    code: 200
    input: [to_status]
    output: Technician
    side_effects: ["Technician state transition"]

  # --- TruckStockItem ---
  - method: POST
    path: "/truck-stock"
    description: "Create a truck-stock line for a technician+part"
    roles: [Technician, ServiceAdmin]
    code: 201
    input: [technician_id, part_id, quantity_on_hand]
    output: TruckStockItem
    side_effects: ["quantity_reserved=0; quantity_available=quantity_on_hand"]
  - method: GET
    path: "/truck-stock/{id}"
    description: "Fetch a truck-stock line"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: TruckStockItem
    side_effects: []
  - method: GET
    path: "/truck-stock"
    description: "List truck-stock lines; filter by technician and/or part"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: ["technician_id?", "part_id?"]
    output: TruckStockItem[]
    side_effects: []

  # --- ServiceZone ---
  - method: POST
    path: "/service-zones"
    description: "Create a dispatch zone"
    roles: [ServiceAdmin, Dispatcher]
    code: 201
    input: [name, max_concurrent_appointments]
    output: ServiceZone
    side_effects: []

  # --- ServiceRequest ---
  - method: POST
    path: "/service-requests"
    description: "Open a service request for a customer's appliance"
    roles: [Customer, ServiceAdmin]
    code: 201
    input: [customer_id, appliance_id, reported_issue]
    output: ServiceRequest
    side_effects: ["status=INTAKE; version=1"]
  - method: GET
    path: "/service-requests/{id}"
    description: "Fetch a service request (status, routing, fees, version)"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []
  - method: GET
    path: "/service-requests"
    description: "List/lookup service requests"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: ["customer_id?", "appliance_id?", "assigned_technician_id?", "covering_contract_id?", "status?"]
    output: ServiceRequest[]
    side_effects: []
  - method: POST
    path: "/service-requests/{id}/appointments"
    description: "Schedule (from INTAKE) or reschedule callback (from AWAITING_PARTS) a dispatch appointment"
    roles: [Dispatcher, ServiceAdmin]
    code: 201
    input: [technician_id, zone_id, window_start, window_end]
    output: Appointment
    side_effects:
      - "ServiceRequest INTAKE->SCHEDULED or AWAITING_PARTS->SCHEDULED"
      - "Sets ServiceRequest.assigned_technician_id; increments visit_count"
  - method: POST
    path: "/service-requests/{id}/diagnose"
    description: "Technician records diagnosis; computes routing/diagnostic fee and creates the estimate"
    roles: [Technician]
    code: 201
    input: [labor_tasks, required_parts]
    output: Estimate
    side_effects:
      - "ServiceRequest SCHEDULED->DIAGNOSED; warranty_routing/covering_contract_id/diagnostic_fee_cents/health_score_at_diagnosis set"
      - "Creates Estimate PENDING_APPROVAL; BOOKED Appointment -> COMPLETED"
  - method: POST
    path: "/service-requests/{id}/estimates"
    description: "Technician issues a revised estimate (supersedes prior); OCC-guarded on ServiceRequest.version"
    roles: [Technician]
    code: 201
    input: [labor_tasks, required_parts, expected_service_request_version]
    output: Estimate
    side_effects:
      - "Prior PENDING_APPROVAL Estimate -> SUPERSEDED; new PENDING_APPROVAL Estimate created"
      - "increments ServiceRequest.version by 1"
  - method: POST
    path: "/service-requests/{id}/complete"
    description: "Technician completes the repair (from APPROVED same-visit or SCHEDULED callback)"
    roles: [Technician]
    code: 200
    input: [actual_labor_tasks]
    output: ServiceRequest
    side_effects:
      - "Consumes reserved parts; computes final_* totals; reconciles warranty claim; sets amount_due_cents"
      - "ServiceRequest -> COMPLETED; Appliance.completed_repair_count += 1 (health_score recomputed); Appointment -> COMPLETED"
  - method: POST
    path: "/service-requests/{id}/second-trip"
    description: "Technician orders a depot part and defers to a callback visit"
    roles: [Technician]
    code: 200
    input: [part_id, quantity]
    output: ServiceRequest
    side_effects:
      - "ServiceRequest APPROVED->AWAITING_PARTS; creates PartsOrder ORDERED"
      - "BOOKED Appointment -> CANCELLED; zone slot released (transitive cascade)"
  - method: POST
    path: "/service-requests/{id}/payments"
    description: "Record a payment against a request's amount_due_cents"
    roles: [Customer, ServiceAdmin]
    code: 201
    input: [amount_cents, method]
    output: Payment
    side_effects: ["Payment status=RECORDED"]

  # --- Estimate ---
  - method: GET
    path: "/estimates/{id}"
    description: "Fetch an estimate"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: Estimate
    side_effects: []
  - method: GET
    path: "/estimates"
    description: "List estimates; filter by request"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: ["service_request_id?"]
    output: Estimate[]
    side_effects: []
  - method: POST
    path: "/estimates/{id}/decision"
    description: "Customer approves or declines the pending estimate"
    roles: [Customer]
    code: 200
    input: [decision]
    output: Estimate
    side_effects:
      - "APPROVE: ServiceRequest->APPROVED, reserve parts, commit warranty claim"
      - "DECLINE: ServiceRequest->DECLINED, set amount_due_cents=diagnostic owed"

  # --- PartsOrder ---
  - method: GET
    path: "/parts-orders/{id}"
    description: "Fetch a parts order"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: PartsOrder
    side_effects: []
  - method: GET
    path: "/parts-orders"
    description: "List parts orders; filter by request and/or part"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: ["service_request_id?", "part_id?"]
    output: PartsOrder[]
    side_effects: []
  - method: POST
    path: "/parts-orders/{id}/status"
    description: "Advance a depot parts order (ORDERED/BACKORDERED/RECEIVED loop)"
    roles: [Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: [to_status]
    output: PartsOrder
    side_effects: ["PartsOrder state transition"]

  # --- Payment ---
  - method: GET
    path: "/payments/{id}"
    description: "Fetch a payment"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List payments; filter by request"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: ["service_request_id?"]
    output: Payment[]
    side_effects: []

  # --- Appointment ---
  - method: GET
    path: "/appointments/{id}"
    description: "Fetch an appointment"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments; filter by request, technician, and/or zone"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: ["service_request_id?", "technician_id?", "zone_id?"]
    output: Appointment[]
    side_effects: []

  # --- RecallNotice ---
  - method: POST
    path: "/recalls"
    description: "Create a recall notice (ISSUED)"
    roles: [ServiceAdmin]
    code: 201
    input: [brand, model, description]
    output: RecallNotice
    side_effects: ["status=ISSUED"]
  - method: GET
    path: "/recalls/{id}"
    description: "Fetch a recall notice"
    roles: [Customer, Technician, Dispatcher, ServiceAdmin]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []
  - method: POST
    path: "/recalls/{id}/status"
    description: "Activate or rescind a recall; activation cascades safety holds"
    roles: [ServiceAdmin]
    code: 200
    input: [to_status]
    output: RecallNotice
    side_effects:
      - "ACTIVE: matching appliances -> RECALLED; their non-terminal requests -> SAFETY_HOLD; those requests' appointments -> CANCELLED"
      - "RESCINDED: matching appliances -> CLEAR (if no other ACTIVE recall)"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting entity-backed user does not own the resource (X-User-ID != FK owner)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum, or window_end <= window_start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits this transition" }
  - { id: ERR_ESTIMATE_NOT_PENDING, http: 409, condition: "Decision submitted on an estimate that is not PENDING_APPROVAL" }
  - { id: ERR_SAFETY_RECALL_HOLD, http: 409, condition: "Operation blocked because the appliance is under an ACTIVE recall (recall_status RECALLED)" }
  - { id: ERR_TECHNICIAN_OFF_DUTY, http: 409, condition: "Assigned technician is OFF_DUTY at scheduling" }
  - { id: ERR_PARTS_NOT_READY, http: 409, condition: "Reschedule from AWAITING_PARTS attempted while some PartsOrder is not RECEIVED" }
  - { id: ERR_TECH_DOUBLE_BOOKED, http: 409, condition: "Technician has a buffered timeline conflict for the window" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED, http: 409, condition: "Zone concurrent-window capacity would be exceeded" }
  - { id: ERR_DUPLICATE_TRUCK_STOCK, http: 409, condition: "A truck-stock line already exists for (technician_id, part_id)" }
  - { id: ERR_INSUFFICIENT_TRUCK_STOCK, http: 409, condition: "Assigned technician lacks quantity_available for a required part at approval" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount does not equal amount_due_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_service_request_version does not match current ServiceRequest.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Homeowner: registers appliances, opens requests, approves/declines estimates, pays."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /estimates/{id}/decision — approve/decline own request's estimate"
    shared_operations:
      - "POST /appliances (own appliances; shared with ServiceAdmin)"
      - "POST /service-requests (own; shared with ServiceAdmin)"
      - "POST /service-requests/{id}/payments (own; shared with ServiceAdmin)"
      - "GET endpoints (read)"

  - name: Technician
    description: "Field technician: diagnoses, revises estimates, completes repairs, orders depot parts, manages own truck stock and duty status."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /service-requests/{id}/diagnose"
      - "POST /service-requests/{id}/estimates (revision)"
      - "POST /service-requests/{id}/complete"
      - "POST /service-requests/{id}/second-trip"
    shared_operations:
      - "POST /truck-stock (own; shared with ServiceAdmin)"
      - "POST /technicians/{id}/status (own; shared with ServiceAdmin)"
      - "POST /parts-orders/{id}/status (shared with Dispatcher/ServiceAdmin)"
      - "GET endpoints (read)"

  - name: Dispatcher
    description: "Scheduling/routing operator: books appointments, manages zones, advances parts orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-requests/{id}/appointments"
    shared_operations:
      - "POST /service-zones (shared with ServiceAdmin)"
      - "POST /parts-orders/{id}/status (shared with Technician/ServiceAdmin)"
      - "GET endpoints (read)"

  - name: ServiceAdmin
    description: "Back-office admin: manages customers, catalog parts, warranty contracts, recalls; superset operator."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /parts"
      - "POST /warranty-contracts"
      - "POST /technicians"
      - "POST /recalls"
      - "POST /recalls/{id}/status"
    shared_operations:
      - "POST /appliances, POST /service-requests, POST /service-requests/{id}/payments"
      - "POST /truck-stock, POST /technicians/{id}/status, POST /service-zones, POST /parts-orders/{id}/status"
      - "GET endpoints (read)"
