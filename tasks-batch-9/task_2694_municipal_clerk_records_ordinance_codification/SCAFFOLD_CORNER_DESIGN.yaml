scaffold_corner_design:

  # ===================================================================
  # SECTION 1 — entities (§1.1)
  # ===================================================================
  - section: entities
    instances:

      - name: create_venue_with_required_fields_returns_201_with_defaults
        claim_type: creation
        grounds: ["entities.Venue.fields.teardown_buffer_minutes", "endpoints[POST /clerk/venues]"]
        distinguishing_aspect: "POST /clerk/venues with only name, address and capacity returns 201 with teardown_buffer_minutes 30, status AVAILABLE and version 1."
        test_recipe:
          setup: ["Empty database; the logical clock sits at its declared default 2026-08-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Venue.${venue}.name == 'Council Chamber'"
            - "Venue.${venue}.capacity == 120"
            - "Venue.${venue}.teardown_buffer_minutes == 30"
            - "Venue.${venue}.status == AVAILABLE"
            - "Venue.${venue}.version == 1"

      - name: read_number_series_returns_the_stored_minting_state
        claim_type: retrieval
        grounds: ["entities.NumberSeries.fields.next_sequence", "endpoints[GET /clerk/number-series/{series_id}]"]
        distinguishing_aspect: "GET /clerk/number-series/{series_id} returns the same prefix, series_year, next_sequence 5 and minted_count 0 that creation stored."
        test_recipe:
          setup: ["One ORDINANCE number series for 2026 opened at next_sequence 5."]
          setup_api_calls:
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD", next_sequence: 5 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns: $.data.id }
          trigger:
            - call: "GET /clerk/number-series/${ns}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "HTTP status == 200"
            - "NumberSeries.${ns}.series_year == 2026"
            - "NumberSeries.${ns}.instrument_class == ORDINANCE"
            - "NumberSeries.${ns}.prefix == 'ORD'"
            - "NumberSeries.${ns}.next_sequence == 5"
            - "NumberSeries.${ns}.minted_count == 0"
            - "NumberSeries.${ns}.status == OPEN"

      - name: list_meetings_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints[GET /clerk/meetings]", "entities.Meeting.fields.venue_id"]
        distinguishing_aspect: "With three meetings on one venue, GET /clerk/meetings?venue_id=…&limit=2&offset=0 returns 2 items, total_count 3 and has_more true; offset 2 returns 1 item and has_more false."
        test_recipe:
          setup: ["One venue holding three non-overlapping SCHEDULED meetings."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-01T18:00:00Z", scheduled_end: "2026-09-01T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-10-06T18:00:00Z", scheduled_end: "2026-10-06T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "GET /clerk/meetings"
              payload: { venue_id: "${venue}", limit: 2, offset: 0 }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/meetings"
              payload: { venue_id: "${venue}", limit: 2, offset: 2 }
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "the first list returns HTTP 200 with len(data) == 2, meta.total_count == 3 and meta.has_more == true"
            - "the second list returns len(data) == 1, meta.total_count == 3 and meta.has_more == false"

      - name: get_meeting_with_unknown_id_returns_meeting_not_found
        claim_type: not_found
        grounds: ["validations[priority=10]", "errors[ERR_MEETING_NOT_FOUND]"]
        distinguishing_aspect: "GET /clerk/meetings/{meeting_id} for an id that was never issued returns 404 with error_id ERR_MEETING_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /clerk/meetings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_MEETING_NOT_FOUND"

      - name: create_meeting_missing_quorum_required_is_rejected_as_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_REQUEST]", "endpoints[POST /clerk/meetings]"]
        distinguishing_aspect: "quorum_required has no default, so omitting it from POST /clerk/meetings returns 422 with ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["One AVAILABLE venue."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
          trigger:
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /clerk/meetings?venue_id=${venue} returns total_count == 0"

      - name: create_record_series_omitting_optional_flags_applies_declared_defaults
        claim_type: defaults
        grounds: [entities.RecordSeries.fields.permanent, entities.RecordSeries.fields.legal_hold_status]
        distinguishing_aspect: "Omitting permanent and legal_hold_status from POST /clerk/record-series stores permanent false and legal_hold_status NONE, with all three custody counters at 0 and eligible_through_on null."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clerk/record-series"
              payload: { series_code: "CC-01", name: "Council correspondence", retention_years: 5, retention_trigger: "CREATION" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { series: $.data.id }
          assert:
            - "HTTP status == 201"
            - "RecordSeries.${series}.permanent == false"
            - "RecordSeries.${series}.legal_hold_status == NONE"
            - "RecordSeries.${series}.total_accessioned_count == 0"
            - "RecordSeries.${series}.active_item_count == 0"
            - "RecordSeries.${series}.destroyed_item_count == 0"
            - "RecordSeries.${series}.last_accessioned_on == null"
            - "RecordSeries.${series}.eligible_through_on == null"

      - name: packet_computed_fields_are_derived_not_supplied
        claim_type: computed_fields
        grounds: [entities.AgendaPacket.fields.revision_number, entities.AgendaPacket.fields.item_count, entities.AgendaPacket.fields.contains_public_hearing]
        distinguishing_aspect: "POST /clerk/meetings/{meeting_id}/agenda-packets accepts only expected_meeting_version and late_addendum, so revision_number 1, item_count 0 and contains_public_hearing false are all server-derived, and item_count becomes 2 with contains_public_hearing true purely as a consequence of adding items."
        test_recipe:
          setup: ["One SCHEDULED COUNCIL meeting."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
          trigger:
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 2, item_type: "PUBLIC_HEARING", title: "Public hearing on the Elm Street rezoning" }
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "immediately after creation: AgendaPacket.${pkt}.revision_number == 1, item_count == 0, contains_public_hearing == false, late_addendum == false, posted_at == null, notice_compliant == false"
            - "after both items: AgendaPacket.${pkt}.item_count == 2"
            - "after both items: AgendaPacket.${pkt}.contains_public_hearing == true"
            - "AgendaPacket.${pkt}.status == DRAFT"

      - name: system_fields_are_server_generated_and_client_input_is_ignored
        claim_type: system_fields
        grounds: ["endpoints[POST /clerk/code-titles]", "entities.CodeTitle.fields.current_supplement_number"]
        distinguishing_aspect: "POST /clerk/code-titles declares only title_number, name and status as input, so id, created_at, updated_at and version are minted by the server; extra keys in the body are ignored and version comes back as 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clerk/code-titles"
              payload: { title_number: "12", name: "Streets, Sidewalks and Public Places" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ct: $.data.id, ctv: $.data.version, ct_created: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "${ct} is a non-empty server-generated identifier"
            - "${ctv} == 1"
            - "${ct_created} is present and equal to the logical clock instant"
            - "CodeTitle.${ct}.current_supplement_number == 0"
            - "CodeTitle.${ct}.section_refs == []"
            - "CodeTitle.${ct}.status == ACTIVE"

      - name: create_meeting_with_an_invalid_body_type_enum_is_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_REQUEST]", "entities.Meeting.fields.body_type"]
        distinguishing_aspect: "body_type outside {COUNCIL, PLANNING_COMMISSION, BOARD_OF_ADJUSTMENT} returns 422 ERR_INVALID_REQUEST, and so does scheduled_end equal to scheduled_start."
        test_recipe:
          setup: ["One AVAILABLE venue."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
          trigger:
            - call: "POST /clerk/meetings"
              payload: { body_type: "SCHOOL_BOARD", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err_enum: $.data.error_id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T18:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err_window: $.data.error_id }
          assert:
            - "both calls return HTTP status 422"
            - "${err_enum} == ERR_INVALID_REQUEST"
            - "${err_window} == ERR_INVALID_REQUEST"
            - "GET /clerk/meetings?venue_id=${venue} returns total_count == 0"

      - name: agenda_item_is_immutable_with_no_update_endpoint_and_no_version_field
        claim_type: immutability
        grounds: ["entities.AgendaItem.fields.sequence_number", "endpoints[GET /clerk/agenda-items/{item_id}]"]
        distinguishing_aspect: "AgendaItem is declared with common_fields false: §1.5 exposes only POST and GET for it, the read response carries no version key, and a second item reusing sequence_number 1 is refused with ERR_DUPLICATE_SEQUENCE_NUMBER instead of overwriting the first."
        test_recipe:
          setup: ["One DRAFT packet on a SCHEDULED meeting, already carrying an item at sequence_number 1."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { item: $.data.id }
          trigger:
            - call: "GET /clerk/agenda-items/${item}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "CONSENT", title: "Consent calendar" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
          assert:
            - "the GET returns HTTP 200 and the response object has no `version` key and no `updated_at` key"
            - "AgendaItem.${item}.title == 'Quarterly finance report'"
            - "AgendaItem.${item}.item_type == REPORT"
            - "the duplicate POST returns HTTP status 422"
            - "${err} == ERR_DUPLICATE_SEQUENCE_NUMBER"
            - "GET /clerk/agenda-items?packet_id=${pkt} returns total_count == 1"

      - name: create_agenda_item_under_an_unknown_packet_returns_packet_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=10]", "errors[ERR_PACKET_NOT_FOUND]", "entities.AgendaItem.fields.packet_id"]
        distinguishing_aspect: "The AgendaItem parent is addressed in the path, so an unissued packet id returns 404 ERR_PACKET_NOT_FOUND before any body validation runs — even with an invalid item_type in the payload."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clerk/agenda-packets/00000000-0000-0000-0000-000000000000/agenda-items"
              payload: { sequence_number: 1, item_type: "NOT_A_TYPE", title: "Orphan item" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_PACKET_NOT_FOUND"
            - "${err} != ERR_INVALID_REQUEST"

      - name: motion_binds_meeting_instrument_and_minutes_across_three_aggregates
        claim_type: cross_cutting_associations
        grounds: [entities.Motion.fields.instrument_id, entities.Motion.fields.target_minutes_id, entities.Motion.fields.agenda_item_id]
        distinguishing_aspect: "The hybrid topology is realised on Motion: one row simultaneously references a Meeting (its own), an AgendaItem inside that meeting's packet, and a MinutesRecord belonging to a DIFFERENT meeting, and all three associations are readable back through the filtered motion list."
        test_recipe:
          setup: ["Meeting m1 (2026-09-15) adjourned with its minutes SUBMITTED."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { m1: $.data.id, m1v: $.data.version }
            - call: "POST /clerk/meetings/${m1}/agenda-packets"
              payload: { expected_meeting_version: "${m1v}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p1: $.data.id }
            - call: "POST /clerk/agenda-packets/${p1}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${p1}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings/${m1}/convene"
              payload: { present_member_count: 7 }
              as: PresidingOfficer
              as_user_id: "po-01"
            - call: "POST /clerk/meetings/${m1}/adjourn"
              payload: {}
              as: PresidingOfficer
              as_user_id: "po-01"
            - call: "GET /clerk/meetings/${m1}/minutes"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mr1: "$.data[0].id" }
            - call: "PUT /clerk/minutes/${mr1}"
              payload: { text_body: "Minutes of 15 September 2026." }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/minutes/${mr1}/submit"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-10-06T18:00:00Z", scheduled_end: "2026-10-06T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { m2: $.data.id, m2v: $.data.version }
            - call: "POST /clerk/meetings/${m2}/agenda-packets"
              payload: { expected_meeting_version: "${m2v}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p2: $.data.id }
            - call: "POST /clerk/agenda-packets/${p2}/agenda-items"
              payload: { sequence_number: 1, item_type: "MINUTES", title: "Approval of the minutes of 15 September 2026" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { item2: $.data.id }
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${p2}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings/${m2}/convene"
              payload: { present_member_count: 7 }
              as: PresidingOfficer
              as_user_id: "po-01"
          trigger:
            - call: "POST /clerk/motions"
              payload: { meeting_id: "${m2}", motion_type: "MINUTES_APPROVAL", majority_rule: "SIMPLE", moved_by_member_id: "cm-01", seconded_by_member_id: "cm-02", agenda_item_id: "${item2}", target_minutes_id: "${mr1}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mo: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Motion.${mo}.meeting_id == ${m2}"
            - "Motion.${mo}.agenda_item_id == ${item2}"
            - "Motion.${mo}.target_minutes_id == ${mr1}"
            - "Motion.${mo}.instrument_id == null"
            - "GET /clerk/motions?target_minutes_id=${mr1} returns total_count == 1"
            - "GET /clerk/motions?agenda_item_id=${item2} returns total_count == 1"

  # ===================================================================
  # SECTION 2 — state_machines (§1.2)
  # ===================================================================
  - section: state_machines
    instances:

      - name: posting_the_packet_moves_the_meeting_scheduled_to_noticed
        claim_type: valid_transition
        grounds: ["state_machines.Meeting[SCHEDULED->NOTICED]", "endpoints[POST /clerk/agenda-packets/{packet_id}/post]"]
        distinguishing_aspect: "One POST /clerk/agenda-packets/{packet_id}/post drives two entities: the packet DRAFT -> POSTED and the meeting SCHEDULED -> NOTICED, mirroring required_notice_hours 72 and notice_deadline_at 2026-09-12T18:00:00Z onto the meeting and bumping Meeting.version from 1 to 2."
        test_recipe:
          setup: ["A SCHEDULED COUNCIL REGULAR meeting on 2026-09-15T18:00:00Z with a one-item DRAFT packet; the logical clock sits at its default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
