              captures: { zoneb: $.data.id }
            - call: "POST /exhibit-projects/${projb}/artifacts"
              payload: { accession_number: "2020.77.1", material_class: "TEXTILE", required_rh_min_pct: 48.0, required_rh_max_pct: 52.0, max_lux: 40.0, security_class: "BASIC", condition_status: "STABLE" }
              as: Curator
              as_user_id: cur-01
              captures: { artb: $.data.id }
          trigger:
            - call: "POST /exhibit-projects/${projb}/artifact-cases"
              payload: { zone_id: "${zone1}", case_code: "C-B1", objective_code: "OBJ-CANOPY", security_tier: "BASIC", target_rh_pct: 50.0, rh_tolerance_pct: 2.0, target_lux: 40.0, uv_microwatt_per_lumen: 20.0, interior_l_cm: 100.0, interior_w_cm: 50.0, interior_h_cm: 50.0, air_exchanges_per_day: 0.5 }
              as: Curator
              as_user_id: cur-01
              captures: { x1: $.data.error_id }
            - call: "POST /artifact-cases/${case1}/placements"
              payload: { expected_case_version: "${case_v1}", artifact_id: "${artb}" }
              as: Curator
