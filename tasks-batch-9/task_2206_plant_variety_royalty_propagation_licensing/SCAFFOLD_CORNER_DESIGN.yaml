      - name: quota_frozen_error_deferred_to_difficulty_design
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - errors.ERR_QUOTA_FROZEN
        distinguishing_aspect: "ERR_QUOTA_FROZEN is triggered on the tag-issue path by the difficulty design."
        excluded_because:
          difficulty_instance: frozen_quota_state_check_outranks_tag_unit_ceiling_check
          rationale: "That instance issues against a FROZEN quota whose ceiling is also exceeded and asserts ERR_QUOTA_FROZEN."

      - name: agreement_not_active_error_deferred_to_difficulty_design
        claim_type: error_triggerable
        grounds:
          - validations[priority=11]
          - errors.ERR_AGREEMENT_NOT_ACTIVE
        distinguishing_aspect: "ERR_AGREEMENT_NOT_ACTIVE is triggered on both the submit and the line-item paths by the difficulty design."
        excluded_because:
          difficulty_instance: report_submission_requires_governing_agreement_active
          rationale: "That instance submits under a SUSPENDED agreement and asserts ERR_AGREEMENT_NOT_ACTIVE, then succeeds after reinstatement."

      - name: quota_agreement_mismatch_error_deferred_to_difficulty_design
        claim_type: error_triggerable
        grounds:
          - validations[priority=18]
          - errors.ERR_QUOTA_AGREEMENT_MISMATCH
        distinguishing_aspect: "ERR_QUOTA_AGREEMENT_MISMATCH is triggered on the line-item path by the difficulty design."
        excluded_because:
          difficulty_instance: agreement_activity_safety_check_outranks_quota_agreement_referential_check
          rationale: "That instance adds a line for a foreign agreement's quota and asserts the mismatch error once the agreement is ACTIVE."

      - name: protection_not_in_force_error_deferred_to_difficulty_design
        claim_type: error_triggerable
        grounds:
          - validations[priority=13]
          - errors.ERR_PROTECTION_NOT_IN_FORCE
        distinguishing_aspect: "ERR_PROTECTION_NOT_IN_FORCE is triggered on the sublicense-activate path by the difficulty design."
        excluded_because:
          difficulty_instance: sublicense_activation_requires_a_granted_protection_filing_in_that_jurisdiction
          rationale: "That instance activates while the filing is only FILED (posture PENDING) and asserts the error, then succeeds after the grant."

      - name: exclusivity_conflict_error_deferred_to_difficulty_design
        claim_type: error_triggerable
        grounds:
          - validations[priority=33]
          - errors.ERR_EXCLUSIVITY_CONFLICT
        distinguishing_aspect: "ERR_EXCLUSIVITY_CONFLICT is triggered by the difficulty design with the buffered closed-interval semantics."
        excluded_because:
          difficulty_instance: exclusive_sublicense_singleton_occupancy_with_thirty_day_buffer_on_closed_intervals
          rationale: "That instance asserts the error for a grant inside the 30-day buffer and success for one outside it."

      - name: trial_site_capacity_error_deferred_to_difficulty_design
        claim_type: error_triggerable
        grounds:
          - validations[priority=35]
          - errors.ERR_TRIAL_SITE_CAPACITY_EXCEEDED
        distinguishing_aspect: "ERR_TRIAL_SITE_CAPACITY_EXCEEDED is triggered on the plant path by the difficulty design."
        excluded_because:
          difficulty_instance: trial_site_aggregate_plot_capacity_over_half_open_windows_with_adjacency_allowed
          rationale: "That instance exceeds the aggregate plot capacity over an overlapping window and asserts the error."

      - name: report_has_no_lines_error_deferred_to_difficulty_design
        claim_type: error_triggerable
        grounds:
          - validations[priority=39]
          - errors.ERR_REPORT_HAS_NO_LINES
        distinguishing_aspect: "ERR_REPORT_HAS_NO_LINES is triggered on the submit path by the difficulty design."
        excluded_because:
          difficulty_instance: empty_line_item_collection_blocks_report_submission
          rationale: "That boundary_precision_check instance submits a line-less report, asserts the error, then adds one line and submits successfully."

