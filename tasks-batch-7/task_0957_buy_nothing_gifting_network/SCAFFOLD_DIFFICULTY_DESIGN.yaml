            - call: "POST /v1/groups"
              payload: { name: "Zone Group", zip_code: "98115", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${u_id}"
            - call: "POST /v1/curb-alerts"
              payload: { group_id: "${g_id}", zone: "ELM", starts_at: "2026-05-12T09:00:00Z", ends_at: "2026-05-12T10:00:00Z" }
              as: Member
              as_user_id: "${u_id}"
            - call: "POST /v1/curb-alerts"
              payload: { group_id: "${g_id}", zone: "ELM", starts_at: "2026-05-12T09:30:00Z", ends_at: "2026-05-12T10:30:00Z" }
              as: Member
              as_user_id: "${u_id}"
            - call: "POST /v1/curb-alerts"
              payload: { group_id: "${g_id}", zone: "ELM", starts_at: "2026-05-12T09:45:00Z", ends_at: "2026-05-12T11:00:00Z" }
              as: Member
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /v1/curb-alerts"
              payload: { group_id: "${g_id}", zone: "ELM", starts_at: "2026-05-12T09:50:00Z", ends_at: "2026-05-12T10:05:00Z" }
              as: Member
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
            - call: "POST /v1/curb-alerts"
              payload: { group_id: "${g_id}", zone: "ELM", starts_at: "2026-05-12T11:00:00Z", ends_at: "2026-05-12T12:00:00Z" }
              as: Member
              as_user_id: "${u_id}"
              captures: { ca: $.data.id, ca_status: $.data.status }
          assert:
            - "4th overlapping alert rejected: error_id == ERR_CURB_ALERT_CAPACITY (http 409) — overlaps 3 live alerts, >= 3"
            - "adjacent alert [11:00, 12:00) accepted: CurbAlert.${ca}.status == SCHEDULED — touches [09:45, 11:00) at exactly 11:00, half-open adjacency is not overlap"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: membership_approve_leave_conservation
        grounds:
          - state_machines.GroupMembership.REQUESTED_to_APPROVED
          - state_machines.GroupMembership.APPROVED_to_LEFT
          - entities.NeighborhoodGroup.fields.member_count
        distinguishing_aspect: |
          Conserved quantity = roster size: at every step,
          NeighborhoodGroup.member_count == count of GroupMemberships with
          status=APPROVED. Approve (+1) and leave (-1) are the compensating
          pair; the invariant is checked after 2 approvals, 1 leave, 1 approval.
        test_recipe:
          setup:
            - "Clock 2026-05-10T09:00:00Z; APPROVAL_REQUIRED group G (capacity 150)"
            - "M1, M2, M3 each hold a REQUESTED membership"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "im1@x.com", display_name: "M1" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "im2@x.com", display_name: "M2" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "im3@x.com", display_name: "M3" }
              as: Anonymous
              captures: { m3_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Invariant Group", zip_code: "98116", join_policy: "APPROVAL_REQUIRED", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { ms1: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { ms2: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { ms3: $.data.id }
          trigger:
            - call: "POST /v1/memberships/${ms1}/approve"
              as: PlatformAdmin
            - call: "POST /v1/memberships/${ms2}/approve"
              as: PlatformAdmin
            - call: "GET /v1/groups/${g_id}"
              as: PlatformAdmin
            - call: "GET /v1/memberships?group_id=${g_id}&status=APPROVED"
              as: PlatformAdmin
            - call: "POST /v1/memberships/${ms1}/leave"
              as: Member
              as_user_id: "${m1_id}"
            - call: "GET /v1/groups/${g_id}"
              as: PlatformAdmin
            - call: "POST /v1/memberships/${ms3}/approve"
              as: PlatformAdmin
            - call: "GET /v1/groups/${g_id}"
              as: PlatformAdmin
          assert:
            - "after two approvals: Group.${g_id}.member_count == 2 and GET /v1/memberships?group_id&status=APPROVED returns exactly 2 items"
            - "after M1 leave: Group.${g_id}.member_count == 1 and the APPROVED list contains only M2's membership"
            - "after M3 approve: Group.${g_id}.member_count == 2 and the APPROVED list contains M2 and M3 (compensating pair leaves the count invariant with the true roster)"

      - name: claim_head_slot_conservation
        grounds:
          - state_machines.Claim.OFFERED_to_DECLINED
          - state_machines.Claim.QUEUED_to_OFFERED
          - entities.GiftPost.fields.current_claim_id
        distinguishing_aspect: |
          Different conserved quantity from the roster instance: per GiftPost,
          the number of claims in {OFFERED, ACCEPTED} is always exactly 1 while
          the queue is non-empty, and the total claim count of the post is
          invariant across the decline -> promote compensating pair (no claim
          is created or destroyed).
        test_recipe:
          setup:
            - "Clock 2026-05-10T09:00:00Z; group with G, C1, C2; FIRST_COME post P OPEN"
            - "C1 OFFERED (head), C2 QUEUED; post has exactly 2 claims"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "hg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "hc1@x.com", display_name: "C1" }
              as: Anonymous
              captures: { c1_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "hc2@x.com", display_name: "C2" }
              as: Anonymous
              captures: { c2_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Head Slot Group", zip_code: "98117", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${c1_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${c2_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Skis", category: "OTHER", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${c1_id}"
              captures: { cl1: $.data.id }
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${c2_id}"
              captures: { cl2: $.data.id }
          trigger:
            - call: "POST /v1/claims/${cl1}/decline"
              as: Member
              as_user_id: "${c1_id}"
            - call: "GET /v1/claims?post_id=${p_id}"
              as: Member
              as_user_id: "${c1_id}"
            - call: "GET /v1/gift-posts/${p_id}"
              as: Member
              as_user_id: "${g_m_id}"
          assert:
            - "before decline: exactly 1 claim of P in {OFFERED, ACCEPTED} (C1 OFFERED); total claims of P == 2"
            - "after decline+promotion: total claims of P still == 2 (compensating pair destroys nothing)"
            - "after decline+promotion: exactly 1 claim of P in {OFFERED, ACCEPTED} (C2 OFFERED, C1 DECLINED)"
            - "GiftPost.${p_id}.current_claim_id == ${cl2} and status == RESERVED"
