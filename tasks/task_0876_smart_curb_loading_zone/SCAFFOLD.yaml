    path: "/curb/ledger-entries"
    description: "List ledger entries (filterable)"
    roles: [CurbPlanner]
    code: 200
    input: ["zone_id?", "reservation_id?", "citation_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/curb/revenue"
    description: "Revenue rollup summary (optionally scoped to a zone)"
    roles: [CurbPlanner]
    code: 200
    input: ["zone_id?"]
    output: "{ total_charge_cents: integer, total_refund_cents: integer, total_adjustment_cents: integer, total_fine_cents: integer, net_revenue_cents: integer }"
    side_effects: []

  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advances to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or entity_backed Permittee acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not resolve" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field-level validation failure (bad enum, end<=start, capacity<1, minute/day bounds)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Permit approver/denier X-User-ID equals the recorded reviewer_user_id" }
  - { id: ERR_ZONE_NOT_ACTIVE, http: 409, condition: "A referenced zone is not ACTIVE (permit approval or reservation confirm)" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "Reservation confirm requires the authorizing permit to be ACTIVE" }
  - { id: ERR_ZONE_CAPACITY_CONFLICT, http: 409, condition: "Confirming would make concurrent overlapping reservations exceed zone.capacity_slots" }
  - { id: ERR_SCHEDULE_WINDOW_CONFLICT, http: 409, condition: "An exclusive schedule window collides with another exclusive window on the zone within the turnover buffer" }
  - { id: ERR_ZONE_HAS_ACTIVE_RESERVATIONS, http: 409, condition: "Retiring a zone with CONFIRMED reservations ending in the future" }
  - { id: ERR_NO_OCCUPANCY_SESSION, http: 409, condition: "Fulfilling a reservation with no matched CLOSED OccupancySession" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_zone_version does not match CurbZone.version on redesignation" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "target_status / decision / violation_type not a permitted enum member" }
  - { id: ERR_CANCEL_AFTER_START, http: 409, condition: "Cancelling a CONFIRMED reservation whose window already started" }
  - { id: ERR_MISSING_FIELD, http: 422, condition: "Required request-body field absent" }
  - { id: ERR_INVALID_PAGINATION, http: 422, condition: "limit/offset out of the [1,100]/[0,..] bounds" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Permittee
    description: "Curb user (carrier/valet/TNC/merchant). Owns permits and reservations; pays and disputes citations."
    identity: "entity_backed:Permittee"
    exclusive_operations:
      - "POST /curb/permits — create own permit"
      - "POST /curb/permits/{id}/submit — submit own permit"
      - "POST /curb/schedule-windows — attach window to own permit"
      - "POST /curb/reservations — create reservation on own permit"
      - "POST /curb/reservations/{id}/confirm — confirm own reservation"
      - "POST /curb/reservations/{id}/cancel — cancel own reservation"
      - "POST /curb/reservations/{id}/fulfill — fulfill own reservation"
      - "POST /curb/citations/{id}/pay — pay own citation"
      - "POST /curb/citations/{id}/dispute — dispute own citation"
    shared_operations:
      - "GET /curb/permittees/{id}, GET /curb/zones, GET /curb/zones/{id}, GET /curb/map"
      - "GET /curb/permits, GET /curb/permits/{id}, GET /curb/schedule-windows, GET /curb/schedule-windows/{id}"
      - "GET /curb/reservations, GET /curb/reservations/{id}, GET /curb/citations, GET /curb/citations/{id}"
      - "GET /curb/pricing-policies/{id}, GET /curb/events/{id}"

  - name: CurbPlanner
    description: "Curb authority operator: manages inventory, designations, pricing, events; reviews permits (reviewer step of SoD)."
    identity: "opaque"
    exclusive_operations:
      - "POST /curb/zones, POST /curb/zones/{id}/redesignate, POST /curb/zones/{id}/status"
      - "POST /curb/pricing-policies"
      - "POST /curb/permits/{id}/review, POST /curb/permits/{id}/request-changes, POST /curb/permits/{id}/revoke"
      - "POST /curb/events, POST /curb/events/{id}/activate, POST /curb/events/{id}/close, POST /curb/events/{id}/cancel"
      - "GET /curb/ledger-entries, GET /curb/ledger-entries/{id}, GET /curb/revenue"
    shared_operations:
      - "GET /curb/permits, GET /curb/permits/{id}, GET /curb/reservations, GET /curb/reservations/{id}"
      - "GET /curb/citations, GET /curb/citations/{id}, GET /curb/occupancy-sessions, GET /curb/occupancy-sessions/{id}"
      - "GET /curb/zones, GET /curb/zones/{id}, GET /curb/map, GET /curb/permittees/{id}"

  - name: PermitApprover
    description: "Second-line permit authority: approves or denies permits (approver step of SoD; must differ from reviewer)."
    identity: "opaque"
    exclusive_operations:
      - "POST /curb/permits/{id}/approve"
      - "POST /curb/permits/{id}/deny"
    shared_operations:
      - "GET /curb/permits, GET /curb/permits/{id}"

  - name: EnforcementOfficer
    description: "Field enforcement: issues citations, adjudicates disputes, marks no-shows, fulfills observed reservations."
    identity: "opaque"
    exclusive_operations:
      - "POST /curb/citations — issue citation"
      - "POST /curb/citations/{id}/adjudicate — adjudicate dispute"
      - "POST /curb/reservations/{id}/no-show — mark no-show"
    shared_operations:
      - "POST /curb/reservations/{id}/fulfill"
      - "GET /curb/citations, GET /curb/citations/{id}, GET /curb/reservations, GET /curb/reservations/{id}"
      - "GET /curb/occupancy-sessions, GET /curb/occupancy-sessions/{id}, GET /curb/zones/{id}, GET /curb/map, GET /curb/permittees/{id}"

  - name: PlatformAdmin
    description: "Operational/system actor: onboards permittees, drives the sensor feed and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /curb/permittees — register permittee"
      - "POST /_sensor/occupancy-enter, POST /_sensor/occupancy-exit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /curb/permittees/{id}, GET /curb/zones/{id}"
