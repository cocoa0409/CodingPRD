# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3444 — furniture manufacturing + licensed store program
# Nine Difficulty Rules x 2 instances each. All recipes replay from empty-DB
# using only endpoints declared in SCAFFOLD.yaml §1.5.
# Clock default is 2026-09-01T00:00:00Z; every fixture date is reachable from it.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: delivery_fee_estimate_vs_final_diverge_on_overage
        grounds:
          - calculations.delivery_fee
          - state_machines.DeliveryAppointment.CONFIRMED_to_COMPLETED
          - entities.DeliveryAppointment.fields.estimate_fee_cents
          - entities.DeliveryAppointment.fields.final_fee_cents
        distinguishing_aspect: |
          Dual variant on the LOGISTICS domain: one appointment carries two fee
          numbers from identical booking data — estimate_fee_cents (flat formula,
          19900) vs final_fee_cents (adds 2 overage blocks + 2 extra stair
          flights, 30900) — distinct from the licensee-domain scoring variants.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1 (cap 100), line Alder 89900 ACTIVE, licensee Summit ACTIVE holding territory T-SEA, DC-KENT (home delivery, 6 crew), cycle week 2026-09-07 OPEN."
            - "Licensee home-delivery order qty 2 submitted, cycle run (ALLOCATED), order PICKED."
          setup_api_calls:
            - &a_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &a_factory
              call: "POST /api/factories"
              payload: { code: "FAC-D1", region: DOMESTIC, component_lines: [FOAM, FRAMES, UPHOLSTERY], weekly_capacity_units: 100 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - &a_line
              call: "POST /api/product-lines"
              payload: { name: "Alder Sofa Collection", category: UPHOLSTERY, price_point_cents: 89900, style_code: "ALD-SOFA-01" }
              as: PlatformAdmin
              captures: { pl1: $.data.id }
            - &a_line_active
              call: "POST /api/product-lines/${pl1}/advance"
              payload: {}
              as: PlatformAdmin
            - &a_licensee
              call: "POST /api/licensees"
              payload: { business_name: "Summit Home Furnishings" }
              as: PlatformAdmin
              captures: { l1: $.data.id }
            - &a_licensee_active
              call: "POST /api/licensees/${l1}/transition"
              payload: { to_state: ACTIVE }
              as: PlatformAdmin
            - &a_terr_sea
              call: "POST /api/territories"
              payload: { region_code: "T-SEA", population_tier: METRO }
              as: PlatformAdmin
              captures: { t_sea: $.data.id }
            - &a_assign_sea
              call: "POST /api/territories/${t_sea}/transition"
              payload: { to_state: ASSIGNED, licensee_id: "${l1}" }
              as: PlatformAdmin
            - &a_dc
              call: "POST /api/distribution-centers"
              payload: { code: "DC-KENT", supports_home_delivery: true, daily_crew_units: 6, region_codes: ["T-SEA"] }
              as: PlatformAdmin
              captures: { dc1: $.data.id }
            - &a_cycle1
              call: "POST /api/allocation-cycles"
              payload: { factory_id: "${f1}", week_start: "2026-09-07T00:00:00Z" }
              as: ProductionPlanner
              captures: { c1: $.data.id }
            - &a_hd_order
              call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 2, delivery_mode: HOME_DELIVERY }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o1: $.data.id }
            - &a_submit_o1
              call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - &a_run_c1
              call: "POST /api/allocation-cycles/${c1}/run-allocation"
              payload: {}
              as: ProductionPlanner
            - &a_pick_o1
              call: "POST /api/orders/${o1}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z", crew_units: 2, stairs_flights: 3 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { ap1: $.data.id, ap1_est: $.data.estimate_fee_cents }
            - call: "POST /api/delivery-appointments/${ap1}/transition"
              payload: { to_state: CONFIRMED }
              as: LogisticsCoordinator
            - call: "POST /api/delivery-appointments/${ap1}/transition"
              payload: { to_state: COMPLETED, actual_duration_minutes: 240 }
              as: LogisticsCoordinator
              captures: { ap1_final: $.data.final_fee_cents }
            - call: "GET /api/orders/${o1}"
              payload: {}
              as: LogisticsCoordinator
              captures: { o1_fs: $.data.fulfillment_state }
          assert:
            - "DeliveryAppointment.${ap1}.estimate_fee_cents == 19900 (14900 call-out + 0 LOCAL zone + 2*2500 crew)"
            - "DeliveryAppointment.${ap1}.final_fee_cents == 30900 (19900 + ceil((240-180)/30)*4000 overage + (3-1)*1500 stairs)"
            - "final_fee_cents != estimate_fee_cents for identical booking data (30900 != 19900)"
            - "SupplyOrder.${o1}.fulfillment_state == DELIVERED after appointment completion"

      - name: performance_score_instantaneous_vs_seasoned_diverge
        grounds:
          - calculations.performance_score
          - entities.Licensee.fields.last_cycle_score
          - entities.Licensee.fields.seasoned_score
        distinguishing_aspect: |
          Dual variant on the LICENSEE domain: after two closed cycles the same
          licensee shows last_cycle_score == 35.00 (instantaneous) while
          seasoned_score == 62.86 (re-normalized trailing weights) — different
          entity domain from the delivery-fee variants.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1 (cap 100), line Alder 89900 ACTIVE, licensee Summit ACTIVE."
            - "Cycle A (week 2026-09-07): one qty-2 freight order, submitted, run, DELIVERED; audit set to 100; close -> I = 100.00."
            - "Cycle B (week 2026-09-14): five qty-1 freight orders submitted and run; two DELIVERED; one DEFECT claim filed 2026-09-15; audit set to 50; close -> I = 35.00."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_line_active
            - *a_licensee
            - *a_licensee_active
            - call: "POST /api/allocation-cycles"
              payload: { factory_id: "${f1}", week_start: "2026-09-07T00:00:00Z" }
              as: ProductionPlanner
              captures: { cA: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cA}", product_line_id: "${pl1}", quantity: 2, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { oA: $.data.id }
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/allocation-cycles/${cA}/run-allocation"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { l1_vA: $.data.version }
            - call: "PUT /api/licensees/${l1}/terms"
              payload: { expected_licensee_version: "${l1_vA}", latest_audit_score: 100 }
              as: PlatformAdmin
            - call: "POST /api/allocation-cycles/${cA}/close"
              payload: {}
              as: ProductionPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/allocation-cycles"
              payload: { factory_id: "${f1}", week_start: "2026-09-14T00:00:00Z" }
              as: ProductionPlanner
              captures: { cB: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cB}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { oB1: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cB}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { oB2: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cB}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cB}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cB}", product_line_id: "${pl1}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/orders/${oB1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/orders/${oB2}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/allocation-cycles/${cB}/run-allocation"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/orders/${oB1}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB1}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB1}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB2}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB2}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB2}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/warranty-claims"
              payload: { supply_order_id: "${oB1}", claim_type: DEFECT, description: "Arm seam split" }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { l1_vB: $.data.version }
            - call: "PUT /api/licensees/${l1}/terms"
              payload: { expected_licensee_version: "${l1_vB}", latest_audit_score: 50 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/allocation-cycles/${cB}/close"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { last_s: $.data.last_cycle_score, seas_s: $.data.seasoned_score, l1_status: $.data.status }
          assert:
            - "Licensee.${l1}.last_cycle_score == 35.00 (0.5*40 sell-through + 0.3*50 audit + 0.2*0 claims-component)"
            - "Licensee.${l1}.seasoned_score == 62.86 ((0.4*35 + 0.3*100)/(0.7) renormalized over two cycles, round_half_up 2dp)"
            - "last_cycle_score != seasoned_score for identical licensee data (35.00 != 62.86)"
            - "Licensee.${l1}.status == ACTIVE (62.86 >= 60.00 threshold)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_clearance_base_times_wholesale_tier
        grounds:
          - calculations.order_pricing
          - entities.ProductLine.fields.clearance_price_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: three inputs with non-linear interaction —
          lifecycle branch (CLEARANCE rebases to round_half_up(89900*0.75)=67425),
          buyer_type branch (RETAIL_ACCOUNT), and tiered-rate selection
          (qty 25 -> 9%) — compose to unit 61357 and total 1533925. Distinct
          mode from the rounding-order instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1, line Alder 89900 advanced twice to CLEARANCE, retail account Metro (limit 5000000), cycle week 2026-09-07 OPEN."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_line_active
            - call: "POST /api/product-lines/${pl1}/advance"
              payload: {}
              as: PlatformAdmin
              captures: { pl1_lc: $.data.lifecycle, pl1_cp: $.data.clearance_price_cents }
            - call: "POST /api/retail-accounts"
              payload: { business_name: "Metro Discount Furniture", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - *a_cycle1
          trigger:
            - call: "POST /api/orders"
              payload: { buyer_type: RETAIL_ACCOUNT, retail_account_id: "${r1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 25, delivery_mode: FREIGHT_TO_STORE }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { o_w: $.data.id, o_w_unit: $.data.unit_price_cents, o_w_total: $.data.provisional_total_cents }
          assert:
            - "ProductLine.${pl1}.lifecycle == CLEARANCE and clearance_price_cents == 67425 (round_half_up(89900 * 0.75))"
            - "SupplyOrder.${o_w}.unit_price_cents == 61357 (round_half_up(67425 * 0.91), tier 2 rate 0.09 at qty 25)"
            - "SupplyOrder.${o_w}.provisional_total_cents == 1533925 (61357 * 25, unit rounded BEFORE multiply)"

      - name: royalty_per_order_rounding_beats_sum_then_round
        grounds:
          - calculations.royalty_accrual
          - entities.Licensee.fields.royalty_accrued_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order matters — per-order
          royalties round_half_up(41930*0.04)=1677 and round_half_up(83860*0.04)=3354
          sum to 5031, while summing first (125790*0.04=5031.6) would give 5032.
          The scaffold pins round-per-order-then-sum. Distinct mode from the
          tiered-rate instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1, line Birch 59900 ACTIVE, licensee Summit ACTIVE (royalty_rate 0.04 default), cycle week 2026-09-07 OPEN."
            - "Order A qty 1 (total 41930) and order B qty 2 (total 83860), both submitted, allocated, DELIVERED."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - call: "POST /api/product-lines"
              payload: { name: "Birch Bedroom Set", category: CASEGOODS, price_point_cents: 59900, style_code: "BR-BED-01" }
              as: PlatformAdmin
              captures: { pl2: $.data.id }
            - call: "POST /api/product-lines/${pl2}/advance"
              payload: {}
              as: PlatformAdmin
            - *a_licensee
            - *a_licensee_active
            - *a_cycle1
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl2}", quantity: 1, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { oA: $.data.id, oA_total: $.data.provisional_total_cents }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${c1}", product_line_id: "${pl2}", quantity: 2, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { oB: $.data.id, oB_total: $.data.provisional_total_cents }
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/orders/${oB}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - *a_run_c1
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
          trigger:
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { l1_accrued: $.data.royalty_accrued_cents, l1_net: $.data.net_royalty_cents, l1_cb: $.data.chargeback_cents }
          assert:
            - "SupplyOrder.${oA}.provisional_total_cents == 41930 (round_half_up(59900*0.70))"
            - "SupplyOrder.${oB}.provisional_total_cents == 83860"
            - "Licensee.${l1}.royalty_accrued_cents == 5031 (1677 + 3354; sum-then-round would falsely give 5032)"
            - "Licensee.${l1}.chargeback_cents == 0 and net_royalty_cents == 5031"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: licensee_probation_recovery_cycle_active_probation_active
        grounds:
          - state_machines.Licensee.ACTIVE_to_PROBATION
          - state_machines.Licensee.PROBATION_to_ACTIVE
          - calculations.performance_score
        distinguishing_aspect: |
          Cyclic machine on Licensee: ACTIVE -> PROBATION (seasoned 38.00 at
          first close) -> ACTIVE after two good cycles (seasoned 86.22) — a loop
          back to a previously held state, on a different entity than the
          SupplyOrder parallel-dimensions instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1 (cap 100), line Alder 89900 ACTIVE, licensee Summit ACTIVE."
            - "Cycle A (2026-09-07): one qty-2 freight order submitted + run, never delivered; audit 60; close -> I = 38.00 -> PROBATION."
            - "Cycle B (2026-09-14): one qty-2 freight order submitted, run, DELIVERED; audit 100; close -> I = 100.00, seasoned 73.43 -> stays PROBATION."
            - "Cycle C (2026-09-21): same as B; close -> seasoned 86.22 -> recovers to ACTIVE."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_line_active
            - *a_licensee
            - *a_licensee_active
            - call: "POST /api/allocation-cycles"
              payload: { factory_id: "${f1}", week_start: "2026-09-07T00:00:00Z" }
              as: ProductionPlanner
              captures: { cA: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cA}", product_line_id: "${pl1}", quantity: 2, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { oA: $.data.id }
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/allocation-cycles/${cA}/run-allocation"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { l1_vA: $.data.version }
            - call: "PUT /api/licensees/${l1}/terms"
              payload: { expected_licensee_version: "${l1_vA}", latest_audit_score: 60 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/allocation-cycles/${cA}/close"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { st_afterA: $.data.status, seas_A: $.data.seasoned_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/allocation-cycles"
              payload: { factory_id: "${f1}", week_start: "2026-09-14T00:00:00Z" }
              as: ProductionPlanner
              captures: { cB: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cB}", product_line_id: "${pl1}", quantity: 2, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { oB: $.data.id }
            - call: "POST /api/orders/${oB}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/allocation-cycles/${cB}/run-allocation"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/orders/${oB}/transition"
              payload: { action: PICK }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB}/transition"
              payload: { action: SHIP }
              as: LogisticsCoordinator
            - call: "POST /api/orders/${oB}/transition"
              payload: { action: DELIVER }
              as: LogisticsCoordinator
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { l1_vB: $.data.version }
            - call: "PUT /api/licensees/${l1}/terms"
              payload: { expected_licensee_version: "${l1_vB}", latest_audit_score: 100 }
              as: PlatformAdmin
            - call: "POST /api/allocation-cycles/${cB}/close"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { st_afterB: $.data.status, seas_B: $.data.seasoned_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/allocation-cycles"
              payload: { factory_id: "${f1}", week_start: "2026-09-21T00:00:00Z" }
              as: ProductionPlanner
              captures: { cC: $.data.id }
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l1}", allocation_cycle_id: "${cC}", product_line_id: "${pl1}", quantity: 2, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { oC: $.data.id }
            - call: "POST /api/orders/${oC}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
