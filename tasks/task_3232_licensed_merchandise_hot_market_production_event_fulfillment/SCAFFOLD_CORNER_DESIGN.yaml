# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3232_licensed_merchandise_hot_market_production_event_fulfillment
#
# Breadth probe over CLAUDE-PRD claim-extraction-guide.md taxonomy. Claims that
# §1.8 already exercises appear as `excluded_because:` stubs citing the §1.8
# instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: licensor_create_defaults_and_ledger_zeros
        claim_type: Creation
        grounds:
          - entities.Licensor
          - endpoints.POST_/licensors
        distinguishing_aspect: "A licensor created with only name, league_code, royalty_rate_pct and minimum_guarantee_cents comes back 201 with all three ledger quantities at 0, currency USD, version 1 and system-stamped id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /licensors"
              payload: { name: "National Basketball League", league_code: "NBL", royalty_rate_pct: 0.125, minimum_guarantee_cents: 2000000 }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
          assert:
            - "the response status is 201 and Licensor.${lic_id}.name == \"National Basketball League\""
            - "Licensor.${lic_id}.accrued_royalty_cents == 0 and guarantee_recovery_block_cents == 0 and accrued_unsettled_cents == 0"
            - "Licensor.${lic_id}.currency == \"USD\" and version == 1"
            - "Licensor.${lic_id}.id is a server-minted UUID and created_at / updated_at are non-null"

      - name: design_get_round_trips_player_code_and_null_approved_version
        claim_type: Retrieval
        grounds:
          - entities.Design
          - endpoints.GET_/designs/{design_id}
        distinguishing_aspect: "A team-only design round-trips with player_code null and approved_version null, exactly as posted, while a player design round-trips its player code and rejection reason."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICB created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Marks B", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licb_id: $.data.id }
          trigger:
            - call: "POST /designs"
              payload: { licensor_id: "${licb_id}", team_code: "ATL", garment_sku: "TRACTOR", design_name: "ATL Team Tractor" }
              as: DesignOps
              captures: { dsgb_id: $.data.id }
            - call: "GET /designs/${dsgb_id}"
              payload: {}
              as: DesignOps
              captures: { got_player: $.data.player_code, got_approved: $.data.approved_version, got_state: $.data.approval_state }
          assert:
            - "Design.${dsgb_id}.player_code == null and approved_version == null"
            - "Design.${dsgb_id}.approval_state == PENDING_LICENSOR_APPROVAL"
            - "Design.${dsgb_id}.rejection_reason == null and garment_sku == TRACTOR"
            - "response_type == \"object\""

      - name: designs_list_filtered_by_licensor_and_state
        claim_type: Listing
        grounds:
          - entities.Design
          - endpoints.GET_/designs
        distinguishing_aspect: "GET /designs scoped by licensor_id returns only that licensor's designs, and the pagination envelope reports total_count and has_more consistently with the returned array."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two licensors created, with one design each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor C", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licc_id: $.data.id }
            - call: "POST /licensors"
              payload: { name: "Licensor D", league_code: "NBLM", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licd_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licc_id}", team_code: "ATL", garment_sku: "CAP", design_name: "C Cap" }
              as: DesignOps
              captures: { dsc_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licd_id}", team_code: "BOS", garment_sku: "MINI", design_name: "D Mini" }
              as: DesignOps
              captures: { dsd_id: $.data.id }
          trigger:
            - call: "GET /designs?licensor_id=${licc_id}"
              payload: {}
              as: DesignOps
              captures: { list_first: "$.data[0].id" }
          assert:
            - "the filtered list contains exactly 1 design and it is ${dsc_id}"
            - "the list envelope reports total_count 1 and has_more false"
            - "the pagination fields limit, offset, total_count and has_more are all present"

      - name: design_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/designs/{design_id}
        distinguishing_aspect: "Reading a design id that was never minted returns ERR_NOT_FOUND with 404 rather than an empty object, and the error body carries only error_id and message."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /designs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: DesignOps
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "the response envelope response_type == \"error\" and data carries no design object"

      - name: production_order_requires_design_id
        claim_type: Required Fields
        grounds:
          - entities.ProductionOrder
          - validations[priority=0]
        distinguishing_aspect: "Omitting design_id from the production-order body returns ERR_INVALID_REQUEST at 400 before any existence or state check runs, because request shape is the highest-priority check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICE created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor E", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lice_id: $.data.id }
          trigger:
            - call: "POST /production-orders"
              payload: { licensor_id: "${lice_id}", team_code: "ATL", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "no ProductionOrder is created by the rejected call"

      - name: print_capacity_defaults_capacity_floor
        claim_type: Defaults
        grounds:
          - entities.PrintCapacity
          - endpoints.POST_/print-capacity
        distinguishing_aspect: "A capacity window created with capacity_qty 20 reports reserved_qty 0 and available_qty 20 with no reservation yet, so the computed default is capacity_qty itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /print-capacity"
              payload: { city_code: "ATL", print_type: "BASE", window_start: "2026-09-01T01:00:00Z", window_end: "2026-09-02T01:00:00Z", capacity_qty: 20, rush_sla_hours: 24 }
              as: FulfillmentCoordinator
              captures: { cap_id: $.data.id }
          assert:
            - "PrintCapacity.${cap_id}.reserved_qty == 0 and available_qty == 20"
            - "PrintCapacity.${cap_id}.capacity_qty == 20 and rush_sla_hours == 24"
            - "PrintCapacity.${cap_id}.version == 1"

      - name: production_order_computed_unit_ledgers_start_at_zero
        claim_type: Computed Fields
        grounds:
          - entities.ProductionOrder.fields.base_units_printed
          - entities.ProductionOrder.fields.committed_inventory_cents
        distinguishing_aspect: "A freshly created run reports base_units_printed 0, accessory_units_printed 0, layer_ids empty and committed_inventory_cents 0 while its status is PARALLEL_HOLD, and a client-supplied value for any of them is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICF with an APPROVED CAP design DSGF."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor F", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licf_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licf_id}", team_code: "PHI", garment_sku: "CAP", design_name: "F Cap" }
              as: DesignOps
              captures: { dsgf_id: $.data.id, dsgf_v: $.data.version }
            - call: "PUT /designs/${dsgf_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgf_v}" }
              as: LicensingOps
              as_user_id: "${licf_id}"
          trigger:
            - call: "POST /production-orders"
              payload: { licensor_id: "${licf_id}", design_id: "${dsgf_id}", team_code: "PHI", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { pof_id: $.data.id, pof_base: $.data.base_units_printed, pof_acc: $.data.accessory_units_printed, pof_layers: "$.data.layer_ids" }
          assert:
            - "ProductionOrder.${pof_id}.base_units_printed == 0 and accessory_units_printed == 0"
            - "ProductionOrder.${pof_id}.layer_ids == []"
            - "ProductionOrder.${pof_id}.committed_inventory_cents == 0 and hold_allocation_cents > 0"
            - "ProductionOrder.${pof_id}.status == PARALLEL_HOLD and committed_at == null"

      - name: fulfillment_order_system_fields_and_computed_totals
        claim_type: System Fields
        grounds:
          - entities.FulfillmentOrder.fields.requested_wholesale_cents
          - entities.FulfillmentOrder.fields.picked_qty
        distinguishing_aspect: "Every quantity ledger on a new order (picked, shipped, returned, destroyed, donated, realized) is system-computed and starts at 0, while a client-supplied picked_qty is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICG, APPROVED TRACTOR design DSGG, run POG committed with a BASE layer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor G", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licg_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licg_id}", team_code: "BOS", garment_sku: "TRACTOR", design_name: "G Tractor" }
              as: DesignOps
              captures: { dsgg_id: $.data.id, dsgg_v: $.data.version }
            - call: "PUT /designs/${dsgg_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgg_v}" }
              as: LicensingOps
              as_user_id: "${licg_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${licg_id}", design_id: "${dsgg_id}", team_code: "BOS", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { pog_id: $.data.id, pog_v: $.data.version }
            - call: "POST /production-orders/${pog_id}/layers"
              payload: { expected_production_order_version: "${pog_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
          trigger:
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${pog_id}", channel: "ECOM", destination_code: "ECOM-BOS-7", quantity: 200 }
              as: FulfillmentCoordinator
              captures: { fog_id: $.data.id }
          assert:
            - "FulfillmentOrder.${fog_id}.picked_qty == 0 and shipped_qty == 0 and returned_qty == 0"
            - "FulfillmentOrder.${fog_id}.destroyed_qty == 0 and donated_qty == 0 and realized_wholesale_cents == 0"
            - "FulfillmentOrder.${fog_id}.write_down_inventory_cents == 0"
            - "FulfillmentOrder.${fog_id}.requested_wholesale_cents == 1000"
            - "FulfillmentOrder.${fog_id}.status == PLANNED and version == 1"

      - name: counterfeit_report_requires_positive_unit_count
        claim_type: Type Constraints
        grounds:
          - entities.CounterfeitReport.fields.unit_count
          - validations[priority=0]
        distinguishing_aspect: "A counterfeit report with unit_count 0 is rejected with ERR_INVALID_REQUEST, because the field carries a strictly-positive constraint rather than a non-negative one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICH created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor H", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lich_id: $.data.id }
          trigger:
            - call: "POST /counterfeit-reports"
              payload: { licensor_id: "${lich_id}", venue_code: "ATL_POPUP", online_listing_id: "VERIFIED-LIST-11", unit_count: 0, suspect_quantity: 0, detected_at: "2026-09-01T00:00:00Z" }
              as: EnforcementAgent
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: criterion_share_of_shared_cost_uses_equal_split
        claim_type: Criterion
        grounds:
          - calculations.wholesale_fulfillment_total
          - entities.FulfillmentOrder.fields.requested_wholesale_cents
        distinguishing_aspect: "Requested wholesale value scales linearly with quantity at the channel rate, without any fixed charge, so the unit price implied by the quote falls as the quantity rises."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICI, APPROVED CAP design DSGI, run POI committed with a BASE layer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor I", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lici_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lici_id}", team_code: "NYC", garment_sku: "CAP", design_name: "I Cap" }
              as: DesignOps
              captures: { dsgi_id: $.data.id, dsgi_v: $.data.version }
            - call: "PUT /designs/${dsgi_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgi_v}" }
              as: LicensingOps
              as_user_id: "${lici_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lici_id}", design_id: "${dsgi_id}", team_code: "NYC", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { poi_id: $.data.id, poi_v: $.data.version }
            - call: "POST /production-orders/${poi_id}/layers"
              payload: { expected_production_order_version: "${poi_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
          trigger:
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${poi_id}", channel: "ECOM", destination_code: "ECOM-NYC-1", quantity: 100 }
              as: FulfillmentCoordinator
              captures: { foi_id: $.data.id, foi_total: $.data.requested_wholesale_cents }
          assert:
            - "FulfillmentOrder.${foi_id}.requested_wholesale_cents == 500"
            - "the implied unit price is 5 cents per unit at the ECOM rate"

      - name: shipment_entities_carry_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.Shipment
          - endpoints.POST_/fulfillment-orders/{fulfillment_order_id}/ship
        distinguishing_aspect: "A shipment is created only as a side effect of shipping, has no POST /shipments creation endpoint and no standalone update route, and its delivered_at stays null until the parent order is delivered."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICJ, APPROVED TRACTOR design DSGJ, run POJ committed with a BASE layer, one order of 20 units picked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor J", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licj_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licj_id}", team_code: "ATL", garment_sku: "TRACTOR", design_name: "J Tractor" }
              as: DesignOps
              captures: { dsgj_id: $.data.id, dsgj_v: $.data.version }
            - call: "PUT /designs/${dsgj_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgj_v}" }
              as: LicensingOps
              as_user_id: "${licj_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${licj_id}", design_id: "${dsgj_id}", team_code: "ATL", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { poj_id: $.data.id, poj_v: $.data.version }
            - call: "POST /production-orders/${poj_id}/layers"
              payload: { expected_production_order_version: "${poj_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { poj_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${poj_id}", channel: "ECOM", destination_code: "ECOM-ATL-9", quantity: 20 }
              as: FulfillmentCoordinator
              captures: { foj_id: $.data.id }
            - call: "POST /fulfillment-orders/${foj_id}/pick"
              payload: { expected_production_order_version: "${poj_v2}", quantity: 20, pick_remark: "pick-j" }
              as: FulfillmentCoordinator
          trigger:
            - call: "POST /fulfillment-orders/${foj_id}/ship"
              payload: { quantity: 20, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
              captures: { shp_id: $.data.id, shp_state: $.data.shipment_state, shp_delivered: $.data.delivered_at }
            - call: "GET /fulfillment-orders/${foj_id}/shipments"
              payload: {}
              as: FulfillmentCoordinator
              captures: { shp_list_first: "$.data[0].id" }
          assert:
            - "the ship response is 201 and Shipment.${shp_id}.shipment_state == IN_TRANSIT"
            - "Shipment.${shp_id}.delivered_at == null and carrier == GROUND and sla_hours == 48"
            - "the order's shipment list contains exactly 1 shipment and it is ${shp_first}"
            - "FulfillmentOrder.${foj_id}.status == SHIPPED and shipped_qty == 20"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: design_reject_from_rejected_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Design.transitions.APPROVAL_REJECTED_to_PENDING_LICENSOR_APPROVAL
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second licensor decision is rejected while the design sits in APPROVAL_REJECTED, so the only legal move out of that state is the resubmission endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICK and design DSGK in APPROVAL_REJECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor K", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lick_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lick_id}", team_code: "ATL", garment_sku: "MINI", design_name: "K Mini" }
              as: DesignOps
              captures: { dsgk_id: $.data.id, dsgk_v: $.data.version }
            - call: "PUT /designs/${dsgk_id}/licensor-decision"
              payload: { decision: "REJECT", expected_design_version: "${dsgk_v}", rejection_reason: "Wrong mark ratio" }
              as: LicensingOps
              as_user_id: "${lick_id}"
              captures: { dsgk_v1: $.data.version }
          trigger:
            - call: "PUT /designs/${dsgk_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsgk_v1}" }
              as: LicensingOps
              as_user_id: "${lick_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Design.${dsgk_id}.approval_state is still APPROVAL_REJECTED and approved_version == null"

      - name: print_layer_pennant_blocked_when_flag_false
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProductionOrder.transitions.COMMITTED_to_PRINTING
          - errors[ERR_PRINT_TYPECAST_MISMATCH]
        distinguishing_aspect: "A PENNANT layer is rejected on a run created with pennants_included false, so the flag on the parent run, not the layer payload, decides whether the layer is admissible."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICL, APPROVED design with PENNANT garment, no run yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "Licensor L", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { licl_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${licl_id}", team_code: "BOS", garment_sku: "PENNANT", design_name: "L Pennant" }
              as: DesignOps
              captures: { dsgl_id: $.data.id, dsgl_v: $.data.version }
            - call: "PUT /designs/${dsgl_id}/licensor-decision"
