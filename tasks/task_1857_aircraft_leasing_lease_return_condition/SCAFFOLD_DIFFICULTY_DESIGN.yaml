scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: reserve_accrual_actual_vs_minimum_guarantee
        grounds:
          - calculations.maintenance_reserve_accrual
          - entities.Lease.fields.accrual_basis
        distinguishing_aspect: |
          Two accrual variants on the Lease reserve ledger domain: identical reported
          utilization (100.0 h / 20 cycles) accrues 560000 cents under ACTUAL but
          760000 cents under MINIMUM_GUARANTEE (min 150 h) — variant selection is by
          lease.accrual_basis, not by any property of the report.
        test_recipe:
          setup:
            - "Two aircraft (each with a VERIFIED BIRTH_RECORD), two ACTIVE lessees, two ACTIVE leases with identical economics (rent 1000000, rate_fh 4000, rate_fc 8000, cap 300): lease A accrual_basis ACTUAL, lease B accrual_basis MINIMUM_GUARANTEE with minimum_monthly_hours 150"
            - "Both leases have an ACCEPTED utilization report for 2026-08 of 100.0 hours / 20 cycles"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-A1", model: "A320-200", manufacture_date: "2012-05-17" }, as: LessorAdmin, captures: { acA: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${acA}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-A1" }, as: LessorAdmin, captures: { dA: "$.data.id"} }
            - { call: "POST /leasing/documents/${dA}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Alpha Air", credit_tier: "A" }, as: LessorAdmin, captures: { lesA: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${acA}", lessee_id: "${lesA}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { leaseA: "$.data.id"} }
            - { call: "POST /leasing/leases/${leaseA}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-B2", model: "A320-200", manufacture_date: "2014-02-11" }, as: LessorAdmin, captures: { acB: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${acB}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-B2" }, as: LessorAdmin, captures: { dB: "$.data.id"} }
            - { call: "POST /leasing/documents/${dB}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Beta Wings", credit_tier: "B" }, as: LessorAdmin, captures: { lesB: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${acB}", lessee_id: "${lesB}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "MINIMUM_GUARANTEE", minimum_monthly_hours: 150 }, as: LessorAdmin, captures: { leaseB: "$.data.id"} }
            - { call: "POST /leasing/leases/${leaseB}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${leaseA}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 100.0, flight_cycles: 20 }, as: LesseeRep, as_user_id: "${lesA}", captures: { repA: "$.data.id"} }
            - { call: "POST /leasing/utilization-reports/${repA}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin }
            - { call: "POST /leasing/leases/${leaseB}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 100.0, flight_cycles: 20 }, as: LesseeRep, as_user_id: "${lesB}", captures: { repB: "$.data.id"} }
            - { call: "POST /leasing/utilization-reports/${repB}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin }
          trigger:
            - { call: "GET /leasing/leases/${leaseA}", payload: {}, as: LessorAdmin, captures: { accA: "$.data.reserve_accrued_cents"} }
            - { call: "GET /leasing/leases/${leaseB}", payload: {}, as: LessorAdmin, captures: { accB: "$.data.reserve_accrued_cents"} }
          assert:
            - "Lease A reserve_accrued_cents == 560000 (100.0 x 4000 + 20 x 8000)"
            - "Lease B reserve_accrued_cents == 760000 (max(100.0, 150) x 4000 + 20 x 8000)"
            - "identical reported utilization produces different accruals across variants: 560000 != 760000"

      - name: return_compensation_provisional_vs_final
        grounds:
          - calculations.return_compensation
          - entities.ReturnCase.fields.provisional_estimate_cents
          - entities.ReturnCase.fields.agreed_total_cents
        distinguishing_aspect: |
          ReturnCase-domain dual variant (different entity domain from the Lease
          reserve ledger variant): the same NON_COMPLIANT items price at 129455 cents
          under the provisional severity-weighted per-item-rounded estimate but settle
          at the negotiated lump sum 100000 cents under the final_agreed variant.
        test_recipe:
          setup:
            - "Aircraft with all 4 required doc types VERIFIED; ACTIVE lease (ACTUAL basis); ReturnCase advanced to INSPECTION with inspector booked on 2026-08-01 (logical clock default)"
            - "Checklist: ENGINE NON_COMPLIANT est 100000 (MAJOR), INTERIOR NON_COMPLIANT est 4050 (MINOR), AIRFRAME and PAINT COMPLIANT"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-C3", model: "B737-800", manufacture_date: "2010-03-30" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-C3" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-C3" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-C3" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-C3" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Cascade Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-001" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}/checklist-items", payload: {}, as: LessorAdmin, captures: { it_air: "$.data[0].id", it_eng: "$.data[1].id", it_int: "$.data[2].id", it_pnt: "$.data[3].id"} }
            - { call: "POST /leasing/checklist-items/${it_air}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 100000 }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_int}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 4050 }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_pnt}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "NEGOTIATION" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/proposals", payload: { amount_cents: 100000 }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}", payload: {}, as: LessorAdmin, captures: { rc_v: "$.data.version", prov: "$.data.provisional_estimate_cents"} }
          trigger:
            - { call: "POST /leasing/return-cases/${rc}/agree", payload: { expected_return_case_version: "${rc_v}" }, as: LesseeRep, as_user_id: "${les}", captures: { agreed: "$.data.agreed_total_cents"} }
          assert:
            - "ReturnCase.provisional_estimate_cents == 129455 (round(100000 x 1.25) + round(4050 x 1.10) = 125000 + 4455)"
            - "ReturnCase.agreed_total_cents == 100000 (negotiated lump sum, final variant)"
            - "the two variants diverge for the same items: 129455 != 100000"

  - rule_id: combinatorial_formula
    instances:
      - name: monthly_charge_tiered_overage
        grounds:
          - calculations.monthly_lease_charge
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (flight_hours, monthly_hour_cap,
          flight_cycles) with non-linear interaction — nested min/max tier split of
          overage hours plus a conditional cycle-ratio surcharge branch.
        test_recipe:
          setup:
            - "ACTIVE lease: rent 1000000, cap 300 h; ACCEPTED report for 2026-08 of 340.0 hours / 400 cycles"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-D4", model: "A321neo", manufacture_date: "2018-06-01" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-D4" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Delta Jets" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 340.0, flight_cycles: 400 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id"} }
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin }
          trigger:
            - { call: "GET /leasing/leases/${lease}/monthly-charge", payload: { month: "2026-08" }, as: LessorAdmin, captures: { tot: "$.data.total_cents", ovg: "$.data.overage_cents", sur: "$.data.cycle_surcharge_cents"} }
          assert:
            - "overage_cents == 200000 (overage 40 h all inside tier 1: 40 x 5000)"
            - "cycle_surcharge_cents == 25000 (400 cycles x 2 = 800 > 340 hours)"
            - "total_cents == 1225000 (1000000 + 200000 + 25000)"

      - name: settlement_netting_evaluation_order
        grounds:
          - calculations.settlement_netting
          - entities.Lease.fields.reserve_forfeited_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          reserve offset is computed from the balance BEFORE the remainder is
          forfeited — offset-then-forfeit yields cash_due 0 / forfeited 200000,
          whereas forfeit-first would yield cash_due 300000; only the pinned order is
          correct. Distinct mode from monthly_charge_tiered_overage (mode a).
        test_recipe:
          setup:
            - "ACTIVE lease with reserve_accrued 560000 (accepted 100.0 h / 20 cycles report) and one PAID claim of 60000 -> reserve_balance 500000"
            - "ReturnCase AGREED with agreed_total 300000 (ENGINE NON_COMPLIANT est 80000; other items COMPLIANT; all 4 doc types verified)"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-E5", model: "A330-300", manufacture_date: "2009-11-20" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-E5" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Echo Freight" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 100.0, flight_cycles: 20 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id"} }
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/reserve-claims", payload: { maintenance_event_ref: "ENG-SHOP-1", claimed_amount_cents: 60000 }, as: LesseeRep, as_user_id: "${les}", captures: { cl: "$.data.id"} }
            - { call: "POST /leasing/reserve-claims/${cl}/decide", payload: { decision: "APPROVE", approved_amount_cents: 60000 }, as: LessorAdmin }
            - { call: "POST /leasing/reserve-claims/${cl}/pay", payload: {}, as: FinanceManager }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-E5" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-E5" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-E5" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-002" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}/checklist-items", payload: {}, as: LessorAdmin, captures: { it_air: "$.data[0].id", it_eng: "$.data[1].id", it_int: "$.data[2].id", it_pnt: "$.data[3].id"} }
            - { call: "POST /leasing/checklist-items/${it_air}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 80000 }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_int}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_pnt}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "NEGOTIATION" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/proposals", payload: { amount_cents: 300000 }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}", payload: {}, as: LessorAdmin, captures: { rc_v: "$.data.version"} }
            - { call: "POST /leasing/return-cases/${rc}/agree", payload: { expected_return_case_version: "${rc_v}" }, as: LesseeRep, as_user_id: "${les}" }
          trigger:
            - { call: "POST /leasing/return-cases/${rc}/settle", payload: {}, as: FinanceManager, captures: { applied: "$.data.reserve_applied_cents", cash: "$.data.settlement_cash_due_cents"} }
            - { call: "GET /leasing/leases/${lease}", payload: {}, as: LessorAdmin, captures: { forf: "$.data.reserve_forfeited_cents", bal: "$.data.reserve_balance_cents"} }
          assert:
            - "ReturnCase.reserve_applied_cents == 300000 (min(balance 500000, agreed 300000), computed BEFORE forfeiture)"
            - "ReturnCase.settlement_cash_due_cents == 0"
            - "Lease.reserve_forfeited_cents == 200000 (balance 500000 - applied 300000)"
            - "Lease.reserve_balance_cents == 0 after settlement"

  - rule_id: non_linear_state_machine
    instances:
      - name: return_case_negotiation_self_loop_and_reinspection_cycle
        grounds:
          - state_machines.ReturnCase.NEGOTIATION_to_NEGOTIATION
          - state_machines.ReturnCase.NEGOTIATION_to_INSPECTION
        distinguishing_aspect: |
          ReturnCase is cyclic in two ways: the proposal self-loop (round_count 1->2)
          and the NEGOTIATION -> INSPECTION -> NEGOTIATION re-inspection loop that
          reverts NON_COMPLIANT items to PENDING while preserving round_count; the
          loop is capped (reinspection_count hits MAX_REINSPECTIONS 1).
        test_recipe:
          setup:
            - "ReturnCase in NEGOTIATION; ENGINE NON_COMPLIANT est 80000 (provisional 100000); inspector booked 2026-08-01; all other items COMPLIANT"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-F6", model: "B777-300ER", manufacture_date: "2011-09-14" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-F6" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-F6" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-F6" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-F6" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Foxtrot Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-003" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}/checklist-items", payload: {}, as: LessorAdmin, captures: { it_air: "$.data[0].id", it_eng: "$.data[1].id", it_int: "$.data[2].id", it_pnt: "$.data[3].id"} }
            - { call: "POST /leasing/checklist-items/${it_air}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 80000 }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_int}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_pnt}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "NEGOTIATION" }, as: LessorAdmin }
          trigger:
            - { call: "POST /leasing/return-cases/${rc}/proposals", payload: { amount_cents: 200000 }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/proposals", payload: { amount_cents: 150000 }, as: LesseeRep, as_user_id: "${les}", captures: { rounds: "$.data.round_count", proposer: "$.data.current_proposer_side"} }
            - { call: "POST /leasing/return-cases/${rc}/request-reinspection", payload: {}, as: LesseeRep, as_user_id: "${les}", captures: { st: "$.data.status", re_count: "$.data.reinspection_count", rounds_after: "$.data.round_count"} }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 70000 }, as: TechInspector, as_user_id: "${insp}", captures: { eng_st: "$.data.status"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "NEGOTIATION" }, as: LessorAdmin, captures: { prov2: "$.data.provisional_estimate_cents"} }
            - { call: "POST /leasing/return-cases/${rc}/request-reinspection", payload: {}, as: LesseeRep, as_user_id: "${les}", captures: { err: "$.data.error_id"} }
          assert:
            - "after two proposals round_count == 2 and current_proposer_side == LESSEE (self-loop NEGOTIATION->NEGOTIATION)"
            - "after request-reinspection: status == INSPECTION, reinspection_count == 1, round_count still == 2 (negotiation state preserved across the loop)"
            - "re-inspection of the reverted ENGINE item succeeds (item was reset to PENDING by the loop, new estimate 70000 recorded)"
            - "second entry to NEGOTIATION recomputes provisional_estimate_cents == 87500 (70000 x 1.25)"
            - "second request-reinspection rejected with ERR_REINSPECTION_LIMIT (cycle is bounded)"

      - name: utilization_report_dispute_revise_cycle
        grounds:
          - state_machines.UtilizationReport.DISPUTED_to_SUBMITTED
          - state_machines.UtilizationReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          UtilizationReport (different entity than ReturnCase) cycles
          SUBMITTED -> DISPUTED -> SUBMITTED via lessee revision, and the subsequent
          ACCEPT posts accrual computed from the REVISED figures (656000 for
          120.0 h / 22 cycles), not the originally submitted ones.
        test_recipe:
          setup:
            - "ACTIVE lease (rate_fh 4000, rate_fc 8000, ACTUAL); report 2026-08 submitted with 100.0 h / 20 cycles then DISPUTED by lessor"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-G7", model: "A350-900", manufacture_date: "2019-04-02" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-G7" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Golf Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 100.0, flight_cycles: 20 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id"} }
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "DISPUTE", reason: "hours mismatch vs ACARS" }, as: LessorAdmin }
          trigger:
            - { call: "POST /leasing/utilization-reports/${rep}/revise", payload: { flight_hours: 120.0, flight_cycles: 22 }, as: LesseeRep, as_user_id: "${les}", captures: { st: "$.data.status", ver: "$.data.version"} }
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin, captures: { posted: "$.data.posted_accrual_cents"} }
            - { call: "GET /leasing/leases/${lease}", payload: {}, as: LessorAdmin, captures: { acc: "$.data.reserve_accrued_cents"} }
            - { call: "GET /leasing/aircraft/${ac}", payload: {}, as: LessorAdmin, captures: { hrs: "$.data.total_flight_hours", cyc: "$.data.total_flight_cycles"} }
          assert:
            - "after revise: report status == SUBMITTED again (cycle completed) and version incremented at least twice since creation"
            - "posted_accrual_cents == 656000 from REVISED figures (120.0 x 4000 + 22 x 8000), not 560000 from the original submission"
            - "Lease.reserve_accrued_cents == 656000; Aircraft totals == 120.0 hours / 22 cycles"

  - rule_id: transitive_cascade
    instances:
      - name: repossession_cascade_depth3
        grounds:
          - state_machines.DefaultCase.REPOSSESSION_AUTHORIZED_to_REPOSSESSED
          - state_machines.Lease.DEFAULTED_to_TERMINATED
          - state_machines.Aircraft.ON_LEASE_to_REPOSSESSED
        distinguishing_aspect: |
          Depth-3 chain from execute-repossession: DefaultCase -> REPOSSESSED causes
          Lease -> TERMINATED (link 1), which causes Aircraft -> REPOSSESSED
          (link 2), which itself releases the TENTATIVE TransitionSlot and the
          cascade also cancels the OPEN ReturnCase (link 3) — each link is caused by
          the previous mutation, not by the original trigger.
        test_recipe:
          setup:
            - "ACTIVE lease with return initiated (ReturnCase OPEN) and a TENTATIVE transition slot on the aircraft; DefaultCase declared 2026-08-01 with 30-day cure; logical clock advanced past the cure deadline; repossession authorized by a LegalApprover distinct from the declarer"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-H8", model: "B787-9", manufacture_date: "2016-12-08" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-H8" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Hotel Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/aircraft/${ac}/transition-slots", payload: { window_start: "2026-09-10", window_end: "2026-09-20", next_operator_ref: "NEXT-OP-1" }, as: LessorAdmin, captures: { slot: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/default-cases", payload: { reason: "rent arrears 2 months", cure_period_days: 30 }, as: CreditOfficer, as_user_id: "cred_1", captures: { dc: "$.data.id"} }
            - { call: "POST /leasing/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: LessorAdmin }
            - { call: "POST /leasing/default-cases/${dc}/authorize-repossession", payload: {}, as: LegalApprover, as_user_id: "legal_1" }
          trigger:
            - { call: "POST /leasing/default-cases/${dc}/execute-repossession", payload: {}, as: LessorAdmin, captures: { dc_st: "$.data.status"} }
            - { call: "GET /leasing/leases/${lease}", payload: {}, as: LessorAdmin, captures: { lease_st: "$.data.status"} }
            - { call: "GET /leasing/aircraft/${ac}", payload: {}, as: LessorAdmin, captures: { ac_st: "$.data.status"} }
            - { call: "GET /leasing/aircraft/${ac}/transition-slots", payload: {}, as: LessorAdmin, captures: { slot_st: "$.data[0].status"} }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc_st: "$.data[0].status"} }
          assert:
            - "DefaultCase.status == REPOSSESSED"
            - "link 1: Lease.status == TERMINATED (caused by the repossession)"
            - "link 2: Aircraft.status == REPOSSESSED (caused by the lease termination)"
            - "link 3: TransitionSlot.status == RELEASED (caused by the aircraft repossession) and ReturnCase.status == CANCELLED"

      - name: settlement_cascade_depth3_and_slot_autoconfirm
        grounds:
          - state_machines.ReturnCase.AGREED_to_SETTLED
          - state_machines.Lease.RETURN_INITIATED_to_RETURNED
          - state_machines.Aircraft.ON_LEASE_to_IN_TRANSITION
          - state_machines.TransitionSlot.TENTATIVE_to_CONFIRMED
        distinguishing_aspect: |
          Different triggering transition than repossession: settle causes ReturnCase
          -> SETTLED, which causes Lease -> RETURNED (link 1), which causes Aircraft
          -> IN_TRANSITION (link 2), which itself auto-confirms the covering
          TENTATIVE slot (link 3) selected by window containment of the settle date.
        test_recipe:
          setup:
            - "ReturnCase AGREED (agreed_total 50000, ENGINE NON_COMPLIANT est 80000, other items COMPLIANT); reserve balance 0 (no reports); TENTATIVE slot window 2026-08-01..2026-08-15 covering the settle date (clock default 2026-08-01)"
