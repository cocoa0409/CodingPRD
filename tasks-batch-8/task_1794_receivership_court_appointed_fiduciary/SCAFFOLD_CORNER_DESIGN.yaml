            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor A", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 100000 }
              as: Creditor
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /v1/claims/${cid}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 150000 }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ALLOWED_EXCEEDS_FILED"

      - name: duplicate_case_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_CASE_NUMBER]"]
        distinguishing_aspect: "case_number is unique per court_jurisdiction: the second POST with the same (case_number, court_jurisdiction) pair is rejected with ERR_DUPLICATE_CASE_NUMBER."
        test_recipe:
          setup: ["One case 2026-CV-3023 in S.D.N.Y. already exists"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3023", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
