  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: execute_deep_cascade_depth_three
        grounds:
          - state_machines.Deal.LEASE_OUT_to_EXECUTED
          - state_machines.Listing.UNDER_NEGOTIATION_to_EXECUTED
          - state_machines.Space.UNDER_LOI_to_LEASED
          - entities.Listing.fields.status
        distinguishing_aspect: |
          Depth-3 chain caused link-by-link: execute mutates Deal->EXECUTED, which
          mutates Listing->EXECUTED, which (Listing EXECUTED) cascades sibling Deal B
          ->DEAD; separately Space->LEASED. The sibling-DEAD link is caused by the
          Listing transition, not directly by execute.
        test_recipe:
          setup:
            - "One Listing with TWO open Deals (A in LEASE_OUT after accept+lease-out; B in LOI_DRAFT) sharing the space; A about to execute."
