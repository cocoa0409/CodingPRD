# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2616_prepaid_restaurant_ticketing_experience_reservations
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Every instance either carries a fully
# executable test_recipe or an excluded_because stub naming the
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance that already covers the corner.
#
# Recurring fixture (called the STD chain below, re-typed in full per instance
# because the downstream generator transcribes each recipe verbatim):
#   clock 2026-09-01T00:00:00Z; restaurant service_charge_bp 725,
#   hold_ttl 20, offer_ttl 15, max_offer_rounds 2, max_name_changes 1,
#   name_change_cutoff 240, transfer_cutoff 1440, max_transfers_per_guest 2,
#   no_show_grace 30, goodwill cap 20000, prep_lead 45, scrutiny 300000;
#   package base_price 12000, DEPOSIT, deposit_bp 3000, STANDARD,
#   DEPOSIT_BASIS, release_discount_bp 1500, prep 12/cover, band 1..8;
#   service 2026-09-10 (THU) DINNER, seating 22:00Z..02:00Z, turn 150,
#   capacity 20, STANDARD tier, unsold_release_bp 5000, release_lead 180,
#   FAIR_QUEUE, kitchen capacity 600; ticket class 20 seats, band 1..8.
#   Derived money for a party of 2: unit 12000, subtotal 24000,
#   service charge 1740, grand 25740, deposit 7722, balance after deposit
#   18018, prep_minutes_total 24.

scaffold_corner_design:

  - section: entities
    instances:

      - name: creation_restaurant_persists_every_policy_knob
        claim_type: Creation
        grounds:
          - entities.Restaurant
          - endpoints.POST_/restaurants
          - response_envelope.success
        distinguishing_aspect: "A POST /restaurants carrying all thirteen policy knobs returns 201 with every supplied value echoed under data, plus system id/created_at/updated_at/version."
        test_recipe:
          setup:
            - "empty database, logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /restaurants"
              payload: { name: "Corner Creation House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, max_name_changes: 1, name_change_cutoff_minutes: 240, transfer_cutoff_minutes: 1440, max_transfers_per_guest: 2, no_show_grace_minutes: 30, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          assert:
            - "HTTP 201 with response_type object and a data envelope carrying meta.api_request_id"
            - "Restaurant.${r_id}.name == Corner Creation House and service_charge_bp == 725"
            - "Restaurant.${r_id}.hold_ttl_minutes == 20, offer_ttl_minutes == 15, max_offer_rounds == 2"
            - "Restaurant.${r_id}.max_name_changes == 1, name_change_cutoff_minutes == 240, transfer_cutoff_minutes == 1440"
            - "Restaurant.${r_id}.max_transfers_per_guest == 2, no_show_grace_minutes == 30, prep_lead_minutes == 45"
            - "Restaurant.${r_id}.goodwill_credit_cap_cents == 20000 and refund_scrutiny_threshold_cents == 300000"
            - "id, created_at, updated_at and version are present in the response and were not supplied by the client"

      - name: defaults_restaurant_omitted_policy_knobs_take_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Restaurant.fields.service_charge_bp
          - entities.Restaurant.fields.hold_ttl_minutes
          - entities.Restaurant.fields.refund_scrutiny_threshold_cents
        distinguishing_aspect: "A POST /restaurants carrying only name applies all twelve declared defaults, including refund_scrutiny_threshold_cents 30000, which every other fixture overrides to 300000."
        test_recipe:
          setup:
            - "empty database, logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /restaurants"
              payload: { name: "Corner Defaults House" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          assert:
            - "Restaurant.${r_id}.service_charge_bp == 725 and hold_ttl_minutes == 20"
            - "Restaurant.${r_id}.offer_ttl_minutes == 15 and max_offer_rounds == 2"
            - "Restaurant.${r_id}.max_name_changes == 1 and name_change_cutoff_minutes == 240"
            - "Restaurant.${r_id}.transfer_cutoff_minutes == 1440 and max_transfers_per_guest == 2"
            - "Restaurant.${r_id}.no_show_grace_minutes == 30 and prep_lead_minutes == 45"
            - "Restaurant.${r_id}.goodwill_credit_cap_cents == 20000"
            - "Restaurant.${r_id}.refund_scrutiny_threshold_cents == 30000, the declared default rather than the 300000 the other fixtures pass"

      - name: defaults_package_service_and_addon_omitted_fields_take_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.ExperiencePackage.fields.deposit_bp
          - entities.Service.fields.demand_tier
          - entities.AddOn.fields.max_qty_per_cover
        distinguishing_aspect: "Omitting the optional fields of ExperiencePackage, Service and AddOn yields deposit_bp 3000 / STANDARD+FAIR_QUEUE / max_qty_per_cover 1, and Service.day_of_week is still derived as THU from the supplied service_date."
        test_recipe:
          setup:
            - "one restaurant created with only name, so every policy knob is at its default"
            - "logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Minimal House" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Bare Menu", course_count: 6, base_price_cents: 12000, prepayment_mode: "DEPOSIT", min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
            - call: "POST /add-ons"
              payload: { restaurant_id: "${r_id}", name: "Bare Caviar", price_cents: 4500 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { ao_id: $.data.id }
          assert:
            - "ExperiencePackage.${pkg_id}.deposit_bp == 3000, forfeiture_schedule_code == STANDARD, forfeiture_basis == DEPOSIT_BASIS"
            - "ExperiencePackage.${pkg_id}.release_discount_bp == 1500 and kitchen_prep_minutes_per_cover == 10"
            - "Service.${svc_id}.demand_tier == STANDARD, unsold_release_bp == 5000, release_lead_minutes == 180"
            - "Service.${svc_id}.waitlist_policy == FAIR_QUEUE and kitchen_prep_capacity_minutes == 600"
            - "Service.${svc_id}.day_of_week == THU, derived from service_date 2026-09-10 and never supplied by the client"
            - "Service.${svc_id}.status == DRAFT"
            - "AddOn.${ao_id}.prep_minutes_per_unit == 0, max_qty_per_cover == 1, order_cutoff_minutes == 1440, requires_kitchen_ack == false"

      - name: computed_fields_ticket_class_seat_pool_and_two_prices_on_create
        claim_type: Computed Fields
        grounds:
          - calculations.ticket_price_per_cover
          - calculations.seat_pool_reconciliation
          - entities.TicketClass.fields.release_price_per_cover_cents
        distinguishing_aspect: "POST /ticket-classes computes seats_available 20, sell_through_bp 0, list_price_per_cover_cents 12000 and release_price_per_cover_cents 10200 on a THU STANDARD service, none of which the client may supply."
        test_recipe:
          setup:
            - "STD chain restaurant, package and DRAFT service"
            - "logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Compute House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Menu", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "STANDARD", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "FAIR_QUEUE", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
          trigger:
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_id}", package_id: "${pkg_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_id: $.data.id }
          assert:
            - "TicketClass.${tc_id}.seats_sold == 0, seats_held == 0, seats_released == 0, seats_available == 20"
            - "TicketClass.${tc_id}.sell_through_bp == 0"
            - "TicketClass.${tc_id}.list_price_per_cover_cents == 12000 (DOW_BP THU 10000 x TIER_BP STANDARD 10000 / 10000 = 10000 bp, inside the 8500..18000 clamp, applied to base 12000)"
            - "TicketClass.${tc_id}.release_price_per_cover_cents == 10200 (12000 less the 1500 bp release discount)"
            - "TicketClass.${tc_id}.status == OPEN"
            - "20 == 0 + 0 + 0 + 20 satisfies the seat-pool invariant at creation"

      - name: system_fields_reservation_ids_and_statuses_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Reservation.fields.service_id
          - entities.Reservation.fields.fulfillment_status
          - entities.Reservation.fields.price_locked_per_cover_cents
        distinguishing_aspect: "POST /reservations declares only ticket_class_id, guest_id, party_size, primary_guest_name and expected_ticket_class_version; service_id, fulfillment_status, payment_status, price_locked_per_cover_cents, hold_expires_at_utc and id are all server-set, and client-supplied values for them are rejected as unrecognised fields."
        test_recipe:
          setup:
            - "STD chain through PUBLISHED service and OPEN ticket class"
            - "one guest, logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner System House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Menu", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "STANDARD", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "FAIR_QUEUE", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_id}", package_id: "${pkg_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_id: $.data.id }
            - call: "POST /services/${svc_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /guests"
              payload: { email: "sys@corner.test", display_name: "System Guest" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { tc_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g_id}", party_size: 2, primary_guest_name: "System Guest", expected_ticket_class_version: "${tc_v}", fulfillment_status: "CONFIRMED", price_locked_per_cover_cents: 1, amount_paid_cents: 99999 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err_sys: $.data.error_id }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g_id}", party_size: 2, primary_guest_name: "System Guest", expected_ticket_class_version: "${tc_v}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          assert:
            - "${err_sys} == ERR_VALIDATION with HTTP 400 for the request smuggling fulfillment_status, price_locked_per_cover_cents and amount_paid_cents"
            - "no Reservation row was created by the refused request"
            - "the clean request returns 201 with Reservation.${res_id}.service_id == ${svc_id}, copied from the ticket class rather than supplied"
            - "Reservation.${res_id}.fulfillment_status == PENDING and payment_status == UNPAID"
            - "Reservation.${res_id}.price_locked_per_cover_cents == 12000 and amount_paid_cents == 0"
            - "Reservation.${res_id}.hold_expires_at_utc == 2026-09-01T00:20:00Z, the logical clock plus hold_ttl_minutes 20"
            - "Reservation.${res_id}.assigned_table_id is null, transferred_from_reservation_id is null, deposit_frozen == false, name_change_count == 0"

      - name: retrieval_service_returns_stored_fields_and_derived_day_of_week
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/services/{id}
          - entities.Service.fields.day_of_week
          - entities.Service.fields.covers_confirmed
        distinguishing_aspect: "GET /services/{id} returns the stored seating window verbatim and the derived day_of_week SAT for service_date 2026-09-12, with every money rollup still 0 before any reservation exists."
        test_recipe:
          setup:
            - "one restaurant and one DRAFT service dated 2026-09-12 (a Saturday)"
            - "logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Read House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-12", meal_period: "LUNCH", seating_start_utc: "2026-09-12T11:00:00Z", seating_end_utc: "2026-09-12T15:00:00Z", turn_time_minutes: 90, seats_capacity: 12, demand_tier: "PEAK", unsold_release_bp: 2500, release_lead_minutes: 120, waitlist_policy: "YIELD_WEIGHTED", kitchen_prep_capacity_minutes: 240 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
          trigger:
            - call: "GET /services/${svc_id}"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
          assert:
            - "HTTP 200 with the stored values echoed: service_date 2026-09-12, meal_period LUNCH, seating_start_utc 2026-09-12T11:00:00Z, seating_end_utc 2026-09-12T15:00:00Z"
            - "Service.${svc_id}.turn_time_minutes == 90, seats_capacity == 12, demand_tier == PEAK, waitlist_policy == YIELD_WEIGHTED"
            - "Service.${svc_id}.day_of_week == SAT"
            - "Service.${svc_id}.status == DRAFT, release_run_count == 0, seats_released_total == 0, last_release_released_count == 0, last_release_promoted_count == 0"
            - "Service.${svc_id}.covers_confirmed == 0, gross_charged_cents == 0, refunded_cents == 0, forfeited_cents == 0, net_settled_cents == 0"

      - name: listing_services_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/services
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three services on one restaurant, GET /services?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "one restaurant with three DRAFT services dated 2026-09-10, 2026-09-11 and 2026-09-12"
            - "logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Page House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20 }
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-11", meal_period: "DINNER", seating_start_utc: "2026-09-11T22:00:00Z", seating_end_utc: "2026-09-12T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20 }
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-12", meal_period: "DINNER", seating_start_utc: "2026-09-12T22:00:00Z", seating_end_utc: "2026-09-13T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20 }
              as: RestaurantManager
              as_user_id: "${r_id}"
          trigger:
            - call: "GET /services"
              payload: { restaurant_id: "${r_id}", limit: 2, offset: 0 }
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "GET /services"
              payload: { restaurant_id: "${r_id}", limit: 2, offset: 2 }
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "GET /services"
              payload: { restaurant_id: "${r_id}", status: "PUBLISHED" }
              as: RestaurantManager
              as_user_id: "${r_id}"
          assert:
            - "the first page returns response_type array with 2 rows, limit 2, offset 0, total_count 3, has_more true"
            - "the second page returns 1 row, limit 2, offset 2, total_count 3, has_more false"
            - "the two pages together contain the three distinct service ids with no repetition"
            - "the status PUBLISHED filter returns 0 rows with total_count 0 and has_more false, since all three services are DRAFT"

      - name: listing_pagination_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - validations.priority_8_ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 0, limit 101 and offset -1 each return ERR_INVALID_PAGINATION 400 on GET /services, while limit 100 and offset 0 are accepted."
        test_recipe:
          setup:
            - "one restaurant with one DRAFT service"
            - "logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Bad Page House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20 }
              as: RestaurantManager
              as_user_id: "${r_id}"
          trigger:
            - call: "GET /services"
              payload: { limit: 0 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { err_lo: $.data.error_id }
            - call: "GET /services"
              payload: { limit: 101 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { err_hi: $.data.error_id }
            - call: "GET /services"
              payload: { offset: -1 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { err_off: $.data.error_id }
            - call: "GET /services"
              payload: { limit: 100, offset: 0 }
              as: RestaurantManager
              as_user_id: "${r_id}"
          assert:
            - "${err_lo} == ERR_INVALID_PAGINATION with HTTP 400"
            - "${err_hi} == ERR_INVALID_PAGINATION with HTTP 400"
            - "${err_off} == ERR_INVALID_PAGINATION with HTTP 400"
            - "the limit 100 offset 0 request returns HTTP 200 with 1 row and total_count 1"

      - name: not_found_reads_return_the_entity_specific_404
        claim_type: Not Found
        grounds:
          - validations.priority_5_existence
          - errors[ERR_RESTAURANT_NOT_FOUND]
          - errors[ERR_GOODWILL_CREDIT_NOT_FOUND]
        distinguishing_aspect: "Each of the fourteen single-id GET endpoints returns its own ERR_<ENTITY>_NOT_FOUND 404 for an unused UUID, so no endpoint falls back to a generic not-found code."
        test_recipe:
          setup:
            - "empty database apart from the logical clock; every id below is an unused UUID"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
