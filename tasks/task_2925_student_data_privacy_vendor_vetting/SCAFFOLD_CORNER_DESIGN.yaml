          - complexity_profile.role_model
          - entities.PrivacyAnalyst.fields.credential_level
        distinguishing_aspect: |
          Priority 7 is a CONJUNCTION on review decide, and both limbs must be independently
          fatal: the LEAD assignee (AN2) is refused because X-User-ID equals
          assigned_analyst_id, the SENIOR non-assignee (AN1) is refused because the
          credential is not LEAD, and only the LEAD non-assignee (AN3) may decide. An
          implementation that checks either limb alone lets one of the first two through.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V, Application A, Teacher T."
            - "Analysts: AN1 SENIOR, AN2 LEAD, AN3 LEAD (all capacity 2400)."
