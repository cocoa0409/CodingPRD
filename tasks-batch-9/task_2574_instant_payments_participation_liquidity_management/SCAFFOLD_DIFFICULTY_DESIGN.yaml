            - call: "POST /return-requests"
              payload: { credit_transfer_id: "${t1_id}", requested_by_participant_id: "${pb_id}", reason_code: "TECHNICAL_ERROR", returned_amount_cents: 250000000, narrative: "Duplicate posting caused by a channel retry." }
              as: PaymentOperator
              as_user_id: "ops-beta-01"
              captures: { rr_id: $.data.id }
