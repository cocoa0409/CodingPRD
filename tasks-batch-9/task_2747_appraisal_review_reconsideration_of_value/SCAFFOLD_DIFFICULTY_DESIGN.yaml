            - "LoanFile.${lf1_id}.effective_value_cents == 50000000 (the PURCHASE min() ties at the contract price)"
            - "LoanFile.${lf1_id}.ltv_bps == 8000 exactly"
            - "LoanFile.${lf1_id}.decision_impact == NO_IMPACT (the 8000 bound is inclusive)"
            - "LoanFile.${lf1_id}.underwriting_status == SUBMITTED (unchanged -- no suspension, and nothing to reinstate) and collateral_status == VALUE_REVISED"
            - "AMC.${amc1_id}.ytd_escalation_spend_cents == 45000"

      - name: rule_check_battery_on_empty_comparable_grid
        grounds:
          - calculations.receipt_rule_check_battery
