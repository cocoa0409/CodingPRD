              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Insulin glargine", ndc: "00088-2220-33", strength: "100units/mL", form: "INJECTION_PEN", copay_tier: "SPECIALTY", dose_times: ["BEDTIME"], quantity_per_dose: 1, days_supply_written: 28, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", refrigerated: true, last_dispensed_date: "2026-07-18", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx_cold: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
          trigger:
            - call: "POST /pharmacy/fill-cycles/${c1}/shipments"
              payload: { shipment_kind: "POUCH_ROLL", carrier_service: "GROUND", packaging: "STANDARD" }
              as: PharmacyOperations
              captures: { err: $.data.error_id }
            - call: "POST /pharmacy/fill-cycles/${c1}/shipments"
              payload: { shipment_kind: "COLD_CHAIN", carrier_service: "OVERNIGHT", packaging: "INSULATED_GEL" }
              as: PharmacyOperations
              captures: { cold_id: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c1}/generate-roll"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
              captures: { roll: $.data.id }
            - call: "POST /pharmacy/pouch-rolls/${roll}/pack"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
            - call: "POST /pharmacy/pouch-rolls/${roll}/verification-images"
              payload: { image_confidence_pct: 97 }
              as: PackagingTechnician
              as_user_id: "tech-02"
            - call: "POST /pharmacy/pouch-rolls/${roll}/verify"
              payload: {}
              as: VerifyingPharmacist
              as_user_id: "rph-01"
            - call: "POST /pharmacy/fill-cycles/${c1}/shipments"
              payload: { shipment_kind: "POUCH_ROLL", carrier_service: "GROUND", packaging: "STANDARD" }
              as: PharmacyOperations
              captures: { pouch_ship: $.data.id, pouch_cost: $.data.ship_cost_cents }
          assert:
            - "the first call returns 409 with ${err} == ERR_INVALID_CYCLE_STATE — a POUCH_ROLL parcel needs packaging_status IN {VERIFIED, SHIPPED}"
            - "the COLD_CHAIN parcel ${cold_id} is created at LINES_ADJUDICATED with status STAGED and ship_cost_cents 3445, covering only the ${rx_cold} line"
            - "the roll holds 28 pouches (MORNING only) and reaches PASSED, moving the cycle to VERIFIED"
            - "the retried POUCH_ROLL parcel now succeeds: ${pouch_cost} == 0, covers only the ${rx1} line, and FillCycle.${c1} version has risen once per staged parcel"
            - "a third POUCH_ROLL parcel on the same cycle would fail at priority 24 ERR_NO_LINES_FOR_SHIPMENT_KIND, because a live parcel of that kind already exists"

