scaffold_difficulty_design:

  # ----------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ----------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: scoring_mode_half_ppr_vs_ppr_on_matchup
        grounds:
          - calculations.matchup_scoring
          - calculations.matchup_scoring.variants.half_ppr
          - calculations.matchup_scoring.variants.ppr
          - entities.League.fields.scoring_mode
          - entities.MatchupWeek.fields.home_points
        distinguishing_aspect: |
          Identical per-starter actual_points and receptions_credited produce different MatchupWeek.home_points
          depending on League.scoring_mode (HALF_PPR vs PPR), operating on the MatchupWeek entity domain.
        test_recipe:
          setup:
            - "Create two leagues L1 (scoring_mode=HALF_PPR) and L2 (scoring_mode=PPR), team_count=4, roster_size=12, starter_count=7, ir_slots=1, regular_season_weeks=10, playoff_team_count=2"
            - "In each league: create 4 teams, seed players, run a minimal draft, finish-draft so status=REGULAR_SEASON, current_week=1"
            - "Advance clock to lock week 1 in both leagues; identical home rosters: one starter with planned actual_points=6.0 and receptions_credited=4"
          trigger:
            - "POST /leagues/{L1}/matchups/1/score with scores=[{player_id, actual_points: 6.0, receptions_credited: 4}, ...other starters=0]"
            - "POST /leagues/{L2}/matchups/1/score with the same scores"
          assert:
            - "L1 MatchupWeek.home_points == 8.00  # 6.0 + 0.5*4"
            - "L2 MatchupWeek.home_points == 10.00 # 6.0 + 1.0*4"
            - "L1.home_points != L2.home_points despite identical scored_input"

      - name: keeper_round_drafted_vs_undrafted_on_keeper_designation
        grounds:
          - calculations.keeper_snake_round
          - calculations.keeper_snake_round.variants.drafted_last_year
          - calculations.keeper_snake_round.variants.undrafted_free_agent
          - entities.KeeperDesignation.fields.assigned_round
          - entities.League.fields.draft_mode
        distinguishing_aspect: |
          Same (team_id, player_id) input to KeeperDesignation pre-allocation produces different assigned_round
          depending on whether a prior-season DraftPick exists; the calculation acts on the KeeperDesignation
          entity (a different domain from MatchupWeek scoring above).
        test_recipe:
          setup:
            - "Create prior-season league L_2025 (season_year=2025, draft_mode=SNAKE, team_count=4, roster_size=12, starter_count=7, ir_slots=1, regular_season_weeks=14, keeper_mode=DYNASTY, keeper_cap=2) with team T1 (manager_user_id=U1) and 3 other teams; register player P1 in catalog"
            - "POST /leagues/{L_2025}/start-draft; POST /leagues/{L_2025}/draft-picks for T1 picking P1 such that overall_pick_index lands T1 in round_number=5 (use snake ordering math); finish remaining picks; POST /leagues/{L_2025}/finish-draft"
            - "Create current-season league L_2026 (season_year=2026, draft_mode=SNAKE, regular_season_weeks=14, team_count=4, keeper_mode=DYNASTY, keeper_cap=2) with team T1 keyed by SAME manager_user_id=U1; register player P2 in catalog (no prior-season pick); L_2026.status remains DRAFT_PENDING"
          trigger:
            - "POST /teams/{T1_in_L_2026}/keepers with player_id=P1, season_year=2026"
            - "POST /teams/{T1_in_L_2026}/keepers with player_id=P2, season_year=2026"
          assert:
            - "KeeperDesignation(P1).assigned_round == 4  # max(1, 5-1)"
            - "KeeperDesignation(P2).assigned_round == 19 # regular_season_weeks(14)+5; no prior pick"
            - "KeeperDesignation(P1).assigned_round != KeeperDesignation(P2).assigned_round"

  # ----------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes (a,b,c)
  # ----------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: faab_resolution_three_input_nonlinear_mode_a
        grounds:
          - calculations.faab_waiver_resolution
          - entities.WaiverClaim.fields.bid_dollars
          - entities.WaiverClaim.fields.priority_seed
          - entities.WaiverClaim.fields.created_at
        distinguishing_aspect: |
          Mode (a) — formula has three independent inputs (bid_dollars desc, priority_seed asc,
          created_at asc) plus a conditional branch on Team.faab_balance_dollars and on roster-cap; selection
          requires nested ordering and a skip-on-insufficient-funds branch.
        test_recipe:
          setup:
            - "Create league L in REGULAR_SEASON, team_count=4, faab_budget_dollars=100, waiver_period_hours=48, roster_size=12, current_week=2"
            - "Mark player P_target as status_tag=OUT and dropped 1 hour ago (in-waivers); rosters have one open slot for each team"
            - "Team A (faab_balance=100, priority_seed=3) submits claim bid=$10 first; Team B (faab_balance=100, priority_seed=1) submits claim bid=$10 second; Team C (faab_balance=5, priority_seed=2) submits claim bid=$20 third"
          trigger:
            - "POST /leagues/{L}/_clock/advance to settle_ts of all claims"
            - "POST /leagues/{L}/_waivers/process"
          assert:
            - "WaiverClaim(C).status == LOST  # insufficient FAAB (5 < 20), skipped"
            - "WaiverClaim(B).status == AWARDED  # bid tie with A, lower priority_seed (1<3) wins"
            - "WaiverClaim(A).status == LOST"
            - "Team(B).faab_balance_dollars == 90"
            - "Team(A).faab_balance_dollars == 100 # unchanged because A lost"

      - name: matchup_scoring_sum_then_round_mode_b
        grounds:
          - calculations.matchup_scoring
          - calculations.matchup_scoring.precision
          - entities.MatchupWeek.fields.home_points
          - entities.League.fields.scoring_mode
        distinguishing_aspect: |
          Mode (b) — the scaffold explicitly pins sum-then-round order (vs round-then-sum). Inputs are chosen
          so per-starter banking rounding would diverge from end-sum rounding; the pinned order is
          load-bearing for the literal output.
        test_recipe:
          setup:
            - "Create league L with scoring_mode=HALF_PPR; team_count=2; starter_count=7"
            - "Start regular season, advance to LOCK week 1; home starter S1 with receptions_credited=1 and actual_points=1.505 (HALF_PPR contrib = 1.505 + 0.5 = 2.005); home starter S2 with receptions_credited=1 and actual_points=1.505 (also contrib 2.005); remaining 5 starters with actual_points=0"
          trigger:
            - "POST /leagues/{L}/matchups/1/score with the above per-starter inputs"
          assert:
            - "MatchupWeek.home_points == 4.01  # sum 4.010 → ROUND_HALF_UP to 4.01"
            - "MatchupWeek.home_points != 4.02  # round-then-sum would give 2.01+2.01 = 4.02; this is the wrong order"

      - name: keeper_auction_inflation_circular_evaluation_mode_c
        grounds:
          - calculations.keeper_auction_price
          - entities.KeeperDesignation.fields.assigned_price_dollars
          - entities.Team.fields.auction_balance_dollars
          - state_machines.League.DRAFT_PENDING_to_DRAFTING
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency: Team.auction_balance_dollars depends on
          assigned_price_dollars, which depends on prior-season price (independent), but the side effect of
          start-draft also derives the keeper's effective debit before any auction pick is recorded. The
          scaffold pins evaluation order: keeper_auction_price runs FIRST on every KeeperDesignation
          in DECLARED before Team.auction_balance_dollars is decremented for the next keeper. Two keepers'
          debits do not interact.
        test_recipe:
          setup:
            - "Create prior-season league L_2025 (draft_mode=AUCTION, auction_budget_dollars=200, season_year=2025, team_count=2, keeper_mode=DYNASTY, keeper_cap=2) with team T1 (manager_user_id=U1)"
            - "Run start-draft on L_2025; POST /leagues/{L_2025}/draft-picks for T1 acquiring P1 at price=20 and P2 at price=5 (plus enough picks to satisfy roster_size cap); POST /leagues/{L_2025}/finish-draft"
            - "Create current-season league L_2026 (draft_mode=AUCTION, auction_budget_dollars=200, season_year=2026, team_count=2, keeper_mode=DYNASTY, keeper_cap=2) with team T1 keyed by SAME manager_user_id=U1"
            - "POST /teams/{T1_in_L_2026}/keepers for P1 (DECLARED), then for P2 (DECLARED)"
          trigger:
            - "POST /leagues/{L_2026}/start-draft"
          assert:
            - "KeeperDesignation(P1).assigned_price_dollars == 22  # ceil(20*1.10) = 22"
            - "KeeperDesignation(P2).assigned_price_dollars == 6   # ceil(5*1.10)=ceil(5.5)=6"
            - "Team(T1).auction_balance_dollars == 172             # 200 - 22 - 6, deterministic regardless of which keeper debits first"

  # ----------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ----------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: trade_proposal_branching_with_revert_paths
        grounds:
          - state_machines.TradeProposal
          - state_machines.TradeProposal.OFFERED_to_ACCEPTED_PENDING_REVIEW
          - state_machines.TradeProposal.OFFERED_to_REJECTED
          - state_machines.TradeProposal.OFFERED_to_CANCELED
          - state_machines.TradeProposal.ACCEPTED_PENDING_REVIEW_to_VETOED
          - state_machines.TradeProposal.ACCEPTED_PENDING_REVIEW_to_EXECUTED
          - state_machines.TradeProposal.ACCEPTED_PENDING_REVIEW_to_EXPIRED
        distinguishing_aspect: |
          TradeProposal has branching fork-join shape: from OFFERED it can fan to {ACCEPTED_PENDING_REVIEW,
          REJECTED, CANCELED}; from ACCEPTED_PENDING_REVIEW it fans again to {VETOED, EXECUTED, EXPIRED}, each
          with divergent side-effect sets (player movement only in EXECUTED). Non-linear branching on the
          TradeProposal entity.
        test_recipe:
          setup:
            - "Create league L in REGULAR_SEASON with 4 teams; T1 proposes trade to T2 sending player P_a, receiving P_b"
          trigger:
            - "POST /trades/{trade_id}/accept by T2 manager — transitions to ACCEPTED_PENDING_REVIEW"
            - "POST /trades/{trade_id}/votes vote=VETO from T3 and T4 (4-2=2 eligible voters; 2/2=100% >= 50%)"
          assert:
            - "TradeProposal.status == VETOED"
            - "RosterSlot for P_a still on T1; P_b still on T2  # no movement on VETOED branch"
            - "TradeProposal entered VETOED via the branch ACCEPTED_PENDING_REVIEW→VETOED, NOT EXECUTED"

      - name: league_branching_terminal_archive_path
        grounds:
          - state_machines.League
          - state_machines.League.DRAFT_PENDING_to_DRAFTING
          - state_machines.League.PLAYOFFS_to_COMPLETED
          - state_machines.League.COMPLETED_to_ARCHIVED
          - state_machines.League.DRAFTING_to_REGULAR_SEASON
        distinguishing_aspect: |
          League state machine combines a linear stem (DRAFT_PENDING→DRAFTING→REGULAR_SEASON→PLAYOFFS→
          COMPLETED) with a branching terminal: COMPLETED→ARCHIVED carries divergent side effects
          (cancel pending waivers, reject pending trades) absent in any other transition. The shape
          mixes linear progression with side-effect-distinct branches at terminal — non-linear on a
          different entity (League) than the TradeProposal above.
        test_recipe:
          setup:
            - "Run a league through DRAFT_PENDING→DRAFTING→REGULAR_SEASON→PLAYOFFS→COMPLETED (all 4 weeks of a 10-week regular + bracket scored)"
            - "Inject a PENDING WaiverClaim and an OFFERED TradeProposal just before archival (state COMPLETED still allows post-season operations until archived)"
          trigger:
            - "POST /leagues/{league_id}/archive"
          assert:
            - "League.status == ARCHIVED"
            - "WaiverClaim.status == CANCELED  # archive side-effect"
            - "TradeProposal.status == REJECTED  # archive side-effect"

  # ----------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ----------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: trade_execution_three_hop_cascade
        grounds:
          - state_machines.TradeProposal.ACCEPTED_PENDING_REVIEW_to_EXECUTED
          - state_machines.WaiverClaim.PENDING_to_CANCELED
          - entities.RosterSlot
          - entities.WaiverClaim
          - calculations.faab_waiver_resolution
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger (clock-advance past review_deadline_ts):
          hop1 — TradeProposal flips ACCEPTED_PENDING_REVIEW→EXECUTED;
          hop2 — that EXECUTED transition reassigns RosterSlot rows for traded players (RosterSlot.team_id changes);
          hop3 — the RosterSlot change itself causes any still-PENDING WaiverClaim whose add_player_id is now
          on the new team to transition PENDING→CANCELED (no longer in waivers because it is rostered).
          Each link is caused by the previous link, not by the original clock advance directly.
        test_recipe:
          setup:
            - "League L in REGULAR_SEASON; T1 proposes, T2 accepts a trade sending P_a (from T1) for P_b (from T2)"
            - "T3 submits a WaiverClaim for P_b with settle_ts in the future (P_b dropped earlier for setup)"
            - "Hmm — adjust: assume P_b becomes pickup-eligible (status_tag=OUT). T3's claim is PENDING with settle_ts > now"
            - "Clock is at now_ts; review_deadline_ts is now_ts + 48h"
          trigger:
            - "POST /leagues/{L}/_clock/advance to (review_deadline_ts + 1 minute)"
          assert:
            - "TradeProposal.status == EXECUTED  # hop 1"
            - "RosterSlot(P_b).team_id == T1     # hop 2: P_b moved from T2 to T1 via trade"
            - "WaiverClaim(T3,P_b).status == CANCELED  # hop 3: caused by hop 2"
            - "WaiverClaim(T3,P_b).status != LOST  # LOST is for sweep-loss; here it's CANCELED via cascade"

      - name: matchup_lock_two_hop_injury_replacement
        grounds:
          - state_machines.MatchupWeek.SCHEDULED_to_LOCKED
          - calculations.injury_replacement
          - entities.RosterSlot.fields.slot_type
          - entities.Player.fields.status_tag
        distinguishing_aspect: |
          Depth-2 cascade originating from a DIFFERENT trigger (clock advance to weekly lock time, not trade
          execution): hop1 — MatchupWeek SCHEDULED→LOCKED; hop2 — the LOCKED side-effect runs injury_replacement,
          which itself mutates two RosterSlot rows (swap slot_type STARTER↔BENCH). Hop2 is caused by hop1,
          not directly by the clock advance.
        test_recipe:
          setup:
            - "League L in REGULAR_SEASON; one team T1 has starter P1 (position=RB, status_tag=OUT) at slot RB1 and bench player P2 (position=RB, status_tag=ACTIVE, weekly_proj_points=12.0)"
          trigger:
            - "POST /leagues/{L}/_clock/advance crossing week-1 lock time"
          assert:
            - "MatchupWeek(week=1).status == LOCKED  # hop 1"
            - "RosterSlot(P1).slot_type == BENCH    # hop 2: caused by lock side-effect"
            - "RosterSlot(P2).slot_type == STARTER  # hop 2: swapped in"
            - "RosterSlot(P2).position_label == RB1 # position_label transferred"

  # ----------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ----------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_waiver_submit
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - errors.ERR_INVALID_STATE
          - errors.ERR_FAAB_INSUFFICIENT
        distinguishing_aspect: |
          When submitting a waiver in League.status=DRAFT_PENDING (no waivers permitted yet) with bid_dollars
          greater than Team.faab_balance_dollars: state precondition fails first (priority 7) returning
          ERR_INVALID_STATE, NOT business_fiscal ERR_FAAB_INSUFFICIENT (priority 19). Pair:
          {state, business_fiscal}.
        test_recipe:
          setup:
            - "Create league L (status=DRAFT_PENDING), team T1 with faab_balance_dollars=5; create player P_target"
          trigger:
            - "POST /leagues/{L}/waivers with team_id=T1, add_player_id=P_target, bid_dollars=999, settle_ts=now_ts+1h"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "response.data.error_id != 'ERR_FAAB_INSUFFICIENT'"

      - name: business_safety_vs_business_constraint_on_lineup_patch
        grounds:
          - validations[priority=8]
          - validations[priority=16]
          - errors.ERR_LINEUP_LOCKED
          - errors.ERR_POSITION_CONSTRAINT
        distinguishing_aspect: |
          When PATCHing a RosterSlot after the week is LOCKED AND with an invalid position assignment
          (e.g., move a QB into the RB1 slot): the safety check ERR_LINEUP_LOCKED (priority 8) returns first,
          NOT business_constraint ERR_POSITION_CONSTRAINT (priority 16). Pair:
          {business_safety, business_constraint} — different category pair from instance 1.
        test_recipe:
          setup:
            - "League L in REGULAR_SEASON; clock advanced to LOCK week 1; T1 has slot RB1 occupied by player P_rb"
            - "Player P_qb is on T1's bench (Player.position=QB)"
          trigger:
            - "PATCH /teams/{T1}/roster-slots/{slot_for_P_qb} with slot_type=STARTER, position_label=RB1, version=current"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_LINEUP_LOCKED'"
            - "response.data.error_id != 'ERR_POSITION_CONSTRAINT'"

  # ----------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ----------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: veto_quorum_exact_threshold_at_50pct
        grounds:
          - calculations.trade_veto_threshold
          - entities.League.fields.veto_quorum_pct
          - state_machines.TradeProposal.ACCEPTED_PENDING_REVIEW_to_VETOED
          - endpoints./trades/{trade_id}/votes
        distinguishing_aspect: |
          Boundary check on numeric percent threshold: veto_quorum_pct=50 with eligible_voters=8 means 4 vetoes
          → (4*100)//8 = 50 >= 50 → VETOED; 3 vetoes → 37 < 50 → still ACCEPTED_PENDING_REVIEW.
          The boundary metric is veto_pct on POST /trades/{id}/votes.
        test_recipe:
          setup:
            - "League L with team_count=10, veto_quorum_pct=50; 10 teams created; T1 proposes trade to T2 and T2 accepts (ACCEPTED_PENDING_REVIEW). Eligible voters = 10-2 = 8."
          trigger:
            - "POST /trades/{trade_id}/votes vote=VETO from T3, T4, T5 (3 vetoes total)"
            - "Assert intermediate state: TradeProposal.status == ACCEPTED_PENDING_REVIEW"
            - "POST /trades/{trade_id}/votes vote=VETO from T6 (4th vote)"
          assert:
            - "After 3 vetoes: TradeProposal.status == ACCEPTED_PENDING_REVIEW  # 37 < 50, not yet"
            - "After 4 vetoes: TradeProposal.status == VETOED                   # 50 >= 50, crosses boundary"

      - name: empty_candidate_set_in_injury_replacement
        grounds:
          - calculations.injury_replacement
          - state_machines.MatchupWeek.SCHEDULED_to_LOCKED
          - entities.RosterSlot.fields.slot_type
          - endpoints./leagues/{league_id}/_clock/advance
        distinguishing_aspect: |
          Boundary check on an EMPTY collection (different metric/endpoint): when the bench has no
          eligible same-position non-OUT replacement, the original starter stays STARTER and contributes 0.
          Empty-set boundary on injury_replacement reached via POST /leagues/{id}/_clock/advance
          (different endpoint than the votes endpoint above).
        test_recipe:
          setup:
            - "League L in REGULAR_SEASON; T1's only RB is P1 (position=RB, status_tag=OUT) at RB1; bench has no RB; bench has only QB/WR/TE/K/DST"
          trigger:
            - "POST /leagues/{L}/_clock/advance crossing week-1 lock"
          assert:
            - "MatchupWeek(week=1).status == LOCKED"
            - "RosterSlot(P1).slot_type == STARTER  # no replacement available, starter remains"
            - "RosterSlot(P1).position_label == 'RB1'"
            - "No swap occurred (no other RosterSlot.slot_type changed)"

  # ----------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ----------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: trade_accept_requires_league_in_regular_season_or_playoffs
        grounds:
          - state_machines.TradeProposal.OFFERED_to_ACCEPTED_PENDING_REVIEW
          - state_machines.League
          - entities.League.fields.status
          - validations[priority=7]
        distinguishing_aspect: |
          TradeProposal.OFFERED→ACCEPTED_PENDING_REVIEW is only valid when League.status ∈
          {REGULAR_SEASON, PLAYOFFS}. In any other League state (DRAFT_PENDING, DRAFTING, COMPLETED,
          ARCHIVED), the transition is rejected. Pair: TradeProposal × League.
        test_recipe:
          setup:
            - "League L in DRAFT_PENDING with 4 teams seeded; insert an OFFERED TradeProposal directly into DB (or assert that POST /trades is rejected first if the create-endpoint also enforces this; either way the accept transition is gated)"
            - "Run start-draft so League goes to DRAFTING (still not REGULAR_SEASON)"
          trigger:
            - "POST /trades/{trade_id}/accept while League.status == DRAFTING"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "TradeProposal.status remains OFFERED"

      - name: roster_slot_lineup_change_requires_matchup_week_unlocked
        grounds:
          - validations[priority=8]
          - state_machines.MatchupWeek
          - entities.MatchupWeek.fields.status
          - entities.RosterSlot.fields.slot_type
        distinguishing_aspect: |
          RosterSlot lineup mutations require that the active MatchupWeek (current_week) is NOT yet LOCKED.
          Pair: RosterSlot × MatchupWeek — a different entity pair from instance 1 (TradeProposal × League).
        test_recipe:
          setup:
            - "League L in REGULAR_SEASON, current_week=1; T1 has bench player P_bench at slot_type=BENCH and starter P_start at slot_type=STARTER position_label=RB1"
            - "Advance clock to lock time of week 1; MatchupWeek(week=1).status becomes LOCKED"
          trigger:
            - "PATCH /teams/{T1}/roster-slots/{slot_for_P_bench} with slot_type=STARTER, position_label=RB1, version=current"
          assert:
            - "HTTP 409"
            - "response.data.error_id == 'ERR_LINEUP_LOCKED'"
            - "RosterSlot(P_bench).slot_type remains BENCH"

  # ----------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ----------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: waiver_settle_window_overlap_on_player
        grounds:
          - entities.WaiverClaim.fields.settle_ts
          - calculations.faab_waiver_resolution
          - concurrency_rules
        distinguishing_aspect: |
          Multiple PENDING WaiverClaim rows targeting the same add_player_id occupy the SAME settle-ts
          window. Interval semantics: claims with settle_ts <= now_ts at sweep time form a SINGLE
          competition pool (closed-on-both-ends inclusion at the sweep instant); the resource (Player)
          is awarded to exactly one of the overlapping claims. Resource: Player; interval semantics:
          closed-inclusive at sweep instant.
        test_recipe:
          setup:
            - "League L in REGULAR_SEASON; player P_target dropped (in waivers); teams T1, T2 each submit a WaiverClaim for P_target with the SAME settle_ts T+1h, T1 bid=$10 priority_seed=2, T2 bid=$10 priority_seed=1"
          trigger:
            - "POST /leagues/{L}/_clock/advance to T+1h (now_ts == settle_ts)"
            - "POST /leagues/{L}/_waivers/process"
          assert:
            - "Exactly one of {WaiverClaim(T1), WaiverClaim(T2)} has status=AWARDED  # resource Player held by only one claim"
            - "WaiverClaim(T2).status == AWARDED   # priority_seed asc tiebreak with closed-inclusive overlap"
            - "WaiverClaim(T1).status == LOST"
            - "RosterSlot count for player P_target across the league == 1"

      - name: matchup_week_lock_window_aggregate_capacity
        grounds:
          - state_machines.MatchupWeek.SCHEDULED_to_LOCKED
          - entities.MatchupWeek.fields.status
          - entities.RosterSlot.fields.locked_until_ts
          - concurrency_rules
        distinguishing_aspect: |
          Different interval semantics: lock window on a MatchupWeek is a half-open forward interval
          [lock_ts, end_of_week_ts) — once now_ts >= lock_ts the resource (every starter RosterSlot in the
          week) is exclusively held for scoring; any RosterSlot mutation collides with the lock interval.
          The resource is the starter pool (aggregate capacity = starter_count slots); intervals are
          forward-open (no symmetric inclusion) — DIFFERENT semantics from the waiver instant-pool above.
        test_recipe:
          setup:
            - "League L in REGULAR_SEASON, current_week=1; T1 has starter P_start at RB1 and bench P_bench (also RB)"
            - "now_ts < lock_ts: PATCH /teams/{T1}/roster-slots/{slot_for_P_bench} succeeds, making P_bench STARTER"
            - "Advance now_ts to exactly lock_ts; MatchupWeek transitions to LOCKED"
          trigger:
            - "PATCH /teams/{T1}/roster-slots/{slot_for_P_bench} again (try to swap back) while now_ts == lock_ts"
          assert:
            - "HTTP 409, error_id=ERR_LINEUP_LOCKED  # interval is half-open closed-at-start → boundary instant collides"
            - "Earlier pre-lock PATCH succeeded  # closed-at-start, open-at-end interval"

  # ----------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ----------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: faab_total_conserved_under_trade_execution
        grounds:
          - state_machines.TradeProposal.ACCEPTED_PENDING_REVIEW_to_EXECUTED
          - entities.Team.fields.faab_balance_dollars
          - entities.TradeProposal.fields.send_faab_dollars
          - entities.TradeProposal.fields.receive_faab_dollars
        distinguishing_aspect: |
          Invariant on conserved quantity Σ Team.faab_balance_dollars across all teams in a league:
          before trade execution the sum equals X; after execution (which moves FAAB from one team to
          another) the sum still equals X. The compensating-paired actions are the proposer-side debit
          and counterparty-side credit; they must net to zero on Σ FAAB.
        test_recipe:
          setup:
            - "League L in REGULAR_SEASON, 4 teams each with faab_balance_dollars=100, sum=400"
            - "T1 proposes trade to T2 sending P_a + $25 FAAB; T2 accepts (send_faab_dollars=25, receive_faab_dollars=0)"
          trigger:
            - "POST /leagues/{L}/_clock/advance crossing review_deadline_ts (no vetoes)"
          assert:
            - "TradeProposal.status == EXECUTED"
            - "Team(T1).faab_balance_dollars == 75   # 100-25"
            - "Team(T2).faab_balance_dollars == 125  # 100+25"
            - "Σ faab_balance_dollars across L's 4 teams == 400  # conserved; pinned formula: sum unchanged"

      - name: roster_player_count_conserved_under_trade_execution
        grounds:
          - state_machines.TradeProposal.ACCEPTED_PENDING_REVIEW_to_EXECUTED
          - entities.RosterSlot
          - entities.TradeProposal.fields.send_player_ids
          - entities.TradeProposal.fields.receive_player_ids
        distinguishing_aspect: |
          Invariant on a DIFFERENT conserved quantity: total number of RosterSlot rows per team and
          league-wide rostered Player count is preserved across a trade. The forward action (transfer
          P_a) and its compensating action (transfer P_b) keep Σ RosterSlot rows constant per team and
          league. Different conserved quantity from FAAB above (player count vs dollars).
        test_recipe:
          setup:
            - "League L in REGULAR_SEASON; T1 has 12 RosterSlot rows including P_a; T2 has 12 RosterSlot rows including P_b. League total RosterSlot rows = 48 (4 teams × 12)"
            - "T1 proposes 1-for-1 trade P_a for P_b; T2 accepts"
          trigger:
            - "POST /leagues/{L}/_clock/advance crossing review_deadline_ts (no vetoes)"
          assert:
            - "Team(T1) RosterSlot count == 12  # unchanged"
            - "Team(T2) RosterSlot count == 12  # unchanged"
            - "League total RosterSlot rows == 48  # conserved; pinned formula: sum unchanged"
            - "RosterSlot(P_a).team_id == T2"
            - "RosterSlot(P_b).team_id == T1"
