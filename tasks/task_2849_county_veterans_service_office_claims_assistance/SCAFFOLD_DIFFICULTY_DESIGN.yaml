              as: SystemAdmin
              captures: { cw_before: $.data.caseload_weight, poa_before: $.data.active_poa_count }
          trigger:
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "REVOKE", reason: "Sanctioned by the state accreditation board." }
              as: SystemAdmin
          assert:
            - "${cw_before} == 4"
            - "${poa_before} == 1"
            - "Representative.${rep_a}.accreditation_status == REVOKED"
            - "Representative.${rep_a}.revocation_reason == Sanctioned by the state accreditation board."
            - "Representative.${rep_a}.active_poa_count == 0"
            - "Representative.${rep_a}.caseload_weight == 0"
            - "Veteran.${vet}.assigned_representative_id == null"
            - "PowerOfAttorney.${poa}.status == REVOKED"
            - "PowerOfAttorney.${poa}.revoked_reason == REPRESENTATIVE_ACCREDITATION_REVOKED"
            - "Claim.${claim_x}.status == DRAFT"
            - "Claim.${claim_x}.poa_id == null"
            - "Claim.${claim_x}.peer_reviewed_by_representative_id == null"
            - "ExamAppointment.${appt}.status == CANCELLED"
            - "ExamAppointment.${appt}.cancellation_reason == REPRESENTATION_CASCADE"
            - "ExamSite.${site}.booked_slot_count == 0"

