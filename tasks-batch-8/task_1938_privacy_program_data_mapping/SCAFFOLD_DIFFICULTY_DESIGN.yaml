  - rule_id: boundary_precision_check
    instances:
      - name: applicability_count_at_threshold
        grounds:
          - calculations.state_law_applicability
          - entities.ApplicabilityEvaluation.fields.applies
        distinguishing_aspect: |
          Metric: resident consumer COUNT. count == threshold applies (>=, inclusive);
          count == threshold - 1 does not. Reached via POST /privacy/applicability-evaluations/run.
        test_recipe:
          setup:
            - "OR rule: resident_records_threshold 2, revenue path disabled (threshold 100.0)"
            - "WA rule: resident_records_threshold 3, revenue path disabled"
            - "2 OR consumers + 2 WA consumers"
          setup_api_calls:
            - call: "POST /privacy/state-law-rules"
              payload: { state_code: "OR", law_name: "OCPA", resident_records_threshold: 2, revenue_share_threshold_pct: 100.0, request_deadline_days: 45, extension_days: 30 }
              as: PrivacyAdmin
              captures: { rule_or: $.data.id }
            - call: "POST /privacy/state-law-rules"
              payload: { state_code: "WA", law_name: "MyHealth", resident_records_threshold: 3, revenue_share_threshold_pct: 100.0, request_deadline_days: 45, extension_days: 30 }
              as: PrivacyAdmin
              captures: { rule_wa: $.data.id }
            - call: "POST /privacy/consumers"
              payload: { email: "or1@x.com", full_name: "OR One", state_code: "OR" }
              as: PrivacyAdmin
            - call: "POST /privacy/consumers"
              payload: { email: "or2@x.com", full_name: "OR Two", state_code: "OR" }
              as: PrivacyAdmin
            - call: "POST /privacy/consumers"
              payload: { email: "wa1@x.com", full_name: "WA One", state_code: "WA" }
              as: PrivacyAdmin
            - call: "POST /privacy/consumers"
              payload: { email: "wa2@x.com", full_name: "WA Two", state_code: "WA" }
              as: PrivacyAdmin
          trigger:
            - call: "POST /privacy/applicability-evaluations/run"
              payload: { state_revenues: { OR: 0, WA: 0 }, total_revenue_cents: 1000 }
              as: PrivacyAdmin
              captures: { run_count: $.data.evaluation_count }
            - call: "GET /privacy/applicability-evaluations?state_law_rule_id=${rule_or}"
              payload: { state_law_rule_id: "${rule_or}" }
              as: PrivacyAdmin
              captures: { or_applies: "$.data[0].applies", or_margin: "$.data[0].margin_to_threshold" }
            - call: "GET /privacy/applicability-evaluations?state_law_rule_id=${rule_wa}"
              payload: { state_law_rule_id: "${rule_wa}" }
              as: PrivacyAdmin
              captures: { wa_applies: "$.data[0].applies", wa_margin: "$.data[0].margin_to_threshold" }
          assert:
            - "OR: applies == true at count 2 == threshold 2 (inclusive >=); margin_to_threshold == 0"
            - "WA: applies == false at count 2 == threshold 3 - 1; margin_to_threshold == -1"
            - "run evaluation_count == 2 (one row per rule)"

      - name: risk_score_at_pia_threshold
        grounds:
          - calculations.activity_risk_score
          - entities.ProcessingActivity.fields.pia_required
        distinguishing_aspect: |
          Metric: risk SCORE (vs count in the sibling instance), reached via
          POST /privacy/processing-activities. Screening 500 exactly triggers
          pia_required (>= 500); 425 does not.
        test_recipe:
          setup:
            - "Elements: ssn IDENTIFIER/RESTRICTED (100*2.0=400), nickname BASIC_CONTACT/PUBLIC (50*0.5=25)"
            - "Vendor STANDARD ([FINANCIAL]) -> exposure 75"
            - "A-x: 400 + 25*1 + 75 = 500 exactly; A-y (no vendor): 400 + 25 = 425"
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "ssn", category: IDENTIFIER, classification: RESTRICTED }
              as: DataSteward
              captures: { e_ssn: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "nickname", category: BASIC_CONTACT, classification: PUBLIC }
              as: DataSteward
              captures: { e_nick: $.data.id }
            - call: "POST /privacy/vendors"
