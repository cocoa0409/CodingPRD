  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_campaign_version_on_pledge_create_returns_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pledge-create-stale-campaign]
          - errors[ERR_STALE_CAMPAIGN_VERSION]
          - validations[priority=13]
        distinguishing_aspect: |
          A pledge create carrying an expected_campaign_version one behind the current
          campaign.version is rejected ERR_STALE_CAMPAIGN_VERSION (412). A first pledge create
          advances campaign.version; a second create still carrying the launch-era version is stale.
        test_recipe:
          setup:
            - "LIVE campaign, one successful pledge already created (campaign.version advanced past the launch value)."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b1@x.com", display_name: "B1" }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b2@x.com", display_name: "B2" }
              as: PlatformAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b1_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b1_id}"
              captures: { p1_id: $.data.id, camp_v2: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/pledges"
