              as: TelemetryAgent
              captures: { det_id: $.data.id }
          trigger:
            - call: "POST /telemetry-detections/${det_id}/triage"
              payload: { disposition: "BLOCK", note: "No authorization on file." }
              as: PrivacyOfficeAdmin
            - call: "POST /telemetry-detections/${det_id}/triage"
              payload: { disposition: "ESCALATE", note: "Second thoughts." }
              as: PrivacyAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "first trigger call: status == 200 and status field == BLOCKED"
            - "TelemetryDetection.${det_id}.classification == UNAUTHORIZED"
            - "TelemetryDetection.${det_id}.matched_catalog_entry_id is null"
            - "TelemetryDetection.${det_id}.exposure_score == 63.00"
            - "second trigger call: status == 409 and ${err} == ERR_DETECTION_ALREADY_TRIAGED"
            - "TelemetryDetection.${det_id}.status == BLOCKED"
            - "TelemetryDetection.${det_id}.linked_incident_id is null (the refused ESCALATE minted no incident)"
            - "GET /vendor-incidents filtered by vendor_id ${v_id} returns total_count 0"

