              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
