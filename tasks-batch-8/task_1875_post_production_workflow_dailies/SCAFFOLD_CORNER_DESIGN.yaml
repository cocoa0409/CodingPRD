            - call: "POST /post-production/projects"
              payload: { title: "P5", client_code: "CL905", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
          trigger:
            - call: "GET /post-production/projects?status=SETUP&limit=2&offset=1"
              payload: {}
              as: PostSupervisor
          assert:
            - "len(response.data) == 2"
            - "response pagination: limit=2, offset=1, total_count=5, has_more=true"

      - name: rate_threshold_qc_max_attempts
        claim_type: rate_threshold_triggers
        grounds: [calculations.qc_attempt_escalation]
        distinguishing_aspect: "Behavior changes at exactly 3 QC attempts: before 3, render-from-QC_FAILED allowed; at 3, reject is the only forward path."
        excluded_because:
          difficulty_instance: qc_attempt_threshold_boundary
          rationale: "Already exercised by calculations section instance qc_attempt_threshold_boundary."

