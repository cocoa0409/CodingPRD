            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /festivals"
              payload: { code: "SUNDANCE", name: "Sundance", start_date: "2027-01-21T00:00:00Z", end_date: "2027-01-31T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-01-22T20:00:00Z", screening_ends_at: "2027-01-22T22:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { slot_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
            - call: "GET /films/${film_id}"
