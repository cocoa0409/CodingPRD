              as: CarrierRep
              as_user_id: "${carrier17_id}"
              captures: { app17_id: $.data.id }
            - call: "POST /authority-applications/${app17_id}/submit"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier17_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /authority-applications/${app17_id}/vetting-review"
              payload: { disposition: "PUBLISH", findings: "no adverse vetting findings" }
              as: VettingAnalyst
              as_user_id: "staff-va-001"
            - call: "GET /operating-authorities"
              payload: { application_id: "${app17_id}" }
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { auth17_id: "$.data[0].id" }
            - call: "POST /operating-authorities/${auth17_id}/process-agent-designations"
              payload: { process_agent_id: "${agent17_id}", state_codes: ["TX", "OK", "NM"], effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-08-31T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier17_id}"
              captures: { desig17_tx_id: "$.data[0].id" }
          trigger:
            - call: "POST /operating-authorities/${auth17_id}/process-agent-designations"
              payload: { process_agent_id: "${agent17_id}", state_codes: ["TX"], effective_from: "2026-09-01T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier17_id}"
              captures: { buffer_error: $.data.error_id }
            - call: "POST /operating-authorities/${auth17_id}/process-agent-designations"
              payload: { process_agent_id: "${agent17_id}", state_codes: ["TX"], effective_from: "2026-09-02T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier17_id}"
              captures: { desig17_tx2_id: "$.data[0].id" }
          assert:
            - "${buffer_error} == 'ERR_DESIGNATION_INTERVAL_CONFLICT' with HTTP 409 — 2026-09-01 sits exactly on the incumbent's buffered upper edge (2026-08-31 + 1 day)"
            - "immediately after the first trigger call, GET /process-agent-designations?authority_id=${auth17_id}&state_code=TX returns total_count == 1"
            - "ProcessAgentDesignation.${desig17_tx_id}.status == ACTIVE and effective_to == '2026-08-31T00:00:00.000Z' — the rejected request changed nothing"
            - "ProcessAgentDesignation.${desig17_tx2_id}.effective_from == '2026-09-02T00:00:00.000Z' and status == ACTIVE and effective_to is null"
            - "after the second trigger call, GET /process-agent-designations?authority_id=${auth17_id}&state_code=TX returns total_count == 2"
            - "OperatingAuthority.${auth17_id}.designated_state_count == 3 and designation_coverage_complete == true at the 2026-08-05 clock position"

  - rule_id: compensating_invariant
    instances:
      - name: deny_reverses_the_filing_fee_debit_while_return_leaves_it_standing
        grounds:
          - calculations.filing_fee_conservation_invariant
          - calculations.filing_fee_assessment
          - state_machines.AuthorityApplication.SUBMITTED_to_DENIED
          - state_machines.AuthorityApplication.SUBMITTED_to_RETURNED_FOR_CORRECTION
          - entities.FeeLedgerEntry.fields.entry_type
          - entities.Carrier.fields.fee_balance_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY. Two dispositions that look alike from the
          application's side diverge completely on the ledger: DENY is the
          compensating action and must append a reversal credit that returns
          fee_balance_cents to its exact pre-submit value, while RETURN is NOT a
          compensating action and must leave the debit standing. The append-only
          ledger must reconcile to the carrier's three running totals after both.
        test_recipe:
          setup:
            - "one carrier with a zero fee balance and no ledger entries"
            - "two DRAFT NEW FOR_HIRE_PROPERTY applications for TX/OK/NM without hazmat, each assessing 64791 cents"
            - "logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Nueces Bay Cartage LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { carrier18_id: $.data.id }
            - call: "GET /carriers/${carrier18_id}"
              payload: {}
              as: RegistryAdmin
              captures: { carrier18_balance_before: $.data.fee_balance_cents }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${carrier18_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX", "OK", "NM"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${carrier18_id}"
              captures: { app18a_id: $.data.id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${carrier18_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX", "OK", "NM"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${carrier18_id}"
              captures: { app18b_id: $.data.id }
          trigger:
            - call: "POST /authority-applications/${app18a_id}/submit"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier18_id}"
              captures: { app18a_fee: $.data.filing_fee_cents }
            - call: "GET /carriers/${carrier18_id}"
              payload: {}
              as: RegistryAdmin
              captures: { carrier18_balance_after_debit: $.data.fee_balance_cents }
            - call: "POST /authority-applications/${app18a_id}/vetting-review"
              payload: { disposition: "DENY", findings: "undisclosed common ownership with a previously revoked carrier", denied_reason: "vetting failure — affiliation with a revoked authority" }
              as: VettingAnalyst
              as_user_id: "staff-va-001"
            - call: "GET /carriers/${carrier18_id}"
              payload: {}
              as: RegistryAdmin
              captures: { carrier18_balance_after_deny: $.data.fee_balance_cents }
            - call: "POST /authority-applications/${app18b_id}/submit"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier18_id}"
            - call: "POST /authority-applications/${app18b_id}/vetting-review"
              payload: { disposition: "RETURN", findings: "process-agent block left incomplete on the application" }
              as: VettingAnalyst
              as_user_id: "staff-va-001"
            - call: "GET /carriers/${carrier18_id}"
              payload: {}
              as: RegistryAdmin
              captures: { carrier18_balance_after_return: $.data.fee_balance_cents }
          assert:
            - "${app18a_fee} == 64791 — NEW + FOR_HIRE_PROPERTY + 3 states + no hazmat, per-line HALF_UP then summed"
            - "${carrier18_balance_before} == 0 and ${carrier18_balance_after_debit} == 64791"
            - "${carrier18_balance_after_deny} == 0 — the round trip returns the balance to its exact pre-submit value, not merely to a small residue"
            - "after the DENY, Carrier.${carrier18_id}.fees_assessed_total_cents == 64791 and fees_reversed_total_cents == 64791 and fees_paid_total_cents == 0"
            - "AuthorityApplication.${app18a_id}.status == DENIED and denied_reason is the submitted string"
            - "GET /operating-authorities?application_id=${app18a_id} returns total_count == 0 — a denied application mints no authority"
            - "GET /carriers/${carrier18_id}/fee-ledger-entries returns total_count == 2 in created_at ASC order: entry_type FILING_FEE_DEBIT with amount_cents == 64791, then entry_type FILING_FEE_REVERSAL_CREDIT with amount_cents == -64791, both with docket_ref == ${app18a_id}"
            - "${carrier18_balance_after_return} == 64791 — RETURN is not a compensating action, so the second application's debit stands"
            - "after the RETURN, Carrier.${carrier18_id}.fees_assessed_total_cents == 129582 and fees_reversed_total_cents == 64791, and GET /carriers/${carrier18_id}/fee-ledger-entries returns total_count == 3 with no FILING_FEE_REVERSAL_CREDIT carrying docket_ref == ${app18b_id}"
            - "sum of amount_cents over all three ledger entries == 64791 == Carrier.${carrier18_id}.fee_balance_cents"
            - "AuthorityApplication.${app18b_id}.status == RETURNED_FOR_CORRECTION and filing_fee_cents == 64791"

      - name: suspension_and_cure_conserve_the_contract_and_shipment_population
        grounds:
          - calculations.contract_population_conservation_invariant
          - calculations.contract_disruption_liability
          - state_machines.OperatingAuthority.SUSPENDED_to_ACTIVE
          - state_machines.RevocationProceeding.NOTICE_ISSUED_to_CURED
          - entities.Shipment.fields.pre_embargo_status
          - entities.Shipment.fields.embargo_days_accrued
        distinguishing_aspect: |
          The conserved quantity is ENTITY POPULATION CARDINALITY, not money: the
          SUSPEND / RESTORE round trip must return active_contract_count to its
          pre-suspension value with suspended_contract_count back at 0, leave zero
          EMBARGOED shipments, and put every shipment back into exactly the status
          recorded in pre_embargo_status. The round trip is deliberately NOT
          value-neutral — disruption_liability_cents is intentionally left non-zero
          and re-derived under the other variant — so a solution that "restores"
          by wholesale rollback fails.
        test_recipe:
          setup:
            - "one ACTIVE FOR_HIRE_PROPERTY authority for TX/OK/NM with complete designations, an ACTIVE 75000000-cent BIPD filing and a settled fee balance"
            - "two ACTIVE customer contracts, each 90000000 cents/month over 2026-09-01 to 2026-12-31; contract A carries one IN_TRANSIT shipment, contract B carries none"
            - "logical clock advanced to 2026-09-02T00:00:00Z"
