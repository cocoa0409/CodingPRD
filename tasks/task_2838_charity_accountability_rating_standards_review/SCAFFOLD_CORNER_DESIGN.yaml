      - name: score_only_from_an_evaluated_profile_guarded_transition
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RatingCycle.DATA_COLLECTION_to_SCORED
          - errors.ERR_GOVERNANCE_NOT_EVALUATED
        distinguishing_aspect: |
          The cross-entity guard on DATA_COLLECTION -> SCORED (the cycle may
          only advance while a GovernanceProfile of that cycle sits in
          EVALUATED) is exercised in the difficulty design, which pairs it with
          a PENDING profile that carries complete disclosures - so the guard
          cannot be satisfied by the presence of data alone.
        excluded_because:
          difficulty_instance: score_requires_evaluated_governance_profile
          rationale: |
            The difficulty instance already drives the guarded-transition row of
            the state-machine-shape table end to end: it creates the profile,
            omits the evaluate call, asserts ERR_GOVERNANCE_NOT_EVALUATED, then
            evaluates and re-scores to prove the guard was the only thing
            blocking. A corner instance would be a strict subset of it.
      - name: waiver_and_revocation_reconcile_the_standards_ledger
        claim_type: Side Effect Execution
        grounds:
          - state_machines.StandardEvaluation.NOT_MET_to_WAIVED
          - state_machines.StandardEvaluation.WAIVED_to_NOT_MET
          - calculations.dimension_raw_points
        distinguishing_aspect: |
          Covers both the Ledger sync row (a child result change must update the
          ancestor RatingCycle's failed_standard_count and rewrite the
          accountability figures) and the Compensation row (revoking the waiver
          must return every one of those derived fields to its exact pre-waiver
          value with no drift).
        excluded_because:
          difficulty_instance: standards_partition_conserved_across_waive_and_revoke
          rationale: |
            The difficulty instance walks waive then revoke-waiver over the same
            row and asserts the full round trip: the four-way partition of the
            eight standards stays summed to 8, the cycle's failed_standard_count
            goes 1 -> 0 -> 1, and the composite goes 83.13 -> 86.71 -> 83.13
            including the reappearance of the 1.50 band-B penalty. Both the
            ledger-sync and the compensation claims are settled there.
      - name: substantiated_then_reversed_complaint_leaves_no_penalty_drift
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Complaint.INVESTIGATING_to_SUBSTANTIATED
          - state_machines.Complaint.SUBSTANTIATED_to_INVESTIGATING
          - calculations.dimension_raw_points
        distinguishing_aspect: |
          Covers the Cascade down and Conditional cascade rows for the complaint
          penalty: a substantiated finding reaches across entities into the
          selected cycle's ACCOUNTABILITY row and reverts the cycle's workflow
          state, and reverse-finding must undo every hop.
        excluded_because:
          difficulty_instance: accountability_penalty_ledger_conserved_across_substantiate_and_reverse
          rationale: |
            The difficulty instance already asserts the whole round trip -
            penalty_points_applied 0 -> 5 -> 0, the ACCOUNTABILITY row COMPUTED
            -> STALE -> COMPUTED with raw_points recomputed from source rather
            than incremented back, the organization's
            substantiated_complaint_count restored, and the cycle's composite
            returning to its pre-substantiation value. The four-hop forward
            cascade itself is covered by substantiated_complaint_four_hop_accountability_cascade.
  - section: calculations
    instances:
      - name: winning_filing_selector_prefers_the_audited_source_over_a_later_form_990
        claim_type: Input Set Filtering
        grounds:
          - calculations.winning_filing_selector
          - calculations.program_expense_ratio
          - calculations.months_of_reserve
          - entities.FilingRecord.fields.status
        distinguishing_aspect: |
          Three decoys at once, each of which a plausible implementation would
          pick: a Form 990 for the same year that was filed LATER and is
          perfectly VALIDATED (source precedence beats recency), an
          ORG_SUBMISSION that was REJECTED (only VALIDATED rows are candidates,
          no matter how authoritative the paperwork claims to be), and the
          earlier audited statement itself, which stays the winner. If the
          selector ranked by created_at first, the ratio would fall from 0.7500
          to 0.5000 and months_of_reserve from 7.20 to 1.20, costing 15 raw
          points; the composite would move far enough to change the grade.
        test_recipe:
          setup:
            - "Harbor Relief has VALIDATED audited statements for FY2025, FY2024 and FY2023, then files a later FY2025 Form 990 that is also validated and a FY2025 org submission that is rejected"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-31T00:00:00Z" }
              as: MethodologyAdmin
