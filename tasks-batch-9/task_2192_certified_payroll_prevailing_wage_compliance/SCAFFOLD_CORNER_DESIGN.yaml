          rationale: "That §1.8 instance walks the 500000-cent boundary at exactly-equal and one-cent-above."

  - section: validations
    instances:
      - name: path_existence_precedes_body_shape_on_an_unknown_finding
        claim_type: priority_ordering
        grounds:
          - validations[priority 3] ERR_PROJECT_NOT_FOUND | ERR_FINDING_NOT_FOUND
          - validations[priority 7] ERR_VALIDATION
        distinguishing_aspect: "The withdraw call is doubly invalid: the finding id does not exist (priority 3) and the body omits the required withdrawal_reason (priority 7). Priority 3 wins, so the caller sees 404 ERR_FINDING_NOT_FOUND, not 422 ERR_VALIDATION -- the naive implementation validates the body first because that needs no database read."
        test_recipe:
          setup:
            - "An empty system; no finding with the cited id has ever existed."
          setup_api_calls: []
          trigger:
            - call: "POST /findings/00000000-0000-4000-8000-000000000000/withdraw"
              payload: {}
              as: LaborStandardsAuditor
              as_user_id: "auditor-cruz"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_FINDING_NOT_FOUND"

