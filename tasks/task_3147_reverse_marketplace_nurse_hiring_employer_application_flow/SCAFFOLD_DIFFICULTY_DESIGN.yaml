  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_issue_gated_by_completed_interview
        grounds:
          - state_machines.Application.INTERVIEWING_to_OFFER_EXTENDED
          - entities.Interview.fields.status
        distinguishing_aspect: |
          Entity pair Offer<-Interview: issuing an offer requires the
          application to own at least one Interview in COMPLETED — with only a
          SCHEDULED interview the issuance is rejected ERR_INVALID_STATE even
          though the application itself is in INTERVIEWING.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T10:30:00Z. Application in INTERVIEWING with one interview SCHEDULED for 2026-09-02 10:00-11:00 (still inside its window, not yet completable)."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - *app_icu
            - *review_nora
            - *iv_nora
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T10:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/applications/${app_id}/offers"
              payload: { offered_hourly_rate_cents: 8500, start_date: "2026-09-15", expected_requisition_version: "${req_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_offer: $.data.error_id }
          assert:
            - "err_offer == ERR_INVALID_STATE — no COMPLETED interview exists for application ${app_id}"
            - "Interview ${iv_id}.status remains SCHEDULED and Application.${app_id}.status remains INTERVIEWING"

      - name: placement_termination_gated_by_clock_vs_guarantee_end
        grounds:
          - state_machines.Placement.GUARANTEE_ACTIVE_to_COMPLETED
          - state_machines.Placement.GUARANTEE_ACTIVE_to_TERMINATED_IN_GUARANTEE
          - errors.ERR_PLACEMENT_GUARANTEE_EXPIRED
        distinguishing_aspect: |
          Entity pair Placement<-logical clock (different pair from
          Offer<-Interview): once the clock passes guarantee_ends_on the
          placement has auto-transitioned to COMPLETED and the employer's
          terminate action is rejected ERR_PLACEMENT_GUARANTEE_EXPIRED — the
          valid transition set depends on the clock-derived placement state,
          not on anything the employer controls.
        test_recipe:
          setup:
            - "Placement GUARANTEE_ACTIVE with start_date 2026-09-15, guarantee 60 days (guarantee_ends_on 2026-11-14). Clock advanced to 2026-11-15."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - *app_icu
            - *review_nora
            - *iv_nora
            - *clock_iv_done
            - *iv_complete
            - *scr_open
            - *scr_cred
            - *scr_bg
            - *doc_sign
            - *doc_ok
            - *offer_issue
            - *offer_accept
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/placements/${placement_id}/terminate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_term: $.data.error_id }
          assert:
            - "Placement.${placement_id}.status == COMPLETED (clock past 2026-11-14 guarantee end fired the auto-transition)"
            - "err_term == ERR_PLACEMENT_GUARANTEE_EXPIRED"
            - "the linked Invoice.status == SETTLED (guarantee completion settled the provisional fee)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: nurse_interview_buffered_half_open_overlap
        grounds:
          - calculations.interview_overlap_rule
          - validations[priority=9]
          - errors.ERR_INTERVIEW_CONFLICT
        distinguishing_aspect: |
          Buffered half-open semantics on the Interview resource: an existing
          interview 10:00-11:00 blocks a new one starting at 11:15 (inside the
          +30min buffer), while a start at exactly 11:30 (gap == buffer, 0
          after expansion) is ACCEPTED — adjacency at exactly buffer distance
          is legal, one minute inside is not.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One nurse, two requisitions from two different employers, applications A1 and A2 both UNDER_REVIEW. A1 has a SCHEDULED interview 2026-09-02T10:00-11:00Z."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - *app_icu
            - *review_nora
            - *iv_nora
            - call: "POST /marketplace/employers"
              payload: { legal_name: "Coastal General", facility_state: "CA", fee_model: "SUBSCRIPTION", subscription_tier: "PRO", sla_response_hours: 48, guarantee_days: 90, placement_fee_bps: 1500 }
              as: PlatformAdmin
              captures: { emp2_id: $.data.id }
            - call: "POST /marketplace/requisitions"
              payload: { employer_id: "${emp2_id}", specialty: "ICU", unit_name: "ICU-North", required_certs: [], facility_state: "CA", distance_from_facility_miles: 30, shift: "DAY", offered_hourly_rate_cents: 8200, openings_total: 1 }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { req2b_id: $.data.id }
            - call: "GET /marketplace/nurses/${nurse_id}"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { nurse_v_now: $.data.version }
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req2b_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 8300, proposed_shift: "DAY", expected_nurse_version: "${nurse_v_now}" }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { app2b_id: $.data.id }
            - call: "POST /marketplace/applications/${app2b_id}/review"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /marketplace/applications/${app2b_id}/interviews"
              payload: { starts_at: "2026-09-02T11:15:00Z", ends_at: "2026-09-02T12:15:00Z" }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /marketplace/applications/${app2b_id}/interviews"
              payload: { starts_at: "2026-09-02T11:30:00Z", ends_at: "2026-09-02T12:30:00Z" }
              as: Employer
              as_user_id: "${emp2_id}"
          assert:
            - "11:15 start rejected: err_overlap == ERR_INTERVIEW_CONFLICT (11:15 < 11:00 + 30min buffer)"
            - "11:30 start accepted (201): gap after buffer expansion is exactly 0, and the rule requires gap >= 0"
            - "Interview resource semantics here are buffered half-open — distinct from the closed day-bucket rule in unit_day_capacity_zero_remaining_rejects"

      - name: unit_day_bucket_closed_boundary_vs_nurse_buffer
        grounds:
          - calculations.unit_interview_capacity_rule
          - calculations.interview_overlap_rule
        distinguishing_aspect: |
          Second overlap rule with DIFFERENT interval semantics: the unit
          day-bucket uses closed-closed calendar-day boundaries with NO buffer
          — an interview ending 2026-09-10T23:59:00Z counts toward the 10th
          and an interview starting 2026-09-11T00:00:00Z counts toward the
