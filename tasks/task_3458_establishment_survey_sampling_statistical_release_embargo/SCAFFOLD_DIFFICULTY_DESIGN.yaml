  # ---------------------------------------------------------------
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ---------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: certify_weighted_rate_exactly_at_threshold_passes
        grounds:
          - calculations.response_rates
          - validations[priority=50]
          - errors[ERR_RESPONSE_RATE_BELOW_MINIMUM]
        distinguishing_aspect: |
          Metric: weighted response rate (6-decimal). The gate is >= 0.600000
          inclusive: a cycle engineered to land EXACTLY at 0.600000
          ((2x15 + 1x6) / (2x15 + 5x6) = 36/60) must CERTIFY successfully;
          one less responding weight would fail. Reached via the cycle advance
          endpoint.
        test_recipe:
          setup:
            - "Program CES (budget 12); frame 2026-Q3 strata (RETAIL,SMALL,30) and (RETAIL,MEDIUM,60) frozen -> allocations 2 and 10, weights 15.0 and 6.0"
            - "RS1,RS2 (SMALL) and RM1..RM5 (MEDIUM) enrolled/accepted"
            - "September cycle: RS1=4, RS2=6, RM1=8 ACCEPTED; RM2..RM5 silent; collection closed; estimates computed"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 12, embargo_window_minutes: 30, annual_burden_budget_minutes: 500 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
