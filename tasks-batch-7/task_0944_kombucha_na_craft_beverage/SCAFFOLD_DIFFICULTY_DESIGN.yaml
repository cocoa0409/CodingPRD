          A different conserved quantity from the liters invariant: DEPOSIT
          DOLLARS. After a return on day 91 the account must satisfy
          45.00 * kegs_charged_lifetime == keg_deposit_balance +
          deposit_refunded_total + deposit_forfeited_total, i.e.
