  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    scaffold_basis: >-
      Three operations are gated by the state of an entity OTHER than the one
      named in the URL: POST /rv-marketplace/bookings is gated by
      Listing.listing_status (§1.4 priority 14), POST
      /rv-marketplace/bookings/{bookingId}/settle is gated by the child
      DamageClaim rows through Booking.settlement_status (§1.2 settlement
      RECONCILING <-> DISPUTED), and POST
      /rv-marketplace/listings/{listingId}/reinstate is gated by
      Owner.owner_penalty_points (§1.4 priority 11).
    instances:

      - name: booking_creation_is_gated_by_the_parent_listings_review_state
        grounds: >-
          §1.4 priority 14 ERR_LISTING_NOT_BOOKABLE, which requires
          listing_status == LISTED, against §1.2 Listing IN_REVIEW -> LISTED.
        distinguishing_aspect: >-
          The gate is the parent LISTING's position in its own review workflow, and
          the blocking state here is IN_REVIEW — a state the listing reaches on the
          happy path, not a punitive one. Nothing about the request body is wrong:
          the same bytes are accepted the moment the platform approves the listing.
          This is the only instance in the group whose blocker is resolved by a
          transition on the gating entity's OWN machine rather than by a numeric or
          child-collection change.
        test_recipe:
          setup: >-
            Canonical marketplace with the listing submitted for review but NOT yet
            approved, so listing_status == IN_REVIEW, and the renter's wallet
            funded.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_fund
          trigger:
            - *c_booking
            - *c_list_approve
            - *c_booking
          assert:
            - "trigger step 1 (listing IN_REVIEW): response 409 and data.error_id == 'ERR_LISTING_NOT_BOOKABLE'"
            - "trigger step 2 (platform approves): response 200, data.listing_status == 'LISTED', data.insurance_status == 'VERIFIED'"
            - "trigger step 3 (identical body, listing now LISTED): response 201, data.trip_status == 'REQUESTED', data.settlement_status == 'NONE', data.nights == 4, data.renter_age_years_at_start == 32, data.renter_record_points_snapshot == 2"
            - "exactly one Booking exists: GET /rv-marketplace/bookings?listing_id=${listing_id} returns total_count == 1"

      - name: settlement_is_gated_by_a_child_damage_claim_and_released_by_its_withdrawal
        grounds: >-
          §1.2 Booking settlement_status RECONCILING -> DISPUTED (triggered by
          POST /rv-marketplace/damage-claims) and DISPUTED -> RECONCILING
          (triggered by the LAST non-terminal claim reaching a terminal status),
          with §1.4 priority 10 ERR_SETTLEMENT_STATE_INVALID.
        distinguishing_aspect: >-
          Here the gating state lives on a CHILD collection and is mirrored onto
          the parent automatically in both directions: creating a claim pushes the
          booking out of RECONCILING, and withdrawing that claim pulls it back with
          no explicit call on the booking at all. Unlike the previous instance,
          the operator never touches the entity that changed state. An
          implementation that only sets DISPUTED on claim creation, and waits for
          an explicit booking call to clear it, leaves the booking permanently
          unsettleable.
        test_recipe:
          setup: >-
            Canonical marketplace through /return (settlement RECONCILING, balance
            due 5813), then an owner damage claim on EXTERIOR_REAR, which drives
            the booking to DISPUTED.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - *c_booking
            - *c_bk_approve
            - *c_bk_confirm
            - *c_read_pre
            - *c_tp_pre_front
            - *c_tp_pre_rear
            - *c_tp_pre_interior
            - *c_tp_pre_roof
            - *c_tp_pre_under
            - *c_bk_start
            - *c_read_mid
            - *c_read_post
            - *c_tp_post_front
            - *c_tp_post_rear
            - *c_tp_post_interior
            - *c_tp_post_roof
            - *c_tp_post_under
            - *c_bk_return
            - *c_claim
          trigger:
            - *c_settle
            - &c_claim_withdraw
              call: "POST /rv-marketplace/damage-claims/${claim_id}/withdraw"
              payload: { withdraw_reason: "owner had the repair covered under warranty" }
              as: Owner
              as_user_id: "${owner_id}"
            - *c_settle
          assert:
            - "trigger step 1 (a SUBMITTED claim holds the booking in DISPUTED): response 409 and data.error_id == 'ERR_SETTLEMENT_STATE_INVALID'"
            - "trigger step 2 (claim withdrawn): response 200, data.status == 'WITHDRAWN'; GET /rv-marketplace/bookings/${booking_id} now shows data.settlement_status == 'RECONCILING' with no call made on the booking, and data.final_total_cents still 151876 because a WITHDRAWN claim contributes no renter_charge_cents"
            - "trigger step 3 (settle retried): response 200, data.settlement_status == 'SETTLED', data.trip_status == 'CLOSED'"
            - "GET /rv-marketplace/ledger-entries?booking_id=${booking_id} returns total_count == 4 with amounts -151876, +111275, +15650, +24951 summing to 0"

      - name: listing_reinstatement_is_gated_by_the_owners_penalty_point_total
        grounds: >-
          §1.4 priority 11, whose check adds "reinstate additionally requires
          Owner.owner_penalty_points < OWNER_SUSPENSION_POINT_THRESHOLD", against
          §1.2 Listing SUSPENDED -> LISTED.
        distinguishing_aspect: >-
          The listing is in a perfectly legal from-state for the transition, so the
          409 comes entirely from a NUMBER on the parent Owner — the only instance
          in this group gated by a scalar rather than by a state enum. The gate is
          also strict (<), so exactly 12 blocks and 11 admits, and clearing it
          requires no listing-side change at all: a single -1 point adjustment on
          the owner makes the identical reinstate call succeed and restores
          listed_listing_count.
        test_recipe:
          setup: >-
            Canonical marketplace with one LISTED listing, then a +12 point
            adjustment that suspends the owner and cascades the listing to
            SUSPENDED.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - &c_owner_points_12
              call: "POST /rv-marketplace/owners/${owner_id}/penalty-adjustments"
              payload: { points_delta: 12, reason: "repeated host cancellations" }
              as: PlatformAdmin
          trigger:
            - *c_list_reinstate
            - &c_owner_points_minus_1
              call: "POST /rv-marketplace/owners/${owner_id}/penalty-adjustments"
              payload: { points_delta: -1, reason: "one sanction vacated on appeal" }
              as: PlatformAdmin
            - *c_list_reinstate
          assert:
            - "trigger step 1 (owner at exactly 12 points): response 409 and data.error_id == 'ERR_LISTING_STATE_INVALID'"
            - "after step 1, GET /rv-marketplace/listings/${listing_id} still shows data.listing_status == 'SUSPENDED'"
            - "trigger step 2 (owner drops to 11): response 200, data.owner_penalty_points == 11, data.status == 'ACTIVE', data.listed_listing_count == 0"
            - "trigger step 3 (identical reinstate call): response 200, data.listing_status == 'LISTED'"
            - "after step 3, GET /rv-marketplace/owners/${owner_id} shows data.listed_listing_count == 1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    scaffold_basis: >-
      Two different overlap geometries over two different resources: §1.4
      priority 24 protects a Listing's calendar with a HALF-OPEN day interval and
      an ASYMMETRIC one-night turnaround buffer applied only after end_date, and
      §1.4 priority 25 protects a Campground's dropoff schedule with CLOSED
      minute intervals and a SYMMETRIC buffer applied to both ends, on top of a
      per-day capacity count.
    instances:

      - name: listing_calendar_is_half_open_forward_and_buffered_only_after_the_end_date
        grounds: >-
          §1.4 priority 24, collision iff new.start_date < existing.end_date + 1
          day AND new.end_date > existing.start_date, over trip_status IN
          {REQUESTED, OWNER_APPROVED, CONFIRMED, IN_TRIP, RETURNED}.
        distinguishing_aspect: >-
          The interval is asymmetric, so the two edges must be probed separately
          against the live booking [2026-08-29, 2026-09-02): a request starting
          2026-09-02 — the day the trip ends — still collides because the
          turnaround buffer pushes the existing end to 2026-09-03, while a request
          ENDING on 2026-08-29 does not collide, because the back edge is bare
          half-open with no buffer. An implementation that applies the buffer
          symmetrically rejects the 2026-08-27..2026-08-29 request; one that uses
          closed intervals rejects it too; one that omits the buffer accepts the
          2026-09-02 start.
        test_recipe:
          setup: >-
            Canonical marketplace with booking B1 CONFIRMED over
            2026-08-29..2026-09-02.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - *c_booking
            - *c_bk_approve
            - *c_bk_confirm
          trigger:
            - call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${renter_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-09-02"
                end_date: "2026-09-04"
                delivery_option: "PICKUP"
                declared_miles: 150
                declared_generator_hours: 4.0
              as: Renter
              as_user_id: "${renter_id}"
              captures: { error_id: "$.data.error_id" }
            - call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${renter_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-09-03"
                end_date: "2026-09-05"
                delivery_option: "PICKUP"
                declared_miles: 150
                declared_generator_hours: 4.0
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_after_id: "$.data.id" }
            - call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${renter_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-08-27"
                end_date: "2026-08-29"
                delivery_option: "PICKUP"
                declared_miles: 150
                declared_generator_hours: 4.0
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_before_id: "$.data.id" }
          assert:
            - "trigger step 1 (starts on the existing end_date, inside the one-night turnaround): response 409 and data.error_id == 'ERR_LISTING_DATES_UNAVAILABLE'"
            - "trigger step 2 (starts one day past the buffer): response 201, data.nights == 2, data.trip_status == 'REQUESTED'"
            - "trigger step 3 (ends exactly on the existing start_date, no buffer on that edge): response 201, data.nights == 2"
            - "GET /rv-marketplace/bookings?listing_id=${listing_id} returns total_count == 3"

      - name: campground_dropoff_windows_are_closed_intervals_with_a_symmetric_buffer
        grounds: >-
          §1.4 priority 25, collision iff new.window_start <= existing.window_end
          + buffer AND new.window_end >= existing.window_start - buffer, with
          Campground.dropoff_buffer_minutes = 30, plus §1.2 DeliveryAssignment
          REQUESTED -> SCHEDULED's capacity precondition.
        distinguishing_aspect: >-
          This geometry differs from the listing calendar on all three axes:
          minutes instead of days, CLOSED instead of half-open, and SYMMETRIC
          instead of one-sided. Against a SCHEDULED 14:00-16:00 window, a
          16:30-17:30 request conflicts because 16:30 <= 16:00 + 30 min holds with
          equality, and a 16:31-17:31 request is accepted one minute later. The
          campground's capacity is 2 so the daily bucket is not what rejects the
          first request — an implementation that returns WAITLISTED here instead of
          409 has confused the capacity fork with the window conflict, and one that
          treats the interval as half-open accepts 16:30.
        test_recipe:
          setup: >-
            Two LISTED listings, a capacity-2 campground with a 30-minute buffer,
            a CAMPGROUND_DROPOFF booking per listing both starting 2026-08-29, and
            one SCHEDULED 14:00-16:00 assignment on the first booking.
          setup_api_calls:
