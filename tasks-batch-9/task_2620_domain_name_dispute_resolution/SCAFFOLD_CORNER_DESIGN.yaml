              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/panelists"
              payload: { full_name: "Anna Bauer", nationality_code: "DE", roster_admitted_at: "2019-04-01T00:00:00Z", firm_name: "Bauer Legal", specializations: ["TRADEMARK"], max_overlapping_engagements: 3 }
              as: ProviderAdmin
              captures: { pan_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
