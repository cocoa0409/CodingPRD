            - "both line items report project_bundle_id == ${bundle_id}"
      - name: attach_line_item_from_other_plan_rejected
        claim_type: conditional_action
        grounds: ["validations[priority=12]", "endpoints.\"POST /fca/project-bundles/{id}/attach\""]
        distinguishing_aspect: "Attaching a line item whose capital_plan_id differs from the bundle's plan violates ERR_REFERENTIAL_CONFLICT."
        test_recipe:
          setup: ["Two DRAFT plans P1 and P2 on the same facility; scenario run on P1 yields a FUNDED item; bundle B belongs to P2"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "E2", contact_email: "e2@e2.example" }
