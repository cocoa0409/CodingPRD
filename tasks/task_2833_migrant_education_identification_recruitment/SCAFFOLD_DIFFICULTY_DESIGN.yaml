            - "CertificateOfEligibility.${coe_id}.status is still QC_SELECTED and correction_round_count is still 0"

      - name: business_temporal_priority_19_beats_business_fiscal_priority_29_and_rejects_assignment
        grounds:
          - validations[priority 19 ERR_PEAK_SEASON_NOT_COVERED]
          - validations[priority 29 ERR_AREA_COVERAGE_CAPACITY_EXCEEDED]
          - calculations.area_coverage_occupancy
          - endpoints[POST /mep/recruiter-assignments]
          - entities.AgriculturalArea.fields.recruiter_capacity
        distinguishing_aspect: |
          A THIRD, non-overlapping category pair on a THIRD endpoint: the candidate PRIMARY
          assignment 2026-07-01..2026-08-31 fails to contain the area's whole peak season
          2026-06-01..2026-09-30 (priority 19, business_temporal) and in the very same request pushes the
          buffered day-by-day occupancy of a recruiter_capacity-1 area to 2 (priority 29,
          business_fiscal). The 422 peak-season error must win over the 409 capacity error.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea with recruiter_capacity 1 and peak season 2026-06-01..2026-09-30"
            - "two ACTIVE Recruiters"
            - "one PLANNED PRIMARY assignment for recruiter A spanning 2026-05-01..2026-10-31, which does contain the whole peak season and consumes the single capacity slot"
