              as_user_id: "${fr_id}"
            - call: "POST /pip/renovation-phases"
              payload: { plan_id: "${plan_id}", phase_number: 2, start_date: "2026-09-13", end_date: "2026-09-18", rooms_out_of_service: 10 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { phase2_id: $.data.id }
          assert:
            - "the first create returns 409 with error_id == ERR_PHASE_WINDOW_CONFLICT (2026-09-12 falls inside the buffered end 2026-09-10 plus 2 days)"
            - "the second create returns 201 and RenovationPhase.${phase2_id}.status == PLANNED"
            - "RenovationPhase.${phase2_id}.start_date == \"2026-09-13\" is the earliest admissible start after phase 1"
            - "GET /pip/renovation-phases?plan_id=${plan_id} returns total_count == 2 (the rejected create persisted nothing)"
            - "RenovationPhase.${phase1_id}.status == PLANNED and Property.${prop_id}.rooms_out_of_service_current == 0"

      - name: contractor_capacity_half_open_intervals_allow_adjacency
        grounds:
          - calculations.contractor_capacity_overlap
          - validations[priority=63]
          - errors[ERR_CONTRACTOR_DOUBLE_BOOKED]
          - entities.Contractor.fields.max_concurrent_bookings
        distinguishing_aspect: |
          A different resource entity and different interval geometry: Contractor capacity uses
          HALF-OPEN datetime intervals with no buffer and aggregate capacity 2, so a second
          genuinely overlapping booking is admitted, the third is refused, and a booking starting
          exactly at another's end_datetime is always admitted.
        test_recipe:
          setup:
            - "One property with a plan holding one BACK_OF_HOUSE item (no life-safety scope), issued at the default clock."
            - "Phase 1 is PLANNED for 2026-09-01 to 2026-09-10, so bookings must sit within 2026-09-01T00:00:00Z and 2026-09-11T00:00:00Z."
            - "One GENERAL-trade contractor with brand_approved false and max_concurrent_bookings 2."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Kingsport Hotels LLC", contact_email: "pm@kingsporth.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Kingsport Bayfront", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-7.7.1", brand_estimated_cost_cents: 500000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { boh_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/renovation-phases"
              payload: { plan_id: "${plan_id}", phase_number: 1, start_date: "2026-09-01", end_date: "2026-09-10", rooms_out_of_service: 10 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { phase_id: $.data.id }
            - call: "POST /pip/contractors"
              payload: { name: "Grantham General Contracting", trade: "GENERAL", brand_approved: false, max_concurrent_bookings: 2 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { contractor_id: $.data.id }
          trigger:
            - call: "POST /pip/contractor-bookings"
              payload: { contractor_id: "${contractor_id}", phase_id: "${phase_id}", start_datetime: "2026-09-02T08:00:00Z", end_datetime: "2026-09-02T16:00:00Z", crew_size: 4 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { booking1_id: $.data.id }
            - call: "POST /pip/contractor-bookings"
              payload: { contractor_id: "${contractor_id}", phase_id: "${phase_id}", start_datetime: "2026-09-02T12:00:00Z", end_datetime: "2026-09-02T20:00:00Z", crew_size: 3 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { booking2_id: $.data.id }
            - call: "POST /pip/contractor-bookings"
              payload: { contractor_id: "${contractor_id}", phase_id: "${phase_id}", start_datetime: "2026-09-02T13:00:00Z", end_datetime: "2026-09-02T15:00:00Z", crew_size: 2 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/contractor-bookings"
              payload: { contractor_id: "${contractor_id}", phase_id: "${phase_id}", start_datetime: "2026-09-02T20:00:00Z", end_datetime: "2026-09-03T04:00:00Z", crew_size: 5 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { booking4_id: $.data.id }
          assert:
            - "the first booking returns 201 and ContractorBooking.${booking1_id}.status == BOOKED"
            - "the second booking returns 201 (one overlapping occupant is below the capacity of 2)"
            - "the third booking returns 409 with error_id == ERR_CONTRACTOR_DOUBLE_BOOKED (two overlapping occupants reach capacity)"
            - "the fourth booking returns 201 because 2026-09-02T20:00:00Z touches booking 2's exclusive end and therefore does not overlap"
            - "GET /pip/contractor-bookings?contractor_id=${contractor_id} returns total_count == 3"
            - "ContractorBooking.${booking4_id}.start_datetime == \"2026-09-02T20:00:00Z\" and ContractorBooking.${booking2_id}.end_datetime == \"2026-09-02T20:00:00Z\""

  # =========================================================================
  # Rule 9 — compensating invariants on different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_corpus_conserved_across_draw_and_reversal
        grounds:
          - calculations.reserve_corpus_invariant
          - calculations.reserve_availability
          - state_machines.ReserveDraw.BRAND_CONSENTED_to_DISBURSED
          - state_machines.ReserveDraw.DISBURSED_to_REVERSED
          - concurrency_rules[draw-create-stale-property]
          - entities.Property.fields.initial_reserve_balance_cents
        distinguishing_aspect: |
          Conserved quantity 1, reserve cash corpus: reserve_balance_cents plus the sum of
          DISBURSED draw amounts must equal initial_reserve_balance_cents plus
          reserve_contributed_total_cents (51000000) before, between and after the
          disburse/reverse pair, and CapitalBudget.committed_cents returns to 0.
        test_recipe:
          setup:
            - "One 200-key property created with reserve_balance_cents 50000000 and minimum_retention_cents 5000000, then credited a 1000000-cent reserve contribution, so the corpus is 51000000."
            - "A plan holding one GUEST_FACING item of 4000000 cents is issued and acknowledged; a budget authorising 4730000 cents is approved and LOCKED."
            - "A 4000000-cent reserve draw against that budget has been consented and disbursed, so reserve_balance_cents is 47000000 and committed_cents is 4000000."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Sablepoint Hospitality LLC", contact_email: "reserve@sablepoint.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Sablepoint Beachside", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/properties/${prop_id}/reserve-contributions"
              payload: { amount_cents: 1000000 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-4.4.4", brand_estimated_cost_cents: 4000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { gf_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/plans/${plan_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 4730000, contingency_pct: 0.10, financing_source: "RESERVE_DRAW", expected_plan_version: "${plan_v}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { budget_id: $.data.id }
            - call: "POST /pip/capital-budgets/${budget_id}/approve"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/capital-budgets/${budget_id}/lock"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/properties/${prop_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { prop_v: $.data.version }
            - call: "POST /pip/reserve-draws"
              payload: { property_id: "${prop_id}", capital_budget_id: "${budget_id}", purpose_item_id: "${gf_id}", amount_cents: 4000000, expected_property_version: "${prop_v}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { draw_id: $.data.id }
            - call: "POST /pip/reserve-draws/${draw_id}/consent"
              payload: { decision: "CONSENT" }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/reserve-draws/${draw_id}/disburse"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          trigger:
            - call: "POST /pip/reserve-draws/${draw_id}/reverse"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          assert:
            - "ReserveDraw.${draw_id}.status == REVERSED"
            - "Property.${prop_id}.reserve_balance_cents == 51000000"
            - "Property.${prop_id}.initial_reserve_balance_cents == 50000000 and Property.${prop_id}.reserve_contributed_total_cents == 1000000"
            - "CapitalBudget.${budget_id}.committed_cents == 0"
            - "the invariant reserve_balance_cents + sum(amount_cents of DISBURSED draws) == 51000000 holds after the disbursement (47000000 + 4000000) and after the reversal (51000000 + 0)"
            - "GET /pip/compliance-ledger-entries?plan_id=${plan_id} contains one DRAW_DISBURSED entry with delta_cents == 4000000 and one DRAW_REVERSED entry with delta_cents == -4000000"
            - "GET /pip/reserve-draws?property_id=${prop_id} shows no draw in status DISBURSED"

      - name: room_inventory_conserved_across_phase_activation_and_closeout
        grounds:
          - calculations.room_inventory_invariant
          - calculations.displacement_revenue_impact
          - state_machines.RenovationPhase.PLANNED_to_ACTIVE
          - state_machines.RenovationPhase.ACTIVE_to_CLOSED_OUT
          - entities.Property.fields.rooms_out_of_service_current
        distinguishing_aspect: |
          Conserved quantity 2, physical key inventory rather than cash: activating a 40-key
          phase and closing it out must leave rooms_out_of_service_current at 0 and
          rooms_out_of_service_current plus sellable keys at exactly room_count 200 at every
          step.
        test_recipe:
          setup:
            - "One 200-key property with adr_baseline_cents 18000 and occupancy_baseline_pct 0.70, and a plan holding one BACK_OF_HOUSE item, issued and acknowledged."
            - "Phase 1 closes 40 keys from 2026-09-01 to 2026-09-10 (10 nights) and has been activated at clock 2026-09-01, so rooms_out_of_service_current is 40."
            - "No room-impacting item is IN_PROGRESS, so close-out is permitted."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Havenbrook Lodging LLC", contact_email: "ops@havenbrookl.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Havenbrook Center City", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-8.1.1", brand_estimated_cost_cents: 500000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { boh_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/renovation-phases"
              payload: { plan_id: "${plan_id}", phase_number: 1, start_date: "2026-09-01", end_date: "2026-09-10", rooms_out_of_service: 40 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { phase_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/renovation-phases/${phase_id}/activate"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          trigger:
            - call: "POST /pip/renovation-phases/${phase_id}/close-out"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          assert:
            - "RenovationPhase.${phase_id}.status == CLOSED_OUT"
            - "Property.${prop_id}.rooms_out_of_service_current == 0"
            - "the invariant rooms_out_of_service_current + sellable_keys == 200 holds after activation (40 + 160) and after close-out (0 + 200)"
            - "RenovationPhase.${phase_id}.ooo_pct_at_activation == 0.2000 (recorded at activation and not cleared by close-out)"
            - "RenovationPhase.${phase_id}.displacement_revenue_impact_cents == 4284000 (400 displaced room-nights, 5040000 gross, 15 percent compression recapture at ratio 0.20)"
            - "GET /pip/renovation-phases?plan_id=${plan_id}&status=ACTIVE returns total_count == 0"
