  - section: rbac
    instances:
      - name: missing_auth_returns_unauthenticated
        claim_type: exclusive_operation_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 before any role, existence, or state check runs (the harness issues the trigger call with both headers dropped)."
        test_recipe:
          setup: ["Nothing needed"]
          setup_api_calls: []
          trigger:
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-060001", railroad_code: "BNSF", road_authority_locality_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "with headers dropped: error_id == ERR_UNAUTHENTICATED (http 401) — auth beats even the bogus locality FK"

      - name: role_exclusive_operations_denied
        claim_type: exclusive_operation_denied
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", roles]
        distinguishing_aspect: "LocalAuthority cannot create crossings (ProgramAdministrator-only) and RailroadMaintainer cannot create funding programs."
        test_recipe:
          setup: ["One registered locality (its id serves as the LocalAuthority identity)"]
