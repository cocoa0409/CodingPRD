            - "The response status is 422."
            - "Athlete.${ath_id}.annual_committed_value_cents == 3000000"
            - "Collective.${col_id}.committed_unreleased_cents == 3000000"
            - "Collective.${col_id}.funding_posture == OPEN"
            - "A second attempt at total_value_cents 2000000 succeeds and takes annual_committed_value_cents to exactly 5000000, so the cap comparison is a strict greater-than."

