scaffold_corner_design:

  - section: entities
    instances:
      - name: member_creation_charges_fee_and_sets_period
        claim_type: creation
        grounds: [entities.Member, endpoints.POST_/members]
        distinguishing_aspect: "Enrollment at the default clock yields ACTIVE status, fee_paid_total_cents 17500, period end exactly +365d, and net savings starting negative (-17500)."
        test_recipe:
          setup: ["default logical clock 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "c1@x.com", full_name: "C One", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id, st: $.data.status, fee: $.data.fee_paid_total_cents, pe: $.data.current_period_end, tier: $.data.pricing_tier, gross: $.data.lifetime_gross_savings_cents, net: $.data.lifetime_net_savings_cents } }
          trigger: []
          assert:
            - "Member.${mid}.status == ACTIVE"
            - "Member.${mid}.fee_paid_total_cents == 17500"
            - "Member.${mid}.current_period_end == 2027-09-01T00:00:00Z"
            - "Member.${mid}.pricing_tier == MEMBER"
            - "Member.${mid}.lifetime_gross_savings_cents == 0 and lifetime_net_savings_cents == -17500"

      - name: product_created_discontinued_via_input
        claim_type: defaults
        grounds: [entities.Product.fields.status]
        distinguishing_aspect: "status is an input field with default ACTIVE; supplying DISCONTINUED at creation is stored verbatim."
        test_recipe:
          setup: []
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "DIS-01", name: "Old", list_price_cents: 1000, line_kind: "STOCK", status: "DISCONTINUED" }, as: PlatformAdmin, captures: { pid: $.data.id, st: $.data.status } }
          trigger: []
          assert:
            - "Product.${pid}.status == DISCONTINUED and promo_active == false"

      - name: order_create_computed_fields_initialized
        claim_type: computed_fields
        grounds: [entities.Order, endpoints.POST_/orders]
        distinguishing_aspect: "Retail guest order create initializes QUOTE status, zero totals, RETAIL tier, and quote_expires_at = clock + 14 days (2026-09-15T00:00:00Z)."
        test_recipe:
          setup: ["gallery exists"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery CE", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id, st: $.data.status, qe: $.data.quote_expires_at, tot: $.data.total_cents, tier: $.data.pricing_tier } }
          trigger: []
          assert:
            - "Order.${oid}.status == QUOTE"
            - "Order.${oid}.quote_expires_at == 2026-09-15T00:00:00Z"
            - "Order.${oid}.total_cents == 0 and subtotal_cents == 0 and deposit_due_cents == 0"
            - "Order.${oid}.pricing_tier == RETAIL"

      - name: product_create_client_version_input_ignored
        claim_type: system_fields
        grounds: [entities.Product, response_envelope]
        distinguishing_aspect: "Client-supplied system field version in the create payload is ignored; the server mints version 1."
        test_recipe:
          setup: []
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "SYS-01", name: "Sys", list_price_cents: 1000, line_kind: "STOCK", version: 99 }, as: PlatformAdmin, captures: { pid: $.data.id, ver: $.data.version } }
          trigger: []
          assert:
            - "Product.${pid}.version == 1 (client input 99 ignored)"

      - name: order_get_missing_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent order UUID returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_FOUND and HTTP 404"

      - name: product_create_missing_required_price_rejected
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Product.fields.list_price_cents]
        distinguishing_aspect: "Omitting the required input list_price_cents is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /products", payload: { sku: "BAD-01", name: "Bad", line_kind: "STOCK" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP 400"

  - section: state_machines
    instances:
      - name: cancelled_order_rejects_further_line_adds
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Order.QUOTE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED order is terminal: adding a line afterwards fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["gallery, stock product, retail guest QUOTE order, then cancelled"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery T1", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "T1-01", name: "T1", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/cancel", payload: {}, as: GalleryAssociate }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP 409"

      - name: consultation_double_complete_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DesignConsultation.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal for a consultation; a second complete call is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["member with QUOTE order; consultation completed once"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery T2", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /members", payload: { email: "c2@x.com", full_name: "C Two", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /products", payload: { sku: "T2-01", name: "T2", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /design-consultations", payload: { member_id: "${mid}", order_id: "${oid}", scheduled_at: "2026-09-03T10:00:00Z" }, as: Member, as_user_id: "${mid}", captures: { cid: $.data.id } }
            - { call: "POST /design-consultations/${cid}/complete", payload: { design_plan_notes: "done" }, as: GalleryAssociate }
          trigger:
            - { call: "POST /design-consultations/${cid}/complete", payload: { design_plan_notes: "again" }, as: GalleryAssociate, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP 409"

      - name: completed_appointment_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DeliveryAppointment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED appointment accepts no further record-outcome calls; the second attempt fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["stock order delivered via appointment on 2026-09-05"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery T3", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "T3-01", name: "T3", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: GalleryAssociate }
            - { call: "POST /delivery-appointments", payload: { order_id: "${oid}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 60, room_placement: true, assembly_required: false }, as: GalleryAssociate, captures: { aid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "POST /delivery-appointments/${aid}/record-outcome", payload: { outcome: "COMPLETED", packaging_removed: true }, as: HubOperator }
          trigger:
            - { call: "POST /delivery-appointments/${aid}/record-outcome", payload: { outcome: "FAILED", failure_reason: "late" }, as: HubOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP 409"

      - name: settled_return_rejects_second_settle
        claim_type: idempotency
        grounds: [state_machines.ReturnRequest.REQUESTED_to_SETTLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling a return twice is rejected; the first APPROVE computes fee 7500 and refund 42500 for a 50000 line and those values are not recomputed."
        test_recipe:
          setup: ["stock order (line 50000) delivered 2026-09-05; return created and settled APPROVE"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery T4", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "T4-01", name: "T4", list_price_cents: 50000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: GalleryAssociate }
            - { call: "POST /delivery-appointments", payload: { order_id: "${oid}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 60, room_placement: false, assembly_required: false }, as: GalleryAssociate, captures: { aid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "POST /delivery-appointments/${aid}/record-outcome", payload: { outcome: "COMPLETED", packaging_removed: false }, as: HubOperator }
            - { call: "POST /returns", payload: { order_id: "${oid}", order_line_ids: ["${lid}"] }, as: GalleryAssociate, captures: { rid: $.data.id } }
            - { call: "POST /returns/${rid}/settle", payload: { decision: "APPROVE" }, as: GalleryAssociate, captures: { fee: $.data.restocking_fee_cents, refund: $.data.refund_cents } }
          trigger:
            - { call: "POST /returns/${rid}/settle", payload: { decision: "REJECT", reason: "changed mind" }, as: GalleryAssociate, captures: { err: $.data.error_id } }
          assert:
            - "First settle: restocking_fee_cents == 7500 and refund_cents == 42500"
            - "Second settle: error_id == ERR_INVALID_STATE and HTTP 409"

      - name: rejected_trade_account_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TradeAccount.APPLIED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED trade account cannot be re-verified; the second verify call fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["trade account created then REJECTED"]
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { email: "tt@x.com", business_name: "TT", credential_document_id: "d1", license_number: "L1" }, as: Anonymous, captures: { tid: $.data.id } }
            - { call: "POST /trade-accounts/${tid}/verify", payload: { decision: "REJECT" }, as: TradeReviewer }
          trigger:
            - { call: "POST /trade-accounts/${tid}/verify", payload: { decision: "APPROVE", tier: "TIER_1" }, as: TradeReviewer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP 409"

      - name: confirm_zero_custom_goes_ready_for_delivery
        claim_type: side_effect_execution
        grounds: [state_machines.Order.QUOTE_to_CONFIRMED]
        distinguishing_aspect: "A stock-only order skips CONFIRMED on confirm and lands directly in READY_FOR_DELIVERY."
        test_recipe:
          setup: ["stock-only retail guest QUOTE order with one line"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery T5", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "T5-01", name: "T5", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
          trigger:
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: GalleryAssociate, captures: { st: $.data.status } }
          assert:
            - "Order.${oid}.status == READY_FOR_DELIVERY (CONFIRMED skipped for zero-custom orders)"

      - name: slot_completion_bubbles_order_to_ready
        claim_type: side_effect_execution
        grounds: [state_machines.ProductionSlot.IN_PROGRESS_to_CONSUMED, state_machines.Order.CONFIRMED_to_READY_FOR_DELIVERY]
        distinguishing_aspect: "Bubble-up: completing the only custom line's slot advances the order CONFIRMED -> READY_FOR_DELIVERY with no direct order call."
        test_recipe:
          setup: ["retail guest order with one CUSTOM line (list 120000, deposit 60000) confirmed; slot committed and advanced to IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery T6", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "T6-01", name: "T6", list_price_cents: 120000, line_kind: "CUSTOM" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/confirm", payload: { deposit_payment_cents: 60000 }, as: GalleryAssociate, captures: { st1: $.data.status } }
            - { call: "POST /production-slots", payload: { gallery_id: "${gid}", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z" }, as: ProductionPlanner, captures: { sid: $.data.id } }
            - { call: "POST /orders/${oid}/lines/${lid}/schedule-production", payload: { production_slot_id: "${sid}" }, as: ProductionPlanner }
            - { call: "POST /production-slots/${sid}/advance", payload: { to_state: "IN_PROGRESS" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /production-slots/${sid}/advance", payload: { to_state: "CONSUMED" }, as: ProductionPlanner }
            - { call: "GET /orders/${oid}", payload: {}, as: PlatformAdmin, captures: { st2: $.data.status } }
          assert:
            - "Order was CONFIRMED after confirm (has custom lines)"
            - "After slot CONSUMED: Order.${oid}.status == READY_FOR_DELIVERY (bubble-up)"

      - name: schedule_production_requires_deposit_paid
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_CUSTOM_LINE_NOT_DEPOSIT_PAID]"]
        distinguishing_aspect: "A custom line in PENDING_DEPOSIT (order still QUOTE) cannot be scheduled into a slot."
        test_recipe:
          setup: ["retail guest QUOTE order with one CUSTOM line; OPEN slot exists"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery T7", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "T7-01", name: "T7", list_price_cents: 120000, line_kind: "CUSTOM" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { lid: $.data.id } }
            - { call: "POST /production-slots", payload: { gallery_id: "${gid}", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z" }, as: ProductionPlanner, captures: { sid: $.data.id } }
          trigger:
            - { call: "POST /orders/${oid}/lines/${lid}/schedule-production", payload: { production_slot_id: "${sid}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CUSTOM_LINE_NOT_DEPOSIT_PAID and HTTP 409"

      - name: in_production_custom_line_removal_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_LINE_NON_CANCELABLE]", state_machines.Order.CONFIRMED_to_CONFIRMED]
        distinguishing_aspect: "Custom deposits become truly non-cancelable once production starts: removing an IN_PRODUCTION custom line from a CONFIRMED order fails with ERR_LINE_NON_CANCELABLE even with a correct OCC version."
        test_recipe:
          setup: ["retail guest CONFIRMED order, custom line committed to a slot advanced to IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery T8", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "T8-01", name: "T8", list_price_cents: 120000, line_kind: "CUSTOM" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/confirm", payload: { deposit_payment_cents: 60000 }, as: GalleryAssociate }
            - { call: "POST /production-slots", payload: { gallery_id: "${gid}", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z" }, as: ProductionPlanner, captures: { sid: $.data.id } }
            - { call: "POST /orders/${oid}/lines/${lid}/schedule-production", payload: { production_slot_id: "${sid}" }, as: ProductionPlanner }
            - { call: "POST /production-slots/${sid}/advance", payload: { to_state: "IN_PROGRESS" }, as: ProductionPlanner }
            - { call: "GET /orders/${oid}", payload: {}, as: PlatformAdmin, captures: { ovar: $.data.version } }
          trigger:
            - { call: "DELETE /orders/${oid}/lines/${lid}", payload: { expected_order_version: "${ovar}" }, as: GalleryAssociate, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LINE_NON_CANCELABLE and HTTP 409"

  - section: calculations
    instances:
      - name: promo_stacks_member_discount_multiplicatively
        claim_type: correct_result
        grounds: [calculations.order_line_pricing]
        distinguishing_aspect: "Promo applies to list first, then the member discount applies to the promo price: 200000 -> 180000 -> 135000 (not 25%+10% off list = 130000)."
        test_recipe:
          setup: ["product list 200000 with promo released before member order creation"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery C1", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "C1-01", name: "C1", list_price_cents: 200000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /source-books", payload: { title: "Book C1", product_ids: ["${pid}"], print_ready_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "POST /members", payload: { email: "c3@x.com", full_name: "C Three", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}", captures: { charged: $.data.line_charged_cents } }
          assert:
            - "OrderLine.line_charged_cents == 135000 (round_half_up(180000 * 0.75))"
            - "GET /orders/${oid}: subtotal_cents == 135000, white_glove_fee_cents == 19900, total_cents == 154900"

      - name: trade_price_excludes_promo
        claim_type: input_set_filtering
        grounds: [calculations.order_line_pricing]
        distinguishing_aspect: "For trade orders the promo branch is skipped entirely: TIER_1 applies 30% to the list price (140000) even while promo_active is true (member would pay 135000); trade fee is a flat 14900 with no waiver."
        test_recipe:
          setup: ["product list 200000 with promo released; VERIFIED TIER_1 trade account"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery C2", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "C2-01", name: "C2", list_price_cents: 200000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /source-books", payload: { title: "Book C2", product_ids: ["${pid}"], print_ready_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "POST /trade-accounts", payload: { email: "c4@x.com", business_name: "C4 Design", credential_document_id: "d", license_number: "L" }, as: Anonymous, captures: { tid: $.data.id } }
            - { call: "POST /trade-accounts/${tid}/verify", payload: { decision: "APPROVE", tier: "TIER_1" }, as: TradeReviewer }
          trigger:
            - { call: "POST /orders", payload: { gallery_id: "${gid}", trade_account_id: "${tid}" }, as: TradeDesigner, as_user_id: "${tid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: TradeDesigner, as_user_id: "${tid}", captures: { charged: $.data.line_charged_cents } }
          assert:
            - "OrderLine.line_charged_cents == 140000 (promo ignored for TRADE tier)"
            - "GET /orders/${oid}: white_glove_fee_cents == 14900 (flat trade fee, never waived), total_cents == 154900"

