  # =========================================================================
  # Excluded stubs (already covered by §1.8 difficulty instances)
  # =========================================================================
  - section: calculations
    instances:
      - name: cost_daily_tiered_correct_result_stub
        claim_type: Correct Result
        grounds: ["calculations.cost_of_rental"]
        excluded_because:
          difficulty_instance: combinatorial_formula / daily_tiered_rate_three_tier_selection
          rationale: "Daily tiered accrued_charge_cents == 75200 is asserted by the named §1.8 instance."
      - name: fleet_invoice_round_then_sum_stub
        claim_type: Correct Result
        grounds: ["calculations.fleet_invoice"]
        excluded_because:
          difficulty_instance: combinatorial_formula / fleet_invoice_round_then_sum_order
          rationale: "Fleet invoice round-then-sum amount_due == 37500 is asserted by the named §1.8 instance."
      - name: buyout_dual_variant_stub
        claim_type: Variant Divergence
        grounds: ["calculations.buyout_price"]
        excluded_because:
          difficulty_instance: dual_variant_calc / buyout_subscription_equity_vs_daily_flat
          rationale: "Subscription-equity vs daily-flat divergence is asserted by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: service_ticket_cycle_stub
        claim_type: cyclic
        grounds: ["state_machines.ServiceTicket.RESOLVED_to_REOPENED"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / service_ticket_resolve_reopen_cycle
          rationale: "The RESOLVED->REOPENED->IN_PROGRESS cycle is exercised by the named §1.8 instance."
      - name: return_cascade_bike_release_stub
        claim_type: Side Effect Execution
        grounds: ["state_machines.RentalAgreement.RETURN_REQUESTED_to_RETURNED"]
        excluded_because:
          difficulty_instance: transitive_cascade / return_inspect_cascade_depth3
          rationale: "Bike OUT->AVAILABLE and model reconcile on inspect are asserted by the named §1.8 instance."
