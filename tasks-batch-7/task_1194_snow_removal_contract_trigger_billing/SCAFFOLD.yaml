# =============================================================================
# Task 1194: Snow Removal Contract & Trigger Billing (commercial snow contractor)
# =============================================================================

scenario: |
  1194. Snow Removal Contract & Trigger Billing (commercial snow contractor): contract type (per-push/seasonal/hourly) & trigger depth definition, weather data source & event verification, site priority sequencing & completion time targets, salt/ice-melt application logging & material cost, service verification photos & dispute resolution, slip-and-fall claim documentation support, subcontractor coverage & equipment failure backup, seasonal true-up & renewal

domain_name: snow-removal-contracts
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - selector_policy
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# Shared domain constants (referenced by calculations, validations, machines).
constants:
  VERIFICATION_SOURCE_QUORUM: 2            # distinct source_name values required to verify
  VERIFICATION_OBSERVATION_GRACE_HOURS: 6  # observation eligibility window extends this far past window_end (closed)
  CHALLENGE_WINDOW_HOURS: 48               # client challenge allowed while clock <= verified_at + 48h (inclusive)
  PHOTO_ACCEPT_WINDOW_MINUTES: 360         # AFTER photo acceptable while clock <= completed_at + 360 (inclusive)
  BACKUP_GRACE_MINUTES: 120                # SLA deadline extension when a backup subcontractor is assigned
  REAPPLY_GAP_MINUTES: 90                  # min gap between visits at the same site (buffer semantics)
  POST_SEASON_BILLING_DAYS: 60             # invoices may issue while clock <= season_end + 60d (inclusive)
  RELIABILITY_SUSPEND_FLOOR: 70            # auto-suspend when reliability_score < floor
  RELIABILITY_MIN_ASSIGNMENTS: 3           # auto-suspend only once released+failed >= 3
  DOCUMENTATION_MIN_SCORE: 60              # claim must score >= 60 to reach DOCUMENTED
  PERF_CREDIT_CAP_PCT: 0.20                # performance credit capped at 20% of seasonal fee
  BILLING_INCREMENT_MINUTES: 6             # hourly billing rounds up to 6-minute increments
  NIGHT_WINDOW_UTC: "22:00-06:00"          # visit starting with hour in [22,24) U [0,6) UTC gets night premium

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; all creation via body FKs)
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Commercial property manager organization name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding billed exposure allowed; issue gate uses <= comparison" }
      - { name: credit_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of (total_cents - paid_cents) over this client's invoices with status IN {ISSUED, PARTIALLY_CREDITED, PARTIALLY_PAID}" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning property manager" }
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: region_code, type: string, source: input, description: "Weather region; matches StormEvent.region_code for coverage" }
      - { name: pavement_area_sqft, type: integer, source: input, description: "Plowable area; drives area-normative material cap" }
      - { name: requires_loader, type: boolean, source: input, default: false, description: "True when the site needs loader-class equipment (subcontractor capability gate)" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; billing counterparty" }
      - { name: contract_type, type: enum, source: input, description: "PER_PUSH | SEASONAL | HOURLY" }
      - { name: season_start, type: datetime, source: input, description: "Season coverage start (closed interval); must be <= season_end" }
      - { name: season_end, type: datetime, source: input, description: "Season coverage end (closed interval)" }
      - { name: trigger_depth_inches, type: number, source: input, default: 2.00, description: "Verified accumulation >= this depth makes pushes billable; 2 decimal places" }
      - { name: per_push_rate_cents, type: integer, source: input, description: "Required when contract_type=PER_PUSH; price per billable push" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Required when contract_type=HOURLY; tier-1 hourly rate" }
      - { name: hourly_tier2_rate_cents, type: integer, source: input, description: "Required when contract_type=HOURLY; rate beyond the tier threshold" }
      - { name: hourly_tier_threshold_minutes, type: integer, source: input, default: 2400, description: "Cumulative season billable minutes billed at tier-1 (<= threshold), beyond at tier-2" }
      - { name: night_premium_pct, type: number, source: input, default: 0.25, description: "Multiplier uplift when visit actual_start_at hour falls in the UTC night window" }
      - { name: seasonal_fee_cents, type: integer, source: input, description: "Required when contract_type=SEASONAL; prepaid fixed fee" }
      - { name: seasonal_push_cap, type: integer, source: input, description: "Required when contract_type=SEASONAL; pushes included in fee (<= cap included, beyond billed as overage)" }
      - { name: seasonal_overage_rate_cents, type: integer, source: input, description: "Required when contract_type=SEASONAL; per-push overage price beyond cap" }
      - { name: sla_miss_penalty_cents, type: integer, source: input, default: 15000, description: "Performance credit per SLA miss at true-up" }
      - { name: require_photo_verification, type: boolean, source: input, default: true, description: "When true, visit completion requires >= 1 ACCEPTED AFTER photo" }
      - { name: salt_rate_per_lb_cents, type: integer, source: input, default: 25, description: "ROCK_SALT material rate snapshot source" }
      - { name: blend_rate_per_lb_cents, type: integer, source: input, default: 60, description: "ICE_MELT_BLEND material rate snapshot source" }
      - { name: brine_rate_per_lb_cents, type: integer, source: input, default: 35, description: "LIQUID_BRINE material rate snapshot source" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE <-> SUSPENDED -> EXPIRED (terminal)" }
      - { name: season_billable_push_count, type: integer, source: computed, default: 0, description: "Count of visits with billing_status IN {BILLABLE_CONFIRMED, INVOICED, DISPUTED, SETTLED}" }
      - { name: season_billable_minutes, type: integer, source: computed, default: 0, description: "Cumulative billable minutes over the same visit set (hourly tiering input)" }
      - { name: season_billed_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over invoices with status IN {ISSUED, PARTIALLY_CREDITED, PARTIALLY_PAID, PAID}" }
      - { name: unbilled_billable_cents, type: integer, source: computed, default: 0, description: "Sum of (billable_amount_cents + material_cost_cents) over visits in BILLABLE_CONFIRMED" }
      - { name: season_sla_miss_count, type: integer, source: computed, default: 0, description: "Visits with sla_miss=true (late completion or sweep-marked MISSED)" }
      - { name: overage_active, type: boolean, source: computed, default: false, description: "SEASONAL only: true once season_billable_push_count > seasonal_push_cap" }
      - { name: prior_contract_id, type: string, source: input, description: "FK -> Contract.id; set on the renewal copy (nullable; self-referential)", constraints: "nullable" }
      - { name: renewed_to_contract_id, type: string, source: system, description: "FK -> Contract.id; set on the expired source contract when renewed (nullable)", constraints: "nullable" }

  - name: ContractSite
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: trigger_depth_inches, type: number, source: input, description: "Per-site trigger override (nullable)", constraints: "nullable" }
      - { name: per_push_rate_cents, type: integer, source: input, description: "Per-site push rate override (nullable)", constraints: "nullable" }
      - { name: priority_sequence, type: integer, source: input, description: "Route ordering key within the contract; unique per contract (lower services first)" }
      - { name: completion_target_minutes, type: integer, source: input, description: "SLA: visit must complete by storm window_end + this many minutes (> 0)" }
      - { name: salt_included_lbs, type: number, source: input, default: 0, description: "Seasonal salt allowance included in fee; converted to cents at true-up" }
      - { name: effective_trigger_depth_inches, type: number, source: computed, description: "= trigger_depth_inches override if set else contract.trigger_depth_inches" }
      - { name: effective_per_push_rate_cents, type: integer, source: computed, description: "= per_push_rate_cents override if set else contract.per_push_rate_cents" }

  - name: ContractAmendment
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: effective_from, type: datetime, source: input, description: "Recorded effectivity marker; must satisfy season_start < effective_from <= season_end" }
      - { name: trigger_depth_inches, type: number, source: input, description: "Proposed new trigger depth (nullable)", constraints: "nullable" }
      - { name: per_push_rate_cents, type: integer, source: input, description: "Proposed new push rate (nullable)", constraints: "nullable" }
      - { name: sla_miss_penalty_cents, type: integer, source: input, description: "Proposed new SLA penalty (nullable)", constraints: "nullable" }
      - { name: require_photo_verification, type: boolean, source: input, description: "Proposed new photo gate (nullable)", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED | REJECTED | SUPERSEDED" }

  - name: StormEvent
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "Weather region served" }
      - { name: window_start, type: datetime, source: input, description: "Snowfall window start (< window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Snowfall window end; SLA deadlines anchor here" }
      - { name: reported_accumulation_inches, type: number, source: input, description: "Initial reported storm total (2 dp); drives provisional projection" }
      - { name: reported_source_name, type: string, source: input, description: "Source of the initial report (e.g., NOAA)" }
      - { name: status, type: enum, source: system, description: "REPORTED -> VERIFIED -> CHALLENGED -> VERIFIED (cycle) -> CLOSED; REPORTED|CHALLENGED|VERIFIED -> VOIDED" }
      - { name: verified_accumulation_inches, type: number, source: system, description: "Latest-observation accumulation selected at verification (nullable until first VERIFIED)", constraints: "nullable" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock time of latest successful verification (nullable)", constraints: "nullable" }
      - { name: verifying_observation_ids, type: array, source: system, description: "WeatherObservation.id values eligible at latest verification" }
      - { name: challenged_at, type: datetime, source: system, description: "Logical-clock time of latest challenge (nullable)", constraints: "nullable" }
      - { name: challenged_by_client_id, type: string, source: system, description: "Client.id of challenger (nullable)", constraints: "nullable" }
      - { name: challenge_reason, type: string, source: system, description: "Last challenge reason (nullable)", constraints: "nullable" }
      - { name: closed_at, type: datetime, source: system, description: "Set by close-sweep (nullable)", constraints: "nullable" }

  - name: WeatherObservation
    parent: null
    common_fields: false
    fields:
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id" }
      - { name: source_name, type: string, source: input, description: "Weather data source label (NOAA, DTN, ON_SITE_SENSOR, ...)" }
      - { name: observed_at, type: datetime, source: input, description: "Reading timestamp; must fall inside [window_start, window_end + 6h] (closed)" }
      - { name: accumulation_inches, type: number, source: input, description: "Storm-total accumulation reading, 2 dp, > 0" }
      - { name: note, type: string, source: input, description: "Optional analyst note", constraints: "nullable" }

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id" }
      - { name: contract_site_id, type: string, source: input, description: "FK -> ContractSite.id" }
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; denormalized from ContractSite at creation" }
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; denormalized from ContractSite at creation" }
      - { name: assigned_subcontractor_id, type: string, source: system, description: "FK -> Subcontractor.id; null means in-house crew", constraints: "nullable" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start; same-site buffer rule applies" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end (> scheduled_start)" }
      - { name: actual_start_at, type: datetime, source: system, description: "Logical clock at /start (nullable)", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at /complete (nullable)", constraints: "nullable" }
      - { name: execution_status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> COMPLETED | VOIDED; SCHEDULED -> AWAITING_BACKUP -> SCHEDULED; SCHEDULED|AWAITING_BACKUP -> MISSED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "PENDING -> BILLABLE_CONFIRMED | NON_BILLABLE; BILLABLE_CONFIRMED -> INVOICED -> DISPUTED -> SETTLED | WRITTEN_OFF; NON_BILLABLE -> BILLABLE_CONFIRMED on re-verification" }
      - { name: sla_deadline_at, type: datetime, source: computed, description: "= storm.window_end + contract_site.completion_target_minutes (+ BACKUP_GRACE_MINUTES when grace_extended)" }
      - { name: grace_extended, type: boolean, source: system, default: false, description: "True once a backup subcontractor was assigned after an equipment failure" }
      - { name: sla_miss, type: boolean, source: computed, description: "null until COMPLETED (completed_at > sla_deadline_at) or MISSED (true)", constraints: "nullable" }
      - { name: billable_minutes, type: integer, source: computed, description: "HOURLY: ceil((completed_at - actual_start_at) / 6min) * 6" }
      - { name: night_premium_applied, type: boolean, source: computed, description: "HOURLY: true when actual_start_at hour in [22,24) U [0,6) UTC" }
      - { name: billable_amount_cents, type: integer, source: computed, description: "Service charge for this visit per contract type (0 for SEASONAL during season)" }
      - { name: material_cost_cents, type: integer, source: computed, default: 0, description: "Sum of line_cost_cents over RECORDED (non-voided) MaterialApplication rows" }
      - { name: applied_trigger_depth_inches, type: number, source: system, description: "Trigger depth snapshot frozen at completion", constraints: "nullable" }
      - { name: applied_per_push_rate_cents, type: integer, source: system, description: "Push rate snapshot frozen at completion", constraints: "nullable" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID that completed the visit (segregation-of-duties input)", constraints: "nullable" }

  - name: MaterialApplication
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> ServiceVisit.id" }
      - { name: material_type, type: enum, source: input, description: "ROCK_SALT | ICE_MELT_BLEND | LIQUID_BRINE" }
      - { name: quantity_lbs, type: number, source: input, description: "Applied quantity, 2 dp, must be > 0" }
      - { name: rate_per_lb_cents_snapshot, type: integer, source: system, description: "Contract material rate for material_type frozen at log time" }
      - { name: line_cost_cents, type: integer, source: computed, description: "= round_half_up(quantity_lbs * rate_per_lb_cents_snapshot); per-line rounding is pinned" }
      - { name: status, type: enum, source: system, description: "RECORDED -> VOIDED" }
      - { name: logged_by_user_id, type: string, source: system, description: "X-User-ID that logged the application" }

  - name: ServicePhoto
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> ServiceVisit.id" }
      - { name: phase, type: enum, source: input, description: "BEFORE | AFTER" }
      - { name: image_uri, type: string, source: input, description: "Object storage reference" }
      - { name: review_status, type: enum, source: system, description: "UPLOADED -> ACCEPTED | REJECTED (both terminal)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Dispatcher X-User-ID at review (nullable)", constraints: "nullable" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id; required when kind=EVENT, null when kind=PERIOD", constraints: "nullable" }
      - { name: kind, type: enum, source: input, description: "EVENT (PER_PUSH contracts) | PERIOD (HOURLY contracts)" }
      - { name: period_start, type: datetime, source: input, description: "Required when kind=PERIOD; half-open [period_start, period_end)", constraints: "nullable" }
      - { name: period_end, type: datetime, source: input, description: "Required when kind=PERIOD; exclusive upper bound", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> PARTIALLY_CREDITED | PARTIALLY_PAID -> PAID; DRAFT|ISSUED|PARTIALLY_PAID|PARTIALLY_CREDITED -> VOIDED" }
      - { name: lines, type: array, source: computed, description: "Per-visit SERVICE line plus MATERIAL line when material_cost_cents > 0; recomputed live while DRAFT, frozen at issue" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_cents over lines" }
      - { name: credit_cents, type: integer, source: system, default: 0, description: "Accumulated dispute credits" }
      - { name: total_cents, type: integer, source: computed, description: "= subtotal_cents - credit_cents" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative recorded payments" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issue (nullable)", constraints: "nullable" }
      - { name: issued_by_user_id, type: string, source: system, description: "Dispatcher X-User-ID at issue (segregation-of-duties input)", constraints: "nullable" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id" }
      - { name: visit_id, type: string, source: input, description: "FK -> ServiceVisit.id; must appear among the invoice's lines" }
      - { name: reason, type: enum, source: input, description: "TRIGGER_NOT_MET | INCOMPLETE_SERVICE | PHOTO_INSUFFICIENT | RATE_DISAGREEMENT | MATERIAL_QUANTITY" }
      - { name: status, type: enum, source: system, description: "OPEN -> EVIDENCE_REVIEW -> OPEN (cycle) -> RESOLVED_UPHELD | RESOLVED_ADJUSTED | RESOLVED_REMOVED" }
      - { name: opened_by_client_id, type: string, source: system, description: "Client.id of the filing contact" }
      - { name: evidence_items, type: array, source: system, description: "Appended evidence entries {note, photo_ids}; photo_ids are ServicePhoto.id references" }
      - { name: resolved_by_user_id, type: string, source: system, description: "Dispatcher X-User-ID at resolution (nullable)", constraints: "nullable" }
      - { name: resolution_credit_cents, type: integer, source: system, description: "Credit applied to the invoice (0 for UPHELD)", constraints: "nullable" }

  - name: SlipFallClaim
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; incident location" }
      - { name: incident_at, type: datetime, source: input, description: "Incident timestamp; must fall inside a season where the site was covered" }
      - { name: severity, type: enum, source: input, description: "INJURY_REPORTED | PROPERTY_DAMAGE | NEAR_MISS; INJURY_REPORTED selects STRICT score weights" }
      - { name: description, type: string, source: input, description: "Claim narrative" }
      - { name: status, type: enum, source: system, description: "FILED -> DOCUMENTATION_REVIEW -> DOCUMENTED -> CLOSED; FILED|DOCUMENTATION_REVIEW -> WITHDRAWN" }
      - { name: storm_event_id, type: string, source: system, description: "FK -> StormEvent.id; linked at review when an event window contains incident_at (nullable)", constraints: "nullable" }
      - { name: documentation_contract_id, type: string, source: system, description: "FK -> Contract.id; covering contract resolved at review (nullable)", constraints: "nullable" }
      - { name: score_standard, type: integer, source: computed, description: "Completeness score under STANDARD weights (nullable until review)", constraints: "nullable" }
      - { name: score_strict, type: integer, source: computed, description: "Completeness score under STRICT weights (nullable until review)", constraints: "nullable" }
      - { name: documentation_completeness_score, type: integer, source: computed, description: "Selected score (STRICT when severity=INJURY_REPORTED else STANDARD)" }

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Company legal name" }
      - { name: contact_email, type: string, source: input, description: "Dispatch contact" }
      - { name: has_loader, type: boolean, source: input, default: false, description: "Loader-class equipment capability" }
      - { name: has_brine_truck, type: boolean, source: input, default: false, description: "Liquid brine capability" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED <-> SUSPENDED" }
      - { name: assignments_released_count, type: integer, source: computed, default: 0, description: "Coverage assignments reaching RELEASED" }
      - { name: assignments_failed_count, type: integer, source: computed, default: 0, description: "Coverage assignments reaching FAILED" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "Coverage assignments currently ACTIVE" }
      - { name: reliability_score, type: integer, source: computed, description: "= floor(100 * released / max(1, released + failed))" }

  - name: CoverageAssignment
    parent: null
    common_fields: true
    fields:
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; covered scope" }
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id" }
      - { name: coverage_start, type: datetime, source: input, description: "Coverage window start; half-open [coverage_start, coverage_end); must overlap the event window" }
      - { name: coverage_end, type: datetime, source: input, description: "Coverage window end (exclusive); > coverage_start" }
      - { name: status, type: enum, source: system, description: "CREATED -> ACTIVE -> RELEASED | FAILED; CREATED -> CANCELLED" }
      - { name: failure_reason, type: string, source: system, description: "Recorded on equipment-failure transition (nullable)", constraints: "nullable" }

  - name: SeasonalTrueUp
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id (SEASONAL, EXPIRED)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> SETTLED; DRAFT -> SUPERSEDED" }
      - { name: billable_push_count, type: integer, source: computed, description: "Season billable push count at computation" }
      - { name: overage_pushes, type: integer, source: computed, description: "= max(0, billable_push_count - seasonal_push_cap)" }
      - { name: overage_cents, type: integer, source: computed, description: "= overage_pushes * seasonal_overage_rate_cents" }
      - { name: material_actual_cents, type: integer, source: computed, description: "Sum of RECORDED line_cost_cents over the contract's season visits" }
      - { name: material_normative_cents, type: integer, source: computed, description: "Sum of area-normative caps per RECORDED application" }
      - { name: material_allowance_cents, type: integer, source: computed, description: "Sum over contract sites of round_half_up(salt_included_lbs * salt_rate_per_lb_cents)" }
      - { name: material_settlement_cents, type: integer, source: computed, description: "= max(0, min(material_actual_cents, material_normative_cents) - material_allowance_cents)" }
      - { name: sla_miss_count, type: integer, source: computed, description: "Season SLA miss count at computation" }
      - { name: performance_credit_cents, type: integer, source: computed, description: "= min(sla_miss_count * sla_miss_penalty_cents, floor(seasonal_fee_cents * 0.20))" }
      - { name: balance_due_cents, type: integer, source: computed, description: "= overage_cents + material_settlement_cents - performance_credit_cents" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issue (nullable)", constraints: "nullable" }
      - { name: settled_at, type: datetime, source: system, description: "Logical clock at settlement (nullable)", constraints: "nullable" }
      - { name: settled_amount_cents, type: integer, source: system, description: "Amount accepted at settle; must equal balance_due_cents exactly", constraints: "nullable" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: OpsDispatcher
        preconditions:
          - "At least one ContractSite links to this contract (else ERR_CONTRACT_HAS_NO_SITES)"
          - "season_start <= season_end (validated at creation)"
          - "For every linked site: no other contract with status IN {ACTIVE, SUSPENDED} covers the same site with a closed-interval season overlap (ERR_SEASON_WINDOW_OVERLAP)"
        side_effects:
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contracts/{id}/suspend"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "increments Contract.version by 1"
          - "New ServiceVisit creation for this contract is blocked while SUSPENDED (ERR_CONTRACT_NOT_ACTIVE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contracts/{id}/resume"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /contracts/{id}/expire OR system during POST /storm-events/{id}/close-sweep when clock > season_end"
        actor: OpsDispatcher
        preconditions:
          - "Logical clock strictly greater than season_end (ERR_INVALID_STATE otherwise)"
          - "No visits of this contract in execution_status IN {SCHEDULED, IN_PROGRESS, AWAITING_BACKUP} (ERR_CONTRACT_HAS_OPEN_WORK)"
        side_effects:
          - "increments Contract.version by 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /contracts/{id}/expire"
        actor: OpsDispatcher
        preconditions:
          - "Logical clock strictly greater than season_end"
          - "No visits of this contract in execution_status IN {SCHEDULED, IN_PROGRESS, AWAITING_BACKUP} (ERR_CONTRACT_HAS_OPEN_WORK)"
        side_effects:
          - "increments Contract.version by 1"
      - from: EXPIRED
        to: EXPIRED
        trigger: "POST /contracts/{id}/renew — spawns a NEW Contract in DRAFT (this row stays EXPIRED)"
        actor: OpsDispatcher
        preconditions:
          - "No SeasonalTrueUp of this contract in status IN {DRAFT, ISSUED} (ERR_RENEWAL_BLOCKED)"
          - "New season_start must be strictly greater than this contract's season_end"
        side_effects:
          - "Creates renewal Contract: same client_id/contract_type/rates unless overridden in the request; prior_contract_id = this id; status DRAFT"
          - "Sets this.renewed_to_contract_id to the new contract id"
          - "increments Contract.version by 1"
        note: "Renewal is create-with-copy; the old contract remains EXPIRED forever."

  - entity: ContractAmendment
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /amendments/{id}/approve"
        actor: OpsDispatcher
        preconditions:
          - "Parent Contract status is ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "Applies non-null change fields onto Contract (trigger_depth_inches, per_push_rate_cents, sla_miss_penalty_cents, require_photo_verification)"
          - "increments Contract.version by 1"
          - "Completed visits keep their frozen applied_* snapshots (no retroactive repricing)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /amendments/{id}/reject"
        actor: OpsDispatcher
        preconditions: []
        side_effects: []
      - from: PENDING
        to: SUPERSEDED
        trigger: "system — when a newer POST /amendments succeeds against the same contract"
        actor: system
        preconditions: []
        side_effects:
          - "Exactly one PENDING amendment per contract at any time"

  - entity: StormEvent
    initial_state: REPORTED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /storm-events/{id}/verify"
        actor: OpsDispatcher
        preconditions:
          - ">= VERIFICATION_SOURCE_QUORUM distinct source_name values among observations with observed_at inside [window_start, window_end + 6h] closed (ERR_VERIFICATION_QUORUM)"
        side_effects:
          - "verified_accumulation_inches = accumulation of the eligible observation with the latest observed_at; tie -> latest created_at"
          - "verified_at = logical clock; verifying_observation_ids recorded"
          - "CASCADE L1: each COMPLETED visit of this event re-evaluates billing (PENDING -> BILLABLE_CONFIRMED | NON_BILLABLE)"
          - "CASCADE L2: for each flipped visit, owning Contract accumulators recompute (season_billable_push_count, unbilled_billable_cents, season_billable_minutes)"
          - "CASCADE L3: SEASONAL contracts recompute overage_active (count > cap); DRAFT invoices covering this event recompute lines/subtotal/total"
      - from: VERIFIED
        to: CHALLENGED
        trigger: "POST /storm-events/{id}/challenge"
        actor: ClientContact
        preconditions:
          - "Challenging client has >= 1 ContractSite whose Site.region_code == this.region_code (ERR_FORBIDDEN_OWNERSHIP)"
          - "Logical clock <= verified_at + CHALLENGE_WINDOW_HOURS (ERR_CHALLENGE_WINDOW_EXPIRED)"
        side_effects:
          - "challenged_at, challenged_by_client_id, challenge_reason recorded"
          - "Visits in BILLABLE_CONFIRMED under this event revert to PENDING (INVOICED or later visits are untouched; their invoices need the dispute flow)"
          - "Contract accumulators recompute for flipped visits"
      - from: CHALLENGED
        to: VERIFIED
        trigger: "POST /storm-events/{id}/verify (re-verification)"
        actor: OpsDispatcher
        preconditions:
          - ">= VERIFICATION_SOURCE_QUORUM distinct sources among eligible observations (ERR_VERIFICATION_QUORUM)"
          - "At least one eligible observation has created_at strictly greater than challenged_at (ERR_NO_NEW_EVIDENCE)"
        side_effects:
          - "Same L1-L3 cascade as REPORTED -> VERIFIED, using the recomputed latest-observation value"
      - from: VERIFIED
        to: CLOSED
        trigger: "POST /storm-events/{id}/close-sweep"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "closed_at = logical clock"
          - "Visits of this event in SCHEDULED or AWAITING_BACKUP with sla_deadline_at < clock become MISSED (sla_miss=true, billing_status -> NON_BILLABLE, Contract.season_sla_miss_count += 1 each)"
          - "IN_PROGRESS visits are never sweep-marked; they may still complete (late completion sets sla_miss=true)"
          - "Contracts whose season_end < clock and with no open work transition to EXPIRED"
      - from: REPORTED
        to: VOIDED
        trigger: "POST /storm-events/{id}/void"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Visits of this event in SCHEDULED or AWAITING_BACKUP become CANCELLED; COMPLETED visits keep execution but billing_status -> NON_BILLABLE"
      - from: CHALLENGED
        to: VOIDED
        trigger: "POST /storm-events/{id}/void"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Same visit cancellation / NON_BILLABLE side effects as REPORTED -> VOIDED"
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /storm-events/{id}/void"
        actor: PlatformAdmin
        preconditions:
          - "No ISSUED-or-later invoice references this event (ERR_EVENT_LOCKED_BY_INVOICE)"
        side_effects:
          - "Visits BILLABLE_CONFIRMED -> NON_BILLABLE; DRAFT invoices referencing this event -> VOIDED; contract accumulators recompute"

  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED, VOIDED]
    transitions:
      # ---- execution dimension ----
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /visits/{id}/start"
        actor: CrewLead
        preconditions:
          - "CrewLead allowed only when assigned_subcontractor_id is null; Subcontractor caller must equal assigned_subcontractor_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "actual_start_at = logical clock"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: CrewLead
        preconditions:
          - "Same crew/subcontractor ownership rule as /start (ERR_FORBIDDEN_OWNERSHIP)"
          - "When contract.require_photo_verification: >= 1 AFTER photo of this visit with review_status=ACCEPTED (ERR_PHOTO_REQUIRED)"
        side_effects:
          - "completed_at = logical clock; completed_by_user_id recorded"
          - "applied_trigger_depth_inches / applied_per_push_rate_cents snapshots frozen from effective values"
          - "sla_miss = (completed_at > sla_deadline_at); when true, Contract.season_sla_miss_count += 1"
          - "When the storm event is already VERIFIED or CLOSED: billing evaluates immediately (PENDING -> BILLABLE_CONFIRMED | NON_BILLABLE) with the L2/L3 cascade"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: OpsDispatcher
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /visits/{id}/void"
        actor: OpsDispatcher
        preconditions:
          - "billing_status NOT IN {INVOICED, DISPUTED, SETTLED, WRITTEN_OFF} (ERR_INVALID_STATE — invoice/dispute flow must resolve first)"
        side_effects:
          - "billing_status -> NON_BILLABLE"
          - "All RECORDED MaterialApplication rows of this visit -> VOIDED (material_cost_cents -> 0)"
          - "Compensation: Contract.season_billable_push_count / season_billable_minutes / unbilled_billable_cents recompute; if sla_miss was true, season_sla_miss_count -= 1"
      - from: SCHEDULED
        to: AWAITING_BACKUP
        trigger: "system — cascade when the covering CoverageAssignment transitions ACTIVE -> FAILED"
        actor: system
        preconditions:
          - "Only visits with assigned_subcontractor_id == failed subcontractor AND storm_event_id == failed assignment's event"
        side_effects:
          - "assigned_subcontractor_id -> null"
      - from: AWAITING_BACKUP
        to: SCHEDULED
        trigger: "POST /visits/{id}/reassign (backup selected)"
        actor: OpsDispatcher
        preconditions:
          - "Backup selector pool non-empty (else ERR_NO_BACKUP_AVAILABLE and the visit stays AWAITING_BACKUP)"
        side_effects:
          - "assigned_subcontractor_id = selected backup; grace_extended = true; sla_deadline_at += BACKUP_GRACE_MINUTES"
          - "A new CoverageAssignment for (storm_event_id, contract_id, backup) is created directly in ACTIVE status spanning the event window"
      - from: SCHEDULED
        to: MISSED
        trigger: "system — during POST /storm-events/{id}/close-sweep when sla_deadline_at < clock"
        actor: system
        preconditions: []
        side_effects:
          - "sla_miss = true; billing_status -> NON_BILLABLE; Contract.season_sla_miss_count += 1"
      - from: AWAITING_BACKUP
        to: MISSED
        trigger: "system — during POST /storm-events/{id}/close-sweep when sla_deadline_at < clock"
        actor: system
        preconditions: []
        side_effects:
          - "sla_miss = true; billing_status -> NON_BILLABLE; Contract.season_sla_miss_count += 1"
      # ---- billing dimension (independent of execution until coupled rules fire) ----
      - from: PENDING
        to: BILLABLE_CONFIRMED
        trigger: "system — storm verification cascade, or /complete when the event is already VERIFIED"
        actor: system
        preconditions:
          - "execution_status == COMPLETED"
          - "verified_accumulation_inches >= applied/effective trigger depth (>= is inclusive)"
        side_effects:
          - "billable_amount_cents computed per contract type; Contract accumulators recompute (L2); SEASONAL overage_active recompute (L3)"
      - from: PENDING
        to: NON_BILLABLE
        trigger: "system — verification cascade when trigger not met or execution terminal non-COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "Contract accumulators recompute"
      - from: NON_BILLABLE
        to: BILLABLE_CONFIRMED
        trigger: "system — re-verification after a challenge when the new verified accumulation meets trigger"
        actor: system
        preconditions:
          - "execution_status == COMPLETED"
        side_effects:
          - "billable_amount_cents computed; Contract accumulators recompute"
      - from: BILLABLE_CONFIRMED
        to: PENDING
        trigger: "system — storm event challenged"
        actor: system
        preconditions: []
        side_effects:
          - "Contract accumulators recompute"
      - from: BILLABLE_CONFIRMED
        to: INVOICED
        trigger: "POST /invoices/{id}/issue (visit is a line of that invoice)"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "Contract.unbilled_billable_cents decreases; season_billed_cents increases by invoice total"
      - from: INVOICED
        to: DISPUTED
        trigger: "POST /disputes (visit_id = this visit)"
        actor: ClientContact
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /disputes/{id}/resolve with outcome UPHELD or ADJUSTED"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "ADJUSTED also credits the invoice (see Dispute machine)"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /disputes/{id}/resolve with outcome REMOVED"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "Invoice credited by the visit's full lines; Contract.season_billable_push_count -= 1 and accumulators recompute"

  - entity: MaterialApplication
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /materials/{id}/void"
        actor: CrewLead
        preconditions:
          - "Parent visit billing_status NOT IN {INVOICED, DISPUTED, SETTLED, WRITTEN_OFF} (ERR_INVALID_STATE)"
        side_effects:
          - "Visit.material_cost_cents recomputes (line excluded); DRAFT invoice lines recompute"

  - entity: ServicePhoto
    initial_state: UPLOADED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: UPLOADED
        to: ACCEPTED
        trigger: "POST /photos/{id}/accept"
        actor: OpsDispatcher
        preconditions:
          - "If the parent visit is COMPLETED: logical clock <= visit.completed_at + PHOTO_ACCEPT_WINDOW_MINUTES (inclusive; ERR_PHOTO_WINDOW_EXPIRED)"
        side_effects:
          - "reviewed_by_user_id recorded"
      - from: UPLOADED
        to: REJECTED
        trigger: "POST /photos/{id}/reject"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "reviewed_by_user_id recorded"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: OpsDispatcher
        preconditions:
          - ">= 1 line (ERR_INVOICE_EMPTY)"
          - "Contract status ACTIVE, or EXPIRED with clock <= season_end + POST_SEASON_BILLING_DAYS (ERR_INVALID_STATE)"
          - "Client.credit_exposure_cents + total_cents <= Client.credit_limit_cents (ERR_CLIENT_CREDIT_EXCEEDED)"
        side_effects:
          - "Lines frozen (further visit changes do not mutate this invoice)"
          - "Each line visit: billing_status BILLABLE_CONFIRMED -> INVOICED"
          - "issued_at / issued_by_user_id recorded; Contract.season_billed_cents += total_cents; Client.credit_exposure_cents += total_cents"
          - "increments Contract.version by 1"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/pay with amount_cents < total_cents - paid_cents"
        actor: OpsDispatcher
        preconditions:
          - "amount_cents > 0 and amount_cents <= total_cents - paid_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_cents += amount_cents; Client.credit_exposure_cents -= amount_cents"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/pay with amount_cents < remaining"
        actor: OpsDispatcher
        preconditions:
          - "amount_cents > 0 and amount_cents <= remaining (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_cents += amount_cents; Client.credit_exposure_cents -= amount_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay with amount_cents == total_cents - paid_cents"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "paid_cents = total_cents; Client.credit_exposure_cents -= amount_cents"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{id}/pay with amount_cents == remaining"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "paid_cents = total_cents; Client.credit_exposure_cents -= amount_cents"
      - from: ISSUED
        to: PARTIALLY_CREDITED
        trigger: "system — a Dispute on one of its lines resolves ADJUSTED or REMOVED"
        actor: system
        preconditions: []
        side_effects:
          - "credit_cents += resolution_credit_cents; total_cents recomputed; Contract.season_billed_cents and Client.credit_exposure_cents recompute"
      - from: PARTIALLY_CREDITED
        to: PAID
        trigger: "POST /invoices/{id}/pay with amount_cents == remaining"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "paid_cents = total_cents; Client.credit_exposure_cents -= amount_cents"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /invoices/{id}/void OR system when its storm event is VOIDED"
        actor: OpsDispatcher
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: OpsDispatcher
        preconditions:
          - "paid_cents == 0 (ERR_INVOICE_HAS_PAYMENTS)"
          - "No dispute of this invoice in status IN {OPEN, EVIDENCE_REVIEW} (ERR_INVALID_STATE)"
        side_effects:
          - "Compensation: Contract.season_billed_cents -= total_cents; Client.credit_exposure_cents -= total_cents"
          - "Line visits return INVOICED -> BILLABLE_CONFIRMED"
          - "increments Contract.version by 1"
      - from: PARTIALLY_PAID
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: OpsDispatcher
        preconditions:
          - "paid_cents == 0 (ERR_INVOICE_HAS_PAYMENTS — reachable because PARTIALLY_PAID implies paid_cents > 0)"
          - "No dispute of this invoice in status IN {OPEN, EVIDENCE_REVIEW} (ERR_INVALID_STATE)"
        side_effects:
          - "Same compensation as ISSUED -> VOIDED (unreachable in practice; declared so the fiscal guard owns the rejection)"
      - from: PARTIALLY_CREDITED
        to: VOIDED
        trigger: "POST /invoices/{id}/void"
        actor: OpsDispatcher
        preconditions:
          - "paid_cents == 0 (ERR_INVOICE_HAS_PAYMENTS)"
          - "No dispute of this invoice in status IN {OPEN, EVIDENCE_REVIEW} (ERR_INVALID_STATE)"
        side_effects:
          - "Same compensation as ISSUED -> VOIDED"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_ADJUSTED, RESOLVED_REMOVED]
    transitions:
      - from: OPEN
        to: EVIDENCE_REVIEW
        trigger: "POST /disputes/{id}/submit-evidence"
        actor: ClientContact
        preconditions:
          - "At least one of evidence_note or photo_ids provided (ERR_EVIDENCE_REQUIRED)"
        side_effects:
          - "Evidence appended to evidence_items"
      - from: EVIDENCE_REVIEW
        to: OPEN
        trigger: "POST /disputes/{id}/request-evidence"
        actor: OpsDispatcher
        preconditions: []
        side_effects: []
      - from: EVIDENCE_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve outcome=UPHELD"
        actor: OpsDispatcher
        preconditions:
          - "Segregation of duties: resolver X-User-ID != invoice.issued_by_user_id AND != visit.completed_by_user_id (ERR_DISPUTE_SEGREGATION)"
        side_effects:
          - "Visit billing_status DISPUTED -> SETTLED; resolution_credit_cents = 0"
      - from: EVIDENCE_REVIEW
        to: RESOLVED_ADJUSTED
        trigger: "POST /disputes/{id}/resolve outcome=ADJUSTED"
        actor: OpsDispatcher
        preconditions:
          - "Segregation of duties (ERR_DISPUTE_SEGREGATION)"
          - "credit_cents > 0 and credit_cents <= the visit's combined line amount on this invoice (ERR_INVALID_REQUEST)"
        side_effects:
          - "Invoice.credit_cents += credit_cents -> invoice becomes PARTIALLY_CREDITED; totals and exposure recompute"
          - "Visit billing_status DISPUTED -> SETTLED"
      - from: EVIDENCE_REVIEW
        to: RESOLVED_REMOVED
        trigger: "POST /disputes/{id}/resolve outcome=REMOVED"
        actor: OpsDispatcher
        preconditions:
          - "Segregation of duties (ERR_DISPUTE_SEGREGATION)"
        side_effects:
          - "Invoice credited by ALL lines of this visit (service + material); invoice becomes PARTIALLY_CREDITED"
          - "Visit billing_status DISPUTED -> WRITTEN_OFF; Contract.season_billable_push_count -= 1; accumulators recompute"

  - entity: SlipFallClaim
    initial_state: FILED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: FILED
        to: DOCUMENTATION_REVIEW
        trigger: "POST /slip-fall-claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions:
          - "Some contract with status IN {ACTIVE, SUSPENDED, EXPIRED} covers this site with season_start <= incident_at <= season_end (ERR_CLAIM_WINDOW_EXPIRED)"
        side_effects:
          - "documentation_contract_id resolved; storm_event_id linked when a storm window contains incident_at (else null)"
          - "score_standard and score_strict computed; documentation_completeness_score selected by severity"
      - from: DOCUMENTATION_REVIEW
        to: DOCUMENTED
        trigger: "POST /slip-fall-claims/{id}/document"
        actor: ClaimsAdjuster
        preconditions:
          - "documentation_completeness_score >= DOCUMENTATION_MIN_SCORE (ERR_DOCUMENTATION_INCOMPLETE)"
        side_effects: []
      - from: DOCUMENTATION_REVIEW
        to: CLOSED
        trigger: "POST /slip-fall-claims/{id}/close outcome=CLOSED"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: DOCUMENTED
        to: CLOSED
        trigger: "POST /slip-fall-claims/{id}/close outcome=CLOSED"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /slip-fall-claims/{id}/close outcome=WITHDRAWN"
        actor: ClientContact
        preconditions:
          - "Caller client owns the claim's site (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: DOCUMENTATION_REVIEW
        to: WITHDRAWN
        trigger: "POST /slip-fall-claims/{id}/close outcome=WITHDRAWN"
        actor: ClientContact
        preconditions:
          - "Caller client owns the claim's site (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []

  - entity: Subcontractor
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /subcontractors/{id}/approve"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /subcontractors/{id}/suspend OR system auto-suspend after a coverage failure"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "ACTIVE coverage assignments are unaffected; new activation blocked (ERR_SUBCONTRACTOR_NOT_APPROVED)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /subcontractors/{id}/approve"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: CoverageAssignment
    initial_state: CREATED
    terminal_states: [RELEASED, FAILED, CANCELLED]
    transitions:
      - from: CREATED
        to: ACTIVE
        trigger: "POST /coverage-assignments/{id}/activate"
        actor: Subcontractor
        preconditions:
          - "Caller X-User-ID == subcontractor_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Subcontractor.status == APPROVED (ERR_SUBCONTRACTOR_NOT_APPROVED)"
          - "No other CREATED/ACTIVE assignment for the same subcontractor whose [coverage_start, coverage_end) half-open interval intersects this one (ERR_COVERAGE_OVERLAP)"
        side_effects:
          - "Subcontractor.active_assignment_count += 1"
      - from: CREATED
        to: CANCELLED
        trigger: "POST /coverage-assignments/{id}/release"
        actor: OpsDispatcher
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /coverage-assignments/{id}/release"
        actor: OpsDispatcher
        preconditions:
          - "Storm event status == CLOSED, or every visit assigned via this coverage is in a terminal execution state (ERR_INVALID_STATE)"
        side_effects:
          - "Subcontractor.active_assignment_count -= 1; assignments_released_count += 1; reliability_score recomputed"
      - from: ACTIVE
        to: FAILED
        trigger: "POST /coverage-assignments/{id}/fail (equipment failure)"
        actor: Subcontractor
        preconditions:
          - "Caller X-User-ID == subcontractor_id, or caller is OpsDispatcher (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "failure_reason recorded; Subcontractor.active_assignment_count -= 1; assignments_failed_count += 1"
          - "CASCADE L1: SCHEDULED visits assigned via this coverage (this subcontractor + this event) -> AWAITING_BACKUP with assigned_subcontractor_id nulled"
          - "CASCADE L2: reliability_score recomputed"
          - "CASCADE L3: when released+failed >= RELIABILITY_MIN_ASSIGNMENTS and reliability_score < RELIABILITY_SUSPEND_FLOOR, Subcontractor.status -> SUSPENDED"

  - entity: SeasonalTrueUp
    initial_state: DRAFT
    terminal_states: [SETTLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /true-ups/{id}/issue"
        actor: OpsDispatcher
        preconditions: []
        side_effects:
          - "Computed component fields freeze; issued_at recorded"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /true-ups/{id}/settle"
        actor: OpsDispatcher
        preconditions:
          - "settled_amount_cents == balance_due_cents exactly (ERR_SETTLEMENT_MISMATCH)"
        side_effects:
          - "settled_at recorded; parent contract becomes eligible for renewal"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system — a newer POST /true-ups succeeds against the same contract"
        actor: system
        preconditions: []
        side_effects: []
        note: "DRAFT true-ups exit only via supersede; no client-visible discard endpoint."

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /amendments"
    occ_field: expected_contract_version
    description: |
      Creating a ContractAmendment against a Contract whose version has
      advanced since the client last observed it is rejected. A successful
      amendment creation supersedes the previously PENDING amendment, so a
      stale writer would silently supersede an amendment it never saw.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: trueup-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /true-ups"
    occ_field: expected_contract_version
    description: |
      Creating a SeasonalTrueUp against a Contract whose version has advanced
      since the client last observed it is rejected. A successful creation
      supersedes the previously DRAFT true-up, so a stale writer would discard
      computed components it never saw.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: verified_accumulation_inches
    trigger: "POST /storm-events/{id}/verify (initial verification and every re-verification)"
    algorithm: aggregation
    formula: |
      eligible = observations o where o.storm_event_id == event.id
                 AND window_start <= o.observed_at <= window_end + 6h   (closed both ends)
      require count(distinct o.source_name over eligible) >= 2          (ERR_VERIFICATION_QUORUM)
      verified = argmax over eligible ordered by (observed_at DESC, created_at DESC)
      verified_accumulation_inches = verified.accumulation_inches       (latest reading wins)
    input_set: "WeatherObservation rows of this event inside the closed eligibility window; late-created rows only affect re-verification (created_at > challenged_at gate)"
    constants: { QUORUM: 2, GRACE_HOURS: 6 }
    precision: "2 decimal places, round_half_up (inputs are pre-rounded 2dp)"

  - name: event_billing_projection
    trigger: "GET /contracts/{id}/billing-preview"
    algorithm: forward_looking
    formula: |
      For each storm event with >= 1 visit under this contract:
        PROVISIONAL billable depth: REPORTED/CHALLENGED -> reported_accumulation_inches;
                                    VERIFIED/CLOSED -> verified_accumulation_inches; VOIDED -> excluded
        FINAL billable depth:       VERIFIED/CLOSED -> verified_accumulation_inches; all others excluded
      push billable iff depth >= effective_trigger_depth_inches AND visit execution_status == COMPLETED
      *_billable_cents = sum over billable visits of (effective_per_push_rate_cents for PER_PUSH;
                         hourly_visit_charge for HOURLY; 0 for SEASONAL) + material_cost_cents
    input_set: "All non-CANCELLED visits whose contract_id == this contract; events grouped per visit"
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "billing-preview provisional_* fields; optimistic in-season view"
        difference: "REPORTED/CHALLENGED events count at their reported accumulation"
      - name: FINAL
        when: "billing-preview final_* fields; mirrors what POST /invoices may bill"
        difference: "Only VERIFIED/CLOSED events count; everything else excluded"

  - name: visit_billing_evaluation
    trigger: "storm verification cascade; visit completion against an already-VERIFIED event; re-verification"
    algorithm: threshold
    formula: |
      billable = (execution_status == COMPLETED)
                 AND verified_accumulation_inches >= effective_trigger_depth   # >= is INCLUSIVE
      effective_trigger = visit.applied_trigger_depth_inches if set else contract_site.effective_trigger_depth_inches
      if billable: billable_amount_cents = per contract type (see per_push / hourly rules; SEASONAL -> 0)
      else: billing_status -> NON_BILLABLE
    input_set: "The single visit under evaluation"
    precision: "integer cents"

  - name: per_push_visit_charge
    trigger: "visit billing confirmation for PER_PUSH contracts"
    algorithm: aggregation
    formula: |
      billable_amount_cents = visit.applied_per_push_rate_cents   (frozen at completion)
    input_set: "Single visit"
    precision: "integer cents"

  - name: hourly_visit_charge
    trigger: "visit billing confirmation for HOURLY contracts"
    algorithm: tiered_pricing
    formula: |
      billable_minutes = ceil((completed_at - actual_start_at) / 6 minutes) * 6
      # Tier allocation is CHRONOLOGICAL across the season, ordered by
      # (actual_start_at ASC, created_at ASC) — never by creation or completion order:
      prior_minutes = sum of billable_minutes over other billable visits of this contract
                      with an earlier chronological key
      tier1_minutes = max(0, min(hourly_tier_threshold_minutes - prior_minutes, billable_minutes))
      tier2_minutes = billable_minutes - tier1_minutes
      base_cents    = round_half_up(tier1_minutes * hourly_rate_cents / 60)
                    + round_half_up(tier2_minutes * hourly_tier2_rate_cents / 60)
      night         = actual_start_at hour (UTC) IN {22,23,0,1,2,3,4,5}
      billable_amount_cents = round_half_up(base_cents * (1 + night_premium_pct)) if night else base_cents
    input_set: "All billable visits of the contract (tier ordering); the visit under evaluation"
    constants: { BILLING_INCREMENT_MINUTES: 6 }
    precision: "integer cents; per-tier round_half_up before summing; premium rounds last"

  - name: material_line_cost
    trigger: "MaterialApplication creation; visit.material_cost_cents recompute on log/void"
    algorithm: aggregation
    formula: |
      rate_snapshot  = contract rate for material_type at log time (salt/blend/brine rate field)
      line_cost_cents = round_half_up(quantity_lbs * rate_snapshot)          # ROUND PER LINE FIRST
      visit.material_cost_cents = sum(line_cost_cents over RECORDED rows)    # THEN SUM
      # Pinned order: round-per-line-then-sum. Sum-then-round is a different
      # (incorrect) result, e.g. 3 x 1.05 lbs @ 35c/lb: 3*round(36.75)=111 vs round(110.25)=110.
    input_set: "RECORDED MaterialApplication rows of the visit"
    precision: "integer cents, round_half_up per line before summation"

  - name: material_reimbursement_seasonal
    trigger: "seasonal true-up creation / true-up-preview"
    algorithm: aggregation
    formula: |
      ACTUAL    = sum(line_cost_cents over all RECORDED applications of the contract's season visits)
      NORMATIVE = sum over RECORDED applications of
                  round_half_up(site.pavement_area_sqft * NORMATIVE_RATE[material_type] * rate_snapshot)
      allowance_cents = sum over contract sites of round_half_up(salt_included_lbs * salt_rate_per_lb_cents)
      material_settlement_cents = max(0, min(ACTUAL, NORMATIVE) - allowance_cents)
    input_set: "All RECORDED MaterialApplication rows of visits whose contract_id == this contract"
    constants:
      NORMATIVE_RATE_ROCK_SALT: 0.0023      # lbs per sqft
      NORMATIVE_RATE_ICE_MELT_BLEND: 0.0015
      NORMATIVE_RATE_LIQUID_BRINE: 0.0040
    precision: "integer cents, round_half_up per normative line and per allowance site"
    variants:
      - name: ACTUAL
        when: "logged quantities dominate (small sites / light application)"
        difference: "Sum of logged line costs"
      - name: AREA_NORMATIVE
        when: "normative cap dominates (over-application)"
        difference: "Area-derived cap per application; seasonal settlement bills min(ACTUAL, NORMATIVE)"

  - name: seasonal_true_up_settlement
    trigger: "POST /true-ups (FINAL) and GET /contracts/{id}/true-up-preview (PROJECTED)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED (the dependency chain looks circular; it is not):
      # 1. billable set -> 2. overage -> 3. misses -> 4. credit -> 5. materials -> 6. balance.
      1. billable_set = visits with billing_status IN {BILLABLE_CONFIRMED, INVOICED, DISPUTED, SETTLED}
         billable_push_count = |billable_set|
      2. overage_pushes = max(0, billable_push_count - seasonal_push_cap)
         overage_cents  = overage_pushes * seasonal_overage_rate_cents
      3. sla_miss_count = contract.season_sla_miss_count
      4. performance_credit_cents = min(sla_miss_count * sla_miss_penalty_cents,
                                        floor(seasonal_fee_cents * PERF_CREDIT_CAP_PCT))
      5. material_settlement_cents per material_reimbursement_seasonal
      6. balance_due_cents = overage_cents + material_settlement_cents - performance_credit_cents
    input_set: "Season visits of the contract; FINAL uses only VERIFIED/CLOSED events"
    constants: { PERF_CREDIT_CAP_PCT: 0.20 }
    precision: "integer cents"
    variants:
      - name: PROJECTED
        when: "true-up-preview during the season"
        difference: "Includes REPORTED/CHALLENGED events at reported accumulation (optimistic)"
      - name: FINAL
        when: "SeasonalTrueUp creation (contract must be EXPIRED)"
        difference: "Only VERIFIED/CLOSED events count"

  - name: invoice_total_cents
    trigger: "POST /invoices (snapshot); live recompute while DRAFT; frozen at issue"
    algorithm: aggregation
    formula: |
      eligible visits: contract_id matches AND billing_status == BILLABLE_CONFIRMED
        AND (kind=EVENT  -> visit.storm_event_id == invoice.storm_event_id)
        AND (kind=PERIOD -> period_start <= visit.completed_at < period_end)   # HALF-OPEN
      lines = per visit: SERVICE line (billable_amount_cents)
              + MATERIAL line (material_cost_cents) when > 0
      subtotal_cents = sum(lines); total_cents = subtotal_cents - credit_cents
      # DRAFT invoices recompute on every visit billing change; ISSUED invoices freeze lines.
    input_set: "BILLABLE_CONFIRMED visits per the kind filter above"
    precision: "integer cents"

  - name: sla_deadline
    trigger: "visit creation; backup reassignment; completion; close-sweep"
    algorithm: threshold
    formula: |
      sla_deadline_at = storm_event.window_end + contract_site.completion_target_minutes
      if grace_extended: sla_deadline_at += BACKUP_GRACE_MINUTES (120)
      on completion: sla_miss = (completed_at > sla_deadline_at)   # strict > : completing exactly AT the deadline is ON TIME
      at sweep: visits with sla_deadline_at < clock in {SCHEDULED, AWAITING_BACKUP} -> MISSED
    input_set: "Single visit"
    constants: { BACKUP_GRACE_MINUTES: 120 }
    precision: "second-precision datetimes"

  - name: visit_site_gap_rule
    trigger: "POST /visits"
    algorithm: interval_merge
    formula: |
      For the same site_id, a new visit conflicts with an existing non-CANCELLED visit unless:
        new.scheduled_start >= existing.scheduled_end + REAPPLY_GAP_MINUTES   (buffer semantics)
        OR new.scheduled_end + REAPPLY_GAP_MINUTES <= existing.scheduled_start
      Equality is allowed on both sides (gap of exactly 90 minutes is legal).
    input_set: "Non-CANCELLED visits of the same site regardless of contract"
    constants: { REAPPLY_GAP_MINUTES: 90 }
    precision: "second-precision datetimes"

  - name: reliability_score
    trigger: "CoverageAssignment -> RELEASED or FAILED"
    algorithm: weighted_scoring
    formula: |
      reliability_score = floor(100 * assignments_released_count
                                / max(1, assignments_released_count + assignments_failed_count))
      auto-suspend when (released + failed) >= RELIABILITY_MIN_ASSIGNMENTS
                    AND reliability_score < RELIABILITY_SUSPEND_FLOOR
    input_set: "All CoverageAssignment rows of the subcontractor"
    constants: { FLOOR: 70, MIN_ASSIGNMENTS: 3 }
    precision: "integer score 0-100"

  - name: documentation_completeness_score
    trigger: "SlipFallClaim FILED -> DOCUMENTATION_REVIEW"
    algorithm: weighted_scoring
    formula: |
      indicators over the linked storm event's visits at the claim site:
        has_accepted_before_photo, has_accepted_after_photo, material_logged,
        response_within_target (no sla_miss among those visits), weather_verified (event VERIFIED/CLOSED)
      score = 100 * sum(w_i * indicator_i) / sum(w_i)   [weights sum to 100 -> score is the sum]
      selection: severity == INJURY_REPORTED -> STRICT else STANDARD
    input_set: "Visits of the site whose storm event window contains incident_at, their photos/materials, the event"
    constants:
      W_STANDARD: { before: 15, after: 25, material: 20, timeliness: 20, weather: 20 }
      W_STRICT:   { before: 30, after: 40, material: 10, timeliness: 10, weather: 10 }
    precision: "integer 0-100"
    variants:
      - name: STANDARD
        when: "severity PROPERTY_DAMAGE or NEAR_MISS"
        difference: "Balanced weights"
      - name: STRICT
        when: "severity INJURY_REPORTED"
        difference: "Photo evidence weighted 70/100; a claim without photos cannot pass"

  - name: backup_subcontractor_selection
    trigger: "POST /visits/{id}/reassign without preferred_subcontractor_id"
    algorithm: topological
    formula: |
      eligible = subcontractors s where s.status == APPROVED
        AND (site.requires_loader == false OR s.has_loader == true)
        AND no CREATED/ACTIVE CoverageAssignment of s overlaps [event.window_start, event.window_end) half-open
        AND s has no FAILED CoverageAssignment for this storm event (retry exclusion)
      ranking: fewest CREATED/ACTIVE assignments for this event ASC; tie -> s.created_at ASC
      fallback: empty pool -> ERR_NO_BACKUP_AVAILABLE, visit stays AWAITING_BACKUP
      preferred_subcontractor_id given: must satisfy the same eligibility (else ERR_CAPABILITY_MISMATCH
        or ERR_SUBCONTRACTOR_NOT_APPROVED or ERR_COVERAGE_OVERLAP)
    input_set: "All Subcontractor rows"
    precision: "deterministic selector; no random inputs; never ordered by id"

  - name: route_plan_ordering
    trigger: "GET /storm-events/{id}/route-plan?contract_id=..."
    algorithm: topological
    formula: |
      candidates = visits of (event, contract) with execution_status IN
                   {SCHEDULED, IN_PROGRESS, AWAITING_BACKUP}
      order by contract_site.priority_sequence ASC (unique per contract, so no tie is possible);
      route_order assigned 1..N in that order
    input_set: "Visits of the event restricted to the given contract"
    precision: "deterministic"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a known role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body entity ids resolve, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Entity-backed identity ownership: ClientContact acts only on its own client's sites/contracts/invoices/claims; Subcontractor acts only on its own coverage assignments and assigned visits"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 5
    category: state
    check: "Target resource machine state allows the transition; terminal states reject every transition"
    error_id: "ERR_INVALID_STATE / ERR_ALREADY_TERMINAL"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_contract_version equals the contract's current version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /amendments, POST /true-ups"
  - priority: 7
    category: business_safety
    check: "Segregation of duties on dispute resolve: resolver != invoice issuer AND != visit completer"
    error_id: ERR_DISPUTE_SEGREGATION
    http_status: 403
    applies_to: "POST /disputes/{id}/resolve"
  - priority: 8
    category: business_safety
    check: "Claim documentation_completeness_score >= 60 before DOCUMENTED"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /slip-fall-claims/{id}/document"
  - priority: 9
    category: business_constraint
    check: "Schema sanity: required fields by contract_type, enum membership, window_end > window_start, end > start, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 10
    category: business_constraint
    check: "Material quantity_lbs > 0"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /materials"
  - priority: 11
    category: business_constraint
    check: "Subcontractor capabilities cover every loader-requiring site of the assignment contract (or of the preferred backup's visit site)"
    error_id: ERR_CAPABILITY_MISMATCH
    http_status: 422
    applies_to: "POST /coverage-assignments, POST /visits/{id}/reassign"
  - priority: 12
    category: business_constraint
    check: "Uniqueness: priority_sequence unique per contract; one non-VOIDED EVENT invoice per (contract, event); one non-VOIDED PERIOD invoice per (contract, period_start); one non-terminal coverage per (subcontractor, event, contract)"
    error_id: "ERR_PRIORITY_SEQUENCE_CONFLICT / ERR_DUPLICATE_INVOICE / ERR_DUPLICATE_COVERAGE"
    http_status: 409
    applies_to: "POST /contract-sites, POST /invoices, POST /coverage-assignments"
  - priority: 13
    category: business_constraint
    check: "Contract-type conditional operations: EVENT invoice only for PER_PUSH; PERIOD invoice only for HOURLY; true-up only for SEASONAL"
    error_id: ERR_CONTRACT_TYPE_FORBIDS
    http_status: 409
    applies_to: "POST /invoices, POST /true-ups"
  - priority: 14
    category: business_constraint
    check: "Aggregate content rules: invoice issue needs >= 1 line; dispute submit-evidence needs note or photo_ids; dispute visit must be a line of the invoice; contract activation needs >= 1 linked site; amendment needs >= 1 change field"
    error_id: "ERR_INVOICE_EMPTY / ERR_EVIDENCE_REQUIRED / ERR_DISPUTE_LINE_NOT_FOUND / ERR_CONTRACT_HAS_NO_SITES / ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "POST /invoices/{id}/issue, POST /disputes/{id}/submit-evidence, POST /disputes, POST /contracts/{id}/activate, POST /amendments"
  - priority: 15
    category: business_temporal
    check: "Contract season overlap per site: two contracts with status IN {ACTIVE, SUSPENDED} may not cover the same site over intersecting CLOSED season intervals (touching endpoints conflict). Checked at link and at activation."
    error_id: ERR_SEASON_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /contract-sites, POST /contracts/{id}/activate"
  - priority: 16
    category: business_temporal
    check: "Coverage overlap per subcontractor: CREATED/ACTIVE assignments of one subcontractor may not overlap under HALF-OPEN [start, end) semantics (back-to-back adjacency is legal)"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /coverage-assignments, POST /coverage-assignments/{id}/activate"
  - priority: 17
    category: business_temporal
    check: "Same-site re-service buffer: >= 90 minutes between consecutive visits at one site (gap of exactly 90 is legal)"
    error_id: ERR_VISIT_GAP_CONFLICT
    http_status: 409
    applies_to: "POST /visits"
  - priority: 18
    category: business_temporal
    check: "Photo review window: AFTER photo acceptable while clock <= visit.completed_at + 360 min (inclusive) once the visit is COMPLETED"
    error_id: ERR_PHOTO_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /photos/{id}/accept"
  - priority: 19
    category: business_temporal
    check: "Challenge window: clock <= verified_at + 48h (inclusive); amendment effective_from inside (season_start, season_end]; claim incident inside a covered season; observation observed_at inside [window_start, window_end + 6h] closed"
    error_id: "ERR_CHALLENGE_WINDOW_EXPIRED / ERR_AMENDMENT_WINDOW_INVALID / ERR_CLAIM_WINDOW_EXPIRED / ERR_OBSERVATION_OUT_OF_WINDOW"
    http_status: 422
    applies_to: "POST /storm-events/{id}/challenge, POST /amendments, POST /slip-fall-claims + review, POST /observations"
  - priority: 20
    category: business_referential
    check: "Cross-entity state gates: EVENT invoice generation needs its storm event VERIFIED (ERR_EVENT_NOT_VERIFIED); coverage activation needs sub APPROVED (ERR_SUBCONTRACTOR_NOT_APPROVED); visit creation/material/photo/complete need contract ACTIVE (ERR_CONTRACT_NOT_ACTIVE); visit creation needs the storm event in REPORTED/VERIFIED/CHALLENGED and the assigned subcontractor holding ACTIVE coverage for (event, contract) (ERR_INVALID_STATE); true-up creation needs contract EXPIRED (ERR_INVALID_STATE); renewal needs EXPIRED + no open true-up (ERR_RENEWAL_BLOCKED); event void blocked by issued invoice (ERR_EVENT_LOCKED_BY_INVOICE); backup pool empty (ERR_NO_BACKUP_AVAILABLE); completion photo gate (ERR_PHOTO_REQUIRED); re-verification needs fresh observation (ERR_NO_NEW_EVIDENCE); expire blocked by open work (ERR_CONTRACT_HAS_OPEN_WORK)"
    error_id: "ERR_EVENT_NOT_VERIFIED / ERR_SUBCONTRACTOR_NOT_APPROVED / ERR_CONTRACT_NOT_ACTIVE / ERR_RENEWAL_BLOCKED / ERR_EVENT_LOCKED_BY_INVOICE / ERR_NO_BACKUP_AVAILABLE / ERR_PHOTO_REQUIRED / ERR_NO_NEW_EVIDENCE / ERR_CONTRACT_HAS_OPEN_WORK"
    http_status: 409
    applies_to: "cross-entity gated endpoints"
  - priority: 21
    category: business_fiscal
    check: "Fiscal gates: issue requires client exposure + total <= credit_limit; pay amount <= remaining (and > 0); invoice void requires paid_cents == 0; true-up settle requires exact balance match"
    error_id: "ERR_CLIENT_CREDIT_EXCEEDED / ERR_OVERPAYMENT / ERR_INVOICE_HAS_PAYMENTS / ERR_SETTLEMENT_MISMATCH"
    http_status: 422
    applies_to: "POST /invoices/{id}/issue, POST /invoices/{id}/pay, POST /invoices/{id}/void, POST /true-ups/{id}/settle"

# =============================================================================
# 1.5 API Endpoint Table (flat: creation carries FKs in the body)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z (fixed startup default; never wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All subsequent server-stamped timestamps use this logical time"]

  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Onboard a property-manager client"
    roles: [OpsDispatcher]
    code: 201
    input: [name, credit_limit_cents]
    output: Client
    side_effects: ["credit_exposure_cents = 0"]
  - method: GET
    path: "/clients/{id}"
    description: "Get a client"
    roles: [PlatformAdmin, OpsDispatcher, ClientContact, ClaimsAdjuster]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/clients"
    description: "List clients (paginated)"
    roles: [PlatformAdmin, OpsDispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: "Client[]"
    side_effects: []
  - method: GET
    path: "/clients/{id}/sites"
    description: "List sites of a client (FK reverse reachability for Site.client_id)"
