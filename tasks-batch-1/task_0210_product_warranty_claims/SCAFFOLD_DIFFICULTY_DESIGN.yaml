          A claim still in INTAKE (state violation, priority 4 ERR_INVALID_STATE) with a WEAR_AND_TEAR
          defect (safety violation, priority 7 ERR_DEFECT_NOT_COVERED) returns ERR_INVALID_STATE — the
          state vs business_safety pair resolves to the lower priority number.
