      - name: exception_window_overlap_is_per_category_and_ignores_dead_rows
        grounds:
          - validations[priority=74, ERR_EXCEPTION_WINDOW_OVERLAP]
          - state_machines.ExceptionRequest.SUBMITTED_to_DENIED
          - entities.ExceptionRequest.fields.category
        interval_semantics: closed_date_interval_per_category
        distinguishing_aspect: |
          A third interval convention: CLOSED date intervals with NO buffer, scoped
          per (employee, category), and live only for SUBMITTED, INFO_REQUESTED and
          APPROVED rows. Sharing a single endpoint date is a conflict, abutting the
          next day is not, a different category never conflicts, and denying the
          incumbent retroactively frees the window.
        test_recipe:
          setup:
            - "One OPEN cycle, one team, one ACTIVE employee E-4001 with disability_accommodation_on_file false."
            - "One SUBMITTED CAREGIVING ExceptionRequest for 2026-09-07..2026-09-11 requesting 2 relief days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
