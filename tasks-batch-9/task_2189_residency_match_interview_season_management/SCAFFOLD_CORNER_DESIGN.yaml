      - name: a_second_program_reusing_an_nrmp_program_code_is_rejected
        claim_type: error_condition
        grounds:
          - errors.ERR_DUPLICATE_RESOURCE
          - validations.priority 10
        distinguishing_aspect: >
          nrmp_program_code is unique across all programs, so a create that differs in name, specialty and
          quota is still a duplicate. Uniqueness sits at priority 10 with HTTP 409, below the priority-4
          body-shape band - the body here is entirely well formed.
        test_recipe:
          setup:
            - "one Program with nrmp_program_code 1140140M0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
