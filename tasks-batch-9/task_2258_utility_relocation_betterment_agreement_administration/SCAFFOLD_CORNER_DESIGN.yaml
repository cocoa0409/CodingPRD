      - name: determination_revise_reenters_draft_and_reissues_at_a_new_share
        claim_type: Valid Transition
        grounds: ["state_machines.PriorRightsDetermination", "calculations.prior_rights_state_share"]
        distinguishing_aspect: "The revise edge lands in DRAFT, not back in UNDER_REVIEW, so the determination must be re-submitted before it can be issued; revising claimed_basis from PRIVATE_EASEMENT to UNDOCUMENTED on a PRIVATE_EASEMENT facility recomputes the provisional share from 100 (base 100 + 10 prior occupancy, clamped) to 95 (the -15 unsupported-claim penalty now applies because the claim no longer matches the record), and appeal_round stays 0 because a revision is not an appeal."
        test_recipe:
          setup: ["One conflict resolved as RELOCATE with a DRAFT determination claiming PRIVATE_EASEMENT."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: "$.data.id" } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: "$.data.id", d1_prov_first: "$.data.provisional_state_share_pct", d1_variant: "$.data.evidence_variant" } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/return-for-revision", payload: { revision_note: "No recorded instrument attached; the easement claim is unsupported." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1_returned: "$.data.status" } }
          trigger:
            - { call: "POST /uro/prior-rights/${d1}/revise", payload: { claimed_basis: "UNDOCUMENTED", narrative: "Claim restated as undocumented occupancy after record search failed." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1_after_revise: "$.data.status", d1_prov_second: "$.data.provisional_state_share_pct", d1_appeal_round: "$.data.appeal_round" } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1_final: "$.data.final_state_share_pct" } }
          assert:
            - "${d1_prov_first} == 100 and ${d1_variant} == RECORD_BASIS and ${d1_returned} == RETURNED_FOR_REVISION"
            - "${d1_after_revise} == DRAFT (the revise edge lands in DRAFT, not UNDER_REVIEW)"
            - "${d1_prov_second} == 95 and ${d1_appeal_round} == 0"
            - "${d1_final} == 95 and PriorRightsDetermination.${d1}.status == ISSUED"
            - "UtilityConflict.${c1}.state_share_pct == 95 and status == RESPONSIBILITY_SET"
            - "Project.${p1}.estimated_state_liability_cents == 0 (no relocation plan exists yet, so the conflict contributes nothing)"
            - "PriorRightsDetermination.${d1}.first_issued_by_user_id == adjudicator-1"

