# =============================================================================
# task_1054 — Gift-Card Program & Distribution Platform (B2B)
# SCAFFOLD.yaml — §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys)
# =============================================================================

scenario: |
  Gift-Card Program & Distribution Platform (B2B): merchant & card design/load,
  digital/physical issuance, activation & balance API, reload & B2B bulk/incentive,
  breakage & escheat, fraud & velocity, settlement & interchange, reporting

domain_name: gift-card-platform
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Merchant.version when opening a settlement batch
    - cascading_side_effects        # fraud clawback + expiry breakage propagation
    - dual_variant_calculation      # breakage (estimated vs remittance), settlement (provisional vs final)
    - rate_threshold_triggers       # velocity count/amount, max-balance cap, dormancy

  entity_topology: flat             # peer top-level collections joined by FK fields in bodies + filtered-list GETs
  state_machine_shape: cyclic       # Merchant, CardProgram, GiftCard all have revert cycles; FraudHold branches
  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: segregation_of_duties # opener != confirmer (fraud); opener != finalizer (settlement)
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered merchant name" }
      - { name: settlement_currency, type: string, source: input, default: "USD", description: "ISO currency for settlement payouts" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | SUSPENDED | CLOSED", constraints: "one of PENDING, ACTIVE, SUSPENDED, CLOSED" }
      - { name: unsettled_redemptions_cents, type: integer, source: computed, description: "Sum of POSTED REDEMPTION LedgerEntry amount magnitudes across this merchant's cards whose settlement_batch_id is null" }
      - { name: lifetime_net_payout_cents, type: integer, source: computed, description: "Sum of net_payout_cents over this merchant's FINALIZED settlement batches" }

  - name: CardProgram
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; owning merchant" }
      - { name: name, type: string, source: input, description: "Program / card-design name" }
      - { name: currency, type: string, source: input, default: "USD", description: "Card currency" }
      - { name: breakage_method, type: enum, source: input, default: "REMITTANCE", description: "ESTIMATED | REMITTANCE — how unredeemed value is recognized", constraints: "one of ESTIMATED, REMITTANCE" }
      - { name: expiry_months, type: integer, source: input, default: 12, description: "Months from activation until a card expires", constraints: ">= 1" }
      - { name: max_balance_cents, type: integer, source: input, default: 100000, description: "Ceiling on a card's balance after any load/reload" }
      - { name: min_load_cents, type: integer, source: input, default: 500, description: "Minimum load/reload amount" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | PAUSED | RETIRED", constraints: "one of DRAFT, ACTIVE, PAUSED, RETIRED" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of balance_cents over ACTIVE cards in this program" }
      - { name: breakage_recognized_cents, type: integer, source: computed, description: "Recognized breakage: REMITTANCE=sum of BREAKAGE ledger entries; ESTIMATED=per-card rounded rate applied to outstanding (recomputed on run-maintenance)" }

  - name: IncentiveCampaign
    parent: null
    common_fields: true
    fields:
      - { name: card_program_id, type: string, source: input, description: "FK -> CardProgram.id; program this campaign runs under" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: bonus_bps, type: integer, source: input, description: "Bonus basis points added to each reload during the window (e.g., 1000 = +10%)", constraints: ">= 0" }
      - { name: starts_at, type: datetime, source: input, description: "Inclusive campaign window start (UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Inclusive campaign window end (UTC)" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED (now < starts_at) | RUNNING (starts_at <= now <= ends_at) | ENDED (now > ends_at) — derived from the logical clock", constraints: "one of SCHEDULED, RUNNING, ENDED" }

  - name: CardBatch
    parent: null
    common_fields: true
    fields:
      - { name: card_program_id, type: string, source: input, description: "FK -> CardProgram.id; program the batch issues cards for" }
      - { name: channel, type: enum, source: input, description: "DIGITAL | PHYSICAL", constraints: "one of DIGITAL, PHYSICAL" }
      - { name: card_count, type: integer, source: input, description: "Number of cards to mint on commit", constraints: ">= 1" }
      - { name: unit_load_cents, type: integer, source: input, description: "Initial load minted onto each card at activation" }
      - { name: purpose, type: enum, source: input, default: "RETAIL", description: "RETAIL | B2B_BULK | INCENTIVE", constraints: "one of RETAIL, B2B_BULK, INCENTIVE" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | COMMITTED | CANCELLED", constraints: "one of DRAFT, COMMITTED, CANCELLED" }
      - { name: committed_at, type: datetime, source: system, description: "Clock time when the batch was committed (null while DRAFT)" }

  - name: GiftCard
    parent: null
    common_fields: true
    fields:
      - { name: card_program_id, type: string, source: system, description: "FK -> CardProgram.id; parent program (copied from batch on mint)" }
      - { name: card_batch_id, type: string, source: system, description: "FK -> CardBatch.id; batch that minted this card" }
      - { name: incentive_campaign_id, type: string, source: system, description: "FK -> IncentiveCampaign.id; campaign RUNNING at the most recent bonus-bearing reload, else null" }
      - { name: card_number, type: string, source: system, description: "System-minted public card number, unique across all cards" }
      - { name: channel, type: enum, source: system, description: "DIGITAL | PHYSICAL (inherited from batch)", constraints: "one of DIGITAL, PHYSICAL" }
      - { name: status, type: enum, source: system, default: "INACTIVE", description: "INACTIVE | ACTIVE | SUSPENDED | EXPIRED | ESCHEATED | CLOSED", constraints: "one of INACTIVE, ACTIVE, SUSPENDED, EXPIRED, ESCHEATED, CLOSED" }
      - { name: balance_cents, type: integer, source: computed, description: "Sum of amount_cents over this card's LedgerEntry rows with status=POSTED" }
      - { name: initial_load_cents, type: integer, source: system, description: "Load applied at activation (= batch.unit_load_cents)" }
      - { name: activated_at, type: datetime, source: system, description: "Clock time of activation (null while INACTIVE)" }
      - { name: expires_at, type: datetime, source: system, description: "activated_at + program.expiry_months (null while INACTIVE)" }
      - { name: last_activity_at, type: datetime, source: system, description: "Clock time of the most recent activation/redeem/reload" }
      - { name: dormant, type: boolean, source: computed, description: "True when (now - last_activity_at) >= DORMANCY_DAYS and status=ACTIVE" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: gift_card_id, type: string, source: system, description: "FK -> GiftCard.id; card this entry posts against" }
      - { name: settlement_batch_id, type: string, source: system, description: "FK -> SettlementBatch.id; set when a REDEMPTION is swept into a settlement batch, else null" }
      - { name: entry_type, type: enum, source: system, description: "ACTIVATION_LOAD | RELOAD | INCENTIVE_BONUS | REDEMPTION | DORMANCY_FEE | BREAKAGE | ESCHEAT_REMIT", constraints: "one of ACTIVATION_LOAD, RELOAD, INCENTIVE_BONUS, REDEMPTION, DORMANCY_FEE, BREAKAGE, ESCHEAT_REMIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed delta: positive raises balance (loads/bonus), negative lowers it (redemption/fee/breakage/escheat)" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | REVERSED — REVERSED entries are excluded from balance projection", constraints: "one of POSTED, REVERSED" }
      - { name: memo, type: string, source: system, description: "Human-readable note for the entry" }

  - name: FraudHold
    parent: null
    common_fields: true
    fields:
      - { name: gift_card_id, type: string, source: input, description: "FK -> GiftCard.id; card placed on hold" }
      - { name: reason, type: enum, source: input, description: "VELOCITY | MANUAL | CHARGEBACK", constraints: "one of VELOCITY, MANUAL, CHARGEBACK" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the FraudAnalyst who opened the hold (SoD anchor)" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of the analyst who cleared/confirmed the hold (null while OPEN)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLEARED | CONFIRMED", constraints: "one of OPEN, CLEARED, CONFIRMED" }
      - { name: reversed_redemption_count, type: integer, source: computed, description: "Number of REDEMPTION entries this hold flipped to REVERSED on confirm (0 while OPEN/CLEARED)" }

  - name: VelocityRule
    parent: null
    common_fields: true
    fields:
      - { name: card_program_id, type: string, source: input, description: "FK -> CardProgram.id; program the rule guards" }
      - { name: window_hours, type: integer, source: input, default: 24, description: "Trailing window over which redemptions are counted/summed", constraints: ">= 1" }
      - { name: max_count, type: integer, source: input, default: 5, description: "A redemption is rejected when the in-window redemption count including it would exceed this" }
      - { name: max_amount_cents, type: integer, source: input, default: 50000, description: "A redemption is rejected when the in-window redemption amount including it would exceed this" }
      - { name: enabled, type: boolean, source: input, default: true, description: "When false the rule does not gate redemptions" }

  - name: SettlementBatch
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; merchant being settled" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive settlement period start (UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive settlement period end (UTC)" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the SettlementOfficer who opened the batch (SoD anchor)" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the officer who finalized the batch (null until FINALIZED)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FINALIZED | CANCELLED", constraints: "one of OPEN, FINALIZED, CANCELLED" }
      - { name: gross_redemptions_cents, type: integer, source: computed, description: "Sum of magnitudes of swept POSTED REDEMPTION entries (final view: excludes REVERSED)" }
      - { name: interchange_fee_cents, type: integer, source: computed, description: "Tiered interchange fee on gross_redemptions_cents (see calculations.interchange_fee)" }
      - { name: net_payout_cents, type: integer, source: computed, description: "gross_redemptions_cents - interchange_fee_cents (final view, set at FINALIZE)" }
      - { name: provisional_net_payout_cents, type: integer, source: computed, description: "Net payout computed at OPEN over all swept redemptions including any later reversed" }

  - name: EscheatReport
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; merchant whose unclaimed property is remitted" }
      - { name: jurisdiction, type: string, source: input, description: "Escheat jurisdiction code (e.g., CA, NY)" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive reporting-period start (UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive reporting-period end (UTC); must be at or before the current clock" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | REMITTED", constraints: "one of DRAFT, REMITTED" }
      - { name: escheat_total_cents, type: integer, source: computed, description: "Sum of eligible EXPIRED-card balances captured by this report" }
      - { name: card_count, type: integer, source: computed, description: "Number of cards escheated by this report" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Merchant
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /merchants/{merchantId}/activate"
        actor: PlatformAdmin
        preconditions: ["merchant.status == PENDING (else ERR_INVALID_STATE)"]
        side_effects: ["increments Merchant.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /merchants/{merchantId}/suspend"
        actor: PlatformAdmin
        preconditions: ["merchant.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["increments Merchant.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /merchants/{merchantId}/reactivate"
        actor: PlatformAdmin
        preconditions: ["merchant.status == SUSPENDED (else ERR_INVALID_STATE)"]
        side_effects: ["increments Merchant.version by 1"]
        note: "SUSPENDED->ACTIVE closes the Merchant revert cycle"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /merchants/{merchantId}/close"
        actor: PlatformAdmin
        preconditions: ["merchant.status IN {ACTIVE, SUSPENDED}", "no OPEN SettlementBatch for this merchant (else ERR_INVALID_STATE)"]
        side_effects: ["increments Merchant.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /merchants/{merchantId}/close"
        actor: PlatformAdmin
        preconditions: ["merchant.status IN {ACTIVE, SUSPENDED}", "no OPEN SettlementBatch for this merchant (else ERR_INVALID_STATE)"]
        side_effects: ["increments Merchant.version by 1"]

  - entity: CardProgram
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /card-programs/{cardProgramId}/activate"
        actor: MerchantAdmin
        preconditions: ["program.status == DRAFT (else ERR_INVALID_STATE)", "owning Merchant.status == ACTIVE (else ERR_MERCHANT_NOT_ACTIVE)"]
        side_effects: ["increments CardProgram.version by 1"]
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /card-programs/{cardProgramId}/pause"
        actor: MerchantAdmin
        preconditions: ["program.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["increments CardProgram.version by 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /card-programs/{cardProgramId}/resume"
        actor: MerchantAdmin
        preconditions: ["program.status == PAUSED (else ERR_INVALID_STATE)"]
        side_effects: ["increments CardProgram.version by 1"]
        note: "PAUSED->ACTIVE closes the CardProgram revert cycle"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /card-programs/{cardProgramId}/retire"
        actor: MerchantAdmin
        preconditions: ["program.status IN {ACTIVE, PAUSED} (else ERR_INVALID_STATE)"]
        side_effects: ["increments CardProgram.version by 1", "no new cards may be activated; reload rejected with ERR_PROGRAM_NOT_ACTIVE"]
      - from: PAUSED
        to: RETIRED
        trigger: "POST /card-programs/{cardProgramId}/retire"
        actor: MerchantAdmin
        preconditions: ["program.status IN {ACTIVE, PAUSED} (else ERR_INVALID_STATE)"]
        side_effects: ["increments CardProgram.version by 1"]

  - entity: CardBatch
    initial_state: DRAFT
    terminal_states: [COMMITTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /card-batches/{cardBatchId}/commit"
        actor: MerchantAdmin
        preconditions: ["batch.status == DRAFT (else ERR_INVALID_STATE)", "owning CardProgram.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"]
        side_effects:
          - "mints card_count GiftCard rows in status INACTIVE with initial_load_cents = unit_load_cents, channel = batch.channel"
          - "committed_at = current clock"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /card-batches/{cardBatchId}/cancel"
        actor: MerchantAdmin
        preconditions: ["batch.status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: GiftCard
    initial_state: INACTIVE
    terminal_states: [ESCHEATED, CLOSED]
    transitions:
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /gift-cards/{giftCardId}/activate"
        actor: POSTerminal
        preconditions: ["card.status == INACTIVE (else ERR_INVALID_STATE)", "owning CardProgram.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"]
        side_effects:
          - "post ACTIVATION_LOAD LedgerEntry amount_cents = +initial_load_cents"
          - "activated_at = now; expires_at = now + program.expiry_months; last_activity_at = now"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fraud-holds (reason any) opens a hold on the card"
        actor: FraudAnalyst
        preconditions: ["card.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["card frozen; redeem/reload rejected with ERR_CARD_NOT_ACTIVE while SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fraud-holds/{fraudHoldId}/clear"
        actor: FraudAnalyst
        preconditions: ["card.status == SUSPENDED", "hold.status == OPEN"]
        side_effects: ["card unfrozen"]
        note: "ACTIVE<->SUSPENDED is the GiftCard revert cycle (open hold / clear hold)"
      - from: ACTIVE
        to: CLOSED
        trigger: "system: REDEMPTION brings balance_cents to exactly 0"
        actor: system
        preconditions: ["card.balance_cents == 0 after the redemption"]
        side_effects: ["card closed (zero-balance auto-close)"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /card-programs/{cardProgramId}/run-maintenance when now >= card.expires_at"
        actor: system
        preconditions: ["now >= card.expires_at", "card.status == ACTIVE"]
        side_effects:
          - "if program.breakage_method == REMITTANCE and balance_cents > 0: post BREAKAGE LedgerEntry amount_cents = -balance_cents (forfeits balance)"
          - "the BREAKAGE entry raises owning CardProgram.breakage_recognized_cents by the forfeited amount"
      - from: EXPIRED
        to: ESCHEATED
        trigger: "POST /escheat-reports/{escheatReportId}/remit"
        actor: SettlementOfficer
        preconditions: ["card.status == EXPIRED", "card captured by the report's jurisdiction/period"]
        side_effects: ["post ESCHEAT_REMIT LedgerEntry for any residual balance; card escheated (terminal)"]

  - entity: FraudHold
    initial_state: OPEN
    terminal_states: [CLEARED, CONFIRMED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /fraud-holds/{fraudHoldId}/clear"
        actor: FraudAnalyst
        preconditions: ["hold.status == OPEN (else ERR_INVALID_STATE)"]
        side_effects: ["resolved_by_user_id = X-User-ID", "owning GiftCard SUSPENDED -> ACTIVE (no redemption reversal — benign branch)"]
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /fraud-holds/{fraudHoldId}/confirm"
        actor: FraudAnalyst
        preconditions: ["hold.status == OPEN (else ERR_INVALID_STATE)", "X-User-ID != opened_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "resolved_by_user_id = X-User-ID"
          - "flip every POSTED REDEMPTION LedgerEntry on the card to REVERSED (clawback branch); card stays SUSPENDED"
          - "each reversed entry that carries a settlement_batch_id of an OPEN SettlementBatch is removed from that batch, which recomputes gross_redemptions_cents/net_payout_cents"
          - "each reversed entry with settlement_batch_id == null raises the owning Merchant.unsettled_redemptions_cents recompute"
        note: "OPEN->{CLEARED,CONFIRMED} is the FraudHold branch: CLEARED reactivates with no ledger change; CONFIRMED claws back redemptions and cascades to settlement + merchant aggregates"

  - entity: SettlementBatch
    initial_state: OPEN
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /settlement-batches/{settlementBatchId}/finalize"
        actor: SettlementOfficer
        preconditions:
          - "batch.status == OPEN (else ERR_INVALID_STATE)"
          - "X-User-ID != opened_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "owning Merchant.status == ACTIVE (else ERR_MERCHANT_NOT_ACTIVE)"
        side_effects:
          - "recompute gross_redemptions_cents over swept POSTED (non-REVERSED) REDEMPTION entries"
          - "net_payout_cents = gross_redemptions_cents - interchange_fee_cents (final view)"
          - "finalized_by_user_id = X-User-ID; owning Merchant.lifetime_net_payout_cents recompute"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /settlement-batches/{settlementBatchId}/cancel"
        actor: SettlementOfficer
        preconditions: ["batch.status == OPEN (else ERR_INVALID_STATE)"]
        side_effects:
          - "clear settlement_batch_id back to null on every swept REDEMPTION entry (release)"
          - "owning Merchant.unsettled_redemptions_cents restored to its pre-open value"

  - entity: EscheatReport
    initial_state: DRAFT
    terminal_states: [REMITTED]
    transitions:
      - from: DRAFT
        to: REMITTED
        trigger: "POST /escheat-reports/{escheatReportId}/remit"
        actor: SettlementOfficer
        preconditions: ["report.status == DRAFT (else ERR_INVALID_STATE)", "owning Merchant.status == ACTIVE (else ERR_MERCHANT_NOT_ACTIVE)"]
        side_effects:
          - "every captured EXPIRED GiftCard transitions to ESCHEATED"
          - "post ESCHEAT_REMIT LedgerEntry for any residual balance on each captured card"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: settlement-open-stale-merchant
    parent_entity: Merchant
    write_endpoint: "POST /settlement-batches"
    occ_field: "expected_merchant_version"
    description: |
      Opening a SettlementBatch against a Merchant whose version has advanced
      since the client last observed it is rejected. Opening a batch sweeps the
      merchant's un-settled POSTED redemptions into the batch and advances the
      Merchant's version; a second open still carrying the pre-open version is
      acting on a stale view (the redemptions it means to sweep were already
      claimed by the batch that advanced the version) and is rejected.
    error_id: ERR_STALE_MERCHANT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: card_balance
    trigger: "any read of GiftCard.balance_cents; recomputed after every LedgerEntry post/reversal"
    algorithm: projection
    formula: |
      balance_cents = sum(e.amount_cents for e in LedgerEntry
                          where e.gift_card_id == card.id and e.status == 'POSTED')
      # amount_cents sign convention: ACTIVATION_LOAD/RELOAD/INCENTIVE_BONUS > 0;
      # REDEMPTION/DORMANCY_FEE/BREAKAGE/ESCHEAT_REMIT < 0. Order-independent (pure sum).
    input_set: "POSTED LedgerEntry rows for the card; REVERSED rows excluded"
    precision: "integer cents, exact"

  - name: breakage_recognition
    trigger: "POST /card-programs/{id}/run-maintenance (ESTIMATED); GiftCard ACTIVE->EXPIRED (REMITTANCE)"
    algorithm: dual_variant
    formula: |
      # See variants — same card population, two recognition policies produce
      # different CardProgram.breakage_recognized_cents.
    input_set: "ACTIVE cards (ESTIMATED) or newly-EXPIRED cards with positive balance (REMITTANCE)"
    constants:
      BREAKAGE_RATE_BPS: 1000   # 10% of outstanding recognized under ESTIMATED
    precision: "integer cents, round_half_up; ESTIMATED rounds PER CARD then sums"
    variants:
      - name: REMITTANCE
        when: "program.breakage_method == REMITTANCE"
        difference: "breakage_recognized_cents = sum of magnitudes of BREAKAGE ledger entries created when cards actually EXPIRE with positive balance; an ACTIVE, un-expired card contributes 0"
      - name: ESTIMATED
        when: "program.breakage_method == ESTIMATED"
        difference: "on run-maintenance, breakage_recognized_cents = sum over ACTIVE cards of round_half_up(card.balance_cents * BREAKAGE_RATE_BPS / 10000); recognized progressively without forfeiting card balance"

  - name: interchange_fee
    trigger: "SettlementBatch OPEN (provisional) and FINALIZE (final)"
    algorithm: tiered_pricing
    formula: |
      rate_bps = 300 if gross <= 1_000_000
                 else 250 if gross <= 5_000_000
                 else 200
      raw = round_half_up(gross * rate_bps / 10000)
      interchange_fee_cents = 0 if gross == 0 else max(MIN_INTERCHANGE_CENTS, raw)
      # >=3 inputs (gross volume, tier-selected rate, min floor) with nested max/min
      # and a conditional zero-gross short-circuit.
    input_set: "gross = magnitude sum of the batch's swept REDEMPTION entries (provisional includes later-reversed; final excludes REVERSED)"
    constants:
      TIER1_MAX_CENTS: 1000000
      TIER1_RATE_BPS: 300
      TIER2_MAX_CENTS: 5000000
      TIER2_RATE_BPS: 250
      TIER3_RATE_BPS: 200
      MIN_INTERCHANGE_CENTS: 2500
    precision: "integer cents, round_half_up before the max() floor"

  - name: settlement_net_payout
    trigger: "SettlementBatch OPEN (provisional variant) and FINALIZE (final variant)"
    algorithm: aggregation
    formula: |
      net_payout_cents = gross_redemptions_cents - interchange_fee(gross_redemptions_cents)
    input_set: "swept REDEMPTION entries of the batch"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "computed at OPEN and stored in provisional_net_payout_cents"
        difference: "gross includes EVERY swept redemption, even ones later flipped to REVERSED by a fraud confirm"
      - name: final
        when: "computed at FINALIZE and stored in net_payout_cents"
        difference: "gross includes ONLY swept redemptions still status=POSTED; reversed ones are excluded, lowering both gross and net"

  - name: velocity_check
    trigger: "POST /gift-cards/{id}/redeem, evaluated before the REDEMPTION posts"
    algorithm: threshold
    formula: |
      rule = the card's program VelocityRule (enabled == true); skip if none/disabled
      window_start = now - rule.window_hours
      prior = [e for e in card REDEMPTION entries where status=='POSTED'
               and e.created_at >= window_start]
      count_incl = len(prior) + 1
      amount_incl = sum(|e.amount_cents| for e in prior) + this_amount
      reject with ERR_VELOCITY_EXCEEDED when count_incl > rule.max_count
                                        OR amount_incl > rule.max_amount_cents
    input_set: "POSTED REDEMPTION entries for the card within the trailing window"
    constants: {}
    precision: "exact integer comparison; boundary is strict '>' (equal to the cap is allowed)"

  - name: dormancy_fee
    trigger: "POST /card-programs/{id}/run-maintenance"
    algorithm: decay_function
    formula: |
      for each ACTIVE card with (now - last_activity_at) >= DORMANCY_DAYS and balance_cents > 0:
        fee = min(DORMANCY_FEE_CENTS, balance_cents)
        post DORMANCY_FEE LedgerEntry amount_cents = -fee
      # boundary is inclusive: exactly DORMANCY_DAYS of inactivity is dormant.
    input_set: "ACTIVE cards past the dormancy threshold"
    constants:
      DORMANCY_DAYS: 365
      DORMANCY_FEE_CENTS: 200
    precision: "integer cents; fee never drives balance below 0"

  - name: escheat_amount
    trigger: "POST /escheat-reports creation (capture) and remit"
    algorithm: aggregation
    formula: |
      captured = [c for c in merchant's cards
                  where c.status == 'EXPIRED'
                  and c.expires_at >= report.period_start
                  and c.expires_at <  report.period_end]
      escheat_total_cents = sum(c.balance_cents for c in captured)
      card_count = len(captured)
    input_set: "EXPIRED cards whose expires_at falls in [period_start, period_end)"
    precision: "integer cents; half-open period window"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "MerchantAdmin acting on a merchant-scoped resource: X-User-ID must equal the owning Merchant.id (directly for CardProgram.merchant_id, transitively via card_program_id -> program.merchant_id for CardBatch/IncentiveCampaign/VelocityRule/GiftCard)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "MerchantAdmin write operations"

  - priority: 4
    category: existence
    check: "All path/body resource ids resolve, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts positive integers, card_count >= 1"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the transition (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Redeem/reload require the GiftCard itself to be ACTIVE (INACTIVE/SUSPENDED/EXPIRED/ESCHEATED/CLOSED rejected)"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /gift-cards/{id}/redeem, POST /gift-cards/{id}/reload"

  - priority: 8
    category: auth
    check: "Segregation of duties: confirm hold requires X-User-ID != FraudHold.opened_by_user_id; finalize batch requires X-User-ID != SettlementBatch.opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /fraud-holds/{id}/confirm, POST /settlement-batches/{id}/finalize"

  - priority: 9
    category: business_safety
    check: "Redemption within-window count/amount must not exceed the program VelocityRule"
    error_id: ERR_VELOCITY_EXCEEDED
    http_status: 409
    applies_to: "POST /gift-cards/{id}/redeem"

  - priority: 10
    category: business_temporal
    check: "Settlement period [period_start, period_end) must not overlap another non-CANCELLED SettlementBatch of the merchant (half-open; touching endpoints allowed)"
    error_id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /settlement-batches"

  - priority: 11
    category: business_temporal
    check: "IncentiveCampaign window [starts_at, ends_at] must be separated from every other campaign on the same program by at least CAMPAIGN_GAP_DAYS = 7 days (closed intervals + mandatory buffer; two campaigns whose windows are within 7 days of each other are rejected)"
    error_id: ERR_CAMPAIGN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /incentive-campaigns"

  - priority: 12
    category: business_referential
    check: "Reload requires the owning CardProgram.status == ACTIVE (PAUSED/RETIRED reference rejected before capacity checks)"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /gift-cards/{id}/reload, POST /gift-cards/{id}/activate, POST /card-batches/{id}/commit"

  - priority: 13
    category: business_constraint
    check: "Activation/reload load must be >= program.min_load_cents"
    error_id: ERR_BELOW_MIN_LOAD
    http_status: 422
    applies_to: "POST /gift-cards/{id}/reload"

  - priority: 14
    category: business_constraint
    check: "Post-load balance (existing balance + amount + any incentive bonus) must be <= program.max_balance_cents"
    error_id: ERR_MAX_BALANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /gift-cards/{id}/reload"

  - priority: 15
    category: business_fiscal
    check: "Redemption amount must be <= card.balance_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 409
    applies_to: "POST /gift-cards/{id}/redeem"

  - priority: 16
    category: business_temporal
    check: "Escheat report period_end must be at or before the current clock (cannot report an open future window)"
    error_id: ERR_ESCHEAT_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /escheat-reports"

  - priority: 17
    category: business_referential
    check: "Merchant must be ACTIVE for settlement finalize and escheat remit"
    error_id: ERR_MERCHANT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /settlement-batches/{id}/finalize, POST /escheat-reports/{id}/remit"

  - priority: 18
    category: business_constraint
    check: "OCC: expected_merchant_version must equal the current Merchant.version"
    error_id: ERR_STALE_MERCHANT_VERSION
    http_status: 412
    applies_to: "POST /settlement-batches"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock time). All expiry/dormancy/window/velocity rules read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601"]

  # --- Merchant ---
  - method: POST
    path: "/merchants"
    description: "Create a Merchant (PENDING)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, "settlement_currency?"]
    output: Merchant
    side_effects: ["status=PENDING, version=1, aggregates initialized to 0"]
  - method: GET
    path: "/merchants/{merchantId}"
    description: "Get a Merchant"
    roles: [Any]
    code: 200
    input: []
    output: Merchant
    side_effects: []
  - method: POST
    path: "/merchants/{merchantId}/activate"
    description: "Activate a Merchant (PENDING->ACTIVE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["status->ACTIVE", "increments Merchant.version by 1"]
  - method: POST
    path: "/merchants/{merchantId}/suspend"
    description: "Suspend a Merchant (ACTIVE->SUSPENDED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["status->SUSPENDED", "increments Merchant.version by 1"]
  - method: POST
    path: "/merchants/{merchantId}/reactivate"
    description: "Reactivate a Merchant (SUSPENDED->ACTIVE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["status->ACTIVE", "increments Merchant.version by 1"]
  - method: POST
    path: "/merchants/{merchantId}/close"
    description: "Close a Merchant (terminal)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["status->CLOSED", "increments Merchant.version by 1"]

  # --- CardProgram ---
  - method: POST
    path: "/card-programs"
    description: "Create a CardProgram / card design (DRAFT)"
    roles: [MerchantAdmin]
    code: 201
    input: [merchant_id, name, "currency?", "breakage_method?", "expiry_months?", "max_balance_cents?", "min_load_cents?"]
    output: CardProgram
    side_effects: ["status=DRAFT, version=1"]
  - method: GET
    path: "/card-programs/{cardProgramId}"
    description: "Get a CardProgram"
    roles: [Any]
    code: 200
    input: []
    output: CardProgram
    side_effects: []
  - method: GET
    path: "/card-programs"
    description: "List CardPrograms (filtered)"
    roles: [Any]
    code: 200
    input: ["merchant_id?", "status?", "limit?", "offset?"]
    output: "CardProgram[]"
    side_effects: []
  - method: POST
    path: "/card-programs/{cardProgramId}/activate"
    description: "Activate a CardProgram (DRAFT->ACTIVE)"
    roles: [MerchantAdmin]
    code: 200
    input: []
    output: CardProgram
    side_effects: ["status->ACTIVE", "increments CardProgram.version by 1"]
  - method: POST
    path: "/card-programs/{cardProgramId}/pause"
    description: "Pause a CardProgram (ACTIVE->PAUSED)"
    roles: [MerchantAdmin]
    code: 200
    input: []
    output: CardProgram
    side_effects: ["status->PAUSED", "increments CardProgram.version by 1"]
  - method: POST
    path: "/card-programs/{cardProgramId}/resume"
    description: "Resume a CardProgram (PAUSED->ACTIVE)"
    roles: [MerchantAdmin]
    code: 200
    input: []
    output: CardProgram
    side_effects: ["status->ACTIVE", "increments CardProgram.version by 1"]
  - method: POST
    path: "/card-programs/{cardProgramId}/retire"
    description: "Retire a CardProgram (terminal)"
    roles: [MerchantAdmin]
    code: 200
    input: []
    output: CardProgram
    side_effects: ["status->RETIRED", "increments CardProgram.version by 1"]
  - method: POST
    path: "/card-programs/{cardProgramId}/run-maintenance"
    description: "Run periodic ops for a program: expire cards past expires_at (REMITTANCE breakage forfeit), accrue dormancy fees, and (ESTIMATED) recompute breakage_recognized_cents"
    roles: [PlatformAdmin, MerchantAdmin]
    code: 200
    input: []
    output: CardProgram
    side_effects:
      - "ACTIVE cards with now>=expires_at -> EXPIRED (+ BREAKAGE entry when REMITTANCE)"
      - "dormant ACTIVE cards accrue DORMANCY_FEE entries"
      - "ESTIMATED programs recompute breakage_recognized_cents (per-card rounded)"

  # --- IncentiveCampaign ---
  - method: POST
    path: "/incentive-campaigns"
    description: "Create an IncentiveCampaign (window + bonus); enforces per-program window buffer"
    roles: [MerchantAdmin]
    code: 201
    input: [card_program_id, name, bonus_bps, starts_at, ends_at]
    output: IncentiveCampaign
    side_effects: []
  - method: GET
    path: "/incentive-campaigns/{incentiveCampaignId}"
    description: "Get an IncentiveCampaign"
    roles: [Any]
    code: 200
    input: []
    output: IncentiveCampaign
    side_effects: []
  - method: GET
    path: "/incentive-campaigns"
    description: "List IncentiveCampaigns (filtered)"
    roles: [Any]
    code: 200
    input: ["card_program_id?", "status?", "limit?", "offset?"]
    output: "IncentiveCampaign[]"
    side_effects: []

  # --- CardBatch ---
  - method: POST
    path: "/card-batches"
    description: "Create a CardBatch / issuance order (DRAFT)"
    roles: [MerchantAdmin]
    code: 201
    input: [card_program_id, channel, card_count, unit_load_cents, "purpose?"]
    output: CardBatch
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/card-batches/{cardBatchId}"
    description: "Get a CardBatch"
    roles: [Any]
    code: 200
    input: []
    output: CardBatch
    side_effects: []
  - method: GET
    path: "/card-batches"
    description: "List CardBatches (filtered)"
    roles: [Any]
    code: 200
    input: ["card_program_id?", "status?", "limit?", "offset?"]
    output: "CardBatch[]"
    side_effects: []
  - method: POST
    path: "/card-batches/{cardBatchId}/commit"
    description: "Commit a batch: mint the gift cards (DRAFT->COMMITTED)"
    roles: [MerchantAdmin]
    code: 200
    input: []
    output: CardBatch
    side_effects: ["mints card_count GiftCards (INACTIVE)", "committed_at set"]
  - method: POST
    path: "/card-batches/{cardBatchId}/cancel"
    description: "Cancel a DRAFT batch (DRAFT->CANCELLED)"
    roles: [MerchantAdmin]
    code: 200
    input: []
    output: CardBatch
    side_effects: ["status->CANCELLED"]

  # --- GiftCard ---
  - method: GET
    path: "/gift-cards/{giftCardId}"
    description: "Get a GiftCard"
    roles: [Any]
    code: 200
    input: []
    output: GiftCard
    side_effects: []
  - method: GET
    path: "/gift-cards/{giftCardId}/balance"
    description: "Balance API: current balance and status for a card"
    roles: [Any, POSTerminal]
    code: 200
    input: []
    output: "{ card_number: string, status: string, balance_cents: integer, currency: string }"
    side_effects: []
  - method: GET
    path: "/gift-cards"
    description: "List GiftCards (filtered by program/batch/campaign/status)"
    roles: [Any]
    code: 200
    input: ["card_program_id?", "card_batch_id?", "incentive_campaign_id?", "status?", "limit?", "offset?"]
    output: "GiftCard[]"
    side_effects: []
  - method: POST
    path: "/gift-cards/{giftCardId}/activate"
    description: "Activate a card (INACTIVE->ACTIVE, applies initial load)"
    roles: [POSTerminal, MerchantAdmin]
    code: 200
    input: []
    output: GiftCard
    side_effects: ["ACTIVATION_LOAD entry posted", "activated_at/expires_at/last_activity_at set"]
  - method: POST
    path: "/gift-cards/{giftCardId}/redeem"
    description: "Redeem value from a card (posts a REDEMPTION)"
    roles: [POSTerminal]
    code: 200
    input: [amount_cents]
    output: GiftCard
    side_effects: ["velocity_check", "REDEMPTION entry posted", "last_activity_at=now", "zero-balance auto-close (ACTIVE->CLOSED)"]
  - method: POST
    path: "/gift-cards/{giftCardId}/reload"
    description: "Reload value onto a card (RELOAD + optional INCENTIVE_BONUS if a campaign is RUNNING)"
    roles: [POSTerminal, MerchantAdmin]
    code: 200
    input: [amount_cents]
    output: GiftCard
    side_effects: ["RELOAD entry posted", "INCENTIVE_BONUS entry when a RUNNING campaign exists (incentive_campaign_id set)", "last_activity_at=now"]

  # --- LedgerEntry ---
  - method: GET
    path: "/ledger-entries/{ledgerEntryId}"
    description: "Get a LedgerEntry"
    roles: [Any]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []
  - method: GET
    path: "/ledger-entries"
    description: "List LedgerEntries (filtered by card, settlement batch, type, status)"
    roles: [Any]
    code: 200
    input: ["gift_card_id?", "settlement_batch_id?", "entry_type?", "status?", "limit?", "offset?"]
    output: "LedgerEntry[]"
    side_effects: []

  # --- FraudHold ---
  - method: POST
    path: "/fraud-holds"
    description: "Open a fraud hold on a card (card ACTIVE->SUSPENDED)"
    roles: [FraudAnalyst]
    code: 201
    input: [gift_card_id, reason]
    output: FraudHold
    side_effects: ["opened_by_user_id = X-User-ID", "card ACTIVE->SUSPENDED"]
  - method: GET
    path: "/fraud-holds/{fraudHoldId}"
    description: "Get a FraudHold"
    roles: [Any]
    code: 200
    input: []
    output: FraudHold
    side_effects: []
  - method: GET
    path: "/fraud-holds"
    description: "List FraudHolds (filtered)"
    roles: [Any]
    code: 200
    input: ["gift_card_id?", "status?", "limit?", "offset?"]
    output: "FraudHold[]"
    side_effects: []
  - method: POST
    path: "/fraud-holds/{fraudHoldId}/clear"
    description: "Clear a hold (OPEN->CLEARED, card SUSPENDED->ACTIVE, no clawback)"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: FraudHold
    side_effects: ["resolved_by_user_id set", "card SUSPENDED->ACTIVE"]
  - method: POST
    path: "/fraud-holds/{fraudHoldId}/confirm"
    description: "Confirm fraud (OPEN->CONFIRMED): claw back the card's redemptions and cascade to settlement + merchant aggregates"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: FraudHold
    side_effects:
      - "resolved_by_user_id set (must differ from opened_by_user_id)"
      - "flip POSTED REDEMPTION entries to REVERSED (balance restored)"
      - "remove reversed entries from any OPEN settlement batch (batch recomputes)"
      - "merchant unsettled_redemptions_cents recompute"

  # --- VelocityRule ---
  - method: POST
    path: "/velocity-rules"
    description: "Create a VelocityRule for a program"
    roles: [MerchantAdmin]
    code: 201
    input: [card_program_id, "window_hours?", "max_count?", "max_amount_cents?", "enabled?"]
    output: VelocityRule
    side_effects: []
  - method: GET
    path: "/velocity-rules/{velocityRuleId}"
    description: "Get a VelocityRule"
    roles: [Any]
    code: 200
    input: []
    output: VelocityRule
    side_effects: []
  - method: GET
    path: "/velocity-rules"
    description: "List VelocityRules (filtered)"
    roles: [Any]
    code: 200
    input: ["card_program_id?", "limit?", "offset?"]
    output: "VelocityRule[]"
    side_effects: []

  # --- SettlementBatch ---
  - method: POST
    path: "/settlement-batches"
    description: "Open a settlement batch: sweep un-settled redemptions and compute provisional payout (OCC on Merchant.version)"
    roles: [SettlementOfficer]
    code: 201
    input: [merchant_id, period_start, period_end, expected_merchant_version]
    output: SettlementBatch
    side_effects:
      - "sweep this merchant's POSTED REDEMPTION entries with settlement_batch_id==null into the batch"
      - "opened_by_user_id = X-User-ID"
      - "compute provisional_net_payout_cents and net_payout_cents (provisional view)"
      - "increments Merchant.version by 1"
      - "Merchant.unsettled_redemptions_cents recompute"
  - method: GET
    path: "/settlement-batches/{settlementBatchId}"
    description: "Get a SettlementBatch"
    roles: [Any]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []
  - method: GET
    path: "/settlement-batches"
    description: "List SettlementBatches (filtered)"
    roles: [Any]
    code: 200
    input: ["merchant_id?", "status?", "limit?", "offset?"]
    output: "SettlementBatch[]"
    side_effects: []
  - method: POST
    path: "/settlement-batches/{settlementBatchId}/finalize"
    description: "Finalize a settlement batch (OPEN->FINALIZED); SoD opener!=finalizer; merchant must be ACTIVE"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["recompute gross/interchange/net (final view)", "finalized_by_user_id set", "Merchant.lifetime_net_payout_cents recompute"]
  - method: POST
    path: "/settlement-batches/{settlementBatchId}/cancel"
    description: "Cancel an OPEN settlement batch (release swept redemptions)"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["clear settlement_batch_id on swept entries", "Merchant.unsettled_redemptions_cents restored"]

  # --- EscheatReport ---
  - method: POST
    path: "/escheat-reports"
    description: "Create an escheat report capturing eligible EXPIRED-card balances for a jurisdiction/period (DRAFT)"
    roles: [SettlementOfficer]
    code: 201
    input: [merchant_id, jurisdiction, period_start, period_end]
    output: EscheatReport
    side_effects: ["compute escheat_total_cents and card_count over EXPIRED cards in [period_start, period_end)"]
  - method: GET
    path: "/escheat-reports/{escheatReportId}"
    description: "Get an EscheatReport"
    roles: [Any]
    code: 200
    input: []
    output: EscheatReport
    side_effects: []
  - method: GET
    path: "/escheat-reports"
    description: "List EscheatReports (filtered)"
    roles: [Any]
    code: 200
    input: ["merchant_id?", "jurisdiction?", "status?", "limit?", "offset?"]
    output: "EscheatReport[]"
    side_effects: []
  - method: POST
    path: "/escheat-reports/{escheatReportId}/remit"
    description: "Remit an escheat report (DRAFT->REMITTED); captured cards -> ESCHEATED"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: EscheatReport
    side_effects: ["captured EXPIRED cards -> ESCHEATED", "ESCHEAT_REMIT entries posted"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/unknown role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "MerchantAdmin X-User-ID does not own the target merchant-scoped resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, non-positive amount, card_count < 1" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the transition (generic)" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Redeem/reload target card is not ACTIVE" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Referenced CardProgram is not ACTIVE (card activate / batch commit / reload)" }
  - { id: ERR_MERCHANT_NOT_ACTIVE, http: 409, condition: "Owning Merchant is not ACTIVE for settlement finalize / escheat remit" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same user attempts both open and confirm/finalize" }
  - { id: ERR_VELOCITY_EXCEEDED, http: 409, condition: "Redemption exceeds the program VelocityRule count or amount cap" }
  - { id: ERR_SETTLEMENT_PERIOD_OVERLAP, http: 409, condition: "Settlement period overlaps another non-CANCELLED batch of the merchant" }
  - { id: ERR_CAMPAIGN_WINDOW_OVERLAP, http: 409, condition: "Campaign window violates the per-program CAMPAIGN_GAP_DAYS buffer" }
  - { id: ERR_MAX_BALANCE_EXCEEDED, http: 409, condition: "Post-load balance would exceed program.max_balance_cents" }
  - { id: ERR_BELOW_MIN_LOAD, http: 422, condition: "Reload amount below program.min_load_cents" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 409, condition: "Redemption amount exceeds card balance" }
  - { id: ERR_ESCHEAT_PERIOD_OPEN, http: 409, condition: "Escheat report period_end is after the current clock" }
  - { id: ERR_STALE_MERCHANT_VERSION, http: 412, condition: "expected_merchant_version does not match current Merchant.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: manages merchant lifecycle and the logical clock; may run program maintenance"
    identity: "opaque"
    exclusive_operations:
      - "POST /merchants — create merchant"
      - "POST /merchants/{id}/activate — activate merchant"
      - "POST /merchants/{id}/suspend — suspend merchant"
      - "POST /merchants/{id}/reactivate — reactivate merchant"
      - "POST /merchants/{id}/close — close merchant"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /card-programs/{id}/run-maintenance — run program maintenance (with MerchantAdmin)"

  - name: MerchantAdmin
    description: "Acts as a specific Merchant: designs programs, campaigns, batches, velocity rules; owns only its merchant's resources"
    identity: "entity_backed:Merchant"
    exclusive_operations:
      - "POST /card-programs — create program"
      - "POST /card-programs/{id}/activate|pause|resume|retire — program lifecycle"
      - "POST /incentive-campaigns — create campaign"
      - "POST /card-batches — create batch"
      - "POST /card-batches/{id}/commit|cancel — batch lifecycle"
      - "POST /velocity-rules — create velocity rule"
    shared_operations:
      - "POST /gift-cards/{id}/activate — activate card (with POSTerminal)"
      - "POST /gift-cards/{id}/reload — reload card (with POSTerminal)"
      - "POST /card-programs/{id}/run-maintenance — run program maintenance (with PlatformAdmin)"

  - name: POSTerminal
    description: "Point-of-sale / acceptance client: activates, redeems, reloads, reads balance"
    identity: "opaque"
    exclusive_operations:
      - "POST /gift-cards/{id}/redeem — redeem value"
    shared_operations:
      - "POST /gift-cards/{id}/activate — activate card (with MerchantAdmin)"
      - "POST /gift-cards/{id}/reload — reload card (with MerchantAdmin)"
      - "GET /gift-cards/{id}/balance — balance API"

  - name: FraudAnalyst
    description: "Risk operator: opens/clears/confirms fraud holds; open and confirm must be different analysts (SoD)"
    identity: "opaque"
    exclusive_operations:
      - "POST /fraud-holds — open hold"
      - "POST /fraud-holds/{id}/clear — clear hold"
      - "POST /fraud-holds/{id}/confirm — confirm hold"

  - name: SettlementOfficer
    description: "Finance operator: opens/finalizes/cancels settlement batches and files escheat reports; open and finalize must be different officers (SoD)"
    identity: "opaque"
    exclusive_operations:
      - "POST /settlement-batches — open batch"
      - "POST /settlement-batches/{id}/finalize — finalize batch"
      - "POST /settlement-batches/{id}/cancel — cancel batch"
      - "POST /escheat-reports — create report"
      - "POST /escheat-reports/{id}/remit — remit report"

  - name: Any
    description: "Any authenticated role may read (GET) resources"
    identity: "opaque"
    shared_operations:
      - "GET /merchants/{id}, /card-programs (+{id}), /incentive-campaigns (+{id}), /card-batches (+{id})"
      - "GET /gift-cards (+{id}, +/balance), /ledger-entries (+{id})"
      - "GET /fraud-holds (+{id}), /velocity-rules (+{id})"
      - "GET /settlement-batches (+{id}), /escheat-reports (+{id})"
