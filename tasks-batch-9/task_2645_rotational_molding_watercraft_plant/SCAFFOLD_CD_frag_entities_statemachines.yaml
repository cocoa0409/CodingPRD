            - "POST /molding-cycles returns 201 with status == 'SCHEDULED' (the declared initial_state) and ProductionOrder.${po}.status becomes 'IN_PRODUCTION' on this first cycle"
            - "start-oven returns 200 with MoldingCycle.${cyc}.status == 'OVEN_RUNNING' and actual_oven_start_at == '2026-08-01T09:00:00Z'"
            - "enter-cooling returns 200 with status == 'COOLING', actual_oven_end_at == '2026-08-01T10:00:00Z' and actual_oven_minutes == 60"
            - "demold returns 200 with status == 'DEMOLDED', actual_cooling_end_at == '2026-08-01T10:35:00Z' and actual_cooling_minutes == 35"
            - "actual_cooling_minutes 35 != scheduled_cooling_minutes 30, so the actuals are read from the clock and not copied from the schedule"
            - "the projected window is unchanged by the run: oven_end_at == '2026-08-01T10:00:00Z' and cooling_window_end_at == '2026-08-01T10:30:00Z'"
            - "MoldingCycle.${cyc}.version == 5  # 1 at create, +1 charge rollup, +1 start-oven, +1 enter-cooling, +1 demold"
            - "MoldingCycle.${cyc}.abort_reason == null and provisional_warpage_index == 0.000  # thermal, cooling, rotation and distribution terms are all 0.000 at 288.0 C, 35 >= 30 cooling minutes and an 8.00/2.00 rpm ratio of exactly 4.000"
            - "ProductionOrder.${po}.status == 'IN_PRODUCTION' at the end (a DEMOLDED cycle alone does not complete the order; only a PASS inspection does)"

      # ------------------------------------------------- Precondition Enforcement
      - name: sm_precondition_start_oven_identity_suspension_missing_charge_and_mass_tolerance
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MoldingCycle.SCHEDULED_to_OVEN_RUNNING
          - validations[priority=5]
          - validations[priority=30]
          - errors.ERR_ROLE_IDENTITY_MISMATCH
          - errors.ERR_TECHNICIAN_SUSPENDED
          - errors.ERR_RESIN_INSUFFICIENT
          - errors.ERR_CHARGE_MASS_OUT_OF_TOLERANCE
        distinguishing_aspect: "start-oven carries ten ordered preconditions and each violation must surface its OWN error id: a second MOLDING_OPERATOR acting on someone else's cycle gets ERR_ROLE_IDENTITY_MISMATCH, the assigned-but-suspended operator gets ERR_TECHNICIAN_SUSPENDED, a cycle with zero RESERVED charges gets ERR_RESIN_INSUFFICIENT, and a cycle charged 20.000 against a 24.000 kg tool gets ERR_CHARGE_MASS_OUT_OF_TOLERANCE."
        test_recipe:
          setup:
            - "The PM-SM-PRE / MLD-SM-PRE / OVN-SM-PRE / BAY-SM-PRE fixture with one mould of cavity_count 1 and nominal_charge_kg 24.000, charge_tolerance_pct 5.00."
            - "TWO MOLDING_OPERATOR technicians TEC-SM-PRE-OP1 and TEC-SM-PRE-OP2, both ACTIVE, so an identity mismatch can be produced without a role error."
            - "ProductionOrder POR-SM-PRE with ordered_qty 3 so §1.4 priority 79 admits three single-cavity cycles: 3 <= floor(3 * 1.20) == 3."
            - "Three cycles on DISJOINT mould spans so the exclusive-occupancy rules never fire: CYC-A oven 09:00-10:00 cooling to 10:30, CYC-B oven 11:00-12:00, CYC-C oven 13:00-14:00, all on arm 1 of one station whose changeover_buffer_min is 15."
            - "CYC-A holds a correct 24.000 kg charge, CYC-B holds NO charge at all, CYC-C holds a 20.000 kg charge that is 16.67 pct off the tool's nominal."
            - "The logical clock is parked at 09:00 for every probe: start-oven has no window precondition, so the failures are attributable only to the preconditions under test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
