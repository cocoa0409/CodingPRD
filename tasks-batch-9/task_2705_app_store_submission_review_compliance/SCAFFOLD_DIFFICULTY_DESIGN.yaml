            - { call: "POST /expedite-requests", payload: { submission_id: "${sub_a_id}", justification_category: "SECURITY_FIX", justification: "Session tokens are logged in plaintext by the analytics SDK bundled in build 10." }, as: ReleaseManager, as_user_id: "u-release-1", captures: { exp2_id: "$.data.id" } }
            - { call: "POST /expedite-requests", payload: { submission_id: "${sub_a_id}", justification_category: "TIME_SENSITIVE_EVENT", justification: "Sponsorship campaign launches on 2026-08-04 and requires this build to be live." }, as: ReleaseManager, as_user_id: "u-release-1", captures: { exp3_id: "$.data.id" } }
