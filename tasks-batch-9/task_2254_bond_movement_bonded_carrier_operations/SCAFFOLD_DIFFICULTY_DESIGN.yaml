          setup:
            - "Clock 2026-08-01T00:00:00Z; ports 4601 (NE) and 3901 (MW); carrier ACTIVE; CONTINUOUS bond 50000.00."
            - "M1 = IT 4601 -> 3901, cargo 1234.60 / 100.28 kg / 3 packages -> obligation 41.75, deadline 2026-09-05T00:00:00Z; departed with seal SEAL-100."
            - "M3 = a second identical IT filing that is left FILED (never departed) -> obligation 41.75."
            - "At 2026-08-10 the carrier reports seal SEAL-100 BROKEN_UNAUTHORIZED on M1 and OFF-1 issues a SEAL_VIOLATION claim: overdue 0, chargeable 1, raw max(1000.00, 750.00) -> assessed 1000.00, 4 points."
            - "At 2026-09-06 a sweep marks M1 OVERDUE with overdue_days 1. Ledger before the trigger: 41.75 + 41.75 + 1000.00 = 1083.50 obligated."
