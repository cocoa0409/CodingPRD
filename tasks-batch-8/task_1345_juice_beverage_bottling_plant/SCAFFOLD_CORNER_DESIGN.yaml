          trigger:
            - { call: "POST /v1/formulas/${form_id}/retire", payload: {}, as: ProductDeveloper, as_user_id: "dev-1", captures: { err_ret: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/cancel", payload: {}, as: ProductionPlanner }
            - { call: "POST /v1/formulas/${form_id}/retire", payload: {}, as: ProductDeveloper, as_user_id: "dev-1", captures: { end_status: $.data.status } }
          assert:
            - "err_ret == ERR_FORMULA_STATE_INVALID, HTTP 409 (QUOTED run blocks retire)"
            - "After run cancel: end_status == RETIRED"

      - name: formula_retired_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Formula.DRAFT_to_RETIRED
          - errors[ERR_FORMULA_STATE_INVALID]
        distinguishing_aspect: |
          RETIRED is terminal: a second retire and a submit-label-review
          carrying the CURRENT formula version both fail with
          ERR_FORMULA_STATE_INVALID (the OCC check passes; the state gate rejects).
        test_recipe:
          setup:
            - "Customer; DRAFT formula"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "LockCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "LK-1", name: "Lock Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/formulas/${form_id}/retire", payload: {}, as: ProductDeveloper, as_user_id: "dev-1", captures: { fret_v: $.data.version, fret_status: $.data.status } }
          trigger:
            - { call: "POST /v1/formulas/${form_id}/retire", payload: {}, as: ProductDeveloper, as_user_id: "dev-1", captures: { err_ret2: $.data.error_id } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fret_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { err_sub: $.data.error_id } }
          assert:
            - "fret_status == RETIRED and fret_v == 2 (retire bumped the version)"
            - "err_ret2 == ERR_FORMULA_STATE_INVALID, HTTP 409"
            - "err_sub == ERR_FORMULA_STATE_INVALID, HTTP 409 (OCC passed with the current version; state gate fired)"

      - name: label_review_supersede_and_decided_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LabelClaimReview.PENDING_to_SUPERSEDED
          - state_machines.LabelClaimReview.PENDING_to_APPROVED
          - errors[ERR_REVIEW_STATE_INVALID]
        distinguishing_aspect: |
          Re-submitting supersedes the PENDING review; deciding a SUPERSEDED or
          already-APPROVED review fails with ERR_REVIEW_STATE_INVALID, while
          deciding the current PENDING review succeeds once.
        test_recipe:
          setup:
            - "Customer; DRAFT formula (version 1)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "RevCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "RV-1", name: "Rev Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, fv: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev1: $.data.id, rev1_snap: $.data.claims_snapshot } }
            - { call: "GET /v1/formulas/${form_id}", payload: {}, as: Any, captures: { fv: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fv}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev2: $.data.id } }
          trigger:
            - { call: "GET /v1/label-reviews/${rev1}", payload: {}, as: Any, captures: { rev1_status: $.data.status } }
            - { call: "POST /v1/label-reviews/${rev1}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1", captures: { err_sup: $.data.error_id } }
            - { call: "POST /v1/label-reviews/${rev2}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1", captures: { rev2_status: $.data.status } }
            - { call: "POST /v1/label-reviews/${rev2}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1", captures: { err_again: $.data.error_id } }
            - { call: "POST /v1/label-reviews/${rev2}/reject", payload: { review_note: "too late" }, as: LabelComplianceReviewer, as_user_id: "rev-2", captures: { err_rej: $.data.error_id } }
          assert:
            - "rev1_status == SUPERSEDED (side effect of the second submit)"
            - "err_sup == ERR_REVIEW_STATE_INVALID, HTTP 409 (SUPERSEDED is terminal)"
            - "rev2_status == APPROVED (only the current PENDING review is decidable)"
            - "err_again == ERR_REVIEW_STATE_INVALID and err_rej == ERR_REVIEW_STATE_INVALID (APPROVED is terminal)"

      - name: tank_cip_cycle_duration_and_guards
        claim_type: valid_transition
        grounds:
          - state_machines.BlendingTank.AWAITING_CIP_to_IN_CIP
          - state_machines.BlendingTank.IN_CIP_to_AVAILABLE
          - entities.BlendingTank.fields.cip_required_hours
          - errors[ERR_CIP_DURATION_INSUFFICIENT]
          - errors[ERR_TANK_STATE_INVALID]
        distinguishing_aspect: |
          CIP duration depends on the allergen of the last batch: NONE -> 2 h,
          TREE_NUT -> 6 h. Equality to the required duration completes; one
          minute short fails. start-cip from AVAILABLE or IN_CIP is a posture
          error; completing resets allergen_group to NONE.
        test_recipe:
          setup:
            - "Customer; TREE_NUT formula FN and NONE formula FZ (DRAFT ok); tank A holding FN batch, tank B holding FZ batch; both batches driven to PROCESSING so both tanks are AWAITING_CIP; fresh tank C AVAILABLE"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "CipCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "CIP-N", name: "Nut", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "TREE_NUT", shelf_life_days: 90, claims: ["NON_GMO"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_n: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "CIP-Z", name: "Plain", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_z: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-CA", capacity_liters: 5000 }, as: PlantManager, captures: { tank_a: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-CB", capacity_liters: 5000 }, as: PlantManager, captures: { tank_b: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-CC", capacity_liters: 5000 }, as: PlantManager, captures: { tank_c: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_n}", tank_id: "${tank_a}", planned_start_at: "2026-08-09T08:00:00Z", planned_end_at: "2026-08-09T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_a: $.data.id } }
            - { call: "POST /v1/batches/${batch_a}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_a}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_a}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_a}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun_a: $.data.id } }
            - { call: "POST /v1/process-runs/${prun_a}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_z}", tank_id: "${tank_b}", planned_start_at: "2026-08-09T08:00:00Z", planned_end_at: "2026-08-09T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_b: $.data.id } }
            - { call: "POST /v1/batches/${batch_b}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_b}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_b}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_b}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun_b: $.data.id } }
            - { call: "POST /v1/process-runs/${prun_b}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /v1/blending-tanks/${tank_a}/start-cip", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { a_req: $.data.cip_required_hours, a_started: $.data.cip_started_at } }
            - { call: "POST /v1/blending-tanks/${tank_b}/start-cip", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { b_req: $.data.cip_required_hours } }
            - { call: "POST /v1/blending-tanks/${tank_c}/start-cip", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err_avail: $.data.error_id } }
            - { call: "POST /v1/blending-tanks/${tank_a}/start-cip", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err_incip: $.data.error_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/blending-tanks/${tank_b}/complete-cip", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { b_posture: $.data.posture, b_allergen: $.data.allergen_group } }
            - { call: "POST /v1/blending-tanks/${tank_a}/complete-cip", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err_short: $.data.error_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/blending-tanks/${tank_a}/complete-cip", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { a_posture: $.data.posture, a_allergen: $.data.allergen_group } }
          assert:
            - "a_req == 6 (TREE_NUT residue -> ALLERGEN_CIP_HOURS) and b_req == 2 (NONE -> STANDARD_CIP_HOURS)"
            - "a_started == 2026-08-10T08:00:00Z (logical clock stamp)"
            - "err_avail == ERR_TANK_STATE_INVALID (start-cip from AVAILABLE)"
            - "err_incip == ERR_TANK_STATE_INVALID (start-cip from IN_CIP)"
            - "b_posture == AVAILABLE and b_allergen == NONE at exactly +2h (equality allowed)"
            - "err_short == ERR_CIP_DURATION_INSUFFICIENT at +2h for the 6h cycle"
            - "a_posture == AVAILABLE and a_allergen == NONE at exactly +6h (equality allowed)"

      - name: tank_start_blend_requires_occupying_batch
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Batch.PLANNED_to_BLENDING
          - errors[ERR_TANK_STATE_INVALID]
        distinguishing_aspect: |
          start-blend is gated on the tank being OCCUPIED by THIS batch: with
          batch E holding the tank, the later-window batch N on the same tank
          cannot start blending (ERR_TANK_STATE_INVALID) even though its
          calendar window was accepted.
        test_recipe:
          setup:
            - "Customer; DRAFT formula; tank T-SB with PLANNED batch E [2026-08-10T08:00Z, 12:00Z] and PLANNED batch N [2026-08-10T15:00Z, 18:00Z] (exactly the 3h gap, allowed)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "OccCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "OC-1", name: "Occ Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-SB", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_e: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T15:00:00Z", planned_end_at: "2026-08-10T18:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_n: $.data.id } }
            - { call: "POST /v1/batches/${batch_e}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /v1/batches/${batch_n}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err_n: $.data.error_id } }
            - { call: "GET /v1/batches/${batch_n}", payload: {}, as: Any, captures: { n_status: $.data.status } }
            - { call: "GET /v1/blending-tanks/${tank_id}", payload: {}, as: Any, captures: { t_batch: $.data.occupying_batch_id } }
          assert:
            - "err_n == ERR_TANK_STATE_INVALID, HTTP 409 (tank OCCUPIED by E, not by N)"
            - "n_status == PLANNED (unchanged)"
            - "t_batch == ${batch_e} (occupant is still the blending batch)"

      - name: batch_invalid_transition_sweep
        claim_type: invalid_transition
        grounds:
          - state_machines.Batch
          - errors[ERR_BATCH_STATE_INVALID]
        distinguishing_aspect: |
          From PLANNED only start-blend is legal; from BLENDING only
          record-blend; every other action verb (record-blend, qa-verdict,
          apply-adjustment, condemn, release, re-start-blend) is rejected with
          ERR_BATCH_STATE_INVALID and leaves the batch untouched.
        test_recipe:
          setup:
            - "Customer; DRAFT formula; tank; one PLANNED batch"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "InvBatch", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "IB-1", name: "Inv Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-IB", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1", captures: { e1: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1", captures: { e2: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { e3: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/condemn", payload: {}, as: QAInspector, as_user_id: "qa-1", captures: { e4: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1", captures: { e5: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { ok1: $.data.status } }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1", captures: { e6: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { e7: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1", captures: { ok2: $.data.status } }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.2 }, as: BlendOperator, as_user_id: "op-1", captures: { e8: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { e9: $.data.error_id } }
          assert:
            - "e1..e5 all == ERR_BATCH_STATE_INVALID, HTTP 409 (PLANNED accepts only start-blend)"
            - "ok1 == BLENDING"
            - "e6 == ERR_BATCH_STATE_INVALID (qa-verdict needs AWAITING_QA) and e7 == ERR_BATCH_STATE_INVALID (re-start)"
            - "ok2 == AWAITING_QA"
            - "e8 == ERR_BATCH_STATE_INVALID (re-record) and e9 == ERR_BATCH_STATE_INVALID (start from AWAITING_QA)"

      - name: process_run_active_sibling_and_terminal_guards
        claim_type: invalid_transition
        grounds:
          - state_machines.ProcessRun
          - errors[ERR_PROCESS_RUN_ACTIVE_EXISTS]
          - errors[ERR_PROCESS_RUN_STATE_INVALID]
        distinguishing_aspect: |
          A batch may have at most one SCHEDULED/RUNNING process run
          (ERR_PROCESS_RUN_ACTIVE_EXISTS); complete before start and start of an
          ABORTED run are state errors; abort of a RUNNING run returns the batch
          to QA_PASSED so a replacement run can be scheduled (the cycle).
        test_recipe:
          setup:
            - "Customer; DRAFT formula; tank; batch driven to QA_PASSED"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "ProcCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "PR-1", name: "Proc Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-PR", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun1: $.data.id, p1_status: $.data.status } }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { err_active: $.data.error_id } }
            - { call: "POST /v1/process-runs/${prun1}/complete", payload: { min_temp_c: 88.0, time_below_setpoint_seconds: 0 }, as: BlendOperator, as_user_id: "op-1", captures: { err_complete: $.data.error_id } }
            - { call: "POST /v1/process-runs/${prun1}/start", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { p1_running: $.data.status } }
            - { call: "POST /v1/process-runs/${prun1}/start", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err_restart: $.data.error_id } }
            - { call: "POST /v1/process-runs/${prun1}/abort", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { p1_aborted: $.data.status } }
            - { call: "GET /v1/batches/${batch_id}", payload: {}, as: Any, captures: { b_status: $.data.status } }
            - { call: "POST /v1/process-runs/${prun1}/start", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err_aborted: $.data.error_id } }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun2: $.data.id } }
          assert:
            - "p1_status == SCHEDULED (initial_state)"
            - "err_active == ERR_PROCESS_RUN_ACTIVE_EXISTS, HTTP 409 (one active run per batch)"
            - "err_complete == ERR_PROCESS_RUN_STATE_INVALID (complete from SCHEDULED)"
            - "p1_running == RUNNING; err_restart == ERR_PROCESS_RUN_STATE_INVALID (idempotency: second start)"
            - "p1_aborted == ABORTED and b_status == QA_PASSED (abort cycle side effect)"
            - "err_aborted == ERR_PROCESS_RUN_STATE_INVALID (ABORTED is terminal)"
            - "Replacement prun2 created successfully after the abort"

      - name: container_lot_qc_and_return_guards
        claim_type: invalid_transition
        grounds:
          - state_machines.ContainerLot
          - errors[ERR_CONTAINER_LOT_STATE_INVALID]
        distinguishing_aspect: |
          Only RECEIVED lots accept a QC verdict; only QC_FAILED lots accept a
          return; RETURNED is terminal. A return from RECEIVED or QC_PASSED and
          any verdict on a decided lot are ERR_CONTAINER_LOT_STATE_INVALID.
        test_recipe:
          setup:
            - "Two received container lots L1 and L2"
          setup_api_calls:
            - { call: "POST /v1/container-lots", payload: { container_type: "GLASS_355", quantity_received: 3000, supplier_lot_code: "SUP-Q1" }, as: WarehouseLead, captures: { lot1: $.data.id } }
            - { call: "POST /v1/container-lots", payload: { container_type: "GLASS_355", quantity_received: 3000, supplier_lot_code: "SUP-Q2" }, as: WarehouseLead, captures: { lot2: $.data.id } }
          trigger:
            - { call: "POST /v1/container-lots/${lot1}/return", payload: {}, as: WarehouseLead, captures: { e1: $.data.error_id } }
            - { call: "POST /v1/container-lots/${lot1}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1", captures: { l1_status: $.data.status } }
            - { call: "POST /v1/container-lots/${lot1}/qc-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1", captures: { e2: $.data.error_id } }
            - { call: "POST /v1/container-lots/${lot1}/return", payload: {}, as: WarehouseLead, captures: { e3: $.data.error_id } }
            - { call: "POST /v1/container-lots/${lot2}/qc-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1", captures: { l2_status: $.data.status } }
            - { call: "POST /v1/container-lots/${lot2}/return", payload: {}, as: WarehouseLead, captures: { l2_ret: $.data.status } }
            - { call: "POST /v1/container-lots/${lot2}/return", payload: {}, as: WarehouseLead, captures: { e4: $.data.error_id } }
            - { call: "POST /v1/container-lots/${lot2}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1", captures: { e5: $.data.error_id } }
          assert:
            - "e1 == ERR_CONTAINER_LOT_STATE_INVALID (return requires QC_FAILED, lot was RECEIVED)"
            - "l1_status == QC_PASSED; e2 == ERR_CONTAINER_LOT_STATE_INVALID (verdict on decided lot)"
            - "e3 == ERR_CONTAINER_LOT_STATE_INVALID (return from QC_PASSED)"
            - "l2_status == QC_FAILED then l2_ret == RETURNED (happy path)"
            - "e4 == ERR_CONTAINER_LOT_STATE_INVALID and e5 == ERR_CONTAINER_LOT_STATE_INVALID (RETURNED terminal)"

      - name: line_maintenance_cycle_and_schedule_guard
        claim_type: guarded_transition
        grounds:
          - state_machines.BottlingLine.ACTIVE_to_MAINTENANCE
          - state_machines.BottlingLine.MAINTENANCE_to_ACTIVE
