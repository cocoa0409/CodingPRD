              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { mkt_id: $.data.id }
            - call: "POST /homes"
              payload: { market_id: "${mkt_id}", address_line1: "118 Peachtree Way", city: "Atlanta", state_code: "GA", postal_code: "30318", bedrooms: 3, bathrooms: 2, square_feet: 1650, year_built: 1998, assessed_value_cents: 28000000, asking_rent_cents: 215000, insurance_carrier_name: "Southeast Mutual", insurance_annual_premium_cents: 180000, insurance_binder_expires_on: "2027-06-30", hoa_name: "Peachtree HOA", hoa_annual_cents: 60000 }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { home_id: $.data.id }
            - call: "POST /showing-slots"
              payload: { home_id: "${home_id}", starts_at: "2026-09-10T15:00:00Z", ends_at: "2026-09-10T15:30:00Z", access_mode: "SMART_LOCK" }
              as: LeasingAgent
              as_user_id: "agent-1"
              captures: { s1_id: $.data.id }
            - call: "POST /showing-slots"
              payload: { home_id: "${home_id}", starts_at: "2026-09-10T16:00:00Z", ends_at: "2026-09-10T16:30:00Z", access_mode: "SMART_LOCK" }
              as: LeasingAgent
              as_user_id: "agent-1"
              captures: { s2_id: $.data.id }
            - call: "POST /prospects"
              payload: { email: "p3a@example.com", full_name: "Priya ThreeA", phone: "+1-404-555-0131", market_id: "${mkt_id}", declared_monthly_income_cents: 157500, credit_tier: "D", prior_eviction_count: 0 }
