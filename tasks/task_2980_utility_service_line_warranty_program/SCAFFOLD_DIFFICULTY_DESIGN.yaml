            - "GET /campaigns?partner_id=${partner_id} returns total_count == 3 in created_at ASC order: ${anchor_id}, ${cand_a_id}, ${cand_b_id}"
            - "the rule is symmetric: candidate B at 2026-08-26 is now itself in PARTNER_REVIEW, so re-submitting candidate A would still conflict - this time against a sibling 1 day AFTER it rather than 20 days before"

  # ===========================================================================
  # 9. compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: benefit_reversal_restores_annual_cap_headroom
        grounds:
          - state_machines.RegulatorComplaint.OPEN_to_CLOSED_SUBSTANTIATED
          - state_machines.Enrollment.ANNUAL_CAP_EXHAUSTED_to_WITHIN_CAP
          - calculations.annual_and_occurrence_cap_usage
          - entities.LedgerEntry.fields.entry_type
          - entities.Claim.fields.benefit_paid_cents
          - entities.Dispatch.fields.benefit_paid_cents
          - validations.reversal-within-posted-benefit
          - endpoints.POST /regulator-complaints/{complaintId}/response
        distinguishing_aspect: |
          The compensation is APPEND-ONLY and PARTIAL: no ledger row is mutated or deleted, a third row of
          -100000 is added, and every derived figure must re-derive from the new sum - including the cap
          dimension, which has to walk BACKWARDS out of a state the scaffold otherwise only enters. The
          invariant is that two derived fields with the SAME name diverge on purpose: the ledger-derived
          Claim.benefit_paid_cents falls to 427000 while the frozen settlement Dispatch.benefit_paid_cents
          stays at 527000, so an implementation that "helpfully" rewrites the dispatch drifts and is caught.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product (per_occurrence_cap_cents 800000, annual_cap_cents 1000000, permit_covered true, restoration_covered_scope BASIC_BACKFILL)."
            - "One OR premises enrolled DIRECT_BILL on 2026-08-05; the nightly run at 2026-09-10T08:00:00.000Z activated coverage."
            - "Claim 1 was dispatched to Alder Plumbing and COMPLETED for labor 260000 / materials 175000 / permit 42000 / restoration 90000, posting a 527000 BENEFIT_CHARGE and leaving the enrollment WITHIN_CAP."
            - "Claim 2 was then dispatched (claim 1's dispatch is COMPLETED, so it no longer blocks the window) and COMPLETED for labor 400000 / materials 73000, posting 473000 and driving annual usage to exactly 1000000 and cap_status to ANNUAL_CAP_EXHAUSTED."
            - "Both claims are PAID. The clock advances to 2026-09-20T00:00:00.000Z and a PUC complaint is logged against the partner CITING CLAIM 1, which is in PAID - not DENIED - so the appeal-reopen cascade must not fire and the response deadline must use the full RESPONSE_DAYS.PUC of 10 days rather than the 5-day expedited path."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /contractors"
              payload: { name: "Alder Plumbing", state_code: "OR", license_number: "OR-PL-4471", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 18000, sla_compliance_pct: 92, max_open_dispatches: 5, permit_pull_authorized: true }
              as: OperationsAdmin
