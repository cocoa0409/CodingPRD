          assert:
            - "the 59-day request returns 422 and its error_id == ERR_RETENTION_BELOW_POLICY_FLOOR"
            - "the 60-day request succeeds and RetentionChangeRequest.${rcr_eq_id}.state == COOLING_OFF"
            - "BackupGroup.${grp_p_id}.group_retention_days is still 45 after both submissions (the cooling-off has not been applied)"
