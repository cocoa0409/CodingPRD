            - "L2: Vendor.${v1}.strike_count == 3"
            - "L3: Vendor.${v1}.status == SUSPENDED"
            - "L4: Dispatch.${dspx}.status == CANCELLED"
            - "L4: WorkOrder.${wx}.status == NEW and WorkOrder.${wx}.dispatched_at == null and WorkOrder.${wx}.sla_response_due_at == null"
            - "WorkOrder.${w3}.status == PENDING_QA (the completing order itself is unaffected by the suspension)"

      - name: critical_asset_failure_freezes_building_suspends_plans_cancels_shifts
        grounds:
          - state_machines.Asset.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.Building.OPEN_to_FROZEN
          - state_machines.PMPlan.ACTIVE_to_SUSPENDED
          - state_machines.SoftServiceShift.SCHEDULED_to_CANCELLED
          - calculations.building_operating_posture
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger than the vendor cascade — POST /fm/assets/{id}/report-failure:
          (L1) the CRITICAL asset goes OUT_OF_SERVICE -> (L2) oos_critical_asset_count reaching 1 flips
          Building.operating_posture to FROZEN -> (L3) the FROZEN posture SUSPENDs the building's ACTIVE
          PMPlans and CANCELs its SCHEDULED SoftServiceShifts. Each link is caused by the previous link,
          not by the report-failure call itself.
        test_recipe:
          setup:
            - "Building with one CRITICAL HVAC asset IN_SERVICE, one ACTIVE PMPlan on that asset, one zone space, and one SCHEDULED janitorial shift."
            - "Posture is OPEN before the trigger."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "Z1", floor: 1, area_sqm: 200, space_type: "COMMON" }
              as: FacilityManager
              captures: { z1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "CHILLER-01", category: "HVAC", criticality: "CRITICAL" }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/pm-plans"
              payload: { asset_id: "${a1}", interval_days: 30, grace_days: 5, next_due_at: "2026-06-01T00:00:00Z" }
              as: FacilityManager
              captures: { pm1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CleanCo", trade: "JANITORIAL", hourly_rate: 40.00, sla_response_minutes: 120, sla_resolve_minutes: 480 }
              as: FacilityManager
              captures: { jv: $.data.id }
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${jv}", zone_space_id: "${z1}", service_type: "JANITORIAL", start_at: "2026-05-05T08:00:00Z", end_at: "2026-05-05T16:00:00Z", planned_headcount: 3 }
              as: FacilityManager
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /fm/assets/${a1}/report-failure"
              payload: {}
              as: FacilityManager
            - call: "GET /fm/buildings/${b1}"
              payload: {}
              as: FacilityManager
            - call: "GET /fm/assets/${a1}/pm-plans"
              payload: {}
              as: FacilityManager
            - call: "GET /fm/soft-service-shifts/${sh1}"
              payload: {}
              as: FacilityManager
          assert:
            - "L1: Asset.${a1}.status == OUT_OF_SERVICE, failure_count == 1, condition_score == 88.00"
            - "L2: Building.${b1}.oos_critical_asset_count == 1 and Building.${b1}.operating_posture == FROZEN"
            - "L3: PMPlan.${pm1}.status == SUSPENDED"
            - "L3: SoftServiceShift.${sh1}.status == CANCELLED"
            - "Vendor.${jv}.strike_count == 0 (a posture cancellation is not a vendor strike)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_posture_beats_shift_overlap_state_vs_temporal
        grounds:
          - validations[priority=55]
          - validations[priority=70]
          - errors[ERR_BUILDING_FROZEN]
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Error-category pair `state` (priority 55, ERR_BUILDING_FROZEN) vs `business_temporal`
          (priority 70, ERR_SHIFT_OVERLAP): one request violates both, and the FROZEN posture gate wins
          because it is checked first. The colliding shift survives the freeze only because ops-run had
          already moved it to IN_PROGRESS (the posture cascade cancels SCHEDULED shifts only).
        test_recipe:
          setup:
            - "Building with a janitorial vendor holding an IN_PROGRESS shift running 09:00-17:00 on 2026-05-05."
            - "A CRITICAL asset then fails, so the building is FROZEN while that IN_PROGRESS shift still occupies the vendor."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "Z1", floor: 1, area_sqm: 200, space_type: "COMMON" }
              as: FacilityManager
              captures: { z1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CleanCo", trade: "JANITORIAL", hourly_rate: 40.00, sla_response_minutes: 120, sla_resolve_minutes: 480 }
              as: FacilityManager
              captures: { jv: $.data.id }
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${jv}", zone_space_id: "${z1}", service_type: "JANITORIAL", start_at: "2026-05-05T09:00:00Z", end_at: "2026-05-05T17:00:00Z", planned_headcount: 3 }
              as: FacilityManager
              captures: { sh1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "CHILLER-01", category: "HVAC", criticality: "CRITICAL" }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings/${b1}/ops-run"
              payload: {}
              as: FacilityManager
            - call: "POST /fm/assets/${a1}/report-failure"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${jv}", zone_space_id: "${z1}", service_type: "JANITORIAL", start_at: "2026-05-05T10:30:00Z", end_at: "2026-05-05T12:00:00Z", planned_headcount: 2 }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_BUILDING_FROZEN (NOT ERR_SHIFT_OVERLAP, even though the interval also collides with shift ${sh1})"
            - "SoftServiceShift.${sh1}.status == IN_PROGRESS (unchanged; the freeze cancels SCHEDULED shifts only)"
            - "GET /fm/soft-service-shifts?vendor_id=${jv} returns exactly 1 shift — no row was created"

      - name: vendor_suspension_beats_project_budget_safety_vs_fiscal
        grounds:
          - validations[priority=60]
          - validations[priority=80]
          - errors[ERR_VENDOR_SUSPENDED]
          - errors[ERR_PROJECT_BUDGET_EXCEEDED]
          - state_machines.SoftServiceShift.SCHEDULED_to_MISSED
        distinguishing_aspect: |
