  - rule_id: non_linear_state_machine
    instances:
      - name: member_vetting_suspend_reinstate_cycle
        grounds:
          - state_machines.Member.transitions.VETTED_to_SUSPENDED
          - state_machines.Member.transitions.SUSPENDED_to_VETTED
          - entities.Member.fields.vetting_status
          - entities.Member.fields.suspension_reason
        distinguishing_aspect: |
          Entity: Member — true cycle VETTED -> SUSPENDED -> VETTED -> SUSPENDED
          (A->B->A->B). The cycle preserves credit_balance_hours (10.00) and
          reliability_score (50) across both loops, and reinstate clears
          suspension_reason to null; a purely linear reading of the machine could
          not re-enter SUSPENDED.
        test_recipe:
          setup:
            - "Founders VETTED; F1 has no open requests/claims/assignments"
