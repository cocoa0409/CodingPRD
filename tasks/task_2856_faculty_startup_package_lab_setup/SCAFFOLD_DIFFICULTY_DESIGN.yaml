  # =========================================================================
  # Rule 6 - boundary precision on two different metrics and endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: waterfall_capacity_exactly_equals_required_then_one_cent_over
        grounds:
          - calculations.encumbrance_waterfall
          - validations.priority_43_ERR_INSUFFICIENT_TRANCHE_BALANCE
          - endpoints.POST_equipment_orders_id_place
          - calculations.cost_share_split
        distinguishing_aspect: |
          Metric: cents of waterfall capacity, at the >= boundary. The two OPEN EQUIPMENT tranches
          hold 25_000_000 + 15_000_000 = 40_000_000 and the order asks for exactly 40_000_000, so
          capacity == required must be ACCEPTED (not rejected as "not strictly greater"), draining
          the last tranche to exactly 0 while it stays OPEN. The FY2028 EQUIPMENT tranche of
          8_000_000 is still SCHEDULED and must not raise the capacity to 48_000_000. A second
          order for a single cent - required = capacity + 1 - must then be rejected, with no
          partial ENCUMBRANCE row written.
        test_recipe:
          setup:
            - "BASE fixture (package ACTIVE, spend_status SPENDING, faculty ACTIVE), clock 2026-08-01T00:00:00Z, so the two FY2027 EQUIPMENT tranches are OPEN and the FY2028 one is still SCHEDULED."
