  - name: invalid_state_action_returns_invalid_state
    claim_type: violation_to_error
    grounds:
    - validations[priority=12]
    - errors.ERR_INVALID_STATE
    excluded_because:
      difficulty_instance: invalid_state_outranks_budget_exceeded_on_confirm
      rationale: |
        That instance asserts ERR_INVALID_STATE on a CONFIRM against an already-CONFIRMED row while the budget is simultaneously exhausted, which pins both the error and its precedence over the priority-38 rule — strictly more than a bare violation_to_error claim for priority 12.
  - name: confirm_over_budget_returns_plan_budget_exceeded
    claim_type: violation_to_error
    grounds:
    - validations[priority=38]
    - errors.ERR_PLAN_BUDGET_EXCEEDED
    excluded_because:
      difficulty_instance: invalid_state_outranks_budget_exceeded_on_confirm
      rationale: |
        The same instance drives the priority-38 rule to fire on its own after the state conflict is removed, asserting the 402 status and the unchanged committed ledger.
  - name: guard_double_booking_returns_guard_window_conflict
    claim_type: violation_to_error
    grounds:
    - validations[priority=23]
    - errors.ERR_GUARD_WINDOW_CONFLICT
    excluded_because:
      difficulty_instance: guard_shift_half_open_touching_allowed_overlap_rejected
      rationale: |
        The half-open interval semantics are the whole point of this rule, and that instance asserts both arms: a back-to-back shift that merely touches is ACCEPTED while a one-minute overlap is rejected — a bare violation claim would leave the touching case untested.
  - name: confirm_onto_full_post_returns_post_fully_staffed
    claim_type: violation_to_error
    grounds:
    - validations[priority=25]
    - errors.ERR_POST_FULLY_STAFFED
    excluded_because:
      difficulty_instance: guard_window_conflict_outranks_post_fully_staffed
      rationale: |
        That instance sets up a post that is both fully staffed and a double-booking target, asserting that the priority-23 rule wins and then that the priority-25 rule fires alone once the conflict is removed.
  - name: confirm_with_ineligible_vendor_returns_subcontractor_not_eligible
    claim_type: violation_to_error
    grounds:
    - validations[priority=20]
    - errors.ERR_SUBCONTRACTOR_NOT_ELIGIBLE
    excluded_because:
      difficulty_instance: subcontractor_not_eligible_outranks_post_fully_staffed
      rationale: |
        That instance asserts the priority-20 rule against a SUSPENDED vendor while the target post is already full, pinning both the error and its precedence over priority 25.
  - name: post_create_over_zone_slots_returns_zone_post_capacity_exceeded
    claim_type: violation_to_error
    grounds:
    - validations[priority=24]
    - errors.ERR_ZONE_POST_CAPACITY_EXCEEDED
    excluded_because:
      difficulty_instance: zone_post_slot_closed_interval_aggregate_capacity
      rationale: |
        The CLOSED-interval aggregate semantics — windows that merely touch DO overlap, and the sum is taken over every candidate instant — are that instance's entire subject, including the accepted case one slot below the cap.
  - name: publish_with_no_posts_returns_plan_has_no_posts
    claim_type: violation_to_error
    grounds:
    - validations[priority=27]
    - errors.ERR_PLAN_HAS_NO_POSTS
    excluded_because:
      difficulty_instance: publish_with_empty_post_collection
      rationale: |
        The empty-collection boundary on PUBLISH, and the fact that a plan whose only post has been CLOSED counts as empty, are asserted there together with the ACTIVATE arm of the same rule.
  - name: publish_with_draft_assessment_returns_assessment_not_approved
    claim_type: violation_to_error
    grounds:
    - validations[priority=14]
    - errors.ERR_ASSESSMENT_NOT_APPROVED
    excluded_because:
      difficulty_instance: publish_blocked_by_unapproved_risk_assessment
      rationale: |
        That cross-entity-state-dependency instance drives PUBLISH against a SUBMITTED and then a REJECTED assessment and finally against an APPROVED one, which covers this rule in both directions.
  - name: confirm_with_unverified_guard_returns_guard_credential_invalid
    claim_type: violation_to_error
    grounds:
    - validations[priority=16]
    - errors.ERR_GUARD_CREDENTIAL_INVALID
    excluded_because:
      difficulty_instance: confirm_blocked_by_guard_verification_status
      rationale: |
        That instance walks a guard through UNVERIFIED, PENDING_REVIEW and REJECTED, confirming that only VERIFIED clears the rule, and also probes the credential_expires_on arm against the assignment window.
  - name: child_mutation_with_frozen_gate_returns_event_gate_frozen
    claim_type: violation_to_error
    grounds:
    - validations[priority=13]
    - errors.ERR_EVENT_GATE_FROZEN
    excluded_because:
      difficulty_instance: critical_le_handoff_cascades_ingress_lanes_gate
      rationale: |
        That instance produces the FROZEN gate through the CRITICAL LE_HANDOFF cascade and then asserts that the guarded child mutations are refused with ERR_EVENT_GATE_FROZEN until the incident is resolved, which is the only way to reach this rule at all.
  - name: validation_priority_ordering_is_pinned
    claim_type: priority_ordering
    grounds:
    - validations[priority=12]
    - validations[priority=23]
    - validations[priority=20]
    - validations[priority=25]
    - validations[priority=38]
    excluded_because:
      difficulty_instance: invalid_state_outranks_budget_exceeded_on_confirm
      rationale: |
        Priority ordering is the explicit subject of three §1.8 instances on the same CONFIRM endpoint — this one for 12 over 38, guard_window_conflict_outranks_post_fully_staffed for 23 over 25, and subcontractor_not_eligible_outranks_post_fully_staffed for 20 over 25 — each constructing a state in which BOTH rules are violated and asserting which error id surfaces.
