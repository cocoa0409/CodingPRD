          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "LineAdditionRequest.${lar}.request_state == SUBMITTED"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_subscriber_line_version_blocks_promo_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[promo-schedule-create-stale-line]
          - validations[priority=27]
          - errors[ERR_STALE_SUBSCRIBER_LINE_VERSION]
        distinguishing_aspect: "Creating a promo schedule against a subscriber line bumps that line's version, so a second create still carrying the first-observed version is refused with ERR_STALE_SUBSCRIBER_LINE_VERSION and status 412."
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line"
            - "The client observes the line version once, before any write"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1515", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
