  - rule_id: compensating_invariant
    instances:

      - name: penalty_ledger_survives_rescission_without_retroactive_recomputation
        grounds:
          - state_machines.EnforcementAction.ISSUED_to_RESCINDED
          - calculations.enforcement_penalty_assessment
          - entities.PermitTerm.fields.total_assessed_penalty_cents
          - entities.EnforcementAction.fields.prior_assessed_total_cents
          - entities.ControlMeasure.fields.enforcement_count
        distinguishing_aspect: |
          Conserved quantity: money — PermitTerm.total_assessed_penalty_cents must always equal the
          sum of penalty_cents over every EnforcementAction row of the term. The compensating
          action (rescind) zeroes one row's penalty and subtracts exactly that amount, and it must
          NOT retroactively re-multiply the sibling action that was assessed while the rescinded
          penalty still counted, even though the next new action does see the lowered prior total.
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures; CONSTRUCTION_RUNOFF reported 30 of 30 so goal_status is MET"
            - "site SITE-I with plan_status APPROVED and field_status ACTIVE_DISTURBANCE"
            - "EA-1 NOTICE_OF_VIOLATION on SITE-I with violation_days 0 -> prior total 0, multiplier 1.00, penalty 25000"
            - "EA-2 ADMINISTRATIVE_ORDER on SITE-I with violation_days 10 -> prior total 25000, multiplier 1.50, penalty 105000"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures/${cr_id}/report-progress"
              payload: { measurable_goal_actual: 30 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
            - call: "POST /stormwater/construction-sites"
              payload: { permit_term_id: "${term_id}", site_name: "SITE-I", operator_name: "Ironwood Contractors", disturbed_acres: 2.50 }
              as: ConstructionInspector
              as_user_id: "insp-01"
              captures: { site_i_id: $.data.id }
            - call: "POST /stormwater/construction-sites/${site_i_id}/submit-esc-plan"
              payload: { esc_plan_reference: "ESC-I-1" }
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/construction-sites/${site_i_id}/esc-review"
              payload: { decision: "APPROVE" }
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/enforcement-actions"
              payload: { action_type: "NOTICE_OF_VIOLATION", violation_days: 0, construction_site_id: "${site_i_id}" }
              as: EnforcementOfficer
              as_user_id: "enf-01"
              captures: { ea1_id: $.data.id }
            - call: "POST /stormwater/enforcement-actions"
              payload: { action_type: "ADMINISTRATIVE_ORDER", violation_days: 10, construction_site_id: "${site_i_id}" }
              as: EnforcementOfficer
              as_user_id: "enf-01"
              captures: { ea2_id: $.data.id }
          trigger:
            - call: "POST /stormwater/enforcement-actions/${ea1_id}/rescind"
              payload: { reason: "Issued against the wrong operator of record" }
              as: EnforcementOfficer
              as_user_id: "enf-01"
            - call: "POST /stormwater/enforcement-actions"
              payload: { action_type: "NOTICE_OF_VIOLATION", violation_days: 0, construction_site_id: "${site_i_id}" }
              as: EnforcementOfficer
              as_user_id: "enf-01"
              captures: { ea3_id: $.data.id }
          assert:
            - "before the trigger the ledger reads PermitTerm.${term_id}.total_assessed_penalty_cents == 130000 == 25000 + 105000, and ControlMeasure.${cr_id}.enforcement_count == 2 forces goal_status BEHIND with compliance_posture AT_RISK"
            - "after the rescind EnforcementAction.${ea1_id}.status == RESCINDED with penalty_cents == 0 and rescinded_at set"
            - "after the rescind PermitTerm.${term_id}.total_assessed_penalty_cents == 105000: exactly the 25000 that was added is subtracted, no more and no less"
            - "EnforcementAction.${ea2_id}.penalty_cents is still 105000 with escalation_multiplier 1.50 and prior_assessed_total_cents 25000 frozen: a retroactive recompute to 70000 would break the invariant"
            - "the rescind lowers ConstructionSite.${site_i_id}.open_enforcement_count to 1 and ControlMeasure.${cr_id}.enforcement_count to 1, so goal_status returns to MET and compliance_posture to COMPLIANT"
            - "EnforcementAction.${ea3_id}.prior_assessed_total_cents == 105000, escalation_multiplier == 2.25 and penalty_cents == 56250: the rescinded row is gone from the prior total, so the tier is read from 105000 and not from 130000"
            - "final ledger PermitTerm.${term_id}.total_assessed_penalty_cents == 161250 == 0 + 105000 + 56250, equal to the sum of penalty_cents over all three rows"
            - "ControlMeasure.${cr_id}.enforcement_count == 2 again after EA-3, so goal_status is BEHIND and compliance_posture AT_RISK once more"

      - name: credit_pool_returns_to_the_exact_gross_fee_after_every_revocation
        grounds:
          - state_machines.FeeCreditApplication.APPROVED_to_REVOKED
          - calculations.credit_adjusted_net_fee
          - entities.StormwaterAccount.fields.total_credit_pct
          - entities.StormwaterAccount.fields.current_net_fee_cents
          - concurrency_rules.OCC_ACCOUNT_CREDIT
        distinguishing_aspect: |
          Conserved quantity: a percentage pool and the cents derived from it. Three approvals of
          0.1000, 0.1000 and 0.3000 must always be re-derived from the POOLED percentage, because
          round_half_up(29264 * 0.2000) is 5853 while 2926 + 2926 is 5852. Revoking them one by one
          must walk the net fee back through 23411 and 26338 to exactly 29264, with no accumulated
          one-cent drift, which an implementation that adds each credit back separately cannot do.
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures and funding_target_cents 25000"
            - "COMMERCIAL account P-9020 of 9020 sqft -> gross_billable_cents 29264"
            - "three applications approved in order at 0.1000, 0.1000 and 0.3000, the account version re-read before each filing"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-9020", owner_name: "Harborline Retail LLC", parcel_class: "COMMERCIAL", impervious_area_sqft: 9020 }
              as: UtilityBillingClerk
              captures: { acct_a_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /stormwater/fee-credit-applications"
              payload: { stormwater_account_id: "${acct_a_id}", requested_credit_pct: 0.1000, bmp_description: "Permeable pavement in the north lot", expected_stormwater_account_version: "${acct_v1}" }
              as: UtilityBillingClerk
              captures: { app1_id: $.data.id }
            - call: "GET /stormwater/accounts/${acct_a_id}"
              payload: {}
              as: UtilityBillingClerk
              captures: { acct_v2: $.data.version }
            - call: "POST /stormwater/fee-credit-applications"
              payload: { stormwater_account_id: "${acct_a_id}", requested_credit_pct: 0.1000, bmp_description: "Rain garden at the loading dock", expected_stormwater_account_version: "${acct_v2}" }
              as: UtilityBillingClerk
              captures: { app2_id: $.data.id }
            - call: "GET /stormwater/accounts/${acct_a_id}"
              payload: {}
              as: UtilityBillingClerk
              captures: { acct_v3: $.data.version }
            - call: "POST /stormwater/fee-credit-applications"
              payload: { stormwater_account_id: "${acct_a_id}", requested_credit_pct: 0.3000, bmp_description: "Cistern and drip irrigation reuse", expected_stormwater_account_version: "${acct_v3}" }
              as: UtilityBillingClerk
              captures: { app3_id: $.data.id }
            - call: "POST /stormwater/fee-credit-applications/${app1_id}/review"
              payload: { decision: "APPROVE", approved_credit_pct: 0.1000 }
              as: UtilityBillingClerk
            - call: "POST /stormwater/fee-credit-applications/${app2_id}/review"
              payload: { decision: "APPROVE", approved_credit_pct: 0.1000 }
              as: UtilityBillingClerk
            - call: "POST /stormwater/fee-credit-applications/${app3_id}/review"
              payload: { decision: "APPROVE", approved_credit_pct: 0.3000 }
              as: UtilityBillingClerk
          trigger:
            - call: "POST /stormwater/fee-credit-applications/${app3_id}/revoke"
              payload: { reason: "Cistern removed during tenant fit-out" }
              as: UtilityBillingClerk
            - call: "POST /stormwater/fee-credit-applications/${app2_id}/revoke"
              payload: { reason: "Rain garden paved over" }
              as: UtilityBillingClerk
            - call: "POST /stormwater/fee-credit-applications/${app1_id}/revoke"
              payload: { reason: "Permeable pavement sealed" }
              as: UtilityBillingClerk
          assert:
            - "setup checkpoint after the first approval: total_credit_pct == 0.1000 and current_net_fee_cents == 26338, since round_half_up(29264 * 0.1000) == 2926"
            - "setup checkpoint after the second approval: total_credit_pct == 0.2000 and current_net_fee_cents == 23411, because the credit is round_half_up(29264 * 0.2000) == 5853 and NOT 2926 + 2926 == 5852"
            - "setup checkpoint after the third approval: total_credit_pct == 0.5000 exactly at MAX_CREDIT_PCT, credit 14632, current_net_fee_cents == 14632"
            - "after revoking app3: FeeCreditApplication.${app3_id}.status == REVOKED, total_credit_pct == 0.2000 and current_net_fee_cents == 23411 again"
            - "after revoking app2: total_credit_pct == 0.1000 and current_net_fee_cents == 26338 again"
            - "after revoking app1: total_credit_pct == 0.0000 and current_net_fee_cents == 29264 == gross_billable_cents, so the pool is empty and the drift is exactly zero"
            - "gross_fee_cents == 26129 and class_surcharge_cents == 3135 are unchanged by every approval and revocation"
            - "PermitTerm.${term_id}.projected_annual_revenue_cents walks 26338 -> 23411 -> 14632 -> 23411 -> 26338 -> 29264 and funding_adequacy_status ends ADEQUATE against the 25000 target"
            - "StormwaterAccount.${acct_a_id}.version strictly increases across all six writes and no revoke reuses a stale version"

