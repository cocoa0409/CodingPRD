            - "The settlement-line listing shows exactly one line with status PROVISIONAL, bucket CONTRACT, ton_slice 20.000, gross_amount_cents 9000000 and provisional_amount_cents 5400000, so the summary is a faithful roll-up of the rows"
            - "Read 2 (after close): provisional_settlement_cents == 0 because the only line is now FINAL — the field is a live sum over PROVISIONAL lines, not a historical total"
            - "Read 2 money: final_settlement_cents == 9000000, prompt_pay_credit_cents == 45000 (0.5 pct tier on a 9,000,000 pre-credit total), lien_holdback_cents == 450000 (5.0 pct), net_payable_cents == 8595000 == 9000000 + 45000 - 450000"
            - "Read 2 installments: installment_planned_total_cents == 8595000 (two halves of 4297500) and installment_paid_total_cents == 0, outstanding_lien_balance_cents == 8595000"
            - "Read 3 (after paying one half): installment_paid_total_cents == 4297500 and outstanding_lien_balance_cents == 4297500, while installment_planned_total_cents is unchanged at 8595000 and the tonnage columns never move"
            - "Read 3 is served to the Grower role and returns the identical body: the summary is readable by GrowerRelationsManager, AccountsPayableClerk and the producer"

      - name: renew_extends_the_term_and_recomputes_the_renewal_window
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /grower-relations/grape-contracts/{contractId}/renew]
          - state_machines.GrapeContract.RENEWAL_WINDOW_OPEN_to_RENEWED
        distinguishing_aspect: |
          The renewal action mutates three things at once — term_end_vintage, the base price
          when a new one is supplied, and BOTH ends of the renewal window, which are derived
          from the new term_end_vintage rather than shifted by a year. With
          termination_notice_days at the default 90 the recomputed window must be
          [2028-08-03T00:00:00Z, 2028-11-01T00:00:00Z), and the multi-year term (2 years on a
          2026 contract) catches an implementation that hardcodes a one-year roll.
        test_recipe:
          setup:
            - "ACTIVE contract for vintages 2026-2026 accepted at 2026-08-01T00:00:00Z on a producer with a spotless 100.0 lifetime score; clock then moved to 2026-08-03T00:00:00Z so the window opens."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-RENEW", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2026, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
          trigger:
            - call: "GET /grower-relations/grape-contracts/${contract_id}"
              as: GrowerRelationsManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/renew"
              payload: { renewal_term_years: 2, renewed_base_price_per_ton_cents: 480000 }
              as: GrowerRelationsManager
            - call: "GET /grower-relations/grape-contracts"
              payload: { renewal_status: "RENEWED" }
              as: GrowerRelationsManager
          assert:
            - "Before the renewal the contract reports renewal_status NOT_DUE with renewal_window_opens_at 2026-08-03T00:00:00Z and renewal_window_closes_at 2026-11-01T00:00:00Z"
            - "The clock move to the inclusive opening instant flips renewal_status to RENEWAL_WINDOW_OPEN without any operator action"
            - "The renew call returns 200 with renewal_status RENEWED, term_end_vintage 2028 and base_price_per_ton_cents 480000"
            - "renewal_window_closes_at is recomputed to 2028-11-01T00:00:00Z and renewal_window_opens_at to 2028-08-03T00:00:00Z — both derived from the NEW term_end_vintage, not shifted by the renewal_term_years"
            - "lifecycle_status is still ACTIVE and settlement/tonnage fields are untouched: renewal is a second, independent dimension"
            - "The filtered listing returns exactly this contract, so renewal_status is a working query filter"

      - name: suspend_and_reinstate_round_trip_the_producers_standing
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /grower-relations/growers/{growerId}/suspend]
          - endpoints[POST /grower-relations/growers/{growerId}/reinstate]
          - validations.priority_31
        distinguishing_aspect: |
          Suspension is a gate rather than a state machine: it has no transition table, so the
          only way to see it is that operations reachable through the producer start failing
          with a 403 and start working again after reinstatement. The round trip also proves the
          gate is re-evaluated per request rather than latched at contract creation, and that
          the version counter advances on both writes.
        test_recipe:
          setup:
            - "One producer with one block, one spec and one DRAFT contract with an allocation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-STANDING", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2027, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/growers/${grower_id}/suspend"
              payload: { reason: "Licence under review" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
              captures: { e1: $.data.error_id }
            - call: "POST /grower-relations/growers/${grower_id}/reinstate"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "GET /grower-relations/growers"
              payload: { status: "SUSPENDED" }
              as: GrowerRelationsManager
          assert:
            - "The suspend call returns 200 with status SUSPENDED and version 2"
            - "${e1} == ERR_GROWER_SUSPENDED with HTTP 403 — a 403 from a business rule, not from RBAC — and the contract is still DRAFT"
            - "The reinstate call returns 200 with status ACTIVE and version 3: the counter advances on every write, including a pure standing change"
            - "The second offer now returns 200 with lifecycle_status OFFERED, proving the gate is evaluated per request"
            - "The listing filtered to SUSPENDED reports total_count == 0 after reinstatement"

      - name: contract_block_allocation_links_a_contract_and_a_block_readable_from_both_sides
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /grower-relations/contract-block-allocations]
          - endpoints[GET /grower-relations/contract-block-allocations]
          - entities.ContractBlockAllocation
        distinguishing_aspect: |
          The junction row is the only many-to-many surface in the model, and it must be
          navigable from BOTH ends: filtering by contract_id yields the blocks on a contract and
          filtering by block_id yields the contracts on a block. Two contracts sharing one block
          plus one contract holding two blocks is the smallest fixture where a naive one-to-many
          implementation gives a wrong answer on one of the two filters.
        test_recipe:
          setup:
            - "One producer, two blocks, two contracts. Contract 1 holds both blocks; contract 2 holds block 1 only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_1: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-13", varietal: "MERLOT", acres: 6.000, expected_yield_tons_per_acre: 2.500, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_2: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-LINK-1", contract_basis: "ACREAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2027, contracted_yield_tons_per_acre: 2.500, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_1: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-LINK-2", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2027, committed_tons: 30.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_2: $.data.id }
          trigger:
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_1}", block_id: "${block_1}", allocated_acres: 12.500 }
              as: GrowerRelationsManager
              captures: { allocation_1: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_1}", block_id: "${block_2}", allocated_acres: 6.000 }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_2}", block_id: "${block_1}" }
              as: GrowerRelationsManager
            - call: "GET /grower-relations/contract-block-allocations/${allocation_1}"
              as: GrowerRelationsManager
            - call: "GET /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_1}" }
              as: GrowerRelationsManager
            - call: "GET /grower-relations/contract-block-allocations"
              payload: { block_id: "${block_1}" }
              as: GrowerRelationsManager
            - call: "GET /grower-relations/grape-contracts/${contract_1}"
              as: GrowerRelationsManager
          assert:
            - "All three links are created with 201; the ACREAGE parents carry allocated_acres and the TONNAGE parent must omit it (priority 9)"
            - "The detail read of ${allocation_1} returns contract_id ${contract_1}, block_id ${block_1} and allocated_acres 12.500"
            - "Filtering by contract_id ${contract_1} returns total_count == 2 — the contract's two blocks"
            - "Filtering by block_id ${block_1} returns total_count == 2 — the two contracts holding that block, which a one-to-many implementation cannot produce"
            - "Contract ${contract_1} reports contract_cap_tons == 46.250 (12.500 + 6.000 allocated acres times 2.500 t/acre), so the junction rows really feed the cap derivation"

      - name: action_is_admitted_only_while_the_referenced_entity_is_in_the_required_state
        claim_type: Conditional action
        excluded_because:
          difficulty_instance: pick_call_issuance_requires_completed_pick_ready_sampling_visit
          rationale: |
            §1.8's cross_entity_state_dependency rule holds three instances that are exactly
            this claim at a harder setting: pick-call issuance against a SamplingVisit that is
            SCHEDULED, then COMPLETED but NOT_READY, then COMPLETED and PICK_READY; appointment
            creation against an ISSUED versus ACKNOWLEDGED pick call; and contract acceptance
            against a SUSPENDED versus ACTIVE producer.

      - name: quality_spec_create_read_list_is_the_whole_crud_surface
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /grower-relations/quality-specs]
          - endpoints[GET /grower-relations/quality-specs/{specId}]
          - endpoints[GET /grower-relations/quality-specs]
        distinguishing_aspect: |
          §1.5 declares POST plus two GETs for every entity and NO PUT, PATCH or DELETE
          anywhere: the record set is append-only and every mutation runs through a named action
          endpoint. This instance pins the create/read/list triangle on the most parameter-heavy
          entity — all thirteen optional grading knobs supplied at once — and confirms the read
          returns exactly what was written rather than the defaults.
        test_recipe:
          setup:
            - "Empty database; the clock is set so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "PINOT-PREMIUM-2026", min_brix_accept: 21.5, brix_bonus_start: 25.0, brix_penalty_start: 23.0, rot_rejection_pct: 6.0, min_brix_pick_call: 22.0, brix_step: 0.2, brix_bonus_pct_per_step: 1.0, brix_penalty_pct_per_step: 1.5, ta_min_gl: 6.0, ta_max_gl: 8.5, acid_out_of_spec_penalty_pct: 2.0, rot_free_pct: 1.0, rot_penalty_pct_per_point: 2.5, mog_max_pct: 0.8, mog_penalty_pct: 3.0, max_total_bonus_pct: 10.0, max_total_penalty_pct: 25.0 }
              as: QualityLabTech
              captures: { spec_id: $.data.id }
            - call: "GET /grower-relations/quality-specs/${spec_id}"
              as: GrowerRelationsManager
            - call: "GET /grower-relations/quality-specs"
              payload: { spec_code: "PINOT-PREMIUM-2026" }
              as: HarvestCoordinator
            - call: "GET /grower-relations/quality-specs"
              payload: { spec_code: "NO-SUCH-SPEC" }
              as: HarvestCoordinator
          assert:
            - "The create returns 201 with created_at == 2026-08-01T00:00:00Z, updated_at == created_at and version == 1"
            - "The detail read echoes all seventeen supplied values unchanged — in particular brix_step 0.2, max_total_bonus_pct 10.0 and max_total_penalty_pct 25.0, none of which are the declared defaults"
            - "The filtered listing returns total_count == 1 with has_more false, and is served to HarvestCoordinator as well as to the manager"
            - "The listing for an unknown spec_code returns 200 with data [] and total_count == 0 — a filter miss is an empty page, never a 404"
            - "No PUT, PATCH or DELETE route exists for quality-specs (or for any other entity) in §1.5: specs are immutable once written and superseded by creating a new one"

  # ===========================================================================
  # SECTION 6 — Errors (claim-extraction-guide "From Table 6")
  #
  # Coverage audit of all 55 catalogue ids. 45 of them are triggered by named
  # §1.9 instances above/below:
  #   ERR_MISSING_AUTH_HEADER          -> rbac: missing_auth_header_returns_401
  #   ERR_UNAUTHORIZED                 -> rbac: role_not_listed_on_the_endpoint_returns_403
  #   ERR_NOT_CONTRACT_GROWER          -> rbac: grower_cannot_act_on_another_producers_contract
  #   ERR_SOD_SAME_USER_GRADING        -> rbac: same_user_cannot_weigh_and_grade_the_same_load
  #   ERR_GROWER_NOT_FOUND .. ERR_INSTALLMENT_NOT_FOUND (13 ids)
  #                                    -> entities: path_id_not_found_returns_404_for_every_entity
  #                                       and body_foreign_key_that_does_not_resolve_returns_404_not_422
  #   ERR_VALIDATION                   -> entities: missing_required_field_returns_422_validation
  #                                       and enum_range_and_decimal_place_type_constraints_returns_422
  #   ERR_INVALID_PAGINATION           -> validations: pagination_bounds_are_enforced_and_return_400
  #   ERR_BASIS_FIELD_MISMATCH         -> validations: basis_conditional_field_rules_reject_mismatched_payloads_422
  #   ERR_INVALID_INSTALLMENT_PLAN     -> validations: malformed_installment_plans_are_rejected_422
  #   ERR_DUPLICATE_CODE               -> validations: uniqueness_violations_return_409_duplicate_code
  #   ERR_STALE_APPOINTMENT_VERSION    -> cross_cutting: stale_expected_versions_are_refused_412_on_both_concurrency_rules
  #   ERR_STALE_WEIGH_TAG_VERSION      -> cross_cutting: stale_expected_versions_are_refused_412_on_both_concurrency_rules
  #                                       and state_machines: disputing_a_pending_tag_and_regrading_a_decided_tag_are_rejected_409
  #   ERR_CONTRACT_STATE_INVALID       -> state_machines: withdrawn_contract_is_terminal_and_rejects_every_further_trigger
  #   ERR_PICK_CALL_STATE_INVALID      -> validations: acknowledging_exactly_at_the_ack_deadline_is_refused_409
  #   ERR_LANE_CLOSED                  -> validations: delivery_appointment_lane_guards_reject_closed_lane_and_oversize_load
  #   ERR_TAG_WEIGH_STATE_INVALID      -> state_machines: taring_twice_and_grading_before_tare_are_rejected_409
  #                                       and settlement_close_is_blocked_until_every_load_is_tared_and_graded
  #   ERR_TAG_NOT_DISPUTABLE           -> state_machines: disputing_a_pending_tag_and_regrading_a_decided_tag_are_rejected_409
  #   ERR_INSTALLMENT_NOT_PAYABLE      -> state_machines: paying_an_installment_before_settlement_close_is_rejected_409
  #   ERR_MAX_PICK_CALL_REVISIONS_EXCEEDED -> validations: pick_call_notice_floor_and_revision_ceiling_are_enforced
  #   ERR_RENEWAL_WINDOW_NOT_OPEN      -> validations: renewal_is_gated_by_both_the_window_and_the_lifetime_reliability_score
  #   ERR_RELIABILITY_BELOW_RENEWAL_THRESHOLD -> same instance
  #   ERR_NO_PROVISIONAL_LINES         -> validations: settlement_close_without_provisional_lines_is_refused
  #   ERR_GROWER_SUSPENDED             -> endpoints: suspend_and_reinstate_round_trip_the_producers_standing
  #   ERR_INSUFFICIENT_PICK_NOTICE     -> validations: pick_call_notice_floor_and_revision_ceiling_are_enforced
  #   ERR_ACK_WINDOW_CLOSED            -> validations: acknowledging_exactly_at_the_ack_deadline_is_refused_409
  #   ERR_DISPUTE_WINDOW_CLOSED        -> validations: dispute_window_is_seventy_two_hours_from_the_first_grading_only
  #   ERR_TERMINATION_NOTICE_TOO_SHORT -> validations: termination_notice_shorter_than_the_contractual_period_is_refused
  #   ERR_BLOCK_NOT_ALLOCATED          -> validations: block_reference_guards_reject_unallocated_and_foreign_blocks
  #   ERR_BLOCK_GROWER_MISMATCH        -> same instance
  #   ERR_CREW_REGION_MISMATCH         -> validations: sampling_crew_must_cover_the_producers_region
  #   ERR_LOAD_EXCEEDS_LANE_MAX        -> validations: delivery_appointment_lane_guards_reject_closed_lane_and_oversize_load
  #   ERR_PAYMENT_EXCEEDS_BALANCE      -> validations: producer_lien_is_grower_wide_and_overpayment_is_refused
  #   ERR_LIEN_OUTSTANDING             -> same instance
  # The remaining 10 ids are asserted inside named §1.8 instances and are stubbed below.
  # ===========================================================================
  - section: errors
    instances:
      - name: err_appointment_not_open_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: appointment_state_outranks_arrival_window
          rationale: |
            That priority-pair instance cancels the appointment and then presents a weigh tag,
            asserting ERR_APPOINTMENT_NOT_OPEN both when the clock is outside the arrival
            envelope (proving it outranks priority 36) and when the clock is inside it.

      - name: err_outside_appointment_window_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: appointment_state_outranks_arrival_window
          rationale: |
            The same instance repairs the state defect and leaves the temporal one, so
            ERR_OUTSIDE_APPOINTMENT_WINDOW is observed on a SCHEDULED appointment whose arrival
            grace has lapsed — including the boundary at exactly window_end plus 60 minutes.

      - name: err_max_offer_rounds_exceeded_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: grape_contract_cyclic_negotiation_with_independent_renewal_dimension
          rationale: |
            The cyclic-negotiation instance walks the DRAFT/OFFERED/COUNTERED loop until
            offer_round reaches MAX_OFFER_ROUNDS and asserts the fourth offer returns
            ERR_MAX_OFFER_ROUNDS_EXCEEDED, which is the loop-termination guarantee itself.

      - name: err_no_allocations_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: contract_accept_requires_active_grower
          rationale: |
            That cross-entity instance accepts a contract with no ContractBlockAllocation to
            show ERR_NO_ALLOCATIONS, then adds the allocation and re-runs the accept, which is
            also how it isolates the producer-standing guard from the allocation guard.

      - name: err_block_not_pick_ready_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: pick_call_issuance_requires_completed_pick_ready_sampling_visit
          rationale: |
            The maturity gate is that instance's subject: it issues a pick call against a
            SCHEDULED visit, then a COMPLETED but NOT_READY visit, then a PICK_READY visit whose
            measured_rot_pct sits above rot_rejection_pct, and only then a compliant one.

      - name: err_lane_window_conflict_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: crush_pad_lane_buffered_adjacency_one_minute_either_side
          rationale: |
            Lane exclusivity is probed there one minute inside the buffered edge on both sides
            of an incumbent appointment, so ERR_LANE_WINDOW_CONFLICT is triggered twice with the
            accepted adjacent bookings alongside it.

      - name: err_crew_window_overlap_limit_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: sampling_crew_aggregate_concurrency_with_half_open_adjacency
          rationale: |
            The crew-saturation instance books max_concurrent_visits overlapping visits and then
            one more, asserting ERR_CREW_WINDOW_OVERLAP_LIMIT, and separately books a visit that
            starts exactly when another ends to prove the half-open comparison.

      - name: err_appointment_outside_pick_window_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: pick_window_temporal_outranks_lane_daily_capacity
          rationale: |
            That priority-pair instance books a window before target_pick_at and another beyond
            target_pick_at plus DELIVERY_GRACE_HOURS, asserting
            ERR_APPOINTMENT_OUTSIDE_PICK_WINDOW at both edges of the envelope.

      - name: err_lane_daily_capacity_exceeded_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: lane_daily_capacity_exact_equality_accepted
          rationale: |
            The boundary instance fills a lane to exactly daily_capacity_tons, accepts that
            booking, and then adds 0.001 t to trigger ERR_LANE_DAILY_CAPACITY_EXCEEDED, which
            also proves the aggregate is scoped to one UTC calendar date.

      - name: err_tare_exceeds_gross_is_triggerable
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: zero_net_weight_tare_equals_gross_boundary
          rationale: |
            The zero-net instance tares a load at exactly gross_weight_lbs (accepted, net_tons
            0.000) and then at gross plus one pound, which is where ERR_TARE_EXCEEDS_GROSS
            appears; both halves are needed because the rule is an inclusive comparison.

  # ===========================================================================
  # SECTION 7 — RBAC (claim-extraction-guide "From Table 7")
  # role_model is segregation_of_duties, so the guide's extra row is covered by
  # same_user_cannot_weigh_and_grade_the_same_load below. Every `as:` value names
  # the X-User-Role header; the X-User-ID header is called out in the setup notes
  # wherever it matters.
  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_returns_401_before_any_other_check
        claim_type: Cannot perform other roles' operations
        grounds:
          - validations.priority_1
          - errors[ERR_MISSING_AUTH_HEADER]
        distinguishing_aspect: |
          Priority 1 outranks existence (5, 6) and shape (7), so a request with no headers must
          return 401 even when the path id is nonsense and the body is malformed. An
          implementation that authenticates inside the handler returns 404 or 422 first and
          leaks the existence of rows to an unauthenticated caller.
        test_recipe:
          setup:
            - "One producer exists. Every trigger call is sent with NO X-User-ID and NO X-User-Role header (as: NONE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
          trigger:
            - call: "GET /grower-relations/growers/${grower_id}"
              as: NONE
              captures: { e1: $.data.error_id }
            - call: "GET /grower-relations/growers/00000000-0000-0000-0000-000000000000"
              as: NONE
              captures: { e2: $.data.error_id }
            - call: "POST /grower-relations/growers"
              payload: { name: "No Licence Supplied" }
              as: NONE
              captures: { e3: $.data.error_id }
            - call: "GET /grower-relations/growers"
              payload: { limit: 0 }
              as: NONE
              captures: { e4: $.data.error_id }
          assert:
            - "${e1} == ERR_MISSING_AUTH_HEADER with HTTP 401 on a request that would otherwise have succeeded"
            - "${e2} == ERR_MISSING_AUTH_HEADER, NOT ERR_GROWER_NOT_FOUND: authentication precedes existence, so no row is probed"
            - "${e3} == ERR_MISSING_AUTH_HEADER, NOT ERR_VALIDATION, even though license_number and region_code are missing"
            - "${e4} == ERR_MISSING_AUTH_HEADER, NOT ERR_INVALID_PAGINATION"
            - "A blank X-User-Role with a present X-User-ID produces the same 401: the rule requires both headers non-blank"

      - name: role_not_listed_on_the_endpoint_returns_403
        claim_type: Cannot perform other roles' operations
        grounds:
          - validations.priority_2
          - errors[ERR_UNAUTHORIZED]
          - roles
        distinguishing_aspect: |
          Priority 2 has two clauses — the role must be one of the six declared names AND must
          appear in the endpoint's own roles list — and both must be enforced with the same 403.
          The probes walk the exclusive operations of four different roles from the wrong side,
          which is the only way to catch a table that was built per-role instead of per-endpoint,
          and then re-run each one from the right role to show the entry is genuinely permitted.
        test_recipe:
          setup:
            - "One producer, one block, one spec and one DRAFT contract with an allocation, so the wrongly-roled calls fail on authorisation rather than on state."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: QualityLabTech
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-RBAC", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2027, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/growers"
              payload: { name: "Cellar Intern Ltd", license_number: "PL-99999", region_code: "NAPA-NORTH" }
              as: WineryIntern
              captures: { e1: $.data.error_id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: ScaleOperator
              captures: { e2: $.data.error_id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: GrowerRelationsManager
              captures: { e3: $.data.error_id }
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${block_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T11:00:00Z" }
              as: AccountsPayableClerk
              captures: { e4: $.data.error_id }
            - call: "GET /grower-relations/payment-installments"
              payload: { contract_id: "${contract_id}" }
              as: ScaleOperator
              captures: { e5: $.data.error_id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
          assert:
            - "${e1} == ERR_UNAUTHORIZED with HTTP 403: WineryIntern is not one of the six declared roles, so the first clause of priority 2 rejects it before the endpoint list is consulted"
            - "${e2} == ERR_UNAUTHORIZED: offering a contract is exclusive to GrowerRelationsManager"
            - "${e3} == ERR_UNAUTHORIZED: accepting is exclusive to Grower, so the manager cannot accept its own offer — the negotiation genuinely needs two parties"
            - "${e4} == ERR_UNAUTHORIZED: AccountsPayableClerk is not on POST /grower-relations/sampling-visits, and the 403 precedes the priority-6 existence check that the bogus crew_id would otherwise fail"
            - "${e5} == ERR_UNAUTHORIZED on a GET as well: payment-installment reads are limited to GrowerRelationsManager and AccountsPayableClerk"
            - "The same offer and accept succeed when sent as GrowerRelationsManager and Grower respectively, so each rejection was about the role and nothing else"

      - name: grower_cannot_act_on_another_producers_rows
        claim_type: Cannot perform other roles' operations
        grounds:
          - validations.priority_3
          - errors[ERR_NOT_CONTRACT_GROWER]
          - roles[Grower].identity
        distinguishing_aspect: |
          The Grower role is entity_backed, so authorisation is per-ROW rather than per-role: the
          403 depends on comparing X-User-ID with the Grower reached from the target. Producer B
          holds a legitimate Grower role and a legitimate contract of its own, so an
          implementation that only checks the role name lets B accept A's offer at A's price.
          The counter path matters just as much as the accept path, because a counter mutates the
          negotiated price.
        test_recipe:
          setup:
            - "Producers A and B, each with a block, a contract and an allocation; A's contract is OFFERED. Every Grower-role trigger call carries X-User-ID = producer B's id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_a: $.data.id }
            - call: "POST /grower-relations/growers"
              payload: { name: "Stonegate Ranch", license_number: "PL-44822", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_b: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_a}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_a: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_a}", quality_spec_id: "${spec_id}", contract_code: "GC-OWNER-A", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2027, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_a: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_a}", block_id: "${block_a}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_a}/offer"
              payload: {}
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/grape-contracts/${contract_a}/accept"
              payload: {}
              as: Grower
              captures: { e1: $.data.error_id }
            - call: "POST /grower-relations/grape-contracts/${contract_a}/counter"
              payload: { counter_base_price_per_ton_cents: 600000 }
              as: Grower
              captures: { e2: $.data.error_id }
            - call: "GET /grower-relations/vineyard-blocks/${block_a}"
              as: Grower
              captures: { e3: $.data.error_id }
            - call: "GET /grower-relations/grape-contracts/${contract_a}"
              as: Grower
              captures: { e4: $.data.error_id }
            - call: "GET /grower-relations/grape-contracts/${contract_a}"
              as: GrowerRelationsManager
          assert:
            - "${e1} == ERR_NOT_CONTRACT_GROWER with HTTP 403: producer B may not accept producer A's offer even though Grower is a permitted role on that endpoint"
            - "${e2} == ERR_NOT_CONTRACT_GROWER: the counter path is guarded identically, so B cannot re-price A's contract"
            - "${e3} == ERR_NOT_CONTRACT_GROWER on a READ: the rule covers VineyardBlock.grower_id, not just contract actions"
            - "${e4} == ERR_NOT_CONTRACT_GROWER on the contract read"
            - "The manager's read of the same contract returns 200 with lifecycle_status still OFFERED and base_price_per_ton_cents still 450000 — none of B's attempts changed anything"
            - "Producer A, sending the same accept with X-User-ID = ${grower_a}, is accepted, which isolates the identity check from every other guard"

      - name: same_user_cannot_weigh_and_grade_the_same_load
        claim_type: Segregation of duties
        grounds:
          - validations.priority_4
          - errors[ERR_SOD_SAME_USER_GRADING]
          - complexity_profile.role_model
        distinguishing_aspect: |
          The comparison is against WeighTag.captured_by_user_id, a value stamped at gross
          capture, so the check has to reach back to the row rather than look at the current
          request alone. A user holding both the scale-house and lab roles is the realistic
          fraud vector: capture a heavy gross and then grade the fruit generously. The second
          grading proves the load is not poisoned — a DIFFERENT lab user may still grade it.
        test_recipe:
          setup:
            - "Standard chain to a NET_FINAL weigh tag. The gross and tare passes are sent as ScaleOperator with X-User-ID = user-scale-1, so captured_by_user_id == user-scale-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
