  # ===========================================================================
  - section: consistency_model
    instances:
      - name: harvest_cascade_visible_in_same_request
        claim_type: immediate
        grounds: [state_machines.HarvestEvent.PROPOSED_to_EXECUTED, entities.HarvestEvent.fields.replacement_lot_id]
        distinguishing_aspect: "The harvest execute response (immediate consistency) already carries the EXECUTED status, realized_loss_cents, and replacement_lot_id — no re-read needed."
        test_recipe:
          setup: ["ACTIVE account, clean loss lot 5sh/60000 in A, replacement B 4000 correlation 0.05."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "IM", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
            - call: "POST /securities"
              payload: { ticker: "IM1", asset_class: "US_EQUITY", price_cents: 10000, correlated_with: [{ticker: "IM2", correlation: 0.05}] }
              as: Advisor
              captures: { sec_a_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "IM2", asset_class: "US_EQUITY", price_cents: 4000, correlated_with: [{ticker: "IM1", correlation: 0.05}] }
              as: Advisor
              captures: { sec_b_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "immediate@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_a_id}", quantity: 5, cost_basis_cents: 60000 }
              as: Advisor
              captures: { source_lot_id: $.data.id, acct_v: $.data.version }
            - call: "POST /harvest-events"
