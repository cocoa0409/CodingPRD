# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: BoxOfficeAgent
        preconditions:
          - "Subscription.status == PENDING"
          - "Account.status == ACTIVE (the holder account is not suspended)"
          - "at least one SeatAssignment with status == ASSIGNED exists for this subscription"
        side_effects:
          - "compute renewal_price over ASSIGNED SeatAssignments; set each SeatAssignment.assigned_price_cents and Subscription.locked_price_cents"
          - "accrue priority_points_accrual onto Account.priority_points; recompute Account.loyalty_tier"
          - "set Subscription.seat_count = count of ASSIGNED SeatAssignments"
      - from: ACTIVE
        to: RELOCATING
        trigger: "POST /subscriptions/{id}/relocate (begin)"
        actor: BoxOfficeAgent
        preconditions:
          - "Subscription.status == ACTIVE"
          - "expected_subscription_version matches Subscription.version (OCC)"
        side_effects:
          - "increments Subscription.version by 1"
          - "no seat changes yet; awaiting confirm/abort"
      - from: RELOCATING
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/relocate/confirm"
        actor: BoxOfficeAgent
        preconditions:
          - "Subscription.status == RELOCATING"
          - "every target Seat in the request has status == AVAILABLE"
          - "every target Seat shares the same season window as the released seats"
        side_effects:
          - "release current ASSIGNED SeatAssignments (status -> REASSIGNED); their Seats -> AVAILABLE (Section.available_seats++)"
          - "create new SeatAssignment per target seat; those Seats -> SOLD (Section.available_seats--)"
          - "recompute renewal_price; reset Subscription.locked_price_cents and Subscription.seat_count"
          - "increments Subscription.version by 1"
      - from: RELOCATING
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/relocate/abort"
        actor: BoxOfficeAgent
        preconditions: ["Subscription.status == RELOCATING"]
        side_effects: ["no seat changes; restore ACTIVE; increments Subscription.version by 1"]
        note: "Revert leg of the relocation cycle (RELOCATING back to ACTIVE with no inventory effect)."
      - from: ACTIVE
        to: RENEWAL_OFFERED
        trigger: "POST /subscriptions/{id}/renewal/offer"
        actor: BoxOfficeAgent
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects: ["increments Subscription.version by 1"]
      - from: RENEWAL_OFFERED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/renewal/accept"
        actor: AccountHolder
        preconditions:
          - "Subscription.status == RENEWAL_OFFERED"
          - "Account.status == ACTIVE"
          - "expected_subscription_version matches Subscription.version (OCC)"
        side_effects:
          - "recompute renewal_price under the holder's current loyalty_tier; reset Subscription.locked_price_cents and each SeatAssignment.assigned_price_cents"
          - "accrue priority_points_accrual onto Account.priority_points; recompute Account.loyalty_tier; increment Account.consecutive_seasons by 1"
          - "increment Subscription.renewal_cycle by 1"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: PaymentPlan transitions to DEFAULTED"
        actor: system
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects:
          - "the subscription is frozen; SeatAssignments remain but no transfers may be created while SUSPENDED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: BoxOfficeAgent
        preconditions: ["Subscription.status in {ACTIVE, SUSPENDED}"]
        side_effects:
          - "every ASSIGNED SeatAssignment -> RELEASED; each released Seat -> AVAILABLE (Section.available_seats++); Subscription.seat_count -> 0"
          - "claw back the priority points granted at activation/renewals: Account.priority_points -= points_granted_for_this_subscription; recompute Account.loyalty_tier"
          - "any ACTIVE PaymentPlan -> CANCELLED, which voids its SCHEDULED Installments (status -> VOID)"
          - "every ACTIVE ParkingAddOn -> RELEASED (ParkingZone.active_pass_count--)"
          - "compute cancellation_refund and record it on the cancelled PaymentPlan"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: BoxOfficeAgent
        preconditions: ["Subscription.status in {ACTIVE, SUSPENDED}"]
        side_effects:
          - "same cascade as ACTIVE -> CANCELLED"

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [PAID_IN_FULL, DEFAULTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /payment-plans/{id}/installments/{seq}/pay"
        actor: FinanceClerk
        preconditions:
          - "PaymentPlan.status == ACTIVE"
          - "target Installment.status == SCHEDULED"
        side_effects:
          - "Installment.status -> PAID; PaymentPlan.amount_paid_cents += Installment.amount_cents"
        note: "Self-loop while installments remain SCHEDULED."
      - from: ACTIVE
        to: PAID_IN_FULL
        trigger: "POST /payment-plans/{id}/installments/{seq}/pay (last SCHEDULED installment)"
        actor: FinanceClerk
        preconditions:
          - "PaymentPlan.status == ACTIVE"
          - "this is the only remaining SCHEDULED Installment"
        side_effects:
          - "Installment.status -> PAID; PaymentPlan.amount_paid_cents += Installment.amount_cents; PaymentPlan.status -> PAID_IN_FULL"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /payment-plans/{id}/default"
        actor: FinanceClerk
        preconditions: ["PaymentPlan.status == ACTIVE", "at least one Installment.status == SCHEDULED remains"]
        side_effects:
          - "PaymentPlan.status -> DEFAULTED"
          - "cascade: the financed Subscription transitions ACTIVE -> SUSPENDED (then its SeatAssignments are frozen)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system event: parent Subscription cancelled"
        actor: system
        preconditions: ["PaymentPlan.status == ACTIVE"]
        side_effects: ["PaymentPlan.status -> CANCELLED; all SCHEDULED Installments -> VOID"]

  - entity: TicketTransfer
    initial_state: PENDING
    terminal_states: [FORWARDED, SOLD, CANCELLED]
    transitions:
      - from: PENDING
        to: FORWARDED
        trigger: "POST /ticket-transfers/{id}/forward"
        actor: AccountHolder
        preconditions:
          - "TicketTransfer.status == PENDING AND transfer_type == FORWARD"
          - "referenced SeatAssignment.status == ASSIGNED"
          - "the SeatAssignment's Subscription.status == ACTIVE"
          - "recipient_account_id references an Account with status == ACTIVE"
        side_effects:
          - "SeatAssignment.subscription_id is reassigned to the recipient's active subscription context; no money changes hands; payout_cents stays 0"
        note: "FORWARD branch of the fork; divergent side-effect set (no fee, no payout)."
      - from: PENDING
        to: LISTED
        trigger: "POST /ticket-transfers/{id}/list"
        actor: AccountHolder
        preconditions:
          - "TicketTransfer.status == PENDING AND transfer_type == RESALE"
          - "referenced SeatAssignment.status == ASSIGNED"
          - "the SeatAssignment's Subscription.status == ACTIVE"
          - "listing_price_cents is present and >= 0"
        side_effects: ["transfer is now visible on the marketplace; no inventory change yet"]
      - from: LISTED
        to: SOLD
        trigger: "POST /ticket-transfers/{id}/complete-sale"
        actor: BoxOfficeAgent
        preconditions:
          - "TicketTransfer.status == LISTED"
          - "recipient_account_id (buyer) references an Account with status == ACTIVE"
        side_effects:
          - "compute resale_payout; set TicketTransfer.payout_cents"
          - "original SeatAssignment.status -> REASSIGNED; seller Subscription.seat_count--"
          - "RESALE branch of the fork; divergent side-effect set (fee deducted, payout credited)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /ticket-transfers/{id}/cancel"
        actor: AccountHolder
        preconditions: ["TicketTransfer.status in {PENDING, LISTED}"]
        side_effects: ["no inventory change; transfer voided"]
      - from: LISTED
        to: CANCELLED
        trigger: "POST /ticket-transfers/{id}/cancel"
        actor: AccountHolder
        preconditions: ["TicketTransfer.status in {PENDING, LISTED}"]
        side_effects: ["delisted; no inventory change"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: relocate-begin-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/relocate"
    occ_field: "expected_subscription_version"
    description: |
      Beginning a relocation against a Subscription whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the subscription has already moved into a relocation that
      legitimately supersedes this one (or another renewal cycle has bumped the
      version), so the current client's view of the subscription is stale.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

  - rule_id: renewal-accept-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/renewal/accept"
    occ_field: "expected_subscription_version"
    description: |
      Accepting a renewal offer against a Subscription whose version has
      advanced since the client last observed it is rejected. The price the
      holder was shown was computed against an earlier version; a re-priced
      offer legitimately supersedes it, so the stale acceptance must fail.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: renewal_price
    trigger: "Subscription PENDING->ACTIVE (activate), RELOCATING->ACTIVE (relocate/confirm), and RENEWAL_OFFERED->ACTIVE (renewal/accept)"
    algorithm: tiered_pricing
    formula: |
      # per ASSIGNED SeatAssignment of the subscription:
      seat_full      = Section(seat).base_price_cents
      plan_adjusted  = floor(seat_full * SeasonPlan.price_multiplier_bps / 10000)
      loyalty_disc   = floor(plan_adjusted * loyalty_bps(Account.loyalty_tier) / 10000)
      seat_price     = max(plan_adjusted - loyalty_disc, MIN_PARTIAL_FLOOR_CENTS)
      SeatAssignment.assigned_price_cents = seat_price
      # subscription total = sum over ASSIGNED seats:
      Subscription.locked_price_cents = sum(seat_price for each ASSIGNED SeatAssignment)
    input_set: "SeatAssignment rows with status == ASSIGNED for this Subscription; each joined to its Seat's Section and the Subscription's SeasonPlan and the Account's loyalty_tier."
    constants:
      MIN_PARTIAL_FLOOR_CENTS: 100000
      loyalty_bps_BRONZE: 0
      loyalty_bps_SILVER: 500
      loyalty_bps_GOLD: 1000
    precision: "integer cents; floor on each intermediate bps multiply; the max() floor applies AFTER the loyalty discount"
    variants:
      - name: full_season
        when: "SeasonPlan.plan_type == FULL (price_multiplier_bps == 10000)"
        difference: "plan_adjusted == seat_full; the MIN_PARTIAL_FLOOR rarely binds since full-season prices exceed the floor."
      - name: partial_season
        when: "SeasonPlan.plan_type == PARTIAL (price_multiplier_bps < 10000)"
        difference: "plan_adjusted is prorated down by the multiplier, so the MIN_PARTIAL_FLOOR_CENTS clamp can bind and raise seat_price above the prorated-minus-discount value."

  - name: priority_points_accrual
    trigger: "Subscription PENDING->ACTIVE (activate) and RENEWAL_OFFERED->ACTIVE (renewal/accept)"
    algorithm: weighted_scoring
    formula: |
      base_points  = seat_count * SEAT_POINT_VALUE
      tenure_bonus = Account.consecutive_seasons * TENURE_POINT_VALUE
      raw          = base_points + tenure_bonus
      points_earned = raw + (PLAYOFF_BONUS_PER_SEAT * seat_count IF SeasonPlan.includes_playoffs ELSE 0)
      Account.priority_points += points_earned
    input_set: "seat_count = count of ASSIGNED SeatAssignments for the subscription at the moment of the transition; Account.consecutive_seasons as stored; SeasonPlan.includes_playoffs flag."
    constants:
      SEAT_POINT_VALUE: 100
      TENURE_POINT_VALUE: 50
      PLAYOFF_BONUS_PER_SEAT: 200
    precision: "integer points; no rounding (all factors integer)"
    variants:
      - name: standard_accrual
        when: "SeasonPlan.includes_playoffs == false"
        difference: "points_earned = base_points + tenure_bonus, no playoff term."
      - name: playoff_accrual
        when: "SeasonPlan.includes_playoffs == true"
        difference: "adds PLAYOFF_BONUS_PER_SEAT * seat_count on top of the standard accrual."

  - name: resale_payout
    trigger: "TicketTransfer LISTED->SOLD (complete-sale)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: the marketplace fee and the processing fee are
      # each rounded SEPARATELY (round-each-component-then-sum), then both are
      # subtracted from the gross. Do NOT add the two bps rates and round once
      # against the combined rate -- that produces a different cent.
      gross    = TicketTransfer.listing_price_cents
      mkt_fee  = round_half_up(gross * MARKETPLACE_FEE_BPS  / 10000)
      proc_fee = round_half_up(gross * PROCESSING_FEE_BPS   / 10000)
      TicketTransfer.payout_cents = gross - mkt_fee - proc_fee
    input_set: "the SeatAssignment referenced by the transfer and its listing_price_cents."
    constants:
      MARKETPLACE_FEE_BPS: 750
      PROCESSING_FEE_BPS: 290
    precision: "round_half_up on EACH fee component independently, then sum the two rounded fees (round-each-then-sum, NOT combine-rates-then-round)"

  - name: payment_plan_installments
    trigger: "POST /payment-plans (create)"
    algorithm: waterfall_allocation
    formula: |
      total          = Subscription.locked_price_cents             # snapshot
      down_payment   = round_half_up(total * DOWN_PAYMENT_BPS / 10000)   # Installment seq 1
      remaining      = total - down_payment
      n_rest         = installment_count - 1
      per_rest       = floor(remaining / n_rest)
      remainder      = remaining - per_rest * n_rest
      # allocation (PINNED): seq 1 = down_payment; seq 2..installment_count-1 = per_rest;
      # the LAST sequence (installment_count) = per_rest + remainder
    input_set: "Subscription.locked_price_cents at plan creation; installment_count from the request."
    constants:
      DOWN_PAYMENT_BPS: 2500
    precision: "round_half_up on down_payment; floor on per_rest; the remainder lands on the highest-sequence installment"

  - name: cancellation_refund
    trigger: "Subscription {ACTIVE,SUSPENDED}->CANCELLED (cancel)"
    algorithm: aggregation
    formula: |
      paid    = PaymentPlan.amount_paid_cents        # 0 if no payment plan exists
      fee     = round_half_up(Subscription.locked_price_cents * CANCELLATION_FEE_BPS / 10000)
      refund  = max(paid - fee, 0)
      # recorded on the cancelled PaymentPlan as its final settlement; if no plan, refund context is 0
    input_set: "PaymentPlan.amount_paid_cents for the subscription's ACTIVE/most-recent plan; Subscription.locked_price_cents."
    constants:
      CANCELLATION_FEE_BPS: 1000
    precision: "round_half_up on fee; refund floored at 0 (never negative)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "all path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "all FK fields in the body reference existing resources (account_id, season_plan_id, section_id, seat_id, subscription_id, parking_zone_id, recipient_account_id, seat_assignment_id)"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all create/action endpoints with FK body fields"

  - priority: 5
    category: business_constraint
    check: "required body fields present and well-typed; enum values within declared sets; integers within declared ranges (e.g. installment_count in [2,12], price_multiplier_bps in [0,10000])"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/action endpoints"

  - priority: 6
    category: state
    check: "target resource is in a state from which this transition is legal (e.g. activate requires PENDING; relocate/confirm requires RELOCATING; complete-sale requires LISTED; pay requires plan ACTIVE & installment SCHEDULED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "a relocation target Seat must belong to the SAME Section as the seats being released, and share the same season window; a forward/resale SeatAssignment must belong to a Subscription owned by the acting holder"
    error_id: ERR_SECTION_MISMATCH
    http_status: 422
    applies_to: "POST /subscriptions/{id}/relocate/confirm, POST /ticket-transfers"

  - priority: 8
    category: business_safety
    check: "the acting AccountHolder owns the resource they are mutating (X-User-ID == the owning Account.id along the FK chain)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "AccountHolder operations on subscriptions / transfers"

  - priority: 9
    category: business_temporal
    check: "a Seat being assigned (initial assignment or relocation target) must not already back another ASSIGNED SeatAssignment whose Subscription's season window (closed interval [season_start_date, season_end_date]) overlaps; closed-interval adjacency (shared endpoint date) counts as a collision"
    error_id: ERR_SEAT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /seat-assignments, POST /subscriptions/{id}/relocate/confirm"

  - priority: 10
    category: business_constraint
    check: "a ParkingAddOn cannot be created when the target ParkingZone is at aggregate capacity (active_pass_count >= capacity)"
    error_id: ERR_PARKING_ZONE_FULL
    http_status: 409
    applies_to: "POST /parking-addons"

  - priority: 11
    category: business_constraint
    check: "a RESALE TicketTransfer requires listing_price_cents and forbids it for FORWARD; a transfer requires the referenced SeatAssignment to be ASSIGNED and its Subscription ACTIVE (not SUSPENDED/CANCELLED)"
    error_id: ERR_TRANSFER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /ticket-transfers, POST /ticket-transfers/{id}/forward, POST /ticket-transfers/{id}/list, POST /ticket-transfers/{id}/complete-sale"

  - priority: 12
    category: business_constraint
    check: "at most one ACTIVE PaymentPlan may exist per Subscription"
    error_id: ERR_PAYMENT_PLAN_EXISTS
    http_status: 409
    applies_to: "POST /payment-plans"

  - priority: 13
    category: business_fiscal
    check: "OCC: expected_subscription_version must equal Subscription.version for relocation-begin and renewal/accept"
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/relocate, POST /subscriptions/{id}/renewal/accept"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Section ----
  - method: POST
    path: "/sections"
    description: "Create a seating section."
    roles: [BoxOfficeAgent]
    code: 201
    input: [name, tier, base_price_cents]
    output: Section
    side_effects: ["total_seats=0, available_seats=0"]
  - method: GET
    path: "/sections/{id}"
    description: "Fetch a section with computed inventory counts."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: []
    output: Section
    side_effects: []
  - method: GET
    path: "/sections"
    description: "List sections."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: Section[]
    side_effects: []
  - method: GET
    path: "/sections/{id}/seats"
    description: "List seats belonging to a section (FK reverse lookup for Seat.section_id)."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Seat[]
    side_effects: []

  # ---- Seat ----
  - method: POST
    path: "/seats"
    description: "Create a seat within a section."
    roles: [BoxOfficeAgent]
    code: 201
    input: [section_id, row_label, seat_number, season_start_date, season_end_date]
    output: Seat
    side_effects: ["status defaults to AVAILABLE; Section.total_seats++ and Section.available_seats++"]
  - method: GET
    path: "/seats/{id}"
    description: "Fetch a seat."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: []
    output: Seat
    side_effects: []
  - method: GET
    path: "/seats"
    description: "List seats, filterable by section."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["section_id?", "status?", "limit?", "offset?"]
    output: Seat[]
    side_effects: []

  # ---- Account ----
  - method: POST
    path: "/accounts"
    description: "Register an account holder."
    roles: [BoxOfficeAgent]
    code: 201
    input: [full_name, email, "consecutive_seasons?"]
    output: Account
    side_effects: ["priority_points=0, loyalty_tier=BRONZE, status=ACTIVE"]
  - method: GET
    path: "/accounts/{id}"
    description: "Fetch an account with computed loyalty_tier."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List accounts."
    roles: [BoxOfficeAgent, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: POST
    path: "/accounts/{id}/suspend"
    description: "Suspend an account (administrative)."
    roles: [BoxOfficeAgent]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.status -> SUSPENDED"]
  - method: GET
    path: "/accounts/{id}/subscriptions"
    description: "List subscriptions for an account (FK reverse lookup for Subscription.account_id)."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  # ---- SeasonPlan ----
  - method: POST
    path: "/season-plans"
    description: "Create a season plan template."
    roles: [BoxOfficeAgent]
    code: 201
    input: [name, plan_type, game_count, price_multiplier_bps, "includes_playoffs?"]
    output: SeasonPlan
    side_effects: []
  - method: GET
    path: "/season-plans/{id}"
    description: "Fetch a season plan."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: []
    output: SeasonPlan
    side_effects: []
  - method: GET
    path: "/season-plans"
    description: "List season plans."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["plan_type?", "limit?", "offset?"]
    output: SeasonPlan[]
    side_effects: []

  # ---- Subscription ----
  - method: POST
    path: "/subscriptions"
    description: "Create a PENDING subscription for an account under a plan."
    roles: [BoxOfficeAgent]
    code: 201
    input: [account_id, season_plan_id]
    output: Subscription
    side_effects: ["status=PENDING, locked_price_cents=0, seat_count=0, renewal_cycle=0"]
  - method: GET
    path: "/subscriptions/{id}"
    description: "Fetch a subscription with computed locked_price_cents and seat_count."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions, filterable by account or plan."
    roles: [BoxOfficeAgent, FinanceClerk]
    code: 200
    input: ["account_id?", "season_plan_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/activate"
    description: "Activate a PENDING subscription; prices seats and accrues points."
    roles: [BoxOfficeAgent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["renewal_price computed; priority_points_accrual; seat_count set; status -> ACTIVE"]
  - method: POST
    path: "/subscriptions/{id}/relocate"
    description: "Begin a seat relocation (moves ACTIVE -> RELOCATING under OCC)."
    roles: [BoxOfficeAgent]
    code: 200
    input: [expected_subscription_version]
    output: Subscription
    side_effects: ["status -> RELOCATING; increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/relocate/confirm"
    description: "Confirm relocation onto target seats; releases old seats, assigns new, reprices."
    roles: [BoxOfficeAgent]
    code: 200
    input: [target_seat_ids]
    output: Subscription
    side_effects: ["old SeatAssignments REASSIGNED & Seats AVAILABLE; new SeatAssignments ASSIGNED & Seats SOLD; renewal_price recomputed; status -> ACTIVE; increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/relocate/abort"
    description: "Abort an in-progress relocation."
    roles: [BoxOfficeAgent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> ACTIVE; increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/renewal/offer"
    description: "Offer renewal to the holder (ACTIVE -> RENEWAL_OFFERED)."
    roles: [BoxOfficeAgent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> RENEWAL_OFFERED; increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/renewal/accept"
    description: "Holder accepts the renewal offer (RENEWAL_OFFERED -> ACTIVE under OCC); reprices and accrues points."
    roles: [AccountHolder]
    code: 200
    input: [expected_subscription_version]
    output: Subscription
    side_effects: ["renewal_price recomputed; priority_points_accrual; consecutive_seasons++; renewal_cycle++; status -> ACTIVE; increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a subscription; cascades seat release, points clawback, plan cancellation, parking release, refund."
    roles: [BoxOfficeAgent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["SeatAssignments RELEASED & Seats AVAILABLE; priority_points clawed back; PaymentPlan CANCELLED & Installments VOID; ParkingAddOns RELEASED; cancellation_refund recorded; status -> CANCELLED"]

  # ---- SeatAssignment ----
  - method: POST
    path: "/seat-assignments"
    description: "Assign a seat to a PENDING subscription (initial seating)."
    roles: [BoxOfficeAgent]
    code: 201
    input: [subscription_id, seat_id]
    output: SeatAssignment
    side_effects: ["Seat.status -> SOLD (Section.available_seats--); status=ASSIGNED; Subscription.seat_count++"]
  - method: GET
    path: "/seat-assignments/{id}"
    description: "Fetch a seat assignment."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: []
    output: SeatAssignment
    side_effects: []
  - method: GET
    path: "/seat-assignments"
    description: "List seat assignments, filterable by subscription or seat (FK reverse lookup for both FKs)."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["subscription_id?", "seat_id?", "status?", "limit?", "offset?"]
    output: SeatAssignment[]
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}/seat-assignments"
    description: "List seat assignments under a subscription (FK reverse lookup)."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SeatAssignment[]
    side_effects: []

  # ---- PaymentPlan / Installment ----
  - method: POST
    path: "/payment-plans"
    description: "Create an installment plan financing a subscription's locked_price_cents."
    roles: [FinanceClerk]
    code: 201
    input: [subscription_id, installment_count]
    output: PaymentPlan
    side_effects: ["total_cents snapshot; payment_plan_installments waterfall generates Installment rows; status=ACTIVE"]
  - method: GET
    path: "/payment-plans/{id}"
    description: "Fetch a payment plan."
    roles: [FinanceClerk, AccountHolder, BoxOfficeAgent]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []
  - method: GET
    path: "/payment-plans"
    description: "List payment plans, filterable by subscription (FK reverse lookup for PaymentPlan.subscription_id)."
    roles: [FinanceClerk, BoxOfficeAgent]
    code: 200
    input: ["subscription_id?", "status?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []
  - method: GET
    path: "/payment-plans/{id}/installments"
    description: "List installments of a plan (FK reverse lookup for Installment.payment_plan_id)."
    roles: [FinanceClerk, AccountHolder, BoxOfficeAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []
  - method: GET
    path: "/installments/{id}"
    description: "Fetch a single installment."
    roles: [FinanceClerk, AccountHolder, BoxOfficeAgent]
    code: 200
    input: []
    output: Installment
    side_effects: []
  - method: POST
    path: "/payment-plans/{id}/installments/{seq}/pay"
    description: "Pay a scheduled installment by sequence number; closes the plan when the last is paid."
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Installment
    side_effects: ["Installment.status -> PAID; PaymentPlan.amount_paid_cents += amount; plan -> PAID_IN_FULL if last"]
  - method: POST
    path: "/payment-plans/{id}/default"
    description: "Declare a payment plan in default; suspends the financed subscription."
    roles: [FinanceClerk]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status -> DEFAULTED; cascade Subscription ACTIVE -> SUSPENDED"]

  # ---- TicketTransfer ----
  - method: POST
    path: "/ticket-transfers"
    description: "Create a PENDING forward or resale against a seat assignment."
    roles: [AccountHolder]
    code: 201
    input: [seat_assignment_id, transfer_type, "recipient_account_id?", "listing_price_cents?"]
    output: TicketTransfer
    side_effects: ["status=PENDING, payout_cents=0"]
  - method: GET
    path: "/ticket-transfers/{id}"
    description: "Fetch a transfer."
    roles: [AccountHolder, BoxOfficeAgent]
    code: 200
    input: []
    output: TicketTransfer
    side_effects: []
  - method: GET
    path: "/ticket-transfers"
    description: "List transfers, filterable by seat assignment or recipient account (FK reverse lookup for TicketTransfer.seat_assignment_id and TicketTransfer.recipient_account_id)."
    roles: [AccountHolder, BoxOfficeAgent]
    code: 200
    input: ["seat_assignment_id?", "recipient_account_id?", "status?", "transfer_type?", "limit?", "offset?"]
    output: TicketTransfer[]
    side_effects: []
  - method: POST
    path: "/ticket-transfers/{id}/forward"
    description: "Execute a FORWARD (gift) transfer."
    roles: [AccountHolder]
    code: 200
    input: []
    output: TicketTransfer
    side_effects: ["status -> FORWARDED; SeatAssignment reassigned to recipient; payout_cents stays 0"]
  - method: POST
    path: "/ticket-transfers/{id}/list"
    description: "List a RESALE transfer on the marketplace."
    roles: [AccountHolder]
    code: 200
    input: []
    output: TicketTransfer
    side_effects: ["status -> LISTED"]
  - method: POST
    path: "/ticket-transfers/{id}/complete-sale"
    description: "Complete a marketplace resale to a buyer; computes payout."
    roles: [BoxOfficeAgent]
    code: 200
    input: [recipient_account_id]
    output: TicketTransfer
    side_effects: ["resale_payout computed; payout_cents set; original SeatAssignment REASSIGNED; seller seat_count--; status -> SOLD"]
  - method: POST
    path: "/ticket-transfers/{id}/cancel"
    description: "Cancel a pending or listed transfer."
    roles: [AccountHolder]
    code: 200
    input: []
    output: TicketTransfer
    side_effects: ["status -> CANCELLED"]

  # ---- ParkingZone / ParkingAddOn ----
  - method: POST
    path: "/parking-zones"
    description: "Create a parking zone with finite capacity."
    roles: [BoxOfficeAgent]
    code: 201
    input: [name, capacity, price_cents]
    output: ParkingZone
    side_effects: ["active_pass_count=0"]
  - method: GET
    path: "/parking-zones/{id}"
    description: "Fetch a parking zone with computed active_pass_count."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: []
    output: ParkingZone
    side_effects: []
  - method: GET
    path: "/parking-zones"
    description: "List parking zones."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: ParkingZone[]
    side_effects: []
  - method: POST
    path: "/parking-addons"
    description: "Add a parking pass to a subscription, drawing from a zone's capacity."
    roles: [BoxOfficeAgent, AccountHolder]
    code: 201
    input: [subscription_id, parking_zone_id]
    output: ParkingAddOn
    side_effects: ["price_cents snapshot from zone; status=ACTIVE; ParkingZone.active_pass_count++"]
  - method: GET
    path: "/parking-addons/{id}"
    description: "Fetch a parking add-on."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: []
    output: ParkingAddOn
    side_effects: []
  - method: GET
    path: "/parking-addons"
    description: "List parking add-ons, filterable by subscription or zone (FK reverse lookup for both FKs)."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["subscription_id?", "parking_zone_id?", "status?", "limit?", "offset?"]
    output: ParkingAddOn[]
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}/parking-addons"
    description: "List parking add-ons under a subscription (FK reverse lookup)."
    roles: [BoxOfficeAgent, AccountHolder, FinanceClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ParkingAddOn[]
    side_effects: []

  # ---- Test-driving endpoint ----
  - method: POST
    path: "/_accounts/{id}/grant-points"
    description: "Test/admin: directly set an account's priority_points to drive loyalty_tier boundary scenarios that natural accrual would take many seasons to reach."
    roles: [BoxOfficeAgent]
    code: 200
    input: [priority_points]
    output: Account
    side_effects: ["Account.priority_points set to the given value; loyalty_tier recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not permitted to perform this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path-referenced resource does not exist"
  - id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 404
    condition: "an FK in the request body references a nonexistent resource"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing/invalid body field, bad enum, or out-of-range integer"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state from which this transition is legal"
  - id: ERR_SECTION_MISMATCH
    http: 422
    condition: "a relocation target seat is in a different section (or season window) than the released seats, or a holder acts on a seat assignment they do not own"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an AccountHolder attempts to mutate a subscription/transfer they do not own"
  - id: ERR_SEAT_WINDOW_CONFLICT
    http: 409
    condition: "a seat is already backed by an ASSIGNED assignment whose season window overlaps (closed interval, adjacency counts)"
  - id: ERR_PARKING_ZONE_FULL
    http: 409
    condition: "ParkingZone.active_pass_count >= capacity"
  - id: ERR_TRANSFER_NOT_ELIGIBLE
    http: 409
    condition: "transfer preconditions fail: assignment not ASSIGNED, subscription not ACTIVE, listing_price missing for RESALE, or listing_price present for FORWARD"
  - id: ERR_PAYMENT_PLAN_EXISTS
    http: 409
    condition: "an ACTIVE PaymentPlan already exists for the subscription"
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    condition: "expected_subscription_version does not equal Subscription.version on an OCC-guarded write"
  - id: ERR_VALIDATION_FROM_TERMINAL
    http: 409
    condition: "attempt to transition a resource already in a terminal state (CANCELLED subscription, PAID_IN_FULL/DEFAULTED/CANCELLED plan, FORWARDED/SOLD/CANCELLED transfer)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BoxOfficeAgent
    description: "Box office operator who manages inventory (sections, seats, parking zones), accounts, plans, subscriptions, seat assignments, relocations, renewals, cancellations, and completes resales."
    identity: "opaque"
    exclusive_operations:
      - "create/list sections, seats, season-plans, parking-zones"
      - "create accounts; suspend accounts"
      - "create subscriptions; activate; begin/confirm/abort relocation; offer renewal; cancel"
      - "create seat assignments"
      - "complete-sale on resale transfers"
      - "grant-points (test/admin)"
    shared_operations:
      - "read sections, seats, accounts, plans, subscriptions, seat-assignments, payment-plans, installments, transfers, parking-zones, parking-addons"
      - "create parking-addons (shared with AccountHolder)"

  - name: AccountHolder
    description: "Season ticket holder. Acts on subscriptions/transfers belonging to their own Account (X-User-ID == Account.id)."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "accept a renewal offer on own subscription"
      - "create/forward/list/cancel ticket transfers on own seat assignments"
    shared_operations:
      - "read own subscriptions, seat-assignments, transfers, parking-addons, sections, seats, plans, accounts"
      - "create parking-addons on own subscription (shared with BoxOfficeAgent)"

  - name: FinanceClerk
    description: "Finance operator who owns payment plans and installments."
    identity: "opaque"
    exclusive_operations:
      - "create payment-plans; pay installments; declare default"
    shared_operations:
      - "read payment-plans, installments, accounts, subscriptions, sections, seats, plans, parking-zones, parking-addons"
