            - call: "POST /leasing/pricing-offers"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", base_rent_cents: 200000, concession_type: "NONE", effective_start: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: PropertyManager
              captures: { o1_id: $.data.id }
            - call: "POST /leasing/pricing-offers/${o1_id}/publish"
              payload: {}
              as: PropertyManager
            - call: "POST /leasing/pricing-offers"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", base_rent_cents: 190000, concession_type: "NONE", effective_start: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
