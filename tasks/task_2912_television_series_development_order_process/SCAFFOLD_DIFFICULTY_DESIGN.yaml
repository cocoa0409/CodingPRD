  - rule_id: transitive_cascade
    instances:
      - name: abandonment_cascade_four_levels_into_slate_writeoff_ledger
        grounds:
          - state_machines.DevelopmentProject
          - state_machines.ScriptDeal
          - state_machines.DealStep
          - state_machines.PilotOrder
          - calculations.slate_dev_budget_ledger
          - endpoints["POST /development-projects/{id}/abandon"]
        distinguishing_aspect: |
          Destructive downward cascade fired by one write on the project. Chain:
          (1) project ACTIVE -> ABANDONED with writeoff_cents frozen,
          (2) its EXECUTED ScriptDeal -> TERMINATED and its ORDERED PilotOrder ->
          COLLAPSED, (3) caused by (2), every non-CUT_OFF DealStep -> CUT_OFF
          including the ACCEPTED one, (4) caused by (3), the Slate ledger moves the
          money out of committed_dev_cents and into writeoff_dev_cents. Level 4 is
          a numeric ledger on a grandparent aggregate, and the abandoned dollars
          stay counted, so available_dev_cents must NOT move.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one PILOT_ORDERED project with one EXECUTED ScriptDeal (step 1 ACCEPTED guaranteed, step 2 PENDING optional) and one ORDERED pilot at 33000000"
            - "slate committed_dev_cents 37375000 and available_dev_cents 362625000 before the trigger"
