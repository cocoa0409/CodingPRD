      - name: true_up_evaluation_order_breaks_circularity
        grounds:
          - calculations.true_up_reconciliation
          - entities.ComplianceFiling.fields.true_up_delta_cents
          - entities.ComplianceFiling.fields.class_true_up_lines
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency (true-up riders affect
          revenue, revenue shares allocate the true-up) resolved by pinned
          evaluation order: delta is computed from raw actuals vs authorized
          RR BEFORE any per-class line exists; the two-term max() threshold is
          evaluated before the action decision; per-class lines are rounded
          half-away-from-zero FIRST and the residual is then assigned to the
          largest-actual class. Reversing any of these steps changes the
