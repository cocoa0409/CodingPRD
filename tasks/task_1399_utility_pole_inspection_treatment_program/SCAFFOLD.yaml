scenario: |
  Utility Pole Inspection & Treatment Program (Osmose style inspector): inspection cycle & pole population sampling, decay testing & remaining-strength classification, reject/priority replacement queue, groundline treatment application & warranty, joint-use attachment audit linkage, GIS attribute update & photo evidence, contractor production & quality audit, budget vs replacement backlog

domain_name: "pole-inspection-program"
api_prefix: "/pole-program"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - ops_run_checkpoint
    - cascading_side_effects
  entity_topology: flat
  state_machine_shape: cyclic   # task rework loop, treatment retreat loop, order defer loop; audits carry parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic          # QA decisions attach to tasks and treatment orders via separate FKs
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ProgramBudget
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the budget funds; unique across all budgets", constraints: "unique; 2000..2100" }
      - { name: total_cents, type: integer, source: input, description: "Total appropriation in cents", constraints: ">= 0" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of escalated_cost_cents over ReplacementWorkOrder in FUNDED status whose budget_id == this budget", default: 0 }
      - { name: spent_cents, type: integer, source: computed, description: "Sum of actual_cost_cents over ReplacementWorkOrder in COMPLETED status whose budget_id == this budget", default: 0 }
      - { name: available_cents, type: integer, source: computed, description: "total_cents - committed_cents - spent_cents; invariant total == available + committed + spent holds at all times" }

  - name: InspectionCycle
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Program year; the funding budget is resolved as the ProgramBudget whose fiscal_year == year (fiscal_year is unique)", constraints: "2000..2100" }
      - { name: cycle_length_years, type: integer, source: input, description: "Required years between inspections of the same pole", constraints: ">= 1" }
      - { name: sample_pct, type: number, source: input, description: "Percent of the eligible pool sampled at open; 0..100 inclusive" }
      - { name: mandatory_zone_tags, type: array, source: input, description: "gis_tag values that force eligibility regardless of last inspection age", default: [] }
      - { name: strength_variant_policy, type: enum, source: input, description: "Which remaining-strength variant drives classification for this cycle", constraints: "CONSERVATIVE | STATISTICAL" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | RECONCILED", default: DRAFT }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp of open transition", default: null }
      - { name: reconciled_at, type: datetime, source: system, description: "Logical-clock timestamp of reconcile transition", default: null }
      - { name: sample_pool_size, type: integer, source: computed, description: "Eligible pool size computed at open", default: 0 }
      - { name: tasks_total, type: integer, source: computed, description: "Count of InspectionTask with cycle_id == this cycle", default: 0 }
      - { name: tasks_terminal, type: integer, source: computed, description: "Count of this cycle's tasks in ACCEPTED | WAIVED | ESCALATED", default: 0 }
      - { name: pending_replacement_count, type: integer, source: computed, description: "Count of ReplacementWorkOrder with cycle_id == this cycle in QUEUED | DEFERRED | FUNDED", default: 0 }

  - name: Pole
    parent: null
    common_fields: true
    fields:
      - { name: pole_number, type: string, source: input, description: "Utility asset tag; unique", constraints: "unique; non-empty" }
      - { name: species, type: enum, source: input, description: "Wood species", constraints: "SOUTHERN_PINE | DOUGLAS_FIR | WESTERN_RED_CEDAR | LARCH" }
      - { name: original_class, type: enum, source: input, description: "ANSI pole class at installation", constraints: "H1 | 1 | 2 | 3 | 4 | 5" }
      - { name: install_date, type: string, source: input, description: "Installation date YYYY-MM-DD; used for age term of priority score" }
      - { name: gis_lat, type: number, source: input, description: "Latitude" }
      - { name: gis_lon, type: number, source: input, description: "Longitude" }
      - { name: gis_tag, type: string, source: input, description: "Zone tag; FEEDER_CRITICAL triggers priority floor; matched against cycle mandatory_zone_tags" }
      - { name: height_ft, type: number, source: input, description: "Pole height", constraints: "> 0" }
      - { name: joint_use, type: boolean, source: input, description: "True when third-party attachers are declared on the pole", default: false }
      - { name: attachment_count_declared, type: integer, source: input, description: "Number of joint-use attachments on record", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | MONITOR | PRIORITY_REJECT | REPLACED", default: IN_SERVICE }
      - { name: last_inspection_date, type: datetime, source: system, description: "Set from the logical clock when an inspection task is ACCEPTED for this pole", default: null }
      - { name: last_treatment_date, type: datetime, source: system, description: "Set from applied_at when a treatment order is VERIFIED", default: null }
      - { name: current_remaining_strength_pct, type: number, source: computed, description: "Effective (policy-selected) remaining strength from the latest ACCEPTED task; null if none", default: null }
      - { name: current_classification, type: enum, source: computed, description: "NONE | SERVICEABLE | MONITOR | REJECT_ROUTINE | REJECT_PRIORITY from latest ACCEPTED task", default: NONE }
      - { name: open_treatment_count, type: integer, source: computed, description: "Count of TreatmentWorkOrder for this pole in CREATED | SCHEDULED | APPLIED | FAILED_QA; incremented on order creation, decremented on VERIFIED", default: 0 }

  - name: InspectionTask
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> InspectionCycle.id; owning cycle" }
      - { name: pole_id, type: string, source: input, description: "FK -> Pole.id; pole under inspection" }
      - { name: due_window_start, type: datetime, source: input, description: "Inclusive start of the field-work due window (closed interval semantics)" }
      - { name: due_window_end, type: datetime, source: input, description: "Inclusive end of the due window; must be >= due_window_start" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | REJECTED | ACCEPTED | WAIVED | ESCALATED", default: OPEN }
      - { name: rework_count, type: integer, source: system, description: "Number of REJECT decisions so far; REJECT with rework_count == 2 routes to ESCALATED", default: 0 }
      - { name: shell_thickness_in, type: number, source: input, description: "Sound shell thickness measured at groundline (inches)", default: null }
      - { name: sound_wood_pct, type: number, source: input, description: "Percent of sound wood in the effective section 0..100", default: null }
      - { name: decay_pocket_depth_in, type: number, source: input, description: "Deepest internal decay pocket (inches)", default: null }
      - { name: moisture_pct, type: number, source: input, description: "Measured wood moisture percent", default: null }
      - { name: hazard_flag, type: boolean, source: input, description: "Inspector-declared immediate hazard; mandatory true when classification computes REJECT_PRIORITY", default: false }
      - { name: photos, type: array, source: input, description: "Photo evidence objects {photo_type, url, taken_at}; photo_type in GROUNDLINE | DECAY_POCKET | TAG | ATTACHMENT", default: [] }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the Inspector who submitted; used for segregation-of-duties at QA", default: null }
      - { name: qa_reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the QAReviewer who decided", default: null }
      - { name: rs_conservative_pct, type: number, source: computed, description: "Remaining strength, conservative variant (calc remaining_strength_pct)", default: null }
      - { name: rs_statistical_pct, type: number, source: computed, description: "Remaining strength, statistical variant (calc remaining_strength_pct)", default: null }
      - { name: effective_rs_pct, type: number, source: computed, description: "Variant chosen by cycle.strength_variant_policy", default: null }
      - { name: classification, type: enum, source: computed, description: "SERVICEABLE | MONITOR | REJECT_ROUTINE | REJECT_PRIORITY from effective_rs_pct thresholds", default: null }

  - name: TreatmentWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: pole_id, type: string, source: input, description: "FK -> Pole.id; pole to treat" }
      - { name: product_code, type: enum, source: input, description: "Groundline treatment product", constraints: "CCA_WRAP | PENTA_GEL | COPPER_NAPHTHENATE" }
      - { name: crew_id, type: string, source: input, description: "FK -> ContractorCrew.id; assigned at schedule", default: null }
      - { name: work_start_date, type: string, source: input, description: "Scheduled start YYYY-MM-DD; half-open window [start, end)", default: null }
      - { name: work_end_date, type: string, source: input, description: "Scheduled end YYYY-MM-DD; exclusive", default: null }
      - { name: cost_cents, type: integer, source: input, description: "Quoted cost; 0 for warranty retreats", constraints: ">= 0" }
      - { name: is_warranty_retreat, type: boolean, source: system, description: "True when created by an HONORED WarrantyClaim", default: false }
      - { name: source_claim_id, type: string, source: system, description: "FK -> WarrantyClaim.id; set only on warranty retreats", default: null }
      - { name: status, type: enum, source: system, description: "CREATED | SCHEDULED | APPLIED | VERIFIED | FAILED_QA", default: CREATED }
      - { name: applied_at, type: datetime, source: system, description: "Logical-clock timestamp of apply", default: null }
      - { name: applied_by_crew_id, type: string, source: system, description: "Crew id (X-User-ID) that applied the treatment", default: null }
      - { name: warranty_years, type: integer, source: computed, description: "From PRODUCT constants at apply: CCA_WRAP=10, PENTA_GEL=8, COPPER_NAPHTHENATE=5", default: null }
      - { name: warranty_end_date, type: datetime, source: computed, description: "applied_at + warranty_years (same month-day); claims filed with filed_at <= warranty_end_date are within warranty", default: null }
      - { name: qa_fail_events, type: integer, source: system, description: "Count of FAILED_QA transitions on this order", default: 0 }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: treatment_order_id, type: string, source: input, description: "FK -> TreatmentWorkOrder.id; order under claim" }
      - { name: claim_reason, type: enum, source: input, description: "DECAY_RECURRENCE | PRODUCT_FAILURE" }
      - { name: status, type: enum, source: system, description: "FILED | HONORED | DENIED", default: FILED }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at filing" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramManager filer" }
      - { name: adjudication_note, type: string, source: input, description: "Free text recorded at adjudication", default: null }

  - name: ContractorCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_code, type: string, source: input, description: "Unique crew identifier", constraints: "unique; non-empty" }
      - { name: region, type: string, source: input, description: "Operating region" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (auto when rolling quality score < 70 after a FAIL)", default: ACTIVE }
      - { name: qa_pass_count, type: integer, source: system, description: "Lifetime treatment QA PASS decisions", default: 0 }
      - { name: qa_fail_count, type: integer, source: system, description: "Lifetime treatment QA FAIL decisions", default: 0 }
      - { name: quality_score_lifetime, type: number, source: computed, description: "100 * qa_pass_count / (qa_pass_count + qa_fail_count), 2dp half-up; 100.00 when no events" }
      - { name: quality_score_rolling, type: number, source: computed, description: "Same formula over the 5 most recent QA events ordered by decided_at ASC, tie-break event created_at ASC; 100.00 when no events" }
      - { name: qa_event_log, type: array, source: system, description: "Append-only list of {decision, decided_at, order_id} driving both score variants", default: [] }
      - { name: current_cycle_billing_cents, type: integer, source: computed, description: "Production billing from the latest cycle reconcile (calc production_billing_amount)", default: 0 }

  - name: ReplacementWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: pole_id, type: string, source: input, description: "FK -> Pole.id; pole to replace" }
      - { name: cycle_id, type: string, source: system, description: "FK -> InspectionCycle.id; set when auto-created from an accepted inspection; null on manual creation", default: null }
      - { name: budget_id, type: string, source: system, description: "FK -> ProgramBudget.id; set at fund time", default: null }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Planner estimate in cents", constraints: "> 0" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Actual cost recorded at completion", default: null, constraints: "> 0" }
      - { name: deferral_count, type: integer, source: system, description: "Times deferred; drives cost escalation", default: 0 }
      - { name: escalated_cost_cents, type: integer, source: computed, description: "round_half_up(estimated_cost_cents * 1.08^deferral_count, 0); the amount funding commits" }
      - { name: priority_score, type: integer, source: computed, description: "calc replacement_priority_score at creation and on requeue" }
      - { name: status, type: enum, source: system, description: "QUEUED | FUNDED | DEFERRED | COMPLETED", default: QUEUED }
      - { name: funded_at, type: datetime, source: system, description: "Logical-clock timestamp of fund transition", default: null }

  - name: AttachmentAudit
    parent: null
    common_fields: true
    fields:
      - { name: pole_id, type: string, source: system, description: "FK -> Pole.id; copied from the originating task" }
      - { name: inspection_task_id, type: string, source: system, description: "FK -> InspectionTask.id; originating task (auto-created at submit when pole.joint_use)" }
      - { name: audit_status, type: enum, source: system, description: "SUBMITTED | ADJUDICATED — dimension 1 of the parallel machine", default: SUBMITTED }
      - { name: violation_status, type: enum, source: system, description: "NONE | DETECTED | NOTIFIED | CURED | ESCALATED — dimension 2 of the parallel machine", default: NONE }
      - { name: found_attachment_count, type: integer, source: input, description: "Attachments observed in the field at audit creation", constraints: ">= 0" }
      - { name: unauthorized_count, type: integer, source: computed, description: "max(0, found_attachment_count - pole.attachment_count_declared)" }
      - { name: cure_deadline, type: datetime, source: computed, description: "adjudicated_at + 45 days when violation NOTIFIED", default: null }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical-clock timestamp of adjudication", default: null }
      - { name: cured_at, type: datetime, source: system, description: "Logical-clock timestamp of mark-cured", default: null }

  - name: BacklogSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> InspectionCycle.id; reconciled cycle" }
      - { name: budget_id, type: string, source: system, description: "FK -> ProgramBudget.id; budget used for the waterfall" }
      - { name: snapshot_seq, type: integer, source: system, description: "Per-cycle monotonically increasing sequence starting at 1" }
      - { name: queued_count, type: integer, source: system, description: "Orders still QUEUED after the waterfall" }
      - { name: queued_escalated_cost_cents, type: integer, source: system, description: "Sum of escalated_cost_cents over orders still QUEUED after the waterfall" }
      - { name: funded_count, type: integer, source: system, description: "Orders moved QUEUED -> FUNDED by this reconcile" }
      - { name: budget_available_cents, type: integer, source: system, description: "ProgramBudget.available_cents after the waterfall" }
      - { name: budget_committed_cents, type: integer, source: system, description: "ProgramBudget.committed_cents after the waterfall" }
      - { name: crew_billings, type: array, source: system, description: "Per-crew billing objects {crew_id, billing_cents} computed at this reconcile", default: [] }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InspectionCycle
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /pole-program/inspection-cycles/{id}/open"
        actor: ProgramManager
        preconditions:
          - "cycle.status == DRAFT"
        side_effects:
          - "stamps opened_at from the logical clock"
          - "runs calc inspection_sample_selection: creates one OPEN InspectionTask per selected pole with due window [opened_at, opened_at + 120 days]"
          - "sets sample_pool_size and tasks_total"
        note: "Opening with an empty eligible pool succeeds with zero tasks."
      - from: OPEN
        to: RECONCILED
        trigger: "POST /pole-program/inspection-cycles/{id}/reconcile"
        actor: ProgramManager
        preconditions:
          - "cycle.status == OPEN"
          - "tasks_terminal == tasks_total (all tasks terminal) else ERR_CYCLE_TASKS_OPEN"
          - "payload budget_id exists"
        side_effects:
          - "step 1: every ReplacementWorkOrder in DEFERRED -> QUEUED (auto-requeue; deferral_count retained)"
          - "step 2: every AttachmentAudit with violation_status == NOTIFIED and cure_deadline < now -> ESCALATED"
          - "step 3: runs calc budget_waterfall_funding against the payload budget (QUEUED orders program-wide)"
          - "step 4: runs calc production_billing_amount per crew; stores crew.current_cycle_billing_cents"
          - "step 5: creates a BacklogSnapshot with post-waterfall figures"
          - "stamps reconciled_at; bumps version on cycle, budget, and every mutated order/audit/crew"

  - entity: Pole
    initial_state: IN_SERVICE
    terminal_states: [REPLACED]
    transitions:
      - from: IN_SERVICE
        to: MONITOR
        trigger: "qa-review ACCEPT on an InspectionTask whose classification == MONITOR"
        actor: system
        preconditions: ["task classification == MONITOR", "pole.status IN {IN_SERVICE}"]
        side_effects: ["pole.current_classification = MONITOR", "current_remaining_strength_pct = task.effective_rs_pct", "last_inspection_date = now", "pole.version += 1"]
      - from: MONITOR
        to: IN_SERVICE
        trigger: "qa-review PASS (VERIFIED) on a TreatmentWorkOrder for this pole"
        actor: system
        preconditions: ["pole.status == MONITOR"]
        side_effects: ["pole.last_treatment_date = order.applied_at", "pole.version += 1"]
      - from: IN_SERVICE
        to: PRIORITY_REJECT
        trigger: "qa-review ACCEPT on an InspectionTask whose classification == REJECT_PRIORITY"
        actor: system
        preconditions: ["task classification == REJECT_PRIORITY", "pole.status IN {IN_SERVICE, MONITOR}"]
        side_effects:
          - "pole.current_classification = REJECT_PRIORITY; current_remaining_strength_pct = task.effective_rs_pct; last_inspection_date = now"
          - "auto-creates a ReplacementWorkOrder (QUEUED, cycle_id = task.cycle_id, estimated_cost_cents = 250000 program default DEFAULT_REPLACEMENT_COST_CENTS, priority_score computed)"
          - "the order creation increments InspectionCycle.pending_replacement_count (link 3 of the cascade)"
      - from: MONITOR
        to: PRIORITY_REJECT
        trigger: "qa-review ACCEPT on an InspectionTask whose classification == REJECT_PRIORITY"
        actor: system
        preconditions: ["task classification == REJECT_PRIORITY"]
        side_effects: ["same as IN_SERVICE -> PRIORITY_REJECT"]
      - from: PRIORITY_REJECT
        to: REPLACED
        trigger: "POST /pole-program/replacement-work-orders/{id}/complete on the pole's FUNDED order"
        actor: system
        preconditions: ["order.status was FUNDED", "order.pole_id == pole.id"]
        side_effects: ["pole.version += 1"]
      - from: IN_SERVICE
        to: IN_SERVICE
        trigger: "qa-review ACCEPT with classification SERVICEABLE or REJECT_ROUTINE"
        actor: system
        preconditions: ["pole.status IN {IN_SERVICE, MONITOR}"]
        side_effects: ["updates current_classification / current_remaining_strength_pct / last_inspection_date", "classification REJECT_ROUTINE leaves pole.status unchanged", "pole.version += 1"]
        note: "REJECT_ROUTINE poles are re-inspected next cycle per sampling eligibility; no automatic order."

  - entity: InspectionTask
    initial_state: OPEN
    terminal_states: [ACCEPTED, WAIVED, ESCALATED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /pole-program/inspection-tasks/{id}/submit"
        actor: Inspector
        preconditions:
          - "task.status == OPEN"
          - "pole.status != REPLACED else ERR_POLE_REPLACED"
          - "cycle.status == OPEN else ERR_CYCLE_NOT_OPEN"
          - "if computed classification == REJECT_PRIORITY then payload hazard_flag must be true (ERR_HAZARD_FLAG_REQUIRED)"
          - "photos must contain >= 1 GROUNDLINE and >= 1 TAG photo; classification REJECT_PRIORITY or REJECT_ROUTINE additionally requires >= 1 DECAY_POCKET (ERR_PHOTO_EVIDENCE_REQUIRED)"
        side_effects:
          - "computes rs_conservative_pct, rs_statistical_pct, effective_rs_pct, classification (calc remaining_strength_pct + pole_serviceability_classification)"
          - "stamps submitted_by_user_id from X-User-ID"
          - "if pole.joint_use == true: auto-creates an AttachmentAudit (SUBMITTED/NONE) copying pole_id, task link, and payload found_attachment_count"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /pole-program/inspection-tasks/{id}/qa-review with decision ACCEPT"
        actor: QAReviewer
        preconditions:
          - "task.status == SUBMITTED else ERR_TASK_NOT_SUBMITTED"
          - "X-User-ID != task.submitted_by_user_id else ERR_SOD_VIOLATION"
        side_effects:
          - "stamps qa_reviewed_by_user_id"
          - "runs the Pole classification transition (SERVICEABLE/MONITOR/REJECT_ROUTINE/REJECT_PRIORITY) including the PRIORITY_REJECT cascade"
          - "cycle.tasks_terminal recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pole-program/inspection-tasks/{id}/qa-review with decision REJECT and rework_count < 2"
        actor: QAReviewer
        preconditions: ["task.status == SUBMITTED", "X-User-ID != task.submitted_by_user_id"]
        side_effects: ["rework_count += 1", "clears readings/photos/effective fields back to null defaults"]
        note: "REJECTED -> OPEN is performed by the system immediately after REJECT stamps rework_count, forming the rework loop."
      - from: REJECTED
        to: OPEN
        trigger: "system auto-transition on entering REJECTED"
        actor: system
        preconditions: ["task.status == REJECTED"]
        side_effects: []
      - from: SUBMITTED
        to: ESCALATED
        trigger: "POST /pole-program/inspection-tasks/{id}/qa-review with decision REJECT and rework_count == 2"
        actor: QAReviewer
        preconditions: ["task.status == SUBMITTED", "X-User-ID != task.submitted_by_user_id"]
        side_effects: ["rework_count += 1 (final 3)", "cycle.tasks_terminal recomputed"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /pole-program/inspection-tasks/{id}/waive"
        actor: ProgramManager
        preconditions: ["task.status == OPEN"]
        side_effects: ["cycle.tasks_terminal recomputed", "pole.last_inspection_date unchanged, so the pole re-enters the next cycle's eligible pool (population invariant)"]

  - entity: TreatmentWorkOrder
    initial_state: CREATED
    terminal_states: [VERIFIED]
    transitions:
      - from: CREATED
        to: SCHEDULED
        trigger: "POST /pole-program/treatment-work-orders/{id}/schedule"
        actor: ProgramManager
        preconditions:
          - "order.status IN {CREATED, FAILED_QA}"
          - "crew exists and crew.status == ACTIVE else ERR_CREW_SUSPENDED"
          - "work_end_date > work_start_date else ERR_INVALID_WINDOW"
          - "no other SCHEDULED order for the same crew with overlapping half-open window [start, end) else ERR_CREW_SCHEDULE_CONFLICT; adjacency (start == other end) is allowed"
        side_effects: ["sets crew_id, work_start_date, work_end_date"]
      - from: FAILED_QA
        to: SCHEDULED
        trigger: "POST /pole-program/treatment-work-orders/{id}/schedule (retreatment loop)"
        actor: ProgramManager
        preconditions: ["same as CREATED -> SCHEDULED"]
        side_effects: ["resets applied_at / applied_by_crew_id / warranty fields to null"]
      - from: SCHEDULED
        to: APPLIED
        trigger: "POST /pole-program/treatment-work-orders/{id}/apply"
        actor: Contractor
        preconditions:
          - "order.status == SCHEDULED"
          - "X-User-ID (crew id) == order.crew_id else ERR_FORBIDDEN"
        side_effects:
          - "stamps applied_at from the logical clock; applied_by_crew_id = X-User-ID"
          - "computes warranty_years and warranty_end_date (calc warranty_window)"
      - from: APPLIED
        to: VERIFIED
        trigger: "POST /pole-program/treatment-work-orders/{id}/qa-review with decision PASS"
        actor: QAReviewer
        preconditions: ["order.status == APPLIED"]
        side_effects:
          - "crew.qa_pass_count += 1; appends qa_event_log; recomputes both quality score variants"
          - "pole.last_treatment_date = applied_at; pole.status MONITOR -> IN_SERVICE; pole.open_treatment_count -= 1"
      - from: APPLIED
        to: FAILED_QA
        trigger: "POST /pole-program/treatment-work-orders/{id}/qa-review with decision FAIL"
        actor: QAReviewer
        preconditions: ["order.status == APPLIED"]
        side_effects:
          - "crew.qa_fail_count += 1; order.qa_fail_events += 1; appends qa_event_log; recomputes both quality score variants"
          - "if crew.quality_score_rolling < 70.00 after recompute: crew.status ACTIVE -> SUSPENDED (cascade link 2)"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [HONORED, DENIED]
    transitions:
      - from: FILED
        to: HONORED
        trigger: "POST /pole-program/warranty-claims/{id}/adjudicate with outcome HONOR"
        actor: ProgramManager
        preconditions: ["claim.status == FILED"]
        side_effects:
          - "auto-creates a TreatmentWorkOrder (is_warranty_retreat = true, cost_cents = 0, source_claim_id = claim.id, same pole_id and product_code)"
      - from: FILED
        to: DENIED
        trigger: "POST /pole-program/warranty-claims/{id}/adjudicate with outcome DENY"
        actor: ProgramManager
        preconditions: ["claim.status == FILED"]
        side_effects: ["stamps adjudication_note"]

  - entity: ReplacementWorkOrder
    initial_state: QUEUED
    terminal_states: [COMPLETED]
    transitions:
      - from: QUEUED
        to: FUNDED
        trigger: "POST /pole-program/replacement-work-orders/{id}/fund (or the reconcile waterfall)"
        actor: ProgramManager
        preconditions:
          - "order.status == QUEUED else ERR_ORDER_NOT_QUEUED"
          - "payload expected_budget_version == budget.version else ERR_STALE_BUDGET_VERSION (manual fund only)"
          - "budget.available_cents >= order.escalated_cost_cents else ERR_BUDGET_EXCEEDED (boundary: equality funds)"
        side_effects:
          - "budget.committed_cents += escalated_cost_cents; order.budget_id = budget.id; funded_at = now"
          - "budget.version += 1; order.version += 1"
      - from: FUNDED
        to: QUEUED
        trigger: "POST /pole-program/replacement-work-orders/{id}/defund"
        actor: ProgramManager
        preconditions: ["order.status == FUNDED"]
        side_effects: ["budget.committed_cents -= escalated_cost_cents; budget_id = null; budget.version += 1 (compensating action: available_cents returns to its pre-fund value)"]
      - from: QUEUED
        to: DEFERRED
        trigger: "POST /pole-program/replacement-work-orders/{id}/defer"
        actor: ProgramManager
        preconditions: ["order.status == QUEUED"]
        side_effects: ["deferral_count += 1", "escalated_cost_cents recomputed (1.08^deferral_count)"]
      - from: DEFERRED
        to: QUEUED
        trigger: "system auto-requeue at step 1 of cycle reconcile"
        actor: system
        preconditions: ["order.status == DEFERRED"]
        side_effects: ["priority_score recomputed with the current deferral_count"]
      - from: FUNDED
        to: COMPLETED
        trigger: "POST /pole-program/replacement-work-orders/{id}/complete"
        actor: Contractor
        preconditions: ["order.status == FUNDED", "payload actual_cost_cents > 0"]
        side_effects:
          - "budget.committed_cents -= escalated_cost_cents; budget.spent_cents += actual_cost_cents"
          - "pole.status -> REPLACED (pole transition PRIORITY_REJECT -> REPLACED)"
          - "budget.version += 1; pole.version += 1"

  - entity: AttachmentAudit
    initial_state: SUBMITTED   # audit_status dimension; violation_status dimension starts at NONE
    terminal_states: [ADJUDICATED]   # audit_status terminal; violation_status evolves independently
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /pole-program/attachment-audits/{id}/adjudicate"
        actor: ProgramManager
        preconditions: ["audit.audit_status == SUBMITTED"]
        side_effects:
          - "stamps adjudicated_at"
          - "violation_status: NONE -> DETECTED when unauthorized_count > 0, else stays NONE"
          - "DETECTED -> NOTIFIED in the same adjudication (notice issued; cure_deadline = adjudicated_at + 45 days)"
      - from: NOTIFIED
        to: CURED
        trigger: "POST /pole-program/attachment-audits/{id}/mark-cured (violation dimension)"
        actor: AttacherRep
        preconditions:
          - "violation_status == NOTIFIED"
          - "now <= cure_deadline else ERR_CURE_DEADLINE_PASSED"
        side_effects: ["stamps cured_at"]
      - from: NOTIFIED
        to: ESCALATED
        trigger: "system at cycle reconcile step 2 when cure_deadline < now"
        actor: system
        preconditions: ["violation_status == NOTIFIED", "cure_deadline < now"]
        side_effects: []
    note: "Parallel dimensions: audit_status (SUBMITTED -> ADJUDICATED) and violation_status (NONE -> DETECTED -> NOTIFIED -> CURED | ESCALATED) evolve on the same row; mark-cured does not change audit_status."

  - entity: ContractorCrew
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade from a treatment qa-review FAIL that drops quality_score_rolling below 70.00"
        actor: system
        preconditions: ["recomputed quality_score_rolling < 70.00"]
        side_effects: ["subsequent schedule calls for this crew fail with ERR_CREW_SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system re-instatement when a subsequent qa-review PASS raises quality_score_rolling >= 70.00"
        actor: system
        preconditions: ["recomputed quality_score_rolling >= 70.00"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: budget-fund-stale-version
    parent_entity: ProgramBudget
    write_endpoint: "POST /pole-program/replacement-work-orders/{id}/fund"
    occ_field: expected_budget_version
    description: |
      Funding a replacement order against a ProgramBudget whose version has
      advanced since the client last read it is rejected. Any successful fund,
      defund, complete, or reconcile waterfall mutates budget.version, so a
      writer holding an older snapshot must re-read before committing funds.
    error_id: ERR_STALE_BUDGET_VERSION
    http_status: 412
  - rule_id: pole-gis-stale-version
    parent_entity: Pole
    write_endpoint: "PATCH /pole-program/poles/{id}/gis-attributes"
    occ_field: expected_pole_version
    description: |
      A GIS attribute patch that supersedes the pole's current attributes is
      rejected when the pole's version has advanced since the client last read
      it — e.g. a qa-review cascade refreshed classification fields after the
      client's read, so the client's base state is stale.
    error_id: ERR_STALE_POLE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: remaining_strength_pct
    trigger: "POST /pole-program/inspection-tasks/{id}/submit (both variants computed and stored; effective_rs_pct selected by cycle.strength_variant_policy)"
    algorithm: weighted_scoring
    formula: |
      constants REQUIRED_SHELL_IN = {H1: 2.75, 1: 2.50, 2: 2.25, 3: 2.00, 4: 1.75, 5: 1.50}
      constants SPECIES_FACTOR = {SOUTHERN_PINE: 1.00, DOUGLAS_FIR: 0.95, WESTERN_RED_CEDAR: 0.90, LARCH: 1.02}
      shell_ratio = shell_thickness_in / REQUIRED_SHELL_IN[original_class]
      CONSERVATIVE variant:
        base = shell_ratio * 100 * (sound_wood_pct / 100) * SPECIES_FACTOR[species]
        decay_penalty = decay_pocket_depth_in * 5.0
        moisture_mult = 0.95 if moisture_pct > 30.0 else 1.00
        rs_conservative_pct = clamp((base - decay_penalty) * moisture_mult, 0, 100)
      STATISTICAL variant:
        rs_statistical_pct = clamp(0.6 * (shell_ratio * 100) + 0.4 * sound_wood_pct - 3.0 * decay_pocket_depth_in, 0, 100)
      effective_rs_pct = variant selected by cycle.strength_variant_policy
    input_set: "the submitting task's four readings plus pole.species and pole.original_class"
    constants:
      DECAY_PENALTY_PER_INCH: 5.0
      MOISTURE_THRESHOLD: 30.0
      MOISTURE_MULT: 0.95
    precision: "2 decimal places, round_half_up"
    variants:
      - name: CONSERVATIVE
        when: "cycle.strength_variant_policy == CONSERVATIVE"
        difference: "section-ratio based with species factor, decay penalty and moisture derate; always <= STATISTICAL for typical decay readings"
      - name: STATISTICAL
        when: "cycle.strength_variant_policy == STATISTICAL"
        difference: "weighted blend of shell ratio and sound wood; no moisture term, smaller decay penalty"

  - name: pole_serviceability_classification
    trigger: "submit, immediately after remaining_strength_pct"
    algorithm: threshold
    formula: |
      r = effective_rs_pct
      classification = SERVICEABLE      if r >= 60.00
                       MONITOR          if 45.00 <= r < 60.00
                       REJECT_ROUTINE   if 30.00 <= r < 45.00
                       REJECT_PRIORITY  if r < 30.00
      Boundary semantics: lower bounds are inclusive (r == 60.00 -> SERVICEABLE, r == 45.00 -> MONITOR, r == 30.00 -> REJECT_ROUTINE).
    input_set: "task.effective_rs_pct"
    constants:
      SERVICEABLE_MIN: 60.00
      MONITOR_MIN: 45.00
      REJECT_ROUTINE_MIN: 30.00
    precision: "comparison against the 2dp rounded effective_rs_pct"

  - name: inspection_sample_selection
    trigger: "POST /pole-program/inspection-cycles/{id}/open"
    algorithm: aggregation
    formula: |
      Eligible pool = poles where pole.status IN {IN_SERVICE, MONITOR}
        AND (last_inspection_date IS NULL
             OR now - last_inspection_date >= cycle_length_years years
             OR pole.gis_tag IN cycle.mandatory_zone_tags)
        AND NOT EXISTS an InspectionTask for the pole with status IN {OPEN, SUBMITTED, REJECTED}
      Ranking: last_inspection_date IS NULL first; then last_inspection_date ASC (oldest first); tie-break pole.created_at ASC.
      sample_size = max(1, floor(pool_size * sample_pct / 100)) when pool_size > 0 and sample_pct > 0; else 0.
      Take the top sample_size poles by the ranking; create one OPEN task each with due window [opened_at, opened_at + 120 days].
      Empty pool fallback: open succeeds, zero tasks created, sample_pool_size = 0.
    input_set: "all Pole rows"
    constants:
      FIELD_SEASON_DAYS: 120
    precision: "integer counts; floor for sample_size"

  - name: replacement_priority_score
    trigger: "ReplacementWorkOrder creation (manual or cascade) and DEFERRED -> QUEUED requeue"
    algorithm: weighted_scoring
    formula: |
      deficiency = 100 - pole.current_remaining_strength_pct   # null strength counts as 50.00
      deferral_term = 5 * deferral_count
      joint_use_term = 10 if pole.joint_use else 0
      age_term = 5 if install year <= 1969 else 0
      raw = deficiency + deferral_term + joint_use_term + age_term
      floored = max(raw, 80) if pole.gis_tag == "FEEDER_CRITICAL" else raw
      priority_score = min(100, floored)
      Evaluation order is pinned: sum -> criticality floor -> cap.
    input_set: "order.deferral_count; pole.current_remaining_strength_pct, joint_use, install_date, gis_tag"
    constants:
      DEFERRAL_STEP: 5
      JOINT_USE_BONUS: 10
      AGE_BONUS: 5
      AGE_CUTOFF_YEAR: 1969
      CRITICAL_FLOOR: 80
      SCORE_CAP: 100
    precision: "integer score"

  - name: escalated_cost
    trigger: "order creation and every defer (deferral_count change)"
    algorithm: decay_function
    formula: "escalated_cost_cents = round_half_up(estimated_cost_cents * 1.08 ^ deferral_count, 0)"
    input_set: "the order itself"
    constants:
      ESCALATION_RATE: 1.08
    precision: "integer cents, round_half_up"

  - name: budget_waterfall_funding
    trigger: "cycle reconcile step 3"
    algorithm: waterfall_allocation
    formula: |
      Pinned evaluation order (breaks the mutual dependency between available funds and the funded set):
      1. A = budget.available_cents snapshot at reconcile start (after step-1 requeue, before any funding).
      2. Candidates = ALL ReplacementWorkOrder with status == QUEUED (program-wide backlog, any cycle).
      3. Rank by priority_score DESC, tie-break created_at ASC.
      4. Walk the ranking: if order.escalated_cost_cents <= remaining A then fund it
         (QUEUED -> FUNDED, committed += cost, remaining -= cost, budget_id set); else leave QUEUED and
         CONTINUE scanning lower-ranked orders (skip, do not stop).
      5. Boundary: escalated_cost_cents == remaining A exactly -> funded (<= semantics).
    input_set: "all QUEUED ReplacementWorkOrder; the payload ProgramBudget"
    constants: {}
    precision: "integer cents"

  - name: production_billing_amount
    trigger: "cycle reconcile step 4, per ContractorCrew with in-scope orders"
    algorithm: tiered_pricing
    formula: |
      Scope: TreatmentWorkOrder with status == VERIFIED, crew_id == crew, applied_at within [cycle.opened_at, reconcile time).
      N = number of in-scope orders for the crew. If N == 0 the crew is skipped (billing unchanged).
      Per order line_cents = round_half_up(BASE_RATE_CENTS[product_code] * SPECIES_MULT[pole.species], 0)
                             + round_half_up(MOBILIZATION_CENTS / N, 0)
      ROUNDING ORDER PINNED: round each line component per order, THEN sum lines into subtotal.
        (Summing first and rounding once yields a different cents total; the per-line order is the contract.)
      subtotal = sum(line_cents)
      bonus = round_half_up(subtotal * 0.05, 0) if every in-scope order reached VERIFIED with
              verified time <= cycle.opened_at + FIELD_SEASON_DAYS, else 0
      penalty = (sum of qa_fail_events over in-scope orders) * QA_FAIL_PENALTY_CENTS
      billing_cents = subtotal + bonus - penalty   (floored at 0)
      Stored on crew.current_cycle_billing_cents and emitted in the BacklogSnapshot.crew_billings array.
    input_set: "VERIFIED TreatmentWorkOrder per crew in the cycle season window"
    constants:
      BASE_RATE_CENTS: {CCA_WRAP: 17500, PENTA_GEL: 21000, COPPER_NAPHTHENATE: 14500}
      SPECIES_MULT: {SOUTHERN_PINE: 1.00, DOUGLAS_FIR: 1.15, WESTERN_RED_CEDAR: 0.90, LARCH: 1.05}
      MOBILIZATION_CENTS: 40000
      EARLY_BONUS_PCT: 0.05
      QA_FAIL_PENALTY_CENTS: 2500
      FIELD_SEASON_DAYS: 120
    precision: "integer cents, round_half_up, per-line rounding before summation"

  - name: contractor_quality_score
    trigger: "every treatment qa-review decision (PASS/FAIL) on an order with a crew"
    algorithm: aggregation
    formula: |
      Events = crew.qa_event_log ordered by decided_at ASC, tie-break event created_at ASC.
      LIFETIME variant: 100 * passes / (passes + fails) over ALL events; 100.00 when zero events.
      ROLLING variant: same ratio over the LAST 5 events only; 100.00 when zero events.
      Suspension check uses ROLLING only: after a FAIL, if rolling < 70.00 -> crew SUSPENDED.
      Bonus eligibility at billing uses LIFETIME only: lifetime >= 90.00 required for the early bonus.
    input_set: "crew.qa_event_log"
    constants:
      ROLLING_WINDOW: 5
      SUSPEND_THRESHOLD: 70.00
      BONUS_THRESHOLD: 90.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: LIFETIME
        when: "billing bonus eligibility and reporting"
        difference: "all historical QA events; older FAILs never age out"
      - name: ROLLING
        when: "suspension cascade"
        difference: "only the last 5 events; a PASS-heavy recent window can sit far above the lifetime figure"

  - name: warranty_window
    trigger: "treatment apply transition"
    algorithm: projection
    formula: |
      warranty_years = PRODUCT_WARRANTY_YEARS[product_code]
      warranty_end_date = applied_at + warranty_years years (same month-day; Feb 29 -> Feb 28 on non-leap years)
      A WarrantyClaim is within warranty iff filed_at <= warranty_end_date (inclusive boundary).
      A warranty retreat order, when itself applied, starts a NEW warranty window from its own applied_at (re-baseline).
    input_set: "the applied order"
    constants:
      PRODUCT_WARRANTY_YEARS: {CCA_WRAP: 10, PENTA_GEL: 8, COPPER_NAPHTHENATE: 5}
    precision: "datetime, year arithmetic"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is known", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted on this endpoint per RBAC; for Contractor, X-User-ID must equal the target order's crew_id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body is well-formed: required fields present, types valid, enum values in domain, numeric ranges respected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids resolve left-to-right, then body FK ids resolve (pole_id, cycle_id, crew_id, budget_id, treatment_order_id)", error_id: ERR_POLE_NOT_FOUND, http_status: 404, applies_to: "endpoints with resource ids; use the resource-specific error (ERR_CYCLE_NOT_FOUND, ERR_TASK_NOT_FOUND, ERR_TREATMENT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_AUDIT_NOT_FOUND, ERR_CREW_NOT_FOUND, ERR_BUDGET_NOT_FOUND, ERR_ORDER_NOT_FOUND)" }
  - { priority: 5, category: state, check: "Target entity in a valid state for the operation (task OPEN for submit/waive, SUBMITTED for qa-review, cycle OPEN, order QUEUED/FUNDED per transition, order APPLIED for treatment qa-review, claim FILED, audit SUBMITTED/NOTIFIED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints; specific aliases: ERR_CYCLE_NOT_OPEN, ERR_TASK_NOT_SUBMITTED, ERR_ORDER_NOT_QUEUED" }
  - { priority: 5, category: state, check: "Pole has not been REPLACED (blocks submit and new orders/claims targeting its pole)", error_id: ERR_POLE_REPLACED, http_status: 409, applies_to: "submit, POST /inspection-tasks, POST /treatment-work-orders, POST /replacement-work-orders" }
  - { priority: 5, category: state, check: "Cycle reconcile requires all cycle tasks terminal", error_id: ERR_CYCLE_TASKS_OPEN, http_status: 409, applies_to: "POST /inspection-cycles/{id}/reconcile" }
  - { priority: 5, category: state, check: "Crew must be ACTIVE to be scheduled (cross-entity state dependency TreatmentWorkOrder -> ContractorCrew)", error_id: ERR_CREW_SUSPENDED, http_status: 409, applies_to: "POST /treatment-work-orders/{id}/schedule" }
  - { priority: 6, category: state, check: "OCC: expected_budget_version == ProgramBudget.version", error_id: ERR_STALE_BUDGET_VERSION, http_status: 412, applies_to: "POST /replacement-work-orders/{id}/fund" }
  - { priority: 6, category: state, check: "OCC: expected_pole_version == Pole.version", error_id: ERR_STALE_POLE_VERSION, http_status: 412, applies_to: "PATCH /poles/{id}/gis-attributes" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: QA reviewer X-User-ID != task.submitted_by_user_id", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /inspection-tasks/{id}/qa-review" }
  - { priority: 7, category: business_safety, check: "Computed classification REJECT_PRIORITY requires hazard_flag == true in the submit payload", error_id: ERR_HAZARD_FLAG_REQUIRED, http_status: 422, applies_to: "POST /inspection-tasks/{id}/submit" }
  - { priority: 8, category: business_constraint, check: "One open claim per treatment order: no other WarrantyClaim with status FILED for the same treatment_order_id", error_id: ERR_CLAIM_ALREADY_OPEN, http_status: 409, applies_to: "POST /warranty-claims" }
  - { priority: 8, category: business_constraint, check: "fiscal_year unique across ProgramBudget rows", error_id: ERR_DUPLICATE_FISCAL_YEAR, http_status: 409, applies_to: "POST /budgets" }
  - { priority: 8, category: business_constraint, check: "pole_number unique across Pole rows", error_id: ERR_DUPLICATE_POLE_NUMBER, http_status: 409, applies_to: "POST /poles" }
  - { priority: 8, category: business_constraint, check: "crew_code unique across ContractorCrew rows", error_id: ERR_DUPLICATE_CREW_CODE, http_status: 409, applies_to: "POST /contractor-crews" }
  - { priority: 8, category: business_constraint, check: "No duplicate non-terminal task for the same pole within the same cycle", error_id: ERR_DUPLICATE_INSPECTION, http_status: 409, applies_to: "POST /inspection-tasks" }
  - { priority: 8, category: business_constraint, check: "Crew half-open window [work_start_date, work_end_date) must not overlap another SCHEDULED order of the same crew; adjacency allowed", error_id: ERR_CREW_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /treatment-work-orders/{id}/schedule" }
  - { priority: 8, category: business_constraint, check: "Pole closed window [due_window_start, due_window_end] must not touch any non-terminal task window for the same pole; touching at a single day IS a conflict", error_id: ERR_TASK_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /inspection-tasks" }
  - { priority: 9, category: business_temporal, check: "due_window_end >= due_window_start; work_end_date > work_start_date", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /inspection-tasks, POST /treatment-work-orders/{id}/schedule" }
  - { priority: 9, category: business_temporal, check: "Claim filed_at <= treatment.warranty_end_date (inclusive)", error_id: ERR_WARRANTY_EXPIRED, http_status: 422, applies_to: "POST /warranty-claims" }
  - { priority: 9, category: business_temporal, check: "mark-cured at now <= cure_deadline", error_id: ERR_CURE_DEADLINE_PASSED, http_status: 422, applies_to: "POST /attachment-audits/{id}/mark-cured" }
  - { priority: 10, category: business_referential, check: "photos contain >= 1 GROUNDLINE and >= 1 TAG; classification REJECT_PRIORITY or REJECT_ROUTINE additionally requires >= 1 DECAY_POCKET", error_id: ERR_PHOTO_EVIDENCE_REQUIRED, http_status: 422, applies_to: "POST /inspection-tasks/{id}/submit" }
  - { priority: 11, category: business_fiscal, check: "budget.available_cents >= order.escalated_cost_cents at fund (equality funds)", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /replacement-work-orders/{id}/fund" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/pole-program/budgets", description: "Create a fiscal-year budget (fiscal_year unique)", roles: [ProgramManager], code: 201, input: [fiscal_year, total_cents], output: ProgramBudget, side_effects: [] }
  - { method: GET, path: "/pole-program/budgets/{id}", description: "Read a budget with computed committed/spent/available", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: ProgramBudget, side_effects: [] }

  - { method: POST, path: "/pole-program/inspection-cycles", description: "Create a cycle in DRAFT", roles: [ProgramManager], code: 201, input: [year, cycle_length_years, sample_pct, "mandatory_zone_tags?", strength_variant_policy], output: InspectionCycle, side_effects: [] }
  - { method: GET, path: "/pole-program/inspection-cycles/{id}", description: "Read a cycle with computed task counters", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: InspectionCycle, side_effects: [] }
  - { method: POST, path: "/pole-program/inspection-cycles/{id}/open", description: "Open the cycle and run population sampling (creates OPEN tasks). Empty pool opens cleanly.", roles: [ProgramManager], code: 200, input: [], output: InspectionCycle, side_effects: ["calc inspection_sample_selection", "creates InspectionTask rows"] }
  - { method: POST, path: "/pole-program/inspection-cycles/{id}/reconcile", description: "Checkpoint: requeue deferrals, escalate overdue violations, run funding waterfall, crew billing, write BacklogSnapshot, close the cycle RECONCILED", roles: [ProgramManager], code: 200, input: [budget_id], output: InspectionCycle, side_effects: ["calc budget_waterfall_funding", "calc production_billing_amount", "creates BacklogSnapshot", "budget.version += 1"] }

  - { method: POST, path: "/pole-program/poles", description: "Register a pole", roles: [ProgramManager], code: 201, input: [pole_number, species, original_class, install_date, gis_lat, gis_lon, gis_tag, height_ft, "joint_use?", "attachment_count_declared?"], output: Pole, side_effects: [] }
  - { method: GET, path: "/pole-program/poles/{id}", description: "Read a pole with computed classification fields", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: Pole, side_effects: [] }
  - { method: PATCH, path: "/pole-program/poles/{id}/gis-attributes", description: "Supersede GIS attributes (OCC on pole.version)", roles: [ProgramManager], code: 200, input: [gis_lat, gis_lon, gis_tag, expected_pole_version], output: Pole, side_effects: ["increments Pole.version by 1"] }

  - { method: POST, path: "/pole-program/inspection-tasks", description: "Manually create an inspection task (rechecks); closed-window overlap and duplicate rules apply", roles: [ProgramManager], code: 201, input: [cycle_id, pole_id, due_window_start, due_window_end], output: InspectionTask, side_effects: ["cycle.tasks_total recomputed"] }
  - { method: GET, path: "/pole-program/inspection-tasks", description: "List tasks with filters", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: ["pole_id?", "cycle_id?", "status?", "limit?", "offset?"], output: "InspectionTask[]", side_effects: [] }
  - { method: GET, path: "/pole-program/inspection-tasks/{id}", description: "Read a task with computed strength fields", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: InspectionTask, side_effects: [] }
  - { method: POST, path: "/pole-program/inspection-tasks/{id}/submit", description: "Submit decay readings + photo evidence; computes both strength variants and classification; auto-creates an AttachmentAudit for joint-use poles", roles: [Inspector], code: 200, input: [shell_thickness_in, sound_wood_pct, decay_pocket_depth_in, moisture_pct, "hazard_flag?", photos, "found_attachment_count?"], output: InspectionTask, side_effects: ["calc remaining_strength_pct", "calc pole_serviceability_classification", "creates AttachmentAudit when pole.joint_use"] }
  - { method: POST, path: "/pole-program/inspection-tasks/{id}/qa-review", description: "QA decision on a submitted task (segregation of duties enforced). ACCEPT cascades to the pole; REJECT loops rework or escalates at rework_count == 2.", roles: [QAReviewer], code: 200, input: [decision, "notes?"], output: InspectionTask, side_effects: ["pole classification transition + PRIORITY_REJECT cascade", "cycle.tasks_terminal recomputed"] }
  - { method: POST, path: "/pole-program/inspection-tasks/{id}/waive", description: "Waive an inaccessible pole's task (compensating action that returns the pole to the eligibility pool)", roles: [ProgramManager], code: 200, input: [reason], output: InspectionTask, side_effects: ["cycle.tasks_terminal recomputed"] }

  - { method: POST, path: "/pole-program/treatment-work-orders", description: "Create a groundline treatment order (CREATED)", roles: [ProgramManager], code: 201, input: [pole_id, product_code, cost_cents], output: TreatmentWorkOrder, side_effects: ["pole.open_treatment_count += 1"] }
  - { method: GET, path: "/pole-program/treatment-work-orders", description: "List treatment orders with filters", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: ["pole_id?", "crew_id?", "status?", "source_claim_id?", "limit?", "offset?"], output: "TreatmentWorkOrder[]", side_effects: [] }
  - { method: GET, path: "/pole-program/treatment-work-orders/{id}", description: "Read a treatment order with warranty fields", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: TreatmentWorkOrder, side_effects: [] }
  - { method: POST, path: "/pole-program/treatment-work-orders/{id}/schedule", description: "Assign crew + half-open work window; crew-overlap and crew-status checks", roles: [ProgramManager], code: 200, input: [crew_id, work_start_date, work_end_date], output: TreatmentWorkOrder, side_effects: [] }
  - { method: POST, path: "/pole-program/treatment-work-orders/{id}/apply", description: "Crew marks application complete; sets warranty window from the logical clock", roles: [Contractor], code: 200, input: [], output: TreatmentWorkOrder, side_effects: ["calc warranty_window"] }
  - { method: POST, path: "/pole-program/treatment-work-orders/{id}/qa-review", description: "QA PASS -> VERIFIED (crew pass cascade, pole MONITOR -> IN_SERVICE) or FAIL -> FAILED_QA (crew fail cascade, possible SUSPENDED)", roles: [QAReviewer], code: 200, input: [decision, "notes?"], output: TreatmentWorkOrder, side_effects: ["calc contractor_quality_score", "crew cascade", "pole cascade on PASS"] }

  - { method: POST, path: "/pole-program/warranty-claims", description: "File a warranty claim against a VERIFIED treatment order within its warranty window", roles: [ProgramManager], code: 201, input: [treatment_order_id, claim_reason], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/pole-program/treatment-work-orders/{id}/warranty-claims", description: "List claims for a treatment order (0..N)", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: "WarrantyClaim[]", side_effects: [] }
  - { method: POST, path: "/pole-program/warranty-claims/{id}/adjudicate", description: "HONOR creates a no-cost retreat TreatmentWorkOrder; DENY closes the claim", roles: [ProgramManager], code: 200, input: [outcome, "adjudication_note?"], output: WarrantyClaim, side_effects: ["creates TreatmentWorkOrder when HONOR"] }

  - { method: POST, path: "/pole-program/contractor-crews", description: "Register a contractor crew", roles: [ProgramManager], code: 201, input: [crew_code, region], output: ContractorCrew, side_effects: [] }
  - { method: GET, path: "/pole-program/contractor-crews/{id}", description: "Read a crew with both quality-score variants and current billing", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: ContractorCrew, side_effects: [] }

  - { method: POST, path: "/pole-program/replacement-work-orders", description: "Manually queue a replacement order (planner-initiated; cycle_id null)", roles: [ProgramManager], code: 201, input: [pole_id, estimated_cost_cents], output: ReplacementWorkOrder, side_effects: ["calc replacement_priority_score"] }
  - { method: GET, path: "/pole-program/replacement-work-orders", description: "List replacement orders with filters", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: ["pole_id?", "budget_id?", "cycle_id?", "status?", "limit?", "offset?"], output: "ReplacementWorkOrder[]", side_effects: [] }
  - { method: GET, path: "/pole-program/replacement-work-orders/{id}", description: "Read a replacement order", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: ReplacementWorkOrder, side_effects: [] }
  - { method: POST, path: "/pole-program/replacement-work-orders/{id}/fund", description: "Commit budget to a QUEUED order (OCC on budget.version; equality of cost and available funds)", roles: [ProgramManager], code: 200, input: [budget_id, expected_budget_version], output: ReplacementWorkOrder, side_effects: ["budget.committed_cents += escalated_cost_cents", "increments ProgramBudget.version by 1"] }
  - { method: POST, path: "/pole-program/replacement-work-orders/{id}/defund", description: "Release committed funds (compensating action returning available_cents to its pre-fund value)", roles: [ProgramManager], code: 200, input: [], output: ReplacementWorkOrder, side_effects: ["budget.committed_cents -= escalated_cost_cents", "budget.version += 1"] }
  - { method: POST, path: "/pole-program/replacement-work-orders/{id}/defer", description: "Defer a QUEUED order; deferral_count += 1 and escalated cost recomputed", roles: [ProgramManager], code: 200, input: [], output: ReplacementWorkOrder, side_effects: ["calc escalated_cost"] }
  - { method: POST, path: "/pole-program/replacement-work-orders/{id}/complete", description: "Complete a FUNDED order: committed -> spent at actual cost; pole -> REPLACED", roles: [Contractor], code: 200, input: [actual_cost_cents], output: ReplacementWorkOrder, side_effects: ["budget committed/spent transfer", "pole cascade REPLACED", "budget.version += 1"] }

  - { method: GET, path: "/pole-program/attachment-audits", description: "List attachment audits with filters", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: ["pole_id?", "inspection_task_id?", "limit?", "offset?"], output: "AttachmentAudit[]", side_effects: [] }
  - { method: GET, path: "/pole-program/attachment-audits/{id}", description: "Read an audit (both parallel state dimensions)", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: AttachmentAudit, side_effects: [] }
  - { method: POST, path: "/pole-program/attachment-audits/{id}/adjudicate", description: "Adjudicate: audit_status -> ADJUDICATED; violation dimension NONE -> DETECTED -> NOTIFIED when unauthorized_count > 0", roles: [ProgramManager], code: 200, input: [], output: AttachmentAudit, side_effects: ["sets cure_deadline when violation NOTIFIED"] }
  - { method: POST, path: "/pole-program/attachment-audits/{id}/mark-cured", description: "Attacher marks the violation cured before the cure deadline (violation dimension only)", roles: [AttacherRep], code: 200, input: [], output: AttachmentAudit, side_effects: [] }

  - { method: GET, path: "/pole-program/backlog-snapshots", description: "List reconcile snapshots with filters", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: ["cycle_id?", "budget_id?", "limit?", "offset?"], output: "BacklogSnapshot[]", side_effects: [] }
  - { method: GET, path: "/pole-program/backlog-snapshots/{id}", description: "Read one snapshot", roles: [ProgramManager, Inspector, QAReviewer, Contractor, AttacherRep], code: 200, input: [], output: BacklogSnapshot, side_effects: [] }

  - { method: POST, path: "/pole-program/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [ProgramManager], code: 200, input: [to_iso8601], output: { now_iso8601: string }, side_effects: ["advances the logical clock used by all timestamps and temporal validations"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on the endpoint, or Contractor X-User-ID != order.crew_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, out-of-range number, unknown enum value" }
  - { id: ERR_POLE_NOT_FOUND, http: 404, condition: "pole_id does not resolve" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "cycle id does not resolve" }
  - { id: ERR_TASK_NOT_FOUND, http: 404, condition: "inspection task id does not resolve" }
  - { id: ERR_TREATMENT_NOT_FOUND, http: 404, condition: "treatment order id does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "warranty claim id does not resolve" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "attachment audit id does not resolve" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "crew_id does not resolve" }
  - { id: ERR_BUDGET_NOT_FOUND, http: 404, condition: "budget_id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "replacement order id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid-from transition rejection (e.g. submit on SUBMITTED task, adjudicate on ADJUDICATED audit, apply on CREATED order)" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Operation requires cycle.status == OPEN (submit, task creation into a DRAFT/RECONCILED cycle)" }
  - { id: ERR_CYCLE_TASKS_OPEN, http: 409, condition: "Reconcile attempted while tasks_terminal < tasks_total" }
  - { id: ERR_TASK_NOT_SUBMITTED, http: 409, condition: "qa-review requires task.status == SUBMITTED" }
  - { id: ERR_POLE_REPLACED, http: 409, condition: "Operation targets a pole whose status == REPLACED" }
  - { id: ERR_ORDER_NOT_QUEUED, http: 409, condition: "fund or defer requires order.status == QUEUED" }
  - { id: ERR_CREW_SUSPENDED, http: 409, condition: "schedule requires crew.status == ACTIVE" }
  - { id: ERR_STALE_BUDGET_VERSION, http: 412, condition: "expected_budget_version != ProgramBudget.version at fund" }
  - { id: ERR_STALE_POLE_VERSION, http: 412, condition: "expected_pole_version != Pole.version at gis-attributes patch" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "QA reviewer's X-User-ID equals task.submitted_by_user_id" }
  - { id: ERR_HAZARD_FLAG_REQUIRED, http: 422, condition: "Computed classification is REJECT_PRIORITY but hazard_flag is not true" }
  - { id: ERR_PHOTO_EVIDENCE_REQUIRED, http: 422, condition: "Required photo_type coverage missing for the computed classification" }
  - { id: ERR_CLAIM_ALREADY_OPEN, http: 409, condition: "Another FILED claim exists for the same treatment order" }
  - { id: ERR_DUPLICATE_FISCAL_YEAR, http: 409, condition: "A budget already exists for fiscal_year" }
  - { id: ERR_DUPLICATE_POLE_NUMBER, http: 409, condition: "pole_number already registered" }
  - { id: ERR_DUPLICATE_CREW_CODE, http: 409, condition: "crew_code already registered" }
  - { id: ERR_DUPLICATE_INSPECTION, http: 409, condition: "A non-terminal task for the same pole already exists in the same cycle" }
  - { id: ERR_CREW_SCHEDULE_CONFLICT, http: 409, condition: "Half-open crew window overlaps another SCHEDULED order for the crew" }
  - { id: ERR_TASK_WINDOW_OVERLAP, http: 409, condition: "Closed due-window touches another non-terminal task window for the same pole" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Window end before-or-equal constraints violated (due_window_end < due_window_start; work_end_date <= work_start_date)" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Claim filed_at > warranty_end_date" }
  - { id: ERR_CURE_DEADLINE_PASSED, http: 422, condition: "mark-cured attempted after cure_deadline" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "escalated_cost_cents > budget.available_cents at fund" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramManager
    description: "Utility program office: owns cycles, poles, budgets, orders, adjudications and the logical clock"
    identity: opaque
    exclusive_operations: [create/open/reconcile cycles, create poles, patch gis-attributes, create/waive tasks, create/schedule treatment orders, file/adjudicate warranty claims, create budgets, create/fund/defund/defer replacement orders, adjudicate attachment audits, create crews, set clock]
    shared_operations: [all GET endpoints]
  - name: Inspector
    description: "Field inspector (Osmose-style) performing decay tests and evidence capture"
    identity: opaque
    exclusive_operations: [submit inspection tasks]
    shared_operations: [all GET endpoints]
  - name: QAReviewer
    description: "Quality auditor; must not review work they submitted (segregation of duties)"
    identity: opaque
    exclusive_operations: [qa-review on inspection tasks, qa-review on treatment orders]
    shared_operations: [all GET endpoints]
  - name: Contractor
    description: "Contractor crew performing treatment and replacement field work; X-User-ID is the crew id"
    identity: "entity_backed:ContractorCrew"
    exclusive_operations: [apply treatment orders, complete replacement orders]
    shared_operations: [all GET endpoints]
  - name: AttacherRep
    description: "Joint-use attacher representative responding to violation notices"
    identity: opaque
    exclusive_operations: [mark-cured on attachment audits]
    shared_operations: [all GET endpoints]
