scenario: |
  2931. Self-Order Kiosk & Digital Menu Board Content Management (chain restaurant digital operations): content scheduling by daypart, store cluster and local price zone, item availability sync from inventory and 86 lists, kiosk upsell and combo suggestion rule configuration, accessibility requirements for kiosk interaction and screen reader support, hardware health monitoring with offline caching and failover, price change approval workflow and audit trail, promotional campaign versioning with start/end enforcement, kiosk payment device compliance and receipt/order-number handoff to the kitchen

domain_name: self-order-kiosk-content-ops
api_prefix: "/kiosk-ops"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: graph
  # Content flows down a self-referential StoreCluster chain (parent_cluster_id);
  # pricing flows through an orthogonal PriceZone axis attached directly to Store;
  # UpsellRule forms a MenuItem->MenuItem suggestion digraph that must stay acyclic.
  # No entity is reachable by exactly one path, so URL nesting is deliberately shallow.

  state_machine_shape: cyclic
  # PriceChangeRequest cycles PENDING_APPROVAL -> CHANGES_REQUESTED -> PENDING_APPROVAL
  # (revision_round increments each loop). ContentBundle is a fork-join (technical
  # validation branch + accessibility audit branch must both complete before PUBLISH).
  # Device, StoreItemAvailability and OrderHandoff each carry independent parallel
  # state dimensions. Store.content_posture is a compound field derived from its Devices.

  relationship_patterns:
    - one_to_many          # StoreCluster -> Store, Store -> StoreItemAvailability, Device -> OrderHandoff
    - many_to_many         # StoreItemAvailability joins Store x MenuItem; ContentBundle.price_snapshot joins MenuItem x PriceZone
    - self_referential     # StoreCluster.parent_cluster_id (content inheritance chain, max depth 5)
    - polymorphic          # AuditEvent.subject_kind + AuditEvent.subject_id
    - cross_aggregate      # PriceChangeRequest (pricing aggregate) mutates MenuItem, which invalidates ContentBundle and Device caches

  role_model: segregation_of_duties
  # A PricingApprover may never approve a request whose requested_by_user_id equals its
  # own X-User-ID, and a second approval must come from a different X-User-ID than the first.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 12 entities / 46 endpoints / 36 error codes / 9 calculations (4 with divergent variants) /
  # 7 state machines (1 cyclic, 3 parallel-dimension, 1 fork-join, 1 compound-posture).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

constants_global:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MIN_CONTRAST_RATIO: 4.5
  DUAL_APPROVAL_UPLIFT_BP: 500
  HEARTBEAT_INTERVAL_MINUTES: 5
  MISS_PENALTY_POINTS: 15
  MISS_PENALTY_CAP: 60
  PROJECTED_MISSES: 2
  QUARANTINE_MISS_FLOOR: 3
  HEALTH_ONLINE_MIN: 80
  HEALTH_DEGRADED_MIN: 50
  WEIGHT_PRINTER: 20
  WEIGHT_TOUCH: 30
  WEIGHT_SCREEN_READER: 25
  WEIGHT_NETWORK: 25
  LOW_STOCK_RATIO_BP: 2000
  AUTO_86_HOLD_MINUTES: 120
  MAX_UPSELL_SUGGESTIONS: 3
  ACCESSIBILITY_MAX_SUGGESTIONS: 2
  MIN_PROMPT_SECONDS: 5
  ATTESTATION_EXPIRING_DAYS: 30
  MAX_CLUSTER_CHAIN_DEPTH: 5
  MAX_CONCURRENT_CAMPAIGNS_PER_STACKING_GROUP: 1
  STATIC_FALLBACK_LAYOUT_CODE: "STATIC_FALLBACK"

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PriceZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: Human-readable local price zone code, unique chain-wide (case-sensitive exact match).
        constraints: "1..16 chars; unique across all PriceZone rows"
      - name: currency_code
        type: string
        source: input
        description: ISO-4217 currency of every price in this zone.
        default: "USD"
        constraints: "exactly 3 uppercase letters"
      - name: price_multiplier_bp
        type: integer
        source: input
        description: Basis points applied to MenuItem.base_price_cents to derive the zoned price before psychological rounding.
        constraints: ">= 5000 and <= 20000 (i.e. 0.50x .. 2.00x)"
      - name: psychological_rounding
        type: enum
        source: input
        description: Rounding style applied AFTER the multiplier (and also to an explicit zone override price).
        constraints: "one of {NONE, NEAREST_05, NINE_ENDING}"
      - name: tax_rate_bp
        type: integer
        source: input
        description: Basis points of sales tax applied to the discounted net subtotal of an OrderHandoff placed in this zone.
        constraints: ">= 0 and <= 2500"
      - name: max_uplift_bp
        type: integer
        source: input
        description: Hard cap on uplift_bp of any single PriceChangeRequest targeting this zone.
        constraints: ">= 0 and <= 10000"

  - name: StoreCluster
    parent: null
    common_fields: true
    fields:
      - name: cluster_code
        type: string
        source: input
        description: Unique content-cluster code (e.g. URBAN_FLAGSHIP).
        constraints: "1..24 chars; unique across all StoreCluster rows"
      - name: tier
        type: enum
        source: input
        description: Operating tier of the cluster; recorded for reporting and used by no calculation.
        constraints: "one of {FLAGSHIP, STANDARD, EXPRESS}"
      - name: parent_cluster_id
        type: string
        source: input
        description: "FK -> StoreCluster.id; null for a root cluster. Content (daypart slots) is inherited from ancestors nearest-first."
        default: null
        constraints: "referenced cluster MUST exist; resulting chain length including self MUST be <= MAX_CLUSTER_CHAIN_DEPTH (5) and MUST NOT revisit any cluster id"
      - name: chain_depth
        type: integer
        source: computed
        description: Number of clusters on the inheritance chain including self (root cluster = 1).
      - name: published_bundle_version
        type: integer
        source: computed
        description: Highest ContentBundle.bundle_version among this cluster's own ContentBundle rows whose state == PUBLISHED; 0 when the cluster has none.

  - name: Store
    parent: StoreCluster
    common_fields: true
    fields:
      - name: store_code
        type: string
        source: input
        description: Unique store code; forms the prefix of every OrderHandoff.order_number.
        constraints: "1..12 chars; unique across all Store rows"
      - name: cluster_id
        type: string
        source: input
        description: "FK -> StoreCluster.id; the content cluster whose published bundle drives this store's boards and kiosks."
      - name: price_zone_id
        type: string
        source: input
        description: "FK -> PriceZone.id; the local price zone of this store. Orthogonal to cluster_id: two stores in one cluster may sit in different price zones."
      - name: timezone_offset_minutes
        type: integer
        source: input
        description: Fixed offset from UTC used to convert the logical clock into the store-local minute-of-day for daypart resolution.
        constraints: ">= -720 and <= 840"
      - name: accessibility_certified_until_utc
        type: datetime
        source: input
        description: ISO 8601 UTC instant through which this store's kiosk accessibility certification is valid (inclusive).
      - name: daily_order_seq_counter
        type: integer
        source: system
        description: Monotonic per-UTC-date order counter. Incremented on every successfully created OrderHandoff and NEVER decremented (voids leave a permanent gap).
        default: 0
      - name: seq_counter_date
        type: string
        source: system
        description: UTC calendar date (YYYY-MM-DD) the counter belongs to; when the logical clock crosses into a later date the counter resets to 0.
        default: null
      - name: open_order_count
        type: integer
        source: computed
        description: "COUNT of OrderHandoff rows whose device_id belongs to a Device with store_id == this store and whose handoff_state IN {QUEUED_TO_KITCHEN, ACCEPTED, CACHED_OFFLINE}. Conserved quantity of the void compensation invariant."
      - name: content_posture
        type: enum
        source: computed
        description: Aggregate operating posture derived from this store's Devices and its cluster chain's published bundle; gates kiosk order creation.
        constraints: "one of {OPEN, DEGRADED, FROZEN}"

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Unique chain-wide stock keeping unit.
        constraints: "1..24 chars; unique across all MenuItem rows"
      - name: display_name
        type: string
        source: input
        description: Name rendered on kiosks and menu boards.
        constraints: "1..80 chars"
      - name: category
        type: enum
        source: input
        description: Menu category; a daypart slot only exposes items whose category is listed in the slot's category_codes.
        constraints: "one of {ENTREE, SIDE, DRINK, DESSERT}"
      - name: base_price_cents
        type: integer
        source: input
        description: Chain-wide list price in minor units before any zone multiplier, rounding, override or campaign discount.
        constraints: ">= 1 and <= 100000"
      - name: allergen_tags
        type: array
        source: input
        description: Array of uppercase allergen tokens announced by the kiosk screen reader.
        default: []
        constraints: "each element one of {GLUTEN, DAIRY, NUTS, SOY, EGG, FISH, SESAME}"
      - name: screen_reader_text
        type: string
        source: input
        description: Alternative text the kiosk screen reader announces for this item; empty string means the item has no accessible description.
        default: ""
        constraints: "0..240 chars"
      - name: contrast_ratio
        type: number
        source: input
        description: Measured foreground/background contrast ratio of the item's board tile artwork.
        default: 0
        constraints: ">= 0 and <= 21, one decimal place"
      - name: accessibility_state
        type: enum
        source: computed
        description: Accessibility readiness of this item, recomputed on every write to screen_reader_text or contrast_ratio.
        constraints: "one of {READY, MISSING_ALT_TEXT, CONTRAST_FAIL}"
      - name: zone_price_overrides
        type: array
        source: computed
        description: "Array of objects { price_zone_id, price_cents, applied_request_id, applied_at_utc } written only by an APPLY of a PriceChangeRequest. price_zone_id equals the PriceZone.id of the applied request; applied_request_id equals the PriceChangeRequest.id that wrote the entry. At most one entry per price_zone_id."
        default: []
      - name: zone_override_total_cents
        type: integer
        source: computed
        description: "SUM of price_cents over every entry of zone_price_overrides (0 when empty). Conserved quantity of the price rollback compensation invariant."
      - name: pending_price_request_count
        type: integer
        source: computed
        description: "COUNT of PriceChangeRequest rows referencing this item whose state IN {DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED, APPROVED}."
      - name: pricing_lock_state
        type: enum
        source: computed
        description: "PENDING_CHANGE when pending_price_request_count >= 1, else UNLOCKED."
        constraints: "one of {UNLOCKED, PENDING_CHANGE}"
      - name: chainwide_availability_state
        type: enum
        source: computed
        description: "Bubble-up rollup over this item's StoreItemAvailability rows: UNAVAILABLE when every row has availability_state == UNAVAILABLE (or the item has no rows), LIMITED when at least one row is LIMITED and none is AVAILABLE, otherwise AVAILABLE."
        constraints: "one of {AVAILABLE, LIMITED, UNAVAILABLE}"

  - name: PriceChangeRequest
    parent: MenuItem
    common_fields: true
    fields:
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item whose zone price this request changes."
      - name: price_zone_id
        type: string
        source: input
        description: "FK -> PriceZone.id; the single local price zone this request re-prices."
      - name: proposed_price_cents
        type: integer
        source: input
        description: Raw proposed zone price in minor units, BEFORE psychological rounding (rounding is applied only at APPLY time).
        constraints: ">= 1 and <= 100000"
      - name: justification
        type: string
        source: input
        description: Free-text business justification recorded verbatim in the audit trail.
        constraints: "1..280 chars"
      - name: effective_from_utc
        type: datetime
        source: input
        description: ISO 8601 UTC instant at or after which the approved change may be applied.
        constraints: ">= the logical clock at creation time"
      - name: state
        type: enum
        source: system
        description: Approval workflow state.
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED, APPROVED, APPLIED, REJECTED, WITHDRAWN, ROLLED_BACK}"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the PricingAnalyst that created the request; the segregation-of-duties check compares approvers against this value.
      - name: approval_user_ids
        type: array
        source: system
        description: Ordered array of distinct X-User-ID strings that have recorded an APPROVE on this request in the current revision_round.
        default: []
      - name: baseline_price_cents
        type: integer
        source: computed
        description: Effective zone price of (menu_item_id, price_zone_id) evaluated at creation time, i.e. the existing zone_price_overrides entry when present, else the multiplier-and-rounding result. Frozen at creation and NOT re-derived later.
      - name: uplift_bp
        type: integer
        source: computed
        description: Basis-point uplift of proposed_price_cents over baseline_price_cents, computed once at creation from the RAW proposed value.
      - name: required_approvals
        type: integer
        source: computed
        description: 2 when uplift_bp >= DUAL_APPROVAL_UPLIFT_BP (500), else 1. Computed once at creation and never re-derived.
        constraints: "1 or 2"
      - name: revision_round
        type: integer
        source: system
        description: Number of completed CHANGES_REQUESTED loops; incremented when the request re-enters PENDING_APPROVAL from CHANGES_REQUESTED.
        default: 0
      - name: pinned_menu_item_version
        type: integer
        source: computed
        description: MenuItem.version captured at the moment the request reached APPROVED; APPLY is rejected when the item's live version no longer equals it.
        default: null
      - name: applied_price_cents
        type: integer
        source: computed
        description: Post-psychological-rounding zone price written into MenuItem.zone_price_overrides at APPLY; null before APPLY.
        default: null
      - name: last_decision_comment
        type: string
        source: system
        description: Comment supplied with the most recent APPROVE / REJECT / REQUEST_CHANGES / ROLLBACK action.
        default: null

  - name: StoreItemAvailability
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store this availability row belongs to."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item this availability row tracks."
      - name: on_hand_units
        type: integer
        source: input
        description: Units physically counted by the last inventory sync.
        constraints: ">= 0 and <= 100000"
      - name: reserved_units
        type: integer
        source: input
        description: Units already committed to open orders and therefore not sellable.
        default: 0
        constraints: ">= 0 and <= 100000"
      - name: par_units
        type: integer
        source: input
        description: Target par level used as the denominator of the LOW-stock threshold.
        constraints: ">= 1 and <= 100000"
      - name: available_units
        type: integer
        source: computed
        description: "max(0, on_hand_units - reserved_units)."
      - name: supply_state
        type: enum
        source: computed
        description: Inventory dimension of the parallel state pair, derived from available_units and par_units.
        constraints: "one of {IN_STOCK, LOW, DEPLETED}"
      - name: listing_state
        type: enum
        source: system
        description: Merchandising dimension of the parallel state pair; evolves independently of supply_state.
        default: LISTED
        constraints: "one of {LISTED, EIGHTY_SIXED, DISCONTINUED}"
      - name: eighty_six_state
        type: enum
        source: system
        description: Provenance of the current 86, distinguishing an operator decision from an inventory-driven auto-86.
        default: NONE
        constraints: "one of {NONE, MANUAL_86, AUTO_86}"
      - name: eighty_six_until_utc
        type: datetime
        source: system
        description: ISO 8601 UTC instant at which the current 86 lapses; null when eighty_six_state == NONE.
        default: null
      - name: eighty_six_reason
        type: string
        source: system
        description: Reason recorded with the most recent 86.
        default: null
      - name: availability_state
        type: enum
        source: computed
        description: Single kiosk-facing rollup of supply_state and listing_state.
        constraints: "one of {AVAILABLE, LIMITED, UNAVAILABLE}"
      - name: last_sync_utc
        type: datetime
        source: system
        description: Logical-clock instant of the most recent inventory sync action on this row.
        default: null

  - name: PromoCampaignVersion
    parent: StoreCluster
    common_fields: true
    fields:
      - name: campaign_code
        type: string
        source: input
        description: Stable campaign identity shared by all of its versions.
        constraints: "1..24 chars"
      - name: version_no
        type: integer
        source: input
        description: Version number within campaign_code; (campaign_code, version_no) is unique chain-wide.
        constraints: ">= 1"
      - name: cluster_id
        type: string
        source: input
        description: "FK -> StoreCluster.id; the cluster whose stores this campaign version prices."
      - name: discount_kind
        type: enum
        source: input
        description: Interpretation of discount_value.
        constraints: "one of {PERCENT_OFF, AMOUNT_OFF}"
      - name: discount_value
        type: integer
        source: input
        description: Basis points off each line when discount_kind == PERCENT_OFF; minor-unit cents off each line when discount_kind == AMOUNT_OFF.
        constraints: ">= 1; <= 10000 when PERCENT_OFF"
      - name: window_start_utc
        type: datetime
        source: input
        description: ISO 8601 UTC start of the CLOSED activation window (a campaign is live at exactly this instant).
      - name: window_end_utc
        type: datetime
        source: input
        description: ISO 8601 UTC end of the CLOSED activation window (a campaign is still live at exactly this instant and expires strictly after it).
        constraints: "> window_start_utc; > the logical clock at creation time"
      - name: stacking_group
        type: string
        source: input
        description: Mutual-exclusion group; at most MAX_CONCURRENT_CAMPAIGNS_PER_STACKING_GROUP (1) version per (cluster_id, stacking_group) may occupy any instant.
        constraints: "1..24 chars"
      - name: priority_rank
        type: integer
        source: input
        description: Primary sort key when several live campaign versions compete for one order (lower wins).
        constraints: ">= 1 and <= 999"
      - name: state
        type: enum
        source: system
        description: Lifecycle state of this campaign version.
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, ACTIVE, EXPIRED, WITHDRAWN, SUPERSEDED}"
      - name: pinned_bundle_version
        type: integer
        source: computed
        description: StoreCluster.published_bundle_version captured at the moment this version reached SCHEDULED; null before that.
        default: null

  - name: UpsellRule
    parent: StoreCluster
    common_fields: true
    fields:
      - name: cluster_id
        type: string
        source: input
        description: "FK -> StoreCluster.id; the cluster whose kiosks evaluate this rule."
      - name: trigger_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the cart item that arms this suggestion."
      - name: suggested_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item offered to the guest. The set of (trigger_item_id -> suggested_item_id) edges within one cluster MUST stay acyclic."
      - name: rule_kind
        type: enum
        source: input
        description: Presentation style of the suggestion on the kiosk.
        constraints: "one of {UPSELL, COMBO_SUGGESTION}"
      - name: min_cart_subtotal_cents
        type: integer
        source: input
        description: Inclusive minimum gross subtotal of the cart before this rule is eligible.
        default: 0
        constraints: ">= 0"
      - name: suggestion_slot
        type: integer
        source: input
        description: Screen slot the suggestion occupies; unique per (cluster_id, trigger_item_id) among rules whose state == ACTIVE.
        constraints: ">= 1 and <= 3"
      - name: max_prompt_seconds
        type: integer
        source: input
        description: Maximum seconds the kiosk may hold the suggestion prompt; must be >= MIN_PROMPT_SECONDS (5) so screen-reader users can complete the announcement.
        constraints: ">= 1 and <= 60"
      - name: state
        type: enum
        source: system
        description: ACTIVE at creation; system-suspended when the suggested item becomes unavailable chain-wide and system-reactivated when it recovers.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: suspended_reason
        type: string
        source: system
        description: Reason token recorded when the rule was suspended by a cascade (e.g. SUGGESTED_ITEM_UNAVAILABLE); null while ACTIVE.
        default: null

  - name: ContentBundle
    parent: StoreCluster
    common_fields: true
    fields:
      - name: cluster_id
        type: string
        source: input
        description: "FK -> StoreCluster.id; the cluster this bundle publishes to."
      - name: bundle_version
        type: integer
        source: computed
        description: "1 + the highest bundle_version among existing ContentBundle rows of the same cluster_id (1 for the first)."
      - name: state
        type: enum
        source: system
        description: Publication state of the bundle.
        default: DRAFT
        constraints: "one of {DRAFT, VALIDATING, VALIDATED, PUBLISHED, SUPERSEDED, ROLLED_BACK}"
      - name: accessibility_audit_state
        type: enum
        source: system
        description: Independent accessibility gate that must reach PASSED before PUBLISH; evolves on the ComplianceOfficer branch of the fork-join.
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED}"
      - name: daypart_slots
        type: array
        source: system
        description: "Ordered array of objects { daypart_code, start_minute_of_day, end_minute_of_day, layout_code, buffer_minutes, category_codes, created_at } appended by the daypart-slots endpoint, ordered by created_at ASC."
        default: []
      - name: snapshot_item_ids
        type: array
        source: computed
        description: Array of MenuItem.id values frozen at PUBLISH — every MenuItem existing at that instant. Items created later are absent until a newer bundle is published.
        default: []
      - name: price_snapshot
        type: array
        source: computed
        description: "Array of objects { menu_item_id, price_zone_id, price_cents } frozen at PUBLISH, holding the board display price of every snapshot item in every PriceZone referenced by a Store of this cluster, ordered by (menu_item_id created_at ASC, price_zone_id created_at ASC)."
        default: []
      - name: price_snapshot_checksum
        type: integer
        source: computed
        description: SUM of price_cents over price_snapshot; recomputed against live prices whenever a price cascade touches this bundle so drift is observable.
        default: 0
      - name: live_price_checksum
        type: integer
        source: computed
        description: SUM over the same (menu_item_id, price_zone_id) pairs of the board display price computed from LIVE MenuItem data; equals price_snapshot_checksum while the bundle is fresh.
        default: 0
      - name: stale_flag
        type: boolean
        source: computed
        description: true when live_price_checksum != price_snapshot_checksum or when an UpsellRule of this cluster was suspended after PUBLISH.
        default: false
      - name: validation_findings
        type: array
        source: system
        description: Array of finding tokens produced by the VALIDATE action (empty array means the technical branch passed).
        default: []
      - name: accessibility_findings
        type: array
        source: system
        description: Array of finding tokens supplied by the ComplianceOfficer accessibility audit.
        default: []
      - name: published_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of PUBLISH; null before publication.
        default: null
      - name: effective_from_utc
        type: datetime
        source: input
        description: Optional ISO 8601 UTC instant recorded as the intended go-live of this bundle's content; informational only.
        default: null

  - name: Device
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store the hardware is installed in."
      - name: cached_bundle_id
        type: string
        source: system
        description: "FK -> ContentBundle.id; the bundle currently cached on the device. null until the first successful cache-sync."
        default: null
      - name: device_kind
        type: enum
        source: input
        description: KIOSK devices take orders and hold a payment terminal; MENU_BOARD devices only render content and have neither printer nor touch panel.
        constraints: "one of {KIOSK, MENU_BOARD}"
      - name: device_code
        type: string
        source: input
        description: Unique hardware code within the store.
        constraints: "1..16 chars; unique per store_id"
      - name: offline_cache_capacity
        type: integer
        source: input
        description: Maximum number of CACHED_OFFLINE orders the device may hold before it must be flushed.
        constraints: ">= 0 and <= 50"
      - name: health_state
        type: enum
        source: computed
        description: Hardware dimension of the parallel state triple, derived from the last heartbeat and the logical clock.
        default: OFFLINE
        constraints: "one of {ONLINE, DEGRADED, OFFLINE, QUARANTINED}"
      - name: payment_compliance_state
        type: enum
        source: computed
        description: Payment dimension of the parallel state triple; NOT_APPLICABLE for MENU_BOARD devices, UNATTESTED for a KIOSK that has never been attested.
        default: UNATTESTED
        constraints: "one of {NOT_APPLICABLE, UNATTESTED, COMPLIANT, EXPIRING, NON_COMPLIANT}"
      - name: cache_state
        type: enum
        source: computed
        description: Content dimension of the parallel state triple; MISSING until first sync, FRESH after syncing a PUBLISHED bundle, STALE once that bundle is marked stale or superseded.
        default: MISSING
        constraints: "one of {MISSING, FRESH, STALE}"
      - name: printer_ok
        type: boolean
        source: system
        description: Printer flag from the most recent heartbeat; always treated as true for MENU_BOARD devices.
        default: false
      - name: touch_ok
        type: boolean
        source: system
        description: Touch-panel flag from the most recent heartbeat; always treated as true for MENU_BOARD devices.
        default: false
      - name: screen_reader_ok
        type: boolean
        source: system
        description: Screen-reader subsystem flag from the most recent heartbeat.
        default: false
      - name: network_ok
        type: boolean
        source: system
        description: Network flag from the most recent heartbeat.
        default: false
      - name: last_heartbeat_utc
        type: datetime
        source: system
        description: Logical-clock instant of the most recent heartbeat; null before the first one.
        default: null
      - name: consecutive_missed_heartbeats
        type: integer
        source: computed
        description: "floor(minutes between last_heartbeat_utc and the logical clock / HEARTBEAT_INTERVAL_MINUTES); 0 when last_heartbeat_utc is null."
        default: 0
      - name: rolling_health_score
        type: integer
        source: computed
        description: Observed health score in 0..100 from the last heartbeat's flags and the misses actually recorded.
        default: 0
      - name: worst_case_health_score
        type: integer
        source: computed
        description: Projected health score in 0..100 assuming PROJECTED_MISSES (2) further heartbeats are also missed.
        default: 0
      - name: cached_bundle_version
        type: integer
        source: system
        description: bundle_version of cached_bundle_id at sync time; 0 when nothing is cached.
        default: 0
      - name: pin_pad_firmware_version
        type: string
        source: system
        description: Firmware version reported by the payment terminal at the last attestation; null for MENU_BOARD.
        default: null
      - name: attestation_expiry_utc
        type: datetime
        source: system
        description: ISO 8601 UTC instant the current PCI attestation lapses (inclusive); null when never attested.
        default: null
      - name: p2pe_certified
        type: boolean
        source: system
        description: Whether the last attestation declared point-to-point encryption certified.
        default: false
      - name: offline_order_count
        type: integer
        source: computed
        description: "COUNT of this device's OrderHandoff rows whose handoff_state == CACHED_OFFLINE. Conserved quantity of the offline-void compensation invariant."
        default: 0

  - name: OrderHandoff
    parent: Device
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; the kiosk that captured the order."
      - name: applied_campaign_version_id
        type: string
        source: computed
        description: "FK -> PromoCampaignVersion.id; the single campaign version selected for this order, or null when none was eligible."
        default: null
      - name: order_number
        type: string
        source: computed
        description: "Kitchen-facing order number, formatted '<Store.store_code>-<daily sequence zero-padded to 4 digits>' using Store.daily_order_seq_counter + 1."
      - name: line_items
        type: array
        source: input
        description: "Array of objects { menu_item_id, qty } as captured on the kiosk; qty >= 1 and <= 99; at least one element; menu_item_id values must be distinct."
      - name: priced_lines
        type: array
        source: computed
        description: "Array of objects { menu_item_id, qty, unit_price_cents, gross_line_cents, line_discount_cents } in the same order as line_items."
      - name: subtotal_cents
        type: integer
        source: computed
        description: SUM of gross_line_cents over priced_lines.
      - name: discount_cents
        type: integer
        source: computed
        description: SUM of the per-line rounded line_discount_cents over priced_lines (per-line rounding then sum — pinned order).
      - name: tax_cents
        type: integer
        source: computed
        description: Tax on (subtotal_cents - discount_cents) at the store's PriceZone.tax_rate_bp.
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents - discount_cents + tax_cents.
      - name: tender_kind
        type: enum
        source: input
        description: Tender the guest chose; CARD and MOBILE_WALLET require a compliant payment device, CASH does not.
        constraints: "one of {CARD, CASH, MOBILE_WALLET}"
      - name: payment_state
        type: enum
        source: system
        description: Payment dimension of the parallel state pair.
        default: AUTHORIZED
        constraints: "one of {AUTHORIZED, CAPTURED, VOIDED}"
      - name: handoff_state
        type: enum
        source: system
        description: Kitchen dimension of the parallel state pair.
        constraints: "one of {QUEUED_TO_KITCHEN, CACHED_OFFLINE, ACCEPTED, VOIDED}"
      - name: created_offline
        type: boolean
        source: input
        description: true when the kiosk captured the order while its network was down; such orders start CACHED_OFFLINE and are released by a cache-sync flush.
        default: false
      - name: accepted_upsell_rule_ids
        type: array
        source: input
        description: Array of UpsellRule.id values the guest accepted; each must have been eligible for this cart at creation time.
        default: []
      - name: daypart_code
        type: string
        source: computed
        description: daypart_code resolved for the store at creation time, or null when the resolved slot set was empty (STATIC_FALLBACK).
      - name: pinned_bundle_version
        type: integer
        source: computed
        description: cached_bundle_version of the capturing device at creation time; the receipt is reproducible from that bundle alone.
      - name: receipt_hash
        type: string
        source: computed
        description: "Lowercase hex SHA-256 of the canonical string '<order_number>|<subtotal_cents>|<discount_cents>|<tax_cents>|<total_cents>|<pinned_bundle_version>'."

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: subject_kind
        type: enum
        source: system
        description: Type of the entity the event describes.
        constraints: "one of {MENU_ITEM, PRICE_CHANGE_REQUEST, CONTENT_BUNDLE, DEVICE, ITEM_AVAILABILITY, CAMPAIGN_VERSION, ORDER_HANDOFF, STORE}"
      - name: subject_id
        type: string
        source: system
        description: "Polymorphic subject reference: equals the id of the entity named by subject_kind (MENU_ITEM -> MenuItem.id, PRICE_CHANGE_REQUEST -> PriceChangeRequest.id, CONTENT_BUNDLE -> ContentBundle.id, DEVICE -> Device.id, ITEM_AVAILABILITY -> StoreItemAvailability.id, CAMPAIGN_VERSION -> PromoCampaignVersion.id, ORDER_HANDOFF -> OrderHandoff.id, STORE -> Store.id). Not a declared foreign key."
      - name: action
        type: string
        source: system
        description: Upper-snake action token (e.g. PRICE_REQUEST_APPROVED, PRICE_OVERRIDE_APPLIED, ITEM_EIGHTY_SIXED, BUNDLE_PUBLISHED, DEVICE_QUARANTINED, ORDER_VOIDED).
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of the request that produced the event, or "system" for clock-driven transitions.
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the request that produced the event, or null for clock-driven transitions.
      - name: at_utc
        type: datetime
        source: system
        description: Logical-clock instant at which the event was recorded.
      - name: before_value_cents
        type: integer
        source: system
        description: Monetary value before the change when the action moved money (else null).
        default: null
      - name: after_value_cents
        type: integer
        source: system
        description: Monetary value after the change when the action moved money (else null).
        default: null
      - name: sequence_no
        type: integer
        source: system
        description: 1-based monotonic counter within (subject_kind, subject_id), assigned in created_at ASC order; gaps are never introduced and rows are never mutated or deleted.
      - name: detail
        type: string
        source: system
        description: Short human-readable detail string (justification, reason or finding token).

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PriceChangeRequest
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, ROLLED_BACK]
    shape: cyclic
    note: |
      Cyclic: PENDING_APPROVAL -> CHANGES_REQUESTED -> PENDING_APPROVAL may repeat
      without bound, incrementing revision_round and clearing approval_user_ids each
      time. PENDING_APPROVAL also self-loops while the second of two required
      approvals is still outstanding.
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /kiosk-ops/price-change-requests/{request_id}/actions action=SUBMIT"
        actor: PricingAnalyst
        preconditions:
          - "request.state == DRAFT"
          - "X-User-ID equals request.requested_by_user_id"
        side_effects:
          - "approval_user_ids reset to []"
          - "AuditEvent appended (subject_kind=PRICE_CHANGE_REQUEST, action=PRICE_REQUEST_SUBMITTED)"
      - from: PENDING_APPROVAL
        to: PENDING_APPROVAL
        trigger: "POST /kiosk-ops/price-change-requests/{request_id}/actions action=APPROVE"
        actor: PricingApprover
        preconditions:
          - "request.state == PENDING_APPROVAL"
          - "X-User-ID != request.requested_by_user_id"
          - "X-User-ID not already present in approval_user_ids"
          - "length(approval_user_ids) + 1 < request.required_approvals"
        side_effects:
          - "X-User-ID appended to approval_user_ids"
          - "AuditEvent appended (action=PRICE_REQUEST_APPROVAL_RECORDED)"
        note: "Self-loop: the first of two required approvals leaves the request PENDING_APPROVAL."
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /kiosk-ops/price-change-requests/{request_id}/actions action=APPROVE"
        actor: PricingApprover
        preconditions:
          - "request.state == PENDING_APPROVAL"
          - "X-User-ID != request.requested_by_user_id"
          - "X-User-ID not already present in approval_user_ids"
          - "length(approval_user_ids) + 1 == request.required_approvals"
        side_effects:
          - "X-User-ID appended to approval_user_ids"
          - "pinned_menu_item_version set to the live MenuItem.version (version-pinning on approval)"
          - "AuditEvent appended (action=PRICE_REQUEST_APPROVED)"
      - from: PENDING_APPROVAL
        to: CHANGES_REQUESTED
        trigger: "POST /kiosk-ops/price-change-requests/{request_id}/actions action=REQUEST_CHANGES"
        actor: PricingApprover
        preconditions:
          - "request.state == PENDING_APPROVAL"
          - "X-User-ID != request.requested_by_user_id"
        side_effects:
          - "last_decision_comment set from the action comment"
          - "approval_user_ids reset to []"
          - "AuditEvent appended (action=PRICE_REQUEST_CHANGES_REQUESTED)"
      - from: CHANGES_REQUESTED
        to: PENDING_APPROVAL
        trigger: "POST /kiosk-ops/price-change-requests/{request_id}/actions action=SUBMIT"
        actor: PricingAnalyst
        preconditions:
          - "request.state == CHANGES_REQUESTED"
          - "X-User-ID equals request.requested_by_user_id"
        side_effects:
          - "revision_round incremented by 1"
          - "approval_user_ids reset to []"
          - "AuditEvent appended (action=PRICE_REQUEST_RESUBMITTED)"
        note: "Closes the revision cycle; baseline_price_cents, uplift_bp and required_approvals are NEVER re-derived."
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /kiosk-ops/price-change-requests/{request_id}/actions action=REJECT"
        actor: PricingApprover
        preconditions:
          - "request.state == PENDING_APPROVAL"
          - "X-User-ID != request.requested_by_user_id"
        side_effects:
          - "MenuItem.pending_price_request_count recomputed; pricing_lock_state recomputed; MenuItem.version incremented by 1"
          - "AuditEvent appended (action=PRICE_REQUEST_REJECTED)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /kiosk-ops/price-change-requests/{request_id}/actions action=WITHDRAW"
        actor: PricingAnalyst
        preconditions:
          - "request.state IN {DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED}"
          - "X-User-ID equals request.requested_by_user_id"
        side_effects:
          - "MenuItem.pending_price_request_count recomputed; pricing_lock_state recomputed; MenuItem.version incremented by 1"
          - "AuditEvent appended (action=PRICE_REQUEST_WITHDRAWN)"
        note: "The same transition is available from PENDING_APPROVAL and CHANGES_REQUESTED."
      - from: APPROVED
        to: APPLIED
        trigger: "POST /kiosk-ops/price-change-requests/{request_id}/actions action=APPLY, or POST /kiosk-ops/_clock/set_current_utc advancing the clock to or past effective_from_utc"
        actor: PricingAnalyst | PlatformAdmin | system
        preconditions:
          - "request.state == APPROVED"
          - "logical clock >= request.effective_from_utc"
          - "MenuItem.version == request.pinned_menu_item_version"
        side_effects:
          - "CASCADE LINK 0: applied_price_cents set to psychological_round(proposed_price_cents) using the request's PriceZone.psychological_rounding"
          - "CASCADE LINK 1 (caused by link 0): MenuItem.zone_price_overrides upserts { price_zone_id, price_cents: applied_price_cents, applied_request_id, applied_at_utc }, zone_override_total_cents recomputed, pending_price_request_count recomputed, pricing_lock_state recomputed, MenuItem.version incremented by 1"
          - "CASCADE LINK 2 (caused by link 1's MenuItem price mutation): every ContentBundle with state == PUBLISHED whose cluster owns at least one Store in this PriceZone recomputes live_price_checksum, sets stale_flag = true, and increments its own version by 1"
          - "CASCADE LINK 3 (caused by link 2's stale_flag flip): every Device whose cached_bundle_id is one of those bundles sets cache_state = STALE and increments its own version by 1"
          - "CASCADE LINK 4 (caused by link 3's cache_state change): every Store owning one of those Devices recomputes content_posture (OPEN -> DEGRADED)"
          - "AuditEvent appended (subject_kind=MENU_ITEM, action=PRICE_OVERRIDE_APPLIED, before_value_cents=baseline_price_cents, after_value_cents=applied_price_cents)"
      - from: APPLIED
        to: ROLLED_BACK
        trigger: "POST /kiosk-ops/price-change-requests/{request_id}/actions action=ROLLBACK"
        actor: PricingApprover
        preconditions:
          - "request.state == APPLIED"
          - "the MenuItem.zone_price_overrides entry for this price_zone_id still has applied_request_id == request.id (no later request overwrote it)"
        side_effects:
          - "COMPENSATION: the zone_price_overrides entry written by this request is removed, restoring the multiplier-and-rounding price; zone_override_total_cents recomputed; MenuItem.version incremented by 1"
          - "every PUBLISHED ContentBundle touched by the forward APPLY recomputes live_price_checksum and stale_flag (returning to false when no other drift remains)"
          - "every Device caching such a bundle recomputes cache_state (returning to FRESH when the bundle is PUBLISHED, fresh and version-matched)"
          - "every affected Store recomputes content_posture"
          - "AuditEvent appended (action=PRICE_OVERRIDE_ROLLED_BACK, before_value_cents=applied_price_cents, after_value_cents=baseline_price_cents)"

  - entity: ContentBundle
    initial_state: DRAFT
    terminal_states: [ROLLED_BACK]
    shape: branching_fork_join
    note: |
      Fork-join: the technical branch (DRAFT -> VALIDATING -> VALIDATED | DRAFT) and the
      accessibility branch (accessibility_audit_state PENDING -> PASSED | FAILED) advance
      independently and carry different side-effect sets; PUBLISH is the join and requires
      both branches complete. SUPERSEDED is NOT terminal — a successor's ROLLBACK returns
      the most recent superseded bundle to PUBLISHED.
    transitions:
      - from: DRAFT
        to: VALIDATING
        trigger: "POST /kiosk-ops/content-bundles/{bundle_id}/actions action=VALIDATE"
        actor: ContentManager
        preconditions:
          - "bundle.state == DRAFT"
          - "length(bundle.daypart_slots) >= 1"
        side_effects:
          - "validation_findings recomputed: token 'EMPTY_CATEGORY:<code>' for every category_code appearing in a daypart slot for which zero MenuItem rows exist, plus token 'SUSPENDED_UPSELL_RULE:<rule_id>' for every UpsellRule of this cluster whose state == SUSPENDED"
          - "an immediate system transition follows in the same request"
      - from: VALIDATING
        to: VALIDATED
        trigger: "system, immediately after VALIDATE when validation_findings is empty"
        actor: system
        preconditions:
          - "length(validation_findings) == 0"
        side_effects:
          - "AuditEvent appended (subject_kind=CONTENT_BUNDLE, action=BUNDLE_VALIDATED)"
      - from: VALIDATING
        to: DRAFT
        trigger: "system, immediately after VALIDATE when validation_findings is non-empty"
        actor: system
        preconditions:
          - "length(validation_findings) >= 1"
        side_effects:
          - "AuditEvent appended (action=BUNDLE_VALIDATION_FAILED, detail = first finding token)"
        note: "Divergent branch outcome: no accessibility field is touched by either technical outcome."
      - from: DRAFT
        to: DRAFT
        trigger: "POST /kiosk-ops/content-bundles/{bundle_id}/actions action=ACCESSIBILITY_AUDIT"
        actor: ComplianceOfficer
        preconditions:
          - "bundle.state IN {DRAFT, VALIDATED}"
        side_effects:
          - "accessibility_audit_state set to PASSED when outcome == PASS, else FAILED"
          - "accessibility_findings replaced by the supplied findings array"
          - "AuditEvent appended (action=BUNDLE_ACCESSIBILITY_AUDITED)"
        note: "Accessibility branch: leaves bundle.state untouched and touches no validation field."
      - from: VALIDATED
        to: VALIDATED
        trigger: "POST /kiosk-ops/content-bundles/{bundle_id}/actions action=ACCESSIBILITY_AUDIT"
        actor: ComplianceOfficer
        preconditions:
          - "bundle.state == VALIDATED"
        side_effects:
          - "accessibility_audit_state set to PASSED when outcome == PASS, else FAILED"
          - "accessibility_findings replaced by the supplied findings array"
          - "AuditEvent appended (action=BUNDLE_ACCESSIBILITY_AUDITED)"
        note: "The two branches are order-independent: the accessibility audit may run before or after VALIDATE, and running it on a VALIDATED bundle does NOT send it back to DRAFT."
      - from: VALIDATED
        to: PUBLISHED
        trigger: "POST /kiosk-ops/content-bundles/{bundle_id}/actions action=PUBLISH"
        actor: ContentManager
        preconditions:
          - "bundle.state == VALIDATED"
          - "bundle.accessibility_audit_state == PASSED"
          - "every MenuItem in snapshot_item_ids has screen_reader_text != \"\""
          - "every MenuItem in snapshot_item_ids has accessibility_state == READY"
        side_effects:
          - "snapshot_item_ids frozen to the id of every MenuItem whose category appears in at least one daypart slot's category_codes, ordered by created_at ASC"
          - "price_snapshot frozen to the board display price of every snapshot item in every PriceZone referenced by a Store of this cluster; price_snapshot_checksum and live_price_checksum set to its sum; stale_flag set to false"
          - "published_at_utc set to the logical clock"
          - "CASCADE: the cluster's previously PUBLISHED bundle (if any) transitions PUBLISHED -> SUPERSEDED"
          - "CASCADE (caused by that supersession): every Device whose cached_bundle_id is the superseded bundle sets cache_state = STALE"
          - "CASCADE (caused by those device changes): every Store of the cluster recomputes content_posture"
          - "StoreCluster.published_bundle_version recomputed"
          - "AuditEvent appended (action=BUNDLE_PUBLISHED)"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system, when a newer bundle of the same cluster is PUBLISHED"
        actor: system
        preconditions:
          - "bundle.state == PUBLISHED"
        side_effects:
          - "AuditEvent appended (action=BUNDLE_SUPERSEDED)"
      - from: PUBLISHED
        to: ROLLED_BACK
        trigger: "POST /kiosk-ops/content-bundles/{bundle_id}/actions action=ROLLBACK"
        actor: ContentManager | PlatformAdmin
        preconditions:
          - "bundle.state == PUBLISHED"
        side_effects:
          - "COMPENSATION: the cluster's SUPERSEDED bundle with the highest bundle_version (if any) transitions SUPERSEDED -> PUBLISHED and its stale_flag is recomputed"
          - "every Device whose cached_bundle_id is the rolled-back bundle sets cache_state = STALE"
          - "every Store of the cluster recomputes content_posture (FROZEN when the rollback leaves the cluster chain with no PUBLISHED bundle)"
          - "StoreCluster.published_bundle_version recomputed"
          - "AuditEvent appended (action=BUNDLE_ROLLED_BACK)"
      - from: SUPERSEDED
        to: PUBLISHED
        trigger: "system, when the successor bundle of the same cluster is ROLLED_BACK"
        actor: system
        preconditions:
          - "bundle.state == SUPERSEDED"
          - "bundle.bundle_version is the highest among the cluster's SUPERSEDED bundles"
        side_effects:
          - "stale_flag recomputed from live prices and cluster upsell-rule suspensions"
          - "AuditEvent appended (action=BUNDLE_REPUBLISHED)"

  - entity: StoreItemAvailability
    initial_state: "supply_state=IN_STOCK x listing_state=LISTED"
    terminal_states: ["listing_state=DISCONTINUED"]
    shape: parallel_dimensions
    note: |
      Two independent dimensions on one row. supply_state is driven exclusively by
      inventory numbers (SYNC_ON_HAND); listing_state is driven by merchandising
      actions, by the DEPLETED auto-86 trigger and by the AUTO_86 lapse on the clock.
      availability_state is the pinned rollup of both. A MANUAL_86 never lapses on the
      clock; only an AUTO_86 does.
    transitions:
      - from: "supply_state=IN_STOCK"
        to: "supply_state=LOW"
        trigger: "POST /kiosk-ops/item-availabilities/{availability_id}/actions action=SYNC_ON_HAND"
        actor: StoreOperator | PlatformAdmin
        preconditions:
          - "0 < available_units <= round_half_up(par_units * LOW_STOCK_RATIO_BP / 10000)"
        side_effects:
          - "available_units, supply_state and availability_state recomputed; last_sync_utc set to the logical clock"
          - "MenuItem.chainwide_availability_state recomputed (bubble up)"
      - from: "supply_state=LOW"
        to: "supply_state=DEPLETED"
        trigger: "POST /kiosk-ops/item-availabilities/{availability_id}/actions action=SYNC_ON_HAND"
        actor: StoreOperator | PlatformAdmin
        preconditions:
          - "available_units <= 0"
        side_effects:
          - "CASCADE LINK 1: listing_state set to EIGHTY_SIXED, eighty_six_state set to AUTO_86, eighty_six_until_utc set to clock + AUTO_86_HOLD_MINUTES (120), eighty_six_reason set to 'INVENTORY_DEPLETED', availability_state -> UNAVAILABLE"
          - "CASCADE LINK 2 (caused by link 1): MenuItem.chainwide_availability_state recomputed"
          - "CASCADE LINK 3 (caused by link 2 reaching UNAVAILABLE): every UpsellRule with suggested_item_id == this item and state == ACTIVE transitions to SUSPENDED with suspended_reason='SUGGESTED_ITEM_UNAVAILABLE'"
          - "CASCADE LINK 4 (caused by link 3): every PUBLISHED ContentBundle of each suspended rule's cluster sets stale_flag = true"
          - "CASCADE LINK 5 (caused by link 4): every Device caching such a bundle sets cache_state = STALE, and each owning Store recomputes content_posture"
          - "AuditEvent appended (subject_kind=ITEM_AVAILABILITY, action=ITEM_AUTO_EIGHTY_SIXED)"
      - from: "supply_state=DEPLETED"
        to: "supply_state=IN_STOCK"
        trigger: "POST /kiosk-ops/item-availabilities/{availability_id}/actions action=SYNC_ON_HAND"
        actor: StoreOperator | PlatformAdmin
        preconditions:
          - "available_units > round_half_up(par_units * LOW_STOCK_RATIO_BP / 10000)"
        side_effects:
          - "supply_state and availability_state recomputed; listing_state is NOT changed (an AUTO_86 survives restocking until it lapses or is restored)"
          - "MenuItem.chainwide_availability_state recomputed"
      - from: "listing_state=LISTED"
        to: "listing_state=EIGHTY_SIXED"
        trigger: "POST /kiosk-ops/item-availabilities/{availability_id}/actions action=EIGHTY_SIX"
        actor: StoreOperator
        preconditions:
          - "listing_state == LISTED"
          - "X-User-ID equals the row's store_id"
        side_effects:
          - "CASCADE LINK 1: eighty_six_state set to MANUAL_86, eighty_six_until_utc set to the supplied until_utc, eighty_six_reason recorded, availability_state -> UNAVAILABLE"
          - "CASCADE LINK 2 (caused by link 1): MenuItem.chainwide_availability_state recomputed"
          - "CASCADE LINK 3 (caused by link 2 reaching UNAVAILABLE): every UpsellRule with suggested_item_id == this item and state == ACTIVE transitions to SUSPENDED with suspended_reason='SUGGESTED_ITEM_UNAVAILABLE'"
          - "CASCADE LINK 4 (caused by link 3): every PUBLISHED ContentBundle of each suspended rule's cluster sets stale_flag = true and increments version by 1"
          - "CASCADE LINK 5 (caused by link 4): every Device caching such a bundle sets cache_state = STALE and each owning Store recomputes content_posture"
          - "AuditEvent appended (action=ITEM_EIGHTY_SIXED)"
      - from: "listing_state=EIGHTY_SIXED"
        to: "listing_state=LISTED"
        trigger: "POST /kiosk-ops/item-availabilities/{availability_id}/actions action=RESTORE"
        actor: StoreOperator
        preconditions:
          - "listing_state == EIGHTY_SIXED"
          - "X-User-ID equals the row's store_id"
        side_effects:
          - "COMPENSATION: eighty_six_state -> NONE, eighty_six_until_utc -> null, eighty_six_reason -> null, availability_state recomputed from supply_state"
          - "MenuItem.chainwide_availability_state recomputed"
          - "every UpsellRule suspended with suspended_reason == 'SUGGESTED_ITEM_UNAVAILABLE' whose suggested_item_id is again not UNAVAILABLE chain-wide returns to ACTIVE with suspended_reason -> null"
          - "every PUBLISHED ContentBundle of the affected clusters recomputes stale_flag (false when no price drift and no remaining suspended rule)"
          - "every Device caching such a bundle recomputes cache_state; every owning Store recomputes content_posture"
          - "AuditEvent appended (action=ITEM_RESTORED)"
      - from: "listing_state=EIGHTY_SIXED"
        to: "listing_state=LISTED"
        trigger: "POST /kiosk-ops/_clock/set_current_utc advancing the clock past eighty_six_until_utc"
        actor: system
        preconditions:
          - "eighty_six_state == AUTO_86"
          - "eighty_six_until_utc <= the new logical clock"
        side_effects:
          - "same compensation chain as the RESTORE action"
          - "AuditEvent appended (action=ITEM_AUTO_86_LAPSED, actor_role=system)"
        note: "A MANUAL_86 is explicitly NOT lapsed by the clock even when its until_utc has passed."
      - from: "listing_state=LISTED"
        to: "listing_state=DISCONTINUED"
        trigger: "POST /kiosk-ops/item-availabilities/{availability_id}/actions action=DISCONTINUE"
        actor: StoreOperator | PlatformAdmin
        preconditions:
          - "listing_state IN {LISTED, EIGHTY_SIXED}"
        side_effects:
          - "availability_state -> UNAVAILABLE permanently; eighty_six_state -> NONE; MenuItem.chainwide_availability_state recomputed; suggested-item upsell rules suspended as in the 86 cascade"
          - "AuditEvent appended (action=ITEM_DISCONTINUED)"

  - entity: Device
    initial_state: "health_state=OFFLINE x payment_compliance_state=UNATTESTED|NOT_APPLICABLE x cache_state=MISSING"
    terminal_states: []
    shape: parallel_dimensions
    note: |
      Three independent dimensions. No dimension constrains another: a QUARANTINED
      device may be COMPLIANT and FRESH, and a NON_COMPLIANT device may be ONLINE.
      payment_compliance_state is NOT_APPLICABLE from creation for MENU_BOARD devices
      and UNATTESTED from creation for KIOSK devices.
    transitions:
      - from: "health_state=OFFLINE"
        to: "health_state=ONLINE"
        trigger: "POST /kiosk-ops/devices/{device_id}/heartbeat"
        actor: DeviceAgent
        preconditions:
          - "X-User-ID equals device.id"
          - "resulting rolling_health_score >= HEALTH_ONLINE_MIN (80)"
        side_effects:
          - "flag fields, last_heartbeat_utc, consecutive_missed_heartbeats (reset to 0), rolling_health_score and worst_case_health_score recomputed"
          - "the owning Store recomputes content_posture"
      - from: "health_state=ONLINE"
        to: "health_state=DEGRADED"
        trigger: "POST /kiosk-ops/devices/{device_id}/heartbeat with a failing flag, or POST /kiosk-ops/_clock/set_current_utc raising consecutive_missed_heartbeats"
        actor: DeviceAgent | system
        preconditions:
          - "HEALTH_DEGRADED_MIN (50) <= resulting rolling_health_score < HEALTH_ONLINE_MIN (80)"
          - "NOT (consecutive_missed_heartbeats >= QUARANTINE_MISS_FLOOR (3) AND worst_case_health_score < 50)"
        side_effects:
          - "scores recomputed; the owning Store recomputes content_posture (OPEN -> DEGRADED)"
      - from: "health_state=ONLINE"
        to: "health_state=QUARANTINED"
        trigger: "POST /kiosk-ops/_clock/set_current_utc raising consecutive_missed_heartbeats to QUARANTINE_MISS_FLOOR or more"
        actor: system
        preconditions:
          - "consecutive_missed_heartbeats >= QUARANTINE_MISS_FLOOR (3)"
          - "worst_case_health_score < HEALTH_DEGRADED_MIN (50)"
        side_effects:
          - "scores recomputed; the owning Store recomputes content_posture"
          - "AuditEvent appended (subject_kind=DEVICE, action=DEVICE_QUARANTINED, actor_role=system)"
        note: "The quarantine decision reads worst_case_health_score while health_state banding reads rolling_health_score — the two variants disagree here."
      - from: "health_state=QUARANTINED"
        to: "health_state=ONLINE"
        trigger: "POST /kiosk-ops/devices/{device_id}/heartbeat"
        actor: DeviceAgent
        preconditions:
          - "X-User-ID equals device.id"
          - "resulting rolling_health_score >= HEALTH_ONLINE_MIN (80)"
        side_effects:
          - "consecutive_missed_heartbeats reset to 0; scores recomputed; owning Store recomputes content_posture"
      - from: "health_state=DEGRADED"
        to: "health_state=OFFLINE"
        trigger: "POST /kiosk-ops/devices/{device_id}/heartbeat with several failing flags, or POST /kiosk-ops/_clock/set_current_utc"
        actor: DeviceAgent | system
        preconditions:
          - "resulting rolling_health_score < HEALTH_DEGRADED_MIN (50)"
          - "NOT (consecutive_missed_heartbeats >= 3 AND worst_case_health_score < 50)"
        side_effects:
          - "scores recomputed; owning Store recomputes content_posture (FROZEN when every KIOSK of the store is OFFLINE or QUARANTINED)"
      - from: "payment_compliance_state=UNATTESTED"
        to: "payment_compliance_state=COMPLIANT"
        trigger: "POST /kiosk-ops/devices/{device_id}/payment-attestation"
        actor: ComplianceOfficer
        preconditions:
          - "device.device_kind == KIOSK"
          - "p2pe_certified == true"
          - "attestation_expiry_utc > clock + ATTESTATION_EXPIRING_DAYS (30) days"
        side_effects:
          - "pin_pad_firmware_version, attestation_expiry_utc and p2pe_certified stored; owning Store recomputes content_posture"
          - "AuditEvent appended (action=DEVICE_ATTESTED)"
      - from: "payment_compliance_state=UNATTESTED"
        to: "payment_compliance_state=EXPIRING"
        trigger: "POST /kiosk-ops/devices/{device_id}/payment-attestation, or POST /kiosk-ops/_clock/set_current_utc"
        actor: ComplianceOfficer | system
        preconditions:
          - "device.device_kind == KIOSK"
          - "p2pe_certified == true"
          - "clock < attestation_expiry_utc <= clock + 30 days"
        side_effects:
          - "attestation fields stored; owning Store recomputes content_posture (DEGRADED)"
      - from: "payment_compliance_state=EXPIRING"
        to: "payment_compliance_state=NON_COMPLIANT"
        trigger: "POST /kiosk-ops/_clock/set_current_utc advancing past attestation_expiry_utc, or POST /kiosk-ops/devices/{device_id}/payment-attestation with p2pe_certified == false"
        actor: system | ComplianceOfficer
        preconditions:
          - "attestation_expiry_utc <= clock OR p2pe_certified == false"
        side_effects:
          - "owning Store recomputes content_posture"
          - "AuditEvent appended (action=DEVICE_NON_COMPLIANT)"
      - from: "payment_compliance_state=NON_COMPLIANT"
        to: "payment_compliance_state=COMPLIANT"
        trigger: "POST /kiosk-ops/devices/{device_id}/payment-attestation"
        actor: ComplianceOfficer
        preconditions:
          - "p2pe_certified == true AND attestation_expiry_utc > clock + 30 days"
        side_effects:
          - "attestation fields replaced; owning Store recomputes content_posture"
      - from: "cache_state=MISSING"
        to: "cache_state=FRESH"
        trigger: "POST /kiosk-ops/devices/{device_id}/cache-sync"
        actor: DeviceAgent
        preconditions:
          - "X-User-ID equals device.id"
          - "the referenced ContentBundle.state == PUBLISHED"
          - "the referenced bundle's cluster is on the store's cluster inheritance chain"
        side_effects:
          - "cached_bundle_id and cached_bundle_version stored; cache_state -> FRESH (or STALE when the bundle's stale_flag is already true)"
          - "when flush_offline_orders == true, every OrderHandoff of this device with handoff_state == CACHED_OFFLINE transitions to QUEUED_TO_KITCHEN and offline_order_count is recomputed"
          - "owning Store recomputes content_posture"
      - from: "cache_state=FRESH"
        to: "cache_state=STALE"
        trigger: "system, when the cached bundle's stale_flag becomes true, or when it leaves PUBLISHED"
        actor: system
        preconditions:
          - "cached_bundle_id is not null"
        side_effects:
          - "owning Store recomputes content_posture"
      - from: "cache_state=STALE"
        to: "cache_state=FRESH"
        trigger: "POST /kiosk-ops/devices/{device_id}/cache-sync of the current PUBLISHED bundle, or system recomputation after the drift is compensated"
        actor: DeviceAgent | system
        preconditions:
          - "the cached bundle is PUBLISHED with stale_flag == false and cached_bundle_version == bundle.bundle_version"
        side_effects:
          - "owning Store recomputes content_posture"

  - entity: PromoCampaignVersion
    initial_state: DRAFT
    terminal_states: [EXPIRED, WITHDRAWN, SUPERSEDED]
    shape: branching
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /kiosk-ops/campaign-versions/{version_id}/actions action=SCHEDULE"
        actor: ContentManager
        preconditions:
          - "version.state == DRAFT"
          - "StoreCluster.published_bundle_version >= 1 for version.cluster_id (cross-entity dependency on ContentBundle)"
          - "window_end_utc >= the logical clock"
          - "no other PromoCampaignVersion of the same (cluster_id, stacking_group) with state IN {SCHEDULED, ACTIVE} has a closed window intersecting this one"
        side_effects:
          - "pinned_bundle_version set to StoreCluster.published_bundle_version (version-pinning on approval)"
          - "CASCADE: every PromoCampaignVersion with the same campaign_code, a lower version_no and state IN {SCHEDULED, ACTIVE} transitions to SUPERSEDED"
          - "an immediate activation evaluation follows in the same request"
          - "AuditEvent appended (subject_kind=CAMPAIGN_VERSION, action=CAMPAIGN_SCHEDULED)"
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system, immediately after SCHEDULE or on POST /kiosk-ops/_clock/set_current_utc"
        actor: system
        preconditions:
          - "window_start_utc <= clock <= window_end_utc"
        side_effects:
          - "AuditEvent appended (action=CAMPAIGN_ACTIVATED, actor_role=system)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /kiosk-ops/_clock/set_current_utc advancing strictly past window_end_utc"
        actor: system
        preconditions:
          - "clock > window_end_utc"
        side_effects:
          - "AuditEvent appended (action=CAMPAIGN_EXPIRED, actor_role=system)"
        note: "Closed interval: at clock == window_end_utc the version is still ACTIVE and still discounts orders."
      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /kiosk-ops/_clock/set_current_utc advancing strictly past window_end_utc before activation"
        actor: system
        preconditions:
          - "clock > window_end_utc"
        side_effects:
          - "AuditEvent appended (action=CAMPAIGN_EXPIRED, actor_role=system)"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /kiosk-ops/campaign-versions/{version_id}/actions action=WITHDRAW"
        actor: ContentManager
        preconditions:
          - "version.state IN {DRAFT, SCHEDULED, ACTIVE}"
        side_effects:
          - "AuditEvent appended (action=CAMPAIGN_WITHDRAWN)"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system, when a higher version_no of the same campaign_code is SCHEDULED"
        actor: system
        preconditions:
          - "version.state IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "AuditEvent appended (action=CAMPAIGN_SUPERSEDED, actor_role=system)"

  - entity: OrderHandoff
    initial_state: "payment_state=AUTHORIZED x handoff_state=QUEUED_TO_KITCHEN|CACHED_OFFLINE"
    terminal_states: ["handoff_state=VOIDED"]
    shape: parallel_dimensions
    note: |
      payment_state and handoff_state advance on different actions: kitchen-ack captures
      payment and accepts the ticket, a flush moves only the handoff dimension, and a void
      moves both. handoff_state == CACHED_OFFLINE at creation exactly when created_offline
      is true.
    transitions:
      - from: "handoff_state=CACHED_OFFLINE"
        to: "handoff_state=QUEUED_TO_KITCHEN"
        trigger: "POST /kiosk-ops/devices/{device_id}/cache-sync with flush_offline_orders == true"
        actor: DeviceAgent
        preconditions:
          - "handoff_state == CACHED_OFFLINE"
        side_effects:
          - "Device.offline_order_count recomputed; payment_state unchanged (AUTHORIZED)"
          - "AuditEvent appended (subject_kind=ORDER_HANDOFF, action=ORDER_FLUSHED_TO_KITCHEN)"
      - from: "handoff_state=QUEUED_TO_KITCHEN"
        to: "handoff_state=ACCEPTED"
        trigger: "POST /kiosk-ops/order-handoffs/{order_id}/actions action=KITCHEN_ACK"
        actor: StoreOperator
        preconditions:
          - "handoff_state == QUEUED_TO_KITCHEN"
          - "X-User-ID equals the store_id of the capturing device"
        side_effects:
          - "payment_state AUTHORIZED -> CAPTURED in the same request (both dimensions move)"
          - "Store.open_order_count is unchanged (ACCEPTED and QUEUED_TO_KITCHEN both count as open)"
          - "AuditEvent appended (action=ORDER_ACCEPTED_BY_KITCHEN)"
      - from: "handoff_state=QUEUED_TO_KITCHEN"
        to: "handoff_state=VOIDED"
        trigger: "POST /kiosk-ops/order-handoffs/{order_id}/actions action=VOID"
        actor: StoreOperator | PlatformAdmin
        preconditions:
          - "handoff_state IN {QUEUED_TO_KITCHEN, CACHED_OFFLINE, ACCEPTED}"
        side_effects:
          - "COMPENSATION: payment_state -> VOIDED; every priced line's qty is released from its StoreItemAvailability.reserved_units, and available_units / supply_state / availability_state are re-derived, restoring the pre-order values exactly; Store.open_order_count decremented back to its pre-order value; Device.offline_order_count recomputed when the order was CACHED_OFFLINE"
          - "Store.daily_order_seq_counter is deliberately NOT decremented — the order number is permanently retired"
          - "AuditEvent appended (action=ORDER_VOIDED, before_value_cents=total_cents, after_value_cents=0)"

  - entity: Store
    initial_state: FROZEN
    terminal_states: []
    shape: compound_posture
    note: |
      content_posture is never set by a request body; it is recomputed from this store's
      Devices and its cluster chain after every device write, bundle publish/rollback,
      price cascade and clock set. Evaluation order is pinned: FROZEN test first, then
      DEGRADED test, else OPEN.
    transitions:
      - from: FROZEN
        to: OPEN
        trigger: "system recomputation after any device heartbeat, cache-sync, attestation, bundle publish, price cascade or clock set"
        actor: system
        preconditions:
          - "the store's cluster inheritance chain resolves at least one ContentBundle with state == PUBLISHED"
          - "NOT (the store has >= 1 KIOSK device AND every KIOSK device has health_state IN {OFFLINE, QUARANTINED})"
          - "no device of the store has cache_state == STALE or health_state == DEGRADED"
          - "no KIOSK device of the store has payment_compliance_state IN {UNATTESTED, EXPIRING, NON_COMPLIANT}"
        side_effects:
          - "kiosk order creation becomes permitted"
      - from: OPEN
        to: DEGRADED
        trigger: "system recomputation (same triggers)"
        actor: system
        preconditions:
          - "the cluster chain still resolves a PUBLISHED bundle"
          - "at least one device has cache_state == STALE or health_state == DEGRADED, or at least one KIOSK device has payment_compliance_state IN {UNATTESTED, EXPIRING, NON_COMPLIANT}"
        side_effects:
          - "kiosk order creation remains permitted; boards keep serving the cached bundle"
      - from: DEGRADED
        to: FROZEN
        trigger: "system recomputation (same triggers)"
        actor: system
        preconditions:
          - "the cluster inheritance chain resolves no ContentBundle with state == PUBLISHED, OR the store has >= 1 KIOSK device and every KIOSK device has health_state IN {OFFLINE, QUARANTINED}"
        side_effects:
          - "every kiosk order creation for this store is rejected with ERR_STORE_CONTENT_FROZEN"
          - "AuditEvent appended (subject_kind=STORE, action=STORE_CONTENT_FROZEN, actor_role=system)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: price-request-create-stale-menu-item
    parent_entity: MenuItem
    write_endpoint: "POST /kiosk-ops/price-change-requests"
    occ_field: "expected_menu_item_version"
    description: |
      Creating a PriceChangeRequest against a MenuItem whose version has advanced since
      the client last read it is rejected. Product semantics allow several open requests
      on one item (each targets a different price zone) and allow a later request to
      re-price a zone another request already applied, so a create carrying a stale view
      of the item would otherwise succeed and silently compute baseline_price_cents from
      prices the analyst never saw.
    error_id: ERR_STALE_MENU_ITEM_VERSION
    http_status: 412
  - rule_id: daypart-slot-append-stale-bundle
    parent_entity: ContentBundle
    write_endpoint: "POST /kiosk-ops/content-bundles/{bundle_id}/daypart-slots"
    occ_field: "expected_content_bundle_version"
    description: |
      Appending a daypart slot to a ContentBundle whose version has advanced since the
      client last read it is rejected. Two non-overlapping slots may legitimately be
      appended to the same DRAFT bundle, so the append carrying a stale version would
      otherwise succeed while the editor's view of the existing slot geometry (and of any
      staleness cascade that already touched the bundle) is out of date.
    error_id: ERR_STALE_CONTENT_BUNDLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_zone_price
    trigger: "On ContentBundle PUBLISH (snapshot variant), on GET /kiosk-ops/stores/{store_id}/menu-projection (board variant), and on every OrderHandoff creation (charge variant)"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — pick the price basis (override wins over the multiplier path)
      override = the single entry of MenuItem.zone_price_overrides whose price_zone_id == zone.id, or none
      if override exists:
          raw_cents = override.price_cents
      else:
          raw_cents = round_half_up(MenuItem.base_price_cents * PriceZone.price_multiplier_bp / 10000)

      # STEP 2 — psychological rounding is applied in BOTH branches (also to overrides)
      if PriceZone.psychological_rounding == "NONE":
          price_cents = raw_cents
      elif PriceZone.psychological_rounding == "NEAREST_05":
          price_cents = round_half_up(raw_cents / 5) * 5
      elif PriceZone.psychological_rounding == "NINE_ENDING":
          y = (raw_cents // 10) * 10 + 9
          price_cents = y if y >= raw_cents else y + 10
      return price_cents
    input_set: |
      Exactly one MenuItem and one PriceZone. The PriceZone is Store.price_zone_id for
      projection and order pricing, and every PriceZone referenced by at least one Store
      of the cluster for the PUBLISH snapshot. MenuItem rows are included regardless of
      chainwide_availability_state; availability is filtered separately by the projection.
    constants:
      NINE_ENDING_UNIT: 10
      NEAREST_05_UNIT: 5
    precision: "integer minor units; round_half_up at the multiplier step, then the pinned psychological rule; never re-round a rounded value"
    variants:
      - name: board_display_price
        when: "Rendered on a menu board / returned by GET /kiosk-ops/stores/{store_id}/menu-projection"
        difference: "Reads the price_cents frozen in ContentBundle.price_snapshot of the bundle resolved for the store, i.e. the value computed at PUBLISH. A price change applied after PUBLISH does NOT move it."
      - name: kiosk_charge_price
        when: "Used as priced_lines[].unit_price_cents when an OrderHandoff is created"
        difference: "Recomputed from LIVE MenuItem.zone_price_overrides and base_price_cents at order time, so it diverges from board_display_price for every item whose zone price changed after the cached bundle was published."

  - name: order_total_with_campaign_discount
    trigger: "POST /kiosk-ops/devices/{device_id}/orders"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED: per-line discount is rounded per line and THEN summed.
      # (Summing exact line discounts and rounding once at the end is explicitly WRONG here.)
      campaign = selected_campaign_version(store)        # see campaign_selection below; may be none
      for each line in line_items (input order preserved):
          unit_price_cents = kiosk_charge_price(line.menu_item_id, store.price_zone_id)
          gross_line_cents = unit_price_cents * line.qty
          if campaign is none:
              line_discount_cents = 0
          elif campaign.discount_kind == "PERCENT_OFF":
              line_discount_cents = round_half_up(gross_line_cents * campaign.discount_value / 10000)
          else:  # AMOUNT_OFF — capped at the line, never negative
              line_discount_cents = min(campaign.discount_value * line.qty, gross_line_cents)
      subtotal_cents  = SUM(gross_line_cents)
      discount_cents  = SUM(line_discount_cents)          # per-line rounding, then sum
      net_cents       = subtotal_cents - discount_cents
      tax_cents       = round_half_up(net_cents * PriceZone.tax_rate_bp / 10000)
      total_cents     = net_cents + tax_cents
    input_set: |
      Every element of the request's line_items array, in request order; qty >= 1. Exactly
      zero or one PromoCampaignVersion contributes (stacking is forbidden). The PriceZone
      is the capturing device's Store.price_zone_id.
    constants:
      BP_DENOMINATOR: 10000
    precision: "integer minor units, round_half_up; rounding happens once per line for the discount and once for the tax — three roundings total for a two-line order"
    variants:
      - name: per_line_rounded_discount
        when: "always — this is the pinned production rule"
        difference: "Rounds every line's discount before summing; a two-line cart whose exact line discounts are 335.4 and 209.4 yields discount_cents = 544."
      - name: aggregate_rounded_discount
        when: "the rejected reading of the same prose, retained here to name the trap"
        difference: "Rounding the summed exact discount (544.8) yields 545 — one cent more. Implementations MUST produce 544."

  - name: device_health_score
    trigger: "POST /kiosk-ops/devices/{device_id}/heartbeat and POST /kiosk-ops/_clock/set_current_utc"
    algorithm: weighted_scoring
    formula: |
      if device.device_kind == "MENU_BOARD":
          printer_component = WEIGHT_PRINTER            # 20, awarded unconditionally
          touch_component   = WEIGHT_TOUCH              # 30, awarded unconditionally
      else:
          printer_component = WEIGHT_PRINTER if device.printer_ok else 0
          touch_component   = WEIGHT_TOUCH   if device.touch_ok   else 0
      base = printer_component + touch_component
           + (WEIGHT_SCREEN_READER if device.screen_reader_ok else 0)
           + (WEIGHT_NETWORK       if device.network_ok       else 0)

      if device.last_heartbeat_utc is null:
          missed = 0
      else:
          missed = floor(whole_minutes(clock - last_heartbeat_utc) / HEARTBEAT_INTERVAL_MINUTES)

      rolling_health_score   = max(0, base - min(missed * MISS_PENALTY_POINTS, MISS_PENALTY_CAP))
      worst_case_health_score = max(0, base - min((missed + PROJECTED_MISSES) * MISS_PENALTY_POINTS, MISS_PENALTY_CAP))

      # health_state banding — PINNED evaluation order
      if last_heartbeat_utc is null:                                          health_state = OFFLINE
      elif missed >= QUARANTINE_MISS_FLOOR and worst_case_health_score < 50:  health_state = QUARANTINED
      elif rolling_health_score < HEALTH_DEGRADED_MIN:                        health_state = OFFLINE
      elif rolling_health_score < HEALTH_ONLINE_MIN:                          health_state = DEGRADED
      else:                                                                   health_state = ONLINE
    input_set: |
      The four boolean flags of the MOST RECENT heartbeat only (no history is kept), the
      device_kind conditional, and the whole minutes between last_heartbeat_utc and the
      logical clock. Devices that never sent a heartbeat contribute missed = 0 but are
      OFFLINE by the first banding clause.
    constants:
      WEIGHT_PRINTER: 20
      WEIGHT_TOUCH: 30
      WEIGHT_SCREEN_READER: 25
      WEIGHT_NETWORK: 25
      HEARTBEAT_INTERVAL_MINUTES: 5
      MISS_PENALTY_POINTS: 15
      MISS_PENALTY_CAP: 60
      PROJECTED_MISSES: 2
      QUARANTINE_MISS_FLOOR: 3
      HEALTH_DEGRADED_MIN: 50
      HEALTH_ONLINE_MIN: 80
    precision: "integer points 0..100; no rounding required because all weights and penalties are integers"
    variants:
      - name: rolling_health_score
        when: "drives health_state banding, Store.content_posture and the order-creation gate"
        difference: "Charges only the misses that have actually elapsed — a printer-down kiosk one interval late scores 65 and bands to DEGRADED."
      - name: worst_case_health_score
        when: "drives the QUARANTINED decision only"
        difference: "Charges PROJECTED_MISSES (2) extra misses on the same data — the same kiosk scores 35, yet quarantine is withheld because missed (1) < QUARANTINE_MISS_FLOOR (3)."

  - name: price_uplift_and_approval_tier
    trigger: "POST /kiosk-ops/price-change-requests (evaluated once, at creation)"
    algorithm: threshold
    formula: |
      # PINNED evaluation order 1 -> 2 -> 3 -> 4. No step is re-derived after a later step,
      # and psychological rounding (applied only at APPLY time) NEVER feeds back into it.
      # 1. baseline
      baseline_price_cents = effective_zone_price(menu_item, price_zone)   # override-aware, rounding-aware
      # 2. uplift from the RAW proposed value
      uplift_bp = round_half_up((proposed_price_cents - baseline_price_cents) * 10000 / baseline_price_cents)
      # 3. approval tier from the uplift computed in step 2
      required_approvals = 2 if uplift_bp >= DUAL_APPROVAL_UPLIFT_BP else 1
      # 4. zone cap check against the SAME uplift_bp
      if uplift_bp > PriceZone.max_uplift_bp: reject with ERR_UPLIFT_CAP_EXCEEDED
      # A rejected request is never clamped: the proposal is refused, not reduced.
    input_set: |
      One MenuItem, one PriceZone, one proposed_price_cents. baseline_price_cents is the
      effective price at creation time (an override written by an earlier APPLIED request
      becomes the new baseline for the next request). uplift_bp may be negative for a
      price cut, in which case required_approvals is 1 and the cap never binds.
    constants:
      DUAL_APPROVAL_UPLIFT_BP: 500
      BP_DENOMINATOR: 10000
    precision: "uplift_bp is an integer, round_half_up on the basis-point quotient"
    variants:
      - name: raw_proposal_uplift
        when: "always — the pinned production rule"
        difference: "Uses proposed_price_cents as submitted. Baseline 559 with proposal 642 yields uplift_bp 1485, which passes a 1500 bp cap."
      - name: post_rounding_uplift
        when: "the rejected reading, named here so implementations do not drift into it"
        difference: "Deriving the uplift from the APPLY-time NINE_ENDING price (649) yields 1610 and would wrongly reject the same proposal. Implementations MUST NOT re-derive after rounding."

  - name: daypart_resolution
    trigger: "GET /kiosk-ops/stores/{store_id}/menu-projection and every OrderHandoff creation"
    algorithm: interval_merge
    formula: |
      # Slot inheritance across the self-referential cluster chain
      chain = [store.cluster] then its ancestors via parent_cluster_id, nearest first,
              at most MAX_CLUSTER_CHAIN_DEPTH (5) clusters
      effective_slots = []
      for cluster in chain:                       # nearest first
          bundle = the cluster's ContentBundle with state == PUBLISHED and the highest bundle_version
          if bundle is none: continue
          for slot in bundle.daypart_slots (created_at ASC):
              if slot.daypart_code not already in effective_slots: append it
      # Local minute of day
      t = (whole_minutes_of_day(clock) + store.timezone_offset_minutes) modulo 1440
      if at_minute_of_day query parameter is supplied: t = that value
      # Half-open containment
      candidates = [s for s in effective_slots if s.start_minute_of_day <= t < s.end_minute_of_day]
      if candidates is empty:
          return { daypart_code: null, layout_code: STATIC_FALLBACK_LAYOUT_CODE, phase: "FALLBACK" }
      # Ranking: narrowest window first, then earliest start, then earliest slot creation
      winner = min(candidates, key=(end_minute_of_day - start_minute_of_day,
                                    start_minute_of_day,
                                    created_at))
      phase = "TRANSITIONING" if t >= winner.end_minute_of_day - winner.buffer_minutes else "ACTIVE"
      return { daypart_code: winner.daypart_code, layout_code: winner.layout_code, phase: phase }
    input_set: |
      Only daypart_slots of bundles whose state == PUBLISHED enter the candidate set; DRAFT,
      VALIDATED, SUPERSEDED and ROLLED_BACK bundles are excluded. A child cluster's slot
      shadows an ancestor slot with the same daypart_code; ancestor slots with a different
      daypart_code are additive and may overlap the child's, which is exactly why the
      ranking expression above is pinned.
    constants:
      MINUTES_PER_DAY: 1440
      MAX_CLUSTER_CHAIN_DEPTH: 5
      STATIC_FALLBACK_LAYOUT_CODE: "STATIC_FALLBACK"
    precision: "integer minutes 0..1439; containment is half-open [start, end)"

  - name: campaign_selection
    trigger: "Every OrderHandoff creation and GET /kiosk-ops/stores/{store_id}/menu-projection"
    algorithm: forward_looking
    formula: |
      candidates = PromoCampaignVersion rows where
          state == ACTIVE
          AND cluster_id IN the store's cluster inheritance chain (nearest-first list above)
          AND window_start_utc <= clock <= window_end_utc          # CLOSED on both ends
      if candidates is empty: return none                          # discount_cents = 0
      winner = min(candidates, key=(priority_rank ASC,
                                    discount_value DESC,
                                    created_at ASC))
      return winner            # exactly one campaign discounts an order; stacking is forbidden
    input_set: |
      Only ACTIVE versions; DRAFT, SCHEDULED, EXPIRED, WITHDRAWN and SUPERSEDED versions are
      excluded even when their window contains the clock. Cluster inheritance means an
      ancestor cluster's campaign also applies to a descendant cluster's stores.
    constants:
      MAX_CONCURRENT_CAMPAIGNS_PER_STACKING_GROUP: 1
    precision: "n/a — selection only; the chosen version's id is stored on OrderHandoff.applied_campaign_version_id"

  - name: availability_rollup
    trigger: "Every StoreItemAvailability write, every 86/restore/discontinue action, and POST /kiosk-ops/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      available_units = max(0, on_hand_units - reserved_units)
      low_threshold   = round_half_up(par_units * LOW_STOCK_RATIO_BP / 10000)
      if available_units <= 0:                 supply_state = DEPLETED
      elif available_units <= low_threshold:   supply_state = LOW          # inclusive boundary
      else:                                    supply_state = IN_STOCK
      if listing_state IN {EIGHTY_SIXED, DISCONTINUED} or supply_state == DEPLETED:
                                               availability_state = UNAVAILABLE
      elif supply_state == LOW:                availability_state = LIMITED
      else:                                    availability_state = AVAILABLE
      # bubble up to the item
      rows = every StoreItemAvailability of this menu_item_id
      if rows is empty or every row is UNAVAILABLE: chainwide = UNAVAILABLE
      elif no row is AVAILABLE and at least one is LIMITED: chainwide = LIMITED
      else: chainwide = AVAILABLE
    input_set: |
      All StoreItemAvailability rows of the item, regardless of the owning store's
      content_posture. Rows with listing_state == DISCONTINUED still count (as UNAVAILABLE)
      and are never removed.
    constants:
      LOW_STOCK_RATIO_BP: 2000
    precision: "integer units; the LOW threshold is round_half_up(par_units * 0.2) and the comparison is <= (inclusive)"

  - name: order_number_and_receipt
    trigger: "POST /kiosk-ops/devices/{device_id}/orders"
    algorithm: aggregation
    formula: |
      store = the capturing device's Store
      today = calendar date (UTC) of the logical clock
      if store.seq_counter_date != today:
          store.daily_order_seq_counter = 0
          store.seq_counter_date = today
      next_seq = store.daily_order_seq_counter + 1
      order_number = store.store_code + "-" + zero_pad(next_seq, 4)
      store.daily_order_seq_counter = next_seq            # never decremented, even on VOID
      pinned_bundle_version = device.cached_bundle_version
      receipt_hash = lowercase_hex_sha256(
          order_number + "|" + subtotal_cents + "|" + discount_cents + "|" +
          tax_cents + "|" + total_cents + "|" + pinned_bundle_version)
      # Conserved quantity of the void compensation
      store.open_order_count = COUNT(OrderHandoff rows whose device's store_id == store.id
                                     AND handoff_state IN {QUEUED_TO_KITCHEN, ACCEPTED, CACHED_OFFLINE})
    input_set: |
      Only OrderHandoff rows of devices belonging to this store enter open_order_count, and
      only the three open handoff states count; VOIDED rows are excluded. The sequence
      counter counts every created order including voided and offline ones.
    constants:
      SEQ_PAD_WIDTH: 4
    precision: "integer counter; order_number is exactly store_code + '-' + 4-digit zero-padded sequence"

  - name: upsell_suggestion_selection
    trigger: "GET /kiosk-ops/stores/{store_id}/menu-projection and validation of OrderHandoff.accepted_upsell_rule_ids"
    algorithm: constraint_propagation
    formula: |
      cart_subtotal = SUM over the cart of kiosk_charge_price(item, store.price_zone_id) * qty
      eligible = UpsellRule rows where
          state == ACTIVE
          AND cluster_id IN the store's cluster inheritance chain
          AND trigger_item_id IN the cart's menu_item_id set
          AND suggested_item_id NOT IN the cart's menu_item_id set
          AND the suggested item's StoreItemAvailability row for THIS store has
              availability_state IN {AVAILABLE, LIMITED}
          AND cart_subtotal >= min_cart_subtotal_cents          # inclusive
          AND max_prompt_seconds >= MIN_PROMPT_SECONDS (5)
      ranked = eligible sorted by (suggestion_slot ASC, priority of cluster in the chain ASC, created_at ASC)
      cap = ACCESSIBILITY_MAX_SUGGESTIONS (2) if device.screen_reader_ok == true
            else MAX_UPSELL_SUGGESTIONS (3)
      return the first `cap` entries of ranked      # empty list when nothing is eligible
    input_set: |
      Only ACTIVE rules; SUSPENDED rules are excluded even when their suggested item is
      available again but the reactivation cascade has not run. The availability filter is
      per-store, so the same rule is eligible at one store and not at another.
    constants:
      MAX_UPSELL_SUGGESTIONS: 3
      ACCESSIBILITY_MAX_SUGGESTIONS: 2
      MIN_PROMPT_SECONDS: 5
    precision: "n/a — a deterministic ordered list of rule ids; ties are impossible because (cluster, trigger_item, suggestion_slot) is unique among ACTIVE rules and created_at breaks any residual tie"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending `priority`; the FIRST
#      violated rule determines the response — later violations are not reported)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in §1.7; X-User-ID is present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's `roles:` list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "When the acting role is DeviceAgent, X-User-ID equals the {device_id} in the path (a device may only act as itself)"
    error_id: ERR_DEVICE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /kiosk-ops/devices/{device_id}/heartbeat, POST /kiosk-ops/devices/{device_id}/cache-sync, POST /kiosk-ops/devices/{device_id}/orders"

  - priority: 4
    category: auth
    check: "When the acting role is StoreOperator, X-User-ID equals the id of the Store that owns the addressed resource (the store itself, its StoreItemAvailability rows, its Devices, or the Device that captured the addressed OrderHandoff)"
    error_id: ERR_STORE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all StoreOperator-permitted endpoints that address a store-owned resource"

  - priority: 5
    category: existence
    check: "Every path parameter resolves to an existing row, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 6
    category: existence
    check: "Every foreign-key id in the request body resolves to an existing row (price_zone_id, cluster_id, parent_cluster_id, store_id, menu_item_id, trigger_item_id, suggested_item_id, cached_bundle_id, applied_campaign_version_id, line_items[].menu_item_id, accepted_upsell_rule_ids[])"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"

  - priority: 7
    category: business_constraint
    check: "Request body shape is valid: required fields present, enum values within the declared domain, integers non-negative where declared, minute-of-day within 0..1439, ISO-8601 UTC instants parseable, qty >= 1, and no unknown action verb"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 8
    category: business_constraint
    check: "Uniqueness of natural keys: PriceZone.zone_code, StoreCluster.cluster_code, Store.store_code, MenuItem.sku, Device.device_code, (campaign_code, version_no), and (cluster_id, trigger_item_id, suggestion_slot) among ACTIVE UpsellRules"
    error_id: ERR_DUPLICATE_NATURAL_KEY
    http_status: 409
    applies_to: "POST /kiosk-ops/price-zones, /store-clusters, /stores, /menu-items, /devices, /campaign-versions, /upsell-rules"

  - priority: 9
    category: state
    check: "expected_menu_item_version equals the addressed MenuItem's current `version`"
    error_id: ERR_STALE_MENU_ITEM_VERSION
    http_status: 412
    applies_to: "POST /kiosk-ops/price-change-requests, POST /kiosk-ops/menu-items/{menu_item_id}/accessibility-copy"

  - priority: 10
    category: state
    check: "expected_content_bundle_version equals the addressed ContentBundle's current `version`"
    error_id: ERR_STALE_CONTENT_BUNDLE_VERSION
    http_status: 412
    applies_to: "POST /kiosk-ops/content-bundles/{bundle_id}/daypart-slots"

  - priority: 11
    category: state
    check: "The addressed entity is already in a terminal state declared in §1.2 (PriceChangeRequest REJECTED/WITHDRAWN/ROLLED_BACK, ContentBundle ROLLED_BACK, PromoCampaignVersion EXPIRED/WITHDRAWN/SUPERSEDED, OrderHandoff handoff_state=VOIDED, StoreItemAvailability listing_state=DISCONTINUED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every /actions endpoint"

  - priority: 12
    category: state
    check: "APPLY on a PriceChangeRequest requires state == APPROVED; a DRAFT, PENDING_APPROVAL or CHANGES_REQUESTED request cannot be applied. This specialisation is checked BEFORE the generic transition check at priority 13."
    error_id: ERR_REQUEST_NOT_APPROVED
    http_status: 409
    applies_to: "POST /kiosk-ops/price-change-requests/{request_id}/actions (APPLY)"

  - priority: 13
    category: state
    check: "The requested action verb is a declared transition out of the entity's current state in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every /actions endpoint"

  - priority: 14
    category: state
    check: "The ContentBundle a device caches, or that a store's projection/order resolves, is in state PUBLISHED"
    error_id: ERR_BUNDLE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /kiosk-ops/devices/{device_id}/cache-sync, POST /kiosk-ops/devices/{device_id}/orders"

  - priority: 15
    category: state
    check: "The capturing device's Store.content_posture is not FROZEN"
    error_id: ERR_STORE_CONTENT_FROZEN
    http_status: 409
    applies_to: "POST /kiosk-ops/devices/{device_id}/orders"

  - priority: 16
    category: state
    check: "The capturing device's health_state is ONLINE or DEGRADED (a QUARANTINED or OFFLINE device may not capture orders) and its cache_state is not MISSING"
    error_id: ERR_DEVICE_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /kiosk-ops/devices/{device_id}/orders"

  - priority: 17
    category: business_safety
    check: "Segregation of duties — the X-User-ID approving a PriceChangeRequest differs from requested_by_user_id and from every id already present in approval_user_ids"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /kiosk-ops/price-change-requests/{request_id}/actions (APPROVE)"

  - priority: 18
    category: business_safety
    check: "A device capturing a CARD-tendered order has payment_compliance_state IN {COMPLIANT, EXPIRING}; UNATTESTED and NON_COMPLIANT devices may not take card payments"
    error_id: ERR_PAYMENT_DEVICE_NON_COMPLIANT
    http_status: 422
    applies_to: "POST /kiosk-ops/devices/{device_id}/orders"

  - priority: 19
    category: business_safety
    check: "PUBLISH requires ContentBundle.accessibility_audit_state == PASSED"
    error_id: ERR_ACCESSIBILITY_AUDIT_REQUIRED
    http_status: 422
    applies_to: "POST /kiosk-ops/content-bundles/{bundle_id}/actions (PUBLISH)"

  - priority: 20
    category: business_safety
    check: "Every MenuItem in a bundle's snapshot_item_ids has non-blank screen_reader_text and contrast_ratio >= MIN_CONTRAST_RATIO (4.5), i.e. accessibility_state == READY"
    error_id: ERR_SCREEN_READER_TEXT_MISSING
    http_status: 422
    applies_to: "POST /kiosk-ops/content-bundles/{bundle_id}/actions (VALIDATE, ACCESSIBILITY_AUDIT)"

  - priority: 21
    category: business_constraint
    check: "A new daypart slot's half-open interval [start_minute_of_day, end_minute_of_day) does not overlap an existing slot of the same bundle, and start < end"
    error_id: ERR_DAYPART_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /kiosk-ops/content-bundles/{bundle_id}/daypart-slots"

  - priority: 22
    category: business_constraint
    check: "Scheduling a campaign version whose closed window [window_start_utc, window_end_utc] intersects the window of another SCHEDULED or ACTIVE version in the same stacking_group for the same cluster exceeds MAX_CONCURRENT_CAMPAIGNS_PER_STACKING_GROUP (1)"
    error_id: ERR_CAMPAIGN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /kiosk-ops/campaign-versions/{version_id}/actions (SCHEDULE)"

  - priority: 23
    category: business_constraint
    check: "An upsell rule must not create a cycle in the ACTIVE trigger->suggested graph of its cluster, and trigger_item_id != suggested_item_id"
    error_id: ERR_UPSELL_CYCLE_DETECTED
    http_status: 422
    applies_to: "POST /kiosk-ops/upsell-rules"

  - priority: 24
    category: business_constraint
    check: "StoreCluster.parent_cluster_id must not create a cycle and the resulting chain_depth must not exceed MAX_CLUSTER_CHAIN_DEPTH (5)"
    error_id: ERR_CLUSTER_CHAIN_INVALID
    http_status: 422
    applies_to: "POST /kiosk-ops/store-clusters"

  - priority: 25
    category: business_constraint
    check: "At most one StoreItemAvailability row exists per (store_id, menu_item_id)"
    error_id: ERR_DUPLICATE_AVAILABILITY
    http_status: 409
    applies_to: "POST /kiosk-ops/stores/{store_id}/item-availabilities"

  - priority: 26
    category: business_constraint
    check: "The number of distinct cached_bundle_id values a device is asked to retain does not exceed its offline_cache_capacity, and a device with offline_order_count already at offline_cache_capacity may not capture another offline order"
    error_id: ERR_OFFLINE_CACHE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /kiosk-ops/devices/{device_id}/cache-sync, POST /kiosk-ops/devices/{device_id}/orders"

  - priority: 27
    category: business_constraint
    check: "Only MENU_BOARD devices may omit printer hardware; a KIOSK device must declare a pin_pad_firmware_version, and payment attestation is rejected for MENU_BOARD devices"
    error_id: ERR_DEVICE_KIND_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /kiosk-ops/devices, POST /kiosk-ops/devices/{device_id}/payment-attestation"

  - priority: 28
    category: business_temporal
    check: "PriceChangeRequest.effective_from_utc is not earlier than the logical clock at creation, and APPLY is rejected when the clock has not yet reached effective_from_utc"
    error_id: ERR_EFFECTIVE_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /kiosk-ops/price-change-requests, POST /kiosk-ops/price-change-requests/{request_id}/actions (APPLY)"

  - priority: 29
    category: business_temporal
    check: "SCHEDULE is rejected when window_end_utc is at or before the logical clock, or when window_end_utc <= window_start_utc"
    error_id: ERR_CAMPAIGN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /kiosk-ops/campaign-versions, POST /kiosk-ops/campaign-versions/{version_id}/actions (SCHEDULE)"

  - priority: 30
    category: business_temporal
    check: "Store.accessibility_certified_until_utc is at or after the logical clock when the store's bundle is published to a KIOSK device"
    error_id: ERR_STORE_ACCESSIBILITY_LAPSED
    http_status: 422
    applies_to: "POST /kiosk-ops/devices/{device_id}/cache-sync"

  - priority: 31
    category: business_referential
    check: "Every line_items[].menu_item_id is present in the pinned ContentBundle's snapshot_item_ids"
    error_id: ERR_ITEM_NOT_IN_PUBLISHED_BUNDLE
    http_status: 422
    applies_to: "POST /kiosk-ops/devices/{device_id}/orders"

  - priority: 32
    category: business_referential
    check: "A PriceChangeRequest's price_zone_id is a zone actually used by at least one Store, and an override may only be written for the zone named on the request"
    error_id: ERR_PRICE_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /kiosk-ops/price-change-requests, POST /kiosk-ops/price-change-requests/{request_id}/actions (APPLY)"

  - priority: 33
    category: business_referential
    check: "Every accepted_upsell_rule_ids entry is an ACTIVE UpsellRule of the store's cluster chain whose trigger_item_id is in the cart and whose suggested_item_id is in the cart"
    error_id: ERR_UPSELL_RULE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /kiosk-ops/devices/{device_id}/orders"

  - priority: 34
    category: business_referential
    check: "No ordered line's StoreItemAvailability row for the capturing device's store has availability_state == UNAVAILABLE"
    error_id: ERR_ITEM_EIGHTY_SIXED
    http_status: 409
    applies_to: "POST /kiosk-ops/devices/{device_id}/orders"

  - priority: 35
    category: business_fiscal
    check: "APPLY requires COUNT(approval_user_ids) >= required_approvals; a request whose uplift_bp reached DUAL_APPROVAL_UPLIFT_BP (500) with a single approval is refused"
    error_id: ERR_DUAL_APPROVAL_REQUIRED
    http_status: 409
    applies_to: "POST /kiosk-ops/price-change-requests/{request_id}/actions (APPLY)"

  - priority: 36
    category: business_fiscal
    check: "uplift_bp (computed from the raw proposed price against the baseline) does not exceed the PriceZone.max_uplift_bp of the request's zone"
    error_id: ERR_UPLIFT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /kiosk-ops/price-change-requests"

# --- Deliberate priority-conflict pairs (each is a §1.8 instance) -------------
# P1: priority 12 (state, ERR_REQUEST_NOT_APPROVED) vs priority 35
#     (business_fiscal, ERR_DUAL_APPROVAL_REQUIRED) — APPLY on a PENDING_APPROVAL
#     request that also lacks its second approval returns ERR_REQUEST_NOT_APPROVED.
# P2: priority 18 (business_safety, ERR_PAYMENT_DEVICE_NON_COMPLIANT) vs priority 31
#     (business_referential, ERR_ITEM_NOT_IN_PUBLISHED_BUNDLE) — a CARD order on an
#     UNATTESTED device for an item outside the snapshot returns the compliance error.
# P3: priority 28 (business_temporal, ERR_EFFECTIVE_DATE_IN_PAST) vs priority 36
#     (business_fiscal, ERR_UPLIFT_CAP_EXCEEDED) — a backdated request whose uplift
#     also breaches the zone cap returns ERR_EFFECTIVE_DATE_IN_PAST.

# =============================================================================
# §1.5 API Endpoint Table  (all paths are prefixed with api_prefix `/kiosk-ops`)
#   Every list endpoint accepts `limit?` / `offset?` and wraps its array in the
#   envelope's pagination fields (limit, offset, total_count, has_more).
# =============================================================================
endpoints:

  # ---- PriceZone -------------------------------------------------------------
  - method: POST
    path: "/kiosk-ops/price-zones"
    description: "Register a local price zone: the multiplier, psychological-rounding rule, tax rate and uplift cap that govern every store attached to it."
    roles: [PlatformAdmin]
    code: 201
    input: [zone_code, currency_code, price_multiplier_bp, "psychological_rounding?", tax_rate_bp, max_uplift_bp]
    output: PriceZone
    side_effects: []

  - method: GET
    path: "/kiosk-ops/price-zones"
    description: "List price zones."
    roles: [PlatformAdmin, ContentManager, PricingAnalyst, PricingApprover, ComplianceOfficer, StoreOperator]
    code: 200
    input: ["zone_code?", "limit?", "offset?"]
    output: PriceZone[]
    side_effects: []

  - method: GET
    path: "/kiosk-ops/price-zones/{price_zone_id}"
    description: "Fetch one price zone."
    roles: [PlatformAdmin, ContentManager, PricingAnalyst, PricingApprover, ComplianceOfficer, StoreOperator]
    code: 200
    input: []
    output: PriceZone
    side_effects: []

  # ---- StoreCluster ----------------------------------------------------------
  - method: POST
    path: "/kiosk-ops/store-clusters"
    description: "Create a store cluster, optionally under a parent cluster. Content and campaigns declared on an ancestor are inherited by descendants."
    roles: [PlatformAdmin, ContentManager]
    code: 201
    input: [cluster_code, tier, "parent_cluster_id?"]
    output: StoreCluster
    side_effects:
      - "computes chain_depth as parent.chain_depth + 1 (0 when parent_cluster_id is absent)"
      - "rejects a parent that would create a cycle or exceed MAX_CLUSTER_CHAIN_DEPTH with ERR_CLUSTER_CHAIN_INVALID"

  - method: GET
    path: "/kiosk-ops/store-clusters"
    description: "List store clusters; filter by parent to walk the inheritance tree one level at a time."
