            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_id}", tier: "PLUS" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "DOCUMENT", category: "will", title: "Will", secret_ref: "vault://will" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { it1: $.data.id }
            - call: "POST /legacy/vault-items/${it1}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "DOCUMENT", category: "letters", title: "Letters", secret_ref: "vault://letters" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { it2: $.data.id }
            - call: "POST /legacy/vault-items/${it2}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/directives"
              payload: { plan_id: "${plan_id}", directive_type: "MEDICAL", content: "wishes" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { dir_id: $.data.id }
            - call: "POST /legacy/directives/${dir_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/deputies"
              payload: { plan_id: "${plan_id}", full_name: "Dee One", email: "d1@x.com", deputy_role: "EXECUTOR", access_scope: ["ACCOUNT"], release_trigger: "ON_DEATH", authority_start_at: "2026-06-01T00:00:00Z", authority_end_at: "2027-06-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /legacy/deputies/${d1_id}/accept"
              payload: {}
              as: Deputy
              as_user_id: "${d1_id}"
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben One", relationship: "child" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben Two", relationship: "child" }
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben Three", relationship: "friend" }
              as: Owner
              as_user_id: "${plan_id}"
          trigger:
            - call: "GET /legacy/plans/${plan_id}/completeness"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
              captures: { pct: $.data.completeness_pct }
          assert:
            - "Plan.${plan_id}.completeness_pct == 66"

      - name: beneficiary_allocation_remainder_waterfall_rounding
        grounds:
          - calculations.beneficiary_allocation
          - entities.Beneficiary.fields.allocated_value_cents
          - entities.Beneficiary.fields.created_at
        distinguishing_aspect: |
          Mode (b): the per-beneficiary floor is taken FIRST, THEN the 2-cent remainder is waterfalled by
          created_at ASC (B1 and B2 each +1, B3 +0), giving 5000/3000/1999 summing to 9999; a "sum then
          round" order would misplace the cents.
        test_recipe:
          setup:
            - "Same deceased-plan/approved-release scenario as beneficiary_allocation_net_variant_on_estate: NET asset net 9999, beneficiaries 50/30/20 created in order B1,B2,B3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
