            - "the same call with subscriber_id ${sub_f_id} succeeds — the mismatch is the only defect"

      - name: statement_with_end_before_start_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=59]
          - validations[priority=63]
          - errors[ERR_INVALID_PERIOD_RANGE]
        distinguishing_aspect: "The period is both inverted AND in the future, so two temporal rules are violated at once; the lower priority number (59) must win, returning ERR_INVALID_PERIOD_RANGE rather than ERR_PERIOD_NOT_ELAPSED."
        test_recipe:
          setup:
            - "one publication, clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Period Sanity Monthly", frequency: "MONTHLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id, pub_ver: $.data.version }
          trigger:
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2027-01-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with ${err} == ERR_INVALID_PERIOD_RANGE"
            - "no CirculationStatement row was created and Publication.${pub_id}.version is still ${pub_ver}"
            - "the identical payload with window_start/window_end inverted on POST /circulation/publications/{id}/digital-snapshots returns the same error_id"

      - name: statement_for_period_not_yet_closed_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=63]
          - errors[ERR_PERIOD_NOT_ELAPSED]
        distinguishing_aspect: "A well-formed period whose end is one month in the future is refused: circulation may only be claimed for a closed period, and the boundary is inclusive — a period ending exactly at the current clock is accepted."
        test_recipe:
          setup:
            - "one publication, clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Open Period Monthly", frequency: "MONTHLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id, pub_ver: $.data.version }
          trigger:
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_id: $.data.id, st_status: $.data.status }
          assert:
            - "the first call returns HTTP 422 with ${err} == ERR_PERIOD_NOT_ELAPSED and creates nothing"
            - "the second call returns HTTP 201 with ${st_status} == DRAFT — period_end exactly at the clock counts as elapsed"
            - "the second call consumes ${pub_ver} successfully, proving the rejected call did not bump Publication.${pub_id}.version"
            - "a digital snapshot with window_end 2026-09-01T00:00:00Z is refused with the same error_id"

      - name: second_engagement_inside_fourteen_day_buffer_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=62]
          - errors[ERR_AUDIT_WINDOW_CONFLICT]
          - entities.AuditEngagement.fields.fieldwork_start
        distinguishing_aspect: "The buffer is measured publication-wide across DIFFERENT statements and is not an overlap test: the two fieldwork intervals are disjoint, yet 5 clear days between them is refused while 14 clear days is accepted."
        test_recipe:
          setup:
            - "one publication with two FILED statements for adjacent quarters and no recipients"
            - "engagement EA with fieldwork [2026-08-05, 2026-08-09] and sample_size 2, so it stays open (SCHEDULED)"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Audit Calendar Quarterly", frequency: "QUARTERLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_1: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_1}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_a_id: $.data.id }
            - call: "POST /circulation/statements/${st_a_id}/certify"
              payload: { certification_note: "Q1" }
              as: PublisherExecutive
              as_user_id: "exec-01"
            - call: "POST /circulation/audit-engagements"
              payload: { statement_id: "${st_a_id}", auditor_org: "Verified Audit Bureau", fieldwork_start: "2026-08-05T00:00:00Z", fieldwork_end: "2026-08-09T00:00:00Z", sample_size: 2 }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { eng_a_id: $.data.id, eng_a_status: $.data.status }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_2: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_2}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_b_id: $.data.id }
            - call: "POST /circulation/statements/${st_b_id}/certify"
              payload: { certification_note: "Q2" }
              as: PublisherExecutive
              as_user_id: "exec-01"
          trigger:
            - call: "POST /circulation/audit-engagements"
              payload: { statement_id: "${st_b_id}", auditor_org: "Verified Audit Bureau", fieldwork_start: "2026-08-15T00:00:00Z", fieldwork_end: "2026-08-20T00:00:00Z", sample_size: 1 }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { err: $.data.error_id }
            - call: "POST /circulation/audit-engagements"
              payload: { statement_id: "${st_b_id}", auditor_org: "Verified Audit Bureau", fieldwork_start: "2026-08-24T00:00:00Z", fieldwork_end: "2026-08-28T00:00:00Z", sample_size: 1 }
              as: CirculationAuditor
              as_user_id: "aud-01"
              captures: { eng_b_id: $.data.id, eng_b_status: $.data.status }
          assert:
            - "${eng_a_status} == SCHEDULED, so engagement EA is not REPORT_ISSUED and still counts against the buffer"
            - "the first trigger returns HTTP 409 with ${err} == ERR_AUDIT_WINDOW_CONFLICT — only Aug 10-14 (5 clear days) separate the intervals"
            - "the second trigger returns HTTP 201 with ${eng_b_status} == SCHEDULED — Aug 10-23 is exactly 14 clear days"
            - "CirculationStatement.${st_b_id}.status == UNDER_AUDIT after the accepted call and was still FILED after the rejected one"
            - "AuditEngagement.${eng_b_id}.sample_verified_count == 0 and open_findings_count == 0"

