      - name: an_undeclared_role_string_is_rejected_as_forbidden_role_not_as_unauthenticated
        claim_type: Exclusive Operation Denial
        grounds:
          - roles.QCAnalyst
          - errors.ERR_FORBIDDEN_ROLE
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A header that is present but names a role outside the six-member matrix is authenticated-but-unauthorised: it must answer 403 ERR_FORBIDDEN_ROLE, never 401 ERR_UNAUTHENTICATED and never 400. The same instance contrasts it with the genuinely empty header, which must answer 401, so the two rungs of the ladder cannot be conflated."
        test_recipe:
          setup:
            - "No fixtures needed; both probes are rejected before any lookup."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /material-specifications"
              payload: {}
              as: "Auditor"
              as_user_id: "au-01"
              captures: { undeclared_get: $.data.error_id }
            - call: "POST /material-specifications"
              payload: { material_code: "AB-RB-AUD", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"] }
              as: "Auditor"
              as_user_id: "au-01"
              captures: { undeclared_post: $.data.error_id }
            - call: "GET /material-specifications"
              payload: {}
              as: ""
              as_user_id: "au-01"
              captures: { blank_role: $.data.error_id }
            - call: "GET /material-specifications"
              payload: {}
              as: "Auditor"
              as_user_id: ""
              captures: { blank_user: $.data.error_id }
            - call: "GET /material-specifications"
              payload: {}
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { declared_get: $.data }
          assert:
            - "the undeclared role Auditor is refused on a GET that all six declared roles may perform, with HTTP 403 and error_id ERR_FORBIDDEN_ROLE"
            - "the same undeclared role is refused on the write with HTTP 403 ERR_FORBIDDEN_ROLE, not 401 and not 400"
            - "an empty X-User-Role with a populated X-User-ID returns HTTP 401 ERR_UNAUTHENTICATED, and an undeclared role with an empty X-User-ID also returns HTTP 401 — the authentication rung at priority 10 always precedes the authorisation rung at priority 20"
            - "the declared QCAnalyst reads the same list successfully with HTTP 200 and total_count 0, and no MaterialSpecification was created by the refused write"

