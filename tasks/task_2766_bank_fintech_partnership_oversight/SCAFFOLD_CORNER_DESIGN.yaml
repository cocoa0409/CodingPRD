              captures: { e_agr_open_exec: $.data.error_id }
            - call: "POST /oversight/agreements/${agr_s1_id}/terminate"
              payload: { termination_trigger: "VOLUNTARY", notice_days: 30 }
              as: RiskCommittee
              as_user_id: "rc-dana"
              captures: { agr_s1_term: $.data.status }
            - call: "POST /oversight/wind-down-plans"
              payload: { partner_id: "${pa_id}", trigger_reason: "VOLUNTARY", end_user_funds_disposition: "RETURN_TO_END_USERS", notice_days: 30, target_completion_date: "2026-10-15T00:00:00Z", milestones: ["NOTIFY_END_USERS", "FINAL_SETTLEMENT", "RETURN_FUNDS", "CLOSE_CUSTODY"] }
              as: ProgramOfficer
