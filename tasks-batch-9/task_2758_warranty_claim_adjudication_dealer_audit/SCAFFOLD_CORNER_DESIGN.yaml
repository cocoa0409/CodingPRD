      - name: occ_stale_audit_version_on_second_appeal
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appeal-create-stale-audit]
          - errors[ERR_STALE_AUDIT_VERSION]
          - validations[priority 57].ERR_FINDING_NOT_IN_AUDIT
        distinguishing_aspect: |
          A denied appeal returns the audit to FINDINGS_ISSUED with a new version and a refreshed deadline, so a
          second filing is legitimately possible - and the OCC check at priority 38 speaks BEFORE the
          finding-membership check at 57, which is what the same request hits once the version is fresh.
        test_recipe:
          setup:
            - "WORLD-AUDIT with findings issued; audit_v_issued was captured at issue time."
            - "The dealer's first appeal against the single finding was DENIED, so the finding is UPHELD and the audit is back in FINDINGS_ISSUED with an advanced version."
            - "The clock is still 2026-05-01T00:00:00Z, inside the refreshed appeal window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "DA", name: "Audit Motors", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { da_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VIN0000000000AUD1", model_year: 2025, warranty_start_date: "2025-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { veh_a_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "AUD-100", description: "Instrument cluster diagnosis and repair", standard_time_hours: 3.0, max_time_hours: 4.0, category: "BASIC", requires_causal_part: false, overlap_group: "AUDIT_OPS" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_aud_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${da_id}", vehicle_id: "${veh_a_id}", labor_operation_id: "${lo_aud_id}", repair_order_number: "RO-AUD-1", repair_date: "2026-02-15", odometer_at_repair: 20000, claimed_labor_hours: 2.0, claimed_parts_qty: 0, complaint_text: "Customer reports intermittent fault on delivery.", cause_text: "Component failed internal leak test at the dealership.", correction_text: "Replaced the failed component and road tested the vehicle." }
              as: DealerWarrantyAdmin
              as_user_id: "${da_id}"
              captures: { cl_a_id: $.data.id }
            - call: "POST /warranty/claims/${cl_a_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 2.0, approved_parts_qty: 0 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "POST /warranty/claims/${cl_a_id}/pay"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/dealers/${da_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { da_version: $.data.version }
            - call: "POST /warranty/audits"
              payload: { dealer_id: "${da_id}", period_start: "2026-01-01", period_end: "2026-04-01", sample_size: 1, lead_auditor_user_id: "auditor-lead-1", expected_dealer_version: "${da_version}" }
              as: AuditManager
              as_user_id: "aum-user-1"
              captures: { audit_id: $.data.id, audit_v1: $.data.version }
            - call: "POST /warranty/audits/${audit_id}/start"
              as: FieldAuditor
              as_user_id: "auditor-lead-1"
            - call: "POST /warranty/audits/${audit_id}/findings"
              payload: { claim_id: "${cl_a_id}", finding_code: "TIME_NOT_DOCUMENTED", unsupported_amount_cents: 10000, evidence_note: "Technician time is not documented on the repair order." }
              as: FieldAuditor
              as_user_id: "auditor-lead-1"
              captures: { f1_id: $.data.id }
            - call: "POST /warranty/audits/${audit_id}/issue-findings"
              as: AuditManager
              as_user_id: "aum-user-1"
              captures: { audit_v_issued: $.data.version }
            - call: "POST /warranty/audits/${audit_id}/appeals"
              payload: { grounds: "The repair order carries the technician time on its reverse side.", contested_finding_ids: ["${f1_id}"], expected_audit_version: "${audit_v_issued}" }
              as: DealerWarrantyAdmin
              as_user_id: "${da_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /warranty/appeals/${appeal_id}/decision"
              payload: { action: "DENY", decision_note: "The reverse of the repair order was reviewed on appeal." }
              as: AppealReviewer
              as_user_id: "appeal-rev-1"
          trigger:
            - call: "POST /warranty/audits/${audit_id}/appeals"
              payload: { grounds: "Fresh evidence was located in the dealership archive.", contested_finding_ids: ["${f1_id}"], expected_audit_version: "${audit_v_issued}" }
              as: DealerWarrantyAdmin
              as_user_id: "${da_id}"
            - call: "GET /warranty/audits/${audit_id}"
              as: AuditManager
              as_user_id: "aum-user-1"
              captures: { audit_v_now: $.data.version }
            - call: "POST /warranty/audits/${audit_id}/appeals"
              payload: { grounds: "Fresh evidence was located in the dealership archive.", contested_finding_ids: ["${f1_id}"], expected_audit_version: "${audit_v_now}" }
              as: DealerWarrantyAdmin
              as_user_id: "${da_id}"
          assert:
            - "first call: HTTP 412 with error_id ERR_STALE_AUDIT_VERSION"
            - "second call: DealerAudit.status == FINDINGS_ISSUED with a version strictly greater than audit_v_issued and a refreshed appeal_deadline"
            - "third call: HTTP 409 with error_id ERR_FINDING_NOT_IN_AUDIT - with a fresh version the request now fails on the UPHELD finding instead"
            - "no second AuditAppeal row exists"
      - name: chargeback_balance_at_exact_probation_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.dealer_chargeback_balance.constants.PROBATION_THRESHOLD_CENTS
          - state_machines.Dealer.transitions.ACTIVE_to_PROBATION
        distinguishing_aspect: |
          The debit lands the balance on exactly PROBATION_THRESHOLD_CENTS (90000) and the comparison is
          inclusive, so the dealer enters PROBATION and not SUSPENDED - and the posture cascade fires on that
          boundary, suspending the dealer's other SUBMITTED claim.
        test_recipe:
          setup:
            - "Dealer DP at 10000 / 0.25 with operation PB-100 (6.0 h standard and max) and part AXL-1 at 24000."
            - "Claim RO-PB-1 approved at 6.0 h and qty 1: 60000 labor + round_half_up(24000 * 1.25) = 30000 parts, approved_total_cents exactly 90000; it was paid on 2026-05-01."
            - "Its parts return fell due 2026-05-31 and was never received; the clock is now 2026-06-01."
            - "A second claim RO-PB-2 is SUBMITTED and its own return was RECEIVED, so the sweep will touch only the first."
