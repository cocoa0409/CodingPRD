  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_money_conserved_across_capture_and_release
        grounds:
          - entities.Deposit.fields.original_amount_cents
          - entities.Deposit.fields.held_cents
          - entities.Deposit.fields.captured_cents
