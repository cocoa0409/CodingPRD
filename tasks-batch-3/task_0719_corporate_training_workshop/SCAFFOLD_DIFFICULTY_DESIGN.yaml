# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Corporate Training & Workshop Delivery — EXPERT band
# Single top-level key: scaffold_difficulty_design
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. ≥2 instances per rule.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_diverge_on_no_show
        grounds:
          - calculations.invoice_totals
          - state_machines.Cohort.OPEN_to_LOCKED
          - state_machines.Cohort.DELIVERED_to_CLOSED
          - entities.Invoice.fields.variant
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          On the Invoice entity domain: PROVISIONAL invoice sums per_seat over CONFIRMED seats at LOCKED,
          FINAL invoice sums per_seat over ATTENDED seats only at CLOSE — identical cohort, one NO_SHOW seat
          makes the two totals differ (167500 vs 115000), so the divergence is on Invoice, not Contract.
        test_recipe:
          setup:
            - "PER_SEAT ProgramVersion APPROVED (per_seat_cents=50000, materials_kit_cents=2500, min_seats=2, pass_threshold_pct=70), ONSITE, TECHNICAL"
            - "Facilitator ACTIVE certified for TECHNICAL with travel_base_cents=10000"
            - "ONSITE Cohort seat_capacity=5; 3 learners ENROLLED then CONFIRMED (seats_confirmed=3); locked -> PROVISIONAL invoice total 167500"
            - "Cohort started; delivered with only 2 of 3 confirmed marked attended (1 NO_SHOW); closed -> FINAL invoice over 2 ATTENDED = 115000"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Tech Bootcamp", category: "TECHNICAL", delivery_mode: "ONSITE", ceu_credits: 10 }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 8, pricing_model: "PER_SEAT", per_seat_cents: 50000, materials_kit_cents: 2500, min_seats: 2, pass_threshold_pct: 70 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac One", email: "fac1@x.com", certified_categories: ["TECHNICAL"], travel_base_cents: 10000 }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 5, delivery_mode: "ONSITE", starts_at: "2026-04-01T09:00:00Z", ends_at: "2026-04-01T17:00:00Z", enroll_deadline: "2026-03-31T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/open"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "l1@x.com", learner_name: "L One" }
              as: SchedulingCoordinator
              captures: { reg1: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "l2@x.com", learner_name: "L Two" }
              as: SchedulingCoordinator
              captures: { reg2: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "l3@x.com", learner_name: "L Three" }
              as: SchedulingCoordinator
              captures: { reg3: $.data.id }
            - call: "POST /training/registrations/${reg1}/confirm"
              payload: {}
              as: Learner
              as_user_id: "l1@x.com"
            - call: "POST /training/registrations/${reg2}/confirm"
              payload: {}
              as: Learner
              as_user_id: "l2@x.com"
            - call: "POST /training/registrations/${reg3}/confirm"
              payload: {}
              as: Learner
              as_user_id: "l3@x.com"
            - call: "GET /training/cohorts/${coh_id}"
              payload: {}
              as: SchedulingCoordinator
              captures: { coh_v: $.data.version }
            - call: "POST /training/cohorts/${coh_id}/lock"
              payload: { expected_cohort_version: "${coh_v}" }
              as: SchedulingCoordinator
            - call: "POST /training/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/start"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/registrations/${reg1}/mark-attendance"
              payload: {}
              as: Facilitator
              as_user_id: "${fac_id}"
            - call: "POST /training/registrations/${reg2}/mark-attendance"
              payload: {}
              as: Facilitator
              as_user_id: "${fac_id}"
            - call: "POST /training/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T17:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/deliver"
              payload: {}
              as: SchedulingCoordinator
          trigger:
            - call: "POST /training/cohorts/${coh_id}/close"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /training/cohorts/${coh_id}/invoices"
              payload: {}
              as: FinanceManager
              captures: { inv_list: $.data }
          assert:
            - "PROVISIONAL Invoice.total_cents == 167500 (tuition 150000 + materials 7500 + travel 10000)"
            - "FINAL Invoice.total_cents == 115000 (tuition 100000 + materials 5000 + travel 10000)"
            - "PROVISIONAL.total_cents != FINAL.total_cents — divergence driven by the single NO_SHOW seat"

      - name: contract_reserved_vs_committed_diverge
        grounds:
          - calculations.contract_drawdown
          - state_machines.Cohort.OPEN_to_LOCKED
          - state_machines.Cohort.DELIVERED_to_CLOSED
          - entities.EnterpriseContract.fields.committed_cents
          - entities.EnterpriseContract.fields.remaining_cents
        distinguishing_aspect: |
          On the EnterpriseContract entity domain: RESERVED variant is the PROVISIONAL invoice total held at LOCKED
          leaving committed_cents=0, while COMMITTED variant draws the FINAL (ATTENDED-only) total at CLOSE permanently
          incrementing committed_cents — a different subject (Contract budget) than Rule-1's Invoice divergence.
        test_recipe:
          setup:
            - "EnterpriseContract ACTIVE budget_cents=500000"
            - "PER_SEAT contract-sponsored ONSITE cohort; 3 CONFIRMED at lock (PROVISIONAL reserve 167500), committed_cents stays 0"
            - "At close only 2 ATTENDED -> FINAL 115000 drawn; committed_cents becomes 115000, remaining 385000"
          setup_api_calls:
            - call: "POST /training/contracts"
              payload: { client_name: "Acme", budget_cents: 500000 }
              as: FinanceManager
              captures: { ctr_id: $.data.id }
            - call: "POST /training/programs"
              payload: { title: "Tech Bootcamp", category: "TECHNICAL", delivery_mode: "ONSITE", ceu_credits: 10 }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
