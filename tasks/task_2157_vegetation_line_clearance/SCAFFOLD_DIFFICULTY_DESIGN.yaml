            - "committed_cents == 0"
            - "budget_remaining_cents == 900000"

  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: work_order_release_blocked_by_superseded_prescription
        grounds:
          - state_machines.WorkOrder.execution_status.MAPPED_to_RELEASED
          - state_machines.Prescription.ACTIVE_to_SUPERSEDED
          - validations[priority=31]
          - endpoints["POST /vm/circuits/{id}/resolve-prescription"]
        distinguishing_aspect: |
          Entity pair WorkOrder -> Prescription: the span's MAPPED -> RELEASED transition is legal
          only while the Prescription named by its circuit's prescription_id is still ACTIVE;
          activating a newer prescription supersedes it and blocks the release with
          ERR_PRESCRIPTION_NOT_ACTIVE until the circuit is explicitly re-resolved.
        test_recipe:
          setup:
            - "Prescription P1 (12kV/RAPID, effective_from 2026-01-01, clearance 10) is ACTIVE and circuit CKT-A resolved to it."
            - "A RELEASED plan holds one MAPPED span with clearance_radius_ft 12."
            - "Prescription P2 (same voltage_class and growth_zone, effective_from 2026-06-01, clearance 10) is then activated, superseding P1; the circuit still points at P1."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_1: $.data.id }
            - call: "POST /vm/prescriptions/${presc_1}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { wo_id: $.data.id }
            - call: "POST /vm/work-orders/${wo_id}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 3, clearance_radius_ft: 10, effective_from: "2026-06-01" }
              as: UtilityForester
              captures: { presc_2: $.data.id }
            - call: "POST /vm/prescriptions/${presc_2}/activate"
              payload: {}
              as: UtilityForester
          trigger:
            - call: "POST /vm/work-orders/${wo_id}/release"
              payload: {}
              as: ContractorPlanner
              captures: { err: $.data.error_id }
            - call: "POST /vm/circuits/${ckt_id}/resolve-prescription"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/work-orders/${wo_id}/release"
              payload: {}
              as: ContractorPlanner
          assert:
            - "the first release returns HTTP 409 with error_id == ERR_PRESCRIPTION_NOT_ACTIVE"
            - "Prescription.${presc_1}.status == SUPERSEDED"
            - "Prescription.${presc_2}.status == ACTIVE"
            - "after resolve-prescription Circuit.${ckt_id}.prescription_id == ${presc_2}"
            - "after resolve-prescription Circuit.${ckt_id}.cycle_months == 27"
            - "after resolve-prescription Circuit.${ckt_id}.next_trim_due_on == 2026-06-15"
            - "the second release returns HTTP 200 and WorkOrder.${wo_id}.execution_status == RELEASED"

      - name: hazard_removal_blocked_by_unacknowledged_off_row_notification
        grounds:
          - state_machines.HazardTree.ASSESSED_to_APPROVED_REMOVAL
          - state_machines.CustomerNotification.NOTIFIED_to_ACKNOWLEDGED
          - validations[priority=26]
          - entities.HazardTree.fields.customer_notification_id
        distinguishing_aspect: |
          Entity pair HazardTree -> CustomerNotification, structurally different from the
          WorkOrder -> Prescription pair: an off-right-of-way tree (offset_ft 30 > 0) can only reach
          APPROVED_REMOVAL while its linked notification is ACKNOWLEDGED; a REFUSED premise yields
          ERR_OFF_ROW_CONSENT_REQUIRED even though strike_potential and risk_score both pass.
        test_recipe:
          setup:
            - "Circuit CKT-A with a RELEASED span WO-U."
            - "Premise PRM-REFUSE is NOTIFIED then REFUSED; premise PRM-OK is NOTIFIED then ACKNOWLEDGED."
            - "Two identical off-right-of-way trees (SILVER_MAPLE, DEAD, height 60, offset 30, risk 83.00) are identified by arborist-a and assessed by arborist-b, one linked to each premise."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
