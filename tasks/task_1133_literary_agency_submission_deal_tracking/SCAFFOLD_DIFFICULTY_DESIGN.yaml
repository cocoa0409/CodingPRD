            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "Book One" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 75 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms1}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr1: $.data.id } }
          trigger:
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { errE: $.data.error_id } }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { stA: $.data.status } }
          assert:
            - "${errE} == ERR_MANUSCRIPT_NOT_ACCEPTED   # 409 while manuscript EVALUATED"
            - "ClientAgreement.${agr1}.status was DRAFT before the manuscript accept"
            - "${stA} == OFFERED   # same agreement offer succeeds once manuscript ACCEPTED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: editor_exclusivity_half_open_window
        grounds:
          - state_machines.Submission.QUEUED_to_SENT
          - validations[priority=14]
          - errors[ERR_EDITOR_EXCLUSIVE_WINDOW]
        distinguishing_aspect: |
          Interval semantic A — HALF-OPEN window with adjacency ALLOWED, on
          resource Editor: a submission sent to an editor at period p occupies
          [p, p+2); a second send to the same editor collides at periods p and
          p+1 (ERR_EDITOR_EXCLUSIVE_WINDOW) but is allowed at exactly p+2 —
          the touching endpoint does NOT collide.
        test_recipe:
          setup:
            - "Agency at period 0; two signed manuscripts ms1/ms2 with open rounds r1/r2"
            - "s1 (r1 -> edA) SENT at period 0; s2 (r2 -> SAME editor edA) QUEUED"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency T1", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
