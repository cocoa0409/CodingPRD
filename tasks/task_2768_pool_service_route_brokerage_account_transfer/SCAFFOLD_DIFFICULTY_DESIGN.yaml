            - call: "POST /service-accounts/${a_off}/verify"
              payload: {}
              as: Broker
              as_user_id: "broker-verify-1"
          assert:
            - "ServiceAccount.${a_on}.verified_recurring_mrr_cents == 19000"
            - "ServiceAccount.${a_on}.verification_variance == 0.0500 (exactly at VERIFY_TOLERANCE)"
            - "ServiceAccount.${a_on}.verification_status == VERIFIED (the comparison is <=, not <)"
            - "ServiceAccount.${a_off}.verified_recurring_mrr_cents == 18900"
            - "ServiceAccount.${a_off}.verification_variance == 0.0550"
            - "ServiceAccount.${a_off}.verification_status == DISPUTED"
            - "ServiceAccount.${a_on}.verified_repair_mrr_cents == 0 and ServiceAccount.${a_off}.verified_repair_mrr_cents == 0"
            - "RouteListing.${l_bnd}.verified_recurring_mrr_cents == 19000 (only the VERIFIED account rolls up)"
            - "RouteListing.${l_bnd}.verified_account_count == 1"
            - "RouteListing.${l_bnd}.verification_posture == INCOMPLETE (one account is DISPUTED)"

      - name: empty_valuation_input_set_is_not_zero_valued_rejected
        grounds:
          - "validations[priority=42]"
          - "errors.ERR_NO_VALUATION_INPUTS"
          - "calculations.route_valuation"
          - "state_machines.ServiceAccount.UNVERIFIED_to_EXCLUDED"
          - "endpoints[POST /route-listings/{id}/valuations]"
        distinguishing_aspect: "Empty-collection boundary rather than a numeric one: the input set has size zero for BOTH bases at once, and the specified behaviour is refusal rather than a defensible-looking valuation_cents of 0. It also pins that no RouteValuation row is created as a side effect of the refusal."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; AZ state profile; seller ACTIVE."
            - "One DRAFT listing EMPTY-01 whose only ServiceAccount has been EXCLUDED, so the LISTED_BASIS input set (verification_status != EXCLUDED) is empty and the VERIFIED_BASIS input set (verification_status == VERIFIED) is empty too."
            - "No RouteValuation row exists for the listing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "EMPTY-01", "state_code": "AZ", "asking_price_cents": 200000, "listed_mrr_cents": 20000, "listed_account_count": 1, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"l_empty": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${l_empty}", "customer_ref": "SOLE-STOP", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 20000, "avg_monthly_chemical_cents": 0, "avg_monthly_repair_cents": 0, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a_empty": "$.data.id"}
            - call: "POST /service-accounts/${a_empty}/exclude"
              payload: {"exclusion_reason_code": "CUSTOMER_ALREADY_CANCELLED"}
              as: Broker
          trigger:
            - call: "GET /route-listings/${l_empty}"
              as: Broker
              captures: {"lv_empty": "$.data.version"}
            - call: "POST /route-listings/${l_empty}/valuations"
              payload: {"basis": "LISTED_BASIS", "expected_listing_version": "${lv_empty}"}
              as: Broker
            - call: "POST /route-listings/${l_empty}/valuations"
              payload: {"basis": "VERIFIED_BASIS", "expected_listing_version": "${lv_empty}"}
              as: Broker
          assert:
            - "the LISTED_BASIS call returns HTTP 422 with error_id ERR_NO_VALUATION_INPUTS"
            - "the VERIFIED_BASIS call returns HTTP 422 with error_id ERR_NO_VALUATION_INPUTS"
            - "neither call creates a RouteValuation: GET /route-valuations filtered on the listing returns an empty data array"
            - "RouteListing.${l_empty}.claimed_recurring_mrr_cents == 0 and RouteListing.${l_empty}.claimed_account_count == 0"
            - "RouteListing.${l_empty}.verified_recurring_mrr_cents == 0 and RouteListing.${l_empty}.verification_posture == EMPTY"
            - "RouteListing.${l_empty}.status == DRAFT and RouteListing.${l_empty}.version is unchanged by the two refused calls"
            - "control: after POST /service-accounts/${a_empty}/reinstate the same LISTED_BASIS call succeeds with valuation_cents 200000, so the refusal was caused by emptiness alone"

