            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10, threshold_pct: 10.00, required_permit_types: ["ROW"], max_concurrent_bury_ops: 2 }
              as: ProgramManager
