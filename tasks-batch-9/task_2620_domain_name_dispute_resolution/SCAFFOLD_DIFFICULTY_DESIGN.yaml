            - "Case.${case_id}.complainant_paid_cents == 0 and respondent_paid_cents == 0 after the close"
            - "Case.${case_id}.paid_cents == 5000, NOT 0: the surviving PROVIDER write-off is the whole balance"
            - "The three original rows are untouched: FeeTransaction.${tx_a_id}.amount_cents == 150000, ${tx_b_id} == 25000, ${tx_c_id} == 5000, and none of them is deleted or negated in place"
            - "Complainant.${cpl_id}.open_case_count == 0 and DomainName.${dom_id}.lock_status == UNLOCKED"
            - "Re-running POST /udrp/_ops/deadline-sweep at the same clock returns all-zero counts and leaves the ledger at 4 rows, so the compensation is applied exactly once"

      - name: seat_load_counters_reconcile_after_a_no_load_exit_and_a_load_taking_exit
        grounds:
          - calculations.load_and_population_counters
          - state_machines.PanelistAppointment.CONFLICTED_to_REPLACED
          - state_machines.PanelistAppointment.ACCEPTED_to_REPLACED
          - entities.Panelist.fields.active_case_load
          - entities.PanelistAppointment.fields.replaced_by_appointment_id
        distinguishing_aspect: |
          One three-member case ends up with five appointment rows because two seats are replaced for
          opposite reasons: a CONFLICTED nominee that NEVER took load, and an ACCEPTED panelist that
          did. The invariant sum(Panelist.active_case_load) == count(ACCEPTED rows on non-terminal
          cases) == 3 must hold at the end, which means the CONFLICTED exit must decrement nothing
          while the ACCEPTED exit decrements exactly one. An implementation that decrements on every
          replace lands on 2, and one that increments on NOMINATED lands on 4.
