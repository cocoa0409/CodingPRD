          - errors.ERR_ADJUSTMENT_EXCEEDS_OUTSTANDING
        distinguishing_aspect: "A REDUCE may not exceed the invoice's current outstanding_cents: 6000 against a 5500-cent invoice is refused with 422, so adjusted_cents can never drive outstanding_cents negative or manufacture a credit."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; the PERMIT_ISSUE_FEE invoice stands at assessed 5500, paid 0, outstanding 5500, and its version was read at issuance."
          setup_api_calls:
            - *k_clock
