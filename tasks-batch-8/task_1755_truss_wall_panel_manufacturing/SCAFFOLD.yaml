# =============================================================================
# SCAFFOLD.yaml — Truss & Wall-Panel Manufacturing (component plant)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Truss & Wall-Panel Manufacturing (Builders FirstSource component plant): engineered truss design & seal, cut list/BOM explosion by jig setup, plate/lumber inventory & waste factor, build sequence by delivery date & crane pick, shipping load & bundle map, field damage/rebuild claim, design change after cut, jobsite delivery window & storage

domain_name: truss-wall-panel-manufacturing
api_prefix: /plant

complexity_profile:
  primary_archetype: quota_allocation        # finite plate/lumber lots reserved, consumed, released against cut lists
  secondary_archetype: temporal_windowing    # buffered crane-pick slots + closed jobsite delivery windows with aggregate daily capacity
  complexity_layers:
    - optimistic_concurrency                 # OCC on Job.version, InventoryLot.version, CraneResource.version
    - cascading_side_effects                 # change-order apply cascade depth 6+; claim rebuild cascade
    - dual_variant_calculation               # provisional vs final freight; claim cap vs settlement waterfall
    - rate_threshold_triggers                # tiered waste %, storage free-days threshold, overweight surcharge tier
  entity_topology: graph                     # many-to-many junctions (MaterialReservation, Bundle, CraneSlot) + self-referential revision chains + cross-aggregate FKs
  state_machine_shape: cyclic                # design seal-rejection loop, load return/reschedule loop, batch QC/rework loop; Job is additionally compound (posture derived from children)
  relationship_patterns:
    - one_to_many
    - many_to_many                           # CutListLine <-> InventoryLot via MaterialReservation; ProductionBatch <-> DeliveryLoad via Bundle
    - self_referential                       # ComponentDesign.supersedes_design_id; Bundle.split_from_bundle_id
    - cross_aggregate                        # CraneSlot references ProductionBatch / DeliveryLoad across aggregates
  role_model: segregation_of_duties          # sealer != submitter (designs); claim decider != triager (claims)
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Customer company name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding freight credit in cents" }
      - { name: credit_hold, type: boolean, source: input, default: false, description: "When true, dispatch of any load for this customer is blocked and all its jobs read posture BLOCKED" }
      - { name: credit_used_cents, type: integer, source: computed, default: 0, description: "Sum of provisional_freight_cents over this customer's DeliveryLoads with status in {PLANNED, STAGED, LOADING} plus final_freight_cents over loads with status in {DISPATCHED, DELIVERED, RETURNED, RESCHEDULED, CLAIM_HOLD, CLOSED}; loads in CANCELLED contribute 0" }
      - { name: storage_free_days, type: integer, source: input, default: 2, description: "Whole days a staged load may wait for dispatch before storage billing starts" }
      - { name: storage_daily_fee_cents, type: integer, source: input, default: 15000, description: "Per-billable-day storage fee" }
      - { name: storage_fee_cap_cents, type: integer, source: input, default: 300000, description: "Per-load storage fee ceiling" }
      - { name: max_drops_per_day, type: integer, source: input, default: 2, description: "Aggregate jobsite capacity: maximum DeliveryLoads of one Job sharing the same scheduled_date" }
      - { name: delivery_terms, type: enum, source: input, description: "FOB_PLANT | DELIVERED", constraints: "one of {FOB_PLANT, DELIVERED}" }

  - name: Engineer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Engineer name" }
      - { name: license_number, type: string, source: input, description: "PE license number" }
      - { name: license_state, type: string, source: input, description: "Two-letter state of licensure; must equal Job.jobsite_state to seal that job's designs" }
      - { name: license_expiry, type: datetime, source: input, description: "License expiry instant; sealing allowed iff license_expiry >= current logical clock" }
      - { name: seal_authority, type: enum, source: input, description: "TRUSS_ONLY | TRUSS_AND_PANEL; WALL_PANEL designs require TRUSS_AND_PANEL", constraints: "one of {TRUSS_ONLY, TRUSS_AND_PANEL}" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning customer" }
      - { name: job_name, type: string, source: input, description: "Job name" }
      - { name: jobsite_address, type: string, source: input, description: "Delivery address" }
      - { name: jobsite_state, type: string, source: input, description: "Two-letter jobsite state; sealing engineer must hold this state's license" }
      - { name: delivery_window_start, type: datetime, source: input, description: "Jobsite delivery window open (closed interval, UTC date granularity)" }
      - { name: delivery_window_end, type: datetime, source: input, description: "Jobsite delivery window close (closed interval, inclusive); must be >= delivery_window_start" }
      - { name: crane_required_at_jobsite, type: boolean, source: input, default: false, description: "Adds flat 25000 cents to provisional freight when true" }
      - { name: contracted_value_cents, type: integer, source: input, description: "Contract value of manufactured components" }
      - { name: invoiced_cents, type: integer, source: computed, default: 0, description: "contracted_value_cents + sum of final_freight_cents over CLOSED loads of this job" }
      - { name: credit_issued_cents, type: integer, source: computed, default: 0, description: "Sum of residual_credit_cents over this job's DamageClaims currently in SETTLED status" }
      - { name: posture, type: enum, source: computed, default: "GREEN", description: "Derived aggregate: BLOCKED if customer.credit_hold, or any DesignChangeOrder APPROVED, or any CutList RECONCILING, or any DamageClaim in {APPROVED_REBUILD, REBUILD_IN_PROGRESS}; else AT_RISK if any ProductionBatch in {QC_FAILED, REWORK}, or any DeliveryLoad RETURNED, or any ComponentDesign SEAL_REQUESTED; else GREEN", constraints: "one of {GREEN, AT_RISK, BLOCKED}" }
      - { name: status, type: enum, source: system, description: "QUOTED -> CONFIRMED -> IN_PRODUCTION -> SHIPPING -> COMPLETED | CANCELLED", constraints: "one of {QUOTED, CONFIRMED, IN_PRODUCTION, SHIPPING, COMPLETED, CANCELLED}" }

  - name: ComponentDesign
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; from path on create" }
      - { name: component_ref, type: string, source: input, description: "Customer-facing component label, e.g. TR-01; at most one non-terminal DRAFT/SEAL_REQUESTED design per (job_id, component_ref), and creating a revision while a SEALED design exists for the same component_ref requires supersedes_design_id of the current sealed revision" }
      - { name: revision_no, type: integer, source: computed, description: "1 + max revision_no among designs of same (job_id, component_ref)" }
      - { name: supersedes_design_id, type: string, source: input, description: "FK -> ComponentDesign.id; nullable; when set must reference the current SEALED revision of the same component_ref", constraints: "nullable" }
      - { name: component_type, type: enum, source: input, description: "FLOOR_TRUSS | ROOF_TRUSS | WALL_PANEL", constraints: "one of {FLOOR_TRUSS, ROOF_TRUSS, WALL_PANEL}" }
      - { name: span_ft, type: number, source: input, description: "Clear span in feet" }
      - { name: pitch_degrees, type: number, source: input, description: "Roof pitch in degrees (0 for floor truss / wall panel)" }
      - { name: design_load_psf, type: number, source: input, description: "Design load in psf" }
      - { name: lumber_grade, type: enum, source: input, description: "SPF_NO2 | SPF_MSR2400 | SYP_NO1; drives waste base rate", constraints: "one of {SPF_NO2, SPF_MSR2400, SYP_NO1}" }
      - { name: plating, type: enum, source: input, description: "P20 | P18 | P16 plate class; plate lots must match", constraints: "one of {P20, P18, P16}" }
      - { name: quantity_required, type: integer, source: input, description: "Number of identical components the job needs; drives plate requirement" }
      - { name: est_board_feet_per_unit, type: number, source: computed, description: "round(span_ft * UNIT_BF_PER_SPAN_FT[component_type], 2); informational only" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SEAL_REQUESTED -> SEALED -> SUPERSEDED; SEAL_REQUESTED -> DRAFT rejection loop; DRAFT -> VOID", constraints: "one of {DRAFT, SEAL_REQUESTED, SEALED, SUPERSEDED, VOID}" }
      - { name: submitted_by_engineer_id, type: string, source: system, description: "FK -> Engineer.id; nullable; set from X-User-ID on the DRAFT->SEAL_REQUESTED transition", constraints: "nullable" }
      - { name: sealed_by_engineer_id, type: string, source: system, description: "FK -> Engineer.id; nullable; set from X-User-ID on the SEAL_REQUESTED->SEALED transition", constraints: "nullable" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical-clock timestamp of sealing; null until SEALED", constraints: "nullable" }

  - name: CutList
    parent: null
    common_fields: true
    fields:
      - { name: design_id, type: string, source: system, description: "FK -> ComponentDesign.id; from path on create" }
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; denormalized from design at create" }
      - { name: jig_setup_id, type: string, source: input, description: "FK -> JigSetup.id; jig the members are cut/assembled on; jig component_type_supported must equal design component_type" }
      - { name: rebuild_for_claim_id, type: string, source: system, description: "FK -> DamageClaim.id; nullable; set when this list is the system-cloned rebuild list of an APPROVE_REBUILD decision", constraints: "nullable" }
      - { name: total_board_feet, type: number, source: computed, description: "Sum over lines of round(line_board_feet * (1 + waste_pct), 2) — per-line rounding THEN summation (pinned order)" }
      - { name: total_pieces, type: integer, source: computed, description: "Sum over lines of qty" }
      - { name: total_plates, type: integer, source: computed, description: "design.quantity_required * PLATES_PER_UNIT[component_type]" }
      - { name: status, type: enum, source: system, description: "EXPLODED -> RELEASED -> RECONCILING -> CLOSED; EXPLODED/RELEASED -> SUPERSEDED via change-order apply", constraints: "one of {EXPLODED, RELEASED, RECONCILING, SUPERSEDED, CLOSED}" }

  - name: CutListLine
    parent: null
    common_fields: true
    fields:
      - { name: cut_list_id, type: string, source: system, description: "FK -> CutList.id; from the lines[] array of the cut-list create call" }
      - { name: member_label, type: string, source: input, description: "Member label, e.g. TC-1" }
      - { name: dimension, type: enum, source: input, description: "L2X4 | L2X6 | L2X8 nominal lumber dimension", constraints: "one of {L2X4, L2X6, L2X8}" }
      - { name: length_ft, type: number, source: input, description: "Cut length in feet" }
      - { name: qty, type: integer, source: input, description: "Piece count for this member" }
      - { name: line_board_feet, type: number, source: computed, description: "round(qty * length_ft * BF_PER_FT[dimension], 2)" }
      - { name: waste_pct, type: number, source: computed, description: "min(BASE_WASTE[design.lumber_grade] + length surcharge, WASTE_CAP); surcharge 0.04 if length_ft >= 20 else 0.02 if >= 16 else 0" }
      - { name: required_board_feet, type: number, source: computed, description: "round(line_board_feet * (1 + waste_pct), 2); the reservation coverage requirement" }
      - { name: status, type: enum, source: system, description: "PENDING -> CUT | SCRAPPED", constraints: "one of {PENDING, CUT, SCRAPPED}" }

  - name: JigSetup
    parent: null
    common_fields: false
    fields:
      - { name: setup_code, type: string, source: input, description: "Unique jig code, e.g. JIG-ROOF-A; immutable" }
      - { name: component_type_supported, type: enum, source: input, description: "FLOOR_TRUSS | ROOF_TRUSS | WALL_PANEL", constraints: "one of {FLOOR_TRUSS, ROOF_TRUSS, WALL_PANEL}" }
      - { name: plate_class, type: enum, source: input, description: "P20 | P18 | P16", constraints: "one of {P20, P18, P16}" }
      - { name: changeover_minutes_from, type: object, source: input, description: "Map from source setup_code to integer minutes to change TO this jig FROM that source; missing entries mean DEFAULT_CHANGEOVER_MINUTES; same code is 0" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_kind, type: enum, source: input, description: "LUMBER | PLATE", constraints: "one of {LUMBER, PLATE}" }
      - { name: lumber_dimension, type: enum, source: input, description: "L2X4 | L2X6 | L2X8; required iff lot_kind LUMBER", constraints: "nullable; required when lot_kind == LUMBER" }
      - { name: lumber_grade, type: enum, source: input, description: "SPF_NO2 | SPF_MSR2400 | SYP_NO1; required iff lot_kind LUMBER", constraints: "nullable; required when lot_kind == LUMBER" }
      - { name: plate_class, type: enum, source: input, description: "P20 | P18 | P16; required iff lot_kind PLATE", constraints: "nullable; required when lot_kind == PLATE" }
      - { name: received_board_feet, type: number, source: input, default: 0, description: "Received lumber volume; must be 0 for PLATE lots" }
      - { name: received_plates, type: integer, source: input, default: 0, description: "Received plate count; must be 0 for LUMBER lots" }
      - { name: unit_cost_cents_per_bf, type: integer, source: input, default: 0, description: "Lumber unit cost; informational for rebuild costing" }
      - { name: unit_cost_cents_per_plate, type: integer, source: input, default: 0, description: "Plate unit cost; informational" }
      - { name: available_bf, type: number, source: computed, default: 0, description: "Initialized to received_board_feet at create; reserve decrements, release restores, consume moves reserved->consumed, scrap moves consumed->scrapped" }
      - { name: reserved_bf, type: number, source: computed, default: 0, description: "Sum of reserved_bf over this lot's MaterialReservations in RESERVED status" }
      - { name: consumed_bf, type: number, source: computed, default: 0, description: "Sum of reserved_bf over this lot's reservations in CONSUMED status minus scrapped portion" }
      - { name: scrapped_bf, type: number, source: computed, default: 0, description: "Waste accrual from scrapped CUT lines and manual adjustments" }
      - { name: available_plates, type: integer, source: computed, default: 0, description: "Initialized to received_plates; mirror of available_bf for PLATE lots" }
      - { name: reserved_plates, type: integer, source: computed, default: 0, description: "Sum of reserved_plates over RESERVED plate reservations" }
      - { name: consumed_plates, type: integer, source: computed, default: 0, description: "Sum of reserved_plates over CONSUMED plate reservations" }
      - { name: scrapped_plates, type: integer, source: computed, default: 0, description: "Scrapped plates via manual adjustment" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> QUARANTINED -> ACTIVE; ACTIVE -> DEPLETED when available and reserved are both 0", constraints: "one of {ACTIVE, QUARANTINED, DEPLETED}" }

  - name: MaterialReservation
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id; lot being reserved against" }
      - { name: cut_list_line_id, type: string, source: input, description: "FK -> CutListLine.id; required for LUMBER reservations, must be null for PLATE", constraints: "nullable; required when lot is LUMBER" }
      - { name: cut_list_id, type: string, source: input, description: "FK -> CutList.id; required for PLATE reservations, must be null for LUMBER", constraints: "nullable; required when lot is PLATE" }
      - { name: reserved_bf, type: number, source: input, default: 0, description: "Board feet reserved; > 0 iff LUMBER reservation, else must be 0" }
      - { name: reserved_plates, type: integer, source: input, default: 0, description: "Plates reserved; > 0 iff PLATE reservation, else must be 0" }
      - { name: status, type: enum, source: system, description: "RESERVED -> CONSUMED | RELEASED", constraints: "one of {RESERVED, CONSUMED, RELEASED}" }

  - name: CraneResource
    parent: null
    common_fields: true
    fields:
      - { name: crane_code, type: string, source: input, description: "Unique plant crane code" }
      - { name: capacity_lbs, type: integer, source: input, description: "Maximum single-pick weight; bundles weighed against the load-pick crane's capacity" }
      - { name: crane_class, type: enum, source: input, description: "LIGHT | STANDARD | HEAVY", constraints: "one of {LIGHT, STANDARD, HEAVY}" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Hourly crane rate used in final freight crane_cost" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE", constraints: "one of {ACTIVE, OUT_OF_SERVICE}" }

  - name: CraneSlot
    parent: null
    common_fields: true
    fields:
      - { name: crane_id, type: string, source: input, description: "FK -> CraneResource.id" }
      - { name: purpose, type: enum, source: input, description: "BUILD_PICK (batch staging pick) | LOAD_PICK (truck loading pick)", constraints: "one of {BUILD_PICK, LOAD_PICK}" }
      - { name: production_batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; nullable; the batch STAGED guard filters BUILD_PICK slots by this reference", constraints: "nullable; required when purpose == BUILD_PICK" }
      - { name: delivery_load_id, type: string, source: input, description: "FK -> DeliveryLoad.id; nullable; the load LOADING guard filters LOAD_PICK slots by this reference", constraints: "nullable; required when purpose == LOAD_PICK" }
      - { name: start_at, type: datetime, source: input, description: "Half-open interval start; must be >= current logical clock" }
      - { name: end_at, type: datetime, source: input, description: "Half-open interval end; must be > start_at" }
      - { name: status, type: enum, source: system, description: "BOOKED -> COMPLETED | CANCELLED", constraints: "one of {BOOKED, COMPLETED, CANCELLED}" }

  - name: ProductionBatch
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; from path on create" }
      - { name: cut_list_id, type: string, source: input, description: "FK -> CutList.id; must be RELEASED" }
      - { name: jig_setup_id, type: string, source: input, description: "FK -> JigSetup.id; component_type_supported must equal the cut list's design component_type" }
      - { name: requested_completion_at, type: datetime, source: input, description: "Planner-requested completion instant; primary build-sequence sort key" }
      - { name: build_sequence_no, type: integer, source: computed, description: "Position in the job's build sequence per calculation build_sequence_ordering; recomputed on batch create and cancel" }
      - { name: is_rebuild, type: boolean, source: system, default: false, description: "True when created by the claim rebuild cascade" }
      - { name: source_claim_id, type: string, source: system, description: "FK -> DamageClaim.id; nullable; set on rebuild batches", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CUTTING -> ASSEMBLY -> BUILT -> QC_PASSED | QC_FAILED -> REWORK -> QC_PASSED -> STAGED -> LOADED; non-terminal -> CANCELLED only via cascades", constraints: "one of {SCHEDULED, CUTTING, ASSEMBLY, BUILT, QC_PASSED, QC_FAILED, REWORK, STAGED, LOADED, CANCELLED}" }

  - name: DeliveryLoad
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; from path on create" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned delivery date; must fall inside the job's closed delivery window; rechecked on dispatch" }
      - { name: planned_weight_est_lbs, type: number, source: input, description: "Planner weight estimate feeding provisional freight" }
      - { name: provisional_freight_cents, type: integer, source: computed, description: "50000 + round(planned_weight_est_lbs * 12) + (job.crane_required_at_jobsite ? 25000 : 0); computed at create" }
      - { name: final_freight_cents, type: integer, source: computed, description: "Computed at CLOSED per calculation load_freight_final; null until then", constraints: "nullable" }
      - { name: actual_total_weight_lbs, type: number, source: computed, default: 0, description: "Sum of weight_lbs over bundles in {PACKED, LOADED, DELIVERED, RETURNED, DAMAGED}; SUPERSEDED bundles excluded" }
      - { name: crane_hours_actual, type: number, source: input, description: "Actual crane hours; required input on the -> CLOSED transition; null before", constraints: "nullable" }
      - { name: staged_at, type: datetime, source: system, description: "Logical-clock timestamp of the PLANNED -> STAGED transition; storage anchor", constraints: "nullable" }
      - { name: last_dispatched_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent -> DISPATCHED transition (re-dispatch extends storage)", constraints: "nullable" }
      - { name: storage_fee_cents, type: integer, source: computed, description: "Computed at CLOSED per calculation storage_fee_accrual; null until then", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PLANNED -> STAGED -> LOADING -> DISPATCHED -> DELIVERED -> CLOSED; DISPATCHED -> RETURNED -> RESCHEDULED -> DISPATCHED loop; DELIVERED -> CLAIM_HOLD -> CLOSED; -> CANCELLED via job cancel", constraints: "one of {PLANNED, STAGED, LOADING, DISPATCHED, DELIVERED, RETURNED, RESCHEDULED, CLAIM_HOLD, CLOSED, CANCELLED}" }

  - name: Bundle
    parent: null
    common_fields: true
    fields:
      - { name: delivery_load_id, type: string, source: system, description: "FK -> DeliveryLoad.id; from path on create" }
      - { name: production_batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch must be STAGED and belong to the same job as the load" }
      - { name: stack_position, type: integer, source: input, description: "Load order position, 1 = floor; unique among non-SUPERSEDED bundles of the same load" }
      - { name: weight_lbs, type: number, source: input, description: "Bundle weight; must be <= capacity_lbs of the crane on the load's earliest-start BOOKED/COMPLETED LOAD_PICK slot" }
      - { name: split_from_bundle_id, type: string, source: input, description: "FK -> Bundle.id; nullable; marks this bundle as split off from another bundle of the same load", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PACKED -> LOADED -> DELIVERED | RETURNED | DAMAGED; PACKED -> SUPERSEDED via change-order apply", constraints: "one of {PACKED, LOADED, DELIVERED, RETURNED, DAMAGED, SUPERSEDED}" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: delivery_load_id, type: string, source: system, description: "FK -> DeliveryLoad.id; from path on create" }
      - { name: bundle_id, type: string, source: input, description: "FK -> Bundle.id; damaged bundle; must belong to this load" }
      - { name: filed_by_customer_id, type: string, source: system, description: "FK -> CustomerAccount.id; set from X-User-ID; must equal the load's job's customer_id" }
      - { name: claim_type, type: enum, source: input, description: "FIELD_DAMAGE | MATERIAL_DEFECT | SHORT_SHIPMENT", constraints: "one of {FIELD_DAMAGE, MATERIAL_DEFECT, SHORT_SHIPMENT}" }
      - { name: description, type: string, source: input, description: "Free-text damage description" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed by the customer" }
      - { name: damage_pct, type: number, source: input, description: "Adjuster-assessed damaged fraction (0 < damage_pct <= 1); required on decide unless decision is DENY; null before", constraints: "nullable" }
      - { name: approved_cap_cents, type: integer, source: computed, description: "min(claimed_amount_cents, round_half_up(damage_pct * component_value_cents)) where component_value_cents = round_half_up(damaged bundle's batch's cut list total_board_feet * 850); null until decided", constraints: "nullable" }
      - { name: rebuild_material_cents, type: integer, source: computed, description: "Waterfall bucket 1 at settle: min(input material actual, remaining cap); null until SETTLED", constraints: "nullable" }
      - { name: rebuild_labor_cents, type: integer, source: computed, description: "Waterfall bucket 2; null until SETTLED", constraints: "nullable" }
      - { name: redelivery_cents, type: integer, source: computed, description: "Waterfall bucket 3; null until SETTLED", constraints: "nullable" }
      - { name: residual_credit_cents, type: integer, source: computed, description: "approved_cap_cents minus the three buckets; null until SETTLED", constraints: "nullable" }
      - { name: triaged_by, type: string, source: system, description: "X-User-ID of the triaging adjuster; null until TRIAGED", constraints: "nullable" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the deciding adjuster; must differ from triaged_by; null until decided", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "FILED -> TRIAGED -> APPROVED_REBUILD | APPROVED_CREDIT | DENIED; APPROVED_REBUILD -> REBUILD_IN_PROGRESS -> SETTLED; APPROVED_CREDIT -> SETTLED; SETTLED -> VOID (reversal); FILED | TRIAGED -> VOID", constraints: "one of {FILED, TRIAGED, APPROVED_REBUILD, APPROVED_CREDIT, REBUILD_IN_PROGRESS, DENIED, SETTLED, VOID}" }

  - name: DesignChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; from path on create" }
      - { name: supersedes_design_id, type: string, source: input, description: "FK -> ComponentDesign.id; the current SEALED design being changed" }
      - { name: new_design_id, type: string, source: input, description: "FK -> ComponentDesign.id; nullable at create, may be set at assess; must be a SEALED revision of the same component_ref with supersedes_design_id == this change order's supersedes_design_id before approve", constraints: "nullable" }
      - { name: reason, type: string, source: input, description: "Change reason" }
      - { name: requested_by, type: string, source: system, description: "X-User-ID of creator" }
      - { name: impact_lines_scrapped, type: integer, source: computed, description: "Count of lines in CUT status across cut lists of supersedes_design_id at assess time; null until IMPACT_ASSESSED", constraints: "nullable" }
      - { name: impact_open_reservations, type: integer, source: computed, description: "Count of RESERVED reservations on lines of the superseded design's cut lists at assess time; null until IMPACT_ASSESSED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> IMPACT_ASSESSED -> APPROVED -> APPLIED; REQUESTED | IMPACT_ASSESSED -> REJECTED; REQUESTED -> WITHDRAWN", constraints: "one of {REQUESTED, IMPACT_ASSESSED, APPROVED, REJECTED, WITHDRAWN, APPLIED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Job
    initial_state: QUOTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /plant/jobs/{id}/confirm"
        actor: PlantManager
        preconditions: ["job status == QUOTED"]
        side_effects: ["Job.version increments by 1"]
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "system: first CutList of this job reaches RELEASED"
        actor: system
        preconditions: ["job status == CONFIRMED"]
        side_effects: ["Job.version increments by 1"]
      - from: IN_PRODUCTION
        to: SHIPPING
        trigger: "system: first DeliveryLoad of this job reaches DISPATCHED"
        actor: system
        preconditions: ["job status == IN_PRODUCTION"]
        side_effects: ["Job.version increments by 1"]
      - from: SHIPPING
        to: COMPLETED
        trigger: "system: all of the job's DeliveryLoads are CLOSED or CANCELLED, all ProductionBatches are in {LOADED, CANCELLED}, and no DamageClaim of the job's loads is in {FILED, TRIAGED, APPROVED_REBUILD, APPROVED_CREDIT, REBUILD_IN_PROGRESS}"
        actor: system
        preconditions: ["every DeliveryLoad of job in {CLOSED, CANCELLED}", "every ProductionBatch of job in {LOADED, CANCELLED}", "no open DamageClaim on any load of the job", "at least one DeliveryLoad exists"]
        side_effects: ["Job.invoiced_cents recomputed"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /plant/jobs/{id}/cancel"
        actor: PlantManager
        preconditions: ["no DeliveryLoad of job in {DISPATCHED, DELIVERED, RETURNED, RESCHEDULED, CLAIM_HOLD}"]
        side_effects: ["cascade: every DeliveryLoad in {PLANNED, STAGED, LOADING} -> CANCELLED", "cascade: every ProductionBatch not in {LOADED, CANCELLED} -> CANCELLED", "cascade: every CutList in {EXPLODED, RELEASED, RECONCILING} -> SUPERSEDED", "cascade: every MaterialReservation in RESERVED on lines/lists of this job -> RELEASED (lot availability restored, lot.version increments)", "Job.version increments by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /plant/jobs/{id}/cancel"
        actor: PlantManager
        preconditions: ["no DeliveryLoad of job in {DISPATCHED, DELIVERED, RETURNED, RESCHEDULED, CLAIM_HOLD}"]
        side_effects: ["same cascade as QUOTED -> CANCELLED", "Job.version increments by 1"]
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /plant/jobs/{id}/cancel"
        actor: PlantManager
        preconditions: ["no DeliveryLoad of job in {DISPATCHED, DELIVERED, RETURNED, RESCHEDULED, CLAIM_HOLD}"]
        side_effects: ["same cascade as QUOTED -> CANCELLED", "Job.version increments by 1"]

  - entity: ComponentDesign
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: DRAFT
        to: SEAL_REQUESTED
        trigger: "POST /plant/designs/{id}/transition with to_state SEAL_REQUESTED"
        actor: DesignEngineer
        preconditions: ["design status == DRAFT"]
        side_effects: ["submitted_by_engineer_id := X-User-ID"]
      - from: SEAL_REQUESTED
        to: SEALED
        trigger: "POST /plant/designs/{id}/transition with to_state SEALED"
        actor: DesignEngineer
        preconditions: ["design status == SEAL_REQUESTED", "sealing engineer (X-User-ID) exists, license_expiry >= current logical clock", "sealing engineer license_state == job.jobsite_state", "component_type == WALL_PANEL requires sealing engineer seal_authority == TRUSS_AND_PANEL", "sealing engineer id != submitted_by_engineer_id (segregation of duties)"]
        side_effects: ["sealed_by_engineer_id := X-User-ID", "sealed_at := current logical clock", "Job posture recomputed (SEAL_REQUESTED no longer outstanding for this design)"]
      - from: SEAL_REQUESTED
        to: DRAFT
        trigger: "POST /plant/designs/{id}/transition with to_state DRAFT (seal rejection loop)"
        actor: DesignEngineer
        preconditions: ["design status == SEAL_REQUESTED"]
        side_effects: ["submitted_by_engineer_id := null (a fresh submit records a new submitter)"]
      - from: DRAFT
        to: VOID
        trigger: "POST /plant/designs/{id}/transition with to_state VOID"
        actor: DesignEngineer
        preconditions: ["design status == DRAFT"]
        side_effects: []
      - from: SEALED
        to: SUPERSEDED
        trigger: "system: owning DesignChangeOrder reaches APPLIED"
        actor: system
        preconditions: ["design is the change order's supersedes_design_id"]
        side_effects: ["cascade hop 2 of change-order apply: this design's CutLists move to RECONCILING or SUPERSEDED (see DesignChangeOrder apply)"]

  - entity: CutList
    initial_state: EXPLODED
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: EXPLODED
        to: RELEASED
        trigger: "POST /plant/cut-lists/{id}/release"
        actor: ProductionPlanner
        preconditions: ["cut list status == EXPLODED", "design is SEALED and current (no SEALED design of same (job_id, component_ref) with higher revision_no)", "jig_setup component_type_supported == design component_type"]
        side_effects: ["system: if this is the job's first RELEASED cut list, Job CONFIRMED -> IN_PRODUCTION", "Job posture recomputed"]
      - from: RELEASED
        to: RECONCILING
        trigger: "system: change-order apply over the list's design while at least one line is CUT (design change after cut)"
        actor: system
        preconditions: ["owning design is change order supersedes_design_id", "at least one line status == CUT"]
        side_effects: ["cascade: every RESERVED MaterialReservation on PENDING lines of this list -> RELEASED (lot available_bf/available_plates restored, lot.version increments)", "Job posture recomputed -> BLOCKED while any list RECONCILING"]
      - from: RELEASED
        to: SUPERSEDED
        trigger: "system: change-order apply over the list's design while no line is CUT"
        actor: system
        preconditions: ["owning design is change order supersedes_design_id", "no line status == CUT"]
        side_effects: ["cascade: every RESERVED MaterialReservation on this list (lines or plate-level) -> RELEASED (lot availability restored, lot.version increments)"]
      - from: EXPLODED
        to: SUPERSEDED
        trigger: "system: change-order apply over the list's design (never released)"
        actor: system
        preconditions: ["owning design is change order supersedes_design_id"]
        side_effects: []
      - from: RECONCILING
        to: CLOSED
        trigger: "POST /plant/cut-lists/{id}/reconcile"
        actor: ProductionPlanner
        preconditions: ["cut list status == RECONCILING"]
        side_effects: ["every PENDING line -> SCRAPPED (no lot impact; reservations already RELEASED)", "every CUT line -> SCRAPPED; for each, scrapped_bf += line.required_board_feet on the lot(s) of its CONSUMED reservations in reservation created_at ASC order, decrementing consumed_bf by the same amount (conservation invariant)", "Job posture recomputed"]
      - from: RELEASED
        to: SUPERSEDED
        trigger: "system: job cancel cascade"
        actor: system
        preconditions: ["job cancelled"]
        side_effects: ["reservations on this list -> RELEASED (lots restored)"]
      - from: EXPLODED
        to: SUPERSEDED
        trigger: "system: job cancel cascade"
        actor: system
        preconditions: ["job cancelled"]
        side_effects: []
      - from: RECONCILING
        to: SUPERSEDED
        trigger: "system: job cancel cascade"
        actor: system
        preconditions: ["job cancelled"]
        side_effects: ["reservations on this list -> RELEASED (lots restored)"]

  - entity: CutListLine
    initial_state: PENDING
    terminal_states: [SCRAPPED]
    transitions:
      - from: PENDING
        to: CUT
        trigger: "POST /plant/cut-list-lines/{id}/mark-cut"
        actor: ShopFloorLead
        preconditions: ["line status == PENDING", "some ProductionBatch referencing line's cut list is in CUTTING"]
        side_effects: []
      - from: PENDING
        to: SCRAPPED
        trigger: "POST /plant/cut-list-lines/{id}/scrap or system: reconcile / job cancel cascade"
        actor: ShopFloorLead
        preconditions: ["line status == PENDING"]
        side_effects: ["every RESERVED reservation on this line -> RELEASED; lot available_bf += reserved_bf, reserved_bf -= reserved_bf, lot.version increments"]
      - from: CUT
        to: SCRAPPED
        trigger: "POST /plant/cut-list-lines/{id}/scrap or system: reconcile"
        actor: ShopFloorLead
        preconditions: ["line status == CUT"]
        side_effects: ["for each CONSUMED reservation on this line in created_at ASC order until line.required_board_feet is covered: lot.consumed_bf -= covered amount, lot.scrapped_bf += covered amount, lot.version increments (board-foot conservation holds)"]

  - entity: InventoryLot
    initial_state: ACTIVE
    terminal_states: [DEPLETED]
    transitions:
      - from: ACTIVE
        to: QUARANTINED
        trigger: "POST /plant/inventory-lots/{id}/transition with to_state QUARANTINED"
        actor: InventoryManager
        preconditions: ["lot status == ACTIVE"]
        side_effects: ["lot.version increments by 1"]
      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /plant/inventory-lots/{id}/transition with to_state ACTIVE"
        actor: InventoryManager
        preconditions: ["lot status == QUARANTINED"]
        side_effects: ["lot.version increments by 1"]
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: available_bf == 0 and reserved_bf == 0 and available_plates == 0 and reserved_plates == 0 after any consume/release/adjust"
        actor: system
        preconditions: ["available_bf == 0", "reserved_bf == 0", "available_plates == 0", "reserved_plates == 0", "received_board_feet + received_plates > 0"]
        side_effects: []

  - entity: MaterialReservation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /plant/material-reservations/{id}/consume"
        actor: InventoryManager
        preconditions: ["reservation status == RESERVED", "lot status == ACTIVE"]
        side_effects: ["lot.reserved_bf -= reserved_bf, lot.consumed_bf += reserved_bf (or plate mirror)", "lot.version increments by 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /plant/material-reservations/{id}/release or system: scrap of PENDING line / change-order apply / job cancel"
        actor: InventoryManager
        preconditions: ["reservation status == RESERVED"]
        side_effects: ["lot.reserved_bf -= reserved_bf, lot.available_bf += reserved_bf (or plate mirror); compensating action of reserve: available restored exactly", "lot.version increments by 1"]

  - entity: CraneResource
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "POST /plant/cranes/{id}/transition with to_state OUT_OF_SERVICE"
        actor: PlantManager
        preconditions: ["crane status == ACTIVE"]
        side_effects: ["crane.version increments by 1"]
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "POST /plant/cranes/{id}/transition with to_state ACTIVE"
        actor: PlantManager
        preconditions: ["crane status == OUT_OF_SERVICE"]
        side_effects: ["crane.version increments by 1"]

  - entity: CraneSlot
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /plant/crane-slots/{id}/transition with to_state COMPLETED"
        actor: ProductionPlanner
        preconditions: ["slot status == BOOKED"]
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /plant/crane-slots/{id}/transition with to_state CANCELLED"
        actor: ProductionPlanner
        preconditions: ["slot status == BOOKED"]
        side_effects: ["frees the interval: later overlap checks ignore CANCELLED slots"]

  - entity: ProductionBatch
    initial_state: SCHEDULED
    terminal_states: [LOADED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CUTTING
        trigger: "POST /plant/batches/{id}/transition with to_state CUTTING"
        actor: ShopFloorLead
        preconditions: ["batch status == SCHEDULED", "cut list status == RELEASED", "cut list's design is current (SEALED, no newer SEALED revision of same component_ref)", "job status == IN_PRODUCTION", "coverage: every line of the cut list in PENDING status has sum of reserved_bf over its RESERVED reservations >= required_board_feet", "plate coverage: sum of reserved_plates over the cut list's RESERVED plate reservations >= cut list total_plates"]
        side_effects: ["every RESERVED lumber reservation on the cut list's lines -> CONSUMED (lot reserved_bf -> consumed_bf shifts, lot.version increments)", "every RESERVED plate reservation on the cut list -> CONSUMED"]
        note: "consumption is a side effect of entering CUTTING; mark-cut then records per-line completion"
      - from: CUTTING
        to: ASSEMBLY
        trigger: "POST /plant/batches/{id}/transition with to_state ASSEMBLY"
        actor: ShopFloorLead
        preconditions: ["batch status == CUTTING", "every line of the cut list in {CUT, SCRAPPED}"]
        side_effects: []
      - from: ASSEMBLY
        to: BUILT
        trigger: "POST /plant/batches/{id}/transition with to_state BUILT"
        actor: ShopFloorLead
        preconditions: ["batch status == ASSEMBLY"]
        side_effects: []
      - from: BUILT
        to: QC_PASSED
        trigger: "POST /plant/batches/{id}/transition with to_state QC_PASSED"
        actor: ShopFloorLead
        preconditions: ["batch status == BUILT"]
        side_effects: []
      - from: BUILT
        to: QC_FAILED
        trigger: "POST /plant/batches/{id}/transition with to_state QC_FAILED"
        actor: ShopFloorLead
        preconditions: ["batch status == BUILT"]
        side_effects: ["Job posture recomputed -> AT_RISK"]
      - from: QC_FAILED
        to: REWORK
        trigger: "POST /plant/batches/{id}/transition with to_state REWORK"
        actor: ShopFloorLead
        preconditions: ["batch status == QC_FAILED"]
        side_effects: []
      - from: REWORK
        to: QC_PASSED
        trigger: "POST /plant/batches/{id}/transition with to_state QC_PASSED"
        actor: ShopFloorLead
        preconditions: ["batch status == REWORK"]
        side_effects: ["Job posture recomputed"]
      - from: QC_PASSED
        to: STAGED
        trigger: "POST /plant/batches/{id}/transition with to_state STAGED"
        actor: ShopFloorLead
        preconditions: ["batch status == QC_PASSED", "at least one CraneSlot with production_batch_id == this batch, purpose BUILD_PICK, status COMPLETED exists"]
        side_effects: []
      - from: STAGED
        to: LOADED
        trigger: "system: owning DeliveryLoad reaches LOADING"
        actor: system
        preconditions: ["a PACKED bundle of that load references this batch"]
        side_effects: []
      - from: LOADED
        to: STAGED
        trigger: "system: owning DeliveryLoad DISPATCHED -> RETURNED (truck comes back; batch returns to staging)"
        actor: system
        preconditions: ["bundle of that load references this batch"]
        side_effects: ["Job posture recomputed"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: change-order apply or job cancel cascade"
        actor: system
        preconditions: ["batch not in {LOADED, CANCELLED}"]
        side_effects: ["build_sequence_no of surviving batches recomputed"]
      - from: CUTTING
        to: CANCELLED
        trigger: "system: change-order apply or job cancel cascade"
        actor: system
        preconditions: ["batch not in {LOADED, CANCELLED}"]
        side_effects: ["build_sequence_no of surviving batches recomputed"]
      - from: ASSEMBLY
        to: CANCELLED
        trigger: "system: change-order apply or job cancel cascade"
        actor: system
        preconditions: ["batch not in {LOADED, CANCELLED}"]
        side_effects: ["build_sequence_no of surviving batches recomputed"]
      - from: BUILT
        to: CANCELLED
        trigger: "system: change-order apply or job cancel cascade"
        actor: system
        preconditions: ["batch not in {LOADED, CANCELLED}"]
        side_effects: ["build_sequence_no of surviving batches recomputed"]
      - from: QC_PASSED
        to: CANCELLED
        trigger: "system: change-order apply or job cancel cascade"
        actor: system
        preconditions: ["batch not in {LOADED, CANCELLED}"]
        side_effects: ["build_sequence_no of surviving batches recomputed"]
      - from: QC_FAILED
        to: CANCELLED
        trigger: "system: change-order apply or job cancel cascade"
        actor: system
        preconditions: ["batch not in {LOADED, CANCELLED}"]
        side_effects: ["build_sequence_no of surviving batches recomputed"]
      - from: REWORK
        to: CANCELLED
        trigger: "system: change-order apply or job cancel cascade"
        actor: system
        preconditions: ["batch not in {LOADED, CANCELLED}"]
        side_effects: ["build_sequence_no of surviving batches recomputed"]
      - from: STAGED
        to: CANCELLED
        trigger: "system: change-order apply or job cancel cascade"
        actor: system
        preconditions: ["batch not in {LOADED, CANCELLED}"]
        side_effects: ["build_sequence_no of surviving batches recomputed"]

  - entity: DeliveryLoad
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: STAGED
        trigger: "POST /plant/loads/{id}/transition with to_state STAGED"
        actor: ShippingCoordinator
        preconditions: ["load status == PLANNED", "at least one bundle of this load in PACKED"]
        side_effects: ["staged_at := current logical clock (storage anchor)"]
      - from: STAGED
        to: LOADING
        trigger: "POST /plant/loads/{id}/transition with to_state LOADING"
        actor: ShippingCoordinator
        preconditions: ["load status == STAGED", "at least one CraneSlot with delivery_load_id == this load, purpose LOAD_PICK, status COMPLETED exists", "every non-SUPERSEDED bundle of this load in PACKED"]
        side_effects: ["every bundle of this load in PACKED -> LOADED", "every referenced ProductionBatch currently STAGED -> LOADED (batches already LOADED are untouched)"]
      - from: LOADING
        to: DISPATCHED
        trigger: "POST /plant/loads/{id}/transition with to_state DISPATCHED"
        actor: ShippingCoordinator
        preconditions: ["load status == LOADING", "temporal: scheduled_date within closed job delivery window AND current logical clock <= job.delivery_window_end", "fiscal: job's customer credit_hold == false AND customer.credit_used_cents + this load's provisional_freight_cents <= customer.credit_limit_cents"]
        side_effects: ["last_dispatched_at := current logical clock", "system: if job's first DISPATCHED load, Job IN_PRODUCTION -> SHIPPING", "Job posture recomputed"]
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /plant/loads/{id}/transition with to_state DELIVERED"
        actor: ShippingCoordinator
        preconditions: ["load status == DISPATCHED"]
        side_effects: ["every bundle of this load in LOADED -> DELIVERED"]
      - from: DISPATCHED
        to: RETURNED
        trigger: "POST /plant/loads/{id}/transition with to_state RETURNED"
        actor: ShippingCoordinator
        preconditions: ["load status == DISPATCHED"]
        side_effects: ["every bundle LOADED -> RETURNED", "every referenced ProductionBatch LOADED -> STAGED", "Job posture recomputed -> AT_RISK"]
      - from: RETURNED
        to: RESCHEDULED
        trigger: "POST /plant/loads/{id}/transition with to_state RESCHEDULED"
        actor: ShippingCoordinator
        preconditions: ["load status == RETURNED", "rescheduled_date provided in request", "rescheduled_date within closed job delivery window", "drops-per-day capacity on rescheduled_date not exceeded"]
        side_effects: ["scheduled_date := rescheduled_date", "Job posture recomputed"]
      - from: RESCHEDULED
        to: DISPATCHED
        trigger: "POST /plant/loads/{id}/transition with to_state DISPATCHED"
        actor: ShippingCoordinator
        preconditions: ["load status == RESCHEDULED", "same temporal and fiscal guards as LOADING -> DISPATCHED"]
        side_effects: ["last_dispatched_at := current logical clock (storage window extends to this latest dispatch)", "bundles in RETURNED -> LOADED", "referenced batches currently STAGED -> LOADED"]
      - from: DELIVERED
        to: CLAIM_HOLD
        trigger: "system: a DamageClaim is filed against a bundle of this load"
        actor: system
        preconditions: ["load status == DELIVERED"]
        side_effects: []
      - from: CLAIM_HOLD
        to: DELIVERED
        trigger: "system: every DamageClaim of this load reaches a terminal status {SETTLED, DENIED, VOID} without the load closing"
        actor: system
        preconditions: ["no claim of this load in {FILED, TRIAGED, APPROVED_REBUILD, APPROVED_CREDIT, REBUILD_IN_PROGRESS}"]
        side_effects: []
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /plant/loads/{id}/transition with to_state CLOSED carrying crane_hours_actual"
        actor: ShippingCoordinator
        preconditions: ["load status == DELIVERED", "crane_hours_actual provided"]
        side_effects: ["final_freight_cents and storage_fee_cents computed per calculations load_freight_final and storage_fee_accrual", "customer.credit_used_cents switches this load from provisional to final", "Job.invoiced_cents recomputed", "system: Job completion check"]
      - from: CLAIM_HOLD
        to: CLOSED
        trigger: "POST /plant/loads/{id}/transition with to_state CLOSED carrying crane_hours_actual"
        actor: ShippingCoordinator
        preconditions: ["load status == CLAIM_HOLD", "no claim of this load in {FILED, TRIAGED, APPROVED_REBUILD, APPROVED_CREDIT, REBUILD_IN_PROGRESS}", "crane_hours_actual provided"]
        side_effects: ["same as DELIVERED -> CLOSED"]
      - from: PLANNED
        to: CANCELLED
        trigger: "system: job cancel cascade"
        actor: system
        preconditions: ["job cancelled"]
        side_effects: ["bundles of this load in PACKED -> SUPERSEDED"]
      - from: STAGED
        to: CANCELLED
        trigger: "system: job cancel cascade"
        actor: system
        preconditions: ["job cancelled"]
        side_effects: ["bundles of this load in PACKED -> SUPERSEDED"]
      - from: LOADING
        to: CANCELLED
        trigger: "system: job cancel cascade"
        actor: system
        preconditions: ["job cancelled"]
        side_effects: ["bundles of this load in {PACKED, LOADED} -> SUPERSEDED"]

  - entity: Bundle
    initial_state: PACKED
    terminal_states: [DELIVERED, DAMAGED, SUPERSEDED]
    transitions:
      - from: PACKED
        to: LOADED
        trigger: "system: owning load reaches LOADING (or RESCHEDULED -> DISPATCHED from RETURNED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: LOADED
        trigger: "system: owning load RESCHEDULED -> DISPATCHED"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOADED
        to: DELIVERED
        trigger: "system: owning load DISPATCHED -> DELIVERED"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOADED
        to: RETURNED
        trigger: "system: owning load DISPATCHED -> RETURNED"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: DAMAGED
        trigger: "system: DamageClaim decided APPROVE_REBUILD against this bundle"
        actor: system
        preconditions: []
        side_effects: ["cascade hop 2 of claim rebuild: rebuild cut list clone + rebuild batch created"]
      - from: PACKED
        to: SUPERSEDED
        trigger: "system: change-order apply cancels the referenced batch, or job cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["owning load in {PLANNED, STAGED, LOADING} reopens to PLANNED", "load actual_total_weight_lbs recomputed excluding SUPERSEDED bundles"]

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [DENIED, SETTLED, VOID]
    transitions:
      - from: FILED
        to: TRIAGED
        trigger: "POST /plant/claims/{id}/triage"
        actor: ClaimsAdjuster
        preconditions: ["claim status == FILED"]
        side_effects: ["triaged_by := X-User-ID"]
      - from: TRIAGED
        to: APPROVED_REBUILD
        trigger: "POST /plant/claims/{id}/decide with decision APPROVE_REBUILD"
        actor: ClaimsAdjuster
        preconditions: ["claim status == TRIAGED", "decided_by (X-User-ID) != triaged_by (segregation of duties)", "damage_pct provided, 0 < damage_pct <= 1"]
        side_effects: ["approved_cap_cents computed per claim_assessment_cap", "decided_by := X-User-ID", "bundle DELIVERED -> DAMAGED", "cascade: system clones the damaged bundle's batch's cut list (new CutList EXPLODED with fresh PENDING lines of identical specs, rebuild_for_claim_id := this claim) and creates a rebuild ProductionBatch (SCHEDULED, is_rebuild true, source_claim_id := this claim, same jig, requested_completion_at := current logical clock + 7 days); build_sequence_no recomputed", "claim continues to REBUILD_IN_PROGRESS immediately"]
      - from: APPROVED_REBUILD
        to: REBUILD_IN_PROGRESS
        trigger: "system: immediately after the decide cascade completes"
        actor: system
        preconditions: []
        side_effects: ["Job posture recomputed -> BLOCKED while unsettled"]
      - from: TRIAGED
        to: APPROVED_CREDIT
        trigger: "POST /plant/claims/{id}/decide with decision APPROVE_CREDIT"
        actor: ClaimsAdjuster
        preconditions: ["claim status == TRIAGED", "decided_by != triaged_by", "damage_pct provided, 0 < damage_pct <= 1"]
        side_effects: ["approved_cap_cents computed per claim_assessment_cap", "decided_by := X-User-ID", "bundle stays DELIVERED (credit-only, no rebuild)"]
      - from: TRIAGED
        to: DENIED
        trigger: "POST /plant/claims/{id}/decide with decision DENY"
        actor: ClaimsAdjuster
        preconditions: ["claim status == TRIAGED", "decided_by != triaged_by"]
        side_effects: ["decided_by := X-User-ID", "system: if no other open claim on the load, load CLAIM_HOLD -> DELIVERED"]
      - from: APPROVED_CREDIT
        to: SETTLED
        trigger: "POST /plant/claims/{id}/settle"
        actor: ClaimsAdjuster
        preconditions: ["claim status == APPROVED_CREDIT"]
        side_effects: ["waterfall buckets + residual_credit_cents computed per claim_settlement_waterfall", "Job.credit_issued_cents += residual_credit_cents", "system: if no other open claim on the load, load CLAIM_HOLD -> DELIVERED"]
      - from: REBUILD_IN_PROGRESS
        to: SETTLED
        trigger: "POST /plant/claims/{id}/settle"
        actor: ClaimsAdjuster
        preconditions: ["claim status == REBUILD_IN_PROGRESS", "the rebuild ProductionBatch (source_claim_id == this claim) is in {STAGED, LOADED}"]
        side_effects: ["waterfall buckets + residual_credit_cents computed", "Job.credit_issued_cents += residual_credit_cents", "Job posture recomputed", "system: if no other open claim on the load, load CLAIM_HOLD -> DELIVERED"]
      - from: FILED
        to: VOID
        trigger: "POST /plant/claims/{id}/void"
        actor: ClaimsAdjuster
        preconditions: ["claim status in {FILED, TRIAGED}"]
        side_effects: ["system: if no other open claim on the load, load CLAIM_HOLD -> DELIVERED"]
      - from: TRIAGED
        to: VOID
        trigger: "POST /plant/claims/{id}/void"
        actor: ClaimsAdjuster
        preconditions: ["claim status in {FILED, TRIAGED}"]
        side_effects: ["system: if no other open claim on the load, load CLAIM_HOLD -> DELIVERED"]
      - from: SETTLED
        to: VOID
        trigger: "POST /plant/claims/{id}/void (post-settlement reversal)"
        actor: ClaimsAdjuster
        preconditions: ["claim status == SETTLED"]
        side_effects: ["compensation: Job.credit_issued_cents -= residual_credit_cents (credit exactly reversed)", "Job posture recomputed"]

  - entity: DesignChangeOrder
    initial_state: REQUESTED
    terminal_states: [APPLIED, REJECTED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: IMPACT_ASSESSED
        trigger: "POST /plant/change-orders/{id}/assess"
        actor: ProductionPlanner
        preconditions: ["change order status == REQUESTED", "if new_design_id supplied at assess: it belongs to the same job, same component_ref as supersedes design, and its supersedes_design_id == this order's supersedes_design_id"]
        side_effects: ["impact_lines_scrapped := count of CUT lines across cut lists of supersedes_design_id", "impact_open_reservations := count of RESERVED reservations on those lists", "if new_design_id supplied, it is stored on the change order"]
      - from: IMPACT_ASSESSED
        to: APPROVED
        trigger: "POST /plant/change-orders/{id}/approve"
        actor: PlantManager
        preconditions: ["change order status == IMPACT_ASSESSED", "new_design_id is set", "new design status == SEALED", "new design revision_no > superseded design revision_no", "new design supersedes_design_id == supersedes_design_id (revision chain integrity)"]
        side_effects: ["Job posture recomputed -> BLOCKED until applied"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /plant/change-orders/{id}/reject"
        actor: PlantManager
        preconditions: ["change order status in {REQUESTED, IMPACT_ASSESSED}"]
        side_effects: []
      - from: IMPACT_ASSESSED
        to: REJECTED
        trigger: "POST /plant/change-orders/{id}/reject"
        actor: PlantManager
        preconditions: ["change order status in {REQUESTED, IMPACT_ASSESSED}"]
        side_effects: []
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /plant/change-orders/{id}/withdraw"
        actor: CustomerContact
        preconditions: ["change order status == REQUESTED", "X-User-ID == job.customer_id (ownership)"]
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: "POST /plant/change-orders/{id}/apply"
        actor: PlantManager
        preconditions: ["change order status == APPROVED", "new design still SEALED and current (ERR_DESIGN_NOT_CURRENT if a newer SEALED revision exists)"]
        side_effects:
          - "hop 1: supersedes design SEALED -> SUPERSEDED"
          - "hop 2: each cut list of the superseded design in EXPLODED -> SUPERSEDED; in RELEASED with zero CUT lines -> SUPERSEDED; in RELEASED with at least one CUT line -> RECONCILING"
          - "hop 3: every RESERVED MaterialReservation on PENDING lines (or plate-level) of those lists -> RELEASED; lot availability restored, lot.version increments"
          - "hop 4: every ProductionBatch referencing those cut lists in {SCHEDULED, CUTTING, ASSEMBLY, BUILT, QC_PASSED, QC_FAILED, REWORK, STAGED} -> CANCELLED; build_sequence_no recomputed"
          - "hop 5: every Bundle in PACKED referencing a CANCELLED batch -> SUPERSEDED; its DeliveryLoad in {PLANNED, STAGED, LOADING} reopens to PLANNED; load actual_total_weight_lbs recomputed"
          - "hop 6: Job posture recomputed -> BLOCKED while any cut list remains RECONCILING"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-lot
    parent_entity: InventoryLot
    write_endpoint: "POST /plant/material-reservations"
    occ_field: "expected_lot_version"
    description: |
      Creating a MaterialReservation against an InventoryLot whose version has
      advanced since the client last read it is rejected. This captures the case
      where another writer has just created a reservation (or consumed/released
      one) against the same lot, legitimately mutating available_bf/available_plates,
      and the current writer's view of remaining availability is therefore stale.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
  - rule_id: design-revision-stale-job
    parent_entity: Job
    write_endpoint: "POST /plant/jobs/{job_id}/designs"
    occ_field: "expected_job_version"
    description: |
      Creating a ComponentDesign revision against a Job whose version has advanced
      since the client last read it is rejected. A new revision legitimately
      coexists with (and is intended to supersede) the current sealed revision,
      so a sequential second create would otherwise succeed on a stale job view.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412
  - rule_id: change-order-stale-job
    parent_entity: Job
    write_endpoint: "POST /plant/jobs/{job_id}/change-orders"
    occ_field: "expected_job_version"
    description: |
      Creating a DesignChangeOrder against a Job whose version has advanced since
      the client last read it is rejected. A second change order against the same
      sealed design is a legitimate product operation, so the stale-view create
      would otherwise succeed; OCC on Job.version forces the writer to re-read.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412
  - rule_id: crane-slot-stale-crane
    parent_entity: CraneResource
    write_endpoint: "POST /plant/crane-slots"
    occ_field: "expected_crane_version"
    description: |
      Booking a CraneSlot against a CraneResource whose version has advanced since
      the client last read it is rejected. A non-overlapping slot would legitimately
      succeed on the updated crane, so the stale-view booking is rejected purely on
      the OCC version, never on wall-clock ordering.
    error_id: ERR_STALE_CRANE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_lumber_requirement
    description: "Per-line board feet and waste-adjusted requirement at cut-list explosion"
    trigger: "POST /plant/designs/{design_id}/cut-lists (explosion); also recomputed for the rebuild clone at claim decide"
    algorithm: aggregation
    formula: |
      For each input line (member_label, dimension, length_ft, qty):
        line_board_feet      = round(qty * length_ft * BF_PER_FT[dimension], 2)
        length_surcharge     = 0.04 if length_ft >= 20 else (0.02 if length_ft >= 16 else 0)
        waste_pct            = min(BASE_WASTE[design.lumber_grade] + length_surcharge, WASTE_CAP)
        required_board_feet  = round(line_board_feet * (1 + waste_pct), 2)
      Inputs interact non-linearly: grade selects the base rate, length selects a
      tiered surcharge, and the cap clamps the sum (min), so the effect of length
      on waste depends on grade (SPF_NO2 at >= 20 ft hits the cap; MSR does not).
    input_set: "the lines[] array supplied at cut-list create; design.lumber_grade"
    constants:
      BF_PER_FT_L2X4: 0.6667
      BF_PER_FT_L2X6: 1.0
      BF_PER_FT_L2X8: 1.3333
      BASE_WASTE_SPF_NO2: 0.08
      BASE_WASTE_SPF_MSR2400: 0.05
      BASE_WASTE_SYP_NO1: 0.06
      LENGTH_SURCHARGE_16FT: 0.02
      LENGTH_SURCHARGE_20FT: 0.04
      WASTE_CAP: 0.11
    precision: "2 decimal places per intermediate line value, round_half_up"

  - name: cut_list_totals_rounding
    description: "Cut-list header totals with pinned rounding order"
    trigger: "POST /plant/designs/{design_id}/cut-lists; rebuild clone creation"
    algorithm: aggregation
    formula: |
      total_board_feet = sum over lines of required_board_feet
      where every required_board_feet is ALREADY rounded to 2 decimals per line
      (round_half_up). PINNED ORDER: round per line first, then sum the rounded
      values. Summing raw values then rounding once is FORBIDDEN and produces
      different totals (e.g. two lines of L2X4 8.0 ft qty 1 SPF_NO2 give
      5.76 + 5.76 = 11.52 pinned vs round(11.5128) = 11.51 naive).
      total_pieces = sum of qty (integer).
      total_plates  = design.quantity_required * PLATES_PER_UNIT[component_type].
    input_set: "all lines of the cut list regardless of status (statuses change later, totals do not)"
    constants:
      PLATES_PER_UNIT_FLOOR_TRUSS: 24
      PLATES_PER_UNIT_ROOF_TRUSS: 28
      PLATES_PER_UNIT_WALL_PANEL: 12
    precision: "2 decimal places, round_half_up, per-line-then-sum"

  - name: load_freight_provisional
    description: "Provisional freight quoted at load planning"
    trigger: "POST /plant/jobs/{job_id}/loads (load create)"
    algorithm: forward_looking
    formula: |
      provisional_freight_cents =
          FREIGHT_BASE_CENTS
        + round_half_up(planned_weight_est_lbs * PROVISIONAL_CENTS_PER_LB)
        + (job.crane_required_at_jobsite ? JOBSITE_CRANE_FLAT_CENTS : 0)
      Uses the planner's ESTIMATE, never measured bundle weights.
    input_set: "the new DeliveryLoad (planned_weight_est_lbs) and its Job (crane_required_at_jobsite)"
    constants:
      FREIGHT_BASE_CENTS: 50000
      PROVISIONAL_CENTS_PER_LB: 12
      JOBSITE_CRANE_FLAT_CENTS: 25000
    precision: "integer cents"
    variants:
      - name: final
        when: "load reaches CLOSED; see load_freight_final"
        difference: "final uses measured bundle weights, actual crane hours on the booked crane, an overweight surcharge tier, and accrued storage; identical planning data yields a different number (e.g. planned est 10000 lbs -> provisional 170000, actual 20160 lbs with crane and storage -> 479800)"

  - name: load_freight_final
    description: "Final freight settled at load close; pinned evaluation order"
    trigger: "POST /plant/loads/{id}/transition with to_state CLOSED"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (each step feeds the next; reordering changes the result):
        (1) actual_total_weight_lbs = sum of weight_lbs over bundles in
            {PACKED, LOADED, DELIVERED, RETURNED, DAMAGED} — SUPERSEDED bundles excluded
            (a change-order apply between staging and close therefore changes this base);
        (2) crane = the crane of this load's earliest start_at BOOKED/COMPLETED LOAD_PICK
            slot (tie-break: slot created_at ASC);
            crane_cost_cents = round_half_up(crane_hours_actual * crane.hourly_rate_cents);
        (3) weight_surcharge_cents = max(0, actual_total_weight_lbs - OVERWEIGHT_THRESHOLD_LBS)
            * OVERWEIGHT_CENTS_PER_LB   (strictly greater than the threshold triggers; exactly
            20000 lbs pays 0);
        (4) storage_fee_cents per storage_fee_accrual;
        (5) final_freight_cents = FREIGHT_BASE_CENTS
            + round_half_up(actual_total_weight_lbs * PROVISIONAL_CENTS_PER_LB)
            + weight_surcharge_cents + crane_cost_cents + storage_fee_cents.
      The surcharge tier is keyed on the POST-supersede measured weight (step 1), not on
      planned_weight_est_lbs and not on a weight snapshot taken at staging — an
      implementation using either of those produces a different tier decision.
    input_set: "the DeliveryLoad being closed, its non-SUPERSEDED bundles, its earliest BOOKED/COMPLETED LOAD_PICK slot's crane, its job's customer storage terms"
    constants:
      FREIGHT_BASE_CENTS: 50000
      PROVISIONAL_CENTS_PER_LB: 12
      OVERWEIGHT_THRESHOLD_LBS: 20000
      OVERWEIGHT_CENTS_PER_LB: 18
    precision: "integer cents; crane cost round_half_up to cents"
    variants:
      - name: provisional
        when: "load create; see load_freight_provisional"
        difference: "provisional ignores crane hours, surcharge tier, and storage entirely"

  - name: storage_fee_accrual
    description: "Plant-side storage fee accrued between staging and last dispatch"
    trigger: "POST /plant/loads/{id}/transition with to_state CLOSED"
    algorithm: threshold
    formula: |
      days_stored          = whole calendar days between staged_at (date part, UTC)
                             and last_dispatched_at (date part, UTC)
      billable_days        = max(0, days_stored - customer.storage_free_days)
      storage_fee_cents    = min(billable_days * customer.storage_daily_fee_cents,
                                 customer.storage_fee_cap_cents)
      Boundary: days_stored == storage_free_days exactly -> billable 0 -> fee 0;
      days_stored == storage_free_days + 1 -> exactly one daily fee.
      A RETURNED -> RESCHEDULED -> DISPATCHED loop extends days_stored because
      last_dispatched_at is the LATEST dispatch.
    input_set: "the DeliveryLoad being closed (staged_at, last_dispatched_at) and its job's customer (storage terms)"
    constants: {}
    precision: "integer cents; whole-day arithmetic, no partial days"

  - name: build_sequence_ordering
    description: "Deterministic build sequence per job"
    trigger: "ProductionBatch create; any batch of the job reaching CANCELLED"
    algorithm: topological
    formula: |
      Candidate set: the job's ProductionBatches NOT in {CANCELLED, LOADED}.
      Sort key, applied in order:
        (a) requested_completion_at ASC (primary);
        (b) within a group of exactly-equal requested_completion_at values, greedy
            changeover minimization: repeatedly pick the remaining batch whose jig
            minimizes CHANGEOVER(prev_jig -> candidate jig) where
            CHANGEOVER = target jig's changeover_minutes_from[prev jig's setup_code],
            defaulting to DEFAULT_CHANGEOVER_MINUTES when the entry is missing and 0
            when prev setup_code == candidate setup_code; the group anchor (no prev)
            is the earliest created_at;
        (c) tie-break inside equal changeover: created_at ASC.
      build_sequence_no = 1..N over the ordered candidate set; recomputed on every
      create/cancel so later inserts shift successors.
      CANCELLED/LOADED batches leave the candidate set; survivors are renumbered.
    input_set: "all ProductionBatches of the job with status not in {CANCELLED, LOADED}"
    constants:
      DEFAULT_CHANGEOVER_MINUTES: 60
    precision: "integer sequence numbers"

  - name: claim_assessment_cap
    description: "Approved cap for a damage claim at decide time"
    trigger: "POST /plant/claims/{id}/decide with decision APPROVE_REBUILD or APPROVE_CREDIT"
    algorithm: threshold
    formula: |
      component_value_cents = round_half_up(
          damaged_bundle.production_batch.cut_list.total_board_feet * COMPONENT_VALUE_CENTS_PER_BF)
      approved_cap_cents    = min(claimed_amount_cents,
                                  round_half_up(damage_pct * component_value_cents))
      Same formula for every claim_type.
    input_set: "the claim (claimed_amount_cents, damage_pct), the damaged bundle's batch's cut list total_board_feet"
    constants:
      COMPONENT_VALUE_CENTS_PER_BF: 850
    precision: "integer cents, round_half_up"
    variants:
      - name: settlement
        when: "claim settle; see claim_settlement_waterfall"
        difference: "the cap is an estimate ceiling at decide; the settlement distributes the cap across actual cost buckets and issues only the residual as credit — same claim, different numbers (e.g. cap 50661 with actuals 20000/15000/5000 -> residual credit 10661)"

  - name: claim_settlement_waterfall
    description: "Waterfall distribution of the approved cap across actual rebuild costs"
    trigger: "POST /plant/claims/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      remaining = approved_cap_cents
      rebuild_material_cents = min(input rebuild_material_actual_cents, remaining); remaining -= it
      rebuild_labor_cents    = min(input rebuild_labor_actual_cents, remaining);    remaining -= it
      redelivery_cents       = min(input redelivery_actual_cents, remaining);       remaining -= it
      residual_credit_cents  = remaining
      CONSERVATION: rebuild_material_cents + rebuild_labor_cents + redelivery_cents
                    + residual_credit_cents == approved_cap_cents (exactly, integer cents).
      Job.credit_issued_cents += residual_credit_cents at settle and -= the same amount
      if the settled claim is later voided (compensating pair leaves credit unchanged).
    input_set: "the claim (approved_cap_cents) and the settle request's three actual amounts"
    constants: {}
    precision: "integer cents"

  - name: crane_slot_feasibility
    description: "Buffered half-open interval check for crane bookings"
    trigger: "POST /plant/crane-slots"
    algorithm: interval_merge
    formula: |
      Slots occupy half-open intervals [start_at, end_at) on one crane with a
      mandatory buffer. A new slot S is rejected (ERR_CRANE_SLOT_OVERLAP) unless for
      EVERY existing slot E on the same crane with status in {BOOKED, COMPLETED}:
          S.start_at >= E.end_at + CRANE_BUFFER_MINUTES
       OR S.end_at   <= E.start_at - CRANE_BUFFER_MINUTES
      Exactly CRANE_BUFFER_MINUTES of gap is allowed (>=, not >): a slot starting
      exactly 30 minutes after E.end_at is accepted; 29 minutes is rejected.
      CANCELLED slots occupy nothing.
    input_set: "all CraneSlots of the same crane with status in {BOOKED, COMPLETED}"
    constants:
      CRANE_BUFFER_MINUTES: 30
    precision: "minute-precision datetimes"

  - name: job_posture_derivation
    description: "Compound aggregate posture on Job, recomputed on every child mutation and read"
    trigger: "any mutation of Job's children (designs, cut lists, batches, loads, claims, change orders) or of the job's customer credit_hold; computed on every Job read"
    algorithm: aggregation
    formula: |
      posture = BLOCKED if any of:
          customer.credit_hold == true
          OR exists DesignChangeOrder of job with status == APPROVED
          OR exists CutList of job with status == RECONCILING
          OR exists DamageClaim on any load of job with status in {APPROVED_REBUILD, REBUILD_IN_PROGRESS}
      else AT_RISK if any of:
          exists ProductionBatch of job with status in {QC_FAILED, REWORK}
          OR exists DeliveryLoad of job with status == RETURNED
          OR exists ComponentDesign of job with status == SEAL_REQUESTED
      else GREEN.
      Priority order is BLOCKED > AT_RISK > GREEN; the first matching tier wins.
    input_set: "the job's customer, change orders, cut lists, batches, loads, claims (status fields only)"
    constants: {}
    precision: "enum"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role; for entity_backed roles X-User-ID references an existing instance of the backing entity", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ownership scope: CustomerContact may only create/read resources whose owning customer_id == X-User-ID (job create body customer_id, claim file target job's customer, change-order withdraw, job/design/load/claim reads)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "POST /plant/jobs, POST /plant/loads/{id}/claims, POST /plant/change-orders/{id}/withdraw, GET endpoints touched by CustomerContact" }
  - { priority: 4, category: existence, check: "every path id and every body FK references an existing resource, validated left-to-right (path template order, then body fields in declared input order)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "request schema: all required input fields present, types match, enum values within declared sets, conditional requirements met (lumber fields iff lot_kind LUMBER; plate fields iff PLATE; rescheduled_date iff to_state RESCHEDULED; crane_hours_actual iff to_state CLOSED; damage_pct iff decision != DENY; exactly one of cut_list_line_id / cut_list_id on reservations)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "optimistic concurrency: expected_job_version / expected_lot_version / expected_crane_version must equal the parent entity current version", error_id: "ERR_STALE_JOB_VERSION | ERR_STALE_LOT_VERSION | ERR_STALE_CRANE_VERSION", http_status: 412, applies_to: "POST /plant/jobs/{job_id}/designs, POST /plant/jobs/{job_id}/change-orders, POST /plant/material-reservations, POST /plant/crane-slots" }
  - { priority: 7, category: state, check: "generic transition guard: the entity's current status has a declared transition to the requested to_state (batches, loads, lots, cranes, slots, designs)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all */transition endpoints" }
  - { priority: 8, category: state, check: "design seal path: to_state SEALED requires current status SEAL_REQUESTED", error_id: ERR_DESIGN_NOT_AWAITING_SEAL, http_status: 409, applies_to: "POST /plant/designs/{id}/transition" }
  - { priority: 9, category: state, check: "cut list release requires status EXPLODED; batch CUTTING requires cut list RELEASED", error_id: ERR_CUT_LIST_NOT_RELEASED, http_status: 409, applies_to: "POST /plant/cut-lists/{id}/release, POST /plant/batches/{id}/transition, POST /plant/jobs/{job_id}/batches" }
  - { priority: 10, category: state, check: "reconcile requires cut list status RECONCILING", error_id: ERR_CUT_LIST_NOT_RECONCILING, http_status: 409, applies_to: "POST /plant/cut-lists/{id}/reconcile" }
  - { priority: 11, category: state, check: "batch transition guards including: STAGED->LOADED and any ->CANCELLED are system-only (direct request rejected)", error_id: ERR_BATCH_INVALID_TRANSITION, http_status: 409, applies_to: "POST /plant/batches/{id}/transition" }
  - { priority: 12, category: state, check: "load transition guards per DeliveryLoad machine (e.g. STAGED requires >= 1 PACKED bundle; LOADING requires a COMPLETED LOAD_PICK slot)", error_id: ERR_LOAD_INVALID_TRANSITION, http_status: 409, applies_to: "POST /plant/loads/{id}/transition" }
  - { priority: 13, category: state, check: "claim action guards per DamageClaim machine (triage from FILED, decide from TRIAGED, settle from APPROVED_CREDIT or REBUILD_IN_PROGRESS, void from FILED/TRIAGED/SETTLED)", error_id: ERR_CLAIM_INVALID_TRANSITION, http_status: 409, applies_to: "POST /plant/claims/{id}/triage, POST /plant/claims/{id}/decide, POST /plant/claims/{id}/settle, POST /plant/claims/{id}/void" }
  - { priority: 14, category: state, check: "change-order action guards per DesignChangeOrder machine (assess from REQUESTED, approve from IMPACT_ASSESSED, apply from APPROVED, reject from REQUESTED/IMPACT_ASSESSED, withdraw from REQUESTED)", error_id: ERR_CHANGE_ORDER_INVALID_TRANSITION, http_status: 409, applies_to: "POST /plant/change-orders/{id}/assess, /approve, /reject, /apply, /withdraw" }
  - { priority: 15, category: business_safety, check: "sealing engineer license_expiry >= current logical clock (equal is valid)", error_id: ERR_ENGINEER_LICENSE_EXPIRED, http_status: 422, applies_to: "POST /plant/designs/{id}/transition (to_state SEALED)" }
  - { priority: 16, category: business_safety, check: "sealing engineer license_state == job.jobsite_state", error_id: ERR_ENGINEER_LICENSE_STATE_MISMATCH, http_status: 422, applies_to: "POST /plant/designs/{id}/transition (to_state SEALED)" }
  - { priority: 17, category: business_safety, check: "WALL_PANEL designs require sealing engineer seal_authority == TRUSS_AND_PANEL", error_id: ERR_SEAL_AUTHORITY_INSUFFICIENT, http_status: 422, applies_to: "POST /plant/designs/{id}/transition (to_state SEALED)" }
  - { priority: 18, category: business_safety, check: "segregation of duties: sealing engineer id != submitted_by_engineer_id", error_id: ERR_SEALER_MUST_DIFFER_FROM_SUBMITTER, http_status: 422, applies_to: "POST /plant/designs/{id}/transition (to_state SEALED)" }
  - { priority: 19, category: business_safety, check: "segregation of duties: claim decided_by != triaged_by", error_id: ERR_CLAIM_DECIDER_MUST_DIFFER, http_status: 422, applies_to: "POST /plant/claims/{id}/decide" }
  - { priority: 20, category: business_safety, check: "seal governance: cut-list create, cut-list release, batch CUTTING, and change-order apply all require the referenced design to be SEALED and current — no SEALED design of the same (job_id, component_ref) with a higher revision_no and not SUPERSEDED", error_id: ERR_DESIGN_NOT_CURRENT, http_status: 409, applies_to: "POST /plant/designs/{design_id}/cut-lists, POST /plant/cut-lists/{id}/release, POST /plant/batches/{id}/transition, POST /plant/change-orders/{id}/apply" }
  - { priority: 21, category: business_constraint, check: "crane slot feasibility per crane_slot_feasibility (buffered half-open intervals, CANCELLED ignored)", error_id: ERR_CRANE_SLOT_OVERLAP, http_status: 409, applies_to: "POST /plant/crane-slots" }
  - { priority: 22, category: business_constraint, check: "crane for a new slot must be ACTIVE", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /plant/crane-slots" }
  - { priority: 23, category: business_constraint, check: "bundle weight_lbs <= capacity_lbs of the crane on the load's earliest-start BOOKED/COMPLETED LOAD_PICK slot (equal is allowed)", error_id: ERR_BUNDLE_OVERWEIGHT, http_status: 422, applies_to: "POST /plant/loads/{load_id}/bundles" }
  - { priority: 24, category: business_constraint, check: "stack_position unique among non-SUPERSEDED bundles of the same load", error_id: ERR_STACK_POSITION_CONFLICT, http_status: 409, applies_to: "POST /plant/loads/{load_id}/bundles" }
  - { priority: 26, category: business_constraint, check: "reservation availability: reserved_bf <= lot.available_bf (lumber) or reserved_plates <= lot.available_plates (plate); lot must be ACTIVE", error_id: ERR_INSUFFICIENT_INVENTORY, http_status: 422, applies_to: "POST /plant/material-reservations" }
  - { priority: 25, category: business_constraint, check: "reservation kind/target match: LUMBER lot requires cut_list_line_id and reserved_bf > 0 with reserved_plates == 0; PLATE lot requires cut_list_id and reserved_plates > 0 with reserved_bf == 0; lumber lot dimension and grade must equal the line's cut list design's dimension(lumber_dimension)/lumber_grade; plate lot plate_class must equal design.plating", error_id: ERR_RESERVATION_KIND_MISMATCH, http_status: 422, applies_to: "POST /plant/material-reservations" }
  - { priority: 27, category: business_constraint, check: "jig compatibility: jig_setup component_type_supported == design component_type (cut-list create and batch create)", error_id: ERR_JIG_COMPONENT_MISMATCH, http_status: 422, applies_to: "POST /plant/designs/{design_id}/cut-lists, POST /plant/jobs/{job_id}/batches" }
  - { priority: 28, category: business_constraint, check: "component_ref discipline: creating a design whose (job_id, component_ref) already has a DRAFT or SEAL_REQUESTED design, or has a SEALED design while supersedes_design_id is absent/wrong", error_id: ERR_DUPLICATE_COMPONENT_REF, http_status: 409, applies_to: "POST /plant/jobs/{job_id}/designs" }
  - { priority: 29, category: business_constraint, check: "revision chain integrity: supersedes_design_id provided but no SEALED design exists for that component_ref, or change-order new design's supersedes_design_id != order's supersedes_design_id, or new design revision_no <= superseded revision_no", error_id: ERR_REVISION_CHAIN_BROKEN, http_status: 422, applies_to: "POST /plant/jobs/{job_id}/designs, POST /plant/change-orders/{id}/assess, POST /plant/change-orders/{id}/approve" }
  - { priority: 30, category: business_constraint, check: "batch CUTTING coverage: every PENDING line's RESERVED lumber reservations sum >= required_board_feet and RESERVED plate reservations on the list sum >= total_plates", error_id: ERR_RESERVATION_COVERAGE_SHORT, http_status: 422, applies_to: "POST /plant/batches/{id}/transition" }
  - { priority: 31, category: business_temporal, check: "load create/reschedule: scheduled_date inside closed job window [delivery_window_start, delivery_window_end]; dispatch: scheduled_date inside window AND current clock <= delivery_window_end", error_id: ERR_OUTSIDE_DELIVERY_WINDOW, http_status: 422, applies_to: "POST /plant/jobs/{job_id}/loads, POST /plant/loads/{id}/transition" }
  - { priority: 32, category: business_temporal, check: "drops-per-day: count of the job's loads sharing scheduled_date with status not in {CANCELLED} must be < customer.max_drops_per_day before adding this one (aggregate capacity, not pairwise overlap)", error_id: ERR_DROPS_PER_DAY_EXCEEDED, http_status: 422, applies_to: "POST /plant/jobs/{job_id}/loads, POST /plant/loads/{id}/transition (RESCHEDULED)" }
  - { priority: 33, category: business_temporal, check: "crane slot start_at >= current logical clock", error_id: ERR_SLOT_IN_PAST, http_status: 422, applies_to: "POST /plant/crane-slots" }
  - { priority: 34, category: business_referential, check: "bundle's batch belongs to the same job as the load; bundle create requires load status in {PLANNED, STAGED, LOADING} and a BOOKED/COMPLETED LOAD_PICK slot to exist (weight guard reference)", error_id: ERR_BUNDLE_JOB_MISMATCH, http_status: 422, applies_to: "POST /plant/loads/{load_id}/bundles" }
  - { priority: 35, category: business_referential, check: "claim's bundle_id belongs to the claim's load", error_id: ERR_CLAIM_BUNDLE_NOT_IN_LOAD, http_status: 422, applies_to: "POST /plant/loads/{load_id}/claims" }
  - { priority: 36, category: business_referential, check: "change-order assess/approve new design belongs to same job and same component_ref as the superseded design", error_id: ERR_REVISION_CHAIN_BROKEN, http_status: 422, applies_to: "POST /plant/change-orders/{id}/assess, POST /plant/change-orders/{id}/approve" }
  - { priority: 37, category: business_fiscal, check: "dispatch fiscal gate: customer credit_hold == false (checked after temporal gates)", error_id: ERR_CREDIT_HOLD, http_status: 402, applies_to: "POST /plant/loads/{id}/transition (to_state DISPATCHED)" }
  - { priority: 38, category: business_fiscal, check: "load create and dispatch: customer.credit_used_cents + this load's provisional_freight_cents <= credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /plant/jobs/{job_id}/loads, POST /plant/loads/{id}/transition (to_state DISPATCHED)" }

# =============================================================================
# §1.5 API Endpoint Table
# (ALL_ROLES = the eight declared roles; INTERNAL = all except CustomerContact)
# =============================================================================
endpoints:
  # --- CustomerAccount ---
  - { method: POST, path: "/plant/customer-accounts", description: "Create a customer account", roles: [PlantManager], code: 201, input: [company_name, credit_limit_cents, delivery_terms, "credit_hold?", "storage_free_days?", "storage_daily_fee_cents?", "storage_fee_cap_cents?", "max_drops_per_day?"], output: CustomerAccount, side_effects: [] }
  - { method: GET, path: "/plant/customer-accounts/{id}", description: "Read one customer account", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: [], output: CustomerAccount, side_effects: [] }
  - { method: GET, path: "/plant/customer-accounts", description: "List customer accounts; default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["credit_hold?", "limit?", "offset?"], output: "CustomerAccount[]", side_effects: [] }
  - { method: PATCH, path: "/plant/customer-accounts/{id}", description: "Update credit/storage terms; setting credit_hold true flips all of the customer's jobs to posture BLOCKED", roles: [PlantManager], code: 200, input: ["credit_hold?", "credit_limit_cents?", "storage_free_days?", "storage_daily_fee_cents?", "storage_fee_cap_cents?", "max_drops_per_day?"], output: CustomerAccount, side_effects: ["Job posture recomputed for every job of this customer"] }
  # --- Engineer ---
  - { method: POST, path: "/plant/engineers", description: "Register an engineer of record", roles: [PlantManager], code: 201, input: [full_name, license_number, license_state, license_expiry, seal_authority], output: Engineer, side_effects: [] }
  - { method: GET, path: "/plant/engineers/{id}", description: "Read one engineer", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: Engineer, side_effects: [] }
  - { method: GET, path: "/plant/engineers", description: "List engineers; default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["license_state?", "limit?", "offset?"], output: "Engineer[]", side_effects: [] }
  # --- Job ---
  - { method: POST, path: "/plant/jobs", description: "Create a job; CustomerContact creators must pass their own customer_id", roles: [CustomerContact, PlantManager], code: 201, input: [customer_id, job_name, jobsite_address, jobsite_state, delivery_window_start, delivery_window_end, contracted_value_cents, "crane_required_at_jobsite?"], output: Job, side_effects: [] }
  - { method: GET, path: "/plant/jobs/{id}", description: "Read one job including derived posture", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: [], output: Job, side_effects: ["posture recomputed on read"] }
  - { method: GET, path: "/plant/jobs", description: "List jobs with filters; default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: ["customer_id?", "status?", "posture?", "limit?", "offset?"], output: "Job[]", side_effects: [] }
  - { method: POST, path: "/plant/jobs/{id}/confirm", description: "QUOTED -> CONFIRMED", roles: [PlantManager], code: 200, input: [], output: Job, side_effects: ["Job.version increments by 1"] }
  - { method: POST, path: "/plant/jobs/{id}/cancel", description: "Cancel a job with the full down-cascade (loads, batches, cut lists, reservations)", roles: [PlantManager], code: 200, input: [], output: Job, side_effects: ["cascade per Job state machine", "Job.version increments by 1"] }
  # --- ComponentDesign ---
  - { method: POST, path: "/plant/jobs/{job_id}/designs", description: "Create a design (or revision when supersedes_design_id given); OCC-guarded on Job.version", roles: [DesignEngineer], code: 201, input: [component_ref, component_type, span_ft, pitch_degrees, design_load_psf, lumber_grade, plating, quantity_required, expected_job_version, "supersedes_design_id?"], output: ComponentDesign, side_effects: ["Job.version increments by 1", "Job posture recomputed"] }
  - { method: GET, path: "/plant/designs/{id}", description: "Read one design", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: [], output: ComponentDesign, side_effects: [] }
  - { method: GET, path: "/plant/designs", description: "List designs (reverse-reachability for job_id, supersedes_design_id, submitted_by_engineer_id, sealed_by_engineer_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: ["job_id?", "supersedes_design_id?", "submitted_by_engineer_id?", "sealed_by_engineer_id?", "status?", "component_ref?", "limit?", "offset?"], output: "ComponentDesign[]", side_effects: [] }
  - { method: POST, path: "/plant/designs/{id}/transition", description: "Design lifecycle: DRAFT->SEAL_REQUESTED->SEALED, reject back to DRAFT, DRAFT->VOID; seal runs license/state/authority/segregation safety gates", roles: [DesignEngineer], code: 200, input: [to_state], output: ComponentDesign, side_effects: ["on SEALED: sealed_by_engineer_id, sealed_at set; Job posture recomputed"] }
  # --- CutList / CutListLine ---
  - { method: POST, path: "/plant/designs/{design_id}/cut-lists", description: "Explode a sealed current design into a cut list; creates CutListLine children from the lines array; runs line_lumber_requirement and cut_list_totals_rounding", roles: [ProductionPlanner], code: 201, input: [jig_setup_id, lines], output: CutList, side_effects: ["CutListLine children created (status PENDING)", "totals computed"] }
  - { method: GET, path: "/plant/cut-lists/{id}", description: "Read one cut list", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: CutList, side_effects: [] }
  - { method: GET, path: "/plant/cut-lists", description: "List cut lists (reverse-reachability for design_id, job_id, jig_setup_id, rebuild_for_claim_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["design_id?", "job_id?", "jig_setup_id?", "rebuild_for_claim_id?", "status?", "limit?", "offset?"], output: "CutList[]", side_effects: [] }
  - { method: POST, path: "/plant/cut-lists/{id}/release", description: "EXPLODED -> RELEASED; requires design current; first release moves job to IN_PRODUCTION", roles: [ProductionPlanner], code: 200, input: [], output: CutList, side_effects: ["Job CONFIRMED -> IN_PRODUCTION on first release", "Job posture recomputed"] }
  - { method: POST, path: "/plant/cut-lists/{id}/reconcile", description: "RECONCILING -> CLOSED; scraps PENDING and CUT lines with waste accrual per CutListLine machine", roles: [ProductionPlanner], code: 200, input: [], output: CutList, side_effects: ["lines -> SCRAPPED", "scrapped_bf accrual on consumed lots (created_at ASC)", "Job posture recomputed"] }
  - { method: GET, path: "/plant/cut-list-lines", description: "List cut list lines (reverse-reachability for cut_list_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["cut_list_id?", "status?", "dimension?", "limit?", "offset?"], output: "CutListLine[]", side_effects: [] }
  - { method: GET, path: "/plant/cut-list-lines/{id}", description: "Read one cut list line", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: CutListLine, side_effects: [] }
  - { method: POST, path: "/plant/cut-list-lines/{id}/mark-cut", description: "PENDING -> CUT; requires a batch of the line's cut list in CUTTING", roles: [ShopFloorLead], code: 200, input: [], output: CutListLine, side_effects: [] }
  - { method: POST, path: "/plant/cut-list-lines/{id}/scrap", description: "PENDING|CUT -> SCRAPPED; PENDING scrap releases reservations, CUT scrap moves consumed_bf -> scrapped_bf", roles: [ShopFloorLead], code: 200, input: [], output: CutListLine, side_effects: ["reservation release or waste accrual per CutListLine machine", "lot.version increments on touched lots"] }
  # --- JigSetup ---
  - { method: POST, path: "/plant/jig-setups", description: "Create an immutable jig setup with its changeover matrix", roles: [PlantManager], code: 201, input: [setup_code, component_type_supported, plate_class, changeover_minutes_from], output: JigSetup, side_effects: [] }
  - { method: GET, path: "/plant/jig-setups/{id}", description: "Read one jig setup", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: JigSetup, side_effects: [] }
  - { method: GET, path: "/plant/jig-setups", description: "List jig setups; default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["component_type_supported?", "limit?", "offset?"], output: "JigSetup[]", side_effects: [] }
  # --- InventoryLot ---
  - { method: POST, path: "/plant/inventory-lots", description: "Receive a lumber or plate lot; availability fields initialize to received quantities", roles: [InventoryManager], code: 201, input: [lot_kind, "lumber_dimension?", "lumber_grade?", "plate_class?", "received_board_feet?", "received_plates?", "unit_cost_cents_per_bf?", "unit_cost_cents_per_plate?"], output: InventoryLot, side_effects: [] }
  - { method: GET, path: "/plant/inventory-lots/{id}", description: "Read one lot", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: InventoryLot, side_effects: [] }
  - { method: GET, path: "/plant/inventory-lots", description: "List lots; default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["lot_kind?", "status?", "lumber_dimension?", "lumber_grade?", "limit?", "offset?"], output: "InventoryLot[]", side_effects: [] }
  - { method: POST, path: "/plant/inventory-lots/{id}/adjust", description: "Manual availability/scrap adjustment (physical count corrections); conservation sum includes adjustments", roles: [InventoryManager], code: 200, input: [reason, "adjust_available_bf?", "adjust_scrapped_bf?", "adjust_available_plates?", "adjust_scrapped_plates?"], output: InventoryLot, side_effects: ["lot.version increments by 1", "DEPLETED re-check"] }
  - { method: POST, path: "/plant/inventory-lots/{id}/transition", description: "ACTIVE <-> QUARANTINED", roles: [InventoryManager], code: 200, input: [to_state], output: InventoryLot, side_effects: ["lot.version increments by 1"] }
  # --- MaterialReservation ---
  - { method: POST, path: "/plant/material-reservations", description: "Reserve lumber (against a line) or plates (against a list); OCC-guarded on InventoryLot.version", roles: [ProductionPlanner], code: 201, input: [lot_id, expected_lot_version, "cut_list_line_id?", "cut_list_id?", "reserved_bf?", "reserved_plates?"], output: MaterialReservation, side_effects: ["lot.available_bf/available_plates decremented, reserved_* incremented", "InventoryLot.version increments by 1"] }
  - { method: GET, path: "/plant/material-reservations", description: "List reservations (reverse-reachability for lot_id, cut_list_line_id, cut_list_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["lot_id?", "cut_list_line_id?", "cut_list_id?", "status?", "limit?", "offset?"], output: "MaterialReservation[]", side_effects: [] }
  - { method: GET, path: "/plant/material-reservations/{id}", description: "Read one reservation", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: MaterialReservation, side_effects: [] }
  - { method: POST, path: "/plant/material-reservations/{id}/consume", description: "RESERVED -> CONSUMED; reserved_* shifts to consumed_*", roles: [InventoryManager], code: 200, input: [], output: MaterialReservation, side_effects: ["lot fields shift", "lot.version increments by 1"] }
  - { method: POST, path: "/plant/material-reservations/{id}/release", description: "RESERVED -> RELEASED; compensating action of reserve — availability restored exactly", roles: [InventoryManager], code: 200, input: [], output: MaterialReservation, side_effects: ["lot reserved_* -> available_* restore", "lot.version increments by 1", "DEPLETED re-check"] }
  # --- CraneResource / CraneSlot ---
  - { method: POST, path: "/plant/cranes", description: "Register a plant crane", roles: [PlantManager], code: 201, input: [crane_code, capacity_lbs, crane_class, hourly_rate_cents], output: CraneResource, side_effects: [] }
  - { method: GET, path: "/plant/cranes/{id}", description: "Read one crane", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: CraneResource, side_effects: [] }
  - { method: GET, path: "/plant/cranes", description: "List cranes; default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["status?", "crane_class?", "limit?", "offset?"], output: "CraneResource[]", side_effects: [] }
  - { method: POST, path: "/plant/cranes/{id}/transition", description: "ACTIVE <-> OUT_OF_SERVICE", roles: [PlantManager], code: 200, input: [to_state], output: CraneResource, side_effects: ["crane.version increments by 1"] }
  - { method: POST, path: "/plant/crane-slots", description: "Book a buffered crane interval; OCC-guarded on CraneResource.version; overlap rule per crane_slot_feasibility", roles: [ProductionPlanner], code: 201, input: [crane_id, purpose, start_at, end_at, expected_crane_version, "production_batch_id?", "delivery_load_id?"], output: CraneSlot, side_effects: ["CraneResource.version increments by 1"] }
  - { method: GET, path: "/plant/crane-slots", description: "List crane slots (reverse-reachability for crane_id, production_batch_id, delivery_load_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["crane_id?", "production_batch_id?", "delivery_load_id?", "status?", "limit?", "offset?"], output: "CraneSlot[]", side_effects: [] }
  - { method: GET, path: "/plant/crane-slots/{id}", description: "Read one crane slot", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: CraneSlot, side_effects: [] }
  - { method: POST, path: "/plant/crane-slots/{id}/transition", description: "BOOKED -> COMPLETED | CANCELLED", roles: [ProductionPlanner], code: 200, input: [to_state], output: CraneSlot, side_effects: ["CANCELLED frees the interval for future overlap checks"] }
  # --- ProductionBatch ---
  - { method: POST, path: "/plant/jobs/{job_id}/batches", description: "Schedule a production batch off a RELEASED cut list; build_sequence_no assigned per build_sequence_ordering", roles: [ProductionPlanner], code: 201, input: [cut_list_id, jig_setup_id, requested_completion_at], output: ProductionBatch, side_effects: ["build_sequence_no recomputed for the job's non-terminal batches"] }
  - { method: GET, path: "/plant/batches/{id}", description: "Read one batch", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: ProductionBatch, side_effects: [] }
  - { method: GET, path: "/plant/batches", description: "List batches (reverse-reachability for job_id, cut_list_id, jig_setup_id, source_claim_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["job_id?", "cut_list_id?", "jig_setup_id?", "source_claim_id?", "status?", "limit?", "offset?"], output: "ProductionBatch[]", side_effects: [] }
  - { method: POST, path: "/plant/batches/{id}/transition", description: "Batch lifecycle incl. QC_FAIL/REWORK loop; STAGED->LOADED and ->CANCELLED are system-only", roles: [ShopFloorLead], code: 200, input: [to_state], output: ProductionBatch, side_effects: ["on CUTTING: covering reservations auto-CONSUMED", "on QC_FAILED/REWORK/QC_PASSED: Job posture recomputed"] }
  # --- DeliveryLoad / Bundle ---
  - { method: POST, path: "/plant/jobs/{job_id}/loads", description: "Plan a delivery load; computes provisional freight; checks closed delivery window, drops-per-day aggregate capacity, credit limit", roles: [ShippingCoordinator], code: 201, input: [scheduled_date, planned_weight_est_lbs], output: DeliveryLoad, side_effects: ["provisional_freight_cents computed", "customer.credit_used_cents includes the new provisional"] }
  - { method: GET, path: "/plant/loads/{id}", description: "Read one load", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: [], output: DeliveryLoad, side_effects: [] }
  - { method: GET, path: "/plant/loads", description: "List loads (reverse-reachability for job_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: ["job_id?", "status?", "scheduled_date?", "limit?", "offset?"], output: "DeliveryLoad[]", side_effects: [] }
  - { method: POST, path: "/plant/loads/{id}/transition", description: "Load lifecycle incl. RETURNED->RESCHEDULED->DISPATCHED re-delivery loop and CLOSED final-freight computation; conditional inputs rescheduled_date (RESCHEDULED) and crane_hours_actual (CLOSED)", roles: [ShippingCoordinator], code: 200, input: [to_state, "rescheduled_date?", "crane_hours_actual?"], output: DeliveryLoad, side_effects: ["per DeliveryLoad machine: bundle/batch cascades, storage anchor, final freight at CLOSED, job SHIPPING/COMPLETED checks"] }
  - { method: POST, path: "/plant/loads/{load_id}/bundles", description: "Add a bundle to the load's bundle map; weight checked against the booked load-pick crane capacity; stack_position unique per load", roles: [ShippingCoordinator], code: 201, input: [production_batch_id, stack_position, weight_lbs, "split_from_bundle_id?"], output: Bundle, side_effects: ["load actual_total_weight_lbs recomputed"] }
  - { method: GET, path: "/plant/bundles/{id}", description: "Read one bundle", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: [], output: Bundle, side_effects: [] }
  - { method: GET, path: "/plant/bundles", description: "List bundles (reverse-reachability for delivery_load_id, production_batch_id, split_from_bundle_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster], code: 200, input: ["delivery_load_id?", "production_batch_id?", "split_from_bundle_id?", "status?", "limit?", "offset?"], output: "Bundle[]", side_effects: [] }
  # --- DamageClaim ---
  - { method: POST, path: "/plant/loads/{load_id}/claims", description: "File a field-damage/rebuild claim against a delivered bundle; load DELIVERED -> CLAIM_HOLD", roles: [CustomerContact], code: 201, input: [bundle_id, claim_type, description, claimed_amount_cents], output: DamageClaim, side_effects: ["load DELIVERED -> CLAIM_HOLD", "filed_by_customer_id := X-User-ID"] }
  - { method: GET, path: "/plant/claims/{id}", description: "Read one claim", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: [], output: DamageClaim, side_effects: [] }
  - { method: GET, path: "/plant/claims", description: "List claims (reverse-reachability for delivery_load_id, bundle_id, filed_by_customer_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: ["delivery_load_id?", "bundle_id?", "filed_by_customer_id?", "status?", "limit?", "offset?"], output: "DamageClaim[]", side_effects: [] }
  - { method: POST, path: "/plant/claims/{id}/triage", description: "FILED -> TRIAGED; records triaged_by", roles: [ClaimsAdjuster], code: 200, input: [], output: DamageClaim, side_effects: ["triaged_by := X-User-ID"] }
  - { method: POST, path: "/plant/claims/{id}/decide", description: "TRIAGED -> APPROVE_REBUILD | APPROVE_CREDIT | DENIED; decider must differ from triager; computes approved_cap_cents; APPROVE_REBUILD fires the rebuild cascade", roles: [ClaimsAdjuster], code: 200, input: [decision, "damage_pct?"], output: DamageClaim, side_effects: ["approved_cap_cents computed", "APPROVE_REBUILD: bundle -> DAMAGED, rebuild cut list clone + rebuild batch created, claim -> REBUILD_IN_PROGRESS", "DENIED: load CLAIM_HOLD -> DELIVERED if no other open claim"] }
  - { method: POST, path: "/plant/claims/{id}/settle", description: "Settle with actual cost inputs; waterfall buckets + residual credit; REBUILD_IN_PROGRESS requires rebuild batch STAGED or LOADED", roles: [ClaimsAdjuster], code: 200, input: [rebuild_material_cents, rebuild_labor_cents, redelivery_cents], output: DamageClaim, side_effects: ["waterfall per claim_settlement_waterfall", "Job.credit_issued_cents += residual", "load CLAIM_HOLD -> DELIVERED if no other open claim"] }
  - { method: POST, path: "/plant/claims/{id}/void", description: "Void from FILED/TRIAGED, or reverse a SETTLED claim (credit exactly reversed)", roles: [ClaimsAdjuster], code: 200, input: [], output: DamageClaim, side_effects: ["SETTLED -> VOID: Job.credit_issued_cents -= residual_credit_cents"] }
  # --- DesignChangeOrder ---
  - { method: POST, path: "/plant/jobs/{job_id}/change-orders", description: "Request a design change (possibly after cut); OCC-guarded on Job.version", roles: [CustomerContact, ProductionPlanner], code: 201, input: [supersedes_design_id, reason, expected_job_version, "new_design_id?"], output: DesignChangeOrder, side_effects: ["Job.version increments by 1"] }
  - { method: GET, path: "/plant/change-orders/{id}", description: "Read one change order", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: [], output: DesignChangeOrder, side_effects: [] }
  - { method: GET, path: "/plant/change-orders", description: "List change orders (reverse-reachability for job_id, supersedes_design_id, new_design_id); default sort created_at ASC", roles: [PlantManager, DesignEngineer, ProductionPlanner, InventoryManager, ShopFloorLead, ShippingCoordinator, ClaimsAdjuster, CustomerContact], code: 200, input: ["job_id?", "supersedes_design_id?", "new_design_id?", "status?", "limit?", "offset?"], output: "DesignChangeOrder[]", side_effects: [] }
  - { method: POST, path: "/plant/change-orders/{id}/assess", description: "REQUESTED -> IMPACT_ASSESSED; computes impact_lines_scrapped / impact_open_reservations; may set new_design_id", roles: [ProductionPlanner], code: 200, input: ["new_design_id?"], output: DesignChangeOrder, side_effects: ["impact fields computed"] }
  - { method: POST, path: "/plant/change-orders/{id}/approve", description: "IMPACT_ASSESSED -> APPROVED; requires SEALED chain-valid new design", roles: [PlantManager], code: 200, input: [], output: DesignChangeOrder, side_effects: ["Job posture recomputed -> BLOCKED"] }
  - { method: POST, path: "/plant/change-orders/{id}/reject", description: "REQUESTED|IMPACT_ASSESSED -> REJECTED", roles: [PlantManager], code: 200, input: [], output: DesignChangeOrder, side_effects: [] }
  - { method: POST, path: "/plant/change-orders/{id}/apply", description: "APPROVED -> APPLIED; runs the six-hop cascade (design supersede -> cut lists -> reservations -> batches -> bundles/loads -> posture)", roles: [PlantManager], code: 200, input: [], output: DesignChangeOrder, side_effects: ["full apply cascade per DesignChangeOrder machine"] }
  - { method: POST, path: "/plant/change-orders/{id}/withdraw", description: "REQUESTED -> WITHDRAWN by the owning customer", roles: [CustomerContact], code: 200, input: [], output: DesignChangeOrder, side_effects: [] }
  # --- Logical clock (test-driving endpoint) ---
  - { method: POST, path: "/plant/_clock/set_current_utc", description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (startup default) and never falls back to wall-clock time. All expiry/window/storage/slot-in-past rules read this clock.", roles: [PlantManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers, unknown role, or entity_backed X-User-ID not resolving" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "CustomerContact acting outside its own customer scope" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, or violated conditional-input rule" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic transition/state guard failure (incl. crane not ACTIVE for slot booking, lot not ACTIVE for reservation consume)" }
  - { id: ERR_DESIGN_NOT_AWAITING_SEAL, http: 409, condition: "Seal requested on a design not in SEAL_REQUESTED" }
  - { id: ERR_DESIGN_NOT_CURRENT, http: 409, condition: "Referenced design is not the current SEALED revision of its component_ref (superseded or a newer SEALED revision exists)" }
  - { id: ERR_CUT_LIST_NOT_RELEASED, http: 409, condition: "Cut list not in the required status (EXPLODED for release; RELEASED for batch CUTTING / batch create)" }
  - { id: ERR_CUT_LIST_NOT_RECONCILING, http: 409, condition: "Reconcile attempted on a cut list not in RECONCILING" }
  - { id: ERR_BATCH_INVALID_TRANSITION, http: 409, condition: "Batch transition not declared (incl. direct STAGED->LOADED or ->CANCELLED requests)" }
  - { id: ERR_LOAD_INVALID_TRANSITION, http: 409, condition: "Load transition not declared or its state guard failed (no PACKED bundle, no COMPLETED load-pick slot, etc.)" }
  - { id: ERR_CLAIM_INVALID_TRANSITION, http: 409, condition: "Claim action not allowed from current claim status" }
  - { id: ERR_CHANGE_ORDER_INVALID_TRANSITION, http: 409, condition: "Change-order action not allowed from current change-order status" }
  - { id: ERR_ENGINEER_LICENSE_EXPIRED, http: 422, condition: "Sealing engineer license_expiry < current logical clock" }
  - { id: ERR_ENGINEER_LICENSE_STATE_MISMATCH, http: 422, condition: "Sealing engineer license_state != job.jobsite_state" }
  - { id: ERR_SEAL_AUTHORITY_INSUFFICIENT, http: 422, condition: "WALL_PANEL design sealed by a TRUSS_ONLY engineer" }
  - { id: ERR_SEALER_MUST_DIFFER_FROM_SUBMITTER, http: 422, condition: "Sealing engineer equals submitted_by_engineer_id" }
  - { id: ERR_CLAIM_DECIDER_MUST_DIFFER, http: 422, condition: "Claim decider equals triaged_by" }
  - { id: ERR_CRANE_SLOT_OVERLAP, http: 409, condition: "New slot violates the buffered half-open interval rule on the same crane" }
  - { id: ERR_BUNDLE_OVERWEIGHT, http: 422, condition: "Bundle weight_lbs > capacity_lbs of the booked load-pick crane" }
  - { id: ERR_STACK_POSITION_CONFLICT, http: 409, condition: "stack_position already used by a non-SUPERSEDED bundle of the same load" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "Reservation exceeds lot availability, or lot not ACTIVE" }
  - { id: ERR_RESERVATION_KIND_MISMATCH, http: 422, condition: "Reservation target/quantities do not match lot kind, dimension/grade/plate_class, or line already terminal" }
  - { id: ERR_JIG_COMPONENT_MISMATCH, http: 422, condition: "Jig component_type_supported != design/batch component type" }
  - { id: ERR_DUPLICATE_COMPONENT_REF, http: 409, condition: "component_ref collision: open revision exists, or sealed revision exists without a correct supersedes_design_id" }
  - { id: ERR_REVISION_CHAIN_BROKEN, http: 422, condition: "supersedes_design_id / new_design_id chain integrity violated" }
  - { id: ERR_RESERVATION_COVERAGE_SHORT, http: 422, condition: "Batch CUTTING coverage check failed (lumber per line or plates per list)" }
  - { id: ERR_OUTSIDE_DELIVERY_WINDOW, http: 422, condition: "scheduled_date outside the closed job window, or dispatch after delivery_window_end" }
  - { id: ERR_DROPS_PER_DAY_EXCEEDED, http: 422, condition: "Aggregate daily drops capacity for the job would be exceeded on that date" }
  - { id: ERR_SLOT_IN_PAST, http: 422, condition: "Crane slot start_at < current logical clock" }
  - { id: ERR_BUNDLE_JOB_MISMATCH, http: 422, condition: "Bundle's batch belongs to a different job than the load, or load not accepting bundles, or no load-pick slot booked" }
  - { id: ERR_CLAIM_BUNDLE_NOT_IN_LOAD, http: 422, condition: "Claim's bundle_id does not belong to the claim's load" }
  - { id: ERR_CREDIT_HOLD, http: 402, condition: "Dispatch blocked: customer credit_hold is true" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Load create/dispatch would push credit_used_cents over credit_limit_cents" }
  - { id: ERR_STALE_JOB_VERSION, http: 412, condition: "expected_job_version != current Job.version on design or change-order create" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version != current InventoryLot.version on reservation create" }
  - { id: ERR_STALE_CRANE_VERSION, http: 412, condition: "expected_crane_version != current CraneResource.version on crane-slot create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant general manager; hierarchical override over configuration, job lifecycle, change-order approval/application, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /plant/customer-accounts", "PATCH /plant/customer-accounts/{id}", "POST /plant/engineers", "POST /plant/jig-setups", "POST /plant/cranes", "POST /plant/cranes/{id}/transition", "POST /plant/jobs/{id}/confirm", "POST /plant/jobs/{id}/cancel", "POST /plant/change-orders/{id}/approve", "POST /plant/change-orders/{id}/reject", "POST /plant/change-orders/{id}/apply", "POST /plant/_clock/set_current_utc"]
    shared_operations: ["POST /plant/jobs", "all GET endpoints"]
  - name: DesignEngineer
    description: "Engineer of record; creates and seals designs; segregation of duties forbids sealing one's own submission"
    identity: "entity_backed:Engineer"
    exclusive_operations: ["POST /plant/jobs/{job_id}/designs", "POST /plant/designs/{id}/transition"]
    shared_operations: ["all GET endpoints"]
  - name: ProductionPlanner
    description: "Planner; explodes cut lists, releases/reconciles them, schedules batches, books crane slots, reserves material, assesses change orders"
    identity: opaque
    exclusive_operations: ["POST /plant/designs/{design_id}/cut-lists", "POST /plant/cut-lists/{id}/release", "POST /plant/cut-lists/{id}/reconcile", "POST /plant/jobs/{job_id}/batches", "POST /plant/crane-slots", "POST /plant/crane-slots/{id}/transition", "POST /plant/material-reservations", "POST /plant/change-orders/{id}/assess"]
    shared_operations: ["POST /plant/jobs/{job_id}/change-orders", "all GET endpoints"]
  - name: InventoryManager
    description: "Yard/inventory manager; receives and adjusts lots, quarantines, consumes and releases reservations"
    identity: opaque
    exclusive_operations: ["POST /plant/inventory-lots", "POST /plant/inventory-lots/{id}/adjust", "POST /plant/inventory-lots/{id}/transition", "POST /plant/material-reservations/{id}/consume", "POST /plant/material-reservations/{id}/release"]
    shared_operations: ["all GET endpoints"]
  - name: ShopFloorLead
    description: "Shop floor lead; drives batch build lifecycle and line cut/scrap"
    identity: opaque
    exclusive_operations: ["POST /plant/batches/{id}/transition", "POST /plant/cut-list-lines/{id}/mark-cut", "POST /plant/cut-list-lines/{id}/scrap"]
    shared_operations: ["all GET endpoints"]
  - name: ShippingCoordinator
    description: "Shipping coordinator; plans loads, builds bundle maps, drives dispatch/delivery/close"
    identity: opaque
    exclusive_operations: ["POST /plant/jobs/{job_id}/loads", "POST /plant/loads/{id}/transition", "POST /plant/loads/{load_id}/bundles"]
    shared_operations: ["all GET endpoints"]
  - name: ClaimsAdjuster
    description: "Claims adjuster; triages, decides, settles, and voids claims; segregation of duties forbids deciding a claim one triaged"
    identity: opaque
    exclusive_operations: ["POST /plant/claims/{id}/triage", "POST /plant/claims/{id}/decide", "POST /plant/claims/{id}/settle", "POST /plant/claims/{id}/void"]
    shared_operations: ["all GET endpoints"]
  - name: CustomerContact
    description: "Jobsite customer contact; creates own jobs, files claims on own deliveries, requests/withdraws change orders on own jobs"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations: ["POST /plant/loads/{load_id}/claims", "POST /plant/change-orders/{id}/withdraw"]
    shared_operations: ["POST /plant/jobs (own customer_id only)", "POST /plant/jobs/{job_id}/change-orders (own jobs only)", "GET endpoints scoped to own customer_id"]
