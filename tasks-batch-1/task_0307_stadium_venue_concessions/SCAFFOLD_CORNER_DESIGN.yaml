      - name: transfer_complete_credits_destination_derived_onhand
        claim_type: derived_field_reconciliation
        grounds: [state_machines.Transfer.IN_TRANSIT_to_COMPLETED, entities.InventoryLot.fields.remaining_qty]
        distinguishing_aspect: "After dispatch+complete of 30 buns A→B, the destination stand B holds a new ACTIVE lot of 30 and source A's remaining on_hand is 70, so the derived per-stand on_hand reconciles to the moved quantity."
