            - "Tech T_GOOD: two TERMINAL cleans, each exactly 90 minutes (ef 1.0, credit 2.00 each -> 4.00), no fails, exactly 5h accrued shift -> score 80.00"
            - "Tech T_MISS: same two passes plus one FAIL audit -> penalty 5.00 -> score 75.00"
