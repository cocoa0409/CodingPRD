  - rule_id: compensating_invariant
    instances:

      - name: void_authorization_restores_facility_and_insurer_ledgers_to_zero
        grounds:
          - state_machines.Vehicle.B_AUTHORIZED_to_B_UNBILLED
          - state_machines.Vehicle.B_UNBILLED_to_B_AUTHORIZED
          - entities.Facility.fields.billable_accrued_cents
          - entities.Insurer.fields.outstanding_direct_bill_cents
          - errors[ERR_INVALID_VEHICLE_BILLING_STATE]
        distinguishing_aspect: |
          VOID_AUTHORIZATION is the exact inverse of AUTHORIZE: the 213030-cent posting must leave the
          Facility and Insurer ledgers at 0 with the Vehicle's own net_billable_cents untouched, the
          billing gate must again refuse start-repair, and re-authorizing must post 213030 once - not
          426060. An implementation that recomputes ledgers by summation rather than by delta, or that
          zeroes the vehicle's money chain on void, diverges at one of those four checkpoints.
