      - name: decline_cascade_corner
        claim_type: Side Effect Execution
        grounds: [state_machines.CoordinationRequest.REQUESTED_to_DECLINED]
        excluded_because:
          difficulty_instance: decline_cascade_reverts_product_and_cancels_sibling_requests
          rationale: "The decline cascade (product revert plus sibling cancellation) is asserted hop-by-hop in the named §1.8 instance."

      - name: supersede_cascade_corner
        claim_type: Side Effect Execution
        grounds: [state_machines.Product.ISSUED_to_SUPERSEDED]
        excluded_because:
          difficulty_instance: supersede_cascade_withdraws_prior_records
          rationale: "Supersession withdrawing the prior product's QUEUED records is asserted hop-by-hop in the named §1.8 instance."

      - name: dissemination_retry_cycle_corner
        claim_type: Invalid Transitions
        grounds: [state_machines.DisseminationRecord.SENT_to_FAILED]
        excluded_because:
          difficulty_instance: dissemination_record_retry_cycle_to_dead
          rationale: "The QUEUED -> SENT -> FAILED -> QUEUED cycle through DEAD at MAX_RETRIES is covered by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: hail_threshold_100_included_099_rejected
        claim_type: Constants Applied
        grounds: [calculations.issuance_criteria_evaluation, errors.ERR_ISSUANCE_CRITERIA_NOT_MET]
        distinguishing_aspect: "The SEVERE_THUNDERSTORM hail criterion 1.00 inch is inclusive and independent of wind: hail 1.00 with wind 0 issues, hail 0.99 fails — the OR-ed thresholds are evaluated per reading, not summed."
        test_recipe:
          setup: ["Office, zone, two SEVERE storms: S-OK hail exactly 1.00 (wind 0), S-LOW hail 0.99 (wind 0). Identical warning drafts at clock 2026-09-01T10:00:00Z."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KHAI", name: "Hail Office", region: "PLAINS", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { h_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZHL1", name: "Hail Zone", office_id: "${h_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
