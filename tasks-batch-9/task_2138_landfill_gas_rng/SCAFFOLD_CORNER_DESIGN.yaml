        distinguishing_aspect: "POST /injection-batches/{id}/meter-trueup writes metered_mmbtu 352.40 and nothing else: gross_mmbtu stays 340.14, the batch stays INJECTED, and the site energy ledger and the nomination's delivered_dth are unchanged."
