# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0577_event_ticketing — 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: seat_price_locked_final_vs_current_dynamic
        grounds:
          - calculations.dynamic_seat_price
          - entities.Ticket.fields.face_value_cents
          - entities.Seat.fields.current_face_value_cents
        distinguishing_aspect: "A ticket bought at pct_sold=0 keeps face_value_cents==10000 (locked_final) while a still-available seat of the same price level reads current_face_value_cents==12500 (current_dynamic) once pct_sold reaches 50 — same pricing rule, two divergent numbers on different entities (Ticket vs Seat)."
        test_recipe:
          setup:
            - "Dynamic price level base 10000 (dynamic_pricing_enabled=true), event with 4 seats, event ONSALE."
            - "Buyer B1 buys seat S1 at pct_sold=0 (locked face 10000); Buyer B2 buys seat S2, driving pct_sold to 50."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B1", email: "b1@x.com" }, as: BoxOffice, captures: { b1: $.data.id } }
            - { call: "POST /buyers", payload: { name: "B2", email: "b2@x.com" }, as: BoxOffice, captures: { b2: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Show", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 10000, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: true }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "2" }, as: BoxOffice, captures: { s2: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "3" }, as: BoxOffice, captures: { s3: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "4" }, as: BoxOffice, captures: { s4: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b1}" }, as: Buyer, as_user_id: "${b1}", captures: { tk1: $.data.id } }
            - { call: "POST /queue-tokens/${tk1}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b1}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b1}", captures: { h1: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h1}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b1}", captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: Buyer, as_user_id: "${b1}" }
            - { call: "GET /tickets", payload: {}, as: Buyer, as_user_id: "${b1}", captures: { t1: "$.data[0].id" } }
            - { call: "GET /events/${ev}", payload: {}, as: BoxOffice, captures: { ev_v2: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b2}" }, as: Buyer, as_user_id: "${b2}", captures: { tk2: $.data.id } }
            - { call: "POST /queue-tokens/${tk2}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s2}"], buyer_id: "${b2}", expected_event_version: "${ev_v2}" }, as: Buyer, as_user_id: "${b2}", captures: { h2: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h2}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b2}", captures: { o2: $.data.id } }
            - { call: "POST /orders/${o2}/pay", payload: {}, as: Buyer, as_user_id: "${b2}" }
          trigger:
            - { call: "GET /tickets/${t1}", payload: {}, as: Buyer, as_user_id: "${b1}", captures: { t1_face: $.data.face_value_cents } }
            - { call: "GET /seats/${s3}", payload: {}, as: BoxOffice, captures: { s3_face: $.data.current_face_value_cents } }
          assert:
            - "Ticket.${t1}.face_value_cents == 10000"
            - "Seat.${s3}.current_face_value_cents == 12500"
            - "Event.${ev}.pct_sold == 50.0"

      - name: settlement_gross_vs_net_to_promoter
        grounds:
          - calculations.settlement_net_to_promoter
          - entities.Settlement.fields.gross_face_cents
          - entities.Settlement.fields.net_to_promoter_cents
        distinguishing_aspect: "For an event with two issued tickets (face 9990 each) where one is refunded, the finalized Settlement.gross_face_cents==19980 (all issued) diverges from net_to_promoter_cents==9990 (VALID only) — dual-variant accounting on the Settlement entity, a different domain from seat pricing."
        test_recipe:
          setup:
            - "Event with a 2-seat order paid (tickets face 9990 each, dynamic pricing off); one ticket refunded to ORIGINAL; event COMPLETED; settlement finalized."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "2" }, as: BoxOffice, captures: { s2: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}", "${s2}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
            - { call: "GET /tickets", payload: {}, as: Buyer, as_user_id: "${b}", captures: { t1: "$.data[0].id" } }
            - { call: "GET /orders/${o}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { ord_v: $.data.version } }
            - { call: "POST /orders/${o}/refund-requests", payload: { reason: "CUSTOMER_REQUEST", refund_destination: "ORIGINAL", expected_order_version: "${ord_v}", ticket_ids: ["${t1}"] }, as: BoxOffice, captures: { rr: $.data.id } }
            - { call: "POST /refund-requests/${rr}/approve", payload: {}, as: BoxOffice }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T20:00:00Z" }, as: BoxOffice }
            - { call: "POST /events/${ev}/status", payload: { target_status: "COMPLETED" }, as: Promoter, as_user_id: "prm_1" }
          trigger:
            - { call: "POST /events/${ev}/settlement/finalize", payload: {}, as: Promoter, as_user_id: "prm_1", captures: { net: $.data.net_to_promoter_cents, gross: $.data.gross_face_cents } }
          assert:
            - "Settlement.gross_face_cents == 19980"
            - "Settlement.net_to_promoter_cents == 9990"
            - "Settlement.status == FINALIZED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: order_service_fee_round_per_seat_then_sum
        grounds:
          - calculations.order_service_fee
          - entities.Order.fields.service_fee_cents
          - entities.Order.fields.order_total_cents
        distinguishing_aspect: "Mode (b) nested rounding: with two seats at face 9990 and service_fee_pct 0.15, rounding EACH seat's 1498.5 up to 1499 (+500 flat) then summing yields service_fee_cents==3998, whereas sum-then-round would give 3997 — the scaffold pins per-seat-then-sum."
        test_recipe:
          setup:
            - "Price level base 9990, service_fee_pct 0.15, flat 500, dynamic off; 2-seat MOBILE order created."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "2" }, as: BoxOffice, captures: { s2: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}", "${s2}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id, fee: $.data.service_fee_cents, tot: $.data.order_total_cents } }
          assert:
            - "Order.${o}.face_total_cents == 19980"
            - "Order.${o}.service_fee_cents == 3998"
            - "Order.${o}.order_total_cents == 23978"

      - name: dynamic_seat_price_tiered_platinum_clamp
        grounds:
          - calculations.dynamic_seat_price
          - entities.Seat.fields.current_face_value_cents
          - entities.PriceLevel.fields.is_platinum
        distinguishing_aspect: "Mode (a) >=3 inputs with non-linear interaction: current_face_value_cents depends on base, pct_sold tier, is_platinum floor (max(mult,2.00)) and a min/max clamp; at pct_sold 50 a platinum base-10000 seat prices to 20000 (2.00x floor beats the 1.25 tier), a different combinatorial axis than order_service_fee's rounding."
        test_recipe:
          setup:
            - "Platinum price level base 10000 (dynamic on), 4 seats; 2 seats sold to reach pct_sold 50."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B1", email: "b1@x.com" }, as: BoxOffice, captures: { b1: $.data.id } }
            - { call: "POST /buyers", payload: { name: "B2", email: "b2@x.com" }, as: BoxOffice, captures: { b2: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Show", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "PLAT", base_face_value_cents: 10000, is_platinum: true, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: true }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "2" }, as: BoxOffice, captures: { s2: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "3" }, as: BoxOffice, captures: { s3: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "4" }, as: BoxOffice, captures: { s4: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b1}" }, as: Buyer, as_user_id: "${b1}", captures: { tk1: $.data.id } }
            - { call: "POST /queue-tokens/${tk1}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}", "${s2}"], buyer_id: "${b1}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b1}", captures: { h1: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h1}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b1}", captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: Buyer, as_user_id: "${b1}" }
          trigger:
            - { call: "GET /seats/${s3}", payload: {}, as: BoxOffice, captures: { s3_face: $.data.current_face_value_cents } }
          assert:
            - "Event.${ev}.pct_sold == 50.0"
            - "Seat.${s3}.current_face_value_cents == 20000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_parallel_dimensions_independent
        grounds:
          - state_machines.Ticket.transitions.deliver
          - state_machines.Ticket.transitions.scan
          - entities.Ticket.fields.delivery_status
          - entities.Ticket.fields.scan_status
        distinguishing_aspect: "On a Ticket, delivery_status and scan_status advance independently of the validity status: a PRINT ticket goes VALID/PENDING/UNSCANNED -> VALID/DELIVERED/UNSCANNED (deliver) -> VALID/DELIVERED/SCANNED (scan), with status==VALID unchanged throughout — parallel state dimensions on the Ticket entity."
        test_recipe:
          setup:
            - "Paid PRINT order with one ticket; event ONSALE."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "PRINT" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
            - { call: "GET /tickets", payload: {}, as: Buyer, as_user_id: "${b}", captures: { t1: "$.data[0].id" } }
          trigger:
            - { call: "POST /tickets/${t1}/deliver", payload: {}, as: BoxOffice, captures: { d_status: $.data.status, d_del: $.data.delivery_status, d_scan: $.data.scan_status } }
            - { call: "POST /tickets/${t1}/scan", payload: {}, as: GateScanner, captures: { f_status: $.data.status, f_del: $.data.delivery_status, f_scan: $.data.scan_status } }
          assert:
            - "after deliver: Ticket.${t1}.status == VALID and Ticket.${t1}.delivery_status == DELIVERED and Ticket.${t1}.scan_status == UNSCANNED"
            - "after scan: Ticket.${t1}.status == VALID and Ticket.${t1}.delivery_status == DELIVERED and Ticket.${t1}.scan_status == SCANNED"

      - name: event_onsale_postpone_onsale_cycle
        grounds:
          - state_machines.Event.transitions.ONSALE_to_POSTPONED
          - state_machines.Event.transitions.POSTPONED_to_ONSALE
          - entities.Event.fields.status
        distinguishing_aspect: "The Event status machine loops ONSALE -> POSTPONED -> ONSALE (reschedule), a genuine cycle on a different entity than Ticket; the event returns to ONSALE with an updated event_datetime and a strictly higher version each hop."
        test_recipe:
          setup:
            - "Event ONSALE with at least one seat and one price level."
          setup_api_calls:
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Tour", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { v_onsale1: $.data.version } }
          trigger:
            - { call: "POST /events/${ev}/status", payload: { target_status: "POSTPONED", new_event_datetime: "2026-09-01T19:00:00Z" }, as: Promoter, as_user_id: "prm_1", captures: { st_post: $.data.status, v_post: $.data.version } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { st_on2: $.data.status, v_onsale2: $.data.version, dt2: $.data.event_datetime } }
          assert:
            - "after postpone: Event.${ev}.status == POSTPONED"
            - "after reschedule: Event.${ev}.status == ONSALE"
            - "Event.${ev}.event_datetime == 2026-09-01T19:00:00Z"
            - "v_onsale2 > v_post and v_post > v_onsale1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_cascades_order_ticket_seat
        grounds:
          - state_machines.Event.transitions.to_CANCELED
          - state_machines.Order.transitions.to_REFUNDED
          - state_machines.Ticket.transitions.status_VALID_to_VOID
          - entities.Seat.fields.status
        distinguishing_aspect: "Depth-3 chain from POST /events/{id}/status(CANCELED): Event->CANCELED forces each PAID Order->REFUNDED (link1), each REFUNDED order voids its Ticket->VOID (link2), and each VOID ticket frees its Seat->AVAILABLE (link3); every link is caused by the previous, not by the cancel directly."
        test_recipe:
          setup:
            - "Event ONSALE with a paid 1-seat MOBILE order (seat SOLD, one VALID ticket)."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
            - { call: "GET /tickets", payload: {}, as: Buyer, as_user_id: "${b}", captures: { t1: "$.data[0].id" } }
          trigger:
            - { call: "POST /events/${ev}/status", payload: { target_status: "CANCELED" }, as: Promoter, as_user_id: "prm_1" }
          assert:
            - "Order.${o}.status == REFUNDED"
            - "Ticket.${t1}.status == VOID"
            - "Seat.${s1}.status == AVAILABLE"
            - "Event.${ev}.seats_sold == 0 and Event.${ev}.seats_available == 1"

      - name: pay_cascades_hold_converted_seat_sold
        grounds:
          - state_machines.Order.transitions.PENDING_to_PAID
          - state_machines.Hold.transitions.ACTIVE_to_CONVERTED
          - entities.Seat.fields.status
        distinguishing_aspect: "Depth-2 chain from POST /orders/{id}/pay: Order->PAID forces its Hold->CONVERTED (link1), and the CONVERTED hold flips its held Seat->SOLD (link2); origin transition differs from the event-cancel cascade."
        test_recipe:
          setup:
            - "Event ONSALE, one ACTIVE hold over one seat, one PENDING order on that hold."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
          trigger:
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
          assert:
            - "Hold.${h}.status == CONVERTED"
            - "Seat.${s1}.status == SOLD"
            - "Event.${ev}.seats_sold == 1 and Event.${ev}.seats_held == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_unauthorized_beats_already_paid_state
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - state_machines.Order.transitions.PENDING_to_PAID
        distinguishing_aspect: "Category pair (auth authorization pri2) vs (state pri5): Buyer B2 pays Buyer B1's already-PAID order — both ownership (not owner) and state (already PAID) are violated; the server returns ERR_UNAUTHORIZED, proving auth outranks state."
        test_recipe:
          setup:
            - "B1 has a PAID order; a second buyer B2 exists."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B1", email: "b1@x.com" }, as: BoxOffice, captures: { b1: $.data.id } }
            - { call: "POST /buyers", payload: { name: "B2", email: "b2@x.com" }, as: BoxOffice, captures: { b2: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b1}" }, as: Buyer, as_user_id: "${b1}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b1}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b1}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b1}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b1}" }
          trigger:
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b2}", captures: { err: $.data.error_id } }
          assert:
            - "response status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: seat_create_notfound_beats_duplicate_seat
        grounds:
          - validations[priority=3]
          - validations[priority=8]
          - errors[ERR_PRICE_LEVEL_NOT_FOUND]
          - errors[ERR_DUPLICATE_SEAT]
        distinguishing_aspect: "Category pair (existence pri3) vs (business_constraint pri8): creating a seat that both names a nonexistent price_level_id and duplicates an existing (section,row,seat_number) returns ERR_PRICE_LEVEL_NOT_FOUND, proving existence outranks the uniqueness constraint — a different pair than the auth-vs-state conflict."
        test_recipe:
          setup:
            - "Event DRAFT with one price level and one seat (A/1/1) already created."
          setup_api_calls:
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "00000000-0000-4000-8000-000000000000", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { err: $.data.error_id } }
          assert:
            - "response status == 404"
            - "error_id == ERR_PRICE_LEVEL_NOT_FOUND"

