  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_route_halfopen_window_overlap
        grounds:
          - state_machines.SlotReservation.HELD_to_COMMITTED
          - validations[priority=12]
          - errors[ERR_ROUTE_WINDOW_CONFLICT]
          - entities.DeliveryRoute.fields.stop_minutes
        distinguishing_aspect: |
          Half-open interval semantics [start, start+stop_minutes) on the DeliveryRoute resource: a second
          DELIVERY commit at window_start_min=630 overlaps a COMMITTED window [600,660) (since 630<660) and is
          rejected; an adjacent window at 660 would be admitted. Adjacency-allowed, point-overlap-rejected.
        test_recipe:
          setup:
            - "DeliveryRoute stop_minutes=60; order A committed DELIVERY at window_start_min=600 -> [600,660); order B requests DELIVERY at 630"
          setup_api_calls:
            - call: "POST /_clock/set"
