              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "On Time Edge", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://edge-v1" }
              as: ReviewCoordinator
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc_id}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc_id}", code_section_ref: "1607.1", reference_edition: "IBC_2021", severity: "MINOR", category: "CALCULATION", comment_text: "Live load reduction unsupported" }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T23:59:59.999Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plan-review/cycles/${cyc_id}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
          assert:
            - "ReviewCycle.${cyc_id}.due_at == 2026-08-24T23:59:59.999Z"
            - "ReviewCycle.${cyc_id}.completed_at == 2026-08-24T23:59:59.999Z (== due_at)"
            - "ReviewCycle.${cyc_id}.is_on_time == true (<= is inclusive at the boundary)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs:
  # ReviewCycle x DeficiencyComment; ReviewRecord x DeferredSubmittal)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cycle_approval_gated_by_comment_states
        grounds:
          - state_machines.ReviewCycle.IN_REVIEW_to_APPROVED
          - calculations.unresolved_comment_count
          - errors[ERR_UNRESOLVED_COMMENTS_REMAIN]
        distinguishing_aspect: |
          Pair ReviewCycle x DeficiencyComment: the cycle's APPROVED transition
          depends on the statuses of the engagement's comments — an OPEN
          comment blocks approval even though the cycle itself is IN_REVIEW.
        test_recipe:
          setup:
