              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Pier 9 Oyster Bar Inc", tier_id: "${tier_id}", committed_annual_spend_cents: 9000000 }
              as: GpoAdmin
