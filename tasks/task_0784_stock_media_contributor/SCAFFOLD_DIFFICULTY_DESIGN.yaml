              as_user_id: "${c_id}"
            - call: "POST /assets/${a1}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a1}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "A2", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "bbbb", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a2: $.data.id }
            - call: "POST /assets/${a2}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a2}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a2}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "A3", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "cccc", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
