  - section: errors
    instances:
      - name: header_failures_report_invalid_role_before_unauthenticated
        claim_type: triggerability
        grounds:
          - validations[V020]
          - validations[V030]
          - errors[ERR_INVALID_ROLE]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          The two header rules are separable and ordered: an unknown X-Role is 400 ERR_INVALID_ROLE, a
          valid role with no X-User-ID is 401 ERR_UNAUTHENTICATED, a request missing both reports the
          role error because V020 sits at priority 20 ahead of V030 at 30, and POST /_clock/set_current_utc
          is the single endpoint that still succeeds with no X-User-ID at all.
        test_recipe:
          setup:
            - "Market ATL exists; the clock reads 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
