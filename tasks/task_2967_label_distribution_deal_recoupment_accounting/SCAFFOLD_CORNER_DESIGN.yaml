          Every one of the five declared side effects of DRAFT -> EXECUTED is checked on one call,
          including the branch inside the ledger initialisation: an advance of 0 arrives at
          recoupment_status RECOUPED immediately while a positive advance arrives at UNRECOUPED with
          the full amount outstanding. The fifth effect is on a DIFFERENT entity — the distributor's
          active_deal_count, which must count both executed deals, so the recompute is not a local
