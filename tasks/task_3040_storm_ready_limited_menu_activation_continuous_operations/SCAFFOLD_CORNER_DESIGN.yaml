              captures: { m: $.data.id }
            - call: "PATCH /ops/crew-members/${m}"
              payload: { status: "INACTIVE" }
              as: FieldCoordinator
          trigger:
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u}", assigned_from: "2026-09-10T10:00:00Z", assigned_until: "2026-09-11T10:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
            - call: "PATCH /ops/crew-members/${m}"
              payload: { status: "AVAILABLE" }
              as: FieldCoordinator
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u}", assigned_from: "2026-09-10T10:00:00Z", assigned_until: "2026-09-11T10:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a: $.data.id }
          assert:
            - "assignment while INACTIVE fails with error_id == ERR_CREW_MEMBER_INACTIVE (409)"
            - "after reactivation the assignment succeeds: CrewAssignment.${a}.status == SCHEDULED"

  # ===========================================================================
  - section: errors
    instances:
      - name: err_assignment_window_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ASSIGNMENT_WINDOW]
        excluded_because:
          difficulty_instance: boundary_precision_check / assignment_start_before_window_rejected
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_preposition_window_expired_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PREPOSITION_WINDOW_EXPIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / asset_not_idle_beats_preposition_window_expired
          rationale: "The window-expired path is part of that instance's dual-failure setup; the inclusive boundary is additionally covered by the §1.9 calculations corner preposition_window_inclusive_at_48h."

      - name: err_cold_hold_expired_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_COLD_HOLD_EXPIRED]
        excluded_because:
          difficulty_instance: combinatorial_formula / cold_hold_deadline_evaluation_order
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_assignment_overlap_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ASSIGNMENT_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_assignment_half_open_adjacency
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_lodging_overlap_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LODGING_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lodging_calendar_date_overlap_vs_instant_adjacency
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_open_checklists_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_CHECKLISTS]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / close_open_checklists_beats_stale_version
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_asset_not_idle_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ASSET_NOT_IDLE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / asset_not_idle_beats_preposition_window_expired
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_storm_not_active_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STORM_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assignment_start_requires_storm_active_and_tiered_unit
