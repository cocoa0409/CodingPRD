  - rule_id: boundary_precision_check
    instances:
      - name: count_based_ratio_exactly_at_excessive_threshold_restricts
        grounds:
          - calculations.rolling_chargeback_ratio
          - calculations.monitoring_detector_evaluation.constants.EXCESSIVE_BPS
          - endpoints[POST /monitoring-runs]
          - entities.MonitoringAlert.fields.severity_score
        boundary_metric: "Merchant.rolling_chargeback_ratio_bps against EXCESSIVE_BPS (90)"
        endpoint: "POST /monitoring-runs"
        distinguishing_aspect: |
          89 bps and 90 bps are one basis point apart and both above EARLY_WARNING_BPS, so both
          raise a CHARGEBACK_THRESHOLD alert; only the exact-equality case (>= 90) escalates
          severity to 90 and restricts the account. An implementation using a strict > comparison
          passes the 89 case and fails the 90 case.
