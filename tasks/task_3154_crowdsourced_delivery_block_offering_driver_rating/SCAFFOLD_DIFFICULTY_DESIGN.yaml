- rule_id: non_linear_state_machine
  instances:
  - name: screening_fail_reopen_review_cycle_twice
    grounds:
    - state_machines.BackgroundScreening.FAILED_to_IN_REVIEW
    - state_machines.BackgroundScreening.IN_REVIEW_to_FAILED
    - state_machines.BackgroundScreening.IN_REVIEW_to_CLEARED
    distinguishing_aspect: 'Cyclic machine on BackgroundScreening (INITIATED -> IN_REVIEW -> FAILED -> IN_REVIEW -> FAILED -> IN_REVIEW -> CLEARED):
      the driver reopens a FAILED screening repeatedly and the loop terminates only on CLEARED. The sibling non-linear instance runs on Appeal
      (a different entity).'
    test_recipe:
      setup:
      - Driver registered; screening INITIATED; no vehicle, not activated.
      setup_api_calls:
      - *id001
      - call: POST /drivers/register
        payload:
          legal_name: Dana One
          email: dana.one@example.com
        as: Anonymous
        captures:
          d: $.data.id
      - call: GET /drivers/${d}/screenings
        as: PlatformAdmin
        captures:
          sc: $.data[0].id
      trigger:
      - call: POST /screenings/${sc}/begin-review
        as: PlatformAdmin
      - call: POST /screenings/${sc}/decide
        payload:
          decision: FAILED
          failure_reason: MVR check failed
        as: PlatformAdmin
      - call: POST /screenings/${sc}/reopen
        as: Driver
        as_user_id: ${d}
      - call: POST /screenings/${sc}/decide
        payload:
          decision: FAILED
          failure_reason: insufficient history
        as: PlatformAdmin
      - call: POST /screenings/${sc}/reopen
        as: Driver
        as_user_id: ${d}
      - call: POST /screenings/${sc}/decide
        payload:
          decision: CLEARED
        as: PlatformAdmin
        captures:
          sc_status: $.data.status
          sc_reason: $.data.failure_reason
      assert:
      - the second decide reached IN_REVIEW without a new begin-review call (reopen lands in IN_REVIEW directly)
      - BackgroundScreening.${sc}.status == "CLEARED" after the third decision (captured ${sc_status})
      - BackgroundScreening.${sc}.failure_reason is null after CLEARED (captured ${sc_reason})
      - the cycle ran FAILED -> IN_REVIEW twice, proving the loop is not one-shot
  - name: appeal_evidence_request_under_review_cycle
    grounds:
    - state_machines.Appeal.UNDER_REVIEW_to_EVIDENCE_REQUESTED
    - state_machines.Appeal.EVIDENCE_REQUESTED_to_UNDER_REVIEW
    - state_machines.Appeal.UNDER_REVIEW_to_UPHELD
    distinguishing_aspect: Cyclic machine on Appeal (UNDER_REVIEW -> EVIDENCE_REQUESTED -> UNDER_REVIEW, looping twice before a terminal UPHELD)
      — a different entity than the BackgroundScreening cycle.
    test_recipe:
      setup:
      - Driver onboarded and ACTIVE, then deactivated; one appeal submitted.
      setup_api_calls:
      - *id001
      - call: POST /stations
        payload:
          name: Station A
          zone_code: SEA1
        as: PlatformAdmin
        captures:
          st: $.data.id
          stv: $.data.version
      - call: POST /drivers/register
        payload:
          legal_name: Dana One
          email: dana.one@example.com
        as: Anonymous
        captures:
          d: $.data.id
      - call: GET /drivers/${d}/screenings
        as: PlatformAdmin
        captures:
          sc: $.data[0].id
      - call: POST /screenings/${sc}/begin-review
        as: PlatformAdmin
      - call: POST /screenings/${sc}/decide
        payload:
          decision: CLEARED
        as: PlatformAdmin
      - call: POST /drivers/${d}/vehicles
        payload:
          vin: VIN-D1-0001
          vehicle_class: SEDAN
        as: Driver
        as_user_id: ${d}
        captures:
          v: $.data.id
      - call: POST /vehicles/${v}/attest-insurance
        payload:
          insurance_expires_on: '2027-01-01'
        as: Driver
        as_user_id: ${d}
      - call: POST /drivers/${d}/activate
        as: PlatformAdmin
      - call: POST /drivers/${d}/deactivate
        payload:
          reason: repeated customer complaints
        as: PlatformAdmin
      - call: POST /drivers/${d}/appeals
        payload:
          reason: complaints were fabricated
        as: Driver
        as_user_id: ${d}
        captures:
          ap: $.data.id
      trigger:
      - call: POST /appeals/${ap}/submit-evidence
        payload:
          evidence_note: dashcam footage link
        as: Driver
        as_user_id: ${d}
        captures:
          s1: $.data.status
          e1: $.data.evidence_count
      - call: POST /appeals/${ap}/request-evidence
        payload:
          request_note: need GPS logs
        as: AppealsReviewer
        captures:
          s2: $.data.status
      - call: POST /appeals/${ap}/submit-evidence
        payload:
          evidence_note: GPS logs attached
        as: Driver
        as_user_id: ${d}
        captures:
          s3: $.data.status
          e3: $.data.evidence_count
      - call: POST /appeals/${ap}/request-evidence
        payload:
          request_note: need station statement
        as: AppealsReviewer
        captures:
          s4: $.data.status
      - call: POST /appeals/${ap}/submit-evidence
        payload:
          evidence_note: station statement attached
        as: Driver
        as_user_id: ${d}
        captures:
          s5: $.data.status
          e5: $.data.evidence_count
      - call: POST /appeals/${ap}/decide
        payload:
          decision: UPHELD
          decision_reason: evidence insufficient
        as: AppealsReviewer
        captures:
          s6: $.data.status
      assert:
      - 'status sequence captured: ${s1}==UNDER_REVIEW, ${s2}==EVIDENCE_REQUESTED, ${s3}==UNDER_REVIEW, ${s4}==EVIDENCE_REQUESTED, ${s5}==UNDER_REVIEW,
        ${s6}==UPHELD'
      - evidence_count progressed ${e1}==1, ${e3}==2, ${e5}==3
      - Driver.${d}.status remains "DEACTIVATED" after UPHELD
