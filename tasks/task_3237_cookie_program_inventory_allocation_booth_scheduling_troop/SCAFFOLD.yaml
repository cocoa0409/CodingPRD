# =============================================================================
# SCAFFOLD.yaml — Cookie Program Inventory Allocation, Booth Scheduling &
# Troop Proceeds (council-level cookie season operations)
#
# Primary archetype: quota / allocation (season supply pool, cupboard holds,
#   transfer double-acknowledgement, donation waterfall at close-out)
# Secondary archetype: temporal windowing (booth slot scheduling: half-open
#   intervals, per-site capacity, lottery rank vs first-come)
# Difficulty instruction applied: much harder than expert level — Expert band
#   (13 entities, 30 endpoints) with dense cross-entity gating, two cyclic /
#   parallel state machines, two OCC-guarded writes, and two compensating
#   invariants over distinct conserved quantities.
# =============================================================================

scenario: |
  Cookie Program Inventory Allocation, Booth Scheduling & Troop Proceeds (Girl Scouts): council-level order forecasting and bulk purchase from licensed bakers with delivery to distribution sites, troop initial order placement, cupboard replenishment and transfers between troops with signed accountability, booth location securing with permission from host businesses and lottery or first-come scheduling among troops, digital order platform combining shipped orders, donation orders and in-person deliveries, proceeds structure returning a per-package amount to troops with incentive tiers for individual participants, financial accountability with troop deposits, uncollected payment handling and parent responsibility agreements, allergen and product recall handling, season close-out with unsold inventory and cookie donation programs

domain_name: cookie-program
api_prefix: /cookie-program

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency          # OCC on CookieSeason.version (site approval) and InventoryTransfer.version (double-acknowledgement)
    - cascading_side_effects          # season status flips, order confirmation, transfer full sign-off, recall, close-out
    - rate_threshold_triggers         # forecast attainment >= 80% vs > 120%; incentive tier attainment (>= vs >); booth lottery rank > 2
    - derived_field_reconciliation    # TroopAccount ledger vs credit postings; CookieSeason remaining_units vs commitments
    - bulk_operations                 # baker purchase order lines; close-out unsold donation sweep
  entity_topology: hierarchical       # CookieSeason root; most entities season-scoped; Peer Troop-to-Troop transfers
  state_machine_shape: branching      # compound aggregates (CookieSeason, DistributionSite) + branching approvals + parallel dims on DigitalOrder + cyclic loop on InventoryTransfer
  relationship_patterns:
    - one_to_many                     # Season→Product, Season→Order, Season→Site, Troop→Account
    - many_to_many                    # Troop↔Troop via InventoryTransfer; Troop↔BoothSlot via BoothRequest
    - self_referential                # InventoryTransfer.counter_transfer_id (exchange-back reference, nullable)
    - cross_aggregate                 # BakerPurchaseOrder.delivery_site_id → DistributionSite; RecallNotice → Product across season boundary
  role_model: segregation_of_duties   # transfer requester cannot approve own transfer (both signatures must come from different troops); booth host approver must not be requesting troop leader
  consistency_model: immediate        # all mutations atomic in the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CookieSeason
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Human season code, unique across seasons (e.g. 'COOKIE-2027')", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Display name of the season" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | SELLING | RECONCILIATION | CLOSED | CANCELLED" }
      - { name: ordering_opens_at, type: datetime, source: input, description: "Troop initial orders accepted on/after this instant (inclusive)" }
      - { name: ordering_closes_at, type: datetime, source: input, description: "Troop initial orders accepted until this instant (inclusive boundary: equal allowed)" }
      - { name: initial_commit_units, type: integer, source: computed, description: "Sum of package_qty over CookieOrderLines belonging to season CookieOrders with status IN {CONFIRMED, FULFILLED}" }
      - { name: pending_commit_units, type: integer, source: computed, description: "Sum of package_qty over CookieOrderLines belonging to season CookieOrders with status SUBMITTED" }
      - { name: purchased_units, type: integer, source: computed, description: "Sum of quantity over BakerPurchaseOrders with status IN {ORDERED, PARTIALLY_DELIVERED, DELIVERED} (not CANCELLED)" }
      - { name: remaining_units, type: integer, source: computed, description: "purchased_units - initial_commit_units - pending_commit_units; may be negative when purchase has not caught up" }
      - { name: forecast_attainment_pct, type: number, source: computed, description: "round_half_up(100 * initial_commit_units / purchased_units, 2); null when purchased_units == 0; gates auto-transition OPEN→SELLING" }

  - name: Troop
    parent: null
    common_fields: true
    fields:
      - { name: troop_number, type: string, source: input, description: "Council troop number, unique", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Troop display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: service_unit, type: string, source: input, description: "Service unit grouping label" }

  - name: CookieProduct
    parent: CookieSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; owning season" }
      - { name: variety_code, type: string, source: input, description: "Variety code unique within season (e.g. 'TM' Thin Mints)", constraints: "unique within season_id" }
      - { name: name, type: string, source: input, description: "Variety display name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Customer-facing price per package in cents, >= 1" }
      - { name: troop_proceeds_cents, type: integer, source: input, description: "Per-package proceeds returned to troop in cents; 0 < troop_proceeds_cents < unit_price_cents" }
      - { name: allergen_tags, type: array, source: input, description: "Array of allergen tags from {PEANUT, TREE_NUT, MILK, EGG, WHEAT, SOY, SESAME}; may be empty" }
      - { name: packages_per_case, type: integer, source: input, default: 12, description: "Packages per distribution case, integer >= 1" }

  - name: TroopAccount
    parent: Troop
    common_fields: true
    fields:
      - { name: troop_id, type: string, source: system, description: "FK -> Troop.id; one account per troop per season (composite unique troop_id+season_id)" }
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; account season scope" }
      - { name: balance_cents, type: integer, source: computed, description: "Signed ledger balance owed to council: charges (orders, forfeits, recall chargebacks) minus credits (deposits, refunds, proceeds offsets)" }
      - { name: proceeds_accrued_cents, type: integer, source: computed, description: "Sum of troop_proceeds_cents * package_qty over CONFIRMED|FULFILLED CookieOrderLines + settled DigitalOrder items for this troop; offsets balance at close-out" }
      - { name: uncollected_amount_cents, type: integer, source: computed, description: "Sum over ParticipantAgreement for this troop+season with status PENDING or DISPUTED of outstanding_cents; recomputed on every agreement mutation" }
      - { name: deposit_cents, type: integer, source: computed, description: "Sum of confirmed DEPOSIT credits on this account" }

  - name: CookieOrder
    parent: CookieSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; owning season" }
      - { name: troop_id, type: string, source: system, description: "FK -> Troop.id; ordering troop" }
      - { name: kind, type: enum, source: input, description: "INITIAL | REPLENISHMENT" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CONFIRMED | FULFILLED | REJECTED" }
      - { name: total_units, type: integer, source: computed, description: "Sum of package_qty over this order's CookieOrderLines" }
      - { name: total_amount_cents, type: integer, source: computed, description: "Sum of (unit_price_cents at confirm time) * package_qty over lines; pinned at CONFIRMED" }
      - { name: rejection_reason, type: string, source: system, description: "Set when transitioned to REJECTED" }

  - name: CookieOrderLine
    parent: CookieOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> CookieOrder.id; owning order" }
      - { name: product_id, type: string, source: input, description: "FK -> CookieProduct.id; ordered variety" }
      - { name: package_qty, type: integer, source: input, description: "Packages requested; must be a positive multiple of product.packages_per_case (case-pack constraint)" }

  - name: DistributionSite
    parent: CookieSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; owning season" }
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: capacity_units, type: integer, source: input, description: "Max packages storeable on site; >= 1" }
      - { name: received_units, type: integer, source: computed, description: "Sum of delivered quantity across BakerPurchaseOrders delivered to this site (status PARTIALLY_DELIVERED|DELIVERED)" }
      - { name: hold_units, type: integer, source: computed, description: "Sum of package_qty on InventoryTransfers from this site with status IN {REQUESTED, SHIPPER_SIGNED} (outbound holds)" }
      - { name: available_units, type: integer, source: computed, description: "received_units - hold_units - sum of package_qty on transfers with status RECEIVER_SIGNED|COMPLETED sourced here; floor 0 for read purposes" }
      - { name: posture, type: enum, source: computed, description: "RECEIVING when season IN {OPEN, SELLING} and received_units < capacity_units; FULL when received_units >= capacity_units; FROZEN when season IN {RECONCILIATION, CLOSED, CANCELLED}; DRAFT otherwise (season DRAFT)" }

  - name: BakerPurchaseOrder
    parent: CookieSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; owning season" }
      - { name: baker_name, type: string, source: input, description: "Licensed baker identifier (e.g. 'ABC', 'LBB')" }
      - { name: product_id, type: string, source: input, description: "FK -> CookieProduct.id; purchased variety" }
      - { name: quantity, type: integer, source: input, description: "Packages purchased, >= 1" }
      - { name: delivery_site_id, type: string, source: input, description: "FK -> DistributionSite.id; receiving site (cross-aggregate)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ORDERED | PARTIALLY_DELIVERED | DELIVERED | CANCELLED" }
      - { name: delivered_qty, type: integer, source: computed, description: "Cumulative delivered packages; 0 until first delivery recorded" }

  - name: InventoryTransfer
    parent: CookieSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; owning season" }
      - { name: source_troop_id, type: string, source: input, description: "FK -> Troop.id; troop releasing inventory (or null for cupboard-to-troop)" , constraints: "nullable"}
      - { name: dest_troop_id, type: string, source: input, description: "FK -> Troop.id; troop receiving inventory (or null for troop-to-cupboard return)", constraints: "nullable" }
      - { name: site_id, type: string, source: system, description: "FK -> DistributionSite.id; cupboard site involved when either troop side is null" , constraints: "nullable; required iff source_troop_id is null or dest_troop_id is null"}
      - { name: product_id, type: string, source: input, description: "FK -> CookieProduct.id; variety moved" }
      - { name: package_qty, type: integer, source: input, description: "Packages to move; positive multiple of product.packages_per_case" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SHIPPER_SIGNED | RECEIVER_SIGNED | COMPLETED | DECLINED | CANCELLED" }
      - { name: shipper_signed_by_troop_id, type: string, source: system, description: "FK -> Troop.id; troop whose leader countersigned the ship side", constraints: "nullable" }
      - { name: receiver_signed_by_troop_id, type: string, source: system, description: "FK -> Troop.id; troop whose leader countersigned the receive side", constraints: "nullable" }
      - { name: counter_transfer_id, type: string, source: system, description: "FK -> InventoryTransfer.id; self-referential exchange-back link when this transfer is part of an even swap", constraints: "nullable" }

  - name: BoothLocation
    parent: CookieSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; owning season" }
      - { name: host_business_name, type: string, source: input, description: "Host business granting permission" }
      - { name: address, type: string, source: input, description: "Booth street address" }
      - { name: host_permission_granted, type: boolean, source: input, default: false, description: "True only when host business has granted written permission; required before any BoothSlot can be created" }
      - { name: blackout_dates, type: array, source: input, default: [], description: "Array of ISO dates (YYYY-MM-DD) on which no booth slots may be created" }

  - name: BoothSlot
    parent: BoothLocation
    common_fields: true
    fields:
      - { name: location_id, type: string, source: system, description: "FK -> BoothLocation.id; host location" }
      - { name: start_at, type: datetime, source: input, description: "Slot start instant (half-open interval [start_at, end_at))" }
      - { name: end_at, type: datetime, source: input, description: "Slot end instant; must be strictly after start_at; touching boundaries allowed" }
      - { name: capacity_troops, type: integer, source: input, default: 1, description: "Max distinct troops with APPROVED BoothRequests on this slot; >= 1" }

  - name: BoothRequest
    parent: BoothSlot
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: system, description: "FK -> BoothSlot.id; requested slot" }
      - { name: troop_id, type: string, source: system, description: "FK -> Troop.id; requesting troop" }
      - { name: mode, type: enum, source: input, description: "LOTTERY (submitted with rank during lotto window) | FIRST_COME (auto-approved on submit if capacity remains)" }
      - { name: lottery_rank, type: integer, source: input, description: "Preference rank >= 1; required iff mode == LOTTERY; rank > 2 makes request ineligible at draw", constraints: "nullable when mode == FIRST_COME" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | CANCELLED" }
      - { name: decision_reason, type: string, source: system, description: "Set on APPROVED/DENIED transitions (e.g. 'CAPACITY_FULL', 'RANK_GT_2', 'SEASON_NOT_SELLING')" }

  - name: DigitalOrder
    parent: CookieSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; owning season" }
      - { name: troop_id, type: string, source: system, description: "FK -> Troop.id; fulfilling troop" }
      - { name: customer_email, type: string, source: input, description: "Customer contact email" }
      - { name: fulfillment_type, type: enum, source: input, description: "SHIPPED | IN_PERSON" }
      - { name: donation_units, type: integer, source: input, default: 0, description: "Packages donated via this order (donation orders); >= 0; not drawn from troop inventory" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | PAID | UNCOLLECTED | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "OPEN | DELIVERED | CANCELLED" }
      - { name: total_amount_cents, type: integer, source: computed, description: "(sum of package_qty * unit_price_cents over items) + donation_units * average unit price of season products (round_half_up to integer cents); pinned at creation" }
      - { name: items, type: array, source: input, description: "Array of {product_id, package_qty}; package_qty >= 1; product must belong to same season" }

  - name: ParticipantAgreement
    parent: Troop
    common_fields: true
    fields:
      - { name: troop_id, type: string, source: system, description: "FK -> Troop.id; owning troop" }
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; season scope" }
      - { name: participant_name, type: string, source: input, description: "Individual participant (scout) full name" }
      - { name: parent_name, type: string, source: input, description: "Parent/guardian name accepting financial responsibility" }
      - { name: signed_responsibility, type: boolean, source: input, default: false, description: "True when parent responsibility agreement signed; required before participant packages can be assigned" }
      - { name: assigned_packages, type: integer, source: input, default: 0, description: "Packages assigned to this participant for individual sale; >= 0" }
      - { name: paid_amount_cents, type: integer, source: input, default: 0, description: "Amount remitted by participant; >= 0" }
      - { name: outstanding_cents, type: integer, source: computed, description: "assigned_packages * season-average unit price (round_half_up per assignment, integer cents) - paid_amount_cents; floor 0" }
      - { name: incentive_tier, type: enum, source: computed, description: "NONE | BRONZE | SILVER | GOLD by assigned_packages thresholds on SELLING-season boundary rules (see calc participant_incentive_tier)" }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | DISPUTED | FORFEITED" }

  - name: RecallNotice
    parent: CookieSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> CookieSeason.id; owning season" }
      - { name: product_id, type: string, source: input, description: "FK -> CookieProduct.id; recalled variety" }
      - { name: reason, type: string, source: input, description: "Recall reason (e.g. allergen mislabel)" }
      - { name: effective_at, type: datetime, source: input, description: "Instant from which the recall blocks sales; must be >= season creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | LIFTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CookieSeason
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /cookie-program/seasons/{seasonId}/open"
        actor: CouncilAdmin
        preconditions:
          - "season.status == DRAFT (else ERR_SEASON_INVALID_STATE)"
          - "at least one CookieProduct exists for season (else ERR_PRODUCT_CATALOG_EMPTY)"
        side_effects:
          - "All DistributionSites of season: posture recomputed (DRAFT -> RECEIVING if capacity remains)"

      - from: OPEN
        to: SELLING
        trigger: "system (automatic when forecast_attainment_pct >= 80 AND current clock >= ordering_opens_at)"
        actor: system
        preconditions:
          - "forecast_attainment_pct >= 80 (attainment computed from confirmed+pending commits vs purchased_units)"
        side_effects:
          - "Booth lottery becomes drawable; FIRST_COME booth requests become acceptable"
          - "All DistributionSites of season: posture recomputed"

      - from: SELLING
        to: RECONCILIATION
        trigger: "POST /cookie-program/seasons/{seasonId}/begin-reconciliation"
        actor: CouncilAdmin
        preconditions:
          - "season.status == SELLING (else ERR_SEASON_INVALID_STATE)"
          - "no InventoryTransfer of season in status IN {REQUESTED, SHIPPER_SIGNED, RECEIVER_SIGNED} (else ERR_TRANSFER_IN_FLIGHT)"
          - "no BoothRequest of season in status PENDING (else ERR_BOOTH_REQUEST_PENDING)"
        side_effects:
          - "All DistributionSites of season: posture -> FROZEN"
          - "All BoothRequests with status APPROVED remain queryable; new requests rejected"

      - from: RECONCILIATION
        to: CLOSED
        trigger: "POST /cookie-program/seasons/{seasonId}/close-out"
        actor: CouncilAdmin
        preconditions:
          - "season.status == RECONCILIATION (else ERR_SEASON_INVALID_STATE)"
          - "every TroopAccount of season has uncollected_amount_cents == 0 OR all its PENDING agreements are FORFEITED (else ERR_UNRESOLVED_UNCOLLECTED)"
          - "no RecallNotice of season in status DRAFT (else ERR_RECALL_DRAFT_OPEN)"
        side_effects:
          - "Compute proceeds settlement per troop: TroopAccount.balance_cents := balance_cents - proceeds_accrued_cents (proceeds offset against amount owed)"
          - "Unsold inventory sweep: for each CookieProduct, unsold units (purchased minus committed minus fulfilled digital) are donated; bulk DonationRecord entries created per site (computed read via close-out response)"
          - "All ParticipantAgreements PENDING -> FORFEITED with forfeiture charge posted to TroopAccount"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /cookie-program/seasons/{seasonId}/cancel"
        actor: CouncilAdmin
        preconditions:
          - "season.status == DRAFT (else ERR_SEASON_INVALID_STATE)"
        side_effects:
          - "All DistributionSites posture -> FROZEN"

  - entity: CookieOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cookie-program/seasons/{seasonId}/orders/{orderId}/submit"
        actor: TroopLeader
        preconditions:
          - "order.status == DRAFT (else ERR_ORDER_INVALID_STATE)"
          - "order has >= 1 CookieOrderLine (else ERR_ORDER_EMPTY)"
          - "acting TroopLeader belongs to order.troop_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "season.status IN {OPEN, SELLING} for kind=INITIAL; season.status == SELLING for kind=REPLENISHMENT (else ERR_SEASON_NOT_ACCEPTING)"
          - "for kind=INITIAL: current clock within [ordering_opens_at, ordering_closes_at] inclusive (else ERR_ORDER_WINDOW_CLOSED)"
        side_effects:
          - "season.pending_commit_units += order.total_units; season.remaining_units recomputed"

      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /cookie-program/seasons/{seasonId}/orders/{orderId}/confirm"
        actor: CouncilAdmin
        preconditions:
          - "order.status == SUBMITTED (else ERR_ORDER_INVALID_STATE)"
          - "no ACTIVE RecallNotice exists for any product on the order's lines with effective_at <= now (else ERR_RECALLED_PRODUCT)"
          - "season.remaining_units >= order.total_units (allocation check, else ERR_SUPPLY_INSUFFICIENT)"
        side_effects:
          - "season.pending_commit_units -= total_units; season.initial_commit_units += total_units; remaining_units recomputed"
          - "order.total_amount_cents pinned from current product prices"
          - "TroopAccount(order.troop_id, season).balance_cents += total_amount_cents (charge)"
          - "TroopAccount.proceeds_accrued_cents += sum(line.package_qty * product.troop_proceeds_cents)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /cookie-program/seasons/{seasonId}/orders/{orderId}/reject"
        actor: CouncilAdmin
        preconditions:
          - "order.status == SUBMITTED (else ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "season.pending_commit_units -= total_units; remaining_units recomputed"
          - "order.rejection_reason set from request body"

      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /cookie-program/seasons/{seasonId}/orders/{orderId}/fulfill"
        actor: CouncilAdmin
        preconditions:
          - "order.status == CONFIRMED (else ERR_ORDER_INVALID_STATE)"
          - "season.status IN {OPEN, SELLING} (else ERR_SEASON_INVALID_STATE)"
        side_effects:
          - "no ledger change (charge already posted at CONFIRMED)"

  - entity: InventoryTransfer
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SHIPPER_SIGNED
        trigger: "POST /cookie-program/transfers/{transferId}/sign-ship"
        actor: TroopLeader
        preconditions:
          - "transfer.status == REQUESTED (else ERR_TRANSFER_INVALID_STATE)"
          - "acting troop == transfer.source_troop_id, or CouncilAdmin acts when source is cupboard (site_id set, source_troop_id null)"
          - "segregation of duties: signing troop must differ from the troop that created the request when requester was a troop (else ERR_SOD_SAME_TROOP)"
          - "if sourced from site: site.available_units >= package_qty (else ERR_SUPPLY_INSUFFICIENT)"
        side_effects:
          - "transfer.shipper_signed_by_troop_id := acting troop"
          - "if site-sourced: site.hold_units += package_qty (hold placed)"

      - from: SHIPPER_SIGNED
        to: RECEIVER_SIGNED
        trigger: "POST /cookie-program/transfers/{transferId}/sign-receive"
        actor: TroopLeader
        preconditions:
          - "transfer.status == SHIPPER_SIGNED (else ERR_TRANSFER_INVALID_STATE)"
          - "acting troop == transfer.dest_troop_id (or CouncilAdmin when dest is cupboard)"
          - "acting troop != transfer.shipper_signed_by_troop_id (segregation of duties, else ERR_SOD_SAME_TROOP)"
        side_effects:
          - "transfer.receiver_signed_by_troop_id := acting troop"

      - from: RECEIVER_SIGNED
        to: COMPLETED
        trigger: "POST /cookie-program/transfers/{transferId}/complete"
        actor: CouncilAdmin
        preconditions:
          - "transfer.status == RECEIVER_SIGNED (else ERR_TRANSFER_INVALID_STATE)"
          - "OCC: expected_transfer_version matches current version (else ERR_STALE_VERSION)"
          - "no ACTIVE RecallNotice on transfer.product_id with effective_at <= now (else ERR_RECALLED_PRODUCT)"
        side_effects:
          - "if site-sourced: site.hold_units -= package_qty and site outbound recorded (available_units decreases)"
          - "if site-destined (return to cupboard): site.received_units unchanged, available_units increases by package_qty"
          - "both troop accounts noted (memo only; no balance change — transfers move inventory, not money)"
          - "if counter_transfer_id set and counter-transfer status == RECEIVER_SIGNED: counter-transfer auto-completes too (swap symmetry)"

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /cookie-program/transfers/{transferId}/decline"
        actor: TroopLeader
        preconditions:
          - "transfer.status == REQUESTED (else ERR_TRANSFER_INVALID_STATE)"
          - "acting troop == source_troop_id or dest_troop_id"
        side_effects: []

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /cookie-program/transfers/{transferId}/cancel"
        actor: TroopLeader
        preconditions:
          - "transfer.status == REQUESTED (else ERR_TRANSFER_INVALID_STATE)"
          - "acting troop == requesting troop"
        side_effects: []

      - from: SHIPPER_SIGNED
        to: REQUESTED
        trigger: "POST /cookie-program/transfers/{transferId}/retract-ship-signature"
        actor: TroopLeader
        preconditions:
          - "transfer.status == SHIPPER_SIGNED (else ERR_TRANSFER_INVALID_STATE)"
          - "acting troop == shipper_signed_by_troop_id"
        side_effects:
          - "shipper_signed_by_troop_id := null"
          - "if site-sourced: site.hold_units -= package_qty (hold released)"

  - entity: BoothRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /cookie-program/booth-requests/{requestId}/approve (FIRST_COME auto or manual) or POST /cookie-program/booth-slots/{slotId}/draw-lottery (LOTTERY)"
        actor: CouncilAdmin
        preconditions:
          - "request.status == PENDING (else ERR_REQUEST_INVALID_STATE)"
          - "season.status == SELLING (else ERR_SEASON_NOT_SELLING)"
          - "location.host_permission_granted == true (else ERR_HOST_PERMISSION_MISSING)"
          - "approved count on slot < slot.capacity_troops (else ERR_BOOTH_CAPACITY_FULL)"
          - "for LOTTERY mode: lottery_rank <= 2 (else ERR_REQUEST_INVALID_STATE with decision_reason RANK_GT_2 -> routed to DENIED at draw instead)"
          - "approving CouncilAdmin's session troop (if the admin also leads a troop) must not equal request.troop_id when acting as TroopLeader-side approver — segregation enforced by role separation: only CouncilAdmin may approve"
        side_effects:
          - "slot occupancy += 1"

      - from: PENDING
        to: DENIED
        trigger: "system (lottery draw) or POST /cookie-program/booth-requests/{requestId}/deny"
        actor: CouncilAdmin
        preconditions:
          - "request.status == PENDING (else ERR_REQUEST_INVALID_STATE)"
        side_effects:
          - "decision_reason recorded"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /cookie-program/booth-requests/{requestId}/cancel"
        actor: TroopLeader
        preconditions:
          - "request.status == PENDING (else ERR_REQUEST_INVALID_STATE)"
          - "acting troop == request.troop_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /cookie-program/booth-requests/{requestId}/cancel"
        actor: TroopLeader
        preconditions:
          - "request.status == APPROVED (else ERR_REQUEST_INVALID_STATE)"
          - "acting troop == request.troop_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "slot occupancy -= 1 (capacity freed)"

  - entity: DigitalOrder
    initial_state: PENDING_PAYMENT
    terminal_states: [REFUNDED_CANCELLED]
    note: "parallel dimensions: payment_status {PENDING, PAID, UNCOLLECTED, REFUNDED} evolves independently of fulfillment_status {OPEN, DELIVERED, CANCELLED}; combined terminal when payment_status == REFUNDED and fulfillment_status == CANCELLED"
    transitions:
      - from: "payment_status: PENDING"
        to: "payment_status: PAID"
        trigger: "POST /cookie-program/digital-orders/{orderId}/record-payment"
        actor: TroopLeader
        preconditions:
          - "payment_status == PENDING (else ERR_PAYMENT_INVALID_STATE)"
          - "season.status == SELLING (else ERR_SEASON_NOT_SELLING)"
        side_effects:
          - "TroopAccount.proceeds_accrued_cents += sum(items qty * product.troop_proceeds_cents)"
          - "TroopAccount.balance_cents += total_amount_cents (customer remittance charge)"

      - from: "payment_status: PENDING"
        to: "payment_status: UNCOLLECTED"
        trigger: "POST /cookie-program/digital-orders/{orderId}/mark-uncollected"
        actor: TroopLeader
        preconditions:
          - "payment_status == PENDING (else ERR_PAYMENT_INVALID_STATE)"
          - "fulfillment_type == IN_PERSON (shipped orders cannot be uncollected, else ERR_FULFILLMENT_TYPE_MISMATCH)"
        side_effects:
          - "ParticipantAgreement linkage: if agreement_id provided, its outstanding_cents += total_amount_cents and agreement.status -> PENDING (if was PAID, stays PAID — no-op on status)"

      - from: "payment_status: PAID"
        to: "payment_status: REFUNDED"
        trigger: "POST /cookie-program/digital-orders/{orderId}/refund"
        actor: CouncilAdmin
        preconditions:
          - "payment_status == PAID (else ERR_PAYMENT_INVALID_STATE)"
          - "fulfillment_status != DELIVERED (else ERR_ALREADY_DELIVERED)"
        side_effects:
          - "TroopAccount.balance_cents -= total_amount_cents (refund credit)"
          - "TroopAccount.proceeds_accrued_cents -= sum(items qty * troop_proceeds_cents) (proceeds clawback)"

      - from: "fulfillment_status: OPEN"
        to: "fulfillment_status: DELIVERED"
        trigger: "POST /cookie-program/digital-orders/{orderId}/mark-delivered"
        actor: TroopLeader
        preconditions:
          - "fulfillment_status == OPEN (else ERR_FULFILLMENT_INVALID_STATE)"
          - "payment_status == PAID (else ERR_UNPAID_DELIVERY)"
          - "no ACTIVE RecallNotice on any item product with effective_at <= now (else ERR_RECALLED_PRODUCT)"
        side_effects: []

      - from: "fulfillment_status: OPEN"
        to: "fulfillment_status: CANCELLED"
        trigger: "POST /cookie-program/digital-orders/{orderId}/cancel"
        actor: TroopLeader
        preconditions:
          - "fulfillment_status == OPEN (else ERR_FULFILLMENT_INVALID_STATE)"
          - "payment_status != PAID OR refund processed first (guarded: cancelling a PAID order requires refund first, else ERR_REFUND_REQUIRED)"
        side_effects: []

  - entity: BakerPurchaseOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: "POST /cookie-program/seasons/{seasonId}/baker-pos/{poId}/place"
        actor: CouncilAdmin
        preconditions:
          - "po.status == DRAFT (else ERR_PO_INVALID_STATE)"
          - "season.status IN {DRAFT, OPEN} (else ERR_SEASON_INVALID_STATE)"
        side_effects:
          - "season.purchased_units += quantity; remaining_units recomputed"

      - from: ORDERED
        to: PARTIALLY_DELIVERED
        trigger: "POST /cookie-program/seasons/{seasonId}/baker-pos/{poId}/record-delivery (delivered_now < quantity)"
        actor: CouncilAdmin
        preconditions:
          - "po.status IN {ORDERED, PARTIALLY_DELIVERED} (else ERR_PO_INVALID_STATE)"
          - "delivered_qty + delivered_now <= quantity (else ERR_OVERDELIVERY)"
          - "site.posture == RECEIVING and site.received_units + delivered_now <= site.capacity_units (else ERR_SITE_CAPACITY_EXCEEDED)"
        side_effects:
          - "po.delivered_qty += delivered_now"
          - "site.received_units += delivered_now; posture recomputed (FULL at capacity)"

      - from: ORDERED
        to: DELIVERED
        trigger: "POST /cookie-program/seasons/{seasonId}/baker-pos/{poId}/record-delivery (delivered_now == quantity)"
        actor: CouncilAdmin
        preconditions:
          - "same as PARTIALLY_DELIVERED; cumulative delivered_qty + delivered_now == quantity exactly"
        side_effects:
          - "same as PARTIALLY_DELIVERED"

      - from: PARTIALLY_DELIVERED
        to: DELIVERED
        trigger: "POST /cookie-program/seasons/{seasonId}/baker-pos/{poId}/record-delivery (cumulative == quantity)"
        actor: CouncilAdmin
        preconditions:
          - "same as above"
        side_effects:
          - "same as above"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /cookie-program/seasons/{seasonId}/baker-pos/{poId}/cancel"
        actor: CouncilAdmin
        preconditions:
          - "po.status == DRAFT (else ERR_PO_INVALID_STATE)"
        side_effects: []

  - entity: RecallNotice
    initial_state: DRAFT
    terminal_states: [LIFTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cookie-program/seasons/{seasonId}/recalls/{recallId}/activate"
        actor: CouncilAdmin
        preconditions:
          - "recall.status == DRAFT (else ERR_RECALL_INVALID_STATE)"
          - "season.status IN {OPEN, SELLING} (else ERR_SEASON_INVALID_STATE)"
        side_effects:
          - "blocks: order confirm, transfer complete, digital-order delivery for the recalled product (effective_at <= now)"
          - "cascade depth-2: each SUBMITTED CookieOrder containing the product gets flag review_required (surfaced on order read); season remaining_units unchanged (stock quarantined logically, not removed)"

      - from: ACTIVE
        to: LIFTED
        trigger: "POST /cookie-program/seasons/{seasonId}/recalls/{recallId}/lift"
        actor: CouncilAdmin
        preconditions:
          - "recall.status == ACTIVE (else ERR_RECALL_INVALID_STATE)"
        side_effects:
          - "blocks released"

  - entity: ParticipantAgreement
    initial_state: PENDING
    terminal_states: [PAID, FORFEITED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /cookie-program/agreements/{agreementId}/settle"
        actor: TroopLeader
        preconditions:
          - "agreement.status IN {PENDING, DISPUTED} (else ERR_AGREEMENT_INVALID_STATE)"
          - "paid_amount_cents covers outstanding in full after this settle (else ERR_UNDERPAID)"
        side_effects:
          - "TroopAccount.uncollected_amount_cents recomputed; TroopAccount.balance_cents -= settle_amount (credit posting)"
          - "incentive_tier recomputed (settlement can be reported with final tier)"

      - from: PENDING
        to: DISPUTED
        trigger: "POST /cookie-program/agreements/{agreementId}/dispute"
        actor: TroopLeader
        preconditions:
          - "agreement.status == PENDING (else ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "TroopAccount.uncollected_amount_cents unchanged (still counted)"

      - from: DISPUTED
        to: PENDING
        trigger: "POST /cookie-program/agreements/{agreementId}/resolve-dispute"
        actor: CouncilAdmin
        preconditions:
          - "agreement.status == DISPUTED (else ERR_AGREEMENT_INVALID_STATE)"
        side_effects: []

      - from: PENDING
        to: FORFEITED
        trigger: "system (season close-out sweep) or POST /cookie-program/agreements/{agreementId}/forfeit"
        actor: CouncilAdmin
        preconditions:
          - "agreement.status IN {PENDING, DISPUTED} (else ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "TroopAccount.balance_cents += outstanding_cents (forfeiture charge — parent responsibility enforced at troop level)"
          - "TroopAccount.uncollected_amount_cents recomputed (forfeited no longer counted as uncollected)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: site-approve-stale-season
    parent_entity: CookieSeason
    write_endpoint: "POST /cookie-program/seasons/{seasonId}/sites"
    occ_field: "expected_season_version"
    description: |
      Creating a DistributionSite against a CookieSeason whose version has
      advanced since the client last observed it is rejected. Captures the case
      where another writer has just mutated season-level commitments (order
      confirm / PO placement legitimately recomputes remaining_units and bumps
      version) and the site creator's view of season capacity context is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transfer-complete-stale-transfer
    parent_entity: InventoryTransfer
    write_endpoint: "POST /cookie-program/transfers/{transferId}/complete"
    occ_field: "expected_transfer_version"
    description: |
      Completing an InventoryTransfer whose version has advanced since the
      completing admin last observed it (e.g. a ship-signature retraction
      bumped version and re-opened signature state) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: season_remaining_units
    trigger: "on any CookieOrder submit/confirm/reject and on any BakerPurchaseOrder place/cancel within the season"
    algorithm: aggregation
    formula: |
      purchased_units = SUM(bpo.quantity) for bpo.status IN {ORDERED, PARTIALLY_DELIVERED, DELIVERED}
      initial_commit_units = SUM(line.package_qty) over lines of orders with status IN {CONFIRMED, FULFILLED}
      pending_commit_units = SUM(line.package_qty) over lines of orders with status SUBMITTED
      remaining_units = purchased_units - initial_commit_units - pending_commit_units
    input_set: "BakerPurchaseOrders of season excluding DRAFT/CANCELLED; CookieOrders of season in the states named above"
    constants: {}
    precision: "integer packages"

  - name: forecast_attainment_pct
    trigger: "recomputed whenever initial_commit_units or purchased_units changes; polled by auto-transition OPEN->SELLING"
    algorithm: threshold
    formula: |
      if purchased_units == 0: attainment = null (gate never opens)
      else: attainment = round_half_up(100.0 * initial_commit_units / purchased_units, 2)
      gate: attainment >= 80.00 opens SELLING; attainment > 120.00 signals over-commit (advisory flag on season read)
    input_set: "as season_remaining_units"
    constants:
      SELLING_GATE_PCT: 80.00
      OVER_COMMIT_PCT: 120.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_attainment
        when: "while season OPEN and orders still SUBMITTED"
        difference: "counts pending_commit_units in the numerator: (initial_commit_units + pending_commit_units) / purchased_units; used only on season summary read, never for the SELLING gate"
      - name: final_attainment
        when: "gate evaluation and all reporting after SELLING"
        difference: "numerator is initial_commit_units only (confirmed demand); produces a LOWER percentage than provisional for identical data whenever pending orders exist"

  - name: troop_proceeds_settlement
    trigger: "season close-out (RECONCILIATION -> CLOSED)"
    algorithm: waterfall_allocation
    formula: |
      for each TroopAccount of season:
        gross_proceeds = proceeds_accrued_cents   # accumulated per-package proceeds over confirmed orders + paid digital orders
        balance_offset = min(gross_proceeds, max(balance_cents, 0))
        balance_cents := balance_cents - balance_offset        # proceeds first offset what the troop owes
        proceeds_payable_cents = gross_proceeds - balance_offset  # overflow payable to troop
    input_set: "all TroopAccounts of the season; all ParticipantAgreements in PENDING|DISPUTED are FORFEITED first (their outstanding becomes a charge) before this waterfall runs"
    constants: {}
    precision: "integer cents"
    note: "Waterfall order pinned: forfeiture charges post first, then proceeds offset; swapping the order changes balance_cents when proceeds < charges"

  - name: per_unit_proceeds_blended
    trigger: "on demand via GET /cookie-program/seasons/{id}/proceeds-report"
    algorithm: aggregation
    formula: |
      blended_proceeds_cents = round_half_up( SUM(line.package_qty * product.troop_proceeds_cents) / NULLIF(SUM(line.package_qty),0), 0 )
      over CONFIRMED|FULFILLED CookieOrderLines of the troop within the season
    input_set: "CookieOrderLines joined to CookieOrder (status filter) and CookieProduct"
    constants: {}
    precision: "round per-line to integer cents, THEN sum, THEN divide; rounding order pinned: per-line products are exact integers (cents * qty), so per-line rounding is identity; division rounds once at the end, round_half_up"

  - name: participant_incentive_tier
    trigger: "on ParticipantAgreement create/update and at settle"
    algorithm: threshold
    formula: |
      tier = GOLD   if assigned_packages >= 100
             SILVER if assigned_packages >= 50
             BRONZE if assigned_packages >= 20
             NONE   otherwise
      boundary rule: thresholds are INCLUSIVE (>=); exactly 20 -> BRONZE, 19 -> NONE
    input_set: "single ParticipantAgreement"
    constants:
      BRONZE_MIN: 20
      SILVER_MIN: 50
      GOLD_MIN: 100
    precision: "integer packages"

  - name: booth_lottery_draw
    trigger: "POST /cookie-program/booth-slots/{slotId}/draw-lottery"
    algorithm: constraint_propagation
    formula: |
      candidates = BoothRequests on slot with status PENDING and mode LOTTERY and lottery_rank <= 2
      order candidates by (lottery_rank ASC, created_at ASC)   # rank, then earliest submission; id NEVER used
      approve the first (slot.capacity_troops - current_approved_count) candidates
      deny the remainder with decision_reason = 'LOTTERY_LOST'
      candidates with lottery_rank > 2 are denied at draw with decision_reason = 'RANK_GT_2'
    input_set: "PENDING BoothRequests of the slot only; season must be SELLING; location host permission must be granted"
    constants: {}
    precision: "n/a"

  - name: site_available_units
    trigger: "on transfer sign-ship / retract / complete / decline affecting the site, and on delivery record"
    algorithm: aggregation
    formula: |
      available = received_units
                  - SUM(package_qty) over site-sourced transfers with status IN {REQUESTED, SHIPPER_SIGNED}
                  - SUM(package_qty) over site-sourced transfers with status IN {RECEIVER_SIGNED, COMPLETED}
      (holds occupy the first bucket; completed shipments the second; RECEIVER_SIGNED already counts as shipped-out)
    input_set: "InventoryTransfers with site_id == site AND source_troop_id IS NULL (site-sourced)"
    constants: {}
    precision: "integer packages"

  - name: digital_order_total
    trigger: "DigitalOrder creation"
    algorithm: aggregation
    formula: |
      items_total = SUM(item.package_qty * product.unit_price_cents)   # current price pinned at create
      donation_unit_price = round_half_up( SUM(p.unit_price_cents) / COUNT(p), 0 ) over all season CookieProducts
      total_amount_cents = items_total + donation_units * donation_unit_price
    input_set: "items of this order; all CookieProducts of season (donation price basis — recall status does NOT exclude a product from the basis)"
    constants: {}
    precision: "integer cents; donation unit price rounded once (round_half_up) then multiplied — order pinned: average-then-round-then-multiply, NOT multiply-then-sum"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "path ids (season, order, transfer, slot, request, recall, agreement, po, site) exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "target resource in a state from which the requested transition exists (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "no ACTIVE RecallNotice (effective_at <= now) covers any product involved in order-confirm, transfer-complete, or digital-order-deliver"
    error_id: ERR_RECALLED_PRODUCT
    http_status: 422
    applies_to: ["POST /cookie-program/seasons/{seasonId}/orders/{orderId}/confirm", "POST /cookie-program/transfers/{transferId}/complete", "POST /cookie-program/digital-orders/{orderId}/mark-delivered"]

  - priority: 6
    category: business_referential
    check: "FK targets consistent: order.troop_id matches acting TroopLeader's troop; transfer products belong to same season; agreement.troop_id matches digital order troop when linked"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: ["POST /cookie-program/seasons/{seasonId}/orders/{orderId}/submit", "POST /cookie-program/booth-requests/{requestId}/cancel", "POST /cookie-program/transfers/{transferId}/sign-ship", "POST /cookie-program/transfers/{transferId}/sign-receive"]

  - priority: 7
    category: business_safety
    check: "segregation of duties: transfer ship-signer troop != requester troop; receive-signer troop != ship-signer troop"
    error_id: ERR_SOD_SAME_TROOP
    http_status: 422
    applies_to: ["POST /cookie-program/transfers/{transferId}/sign-ship", "POST /cookie-program/transfers/{transferId}/sign-receive"]

  - priority: 8
    category: business_constraint
    check: "BoothRequest creation: location.host_permission_granted true; slot date not in location.blackout_dates; [start_at, end_at) half-open overlap vs existing slots at same location rejected (touching boundaries allowed); troop may hold at most one PENDING|APPROVED request per slot"
    error_id: ERR_BOOTH_CONFLICT
    http_status: 409
    applies_to: ["POST /cookie-program/booth-slots", "POST /cookie-program/booth-slots/{slotId}/requests"]

  - priority: 9
    category: business_temporal
    check: "season.status and clock gates: INITIAL orders only within [ordering_opens_at, ordering_closes_at] inclusive; booth approve/draw only when SELLING; digital-order payment only when SELLING"
    error_id: ERR_SEASON_NOT_ACCEPTING
    http_status: 422
    applies_to: ["POST /cookie-program/seasons/{seasonId}/orders", "POST /cookie-program/seasons/{seasonId}/orders/{orderId}/submit", "POST /cookie-program/booth-requests/{requestId}/approve", "POST /cookie-program/booth-slots/{slotId}/draw-lottery", "POST /cookie-program/digital-orders/{orderId}/record-payment"]

  - priority: 10
    category: business_constraint
    check: "case-pack constraint: every CookieOrderLine.package_qty and InventoryTransfer.package_qty is a positive multiple of product.packages_per_case"
    error_id: ERR_CASE_PACK_VIOLATION
    http_status: 422
    applies_to: ["POST /cookie-program/seasons/{seasonId}/orders/{orderId}/lines", "POST /cookie-program/transfers"]

  - priority: 11
    category: business_constraint
    check: "aggregate capacity: order confirm requires season.remaining_units >= order.total_units; site-sourced transfer sign-ship requires site.available_units >= package_qty; delivery record requires site.received_units + delivered_now <= capacity_units"
    error_id: ERR_SUPPLY_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /cookie-program/seasons/{seasonId}/orders/{orderId}/confirm", "POST /cookie-program/transfers/{transferId}/sign-ship", "POST /cookie-program/seasons/{seasonId}/baker-pos/{poId}/record-delivery"]

  - priority: 12
    category: business_fiscal
    check: "fiscal guard: proceeds fields satisfy 0 < troop_proceeds_cents < unit_price_cents; settle requires full coverage; forfeiture charge = outstanding_cents at forfeit time"
    error_id: ERR_FISCAL_VIOLATION
    http_status: 422
    applies_to: ["POST /cookie-program/seasons/{seasonId}/products", "POST /cookie-program/agreements/{agreementId}/settle", "POST /cookie-program/agreements/{agreementId}/forfeit"]

  - priority: 13
    category: business_constraint
    check: "OCC: expected_*_version matches parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /cookie-program/seasons/{seasonId}/sites", "POST /cookie-program/transfers/{transferId}/complete"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Season lifecycle ----
  - method: POST
    path: "/cookie-program/seasons"
    description: "Create a CookieSeason in DRAFT"
    roles: [CouncilAdmin]
    code: 201
    input: [code, name, ordering_opens_at, ordering_closes_at]
    output: CookieSeason
    side_effects: ["season.version starts at 1"]

  - method: GET
    path: "/cookie-program/seasons"
    description: "List seasons (paginated)"
    roles: [CouncilAdmin, TroopLeader]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CookieSeason[]"
    side_effects: []

  - method: GET
    path: "/cookie-program/seasons/{seasonId}"
    description: "Get one season incl. computed commitment/attainment fields"
    roles: [CouncilAdmin, TroopLeader]
    code: 200
    input: []
    output: CookieSeason
    side_effects: []

  - method: POST
    path: "/cookie-program/seasons/{seasonId}/open"
    description: "DRAFT -> OPEN"
    roles: [CouncilAdmin]
    code: 200
    input: []
    output: CookieSeason
    side_effects: ["site posture recompute", "increments CookieSeason.version by 1"]

  - method: POST
    path: "/cookie-program/seasons/{seasonId}/begin-reconciliation"
    description: "SELLING -> RECONCILIATION (guarded: no in-flight transfers, no PENDING booth requests)"
    roles: [CouncilAdmin]
    code: 200
    input: []
    output: CookieSeason
    side_effects: ["sites posture -> FROZEN", "increments CookieSeason.version by 1"]

  - method: POST
    path: "/cookie-program/seasons/{seasonId}/close-out"
    description: "RECONCILIATION -> CLOSED; runs forfeiture sweep then proceeds waterfall; returns settlement summary"
    roles: [CouncilAdmin]
    code: 200
    input: []
