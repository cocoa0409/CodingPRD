      - name: determine_allowed_exceeds_filed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_ALLOWED_EXCEEDS_FILED]"]
        distinguishing_aspect: "Allowed amount may not exceed the filed amount: determining ALLOWED at 150000 against a 100000 filing is rejected with ERR_ALLOWED_EXCEEDS_FILED (422)."
