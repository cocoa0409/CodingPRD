            - { call: "POST /orders/${ord1_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
          trigger:
            - { call: "GET /benefit-periods/${per_ada_id}", as: ProgramAdmin }
            - { call: "POST /orders/${ord1_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "GET /benefit-periods/${per_ada_id}", as: ProgramAdmin }
            - { call: "POST /benefit-periods/${per_ada_id}/close", payload: { mode: "FINAL" }, as: ProgramAdmin }
            - { call: "GET /benefit-periods/${per_ada_id}", as: ProgramAdmin }
          assert:
            - "at the first read: allocated 50000 == available 47500 + reserved 2500 + spent 0 + forfeited 0 + rollover_out 0"
            - "after the deliver: allocated 50000 == available 47500 + reserved 0 + spent 2500 + forfeited 0 + rollover_out 0"
            - "after the FINAL close: available_cents == 0, rollover_out_cents == 12500, forfeited_cents == 35000, spent_cents == 2500"
            - "allocated 50000 == 0 + 0 + 2500 + 35000 + 12500 at the third read, so nothing is created or lost by the close"
            - "rollover_out_cents 12500 == round_half_up(50000 * 0.25) and is capped below available_cents 47500"

      - name: refund_pulls_ytd_imputed_back_below_threshold_and_restores_flag_to_none
        grounds:
          - calculations.imputed_income_accrual
          - entities.Employee.fields.tax_treatment_flag
          - entities.ImputedIncomeRecord.fields.taxable_cents
          - state_machines.Order.CAPTURED_to_PARTIALLY_REFUNDED
        distinguishing_aspect: |
          The reporting flag must be a RECOMPUTED FUNCTION of the current cumulative total, not a
          latch: two deliveries push ytd_imputed_cents to exactly 1000 and set W2_IMPUTED, then a
          proportional refund that drops one order's employer share to 1927 (below the 2000
          de-minimis line) takes taxable_cents to 500 and the flag back to NONE.
        test_recipe:
          setup:
            - "Program (DE_MINIMIS_EXCLUSION) / Engineering / HQ dock / Thai Garden / Ada with an OPEN 2026-08 period."
            - "Two identical 3 x 1000 orders with tip 200 are DELIVERED, one for 2026-08-03 and one for 2026-08-04, each contributing taxable 500."
            - "ImputedIncomeRecord 2026-08 therefore holds gross 5000 / taxable 1000 and Employee.tax_treatment_flag is W2_IMPUTED."
            - "A MISSING_ITEM claim of 1000 on line 0 of the first order is resolved APPROVE / PROPORTIONAL by ctrl-resolver."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0, taxable_benefit_method: "DE_MINIMIS_EXCLUSION" }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_eng_id: $.data.id, grp_eng_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_eng_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "PERSONAL_CARD", tip_coverage_policy: "EMPLOYEE_PAYS_TIP" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_eng_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_eng_id}/activate", payload: { expected_employee_group_version: "${grp_eng_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_hq_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0, max_concurrent_group_deliveries: 1 }, as: PlatformAdmin, captures: { rest_thai_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ada_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ada_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_ada_id: $.data.id, per_ada_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord1_id: $.data.id } }
            - { call: "POST /orders/${ord1_id}/place", payload: { expected_benefit_period_version: "${per_ada_v}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord1_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /orders/${ord1_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}", captures: { ord1_v: $.data.version } }
            - { call: "GET /benefit-periods/${per_ada_id}", as: ProgramAdmin, captures: { per_ada_v2: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-04T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord2_id: $.data.id } }
            - { call: "POST /orders/${ord2_id}/place", payload: { expected_benefit_period_version: "${per_ada_v2}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord2_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /orders/${ord2_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /credit-claims", payload: { order_id: "${ord1_id}", claim_type: "MISSING_ITEM", claimed_cents: 1000, line_index: 0 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { clm1_id: $.data.id } }
            - { call: "POST /credit-claims/${clm1_id}/resolve", payload: { decision: "APPROVE", approved_cents: 1000, routing_basis: "PROPORTIONAL", expected_order_version: "${ord1_v}" }, as: BenefitsController, as_user_id: "ctrl-resolver" }
          trigger:
            - { call: "POST /credit-claims/${clm1_id}/settle", as: BenefitsController, as_user_id: "ctrl-settler" }
            - { call: "GET /employees/${emp_ada_id}/imputed-income-records", payload: { tax_month: "2026-08" }, as: ProgramAdmin }
            - { call: "GET /employees/${emp_ada_id}", as: ProgramAdmin }
            - { call: "GET /benefit-periods/${per_ada_id}", as: ProgramAdmin }
          assert:
            - "Order.${ord1_id}.employer_net_cents == 1927 and taxable_cents == 0, while Order.${ord2_id}.taxable_cents stays 500"
            - "the single ImputedIncomeRecord for 2026-08 has gross_employer_paid_cents == 4427 and taxable_cents == 500"
            - "Employee.${emp_ada_id}.ytd_imputed_cents == 500 and tax_treatment_flag == NONE, reverted from W2_IMPUTED"
            - "BenefitPeriod.${per_ada_id}.spent_cents == 4427 and available_cents == 45573"
            - "record taxable_cents 500 equals the sum of the two orders' current taxable_cents (0 + 500), so the aggregate is recomputed rather than decremented blindly"
