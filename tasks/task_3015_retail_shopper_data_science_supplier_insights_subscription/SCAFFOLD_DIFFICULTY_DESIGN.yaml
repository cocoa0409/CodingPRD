            - "LineReviewCycle.${cyc}.planned_open_count == 0 (cascade D, caused by the blocking)"
            - "SubscriptionContract.${contract}.report_credits_reserved == 0 (reservation refunded)"
            - "SubscriptionContract.${contract}.status == SUSPENDED"

