  - rule_id: resource_temporal_overlap
    instances:
      - name: participant_session_buffer_is_half_open_on_both_sides
        grounds:
          - validations[priority=35]
          - entities.Recruitment.fields.scheduled_start
          - entities.Recruitment.fields.scheduled_end
          - errors.ERR_PARTICIPANT_SESSION_CONFLICT
        distinguishing_aspect: |
          The contended resource is a single Participant's calendar, and the interval semantics are
          half-open with a 30-minute buffer padded onto both sides of the incoming request:
          [start - 30 min, end + 30 min) versus the existing [start, end). A request starting 15 minutes
          after the previous session ends collides, while one starting exactly 30 minutes after it ends
          touches the buffer edge and is allowed - the padded comparison must not be inclusive.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "One pool with contact_cap_per_window 2 and a single participant"
            - "Two INTERVIEW studies sharing that pool, both FIELDING, so the participant can hold one recruitment in each"
            - "Consent on file for the participant in both studies"
            - "The study-1 recruitment already SCHEDULED for 2026-08-05T14:00:00Z to 15:00:00Z"
