            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025551111", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/call-attestations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025551111", called_number: "+12025559999", origination_time: "2026-08-02T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Regulator
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
