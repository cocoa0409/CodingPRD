      - name: first_match_wins_across_three_priority_pairs
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_NOT_ASSIGNED_INSPECTOR]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_NOT_OWNER]
          - errors[ERR_STALE_LOAN_VERSION]
        distinguishing_aspect: "Each trigger violates two rows at once and the lower-numbered row always wins: 6 beats 7 (wrong inspector AND a one-of-three report), 3 beats 4 (missing term_months AND an unresolvable borrower_id), 5 beats 8 (a non-owner sponsor AND a stale expected_loan_version), and the same stale version submitted by the owner finally surfaces as ERR_STALE_LOAN_VERSION - which proves the version really was stale in trigger 3 and was simply outranked."
