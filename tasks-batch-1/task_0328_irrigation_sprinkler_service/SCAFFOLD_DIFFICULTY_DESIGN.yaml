  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_stop_half_open_overlap_rejected_adjacent_allowed
        grounds:
          - validations[priority=11]
          - entities.RouteStop.fields.arrival_start_sec
          - entities.RouteStop.fields.window_minutes
        distinguishing_aspect: |
          Route resource, half-open interval semantics [start, start+win*60): a second stop starting
          INSIDE the first stop's window is rejected (ERR_ROUTESTOP_TIME_OVERLAP), while a stop
          starting exactly at the first's end (adjacency, gap=0) is allowed.
        test_recipe:
          setup:
            - "A PLANNING route with one SCHEDULED stop occupying [28800, 32400) (08:00–09:00)."
          setup_api_calls:
            - call: "POST /customers"
