      - name: ep_launch_readiness_aggregate_tracks_the_clock_and_the_lock
        claim_type: derived_endpoint
        grounds:
          - endpoints[GET /innovation-projects/{id}/launch-readiness].output
          - calculations[launch_readiness_pct].LOCK_LEAD_DAYS
        distinguishing_aspect: |
          The aggregate read is computed at request time, not stored: with no lock in place
          launch_date is null and earliest_lockable_date is exactly 45 days after the current
          clock, so moving the clock 10 days moves the answer 10 days without any write.
