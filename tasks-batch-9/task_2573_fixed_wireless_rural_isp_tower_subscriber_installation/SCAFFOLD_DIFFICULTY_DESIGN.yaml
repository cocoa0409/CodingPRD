# SCAFFOLD_DIFFICULTY_DESIGN.yaml - §1.8 Test Targeting Index
# Task 2573: Fixed-Wireless Rural ISP Tower & Subscriber Installation
# Nine §0.5 rule_id blocks, two differentiated instances each (18 instances total).
# Every numeric literal in every `assert:` line was produced by executing the matching
# §1.4 `calculations[].formula` against its `constants:` in Python - none is an estimate.
# The logical clock startup default is 2026-08-01T00:00:00Z; instances that need another
# instant move it explicitly with POST /_clock/set_current_utc.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: los_desktop_lidar_vs_field_survey_variant_divergence
        grounds:
          - calculations.los_qualification_mast_height
          - entities.ServiceabilityRequest.fields.desktop_required_mast_height_m
          - entities.ServiceabilityRequest.fields.desktop_mounting_type
          - entities.ServiceabilityRequest.fields.desktop_los_margin_m
          - entities.InstallWorkOrder.fields.recommended_mast_height_m
          - entities.InstallWorkOrder.fields.recommended_mounting_type
          - state_machines.InstallWorkOrder.SCHEDULED_to_EXCEPTION_PENDING
        distinguishing_aspect: |
          This instance lives in the RF-path/site-geometry entity domain (ServiceabilityRequest ->
          InstallWorkOrder): on one identical premise the DESKTOP_LIDAR variant consumes the
          declared tree line 3.0 m and yields desktop_required_mast_height_m == 2.5 with
          desktop_mounting_type == NON_PEN_ROOF_TRIPOD, while the FIELD_SURVEY variant consumes the
          measured tree line 5.5 m and yields recommended_mast_height_m == 5.0 with
          recommended_mounting_type == ROOF_MAST_GUYED, so the two variants disagree on the
          mounting band and route the work order into a different fork branch.
        test_recipe:
          setup:
            - "One ACTIVE Tower RB-TWR-001 at ground_elevation_m 1200.0 with antenna_agl_m 45.0, backed by one ACCEPTED BackhaulCircuit of 500 Mbps."
            - "One ACTIVE Sector on that tower, capacity_mbps 25, max_oversubscription_ratio 8.0, capacity_posture OPEN."
            - "One ServicePlan STD50 at 50 Mbps downstream."
            - "One QUALIFIED ServiceabilityRequest for a premise at ground 1210.0 m, roof 4.0 m, declared tree line 3.0 m, obstruction CLEAR, path 5.0 km, carrying its DESKTOP_LIDAR outputs."
            - "That request converted into a PENDING_INSTALL Subscriber with one SCHEDULED InstallWorkOrder."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_v1: $.data.version }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Dana Reyes", premise_latitude: 41.2600, premise_longitude: -104.7600, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr1_id: $.data.id }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr1_id}", expected_sector_version: "${sector_v1}" }
              as: SalesAgent
              captures: { hold1_id: $.data.id }
            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr1_id}", service_plan_id: "${plan_id}", billing_email: "dana.reyes@example.com", equipment_mode: "RENTAL" }
              as: SalesAgent
              captures: { sub1_id: $.data.id }
            - call: "POST /install-work-orders"
              payload: { subscriber_id: "${sub1_id}", scheduled_at: "2026-08-02T15:00:00Z" }
              as: FieldTech
              captures: { wo1_id: $.data.id }
          trigger:
            - call: "POST /install-work-orders/${wo1_id}/survey"
              payload: { measured_tree_line_height_m: 5.5, measured_roof_height_m: 4.0, structure_penetration_allowed: true }
              as: FieldTech
              as_user_id: "tech-1001"
          assert:
            - "ServiceabilityRequest.${sr1_id}.desktop_los_margin_m == 28.5"
            - "ServiceabilityRequest.${sr1_id}.desktop_required_mast_height_m == 2.5"
            - "ServiceabilityRequest.${sr1_id}.desktop_mounting_type == NON_PEN_ROOF_TRIPOD"
            - "InstallWorkOrder.${wo1_id}.field_los_margin_m == 26.0"
            - "InstallWorkOrder.${wo1_id}.recommended_mast_height_m == 5.0"
            - "InstallWorkOrder.${wo1_id}.recommended_mounting_type == ROOF_MAST_GUYED"
            - "InstallWorkOrder.${wo1_id}.recommended_mast_height_m != ServiceabilityRequest.${sr1_id}.desktop_required_mast_height_m"
            - "InstallWorkOrder.${wo1_id}.recommended_mounting_type != ServiceabilityRequest.${sr1_id}.desktop_mounting_type"
            - "InstallWorkOrder.${wo1_id}.status == EXCEPTION_PENDING"
            - "InstallWorkOrder.${wo1_id}.approved_mounting_type == null"
            - "InstallWorkOrder.${wo1_id}.surveyed_by_user_id == \"tech-1001\""
            - "response envelope: { success: true, data: {...}, error: null } with HTTP 200"

      - name: equipment_settlement_rental_liability_vs_purchase_refund_sign_inversion
        grounds:
          - calculations.equipment_settlement
          - entities.EquipmentAssignment.fields.settlement_cents
          - entities.EquipmentAssignment.fields.settlement_basis
          - entities.EquipmentAssignment.fields.months_in_service
          - state_machines.EquipmentAssignment.RETURN_PENDING_to_UNRETURNED_BILLED
          - state_machines.EquipmentAssignment.RETURN_PENDING_to_RETURNED
        distinguishing_aspect: |
          This instance lives in the equipment-money entity domain (EquipmentAssignment /
          Subscriber.settlement_balance_cents), not the RF-geometry domain of
          los_desktop_lidar_vs_field_survey_variant_divergence: with months_in_service == 5 on both
          accounts the RENTAL_LIABILITY variant produces settlement_cents == 29900 (a charge, basis
          RENTAL_CREDIT_OFFSET) while the PURCHASE_REFUND variant produces settlement_cents ==
          -21885 (a refund, basis DEPRECIATED_REFUND), so the same elapsed service window inverts
          the sign of the money movement.
        test_recipe:
          setup:
            - "The ACTIVE tower / ACTIVE sector / STD50 plan baseline of los_desktop_lidar_vs_field_survey_variant_divergence."
            - "Subscriber A on equipment_mode RENTAL and Subscriber B on equipment_mode PURCHASE, both installed on 2026-08-02 so both EquipmentAssignments have deployed_at 2026-08-02T00:00:00Z."
            - "Both accounts CANCELLED on 2026-11-02, so both assignments are RETURN_PENDING with return_due_at 2026-11-23T00:00:00Z."
            - "Logical clock advanced to 2026-12-31T00:00:00Z: 151 days of service on both assignments, months_in_service == 5, and the 21-day return window is closed."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_v1: $.data.version }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Dana Reyes", premise_latitude: 41.2600, premise_longitude: -104.7600, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr_a_id: $.data.id }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr_a_id}", expected_sector_version: "${sector_v1}" }
              as: SalesAgent
              captures: { hold_a_id: $.data.id }
            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr_a_id}", service_plan_id: "${plan_id}", billing_email: "rental.a@example.com", equipment_mode: "RENTAL" }
              as: SalesAgent
              captures: { sub_a_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Bo Iversen", premise_latitude: 41.2601, premise_longitude: -104.7601, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr_b_id: $.data.id }
            - call: "GET /sectors/${sector_id}"
              payload: {}
              as: CapacityPlanner
              captures: { sector_v2: $.data.version }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr_b_id}", expected_sector_version: "${sector_v2}" }
              as: SalesAgent
              captures: { hold_b_id: $.data.id }
            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr_b_id}", service_plan_id: "${plan_id}", billing_email: "purchase.b@example.com", equipment_mode: "PURCHASE" }
              as: SalesAgent
              captures: { sub_b_id: $.data.id }
            - call: "POST /install-work-orders"
              payload: { subscriber_id: "${sub_a_id}", scheduled_at: "2026-08-02T15:00:00Z" }
              as: FieldTech
              captures: { wo_a_id: $.data.id }
            - call: "POST /install-work-orders"
              payload: { subscriber_id: "${sub_b_id}", scheduled_at: "2026-08-02T16:00:00Z" }
              as: FieldTech
              captures: { wo_b_id: $.data.id }
            - call: "POST /install-work-orders/${wo_a_id}/survey"
              payload: { measured_tree_line_height_m: 3.0, measured_roof_height_m: 4.0, structure_penetration_allowed: true }
              as: FieldTech
              as_user_id: "tech-1001"
            - call: "POST /install-work-orders/${wo_b_id}/survey"
              payload: { measured_tree_line_height_m: 3.0, measured_roof_height_m: 4.0, structure_penetration_allowed: true }
              as: FieldTech
              as_user_id: "tech-1001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: NetworkEngineer
            - call: "POST /install-work-orders/${wo_a_id}/completion"
              payload: { installed_mast_height_m: 2.5, radio_serial: "RAD-0001" }
              as: FieldTech
              as_user_id: "tech-1001"
            - call: "POST /install-work-orders/${wo_b_id}/completion"
              payload: { installed_mast_height_m: 2.5, radio_serial: "RAD-0002" }
              as: FieldTech
              as_user_id: "tech-1001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-02T00:00:00Z" }
              as: NetworkEngineer
            - call: "POST /subscribers/${sub_a_id}/status-changes"
              payload: { to_status: "CANCELLED", reason: "Customer moved out of footprint" }
              as: BillingAdmin
              as_user_id: "billing-2001"
            - call: "POST /subscribers/${sub_b_id}/status-changes"
              payload: { to_status: "CANCELLED", reason: "Customer moved out of footprint" }
              as: BillingAdmin
              as_user_id: "billing-2001"
            - call: "GET /subscribers/${sub_a_id}/equipment-assignments"
              payload: {}
              as: BillingAdmin
              captures: { asg_a_id: "$.data[0].id" }
            - call: "GET /subscribers/${sub_b_id}/equipment-assignments"
              payload: {}
              as: BillingAdmin
              captures: { asg_b_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: NetworkEngineer
          trigger:
            - call: "POST /equipment-assignments/${asg_a_id}/unreturned-settlement"
              payload: { note: "Radio never returned after the 21-day window" }
              as: BillingAdmin
              as_user_id: "billing-2001"
            - call: "POST /equipment-assignments/${asg_b_id}/return"
              payload: { return_condition: "GOOD" }
              as: FieldTech
              as_user_id: "tech-1001"
          assert:
            - "EquipmentAssignment.${asg_a_id}.months_in_service == 5"
            - "EquipmentAssignment.${asg_b_id}.months_in_service == 5"
            - "EquipmentAssignment.${asg_a_id}.status == UNRETURNED_BILLED"
            - "EquipmentAssignment.${asg_a_id}.settlement_basis == RENTAL_CREDIT_OFFSET"
            - "EquipmentAssignment.${asg_a_id}.settlement_cents == 29900"
            - "EquipmentAssignment.${asg_b_id}.status == RETURNED"
            - "EquipmentAssignment.${asg_b_id}.settlement_basis == DEPRECIATED_REFUND"
            - "EquipmentAssignment.${asg_b_id}.settlement_cents == -21885"
            - "Subscriber.${sub_a_id}.settlement_balance_cents == 29900"
            - "Subscriber.${sub_b_id}.settlement_balance_cents == -21885"
            - "EquipmentAssignment.${asg_a_id}.settlement_cents > 0 AND EquipmentAssignment.${asg_b_id}.settlement_cents < 0"

  - rule_id: combinatorial_formula
    instances:
      - name: install_invoice_promo_tier_pinned_before_regulatory_recovery_fee
        grounds:
          - calculations.install_invoice_total
          - entities.InstallWorkOrder.fields.install_invoice_total_cents
          - state_machines.InstallWorkOrder.MOUNT_APPROVED_to_INSTALLED
          - state_machines.InstallWorkOrder.EXCEPTION_PENDING_to_MOUNT_APPROVED
        distinguishing_aspect: |
          Mode (c) - pinned evaluation order among independent operations: the promo tier is keyed on
          subtotal_cents (47300 -> 5000 off) and the 3.25% regulatory recovery fee is keyed on the
          POST-discount net (42300 -> 1375), giving install_invoice_total_cents == 43675; the
          plausible alternative order (fee on the subtotal, then discount) yields 43837, so the
          asserted literal falsifies any implementation that swaps the two independent steps.
        test_recipe:
          setup:
            - "The ACTIVE tower / ACTIVE sector / STD50 plan baseline, one PENDING_INSTALL Subscriber on equipment_mode RENTAL."
            - "Its InstallWorkOrder surveyed by user tech-1001 with a measured tree line of 5.5 m and structure_penetration_allowed true, so recommended_mast_height_m == 5.0 and recommended_mounting_type == ROOF_MAST_GUYED and the order sat in EXCEPTION_PENDING."
            - "A different NetworkEngineer user eng-3001 approved the exception with approved_mounting_type ROOF_MAST_GUYED, so the order is MOUNT_APPROVED (segregation of duties satisfied: eng-3001 != tech-1001)."
            - "Logical clock at 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_v1: $.data.version }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Dana Reyes", premise_latitude: 41.2600, premise_longitude: -104.7600, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr1_id: $.data.id }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr1_id}", expected_sector_version: "${sector_v1}" }
              as: SalesAgent
              captures: { hold1_id: $.data.id }
            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr1_id}", service_plan_id: "${plan_id}", billing_email: "dana.reyes@example.com", equipment_mode: "RENTAL" }
              as: SalesAgent
              captures: { sub1_id: $.data.id }
            - call: "POST /install-work-orders"
              payload: { subscriber_id: "${sub1_id}", scheduled_at: "2026-08-02T15:00:00Z" }
              as: FieldTech
              captures: { wo1_id: $.data.id }
            - call: "POST /install-work-orders/${wo1_id}/survey"
              payload: { measured_tree_line_height_m: 5.5, measured_roof_height_m: 4.0, structure_penetration_allowed: true }
              as: FieldTech
              as_user_id: "tech-1001"
            - call: "POST /install-work-orders/${wo1_id}/exception-decision"
              payload: { decision: "APPROVE", approved_mounting_type: "ROOF_MAST_GUYED", note: "Guyed roof mast accepted; structural survey on file" }
              as: NetworkEngineer
              as_user_id: "eng-3001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: NetworkEngineer
          trigger:
            - call: "POST /install-work-orders/${wo1_id}/completion"
              payload: { installed_mast_height_m: 5.0, radio_serial: "RAD-0001" }
              as: FieldTech
              as_user_id: "tech-1001"
          assert:
            - "InstallWorkOrder.${wo1_id}.status == INSTALLED"
            - "InstallWorkOrder.${wo1_id}.approved_mounting_type == ROOF_MAST_GUYED"
            - "InstallWorkOrder.${wo1_id}.installed_mast_height_m == 5.0"
            - "InstallWorkOrder.${wo1_id}.install_invoice_total_cents == 43675"
            - "InstallWorkOrder.${wo1_id}.install_invoice_total_cents != 43837"
            - "InstallWorkOrder.${wo1_id}.installed_at == \"2026-08-02T00:00:00Z\""
            - "InstallWorkOrder.${wo1_id}.exception_approved_by_user_id == \"eng-3001\""

      - name: tower_lease_rent_rounded_at_each_anniversary_not_at_the_end
        grounds:
          - calculations.tower_lease_escalation
          - entities.Tower.fields.current_monthly_rent_cents
          - entities.Tower.fields.lease_escalator_pct
          - endpoints[GET /towers/{id}/lease-schedule]
        distinguishing_aspect: |
          Mode (b) - round-at-each-step versus round-at-the-end: the 2.75% escalator is applied to
          the PREVIOUSLY ROUNDED whole-cent rent at each anniversary (45000 -> 46238 -> 47510 ->
          48817), so after three elapsed anniversaries current_monthly_rent_cents == 48817, whereas
          compounding in floating point and rounding only once at the end yields 48816; the
          one-cent gap is the falsifiable difference and it propagates into
          total_committed_cents == 2852688.
        test_recipe:
          setup:
            - "One Tower RB-TWR-009 whose lease starts 2023-04-01 with lease_monthly_base_rent_cents 45000, lease_escalator_pct 0.0275 and lease_term_months 60."
            - "No clock call is made, so the logical clock sits at its pinned startup default 2026-08-01T00:00:00Z - three whole lease years have elapsed since 2023-04-01."
            - "The tower is still PLANNED; the lease schedule is readable independently of tower status."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-009", latitude: 41.4000, longitude: -104.9000, ground_elevation_m: 1188.0, antenna_agl_m: 36.0, lease_landowner_name: "Cheyenne Grange Co-op", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower9_id: $.data.id }
          trigger:
            - call: "GET /towers/${tower9_id}/lease-schedule"
              payload: {}
              as: FinanceApprover
          assert:
            - "response.data.years_elapsed == 3"
            - "response.data.current_monthly_rent_cents == 48817"
            - "response.data.current_monthly_rent_cents != 48816"
            - "response.data.next_anniversary_date == \"2027-04-01\""
            - "response.data.total_committed_cents == 2852688"
            - "Tower.${tower9_id}.current_monthly_rent_cents == 48817"
            - "Tower.${tower9_id}.status == PLANNED"

  - rule_id: non_linear_state_machine
    instances:
      - name: coordination_negotiation_loop_bounded_at_three_rounds
        grounds:
          - state_machines.InterferenceCoordination.REQUESTED_to_REVISION_REQUESTED
          - state_machines.InterferenceCoordination.REVISION_REQUESTED_to_REQUESTED
          - entities.InterferenceCoordination.fields.round_number
          - validations[priority=12]
          - errors[ERR_COORDINATION_ROUND_LIMIT]
        distinguishing_aspect: |
          The non-linearity here is a CYCLE on entity InterferenceCoordination: REQUESTED ->
          REVISION_REQUESTED -> REQUESTED is traversed twice, carrying round_number 1 -> 2 -> 3, and
          the loop is terminated by a counter rather than by a state (the third REQUEST_REVISION is
          refused with ERR_COORDINATION_ROUND_LIMIT while status stays REQUESTED, so the entity is
          neither advanced nor rolled back).
        test_recipe:
          setup:
            - "Two ACTIVE towers RB-TWR-001 and RB-TWR-002, each with one ACCEPTED BackhaulCircuit, sharing the CBRS-PAL-4412 licence (block 3550.0-3650.0 MHz, max_eirp_dbm 47.0)."
            - "Sector S1 on tower A: azimuth 90.0, channel 3555.0/10.0 (edges 3550.0-3560.0), tx 25.0 dBm + 17.0 dBi gain = eirp 42.0, ACTIVE."
            - "Sector SB on tower B: azimuth 135.0, channel 3567.0/10.0 (edges 3562.0-3572.0), ACTIVE - the azimuth separation is 45 degrees, below MIN_AZIMUTH_SEPARATION_DEG 60, so the co-channel check applies."
            - "One InterferenceCoordination from S1 to SB, round_number 1, status REQUESTED, proposal 3555.0/10.0 at eirp 42.0 with guard_band_mhz 2.0 (inflated edges 3548.0-3562.0, which merely touch SB's lower edge)."
            - "The neighbour asked for a revision, S1 revised (round_number 2), the neighbour asked again, S1 revised again, so round_number == 3 and status == REQUESTED."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
