          trigger:
            - call: "POST /injection-encounters/${k_enc_np_id}/document"
              payload: { administered_dose_ml: 0.3, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 17 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_dg_over: $.data.error_id }
            - call: "POST /injection-encounters/${k_enc_np_id}/document"
              payload: { administered_dose_ml: 0, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 17 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_dg_zero: $.data.error_id }
            - call: "POST /injection-encounters/${k_enc_np_id}/document"
              payload: { administered_dose_ml: 0.06, injection_site_prep_confirmed: false, post_injection_iop_mmhg: 17 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_dg_prep: $.data.error_id }
            - call: "POST /injection-encounters/${k_enc_np_id}/document"
              payload: { administered_dose_ml: 0.06, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 17 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_dg_ok: $.data.status }
            - call: "POST /injection-encounters/${k_enc_np_id}/attest-wastage"
              payload: { attested_wasted_ml: 0.2 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_dg_sod: $.data.error_id }
            - call: "POST /injection-encounters/${k_enc_np_id}/attest-wastage"
