# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml §1.1-§1.7 against the nine Difficulty Rules of §0.5.
# Every numeric assert below was computed by executing the §1.3 formulas with their
# declared constants; no expression is left unresolved.
scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: unit_readiness_attested_vs_projected_penalty_set
        grounds:
          - calculations.unit_readiness_score
          - entities.HospitalUnit.fields.readiness_score
          - entities.HospitalUnit.fields.readiness_band
          - entities.DeficiencyTicket.fields.due_at
          - endpoints[GET /accreditation/units/{id}/readiness]
        distinguishing_aspect: |
          Entity domain is the HospitalUnit readiness score: the ATTESTED variant charges every
          non-VERIFIED ticket while the PROJECTED variant forgives IN_PROGRESS tickets that are not
          yet past due, so identical stored data yields 70.00/AT_RISK versus 77.00/CONDITIONAL.
        test_recipe:
          setup:
            - "Chapter EC weight_pct 100, evidence_min_count 1, two standards, one owned so the chapter is mapped."
            - "Unit ICU-3 with one COMPLETED tracer on EC whose weighted rate is 0.7800, giving base 78.00."
            - "One OPEN LOW ticket (1 point) and one IN_PROGRESS HIGH ticket (7 points) whose due_at 2026-08-24T00:00:00.000Z is in the future relative to clock 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { ch_ec_id: $.data.id }
            - call: "POST /accreditation/chapters/${ch_ec_id}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { s1_id: $.data.id }
            - call: "POST /accreditation/chapters/${ch_ec_id}/standards"
              payload: { standard_code: "EC.02.05.01", title: "Utility systems", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { s2_id: $.data.id }
            - call: "POST /accreditation/standards/${s1_id}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-3", unit_type: "ICU", bed_count: 20 }
              as: AccreditationDirector
              captures: { u_id: $.data.id, u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${u_id}", chapter_id: "${ch_ec_id}", tracer_type: "SYSTEM", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${u_v1}" }
              as: TracerSurveyor
              captures: { t1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${t1_id}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${t1_id}/observations"
              payload: { standard_id: "${s1_id}", result: "COMPLIANT", weight: 39 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${t1_id}/observations"
              payload: { standard_id: "${s2_id}", result: "NON_COMPLIANT", weight: 11 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${t1_id}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${u_id}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { rs_id: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${rs_id}/deficiencies"
              payload: { standard_id: "${s1_id}", description: "Corridor clutter", severity: "LOW" }
              as: SafetyOfficer
              captures: { k_low_id: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${rs_id}/deficiencies"
              payload: { standard_id: "${s2_id}", description: "Generator log gap", severity: "HIGH" }
              as: SafetyOfficer
              captures: { k_high_id: $.data.id }
            - call: "POST /accreditation/deficiency-tickets/${k_high_id}/transition"
              payload: { action: "START_WORK" }
              as: SafetyOfficer
          trigger:
            - call: "GET /accreditation/units/${u_id}/readiness"
              as: AccreditationDirector
              captures: { attested_score: $.data.readiness_score, attested_band: $.data.readiness_band }
            - call: "GET /accreditation/units/${u_id}/readiness"
              payload: { mode: "PROJECTED" }
              as: AccreditationDirector
              captures: { projected_score: $.data.readiness_score, projected_band: $.data.readiness_band }
          assert:
            - "${attested_score} == 70.00 and ${attested_band} == AT_RISK"
            - "${projected_score} == 77.00 and ${projected_band} == CONDITIONAL"
            - "the two variants differ by exactly 7.00, the penalty_points of the IN_PROGRESS not-yet-due HIGH ticket ${k_high_id}"
            - "HospitalUnit.${u_id}.readiness_score == 70.00 (only the attested variant is persisted)"
            - "HospitalUnit.${u_id}.open_deficiency_penalty_points == 8"

      - name: ppr_self_reported_vs_evidence_verified_chapter_score
        grounds:
          - calculations.ppr_chapter_assessment
          - entities.PprSelfAssessment.fields.self_score
          - entities.PprSelfAssessment.fields.verified_score
          - entities.PprSelfAssessment.fields.gap
          - entities.Chapter.fields.standard_count
        distinguishing_aspect: |
          Entity domain is the Chapter periodic-performance-review score, not the unit readiness score:
          the self_reported variant reads only the submitted ratings (100.00) while the
          evidence_verified variant reads Standard.compliance_state (50.00), so the same PPR row
          carries a 50.00 gap and flagged_overstatement true.
        test_recipe:
          setup:
            - "Chapter IC with exactly two standards, both MAPPED (each has one ACTIVE owner) and neither holding validated evidence."
            - "Clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "IC", name: "Infection Control", weight_pct: 50, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { ch_ic_id: $.data.id }
            - call: "POST /accreditation/chapters/${ch_ic_id}/standards"
              payload: { standard_code: "IC.01.01.01", title: "Hand hygiene program", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ic_s1_id: $.data.id }
            - call: "POST /accreditation/chapters/${ch_ic_id}/standards"
              payload: { standard_code: "IC.02.01.01", title: "Sterilization log", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ic_s2_id: $.data.id }
            - call: "POST /accreditation/standards/${ic_s1_id}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${ic_s2_id}/owner-assignments"
              payload: { owner_user_id: "owner-2", designation: "PRIMARY" }
              as: AccreditationDirector
          trigger:
            - call: "POST /accreditation/chapters/${ch_ic_id}/ppr-self-assessments"
              payload: { period_label: "2026-H2", self_ratings: [{ standard_id: "${ic_s1_id}", rating: "COMPLIANT" }, { standard_id: "${ic_s2_id}", rating: "COMPLIANT" }] }
              as: AccreditationDirector
              captures: { ppr_id: $.data.id }
          assert:
            - "PprSelfAssessment.${ppr_id}.self_score == 100.00"
            - "PprSelfAssessment.${ppr_id}.verified_score == 50.00"
            - "PprSelfAssessment.${ppr_id}.gap == 50.00"
            - "PprSelfAssessment.${ppr_id}.flagged_overstatement == true"
            - "Chapter.${ch_ic_id}.ppr_escalation_count == 1 and Chapter.${ch_ic_id}.readiness_flag == ON_TRACK"

      - name: esc_deadline_initial_vs_clarification_variant
        grounds:
          - calculations.esc_response_due_at
          - entities.SurveyFinding.fields.initial_response_due_at
          - entities.SurveyFinding.fields.response_due_at
          - state_machines.SurveyFinding.RESPONSE_SUBMITTED_to_CLARIFICATION_REQUESTED
        distinguishing_aspect: |
          Entity domain is the SurveyFinding response deadline: variant initial anchors on
          survey_closed_at + response_deadline_days (2026-11-09T00:00:00.000Z) while variant
          clarification anchors on the clarification instant + 21 days (2026-10-22T00:00:00.000Z),
          so the same finding carries two different due instants and response_due_at moves EARLIER.
        test_recipe:
          setup:
            - "SurveyWindow CYCLE-2026 predicted [2026-09-15, 2028-03-15], command center ACTIVATED, survey opened then closed at 2026-09-25T00:00:00Z."
            - "One finding on an INDIRECT_IMPACT standard with observed 5 of 10 and patient_harm_observed true: classification PATTERN, risk_level HIGH, condition_level false, response_deadline_days 45."
            - "The finding's standard has owner-1 as ACTIVE PRIMARY owner."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "MM", name: "Medication Management", weight_pct: 30, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { ch_mm_id: $.data.id }
            - call: "POST /accreditation/chapters/${ch_mm_id}/standards"
              payload: { standard_code: "MM.05.01.01", title: "Medication order review", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { mm_s1_id: $.data.id }
            - call: "POST /accreditation/standards/${mm_s1_id}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "MED-2", unit_type: "MED_SURG", bed_count: 30 }
              as: AccreditationDirector
              captures: { u2_id: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { sw_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${sw_id}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${sw_id}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${sw_id}/findings"
              payload: { standard_id: "${mm_s1_id}", unit_id: "${u2_id}", observed_noncompliance_count: 5, sampled_count: 10, patient_harm_observed: true }
              as: ExternalSurveyor
              captures: { f1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${sw_id}/transition"
              payload: { action: "CLOSE_SURVEY" }
              as: AccreditationDirector
            - call: "GET /accreditation/survey-findings/${f1_id}"
              as: StandardOwner
              captures: { f1_due_initial: $.data.initial_response_due_at, f1_v1: $.data.version }
            - call: "POST /accreditation/survey-findings/${f1_id}/esc-submissions"
              payload: { corrective_action_summary: "Pharmacist re-review of all orders", measure_of_success: "100 percent review for 4 months", leadership_signoff: true, expected_finding_version: "${f1_v1}" }
              as: StandardOwner
              as_user_id: "owner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AccreditationDirector
          trigger:
            - call: "POST /accreditation/survey-findings/${f1_id}/esc-review"
              payload: { decision: "CLARIFICATION_REQUESTED", decision_note: "Measure of success lacks a numeric target" }
              as: ExternalSurveyor
              captures: { f1_due_clar: $.data.response_due_at }
          assert:
            - "${f1_due_initial} == 2026-11-09T00:00:00.000Z (variant initial: survey_closed_at 2026-09-25 + 45 days)"
            - "${f1_due_clar} == 2026-10-22T00:00:00.000Z (variant clarification: 2026-10-01 + 21 days, below the 2026-11-19 cap)"
            - "SurveyFinding.${f1_id}.initial_response_due_at == 2026-11-09T00:00:00.000Z (unchanged by the clarification)"
            - "SurveyFinding.${f1_id}.response_deadline_days == 45 and SurveyFinding.${f1_id}.risk_level == HIGH"
            - "SurveyFinding.${f1_id}.clarification_round_count == 1 and state == CLARIFICATION_REQUESTED"

  # =========================================================================
  # Rule 2 - combinatorial formulas across different modes (a) (b) (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: finding_risk_index_four_input_non_linear_cap
        grounds:
          - calculations.finding_risk_classification
          - entities.SurveyFinding.fields.classification
          - entities.SurveyFinding.fields.risk_level
          - entities.SurveyFinding.fields.condition_level
          - entities.Standard.fields.risk_tier
        distinguishing_aspect: |
          Mode (a): four inputs (noncompliance rate tier, Standard.risk_tier, patient_harm_observed,
          INDEX_CAP) interact non-linearly through a capped sum and two independent condition_level
          branches, so 10-of-10 on a DIRECT_IMPACT standard with harm saturates at raw_index 6 while
          8-of-10 on the same standard lands on HIGH yet is still condition_level via the
          WIDESPREAD-and-DIRECT_IMPACT branch.
        test_recipe:
          setup:
            - "SurveyWindow CYCLE-2026 in window_state ACTIVE_SURVEY with command_center_state ACTIVATED at clock 2026-09-20T00:00:00Z."
            - "Standard LS.01.01.01 risk_tier DIRECT_IMPACT and standard LS.03.01.01 risk_tier SITUATIONAL_DECISION_RULE, both in chapter LS."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "LS", name: "Life Safety", weight_pct: 25, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { ch_ls_id: $.data.id }
            - call: "POST /accreditation/chapters/${ch_ls_id}/standards"
              payload: { standard_code: "LS.01.01.01", title: "Egress protection", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ls_s1_id: $.data.id }
            - call: "POST /accreditation/chapters/${ch_ls_id}/standards"
              payload: { standard_code: "LS.03.01.01", title: "Signage placement", risk_tier: "SITUATIONAL_DECISION_RULE" }
              as: AccreditationDirector
              captures: { ls_s2_id: $.data.id }
            - call: "POST /accreditation/units"
              payload: { name: "OR-1", unit_type: "OR", bed_count: 8 }
              as: AccreditationDirector
              captures: { u3_id: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { sw2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${sw2_id}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${sw2_id}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
          trigger:
            - call: "POST /accreditation/survey-windows/${sw2_id}/findings"
              payload: { standard_id: "${ls_s1_id}", unit_id: "${u3_id}", observed_noncompliance_count: 8, sampled_count: 10, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { fa_id: $.data.id }
            - call: "POST /accreditation/survey-windows/${sw2_id}/findings"
              payload: { standard_id: "${ls_s1_id}", unit_id: "${u3_id}", observed_noncompliance_count: 10, sampled_count: 10, patient_harm_observed: true }
              as: ExternalSurveyor
              captures: { fb_id: $.data.id }
            - call: "POST /accreditation/survey-windows/${sw2_id}/findings"
              payload: { standard_id: "${ls_s2_id}", unit_id: "${u3_id}", observed_noncompliance_count: 3, sampled_count: 10, patient_harm_observed: true }
              as: ExternalSurveyor
              captures: { fc_id: $.data.id }
          assert:
            - "SurveyFinding.${fa_id}: noncompliance_rate == 0.8000, classification == WIDESPREAD, risk_level == HIGH, condition_level == true, response_deadline_days == 45"
            - "SurveyFinding.${fb_id}: noncompliance_rate == 1.0000, classification == WIDESPREAD, risk_level == IMMEDIATE_THREAT, condition_level == true, response_deadline_days == 45 (raw index 2+2+2 == 6 capped at INDEX_CAP 6)"
            - "SurveyFinding.${fc_id}: noncompliance_rate == 0.3000, classification == LIMITED, risk_level == MODERATE, condition_level == false, response_deadline_days == 60 (harm bonus alone lifts index 0 to 2)"
            - "SurveyWindow.${sw2_id}.condition_level_finding_count == 2"

      - name: readiness_round_per_chapter_then_sum_pinned_order
        grounds:
          - calculations.unit_readiness_score
          - entities.Chapter.fields.weight_pct
          - entities.MockTracer.fields.contributes_to_readiness
          - endpoints[GET /accreditation/units/{id}/readiness]
        distinguishing_aspect: |
          Mode (b): three participating chapters with weights 40/25/10 and rates 0.6667/0.3333/0.5000
          give 35.56 + 11.11 + 6.67 == 53.34 under the pinned round-each-chapter-then-sum order,
          whereas sum-then-round yields 53.33 - the one-cent difference is the whole assertion.
        test_recipe:
          setup:
            - "Three chapters EC 40, LS 25, IC 10 (weight_pct), each with at least one owned standard so tracers may be scheduled."
            - "Unit ICU-9 with three COMPLETED contributing tracers, one per chapter, whose weighted rates are 0.6667, 0.3333 and 0.5000."
            - "No deficiency tickets on the unit, so the penalty term is 0."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 40, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c_ec: $.data.id }
            - call: "POST /accreditation/chapters"
              payload: { code: "LS", name: "Life Safety", weight_pct: 25, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c_ls: $.data.id }
            - call: "POST /accreditation/chapters"
              payload: { code: "IC", name: "Infection Control", weight_pct: 10, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { c_ic: $.data.id }
            - call: "POST /accreditation/chapters/${c_ec}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ec_a: $.data.id }
            - call: "POST /accreditation/chapters/${c_ec}/standards"
              payload: { standard_code: "EC.02.05.01", title: "Utility systems", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ec_b: $.data.id }
            - call: "POST /accreditation/chapters/${c_ls}/standards"
              payload: { standard_code: "LS.01.01.01", title: "Egress protection", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ls_a: $.data.id }
            - call: "POST /accreditation/chapters/${c_ls}/standards"
              payload: { standard_code: "LS.02.01.01", title: "Sprinkler coverage", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ls_b: $.data.id }
            - call: "POST /accreditation/chapters/${c_ic}/standards"
              payload: { standard_code: "IC.01.01.01", title: "Hand hygiene program", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { ic_a: $.data.id }
            - call: "POST /accreditation/standards/${ec_a}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${ls_a}/owner-assignments"
              payload: { owner_user_id: "owner-2", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${ic_a}/owner-assignments"
              payload: { owner_user_id: "owner-3", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-9", unit_type: "ICU", bed_count: 16 }
              as: AccreditationDirector
              captures: { ru_id: $.data.id, ru_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${ru_id}", chapter_id: "${c_ec}", tracer_type: "SYSTEM", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${ru_v1}" }
              as: TracerSurveyor
              captures: { tr_ec: $.data.id }
            - call: "GET /accreditation/units/${ru_id}"
              as: TracerSurveyor
              captures: { ru_v2: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${ru_id}", chapter_id: "${c_ls}", tracer_type: "SYSTEM", window_start: "2026-08-05T11:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_unit_version: "${ru_v2}" }
              as: TracerSurveyor
              captures: { tr_ls: $.data.id }
            - call: "GET /accreditation/units/${ru_id}"
              as: TracerSurveyor
              captures: { ru_v3: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${ru_id}", chapter_id: "${c_ic}", tracer_type: "SYSTEM", window_start: "2026-08-05T13:00:00Z", window_end: "2026-08-05T14:00:00Z", expected_unit_version: "${ru_v3}" }
              as: TracerSurveyor
              captures: { tr_ic: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${tr_ec}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ec}/observations"
              payload: { standard_id: "${ec_a}", result: "COMPLIANT", weight: 2 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ec}/observations"
              payload: { standard_id: "${ec_b}", result: "NON_COMPLIANT", weight: 1 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ec}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ls}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ls}/observations"
              payload: { standard_id: "${ls_a}", result: "COMPLIANT", weight: 1 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ls}/observations"
              payload: { standard_id: "${ls_b}", result: "NON_COMPLIANT", weight: 2 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ls}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ic}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ic}/observations"
              payload: { standard_id: "${ic_a}", result: "PARTIAL", weight: 1 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${tr_ic}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
          trigger:
            - call: "GET /accreditation/units/${ru_id}/readiness"
              as: AccreditationDirector
              captures: { rt_score: $.data.readiness_score, rt_base: $.data.base_score, rt_weight: $.data.participating_weight_pct }
          assert:
            - "${rt_weight} == 75.00 (only the three chapters with contributing COMPLETED tracers participate)"
            - "${rt_base} == 53.34 and ${rt_score} == 53.34 - NOT 53.33"
            - "HospitalUnit.${ru_id}.readiness_score == 53.34 and readiness_band == NOT_READY"
            - "MockTracer.${tr_ec}.tracer_score == 66.67, MockTracer.${tr_ls}.tracer_score == 33.33, MockTracer.${tr_ic}.tracer_score == 50.00"

      - name: deficiency_due_at_band_snapshot_precedes_own_penalty
        grounds:
          - calculations.deficiency_due_at
          - calculations.unit_readiness_score
          - entities.DeficiencyTicket.fields.due_at
          - entities.DeficiencyTicket.fields.accelerated
          - endpoints[POST /accreditation/rounding-sessions/{id}/deficiencies]
        distinguishing_aspect: |
          Mode (c): the due date depends on the readiness band, which depends on the penalty ledger,
          which depends on the ticket being inserted - the pinned order takes the band snapshot at
          step 1 before step 6 inserts the ticket, so the second HIGH ticket gets 14 days
          (2026-08-24) while the third identical HIGH ticket gets 7 days (2026-08-17) because the
          second ticket's own insertion had already dropped the band to AT_RISK.
        test_recipe:
          setup:
            - "Unit ICU-3 at base readiness 78.00 (band CONDITIONAL) from one COMPLETED tracer with weighted rate 0.7800."
            - "An OPEN ENVIRONMENT_OF_CARE rounding session on that unit; clock pinned at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { dc_id: $.data.id }
            - call: "POST /accreditation/chapters/${dc_id}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { d_s1: $.data.id }
            - call: "POST /accreditation/chapters/${dc_id}/standards"
              payload: { standard_code: "EC.02.05.01", title: "Utility systems", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { d_s2: $.data.id }
            - call: "POST /accreditation/standards/${d_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-3", unit_type: "ICU", bed_count: 20 }
              as: AccreditationDirector
              captures: { du_id: $.data.id, du_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${du_id}", chapter_id: "${dc_id}", tracer_type: "SYSTEM", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${du_v1}" }
              as: TracerSurveyor
              captures: { dt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${dt_id}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${dt_id}/observations"
              payload: { standard_id: "${d_s1}", result: "COMPLIANT", weight: 39 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${dt_id}/observations"
              payload: { standard_id: "${d_s2}", result: "NON_COMPLIANT", weight: 11 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${dt_id}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${du_id}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { drs_id: $.data.id }
          trigger:
            - call: "POST /accreditation/rounding-sessions/${drs_id}/deficiencies"
              payload: { standard_id: "${d_s1}", description: "Soiled utility room unlocked", severity: "MODERATE" }
              as: SafetyOfficer
              captures: { d_k1: $.data.id, d_k1_due: $.data.due_at }
            - call: "POST /accreditation/rounding-sessions/${drs_id}/deficiencies"
              payload: { standard_id: "${d_s1}", description: "Fire extinguisher inspection overdue", severity: "HIGH" }
              as: SafetyOfficer
              captures: { d_k2: $.data.id, d_k2_due: $.data.due_at }
            - call: "POST /accreditation/rounding-sessions/${drs_id}/deficiencies"
              payload: { standard_id: "${d_s2}", description: "Medical gas shutoff unlabeled", severity: "HIGH" }
              as: SafetyOfficer
              captures: { d_k3: $.data.id, d_k3_due: $.data.due_at }
          assert:
            - "${d_k1_due} == 2026-09-09T00:00:00.000Z, DeficiencyTicket.${d_k1}.accelerated == false (snapshot band CONDITIONAL at 78.00, 30 days)"
            - "${d_k2_due} == 2026-08-24T00:00:00.000Z, DeficiencyTicket.${d_k2}.accelerated == false (snapshot band still CONDITIONAL at 75.00, 14 days)"
            - "${d_k3_due} == 2026-08-17T00:00:00.000Z, DeficiencyTicket.${d_k3}.accelerated == true (snapshot band AT_RISK at 68.00, max(1, floor(14/2)) == 7 days)"
            - "DeficiencyTicket.${d_k2}.severity == DeficiencyTicket.${d_k3}.severity == HIGH yet their due_at differ by exactly 7 days"
            - "HospitalUnit.${du_id}.open_deficiency_penalty_points == 17 and readiness_score == 61.00 and readiness_band == AT_RISK and posture == RESTRICTED"

  # =========================================================================
  # Rule 3 - non-linear state-machine shapes on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: survey_window_two_dimensions_advance_independently
        grounds:
          - state_machines.SurveyWindow.command_center_state=STANDBY_to_command_center_state=ACTIVATED
          - state_machines.SurveyWindow.window_state=PROJECTED_to_window_state=ELIGIBLE
          - state_machines.SurveyWindow.command_center_state=ACTIVATED_to_command_center_state=DEMOBILIZED
          - state_machines.SurveyWindow.command_center_state=DEMOBILIZED_to_command_center_state=ACTIVATED
          - entities.SurveyWindow.fields.window_state
          - entities.SurveyWindow.fields.command_center_state
        distinguishing_aspect: |
          Parallel dimensions on the SurveyWindow row: command_center_state moves STANDBY -> ACTIVATED
          -> DEMOBILIZED -> ACTIVATED while window_state is untouched, and window_state moves
          PROJECTED -> ELIGIBLE on the clock alone while command_center_state is untouched.
        test_recipe:
          setup:
            - "One SurveyWindow CYCLE-2026 from prior_survey_end_date 2025-03-15, predicted_open 2026-09-15, predicted_close 2028-03-15, command_center_activation_allowed_from 2026-08-16."
            - "Clock advanced to 2026-08-20T00:00:00Z: past the command-center lead date but before the predicted open date."
          setup_api_calls:
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { pw_id: $.data.id, pw_open: $.data.predicted_open_date, pw_cc_from: $.data.command_center_activation_allowed_from }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: AccreditationDirector
          trigger:
            - call: "POST /accreditation/survey-windows/${pw_id}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
              captures: { pw_cc_1: $.data.command_center_state, pw_ws_1: $.data.window_state }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
              captures: { pw_eligible_count: $.data.eligible_window_count }
            - call: "POST /accreditation/survey-windows/${pw_id}/transition"
              payload: { action: "DEMOBILIZE_COMMAND_CENTER" }
              as: AccreditationDirector
              captures: { pw_cc_2: $.data.command_center_state, pw_ws_2: $.data.window_state }
            - call: "POST /accreditation/survey-windows/${pw_id}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
              captures: { pw_cc_3: $.data.command_center_state, pw_ws_3: $.data.window_state }
            - call: "POST /accreditation/survey-windows/${pw_id}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
              captures: { pw_ws_4: $.data.window_state, pw_cc_4: $.data.command_center_state }
          assert:
            - "${pw_open} == 2026-09-15T00:00:00.000Z and ${pw_cc_from} == 2026-08-16T00:00:00.000Z"
            - "${pw_cc_1} == ACTIVATED while ${pw_ws_1} == PROJECTED (dimension 2 moved, dimension 1 did not)"
            - "${pw_eligible_count} == 1 and ${pw_ws_2} == ELIGIBLE while ${pw_cc_2} == DEMOBILIZED"
            - "${pw_cc_3} == ACTIVATED and ${pw_ws_3} == ELIGIBLE (command-center dimension cycled back with window_state unchanged)"
            - "${pw_ws_4} == ACTIVE_SURVEY and ${pw_cc_4} == ACTIVATED"
            - "SurveyWindow.${pw_id}.survey_opened_at == 2026-09-20T00:00:00.000Z"

      - name: finding_clarification_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.SurveyFinding.RESPONSE_SUBMITTED_to_CLARIFICATION_REQUESTED
          - state_machines.SurveyFinding.CLARIFICATION_REQUESTED_to_RESPONSE_SUBMITTED
          - calculations.esc_response_due_at
          - validations[priority=36]
          - errors[ERR_CLARIFICATION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Cyclic shape on a different entity (SurveyFinding): RESPONSE_SUBMITTED ->
          CLARIFICATION_REQUESTED -> RESPONSE_SUBMITTED runs twice and the third clarification is
          refused with ERR_CLARIFICATION_LIMIT_EXCEEDED, while submission_count keeps climbing to 3.
        test_recipe:
          setup:
            - "Same window/finding chain as esc_deadline_initial_vs_clarification_variant: finding HIGH, condition_level false, initial_response_due_at 2026-11-09T00:00:00.000Z."
            - "owner-1 is the ACTIVE PRIMARY owner of the finding's standard."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "MM", name: "Medication Management", weight_pct: 30, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { cl_ch: $.data.id }
            - call: "POST /accreditation/chapters/${cl_ch}/standards"
              payload: { standard_code: "MM.05.01.01", title: "Medication order review", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { cl_s1: $.data.id }
            - call: "POST /accreditation/standards/${cl_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "MED-2", unit_type: "MED_SURG", bed_count: 30 }
              as: AccreditationDirector
              captures: { cl_u: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { cl_sw: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${cl_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${cl_sw}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${cl_sw}/findings"
              payload: { standard_id: "${cl_s1}", unit_id: "${cl_u}", observed_noncompliance_count: 5, sampled_count: 10, patient_harm_observed: true }
              as: ExternalSurveyor
              captures: { cl_f: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${cl_sw}/transition"
              payload: { action: "CLOSE_SURVEY" }
              as: AccreditationDirector
            - call: "GET /accreditation/survey-findings/${cl_f}"
              as: StandardOwner
              captures: { cl_v1: $.data.version }
            - call: "POST /accreditation/survey-findings/${cl_f}/esc-submissions"
              payload: { corrective_action_summary: "Round 1 plan", measure_of_success: "Audit 30 charts monthly", leadership_signoff: true, expected_finding_version: "${cl_v1}" }
              as: StandardOwner
              as_user_id: "owner-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-findings/${cl_f}/esc-review"
              payload: { decision: "CLARIFICATION_REQUESTED", decision_note: "Quantify the target" }
              as: ExternalSurveyor
              captures: { cl_due_r1: $.data.response_due_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "GET /accreditation/survey-findings/${cl_f}"
              as: StandardOwner
              captures: { cl_v2: $.data.version }
            - call: "POST /accreditation/survey-findings/${cl_f}/esc-submissions"
              payload: { corrective_action_summary: "Round 2 plan", measure_of_success: "90 percent compliance for 4 months", leadership_signoff: true, expected_finding_version: "${cl_v2}" }
              as: StandardOwner
              as_user_id: "owner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-findings/${cl_f}/esc-review"
              payload: { decision: "CLARIFICATION_REQUESTED", decision_note: "Attach the audit tool" }
              as: ExternalSurveyor
              captures: { cl_due_r2: $.data.response_due_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-16T00:00:00Z" }
              as: AccreditationDirector
            - call: "GET /accreditation/survey-findings/${cl_f}"
              as: StandardOwner
              captures: { cl_v3: $.data.version }
            - call: "POST /accreditation/survey-findings/${cl_f}/esc-submissions"
              payload: { corrective_action_summary: "Round 3 plan", measure_of_success: "Audit tool attached", leadership_signoff: true, expected_finding_version: "${cl_v3}" }
              as: StandardOwner
              as_user_id: "owner-1"
            - call: "POST /accreditation/survey-findings/${cl_f}/esc-review"
              payload: { decision: "CLARIFICATION_REQUESTED", decision_note: "Third clarification attempt" }
              as: ExternalSurveyor
              captures: { cl_err: $.data.error_id }
          assert:
            - "${cl_due_r1} == 2026-10-22T00:00:00.000Z (clarification at 2026-10-01 + 21 days)"
            - "${cl_due_r2} == 2026-11-19T00:00:00.000Z (capped at initial_response_due_at + 10 days, not 2026-12-06)"
            - "${cl_err} == ERR_CLARIFICATION_LIMIT_EXCEEDED with HTTP 409"
            - "SurveyFinding.${cl_f}.clarification_round_count == 2 and submission_count == 3"
            - "SurveyFinding.${cl_f}.state == RESPONSE_SUBMITTED after the refused third clarification"
            - "the three EscSubmission rows of ${cl_f} carry submission_round 1, 2 and 3"

      - name: deficiency_ticket_failed_verification_revision_cycle
        grounds:
          - state_machines.DeficiencyTicket.REMEDIATED_to_OPEN
          - state_machines.DeficiencyTicket.OPEN_to_IN_PROGRESS
          - state_machines.DeficiencyTicket.REMEDIATED_to_VERIFIED
          - entities.DeficiencyTicket.fields.failed_verification_count
          - entities.HospitalUnit.fields.open_deficiency_penalty_points
        distinguishing_aspect: |
          Cyclic shape on a third entity (DeficiencyTicket): REMEDIATED -> OPEN -> IN_PROGRESS ->
          REMEDIATED loops once with failed_verification_count reaching 1 and the unit penalty ledger
          frozen at 7 throughout, dropping to 0 only when the loop finally exits through VERIFIED.
        test_recipe:
          setup:
            - "Unit ED-1 with no tracers (readiness_band NOT_ASSESSED) and one CLOSED LIFE_SAFETY rounding session holding a single HIGH ticket."
            - "Clock at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "LS", name: "Life Safety", weight_pct: 25, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { fv_ch: $.data.id }
            - call: "POST /accreditation/chapters/${fv_ch}/standards"
              payload: { standard_code: "LS.02.01.01", title: "Sprinkler coverage", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { fv_s1: $.data.id }
            - call: "POST /accreditation/units"
              payload: { name: "ED-1", unit_type: "ED", bed_count: 24 }
              as: AccreditationDirector
              captures: { fv_u: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${fv_u}", round_type: "LIFE_SAFETY", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { fv_rs: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${fv_rs}/deficiencies"
              payload: { standard_id: "${fv_s1}", description: "Sprinkler head obstructed", severity: "HIGH" }
              as: SafetyOfficer
              captures: { fv_k: $.data.id, fv_k_due: $.data.due_at }
            - call: "POST /accreditation/rounding-sessions/${fv_rs}/close"
              as: SafetyOfficer
          trigger:
            - call: "POST /accreditation/deficiency-tickets/${fv_k}/transition"
              payload: { action: "START_WORK" }
              as: UnitManager
              as_user_id: "${fv_u}"
            - call: "POST /accreditation/deficiency-tickets/${fv_k}/transition"
              payload: { action: "MARK_REMEDIATED" }
              as: UnitManager
              as_user_id: "${fv_u}"
            - call: "POST /accreditation/deficiency-tickets/${fv_k}/transition"
              payload: { action: "FAIL_VERIFICATION", note: "Obstruction still present" }
              as: SafetyOfficer
              captures: { fv_state_after_fail: $.data.state, fv_fail_count: $.data.failed_verification_count }
            - call: "POST /accreditation/deficiency-tickets/${fv_k}/transition"
              payload: { action: "START_WORK" }
              as: UnitManager
              as_user_id: "${fv_u}"
            - call: "POST /accreditation/deficiency-tickets/${fv_k}/transition"
              payload: { action: "MARK_REMEDIATED" }
              as: UnitManager
              as_user_id: "${fv_u}"
            - call: "POST /accreditation/deficiency-tickets/${fv_k}/transition"
              payload: { action: "VERIFY" }
              as: SafetyOfficer
              captures: { fv_state_final: $.data.state }
          assert:
            - "${fv_k_due} == 2026-08-24T00:00:00.000Z and DeficiencyTicket.${fv_k}.accelerated == false (band NOT_ASSESSED never accelerates)"
            - "${fv_state_after_fail} == OPEN and ${fv_fail_count} == 1"
            - "HospitalUnit.${fv_u}.open_deficiency_penalty_points == 7 immediately after the FAIL_VERIFICATION loop-back"
            - "${fv_state_final} == VERIFIED and DeficiencyTicket.${fv_k}.failed_verification_count == 1"
            - "HospitalUnit.${fv_u}.open_deficiency_penalty_points == 0 and posture == OPEN after VERIFY"

  # =========================================================================
  # Rule 4 - transitive cascades from different triggering transitions
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: life_safety_escalation_cascades_to_tracer_abort
        grounds:
          - state_machines.DeficiencyTicket.OPEN_to_ESCALATED
          - state_machines.HospitalUnit.OPEN_to_RESTRICTED
          - state_machines.MockTracer.SCHEDULED_to_ABORTED
          - calculations.unit_readiness_score
          - entities.HospitalUnit.fields.scheduled_tracer_count
        distinguishing_aspect: |
          Depth-4 chain from the ticket-ESCALATE transition: ESCALATE raises severity to
          IMMEDIATE_THREAT (hop 1), the raised penalty_points push the unit ledger to exactly 15 which
          flips posture to RESTRICTED (hop 2), the posture flip aborts the unit's SCHEDULED tracer
          (hop 3), and the abort zeroes scheduled_tracer_count and re-derives readiness (hop 4) - each
          hop is caused by the previous one, not by the original request.
        test_recipe:
          setup:
            - "Unit ICU-7 with one SCHEDULED tracer on chapter EC for window 2026-08-20T08:00Z-10:00Z (scheduled_tracer_count 1, posture OPEN)."
            - "One OPEN LIFE_SAFETY rounding session on the unit holding a single MODERATE ticket worth 3 points."
            - "Clock at 2026-08-10T00:00:00Z, before the tracer window, so the tracer is still SCHEDULED."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { es_ch: $.data.id }
            - call: "POST /accreditation/chapters/${es_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { es_s1: $.data.id }
            - call: "POST /accreditation/standards/${es_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-7", unit_type: "ICU", bed_count: 12 }
              as: AccreditationDirector
              captures: { es_u: $.data.id, es_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${es_u}", chapter_id: "${es_ch}", tracer_type: "PATIENT", window_start: "2026-08-20T08:00:00Z", window_end: "2026-08-20T10:00:00Z", expected_unit_version: "${es_u_v1}" }
              as: TracerSurveyor
              captures: { es_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${es_u}", round_type: "LIFE_SAFETY", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { es_rs: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${es_rs}/deficiencies"
              payload: { standard_id: "${es_s1}", description: "Fire door wedged open", severity: "MODERATE" }
              as: SafetyOfficer
              captures: { es_k: $.data.id }
          trigger:
            - call: "POST /accreditation/deficiency-tickets/${es_k}/transition"
              payload: { action: "ESCALATE", note: "Life safety deficiency unresolved at shift change" }
              as: SafetyOfficer
              captures: { es_k_state: $.data.state, es_k_sev: $.data.severity, es_k_pts: $.data.penalty_points }
          assert:
            - "${es_k_state} == ESCALATED, ${es_k_sev} == IMMEDIATE_THREAT, ${es_k_pts} == 15 (LIFE_SAFETY escalation raises severity)"
            - "HospitalUnit.${es_u}.open_deficiency_penalty_points == 15 and posture == RESTRICTED"
            - "MockTracer.${es_t}.state == ABORTED and abort_reason == UNIT_POSTURE_RESTRICTED"
            - "HospitalUnit.${es_u}.scheduled_tracer_count == 0"
            - "HospitalUnit.${es_u}.readiness_score == 0.00 and readiness_band == NOT_ASSESSED (no contributing COMPLETED tracer remains, so step 1 stops before the penalty is applied)"

      - name: tracer_completion_cascades_to_ppr_reassessment
        grounds:
          - state_machines.MockTracer.IN_PROGRESS_to_COMPLETED
          - state_machines.Standard.MAPPED_to_DEFICIENT
          - state_machines.PprSelfAssessment.SUBMITTED_to_RETURNED_FOR_REASSESSMENT
          - entities.Chapter.fields.deficient_standard_count
          - entities.Chapter.fields.readiness_flag
          - calculations.ppr_chapter_assessment
        distinguishing_aspect: |
          Depth-4 chain from a different trigger (tracer COMPLETE): the NON_COMPLIANT observations move
          two Standards to DEFICIENT (hop 1), that moves Chapter.deficient_standard_count to the
          CHAPTER_AT_RISK_DEFICIENT_COUNT threshold of 2 (hop 2), which flips Chapter.readiness_flag to
          AT_RISK (hop 3), which returns the chapter's SUBMITTED PPR to RETURNED_FOR_REASSESSMENT (hop 4).
        test_recipe:
          setup:
            - "Chapter PC with exactly two standards, both MAPPED via one ACTIVE owner each."
            - "One PprSelfAssessment for period 2026-H2 in state SUBMITTED with both standards rated COMPLIANT (self_score 100.00, verified_score 50.00, gap 50.00, ppr_escalation_count 1 - below the AT_RISK PPR threshold of 2)."
            - "Unit PED-1 with one IN_PROGRESS tracer on chapter PC carrying two NON_COMPLIANT observations."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "PC", name: "Provision of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { pc_ch: $.data.id }
            - call: "POST /accreditation/chapters/${pc_ch}/standards"
              payload: { standard_code: "PC.01.02.03", title: "Care planning", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { pc_s1: $.data.id }
            - call: "POST /accreditation/chapters/${pc_ch}/standards"
              payload: { standard_code: "PC.03.01.01", title: "Restraint monitoring", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { pc_s2: $.data.id }
            - call: "POST /accreditation/standards/${pc_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${pc_s2}/owner-assignments"
              payload: { owner_user_id: "owner-2", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/chapters/${pc_ch}/ppr-self-assessments"
              payload: { period_label: "2026-H2", self_ratings: [{ standard_id: "${pc_s1}", rating: "COMPLIANT" }, { standard_id: "${pc_s2}", rating: "COMPLIANT" }] }
              as: AccreditationDirector
              captures: { pc_ppr: $.data.id, pc_ppr_state: $.data.state, pc_ppr_gap: $.data.gap }
            - call: "POST /accreditation/units"
              payload: { name: "PED-1", unit_type: "MED_SURG", bed_count: 18 }
              as: AccreditationDirector
              captures: { pc_u: $.data.id, pc_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${pc_u}", chapter_id: "${pc_ch}", tracer_type: "PATIENT", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${pc_u_v1}" }
              as: TracerSurveyor
              captures: { pc_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${pc_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${pc_t}/observations"
              payload: { standard_id: "${pc_s1}", result: "NON_COMPLIANT", weight: 1 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${pc_t}/observations"
              payload: { standard_id: "${pc_s2}", result: "NON_COMPLIANT", weight: 1 }
              as: TracerSurveyor
          trigger:
            - call: "POST /accreditation/mock-tracers/${pc_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
              captures: { pc_t_score: $.data.tracer_score, pc_t_contrib: $.data.contributes_to_readiness }
          assert:
            - "${pc_ppr_state} == SUBMITTED and ${pc_ppr_gap} == 50.00 at setup time"
            - "Standard.${pc_s1}.compliance_state == DEFICIENT and Standard.${pc_s2}.compliance_state == DEFICIENT with last_noncompliant_observed_at == 2026-08-06T00:00:00.000Z"
            - "Chapter.${pc_ch}.deficient_standard_count == 2 and readiness_flag == AT_RISK"
            - "PprSelfAssessment.${pc_ppr}.state == RETURNED_FOR_REASSESSMENT and requires_reassessment == true"
            - "${pc_t_score} == 0.00 and ${pc_t_contrib} == true (scored_weight 2 is greater than 0)"
            - "HospitalUnit.${pc_u}.readiness_score == 0.00 and readiness_band == NOT_READY (participating set is non-empty, unlike the NOT_ASSESSED case)"

      - name: clock_expiry_cascades_to_chapter_evidence_counter
        grounds:
          - state_machines.EvidenceItem.VALIDATED_to_EXPIRED
          - state_machines.Standard.EVIDENCE_COMPLETE_to_MAPPED
          - entities.Chapter.fields.evidence_complete_standard_count
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Depth-3 chain from a third trigger (the logical-clock sweep): the clock moves the VALIDATED
          evidence item to EXPIRED at the inclusive boundary expires_at == clock (hop 1), that
          decrement drops Standard.validated_evidence_count below evidence_min_count so the standard
          leaves EVIDENCE_COMPLETE for MAPPED (hop 2), and that transition decrements
          Chapter.evidence_complete_standard_count (hop 3).
        test_recipe:
          setup:
            - "Chapter IC with evidence_min_count 1 and one standard owned by owner-1 (ACTIVE PRIMARY), so the standard is MAPPED."
            - "One EvidenceItem on that standard with expires_at 2026-09-01T00:00:00Z, already SUBMITTED by owner-1 and VALIDATED by val-1, so the standard is EVIDENCE_COMPLETE and the chapter counter is 1."
            - "Clock at the default 2026-08-01T00:00:00Z during validation."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "IC", name: "Infection Control", weight_pct: 50, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { xe_ch: $.data.id }
            - call: "POST /accreditation/chapters/${xe_ch}/standards"
              payload: { standard_code: "IC.01.01.01", title: "Hand hygiene program", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { xe_s1: $.data.id }
            - call: "POST /accreditation/standards/${xe_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${xe_s1}/evidence-items"
              payload: { title: "Hand hygiene audit log", doc_type: "LOG", effective_date: "2026-07-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { xe_e1: $.data.id }
            - call: "POST /accreditation/evidence-items/${xe_e1}/transition"
              payload: { action: "SUBMIT" }
              as: StandardOwner
              as_user_id: "owner-1"
            - call: "POST /accreditation/evidence-items/${xe_e1}/transition"
              payload: { action: "VALIDATE", review_note: "Log complete for Q3" }
              as: EvidenceValidator
              as_user_id: "val-1"
              captures: { xe_state_validated: $.data.validation_state }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AccreditationDirector
              captures: { xe_expired_count: $.data.expired_evidence_count }
          assert:
            - "${xe_state_validated} == VALIDATED and Chapter.${xe_ch}.evidence_complete_standard_count == 1 before the trigger"
            - "${xe_expired_count} == 1 (expires_at == clock expires; the boundary is inclusive)"
            - "EvidenceItem.${xe_e1}.validation_state == EXPIRED"
            - "Standard.${xe_s1}.validated_evidence_count == 0 and compliance_state == MAPPED"
            - "Chapter.${xe_ch}.evidence_complete_standard_count == 0 and mapped_standard_count == 1"

  # =========================================================================
  # Rule 5 - validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: unit_posture_state_error_precedes_tracer_window_temporal_conflict
        grounds:
          - validations[priority=23]
          - validations[priority=28]
          - errors[ERR_UNIT_POSTURE_RESTRICTED]
          - errors[ERR_TRACER_WINDOW_CONFLICT]
          - calculations.tracer_window_occupancy
        distinguishing_aspect: |
          Category pair `state` (priority 23) versus `business_temporal` (priority 28): the request
          violates both the RESTRICTED-posture gate and the 60-minute tracer turnaround buffer, and the
          server must answer ERR_UNIT_POSTURE_RESTRICTED, never ERR_TRACER_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Unit ICU-4 with tracer T1 IN_PROGRESS over 2026-08-05T08:00Z-12:00Z (an IN_PROGRESS tracer is not aborted by a posture change)."
            - "Three OPEN HIGH tickets on the unit worth 21 points, so posture is RESTRICTED but no ticket is ESCALATED (priority 24 ERR_IMMEDIATE_THREAT_ACTIVE stays unviolated)."
            - "Chapter EC has one mapped standard so priority 44 stays unviolated."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { pa_ch: $.data.id }
            - call: "POST /accreditation/chapters/${pa_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { pa_s1: $.data.id }
            - call: "POST /accreditation/standards/${pa_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-4", unit_type: "ICU", bed_count: 14 }
              as: AccreditationDirector
              captures: { pa_u: $.data.id, pa_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${pa_u}", chapter_id: "${pa_ch}", tracer_type: "SYSTEM", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_unit_version: "${pa_u_v1}" }
              as: TracerSurveyor
              captures: { pa_t1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${pa_t1}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
              captures: { pa_t1_state: $.data.state }
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${pa_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z" }
              as: SafetyOfficer
              captures: { pa_rs: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${pa_rs}/deficiencies"
              payload: { standard_id: "${pa_s1}", description: "Blocked electrical panel", severity: "HIGH" }
              as: SafetyOfficer
            - call: "POST /accreditation/rounding-sessions/${pa_rs}/deficiencies"
              payload: { standard_id: "${pa_s1}", description: "Missing eyewash inspection", severity: "HIGH" }
              as: SafetyOfficer
            - call: "POST /accreditation/rounding-sessions/${pa_rs}/deficiencies"
              payload: { standard_id: "${pa_s1}", description: "Damaged ceiling tile above sterile field", severity: "HIGH" }
              as: SafetyOfficer
            - call: "GET /accreditation/units/${pa_u}"
              as: TracerSurveyor
              captures: { pa_u_vnow: $.data.version, pa_u_posture: $.data.posture, pa_u_points: $.data.open_deficiency_penalty_points }
          trigger:
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${pa_u}", chapter_id: "${pa_ch}", tracer_type: "SYSTEM", window_start: "2026-08-05T12:30:00Z", window_end: "2026-08-05T14:00:00Z", expected_unit_version: "${pa_u_vnow}" }
              as: TracerSurveyor
              captures: { pa_err: $.data.error_id }
          assert:
            - "${pa_t1_state} == IN_PROGRESS and ${pa_u_posture} == RESTRICTED and ${pa_u_points} == 21"
            - "${pa_err} == ERR_UNIT_POSTURE_RESTRICTED with HTTP 409, not ERR_TRACER_WINDOW_CONFLICT"
            - "the trigger window 12:30Z would independently violate tracer_window_occupancy because 12:30Z is before 12:00Z plus the 60-minute buffer"
            - "no MockTracer row is created: GET /accreditation/mock-tracers filtered by unit_id ${pa_u} still returns total_count 1"

      - name: condition_level_safety_error_precedes_submitter_referential_error
        grounds:
          - validations[priority=26]
          - validations[priority=41]
          - errors[ERR_CONDITION_LEVEL_ESCALATION_REQUIRED]
          - errors[ERR_SUBMITTER_NOT_STANDARD_OWNER]
          - calculations.finding_risk_classification
        distinguishing_aspect: |
          A different category pair - `business_safety` (priority 26) versus `business_referential`
          (priority 41): the ESC submission is both premature for a condition-level finding and signed
          by a non-owner, and the server must answer ERR_CONDITION_LEVEL_ESCALATION_REQUIRED.
        test_recipe:
          setup:
            - "Survey CYCLE-2026 opened at clock 2026-09-20T00:00:00Z and closed at 2026-09-25T00:00:00Z."
            - "One finding on a DIRECT_IMPACT standard with observed 8 of 10: classification WIDESPREAD, risk_level HIGH, condition_level true, response_deadline_days 45, response_due_at 2026-11-09T00:00:00.000Z."
            - "The finding is in RESPONSE_PENDING and has never been escalated; owner-1 is its only ACTIVE PRIMARY owner while owner-9 owns nothing."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "LS", name: "Life Safety", weight_pct: 25, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { pb_ch: $.data.id }
            - call: "POST /accreditation/chapters/${pb_ch}/standards"
              payload: { standard_code: "LS.01.01.01", title: "Egress protection", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { pb_s1: $.data.id }
            - call: "POST /accreditation/standards/${pb_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "OR-2", unit_type: "OR", bed_count: 6 }
              as: AccreditationDirector
              captures: { pb_u: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { pb_sw: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${pb_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${pb_sw}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${pb_sw}/findings"
              payload: { standard_id: "${pb_s1}", unit_id: "${pb_u}", observed_noncompliance_count: 8, sampled_count: 10, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { pb_f: $.data.id, pb_f_cond: $.data.condition_level }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${pb_sw}/transition"
              payload: { action: "CLOSE_SURVEY" }
              as: AccreditationDirector
            - call: "GET /accreditation/survey-findings/${pb_f}"
              as: StandardOwner
              captures: { pb_f_v: $.data.version, pb_f_state: $.data.state, pb_f_due: $.data.response_due_at }
          trigger:
            - call: "POST /accreditation/survey-findings/${pb_f}/esc-submissions"
              payload: { corrective_action_summary: "Door hardware replacement", measure_of_success: "Weekly egress audit", leadership_signoff: true, expected_finding_version: "${pb_f_v}" }
              as: StandardOwner
              as_user_id: "owner-9"
              captures: { pb_err: $.data.error_id }
          assert:
            - "${pb_f_cond} == true, ${pb_f_state} == RESPONSE_PENDING, ${pb_f_due} == 2026-11-09T00:00:00.000Z"
            - "${pb_err} == ERR_CONDITION_LEVEL_ESCALATION_REQUIRED with HTTP 409, not ERR_SUBMITTER_NOT_STANDARD_OWNER"
            - "SurveyFinding.${pb_f}.submission_count == 0 and version is unchanged from ${pb_f_v}"
            - "GET /accreditation/survey-findings/${pb_f}/esc-submissions returns total_count 0"

      - name: evidence_state_error_precedes_segregation_referential_error
        grounds:
          - validations[priority=12]
          - validations[priority=40]
          - errors[ERR_EVIDENCE_NOT_SUBMITTED]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles.EvidenceValidator
        distinguishing_aspect: |
          A third category pair - `state` (priority 12) versus `business_referential` (priority 40):
          the VALIDATE call is issued against a DRAFT item BY the standard's own active owner, and the
          server must answer ERR_EVIDENCE_NOT_SUBMITTED rather than the segregation-of-duties denial.
        test_recipe:
          setup:
            - "Chapter MM with one standard owned by owner-1 as ACTIVE PRIMARY, so the standard is MAPPED."
            - "One EvidenceItem on that standard still in validation_state DRAFT (never submitted)."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "MM", name: "Medication Management", weight_pct: 30, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { pc2_ch: $.data.id }
            - call: "POST /accreditation/chapters/${pc2_ch}/standards"
              payload: { standard_code: "MM.05.01.01", title: "Medication order review", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { pc2_s1: $.data.id }
            - call: "POST /accreditation/standards/${pc2_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${pc2_s1}/evidence-items"
              payload: { title: "Pharmacy review policy", doc_type: "POLICY", effective_date: "2026-07-01T00:00:00Z" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { pc2_e1: $.data.id, pc2_e1_state: $.data.validation_state }
          trigger:
            - call: "POST /accreditation/evidence-items/${pc2_e1}/transition"
              payload: { action: "VALIDATE", review_note: "Self-approval attempt on a draft" }
              as: EvidenceValidator
              as_user_id: "owner-1"
              captures: { pc2_err: $.data.error_id }
          assert:
            - "${pc2_e1_state} == DRAFT"
            - "${pc2_err} == ERR_EVIDENCE_NOT_SUBMITTED with HTTP 409, not ERR_SEGREGATION_OF_DUTIES and not ERR_INVALID_STATE_TRANSITION"
            - "EvidenceItem.${pc2_e1}.validation_state == DRAFT and reviewed_by_user_id == null"
            - "Standard.${pc2_s1}.validated_evidence_count == 0 and compliance_state == MAPPED"

  # =========================================================================
  # Rule 6 - boundary / precision checks on different constants
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: posture_restrict_points_exact_fifteen_boundary
        grounds:
          - calculations.deficiency_due_at
          - calculations.unit_readiness_score
          - state_machines.HospitalUnit.OPEN_to_RESTRICTED
          - entities.HospitalUnit.fields.open_deficiency_penalty_points
        distinguishing_aspect: |
          Boundary on POSTURE_RESTRICT_POINTS: the unit ledger is driven to 14 (threshold - 1, posture
          stays OPEN) and then to exactly 15 (threshold, posture flips to RESTRICTED), and each
          insertion also exercises the AT_RISK acceleration halving with the max(1, ...) floor.
        test_recipe:
          setup:
            - "Chapter EC weight_pct 100 with two standards, one owned, one COMPLETED tracer giving base 78.00 and band CONDITIONAL."
            - "Clock at 2026-08-10T00:00:00Z; one OPEN ENVIRONMENT_OF_CARE session on the unit."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { bp_ch: $.data.id }
            - call: "POST /accreditation/chapters/${bp_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { bp_s1: $.data.id }
            - call: "POST /accreditation/chapters/${bp_ch}/standards"
              payload: { standard_code: "EC.02.05.01", title: "Utility systems", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { bp_s2: $.data.id }
            - call: "POST /accreditation/standards/${bp_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-9", unit_type: "ICU", bed_count: 16 }
              as: AccreditationDirector
              captures: { bp_u: $.data.id, bp_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${bp_u}", chapter_id: "${bp_ch}", tracer_type: "SYSTEM", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${bp_u_v1}" }
              as: TracerSurveyor
              captures: { bp_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${bp_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${bp_t}/observations"
              payload: { standard_id: "${bp_s1}", result: "COMPLIANT", weight: 39 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${bp_t}/observations"
              payload: { standard_id: "${bp_s2}", result: "NON_COMPLIANT", weight: 11 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${bp_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
              captures: { bp_score_base: $.data.tracer_score }
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${bp_u}", round_type: "ENVIRONMENT_OF_CARE", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
