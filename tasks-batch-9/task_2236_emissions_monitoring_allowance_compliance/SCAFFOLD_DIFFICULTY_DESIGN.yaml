# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  (SKILL.md §1.8)
#
# Task 2236 — Emissions Monitoring & Allowance Compliance
# Depth probe: nine §0.5 Difficulty Rules x >= 3 instances each = 30 instances.
#
# Fixture conventions shared by every recipe below (an empty database each time):
#   * the logical clock is set FIRST, normally to 2026-04-02T00:00:00Z, so that
#     the 26-hour CAL_CURRENT -> CAL_EXPIRED sweep on
#     POST /emissions/_clock/set_current_utc never fires mid-recipe;
#   * the facility carries operator_org = "op_alpha", so every FacilityOperator
#     call passes as_user_id: "op_alpha" (validations[priority=10]);
#   * report preparers act as X-User-ID "prep_1" / "prep_2" and designated
#     representatives as "dr_1" / "dr_2", so segregation of duties
#     (validations[priority=40]) is satisfied unless the instance attacks it;
#   * every numeric literal in an `assert:` line was produced by executing the
#     named §1.3 `formula:` with its `constants:` as code (contract item 7).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_heat_input_cems_vs_appendix_d_same_hour_diverges
        grounds:
          - calculations.hourly_heat_input_and_mass
          - entities.OperatingHour.fields.heat_input_method
          - entities.OperatingHour.fields.heat_input_mmbtu
          - entities.FuelSample.fields.gcv_btu_per_lb
          - entities.MonitoringSystem.fields.system_type
          - concurrency_rules[operating-hour-append-stale-report]
        distinguishing_aspect: |
          This instance exercises the dual variant on the OperatingHour /
          emissions-measurement domain: the SAME physical hour priced through
          CEMS_FLOW_CO2 and through APPENDIX_D_FUEL yields heat_input_mmbtu
          555.556 vs 562.500 and so2_mass_lbs 292.2 vs 765.0, a 472.8 lb SO2
          divergence on identical operating conditions.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "one facility (operator_org op_alpha) with one unit U1"
            - "unit owns a CERTIFIED SO2 CEM (span 400) and a CERTIFIED CO2 EXCEPTED_APPENDIX_D system (span 20), both CAL_CURRENT"
            - "unit owns one ANALYZED FuelSample: gcv_btu_per_lb 12500, sulfur_content_pct 0.85"
            - "unit owns a DRAFT QuarterlyReport for 2026 Q2 with zero hours"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2", "CSAPR_SO2_G1"], true_up_deadline_utc: "2027-03-01T00:00:00Z", max_concurrent_control_outages: 2 }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
              captures: { cem_v2: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
              captures: { cem_v3: $.data.version }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "CO2", system_type: "EXCEPTED_APPENDIX_D", span_value: 20.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { appd_id: $.data.id, appd_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${appd_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${appd_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 18.0, span_measured_value: 18.1 }
              as: QAAnalyst
              captures: { appd_v2: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${appd_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/fuel-samples"
              payload: { sample_utc: "2026-04-01T00:00:00Z", fuel_type: "COAL", lot_identifier: "LOT-A" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { fs_id: $.data.id }
            - call: "POST /emissions/fuel-samples/${fs_id}/analysis"
              payload: { outcome: "ANALYZED", gcv_btu_per_lb: 12500.0, sulfur_content_pct: 0.85, analysis_method: "ASTM_D5865" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
          trigger:
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", gross_load_mw: 600.0, flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h_cems_id: $.data.id, q2_v2: $.data.quarterly_report_version_after }
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v2}", hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", gross_load_mw: 600.0, fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_id}", nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h_appd_id: $.data.id, q2_v3: $.data.quarterly_report_version_after }
          assert:
            - "OperatingHour.${h_cems_id}.heat_input_mmbtu == 555.556"
            - "OperatingHour.${h_cems_id}.so2_mass_lbs == 292.2"
            - "OperatingHour.${h_cems_id}.nox_mass_lbs == 100.0"
            - "OperatingHour.${h_cems_id}.co2_mass_tons == 59.700"
            - "OperatingHour.${h_cems_id}.data_quality == MEASURED"
            - "OperatingHour.${h_appd_id}.heat_input_mmbtu == 562.500"
            - "OperatingHour.${h_appd_id}.so2_mass_lbs == 765.0"
            - "OperatingHour.${h_appd_id}.nox_mass_lbs == 101.3"
            - "OperatingHour.${h_appd_id}.co2_mass_tons == 57.741"
            - "OperatingHour.${h_appd_id}.data_quality == MEASURED"
            - "OperatingHour.${h_appd_id}.heat_input_mmbtu - OperatingHour.${h_cems_id}.heat_input_mmbtu == 6.944"
            - "OperatingHour.${h_appd_id}.so2_mass_lbs - OperatingHour.${h_cems_id}.so2_mass_lbs == 472.8"
            - "OperatingHour.${h_cems_id}.fuel_flow_lbs == null and OperatingHour.${h_cems_id}.fuel_sample_id == null"
            - "OperatingHour.${h_appd_id}.flow_scfh == null and OperatingHour.${h_appd_id}.so2_conc_ppm == null"

      - name: dual_variant_rata_reference_mean_vs_applicable_standard_flips_verdict
        grounds:
          - calculations.relative_accuracy_and_bias
          - entities.RataTest.fields.ra_basis
          - entities.RataTest.fields.relative_accuracy_pct
          - state_machines.RataTest.RUNS_RECORDED_to_FAILED
          - state_machines.RataTest.RUNS_RECORDED_to_PASSED
          - validations[priority=275]
        distinguishing_aspect: |
          This instance exercises the dual variant on a DIFFERENT entity domain
          from the heat-input instance — the RataTest / QA-audit domain — where
          the denominator swap (reference_mean 0.2700 vs applicable_standard
          0.500) turns one identical 9-run set from relative_accuracy_pct 10.7
          FAILED into 5.8 PASSED.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "one facility with unit U1 whose dispatch_state is ONLINE"
            - "unit owns a NOX_RATE CEM in RECERTIFICATION_PENDING (no calibration needed)"
            - "one SCHEDULED RataTest window [2026-04-03T00:00:00Z, 2026-04-04T00:00:00Z) with applicable_standard_value 0.500"
            - "the RataTest carries SET B: 9 runs whose reference_mean is 0.2700 and cems_mean 0.2456"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "SCR" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "NOX_RATE", system_type: "CEM", span_value: 0.800, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { nox_sys_id: $.data.id }
            - call: "POST /emissions/monitoring-systems/${nox_sys_id}/rata-tests"
              payload: { window_start_utc: "2026-04-03T00:00:00Z", window_end_utc: "2026-04-04T00:00:00Z", applicable_standard_value: 0.500 }
              as: QAAnalyst
              captures: { rt_id: $.data.id }
            - call: "POST /emissions/rata-tests/${rt_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.246 }, { reference_value: 0.266, cems_value: 0.236 }, { reference_value: 0.268, cems_value: 0.244 }, { reference_value: 0.270, cems_value: 0.258 }, { reference_value: 0.270, cems_value: 0.238 }, { reference_value: 0.272, cems_value: 0.248 }, { reference_value: 0.274, cems_value: 0.254 }, { reference_value: 0.274, cems_value: 0.246 }, { reference_value: 0.274, cems_value: 0.240 }] }
              as: QAAnalyst
          trigger:
            - call: "POST /emissions/rata-tests/${rt_id}/evaluate"
              payload: { ra_basis: "REFERENCE_MEAN" }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/reschedule"
              payload: { window_start_utc: "2026-04-05T00:00:00Z", window_end_utc: "2026-04-06T00:00:00Z" }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.246 }, { reference_value: 0.266, cems_value: 0.236 }, { reference_value: 0.268, cems_value: 0.244 }, { reference_value: 0.270, cems_value: 0.258 }, { reference_value: 0.270, cems_value: 0.238 }, { reference_value: 0.272, cems_value: 0.248 }, { reference_value: 0.274, cems_value: 0.254 }, { reference_value: 0.274, cems_value: 0.246 }, { reference_value: 0.274, cems_value: 0.240 }] }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/evaluate"
              payload: { ra_basis: "APPLICABLE_STANDARD" }
              as: QAAnalyst
          assert:
            - "after the first evaluate: RataTest.${rt_id}.reference_mean == 0.2700"
            - "after the first evaluate: RataTest.${rt_id}.cems_mean == 0.2456"
            - "after the first evaluate: RataTest.${rt_id}.mean_difference == 0.0244"
            - "after the first evaluate: RataTest.${rt_id}.confidence_coefficient == 0.0046"
            - "after the first evaluate: RataTest.${rt_id}.relative_accuracy_pct == 10.7"
            - "after the first evaluate: RataTest.${rt_id}.status == FAILED"
            - "after the first evaluate: RataTest.${rt_id}.bias_test_failed == true"
            - "after the first evaluate: RataTest.${rt_id}.bias_adjustment_factor == 1.0993"
            - "after the reschedule: RataTest.${rt_id}.attempt_number == 2 and RataTest.${rt_id}.run_count == 0 and RataTest.${rt_id}.relative_accuracy_pct == null"
            - "after the second evaluate on identical runs: RataTest.${rt_id}.relative_accuracy_pct == 5.8"
            - "after the second evaluate on identical runs: RataTest.${rt_id}.status == PASSED"
            - "after the second evaluate: RataTest.${rt_id}.ra_basis == APPLICABLE_STANDARD and RataTest.${rt_id}.mean_difference == 0.0244"
            - "the two verdicts on byte-identical run sets differ solely because the denominator changed from 0.2700 to 0.500"

      - name: dual_variant_appendix_d_hour_rejects_cems_measurement_fields
        grounds:
          - calculations.hourly_heat_input_and_mass
          - validations[priority=335]
          - validations[priority=90]
          - errors[ERR_METHOD_FIELD_MISMATCH]
          - entities.OperatingHour.fields.heat_input_method
        distinguishing_aspect: |
          Variant SELECTION rather than variant divergence: heat_input_method
          alone decides which measurement-field family is legal, so an
          APPENDIX_D_FUEL hour carrying flow_scfh is rejected with
          ERR_METHOD_FIELD_MISMATCH (422) and NOT with ERR_INVALID_REQUEST,
          because validations[priority=90] is declared blind to field families.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "one facility with unit U1 owning a CERTIFIED CO2 EXCEPTED_APPENDIX_D system"
            - "one ANALYZED FuelSample on the unit"
            - "one DRAFT QuarterlyReport for 2026 Q2 with zero hours"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "NATURAL_GAS", nameplate_capacity_mw: 300, max_rated_heat_input_mmbtu_hr: 3000, control_device: "NONE" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "CO2", system_type: "EXCEPTED_APPENDIX_D", span_value: 20.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { appd_id: $.data.id, appd_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${appd_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${appd_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 18.0, span_measured_value: 18.1 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${appd_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/fuel-samples"
              payload: { sample_utc: "2026-04-01T00:00:00Z", fuel_type: "NATURAL_GAS", lot_identifier: "LOT-G1" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { fs_id: $.data.id }
            - call: "POST /emissions/fuel-samples/${fs_id}/analysis"
              payload: { outcome: "ANALYZED", gcv_btu_per_lb: 12500.0, sulfur_content_pct: 0.85, analysis_method: "ASTM_D5865" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
          trigger:
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_id}", nox_rate_lb_mmbtu: 0.180, flow_scfh: 8000000.0 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { err_a: $.data.error_id }
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180, fuel_sample_id: "${fs_id}" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { err_b: $.data.error_id }
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_id}", nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h_ok_id: $.data.id }
          assert:
            - "trigger 1 returns HTTP 422 with error_id == ERR_METHOD_FIELD_MISMATCH (not ERR_INVALID_REQUEST)"
            - "trigger 2 returns HTTP 422 with error_id == ERR_METHOD_FIELD_MISMATCH because a CEMS hour may not carry fuel_sample_id"
            - "no OperatingHour row exists for (${unit_id}, 2026-04-01T00:00:00Z) after triggers 1 and 2"
            - "QuarterlyReport.${q2_id}.version is unchanged by triggers 1 and 2"
            - "trigger 3 returns HTTP 201 and OperatingHour.${h_ok_id}.heat_input_mmbtu == 562.500"
            - "OperatingHour.${h_ok_id}.so2_mass_lbs == 765.0 and OperatingHour.${h_ok_id}.co2_mass_tons == 57.741"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_report_total_so2_rounds_per_hour_before_summing
        grounds:
          - calculations.quarterly_report_totals
          - calculations.hourly_heat_input_and_mass
          - entities.QuarterlyReport.fields.total_so2_lbs
          - entities.QuarterlyReport.fields.total_so2_tons
          - state_machines.QuarterlyReport.DRAFT_to_VALIDATED
        distinguishing_aspect: |
          Mode (b) — NESTED ROUNDING ORDER. The three-hour fixture is chosen so
          that summing the already-rounded per-hour so2_mass_lbs gives
          total_so2_lbs 1070.5 while re-summing the raw unrounded products and
          rounding once gives 1070.4; total_so2_tons then re-rounds the already
          rounded pound total, so a single misplaced rounding step is visible.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with a CERTIFIED SO2 CEM and a CERTIFIED CO2 EXCEPTED_APPENDIX_D system, both CAL_CURRENT"
            - "one ANALYZED FuelSample (gcv 12500, sulfur 0.85)"
            - "a DRAFT 2026 Q2 QuarterlyReport carrying exactly three MEASURED hours"
            - "hour 00:00 CEMS flow 8000000 / co2 12.5 / so2 220 ppm -> 292.2 lb (raw 292.16)"
            - "hour 01:00 APPENDIX_D fuel 45000 -> 765.0 lb (raw 765.00)"
            - "hour 02:00 CEMS flow 1000000 / co2 12.5 / so2 80 ppm -> 13.3 lb (raw 13.28)"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "CO2", system_type: "EXCEPTED_APPENDIX_D", span_value: 20.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { appd_id: $.data.id, appd_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${appd_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${appd_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 18.0, span_measured_value: 18.1 }
              as: QAAnalyst
