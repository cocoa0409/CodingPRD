            - "Call 7 with the refreshed ${rv4} returns 200: ${st3} == DECIDED, ${aw1} == 1 and ${rv5} == ${rv4} + 1 — the OCC guard is a pure freshness check, not a semantic one"

      - name: stale_authorization_version_outranks_every_snapshot_bound
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.snapshot-post-stale-authorization
          - errors.ERR_STALE_AUTHORIZATION_VERSION
          - validations.v-snapshot-sequence
        distinguishing_aspect: |
          Because a posting mutates the authorization, its counters, the deal ledger
          and the principal aggregates, the OCC check sits at priority 6 — above the
          period-sequence and uniqueness bounds at priority 11. So a client holding
          a one-write-old version gets 412 no matter how wrong its period_index is,
          which is the only way to keep two concurrent buyers from interleaving
          periods. Reversals carry no expected version at all, yet still bump the
          version, so the client must re-read after every reverse.
        test_recipe:
          setup:
