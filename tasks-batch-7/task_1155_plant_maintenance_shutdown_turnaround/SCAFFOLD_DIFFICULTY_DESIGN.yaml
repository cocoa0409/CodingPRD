          setup:
            - "Turnaround in EXECUTION; work item W1 FROZEN; isolations I1 (VERIFIED) and I2 (ISOLATED) on distinct equipment; permit P on W1 (window 2026-06-12..2026-06-20) ISSUED; clock 2026-06-15T09:00:00Z"
