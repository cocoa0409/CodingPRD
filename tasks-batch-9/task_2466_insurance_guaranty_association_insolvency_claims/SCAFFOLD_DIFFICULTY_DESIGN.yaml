              as: AssociationAdmin
              captures: { c1: $.data.class1_paid_cents, c2: $.data.class2_paid_cents, c3: $.data.class3_paid_cents }
          assert:
            - "${c1} == 180000"
            - "${c2} == 3000000"
            - "${c3} == 0"
            - "CoveredClaim.${clm_id}.status == PAID"
            - "CoveredClaim.${clm_id}.paid_amount_cents == 3000000"
            - "VendorAssignment.${asg_id}.status == CLOSED"
            - "VendorAssignment.${asg_id}.fees_accrued_cents == 180000"
