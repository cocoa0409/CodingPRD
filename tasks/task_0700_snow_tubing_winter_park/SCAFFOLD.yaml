scenario: "700. Snow Tubing & Winter-Park Sessions: session/lane & time-block capacity, ticket & tube/equipment, height/age & waiver, weather/snow-condition & closure, group/party & lane rental, season pass & resident, lift/conveyor & turn timing, food/rental add-on"
domain_name: snow-tubing-winter-park
api_prefix: ""

complexity_profile:
  primary_archetype: Quota / allocation
  secondary_archetype: Temporal windowing
  complexity_layers:
    - Optimistic concurrency
    - Cascading side effects
    - Derived field reconciliation
    - Posture-driven gating
  entity_topology: hybrid
  # Park is a hierarchical root (Lanes, TimeBlocks, WeatherLogs nest under it),
  # while SessionTicket / GroupReservation / SeasonPass are flat peers wired by FK,
  # and EquipmentRental / AddOn / ConveyorTurn cross aggregate boundaries.
  state_machine_shape: posture_driven
  # Park.operational_posture (OPEN/RESTRICTED/CLOSED) is a derived aggregate over
  # weather + lane states that gates every child booking operation; SessionTicket
  # carries a parallel (lifecycle x checkin) pair; GroupReservation has a revert cycle.
  relationship_patterns:
    - one_to_many        # Park -> Lane, Park -> TimeBlock, SessionTicket -> EquipmentRental
    - many_to_many       # SessionTicket <-> TimeBlock via lane occupation; GroupReservation spans TimeBlocks
    - cross_aggregate    # ConveyorTurn references Lane + TimeBlock + SessionTicket; AddOn references multiple holders
    - self_referential   # SessionTicket.upgraded_from_ticket_id references another SessionTicket
  role_model: peer_roles
  # GuestPatron books own tickets/passes; ParkOperator runs ops (close lanes, sweep, conveyor);
  # GroupHost owns a party reservation; SafetyMarshal owns waivers and equipment dispatch.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Park
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the winter park.
      - name: timezone_offset_minutes
        type: integer
        source: input
        description: Fixed UTC offset (minutes) used only for display; all stored times are UTC.
        default: 0
      - name: resident_zip_prefixes
        type: array
        source: input
        description: List of zip-code prefixes that qualify a patron as a resident for resident pricing.
        constraints: array of strings; may be empty
      - name: min_snow_depth_cm
        type: integer
        source: input
        description: Minimum snow depth (cm) below which the park computes CLOSED posture.
        default: 15
      - name: max_safe_wind_kph
        type: integer
        source: input
        description: Wind speed (kph) at or above which the park computes RESTRICTED posture (or CLOSED if also below snow depth).
        default: 50
      - name: operational_posture
        type: enum
        source: computed
        description: "Derived aggregate gating all child booking ops. Recomputed from the latest WeatherLog and lane states on every weather/lane mutation."
        constraints: one of {OPEN, RESTRICTED, CLOSED}; starts OPEN
      - name: open_lane_count
        type: integer
        source: computed
        description: Count of Lanes belonging to this Park whose status == OPEN. Recomputed on every Lane state change.
        default: 0
      - name: total_capacity_remaining
        type: integer
        source: computed
        description: Sum over OPEN Lanes of (lane.rider_capacity_per_block) minus committed riders for the active block; reconciled denormalized field.
        default: 0

  - name: Lane
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park this lane belongs to."
      - name: label
        type: string
        source: input
        description: Human label of the lane (e.g., "Lane A").
      - name: rider_capacity_per_block
        type: integer
        source: input
        description: Max concurrent riders the lane admits within one TimeBlock.
        constraints: integer >= 1
      - name: conveyor_cycle_seconds
        type: integer
        source: input
        description: Seconds for one conveyor (lift) cycle; used to compute turn timing.
        constraints: integer >= 1
      - name: status
        type: enum
        source: computed
        description: Lane lifecycle state.
        constraints: one of {OPEN, GROOMING, CLOSED}; starts OPEN
      - name: closure_reason
        type: enum
        source: computed
        description: Why the lane is non-OPEN; null while OPEN.
        constraints: one of {WEATHER, MAINTENANCE, GROUP_RENTAL, null}

  - name: TimeBlock
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park this time block belongs to."
      - name: starts_at
        type: datetime
        source: input
        description: Inclusive UTC start of the block (half-open interval [starts_at, ends_at)).
      - name: ends_at
        type: datetime
        source: input
        description: Exclusive UTC end of the block.
        constraints: ends_at > starts_at
      - name: status
        type: enum
        source: computed
        description: Block lifecycle.
        constraints: one of {SCHEDULED, ACTIVE, SWEPT}; starts SCHEDULED
      - name: committed_rider_count
        type: integer
        source: computed
        description: Number of riders committed (CONFIRMED tickets + confirmed group seats) into this block across all lanes. Reconciled on commit/release.
        default: 0

  - name: SessionTicket
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; park the ticket admits to."
      - name: time_block_id
        type: string
        source: input
        description: "FK -> TimeBlock.id; the block this ticket is committed into."
      - name: holder_patron_id
        type: string
        source: input
        description: "FK -> Patron.id; the guest who holds this ticket."
      - name: season_pass_id
        type: string
        source: input
        description: "FK -> SeasonPass.id; set when the ticket was issued via a season pass redemption, else null."
        default: null
      - name: upgraded_from_ticket_id
        type: string
        source: input
        description: "FK -> SessionTicket.id; self-reference to the ticket this one replaced on an upgrade, else null."
        default: null
      - name: rider_height_cm
        type: integer
        source: input
        description: Declared rider height (cm), checked against TUBE minimum.
        constraints: integer >= 30
      - name: rider_age_years
        type: integer
        source: input
        description: Declared rider age in years.
        constraints: integer >= 0
      - name: is_resident
        type: boolean
        source: computed
        description: True when holder's zip prefix matches park.resident_zip_prefixes at issuance.
        default: false
      - name: base_price_cents
        type: integer
        source: computed
        description: Computed ticket price before add-ons (see ticket_pricing calc).
        default: 0
      - name: lifecycle_state
        type: enum
        source: computed
        description: Primary lifecycle dimension.
        constraints: one of {RESERVED, CONFIRMED, REDEEMED, EXPIRED, REFUNDED}; starts RESERVED
      - name: checkin_state
        type: enum
        source: computed
        description: Parallel check-in dimension, independent of lifecycle until REDEEMED.
        constraints: one of {NOT_CHECKED_IN, GEARED_UP, ON_LANE}; starts NOT_CHECKED_IN

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - name: patron_id
        type: string
        source: input
        description: "FK -> Patron.id; the guest the waiver covers."
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; park the waiver is valid at."
      - name: signed_at
        type: datetime
        source: input
        description: UTC instant the waiver was signed.
      - name: guardian_name
        type: string
        source: input
        description: Guardian signatory name; required when covered rider is a minor (< 18).
        default: null
      - name: status
        type: enum
        source: computed
        description: Waiver lifecycle.
        constraints: one of {ACTIVE, REVOKED}; starts ACTIVE

  - name: SeasonPass
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; park the pass is valid at."
      - name: holder_patron_id
        type: string
        source: input
        description: "FK -> Patron.id; the pass holder."
      - name: tier
        type: enum
        source: input
        description: Pass tier controlling daily redemption allowance and discount.
        constraints: one of {SILVER, GOLD, RESIDENT_GOLD}
      - name: valid_from
        type: datetime
        source: input
        description: Inclusive UTC start of pass validity.
      - name: valid_until
        type: datetime
        source: input
        description: Exclusive UTC end of pass validity.
        constraints: valid_until > valid_from
      - name: redemptions_today_count
        type: integer
        source: computed
        description: Count of tickets redeemed against this pass on the current clock-UTC date; reset by the daily-sweep when the date rolls.
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Pass lifecycle. ACTIVE at issuance; SUSPENDED via suspend; flipped to EXPIRED by the clock daily-sweep when clock-UTC reaches or passes valid_until."
        constraints: one of {ACTIVE, SUSPENDED, EXPIRED}; starts ACTIVE

  - name: GroupReservation
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; park the party is hosted at."
      - name: host_patron_id
        type: string
        source: input
        description: "FK -> Patron.id; the group host."
      - name: time_block_id
        type: string
        source: input
        description: "FK -> TimeBlock.id; block the party occupies."
      - name: lane_id
        type: string
        source: input
        description: "FK -> Lane.id; lane reserved for exclusive party use when rental_type==EXCLUSIVE_LANE, else null."
        default: null
      - name: rental_type
        type: enum
        source: input
        description: Whether the party books shared seats or an exclusive lane.
        constraints: one of {SHARED_SEATS, EXCLUSIVE_LANE}
      - name: party_size
        type: integer
        source: input
        description: Number of riders in the party.
        constraints: integer >= 2
      - name: deposit_cents
        type: integer
        source: computed
        description: Computed deposit (see group_deposit calc).
        default: 0
      - name: state
        type: enum
        source: computed
        description: Reservation lifecycle with a revision revert cycle.
        constraints: one of {DRAFT, HELD, CONFIRMED, CANCELLED}; starts DRAFT

  - name: EquipmentRental
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> SessionTicket.id; the ticket this rented item is dispatched against."
      - name: equipment_type
        type: enum
        source: input
        description: Kind of gear.
        constraints: one of {TUBE, HELMET, BOOTS}
      - name: tube_size
        type: enum
        source: input
        description: Tube size class; only meaningful when equipment_type==TUBE.
        constraints: one of {SMALL, MEDIUM, LARGE, null}
        default: null
      - name: state
        type: enum
        source: computed
        description: Rental lifecycle.
        constraints: one of {DISPATCHED, RETURNED, DAMAGED}; starts DISPATCHED

  - name: ConveyorTurn
    parent: null
    common_fields: true
    fields:
      - name: lane_id
        type: string
        source: input
        description: "FK -> Lane.id; lane whose conveyor carried this turn."
      - name: time_block_id
        type: string
        source: input
        description: "FK -> TimeBlock.id; block during which the turn occurred."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> SessionTicket.id; rider's ticket for this turn."
      - name: boarded_at
        type: datetime
        source: input
        description: UTC instant the rider boarded the conveyor.
      - name: cleared_at
        type: datetime
        source: computed
        description: boarded_at + lane.conveyor_cycle_seconds; the instant the turn clears the lift head.
      - name: state
        type: enum
        source: computed
        description: Turn lifecycle.
        constraints: one of {BOARDED, CLEARED}; starts BOARDED

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; park the add-on is sold at."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> SessionTicket.id; the ticket this add-on attaches to."
      - name: category
        type: enum
        source: input
        description: Add-on category.
        constraints: one of {FOOD, RENTAL_UPGRADE, HOT_DRINK}
      - name: unit_price_cents
        type: integer
        source: input
        description: Per-unit list price in cents.
        constraints: integer >= 0
      - name: quantity
        type: integer
        source: input
        description: Number of units purchased.
        constraints: integer >= 1
      - name: line_total_cents
        type: integer
        source: computed
        description: Computed line total after pass/resident discount (see addon_line_total calc).
        default: 0
      - name: state
        type: enum
        source: computed
        description: Add-on lifecycle.
        constraints: one of {ORDERED, FULFILLED, VOIDED}; starts ORDERED

  - name: WeatherLog
    parent: Park
    common_fields: false
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; park this reading belongs to."
      - name: observed_at
        type: datetime
        source: input
        description: UTC instant of the reading.
      - name: snow_depth_cm
        type: integer
        source: input
        description: Measured snow depth (cm).
        constraints: integer >= 0
      - name: wind_kph
        type: integer
        source: input
        description: Measured wind speed (kph).
        constraints: integer >= 0
      - name: derived_posture
        type: enum
        source: computed
        description: Posture this single reading implies, per the posture rules.
        constraints: one of {OPEN, RESTRICTED, CLOSED}

  - name: Patron
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Patron's full name.
      - name: zip_code
        type: string
        source: input
        description: Patron's home zip code; matched against park.resident_zip_prefixes for resident status.
      - name: birthdate
        type: datetime
        source: input
        description: UTC birthdate; used to derive age when a ticket does not declare one.

  - name: RefundEntry
    parent: null
    common_fields: false
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> SessionTicket.id; the ticket whose refund this entry records, else null for group refunds."
        default: null
      - name: group_reservation_id
        type: string
        source: input
        description: "FK -> GroupReservation.id; the group reservation refunded, else null for ticket refunds."
        default: null
      - name: amount_cents
        type: integer
        source: input
        description: Refund amount in cents (positive).
        constraints: integer >= 0
      - name: reason
        type: enum
        source: input
        description: Why the refund was issued.
        constraints: one of {WEATHER_CLOSURE, PATRON_CANCEL, GROUP_CANCEL}

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Park
    initial_state: OPEN
    terminal_states: []
    note: "operational_posture is a derived aggregate; transitions are recomputations driven by weather/lane events, not patron actions."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /parks/{id}/weather-logs (system recompute) — latest reading has wind_kph >= max_safe_wind_kph AND snow_depth_cm >= min_snow_depth_cm"
        actor: ParkOperator
        preconditions:
          - "latest WeatherLog.derived_posture == RESTRICTED"
        side_effects:
          - "Park.operational_posture := RESTRICTED"
          - "recompute Park.total_capacity_remaining over OPEN lanes"
          - "increments Park.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /parks/{id}/weather-logs (system recompute) — latest reading has snow_depth_cm < min_snow_depth_cm"
        actor: ParkOperator
        preconditions:
          - "latest WeatherLog.derived_posture == CLOSED"
        side_effects:
          - "Park.operational_posture := CLOSED"
          - "cascade: every Lane in {OPEN, GROOMING} -> CLOSED with closure_reason=WEATHER"
          - "cascade: each CLOSED lane forces every CONFIRMED SessionTicket in the active block on that lane -> EXPIRED, which itself creates a RefundEntry(reason=WEATHER_CLOSURE) per expired ticket"
          - "recompute Park.open_lane_count and Park.total_capacity_remaining"
          - "increments Park.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /parks/{id}/weather-logs (system recompute) — latest reading clears thresholds"
        actor: ParkOperator
        preconditions:
          - "latest WeatherLog.derived_posture == OPEN"
        side_effects:
          - "Park.operational_posture := OPEN"
          - "increments Park.version by 1"
      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /parks/{id}/weather-logs (system recompute) — snow_depth_cm < min_snow_depth_cm"
        actor: ParkOperator
        preconditions:
          - "latest WeatherLog.derived_posture == CLOSED"
        side_effects:
          - "Park.operational_posture := CLOSED"
          - "cascade: every Lane in {OPEN, GROOMING} -> CLOSED with closure_reason=WEATHER, which expires CONFIRMED tickets and creates RefundEntry per ticket"
          - "increments Park.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /parks/{id}/weather-logs (system recompute) — latest reading clears thresholds"
        actor: ParkOperator
        preconditions:
          - "latest WeatherLog.derived_posture == OPEN"
        side_effects:
          - "Park.operational_posture := OPEN"
          - "note: lanes are NOT auto-reopened; operator must reopen each lane explicitly"
          - "increments Park.version by 1"

  - entity: Lane
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: GROOMING
        trigger: "POST /lanes/{id}/groom"
        actor: ParkOperator
        preconditions:
          - "Lane.status == OPEN"
          - "no TimeBlock with status==ACTIVE has committed riders on this lane"
        side_effects:
          - "Lane.status := GROOMING; closure_reason := MAINTENANCE"
          - "bubble-up: recompute Park.open_lane_count and Park.total_capacity_remaining"
      - from: GROOMING
        to: OPEN
        trigger: "POST /lanes/{id}/reopen"
        actor: ParkOperator
        preconditions:
          - "Lane.status == GROOMING"
          - "Park.operational_posture != CLOSED"
        side_effects:
          - "Lane.status := OPEN; closure_reason := null"
          - "bubble-up: recompute Park.open_lane_count and Park.total_capacity_remaining"
      - from: OPEN
        to: CLOSED
        trigger: "POST /lanes/{id}/close OR cascade from Park CLOSED recompute"
        actor: ParkOperator | system
        preconditions:
          - "Lane.status == OPEN"
        side_effects:
          - "Lane.status := CLOSED; closure_reason := WEATHER (cascade) or MAINTENANCE (manual)"
          - "cascade: every CONFIRMED SessionTicket committed to this lane in an ACTIVE/SCHEDULED block -> EXPIRED, each creating RefundEntry(reason=WEATHER_CLOSURE)"
          - "bubble-up: recompute Park.open_lane_count and Park.total_capacity_remaining"
      - from: CLOSED
        to: OPEN
        trigger: "POST /lanes/{id}/reopen"
        actor: ParkOperator
        preconditions:
          - "Lane.status == CLOSED"
          - "Park.operational_posture != CLOSED"
        side_effects:
          - "Lane.status := OPEN; closure_reason := null"
          - "bubble-up: recompute Park.open_lane_count and Park.total_capacity_remaining"

  - entity: TimeBlock
    initial_state: SCHEDULED
    terminal_states: [SWEPT]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /time-blocks/{id}/activate"
        actor: ParkOperator
        preconditions:
          - "TimeBlock.status == SCHEDULED"
          - "Park.operational_posture != CLOSED"
          - "clock-UTC is within [starts_at, ends_at)"
        side_effects:
          - "TimeBlock.status := ACTIVE"
      - from: ACTIVE
        to: SWEPT
        trigger: "POST /time-blocks/{id}/sweep"
        actor: ParkOperator
        preconditions:
          - "TimeBlock.status == ACTIVE"
        side_effects:
          - "TimeBlock.status := SWEPT"
          - "cascade: every CONFIRMED SessionTicket in this block that is still NOT_CHECKED_IN -> EXPIRED (no refund: no-show forfeits)"
          - "cascade: every REDEEMED ticket's DISPATCHED EquipmentRental flagged for return reconciliation (state stays DISPATCHED until returned)"

  - entity: SessionTicket
    initial_state: RESERVED
    terminal_states: [REDEEMED, EXPIRED, REFUNDED]
    note: "Parallel dimensions: lifecycle_state x checkin_state evolve independently until REDEEMED, which requires checkin_state==ON_LANE."
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /tickets/{id}/confirm"
        actor: GuestPatron
        preconditions:
          - "SessionTicket.lifecycle_state == RESERVED"
          - "an ACTIVE Waiver exists for holder_patron_id at park_id"
          - "Park.operational_posture == OPEN"
          - "committed_rider_count of the target TimeBlock + 1 <= sum of OPEN lane capacities (capacity guard)"
        side_effects:
          - "SessionTicket.lifecycle_state := CONFIRMED"
          - "ledger sync: TimeBlock.committed_rider_count += 1; recompute Park.total_capacity_remaining"
      - from: CONFIRMED
        to: REFUNDED
        trigger: "POST /tickets/{id}/refund"
        actor: GuestPatron
        preconditions:
          - "SessionTicket.lifecycle_state == CONFIRMED"
          - "SessionTicket.checkin_state == NOT_CHECKED_IN"
        side_effects:
          - "SessionTicket.lifecycle_state := REFUNDED"
          - "ledger sync: TimeBlock.committed_rider_count -= 1; recompute Park.total_capacity_remaining"
          - "creates RefundEntry(reason=PATRON_CANCEL, amount=base_price_cents)"
          - "if season_pass_id set: SeasonPass.redemptions_today_count -= 1 (release the redemption slot)"
      - from: CONFIRMED
        to: REDEEMED
        trigger: "POST /tickets/{id}/redeem"
        actor: SafetyMarshal
        preconditions:
          - "SessionTicket.lifecycle_state == CONFIRMED"
          - "SessionTicket.checkin_state == ON_LANE"
          - "the ticket's TimeBlock.status == ACTIVE"
        side_effects:
          - "SessionTicket.lifecycle_state := REDEEMED"
      - from: CONFIRMED
        to: EXPIRED
        trigger: "system: Lane CLOSED cascade OR TimeBlock SWEPT cascade"
        actor: system
        preconditions:
          - "SessionTicket.lifecycle_state == CONFIRMED"
        side_effects:
          - "SessionTicket.lifecycle_state := EXPIRED"
          - "ledger sync: TimeBlock.committed_rider_count -= 1; recompute Park.total_capacity_remaining"
          - "if triggered by WEATHER closure: creates RefundEntry(reason=WEATHER_CLOSURE, amount=base_price_cents)"
      # parallel checkin dimension
      - from: NOT_CHECKED_IN
        to: GEARED_UP
        trigger: "POST /tickets/{id}/gear-up"
        actor: SafetyMarshal
        preconditions:
          - "SessionTicket.checkin_state == NOT_CHECKED_IN"
          - "SessionTicket.lifecycle_state == CONFIRMED"
          - "at least one DISPATCHED EquipmentRental of equipment_type==TUBE exists for this ticket"
        side_effects:
          - "SessionTicket.checkin_state := GEARED_UP"
      - from: GEARED_UP
        to: ON_LANE
        trigger: "POST /tickets/{id}/board (creates a ConveyorTurn)"
        actor: SafetyMarshal
        preconditions:
          - "SessionTicket.checkin_state == GEARED_UP"
          - "the target Lane.status == OPEN"
        side_effects:
          - "SessionTicket.checkin_state := ON_LANE"
          - "creates ConveyorTurn(state=BOARDED) on the lane"

  - entity: GroupReservation
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    note: "Revision cycle: HELD can revert to DRAFT for re-quote, forming DRAFT->HELD->DRAFT loop."
    transitions:
      - from: DRAFT
        to: HELD
        trigger: "POST /group-reservations/{id}/hold"
        actor: GroupHost
        preconditions:
          - "GroupReservation.state == DRAFT"
          - "Park.operational_posture == OPEN"
          - "if EXCLUSIVE_LANE: target Lane.status == OPEN and not already held by another reservation in the same TimeBlock"
          - "if SHARED_SEATS: TimeBlock.committed_rider_count + party_size <= sum of OPEN lane capacities"
        side_effects:
          - "GroupReservation.state := HELD"
          - "compute deposit_cents (group_deposit calc)"
          - "if EXCLUSIVE_LANE: Lane.status := CLOSED with closure_reason=GROUP_RENTAL; bubble-up recompute Park.open_lane_count and total_capacity_remaining"
      - from: HELD
        to: DRAFT
        trigger: "POST /group-reservations/{id}/revise"
        actor: GroupHost
        preconditions:
          - "GroupReservation.state == HELD"
        side_effects:
          - "GroupReservation.state := DRAFT"
          - "if EXCLUSIVE_LANE: release the lane -> Lane.status := OPEN, closure_reason := null; bubble-up recompute Park.open_lane_count and total_capacity_remaining"
      - from: HELD
        to: CONFIRMED
        trigger: "POST /group-reservations/{id}/confirm"
        actor: GroupHost
        preconditions:
          - "GroupReservation.state == HELD"
          - "Park.operational_posture == OPEN"
        side_effects:
          - "GroupReservation.state := CONFIRMED"
          - "if SHARED_SEATS: TimeBlock.committed_rider_count += party_size; recompute Park.total_capacity_remaining"
      - from: HELD
        to: CANCELLED
        trigger: "POST /group-reservations/{id}/cancel"
        actor: GroupHost
        preconditions:
          - "GroupReservation.state == HELD"
        side_effects:
          - "GroupReservation.state := CANCELLED"
          - "if EXCLUSIVE_LANE: release lane -> Lane.status := OPEN, closure_reason := null; bubble-up recompute"
          - "creates RefundEntry(reason=GROUP_CANCEL, amount=deposit_cents)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /group-reservations/{id}/cancel"
        actor: GroupHost
        preconditions:
          - "GroupReservation.state == CONFIRMED"
        side_effects:
          - "GroupReservation.state := CANCELLED"
          - "if SHARED_SEATS: TimeBlock.committed_rider_count -= party_size; recompute Park.total_capacity_remaining"
          - "if EXCLUSIVE_LANE: release lane -> Lane.status := OPEN, closure_reason := null; bubble-up recompute"
          - "creates RefundEntry(reason=GROUP_CANCEL, amount=deposit_cents)"

  - entity: EquipmentRental
    initial_state: DISPATCHED
    terminal_states: [RETURNED, DAMAGED]
    transitions:
      - from: DISPATCHED
        to: RETURNED
        trigger: "POST /equipment-rentals/{id}/return"
        actor: SafetyMarshal
        preconditions:
          - "EquipmentRental.state == DISPATCHED"
        side_effects:
          - "EquipmentRental.state := RETURNED"
      - from: DISPATCHED
        to: DAMAGED
        trigger: "POST /equipment-rentals/{id}/report-damage"
        actor: SafetyMarshal
        preconditions:
          - "EquipmentRental.state == DISPATCHED"
        side_effects:
          - "EquipmentRental.state := DAMAGED"

  - entity: ConveyorTurn
    initial_state: BOARDED
    terminal_states: [CLEARED]
    transitions:
      - from: BOARDED
        to: CLEARED
        trigger: "POST /conveyor-turns/{id}/clear"
        actor: ParkOperator
        preconditions:
          - "ConveyorTurn.state == BOARDED"
          - "clock-UTC >= cleared_at (boarded_at + lane.conveyor_cycle_seconds)"
        side_effects:
          - "ConveyorTurn.state := CLEARED"
          - "the rider's SessionTicket.checkin_state may be advanced back to GEARED_UP by a separate dismount call (not auto)"

  - entity: Waiver
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /waivers/{id}/revoke"
        actor: SafetyMarshal
        preconditions:
          - "Waiver.status == ACTIVE"
        side_effects:
          - "Waiver.status := REVOKED"
          - "note: any subsequent ticket confirm/board for this holder at this park now fails ERR_WAIVER_MISSING unless another ACTIVE waiver exists"

  - entity: SeasonPass
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /season-passes/{id}/suspend"
        actor: ParkOperator
        preconditions:
          - "SeasonPass.status == ACTIVE"
        side_effects:
          - "SeasonPass.status := SUSPENDED"
          - "note: ticket creation against a SUSPENDED pass fails ERR_PASS_NOT_VALID"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock daily-sweep when clock-UTC >= valid_until"
        actor: system
        preconditions:
          - "SeasonPass.status == ACTIVE"
          - "clock-UTC >= SeasonPass.valid_until"
        side_effects:
          - "SeasonPass.status := EXPIRED"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: clock daily-sweep when clock-UTC >= valid_until"
        actor: system
        preconditions:
          - "SeasonPass.status == SUSPENDED"
          - "clock-UTC >= SeasonPass.valid_until"
        side_effects:
          - "SeasonPass.status := EXPIRED"

# ===========================================================================
# §1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: ticket-confirm-stale-block
    parent_entity: TimeBlock
    write_endpoint: "POST /tickets/{id}/confirm"
    occ_field: "expected_time_block_version"
    description: |
      Confirming a SessionTicket into a TimeBlock whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just confirmed a ticket (which legitimately
      consumes a capacity slot and bumps committed_rider_count) so the current
      writer's view of remaining capacity is stale; proceeding could push the
      block past its OPEN-lane capacity guard.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: group-hold-stale-lane-block
    parent_entity: TimeBlock
    write_endpoint: "POST /group-reservations/{id}/hold"
    occ_field: "expected_time_block_version"
    description: |
      Placing a HELD on a GroupReservation against a TimeBlock whose version
      has advanced since the host last observed it is rejected. Another writer
      may have just held/confirmed seats or an exclusive lane in the same block
      (consuming capacity and bumping committed_rider_count), so the host's
      capacity view is stale and the hold could oversubscribe the block.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: ticket_pricing
    trigger: "on POST /tickets (ticket creation) — computes base_price_cents"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: (1) pick base by age tier, (2) apply pass
      # discount, (3) apply resident discount, (4) round once at the end.
      if rider_age_years < 6:            base = CHILD_CENTS        # 1500
      elif rider_age_years < 13:         base = JUNIOR_CENTS       # 2500
      elif rider_age_years >= 65:        base = SENIOR_CENTS       # 2000
      else:                              base = ADULT_CENTS        # 3500
      discount_factor = 1.0
      if season_pass_id is not null:
        if pass.tier == SILVER:          discount_factor *= (1 - 0.10)
        elif pass.tier == GOLD:          discount_factor *= (1 - 0.25)
        elif pass.tier == RESIDENT_GOLD: discount_factor *= (1 - 0.40)
      if is_resident and pass.tier != RESIDENT_GOLD:
        discount_factor *= (1 - 0.05)    # resident stacks except already RESIDENT_GOLD
      base_price_cents = round_half_up(base * discount_factor)   # single rounding at the end
    input_set: "Single ticket; pass.tier read from linked SeasonPass when season_pass_id set; is_resident from issuance-time computation."
    constants:
      CHILD_CENTS: 1500
      JUNIOR_CENTS: 2500
      ADULT_CENTS: 3500
      SENIOR_CENTS: 2000
      SILVER_DISCOUNT: 0.10
      GOLD_DISCOUNT: 0.25
      RESIDENT_GOLD_DISCOUNT: 0.40
      RESIDENT_DISCOUNT: 0.05
    precision: "round_half_up to whole cents; rounding applied exactly once after both discount factors multiply"
    variants:
      - name: walkup_price
        when: "season_pass_id is null"
        difference: "no pass discount factor; only the resident 5% may apply"
      - name: pass_redeemed_price
        when: "season_pass_id set"
        difference: "pass discount applied first; resident 5% stacks unless tier==RESIDENT_GOLD"

  - name: group_deposit
    trigger: "on POST /group-reservations/{id}/hold (DRAFT->HELD) — computes deposit_cents"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs with non-linear interaction: party_size, rental_type, and a
      # per-head rate that itself tiers on party_size, plus an exclusive-lane flat.
      if party_size <= 5:        per_head = TIER1_PER_HEAD_CENTS    # 3000
      elif party_size <= 12:     per_head = TIER2_PER_HEAD_CENTS    # 2600
      else:                      per_head = TIER3_PER_HEAD_CENTS    # 2200
      seats_subtotal = per_head * party_size
      if rental_type == EXCLUSIVE_LANE:
        deposit_cents = seats_subtotal + EXCLUSIVE_LANE_FLAT_CENTS  # +20000
      else:
        deposit_cents = max(seats_subtotal, MIN_SHARED_DEPOSIT_CENTS)  # floor 8000
    input_set: "Single GroupReservation at hold time; per_head selected by the party_size tier, NOT marginal — the whole party bills at the tier its size falls into."
    constants:
      TIER1_PER_HEAD_CENTS: 3000
      TIER2_PER_HEAD_CENTS: 2600
      TIER3_PER_HEAD_CENTS: 2200
      EXCLUSIVE_LANE_FLAT_CENTS: 20000
      MIN_SHARED_DEPOSIT_CENTS: 8000
    precision: "whole cents; per-head rate is average (flat) within the selected tier, not marginal across tier boundaries"

  - name: addon_line_total
    trigger: "on POST /add-ons (add-on creation) — computes line_total_cents"
    algorithm: aggregation
    formula: |
      # Nested rounding where order MATTERS — scaffold PINS: discount the
      # per-unit price, round per-unit FIRST, THEN multiply by quantity.
      # (round-per-unit-then-multiply, NOT multiply-then-round.)
      raw_unit = unit_price_cents
      if linked ticket holder has an ACTIVE GOLD or RESIDENT_GOLD SeasonPass and category == FOOD:
        discounted_unit = raw_unit * (1 - ADDON_FOOD_PASS_DISCOUNT)   # 0.15
      elif ticket.is_resident and category == HOT_DRINK:
        discounted_unit = raw_unit * (1 - ADDON_RESIDENT_DRINK_DISCOUNT)  # 0.10
      else:
        discounted_unit = raw_unit
      unit_rounded = round_half_up(discounted_unit)        # round PER UNIT first
      line_total_cents = unit_rounded * quantity           # then multiply
    input_set: "Single AddOn line; pass/resident eligibility read from the linked SessionTicket and its holder's SeasonPass at order time."
    constants:
      ADDON_FOOD_PASS_DISCOUNT: 0.15
      ADDON_RESIDENT_DRINK_DISCOUNT: 0.10
    precision: "round_half_up per unit BEFORE multiplying by quantity (pinned order); the product is exact (no second rounding)"

  - name: turn_clearance_time
    trigger: "on POST /tickets/{id}/board (creates ConveyorTurn) — computes cleared_at"
    algorithm: interval_merge
    formula: |
      cleared_at = boarded_at + lane.conveyor_cycle_seconds (seconds)
      # Lane-occupancy overlap: a new ConveyorTurn on a lane is rejected if its
      # [boarded_at, cleared_at) half-open interval overlaps an existing BOARDED
      # turn on the SAME lane. Adjacency (new.boarded_at == existing.cleared_at)
      # is ALLOWED (half-open, zero buffer).
    input_set: "All ConveyorTurns on the same lane in state BOARDED; interval is half-open [boarded_at, cleared_at)."
    constants: {}
    precision: "second resolution; cleared_at = boarded_at + conveyor_cycle_seconds exactly"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /patrons and POST /parks (bootstrap)"
  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the resource (GuestPatron == ticket.holder_patron_id; GroupHost == reservation.host_patron_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ticket/group ownership mutations"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "On OCC write endpoints, expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /tickets/{id}/confirm, POST /group-reservations/{id}/hold"
  - priority: 7
    category: business_safety
    check: "Park.operational_posture == CLOSED blocks all confirm/hold/activate/board operations"
    error_id: ERR_PARK_CLOSED
    http_status: 409
    applies_to: "confirm, hold, group confirm, activate, board"
  - priority: 8
    category: business_safety
    check: "An ACTIVE Waiver exists for the holder at the park before ticket confirm/board"
    error_id: ERR_WAIVER_MISSING
    http_status: 409
    applies_to: "POST /tickets/{id}/confirm, POST /tickets/{id}/board"
  - priority: 9
    category: business_safety
    check: "Minor riders (rider_age_years < 18) require the holder's ACTIVE Waiver to carry a non-null guardian_name"
    error_id: ERR_GUARDIAN_REQUIRED
    http_status: 422
    applies_to: "POST /tickets/{id}/confirm"
  - priority: 10
    category: business_safety
    check: "rider_height_cm >= MIN_TUBE_HEIGHT_CM (92) when gearing up with a TUBE"
    error_id: ERR_HEIGHT_BELOW_MIN
    http_status: 422
    applies_to: "POST /tickets/{id}/gear-up"
  - priority: 11
    category: business_temporal
    check: "A new ConveyorTurn's [boarded_at, cleared_at) must not overlap an existing BOARDED turn on the same lane (adjacency allowed)"
    error_id: ERR_LANE_TURN_OVERLAP
    http_status: 409
    applies_to: "POST /tickets/{id}/board"
  - priority: 12
    category: business_temporal
    check: "TimeBlock.activate requires clock-UTC within [starts_at, ends_at)"
    error_id: ERR_BLOCK_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /time-blocks/{id}/activate"
  - priority: 13
    category: business_constraint
    check: "EXCLUSIVE_LANE group hold requires the target lane not already CLOSED/held for another group in that block"
    error_id: ERR_LANE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /group-reservations/{id}/hold"
  - priority: 14
    category: business_constraint
    check: "SeasonPass daily redemption allowance not exceeded (SILVER 2, GOLD 4, RESIDENT_GOLD 6 per day)"
    error_id: ERR_PASS_DAILY_LIMIT
    http_status: 409
    applies_to: "POST /tickets when season_pass_id set"
  - priority: 15
    category: business_constraint
    check: "SeasonPass.status == ACTIVE and clock-UTC within [valid_from, valid_until)"
    error_id: ERR_PASS_NOT_VALID
    http_status: 409
    applies_to: "POST /tickets when season_pass_id set"
  - priority: 16
    category: business_fiscal
    check: "Committing a ticket/group must not push TimeBlock.committed_rider_count above sum of OPEN-lane capacities"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /tickets/{id}/confirm, POST /group-reservations/{id}/confirm, POST /group-reservations/{id}/hold (SHARED_SEATS)"
  - priority: 17
    category: business_constraint
    check: "EXCLUSIVE_LANE group reservations must carry a non-null lane_id; SHARED_SEATS must NOT carry a lane_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /group-reservations"
  - priority: 18
    category: business_constraint
    check: "Required body fields present and well-typed; enum values in declared set; numeric ranges honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- bootstrap / config ----
  - method: POST
    path: "/patrons"
    description: "Register a patron (bootstrap; no auth)."
    roles: [Anonymous, ParkOperator]
    code: 201
    input: [full_name, zip_code, birthdate]
    output: Patron
    side_effects: []
  - method: GET
    path: "/patrons/{id}"
    description: "Fetch a patron."
    roles: [GuestPatron, GroupHost, ParkOperator, SafetyMarshal]
    code: 200
    input: []
    output: Patron
    side_effects: []
  - method: POST
    path: "/parks"
    description: "Create a park (bootstrap; no auth). operational_posture starts OPEN."
    roles: [Anonymous, ParkOperator]
    code: 201
    input: [name, "timezone_offset_minutes?", "resident_zip_prefixes?", "min_snow_depth_cm?", "max_safe_wind_kph?"]
    output: Park
    side_effects: ["Park.operational_posture := OPEN"]
  - method: GET
    path: "/parks/{id}"
    description: "Fetch a park incl. computed posture and capacity fields."
    roles: [GuestPatron, GroupHost, ParkOperator, SafetyMarshal]
    code: 200
    input: []
    output: Park
    side_effects: []
  - method: GET
    path: "/parks"
    description: "List parks (paginated)."
    roles: [GuestPatron, GroupHost, ParkOperator, SafetyMarshal]
    code: 200
    input: ["limit?", "offset?"]
    output: Park[]
    side_effects: []

  # ---- lanes ----
  - method: POST
    path: "/parks/{id}/lanes"
    description: "Create a lane under a park."
    roles: [ParkOperator]
    code: 201
    input: [label, rider_capacity_per_block, conveyor_cycle_seconds]
    output: Lane
    side_effects: ["recompute Park.open_lane_count, Park.total_capacity_remaining, increments Park.version by 1"]
  - method: GET
    path: "/parks/{id}/lanes"
    description: "List lanes for a park (reverse-reachability for Lane.park_id)."
    roles: [GuestPatron, GroupHost, ParkOperator, SafetyMarshal]
    code: 200
    input: ["limit?", "offset?"]
    output: Lane[]
    side_effects: []
  - method: GET
    path: "/lanes/{id}"
    description: "Fetch a lane."
    roles: [GuestPatron, GroupHost, ParkOperator, SafetyMarshal]
    code: 200
    input: []
    output: Lane
    side_effects: []
  - method: POST
    path: "/lanes/{id}/groom"
    description: "Transition lane OPEN->GROOMING."
    roles: [ParkOperator]
    code: 200
    input: []
    output: Lane
    side_effects: ["bubble-up recompute of Park.open_lane_count and total_capacity_remaining"]
  - method: POST
    path: "/lanes/{id}/reopen"
    description: "Transition lane GROOMING/CLOSED->OPEN."
    roles: [ParkOperator]
    code: 200
    input: []
    output: Lane
    side_effects: ["bubble-up recompute of Park.open_lane_count and total_capacity_remaining"]
  - method: POST
    path: "/lanes/{id}/close"
    description: "Transition lane OPEN->CLOSED (MAINTENANCE); cascades CONFIRMED ticket expiry + weather/maintenance refund."
    roles: [ParkOperator]
    code: 200
    input: []
    output: Lane
    side_effects: ["cascade CONFIRMED->EXPIRED for tickets on this lane; create RefundEntry per weather-closed ticket; recompute Park aggregates"]

  # ---- time blocks ----
  - method: POST
    path: "/parks/{id}/time-blocks"
    description: "Create a time block under a park."
    roles: [ParkOperator]
    code: 201
    input: [starts_at, ends_at]
    output: TimeBlock
    side_effects: []
  - method: GET
    path: "/parks/{id}/time-blocks"
    description: "List time blocks for a park (reverse-reachability for TimeBlock.park_id)."
    roles: [GuestPatron, GroupHost, ParkOperator, SafetyMarshal]
    code: 200
    input: ["limit?", "offset?"]
    output: TimeBlock[]
    side_effects: []
  - method: GET
    path: "/time-blocks/{id}"
    description: "Fetch a time block incl. committed_rider_count."
    roles: [GuestPatron, GroupHost, ParkOperator, SafetyMarshal]
    code: 200
    input: []
    output: TimeBlock
    side_effects: []
  - method: POST
    path: "/time-blocks/{id}/activate"
    description: "Transition block SCHEDULED->ACTIVE."
    roles: [ParkOperator]
    code: 200
    input: []
    output: TimeBlock
    side_effects: []
  - method: POST
    path: "/time-blocks/{id}/sweep"
    description: "Transition block ACTIVE->SWEPT; expires no-show CONFIRMED tickets (no refund)."
    roles: [ParkOperator]
    code: 200
    input: []
    output: TimeBlock
    side_effects: ["cascade no-show CONFIRMED tickets -> EXPIRED; recompute committed_rider_count and Park aggregates"]

  # ---- weather ----
  - method: POST
    path: "/parks/{id}/weather-logs"
    description: "Append a weather reading; recomputes Park.operational_posture (may cascade lane closures + ticket expiry + refunds). Logical clock default 2026-03-01T00:00:00Z governs date math."
    roles: [ParkOperator]
    code: 201
    input: [observed_at, snow_depth_cm, wind_kph]
    output: WeatherLog
    side_effects: ["recompute Park.operational_posture; cascade lane closures/ticket expiry/refunds on CLOSED; increments Park.version by 1"]
  - method: GET
    path: "/parks/{id}/weather-logs"
    description: "List weather readings for a park (reverse-reachability for WeatherLog.park_id)."
    roles: [GuestPatron, GroupHost, ParkOperator, SafetyMarshal]
    code: 200
    input: ["limit?", "offset?"]
    output: WeatherLog[]
    side_effects: []

  # ---- waivers ----
  - method: POST
    path: "/waivers"
    description: "Sign a waiver for a patron at a park."
    roles: [GuestPatron, SafetyMarshal]
    code: 201
    input: [patron_id, park_id, signed_at, "guardian_name?"]
    output: Waiver
    side_effects: []
  - method: GET
    path: "/waivers"
    description: "List waivers; filter by patron_id and/or park_id (reverse-reachability for Waiver.patron_id and Waiver.park_id)."
    roles: [GuestPatron, SafetyMarshal, ParkOperator]
    code: 200
    input: ["patron_id?", "park_id?", "limit?", "offset?"]
    output: Waiver[]
    side_effects: []
  - method: GET
    path: "/waivers/{id}"
    description: "Fetch a single waiver incl. status."
    roles: [GuestPatron, SafetyMarshal, ParkOperator]
    code: 200
    input: []
    output: Waiver
    side_effects: []
  - method: POST
    path: "/waivers/{id}/revoke"
    description: "Transition waiver ACTIVE->REVOKED."
    roles: [SafetyMarshal]
    code: 200
    input: []
    output: Waiver
    side_effects: []

  # ---- season passes ----
  - method: POST
    path: "/season-passes"
    description: "Issue a season pass to a patron."
    roles: [ParkOperator, GuestPatron]
    code: 201
    input: [park_id, holder_patron_id, tier, valid_from, valid_until]
    output: SeasonPass
    side_effects: []
  - method: GET
    path: "/season-passes"
    description: "List season passes; filter by holder_patron_id and/or park_id (reverse-reachability)."
    roles: [GuestPatron, ParkOperator]
    code: 200
    input: ["holder_patron_id?", "park_id?", "limit?", "offset?"]
    output: SeasonPass[]
    side_effects: []
  - method: GET
    path: "/season-passes/{id}"
    description: "Fetch a season pass incl. redemptions_today_count."
    roles: [GuestPatron, ParkOperator]
    code: 200
    input: []
    output: SeasonPass
    side_effects: []
  - method: POST
    path: "/season-passes/{id}/suspend"
    description: "Transition pass ACTIVE->SUSPENDED."
    roles: [ParkOperator]
    code: 200
    input: []
    output: SeasonPass
    side_effects: []

  # ---- tickets ----
  - method: POST
    path: "/tickets"
    description: "Create a SessionTicket (RESERVED). Computes base_price_cents and is_resident. If season_pass_id set, enforces pass validity + daily limit and bumps redemptions_today_count."
    roles: [GuestPatron]
    code: 201
    input: [park_id, time_block_id, holder_patron_id, rider_height_cm, rider_age_years, "season_pass_id?", "upgraded_from_ticket_id?"]
    output: SessionTicket
    side_effects: ["compute base_price_cents (ticket_pricing), is_resident; if season_pass_id: SeasonPass.redemptions_today_count += 1"]
  - method: GET
    path: "/tickets/{id}"
    description: "Fetch a ticket incl. lifecycle_state, checkin_state, base_price_cents."
    roles: [GuestPatron, SafetyMarshal, ParkOperator]
    code: 200
    input: []
    output: SessionTicket
    side_effects: []
  - method: GET
    path: "/tickets"
    description: "List tickets; filter by holder_patron_id, park_id, time_block_id, season_pass_id, upgraded_from_ticket_id (reverse-reachability for all SessionTicket FKs)."
    roles: [GuestPatron, SafetyMarshal, ParkOperator]
    code: 200
    input: ["holder_patron_id?", "park_id?", "time_block_id?", "season_pass_id?", "upgraded_from_ticket_id?", "limit?", "offset?"]
    output: SessionTicket[]
    side_effects: []
  - method: POST
    path: "/tickets/{id}/confirm"
    description: "Transition ticket RESERVED->CONFIRMED. OCC on the target TimeBlock.version; enforces waiver, guardian, posture, capacity."
    roles: [GuestPatron]
    code: 200
    input: [expected_time_block_version]
    output: SessionTicket
    side_effects: ["TimeBlock.committed_rider_count += 1; increments TimeBlock.version by 1; recompute Park.total_capacity_remaining"]
  - method: POST
    path: "/tickets/{id}/refund"
    description: "Transition ticket CONFIRMED->REFUNDED (patron cancel); creates RefundEntry; releases capacity and pass redemption."
    roles: [GuestPatron]
    code: 200
    input: []
    output: SessionTicket
    side_effects: ["TimeBlock.committed_rider_count -= 1; create RefundEntry(PATRON_CANCEL); if pass: redemptions_today_count -= 1; recompute Park aggregates"]
  - method: POST
    path: "/tickets/{id}/gear-up"
    description: "Transition checkin NOT_CHECKED_IN->GEARED_UP; enforces height-min for TUBE."
    roles: [SafetyMarshal]
    code: 200
    input: []
    output: SessionTicket
    side_effects: []
  - method: POST
    path: "/tickets/{id}/board"
    description: "Transition checkin GEARED_UP->ON_LANE; creates a ConveyorTurn; enforces lane-turn overlap + waiver + posture."
    roles: [SafetyMarshal]
    code: 200
    input: [lane_id, boarded_at]
    output: SessionTicket
    side_effects: ["create ConveyorTurn(BOARDED) with cleared_at = boarded_at + lane.conveyor_cycle_seconds"]
  - method: POST
    path: "/tickets/{id}/redeem"
    description: "Transition lifecycle CONFIRMED->REDEEMED; requires checkin_state==ON_LANE and ACTIVE block."
    roles: [SafetyMarshal]
    code: 200
    input: []
    output: SessionTicket
    side_effects: []

  # ---- equipment rentals ----
  - method: POST
    path: "/equipment-rentals"
    description: "Dispatch a piece of equipment against a ticket (DISPATCHED)."
    roles: [SafetyMarshal]
    code: 201
    input: [ticket_id, equipment_type, "tube_size?"]
    output: EquipmentRental
    side_effects: []
  - method: GET
    path: "/equipment-rentals"
    description: "List equipment rentals; filter by ticket_id (reverse-reachability for EquipmentRental.ticket_id)."
    roles: [SafetyMarshal, ParkOperator, GuestPatron]
    code: 200
    input: ["ticket_id?", "limit?", "offset?"]
    output: EquipmentRental[]
    side_effects: []
  - method: GET
    path: "/equipment-rentals/{id}"
    description: "Fetch a single equipment rental incl. state."
    roles: [SafetyMarshal, ParkOperator, GuestPatron]
    code: 200
    input: []
    output: EquipmentRental
    side_effects: []
  - method: POST
    path: "/equipment-rentals/{id}/return"
    description: "Transition rental DISPATCHED->RETURNED."
    roles: [SafetyMarshal]
    code: 200
    input: []
    output: EquipmentRental
    side_effects: []
  - method: POST
    path: "/equipment-rentals/{id}/report-damage"
    description: "Transition rental DISPATCHED->DAMAGED."
    roles: [SafetyMarshal]
    code: 200
    input: []
    output: EquipmentRental
    side_effects: []

  # ---- conveyor turns ----
  - method: GET
    path: "/conveyor-turns"
    description: "List conveyor turns; filter by lane_id, time_block_id, ticket_id (reverse-reachability for all ConveyorTurn FKs)."
    roles: [ParkOperator, SafetyMarshal]
    code: 200
    input: ["lane_id?", "time_block_id?", "ticket_id?", "limit?", "offset?"]
    output: ConveyorTurn[]
    side_effects: []
  - method: GET
    path: "/conveyor-turns/{id}"
    description: "Fetch a conveyor turn incl. cleared_at."
    roles: [ParkOperator, SafetyMarshal]
    code: 200
    input: []
    output: ConveyorTurn
    side_effects: []
  - method: POST
    path: "/conveyor-turns/{id}/clear"
    description: "Transition turn BOARDED->CLEARED; requires clock-UTC >= cleared_at."
    roles: [ParkOperator]
    code: 200
    input: []
    output: ConveyorTurn
    side_effects: []

  # ---- group reservations ----
  - method: POST
    path: "/group-reservations"
    description: "Create a group reservation (DRAFT)."
    roles: [GroupHost]
    code: 201
    input: [park_id, host_patron_id, time_block_id, rental_type, party_size, "lane_id?"]
    output: GroupReservation
    side_effects: []
  - method: GET
    path: "/group-reservations"
    description: "List group reservations; filter by host_patron_id, park_id, time_block_id, lane_id (reverse-reachability for all GroupReservation FKs)."
    roles: [GroupHost, ParkOperator]
    code: 200
    input: ["host_patron_id?", "park_id?", "time_block_id?", "lane_id?", "limit?", "offset?"]
    output: GroupReservation[]
    side_effects: []
  - method: GET
    path: "/group-reservations/{id}"
    description: "Fetch a group reservation incl. deposit_cents and state."
    roles: [GroupHost, ParkOperator]
    code: 200
    input: []
    output: GroupReservation
    side_effects: []
  - method: POST
    path: "/group-reservations/{id}/hold"
    description: "Transition DRAFT->HELD. OCC on target TimeBlock.version; computes deposit; closes lane for EXCLUSIVE_LANE."
    roles: [GroupHost]
    code: 200
    input: [expected_time_block_version]
    output: GroupReservation
    side_effects: ["compute deposit_cents (group_deposit); EXCLUSIVE_LANE closes lane; increments TimeBlock.version by 1; recompute Park aggregates"]
  - method: POST
    path: "/group-reservations/{id}/revise"
    description: "Transition HELD->DRAFT (revision loop); releases held lane if EXCLUSIVE_LANE."
    roles: [GroupHost]
    code: 200
    input: []
    output: GroupReservation
    side_effects: ["EXCLUSIVE_LANE releases lane back to OPEN; recompute Park aggregates"]
  - method: POST
    path: "/group-reservations/{id}/confirm"
    description: "Transition HELD->CONFIRMED; commits SHARED_SEATS capacity."
    roles: [GroupHost]
    code: 200
    input: []
    output: GroupReservation
    side_effects: ["SHARED_SEATS: TimeBlock.committed_rider_count += party_size; recompute Park aggregates"]
  - method: POST
    path: "/group-reservations/{id}/cancel"
    description: "Transition HELD/CONFIRMED->CANCELLED; releases capacity/lane; creates RefundEntry(GROUP_CANCEL)."
    roles: [GroupHost]
    code: 200
    input: []
    output: GroupReservation
    side_effects: ["release SHARED_SEATS capacity or EXCLUSIVE_LANE lane; create RefundEntry(GROUP_CANCEL); recompute Park aggregates"]

  # ---- add-ons ----
  - method: POST
    path: "/add-ons"
    description: "Order an add-on against a ticket; computes line_total_cents."
    roles: [GuestPatron, SafetyMarshal]
    code: 201
    input: [park_id, ticket_id, category, unit_price_cents, quantity]
    output: AddOn
    side_effects: ["compute line_total_cents (addon_line_total)"]
  - method: GET
    path: "/add-ons"
    description: "List add-ons; filter by ticket_id and/or park_id (reverse-reachability for AddOn.ticket_id and AddOn.park_id)."
    roles: [GuestPatron, SafetyMarshal, ParkOperator]
    code: 200
    input: ["ticket_id?", "park_id?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []
  - method: GET
    path: "/add-ons/{id}"
    description: "Fetch a single add-on incl. line_total_cents and state."
    roles: [GuestPatron, SafetyMarshal, ParkOperator]
    code: 200
    input: []
    output: AddOn
    side_effects: []
  - method: POST
    path: "/add-ons/{id}/fulfill"
    description: "Transition add-on ORDERED->FULFILLED."
    roles: [SafetyMarshal]
    code: 200
    input: []
    output: AddOn
    side_effects: []
  - method: POST
    path: "/add-ons/{id}/void"
    description: "Transition add-on ORDERED->VOIDED."
    roles: [GuestPatron, SafetyMarshal]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  # ---- refunds (reverse-reachability for RefundEntry FKs) ----
  - method: GET
    path: "/refund-entries"
    description: "List refund entries; filter by ticket_id and/or group_reservation_id (reverse-reachability for RefundEntry.ticket_id and RefundEntry.group_reservation_id)."
    roles: [GuestPatron, GroupHost, ParkOperator]
    code: 200
    input: ["ticket_id?", "group_reservation_id?", "limit?", "offset?"]
    output: RefundEntry[]
    side_effects: []
  - method: GET
    path: "/refund-entries/{id}"
    description: "Fetch a single refund entry."
    roles: [GuestPatron, GroupHost, ParkOperator]
    code: 200
    input: []
    output: RefundEntry
    side_effects: []

  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for all date/window/expiry math. Default before any call is 2026-03-01T00:00:00Z; the clock never falls back to real wall-clock time."
    roles: [ParkOperator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock := to_iso8601; daily sweep resets SeasonPass.redemptions_today_count to 0 when the UTC date advances AND flips any ACTIVE SeasonPass whose valid_until <= new clock-UTC to EXPIRED"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID on an authenticated endpoint."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint per §1.7."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the targeted ticket/reservation."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)."
  - id: ERR_PARK_CLOSED
    http: 409
    condition: "Operation blocked because Park.operational_posture == CLOSED."
  - id: ERR_WAIVER_MISSING
    http: 409
    condition: "No ACTIVE waiver for the holder at the park when one is required."
  - id: ERR_GUARDIAN_REQUIRED
    http: 422
    condition: "Minor rider (< 18) but the ACTIVE waiver has no guardian_name."
  - id: ERR_HEIGHT_BELOW_MIN
    http: 422
    condition: "rider_height_cm below MIN_TUBE_HEIGHT_CM (92) when gearing up with a TUBE."
  - id: ERR_LANE_TURN_OVERLAP
    http: 409
    condition: "New ConveyorTurn interval overlaps an existing BOARDED turn on the same lane."
  - id: ERR_BLOCK_WINDOW_CLOSED
    http: 409
    condition: "TimeBlock.activate attempted outside [starts_at, ends_at)."
  - id: ERR_LANE_UNAVAILABLE
    http: 409
    condition: "EXCLUSIVE_LANE hold targets a lane already CLOSED/held for another group in the block."
  - id: ERR_PASS_DAILY_LIMIT
    http: 409
    condition: "SeasonPass daily redemption allowance exceeded for the clock-UTC date."
  - id: ERR_PASS_NOT_VALID
    http: 409
    condition: "SeasonPass not ACTIVE or clock-UTC outside [valid_from, valid_until)."
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "Commit would push TimeBlock.committed_rider_count above sum of OPEN-lane capacities."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad type, out-of-range number, or enum not in declared set."

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated bootstrap caller; may create parks and patrons only."
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /parks", "POST /patrons"]
  - name: GuestPatron
    description: "A guest who books and holds session tickets, season passes, waivers, and add-ons for themselves."
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "POST /tickets"
      - "POST /tickets/{id}/confirm"
      - "POST /tickets/{id}/refund"
    shared_operations:
      - "POST /waivers"
      - "POST /season-passes"
      - "POST /add-ons"
      - "POST /add-ons/{id}/void"
      - "GET reads"
  - name: GroupHost
    description: "Hosts a party/group reservation and manages its lifecycle."
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "POST /group-reservations"
      - "POST /group-reservations/{id}/hold"
      - "POST /group-reservations/{id}/revise"
      - "POST /group-reservations/{id}/confirm"
      - "POST /group-reservations/{id}/cancel"
    shared_operations: ["GET reads"]
  - name: ParkOperator
    description: "Operations staff: manages lanes, time blocks, weather, conveyor clearing, park/pass config."
    identity: opaque
    exclusive_operations:
      - "POST /parks/{id}/lanes"
      - "POST /lanes/{id}/groom"
      - "POST /lanes/{id}/reopen"
      - "POST /lanes/{id}/close"
      - "POST /parks/{id}/time-blocks"
      - "POST /time-blocks/{id}/activate"
      - "POST /time-blocks/{id}/sweep"
      - "POST /parks/{id}/weather-logs"
      - "POST /conveyor-turns/{id}/clear"
      - "POST /season-passes/{id}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations: ["POST /parks", "POST /patrons", "POST /season-passes", "GET reads"]
  - name: SafetyMarshal
    description: "Manages waivers, equipment dispatch, gear-up/board/redeem check-in, add-on fulfillment."
    identity: opaque
    exclusive_operations:
      - "POST /waivers/{id}/revoke"
      - "POST /tickets/{id}/gear-up"
      - "POST /tickets/{id}/board"
      - "POST /tickets/{id}/redeem"
      - "POST /equipment-rentals"
      - "POST /equipment-rentals/{id}/return"
      - "POST /equipment-rentals/{id}/report-damage"
      - "POST /add-ons/{id}/fulfill"
    shared_operations: ["POST /waivers", "POST /add-ons", "POST /add-ons/{id}/void", "GET reads"]
