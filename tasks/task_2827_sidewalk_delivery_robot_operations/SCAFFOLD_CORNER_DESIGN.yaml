        distinguishing_aspect: >-
          The plain arithmetic claim of route_plan_geometry: the same 774.0 m corridor plans to 13 minutes
          for a 100 cm/s robot (774 / 60.0 = 12.9, rounded up) and 9 minutes for a 150 cm/s robot
          (774 / 90.0 = 8.6, rounded up), so the derate factor 0.6 is applied to the robot on the plan's
