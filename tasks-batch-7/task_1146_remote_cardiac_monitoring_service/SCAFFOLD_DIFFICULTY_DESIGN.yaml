            - "Link 2: Technician.${t_id}.open_alert_load == 3"
            - "Link 3: Technician.${t_id}.fatigue_index == 0.60 and fatigue_status == AT_RISK (>= 0.60 boundary, inclusive)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_submit
        grounds:
          - validations[priority=5] (ERR_INVALID_STATE)
          - validations[priority=10] (ERR_BELOW_MINIMUM_BILLABLE_DAYS)
        distinguishing_aspect: |
          Category pair state vs business_fiscal: submitting an ACCRUING period
          whose final window is only 6 days fails both tier-5 state (not READY)
          and tier-10 fiscal (billable_days < 10); state wins with
          ERR_INVALID_STATE. The sibling instance exercises a different pair
          (business_safety vs business_referential).
        test_recipe:
          setup:
            - "EVENT episode prescribed 6 days, completed at 2026-05-07T00:00:00Z; billing generated (single 6-day window still ACCRUING; no sweep run)"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Iris Prio", date_of_birth: "1982-09-09", mrn: "MRN-1009", phone: "555-0109", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Prio", npi: "1000000009", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1009", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 6 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${ep_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { bp_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/billing-periods/${bp_id}/submit", payload: {}, as: BillingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 409 with error_id ERR_INVALID_STATE (period ACCRUING, not READY)"
            - "error_id is NOT ERR_BELOW_MINIMUM_BILLABLE_DAYS even though the 6-day window would also fail billable_days >= 10 (state tier 5 precedes fiscal tier 10)"

      - name: safety_beats_referential_on_finalize
        grounds:
          - validations[priority=6] (ERR_CRITICAL_ALERTS_OPEN)
          - validations[priority=8] (ERR_EPISODE_NOT_COMPLETED)
        distinguishing_aspect: |
          Category pair business_safety vs business_referential: finalizing a
          FINAL report on a MONITORING episode with an open CRITICAL alert fails
          both tier-6 safety and tier-8 referential; safety wins with
          ERR_CRITICAL_ALERTS_OPEN. Different pair from the sibling instance.
        test_recipe:
          setup:
            - "EVENT episode MONITORING; one CRITICAL alert in NEW status; FINAL report in DRAFT"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Judy Safe", date_of_birth: "1985-10-10", mrn: "MRN-1010", phone: "555-0110", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Safe", npi: "1000000010", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1010", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 30 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "PHONE" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/episodes/${ep_id}/alerts", payload: { severity: "CRITICAL", arrhythmia_type: "VTACH" }, as: DeviceGateway }
            - { call: "POST /v1/episodes/${ep_id}/reports", payload: { report_type: "FINAL", findings_summary: "premature", no_significant_findings: true }, as: Physician, as_user_id: "${dr_id}", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /v1/reports/${r_id}/finalize", payload: {}, as: Physician, as_user_id: "${dr_id}", captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 422 with error_id ERR_CRITICAL_ALERTS_OPEN"
            - "error_id is NOT ERR_EPISODE_NOT_COMPLETED even though the episode is still MONITORING (safety tier 6 precedes referential tier 8)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: billable_days_ten_vs_nine
        grounds:
          - calculations.billing_amounts (MIN_BILLABLE_DAYS)
          - validations[priority=10] (ERR_BELOW_MINIMUM_BILLABLE_DAYS)
        distinguishing_aspect: |
          Numeric threshold metric billable_days with inclusive lower bound: 10
          days submits (20040 cents), 9 days rejects ERR_BELOW_MINIMUM_BILLABLE_DAYS;
          the sibling instance is a zero-count/empty-collection edge on a different
          metric (transmission_count) through a different endpoint (report finalize).
        test_recipe:
          setup:
            - "Two patients each with an EVENT episode: A prescribed 10 days, B prescribed 9 days; both completed, generated, swept READY, INTERIM report finalized"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Ken Ten", date_of_birth: "1951-11-11", mrn: "MRN-1011", phone: "555-0111", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { pa_id: $.data.id } }
            - { call: "POST /v1/patients", payload: { full_name: "Kim Nine", date_of_birth: "1952-12-12", mrn: "MRN-1012", phone: "555-0112", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { pb_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Bound", npi: "1000000011", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1011", model: "EVENT" }, as: InventoryManager, captures: { da_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1012", model: "EVENT" }, as: InventoryManager, captures: { db_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${pa_id}", monitor_type: "EVENT", prescribed_days: 10 }, as: Physician, as_user_id: "${dr_id}", captures: { oa_id: $.data.id, oa_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${pb_id}", monitor_type: "EVENT", prescribed_days: 9 }, as: Physician, as_user_id: "${dr_id}", captures: { ob_id: $.data.id, ob_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${oa_id}/enrollments", payload: { device_id: "${da_id}", expected_order_version: "${oa_v}" }, as: EnrollmentCoordinator, captures: { ea_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders/${ob_id}/enrollments", payload: { device_id: "${db_id}", expected_order_version: "${ob_v}" }, as: EnrollmentCoordinator, captures: { eb_id: $.data.id } }
            - { call: "POST /v1/enrollments/${ea_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${eb_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${ea_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { epa_id: $.data.episode_id } }
            - { call: "POST /v1/enrollments/${eb_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { epb_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${epa_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${epb_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${epa_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { bpa_id: "$.data[0].id" } }
            - { call: "POST /v1/episodes/${epb_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { bpb_id: "$.data[0].id" } }
            - { call: "POST /v1/episodes/${epa_id}/reports", payload: { report_type: "INTERIM", findings_summary: "ok" }, as: Physician, as_user_id: "${dr_id}", captures: { ra_id: $.data.id } }
            - { call: "POST /v1/episodes/${epb_id}/reports", payload: { report_type: "INTERIM", findings_summary: "ok" }, as: Physician, as_user_id: "${dr_id}", captures: { rb_id: $.data.id } }
            - { call: "POST /v1/reports/${ra_id}/finalize", payload: {}, as: Physician, as_user_id: "${dr_id}" }
            - { call: "POST /v1/reports/${rb_id}/finalize", payload: {}, as: Physician, as_user_id: "${dr_id}" }
