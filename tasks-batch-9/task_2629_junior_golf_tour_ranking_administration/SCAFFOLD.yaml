# SCAFFOLD.yaml — §1.0–§1.7
# Task 2629: Junior Golf Tour & Ranking Administration (junior golf association)

scenario: |
  Generate task harder than expert level!

  2629. Junior Golf Tour & Ranking Administration (junior golf association): membership registration with age divisions, handicap requirements and eligibility verification, tournament schedule with entry windows, field size limits and exemption categories, entry acceptance by ranking and priority with waitlist movement and withdrawal deadlines, pace of play, rules officiating and scoring with peer verification and disqualification handling, ranking algorithm with event strength, field quality and scoring differential weighting, college recruiting exposure with results publication and coach access, financial assistance and scholarship programs for participation, parent and caddie conduct policies with sanctions

domain_name: junior-golf-tour-ranking-administration
api_prefix: "/"
# Flat topology: every entity is a peer collection at the API root (`/members`, `/tournaments`,
# `/entries`, ...). No entity is nested inside another's URL path; all relationships are carried
# by foreign-key fields in request bodies and are discovered through filtered list endpoints.

complexity_profile:
  difficulty_level: expert_plus   # above the §0.4 Expert band: 10 entities / 53 endpoints / 44 errors / 13 calculations / 10 state machines / 74 transitions / 44 validations
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - selector_policy

  entity_topology: flat
  state_machine_shape: parallel
  secondary_state_machine_shapes: [cyclic, branching, compound]
  # Entry carries two independent state dimensions (entry_status x fee_status) on one row.
  # Round cycles SUBMITTED -> DISPUTED -> SUBMITTED. RulesCase cycles UPHELD -> APPEAL_OPEN ->
  # UNDER_REVIEW -> UPHELD. ConductCase cycles SANCTIONED -> APPEAL_OPEN -> SANCTIONED.
  # Tournament auto-completes as a compound function of its accepted entries' terminal states.

  relationship_patterns:
    - one_to_many          # Season -> Member, Season -> Tournament, Entry -> Round
    - many_to_many         # ExemptionGrant (Member x Tournament), CoachAccessGrant (coach_user_id x Member)
    - self_referential     # Tournament.qualifies_into_tournament_id -> Tournament.id (qualifier chain)
    - cross_aggregate      # Round -> Tournament (denormalized), ConductCase -> Member + Tournament

  role_model: segregation_of_duties
  # The RulesOfficial who reports a rules case may never adjudicate it; the user who files a
  # conduct case may never decide it. Both are enforced on X-User-ID, not on role alone.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Season
    parent: null
    common_fields: true
    # Configuration + ledger root. Holds the age-division cutoff, the ranking window, the
    # three-bucket financial-assistance ledger and the ranking-run epoch counter.
    fields:
      - name: name
        type: string
        source: input
        description: "human label of the competitive season"
        constraints: "1..120 chars"
      - name: start_date
        type: string
        source: input
        description: "first calendar date (YYYY-MM-DD) of the season"
      - name: end_date
        type: string
        source: input
        description: "last calendar date (YYYY-MM-DD) of the season; must be > start_date"
      - name: age_cutoff_date
        type: string
        source: input
        description: "YYYY-MM-DD reference date on which every Member's competitive age is measured"
      - name: ranking_window_start_date
        type: string
        source: input
        description: "YYYY-MM-DD; only Tournaments whose start_date >= this value feed the ranking"
      - name: assistance_budget_cents
        type: integer
        source: input
        description: "total financial-assistance budget for the season, in cents"
        constraints: ">= 0; immutable after creation"
      - name: assistance_available_cents
        type: integer
        source: computed
        description: "unreserved assistance money; see calculations.season_assistance_ledger"
        default: "= assistance_budget_cents at creation"
      - name: assistance_committed_cents
        type: integer
        source: computed
        description: "assistance reserved against non-terminal Entries; see calculations.season_assistance_ledger"
        default: 0
      - name: assistance_disbursed_cents
        type: integer
        source: computed
        description: "assistance spent irreversibly (FINISHED or FORFEITED entries)"
        default: 0
      - name: ranking_epoch
        type: integer
        source: computed
        description: "count of certified ranking runs executed against this Season"
        default: 0
      - name: last_ranking_run_at
        type: datetime
        source: computed
        description: "logical-clock instant of the most recent ranking run; null before the first run"
        default: null
      - name: last_ranking_as_of_date
        type: string
        source: computed
        description: "as_of_date submitted with the most recent ranking run; null before the first run"
        default: null
      - name: ranked_member_count
        type: integer
        source: computed
        description: "members that received a non-null certified_rank_position in the last ranking run"
        default: 0

  - name: Member
    parent: null
    common_fields: true
    # The junior golfer. Carries the eligibility gate, the handicap gate, the conduct ledger and
    # BOTH ranking variants (provisional, recomputed on every event-points change; certified,
    # written only by a ranking run).
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this membership belongs to"
      - name: full_name
        type: string
        source: input
        description: "junior golfer's full name"
        constraints: "1..120 chars"
      - name: birth_date
        type: string
        source: input
        description: "YYYY-MM-DD date of birth; drives age_at_cutoff and age_division"
      - name: state_code
        type: string
        source: input
        description: "two-letter residency code"
        constraints: "exactly 2 uppercase letters"
      - name: guardian_email
        type: string
        source: input
        description: "parent/guardian contact used for conduct notices"
      - name: handicap_index
        type: number
        source: input
        description: "current handicap index, 1 decimal place"
        constraints: "-5.0 .. 54.0"
      - name: handicap_effective_date
        type: string
        source: input
        description: "YYYY-MM-DD revision date of handicap_index; freshness gate at entry time"
      - name: handicap_source
        type: enum
        source: input
        description: "provenance of handicap_index"
        constraints: "WHS_CLUB | STATE_ASSOC | SELF_ATTESTED"
      - name: publication_opt_in
        type: boolean
        source: input
        description: "guardian consent to publish results to college coaches"
        default: false
      - name: eligibility_status
        type: enum
        source: computed
        description: "membership eligibility gate; see state_machines.Member"
        default: PENDING_VERIFICATION
        constraints: "PENDING_VERIFICATION | VERIFIED | REJECTED | SUSPENDED"
      - name: age_at_cutoff
        type: integer
        source: computed
        description: "full years from birth_date to Season.age_cutoff_date; see calculations.member_age_division"
      - name: age_division
        type: enum
        source: computed
        description: "competitive division derived from age_at_cutoff; null when age is out of range"
        constraints: "U13 | U15 | U17 | U19 | null"
      - name: conduct_points
        type: integer
        source: computed
        description: "decayed cumulative conduct points; see calculations.conduct_sanction_tier"
        default: 0
      - name: late_withdrawal_count
        type: integer
        source: computed
        description: "count of entries forfeited by withdrawing after Tournament.withdrawal_deadline_at"
        default: 0
      - name: provisional_ranking_points
        type: number
        source: computed
        description: "live ranking average, recomputed on every Entry.event_points write; 2 decimals"
        default: 0.00
      - name: provisional_counted_events
        type: integer
        source: computed
        description: "number of entries feeding provisional_ranking_points"
        default: 0
      - name: certified_ranking_points
        type: number
        source: computed
        description: "best-N ranking average, written only by a ranking run; 2 decimals"
        default: 0.00
      - name: certified_counted_events
        type: integer
        source: computed
        description: "number of entries that entered the last certified ranking run's best-N set"
        default: 0
      - name: certified_rank_position
        type: integer
        source: computed
        description: "1-based position from the last ranking run; null when certified_counted_events == 0"
        default: null
      - name: last_ranking_epoch
        type: integer
        source: computed
        description: "Season.ranking_epoch value at which this member's certified fields were written"
        default: 0

  - name: Tournament
    parent: null
    common_fields: true
    # The competed-for resource. field_size_limit is the finite pool; the entry window, the
    # withdrawal deadline and the qualifier chain (self-FK) are all declared here.
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; owning season"
      - name: name
        type: string
        source: input
        description: "event name"
        constraints: "1..120 chars"
      - name: division
        type: enum
        source: input
        description: "age division this event is played in; must equal Member.age_division to enter"
        constraints: "U13 | U15 | U17 | U19"
      - name: tier
        type: enum
        source: input
        description: "event strength band; selects TIER_BASE_POINTS in calculations.entry_event_points"
        constraints: "LOCAL | REGIONAL | NATIONAL | INVITATIONAL"
      - name: start_date
        type: string
        source: input
        description: "YYYY-MM-DD first day of play"
      - name: end_date
        type: string
        source: input
        description: "YYYY-MM-DD last day of play; must be >= start_date"
      - name: entry_open_at
        type: datetime
        source: input
        description: "ISO-8601 UTC instant the entry window opens"
      - name: entry_close_at
        type: datetime
        source: input
        description: "ISO-8601 UTC instant the entry window closes; must be > entry_open_at"
      - name: withdrawal_deadline_at
        type: datetime
        source: input
        description: "ISO-8601 UTC instant after which a withdrawal becomes a forfeiture"
      - name: field_size_limit
        type: integer
        source: input
        description: "maximum number of entries that may hold a playing slot"
        constraints: ">= 1"
      - name: max_handicap_index
        type: number
        source: input
        description: "inclusive handicap ceiling; Member.handicap_index <= this value to enter"
      - name: entry_fee_cents
        type: integer
        source: input
        description: "gross entry fee in cents"
        constraints: ">= 0"
      - name: round_count
        type: integer
        source: input
        description: "number of stroke-play rounds in the event"
        constraints: "1..4"
      - name: course_rating
        type: number
        source: input
        description: "course rating used by calculations.round_scoring_differential; 1 decimal"
      - name: slope_rating
        type: integer
        source: input
        description: "slope rating used by calculations.round_scoring_differential"
        constraints: "55..155"
      - name: tee_group_size
        type: integer
        source: input
        description: "aggregate capacity of one tee slot; see validations priority 71"
        default: 3
        constraints: "1..4"
      - name: tee_interval_minutes
        type: integer
        source: input
        description: "width in minutes of the half-open tee-slot interval [t, t+interval)"
        default: 10
        constraints: "1..30"
      - name: qualifies_into_tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id; on completion the winner is minted a QUALIFIER_WINNER ExemptionGrant into this event; null when the event feeds nothing"
        default: null
      - name: status
        type: enum
        source: computed
        description: "lifecycle state; see state_machines.Tournament"
        default: SCHEDULED
        constraints: "SCHEDULED | ENTRY_OPEN | ENTRY_CLOSED | FIELD_SET | IN_PROGRESS | COMPLETED | CANCELLED"
      - name: entry_count
        type: integer
        source: computed
        description: "total Entry rows referencing this tournament, any entry_status"
        default: 0
      - name: applied_count
        type: integer
        source: computed
        description: "count of Entry with entry_status == APPLIED"
        default: 0
      - name: accepted_count
        type: integer
        source: computed
        description: "count of Entry with entry_status IN {ACCEPTED, COMPETING, FINISHED, DISQUALIFIED}"
        default: 0
      - name: waitlist_count
        type: integer
        source: computed
        description: "count of Entry with entry_status == WAITLISTED"
        default: 0
      - name: closed_count
        type: integer
        source: computed
        description: "count of Entry with entry_status IN {WITHDRAWN, FORFEITED, REJECTED, CANCELLED}"
        default: 0
      - name: open_slot_count
        type: integer
        source: computed
        description: "field_size_limit - accepted_count; never negative"
        default: "= field_size_limit"
      - name: finished_count
        type: integer
        source: computed
        description: "count of Entry with entry_status == FINISHED"
        default: 0
      - name: field_quality_factor
        type: number
        source: computed
        description: "field-strength multiplier; see calculations.tournament_field_quality_factor; 2 decimals"
        default: 1.00
      - name: winner_entry_id
        type: string
        source: computed
        description: "FK -> Entry.id; entry ranked finish_position 1 at auto-completion; null until COMPLETED"
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: "logical-clock instant of the automatic IN_PROGRESS -> COMPLETED transition"
        default: null
      - name: cancellation_reason
        type: string
        source: input
        description: "free-text reason recorded by the cancel action; null otherwise"
        default: null

  - name: ExemptionGrant
    parent: null
    common_fields: true
    # Many-to-many association (Member x Tournament) that lifts a member above the ranking-based
    # entry queue. CONSUMED on acceptance, restored to ACTIVE by compensating actions.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the exempt golfer"
      - name: tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id; the event the exemption grants priority into"
      - name: source_tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id; the event that produced the exemption; null for SPONSOR_INVITE"
        default: null
      - name: category
        type: enum
        source: input
        description: "exemption category"
        constraints: "DEFENDING_CHAMPION | QUALIFIER_WINNER | NATIONAL_TEAM | SPONSOR_INVITE"
      - name: expires_at
        type: datetime
        source: input
        description: "ISO-8601 UTC instant after which the grant no longer confers priority"
      - name: status
        type: enum
        source: computed
        description: "grant lifecycle; see state_machines.ExemptionGrant"
        default: ACTIVE
        constraints: "ACTIVE | CONSUMED | EXPIRED | REVOKED"
      - name: consumed_by_entry_id
        type: string
        source: computed
        description: "FK -> Entry.id; the entry that consumed this grant; null while ACTIVE"
        default: null

  - name: Entry
    parent: null
    common_fields: true
    # PARALLEL STATE DIMENSIONS: entry_status (competitive lifecycle) and fee_status (money
    # lifecycle) advance on the same row through disjoint trigger sets.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the entrant"
      - name: tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id; the event entered"
      - name: exemption_grant_id
        type: string
        source: input
        description: "FK -> ExemptionGrant.id; grant invoked at submission; null for open entries"
        default: null
      - name: aid_application_id
        type: string
        source: input
        description: "FK -> AidApplication.id; resolved server-side when request_assistance is true; null otherwise"
        default: null
      - name: request_assistance
        type: boolean
        source: input
        description: "when true the server settles a financial-assistance award at submission time"
        default: false
      - name: entry_status
        type: enum
        source: computed
        description: "competitive dimension; see state_machines.Entry (dimension 1)"
        default: APPLIED
        constraints: "APPLIED | ACCEPTED | WAITLISTED | REJECTED | COMPETING | FINISHED | WITHDRAWN | FORFEITED | DISQUALIFIED | CANCELLED"
      - name: fee_status
        type: enum
        source: computed
        description: "money dimension; see state_machines.Entry (dimension 2)"
        default: UNPAID
        constraints: "UNPAID | AID_PARTIAL | AID_COVERED | PAID | REFUNDED | FORFEITED_FEE"
      - name: priority_band
        type: integer
        source: computed
        description: "0 EXEMPT, 1 RANKED, 2 OPEN; frozen at submission; see calculations.entry_priority_key"
      - name: rank_at_entry
        type: integer
        source: computed
        description: "snapshot of Member.certified_rank_position at submission; null when unranked"
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "logical-clock instant of submission; primary tie-break inside a priority band"
      - name: waitlist_position
        type: integer
        source: computed
        description: "1-based waitlist rank; null unless entry_status == WAITLISTED"
        default: null
      - name: rejection_reason
        type: enum
        source: computed
        description: "why the entry was rejected at field-set or by a suspension cascade"
        default: null
        constraints: "MEMBER_NOT_VERIFIED | MEMBER_SUSPENDED | null"
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "snapshot of Tournament.entry_fee_cents at submission"
      - name: late_entry_surcharge_cents
        type: integer
        source: computed
        description: "surcharge for entering inside the late window; see calculations.entry_fee_settlement"
        default: 0
      - name: aid_award_cents
        type: integer
        source: computed
        description: "assistance settled onto this entry; see calculations.assistance_award_amount variant event_settlement"
        default: 0
      - name: net_fee_due_cents
        type: integer
        source: computed
        description: "amount the family still owes; see calculations.entry_fee_settlement"
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "cash received against this entry"
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "cash returned on a pre-deadline withdrawal or a tournament cancellation"
        default: 0
      - name: certified_round_count
        type: integer
        source: computed
        description: "count of this entry's Rounds with status == CERTIFIED"
        default: 0
      - name: total_adjusted_strokes
        type: integer
        source: computed
        description: "sum of adjusted_gross over CERTIFIED rounds; ranking sort key"
        default: 0
      - name: avg_scoring_differential
        type: number
        source: computed
        description: "mean of CERTIFIED rounds' scoring_differential, 1 decimal; null with zero certified rounds"
        default: null
      - name: finish_position
        type: integer
        source: computed
        description: "1-based finish rank assigned at tournament auto-completion; null otherwise"
        default: null
      - name: event_points
        type: number
        source: computed
        description: "ranking points earned by this entry; see calculations.entry_event_points; 2 decimals"
        default: null
      - name: withdrawn_at
        type: datetime
        source: computed
        description: "logical-clock instant of withdrawal or forfeiture; null otherwise"
        default: null

  - name: Round
    parent: null
    common_fields: true
    # CYCLIC state machine: SUBMITTED -> DISPUTED -> SUBMITTED, capped by dispute_count.
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; the entry whose card this is"
      - name: tournament_id
        type: string
        source: computed
        description: "FK -> Tournament.id; denormalized from the parent Entry at creation, never client-supplied"
      - name: marker_member_id
        type: string
        source: input
        description: "FK -> Member.id; peer marker who must verify the card"
      - name: round_number
        type: integer
        source: input
        description: "1-based round ordinal; must be <= Tournament.round_count"
      - name: tee_time
        type: datetime
        source: input
        description: "ISO-8601 UTC start instant; anchors the half-open tee slot [tee_time, tee_time + tee_interval_minutes)"
      - name: gross_strokes
        type: integer
        source: input
        description: "strokes reported by the player at submission; null before submission"
        default: null
        constraints: "50..130"
      - name: pace_warning_count
        type: integer
        source: computed
        description: "count of WARNING pace observations recorded on this round"
        default: 0
      - name: max_minutes_behind
        type: integer
        source: computed
        description: "largest minutes_behind seen across this round's pace observations"
        default: 0
      - name: pace_penalty_strokes
        type: integer
        source: computed
        description: "see calculations.round_pace_penalty; recomputed on every pace observation"
        default: 0
      - name: rules_penalty_strokes
        type: integer
        source: computed
        description: "strokes added by upheld rules cases with disposition PENALTY_STROKES"
        default: 0
      - name: adjusted_gross
        type: integer
        source: computed
        description: "gross_strokes + pace_penalty_strokes + rules_penalty_strokes, frozen at certification"
        default: null
      - name: scoring_differential
        type: number
        source: computed
        description: "see calculations.round_scoring_differential; 1 decimal; frozen at certification"
        default: null
      - name: dispute_count
        type: integer
        source: computed
        description: "number of DISPUTE decisions the marker has returned on this round"
        default: 0
      - name: open_rules_case_count
        type: integer
        source: computed
        description: "count of RulesCase on this round with status IN {REPORTED, APPEAL_OPEN}"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "see state_machines.Round"
        default: SCHEDULED
        constraints: "SCHEDULED | SUBMITTED | DISPUTED | PEER_VERIFIED | CERTIFIED | NO_CARD | DISQUALIFIED"
      - name: certified_at
        type: datetime
        source: computed
        description: "logical-clock instant of certification; anchors the 48h rules-reopen window"
        default: null
      - name: certified_by_user_id
        type: string
        source: computed
        description: "opaque X-User-ID of the RulesOfficial who certified the card"
        default: null

  - name: RulesCase
    parent: null
    common_fields: true
    # BRANCHING + CYCLIC: REPORTED -> {UPHELD, DISMISSED}; UPHELD -> APPEAL_OPEN -> {UPHELD,
    # DISMISSED}. Segregation of duties: adjudicated_by_user_id != reported_by_user_id.
    fields:
      - name: round_id
        type: string
        source: input
        description: "FK -> Round.id; the card under review"
      - name: rule_reference
        type: string
        source: input
        description: "Rules of Golf citation, e.g. 'Rule 4.1b(1)'"
        constraints: "1..40 chars"
      - name: proposed_disposition
        type: enum
        source: input
        description: "what the reporting official asks for"
        constraints: "PENALTY_STROKES | DISQUALIFICATION"
      - name: penalty_strokes_proposed
        type: integer
        source: input
        description: "strokes requested; required when proposed_disposition == PENALTY_STROKES, must be omitted or 0 for DISQUALIFICATION"
        default: 0
        constraints: "0..8"
      - name: reported_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the reporting RulesOfficial; the SoD comparand"
      - name: adjudicated_by_user_id
        type: string
        source: computed
        description: "opaque X-User-ID of the ChiefReferee who last adjudicated; null before adjudication"
        default: null
      - name: status
        type: enum
        source: computed
        description: "see state_machines.RulesCase"
        default: REPORTED
        constraints: "REPORTED | UPHELD | DISMISSED | APPEAL_OPEN"
      - name: decision
        type: enum
        source: computed
        description: "last adjudication verdict"
        default: null
        constraints: "UPHELD | DISMISSED | null"
      - name: disposition
        type: enum
        source: computed
        description: "effect applied when decision == UPHELD"
        default: null
        constraints: "PENALTY_STROKES | DISQUALIFICATION | null"
      - name: penalty_strokes_applied
        type: integer
        source: computed
        description: "strokes actually added to Round.rules_penalty_strokes by this case"
        default: 0
      - name: appeal_count
        type: integer
        source: computed
        description: "number of times the member has appealed this case"
        default: 0
      - name: decided_at
        type: datetime
        source: computed
        description: "logical-clock instant of the last adjudication; anchors the appeal window"
        default: null

  - name: ConductCase
    parent: null
    common_fields: true
    # Parent/caddie conduct. BRANCHING with divergent cascade sets per sanction tier, plus the
    # SANCTIONED -> APPEAL_OPEN -> SANCTIONED cycle. SoD: decided_by_user_id != filed_by_user_id.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the junior whose entourage is implicated"
      - name: tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id; the event at which the incident occurred"
      - name: subject_type
        type: enum
        source: input
        description: "who behaved badly"
        constraints: "PARENT | CADDIE"
      - name: subject_name
        type: string
        source: input
        description: "name of the parent or caddie"
        constraints: "1..120 chars"
      - name: incident_code
        type: enum
        source: input
        description: "incident classification; selects CONDUCT_POINTS_BY_CODE"
        constraints: "SPECTATOR_INTERFERENCE | COACHING_VIOLATION | ABUSIVE_LANGUAGE | CADDIE_ADVICE_BREACH | PHYSICAL_ALTERCATION | SCORE_TAMPERING"
      - name: narrative
        type: string
        source: input
        description: "free-text account of the incident"
        default: null
      - name: filed_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the filer; the SoD comparand"
      - name: decided_by_user_id
        type: string
        source: computed
        description: "opaque X-User-ID of the ConductCommittee member who last decided; null before decision"
        default: null
      - name: status
        type: enum
        source: computed
        description: "see state_machines.ConductCase"
        default: UNDER_REVIEW
        constraints: "UNDER_REVIEW | SANCTIONED | CLEARED | APPEAL_OPEN"
      - name: points_assessed
        type: integer
        source: computed
        description: "CONDUCT_POINTS_BY_CODE value charged when SANCTIONED; 0 when CLEARED"
        default: 0
      - name: cumulative_points_at_decision
        type: integer
        source: computed
        description: "decayed cumulative total including this case; selects sanction_tier"
        default: 0
      - name: sanction_tier
        type: enum
        source: computed
        description: "see calculations.conduct_sanction_tier"
        default: null
        constraints: "WARNING | VENUE_BAN_ONE_EVENT | MEMBER_SUSPENSION | null"
      - name: appeal_count
        type: integer
        source: computed
        description: "number of appeals filed against this case"
        default: 0
      - name: decided_at
        type: datetime
        source: computed
        description: "logical-clock instant of the last decision; anchors the 14-day appeal window and the 365-day decay window"
        default: null

  - name: AidApplication
    parent: null
    common_fields: true
    # Financial assistance. Create-with-supersede against Member (OCC parent). Carries the
    # ESTIMATE variant of the award; the SETTLEMENT variant lands on Entry.aid_award_cents.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the applicant"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season whose budget is drawn on"
      - name: household_income_cents
        type: integer
        source: input
        description: "annual household income in cents"
        constraints: ">= 0"
      - name: dependents
        type: integer
        source: input
        description: "number of dependents in the household"
        constraints: ">= 1"
      - name: income_per_dependent_cents
        type: integer
        source: computed
        description: "floor(household_income_cents / dependents); AID_TIERS lookup key"
      - name: covered_pct
        type: number
        source: computed
        description: "share of a fee the association covers; see calculations.assistance_award_amount"
        default: null
      - name: estimated_award_cents
        type: integer
        source: computed
        description: "ESTIMATE variant output, computed at approval against AID_STANDARD_FEE_CENTS"
        default: null
      - name: per_member_cap_cents
        type: integer
        source: system
        description: "AID_PER_MEMBER_SEASON_CAP_CENTS snapshot at creation"
        default: 60000
      - name: consumed_cents
        type: integer
        source: computed
        description: "sum of aid_award_cents currently settled onto this application's entries"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "see state_machines.AidApplication"
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | DENIED | SUPERSEDED"
      - name: decided_by_user_id
        type: string
        source: computed
        description: "opaque X-User-ID of the TourAdmin who decided"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "logical-clock instant of the approval/denial"
        default: null

  - name: CoachAccessGrant
    parent: null
    common_fields: true
    # College-recruiting exposure. Create-with-supersede against Member (OCC parent). The coach
    # identity is an opaque operator id, never an entity id.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the recruited junior"
      - name: coach_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the requesting Coach; never equals any entity id"
      - name: coach_school
        type: string
        source: input
        description: "institution the coach recruits for"
        constraints: "1..120 chars"
      - name: scope
        type: enum
        source: input
        description: "breadth of the published payload the grant unlocks"
        constraints: "RESULTS_ONLY | FULL_PROFILE"
      - name: status
        type: enum
        source: computed
        description: "see state_machines.CoachAccessGrant"
        default: REQUESTED
        constraints: "REQUESTED | GRANTED | DENIED | REVOKED | SUPERSEDED"
      - name: requested_at
        type: datetime
        source: system
        description: "logical-clock instant of the request"
      - name: decided_at
        type: datetime
        source: computed
        description: "logical-clock instant of the member's decision"
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "decided_at + COACH_GRANT_TERM_DAYS (180 days); null until GRANTED"
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Member
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED]
    shape: cyclic          # VERIFIED <-> SUSPENDED
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /members/{memberId}/verify-eligibility with decision == VERIFIED"
        actor: TourAdmin
        preconditions:
          - "Member.age_division IS NOT NULL (age_at_cutoff in 11..19)"
          - "Member.handicap_effective_date is within HANDICAP_VALIDITY_DAYS (180) of the clock"
        side_effects:
          - "Member.eligibility_status = VERIFIED"
          - "Member.updated_at = clock; Member.version += 1"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /members/{memberId}/verify-eligibility with decision == REJECTED"
        actor: TourAdmin
        preconditions:
          - "a `note` recording the reason is present in the request body"
        side_effects:
          - "Member.eligibility_status = REJECTED"
          - "Member.updated_at = clock; Member.version += 1"
        note: "REJECTED is terminal: no endpoint transitions out of it."
      - from: VERIFIED
        to: SUSPENDED
        trigger: "system, inside POST /conduct-cases/{caseId}/decide when decision == SANCTIONED and calculations.conduct_sanction_tier yields MEMBER_SUSPENSION"
        actor: system
        preconditions:
          - "ConductCase.cumulative_points_at_decision >= CONDUCT_SUSPENSION_THRESHOLD (6)"
        side_effects:
          - "Member.eligibility_status = SUSPENDED"
          - "HOP 2 of the suspension cascade: every Entry of this member with entry_status IN {APPLIED, WAITLISTED} -> REJECTED with rejection_reason = MEMBER_SUSPENDED"
          - "HOP 2 of the suspension cascade: every Entry of this member with entry_status == ACCEPTED whose Tournament.status == FIELD_SET -> FORFEITED (see state_machines.Entry ACCEPTED_to_FORFEITED, which itself fires HOP 3 and HOP 4)"
          - "every ExemptionGrant of this member with status == ACTIVE -> REVOKED"
          - "Member.conduct_points = ConductCase.cumulative_points_at_decision"
          - "Member.updated_at = clock; Member.version += 1"
      - from: SUSPENDED
        to: VERIFIED
        trigger: "system, inside POST /conduct-cases/{caseId}/decide when a case in APPEAL_OPEN is decided CLEARED and the recomputed decayed total drops below CONDUCT_SUSPENSION_THRESHOLD"
        actor: system
        preconditions:
          - "recomputed decayed conduct total (excluding the cleared case) < CONDUCT_SUSPENSION_THRESHOLD (6)"
        side_effects:
          - "Member.eligibility_status = VERIFIED"
          - "Member.conduct_points = recomputed decayed total"
          - "Member.updated_at = clock; Member.version += 1"
        note: "Reinstatement restores eligibility only. Entries already REJECTED or FORFEITED by the suspension cascade are NOT restored - that asymmetry is deliberate and pinned."

  - entity: Tournament
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    shape: branching_with_compound_completion
    transitions:
      - from: SCHEDULED
        to: ENTRY_OPEN
        trigger: "POST /tournaments/{tournamentId}/open-entries"
        actor: TourAdmin
        preconditions:
          - "clock < Tournament.entry_close_at"
        side_effects:
          - "Tournament.status = ENTRY_OPEN"
          - "Tournament.version += 1"
      - from: ENTRY_OPEN
        to: ENTRY_CLOSED
        trigger: "POST /tournaments/{tournamentId}/close-entries"
        actor: TourAdmin
        preconditions:
          - "clock >= Tournament.entry_close_at"
        side_effects:
          - "Tournament.status = ENTRY_CLOSED"
          - "Tournament.version += 1"
      - from: ENTRY_CLOSED
        to: FIELD_SET
        trigger: "POST /tournaments/{tournamentId}/set-field  (ops-run checkpoint: the selector of calculations.entry_priority_key runs exactly once here)"
        actor: TourAdmin
        preconditions: []
        side_effects:
          - "every APPLIED Entry whose Member.eligibility_status != VERIFIED -> REJECTED with rejection_reason = MEMBER_NOT_VERIFIED (MEMBER_SUSPENDED when the member is SUSPENDED)"
          - "remaining APPLIED entries are ordered by calculations.entry_priority_key; the first field_size_limit -> ACCEPTED; the rest -> WAITLISTED with waitlist_position 1..k in the same order"
          - "each ACCEPTED entry that carries exemption_grant_id -> that ExemptionGrant.status = CONSUMED, consumed_by_entry_id = entry.id"
          - "Tournament.accepted_count / waitlist_count / closed_count / open_slot_count / applied_count recomputed"
          - "Tournament.field_quality_factor = calculations.tournament_field_quality_factor"
          - "Tournament.status = FIELD_SET; Tournament.version += 1"
        note: "Empty-candidate-set fallback is pinned: zero eligible applicants still yields FIELD_SET with accepted_count == 0 and field_quality_factor == 1.00, and no error."
      - from: FIELD_SET
        to: IN_PROGRESS
        trigger: "POST /tournaments/{tournamentId}/start"
        actor: TourAdmin
        preconditions:
          - "clock >= Tournament.start_date at 00:00:00Z"
          - "Tournament.accepted_count >= 1 (else ERR_EMPTY_FIELD)"
          - "every ACCEPTED Entry satisfies amount_paid_cents >= net_fee_due_cents (else ERR_ENTRY_FEE_OUTSTANDING)"
        side_effects:
          - "Tournament.status = IN_PROGRESS"
          - "waitlist promotion is disabled from this point on: a slot freed while IN_PROGRESS stays open"
          - "Tournament.version += 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system, evaluated at the end of every POST /rounds/{roundId}/certify and every rules-case disqualification: fires when every Entry with entry_status IN {ACCEPTED, COMPETING, FINISHED, DISQUALIFIED} has entry_status IN {FINISHED, DISQUALIFIED} (compound / bubble-up)"
        actor: system
        preconditions:
          - "Tournament.accepted_count >= 1"
          - "no Entry of this tournament has entry_status IN {ACCEPTED, COMPETING}"
        side_effects:
          - "finish_position assigned to every FINISHED entry per calculations.entry_finish_position"
          - "Entry.event_points = calculations.entry_event_points for every FINISHED entry; DISQUALIFIED entries get event_points = 0.00"
          - "Member.provisional_ranking_points / provisional_counted_events recomputed for every affected member (calculations.member_ranking_points variant provisional_live)"
          - "every FINISHED entry with aid_award_cents > 0: Season.assistance_committed_cents -= aid_award_cents, Season.assistance_disbursed_cents += aid_award_cents"
          - "Tournament.winner_entry_id = the entry with finish_position == 1 (null when no entry FINISHED)"
          - "when Tournament.qualifies_into_tournament_id IS NOT NULL and a winner exists: mint ExemptionGrant{member_id: winner.member_id, tournament_id: qualifies_into_tournament_id, source_tournament_id: this tournament, category: QUALIFIER_WINNER, expires_at: target tournament.entry_close_at, status: ACTIVE}"
          - "Tournament.status = COMPLETED; completed_at = clock; Tournament.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tournaments/{tournamentId}/cancel"
        actor: TourAdmin
        preconditions: []
        side_effects:
          - "Tournament.status = CANCELLED; cancellation_reason recorded; Tournament.version += 1"
      - from: ENTRY_OPEN
        to: CANCELLED
        trigger: "POST /tournaments/{tournamentId}/cancel"
        actor: TourAdmin
        preconditions: []
        side_effects:
          - "COMPENSATION cascade, applied in this order to every Entry with entry_status IN {APPLIED, WAITLISTED, ACCEPTED, COMPETING}: (1) entry_status = CANCELLED; (2) fee_status IN {PAID, AID_COVERED, AID_PARTIAL} -> REFUNDED with refunded_cents = amount_paid_cents and amount_paid_cents = 0; (3) aid_award_cents > 0 -> Season.assistance_available_cents += aid_award_cents, Season.assistance_committed_cents -= aid_award_cents, AidApplication.consumed_cents -= aid_award_cents, Entry.aid_award_cents = 0; (4) exemption_grant_id with grant status CONSUMED -> grant.status = ACTIVE, consumed_by_entry_id = null"
          - "Tournament counters recomputed; status = CANCELLED; cancellation_reason recorded; Tournament.version += 1"
      - from: ENTRY_CLOSED
        to: CANCELLED
        trigger: "POST /tournaments/{tournamentId}/cancel"
        actor: TourAdmin
        preconditions: []
        side_effects:
          - "identical COMPENSATION cascade to the ENTRY_OPEN -> CANCELLED transition"
          - "Tournament.status = CANCELLED; Tournament.version += 1"
      - from: FIELD_SET
        to: CANCELLED
        trigger: "POST /tournaments/{tournamentId}/cancel"
        actor: TourAdmin
        preconditions: []
        side_effects:
          - "identical COMPENSATION cascade to the ENTRY_OPEN -> CANCELLED transition"
          - "Tournament.status = CANCELLED; Tournament.version += 1"
        note: "IN_PROGRESS, COMPLETED and CANCELLED cannot be cancelled: ERR_INVALID_TOURNAMENT_STATE."

  - entity: Entry
    dimension: entry_status               # PARALLEL DIMENSION 1 of 2 on the same row
    initial_state: APPLIED
    terminal_states: [REJECTED, WITHDRAWN, FORFEITED, DISQUALIFIED, CANCELLED]
    shape: parallel
    transitions:
      - from: APPLIED
        to: ACCEPTED
        trigger: "POST /tournaments/{tournamentId}/set-field (selector places the entry inside field_size_limit)"
        actor: system
        preconditions:
          - "Member.eligibility_status == VERIFIED"
          - "position of this entry under calculations.entry_priority_key <= Tournament.field_size_limit"
        side_effects:
          - "Entry.entry_status = ACCEPTED; waitlist_position = null"
          - "Tournament.accepted_count += 1; open_slot_count -= 1"
          - "ExemptionGrant referenced by exemption_grant_id (if any) -> CONSUMED"
      - from: APPLIED
        to: WAITLISTED
        trigger: "POST /tournaments/{tournamentId}/set-field (selector places the entry beyond field_size_limit)"
        actor: system
        preconditions:
          - "Member.eligibility_status == VERIFIED"
          - "position of this entry under calculations.entry_priority_key > Tournament.field_size_limit"
        side_effects:
          - "Entry.entry_status = WAITLISTED; waitlist_position = 1-based offset past the cut in the same ordering"
          - "Tournament.waitlist_count += 1"
      - from: APPLIED
        to: REJECTED
        trigger: "POST /tournaments/{tournamentId}/set-field, or system inside the Member VERIFIED -> SUSPENDED cascade"
        actor: system
        preconditions:
          - "Member.eligibility_status != VERIFIED"
        side_effects:
          - "Entry.entry_status = REJECTED; rejection_reason = MEMBER_SUSPENDED when the member is SUSPENDED, otherwise MEMBER_NOT_VERIFIED"
          - "Tournament.closed_count += 1"
      - from: WAITLISTED
        to: REJECTED
        trigger: "system, inside the Member VERIFIED -> SUSPENDED cascade"
        actor: system
        preconditions:
          - "Member.eligibility_status == SUSPENDED"
        side_effects:
          - "Entry.entry_status = REJECTED; rejection_reason = MEMBER_SUSPENDED"
          - "Tournament.waitlist_count -= 1; closed_count += 1; remaining waitlist positions renumbered to 1..k preserving order"
      - from: WAITLISTED
        to: ACCEPTED
        trigger: "system, waitlist promotion inside POST /entries/{entryId}/withdraw (both the WITHDRAWN and the FORFEITED branch) and inside the Member suspension cascade"
        actor: system
        preconditions:
          - "Tournament.status == FIELD_SET"
          - "Tournament.open_slot_count >= 1 after the vacating entry left the field"
          - "this entry has the lowest waitlist_position among WAITLISTED entries of the tournament"
          - "Member.eligibility_status == VERIFIED"
        side_effects:
          - "Entry.entry_status = ACCEPTED; waitlist_position = null; remaining waitlist positions renumbered to 1..k-1 preserving order"
          - "Tournament.accepted_count += 1; open_slot_count -= 1; waitlist_count -= 1"
          - "ExemptionGrant referenced by exemption_grant_id (if any) -> CONSUMED"
          - "the fee dimension is NOT touched and no money moves: the assistance award was already reserved at POST /entries while the entry was APPLIED, and Season.assistance_committed_cents already carries it (see calculations.season_assistance_ledger invariant L2, whose bucket spans APPLIED, ACCEPTED, WAITLISTED and COMPETING)"
          - "Tournament.field_quality_factor recomputed"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /entries/{entryId}/withdraw"
        actor: Member | TourAdmin
        preconditions:
          - "Tournament.status IN {ENTRY_CLOSED, FIELD_SET}"
        side_effects:
          - "Entry.entry_status = WITHDRAWN; withdrawn_at = clock; waitlist_position = null; remaining waitlist positions renumbered"
          - "fee and aid compensation identical to the ACCEPTED -> WITHDRAWN branch"
          - "Tournament.waitlist_count -= 1; closed_count += 1"
          - "no promotion fires: a waitlisted departure does not free a playing slot"
      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /entries/{entryId}/withdraw"
        actor: Member | TourAdmin
        preconditions:
          - "Tournament.status IN {ENTRY_OPEN, ENTRY_CLOSED}"
        side_effects:
          - "Entry.entry_status = WITHDRAWN; withdrawn_at = clock"
          - "fee and aid compensation identical to the ACCEPTED -> WITHDRAWN branch"
          - "Tournament.applied_count -= 1; closed_count += 1"
        note: "Withdrawing before the field is set is never a forfeiture, whatever the clock says."
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /entries/{entryId}/withdraw while clock <= Tournament.withdrawal_deadline_at"
        actor: Member | TourAdmin
        preconditions:
          - "Tournament.status IN {FIELD_SET}"
          - "clock <= Tournament.withdrawal_deadline_at"
        side_effects:
          - "HOP 1: Entry.entry_status = WITHDRAWN; withdrawn_at = clock"
          - "HOP 1: fee_status IN {PAID, AID_COVERED, AID_PARTIAL} -> REFUNDED with refunded_cents = amount_paid_cents, amount_paid_cents = 0, net_fee_due_cents = 0"
          - "HOP 2: when aid_award_cents > 0 -> Season.assistance_available_cents += aid_award_cents, Season.assistance_committed_cents -= aid_award_cents, AidApplication.consumed_cents -= aid_award_cents, Entry.aid_award_cents = 0"
          - "HOP 2: when exemption_grant_id references a CONSUMED grant -> grant.status = ACTIVE, consumed_by_entry_id = null"
          - "HOP 2: Tournament.accepted_count -= 1; open_slot_count += 1; closed_count += 1"
          - "HOP 3: because open_slot_count became >= 1 while status == FIELD_SET, the lowest-waitlist_position entry is promoted (see WAITLISTED -> ACCEPTED), which itself performs HOP 4 - renumbering the surviving waitlist positions and restoring accepted_count / open_slot_count to their pre-withdrawal values"
          - "Tournament.field_quality_factor recomputed"
      - from: ACCEPTED
        to: FORFEITED
        trigger: "POST /entries/{entryId}/withdraw while clock > Tournament.withdrawal_deadline_at, or system inside the Member VERIFIED -> SUSPENDED cascade, or system inside the ConductCase VENUE_BAN_ONE_EVENT branch for the entry on ConductCase.tournament_id"
        actor: Member | TourAdmin | system
        preconditions:
          - "Tournament.status IN {FIELD_SET}"
          - "clock > Tournament.withdrawal_deadline_at, OR the transition is driven by the suspension cascade or the VENUE_BAN_ONE_EVENT branch (deadline irrelevant)"
        side_effects:
          - "Entry.entry_status = FORFEITED; withdrawn_at = clock"
          - "fee_status IN {PAID, AID_COVERED, AID_PARTIAL} -> FORFEITED_FEE; refunded_cents stays 0; net_fee_due_cents = 0"
          - "when aid_award_cents > 0 -> Season.assistance_committed_cents -= aid_award_cents, Season.assistance_disbursed_cents += aid_award_cents (irreversible; AidApplication.consumed_cents is NOT released)"
          - "exemption grant stays CONSUMED - forfeiture never restores an exemption"
          - "Member.late_withdrawal_count += 1 (only on the member-initiated branch; neither the suspension cascade nor the VENUE_BAN_ONE_EVENT branch charges a late withdrawal)"
          - "Tournament.accepted_count -= 1; open_slot_count += 1; closed_count += 1; then waitlist promotion fires exactly as in the WITHDRAWN branch"
      - from: ACCEPTED
        to: COMPETING
        trigger: "POST /rounds/{roundId}/submit-score (first certified-eligible submission of the entry)"
        actor: Member
        preconditions:
          - "Tournament.status == IN_PROGRESS"
          - "Entry.fee_status IN {PAID, AID_COVERED}"
        side_effects:
          - "Entry.entry_status = COMPETING"
      - from: COMPETING
        to: FINISHED
        trigger: "system, at the end of POST /rounds/{roundId}/certify when Entry.certified_round_count == Tournament.round_count"
        actor: system
        preconditions:
          - "Entry.certified_round_count == Tournament.round_count"
        side_effects:
          - "Entry.entry_status = FINISHED"
          - "Tournament.finished_count += 1"
          - "the Tournament IN_PROGRESS -> COMPLETED compound check is evaluated immediately afterwards"
      - from: COMPETING
        to: DISQUALIFIED
        trigger: "system, inside POST /rules-cases/{caseId}/adjudicate when decision == UPHELD and disposition == DISQUALIFICATION"
        actor: system
        preconditions:
          - "the disqualified Round belongs to this entry"
        side_effects:
          - "Entry.entry_status = DISQUALIFIED; event_points = 0.00"
          - "Member.provisional_ranking_points / provisional_counted_events recomputed"
      - from: FINISHED
        to: DISQUALIFIED
        trigger: "system, inside POST /rules-cases/{caseId}/adjudicate on a retroactive case opened within RULES_REOPEN_WINDOW_HOURS of certification"
        actor: system
        preconditions:
          - "the disqualified Round belongs to this entry"
        side_effects:
          - "HOP 2: Entry.entry_status = DISQUALIFIED; Entry.event_points = 0.00; Entry.finish_position = null"
          - "HOP 3: Tournament.finished_count -= 1; Tournament.dq handling leaves accepted_count unchanged (a DISQUALIFIED entry still occupies its slot)"
          - "HOP 3: Member.provisional_ranking_points / provisional_counted_events recomputed from the member's remaining non-zero event_points"
        note: "Certified ranking fields on Member are NOT touched here; they only change at the next ranking run - that lag is the derived-field reconciliation trap."
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /tournaments/{tournamentId}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "Entry.entry_status = CANCELLED plus the tournament-cancellation compensation cascade"
      - from: COMPETING
        to: CANCELLED
        trigger: "POST /tournaments/{tournamentId}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "Entry.entry_status = CANCELLED plus the tournament-cancellation compensation cascade"
        note: "Only reachable from FIELD_SET cancellation is ACCEPTED; COMPETING entries exist only while IN_PROGRESS, which is not cancellable - this row exists solely to document that the pair is unreachable by design."
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /tournaments/{tournamentId}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "Entry.entry_status = CANCELLED plus the tournament-cancellation compensation cascade"
      - from: APPLIED
        to: CANCELLED
        trigger: "POST /tournaments/{tournamentId}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "Entry.entry_status = CANCELLED plus the tournament-cancellation compensation cascade"

  - entity: Entry
    dimension: fee_status                 # PARALLEL DIMENSION 2 of 2 on the same row
    initial_state: UNPAID
    terminal_states: [REFUNDED, FORFEITED_FEE]
    shape: parallel
    transitions:
      - from: UNPAID
        to: AID_COVERED
        trigger: "POST /entries with request_assistance == true (the sole point at which an assistance award is reserved)"
        actor: Member | system
        preconditions:
          - "an AidApplication for (member_id, season_id) has status == APPROVED"
          - "calculations.entry_fee_settlement yields net_fee_due_cents == 0"
        side_effects:
          - "Entry.aid_award_cents / net_fee_due_cents written; fee_status = AID_COVERED"
          - "Season.assistance_available_cents -= aid_award_cents; Season.assistance_committed_cents += aid_award_cents; AidApplication.consumed_cents += aid_award_cents"
      - from: UNPAID
        to: AID_PARTIAL
        trigger: "POST /entries with request_assistance == true (the sole point at which an assistance award is reserved)"
        actor: Member | system
        preconditions:
          - "an AidApplication for (member_id, season_id) has status == APPROVED"
          - "calculations.entry_fee_settlement yields net_fee_due_cents > 0"
        side_effects:
          - "identical ledger movement to UNPAID -> AID_COVERED; fee_status = AID_PARTIAL and the family still owes net_fee_due_cents"
      - from: UNPAID
        to: PAID
        trigger: "POST /entries/{entryId}/pay"
        actor: Member
        preconditions:
          - "amount_cents == Entry.net_fee_due_cents - Entry.amount_paid_cents (the exact outstanding remainder)"
          - "Entry.entry_status NOT IN {REJECTED, WITHDRAWN, FORFEITED, DISQUALIFIED, CANCELLED}"
        side_effects:
          - "Entry.amount_paid_cents += amount_cents; fee_status = PAID; net_fee_due_cents is left at the settled charge for audit"
      - from: AID_PARTIAL
        to: PAID
        trigger: "POST /entries/{entryId}/pay"
        actor: Member
        preconditions:
          - "amount_cents == Entry.net_fee_due_cents - Entry.amount_paid_cents (the exact outstanding remainder)"
        side_effects:
          - "Entry.amount_paid_cents += amount_cents; fee_status = PAID; net_fee_due_cents is left at the settled charge for audit"
        note: "The aid award already committed against the Season stays committed; only the family's remainder moves."
      - from: PAID
        to: REFUNDED
        trigger: "system, inside the ACCEPTED/APPLIED/WAITLISTED -> WITHDRAWN branch or a tournament cancellation"
        actor: system
        preconditions:
          - "the entry_status dimension moved to WITHDRAWN or CANCELLED"
        side_effects:
          - "Entry.refunded_cents = amount_paid_cents; amount_paid_cents = 0; fee_status = REFUNDED"
      - from: AID_COVERED
        to: REFUNDED
        trigger: "system, inside the WITHDRAWN or CANCELLED branch"
        actor: system
        preconditions:
          - "the entry_status dimension moved to WITHDRAWN or CANCELLED"
        side_effects:
          - "aid released to Season.assistance_available_cents; fee_status = REFUNDED"
      - from: AID_PARTIAL
        to: REFUNDED
        trigger: "system, inside the WITHDRAWN or CANCELLED branch"
        actor: system
        preconditions:
          - "the entry_status dimension moved to WITHDRAWN or CANCELLED"
        side_effects:
          - "aid released to Season.assistance_available_cents; refunded_cents = amount_paid_cents; fee_status = REFUNDED"
      - from: PAID
        to: FORFEITED_FEE
        trigger: "system, inside the ACCEPTED -> FORFEITED branch"
        actor: system
        preconditions:
          - "the entry_status dimension moved to FORFEITED"
        side_effects:
          - "fee_status = FORFEITED_FEE; refunded_cents stays 0"
      - from: AID_COVERED
        to: FORFEITED_FEE
        trigger: "system, inside the ACCEPTED -> FORFEITED branch"
        actor: system
        preconditions:
          - "the entry_status dimension moved to FORFEITED"
        side_effects:
          - "aid moved committed -> disbursed on the Season; fee_status = FORFEITED_FEE"
      - from: AID_PARTIAL
        to: FORFEITED_FEE
        trigger: "system, inside the ACCEPTED -> FORFEITED branch"
        actor: system
        preconditions:
          - "the entry_status dimension moved to FORFEITED"
        side_effects:
          - "aid moved committed -> disbursed on the Season; fee_status = FORFEITED_FEE"
      - from: UNPAID
        to: FORFEITED_FEE
        trigger: "system, inside the ACCEPTED -> FORFEITED branch"
        actor: system
        preconditions:
          - "the entry_status dimension moved to FORFEITED"
        side_effects:
          - "fee_status = FORFEITED_FEE; the unpaid balance is written off"
    note: |
      Dimension independence is the point: an entry may be WAITLISTED and PAID, or ACCEPTED and
      UNPAID. The ONLY coupling from the money dimension back into the competitive dimension is
      validations priority 84 - submit-score requires fee_status IN {PAID, AID_COVERED}.

  - entity: Round
    initial_state: SCHEDULED
    terminal_states: [NO_CARD, DISQUALIFIED]
    shape: cyclic          # SUBMITTED -> DISPUTED -> SUBMITTED, bounded by dispute_count
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /rounds/{roundId}/submit-score"
        actor: Member
        preconditions:
          - "X-User-ID == Entry.member_id of the round's entry"
          - "Tournament.status == IN_PROGRESS  (cross-entity guard)"
          - "Entry.entry_status IN {ACCEPTED, COMPETING}"
          - "Entry.fee_status IN {PAID, AID_COVERED}"
          - "gross_strokes in 50..130"
        side_effects:
          - "Round.gross_strokes = payload value; Round.status = SUBMITTED"
          - "Entry.entry_status ACCEPTED -> COMPETING when this is the entry's first submission"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /rounds/{roundId}/submit-score (resubmission after a marker dispute)"
        actor: Member
        preconditions:
          - "X-User-ID == Entry.member_id of the round's entry"
          - "Tournament.status == IN_PROGRESS"
          - "Round.dispute_count < ROUND_DISPUTE_LIMIT (3)"
        side_effects:
          - "Round.gross_strokes overwritten with the payload value; Round.status = SUBMITTED"
        note: "This edge closes the cycle SUBMITTED -> DISPUTED -> SUBMITTED."
      - from: SUBMITTED
        to: PEER_VERIFIED
        trigger: "POST /rounds/{roundId}/peer-verify with decision == VERIFY"
        actor: Member
        preconditions:
          - "X-User-ID == Round.marker_member_id"
        side_effects:
          - "Round.status = PEER_VERIFIED"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /rounds/{roundId}/peer-verify with decision == DISPUTE and Round.dispute_count < 2"
        actor: Member
        preconditions:
          - "X-User-ID == Round.marker_member_id"
          - "the request body carries a `note` explaining the dispute"
          - "Round.dispute_count < ROUND_DISPUTE_LIMIT - 1 (i.e. <= 1 before the increment)"
        side_effects:
          - "Round.dispute_count += 1; Round.status = DISPUTED"
      - from: SUBMITTED
        to: NO_CARD
        trigger: "POST /rounds/{roundId}/peer-verify with decision == DISPUTE when the increment reaches ROUND_DISPUTE_LIMIT (3)"
        actor: Member
        preconditions:
          - "X-User-ID == Round.marker_member_id"
          - "Round.dispute_count == ROUND_DISPUTE_LIMIT - 1 (2) before the increment"
        side_effects:
          - "Round.dispute_count = 3; Round.status = NO_CARD; adjusted_gross and scoring_differential stay null"
          - "Entry.event_points = 0.00 at tournament completion because the entry can never reach FINISHED"
        note: "Cycle termination condition: the third dispute ends the loop in a terminal state instead of returning to SUBMITTED."
      - from: PEER_VERIFIED
        to: CERTIFIED
        trigger: "POST /rounds/{roundId}/certify"
        actor: RulesOfficial
        preconditions:
          - "Round.open_rules_case_count == 0"
          - "Tournament.status == IN_PROGRESS"
        side_effects:
          - "Round.adjusted_gross = gross_strokes + pace_penalty_strokes + rules_penalty_strokes"
          - "Round.scoring_differential = calculations.round_scoring_differential"
          - "Round.status = CERTIFIED; certified_at = clock; certified_by_user_id = X-User-ID"
          - "Entry.certified_round_count += 1; Entry.total_adjusted_strokes += Round.adjusted_gross; Entry.avg_scoring_differential recomputed"
          - "when Entry.certified_round_count == Tournament.round_count -> Entry COMPETING -> FINISHED, then the Tournament compound-completion check runs"
      - from: CERTIFIED
        to: DISQUALIFIED
        trigger: "system, inside POST /rules-cases/{caseId}/adjudicate when decision == UPHELD and disposition == DISQUALIFICATION"
        actor: system
        preconditions:
          - "the case's round is this round"
        side_effects:
          - "HOP 1: Round.status = DISQUALIFIED; adjusted_gross and scoring_differential are left frozen at their certified values for audit"
          - "HOP 2: Entry -> DISQUALIFIED (see state_machines.Entry FINISHED_to_DISQUALIFIED / COMPETING_to_DISQUALIFIED)"
      - from: PEER_VERIFIED
        to: DISQUALIFIED
        trigger: "system, inside POST /rules-cases/{caseId}/adjudicate when decision == UPHELD and disposition == DISQUALIFICATION"
        actor: system
        preconditions:
          - "the case's round is this round"
        side_effects:
          - "Round.status = DISQUALIFIED; Entry -> DISQUALIFIED"
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "system, inside POST /rules-cases/{caseId}/adjudicate when decision == UPHELD and disposition == DISQUALIFICATION"
        actor: system
        preconditions:
          - "the case's round is this round"
        side_effects:
          - "Round.status = DISQUALIFIED; Entry -> DISQUALIFIED"
      - from: DISPUTED
        to: DISQUALIFIED
        trigger: "system, inside POST /rules-cases/{caseId}/adjudicate when decision == UPHELD and disposition == DISQUALIFICATION"
        actor: system
        preconditions:
          - "the case's round is this round"
        side_effects:
          - "Round.status = DISQUALIFIED; Entry -> DISQUALIFIED"

  - entity: RulesCase
    initial_state: REPORTED
    terminal_states: [DISMISSED]
    shape: branching_with_cycle     # REPORTED -> UPHELD -> APPEAL_OPEN -> UPHELD (cycle) | DISMISSED
    transitions:
      - from: REPORTED
        to: UPHELD
        trigger: "POST /rules-cases/{caseId}/adjudicate with decision == UPHELD"
        actor: ChiefReferee
        preconditions:
          - "X-User-ID != RulesCase.reported_by_user_id  (segregation of duties)"
          - "disposition present in the request body"
          - "penalty_strokes_applied present and 1..8 when disposition == PENALTY_STROKES"
        side_effects:
          - "BRANCH A (disposition == PENALTY_STROKES): Round.rules_penalty_strokes += penalty_strokes_applied; RulesCase.penalty_strokes_applied = the payload value; Round.open_rules_case_count -= 1; the round's status is untouched"
          - "BRANCH B (disposition == DISQUALIFICATION): Round.open_rules_case_count -= 1; Round.status -> DISQUALIFIED; that hop drives Entry -> DISQUALIFIED, which in turn recomputes Member.provisional_ranking_points and Tournament.finished_count"
          - "RulesCase.status = UPHELD; decision = UPHELD; disposition recorded; adjudicated_by_user_id = X-User-ID; decided_at = clock"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /rules-cases/{caseId}/adjudicate with decision == DISMISSED"
        actor: ChiefReferee
        preconditions:
          - "X-User-ID != RulesCase.reported_by_user_id"
        side_effects:
          - "Round.open_rules_case_count -= 1; no stroke and no status change on the round"
          - "RulesCase.status = DISMISSED; decision = DISMISSED; penalty_strokes_applied = 0; decided_at = clock"
      - from: UPHELD
        to: APPEAL_OPEN
        trigger: "POST /rules-cases/{caseId}/appeal"
        actor: Member
        preconditions:
          - "X-User-ID == Entry.member_id of the case's round"
          - "clock <= RulesCase.decided_at + RULES_APPEAL_WINDOW_HOURS (72)"
        side_effects:
          - "RulesCase.status = APPEAL_OPEN; appeal_count += 1; Round.open_rules_case_count += 1"
          - "any PENALTY_STROKES already applied stay applied while the appeal is open"
      - from: APPEAL_OPEN
        to: DISMISSED
        trigger: "POST /rules-cases/{caseId}/adjudicate with decision == DISMISSED (appeal granted)"
        actor: ChiefReferee
        preconditions:
          - "X-User-ID != RulesCase.reported_by_user_id"
        side_effects:
          - "COMPENSATION: Round.rules_penalty_strokes -= RulesCase.penalty_strokes_applied; penalty_strokes_applied = 0"
          - "when the case had disqualified the round, the round is NOT restored: the DISQUALIFIED status is final and this asymmetry is pinned"
          - "Round.open_rules_case_count -= 1; RulesCase.status = DISMISSED; decided_at = clock"
      - from: APPEAL_OPEN
        to: UPHELD
        trigger: "POST /rules-cases/{caseId}/adjudicate with decision == UPHELD (appeal denied)"
        actor: ChiefReferee
        preconditions:
          - "X-User-ID != RulesCase.reported_by_user_id"
          - "disposition present in the request body and equal to the disposition already recorded"
        side_effects:
          - "no change to Round.rules_penalty_strokes (the penalty was never lifted)"
          - "Round.open_rules_case_count -= 1; RulesCase.status = UPHELD; decided_at = clock"
        note: "This edge closes the cycle UPHELD -> APPEAL_OPEN -> UPHELD."

  - entity: ConductCase
    initial_state: UNDER_REVIEW
    terminal_states: [CLEARED]
    shape: branching_with_cycle     # UNDER_REVIEW -> SANCTIONED -> APPEAL_OPEN -> SANCTIONED (cycle) | CLEARED
    transitions:
      - from: UNDER_REVIEW
        to: SANCTIONED
        trigger: "POST /conduct-cases/{caseId}/decide with decision == SANCTIONED"
        actor: ConductCommittee
        preconditions:
          - "X-User-ID != ConductCase.filed_by_user_id  (segregation of duties)"
        side_effects:
          - "HOP 1: ConductCase.points_assessed = CONDUCT_POINTS_BY_CODE[incident_code]; cumulative_points_at_decision and sanction_tier per calculations.conduct_sanction_tier; status = SANCTIONED; decided_at = clock; decided_by_user_id = X-User-ID"
          - "BRANCH WARNING (cumulative < 3): Member.conduct_points updated only; no entry is touched"
          - "BRANCH VENUE_BAN_ONE_EVENT (3 <= cumulative < 6): Member.conduct_points updated; the member's Entry on ConductCase.tournament_id with entry_status == ACCEPTED -> FORFEITED (fee forfeited, aid disbursed, slot freed, waitlist promotion fires); Member.late_withdrawal_count is NOT charged"
          - "BRANCH MEMBER_SUSPENSION (cumulative >= 6): HOP 2 = Member.eligibility_status VERIFIED -> SUSPENDED, which cascades to HOP 3 (all APPLIED/WAITLISTED entries -> REJECTED and all ACCEPTED entries in FIELD_SET tournaments -> FORFEITED plus all ACTIVE exemption grants -> REVOKED), which cascades to HOP 4 (each vacated slot promotes the lowest-waitlist_position entry and the surviving waitlist positions renumber) and HOP 5 (each forfeited entry with aid_award_cents > 0 moves that amount from Season.assistance_committed_cents to Season.assistance_disbursed_cents)"
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /conduct-cases/{caseId}/decide with decision == CLEARED"
        actor: ConductCommittee
        preconditions:
          - "X-User-ID != ConductCase.filed_by_user_id"
        side_effects:
          - "ConductCase.status = CLEARED; points_assessed = 0; sanction_tier = null; decided_at = clock"
          - "Member.conduct_points unchanged"
      - from: SANCTIONED
        to: APPEAL_OPEN
        trigger: "POST /conduct-cases/{caseId}/appeal"
        actor: Member
        preconditions:
          - "X-User-ID == ConductCase.member_id"
          - "clock <= ConductCase.decided_at + CONDUCT_APPEAL_WINDOW_DAYS (14)"
        side_effects:
          - "ConductCase.status = APPEAL_OPEN; appeal_count += 1"
          - "the sanction stays in force during the appeal"
      - from: APPEAL_OPEN
        to: CLEARED
        trigger: "POST /conduct-cases/{caseId}/decide with decision == CLEARED"
        actor: ConductCommittee
        preconditions:
          - "X-User-ID != ConductCase.filed_by_user_id"
        side_effects:
          - "COMPENSATION: ConductCase.points_assessed = 0; sanction_tier = null; status = CLEARED; decided_at = clock"
          - "Member.conduct_points recomputed over the remaining SANCTIONED cases inside the decay window"
          - "when the recomputed total < CONDUCT_SUSPENSION_THRESHOLD and the member is SUSPENDED -> Member SUSPENDED -> VERIFIED"
          - "entries already REJECTED or FORFEITED by the original cascade stay closed"
      - from: APPEAL_OPEN
        to: SANCTIONED
        trigger: "POST /conduct-cases/{caseId}/decide with decision == SANCTIONED (appeal denied)"
        actor: ConductCommittee
        preconditions:
          - "X-User-ID != ConductCase.filed_by_user_id"
        side_effects:
          - "ConductCase.status = SANCTIONED; decided_at = clock; points_assessed and sanction_tier unchanged; no new cascade fires"
        note: "This edge closes the cycle SANCTIONED -> APPEAL_OPEN -> SANCTIONED."

  - entity: AidApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED, SUPERSEDED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /aid-applications/{applicationId}/decide with decision == APPROVED"
        actor: TourAdmin
        preconditions:
          - "calculations.assistance_award_amount tier lookup yields covered_pct > 0"
        side_effects:
          - "AidApplication.covered_pct and estimated_award_cents written (ESTIMATE variant); status = APPROVED; decided_at = clock; decided_by_user_id = X-User-ID"
          - "no money moves on the Season at approval time - reservation happens per entry"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /aid-applications/{applicationId}/decide with decision == DENIED"
        actor: TourAdmin
        preconditions: []
        side_effects:
          - "AidApplication.status = DENIED; covered_pct = 0.00; estimated_award_cents = 0; decided_at = clock"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system, inside POST /aid-applications when a newer application is created for the same (member_id, season_id)"
        actor: system
        preconditions:
          - "the superseded application has consumed_cents == 0"
        side_effects:
          - "AidApplication.status = SUPERSEDED"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system, inside POST /aid-applications when a newer application is created for the same (member_id, season_id)"
        actor: system
        preconditions:
          - "the superseded application has consumed_cents == 0 (otherwise the new submission is refused with ERR_DUPLICATE_ENTRY)"
        side_effects:
          - "AidApplication.status = SUPERSEDED; the new application starts at SUBMITTED with consumed_cents = 0"

  - entity: ExemptionGrant
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    shape: cyclic          # ACTIVE <-> CONSUMED
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "system, when the entry carrying exemption_grant_id becomes ACCEPTED (at set-field or at waitlist promotion)"
        actor: system
        preconditions:
          - "clock <= ExemptionGrant.expires_at"
        side_effects:
          - "ExemptionGrant.status = CONSUMED; consumed_by_entry_id = the accepted entry's id"
      - from: CONSUMED
        to: ACTIVE
        trigger: "system, inside the ACCEPTED -> WITHDRAWN branch or a tournament cancellation (COMPENSATION)"
        actor: system
        preconditions:
          - "the consuming entry left the field through WITHDRAWN or CANCELLED, not FORFEITED"
        side_effects:
          - "ExemptionGrant.status = ACTIVE; consumed_by_entry_id = null"
        note: "Closes the ACTIVE <-> CONSUMED cycle; FORFEITED deliberately does not close it."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, lazily inside POST /entries when clock > ExemptionGrant.expires_at"
        actor: system
        preconditions:
          - "clock > ExemptionGrant.expires_at"
        side_effects:
          - "ExemptionGrant.status = EXPIRED and the entry submission is rejected with ERR_EXEMPTION_NOT_APPLICABLE"
      - from: ACTIVE
        to: REVOKED
        trigger: "system, inside the Member VERIFIED -> SUSPENDED cascade"
        actor: system
        preconditions:
          - "the grant's member became SUSPENDED"
        side_effects:
          - "ExemptionGrant.status = REVOKED"

  - entity: CoachAccessGrant
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, SUPERSEDED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /coach-access-grants/{accessGrantId}/decide with decision == GRANTED"
        actor: Member
        preconditions:
          - "X-User-ID == CoachAccessGrant.member_id"
          - "Member.publication_opt_in == true"
        side_effects:
          - "CoachAccessGrant.status = GRANTED; decided_at = clock; expires_at = clock + COACH_GRANT_TERM_DAYS (180 days)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /coach-access-grants/{accessGrantId}/decide with decision == DENIED"
        actor: Member
        preconditions:
          - "X-User-ID == CoachAccessGrant.member_id"
        side_effects:
          - "CoachAccessGrant.status = DENIED; decided_at = clock; expires_at stays null"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /coach-access-grants/{accessGrantId}/revoke"
        actor: Member | TourAdmin
        preconditions:
          - "for the Member role, X-User-ID == CoachAccessGrant.member_id"
        side_effects:
          - "CoachAccessGrant.status = REVOKED"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system, inside POST /coach-access-grants when the same coach_user_id requests the same member again"
        actor: system
        preconditions: []
        side_effects:
          - "the prior grant's status = SUPERSEDED"
      - from: GRANTED
        to: SUPERSEDED
        trigger: "system, inside POST /coach-access-grants when the same coach_user_id requests the same member again"
        actor: system
        preconditions: []
        side_effects:
          - "the prior grant's status = SUPERSEDED and the new grant starts at REQUESTED, so published-results access is lost until the member decides again"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:

  - rule_id: aid-application-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /aid-applications"
    occ_field: "expected_member_version"
    description: |
      Creating an AidApplication against a Member whose version has advanced since the client
      last observed it is rejected with a stale-version error. A new application legitimately
      supersedes the member's prior SUBMITTED or APPROVED application for the same season, so a
      writer holding an out-of-date view of the member would silently discard a decision it never
      saw. The check is a version comparison, not a timing rule.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

  - rule_id: coach-access-grant-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /coach-access-grants"
    occ_field: "expected_member_version"
    description: |
      Requesting recruiting access against a Member whose version has advanced is rejected.
      A new request from the same coach supersedes that coach's prior REQUESTED or GRANTED grant
      on the member, so a stale view can revoke access the coach still believes is live.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

  - rule_id: handicap-revision-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{memberId}/handicap-revisions"
    occ_field: "expected_member_version"
    description: |
      Posting a handicap revision against a Member whose version has advanced is rejected. A
      revision supersedes the stored handicap_index outright, so a writer working from a stale
      member view would overwrite a revision it never read.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
# GLOBAL PRECISION CONVENTION: every `round_half_up(x, p)` below rounds the MAGNITUDE of x, i.e.
# exact halves move away from zero (-2.15 -> -2.2, 2.15 -> 2.2). Money is integer cents and is
# never stored fractionally. No calculation, selector, tie-break, ordering or cascade order in
# this scaffold reads any entity's `id`; `created_at` is the only common-field fallback used.
calculations:

  - name: member_age_division
    trigger: "on POST /members, and re-evaluated on POST /members/{memberId}/verify-eligibility"
    algorithm: threshold
    formula: |
      age_at_cutoff = full elapsed years from Member.birth_date to Season.age_cutoff_date;
                      the birthday counts as reached when birth_date's month-day <= cutoff month-day
      if   age_at_cutoff <= 10 -> age_division = null
      elif age_at_cutoff <= 13 -> age_division = "U13"
      elif age_at_cutoff <= 15 -> age_division = "U15"
      elif age_at_cutoff <= 17 -> age_division = "U17"
      elif age_at_cutoff <= 19 -> age_division = "U19"
      else                     -> age_division = null
    input_set: "the single Member row plus its Season's age_cutoff_date; no other rows participate"
    constants:
      MIN_AGE: 11
      MAX_AGE: 19
    precision: "integer years"
    variants: []

  - name: tournament_field_quality_factor
    trigger: "at POST /tournaments/{tournamentId}/set-field, and recomputed on every waitlist promotion and on every ACCEPTED -> {WITHDRAWN, FORFEITED, CANCELLED} transition"
    algorithm: weighted_scoring
    formula: |
      field = { Entry e : e.tournament_id == T.id AND e.entry_status IN
                          {ACCEPTED, COMPETING, FINISHED, DISQUALIFIED} }
      field_n = count(field)
      top_n   = count({ e in field : e.rank_at_entry IS NOT NULL AND
                                     e.rank_at_entry <= FIELD_QUALITY_TOP_RANK_CUTOFF })
      raw = 1.00 + (TOP_RANK_WEIGHT * top_n) + (DEPTH_WEIGHT * max(0, field_n - DEPTH_FLOOR))
      field_quality_factor = round_half_up(min(FIELD_QUALITY_CEILING, raw), 2)
    input_set: "only entries holding a playing slot; WAITLISTED, APPLIED, REJECTED, WITHDRAWN, FORFEITED and CANCELLED entries are excluded"
    constants:
      FIELD_QUALITY_TOP_RANK_CUTOFF: 50
      TOP_RANK_WEIGHT: 0.02
      DEPTH_WEIGHT: 0.01
      DEPTH_FLOOR: 12
      FIELD_QUALITY_CEILING: 1.60
    precision: "2 decimal places, round_half_up"
    variants: []
    note: "The `<=` on the rank cutoff is inclusive: rank_at_entry == 50 counts, 51 does not."

  - name: entry_priority_key
    trigger: "at POST /tournaments/{tournamentId}/set-field (ops-run checkpoint) and for the promotion pick on every freed slot"
    algorithm: waterfall_allocation
    formula: |
      # (a) ELIGIBILITY FILTER - the candidate set, as an explicit predicate
      candidates = { Entry e : e.tournament_id == T.id
                               AND e.entry_status == APPLIED
                               AND Member(e.member_id).eligibility_status == VERIFIED }
      # every APPLIED entry NOT in candidates -> REJECTED (rejection_reason MEMBER_SUSPENDED when
      # the member is SUSPENDED, else MEMBER_NOT_VERIFIED)

      # (b) PRIORITY BAND - evaluated top to bottom; the demotion clause wins over exemptions
      band(e) =
        2  if Member(e.member_id).late_withdrawal_count >= LATE_WD_DEMOTION_THRESHOLD
        0  elif e.exemption_grant_id IS NOT NULL
                AND ExemptionGrant(e.exemption_grant_id).status == ACTIVE
        1  elif Member(e.member_id).certified_rank_position IS NOT NULL
        2  else

      # (c) RANKING EXPRESSION - lexicographic ascending
      sort_key(e) = ( band(e),
                      e.rank_at_entry if e.rank_at_entry IS NOT NULL else UNRANKED_SORT_RANK,
                      e.submitted_at,
                      e.created_at )
      # (d) TIE-BREAK - submitted_at ASC then created_at ASC; `id` is never consulted

      ordered = sort(candidates, sort_key ASC)
      ACCEPTED   = ordered[0 : T.field_size_limit]
      WAITLISTED = ordered[T.field_size_limit : ]  with waitlist_position = 1..k in the same order
      # (e) EMPTY-POOL FALLBACK: candidates == {} -> T.status = FIELD_SET, accepted_count = 0,
      #     waitlist_count = 0, field_quality_factor = 1.00, and NO error is raised.
      # PROMOTION PICK: the WAITLISTED entry with min(waitlist_position); positions are unique so
      # no tie is possible; remaining positions renumber to 1..k-1 preserving relative order.
    input_set: "APPLIED entries of one tournament only; entries of other tournaments never participate"
    constants:
      UNRANKED_SORT_RANK: 999999
      LATE_WD_DEMOTION_THRESHOLD: 2
    precision: "integer positions"
    variants: []

  - name: entry_fee_settlement
    trigger: "at POST /entries (the only point of settlement) and on POST /entries/{entryId}/pay"
    algorithm: constraint_propagation
    formula: |
      # The three quantities look mutually dependent (the award is a share of the fee, the net is
      # the fee plus surcharge minus the award, and the surcharge is a share of "the fee").
      # EVALUATION ORDER IS PINNED and must be executed exactly in these four steps:
      # STEP 1
      gross_fee_cents = Tournament.entry_fee_cents            # snapshot onto Entry.gross_fee_cents
      # STEP 2 - the surcharge is a share of the GROSS fee only; it never compounds on the award
      #          and never on the net.
      late = clock > (Tournament.entry_close_at - ENTRY_LATE_WINDOW_HOURS)
      late_entry_surcharge_cents = round_half_up(gross_fee_cents * ENTRY_LATE_SURCHARGE_PCT, 0)
                                   if late else 0
      # STEP 3 - the award is a share of the GROSS fee only; the association never subsidises the
      #          late surcharge (see calculations.assistance_award_amount, event_settlement).
      aid_award_cents = assistance_award_amount(event_settlement)   # 0 when request_assistance is false
      # STEP 4
      net_fee_due_cents = max(0, gross_fee_cents + late_entry_surcharge_cents - aid_award_cents)
      fee_status = AID_COVERED if (aid_award_cents > 0 AND net_fee_due_cents == 0)
                   else AID_PARTIAL if aid_award_cents > 0
                   else UNPAID
    input_set: "one Entry and its Tournament; the member's other entries do not affect the fee"
    constants:
      ENTRY_LATE_WINDOW_HOURS: 72
      ENTRY_LATE_SURCHARGE_PCT: 0.10
    precision: "integer cents, round_half_up at STEP 2 only"
    variants: []
    note: |
      Worked divergence: gross 32000, late window active, covered_pct 0.90. Pinned order gives
      surcharge 3200, award 28800, net 6400. The forbidden order (surcharge folded into the
      subsidised base) would give award round_half_up(35200*0.90) = 31680 and net 3520. The
      scaffold pins the first result.

  - name: assistance_award_amount
    trigger: "variant sliding_scale_estimate at POST /aid-applications/{applicationId}/decide (APPROVED); variant event_settlement at POST /entries with request_assistance == true"
    algorithm: tiered_pricing
    formula: |
      income_per_dependent_cents = floor(household_income_cents / dependents)
      covered_pct = 1.00 if income_per_dependent_cents <= 1500000
                    0.90 if income_per_dependent_cents <= 2500000
                    0.65 if income_per_dependent_cents <= 4500000
                    0.40 if income_per_dependent_cents <= 7000000
                    0.00 otherwise                      # 0.00 blocks approval
      # --- variant sliding_scale_estimate (published award notice, on the AidApplication) ---
      estimated_award_cents = round_half_up(AID_STANDARD_FEE_CENTS * covered_pct, 0)
      # --- variant event_settlement (money actually reserved, on the Entry) ---
      gross_award_cents      = round_half_up(Entry.gross_fee_cents * covered_pct, 0)
      per_member_remaining   = AidApplication.per_member_cap_cents - AidApplication.consumed_cents
      aid_award_cents        = min(gross_award_cents, per_member_remaining)
      if aid_award_cents <= 0                              -> ERR_AID_ALLOCATION_EXHAUSTED
      if aid_award_cents > Season.assistance_available_cents -> ERR_AID_BUDGET_EXHAUSTED
      # no partial season fill: the award is granted whole or refused
    input_set: "the member's APPROVED AidApplication for the entry's season, the entry's gross_fee_cents, and the Season ledger; DENIED and SUPERSEDED applications are never read"
    constants:
      AID_STANDARD_FEE_CENTS: 25000
      AID_PER_MEMBER_SEASON_CAP_CENTS: 60000
    precision: "integer cents, round_half_up"
    variants:
      - name: sliding_scale_estimate
        when: "at approval time, before any event is known"
        difference: "multiplies covered_pct by the association-wide AID_STANDARD_FEE_CENTS (25000) and ignores both the per-member cap and the Season ledger; it never moves money"
      - name: event_settlement
        when: "at entry submission, when a concrete tournament fee exists"
        difference: "multiplies covered_pct by that entry's gross_fee_cents, then clamps to the per-member remaining cap and refuses outright if the Season's available bucket cannot fund it whole; it moves money available -> committed"
    note: "Identical inputs diverge whenever Tournament.entry_fee_cents != 25000. Worked case: pct 0.90 with fee 32000 gives estimate 22500 and settlement 28800."

  - name: round_pace_penalty
    trigger: "recomputed at the end of every POST /rounds/{roundId}/pace-observations, and read at certification"
    algorithm: threshold
    formula: |
      pace_warning_count  = count of observations on this round with observation_type == WARNING
      max_minutes_behind  = max over all observations on this round of minutes_behind (0 when none)
      warning_component   = max(0, pace_warning_count - PACE_FREE_WARNINGS)
      timing_component    = PACE_BREACH_STROKES if max_minutes_behind >= PACE_BREACH_MINUTES else 0
      pace_penalty_strokes = min(PACE_PENALTY_CAP, warning_component + timing_component)
    input_set: "every pace observation recorded on this round, whatever the round's current status"
    constants:
      PACE_FREE_WARNINGS: 2
      PACE_BREACH_MINUTES: 15
      PACE_BREACH_STROKES: 2
      PACE_PENALTY_CAP: 3
    precision: "integer strokes"
    variants: []
    note: "Boundary is exact: the 2nd WARNING still costs 0 strokes, the 3rd costs 1. minutes_behind == 15 breaches (>=), 14 does not."

  - name: round_scoring_differential
    trigger: "at POST /rounds/{roundId}/certify (PEER_VERIFIED -> CERTIFIED); also feeds Entry.avg_scoring_differential in the same request"
    algorithm: aggregation
    formula: |
      # STEP 1 - per-round, ROUND FIRST
      adjusted_gross = gross_strokes + pace_penalty_strokes + rules_penalty_strokes
      scoring_differential = round_half_up(
          (adjusted_gross - Tournament.course_rating) * 113 / Tournament.slope_rating , 1 )
      # STEP 2 - the entry average consumes the ALREADY-ROUNDED per-round values, then rounds again
      avg_scoring_differential = round_half_up(
          sum(r.scoring_differential for r in CERTIFIED rounds of the entry)
          / count(CERTIFIED rounds of the entry) , 1 )
    input_set: "only the entry's rounds with status == CERTIFIED; SUBMITTED, DISPUTED, PEER_VERIFIED, NO_CARD and DISQUALIFIED rounds are excluded from the average"
    constants:
      STANDARD_SLOPE: 113
    precision: "1 decimal place, round_half_up, applied TWICE (per round, then on the mean)"
    variants: []
    note: |
      Rounding order is load-bearing. course_rating 71.4 / slope 128, rounds of 66 and 72:
      round-then-average gives (-4.8 + 0.5) / 2 = -2.15 -> -2.2. average-then-round gives
      (-4.7671875 + 0.5296875) / 2 = -2.11875 -> -2.1. The scaffold pins -2.2.

  - name: entry_finish_position
    trigger: "at the automatic Tournament IN_PROGRESS -> COMPLETED transition"
    algorithm: chronological
    formula: |
      finishers = { Entry e : e.tournament_id == T.id AND e.entry_status == FINISHED }
      order by ( e.total_adjusted_strokes ASC,
                 sum(r.rules_penalty_strokes for r in CERTIFIED rounds of e) ASC,
                 e.submitted_at ASC,
                 e.created_at ASC )
      finish_position = 1-based index in that order
      # DISQUALIFIED, NO_CARD-bearing, WITHDRAWN, FORFEITED and CANCELLED entries receive
      # finish_position = null and never occupy an index.
    input_set: "FINISHED entries of the completing tournament only"
    constants: {}
    precision: "integer positions"
    variants: []

  - name: entry_event_points
    trigger: "at the automatic Tournament IN_PROGRESS -> COMPLETED transition, and set to 0.00 on any Entry -> DISQUALIFIED transition"
    algorithm: weighted_scoring
    formula: |
      base            = TIER_BASE_POINTS[Tournament.tier]
      finish_factor   = round_half_up(max(FINISH_FACTOR_FLOOR,
                                          1.00 - FINISH_DECAY * (finish_position - 1)), 2)
      differential_bonus = max(0.00, round_half_up(
                              (DIFFERENTIAL_PAR - Entry.avg_scoring_differential)
                              * DIFFERENTIAL_POINTS_PER_STROKE , 2))
      event_points    = round_half_up(base * Tournament.field_quality_factor * finish_factor
                                      + differential_bonus , 2)
      # entries that are DISQUALIFIED, or whose entry_status != FINISHED, get event_points = 0.00
    input_set: "one FINISHED entry, its tournament's tier and field_quality_factor, and its own avg_scoring_differential"
    constants:
      TIER_BASE_POINTS: { LOCAL: 150, REGIONAL: 300, NATIONAL: 600, INVITATIONAL: 800 }
      FINISH_DECAY: 0.05
      FINISH_FACTOR_FLOOR: 0.20
      DIFFERENTIAL_PAR: 2.0
      DIFFERENTIAL_POINTS_PER_STROKE: 25
    precision: "2 decimal places, round_half_up; finish_factor and differential_bonus are each rounded BEFORE the final product/sum"
    variants: []
    note: |
      Four inputs interact non-linearly: a tier-keyed base, a multiplicative field-quality factor,
      a floored linear finish decay, and a floored differential bonus that can be zero. Worked
      case: REGIONAL, field_quality_factor 1.00, finish_position 1, avg_scoring_differential -2.2
      -> finish_factor 1.00, differential_bonus 105.00, event_points 405.00.

  - name: member_ranking_points
    trigger: "variant provisional_live is recomputed and PERSISTED on every write to any of the member's Entry.event_points (tournament completion, disqualification) and is also served by GET /members/{memberId}/ranking; variant certified_run is written ONLY by POST /seasons/{seasonId}/ranking-runs"
    algorithm: aggregation
    formula: |
      pool(m) = { Entry e : e.member_id == m.id
                            AND e.entry_status == FINISHED
                            AND e.event_points IS NOT NULL
                            AND Tournament(e.tournament_id).status == COMPLETED
                            AND Tournament(e.tournament_id).start_date >= Season.ranking_window_start_date }
      # --- variant provisional_live -------------------------------------------------------
      provisional_counted_events = count(pool(m))
      provisional_ranking_points = round_half_up(
          sum(e.event_points for e in pool(m)) / max(1, provisional_counted_events) , 2)
      # --- variant certified_run ----------------------------------------------------------
      best = first RANKING_BEST_N of pool(m) ordered by
             ( e.event_points DESC, Tournament(e.tournament_id).start_date ASC, e.created_at ASC )
      certified_counted_events = count(best)
      certified_ranking_points = round_half_up(
          sum(e.event_points for e in best) / max(certified_counted_events, RANKING_MIN_EVENTS) , 2)
      certified_rank_position  = 1-based index of the member ordered by
             ( certified_ranking_points DESC, certified_counted_events DESC, m.created_at ASC ),
             over members with eligibility_status IN {VERIFIED, SUSPENDED} and
             certified_counted_events >= 1;  members with 0 counted events get null
    input_set: "FINISHED entries in COMPLETED tournaments inside the season ranking window; DISQUALIFIED entries carry event_points 0.00 and are excluded because entry_status != FINISHED"
    constants:
      RANKING_BEST_N: 4
      RANKING_MIN_EVENTS: 4
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_live
        when: "continuously, as the season plays out"
        difference: "averages EVERY qualifying event over the actual event count, so a single strong result reads at full value"
        difference_note: "divisor is max(1, counted)"
      - name: certified_run
        when: "only when a TourAdmin executes a ranking run"
        difference: "keeps only the best 4 events and divides by max(counted, 4), so a member with fewer than 4 events is penalised by the empty divisor slots; it also assigns certified_rank_position, which the entry selector reads"
    note: "Identical data diverge hard: one 405.00-point event gives provisional 405.00 and certified 101.25."

  - name: conduct_sanction_tier
    trigger: "at POST /conduct-cases/{caseId}/decide, both for the first decision and for an appeal decision"
    algorithm: decay_function
    formula: |
      window_start = clock - CONDUCT_WINDOW_DAYS
      prior = sum( c.points_assessed for ConductCase c :
                   c.member_id == this.member_id
                   AND c.id != this.id
                   AND c.status == SANCTIONED
                   AND c.decided_at >= window_start )
      points_assessed = CONDUCT_POINTS_BY_CODE[this.incident_code]   # 0 when decision == CLEARED
      cumulative_points_at_decision = prior + points_assessed
      sanction_tier = WARNING              if cumulative_points_at_decision < CONDUCT_BAN_THRESHOLD
                      VENUE_BAN_ONE_EVENT  if CONDUCT_BAN_THRESHOLD <= cumulative < CONDUCT_SUSPENSION_THRESHOLD
                      MEMBER_SUSPENSION    if cumulative >= CONDUCT_SUSPENSION_THRESHOLD
      Member.conduct_points = cumulative_points_at_decision
    input_set: "SANCTIONED conduct cases of the same member whose decided_at falls inside the rolling 365-day window; CLEARED, UNDER_REVIEW and APPEAL_OPEN cases contribute 0"
    constants:
      CONDUCT_POINTS_BY_CODE: { SPECTATOR_INTERFERENCE: 2, COACHING_VIOLATION: 2, ABUSIVE_LANGUAGE: 3, CADDIE_ADVICE_BREACH: 2, PHYSICAL_ALTERCATION: 6, SCORE_TAMPERING: 6 }
      CONDUCT_WINDOW_DAYS: 365
      CONDUCT_BAN_THRESHOLD: 3
      CONDUCT_SUSPENSION_THRESHOLD: 6
    precision: "integer points"
    variants: []
    note: "Thresholds are inclusive on the lower edge: cumulative 3 bans, cumulative 6 suspends. Two ABUSIVE_LANGUAGE cases (3 + 3) therefore suspend, while ABUSIVE_LANGUAGE + COACHING_VIOLATION (3 + 2) only bans."

  - name: season_assistance_ledger
    trigger: "every transition that moves assistance money: entry settlement at POST /entries, pre-deadline withdrawal, tournament cancellation, forfeiture, tournament completion. A waitlist promotion moves NO money."
    algorithm: aggregation
    formula: |
      INVARIANT L1 (must hold after EVERY request, no exception):
        Season.assistance_budget_cents ==   Season.assistance_available_cents
                                          + Season.assistance_committed_cents
                                          + Season.assistance_disbursed_cents
      INVARIANT L2:
        Season.assistance_committed_cents == sum( e.aid_award_cents for Entry e :
              e.entry_status IN {APPLIED, ACCEPTED, WAITLISTED, COMPETING} )
      MOVEMENTS (each is a paired debit/credit of the SAME amount, never a bare write):
        settle     : available -= award ; committed += award ; AidApplication.consumed_cents += award
        withdraw   : available += award ; committed -= award ; AidApplication.consumed_cents -= award
        cancel     : available += award ; committed -= award ; AidApplication.consumed_cents -= award
        forfeit    : committed -= award ; disbursed += award   (consumed_cents NOT released)
        complete   : committed -= award ; disbursed += award   (consumed_cents NOT released)
    input_set: "all entries of the season carrying aid_award_cents > 0"
    constants: {}
    precision: "integer cents; every movement is exact, no rounding occurs at ledger time"
    variants: []
    note: "settle followed by withdraw is the compensating pair: available returns to its exact pre-settlement value and L1 is preserved byte-for-byte."

  - name: tournament_slot_census
    trigger: "every transition that changes any Entry.entry_status of the tournament"
    algorithm: aggregation
    formula: |
      accepted_count = count(Entry with entry_status IN {ACCEPTED, COMPETING, FINISHED, DISQUALIFIED})
      waitlist_count = count(Entry with entry_status == WAITLISTED)
      applied_count  = count(Entry with entry_status == APPLIED)
      closed_count   = count(Entry with entry_status IN {WITHDRAWN, FORFEITED, REJECTED, CANCELLED})
      open_slot_count = max(0, field_size_limit - accepted_count)
      INVARIANT S1: accepted_count <= field_size_limit
      INVARIANT S2: entry_count == applied_count + accepted_count + waitlist_count + closed_count
      INVARIANT S3 (the conserved post-field-set census):
        accepted_count + waitlist_count + closed_count is UNCHANGED by a withdrawal that is
        answered by a waitlist promotion - the withdrawal moves one row accepted -> closed and
        the promotion moves one row waitlist -> accepted, so the three-bucket total is invariant
        while accepted_count and open_slot_count return to their exact pre-withdrawal values.
    input_set: "all Entry rows of the tournament, any status"
    constants: {}
    precision: "integer counts"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules  (evaluated in ascending `priority`; the FIRST violated rule wins
#      and short-circuits every later rule)
# ---------------------------------------------------------------------------
validations:

  # --- 1-3 : request plumbing ---------------------------------------------------------
  - priority: 1
    rule: "X-Role header is present and names a role declared in §1.7"
    category: auth
    error_id: ERR_UNAUTHENTICATED
    applies_to: "every endpoint except POST /members and POST /_clock/set_current_utc"
  - priority: 2
    rule: "the caller's role appears in the target endpoint's `roles` list"
    category: authorization
    error_id: ERR_UNAUTHORIZED
    applies_to: "every endpoint"
  - priority: 3
    rule: "body parses, every required input field is present, enum values are members of their declared set, integers are integers, dates are ISO-8601, and no numeric field is negative where the entity declares a non-negative constraint"
    category: request_schema
    error_id: ERR_INVALID_REQUEST
    applies_to: "every POST endpoint"

  # --- 10-17 : existence, outermost referent first -----------------------------------
  - priority: 10
    rule: "the season_id in the path or body resolves to a Season"
    category: existence
    error_id: ERR_SEASON_NOT_FOUND
    applies_to: "POST /seasons/{seasonId}/ranking-runs, POST /members, POST /tournaments, POST /aid-applications, GET /seasons/{seasonId}"
  - priority: 11
    rule: "the member_id in the path or body resolves to a Member"
    category: existence
    error_id: ERR_MEMBER_NOT_FOUND
    applies_to: "every endpoint carrying memberId or member_id"
  - priority: 12
    rule: "the tournament_id in the path or body resolves to a Tournament (also applied to source_tournament_id and qualifies_into_tournament_id)"
    category: existence
    error_id: ERR_TOURNAMENT_NOT_FOUND
    applies_to: "every endpoint carrying tournamentId, tournament_id, source_tournament_id or qualifies_into_tournament_id"
  - priority: 13
    rule: "the entry_id in the path or body resolves to an Entry"
    category: existence
    error_id: ERR_ENTRY_NOT_FOUND
    applies_to: "GET /entries/{entryId}, POST /entries/{entryId}/withdraw, POST /entries/{entryId}/pay, POST /rounds"
  - priority: 14
    rule: "the round_id in the path or body resolves to a Round"
    category: existence
    error_id: ERR_ROUND_NOT_FOUND
    applies_to: "GET /rounds/{roundId}, POST /rounds/{roundId}/pace-observations, POST /rounds/{roundId}/submit-score, POST /rounds/{roundId}/peer-verify, POST /rounds/{roundId}/certify, POST /rules-cases"
  - priority: 15
    rule: "the caseId in the path resolves to a RulesCase (rules-case routes) or a ConductCase (conduct-case routes)"
    category: existence
    error_id: ERR_CASE_NOT_FOUND
    applies_to: "GET+POST /rules-cases/{caseId}/*, GET+POST /conduct-cases/{caseId}/*"
  - priority: 16
    rule: "the applicationId in the path, or the aid_application_id in the body, resolves to an AidApplication"
    category: existence
    error_id: ERR_AID_APPLICATION_NOT_FOUND
    applies_to: "GET /aid-applications/{applicationId}, POST /aid-applications/{applicationId}/decide, POST /entries"
  - priority: 17
    rule: "the grantId / accessGrantId in the path, or the exemption_grant_id in the body, resolves to an ExemptionGrant or CoachAccessGrant respectively"
    category: existence
    error_id: ERR_GRANT_NOT_FOUND
    applies_to: "GET /exemption-grants/{grantId}, GET+POST /coach-access-grants/{accessGrantId}/*, POST /entries"

  # --- 20-21 : who is asking ----------------------------------------------------------
  - priority: 20
    rule: "a caller with role Member may only read or write rows belonging to the Member row its X-User-ID identifies; a caller with role Coach may only read a member through a GRANTED, unexpired CoachAccessGrant naming its X-User-ID"
    category: ownership
    error_id: ERR_FORBIDDEN_RESOURCE
    applies_to: "GET /members/{memberId}, GET /members/{memberId}/ranking, GET /members/{memberId}/published-results, GET /entries/{entryId}, POST /entries, POST /entries/{entryId}/withdraw, POST /entries/{entryId}/pay, POST /aid-applications"
  - priority: 21
    rule: "the X-User-ID adjudicating a case must differ from the X-User-ID that filed it (RulesCase.reported_by_user_id, ConductCase.filed_by_user_id), and the X-User-ID certifying a round must differ from the round's marker_member_id"
    category: segregation_of_duties
    error_id: ERR_SELF_ADJUDICATION
    applies_to: "POST /rules-cases/{caseId}/adjudicate, POST /conduct-cases/{caseId}/decide, POST /rounds/{roundId}/certify"

  # --- 25 : optimistic concurrency ----------------------------------------------------
  - priority: 25
    rule: "expected_member_version equals the current Member.version"
    category: concurrency
    error_id: ERR_STALE_MEMBER_VERSION
    applies_to: "POST /aid-applications, POST /coach-access-grants, POST /members/{memberId}/handicap-revisions"

  # --- 30-35 : state gates ------------------------------------------------------------
  - priority: 30
    rule: "the Tournament is in a status that admits the requested operation (open-entries requires SCHEDULED; close-entries requires ENTRY_OPEN; set-field requires ENTRY_CLOSED; start requires FIELD_SET; POST /entries requires ENTRY_OPEN; POST /rounds requires FIELD_SET or IN_PROGRESS; POST /exemption-grants requires SCHEDULED or ENTRY_OPEN; cancel requires any of SCHEDULED, ENTRY_OPEN, ENTRY_CLOSED, FIELD_SET - never IN_PROGRESS, COMPLETED or CANCELLED)"
    category: state
    error_id: ERR_INVALID_TOURNAMENT_STATE
    applies_to: "POST /tournaments/{tournamentId}/*, POST /entries, POST /exemption-grants, POST /rounds"
  - priority: 31
    rule: "the Entry is in a status that admits the requested operation (withdraw requires APPLIED, ACCEPTED, WAITLISTED or COMPETING; pay requires a non-terminal status with net_fee_due_cents > 0; POST /rounds requires ACCEPTED or COMPETING)"
    category: state
    error_id: ERR_INVALID_ENTRY_STATE
    applies_to: "POST /entries/{entryId}/withdraw, POST /entries/{entryId}/pay, POST /rounds"
  - priority: 32
    rule: "the Round is in a status that admits the requested operation (pace-observations requires SCHEDULED or SUBMITTED; submit-score requires SCHEDULED or DISPUTED; peer-verify requires SUBMITTED; certify requires PEER_VERIFIED; POST /rules-cases requires SUBMITTED, DISPUTED, PEER_VERIFIED or CERTIFIED, and a CERTIFIED round additionally requires the 48-hour reopen window of priority 62)"
    category: state
    error_id: ERR_INVALID_ROUND_STATE
    applies_to: "POST /rounds/{roundId}/*"
  - priority: 33
    rule: "the RulesCase is in a status that admits the requested operation (adjudicate requires REPORTED or APPEAL_OPEN; appeal requires UPHELD or DISMISSED)"
    category: state
    error_id: ERR_INVALID_CASE_STATE
    applies_to: "POST /rules-cases/{caseId}/adjudicate, POST /rules-cases/{caseId}/appeal"
  - priority: 34
    rule: "the ConductCase is in a status that admits the requested operation (decide requires UNDER_REVIEW or APPEAL_OPEN; appeal requires SANCTIONED or CLEARED)"
    category: state
    error_id: ERR_INVALID_CONDUCT_STATE
    applies_to: "POST /conduct-cases/{caseId}/decide, POST /conduct-cases/{caseId}/appeal"
  - priority: 35
    rule: "the AidApplication is SUBMITTED for decide, and the CoachAccessGrant is REQUESTED for decide / GRANTED for revoke"
    category: state
    error_id: ERR_INVALID_GRANT_STATE
    applies_to: "POST /aid-applications/{applicationId}/decide, POST /coach-access-grants/{accessGrantId}/decide, POST /coach-access-grants/{accessGrantId}/revoke"

  # --- 40-42 : safety gates that outrank every business constraint --------------------
  - priority: 40
    rule: "the Member's eligibility_status is not SUSPENDED"
    category: business_safety
    error_id: ERR_MEMBER_SUSPENDED
    applies_to: "POST /entries, POST /aid-applications, POST /exemption-grants, POST /coach-access-grants, POST /members/{memberId}/handicap-revisions"
  - priority: 41
    rule: "the Member's eligibility_status is VERIFIED (a PENDING_VERIFICATION or REJECTED member cannot enter, be exempted, or be ranked)"
    category: business_safety
    error_id: ERR_MEMBER_NOT_VERIFIED
    applies_to: "POST /entries, POST /exemption-grants"
  - priority: 42
    rule: "the marker_member_id names a different Member than the round's own entrant, and that marker holds an ACCEPTED or COMPETING entry in the same tournament"
    category: business_safety
    error_id: ERR_INVALID_MARKER
    applies_to: "POST /rounds"

  # --- 50-55 : referential / business constraints ------------------------------------
  - priority: 50
    rule: "the Member's age_division equals the Tournament's division"
    category: business_constraint
    error_id: ERR_DIVISION_MISMATCH
    applies_to: "POST /entries, POST /exemption-grants"
  - priority: 51
    rule: "the Member's handicap_index is less than or equal to the Tournament's max_handicap_index"
    category: business_constraint
    error_id: ERR_HANDICAP_ABOVE_LIMIT
    applies_to: "POST /entries"
  - priority: 52
    rule: "the Member's handicap_effective_date is no older than HANDICAP_VALIDITY_DAYS (180) before the logical clock, and handicap_source is not SELF_ATTESTED for a tournament of tier NATIONAL or INVITATIONAL"
    category: business_constraint
    error_id: ERR_HANDICAP_STALE
    applies_to: "POST /entries, POST /members/{memberId}/verify-eligibility"
  - priority: 53
    rule: "a referenced ExemptionGrant is ACTIVE, belongs to the entering Member, names this Tournament, and has expires_at strictly after the logical clock"
    category: referential
    error_id: ERR_EXEMPTION_NOT_APPLICABLE
    applies_to: "POST /entries"
  - priority: 54
    rule: "when request_assistance is true, the Member holds exactly one APPROVED AidApplication for the tournament's season and the referenced aid_application_id is that row"
    category: referential
    error_id: ERR_AID_NOT_APPROVED
    applies_to: "POST /entries"
  - priority: 55
    rule: "the Member has no existing Entry for this Tournament in a status other than WITHDRAWN, REJECTED or CANCELLED; and no second SUBMITTED AidApplication may coexist for one member and season"
    category: business_constraint
    error_id: ERR_DUPLICATE_ENTRY
    applies_to: "POST /entries, POST /aid-applications"

  # --- 60-63 : clock windows ----------------------------------------------------------
  - priority: 60
    rule: "the logical clock is at or after Tournament.entry_open_at and strictly before Tournament.entry_close_at"
    category: business_temporal
    error_id: ERR_ENTRY_WINDOW_CLOSED
    applies_to: "POST /entries"
  - priority: 61
    rule: "close-entries requires the logical clock at or after entry_close_at; a pre-deadline withdrawal requires the clock strictly before withdrawal_deadline_at, and a post-deadline withdrawal is accepted but forfeits (it is not an error)"
    category: business_temporal
    error_id: ERR_ENTRY_WINDOW_OPEN
    applies_to: "POST /tournaments/{tournamentId}/close-entries"
  - priority: 62
    rule: "re-adjudicating a rules case against a CERTIFIED round requires the logical clock within RULES_REOPEN_WINDOW_HOURS (48) of Round.certified_at"
    category: business_temporal
    error_id: ERR_REOPEN_WINDOW_EXPIRED
    applies_to: "POST /rules-cases, POST /rules-cases/{caseId}/adjudicate"
  - priority: 63
    rule: "an appeal must be filed within RULES_APPEAL_WINDOW_HOURS (72) of RulesCase.decided_at, or within CONDUCT_APPEAL_WINDOW_DAYS (14) of ConductCase.decided_at"
    category: business_temporal
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    applies_to: "POST /rules-cases/{caseId}/appeal, POST /conduct-cases/{caseId}/appeal"

  # --- 70-75 : overlap, capacity and consent ----------------------------------------
  - priority: 70
    rule: "the Member holds no ACCEPTED, WAITLISTED, COMPETING or FINISHED entry in another tournament whose travel window [start_date - 1 day, end_date + 1 day] intersects this tournament's closed interval [start_date, end_date]"
    category: business_constraint
    error_id: ERR_SCHEDULE_CONFLICT
    applies_to: "POST /entries"
  - priority: 71
    rule: "for the requested round_number, fewer than Tournament.tee_group_size rounds already occupy the half-open slot [tee_time, tee_time + tee_interval_minutes); a round whose tee_time is exactly tee_interval_minutes later is adjacent, not overlapping, and is allowed"
    category: business_constraint
    error_id: ERR_TEE_SLOT_FULL
    applies_to: "POST /rounds"
  - priority: 72
    rule: "start requires accepted_count >= 1 (a FIELD_SET tournament whose selector produced an empty field cannot be started)"
    category: business_constraint
    error_id: ERR_EMPTY_FIELD
    applies_to: "POST /tournaments/{tournamentId}/start"
  - priority: 73
    rule: "certify requires open_rules_case_count == 0 and dispute-free status, i.e. no RulesCase on the round in status REPORTED or APPEAL_OPEN"
    category: business_constraint
    error_id: ERR_OPEN_RULES_CASE
    applies_to: "POST /rounds/{roundId}/certify"
  - priority: 74
    rule: "publishing or serving recruiting results requires Member.publication_opt_in == true"
    category: business_constraint
    error_id: ERR_PUBLICATION_NOT_CONSENTED
    applies_to: "GET /members/{memberId}/published-results, POST /coach-access-grants"
  - priority: 75
    rule: "a Coach reading a member's published results holds a CoachAccessGrant in status GRANTED with expires_at strictly after the logical clock and scope covering the requested view"
    category: business_constraint
    error_id: ERR_COACH_ACCESS_DENIED
    applies_to: "GET /members/{memberId}/published-results, GET /members/{memberId}/ranking"

  # --- 80-84 : money ------------------------------------------------------------------
  - priority: 80
    rule: "an AidApplication may only be APPROVED when its computed covered_pct is strictly greater than 0.00"
    category: business_fiscal
    error_id: ERR_INCOME_INELIGIBLE
    applies_to: "POST /aid-applications/{applicationId}/decide"
  - priority: 81
    rule: "the AidApplication's consumed_cents is strictly below per_member_cap_cents and the computed award clamps to a strictly positive amount"
    category: business_fiscal
    error_id: ERR_AID_ALLOCATION_EXHAUSTED
    applies_to: "POST /entries"
  - priority: 82
    rule: "Season.assistance_available_cents is greater than or equal to the whole computed award; the association never part-funds an entry"
    category: business_fiscal
    error_id: ERR_AID_BUDGET_EXHAUSTED
    applies_to: "POST /entries"
  - priority: 83
    rule: "a payment amount_cents must be strictly positive and must equal exactly the entry's outstanding remainder, net_fee_due_cents minus amount_paid_cents"
    category: business_fiscal
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    applies_to: "POST /entries/{entryId}/pay"
  - priority: 84
    rule: "start requires every ACCEPTED entry of the tournament to satisfy amount_paid_cents >= net_fee_due_cents"
    category: business_fiscal
    error_id: ERR_ENTRY_FEE_OUTSTANDING
    applies_to: "POST /tournaments/{tournamentId}/start"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
# TOPOLOGY NOTE: entity_topology is `flat`, so every collection is a peer at the root and every
# cross-entity link travels as a foreign key in the request body, never as a nested URL segment.
# Every child entity is reachable both by its own single-resource GET and by a filtered list that
# accepts each of its foreign keys as an optional query parameter.
endpoints:

  # ===== reads: single resource ======================================================
  - method: GET
    path: "/seasons/{seasonId}"
    description: "Fetch one season with its live assistance ledger and ranking-run watermarks."
    input: ["seasonId?"]
    output: Season
    roles: [TourAdmin, RulesOfficial, ChiefReferee, ConductCommittee]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SEASON_NOT_FOUND]

  - method: GET
    path: "/members/{memberId}"
    description: "Fetch one member with eligibility, handicap, conduct and ranking fields."
    input: ["memberId?"]
    output: Member
    roles: [TourAdmin, RulesOfficial, ChiefReferee, ConductCommittee, Member, Coach]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_COACH_ACCESS_DENIED]

  - method: GET
    path: "/tournaments/{tournamentId}"
    description: "Fetch one tournament with its slot census and field quality factor."
    input: ["tournamentId?"]
    output: Tournament
    roles: [TourAdmin, RulesOfficial, ChiefReferee, ConductCommittee, Member, Coach, Anonymous]
    side_effects: []
    errors: [ERR_TOURNAMENT_NOT_FOUND]

  - method: GET
    path: "/exemption-grants/{grantId}"
    description: "Fetch one exemption grant and its consumption state."
    input: ["grantId?"]
    output: ExemptionGrant
    roles: [TourAdmin, RulesOfficial, ChiefReferee, Member]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_GRANT_NOT_FOUND, ERR_FORBIDDEN_RESOURCE]

  - method: GET
    path: "/entries/{entryId}"
    description: "Fetch one entry with its dual status dimensions, fee settlement and scoring roll-up."
    input: ["entryId?"]
    output: Entry
    roles: [TourAdmin, RulesOfficial, ChiefReferee, ConductCommittee, Member]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ENTRY_NOT_FOUND, ERR_FORBIDDEN_RESOURCE]

  - method: GET
    path: "/rounds/{roundId}"
    description: "Fetch one round with pace, penalty and differential detail."
    input: ["roundId?"]
    output: Round
    roles: [TourAdmin, RulesOfficial, ChiefReferee, Member]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ROUND_NOT_FOUND, ERR_FORBIDDEN_RESOURCE]

  - method: GET
    path: "/rules-cases/{caseId}"
    description: "Fetch one rules case with its disposition and appeal count."
    input: ["caseId?"]
    output: RulesCase
    roles: [TourAdmin, RulesOfficial, ChiefReferee]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CASE_NOT_FOUND]

  - method: GET
    path: "/conduct-cases/{caseId}"
    description: "Fetch one conduct case with its sanction tier and cumulative points."
    input: ["caseId?"]
    output: ConductCase
    roles: [TourAdmin, ChiefReferee, ConductCommittee]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CASE_NOT_FOUND]

  - method: GET
    path: "/aid-applications/{applicationId}"
    description: "Fetch one financial-assistance application with its tier result and consumption."
    input: ["applicationId?"]
    output: AidApplication
    roles: [TourAdmin, Member]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_AID_APPLICATION_NOT_FOUND, ERR_FORBIDDEN_RESOURCE]

  - method: GET
    path: "/coach-access-grants/{accessGrantId}"
    description: "Fetch one recruiting access grant."
    input: ["accessGrantId?"]
    output: CoachAccessGrant
    roles: [TourAdmin, Member, Coach]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_GRANT_NOT_FOUND, ERR_FORBIDDEN_RESOURCE]

  # ===== reads: filtered collections =================================================
  - method: GET
    path: "/members"
    description: "List members, optionally narrowed to one season, division or eligibility status."
    input: ["season_id?", "age_division?", "eligibility_status?", "limit?", "offset?"]
    output: "Member[]"
    roles: [TourAdmin, RulesOfficial, ChiefReferee, ConductCommittee]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: "/tournaments"
    description: "List tournaments, optionally narrowed by season, division, status, qualifying feeder or recorded winner."
    input: ["season_id?", "division?", "status?", "qualifies_into_tournament_id?", "winner_entry_id?", "limit?", "offset?"]
    output: "Tournament[]"
    roles: [TourAdmin, RulesOfficial, ChiefReferee, ConductCommittee, Member, Coach, Anonymous]
    side_effects: []
    errors: [ERR_INVALID_REQUEST]

  - method: GET
    path: "/exemption-grants"
    description: "List exemption grants, optionally narrowed by member, target tournament, source tournament, consuming entry or status."
    input: ["member_id?", "tournament_id?", "source_tournament_id?", "consumed_by_entry_id?", "status?", "limit?", "offset?"]
    output: "ExemptionGrant[]"
    roles: [TourAdmin, RulesOfficial, ChiefReferee]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: "/entries"
    description: "List entries, optionally narrowed by member, tournament, consumed exemption, funding application or status."
    input: ["member_id?", "tournament_id?", "exemption_grant_id?", "aid_application_id?", "entry_status?", "fee_status?", "limit?", "offset?"]
    output: "Entry[]"
    roles: [TourAdmin, RulesOfficial, ChiefReferee, ConductCommittee]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: "/rounds"
    description: "List rounds, optionally narrowed by entry, tournament, peer marker or status."
    input: ["entry_id?", "tournament_id?", "marker_member_id?", "status?", "round_number?", "limit?", "offset?"]
    output: "Round[]"
    roles: [TourAdmin, RulesOfficial, ChiefReferee]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: "/rules-cases"
    description: "List rules cases, optionally narrowed by round or status."
    input: ["round_id?", "status?", "limit?", "offset?"]
    output: "RulesCase[]"
    roles: [TourAdmin, RulesOfficial, ChiefReferee]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: "/conduct-cases"
    description: "List conduct cases, optionally narrowed by member, tournament or status."
    input: ["member_id?", "tournament_id?", "status?", "subject_type?", "limit?", "offset?"]
    output: "ConductCase[]"
    roles: [TourAdmin, ChiefReferee, ConductCommittee]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: "/aid-applications"
    description: "List assistance applications, optionally narrowed by member, season or status."
    input: ["member_id?", "season_id?", "status?", "limit?", "offset?"]
    output: "AidApplication[]"
    roles: [TourAdmin]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: "/coach-access-grants"
    description: "List recruiting access grants, optionally narrowed by member, coach or status."
    input: ["member_id?", "coach_user_id?", "status?", "limit?", "offset?"]
    output: "CoachAccessGrant[]"
    roles: [TourAdmin, Coach]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  # ===== reads: computed projections ==================================================
  - method: GET
    path: "/members/{memberId}/ranking"
    description: "Computed read serving BOTH ranking variants side by side: the live provisional average and the last certified-run figures, so their divergence is directly observable."
    input: ["memberId?"]
    output:
      member_id: string
      age_division: string
      provisional_ranking_points: number
      provisional_counted_events: integer
      certified_ranking_points: number
      certified_counted_events: integer
      certified_rank_position: integer
      last_ranking_epoch: integer
      ranking_epoch: integer
    roles: [TourAdmin, RulesOfficial, ChiefReferee, Member, Coach]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_COACH_ACCESS_DENIED]

  - method: GET
    path: "/members/{memberId}/published-results"
    description: "College-recruiting exposure view. Requires the member's publication consent and, for a Coach caller, a live GRANTED access grant."
    input: ["memberId?"]
    output:
      member_id: string
      full_name: string
      age_division: string
      handicap_index: number
      publication_opt_in: boolean
      certified_ranking_points: number
      certified_rank_position: integer
      finished_event_count: integer
      best_finish_position: integer
      avg_scoring_differential: number
    roles: [TourAdmin, Member, Coach]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_PUBLICATION_NOT_CONSENTED, ERR_COACH_ACCESS_DENIED]

  # ===== writes: season, membership, handicap ========================================
  - method: POST
    path: "/seasons"
    description: "Open a competitive season and fund its assistance pool. assistance_available_cents starts equal to assistance_budget_cents; committed and disbursed start at 0."
    input: ["name", "start_date", "end_date", "age_cutoff_date", "ranking_window_start_date", "assistance_budget_cents"]
    output: Season
    roles: [TourAdmin]
    side_effects:
      - "sets assistance_available_cents = assistance_budget_cents, assistance_committed_cents = 0, assistance_disbursed_cents = 0"
      - "sets ranking_epoch = 0, ranked_member_count = 0, last_ranking_run_at = null, last_ranking_as_of_date = null"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/seasons/{seasonId}/ranking-runs"
    description: "Ops-run checkpoint. Executes the certified_run ranking variant across the season, writing certified_ranking_points, certified_counted_events and certified_rank_position onto every member and bumping the season's ranking epoch. The provisional_live figures are untouched."
    input: ["as_of_date?"]
    output: Season
    roles: [TourAdmin]
    side_effects:
      - "for every member of the season with at least one qualifying FINISHED entry, recomputes certified_ranking_points and certified_counted_events using calculations.member_ranking_points variant certified_run"
      - "assigns certified_rank_position 1..N over those members and leaves it null for members with zero counted events"
      - "increments Season.ranking_epoch by 1 and stamps each ranked member's last_ranking_epoch with the new value"
      - "sets Season.last_ranking_run_at to the logical clock, Season.last_ranking_as_of_date to as_of_date (defaulting to the clock's date), and Season.ranked_member_count to N"
      - "does NOT alter provisional_ranking_points or provisional_counted_events"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SEASON_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: "/members"
    description: "Self-service junior registration. Publicly callable; the member lands in PENDING_VERIFICATION and the age division is derived from the season's age cutoff date."
    input: ["season_id", "full_name", "birth_date", "state_code", "guardian_email", "handicap_index", "handicap_effective_date", "handicap_source", "publication_opt_in?"]
    output: Member
    roles: [Anonymous, TourAdmin]
    side_effects:
      - "computes age_at_cutoff and age_division per calculations.member_age_division"
      - "sets eligibility_status = PENDING_VERIFICATION, conduct_points = 0, late_withdrawal_count = 0"
      - "sets provisional_ranking_points = 0.00, provisional_counted_events = 0, certified_ranking_points = null, certified_counted_events = 0, certified_rank_position = null, last_ranking_epoch = null"
      - "defaults publication_opt_in to false when omitted"
    errors: [ERR_SEASON_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: "/members/{memberId}/verify-eligibility"
    description: "Administrative eligibility decision. decision must be VERIFIED or REJECTED. VERIFIED requires a derivable age division and a fresh handicap; REJECTED closes the member out of competition and is terminal."
    input: ["decision", "note?", "memberId?"]
    output: Member
    roles: [TourAdmin]
    side_effects:
      - "decision VERIFIED moves eligibility_status PENDING_VERIFICATION -> VERIFIED and re-derives age_at_cutoff and age_division"
      - "decision REJECTED moves eligibility_status PENDING_VERIFICATION -> REJECTED and requires a note"
      - "increments Member.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_INVALID_REQUEST, ERR_HANDICAP_STALE]

  - method: POST
    path: "/members/{memberId}/handicap-revisions"
    description: "Record a handicap revision. Optimistically concurrent on the member row because a revision supersedes the stored index outright."
    input: ["handicap_index", "handicap_effective_date", "handicap_source", "expected_member_version", "memberId?"]
    output: Member
    roles: [TourAdmin, RulesOfficial]
    side_effects:
      - "overwrites handicap_index, handicap_effective_date and handicap_source"
      - "increments Member.version by 1"
      - "does NOT retroactively alter any existing Entry; entry-time eligibility was already settled"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_STALE_MEMBER_VERSION, ERR_MEMBER_SUSPENDED, ERR_INVALID_REQUEST]

  # ===== writes: tournament lifecycle ================================================
  - method: POST
    path: "/tournaments"
    description: "Schedule a tournament with its entry window, field cap, handicap ceiling, fee and course parameters."
    input: ["season_id", "name", "division", "tier", "start_date", "end_date", "entry_open_at", "entry_close_at", "withdrawal_deadline_at", "field_size_limit", "max_handicap_index", "entry_fee_cents", "round_count", "course_rating", "slope_rating", "tee_group_size?", "tee_interval_minutes?", "qualifies_into_tournament_id?"]
    output: Tournament
    roles: [TourAdmin]
    side_effects:
      - "sets status = SCHEDULED and every census counter (entry_count, applied_count, accepted_count, waitlist_count, closed_count, finished_count) to 0"
      - "sets open_slot_count = field_size_limit and field_quality_factor = null"
      - "defaults tee_group_size to 3 and tee_interval_minutes to 10 when omitted"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SEASON_NOT_FOUND, ERR_TOURNAMENT_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: "/tournaments/{tournamentId}/open-entries"
    description: "Open the entry window (SCHEDULED -> ENTRY_OPEN)."
    input: ["tournamentId?"]
    output: Tournament
    roles: [TourAdmin]
    side_effects: ["sets status = ENTRY_OPEN"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TOURNAMENT_NOT_FOUND, ERR_INVALID_TOURNAMENT_STATE]

  - method: POST
    path: "/tournaments/{tournamentId}/close-entries"
    description: "Close the entry window (ENTRY_OPEN -> ENTRY_CLOSED). Requires the logical clock to have reached entry_close_at."
    input: ["tournamentId?"]
    output: Tournament
    roles: [TourAdmin]
    side_effects: ["sets status = ENTRY_CLOSED"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TOURNAMENT_NOT_FOUND, ERR_INVALID_TOURNAMENT_STATE, ERR_ENTRY_WINDOW_OPEN]

  - method: POST
    path: "/tournaments/{tournamentId}/set-field"
    description: "Ops-run checkpoint that executes the entry selector: accepts up to field_size_limit applicants by priority band and ranking, waitlists the remainder in order, and rejects applicants whose member is no longer eligible. An empty candidate pool is a legitimate outcome, not an error."
    input: ["tournamentId?"]
    output: Tournament
    roles: [TourAdmin]
    side_effects:
      - "runs calculations.entry_priority_key over the tournament's APPLIED entries"
      - "moves the selected entries APPLIED -> ACCEPTED; no money moves here because each award was already reserved at submission"
      - "moves the remainder APPLIED -> WAITLISTED with waitlist_position 1..k in selector order"
      - "moves entries whose member is SUSPENDED or not VERIFIED to REJECTED with the matching rejection_reason"
      - "recomputes field_quality_factor per calculations.tournament_field_quality_factor and the full slot census"
      - "sets status = FIELD_SET"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TOURNAMENT_NOT_FOUND, ERR_INVALID_TOURNAMENT_STATE]

  - method: POST
    path: "/tournaments/{tournamentId}/start"
    description: "Begin play (FIELD_SET -> IN_PROGRESS). Requires the logical clock to have reached start_date, a non-empty field, and every accepted fee settled. Entries stay ACCEPTED here; each one advances to COMPETING on its own first score submission."
    input: ["tournamentId?"]
    output: Tournament
    roles: [TourAdmin, ChiefReferee]
    side_effects:
      - "sets status = IN_PROGRESS"
      - "disables waitlist promotion from this point on: a slot freed while IN_PROGRESS stays open"
      - "leaves every ACCEPTED entry ACCEPTED and every WAITLISTED entry WAITLISTED"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TOURNAMENT_NOT_FOUND, ERR_INVALID_TOURNAMENT_STATE, ERR_EMPTY_FIELD, ERR_ENTRY_FEE_OUTSTANDING]

  - method: POST
    path: "/tournaments/{tournamentId}/cancel"
    description: "Cancel a tournament from any pre-terminal status and compensate every reservation it holds."
    input: ["cancellation_reason", "tournamentId?"]
    output: Tournament
    roles: [TourAdmin]
    side_effects:
      - "moves every non-terminal Entry to CANCELLED and sets each one's fee_status to REFUNDED, refunded_cents to amount_paid_cents"
      - "releases every committed assistance award back to Season.assistance_available_cents and decrements each AidApplication.consumed_cents by the same amount"
      - "returns every ExemptionGrant it consumed from CONSUMED to ACTIVE and clears consumed_by_entry_id"
      - "sets every SCHEDULED Round to NO_CARD"
      - "sets status = CANCELLED, open_slot_count = field_size_limit, accepted_count = 0, waitlist_count = 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TOURNAMENT_NOT_FOUND, ERR_INVALID_TOURNAMENT_STATE, ERR_INVALID_REQUEST]

  # ===== writes: exemptions, entries, money ==========================================
  - method: POST
    path: "/exemption-grants"
    description: "Grant an exemption category into a specific tournament, optionally citing the feeder event that earned it."
    input: ["member_id", "tournament_id", "category", "expires_at", "source_tournament_id?"]
    output: ExemptionGrant
    roles: [TourAdmin]
    side_effects:
      - "sets status = ACTIVE and consumed_by_entry_id = null"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_TOURNAMENT_NOT_FOUND, ERR_INVALID_TOURNAMENT_STATE, ERR_MEMBER_SUSPENDED, ERR_MEMBER_NOT_VERIFIED, ERR_DIVISION_MISMATCH, ERR_INVALID_REQUEST]

  - method: POST
    path: "/entries"
    description: "Submit a tournament entry. Snapshots the member's current certified rank, resolves the priority band, settles the fee through the pinned four-step order, and reserves any assistance award against the season ledger."
    input: ["member_id", "tournament_id", "exemption_grant_id?", "aid_application_id?", "request_assistance?"]
    output: Entry
    roles: [Member, TourAdmin]
    side_effects:
      - "sets entry_status = APPLIED, submitted_at = the logical clock, rank_at_entry = Member.certified_rank_position"
      - "resolves priority_band per calculations.entry_priority_key band()"
      - "settles gross_fee_cents, late_entry_surcharge_cents, aid_award_cents and net_fee_due_cents per calculations.entry_fee_settlement, and sets fee_status accordingly"
      - "when an award is granted, moves that amount from Season.assistance_available_cents to Season.assistance_committed_cents and adds it to AidApplication.consumed_cents"
      - "records exemption_grant_id but does NOT consume the grant: the ACTIVE -> CONSUMED hop fires only when the entry reaches ACCEPTED (at set-field or at a waitlist promotion)"
      - "increments Tournament.entry_count and Tournament.applied_count"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_TOURNAMENT_NOT_FOUND, ERR_AID_APPLICATION_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_TOURNAMENT_STATE, ERR_MEMBER_SUSPENDED, ERR_MEMBER_NOT_VERIFIED, ERR_DIVISION_MISMATCH, ERR_HANDICAP_ABOVE_LIMIT, ERR_HANDICAP_STALE, ERR_EXEMPTION_NOT_APPLICABLE, ERR_AID_NOT_APPROVED, ERR_DUPLICATE_ENTRY, ERR_ENTRY_WINDOW_CLOSED, ERR_SCHEDULE_CONFLICT, ERR_AID_ALLOCATION_EXHAUSTED, ERR_AID_BUDGET_EXHAUSTED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/entries/{entryId}/withdraw"
    description: "Withdraw an entry. Before the withdrawal deadline the entry is WITHDRAWN and every reservation it holds is compensated exactly; at or after the deadline it is FORFEITED, the fee is retained, and the member's late-withdrawal counter advances."
    input: ["reason?", "entryId?"]
    output: Entry
    roles: [Member, TourAdmin]
    side_effects:
      - "clock strictly before withdrawal_deadline_at: entry_status -> WITHDRAWN, fee_status -> REFUNDED, refunded_cents = amount_paid_cents, aid_award_cents released from Season.assistance_committed_cents back to assistance_available_cents, AidApplication.consumed_cents decremented, any consumed ExemptionGrant returned to ACTIVE"
      - "clock at or after withdrawal_deadline_at: entry_status -> FORFEITED, fee_status -> FORFEITED_FEE, aid_award_cents moved from Season.assistance_committed_cents to assistance_disbursed_cents, AidApplication.consumed_cents retained, Member.late_withdrawal_count incremented by 1"
      - "when the withdrawing entry held an accepted slot, the tournament is still FIELD_SET, and a waitlist exists, promotes the WAITLISTED entry with the lowest waitlist_position to ACCEPTED, renumbers the remaining waitlist positions, and recomputes field_quality_factor; the promotion itself moves no money"
      - "recomputes the full slot census per calculations.tournament_slot_census"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ENTRY_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_ENTRY_STATE]

  - method: POST
    path: "/entries/{entryId}/pay"
    description: "Settle an entry's outstanding net fee in a single exact payment."
    input: ["amount_cents", "entryId?"]
    output: Entry
    roles: [Member, TourAdmin]
    side_effects:
      - "adds amount_cents to amount_paid_cents and sets fee_status = PAID"
      - "leaves net_fee_due_cents at the settled charge so the fee breakdown stays auditable"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ENTRY_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_ENTRY_STATE, ERR_PAYMENT_AMOUNT_INVALID, ERR_INVALID_REQUEST]

  - method: POST
    path: "/aid-applications"
    description: "Apply for participation assistance. Optimistically concurrent on the member row because a new application supersedes that member's prior open application for the same season."
    input: ["member_id", "season_id", "household_income_cents", "dependents", "expected_member_version"]
    output: AidApplication
    roles: [Member, TourAdmin]
    side_effects:
      - "computes income_per_dependent_cents and covered_pct per calculations.assistance_award_amount"
      - "sets status = SUBMITTED, per_member_cap_cents = 60000, consumed_cents = 0, estimated_award_cents = null"
      - "moves any prior SUBMITTED or APPROVED application of the same member and season to SUPERSEDED"
      - "increments Member.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_SEASON_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_STALE_MEMBER_VERSION, ERR_MEMBER_SUSPENDED, ERR_DUPLICATE_ENTRY, ERR_INVALID_REQUEST]

  - method: POST
    path: "/aid-applications/{applicationId}/decide"
    description: "Decide an assistance application; decision must be APPROVED or DENIED. Approval publishes the sliding_scale_estimate variant against the association's standard fee; no money moves until an entry is settled."
    input: ["decision", "applicationId?"]
    output: AidApplication
    roles: [TourAdmin]
    side_effects:
      - "decision APPROVED sets status = APPROVED and estimated_award_cents per calculations.assistance_award_amount variant sliding_scale_estimate"
      - "decision DENIED sets status = DENIED, covered_pct = 0.00 and estimated_award_cents = 0"
      - "stamps decided_by_user_id and decided_at"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_AID_APPLICATION_NOT_FOUND, ERR_INVALID_GRANT_STATE, ERR_INCOME_INELIGIBLE, ERR_INVALID_REQUEST]

  # ===== writes: play, pace, scoring, officiating =====================================
  - method: POST
    path: "/rounds"
    description: "Assign a tee time and a peer marker for one round of one entry. The tee sheet enforces an aggregate group capacity over a half-open time slot."
    input: ["entry_id", "round_number", "tee_time", "marker_member_id"]
    output: Round
    roles: [TourAdmin, ChiefReferee]
    side_effects:
      - "denormalises tournament_id from the entry"
      - "sets status = SCHEDULED, pace_warning_count = 0, max_minutes_behind = 0, pace_penalty_strokes = 0, rules_penalty_strokes = 0, dispute_count = 0, open_rules_case_count = 0"
      - "sets gross_strokes, adjusted_gross and scoring_differential to null"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ENTRY_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_TOURNAMENT_NOT_FOUND, ERR_INVALID_TOURNAMENT_STATE, ERR_INVALID_ENTRY_STATE, ERR_INVALID_MARKER, ERR_TEE_SLOT_FULL, ERR_INVALID_REQUEST]

  - method: POST
    path: "/rounds/{roundId}/pace-observations"
    description: "Record a pace-of-play observation against a round and re-derive its pace penalty. The first two warnings are free; the third costs a stroke."
    input: ["observation_type", "minutes_behind", "roundId?"]
    output: Round
    roles: [RulesOfficial, ChiefReferee]
    side_effects:
      - "increments pace_warning_count when observation_type is WARNING"
      - "raises max_minutes_behind to minutes_behind when the new value is larger"
      - "recomputes pace_penalty_strokes per calculations.round_pace_penalty"
      - "recomputes adjusted_gross and scoring_differential when gross_strokes is already recorded"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ROUND_NOT_FOUND, ERR_INVALID_ROUND_STATE, ERR_INVALID_REQUEST]

  - method: POST
    path: "/rounds/{roundId}/submit-score"
    description: "Submit or resubmit a gross score for a round. Requires the tournament to be actually under way."
    input: ["gross_strokes", "roundId?"]
    output: Round
    roles: [Member, RulesOfficial, ChiefReferee]
    side_effects:
      - "records gross_strokes and moves status SCHEDULED -> SUBMITTED, or DISPUTED -> SUBMITTED on a resubmission"
      - "recomputes adjusted_gross = gross_strokes + pace_penalty_strokes + rules_penalty_strokes"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ROUND_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_TOURNAMENT_STATE, ERR_INVALID_ROUND_STATE, ERR_INVALID_REQUEST]

  - method: POST
    path: "/rounds/{roundId}/peer-verify"
    description: "The peer marker attests to or disputes the submitted card. A dispute returns the round for resubmission; the third dispute voids the card."
    input: ["decision", "note?", "roundId?"]
    output: Round
    roles: [Member, RulesOfficial, ChiefReferee]
    side_effects:
      - "decision VERIFY moves status SUBMITTED -> PEER_VERIFIED"
      - "decision DISPUTE requires a note and increments dispute_count, moving status SUBMITTED -> DISPUTED"
      - "a DISPUTE that takes dispute_count to ROUND_DISPUTE_LIMIT (3) moves the round to NO_CARD instead, sets the entry's certified_round_count contribution to zero for this round, and excludes it from avg_scoring_differential"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ROUND_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_ROUND_STATE, ERR_INVALID_MARKER, ERR_INVALID_REQUEST]

  - method: POST
    path: "/rounds/{roundId}/certify"
    description: "Certify a peer-verified card. Blocked while any rules case on the round is open, and the certifying official may not be the round's own marker."
    input: ["roundId?"]
    output: Round
    roles: [RulesOfficial, ChiefReferee]
    side_effects:
      - "computes scoring_differential per calculations.round_scoring_differential and moves status PEER_VERIFIED -> CERTIFIED"
      - "stamps certified_at and certified_by_user_id"
      - "increments Entry.certified_round_count, recomputes Entry.total_adjusted_strokes and Entry.avg_scoring_differential from the entry's CERTIFIED rounds only"
      - "when certified_round_count reaches Tournament.round_count, moves the entry COMPETING -> FINISHED and increments Tournament.finished_count"
      - "when finished_count plus the count of terminated entries covers every entry that started, auto-transitions the tournament IN_PROGRESS -> COMPLETED, assigns finish_position and event_points, stamps winner_entry_id and completed_at, moves each entry's committed assistance to disbursed, and recomputes every affected member's provisional ranking"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ROUND_NOT_FOUND, ERR_INVALID_ROUND_STATE, ERR_SELF_ADJUDICATION, ERR_OPEN_RULES_CASE]

  - method: POST
    path: "/rules-cases"
    description: "Report a rules incident against a round. A case may be opened against an already CERTIFIED round only inside the 48-hour reopen window."
    input: ["round_id", "rule_reference", "proposed_disposition", "penalty_strokes_proposed?"]
    output: RulesCase
    roles: [RulesOfficial, ChiefReferee, Member]
    side_effects:
      - "sets status = REPORTED, appeal_count = 0, penalty_strokes_applied = null, decision = null, disposition = null"
      - "stamps reported_by_user_id from the caller"
      - "increments Round.open_rules_case_count"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ROUND_NOT_FOUND, ERR_INVALID_ROUND_STATE, ERR_REOPEN_WINDOW_EXPIRED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/rules-cases/{caseId}/adjudicate"
    description: "Decide a rules case; decision must be UPHELD or DISMISSED and disposition must be PENALTY_STROKES or DISQUALIFICATION. The adjudicator may not be the reporter. Upholding a DISQUALIFICATION against a certified round retroactively voids the entry's result and rewrites the member's provisional ranking."
    input: ["decision", "disposition", "penalty_strokes_applied?", "caseId?"]
    output: RulesCase
    roles: [ChiefReferee]
    side_effects:
      - "decision UPHELD sets status = UPHELD, records disposition and penalty_strokes_applied, stamps adjudicated_by_user_id and decided_at, and decrements Round.open_rules_case_count"
      - "disposition PENALTY_STROKES adds penalty_strokes_applied to Round.rules_penalty_strokes and recomputes adjusted_gross, scoring_differential, Entry.total_adjusted_strokes and Entry.avg_scoring_differential"
      - "disposition DISQUALIFICATION moves the Round to DISQUALIFIED, moves the Entry to DISQUALIFIED, sets Entry.event_points = 0.00 and Entry.finish_position = null, decrements Tournament.finished_count, and recomputes the member's provisional_ranking_points and provisional_counted_events"
      - "decision DISMISSED sets status = DISMISSED, stamps adjudicated_by_user_id and decided_at, decrements Round.open_rules_case_count, and reverses any penalty already applied by the same case"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CASE_NOT_FOUND, ERR_SELF_ADJUDICATION, ERR_INVALID_CASE_STATE, ERR_REOPEN_WINDOW_EXPIRED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/rules-cases/{caseId}/appeal"
    description: "Appeal a decided rules case within 72 hours, returning it to the chief referee's docket."
    input: ["grounds", "caseId?"]
    output: RulesCase
    roles: [Member, RulesOfficial]
    side_effects:
      - "sets status = APPEAL_OPEN, increments appeal_count, and increments Round.open_rules_case_count"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CASE_NOT_FOUND, ERR_INVALID_CASE_STATE, ERR_APPEAL_WINDOW_EXPIRED, ERR_INVALID_REQUEST]

  # ===== writes: conduct, recruiting access, clock ====================================
  - method: POST
    path: "/conduct-cases"
    description: "File a parent or caddie conduct complaint against a member's entourage at a tournament."
    input: ["member_id", "tournament_id", "subject_type", "subject_name", "incident_code", "narrative"]
    output: ConductCase
    roles: [RulesOfficial, ChiefReferee, TourAdmin]
    side_effects:
      - "sets status = UNDER_REVIEW, points_assessed = 0, cumulative_points_at_decision = null, sanction_tier = null, appeal_count = 0"
      - "stamps filed_by_user_id from the caller"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_TOURNAMENT_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: "/conduct-cases/{caseId}/decide"
    description: "Rule on a conduct complaint; decision must be SANCTIONED or CLEARED. The decider may not be the filer. A cumulative-points total at or above the suspension threshold suspends the member, which cascades through every reservation the member holds."
    input: ["decision", "caseId?"]
    output: ConductCase
    roles: [ConductCommittee]
    side_effects:
      - "decision CLEARED sets status = CLEARED, points_assessed = 0, sanction_tier = null, and leaves Member.conduct_points unchanged"
      - "decision SANCTIONED sets status = SANCTIONED and computes points_assessed, cumulative_points_at_decision and sanction_tier per calculations.conduct_sanction_tier, writing Member.conduct_points"
      - "sanction_tier VENUE_BAN_ONE_EVENT bars the named subject from ConductCase.tournament_id only: the member's Entry on THAT tournament, and only when its entry_status == ACCEPTED, moves to FORFEITED with fee_status FORFEITED_FEE (aid moved from committed to disbursed, slot freed, waitlist promotion fires); entries on every other tournament and entries in any other status are untouched, and Member.late_withdrawal_count is NOT charged"
      - "sanction_tier MEMBER_SUSPENSION moves the Member VERIFIED -> SUSPENDED, then cascades: every APPLIED or WAITLISTED entry -> REJECTED with rejection_reason MEMBER_SUSPENDED, every ACCEPTED or COMPETING entry -> FORFEITED with fee_status FORFEITED_FEE, every ACTIVE or CONSUMED ExemptionGrant of that member -> REVOKED, each forfeited award moved from Season.assistance_committed_cents to assistance_disbursed_cents, each freed slot backfilled from the waitlist, and every affected tournament's census and field_quality_factor recomputed"
      - "stamps decided_by_user_id and decided_at, and increments Member.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CASE_NOT_FOUND, ERR_SELF_ADJUDICATION, ERR_INVALID_CONDUCT_STATE, ERR_INVALID_REQUEST]

  - method: POST
    path: "/conduct-cases/{caseId}/appeal"
    description: "Appeal a conduct decision within 14 days. Reopening the case is what allows a suspension to be undone: a subsequent CLEAR decision restores the member."
    input: ["grounds", "caseId?"]
    output: ConductCase
    roles: [Member, TourAdmin]
    side_effects:
      - "sets status = APPEAL_OPEN and increments appeal_count"
      - "a following CLEARED decision on the appeal subtracts the case's points_assessed from Member.conduct_points and, when the member was suspended by this very case, moves the Member SUSPENDED -> VERIFIED; already-forfeited entries are NOT reinstated"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CASE_NOT_FOUND, ERR_INVALID_CONDUCT_STATE, ERR_APPEAL_WINDOW_EXPIRED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/coach-access-grants"
    description: "A college coach requests recruiting access to a member's published results. Requires the member's publication consent and is optimistically concurrent on the member row."
    input: ["member_id", "coach_school", "scope", "expected_member_version"]
    output: CoachAccessGrant
    roles: [Coach]
    side_effects:
      - "stamps coach_user_id from the caller, sets status = REQUESTED, requested_at = the logical clock, expires_at = null"
      - "moves any prior REQUESTED or GRANTED grant of the same member and coach to SUPERSEDED"
      - "increments Member.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MEMBER_NOT_FOUND, ERR_STALE_MEMBER_VERSION, ERR_MEMBER_SUSPENDED, ERR_PUBLICATION_NOT_CONSENTED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/coach-access-grants/{accessGrantId}/decide"
    description: "The member (or an administrator acting for the member) decides a recruiting access request; decision must be GRANTED or DENIED. A grant runs for 180 days."
    input: ["decision", "accessGrantId?"]
    output: CoachAccessGrant
    roles: [Member, TourAdmin]
    side_effects:
      - "decision GRANTED sets status = GRANTED, decided_at = the logical clock, expires_at = the clock plus COACH_GRANT_TERM_DAYS (180)"
      - "decision DENIED sets status = DENIED and decided_at = the logical clock"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_GRANT_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_GRANT_STATE, ERR_INVALID_REQUEST]

  - method: POST
    path: "/coach-access-grants/{accessGrantId}/revoke"
    description: "Withdraw a live recruiting access grant."
    input: ["reason?", "accessGrantId?"]
    output: CoachAccessGrant
    roles: [Member, TourAdmin]
    side_effects:
      - "sets status = REVOKED and clears expires_at"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_GRANT_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_GRANT_STATE]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-only logical clock. Sets the single UTC instant that every temporal rule in this API reads: entry windows, withdrawal deadlines, handicap freshness, reopen and appeal windows, conduct point windows, and grant expiry. The clock's default value at process start is 2026-08-01T00:00:00Z, and every temporal assertion in this scaffold is expressed relative to that default."
    input: ["current_utc"]
    output:
      current_utc: string
      previous_utc: string
    roles: [Anonymous, TourAdmin, RulesOfficial, ChiefReferee, ConductCommittee, Member, Coach]
    side_effects:
      - "replaces the process-wide logical clock; no domain row is modified and no derived field is recomputed as a result"
    errors: [ERR_INVALID_REQUEST]

# ---------------------------------------------------------------------------
# §1.6 Error Catalog  (every entry is reachable from at least one endpoint in §1.5)
# ---------------------------------------------------------------------------
errors:
  - {error_id: ERR_UNAUTHENTICATED, http_status: 401, message_template: "Authentication is required for this operation", triggered_by: "X-Role header absent or naming a role not declared in §1.7"}
  - {error_id: ERR_UNAUTHORIZED, http_status: 403, message_template: "Role {role} may not perform {operation}", triggered_by: "the caller's role is not listed in the endpoint's roles"}
  - {error_id: ERR_INVALID_REQUEST, http_status: 422, message_template: "Request is invalid: {detail}", triggered_by: "missing required field, unknown enum value, malformed date, or out-of-range numeric"}
  - {error_id: ERR_SEASON_NOT_FOUND, http_status: 404, message_template: "Season {season_id} was not found", triggered_by: "seasonId or season_id does not resolve"}
  - {error_id: ERR_MEMBER_NOT_FOUND, http_status: 404, message_template: "Member {member_id} was not found", triggered_by: "memberId, member_id or marker_member_id does not resolve"}
  - {error_id: ERR_TOURNAMENT_NOT_FOUND, http_status: 404, message_template: "Tournament {tournament_id} was not found", triggered_by: "tournamentId, tournament_id, source_tournament_id or qualifies_into_tournament_id does not resolve"}
  - {error_id: ERR_ENTRY_NOT_FOUND, http_status: 404, message_template: "Entry {entry_id} was not found", triggered_by: "entryId or entry_id does not resolve"}
  - {error_id: ERR_ROUND_NOT_FOUND, http_status: 404, message_template: "Round {round_id} was not found", triggered_by: "roundId or round_id does not resolve"}
  - {error_id: ERR_CASE_NOT_FOUND, http_status: 404, message_template: "Case {case_id} was not found", triggered_by: "caseId does not resolve to a RulesCase on a rules-case route, or to a ConductCase on a conduct-case route"}
  - {error_id: ERR_AID_APPLICATION_NOT_FOUND, http_status: 404, message_template: "Assistance application {application_id} was not found", triggered_by: "applicationId or aid_application_id does not resolve"}
  - {error_id: ERR_GRANT_NOT_FOUND, http_status: 404, message_template: "Grant {grant_id} was not found", triggered_by: "grantId, accessGrantId or exemption_grant_id does not resolve"}
  - {error_id: ERR_FORBIDDEN_RESOURCE, http_status: 403, message_template: "Caller may not access resource {resource_id}", triggered_by: "a Member caller addressing another member's row, or a Coach caller without a live access grant"}
  - {error_id: ERR_SELF_ADJUDICATION, http_status: 409, message_template: "User {user_id} may not decide a matter they raised or attested", triggered_by: "adjudicator equals reporter, decider equals filer, or certifier equals the round's marker"}
  - {error_id: ERR_STALE_MEMBER_VERSION, http_status: 412, message_template: "Member {member_id} is at version {actual}, not {expected}", triggered_by: "expected_member_version does not equal the member's current version"}
  - {error_id: ERR_INVALID_TOURNAMENT_STATE, http_status: 409, message_template: "Tournament {tournament_id} is {status} and cannot accept {operation}", triggered_by: "a tournament-scoped operation attempted from a status that does not admit it"}
  - {error_id: ERR_INVALID_ENTRY_STATE, http_status: 409, message_template: "Entry {entry_id} is {entry_status} and cannot accept {operation}", triggered_by: "withdraw, pay or round creation against an entry in an inadmissible status"}
  - {error_id: ERR_INVALID_ROUND_STATE, http_status: 409, message_template: "Round {round_id} is {status} and cannot accept {operation}", triggered_by: "pace observation, score submission, peer verification or certification from an inadmissible status"}
  - {error_id: ERR_INVALID_CASE_STATE, http_status: 409, message_template: "Rules case {case_id} is {status} and cannot accept {operation}", triggered_by: "adjudicating a case that is not REPORTED or APPEAL_OPEN, or appealing one that is not decided"}
  - {error_id: ERR_INVALID_CONDUCT_STATE, http_status: 409, message_template: "Conduct case {case_id} is {status} and cannot accept {operation}", triggered_by: "deciding a case that is not UNDER_REVIEW or APPEAL_OPEN, or appealing one that is not decided"}
  - {error_id: ERR_INVALID_GRANT_STATE, http_status: 409, message_template: "{entity} {resource_id} is {status} and cannot accept {operation}", triggered_by: "deciding an application that is not SUBMITTED, deciding a grant that is not REQUESTED, or revoking a grant that is not GRANTED"}
  - {error_id: ERR_MEMBER_SUSPENDED, http_status: 409, message_template: "Member {member_id} is suspended", triggered_by: "any entry, exemption, assistance, handicap or recruiting write for a SUSPENDED member"}
  - {error_id: ERR_MEMBER_NOT_VERIFIED, http_status: 409, message_template: "Member {member_id} is {eligibility_status} and is not eligible to compete", triggered_by: "entry or exemption for a PENDING_VERIFICATION or REJECTED member"}
  - {error_id: ERR_INVALID_MARKER, http_status: 409, message_template: "Member {marker_member_id} cannot mark this round", triggered_by: "the marker is the round's own entrant, holds no playing entry in the tournament, or a non-marker attempts the peer verification"}
  - {error_id: ERR_DIVISION_MISMATCH, http_status: 409, message_template: "Member division {age_division} does not match tournament division {division}", triggered_by: "entering or exempting a member into a tournament of another age division"}
  - {error_id: ERR_HANDICAP_ABOVE_LIMIT, http_status: 409, message_template: "Handicap index {handicap_index} exceeds the tournament limit {max_handicap_index}", triggered_by: "entry whose member's handicap index is above the ceiling"}
  - {error_id: ERR_HANDICAP_STALE, http_status: 409, message_template: "Handicap for member {member_id} is not acceptable: {detail}", triggered_by: "handicap_effective_date older than 180 days, or a SELF_ATTESTED handicap offered for a NATIONAL or INVITATIONAL tournament"}
  - {error_id: ERR_EXEMPTION_NOT_APPLICABLE, http_status: 409, message_template: "Exemption grant {exemption_grant_id} does not apply to this entry", triggered_by: "the grant is not ACTIVE, belongs to another member, names another tournament, or has expired"}
  - {error_id: ERR_AID_NOT_APPROVED, http_status: 409, message_template: "No approved assistance application exists for member {member_id} in this season", triggered_by: "request_assistance true with no APPROVED application, or aid_application_id naming a non-approved row"}
  - {error_id: ERR_DUPLICATE_ENTRY, http_status: 409, message_template: "A live {entity} already exists for this member", triggered_by: "second live entry for the same tournament, or second SUBMITTED assistance application for the same season"}
  - {error_id: ERR_ENTRY_WINDOW_CLOSED, http_status: 409, message_template: "The entry window for tournament {tournament_id} is not open", triggered_by: "POST /entries before entry_open_at or at/after entry_close_at"}
  - {error_id: ERR_ENTRY_WINDOW_OPEN, http_status: 409, message_template: "The entry window for tournament {tournament_id} has not yet elapsed", triggered_by: "close-entries before entry_close_at"}
  - {error_id: ERR_REOPEN_WINDOW_EXPIRED, http_status: 409, message_template: "The 48-hour reopen window for round {round_id} has elapsed", triggered_by: "opening or adjudicating a rules case against a CERTIFIED round more than 48 hours after certification"}
  - {error_id: ERR_APPEAL_WINDOW_EXPIRED, http_status: 409, message_template: "The appeal window for case {case_id} has elapsed", triggered_by: "appealing a rules case after 72 hours or a conduct case after 14 days"}
  - {error_id: ERR_SCHEDULE_CONFLICT, http_status: 409, message_template: "Member {member_id} already plays tournament {tournament_id} across these dates", triggered_by: "an entry whose tournament dates intersect an existing entry's travel window"}
  - {error_id: ERR_TEE_SLOT_FULL, http_status: 409, message_template: "Tee slot at {tee_time} for round {round_number} already holds {tee_group_size} players", triggered_by: "a round whose tee_time falls inside an already full half-open interval"}
  - {error_id: ERR_EMPTY_FIELD, http_status: 409, message_template: "Tournament {tournament_id} has no accepted entries and cannot start", triggered_by: "start against a FIELD_SET tournament whose accepted_count is 0"}
  - {error_id: ERR_OPEN_RULES_CASE, http_status: 409, message_template: "Round {round_id} has {open_rules_case_count} unresolved rules case(s)", triggered_by: "certify while a rules case on the round is REPORTED or APPEAL_OPEN"}
  - {error_id: ERR_PUBLICATION_NOT_CONSENTED, http_status: 409, message_template: "Member {member_id} has not consented to results publication", triggered_by: "reading published results, or requesting recruiting access, for a member whose publication_opt_in is false"}
  - {error_id: ERR_COACH_ACCESS_DENIED, http_status: 403, message_template: "Coach {coach_user_id} has no live access grant for member {member_id}", triggered_by: "a Coach caller whose grant is absent, REQUESTED, DENIED, REVOKED, SUPERSEDED or expired, or whose scope does not cover the view"}
  - {error_id: ERR_INCOME_INELIGIBLE, http_status: 409, message_template: "Income per dependent {income_per_dependent_cents} yields no assistance", triggered_by: "approving an application whose computed covered_pct is 0.00"}
  - {error_id: ERR_AID_ALLOCATION_EXHAUSTED, http_status: 409, message_template: "Member {member_id} has consumed the season assistance cap of {per_member_cap_cents}", triggered_by: "an assisted entry whose clamped award is not strictly positive"}
  - {error_id: ERR_AID_BUDGET_EXHAUSTED, http_status: 409, message_template: "Season assistance pool holds {assistance_available_cents}, short of the {award} required", triggered_by: "an assisted entry the season pool cannot fund whole"}
  - {error_id: ERR_PAYMENT_AMOUNT_INVALID, http_status: 422, message_template: "Payment of {amount_cents} does not settle the outstanding balance of {outstanding}", triggered_by: "a non-positive payment, or any amount that is not exactly the outstanding remainder"}
  - {error_id: ERR_ENTRY_FEE_OUTSTANDING, http_status: 409, message_template: "Entry {entry_id} still owes {outstanding}", triggered_by: "start while any accepted entry's amount_paid_cents is below its net_fee_due_cents"}

# ---------------------------------------------------------------------------
# §1.7 RBAC  (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:

  - name: TourAdmin
    identity: opaque
    description: "Association staff. Owns the season, the schedule, the entry selector run, the ranking run and the assistance purse. Cannot officiate: it can neither decide a rules case nor decide a conduct case."
    exclusive_operations:
      - "POST /seasons"
      - "POST /seasons/{seasonId}/ranking-runs"
      - "POST /tournaments"
      - "POST /tournaments/{tournamentId}/open-entries"
      - "POST /tournaments/{tournamentId}/close-entries"
      - "POST /tournaments/{tournamentId}/set-field"
      - "POST /tournaments/{tournamentId}/cancel"
      - "POST /exemption-grants"
      - "POST /aid-applications/{applicationId}/decide"
      - "POST /members/{memberId}/verify-eligibility"
      - "GET /aid-applications"
    shared_operations:
      - "POST /members"
      - "POST /members/{memberId}/handicap-revisions"
      - "POST /tournaments/{tournamentId}/start"
      - "POST /entries"
      - "POST /entries/{entryId}/withdraw"
      - "POST /entries/{entryId}/pay"
      - "POST /aid-applications"
      - "POST /rounds"
      - "POST /conduct-cases"
      - "POST /conduct-cases/{caseId}/appeal"
      - "POST /coach-access-grants/{accessGrantId}/decide"
      - "POST /coach-access-grants/{accessGrantId}/revoke"
      - "every GET in §1.5 except GET /members/{memberId}/published-results filtered reads reserved to Coach"

  - name: RulesOfficial
    identity: opaque
    description: "On-course official. Records pace observations, submits and peer-verifies cards, certifies rounds and reports rules incidents. Cannot decide the cases it reports."
    exclusive_operations:
      - "POST /rounds/{roundId}/pace-observations"
    shared_operations:
      - "POST /rounds/{roundId}/submit-score"
      - "POST /rounds/{roundId}/peer-verify"
      - "POST /rounds/{roundId}/certify"
      - "POST /rules-cases"
      - "POST /rules-cases/{caseId}/appeal"
      - "POST /members/{memberId}/handicap-revisions"
      - "POST /conduct-cases"
      - "GET /seasons/{seasonId}"
      - "GET /members"
      - "GET /rounds"
      - "GET /rules-cases"

  - name: ChiefReferee
    identity: opaque
    description: "Sole adjudicator of rules cases. Also starts play and builds the tee sheet. Cannot decide conduct cases and cannot open the season or run the rankings."
    exclusive_operations:
      - "POST /rules-cases/{caseId}/adjudicate"
    shared_operations:
      - "POST /tournaments/{tournamentId}/start"
      - "POST /rounds"
      - "POST /rounds/{roundId}/pace-observations"
      - "POST /rounds/{roundId}/submit-score"
      - "POST /rounds/{roundId}/peer-verify"
      - "POST /rounds/{roundId}/certify"
      - "POST /rules-cases"
      - "POST /conduct-cases"
      - "GET /seasons/{seasonId}"
      - "GET /rounds"
      - "GET /rules-cases"
      - "GET /conduct-cases"

  - name: ConductCommittee
    identity: opaque
    description: "Sole decider of parent and caddie conduct cases, and therefore the only role that can suspend a member. Holds no operational power over the schedule, the field, scoring or money."
    exclusive_operations:
      - "POST /conduct-cases/{caseId}/decide"
    shared_operations:
      - "GET /seasons/{seasonId}"
      - "GET /members"
      - "GET /members/{memberId}"
      - "GET /entries"
      - "GET /conduct-cases"
      - "GET /conduct-cases/{caseId}"

  - name: Member
    identity: entity_backed:Member
    description: "The junior competitor, identified by X-User-ID matching a Member row. May act only on its own rows."
    exclusive_operations: []
    shared_operations:
      - "POST /entries"
      - "POST /entries/{entryId}/withdraw"
      - "POST /entries/{entryId}/pay"
      - "POST /aid-applications"
      - "POST /rounds/{roundId}/submit-score"
      - "POST /rounds/{roundId}/peer-verify"
      - "POST /rules-cases"
      - "POST /rules-cases/{caseId}/appeal"
      - "POST /conduct-cases/{caseId}/appeal"
      - "POST /coach-access-grants/{accessGrantId}/decide"
      - "POST /coach-access-grants/{accessGrantId}/revoke"
      - "GET /members/{memberId}"
      - "GET /members/{memberId}/ranking"
      - "GET /members/{memberId}/published-results"
      - "GET /entries/{entryId}"
      - "GET /rounds/{roundId}"
      - "GET /exemption-grants/{grantId}"
      - "GET /aid-applications/{applicationId}"
      - "GET /coach-access-grants/{accessGrantId}"

  - name: Coach
    identity: opaque
    description: "College recruiter, identified only by an opaque X-User-ID recorded on the grants it requests. Reads a member's exposure data solely through a live GRANTED access grant."
    exclusive_operations:
      - "POST /coach-access-grants"
    shared_operations:
      - "GET /members/{memberId}"
      - "GET /members/{memberId}/ranking"
      - "GET /members/{memberId}/published-results"
      - "GET /coach-access-grants"
      - "GET /coach-access-grants/{accessGrantId}"
      - "GET /tournaments"
      - "GET /tournaments/{tournamentId}"

  - name: Anonymous
    identity: opaque
    description: "Unauthenticated public. Registers a junior, reads the public schedule, and drives the test clock."
    exclusive_operations: []
    shared_operations:
      - "POST /members"
      - "POST /_clock/set_current_utc"
      - "GET /tournaments"
      - "GET /tournaments/{tournamentId}"
