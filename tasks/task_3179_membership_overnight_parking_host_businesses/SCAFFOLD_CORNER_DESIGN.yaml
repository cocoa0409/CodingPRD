          - endpoints./api/patronization-records
        distinguishing_aspect: "The stay request is the graph's junction: it points at a host, a member, a vehicle and a site at once, so a single row resolves four peer references and a fifth child can hang off it."
        test_recipe:
          setup: ["Logical clock advanced to 2026-06-01T00:00:00Z; a TX/FARM host with one site and a member with a vehicle and a confirmed stay"]
          setup_api_calls:
