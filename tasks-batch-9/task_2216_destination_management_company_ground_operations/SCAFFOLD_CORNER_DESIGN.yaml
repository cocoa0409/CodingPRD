      - name: segment_seat_occupancy_reaggregated_after_move
        claim_type: aggregation
        grounds: [calculations.segment_seat_occupancy, entities.TransportSegment.fields.booked_seat_count]
        distinguishing_aspect: "With unequal seat_counts (5 and 4) on a 12-seat shuttle, booked_seat_count is 9 after both adds and re-aggregates to 5 on the source and 4 on the target after one entry is moved, so the running total is correct after both the add and the reversal."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Program 2026-09-10..2026-09-14; two SHUTTLE_LOOP TransportSegments of that program with seat_capacity 12 each."
            - "Two ManifestEntry rows on segment 1: guest_ref G-100 with seat_count 5 and guest_ref G-200 with seat_count 4."
          setup_api_calls:
            - call: "POST /dmc/programs"
              payload: { client_name: "Occupancy Client", group_name: "Occupancy Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "SHUTTLE_LOOP", vehicle_code: "SHTL-01", origin: "Host Hotel", destination: "Riverside Loft", depart_at: "2026-09-11T18:00:00Z", arrive_at: "2026-09-11T18:40:00Z", seat_capacity: 12, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg1: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "SHUTTLE_LOOP", vehicle_code: "SHTL-02", origin: "Host Hotel", destination: "Riverside Loft", depart_at: "2026-09-11T18:15:00Z", arrive_at: "2026-09-11T18:55:00Z", seat_capacity: 12, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg2: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg1}", guest_ref: "G-100", guest_name: "Ada Wren", seat_count: 5, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me1: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg1}", guest_ref: "G-200", guest_name: "Bo Larsen", seat_count: 4, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me2: $.data.id }
          trigger:
            - call: "POST /dmc/manifest-entries/${me2}/move"
              payload: { target_segment_id: "${seg2}" }
              as: OperationsCoordinator
          assert:
            - "before the trigger TransportSegment.${seg1}.booked_seat_count == 9 and TransportSegment.${seg2}.booked_seat_count == 0"
            - "trigger returns HTTP 200"
            - "TransportSegment.${seg1}.booked_seat_count == 5"
            - "TransportSegment.${seg2}.booked_seat_count == 4"
            - "ManifestEntry.${me2}.segment_id == ${seg2} and ManifestEntry.${me2}.status == ASSIGNED"
            - "ManifestEntry.${me1}.segment_id == ${seg1}"
            - "Program.${prog_id}.seated_guest_count == 9"

      - name: management_fee_tiered_pricing_boundary
        claim_type: tiered_pricing
        grounds: [calculations.program_client_total]
        excluded_because:
          difficulty_instance: combinatorial_formula / management_fee_tier_keyed_on_marked_up_base_not_subtotal
          rationale: "That instance pins the tier selection to the marked-up base (525000 -> 0.09) and contrasts it with the subtotal-keyed 0.12 answer, covering both the boundary and the tier constants."

      - name: credential_decay_window_boundary
        claim_type: decay_function
        grounds: [calculations.staff_credential_status]
        excluded_because:
          difficulty_instance: boundary_precision_check / credential_expiring_window_inclusive_boundary_on_confirm
          rationale: "The three-point walk (EXPIRED / EXPIRING at exactly +14 days / VALID at +15 days) is asserted there."

      - name: billable_headcount_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.element_billable_headcount]
        excluded_because:
          difficulty_instance: dual_variant_calc / billable_headcount_estimate_vs_final_divergence
          rationale: "Both ESTIMATE and FINAL variants and the 631300-cent delta on switch are asserted there."

      - name: markup_rounding_precision_per_line
        claim_type: precision
        grounds: [calculations.reconciliation_line_amounts]
        excluded_because:
          difficulty_instance: combinatorial_formula / markup_rounded_per_line_not_on_program_total
          rationale: "Round-half-up applied per line (3 x 7004 = 21012) versus once on the total (21011) is asserted there."

