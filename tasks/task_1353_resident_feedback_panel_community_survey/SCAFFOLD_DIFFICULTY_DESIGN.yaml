# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Resident Feedback Panel & Community Survey Program
# 9 Difficulty Rules x >=2 instances each (19 instances total).
# Every recipe drives empty-DB -> setup state using only SCAFFOLD.yaml §1.5 endpoints.
# Logical clock default at startup: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: weighting_method_rim_vs_post_strat_divergence
        grounds:
          - calculations.response_weight
          - entities.WeightSnapshot.fields.weighted_cell_shares
          - state_machines.WeightSnapshot.PROVISIONAL_to_SUPERSEDED
        distinguishing_aspect: |
          WeightSnapshot domain: identical ACCEPTED-response set weighted by POST_STRAT
          (cell-ratio targets) vs RIM (single rake pass over age_band then tenure_bucket
          margins) yields different per-cell shares because cells C2 and C3 share the
          AGE_30_44 margin; pinned literals differ (0.5 vs 0.444444 on cell 1).
        test_recipe:
          setup:
            - "Cells: C1 AGE_18_29/D1/RENTER target 3, C2 AGE_30_44/D1/RENTER target 1, C3 AGE_30_44/D1/OWNER target 2"
            - "P1 in C1, P2 in C2, P3 in C3, all ACTIVE, all preferred_locale en"
            - "Instrument locked with required_locales [en]; wave 2026-08-02..2026-08-10 FIELDING, all three invited, all three responded (100%, 300s) and ACCEPTED; wave CLOSED"
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 3 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_30_44", district: "D1", tenure_bucket: "RENTER", target_size: 1 }, as: PanelManager, captures: { c2_id: $.data.id } }
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_30_44", district: "D1", tenure_bucket: "OWNER", target_size: 2 }, as: PanelManager, captures: { c3_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p2@x", full_name: "P Two", age_band: "AGE_30_44", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p2_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p3@x", full_name: "P Three", age_band: "AGE_30_44", district: "D1", tenure_bucket: "OWNER", preferred_locale: "en" }, as: PanelManager, captures: { p3_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/panelists/${p2_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/panelists/${p3_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "Community Survey", question_count: 10, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 1.0, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/open-fielding", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv1: $.data.id } }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p2_id}" }, as: PanelManager, captures: { inv2: $.data.id } }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p3_id}" }, as: PanelManager, captures: { inv3: $.data.id } }
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv1}", answers_payload: { q1: 4 }, completeness_pct: 100, completion_seconds: 300 }, as: PanelManager, captures: { r1: $.data.id } }
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv2}", answers_payload: { q1: 3 }, completeness_pct: 100, completion_seconds: 300 }, as: PanelManager, captures: { r2: $.data.id } }
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv3}", answers_payload: { q1: 2 }, completeness_pct: 100, completion_seconds: 300 }, as: PanelManager, captures: { r3: $.data.id } }
            - { call: "POST /feedback-panel/responses/${r1}/accept", payload: {}, as: DataAnalyst }
            - { call: "POST /feedback-panel/responses/${r2}/accept", payload: {}, as: DataAnalyst }
            - { call: "POST /feedback-panel/responses/${r3}/accept", payload: {}, as: DataAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/close", payload: {}, as: PanelManager }
          trigger:
            - { call: "GET /feedback-panel/survey-waves/${wave_id}", payload: {}, as: DataAnalyst, captures: { wv1: $.data.version } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/weight-snapshots", payload: { method: "POST_STRAT", expected_wave_version: "${wv1}" }, as: DataAnalyst, captures: { snap_ps: $.data.id } }
            - { call: "GET /feedback-panel/survey-waves/${wave_id}", payload: {}, as: DataAnalyst, captures: { wv2: $.data.version } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/weight-snapshots", payload: { method: "RIM", expected_wave_version: "${wv2}" }, as: DataAnalyst, captures: { snap_rim: $.data.id } }
          assert:
            - "WeightSnapshot.${snap_ps}.weighted_cell_shares[${c1_id}] == 0.5"
            - "WeightSnapshot.${snap_ps}.weighted_cell_shares[${c2_id}] == 0.166667"
            - "WeightSnapshot.${snap_ps}.weighted_cell_shares[${c3_id}] == 0.333333"
            - "WeightSnapshot.${snap_rim}.weighted_cell_shares[${c1_id}] == 0.444444"
            - "WeightSnapshot.${snap_rim}.weighted_cell_shares[${c2_id}] == 0.222222"
            - "WeightSnapshot.${snap_rim}.weighted_cell_shares[${c3_id}] == 0.333333"
            - "WeightSnapshot.${snap_ps}.status == SUPERSEDED"
            - "WeightSnapshot.${snap_rim}.weight_mass == 3"

      - name: projected_vs_final_response_rate_divergence
        grounds:
          - calculations.projected_response_rate
          - endpoints."GET /feedback-panel/survey-waves/{id}/analysis"
        distinguishing_aspect: |
          SurveyWave operations domain (distinct from the WeightSnapshot analysis domain
          of the sibling instance): mid-fielding the provisional variant credits half of
          still-open invitations (0.625) while the final variant counts completions only
          (0.25) over the SAME data at the SAME instant; after close the provisional
          variant switches to the final definition (0.25).
        test_recipe:
          setup:
            - "Cells C1 target 6 (P1,P2) and C2 target 6 (P3,P4), all ACTIVE locale en"
            - "Instrument locked; wave 2026-08-02..2026-08-10 min_response_rate 0.9; clock 2026-08-03; wave FIELDING"
            - "4 invitations SENT; only P1 has a SUBMITTED response (completed_count 1, invited_count 4, open SENT 3)"
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 6 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_30_44", district: "D1", tenure_bucket: "OWNER", target_size: 6 }, as: PanelManager, captures: { c2_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p2@x", full_name: "P Two", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p2_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p3@x", full_name: "P Three", age_band: "AGE_30_44", district: "D1", tenure_bucket: "OWNER", preferred_locale: "en" }, as: PanelManager, captures: { p3_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p4@x", full_name: "P Four", age_band: "AGE_30_44", district: "D1", tenure_bucket: "OWNER", preferred_locale: "en" }, as: PanelManager, captures: { p4_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/panelists/${p2_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/panelists/${p3_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/panelists/${p4_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 10, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.9, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/open-fielding", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv1: $.data.id } }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p2_id}" }, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p3_id}" }, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p4_id}" }, as: PanelManager }
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv1}", answers_payload: { q1: 5 }, completeness_pct: 100, completion_seconds: 300 }, as: PanelManager, captures: { r1: $.data.id } }
          trigger:
            - { call: "GET /feedback-panel/survey-waves/${wave_id}/analysis", payload: {}, as: DataAnalyst, captures: { provisional_mid: $.data.projected_response_rate, final_mid: $.data.final_response_rate } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/close", payload: {}, as: PanelManager }
            - { call: "GET /feedback-panel/survey-waves/${wave_id}/analysis", payload: {}, as: DataAnalyst, captures: { projected_post: $.data.projected_response_rate, final_post: $.data.final_response_rate } }
          assert:
            - "provisional_mid == 0.625"
            - "final_mid == 0.25"
            - "projected_post == 0.25"
            - "final_post == 0.25"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) then (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: representativeness_score_min_capped_multi_input
        grounds:
          - calculations.representativeness_score
          - calculations.cell_deficit
          - endpoints."GET /feedback-panel/survey-waves/{id}/analysis"
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — per-cell deficit ratio is
          clamped by min(ratio, 1.0), weighted by target share, and cells with
          target_size == 0 are excluded from both numerator and denominator; with
          targets 4/1/2/0 and actives 1/1/0/0 the score is exactly 28.571429.
        test_recipe:
          setup:
            - "Cells: C1 target 4 with 1 ACTIVE, C2 target 1 with 1 ACTIVE (SATURATED), C3 target 2 with 0 ACTIVE, C4 target 0 (excluded from the sum)"
            - "One locked instrument and one DRAFT wave exist so the analysis endpoint is reachable"
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 4 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_30_44", district: "D1", tenure_bucket: "RENTER", target_size: 1 }, as: PanelManager, captures: { c2_id: $.data.id } }
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_45_64", district: "D2", tenure_bucket: "OWNER", target_size: 2 }, as: PanelManager, captures: { c3_id: $.data.id } }
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_65_PLUS", district: "D2", tenure_bucket: "OWNER", target_size: 0 }, as: PanelManager, captures: { c4_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p2@x", full_name: "P Two", age_band: "AGE_30_44", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p2_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/panelists/${p2_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 10000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
          trigger:
            - { call: "GET /feedback-panel/survey-waves/${wave_id}/analysis", payload: {}, as: DataAnalyst, captures: { score: $.data.representativeness_score } }
          assert:
            - "score == 28.571429"
            - "PanelCell.${c2_id}.status == SATURATED"
            - "PanelCell.${c4_id}.status == SATURATED"

      - name: incentive_amount_per_component_rounding_order
        grounds:
          - calculations.incentive_amount_cents
          - entities.IncentiveAward.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — per-component round_half_up of
          completion bonus (52.5 -> 53) and locale bonus (10.5 -> 11), then quality
          halving (169/2 = 84.5 -> 85); the unpinned alternative (round once at the
          end) yields 84, so only the pinned order produces amount_cents == 85.
        test_recipe:
          setup:
            - "Cell target 5; P1 ACTIVE with preferred_locale es; locked instrument; wave FIELDING with base_incentive_cents 105, clock inside window"
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "es" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 100000, base_incentive_cents: 105 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/open-fielding", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv1: $.data.id } }
          trigger:
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv1}", answers_payload: { q1: 1 }, completeness_pct: 50, completion_seconds: 60 }, as: PanelManager, captures: { r1: $.data.id, r1_speeder: $.data.speeder_flag } }
            - { call: "GET /feedback-panel/incentive-awards?response_id=${r1}", payload: {}, as: IncentiveClerk, captures: { award1: "$.data[0].id", award1_amount: "$.data[0].amount_cents" } }
          assert:
            - "r1_speeder == true"
            - "award1_amount == 85"
            - "IncentiveAward.${award1}.eligibility_status == PENDING"
            - "IncentiveAward.${award1}.payout_status == UNPAID"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: instrument_revision_cycle_stales_certified_translations
        grounds:
          - state_machines.Instrument.IN_REVIEW_to_DRAFT
          - state_machines.Instrument.APPROVED_to_DRAFT
          - state_machines.Translation.CERTIFIED_to_STALE
          - state_machines.Translation.STALE_to_SUBMITTED
        distinguishing_aspect: |
          Instrument is cyclic (DRAFT->IN_REVIEW->DRAFT and APPROVED->DRAFT with
          revision bump): revising an APPROVED instrument stales its CERTIFIED
          translation, which must loop STALE->SUBMITTED->CERTIFIED before re-approval;
          LOCKED is terminal (revise rejected with ERR_INSTRUMENT_INVALID_STATE).
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /feedback-panel/instruments", payload: { title: "Cyclic", question_count: 8, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
          trigger:
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/revise", payload: {}, as: SurveyDesigner, captures: { rev_after_first: $.data.revision } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/revise", payload: {}, as: SurveyDesigner, captures: { rev_after_second: $.data.revision } }
            - { call: "GET /feedback-panel/translations/${tr_en}", payload: {}, as: SurveyDesigner, captures: { tr_status_stale: $.data.status } }
            - { call: "POST /feedback-panel/translations/${tr_en}/resubmit", payload: {}, as: SurveyDesigner, captures: { tr_rev_after_resubmit: $.data.instrument_revision } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner, captures: { final_status: $.data.status } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/revise", payload: {}, as: SurveyDesigner, captures: { err_locked: $.data.error_id } }
          assert:
            - "rev_after_first == 1"
            - "rev_after_second == 2"
            - "tr_status_stale == STALE"
            - "tr_rev_after_resubmit == 2"
            - "final_status == LOCKED"
            - "err_locked == ERR_INSTRUMENT_INVALID_STATE"

      - name: incentive_award_parallel_dimensions_independent
        grounds:
          - state_machines.IncentiveAward
          - state_machines.Response.SUBMITTED_to_QUARANTINED
          - state_machines.Response.QUARANTINED_to_ACCEPTED
        distinguishing_aspect: |
          IncentiveAward carries two independent state dimensions (eligibility x payout)
          on one row: payout cannot advance while eligibility is PENDING (authorize
          rejected), eligibility moves PENDING->ELIGIBLE via the response review path
          without touching payout, and payout then walks UNPAID->AUTHORIZED->PAID while
          eligibility stays ELIGIBLE; FORFEITED is unreachable from PAID.
        test_recipe:
          setup:
            - "Cell target 5; P1 ACTIVE locale en; locked instrument; wave FIELDING base 1000 pool 100000, clock 2026-08-03"
            - "inv1 SENT; response r1 SUBMITTED (completeness 100, 300s -> amount 2000); award minted PENDING/UNPAID"
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/open-fielding", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv1: $.data.id } }
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv1}", answers_payload: { q1: 4 }, completeness_pct: 100, completion_seconds: 300 }, as: PanelManager, captures: { r1: $.data.id } }
            - { call: "GET /feedback-panel/incentive-awards?response_id=${r1}", payload: {}, as: IncentiveClerk, captures: { award1: "$.data[0].id" } }
          trigger:
            - { call: "POST /feedback-panel/incentive-awards/${award1}/authorize", payload: {}, as: IncentiveClerk, captures: { err_pending_auth: $.data.error_id } }
            - { call: "POST /feedback-panel/responses/${r1}/quarantine", payload: {}, as: DataAnalyst }
            - { call: "POST /feedback-panel/responses/${r1}/accept", payload: {}, as: DataAnalyst }
            - { call: "GET /feedback-panel/incentive-awards/${award1}", payload: {}, as: IncentiveClerk, captures: { elig_after_accept: $.data.eligibility_status, payout_after_accept: $.data.payout_status } }
            - { call: "POST /feedback-panel/incentive-awards/${award1}/authorize", payload: {}, as: IncentiveClerk, captures: { payout_after_auth: $.data.payout_status, elig_after_auth: $.data.eligibility_status } }
            - { call: "POST /feedback-panel/incentive-awards/${award1}/pay", payload: {}, as: IncentiveClerk, captures: { payout_final: $.data.payout_status } }
            - { call: "POST /feedback-panel/incentive-awards/${award1}/forfeit", payload: {}, as: IncentiveClerk, captures: { err_forfeit_paid: $.data.error_id } }
          assert:
            - "err_pending_auth == ERR_AWARD_NOT_AUTHORIZED_STATE"
            - "elig_after_accept == ELIGIBLE"
            - "payout_after_accept == UNPAID"
            - "payout_after_auth == AUTHORIZED"
            - "elig_after_auth == ELIGIBLE"
            - "payout_final == PAID"
            - "err_forfeit_paid == ERR_AWARD_NOT_FORFEIT_STATE"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: wave_close_expiry_strike_lapse_cascade
        grounds:
          - state_machines.SurveyWave.FIELDING_to_CLOSED
          - state_machines.Invitation.SENT_to_EXPIRED
          - state_machines.Panelist.ACTIVE_to_LAPSED
          - calculations.missed_streak
        distinguishing_aspect: |
          Depth-3 chain triggered by wave close: close expires SENT invitations (hop 1),
          each expiry recomputes the panelist's chronological missed_streak (hop 2),
          and a streak reaching 2 flips the panelist ACTIVE->LAPSED with lapsed_at set
          (hop 3); sibling instance is triggered by refresh-run apply, not close.
        test_recipe:
          setup:
            - "Cell target 10; P1 ACTIVE locale en; locked instrument"
            - "W1 2026-08-02..2026-08-10: P1 invited 2026-08-03, never responds; closed 2026-08-11 -> streak 1, still ACTIVE"
            - "W2 2026-08-12..2026-08-20: P1 invited 2026-08-13 (washout satisfied at +10d), never responds"
