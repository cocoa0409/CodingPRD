        grounds: ["validations[priority=5]", "errors[ERR_SOD_PREOP_SANITATION]", "entities.SanitationRun.fields.completer_user_id"]
        distinguishing_aspect: "Segregation of duties: user san-1 completed the sanitation run; the same user id (holding QATechnician role) cannot pass the pre-op — 403 ERR_SOD_PREOP_SANITATION."
        test_recipe:
          setup: ["sanitation run COMPLETED by san-1; pre-op PENDING for the same (shift,line)"]
          setup_api_calls:
