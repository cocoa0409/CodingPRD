# §1.8 Scaffold Difficulty Design — Coupon Clearinghouse & Redemption Settlement
# Test-targeting index. Every instance grounds in elements already declared in
# SCAFFOLD.yaml §1.1–§1.7; deleting this file leaves declared behaviour identical.
# 23 instances across the nine §0.5 rule_ids (minimum 2 each).
#
# Shared literal conventions used by every recipe below:
#   * logical clock startup default is exactly 2026-08-01T00:00:00Z
#   * canonical manufacturer prefix 038000, canonical offer SOUP50
#     (face_value_cents 50, handling_fee_cents 7, purchase_requirement_units 2,
#      expiration_date 2026-12-31, redemption_grace_days 30,
#      barcode_family GS1_DATABAR) whose minted barcode_payload is
#      "8110380000005002261231030"
#   * opaque staff ids: "clerk-1", "fa-1", "fa-2", "so-1", "so-2", "admin-1"

scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: lot_valuation_full_count_vs_sampled_extrapolation
        grounds:
          - calculations.lot_gross_face_value
          - calculations.lot_sample_size
          - entities.SubmissionLot.fields.valuation_variant
          - entities.SubmissionLot.fields.projected_accepted_units
          - endpoints.GET./submissions/{id}/valuation
        distinguishing_aspect: |
          The two variants live on SubmissionLot and disagree about the
          *inclusion basis*: full_count values the lot at accepted_qty * face,
          while sampled_extrapolation divides accepted_qty by sample_size,
          rounds that rate to 4 decimals, scales it by counted_qty and rounds
          again — so the same six adjudicated items yield gross 2500 under one
          variant and 250 under the other, a 2250-cent delta.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default"
            - "manufacturer 038000 on CONTRACT_RATE, retailer on PREFERRED tier and NET_30"
            - "offer SOUP50 ACTIVE with its barcode minted"
            - "MAIL submission declared 63 / verified 63, sorted into lot A (counted_qty 60 -> SAMPLED_EXTRAPOLATION, sample_size 6) and lot B (counted_qty 3 -> FULL_COUNT, sample_size 3)"
            - "five PurchaseDataRecords covering POS-A1..POS-A5 with qualifying_units 2, and none for POS-A6"
            - "lot A holds six items at claimed_units 1; the sixth carries POS-A6 so it has no purchase match"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", channel_capability: "BOTH", payment_terms: "NET_30", base_fee_tier: "PREFERRED", fraud_scoring_mode: "ROLLING_WINDOW" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c on two cans", barcode_family: "GS1_DATABAR", max_redemptions: 100000, purchase_requirement_units: 2, redemption_grace_days: 30, digital_enabled: false, clip_validity_days: 14 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A1", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A2", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A3", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A4", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A5", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 63, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/verify-count"
              payload: { verified_count: 63 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 60 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_a_id: $.data.id }
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 3 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_b_id: $.data.id }
            - call: "POST /submission-lots/${lot_a_id}/items"
              payload: { items: [ { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/a1.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-A1", claimed_units: 1 }, { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/a2.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-A2", claimed_units: 1 }, { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/a3.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-A3", claimed_units: 1 }, { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/a4.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-A4", claimed_units: 1 }, { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/a5.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-A5", claimed_units: 1 }, { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/a6.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-A6", claimed_units: 1 } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { item_a1_id: "$.data[0].id", item_a6_id: "$.data[5].id" }
          trigger:
            - call: "POST /submission-lots/${lot_a_id}/finalize"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "GET /submissions/${sub_id}/valuation"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
          assert:
            - "SubmissionLot.${lot_a_id}.valuation_variant == SAMPLED_EXTRAPOLATION"
            - "SubmissionLot.${lot_a_id}.sample_size == 6"
            - "SubmissionLot.${lot_a_id}.accepted_qty == 5"
            - "SubmissionLot.${lot_a_id}.rejected_qty == 1"
            - "SubmissionLot.${lot_a_id}.projected_accepted_units == 50"
            - "SubmissionLot.${lot_a_id}.gross_face_value_cents == 2500"
            - "SubmissionLot.${lot_a_id}.handling_fee_cents == 403"
            - "CouponItem.${item_a6_id}.status == REJECTED_MISREDEEMED"
            - "CouponItem.${item_a6_id}.reject_code == NO_PURCHASE_MATCH"
            - "CouponItem.${item_a1_id}.status == ACCEPTED"
            - "GET /submissions/${sub_id}/valuation returns full_count_gross_face_value_cents == 250"
            - "GET /submissions/${sub_id}/valuation returns sampled_gross_face_value_cents == 2500"
            - "the two variant totals differ by exactly 2250 cents on identical stored rows"

      - name: retailer_fraud_score_rolling_window_vs_lifetime_weighted
        grounds:
          - calculations.retailer_fraud_score
          - entities.Retailer.fields.fraud_score_rolling_window
          - entities.Retailer.fields.fraud_score_lifetime_weighted
          - entities.Retailer.fields.fraud_scoring_mode
          - concurrency_rules[fraud-rescore-stale-retailer]
        distinguishing_aspect: |
          These variants live on Retailer — a different entity and a different
          algorithm family (weighted_scoring with a decay curve) from the
          SubmissionLot valuation pair — and disagree about *time weighting*
          rather than inclusion basis: rolling_window hard-cuts anything older
          than 90 days to weight 0 while lifetime_weighted keeps it at
          0.5 ** (age_days // 180), producing 0.00 against 14.00 from the very
          same six adjudicated items.
        test_recipe:
          setup:
            - "manufacturer 072250, offer THRIFT100 (face 100, purchase_requirement_units 1, expiration 2027-12-31, grace 30), barcode 8110722500010001271231030"
            - "retailer on fraud_scoring_mode ROLLING_WINDOW and base_fee_tier STANDARD"
            - "submission 1 closed at the 2026-08-01T00:00:00Z default clock: one lot of 2 items sharing serial SN-1, so item 1 is ACCEPTED and item 2 is REJECTED_DUPLICATE"
            - "clock advanced to 2027-04-01T00:00:00Z — 243 days later, decay bucket 1, weight 0.5 — and submission 2 closed with one lot of 4 items on distinct serials, all ACCEPTED"
            - "the 90-day rolling window therefore starts 2027-01-01 and contains only submission 2's four items"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Thrift Brands", gs1_company_prefix: "072250", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr2_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Valley Grocers", channel_capability: "BOTH", payment_terms: "NET_15", base_fee_tier: "STANDARD", fraud_scoring_mode: "ROLLING_WINDOW" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret2_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr2_id}", offer_code: "THRIFT100", face_value_cents: 100, handling_fee_cents: 8, expiration_date: "2027-12-31", redemption_instructions: "Save $1 on one", barcode_family: "GS1_DATABAR", max_redemptions: 100000, purchase_requirement_units: 1, redemption_grace_days: 30, digital_enabled: false, clip_validity_days: 14 }
              as: Manufacturer
              as_user_id: "${mfr2_id}"
              captures: { offer2_id: $.data.id }
            - call: "POST /offers/${offer2_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr2_id}"
            - call: "POST /offers/${offer2_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret2_id}", offer_id: "${offer2_id}", pos_transaction_ref: "POS-B1", transaction_date: "2026-07-10", qualifying_units: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret2_id}", offer_id: "${offer2_id}", pos_transaction_ref: "POS-B2", transaction_date: "2026-07-10", qualifying_units: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret2_id}", channel: "MAIL", declared_count: 2, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-15" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_b1_id: $.data.id }
            - call: "POST /submissions/${sub_b1_id}/verify-count"
              payload: { verified_count: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_b1_id}/lots"
              payload: { offer_id: "${offer2_id}", manufacturer_id: "${mfr2_id}", counted_qty: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_b1_id: $.data.id }
            - call: "POST /submission-lots/${lot_b1_id}/items"
              payload: { items: [ { scanned_barcode: "8110722500010001271231030", serial_number: "SN-1", image_uri: "s3://img/b1.jpg", redeemed_at: "2026-07-10", pos_transaction_ref: "POS-B1", claimed_units: 1 }, { scanned_barcode: "8110722500010001271231030", serial_number: "SN-1", image_uri: "s3://img/b2.jpg", redeemed_at: "2026-07-10", pos_transaction_ref: "POS-B2", claimed_units: 1 } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { item_b1_id: "$.data[0].id", item_b2_id: "$.data[1].id" }
            - call: "POST /submission-lots/${lot_b1_id}/finalize"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret2_id}", offer_id: "${offer2_id}", pos_transaction_ref: "POS-B3", transaction_date: "2027-03-20", qualifying_units: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret2_id}", offer_id: "${offer2_id}", pos_transaction_ref: "POS-B4", transaction_date: "2027-03-20", qualifying_units: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret2_id}", offer_id: "${offer2_id}", pos_transaction_ref: "POS-B5", transaction_date: "2027-03-20", qualifying_units: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret2_id}", offer_id: "${offer2_id}", pos_transaction_ref: "POS-B6", transaction_date: "2027-03-20", qualifying_units: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret2_id}", channel: "MAIL", declared_count: 4, postmark_window_start: "2027-03-01", postmark_window_end: "2027-03-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_b2_id: $.data.id }
            - call: "POST /submissions/${sub_b2_id}/verify-count"
              payload: { verified_count: 4 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_b2_id}/lots"
              payload: { offer_id: "${offer2_id}", manufacturer_id: "${mfr2_id}", counted_qty: 4 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_b2_id: $.data.id }
            - call: "POST /submission-lots/${lot_b2_id}/items"
              payload: { items: [ { scanned_barcode: "8110722500010001271231030", serial_number: "SN-2", image_uri: "s3://img/b3.jpg", redeemed_at: "2027-03-20", pos_transaction_ref: "POS-B3", claimed_units: 1 }, { scanned_barcode: "8110722500010001271231030", serial_number: "SN-3", image_uri: "s3://img/b4.jpg", redeemed_at: "2027-03-20", pos_transaction_ref: "POS-B4", claimed_units: 1 }, { scanned_barcode: "8110722500010001271231030", serial_number: "SN-4", image_uri: "s3://img/b5.jpg", redeemed_at: "2027-03-20", pos_transaction_ref: "POS-B5", claimed_units: 1 }, { scanned_barcode: "8110722500010001271231030", serial_number: "SN-5", image_uri: "s3://img/b6.jpg", redeemed_at: "2027-03-20", pos_transaction_ref: "POS-B6", claimed_units: 1 } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submission-lots/${lot_b2_id}/finalize"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "GET /retailers/${ret2_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { ret2_ver: $.data.version }
          trigger:
            - call: "POST /retailers/${ret2_id}/fraud-rescore"
              payload: { expected_retailer_version: "${ret2_ver}" }
              as: FraudAnalyst
              as_user_id: "fa-1"
          assert:
            - "CouponItem.${item_b1_id}.status == ACCEPTED"
            - "CouponItem.${item_b2_id}.status == REJECTED_DUPLICATE and duplicate_of_item_id == ${item_b1_id}"
            - "Retailer.${ret2_id}.fraud_score_rolling_window == 0.00"
            - "Retailer.${ret2_id}.fraud_score_lifetime_weighted == 14.00"
            - "Retailer.${ret2_id}.fraud_score == 0.00"
            - "Retailer.${ret2_id}.duplicate_rate == 0.00"
            - "Retailer.${ret2_id}.status == ACTIVE"
            - "Retailer.${ret2_id}.handling_fee_tier == STANDARD"
            - "Retailer.${ret2_id}.last_rescored_at is 2027-04-01T00:00:00.000Z"
            - "the two variant fields differ by exactly 14.00 points from the same six adjudicated items"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: per_lot_handling_fee_round_then_sum
        grounds:
          - calculations.lot_handling_fee
          - entities.SubmissionLot.fields.handling_fee_cents
          - entities.Submission.fields.settled_handling_fee_cents
          - entities.Retailer.fields.handling_fee_tier
        distinguishing_aspect: |
          Mode (b) — rounding-order sensitivity. Each lot's fee is rounded
          half-up to whole cents BEFORE the submission sums them, so 50 units
          and 13 units at 7 cents on a PREFERRED 1.15 multiplier give
          403 + 105 = 508; summing units first and rounding once gives
          round_half_up(63 * 7 * 1.15) = round_half_up(507.15) = 507, a
          one-cent divergence that then propagates into provisional_net_cents,
          billed_total_cents and net_payable_cents.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default"
            - "manufacturer 038000 on CONTRACT_RATE (offer.handling_fee_cents 7 applies per unit), retailer on PREFERRED tier so TIER_MULTIPLIER is 1.15"
            - "submission verified 63, lot A counted_qty 60 sampling to 6 items (5 accepted, 1 unmatched) and lot B counted_qty 3 holding items at claimed_units 5, 4 and 4"
            - "purchase records sized so all three lot-B items match: qualifying_units 10, 8 and 8 against purchase_requirement_units 2"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", channel_capability: "BOTH", payment_terms: "NET_30", base_fee_tier: "PREFERRED", fraud_scoring_mode: "ROLLING_WINDOW" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c on two cans", barcode_family: "GS1_DATABAR", max_redemptions: 100000, purchase_requirement_units: 2, redemption_grace_days: 30, digital_enabled: false, clip_validity_days: 14 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A1", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A2", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A3", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A4", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-A5", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-C1", transaction_date: "2026-07-06", qualifying_units: 10 }
              as: IntakeClerk
