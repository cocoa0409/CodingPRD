# =============================================================================
# SCAFFOLD.yaml — task_3117_prescription_data_licensing_provider_level_reporting_opt
# Prescription Data Licensing & Provider-Level Reporting with Opt-Out
# §1.0–§1.7 (difficulty and corner designs live in sibling files)
# =============================================================================

scenario: |
  Prescription Data Licensing & Provider-Level Reporting with Opt-Out (IQVIA): data
  acquisition agreements with pharmacies, distributors and claim processors with
  de-identification requirements, projection methodology extrapolating sampled data
  to full market estimates by geography and specialty, provider-level prescribing
  reports licensed to manufacturers for field force targeting, prescriber opt-out
  programs restricting the use of an individual's data for promotional purposes,
  state law restrictions on prescriber-identifiable data usage with jurisdictional
  filtering, data product versioning and restatement when supplier coverage changes,
  client audit rights and prohibitions on re-identification, delivery cadence and
  data quality service levels.

domain_name: prescription-data-licensing
api_prefix: ""

# =============================================================================
# §0 Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat            # peer entities joined by FK references; no nested write paths
  state_machine_shape: cyclic      # batch reprocess loop, delivery recall/reissue loop, agreement suspend/resume loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # acquisition (DataAcquisitionManager) vs privacy (PrivacyOfficer) vs operations (PlatformAdmin) are disjoint write domains
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ManufacturerClient
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Manufacturer (licensee) legal name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED when an audit completes with outcome REIDENTIFICATION_ATTEMPTED", constraints: "ACTIVE, SUSPENDED" }
      - { name: entitlement_cells_total, type: integer, source: input, description: "Licensed projection-cell entitlement ceiling (cells consumable across all deliveries)" }
      - { name: entitlement_cells_balance, type: integer, source: computed, description: "Remaining cell entitlement; debited by compile/reissue, credited back by recall (calc_entitlement_balance)" }

  - name: DataSupplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: supplier_type, type: enum, source: input, description: "PHARMACY | DISTRIBUTOR | CLAIM_PROCESSOR; drives royalty multiplier", constraints: "PHARMACY, DISTRIBUTOR, CLAIM_PROCESSOR" }
      - { name: state_code, type: string, source: input, description: "US state of supplier headquarters (2-letter)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE, SUSPENDED" }

  - name: DataAcquisitionAgreement
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> DataSupplier.id; supplier party to the agreement" }
      - { name: data_domain, type: enum, source: input, description: "RETAIL_SCRIPTS | DISTRIBUTION_SHIPMENTS | CLAIMS_ADJUDICATION; exclusivity window is per (supplier_id, data_domain)", constraints: "RETAIL_SCRIPTS, DISTRIBUTION_SHIPMENTS, CLAIMS_ADJUDICATION" }
      - { name: exclusivity_start_date, type: string, source: input, description: "ISO date; inclusive lower bound of half-open exclusivity window [start, end)" }
      - { name: exclusivity_end_date, type: string, source: input, description: "ISO date; exclusive upper bound of half-open exclusivity window [start, end)" }
      - { name: royalty_budget_cents, type: integer, source: input, description: "Cap on cumulative royalties payable under this agreement" }
      - { name: royalty_spent_cents, type: integer, source: computed, default: 0, description: "Sum of royalty_cents over ACCEPTED batches of this agreement" }
      - { name: amendment_count, type: integer, source: computed, default: 0, description: "Increments by 1 per successful amendment" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED", constraints: "DRAFT, ACTIVE, SUSPENDED, TERMINATED" }

  - name: DeidentificationProfile
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Profile label" }
      - { name: k_anonymity_threshold, type: integer, source: input, default: 5, description: "Minimum cohort size for k-anonymity; defaults to 5 when omitted" }
      - { name: salt_version, type: string, source: input, description: "Prescriber tokenization salt version" }
      - { name: hash_algorithm, type: enum, source: input, default: SHA256, description: "SHA256 | SHA512; defaults to SHA256", constraints: "SHA256, SHA512" }

  - name: DataFeedBatch
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> DataAcquisitionAgreement.id; agreement authorizing this feed" }
      - { name: period_code, type: string, source: input, description: "Data period, format YYYY-MM" }
      - { name: record_count, type: integer, source: input, description: "Raw record count in the feed (>= 1)" }
      - { name: deidentification_profile_id, type: string, source: system, description: "FK -> DeidentificationProfile.id; null until deidentify, cleared on quarantine", constraints: "nullable" }
      - { name: deid_qa_score, type: number, source: system, description: "De-identification QA score supplied at accept; null until accepted", constraints: "nullable; 0..1" }
      - { name: royalty_cents, type: integer, source: computed, description: "Royalty earned by this batch per calc_acquisition_royalty; null until ACCEPTED", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | VALIDATED | DEIDENTIFIED | ACCEPTED | REJECTED | REPROCESSED | QUARANTINED", constraints: "RECEIVED, VALIDATED, DEIDENTIFIED, ACCEPTED, REJECTED, REPROCESSED, QUARANTINED" }

  - name: Prescriber
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Prescriber name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier (unique)" }
      - { name: state_code, type: string, source: input, description: "Practice state; drives jurisdictional filtering" }
      - { name: specialty, type: enum, source: input, description: "CARDIOLOGY | ONCOLOGY | ENDOCRINOLOGY | PRIMARY_CARE", constraints: "CARDIOLOGY, ONCOLOGY, ENDOCRINOLOGY, PRIMARY_CARE" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE", constraints: "ACTIVE, INACTIVE" }

  - name: PrescriberOptOut
    parent: null
    common_fields: true
    fields:
      - { name: prescriber_id, type: string, source: input, description: "FK -> Prescriber.id; opted-out prescriber" }
      - { name: reason, type: string, source: input, required: false, description: "Optional free-text reason" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | VERIFIED | ACTIVE | REJECTED | LIFTED", constraints: "SUBMITTED, VERIFIED, ACTIVE, REJECTED, LIFTED" }

  - name: JurisdictionRule
    parent: null
    common_fields: false
    fields:
      - { name: state_code, type: string, source: input, description: "US state this rule governs (2-letter)" }
      - { name: restrict_prescriber_identifiable, type: boolean, source: input, description: "true = prescriber-identifiable data may not be used for promotional reporting in this state" }
      - { name: effective_from, type: string, source: input, description: "ISO date; inclusive lower bound of half-open effectiveness window" }
      - { name: effective_to, type: string, source: input, required: false, description: "ISO date; exclusive upper bound; null = open-ended", constraints: "nullable" }

  - name: ProjectionMethodology
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Methodology label" }
      - { name: default_variant, type: enum, source: input, description: "PROJECTION_WEIGHTED | PROJECTION_DENSITY; default projection variant for cells", constraints: "PROJECTION_WEIGHTED, PROJECTION_DENSITY" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (only state; versioning via common version field + restate endpoint)", constraints: "ACTIVE" }

  - name: ProjectionCell
    parent: null
    common_fields: true
    fields:
      - { name: methodology_id, type: string, source: input, description: "FK -> ProjectionMethodology.id" }
      - { name: geography_code, type: string, source: input, description: "Geography identifier, e.g. CA-SOUTH" }
      - { name: specialty, type: enum, source: input, description: "CARDIOLOGY | ONCOLOGY | ENDOCRINOLOGY | PRIMARY_CARE", constraints: "CARDIOLOGY, ONCOLOGY, ENDOCRINOLOGY, PRIMARY_CARE" }
      - { name: period_code, type: string, source: input, description: "Estimate period, format YYYY-MM" }
      - { name: sample_units, type: integer, source: input, description: "Observed units in the sample (>= 0)" }
      - { name: market_outlets, type: integer, source: input, description: "Total outlets in the geography (>= 1)" }
      - { name: sampled_outlets, type: integer, source: input, description: "Outlets contributing sample data (>= 1)" }
      - { name: market_population, type: integer, source: input, description: "Total geography population (>= 1)" }
      - { name: sampled_population, type: integer, source: input, description: "Population covered by sampled outlets (>= 1)" }
      - { name: specialty_uptake_index, type: number, source: input, description: "Specialty uptake multiplier for density variant (> 0)" }
      - { name: supplier_ids, type: array, source: input, description: "DataSupplier ids whose outlets compose sampled_outlets; drives coverage-change restatement" }
      - { name: estimate_units, type: integer, source: computed, description: "Projected market estimate per calc_market_projection; null until first recompute", constraints: "nullable" }
      - { name: restatement_delta_units, type: integer, source: computed, description: "Signed delta new estimate minus previous estimate at recompute; null on first recompute", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: CURRENT, description: "CURRENT | PENDING_RESTATEMENT", constraints: "CURRENT, PENDING_RESTATEMENT" }

  - name: ReportProduct
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> ManufacturerClient.id; licensee" }
      - { name: methodology_id, type: string, source: input, description: "FK -> ProjectionMethodology.id; pinned projection source" }
      - { name: name, type: string, source: input, description: "Product label" }
      - { name: prescriber_ids, type: array, source: input, description: "Licensed prescriber panel (Prescriber ids) for provider-level rows" }
      - { name: base_fee_cents, type: integer, source: input, description: "Flat fee per compiled delivery" }
      - { name: cell_fee_base_cents, type: integer, source: input, description: "Per-cell fee base before multiplier" }
      - { name: cell_fee_multiplier, type: number, source: input, description: "Per-cell fee multiplier" }
      - { name: volume_discount_pct, type: number, source: input, description: "Flat discount fraction applied to delivery fee subtotal, 0..1" }
      - { name: support_fee_pct, type: number, source: input, default: 0.08, description: "Support fee fraction of cell fees for invoices; default 0.08" }
      - { name: monthly_license_fee_cents, type: integer, source: input, description: "Monthly license fee; SLA credit base" }
      - { name: deliverable_prescriber_count, type: integer, source: computed, description: "= |prescriber_ids| minus those with an ACTIVE opt-out (calc_deliverable_prescriber_count)" }
      - { name: pinned_methodology_version, type: integer, source: computed, description: "Methodology version at creation or last sync-methodology; compile requires equality with methodology.version" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED (suspended when owning client is suspended)", constraints: "ACTIVE, SUSPENDED" }

  - name: ReportDeliveryPeriod
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> ReportProduct.id" }
      - { name: period_code, type: string, source: input, description: "Delivery period, format YYYY-MM" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; deliveries of this period may compile only when current logical date >= period_end_date" }
      - { name: total_due_deliveries, type: integer, source: input, description: "Contracted delivery count for the period (>= 1)" }
      - { name: breach_count, type: integer, source: computed, description: "Count of this period's deliveries in RECALLED status at close time" }
      - { name: sla_variant, type: enum, source: system, description: "PERIOD_WEIGHTED | DELIVERY_WEIGHTED; recorded at close", constraints: "nullable; PERIOD_WEIGHTED, DELIVERY_WEIGHTED" }
      - { name: sla_credit_cents, type: integer, source: computed, description: "SLA service credit per calc_sla_credit; null until CLOSED", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED", constraints: "OPEN, CLOSED" }

  - name: ReportDelivery
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: system, description: "FK -> ReportDeliveryPeriod.id; set from path at creation" }
      - { name: period_code, type: string, source: system, description: "Copied from parent period at creation" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPILED | RELEASED | RECALLED | REISSUED", constraints: "SCHEDULED, COMPILED, RELEASED, RECALLED, REISSUED" }
      - { name: compiled_cell_ids, type: array, source: computed, description: "ProjectionCell ids compiled into this delivery" }
      - { name: included_prescriber_ids, type: array, source: computed, description: "Prescriber ids whose rows appear in this delivery after opt-out and jurisdiction filtering" }
      - { name: fee_cents, type: integer, source: computed, description: "Delivery fee per calc_delivery_fee; null until compiled", constraints: "nullable" }
      - { name: recall_count, type: integer, source: computed, default: 0, description: "Increments on every recall (explicit or cascaded)" }
      - { name: must_recompile, type: boolean, source: computed, default: false, description: "true after any recall; cleared by reissue" }

  - name: ClientAuditEvent
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ManufacturerClient.id; set from path at creation" }
      - { name: window_start_date, type: string, source: input, description: "ISO date; inclusive start of the on-site audit window" }
      - { name: window_end_date, type: string, source: input, description: "ISO date; exclusive end of the on-site audit window; must be > window_start_date" }
      - { name: purpose, type: enum, source: input, description: "AUDIT_COMPLIANCE | REIDENTIFICATION; REIDENTIFICATION is always refused", constraints: "AUDIT_COMPLIANCE, REIDENTIFICATION" }
      - { name: outcome, type: enum, source: system, description: "CLEAN | REIDENTIFICATION_ATTEMPTED; set at complete", constraints: "nullable; CLEAN, REIDENTIFICATION_ATTEMPTED" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | SCHEDULED | COMPLETED | CANCELLED", constraints: "REQUESTED, SCHEDULED, COMPLETED, CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ManufacturerClient
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /audit-events/{id}/complete with outcome REIDENTIFICATION_ATTEMPTED (cascade)"
        actor: system
        preconditions:
          - "Completed audit event's client_id == this client"
        side_effects:
          - "Every ReportProduct of this client in ACTIVE status transitions to SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Client status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Every ReportProduct of this client in SUSPENDED status transitions to ACTIVE"

  - entity: DataSupplier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /suppliers/{id}/suspend"
        actor: DataAcquisitionManager
        preconditions:
          - "Supplier status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Every DataAcquisitionAgreement of this supplier in ACTIVE status transitions to SUSPENDED (which fires that transition's own cascade: batches quarantined -> cells PENDING_RESTATEMENT -> deliveries RECALLED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /suppliers/{id}/resume"
        actor: DataAcquisitionManager
        preconditions:
          - "Supplier status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Every DataAcquisitionAgreement of this supplier in SUSPENDED status transitions to ACTIVE (which fires that transition's resume cascade)"

  - entity: DataAcquisitionAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /data-acquisition-agreements/{id}/activate"
        actor: DataAcquisitionManager
        preconditions:
          - "Agreement status == DRAFT (ERR_INVALID_STATE)"
          - "Supplier status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /data-acquisition-agreements/{id}/suspend or supplier suspension cascade"
        actor: DataAcquisitionManager
        preconditions:
          - "Agreement status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Link 1: every DataFeedBatch of this agreement in VALIDATED or DEIDENTIFIED status transitions to QUARANTINED and its deidentification_profile_id is cleared to null"
          - "Link 2: each such quarantine marks every ProjectionCell (status CURRENT, cell.period_code == batch.period_code, batch agreement's supplier_id in cell.supplier_ids) PENDING_RESTATEMENT"
          - "Link 3: each such cell transition RECALLs every ReportDelivery (status COMPILED or RELEASED) whose compiled_cell_ids contains the cell: status -> RECALLED, recall_count += 1, must_recompile = true, and the owning ManufacturerClient.entitlement_cells_balance is credited back len(delivery.compiled_cell_ids)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /data-acquisition-agreements/{id}/resume or supplier resume cascade"
        actor: DataAcquisitionManager
        preconditions:
          - "Agreement status == SUSPENDED (ERR_INVALID_STATE)"
          - "Supplier status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Every DataFeedBatch of this agreement in QUARANTINED status transitions back to VALIDATED (de-identification must be redone)"
          - "ProjectionCells remain PENDING_RESTATEMENT until recomputed"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /data-acquisition-agreements/{id}/terminate"
        actor: DataAcquisitionManager
        preconditions:
          - "Agreement status in {DRAFT, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects:
          - "Same batch-quarantine -> cell-restatement -> delivery-recall cascade as ACTIVE->SUSPENDED when terminating from ACTIVE; batches already QUARANTINED stay QUARANTINED permanently"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /data-acquisition-agreements/{id}/terminate"
        actor: DataAcquisitionManager
        preconditions:
          - "Agreement status in {DRAFT, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects:
          - "Same three-link cascade as ACTIVE->SUSPENDED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /data-acquisition-agreements/{id}/terminate"
        actor: DataAcquisitionManager
        preconditions:
          - "Agreement status in {DRAFT, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: DataFeedBatch
    initial_state: RECEIVED
    terminal_states: [ACCEPTED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /data-feed-batches/{id}/validate"
        actor: DataAcquisitionManager
        preconditions:
          - "Batch status == RECEIVED (ERR_BATCH_INVALID_STATE)"
          - "Agreement status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: VALIDATED
        to: DEIDENTIFIED
        trigger: "POST /data-feed-batches/{id}/deidentify"
        actor: PrivacyOfficer
        preconditions:
          - "Batch status == VALIDATED (ERR_BATCH_INVALID_STATE)"
          - "Agreement status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "deidentification_profile_id references an existing profile (ERR_NOT_FOUND)"
        side_effects:
          - "deidentification_profile_id set from payload"
      - from: DEIDENTIFIED
        to: ACCEPTED
        trigger: "POST /data-feed-batches/{id}/accept"
        actor: PrivacyOfficer
        preconditions:
          - "Batch status == DEIDENTIFIED (ERR_BATCH_INVALID_STATE)"
          - "deid_qa_score >= 0.90 (ERR_DEID_QA_BELOW_THRESHOLD)"
          - "agreement.royalty_spent_cents + computed royalty_cents <= agreement.royalty_budget_cents (ERR_ROYALTY_BUDGET_EXHAUSTED)"
        side_effects:
          - "deid_qa_score recorded; royalty_cents computed via calc_acquisition_royalty"
          - "agreement.royalty_spent_cents += royalty_cents"
      - from: VALIDATED
        to: REJECTED
        trigger: "POST /data-feed-batches/{id}/reject"
        actor: PrivacyOfficer
        preconditions:
          - "Batch status in {VALIDATED, DEIDENTIFIED} (ERR_BATCH_INVALID_STATE)"
        side_effects: []
      - from: DEIDENTIFIED
        to: REJECTED
        trigger: "POST /data-feed-batches/{id}/reject"
        actor: PrivacyOfficer
        preconditions:
          - "Batch status in {VALIDATED, DEIDENTIFIED} (ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "deidentification_profile_id cleared to null"
      - from: REJECTED
        to: REPROCESSED
        trigger: "POST /data-feed-batches/{id}/reprocess"
        actor: SupplierOperator
        preconditions:
          - "Batch status == REJECTED (ERR_BATCH_INVALID_STATE)"
          - "Acting SupplierOperator owns the agreement's supplier (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: REPROCESSED
        to: VALIDATED
        trigger: "POST /data-feed-batches/{id}/validate"
        actor: DataAcquisitionManager
        preconditions:
          - "Batch status in {RECEIVED, REPROCESSED} (ERR_BATCH_INVALID_STATE)"
          - "Agreement status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: VALIDATED
        to: QUARANTINED
        trigger: "Agreement suspension/termination cascade"
        actor: system
        preconditions:
          - "Batch status in {VALIDATED, DEIDENTIFIED}"
        side_effects:
          - "deidentification_profile_id cleared to null"
          - "Marks matching ProjectionCells PENDING_RESTATEMENT (see agreement suspend link 2)"
      - from: DEIDENTIFIED
        to: QUARANTINED
        trigger: "Agreement suspension/termination cascade"
        actor: system
        preconditions:
          - "Batch status in {VALIDATED, DEIDENTIFIED}"
        side_effects:
          - "deidentification_profile_id cleared to null"
          - "Marks matching ProjectionCells PENDING_RESTATEMENT (see agreement suspend link 2)"
      - from: QUARANTINED
        to: VALIDATED
        trigger: "Agreement resume cascade"
        actor: system
        preconditions:
          - "Batch status == QUARANTINED"
        side_effects: []

  - entity: Prescriber
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /prescribers/{id}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "Prescriber status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /prescribers/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "Prescriber status == INACTIVE (ERR_INVALID_STATE)"
        side_effects: []

  - entity: PrescriberOptOut
    initial_state: SUBMITTED
    terminal_states: [REJECTED, LIFTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /prescriber-opt-outs/{id}/verify"
        actor: PrivacyOfficer
        preconditions:
          - "Opt-out status == SUBMITTED (ERR_OPT_OUT_INVALID_STATE)"
          - "Prescriber status == ACTIVE (ERR_PRESCRIBER_NOT_ACTIVE)"
        side_effects: []
      - from: VERIFIED
        to: ACTIVE
        trigger: "POST /prescriber-opt-outs/{id}/activate"
        actor: PrivacyOfficer
        preconditions:
          - "Opt-out status == VERIFIED (ERR_OPT_OUT_INVALID_STATE)"
          - "Prescriber status == ACTIVE (ERR_PRESCRIBER_NOT_ACTIVE)"
        side_effects:
          - "Link 1: every ReportProduct in ACTIVE status whose prescriber_ids contains this prescriber has deliverable_prescriber_count decremented by 1"
          - "Link 2: for each ReportProduct mutated in link 1, every ReportDelivery of that product in COMPILED status whose included_prescriber_ids contains this prescriber transitions to RECALLED (recall_count += 1, must_recompile = true, client entitlement credited back len(compiled_cell_ids))"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /prescriber-opt-outs/{id}/reject"
        actor: PrivacyOfficer
        preconditions:
          - "Opt-out status in {SUBMITTED, VERIFIED} (ERR_OPT_OUT_INVALID_STATE)"
        side_effects: []
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /prescriber-opt-outs/{id}/reject"
        actor: PrivacyOfficer
        preconditions:
          - "Opt-out status in {SUBMITTED, VERIFIED} (ERR_OPT_OUT_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /prescriber-opt-outs/{id}/lift"
        actor: PrivacyOfficer
        preconditions:
          - "Opt-out status == ACTIVE (ERR_OPT_OUT_INVALID_STATE)"
        side_effects:
          - "Every ReportProduct whose prescriber_ids contains this prescriber has deliverable_prescriber_count incremented by 1 (compensation of the activate decrement)"

  - entity: ProjectionCell
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: PENDING_RESTATEMENT
        trigger: "POST /projection-methodologies/{id}/restate, or agreement suspension/termination cascade"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Every COMPILED or RELEASED ReportDelivery whose compiled_cell_ids contains this cell transitions to RECALLED (recall_count += 1, must_recompile = true, entitlement credited back)"
      - from: PENDING_RESTATEMENT
        to: CURRENT
        trigger: "POST /projection-cells/{id}/recompute"
        actor: PlatformAdmin
        preconditions:
          - "Cell status in {CURRENT, PENDING_RESTATEMENT} (ERR_INVALID_STATE)"
        side_effects:
          - "estimate_units recomputed via calc_market_projection; restatement_delta_units = new estimate - previous estimate (null when no previous estimate)"
      - from: CURRENT
        to: CURRENT
        trigger: "POST /projection-cells/{id}/recompute"
        actor: PlatformAdmin
        preconditions:
          - "Cell status in {CURRENT, PENDING_RESTATEMENT} (ERR_INVALID_STATE)"
        side_effects:
          - "estimate_units recomputed via calc_market_projection; restatement_delta_units updated"

  - entity: ReportProduct
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "Client suspension cascade (audit outcome REIDENTIFICATION_ATTEMPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{id}/reinstate cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReportDeliveryPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /report-delivery-periods/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "Period status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "breach_count = count of this period's deliveries in RECALLED status at close time"
          - "sla_credit_cents computed via calc_sla_credit with the payload sla_variant; sla_variant recorded"

  - entity: ReportDelivery
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: COMPILED
        trigger: "POST /report-deliveries/{id}/compile"
        actor: PlatformAdmin
        preconditions:
          - "Delivery status == SCHEDULED (ERR_DELIVERY_INVALID_STATE)"
          - "Product status == ACTIVE and client status == ACTIVE (ERR_CLIENT_SUSPENDED)"
          - "Any include_prescriber_ids entry with an ACTIVE opt-out -> ERR_PRESCRIBER_OPT_OUT_VIOLATION"
          - "Any include_prescriber_ids entry whose state has an effective restrictive JurisdictionRule -> ERR_JURISDICTION_RESTRICTED"
          - "Current logical date >= parent period.period_end_date (ERR_DELIVERY_WINDOW_MISSED)"
          - "product.pinned_methodology_version == methodology.version (ERR_PRODUCT_VERSION_STALE)"
          - "At least one ProjectionCell of the product's methodology with status CURRENT and period_code == delivery.period_code (ERR_NO_DELIVERABLE_CELLS)"
          - "client.entitlement_cells_balance >= number of compiled cells (ERR_INSUFFICIENT_ENTITLEMENT)"
        side_effects:
          - "compiled_cell_ids = matching cells (sorted by geography_code ASC, specialty ASC, created_at ASC); included_prescriber_ids = product.prescriber_ids minus ACTIVE opt-outs minus jurisdiction-restricted (or exactly include_prescriber_ids when supplied and valid)"
          - "fee_cents computed via calc_delivery_fee"
          - "client.entitlement_cells_balance -= len(compiled_cell_ids)"
      - from: COMPILED
        to: RELEASED
        trigger: "POST /report-deliveries/{id}/release"
        actor: PlatformAdmin
        preconditions:
          - "Delivery status in {COMPILED, REISSUED} (ERR_DELIVERY_INVALID_STATE)"
          - "must_recompile == false (ERR_DELIVERY_INVALID_STATE)"
        side_effects: []
      - from: REISSUED
        to: RELEASED
        trigger: "POST /report-deliveries/{id}/release"
        actor: PlatformAdmin
        preconditions:
          - "Delivery status in {COMPILED, REISSUED} (ERR_DELIVERY_INVALID_STATE)"
          - "must_recompile == false (ERR_DELIVERY_INVALID_STATE)"
        side_effects: []
      - from: COMPILED
        to: RECALLED
        trigger: "POST /report-deliveries/{id}/recall, or opt-out activation cascade, or cell restatement cascade"
        actor: PlatformAdmin
        preconditions:
          - "Delivery status in {COMPILED, RELEASED, REISSUED} (ERR_DELIVERY_INVALID_STATE)"
        side_effects:
          - "recall_count += 1; must_recompile = true"
          - "client.entitlement_cells_balance += len(compiled_cell_ids); compiled_cell_ids retained for the credit then cleared to []"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /report-deliveries/{id}/recall, or cascade"
        actor: PlatformAdmin
        preconditions:
          - "Delivery status in {COMPILED, RELEASED, REISSUED} (ERR_DELIVERY_INVALID_STATE)"
        side_effects:
          - "recall_count += 1; must_recompile = true; entitlement credited back len(compiled_cell_ids); compiled_cell_ids cleared to []"
      - from: REISSUED
        to: RECALLED
        trigger: "POST /report-deliveries/{id}/recall, or cascade"
        actor: PlatformAdmin
        preconditions:
          - "Delivery status in {COMPILED, RELEASED, REISSUED} (ERR_DELIVERY_INVALID_STATE)"
        side_effects:
          - "recall_count += 1; must_recompile = true; entitlement credited back len(compiled_cell_ids); compiled_cell_ids cleared to []"
      - from: RECALLED
        to: REISSUED
        trigger: "POST /report-deliveries/{id}/reissue"
        actor: PlatformAdmin
        preconditions:
          - "Delivery status == RECALLED (ERR_DELIVERY_INVALID_STATE)"
          - "Same safety / temporal / referential / fiscal checks as compile (opt-out, jurisdiction, window, version, non-empty cells, entitlement)"
        side_effects:
          - "compiled_cell_ids and included_prescriber_ids recomputed as in compile; fee_cents recomputed; must_recompile = false"
          - "client.entitlement_cells_balance -= len(new compiled_cell_ids)"

  - entity: ClientAuditEvent
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /audit-events/{id}/schedule"
        actor: PlatformAdmin
        preconditions:
          - "Audit status == REQUESTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /audit-events/{id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "Audit status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "outcome recorded"
          - "If outcome == REIDENTIFICATION_ATTEMPTED: client transitions ACTIVE -> SUSPENDED and every ACTIVE ReportProduct of the client transitions to SUSPENDED"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /audit-events/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "Audit status in {REQUESTED, SCHEDULED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /audit-events/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "Audit status in {REQUESTED, SCHEDULED} (ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: methodology-restate-stale-version
    parent_entity: ProjectionMethodology
    write_endpoint: "POST /projection-methodologies/{id}/restate"
    occ_field: "expected_methodology_version"
    description: |
      Restating a ProjectionMethodology whose version has advanced since the
      client last observed it is rejected: a prior restate already bumped the
      version and marked cells PENDING_RESTATEMENT, so the caller's view of the
      methodology is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-amend-stale-version
    parent_entity: DataAcquisitionAgreement
    write_endpoint: "POST /data-acquisition-agreements/{id}/amendments"
    occ_field: "expected_agreement_version"
    description: |
      Amending a DataAcquisitionAgreement whose version has advanced since the
      client last observed it is rejected: an intervening activate/suspend/
      resume/amend already legitimately changed the agreement, so the caller's
      amendment base is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_market_projection
    trigger: "POST /projection-cells/{id}/recompute"
    algorithm: forward_looking
    formula: |
      Inputs: U = cell.sample_units, MO = cell.market_outlets, SO = cell.sampled_outlets,
              MP = cell.market_population, SP = cell.sampled_population, K = cell.specialty_uptake_index.
      variant PROJECTION_WEIGHTED: estimate_units = round_half_up(U * MO / SO)
      variant PROJECTION_DENSITY:  estimate_units = round_half_up(U * (MP / SP) * K)
      restatement_delta_units = new estimate_units - previous estimate_units (null if no previous).
      The payload projection_variant overrides methodology.default_variant for this recompute.
    input_set: "The single ProjectionCell being recomputed; no other cells participate."
    constants:
      ROUNDING: round_half_up
    precision: "integer units, round_half_up"
    variants:
      - name: PROJECTION_WEIGHTED
        when: "Outlet-coverage extrapolation"
        difference: "Scales by market_outlets / sampled_outlets"
      - name: PROJECTION_DENSITY
        when: "Population-density extrapolation"
        difference: "Scales by (market_population / sampled_population) * specialty_uptake_index"

  - name: calc_acquisition_royalty
    trigger: "POST /data-feed-batches/{id}/accept"
    algorithm: tiered_pricing
    formula: |
      N = batch.record_count.
      Marginal tiers (cents per record):
        records 1..10000      -> 0
        records 10001..50000  -> 3
        records 50001..       -> 5
      R0 = 0 * min(N, 10000) + 3 * max(0, min(N, 50000) - 10000) + 5 * max(0, N - 50000)
      R1 = R0 * TYPE_MULTIPLIER(agreement.supplier.supplier_type)
      royalty_cents = round_half_up(R1 * (1 + QA_BONUS)) if batch.deid_qa_score >= QA_BONUS_THRESHOLD
                      else round_half_up(R1)
    input_set: "The batch being accepted plus its agreement's supplier type."
    constants:
      TIER1_MAX: 10000
      TIER2_MAX: 50000
      TIER2_RATE_CENTS: 3
      TIER3_RATE_CENTS: 5
      QA_BONUS_THRESHOLD: 0.98
      QA_BONUS: 0.10
      MULT_PHARMACY: 1.0
      MULT_DISTRIBUTOR: 0.6
      MULT_CLAIM_PROCESSOR: 0.8
    precision: "integer cents, round_half_up applied once at the end"

  - name: calc_delivery_fee
    trigger: "POST /report-deliveries/{id}/compile and POST /report-deliveries/{id}/reissue"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (round per cell first, then sum, then discount):
      per_cell_cents = round_half_up(product.cell_fee_base_cents * product.cell_fee_multiplier)  # per cell
      cells_fee_cents = sum(per_cell_cents over compiled_cell_ids)
      subtotal_cents = product.base_fee_cents + cells_fee_cents
      fee_cents = round_half_up(subtotal_cents * (1 - product.volume_discount_pct))
      (Sum-then-round is NOT used: with base 1235 and multiplier 1.5, per-cell-first yields
      1853 per cell while sum-then-round would yield 1852.5*N rounded once — the orders differ.)
    input_set: "ProjectionCells selected into compiled_cell_ids (status CURRENT, methodology == product.methodology_id, period_code == delivery.period_code)."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents"

  - name: calc_invoice_total
    trigger: "POST /report-products/{id}/invoice-preview"
    algorithm: aggregation
    formula: |
      PINNED EVALUATION ORDER (discount tier depends on gross, gross depends on support fee):
      1. cell_fees_cents = sum over CURRENT cells of product.methodology with period_code == payload period_code
                           of round_half_up(product.cell_fee_base_cents * product.cell_fee_multiplier)
      2. support_fee_cents = round_half_up(cell_fees_cents * product.support_fee_pct)
      3. gross_cents = cell_fees_cents + support_fee_cents
      4. discount_pct = 0.00 if gross_cents < INVOICE_TIER1_MIN
                        0.05 if INVOICE_TIER1_MIN <= gross_cents < INVOICE_TIER2_MIN
                        0.10 if gross_cents >= INVOICE_TIER2_MIN
      5. total_cents = round_half_up(gross_cents * (1 - discount_pct))
    input_set: "CURRENT ProjectionCells of the product's methodology for the given period."
    constants:
      INVOICE_TIER1_MIN: 20000
      INVOICE_TIER2_MIN: 50000
    precision: "integer cents, round_half_up"

  - name: calc_sla_credit
    trigger: "POST /report-delivery-periods/{id}/close"
    algorithm: threshold
    formula: |
      fee = product.monthly_license_fee_cents
      breach_count = count of this period's deliveries whose status is RECALLED at close time
      variant PERIOD_WEIGHTED:   credit = round_half_up(min(fee * 0.05 * breach_count, fee * 0.25))
      variant DELIVERY_WEIGHTED: credit = round_half_up(min(fee * breach_count / period.total_due_deliveries, fee * 0.25))
    input_set: "ReportDeliveries of the period with status RECALLED at close time only."
    constants:
      PER_BREACH_RATE: 0.05
      CREDIT_CAP_RATE: 0.25
    precision: "integer cents, round_half_up"
    variants:
      - name: PERIOD_WEIGHTED
        when: "Credit scales with breach count at a flat per-breach rate"
        difference: "fee * 0.05 per breached delivery, capped at 25% of fee"
      - name: DELIVERY_WEIGHTED
        when: "Credit scales with the breached share of due deliveries"
        difference: "fee * (breach_count / total_due_deliveries), capped at 25% of fee"

  - name: calc_deliverable_prescriber_count
    trigger: "Product creation; opt-out activate; opt-out lift"
    algorithm: aggregation
    formula: |
      deliverable_prescriber_count = |product.prescriber_ids| - |{ p in product.prescriber_ids : p has a PrescriberOptOut in ACTIVE status }|
    input_set: "Prescribers in product.prescriber_ids; opt-outs with status ACTIVE only (SUBMITTED/VERIFIED/REJECTED/LIFTED do not restrict)."
    constants: {}
    precision: "integer count"

  - name: calc_entitlement_balance
    trigger: "Delivery compile (debit), recall (credit), reissue (debit)"
    algorithm: aggregation
    formula: |
      client.entitlement_cells_balance starts at client.entitlement_cells_total.
      compile: balance -= len(compiled_cell_ids)
      recall:  balance += len(compiled_cell_ids)   (exactly reversing that delivery's compile debit)
      reissue: balance -= len(new compiled_cell_ids)
      Invariant: compile followed by recall of the same delivery leaves balance unchanged.
    input_set: "The single delivery being compiled/recalled/reissued."
    constants: {}
    precision: "integer cells"

  - name: calc_audit_cooldown
    trigger: "POST /clients/{id}/audit-requests"
    algorithm: interval_merge
    formula: |
      Let prev = the COMPLETED ClientAuditEvent of this client with the greatest window_end_date
      (ties broken by created_at ASC, take the latest created_at).
      If prev exists: require (window_start_date - prev.window_end_date) >= 30 days, else ERR_AUDIT_COOLDOWN_ACTIVE.
      Also reject when the new window overlaps any REQUESTED or SCHEDULED audit of this client
      (half-open overlap: new_start < existing_end AND existing_start < new_end) -> ERR_AUDIT_COOLDOWN_ACTIVE.
    input_set: "COMPLETED audits of this client (for cooldown) and REQUESTED/SCHEDULED audits (for overlap)."
    constants:
      COOLDOWN_DAYS: 30
    precision: "whole days; exactly 30 days passes (>=)"

  - name: calc_agreement_window_overlap
    trigger: "POST /suppliers/{id}/agreements"
    algorithm: interval_merge
    formula: |
      For the same supplier and same data_domain, consider existing agreements with
      status in {DRAFT, ACTIVE, SUSPENDED} (TERMINATED excluded).
      Half-open overlap: new_start < existing_end AND existing_start < new_end -> ERR_AGREEMENT_WINDOW_OVERLAP.
      Adjacency is allowed: new_start == existing_end does NOT overlap.
    input_set: "Existing non-TERMINATED agreements of the same supplier with the same data_domain."
    constants: {}
    precision: "whole days, half-open [start, end)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: SupplierOperator may act only on batches of own supplier's agreements; ManufacturerClient may act only on own client record, products, deliveries, audit requests"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /data-feed-batches, POST /data-feed-batches/{id}/reprocess, POST /clients/{id}/audit-requests, GET /clients/{id}"
  - priority: 4
    category: existence
    check: "Every id in path and every FK in body resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Request body schema: required fields present, types valid, enum values in declared sets, integers in declared ranges (record_count >= 1, sampled_outlets >= 1, market_outlets >= 1, market_population >= 1, sampled_population >= 1, specialty_uptake_index > 0, entitlement_cells_total >= 0, total_due_deliveries >= 1, window_end_date > window_start_date)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /projection-methodologies/{id}/restate, POST /data-acquisition-agreements/{id}/amendments"
  - priority: 7
    category: state
    check: "Target entity is in a state from which the requested transition exists (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "supplier/agreement/prescriber/period/audit/client transitions without a domain-specific state error"
  - priority: 8
    category: state
    check: "Agreement status == ACTIVE where required (batch create/validate/deidentify, agreement activate/resume supplier check)"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /data-feed-batches, POST /data-feed-batches/{id}/validate, POST /data-feed-batches/{id}/deidentify, POST /data-acquisition-agreements/{id}/activate, POST /data-acquisition-agreements/{id}/resume"
  - priority: 9
    category: state
    check: "Batch status permits the requested transition"
    error_id: ERR_BATCH_INVALID_STATE
    http_status: 409
    applies_to: "POST /data-feed-batches/{id}/validate, /deidentify, /accept, /reject, /reprocess"
  - priority: 10
    category: state
    check: "Opt-out status permits the requested transition"
    error_id: ERR_OPT_OUT_INVALID_STATE
    http_status: 409
    applies_to: "POST /prescriber-opt-outs/{id}/verify, /activate, /reject, /lift"
  - priority: 11
    category: state
    check: "Delivery status permits the requested transition"
    error_id: ERR_DELIVERY_INVALID_STATE
    http_status: 409
    applies_to: "POST /report-deliveries/{id}/compile, /release, /recall, /reissue"
  - priority: 12
    category: state
    check: "Prescriber status == ACTIVE where required (opt-out create/verify/activate)"
    error_id: ERR_PRESCRIBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /prescribers/{id}/opt-outs, POST /prescriber-opt-outs/{id}/verify, POST /prescriber-opt-outs/{id}/activate"
  - priority: 13
    category: state
    check: "Client status == ACTIVE and product status == ACTIVE for licensing operations"
    error_id: ERR_CLIENT_SUSPENDED
    http_status: 409
    applies_to: "POST /clients/{id}/audit-requests, POST /report-deliveries/{id}/compile, POST /report-deliveries/{id}/reissue"
  - priority: 14
    category: business_safety
    check: "Audit request purpose != REIDENTIFICATION (re-identification of de-identified data is prohibited)"
    error_id: ERR_REIDENTIFICATION_PROHIBITED
    http_status: 403
    applies_to: "POST /clients/{id}/audit-requests"
  - priority: 15
    category: business_safety
    check: "No include_prescriber_ids entry has an ACTIVE prescriber opt-out"
    error_id: ERR_PRESCRIBER_OPT_OUT_VIOLATION
    http_status: 422
    applies_to: "POST /report-deliveries/{id}/compile, POST /report-deliveries/{id}/reissue"
  - priority: 16
    category: business_safety
    check: "No include_prescriber_ids entry practices in a state with an effective JurisdictionRule where restrict_prescriber_identifiable == true (effective: effective_from <= current logical date < effective_to, effective_to null = open)"
    error_id: ERR_JURISDICTION_RESTRICTED
    http_status: 422
    applies_to: "POST /report-deliveries/{id}/compile, POST /report-deliveries/{id}/reissue"
  - priority: 17
    category: business_safety
    check: "deid_qa_score >= 0.90 on batch accept (de-identification quality floor)"
    error_id: ERR_DEID_QA_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /data-feed-batches/{id}/accept"
  - priority: 18
    category: business_temporal
    check: "Agreement exclusivity window does not overlap a non-TERMINATED agreement of the same supplier and data_domain (half-open [start, end))"
    error_id: ERR_AGREEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /suppliers/{id}/agreements, POST /data-acquisition-agreements/{id}/amendments"
  - priority: 19
    category: business_temporal
    check: "Current logical date >= parent period.period_end_date when compiling or reissuing"
    error_id: ERR_DELIVERY_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /report-deliveries/{id}/compile, POST /report-deliveries/{id}/reissue"
  - priority: 20
    category: business_temporal
    check: "New audit window starts >= 30 days after the latest COMPLETED audit's window_end_date and does not overlap any REQUESTED/SCHEDULED audit of the client"
    error_id: ERR_AUDIT_COOLDOWN_ACTIVE
    http_status: 422
    applies_to: "POST /clients/{id}/audit-requests"
  - priority: 21
    category: business_referential
    check: "product.pinned_methodology_version == methodology.version"
    error_id: ERR_PRODUCT_VERSION_STALE
    http_status: 409
    applies_to: "POST /report-deliveries/{id}/compile, POST /report-deliveries/{id}/reissue"
  - priority: 22
    category: business_referential
    check: "At least one CURRENT ProjectionCell of the product's methodology matches the delivery period"
    error_id: ERR_NO_DELIVERABLE_CELLS
    http_status: 422
    applies_to: "POST /report-deliveries/{id}/compile, POST /report-deliveries/{id}/reissue"
  - priority: 23
    category: business_referential
    check: "No other opt-out for the same prescriber in SUBMITTED, VERIFIED or ACTIVE status"
    error_id: ERR_DUPLICATE_OPT_OUT
    http_status: 409
    applies_to: "POST /prescribers/{id}/opt-outs"
  - priority: 24
    category: business_fiscal
    check: "agreement.royalty_spent_cents + new royalty_cents <= agreement.royalty_budget_cents"
    error_id: ERR_ROYALTY_BUDGET_EXHAUSTED
    http_status: 402
    applies_to: "POST /data-feed-batches/{id}/accept"
  - priority: 25
    category: business_fiscal
    check: "client.entitlement_cells_balance >= number of cells to be compiled"
    error_id: ERR_INSUFFICIENT_ENTITLEMENT
    http_status: 402
    applies_to: "POST /report-deliveries/{id}/compile, POST /report-deliveries/{id}/reissue"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any set_current_utc call the clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: []

