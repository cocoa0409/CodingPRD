            - "Link 3: RefurbWorkOrder.${wo_id}.status == ABANDONED with packaging_cost_cents == 0 and total_cost_cents == 3278 (round_half_up(30 * 95 * 1.15))"
            - "Link 4: a REFURB_COST ShrinkLedgerEntry of amount_cents == -3278 exists and Client.${c_id}.settlement_balance_cents == -3278 and shrink_ledger_cents == -3278"
            - "No DONATION_WRITE_OFF, DESTRUCTION_WRITE_OFF or RECOVERY_CREDIT entry exists yet — the destruction itself has not been executed, only ordered"
            - "Client.${c_id}.status == ACTIVE because -3278 is not below -100000000"

  # ===================================================================== #
  # RULE 5 — priority_pair_validation_conflict                            #
  # Pair 1: state (24) vs business_temporal (58)                          #
  # Pair 2: business_safety (30) vs business_constraint (48)              #
  # Pair 3: business_safety (36) vs business_temporal (58)                #
  # ===================================================================== #
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_refund_state_error_beats_temporal_hold_error
        grounds:
          - validations[priority=24]
          - validations[priority=58]
          - errors[ERR_LINE_INVALID_FINANCIAL_STATE]
          - errors[ERR_REFUND_HOLD_ACTIVE]
          - calculations.refund_release_timing
        distinguishing_aspect: |
          The dual failure pits category `state` (priority 24, ERR_LINE_INVALID_FINANCIAL_STATE)
          against category `business_temporal` (priority 58, ERR_REFUND_HOLD_ACTIVE) and the
          server must answer with the state error. The other two priority_pair instances use the
          pairs business_safety vs business_constraint and business_safety vs business_temporal,
          so no pairing is repeated.
        test_recipe:
          setup:
            - "Client CLPAIR1: SL_STANDARD, restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000, refund_hold_hours 48, max_refund_exposure_cents 100000000."
            - "One received line of quantity 1 (reason DEFECTIVE) graded C: disposition LIQUIDATE, financial_state HOLD_PENDING_DISPOSITION, and its RefundRelease has release_eligible_at still null because no DispositionOrder has executed."
            - "The logical clock stays at 2026-08-01T00:00:00Z, so even once a hold instant existed it would not have elapsed."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Pair One Client", client_code: "CLPAIR1", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1010", customer_reference: "CUST-10", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-10", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_id: $.data.id }
            - call: "POST /return-lines/${line_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
          trigger:
            - call: "POST /return-lines/${line_id}/release-refund"
              payload: {}
              as: RefundAnalyst
              as_user_id: "u_analyst"
              captures: { err_id: $.data.error_id }
          assert:
            - "The response is HTTP 409 with ${err_id} == ERR_LINE_INVALID_FINANCIAL_STATE"
            - "${err_id} != ERR_REFUND_HOLD_ACTIVE — priority 24 outranks priority 58 even though both conditions hold"
            - "ReturnLine.${line_id}.financial_state is still HOLD_PENDING_DISPOSITION and released_by_user_id is null"
            - "No REFUND_DEBIT ShrinkLedgerEntry exists and Client.${c_id}.settlement_balance_cents == 0"

      - name: recall_safety_lock_beats_channel_grade_constraint
        grounds:
          - validations[priority=30]
          - validations[priority=48]
          - errors[ERR_RECALL_DISPOSITION_LOCKED]
          - errors[ERR_CHANNEL_GRADE_NOT_ACCEPTED]
          - entities.CatalogItem.fields.recall_status
        distinguishing_aspect: |
          The dual failure pits category `business_safety` (priority 30,
          ERR_RECALL_DISPOSITION_LOCKED) against category `business_constraint` (priority 48,
          ERR_CHANNEL_GRADE_NOT_ACCEPTED): the request asks to LIQUIDATE a mandatory-recall line
          through a channel that accepts only grade A while the line is grade C, and the safety
          lock must answer. This pairing appears in no other priority_pair instance.
        test_recipe:
          setup:
            - "Client CLPAIR2: SL_STANDARD, restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000, max_refund_exposure_cents 100000000."
            - "CatalogItem RECALL-2 starts at recall_status NONE and hazard_class NONE so the line can be graded C without quarantine; disposition after grading is LIQUIDATE."
            - "A CenterAdmin then recalls the SKU as MANDATORY, which force-dispositions the line to DESTROY and locks it."
            - "Channel AUCX is ACTIVE, hazard_certified and recall_certified true, min_lot_value_cents 0, capacity 5, but its accepted_grades is exactly ['A'] — so the grade constraint is violated too."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Pair Two Client", client_code: "CLPAIR2", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "RECALL-2", description: "Widget later recalled", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Grade A Only Auction", channel_code: "AUCX", channel_type: "AUCTION", accepted_grades: ["A"], fee_pct: 0.12, hazard_certified: true, recall_certified: true, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1011", customer_reference: "CUST-11", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-11", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_id: $.data.id }
            - call: "POST /return-lines/${line_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
            - call: "POST /catalog-items/${item_id}/recall"
              payload: { recall_status: "MANDATORY" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "GET /return-lines/${line_id}"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { line_ver: $.data.version }
          trigger:
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line_id}", expected_return_line_version: "${line_ver}", channel_id: "${ch_id}", disposition: "LIQUIDATE", quantity: 1, channel_window_start_at: "2026-08-02T08:00:00Z", channel_window_end_at: "2026-08-02T12:00:00Z" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { err_id: $.data.error_id }
          assert:
            - "After the recall, ReturnLine.${line_id}.disposition == DESTROY and condition_grade == C"
            - "The response is HTTP 409 with ${err_id} == ERR_RECALL_DISPOSITION_LOCKED"
            - "${err_id} != ERR_CHANNEL_GRADE_NOT_ACCEPTED and != ERR_DISPOSITION_DRIFT — priority 30 outranks both 48 and 49"
            - "GET /disposition-orders filtered by return_line_id ${line_id} returns zero rows: nothing was created"
            - "ReturnLine.${line_id}.version is unchanged by the rejected request"

      - name: segregation_of_duties_beats_refund_hold_window
        grounds:
          - validations[priority=36]
          - validations[priority=58]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_REFUND_HOLD_ACTIVE]
          - entities.ReturnLine.fields.graded_by_user_id
          - roles.RefundAnalyst
        distinguishing_aspect: |
          The dual failure pits category `business_safety` (priority 36,
          ERR_SEGREGATION_OF_DUTIES, HTTP 403) against category `business_temporal` (priority 58,
          ERR_REFUND_HOLD_ACTIVE, HTTP 409): the same X-User-ID u_dual graded the line and then
          attempts the release while the 48-hour hold is still running, and the safety error must
          win. Its partner instance pairs business_safety with business_constraint instead, and the
          first instance pairs state with business_temporal, so all three pairs are distinct.
        test_recipe:
          setup:
            - "Client CLPAIR3: SL_STANDARD, restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000, refund_hold_hours 48, max_refund_exposure_cents 100000000."
            - "One received line graded C by X-User-ID u_dual, disposition LIQUIDATE, with its DispositionOrder created, approved and EXECUTED at the clock instant 2026-08-01T00:00:00Z, so financial_state is RELEASE_PENDING and release_eligible_at is 2026-08-03T00:00:00Z."
            - "The clock is never advanced, so the hold is still active at the moment of the trigger."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Pair Three Client", client_code: "CLPAIR3", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
