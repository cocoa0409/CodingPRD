# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Auto Parts Retail & Distribution — EXPERT band
# 9 rule_ids x >= 2 instances each (>= 18 total)
# All literals precomputed; all setup_api_calls chains executable from empty DB.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_line_pricing_retail_vs_wholesale_on_part
        grounds:
          - calculations.line_net_pricing
          - calculations.line_net_pricing.variants.counter_list_pricing
          - calculations.line_net_pricing.variants.wholesale_matrix_pricing
          - entities.OrderLine.fields.unit_merch_price_cents
        distinguishing_aspect: |
          Same Part (list 20000c, cost 9000c) priced on the OrderLine domain
          yields unit_merch_price_cents == 20000 for a RETAIL/COUNTER order but
          == 14000 for a WHOLESALE order on the JOBBER tier (discount 0.30,
          margin floor 10800 does not bind) — two valid pricing algorithms,
          different result, same input.
        test_recipe:
          setup:
            - "JOBBER tier (D0.30, CD0.10, M0.20) and LIST tier (D0.00) exist"
            - "One rebuildable caliper Part: list 20000, cost 9000, core 6000"
            - "One WHOLESALE account on JOBBER, one RETAIL account on LIST"
            - "One OPEN wholesale order and one OPEN retail order"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /price-tiers"
              payload: { name: "LIST", discount_pct: 0.00 }
              as: InventoryManager
              captures: { list_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "CAL-100", description: "Brake caliper", list_price_cents: 20000, cost_cents: 9000, core_charge_cents: 6000, is_rebuildable: true, warranty_days: 90, stockable: true, reorder_point: 1, reorder_qty: 4 }
              as: InventoryManager
              captures: { caliper_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { ws_acct_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Walk-in", account_type: "RETAIL", price_tier_id: "${list_id}" }
              as: WholesaleRep
              captures: { rt_acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${ws_acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { ws_order_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${rt_acct_id}", channel: "COUNTER" }
              as: CounterClerk
              captures: { rt_order_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${ws_order_id}", part_id: "${caliper_id}", qty: 1 }
              as: WholesaleRep
              captures: { ws_line_id: $.data.id, ws_unit_merch: $.data.unit_merch_price_cents }
            - call: "POST /order-lines"
              payload: { order_id: "${rt_order_id}", part_id: "${caliper_id}", qty: 1 }
              as: CounterClerk
              captures: { rt_line_id: $.data.id, rt_unit_merch: $.data.unit_merch_price_cents }
          assert:
            - "OrderLine.${ws_line_id}.unit_merch_price_cents == 14000"
            - "OrderLine.${rt_line_id}.unit_merch_price_cents == 20000"
            - "OrderLine.${ws_line_id}.unit_merch_price_cents != OrderLine.${rt_line_id}.unit_merch_price_cents"

      - name: dvc_warranty_refund_vs_replace_on_claim
        grounds:
          - calculations.warranty_credit
          - calculations.warranty_credit.variants.refund_resolution
          - calculations.warranty_credit.variants.replace_resolution
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - entities.WarrantyClaim.fields.credit_cents
        distinguishing_aspect: |
          On the WarrantyClaim domain (different entity from line pricing), an
          APPROVED REFUND claim on a line with unit_merch_price_cents 14000
          yields credit_cents == 14000 and relieves Account A/R, whereas an
          APPROVED REPLACE claim yields credit_cents == 0 and instead debits
          Part.on_hand_qty — same claim inputs, two divergent remedies.
        test_recipe:
          setup:
            - "Two shipped WHOLESALE caliper lines (qty1 each) exist, both invoiced so A/R is charged"
            - "Caliper Part has stock to satisfy a REPLACE issue"
            - "One claim per line, each escalated to UNDER_REVIEW within warranty window"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "CAL-200", description: "Brake caliper", list_price_cents: 20000, cost_cents: 9000, core_charge_cents: 6000, is_rebuildable: true, warranty_days: 365, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { caliper_id: $.data.id }
            - call: "POST /parts/${caliper_id}/receive-stock"
              payload: { qty: 10 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { ws_acct_id: $.data.id }
            # ---- order A: REFUND claim ----
            - call: "POST /sales-orders"
              payload: { account_id: "${ws_acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { ord_a: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ord_a}", part_id: "${caliper_id}", qty: 1 }
              as: WholesaleRep
              captures: { line_a: $.data.id }
            - call: "GET /sales-orders/${ord_a}"
              as: WholesaleRep
              captures: { va1: $.data.version }
            - call: "POST /sales-orders/${ord_a}/allocate"
              payload: { expected_sales_order_version: "${va1}" }
              as: WholesaleRep
            - call: "GET /sales-orders/${ord_a}"
              as: WholesaleRep
              captures: { va2: $.data.version }
            - call: "POST /sales-orders/${ord_a}/ship"
              payload: { expected_sales_order_version: "${va2}" }
              as: WholesaleRep
            - call: "POST /sales-orders/${ord_a}/invoice"
              as: WholesaleRep
            - call: "POST /warranty-claims"
              payload: { order_line_id: "${line_a}", qty: 1, reason: "leaks", resolution: "REFUND" }
              as: WholesaleRep
              captures: { claim_a: $.data.id }
            - call: "POST /warranty-claims/${claim_a}/start-review"
              as: WarrantyAdmin
            # ---- order B: REPLACE claim ----
            - call: "POST /sales-orders"
              payload: { account_id: "${ws_acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { ord_b: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ord_b}", part_id: "${caliper_id}", qty: 1 }
              as: WholesaleRep
              captures: { line_b: $.data.id }
            - call: "GET /sales-orders/${ord_b}"
              as: WholesaleRep
              captures: { vb1: $.data.version }
            - call: "POST /sales-orders/${ord_b}/allocate"
              payload: { expected_sales_order_version: "${vb1}" }
              as: WholesaleRep
            - call: "GET /sales-orders/${ord_b}"
              as: WholesaleRep
              captures: { vb2: $.data.version }
            - call: "POST /sales-orders/${ord_b}/ship"
              payload: { expected_sales_order_version: "${vb2}" }
              as: WholesaleRep
            - call: "POST /sales-orders/${ord_b}/invoice"
              as: WholesaleRep
            - call: "POST /warranty-claims"
              payload: { order_line_id: "${line_b}", qty: 1, reason: "noise", resolution: "REPLACE" }
              as: WholesaleRep
              captures: { claim_b: $.data.id }
            - call: "POST /warranty-claims/${claim_b}/start-review"
              as: WarrantyAdmin
          trigger:
            - call: "POST /warranty-claims/${claim_a}/approve"
              as: WarrantyAdmin
              captures: { credit_a: $.data.credit_cents }
            - call: "POST /warranty-claims/${claim_b}/approve"
              as: WarrantyAdmin
              captures: { credit_b: $.data.credit_cents }
          assert:
            - "WarrantyClaim.${claim_a}.credit_cents == 14000"
            - "WarrantyClaim.${claim_b}.credit_cents == 0"
            - "WarrantyClaim.${claim_a}.status == APPROVED"
            - "WarrantyClaim.${claim_b}.status == APPROVED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_margin_floor_max_branch_binds
        grounds:
          - calculations.line_net_pricing
          - entities.PriceTier.fields.min_margin_pct
          - entities.OrderLine.fields.unit_merch_price_cents
        distinguishing_aspect: |
          MODE (a): non-linear interaction of 3 inputs (list, cost, discount)
          through max(discounted, margin_floor). With list 1000c, cost 900c,
          discount 0.50, margin 0.20: discounted=500 but margin_floor=ceil(1080)
          so the floor branch wins and unit_merch_price_cents == 1080, NOT 500.
        test_recipe:
          setup:
            - "DEEP tier: discount 0.50, min_margin 0.20"
            - "Thin-margin Part: list 1000, cost 900, no core"
            - "OPEN wholesale order on DEEP tier"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "DEEP", discount_pct: 0.50, core_discount_pct: 0.00, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { deep_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "FLT-1", description: "Oil filter", list_price_cents: 1000, cost_cents: 900, core_charge_cents: 0, is_rebuildable: false, warranty_days: 30, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { filter_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "WS Deep", account_type: "WHOLESALE", price_tier_id: "${deep_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${filter_id}", qty: 1 }
              as: WholesaleRep
              captures: { line_id: $.data.id, um: $.data.unit_merch_price_cents }
          assert:
            - "OrderLine.${line_id}.unit_merch_price_cents == 1080"

      - name: cf_round_then_multiply_per_unit_order
        grounds:
          - calculations.line_net_pricing
          - entities.OrderLine.fields.unit_merch_price_cents
          - entities.OrderLine.fields.line_merch_total_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. list 999c x discount
          0.50 gives 499.5c per unit; round-half-up PER UNIT first -> 500, then
          *qty 3 -> line_merch_total 1500. Multiply-then-round would give
          rhu(999*3*0.5)=1499. The scaffold pins round-then-multiply: 1500.
        test_recipe:
          setup:
            - "HALF tier: discount 0.50, min_margin 0.00"
            - "Part priced to expose a half-cent per unit: list 999, cost 100"
            - "OPEN wholesale order, qty 3"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "HALF", discount_pct: 0.50, core_discount_pct: 0.00, min_margin_pct: 0.00 }
              as: InventoryManager
              captures: { half_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "PLG-9", description: "Spark plug", list_price_cents: 999, cost_cents: 100, core_charge_cents: 0, is_rebuildable: false, warranty_days: 30, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { plug_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "WS Half", account_type: "WHOLESALE", price_tier_id: "${half_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${plug_id}", qty: 3 }
              as: WholesaleRep
              captures: { line_id: $.data.id }
          assert:
            - "OrderLine.${line_id}.unit_merch_price_cents == 500"
            - "OrderLine.${line_id}.line_merch_total_cents == 1500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_salesorder_parallel_fulfillment_x_settlement
        grounds:
          - state_machines.SalesOrder.fulfillment_status
          - state_machines.SalesOrder.settlement_status
          - entities.SalesOrder.fields.fulfillment_status
          - entities.SalesOrder.fields.settlement_status
        distinguishing_aspect: |
          SalesOrder carries two independent state axes: fulfillment_status
          advances OPEN->ALLOCATED->SHIPPED while settlement_status stays
          UNBILLED, then settlement advances UNBILLED->INVOICED->PAID with
          fulfillment frozen at SHIPPED — parallel dimensions on one entity.
        test_recipe:
          setup:
            - "One stock part with on-hand stock; one wholesale account"
            - "OPEN wholesale order with one stock line"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "PMP-1", description: "Water pump", list_price_cents: 8000, cost_cents: 3000, core_charge_cents: 0, is_rebuildable: false, warranty_days: 90, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pump_id: $.data.id }
            - call: "POST /parts/${pump_id}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pump_id}", qty: 2 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version, settle_after_alloc: $.data.settlement_status }
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
              captures: { fulfill_after_ship: $.data.fulfillment_status }
            - call: "POST /sales-orders/${order_id}/invoice"
              as: WholesaleRep
              captures: { fulfill_after_invoice: $.data.fulfillment_status, settle_after_invoice: $.data.settlement_status }
            - call: "POST /sales-orders/${order_id}/pay"
              as: WholesaleRep
          assert:
            - "SalesOrder.${order_id}.settlement_status == UNBILLED right after allocate (settle_after_alloc == UNBILLED)"
            - "SalesOrder.${order_id}.fulfillment_status == SHIPPED right after ship (fulfill_after_ship == SHIPPED)"
            - "SalesOrder.${order_id}.fulfillment_status == SHIPPED and settlement_status == INVOICED after invoice"
            - "SalesOrder.${order_id}.settlement_status == PAID and fulfillment_status == SHIPPED at end"

      - name: nlsm_reorder_cyclic_partial_receipt_loop
        grounds:
          - state_machines.ReorderRequest.PARTIALLY_RECEIVED_to_PARTIALLY_RECEIVED
          - state_machines.ReorderRequest.ORDERED_to_PARTIALLY_RECEIVED
          - state_machines.ReorderRequest.PARTIALLY_RECEIVED_to_RECEIVED
          - entities.ReorderRequest.fields.qty_received
        distinguishing_aspect: |
          ReorderRequest has a cyclic self-loop: PARTIALLY_RECEIVED -> receive
          -> PARTIALLY_RECEIVED can repeat any number of times before reaching
          RECEIVED, with qty_received accumulating each loop — not a linear
          one-shot pipeline.
        test_recipe:
          setup:
            - "Part with reorder_qty 10; a manually created ReorderRequest placed (ORDERED)"
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "BLT-3", description: "Belt", list_price_cents: 3000, cost_cents: 1200, core_charge_cents: 0, is_rebuildable: false, warranty_days: 0, stockable: true, reorder_point: 2, reorder_qty: 10 }
              as: InventoryManager
              captures: { belt_id: $.data.id }
            - call: "POST /reorder-requests"
              payload: { part_id: "${belt_id}" }
              as: InventoryManager
              captures: { ro_id: $.data.id }
            - call: "POST /reorder-requests/${ro_id}/place"
              as: InventoryManager
          trigger:
            - call: "POST /reorder-requests/${ro_id}/receive"
              payload: { receive_qty: 3 }
              as: InventoryManager
              captures: { st1: $.data.status, qr1: $.data.qty_received }
            - call: "POST /reorder-requests/${ro_id}/receive"
              payload: { receive_qty: 4 }
              as: InventoryManager
              captures: { st2: $.data.status, qr2: $.data.qty_received }
            - call: "POST /reorder-requests/${ro_id}/receive"
              payload: { receive_qty: 3 }
              as: InventoryManager
              captures: { st3: $.data.status, qr3: $.data.qty_received }
          assert:
            - "After receive 3: status == PARTIALLY_RECEIVED and qty_received == 3"
            - "After receive 4: status == PARTIALLY_RECEIVED and qty_received == 7"
            - "After receive 3: status == RECEIVED and qty_received == 10"
            - "Part.${belt_id}.on_hand_qty == 10"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_ship_decrements_part_autosuggests_reorder
        grounds:
          - state_machines.SalesOrder.fulfillment_status.ALLOCATED_to_SHIPPED
          - calculations.reorder_suggestion
          - entities.Part.fields.available_qty
          - entities.ReorderRequest.fields.status
        distinguishing_aspect: |
          Depth-3 chain from one trigger (ship): ship mutates the OrderLine
          (hop1) -> the line's SHIP side-effect debits Part.on_hand_qty causing
          available_qty to recompute (hop2) -> the recompute crosses the reorder
          point and auto-creates a SUGGESTED ReorderRequest (hop3). Each link is
          caused by the previous, not by the ship action directly.
        test_recipe:
          setup:
            - "Stock part: on_hand 5, reorder_point 2, reorder_qty 4, no open reorder"
            - "Wholesale order with one stock line qty 3, allocated"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "ROT-7", description: "Rotor", list_price_cents: 9000, cost_cents: 4000, core_charge_cents: 0, is_rebuildable: false, warranty_days: 30, stockable: true, reorder_point: 2, reorder_qty: 4 }
              as: InventoryManager
              captures: { rotor_id: $.data.id }
            - call: "POST /parts/${rotor_id}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${rotor_id}", qty: 3 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
          assert:
            - "Part.${rotor_id}.on_hand_qty == 2"
            - "Part.${rotor_id}.reserved_qty == 0"
            - "Part.${rotor_id}.available_qty == 2"
            - "GET /reorder-requests?part_id=${rotor_id} returns exactly one ReorderRequest with status SUGGESTED and qty_ordered == 4"

      - name: tc_core_accept_decrements_line_credits_account
        grounds:
          - state_machines.CoreReturn.PENDING_INSPECTION_to_ACCEPTED
          - entities.OrderLine.fields.cores_outstanding
          - entities.Account.fields.ar_balance_cents
          - calculations.core_refund
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (core-return accept): accept
          mutates the CoreReturn -> as a consequence OrderLine.cores_outstanding
          is decremented (hop2, line mutated) -> that line-level mutation drives
          the refund credit against the order's Account A/R (hop3, account
          mutated). Distinct propagation pattern from the ship->part->reorder chain.
        test_recipe:
          setup:
            - "Shipped+invoiced wholesale caliper line qty1 (rebuildable, core 6000)"
            - "Line cores_outstanding == 1; Account A/R charged with order_total 19400"
            - "A pending core return for qty1 (refund 5400) exists"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "CAL-300", description: "Brake caliper", list_price_cents: 20000, cost_cents: 9000, core_charge_cents: 6000, is_rebuildable: true, warranty_days: 90, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { caliper_id: $.data.id }
            - call: "POST /parts/${caliper_id}/receive-stock"
              payload: { qty: 3 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${caliper_id}", qty: 1 }
              as: WholesaleRep
              captures: { line_id: $.data.id }
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
            - call: "POST /sales-orders/${order_id}/invoice"
              as: WholesaleRep
            - call: "POST /core-returns"
              payload: { order_line_id: "${line_id}", qty: 1 }
              as: WholesaleRep
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /core-returns/${cr_id}/accept"
              as: WarrantyAdmin
          assert:
            - "CoreReturn.${cr_id}.status == ACCEPTED"
            - "OrderLine.${line_id}.cores_outstanding == 0"
            - "Account.${acct_id}.ar_balance_cents == 14000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_state_beats_fiscal_on_invoice
        grounds:
          - validations[priority=8]
          - validations[priority=15]
        distinguishing_aspect: |
          Error-category pair {state (NOT_SHIPPED, pri 8) vs business_fiscal
          (CREDIT_LIMIT_EXCEEDED, pri 15)}: an UNBILLED+ALLOCATED order whose
          total would also exceed credit limit, when invoiced, must return the
          higher-priority ERR_NOT_SHIPPED (state), never ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Wholesale account, credit_limit 100 (too small)"
            - "Allocated-but-not-shipped order with a line whose total > 100"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "ALT-1", description: "Alternator", list_price_cents: 8000, cost_cents: 3000, core_charge_cents: 0, is_rebuildable: false, warranty_days: 30, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { alt_id: $.data.id }
            - call: "POST /parts/${alt_id}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Tight", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 100 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${alt_id}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
          trigger:
            - call: "POST /sales-orders/${order_id}/invoice"
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_SHIPPED"
            - "HTTP status == 409"

      - name: ppvc_state_beats_referential_on_order_line_create
        grounds:
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair {state (ORDER_NOT_OPEN, pri 7) vs
          business_referential (PART_DISCONTINUED, pri 9)} — a different pair
          from the state-vs-fiscal conflict above. A line create against an
          ALLOCATED (not OPEN) order that ALSO names a DISCONTINUED part returns
          the lower-priority-number winner ERR_ORDER_NOT_OPEN, not
          ERR_PART_DISCONTINUED.
        test_recipe:
          setup:
            - "An ALLOCATED order (no longer OPEN)"
            - "A DISCONTINUED part"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "STK-1", description: "Stock part", list_price_cents: 5000, cost_cents: 2000, core_charge_cents: 0, is_rebuildable: false, warranty_days: 0, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { stock_id: $.data.id }
            - call: "POST /parts/${stock_id}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /parts"
              payload: { sku: "DSC-1", description: "Discontinued part", list_price_cents: 4000, cost_cents: 1500, core_charge_cents: 0, is_rebuildable: false, warranty_days: 0, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { disc_id: $.data.id }
            - call: "POST /parts/${disc_id}/discontinue"
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${stock_id}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${disc_id}", qty: 1 }
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_OPEN"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bpc_reorder_point_at_or_below_boundary
        grounds:
          - calculations.reorder_suggestion
          - entities.Part.fields.reorder_point
          - entities.Part.fields.available_qty
        distinguishing_aspect: |
          Numeric threshold boundary on the reorder comparator (<=) reached via
          POST /sales-orders/{id}/ship: shipping to available_qty == reorder_point
          (2 == 2) auto-suggests a reorder, while available_qty == reorder_point+1
          (the sibling negative below) does not. Tests the <= vs > edge.
        test_recipe:
          setup:
            - "Stock part on_hand 5, reorder_point 2, reorder_qty 4"
            - "Order with stock line qty 3, allocated (ship will drop available to exactly 2)"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "PAD-2", description: "Brake pads", list_price_cents: 6000, cost_cents: 2500, core_charge_cents: 0, is_rebuildable: false, warranty_days: 30, stockable: true, reorder_point: 2, reorder_qty: 4 }
              as: InventoryManager
              captures: { pad_id: $.data.id }
            - call: "POST /parts/${pad_id}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pad_id}", qty: 3 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
          assert:
            - "Part.${pad_id}.available_qty == 2"
            - "GET /reorder-requests?part_id=${pad_id} returns exactly one SUGGESTED ReorderRequest (boundary <= triggers at equality)"

      - name: bpc_credit_limit_at_limit_passes_one_over_fails
        grounds:
          - validations[priority=15]
          - entities.Account.fields.credit_limit_cents
          - entities.Account.fields.ar_balance_cents
        distinguishing_aspect: |
          Different metric (A/R credit limit) on a different endpoint
          (POST /sales-orders/{id}/invoice): an order_total of 4000 with
          credit_limit exactly 4000 invoices successfully (<= boundary passes),
          whereas credit_limit 3999 returns ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Two wholesale accounts: A with credit_limit 4000, B with credit_limit 3999"
            - "Each has a shipped order whose order_total is exactly 4000"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "T20", discount_pct: 0.20, core_discount_pct: 0.00, min_margin_pct: 0.10 }
              as: InventoryManager
              captures: { tier_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "CLT-1", description: "Clutch", list_price_cents: 5000, cost_cents: 2000, core_charge_cents: 0, is_rebuildable: false, warranty_days: 30, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { clutch_id: $.data.id }
            - call: "POST /parts/${clutch_id}/receive-stock"
              payload: { qty: 10 }
              as: InventoryManager
            # account A at-limit
            - call: "POST /accounts"
              payload: { name: "AtLimit", account_type: "WHOLESALE", price_tier_id: "${tier_id}", credit_limit_cents: 4000 }
              as: WholesaleRep
              captures: { acct_a: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_a}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { ord_a: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ord_a}", part_id: "${clutch_id}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${ord_a}"
              as: WholesaleRep
              captures: { va1: $.data.version }
            - call: "POST /sales-orders/${ord_a}/allocate"
              payload: { expected_sales_order_version: "${va1}" }
              as: WholesaleRep
              captures: { va2: $.data.version }
            - call: "POST /sales-orders/${ord_a}/ship"
              payload: { expected_sales_order_version: "${va2}" }
              as: WholesaleRep
            # account B one-under-limit
            - call: "POST /accounts"
              payload: { name: "OneUnder", account_type: "WHOLESALE", price_tier_id: "${tier_id}", credit_limit_cents: 3999 }
              as: WholesaleRep
              captures: { acct_b: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_b}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { ord_b: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ord_b}", part_id: "${clutch_id}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${ord_b}"
              as: WholesaleRep
              captures: { vb1: $.data.version }
            - call: "POST /sales-orders/${ord_b}/allocate"
              payload: { expected_sales_order_version: "${vb1}" }
              as: WholesaleRep
              captures: { vb2: $.data.version }
            - call: "POST /sales-orders/${ord_b}/ship"
              payload: { expected_sales_order_version: "${vb2}" }
              as: WholesaleRep
          trigger:
            - call: "POST /sales-orders/${ord_a}/invoice"
              as: WholesaleRep
              captures: { settle_a: $.data.settlement_status }
            - call: "POST /sales-orders/${ord_b}/invoice"
              as: WholesaleRep
              captures: { err_b: $.data.error_id }
          assert:
            - "Order A invoices successfully: SalesOrder.${ord_a}.settlement_status == INVOICED"
            - "Account.${acct_a}.ar_balance_cents == 4000"
            - "Order B invoice rejected: response error_id == ERR_CREDIT_LIMIT_EXCEEDED with HTTP 402"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_allocate_blocked_by_account_on_hold
        grounds:
          - state_machines.SalesOrder.fulfillment_status.OPEN_to_ALLOCATED
          - entities.Account.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair SalesOrder->Account: SalesOrder OPEN->ALLOCATED is valid
          only when the referenced Account.status == ACTIVE; with the Account
          ON_HOLD the otherwise-valid allocate is rejected ERR_ACCOUNT_ON_HOLD.
        test_recipe:
          setup:
            - "Wholesale account placed ON_HOLD after the order was opened with a stock line"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "HOS-1", description: "Hose", list_price_cents: 2000, cost_cents: 800, core_charge_cents: 0, is_rebuildable: false, warranty_days: 0, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { hose_id: $.data.id }
            - call: "POST /parts/${hose_id}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Hold", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${hose_id}", qty: 1 }
              as: WholesaleRep
            - call: "POST /accounts/${acct_id}/hold"
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_ON_HOLD with HTTP 409"
            - "SalesOrder.${order_id}.fulfillment_status == OPEN (unchanged)"

      - name: cesd_core_accept_blocked_by_line_not_shipped
        grounds:
          - state_machines.CoreReturn.PENDING_INSPECTION_to_ACCEPTED
          - entities.OrderLine.fields.status
        distinguishing_aspect: |
          Different entity pair CoreReturn->OrderLine: a CoreReturn may only be
          accepted when the referenced OrderLine.status == SHIPPED. Here the
          core return is opened, then the order is cancelled (line -> CANCELLED),
          so accept is rejected ERR_CORE_RETURN_LINE_NOT_SHIPPED.
        test_recipe:
          setup:
            - "An ALLOCATED rebuildable line, a core return opened against it, then order cancelled"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "CAL-400", description: "Brake caliper", list_price_cents: 20000, cost_cents: 9000, core_charge_cents: 6000, is_rebuildable: true, warranty_days: 90, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { caliper_id: $.data.id }
            - call: "POST /parts/${caliper_id}/receive-stock"
              payload: { qty: 3 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${caliper_id}", qty: 1 }
              as: WholesaleRep
              captures: { line_id: $.data.id }
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
            - call: "POST /core-returns"
              payload: { order_line_id: "${line_id}", qty: 1 }
              as: WholesaleRep
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /core-returns/${cr_id}/reject"
              as: WarrantyAdmin
              captures: { st: $.data.status }
          assert:
            - "CoreReturn.${cr_id}.status == REJECTED (no refund issued)"
            - "Account.${acct_id}.ar_balance_cents unchanged (no settlement charged; order never invoiced)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_driver_buffered_window_conflict
        grounds:
          - validations[priority=17]
          - entities.Driver.fields.turnaround_min
          - entities.DeliveryRun.fields.window_start_min
          - entities.DeliveryRun.fields.window_end_min
        distinguishing_aspect: |
          Driver interval semantics are BUFFERED: with turnaround_min 30, a run
          [60,120) and a second run [120,180) do NOT positively overlap but the
          120-minute gap is 0 < 30, so the second run is rejected
          ERR_DRIVER_WINDOW_CONFLICT — adjacency-within-buffer collides.
        test_recipe:
          setup:
            - "Driver with turnaround_min 30; one bay; two allocated wholesale orders"
            - "One scheduled run [60,120) on the driver"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "SPC-1", description: "Special order part", list_price_cents: 7000, cost_cents: 3000, core_charge_cents: 0, is_rebuildable: false, warranty_days: 0, stockable: false, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { spc_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "Dave", turnaround_min: 30 }
              as: WholesaleRep
              captures: { driver_id: $.data.id }
            - call: "POST /bays"
              payload: { code: "BAY-A" }
              as: WholesaleRep
              captures: { bay_a: $.data.id }
            - call: "POST /bays"
              payload: { code: "BAY-B" }
              as: WholesaleRep
              captures: { bay_b: $.data.id }
            # order 1 (special-order line so it is hotshot-eligible), allocated
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE", hotshot_requested: true }
              as: WholesaleRep
              captures: { ord1: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ord1}", part_id: "${spc_id}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${ord1}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${ord1}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
            # order 2
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE", hotshot_requested: true }
              as: WholesaleRep
              captures: { ord2: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ord2}", part_id: "${spc_id}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${ord2}"
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${ord2}/allocate"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
            # first run on the driver, in bay A
            - call: "POST /delivery-runs"
              payload: { order_id: "${ord1}", driver_id: "${driver_id}", bay_id: "${bay_a}", window_start_min: 60, window_end_min: 120 }
              as: WholesaleRep
              captures: { run1: $.data.id }
          trigger:
            - call: "POST /delivery-runs"
              payload: { order_id: "${ord2}", driver_id: "${driver_id}", bay_id: "${bay_b}", window_start_min: 120, window_end_min: 180 }
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DRIVER_WINDOW_CONFLICT with HTTP 409"
            - "GET /delivery-runs?driver_id=${driver_id} returns exactly one non-CANCELLED run"

      - name: rto_bay_halfopen_adjacency_allowed
        grounds:
          - validations[priority=18]
          - entities.Bay.fields.code
          - entities.DeliveryRun.fields.window_start_min
          - entities.DeliveryRun.fields.window_end_min
        distinguishing_aspect: |
          Bay interval semantics are HALF-OPEN with no buffer: a run [60,120)
          and a second run [120,180) on the SAME bay (different drivers, no
          turnaround buffer) touch exactly at 120 and therefore do NOT collide,
          so the second run is accepted — opposite outcome from the buffered
          driver rule on the same numbers.
        test_recipe:
          setup:
            - "One bay; two drivers with turnaround_min 0; two allocated hotshot orders"
            - "One scheduled run [60,120) in the bay on driver 1"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "SPC-2", description: "Special order part", list_price_cents: 7000, cost_cents: 3000, core_charge_cents: 0, is_rebuildable: false, warranty_days: 0, stockable: false, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { spc_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "Drv1", turnaround_min: 0 }
              as: WholesaleRep
              captures: { drv1: $.data.id }
            - call: "POST /drivers"
              payload: { name: "Drv2", turnaround_min: 0 }
              as: WholesaleRep
              captures: { drv2: $.data.id }
            - call: "POST /bays"
              payload: { code: "BAY-C" }
              as: WholesaleRep
              captures: { bay_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE", hotshot_requested: true }
              as: WholesaleRep
              captures: { ord1: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ord1}", part_id: "${spc_id}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${ord1}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${ord1}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE", hotshot_requested: true }
              as: WholesaleRep
              captures: { ord2: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ord2}", part_id: "${spc_id}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${ord2}"
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${ord2}/allocate"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
            - call: "POST /delivery-runs"
              payload: { order_id: "${ord1}", driver_id: "${drv1}", bay_id: "${bay_id}", window_start_min: 60, window_end_min: 120 }
              as: WholesaleRep
              captures: { run1: $.data.id }
          trigger:
            - call: "POST /delivery-runs"
              payload: { order_id: "${ord2}", driver_id: "${drv2}", bay_id: "${bay_id}", window_start_min: 120, window_end_min: 180 }
              as: WholesaleRep
              captures: { run2: $.data.id, st2: $.data.status }
          assert:
            - "Second run created: DeliveryRun.${run2}.status == SCHEDULED (adjacency at 120 allowed on half-open bay)"
            - "GET /delivery-runs?bay_id=${bay_id} returns exactly two non-CANCELLED runs"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_inventory_units_conserved_allocate_then_cancel
        grounds:
          - state_machines.SalesOrder.fulfillment_status.OPEN_to_ALLOCATED
          - state_machines.SalesOrder.fulfillment_status.ALLOCATED_to_CANCELLED
          - entities.Part.fields.on_hand_qty
          - entities.Part.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity: total inventory units = on_hand_qty + (units owed
          out). Allocate reserves units (on_hand_qty unchanged, reserved_qty
          rises); the compensating cancel releases the reservation. Invariant:
          on_hand_qty + reserved_qty is identical before allocate and after the
          cancel (5 + 0 == 5 + 0), with no drift in either field.
        test_recipe:
          setup:
            - "Stock part on_hand 5, reserved 0; order with stock line qty 3"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "FUE-1", description: "Fuel pump", list_price_cents: 9000, cost_cents: 4000, core_charge_cents: 0, is_rebuildable: false, warranty_days: 30, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pump_id: $.data.id }
            - call: "POST /parts/${pump_id}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pump_id}", qty: 3 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
          trigger:
            - call: "POST /sales-orders/${order_id}/cancel"
              as: WholesaleRep
          assert:
            - "Part.${pump_id}.on_hand_qty == 5"
            - "Part.${pump_id}.reserved_qty == 0"
            - "Part.${pump_id}.available_qty == 5"
            - "SalesOrder.${order_id}.fulfillment_status == CANCELLED"

      - name: ci_ar_balance_conserved_invoice_then_pay
        grounds:
          - state_machines.SalesOrder.settlement_status.UNBILLED_to_INVOICED
          - state_machines.SalesOrder.settlement_status.INVOICED_to_PAID
          - entities.Account.fields.ar_balance_cents
        distinguishing_aspect: |
          Different conserved quantity (Account A/R money, not inventory units):
          invoice charges ar_balance_cents += order_total (merch 14000 + core
          5400 = 19400); the compensating pay relieves ar_balance_cents -=
          order_total. Invariant: ar_balance_cents returns to its pre-invoice
          value (0) after pay, no monetary drift.
        test_recipe:
          setup:
            - "Shipped wholesale caliper order, order_total 19400, A/R starts at 0"
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "CAL-500", description: "Brake caliper", list_price_cents: 20000, cost_cents: 9000, core_charge_cents: 6000, is_rebuildable: true, warranty_days: 90, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { caliper_id: $.data.id }
            - call: "POST /parts/${caliper_id}/receive-stock"
              payload: { qty: 3 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${caliper_id}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
            - call: "POST /sales-orders/${order_id}/invoice"
              as: WholesaleRep
              captures: { order_total: $.data.order_total_cents }
          trigger:
            - call: "POST /sales-orders/${order_id}/pay"
              as: WholesaleRep
          assert:
            - "SalesOrder.${order_id}.order_total_cents == 19400 (merch 14000 + core 5400)"
            - "Account.${acct_id}.ar_balance_cents == 19400 immediately after invoice (order_total charged)"
            - "Account.${acct_id}.ar_balance_cents == 0 after pay (compensation, no drift)"
            - "SalesOrder.${order_id}.settlement_status == PAID"
