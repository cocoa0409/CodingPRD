              payload: { expected_crew_day_version: "${cd_ap_ac_version}", acknowledge_mode: "FINAL" }
              as: GeneralForeman
              captures: { cd_ap_ac_version: $.data.version }
          assert:
            - "after both acknowledgments journeyman_hours == 4.0 and apprentice_hours == 4.0 give excess_apprentice_hours == 0.0 exactly, because 4.0 == ratio_limit 1.0 * 4.0"
            - "the reconciliation identity holds: apprentice_hours == original apprentice hours + adjustment_delta_hours, with adjustment_delta_hours == 0.0 on this row"
            - "re-running the same acknowledgment sequence on a fresh project reproduces excess_apprentice_hours == 0.0, so the quantity is conserved rather than merely settled once"
