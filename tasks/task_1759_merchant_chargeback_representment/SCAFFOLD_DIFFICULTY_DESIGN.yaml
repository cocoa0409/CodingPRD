              captures: { enr_id: "$.data[0].id", enr_status: "$.data[0].status", enr_month: "$.data[0].enrolled_month", enr_over: "$.data[0].months_over_count" }
            - call: "GET /acquirer/merchants/${m_id}/education-assignments"
              as: RiskOfficer
              captures: { edu1: "$.data[0].module_code", edu2: "$.data[1].module_code", edu1_status: "$.data[0].status" }
            - call: "GET /acquirer/fee-assessments"
              as: FinanceOps
              payload: { enrollment_id: "${enr_id}" }
              captures: { fine_amount: "$.data[0].amount_cents", fine_kind: "$.data[0].kind", fine_by: "$.data[0].assessed_by_user_id" }
          assert:
            - "snaps == 1 and enrs == 1 and fines == 1"
            - "enr_status == ACTIVE, enr_month == 2026-06, enr_over == 1"
            - "education cascade: exactly the pair {edu1, edu2} == {CHARGEBACK_BASICS, EVIDENCE_BEST_PRACTICE} in created order with edu1_status == ASSIGNED"
            - "fine_kind == PROGRAM_FINE and fine_amount == 250000 (month-1 VDMP_STANDARD base, multiplier 1.0) and fine_by == system"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_outranks_temporal
        grounds:
