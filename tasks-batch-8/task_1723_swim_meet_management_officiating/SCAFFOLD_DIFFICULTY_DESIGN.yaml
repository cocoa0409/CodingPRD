scaffold_difficulty_design:
  # Rule 1 — dual_variant_calc (two different entity domains)
  - rule_id: dual_variant_calc
    instances:
      - name: timing_reconciliation_primary_vs_backup_variants
        grounds:
          - calculations.timing_reconciliation
          - calculations.backup_mean_rounded
          - state_machines.LaneAssignment.MANUAL_REVIEW_to_RESOLVED
          - state_machines.LaneAssignment.RESOLVED_to_MANUAL_REVIEW
        distinguishing_aspect: |
          Timing domain (LaneAssignment): identical readings pad=2500, b1=2530, b2=2540 resolve to
          final_time_cs 2500 under PRIMARY_PRIORITY but 2535 under BACKUP_MEAN_PRIORITY — two valid
          variants, different numbers, on a different entity domain than the points variant pair.
        test_recipe:
          setup:
            - "Meet SEEDED then event IN_PROGRESS; one lane in MANUAL_REVIEW with pad 2500, backups 2530/2540 (rounded mean 2535, delta 35 > threshold 30)"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "DV1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_a: "$.data.id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Ref R", lsc_membership_id: "LSC-R1", certifications: ["REFEREE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_ref: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Jud J", lsc_membership_id: "LSC-J1", certifications: ["STROKE_TURN_JUDGE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_jud: "$.data.id" } }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_ref}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_ref: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_ref}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_ref}" }
            - { call: "POST /events/${ev1}/official-assignments", payload: { official_id: "${off_jud}", role_on_deck: "STROKE_TURN_JUDGE" }, as: MeetDirector, captures: { oa_jud: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_jud}/confirm", payload: {}, as: DeckOfficial, as_user_id: "${off_jud}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v: "$.data.version" } }
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector }
            - { call: "POST /events/${ev1}/start", payload: {}, as: MeetDirector }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_a}" }, as: Any, captures: { lane_a: "$.data[0].id" } }
            - { call: "POST /lane-assignments/${lane_a}/readings", payload: { pad_cs: 2500, backup1_cs: 2530, backup2_cs: 2540 }, as: TimingOperator }
          trigger:
            - { call: "POST /lane-assignments/${lane_a}/resolve", payload: { variant: "PRIMARY_PRIORITY" }, as: TimingOperator, captures: { t_primary: "$.data.final_time_cs" } }
            - { call: "POST /lane-assignments/${lane_a}/reopen-timing", payload: {}, as: MeetReferee, as_user_id: "${off_ref}" }
            - { call: "POST /lane-assignments/${lane_a}/resolve", payload: { variant: "BACKUP_MEAN_PRIORITY" }, as: TimingOperator, captures: { t_backup: "$.data.final_time_cs" } }
          assert:
            - "LaneAssignment.${lane_a}.reconciliation_status == RESOLVED"
            - "${t_primary} == 2500"
            - "${t_backup} == 2535"
            - "${t_primary} != ${t_backup}"
      - name: tie_policy_split_vs_top_points
        grounds:
          - calculations.place_points
          - calculations.team_points_rollup
          - entities.Meet.fields.scoring_tie_policy
        distinguishing_aspect: |
          Scoring domain (Result/Team, distinct from the LaneAssignment timing domain): identical race
          data (finals 2490, 2500, 2500, 2510) yields 6.50 points per tied swimmer under SPLIT but
          7.00 under TOP — two valid tie policies, different points for identical inputs.
        test_recipe:
          setup:
            - "Two identical meets (SPLIT default vs TOP), each with one team, four ELEVEN_TWELVE swimmers in one 50 Free, finals 2490/2500/2500/2510 producing a tie at place 2"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "MS", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z", scoring_tie_policy: "SPLIT" }, as: MeetDirector, captures: { meet_s: "$.data.id" } }
            - { call: "POST /meets/${meet_s}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_s}", team_code: "SPL", team_name: "Splitville" }, as: MeetDirector, captures: { team_s: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_s}", full_name: "S A", birth_date: "2014-01-01", gender: "M" }, as: TeamCoach, as_user_id: "${team_s}", captures: { sw_sa: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_s}", full_name: "S B", birth_date: "2014-01-02", gender: "M" }, as: TeamCoach, as_user_id: "${team_s}", captures: { sw_sb: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_s}", full_name: "S C", birth_date: "2014-01-03", gender: "M" }, as: TeamCoach, as_user_id: "${team_s}", captures: { sw_sc: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_s}", full_name: "S D", birth_date: "2014-01-04", gender: "M" }, as: TeamCoach, as_user_id: "${team_s}", captures: { sw_sd: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_s}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev_s: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev_s}", swimmer_id: "${sw_sa}", seed_time_cs: 2400 }, as: TeamCoach, as_user_id: "${team_s}", captures: { en_sa: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev_s}", swimmer_id: "${sw_sb}", seed_time_cs: 2450 }, as: TeamCoach, as_user_id: "${team_s}", captures: { en_sb: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev_s}", swimmer_id: "${sw_sc}", seed_time_cs: 2460 }, as: TeamCoach, as_user_id: "${team_s}", captures: { en_sc: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev_s}", swimmer_id: "${sw_sd}", seed_time_cs: 2470 }, as: TeamCoach, as_user_id: "${team_s}", captures: { en_sd: "$.data.id" } }
            - { call: "POST /entries/${en_sa}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /entries/${en_sb}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /entries/${en_sc}/verify", payload: {}, as: MeetDirector }
