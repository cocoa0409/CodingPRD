# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2552: Transportation Procurement & Freight Bid Management
#
# Every instance grounds in §1.1–§1.7 of SCAFFOLD.yaml. Every numeric assert is a
# literal computed by executing the referenced §1.3 formula against the pinned
# setup inputs. Nine rule_id blocks, 20 instances.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: lane_evaluated_cost_forecast_versus_historical_basis
        grounds:
          - calculations.lane_evaluated_cost
          - entities.LaneBid.fields.evaluated_basis
          - entities.LaneBid.fields.awardable_volume_loads
          - entities.LaneBid.fields.evaluated_total_cost_usd
          - entities.BidEvent.fields.cost_basis
        distinguishing_aspect: |
          This dual variant lives in the cost-accounting domain on LaneBid/Lane: the
          FORECAST and HISTORICAL variants of lane_evaluated_cost consume byte-identical
          lane and bid data and produce different cost_per_load_usd (2584.31 vs 2563.68)
          and different awardable_volume_loads (600 vs 480), because only FORECAST
          inflates the accessorial term and grows the volume basis.
        test_recipe:
          setup:
            - "Carrier ALFL qualified with capability_score 88.00 and PROVISIONAL composite 90.60."
            - "Two bid events identical in every parameter except cost_basis: event F is FORECAST, event H is HISTORICAL."
            - "Each event holds one lane with mileage 1147, annual_volume_loads 550, trailing_12m_actual_loads 480, accessorial_history_usd_per_load 137.55; both events use accessorial_inflation_factor 1.15."
            - "Both events reached ROUND_OPEN with ALFL invited and accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN", "REEFER"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN", "REEFER"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "FY27 Forecast Basis", cost_basis: "FORECAST", fuel_index_per_mile: 0.4800, accessorial_inflation_factor: 1.15, rate_floor_per_mile: 1.5000, rounds_allowed: 2, cost_weight: 0.55, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, diversity_min_pct: 0.00, max_award_share_pct: 100.00, max_carriers_per_lane: 1, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { event_f_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_f_id}/lanes"
              payload: { lane_code: "L-1147", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480, seasonality_peak_index: 1.20, incumbent_carrier_id: "${carrier_a_id}", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
              captures: { lane_f_id: $.data.id }
            - call: "POST /freight-procurement/lanes/${lane_f_id}/validate"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events/${event_f_id}/lock-lanes"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events/${event_f_id}/invitations"
              payload: { carrier_id: "${carrier_a_id}", nda_required: false }
              as: ProcurementAnalyst
              captures: { invite_f_id: $.data.id }
            - call: "POST /freight-procurement/invitations/${invite_f_id}/response"
              payload: { accept: true }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-events/${event_f_id}/bid-rounds"
              payload: { incumbent_visibility: "RANK_ONLY", closes_at: "2026-08-20T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { round_f_id: $.data.id }
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "FY27 Historical Basis", cost_basis: "HISTORICAL", fuel_index_per_mile: 0.4800, accessorial_inflation_factor: 1.15, rate_floor_per_mile: 1.5000, rounds_allowed: 2, cost_weight: 0.55, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, diversity_min_pct: 0.00, max_award_share_pct: 100.00, max_carriers_per_lane: 1, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { event_h_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_h_id}/lanes"
              payload: { lane_code: "L-1147", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480, seasonality_peak_index: 1.20, incumbent_carrier_id: "${carrier_a_id}", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
              captures: { lane_h_id: $.data.id }
            - call: "POST /freight-procurement/lanes/${lane_h_id}/validate"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events/${event_h_id}/lock-lanes"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events/${event_h_id}/invitations"
              payload: { carrier_id: "${carrier_a_id}", nda_required: false }
              as: ProcurementAnalyst
              captures: { invite_h_id: $.data.id }
            - call: "POST /freight-procurement/invitations/${invite_h_id}/response"
              payload: { accept: true }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-events/${event_h_id}/bid-rounds"
              payload: { incumbent_visibility: "RANK_ONLY", closes_at: "2026-08-20T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { round_h_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/bid-rounds/${round_f_id}/lane-bids"
              payload: { lane_id: "${lane_f_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 2.1152, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { bid_f_id: $.data.id }
            - call: "POST /freight-procurement/bid-rounds/${round_h_id}/lane-bids"
              payload: { lane_id: "${lane_h_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 2.1152, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { bid_h_id: $.data.id }
          assert:
            - "LaneBid.${bid_f_id}.evaluated_basis == FORECAST"
            - "LaneBid.${bid_f_id}.linehaul_per_load_usd == 2426.13"
            - "LaneBid.${bid_f_id}.accessorial_per_load_usd == 158.18"
            - "LaneBid.${bid_f_id}.cost_per_load_usd == 2584.31"
            - "LaneBid.${bid_f_id}.awardable_volume_loads == 600"
            - "LaneBid.${bid_f_id}.evaluated_total_cost_usd == 1550586.00"
            - "LaneBid.${bid_h_id}.evaluated_basis == HISTORICAL"
            - "LaneBid.${bid_h_id}.linehaul_per_load_usd == 2426.13"
            - "LaneBid.${bid_h_id}.accessorial_per_load_usd == 137.55"
            - "LaneBid.${bid_h_id}.cost_per_load_usd == 2563.68"
            - "LaneBid.${bid_h_id}.awardable_volume_loads == 480"
            - "LaneBid.${bid_h_id}.evaluated_total_cost_usd == 1230566.40"
            - "LaneBid.${bid_f_id}.evaluated_total_cost_usd != LaneBid.${bid_h_id}.evaluated_total_cost_usd"

      - name: carrier_composite_provisional_versus_final_performance
        grounds:
          - calculations.carrier_composite_score
          - calculations.scorecard_period_score
          - entities.Carrier.fields.composite_score_variant
          - entities.Carrier.fields.published_scorecard_count
          - state_machines.Scorecard.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          This dual variant lives in the carrier-performance domain on Carrier, a
          different entity domain from lane_evaluated_cost's cost accounting: the
          PROVISIONAL_SCREENING variant scores the same carrier at 90.60 from a flat
          baseline while FINAL_PERFORMANCE scores it at 80.27 from the recency-weighted
          scorecard blend, with capability_score and insurance headroom held identical.
        test_recipe:
          setup:
            - "Carrier ALFL qualified: capability_score 88.00, insurance expiry 2027-06-30 (more than 90 days past the clock), composite 90.60 under PROVISIONAL_SCREENING."
            - "Two DRAFT scorecards exist and therefore do not yet affect the composite: period ending 2026-04-01 with on_time_pct 92.00 / claims_ratio 0.010 (period score 94.40) and period ending 2026-07-01 with on_time_pct 55.00 / claims_ratio 0.080 (period score 63.75). Neither period has any tender events, so tender_acceptance_pct defaults to 100.00 on both."
            - "Logical clock at 2026-08-01T00:00:00Z so both periods are closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN", "REEFER"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN", "REEFER"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/scorecards"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", on_time_pct: 92.00, claims_ratio: 0.010 }
              as: CategoryManager
              captures: { sc_older_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/scorecards"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", on_time_pct: 55.00, claims_ratio: 0.080 }
              as: CategoryManager
              captures: { sc_newer_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/scorecards/${sc_older_id}/publish"
              payload: {}
              as: CategoryManager
            - call: "POST /freight-procurement/scorecards/${sc_newer_id}/publish"
              payload: {}
              as: CategoryManager
          assert:
            - "Scorecard.${sc_older_id}.tender_acceptance_pct == 100.00"
            - "Scorecard.${sc_older_id}.composite_score == 94.40"
            - "Scorecard.${sc_newer_id}.composite_score == 63.75"
            - "Carrier.${carrier_a_id}.composite_score == 90.60 and composite_score_variant == PROVISIONAL_SCREENING before the first publish"
            - "Carrier.${carrier_a_id}.composite_score == 93.68 and composite_score_variant == FINAL_PERFORMANCE after publishing only the 2026-04-01 scorecard"
            - "Carrier.${carrier_a_id}.composite_score == 80.27 after both publishes"
            - "Carrier.${carrier_a_id}.published_scorecard_count == 2"
            - "Carrier.${carrier_a_id}.capability_score == 88.00 unchanged across both publishes"
            - "Carrier.${carrier_a_id}.status == QUALIFIED (80.27 is above WATCHLIST_FLOOR 75.00)"

  - rule_id: combinatorial_formula
    instances:
      - name: lane_evaluated_cost_pinned_rounding_order
        mode: b
        grounds:
          - calculations.lane_evaluated_cost
          - calculations.lane_evaluated_cost.rounding
          - constants.ACCESSORIAL_INFLATION applied per load before summation
        distinguishing_aspect: |
          Mode b — order-sensitive operations. lane_evaluated_cost pins round-then-sum:
          the linehaul term and the inflated accessorial term are each rounded to 2dp
          before they are added, and the per-load figure is rounded before it is
          multiplied by awardable volume. Summing the raw products first and rounding
          once at the end yields 2584.32 per load and 1550592.00 in total instead of
          2584.31 and 1550586.00 — a 6.00 USD divergence on a single lane that an
          implementation with the wrong operation order cannot hide.
        test_recipe:
          setup:
            - "Carrier ALFL qualified. One FORECAST bid event (fuel_index_per_mile 0.4800, accessorial_inflation_factor 1.15) in ROUND_OPEN."
            - "Lane with mileage 1147 and accessorial_history_usd_per_load 137.55: 1147 * 2.1152 = 2426.1344 raw linehaul and 137.55 * 1.15 = 158.1825 raw accessorial, so both terms sit strictly between rounding boundaries."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN", "REEFER"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "Rounding Order Event", cost_basis: "FORECAST", fuel_index_per_mile: 0.4800, accessorial_inflation_factor: 1.15, rate_floor_per_mile: 1.5000, rounds_allowed: 2, cost_weight: 0.55, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, diversity_min_pct: 0.00, max_award_share_pct: 100.00, max_carriers_per_lane: 1, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { event_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-1147", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480, seasonality_peak_index: 1.20, incumbent_carrier_id: "${carrier_a_id}", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
              captures: { lane_a_id: $.data.id }
            - call: "POST /freight-procurement/lanes/${lane_a_id}/validate"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events/${event_id}/lock-lanes"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events/${event_id}/invitations"
              payload: { carrier_id: "${carrier_a_id}", nda_required: false }
              as: ProcurementAnalyst
              captures: { invite_id: $.data.id }
            - call: "POST /freight-procurement/invitations/${invite_id}/response"
              payload: { accept: true }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-events/${event_id}/bid-rounds"
              payload: { incumbent_visibility: "RANK_ONLY", closes_at: "2026-08-20T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { round_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 2.1152, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { bid_a_id: $.data.id }
          assert:
            - "LaneBid.${bid_a_id}.linehaul_per_load_usd == 2426.13 (2426.1344 rounded before summation, not carried raw)"
            - "LaneBid.${bid_a_id}.accessorial_per_load_usd == 158.18 (158.1825 rounded before summation)"
            - "LaneBid.${bid_a_id}.cost_per_load_usd == 2584.31"
            - "LaneBid.${bid_a_id}.cost_per_load_usd != 2584.32 (the sum-then-round result is rejected)"
            - "LaneBid.${bid_a_id}.evaluated_total_cost_usd == 1550586.00"
            - "LaneBid.${bid_a_id}.evaluated_total_cost_usd != 1550592.00 (the raw-product result is rejected)"

      - name: contract_committed_value_pinned_tier_evaluation_order
        mode: c
        grounds:
          - calculations.contract_committed_value
          - calculations.contract_committed_value.constants.VOLUME_DISCOUNT_TIERS
          - calculations.contract_committed_value.constants.ALLOWANCE_TIERS
          - entities.Contract.fields.total_committed_value_usd
        distinguishing_aspect: |
          Mode c — nested conditional tier lookups, a different mode from the
          order-sensitive rounding instance above. Two independent tier tables are
          consulted against two different bases: the volume discount tier is keyed on
          the raw committed base, while the allowance tier is keyed on the
          post-discount subtotal. Here the base 1520400.00 lands in the top discount
          tier and the subtotal 1482390.00 lands in the top allowance tier, but an
          implementation that keys the allowance on the base instead of the subtotal
          computes 1512798.00 rather than 1512037.80.
        test_recipe:
          setup:
            - "Full procurement chain executed to an EXECUTED-eligible contract for carrier ALFL: qualified carrier, two-lane FORECAST bid event, one bid round closed, optimization run published as a routing guide, both award allocations approved, bid event awarded."
            - "The award cascade mints the contract; total_committed_value_usd starts at 0.00 because no rate records are staged yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN", "REEFER"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN", "REEFER"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "FY27 National Truckload", cost_basis: "FORECAST", fuel_index_per_mile: 0.4800, accessorial_inflation_factor: 1.15, rate_floor_per_mile: 1.5000, rounds_allowed: 2, cost_weight: 0.55, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, diversity_min_pct: 0.00, max_award_share_pct: 100.00, max_carriers_per_lane: 1, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { event_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-1147", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480, seasonality_peak_index: 1.20, incumbent_carrier_id: "${carrier_a_id}", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
