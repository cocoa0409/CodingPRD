            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-BP2", drawing_id: "${dr}", qty_ordered: 1 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${t1}", qty_issued: 1, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO BP2", badge_no: "B-LO-BP2" }, as: QualityManager, captures: { lo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T23:59:59Z" }, as: QualityManager }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "CONTINUITY", opens_count: 0 }, as: QualityInspector, as_user_id: "${qi}", captures: { ok_res: $.data.result } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "HIPOT", hipot_voltage_v: 1000.0, dwell_seconds: 2.0, measured_leakage_ua: 5.0, leakage_limit_ua: 10.0 }, as: QualityInspector, as_user_id: "${qi}", captures: { err: $.data.error_id } }
            - { call: "GET /plant/harness-units/${u1}", payload: {}, as: QualityInspector }
          assert:
