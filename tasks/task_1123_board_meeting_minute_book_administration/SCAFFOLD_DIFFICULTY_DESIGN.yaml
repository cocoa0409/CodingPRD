            - call: "POST /conflict_disclosures"
              payload: { director_id: "${d4}", corporation_id: "${corp}", related_party: "Acme", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: CorporateSecretary
              captures: { cd: $.data.id }
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", origin: "WRITTEN_CONSENT", resolution_type: "ORDINARY", title: "Acme contract", text: "Approve Acme contract", related_party: "Acme" }
