# =============================================================================
# 1.9 Scaffold Corner Design (breadth probe)
# Task 2422 — Open Access Publishing Fee & Repository Deposit
# Walked from references/claim-extraction-guide.md against §1.1-§1.7.
# `excluded_because:` stubs cite the §1.8 instance that already covers the corner.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_publisher_creation_returns_system_and_default_fields
        claim_type: creation
        grounds:
          - entities.Publisher.fields.screening_status
          - entities.Publisher.fields.active_agreement_count
          - endpoints[POST /publishers]
        distinguishing_aspect: "POST /publishers returns 201 with screening_status UNSCREENED, active_agreement_count 0, predatory_score null, author_guidance null, last_screened_at null, and system-assigned id / created_at / updated_at / version == 1."
        test_recipe:
          setup:
            - "empty database, logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { c1_id: $.data.id, c1_screening: $.data.screening_status, c1_count: $.data.active_agreement_count, c1_version: $.data.version, c1_score: $.data.predatory_score }
          assert:
            - "the response returned HTTP 201"
            - "${c1_id} != null"
            - "${c1_screening} == UNSCREENED"
            - "${c1_count} == 0"
            - "${c1_score} == null"
            - "${c1_version} == 1"
            - "Publisher.${c1_id}.author_guidance == null"
            - "Publisher.${c1_id}.last_screened_at == null"
            - "Publisher.${c1_id}.name == Meridian Academic Press"
            - "Publisher.${c1_id}.publisher_code == MERID"
            - "Publisher.${c1_id}.country_code == NL"
            - "the response envelope carries meta.api_request_id and meta.api_request_timestamp with response_type == object"

      - name: corner_journal_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /journals/{id}]
          - entities.Journal.fields.list_apc_cents
        distinguishing_aspect: "GET /journals/{id} returns exactly the stored publisher_id, issn, title, oa_model HYBRID, list_apc_cents 380000 and required_embargo_months 12 for the created journal."
        test_recipe:
          setup:
            - "one publisher and one HYBRID journal with list_apc_cents 380000 and required_embargo_months 12"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { c2_p_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${c2_p_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { c2_j_id: $.data.id }
          trigger:
            - call: "GET /journals/${c2_j_id}"
              as: ScholCommLibrarian
              captures: { c2_pub: $.data.publisher_id, c2_issn: $.data.issn, c2_model: $.data.oa_model, c2_apc: $.data.list_apc_cents, c2_emb: $.data.required_embargo_months }
          assert:
            - "the response returned HTTP 200"
            - "${c2_pub} == ${c2_p_id}"
            - "${c2_issn} == 2041-1723"
            - "${c2_model} == HYBRID"
            - "${c2_apc} == 380000"
            - "${c2_emb} == 12"
            - "Journal.${c2_j_id}.title == Meridian Journal of Cell Signalling"

      - name: corner_article_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /articles]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three articles stored, GET /articles with limit 2 and offset 0 returns 2 rows, total_count 3 and has_more true, while limit 2 offset 2 returns 1 row with has_more false; filtering by funding_status DRAFT returns all 3."
        test_recipe:
          setup:
            - "one publisher, one FULLY_OA journal, one author, three articles all accepted 2026-08-05 with no grant and no determination (funding_status DRAFT)"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { c3_p_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${c3_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { c3_j_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", orcid: "0000-0001-5109-3700", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { c3_au_id: $.data.id }
            - call: "POST /articles"
              payload: { journal_id: "${c3_j_id}", corresponding_author_id: "${c3_au_id}", manuscript_title: "Listing fixture one", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
            - call: "POST /articles"
              payload: { journal_id: "${c3_j_id}", corresponding_author_id: "${c3_au_id}", manuscript_title: "Listing fixture two", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
            - call: "POST /articles"
              payload: { journal_id: "${c3_j_id}", corresponding_author_id: "${c3_au_id}", manuscript_title: "Listing fixture three", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
          trigger:
            - call: "GET /articles"
              payload: { limit: 2, offset: 0 }
              as: ScholCommLibrarian
            - call: "GET /articles"
              payload: { limit: 2, offset: 2 }
              as: ScholCommLibrarian
            - call: "GET /articles"
              payload: { funding_status: "DRAFT", limit: 10, offset: 0 }
              as: ScholCommLibrarian
          assert:
            - "the first call returns exactly 2 rows with total_count == 3, limit == 2, offset == 0, has_more == true, response_type == array"
            - "the second call returns exactly 1 row with total_count == 3, offset == 2, has_more == false"
            - "the third call returns exactly 3 rows with total_count == 3 and has_more == false"
            - "no article appears in both the first and the second page"

      - name: corner_journal_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_JOURNAL_NOT_FOUND]
        distinguishing_aspect: "GET /journals/{id} with an id that was never issued returns ERR_JOURNAL_NOT_FOUND with HTTP 404 and no data payload fields."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /journals/00000000-0000-4000-8000-000000000000"
              as: ScholCommLibrarian
              captures: { c4_err: $.data.error_id }
          assert:
            - "${c4_err} == ERR_JOURNAL_NOT_FOUND"
            - "the response returned HTTP 404 with response_type == error"

      - name: corner_journal_create_missing_required_oa_model_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /journals]
        distinguishing_aspect: "POST /journals omitting the required oa_model field returns ERR_INVALID_REQUEST with HTTP 400 and creates no Journal row."
        test_recipe:
          setup:
            - "one publisher"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { c5_p_id: $.data.id }
          trigger:
            - call: "POST /journals"
              payload: { publisher_id: "${c5_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", list_apc_cents: 300000 }
              as: AgreementAdmin
              captures: { c5_err: $.data.error_id }
          assert:
            - "${c5_err} == ERR_INVALID_REQUEST"
            - "the response returned HTTP 400"
            - "GET /publishers/${c5_p_id}/journals returns exactly 0 rows"

      - name: corner_author_create_omitting_annual_cap_applies_default
        claim_type: defaults
        grounds:
          - entities.Author.fields.annual_cap_cents
          - entities.Journal.fields.required_embargo_months
        distinguishing_aspect: "Omitting annual_cap_cents on POST /authors stores 500000, and omitting required_embargo_months on POST /journals stores 12; both defaults come from §1.1, not from the request."
        test_recipe:
          setup:
            - "one publisher"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { c6_p_id: $.data.id }
          trigger:
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31" }
              as: AgreementAdmin
              captures: { c6_au_id: $.data.id, c6_cap: $.data.annual_cap_cents, c6_orcid: $.data.orcid }
            - call: "POST /journals"
              payload: { publisher_id: "${c6_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 300000 }
              as: AgreementAdmin
              captures: { c6_j_id: $.data.id, c6_emb: $.data.required_embargo_months }
          assert:
            - "${c6_cap} == 500000"
            - "${c6_orcid} == null"
            - "${c6_emb} == 12"
            - "Author.${c6_au_id}.apc_committed_cents == 0"
            - "Author.${c6_au_id}.apc_disbursed_cents == 0"
            - "Author.${c6_au_id}.linked_output_count == 0"

      - name: corner_author_committed_cents_is_computed_from_allocations
        claim_type: computed_fields
        grounds:
          - entities.Author.fields.apc_committed_cents
          - calculations.fund_utilisation_by_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / encumbrance_vs_cash_basis_fund_utilisation_divergence
          rationale: "That instance asserts Author.apc_committed_cents == 300000 and apc_disbursed_cents == 0 derived purely from the ENCUMBERED allocation row."

      - name: corner_deposit_system_fields_are_server_assigned
        claim_type: system_fields
        grounds:
          - entities.RepositoryDeposit.fields.version_ordinal
          - entities.RepositoryDeposit.fields.status
          - endpoints[POST /repository-deposits]
        distinguishing_aspect: "The first deposit of an article is stored with server-assigned version_ordinal 1, status DRAFT, persistent_identifier null, returned_count 0, version 1 and a created_at stamped from the logical clock 2026-08-10T00:00:00Z."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "publisher, FULLY_OA journal, ORCID-bearing author, article accepted 2026-08-05 with no grant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { c8_p_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${c8_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { c8_j_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", orcid: "0000-0001-5109-3700", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { c8_au_id: $.data.id }
            - call: "POST /articles"
              payload: { journal_id: "${c8_j_id}", corresponding_author_id: "${c8_au_id}", manuscript_title: "System fields on first deposit", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { c8_a_id: $.data.id, c8_a_v: $.data.version }
          trigger:
            - call: "POST /repository-deposits"
              payload: { article_id: "${c8_a_id}", version_label: "ACCEPTED_MANUSCRIPT", file_checksum: "a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90", license: "CC_BY", expected_article_version: "${c8_a_v}" }
              as: CorrespondingAuthor
              as_user_id: "${c8_au_id}"
              captures: { c8_d_id: $.data.id, c8_ordinal: $.data.version_ordinal, c8_status: $.data.status, c8_pid: $.data.persistent_identifier, c8_returned: $.data.returned_count, c8_v: $.data.version }
          assert:
            - "the response returned HTTP 201"
            - "${c8_ordinal} == 1"
            - "${c8_status} == DRAFT"
            - "${c8_pid} == null"
            - "${c8_returned} == 0"
            - "${c8_v} == 1"
            - "RepositoryDeposit.${c8_d_id}.submitted_at == null"
            - "RepositoryDeposit.${c8_d_id}.ingested_at == null"
            - "RepositoryDeposit.${c8_d_id}.created_at == 2026-08-10T00:00:00Z"
            - "Article.${c8_a_id}.latest_deposit_ordinal == 1"

      - name: corner_journal_create_with_invalid_oa_model_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Journal.fields.oa_model
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "oa_model DIAMOND_OA is outside the declared enum {FULLY_OA, HYBRID, SUBSCRIPTION} and a negative list_apc_cents is outside its >= 0 constraint; both return ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup:
            - "one publisher"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { c9_p_id: $.data.id }
          trigger:
            - call: "POST /journals"
              payload: { publisher_id: "${c9_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "DIAMOND_OA", list_apc_cents: 300000 }
              as: AgreementAdmin
              captures: { c9_err_enum: $.data.error_id }
            - call: "POST /journals"
              payload: { publisher_id: "${c9_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: -1 }
              as: AgreementAdmin
              captures: { c9_err_range: $.data.error_id }
          assert:
            - "${c9_err_enum} == ERR_INVALID_REQUEST"
            - "${c9_err_range} == ERR_INVALID_REQUEST"
            - "both calls returned HTTP 400"
            - "GET /publishers/${c9_p_id}/journals returns exactly 0 rows"

      - name: corner_agreement_coverage_is_immutable_without_version_field
        claim_type: immutability
        grounds:
          - entities.AgreementCoverage
          - endpoints[POST /transformative-agreements/{id}/coverages]
        distinguishing_aspect: "AgreementCoverage is declared common_fields: false, so its create response exposes no version and no updated_at field, and §1.5 declares no PUT / PATCH / DELETE endpoint for coverage rows."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "publisher, HYBRID journal, DRAFT agreement over [2026-07-01, 2027-07-01)"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { c10_p_id: $.data.id, c10_p_v: $.data.version }
            - call: "POST /journals"
              payload: { publisher_id: "${c10_p_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { c10_j_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${c10_p_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2027-07-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${c10_p_v}" }
              as: AgreementAdmin
              captures: { c10_ta_id: $.data.id }
          trigger:
            - call: "POST /transformative-agreements/${c10_ta_id}/coverages"
              payload: { journal_id: "${c10_j_id}", coverage_type: "READ_ONLY", covered_from: "2026-07-01", covered_until: "2027-06-30" }
              as: AgreementAdmin
              captures: { c10_cov_id: $.data.id, c10_type: $.data.coverage_type, c10_cap: $.data.capped_amount_cents }
          assert:
            - "the response returned HTTP 201"
            - "${c10_type} == READ_ONLY"
            - "${c10_cap} == null"
            - "the coverage response data contains no `version` key and no `updated_at` key"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint whose path ends in /coverages or /coverages/{id}"
            - "GET /transformative-agreements/${c10_ta_id}/coverages returns exactly 1 row with id == ${c10_cov_id}"

      - name: corner_eligibility_determination_rows_are_append_only
        claim_type: immutability
        grounds:
          - entities.EligibilityDetermination.fields.sequence_no
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_ta_full_vs_final_author_pays_coverage_window
          rationale: "That instance asserts the sequence_no 1 PROVISIONAL row is retained unchanged after the sequence_no 2 FINAL row is appended."

      - name: corner_journal_create_with_unknown_publisher_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - errors[ERR_PUBLISHER_NOT_FOUND]
          - entities.Journal.fields.publisher_id
        distinguishing_aspect: "POST /journals whose publisher_id body FK names an id that was never issued returns ERR_PUBLISHER_NOT_FOUND with HTTP 404 before any shape or uniqueness check runs."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /journals"
              payload: { publisher_id: "00000000-0000-4000-8000-000000000000", issn: "2515-0847", title: "Orphan Journal", oa_model: "FULLY_OA", list_apc_cents: 300000 }
              as: AgreementAdmin
              captures: { c12_err: $.data.error_id }
          assert:
            - "${c12_err} == ERR_PUBLISHER_NOT_FOUND"
            - "the response returned HTTP 404"

      - name: corner_coverage_junction_links_many_agreements_to_many_journals
        claim_type: graph
        grounds:
          - entities.AgreementCoverage.fields.agreement_id
          - entities.AgreementCoverage.fields.journal_id
          - endpoints[GET /journals/{id}/coverages]
          - endpoints[GET /transformative-agreements/{id}/coverages]
        distinguishing_aspect: "AgreementCoverage is a many-to-many junction: one agreement carries coverage lines on two journals and one journal is covered by two agreements, so GET /transformative-agreements/{id}/coverages returns 2 rows for the first agreement while GET /journals/{id}/coverages returns 2 rows for the shared journal."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one publisher with journals J1 and J2"
            - "agreement A1 over [2026-07-01, 2026-10-01) and agreement A2 over [2026-10-01, 2027-01-01) — adjacent, so both are legal"
            - "A1 covers J1 (2026-07-01..2026-09-30) and J2 (2026-07-01..2026-09-30)"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { c13_p_id: $.data.id, c13_p_v0: $.data.version }
            - call: "POST /journals"
              payload: { publisher_id: "${c13_p_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { c13_j1_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${c13_p_id}", issn: "2397-3374", title: "Meridian Journal of Structural Biology", oa_model: "HYBRID", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { c13_j2_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${c13_p_id}", agreement_code: "TA-MERID-H1", effective_from: "2026-07-01", effective_until: "2026-10-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${c13_p_v0}" }
              as: AgreementAdmin
              captures: { c13_ta1_id: $.data.id }
            - call: "GET /publishers/${c13_p_id}"
              as: AgreementAdmin
              captures: { c13_p_v1: $.data.version }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${c13_p_id}", agreement_code: "TA-MERID-H2", effective_from: "2026-10-01", effective_until: "2027-01-01", article_quota: 5, discount_pct: 0.25, covered_oa_models: ["HYBRID"], expected_publisher_version: "${c13_p_v1}" }
              as: AgreementAdmin
              captures: { c13_ta2_id: $.data.id }
            - call: "POST /transformative-agreements/${c13_ta1_id}/coverages"
              payload: { journal_id: "${c13_j1_id}", coverage_type: "FULL_APC", covered_from: "2026-07-01", covered_until: "2026-09-30" }
              as: AgreementAdmin
              captures: { c13_cov_a1j1: $.data.id }
            - call: "POST /transformative-agreements/${c13_ta1_id}/coverages"
              payload: { journal_id: "${c13_j2_id}", coverage_type: "CAPPED_APC", capped_amount_cents: 150000, covered_from: "2026-07-01", covered_until: "2026-09-30" }
              as: AgreementAdmin
              captures: { c13_cov_a1j2: $.data.id }
          trigger:
            - call: "POST /transformative-agreements/${c13_ta2_id}/coverages"
              payload: { journal_id: "${c13_j1_id}", coverage_type: "FULL_APC", covered_from: "2026-10-02", covered_until: "2026-12-31" }
              as: AgreementAdmin
              captures: { c13_cov_a2j1: $.data.id }
          assert:
            - "the response returned HTTP 201"
            - "AgreementCoverage.${c13_cov_a2j1}.agreement_id == ${c13_ta2_id}"
            - "AgreementCoverage.${c13_cov_a2j1}.journal_id == ${c13_j1_id}"
            - "GET /transformative-agreements/${c13_ta1_id}/coverages returns exactly 2 rows, ids ${c13_cov_a1j1} and ${c13_cov_a1j2}"
            - "GET /transformative-agreements/${c13_ta2_id}/coverages returns exactly 1 row, id ${c13_cov_a2j1}"
            - "GET /journals/${c13_j1_id}/coverages returns exactly 2 rows spanning both agreements"
            - "GET /journals/${c13_j2_id}/coverages returns exactly 1 row"

  - section: state_machines
    instances:
      - name: corner_agreement_initial_state_is_draft_with_zero_quota_used
        claim_type: initial_state
        grounds:
          - state_machines.TransformativeAgreement.initial_state
          - entities.TransformativeAgreement.fields.status
        distinguishing_aspect: "A newly drafted agreement starts at status DRAFT with articles_used 0 and activated_at null; no request field can set status directly."
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "one publisher"
          setup_api_calls:
            - call: "POST /publishers"
