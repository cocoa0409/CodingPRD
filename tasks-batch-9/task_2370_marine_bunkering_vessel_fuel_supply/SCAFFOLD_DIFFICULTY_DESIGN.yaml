              payload: { customer_id: "${cust_id}", port_id: "${port_id}", grade_id: "${grade_id}", vessel_imo: "9654321", vessel_name: "MV Boreas", scrubber_fitted: false, nominated_quantity_mt: 500.000, window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-13T06:00:00Z", delivery_mode: "BARGE", declared_sulfur_pct: 0.100, eca_documentation_ref: "CHG-2026-0003" }
