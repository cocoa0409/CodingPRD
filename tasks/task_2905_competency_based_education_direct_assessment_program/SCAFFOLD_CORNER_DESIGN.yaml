  # §1.6 requires every catalog code to be triggerable. Rather than one thin
  # instance per code, the instances below sweep whole error FAMILIES in a single
  # recipe (all fourteen 404s, all four attempt-write guards, ...) so the breadth
  # index stays readable; a YAML ledger at the end of this file maps every one of
  # the 67 declared error ids to the instance that provokes it.
  - section: errors
    instances:
      - name: every_entity_id_has_its_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_TRANSCRIPT_NOT_FOUND]
          - validations.priority_4_ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: "All fourteen entity 404s must be DISTINCT codes on the same syntactically valid but unknown UUID — an implementation that returns one generic ERR_NOT_FOUND, or that 500s on a well-formed unknown id, fails; the sweep pins each path prefix to exactly one code."
        test_recipe:
          setup:
            - "an empty database (no rows of any entity) with the logical clock at 2026-09-01T00:00:00.000Z"
            - "the phantom id 00000000-0000-4000-8000-000000000000 is used for every path"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_prog: $.data.error_id }
            - call: "GET /competencies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_comp: $.data.error_id }
            - call: "GET /assessment-blueprints/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_bp: $.data.error_id }
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_stu: $.data.error_id }
            - call: "GET /subscription-terms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_term: $.data.error_id }
            - call: "GET /mentors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_men: $.data.error_id }
            - call: "GET /mentor-assignments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_asg: $.data.error_id }
            - call: "GET /evaluators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_ev: $.data.error_id }
            - call: "GET /assessment-attempts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_att: $.data.error_id }
            - call: "GET /evaluator-scores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_sc: $.data.error_id }
            - call: "GET /integrity-cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_case: $.data.error_id }
            - call: "GET /sap-reviews/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_sap: $.data.error_id }
            - call: "GET /aid-disbursements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_dis: $.data.error_id }
            - call: "GET /transcript-records/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { e_tr: $.data.error_id }
          assert:
            - "every one of the fourteen responses has status code 404"
            - "${e_prog} == ERR_PROGRAM_NOT_FOUND"
            - "${e_comp} == ERR_COMPETENCY_NOT_FOUND"
            - "${e_bp} == ERR_BLUEPRINT_NOT_FOUND"
            - "${e_stu} == ERR_STUDENT_NOT_FOUND"
            - "${e_term} == ERR_TERM_NOT_FOUND"
            - "${e_men} == ERR_MENTOR_NOT_FOUND"
            - "${e_asg} == ERR_ASSIGNMENT_NOT_FOUND"
            - "${e_ev} == ERR_EVALUATOR_NOT_FOUND"
            - "${e_att} == ERR_ATTEMPT_NOT_FOUND"
            - "${e_sc} == ERR_SCORE_NOT_FOUND"
            - "${e_case} == ERR_CASE_NOT_FOUND"
            - "${e_sap} == ERR_SAP_REVIEW_NOT_FOUND"
            - "${e_dis} == ERR_DISBURSEMENT_NOT_FOUND"
            - "${e_tr} == ERR_TRANSCRIPT_NOT_FOUND"
            - "the fourteen error ids are pairwise distinct"

      - name: blank_identity_headers_are_unauthenticated_before_role_check
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Priority 1 outranks priority 2 and both outrank existence: a whitespace-only X-User-ID counts as ABSENT and yields 401 ERR_UNAUTHENTICATED even when the role header is impeccable and even when the path id does not exist, while a complete-but-unpermitted role yields 403 ERR_FORBIDDEN_ROLE — never 404, never 400."
        test_recipe:
          setup:
            - "a PUBLISHED program (so the target id exists) with the clock at 2026-09-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
          trigger:
            # sent with neither X-User-ID nor X-User-Role present at all
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: NONE
              captures: { e_no_headers: $.data.error_id }
            # X-User-Role: Registrar, X-User-ID: "   " (three spaces -> counts as absent)
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Registrar
              as_user_id: "   "
              captures: { e_blank_user: $.data.error_id }
            # blank identity on a path id that does not exist either: 401 still wins over 404
            - call: "GET /programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NONE
              captures: { e_blank_and_missing: $.data.error_id }
            # well-formed identity, but Student is not on this endpoint's roles list
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Student
              captures: { e_wrong_role: $.data.error_id }
          assert:
            - "${e_no_headers} == ERR_UNAUTHENTICATED"
            - "${e_blank_user} == ERR_UNAUTHENTICATED"
            - "${e_blank_and_missing} == ERR_UNAUTHENTICATED"
            - "the first three responses all have status code 401"
            - "${e_wrong_role} == ERR_FORBIDDEN_ROLE"
            - "the fourth response has status code 403"
            - "the program is still DRAFT afterwards, so none of the four calls had any effect"

      - name: student_lifecycle_guards_return_four_distinct_state_errors
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STUDENT_NOT_APPLICANT]
          - errors[ERR_STUDENT_NOT_SUSPENDED]
          - errors[ERR_STUDENT_ALREADY_CLOSED]
          - errors[ERR_STUDENT_NOT_ACTIVE]
        distinguishing_aspect: "Four different wrong-state situations on the same enrollment axis must produce four different codes: re-activating an ACTIVE student is NOT_APPLICANT, reinstating an ACTIVE student is NOT_SUSPENDED, suspending a WITHDRAWN student is ALREADY_CLOSED, and opening a term for an APPLICANT is NOT_ACTIVE — collapsing them into one generic conflict code fails."
        test_recipe:
          setup:
            - "a PUBLISHED program with one ACTIVE competency; student A ACTIVE, student B WITHDRAWN, student C still APPLICANT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_a: $.data.id }
            - call: "POST /students/${stu_a}/activate"
              payload: {}
              as: Registrar
              captures: { stu_a_v2: $.data.version }
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Bob Leaver", email: "bob@example.edu" }
              as: Registrar
              captures: { stu_b: $.data.id }
            - call: "POST /students/${stu_b}/activate"
              payload: {}
              as: Registrar
            - call: "POST /students/${stu_b}/withdraw"
              payload: { effective_utc: "2026-09-01T00:00:00.000Z", reason: "personal" }
              as: Registrar
              captures: { stu_b_status: $.data.enrollment_status }
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Cid Applicant", email: "cid@example.edu" }
              as: Registrar
              captures: { stu_c: $.data.id }
          trigger:
            - call: "POST /students/${stu_a}/activate"
              payload: {}
              as: Registrar
              captures: { e_not_applicant: $.data.error_id }
            - call: "POST /students/${stu_a}/reinstate"
              payload: {}
