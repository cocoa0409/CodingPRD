        distinguishing_aspect: "Empty-set and exact-capacity boundaries: positions == max_units (4) allows the 4th add; the 5th add is rejected. Distinct metric (unit count) from PF and runtime boundaries."
        test_recipe:
          setup: ["order exists; scheme max_units 4; 4 positions added"]
          setup_api_calls:
