            - { call: "POST /service-zones", payload: { name: "ZD", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /recalls", payload: { brand: "Kenmore", model: "MD10", description: "shock" }, as: ServiceAdmin, captures: { rec_id: "$.data.id" } }
