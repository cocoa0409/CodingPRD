      - name: error_five_fifty_blocked_on_approve
        claim_type: violation_to_error
        grounds: ["errors[ERR_FIVE_FIFTY_BLOCKED]", "validations[priority=13]"]
        distinguishing_aspect: "With five_fifty_blocked == true, APPROVING an otherwise-valid PENDING_APPROVAL dividend returns ERR_FIVE_FIFTY_BLOCKED (409) — distinct from the §1.8 declare-path instance which asserts ERR_INVALID_STATE priority."
        test_recipe:
          setup: ["Reit R1 ACTIVE; dividend D1 PENDING_APPROVAL; then a failing snapshot sets five_fifty_blocked"]
