        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[freeze-creation-stale-chart]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential freezes: the second carries the pre-first-freeze expected_chart_version and is rejected 412 ERR_STALE_VERSION; the chart has exactly one ACTIVE freeze."
        test_recipe:
          setup: ["chart with ACTIVE methodology; chart.version observed at v_obs"]
          setup_api_calls:
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-CC1", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "SNG-CC1", title: "Singles CC1", chart_kind: "SINGLES", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/methodology-versions"
              payload: { version_label: "v1", w_sales: 1.0, w_on_demand: 0.5, w_programmed: 0.2, w_airplay: 0.0001, paid_stream_divisor: 1250, ad_stream_divisor: 3750, prog_stream_divisor: 2500, tea_rate: 10, effective_from: "2026-09-01T00:00:00Z" }
              as: ChartManager
              captures: { mv_id: $.data.id }
            - call: "POST /charts/${ch_id}/methodology-versions/${mv_id}/activate"
              payload: { expected_chart_version: "${ch_ver}" }
              as: ChartManager
            - call: "GET /charts/${ch_id}"
              payload: {}
              as: ChartManager
              captures: { v_obs: $.data.version }
          trigger:
            - call: "POST /charts/${ch_id}/freeze"
              payload: { reason: "first freeze", expected_chart_version: "${v_obs}" }
              as: ChartManager
              captures: { fz1: $.data.id }
            - call: "POST /charts/${ch_id}/freeze"
              payload: { reason: "second freeze with stale view", expected_chart_version: "${v_obs}" }
              as: ChartManager
              captures: { err: $.data.error_id }
          assert:
            - "first freeze succeeds: ChartFreeze.${fz1}.status == ACTIVE"
            - "second freeze with the same (now stale) version: 412 ERR_STALE_VERSION"
            - "GET /charts/${ch_id}/freezes?status=ACTIVE returns exactly one freeze (${fz1})"

