      - name: record_finding_on_a_closed_sweep_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.SelfAssessmentSweep.IN_PROGRESS_to_CLOSED
          - errors[ERR_SWEEP_INVALID_STATE]
          - validations[priority=20]
        distinguishing_aspect: |
          POST /findings is declared only from IN_PROGRESS, so a CLOSED sweep must reject it with
          ERR_SWEEP_INVALID_STATE (409) even though the OCC version supplied is current - the state
          check must not be reachable only through a stale-version 412.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS; Property Cedar Walk with unit 101."
            - "A sweep is started and immediately closed with no findings, so closure_verified_rate is the pinned 100.00 and the close is admissible."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
              captures: { dd_lt: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /self-assessment-sweeps/${sw_id}/close"
              payload: { closed_at: "2026-08-06T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v_closed: $.data.version, sw_status: $.data.status }
          trigger:
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v_closed}", defect_definition_id: "${dd_lt}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-07T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "${sw_status} == CLOSED"
            - "the trigger returns HTTP 409 with error_id ERR_SWEEP_INVALID_STATE"
            - "SelfAssessmentSweep.${sw_id}.generated_work_order_count == 0"
            - "SelfAssessmentSweep.${sw_id}.closure_verified_rate == 100.00"
            - "GET /deficiencies?sweep_id=${sw_id} has total_count == 0"

      - name: new_sweep_starts_planned_with_pinned_default_counters
        claim_type: initial_state
        grounds:
          - state_machines.SelfAssessmentSweep.initial_state
          - entities.SelfAssessmentSweep.fields.closure_verified_rate
        distinguishing_aspect: |
          A brand-new sweep must read PLANNED with started_at and closed_at null, all four work-order
          counters 0 and closure_verified_rate pinned at 100.00 - the empty-set convention, not 0.00,
          which is what keeps an immediate close admissible.
        test_recipe:
          setup:
            - "Property Cedar Walk exists with one unit."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
