scenario: |
  Ballast Water & Vessel Environmental Compliance (US-flag vessel operator): ballast water management plan & treatment system operation, reporting form submission & recordkeeping, exchange vs treatment compliance determination by voyage, sampling/inspection & noncompliance response, garbage/sewage/oily-water record book, port state control deficiency & rectification, emissions/fuel sulfur compliance record, crew training & drills

domain_name: ballast-water-vessel-environmental
api_prefix: /vessels

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: imo_number
        type: string
        source: input
        description: "IMO number, unique per vessel"
        constraints: "unique; 7-digit numeric string"
      - name: vessel_name
        type: string
        source: input
        description: "Registered vessel name"
      - name: flag_state
        type: enum
        source: input
        description: "Flag state code; this system is scoped to US-flag vessels"
        constraints: "enum: [US]"
        default: US
      - name: bwms_type
        type: enum
        source: input
        description: "Type of ballast water management system installed"
        constraints: "enum: [NONE, EXCHANGE_ONLY, TREATMENT_USCG_TYPE_APPROVED, TREATMENT_ALTERNATIVE]"
      - name: bwms_installation_date
        type: datetime
        source: input
        description: "Date BWMS was commissioned; required iff bwms_type != NONE"
      - name: gross_tonnage
        type: integer
        source: input
        description: "Gross tonnage (GT)"
        constraints: ">= 1"
      - name: keel_laid_date
        type: datetime
        source: input
        description: "Keel laid date; drives applicability of schedule tier"
      - name: ballast_capacity_m3
        type: number
        source: input
        description: "Total ballast capacity in cubic meters"
        constraints: "> 0"
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived aggregate posture gating downstream operations: OPEN | RESTRICTED | FROZEN. OPEN = no unresolved P1 deficiencies and no ACTIVE enforcement case; RESTRICTED = one or more P1 deficiencies in OPEN state, or a critical sampling exceedance within last 180 days; FROZEN = ACTIVE enforcement case with hold_flag = true."
        constraints: "enum: [OPEN, RESTRICTED, FROZEN]"
      - name: active_enforcement_case_id
        type: string
        source: system
        description: "FK -> EnforcementCase.id; set when a case is ACTIVE; null otherwise"
      - name: last_psc_inspection_at
        type: datetime
        source: system
        description: "Timestamp of most recent PSC inspection event recorded on this vessel"

  - name: BallastWaterManagementPlan
    parent: Vessel
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: plan_revision
        type: integer
        source: input
        description: "Revision number; must be strictly increasing per vessel"
        constraints: ">= 1"
      - name: approval_authority
        type: enum
        source: input
        description: "Approving authority"
        constraints: "enum: [USCG, CLASS_SOCIETY_ON_BEHALF]"
      - name: approved_at
        type: datetime
        source: input
        description: "Date the plan revision was approved"
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> SUBMITTED -> APPROVED -> SUPERSEDED | WITHDRAWN"
        constraints: "enum: [DRAFT, SUBMITTED, APPROVED, SUPERSEDED, WITHDRAWN]"
      - name: exchange_distance_nm
        type: number
        source: input
        description: "Distance from shore at which exchange is permitted for this vessel (nm); >= 200 for open-ocean exchange"
        constraints: "> 0"
      - name: sediment_management_included
        type: boolean
        source: input
        description: "Whether plan includes sediment management procedures"

  - name: Voyage
    parent: Vessel
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: voyage_number
        type: string
        source: input
        description: "Operator-assigned voyage number; unique per vessel"
      - name: departure_port
        type: string
        source: input
        description: "UN/LOCODE of departure port"
      - name: arrival_port
        type: string
        source: input
        description: "UN/LOCODE of arrival port"
      - name: departed_at
        type: datetime
        source: input
        description: "Actual departure timestamp (UTC)"
      - name: arrived_at
        type: datetime
        source: input
        description: "Actual arrival timestamp (UTC); null until vessel arrives"
      - name: crosses_captain_of_port_zones
        type: boolean
        source: input
        description: "Whether voyage crosses multiple US Captain of the Port (COTP) zones; affects reporting obligations"
      - name: enters_us_eez
        type: boolean
        source: input
        description: "Whether voyage enters the US EEZ; gates exchange-vs-treatment determination"
      - name: compliance_status
        type: enum
        source: computed
        description: "Derived per-voyage compliance posture. PENDING -> IN_PROGRESS -> COMPLIANT | NONCOMPLIANT | EXEMPT. Parallel to reporting_status."
        constraints: "enum: [PENDING, IN_PROGRESS, COMPLIANT, NONCOMPLIANT, EXEMPT]"
      - name: reporting_status
        type: enum
        source: computed
        description: "Parallel dimension: NOT_DUE -> DUE -> SUBMITTED -> ACKNOWLEDGED | OVERDUE. Independent of compliance_status."
        constraints: "enum: [NOT_DUE, DUE, SUBMITTED, ACKNOWLEDGED, OVERDUE]"
      - name: determination_id
        type: string
        source: system
        description: "FK -> ComplianceDetermination.id; current determination for this voyage (latest by created_at)"
      - name: bw_record_book_id
        type: string
        source: system
        description: "FK -> RecordBook.id; the ballast-water record book tied to this voyage"

  - name: BallastWaterEvent
    parent: Voyage
    common_fields: false
    fields:
      - name: voyage_id
        type: string
        source: input
        description: "FK -> Voyage.id"
      - name: event_kind
        type: enum
        source: input
        description: "Kind of ballast water event"
        constraints: "enum: [UPTAKE, DISCHARGE, EXCHANGE_START, EXCHANGE_COMPLETE, TREATMENT_START, TREATMENT_COMPLETE, TANK_FLUSH, SEDIMENT_DISPOSAL]"
      - name: occurred_at
        type: datetime
        source: input
        description: "UTC timestamp of the event"
      - name: tank_id
        type: string
        source: input
        description: "Tank identifier on the vessel"
      - name: volume_m3
        type: number
        source: input
        description: "Volume of ballast water in cubic meters; > 0"
      - name: latitude
        type: number
        source: input
        description: "Latitude in decimal degrees; required for EXCHANGE_* and DISCHARGE events"
      - name: longitude
        type: number
        source: input
        description: "Longitude in decimal degrees; required for EXCHANGE_* and DISCHARGE events"
      - name: distance_from_shore_nm
        type: number
        source: input
        description: "Distance from nearest shore in nautical miles at event time; required for EXCHANGE_COMPLETE and DISCHARGE"
      - name: salinity_ppt
        type: number
        source: input
        description: "Salinity in parts per thousand; required for UPTAKE events"
      - name: source_port_locode
        type: string
        source: input
        description: "UN/LOCODE of uptake port; required for UPTAKE events"

  - name: ComplianceDetermination
    parent: Voyage
    common_fields: true
    fields:
      - name: voyage_id
        type: string
        source: input
        description: "FK -> Voyage.id"
      - name: determination_basis
        type: enum
        source: computed
        description: "Basis used: EXCHANGE_COMPLIANT | TREATMENT_COMPLIANT | EXEMPT_SAME_COTP | EXEMPT_NO_US_EEZ | NONCOMPLIANT_MIXED | NONCOMPLIANT_NO_METHOD | INSUFFICIENT_DATA"
        constraints: "enum: [EXCHANGE_COMPLIANT, TREATMENT_COMPLIANT, EXEMPT_SAME_COTP, EXEMPT_NO_US_EEZ, NONCOMPLIANT_MIXED, NONCOMPLIANT_NO_METHOD, INSUFFICIENT_DATA]"
      - name: exchange_compliant_volume_m3
        type: number
        source: computed
        description: "Volume discharged that satisfies exchange rules"
      - name: treatment_compliant_volume_m3
        type: number
        source: computed
        description: "Volume discharged that satisfies treatment rules"
      - name: noncompliant_volume_m3
        type: number
        source: computed
        description: "Volume discharged with neither exchange nor treatment satisfied"
      - name: total_discharged_volume_m3
        type: number
        source: computed
        description: "Sum of DISCHARGE event volumes in scope"
      - name: computed_at
        type: datetime
        source: system
        description: "UTC timestamp this determination was computed"
      - name: is_current
        type: boolean
        source: computed
        description: "True iff this is the latest determination for the voyage (by created_at); only one current per voyage"
      - name: trigger_reason
        type: enum
        source: input
        description: "Why determination was computed"
        constraints: "enum: [VOYAGE_DEPARTURE, BALLAST_EVENT_RECORDED, VOYAGE_ARRIVAL, MANUAL_RECOMPUTE, PLAN_AMENDMENT]"

  - name: BallastWaterReport
    parent: Voyage
    common_fields: true
    fields:
      - name: voyage_id
        type: string
        source: input
        description: "FK -> Voyage.id"
      - name: report_type
        type: enum
        source: input
        description: "Type of report"
        constraints: "enum: [PRE_ARRIVAL, POST_DISCHARGE, ANNUAL_SUMMARY]"
      - name: due_at
        type: datetime
        source: computed
        description: "Deadline for submission. PRE_ARRIVAL: 24h before arrived_at; POST_DISCHARGE: 6h after last DISCHARGE; ANNUAL_SUMMARY: Jan 31 following calendar year."
      - name: submitted_at
        type: datetime
        source: system
        description: "UTC timestamp of submission; null until submitted"
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> SUBMITTED -> ACKNOWLEDGED | REJECTED; terminal: ACKNOWLEDGED, REJECTED"
        constraints: "enum: [DRAFT, SUBMITTED, ACKNOWLEDGED, REJECTED]"
      - name: payload_summary
        type: object
        source: input
        description: "Free-form summary of reported events"
      - name: rejection_reason
        type: string
        source: system
        description: "Set when status = REJECTED"
      - name: is_overdue
        type: boolean
        source: computed
        description: "True iff status = DRAFT and current UTC > due_at"

  - name: SamplingInspection
    parent: Voyage
    common_fields: true
    fields:
      - name: voyage_id
        type: string
        source: input
        description: "FK -> Voyage.id"
      - name: inspection_kind
        type: enum
        source: input
        description: "Kind of sampling or inspection"
        constraints: "enum: [PORT_STATE_CONTROL, FLAG_STATE, CLASS_SOCIETY, COMPANY_INTERNAL]"
      - name: sampled_at
        type: datetime
        source: input
        description: "UTC timestamp sample was drawn or inspection occurred"
      - name: sampled_by_role
        type: enum
        source: input
        description: "Role that recorded the sampling"
        constraints: "enum: [PSC_OFFICER, FLAG_SURVEYOR, COMPANY_AUDITOR]"
      - name: indicator_organism_concentration
        type: number
        source: input
        description: "Measured indicator organism concentration (cfu/100mL); >= 0"
      - name: tss_mg_per_l
        type: number
        source: input
        description: "Total suspended solids mg/L; >= 0"
      - name: findings
        type: array
        source: input
        description: "Array of finding codes; empty array when clean"
      - name: status
        type: enum
        source: computed
        description: "RECORDED -> EVALUATED -> CLOSED; REOPENED is reachable from CLOSED on appeal"
        constraints: "enum: [RECORDED, EVALUATED, CLOSED, REOPENED]"
      - name: exceeded
        type: boolean
        source: computed
        description: "True iff any measured parameter exceeds its regulatory threshold"

  - name: NoncomplianceRecord
    parent: Voyage
    common_fields: true
    fields:
      - name: voyage_id
        type: string
        source: input
        description: "FK -> Voyage.id"
      - name: source_type
        type: enum
        source: input
        description: "What triggered this record"
        constraints: "enum: [SAMPLING_EXCEEDANCE, REPORT_OVERDUE, MISSING_METHOD, PSC_DEFICIENCY, DETERMINATION_NONCOMPLIANT]"
      - name: source_id
        type: string
        source: input
        description: "ID of the source entity (SamplingInspection.id, BallastWaterReport.id, etc.)"
      - name: severity
        type: enum
        source: computed
        description: "Derived from source and context: MINOR | MAJOR | CRITICAL"
        constraints: "enum: [MINOR, MAJOR, CRITICAL]"
      - name: detected_at
        type: datetime
        source: system
        description: "UTC timestamp of detection"
      - name: response_status
        type: enum
        source: computed
        description: "OPEN -> RESPONDED -> CLOSED | ESCALATED"
        constraints: "enum: [OPEN, RESPONDED, CLOSED, ESCALATED]"
      - name: response_due_at
        type: datetime
        source: computed
        description: "UTC deadline for operator response: MINOR + 30 days; MAJOR + 14 days; CRITICAL + 72 hours from detected_at"
      - name: escalated_to_case_id
        type: string
        source: system
        description: "FK -> EnforcementCase.id; set when response_status = ESCALATED"

  - name: PortStateControlDeficiency
    parent: Vessel
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: voyage_id
        type: string
        source: input
        description: "FK -> Voyage.id; voyage during which deficiency was identified"
      - name: psc_inspection_id
        type: string
        source: input
        description: "FK -> SamplingInspection.id (inspection_kind = PORT_STATE_CONTROL)"
      - name: deficiency_code
        type: string
        source: input
        description: "PSC deficiency code (e.g., 14806 Ballast Water Management Plan)"
      - name: action_code
        type: enum
        source: input
        description: "PSC action code: 10 (rectify before departure), 15 (rectify within 14 days), 16 (rectify within 30 days), 17 (master instructed), 99 (other)"
        constraints: "enum: [A10, A15, A16, A17, A99]"
      - name: rectification_deadline
        type: datetime
        source: computed
        description: "Computed from action_code: A10 = vessel departure; A15 = identified_at + 14 days; A16 = +30 days; A17 = +7 days; A99 = +21 days"
      - name: identified_at
        type: datetime
        source: input
        description: "UTC timestamp deficiency was identified"
      - name: rectification_status
        type: enum
        source: computed
        description: "OPEN -> RECTIFYING -> RECTIFIED -> VERIFIED | REOPENED; terminal: VERIFIED"
        constraints: "enum: [OPEN, RECTIFYING, RECTIFIED, VERIFIED, REOPENED]"
      - name: rectified_at
        type: datetime
        source: system
        description: "UTC timestamp of rectification claim"
      - name: verified_at
        type: datetime
        source: system
        description: "UTC timestamp of PSC verification"
      - name: is_priority_one
        type: boolean
        source: computed
        description: "True iff action_code IN {A10, A15} — these block departure and feed compliance_posture"

  - name: RecordBook
    parent: Vessel
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: book_kind
        type: enum
        source: input
        description: "Kind of record book"
        constraints: "enum: [BALLAST_WATER, GARBAGE, SEWAGE, OILY_WATER]"
      - name: voyage_id
        type: string
        source: input
        description: "FK -> Voyage.id; voyage this book covers (null for standing ship-level books); the BALLAST_WATER book is voyage-scoped"
      - name: status
        type: enum
        source: computed
        description: "OPEN -> SEALED; sealed books are immutable and archived"
        constraints: "enum: [OPEN, SEALED]"

  - name: RecordBookEntry
    parent: RecordBook
    common_fields: false
    fields:
      - name: record_book_id
        type: string
        source: input
        description: "FK -> RecordBook.id"
      - name: entry_kind
        type: enum
        source: input
        description: "Entry kind specific to book_kind. BALLAST_WATER: [UPTAKE, DISCHARGE, EXCHANGE, TREATMENT, TANK_FLUSH]; GARBAGE: [DISCHARGE_SEA, DISCHARGE_RECEPTION, INCINERATION]; SEWAGE: [DISCHARGE_TREATED, DISCHARGE_UNTREATED]; OILY_WATER: [BILGE_DISCHARGE, SLUDGE_DISPOSAL, ODM_FLUSH]"
        constraints: "enum: [UPTAKE, DISCHARGE, EXCHANGE, TREATMENT, TANK_FLUSH, DISCHARGE_SEA, DISCHARGE_RECEPTION, INCINERATION, DISCHARGE_TREATED, DISCHARGE_UNTREATED, BILGE_DISCHARGE, SLUDGE_DISPOSAL, ODM_FLUSH]"
      - name: occurred_at
        type: datetime
        source: input
        description: "UTC timestamp of the recorded event"
      - name: quantity
        type: number
        source: input
        description: "Volume (m3) or mass (kg) depending on kind; > 0"
      - name: position_lat
        type: number
        source: input
        description: "Latitude at event; required for discharge-type entries"
      - name: position_lon
        type: number
        source: input
        description: "Longitude at event; required for discharge-type entries"
      - name: distance_from_shore_nm
        type: number
        source: input
        description: "Distance from shore; required for DISCHARGE_SEA, DISCHARGE_UNTREATED, BILGE_DISCHARGE"
      - name: signed_by
        type: string
        source: input
        description: "Crew member name signing the entry"
      - name: countersigned_by
        type: string
        source: input
        description: "Officer countersignature; required for OILY_WATER and SEWAGE entries"

  - name: EmissionsFuelRecord
    parent: Voyage
    common_fields: true
    fields:
      - name: voyage_id
        type: string
        source: input
        description: "FK -> Voyage.id"
      - name: fuel_type
        type: enum
        source: input
        description: "Fuel consumed"
        constraints: "enum: [HFO, VLSFO, MGO, MDO, LNG, BIOFUEL_BLEND]"
      - name: sulfur_content_pct
        type: number
        source: input
        description: "Measured sulfur content in percent by mass"
        constraints: ">= 0"
      - name: consumed_volume_mt
        type: number
        source: input
        description: "Metric tons of fuel consumed on this voyage"
        constraints: "> 0"
      - name: inside_eca_hours
        type: number
        source: input
        description: "Hours operated inside an Emission Control Area on this voyage"
        constraints: ">= 0"
      - name: outside_eca_hours
        type: number
        source: input
        description: "Hours operated outside ECAs"
        constraints: ">= 0"
      - name: compliance_status
        type: enum
        source: computed
        description: "PENDING_EVAL -> COMPLIANT | NONCOMPLIANT | EXEMPT_SCRUBBER"
        constraints: "enum: [PENDING_EVAL, COMPLIANT, NONCOMPLIANT, EXEMPT_SCRUBBER]"
      - name: scrubber_installed
        type: boolean
        source: input
        description: "Whether an approved EGCS (scrubber) was in use"

  - name: CrewTrainingDrill
    parent: Vessel
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: drill_kind
        type: enum
        source: input
        description: "Kind of drill/training"
        constraints: "enum: [BWMS_OPERATION, EMERGENCY_BALLAST_EXCHANGE, OIL_SPILL_RESPONSE, SEWAGE_SYSTEM, GARBAGE_MANAGEMENT, MARPOL_AWARENESS]"
      - name: scheduled_for
        type: datetime
        source: input
        description: "UTC timestamp drill is scheduled"
      - name: completed_at
        type: datetime
        source: system
        description: "UTC timestamp of completion; null until completed"
      - name: completion_status
        type: enum
        source: computed
        description: "SCHEDULED -> COMPLETED | OVERDUE | CANCELLED"
        constraints: "enum: [SCHEDULED, COMPLETED, OVERDUE, CANCELLED]"
      - name: attendees
        type: array
        source: input
        description: "Array of crew names attending; must include at least one officer for BWMS_OPERATION"
      - name: officer_present
        type: boolean
        source: computed
        description: "True iff attendees includes a crew with rank officer; required for BWMS_OPERATION completion"
      - name: next_due_at
        type: datetime
        source: computed
        description: "Next due date = completed_at + recurrence_interval for the drill_kind; null if not completed"

  - name: EnforcementCase
    parent: Vessel
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: opened_at
        type: datetime
        source: system
        description: "UTC timestamp case was opened"
      - name: opened_reason
        type: string
        source: input
        description: "Why the case was opened"
      - name: severity
        type: enum
        source: input
        description: "Case severity"
        constraints: "enum: [NOTICE_OF_VIOLATION, CIVIL_PENALTY, DETENTION_ORDER]"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE -> UNDER_REVIEW -> CLOSED_COMPLIANT | CLOSED_PENALTY | WITHDRAWN; terminal: CLOSED_COMPLIANT, CLOSED_PENALTY, WITHDRAWN"
        constraints: "enum: [ACTIVE, UNDER_REVIEW, CLOSED_COMPLIANT, CLOSED_PENALTY, WITHDRAWN]"
      - name: hold_flag
        type: boolean
        source: input
        description: "When true, sets vessel.compliance_posture = FROZEN; only settable for DETENTION_ORDER"
        default: false
      - name: linked_noncompliance_ids
        type: array
        source: input
        description: "Array of NoncomplianceRecord.id escalated into this case"
      - name: closed_at
        type: datetime
        source: system
        description: "UTC timestamp of closure"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BallastWaterManagementPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vessels/{vessel_id}/plans/{plan_id}/submit"
        actor: ShoreComplianceOfficer
        preconditions:
          - "plan.status == DRAFT"
          - "vessel.bwms_type != NONE OR plan.sediment_management_included == true"
        side_effects:
          - "vessel.version increments by 1 (cascade — parent OCC)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vessels/{vessel_id}/plans/{plan_id}/approve"
        actor: FlagSurveyor
        preconditions:
          - "plan.status == SUBMITTED"
          - "no other plan for same vessel in APPROVED state with plan_revision > this.plan_revision"
        side_effects:
          - "any prior APPROVED plan for vessel transitions to SUPERSEDED"
          - "vessel.version increments by 1"
          - "recompute ComplianceDetermination for every non-terminal Voyage of vessel (trigger_reason=PLAN_AMENDMENT)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /vessels/{vessel_id}/plans/{plan_id}/withdraw"
        actor: ShoreComplianceOfficer
        preconditions:
          - "plan.status == SUBMITTED"
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade on approval of a higher plan_revision"
        actor: system
        preconditions:
          - "a plan with strictly higher plan_revision transitioned SUBMITTED -> APPROVED for the same vessel"
        side_effects:
          - "the newly approved plan becomes the governing plan for ComplianceDetermination"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /vessels/{vessel_id}/plans/{plan_id}/withdraw"
        actor: ShoreComplianceOfficer
        preconditions:
          - "plan.status == DRAFT"
        side_effects: []

  - entity: Voyage
    initial_state: "PENDING (compliance_status) × NOT_DUE (reporting_status)"
    terminal_states: ["COMPLIANT × ACKNOWLEDGED", "NONCOMPLIANT × ACKNOWLEDGED", "EXEMPT × ACKNOWLEDGED"]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "system on departed_at set via POST /vessels/{vessel_id}/voyages/{voyage_id}/depart"
        actor: VesselMaster
        preconditions:
          - "voyage.compliance_status == PENDING"
          - "vessel.compliance_posture != FROZEN"
          - "vessel has at least one BallastWaterManagementPlan in APPROVED state"
        side_effects:
          - "compute ComplianceDetermination with trigger_reason=VOYAGE_DEPARTURE"
          - "create voyage-scoped RecordBook with book_kind=BALLAST_WATER, status=OPEN"
      - from: IN_PROGRESS
        to: COMPLIANT
        trigger: "system on arrival when current ComplianceDetermination.determination_basis IN {EXCHANGE_COMPLIANT, TREATMENT_COMPLIANT}"
        actor: system
        preconditions:
          - "voyage.compliance_status == IN_PROGRESS"
          - "voyage.arrived_at is set"
          - "latest ComplianceDetermination.determination_basis IN {EXCHANGE_COMPLIANT, TREATMENT_COMPLIANT}"
        side_effects:
          - "vessel.version increments by 1"
      - from: IN_PROGRESS
        to: NONCOMPLIANT
        trigger: "system on arrival when determination_basis IN {NONCOMPLIANT_MIXED, NONCOMPLIANT_NO_METHOD} OR any OPEN NoncomplianceRecord for voyage with severity IN {MAJOR, CRITICAL}"
        actor: system
        preconditions:
          - "voyage.compliance_status == IN_PROGRESS"
          - "voyage.arrived_at is set"
          - "determination noncompliant OR OPEN major/critical NoncomplianceRecord"
        side_effects:
          - "create NoncomplianceRecord with source_type=DETERMINATION_NONCOMPLIANT if not already present"
          - "vessel.version increments by 1"
      - from: IN_PROGRESS
        to: EXEMPT
        trigger: "system on arrival when determination_basis IN {EXEMPT_SAME_COTP, EXEMPT_NO_US_EEZ}"
        actor: system
        preconditions:
          - "voyage.compliance_status == IN_PROGRESS"
          - "voyage.arrived_at is set"
        side_effects: []
      - from: NOT_DUE
        to: DUE
        trigger: "system on voyage.depart (reporting_status axis)"
        actor: system
        preconditions:
          - "voyage.reporting_status == NOT_DUE"
        side_effects:
          - "instantiate PRE_ARRIVAL BallastWaterReport with status=DRAFT and due_at = arrived_at - 24h"
      - from: DUE
        to: SUBMITTED
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/reports/{report_id}/submit"
        actor: VesselMaster
        preconditions:
          - "report.status == DRAFT"
          - "voyage.reporting_status == DUE or OVERDUE"
        side_effects:
          - "report.submitted_at = current UTC"
          - "voyage.reporting_status -> SUBMITTED"
      - from: DUE
        to: OVERDUE
        trigger: "system on current UTC > report.due_at while report.status == DRAFT"
        actor: system
        preconditions:
          - "report.status == DRAFT"
          - "current UTC > report.due_at"
        side_effects:
          - "voyage.reporting_status -> OVERDUE"
          - "create NoncomplianceRecord source_type=REPORT_OVERDUE, severity=MINOR"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/reports/{report_id}/acknowledge"
        actor: FlagSurveyor
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "voyage.reporting_status -> ACKNOWLEDGED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/reports/{report_id}/reject"
        actor: FlagSurveyor
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "report.rejection_reason set"
          - "voyage.reporting_status -> DUE (must resubmit)"

  - entity: SamplingInspection
    initial_state: RECORDED
    terminal_states: [CLOSED]
    transitions:
      - from: RECORDED
        to: EVALUATED
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/inspections/{inspection_id}/evaluate"
        actor: FlagSurveyor
        preconditions:
          - "inspection.status == RECORDED"
        side_effects:
          - "set exceeded = (indicator_organism_concentration > ORGANISM_THRESHOLD) OR (tss_mg_per_l > TSS_THRESHOLD)"
          - "if exceeded AND inspection_kind == PORT_STATE_CONTROL, create PortStateControlDeficiency (action_code=A15 default)"
          - "if exceeded, create NoncomplianceRecord source_type=SAMPLING_EXCEEDANCE, severity=MAJOR"
          - "if exceeded, vessel.compliance_posture recomputed -> may become RESTRICTED"
      - from: EVALUATED
        to: CLOSED
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/inspections/{inspection_id}/close"
        actor: FlagSurveyor
        preconditions:
          - "inspection.status == EVALUATED"
          - "if exceeded == true then every linked NoncomplianceRecord has response_status IN {RESPONDED, CLOSED}"
        side_effects:
          - "vessel.version increments by 1"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/inspections/{inspection_id}/reopen"
        actor: FlagSurveyor
        preconditions:
          - "inspection.status == CLOSED"
          - "current UTC <= sampled_at + 90 days"
        side_effects:
          - "any NoncomplianceRecord previously closed under this inspection transitions CLOSED -> OPEN"
          - "vessel.compliance_posture recomputed"

  - entity: NoncomplianceRecord
    initial_state: OPEN
    terminal_states: [CLOSED, ESCALATED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/noncompliance/{record_id}/respond"
        actor: ShoreComplianceOfficer
        preconditions:
          - "record.response_status == OPEN"
          - "current UTC <= record.response_due_at"
        side_effects:
          - "vessel.version increments by 1"
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/noncompliance/{record_id}/close"
        actor: FlagSurveyor
        preconditions:
          - "record.response_status == RESPONDED"
        side_effects:
          - "vessel.compliance_posture recomputed"
      - from: OPEN
        to: ESCALATED
        trigger: "system when current UTC > response_due_at + 7 days OR severity == CRITICAL and 24h elapsed without response"
        actor: system
        preconditions:
          - "record.response_status == OPEN"
          - "response_due_at + 7 days < current UTC OR (severity == CRITICAL AND detected_at + 24h < current UTC)"
        side_effects:
          - "create EnforcementCase if none active; else attach to existing ACTIVE case"
          - "record.escalated_to_case_id set"
          - "vessel.active_enforcement_case_id set"
          - "vessel.compliance_posture -> FROZEN if case.hold_flag else RESTRICTED"

  - entity: PortStateControlDeficiency
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: RECTIFYING
        trigger: "POST /vessels/{vessel_id}/deficiencies/{deficiency_id}/begin-rectification"
        actor: VesselMaster
        preconditions:
          - "deficiency.rectification_status == OPEN"
        side_effects:
          - "vessel.version increments by 1"
      - from: RECTIFYING
        to: RECTIFIED
        trigger: "POST /vessels/{vessel_id}/deficiencies/{deficiency_id}/claim-rectified"
        actor: VesselMaster
        preconditions:
          - "deficiency.rectification_status == RECTIFYING"
        side_effects:
          - "deficiency.rectified_at = current UTC"
      - from: RECTIFIED
        to: VERIFIED
        trigger: "POST /vessels/{vessel_id}/deficiencies/{deficiency_id}/verify"
        actor: PSCOfficer
        preconditions:
          - "deficiency.rectification_status == RECTIFIED"
          - "verifying PSCOfficer != the VesselMaster who claimed rectification (segregation of duties)"
        side_effects:
          - "deficiency.verified_at = current UTC"
          - "vessel.compliance_posture recomputed"
          - "if deficiency.is_priority_one and all other P1 deficiencies are VERIFIED, vessel.compliance_posture may lift from RESTRICTED to OPEN"
      - from: RECTIFIED
        to: REOPENED
        trigger: "POST /vessels/{vessel_id}/deficiencies/{deficiency_id}/reject-verification"
        actor: PSCOfficer
        preconditions:
          - "deficiency.rectification_status == RECTIFIED"
        side_effects:
          - "deficiency.rectification_status -> OPEN"
          - "rectification_deadline extended by 7 days"
          - "vessel.compliance_posture recomputed"
      - from: OPEN
        to: REOPENED
        trigger: "not a valid transition — REOPENED only reachable from RECTIFIED on reject-verification"
        actor: PSCOfficer
        preconditions: []
        side_effects: []

  - entity: RecordBook
    initial_state: OPEN
    terminal_states: [SEALED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /vessels/{vessel_id}/record-books/{book_id}/seal"
        actor: VesselMaster
        preconditions:
          - "book.status == OPEN"
          - "if book_kind == BALLAST_WATER then voyage.compliance_status IN {COMPLIANT, NONCOMPLIANT, EXEMPT}"
          - "every RecordBookEntry in book has countersigned_by set if required by entry_kind"
        side_effects:
          - "vessel.version increments by 1"

  - entity: EmissionsFuelRecord
    initial_state: PENDING_EVAL
    terminal_states: [COMPLIANT, NONCOMPLIANT, EXEMPT_SCRUBBER]
    transitions:
      - from: PENDING_EVAL
        to: COMPLIANT
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/emissions/{record_id}/evaluate"
        actor: ShoreComplianceOfficer
        preconditions:
          - "record.compliance_status == PENDING_EVAL"
          - "compliant under sulfur thresholds: inside ECA <= 0.10%; outside ECA <= 0.50%; weighted blend considered"
        side_effects:
          - "vessel.version increments by 1"
      - from: PENDING_EVAL
        to: NONCOMPLIANT
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/emissions/{record_id}/evaluate"
        actor: ShoreComplianceOfficer
        preconditions:
          - "record.compliance_status == PENDING_EVAL"
          - "sulfur thresholds violated"
        side_effects:
          - "create NoncomplianceRecord source_type=DETERMINATION_NONCOMPLIANT severity=MAJOR"
          - "vessel.compliance_posture recomputed"
      - from: PENDING_EVAL
        to: EXEMPT_SCRUBBER
        trigger: "POST /vessels/{vessel_id}/voyages/{voyage_id}/emissions/{record_id}/evaluate"
        actor: ShoreComplianceOfficer
        preconditions:
          - "record.compliance_status == PENDING_EVAL"
          - "scrubber_installed == true AND EGCS operational for >= 95% of inside_eca_hours"
        side_effects: []

  - entity: CrewTrainingDrill
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /vessels/{vessel_id}/drills/{drill_id}/complete"
        actor: VesselMaster
        preconditions:
          - "drill.completion_status == SCHEDULED"
          - "if drill_kind == BWMS_OPERATION then officer_present == true"
        side_effects:
          - "completed_at = current UTC"
          - "next_due_at = completed_at + recurrence(drill_kind): BWMS_OPERATION=90d, EMERGENCY_BALLAST_EXCHANGE=180d, OIL_SPILL_RESPONSE=90d, SEWAGE_SYSTEM=180d, GARBAGE_MANAGEMENT=180d, MARPOL_AWARENESS=365d"
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system when current UTC > scheduled_for + 30 days"
        actor: system
        preconditions:
          - "drill.completion_status == SCHEDULED"
        side_effects:
          - "if drill_kind IN {BWMS_OPERATION, OIL_SPILL_RESPONSE} then create NoncomplianceRecord source_type=MISSING_METHOD severity=MINOR"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vessels/{vessel_id}/drills/{drill_id}/cancel"
        actor: VesselMaster
        preconditions:
          - "drill.completion_status == SCHEDULED"
          - "current UTC <= scheduled_for"
        side_effects: []

  - entity: EnforcementCase
    initial_state: ACTIVE
    terminal_states: [CLOSED_COMPLIANT, CLOSED_PENALTY, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /vessels/{vessel_id}/enforcement-cases/{case_id}/submit-response"
        actor: ShoreComplianceOfficer
        preconditions:
          - "case.status == ACTIVE"
        side_effects:
          - "vessel.version increments by 1"
      - from: UNDER_REVIEW
        to: CLOSED_COMPLIANT
        trigger: "POST /vessels/{vessel_id}/enforcement-cases/{case_id}/close"
        actor: FlagSurveyor
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "every linked NoncomplianceRecord has response_status == CLOSED"
        side_effects:
          - "case.closed_at = current UTC"
          - "vessel.active_enforcement_case_id = null"
          - "vessel.compliance_posture recomputed"
      - from: UNDER_REVIEW
        to: CLOSED_PENALTY
        trigger: "POST /vessels/{vessel_id}/enforcement-cases/{case_id}/close with penalty_assessed=true"
        actor: FlagSurveyor
        preconditions:
          - "case.status == UNDER_REVIEW"
        side_effects:
          - "case.closed_at = current UTC"
          - "vessel.active_enforcement_case_id = null"
          - "vessel.compliance_posture recomputed"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /vessels/{vessel_id}/enforcement-cases/{case_id}/withdraw"
        actor: FlagSurveyor
        preconditions:
          - "case.status == ACTIVE"
        side_effects:
          - "case.closed_at = current UTC"
          - "vessel.active_enforcement_case_id = null"
          - "vessel.compliance_posture recomputed"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-vessel
    parent_entity: Vessel
    write_endpoint: "POST /vessels/{vessel_id}/plans"
    occ_field: "expected_vessel_version"
    description: |
      Creating a new BallastWaterManagementPlan against a Vessel whose version has advanced
      since the client last observed it is rejected. This captures the case where another
      writer has just amended the vessel's BWMS config or approved a different plan revision
      (which legitimately supersedes the prior under §1.2), leaving the current writer's view
      of the vessel stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: voyage-event-stale-voyage
    parent_entity: Voyage
    write_endpoint: "POST /vessels/{vessel_id}/voyages/{voyage_id}/ballast-events"
    occ_field: "expected_voyage_version"
    description: |
      Recording a BallastWaterEvent against a Voyage whose version has advanced since the
      client last observed it is rejected. This captures the case where another writer has
      just recorded an event that changed the voyage's ballast-handling position (for example
      an EXCHANGE_COMPLETE that supersedes an earlier discharge decision), leaving the
      current writer's view of the voyage stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: rectification-stale-deficiency
    parent_entity: PortStateControlDeficiency
    write_endpoint: "POST /vessels/{vessel_id}/deficiencies/{deficiency_id}/claim-rectified"
    occ_field: "expected_deficiency_version"
    description: |
      Claiming a deficiency rectified against a PortStateControlDeficiency whose version has
      advanced since the client last observed it is rejected. This captures the case where
      a PSC officer has just amended the deficiency's action_code or deadline (which
      legitimately supersedes the prior rectification plan), leaving the master's view of
      the deficiency stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: exchange_vs_treatment_determination
    trigger: "on Voyage.depart, on every BallastWaterEvent POST (after persistence), on Voyage.arrive, and on BallastWaterManagementPlan approval (PLAN_AMENDMENT)"
    algorithm: constraint_propagation
    formula: |
      Let P = governing BallastWaterManagementPlan for vessel (highest plan_revision in APPROVED state).
      Let E = set of BallastWaterEvent rows for voyage, ordered by occurred_at ASC, then by created_at ASC (tie-break).
      Let D = DISCHARGE events in E.
      Let U = UPTAKE events in E.
      Let XC = EXCHANGE_COMPLETE events in E.
      Let TC = TREATMENT_COMPLETE events in E.

      total_discharged = sum(D.volume_m3)

      # Volume attribution (chronological per tank): a DISCHARGE is attributed to the most recent
      # prior UPTAKE on the same tank_id. If no prior UPTAKE exists for the tank, the DISCHARGE
      # is unattributed and counts as NONCOMPLIANT_NO_METHOD.

      for each discharge d in D (in occurred_at order):
        source_uptake = latest u in U where u.tank_id == d.tank_id AND u.occurred_at <= d.occurred_at
        if source_uptake is null:
          noncompliant_volume += d.volume_m3
          continue

        # Check treatment path
        treatment_ok = exists tc in TC where tc.tank_id == d.tank_id AND
                       source_uptake.occurred_at <= tc.occurred_at <= d.occurred_at
        # Check exchange path
        exchange_ok = exists xc in XC where xc.tank_id == d.tank_id AND
                      source_uptake.occurred_at <= xc.occurred_at <= d.occurred_at AND
                      xc.distance_from_shore_nm >= P.exchange_distance_nm AND
                      xc.latitude/longitude inside open-ocean exchange area

        # Voyage-level exemption checks
        if voyage.enters_us_eez == false:
          determination_basis = EXEMPT_NO_US_EEZ; stop.
        if voyage.crosses_captain_of_port_zones == false AND
           source_uptake.port and d.port are within the same COTP zone:
          determination_basis = EXEMPT_SAME_COTP; stop.

        if treatment_ok AND NOT exchange_ok:
          treatment_compliant_volume += d.volume_m3
        elif exchange_ok AND NOT treatment_ok:
          exchange_compliant_volume += d.volume_m3
        elif treatment_ok AND exchange_ok:
          # Prefer treatment when both satisfied (more stringent standard)
          treatment_compliant_volume += d.volume_m3
        else:
          noncompliant_volume += d.volume_m3

      if noncompliant_volume == 0 AND treatment_compliant_volume > 0 AND exchange_compliant_volume == 0:
        determination_basis = TREATMENT_COMPLIANT
      elif noncompliant_volume == 0 AND exchange_compliant_volume > 0 AND treatment_compliant_volume == 0:
        determination_basis = EXCHANGE_COMPLIANT
      elif noncompliant_volume == 0 AND exchange_compliant_volume > 0 AND treatment_compliant_volume > 0:
        determination_basis = TREATMENT_COMPLIANT   # treatment preferred
      elif noncompliant_volume > 0 AND (exchange_compliant_volume > 0 OR treatment_compliant_volume > 0):
        determination_basis = NONCOMPLIANT_MIXED
      elif noncompliant_volume > 0:
        determination_basis = NONCOMPLIANT_NO_METHOD
      else:
        determination_basis = INSUFFICIENT_DATA
    input_set: "BallastWaterEvent rows for the voyage; governing BallastWaterManagementPlan for the vessel"
    constants:
      OPEN_OCEAN_MIN_NM: 200
      TIE_BREAK: "created_at ASC"
    precision: "volumes to 3 decimal places, round_half_up"
    variants:
      - name: provisional_at_departure
        when: "trigger_reason == VOYAGE_DEPARTURE; discharge events may not yet exist"
        difference: "yields INSUFFICIENT_DATA unless UPTAKE events already imply a future method; used to gate further events"
      - name: final_at_arrival
        when: "trigger_reason == VOYAGE_ARRIVAL; all events finalized"
        difference: "commits the voyage.compliance_status transition; writes the canonical determination"

  - name: report_due_at_computation
    trigger: "on Voyage.depart (PRE_ARRIVAL), on first DISCHARGE event (POST_DISCHARGE), on Jan 1 (ANNUAL_SUMMARY)"
    algorithm: forward_looking
    formula: |
      if report_type == PRE_ARRIVAL:
        due_at = voyage.arrived_at - 24 hours
      elif report_type == POST_DISCHARGE:
        last_discharge = latest BallastWaterEvent of kind=DISCHARGE on voyage
        due_at = last_discharge.occurred_at + 6 hours
      elif report_type == ANNUAL_SUMMARY:
        due_at = next Jan 31 23:59:59Z after calendar year end
    input_set: "Voyage and its BallastWaterEvent DISCHARGE rows"
    constants:
      PRE_ARRIVAL_LEAD_HOURS: 24
      POST_DISCHARGE_GRACE_HOURS: 6
    precision: "UTC timestamps to the second"
    variants:
      - name: statutory_calendar_year
        when: "report_type == ANNUAL_SUMMARY"
        difference: "aggregation across all voyages in calendar year rather than per-voyage"

  - name: sampling_exceedance_threshold
    trigger: "on POST .../inspections/{id}/evaluate"
    algorithm: threshold
    formula: |
      ORGANISM_LIMIT = 10 cfu/100mL  (E. coli / enterococci combined indicator)
      TSS_LIMIT = 50 mg/L
      exceeded = (indicator_organism_concentration >= ORGANISM_LIMIT) OR (tss_mg_per_l >= TSS_LIMIT)
      # NOTE: >= (not >). A reading of exactly 10 cfu/100mL is an exceedance.
    input_set: "single SamplingInspection row"
    constants:
      ORGANISM_LIMIT: 10
      TSS_LIMIT: 50
    precision: "single-precision comparison"
    variants:
      - name: statutory_limit
        when: "inspection_kind IN {PORT_STATE_CONTROL, FLAG_STATE}"
        difference: "uses statutory limits above"
      - name: internal_stricter
        when: "inspection_kind == COMPANY_INTERNAL"
        difference: "uses ORGANISM_LIMIT = 5 and TSS_LIMIT = 25 (company policy stricter than statutory)"

  - name: rectification_deadline_from_action_code
    trigger: "on PortStateControlDeficiency create"
    algorithm: chronological
    formula: |
      A10: deadline = voyage.departed_at if voyage not yet departed else identified_at + 0 (must rectify before departure)
      A15: deadline = identified_at + 14 days
      A16: deadline = identified_at + 30 days
      A17: deadline = identified_at + 7 days
      A99: deadline = identified_at + 21 days
    input_set: "single PortStateControlDeficiency + its voyage"
    constants:
      A15_DAYS: 14
      A16_DAYS: 30
      A17_DAYS: 7
      A99_DAYS: 21
    precision: "UTC to the second"

  - name: sulfur_compliance_evaluation
    trigger: "on POST .../emissions/{id}/evaluate"
    algorithm: tiered_pricing
    formula: |
      ECA_LIMIT = 0.10
      GLOBAL_LIMIT = 0.50
      SCRUBBER_MIN_ECA_FRACTION = 0.95

      if scrubber_installed:
        # EGCS exempts fuel sulfur limit provided it operated >= 95% of ECA hours
        if inside_eca_hours > 0:
          return EXEMPT_SCRUBBER
        else:
          return COMPLIANT
      else:
        # weighted average sulfur across ECA and non-ECA hours is NOT permitted;
        # the fuel sulfur must satisfy the strictest applicable zone for the hours burned
        eca_ok = (inside_eca_hours == 0) OR (sulfur_content_pct <= ECA_LIMIT)
        global_ok = sulfur_content_pct <= GLOBAL_LIMIT
        if eca_ok AND global_ok:
          return COMPLIANT
        else:
          return NONCOMPLIANT
    input_set: "single EmissionsFuelRecord"
    constants:
      ECA_LIMIT: 0.10
      GLOBAL_LIMIT: 0.50
      SCRUBBER_MIN_ECA_FRACTION: 0.95
    precision: "percentages to 3 decimal places, round_half_up; boundary uses <= (0.10% exactly is compliant)"
    variants:
      - name: blended_fuel_allocation
        when: "fuel_type == BIOFUEL_BLEND"
        difference: "sulfur_content_pct interpreted as blend-weighted average; computation splits into ECA and non-ECA prorata before comparison"

  - name: noncompliance_severity_derivation
    trigger: "on NoncomplianceRecord create"
    algorithm: weighted_scoring
    formula: |
      score = 0
      if source_type == SAMPLING_EXCEEDANCE: score += 40
      if source_type == PSC_DEFICIENCY: score += 30
      if source_type == DETERMINATION_NONCOMPLIANT: score += 25
      if source_type == REPORT_OVERDUE: score += 10
      if source_type == MISSING_METHOD: score += 15
      if voyage has any prior NoncomplianceRecord with response_status == ESCALATED: score += 25
      if vessel.compliance_posture == RESTRICTED at detection time: score += 15

      if score >= 70: severity = CRITICAL
      elif score >= 40: severity = MAJOR
      else: severity = MINOR

      response_due_at = detected_at + (
        30 days if severity == MINOR
        14 days if severity == MAJOR
        72 hours if severity == CRITICAL
      )
    input_set: "the new NoncomplianceRecord plus voyage and vessel context"
    constants:
      CRITICAL_THRESHOLD: 70
      MAJOR_THRESHOLD: 40
      MINOR_RESPONSE_DAYS: 30
      MAJOR_RESPONSE_DAYS: 14
      CRITICAL_RESPONSE_HOURS: 72
    precision: "score is integer arithmetic"

  - name: voyage_compliance_posture_rollup
    trigger: "on every transition that mutates a child entity of the vessel (deficiency, sampling, noncompliance, enforcement)"
    algorithm: aggregation
    formula: |
      p1_open = count(PortStateControlDeficiency where vessel_id = vessel.id
                  AND is_priority_one == true
                  AND rectification_status IN {OPEN, RECTIFYING, RECTIFIED, REOPENED})
      active_enforcement = (vessel.active_enforcement_case_id IS NOT NULL)
      critical_recent = exists(NoncomplianceRecord where vessel's voyage_id in vessel's voyages
                        AND severity == CRITICAL
                        AND detected_at >= current_UTC - 180 days
                        AND response_status != CLOSED)
      if active_enforcement AND EnforcementCase.hold_flag == true:
        vessel.compliance_posture = FROZEN
      elif p1_open > 0 OR critical_recent:
        vessel.compliance_posture = RESTRICTED
      else:
        vessel.compliance_posture = OPEN
    input_set: "Vessel + its PortStateControlDeficiency, NoncomplianceRecord (via voyages), EnforcementCase"
    constants:
      CRITICAL_RECENCY_DAYS: 180
    precision: "boolean logic, no rounding"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in known role set; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role permitted for the target endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path id resolves to an existing entity; hierarchical path segments must form a valid ancestor chain (vessel -> voyage -> child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "target entity's current state permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "segregation of duties: same X-User-ID cannot both claim and verify the same deficiency; same X-User-ID cannot both record and evaluate a SamplingInspection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /vessels/{vessel_id}/deficiencies/{id}/verify; POST /vessels/{vessel_id}/voyages/{vid}/inspections/{iid}/evaluate"

  - priority: 6
    category: business_safety
    check: "vessel.compliance_posture != FROZEN for any operation that would mutate voyage, ballast-event, or report state (hold in effect)"
    error_id: ERR_VESSEL_FROZEN
    http_status: 409
    applies_to: "POST voyage mutating endpoints; POST ballast-events; POST report submit"

  - priority: 7
    category: business_temporal
    check: "BallastWaterEvent.occurred_at must be within voyage window [departed_at - 6h, arrived_at + 6h]; occurred_at may not be in the future"
    error_id: ERR_EVENT_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /vessels/{vessel_id}/voyages/{voyage_id}/ballast-events"

  - priority: 8
    category: business_temporal
    check: "BallastWaterEvent DISCHARGE must have at least one prior UPTAKE on the same tank_id"
    error_id: ERR_DISCHARGE_WITHOUT_UPTAKE
    http_status: 422
    applies_to: "POST /vessels/{vessel_id}/voyages/{voyage_id}/ballast-events"

  - priority: 9
    category: business_temporal
    check: "EXCHANGE_COMPLETE.distance_from_shore_nm must be >= governing plan.exchange_distance_nm when the discharge is to count toward exchange compliance (checked at determination time, but POST rejects values < 3 nm as physically implausible inshore)"
    error_id: ERR_EXCHANGE_TOO_CLOSE
    http_status: 422
    applies_to: "POST /vessels/{vessel_id}/voyages/{voyage_id}/ballast-events"

  - priority: 10
    category: business_constraint
    check: "BallastWaterManagementPlan.plan_revision must be strictly greater than every existing plan_revision for the same vessel"
    error_id: ERR_PLAN_REVISION_REGRESSION
    http_status: 422
    applies_to: "POST /vessels/{vessel_id}/plans"

  - priority: 11
    category: business_constraint
    check: "at most one BallastWaterManagementPlan may be in APPROVED state per vessel at any time (approval of a new revision supersedes the prior)"
    error_id: ERR_MULTIPLE_APPROVED_PLANS
    http_status: 409
    applies_to: "POST /vessels/{vessel_id}/plans/{plan_id}/approve"

  - priority: 12
    category: business_constraint
    check: "Voyage.voyage_number unique per vessel"
    error_id: ERR_DUPLICATE_VOYAGE_NUMBER
    http_status: 409
    applies_to: "POST /vessels/{vessel_id}/voyages"

  - priority: 13
    category: business_referential
    check: "RecordBookEntry.record_book_id must resolve to a RecordBook with status == OPEN; sealed books reject new entries"
    error_id: ERR_BOOK_SEALED
    http_status: 409
    applies_to: "POST /vessels/{vessel_id}/record-books/{book_id}/entries"

  - priority: 14
    category: business_referential
    check: "RecordBookEntry.entry_kind must be in the allowed set for book.book_kind"
    error_id: ERR_ENTRY_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /vessels/{vessel_id}/record-books/{book_id}/entries"

  - priority: 15
    category: business_fiscal
    check: "sum of BallastWaterEvent.volume_m3 for UPTAKE events on a tank minus DISCHARGE events on the same tank must never go negative at any point in the voyage's event timeline (chronological balance)"
    error_id: ERR_TANK_BALANCE_NEGATIVE
    http_status: 422
    applies_to: "POST /vessels/{vessel_id}/voyages/{voyage_id}/ballast-events"

  - priority: 16
    category: business_fiscal
    check: "single BallastWaterEvent.volume_m3 must not exceed vessel.ballast_capacity_m3"
    error_id: ERR_VOLUME_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: "POST /vessels/{vessel_id}/voyages/{voyage_id}/ballast-events"

  - priority: 17
    category: business_fiscal
    check: "EmissionsFuelRecord.sulfur_content_pct must be in [0, 5.0]"
    error_id: ERR_SULFUR_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /vessels/{vessel_id}/voyages/{voyage_id}/emissions"

  - priority: 18
    category: business_safety
    check: "CrewTrainingDrill of kind BWMS_OPERATION requires officer_present == true to transition SCHEDULED -> COMPLETED"
    error_id: ERR_OFFICER_REQUIRED
    http_status: 422
    applies_to: "POST /vessels/{vessel_id}/drills/{drill_id}/complete"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server logical clock. Server starts at 2026-08-01T00:00:00Z; never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all time-derived state transitions (report OVERDUE, drill OVERDUE, noncompliance escalation) re-evaluated"]

  # --- Vessels ---
  - method: POST
    path: "/vessels"
    description: "Register a new US-flag vessel"
    roles: [ShoreComplianceOfficer]
    code: 201
    input: [imo_number, vessel_name, bwms_type, "bwms_installation_date?", gross_tonnage, keel_laid_date, ballast_capacity_m3]
    output: Vessel
    side_effects: ["vessel.version starts at 1", "compliance_posture = OPEN"]

  - method: GET
    path: "/vessels"
    description: "List vessels with pagination/filter"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "imo_number?", "compliance_posture?"]
    output: Vessel[]
    side_effects: []

  - method: GET
    path: "/vessels/{vessel_id}"
    description: "Fetch a single vessel"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor, PlatformAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  # --- Plans ---
  - method: POST
    path: "/vessels/{vessel_id}/plans"
    description: "Create a new BWMP revision in DRAFT"
    roles: [ShoreComplianceOfficer]
    code: 201
    input: [plan_revision, approval_authority, approved_at, exchange_distance_nm, sediment_management_included, expected_vessel_version]
    output: BallastWaterManagementPlan
    side_effects: ["increments Vessel.version by 1"]

  - method: GET
    path: "/vessels/{vessel_id}/plans"
    description: "List plans for a vessel"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BallastWaterManagementPlan[]
    side_effects: []

  - method: GET
    path: "/vessels/{vessel_id}/plans/{plan_id}"
    description: "Fetch one plan"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
    code: 200
    input: []
    output: BallastWaterManagementPlan
    side_effects: []

  - method: POST
    path: "/vessels/{vessel_id}/plans/{plan_id}/submit"
    description: "Submit a plan for approval"
    roles: [ShoreComplianceOfficer]
    code: 200
    input: []
    output: BallastWaterManagementPlan
    side_effects: ["plan.status DRAFT -> SUBMITTED", "increments Vessel.version"]

  - method: POST
    path: "/vessels/{vessel_id}/plans/{plan_id}/approve"
    description: "Approve a submitted plan (supersedes any prior APPROVED)"
    roles: [FlagSurveyor]
    code: 200
    input: []
    output: BallastWaterManagementPlan
    side_effects: ["plan.status SUBMITTED -> APPROVED", "prior APPROVED plan -> SUPERSEDED", "recompute ComplianceDetermination for every non-terminal voyage (PLAN_AMENDMENT)", "increments Vessel.version"]

  - method: POST
    path: "/vessels/{vessel_id}/plans/{plan_id}/withdraw"
    description: "Withdraw a DRAFT or SUBMITTED plan"
    roles: [ShoreComplianceOfficer]
    code: 200
    input: []
    output: BallastWaterManagementPlan
    side_effects: ["plan.status -> WITHDRAWN"]

  # --- Voyages ---
  - method: POST
    path: "/vessels/{vessel_id}/voyages"
    description: "Create a voyage in PENDING"
    roles: [ShoreComplianceOfficer, VesselMaster]
    code: 201
    input: [voyage_number, departure_port, arrival_port, departed_at, "arrived_at?", crosses_captain_of_port_zones, enters_us_eez]
    output: Voyage
    side_effects: ["voyage.compliance_status = PENDING", "voyage.reporting_status = NOT_DUE"]

  - method: GET
    path: "/vessels/{vessel_id}/voyages"
    description: "List voyages for a vessel"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
    code: 200
    input: ["limit?", "offset?", "compliance_status?", "reporting_status?"]
    output: Voyage[]
    side_effects: []

  - method: GET
    path: "/vessels/{vessel_id}/voyages/{voyage_id}"
    description: "Fetch a voyage"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
    code: 200
    input: []
    output: Voyage
    side_effects: []

  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/depart"
    description: "Mark voyage departed; fires VOYAGE_DEPARTURE determination"
    roles: [VesselMaster]
    code: 200
    input: []
    output: Voyage
    side_effects: ["voyage.compliance_status PENDING -> IN_PROGRESS", "compute ComplianceDetermination(VOYAGE_DEPARTURE)", "create voyage-scoped BALLAST_WATER RecordBook OPEN", "voyage.reporting_status NOT_DUE -> DUE"]

  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/arrive"
    description: "Mark voyage arrived; commits final determination"
    roles: [VesselMaster]
    code: 200
    input: [arrived_at]
    output: Voyage
    side_effects: ["recompute ComplianceDetermination(VOYAGE_ARRIVAL)", "voyage.compliance_status transitions to COMPLIANT/NONCOMPLIANT/EXEMPT", "vessel.version increments"]

  # --- Ballast Water Events ---
  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/ballast-events"
    description: "Record a ballast water event"
    roles: [VesselMaster]
    code: 201
    input: [event_kind, occurred_at, tank_id, volume_m3, "latitude?", "longitude?", "distance_from_shore_nm?", "salinity_ppt?", "source_port_locode?", expected_voyage_version]
    output: BallastWaterEvent
    side_effects: ["increments Voyage.version by 1", "recompute ComplianceDetermination(BALLAST_EVENT_RECORDED)"]

  - method: GET
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/ballast-events"
    description: "List ballast events for a voyage"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
    code: 200
    input: ["limit?", "offset?", "event_kind?", "tank_id?"]
    output: BallastWaterEvent[]
    side_effects: []

  # --- Determinations ---
  - method: GET
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/determinations"
    description: "List determinations for a voyage (newest first)"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
    code: 200
    input: ["limit?", "offset?", "is_current?"]
    output: ComplianceDetermination[]
    side_effects: []

  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/determinations/recompute"
    description: "Manually trigger recomputation"
    roles: [ShoreComplianceOfficer, FlagSurveyor]
    code: 201
    input: []
    output: ComplianceDetermination
    side_effects: ["compute ComplianceDetermination(MANUAL_RECOMPUTE)", "voyage.determination_id updated", "voyage.version increments"]

  # --- Reports ---
  - method: GET
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/reports"
    description: "List reports for a voyage"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
    code: 200
    input: ["limit?", "offset?", "report_type?", "status?"]
    output: BallastWaterReport[]
    side_effects: []

  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/reports/{report_id}/submit"
    description: "Submit a DRAFT report"
    roles: [VesselMaster]
    code: 200
    input: [payload_summary]
    output: BallastWaterReport
    side_effects: ["report.status DRAFT -> SUBMITTED", "report.submitted_at set", "voyage.reporting_status -> SUBMITTED"]

  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/reports/{report_id}/acknowledge"
    description: "Acknowledge a submitted report"
    roles: [FlagSurveyor]
    code: 200
    input: []
    output: BallastWaterReport
    side_effects: ["report.status SUBMITTED -> ACKNOWLEDGED", "voyage.reporting_status -> ACKNOWLEDGED"]

  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/reports/{report_id}/reject"
    description: "Reject a submitted report"
    roles: [FlagSurveyor]
    code: 200
    input: [rejection_reason]
    output: BallastWaterReport
    side_effects: ["report.status SUBMITTED -> REJECTED", "voyage.reporting_status -> DUE"]

  # --- Sampling / Inspections ---
  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/inspections"
    description: "Record a sampling/inspection"
    roles: [PSCOfficer, FlagSurveyor]
    code: 201
    input: [inspection_kind, sampled_at, sampled_by_role, indicator_organism_concentration, tss_mg_per_l, findings]
    output: SamplingInspection
    side_effects: ["inspection.status = RECORDED"]

  - method: GET
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/inspections"
    description: "List inspections"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
    code: 200
    input: ["limit?", "offset?", "inspection_kind?", "status?"]
    output: SamplingInspection[]
    side_effects: []

  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/inspections/{inspection_id}/evaluate"
    description: "Evaluate a recorded inspection"
    roles: [FlagSurveyor]
    code: 200
    input: []
    output: SamplingInspection
    side_effects: ["status RECORDED -> EVALUATED", "exceeded computed", "if exceeded: create NoncomplianceRecord(SAMPLING_EXCEEDANCE, severity=MAJOR); if PSC: create PortStateControlDeficiency"]

  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/inspections/{inspection_id}/close"
    description: "Close an evaluated inspection"
    roles: [FlagSurveyor]
    code: 200
    input: []
    output: SamplingInspection
    side_effects: ["status EVALUATED -> CLOSED"]

  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/inspections/{inspection_id}/reopen"
    description: "Reopen a closed inspection within 90 days"
    roles: [FlagSurveyor]
    code: 200
    input: []
    output: SamplingInspection
    side_effects: ["status CLOSED -> REOPENED", "linked closed NoncomplianceRecords -> OPEN", "vessel.compliance_posture recomputed"]

  # --- Noncompliance ---
  - method: GET
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/noncompliance"
    description: "List noncompliance records for a voyage"
    roles: [ShoreComplianceOfficer, VesselMaster, PSCOfficer, FlagSurveyor]
