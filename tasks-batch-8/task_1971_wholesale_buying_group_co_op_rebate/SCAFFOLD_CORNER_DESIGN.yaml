              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_DISTRIBUTION_VERSION"
            - "HTTP status == 412"
            - "QuarterlyDistribution.${d_id}.status == DRAFT   # unchanged"

