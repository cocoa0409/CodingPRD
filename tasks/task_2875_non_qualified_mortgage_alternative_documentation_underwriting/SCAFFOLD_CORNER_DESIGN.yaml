      - name: corner_appraisal_review_parallel_dimensions
        claim_type: parallel
        grounds:
          - state_machines.AppraisalReview
        excluded_because:
          difficulty_instance: non_linear_state_machine / appraisal_review_parallel_dimensions_advance_independently
          rationale: "The named 1.8 instance walks primary_review_status and second_valuation_status through independent advances and asserts the combined state at every step."

      - name: corner_exception_request_fork_and_join
        claim_type: branching
        grounds:
          - state_machines.ExceptionRequest
        excluded_because:
          difficulty_instance: non_linear_state_machine / exception_request_tier_two_fork_join_dual_signature
          rationale: "The named 1.8 instance drives both the tier-1 fork and the tier-2 fork plus join, including the branch-exclusive investor_notification_required side effect."

      - name: corner_audit_defect_cascade_down_to_pool
        claim_type: cascade_down
        grounds:
          - state_machines.PostCloseAudit.transitions.FINDINGS_ISSUED_to_MATERIAL_DEFECT
          - state_machines.LoanFile.transitions.CLOSED_to_AUDIT_DEFECT
          - state_machines.SecuritizationPool.transitions.OPEN_to_REBALANCING
        excluded_because:
          difficulty_instance: transitive_cascade / audit_material_defect_cascade_to_pool_rebalance
          rationale: "The named 1.8 instance verifies the four-link chain adjudication -> audit grade -> loan file AUDIT_DEFECT -> pool REBALANCING end to end."

      - name: corner_pool_removal_compensates_every_metric
        claim_type: compensation
        grounds:
          - state_machines.SecuritizationPool
          - calculations.pool_metrics_recompute
        excluded_because:
          difficulty_instance: compensating_invariant / pool_balance_and_weighted_coupon_restored_exactly_after_removal
          rationale: "The named 1.8 instance asserts byte-exact restoration of aggregate_scheduled_balance_cents, weighted_avg_coupon_pct and member_loan_count after a removal."

      - name: corner_approval_guarded_by_appraisal_review_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.LoanFile.transitions.UNDERWRITING_to_APPROVED
          - validations[priority=21]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / loan_approval_gated_by_appraisal_review_second_valuation_dimension
          rationale: "The named 1.8 instance blocks approval on the AppraisalReview second_valuation_status dimension and then releases it, which is exactly the cross-entity guard."

