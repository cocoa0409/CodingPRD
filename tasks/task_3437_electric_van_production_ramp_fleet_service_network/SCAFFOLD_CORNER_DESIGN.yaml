  # ===========================================================================
  - section: endpoints
    instances:

      - name: success_envelope_shape_on_create
        claim_type: Standard CRUD
        grounds:
          - response_envelope
          - endpoints.POST_/evfleet/suppliers
        distinguishing_aspect: "Every successful create carries the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type == object, and the entity under data."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /evfleet/suppliers"
              payload: { name: "Envelope Cells", contact_email: "e@cells.test" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { s_id: $.data.id }
          assert:
            - "status 201; meta.api_request_id non-null and meta.api_request_timestamp parses as ISO8601"
            - "response_type == \"object\" and data.id == ${s_id}"
            - "no pagination fields (limit/offset/total_count/has_more) on an object response"

      - name: error_envelope_shape_on_failure
        claim_type: Standard CRUD
        grounds:
          - response_envelope
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Every failure carries the fixed error envelope: response_type == error with data.error_id and data.message, and the meta block is still populated."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /evfleet/suppliers/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "status 404; response_type == \"error\""
            - "err == ERR_NOT_FOUND and msg is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present even on errors"

      - name: visit_with_both_or_neither_resource_rejected
