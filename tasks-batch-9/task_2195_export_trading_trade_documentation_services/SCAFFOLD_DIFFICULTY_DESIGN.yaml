              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_4_id: "$.data.id", sailing_4_v: "$.data.version" }
            - call: "POST /vessel-sailings"
              payload: { carrier_scac: "MAEU", vessel_name: "Seomjin Star", voyage_no: "S3302", port_of_loading: "KRPUS", port_of_discharge: "JPTYO", destination_zone: "ZONE_1", cutoff_at: "2026-08-16T00:00:00Z", etd: "2026-08-19T00:00:00Z", eta: "2026-08-31T00:00:00Z", capacity_weight_kg: 5000.000, tariff_rate_per_1000kg_usd: 300.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_5_id: "$.data.id", sailing_5_v: "$.data.version" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Roller bearings", hs_code: "848250", quantity: 40.000, uom: "EA", unit_price_usd: 100.0000, line_discount_pct: 0, net_weight_kg: 360.000, gross_weight_kg: 400.000, package_count: 4 }
