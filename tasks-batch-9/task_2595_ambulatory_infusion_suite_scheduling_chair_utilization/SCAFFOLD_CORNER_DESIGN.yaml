      - name: the_urgent_reserve_limit_outranks_the_unavailable_chair_at_the_same_center
        claim_type: triggerable
        grounds:
          - validations[priority 110]
          - validations[priority 112]
          - errors[ERR_URGENT_RESERVE_LIMIT]
          - errors[ERR_URGENT_RESERVE_UNAVAILABLE]
          - entities.Chair.fields.reserved_for_urgent
        distinguishing_aspect: |
          Both urgent errors are 409 and both need a reserved chair to exist, so they are
          separated only by which quantity is exhausted. A chair that was booked ROUTINE
          BEFORE it was flagged reserved gives the rare state where the reserve is unclaimed
          (priority 110 passes) yet no chair is free at the single URGENT candidate minute
          (priority 112 fires). Once an URGENT visit does claim that one reserved chair, the
          next URGENT request reports the LIMIT even though the same minute is also occupied
          — proving 110 is evaluated first.
