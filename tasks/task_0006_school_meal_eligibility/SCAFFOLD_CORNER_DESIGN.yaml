  # =========================================================================
  # Section: calculations — calculation correctness probes
  # =========================================================================
  - section: calculations
    instances:

      - name: selector_chooses_most_generous_active_tier_when_two_active_determinations_overlap_by_value
        claim_type: selector_determinism
        grounds: ["calculations.select_active_determination", "entities.EligibilityDetermination.fields.tier"]
        distinguishing_aspect: |
          When two ACTIVE EligibilityDeterminations cover server_clock for a
          household (achievable via different valid windows where current
          time is in BOTH because they're temporally distinct), the selector
          picks tier_priority DESC (FREE>REDUCED>PAID). Achieved here by
          creating a PAID determination first via approved application, then
          adding a direct-certification FREE which supersedes the prior →
          only one ACTIVE at a time. Edge-case probe: with one ACTIVE FREE
          (since prior PAID is SUPERSEDED), select_active_determination
          returns the FREE one (tier_priority 3 wins; recency is the
          tie-break, NEVER id).
        test_recipe:
          setup:
            - "Household H, one ACTIVE FREE determination (others SUPERSEDED)."
            - "POST /service-transactions selects the FREE determination."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Sel", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "Sel kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-07-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
              captures: { elig_id: $.data.id }
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Lunch2", list_price_cents: 500, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 600 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
          trigger:
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_id: $.data.id, tx_tier: $.data.applied_tier, tx_charge: $.data.paid_charge_cents, tx_elig: $.data.eligibility_determination_id }
          assert:
            - "ServiceTransaction.${tx_id}.applied_tier == FREE"
            - "ServiceTransaction.${tx_id}.paid_charge_cents == 0  # FREE tier produces 0"
            - "ServiceTransaction.${tx_id}.eligibility_determination_id == ${elig_id}"
