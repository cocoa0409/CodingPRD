            - "The approve call returns an error (ERR_INVALID_STATE or ERR_CHARGE_NOT_PENDING): the charge is no longer PENDING and its installation is UNINSTALLING"

  - rule_id: resource_temporal_overlap
    instances:
      - name: review_window_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_REVIEW_WINDOW_OVERLAP]
          - entities.ReviewWindow
        distinguishing_aspect: |
          Half-open interval semantics on ReviewWindow: an existing SCHEDULED
          window [2026-09-01, 2026-09-15) does NOT conflict with a new window
          starting exactly at 2026-09-15 (adjacency is allowed), while a window
          starting 2026-09-14 overlaps and is rejected — the adjacency edge is
          the precision under test.
        test_recipe:
          setup:
            - "App a15 IN_REVIEW with version v15 IN_REVIEW and one SCHEDULED ReviewWindow [2026-09-01T00:00:00Z, 2026-09-15T00:00:00Z)"
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "D15", contact_email: "d15@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { d15_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${d15_id}", name: "AppFifteen", category: "FINANCE" }
              as: Developer
              as_user_id: "${d15_id}"
              captures: { a15_id: $.data.id }
            - call: "POST /apps/${a15_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${d15_id}"
              captures: { v15_id: $.data.id }
            - call: "POST /apps/${a15_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d15_id}"
            - call: "POST /app-versions/${v15_id}/review-windows"
              payload: { reviewer_id: "rev-1", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-15T00:00:00Z" }
              as: Reviewer
              captures: { rw1_id: $.data.id }
          trigger:
            - call: "POST /app-versions/${v15_id}/review-windows"
              payload: { reviewer_id: "rev-2", starts_at: "2026-09-15T00:00:00Z", ends_at: "2026-09-29T00:00:00Z" }
              as: Reviewer
              captures: { rw2_id: $.data.id }
            - call: "POST /app-versions/${v15_id}/review-windows"
              payload: { reviewer_id: "rev-3", starts_at: "2026-09-14T00:00:00Z", ends_at: "2026-09-28T00:00:00Z" }
              as: Reviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "The adjacent window [09-15, 09-29) is CREATED (half-open: s == e2 is not an overlap)"
            - "The overlapping window [09-14, 09-28) fails with error_id == 'ERR_REVIEW_WINDOW_OVERLAP'"
      - name: invoice_cycle_uniqueness_per_merchant
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE]
          - entities.MonthlyInvoice.fields.cycle
        distinguishing_aspect: |
          Different interval semantics — aggregate slot occupation instead of
          geometric overlap: a merchant's billing cycle '2026-09' is a unique
          slot resource, so a second MonthlyInvoice for the same merchant+cycle
          collides with ERR_DUPLICATE, while the SAME cycle for a DIFFERENT
          merchant is free — testing partition-scoped slot semantics rather than
          interval arithmetic.
        test_recipe:
          setup:
            - "Merchants m16a and m16b exist; m16a already has an OPEN invoice for cycle 2026-09"
          setup_api_calls:
            - call: "POST /merchants"
              payload: { shop_domain: "m16a.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { m16a_id: $.data.id }
            - call: "POST /merchants"
              payload: { shop_domain: "m16b.myshop.com", plan_tier: "GROWTH" }
              as: PlatformAdmin
              captures: { m16b_id: $.data.id }
            - call: "POST /merchants/${m16a_id}/invoices"
              payload: { cycle: "2026-09" }
              as: PlatformAdmin
              captures: { inv16a_id: $.data.id }
          trigger:
            - call: "POST /merchants/${m16a_id}/invoices"
              payload: { cycle: "2026-09" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /merchants/${m16b_id}/invoices"
              payload: { cycle: "2026-09" }
              as: PlatformAdmin
              captures: { inv16b_id: $.data.id }
          assert:
            - "Second invoice for (m16a, 2026-09) fails with error_id == 'ERR_DUPLICATE'"
            - "Invoice for (m16b, 2026-09) succeeds (slot is partitioned by merchant)"

  - rule_id: compensating_invariant
    instances:
      - name: charge_reverse_restores_invoice_total_and_lifetime_gross
        grounds:
          - calculations.invoice_total
          - calculations.developer_accrual
          - state_machines.AppBillingCharge.INVOICED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: MonthlyInvoice.total_cents and
          DeveloperAccount.lifetime_gross_cents. Forward action (issue invoice
          with a 9000-cent charge) paired with its compensating action (reverse
          that charge while ISSUED) leaves total_cents back at the sum of
          remaining INVOICED charges and lifetime_gross_cents unchanged from the
          pre-issue baseline — no drift.
        test_recipe:
          setup:
            - "Developer d17, listed app a17, ACTIVE installation inst17 (merchant m17)"
            - "inst17 has APPROVED ONE_TIME charges c17a 9000 and c17b 4000 in cycle 2026-09; invoice inv17 issued (total 13000)"
          setup_api_calls:
            - call: "POST /developers"
              payload: { company_name: "D17", contact_email: "d17@x.com", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { d17_id: $.data.id }
            - call: "POST /apps"
              payload: { developer_id: "${d17_id}", name: "AppSeventeen", category: "PRODUCTIVITY" }
              as: Developer
              as_user_id: "${d17_id}"
              captures: { a17_id: $.data.id }
            - call: "POST /apps/${a17_id}/versions"
              payload: { semver: "1.0.0" }
              as: Developer
              as_user_id: "${d17_id}"
              captures: { v17_id: $.data.id }
            - call: "POST /apps/${a17_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d17_id}"
            - call: "POST /app-versions/${v17_id}/approve"
              payload: { reviewer_id: "rev-1" }
              as: Reviewer
            - call: "POST /apps/${a17_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${d17_id}"
            - call: "POST /merchants"
              payload: { shop_domain: "m17.myshop.com", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { m17_id: $.data.id }
            - call: "POST /installations"
              payload: { app_id: "${a17_id}", merchant_id: "${m17_id}" }
              as: Merchant
              as_user_id: "${m17_id}"
              captures: { inst17_id: $.data.id }
            - call: "POST /installations/${inst17_id}/consent"
              payload: {}
              as: Merchant
              as_user_id: "${m17_id}"
            - call: "POST /installations/${inst17_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 9000, description: "a" }
              as: Developer
              as_user_id: "${d17_id}"
              captures: { c17a_id: $.data.id }
            - call: "POST /billing-charges/${c17a_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${m17_id}"
            - call: "POST /installations/${inst17_id}/billing-charges"
              payload: { charge_type: "ONE_TIME", base_amount_cents: 4000, description: "b" }
              as: Developer
              as_user_id: "${d17_id}"
              captures: { c17b_id: $.data.id }
            - call: "POST /billing-charges/${c17b_id}/approve"
              payload: {}
              as: Merchant
              as_user_id: "${m17_id}"
            - call: "POST /merchants/${m17_id}/invoices"
              payload: { cycle: "2026-09" }
              as: PlatformAdmin
              captures: { inv17_id: $.data.id, inv17_v: $.data.version }
            - call: "POST /invoices/${inv17_id}/issue"
              payload: { expected_invoice_version: "${inv17_v}" }
              as: PlatformAdmin
              captures: { inv17_total: $.data.total_cents }
          trigger:
            - call: "POST /billing-charges/${c17a_id}/reverse"
              payload: {}
              as: PlatformAdmin
            - call: "GET /invoices/${inv17_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv17_total2: $.data.total_cents }
            - call: "GET /developers/${d17_id}"
              payload: {}
              as: PlatformAdmin
              captures: { d17_gross: $.data.lifetime_gross_cents }
          assert:
            - "MonthlyInvoice.${inv17_id}.total_cents == 13000 at issue, then == 4000 after reversal (recomputed, not decremented-stale)"
            - "Developer.${d17_id}.lifetime_gross_cents == 4000 (REVERSAL ledger entry exactly cancels the 9000 accrual)"
      - name: suspend_reinstate_restores_installation_active_set
        grounds:
          - state_machines.App.LISTED_to_SUSPENDED
          - state_machines.App.SUSPENDED_to_LISTED
          - state_machines.Installation.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Different conserved quantity — the multiset of installation statuses:
          suspend followed by reinstate returns every previously-ACTIVE
