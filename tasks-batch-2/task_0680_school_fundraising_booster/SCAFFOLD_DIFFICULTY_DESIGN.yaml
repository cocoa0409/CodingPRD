              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 10 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
