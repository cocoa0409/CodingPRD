            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Occ2 Fund", primary_advisor_user_id: "adv-cc2" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 1000000 }
              as: DonorAdvisor
              as_user_id: "adv-cc2"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-cc2"
              captures: { ver_before: $.data.version }
          trigger:
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 150000, expected_account_version: "${ver_before}" }
              as: DonorAdvisor
              as_user_id: "adv-cc2"
              captures: { grant_id: $.data.id }
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-cc2"
              captures: { ver_post: $.data.version }
          assert:
            - "Grant submit returns 201; GrantRecommendation.${grant_id}.status == SUBMITTED"
            - "DonorAccount.${acct_id}.version (ver_post) == ver_before + 1"
            - "DonorAccount.${acct_id}.committed_grants_cents == 150000"

      - name: derived_field_grantable_recomputed_after_settle
        claim_type: derived_field_reconciliation
        grounds:
          - entities.DonorAccount.fields.grantable_balance_cents
          - calculations.grantable_balance
          - state_machines.Contribution.PENDING_to_SETTLED
        distinguishing_aspect: "After settling a 400000-cent cash contribution, the derived grantable_balance_cents reconciles to 400000 (recomputed on the settle side-effect)."
        test_recipe:
          setup:
            - "Sponsor; ACTIVE account; one PENDING cash contribution of 400000 cents (grantable starts at 0)."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Drf Sponsor", ein: "27-0000003" }
              as: SponsorAdmin
