# =============================================================================
# task_0114_hotel_property_management — SCAFFOLD_CORNER_DESIGN.yaml  (§1.9)
# Breadth probe: enumerative coverage of testable claims §1.8 does not already
# cover, walking references/claim-extraction-guide.md against §1.1–§1.7.
# Every setup chain is executable from empty-DB using only §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_hotel_returns_201_with_defaults_applied
        claim_type: Creation
        grounds:
          - "entities.Hotel.fields.posture"
          - "entities.Hotel.fields.audit_epoch"
          - "entities.Hotel.fields.overbooking_allowance_pct"
        distinguishing_aspect: "POST /pms/hotels with required fields returns 201; posture defaults OPEN, audit_epoch 0, overbooking_allowance_pct defaults 0.0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pms/hotels"
              payload: { name: "Defaults Inn", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
          assert:
            - "response code == 201"
            - "Hotel.${hotel_id}.posture == OPEN"
            - "Hotel.${hotel_id}.audit_epoch == 0"
            - "Hotel.${hotel_id}.overbooking_allowance_pct == 0.0"
            - "Hotel.${hotel_id}.version == 1"

      - name: get_hotel_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.GET./pms/hotels/{id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /pms/hotels/{id} for a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pms/hotels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_room_type_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "endpoints.POST./pms/room-types"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /pms/room-types omitting base_rate_cents (required, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a hotel exists"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "RT", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
          trigger:
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_reservation_bad_fk_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_REFERENCE_NOT_FOUND]"
          - "entities.Reservation.fields.guest_id"
        distinguishing_aspect: "POST /pms/reservations with a non-existent guest_id returns ERR_REFERENCE_NOT_FOUND (422)."
        test_recipe:
          setup: ["hotel + room type + rate plan exist; guest_id is bogus"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Ref", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
          trigger:
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "00000000-0000-4000-8000-000000000000", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-02" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_REFERENCE_NOT_FOUND"

      - name: reservation_nights_computed_field_correct
        claim_type: Computed Fields
        grounds:
          - "entities.Reservation.fields.nights"
        distinguishing_aspect: "nights is computed as departure_date - arrival_date in days; 2026-07-01..2026-07-04 -> nights == 3 regardless of any client-sent value."
        test_recipe:
          setup: ["hotel + room type + rate plan + guest"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Nights", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Sa S", email: "sa@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-04" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
          assert:
            - "Reservation.${res_id}.nights == 3"
            - "Reservation.${res_id}.status == HELD"
            - "Reservation.${res_id}.effective_room_type_id == ${king_id}"

      - name: create_reservation_departure_not_after_arrival_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.Reservation.fields.departure_date"
        distinguishing_aspect: "departure_date <= arrival_date (same day) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["hotel + room type + rate plan + guest"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Bad", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Ta T", email: "ta@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-01" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: duplicate_room_number_per_hotel_returns_duplicate_resource
        claim_type: Type Constraints
        grounds:
          - "errors[ERR_DUPLICATE_RESOURCE]"
          - "entities.Room.fields.room_number"
        distinguishing_aspect: "Two rooms with the same room_number in one hotel: the second returns ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["hotel + room type + one room number 101"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Dup", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rooms"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${king_id}", room_number: "101" }
              as: RevenueManager
              captures: { room1_id: $.data.id }
          trigger:
            - call: "POST /pms/rooms"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${king_id}", room_number: "101" }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_DUPLICATE_RESOURCE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - "state_machines.Reservation.HELD_to_CONFIRMED"
          - "validations[priority=7]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Confirming a reservation already CONFIRMED returns ERR_INVALID_STATE (409); no second transition."
        test_recipe:
          setup: ["a CONFIRMED reservation"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Idem", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Ua U", email: "ua@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-02" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
          trigger:
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Reservation.${res_id}.status == CONFIRMED"

      - name: cancel_checked_out_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Reservation.HELD_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a CHECKED_OUT (terminal) reservation returns ERR_INVALID_STATE (409); terminal states accept no transitions."
        test_recipe:
          setup: ["a CHECKED_OUT reservation"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Term", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/rooms"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${king_id}", room_number: "701" }
              as: RevenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /pms/rooms/${room_id}/housekeeping"
              payload: { target: "INSPECTED", expected_room_version: "${room_v0}" }
              as: RevenueManager
              captures: { room_v1: $.data.version }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Va V", email: "va@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-02" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/assign-room"
              payload: { room_id: "${room_id}", expected_room_version: "${room_v1}" }
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/check-out"
              payload: {}
              as: FrontDeskAgent
          trigger:
            - call: "POST /pms/reservations/${res_id}/cancel"
              payload: {}
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Reservation.${res_id}.status == CHECKED_OUT"

      - name: checkin_before_arrival_date_returns_arrival_not_reached
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Reservation.CONFIRMED_to_CHECKED_IN"
          - "errors[ERR_ARRIVAL_NOT_REACHED]"
          - "entities.Hotel.fields.current_business_date"
        distinguishing_aspect: "Check-in while current_business_date (07-01) < arrival_date (07-05) returns ERR_ARRIVAL_NOT_REACHED (409)."
        test_recipe:
          setup: ["CONFIRMED reservation arriving 07-05, room assigned + INSPECTED, hotel date still 07-01"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Early", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/rooms"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${king_id}", room_number: "801" }
              as: RevenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /pms/rooms/${room_id}/housekeeping"
              payload: { target: "INSPECTED", expected_room_version: "${room_v0}" }
              as: RevenueManager
              captures: { room_v1: $.data.version }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Wa W", email: "wa@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-05", departure_date: "2026-07-07" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/assign-room"
              payload: { room_id: "${room_id}", expected_room_version: "${room_v1}" }
              as: FrontDeskAgent
          trigger:
            - call: "POST /pms/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_ARRIVAL_NOT_REACHED"

      - name: checkin_no_room_assigned_returns_no_room_assigned
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Reservation.CONFIRMED_to_CHECKED_IN"
          - "errors[ERR_NO_ROOM_ASSIGNED]"
          - "entities.Reservation.fields.assigned_room_id"
        distinguishing_aspect: "Check-in on a CONFIRMED reservation with assigned_room_id null returns ERR_NO_ROOM_ASSIGNED (409)."
        test_recipe:
          setup: ["CONFIRMED reservation, no room assigned, arrival today"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "NoRoom", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Xa X", email: "xa@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-02" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
          trigger:
            - call: "POST /pms/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_NO_ROOM_ASSIGNED"

      - name: open_second_audit_while_in_progress_returns_audit_already_running
        claim_type: Idempotency
        grounds:
          - "state_machines.NightAuditRun.initial_state"
          - "errors[ERR_AUDIT_ALREADY_RUNNING]"
          - "entities.Hotel.fields.posture"
        distinguishing_aspect: "Opening a second night audit while one is IN_PROGRESS returns ERR_AUDIT_ALREADY_RUNNING (409)."
        test_recipe:
          setup: ["a hotel with one IN_PROGRESS night audit"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Twice", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id, hotel_v: $.data.version }
            - call: "POST /pms/night-audit-runs"
              payload: { hotel_id: "${hotel_id}", expected_hotel_version: "${hotel_v}" }
              as: NightAuditor
              captures: { nar1_id: $.data.id }
            - call: "GET /pms/hotels/${hotel_id}"
              payload: {}
              as: NightAuditor
              captures: { hotel_v2: $.data.version }
          trigger:
            - call: "POST /pms/night-audit-runs"
              payload: { hotel_id: "${hotel_id}", expected_hotel_version: "${hotel_v2}" }
              as: NightAuditor
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_AUDIT_ALREADY_RUNNING"
            - "Hotel.${hotel_id}.posture == AUDIT_LOCK"

      - name: out_of_order_room_with_assignment_returns_room_not_assignable
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Room.CLEAN_to_OUT_OF_ORDER"
          - "errors[ERR_ROOM_NOT_ASSIGNABLE]"
          - "entities.Room.fields.assigned_reservation_id"
        distinguishing_aspect: "Setting a room OUT_OF_ORDER while it is bound to a reservation (assigned_reservation_id not null) returns ERR_ROOM_NOT_ASSIGNABLE (409)."
        test_recipe:
          setup: ["a room assigned to a CONFIRMED reservation"]
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "OOO", current_business_date: "2026-07-01" }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/rooms"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${king_id}", room_number: "901" }
              as: RevenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /pms/rooms/${room_id}/housekeeping"
              payload: { target: "INSPECTED", expected_room_version: "${room_v0}" }
              as: RevenueManager
              captures: { room_v1: $.data.version }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Ya Y", email: "ya@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-02" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /pms/reservations/${res_id}/assign-room"
              payload: { room_id: "${room_id}", expected_room_version: "${room_v1}" }
              as: FrontDeskAgent
            - call: "GET /pms/rooms/${room_id}"
              payload: {}
              as: FrontDeskAgent
