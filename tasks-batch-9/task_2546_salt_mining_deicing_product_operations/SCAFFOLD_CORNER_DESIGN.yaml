            - call: "POST /salt/shipments/${ship_id}/receive"
              payload: {}
              as: DepotManager
              as_user_id: "${depot_b}"
              captures: { st_recv: "$.data.status", new_lot: "$.data.received_lot_id" }
          assert:
            - "call 1 -> HTTP 200 with ${st_loaded} == LOADED, performed by the ORIGIN depot's manager"
            - "call 2 -> HTTP 200 with ${st_recv} == RECEIVED, performed by the DESTINATION depot's manager"
            - "StockpileLot.${lot_id}.tons_on_hand == 540.00 and lot_state == AVAILABLE"
            - "StockpileLot.${new_lot}.depot_id == ${depot_b} and tons_on_hand == 400.00"
