scenario: |
  2873. Trade Association Government Affairs & Political Committee Administration (industry trade association): policy priority setting through member committees with consensus positions and dissent handling, lobbying registration, activity tracking and expenditure reporting by jurisdiction, grassroots mobilization campaigns with member action alerts and constituent matching, political action committee solicitation eligibility, prior approval requirements and contribution limits, candidate contribution decisions with scoring criteria and board approval, separate segregated fund accounting with regulatory filing calendars, coalition participation and third-party advocacy disclosures, member communication on advocacy outcomes and dues-related deductibility notices
domain_name: trade-association-government-affairs
api_prefix: /advocacy

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only three URL nestings exist
  # (CommitteeSeat under PolicyCommittee, PositionVote under PolicyPosition,
  # ActionAlert under GrassrootsCampaign); every other relationship is a body-level
  # FK between peers, and no aggregate owns another aggregate's lifecycle.

  state_machine_shape: branching
  # PolicyPosition forks at tally (CONSENSUS_REACHED vs RECONSIDERATION) and loops
  # RECONSIDERATION -> BALLOTING; PositionVote carries two independent state axes
  # (ballot_status x dissent_status); LobbyingRegistration cycles
  # ACTIVE -> AMENDMENT_PENDING -> ACTIVE; SegregatedFund.posture gates PAC writes.

  relationship_patterns:
    - one_to_many        # PolicyCommittee -> PolicyPosition, SegregatedFund -> PacContribution
    - many_to_many       # Member <-> PolicyCommittee through CommitteeSeat
    - cross_aggregate    # LobbyingActivity references both LobbyingRegistration and PolicyPosition
    - polymorphic: false

  role_model: segregation_of_duties
  # Proposing, approving, and disbursing a PAC contribution are three distinct roles;
  # an ExpenditureReport may not be certified by the operator who created it; the
  # association never grants its own PAC prior approval - only the member does.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered corporate name of the member company.
        constraints: non-empty, max 200 chars
      - name: membership_tier
        type: enum
        source: input
        description: Dues tier; drives committee voting weight via TIER_WEIGHT.
        constraints: one of ASSOCIATE, FULL, PREMIER
      - name: status
        type: enum
        source: input
        description: Membership standing; only ACTIVE members may be seated, vote, or be solicited.
        default: ACTIVE
        constraints: one of ACTIVE, LAPSED, SUSPENDED
      - name: home_jurisdiction_code
        type: enum
        source: input
        description: Jurisdiction whose dues-deductibility method applies to this member.
        constraints: one of FEDERAL, STATE_CA, STATE_NY
      - name: home_district_code
        type: string
        source: input
        description: Legislative district of the member's headquarters, used for constituent matching (e.g. "CA-12").
        constraints: non-empty, uppercase, format "<STATE>-<NUMBER>"
      - name: annual_dues_cents
        type: integer
        source: input
        description: Dues billed for dues_year; the base of the deductibility notice.
        constraints: ">= 0"
      - name: dues_year
        type: integer
        source: input
        description: Calendar year the dues apply to; scopes the deductibility ratio input set.
        constraints: 2020..2100
      - name: restricted_class_size
        type: integer
        source: input
        description: Count of executives/stockholders this member may make solicitable under a prior approval.
        constraints: ">= 0"
      - name: advocacy_optout
        type: boolean
        source: input
        description: When true the member is excluded from every constituent-match candidate set.
        default: false
      - name: engagement_score
        type: integer
        source: input
        description: Grassroots responsiveness score; primary sort key of the constituent-match selector.
        default: 50
        constraints: 0..100
      - name: recorded_dissent_count
        type: integer
        source: computed
        description: Number of PositionVote rows of this member whose dissent_status reached RECORDED.
        default: 0
      - name: notice_method
        type: enum
        source: computed
        description: Deductibility method resolved from JURISDICTION_RULES[home_jurisdiction_code].deductibility_method.
        constraints: one of RATIO, FLAT_FLOOR
      - name: pac_solicitable
        type: boolean
        source: computed
        description: True iff a PriorApproval of this member has status GRANTED and effective_date <= clock date <= expires_at_date.
        default: false

  - name: PolicyCommittee
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Committee name (e.g. "Federal Tax Policy Committee").
        constraints: non-empty, max 200 chars
      - name: jurisdiction_scope
        type: enum
        source: input
        description: Jurisdictions this committee may set positions for; MULTI permits any.
        constraints: one of FEDERAL, STATE_CA, STATE_NY, MULTI
      - name: quorum_threshold_pct
        type: number
        source: input
        description: Minimum quorum_pct a ballot round must reach for its tally to be scored for consensus.
        constraints: 0.00..100.00, two decimals
      - name: consensus_threshold_pct
        type: number
        source: input
        description: Minimum consensus_pct required to reach CONSENSUS_REACHED; compared with >=.
        constraints: 0.00..100.00, two decimals
      - name: seat_count
        type: integer
        source: computed
        description: Number of CommitteeSeat rows with status IN {ACTIVE, DAMPENED} on this committee.
        default: 0
      - name: total_voting_weight
        type: integer
        source: computed
        description: Sum of voting_weight over CommitteeSeat rows with status IN {ACTIVE, DAMPENED}.
        default: 0
      - name: roster_state
        type: enum
        source: computed
        description: FORMING when seat_count < MIN_SEATS; IMPAIRED when seat_count >= MIN_SEATS and total_voting_weight < MIN_ROSTER_WEIGHT; else QUORATE.
        default: FORMING
        constraints: one of FORMING, QUORATE, IMPAIRED

  - name: CommitteeSeat
    parent: PolicyCommittee
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: system
        description: FK -> PolicyCommittee.id; taken from the path, never from the body.
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the seated member company.
      - name: seat_role
        type: enum
        source: input
        description: CHAIR seats break nothing but are reported in the roster; at most one CHAIR per committee.
        default: MEMBER
        constraints: one of CHAIR, MEMBER
      - name: voting_weight
        type: integer
        source: computed
        description: TIER_WEIGHT[member.membership_tier] when status is ACTIVE; max(1, floor(TIER_WEIGHT/2)) when status is DAMPENED.
      - name: status
        type: enum
        source: computed
        description: ACTIVE at creation; flips to DAMPENED when dissent_strikes >= DISSENT_DAMPING_STRIKES.
        default: ACTIVE
        constraints: one of ACTIVE, DAMPENED
      - name: dissent_strikes
        type: integer
        source: computed
        description: Count of this member's RECORDED dissents on positions of this committee.
        default: 0

  - name: PolicyPosition
    parent: null
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: input
        description: FK -> PolicyCommittee.id; the committee that ballots this position.
      - name: title
        type: string
        source: input
        description: Short title of the policy priority.
        constraints: non-empty, max 200 chars
      - name: jurisdiction_code
        type: enum
        source: input
        description: Jurisdiction the position addresses; must be inside the committee's jurisdiction_scope.
        constraints: one of FEDERAL, STATE_CA, STATE_NY
      - name: summary
        type: string
        source: input
        description: Consensus language circulated to the committee.
        constraints: non-empty, max 2000 chars
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the consensus process.
        default: DRAFT
        constraints: one of DRAFT, BALLOTING, CONSENSUS_REACHED, RECONSIDERATION, ADOPTED, FAILED_CONSENSUS
      - name: round_number
        type: integer
        source: system
        description: Ballot round counter; incremented by every open-ballot call. Votes are scoped to it.
        default: 0
      - name: ballot_deadline_date
        type: string
        source: input
        description: Optional ISO date (YYYY-MM-DD) recorded when a ballot round is opened; advisory only.
        default: null
      - name: support_weight
        type: integer
        source: computed
        description: Sum of weight_snapshot over current-round votes with ballot SUPPORT and ballot_status CAST.
        default: 0
      - name: oppose_weight
        type: integer
        source: computed
        description: Sum of weight_snapshot over current-round votes with ballot OPPOSE and ballot_status CAST.
        default: 0
      - name: abstain_weight
        type: integer
        source: computed
        description: Sum of weight_snapshot over current-round votes with ballot ABSTAIN and ballot_status CAST.
        default: 0
      - name: quorum_pct
        type: number
        source: computed
        description: See calculations.position_ballot_tally; participation share of committee.total_voting_weight at the last tally.
        default: 0
      - name: consensus_pct
        type: number
        source: computed
        description: See calculations.position_ballot_tally; support share of SUPPORT+OPPOSE weight at the last tally.
        default: 0
      - name: last_tally_outcome
        type: enum
        source: computed
        description: Branch taken by the last tally call.
        default: NONE
        constraints: one of NONE, CONSENSUS, NO_QUORUM, DISSENSUS
      - name: dissent_register_count
        type: integer
        source: computed
        description: Number of votes moved to dissent_status RECORDED when the position was adopted.
        default: 0
      - name: adopted_at
        type: datetime
        source: system
        description: Logical-clock instant of the adopt transition; null until ADOPTED.
        default: null

  - name: PositionVote
    parent: PolicyPosition
    common_fields: true
    fields:
      - name: position_id
        type: string
        source: system
        description: FK -> PolicyPosition.id; taken from the path.
      - name: member_id
        type: string
        source: system
        description: FK -> Member.id; resolved from the casting MemberDelegate's X-User-ID.
      - name: ballot
        type: enum
        source: input
        description: The delegate's ballot for the current round.
        constraints: one of SUPPORT, OPPOSE, ABSTAIN
      - name: dissent_statement
        type: string
        source: input
        description: Formal dissent language; permitted only together with ballot OPPOSE.
        default: null
        constraints: max 1000 chars
      - name: round_number
        type: integer
        source: system
        description: Copied from PolicyPosition.round_number at cast time.
      - name: weight_snapshot
        type: integer
        source: computed
        description: Copy of the caster's CommitteeSeat.voting_weight at cast time; later seat damping does not rewrite it.
      - name: ballot_status
        type: enum
        source: system
        description: First state axis. CAST at creation; SUPERSEDED when the same member casts again in the same round or when a new round opens.
        default: CAST
        constraints: one of CAST, SUPERSEDED
      - name: dissent_status
        type: enum
        source: system
        description: Second, independent state axis. NONE when no dissent_statement was supplied, FILED when supplied, WITHDRAWN after withdraw-dissent, RECORDED when adoption registers it.
        default: NONE
        constraints: one of NONE, FILED, WITHDRAWN, RECORDED

  - name: LobbyingRegistration
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_code
        type: enum
        source: input
        description: Filing jurisdiction; selects the JURISDICTION_RULES row (threshold, cadence, limits).
        constraints: one of FEDERAL, STATE_CA, STATE_NY
      - name: registrant_name
        type: string
        source: input
        description: Registrant identity as filed; (jurisdiction_code, registrant_name) is the coverage-overlap resource key.
        constraints: non-empty, max 200 chars
      - name: coverage_start_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) the registration begins to cover activity, inclusive.
      - name: coverage_end_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) the registration stops covering activity, inclusive; must be > coverage_start_date.
      - name: status
        type: enum
        source: system
        description: Registration lifecycle; only ACTIVE accepts activity logging.
        default: DRAFT
        constraints: one of DRAFT, ACTIVE, AMENDMENT_PENDING, TERMINATED
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant of the file transition; null while DRAFT.
        default: null
      - name: amendment_round
        type: integer
        source: system
        description: Number of completed certify-amendment calls; gates the one-shot threshold auto-amendment.
        default: 0
      - name: ytd_reportable_cents
        type: integer
        source: computed
        description: Sum of expenditure_cents over LobbyingActivity rows of this registration with status LOGGED.
        default: 0
      - name: ytd_reportable_hours
        type: number
        source: computed
        description: Sum of hours over LobbyingActivity rows of this registration with status LOGGED, three decimals.
        default: 0
      - name: terminated_at
        type: datetime
        source: system
        description: Logical-clock instant of the terminate transition; null unless TERMINATED.
        default: null

  - name: LobbyingActivity
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> LobbyingRegistration.id; the registration under which the activity is reportable.
      - name: position_id
        type: string
        source: input
        description: FK -> PolicyPosition.id; the ADOPTED position the activity advocates.
      - name: activity_kind
        type: enum
        source: input
        description: Nature of the advocacy contact or spend.
        constraints: one of DIRECT_LOBBYING, COALITION_CONTRIBUTION, THIRD_PARTY_ADVOCACY, GRASSROOTS_SUPPORT
      - name: coalition_partner_name
        type: string
        source: input
        description: Third party or coalition counterpart; required when activity_kind IN {COALITION_CONTRIBUTION, THIRD_PARTY_ADVOCACY}.
        default: null
      - name: third_party_disclosure_required
        type: boolean
        source: computed
        description: True iff activity_kind == THIRD_PARTY_ADVOCACY, or activity_kind == COALITION_CONTRIBUTION and expenditure_cents >= COALITION_DISCLOSURE_FLOOR_CENTS.
        default: false
      - name: activity_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) the activity occurred; must fall inside the registration coverage window, inclusive of both endpoints.
      - name: hours
        type: number
        source: input
        description: In-house staff hours spent, up to three decimals; drives the METHOD_B staff cost.
        constraints: ">= 0, <= 999.999, at most three decimals"
      - name: expenditure_cents
        type: integer
        source: input
        description: Out-of-pocket expenditure in cents.
        constraints: ">= 0"
      - name: staff_cost_cents
        type: integer
        source: computed
        description: round_half_up(hours * STAFF_HOURLY_RATE_CENTS) evaluated per activity, never over a summed hour total.
      - name: logged_at
        type: datetime
        source: system
        description: Logical-clock instant the activity row was created.
      - name: status
        type: enum
        source: system
        description: LOGGED at creation; VOIDED after a void call, which reverses every accumulator it fed.
        default: LOGGED
        constraints: one of LOGGED, VOIDED
      - name: void_reason
        type: string
        source: system
        description: Reason captured from the void call body; null while LOGGED.
        default: null

  - name: ExpenditureReport
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> LobbyingRegistration.id; the registration whose activity the report covers.
      - name: period_code
        type: string
        source: input
        description: Reporting period label; QUARTERLY jurisdictions use "<YYYY>Q<1-4>", SEMIANNUAL use "<YYYY>H<1-2>".
      - name: period_start_date
        type: string
        source: computed
        description: First calendar date of period_code (inclusive).
      - name: period_end_date
        type: string
        source: computed
        description: Last calendar date of period_code (inclusive).
      - name: due_date
        type: string
        source: computed
        description: period_end_date + FILING_LAG_DAYS[cadence]; the regulatory filing-calendar deadline.
      - name: basis
        type: enum
        source: input
        description: Which computed total is filed; METHOD_A is the tax-code total, METHOD_B the statutory total including in-house staff cost.
        constraints: one of METHOD_A, METHOD_B
      - name: method_a_total_cents
        type: integer
        source: computed
        description: Variant A of calculations.reportable_expenditure_total - out-of-pocket expenditure only.
        default: 0
      - name: method_b_total_cents
        type: integer
        source: computed
        description: Variant B of calculations.reportable_expenditure_total - expenditure plus per-activity rounded staff cost.
        default: 0
      - name: filed_total_cents
        type: integer
        source: computed
        description: method_a_total_cents when basis == METHOD_A, else method_b_total_cents.
        default: 0
      - name: included_activity_count
        type: integer
        source: computed
        description: Number of LobbyingActivity rows in the inclusion set of this report.
        default: 0
      - name: status
        type: enum
        source: system
        description: OPEN while draftable, CERTIFIED once filed, SUPERSEDED when a later report for the same (registration_id, period_code) replaces it.
        default: OPEN
        constraints: one of OPEN, CERTIFIED, SUPERSEDED
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who created the report; one half of the segregation-of-duties pair.
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the certifying ComplianceOfficer; must differ from created_by_user_id.
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification; null while OPEN or SUPERSEDED.
        default: null
      - name: late
        type: boolean
        source: computed
        description: True iff the certification date (UTC date part of certified_at) is strictly after due_date.
        default: false

  - name: GrassrootsCampaign
    parent: null
    common_fields: true
    fields:
      - name: position_id
        type: string
        source: input
        description: FK -> PolicyPosition.id; must be ADOPTED at campaign creation.
      - name: name
        type: string
        source: input
        description: Campaign name shown on member action alerts.
        constraints: non-empty, max 200 chars
      - name: target_jurisdiction_code
        type: enum
        source: input
        description: Jurisdiction whose grassroots disclosure threshold applies; must equal the position's jurisdiction_code.
        constraints: one of FEDERAL, STATE_CA, STATE_NY
      - name: status
        type: enum
        source: system
        description: PLANNED until the first DISPATCHED alert flips it to LIVE; CLOSED by an explicit close call.
        default: PLANNED
        constraints: one of PLANNED, LIVE, CLOSED
      - name: alert_count
        type: integer
        source: computed
        description: Number of ActionAlert rows under this campaign, both DISPATCHED and NO_MATCH.
        default: 0
      - name: matched_member_total
        type: integer
        source: computed
        description: Sum of matched_member_count over this campaign's alerts.
        default: 0
      - name: unmatched_alert_count
        type: integer
        source: computed
        description: Number of this campaign's alerts with status NO_MATCH.
        default: 0
      - name: cumulative_cost_cents
        type: integer
        source: computed
        description: Sum of cost_cents over this campaign's alerts; NO_MATCH alerts contribute 0.
        default: 0
      - name: disclosure_required
        type: boolean
        source: computed
        description: True once cumulative_cost_cents >= JURISDICTION_RULES[target_jurisdiction_code].grassroots_disclosure_threshold_cents; never reverts.
        default: false
      - name: last_alert_at
        type: datetime
        source: system
        description: dispatched_at of the most recent alert with status DISPATCHED; NO_MATCH alerts do not update it.
        default: null

  - name: ActionAlert
    parent: GrassrootsCampaign
    common_fields: false
    fields:
      - name: campaign_id
        type: string
        source: system
        description: FK -> GrassrootsCampaign.id; taken from the path.
      - name: target_district_code
        type: string
        source: input
        description: Legislative district the alert mobilises (e.g. "CA-12"); matched against Member.home_district_code.
      - name: target_chamber
        type: enum
        source: input
        description: Chamber the alert targets.
        constraints: one of US_HOUSE, US_SENATE, STATE_ASSEMBLY
      - name: message_subject
        type: string
        source: input
        description: Subject line of the member action alert.
        constraints: non-empty, max 200 chars
      - name: unit_cost_cents
        type: integer
        source: input
        description: Cost charged per matched member; the grassroots-cost driver.
        constraints: ">= 0"
      - name: matched_member_ids
        type: array
        source: computed
        description: Member ids produced by calculations.constituent_match_set in selector order (engagement_score DESC, created_at ASC). Ordering payload, not a foreign-key declaration.
        default: []
      - name: matched_member_count
        type: integer
        source: computed
        description: Length of matched_member_ids.
        default: 0
      - name: cost_cents
        type: integer
        source: computed
        description: unit_cost_cents * matched_member_count; 0 when the match set is empty.
        default: 0
      - name: status
        type: enum
        source: computed
        description: DISPATCHED when matched_member_count >= 1, NO_MATCH when the match set is empty.
        constraints: one of DISPATCHED, NO_MATCH
      - name: dispatched_at
        type: datetime
        source: system
        description: Logical-clock instant the alert row was created, regardless of status.

  - name: PriorApproval
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the member whose restricted class is being made solicitable.
      - name: calendar_year
        type: integer
        source: input
        description: Calendar year of the approval; both window endpoints must fall inside it.
        constraints: 2020..2100
      - name: solicitable_class_size
        type: integer
        source: input
        description: Number of the member's executives covered; must not exceed Member.restricted_class_size.
        constraints: ">= 1"
      - name: effective_date
        type: string
        source: input
        description: ISO date the solicitation window opens, inclusive.
      - name: expires_at_date
        type: string
        source: input
        description: ISO date the solicitation window closes, inclusive; must be >= effective_date.
      - name: status
        type: enum
        source: system
        description: REQUESTED by the association, GRANTED by the member, REVOKED by the member, EXPIRED by a filing cycle run past expires_at_date.
        default: REQUESTED
        constraints: one of REQUESTED, GRANTED, REVOKED, EXPIRED
      - name: authorized_by_name
        type: string
        source: system
        description: Name of the member officer who granted the approval; captured from the grant body.
        default: null
      - name: granted_at
        type: datetime
        source: system
        description: Logical-clock instant of the grant transition.
        default: null
      - name: granted_by_user_id
        type: string
        source: system
        description: X-User-ID of the granting MemberDelegate; always equals member_id.
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of the revoke transition.
        default: null

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Candidate name as it appears on the contribution check.
        constraints: non-empty, max 200 chars
      - name: office
        type: enum
        source: input
        description: Office sought.
        constraints: one of US_HOUSE, US_SENATE, STATE_ASSEMBLY
      - name: jurisdiction_code
        type: enum
        source: input
        description: Jurisdiction whose per-candidate contribution limit applies.
        constraints: one of FEDERAL, STATE_CA, STATE_NY
      - name: district_code
        type: string
        source: input
        description: District the candidate runs in; joined against ActionAlert.target_district_code for the engagement factor.
      - name: election_cycle
        type: string
        source: input
        description: Cycle label (e.g. "2026-GENERAL"); the aggregation window for the contribution limit.
        constraints: non-empty
      - name: incumbency
        type: enum
        source: input
        description: Incumbency status; selects INCUMBENCY_FACTOR in the scoring formula.
        constraints: one of INCUMBENT, CHALLENGER, OPEN_SEAT
      - name: voting_alignment_pct
        type: number
        source: input
        description: Recorded alignment with adopted association positions, two decimals.
        constraints: 0.00..100.00
      - name: committee_relevance_score
        type: integer
        source: input
        description: Relevance of the candidate's committee assignments to association priorities.
        constraints: 0..100
      - name: latest_support_score
        type: number
        source: computed
        description: support_score of the most recently created PacContribution for this candidate; 0 when none exists.
        default: 0
      - name: pending_support_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this candidate's PacContribution rows with status PENDING_BOARD.
        default: 0
      - name: committed_support_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this candidate's PacContribution rows with status BOARD_APPROVED.
        default: 0
      - name: disbursed_support_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this candidate's PacContribution rows with status DISBURSED.
        default: 0

  - name: SegregatedFund
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Name of the separate segregated fund (the association's PAC).
        constraints: non-empty, max 200 chars
      - name: fund_year
        type: integer
        source: input
        description: Accounting year of the fund; receipts and contributions must belong to it.
        constraints: 2020..2100
      - name: jurisdiction_code
        type: enum
        source: input
        description: Filing jurisdiction of the fund; selects the filing cadence and lag.
        constraints: one of FEDERAL, STATE_CA, STATE_NY
      - name: min_reserve_cents
        type: integer
        source: input
        description: Reserve floor; posture flips to RESTRICTED once available_balance_cents < min_reserve_cents.
        constraints: ">= 0"
      - name: receipts_total_cents
        type: integer
        source: computed
        description: Cumulative solicited receipts credited to the fund.
        default: 0
      - name: committed_balance_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this fund's PacContribution rows with status BOARD_APPROVED.
        default: 0
      - name: disbursed_total_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this fund's PacContribution rows with status DISBURSED.
        default: 0
      - name: filing_fee_accrued_cents
        type: integer
        source: computed
        description: Cumulative regulatory filing fees, surcharges and late penalties charged by filing-cycle runs.
        default: 0
      - name: available_balance_cents
        type: integer
        source: computed
        description: receipts_total_cents - committed_balance_cents - disbursed_total_cents - filing_fee_accrued_cents.
        default: 0
      - name: posture
        type: enum
        source: computed
        description: RESTRICTED while available_balance_cents < min_reserve_cents, else OPEN; gates board approval and suspends pending contributions.
        default: OPEN
        constraints: one of OPEN, RESTRICTED
      - name: filings_completed_count
        type: integer
        source: system
        description: Number of completed filing-cycle runs.
        default: 0
      - name: last_filed_period_code
        type: string
        source: system
        description: period_code of the most recent filing-cycle run.
        default: null

  - name: PacContribution
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: FK -> SegregatedFund.id; the fund the money leaves.
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; the recipient candidate.
      - name: amount_cents
        type: integer
        source: input
        description: Proposed contribution amount in cents.
        constraints: ">= 1"
      - name: memo
        type: string
        source: input
        description: Optional decision memo recorded with the proposal.
        default: null
      - name: support_score
        type: number
        source: computed
        description: calculations.candidate_support_score evaluated at creation, two decimals; frozen thereafter.
      - name: max_allowed_cents
        type: integer
        source: computed
        description: calculations.contribution_allowance evaluated at creation; the ceiling amount_cents was checked against.
      - name: status
        type: enum
        source: system
        description: PENDING_BOARD at creation, SUSPENDED while the fund posture is RESTRICTED, BOARD_APPROVED after board approval, DISBURSED after disbursement, VOIDED after compensation.
        default: PENDING_BOARD
        constraints: one of PENDING_BOARD, BOARD_APPROVED, SUSPENDED, DISBURSED, VOIDED
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the proposing GovAffairsDirector.
      - name: board_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the approving BoardTrustee.
        default: null
      - name: disbursed_at
        type: datetime
        source: system
        description: Logical-clock instant of disbursement.
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant of the void.
        default: null
      - name: void_reason
        type: string
        source: system
        description: Reason captured from the void body.
        default: null

state_machines:
  - entity: PolicyPosition
    initial_state: DRAFT
    terminal_states: [ADOPTED, FAILED_CONSENSUS]
    transitions:
      - from: DRAFT
        to: BALLOTING
        trigger: "POST /advocacy/policy-positions/{id}/open-ballot"
        actor: GovAffairsDirector
        preconditions:
          - "position.status == DRAFT"
          - "committee.roster_state IN {QUORATE, IMPAIRED} (i.e. seat_count >= MIN_SEATS); FORMING is rejected with ERR_COMMITTEE_FORMING"
          - "position.round_number < MAX_BALLOT_ROUNDS"
        side_effects:
          - "position.round_number += 1"
          - "position.ballot_deadline_date = body.ballot_deadline_date when supplied, else unchanged"
          - "position.support_weight = 0, oppose_weight = 0, abstain_weight = 0, quorum_pct = 0, consensus_pct = 0, last_tally_outcome = NONE"
          - "every PositionVote of this position with round_number < position.round_number and ballot_status == CAST flips to ballot_status SUPERSEDED (dissent_status is NOT touched - the two axes are independent)"
      - from: RECONSIDERATION
        to: BALLOTING
        trigger: "POST /advocacy/policy-positions/{id}/open-ballot"
        actor: GovAffairsDirector
        preconditions:
          - "position.status == RECONSIDERATION"
          - "position.round_number < MAX_BALLOT_ROUNDS"
        side_effects:
          - "identical to the DRAFT -> BALLOTING side effects; this edge closes the negotiation cycle BALLOTING -> RECONSIDERATION -> BALLOTING"
        note: "Cycle edge. Reachable only with round_number 1 or 2, because a failed round-3 tally lands in the terminal FAILED_CONSENSUS state instead of RECONSIDERATION. An open-ballot on a FAILED_CONSENSUS position (round_number == MAX_BALLOT_ROUNDS) is refused with ERR_MAX_BALLOT_ROUNDS at priority 25, not with the generic priority-8 state error."
      - from: BALLOTING
        to: CONSENSUS_REACHED
        trigger: "POST /advocacy/policy-positions/{id}/tally"
        actor: GovAffairsDirector
        preconditions:
          - "position.status == BALLOTING"
          - "at least one PositionVote of the current round has ballot_status == CAST, else ERR_NO_BALLOTS_CAST"
          - "quorum_pct >= committee.quorum_threshold_pct"
          - "consensus_pct >= committee.consensus_threshold_pct"
        side_effects:
          - "position.support_weight / oppose_weight / abstain_weight recomputed from current-round CAST votes"
          - "position.quorum_pct and position.consensus_pct written per calculations.position_ballot_tally"
          - "position.last_tally_outcome = CONSENSUS"
      - from: BALLOTING
        to: RECONSIDERATION
        trigger: "POST /advocacy/policy-positions/{id}/tally"
        actor: GovAffairsDirector
        preconditions:
          - "position.status == BALLOTING"
          - "at least one PositionVote of the current round has ballot_status == CAST"
          - "quorum_pct < committee.quorum_threshold_pct OR consensus_pct < committee.consensus_threshold_pct"
          - "position.round_number < MAX_BALLOT_ROUNDS"
        side_effects:
          - "position.last_tally_outcome = NO_QUORUM when the quorum test failed, else DISSENSUS (the quorum test is evaluated first)"
          - "position.support_weight / oppose_weight / abstain_weight / quorum_pct / consensus_pct written from this round's ballots"
        note: "Branch B of the fork. The same trigger from the same state selects this edge or the CONSENSUS_REACHED edge purely on the tally numbers."
      - from: BALLOTING
        to: FAILED_CONSENSUS
        trigger: "POST /advocacy/policy-positions/{id}/tally"
        actor: GovAffairsDirector
        preconditions:
          - "position.status == BALLOTING"
          - "at least one PositionVote of the current round has ballot_status == CAST"
          - "quorum_pct < committee.quorum_threshold_pct OR consensus_pct < committee.consensus_threshold_pct"
          - "position.round_number == MAX_BALLOT_ROUNDS"
        side_effects:
          - "position.last_tally_outcome = NO_QUORUM or DISSENSUS as above"
          - "position enters the terminal FAILED_CONSENSUS state; no further ballot round may be opened"
      - from: CONSENSUS_REACHED
        to: ADOPTED
        trigger: "POST /advocacy/policy-positions/{id}/adopt"
        actor: BoardTrustee
        preconditions:
          - "position.status == CONSENSUS_REACHED"
          - "committee.roster_state == QUORATE (IMPAIRED or FORMING is rejected with ERR_COMMITTEE_NOT_QUORATE)"
        side_effects:
          - "position.status = ADOPTED; position.adopted_at = logical clock"
          - "CASCADE LINK 1 (position -> votes): every PositionVote of this position with round_number == position.round_number, ballot_status == CAST, ballot == OPPOSE and dissent_status == FILED moves to dissent_status RECORDED; position.dissent_register_count = the number of votes so moved"
          - "CASCADE LINK 2 (votes -> members): because those vote rows reached RECORDED, each distinct Member.recorded_dissent_count increments by 1"
          - "CASCADE LINK 3 (members -> seats): because that member's recorded_dissent_count grew, the member's CommitteeSeat on this position's committee increments dissent_strikes by 1, and when dissent_strikes >= DISSENT_DAMPING_STRIKES the seat flips status ACTIVE -> DAMPENED and voting_weight is re-derived to max(1, floor(TIER_WEIGHT[tier]/2))"
          - "CASCADE LINK 4 (seats -> committee): because a seat voting_weight changed, PolicyCommittee.total_voting_weight and roster_state are recomputed (QUORATE may become IMPAIRED)"

  - entity: PositionVote
    initial_state: CAST
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CAST
        to: SUPERSEDED
        trigger: "POST /advocacy/policy-positions/{id}/votes (same member, same round) or POST /advocacy/policy-positions/{id}/open-ballot"
        actor: MemberDelegate
        preconditions:
          - "the prior vote row has ballot_status == CAST"
          - "for the re-cast form: the new vote is by the same member_id on the same position with the same round_number"
        side_effects:
          - "prior vote row ballot_status = SUPERSEDED; its dissent_status is left exactly as it was (a SUPERSEDED row with dissent_status FILED can never reach RECORDED, because adoption only registers CAST rows)"
          - "position.support_weight / oppose_weight / abstain_weight are recomputed at the next tally, not here"
        note: "AXIS 1 of two independent axes on this entity: ballot_status."
      - from: NONE
        to: FILED
        trigger: "POST /advocacy/policy-positions/{id}/votes with a non-empty dissent_statement"
        actor: MemberDelegate
        preconditions:
          - "ballot == OPPOSE, else ERR_DISSENT_REQUIRES_OPPOSE"
          - "dissent_statement is non-empty after trimming"
        side_effects:
          - "the new vote row is created with dissent_status = FILED and ballot_status = CAST"
        note: "AXIS 2 of two independent axes on this entity: dissent_status. Set at creation time; NONE when no statement is supplied."
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /advocacy/policy-positions/{id}/votes/{vote_id}/withdraw-dissent"
        actor: MemberDelegate
        preconditions:
          - "vote.dissent_status == FILED"
          - "position.status IN {BALLOTING, RECONSIDERATION} - a dissent may not be withdrawn once the position left the ballot cycle"
          - "X-User-ID == vote.member_id"
        side_effects:
          - "vote.dissent_status = WITHDRAWN; vote.ballot_status is untouched, so a still-CAST ballot keeps counting as OPPOSE weight in the tally"
        note: "AXIS 2 moves without AXIS 1 moving - this is the observable proof the two axes are independent."
      - from: FILED
        to: RECORDED
        trigger: "system, during POST /advocacy/policy-positions/{id}/adopt"
        actor: system
        preconditions:
          - "vote.ballot_status == CAST"
          - "vote.round_number == position.round_number"
          - "vote.ballot == OPPOSE"
        side_effects:
          - "vote.dissent_status = RECORDED; feeds CASCADE LINK 2 of the adopt transition"

  - entity: CommitteeSeat
    initial_state: ACTIVE
    terminal_states: []
    terminal_states_note: "A seat is never deleted; damping is one-way for the life of the seat."
    transitions:
      - from: ACTIVE
        to: DAMPENED
        trigger: "system, CASCADE LINK 3 of POST /advocacy/policy-positions/{id}/adopt"
        actor: system
        preconditions:
          - "seat.dissent_strikes >= DISSENT_DAMPING_STRIKES after the increment"
        side_effects:
          - "seat.voting_weight = max(1, floor(TIER_WEIGHT[member.membership_tier] / 2))"
          - "committee.total_voting_weight and committee.roster_state recomputed (CASCADE LINK 4)"

  - entity: LobbyingRegistration
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /advocacy/lobbying-registrations/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "registration.status == DRAFT"
          - "no other LobbyingRegistration with the same (jurisdiction_code, registrant_name) and status IN {ACTIVE, AMENDMENT_PENDING} has a coverage window overlapping this one under half-open [coverage_start_date, coverage_end_date) semantics, else ERR_REGISTRATION_COVERAGE_OVERLAP"
        side_effects:
          - "registration.filed_at = logical clock; status = ACTIVE"
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "POST /advocacy/lobbying-registrations/{id}/amend"
        actor: ComplianceOfficer
        preconditions:
          - "registration.status == ACTIVE"
        side_effects:
          - "status = AMENDMENT_PENDING; activity logging is refused with ERR_REGISTRATION_NOT_ACTIVE until the amendment is certified"
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "system, during POST /advocacy/lobbying-activities when the reportable threshold is crossed"
        actor: system
        preconditions:
          - "registration.amendment_round == 0 (the auto-amendment fires at most once per registration)"
          - "registration.ytd_reportable_cents (after adding this activity) >= JURISDICTION_RULES[jurisdiction_code].registration_threshold_cents"
        side_effects:
          - "status = ACTIVE -> AMENDMENT_PENDING in the same request that created the activity; the activity itself is still created with status LOGGED"
        note: "Rate/threshold trigger with >= boundary semantics; exactly reaching the threshold flips the registration."
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /advocacy/lobbying-registrations/{id}/certify-amendment"
        actor: ComplianceOfficer
        preconditions:
          - "registration.status == AMENDMENT_PENDING"
        side_effects:
          - "status = ACTIVE; registration.amendment_round += 1 (which permanently disarms the auto-amendment trigger)"
        note: "Cycle edge: ACTIVE -> AMENDMENT_PENDING -> ACTIVE."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /advocacy/lobbying-registrations/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "registration.status == ACTIVE"
          - "no ExpenditureReport of this registration has status OPEN, else ERR_OPEN_REPORT_BLOCKS_TERMINATION"
        side_effects:
          - "status = TERMINATED; terminated_at = logical clock; further activity logging and report creation are refused"

  - entity: LobbyingActivity
    initial_state: LOGGED
    terminal_states: [VOIDED]
    transitions:
      - from: LOGGED
        to: VOIDED
        trigger: "POST /advocacy/lobbying-activities/{id}/void"
        actor: GovAffairsDirector
        preconditions:
          - "activity.status == LOGGED"
          - "no ExpenditureReport whose inclusion set contains this activity has status CERTIFIED, else ERR_ACTIVITY_IN_CERTIFIED_REPORT"
        side_effects:
          - "activity.status = VOIDED; void_reason recorded"
          - "registration.ytd_reportable_cents -= activity.expenditure_cents and registration.ytd_reportable_hours -= activity.hours (compensating exactly the amounts the log added)"
          - "every ExpenditureReport with status OPEN whose inclusion set contained this activity recomputes method_a_total_cents, method_b_total_cents, filed_total_cents and included_activity_count"

  - entity: ExpenditureReport
    initial_state: OPEN
    terminal_states: [CERTIFIED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: CERTIFIED
        trigger: "POST /advocacy/expenditure-reports/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == OPEN"
          - "report.included_activity_count >= 1, else ERR_EMPTY_REPORT"
          - "X-User-ID != report.created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "logical clock date >= report.period_end_date, else ERR_PERIOD_NOT_CLOSED"
        side_effects:
          - "report.status = CERTIFIED; certified_by_user_id = X-User-ID; certified_at = logical clock"
          - "report.late = true when the UTC date part of certified_at > report.due_date"
          - "the certified report's filed_total_cents enters the input set of calculations.dues_deductibility_notice for every Member with dues_year == the report's period year"
      - from: OPEN
        to: SUPERSEDED
        trigger: "system, during POST /advocacy/expenditure-reports for the same (registration_id, period_code)"
        actor: system
        preconditions:
          - "the prior report has status OPEN"
        side_effects:
          - "prior report.status = SUPERSEDED; its totals are frozen at their current values and are never recomputed again"
        note: "This is the legitimate create-with-supersede semantics that makes the OCC rule in concurrency_rules necessary."

  - entity: GrassrootsCampaign
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: LIVE
        trigger: "system, during POST /advocacy/grassroots-campaigns/{id}/alerts when the alert resolves to status DISPATCHED"
        actor: system
        preconditions:
          - "campaign.status == PLANNED"
          - "the new alert's matched_member_count >= 1"
        side_effects:
          - "campaign.status = LIVE; campaign.last_alert_at = alert.dispatched_at"
        note: "A NO_MATCH alert leaves the campaign in PLANNED and does not set last_alert_at."
      - from: PLANNED
        to: CLOSED
        trigger: "POST /advocacy/grassroots-campaigns/{id}/close"
        actor: GovAffairsDirector
        preconditions:
          - "campaign.status == PLANNED"
        side_effects:
          - "campaign.status = CLOSED; no further alerts may be dispatched"
      - from: LIVE
        to: CLOSED
        trigger: "POST /advocacy/grassroots-campaigns/{id}/close"
        actor: GovAffairsDirector
        preconditions:
          - "campaign.status == LIVE"
        side_effects:
          - "campaign.status = CLOSED; cumulative_cost_cents and disclosure_required are frozen at their current values"

  - entity: PriorApproval
    initial_state: REQUESTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /advocacy/prior-approvals/{id}/grant"
        actor: MemberDelegate
        preconditions:
          - "approval.status == REQUESTED"
          - "X-User-ID == approval.member_id, else ERR_MEMBER_SCOPE_VIOLATION (the association may never grant its own solicitation approval)"
          - "member.status == ACTIVE, else ERR_MEMBER_NOT_ACTIVE"
          - "logical clock date <= approval.expires_at_date, else ERR_PRIOR_APPROVAL_EXPIRED"
        side_effects:
          - "approval.status = GRANTED; granted_at = logical clock; granted_by_user_id = X-User-ID; authorized_by_name recorded"
          - "member.pac_solicitable is recomputed and becomes true once the clock date is inside [effective_date, expires_at_date]"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /advocacy/prior-approvals/{id}/revoke"
        actor: MemberDelegate
        preconditions:
          - "approval.status == GRANTED"
          - "X-User-ID == approval.member_id"
        side_effects:
          - "approval.status = REVOKED; revoked_at = logical clock"
          - "member.pac_solicitable recomputed to false unless another GRANTED approval still covers the clock date; subsequent receipts naming this member are refused with ERR_PRIOR_APPROVAL_NOT_GRANTED"
      - from: REQUESTED
        to: EXPIRED
        trigger: "system, during POST /advocacy/segregated-funds/{id}/filing-cycle"
        actor: system
        preconditions:
          - "logical clock date > approval.expires_at_date"
        side_effects:
          - "approval.status = EXPIRED"
      - from: GRANTED
        to: EXPIRED
        trigger: "system, during POST /advocacy/segregated-funds/{id}/filing-cycle"
        actor: system
        preconditions:
          - "logical clock date > approval.expires_at_date"
        side_effects:
          - "approval.status = EXPIRED; member.pac_solicitable recomputed to false"
        note: "Ops-run checkpoint: the filing cycle is the only clock-driven sweep in the system."

  - entity: SegregatedFund
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system, after any mutation that lowers available_balance_cents (board approval, filing cycle fee)"
        actor: system
        preconditions:
          - "available_balance_cents < min_reserve_cents after the mutation"
        side_effects:
          - "fund.posture = RESTRICTED"
          - "every PacContribution of this fund with status PENDING_BOARD flips to SUSPENDED, and each affected Candidate.pending_support_cents decrements by that row's amount_cents"
          - "further board approvals on this fund are refused with ERR_FUND_RESTRICTED"
      - from: RESTRICTED
        to: OPEN
        trigger: "system, after any mutation that raises available_balance_cents (receipts)"
        actor: system
        preconditions:
          - "available_balance_cents >= min_reserve_cents after the mutation"
        side_effects:
          - "fund.posture = OPEN"
          - "every PacContribution of this fund with status SUSPENDED reverts to PENDING_BOARD, and each affected Candidate.pending_support_cents increments by that row's amount_cents"
        note: "Posture is a pure function of the balance fields; the two edges are the observable half of that function."

  - entity: PacContribution
    initial_state: PENDING_BOARD
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING_BOARD
        to: SUSPENDED
        trigger: "system, CASCADE LINK 3 of the fund posture flip OPEN -> RESTRICTED"
        actor: system
        preconditions:
          - "contribution.status == PENDING_BOARD"
        side_effects:
          - "contribution.status = SUSPENDED; candidate.pending_support_cents -= amount_cents (CASCADE LINK 4)"
      - from: SUSPENDED
        to: PENDING_BOARD
        trigger: "system, on the fund posture flip RESTRICTED -> OPEN"
        actor: system
        preconditions:
          - "contribution.status == SUSPENDED"
        side_effects:
          - "contribution.status = PENDING_BOARD; candidate.pending_support_cents += amount_cents"
      - from: PENDING_BOARD
        to: BOARD_APPROVED
        trigger: "POST /advocacy/pac-contributions/{id}/board-approve"
        actor: BoardTrustee
        preconditions:
          - "contribution.status == PENDING_BOARD (SUSPENDED is rejected with ERR_CONTRIBUTION_SUSPENDED)"
          - "fund.posture == OPEN, else ERR_FUND_RESTRICTED"
          - "contribution.amount_cents <= fund.available_balance_cents, else ERR_INSUFFICIENT_FUND_BALANCE (equality is allowed)"
          - "X-User-ID != contribution.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "contribution.status = BOARD_APPROVED; board_approved_by_user_id = X-User-ID"
          - "CASCADE LINK 1: fund.committed_balance_cents += amount_cents, fund.available_balance_cents recomputed"
          - "candidate.pending_support_cents -= amount_cents and candidate.committed_support_cents += amount_cents"
          - "CASCADE LINK 2: when the recomputed available_balance_cents < fund.min_reserve_cents, fund.posture flips OPEN -> RESTRICTED"
          - "CASCADE LINK 3: because posture became RESTRICTED, every other PacContribution of this fund with status PENDING_BOARD flips to SUSPENDED"
          - "CASCADE LINK 4: because those rows left PENDING_BOARD, each of their Candidate.pending_support_cents decrements by that row's amount_cents"
      - from: BOARD_APPROVED
        to: DISBURSED
        trigger: "POST /advocacy/pac-contributions/{id}/disburse"
        actor: ComplianceOfficer
        preconditions:
          - "contribution.status == BOARD_APPROVED, else ERR_CONTRIBUTION_NOT_APPROVED"
          - "candidate's jurisdiction contribution limit still holds for the election_cycle (re-checked at disbursement)"
        side_effects:
          - "contribution.status = DISBURSED; disbursed_at = logical clock"
          - "fund.committed_balance_cents -= amount_cents; fund.disbursed_total_cents += amount_cents (available_balance_cents is unchanged by design - the money was already reserved)"
          - "candidate.committed_support_cents -= amount_cents; candidate.disbursed_support_cents += amount_cents"
      - from: PENDING_BOARD
        to: VOIDED
        trigger: "POST /advocacy/pac-contributions/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "contribution.status == PENDING_BOARD"
        side_effects:
          - "contribution.status = VOIDED; voided_at = logical clock; void_reason recorded"
          - "candidate.pending_support_cents -= amount_cents"
      - from: BOARD_APPROVED
        to: VOIDED
        trigger: "POST /advocacy/pac-contributions/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "contribution.status == BOARD_APPROVED"
        side_effects:
          - "contribution.status = VOIDED; voided_at = logical clock; void_reason recorded"
          - "fund.committed_balance_cents -= amount_cents; available_balance_cents recomputed; posture re-evaluated (RESTRICTED -> OPEN reinstates SUSPENDED siblings)"
          - "candidate.committed_support_cents -= amount_cents"
        note: "Compensating action for board approval; leaves the fund conservation identity untouched."
      - from: SUSPENDED
        to: VOIDED
        trigger: "POST /advocacy/pac-contributions/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "contribution.status == SUSPENDED"
        side_effects:
          - "contribution.status = VOIDED; voided_at = logical clock; void_reason recorded"
          - "no accumulator changes - a SUSPENDED row already contributes to no candidate or fund accumulator"
      - from: DISBURSED
        to: VOIDED
        trigger: "POST /advocacy/pac-contributions/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "contribution.status == DISBURSED"
        side_effects:
          - "contribution.status = VOIDED; voided_at = logical clock; void_reason recorded"
          - "fund.disbursed_total_cents -= amount_cents; available_balance_cents recomputed upward; posture re-evaluated"
          - "candidate.disbursed_support_cents -= amount_cents"
        note: "Compensating action for disbursement (a returned check). Conservation identity receipts_total = available + committed + disbursed + filing_fee_accrued must hold before and after."

concurrency_rules:
  - rule_id: expenditure-report-create-stale-registration
    parent_entity: LobbyingRegistration
    write_endpoint: "POST /advocacy/expenditure-reports"
    occ_field: "expected_registration_version"
    description: |
      Creating an ExpenditureReport against a LobbyingRegistration whose version has
      advanced since the client last read it is rejected. Report creation legitimately
      supersedes any still-OPEN report for the same (registration_id, period_code), so
      a writer holding a stale view of the registration would silently discard a report
      it never saw; the stale-version check turns that into an explicit 412.
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412

calculations:
  - name: position_ballot_tally
    trigger: "POST /advocacy/policy-positions/{id}/tally (also rewrites the four weight fields on the position)"
    algorithm: weighted_scoring
    formula: |
      # Input set: PositionVote rows with position_id == position.id
      #            AND round_number == position.round_number
      #            AND ballot_status == CAST         (SUPERSEDED rows are excluded)
      # dissent_status is irrelevant here: a WITHDRAWN dissent still leaves an OPPOSE ballot counting.
      support_weight = sum(v.weight_snapshot for v in input_set if v.ballot == SUPPORT)
      oppose_weight  = sum(v.weight_snapshot for v in input_set if v.ballot == OPPOSE)
      abstain_weight = sum(v.weight_snapshot for v in input_set if v.ballot == ABSTAIN)
      participating_weight = support_weight + oppose_weight + abstain_weight
      quorum_pct = round_half_up(100 * participating_weight / committee.total_voting_weight, 2)
      if support_weight + oppose_weight == 0:
          consensus_pct = 0.00          # an all-ABSTAIN round has no consensus base
      else:
          consensus_pct = round_half_up(100 * support_weight / (support_weight + oppose_weight), 2)
      # Branch selection, evaluated in exactly this order:
      if quorum_pct < committee.quorum_threshold_pct:
          outcome = NO_QUORUM
      elif consensus_pct >= committee.consensus_threshold_pct:
          outcome = CONSENSUS
      else:
          outcome = DISSENSUS
      next_status = CONSENSUS_REACHED if outcome == CONSENSUS
                    else (RECONSIDERATION if position.round_number < MAX_BALLOT_ROUNDS
                          else FAILED_CONSENSUS)
    input_set: "Current-round CAST votes only; ABSTAIN weight counts toward quorum_pct but is excluded from the consensus_pct denominator."
    constants:
      TIER_WEIGHT: { ASSOCIATE: 1, FULL: 2, PREMIER: 3 }
      MIN_SEATS: 3
      MIN_ROSTER_WEIGHT: 6
      MAX_BALLOT_ROUNDS: 3
      DISSENT_DAMPING_STRIKES: 2
    precision: "percentages to 2 decimals, round_half_up; both threshold comparisons use >= on the rounded value"
    variants: []

  - name: reportable_expenditure_total
    trigger: "POST /advocacy/expenditure-reports (initial computation), POST /advocacy/lobbying-activities and POST /advocacy/lobbying-activities/{id}/void (recomputation of every OPEN report whose inclusion set is touched)"
    algorithm: aggregation
    formula: |
      # Inclusion set (identical for both variants):
      #   LobbyingActivity rows with registration_id == report.registration_id
      #   AND status == LOGGED                     (VOIDED rows never enter)
      #   AND report.period_start_date <= activity_date <= report.period_end_date   (both endpoints inclusive)
      included = that set
      included_activity_count = len(included)
      # VARIANT A - tax-code basis: out-of-pocket expenditure only.
      method_a_total_cents = sum(a.expenditure_cents for a in included)
      # VARIANT B - statutory basis: expenditure plus in-house staff cost.
      # Rounding order is PINNED: the staff cost is rounded PER ACTIVITY and only then summed.
      # (summing hours first and rounding once produces a different cent total - that form is wrong here)
      method_b_total_cents = sum(a.expenditure_cents + round_half_up(a.hours * STAFF_HOURLY_RATE_CENTS)
                                 for a in included)
      filed_total_cents = method_a_total_cents if report.basis == METHOD_A else method_b_total_cents
      # Filing calendar
      cadence = JURISDICTION_RULES[registration.jurisdiction_code].report_cadence
      due_date = period_end_date + FILING_LAG_DAYS[cadence] days
      late = (utc_date(certified_at) > due_date)
    input_set: "LOGGED activities of the report's registration whose activity_date falls in the closed period window; SUPERSEDED and CERTIFIED reports are frozen and never recomputed."
    constants:
      STAFF_HOURLY_RATE_CENTS: 8500
      FILING_LAG_DAYS: { QUARTERLY: 20, SEMIANNUAL: 30 }
    precision: "integer cents; round_half_up applied once per activity to hours * STAFF_HOURLY_RATE_CENTS"
    variants:
      - name: METHOD_A
        when: "report.basis == METHOD_A - the tax-code definition used for the dues deductibility ratio"
        difference: "Excludes in-house staff cost entirely; filed_total_cents == method_a_total_cents."
      - name: METHOD_B
        when: "report.basis == METHOD_B - the statutory lobbying-disclosure definition"
        difference: "Adds round_half_up(hours * 8500) per activity; on identical activity rows this yields a strictly larger and differently-rounded total than METHOD_A."

  - name: dues_deductibility_notice
    trigger: "GET /advocacy/members/{id}/deductibility-notice (computed at read time from the current set of CERTIFIED reports)"
    algorithm: threshold
    formula: |
      # Association-wide lobbying ratio for the member's dues_year.
      certified = ExpenditureReport rows with status == CERTIFIED
                  AND the 4-digit year prefix of period_code == str(member.dues_year)
      lobbying_spend_cents = sum(r.filed_total_cents for r in certified)
      ratio_pct = round_half_up(100 * lobbying_spend_cents / ASSOCIATION_ANNUAL_BUDGET_CENTS, 2)
      ratio_pct = min(ratio_pct, 100.00)
      method = JURISDICTION_RULES[member.home_jurisdiction_code].deductibility_method
      if method == RATIO:
          nondeductible_pct = ratio_pct
          nondeductible_amount_cents = round_half_up(member.annual_dues_cents * nondeductible_pct / 100)
      else:  # FLAT_FLOOR
          nondeductible_pct = max(ratio_pct, FLAT_FLOOR_MIN_PCT)
          dues_base_cents = max(member.annual_dues_cents - FLAT_FLOOR_EXEMPT_BASE_CENTS, 0)
          nondeductible_amount_cents = round_half_up(dues_base_cents * nondeductible_pct / 100)
      deductible_amount_cents = member.annual_dues_cents - nondeductible_amount_cents
    input_set: "Only CERTIFIED reports whose period_code year equals member.dues_year; OPEN and SUPERSEDED reports are excluded, so certifying a report changes every member's notice in the same request-visible way."
    constants:
      ASSOCIATION_ANNUAL_BUDGET_CENTS: 120000000
      FLAT_FLOOR_MIN_PCT: 25.00
      FLAT_FLOOR_EXEMPT_BASE_CENTS: 25000
    precision: "percentages to 2 decimals round_half_up; amounts in integer cents round_half_up"
    variants:
      - name: RATIO
        when: "member.home_jurisdiction_code resolves to deductibility_method RATIO (FEDERAL, STATE_NY)"
        difference: "Applies the raw association ratio to the full dues amount; no floor, no exempt base."
      - name: FLAT_FLOOR
        when: "member.home_jurisdiction_code resolves to deductibility_method FLAT_FLOOR (STATE_CA)"
        difference: "Floors the percentage at 25.00 and applies it to dues minus a 25000-cent exempt base, so two members with identical dues receive different nondeductible amounts."

  - name: candidate_support_score
    trigger: "POST /advocacy/pac-contributions (frozen onto the contribution row as support_score)"
    algorithm: weighted_scoring
    formula: |
      # district_engagement is a cross-entity input: grassroots action taken in the candidate's district.
      matched_actions = sum(al.matched_member_count
                            for al in ActionAlert
                            if al.status == DISPATCHED
                            AND al.target_district_code == candidate.district_code)
      district_engagement = min(100, ENGAGEMENT_PER_ACTION * matched_actions)
      raw = 0.45 * candidate.voting_alignment_pct
          + 0.25 * candidate.committee_relevance_score
          + 0.20 * INCUMBENCY_FACTOR[candidate.incumbency]
          + 0.10 * district_engagement
      support_score = round_half_up(raw, 2)
    input_set: "DISPATCHED alerts of any campaign whose target_district_code equals the candidate's district_code; NO_MATCH alerts contribute nothing."
    constants:
      INCUMBENCY_FACTOR: { INCUMBENT: 100, CHALLENGER: 60, OPEN_SEAT: 80 }
      ENGAGEMENT_PER_ACTION: 10
      SCORE_WEIGHT_ALIGNMENT: 0.45
      SCORE_WEIGHT_RELEVANCE: 0.25
      SCORE_WEIGHT_INCUMBENCY: 0.20
      SCORE_WEIGHT_ENGAGEMENT: 0.10
    precision: "2 decimals, round_half_up, applied once to the assembled weighted sum"
    variants: []

  - name: contribution_allowance
    trigger: "POST /advocacy/pac-contributions (frozen onto the contribution row as max_allowed_cents)"
    algorithm: tiered_pricing
    formula: |
      limit_cents = JURISDICTION_RULES[candidate.jurisdiction_code].per_candidate_election_limit_cents
      if   support_score >= 85.00: tier_share = 1.00
      elif support_score >= 70.00: tier_share = 0.50
      elif support_score >= 55.00: tier_share = 0.25
      else: reject with ERR_SCORE_BELOW_FLOOR
      tier_allowance_cents = round_half_up(limit_cents * tier_share)
      already_cents = sum(c.amount_cents
                          for c in PacContribution
                          if c.candidate_id == candidate.id
                          AND c.status IN {PENDING_BOARD, SUSPENDED, BOARD_APPROVED, DISBURSED})
      remaining_cents = max(limit_cents - already_cents, 0)
      max_allowed_cents = min(tier_allowance_cents, remaining_cents)
      # Acceptance test, evaluated after the score floor:
      if amount_cents > max_allowed_cents: reject with ERR_CONTRIBUTION_LIMIT_EXCEEDED
      # amount_cents == max_allowed_cents is accepted (the boundary is inclusive)
    input_set: "Contributions to the same candidate in the same election_cycle with status IN {PENDING_BOARD, SUSPENDED, BOARD_APPROVED, DISBURSED}; VOIDED rows are excluded, so a void frees the headroom again."
    constants:
      SCORE_TIER_FULL: 85.00
      SCORE_TIER_HALF: 70.00
      SCORE_TIER_QUARTER: 55.00
    precision: "integer cents; tier_share multiplication rounded once with round_half_up"
    variants: []

  - name: constituent_match_set
    trigger: "POST /advocacy/grassroots-campaigns/{id}/alerts"
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter - the candidate set, as an explicit predicate:
      candidates = [ m for m in Member
                     if m.status == ACTIVE
                     AND m.advocacy_optout == false
                     AND m.home_district_code == alert.target_district_code
                     AND exists CommitteeSeat s where s.member_id == m.id
                         AND s.committee_id == campaign.position.committee_id
                         AND s.status IN {ACTIVE, DAMPENED} ]
      # (b) ranking expression:  engagement_score DESC
      # (c) tie-break:           created_at ASC   (never id)
      ordered = sort(candidates, key=(-m.engagement_score, m.created_at))
      matched_member_ids = [m.id for m in ordered]
      matched_member_count = len(matched_member_ids)
      cost_cents = alert.unit_cost_cents * matched_member_count
      # (d) empty-set fallback: no error - the alert is still persisted
      status = DISPATCHED if matched_member_count >= 1 else NO_MATCH
      # campaign accumulators
      campaign.alert_count += 1
      campaign.matched_member_total += matched_member_count
      campaign.cumulative_cost_cents += cost_cents
      if status == NO_MATCH: campaign.unmatched_alert_count += 1
      else: campaign.last_alert_at = alert.dispatched_at   # NO_MATCH does NOT move the cooling window
      threshold = JURISDICTION_RULES[campaign.target_jurisdiction_code].grassroots_disclosure_threshold_cents
      if campaign.cumulative_cost_cents >= threshold: campaign.disclosure_required = true   # latching, never reverts
    input_set: "Members satisfying the four-predicate filter above; every other member is excluded even when their district matches."
    constants:
      ALERT_COOLING_HOURS: 48
    precision: "integer counts and cents; ordering is total thanks to the created_at tie-break"
    variants: []

  - name: fund_balance_and_posture
    trigger: "every SegregatedFund mutation: POST /advocacy/segregated-funds/{id}/receipts, POST /advocacy/segregated-funds/{id}/filing-cycle, POST /advocacy/pac-contributions/{id}/board-approve, .../disburse, .../void"
    algorithm: constraint_propagation
    formula: |
      # available_balance_cents and posture look mutually dependent, because the filing-cycle
      # surcharge depends on posture while posture depends on the fee that surcharge produces.
      # The evaluation order is PINNED and is the same for every trigger:
      #   STEP 1  balance from the pre-mutation fee accrual
      #   STEP 2  fee for a filing cycle, using the posture observed BEFORE this cycle
      #   STEP 3  apply the fee, then recompute the balance
      #   STEP 4  recompute posture from the post-fee balance and propagate the suspension cascade
      #   STEP 5  expire prior approvals (filing cycle only)
      # STEP 1
      available_balance_cents = receipts_total_cents - committed_balance_cents
                                - disbursed_total_cents - filing_fee_accrued_cents
      # STEP 2 (filing-cycle trigger only)
      posture_before = fund.posture                     # NEVER the value recomputed in STEP 4
      fee_cents = FILING_FEE_BASE_CENTS
                + (RESTRICTED_SURCHARGE_CENTS if posture_before == RESTRICTED else 0)
                + (LATE_PENALTY_CENTS if filed_on_date > due_date_of(period_code) else 0)
      # STEP 3
      filing_fee_accrued_cents += fee_cents
      filings_completed_count += 1
      last_filed_period_code = period_code
      available_balance_cents = receipts_total_cents - committed_balance_cents
                                - disbursed_total_cents - filing_fee_accrued_cents
      # STEP 4
      posture = RESTRICTED if available_balance_cents < min_reserve_cents else OPEN
      # a flip to RESTRICTED suspends every PENDING_BOARD contribution of this fund;
      # a flip to OPEN reinstates every SUSPENDED one. The surcharge is never recharged here.
      # STEP 5
      # PriorApproval rows with status IN {REQUESTED, GRANTED} and expires_at_date < clock date -> EXPIRED
    input_set: "The fund's own four accumulator fields; contribution rows enter only through committed_balance_cents and disbursed_total_cents."
    constants:
      FILING_FEE_BASE_CENTS: 15000
      RESTRICTED_SURCHARGE_CENTS: 5000
      LATE_PENALTY_CENTS: 25000
    precision: "integer cents; no rounding is required anywhere in this calculation"
    variants: []

  - name: registration_reportable_accumulator
    trigger: "POST /advocacy/lobbying-activities and POST /advocacy/lobbying-activities/{id}/void"
    algorithm: aggregation
    formula: |
      # The invariant this accumulator must satisfy at all times:
      registration.ytd_reportable_cents == sum(a.expenditure_cents
                                               for a in LobbyingActivity
                                               if a.registration_id == registration.id
                                               AND a.status == LOGGED)
      registration.ytd_reportable_hours == round_half_up(
                                               sum(a.hours for a in LobbyingActivity
                                                   if a.registration_id == registration.id
                                                   AND a.status == LOGGED), 3)
      # Threshold trigger evaluated immediately after the increment on a create:
      threshold = JURISDICTION_RULES[registration.jurisdiction_code].registration_threshold_cents
      if registration.amendment_round == 0 AND registration.ytd_reportable_cents >= threshold:
          registration.status = AMENDMENT_PENDING          # >= : exact equality flips it
    input_set: "LOGGED activities of that registration only; VOIDED activities are excluded, which is what makes the void a true compensation."
    constants: {}
    precision: "integer cents; hours to 3 decimals, round_half_up"
    variants: []

  - name: jurisdiction_rule_table
    trigger: "read-only lookup used by registrations, reports, campaigns, candidates and funds"
    algorithm: threshold
    formula: |
      JURISDICTION_RULES[code] selects every jurisdiction-dependent number in the system:
        registration_threshold_cents            -> auto-amendment trigger on a registration
        report_cadence                          -> legal period_code shapes and FILING_LAG_DAYS
        per_candidate_election_limit_cents      -> contribution_allowance ceiling
        grassroots_disclosure_threshold_cents   -> GrassrootsCampaign.disclosure_required latch
        deductibility_method                    -> dues_deductibility_notice variant
    input_set: "The single row keyed by the caller's jurisdiction_code."
    constants:
      JURISDICTION_RULES:
        FEDERAL:
          registration_threshold_cents: 1400000
          report_cadence: QUARTERLY
          per_candidate_election_limit_cents: 500000
          grassroots_disclosure_threshold_cents: 250000
          deductibility_method: RATIO
        STATE_CA:
          registration_threshold_cents: 200000
          report_cadence: QUARTERLY
          per_candidate_election_limit_cents: 250000
          grassroots_disclosure_threshold_cents: 100000
          deductibility_method: FLAT_FLOOR
        STATE_NY:
          registration_threshold_cents: 500000
          report_cadence: SEMIANNUAL
          per_candidate_election_limit_cents: 100000
          grassroots_disclosure_threshold_cents: 400000
          deductibility_method: RATIO
      COALITION_DISCLOSURE_FLOOR_CENTS: 500000
    precision: "exact integers; no arithmetic"
    variants: []

  - name: fund_conservation_identity
    trigger: "asserted after every SegregatedFund-touching mutation and after every compensating void"
    algorithm: aggregation
    formula: |
      receipts_total_cents == available_balance_cents + committed_balance_cents
                              + disbursed_total_cents + filing_fee_accrued_cents
      # and, per candidate:
      candidate.pending_support_cents   == sum(amount_cents where status == PENDING_BOARD)
      candidate.committed_support_cents == sum(amount_cents where status == BOARD_APPROVED)
      candidate.disbursed_support_cents == sum(amount_cents where status == DISBURSED)
      # SUSPENDED and VOIDED rows appear in none of the three candidate accumulators.
    input_set: "All PacContribution rows of the fund, partitioned by status."
    constants: {}
    precision: "exact integer cents; a compensating void must restore every term, not merely the total"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty after trimming"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "every path-templated resource exists, validated left-to-right (committee before seat, position before vote, campaign before alert)"
    error_id: ERR_MEMBER_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_POSITION_NOT_FOUND | ERR_VOTE_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_ACTIVITY_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_PRIOR_APPROVAL_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_FUND_NOT_FOUND | ERR_CONTRIBUTION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: auth
    check: "when the role is MemberDelegate, X-User-ID equals the Member in scope: the {id} of a member sub-resource, PriorApproval.member_id, or PositionVote.member_id"
    error_id: ERR_MEMBER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /advocacy/members/{id}, GET /advocacy/members/{id}/deductibility-notice, GET /advocacy/members/{id}/committee-seats, GET /advocacy/members/{id}/position-votes, GET /advocacy/members/{id}/prior-approvals, POST /advocacy/prior-approvals/{id}/grant, POST /advocacy/prior-approvals/{id}/revoke, POST /advocacy/policy-positions/{id}/votes/{vote_id}/withdraw-dissent"
  - priority: 6
    category: business_constraint
    check: "request body shape: every required field present, types correct, enum members legal, numeric ranges respected (amount_cents >= 1, hours >= 0 with at most three decimals, percentages 0.00..100.00, ISO dates YYYY-MM-DD)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 7
    category: existence
    check: "every foreign key supplied in the body resolves to an existing row (committee_id, member_id, position_id, registration_id, fund_id, candidate_id)"
    error_id: ERR_COMMITTEE_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_POSITION_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_FUND_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /advocacy/committees/{id}/seats, POST /advocacy/policy-positions, POST /advocacy/lobbying-activities, POST /advocacy/expenditure-reports, POST /advocacy/grassroots-campaigns, POST /advocacy/prior-approvals, POST /advocacy/segregated-funds/{id}/receipts, POST /advocacy/pac-contributions"
  - priority: 8
    category: state
    check: "the target resource is in a state from which this transition is declared (position ballot/tally/adopt edges, registration file/amend/certify/terminate edges, report certify, campaign close, prior-approval grant/revoke, contribution board-approve/disburse/void, activity void)"
    error_id: ERR_INVALID_POSITION_STATE | ERR_INVALID_REGISTRATION_STATE | ERR_INVALID_REPORT_STATE | ERR_INVALID_CAMPAIGN_STATE | ERR_INVALID_PRIOR_APPROVAL_STATE | ERR_CONTRIBUTION_NOT_PENDING | ERR_CONTRIBUTION_NOT_APPROVED | ERR_CONTRIBUTION_SUSPENDED | ERR_ACTIVITY_ALREADY_VOIDED | ERR_DISSENT_NOT_FILED
    http_status: 409
    applies_to: "every action endpoint that drives a declared state transition, EXCLUDING POST /advocacy/lobbying-activities (whose registration-state gate is the regulatory check at priority 11) and EXCLUDING POST /advocacy/policy-positions/{id}/open-ballot on a FAILED_CONSENSUS position (whose exhausted-rounds gate is ERR_MAX_BALLOT_ROUNDS at priority 25)"
  - priority: 9
    category: business_constraint
    check: "committee roster gate: open-ballot needs roster_state != FORMING; adopt needs roster_state == QUORATE"
    error_id: ERR_COMMITTEE_FORMING | ERR_COMMITTEE_NOT_QUORATE
    http_status: 409
    applies_to: "POST /advocacy/policy-positions/{id}/open-ballot, POST /advocacy/policy-positions/{id}/adopt"
  - priority: 10
    category: business_safety
    check: "segregation of duties: the certifier of an ExpenditureReport differs from its creator, and the BoardTrustee approving a PacContribution differs from its proposer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /advocacy/expenditure-reports/{id}/certify, POST /advocacy/pac-contributions/{id}/board-approve"
  - priority: 11
    category: business_safety
    check: "regulatory registration gate: activity may only be logged under a registration whose status is ACTIVE (DRAFT means unregistered lobbying, AMENDMENT_PENDING means the filing is stale, TERMINATED means coverage ended)"
    error_id: ERR_REGISTRATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /advocacy/lobbying-activities"
  - priority: 12
    category: business_safety
    check: "PAC solicitation eligibility: the member named on a receipt has a PriorApproval with status GRANTED whose [effective_date, expires_at_date] window contains the logical clock date"
    error_id: ERR_PRIOR_APPROVAL_NOT_GRANTED
    http_status: 409
    applies_to: "POST /advocacy/segregated-funds/{id}/receipts"
  - priority: 13
    category: business_safety
    check: "fund posture gate: board approval requires SegregatedFund.posture == OPEN"
    error_id: ERR_FUND_RESTRICTED
    http_status: 409
    applies_to: "POST /advocacy/pac-contributions/{id}/board-approve"
  - priority: 14
    category: business_referential
    check: "the referenced PolicyPosition has status ADOPTED"
    error_id: ERR_POSITION_NOT_ADOPTED
    http_status: 409
    applies_to: "POST /advocacy/lobbying-activities, POST /advocacy/grassroots-campaigns"
  - priority: 15
    category: business_referential
    check: "the casting MemberDelegate holds a CommitteeSeat with status IN {ACTIVE, DAMPENED} on the position's committee, and Member.status == ACTIVE"
    error_id: ERR_MEMBER_NOT_SEATED | ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /advocacy/policy-positions/{id}/votes, POST /advocacy/prior-approvals/{id}/grant"
  - priority: 16
    category: business_referential
    check: "coalition/third-party disclosure completeness: coalition_partner_name is present when activity_kind IN {COALITION_CONTRIBUTION, THIRD_PARTY_ADVOCACY}"
    error_id: ERR_COALITION_PARTNER_REQUIRED
    http_status: 422
    applies_to: "POST /advocacy/lobbying-activities"
  - priority: 17
    category: business_referential
    check: "jurisdiction coherence: position.jurisdiction_code is inside committee.jurisdiction_scope (MULTI accepts any); campaign.target_jurisdiction_code equals the position's jurisdiction_code; receipts and contributions belong to the fund's fund_year"
    error_id: ERR_JURISDICTION_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /advocacy/policy-positions, POST /advocacy/grassroots-campaigns, POST /advocacy/segregated-funds/{id}/receipts"
  - priority: 18
    category: business_temporal
    check: "PriorApproval window: closed-closed overlap against the member's existing approvals with status IN {REQUESTED, GRANTED} - two windows that merely touch at one endpoint DO collide"
    error_id: ERR_PRIOR_APPROVAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /advocacy/prior-approvals"
  - priority: 19
    category: business_temporal
    check: "PriorApproval window shape: effective_date <= expires_at_date, both inside calendar_year, span <= 365 days"
    error_id: ERR_PRIOR_APPROVAL_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /advocacy/prior-approvals"
  - priority: 20
    category: business_temporal
    check: "LobbyingRegistration coverage: half-open [coverage_start_date, coverage_end_date) overlap against registrations with the same (jurisdiction_code, registrant_name) and status IN {ACTIVE, AMENDMENT_PENDING} - windows that merely touch (previous end == next start) do NOT collide"
    error_id: ERR_REGISTRATION_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /advocacy/lobbying-registrations/{id}/file"
  - priority: 21
    category: business_temporal
    check: "alert cooling window: the new alert's dispatched_at is at least ALERT_COOLING_HOURS after campaign.last_alert_at (exactly 48h apart is allowed); NO_MATCH alerts never set last_alert_at and therefore never start a cooling window"
    error_id: ERR_ALERT_COOLING_PERIOD
    http_status: 409
    applies_to: "POST /advocacy/grassroots-campaigns/{id}/alerts"
  - priority: 22
    category: business_temporal
    check: "activity_date lies inside [registration.coverage_start_date, registration.coverage_end_date], both endpoints inclusive"
    error_id: ERR_ACTIVITY_OUTSIDE_COVERAGE
    http_status: 422
    applies_to: "POST /advocacy/lobbying-activities"
  - priority: 23
    category: business_temporal
    check: "period_code shape matches JURISDICTION_RULES[jurisdiction_code].report_cadence (QUARTERLY -> <YYYY>Q<1-4>, SEMIANNUAL -> <YYYY>H<1-2>), and a report may only be certified once the logical clock date has reached period_end_date"
    error_id: ERR_PERIOD_CADENCE_MISMATCH | ERR_PERIOD_NOT_CLOSED
    http_status: "422 for ERR_PERIOD_CADENCE_MISMATCH, 409 for ERR_PERIOD_NOT_CLOSED"
    applies_to: "POST /advocacy/expenditure-reports, POST /advocacy/expenditure-reports/{id}/certify, POST /advocacy/segregated-funds/{id}/filing-cycle"
  - priority: 24
    category: business_constraint
    check: "committee roster uniqueness: one seat per (committee_id, member_id); at most one seat with seat_role CHAIR per committee"
    error_id: ERR_DUPLICATE_SEAT | ERR_CHAIR_SEAT_TAKEN
    http_status: 409
    applies_to: "POST /advocacy/committees/{id}/seats"
  - priority: 25
    category: business_constraint
    check: "ballot bookkeeping: an open-ballot on a position whose round_number already equals MAX_BALLOT_ROUNDS (i.e. a FAILED_CONSENSUS position) is refused with ERR_MAX_BALLOT_ROUNDS; a tally needs at least one CAST vote in the current round; a dissent_statement requires ballot OPPOSE"
    error_id: ERR_MAX_BALLOT_ROUNDS | ERR_NO_BALLOTS_CAST | ERR_DISSENT_REQUIRES_OPPOSE
    http_status: 409
    applies_to: "POST /advocacy/policy-positions/{id}/open-ballot, POST /advocacy/policy-positions/{id}/tally, POST /advocacy/policy-positions/{id}/votes"
  - priority: 26
    category: business_constraint
    check: "zero-quantity guards: an activity with hours == 0 AND expenditure_cents == 0 is refused; a report with included_activity_count == 0 may not be certified; a registration with an OPEN report may not be terminated; an activity inside a CERTIFIED report may not be voided"
    error_id: ERR_EMPTY_ACTIVITY | ERR_EMPTY_REPORT | ERR_OPEN_REPORT_BLOCKS_TERMINATION | ERR_ACTIVITY_IN_CERTIFIED_REPORT
    http_status: 422
    applies_to: "POST /advocacy/lobbying-activities, POST /advocacy/expenditure-reports/{id}/certify, POST /advocacy/lobbying-registrations/{id}/terminate, POST /advocacy/lobbying-activities/{id}/void"
  - priority: 27
    category: business_constraint
    check: "solicitable_class_size <= Member.restricted_class_size"
    error_id: ERR_CLASS_SIZE_EXCEEDED
    http_status: 422
    applies_to: "POST /advocacy/prior-approvals"
  - priority: 28
    category: business_constraint
    check: "candidate scoring floor: support_score >= SCORE_TIER_QUARTER (55.00)"
    error_id: ERR_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /advocacy/pac-contributions"
  - priority: 29
    category: business_fiscal
    check: "amount_cents <= max_allowed_cents, i.e. within both the score tier share and the remaining per-candidate per-cycle jurisdiction limit (equality accepted)"
    error_id: ERR_CONTRIBUTION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /advocacy/pac-contributions, POST /advocacy/pac-contributions/{id}/disburse"
  - priority: 30
    category: business_fiscal
    check: "amount_cents <= SegregatedFund.available_balance_cents at board approval (equality accepted)"
    error_id: ERR_INSUFFICIENT_FUND_BALANCE
    http_status: 422
    applies_to: "POST /advocacy/pac-contributions/{id}/board-approve"
  - priority: 31
    category: state
    check: "optimistic concurrency: expected_registration_version equals LobbyingRegistration.version at the moment of the write"
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412
    applies_to: "POST /advocacy/expenditure-reports"

endpoints:
  - method: POST
    path: /advocacy/members
    description: "Enroll an association member. notice_method is derived from JURISDICTION_RULES[home_jurisdiction_code].deductibility_method and is not accepted from the client."
    input: [legal_name, membership_tier, home_jurisdiction_code, home_district_code, annual_dues_cents, dues_year, restricted_class_size, "status?", "advocacy_optout?", "engagement_score?"]
    output: Member
    roles: [AssociationAdmin]
    code: 201
    side_effects:
      - "sets notice_method from JURISDICTION_RULES[home_jurisdiction_code].deductibility_method"
      - "initialises pac_solicitable to false and recorded_dissent_count to 0"
  - method: GET
    path: /advocacy/members/{id}
    description: "Read one member. A MemberDelegate may only read its own record."
    input: []
    output: Member
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: GET
    path: /advocacy/members/{id}/deductibility-notice
    description: "Computed read: the member's dues-deductibility notice for its dues_year per calculation dues_deductibility_notice. Returns an inline object, not a stored entity."
    input: []
    output: "{ member_id, dues_year, notice_method, ratio_pct, nondeductible_pct, nondeductible_amount_cents, deductible_amount_cents, lobbying_spend_cents }"
    roles: [AssociationAdmin, ComplianceOfficer, MemberDelegate]
    code: 200
  - method: GET
    path: /advocacy/members/{id}/committee-seats
    description: "List the member's committee seats, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: CommitteeSeat[]
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: GET
    path: /advocacy/members/{id}/position-votes
    description: "List the member's ballots across all positions, ordered by created_at ASC."
    input: ["limit?", "offset?", "position_id?", "ballot_status?"]
    output: PositionVote[]
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: GET
    path: /advocacy/members/{id}/prior-approvals
    description: "List the member's PAC prior-approval records, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: PriorApproval[]
    roles: [AssociationAdmin, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: POST
    path: /advocacy/committees
    description: "Create a policy committee. roster_state starts FORMING until the seat thresholds are met."
    input: [name, jurisdiction_scope, quorum_threshold_pct, consensus_threshold_pct]
    output: PolicyCommittee
    roles: [GovAffairsDirector]
    code: 201
  - method: GET
    path: /advocacy/committees/{id}
    description: "Read one committee including seat_count, total_voting_weight and roster_state."
    input: []
    output: PolicyCommittee
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: POST
    path: /advocacy/committees/{id}/seats
    description: "Seat a member on the committee. voting_weight is copied from TIER_WEIGHT[member.membership_tier] at seating time and does not follow later tier changes."
    input: [member_id, "seat_role?"]
    output: CommitteeSeat
    roles: [GovAffairsDirector]
    code: 201
    side_effects:
      - "sets voting_weight from TIER_WEIGHT[member.membership_tier] and dissent_strikes to 0"
      - "recomputes PolicyCommittee.seat_count, total_voting_weight and roster_state"
  - method: GET
    path: /advocacy/committees/{id}/seats
    description: "List the committee roster, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: CommitteeSeat[]
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: GET
    path: /advocacy/committees/{id}/policy-positions
    description: "List the positions owned by this committee, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: PolicyPosition[]
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: POST
    path: /advocacy/policy-positions
    description: "Draft a policy position under a committee. Starts in DRAFT with round_number 0."
    input: [committee_id, title, jurisdiction_code, summary]
    output: PolicyPosition
    roles: [GovAffairsDirector]
    code: 201
  - method: GET
    path: /advocacy/policy-positions/{id}
    description: "Read one position including the latest tally snapshot and dissent bookkeeping."
    input: []
    output: PolicyPosition
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: POST
    path: /advocacy/policy-positions/{id}/open-ballot
    description: "Open the next consensus ballot round (DRAFT or RECONSIDERATION -> BALLOTING). Increments round_number and supersedes the previous round's ballots."
    input: ["ballot_deadline_date?"]
    output: PolicyPosition
    roles: [GovAffairsDirector]
    code: 200
    side_effects:
      - "increments PolicyPosition.round_number by 1"
      - "sets every PositionVote of an earlier round with ballot_status CAST to ballot_status SUPERSEDED, leaving dissent_status untouched"
      - "resets the tally snapshot fields support_weight, oppose_weight, abstain_weight, quorum_pct, consensus_pct to 0 and last_tally_outcome to NONE"
  - method: POST
    path: /advocacy/policy-positions/{id}/votes
    description: "Cast a ballot in the position's current round. The caller is the voting member; a dissent_statement is only accepted with ballot OPPOSE and files a formal dissent."
    input: [ballot, "dissent_statement?"]
    output: PositionVote
    roles: [MemberDelegate]
    code: 201
    side_effects:
      - "sets weight_snapshot from the caller's CommitteeSeat.voting_weight and round_number from PolicyPosition.round_number"
      - "sets ballot_status CAST, and dissent_status FILED when a non-empty dissent_statement is supplied, else dissent_status NONE"
      - "flips an existing CAST ballot of the same member in the same round to ballot_status SUPERSEDED"
  - method: GET
    path: /advocacy/policy-positions/{id}/votes
    description: "List the ballots cast on this position, ordered by created_at ASC."
    input: ["limit?", "offset?", "round_number?", "ballot_status?"]
    output: PositionVote[]
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: POST
    path: /advocacy/policy-positions/{id}/votes/{vote_id}/withdraw-dissent
    description: "The dissenting member withdraws its formal dissent (FILED -> WITHDRAWN) without changing the ballot itself."
    input: []
    output: PositionVote
    roles: [MemberDelegate]
    code: 200
    side_effects:
      - "sets PositionVote.dissent_status to WITHDRAWN and leaves ballot_status untouched, so a still-CAST OPPOSE ballot keeps counting in the tally"
  - method: POST
    path: /advocacy/policy-positions/{id}/tally
    description: "Close the current round and evaluate consensus per calculation position_ballot_tally: BALLOTING -> CONSENSUS_REACHED, RECONSIDERATION or FAILED_CONSENSUS."
    input: []
    output: PolicyPosition
    roles: [GovAffairsDirector]
    code: 200
    side_effects:
      - "writes support_weight, oppose_weight, abstain_weight, quorum_pct and consensus_pct onto the position from the current round's CAST ballots"
      - "sets PolicyPosition.last_tally_outcome to CONSENSUS, NO_QUORUM or DISSENSUS (the quorum test is evaluated before the consensus test)"
      - "moves the position to CONSENSUS_REACHED, RECONSIDERATION or FAILED_CONSENSUS; ballots keep their ballot_status and dissent_status unchanged"
  - method: POST
    path: /advocacy/policy-positions/{id}/adopt
    description: "The board ratifies a position that reached consensus (CONSENSUS_REACHED -> ADOPTED), unlocking lobbying activity and grassroots campaigns. The approving trustee is taken from X-User-ID; the body is empty."
    input: []
    output: PolicyPosition
    roles: [BoardTrustee]
    code: 200
    side_effects:
      - "sets PolicyPosition.adopted_at to the logical clock instant"
      - "CASCADE LINK 1: moves every current-round CAST OPPOSE ballot with dissent_status FILED to dissent_status RECORDED and writes PolicyPosition.dissent_register_count"
      - "CASCADE LINK 2: increments Member.recorded_dissent_count by 1 for each distinct member whose ballot reached RECORDED"
      - "CASCADE LINK 3: increments that member's CommitteeSeat.dissent_strikes by 1 and, at DISSENT_DAMPING_STRIKES, flips the seat to DAMPENED with voting_weight max(1, floor(TIER_WEIGHT/2))"
      - "CASCADE LINK 4: recomputes PolicyCommittee.total_voting_weight and roster_state, which may drop QUORATE to IMPAIRED"
  - method: GET
    path: /advocacy/policy-positions/{id}/lobbying-activities
    description: "List the lobbying activities logged in support of this position, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: LobbyingActivity[]
    roles: [GovAffairsDirector, ComplianceOfficer, BoardTrustee]
    code: 200
  - method: GET
    path: /advocacy/policy-positions/{id}/grassroots-campaigns
    description: "List the grassroots campaigns advancing this position, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: GrassrootsCampaign[]
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: POST
    path: /advocacy/lobbying-registrations
    description: "Draft a lobbying registration for one jurisdiction. Starts in DRAFT with amendment_round 0; no overlap check runs until it is filed."
    input: [jurisdiction_code, registrant_name, coverage_start_date, coverage_end_date]
    output: LobbyingRegistration
    roles: [ComplianceOfficer]
    code: 201
  - method: GET
    path: /advocacy/lobbying-registrations/{id}
    description: "Read one registration including version, amendment_round and the year-to-date reportable accumulators."
    input: []
    output: LobbyingRegistration
    roles: [ComplianceOfficer, GovAffairsDirector, BoardTrustee]
    code: 200
  - method: POST
    path: /advocacy/lobbying-registrations/{id}/file
    description: "File the registration with the jurisdiction (DRAFT -> ACTIVE). Rejects a coverage window that overlaps a live registration for the same (jurisdiction_code, registrant_name) under half-open semantics."
    input: []
    output: LobbyingRegistration
    roles: [ComplianceOfficer]
    code: 200
    side_effects:
      - "sets status ACTIVE and filed_at to the logical clock instant"
      - "increments LobbyingRegistration.version by 1"
  - method: POST
    path: /advocacy/lobbying-registrations/{id}/amend
    description: "Open a manual amendment (ACTIVE -> AMENDMENT_PENDING). Activity logging is refused while the amendment is pending."
    input: []
    output: LobbyingRegistration
    roles: [ComplianceOfficer]
    code: 200
    side_effects:
      - "sets status AMENDMENT_PENDING"
      - "increments LobbyingRegistration.version by 1"
  - method: POST
    path: /advocacy/lobbying-registrations/{id}/certify-amendment
    description: "Certify the pending amendment (AMENDMENT_PENDING -> ACTIVE). Raising amendment_round permanently disarms the automatic threshold amendment."
    input: []
    output: LobbyingRegistration
    roles: [ComplianceOfficer]
    code: 200
    side_effects:
      - "sets status ACTIVE and increments amendment_round by 1"
      - "increments LobbyingRegistration.version by 1"
  - method: POST
    path: /advocacy/lobbying-registrations/{id}/terminate
    description: "Terminate coverage (ACTIVE -> TERMINATED). Refused while any ExpenditureReport of this registration is still OPEN."
    input: []
    output: LobbyingRegistration
    roles: [ComplianceOfficer]
    code: 200
    side_effects:
      - "sets status TERMINATED and terminated_at to the logical clock instant"
      - "increments LobbyingRegistration.version by 1"
  - method: GET
    path: /advocacy/lobbying-registrations/{id}/activities
    description: "List the activities logged under this registration, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: LobbyingActivity[]
    roles: [ComplianceOfficer, GovAffairsDirector, BoardTrustee]
    code: 200
  - method: GET
    path: /advocacy/lobbying-registrations/{id}/expenditure-reports
    description: "List the expenditure reports of this registration, ordered by created_at ASC. This is the only read path for a report."
    input: ["limit?", "offset?", "status?", "period_code?"]
    output: ExpenditureReport[]
    roles: [ComplianceOfficer, GovAffairsDirector, BoardTrustee]
    code: 200
  - method: POST
    path: /advocacy/lobbying-activities
    description: "Log one lobbying contact or spend under an ACTIVE registration in support of an ADOPTED position. staff_cost_cents is rounded per activity."
    input: [registration_id, position_id, activity_kind, activity_date, hours, expenditure_cents, "coalition_partner_name?"]
    output: LobbyingActivity
    roles: [GovAffairsDirector]
    code: 201
    side_effects:
      - "sets staff_cost_cents to round_half_up(hours * STAFF_HOURLY_RATE_CENTS) and third_party_disclosure_required per activity_kind and COALITION_DISCLOSURE_FLOOR_CENTS"
      - "adds expenditure_cents to LobbyingRegistration.ytd_reportable_cents and hours to ytd_reportable_hours"
      - "increments LobbyingRegistration.version by 1"
      - "flips the registration ACTIVE -> AMENDMENT_PENDING in this same request when amendment_round == 0 and the new ytd_reportable_cents reaches JURISDICTION_RULES[jurisdiction_code].registration_threshold_cents"
      - "recomputes method_a_total_cents, method_b_total_cents, filed_total_cents and included_activity_count on every OPEN report of this registration whose period window contains activity_date"
  - method: POST
    path: /advocacy/lobbying-activities/{id}/void
    description: "Void a logged activity (LOGGED -> VOIDED) and compensate every accumulator it fed. Refused when a CERTIFIED report already included it."
    input: [void_reason]
    output: LobbyingActivity
    roles: [GovAffairsDirector]
    code: 200
    side_effects:
      - "sets status VOIDED and records void_reason"
      - "subtracts expenditure_cents from LobbyingRegistration.ytd_reportable_cents and hours from ytd_reportable_hours"
      - "increments LobbyingRegistration.version by 1"
      - "recomputes the totals and included_activity_count of every OPEN report that included the activity; CERTIFIED and SUPERSEDED reports stay frozen"
  - method: POST
    path: /advocacy/expenditure-reports
    description: "Open an expenditure report for one registration and period. expected_registration_version must match LobbyingRegistration.version, which every activity log and registration transition raises. Creating a second report for the same (registration_id, period_code) supersedes the OPEN one."
    input: [registration_id, period_code, basis, expected_registration_version]
    output: ExpenditureReport
    roles: [ComplianceOfficer]
    code: 201
    side_effects:
      - "derives period_start_date, period_end_date and due_date from period_code and FILING_LAG_DAYS[cadence]"
      - "computes method_a_total_cents, method_b_total_cents, filed_total_cents and included_activity_count from the LOGGED activities inside the period window"
      - "records created_by_user_id from X-User-ID"
      - "sets any prior OPEN report for the same (registration_id, period_code) to SUPERSEDED and freezes its totals"
      - "increments LobbyingRegistration.version by 1"
  - method: POST
    path: /advocacy/expenditure-reports/{id}/certify
    description: "Certify and file the report (OPEN -> CERTIFIED). The certifier must differ from the creator and the period must be closed."
    input: []
    output: ExpenditureReport
    roles: [ComplianceOfficer]
    code: 200
    side_effects:
      - "sets status CERTIFIED, certified_by_user_id from X-User-ID and certified_at to the logical clock instant"
      - "sets late true when the UTC date part of certified_at is strictly after due_date"
      - "brings filed_total_cents into the input set of every member's dues-deductibility notice for the report's period year"
  - method: POST
    path: /advocacy/grassroots-campaigns
    description: "Launch a grassroots campaign for an ADOPTED position. target_jurisdiction_code must equal the position's jurisdiction_code."
    input: [position_id, name, target_jurisdiction_code]
    output: GrassrootsCampaign
    roles: [GovAffairsDirector]
    code: 201
  - method: GET
    path: /advocacy/grassroots-campaigns/{id}
    description: "Read one campaign including alert_count, matched_member_total, cumulative_cost_cents, disclosure_required and last_alert_at."
    input: []
    output: GrassrootsCampaign
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: POST
    path: /advocacy/grassroots-campaigns/{id}/alerts
    description: "Dispatch a member action alert for one district and chamber. The constituent match set is computed per calculations.constituent_match_set; an empty match set is persisted as a NO_MATCH alert rather than an error."
    input: [target_district_code, target_chamber, message_subject, unit_cost_cents]
    output: ActionAlert
    roles: [GovAffairsDirector]
    code: 201
    side_effects:
      - "computes matched_member_ids in engagement_score DESC, created_at ASC order, matched_member_count, cost_cents and status"
      - "adds to GrassrootsCampaign.alert_count, matched_member_total and cumulative_cost_cents, and to unmatched_alert_count when the alert is NO_MATCH"
      - "sets campaign.last_alert_at to dispatched_at only for a DISPATCHED alert, and flips PLANNED -> LIVE on the first DISPATCHED alert"
      - "latches GrassrootsCampaign.disclosure_required once cumulative_cost_cents reaches the jurisdiction's grassroots_disclosure_threshold_cents"
  - method: GET
    path: /advocacy/grassroots-campaigns/{id}/alerts
    description: "List the campaign's action alerts, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: ActionAlert[]
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee, MemberDelegate]
    code: 200
  - method: POST
    path: /advocacy/grassroots-campaigns/{id}/close
    description: "Close the campaign (PLANNED or LIVE -> CLOSED), freezing cumulative_cost_cents and disclosure_required."
    input: []
    output: GrassrootsCampaign
    roles: [GovAffairsDirector]
    code: 200
    side_effects:
      - "sets status CLOSED; no further alerts may be dispatched"
  - method: POST
    path: /advocacy/prior-approvals
    description: "Request a member's PAC prior approval for one calendar year. The window is closed-closed and may not touch or overlap another REQUESTED or GRANTED window of the same member."
    input: [member_id, calendar_year, solicitable_class_size, effective_date, expires_at_date]
    output: PriorApproval
    roles: [ComplianceOfficer]
    code: 201
  - method: POST
    path: /advocacy/prior-approvals/{id}/grant
    description: "The member itself grants the prior approval (REQUESTED -> GRANTED). Only the member named on the approval may call it."
    input: [authorized_by_name]
    output: PriorApproval
    roles: [MemberDelegate]
    code: 200
    side_effects:
      - "sets status GRANTED, granted_at to the logical clock instant, granted_by_user_id from X-User-ID and records authorized_by_name"
      - "recomputes Member.pac_solicitable, which becomes true once the clock date lies inside the window"
  - method: POST
    path: /advocacy/prior-approvals/{id}/revoke
    description: "The member withdraws its prior approval (GRANTED -> REVOKED), closing PAC solicitation eligibility."
    input: []
    output: PriorApproval
    roles: [MemberDelegate]
    code: 200
    side_effects:
      - "sets status REVOKED and revoked_at to the logical clock instant"
      - "recomputes Member.pac_solicitable to false unless another GRANTED approval still covers the clock date"
  - method: POST
    path: /advocacy/candidates
    description: "Register a candidate for contribution scoring. district_code is the join key against grassroots action alerts."
    input: [name, office, jurisdiction_code, district_code, election_cycle, incumbency, voting_alignment_pct, committee_relevance_score]
    output: Candidate
    roles: [GovAffairsDirector]
    code: 201
  - method: GET
    path: /advocacy/candidates/{id}
    description: "Read one candidate including latest_support_score and the three support accumulators."
    input: []
    output: Candidate
    roles: [GovAffairsDirector, ComplianceOfficer, BoardTrustee]
    code: 200
  - method: GET
    path: /advocacy/candidates/{id}/pac-contributions
    description: "List the contributions decided for this candidate, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: PacContribution[]
    roles: [GovAffairsDirector, ComplianceOfficer, BoardTrustee]
    code: 200
  - method: POST
    path: /advocacy/segregated-funds
    description: "Open the separate segregated fund for one accounting year and jurisdiction. Posture starts OPEN with every accumulator at 0."
    input: [name, fund_year, jurisdiction_code, min_reserve_cents]
    output: SegregatedFund
    roles: [ComplianceOfficer]
    code: 201
  - method: GET
    path: /advocacy/segregated-funds/{id}
    description: "Read the fund's four accumulators, available_balance_cents and posture."
    input: []
    output: SegregatedFund
    roles: [ComplianceOfficer, GovAffairsDirector, BoardTrustee]
    code: 200
  - method: GET
    path: /advocacy/segregated-funds/{id}/pac-contributions
    description: "List the contributions drawn on this fund, ordered by created_at ASC."
    input: ["limit?", "offset?", "status?"]
    output: PacContribution[]
    roles: [ComplianceOfficer, GovAffairsDirector, BoardTrustee]
    code: 200
  - method: POST
    path: /advocacy/segregated-funds/{id}/receipts
    description: "Credit a solicited receipt from a member whose PAC prior approval is GRANTED and covers the logical clock date. received_date must fall in the fund's fund_year."
    input: [member_id, amount_cents, received_date]
    output: SegregatedFund
    roles: [ComplianceOfficer]
    code: 200
    side_effects:
      - "adds amount_cents to receipts_total_cents and recomputes available_balance_cents"
      - "flips posture RESTRICTED -> OPEN when the new available_balance_cents reaches min_reserve_cents, reinstating every SUSPENDED contribution to PENDING_BOARD and restoring each affected Candidate.pending_support_cents"
  - method: POST
    path: /advocacy/segregated-funds/{id}/filing-cycle
    description: "Run the regulatory filing calendar for one period. The fee uses the posture observed BEFORE this cycle; the recomputed posture never re-charges the surcharge."
    input: [period_code, filed_on_date]
    output: SegregatedFund
    roles: [ComplianceOfficer]
    code: 200
    side_effects:
      - "charges FILING_FEE_BASE_CENTS plus RESTRICTED_SURCHARGE_CENTS when the pre-cycle posture was RESTRICTED plus LATE_PENALTY_CENTS when filed_on_date is after the period due date"
      - "adds the fee to filing_fee_accrued_cents, increments filings_completed_count and sets last_filed_period_code"
      - "recomputes available_balance_cents and posture, suspending every PENDING_BOARD contribution on a flip to RESTRICTED"
      - "expires every PriorApproval with status REQUESTED or GRANTED whose expires_at_date is before the logical clock date"
  - method: POST
    path: /advocacy/pac-contributions
    description: "Propose a candidate contribution. support_score and max_allowed_cents are frozen onto the row at creation and the amount must not exceed max_allowed_cents."
    input: [fund_id, candidate_id, amount_cents, "memo?"]
    output: PacContribution
    roles: [GovAffairsDirector]
    code: 201
    side_effects:
      - "computes support_score per calculations.candidate_support_score and max_allowed_cents per calculations.contribution_allowance"
      - "records proposed_by_user_id from X-User-ID and status PENDING_BOARD"
      - "adds amount_cents to Candidate.pending_support_cents and writes Candidate.latest_support_score"
  - method: GET
    path: /advocacy/pac-contributions/{id}
    description: "Read one contribution including its frozen support_score and max_allowed_cents."
    input: []
    output: PacContribution
    roles: [GovAffairsDirector, ComplianceOfficer, BoardTrustee]
    code: 200
  - method: POST
    path: /advocacy/pac-contributions/{id}/board-approve
    description: "Board approval of a pending contribution (PENDING_BOARD -> BOARD_APPROVED). The approving trustee must differ from the proposer, the fund posture must be OPEN and the amount must fit the available balance."
    input: []
    output: PacContribution
    roles: [BoardTrustee]
    code: 200
    side_effects:
      - "sets status BOARD_APPROVED and board_approved_by_user_id from X-User-ID"
      - "moves amount_cents from Candidate.pending_support_cents to Candidate.committed_support_cents"
      - "adds amount_cents to SegregatedFund.committed_balance_cents and recomputes available_balance_cents"
      - "flips the fund OPEN -> RESTRICTED when the recomputed available_balance_cents falls below min_reserve_cents"
      - "suspends every other PENDING_BOARD contribution of that fund and decrements each affected Candidate.pending_support_cents when the posture flipped"
  - method: POST
    path: /advocacy/pac-contributions/{id}/disburse
    description: "Cut the check (BOARD_APPROVED -> DISBURSED). The per-candidate jurisdiction limit is re-checked at disbursement."
    input: []
    output: PacContribution
    roles: [ComplianceOfficer]
    code: 200
    side_effects:
      - "sets status DISBURSED and disbursed_at to the logical clock instant"
      - "moves amount_cents from SegregatedFund.committed_balance_cents to disbursed_total_cents, leaving available_balance_cents unchanged"
      - "moves amount_cents from Candidate.committed_support_cents to Candidate.disbursed_support_cents"
  - method: POST
    path: /advocacy/pac-contributions/{id}/void
    description: "Compensating void from PENDING_BOARD, SUSPENDED, BOARD_APPROVED or DISBURSED. Every accumulator the row fed is restored term by term."
    input: [void_reason]
    output: PacContribution
    roles: [ComplianceOfficer]
    code: 200
    side_effects:
      - "sets status VOIDED, voided_at to the logical clock instant and records void_reason"
      - "reverses exactly the accumulators the row currently feeds: pending, committed or disbursed on the candidate, and committed_balance_cents or disbursed_total_cents on the fund"
      - "recomputes available_balance_cents and re-evaluates posture, reinstating SUSPENDED siblings on a flip back to OPEN"
      - "frees the headroom in calculations.contribution_allowance, because VOIDED rows leave the already_cents input set"
  - method: POST
    path: /_clock/set_current_utc
    description: "Test-only logical clock. Sets the instant every later request treats as now. The default logical clock, before any call to this endpoint, is 2026-08-01T00:00:00Z. Not part of the business API and outside /advocacy."
    input: [to_iso8601]
    output: "{ current_utc }"
    roles: [AssociationAdmin, GovAffairsDirector, ComplianceOfficer, BoardTrustee]
    code: 200

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role is missing, blank after trimming, or names a role outside the five declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The authenticated role is not listed in the endpoint's roles list."
  - id: ERR_MEMBER_SCOPE_VIOLATION
    http: 403
    condition: "A MemberDelegate targets a Member other than the one its X-User-ID identifies: another member's record, another member's prior approval, or another member's dissent."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The certifying ComplianceOfficer equals ExpenditureReport.created_by_user_id, or the approving BoardTrustee equals PacContribution.proposed_by_user_id."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, a value has the wrong type, an enum value is unknown, a percentage falls outside 0.00..100.00, hours is negative or has more than three decimals, an amount is below 1 cent, or a date is not an ISO YYYY-MM-DD calendar date."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "No Member exists with the referenced id, in the path or in a body field (member_id)."
  - id: ERR_COMMITTEE_NOT_FOUND
    http: 404
    condition: "No PolicyCommittee exists with the referenced id."
  - id: ERR_POSITION_NOT_FOUND
    http: 404
    condition: "No PolicyPosition exists with the referenced id."
  - id: ERR_VOTE_NOT_FOUND
    http: 404
    condition: "No PositionVote with the given vote_id exists on the addressed position."
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "No LobbyingRegistration exists with the referenced id."
  - id: ERR_ACTIVITY_NOT_FOUND
    http: 404
    condition: "No LobbyingActivity exists with the referenced id."
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "No ExpenditureReport exists with the referenced id."
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "No GrassrootsCampaign exists with the referenced id."
  - id: ERR_PRIOR_APPROVAL_NOT_FOUND
    http: 404
    condition: "No PriorApproval exists with the referenced id."
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "No Candidate exists with the referenced id."
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "No SegregatedFund exists with the referenced id."
  - id: ERR_CONTRIBUTION_NOT_FOUND
    http: 404
    condition: "No PacContribution exists with the referenced id."
  - id: ERR_INVALID_POSITION_STATE
    http: 409
    condition: "The position is not in a state that allows the requested transition: open-ballot outside {DRAFT, RECONSIDERATION}, tally outside BALLOTING, adopt outside CONSENSUS_REACHED, a ballot cast while the position is not BALLOTING, or a dissent withdrawal after the position left {BALLOTING, RECONSIDERATION}."
  - id: ERR_INVALID_REGISTRATION_STATE
    http: 409
    condition: "The registration is not in a state that allows the requested transition: file outside DRAFT, amend outside ACTIVE, certify-amendment outside AMENDMENT_PENDING, or terminate outside ACTIVE."
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "Certification was requested on a report whose status is CERTIFIED or SUPERSEDED."
  - id: ERR_INVALID_CAMPAIGN_STATE
    http: 409
    condition: "An alert was dispatched on a CLOSED campaign, or close was requested on an already CLOSED campaign."
  - id: ERR_INVALID_PRIOR_APPROVAL_STATE
    http: 409
    condition: "Grant was requested on an approval outside REQUESTED, or revoke on an approval outside GRANTED (including one already EXPIRED by a filing cycle)."
  - id: ERR_DISSENT_NOT_FILED
    http: 409
    condition: "Dissent withdrawal was requested on a vote whose dissent_status is NONE, WITHDRAWN or RECORDED."
  - id: ERR_ACTIVITY_ALREADY_VOIDED
    http: 409
    condition: "Void was requested on a LobbyingActivity whose status is already VOIDED."
  - id: ERR_CONTRIBUTION_NOT_PENDING
    http: 409
    condition: "Board approval was requested on a contribution whose status is BOARD_APPROVED, DISBURSED or VOIDED."
  - id: ERR_CONTRIBUTION_NOT_APPROVED
    http: 409
    condition: "Disbursement was requested on a contribution whose status is not BOARD_APPROVED."
  - id: ERR_CONTRIBUTION_SUSPENDED
    http: 409
    condition: "Board approval was requested on a contribution that the fund's RESTRICTED posture moved to SUSPENDED."
  - id: ERR_COMMITTEE_FORMING
    http: 409
    condition: "A ballot round was opened on a position whose committee roster_state is still FORMING (fewer than MIN_SEATS seats)."
  - id: ERR_COMMITTEE_NOT_QUORATE
    http: 409
    condition: "Adoption was requested while the committee roster_state is IMPAIRED or FORMING, including the case where dissent damping dropped total_voting_weight below MIN_ROSTER_WEIGHT."
  - id: ERR_REGISTRATION_NOT_ACTIVE
    http: 409
    condition: "An activity was logged under a registration whose status is DRAFT, AMENDMENT_PENDING or TERMINATED."
  - id: ERR_PRIOR_APPROVAL_NOT_GRANTED
    http: 409
    condition: "A fund receipt names a member with no PriorApproval in status GRANTED whose window contains the logical clock date, including a member whose approval was revoked."
  - id: ERR_PRIOR_APPROVAL_EXPIRED
    http: 409
    condition: "A grant was attempted after the logical clock date passed the approval's expires_at_date."
  - id: ERR_FUND_RESTRICTED
    http: 409
    condition: "Board approval was requested while SegregatedFund.posture is RESTRICTED."
  - id: ERR_POSITION_NOT_ADOPTED
    http: 409
    condition: "A lobbying activity or grassroots campaign references a position whose status is not ADOPTED."
  - id: ERR_MEMBER_NOT_SEATED
    http: 409
    condition: "The casting MemberDelegate holds no CommitteeSeat with status ACTIVE or DAMPENED on the position's committee."
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "The acting or referenced Member has status other than ACTIVE (LAPSED or SUSPENDED)."
  - id: ERR_COALITION_PARTNER_REQUIRED
    http: 422
    condition: "activity_kind is COALITION_CONTRIBUTION or THIRD_PARTY_ADVOCACY but coalition_partner_name is missing or blank, so the third-party disclosure would be incomplete."
  - id: ERR_JURISDICTION_SCOPE_MISMATCH
    http: 422
    condition: "A position's jurisdiction_code falls outside its committee's jurisdiction_scope, a campaign's target_jurisdiction_code differs from its position's jurisdiction_code, or a receipt's received_date year differs from the fund's fund_year."
  - id: ERR_PRIOR_APPROVAL_WINDOW_CONFLICT
    http: 409
    condition: "The requested [effective_date, expires_at_date] window collides under closed-closed semantics with an existing REQUESTED or GRANTED window of the same member; touching at a single shared endpoint counts as a collision."
  - id: ERR_PRIOR_APPROVAL_WINDOW_INVALID
    http: 422
    condition: "effective_date is after expires_at_date, either endpoint falls outside calendar_year, or the span exceeds 365 days."
  - id: ERR_REGISTRATION_COVERAGE_OVERLAP
    http: 409
    condition: "Filing would create two live registrations for the same (jurisdiction_code, registrant_name) whose [coverage_start_date, coverage_end_date) windows overlap under half-open semantics; abutting windows (previous end equals next start) are allowed."
  - id: ERR_ALERT_COOLING_PERIOD
    http: 409
    condition: "The alert would be dispatched less than ALERT_COOLING_HOURS after the campaign's last DISPATCHED alert; a gap of exactly 48 hours is allowed."
  - id: ERR_ACTIVITY_OUTSIDE_COVERAGE
    http: 422
    condition: "activity_date falls outside the registration's inclusive coverage window."
  - id: ERR_PERIOD_CADENCE_MISMATCH
    http: 422
    condition: "period_code does not match the jurisdiction's report_cadence shape (QUARTERLY expects <YYYY>Q<1-4>, SEMIANNUAL expects <YYYY>H<1-2>) or names an out-of-range period index."
  - id: ERR_PERIOD_NOT_CLOSED
    http: 409
    condition: "Certification was requested before the logical clock date reached the report's period_end_date."
  - id: ERR_DUPLICATE_SEAT
    http: 409
    condition: "The member already holds a seat on this committee."
  - id: ERR_CHAIR_SEAT_TAKEN
    http: 409
    condition: "A second seat with seat_role CHAIR was requested on a committee that already has one."
  - id: ERR_MAX_BALLOT_ROUNDS
    http: 409
    condition: "An open-ballot was requested on a position whose round_number already equals MAX_BALLOT_ROUNDS, i.e. a position sitting in the terminal FAILED_CONSENSUS state after three failed rounds."
  - id: ERR_NO_BALLOTS_CAST
    http: 409
    condition: "A tally was requested on a round in which no vote has ballot_status CAST."
  - id: ERR_DISSENT_REQUIRES_OPPOSE
    http: 409
    condition: "A dissent_statement was supplied together with ballot SUPPORT or ABSTAIN."
  - id: ERR_EMPTY_ACTIVITY
    http: 422
    condition: "An activity was logged with hours == 0 and expenditure_cents == 0, which would add nothing to any accumulator."
  - id: ERR_EMPTY_REPORT
    http: 422
    condition: "Certification was requested on a report whose included_activity_count is 0."
  - id: ERR_OPEN_REPORT_BLOCKS_TERMINATION
    http: 422
    condition: "Termination was requested while at least one ExpenditureReport of the registration is still OPEN."
  - id: ERR_ACTIVITY_IN_CERTIFIED_REPORT
    http: 422
    condition: "Void was requested on an activity already included in a CERTIFIED report, whose totals are frozen."
  - id: ERR_CLASS_SIZE_EXCEEDED
    http: 422
    condition: "solicitable_class_size exceeds Member.restricted_class_size."
  - id: ERR_SCORE_BELOW_FLOOR
    http: 422
    condition: "The computed support_score is below SCORE_TIER_QUARTER (55.00), so no contribution tier applies."
  - id: ERR_CONTRIBUTION_LIMIT_EXCEEDED
    http: 422
    condition: "amount_cents exceeds max_allowed_cents - either the score tier share or the remaining per-candidate per-cycle jurisdiction limit; equality is accepted."
  - id: ERR_INSUFFICIENT_FUND_BALANCE
    http: 422
    condition: "amount_cents exceeds SegregatedFund.available_balance_cents at board approval; equality is accepted."
  - id: ERR_STALE_REGISTRATION_VERSION
    http: 412
    condition: "expected_registration_version does not equal LobbyingRegistration.version, which every activity log and every registration transition increments."

roles:
  - name: AssociationAdmin
    description: "Membership operations: enrolls member companies and maintains the roster data the advocacy machinery reads."
    identity: opaque
    exclusive_operations:
      - "POST /advocacy/members"
    shared_operations:
      - "GET /advocacy/members/{id}"
      - "GET /advocacy/members/{id}/deductibility-notice"
      - "GET /advocacy/members/{id}/committee-seats"
      - "GET /advocacy/members/{id}/position-votes"
      - "GET /advocacy/members/{id}/prior-approvals"
      - "GET /advocacy/committees/{id} and its seat and position sub-resource lists"
      - "GET /advocacy/policy-positions/{id}, its vote list and its campaign list"
      - "GET /advocacy/grassroots-campaigns/{id} and its alert list"
      - "POST /_clock/set_current_utc"
  - name: GovAffairsDirector
    description: "Runs the government-affairs program: committees and their rosters, policy positions and ballots, lobbying activity logging, grassroots campaigns and candidate contribution proposals."
    identity: opaque
    exclusive_operations:
      - "POST /advocacy/committees"
      - "POST /advocacy/committees/{id}/seats"
      - "POST /advocacy/policy-positions"
      - "POST /advocacy/policy-positions/{id}/open-ballot"
      - "POST /advocacy/policy-positions/{id}/tally"
      - "POST /advocacy/lobbying-activities"
      - "POST /advocacy/lobbying-activities/{id}/void"
      - "POST /advocacy/grassroots-campaigns"
      - "POST /advocacy/grassroots-campaigns/{id}/alerts"
      - "POST /advocacy/grassroots-campaigns/{id}/close"
      - "POST /advocacy/candidates"
      - "POST /advocacy/pac-contributions"
    shared_operations:
      - "every GET on members, committees, positions, votes, registrations, activities, reports, campaigns, alerts, candidates, funds and contributions"
      - "POST /_clock/set_current_utc"
  - name: ComplianceOfficer
    description: "Owns the regulatory surface: lobbying registrations and amendments, expenditure reports and certification, PAC prior approvals, the separate segregated fund, its filing calendar and disbursements."
    identity: opaque
    exclusive_operations:
      - "POST /advocacy/lobbying-registrations"
      - "POST /advocacy/lobbying-registrations/{id}/file"
      - "POST /advocacy/lobbying-registrations/{id}/amend"
      - "POST /advocacy/lobbying-registrations/{id}/certify-amendment"
      - "POST /advocacy/lobbying-registrations/{id}/terminate"
      - "POST /advocacy/expenditure-reports"
      - "POST /advocacy/expenditure-reports/{id}/certify"
      - "POST /advocacy/prior-approvals"
      - "POST /advocacy/segregated-funds"
      - "POST /advocacy/segregated-funds/{id}/receipts"
      - "POST /advocacy/segregated-funds/{id}/filing-cycle"
      - "POST /advocacy/pac-contributions/{id}/disburse"
      - "POST /advocacy/pac-contributions/{id}/void"
    shared_operations:
      - "every GET on members, committees, positions, votes, prior approvals, registrations, activities, reports, campaigns, alerts, candidates, funds and contributions"
      - "POST /_clock/set_current_utc"
  - name: BoardTrustee
    description: "Board-level ratification: adopts committee positions and approves candidate contributions. Holds no proposal power, which is what makes segregation of duties observable."
    identity: opaque
    exclusive_operations:
      - "POST /advocacy/policy-positions/{id}/adopt"
      - "POST /advocacy/pac-contributions/{id}/board-approve"
    shared_operations:
      - "every GET on members, committees, positions, votes, prior approvals, registrations, activities, reports, campaigns, alerts, candidates, funds and contributions"
      - "POST /_clock/set_current_utc"
  - name: MemberDelegate
    description: "A member company acting for itself: casts committee ballots, files and withdraws formal dissent, and grants or revokes its own PAC prior approval. X-User-ID is the Member id."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /advocacy/policy-positions/{id}/votes"
      - "POST /advocacy/policy-positions/{id}/votes/{vote_id}/withdraw-dissent"
      - "POST /advocacy/prior-approvals/{id}/grant"
      - "POST /advocacy/prior-approvals/{id}/revoke"
    shared_operations:
      - "GET on its own member record, deductibility notice, committee seats, position votes and prior approvals"
      - "GET /advocacy/committees/{id} and its seat and position lists"
      - "GET /advocacy/policy-positions/{id}, its vote list and its campaign list"
      - "GET /advocacy/grassroots-campaigns/{id} and its alert list"
