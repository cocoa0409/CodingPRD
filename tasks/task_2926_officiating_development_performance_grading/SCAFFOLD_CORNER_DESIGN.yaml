# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2926_officiating_development_performance_grading
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Depth corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear here as `excluded_because:` stubs with
# no test_recipe. Repeated setup chains are shared via YAML anchors (&k_*) and
# aliases (*k_*); anchors are local to this file.
#
# Fixture conventions (identical to §1.8): the logical clock starts at
# 2026-08-01T00:00:00Z; game G1 is MIA vs BUF with kickoff 2026-09-13T17:00:00Z;
# grading happens at 2026-09-13T21:30:00Z; graders act as user "sup-grader-1"
# and appeal reviewers as "sup-review-2" so segregation of duties holds.

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: season_program_creation_returns_declared_defaults
        claim_type: defaults
        grounds:
          - entities.SeasonProgram.fields.status
          - entities.SeasonProgram.fields.accuracy_eligibility_threshold
          - entities.SeasonProgram.fields.reviewable_categories
          - entities.SeasonProgram.fields.crew_size_required
          - entities.SeasonProgram.fields.eligible_official_count
        distinguishing_aspect: "Creating a SeasonProgram with only season_year supplied returns every optional configuration field at its declared default and status CONFIGURING."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OfficiatingDirector
          trigger:
            - call: "POST /season-programs"
              payload: { season_year: 2026 }
              as: OfficiatingDirector
              captures:
                sp_d_id: $.data.id
                sp_d_status: $.data.status
                sp_d_thr: $.data.accuracy_eligibility_threshold
                sp_d_minplays: $.data.min_graded_plays_for_eligibility
                sp_d_credits: $.data.appeal_credits_per_official
                sp_d_window: $.data.appeal_window_hours
                sp_d_replay: $.data.replay_decision_limit_seconds
                sp_d_cats: $.data.reviewable_categories
                sp_d_exposures: $.data.max_team_exposures_per_season
                sp_d_rest: $.data.min_rest_hours_between_games
                sp_d_travel: $.data.travel_lead_hours
                sp_d_crew: $.data.crew_size_required
                sp_d_returns: $.data.max_application_returns
                sp_d_phys: $.data.physical_test_min_score
                sp_d_exam: $.data.exam_min_score
                sp_d_clinic: $.data.clinic_attendance_required
                sp_d_eligible: $.data.eligible_official_count
                sp_d_created: $.data.created_at
          assert:
            - "HTTP status is 201 and ${sp_d_status} == CONFIGURING"
            - "${sp_d_thr} == 95.00, ${sp_d_minplays} == 3, ${sp_d_credits} == 3, ${sp_d_window} == 72, ${sp_d_replay} == 120"
            - "${sp_d_cats} == [SCORING_PLAY, TURNOVER, PLAYER_SAFETY] — GAME_ADMIN is a declared enum member but not a default"
            - "${sp_d_exposures} == 2, ${sp_d_rest} == 96, ${sp_d_travel} == 24, ${sp_d_crew} == 2, ${sp_d_returns} == 2"
            - "${sp_d_phys} == 70.00, ${sp_d_exam} == 80.00, ${sp_d_clinic} == 1, ${sp_d_eligible} == 0"
            - "${sp_d_created} == 2026-08-01T00:00:00Z (ISO 8601 UTC, three fractional digits) and ${sp_d_id} is a server-minted id"
            - "the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: official_creation_applies_tier_default_and_seeds_appeal_credits
        claim_type: creation
        grounds:
          - entities.Official.fields.tier
          - entities.Official.fields.status
          - entities.Official.fields.appeal_credits_remaining
          - entities.Official.fields.open_assignment_count
          - entities.Official.fields.preseason_cleared
        distinguishing_aspect: "POST /officials with only the required fields returns tier TIER_3, status CANDIDATE, preseason_cleared false, appeal_credits_remaining seeded to the program's 3, and the same row is returned by GET /officials/{id}."
        test_recipe:
          setup:
            - "SeasonProgram 2026 exists and is OPEN with appeal_credits_per_official 3."
          setup_api_calls:
            - *k_clock
            - &k_prog
              call: "POST /season-programs"
              payload: { season_year: 2026 }
              as: OfficiatingDirector
              captures: { sp_id: $.data.id }
            - &k_open
              call: "POST /season-programs/${sp_id}/open"
              payload: {}
              as: OfficiatingDirector
          trigger:
            - call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Dan Ruiz", position: "UMPIRE", seasons_experience: 6, home_market_code: "MIA" }
              as: OfficiatingDirector
              captures:
                o_new_id: $.data.id
                o_new_tier: $.data.tier
                o_new_status: $.data.status
                o_new_cleared: $.data.preseason_cleared
                o_new_credits: $.data.appeal_credits_remaining
                o_new_oac: $.data.open_assignment_count
                o_new_affil: $.data.affiliated_team_code
                o_new_created: $.data.created_at
                o_new_version: $.data.version
            - call: "GET /officials/${o_new_id}"
              payload: {}
              as: CrewScheduler
              captures: { o_read_tier: $.data.tier, o_read_status: $.data.status, o_read_name: $.data.full_name }
          assert:
            - "HTTP status is 201, ${o_new_tier} == TIER_3 (declared default) and ${o_new_status} == CANDIDATE (initial state)"
            - "${o_new_cleared} == false, ${o_new_credits} == 3 (seeded from SeasonProgram.appeal_credits_per_official), ${o_new_oac} == 0"
            - "${o_new_affil} == null — the optional conflict-of-interest code defaults to null, not to home_market_code"
            - "${o_new_created} == 2026-08-01T00:00:00Z and ${o_new_version} is present (Official declares common_fields)"
            - "the read-back agrees with the create response: ${o_read_tier} == ${o_new_tier}, ${o_read_status} == ${o_new_status}, ${o_read_name} == Dan Ruiz"

      - name: officials_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Official.fields.season_program_id
          - endpoints[GET /officials]
        distinguishing_aspect: "GET /officials?season_program_id=…&limit=2 returns two rows with total_count 3 and has_more true, and the offset-2 page returns the remaining row with has_more false and no row repeated."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN and carries exactly three officials: Dan Ruiz, Rita Vance and Kim Ortega."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - &k_off_dan
              call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Dan Ruiz", position: "UMPIRE", seasons_experience: 6, home_market_code: "MIA", tier: "TIER_2" }
              as: OfficiatingDirector
              captures: { dan_id: $.data.id, dan_v0: $.data.version }
            - &k_off_rita
              call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Rita Vance", position: "REFEREE", seasons_experience: 14, home_market_code: "BUF", tier: "TIER_2" }
              as: OfficiatingDirector
              captures: { rita_id: $.data.id, rita_v0: $.data.version }
            - &k_off_kim
              call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Kim Ortega", position: "DOWN_JUDGE", seasons_experience: 9, home_market_code: "DEN", affiliated_team_code: "MIA" }
              as: OfficiatingDirector
              captures: { kim_id: $.data.id }
          trigger:
            - call: "GET /officials"
              payload: { season_program_id: "${sp_id}", limit: 2, offset: 0 }
              as: OfficiatingDirector
              captures: { p1_a: "$.data[0].id", p1_b: "$.data[1].id" }
            - call: "GET /officials"
              payload: { season_program_id: "${sp_id}", limit: 2, offset: 2 }
              as: OfficiatingDirector
              captures: { p2_a: "$.data[0].id" }
          assert:
            - "page one returns response_type == array with exactly 2 elements, meta/pagination total_count == 3 and has_more == true"
            - "page two returns exactly 1 element with total_count == 3 and has_more == false"
            - "{${p1_a}, ${p1_b}, ${p2_a}} == {${dan_id}, ${rita_id}, ${kim_id}} — every official appears exactly once across the two pages"
            - "${p2_a} != ${p1_a} and ${p2_a} != ${p1_b} — offset paging does not repeat a row"

      - name: game_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_GAME_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /games/{id} for an id no row holds returns HTTP 404 with error_id ERR_GAME_NOT_FOUND in the error envelope, not an empty 200."
        test_recipe:
          setup:
            - "SeasonProgram 2026 exists; no Game has ever been created."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
          trigger:
            - call: "GET /games/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: OfficiatingDirector
              captures: { err_g404: $.data.error_id, msg_g404: $.data.message }
          assert:
            - "HTTP status is 404 and ${err_g404} == ERR_GAME_NOT_FOUND"
            - "response_type == error and ${msg_g404} is a non-empty human-readable string"
            - "no Game row is created as a side effect of the failed read"

      - name: game_creation_missing_kickoff_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Game.fields.kickoff_utc
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "POST /games without kickoff_utc — a required input field with no default — returns HTTP 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
          trigger:
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "MIA", away_team_code: "BUF", venue_market_code: "MIA" }
              as: OfficiatingDirector
              captures: { err_missing_kick: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err_missing_kick} == ERR_INVALID_REQUEST"
            - "GET /games?season_program_id=${sp_id} returns total_count == 0"

      - name: game_creation_with_identical_team_codes_rejected
        claim_type: type_constraints
        grounds:
          - entities.Game.fields.home_team_code
          - entities.Game.fields.away_team_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /games with home_team_code == away_team_code violates the declared field constraint and returns HTTP 400 ERR_INVALID_REQUEST — a cross-field shape rule, not a 404 or a 409."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
          trigger:
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "MIA", away_team_code: "MIA", venue_market_code: "MIA", kickoff_utc: "2026-09-13T17:00:00Z" }
              as: OfficiatingDirector
              captures: { err_same_team: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err_same_team} == ERR_INVALID_REQUEST"
            - "GET /games?season_program_id=${sp_id} returns total_count == 0"

      - name: undeclared_enum_values_are_rejected_before_business_rules
        claim_type: type_constraints
        grounds:
          - entities.Official.fields.position
          - entities.ReplayReview.fields.category
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A value outside a field's declared enum returns 400 ERR_INVALID_REQUEST at shape priority 3, which is a different failure from a declared-but-unlisted category (GAME_ADMIN) returning 422 ERR_CATEGORY_NOT_REVIEWABLE at priority 18."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN and one ONLINE replay station exists."
            - "Game G1 is SCHEDULED (no crew), so no review could be opened on it anyway."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - &k_game
              call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "MIA", away_team_code: "BUF", venue_market_code: "MIA", kickoff_utc: "2026-09-13T17:00:00Z" }
              as: OfficiatingDirector
              captures: { g_id: $.data.id, g_v0: $.data.version }
            - &k_station
              call: "POST /replay-stations"
              payload: { station_code: "BOOTH-1", concurrent_capacity: 2 }
              as: OfficiatingDirector
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Val Reyes", position: "LINE_JUDGE", seasons_experience: 4, home_market_code: "DEN" }
              as: OfficiatingDirector
              captures: { err_enum_pos: $.data.error_id }
            - call: "POST /replay-reviews"
              payload: { game_id: "${g_id}", station_id: "${st_id}", play_ref: "Q1-P01", category: "PENALTY_ENFORCEMENT" }
              as: ReplayOfficial
              captures: { err_enum_cat: $.data.error_id }
          assert:
            - "both calls return HTTP 400 with ${err_enum_pos} == ERR_INVALID_REQUEST and ${err_enum_cat} == ERR_INVALID_REQUEST"
            - "LINE_JUDGE is not a member of {REFEREE, UMPIRE, DOWN_JUDGE} and PENALTY_ENFORCEMENT is not a member of {SCORING_PLAY, TURNOVER, PLAYER_SAFETY, GAME_ADMIN}"
            - "GET /officials?season_program_id=${sp_id} returns total_count == 0 and GET /replay-reviews?game_id=${g_id} returns total_count == 0"

      - name: play_grade_error_points_is_computed_at_creation
        claim_type: computed_fields
        grounds:
          - calculations.play_error_points
          - entities.PlayGrade.fields.error_points
          - entities.PlayGrade.fields.graded_by_user_id
          - entities.PlayGrade.fields.posted_at
          - entities.OfficialSeasonRecord.fields.weighted_error_points
        distinguishing_aspect: "POST /play-grades stores error_points 2.63 while the grade is still DRAFT, stamps graded_by_user_id from X-User-ID, leaves posted_at null, and does NOT move the official's season record because DRAFT is outside the accuracy included set."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Dan Ruiz (UMPIRE, POSITION_FACTOR 1.00) is ACTIVE, preseason-cleared, and held a CONFIRMED assignment on game G1, which is now PLAYED."
            - "The clock stands at 2026-09-13T21:30:00Z and no grade exists yet."
          setup_api_calls:
            - *k_clock
            - &k_prog1
              call: "POST /season-programs"
              payload: { season_year: 2026, crew_size_required: 1 }
              as: OfficiatingDirector
              captures: { sp_id: $.data.id }
            - *k_open
            - *k_off_dan
            - &k_dan_exam
              call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "RULES_EXAM", session_code: "EX-D1", score: 84.00 }
              as: TrainingCoordinator
              captures: { tr_exam_id: $.data.id, tr_exam_passed: $.data.passed }
            - &k_dan_phys
              call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-D1", score: 79.00 }
              as: TrainingCoordinator
              captures: { tr_phys_id: $.data.id, tr_phys_passed: $.data.passed }
            - *k_game
            - &k_assign_dan
              call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { ad_id: $.data.id }
            - &k_confirm_dan
              call: "POST /crew-assignments/${ad_id}/confirm"
              payload: {}
              as: CrewScheduler
            - &k_clock_kick
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T17:00:00Z" }
              as: OfficiatingDirector
            - &k_kick
              call: "POST /games/${g_id}/kickoff"
              payload: {}
              as: OfficiatingDirector
            - &k_clock_grade
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T21:30:00Z" }
              as: OfficiatingDirector
            - &k_played
              call: "POST /games/${g_id}/mark-played"
              payload: {}
              as: OfficiatingDirector
          trigger:
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", play_ref: "Q4-P11", call_category: "PASS_INTERFERENCE", grade_code: "MISSED_CALL", impact: "HIGH" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_c_id: $.data.id, pg_c_points: $.data.error_points, pg_c_status: $.data.grade_status, pg_c_appeal: $.data.appeal_state, pg_c_posted: $.data.posted_at, pg_c_author: $.data.graded_by_user_id }
            - call: "GET /season-records"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures: { rec_wep_draft: "$.data[0].weighted_error_points", rec_n_draft: "$.data[0].graded_play_count", rec_idx_draft: "$.data[0].accuracy_index" }
          assert:
            - "${pg_c_points} == 2.63 — round_half_up(1.50 * 1.75 * 1.00) computed at creation, not at posting"
            - "${pg_c_status} == DRAFT, ${pg_c_appeal} == NOT_APPEALED and ${pg_c_posted} == null"
            - "${pg_c_author} == sup-grader-1 — taken from X-User-ID, never from the request body"
            - "${rec_wep_draft} == 0.00, ${rec_n_draft} == 0 and ${rec_idx_draft} == 100.00 — a DRAFT grade is outside the PROVISIONAL included set"

      - name: training_record_is_immutable_with_server_generated_fields
        claim_type: immutability
        grounds:
          - entities.TrainingRecord.fields.passed
          - entities.TrainingRecord.fields.score
          - calculations.preseason_clearance
          - entities.Official.fields.preseason_cleared
        distinguishing_aspect: "TrainingRecord declares common_fields false, so its rows carry id and created_at but no version/updated_at and §1.5 exposes no update or delete endpoint; `passed` is computed from score against the program minimum and can never be supplied."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with physical_test_min_score 70.00 and exam_min_score 80.00."
            - "Dan Ruiz exists as a CANDIDATE with no training records."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
          trigger:
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "RULES_CLINIC", session_code: "CL-SPRING" }
              as: TrainingCoordinator
              captures: { tr_clinic_id: $.data.id, tr_clinic_passed: $.data.passed, tr_clinic_score: $.data.score, tr_clinic_created: $.data.created_at }
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-FAIL", score: 65.00 }
              as: TrainingCoordinator
              captures: { tr_fail_id: $.data.id, tr_fail_passed: $.data.passed }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: TrainingCoordinator
              captures: { dan_cleared_after: $.data.preseason_cleared, dan_status_after: $.data.status }
          assert:
            - "${tr_clinic_passed} == true and ${tr_clinic_score} == null — a RULES_CLINIC record ignores score entirely"
            - "${tr_fail_passed} == false because 65.00 < 70.00"
            - "both responses carry ${tr_clinic_id} / ${tr_fail_id} and ${tr_clinic_created} == 2026-08-01T00:00:00Z but expose no version and no updated_at field"
            - "§1.5 declares no PATCH/PUT/DELETE for training records, so the two rows are append-only evidence"
            - "${dan_cleared_after} == false and ${dan_status_after} == CANDIDATE — neither a clinic nor a failed physical clears or promotes the official"

      - name: crew_assignment_with_unknown_official_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.CrewAssignment.fields.official_id
          - errors[ERR_OFFICIAL_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "In this flat topology the FK official_id on POST /crew-assignments is validated for existence at priority 4, so an unknown official yields 404 ERR_OFFICIAL_NOT_FOUND before any occupancy or clearance rule runs and leaves Game.version untouched."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN and game G1 is SCHEDULED with no assignments."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_game
          trigger:
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", position: "UMPIRE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { err_fk_official: $.data.error_id }
            - call: "GET /games/${g_id}"
              payload: {}
              as: CrewScheduler
              captures: { g_ver_after_fk: $.data.version, g_ccc_after_fk: $.data.confirmed_crew_count }
          assert:
            - "HTTP status is 404 and ${err_fk_official} == ERR_OFFICIAL_NOT_FOUND — not ERR_PRESEASON_NOT_CLEARED and not ERR_STALE_GAME_VERSION"
            - "${g_ver_after_fk} == ${g_v0} and ${g_ccc_after_fk} == 0 — a rejected create bumps nothing"
            - "GET /crew-assignments?game_id=${g_id} returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: official_activates_on_passed_rules_exam_but_stays_uncleared
        claim_type: valid_transition
        grounds:
          - state_machines.Official.CANDIDATE_to_ACTIVE
          - calculations.preseason_clearance
          - entities.Official.fields.status
          - entities.Official.fields.preseason_cleared
        distinguishing_aspect: "A newly created Official sits in the declared initial state CANDIDATE and is auto-transitioned to ACTIVE by the first passed RULES_EXAM, while preseason_cleared stays false until a passed PHYSICAL_TEST also exists."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with exam_min_score 80.00 and physical_test_min_score 70.00."
            - "Dan Ruiz was just created and holds no training records."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: TrainingCoordinator
              captures: { dan_status_initial: $.data.status, dan_cleared_initial: $.data.preseason_cleared }
          trigger:
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "RULES_EXAM", session_code: "EX-D1", score: 84.00 }
              as: TrainingCoordinator
              captures: { exam_passed: $.data.passed }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: TrainingCoordinator
              captures: { dan_status_mid: $.data.status, dan_cleared_mid: $.data.preseason_cleared }
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-D1", score: 79.00 }
              as: TrainingCoordinator
              captures: { phys_passed: $.data.passed }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: TrainingCoordinator
              captures: { dan_status_end: $.data.status, dan_cleared_end: $.data.preseason_cleared }
          assert:
            - "${dan_status_initial} == CANDIDATE and ${dan_cleared_initial} == false — the declared initial state"
            - "${exam_passed} == true because 84.00 >= 80.00, and ${dan_status_mid} == ACTIVE"
            - "${dan_cleared_mid} == false — roster membership and field readiness are separate gates"
