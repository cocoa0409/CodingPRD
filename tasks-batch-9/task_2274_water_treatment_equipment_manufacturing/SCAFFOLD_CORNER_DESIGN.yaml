  - section: endpoints
    instances:
      - name: patch_reprices_the_package_and_leaves_omitted_fields_alone
        claim_type: standard_crud
        grounds:
          - entities.EquipmentPackage.fields.budgetary_cost_cents
          - calculations.equipment_package_cost
          - validations[priority=40]
        distinguishing_aspect: |
          PATCH is a partial write with a recompute: raising design_pressure_psig to 300 - exactly
          MAT-316L's max_pressure_psig, so the inclusive pressure screen still passes - and retagging
          to F-101 leaves material_spec_id and design_temp_c at their stored values while
          budgetary_cost_cents is re-derived as round_half_up(240000000 * 1.0 * 1.09 * 1.04) ==
          272064000; firm_cost_cents stays 0 because FIRM is only stamped at review, and version goes
