          setup_api_calls:
            - { call: "POST /rescue-ops/volunteers", payload: { name: "V", contact_email: "v@x.com", skills: [FEEDING] }, as: Volunteer, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/barn-shifts", payload: { shift_date: "2026-08-05T00:00:00Z", start_time: "06:00", end_time: "08:00", barn_zone: MAIN_BARN, required_skill: FEEDING }, as: Volunteer, as_user_id: "${v}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http status 403"

      - name: sponsor_cannot_activate_others_sponsorship
