# =============================================================================
# Auto Dealership Management System (DMS) — Scaffold Seed Tables
# Difficulty tier: EXPERT (§0.4)
# =============================================================================

scenario: |
  341. Auto Dealership Management (DMS): inventory (new/used/VIN), sales desking
  & F&I (rate/product), trade-in valuation/payoff, test-drive & deal jacket,
  service/parts RO link, floor-plan financing, OEM incentive/rebate, DMV title &
  registration submission

domain_name: auto-dealership-dms
api_prefix: ""   # flat topology: each entity is a top-level collection (/vehicles, /deals, /customers, ...); no single shared prefix

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (Vehicle, Customer, Deal, FloorPlanLine,
  # TradeIn, FinanceContract, DealProduct, TestDrive, RepairOrder, TitleRegistration)
  # plus three configuration entities (LenderProgram, FinanceProduct, OEMIncentive).
  # No nested URL ownership tree; everything is reached by /<collection>/{id} and
  # cross-referenced by FK. (flat is PRIORITIZED for diversity per §0.3.)

  state_machine_shape: cyclic
  # Deal carries a cyclic desking/finance loop (DESKING -> SUBMITTED_TO_LENDER ->
  # DESKING on decline, APPROVED -> DESKING on rehash) plus a fund/unwind
  # compensation. TitleRegistration carries a branching revert cycle
  # (SUBMITTED -> REJECTED -> SUBMITTED). Vehicle and FloorPlanLine are guarded
  # linear lifecycles driven by cross-entity cascades.

  relationship_patterns:
    - one_to_many       # Deal has many DealProduct / DealJacketDocument; Vehicle has FloorPlanLine
    - cross_aggregate   # Deal references Vehicle + Customer; TitleRegistration references Deal; RepairOrder references Vehicle (+ optional Deal)
    - polymorphic       # OEMIncentive eligibility references vehicle attributes; LenderProgram tier keyed by Customer.credit_tier

  role_model: peer_roles
  # SalesManager (desking), FinanceManager (F&I contracts/products), InventoryClerk
  # (vehicles/floor-plan/trade acquisition), ServiceAdvisor (repair orders),
  # TitleClerk (DMV title/registration), Customer (own test drives). Distinct
  # resource ownership per role; FinanceManager vs SalesManager separation gives a
  # segregation-of-duties flavor on the desking->contracting handoff.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vehicle
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: vin, type: string, source: input, description: "17-char Vehicle Identification Number; unique across inventory", constraints: "exactly 17 chars, uppercase alphanumeric excluding I,O,Q" }
      - { name: condition, type: enum, source: input, description: "NEW | USED", constraints: "NEW | USED" }
      - { name: make, type: string, source: input, description: "Manufacturer make (e.g. ACME)" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: model_year, type: integer, source: input, description: "Model year" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price in cents (NEW)", constraints: ">= 0" }
      - { name: list_price_cents, type: integer, source: input, description: "Dealer asking/list price in cents; used as collateral value for LTV", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> ON_DEAL -> SOLD; RECON -> AVAILABLE; back to AVAILABLE on unwind", default: "AVAILABLE", constraints: "AVAILABLE | ON_DEAL | SOLD | RECON" }
      - { name: acquired_from_trade_in_id, type: string, source: system, required: false, description: "Denormalized back-link: id of the TradeIn this USED Vehicle was created from (discover the forward direction via the trade-in's deal); set on trade acceptance" }
      - { name: active_floor_plan_line_id, type: string, source: computed, required: false, description: "id of the current ACTIVE FloorPlanLine for this vehicle (latest ACTIVE by created_at), or null" }

  - name: FloorPlanLine
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; the floored vehicle" }
      - { name: lender_name, type: string, source: input, description: "Floor-plan lender (e.g. FLOORBANK)" }
      - { name: principal_cents, type: integer, source: input, description: "Original floored principal in cents", constraints: "> 0" }
      - { name: annual_rate_bps, type: integer, source: input, description: "Floor-plan annual interest rate in basis points (e.g. 825 = 8.25%)", constraints: ">= 0" }
      - { name: floored_on, type: datetime, source: input, description: "ISO8601 date the vehicle was floored; aging baseline" }
      - { name: principal_outstanding_cents, type: integer, source: computed, description: "principal_cents minus sum of curtailment principal reductions" }
      - { name: curtailments_applied, type: integer, source: computed, description: "count of curtailments recorded against this line", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE -> PAID_OFF; PAID_OFF -> ACTIVE on unwind reinstatement; ACTIVE -> SUPERSEDED when re-floored", default: "ACTIVE", constraints: "ACTIVE | PAID_OFF | SUPERSEDED | REINSTATED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Customer email; unique" }
      - { name: monthly_income_cents, type: integer, source: input, description: "Gross monthly income in cents; used for payment-to-income (PTI) gating", constraints: ">= 0" }
      - { name: credit_tier, type: enum, source: input, description: "Credit tier selecting lender buy rate", constraints: "TIER_A | TIER_B | TIER_C | TIER_D" }
      - { name: drivers_license_valid, type: boolean, source: input, description: "Whether the customer has a verified valid driver license (test-drive gate)", default: false }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; the deal this trade is attached to" }
      - { name: vin, type: string, source: input, description: "VIN of the traded vehicle" }
      - { name: acv_cents, type: integer, source: input, description: "Actual cash value (appraised) in cents", constraints: ">= 0" }
      - { name: allowance_cents, type: integer, source: input, description: "Trade allowance shown to customer in cents; drives tax credit", constraints: ">= 0" }
      - { name: payoff_cents, type: integer, source: input, description: "Lien payoff amount owed on the trade in cents", constraints: ">= 0" }
      - { name: gross_equity_cents, type: integer, source: computed, description: "allowance_cents - payoff_cents (may be negative)" }
      - { name: status, type: enum, source: system, description: "APPRAISED -> ACCEPTED (on deal CONTRACTED) / RELEASED (on deal unwind or trade replaced)", default: "APPRAISED", constraints: "APPRAISED | ACCEPTED | RELEASED" }
      - { name: acquired_vehicle_id, type: string, source: system, required: false, description: "Denormalized back-link: id of the USED Vehicle created when this trade was ACCEPTED (the Vehicle is independently listable via GET /vehicles?acquired_from_trade_in_id)" }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle being sold" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; buyer" }
      - { name: deal_type, type: enum, source: input, description: "FINANCE | CASH", default: "FINANCE", constraints: "FINANCE | CASH" }
      - { name: sale_price_cents, type: integer, source: input, description: "Agreed vehicle sale price in cents", constraints: ">= 0" }
      - { name: accessories_cents, type: integer, source: input, required: false, description: "Taxable dealer-installed accessories total in cents", default: 0 }
      - { name: doc_fee_cents, type: integer, source: input, required: false, description: "Taxable documentation fee in cents", default: 0 }
      - { name: title_fee_cents, type: integer, source: input, required: false, description: "Non-taxable government title fee in cents", default: 0 }
      - { name: registration_fee_cents, type: integer, source: input, required: false, description: "Non-taxable government registration fee in cents", default: 0 }
      - { name: tax_rate_bps, type: integer, source: input, description: "Sales tax rate in basis points (e.g. 725 = 7.25%)", constraints: ">= 0" }
      - { name: cash_down_cents, type: integer, source: input, required: false, description: "Customer cash down payment in cents", default: 0 }
      - { name: applied_incentive_id, type: string, source: system, required: false, description: "Config lookup: id of the single OEMIncentive applied to this deal (resolve forward via GET /oem-incentives/{id})" }
      - { name: rebate_cents, type: integer, source: computed, description: "Cash rebate amount from the applied OEM incentive (0 if none)", default: 0 }
      - { name: trade_allowance_cents, type: integer, source: computed, description: "allowance_cents of the attached non-RELEASED TradeIn (0 if none)", default: 0 }
      - { name: trade_equity_cents, type: integer, source: computed, description: "gross_equity_cents of the attached non-RELEASED TradeIn (0 if none)" }
      - { name: total_tax_cents, type: integer, source: computed, description: "Sales tax computed per-line-rounded then summed (see calc deal_tax)" }
      - { name: fi_products_total_cents, type: integer, source: computed, description: "Sum of sold_price_cents over this deal's non-VOID DealProduct rows" }
      - { name: amount_financed_cents, type: integer, source: computed, description: "Cash-due / amount-financed (see calc amount_financed)" }
      - { name: front_gross_cents, type: integer, source: computed, description: "Front-end gross: sale_price - vehicle cost basis (see calc deal_gross variant FRONT)" }
      - { name: back_gross_cents, type: integer, source: computed, description: "Back-end gross: F&I product markup + finance reserve (see calc deal_gross variant BACK)" }
      - { name: estimated_payment_cents, type: integer, source: computed, required: false, description: "Provisional monthly payment at desking sell rate (calc monthly_payment variant ESTIMATE)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> DESKING -> SUBMITTED_TO_LENDER -> APPROVED -> CONTRACTED -> FUNDED; with rehash cycles and UNWOUND/DEAD terminals", default: "DRAFT", constraints: "DRAFT | DESKING | SUBMITTED_TO_LENDER | APPROVED | CONTRACTED | FUNDED | UNWOUND | DEAD" }
      - { name: approved_lender_program_id, type: string, source: system, required: false, description: "Config lookup: id of the LenderProgram approved for this deal (resolve forward via GET /lender-programs/{id})" }

  - name: LenderProgram
    parent: null
    common_fields: true
    fields:
      - { name: lender_name, type: string, source: input, description: "Lender name (e.g. CREDITONE)" }
      - { name: tier, type: enum, source: input, description: "Credit tier this program serves", constraints: "TIER_A | TIER_B | TIER_C | TIER_D" }
      - { name: buy_rate_bps, type: integer, source: input, description: "Lender buy rate in basis points", constraints: ">= 0" }
      - { name: max_markup_bps, type: integer, source: input, description: "Maximum dealer rate markup over buy rate in basis points", constraints: ">= 0" }
      - { name: max_ltv_bps, type: integer, source: input, description: "Maximum loan-to-value in basis points (e.g. 12500 = 125%)", constraints: "> 0" }
      - { name: max_pti_bps, type: integer, source: input, description: "Maximum payment-to-income in basis points (e.g. 1800 = 18%)", constraints: "> 0" }
      - { name: max_term_months, type: integer, source: input, description: "Maximum financeable term in months", constraints: "> 0" }
      - { name: active, type: boolean, source: input, description: "Whether the program is offered", default: true }

  - name: FinanceProduct
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Product code (e.g. VSC, GAP); unique" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: cost_cents, type: integer, source: input, description: "Dealer cost in cents", constraints: ">= 0" }
      - { name: max_retail_cents, type: integer, source: input, description: "Maximum sellable retail price in cents", constraints: ">= 0" }
      - { name: taxable, type: boolean, source: input, description: "Whether the product price is part of the taxable base", default: false }

  - name: DealProduct
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; deal this product line belongs to" }
      - { name: finance_product_id, type: string, source: input, description: "Catalog lookup: id of the FinanceProduct sold (resolve forward via GET /finance-products/{id}); validated to exist on attach" }
      - { name: sold_price_cents, type: integer, source: input, description: "Sold retail price in cents", constraints: ">= 0" }
      - { name: product_cost_cents, type: integer, source: system, description: "Snapshot of FinanceProduct.cost_cents at attach time" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> VOID (when removed during rehash)", default: "ACTIVE", constraints: "ACTIVE | VOID" }

  - name: FinanceContract
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; the deal financed by this contract" }
      - { name: lender_program_id, type: string, source: input, description: "Config lookup: id of the LenderProgram used (resolve forward via GET /lender-programs/{id}); validated to exist on create" }
      - { name: markup_bps, type: integer, source: input, description: "Dealer rate markup over buy rate in basis points", constraints: ">= 0" }
      - { name: term_months, type: integer, source: input, description: "Loan term in months", constraints: "> 0" }
      - { name: sell_rate_bps, type: integer, source: computed, description: "buy_rate_bps + markup_bps (final APR in bps)" }
      - { name: amount_financed_snapshot_cents, type: integer, source: system, description: "Snapshot of Deal.amount_financed_cents at contract creation" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Final amortized monthly payment (calc monthly_payment variant FINAL)" }
      - { name: finance_reserve_cents, type: integer, source: computed, description: "Dealer rate-spread participation (calc finance_reserve)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUPERSEDED (when a newer contract is created during rehash) / CANCELLED (on unwind)", default: "ACTIVE", constraints: "ACTIVE | SUPERSEDED | CANCELLED" }

  - name: OEMIncentive
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Incentive program code; unique" }
      - { name: rebate_cents, type: integer, source: input, description: "Cash rebate amount in cents", constraints: ">= 0" }
      - { name: eligible_condition, type: enum, source: input, description: "Vehicle condition this incentive applies to", constraints: "NEW | USED | ANY" }
      - { name: eligible_make, type: string, source: input, required: false, description: "If set, only vehicles of this make are eligible; null = any make" }
      - { name: min_model_year, type: integer, source: input, required: false, description: "If set, vehicle.model_year must be >= this value" }
      - { name: stackable_with_finance, type: boolean, source: input, description: "Whether the rebate may be combined with a FINANCE deal", default: true }
      - { name: active, type: boolean, source: input, description: "Whether the incentive is currently offered", default: true }

  - name: TestDrive
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle being driven" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the driver" }
      - { name: start_at, type: datetime, source: input, description: "ISO8601 start time (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "ISO8601 end time (exclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED / CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle in service" }
      - { name: deal_id, type: string, source: input, required: false, description: "FK -> Deal.id; linked deal for we-owe/recon work (null for retail service)" }
      - { name: ro_type, type: enum, source: input, description: "RECON | WE_OWE | RETAIL", constraints: "RECON | WE_OWE | RETAIL" }
      - { name: bay, type: enum, source: input, description: "Service bay identifier", constraints: "BAY_1 | BAY_2 | BAY_3" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "ISO8601 bay slot start (inclusive)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "ISO8601 bay slot end (inclusive)" }
      - { name: parts_cents, type: integer, source: input, required: false, description: "Parts total in cents", default: 0 }
      - { name: labor_cents, type: integer, source: input, required: false, description: "Labor total in cents", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "parts_cents + labor_cents" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED; OPEN -> CANCELLED", default: "OPEN", constraints: "OPEN | CLOSED | CANCELLED" }

  - name: TitleRegistration
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; the funded deal whose title/registration is submitted to DMV" }
      - { name: owner_name, type: string, source: input, description: "Registered owner name" }
      - { name: plate_type, type: enum, source: input, description: "NEW_PLATE | TRANSFER", constraints: "NEW_PLATE | TRANSFER" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "DMV rejection reason set on REJECTED" }
      - { name: resubmit_count, type: integer, source: computed, description: "number of times this record has been resubmitted after rejection", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING -> SUBMITTED -> ACCEPTED / REJECTED; REJECTED -> SUBMITTED (resubmit)", default: "PENDING", constraints: "PENDING | SUBMITTED | ACCEPTED | REJECTED" }

  - name: DealJacketDocument
    parent: null
    common_fields: false   # immutable append-only event; carries only id + created_at
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; deal this document belongs to" }
      - { name: doc_type, type: enum, source: input, description: "Document/stipulation type", constraints: "CREDIT_APP | PROOF_OF_INCOME | INSURANCE | BILL_OF_SALE | ODOMETER" }
      - { name: uri, type: string, source: input, description: "Opaque storage URI of the uploaded document" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Deal
    initial_state: DRAFT
    terminal_states: [FUNDED, UNWOUND, DEAD]
    transitions:
      - from: DRAFT
        to: DESKING
        trigger: "POST /deals/{id}/desk"
        actor: SalesManager
        preconditions:
          - "Deal.vehicle_id references a Vehicle in status AVAILABLE or ON_DEAL owned-by-this-deal (ERR_VEHICLE_NOT_AVAILABLE)"
          - "deal pricing inputs present (sale_price_cents, tax_rate_bps)"
        side_effects:
          - "Vehicle.status: AVAILABLE -> ON_DEAL (vehicle reserved to this deal)"
          - "recompute calc deal_tax, amount_financed, deal_gross (FRONT/BACK), and monthly_payment variant ESTIMATE -> Deal.estimated_payment_cents"
          - "increments Deal.version by 1"

      - from: DESKING
        to: DESKING
        trigger: "POST /deals/{id}/desk"
        actor: SalesManager
        preconditions:
          - "Vehicle still ON_DEAL for this deal"
        side_effects:
          - "re-quote: recompute deal_tax, amount_financed, deal_gross, estimated_payment_cents from current inputs/products/trade/incentive"
          - "increments Deal.version by 1"
        note: "Idempotent re-desk loop (cyclic self-edge) used during negotiation rehash."

      - from: DESKING
        to: SUBMITTED_TO_LENDER
        trigger: "POST /deals/{id}/submit-to-lender"
        actor: SalesManager
        preconditions:
          - "Deal.deal_type == FINANCE (ERR_DEAL_TYPE_NOT_FINANCE)"
          - "a DealJacketDocument of doc_type CREDIT_APP exists for this deal (ERR_CREDIT_APP_MISSING)"
        side_effects:
          - "increments Deal.version by 1"

      - from: SUBMITTED_TO_LENDER
        to: APPROVED
        trigger: "POST /deals/{id}/lender-decision (decision=APPROVE)"
        actor: FinanceManager
        preconditions:
          - "request lender_program_id references a LenderProgram with active==true and tier == Customer.credit_tier (ERR_LENDER_TIER_MISMATCH)"
        side_effects:
          - "Deal.approved_lender_program_id := request lender_program_id"
          - "increments Deal.version by 1"

      - from: SUBMITTED_TO_LENDER
        to: DESKING
        trigger: "POST /deals/{id}/lender-decision (decision=DECLINE)"
        actor: FinanceManager
        preconditions: []
        side_effects:
          - "Deal.approved_lender_program_id := null"
          - "increments Deal.version by 1"
        note: "Cyclic revert: lender decline sends the deal back to DESKING for rehash."

      - from: APPROVED
        to: DESKING
        trigger: "POST /deals/{id}/desk"
        actor: SalesManager
        preconditions:
          - "Vehicle still ON_DEAL for this deal"
        side_effects:
          - "Deal.approved_lender_program_id := null (approval invalidated by rehash)"
          - "any ACTIVE FinanceContract for this deal -> SUPERSEDED"
          - "re-quote recompute (deal_tax, amount_financed, deal_gross, estimated_payment_cents)"
          - "increments Deal.version by 1"
        note: "Cyclic revert: re-desking an approved deal reopens negotiation."

      - from: APPROVED
        to: CONTRACTED
        trigger: "POST /deals/{id}/contract"
        actor: FinanceManager
        preconditions:
          - "Vehicle.status == ON_DEAL for this deal (ERR_VEHICLE_NOT_AVAILABLE) [cross-entity: Deal depends on Vehicle]"
          - "an ACTIVE FinanceContract exists for this deal (ERR_NO_ACTIVE_CONTRACT)"
          - "DealJacketDocument of doc_type INSURANCE exists for this deal (ERR_STIP_MISSING)"
        side_effects:
          - "CASCADE link1: any attached TradeIn (status APPRAISED) -> ACCEPTED"
          - "CASCADE link2 (caused by TradeIn ACCEPTED): create a USED Vehicle in status RECON with TradeIn.vin, set TradeIn.acquired_vehicle_id and Vehicle.acquired_from_trade_in_id"
          - "increments Deal.version by 1"

      - from: CONTRACTED
        to: FUNDED
        trigger: "POST /deals/{id}/fund"
        actor: FinanceManager
        preconditions:
          - "Vehicle.status == ON_DEAL for this deal (ERR_VEHICLE_NOT_AVAILABLE) [cross-entity: Deal depends on Vehicle]"
          - "request expected_vehicle_version matches current Vehicle.version (ERR_STALE_VERSION, 412)"
          - "Deal.amount_financed_cents <= LenderProgram.max_ltv_bps/10000 * Vehicle.list_price_cents (ERR_LTV_EXCEEDED)"
          - "FinanceContract.monthly_payment_cents <= LenderProgram.max_pti_bps/10000 * Customer.monthly_income_cents (ERR_PTI_EXCEEDED)"
        side_effects:
          - "CASCADE link1: Vehicle.status ON_DEAL -> SOLD"
          - "CASCADE link2 (caused by Vehicle SOLD): the vehicle's ACTIVE FloorPlanLine (if any) -> PAID_OFF, principal_outstanding_cents := 0"
          - "CASCADE link3 (caused by FloorPlanLine PAID_OFF): auto-create a TitleRegistration for this deal in status PENDING"
          - "increments Vehicle.version by 1; increments Deal.version by 1"

      - from: DRAFT
        to: DEAD
        trigger: "POST /deals/{id}/kill"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "increments Deal.version by 1"

      - from: DESKING
        to: DEAD
        trigger: "POST /deals/{id}/kill"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "Vehicle.status ON_DEAL -> AVAILABLE (release reservation)"
          - "any attached TradeIn (APPRAISED) -> RELEASED"
          - "increments Deal.version by 1"

      - from: FUNDED
        to: UNWOUND
        trigger: "POST /deals/{id}/unwind"
        actor: FinanceManager
        preconditions:
          - "no TitleRegistration for this deal is in status ACCEPTED (ERR_TITLE_ALREADY_ACCEPTED)"
        side_effects:
          - "COMPENSATION + CASCADE link1: Vehicle.status SOLD -> AVAILABLE"
          - "CASCADE link2 (caused by Vehicle AVAILABLE): the vehicle's PAID_OFF FloorPlanLine that was paid by this funding -> REINSTATED, principal_outstanding_cents := principal_cents minus prior curtailment reductions"
          - "any ACTIVE FinanceContract for this deal -> CANCELLED"
          - "any TradeIn ACCEPTED for this deal -> RELEASED; its acquired USED Vehicle (RECON) -> deleted/withdrawn (status RECON unchanged but unlinked); conserved-quantity invariant fp_principal_outstanding restored"
          - "any PENDING TitleRegistration for this deal -> (record retained; no DMV submission)"
          - "increments Vehicle.version by 1; increments Deal.version by 1"
        note: "Compensation: reverses the FUND cascade so global floor-plan principal outstanding returns to its pre-fund total."

  - entity: Vehicle
    initial_state: AVAILABLE
    terminal_states: []   # SOLD is normally final but is reversible to AVAILABLE via Deal unwind
    transitions:
      - from: AVAILABLE
        to: ON_DEAL
        trigger: "system: Deal desk reserves the vehicle (POST /deals/{id}/desk)"
        actor: system
        preconditions:
          - "Vehicle.status == AVAILABLE"
        side_effects:
          - "increments Vehicle.version by 1"

      - from: ON_DEAL
        to: SOLD
        trigger: "system: Deal fund (POST /deals/{id}/fund)"
        actor: system
        preconditions:
          - "Vehicle.status == ON_DEAL"
        side_effects:
          - "triggers FloorPlanLine PAID_OFF cascade (see Deal CONTRACTED->FUNDED)"
          - "increments Vehicle.version by 1"

      - from: ON_DEAL
        to: AVAILABLE
        trigger: "system: Deal kill from DESKING (POST /deals/{id}/kill)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Vehicle.version by 1"

      - from: SOLD
        to: AVAILABLE
        trigger: "system: Deal unwind (POST /deals/{id}/unwind)"
        actor: system
        preconditions: []
        side_effects:
          - "triggers FloorPlanLine REINSTATED cascade"
          - "increments Vehicle.version by 1"

      - from: RECON
        to: AVAILABLE
        trigger: "POST /vehicles/{id}/recondition-complete"
        actor: InventoryClerk
        preconditions:
          - "Vehicle.status == RECON"
        side_effects:
          - "increments Vehicle.version by 1"

  - entity: FloorPlanLine
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system: vehicle SOLD via Deal fund"
        actor: system
        preconditions:
          - "FloorPlanLine.status == ACTIVE"
        side_effects:
          - "principal_outstanding_cents := 0"

      - from: PAID_OFF
        to: REINSTATED
        trigger: "system: vehicle returns to AVAILABLE via Deal unwind"
        actor: system
        preconditions:
          - "FloorPlanLine.status == PAID_OFF and was paid by the unwound deal's funding"
        side_effects:
          - "principal_outstanding_cents := principal_cents minus sum of recorded curtailment reductions (restored)"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: vehicle re-floored (POST /vehicles/{id}/floor-plan-lines creates a superseding line)"
        actor: system
        preconditions:
          - "FloorPlanLine.status == ACTIVE"
        side_effects:
          - "no principal change; line marked SUPERSEDED; new line becomes the ACTIVE line"

  - entity: FinanceContract
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer FinanceContract is created for the deal, or deal re-desked from APPROVED"
        actor: system
        preconditions:
          - "FinanceContract.status == ACTIVE"
        side_effects:
          - "newer contract becomes the deal's ACTIVE contract"

      - from: ACTIVE
        to: CANCELLED
        trigger: "system: Deal unwind"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TradeIn
    initial_state: APPRAISED
    terminal_states: [RELEASED]
    transitions:
      - from: APPRAISED
        to: ACCEPTED
        trigger: "system: Deal contract (POST /deals/{id}/contract)"
        actor: system
        preconditions:
          - "owning Deal transitions APPROVED -> CONTRACTED"
        side_effects:
          - "create USED Vehicle (status RECON) from TradeIn.vin; link acquired_vehicle_id"

      - from: APPRAISED
        to: RELEASED
        trigger: "system: Deal kill from DESKING, or trade replaced on the deal"
        actor: system
        preconditions: []
        side_effects:
          - "Deal trade_allowance_cents / trade_equity_cents recompute to 0 (if replaced, to the new trade)"

      - from: ACCEPTED
        to: RELEASED
        trigger: "system: Deal unwind"
        actor: system
        preconditions: []
        side_effects:
          - "acquired USED Vehicle unlinked"

  - entity: TestDrive
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /test-drives/{id}/complete"
        actor: SalesManager
        preconditions:
          - "TestDrive.status == SCHEDULED"
        side_effects:
          - "increments TestDrive.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /test-drives/{id}/cancel"
        actor: SalesManager
        preconditions:
          - "TestDrive.status == SCHEDULED"
        side_effects:
          - "frees the vehicle interval for re-booking"
          - "increments TestDrive.version by 1"

  - entity: RepairOrder
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /repair-orders/{id}/close"
        actor: ServiceAdvisor
        preconditions:
          - "RepairOrder.status == OPEN"
        side_effects:
          - "total_cents finalized = parts_cents + labor_cents"
          - "increments RepairOrder.version by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "RepairOrder.status == OPEN"
        side_effects:
          - "frees the bay interval"
          - "increments RepairOrder.version by 1"

  - entity: TitleRegistration
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /title-registrations/{id}/submit"
        actor: TitleClerk
        preconditions:
          - "the referenced Deal.status == FUNDED (ERR_DEAL_NOT_FUNDED) [cross-entity: TitleRegistration depends on Deal]"
          - "a DealJacketDocument of doc_type ODOMETER exists for the deal (ERR_STIP_MISSING)"
        side_effects:
          - "increments TitleRegistration.version by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /title-registrations/{id}/dmv-result (result=ACCEPT)"
        actor: TitleClerk
        preconditions:
          - "TitleRegistration.status == SUBMITTED"
        side_effects:
          - "increments TitleRegistration.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /title-registrations/{id}/dmv-result (result=REJECT)"
        actor: TitleClerk
        preconditions:
          - "TitleRegistration.status == SUBMITTED"
          - "request rejection_reason present (ERR_REJECTION_REASON_REQUIRED)"
        side_effects:
          - "TitleRegistration.rejection_reason := request rejection_reason"
          - "increments TitleRegistration.version by 1"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /title-registrations/{id}/submit"
        actor: TitleClerk
        preconditions:
          - "the referenced Deal.status == FUNDED (ERR_DEAL_NOT_FUNDED) [cross-entity: TitleRegistration depends on Deal]"
          - "a DealJacketDocument of doc_type ODOMETER exists for the deal (ERR_STIP_MISSING)"
        side_effects:
          - "resubmit_count += 1"
          - "rejection_reason cleared"
          - "increments TitleRegistration.version by 1"
        note: "Branching revert cycle: REJECTED -> SUBMITTED reopens the DMV submission."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC — true create-with-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: finance-contract-supersede
    parent_entity: Deal
    write_endpoint: "POST /deals/{id}/finance-contracts"
    occ_field: "expected_deal_version"
    description: |
      Creating a FinanceContract against a Deal whose version has advanced since
      the client last observed it is rejected. A new contract legitimately
      supersedes the prior ACTIVE contract on the deal during a rehash; a client
      whose view of the deal is stale (because another contract was already
      created, bumping Deal.version and superseding the prior contract) must be
      rejected so it re-reads before superseding again.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: floor-plan-line-supersede
    parent_entity: Vehicle
    write_endpoint: "POST /vehicles/{id}/floor-plan-lines"
    occ_field: "expected_vehicle_version"
    description: |
      Placing a Vehicle on a new FloorPlanLine when the Vehicle's version has
      advanced since the client last observed it is rejected. Re-flooring a
      vehicle legitimately supersedes its prior ACTIVE FloorPlanLine; a client
      working from a stale Vehicle view (another re-floor already created a line
      and bumped Vehicle.version) must re-read before superseding again.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: deal_tax
    trigger: "Deal desk/re-desk; recomputed whenever sale_price, accessories, doc_fee, trade allowance, or tax_rate change"
    algorithm: tiered_pricing
    formula: |
      tax_rate = tax_rate_bps / 10000
      # taxable lines, in cents, each rounded to the cent INDEPENDENTLY then summed
      # (rounding order is PINNED: round-per-line-then-sum).
      taxable_sale_cents = max(0, sale_price_cents - trade_allowance_cents)   # trade allowance is a tax credit
      line_tax_sale  = round_half_up( taxable_sale_cents  * tax_rate )
      line_tax_acc   = round_half_up( accessories_cents   * tax_rate )
      line_tax_doc   = round_half_up( doc_fee_cents       * tax_rate )
      total_tax_cents = line_tax_sale + line_tax_acc + line_tax_doc
      # NOTE: round-then-sum differs from sum-then-round by up to a cent — the
      # round-per-line order is the authoritative one (mode (b) of Rule 2).
    input_set: "Single Deal; uses its own input fields plus the attached non-RELEASED TradeIn's allowance_cents"
    constants: {}
    precision: "cents (integer); each line rounded half-up to whole cents before summation"

  - name: amount_financed
    trigger: "Deal desk/re-desk; and snapshotted at FinanceContract creation"
    algorithm: aggregation
    formula: |
      fi_products_total_cents = sum(DealProduct.sold_price_cents WHERE DealProduct.deal_id==deal AND status==ACTIVE)
      total_tax_cents = deal_tax(deal)
      gross_due_cents =
          sale_price_cents + accessories_cents + doc_fee_cents
        + title_fee_cents + registration_fee_cents
        + total_tax_cents + fi_products_total_cents
      reductions_cents = rebate_cents + trade_equity_cents + cash_down_cents
      amount_financed_cents = gross_due_cents - reductions_cents
      # trade_equity_cents = trade_allowance_cents - trade_payoff_cents (may be negative,
      # in which case negative equity INCREASES amount financed).
    input_set: "Single Deal: own fields + ACTIVE DealProduct rows + applied OEMIncentive.rebate + attached non-RELEASED TradeIn"
    constants: {}
    precision: "cents (integer)"

  - name: monthly_payment
    trigger: "ESTIMATE on Deal desk; FINAL on FinanceContract creation"
    algorithm: forward_looking
    formula: |
      # Standard fixed-rate amortization, monthly compounding.
      apr = sell_rate_bps / 10000          # FINAL uses buy_rate_bps + markup_bps; ESTIMATE uses DESK_ESTIMATE_RATE_BPS
      n   = term_months                    # FINAL uses contract term; ESTIMATE uses DESK_ESTIMATE_TERM_MONTHS
      P   = amount_financed_cents / 100    # dollars
      r   = apr / 12
      if r == 0:
          pmt = P / n
      else:
          pmt = P * r / (1 - (1 + r) ** (-n))
      monthly_payment_cents = round_half_up(pmt * 100)
    input_set: "Single Deal's amount_financed; rate+term differ by variant"
    constants:
      DESK_ESTIMATE_RATE_BPS: 699          # provisional desking sell rate (6.99%)
      DESK_ESTIMATE_TERM_MONTHS: 72
    precision: "cents (integer), round half-up"
    variants:
      - name: ESTIMATE
        when: "Deal desk/re-desk (no lender approval yet)"
        difference: "Uses DESK_ESTIMATE_RATE_BPS (699) and DESK_ESTIMATE_TERM_MONTHS (72); writes Deal.estimated_payment_cents. Provisional."
      - name: FINAL
        when: "FinanceContract creation (after lender approval)"
        difference: "Uses LenderProgram.buy_rate_bps + FinanceContract.markup_bps (= sell_rate_bps) and FinanceContract.term_months; writes FinanceContract.monthly_payment_cents. Same amount_financed, different rate/term -> different payment."

  - name: floor_plan_payoff
    trigger: "ESTIMATE when desking quotes the payoff to an estimated funding date; ACTUAL when the deal funds on the real funding date"
    algorithm: chronological
    formula: |
      daily_interest_cents(P_cents, annual_rate_bps, days) =
          round_half_up( P_cents * (annual_rate_bps/10000) / 360 * days )   # 360-day basis
      payoff_cents = principal_outstanding_cents + daily_interest_cents(principal_outstanding_cents, annual_rate_bps, days_accrued)
    input_set: "Single FloorPlanLine; days_accrued depends on the chosen 'as-of' date relative to floored_on"
    constants:
      DAY_COUNT_BASIS: 360
    precision: "cents (integer), round half-up"
    variants:
      - name: ESTIMATE
        when: "Desk-time quote: days_accrued = ceil(estimated_funding_date - floored_on) projected forward"
        difference: "Forward-looking: interest accrued to a PROJECTED funding date supplied at quote time."
      - name: ACTUAL
        when: "At fund: days_accrued = (actual fund date - floored_on)"
        difference: "Chronological: interest accrued to the ACTUAL elapsed days through fund. Same line, different as-of date -> different payoff."

  - name: deal_gross
    trigger: "Deal desk/re-desk; recomputed on product/trade/contract changes"
    algorithm: aggregation
    formula: |
      # FRONT variant — vehicle department gross
      vehicle_cost_basis_cents = (active FloorPlanLine.principal_cents for Deal.vehicle_id) if exists else list_price_cents
      front_gross_cents = sale_price_cents + accessories_cents - vehicle_cost_basis_cents
      # BACK variant — F&I department gross
      product_markup_cents = sum( (DealProduct.sold_price_cents - DealProduct.product_cost_cents)
                                  for ACTIVE DealProduct rows of the deal )
      back_gross_cents = product_markup_cents + finance_reserve_cents   # finance_reserve_cents=0 until a FinanceContract exists
    input_set: "Single Deal; FRONT uses vehicle cost basis, BACK uses ACTIVE DealProduct markup + finance reserve"
    constants: {}
    precision: "cents (integer)"
    variants:
      - name: FRONT
        when: "Always (vehicle-department gross)"
        difference: "Computed from sale price + accessories minus vehicle cost basis (floor-plan principal). Entity domain: vehicle pricing."
      - name: BACK
        when: "Always (F&I-department gross)"
        difference: "Computed from F&I product markup + finance reserve. Same Deal, different gross because the cost/revenue inputs are a disjoint set from FRONT."

  - name: finance_reserve
    trigger: "FinanceContract creation"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency, evaluation order PINNED (mode (c) of Rule 2):
      #   markup_bps is capped by LenderProgram.max_markup_bps, but the dollar
      #   reserve is a flat-rate participation on the amount financed keyed on the
      #   markup tier. Evaluate strictly in this order:
      #   (1) effective_markup_bps = min(markup_bps, max_markup_bps)
      #   (2) reserve_rate = RESERVE_RATE_LOW if effective_markup_bps <= MARKUP_TIER_BPS else RESERVE_RATE_HIGH
      #   (3) finance_reserve_cents = round_half_up(amount_financed_snapshot_cents * reserve_rate)
      effective_markup_bps = min(markup_bps, LenderProgram.max_markup_bps)
      reserve_rate = RESERVE_RATE_LOW if effective_markup_bps <= MARKUP_TIER_BPS else RESERVE_RATE_HIGH
      finance_reserve_cents = round_half_up(amount_financed_snapshot_cents * reserve_rate)
    input_set: "Single FinanceContract + its LenderProgram + the snapshotted amount financed"
    constants:
      MARKUP_TIER_BPS: 150
      RESERVE_RATE_LOW: 0.01
      RESERVE_RATE_HIGH: 0.02
    precision: "cents (integer), round half-up"

  - name: incentive_eligibility
    trigger: "POST /deals/{id}/apply-incentive"
    algorithm: threshold
    formula: |
      An OEMIncentive is ELIGIBLE for a Deal iff ALL hold:
        incentive.active == true
        incentive.eligible_condition == Vehicle.condition OR incentive.eligible_condition == ANY
        (incentive.eligible_make is null OR incentive.eligible_make == Vehicle.make)
        (incentive.min_model_year is null OR Vehicle.model_year >= incentive.min_model_year)
        (Deal.deal_type != FINANCE OR incentive.stackable_with_finance == true)
      Empty-set fallback: if the requested incentive is NOT eligible -> ERR_INCENTIVE_NOT_ELIGIBLE.
      On success: Deal.applied_incentive_id := incentive.id; Deal.rebate_cents := incentive.rebate_cents.
    input_set: "One requested OEMIncentive vs the Deal's Vehicle attributes and deal_type"
    constants: {}
    precision: "n/a"

  - name: curtailment
    trigger: "POST /floor-plan-lines/{id}/curtailments"
    algorithm: threshold
    formula: |
      age_days = (as_of_date - floored_on) in whole days
      A curtailment is DUE iff age_days >= CURTAILMENT_AGE_DAYS (>=, not >).
      If due, reduction_cents = round_half_up(principal_cents * CURTAILMENT_PCT).
      principal_outstanding_cents -= reduction_cents
      curtailments_applied += 1
      If age_days < CURTAILMENT_AGE_DAYS -> ERR_CURTAILMENT_NOT_DUE.
    input_set: "Single FloorPlanLine + an as_of_date supplied in the request"
    constants:
      CURTAILMENT_AGE_DAYS: 90
      CURTAILMENT_PCT: 0.10
    precision: "cents (integer), round half-up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix; for Customer-owned resources X-User-ID must match the resource's customer_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the path resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Foreign keys in the request body reference existing resources (vehicle_id, customer_id, deal_id, finance_product_id, lender_program_id, etc.)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create/link endpoints with FK body fields"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values valid, VIN exactly 17 chars, numeric fields within constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: business_constraint
    check: "VIN unique across Vehicles on create"
    error_id: ERR_VIN_DUPLICATE
    http_status: 409
    applies_to: "POST /vehicles"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: concurrency
    check: "OCC: expected_<parent>_version equals the parent's current version on create-with-supersede endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /deals/{id}/finance-contracts, POST /vehicles/{id}/floor-plan-lines"

  - priority: 9
    category: business_referential
    check: "Vehicle referenced by a deal transition is in the required status (AVAILABLE to desk; ON_DEAL to contract/fund)"
    error_id: ERR_VEHICLE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /deals/{id}/desk, /contract, /fund"

  - priority: 10
    category: business_referential
    check: "Cross-entity gate: TitleRegistration submit requires its Deal in FUNDED"
    error_id: ERR_DEAL_NOT_FUNDED
    http_status: 409
    applies_to: "POST /title-registrations/{id}/submit"

  - priority: 11
    category: business_temporal
    check: "TestDrive interval must not overlap another SCHEDULED TestDrive on the same vehicle, including a turnaround buffer after each drive"
    error_id: ERR_TESTDRIVE_OVERLAP
    http_status: 409
    applies_to: "POST /test-drives"

  - priority: 12
    category: business_temporal
    check: "RepairOrder bay slot must not overlap another OPEN RepairOrder in the same bay (closed-interval, no buffer)"
    error_id: ERR_BAY_OVERLAP
    http_status: 409
    applies_to: "POST /repair-orders"

  - priority: 13
    category: business_safety
    check: "TestDrive requires the Customer to have drivers_license_valid == true"
    error_id: ERR_LICENSE_INVALID
    http_status: 409
    applies_to: "POST /test-drives"

  - priority: 14
    category: business_constraint
    check: "DealProduct.sold_price_cents must not exceed FinanceProduct.max_retail_cents"
    error_id: ERR_PRODUCT_PRICE_EXCEEDS_MAX
    http_status: 409
    applies_to: "POST /deals/{id}/products"

  - priority: 15
    category: business_constraint
    check: "FinanceContract markup_bps must not exceed the LenderProgram.max_markup_bps; term_months must not exceed max_term_months"
    error_id: ERR_MARKUP_EXCEEDS_MAX
    http_status: 409
    applies_to: "POST /deals/{id}/finance-contracts"

  - priority: 16
    category: business_fiscal
    check: "At fund: amount_financed_cents must not exceed max_ltv_bps/10000 * Vehicle.list_price_cents (LTV cap, <=)"
    error_id: ERR_LTV_EXCEEDED
    http_status: 409
    applies_to: "POST /deals/{id}/fund"

  - priority: 17
    category: business_fiscal
    check: "At fund: FinanceContract.monthly_payment_cents must not exceed max_pti_bps/10000 * Customer.monthly_income_cents (PTI cap)"
    error_id: ERR_PTI_EXCEEDED
    http_status: 409
    applies_to: "POST /deals/{id}/fund"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Vehicle ----------------
  - method: POST
    path: "/vehicles"
    description: "Create an inventory Vehicle (new or used)"
    roles: [InventoryClerk]
    code: 201
    input: [vin, condition, make, model, model_year, msrp_cents, list_price_cents]
    output: Vehicle
    side_effects: ["status=AVAILABLE", "version=1"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Get a Vehicle"
    roles: [InventoryClerk, SalesManager, FinanceManager, ServiceAdvisor, TitleClerk]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles; filter by status or trade origin"
    roles: [InventoryClerk, SalesManager, FinanceManager, ServiceAdvisor, TitleClerk]
    code: 200
    input: ["status?", "acquired_from_trade_in_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: POST
    path: "/vehicles/{id}/recondition-complete"
    description: "Mark a RECON vehicle ready for sale (RECON -> AVAILABLE)"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["status RECON -> AVAILABLE", "increments Vehicle.version by 1"]

  - method: POST
    path: "/vehicles/{id}/floor-plan-lines"
    description: "Place the vehicle on floor-plan financing (create FloorPlanLine; supersedes prior ACTIVE line)"
    roles: [InventoryClerk]
    code: 201
    input: [lender_name, principal_cents, annual_rate_bps, floored_on, expected_vehicle_version]
    output: FloorPlanLine
    side_effects:
      - "FloorPlanLine status=ACTIVE, principal_outstanding_cents=principal_cents"
      - "any prior ACTIVE FloorPlanLine for this vehicle -> SUPERSEDED"
      - "Vehicle.active_floor_plan_line_id := new line id"
      - "increments Vehicle.version by 1"

  - method: GET
    path: "/vehicles/{id}/floor-plan-lines"
    description: "List FloorPlanLines for a vehicle (reverse-reachability for FloorPlanLine.vehicle_id)"
    roles: [InventoryClerk, FinanceManager]
    code: 200
    input: []
    output: FloorPlanLine[]
    side_effects: []

  # ---------------- FloorPlanLine ----------------
  - method: GET
    path: "/floor-plan-lines/{id}"
    description: "Get a FloorPlanLine"
    roles: [InventoryClerk, FinanceManager]
    code: 200
    input: []
    output: FloorPlanLine
    side_effects: []

  - method: POST
    path: "/floor-plan-lines/{id}/curtailments"
    description: "Record a curtailment principal reduction if aging threshold reached"
    roles: [InventoryClerk]
    code: 200
    input: [as_of_date]
    output: FloorPlanLine
    side_effects:
      - "if age_days>=90: principal_outstanding_cents -= round(principal_cents*0.10); curtailments_applied += 1"
      - "increments FloorPlanLine.version by 1"

  - method: POST
    path: "/floor-plan-lines/{id}/payoff-quote"
    description: "Compute a floor-plan payoff quote as of a date (ESTIMATE/ACTUAL variant of calc floor_plan_payoff)"
    roles: [InventoryClerk, FinanceManager]
    code: 200
    input: [as_of_date]
    output: "{ floor_plan_line_id: string, days_accrued: integer, interest_cents: integer, payoff_cents: integer }"
    side_effects: []

  # ---------------- Customer ----------------
  - method: POST
    path: "/customers"
    description: "Create a Customer"
    roles: [SalesManager]
    code: 201
    input: [full_name, email, monthly_income_cents, credit_tier, drivers_license_valid]
    output: Customer
    side_effects: ["version=1"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a Customer"
    roles: [SalesManager, FinanceManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---------------- LenderProgram / FinanceProduct / OEMIncentive (config) ----------------
  - method: POST
    path: "/lender-programs"
    description: "Create a LenderProgram rate sheet"
    roles: [FinanceManager]
    code: 201
    input: [lender_name, tier, buy_rate_bps, max_markup_bps, max_ltv_bps, max_pti_bps, max_term_months, active]
    output: LenderProgram
    side_effects: ["version=1"]

  - method: GET
    path: "/lender-programs/{id}"
    description: "Get a LenderProgram"
    roles: [FinanceManager, SalesManager]
    code: 200
    input: []
    output: LenderProgram
    side_effects: []

  - method: POST
    path: "/finance-products"
    description: "Create an F&I FinanceProduct catalog entry"
    roles: [FinanceManager]
    code: 201
    input: [code, name, cost_cents, max_retail_cents, taxable]
    output: FinanceProduct
    side_effects: ["version=1"]

  - method: GET
    path: "/finance-products/{id}"
    description: "Get a FinanceProduct"
    roles: [FinanceManager, SalesManager]
    code: 200
    input: []
    output: FinanceProduct
    side_effects: []

  - method: POST
    path: "/oem-incentives"
    description: "Create an OEMIncentive program"
    roles: [SalesManager, FinanceManager]
    code: 201
    input: [program_code, rebate_cents, eligible_condition, eligible_make, min_model_year, stackable_with_finance, active]
    output: OEMIncentive
    side_effects: ["version=1"]

  - method: GET
    path: "/oem-incentives/{id}"
    description: "Get an OEMIncentive"
    roles: [SalesManager, FinanceManager]
    code: 200
    input: []
    output: OEMIncentive
    side_effects: []

  # ---------------- Deal core ----------------
  - method: POST
    path: "/deals"
    description: "Create a Deal in DRAFT"
    roles: [SalesManager]
    code: 201
    input: [vehicle_id, customer_id, deal_type, sale_price_cents, accessories_cents, doc_fee_cents, title_fee_cents, registration_fee_cents, tax_rate_bps, cash_down_cents]
    output: Deal
    side_effects: ["status=DRAFT", "version=1", "computed totals default to 0"]

  - method: GET
    path: "/deals/{id}"
    description: "Get a Deal (deal jacket header with computed gross, taxes, amount financed)"
    roles: [SalesManager, FinanceManager, TitleClerk]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: GET
    path: "/deals"
    description: "List deals; filter by vehicle_id, customer_id, or status"
    roles: [SalesManager, FinanceManager, TitleClerk]
    code: 200
    input: ["vehicle_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Deal[]
    side_effects: []

  - method: POST
    path: "/deals/{id}/desk"
    description: "Desk / re-desk a deal (DRAFT->DESKING, DESKING->DESKING, APPROVED->DESKING); recomputes the quote"
    roles: [SalesManager]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "reserve Vehicle AVAILABLE->ON_DEAL on first desk"
      - "recompute deal_tax, amount_financed, deal_gross, estimated_payment_cents"
      - "from APPROVED: clear approval, SUPERSEDE active FinanceContract"
      - "increments Deal.version by 1 (and Vehicle.version on first reservation)"

  - method: POST
    path: "/deals/{id}/apply-incentive"
    description: "Apply a single OEM incentive/rebate to the deal (eligibility checked)"
    roles: [SalesManager, FinanceManager]
    code: 200
    input: [oem_incentive_id]
    output: Deal
    side_effects:
      - "Deal.applied_incentive_id set, Deal.rebate_cents := incentive.rebate_cents"
      - "recompute amount_financed"
      - "increments Deal.version by 1"

  - method: POST
    path: "/deals/{id}/submit-to-lender"
    description: "Submit a desked FINANCE deal to the lender (DESKING->SUBMITTED_TO_LENDER)"
    roles: [SalesManager]
    code: 200
    input: []
    output: Deal
    side_effects: ["status->SUBMITTED_TO_LENDER", "increments Deal.version by 1"]

  - method: POST
    path: "/deals/{id}/lender-decision"
    description: "Record lender APPROVE (->APPROVED) or DECLINE (->DESKING)"
    roles: [FinanceManager]
    code: 200
    input: [decision, "lender_program_id?"]
    output: Deal
    side_effects:
      - "APPROVE: Deal.approved_lender_program_id set, status->APPROVED"
      - "DECLINE: approval cleared, status->DESKING"
      - "increments Deal.version by 1"

  - method: POST
    path: "/deals/{id}/contract"
    description: "Move an APPROVED deal to CONTRACTED (triggers trade acceptance cascade)"
    roles: [FinanceManager]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "attached APPRAISED TradeIn -> ACCEPTED -> creates RECON USED Vehicle"
      - "increments Deal.version by 1"

  - method: POST
    path: "/deals/{id}/fund"
    description: "Fund a CONTRACTED deal (LTV/PTI gated; OCC on Vehicle); cascades Vehicle SOLD -> FloorPlanLine PAID_OFF -> TitleRegistration PENDING"
    roles: [FinanceManager]
    code: 200
    input: [expected_vehicle_version]
    output: Deal
    side_effects:
      - "status->FUNDED; Vehicle->SOLD; vehicle ACTIVE FloorPlanLine->PAID_OFF; auto-create TitleRegistration(PENDING)"
      - "increments Vehicle.version by 1; increments Deal.version by 1"

  - method: POST
    path: "/deals/{id}/unwind"
    description: "Unwind a FUNDED deal (compensation): reverses fund cascade"
    roles: [FinanceManager]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "status->UNWOUND; Vehicle SOLD->AVAILABLE; PAID_OFF FloorPlanLine->REINSTATED; ACTIVE FinanceContract->CANCELLED; ACCEPTED TradeIn->RELEASED"
      - "increments Vehicle.version by 1; increments Deal.version by 1"

  - method: POST
    path: "/deals/{id}/kill"
    description: "Kill a deal from DRAFT or DESKING (->DEAD)"
    roles: [SalesManager]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "from DESKING: Vehicle ON_DEAL->AVAILABLE; attached APPRAISED TradeIn->RELEASED"
      - "increments Deal.version by 1"

  # ---------------- Deal sub-resources ----------------
  - method: POST
    path: "/deals/{id}/products"
    description: "Attach an F&I product to a deal (price <= max_retail)"
    roles: [FinanceManager]
    code: 201
    input: [finance_product_id, sold_price_cents]
    output: DealProduct
    side_effects:
      - "DealProduct status=ACTIVE, product_cost_cents snapshotted"
      - "recompute Deal amount_financed and deal_gross BACK"
      - "increments Deal.version by 1"

  - method: GET
    path: "/deals/{id}/products"
    description: "List DealProducts for a deal (reverse-reachability for DealProduct.deal_id)"
    roles: [FinanceManager, SalesManager]
    code: 200
    input: []
    output: DealProduct[]
    side_effects: []

  - method: DELETE
    path: "/deals/{id}/products/{deal_product_id}"
    description: "Void an F&I product on a deal during rehash (ACTIVE -> VOID)"
    roles: [FinanceManager]
    code: 200
    input: []
    output: DealProduct
    side_effects:
      - "DealProduct status -> VOID"
      - "recompute Deal amount_financed and deal_gross BACK"
      - "increments Deal.version by 1"

  - method: POST
    path: "/deals/{id}/trade-ins"
    description: "Attach (or replace) a trade-in appraisal on a deal"
    roles: [SalesManager, InventoryClerk]
    code: 201
    input: [vin, acv_cents, allowance_cents, payoff_cents]
    output: TradeIn
    side_effects:
      - "any prior non-RELEASED TradeIn for this deal -> RELEASED (replaced)"
      - "TradeIn status=APPRAISED, gross_equity_cents=allowance_cents-payoff_cents"
      - "recompute Deal trade_allowance_cents, trade_equity_cents, amount_financed, deal_tax"
      - "increments Deal.version by 1"

  - method: GET
    path: "/deals/{id}/trade-ins"
    description: "List trade-ins for a deal (reverse-reachability for TradeIn.deal_id)"
    roles: [SalesManager, InventoryClerk, FinanceManager]
    code: 200
    input: []
    output: TradeIn[]
    side_effects: []

  - method: GET
    path: "/trade-ins/{id}"
    description: "Get a TradeIn"
    roles: [SalesManager, InventoryClerk, FinanceManager]
    code: 200
    input: []
    output: TradeIn
    side_effects: []

  - method: POST
    path: "/deals/{id}/finance-contracts"
    description: "Create a FinanceContract on an APPROVED deal (supersedes prior ACTIVE; OCC on Deal)"
    roles: [FinanceManager]
    code: 201
    input: [lender_program_id, markup_bps, term_months, expected_deal_version]
    output: FinanceContract
    side_effects:
      - "snapshot amount_financed; compute sell_rate_bps, monthly_payment_cents (FINAL), finance_reserve_cents"
      - "prior ACTIVE FinanceContract for this deal -> SUPERSEDED"
      - "recompute Deal deal_gross BACK (adds finance reserve)"
      - "increments Deal.version by 1"

  - method: GET
    path: "/deals/{id}/finance-contracts"
    description: "List FinanceContracts for a deal (reverse-reachability for FinanceContract.deal_id)"
    roles: [FinanceManager, SalesManager]
    code: 200
    input: []
    output: FinanceContract[]
    side_effects: []

  - method: GET
    path: "/finance-contracts/{id}"
    description: "Get a FinanceContract"
    roles: [FinanceManager, SalesManager]
    code: 200
    input: []
    output: FinanceContract
    side_effects: []

  - method: POST
    path: "/deals/{id}/documents"
    description: "Upload a deal jacket document/stipulation"
    roles: [SalesManager, FinanceManager, TitleClerk]
    code: 201
    input: [doc_type, uri]
    output: DealJacketDocument
    side_effects: ["append-only document created"]

  - method: GET
    path: "/deals/{id}/documents"
    description: "List deal jacket documents (reverse-reachability for DealJacketDocument.deal_id)"
    roles: [SalesManager, FinanceManager, TitleClerk]
    code: 200
    input: []
    output: DealJacketDocument[]
    side_effects: []

  # ---------------- TestDrive ----------------
  - method: POST
    path: "/test-drives"
    description: "Book a test drive (license + interval-overlap + buffer checks)"
    roles: [SalesManager, Customer]
    code: 201
    input: [vehicle_id, customer_id, start_at, end_at]
    output: TestDrive
    side_effects: ["status=SCHEDULED", "version=1"]

  - method: GET
    path: "/test-drives/{id}"
    description: "Get a TestDrive"
    roles: [SalesManager, Customer]
    code: 200
    input: []
    output: TestDrive
    side_effects: []

  - method: GET
    path: "/test-drives"
    description: "List test drives; filter by vehicle_id or customer_id"
    roles: [SalesManager, Customer]
    code: 200
    input: ["vehicle_id?", "customer_id?", "limit?", "offset?"]
    output: TestDrive[]
    side_effects: []

  - method: POST
    path: "/test-drives/{id}/complete"
    description: "Complete a test drive"
    roles: [SalesManager]
    code: 200
    input: []
    output: TestDrive
    side_effects: ["status->COMPLETED", "increments TestDrive.version by 1"]

  - method: POST
    path: "/test-drives/{id}/cancel"
    description: "Cancel a test drive (frees the interval)"
    roles: [SalesManager, Customer]
    code: 200
    input: []
    output: TestDrive
    side_effects: ["status->CANCELLED", "increments TestDrive.version by 1"]

  # ---------------- RepairOrder ----------------
  - method: POST
    path: "/repair-orders"
    description: "Open a repair order (bay slot overlap checked)"
    roles: [ServiceAdvisor]
    code: 201
    input: [vehicle_id, deal_id, ro_type, bay, scheduled_start_at, scheduled_end_at, parts_cents, labor_cents]
    output: RepairOrder
    side_effects: ["status=OPEN", "total_cents=parts+labor", "version=1"]

  - method: GET
    path: "/repair-orders/{id}"
    description: "Get a RepairOrder"
    roles: [ServiceAdvisor, FinanceManager, SalesManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: GET
    path: "/repair-orders"
    description: "List repair orders; filter by vehicle_id or deal_id (reverse-reachability for RepairOrder.vehicle_id and RepairOrder.deal_id)"
    roles: [ServiceAdvisor, FinanceManager, SalesManager]
    code: 200
    input: ["vehicle_id?", "deal_id?", "bay?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []

  - method: POST
    path: "/repair-orders/{id}/close"
    description: "Close a repair order"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status->CLOSED", "increments RepairOrder.version by 1"]

  - method: POST
    path: "/repair-orders/{id}/cancel"
    description: "Cancel a repair order (frees the bay)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status->CANCELLED", "increments RepairOrder.version by 1"]

  # ---------------- TitleRegistration ----------------
  - method: GET
    path: "/title-registrations/{id}"
    description: "Get a TitleRegistration"
    roles: [TitleClerk, FinanceManager]
    code: 200
    input: []
    output: TitleRegistration
    side_effects: []

  - method: GET
    path: "/title-registrations"
    description: "List title registrations; filter by deal_id (reverse-reachability for TitleRegistration.deal_id)"
    roles: [TitleClerk, FinanceManager]
    code: 200
    input: ["deal_id?", "status?", "limit?", "offset?"]
    output: TitleRegistration[]
    side_effects: []

  - method: PATCH
    path: "/title-registrations/{id}"
    description: "Set owner/plate details on a PENDING title registration before submission"
    roles: [TitleClerk]
    code: 200
    input: ["owner_name?", "plate_type?"]
    output: TitleRegistration
    side_effects: ["increments TitleRegistration.version by 1"]

  - method: POST
    path: "/title-registrations/{id}/submit"
    description: "Submit title/registration to DMV (PENDING->SUBMITTED or REJECTED->SUBMITTED)"
    roles: [TitleClerk]
    code: 200
    input: []
    output: TitleRegistration
    side_effects: ["status->SUBMITTED; resubmit_count++ when from REJECTED", "increments TitleRegistration.version by 1"]

  - method: POST
    path: "/title-registrations/{id}/dmv-result"
    description: "Record DMV result ACCEPT (->ACCEPTED) or REJECT (->REJECTED)"
    roles: [TitleClerk]
    code: 200
    input: [result, "rejection_reason?"]
    output: TitleRegistration
    side_effects: ["ACCEPT: status->ACCEPTED; REJECT: status->REJECTED, rejection_reason set", "increments TitleRegistration.version by 1"]

  # ---------------- test-driving clock (deterministic time control) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC time (test-driving endpoint for deterministic date math)"
    roles: [InventoryClerk, FinanceManager, SalesManager, ServiceAdvisor, TitleClerk]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects: ["server current_utc set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or Customer acting on another customer's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "A foreign key in the request body references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, VIN not 17 chars, out-of-range number" }
  - { id: ERR_VIN_DUPLICATE, http: 409, condition: "VIN already exists in inventory" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_VEHICLE_NOT_AVAILABLE, http: 409, condition: "Referenced Vehicle is not in the required status for the deal transition" }
  - { id: ERR_DEAL_NOT_FUNDED, http: 409, condition: "TitleRegistration submit attempted while its Deal is not FUNDED" }
  - { id: ERR_TESTDRIVE_OVERLAP, http: 409, condition: "Test-drive interval overlaps another SCHEDULED drive on the same vehicle (incl. turnaround buffer)" }
  - { id: ERR_BAY_OVERLAP, http: 409, condition: "Repair-order bay slot overlaps another OPEN order in the same bay" }
  - { id: ERR_LICENSE_INVALID, http: 409, condition: "Test-drive customer lacks a valid driver license" }
  - { id: ERR_PRODUCT_PRICE_EXCEEDS_MAX, http: 409, condition: "DealProduct sold price exceeds FinanceProduct.max_retail_cents" }
  - { id: ERR_MARKUP_EXCEEDS_MAX, http: 409, condition: "FinanceContract markup exceeds lender max markup or term exceeds max term" }
  - { id: ERR_LTV_EXCEEDED, http: 409, condition: "amount_financed exceeds the LTV cap at fund" }
  - { id: ERR_PTI_EXCEEDED, http: 409, condition: "Monthly payment exceeds the PTI cap at fund" }
  - { id: ERR_LENDER_TIER_MISMATCH, http: 409, condition: "Approved lender program's tier does not match the customer's credit tier" }
  - { id: ERR_DEAL_TYPE_NOT_FINANCE, http: 409, condition: "submit-to-lender attempted on a non-FINANCE deal" }
  - { id: ERR_CREDIT_APP_MISSING, http: 409, condition: "submit-to-lender attempted with no CREDIT_APP document in the jacket" }
  - { id: ERR_STIP_MISSING, http: 409, condition: "Required stipulation document (INSURANCE for contract, ODOMETER for title submit) missing" }
  - { id: ERR_NO_ACTIVE_CONTRACT, http: 409, condition: "contract attempted with no ACTIVE FinanceContract on the deal" }
  - { id: ERR_INCENTIVE_NOT_ELIGIBLE, http: 409, condition: "Requested OEM incentive is not eligible for this deal's vehicle/deal_type (empty eligible set)" }
  - { id: ERR_CURTAILMENT_NOT_DUE, http: 409, condition: "Curtailment requested before the aging threshold (age_days < 90)" }
  - { id: ERR_TITLE_ALREADY_ACCEPTED, http: 409, condition: "Unwind blocked because a TitleRegistration for the deal is ACCEPTED" }
  - { id: ERR_REJECTION_REASON_REQUIRED, http: 422, condition: "DMV REJECT result submitted without a rejection_reason" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: InventoryClerk
    description: "Manages vehicle inventory, floor-plan financing, curtailments, trade acquisition, and reconditioning"
    identity: opaque
    exclusive_operations:
      - "POST /vehicles — create inventory vehicle"
      - "POST /vehicles/{id}/recondition-complete — finish recon"
      - "POST /vehicles/{id}/floor-plan-lines — floor a vehicle"
      - "POST /floor-plan-lines/{id}/curtailments — record curtailment"
    shared_operations:
      - "POST /deals/{id}/trade-ins — attach a trade-in (with SalesManager)"
      - "GET vehicles, floor-plan-lines, trade-ins, repair-orders"

  - name: SalesManager
    description: "Owns the desking side: customers, deals, desking, incentives, lender submission, test drives"
    identity: opaque
    exclusive_operations:
      - "POST /customers — create customer"
      - "POST /deals — create deal"
      - "POST /deals/{id}/desk — desk/re-desk"
      - "POST /deals/{id}/submit-to-lender — submit to lender"
      - "POST /deals/{id}/kill — kill deal"
      - "POST /test-drives/{id}/complete — complete test drive"
    shared_operations:
      - "POST /deals/{id}/apply-incentive (with FinanceManager)"
      - "POST /oem-incentives (with FinanceManager)"
      - "POST /deals/{id}/trade-ins (with InventoryClerk)"
      - "POST /test-drives, /cancel (with Customer)"
      - "POST /deals/{id}/documents (with FinanceManager, TitleClerk)"

  - name: FinanceManager
    description: "Owns F&I: lender programs, finance products, finance contracts, lender decisions, contracting, funding, unwind"
    identity: opaque
    exclusive_operations:
      - "POST /lender-programs, /finance-products — config"
      - "POST /deals/{id}/lender-decision — approve/decline"
      - "POST /deals/{id}/contract — contract"
      - "POST /deals/{id}/fund — fund"
      - "POST /deals/{id}/unwind — unwind"
      - "POST /deals/{id}/finance-contracts — create finance contract"
      - "POST /deals/{id}/products, DELETE /deals/{id}/products/{id} — F&I products"
    shared_operations:
      - "POST /deals/{id}/apply-incentive (with SalesManager)"
      - "POST /oem-incentives (with SalesManager)"
      - "POST /deals/{id}/documents (with SalesManager, TitleClerk)"

  - name: ServiceAdvisor
    description: "Owns service/parts repair orders linked to vehicles and deals"
    identity: opaque
    exclusive_operations:
      - "POST /repair-orders — open RO"
      - "POST /repair-orders/{id}/close — close RO"
      - "POST /repair-orders/{id}/cancel — cancel RO"

  - name: TitleClerk
    description: "Owns DMV title and registration submission for funded deals"
    identity: opaque
    exclusive_operations:
      - "PATCH /title-registrations/{id} — set owner/plate"
      - "POST /title-registrations/{id}/submit — submit to DMV"
      - "POST /title-registrations/{id}/dmv-result — record DMV result"
    shared_operations:
      - "POST /deals/{id}/documents (with SalesManager, FinanceManager)"

  - name: Customer
    description: "End buyer; may book and cancel their own test drives and read their own record"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /test-drives — book own test drive (customer_id must equal X-User-ID)"
      - "POST /test-drives/{id}/cancel — cancel own test drive"
      - "GET /customers/{id} — read own record"
      - "GET /test-drives — list own test drives"
