              captures: { o1: $.data.id }
            - { call: "POST /dairy/orders/${o1}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 5 }], delivery_window_start: "2026-08-10T08:45:00Z", delivery_window_end: "2026-08-10T09:15:00Z" }
              as: DistributorOwner
