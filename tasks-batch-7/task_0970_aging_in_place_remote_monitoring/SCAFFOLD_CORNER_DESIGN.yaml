      - name: stale_version_error_excluded_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: cross-cutting OCC instances occ_med_schedule_stale_version_rejected / occ_report_regenerate_stale_version_rejected in this file's cross_cutting_complexity_layers section
