  - method: GET
    path: "/district-energy/load-forecasts/{forecast_id}"
    description: "Read one load forecast including its published determinants."
    roles: [SystemController, DispatchOperator, NetworkEngineer, BillingAnalyst]
    code: 200
    input: []
    output: LoadForecast
    side_effects: []
  - method: GET
    path: "/district-energy/load-forecasts"
    description: "List load forecasts, filterable by loop and lifecycle state."
    roles: [SystemController, DispatchOperator, NetworkEngineer, BillingAnalyst]
