              as: Member
              as_user_id: "${m1_id}"
              captures: { bk_id: "$.data.id" }
          trigger:
            - call: "GET /award-bookings/${bk_id}"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /award-bookings/${bk_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          assert:
