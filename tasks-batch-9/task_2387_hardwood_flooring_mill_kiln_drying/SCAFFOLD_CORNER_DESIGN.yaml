            - "First start: status 200 with data.status == \"RUNNING\"; the lot is GRADED and the posture OPEN."
            - "Second start: status 409 with data.error_id == \"ERR_PREFINISH_RUN_STATE_INVALID\" - start is not idempotent."
            - "The run kept coating_liters == 47.85 from creation across all four calls."

      - name: claim_denied_leaves_reserve_untouched
        claim_type: side_effect_execution
        grounds: ["state_machines.WarrantyClaim.transitions.SUBMITTED_to_DENIED", "calculations.warranty_reserve_conservation"]
        distinguishing_aspect: "A DENIED adjudication records the reason and the adjudicator, but the declared side effect explicitly leaves the reserve alone: balance stays 600000 and committed stays 0."
        test_recipe:
          setup: ["A SOLID line funded with 600000 cents and one SUBMITTED claim for 240 sq ft filed by u_intake."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "GAPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "DENIED", adjudicated_affected_sf: 210, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62, denial_reason: "Subfloor moisture 10.5 pct far above the 7.0 pct install spec" }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
            - { call: "POST /mill/warranty-claims/${claim_id}/reverse", payload: { reversal_reason: "Attempt to reverse a denial" }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          assert:
            - "adjudicate DENIED: status 200 with data.adjudication_status == \"DENIED\", data.denial_reason set and data.adjudicated_by_user_id == \"u_adjudicator\"."
            - "data.estimated_liability_cents == 355104 was computed at intake and is unchanged by the denial."
            - "GET /mill/product-lines/{line_id} shows warranty_balance_cents == 600000, warranty_committed_cents == 0 and posture == \"OPEN\"."
            - "reverse on a DENIED claim: status 409 with data.error_id == \"ERR_CLAIM_STATE_INVALID\" - DENIED is terminal."
            - "data.remediation_status is still \"NOT_STARTED\": the denial touched only the adjudication dimension."

      - name: remediation_start_requires_approved_adjudication
        claim_type: precondition_enforcement
        grounds: ["state_machines.WarrantyClaim.transitions.NOT_STARTED_to_IN_PROGRESS.preconditions", "errors[ERR_CLAIM_STATE_INVALID]"]
        distinguishing_aspect: "The remediation dimension is gated on the adjudication dimension: start_remediation on a SUBMITTED claim is refused, and works only after approval."
        test_recipe:
          setup: ["A SOLID line funded with 600000 cents and one SUBMITTED claim for 240 sq ft filed by u_intake."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/start_remediation", payload: {}, as: MillSupervisor }
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 210, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
            - { call: "POST /mill/warranty-claims/${claim_id}/start_remediation", payload: {}, as: MillSupervisor }
            - { call: "POST /mill/warranty-claims/${claim_id}/complete_remediation", payload: {}, as: MillSupervisor }
          assert:
            - "First start_remediation: status 409 with data.error_id == \"ERR_CLAIM_STATE_INVALID\"; remediation_status stays \"NOT_STARTED\"."
            - "adjudicate APPROVED: status 200 with data.adjudicated_liability_cents == 151474 and data.remediation_status still \"NOT_STARTED\"."
            - "Second start_remediation: status 200 with data.remediation_status == \"IN_PROGRESS\" and adjudication_status unchanged at \"APPROVED\"."
            - "complete_remediation: status 200 with data.remediation_status == \"COMPLETED\"."
            - "A reverse after completion is refused: the APPROVED -> REVERSED transition requires remediation_status != COMPLETED."

      - name: claim_resubmit_recomputes_estimated_liability_and_clears_note
        claim_type: valid_transition
        grounds: ["state_machines.WarrantyClaim.transitions.INFO_REQUESTED_to_SUBMITTED", "calculations.warranty_liability_dual_variant"]
        distinguishing_aspect: "The SUBMITTED -> INFO_REQUESTED -> SUBMITTED cycle overwrites the claimant figures, recomputes the estimated variant from 355104 to 251529 and clears the note."
        test_recipe:
          setup: ["A SOLID line (material 895 c/sf) with one SUBMITTED claim for 240 sq ft, then moved to INFO_REQUESTED."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims/${claim_id}/request_info", payload: { info_request_note: "Send the subfloor moisture log" }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/resubmit", payload: { affected_square_feet: 170, subfloor_moisture_pct_at_install: 9.0, ambient_rh_pct_at_install: 45 }, as: WarrantyAdjudicator, as_user_id: "u_intake" }
          assert:
            - "The claim had adjudication_status \"INFO_REQUESTED\" and info_request_note \"Send the subfloor moisture log\" before the trigger."
            - "Response status 200 with data.adjudication_status == \"SUBMITTED\" and data.info_request_note == null."
            - "data.affected_square_feet == 170, data.subfloor_moisture_pct_at_install == 9.0, data.ambient_rh_pct_at_install == 45."
            - "data.estimated_liability_cents == 251529: base 170 * 1370 = 232900, admin 8 pct = 18632, total 251529 (recomputed, not the original 355104)."
            - "data.submitted_by_user_id is still \"u_intake\" and the reserve is untouched at balance 600000."

