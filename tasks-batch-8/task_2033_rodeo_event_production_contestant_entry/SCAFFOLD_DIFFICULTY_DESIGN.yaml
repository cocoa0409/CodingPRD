  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_requires_rodeo_entries_open
        grounds: [state_machines.Rodeo.DRAFT_to_ENTRIES_OPEN, "validations[priority=7]", "errors[ERR_RODEO_NOT_OPEN]"]
        distinguishing_aspect: "Entry -> Rodeo pair: POST /api/entries is rejected with ERR_RODEO_NOT_OPEN while the parent Rodeo is DRAFT and accepted once the rodeo transitions to ENTRIES_OPEN, with no change to the entry payload."
        test_recipe:
          setup:
            - "Rodeo DRAFT with one BAREBACK event and one performance; contestant registered; logical clock before entries_close_at"
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "Bozeman Stampede", city: "Bozeman", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/rodeo-events", payload: { rodeo_id: "${r_id}", event_code: BAREBACK, go_rounds: 1, entry_fee_cents: 2000, added_money_cents: 0, per_performance_slots: 10, payout_places: 1 }, as: CommitteeAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Friday", arena: "Main", starts_at: "2026-08-14T19:00:00Z", ends_at: "2026-08-14T22:00:00Z", arena_capacity: 300 }, as: CommitteeAdmin }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-121", full_name: "Rider T" }, as: EntryOffice, captures: { c_t: $.data.id } }
          trigger:
            - { call: "POST /api/entries", payload: { contestant_id: "${c_t}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { err: $.data.error_id } }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: OPEN_ENTRIES }, as: CommitteeAdmin }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_t}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_t: $.data.id } }
          assert:
            - "First POST /api/entries returns ERR_RODEO_NOT_OPEN (409) while Rodeo.posture == DRAFT"
            - "After OPEN_ENTRIES, the identical request succeeds 201 with Entry ${e_t}.status == ENTERED"

