              captures: { ok_first_id: "$.data[0].id" }
          assert:
            - "Trigger step 1 returns HTTP 422 with error_id == ERR_VALIDATION (limit 101 > max 100)"
            - "Trigger step 2 returns HTTP 422 with error_id == ERR_VALIDATION (limit 0 < min 1)"
            - "Trigger step 3 returns HTTP 200 with exactly 1 row, total_count == 1, has_more == false, ${ok_first_id} == ${fac_a_id}"

      - name: service_events_are_append_only_with_no_update_or_version_field
        claim_type: immutability
        grounds:
          - entities.ServiceEvent
          - endpoints[GET /capital/assets/{id}/service-events]
        distinguishing_aspect: >-
          ServiceEvent declares common_fields false: §1.5 exposes only a POST and a GET for it (no PATCH
          and no DELETE), and the returned rows carry no version and no updated_at — the audit trail is
          append-only, which is why a correction is modelled as a further event.
        test_recipe:
          setup:
            - "Fixture F0 asset AC plus two service events: a PM on 2026-05-01 with downtime 1.00 and a CORRECTIVE on 2026-06-01 with downtime 3.00."
            - "After both appends: corrective_count_24m 1, downtime_hours_24m 4.00, service_penalty_points 3.00 + 2.00 = 5.00, adjusted 20.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-8", install_date: "2020-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_ac_id: $.data.id }
            - call: "POST /capital/assets/${asset_ac_id}/service-events"
              payload: { event_date: "2026-05-01T00:00:00Z", category: "PM", downtime_hours: 1.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { ev_pm_id: $.data.id }
            - call: "POST /capital/assets/${asset_ac_id}/service-events"
              payload: { event_date: "2026-06-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 3.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { ev_corr_id: $.data.id }
          trigger:
            - call: "GET /capital/assets/${asset_ac_id}/service-events"
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { first_event_id: "$.data[0].id", second_event_id: "$.data[1].id" }
          assert:
            - "HTTP 200 with exactly 2 rows in created_at ASC order: ${first_event_id} == ${ev_pm_id}, ${second_event_id} == ${ev_corr_id}"
            - "Neither row exposes a version or an updated_at field, and §1.5 declares no PATCH or DELETE for ServiceEvent"
            - "EquipmentAsset.${asset_ac_id}.corrective_count_24m == 1, downtime_hours_24m == 4.00, service_penalty_points == 5.00, adjusted_ruls_score == 20.00, version == 3"
            - "GET /capital/assets/${asset_ac_id}/service-events?category=CORRECTIVE returns exactly 1 row whose id == ${ev_corr_id}"

      - name: create_department_under_unknown_facility_returns_facility_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=22]
          - entities.Department.fields.facility_id
          - errors.ERR_FACILITY_NOT_FOUND
        distinguishing_aspect: >-
          Department's parent FK is validated at priority 22 (existence) BEFORE any shape rule, so an
          absent facility_id yields ERR_FACILITY_NOT_FOUND at 404 — not ERR_VALIDATION at 422.
        test_recipe:
          setup:
            - "Empty DB apart from the clock call: no Facility row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
          trigger:
            - call: "POST /capital/departments"
              payload: { facility_id: "00000000-0000-4000-8000-000000000000", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { e_parent: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_FACILITY_NOT_FOUND"
            - "GET /capital/departments returns 0 rows"

      - name: asset_facility_must_equal_owning_department_facility
        claim_type: parent_relationships
        grounds:
          - validations[priority=45]
          - entities.EquipmentAsset.fields.facility_id
          - errors.ERR_ASSET_FACILITY_MISMATCH
        distinguishing_aspect: >-
          The entity graph is not a tree: EquipmentAsset carries BOTH facility_id and department_id, and
          V10 rejects the cross-reference when they disagree (422 ERR_ASSET_FACILITY_MISMATCH) even
          though both FKs resolve to real rows.
        test_recipe:
          setup:
            - "Two facilities NRH and SCH; department DEPT-A1 belongs to NRH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/facilities"
              payload: { name: "South Community Hospital", code: "SCH", region: "SOUTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_b_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
          trigger:
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_b_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-8", install_date: "2020-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { e_mismatch: $.data.error_id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-8", install_date: "2020-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_ac_id: $.data.id }
          assert:
            - "Trigger step 1 returns HTTP 422 with error_id == ERR_ASSET_FACILITY_MISMATCH (both FKs exist; only their relationship is wrong)"
            - "After step 1: Facility.${fac_b_id}.active_asset_count == 0 and Facility.${fac_a_id}.active_asset_count == 0"
            - "Trigger step 2 succeeds with data.adjusted_ruls_score == 25.00 and Facility.${fac_a_id}.active_asset_count == 1"

  # =========================================================================
  # 2. From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:
      - name: capital_cycle_is_created_in_draft_with_every_aggregate_zeroed
        claim_type: initial_state
        grounds:
          - state_machines.CapitalCycle.initial_state
          - endpoints[POST /capital/cycles]
        distinguishing_aspect: >-
          A new cycle is DRAFT with allocation_method null, allocated_by_user_id null and all seven
          allocation aggregates at 0 — none of them is derived from total_capital_cents until an
          allocation run happens.
        test_recipe:
          setup:
            - "Empty DB apart from the clock call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
          trigger:
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.10, facility_contingency_pct: 0.05 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c_id: $.data.id }
          assert:
            - "HTTP 201 with data.status == DRAFT and data.version == 1"
            - "data.allocation_method == null and data.allocated_by_user_id == null"
            - "data.system_contingency_cents == 0, data.distributable_cents == 0, data.unallocated_cents == 0, data.contingency_drawn_cents == 0"
            - "data.allocation_count == 0, data.exhausted_allocation_count == 0, data.scored_count == 0, data.expedited_count == 0"
            - "The 0.10 contingency is NOT materialised at creation: system_contingency_cents stays 0 until POST /capital/cycles/{id}/allocate runs step 3"

      - name: asset_created_at_or_below_the_derate_floor_is_born_derated
        claim_type: initial_state
        grounds:
          - state_machines.EquipmentAsset.initial_state
          - calculations.asset_ruls_score.formula
          - endpoints[POST /capital/assets]
        distinguishing_aspect: >-
          EquipmentAsset's nominal initial state is IN_SERVICE, but the derate gate (step 9) runs BEFORE
          the row is written, so an asset whose adjusted score is 12.50 is created directly in DERATED
          with no service event and no transition call.
        test_recipe:
          setup:
            - "Facility NRH and department DEPT-A1 exist; the asset is 2556 days old against an 8-year life."
            - "age_years = round_half_up(2556/365, 2) = 7.00 -> nominal = (8 - 7.00)/8 * 100 = 12.50; no penalties -> adjusted 12.50 <= 15.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
          trigger:
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-1", install_date: "2019-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_old_id: $.data.id }
          assert:
            - "HTTP 201 with data.age_years == 7.00, data.nominal_ruls_score == 12.50, data.adjusted_ruls_score == 12.50"
            - "data.status == DERATED (born derated, not IN_SERVICE) and data.version == 1"
            - "data.service_penalty_points == 0.00, data.unresolved_recall == false, data.disposition_status == NONE"
            - "GET /capital/assets?status=DERATED returns exactly one row whose id == ${asset_old_id}"

      - name: second_open_intake_on_an_already_open_cycle_is_rejected_not_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.CapitalCycle.transitions[DRAFT->INTAKE_OPEN]
          - validations[priority=50]
          - errors.ERR_CYCLE_INVALID_STATE
        distinguishing_aspect: >-
          open-intake is NOT idempotent: a repeat call on an INTAKE_OPEN cycle is a V14 state fault at
          409, and crucially the cycle version does not advance a second time (it stays 2, so a later
          allocate's expected_cycle_version arithmetic is unaffected).
        test_recipe:
          setup:
            - "A cycle exists and has been opened once (version 2, status INTAKE_OPEN)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.00, facility_contingency_pct: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c_id: $.data.id }
            - call: "POST /capital/cycles/${c_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
          trigger:
            - call: "POST /capital/cycles/${c_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { e_cycle_state: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_CYCLE_INVALID_STATE"
            - "GET /capital/cycles/${c_id} still shows status == INTAKE_OPEN with version == 2 (the failed call wrote nothing)"

      - name: screen_return_forks_the_request_and_the_next_patch_bumps_revision_count
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReplacementRequest.transitions[SUBMITTED->RETURNED]
          - state_machines.ReplacementRequest.transitions[RETURNED->DRAFT]
          - endpoints[POST /capital/requests/{id}/screen]
        distinguishing_aspect: >-
          The two counters are driven by different calls: screen RETURN increments return_count only,
          and the following PATCH moves RETURNED -> DRAFT while incrementing revision_count only. A
          PATCH of an already-DRAFT request increments neither.
        test_recipe:
          setup:
            - "Fixture F0 through a SUBMITTED request in an INTAKE_OPEN cycle (request version 2 after submit)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-8", install_date: "2020-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_ac_id: $.data.id }
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.00, facility_contingency_pct: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c_id: $.data.id }
            - call: "POST /capital/cycles/${c_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c_id}", department_id: "${dept_a1_id}", asset_id: "${asset_ac_id}", clinical_justification: "CT replacement, ageing detector array.", current_annual_volume: 1000, projected_annual_volume: 2000, estimated_capital_cents: 100000000, annual_service_contract_cents: 10000000, disposable_unit_cents: 500 }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /capital/requests/${r_id}/submit"
              payload: {}
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
          trigger:
            - call: "POST /capital/requests/${r_id}/screen"
              payload: { decision: "RETURN", screening_note: "Add the volume evidence and the room survey." }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "PATCH /capital/requests/${r_id}"
              payload: { clinical_justification: "CT replacement with attached room survey and referral trend." }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
            - call: "PATCH /capital/requests/${r_id}"
              payload: { current_annual_volume: 1100 }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
          assert:
            - "Trigger step 1: HTTP 200 with data.status == RETURNED, data.return_count == 1, data.revision_count == 0, data.version == 3"
            - "Trigger step 2: HTTP 200 with data.status == DRAFT, data.revision_count == 1, data.return_count == 1, data.version == 4"
            - "Trigger step 3 (PATCH of an already-DRAFT request): data.status == DRAFT, data.revision_count STAYS 1, data.version == 5"
            - "budgetary_tco_cents == 160106313 from the earlier submit is unchanged by either PATCH (the TCO re-runs only on submit)"

      - name: commit_defers_every_remaining_scored_request_in_created_at_order
        claim_type: side_effect_execution
        grounds:
          - state_machines.CapitalCycle.transitions[ALLOCATED->COMMITTED]
          - state_machines.ReplacementRequest.transitions[SCORED->DEFERRED]
          - endpoints[POST /capital/cycles/{id}/commit]
        distinguishing_aspect: >-
          commit is a fan-out: one call moves the cycle to COMMITTED and sweeps EVERY still-SCORED
          request to DEFERRED in created_at ASC order, while the FacilityAllocation rows are left
          untouched (posture ACTIVE, committed_cents 0) — deferral does not release capital because none
          was ever committed.
