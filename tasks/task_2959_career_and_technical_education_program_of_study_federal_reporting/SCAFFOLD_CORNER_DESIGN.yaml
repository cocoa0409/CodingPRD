  - section: cross_cutting_complexity_layers
    instances:

      - name: both_declared_occ_guards_refuse_a_stale_parent_version_and_accept_the_current_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[committee-create-stale-program]
          - concurrency_rules[expenditure-create-stale-grant]
          - errors[ERR_STALE_PROGRAM_VERSION]
          - errors[ERR_STALE_GRANT_VERSION]
          - validations[priority=8]
        distinguishing_aspect: |
          Both declared concurrency rules are exercised on their own write_endpoint with their own occ_field, and each is
          driven with a version that went stale for a DIFFERENT reason: the program version is advanced by an unrelated
          PATCH, while the grant version is advanced by the client's own previous successful expenditure create. That
          second case is the one an implementation gets wrong, because the caller never issued an unrelated write — it
          simply reused the version it already held. Both guards must also accept the refreshed version immediately
          afterwards, and neither refusal may create a row.
        test_recipe:
          setup:
            - "One DRAFT ProgramOfStudy with no committee, and one GrantAward for fiscal_year 2027 with allocation_cents 5000000."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0601", title: "Dental Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/grant-awards"
              payload: { fiscal_year: 2027, allocation_cents: 5000000, obligation_window_start: "2026-07-01", obligation_window_end: "2027-06-30" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { grant_id: $.data.id }
          trigger:
            - call: "GET /cte/programs-of-study/${pos_id}"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pv1: $.data.version }
            - call: "PATCH /cte/programs-of-study/${pos_id}"
              payload: { cluster: "HEALTH_SCIENCE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pv2: $.data.version }
            - call: "POST /cte/programs-of-study/${pos_id}/advisory-committees"
              payload: { name: "Dental Advisory Committee", quorum_min_members: 3, employer_seat_min: 2, expected_program_of_study_version: "${pv1}" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study/${pos_id}/advisory-committees"
              payload: { name: "Dental Advisory Committee", quorum_min_members: 3, employer_seat_min: 2, expected_program_of_study_version: "${pv2}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { cmte_id: $.data.id, cmte_st: $.data.status }
            - call: "GET /cte/grant-awards/${grant_id}"
              payload: {}
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { gv1: $.data.version }
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "CONSUMABLE", description: "First request", unit_cost_cents: 100000, quantity: 1, service_period_start: "2026-09-01", service_period_end: "2026-09-30", expected_grant_award_version: "${gv1}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { x1_id: $.data.id }
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "CONSUMABLE", description: "Second request on a stale view", unit_cost_cents: 100000, quantity: 1, service_period_start: "2026-09-01", service_period_end: "2026-09-30", expected_grant_award_version: "${gv1}" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "GET /cte/grant-awards/${grant_id}"
              payload: {}
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { gv2: $.data.version }
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "CONSUMABLE", description: "Second request refreshed", unit_cost_cents: 100000, quantity: 1, service_period_start: "2026-09-01", service_period_end: "2026-09-30", expected_grant_award_version: "${gv2}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { x2_id: $.data.id }
          assert:
            - "${pv2} == ${pv1} plus 1"
            - "the committee create carrying ${pv1} returns error_id == ERR_STALE_PROGRAM_VERSION with HTTP status 412"
            - "${cmte_id} is non-null and ${cmte_st} == FORMING"
            - "GET /cte/programs-of-study/${pos_id}/advisory-committees reports total_count == 1"
            - "${x1_id} is non-null"
            - "the second expenditure create carrying the reused ${gv1} returns error_id == ERR_STALE_GRANT_VERSION with HTTP status 412"
            - "${gv2} == ${gv1} plus 1"
