        assert: ['HTTP 409 with ${err_store} == ''ERR_STORE_NUMBER_TAKEN''', 'HTTP 409 with ${err_lic} == ''ERR_LICENSE_NUMBER_TAKEN''', 'GET /store-ops/drivers?store_id=${store_id} reports total_count 1, only the original driver existing']
    - name: address_creation_with_only_a_draft_zone_version_is_rejected
      claim_type: violation_to_error
      grounds: [validations.priority_17, errors.ERR_NO_ACTIVE_ZONE_VERSION, entities.ServiceAddress.fields.evaluated_zone_version_number]
      distinguishing_aspect: 'A DRAFT zone version is not in force: with the polygon published but never activated there is nothing to classify against, so address creation fails with ERR_NO_ACTIVE_ZONE_VERSION (409) instead of silently producing an unclassified address.'
