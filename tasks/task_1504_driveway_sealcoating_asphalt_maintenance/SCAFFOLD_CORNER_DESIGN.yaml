          setup: ["Two properties of one customer; SUBMITTED assessment belongs to property A"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
