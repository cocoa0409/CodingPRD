# =============================================================================
# Task 1810: ALM & Interest Rate Risk — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 rules x 2 instances. All literals precomputed.
# Fixture "Book1": curve 400bps; L1 LOAN 100,000,000@600 runoff20 prepay dur3.0;
# S1 SECURITY 50,000,000@400 runoff0 dur4.0; D1 DEPOSIT RETAIL_NONMATURITY
# 80,000,000@50 dur0.5; B1 BORROWING 40,000,000@450 runoff25 dur2.0.
# Sets: PREPAY {base_cpr 10.0, sens 2.0}; DECAY {base 5.0, surge 1.0};
# BETA {up 40, down 20, lag 6}. Default logical clock 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: nii_static_vs_dynamic_same_book_diverge
        grounds:
          - calculations.nii_projection
        distinguishing_aspect: |
          Same book, scenario, and assumption sets: balance_sheet_convention
          STATIC yields nii_delta_pct -4.57 while DYNAMIC (growth 5%) yields
          -3.55 — two valid conventions over the SAME SimulationRun entity
          domain produce different numbers; this instance is the SimulationRun
          domain member of the rule (the other is hedge effectiveness).
        test_recipe:
          setup:
            - "Book1 ACTIVE with 4 positions; all three assumption sets APPROVED; scenario SHOCK +200 ACTIVE; no policy limits"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: SECURITY, balance_cents: 50000000, rate_bps: 400, scheduled_runoff_pct: 0.0, duration_years: 4.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: BORROWING, balance_cents: 40000000, rate_bps: 450, scheduled_runoff_pct: 25.0, duration_years: 2.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }, as: TreasuryAnalyst, captures: { run_s: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv2: $.data.version } }
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: DYNAMIC, annual_growth_pct: 5.0, expected_book_version: "${bv2}" }, as: TreasuryAnalyst, captures: { run_d: $.data.id } }
          assert:
            - "SimulationRun.${run_s}.nii_base_cents == 5250000"
            - "SimulationRun.${run_s}.nii_scenario_cents == 5010000"
            - "SimulationRun.${run_s}.nii_delta_pct == -4.57"
            - "SimulationRun.${run_d}.nii_base_cents == 5533500"
            - "SimulationRun.${run_d}.nii_scenario_cents == 5336940"
            - "SimulationRun.${run_d}.nii_delta_pct == -3.55"
            - "SimulationRun.${run_s}.nii_delta_pct != SimulationRun.${run_d}.nii_delta_pct"

      - name: hedge_effectiveness_method_divergence
        grounds:
          - calculations.hedge_effectiveness_result
          - state_machines.HedgeRelationship.ACTIVE_to_DEDESIGNATED
        distinguishing_aspect: |
          Identical test payload (hedge +4,500,000 vs hedged -5,000,000,
          slope 1.30, r_squared 0.85, samples 24): DOLLAR_OFFSET computes
          offset_ratio 0.9000 -> PASS and the hedge stays ACTIVE; REGRESSION
          rejects slope 1.30 > 1.25 -> FAIL and its hedge is auto-DEDESIGNATED.
          Entity domain HedgeRelationship/HedgeEffectivenessTest, distinct from
          the SimulationRun domain of the sibling instance.
        test_recipe:
          setup:
            - "Book1 ACTIVE (min_hedged_notional 0); H_DO ACTIVE DOLLAR_OFFSET [2026-08,2027-08) notional 60,000,000 on L1; H_RG ACTIVE REGRESSION [2027-08,2028-08) notional 30,000,000 on L1; clock advanced to 2027-08-01"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 60000000, fixed_rate_bps: 350 }, as: TreasuryAnalyst, captures: { hdo: $.data.id } }
            - { call: "POST /hedges/${hdo}/designate", payload: { start_month: "2026-08", end_month: "2027-08", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /hedges/${hdo}/activate", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: RECEIVER_SWAP, designation_type: CASH_FLOW, notional_cents: 30000000, fixed_rate_bps: 300 }, as: TreasuryAnalyst, captures: { hrg: $.data.id } }
            - { call: "POST /hedges/${hrg}/designate", payload: { start_month: "2027-08", end_month: "2028-08", effectiveness_method: REGRESSION }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /hedges/${hrg}/activate", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          trigger:
            - { call: "POST /hedges/${hdo}/effectiveness-tests", payload: { test_month: "2027-08", hedge_value_change_cents: 4500000, hedged_item_value_change_cents: -5000000, slope: 1.30, r_squared: 0.85, sample_count: 24 }, as: ModelRiskValidator, captures: { t_do: $.data.id } }
            - { call: "POST /hedges/${hrg}/effectiveness-tests", payload: { test_month: "2027-08", hedge_value_change_cents: 4500000, hedged_item_value_change_cents: -5000000, slope: 1.30, r_squared: 0.85, sample_count: 24 }, as: ModelRiskValidator, captures: { t_rg: $.data.id } }
          assert:
            - "HedgeEffectivenessTest.${t_do}.offset_ratio == 0.9000"
            - "HedgeEffectivenessTest.${t_do}.result == PASS"
            - "HedgeEffectivenessTest.${t_rg}.result == FAIL"
            - "HedgeRelationship.${hdo}.status == ACTIVE"
            - "HedgeRelationship.${hrg}.status == DEDESIGNATED"

  - rule_id: combinatorial_formula
    instances:
      - name: deposit_beta_asymmetric_and_ramp_lagged
        grounds:
          - calculations.effective_deposit_rate_bps
          - calculations.scenario_year1_rate_delta
        distinguishing_aspect: |
          Mode (a) combinatorial: the deposit rate formula branches on rate
          direction (up_beta vs down_beta) AND on scenario kind (RAMP applies
          lag pass-through (12-6)/12 = 0.5 while SHOCK passes through 1.0).
          +200 shock: D1 rate 130bps, expense 1,040,000; -200 shock: rate 10bps,
          expense 80,000; RAMP +300/12 (year-1 avg delta 150, half passed):
          rate 80bps, expense 640,000 — three branches, one formula.
        test_recipe:
          setup:
            - "Book1 ACTIVE with 4 positions; sets APPROVED; scenarios UP200, DN200, RAMP300/12 ACTIVE; no policy limits"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: SECURITY, balance_cents: 50000000, rate_bps: 400, scheduled_runoff_pct: 0.0, duration_years: 4.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: BORROWING, balance_cents: 40000000, rate_bps: 450, scheduled_runoff_pct: 25.0, duration_years: 2.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { scu: $.data.id } }
            - { call: "POST /books/${b}/scenarios", payload: { name: "DN200", kind: PARALLEL_SHOCK, shock_bps: -200 }, as: TreasuryAnalyst, captures: { scd: $.data.id } }
            - { call: "POST /books/${b}/scenarios", payload: { name: "RAMP300", kind: RAMP, ramp_total_bps: 300, ramp_months: 12 }, as: TreasuryAnalyst, captures: { scr: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv0: $.data.version } }
          trigger:
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${scu}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv0}" }, as: TreasuryAnalyst, captures: { ru: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv1: $.data.version } }
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${scd}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv1}" }, as: TreasuryAnalyst, captures: { rd: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv2: $.data.version } }
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${scr}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv2}" }, as: TreasuryAnalyst, captures: { rr: $.data.id } }
          assert:
            - "SimulationRun.${ru}.nii_scenario_cents == 5010000"
            - "SimulationRun.${rd}.nii_scenario_cents == 5010000"
            - "SimulationRun.${rr}.nii_scenario_cents == 5310000"
            - "SimulationRun.${rr}.nii_delta_pct == 1.14"
            - "SimulationRun.${rr}.eve_scenario_cents == 18600000"

      - name: nii_per_position_rounding_order_pinned
        grounds:
          - calculations.nii_projection
        distinguishing_aspect: |
          Mode (b) nested rounding: interest is rounded to integer cents PER
          POSITION then summed. Book2 has two loans of 10,000,050c @333bps
          (333,001.665c each unrounded): pinned order yields 2 x 333,002 =
          666,004; sum-then-round would yield 666,003. The 1-cent divergence
          pins the order — distinct mode from the sibling's branch formula.
        test_recipe:
          setup:
            - "Book2 (curve 400) ACTIVE: two LOAN positions 10,000,050c @333bps runoff 0 dur 1.0, one RETAIL_NONMATURITY deposit 100,000c @10bps dur 0.5; zero-valued assumption sets APPROVED (beta up 40/down 20/lag 6); scenario UP200 ACTIVE"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book R", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 10000050, rate_bps: 333, scheduled_runoff_pct: 0.0, duration_years: 1.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 10000050, rate_bps: 333, scheduled_runoff_pct: 0.0, duration_years: 1.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 100000, rate_bps: 10, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 0.0, prepay_sensitivity_per_100bps: 0.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 0.0, surge_decay_per_100bps: 0.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }, as: TreasuryAnalyst, captures: { run: $.data.id } }
          assert:
            - "SimulationRun.${run}.nii_base_cents == 665904"
            - "SimulationRun.${run}.nii_scenario_cents == 665104"

  - rule_id: non_linear_state_machine
    instances:
      - name: assumption_set_revision_cycle
        grounds:
          - state_machines.AssumptionSet.SUBMITTED_to_DRAFT
          - state_machines.AssumptionSet.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          AssumptionSet supports a revision CYCLE (DRAFT -> SUBMITTED -> DRAFT
          -> SUBMITTED -> APPROVED) on entity AssumptionSet; the sibling
          instance exercises BRANCHING on LimitBreach — different entities,
          different non-linear shapes.
        test_recipe:
          setup:
            - "Book exists; PREPAYMENT set created by an-1 in DRAFT"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /assumption-sets/${s}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${s}/reject", payload: { reason: "CPR too low" }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "PATCH /assumption-sets/${s}", payload: { params: { base_cpr_pct: 12.0, prepay_sensitivity_per_100bps: 2.5 } }, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${s}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${s}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          assert:
            - "AssumptionSet.${s}.status == APPROVED"
            - "AssumptionSet.${s}.version == 6"
            - "AssumptionSet.${s}.created_by_user_id == an-1"
            - "AssumptionSet.${s}.approved_by_user_id == ch-1"

      - name: limit_breach_fork_escalation_and_remediation
        grounds:
          - state_machines.LimitBreach.OPEN_to_ESCALATED
          - state_machines.LimitBreach.OPEN_to_ACKNOWLEDGED
          - state_machines.LimitBreach.ACKNOWLEDGED_to_REMEDIATION_PLANNED
        distinguishing_aspect: |
          LimitBreach is a branching fork: one breach walks
          OPEN -> ACKNOWLEDGED -> REMEDIATION_PLANNED -> CLOSED while a sibling
          breach left OPEN is swept to ESCALATED by the clock (+6 days past the
          5-day ack deadline) — divergent branches with different side-effect
          sets on entity LimitBreach (sibling instance is on AssumptionSet).
        test_recipe:
          setup:
            - "Book1 ACTIVE with 4 positions and approved sets; NII limit 1.0 and EVE limit 12.0 ACTIVE; scenario UP200; one run breaches both limits creating breach N (NII) and breach E (EVE) at 2026-08-01"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: SECURITY, balance_cents: 50000000, rate_bps: 400, scheduled_runoff_pct: 0.0, duration_years: 4.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: BORROWING, balance_cents: 40000000, rate_bps: 450, scheduled_runoff_pct: 25.0, duration_years: 2.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
