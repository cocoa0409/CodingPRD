              captures: { l_id: $.data.id }
            - call: "POST /wash-loads/${l_id}/start"
              payload: {}
              as: PlantOperator
            - call: "GET /garments/${g_id}"
              as: PlantOperator
              captures: { state_after_wash_start: $.data.state }
            - call: "POST /wash-loads/${l_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/bypass-test"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/unload"
