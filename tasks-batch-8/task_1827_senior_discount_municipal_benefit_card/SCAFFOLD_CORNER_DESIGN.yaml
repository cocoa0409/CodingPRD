          trigger:
            - { call: "POST /senior-benefits/applications/${app_id}/documents/11111111-1111-4111-8111-111111111111/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1", captures: { e_doc: $.data.error_id } }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "22222222-2222-4222-8222-222222222222", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { e_card: $.data.error_id } }
            - { call: "POST /senior-benefits/usage-transactions/44444444-4444-4444-8444-444444444444/flag", payload: { reason: "ghost" }, as: FraudAnalyst, as_user_id: "fraud-1", captures: { e_txn: $.data.error_id } }
            - { call: "POST /senior-benefits/reimbursement-claims/55555555-5555-4555-8555-555555555555/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { e_claim: $.data.error_id } }
            - { call: "GET /senior-benefits/program-funds/66666666-6666-4666-8666-666666666666", as: ProgramAdministrator, captures: { e_fund: $.data.error_id } }
