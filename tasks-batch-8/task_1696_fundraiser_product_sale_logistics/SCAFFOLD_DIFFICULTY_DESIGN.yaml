  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_blocked_when_seller_suspended
        grounds:
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Seller.ACTIVE_to_SUSPENDED
          - errors[ERR_SELLER_SUSPENDED]
        distinguishing_aspect: |
          Order <- Seller pair: the seller's lifecycle state gates the order's DRAFT->SUBMITTED
          transition (ERR_SELLER_SUSPENDED), a dependency on a different entity pair than the
          Campaign<-SupplierOrder and PickupAppointment<-Order instances.
        test_recipe:
          setup:
            - "campaign OPEN; seller S ACTIVE (one submitted order); a second order o2 sitting in DRAFT"
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
