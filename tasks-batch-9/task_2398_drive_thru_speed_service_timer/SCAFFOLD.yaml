# =============================================================================
# PRD-Bench scaffold — task_2398_drive_thru_speed_service_timer
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the two
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2398. Drive-Thru Speed-of-Service & Timer Program (Chick-fil-A drive-thru operations): timer loop segmentation into greet, order, pull-forward and window intervals, target thresholds by daypart and volume tier, double-lane merge sequencing and order-accuracy tradeoffs, outside order-taker deployment thresholds and staffing model, order pull-forward and re-sequencing when items lag, accuracy incident logging and remake handling, peak-hour throughput reporting and coaching interventions, weather and event-driven forecast overrides

domain_name: drive-thru-speed-of-service
api_prefix: /drive-thru

# =============================================================================
# Step 0: Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Twelve peer entities linked by explicit FK fields. No entity is nested in a
  # URL path: every collection lives at `/drive-thru/<collection>` and every
  # instance at `/drive-thru/<collection>/{id}`; sub-paths are action verbs
  # (`/depart`, `/merge-award`), never child collections.

  state_machine_shape: parallel
  # TimerLoop carries two independent dimensions (timing_state × accuracy_state).
  # Also present: cyclic (CoachingIntervention DRAFT→ISSUED→CONTESTED→DRAFT,
  # PullForwardOrder ISSUED→PARKED→ISSUED), branching fork-join
  # (ForecastOverride PROPOSED→{APPROVED,REJECTED}) and posture-driven gating
  # (Restaurant.service_posture gates child mutations).

  relationship_patterns:
    - one_to_many          # Restaurant → profiles, staff, loops, slots, incidents, reports
    - self_referential     # TimerLoop.served_after_loop_id, ThroughputReport.supersedes_report_id
    - cross_aggregate      # CoachingIntervention spans ThroughputReport + StaffMember

  role_model: segregation_of_duties
  # The StaffMember who logged an AccuracyIncident may not be credited with its
  # remake; the MarketCoach who issued a CoachingIntervention may not close it.

  consistency_model: immediate

  difficulty_level: beyond_expert   # 12 entities / 64 endpoints / 57 errors / 12 calculations / 33 validations / 11 state-machine blocks (TimerLoop declares two independent dimensions)

# =============================================================================
# §1.0 Response envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: store_number, type: string, source: input, description: "Operator-facing store number", constraints: "unique across Restaurant" }
      - { name: lane_config, type: enum, source: input, description: "SINGLE | DUAL_TANDEM | DUAL_PARALLEL — SINGLE skips the merge step entirely", constraints: "SINGLE | DUAL_TANDEM | DUAL_PARALLEL" }
      - { name: merge_slots_capacity, type: integer, source: input, description: "Number of post-merge lane positions that may be held at once", constraints: "1..12" }
      - { name: merge_slots_free, type: integer, source: computed, description: "= merge_slots_capacity - count(MergeSlot with slot_state IN {RESERVED, COMMITTED})" }
      - { name: labor_minutes_budget, type: integer, source: input, description: "Deployment labor minutes available for the operating day", constraints: "0..5000" }
      - { name: labor_minutes_committed, type: integer, source: computed, default: 0, description: "= sum(planned_minutes of OrderTakerDeployment in ACTIVE) + sum(labor_minutes_charged of OrderTakerDeployment in RELEASED)" }
      - { name: labor_minutes_available, type: integer, source: computed, description: "= labor_minutes_budget - labor_minutes_committed" }
      - { name: staffing_basis, type: enum, source: input, default: OBSERVED, description: "Selects the oot_requirement variant: OBSERVED | FORECAST_ADJUSTED", constraints: "OBSERVED | FORECAST_ADJUSTED" }
      - { name: cars_closed_trailing, type: integer, source: computed, default: 0, description: "Count of own TimerLoop rows with timing_state == CLOSED and depart_at in (clock_now - 600s, clock_now]" }
      - { name: cars_per_hour_observed, type: number, source: computed, default: 0, description: "= round_half_up(cars_closed_trailing * 3600 / 600, 1)" }
      - { name: cars_per_hour_effective, type: number, source: computed, default: 0, description: "Volume figure that drives volume_tier; equals cars_per_hour_observed under staffing_basis OBSERVED, forecast-scaled under FORECAST_ADJUSTED" }
      - { name: volume_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 | TIER_4 — the VolumeTierPolicy whose band contains cars_per_hour_effective", constraints: "TIER_1 | TIER_2 | TIER_3 | TIER_4" }
      - { name: required_oot_count, type: integer, source: computed, default: 0, description: "Outside order-takers the staffing model demands right now (see calculations.oot_requirement)" }
      - { name: deployed_oot_count, type: integer, source: computed, default: 0, description: "= count(OrderTakerDeployment with deployment_state == ACTIVE and position IN {OOT_LANE_A, OOT_LANE_B})" }
      - { name: open_remake_count, type: integer, source: computed, default: 0, description: "= count(AccuracyIncident with incident_state IN {LOGGED, REMADE})" }
      - { name: remake_cost_accrued_cents, type: integer, source: computed, default: 0, description: "= sum(AccuracyIncident.remake_cost_cents where settlement_state IN {ACCRUED, CHARGED})" }
      - { name: posture_override, type: enum, source: system, default: NONE, description: "NONE | FROZEN — set by freeze, cleared by unfreeze", constraints: "NONE | FROZEN" }
      - { name: freeze_reason, type: string, source: input, description: "Reason captured by the freeze action; null while posture_override == NONE" }
      - { name: service_posture, type: enum, source: computed, description: "OPEN | SURGE | ACCURACY_HOLD | FROZEN — gates child mutations", constraints: "OPEN | SURGE | ACCURACY_HOLD | FROZEN" }

  - name: VolumeTierPolicy
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3 | TIER_4", constraints: "unique across VolumeTierPolicy" }
      - { name: cars_per_hour_floor, type: number, source: input, description: "Inclusive lower bound of the band", constraints: ">= 0" }
      - { name: cars_per_hour_ceiling, type: number, source: input, default: null, description: "Exclusive upper bound of the band; null means unbounded", constraints: "null or > cars_per_hour_floor" }
      - { name: target_relief_pct, type: number, source: input, description: "Fraction by which daypart segment targets are relaxed at this volume", constraints: "0.00..0.25" }
      - { name: min_oot_count, type: integer, source: input, description: "Outside order-takers the staffing model requires at this tier", constraints: "0..4" }
      - { name: merge_award_bias, type: enum, source: input, description: "Ranking mode used by the merge selector at this tier: ALTERNATE | LONGEST_WAIT | ACCURACY_FIRST", constraints: "ALTERNATE | LONGEST_WAIT | ACCURACY_FIRST" }

  - name: DaypartProfile
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; the store this daypart belongs to" }
      - { name: daypart, type: enum, source: input, description: "BREAKFAST | LUNCH | AFTERNOON | DINNER | LATE", constraints: "unique per restaurant among profiles with profile_state IN {DRAFT, ACTIVE}" }
      - { name: start_minute, type: integer, source: input, description: "Inclusive start, minutes since UTC midnight", constraints: "0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Exclusive end, minutes since UTC midnight", constraints: "1..1440, > start_minute" }
      - { name: greet_target_seconds, type: integer, source: input, description: "Target for arrive -> greet", constraints: "1..600" }
      - { name: order_target_seconds, type: integer, source: input, description: "Target for greet -> order complete", constraints: "1..600" }
      - { name: pull_forward_target_seconds, type: integer, source: input, description: "Target for order complete -> window arrival", constraints: "1..600" }
      - { name: window_target_seconds, type: integer, source: input, description: "Target for window arrival -> depart", constraints: "1..600" }
      - { name: total_target_seconds, type: integer, source: computed, description: "= greet_target_seconds + order_target_seconds + pull_forward_target_seconds + window_target_seconds (unrelieved)" }
      - { name: profile_state, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", constraints: "DRAFT | ACTIVE | RETIRED" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; home store" }
      - { name: full_name, type: string, source: input, description: "Team member name" }
      - { name: oot_certified, type: boolean, source: input, default: false, description: "Cleared to take orders outside at OOT_LANE_A / OOT_LANE_B" }
      - { name: window_certified, type: boolean, source: input, default: false, description: "Cleared to hand off at the window" }
      - { name: max_consecutive_deployment_minutes, type: integer, source: input, default: 90, description: "Longest single deployment this member may be planned for", constraints: "15..240" }
      - { name: deployed_minutes_today, type: integer, source: computed, default: 0, description: "= sum(labor_minutes_charged of own OrderTakerDeployment in RELEASED)" }
      - { name: staff_state, type: enum, source: system, description: "AVAILABLE | DEPLOYED | INACTIVE", constraints: "AVAILABLE | DEPLOYED | INACTIVE" }

  - name: OrderTakerDeployment
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; store being staffed" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id; the deployed team member" }
      - { name: daypart_profile_id, type: string, source: input, description: "FK -> DaypartProfile.id; daypart this deployment serves" }
      - { name: position, type: enum, source: input, description: "OOT_LANE_A | OOT_LANE_B | EXPEDITER | RUNNER", constraints: "OOT_LANE_A | OOT_LANE_B | EXPEDITER | RUNNER" }
      - { name: planned_start_at, type: datetime, source: input, description: "Closed-interval start (inclusive)" }
      - { name: planned_end_at, type: datetime, source: input, description: "Closed-interval end (inclusive), > planned_start_at" }
      - { name: planned_minutes, type: integer, source: computed, description: "= ceil((planned_end_at - planned_start_at) / 60 seconds)" }
      - { name: activated_at, type: datetime, source: system, description: "Logical clock at activation; null while PLANNED" }
      - { name: released_at, type: datetime, source: system, description: "Logical clock at release; null unless RELEASED" }
      - { name: labor_minutes_charged, type: integer, source: computed, default: 0, description: "= min(planned_minutes, ceil((released_at - activated_at)/60)); stays 0 for ABORTED" }
      - { name: deployment_state, type: enum, source: system, description: "PLANNED | ACTIVE | RELEASED | ABORTED", constraints: "PLANNED | ACTIVE | RELEASED | ABORTED" }
      - { name: abort_reason, type: string, source: input, description: "Reason captured by the abort action; null otherwise" }

  - name: TimerLoop
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; store serving this car" }
      - { name: daypart_profile_id, type: string, source: input, description: "FK -> DaypartProfile.id; profile whose targets are pinned onto this loop" }
      - { name: served_after_loop_id, type: string, source: system, description: "FK -> TimerLoop.id; the loop that held the previous MergeSlot when this loop was awarded one, null if none" }
      - { name: lane, type: enum, source: input, description: "LANE_A | LANE_B | SINGLE", constraints: "SINGLE only when restaurant.lane_config == SINGLE; LANE_A/LANE_B only when lane_config IN {DUAL_TANDEM, DUAL_PARALLEL}" }
      - { name: car_sequence, type: integer, source: system, description: "Monotone per restaurant, starts at 1, assigned at creation; the pinned tie-break for order-sensitive rules" }
      - { name: arrive_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: greet_at, type: datetime, source: system, description: "Logical clock at greet; null before" }
      - { name: order_complete_at, type: datetime, source: system, description: "Logical clock at order completion; null before" }
      - { name: merge_at, type: datetime, source: system, description: "Logical clock when the MergeSlot was committed; null for SINGLE lane" }
      - { name: window_arrive_at, type: datetime, source: system, description: "Logical clock at window arrival; null before" }
      - { name: depart_at, type: datetime, source: system, description: "Logical clock at departure; null unless CLOSED" }
      - { name: order_items_count, type: integer, source: input, description: "Item count captured at order completion", constraints: "1..40" }
      - { name: greet_seconds, type: integer, source: computed, description: "= greet_at - arrive_at in whole seconds" }
      - { name: order_seconds, type: integer, source: computed, description: "= order_complete_at - greet_at" }
      - { name: merge_wait_seconds, type: integer, source: computed, description: "= merge_at - order_complete_at; null for SINGLE lane" }
      - { name: pull_forward_seconds, type: integer, source: computed, description: "= window_arrive_at - order_complete_at (includes merge wait)" }
      - { name: window_seconds, type: integer, source: computed, description: "= depart_at - window_arrive_at" }
      - { name: total_seconds, type: integer, source: computed, description: "= depart_at - arrive_at; null unless CLOSED" }
      - { name: adjusted_total_seconds, type: integer, source: computed, description: "= total_seconds + accuracy penalty + pull-forward escalation penalty (see calculations.loop_adjusted_total)" }
      - { name: greet_target_pinned, type: integer, source: computed, description: "Relieved greet target frozen at creation" }
      - { name: order_target_pinned, type: integer, source: computed, description: "Relieved order target frozen at creation" }
      - { name: pull_forward_target_pinned, type: integer, source: computed, description: "Relieved pull-forward target frozen at creation" }
      - { name: window_target_pinned, type: integer, source: computed, description: "Relieved window target frozen at creation" }
      - { name: target_total_seconds_pinned, type: integer, source: computed, description: "= sum of the four pinned segment targets (per-segment rounding, then sum)" }
      - { name: breach_flags, type: array, source: computed, description: "Subset of [GREET, ORDER, PULL_FORWARD, WINDOW] whose measured seconds are strictly greater than the pinned target" }
      - { name: timing_state, type: enum, source: system, description: "OPEN | GREETED | ORDERED | MERGED | AT_WINDOW | CLOSED | ABANDONED", constraints: "OPEN | GREETED | ORDERED | MERGED | AT_WINDOW | CLOSED | ABANDONED" }
      - { name: accuracy_state, type: enum, source: system, description: "PENDING | VERIFIED | REMAKE_OPEN | REMADE | WAIVED — evolves independently of timing_state", constraints: "PENDING | VERIFIED | REMAKE_OPEN | REMADE | WAIVED" }
      - { name: abandon_reason, type: string, source: input, description: "Reason captured by the abandon action; null otherwise" }

  - name: MergeSlot
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: system, description: "FK -> Restaurant.id; store whose post-merge lane is held" }
      - { name: timer_loop_id, type: string, source: system, description: "FK -> TimerLoop.id; the loop the selector awarded this slot to" }
      - { name: sequence_index, type: integer, source: system, description: "Monotone per restaurant, starts at 1; pinned merge order" }
      - { name: source_lane, type: enum, source: system, description: "Copy of the awarded loop's lane: LANE_A | LANE_B | SINGLE", constraints: "LANE_A | LANE_B | SINGLE" }
      - { name: awarded_at, type: datetime, source: system, description: "Logical clock when the slot was reserved" }
      - { name: award_reason, type: enum, source: system, description: "Ranking rule that selected the loop: ALTERNATE | LONGEST_WAIT | ACCURACY_FIRST | CAR_SEQUENCE_TIE_BREAK", constraints: "ALTERNATE | LONGEST_WAIT | ACCURACY_FIRST | CAR_SEQUENCE_TIE_BREAK" }
      - { name: slot_state, type: enum, source: system, description: "RESERVED | COMMITTED | RELEASED | FORFEITED", constraints: "RESERVED | COMMITTED | RELEASED | FORFEITED" }

  - name: PullForwardOrder
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: system, description: "FK -> Restaurant.id; copied from the loop" }
      - { name: timer_loop_id, type: string, source: input, description: "FK -> TimerLoop.id; the lagging car" }
      - { name: reason, type: enum, source: input, description: "ITEM_LAG | REMAKE_OPEN | MERGE_CONFLICT", constraints: "ITEM_LAG | REMAKE_OPEN | MERGE_CONFLICT" }
      - { name: lag_seconds, type: integer, source: input, default: 0, description: "Operator-observed lag behind the pinned pull-forward target", constraints: "0..900" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at first issuance" }
      - { name: reissued_at, type: datetime, source: system, description: "Logical clock at the most recent reissue; null before" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical clock at clear; null unless CLEARED" }
      - { name: escalation_count, type: integer, source: system, default: 0, description: "Number of PARKED -> ISSUED reissues; capped at 2" }
      - { name: pf_state, type: enum, source: system, description: "ISSUED | PARKED | CLEARED | CANCELLED", constraints: "ISSUED | PARKED | CLEARED | CANCELLED" }

  - name: AccuracyIncident
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: system, description: "FK -> Restaurant.id; copied from the loop" }
      - { name: timer_loop_id, type: string, source: input, description: "FK -> TimerLoop.id; the order that was wrong" }
      - { name: logged_by_staff_id, type: string, source: input, description: "FK -> StaffMember.id; who reported the defect" }
      - { name: remade_by_staff_id, type: string, source: input, description: "FK -> StaffMember.id; who delivered the remake, null before delivery" }
      - { name: incident_type, type: enum, source: input, description: "WRONG_ITEM | MISSING_ITEM | WRONG_SIZE | ALLERGEN", constraints: "WRONG_ITEM | MISSING_ITEM | WRONG_SIZE | ALLERGEN" }
      - { name: severity, type: enum, source: computed, description: "MINOR | MAJOR | CRITICAL — derived from incident_type", constraints: "MINOR | MAJOR | CRITICAL" }
      - { name: penalty_seconds, type: integer, source: computed, description: "Seconds added to the loop's adjusted_total_seconds" }
      - { name: remake_cost_cents, type: integer, source: computed, description: "Food cost charged for the remake" }
      - { name: incident_state, type: enum, source: system, description: "LOGGED | REMADE | CLOSED | WAIVED", constraints: "LOGGED | REMADE | CLOSED | WAIVED" }
      - { name: settlement_state, type: enum, source: system, description: "ACCRUED | CHARGED | REVERSED", constraints: "ACCRUED | CHARGED | REVERSED" }
      - { name: waiver_reason, type: string, source: input, description: "Reason captured by the waive action; null otherwise" }

  - name: ThroughputReport
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; store being reported" }
      - { name: supersedes_report_id, type: string, source: input, description: "FK -> ThroughputReport.id; the PUBLISHED report this one replaces, null if none" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive start of the reporting window" }
      - { name: window_end_at, type: datetime, source: input, description: "Exclusive end of the reporting window, > window_start_at" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | FINAL — selects the attainment algorithm", constraints: "PROVISIONAL | FINAL" }
      - { name: metric_basis, type: enum, source: computed, description: "TOTAL for PROVISIONAL, ADJUSTED_TOTAL for FINAL", constraints: "TOTAL | ADJUSTED_TOTAL" }
      - { name: cars_served, type: integer, source: computed, description: "Size of the variant's input set" }
      - { name: cars_per_hour, type: number, source: computed, description: "= round_half_up(cars_served * 3600 / window seconds, 1)" }
      - { name: window_tier, type: enum, source: computed, description: "TIER_1..TIER_4 selected from cars_per_hour of THIS window, not from restaurant.volume_tier", constraints: "TIER_1 | TIER_2 | TIER_3 | TIER_4" }
      - { name: avg_metric_seconds, type: number, source: computed, description: "= round_half_up(mean of the variant metric over the input set, 1); null when cars_served == 0" }
      - { name: mean_pinned_target_seconds, type: number, source: computed, description: "Exact mean of target_total_seconds_pinned over the input set; null when cars_served == 0" }
      - { name: target_total_seconds_effective, type: integer, source: computed, description: "= round_half_up(mean_pinned_target_seconds * (1 + window_tier.target_relief_pct)); null when cars_served == 0" }
      - { name: attainment_pct, type: number, source: computed, description: "= round_half_up(100 * target_total_seconds_effective / avg_metric_seconds, 2); null when cars_served == 0" }
      - { name: attainment_band, type: enum, source: computed, description: "GOLD | GREEN | AMBER | RED; null when cars_served == 0", constraints: "GOLD | GREEN | AMBER | RED" }
      - { name: open_remake_incident_count, type: integer, source: computed, description: "Count of AccuracyIncident in {LOGGED, REMADE} whose loop arrived inside the window" }
      - { name: coaching_pool_points, type: integer, source: computed, description: "Coaching budget the window earned (see calculations.coaching_pool_points)" }
      - { name: report_state, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED | RETRACTED", constraints: "DRAFT | PUBLISHED | SUPERSEDED | RETRACTED" }
      - { name: retraction_reason, type: string, source: input, description: "Reason captured by the retract action; null otherwise" }

  - name: CoachingIntervention
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: system, description: "FK -> Restaurant.id; copied from the report" }
      - { name: throughput_report_id, type: string, source: input, description: "FK -> ThroughputReport.id; the PUBLISHED report that justifies coaching" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id; the coachee" }
      - { name: issued_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the MarketCoach who issued; audit only, never compared to an entity id" }
      - { name: focus_segment, type: enum, source: input, description: "GREET | ORDER | PULL_FORWARD | WINDOW | ACCURACY", constraints: "GREET | ORDER | PULL_FORWARD | WINDOW | ACCURACY" }
      - { name: segment_gap_seconds, type: number, source: computed, description: "Observed minus target seconds for focus_segment over the report's input set, floored at 0" }
      - { name: priority_score, type: number, source: computed, description: "0..100 weighted score (see calculations.coaching_priority_score)" }
      - { name: tier, type: enum, source: computed, description: "TIER_A_OBSERVE | TIER_B_COACH | TIER_C_RETRAIN", constraints: "TIER_A_OBSERVE | TIER_B_COACH | TIER_C_RETRAIN" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of CONTESTED -> DRAFT revisions; capped at 2" }
      - { name: contest_reason, type: string, source: input, description: "Reason captured by the contest action; null otherwise" }
      - { name: closure_note, type: string, source: input, description: "Note captured by the close action; null otherwise" }
      - { name: ci_state, type: enum, source: system, description: "DRAFT | ISSUED | ACKNOWLEDGED | CONTESTED | CLOSED", constraints: "DRAFT | ISSUED | ACKNOWLEDGED | CONTESTED | CLOSED" }

  - name: ForecastOverride
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; store whose forecast is overridden" }
      - { name: source, type: enum, source: input, description: "WEATHER | LOCAL_EVENT | SYSTEM_OUTAGE", constraints: "WEATHER | LOCAL_EVENT | SYSTEM_OUTAGE" }
      - { name: effective_start_at, type: datetime, source: input, description: "Closed-interval start (inclusive)" }
      - { name: effective_end_at, type: datetime, source: input, description: "Closed-interval end (inclusive), > effective_start_at" }
      - { name: projected_cars_delta_pct, type: number, source: input, description: "Signed fraction applied to cars_per_hour_observed under staffing_basis FORECAST_ADJUSTED", constraints: "-0.50..1.00" }
      - { name: target_relief_pct_override, type: number, source: input, default: null, description: "Explicit relief fraction; when null the relief is derived from projected_cars_delta_pct", constraints: "null or 0.00..0.20" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the approving ProgramAdmin; audit only" }
      - { name: rejection_reason, type: string, source: input, description: "Reason captured by the reject action; null otherwise" }
      - { name: fo_state, type: enum, source: system, description: "PROPOSED | APPROVED | APPLIED | REJECTED", constraints: "PROPOSED | APPROVED | APPLIED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Restaurant
  - entity: Restaurant
    initial_state: OPEN            # service_posture
    terminal_states: []
    note: |
      service_posture is a computed field, recomputed only by the named
      calculations.restaurant_rollup_recompute routine (step 9). Precedence is
      absolute: FROZEN > ACCURACY_HOLD > SURGE > OPEN.
    transitions:
      - from: OPEN
        to: SURGE
        trigger: "system: restaurant_rollup_recompute finds required_oot_count > deployed_oot_count"
        actor: system
        preconditions: ["posture_override == NONE", "open_remake_count < 2"]
        side_effects: ["Restaurant.updated_at refreshed", "Restaurant.version incremented by 1"]
      - from: SURGE
        to: OPEN
        trigger: "system: restaurant_rollup_recompute finds required_oot_count <= deployed_oot_count"
        actor: system
        preconditions: ["posture_override == NONE", "open_remake_count < 2"]
        side_effects: ["Restaurant.updated_at refreshed", "Restaurant.version incremented by 1"]
      - from: OPEN
        to: ACCURACY_HOLD
        trigger: "system: restaurant_rollup_recompute finds open_remake_count >= 2"
        actor: system
        preconditions: ["posture_override == NONE"]
        side_effects: ["merge-award is blocked with ERR_POSTURE_ACCURACY_HOLD until open_remake_count < 2"]
      - from: SURGE
        to: ACCURACY_HOLD
        trigger: "system: restaurant_rollup_recompute finds open_remake_count >= 2"
        actor: system
        preconditions: ["posture_override == NONE"]
        side_effects: ["merge-award is blocked with ERR_POSTURE_ACCURACY_HOLD until open_remake_count < 2"]
      - from: ACCURACY_HOLD
        to: SURGE
        trigger: "system: restaurant_rollup_recompute finds open_remake_count < 2 and required_oot_count > deployed_oot_count"
        actor: system
        preconditions: ["posture_override == NONE"]
        side_effects: ["merge-award unblocked"]
      - from: ACCURACY_HOLD
        to: OPEN
        trigger: "system: restaurant_rollup_recompute finds open_remake_count < 2 and required_oot_count <= deployed_oot_count"
        actor: system
        preconditions: ["posture_override == NONE"]
        side_effects: ["merge-award unblocked"]
      - from: OPEN
        to: FROZEN
        trigger: "POST /drive-thru/restaurants/{restaurantId}/freeze"
        actor: Operator
        preconditions: ["posture_override == NONE"]
        side_effects: ["posture_override := FROZEN", "freeze_reason stored", "all child mutations rejected with ERR_POSTURE_FROZEN", "Restaurant.version incremented by 1"]
      - from: SURGE
        to: FROZEN
        trigger: "POST /drive-thru/restaurants/{restaurantId}/freeze"
        actor: Operator
        preconditions: ["posture_override == NONE"]
        side_effects: ["posture_override := FROZEN", "freeze_reason stored", "Restaurant.version incremented by 1"]
      - from: ACCURACY_HOLD
        to: FROZEN
        trigger: "POST /drive-thru/restaurants/{restaurantId}/freeze"
        actor: Operator
        preconditions: ["posture_override == NONE"]
        side_effects: ["posture_override := FROZEN", "freeze_reason stored", "Restaurant.version incremented by 1"]
      - from: FROZEN
        to: OPEN
        trigger: "POST /drive-thru/restaurants/{restaurantId}/unfreeze"
        actor: Operator
        preconditions: ["posture_override == FROZEN"]
        side_effects: ["posture_override := NONE", "freeze_reason := null", "restaurant_rollup_recompute runs and may land on SURGE or ACCURACY_HOLD instead", "Restaurant.version incremented by 1"]
      - from: FROZEN
        to: SURGE
        trigger: "POST /drive-thru/restaurants/{restaurantId}/unfreeze"
        actor: Operator
        preconditions: ["posture_override == FROZEN", "recompute yields required_oot_count > deployed_oot_count and open_remake_count < 2"]
        side_effects: ["posture_override := NONE", "Restaurant.version incremented by 1"]
      - from: FROZEN
        to: ACCURACY_HOLD
        trigger: "POST /drive-thru/restaurants/{restaurantId}/unfreeze"
        actor: Operator
        preconditions: ["posture_override == FROZEN", "recompute yields open_remake_count >= 2"]
        side_effects: ["posture_override := NONE", "Restaurant.version incremented by 1"]

  # ------------------------------------------------------------ DaypartProfile
  - entity: DaypartProfile
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /drive-thru/daypart-profiles/{profileId}/activate"
        actor: Operator
        preconditions:
          - "profile_state == DRAFT"
          - "restaurant.service_posture != FROZEN"
          - "no other DaypartProfile of the same restaurant with profile_state == ACTIVE has a half-open [start_minute, end_minute) window overlapping this one"
        side_effects: ["profile_state := ACTIVE", "total_target_seconds recomputed", "TimerLoop creation against this profile becomes possible"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /drive-thru/daypart-profiles/{profileId}/retire"
        actor: Operator
        preconditions: ["profile_state == ACTIVE", "restaurant.service_posture != FROZEN"]
        side_effects: ["profile_state := RETIRED", "the (restaurant_id, daypart) uniqueness slot is freed", "TimerLoop creation against this profile now fails ERR_PROFILE_NOT_ACTIVE"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /drive-thru/daypart-profiles/{profileId}/retire"
        actor: Operator
        preconditions: ["profile_state == DRAFT", "restaurant.service_posture != FROZEN"]
        side_effects: ["profile_state := RETIRED"]

  # ------------------------------------------------------- OrderTakerDeployment
  - entity: OrderTakerDeployment
    initial_state: PLANNED
    terminal_states: [RELEASED, ABORTED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /drive-thru/order-taker-deployments/{deploymentId}/activate"
        actor: Operator | ShiftLeader
        preconditions:
          - "deployment_state == PLANNED"
          - "restaurant.service_posture != FROZEN"
          - "staff_member.staff_state == AVAILABLE"
          - "restaurant.labor_minutes_available >= planned_minutes"
        side_effects:
          - "deployment_state := ACTIVE; activated_at := clock now"
          - "StaffMember.staff_state := DEPLOYED"
          - "because the deployment became ACTIVE, Restaurant.labor_minutes_committed += planned_minutes and labor_minutes_available is recomputed"
          - "restaurant_rollup_recompute runs (deployed_oot_count, then service_posture)"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /drive-thru/order-taker-deployments/{deploymentId}/release"
        actor: Operator | ShiftLeader
        preconditions: ["deployment_state == ACTIVE", "restaurant.service_posture != FROZEN"]
        side_effects:
          - "deployment_state := RELEASED; released_at := clock now; labor_minutes_charged := min(planned_minutes, ceil((released_at - activated_at)/60))"
          - "StaffMember.staff_state := AVAILABLE; StaffMember.deployed_minutes_today += labor_minutes_charged"
          - "because the deployment left ACTIVE, Restaurant.labor_minutes_committed drops planned_minutes and picks up labor_minutes_charged"
          - "restaurant_rollup_recompute runs (deployed_oot_count, then service_posture)"
      - from: ACTIVE
        to: ABORTED
        trigger: "POST /drive-thru/order-taker-deployments/{deploymentId}/abort"
        actor: Operator
        preconditions: ["deployment_state == ACTIVE", "restaurant.service_posture != FROZEN"]
        side_effects:
          - "deployment_state := ABORTED; abort_reason stored; labor_minutes_charged stays 0"
          - "StaffMember.staff_state := AVAILABLE (deployed_minutes_today unchanged)"
          - "because the deployment left ACTIVE with zero charge, Restaurant.labor_minutes_committed drops the full planned_minutes — the compensating action restores labor_minutes_available exactly"
          - "restaurant_rollup_recompute runs (deployed_oot_count, then service_posture)"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /drive-thru/order-taker-deployments/{deploymentId}/abort"
        actor: Operator
        preconditions: ["deployment_state == PLANNED", "restaurant.service_posture != FROZEN"]
        side_effects: ["deployment_state := ABORTED; abort_reason stored", "no labor ledger movement (nothing was committed)"]

  # --------------------------------------------- TimerLoop (dimension 1 of 2)
  - entity: TimerLoop
    initial_state: OPEN            # timing_state
    terminal_states: [CLOSED, ABANDONED]
    note: |
      Dimension 1 of 2 on TimerLoop: timing_state. It evolves independently of
      accuracy_state (dimension 2, below) — an incident may move accuracy_state
      while timing_state stays CLOSED, and a depart may move timing_state while
      accuracy_state stays REMAKE_OPEN.
    transitions:
      - from: OPEN
        to: GREETED
        trigger: "POST /drive-thru/timer-loops/{loopId}/greet"
        actor: ShiftLeader
        preconditions: ["timing_state == OPEN", "restaurant.service_posture != FROZEN"]
        side_effects: ["greet_at := clock now", "greet_seconds computed", "breach_flags updated (GREET added when greet_seconds > greet_target_pinned, strictly greater)"]
      - from: GREETED
        to: ORDERED
        trigger: "POST /drive-thru/timer-loops/{loopId}/order-complete"
        actor: ShiftLeader
        preconditions: ["timing_state == GREETED", "restaurant.service_posture != FROZEN"]
        side_effects: ["order_complete_at := clock now", "order_items_count stored", "order_seconds computed", "breach_flags updated (ORDER)", "loop becomes eligible for the merge selector"]
      - from: ORDERED
        to: MERGED
        trigger: "POST /drive-thru/merge-slots/{slotId}/commit"
        actor: ShiftLeader
        preconditions: ["timing_state == ORDERED", "the slot's timer_loop_id is this loop", "slot.slot_state == RESERVED", "restaurant.service_posture != FROZEN"]
        side_effects: ["merge_at := clock now", "merge_wait_seconds computed", "MergeSlot.slot_state := COMMITTED"]
      - from: MERGED
        to: AT_WINDOW
        trigger: "POST /drive-thru/timer-loops/{loopId}/window-arrive"
        actor: ShiftLeader
        preconditions: ["timing_state == MERGED", "restaurant.lane_config IN {DUAL_TANDEM, DUAL_PARALLEL}", "restaurant.service_posture != FROZEN"]
        side_effects: ["window_arrive_at := clock now", "pull_forward_seconds computed", "breach_flags updated (PULL_FORWARD)"]
      - from: ORDERED
        to: AT_WINDOW
        trigger: "POST /drive-thru/timer-loops/{loopId}/window-arrive"
        actor: ShiftLeader
        preconditions: ["timing_state == ORDERED", "restaurant.lane_config == SINGLE (no merge step exists)", "restaurant.service_posture != FROZEN"]
        side_effects: ["window_arrive_at := clock now", "pull_forward_seconds computed", "merge_wait_seconds stays null", "breach_flags updated (PULL_FORWARD)"]
      - from: AT_WINDOW
        to: CLOSED
        trigger: "POST /drive-thru/timer-loops/{loopId}/depart"
        actor: ShiftLeader
        preconditions: ["timing_state == AT_WINDOW", "restaurant.service_posture != FROZEN"]
        side_effects:
          - "depart_at := clock now; window_seconds, total_seconds, adjusted_total_seconds and breach_flags (WINDOW) computed"
          - "if accuracy_state == PENDING then accuracy_state := VERIFIED (dimension 2 auto-advance)"
          - "any PullForwardOrder of this loop in {ISSUED, PARKED} becomes CLEARED (cleared_at := clock now)"
          - "CASCADE hop 1: because the loop reached CLOSED, its MergeSlot in slot_state == COMMITTED becomes RELEASED"
          - "CASCADE hop 2: because that slot left {RESERVED, COMMITTED}, Restaurant.merge_slots_free is recomputed (+1)"
          - "CASCADE hop 3: because the loop reached CLOSED, restaurant_rollup_recompute raises cars_closed_trailing, then cars_per_hour_observed / cars_per_hour_effective, then volume_tier"
          - "CASCADE hop 4: because volume_tier changed, required_oot_count is recomputed from the new tier's min_oot_count"
          - "CASCADE hop 5: because required_oot_count changed, service_posture is recomputed (OPEN -> SURGE when required_oot_count > deployed_oot_count)"
      - from: OPEN
        to: ABANDONED
        trigger: "POST /drive-thru/timer-loops/{loopId}/abandon"
        actor: ShiftLeader
        preconditions: ["timing_state == OPEN", "restaurant.service_posture != FROZEN"]
        side_effects: ["abandon_reason stored", "total_seconds stays null", "no rollup change (an abandoned car is not a served car)"]
      - from: GREETED
        to: ABANDONED
        trigger: "POST /drive-thru/timer-loops/{loopId}/abandon"
        actor: ShiftLeader
        preconditions: ["timing_state == GREETED", "restaurant.service_posture != FROZEN"]
        side_effects: ["abandon_reason stored"]
      - from: ORDERED
        to: ABANDONED
        trigger: "POST /drive-thru/timer-loops/{loopId}/abandon"
        actor: ShiftLeader
        preconditions: ["timing_state == ORDERED", "restaurant.service_posture != FROZEN"]
        side_effects:
          - "abandon_reason stored"
          - "the loop's MergeSlot in slot_state == RESERVED becomes FORFEITED, then Restaurant.merge_slots_free is recomputed (+1)"
          - "any PullForwardOrder of this loop in {ISSUED, PARKED} becomes CANCELLED"
      - from: MERGED
        to: ABANDONED
        trigger: "POST /drive-thru/timer-loops/{loopId}/abandon"
        actor: ShiftLeader
        preconditions: ["timing_state == MERGED", "restaurant.service_posture != FROZEN"]
        side_effects:
          - "abandon_reason stored"
          - "the loop's MergeSlot in slot_state == COMMITTED becomes FORFEITED, then Restaurant.merge_slots_free is recomputed (+1)"
          - "any PullForwardOrder of this loop in {ISSUED, PARKED} becomes CANCELLED"
      - from: AT_WINDOW
        to: ABANDONED
        trigger: "POST /drive-thru/timer-loops/{loopId}/abandon"
        actor: ShiftLeader
        preconditions: ["timing_state == AT_WINDOW", "restaurant.service_posture != FROZEN"]
        side_effects:
          - "abandon_reason stored"
          - "the loop's MergeSlot in slot_state == COMMITTED becomes FORFEITED, then Restaurant.merge_slots_free is recomputed (+1)"

  # --------------------------------------------- TimerLoop (dimension 2 of 2)
  - entity: TimerLoop
    initial_state: PENDING         # accuracy_state
    terminal_states: []
    note: |
      Dimension 2 of 2 on TimerLoop: accuracy_state. VERIFIED is not terminal —
      a guest complaint after departure moves VERIFIED -> REMAKE_OPEN without
      touching timing_state, which is exactly what makes a FINAL ThroughputReport
      diverge from an already-published PROVISIONAL one.
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /drive-thru/timer-loops/{loopId}/depart (auto)"
        actor: system
        preconditions: ["accuracy_state == PENDING", "timing_state transitioned AT_WINDOW -> CLOSED"]
        side_effects: ["accuracy_state := VERIFIED"]
      - from: PENDING
        to: REMAKE_OPEN
        trigger: "POST /drive-thru/accuracy-incidents"
        actor: ShiftLeader
        preconditions: ["accuracy_state IN {PENDING, VERIFIED}", "timing_state IN {ORDERED, MERGED, AT_WINDOW, CLOSED}"]
        side_effects:
          - "accuracy_state := REMAKE_OPEN; adjusted_total_seconds recomputed when total_seconds is known"
          - "CASCADE hop 1: because accuracy_state became REMAKE_OPEN, a PullForwardOrder with reason REMAKE_OPEN is auto-issued when this loop holds a MergeSlot in slot_state == RESERVED"
          - "CASCADE hop 2: because that PullForwardOrder was issued, the held MergeSlot becomes FORFEITED and Restaurant.merge_slots_free is recomputed (+1)"
          - "CASCADE hop 3: because open_remake_count rose, restaurant_rollup_recompute re-derives required_oot_count and then service_posture (ACCURACY_HOLD at open_remake_count >= 2)"
      - from: VERIFIED
        to: REMAKE_OPEN
        trigger: "POST /drive-thru/accuracy-incidents (late guest complaint on a CLOSED loop)"
        actor: ShiftLeader
        preconditions: ["accuracy_state == VERIFIED", "timing_state IN {ORDERED, MERGED, AT_WINDOW, CLOSED}"]
        side_effects:
          - "accuracy_state := REMAKE_OPEN; adjusted_total_seconds := total_seconds + penalty (timing_state untouched)"
          - "restaurant_rollup_recompute re-derives open_remake_count, then service_posture"
      - from: REMAKE_OPEN
        to: REMADE
        trigger: "POST /drive-thru/accuracy-incidents/{incidentId}/deliver-remake"
        actor: ShiftLeader
        preconditions: ["accuracy_state == REMAKE_OPEN", "incident.incident_state == LOGGED"]
        side_effects: ["accuracy_state := REMADE"]
      - from: REMADE
        to: VERIFIED
        trigger: "POST /drive-thru/accuracy-incidents/{incidentId}/close"
        actor: AccuracyAuditor
        preconditions: ["accuracy_state == REMADE", "incident.incident_state == REMADE"]
        side_effects: ["accuracy_state := VERIFIED", "restaurant_rollup_recompute lowers open_remake_count and may leave ACCURACY_HOLD"]
      - from: REMAKE_OPEN
        to: WAIVED
        trigger: "POST /drive-thru/accuracy-incidents/{incidentId}/waive"
        actor: AccuracyAuditor
        preconditions: ["accuracy_state == REMAKE_OPEN", "incident.incident_state == LOGGED", "incident.severity != CRITICAL"]
        side_effects: ["accuracy_state := WAIVED", "the incident's penalty_seconds leave adjusted_total_seconds", "restaurant_rollup_recompute lowers open_remake_count"]

  # ----------------------------------------------------------------- MergeSlot
  - entity: MergeSlot
    initial_state: RESERVED
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /drive-thru/merge-slots/{slotId}/commit"
        actor: ShiftLeader
        preconditions: ["slot_state == RESERVED", "awarded TimerLoop.timing_state == ORDERED", "restaurant.service_posture != FROZEN"]
        side_effects: ["slot_state := COMMITTED", "awarded TimerLoop.timing_state := MERGED; merge_at stamped", "Restaurant.merge_slots_free unchanged (RESERVED and COMMITTED both occupy)"]
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /drive-thru/timer-loops/{loopId}/depart (cascade hop 1)"
        actor: system
        preconditions: ["slot_state == COMMITTED", "awarded loop reached timing_state CLOSED"]
        side_effects: ["slot_state := RELEASED", "Restaurant.merge_slots_free recomputed (+1)"]
      - from: RESERVED
        to: FORFEITED
        trigger: "POST /drive-thru/pull-forward-orders or auto-issued PullForwardOrder (cascade hop 2)"
        actor: system
        preconditions: ["slot_state == RESERVED", "a PullForwardOrder for the awarded loop entered pf_state ISSUED"]
        side_effects: ["slot_state := FORFEITED", "Restaurant.merge_slots_free recomputed (+1)", "the awarded loop keeps timing_state ORDERED and re-enters the merge candidate pool once the pull-forward is CLEARED"]
      - from: COMMITTED
        to: FORFEITED
        trigger: "POST /drive-thru/timer-loops/{loopId}/abandon"
        actor: system
        preconditions: ["slot_state == COMMITTED", "awarded loop reached timing_state ABANDONED"]
        side_effects: ["slot_state := FORFEITED", "Restaurant.merge_slots_free recomputed (+1)"]

  # ---------------------------------------------------------- PullForwardOrder
  - entity: PullForwardOrder
    initial_state: ISSUED
    terminal_states: [CLEARED, CANCELLED]
    note: "Cyclic: ISSUED -> PARKED -> ISSUED, at most two reissues (escalation_count capped at 2)."
    transitions:
      - from: ISSUED
        to: PARKED
        trigger: "POST /drive-thru/pull-forward-orders/{pullForwardId}/park"
        actor: ShiftLeader
        preconditions: ["pf_state == ISSUED", "restaurant.service_posture != FROZEN"]
        side_effects: ["pf_state := PARKED (car pulled into a numbered parking spot)"]
      - from: PARKED
        to: ISSUED
        trigger: "POST /drive-thru/pull-forward-orders/{pullForwardId}/reissue"
        actor: ShiftLeader
        preconditions: ["pf_state == PARKED", "escalation_count <= 1", "restaurant.service_posture != FROZEN"]
        side_effects: ["pf_state := ISSUED", "escalation_count += 1; reissued_at := clock now", "the loop's adjusted_total_seconds gains PF_ESCALATION_PENALTY_SECONDS (15) per escalation"]
      - from: ISSUED
        to: CLEARED
        trigger: "POST /drive-thru/pull-forward-orders/{pullForwardId}/clear"
        actor: ShiftLeader
        preconditions: ["pf_state == ISSUED", "restaurant.service_posture != FROZEN"]
        side_effects: ["pf_state := CLEARED; cleared_at := clock now", "the loop becomes eligible for the merge selector again"]
      - from: PARKED
        to: CLEARED
        trigger: "POST /drive-thru/pull-forward-orders/{pullForwardId}/clear"
        actor: ShiftLeader
        preconditions: ["pf_state == PARKED", "restaurant.service_posture != FROZEN"]
        side_effects: ["pf_state := CLEARED; cleared_at := clock now"]
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /drive-thru/timer-loops/{loopId}/abandon (cascade)"
        actor: system
        preconditions: ["pf_state == ISSUED", "the loop reached timing_state ABANDONED"]
        side_effects: ["pf_state := CANCELLED", "the escalation penalty leaves the loop's adjusted_total_seconds"]
      - from: PARKED
        to: CANCELLED
        trigger: "POST /drive-thru/timer-loops/{loopId}/abandon (cascade)"
        actor: system
        preconditions: ["pf_state == PARKED", "the loop reached timing_state ABANDONED"]
        side_effects: ["pf_state := CANCELLED"]
      - from: ISSUED
        to: CLEARED
        trigger: "POST /drive-thru/timer-loops/{loopId}/depart (cascade)"
        actor: system
        preconditions: ["pf_state == ISSUED", "the loop reached timing_state CLOSED"]
        side_effects: ["pf_state := CLEARED; cleared_at := clock now"]

  # ----------------------------------------------------------- AccuracyIncident
  - entity: AccuracyIncident
    initial_state: LOGGED
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: LOGGED
        to: REMADE
        trigger: "POST /drive-thru/accuracy-incidents/{incidentId}/deliver-remake"
        actor: ShiftLeader
        preconditions:
          - "incident_state == LOGGED"
          - "restaurant.service_posture != FROZEN"
          - "remade_by_staff_id != logged_by_staff_id (segregation of duties)"
          - "the remaking StaffMember belongs to the same restaurant"
        side_effects: ["incident_state := REMADE; remade_by_staff_id stored", "TimerLoop.accuracy_state := REMADE", "settlement_state stays ACCRUED"]
      - from: REMADE
        to: CLOSED
        trigger: "POST /drive-thru/accuracy-incidents/{incidentId}/close"
        actor: AccuracyAuditor
        preconditions: ["incident_state == REMADE", "restaurant.service_posture != FROZEN"]
        side_effects:
          - "incident_state := CLOSED; settlement_state := CHARGED"
          - "TimerLoop.accuracy_state := VERIFIED; the penalty stays inside adjusted_total_seconds (the defect really happened)"
          - "Restaurant.remake_cost_accrued_cents unchanged (ACCRUED -> CHARGED keeps the money in the ledger), open_remake_count drops, service_posture recomputed"
      - from: LOGGED
        to: WAIVED
        trigger: "POST /drive-thru/accuracy-incidents/{incidentId}/waive"
        actor: AccuracyAuditor
        preconditions: ["incident_state == LOGGED", "severity != CRITICAL (ALLERGEN incidents can never be waived)", "restaurant.service_posture != FROZEN"]
        side_effects:
          - "incident_state := WAIVED; settlement_state := REVERSED; waiver_reason stored"
          - "TimerLoop.accuracy_state := WAIVED; the incident's penalty_seconds leave adjusted_total_seconds"
          - "Restaurant.remake_cost_accrued_cents drops remake_cost_cents — the compensating action restores the ledger exactly"
          - "open_remake_count drops, service_posture recomputed"

  # ---------------------------------------------------------- ThroughputReport
  - entity: ThroughputReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETRACTED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /drive-thru/throughput-reports/{reportId}/publish"
        actor: MarketCoach
        preconditions: ["report_state == DRAFT", "cars_served >= 1", "restaurant.service_posture != FROZEN"]
        side_effects:
          - "report_state := PUBLISHED"
          - "when supersedes_report_id is set and that report is PUBLISHED, it becomes SUPERSEDED"
          - "CoachingIntervention creation against this report becomes possible"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /drive-thru/throughput-reports/{reportId}/publish on a later report that names this one in supersedes_report_id"
        actor: system
        preconditions: ["report_state == PUBLISHED"]
        side_effects: ["report_state := SUPERSEDED", "existing CoachingIntervention rows keep their throughput_report_id but no new ones may be created"]
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /drive-thru/throughput-reports/{reportId}/retract"
        actor: MarketCoach
        preconditions: ["report_state == PUBLISHED", "restaurant.service_posture != FROZEN"]
        side_effects: ["report_state := RETRACTED; retraction_reason stored", "CoachingIntervention creation against this report now fails ERR_REPORT_NOT_PUBLISHED"]
      - from: DRAFT
        to: RETRACTED
        trigger: "POST /drive-thru/throughput-reports/{reportId}/retract"
        actor: MarketCoach
        preconditions: ["report_state == DRAFT", "restaurant.service_posture != FROZEN"]
        side_effects: ["report_state := RETRACTED; retraction_reason stored"]

  # ------------------------------------------------------ CoachingIntervention
  - entity: CoachingIntervention
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: "Cyclic revision loop DRAFT -> ISSUED -> CONTESTED -> DRAFT, at most two revisions."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /drive-thru/coaching-interventions/{coachingId}/issue"
        actor: MarketCoach
        preconditions: ["ci_state == DRAFT", "throughput_report.report_state == PUBLISHED", "restaurant.service_posture != FROZEN"]
        side_effects: ["ci_state := ISSUED", "issued_by_user_id := acting X-User-ID (overwritten on every issue)", "priority_score and tier recomputed from the report's current figures"]
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /drive-thru/coaching-interventions/{coachingId}/acknowledge"
        actor: ShiftLeader
        preconditions: ["ci_state == ISSUED", "acting X-User-ID == staff_member_id (only the coachee acknowledges)", "restaurant.service_posture != FROZEN"]
        side_effects: ["ci_state := ACKNOWLEDGED"]
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /drive-thru/coaching-interventions/{coachingId}/contest"
        actor: ShiftLeader
        preconditions: ["ci_state == ISSUED", "acting X-User-ID == staff_member_id", "revision_count <= 1", "restaurant.service_posture != FROZEN"]
        side_effects: ["ci_state := CONTESTED; contest_reason stored"]
      - from: CONTESTED
        to: DRAFT
        trigger: "POST /drive-thru/coaching-interventions/{coachingId}/contest (auto follow-through of the same request)"
        actor: system
        preconditions: ["ci_state == CONTESTED"]
        side_effects: ["ci_state := DRAFT; revision_count += 1 — the intervention re-enters the authoring loop and must be issued again"]
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "POST /drive-thru/coaching-interventions/{coachingId}/close"
        actor: MarketCoach
        preconditions: ["ci_state == ACKNOWLEDGED", "acting X-User-ID != issued_by_user_id (segregation of duties)", "restaurant.service_posture != FROZEN"]
        side_effects: ["ci_state := CLOSED; closure_note stored"]

  # ----------------------------------------------------------- ForecastOverride
  - entity: ForecastOverride
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    note: "Branching fork-join: PROPOSED -> {APPROVED, REJECTED} with disjoint side-effect sets; only the APPROVED branch can reach APPLIED."
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /drive-thru/forecast-overrides/{overrideId}/approve"
        actor: ProgramAdmin
        preconditions: ["fo_state == PROPOSED"]
        side_effects: ["fo_state := APPROVED; approved_by_user_id := acting X-User-ID", "no effect yet on Restaurant rollups — approval alone changes no target"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /drive-thru/forecast-overrides/{overrideId}/reject"
        actor: ProgramAdmin
        preconditions: ["fo_state == PROPOSED"]
        side_effects: ["fo_state := REJECTED; rejection_reason stored", "approved_by_user_id stays null and the override can never be applied"]
      - from: APPROVED
        to: APPLIED
        trigger: "POST /drive-thru/forecast-overrides/{overrideId}/apply"
        actor: Operator
        preconditions:
          - "fo_state == APPROVED"
          - "restaurant.service_posture != FROZEN"
          - "sum of abs(projected_cars_delta_pct) over already-APPLIED overrides of the same restaurant whose closed interval intersects this one, plus this override's own abs(projected_cars_delta_pct), is <= 0.50"
        side_effects:
          - "fo_state := APPLIED"
          - "restaurant_rollup_recompute runs: cars_per_hour_effective, then volume_tier, then required_oot_count, then service_posture"
          - "TimerLoop rows created from now on pin relieved targets that include this override's relief; already-created loops keep their pinned targets"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on Restaurant.version only
# =============================================================================
concurrency_rules:
  - rule_id: override-create-stale-restaurant
    parent_entity: Restaurant
    write_endpoint: "POST /drive-thru/forecast-overrides"
    occ_field: "expected_restaurant_version"
    description: |
      Proposing a ForecastOverride against a Restaurant whose version has
      advanced since the client last read it is rejected. Multiple PROPOSED
      overrides on overlapping windows are legitimate product behaviour (the
      aggregate cap only counts APPLIED ones), so a repeat of this create would
      itself succeed on its own merits — the stale expected_restaurant_version
      is the only thing that distinguishes the losing writer, whose view of
      volume_tier, service_posture and the applied-override set is out of date.
    error_id: ERR_STALE_RESTAURANT_VERSION
    http_status: 412

  - rule_id: report-create-stale-restaurant
    parent_entity: Restaurant
    write_endpoint: "POST /drive-thru/throughput-reports"
    occ_field: "expected_restaurant_version"
    description: |
      Creating a ThroughputReport against a Restaurant whose version has
      advanced since the client last read it is rejected. A second report over
      the same window is legitimate (it supersedes the earlier one via
      supersedes_report_id), so nothing in the report's own state precludes it;
      the stale expected_restaurant_version is what marks the writer as having
      computed its window from an out-of-date view of the store.
    error_id: ERR_STALE_RESTAURANT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: restaurant_rollup_recompute
    trigger: "Any of: TimerLoop depart/abandon, MergeSlot state change, AccuracyIncident create/deliver-remake/close/waive, OrderTakerDeployment activate/release/abort, ForecastOverride apply, PATCH /drive-thru/restaurants/{restaurantId}, POST /drive-thru/restaurants/{restaurantId}/freeze|unfreeze, POST /drive-thru/_clock/set_current_utc"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. Steps run exactly once, in this order.
      1. cars_closed_trailing := count(TimerLoop where restaurant_id == R.id
             and timing_state == CLOSED
             and depart_at >  clock_now - TRAILING_WINDOW_SECONDS
             and depart_at <= clock_now)                  # half-open on the old edge
      2. cars_per_hour_observed := round_half_up(cars_closed_trailing * 3600
                                                 / TRAILING_WINDOW_SECONDS, 1)
      3. cars_per_hour_effective := cars_per_hour_observed                     if staffing_basis == OBSERVED
                                    else round_half_up(cars_per_hour_observed
                                         * (1 + active_override.projected_cars_delta_pct), 1)
                                                                               if staffing_basis == FORECAST_ADJUSTED
                                                                                  and an active override exists
                                    else cars_per_hour_observed                # FORECAST_ADJUSTED, no active override
      4. volume_tier := tier of the VolumeTierPolicy P where
             cars_per_hour_effective >= P.cars_per_hour_floor
             and (P.cars_per_hour_ceiling is null or cars_per_hour_effective < P.cars_per_hour_ceiling)
         # no matching policy -> abort the whole request with ERR_TIER_POLICY_INCOMPLETE
      5. deployed_oot_count := count(OrderTakerDeployment where restaurant_id == R.id
             and deployment_state == ACTIVE and position IN {OOT_LANE_A, OOT_LANE_B})
      6. open_remake_count := count(AccuracyIncident where restaurant_id == R.id
             and incident_state IN {LOGGED, REMADE})
      7. required_oot_count := oot_requirement(R)          # see that calculation
      8. merge_slots_free := merge_slots_capacity - count(MergeSlot where restaurant_id == R.id
             and slot_state IN {RESERVED, COMMITTED})
         labor_minutes_committed := sum(planned_minutes of OrderTakerDeployment in ACTIVE)
                                  + sum(labor_minutes_charged of OrderTakerDeployment in RELEASED)
         labor_minutes_available := labor_minutes_budget - labor_minutes_committed
         remake_cost_accrued_cents := sum(remake_cost_cents of AccuracyIncident
                                          where settlement_state IN {ACCRUED, CHARGED})
      9. service_posture := FROZEN         if posture_override == FROZEN
                            else ACCURACY_HOLD  if open_remake_count >= ACCURACY_HOLD_THRESHOLD
                            else SURGE          if required_oot_count > deployed_oot_count
                            else OPEN
    input_set: "All rows FK-linked to this Restaurant; status filters are spelled out per step above."
    constants:
      TRAILING_WINDOW_SECONDS: 600
      ACCURACY_HOLD_THRESHOLD: 2
    precision: "cars_per_hour figures: 1 decimal place, round_half_up, decimal arithmetic. Counts and minutes are integers."

  - name: active_override_selection
    trigger: "Whenever a relief or forecast figure needs 'the override in force at instant T' (loop_target_pinning at loop creation, restaurant_rollup_recompute step 3 with T = clock_now)"
    algorithm: threshold
    formula: |
      candidates := ForecastOverride where restaurant_id == R.id
                      and fo_state == APPLIED
                      and effective_start_at <= T <= effective_end_at   # closed interval, both ends inclusive
      if candidates is empty -> no active override (relief contribution 0.00, delta 0.00)
      ranking      := projected_cars_delta_pct DESC
      tie_break    := created_at ASC          # never id
      active_override := first candidate under ranking then tie_break
    input_set: "Only fo_state == APPLIED overrides; PROPOSED / APPROVED / REJECTED are invisible to every calculation."
    constants: {}
    precision: "Exact comparison on stored ISO-8601 timestamps (whole seconds)."

  - name: loop_target_pinning
    trigger: "POST /drive-thru/timer-loops — pins greet/order/pull_forward/window_target_pinned and target_total_seconds_pinned at creation and never recomputes them"
    algorithm: tiered_pricing
    formula: |
      tier_policy      := VolumeTierPolicy whose tier == restaurant.volume_tier
      tier_relief      := tier_policy.target_relief_pct
      ov               := active_override_selection(restaurant, T = clock_now)
      override_relief  := 0.00                                             if ov is absent
                          else ov.target_relief_pct_override               if ov.target_relief_pct_override is not null
                          else min(MAX_OVERRIDE_RELIEF,
                                   max(0.00, ov.projected_cars_delta_pct * OVERRIDE_RELIEF_FACTOR))
      combined_relief  := min(MAX_COMBINED_RELIEF, tier_relief + override_relief)

      # ROUNDING ORDER IS PINNED: relieve EACH segment target and round it to a
      # whole second with round_half_up, THEN sum the four rounded values.
      # Summing first and rounding once is WRONG and differs by up to a second.
      greet_target_pinned        := round_half_up(profile.greet_target_seconds        * (1 + combined_relief))
      order_target_pinned        := round_half_up(profile.order_target_seconds        * (1 + combined_relief))
      pull_forward_target_pinned := round_half_up(profile.pull_forward_target_seconds * (1 + combined_relief))
      window_target_pinned       := round_half_up(profile.window_target_seconds       * (1 + combined_relief))
      target_total_seconds_pinned := greet_target_pinned + order_target_pinned
                                   + pull_forward_target_pinned + window_target_pinned
    input_set: "The restaurant's current volume_tier plus the single APPLIED override covering the loop's arrive_at."
    constants:
      MAX_COMBINED_RELIEF: 0.30
      OVERRIDE_RELIEF_FACTOR: 0.5
      MAX_OVERRIDE_RELIEF: 0.20
    precision: "Per-segment round_half_up to whole seconds on Decimal arithmetic; the sum is exact."

  - name: loop_segment_durations
    trigger: "Each TimerLoop timing transition (greet, order-complete, merge commit, window-arrive, depart)"
    algorithm: aggregation
    formula: |
      greet_seconds        := greet_at          - arrive_at
      order_seconds        := order_complete_at - greet_at
      merge_wait_seconds   := merge_at          - order_complete_at        # null when lane_config == SINGLE
      pull_forward_seconds := window_arrive_at  - order_complete_at
      window_seconds       := depart_at         - window_arrive_at
      total_seconds        := depart_at         - arrive_at
      # Breach uses a STRICT comparison: equal-to-target is NOT a breach.
      breach_flags := [GREET        if greet_seconds        > greet_target_pinned]
                    + [ORDER        if order_seconds        > order_target_pinned]
                    + [PULL_FORWARD if pull_forward_seconds > pull_forward_target_pinned]
                    + [WINDOW       if window_seconds       > window_target_pinned]
      # flag order is fixed: GREET, ORDER, PULL_FORWARD, WINDOW
    input_set: "Only the timestamps already stamped on this loop; a segment with a null endpoint contributes neither a duration nor a flag."
    constants: {}
    precision: "Whole seconds; the logical clock is only ever set to whole seconds."

  - name: loop_adjusted_total
    trigger: "TimerLoop depart, AccuracyIncident create/close/waive, PullForwardOrder reissue/cancel"
    algorithm: aggregation
    formula: |
      accuracy_penalty := sum(penalty_seconds of AccuracyIncident
                              where timer_loop_id == loop.id
                                and incident_state IN {LOGGED, REMADE, CLOSED})   # WAIVED excluded
      pf_penalty       := PF_ESCALATION_PENALTY_SECONDS
                          * sum(escalation_count of PullForwardOrder
                                where timer_loop_id == loop.id and pf_state != CANCELLED)
      adjusted_total_seconds := total_seconds + accuracy_penalty + pf_penalty      # null while total_seconds is null
    input_set: "Incidents in {LOGGED, REMADE, CLOSED} and pull-forward orders in {ISSUED, PARKED, CLEARED}."
    constants:
      PF_ESCALATION_PENALTY_SECONDS: 15
    precision: "Whole seconds."

  - name: incident_severity_and_cost
    trigger: "POST /drive-thru/accuracy-incidents"
    algorithm: threshold
    formula: |
      severity := CRITICAL if incident_type == ALLERGEN
                  else MAJOR    if incident_type IN {WRONG_ITEM, MISSING_ITEM}
                  else MINOR                                  # WRONG_SIZE
      penalty_seconds   := PENALTY_SECONDS_BY_SEVERITY[severity]
      remake_cost_cents := REMAKE_COST_CENTS_BY_SEVERITY[severity]
      settlement_state  := ACCRUED     # money enters remake_cost_accrued_cents immediately
    input_set: "The single incident being logged."
    constants:
      PENALTY_SECONDS_BY_SEVERITY: { MINOR: 20, MAJOR: 45, CRITICAL: 90 }
      REMAKE_COST_CENTS_BY_SEVERITY: { MINOR: 350, MAJOR: 750, CRITICAL: 1200 }
    precision: "Integer seconds and integer cents; no rounding needed."

  - name: oot_requirement
    trigger: "restaurant_rollup_recompute step 7"
    algorithm: weighted_scoring
    formula: |
      tier_policy  := VolumeTierPolicy whose tier == volume_tier      # from step 4
      lane_bump    := 1 if lane_config == DUAL_PARALLEL
                          and cars_per_hour_effective >= DUAL_PARALLEL_BUMP_CPH
                      else 0
      accuracy_bump := 1 if open_remake_count >= 1 else 0             # from step 6
      required_oot_count := min(MAX_OOT_COUNT,
                                tier_policy.min_oot_count + lane_bump + accuracy_bump)
    input_set: "The tier selected in step 4 from cars_per_hour_effective, plus the store's lane_config and open_remake_count."
    constants:
      DUAL_PARALLEL_BUMP_CPH: 12
      MAX_OOT_COUNT: 4
    precision: "Integer."
    variants:
      - name: observed
        when: "Restaurant.staffing_basis == OBSERVED"
        difference: "cars_per_hour_effective == cars_per_hour_observed — the tier, the lane bump and therefore required_oot_count are read off the trailing 600-second car count only; APPLIED forecast overrides are ignored entirely."
      - name: forecast_adjusted
        when: "Restaurant.staffing_basis == FORECAST_ADJUSTED"
        difference: "cars_per_hour_effective := round_half_up(cars_per_hour_observed * (1 + active_override.projected_cars_delta_pct), 1) before tier selection, so the same trailing car count can select a lower/higher tier, flip lane_bump across DUAL_PARALLEL_BUMP_CPH and yield a different required_oot_count (and a different service_posture) from the observed variant on identical TimerLoop data."

  - name: merge_award_selection
    trigger: "POST /drive-thru/restaurants/{restaurantId}/merge-award"
    algorithm: waterfall_allocation
    formula: |
      # (a) ELIGIBILITY FILTER — candidate set
      candidates := TimerLoop where restaurant_id == R.id
                      and timing_state == ORDERED
                      and accuracy_state IN {PENDING, VERIFIED}
                      and no MergeSlot for this loop has slot_state IN {RESERVED, COMMITTED}
                      and no PullForwardOrder for this loop has pf_state IN {ISSUED, PARKED}
      if candidates is empty -> ERR_NO_MERGE_CANDIDATE (409)                     # (d) empty-pool fallback
      if R.merge_slots_free < 1 -> ERR_MERGE_CAPACITY_EXHAUSTED (409)

      # (b) RANKING EXPRESSION — chosen by the current tier's merge_award_bias
      bias := VolumeTierPolicy[R.volume_tier].merge_award_bias
      if bias == ALTERNATE:
          last_slot := MergeSlot of R with the greatest sequence_index (any slot_state); null if none
          preferred_lane := LANE_B if last_slot is not null and last_slot.source_lane == LANE_A
                            else LANE_A if last_slot is not null and last_slot.source_lane == LANE_B
                            else null
          rank_key := (0 if preferred_lane is null or loop.lane == preferred_lane else 1,
                       order_complete_at ASC)
          award_reason := ALTERNATE
      if bias == LONGEST_WAIT:
          rank_key := (order_complete_at ASC)          # longest wait == earliest order completion
          award_reason := LONGEST_WAIT
      if bias == ACCURACY_FIRST:
          rank_key := (0 if accuracy_state == VERIFIED else 1, order_complete_at ASC)
          award_reason := ACCURACY_FIRST

      # (c) TIE-BREAK when the whole rank_key ties: car_sequence ASC (never id)
      winner := first candidate under rank_key, then car_sequence ASC
      if the tie-break decided the winner -> award_reason := CAR_SEQUENCE_TIE_BREAK

      slot := new MergeSlot { timer_loop_id: winner.id, source_lane: winner.lane,
                              sequence_index: max(sequence_index of R's slots, 0) + 1,
                              awarded_at: clock_now, slot_state: RESERVED, award_reason }
      winner.served_after_loop_id := timer_loop_id of R's MergeSlot with the greatest
                                     sequence_index before this award, else null
    input_set: "Loops of this restaurant in timing_state ORDERED with no live slot and no live pull-forward; all four slot_states are visible to the ALTERNATE lane-history lookup."
    constants: {}
    precision: "Exact timestamp comparison; integer sequence_index."

  - name: labor_minutes_ledger
    trigger: "OrderTakerDeployment create (planned_minutes), activate (commit), release (charge), abort (full reversal)"
    algorithm: waterfall_allocation
    formula: |
      planned_minutes := ceil((planned_end_at - planned_start_at) in seconds / 60)
      on activate: require labor_minutes_available >= planned_minutes
                   else ERR_LABOR_BUDGET_EXCEEDED (402)
                   deployment contributes planned_minutes to labor_minutes_committed
      on release : labor_minutes_charged := min(planned_minutes,
                                                ceil((released_at - activated_at) in seconds / 60))
                   deployment now contributes labor_minutes_charged instead of planned_minutes
      on abort   : labor_minutes_charged stays 0 and the deployment contributes nothing
      INVARIANT (must hold after every request):
          labor_minutes_budget == labor_minutes_committed + labor_minutes_available
    input_set: "Deployments in ACTIVE (planned_minutes) and RELEASED (labor_minutes_charged); PLANNED and ABORTED contribute zero."
    constants: {}
    precision: "Integer minutes, ceiling on partial minutes."

  - name: report_attainment_metrics
    trigger: "POST /drive-thru/throughput-reports (computed once at creation from the state visible then; publish does not recompute)"
    algorithm: chronological
    formula: |
      window_seconds := (window_end_at - window_start_at) in seconds
      input_set      := per variant, below
      cars_served    := count(input_set)
      if cars_served == 0:
          avg_metric_seconds := null; mean_pinned_target_seconds := null
          target_total_seconds_effective := null; attainment_pct := null
          attainment_band := null; cars_per_hour := 0.0; window_tier := tier of the
          VolumeTierPolicy band containing 0.0; coaching_pool_points := 0
          # publish of such a report is rejected with ERR_REPORT_WINDOW_EMPTY
      else:
          metric(loop) := loop.total_seconds           if variant == PROVISIONAL   # metric_basis TOTAL
                          else loop.adjusted_total_seconds                          # metric_basis ADJUSTED_TOTAL
          # ABANDONED loops (FINAL only) contribute ABANDON_PENALTY_SECONDS as their metric
          avg_metric_seconds        := round_half_up(sum(metric(loop)) / cars_served, 1)
          mean_pinned_target_seconds := sum(target_total_seconds_pinned) / cars_served   # exact, unrounded
          # steps 2..7 of coaching_pool_points pin window_tier, relief,
          # target_total_seconds_effective, attainment_pct and attainment_band
      open_remake_incident_count := count(AccuracyIncident where incident_state IN {LOGGED, REMADE}
                                          and its TimerLoop.arrive_at in [window_start_at, window_end_at))
                                    # independent of the variant's input set
    input_set: "See the two variants."
    constants:
      ABANDON_PENALTY_SECONDS: 300
    precision: "avg_metric_seconds: 1 decimal, round_half_up. attainment_pct: 2 decimals, round_half_up. mean_pinned_target_seconds is exact Decimal."
    variants:
      - name: provisional
        when: "variant == PROVISIONAL"
        difference: "Input set = TimerLoop with timing_state == CLOSED whose depart_at falls in [window_start_at, window_end_at), EXCLUDING any loop whose accuracy_state == REMAKE_OPEN; the metric is the raw total_seconds. Loops still carrying an open remake and loops that arrived in the window but departed after it are invisible."
      - name: final
        when: "variant == FINAL"
        difference: "Input set = TimerLoop with timing_state IN {CLOSED, ABANDONED} whose ARRIVE_AT falls in [window_start_at, window_end_at) — anchored on arrival, not departure — INCLUDING loops with accuracy_state == REMAKE_OPEN; the metric is adjusted_total_seconds (penalties folded in) and ABANDONED loops count as ABANDON_PENALTY_SECONDS. On identical stored rows this yields a different cars_served, a different window_tier and a different attainment_band from the provisional variant."

  - name: coaching_pool_points
    trigger: "POST /drive-thru/throughput-reports — runs immediately after report_attainment_metrics"
    algorithm: constraint_propagation
    formula: |
      # This chain LOOKS circular: the relief that sets the target comes from a
      # tier, the tier comes from the window's own car rate, and the rate comes
      # from the very input set whose attainment is being scored. EVALUATION
      # ORDER IS PINNED; each step runs exactly once, in this order.
      1. cars_served := count(input_set)                                  # already computed
      2. cars_per_hour := round_half_up(cars_served * 3600 / window_seconds, 1)
      3. window_tier := tier of the VolumeTierPolicy P where
             cars_per_hour >= P.cars_per_hour_floor
             and (P.cars_per_hour_ceiling is null or cars_per_hour < P.cars_per_hour_ceiling)
         # THIS report's window tier — NOT Restaurant.volume_tier, which reflects
         # the trailing 600 seconds at request time and is frequently different.
      4. relief := VolumeTierPolicy[window_tier].target_relief_pct
      5. target_total_seconds_effective := round_half_up(mean_pinned_target_seconds * (1 + relief))
      6. attainment_pct := round_half_up(100 * target_total_seconds_effective / avg_metric_seconds, 2)
      7. attainment_band := GOLD  if attainment_pct >= 110
                            else GREEN if attainment_pct >= 100
                            else AMBER if attainment_pct >= 90
                            else RED
      8. coaching_pool_points := max(0,
             BAND_POINTS[attainment_band]
             + min(VOLUME_POINTS_CAP, floor(cars_served / VOLUME_POINTS_DIVISOR))
             - REMAKE_POINT_PENALTY * open_remake_incident_count)
    input_set: "The variant's input set from report_attainment_metrics, plus every VolumeTierPolicy row."
    constants:
      BAND_POINTS: { GOLD: 10, GREEN: 6, AMBER: 3, RED: 0 }
      VOLUME_POINTS_CAP: 6
      VOLUME_POINTS_DIVISOR: 25
      REMAKE_POINT_PENALTY: 2
    precision: "attainment_pct 2 decimals round_half_up; target_total_seconds_effective whole seconds round_half_up; points integer."

  - name: coaching_priority_score
    trigger: "POST /drive-thru/coaching-interventions and every DRAFT -> ISSUED transition (recomputed from the report's stored figures)"
    algorithm: weighted_scoring
    formula: |
      observed(seg)  := mean over the report's input set of
                          loop.greet_seconds        if seg == GREET
                          loop.order_seconds        if seg == ORDER
                          loop.pull_forward_seconds if seg == PULL_FORWARD
                          loop.window_seconds       if seg == WINDOW
      target(seg)    := mean over the same input set of the matching *_target_pinned field
      segment_gap_seconds := max(0, observed(focus_segment) - target(focus_segment))
                             if focus_segment != ACCURACY
                             else sum(penalty_seconds of AccuracyIncident in {LOGGED, REMADE, CLOSED}
                                      whose loop is in the input set) / report.cars_served
      priority_score := round_half_up(
            min(100,
                W_GAP      * min(1.0, segment_gap_seconds / GAP_NORMALIZER_SECONDS)
              + W_ACCURACY * min(1.0, report.open_remake_incident_count / ACCURACY_NORMALIZER)
              + W_BAND     * BAND_WEIGHT[report.attainment_band]), 2)
      tier := TIER_C_RETRAIN if priority_score >= 70
              else TIER_B_COACH if priority_score >= 40
              else TIER_A_OBSERVE
    input_set: "The stored input set of the referenced ThroughputReport (its variant decides which loops are in it)."
    constants:
      W_GAP: 60
      W_ACCURACY: 25
      W_BAND: 15
      GAP_NORMALIZER_SECONDS: 30
      ACCURACY_NORMALIZER: 3
      BAND_WEIGHT: { GOLD: 0.0, GREEN: 0.2, AMBER: 0.6, RED: 1.0 }
    precision: "2 decimals, round_half_up, Decimal arithmetic; means are exact before the final rounding."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-templated resource exists, validated left-to-right"
    error_id: ERR_RESTAURANT_NOT_FOUND | ERR_PROFILE_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_DEPLOYMENT_NOT_FOUND | ERR_LOOP_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_PULL_FORWARD_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_COACHING_NOT_FOUND | ERR_OVERRIDE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: auth
    check: "Operator scope: X-User-ID equals the target Restaurant.id (the path restaurant, the body restaurant_id, or the restaurant_id of the path resource)"
    error_id: ERR_RESTAURANT_SCOPE_MISMATCH
    http_status: 403
    applies_to: "all Operator mutations"

  - priority: 5
    category: auth
    check: "ShiftLeader scope: X-User-ID is an existing StaffMember.id whose restaurant_id equals the target restaurant"
    error_id: ERR_STAFF_SCOPE_MISMATCH
    http_status: 403
    applies_to: "all ShiftLeader mutations"

  - priority: 6
    category: business_constraint
    check: "Request body schema: required fields present, enum members valid, numbers inside declared ranges, datetimes ISO-8601 UTC with whole seconds, pagination limit in 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body or query parameters"

  - priority: 7
    category: existence
    check: "Every FK referenced in the body exists"
    error_id: ERR_RESTAURANT_NOT_FOUND | ERR_PROFILE_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_LOOP_NOT_FOUND | ERR_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "POST /drive-thru/daypart-profiles, POST /drive-thru/staff-members, POST /drive-thru/order-taker-deployments, POST /drive-thru/timer-loops, POST /drive-thru/pull-forward-orders, POST /drive-thru/accuracy-incidents, POST /drive-thru/accuracy-incidents/{incidentId}/deliver-remake, POST /drive-thru/throughput-reports, POST /drive-thru/coaching-interventions, POST /drive-thru/forecast-overrides"

  - priority: 8
    category: business_referential
    check: "Every body FK belongs to the same Restaurant as the operation's target (profile.restaurant_id == body restaurant_id; staff.restaurant_id == loop.restaurant_id; report.restaurant_id == staff.restaurant_id; supersedes_report_id.restaurant_id == body restaurant_id)"
    error_id: ERR_RESTAURANT_MISMATCH
    http_status: 409
    applies_to: "POST /drive-thru/order-taker-deployments, POST /drive-thru/timer-loops, POST /drive-thru/accuracy-incidents, POST /drive-thru/accuracy-incidents/{incidentId}/deliver-remake, POST /drive-thru/throughput-reports, POST /drive-thru/coaching-interventions"

  - priority: 9
    category: state
    check: "expected_restaurant_version equals Restaurant.version (optimistic concurrency)"
    error_id: ERR_STALE_RESTAURANT_VERSION
    http_status: 412
    applies_to: "POST /drive-thru/forecast-overrides, POST /drive-thru/throughput-reports"

  - priority: 10
    category: state
    check: "Restaurant.service_posture != FROZEN"
    error_id: ERR_POSTURE_FROZEN
    http_status: 409
    applies_to: "all mutations except POST /drive-thru/restaurants, PATCH /drive-thru/restaurants/{restaurantId}, POST /drive-thru/restaurants/{restaurantId}/unfreeze, POST /drive-thru/volume-tier-policies, POST /drive-thru/forecast-overrides, the override approve/reject actions and POST /drive-thru/_clock/set_current_utc"

  - priority: 11
    category: state
    check: "Restaurant.service_posture != ACCURACY_HOLD"
    error_id: ERR_POSTURE_ACCURACY_HOLD
    http_status: 409
    applies_to: "POST /drive-thru/restaurants/{restaurantId}/merge-award"

  - priority: 12
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2"
    error_id: ERR_INVALID_PROFILE_STATE | ERR_INVALID_DEPLOYMENT_STATE | ERR_INVALID_TIMER_STATE | ERR_INVALID_SLOT_STATE | ERR_INVALID_PULL_FORWARD_STATE | ERR_INVALID_INCIDENT_STATE | ERR_INVALID_REPORT_STATE | ERR_INVALID_COACHING_STATE | ERR_INVALID_OVERRIDE_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 13
    category: state
    check: "Cross-entity state gates: TimerLoop creation needs profile_state == ACTIVE; CoachingIntervention creation needs report_state == PUBLISHED; deployment activation needs staff_state == AVAILABLE; merge commit needs the awarded loop in timing_state ORDERED; accuracy incident needs the loop in timing_state IN {ORDERED, MERGED, AT_WINDOW, CLOSED}; a loop may carry only one non-terminal remake"
    error_id: ERR_PROFILE_NOT_ACTIVE | ERR_REPORT_NOT_PUBLISHED | ERR_STAFF_NOT_AVAILABLE | ERR_LOOP_NOT_MERGEABLE | ERR_LOOP_HAS_NO_ORDER | ERR_REMAKE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /drive-thru/timer-loops, POST /drive-thru/coaching-interventions, POST /drive-thru/order-taker-deployments/{deploymentId}/activate, POST /drive-thru/merge-slots/{slotId}/commit, POST /drive-thru/accuracy-incidents"

  - priority: 14
    category: business_safety
    check: "A deployment at position OOT_LANE_A or OOT_LANE_B requires StaffMember.oot_certified == true"
    error_id: ERR_STAFF_NOT_OOT_CERTIFIED
    http_status: 422
    applies_to: "POST /drive-thru/order-taker-deployments"

  - priority: 15
    category: business_safety
    check: "An AccuracyIncident with severity CRITICAL (incident_type ALLERGEN) can never be waived"
    error_id: ERR_ALLERGEN_WAIVER_FORBIDDEN
    http_status: 422
    applies_to: "POST /drive-thru/accuracy-incidents/{incidentId}/waive"

  - priority: 16
    category: business_safety
    check: "Segregation of duties: remade_by_staff_id != AccuracyIncident.logged_by_staff_id; the closing MarketCoach's X-User-ID != CoachingIntervention.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /drive-thru/accuracy-incidents/{incidentId}/deliver-remake, POST /drive-thru/coaching-interventions/{coachingId}/close"

  - priority: 17
    category: business_temporal
    check: "The logical clock never moves backwards: to_iso8601 >= current logical clock"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /drive-thru/_clock/set_current_utc"

  - priority: 18
    category: business_temporal
    check: "Interval bounds are ordered: end_minute > start_minute; planned_end_at > planned_start_at; window_end_at > window_start_at; effective_end_at > effective_start_at"
    error_id: ERR_WINDOW_BOUNDS_INVALID
    http_status: 422
    applies_to: "POST /drive-thru/daypart-profiles, POST /drive-thru/order-taker-deployments, POST /drive-thru/throughput-reports, POST /drive-thru/forecast-overrides"

  - priority: 19
    category: business_temporal
    check: "The logical clock's minute-of-day at loop creation lies inside the profile's half-open window: start_minute <= minute_of_day(clock_now) < end_minute"
    error_id: ERR_DAYPART_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /drive-thru/timer-loops"

  - priority: 20
    category: business_temporal
    check: "window_end_at <= the logical clock (a report may not cover the future)"
    error_id: ERR_REPORT_WINDOW_FUTURE
    http_status: 422
    applies_to: "POST /drive-thru/throughput-reports"

  - priority: 21
    category: business_temporal
    check: "Half-open minute-of-day geometry: the activating profile's [start_minute, end_minute) must not overlap any ACTIVE profile of the same restaurant. Touching bounds (previous end_minute == this start_minute) are legal."
    error_id: ERR_DAYPART_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /drive-thru/daypart-profiles/{profileId}/activate"

  - priority: 22
    category: business_temporal
    check: "Closed-interval geometry with a changeover buffer on one StaffMember: for every other deployment of the same staff member in {PLANNED, ACTIVE}, require planned_start_at >= other.planned_end_at + CHANGEOVER_BUFFER_SECONDS (600) or planned_end_at + 600 <= other.planned_start_at. Back-to-back deployments that merely touch are rejected."
    error_id: ERR_DEPLOYMENT_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /drive-thru/order-taker-deployments"

  - priority: 23
    category: business_temporal
    check: "Aggregate-capacity geometry on one Restaurant: sum of abs(projected_cars_delta_pct) over APPLIED overrides whose closed interval intersects this one (touching endpoints count as intersecting), plus this override's own abs value, must be <= OVERRIDE_AGGREGATE_CAP (0.50)"
    error_id: ERR_OVERRIDE_AGGREGATE_CAP
    http_status: 422
    applies_to: "POST /drive-thru/forecast-overrides/{overrideId}/apply"

  - priority: 24
    category: business_constraint
    check: "Uniqueness: (restaurant_id, daypart) is unique among profiles with profile_state IN {DRAFT, ACTIVE}; VolumeTierPolicy.tier is globally unique; Restaurant.store_number is globally unique"
    error_id: ERR_DUPLICATE_DAYPART | ERR_DUPLICATE_TIER_POLICY | ERR_DUPLICATE_STORE_NUMBER
    http_status: 409
    applies_to: "POST /drive-thru/daypart-profiles, POST /drive-thru/volume-tier-policies, POST /drive-thru/restaurants"

  - priority: 25
    category: business_constraint
    check: "A VolumeTierPolicy band must contain cars_per_hour_effective (and, for reports, cars_per_hour) — the tier table must cover the value in play"
    error_id: ERR_TIER_POLICY_INCOMPLETE
    http_status: 422
    applies_to: "POST /drive-thru/timer-loops, POST /drive-thru/timer-loops/{loopId}/depart, POST /drive-thru/throughput-reports, POST /drive-thru/restaurants/{restaurantId}/merge-award"

  - priority: 26
    category: business_constraint
    check: "A loop may carry only one live pull-forward: no PullForwardOrder for this loop in pf_state IN {ISSUED, PARKED}"
    error_id: ERR_PULL_FORWARD_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /drive-thru/pull-forward-orders"

  - priority: 27
    category: business_constraint
    check: "escalation_count <= 1 before a reissue (at most PF_MAX_ESCALATIONS = 2 reissues per pull-forward)"
    error_id: ERR_PULL_FORWARD_ESCALATION_LIMIT
    http_status: 422
    applies_to: "POST /drive-thru/pull-forward-orders/{pullForwardId}/reissue"

  - priority: 28
    category: business_constraint
    check: "revision_count <= 1 before a contest (at most CI_MAX_REVISIONS = 2 revision loops per intervention)"
    error_id: ERR_COACHING_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /drive-thru/coaching-interventions/{coachingId}/contest"

  - priority: 29
    category: business_constraint
    check: "planned_minutes <= StaffMember.max_consecutive_deployment_minutes"
    error_id: ERR_STAFF_CONSECUTIVE_LIMIT
    http_status: 422
    applies_to: "POST /drive-thru/order-taker-deployments"

  - priority: 30
    category: business_constraint
    check: "The merge selector's candidate set is non-empty"
    error_id: ERR_NO_MERGE_CANDIDATE
    http_status: 409
    applies_to: "POST /drive-thru/restaurants/{restaurantId}/merge-award"

  - priority: 31
    category: business_constraint
    check: "cars_served >= 1 on the report being published"
    error_id: ERR_REPORT_WINDOW_EMPTY
    http_status: 422
    applies_to: "POST /drive-thru/throughput-reports/{reportId}/publish"

  - priority: 32
    category: business_fiscal
    check: "Restaurant.merge_slots_free >= 1"
    error_id: ERR_MERGE_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /drive-thru/restaurants/{restaurantId}/merge-award"

  - priority: 33
    category: business_fiscal
    check: "Restaurant.labor_minutes_available >= planned_minutes"
    error_id: ERR_LABOR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /drive-thru/order-taker-deployments/{deploymentId}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------------ clock
  - method: POST
    path: "/drive-thru/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock that stamps every arrive/greet/order/merge/window/depart timestamp. The server starts at the fixed default 2026-08-01T00:00:00Z and NEVER falls back to wall-clock time. Whole seconds only; the clock may not move backwards."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced", "restaurant_rollup_recompute runs for every Restaurant (cars_closed_trailing ages out, then tier, required_oot_count and service_posture follow)"]

  # ------------------------------------------------------------- restaurants
  - method: POST
    path: "/drive-thru/restaurants"
    description: "Register a store in the timer program"
    roles: [ProgramAdmin]
    code: 201
    input: [name, store_number, lane_config, merge_slots_capacity, labor_minutes_budget, "staffing_basis?"]
    output: Restaurant
    side_effects: ["merge_slots_free := merge_slots_capacity", "labor_minutes_available := labor_minutes_budget", "cars_per_hour_observed/effective := 0.0, volume_tier from the 0.0 band, service_posture := OPEN"]

  - method: GET
    path: "/drive-thru/restaurants/{restaurantId}"
    description: "Read a store with all rollups and its current version (the OCC read-before-write channel)"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: Restaurant
    side_effects: []

  - method: PATCH
    path: "/drive-thru/restaurants/{restaurantId}"
    description: "Adjust the staffing model basis or the day's labor budget"
    roles: [Operator]
    code: 200
    input: ["staffing_basis?", "labor_minutes_budget?"]
    output: Restaurant
    side_effects: ["restaurant_rollup_recompute runs (cars_per_hour_effective, volume_tier, required_oot_count, service_posture)", "increments Restaurant.version by 1"]

  - method: POST
    path: "/drive-thru/restaurants/{restaurantId}/freeze"
    description: "Freeze the store: posture_override := FROZEN, blocking every child mutation"
    roles: [Operator]
    code: 200
    input: [freeze_reason]
    output: Restaurant
    side_effects: ["service_posture := FROZEN", "increments Restaurant.version by 1"]

  - method: POST
    path: "/drive-thru/restaurants/{restaurantId}/unfreeze"
    description: "Clear the freeze; the recompute decides whether the store lands on OPEN, SURGE or ACCURACY_HOLD"
    roles: [Operator]
    code: 200
    input: []
    output: Restaurant
    side_effects: ["posture_override := NONE", "restaurant_rollup_recompute runs", "increments Restaurant.version by 1"]

  - method: POST
    path: "/drive-thru/restaurants/{restaurantId}/merge-award"
    description: "Award the next post-merge lane position: the server selects one eligible TimerLoop per calculations.merge_award_selection"
    roles: [ShiftLeader]
    code: 201
    input: []
    output: MergeSlot
    side_effects: ["new MergeSlot in RESERVED with award_reason recorded", "awarded loop's served_after_loop_id set to the previous slot holder", "Restaurant.merge_slots_free recomputed (-1)"]

  # ------------------------------------------------------ volume tier policies
  - method: POST
    path: "/drive-thru/volume-tier-policies"
    description: "Declare one volume-tier band: car-rate bounds, target relief, OOT minimum and merge bias"
    roles: [ProgramAdmin]
    code: 201
    input: [tier, cars_per_hour_floor, "cars_per_hour_ceiling?", target_relief_pct, min_oot_count, merge_award_bias]
    output: VolumeTierPolicy
    side_effects: ["subsequent recomputes may select this band"]

  - method: GET
    path: "/drive-thru/volume-tier-policies"
    description: "List volume-tier bands"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: VolumeTierPolicy[]
    side_effects: []

  # --------------------------------------------------------- daypart profiles
  - method: POST
    path: "/drive-thru/daypart-profiles"
    description: "Draft a daypart with its four segment targets"
    roles: [Operator]
    code: 201
    input: [restaurant_id, daypart, start_minute, end_minute, greet_target_seconds, order_target_seconds, pull_forward_target_seconds, window_target_seconds]
    output: DaypartProfile
    side_effects: ["profile_state := DRAFT", "total_target_seconds computed"]

  - method: POST
    path: "/drive-thru/daypart-profiles/{profileId}/activate"
    description: "Activate a daypart after the half-open minute-of-day overlap check"
    roles: [Operator]
    code: 200
    input: []
    output: DaypartProfile
    side_effects: ["profile_state := ACTIVE"]

  - method: POST
    path: "/drive-thru/daypart-profiles/{profileId}/retire"
    description: "Retire a daypart and free its (restaurant, daypart) uniqueness slot"
    roles: [Operator]
    code: 200
    input: []
    output: DaypartProfile
    side_effects: ["profile_state := RETIRED"]

  - method: GET
    path: "/drive-thru/daypart-profiles"
    description: "List daypart profiles, filterable by store, daypart and state"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "daypart?", "profile_state?", "limit?", "offset?"]
    output: DaypartProfile[]
    side_effects: []

  - method: GET
    path: "/drive-thru/daypart-profiles/{profileId}"
    description: "Read one daypart profile"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: DaypartProfile
    side_effects: []

  # ------------------------------------------------------------ staff members
  - method: POST
    path: "/drive-thru/staff-members"
    description: "Add a team member with certifications and consecutive-deployment cap"
    roles: [Operator]
    code: 201
    input: [restaurant_id, full_name, "oot_certified?", "window_certified?", "max_consecutive_deployment_minutes?"]
    output: StaffMember
    side_effects: ["staff_state := AVAILABLE"]

  - method: GET
    path: "/drive-thru/staff-members"
    description: "List team members, filterable by store and state"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "staff_state?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  - method: GET
    path: "/drive-thru/staff-members/{staffId}"
    description: "Read one team member"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  # ------------------------------------------------------------- deployments
  - method: POST
    path: "/drive-thru/order-taker-deployments"
    description: "Plan an outside order-taker (or expediter/runner) deployment; runs the certification, consecutive-minutes and changeover-buffer checks"
    roles: [Operator]
    code: 201
    input: [restaurant_id, staff_member_id, daypart_profile_id, position, planned_start_at, planned_end_at]
    output: OrderTakerDeployment
    side_effects: ["planned_minutes computed", "deployment_state := PLANNED (no labor committed yet)"]

  - method: POST
    path: "/drive-thru/order-taker-deployments/{deploymentId}/activate"
    description: "Put the team member on position; commits labor minutes and may clear a SURGE posture"
    roles: [Operator, ShiftLeader]
    code: 200
    input: []
    output: OrderTakerDeployment
    side_effects: ["deployment_state := ACTIVE; activated_at stamped", "StaffMember.staff_state := DEPLOYED", "labor_minutes_committed += planned_minutes", "restaurant_rollup_recompute runs (deployed_oot_count, service_posture)"]

  - method: POST
    path: "/drive-thru/order-taker-deployments/{deploymentId}/release"
    description: "Take the team member off position and charge actual minutes"
    roles: [Operator, ShiftLeader]
    code: 200
    input: []
    output: OrderTakerDeployment
    side_effects: ["deployment_state := RELEASED; released_at stamped; labor_minutes_charged computed", "StaffMember.staff_state := AVAILABLE; deployed_minutes_today increased", "labor ledger re-derived", "restaurant_rollup_recompute runs"]

  - method: POST
    path: "/drive-thru/order-taker-deployments/{deploymentId}/abort"
    description: "Abort a deployment; the compensating action that returns the full committed labor reservation"
    roles: [Operator]
    code: 200
    input: [abort_reason]
    output: OrderTakerDeployment
    side_effects: ["deployment_state := ABORTED; labor_minutes_charged stays 0", "StaffMember.staff_state := AVAILABLE", "labor_minutes_committed drops the full planned_minutes", "restaurant_rollup_recompute runs"]

  - method: GET
    path: "/drive-thru/order-taker-deployments"
    description: "List deployments, filterable by store, staff member, daypart, position and state"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "staff_member_id?", "daypart_profile_id?", "position?", "deployment_state?", "limit?", "offset?"]
    output: OrderTakerDeployment[]
    side_effects: []

  - method: GET
    path: "/drive-thru/order-taker-deployments/{deploymentId}"
    description: "Read one deployment with its labor figures"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: OrderTakerDeployment
    side_effects: []

  # ------------------------------------------------------------- timer loops
  - method: POST
    path: "/drive-thru/timer-loops"
    description: "Start a timer loop when a car breaks the lane sensor; pins the relieved segment targets"
    roles: [ShiftLeader]
    code: 201
    input: [restaurant_id, daypart_profile_id, lane]
    output: TimerLoop
    side_effects: ["arrive_at := clock now; car_sequence assigned", "loop_target_pinning fixes the four *_target_pinned fields and target_total_seconds_pinned", "timing_state := OPEN, accuracy_state := PENDING"]

  - method: POST
    path: "/drive-thru/timer-loops/{loopId}/greet"
    description: "Stamp the greet moment"
    roles: [ShiftLeader]
    code: 200
    input: []
    output: TimerLoop
    side_effects: ["greet_at stamped; greet_seconds computed; breach_flags may gain GREET", "timing_state := GREETED"]

  - method: POST
    path: "/drive-thru/timer-loops/{loopId}/order-complete"
    description: "Stamp order completion and record the item count; the loop enters the merge candidate pool"
    roles: [ShiftLeader]
    code: 200
    input: [order_items_count]
    output: TimerLoop
    side_effects: ["order_complete_at stamped; order_seconds computed; breach_flags may gain ORDER", "timing_state := ORDERED"]

  - method: POST
    path: "/drive-thru/timer-loops/{loopId}/window-arrive"
    description: "Stamp arrival at the window (from MERGED on dual-lane stores, from ORDERED on SINGLE-lane stores)"
    roles: [ShiftLeader]
    code: 200
    input: []
    output: TimerLoop
    side_effects: ["window_arrive_at stamped; pull_forward_seconds computed; breach_flags may gain PULL_FORWARD", "timing_state := AT_WINDOW"]

  - method: POST
    path: "/drive-thru/timer-loops/{loopId}/depart"
    description: "Close the loop; drives the five-hop cascade through slot release, trailing car rate, volume tier, OOT requirement and posture"
    roles: [ShiftLeader]
    code: 200
    input: []
    output: TimerLoop
    side_effects: ["depart_at stamped; window_seconds, total_seconds, adjusted_total_seconds, breach_flags computed", "accuracy_state PENDING -> VERIFIED", "live pull-forward orders CLEARED", "COMMITTED MergeSlot -> RELEASED", "restaurant_rollup_recompute runs end to end"]

  - method: POST
    path: "/drive-thru/timer-loops/{loopId}/abandon"
    description: "Record a drive-off; the car never becomes a served car"
    roles: [ShiftLeader]
    code: 200
    input: [abandon_reason]
    output: TimerLoop
    side_effects: ["timing_state := ABANDONED", "held MergeSlot -> FORFEITED and merge_slots_free recomputed", "live pull-forward orders CANCELLED"]

  - method: GET
    path: "/drive-thru/timer-loops"
    description: "List timer loops, filterable by store, daypart, lane, both state dimensions and the re-sequencing predecessor"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "daypart_profile_id?", "served_after_loop_id?", "lane?", "timing_state?", "accuracy_state?", "limit?", "offset?"]
    output: TimerLoop[]
    side_effects: []

  - method: GET
    path: "/drive-thru/timer-loops/{loopId}"
    description: "Read one timer loop with segment durations, pinned targets and breach flags"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: TimerLoop
    side_effects: []

  # -------------------------------------------------------------- merge slots
  - method: POST
    path: "/drive-thru/merge-slots/{slotId}/commit"
    description: "Commit the awarded car into the post-merge lane"
    roles: [ShiftLeader]
    code: 200
    input: []
    output: MergeSlot
    side_effects: ["slot_state := COMMITTED", "awarded TimerLoop.timing_state := MERGED; merge_at and merge_wait_seconds set"]

  - method: GET
    path: "/drive-thru/merge-slots"
    description: "List merge slots, filterable by store, loop and slot state"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "timer_loop_id?", "slot_state?", "limit?", "offset?"]
    output: MergeSlot[]
    side_effects: []

  - method: GET
    path: "/drive-thru/merge-slots/{slotId}"
    description: "Read one merge slot with its award reason"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: MergeSlot
    side_effects: []

  # -------------------------------------------------------- pull-forward orders
  - method: POST
    path: "/drive-thru/pull-forward-orders"
    description: "Pull a lagging car forward; forfeits any RESERVED merge slot it holds"
    roles: [ShiftLeader]
    code: 201
    input: [timer_loop_id, reason, "lag_seconds?"]
    output: PullForwardOrder
    side_effects: ["pf_state := ISSUED; issued_at stamped", "a RESERVED MergeSlot of this loop -> FORFEITED and merge_slots_free recomputed (+1)"]

  - method: POST
    path: "/drive-thru/pull-forward-orders/{pullForwardId}/park"
    description: "Park the car in a numbered spot"
    roles: [ShiftLeader]
    code: 200
    input: []
    output: PullForwardOrder
    side_effects: ["pf_state := PARKED"]

  - method: POST
    path: "/drive-thru/pull-forward-orders/{pullForwardId}/reissue"
    description: "Re-issue a parked pull-forward when items still lag; adds an escalation penalty to the loop"
    roles: [ShiftLeader]
    code: 200
    input: []
    output: PullForwardOrder
    side_effects: ["pf_state := ISSUED; escalation_count += 1; reissued_at stamped", "loop.adjusted_total_seconds gains 15 seconds per escalation"]

  - method: POST
    path: "/drive-thru/pull-forward-orders/{pullForwardId}/clear"
    description: "Clear the pull-forward once the items are handed off"
    roles: [ShiftLeader]
    code: 200
    input: []
    output: PullForwardOrder
    side_effects: ["pf_state := CLEARED; cleared_at stamped", "the loop re-enters the merge candidate pool"]

  - method: GET
    path: "/drive-thru/pull-forward-orders"
    description: "List pull-forward orders, filterable by store, loop and state"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "timer_loop_id?", "pf_state?", "limit?", "offset?"]
    output: PullForwardOrder[]
    side_effects: []

  - method: GET
    path: "/drive-thru/pull-forward-orders/{pullForwardId}"
    description: "Read one pull-forward order with its escalation count"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: PullForwardOrder
    side_effects: []

  # ------------------------------------------------------- accuracy incidents
  - method: POST
    path: "/drive-thru/accuracy-incidents"
    description: "Log an order-accuracy defect against a loop; drives the remake cascade"
    roles: [ShiftLeader]
    code: 201
    input: [timer_loop_id, logged_by_staff_id, incident_type]
    output: AccuracyIncident
    side_effects: ["severity, penalty_seconds, remake_cost_cents computed; settlement_state := ACCRUED", "TimerLoop.accuracy_state := REMAKE_OPEN; adjusted_total_seconds recomputed", "a RESERVED MergeSlot triggers an auto-issued PullForwardOrder (reason REMAKE_OPEN), which forfeits the slot", "restaurant_rollup_recompute runs (open_remake_count, required_oot_count, service_posture)"]

  - method: POST
    path: "/drive-thru/accuracy-incidents/{incidentId}/deliver-remake"
    description: "Credit the remake to a different team member than the reporter (segregation of duties)"
    roles: [ShiftLeader]
    code: 200
    input: [remade_by_staff_id]
    output: AccuracyIncident
    side_effects: ["incident_state := REMADE", "TimerLoop.accuracy_state := REMADE"]

  - method: POST
    path: "/drive-thru/accuracy-incidents/{incidentId}/close"
    description: "Auditor closes the incident and charges the remake cost"
    roles: [AccuracyAuditor]
    code: 200
    input: []
    output: AccuracyIncident
    side_effects: ["incident_state := CLOSED; settlement_state := CHARGED", "TimerLoop.accuracy_state := VERIFIED (penalty stays in adjusted_total_seconds)", "restaurant_rollup_recompute runs"]

  - method: POST
    path: "/drive-thru/accuracy-incidents/{incidentId}/waive"
    description: "Auditor waives a non-critical incident; the compensating action that reverses the remake cost and penalty"
    roles: [AccuracyAuditor]
    code: 200
    input: [waiver_reason]
    output: AccuracyIncident
    side_effects: ["incident_state := WAIVED; settlement_state := REVERSED", "TimerLoop.accuracy_state := WAIVED; penalty leaves adjusted_total_seconds", "Restaurant.remake_cost_accrued_cents drops remake_cost_cents", "restaurant_rollup_recompute runs"]

  - method: GET
    path: "/drive-thru/accuracy-incidents"
    description: "List accuracy incidents, filterable by store, loop, reporter, remaker and state"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "timer_loop_id?", "logged_by_staff_id?", "remade_by_staff_id?", "incident_state?", "limit?", "offset?"]
    output: AccuracyIncident[]
    side_effects: []

  - method: GET
    path: "/drive-thru/accuracy-incidents/{incidentId}"
    description: "Read one accuracy incident with severity, penalty and cost"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: AccuracyIncident
    side_effects: []

  # ------------------------------------------------------- throughput reports
  - method: POST
    path: "/drive-thru/throughput-reports"
    description: "Compute a peak-hour throughput report over a closed-past window using the PROVISIONAL or FINAL algorithm"
    roles: [MarketCoach]
    code: 201
    input: [restaurant_id, window_start_at, window_end_at, variant, expected_restaurant_version, "supersedes_report_id?"]
    output: ThroughputReport
    side_effects: ["report_attainment_metrics and coaching_pool_points run once, at creation", "report_state := DRAFT", "increments Restaurant.version by 1"]

  - method: POST
    path: "/drive-thru/throughput-reports/{reportId}/publish"
    description: "Publish the report; a named predecessor becomes SUPERSEDED"
    roles: [MarketCoach]
    code: 200
    input: []
    output: ThroughputReport
    side_effects: ["report_state := PUBLISHED", "supersedes_report_id target moves PUBLISHED -> SUPERSEDED", "coaching becomes possible"]

  - method: POST
    path: "/drive-thru/throughput-reports/{reportId}/retract"
    description: "Retract a report; coaching against it is no longer allowed"
    roles: [MarketCoach]
    code: 200
    input: [retraction_reason]
    output: ThroughputReport
    side_effects: ["report_state := RETRACTED"]

  - method: GET
    path: "/drive-thru/throughput-reports"
    description: "List throughput reports, filterable by store, variant, state and superseded predecessor"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "supersedes_report_id?", "variant?", "report_state?", "limit?", "offset?"]
    output: ThroughputReport[]
    side_effects: []

  - method: GET
    path: "/drive-thru/throughput-reports/{reportId}"
    description: "Read one throughput report with all computed metrics"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: ThroughputReport
    side_effects: []

  # --------------------------------------------------- coaching interventions
  - method: POST
    path: "/drive-thru/coaching-interventions"
    description: "Draft a coaching intervention off a PUBLISHED report; scores priority and tier"
    roles: [MarketCoach]
    code: 201
    input: [throughput_report_id, staff_member_id, focus_segment]
    output: CoachingIntervention
    side_effects: ["segment_gap_seconds, priority_score and tier computed", "ci_state := DRAFT"]

  - method: POST
    path: "/drive-thru/coaching-interventions/{coachingId}/issue"
    description: "Issue the intervention to the coachee; stamps the issuing coach for the segregation-of-duties check"
    roles: [MarketCoach]
    code: 200
    input: []
    output: CoachingIntervention
    side_effects: ["ci_state := ISSUED", "issued_by_user_id := acting X-User-ID", "priority_score and tier recomputed"]

  - method: POST
    path: "/drive-thru/coaching-interventions/{coachingId}/acknowledge"
    description: "Coachee accepts the intervention"
    roles: [ShiftLeader]
    code: 200
    input: []
    output: CoachingIntervention
    side_effects: ["ci_state := ACKNOWLEDGED"]

  - method: POST
    path: "/drive-thru/coaching-interventions/{coachingId}/contest"
    description: "Coachee contests; the intervention returns to DRAFT with revision_count incremented"
    roles: [ShiftLeader]
    code: 200
    input: [contest_reason]
    output: CoachingIntervention
    side_effects: ["ci_state := CONTESTED then immediately DRAFT", "revision_count += 1"]

  - method: POST
    path: "/drive-thru/coaching-interventions/{coachingId}/close"
    description: "A different coach than the issuer closes the acknowledged intervention"
    roles: [MarketCoach]
    code: 200
    input: [closure_note]
    output: CoachingIntervention
    side_effects: ["ci_state := CLOSED"]

  - method: GET
    path: "/drive-thru/coaching-interventions"
    description: "List coaching interventions, filterable by store, report, coachee and state"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "throughput_report_id?", "staff_member_id?", "ci_state?", "limit?", "offset?"]
    output: CoachingIntervention[]
    side_effects: []

  - method: GET
    path: "/drive-thru/coaching-interventions/{coachingId}"
    description: "Read one coaching intervention with its score, tier and revision count"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: CoachingIntervention
    side_effects: []

  # ----------------------------------------------------- forecast overrides
  - method: POST
    path: "/drive-thru/forecast-overrides"
    description: "Propose a weather or event driven forecast override; requires the store version the client last observed"
    roles: [Operator]
    code: 201
    input: [restaurant_id, source, effective_start_at, effective_end_at, projected_cars_delta_pct, "target_relief_pct_override?", expected_restaurant_version]
    output: ForecastOverride
    side_effects: ["fo_state := PROPOSED (no rollup effect yet)", "increments Restaurant.version by 1"]

  - method: POST
    path: "/drive-thru/forecast-overrides/{overrideId}/approve"
    description: "Program approval branch"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ForecastOverride
    side_effects: ["fo_state := APPROVED; approved_by_user_id stamped"]

  - method: POST
    path: "/drive-thru/forecast-overrides/{overrideId}/reject"
    description: "Program rejection branch (terminal, never applicable)"
    roles: [ProgramAdmin]
    code: 200
    input: [rejection_reason]
    output: ForecastOverride
    side_effects: ["fo_state := REJECTED"]

  - method: POST
    path: "/drive-thru/forecast-overrides/{overrideId}/apply"
    description: "Put an approved override into force after the aggregate-cap check"
    roles: [Operator]
    code: 200
    input: []
    output: ForecastOverride
    side_effects: ["fo_state := APPLIED", "restaurant_rollup_recompute runs (cars_per_hour_effective, volume_tier, required_oot_count, service_posture)", "later loop creations pin relieved targets"]

  - method: GET
    path: "/drive-thru/forecast-overrides"
    description: "List forecast overrides, filterable by store, state and source"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: ["restaurant_id?", "fo_state?", "source?", "limit?", "offset?"]
    output: ForecastOverride[]
    side_effects: []

  - method: GET
    path: "/drive-thru/forecast-overrides/{overrideId}"
    description: "Read one forecast override"
    roles: [ProgramAdmin, Operator, ShiftLeader, MarketCoach, AccuracyAuditor]
    code: 200
    input: []
    output: ForecastOverride
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "X-User-Role / X-User-ID missing or the role is not one of the five declared roles" }
  - { id: ERR_UNAUTHORIZED,             http: 403, condition: "The acting role is not listed on the endpoint" }
  - { id: ERR_RESTAURANT_SCOPE_MISMATCH, http: 403, condition: "Operator's X-User-ID is not the target Restaurant.id" }
  - { id: ERR_STAFF_SCOPE_MISMATCH,     http: 403, condition: "ShiftLeader's X-User-ID is not a StaffMember of the target restaurant" }
  - { id: ERR_RESTAURANT_NOT_FOUND,     http: 404, condition: "restaurantId / body restaurant_id does not exist" }
  - { id: ERR_PROFILE_NOT_FOUND,        http: 404, condition: "profileId / body daypart_profile_id does not exist" }
  - { id: ERR_STAFF_NOT_FOUND,          http: 404, condition: "staffId / body staff_member_id / logged_by_staff_id / remade_by_staff_id does not exist" }
  - { id: ERR_DEPLOYMENT_NOT_FOUND,     http: 404, condition: "deploymentId does not exist" }
  - { id: ERR_LOOP_NOT_FOUND,           http: 404, condition: "loopId / body timer_loop_id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND,           http: 404, condition: "slotId does not exist" }
  - { id: ERR_PULL_FORWARD_NOT_FOUND,   http: 404, condition: "pullForwardId does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND,       http: 404, condition: "incidentId does not exist" }
  - { id: ERR_REPORT_NOT_FOUND,         http: 404, condition: "reportId / body throughput_report_id / supersedes_report_id does not exist" }
  - { id: ERR_COACHING_NOT_FOUND,       http: 404, condition: "coachingId does not exist" }
  - { id: ERR_OVERRIDE_NOT_FOUND,       http: 404, condition: "overrideId does not exist" }
  - { id: ERR_INVALID_REQUEST,          http: 400, condition: "Missing required field, unknown enum member, out-of-range number, malformed timestamp, or pagination limit outside 1..100" }
  - { id: ERR_RESTAURANT_MISMATCH,      http: 409, condition: "A body FK belongs to a different Restaurant than the operation's target" }
  - { id: ERR_STALE_RESTAURANT_VERSION, http: 412, condition: "expected_restaurant_version does not equal the store's current version" }
  - { id: ERR_POSTURE_FROZEN,           http: 409, condition: "The store's service_posture is FROZEN and the requested mutation is gated" }
  - { id: ERR_POSTURE_ACCURACY_HOLD,    http: 409, condition: "merge-award attempted while service_posture is ACCURACY_HOLD (open_remake_count >= 2)" }
  - { id: ERR_INVALID_PROFILE_STATE,    http: 409, condition: "Daypart profile transition not declared from its current profile_state" }
  - { id: ERR_INVALID_DEPLOYMENT_STATE, http: 409, condition: "Deployment transition not declared from its current deployment_state" }
  - { id: ERR_INVALID_TIMER_STATE,      http: 409, condition: "Timer-loop transition not declared from its current timing_state" }
  - { id: ERR_INVALID_SLOT_STATE,       http: 409, condition: "Merge-slot commit attempted from a slot_state other than RESERVED" }
  - { id: ERR_INVALID_PULL_FORWARD_STATE, http: 409, condition: "Pull-forward transition not declared from its current pf_state" }
  - { id: ERR_INVALID_INCIDENT_STATE,   http: 409, condition: "Incident transition not declared from its current incident_state" }
  - { id: ERR_INVALID_REPORT_STATE,     http: 409, condition: "Report transition not declared from its current report_state" }
  - { id: ERR_INVALID_COACHING_STATE,   http: 409, condition: "Coaching transition not declared from its current ci_state" }
  - { id: ERR_INVALID_OVERRIDE_STATE,   http: 409, condition: "Override transition not declared from its current fo_state" }
  - { id: ERR_PROFILE_NOT_ACTIVE,       http: 409, condition: "Timer loop created against a DaypartProfile whose profile_state is not ACTIVE" }
  - { id: ERR_REPORT_NOT_PUBLISHED,     http: 409, condition: "Coaching intervention created against a report whose report_state is not PUBLISHED" }
  - { id: ERR_STAFF_NOT_AVAILABLE,      http: 409, condition: "Deployment activation for a StaffMember whose staff_state is not AVAILABLE" }
  - { id: ERR_LOOP_NOT_MERGEABLE,       http: 409, condition: "Merge commit while the awarded loop's timing_state is not ORDERED" }
  - { id: ERR_LOOP_HAS_NO_ORDER,        http: 409, condition: "Accuracy incident logged against a loop whose timing_state is OPEN or GREETED" }
  - { id: ERR_REMAKE_ALREADY_OPEN,      http: 409, condition: "Accuracy incident logged while the loop's accuracy_state is already REMAKE_OPEN or REMADE" }
  - { id: ERR_STAFF_NOT_OOT_CERTIFIED,  http: 422, condition: "Deployment at OOT_LANE_A / OOT_LANE_B for a team member whose oot_certified is false" }
  - { id: ERR_ALLERGEN_WAIVER_FORBIDDEN, http: 422, condition: "Waive attempted on a CRITICAL (ALLERGEN) incident" }
  - { id: ERR_SEGREGATION_OF_DUTIES,    http: 409, condition: "Remake credited to the reporter, or a coaching intervention closed by the coach who issued it" }
  - { id: ERR_CLOCK_REGRESSION,         http: 422, condition: "to_iso8601 is earlier than the current logical clock" }
  - { id: ERR_WINDOW_BOUNDS_INVALID,    http: 422, condition: "An interval's end is not strictly after its start" }
  - { id: ERR_DAYPART_WINDOW_MISMATCH,  http: 422, condition: "The clock's minute-of-day at loop creation is outside the profile's half-open [start_minute, end_minute)" }
  - { id: ERR_REPORT_WINDOW_FUTURE,     http: 422, condition: "window_end_at is later than the logical clock" }
  - { id: ERR_DAYPART_WINDOW_OVERLAP,   http: 409, condition: "Activating a profile whose half-open minute window overlaps an ACTIVE sibling profile" }
  - { id: ERR_DEPLOYMENT_BUFFER_VIOLATION, http: 409, condition: "A team member's new closed deployment interval is within 600 seconds of another PLANNED/ACTIVE interval of theirs" }
  - { id: ERR_OVERRIDE_AGGREGATE_CAP,   http: 422, condition: "Applying the override would push the summed abs(projected_cars_delta_pct) of intersecting APPLIED overrides above 0.50" }
  - { id: ERR_DUPLICATE_DAYPART,        http: 409, condition: "The store already has a DRAFT or ACTIVE profile for this daypart" }
  - { id: ERR_DUPLICATE_TIER_POLICY,    http: 409, condition: "A VolumeTierPolicy already exists for this tier" }
  - { id: ERR_DUPLICATE_STORE_NUMBER,   http: 409, condition: "store_number already registered" }
  - { id: ERR_TIER_POLICY_INCOMPLETE,   http: 422, condition: "No VolumeTierPolicy band contains the car-rate figure the request needs" }
  - { id: ERR_PULL_FORWARD_ALREADY_OPEN, http: 409, condition: "The loop already has a pull-forward in ISSUED or PARKED" }
  - { id: ERR_PULL_FORWARD_ESCALATION_LIMIT, http: 422, condition: "Reissue attempted when escalation_count is already 2" }
  - { id: ERR_COACHING_REVISION_LIMIT,  http: 422, condition: "Contest attempted when revision_count is already 2" }
  - { id: ERR_STAFF_CONSECUTIVE_LIMIT,  http: 422, condition: "planned_minutes exceeds the team member's max_consecutive_deployment_minutes" }
  - { id: ERR_NO_MERGE_CANDIDATE,       http: 409, condition: "merge-award found no eligible loop" }
  - { id: ERR_REPORT_WINDOW_EMPTY,      http: 422, condition: "Publish attempted on a report whose cars_served is 0" }
  - { id: ERR_MERGE_CAPACITY_EXHAUSTED, http: 409, condition: "merge-award while merge_slots_free is 0" }
  - { id: ERR_LABOR_BUDGET_EXCEEDED,    http: 402, condition: "Activation needs more labor minutes than labor_minutes_available" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Chain-level program owner: registers stores, publishes the volume-tier policy table, adjudicates forecast overrides and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /drive-thru/restaurants"
      - "POST /drive-thru/volume-tier-policies"
      - "POST /drive-thru/forecast-overrides/{overrideId}/approve"
      - "POST /drive-thru/forecast-overrides/{overrideId}/reject"
      - "POST /drive-thru/_clock/set_current_utc"
    shared_operations: ["every GET endpoint"]

  - name: Operator
    description: "Store operator; X-User-ID is the Restaurant.id they own. Owns configuration, staffing and posture for their store."
    identity: "entity_backed:Restaurant"
    exclusive_operations:
      - "PATCH /drive-thru/restaurants/{restaurantId}"
      - "POST /drive-thru/restaurants/{restaurantId}/freeze"
      - "POST /drive-thru/restaurants/{restaurantId}/unfreeze"
      - "POST /drive-thru/daypart-profiles"
      - "POST /drive-thru/daypart-profiles/{profileId}/activate"
      - "POST /drive-thru/daypart-profiles/{profileId}/retire"
      - "POST /drive-thru/staff-members"
      - "POST /drive-thru/order-taker-deployments"
      - "POST /drive-thru/order-taker-deployments/{deploymentId}/abort"
      - "POST /drive-thru/forecast-overrides"
      - "POST /drive-thru/forecast-overrides/{overrideId}/apply"
    shared_operations:
      - "POST /drive-thru/order-taker-deployments/{deploymentId}/activate"
      - "POST /drive-thru/order-taker-deployments/{deploymentId}/release"
      - "every GET endpoint"

  - name: ShiftLeader
    description: "Shift leader on the pad; X-User-ID is their StaffMember.id. Runs the timer loop, the merge lane, pull-forwards and incident logging."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /drive-thru/timer-loops"
      - "POST /drive-thru/timer-loops/{loopId}/greet"
      - "POST /drive-thru/timer-loops/{loopId}/order-complete"
      - "POST /drive-thru/timer-loops/{loopId}/window-arrive"
      - "POST /drive-thru/timer-loops/{loopId}/depart"
      - "POST /drive-thru/timer-loops/{loopId}/abandon"
      - "POST /drive-thru/restaurants/{restaurantId}/merge-award"
      - "POST /drive-thru/merge-slots/{slotId}/commit"
      - "POST /drive-thru/pull-forward-orders"
      - "POST /drive-thru/pull-forward-orders/{pullForwardId}/park"
      - "POST /drive-thru/pull-forward-orders/{pullForwardId}/reissue"
      - "POST /drive-thru/pull-forward-orders/{pullForwardId}/clear"
      - "POST /drive-thru/accuracy-incidents"
      - "POST /drive-thru/accuracy-incidents/{incidentId}/deliver-remake"
      - "POST /drive-thru/coaching-interventions/{coachingId}/acknowledge"
      - "POST /drive-thru/coaching-interventions/{coachingId}/contest"
    shared_operations:
