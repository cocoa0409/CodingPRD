            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "Open", min_rating: 0, max_rating: 2900, allow_provisional: true, max_entries: 10 }, as: FederationAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: FederationAdmin }
          trigger:
            - { call: "POST /api/sections/${sec}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { f1: $.data.fee_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:01Z" }, as: FederationAdmin }
            - { call: "POST /api/sections/${sec}/entries", payload: { player_id: "${p2}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { f2: $.data.fee_cents } }
          assert:
            - "At exactly the deadline: fee_cents == 932 (${f1}); one second later: fee_cents == 1035 (${f2})"
  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: validation_role_precedes_existence
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "validations[priority=3]"
        distinguishing_aspect: "Role (p2) precedes existence (p3): a ClubCoach hitting a FederationAdmin endpoint with a nonexistent parent id gets ERR_INSUFFICIENT_PERMISSIONS (403), never 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/seasons/00000000-0000-0000-0000-000000000000/activate", payload: {}, as: ClubCoach, as_user_id: "00000000-0000-0000-0000-000000000001", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403), not ERR_NOT_FOUND — got ${err}"

      - name: validation_existence_precedes_state
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=8]"
        distinguishing_aspect: "Existence (p3) precedes state (p8): completing a nonexistent meet returns ERR_NOT_FOUND (404), not a state error."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/meets/00000000-0000-0000-0000-000000000000/complete", payload: {}, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404 — got ${err}"

      - name: validation_priority_conflicts_covered
        claim_type: priority_ordering
        grounds:
          - "validations[priority=8]"
          - "validations[priority=9]"
          - "validations[priority=10]"
          - "validations[priority=11]"
          - "validations[priority=13]"
        excluded_because:
          difficulty_instance: entry_state_beats_fiscal
          rationale: "Three dual-failure priority pairs (state>fiscal, referential>constraint, integrity>temporal) asserted in §1.8 rule 5 instances entry_state_beats_fiscal, entry_referential_beats_constraint, meet_integrity_beats_temporal."

      - name: validation_duplicate_membership
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_DUPLICATE_MEMBERSHIP]"
        distinguishing_aspect: "Second membership for the same (player_id, season_id) fails ERR_DUPLICATE_MEMBERSHIP regardless of the first one's status."
        test_recipe:
          setup: ["Season ACTIVE; club A; player P with one INVOICED membership"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${sid}" }, as: FederationAdmin }
          trigger:
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${sid}" }, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_MEMBERSHIP (409) — got ${err}"

      - name: validation_duplicate_entry
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_DUPLICATE_ENTRY]"
        distinguishing_aspect: "Second non-WITHDRAWN entry for the same (section, player) fails ERR_DUPLICATE_ENTRY."
        test_recipe:
          setup: ["Season ACTIVE; fee-0 tournament REGISTRATION_OPEN with section; player P (WAIVED membership) already entered"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments", payload: { season_id: "${sid}", name: "T", start_date: "2026-10-02", end_date: "2026-10-03", entry_fee_cents: 0, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/open-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "Open", min_rating: 0, max_rating: 2900, allow_provisional: true, max_entries: 10 }, as: FederationAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/sections/${sec}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}" }
          trigger:
            - { call: "POST /api/sections/${sec}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ENTRY (409) — got ${err}"

      - name: validation_same_club_meet
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_SAME_CLUB_MEET]"
        distinguishing_aspect: "host_club_id == away_club_id is rejected ERR_SAME_CLUB_MEET at meet creation."
        test_recipe:
          setup: ["Season ACTIVE; club A"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
          trigger:
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_a}", away_club_id: "${club_a}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SAME_CLUB_MEET (409) — got ${err}"

      - name: validation_player_club_mismatch
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_PLAYER_CLUB_MISMATCH]"
        distinguishing_aspect: "White player must belong to the host club and black to the away club; a white player from the away club fails ERR_PLAYER_CLUB_MISMATCH."
        test_recipe:
          setup: ["Season ACTIVE; clubs A,B; players W (club A) and B1 (club B), memberships WAIVED; meet A(host) vs B DRAFT->SCHEDULED"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "B", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W", grade_level: 9 }, as: FederationAdmin, captures: { pw: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B1", grade_level: 9 }, as: FederationAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pw}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pb}", season_id: "${sid}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv: $.data.version } }
          trigger:
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pb}", black_player_id: "${pw}", expected_meet_version: "${mv}" }, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PLAYER_CLUB_MISMATCH (409): white ${pb} is from the away club, black ${pw} from the host club — got ${err}"

      - name: validation_already_reversed
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_ALREADY_REVERSED]"
        distinguishing_aspect: "Reversing an already-reversed entry fails ERR_ALREADY_REVERSED; a reversal entry itself can never be reversed."
        test_recipe:
          setup: ["Season ACTIVE; club A with ADJUSTMENT +1200 posted and already reversed"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 1200, memo: "seed", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1", captures: { le: $.data.id } }
            - { call: "POST /api/ledger-entries/${le}/reverse", payload: {}, as: Auditor, as_user_id: "auditor-1", captures: { rev: $.data.id } }
          trigger:
            - { call: "POST /api/ledger-entries/${le}/reverse", payload: {}, as: Auditor, as_user_id: "auditor-1", captures: { err1: $.data.error_id } }
            - { call: "POST /api/ledger-entries/${rev}/reverse", payload: {}, as: Auditor, as_user_id: "auditor-1", captures: { err2: $.data.error_id } }
          assert:
            - "Second reversal of ${le}: ERR_ALREADY_REVERSED (${err1})"
            - "Reversal of the REVERSAL row ${rev}: ERR_ALREADY_REVERSED (${err2})"

      - name: validation_provisional_not_allowed
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_PROVISIONAL_NOT_ALLOWED]"
        distinguishing_aspect: "A provisional player whose rating IS inside the band is still rejected with ERR_PROVISIONAL_NOT_ALLOWED when the section forbids provisional players — the two gates are independent."
        test_recipe:
          setup: ["Season T=4 ACTIVE; club A; brand-new player (rating 800, provisional) with WAIVED membership; fee-0 tournament REGISTRATION_OPEN; section [0,2900] allow_provisional false"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments", payload: { season_id: "${sid}", name: "T", start_date: "2026-10-02", end_date: "2026-10-03", entry_fee_cents: 0, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/open-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "Open", min_rating: 0, max_rating: 2900, allow_provisional: false, max_entries: 10 }, as: FederationAdmin, captures: { sec: $.data.id } }
          trigger:
            - { call: "POST /api/sections/${sec}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROVISIONAL_NOT_ALLOWED (409) — got ${err}"

  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: standings_computed_read
        claim_type: computed_read
        grounds:
          - "calculations.team_standings"
        distinguishing_aspect: "GET standings returns the full pinned ordering with computed literals: A (MP 3, GP 1.5, SB 1.5) ranks above B (MP 1, GP 0.5, SB 1.5) — Sonneborn-Berger ties at 1.5 but match_points decides."
        test_recipe:
          setup: ["Season ACTIVE; meet1 A(host) beats B (WHITE_WIN) COMPLETED; meet2 B(host) vs A DRAW COMPLETED"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "B", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach B", email: "cb@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "PA", grade_level: 9 }, as: FederationAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "PB", grade_level: 9 }, as: FederationAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pa}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pb}", season_id: "${sid}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet1: $.data.id } }
            - { call: "POST /api/meets/${meet1}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet1}", as: FederationAdmin, captures: { mv1: $.data.version } }
            - { call: "POST /api/meets/${meet1}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pa}", black_player_id: "${pb}", expected_meet_version: "${mv1}" }, as: FederationAdmin, captures: { g1: $.data.id } }
            - { call: "POST /api/meets/${meet1}/publish-pairings", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_a}", event_type: "MEET", meet_id: "${meet1}" }, as: FederationAdmin, captures: { asg1: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg1}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_a}" }
            - { call: "POST /api/meets/${meet1}/start", payload: {}, as: FederationAdmin }
            - { call: "POST /api/pairings/${g1}/report-result", payload: { result: "WHITE_WIN" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${g1}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "POST /api/meets/${meet1}/complete", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_b}", away_club_id: "${club_a}", scheduled_date: "2026-09-12", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet2: $.data.id } }
            - { call: "POST /api/meets/${meet2}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet2}", as: FederationAdmin, captures: { mv2: $.data.version } }
            - { call: "POST /api/meets/${meet2}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pb}", black_player_id: "${pa}", expected_meet_version: "${mv2}" }, as: FederationAdmin, captures: { g2: $.data.id } }
            - { call: "POST /api/meets/${meet2}/publish-pairings", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_b}", event_type: "MEET", meet_id: "${meet2}" }, as: FederationAdmin, captures: { asg2: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg2}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_b}" }
            - { call: "POST /api/meets/${meet2}/start", payload: {}, as: FederationAdmin }
            - { call: "POST /api/pairings/${g2}/report-result", payload: { result: "DRAW" }, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "POST /api/pairings/${g2}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/meets/${meet2}/complete", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "GET /api/seasons/${sid}/standings", as: FederationAdmin, captures: { table: $.data.standings } }
          assert:
            - "Row 1 is club ${club_a}: match_points == 3 (2 for the win + 1 for the draw), game_points == 1.5, sonneborn_berger == 1.5 (B's final MP 1 x (1 + 0.5))"
            - "Row 2 is club ${club_b}: match_points == 1, game_points == 0.5, sonneborn_berger == 1.5 (A's final MP 3 x (0 + 0.5))"
            - "SB ties at 1.5 but match_points already separates the clubs (tie-break cascade not needed past level 1)"

      - name: bids_generate_bulk_count
        claim_type: bulk_action
        grounds:
          - "calculations.qualification_bid_selection"
        distinguishing_aspect: "Bulk generation: with slots 2 and two eligible players in one region, exactly 2 INDIVIDUAL_STATE + 1 TEAM_STATE bids are created in one call; re-running generate creates zero additional bids (skip-already-offered)."
        test_recipe:
          setup: ["Season (slots 2) FINALIZING; players P1 and P2 (club A, region NE) with 6 points each via three check-ins; memberships WAIVED"]
          setup_api_calls:
