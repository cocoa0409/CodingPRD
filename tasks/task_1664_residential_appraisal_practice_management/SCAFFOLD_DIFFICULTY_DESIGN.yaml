            - "scorecard.on_time_rate == 1.0 (delivered 08-05T12:00 <= due 08-08T00:00); captured ${sc_rate}"
            - "scorecard.standing == GOOD_STANDING (completed_count 1 < MIN_COMPLETED_FOR_RATING 4); captured ${sc_standing}"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_quote_multifactor_tier_rush_addons_clamp
        grounds:
          - calculations.fee_quote
          - calculations.tier_determination
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: tier-selected base
          (COMPLEX 45000 via panel schedule), conditional rush premium
          (round_half_up(45000 * 2000bps / 10000) = 9000 because requested 3 <
          default 7), conditional property add-on (MULTI_2_4 +15000), conditional
          loan add-on (FHA +5000), then min/max clamp to [35000, 150000] —
          result 74000, reachable only when all four branches fire together.
        test_recipe:
          setup:
            - "Client default_turn_time_days 7 with COMPLEX schedule base 45000, rush 2000 bps, effective 2026-07-01"
            - "Order: MULTI_2_4 (forces COMPLEX tier), FHA, est 80000000 (below HIGH_VALUE threshold), requested_turn_days 3"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "AMC Four", client_type: AMC, contact_email: "ops@amc4.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: COMPLEX, base_fee_cents: 45000, rush_multiplier_bps: 2000, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "44 Duplex Way", property_type: MULTI_2_4, estimated_value_cents: 80000000, loan_type: FHA, requested_turn_days: 3 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /appraisal/orders/${o_id}/determine-scope"
              payload: {}
              as: FirmAdmin
              captures: { oq: $.data.fee_quoted_cents, ot: $.data.complexity_tier }
          assert:
            - "AppraisalOrder.complexity_tier == COMPLEX (MULTI_2_4 mapping); captured ${ot}"
            - "AppraisalOrder.fee_quoted_cents == 74000 == 45000 + 9000 rush + 15000 MULTI_2_4 + 5000 FHA, inside [35000, 150000] clamp; captured ${oq}"

      - name: comp_adjustment_per_line_rounding_before_summation
        grounds:
          - calculations.comparable_adjustment
        distinguishing_aspect: |
          Mode (b) — nested rounding order: adjustment lines +6000 and +6000 are
          each rounded to the nearest 10000 cents FIRST (10000 + 10000 = 20000),
          whereas sum-then-round would yield 10000; the scaffold pins per-line
          rounding, so adjusted_price_cents is 45270000, not 45260000.
        test_recipe:
          setup:
            - "Desktop STANDARD order in IN_ANALYSIS (client, schedule, appraiser, panel, assignee chain complete)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
