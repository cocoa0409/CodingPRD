              captures: { err_code: $.data.error_id }
          assert:
            - "${a1_rung} == LISTING_REMOVAL and ${a1_type} == LISTING_REMOVAL   # floor applied, override_applied false"
            - "EnforcementAction.${a1}.severity_points_applied == 2.00 and decay_exempt == true"
            - "Listing.${l1}.state == REMOVED and Listing.${l1}.removal_policy_category == RESTRICTED_PRODUCT"
            - "Seller.${s_id}.enforcement_state == WATCHLIST   # the seller-state gate permits relisting"
            - "trigger: HTTP 422 and ${err_code} == ERR_LISTING_RESTRICTED_NO_RELIST   # not ERR_INVALID_STATE"
            - "Listing.${l1}.state == REMOVED after the refusal"

      - name: validation_seller_email_uniqueness_ignores_case
        claim_type: violation_to_error
        grounds:
          - "validations.priority_120 (ERR_DUPLICATE_SELLER_EMAIL)"
          - "entities.Seller.fields.email"
        distinguishing_aspect: |
          The comparison is case-insensitive, so an upper-cased copy of an existing address is a
          duplicate even though the raw strings differ. A different local part on the same domain is
          NOT a duplicate — the constraint is on the whole address, not the domain — and the refused
          registration mints no Seller row and no RelatedAccountLink.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One seller already registered as ops@harbor-tools.example with its own signal set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_a: $.data.id }
          trigger:
            - call: "POST /sellers"
              payload: { legal_name: "Harbour Tools Ltd", email: "OPS@HARBOR-TOOLS.EXAMPLE", tax_id_hash: "TAX-HT-0002", payout_bank_token: "BANK-HT-0002", address_fingerprint: "ADDR-HT-0002" }
              as: Anonymous
              captures: { err_code: $.data.error_id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbour Tools Ltd", email: "billing@harbor-tools.example", tax_id_hash: "TAX-HT-0002", payout_bank_token: "BANK-HT-0002", address_fingerprint: "ADDR-HT-0002" }
              as: Anonymous
              captures: { s_b: $.data.id }
          assert:
            - "first call: HTTP 409 and ${err_code} == ERR_DUPLICATE_SELLER_EMAIL"
            - "second call: HTTP 201   # same domain, different local part"
            - "seller list: total_count == 2"
            - "Seller.${s_b}.root_seller_id == null   # only the email domain matched and harbor-tools.example is private, yet 0.10 < RELATED_LINK_MIN_SCORE"
            - "Seller.${s_b}.registration_risk_flag == false and Seller.${s_a}.version == 1"

      - name: validation_policy_rule_code_must_be_unique
        claim_type: violation_to_error
        grounds:
          - "validations.priority_120 (ERR_DUPLICATE_POLICY_CODE)"
          - "entities.PolicyRule.fields.code"
        distinguishing_aspect: |
          The uniqueness key is the code alone: re-using LA-DUP-1 under a different category and a
          different severity is still a duplicate, and the second rule is not created. Codes are
          compared exactly, so LA-DUP-2 is accepted.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one PolicyRule LA-DUP-1 already exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-DUP-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_1: $.data.id }
          trigger:
            - call: "POST /policy-rules"
              payload: { code: "LA-DUP-1", category: "SHIPPING_PERFORMANCE", base_severity_weight: 5.00, removal_scope: "LISTING" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_code: $.data.error_id }
            - call: "POST /policy-rules"
              payload: { code: "LA-DUP-2", category: "SHIPPING_PERFORMANCE", base_severity_weight: 5.00, removal_scope: "LISTING" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_2: $.data.id }
          assert:
            - "first call: HTTP 409 and ${err_code} == ERR_DUPLICATE_POLICY_CODE"
            - "second call: HTTP 201 and PolicyRule.${rule_2}.requires_poa == true   # the omitted default"
            - "PolicyRule.${rule_1}.category == LISTING_ACCURACY and base_severity_weight == 2.00   # untouched"
            - "policy rule list: total_count == 2"

      - name: validation_one_violation_yields_at_most_one_live_action
        claim_type: violation_to_error
        grounds:
          - "validations.priority_120 (ERR_ACTION_ALREADY_EXISTS)"
        distinguishing_aspect: |
          The at-most-one constraint counts only actions in ISSUED, ACKNOWLEDGED or UPHELD, so the
          second issuance against the same SUBSTANTIATED violation is refused with 409 rather than
          quietly re-scoring the seller: the balance stays at 2.00 instead of doubling to 4.50, which
          is exactly what a missing check would produce through the repeat factor.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-ONE-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false); one violation carried to SUBSTANTIATED and enforced once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-ONE-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-ONE-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_code: $.data.error_id }
            - call: "GET /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
