# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — NEMT, Expert tier
# 9 rule_ids x >=2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml
# §1.1-§1.7. Every setup_api_calls/trigger call is a structured object that the
# lint replays against §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claimed_forward_vs_encounter_chronological_diverge
        grounds:
          - calculations.claimed_cost_forward
          - calculations.encounter_cost_chronological
          - state_machines.TripRequest.UNBILLED_to_CLAIMED
          - state_machines.TripRequest.CLAIMED_to_ENCOUNTERED
          - entities.TripRequest.fields.claimed_cost_cents
          - entities.TripRequest.fields.encounter_cost_cents
        distinguishing_aspect: |
          Same WHEELCHAIR round-trip priced two valid ways: claimed_cost_forward uses
          scheduled_loaded_miles (10) with leg-doubling and a single final round
          (7000c), while encounter_cost_chronological replays DROPPED_OFF legs on
          odometer+dwell actuals rounding per leg (3560c+4220c=7780c). Both operate
          on TripRequest cost; the divergence is 780c.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T08:00:00Z."
            - "WHEELCHAIR RateSchedule: base 2000c, loaded 150c/mi, dwell_free 10min, dwell 50c/min."
            - "ELIGIBLE member, mobility WHEELCHAIR, home_county C1, with a BARIATRIC span covering the appointment."
            - "ACTIVE broker covering C1, max_modality STRETCHER; one AVAILABLE WHEELCHAIR driver in county C2."
            - "Round-trip will-call WHEELCHAIR trip, scheduled_loaded_miles 10, taken through COMPLETED."
            - "Outbound leg odometer 10.4mi dwell 0; return will-call leg odometer 9.8mi, ready 09:00 picked_up 09:25 (raw dwell 25 -> billable 15)."
            - "Claim then Encounter submitted."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "WHEELCHAIR", base_fare_cents: 2000, loaded_rate_cents_per_mile: 150, dwell_free_minutes: 10, dwell_cents_per_minute: 50 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-DV-1", full_name: "Dora V", mobility_level: "WHEELCHAIR", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "BARIATRIC", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerA", covered_counties: ["C1"], max_modality: "STRETCHER", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Dan D", vehicle_modality: "WHEELCHAIR", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "WHEELCHAIR", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 10, is_round_trip: true, return_is_will_call: true }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "GET /trips/${trip_id}/legs"
              payload: {}
              as: Coordinator
              captures: { ob_leg_id: "$.data[0].id", rt_leg_id: "$.data[1].id" }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
            - call: "POST /legs/${ob_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/pickup"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/dropoff"
              payload: { odometer_loaded_miles: 10.4 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-02T09:00:00Z" }
              as: Coordinator
            - call: "POST /legs/${rt_leg_id}/ready"
              payload: {}
              as: Coordinator
            - call: "POST /legs/${rt_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${rt_leg_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-02T09:25:00Z" }
              as: Coordinator
            - call: "POST /legs/${rt_leg_id}/pickup"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${rt_leg_id}/dropoff"
              payload: { odometer_loaded_miles: 9.8 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /claims"
              payload: { trip_id: "${trip_id}" }
              as: Broker
          trigger:
            - call: "POST /encounters"
              payload: { trip_id: "${trip_id}" }
              as: Auditor
          assert:
            - "TripRequest.${trip_id}.claimed_cost_cents == 7000"
            - "TripRequest.${trip_id}.encounter_cost_cents == 7780 (ready 09:00, pickup 09:25 -> raw dwell 25, billable 15)"
            - "TripRequest.${trip_id}.claimed_cost_cents != TripRequest.${trip_id}.encounter_cost_cents"

      - name: deadhead_raw_vs_billable_diverge_on_assignment
        grounds:
          - calculations.deadhead_billing
          - state_machines.TripRequest.SCHEDULED_to_ASSIGNED
          - entities.Assignment.fields.deadhead_miles
          - entities.Broker.fields.free_deadhead_miles
        distinguishing_aspect: |
          On Assignment, raw dead-head distance (12mi, stored verbatim in
          Assignment.deadhead_miles) and the billable dead-head charge diverge: the
          billable variant subtracts the broker free allowance (5mi) before
          multiplying by 80c/mi, yielding 560c rather than 960c. Different entity
          domain (Assignment) from the TripRequest cost dual-variant.
        test_recipe:
          setup:
            - "Clock 2026-03-01T08:00:00Z; AMBULATORY rate exists."
            - "ELIGIBLE AMBULATORY member home_county C1 with covering span."
            - "ACTIVE broker covering C1, free_deadhead_miles 5, 80c/mi; AVAILABLE driver in county C2; county C2->C1 distance seeded 12mi."
            - "AMBULATORY one-way trip SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-DH-1", full_name: "Hank H", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerDH", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Dee D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
          trigger:
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
              captures: { assigned_drv: $.data.assigned_driver_id }
          assert:
            - "Assignment for trip ${trip_id}: deadhead_miles == 12 (raw, unallowanced)"
            - "Billable dead-head charge computed by deadhead_billing == 560 (= (12-5)*80), NOT 960 (12*80)"
            - "TripRequest.${trip_id}.trip_status == ASSIGNED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: encounter_round_per_leg_then_sum_order
        grounds:
          - calculations.encounter_cost_chronological
          - entities.Leg.fields.odometer_loaded_miles
          - entities.Leg.fields.dwell_minutes
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: encounter cost rounds EACH leg to whole
          cents before summing (3560 + 4220 = 7780). If the implementation summed
