          - "validations[priority=20]"
        distinguishing_aspect: |
          The flat-topology cross-reference case: VendorInvoice carries TWO FKs that must agree with
          each other. Both ids resolve individually, so no 404 fires — the row is only rejectable by
          comparing BudgetLine.show_id against the invoice's show_id. The instance also pins the
