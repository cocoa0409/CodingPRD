              payload: { community_id: "${cid}", unit_number: "V1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { u1: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "V2", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
