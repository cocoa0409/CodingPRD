# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Task 2525 - Manufactured Home Transport & Set Crew
# Nine §0.5 Difficulty Rules x 2 differentiated instances = 18 instances.
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1-§1.6; every literal in
# an `assert:` line was computed by executing the referenced
# `calculations[].formula` against its declared `constants:`.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_provisional_vs_final_divergence
        grounds:
          - calculations.permit_fee_assessment
          - calculations.escort_requirement_matrix
          - state_machines.TransportPermit.FEE_PAID_to_ISSUED
          - entities.TransportPermit.fields.provisional_fee_cents
          - entities.TransportPermit.fields.final_fee_cents
          - entities.HomeSection.fields.measured_width_in
          - validations[priority=29]
        distinguishing_aspect: |
          The PROVISIONAL variant is evaluated at permit request from the section's
          DECLARED 200 in width and the permit's planned_leg_count of 2, while the
          FINAL variant is evaluated at issuance from the section's MEASURED 206 in
          width and the permit's three actual non-cancelled legs, so the same
          TransportPermit row carries provisional_fee_cents 44000 and
          final_fee_cents 50000 - a 6000-cent divergence produced by evaluation
          site, not by any change to the fee formula.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant in TX, one ACTIVE Hauler, two EscortCrews endorsed for OVERSIZE"
            - "one single-section InstallationOrder in TX; the section is DECLARED 200 in wide but MEASURED 206 in wide by plant QC, and is released to the permit desk"
            - "a TX permit requested with planned_leg_count 2, then three route legs actually created, then 2 escort reservations placed, then 50000 cents paid"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Athens", state_code: "TX", hud_plant_code: "TX-021" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/haulers"
              payload: { name: "Lone Star Toters", dot_number: "DOT-441209", insurance_expiry_date: "2027-03-31", endorsed_states: ["TX"] }
              as: NetworkAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /installations/escort-crews"
              payload: { vendor_name: "Big Load Escort A", endorsed_states: ["TX"], certified_roles: ["ESCORT", "PILOT_CAR"], endorsement_class: "OVERSIZE", buffer_minutes: 45, max_reserved_minutes: 1200 }
              as: NetworkAdmin
              captures: { esc_a_id: $.data.id }
            - call: "POST /installations/escort-crews"
              payload: { vendor_name: "Big Load Escort B", endorsed_states: ["TX"], certified_roles: ["ESCORT", "PILOT_CAR"], endorsement_class: "OVERSIZE", buffer_minutes: 45, max_reserved_minutes: 1200 }
              as: NetworkAdmin
              captures: { esc_b_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Hill Country Homes", home_model: "Titan 3266", section_count: 1, destination_state: "TX", wind_zone: "II" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 200, declared_height_in: 150, declared_length_in: 768, declared_weight_lb: 26500 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /installations/sections/${sec_id}/measure"
              payload: { measured_width_in: 206, measured_height_in: 150 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections/${sec_id}/release"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_v: $.data.version }
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_id}", state_code: "TX", planned_leg_count: 2, expected_section_version: "${sec_v}", night_move: false }
              as: PermitDesk
              captures: { permit_id: $.data.id }
            - call: "POST /installations/route-legs"
              payload: { permit_id: "${permit_id}", hauler_id: "${hauler_id}", sequence_no: 1, corridor_id: "TX-US79", state_code: "TX", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z" }
              as: PermitDesk
              captures: { leg1_id: $.data.id }
            - call: "POST /installations/route-legs"
              payload: { permit_id: "${permit_id}", hauler_id: "${hauler_id}", sequence_no: 2, corridor_id: "TX-US290", state_code: "TX", window_start: "2026-08-06T06:00:00Z", window_end: "2026-08-06T14:00:00Z" }
              as: PermitDesk
              captures: { leg2_id: $.data.id }
            - call: "POST /installations/route-legs"
              payload: { permit_id: "${permit_id}", hauler_id: "${hauler_id}", sequence_no: 3, corridor_id: "TX-FM1431", state_code: "TX", window_start: "2026-08-06T15:00:00Z", window_end: "2026-08-06T19:00:00Z" }
              as: PermitDesk
              captures: { leg3_id: $.data.id }
            - call: "POST /installations/escort-assignments"
              payload: { route_leg_id: "${leg1_id}", escort_crew_id: "${esc_a_id}", role: "ESCORT", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z" }
              as: TransportManager
              as_user_id: "${hauler_id}"
            - call: "POST /installations/escort-assignments"
              payload: { route_leg_id: "${leg2_id}", escort_crew_id: "${esc_b_id}", role: "PILOT_CAR", window_start: "2026-08-06T06:00:00Z", window_end: "2026-08-06T14:00:00Z" }
              as: TransportManager
              as_user_id: "${hauler_id}"
            - call: "POST /installations/permits/${permit_id}/pay-fee"
              payload: { amount_cents: 50000 }
              as: TransportManager
              as_user_id: "${hauler_id}"
          trigger:
            - call: "POST /installations/permits/${permit_id}/issue"
              payload: {}
              as: PermitDesk
          assert:
            - "TransportPermit.${permit_id}.provisional_fee_cents == 44000"
            - "TransportPermit.${permit_id}.final_fee_cents == 50000"
            - "TransportPermit.${permit_id}.final_fee_cents - TransportPermit.${permit_id}.provisional_fee_cents == 6000"
            - "TransportPermit.${permit_id}.permit_class == OVERSIZE"
            - "TransportPermit.${permit_id}.escort_count_required == 2"
            - "TransportPermit.${permit_id}.pilot_car_required == true"
            - "TransportPermit.${permit_id}.status == ISSUED"
            - "TransportPermit.${permit_id}.valid_until_date == \"2026-08-06\""
            - "HomeSection.${sec_id}.transit_status == DISPATCH_READY"

      - name: damage_claim_stage_vs_evidence_allocation
        grounds:
          - calculations.damage_claim_allocation
          - calculations.party_chargeback_ledger
          - state_machines.DamageClaim.UNDER_REVIEW_to_ADJUDICATED
          - entities.DamageClaim.fields.allocation_basis
          - entities.DamageClaim.fields.plant_charge_cents
          - entities.DamageClaim.fields.hauler_charge_cents
          - entities.DamageClaim.fields.installer_charge_cents
        distinguishing_aspect: |
          Two DamageClaim rows carrying byte-identical inputs (claimed_amount_cents
          100001, discovered_stage PLANT_QC, evidence points 1/1/1) diverge purely on
          allocation_basis: STAGE puts the whole approved 90001 on the plant
          (90001/0/0) while EVIDENCE splits the same 90001 three ways by
          largest-remainder into 30000/30001/30000 - a different entity domain
          (DamageClaim money allocation) from the TransportPermit fee variant above.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one Hauler, one SetCrew, one single-section order, one section"
            - "two damage claims with identical claimed_amount_cents 100001, discovered_stage PLANT_QC and evidence points 1/1/1, both moved to UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/haulers"
              payload: { name: "Desert Toter", dot_number: "DOT-771004", insurance_expiry_date: "2027-01-31", endorsed_states: ["AZ"] }
              as: NetworkAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 2860", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${order_id}", section_id: "${sec_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "PLANT_QC", claimed_amount_cents: 100001, blocks_set: false, plant_evidence_points: 1, hauler_evidence_points: 1, installer_evidence_points: 1 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { claim_a_id: $.data.id }
            - call: "POST /installations/damage-claims/${claim_a_id}/review"
              payload: { notes: "intake A" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${order_id}", section_id: "${sec_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "PLANT_QC", claimed_amount_cents: 100001, blocks_set: false, plant_evidence_points: 1, hauler_evidence_points: 1, installer_evidence_points: 1 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { claim_b_id: $.data.id }
            - call: "POST /installations/damage-claims/${claim_b_id}/review"
              payload: { notes: "intake B" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /installations/damage-claims/${claim_a_id}/adjudicate"
              payload: { allocation_basis: "STAGE" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claim_b_id}/adjudicate"
              payload: { allocation_basis: "EVIDENCE" }
              as: ClaimsAdjuster
          assert:
            - "DamageClaim.${claim_a_id}.approved_amount_cents == 90001"
            - "DamageClaim.${claim_a_id}.plant_charge_cents == 90001"
            - "DamageClaim.${claim_a_id}.hauler_charge_cents == 0"
            - "DamageClaim.${claim_a_id}.installer_charge_cents == 0"
            - "DamageClaim.${claim_b_id}.approved_amount_cents == 90001"
            - "DamageClaim.${claim_b_id}.plant_charge_cents == 30000"
            - "DamageClaim.${claim_b_id}.hauler_charge_cents == 30001"
            - "DamageClaim.${claim_b_id}.installer_charge_cents == 30000"
            - "DamageClaim.${claim_b_id}.plant_charge_cents + DamageClaim.${claim_b_id}.hauler_charge_cents + DamageClaim.${claim_b_id}.installer_charge_cents == 90001"
            - "Plant.${plant_id}.chargeback_balance_cents == 120001"
            - "Hauler.${hauler_id}.chargeback_balance_cents == 30001"
            - "SetCrew.${crew_id}.chargeback_balance_cents == 30000"
            - "Plant.${plant_id}.status == ACTIVE"
            - "Hauler.${hauler_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: escort_matrix_min_cap_over_five_inputs
        grounds:
          - calculations.escort_requirement_matrix
          - calculations.permit_fee_assessment
          - entities.TransportPermit.fields.escort_count_required
          - entities.TransportPermit.fields.pilot_car_required
          - entities.TransportPermit.fields.permit_class
          - state_machines.TransportPermit.initial_state
        distinguishing_aspect: |
          Mode (a): escort_count_required is a five-input formula (state base, two
          nested width thresholds, a height threshold and a night-move bonus) wrapped
          in a MAX_ESCORTS min cap, and the two permits in this instance sit on
          opposite sides of that cap - the KS/224 in/168 in/night/3-leg permit sums to
          6 raw increments but is clamped to 4, while the KS/200 in/150 in/day/3-leg
          permit sums to 3 and is returned uncapped, so a linear implementation
          that omits the cap returns 6 instead of 4.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant in KS and one two-section order destined for KS"
            - "section A declared and measured 224 in wide by 168 in tall; section B declared and measured 200 in wide by 150 in tall; both released to the permit desk"
            - "permit A requested for a night move over 3 planned legs; permit B requested for a day move over 3 planned legs"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Topeka", state_code: "KS", hud_plant_code: "KS-006" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Prairie Home Center", home_model: "Titan 4076", section_count: 2, destination_state: "KS", wind_zone: "III" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 224, declared_height_in: 168, declared_length_in: 900, declared_weight_lb: 31000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_a_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 2, declared_width_in: 200, declared_height_in: 150, declared_length_in: 900, declared_weight_lb: 29000, mates_to_section_id: "${sec_a_id}" }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_b_id: $.data.id }
            - call: "POST /installations/sections/${sec_a_id}/measure"
              payload: { measured_width_in: 224, measured_height_in: 168 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections/${sec_a_id}/release"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_a_v: $.data.version }
            - call: "POST /installations/sections/${sec_b_id}/measure"
              payload: { measured_width_in: 200, measured_height_in: 150 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections/${sec_b_id}/release"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_b_v: $.data.version }
          trigger:
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_a_id}", state_code: "KS", planned_leg_count: 3, expected_section_version: "${sec_a_v}", night_move: true }
              as: PermitDesk
              captures: { permit_a_id: $.data.id }
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_b_id}", state_code: "KS", planned_leg_count: 3, expected_section_version: "${sec_b_v}", night_move: false }
              as: PermitDesk
              captures: { permit_b_id: $.data.id }
          assert:
            - "TransportPermit.${permit_a_id}.permit_class == SUPERLOAD"
            - "TransportPermit.${permit_a_id}.escort_count_required == 4"
            - "TransportPermit.${permit_a_id}.pilot_car_required == true"
            - "TransportPermit.${permit_a_id}.provisional_fee_cents == 98125"
            - "TransportPermit.${permit_b_id}.permit_class == OVERSIZE"
            - "TransportPermit.${permit_b_id}.escort_count_required == 3"
            - "TransportPermit.${permit_b_id}.pilot_car_required == true"
            - "TransportPermit.${permit_b_id}.provisional_fee_cents == 56000"
            - "TransportPermit.${permit_a_id}.escort_count_required - TransportPermit.${permit_b_id}.escort_count_required == 1"
            - "TransportPermit.${permit_a_id}.status == REQUESTED"

      - name: marriage_line_round_per_joint_then_sum
        grounds:
          - calculations.marriage_line_closure_score
          - entities.MarriageJoint.fields.deviation_score
          - entities.SetJob.fields.closure_score
          - entities.SetJob.fields.closure_status
          - state_machines.SetJob.progress_status_DISPATCHED_to_SET_COMPLETE
          - validations[priority=25]
        distinguishing_aspect: |
          Mode (b): both joints carry a raw deviation of exactly 0.1250, so rounding
          each joint to 0.13 FIRST and then summing yields closure_score 0.26,
          whereas summing the raw 0.1250 values and rounding once yields 0.25 - the
          pinned order is observable as a one-cent-of-an-inch difference in a stored
          field, and each MarriageJoint.deviation_score is itself asserted at 0.13.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one ACTIVE Hauler, one licensed SetCrew"
            - "a three-section AZ order whose sections are each 168 in wide and 150 in tall, all three delivered to the site"
            - "the site passes readiness with 18 piers; a set job is booked and dispatched"
            - "two marriage joints recorded, each with gap_in 0.375, vertical_offset_in 0.0 and ridge_beam_shim_in 0.0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/haulers"
              payload: { name: "Desert Toter", dot_number: "DOT-771004", insurance_expiry_date: "2027-01-31", endorsed_states: ["AZ"] }
              as: NetworkAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 3080", section_count: 3, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 2, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000, mates_to_section_id: "${s1_id}" }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 3, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000, mates_to_section_id: "${s2_id}" }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { s3_id: $.data.id }
            - call: "POST /installations/sections/${s1_id}/measure"
              payload: { measured_width_in: 168, measured_height_in: 150 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections/${s1_id}/release"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { s1_v: $.data.version }
            - call: "POST /installations/permits"
              payload: { section_id: "${s1_id}", state_code: "AZ", planned_leg_count: 1, expected_section_version: "${s1_v}", night_move: false }
              as: PermitDesk
              captures: { p1_id: $.data.id }
            - call: "POST /installations/route-legs"
              payload: { permit_id: "${p1_id}", hauler_id: "${hauler_id}", sequence_no: 1, corridor_id: "AZ-I10", state_code: "AZ", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z" }
              as: PermitDesk
              captures: { l1_id: $.data.id }
            - call: "POST /installations/permits/${p1_id}/pay-fee"
              payload: { amount_cents: 16500 }
              as: TransportManager
              as_user_id: "${hauler_id}"
            - call: "POST /installations/permits/${p1_id}/issue"
              payload: {}
              as: PermitDesk
            - call: "POST /installations/route-legs/${l1_id}/depart"
              payload: {}
              as: TransportManager
              as_user_id: "${hauler_id}"
            - call: "POST /installations/route-legs/${l1_id}/arrive"
              payload: {}
              as: TransportManager
              as_user_id: "${hauler_id}"
            - call: "POST /installations/sections/${s2_id}/measure"
              payload: { measured_width_in: 168, measured_height_in: 150 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections/${s2_id}/release"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { s2_v: $.data.version }
            - call: "POST /installations/permits"
              payload: { section_id: "${s2_id}", state_code: "AZ", planned_leg_count: 1, expected_section_version: "${s2_v}", night_move: false }
              as: PermitDesk
              captures: { p2_id: $.data.id }
            - call: "POST /installations/route-legs"
              payload: { permit_id: "${p2_id}", hauler_id: "${hauler_id}", sequence_no: 1, corridor_id: "AZ-I10", state_code: "AZ", window_start: "2026-08-04T06:00:00Z", window_end: "2026-08-04T14:00:00Z" }
              as: PermitDesk
              captures: { l2_id: $.data.id }
            - call: "POST /installations/permits/${p2_id}/pay-fee"
              payload: { amount_cents: 16500 }
              as: TransportManager
              as_user_id: "${hauler_id}"
            - call: "POST /installations/permits/${p2_id}/issue"
              payload: {}
              as: PermitDesk
            - call: "POST /installations/route-legs/${l2_id}/depart"
              payload: {}
              as: TransportManager
              as_user_id: "${hauler_id}"
            - call: "POST /installations/route-legs/${l2_id}/arrive"
              payload: {}
              as: TransportManager
              as_user_id: "${hauler_id}"
            - call: "POST /installations/sections/${s3_id}/measure"
              payload: { measured_width_in: 168, measured_height_in: 150 }
