  # ==========================================================================
  # §1.9 SECTION 6 — ERRORS
  # ==========================================================================
  - section: errors
    instances:

      - name: err_absent_child_identifier_returns_typed_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_LOOP_NOT_FOUND]
          - errors[ERR_SLOT_NOT_FOUND]
          - errors[ERR_PULL_FORWARD_NOT_FOUND]
          - errors[ERR_INCIDENT_NOT_FOUND]
          - errors[ERR_REPORT_NOT_FOUND]
          - errors[ERR_COACHING_NOT_FOUND]
          - errors[ERR_OVERRIDE_NOT_FOUND]
          - errors[ERR_DEPLOYMENT_NOT_FOUND]
        distinguishing_aspect: "Each action path returns its OWN 404 error_id for the same absent UUID, so eight endpoints must not collapse onto one generic not-found code."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band, one SINGLE-lane store and one StaffMember, so every acting identity is legitimate and only the child identifier is absent."
            - "The absent identifier 00000000-0000-4000-8000-000000000000 is never created by any call."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Not Found Store", store_number: "C-2398-49", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Nof Braddock", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
          trigger:
            - call: "POST /drive-thru/timer-loops/00000000-0000-4000-8000-000000000000/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { e_loop: $.data.error_id }
            - call: "POST /drive-thru/merge-slots/00000000-0000-4000-8000-000000000000/commit"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { e_slot: $.data.error_id }
            - call: "POST /drive-thru/pull-forward-orders/00000000-0000-4000-8000-000000000000/park"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { e_pf: $.data.error_id }
            - call: "POST /drive-thru/accuracy-incidents/00000000-0000-4000-8000-000000000000/close"
              payload: {}
              as: AccuracyAuditor
              as_user_id: "auditor-1"
              captures: { e_inc: $.data.error_id }
            - call: "POST /drive-thru/throughput-reports/00000000-0000-4000-8000-000000000000/publish"
              payload: {}
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { e_rep: $.data.error_id }
            - call: "POST /drive-thru/coaching-interventions/00000000-0000-4000-8000-000000000000/issue"
              payload: {}
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { e_ci: $.data.error_id }
            - call: "POST /drive-thru/forecast-overrides/00000000-0000-4000-8000-000000000000/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_fo: $.data.error_id }
            - call: "POST /drive-thru/order-taker-deployments/00000000-0000-4000-8000-000000000000/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
              captures: { e_dep: $.data.error_id }
          assert:
            - "Every one of the eight responses is HTTP 404 with the envelope's error shape"
            - "${e_loop} == ERR_LOOP_NOT_FOUND"
            - "${e_slot} == ERR_SLOT_NOT_FOUND"
            - "${e_pf} == ERR_PULL_FORWARD_NOT_FOUND"
            - "${e_inc} == ERR_INCIDENT_NOT_FOUND"
            - "${e_rep} == ERR_REPORT_NOT_FOUND"
            - "${e_ci} == ERR_COACHING_NOT_FOUND"
            - "${e_fo} == ERR_OVERRIDE_NOT_FOUND"
            - "${e_dep} == ERR_DEPLOYMENT_NOT_FOUND"
            - "All eight ids are distinct — no endpoint substitutes a neighbour's code"
            - "Nothing was created: GET /drive-thru/timer-loops?restaurant_id=${r_id} and GET /drive-thru/merge-slots?restaurant_id=${r_id} both return total_count 0"

      - name: err_missing_user_id_header_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "Identity is checked before anything else: a request that names a declared role but carries no X-User-ID is 401 ERR_UNAUTHENTICATED, never 403."
        test_recipe:
          setup:
