- rule_id: non_linear_state_machine
  applies: true
  rationale: |
    §1.2 declares thirteen machines, three of which are non-linear in different ways.
    Production carries two parallel status axes (offering_status and operating_status)
    that advance independently but are cross-gated. Subscription has a bounded cure cycle
    that branches to REJECTED once cure_round_count + 1 exceeds MAX_CURE_ROUNDS. WeeklyWrap
    has a dispute/amend cycle plus a CERTIFIED -> VOID compensating exit.
  instances:
  - name: production_parallel_axes_with_offering_status_regression_cycle
    grounds:
    - '§1.2 Production.offering_status: FULLY_SUBSCRIBED -> OFFERING on rescission (cycle)'
    - '§1.2 Production.operating_status: independent axis, initial PRE_PRODUCTION'
    - '§1.2 guarded transition: operating_status may leave PRE_PRODUCTION only while offering_status == CAPITALIZED'
    - §1.1 Production.capital_raised_cents, .escrow_balance_cents
    distinguishing_aspect: |
      The offering axis must be able to move backwards (FULLY_SUBSCRIBED -> OFFERING)
      when an accepted subscription is rescinded, and then forwards again when a
      replacement subscription is accepted, all while the operating axis stays pinned at
      PRE_PRODUCTION. An implementation with a single linear status field, or one that
      treats FULLY_SUBSCRIBED as terminal, cannot complete the accept / rescind / accept
      round trip; one that couples the axes will have wrongly advanced operating_status
      when the offering filled.
    test_recipe:
      setup:
      - |-
        A production with capitalization target 120,000,000 and a unit price of
        60,000,000 (two units fill the offering). Three accredited investors each
        subscribe for one unit. Investors 1 and 2 are accepted, filling the offering;
        investor 1 is then rescinded, dropping the offering back to OFFERING; investor
        3 is then accepted, refilling it.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Belasco House
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
        as: GeneralManager
        captures:
          th: $.data.id
      - call: POST /productions
