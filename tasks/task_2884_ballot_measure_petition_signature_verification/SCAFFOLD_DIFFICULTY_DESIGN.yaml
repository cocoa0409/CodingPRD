              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA2", full_name: "Abe Archer", signature_on_file_hash: "H-VA2", registration_date: "2020-01-01T00:00:00Z", registration_status: "INACTIVE" }
