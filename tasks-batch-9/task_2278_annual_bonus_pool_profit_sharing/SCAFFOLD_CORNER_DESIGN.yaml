            - "BusinessUnitPool.${pool_id}.calibration_status == DRAFT"
            - "AccrualPeriod.${period_id}.status == OPEN"
            - "ParticipantAward.${award_id}.allocation_status == UNALLOCATED"
            - "ParticipantAward.${award_id}.payment_status == PENDING"
            - "ParticipantAward.${award_id}.eligibility_status == ELIGIBLE"
            - "ParticipantAward.${award_id}.prorated_target_cents == 4000000"
            - "ParticipantAward.${award_id}.proposed_allocation_cents == 0 and ParticipantAward.${award_id}.retraction_count == 0"

      - name: settled_plan_rejects_further_accrual_and_payout_writes
        claim_type: Terminal State Lockdown
        grounds:
          - validations.priority_69
          - validations.priority_70
          - errors.ERR_PLAN_ALREADY_SETTLED
          - errors.ERR_PAYOUT_ALREADY_EXECUTED
          - "state_machines.BonusPlan: PAID_OUT -> SETTLED"
        distinguishing_aspect: |
          SETTLED is the plan's terminal state and SETTLED is the run's: after
          settlement a new accrual period is refused 409
          ERR_PLAN_ALREADY_SETTLED and a second payout run is refused 409
          ERR_PAYOUT_ALREADY_EXECUTED (at most one run per plan), while the
