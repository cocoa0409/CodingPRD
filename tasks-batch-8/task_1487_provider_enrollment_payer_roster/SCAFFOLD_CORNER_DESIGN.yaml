            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-29T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { st_before: "$.data[0].status" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { st_at: "$.data[0].status" }
          assert:
            - "${st_before} == ATTESTED (window not yet open)"
            - "${st_at} == DUE (window opens inclusively at due_at - 30 days)"

      - name: recoupment_fee_and_variants_covered_by_difficulty
        claim_type: correct_result
        grounds:
          - calculations.recoupment_fee
          - calculations.retro_recoupment
          - calculations.enrollment_effective_date
        excluded_because:
          difficulty_instance: "combinatorial_formula / recoupment_fee_per_claim_rounding; dual_variant_calc / gross_vs_net_recoupment_variants; dual_variant_calc / effective_date_policy_divergence"
          rationale: "Correct-result, precision, and variant-divergence claims for these calculations are asserted by the named §1.8 instances."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: retro_window_boundary_on_application_create
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_RETRO_WINDOW_EXCEEDED]
        distinguishing_aspect: "At the default clock 2026-08-01 the earliest acceptable requested_effective_date is exactly 2026-05-03 (inclusive); 2026-05-02 fails with ERR_RETRO_WINDOW_EXCEEDED. Distinct payer per request so the in-flight rule does not interfere."
        test_recipe:
          setup: ["Attested provider; payers A and B"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PB", name: "Payer B", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_b: $.data.id }
          trigger:
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-05-03" }
              as: EnrollmentSpecialist
              captures: { ok_id: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_b}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-05-02" }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "Boundary value 2026-05-03 succeeds: EnrollmentApplication.${ok_id}.status == DRAFT"
            - "${err} == ERR_RETRO_WINDOW_EXCEEDED for 2026-05-02"

      - name: application_in_flight_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_APPLICATION_IN_FLIGHT]
        distinguishing_aspect: "A second application for the same (provider, payer) is rejected while the first is still in {DRAFT, SUBMITTED, PENDING_INFO}; after withdrawal the pair is free again."
        test_recipe:
          setup: ["Provider and payer exist; first application in DRAFT"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app1: $.data.id }
          trigger:
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "GROUP_LINK", requested_effective_date: "2026-09-01" }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
            - call: "POST /api/enrollment-applications/${app1}/withdraw"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "GROUP_LINK", requested_effective_date: "2026-09-01" }
              as: EnrollmentSpecialist
              captures: { app2: $.data.id }
          assert:
            - "${err} == ERR_APPLICATION_IN_FLIGHT while the first application is DRAFT"
            - "After withdrawal, creation succeeds: EnrollmentApplication.${app2}.status == DRAFT"

      - name: termination_before_effective_date_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_TERMINATION_DATE_INVALID]
        distinguishing_aspect: "termination_effective_date earlier than the record's effective_date (2026-07-01 < 2026-08-01) is rejected; the record stays ACTIVE."
        test_recipe:
          setup: ["Attested provider; approved record effective 2026-08-01"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
