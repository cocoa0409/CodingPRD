  # =========================================================================
  # Table 7 (RBAC): eight roles, role_model segregation_of_duties. Each
  # instance below pins one role's exclusive surface against the peers that
  # must be refused, or one shared operation against both of its owners, and
  # keeps the priority ladder visible: 1 before 2 before 3 before 4, and all
  # four before any existence or state check.
  # =========================================================================
  - section: rbac
    instances:
      - name: underwriting_writes_cannot_be_performed_by_claims_actuarial_or_compliance_roles
        claim_type: role_exclusive_operations
        grounds:
          - roles.UnderwritingOfficer.exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Three different peer roles are refused on three different underwriting writes, and the same calls succeed as UnderwritingOfficer - so the refusal is about the role, not about the payloads."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured CREDENTIALED to 2028-01-01, one QUOTED claims-made policy."
