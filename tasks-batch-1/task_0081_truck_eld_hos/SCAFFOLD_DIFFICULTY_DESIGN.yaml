          setup:
            - "Driver D opened one ACTIVE event on 2026-05-30 (the open/latest event, duration null). Clock advanced to 2026-06-01 so 2026-05-30 is a closed past day. A DailyLog for 2026-05-30 exists UNCERTIFIED."
          setup_api_calls:
