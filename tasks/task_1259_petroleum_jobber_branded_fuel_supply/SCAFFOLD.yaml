  - { method: POST, path: "/api/dealer-stations", description: "Create dealer station (ONBOARDING, GOOD_STANDING, COMPLIANT, exposure 0)", roles: [JobberAdmin], code: 201, input: [station_name, state_code, home_terminal_code, state_excise_tc_per_gal, "local_option_tc_per_gal?", credit_limit_cents, "credit_terms_days?"], output: DealerStation, side_effects: [] }
  - { method: GET, path: "/api/dealer-stations", description: "List stations", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "operating_status?", "credit_status?", "compliance_status?", "state_code?"], output: "DealerStation[]", side_effects: [] }
  - { method: GET, path: "/api/dealer-stations/{id}", description: "Get station (exposure, parallel statuses)", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: DealerStation, side_effects: [] }
  - { method: PATCH, path: "/api/dealer-stations/{id}", description: "Update credit terms", roles: [CreditManager], code: 200, input: ["credit_limit_cents?", "credit_terms_days?"], output: DealerStation, side_effects: ["version increments by 1", "credit band re-evaluated if limit changed"] }
  - { method: POST, path: "/api/dealer-stations/{id}/activate", description: "ONBOARDING -> ACTIVE", roles: [JobberAdmin], code: 200, input: [], output: DealerStation, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/dealer-stations/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [JobberAdmin], code: 200, input: [], output: DealerStation, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/dealer-stations/{id}/reactivate", description: "SUSPENDED -> ACTIVE", roles: [JobberAdmin], code: 200, input: [], output: DealerStation, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/dealer-stations/{id}/terminate", description: "ACTIVE/SUSPENDED -> TERMINATED (all agreements terminal)", roles: [JobberAdmin], code: 200, input: [], output: DealerStation, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/dealer-stations/{id}/restore-credit", description: "credit HOLD -> GOOD_STANDING/WATCH per band", roles: [CreditManager], code: 200, input: [], output: DealerStation, side_effects: ["version increments by 1", "credit band re-evaluated"] }

  # --- agreements ---
  - { method: POST, path: "/api/supply-agreements", description: "Create agreement (DRAFT)", roles: [JobberAdmin], code: 201, input: [station_id, term_start_date, term_end_date, committed_gallons, imaging_allowance_cents, margin_tc_per_gal, shortfall_penalty_tc_per_gal, buyout_method], output: SupplyAgreement, side_effects: [] }
  - { method: GET, path: "/api/supply-agreements", description: "List agreements", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "station_id?", "status?"], output: "SupplyAgreement[]", side_effects: [] }
  - { method: GET, path: "/api/supply-agreements/{id}", description: "Get agreement (incl. fulfilled_gallons computed on read)", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: SupplyAgreement, side_effects: [] }
  - { method: PATCH, path: "/api/supply-agreements/{id}", description: "Amend terms (OCC guarded; DRAFT or ACTIVE only)", roles: [JobberAdmin], code: 200, input: [expected_agreement_version, "committed_gallons?", "imaging_allowance_cents?", "margin_tc_per_gal?", "shortfall_penalty_tc_per_gal?", "buyout_method?"], output: SupplyAgreement, side_effects: ["increments SupplyAgreement.version by 1"] }
  - { method: POST, path: "/api/supply-agreements/{id}/activate", description: "DRAFT -> ACTIVE", roles: [JobberAdmin], code: 200, input: [], output: SupplyAgreement, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/supply-agreements/{id}/start-renewal", description: "ACTIVE -> RENEWAL_PENDING (within renewal window)", roles: [JobberAdmin], code: 200, input: [], output: SupplyAgreement, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/supply-agreements/{id}/renew", description: "RENEWAL_PENDING -> ACTIVE with new term; fulfillment incentive", roles: [JobberAdmin], code: 200, input: [new_term_start_date, new_term_end_date, "new_committed_gallons?"], output: SupplyAgreement, side_effects: ["renewal_count += 1", "renewal_credit_cents set per volume_fulfillment_pct", "version increments by 1"] }
  - { method: POST, path: "/api/supply-agreements/{id}/terminate", description: "DEFAULT_NOTICE -> TERMINATED", roles: [JobberAdmin], code: 200, input: [], output: SupplyAgreement, side_effects: ["version increments by 1"] }
  - { method: GET, path: "/api/supply-agreements/{id}/buyout-quote", description: "Computed buyout projection (both base variants + netting)", roles: [JobberAdmin, CreditManager], code: 200, input: [], output: { method: "enum", base_cents: "integer", alternate_base_cents: "integer", shortfall_penalty_cents: "integer", net_settlement_cents: "integer" }, side_effects: [] }
  - { method: POST, path: "/api/supply-agreements/{id}/initiate-buyout", description: "ACTIVE -> BUYOUT_PENDING", roles: [JobberAdmin], code: 200, input: [], output: SupplyAgreement, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/supply-agreements/{id}/execute-buyout", description: "BUYOUT_PENDING -> BOUGHT_OUT; records buyout_settlement_cents", roles: [JobberAdmin], code: 200, input: [], output: SupplyAgreement, side_effects: ["computes buyout_base_cents + buyout_net_settlement_cents", "version increments by 1"] }
  - { method: POST, path: "/api/supply-agreements/{id}/cancel-buyout", description: "BUYOUT_PENDING -> ACTIVE", roles: [JobberAdmin], code: 200, input: [], output: SupplyAgreement, side_effects: ["version increments by 1"] }

  # --- rack prices ---
  - { method: POST, path: "/api/rack-price-postings", description: "Create posting (DRAFT); effective_date must be >= clock date", roles: [PricingDesk], code: 201, input: [terminal_code, product_id, effective_date, price_tc_per_gal], output: RackPricePosting, side_effects: [] }
  - { method: GET, path: "/api/rack-price-postings", description: "List postings", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "terminal_code?", "product_id?", "effective_date?", "status?"], output: "RackPricePosting[]", side_effects: [] }
  - { method: GET, path: "/api/rack-price-postings/{id}", description: "Get posting", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: RackPricePosting, side_effects: [] }
  - { method: POST, path: "/api/rack-price-postings/{id}/post", description: "DRAFT -> POSTED; conflicts with existing POSTED for same triple", roles: [PricingDesk], code: 200, input: [], output: RackPricePosting, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/rack-price-postings/{id}/supersede", description: "POSTED -> SUPERSEDED, atomically creating replacement POSTED posting (same triple, new price; OCC guarded)", roles: [PricingDesk], code: 200, input: [expected_superseded_posting_version, new_price_tc_per_gal, effective_date], output: RackPricePosting, side_effects: ["creates replacement RackPricePosting in POSTED", "increments superseded RackPricePosting.version by 1"] }
  - { method: POST, path: "/api/rack-price-postings/{id}/discard", description: "DRAFT -> DISCARDED", roles: [PricingDesk], code: 200, input: [], output: RackPricePosting, side_effects: ["version increments by 1"] }

  # --- tanks / trucks ---
  - { method: POST, path: "/api/storage-tanks", description: "Create tank (physical=book=opening)", roles: [JobberAdmin], code: 201, input: [station_id, product_id, capacity_gallons, opening_physical_gallons, "safe_fill_pct?"], output: StorageTank, side_effects: [] }
  - { method: GET, path: "/api/storage-tanks", description: "List tanks", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "station_id?", "product_id?"], output: "StorageTank[]", side_effects: [] }
  - { method: GET, path: "/api/storage-tanks/{id}", description: "Get tank (physical, book)", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: StorageTank, side_effects: [] }
  - { method: POST, path: "/api/storage-tanks/{id}/gauge", description: "Record physical gauge reading (sets physical_gallons, physical_temp_f; recon recompute)", roles: [DealerOperator], code: 200, input: [reading_gallons, observed_temp_f], output: StorageTank, side_effects: ["version increments by 1", "open reconciliation recompute (variance flip + auto loss on flag)"] }
  - { method: POST, path: "/api/trucks", description: "Create truck", roles: [JobberAdmin], code: 201, input: [truck_code, capacity_gallons], output: Truck, side_effects: [] }
  - { method: GET, path: "/api/trucks", description: "List trucks", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", ], output: "Truck[]", side_effects: [] }

  # --- transport drops ---
  - { method: POST, path: "/api/transport-drops", description: "Create drop (PLANNED) with safety/temporal/credit gates; computes estimated_amount_cents", roles: [Dispatcher], code: 201, input: [station_id, tank_id, truck_id, product_id, planned_gallons, window_start, window_end], output: TransportDrop, side_effects: ["estimated_amount_cents computed via invoice_total_cents with planned_gallons"] }
  - { method: GET, path: "/api/transport-drops", description: "List drops", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "station_id?", "tank_id?", "truck_id?", "product_id?", "invoice_id?", "status?"], output: "TransportDrop[]", side_effects: [] }
  - { method: GET, path: "/api/transport-drops/{id}", description: "Get drop", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: TransportDrop, side_effects: [] }
  - { method: POST, path: "/api/transport-drops/{id}/schedule", description: "PLANNED -> SCHEDULED", roles: [Dispatcher], code: 200, input: [], output: TransportDrop, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/transport-drops/{id}/dispatch", description: "SCHEDULED -> EN_ROUTE", roles: [Dispatcher], code: 200, input: [], output: TransportDrop, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/transport-drops/{id}/deliver", description: "EN_ROUTE -> DELIVERED; creates ISSUED invoice priced at delivery-date POSTED price; exposure + credit band recompute", roles: [Dispatcher], code: 200, input: [delivered_gallons], output: TransportDrop, side_effects: ["Invoice created (ISSUED)", "invoice_id set", "station.current_exposure_cents recomputed", "station credit band re-evaluated", "version increments by 1"] }
  - { method: POST, path: "/api/transport-drops/{id}/fail", description: "EN_ROUTE -> DELIVERY_FAILED", roles: [Dispatcher], code: 200, input: [reason], output: TransportDrop, side_effects: ["failure_count += 1", "version increments by 1"] }
  - { method: POST, path: "/api/transport-drops/{id}/replan", description: "DELIVERY_FAILED -> PLANNED with new window/truck (OCC guarded; re-runs safety/temporal/credit gates)", roles: [Dispatcher], code: 200, input: [expected_drop_version, window_start, window_end, truck_id], output: TransportDrop, side_effects: ["estimated_amount_cents recomputed", "increments TransportDrop.version by 1"] }
  - { method: POST, path: "/api/transport-drops/{id}/reconcile", description: "DELIVERED -> RECONCILED; tank book recompute; open reconciliation recompute cascade", roles: [Dispatcher], code: 200, input: [], output: TransportDrop, side_effects: ["tank.book_inventory_gallons recomputed", "open reconciliation recompute (variance flip + auto loss on flag)", "version increments by 1"] }
  - { method: POST, path: "/api/transport-drops/{id}/cancel", description: "PLANNED/SCHEDULED -> CANCELLED", roles: [Dispatcher], code: 200, input: [], output: TransportDrop, side_effects: ["version increments by 1"] }

  # --- meter readings / losses / reconciliation ---
  - { method: POST, path: "/api/meter-readings", description: "Dealer submits totalizer reading (delta computed vs chronological predecessor; out-of-order recompute)", roles: [DealerOperator], code: 201, input: [tank_id, reading_at, totalizer_gallons], output: MeterReading, side_effects: ["neighbor delta recompute", "tank book recompute", "open reconciliation recompute"] }
  - { method: GET, path: "/api/meter-readings", description: "List readings (sorted reading_at ASC, created_at ASC)", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "tank_id?"], output: "MeterReading[]", side_effects: [] }
  - { method: GET, path: "/api/meter-readings/{id}", description: "Get reading", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: MeterReading, side_effects: [] }
  - { method: POST, path: "/api/loss-events", description: "Report loss/drive-off (REPORTED)", roles: [DealerOperator], code: 201, input: [station_id, "tank_id?", loss_type, gallons, occurred_at], output: LossEvent, side_effects: [] }
  - { method: GET, path: "/api/loss-events", description: "List loss events", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "station_id?", "tank_id?", "reconciliation_id?", "status?"], output: "LossEvent[]", side_effects: [] }
  - { method: GET, path: "/api/loss-events/{id}", description: "Get loss event", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: LossEvent, side_effects: [] }
  - { method: POST, path: "/api/loss-events/{id}/verify", description: "REPORTED/DISPUTED -> VERIFIED (deducts from tank book)", roles: [JobberAdmin], code: 200, input: [], output: LossEvent, side_effects: ["tank book recompute", "open reconciliation recompute", "version increments by 1"] }
  - { method: POST, path: "/api/loss-events/{id}/dispute", description: "REPORTED -> DISPUTED (dealer, own station only)", roles: [DealerOperator], code: 200, input: [], output: LossEvent, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/loss-events/{id}/write-off", description: "VERIFIED -> WRITTEN_OFF", roles: [JobberAdmin], code: 200, input: [], output: LossEvent, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/loss-events/{id}/void", description: "VERIFIED -> VOIDED (restores tank book — compensating action)", roles: [JobberAdmin], code: 200, input: [], output: LossEvent, side_effects: ["tank book recompute (restore)", "open reconciliation recompute", "version increments by 1"] }
  - { method: POST, path: "/api/inventory-reconciliations", description: "Open reconciliation for station+period; computes book/physical/gross/net variance; may open directly in VARIANCE_FLAGGED", roles: [JobberAdmin], code: 201, input: [station_id, period_start, period_end, "threshold_gallons?"], output: InventoryReconciliation, side_effects: ["opener_user_id recorded", "initial variance compute", "auto loss event when opening directly flagged"] }
  - { method: GET, path: "/api/inventory-reconciliations", description: "List reconciliations", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "station_id?", "status?"], output: "InventoryReconciliation[]", side_effects: [] }
  - { method: GET, path: "/api/inventory-reconciliations/{id}", description: "Get reconciliation", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: InventoryReconciliation, side_effects: [] }
  - { method: POST, path: "/api/inventory-reconciliations/{id}/resolve", description: "OPEN/VARIANCE_FLAGGED -> RESOLVED (SoD: resolver != opener; linked losses written off/voided)", roles: [JobberAdmin], code: 200, input: [resolution_note], output: InventoryReconciliation, side_effects: ["resolver_user_id recorded", "version increments by 1"] }

  # --- invoices / EFT ---
  - { method: GET, path: "/api/invoices", description: "List invoices", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "station_id?", "drop_id?", "product_id?", "status?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/api/invoices/{id}", description: "Get invoice", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/api/invoices/{id}/void", description: "ISSUED/OVERDUE -> VOID (exposure compensation; cancels SCHEDULED drafts)", roles: [CreditManager], code: 200, input: [], output: Invoice, side_effects: ["station exposure recompute", "credit band re-evaluated", "SCHEDULED drafts for invoice -> CANCELLED", "version increments by 1"] }
  - { method: POST, path: "/api/eft-drafts", description: "Schedule EFT draft for an ISSUED/OVERDUE invoice (amount snapshot)", roles: [CreditManager], code: 201, input: [invoice_id, scheduled_date], output: EFTDraft, side_effects: [] }
  - { method: GET, path: "/api/eft-drafts", description: "List drafts", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "invoice_id?", "station_id?", "status?"], output: "EFTDraft[]", side_effects: [] }
  - { method: GET, path: "/api/eft-drafts/{id}", description: "Get draft", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: EFTDraft, side_effects: [] }
  - { method: POST, path: "/api/eft-drafts/{id}/execute", description: "Execute scheduled draft; outcome SUCCEEDED settles (invoice PAID, exposure down), FAILED holds credit", roles: [CreditManager], code: 200, input: [outcome], output: EFTDraft, side_effects: ["attempts += 1", "per-outcome cascade per EFTDraft state machine", "version increments by 1"] }
  - { method: POST, path: "/api/eft-drafts/{id}/retry", description: "FAILED -> SCHEDULED with new date", roles: [CreditManager], code: 200, input: [scheduled_date], output: EFTDraft, side_effects: ["version increments by 1"] }
  - { method: POST, path: "/api/eft-drafts/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [CreditManager], code: 200, input: [], output: EFTDraft, side_effects: ["version increments by 1"] }

  # --- tax remittance ---
  - { method: POST, path: "/api/tax-remittances", description: "Open remittance for state+period (ACCRUING); due_date = period_end + 20 days", roles: [TaxAccountant], code: 201, input: [state_code, period_start, period_end], output: TaxRemittance, side_effects: [] }
  - { method: GET, path: "/api/tax-remittances", description: "List remittances", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "state_code?", "status?"], output: "TaxRemittance[]", side_effects: [] }
  - { method: GET, path: "/api/tax-remittances/{id}", description: "Get remittance", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: TaxRemittance, side_effects: [] }
  - { method: POST, path: "/api/tax-remittances/{id}/file", description: "ACCRUING -> FILED; computes gallons by category, per-line rounded tax, late penalty", roles: [TaxAccountant], code: 200, input: [], output: TaxRemittance, side_effects: ["tax_remittance_amount computed", "filed_at set", "version increments by 1"] }
  - { method: POST, path: "/api/tax-remittances/{id}/pay", description: "FILED -> PAID", roles: [TaxAccountant], code: 200, input: [], output: TaxRemittance, side_effects: ["version increments by 1"] }

  # --- brand compliance ---
  - { method: POST, path: "/api/brand-compliance-audits", description: "Record audit; result = score >= 70; drives station compliance dimension and agreement DEFAULT_NOTICE cascade", roles: [BrandInspector], code: 201, input: [station_id, audit_date, score, "deficiencies?"], output: BrandComplianceAudit, side_effects: ["station compliance transition per result", "on CURE_PERIOD->DEFAULT: station agreements ACTIVE -> DEFAULT_NOTICE"] }
  - { method: GET, path: "/api/brand-compliance-audits", description: "List audits", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: ["limit?", "offset?", "station_id?", "result?"], output: "BrandComplianceAudit[]", side_effects: [] }
  - { method: GET, path: "/api/brand-compliance-audits/{id}", description: "Get audit", roles: [JobberAdmin, PricingDesk, Dispatcher, CreditManager, TaxAccountant, BrandInspector, DealerOperator], code: 200, input: [], output: BrandComplianceAudit, side_effects: [] }

  # --- logical clock (test-driving) ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Default at startup is exactly 2026-05-01T00:00:00Z (never wall-clock). Setting the clock evaluates auto-transitions: ISSUED invoices past due_date -> OVERDUE; ACTIVE/RENEWAL_PENDING agreements past term_end_date -> EXPIRED; CURE_PERIOD stations past cure_started_at + 30 days -> DEFAULT (with agreement cascade)", roles: [JobberAdmin], code: 200, input: [to_iso8601], output: { current_utc: "datetime" }, side_effects: ["time-based auto-transitions evaluated"] }

