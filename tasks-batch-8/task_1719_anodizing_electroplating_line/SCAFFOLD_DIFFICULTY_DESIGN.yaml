            - { call: "POST /baths/${b9}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c9}", part_number: "PN-900A", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c9}", captures: { wo9a: $.data.id } }
            - { call: "POST /work-orders/${wo9a}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wo9a}/route", payload: { bath_id: "${b9}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b9}", as: LabChemist, captures: { b9_v_pre: $.data.version } }
            - { call: "POST /work-orders/${wo9a}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b9_v_pre}" }, as: LineOperator, captures: { lr9: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${c9}", part_number: "PN-900B", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c9}", captures: { wo9b: $.data.id } }
            - { call: "POST /work-orders/${wo9b}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wo9b}/route", payload: { bath_id: "${b9}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
          trigger:
            - { call: "POST /work-orders/${wo9b}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b9_v_pre}" }, as: LineOperator, captures: { err_stale: $.data.error_id } }
            - { call: "GET /baths/${b9}", as: LabChemist, captures: { b9_v_now: $.data.version } }
            - { call: "POST /work-orders/${wo9b}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b9_v_now}" }, as: LineOperator, captures: { err_occ: $.data.error_id } }
          assert:
            - "stale start rejected: error_id == ERR_STALE_VERSION (412), NOT ERR_BATH_OCCUPIED — OCC (priority 6) precedes state (priority 7)"
            - "fresh-version control start rejected: error_id == ERR_BATH_OCCUPIED (409) — proving occupancy was also independently live"

      - name: alloy_incompatibility_beats_credit_hold
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_ALLOY_BATH_INCOMPATIBLE]
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
        distinguishing_aspect: |
          Category pair (business_safety vs business_fiscal): routing an order whose alloy has no
          compatibility rule (fail-closed rejection) while its customer is on credit hold must yield
          ERR_ALLOY_BATH_INCOMPATIBLE (422, priority 8), not ERR_CUSTOMER_CREDIT_HOLD (402, priority 11).
        test_recipe:
          setup:
            - "Customer C10 with credit_hold == true; bath B10 titrated to 5.000; NO compatibility rule exists for TI64/ANODIZE/SULFURIC"
            - "WO10 (alloy TI64) prepared and ready to route"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Kappa Implants", credit_hold: true }, as: ShopManager, captures: { c10: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-10", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b10: $.data.id } }
            - { call: "POST /baths/${b10}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c10}", part_number: "PN-1000", alloy_code: "TI64", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: ShopManager, captures: { wo10: $.data.id } }
            - { call: "POST /work-orders/${wo10}/prepare", payload: {}, as: LineOperator }
          trigger:
            - { call: "POST /work-orders/${wo10}/route", payload: { bath_id: "${b10}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_safety: $.data.error_id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "TI64", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /work-orders/${wo10}/route", payload: { bath_id: "${b10}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err_fiscal: $.data.error_id } }
          assert:
            - "first route rejected: error_id == ERR_ALLOY_BATH_INCOMPATIBLE (422) — safety precedes fiscal"
            - "after rule created, same route rejected: error_id == ERR_CUSTOMER_CREDIT_HOLD (402) — proving the fiscal failure was independently live in the first attempt"

  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics and endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bath_capacity_inclusive_equality
        grounds:
          - calculations.amp_hour_consumption
          - errors[ERR_BATH_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric amp-hours on POST /work-orders/{id}/load-runs: used 450 + reserved 0 + estimate 90.0
          == capacity 540 is ALLOWED (inclusive <=); estimate 91.0 -> 541 > 540 is rejected
          ERR_BATH_CAPACITY_EXCEEDED. Distinct metric/endpoint from the thickness and discharge bounds.
        test_recipe:
          setup:
            - "Customer C11; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; bath B11 capacity 540 titrated to 5.000"
            - "WO-A11 completed one 450 Ah load (10 dm2 x 3.0 A/dm2 x 900 min) and passed inspection (no salt spray)"
            - "WO-B11 routed to B11 with a small planned estimate (25 Ah) so routing passes; actual starts use duration to steer the estimate"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Lambda Signage" }, as: ShopManager, captures: { c11: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-11", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 540 }, as: ShopManager, captures: { b11: $.data.id } }
            - { call: "POST /baths/${b11}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c11}", part_number: "PN-110A", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 1.0, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c11}", captures: { wa11: $.data.id } }
            - { call: "POST /work-orders/${wa11}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wa11}/route", payload: { bath_id: "${b11}", planned_duration_minutes: 900, planned_current_density_a_dm2: 3.0 }, as: LineOperator }
            - { call: "GET /baths/${b11}", as: LabChemist, captures: { b11_v1: $.data.version } }
            - { call: "POST /work-orders/${wa11}/load-runs", payload: { duration_minutes: 900, current_density_a_dm2: 3.0, expected_bath_version: "${b11_v1}" }, as: LineOperator, captures: { lr11a: $.data.id, est11a: $.data.estimated_amp_hours } }
            - { call: "POST /load-runs/${lr11a}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wa11}/inspections", payload: { thickness_readings_um: [13.0, 14.0, 15.0], defect_type: "NONE" }, as: QCInspector }
            - { call: "POST /work-orders", payload: { customer_id: "${c11}", part_number: "PN-110B", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 1.0, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c11}", captures: { wb11: $.data.id } }
            - { call: "POST /work-orders/${wb11}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wb11}/route", payload: { bath_id: "${b11}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
          trigger:
            - { call: "GET /baths/${b11}", as: LabChemist, captures: { b11_v2: $.data.version, b11_used: $.data.amp_hour_used } }
            - { call: "POST /work-orders/${wb11}/load-runs", payload: { duration_minutes: 540, current_density_a_dm2: 1.0, expected_bath_version: "${b11_v2}" }, as: LineOperator, captures: { lr11b: $.data.id, est90: $.data.estimated_amp_hours } }
            - { call: "POST /load-runs/${lr11b}/abort", as: LineOperator }
            - { call: "GET /baths/${b11}", as: LabChemist, captures: { b11_v3: $.data.version } }
            - { call: "POST /work-orders/${wb11}/load-runs", payload: { duration_minutes: 546, current_density_a_dm2: 1.0, expected_bath_version: "${b11_v3}" }, as: LineOperator, captures: { err_cap: $.data.error_id } }
          assert:
            - "driver load estimate == 450.0 Ah; bath amp_hour_used == 450.0 after completion"
            - "boundary start accepted: estimate 90.0, 450 + 0 + 90.0 == 540 == capacity (inclusive) -> load RUNNING"
            - "after abort, amp_hour_reserved == 0 and used still 450.0"
            - "over-boundary start rejected: estimate 91.0 (546 min x 1.0 x 10 dm2 / 60), 450 + 91.0 == 541 > 540 -> ERR_BATH_CAPACITY_EXCEEDED (409)"

      - name: thickness_spec_inclusive_bounds
        grounds:
          - calculations.thickness_acceptance
          - entities.InspectionReport.fields.thickness_ok
        distinguishing_aspect: |
          Metric micrometers on POST /work-orders/{id}/inspections: readings [12.0, 15.0, 18.0] against
          spec [12.0, 18.0] PASS (both bounds inclusive), while [11.9, 15.0, 18.0] yields
          REWORKABLE_REJECT. Distinct metric and endpoint from the amp-hour boundary.
        test_recipe:
          setup:
            - "Customer C12; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; bath B12 titrated to 5.000"
            - "WO12a and WO12b each ran one clean load to AWAITING_INSPECTION (both spec [12.0, 18.0], no salt spray)"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Mu Enclosures" }, as: ShopManager, captures: { c12: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-12", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b12: $.data.id } }
            - { call: "POST /baths/${b12}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c12}", part_number: "PN-120A", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c12}", captures: { w12a: $.data.id } }
            - { call: "POST /work-orders/${w12a}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${w12a}/route", payload: { bath_id: "${b12}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b12}", as: LabChemist, captures: { b12_v1: $.data.version } }
            - { call: "POST /work-orders/${w12a}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b12_v1}" }, as: LineOperator, captures: { lr12a: $.data.id } }
            - { call: "POST /load-runs/${lr12a}/complete", as: LineOperator }
            - { call: "POST /work-orders", payload: { customer_id: "${c12}", part_number: "PN-120B", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c12}", captures: { w12b: $.data.id } }
            - { call: "POST /work-orders/${w12b}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${w12b}/route", payload: { bath_id: "${b12}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b12}", as: LabChemist, captures: { b12_v2: $.data.version } }
            - { call: "POST /work-orders/${w12b}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b12_v2}" }, as: LineOperator, captures: { lr12b: $.data.id } }
            - { call: "POST /load-runs/${lr12b}/complete", as: LineOperator }
          trigger:
            - { call: "POST /work-orders/${w12a}/inspections", payload: { thickness_readings_um: [12.0, 15.0, 18.0], defect_type: "NONE" }, as: QCInspector, captures: { ok_a: $.data.thickness_ok, disp_a: $.data.disposition } }
            - { call: "POST /work-orders/${w12b}/inspections", payload: { thickness_readings_um: [11.9, 15.0, 18.0], defect_type: "NONE" }, as: QCInspector, captures: { ok_b: $.data.thickness_ok, disp_b: $.data.disposition, min_b: $.data.thickness_min_um } }
            - { call: "GET /work-orders/${w12a}", as: QCInspector, captures: { st_a: $.data.status } }
            - { call: "GET /work-orders/${w12b}", as: QCInspector, captures: { st_b: $.data.status } }
          assert:
            - "report A: thickness_ok == true, disposition == PASS (min 12.0 == spec_min and max 18.0 == spec_max both pass, inclusive)"
            - "work order A status == COMPLETE"
            - "report B: thickness_min_um == 11.9, thickness_ok == false, disposition == REWORKABLE_REJECT (11.9 < 12.0 by 0.1)"
            - "work order B status == REJECTED with pending_strip == true"

      - name: discharge_limit_strict_greater_than
        grounds:
          - calculations.waste_mass_accounting
          - entities.WasteSample.fields.is_exceedance
        distinguishing_aspect: |
          Metric mg/L on POST /discharge-permits/{id}/samples: a NICKEL reading of exactly 2.0 == limit
          is COMPLIANT (strict >), while 2.001 is an exceedance that flips the permit to EXCEEDED.
          Distinct metric and endpoint from thickness and amp-hours.
        test_recipe:
          setup:
            - "Permit P13 on OUTFALL-13, window [2026-08-01, 2026-08-31], NICKEL limit 2.0 mg/L, cap 500.0 g; no NICKEL baths exist (cascade is a no-op)"
          setup_api_calls:
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-13", effective_from: "2026-08-01", effective_to: "2026-08-31", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 2.0, monthly_mass_cap_g: 500.0 }] }, as: EHSOfficer, captures: { p13: $.data.id } }
          trigger:
            - { call: "POST /discharge-permits/${p13}/samples", payload: { flow_liters: 10000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 2.0 }] }, as: EHSOfficer, captures: { s1_exc: $.data.is_exceedance, s1_mass: $.data.masses_g } }
            - { call: "GET /discharge-permits/${p13}", as: EHSOfficer, captures: { p13_mid: $.data.status } }
            - { call: "POST /discharge-permits/${p13}/samples", payload: { flow_liters: 10000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 2.001 }] }, as: EHSOfficer, captures: { s2_exc: $.data.is_exceedance } }
            - { call: "GET /discharge-permits/${p13}", as: EHSOfficer, captures: { p13_end: $.data.status } }
          assert:
            - "sample 1 at exactly 2.0 mg/L: is_exceedance == false (equality compliant); masses_g.NICKEL == 20.0"
            - "permit status after sample 1 == ACTIVE"
            - "sample 2 at 2.001 mg/L: is_exceedance == true (strictly greater)"
            - "permit status after sample 2 == EXCEEDED"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: load_start_gated_by_bath_state
        grounds:
          - state_machines.WorkOrder.ROUTED_to_ROUTE_HELD
          - state_machines.PlatingBath.ACTIVE_to_QUARANTINED
          - state_machines.WorkOrder.ROUTED_to_IN_PROCESS
        distinguishing_aspect: |
          Entity pair (WorkOrder/LoadRun -> PlatingBath): quarantining the bath cascades the routed
          order to ROUTE_HELD and blocks load start with ERR_WORK_ORDER_NOT_ROUTED; releasing the bath
          restores ROUTED and the same start then succeeds. Distinct pair from the other two instances.
        test_recipe:
          setup:
            - "Customer C14; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; bath B14 titrated to 5.000; WO14 BARREL 25 dm2 routed to B14"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Nu Marine" }, as: ShopManager, captures: { c14: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-14", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b14: $.data.id } }
            - { call: "POST /baths/${b14}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c14}", part_number: "PN-1400", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c14}", captures: { wo14: $.data.id } }
            - { call: "POST /work-orders/${wo14}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wo14}/route", payload: { bath_id: "${b14}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
          trigger:
            - { call: "POST /baths/${b14}/quarantine", as: EHSOfficer, captures: { b14_q: $.data.status } }
            - { call: "GET /work-orders/${wo14}", as: LineOperator, captures: { wo14_held: $.data.status } }
            - { call: "GET /baths/${b14}", as: LabChemist, captures: { b14_vq: $.data.version } }
            - { call: "POST /work-orders/${wo14}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b14_vq}" }, as: LineOperator, captures: { err_held: $.data.error_id } }
            - { call: "POST /baths/${b14}/release-quarantine", as: EHSOfficer, captures: { b14_rel: $.data.status } }
            - { call: "GET /work-orders/${wo14}", as: LineOperator, captures: { wo14_back: $.data.status } }
            - { call: "GET /baths/${b14}", as: LabChemist, captures: { b14_vr: $.data.version } }
            - { call: "POST /work-orders/${wo14}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b14_vr}" }, as: LineOperator, captures: { lr14: $.data.id, lr14_status: $.data.status } }
          assert:
            - "after quarantine: bath QUARANTINED (cause MANUAL) and work order cascaded to ROUTE_HELD"
            - "load start while held rejected: error_id == ERR_WORK_ORDER_NOT_ROUTED (409)"
            - "after release: bath ACTIVE and work order back to ROUTED"
            - "load start after release succeeds: LoadRun status == RUNNING"

      - name: ship_gated_by_customer_credit_hold
        grounds:
          - state_machines.WorkOrder.COMPLETE_to_SHIPPED
          - entities.Customer.fields.credit_hold
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
        distinguishing_aspect: |
          Entity pair (WorkOrder -> Customer): shipping a COMPLETE order is forbidden while the owning
          Customer has credit_hold == true (402) and succeeds after the hold is lifted; the invoice is
          computed only on the successful ship. Distinct pair from bath-gating and permit-gating.
        test_recipe:
          setup:
            - "Customer C15; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; fixture F15 amort 2400; bath B15 titrated 5.000"
            - "WO15 RACK 25 dm2 spec [12,18], no masking, one clean pass -> COMPLETE"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Xi Optics" }, as: ShopManager, captures: { c15: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /fixtures", payload: { fixture_code: "RACK-15", routing_mode: "RACK", capacity_dm2: 500, purchase_cost_cents: 120000, rated_uses: 50 }, as: ShopManager, captures: { f15: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-15", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["RACK"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b15: $.data.id } }
            - { call: "POST /baths/${b15}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c15}", part_number: "PN-1500", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "RACK", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c15}", captures: { wo15: $.data.id } }
            - { call: "POST /work-orders/${wo15}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wo15}/route", payload: { bath_id: "${b15}", fixture_id: "${f15}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b15}", as: LabChemist, captures: { b15_v: $.data.version } }
            - { call: "POST /work-orders/${wo15}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b15_v}" }, as: LineOperator, captures: { lr15: $.data.id } }
            - { call: "POST /load-runs/${lr15}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wo15}/inspections", payload: { thickness_readings_um: [13.0, 14.0, 15.0], defect_type: "NONE" }, as: QCInspector, captures: { wo15_disp: $.data.disposition } }
            - { call: "GET /work-orders/${wo15}", as: LineOperator, captures: { wo15_pre: $.data.status } }
          trigger:
            - { call: "PATCH /customers/${c15}", payload: { credit_hold: true }, as: ShopManager }
            - { call: "POST /work-orders/${wo15}/ship", as: LineOperator, captures: { err_ship: $.data.error_id } }
            - { call: "PATCH /customers/${c15}", payload: { credit_hold: false }, as: ShopManager }
            - { call: "POST /work-orders/${wo15}/ship", as: LineOperator, captures: { wo15_final: $.data.status, wo15_inv: $.data.final_invoice_cents } }
          assert:
            - "WO15 reached COMPLETE before the hold (precondition state observed)"
            - "ship under credit_hold rejected: error_id == ERR_CUSTOMER_CREDIT_HOLD (402); order stays COMPLETE"
            - "after hold cleared: ship succeeds, status == SHIPPED"
            - "final_invoice_cents == 8025 (fixture 2400 x 1 run + processing 5625; no masking/discount/hazmat)"

      - name: manifest_finalize_gated_by_permit_exceedance
        grounds:
          - state_machines.WasteManifest.DRAFT_to_FINALIZED
          - state_machines.DischargePermit.ACTIVE_to_EXCEEDED
          - errors[ERR_DISCHARGE_EXCEEDANCE_HOLD]
        distinguishing_aspect: |
          Entity pair (WasteManifest -> DischargePermit): finalizing a well-formed DRAFT manifest
          (non-empty, segregated finalizer) is forbidden while any permit has exceedance_active, and
          succeeds after clear-exceedance. Distinct pair from the bath and customer gates.
        test_recipe:
          setup:
            - "Manifest M16 created by EHS user 'ehs-1' with one SLUDGE_PRESS line (100 L -> 150.0 kg)"
            - "Permit P16 ZINC limit 1.0 mg/L on OUTFALL-16; an exceeding sample (5.0 mg/L) flips it EXCEEDED"
          setup_api_calls:
            - { call: "POST /waste-manifests", payload: { generator_epa_id: "EPA-GEN-16" }, as: EHSOfficer, as_user_id: "ehs-1", captures: { m16: $.data.id, m16_v: $.data.version } }
            - { call: "POST /waste-manifests/${m16}/line-items", payload: { waste_code: "F006", source_type: "SLUDGE_PRESS", description: "Filter press cake", volume_liters: 100, expected_manifest_version: "${m16_v}" }, as: EHSOfficer, as_user_id: "ehs-1", captures: { li16: $.data.id } }
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-16", effective_from: "2026-08-01", effective_to: "2026-08-31", limits: [{ analyte_code: "ZINC", max_concentration_mg_l: 1.0, monthly_mass_cap_g: 100.0 }] }, as: EHSOfficer, captures: { p16: $.data.id } }
            - { call: "POST /discharge-permits/${p16}/samples", payload: { flow_liters: 100, readings: [{ analyte_code: "ZINC", concentration_mg_l: 5.0 }] }, as: EHSOfficer, captures: { s16_exc: $.data.is_exceedance } }
          trigger:
            - { call: "POST /waste-manifests/${m16}/finalize", as: EHSOfficer, as_user_id: "ehs-2", captures: { err_fin: $.data.error_id } }
            - { call: "POST /discharge-permits/${p16}/clear-exceedance", as: EHSOfficer }
            - { call: "POST /waste-manifests/${m16}/finalize", as: EHSOfficer, as_user_id: "ehs-2", captures: { m16_final: $.data.status, m16_fin_by: $.data.finalized_by_user_id } }
          assert:
            - "sample is_exceedance == true and permit EXCEEDED (precondition observed)"
            - "finalize during exceedance rejected: error_id == ERR_DISCHARGE_EXCEEDANCE_HOLD (409); manifest stays DRAFT"
            - "after clear-exceedance: finalize succeeds -> FINALIZED, finalized_by_user_id == 'ehs-2' (distinct from creator 'ehs-1')"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: fixture_half_open_occupancy
        grounds:
          - validations[priority=9]
          - errors[ERR_FIXTURE_OCCUPIED]
          - entities.LoadRun.fields.started_at
        distinguishing_aspect: |
          Fixture resource with HALF-OPEN occupancy [started_at, ended_at): a second load on the same
          fixture while one is RUNNING is rejected ERR_FIXTURE_OCCUPIED, but a load starting at exactly
          the previous load's ended_at (adjacent, zero gap) is ALLOWED. Contrasts with the permit
          closed-interval semantics where boundary adjacency is rejected.
        test_recipe:
          setup:
            - "Customer C17; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; two baths B17a/B17b (both RACK-capable, titrated 5.000); single RACK fixture F17"
            - "WO17a routed to B17a+F17; WO17b routed to B17b+F17; logical clock set to 2026-08-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Omicron Bikes" }, as: ShopManager, captures: { c17: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /fixtures", payload: { fixture_code: "RACK-17", routing_mode: "RACK", capacity_dm2: 500, purchase_cost_cents: 120000, rated_uses: 50 }, as: ShopManager, captures: { f17: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-17A", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["RACK"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b17a: $.data.id } }
            - { call: "POST /baths/${b17a}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-17B", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["RACK"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b17b: $.data.id } }
            - { call: "POST /baths/${b17b}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ShopManager }
            - { call: "POST /work-orders", payload: { customer_id: "${c17}", part_number: "PN-170A", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "RACK", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c17}", captures: { w17a: $.data.id } }
            - { call: "POST /work-orders/${w17a}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${w17a}/route", payload: { bath_id: "${b17a}", fixture_id: "${f17}", planned_duration_minutes: 60, planned_current_density_a_dm2: 1.0 }, as: LineOperator }
            - { call: "POST /work-orders", payload: { customer_id: "${c17}", part_number: "PN-170B", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "RACK", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c17}", captures: { w17b: $.data.id } }
            - { call: "POST /work-orders/${w17b}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${w17b}/route", payload: { bath_id: "${b17b}", fixture_id: "${f17}", planned_duration_minutes: 60, planned_current_density_a_dm2: 1.0 }, as: LineOperator }
            - { call: "GET /baths/${b17a}", as: LabChemist, captures: { b17a_v: $.data.version } }
            - { call: "POST /work-orders/${w17a}/load-runs", payload: { duration_minutes: 60, current_density_a_dm2: 1.0, expected_bath_version: "${b17a_v}" }, as: LineOperator, captures: { lr17a: $.data.id, lr17a_start: $.data.started_at } }
          trigger:
            - { call: "GET /baths/${b17b}", as: LabChemist, captures: { b17b_v1: $.data.version } }
            - { call: "POST /work-orders/${w17b}/load-runs", payload: { duration_minutes: 60, current_density_a_dm2: 1.0, expected_bath_version: "${b17b_v1}" }, as: LineOperator, captures: { err_occ: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T01:00:00Z" }, as: ShopManager }
            - { call: "POST /load-runs/${lr17a}/complete", as: LineOperator, captures: { lr17a_end: $.data.ended_at } }
            - { call: "GET /baths/${b17b}", as: LabChemist, captures: { b17b_v2: $.data.version } }
            - { call: "POST /work-orders/${w17b}/load-runs", payload: { duration_minutes: 60, current_density_a_dm2: 1.0, expected_bath_version: "${b17b_v2}" }, as: LineOperator, captures: { lr17b: $.data.id, lr17b_start: $.data.started_at } }
          assert:
            - "WO17a load started_at == 2026-08-10T00:00:00Z"
            - "WO17b start while fixture occupied rejected: error_id == ERR_FIXTURE_OCCUPIED (409)"
            - "WO17a load ended_at == 2026-08-10T01:00:00Z"
            - "WO17b start at exactly ended_at accepted (half-open boundary): LoadRun RUNNING with started_at == 2026-08-10T01:00:00Z"

      - name: permit_closed_window_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_PERMIT_WINDOW_OVERLAP]
          - entities.DischargePermit.fields.effective_from
        distinguishing_aspect: |
          Permit resource with CLOSED interval semantics [effective_from, effective_to] inclusive: a
          second permit on the same outfall starting on the first permit's LAST day shares that date and
          is rejected ERR_PERMIT_WINDOW_OVERLAP — boundary adjacency is rejected, the exact opposite of
          the fixture's half-open adjacency-allowed semantics; different resource entity.
        test_recipe:
          setup:
            - "Permit PA on OUTFALL-X with closed window [2026-08-01, 2026-08-31]"
          setup_api_calls:
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-X", effective_from: "2026-08-01", effective_to: "2026-08-31", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 2.0, monthly_mass_cap_g: 500.0 }] }, as: EHSOfficer, captures: { pa: $.data.id } }
          trigger:
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-X", effective_from: "2026-08-31", effective_to: "2026-09-30", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 2.0, monthly_mass_cap_g: 500.0 }] }, as: EHSOfficer, captures: { err_ov: $.data.error_id } }
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-X", effective_from: "2026-09-01", effective_to: "2026-09-30", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 2.0, monthly_mass_cap_g: 500.0 }] }, as: EHSOfficer, captures: { pc: $.data.id } }
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-Y", effective_from: "2026-08-15", effective_to: "2026-09-15", limits: [{ analyte_code: "ZINC", max_concentration_mg_l: 3.0, monthly_mass_cap_g: 400.0 }] }, as: EHSOfficer, captures: { pd: $.data.id } }
          assert:
            - "permit starting 2026-08-31 (PA's inclusive last day) rejected: error_id == ERR_PERMIT_WINDOW_OVERLAP (409) — closed intervals share the boundary date"
            - "permit starting 2026-09-01 (first disjoint day) accepted: 201"
            - "permit on a DIFFERENT outfall with fully overlapping dates accepted: 201 (overlap is per-outfall)"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: amp_hour_ledger_invariant
        grounds:
          - calculations.amp_hour_consumption
          - state_machines.WorkOrder.IN_PROCESS_to_ROUTED
          - entities.PlatingBath.fields.amp_hour_reserved
        distinguishing_aspect: |
          Conserved quantity: amp-hours. Invariant amp_hour_used == sum(amp_hours_consumed over
          COMPLETED runs) and amp_hour_reserved == sum(estimated over RUNNING runs) holds across a
          start/abort pair (abort is the compensating action: zero drift) and a start/complete pair.
        test_recipe:
          setup:
            - "Customer C18; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; bath B18 capacity 540 titrated 5.000; WO18 BARREL 10 dm2 routed"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Pi Hobbies" }, as: ShopManager, captures: { c18: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-18", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 540 }, as: ShopManager, captures: { b18: $.data.id } }
            - { call: "POST /baths/${b18}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c18}", part_number: "PN-1800", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 1.0, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c18}", captures: { wo18: $.data.id } }
            - { call: "POST /work-orders/${wo18}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wo18}/route", payload: { bath_id: "${b18}", planned_duration_minutes: 540, planned_current_density_a_dm2: 1.0 }, as: LineOperator }
          trigger:
            - { call: "GET /baths/${b18}", as: LabChemist, captures: { v0: $.data.version } }
            - { call: "POST /work-orders/${wo18}/load-runs", payload: { duration_minutes: 540, current_density_a_dm2: 1.0, expected_bath_version: "${v0}" }, as: LineOperator, captures: { lr18: $.data.id, est18: $.data.estimated_amp_hours } }
            - { call: "GET /baths/${b18}", as: LabChemist, captures: { res_after_start: $.data.amp_hour_reserved, used_after_start: $.data.amp_hour_used } }
            - { call: "POST /load-runs/${lr18}/abort", as: LineOperator, captures: { lr18_st: $.data.status } }
            - { call: "GET /baths/${b18}", as: LabChemist, captures: { res_after_abort: $.data.amp_hour_reserved, used_after_abort: $.data.amp_hour_used, active_after_abort: $.data.active_load_run_id, v1: $.data.version } }
            - { call: "GET /work-orders/${wo18}", as: LineOperator, captures: { wo18_st: $.data.status } }
            - { call: "POST /work-orders/${wo18}/load-runs", payload: { duration_minutes: 540, current_density_a_dm2: 1.0, expected_bath_version: "${v1}" }, as: LineOperator, captures: { lr18b: $.data.id } }
            - { call: "POST /load-runs/${lr18b}/complete", as: LineOperator }
            - { call: "GET /baths/${b18}", as: LabChemist, captures: { res_final: $.data.amp_hour_reserved, used_final: $.data.amp_hour_used } }
            - { call: "GET /work-orders/${wo18}/load-runs", as: LineOperator, captures: { runs: $.data } }
          assert:
            - "start: estimated_amp_hours == 90.0; bath amp_hour_reserved == 90.0 and amp_hour_used == 0"
            - "abort (compensation): reserved back to 0.0, used unchanged 0.0, active_load_run_id == null, work order back to ROUTED — zero drift"
            - "restart + complete: reserved == 0.0, used == 90.0 == sum of COMPLETED runs' amp_hours_consumed (aborted run contributes nothing)"
            - "load run list shows exactly one ABORTED (null amp_hours_consumed) and one COMPLETED (90.0) run"

      - name: manifest_mass_invariant
        grounds:
          - entities.WasteManifest.fields.total_mass_kg
          - entities.ManifestLineItem.fields.mass_kg
        distinguishing_aspect: |
          Conserved quantity: waste mass (kg). total_mass_kg == sum of extant line items' mass_kg
          (3-decimal half-up per line) across an add/add/remove sequence: 150.0 -> 210.0 -> 60.0 with
          exact equality to the surviving line's mass, no rounding drift. Distinct quantity type from
          the amp-hour invariant.
        test_recipe:
          setup:
            - "Manifest M19 created by EHS user 'ehs-1' in DRAFT (version captured)"
          setup_api_calls:
            - { call: "POST /waste-manifests", payload: { generator_epa_id: "EPA-GEN-19" }, as: EHSOfficer, as_user_id: "ehs-1", captures: { m19: $.data.id, m19_v0: $.data.version } }
          trigger:
            - { call: "POST /waste-manifests/${m19}/line-items", payload: { waste_code: "F006", source_type: "SLUDGE_PRESS", description: "Press cake", volume_liters: 100, expected_manifest_version: "${m19_v0}" }, as: EHSOfficer, as_user_id: "ehs-1", captures: { l1: $.data.id, l1_mass: $.data.mass_kg } }
            - { call: "GET /waste-manifests/${m19}", as: EHSOfficer, captures: { tot1: $.data.total_mass_kg, m19_v1: $.data.version } }
            - { call: "POST /waste-manifests/${m19}/line-items", payload: { waste_code: "D007", source_type: "RINSE_CONCENTRATE", description: "Rinse concentrate", volume_liters: 50, expected_manifest_version: "${m19_v1}" }, as: EHSOfficer, as_user_id: "ehs-1", captures: { l2: $.data.id, l2_mass: $.data.mass_kg } }
            - { call: "GET /waste-manifests/${m19}", as: EHSOfficer, captures: { tot2: $.data.total_mass_kg } }
            - { call: "DELETE /waste-manifests/${m19}/line-items/${l1}", as: EHSOfficer, as_user_id: "ehs-1" }
            - { call: "GET /waste-manifests/${m19}", as: EHSOfficer, captures: { tot3: $.data.total_mass_kg } }
          assert:
            - "L1 mass_kg == 150.0 (100 L x 1.5 kg/L sludge density); total after add == 150.0"
            - "L2 mass_kg == 60.0 (50 L x 1.2 kg/L rinse density); total after second add == 210.0"
            - "after DELETE of L1 (compensating action): total_mass_kg == 60.0 == L2's mass exactly — invariant total == sum of extant lines holds"


