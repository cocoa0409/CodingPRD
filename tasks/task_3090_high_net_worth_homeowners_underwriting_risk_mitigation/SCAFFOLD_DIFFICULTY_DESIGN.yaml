              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "71 Coast Rd", grid_risk_block: "COAS-A" }
              as: Underwriter
              captures: { p1_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Coastline Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 200000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { appr_id: $.data.id }
            - call: "POST /hnw/appraisals/${appr_id}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${appr_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_v303: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${p1_v303}" }
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/appraisal-documents"
              payload: { item_class: "COLLECTION", appraiser_name: "Coastline Collections", appraisal_date: "2026-08-20T00:00:00Z", appraised_value_cents: 50000000 }
              as: Underwriter
              captures: { doc1_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/scheduled-items"
              payload: { item_type: "COLLECTION", declared_value_cents: 50000000, appraisal_doc_id: "${doc1_id}" }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { si1_id: $.data.id }
            - call: "POST /hnw/scheduled-items/${si1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/appraisal-documents"
              payload: { item_class: "FINE_ART", appraiser_name: "Coastline Collections", appraisal_date: "2026-08-20T00:00:00Z", appraised_value_cents: 200000000 }
              as: Underwriter
              captures: { doc2_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/scheduled-items"
              payload: { item_type: "FINE_ART", declared_value_cents: 150000000, appraisal_doc_id: "${doc2_id}" }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { si2_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/scheduled-items"
              payload: { item_type: "FINE_ART", declared_value_cents: 150000001, appraisal_doc_id: "${doc2_id}" }
              as: AgencyProducer
