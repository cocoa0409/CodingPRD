  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (≥2 instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: proposal_submit_gated_by_capseason_open
        grounds:
          - state_machines.Proposal.DRAFT_to_SUBMITTED
          - state_machines.CapSeason.OPEN_to_LOCKED
        distinguishing_aspect: |
          Pair = Proposal -> CapSeason. A proposal submission's validity
          depends on the LINKED CapSeason being OPEN. If the CapSeason is
          LOCKED, submit is rejected with ERR_RESOURCE_LOCKED — even though
          the Proposal itself is in the correct state (DRAFT).
        test_recipe:
          setup:
            - "CapSeason created then LOCKED before any proposal submit"
            - "Contract and DRAFT Proposal exist against that CapSeason"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "DepTeam", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "DepAgency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
