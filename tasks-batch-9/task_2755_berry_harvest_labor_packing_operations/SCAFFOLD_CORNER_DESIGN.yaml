      - name: period_averaged_settlement_diverges_from_the_summed_session_view
        claim_type: dual_variant_calculation
        grounds:
          - calculations.session_pay_per_session
          - calculations.payroll_period_averaged_settlement
          - calculations.crew_wage_ledger
          - entities.PayrollRun.fields.reconciliation_delta_cents
        distinguishing_aspect: |
          The two pay variants disagree by construction and the ledger records the
          gap: two DOMESTIC sessions of 3.00 h each - one at 20 clamshells (piece
          900, made whole to 4950) and one at 200 clamshells (piece 9000, no
          make-up) - sum to 13950 under the per-session guarantee but settle at
          9900 under the period-averaged guarantee (period_hours 6.00, period floor
          9900, no make-up), so reconciliation_delta_cents is exactly -4050 on both
          the run and the crew, while accrued_gross_cents keeps the 13950 view.
        test_recipe:
          setup:
