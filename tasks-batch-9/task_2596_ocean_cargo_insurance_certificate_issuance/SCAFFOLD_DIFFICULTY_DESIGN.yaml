    instances:
      - name: vessel_state_beats_vessel_accumulation_at_issue
        category_pair: "state (priority 11) vs business_fiscal (priority 22)"
        grounds:
          - validations.priority_11_ERR_VESSEL_BLOCKED
          - validations.priority_22_ERR_VESSEL_ACCUMULATION_EXCEEDED
          - state_machines.Vessel.status.APPROVED_to_GA_HOLD
          - calculations.accumulation_exposure_check
        distinguishing_aspect: |
          One request violates BOTH the vessel insurability check (the vessel is
          GA_HOLD, priority 11, category `state`, 422
          ERR_VESSEL_BLOCKED) and the single-vessel accumulation limit (1155000
          already held + 1155000 candidate = 2310000 against a limit of
          1500000, priority 22, category `business_fiscal`, 422
          ERR_VESSEL_ACCUMULATION_EXCEEDED). The lower priority number wins, so
          the response is ERR_VESSEL_BLOCKED. The control leg proves the fiscal
          rule is genuinely reachable: an identical accumulation breach on an
          APPROVED vessel returns ERR_VESSEL_ACCUMULATION_EXCEEDED. An
          implementation that evaluates the money checks first flips the first
          leg's error_id.
