    side_effects: ["final advisor_share_cents", "DEFICIT_CARRYOVER charge on next OPEN period if net < 0", "branch.service_tier recomputed"]

  # ---- Goodwill transfers ----
  - method: POST
    path: /branch-office/goodwill-transfers
    description: Create a goodwill transfer offer on a branch.
    roles: [HomeOfficeAdmin]
    code: 201
    input: [branch_id, retiring_advisor_id, successor_advisor_id, valuation_mode, escrow_deposit_cents]
    output: GoodwillTransfer
    side_effects: ["trailing_revenue_cents and offer_price_cents computed per valuation_mode"]
  - method: GET
    path: /branch-office/goodwill-transfers/{id}
    description: Fetch one goodwill transfer.
    roles: [HomeOfficeAdmin, Advisor]
    code: 200
    input: []
    output: GoodwillTransfer
    side_effects: []
  - method: GET
    path: /branch-office/goodwill-transfers
    description: List goodwill transfers; optional successor_advisor_id filter.
    roles: [HomeOfficeAdmin, Advisor]
    code: 200
    input: ["successor_advisor_id?", "status?"]
    output: GoodwillTransfer[]
    side_effects: []
  - method: POST
    path: /branch-office/goodwill-transfers/{id}/counter-offer
    description: Counter the current offer (OCC-guarded, strict alternation).
    roles: [Advisor]
    code: 200
    input: [expected_transfer_version, offer_price_cents]
    output: GoodwillTransfer
    side_effects: ["negotiation_round += 1", "increments GoodwillTransfer.version by 1"]
  - method: POST
    path: /branch-office/goodwill-transfers/{id}/accept
    description: Accept the current offer (by the party who did not make it).
    roles: [Advisor]
    code: 200
    input: []
    output: GoodwillTransfer
    side_effects: ["escrow locked"]
  - method: POST
    path: /branch-office/goodwill-transfers/{id}/decline
    description: Decline the current offer.
    roles: [Advisor]
    code: 200
    input: []
    output: GoodwillTransfer
    side_effects: ["escrow refunded"]
  - method: POST
    path: /branch-office/goodwill-transfers/{id}/complete
    description: Complete an accepted transfer (retiring -> RETIRED, successor takes branch).
    roles: [HomeOfficeAdmin]
    code: 200
    input: []
    output: GoodwillTransfer
    side_effects: ["retiring advisor RETIRED", "successor assigned to branch", "escrow applied"]
  - method: POST
    path: /branch-office/goodwill-transfers/{id}/cancel
    description: Cancel a pending transfer (home office).
    roles: [HomeOfficeAdmin]
    code: 200
    input: []
    output: GoodwillTransfer
    side_effects: ["escrow refunded"]

  # ---- Product shelf & solicitations ----
  - method: POST
    path: /branch-office/product-shelf
    description: Propose a product shelf entry.
    roles: [CompliancePrincipal]
    code: 201
    input: [product_code, asset_class, complexity_level]
    output: ProductShelfEntry
    side_effects: []
  - method: POST
    path: /branch-office/product-shelf/{id}/approve
    description: Approve a proposed shelf entry.
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: ProductShelfEntry
    side_effects: []
  - method: POST
    path: /branch-office/product-shelf/{id}/retire
    description: Retire an approved shelf entry (terminal).
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: ProductShelfEntry
    side_effects: []
  - method: POST
    path: /branch-office/administrators/{id}/place-on-leave
    description: Place an ACTIVE administrator on leave (ACTIVE -> ON_LEAVE); branch loses FULLY_STAFFED.
    roles: [HomeOfficeAdmin]
    code: 200
    input: []
    output: BranchOfficeAdministrator
    side_effects: ["branch.staffing_status -> ADVISOR_ASSIGNED if advisor present"]
  - method: POST
    path: /branch-office/administrators/{id}/return-from-leave
    description: Return an ON_LEAVE administrator to ACTIVE.
    roles: [HomeOfficeAdmin]
    code: 200
    input: []
    output: BranchOfficeAdministrator
    side_effects: ["branch.staffing_status -> FULLY_STAFFED if advisor present"]
  - method: POST
    path: /branch-office/administrators/{id}/release
    description: Release an administrator (ACTIVE/ON_LEAVE -> RELEASED).
    roles: [HomeOfficeAdmin]
    code: 200
    input: []
    output: BranchOfficeAdministrator
    side_effects: ["administrator.branch_id cleared", "branch.staffing_status degrades"]
  - method: GET
    path: /branch-office/product-shelf
    description: List shelf entries; optional status filter.
    roles: [HomeOfficeAdmin, Advisor, CompliancePrincipal]
    code: 200
    input: ["status?"]
    output: ProductShelfEntry[]
    side_effects: []
  - method: POST
    path: /branch-office/solicitation-requests
    description: Submit a solicitation approval request.
    roles: [Advisor]
    code: 201
    input: [advisor_id, product_code, client_household_id]
    output: SolicitationRequest
    side_effects: []
  - method: POST
    path: /branch-office/solicitation-requests/{id}/approve
    description: Approve a solicitation request.
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: SolicitationRequest
    side_effects: ["decided_by_role recorded"]
  - method: POST
    path: /branch-office/solicitation-requests/{id}/deny
    description: Deny a solicitation request.
    roles: [CompliancePrincipal]
    code: 200
    input: []
    output: SolicitationRequest
    side_effects: ["decided_by_role recorded"]
  - method: POST
    path: /branch-office/solicitation-requests/{id}/withdraw
    description: Withdraw own solicitation request.
    roles: [Advisor]
    code: 200
    input: []
    output: SolicitationRequest
    side_effects: []
  - method: GET
    path: /branch-office/solicitation-requests
    description: List solicitation requests; optional advisor_id filter.
    roles: [HomeOfficeAdmin, Advisor, CompliancePrincipal]
    code: 200
    input: ["advisor_id?", "status?"]
    output: SolicitationRequest[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: /branch-office/_clock/set_current_utc
    description: |
      Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z;
      before any call to this endpoint the clock reads the default and never
      falls back to wall-clock time. Drives period close eligibility and
      goodwill-transfer expiry.
    roles: [HomeOfficeAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["expire GoodwillTransfers whose created_at + 30 days <= new clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or referenced FK does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a state from which the transition is defined."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum, or violated numeric range."
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation (email, product_code, household_address per territory)."
  - id: ERR_BRANCH_OCCUPIED
    http: 409
    condition: "Branch already has an advisor whose status is not RETIRED/TERMINATED."
  - id: ERR_BOA_ALREADY_ASSIGNED
    http: 409
    condition: "Branch already has an ACTIVE administrator."
  - id: ERR_TERRITORY_OVERLAP
    http: 409
    condition: "New half-open assignment interval intersects the current one (adjacency allowed)."
  - id: ERR_LEASE_OVERLAP
    http: 409
    condition: "New closed-interval lease intersects another SIGNED lease on the same site (adjacency conflicts)."
  - id: ERR_TERRITORY_CAPACITY
    http: 409
    condition: "Territory non-archived contact count equals household_capacity."
  - id: ERR_CONTACT_OUTSIDE_WINDOW
    http: 422
    condition: "contacted_at outside [assignment_start, assignment_end)."
  - id: ERR_PRODUCT_NOT_ON_SHELF
    http: 422
    condition: "No APPROVED ProductShelfEntry for product_code."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "COMPLEX/RESTRICTED solicitation approved by the requester's own session or a non-principal role."
  - id: ERR_NEGOTIATION_TURN
    http: 409
    condition: "Same party attempts two consecutive offers/acceptance of own offer."
  - id: ERR_ESCROW_INSUFFICIENT
    http: 422
    condition: "escrow_deposit_cents below 10% of offer_price_cents at acceptance."
  - id: ERR_PERIOD_FINALIZED
    http: 409
    condition: "Charge post attempted against a FINALIZED period."
  - id: ERR_GOAL_NOT_MET
    http: 422
    condition: "Forced PASS outcome when production_cents < goal_cents."
  - id: ERR_PERIOD_NOT_LATEST
    http: 409
    condition: "Reopen attempted on a period that is not the branch's latest."
  - id: ERR_PERIOD_NOT_CLOSABLE
    http: 422
    condition: "Close attempted before period_end."
  - id: ERR_BRANCH_NOT_FULLY_STAFFED
    http: 409
    condition: "Open/reinstate attempted while staffing_status != FULLY_STAFFED."
  - id: ERR_ADVISOR_NOT_VALIDATED
    http: 409
    condition: "Branch assignment attempted for an advisor not in VALIDATED status."
  - id: ERR_TRANSFER_ACTIVE
    http: 409
    condition: "Retirement rescind or branch close blocked by an active (OFFERED/NEGOTIATING/ACCEPTED) GoodwillTransfer."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HomeOfficeAdmin
    description: Home office operations administrator; superset operational role.
    identity: opaque
    exclusive_operations:
      - "create advisors, territories, branches, administrators, product postings (production), financial periods, charges"
      - "approve-site, open, suspend, reinstate, close branches"
      - "assign branch to advisor, assign administrator to branch, terminate advisor"
      - "enroll training, evaluate milestones, finalize/close/reopen periods"
      - "create and complete/cancel goodwill transfers"
      - "reverse production records and charges"
      - "set the logical clock"
    shared_operations:
      - "read any entity"
  - name: Advisor
    description: A financial advisor; entity-backed identity on Advisor.id.
    identity: "entity_backed:Advisor"
    exclusive_operations:
      - "declare/rescind own retirement"
      - "submit own training milestone"
      - "log door-knock contacts in own territory"
      - "submit and withdraw own solicitation requests"
      - "counter-offer, accept, decline goodwill transfers where the advisor is a party"
    shared_operations:
      - "read own advisor record, branch, territories, financial periods, transfers"
  - name: BranchAdministrator
    description: Branch office administrator; entity-backed on BranchOfficeAdministrator.id; read-only operational support.
    identity: "entity_backed:BranchOfficeAdministrator"
    exclusive_operations: []
    shared_operations:
      - "read own record and employing branch"
  - name: CompliancePrincipal
    description: Compliance principal; approves product shelf entries and solicitations.
    identity: opaque
    exclusive_operations:
      - "create and approve product shelf entries"
      - "approve or deny solicitation requests"
    shared_operations:
      - "read branches, advisors, product shelf, solicitation requests"
