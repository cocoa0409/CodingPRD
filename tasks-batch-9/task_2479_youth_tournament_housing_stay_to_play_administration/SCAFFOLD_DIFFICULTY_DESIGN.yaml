          Entity pair is Booking -> HotelContract, reached indirectly through
          RoomBlock.contract_id: the booking references a block, never the contract, yet its
          admissibility is decided by the contract's status. With the contract still NEGOTIATING
          the identical request is rejected 409 ERR_CONTRACT_NOT_EXECUTED, and a single
