scaffold_corner_design:

  # =====================================================================
  # §1.1 Entities
  # =====================================================================
  - section: entities
    instances:

      - name: create_subscription_plan_returns_201_with_all_declared_fields
        claim_type: Creation
        grounds: [entities.SubscriptionPlan, endpoints]
        distinguishing_aspect: "POST /api/subscription-plans with every required field returns 201 and echoes code, annual_fee_cents, included_release_slots, commission_bps plus system id/created_at/version."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /api/subscription-plans"
              payload: { code: "STARTER", name: "Starter", annual_fee_cents: 1200, included_release_slots: 2, commission_bps: 1500, allows_content_id: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "SubscriptionPlan.${plan_id}.code == STARTER"
            - "SubscriptionPlan.${plan_id}.annual_fee_cents == 1200"
            - "SubscriptionPlan.${plan_id}.included_release_slots == 2"
            - "SubscriptionPlan.${plan_id}.commission_bps == 1500"
            - "SubscriptionPlan.${plan_id}.status == ACTIVE"
            - "SubscriptionPlan.${plan_id}.version == 1"

      - name: get_artist_by_id_returns_stored_representation
        claim_type: Retrieval
        grounds: [entities.Artist, endpoints]
        distinguishing_aspect: "GET /api/artists/{id} returns the row exactly as stored, with lifetime_gross_cents and live_track_count both 0 for a fresh account."
        test_recipe:
          setup: ["One artist registered by PlatformAdmin."]
          setup_api_calls:
            - call: "POST /api/artists"
              payload: { display_name: "Echo", legal_name: "Echo LLC", country_code: "US", email: "echo@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
          trigger:
            - call: "GET /api/artists/${artist_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP status == 200"
            - "Artist.${artist_id}.display_name == Echo"
            - "Artist.${artist_id}.lifetime_gross_cents == 0"
            - "Artist.${artist_id}.live_track_count == 0"
            - "Artist.${artist_id}.status == ACTIVE"

      - name: list_stores_paginates_with_limit_offset_total_count_has_more
        claim_type: Listing
        grounds: [entities.Store, endpoints]
        distinguishing_aspect: "GET /api/stores with limit 2 and offset 1 over three stores returns 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup: ["Three stores exist: SPOTIFY, APPLE, YOUTUBE."]
          setup_api_calls:
            - call: "POST /api/stores"
              payload: { code: "SPOTIFY", name: "Spotify", delivery_lead_days: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/stores"
              payload: { code: "APPLE", name: "Apple Music", delivery_lead_days: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/stores"
              payload: { code: "YOUTUBE", name: "YouTube", delivery_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /api/stores"
              payload: { limit: 2, offset: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "meta pagination total_count == 3"
            - "len(data) == 2"
            - "has_more == false"

      - name: get_release_with_unknown_uuid_returns_not_found
        claim_type: Not Found
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_RESOURCE_NOT_FOUND]"
        distinguishing_aspect: "GET /api/releases/{id} for a syntactically valid but unknown UUID returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /api/releases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistributionOps
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_store_missing_required_field_rejected_with_validation_error
        claim_type: Required Fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /api/stores omitting the required delivery_lead_days returns 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /api/stores"
              payload: { code: "TIDAL", name: "Tidal" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_VALIDATION"
            - "GET /api/stores returns total_count == 0"

      - name: store_optional_fields_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds: [entities.Store.fields.surcharge_bps, entities.Store.fields.max_concurrent_deliveries, entities.Store.fields.requires_isrc]
        distinguishing_aspect: "Omitting supports_pre_save, requires_isrc, requires_explicit_flag, surcharge_bps and max_concurrent_deliveries yields false/true/true/0/2 respectively."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /api/stores"
              payload: { code: "DEEZER", name: "Deezer", delivery_lead_days: 4 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { store_id: $.data.id }
          assert:
            - "Store.${store_id}.supports_pre_save == false"
            - "Store.${store_id}.requires_isrc == true"
            - "Store.${store_id}.requires_explicit_flag == true"
            - "Store.${store_id}.surcharge_bps == 0"
            - "Store.${store_id}.max_concurrent_deliveries == 2"
            - "Store.${store_id}.status == ACTIVE"

      - name: collaborator_withholding_bps_is_computed_and_client_value_ignored
        claim_type: Computed Fields
        grounds: [entities.Collaborator.fields.withholding_bps, calculations.collaborator_withholding_bps]
        distinguishing_aspect: "A newly created US collaborator with tax_form_status VERIFIED gets withholding_bps 0 from the calculation, and a MISSING-form collaborator gets 2400; neither value is client-supplied."
        test_recipe:
          setup: ["Artist NIMBUS exists with an ACTIVE PRO subscription."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Nimbus", legal_name: "Nimbus LLC", country_code: "US", email: "nimbus@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-nimbus-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "Verified US", email: "vus@example.com", country_code: "US", tax_form_status: "VERIFIED" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { c_us: $.data.id }
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "No Form", email: "noform@example.com", country_code: "DE" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { c_none: $.data.id }
          assert:
            - "Collaborator.${c_us}.withholding_bps == 0"
            - "Collaborator.${c_none}.tax_form_status == MISSING"
            - "Collaborator.${c_none}.withholding_bps == 2400"

      - name: release_system_fields_generated_and_client_input_ignored
        claim_type: System Fields
        grounds: [entities.Release.fields.status, entities.Release.fields.delivery_status, entities.Release.fields.pre_save_count]
        distinguishing_aspect: "POST /api/releases mints id/created_at/version server-side and forces status DRAFT, delivery_status NONE and pre_save_count 0 regardless of what the client sends."
        test_recipe:
          setup: ["Artist STRATUS on an ACTIVE PRO subscription."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Stratus", legal_name: "Stratus LLC", country_code: "US", email: "stratus@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-stratus-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "Cloudbank", release_date: "2026-09-01T00:00:00Z", primary_genre: "Downtempo", label_name: "Stratus Rec" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { release_id: $.data.id }
          assert:
            - "Release.${release_id}.status == DRAFT"
            - "Release.${release_id}.delivery_status == NONE"
            - "Release.${release_id}.pre_save_count == 0"
            - "Release.${release_id}.pre_save_enabled == false"
            - "Release.${release_id}.version == 1"
            - "Release.${release_id}.upc == null"

      - name: create_artist_with_malformed_country_code_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_VALIDATION]"
          - "entities.Artist.fields.country_code"
        distinguishing_aspect: "country_code 'usa' violates the exactly-2-uppercase-letters constraint and returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /api/artists"
              payload: { display_name: "Bad", legal_name: "Bad LLC", country_code: "usa", email: "bad@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_VALIDATION"

      - name: royalty_line_is_immutable_append_only_with_no_version_field
        claim_type: Immutability
        grounds: [entities.RoyaltyLine, endpoints]
        distinguishing_aspect: "RoyaltyLine is declared common_fields: false — §1.5 exposes only GET reads for it, so an ingested line carries id and created_at but no version and no update endpoint."
        test_recipe:
          setup:
            - "Artist CIRRUS with one track and a statement over [2026-05-01, 2026-06-01) holding one ingested line."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/stores"
              payload: { code: "SPOTIFY", name: "Spotify", delivery_lead_days: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { store_spot: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Cirrus", legal_name: "Cirrus LLC", country_code: "US", email: "cirrus@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-cirrus-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "Wisps", release_date: "2026-09-01T00:00:00Z", primary_genre: "Ambient", label_name: "Cirrus Rec" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { release_id: $.data.id }
            - call: "POST /api/releases/${release_id}/tracks"
              payload: { title: "Thread", duration_seconds: 180, track_number: 1, isrc: "USCIR2600001", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_a: $.data.id }
            - call: "POST /api/royalty-statements"
              payload: { artist_id: "${artist_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { stmt_id: $.data.id, stmt_v: $.data.version }
            - call: "POST /api/royalty-statements/${stmt_id}/ingest"
              payload:
                expected_statement_version: "${stmt_v}"
                lines:
                  - { track_id: "${track_a}", store_id: "${store_spot}", units: 100, gross_cents: 500, source: "STREAMING", reported_at: "2026-05-05T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
          trigger:
            - call: "GET /api/royalty-lines"
              payload: { royalty_statement_id: "${stmt_id}" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { line_id: "$.data[0].id" }
          assert:
            - "GET /api/royalty-lines?royalty_statement_id=${stmt_id} returns exactly 1 row"
            - "RoyaltyLine.${line_id}.gross_cents == 500"
            - "RoyaltyLine.${line_id}.source == STREAMING"
            - "The RoyaltyLine payload exposes id and created_at but no version field"
            - "RoyaltyStatement.${stmt_id}.line_count == 1"

      - name: create_track_under_nonexistent_release_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_RESOURCE_NOT_FOUND]"
          - "entities.Track.fields.release_id"
        distinguishing_aspect: "POST /api/releases/{id}/tracks with an unknown release id returns 404 ERR_RESOURCE_NOT_FOUND before any body validation runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/artists"
              payload: { display_name: "Ghost", legal_name: "Ghost LLC", country_code: "US", email: "ghost@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
          trigger:
            - call: "POST /api/releases/00000000-0000-4000-8000-000000000001/tracks"
              payload: { title: "Nowhere", duration_seconds: 100, track_number: 1 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: graph_topology_split_share_junction_links_sheet_and_collaborator
        claim_type: Creation
        grounds: [entities.SplitShare, entities.SplitShare.fields.split_sheet_id, entities.SplitShare.fields.collaborator_id]
        distinguishing_aspect: "SplitShare is the many-to-many junction of the graph topology: the same collaborator can hold shares on two different sheets, and both are reachable by filtered list from either side."
        test_recipe:
          setup:
            - "Artist AQUILA with two tracks, one DRAFT sheet per track, and one collaborator holding a 10000 bps share on each sheet."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Aquila", legal_name: "Aquila LLC", country_code: "US", email: "aquila@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-aquila-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "Eagle", release_date: "2026-09-01T00:00:00Z", primary_genre: "Rock", label_name: "Aquila Rec" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { release_id: $.data.id }
            - call: "POST /api/releases/${release_id}/tracks"
              payload: { title: "Talon", duration_seconds: 180, track_number: 1, isrc: "USAQU2600001", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_a: $.data.id, track_a_v: $.data.version }
            - call: "POST /api/releases/${release_id}/tracks"
              payload: { title: "Wing", duration_seconds: 200, track_number: 2, isrc: "USAQU2600002", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_b: $.data.id, track_b_v: $.data.version }
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "Shared", email: "shared@example.com", country_code: "US", tax_form_status: "VERIFIED" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { c1: $.data.id }
            - call: "POST /api/split-sheets"
              payload: { track_id: "${track_a}", effective_from: "2026-01-01T00:00:00Z", expected_track_version: "${track_a_v}" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sheet_a: $.data.id }
            - call: "POST /api/split-sheets"
              payload: { track_id: "${track_b}", effective_from: "2026-01-01T00:00:00Z", expected_track_version: "${track_b_v}" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sheet_b: $.data.id }
          trigger:
            - call: "POST /api/split-sheets/${sheet_a}/shares"
              payload: { collaborator_id: "${c1}", share_bps: 10000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_a: $.data.id }
            - call: "POST /api/split-sheets/${sheet_b}/shares"
              payload: { collaborator_id: "${c1}", share_bps: 10000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_b: $.data.id }
          assert:
            - "GET /api/split-shares?collaborator_id=${c1} returns exactly 2 rows"
            - "GET /api/split-shares?split_sheet_id=${sheet_a} returns exactly 1 row whose id == ${share_a}"
            - "GET /api/split-shares?split_sheet_id=${sheet_b} returns exactly 1 row whose id == ${share_b}"
            - "SplitSheet.${sheet_a}.total_share_bps == 10000"
            - "SplitSheet.${sheet_b}.total_share_bps == 10000"

      - name: duplicate_track_number_within_release_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_DUPLICATE_IDENTIFIER]"
          - "entities.Track.fields.track_number"
        distinguishing_aspect: "track_number is unique per release_id: adding a second track with track_number 1 to the same release returns 409 ERR_DUPLICATE_IDENTIFIER."
        test_recipe:
          setup: ["Artist LACERTA with a DRAFT release already holding a track at track_number 1."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Lacerta", legal_name: "Lacerta LLC", country_code: "US", email: "lacerta@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-lacerta-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/releases"
