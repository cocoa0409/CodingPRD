  - rule_id: resource_temporal_overlap
    instances:
      - name: pump_half_open_interval_booking
        grounds:
          - errors[ERR_PUMP_DOUBLE_BOOKED]
          - entities.FieldSample.fields.start_minute
        distinguishing_aspect: |
          Resource = Pump; interval semantics = HALF-OPEN [start_minute, start_minute+duration)
          on the same collection_date. A second booking starting exactly at the first's end
          (720 == 720) is accepted; one minute earlier (719) is rejected with ERR_PUMP_DOUBLE_BOOKED.
