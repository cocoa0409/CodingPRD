  # ---- logical clock -------------------------------------------------------
  - method: POST
    path: /festival-ops/_clock/set_current_utc
    description: "Set the logical clock used by every temporal rule in this API."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs, ProductionManager, FinanceController]
    input: [current_utc]
    output: "{ current_utc: string }"
    success_code: 200
    side_effects:
      - "The logical clock defaults to 2026-08-01T00:00:00Z when this endpoint has never been called."
      - "Every date and instant comparison in §1.3 and §1.4 (offer expiry, release window, reveal due, deposit tiering, days_until_show) reads this clock, never wall-clock time."
      - "Setting the clock does not itself sweep offers, release installments or publish waves; those remain explicit calls."

# =============================================================================
# §1.6 Error Code Catalog
# Every id below is reachable from at least one endpoint in §1.5.
# =============================================================================
errors:

  # -- auth / shape ----------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-Id or X-User-Role missing, empty, or X-User-Role not one of the five declared roles"
    applies_to: ["all"]
  - id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "X-User-Role is valid but absent from the endpoint's roles list"
    applies_to: ["all"]
  - id: ERR_ARTIST_SCOPE_VIOLATION
    http_status: 403
    condition: "ArtistRep whose X-User-Id is not the artist_id of the addressed row"
    applies_to: ["all ArtistRep-reachable endpoints addressing an artist-owned row"]
  - id: ERR_INVALID_REQUEST
    http_status: 422
    condition: "Missing required body field, wrong JSON type, unknown enum member, negative integer where non-negative is required, malformed ISO-8601 date or instant"
    applies_to: ["all"]
  - id: ERR_INVALID_PAGINATION
    http_status: 400
    condition: "limit outside 1..100 or offset < 0"
    applies_to: ["all list endpoints"]

  # -- existence -------------------------------------------------------------
  - id: ERR_FESTIVAL_NOT_FOUND
    http_status: 404
    condition: "festival path parameter or body festival_id does not resolve"
    applies_to: ["GET /festival-ops/festivals/{id}", "POST /festival-ops/festivals/{id}/allocate-tiers", "POST /festival-ops/festivals/{id}/advance-phase", "GET /festival-ops/festivals/{id}/budget-summary", "GET /festival-ops/festivals/{id}/budget-tiers", "GET /festival-ops/festivals/{id}/stages", "POST /festival-ops/budget-tiers", "POST /festival-ops/stages", "POST /festival-ops/offers", "POST /festival-ops/announcement-waves"]
  - id: ERR_BUDGET_TIER_NOT_FOUND
    http_status: 404
    condition: "budget tier path parameter or body budget_tier_id does not resolve"
    applies_to: ["GET /festival-ops/budget-tiers/{id}", "POST /festival-ops/offers"]
  - id: ERR_STAGE_NOT_FOUND
    http_status: 404
    condition: "stage path parameter or body stage_id does not resolve"
    applies_to: ["GET /festival-ops/stages/{id}", "POST /festival-ops/offers"]
  - id: ERR_ARTIST_NOT_FOUND
    http_status: 404
    condition: "artist path parameter or body artist_id does not resolve"
    applies_to: ["GET /festival-ops/artists/{id}", "GET /festival-ops/artists/{id}/radius-risk", "POST /festival-ops/offers", "POST /festival-ops/competing-performances"]
  - id: ERR_OFFER_NOT_FOUND
    http_status: 404
    condition: "offer path parameter does not resolve"
    applies_to: ["GET /festival-ops/offers/{id}", "POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/counter", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept", "POST /festival-ops/offers/{id}/decline"]
  - id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    condition: "booking path parameter or body booking_id / replaces_booking_id does not resolve"
    applies_to: ["GET /festival-ops/bookings/{id}", "GET /festival-ops/bookings/{id}/rider-estimate", "GET /festival-ops/bookings/{id}/settlement", "POST /festival-ops/bookings/{id}/rider-items", "GET /festival-ops/bookings/{id}/rider-items", "GET /festival-ops/bookings/{id}/advance-packets", "GET /festival-ops/bookings/{id}/payment-installments", "POST /festival-ops/bookings/{id}/countersign", "PATCH /festival-ops/bookings/{id}/guarantee-amendment", "POST /festival-ops/bookings/{id}/cancel", "POST /festival-ops/advance-packets", "POST /festival-ops/offers", "POST /festival-ops/announcement-waves/{id}/assignments"]
  - id: ERR_RADIUS_CLAUSE_NOT_FOUND
    http_status: 404
    condition: "radius clause path parameter does not resolve"
    applies_to: ["GET /festival-ops/radius-clauses/{id}", "POST /festival-ops/radius-clauses/{id}/waiver-request", "POST /festival-ops/radius-clauses/{id}/waiver-decision"]
  - id: ERR_COMPETING_PERFORMANCE_NOT_FOUND
    http_status: 404
    condition: "competing performance path parameter or body competing_performance_id does not resolve"
    applies_to: ["GET /festival-ops/competing-performances/{id}", "POST /festival-ops/competing-performances/{id}/adjudicate", "POST /festival-ops/radius-clauses/{id}/waiver-request"]
  - id: ERR_RIDER_ITEM_NOT_FOUND
    http_status: 404
    condition: "rider item path parameter does not resolve"
    applies_to: ["GET /festival-ops/rider-items/{id}", "POST /festival-ops/rider-items/{id}/decision"]
  - id: ERR_ADVANCE_PACKET_NOT_FOUND
    http_status: 404
    condition: "advance packet path parameter does not resolve"
    applies_to: ["GET /festival-ops/advance-packets/{id}", "POST /festival-ops/advance-packets/{id}/submit", "POST /festival-ops/advance-packets/{id}/return", "POST /festival-ops/advance-packets/{id}/approve"]
  - id: ERR_PAYMENT_INSTALLMENT_NOT_FOUND
    http_status: 404
    condition: "payment installment path parameter does not resolve"
    applies_to: ["GET /festival-ops/payment-installments/{id}", "POST /festival-ops/payment-installments/{id}/release", "POST /festival-ops/payment-installments/{id}/mark-paid", "POST /festival-ops/payment-installments/{id}/clawback"]
  - id: ERR_ANNOUNCEMENT_WAVE_NOT_FOUND
    http_status: 404
    condition: "announcement wave path parameter does not resolve"
    applies_to: ["GET /festival-ops/announcement-waves/{id}", "POST /festival-ops/announcement-waves/{id}/assignments", "POST /festival-ops/announcement-waves/{id}/lock", "POST /festival-ops/announcement-waves/{id}/publish"]
  - id: ERR_FESTIVAL_MISMATCH
    http_status: 409
    condition: "Body FKs each exist but belong to different festivals"
    applies_to: ["POST /festival-ops/offers", "POST /festival-ops/announcement-waves/{id}/assignments"]

  # -- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_FESTIVAL_VERSION
    http_status: 412
    condition: "expected_festival_version != Festival.version"
    applies_to: ["POST /festival-ops/festivals/{id}/allocate-tiers"]
  - id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    condition: "expected_booking_version != Booking.version"
    applies_to: ["PATCH /festival-ops/bookings/{id}/guarantee-amendment"]
  - id: ERR_STALE_WAVE_VERSION
    http_status: 412
    condition: "expected_announcement_wave_version != AnnouncementWave.version"
    applies_to: ["POST /festival-ops/announcement-waves/{id}/assignments"]

  # -- uniqueness ------------------------------------------------------------
  - id: ERR_DUPLICATE_TIER_CODE
    http_status: 409
    condition: "(festival_id, tier_code) or (festival_id, tier_rank) already exists"
    applies_to: ["POST /festival-ops/budget-tiers"]
  - id: ERR_DUPLICATE_STAGE_NAME
    http_status: 409
    condition: "(festival_id, name) already exists"
    applies_to: ["POST /festival-ops/stages"]
  - id: ERR_DUPLICATE_ARTIST_NAME
    http_status: 409
    condition: "performing_name already exists"
    applies_to: ["POST /festival-ops/artists"]
  - id: ERR_DUPLICATE_WAVE_NUMBER
    http_status: 409
    condition: "(festival_id, wave_number) already exists"
    applies_to: ["POST /festival-ops/announcement-waves"]

  # -- state -----------------------------------------------------------------
  - id: ERR_OFFER_NOT_NEGOTIABLE
    http_status: 409
    condition: "Offer.status does not admit the requested transition (including terminal ACCEPTED, DECLINED, EXPIRED, SUPERSEDED and repeat calls)"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/counter", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept", "POST /festival-ops/offers/{id}/decline"]
  - id: ERR_INVALID_BOOKING_STATE
    http_status: 409
    condition: "Booking.contract_status or settlement_status does not admit the requested transition (CANCELLED and CLOSED_OUT are terminal)"
    applies_to: ["POST /festival-ops/bookings/{id}/rider-items", "POST /festival-ops/bookings/{id}/countersign", "PATCH /festival-ops/bookings/{id}/guarantee-amendment", "POST /festival-ops/bookings/{id}/cancel", "POST /festival-ops/announcement-waves/{id}/assignments"]
  - id: ERR_INVALID_CLAUSE_STATE
    http_status: 409
    condition: "RadiusClause.enforcement_status or waiver_status does not admit the requested transition (RELEASED is terminal; a second waiver-request on a REQUESTED clause is refused)"
    applies_to: ["POST /festival-ops/radius-clauses/{id}/waiver-request", "POST /festival-ops/radius-clauses/{id}/waiver-decision"]
  - id: ERR_PERFORMANCE_ALREADY_ADJUDICATED
    http_status: 409
    condition: "CompetingPerformance.status is not REPORTED"
    applies_to: ["POST /festival-ops/competing-performances/{id}/adjudicate"]
  - id: ERR_RIDER_ITEM_ALREADY_DECIDED
    http_status: 409
    condition: "RiderItem.approval_status is not PROPOSED"
    applies_to: ["POST /festival-ops/rider-items/{id}/decision"]
  - id: ERR_INVALID_ADVANCE_STATE
    http_status: 409
    condition: "AdvancePacket.status does not admit submit, return or approve (APPROVED is terminal)"
    applies_to: ["POST /festival-ops/advance-packets/{id}/submit", "POST /festival-ops/advance-packets/{id}/return", "POST /festival-ops/advance-packets/{id}/approve"]
  - id: ERR_INVALID_INSTALLMENT_STATE
    http_status: 409
    condition: "PaymentInstallment.status does not admit release, mark-paid or clawback (VOIDED and RECOVERED are terminal)"
    applies_to: ["POST /festival-ops/payment-installments/{id}/release", "POST /festival-ops/payment-installments/{id}/mark-paid", "POST /festival-ops/payment-installments/{id}/clawback"]
  - id: ERR_INVALID_WAVE_STATE
    http_status: 409
    condition: "AnnouncementWave.status does not admit assignment, lock or publish (PUBLISHED is terminal)"
    applies_to: ["POST /festival-ops/announcement-waves/{id}/assignments", "POST /festival-ops/announcement-waves/{id}/lock", "POST /festival-ops/announcement-waves/{id}/publish"]
  - id: ERR_LINEUP_FROZEN
    http_status: 409
    condition: "Festival.lineup_posture == FROZEN"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept"]
  - id: ERR_TIERS_NOT_ALLOCATED
    http_status: 409
    condition: "Festival.tiers_allocated == false"
    applies_to: ["POST /festival-ops/offers/{id}/issue"]
  - id: ERR_WAVE_PHASE_MISMATCH
    http_status: 409
    condition: "AnnouncementWave.phase != Festival.announcement_phase"
    applies_to: ["POST /festival-ops/announcement-waves/{id}/lock", "POST /festival-ops/announcement-waves/{id}/publish"]

  # -- business_safety -------------------------------------------------------
  - id: ERR_RADIUS_BREACH_ACTIVE
    http_status: 409
    condition: "A RadiusClause of the booking has enforcement_status == BREACHED"
    applies_to: ["POST /festival-ops/bookings/{id}/countersign", "POST /festival-ops/payment-installments/{id}/release", "POST /festival-ops/payment-installments/{id}/mark-paid"]
  - id: ERR_ARTIST_RISK_BLOCKED
    http_status: 409
    condition: "Artist.adjudicated_risk_score >= RISK_BLOCK_THRESHOLD (60)"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "X-User-Id equals AdvancePacket.submitted_by_user_id on an adjudication call"
    applies_to: ["POST /festival-ops/advance-packets/{id}/return", "POST /festival-ops/advance-packets/{id}/approve"]

  # -- business_referential --------------------------------------------------
  - id: ERR_ADVANCE_NOT_APPROVED
    http_status: 409
    condition: "The booking has no AdvancePacket with status == APPROVED"
    applies_to: ["POST /festival-ops/bookings/{id}/countersign"]
  - id: ERR_WAVE_BOOKING_NOT_COUNTERSIGNED
    http_status: 409
    condition: "A booking assigned to the wave has contract_status != COUNTERSIGNED"
    applies_to: ["POST /festival-ops/announcement-waves/{id}/lock"]
  - id: ERR_ADJUDICATION_MISMATCH
    http_status: 409
    condition: "A VIOLATION finding on a performance whose conflict_assessment == NO_CONFLICT, or a waiver decision naming a performance that is not the clause's waiver_competing_performance_id or is not in VIOLATION"
    applies_to: ["POST /festival-ops/competing-performances/{id}/adjudicate", "POST /festival-ops/radius-clauses/{id}/waiver-decision"]
  - id: ERR_REPLACEMENT_TARGET_NOT_CANCELLED
    http_status: 409
    condition: "replaces_booking_id points at a booking that is not CANCELLED or belongs to another festival"
    applies_to: ["POST /festival-ops/offers"]

  # -- business_temporal -----------------------------------------------------
  - id: ERR_OFFER_EXPIRED
    http_status: 409
    condition: "clock_now >= Offer.offer_expires_utc"
    applies_to: ["POST /festival-ops/offers/{id}/counter", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept"]
  - id: ERR_STAGE_SLOT_CONFLICT
    http_status: 409
    condition: "calculations.stage_interval_conflict finds a buffered overlap on the stage"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept"]
  - id: ERR_CURFEW_EXCEEDED
    http_status: 409
    condition: "minutes_from_midnight(slot_end_utc) > Stage.daily_curfew_minute"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
  - id: ERR_STAGE_DAY_CAP_EXCEEDED
    http_status: 409
    condition: "calculations.stage_day_load > Stage.daily_program_minutes_cap"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
  - id: ERR_ARTIST_DOUBLE_BOOKED
    http_status: 409
    condition: "The artist already has a live offer or non-CANCELLED booking starting on the same UTC date at this festival"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/accept"]
  - id: ERR_SLOT_OUTSIDE_EVENT_WINDOW
    http_status: 422
    condition: "date(slot_start_utc) or date(slot_end_utc) falls outside the festival's inclusive event window"
    applies_to: ["POST /festival-ops/offers", "POST /festival-ops/offers/{id}/revise"]
  - id: ERR_RADIUS_WINDOW_INVALID
    http_status: 422
    condition: "window_end_date < window_start_date, or a window endpoint lies more than 365 days from event_start_date"
    applies_to: ["POST /festival-ops/offers"]
  - id: ERR_REVEAL_AFTER_EVENT_START
    http_status: 422
    condition: "scheduled_reveal_utc is not strictly before event_start_date at 00:00Z"
    applies_to: ["POST /festival-ops/announcement-waves", "POST /festival-ops/announcement-waves/{id}/lock"]
  - id: ERR_REVEAL_NOT_DUE
    http_status: 409
    condition: "clock_now < AnnouncementWave.scheduled_reveal_utc"
    applies_to: ["POST /festival-ops/announcement-waves/{id}/publish"]
  - id: ERR_PAYMENT_NOT_RELEASABLE
    http_status: 409
    condition: "clock_now < due_date - RELEASE_WINDOW_DAYS (7) at 00:00Z"
    applies_to: ["POST /festival-ops/payment-installments/{id}/release"]
  - id: ERR_PHASE_PREREQ_UNMET
    http_status: 409
    condition: "target_phase is not the immediate successor, or a wave of the current phase is not PUBLISHED"
    applies_to: ["POST /festival-ops/festivals/{id}/advance-phase"]

  # -- business_constraint ---------------------------------------------------
  - id: ERR_BILLING_POSITION_TAKEN
    http_status: 409
    condition: "Another live offer or non-CANCELLED booking holds this billing_position on the same stage-day"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept"]
  - id: ERR_TIER_CLOSED
    http_status: 409
    condition: "BudgetTier.status == CLOSED or slots_committed >= max_slots"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/accept"]
  - id: ERR_HEADLINER_STAGE_REQUIRED
    http_status: 409
    condition: "billing_position == 1 on a stage with is_flagship == false"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
  - id: ERR_EMPTY_WAVE
    http_status: 409
    condition: "AnnouncementWave.assignment_count == 0"
    applies_to: ["POST /festival-ops/announcement-waves/{id}/lock"]
  - id: ERR_BOOKING_ALREADY_ASSIGNED
    http_status: 409
    condition: "Booking.announcement_wave_id is already set"
    applies_to: ["POST /festival-ops/announcement-waves/{id}/assignments"]
  - id: ERR_ADVANCE_SUBMISSIONS_EXHAUSTED
    http_status: 409
    condition: "AdvancePacket.submission_count >= MAX_ADVANCE_SUBMISSIONS (3)"
    applies_to: ["POST /festival-ops/advance-packets/{id}/submit"]
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    condition: "Offer.round_number >= MAX_NEGOTIATION_ROUNDS (3)"
    applies_to: ["POST /festival-ops/offers/{id}/revise"]
  - id: ERR_STAGE_CHANNEL_CAP_EXCEEDED
    http_status: 409
    condition: "Stage-day input_channel_count total across SUBMITTED and APPROVED packets exceeds STAGE_CHANNEL_HARD_MAX (112)"
    applies_to: ["POST /festival-ops/advance-packets/{id}/submit"]

  # -- business_fiscal -------------------------------------------------------
  - id: ERR_ALLOCATION_PCT_INVALID
    http_status: 422
    condition: "sum(BudgetTier.allocation_pct) != 1.00 within 1e-9, or the festival has no tiers"
    applies_to: ["POST /festival-ops/festivals/{id}/allocate-tiers"]
  - id: ERR_ALLOCATION_LOCKED
    http_status: 409
    condition: "Festival.committed_budget_cents > 0"
    applies_to: ["POST /festival-ops/festivals/{id}/allocate-tiers"]
  - id: ERR_GENRE_CAP_EXCEEDED
    http_status: 409
    condition: "Projected genre share including this offer > GENRE_CAP_PCT (0.40)"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
  - id: ERR_GUARANTEE_CEILING_EXCEEDED
    http_status: 422
    condition: "guarantee_cents + production_fee_cents > calculations.offer_guarantee_ceiling"
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise", "PATCH /festival-ops/bookings/{id}/guarantee-amendment"]
  - id: ERR_TIER_ALLOCATION_EXCEEDED
    http_status: 409
    condition: "BudgetTier.committed_cents plus the new commitment exceeds allocation_cents"
    applies_to: ["POST /festival-ops/offers/{id}/accept", "PATCH /festival-ops/bookings/{id}/guarantee-amendment"]
  - id: ERR_WAIVER_FEE_BELOW_OFFER
    http_status: 422
    condition: "A GRANTED decision prices waiver_fee_cents below RadiusClause.waiver_fee_offer_cents"
    applies_to: ["POST /festival-ops/radius-clauses/{id}/waiver-decision"]
  - id: ERR_RECOVERY_EXCEEDS_CONTRACTUAL
    http_status: 422
    condition: "actual_recovered_cents + recovered_cents > contractual_recovery_cents"
    applies_to: ["POST /festival-ops/payment-installments/{id}/clawback"]

# =============================================================================
# §1.7 RBAC Permission Matrix — segregation_of_duties
# =============================================================================
roles:

  - name: TalentBuyer
    description: "Books the festival: creates the edition, tiers, roster and offers, runs the budget waterfall, drives announcement waves and phases."
    identity: opaque
    exclusive_operations:
      - "POST /festival-ops/festivals"
      - "POST /festival-ops/festivals/{id}/allocate-tiers"
      - "POST /festival-ops/festivals/{id}/advance-phase"
      - "POST /festival-ops/budget-tiers"
      - "POST /festival-ops/artists"
      - "POST /festival-ops/offers"
      - "POST /festival-ops/offers/{id}/issue"
      - "POST /festival-ops/offers/{id}/revise"
      - "PATCH /festival-ops/bookings/{id}/guarantee-amendment"
      - "POST /festival-ops/announcement-waves"
      - "POST /festival-ops/announcement-waves/{id}/assignments"
      - "POST /festival-ops/announcement-waves/{id}/publish"
    shared_operations:
      - "POST /festival-ops/offers/sweep-expired (with BusinessAffairs)"
      - "POST /festival-ops/competing-performances (with BusinessAffairs)"
      - "POST /festival-ops/bookings/{id}/cancel (with BusinessAffairs)"
      - "POST /festival-ops/announcement-waves/{id}/lock (with BusinessAffairs)"
      - "POST /festival-ops/_clock/set_current_utc (with every role)"
      - "all GET reads across every collection"

  - name: ArtistRep
    description: "Acts for one artist: counters, accepts or declines offers, files rider lines, opens and submits the advance, and asks for radius waivers."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /festival-ops/offers/{id}/counter"
      - "POST /festival-ops/offers/{id}/accept"
      - "POST /festival-ops/offers/{id}/decline"
      - "POST /festival-ops/bookings/{id}/rider-items"
      - "POST /festival-ops/radius-clauses/{id}/waiver-request"
    shared_operations:
      - "POST /festival-ops/advance-packets (with ProductionManager)"
      - "POST /festival-ops/advance-packets/{id}/submit (with ProductionManager)"
      - "POST /festival-ops/_clock/set_current_utc (with every role)"
      - "GET reads of artist-owned rows only: offers, bookings, radius clauses, competing performances, rider items, advance packets, payment installments, waves and the artist row itself"
    identity_binding: "X-User-Id must equal the artist_id of the addressed row (Offer.artist_id, Booking.artist_id, RadiusClause.artist_id, CompetingPerformance.artist_id, or the artist_id of the parent booking for RiderItem, AdvancePacket and PaymentInstallment). A mismatch is ERR_ARTIST_SCOPE_VIOLATION (403) at validation priority 13. ArtistRep is never permitted on Festival, BudgetTier or Stage reads, which are ERR_ROLE_NOT_PERMITTED (403) at priority 3."

  - name: BusinessAffairs
    description: "Owns the paper: countersigns contracts, adjudicates competing-performance reports and decides radius waivers."
    identity: opaque
    exclusive_operations:
      - "POST /festival-ops/bookings/{id}/countersign"
      - "POST /festival-ops/competing-performances/{id}/adjudicate"
      - "POST /festival-ops/radius-clauses/{id}/waiver-decision"
    shared_operations:
      - "POST /festival-ops/offers/sweep-expired (with TalentBuyer)"
      - "POST /festival-ops/competing-performances (with TalentBuyer)"
      - "POST /festival-ops/bookings/{id}/cancel (with TalentBuyer)"
      - "POST /festival-ops/announcement-waves/{id}/lock (with TalentBuyer)"
      - "POST /festival-ops/_clock/set_current_utc (with every role)"
      - "all GET reads"

  - name: ProductionManager
    description: "Runs the stages and the technical advance: creates stages, decides rider lines, returns or approves advances."
    identity: opaque
    exclusive_operations:
      - "POST /festival-ops/stages"
      - "POST /festival-ops/rider-items/{id}/decision"
      - "POST /festival-ops/advance-packets/{id}/return"
      - "POST /festival-ops/advance-packets/{id}/approve"
    shared_operations:
      - "POST /festival-ops/advance-packets (with ArtistRep)"
      - "POST /festival-ops/advance-packets/{id}/submit (with ArtistRep)"
      - "POST /festival-ops/_clock/set_current_utc (with every role)"
      - "GET reads of festivals, stages, artists, bookings, rider items, advance packets and waves"
    segregation_of_duties: "A ProductionManager who submits an advance packet (submitted_by_user_id = their X-User-Id) cannot then return or approve that packet: validation priority 42 returns ERR_SEGREGATION_OF_DUTIES (403) even though the role itself is authorised. A second ProductionManager with a different X-User-Id can."

