      - name: corner_calc_air_class_and_hotel_constants_applied
        claim_type: constants_applied
        grounds:
          - calculations.invitation_package_valuation
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_invitation_package_guaranteed_vs_full_exposure
          rationale: "That §1.8 instance pins AIR_CLASS_VALUE_CENTS for BUSINESS, HOTEL_NIGHTLY_CENTS, GROUND_TRANSPORT_CENTS and the MAX_HOTEL_NIGHTS clamp inside one 3,782,000 literal."

      - name: corner_calc_withholding_rounding_precision
        claim_type: precision
        grounds:
          - calculations.withholding_computation
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_aggregated_withholding_total_then_largest_remainder_split
          rationale: "That §1.8 instance asserts round_half_up on the aggregate (90,001 from 90,000.9) and the largest-remainder split that follows."

      - name: corner_calc_waterfall_pool_before_divide
        claim_type: waterfall_allocation
        grounds:
          - calculations.prize_award_generation
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_tie_pool_before_divide_then_floor_then_remainder
          rationale: "That §1.8 instance pins the pool-then-divide-then-floor-then-remainder order with the 1,233,334 / 1,233,333 / 1,233,333 split."

      - name: corner_calc_aggregation_ledger_running_total_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.purse_and_budget_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_purse_ledger_invariant_across_disqualification_and_recompute
          rationale: "That §1.8 instance asserts the running purse total after an award VOID and again after a recompute."

      - name: corner_calc_chronological_remainder_follows_created_at
        claim_type: chronological
        grounds:
          - calculations.prize_award_generation
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_tie_pool_before_divide_then_floor_then_remainder
          rationale: "That §1.8 instance advances the logical clock between result creations and asserts the remainder cent lands on the earliest created_at."

      - name: corner_calc_variant_divergence_guaranteed_versus_full_exposure
        claim_type: variant_divergence
        grounds:
          - calculations.invitation_package_valuation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_invitation_package_guaranteed_vs_full_exposure
          rationale: "That §1.8 instance asserts both variants on identical data and the 2,500,000 delta between them."

      - name: corner_calc_variant_selection_per_award_versus_aggregated
        claim_type: variant_selection
        grounds:
          - calculations.withholding_computation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_withholding_per_award_vs_aggregated
          rationale: "That §1.8 instance flips w8ben_on_file and re-runs compute-awards to show the variant selector switching."

      - name: corner_calc_reconciliation_on_recompute_voids_prior_awards
        claim_type: reconciliation
        grounds:
          - calculations.prize_award_generation
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_withholding_per_award_vs_aggregated
          rationale: "That §1.8 instance asserts the prior COMPUTED awards go VOID and the ledger reconciles to the new withholding variant."

