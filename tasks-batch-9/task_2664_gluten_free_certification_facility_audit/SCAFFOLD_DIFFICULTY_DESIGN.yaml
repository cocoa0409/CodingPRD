          Both violated rules return 422, so the pair cannot be distinguished by HTTP status alone
          - only the error code proves the ordering. The referential rule at priority 30 (the
          nonconformance names a REVOKED certificate) must beat the temporal rule at priority 39
          (clock_now 2026-09-15 is past ca_due_on 2026-09-10). The OCC version supplied is exactly
