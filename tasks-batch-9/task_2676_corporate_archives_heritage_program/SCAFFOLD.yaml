  - method: GET
    path: "/trademark-evidence-packages"
    description: "List evidence packages, optionally filtered by the series supplying the evidence."
    roles: [ArchivesDirector, Archivist, LegalCounsel]
    code: 200
    input: ["record_series_id?", "status?", "limit?", "offset?"]
    output: TrademarkEvidencePackage[]
    side_effects: []

  - method: GET
    path: "/trademark-evidence-packages/{id}"
    description: "Fetch one evidence package with its coverage arithmetic."
    roles: [ArchivesDirector, Archivist, LegalCounsel]
    code: 200
    input: []
    output: TrademarkEvidencePackage
    side_effects: []

  - method: POST
    path: "/trademark-evidence-packages/{id}/certify"
