        distinguishing_aspect: "The waterfall's input set is status-filtered: of three same-TIN debts (ACTIVE 10000, NOTICED 20000, and a third already PAID_IN_FULL by an earlier payment) only the ACTIVE one is matched — a 100000-cent FULL payment offsets exactly 10000 and disburses 90000."
