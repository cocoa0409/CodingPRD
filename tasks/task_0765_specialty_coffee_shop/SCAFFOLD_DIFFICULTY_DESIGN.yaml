# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Specialty Coffee Shop & Multi-Roast Café — Expert
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_points_provisional_vs_final
        grounds:
          - calculations.order_points
          - entities.Order.fields.points_earned_provisional
          - entities.Order.fields.points_earned_final
        distinguishing_aspect: |
          On one Order the provisional earn is floor(subtotal_cents/100)=floor(1905/100)=19
          while the final earn is floor(total_cents/100)=floor(1764/100)=17; the two loyalty
          figures differ because provisional ignores tier discount and service fee.
        test_recipe:
          setup:
            - "GOLD member (lifetime_points=1200); ESPRESSO + BATCH_BREW machines OPERATIONAL; ACTIVE ETHIOPIA lot 1000g; Latte LG and Drip MD menu items; Extra Shot modifier."
          setup_api_calls:
            - { call: "POST /members", payload: { email: "gold@x.com", full_name: "Gold M" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/point-adjustments", payload: { lifetime_points_delta: 1200, points_balance_delta: 1200 }, as: Manager }
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "brew1", equipment_type: "BATCH_BREW" }, as: Manager, captures: { brew_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /modifiers", payload: { name: "Extra Shot", modifier_group: "SHOT", surcharge_cents: 90, extra_bean_grams: 9 }, as: Manager, captures: { shot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Drip MD", category: "BEVERAGE", base_price_cents: 300, required_equipment_type: "BATCH_BREW", size: "MEDIUM", bean_grams: 20, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { drip_id: "$.data.id" } }
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${latte_id}", quantity: 2, modifier_ids: ["${shot_id}"] }, { menu_item_id: "${drip_id}", quantity: 1, modifier_ids: [] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager }
          assert:
            - "Order.${ord_id}.points_earned_provisional == 19"
            - "Order.${ord_id}.points_earned_final == 17"

      - name: bean_usage_expected_vs_ledger
        grounds:
          - calculations.bean_inventory_shrink
          - entities.DailyReconciliation.fields.expected_usage_grams
          - entities.DailyReconciliation.fields.ledger_usage_grams
        distinguishing_aspect: |
          On a DailyReconciliation the sales-driven expected_usage_grams=74 differs from the
          chronological ledger_usage_grams=94 by exactly the 20g logged_waste_grams — a
          dual-variant on the BeanLot/reconciliation domain, distinct from the Order/points variant.
        test_recipe:
          setup:
            - "ACTIVE ETHIOPIA lot 1000g; reconciliation OPEN (snapshots opening 1000g/0 waste); one order (74g) fulfilled and paid; 20g waste logged; counts submitted."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "brew1", equipment_type: "BATCH_BREW" }, as: Manager, captures: { brew_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /modifiers", payload: { name: "Extra Shot", modifier_group: "SHOT", surcharge_cents: 90, extra_bean_grams: 9 }, as: Manager, captures: { shot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Drip MD", category: "BEVERAGE", base_price_cents: 300, required_equipment_type: "BATCH_BREW", size: "MEDIUM", bean_grams: 20, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { drip_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "u@x.com", full_name: "U" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /daily-reconciliations", payload: { business_date: "2026-03-02", bean_lot_id: "${lot_id}" }, as: Manager, captures: { recon_id: "$.data.id", recon_v: "$.data.version" } }
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${latte_id}", quantity: 2, modifier_ids: ["${shot_id}"] }, { menu_item_id: "${drip_id}", quantity: 1, modifier_ids: [] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/pay", payload: {}, as: Manager }
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager }
            - { call: "POST /bean-lots/${lot_id}/log-waste", payload: { grams: 20, reason: "SPOILAGE" }, as: Manager }
            - { call: "POST /daily-reconciliations/${recon_id}/submit-count", payload: { counted_revenue_cents: 1800, counted_bean_on_hand_grams: 900, expected_reconciliation_version: "${recon_v}" }, as: Manager }
          trigger:
            - { call: "POST /daily-reconciliations/${recon_id}/close", payload: {}, as: Manager }
          assert:
            - "DailyReconciliation.${recon_id}.ledger_usage_grams == 94"
            - "DailyReconciliation.${recon_id}.logged_waste_grams == 20"
            - "DailyReconciliation.${recon_id}.expected_usage_grams == 74"
            - "DailyReconciliation.${recon_id}.shrink_grams == 6"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_line_price_tiered_size_selection
        grounds:
          - calculations.order_line_price
          - entities.MenuItem.fields.size
          - entities.Modifier.fields.surcharge_cents
        distinguishing_aspect: |
          Mode (a): line_price = (round_half_up(base 450 * SIZE_MULT[LARGE]=1.5)=675 + Extra Shot 90) * qty 2
          = 1530, combining tiered size-multiplier selection, modifier surcharge and quantity (>=3 inputs, non-linear).
        test_recipe:
          setup:
            - "Latte LG (base 450, LARGE) menu item; Extra Shot modifier; single-line order qty 2 with the modifier."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /modifiers", payload: { name: "Extra Shot", modifier_group: "SHOT", surcharge_cents: 90, extra_bean_grams: 9 }, as: Manager, captures: { shot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { lines: [ { menu_item_id: "${latte_id}", quantity: 2, modifier_ids: ["${shot_id}"] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
          assert:
            - "Order.${ord_id}.subtotal_cents == 1530"

      - name: order_totals_pinned_evaluation_order
        grounds:
          - calculations.order_totals
          - entities.Order.fields.service_fee_cents
          - entities.Order.fields.total_cents
        distinguishing_aspect: |
          Mode (c): the small-order fee's spend tier is keyed on subtotal_cents (2000 -> fee waived to 0),
          NOT on total_cents (1800, which would re-trigger the fee); the pinned order yields
          service_fee_cents=0 and total_cents=1800, resolving the apparent total<->fee circularity.
        test_recipe:
          setup:
            - "GOLD member (lifetime 1200); a BATCH_BREW menu item base 400 MEDIUM (sized 500), origin not required; single-line order qty 4 (subtotal exactly 2000)."
          setup_api_calls:
            - { call: "POST /members", payload: { email: "gold2@x.com", full_name: "Gold2" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/point-adjustments", payload: { lifetime_points_delta: 1200, points_balance_delta: 0 }, as: Manager }
            - { call: "POST /menu-items", payload: { name: "Batch LG", category: "BEVERAGE", base_price_cents: 400, required_equipment_type: "BATCH_BREW", size: "MEDIUM", bean_grams: 0, origin_required: false }, as: Manager, captures: { batch_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${batch_id}", quantity: 4, modifier_ids: [] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
          assert:
            - "Order.${ord_id}.subtotal_cents == 2000"
            - "Order.${ord_id}.service_fee_cents == 0"
            - "Order.${ord_id}.total_cents == 1800"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.PLACED_to_FULFILLED
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          On one Order row the payment dimension (UNPAID->PAID via /pay) and the fulfillment
          dimension (PLACED->FULFILLED via /fulfill) advance independently: after both calls
          payment_status==PAID and fulfillment_status==FULFILLED — parallel state dimensions on Order.
        test_recipe:
          setup:
            - "ESPRESSO machine OPERATIONAL; ACTIVE ETHIOPIA lot; Latte LG item; a placed order."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /orders", payload: { lines: [ { menu_item_id: "${latte_id}", quantity: 1, modifier_ids: [] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/pay", payload: {}, as: Manager }
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager }
          assert:
            - "Order.${ord_id}.payment_status == PAID"
            - "Order.${ord_id}.fulfillment_status == FULFILLED"

      - name: equipment_calibration_cycle
        grounds:
          - state_machines.Equipment.OPERATIONAL_to_NEEDS_CALIBRATION
          - state_machines.Equipment.NEEDS_CALIBRATION_to_OPERATIONAL
          - calculations.espresso_shot_count
        distinguishing_aspect: |
          The Equipment cycles OPERATIONAL -> NEEDS_CALIBRATION (fulfilling an order pulls 4 shots,
          reaching CALIBRATION_SHOT_LIMIT=4) -> OPERATIONAL (calibrate resets shots_since_calibration
          to 0) — a cycle on the Equipment entity, distinct from Order's parallel dimensions.
        test_recipe:
          setup:
            - "ESPRESSO machine OPERATIONAL; ACTIVE ETHIOPIA lot; Latte LG + Extra Shot; order qty 2 with the shot (4 espresso shots)."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /modifiers", payload: { name: "Extra Shot", modifier_group: "SHOT", surcharge_cents: 90, extra_bean_grams: 9 }, as: Manager, captures: { shot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /orders", payload: { lines: [ { menu_item_id: "${latte_id}", quantity: 2, modifier_ids: ["${shot_id}"] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager }
            - { call: "POST /equipment/${esp_id}/calibrate", payload: {}, as: Manager }
          assert:
            - "Equipment.${esp_id}.status == OPERATIONAL"
            - "Equipment.${esp_id}.shots_since_calibration == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_depletes_active_then_promotes_reserve
        grounds:
          - state_machines.Order.PLACED_to_FULFILLED
          - state_machines.BeanLot.ACTIVE_to_DEPLETED
          - state_machines.BeanLot.RESERVE_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 chain from Order fulfill: drawing 54g empties lot A (on_hand->0, ACTIVE->DEPLETED);
          that depletion auto-activates the oldest RESERVE lot B of the same origin (RESERVE->ACTIVE).
          Order -> BeanLotA -> BeanLotB, each hop caused by the previous.
        test_recipe:
          setup:
            - "ESPRESSO machine OPERATIONAL; lot A ETHIOPIA received 54g ACTIVE; lot B ETHIOPIA received 500g RESERVE (created after A); Latte LG + Extra Shot; order qty 2 (draws 54g)."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 54, par_grams: 0, price_per_gram_cents: 5 }, as: Manager, captures: { lotA_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lotA_id}/activate", payload: {}, as: Manager }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 500, par_grams: 0, price_per_gram_cents: 5 }, as: Manager, captures: { lotB_id: "$.data.id" } }
            - { call: "POST /modifiers", payload: { name: "Extra Shot", modifier_group: "SHOT", surcharge_cents: 90, extra_bean_grams: 9 }, as: Manager, captures: { shot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /orders", payload: { lines: [ { menu_item_id: "${latte_id}", quantity: 2, modifier_ids: ["${shot_id}"] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager }
          assert:
            - "BeanLot.${lotA_id}.on_hand_grams == 0"
            - "BeanLot.${lotA_id}.rotation_status == DEPLETED"
            - "BeanLot.${lotB_id}.rotation_status == ACTIVE"

      - name: maintenance_offline_cancels_confirmed_catering
        grounds:
          - state_machines.Equipment.OPERATIONAL_to_IN_MAINTENANCE
          - state_machines.CateringEvent.CONFIRMED_to_CANCELLED
          - state_machines.MaintenanceWindow.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (maintenance-window create): scheduling a window forces
          Equipment OPERATIONAL->IN_MAINTENANCE, which cascades to cancel the CONFIRMED CateringEvent on
          that equipment overlapping the window (CONFIRMED->CANCELLED). MaintenanceWindow -> Equipment -> CateringEvent.
        test_recipe:
          setup:
            - "ESPRESSO machine OPERATIONAL; ACTIVE barista; a catering event on that equipment+barista [14:00,15:00] confirmed."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /baristas", payload: { name: "B1", station_role: "CATERING" }, as: Manager, captures: { bar_id: "$.data.id" } }
            - { call: "POST /catering-events", payload: { client_name: "Acme", assigned_equipment_id: "${esp_id}", assigned_barista_id: "${bar_id}", scheduled_start: "2026-03-02T14:00:00Z", scheduled_end: "2026-03-02T15:00:00Z", headcount: 30 }, as: Manager, captures: { evt_id: "$.data.id" } }
            - { call: "POST /catering-events/${evt_id}/confirm", payload: {}, as: Manager }
          trigger:
            - { call: "POST /maintenance-windows", payload: { equipment_id: "${esp_id}", start_at: "2026-03-02T14:30:00Z", end_at: "2026-03-02T15:30:00Z", kind: "REPAIR" }, as: Manager, captures: { mw_id: "$.data.id" } }
          assert:
            - "Equipment.${esp_id}.status == IN_MAINTENANCE"
            - "CateringEvent.${evt_id}.status == CANCELLED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_member_beats_insufficient_points
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_MEMBER_SUSPENDED]
        distinguishing_aspect: |
          An order for a SUSPENDED member that also redeems more points than its balance violates both
          the state check (priority 4) and the fiscal redemption check (priority 8); ERR_MEMBER_SUSPENDED (409)
          is returned — category pair state vs business_fiscal.
        test_recipe:
          setup:
            - "A SUSPENDED member (points_balance 0); a simple menu item."
          setup_api_calls:
            - { call: "POST /members", payload: { email: "susp@x.com", full_name: "Susp", status: "SUSPENDED" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Batch S", category: "BEVERAGE", base_price_cents: 400, required_equipment_type: "BATCH_BREW", size: "MEDIUM", origin_required: false }, as: Manager, captures: { batch_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${batch_id}", quantity: 1, modifier_ids: [] } ], points_redeemed: 50 }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_MEMBER_SUSPENDED"
            - "response.http_status == 409"

      - name: equipment_unavailable_beats_barista_overlap
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_EQUIPMENT_UNAVAILABLE]
        distinguishing_aspect: |
          Confirming a catering event whose assigned equipment is IN_MAINTENANCE (referential, priority 5)
          AND whose barista already has an overlapping CONFIRMED event (temporal, priority 6) returns
          ERR_EQUIPMENT_UNAVAILABLE (409) — category pair business_referential vs business_temporal.
        test_recipe:
          setup:
            - "Barista B ACTIVE; equipment Eq1 and Eq2 OPERATIONAL; event E1 on (Eq1,B) [14:00,15:00] CONFIRMED; event E2 on (Eq2,B) [14:30,15:30] QUOTED; a maintenance window takes Eq2 IN_MAINTENANCE."
          setup_api_calls:
            - { call: "POST /baristas", payload: { name: "B", station_role: "CATERING" }, as: Manager, captures: { bar_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "Eq1", equipment_type: "ESPRESSO" }, as: Manager, captures: { eq1_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "Eq2", equipment_type: "ESPRESSO" }, as: Manager, captures: { eq2_id: "$.data.id" } }
            - { call: "POST /catering-events", payload: { client_name: "E1", assigned_equipment_id: "${eq1_id}", assigned_barista_id: "${bar_id}", scheduled_start: "2026-03-02T14:00:00Z", scheduled_end: "2026-03-02T15:00:00Z", headcount: 20 }, as: Manager, captures: { e1_id: "$.data.id" } }
            - { call: "POST /catering-events/${e1_id}/confirm", payload: {}, as: Manager }
            - { call: "POST /catering-events", payload: { client_name: "E2", assigned_equipment_id: "${eq2_id}", assigned_barista_id: "${bar_id}", scheduled_start: "2026-03-02T14:30:00Z", scheduled_end: "2026-03-02T15:30:00Z", headcount: 20 }, as: Manager, captures: { e2_id: "$.data.id" } }
            - { call: "POST /maintenance-windows", payload: { equipment_id: "${eq2_id}", start_at: "2026-03-02T13:00:00Z", end_at: "2026-03-02T18:00:00Z", kind: "REPAIR" }, as: Manager }
          trigger:
            - { call: "POST /catering-events/${e2_id}/confirm", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_EQUIPMENT_UNAVAILABLE"
            - "response.http_status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: loyalty_tier_gold_boundary_inclusive
        grounds:
          - calculations.loyalty_tier
          - entities.Member.fields.tier
          - entities.Member.fields.lifetime_points
        distinguishing_aspect: |
          lifetime_points == GOLD_MIN (1000) yields tier GOLD (inclusive >=) while 999 yields SILVER —
          a boundary on the loyalty points metric read via GET /members/{id}.
        test_recipe:
          setup:
            - "Member A with lifetime_points 1000; member B with lifetime_points 999."
          setup_api_calls:
            - { call: "POST /members", payload: { email: "a@x.com", full_name: "A" }, as: Manager, captures: { a_id: "$.data.id" } }
            - { call: "POST /members/${a_id}/point-adjustments", payload: { lifetime_points_delta: 1000, points_balance_delta: 0 }, as: Manager }
            - { call: "POST /members", payload: { email: "b@x.com", full_name: "B" }, as: Manager, captures: { b_id: "$.data.id" } }
            - { call: "POST /members/${b_id}/point-adjustments", payload: { lifetime_points_delta: 999, points_balance_delta: 0 }, as: Manager }
          trigger:
            - { call: "GET /members/${a_id}", payload: {}, as: Manager }
            - { call: "GET /members/${b_id}", payload: {}, as: Manager }
          assert:
            - "Member.${a_id}.tier == GOLD"
            - "Member.${b_id}.tier == SILVER"

      - name: bean_reorder_par_boundary_inclusive
        grounds:
          - calculations.bean_reorder_status
          - entities.BeanLot.fields.reorder_needed
          - entities.BeanLot.fields.par_grams
        distinguishing_aspect: |
          on_hand_grams == par_grams (250 == 250) yields reorder_needed true (inclusive <=) while a lot with
          on_hand 251 and par 250 yields false — a boundary on the bean grams metric via GET /bean-lots/{id},
          a distinct metric and endpoint from the loyalty threshold.
        test_recipe:
          setup:
            - "Lot X received 250g par 250g; lot Y received 251g par 250g (both untouched RESERVE)."
          setup_api_calls:
            - { call: "POST /bean-lots", payload: { origin: "KENYA", roast_level: "LIGHT", received_grams: 250, par_grams: 250, price_per_gram_cents: 6 }, as: Manager, captures: { x_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "KENYA", roast_level: "LIGHT", received_grams: 251, par_grams: 250, price_per_gram_cents: 6 }, as: Manager, captures: { y_id: "$.data.id" } }
          trigger:
            - { call: "GET /bean-lots/${x_id}", payload: {}, as: Manager }
            - { call: "GET /bean-lots/${y_id}", payload: {}, as: Manager }
          assert:
            - "BeanLot.${x_id}.reorder_needed == true"
            - "BeanLot.${y_id}.reorder_needed == false"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fulfill_blocked_by_non_operational_equipment
        grounds:
          - state_machines.Order.PLACED_to_FULFILLED
          - entities.Equipment.fields.status
          - errors[ERR_EQUIPMENT_UNAVAILABLE]
        distinguishing_aspect: |
          Order fulfill is rejected when the only ESPRESSO machine is IN_MAINTENANCE — the Order transition
          depends on Equipment state (pair Order<->Equipment); returns ERR_EQUIPMENT_UNAVAILABLE and leaves
          fulfillment_status PLACED.
        test_recipe:
          setup:
            - "One ESPRESSO machine, ACTIVE ETHIOPIA lot, Latte LG item, an order placed; a maintenance window then takes the machine IN_MAINTENANCE."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /orders", payload: { lines: [ { menu_item_id: "${latte_id}", quantity: 1, modifier_ids: [] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /maintenance-windows", payload: { equipment_id: "${esp_id}", start_at: "2026-03-02T09:00:00Z", end_at: "2026-03-02T12:00:00Z", kind: "REPAIR" }, as: Manager }
          trigger:
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_EQUIPMENT_UNAVAILABLE"
            - "Order.${ord_id}.fulfillment_status == PLACED"

      - name: fulfill_blocked_by_no_active_bean_lot
        grounds:
          - state_machines.Order.PLACED_to_FULFILLED
          - entities.BeanLot.fields.rotation_status
          - errors[ERR_BEAN_LOT_UNAVAILABLE]
        distinguishing_aspect: |
          Order fulfill is rejected when the origin_required line's origin has only a RESERVE lot (never
          activated) — the Order transition depends on BeanLot rotation_status (pair Order<->BeanLot), a
          different entity pair than the equipment dependency; returns ERR_BEAN_LOT_UNAVAILABLE.
        test_recipe:
          setup:
            - "One ESPRESSO machine OPERATIONAL; an ETHIOPIA lot created but NOT activated (RESERVE); Latte LG origin_required item; an order placed."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /orders", payload: { lines: [ { menu_item_id: "${latte_id}", quantity: 1, modifier_ids: [] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_BEAN_LOT_UNAVAILABLE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: maintenance_window_buffered_overlap
        grounds:
          - state_machines.MaintenanceWindow.SCHEDULED_to_COMPLETED
          - errors[ERR_MAINTENANCE_OVERLAP]
          - validations[priority=6]
        distinguishing_aspect: |
          A second maintenance window on the same Equipment starting only 30 min after the first ends is
          rejected because windows must be BUFFER_MIN=60 apart — buffered/closed interval semantics on the
          Equipment resource; returns ERR_MAINTENANCE_OVERLAP.
        test_recipe:
          setup:
            - "One machine; window W1 [10:00,11:00] SCHEDULED."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /maintenance-windows", payload: { equipment_id: "${esp_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T11:00:00Z", kind: "CLEANING" }, as: Manager, captures: { w1_id: "$.data.id" } }
          trigger:
            - { call: "POST /maintenance-windows", payload: { equipment_id: "${esp_id}", start_at: "2026-03-02T11:30:00Z", end_at: "2026-03-02T12:30:00Z", kind: "REPAIR" }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_MAINTENANCE_OVERLAP"

      - name: catering_barista_halfopen_overlap
        grounds:
          - state_machines.CateringEvent.QUOTED_to_CONFIRMED
          - errors[ERR_BARISTA_OVERLAP]
          - validations[priority=6]
        distinguishing_aspect: |
          Confirming a second event on the same Barista whose window [14:30,15:30) overlaps a CONFIRMED
          event [14:00,15:00) is rejected (half-open intervals; back-to-back start==end would be allowed) —
          half-open adjacency semantics on the Barista resource, distinct from the buffered Equipment rule;
          returns ERR_BARISTA_OVERLAP.
        test_recipe:
          setup:
            - "Barista B ACTIVE; equipment OPERATIONAL; E1 on (Eq,B) [14:00,15:00] CONFIRMED; E2 on (Eq,B) [14:30,15:30] QUOTED."
          setup_api_calls:
            - { call: "POST /baristas", payload: { name: "B", station_role: "CATERING" }, as: Manager, captures: { bar_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "Eq", equipment_type: "ESPRESSO" }, as: Manager, captures: { eq_id: "$.data.id" } }
            - { call: "POST /catering-events", payload: { client_name: "E1", assigned_equipment_id: "${eq_id}", assigned_barista_id: "${bar_id}", scheduled_start: "2026-03-02T14:00:00Z", scheduled_end: "2026-03-02T15:00:00Z", headcount: 20 }, as: Manager, captures: { e1_id: "$.data.id" } }
            - { call: "POST /catering-events/${e1_id}/confirm", payload: {}, as: Manager }
            - { call: "POST /catering-events", payload: { client_name: "E2", assigned_equipment_id: "${eq_id}", assigned_barista_id: "${bar_id}", scheduled_start: "2026-03-02T14:30:00Z", scheduled_end: "2026-03-02T15:30:00Z", headcount: 20 }, as: Manager, captures: { e2_id: "$.data.id" } }
          trigger:
            - { call: "POST /catering-events/${e2_id}/confirm", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_BARISTA_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: points_conservation_redeem_then_void
        grounds:
          - state_machines.Order.PLACED_to_VOIDED
          - entities.Member.fields.points_balance
          - calculations.order_totals
        distinguishing_aspect: |
          Creating an order that redeems 20 points debits points_balance 100->80; voiding the PLACED order
          restores +20, leaving points_balance == 100 exactly — the redeem/void pair conserves the named
          quantity member.points_balance.
        test_recipe:
          setup:
            - "Member with points_balance 100; ACTIVE ETHIOPIA lot; ESPRESSO machine; Latte LG + Extra Shot; order qty 2 redeeming 20 points."
          setup_api_calls:
            - { call: "POST /members", payload: { email: "r@x.com", full_name: "R" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/point-adjustments", payload: { points_balance_delta: 100, lifetime_points_delta: 0 }, as: Manager }
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /modifiers", payload: { name: "Extra Shot", modifier_group: "SHOT", surcharge_cents: 90, extra_bean_grams: 9 }, as: Manager, captures: { shot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${latte_id}", quantity: 2, modifier_ids: ["${shot_id}"] } ], points_redeemed: 20 }, as: Manager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/void", payload: {}, as: Manager }
          assert:
            - "Member.${m_id}.points_balance == 100"

      - name: bean_grams_conservation_fulfill_then_void
        grounds:
          - state_machines.Order.FULFILLED_to_VOIDED
          - entities.BeanLot.fields.on_hand_grams
          - calculations.order_line_price
        distinguishing_aspect: |
          Fulfilling an order draws 54g from the ACTIVE lot (on_hand 1000->946); voiding the FULFILLED order
          restores +54, leaving on_hand_grams == 1000 exactly — the fulfill/void pair conserves the named
          quantity BeanLot.on_hand_grams (a different conserved quantity than loyalty points).
        test_recipe:
          setup:
            - "ESPRESSO machine OPERATIONAL; ACTIVE ETHIOPIA lot 1000g; Latte LG + Extra Shot; order qty 2 fulfilled."
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /modifiers", payload: { name: "Extra Shot", modifier_group: "SHOT", surcharge_cents: 90, extra_bean_grams: 9 }, as: Manager, captures: { shot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /orders", payload: { lines: [ { menu_item_id: "${latte_id}", quantity: 2, modifier_ids: ["${shot_id}"] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager }
          trigger:
            - { call: "POST /orders/${ord_id}/void", payload: {}, as: Manager }
          assert:
            - "BeanLot.${lot_id}.on_hand_grams == 1000"
            - "Order.${ord_id}.fulfillment_status == VOIDED"
