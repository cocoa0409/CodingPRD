              payload: { response: "ACCEPT" }
              as: Applicant
              as_user_id: "${art2}"
              captures: { err_pair: "$.data.error_id" }
            - call: "POST /applications/${app1}/offer-response"
              payload: { response: "ACCEPT" }
              as: Applicant
              as_user_id: "${art1}"
              captures: { err_solo: "$.data.error_id" }
          assert:
            - "pre-state: app1 status == 'OFFERED' with final_panel_score 80.00; app2 status == 'WAITLISTED' with waitlist_rank == 1 and final_panel_score 70.00; Cycle.status == 'SLATE_LOCKED', stipend_uncommitted_cents == 100000, slots_open_count == 1"
            - "BOTH rules are violated by the first trigger call: P22 because app2.status != 'OFFERED', and P71 because the 8-week award 70000 x 8 = 560000 exceeds stipend_uncommitted_cents 100000"
            - "the first trigger call returns 409 with error_id == 'ERR_APPLICATION_NOT_OFFERED' - the state check at priority 22 wins"
