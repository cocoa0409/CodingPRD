            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_ada_id: $.data.id }
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_bob_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_bob_id: $.data.id }
            - call: "POST /tickets/${t_ada_id}/device-binding"
              payload: { device_fingerprint: "DEV-ADA" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /tickets/${t_bob_id}/device-binding"
              payload: { device_fingerprint: "DEV-BOB" }
              as: Patron
              as_user_id: "${p_bob_id}"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "OFFLINE_CAPABLE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /tickets/${t_ada_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { seed_a: $.data.barcode_seed, bc_a: $.data.current_barcode }
