              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${hosp_id}", language_pair_id: "${lp_id}", modality: "PHONE", required_tier: "MEDICAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
              captures: { asg_id: $.data.id }
            - call: "POST /interpretation/assignments/${asg_id}/accept"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/assignments/${asg_id}/start-session"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /interpretation/sessions/${sess_id}/connect"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:20:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/sessions/${sess_id}/end"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/sessions/${sess_id}/dispute"
              payload: {}
              as: ClientAccount
              as_user_id: "${hosp_id}"
            - call: "POST /interpretation/sessions/${sess_id}/reopen"
              payload: {}
              as: CoordinatorOps
          trigger:
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:50:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/sessions/${sess_id}/end"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
              captures: { reamt: $.data.billed_amount_cents }
          assert:
            - "Session.${sess_id}.status == ENDED after the second end (cycle completed)"
            - "Session.${sess_id}.billed_units == 50 (09:00->09:50 = 3000s, ceil=50 min)"
            - "Session.${sess_id}.billed_amount_cents == 9750"
      - name: assignment_parallel_lifecycle_and_billing_dimensions
        grounds:
          - state_machines.Assignment.IN_SESSION_to_COMPLETED
          - entities.Assignment.fields.lifecycle_status
          - entities.Assignment.fields.billing_status
        distinguishing_aspect: "Assignment carries two independent dimensions: lifecycle_status reaches COMPLETED while billing_status independently moves UNBILLED->BILLABLE->INVOICED; the two axes evolve on the same row via different triggers, a parallel (non-linear) shape on a different entity than Session."
