              captures: { wc239_id: $.data.id }
            - call: "POST /warranty-claims/${wc239_id}/triage"
              payload: {}
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${wc239_id}/reviews"
              payload: { review_kind: MATERIALS, outcome: DEFECT_CONFIRMED }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${wc239_id}/reviews"
              payload: { review_kind: FIELD, outcome: DEFECT_CONFIRMED }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims"
              payload: { claim_code: "WC-240", batch_id: "${batch_a1_id}", distributor_id: "${dist_id}", claim_type: LOCK_FAILURE, claimed_area_sqm: 25.50, installed_on: "2026-08-05T00:00:00Z", reported_on: "2046-08-05T00:00:00Z" }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { wc240_id: $.data.id }
            - call: "POST /warranty-claims/${wc240_id}/triage"
              payload: {}
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${wc240_id}/reviews"
              payload: { review_kind: MATERIALS, outcome: DEFECT_CONFIRMED }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${wc240_id}/reviews"
              payload: { review_kind: FIELD, outcome: DEFECT_CONFIRMED }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
          trigger:
            - call: "POST /warranty-claims/${wc239_id}/adjudicate"
              payload: { decision: APPROVE }
