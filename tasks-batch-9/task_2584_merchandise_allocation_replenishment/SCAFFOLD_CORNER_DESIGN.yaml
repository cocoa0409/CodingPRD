      - name: computed_fields_are_derived_at_write_time_from_their_declared_inputs
        claim_type: computed_fields
        grounds:
          - entities.FixturePlan.fields.capacity_units
          - entities.SizeProfile.fields.core_size_count
          - entities.StorePosition.fields.available_units
          - entities.StorePosition.fields.broken_size_count
          - entities.Receipt.fields.units_unallocated
          - entities.AllocationProgram.fields.open_reserve_units
          - entities.AllocationRun.fields.eligible_store_count
        distinguishing_aspect: |
          Every source: computed field must be evaluated by the write that creates or affects it, with no
          dependence on a later read or a background job. The chain deliberately spans three levels: a
          fixture plan whose capacity_units is a triple product, a size profile whose core_size_count depends
          on a non-default threshold, a position whose available/broken/stock/assortment fields all derive
          from the same two inputs, a receipt whose ledger legs derive from nothing yet, a program whose three
          totals roll up from the receipt, and a freshly created run whose four aggregate fields must read 0
          while DRAFT rather than null.
        test_recipe:
          setup:
            - "Program FA26 exists in PLANNING with store 0101(A, URBAN) and nothing else"
            - "The logical clock is 2026-08-01T00:00:00Z"
            - "The trigger builds the shelf plan (3 fixtures x 4 facings x 5 units, pmin 12), the size profile TOP-4SZ with core_size_min_share_bp 2000, SKU-1001 SEASONAL, one position and one 20-unit receipt, then activates and opens a run"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
