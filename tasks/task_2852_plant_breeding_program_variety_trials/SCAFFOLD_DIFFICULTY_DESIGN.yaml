              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000, disease_resistance_scores: { RUST: 8, SDS: 7 }, quality_trait_values: { PROTEIN_PCT: 13.4, TEST_WEIGHT: 75.0 } }
              as: BreedingScientist
              captures: { line_a_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1002", generation_number: 6, seed_inventory_g: 400000, disease_resistance_scores: { RUST: 8, SDS: 4 }, quality_trait_values: {} }
              as: BreedingScientist
              captures: { line_b_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_code: "S1", environment_class: "HIGH_YIELD_IRRIGATED", total_plot_capacity: 400, plot_cost_usd: 45.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
              captures: { site1_id: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 4, min_locations: 1 }
              as: TrialAgronomist
              captures: { series_id: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_a_id}", trial_site_id: "${site1_id}", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_a1: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_b_id}", trial_site_id: "${site1_id}", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_b1: $.data.id }
            - call: "POST /trial-series/${series_id}/plant"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 15.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 15.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 4, value: 20.0, qc_status: "REJECTED" }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 13.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 4, value: 15.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "GET /trial-series/${series_id}"
              payload: {}
              as: DataAnalyst
              captures: { sv1: $.data.version }
            - call: "POST /trial-series/${series_id}/analyses"
              payload: { variant: "BALANCED_CORE", expected_series_version: "${sv1}" }
              as: DataAnalyst
            - call: "GET /breeding-lines/${line_b_id}"
              payload: {}
              as: PipelineDirector
              captures: { lb_v: $.data.version }
          trigger:
            - call: "POST /advancement-decisions"
              payload: { line_id: "${line_b_id}", trial_series_id: "${series_id}", decision: "HOLD", granted_plots: 0, expected_line_version: "${lb_v}", rationale: "quality panel not yet run" }
              as: PipelineDirector
              captures: { dec_b_id: $.data.id }
          assert:
            - "BreedingLine.${line_b_id}.advancement_index_provisional == 77.91"
            - "AdvancementDecision.${dec_b_id}.decision_index_value == 59.32"
            - "AdvancementDecision.${dec_b_id}.decision_index_value != BreedingLine.${line_b_id}.advancement_index_provisional"
            - "AdvancementDecision.${dec_b_id}.from_stage == NURSERY and to_stage == NURSERY and BreedingLine.${line_b_id}.pipeline_stage == NURSERY"
            - "BreedingLine.${line_a_id}.advancement_index_provisional == 101.55 (yield component capped nowhere: 109.09 is below YIELD_COMPONENT_CAP 120)"
            - "BreedingProgram.${prog_id}.committed_plot_count == 16 (the HOLD granted 0 plots)"

  - rule_id: combinatorial_formula
    instances:
      - name: mgmt_fee_tier_pinned_to_pre_fee_subtotal_not_to_total
        grounds:
          - calculations.trial_series_cost_allocation
          - entities.TrialSeries.fields.plot_cost_subtotal_usd
          - entities.TrialSeries.fields.management_fee_usd
          - entities.TrialSeries.fields.total_trial_cost_usd
          - endpoints["POST /trial-series/{id}/plant"]
        distinguishing_aspect: |
          Combinatorial mode (c): the dependency reads as a cycle - the total is
          subtotal + fee while the fee rate is a tier of a cost figure - and the
          scaffold resolves it by pinning the tier input to the PRE-FEE subtotal.
          The fixture is chosen so the two readings disagree: subtotal 9720.00 is
          under MGMT_TIER_1_CEILING so the rate is 0.12 and the total is
          10886.40, whereas tiering off the total (10886.40 >= 10000.00 -> 0.09)
          would produce 10594.80.
        test_recipe:
          setup:
            - "One program with a 5000-plot and 2000000.00 USD budget, one objective, two lines, one site whose plot_cost_usd is exactly 45.00 and whose capacity is 300."
            - "One STAGE_1 series with replication_count 4 and min_locations 1 holding two ENTERED entries of 108 plots each, so the plot cost subtotal is 108*45.00 + 108*45.00 = 9720.00."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy Cost Pin", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
