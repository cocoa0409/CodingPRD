# =============================================================================
# Pet Adoption and Boarding Platform benchmark seed tables (v1)
# =============================================================================

scenario: |
  Pet adoption and boarding platform: animal records, adoption application
  approval process, home visit assessment, boarding matching, vaccination
  record compliance, and fee settlement.

domain_name: pet-adoption-boarding
api_prefix: /petcare

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - version_pinning_on_approval
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Shelter, Animal, Adopter, AdoptionApplication, HomeVisit, VaccinationRecord,
  # BoardingReservation, BoardingMatch, FeeInvoice, ComplianceHold, FeeSchedule,
  # SettlementBatch are peer entities linked by FK references rather than
  # hierarchical URL nesting.

  state_machine_shape: branching
  # AdoptionApplication forks into approve/reject paths after review, with
  # revert loops when home visits fail or are cancelled. HomeVisit branches
  # into PASS / CONDITIONAL_PASS / FAIL outcomes. BoardingReservation has
  # confirm/cancel branches that propagate to BoardingMatch and FeeInvoice.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # Reviewer (CaseWorker) and Approver (ShelterManager) cannot be the same
  # actor on the same application. Veterinarian alone may add VaccinationRecords
  # and create medical ComplianceHolds; ShelterManager alone may approve
  # applications, refund/void invoices, and resolve compliance holds.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Shelter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shelter display name" }
      - { name: address, type: string, source: input, description: "Physical street address" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email for the shelter" }
      - { name: boarding_capacity, type: integer, source: input, description: "Maximum number of animals that can be boarded simultaneously, must be >= 1" }
      - { name: tax_rate, type: number, source: input, description: "Tax rate applied to invoices for this shelter, between 0.0 and 0.30 inclusive" }
      - { name: current_boarding_count, type: integer, source: computed, description: "Number of BoardingReservations currently in CHECKED_IN state for this shelter" }
      - { name: adoption_count, type: integer, source: computed, description: "Total number of AdoptionApplications that have reached COMPLETED for this shelter" }
      - { name: compliance_score, type: number, source: computed, description: "Weighted compliance score 0-100 derived from animal vaccination compliance and active holds" }
      - { name: revenue_pending_cents, type: integer, source: computed, description: "Sum of total_amount_cents for PAID FeeInvoices not yet included in any APPROVED SettlementBatch" }
      - { name: revenue_settled_cents, type: integer, source: computed, description: "Sum of total_amount_cents included in APPROVED SettlementBatches minus refunds settled" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED" }

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK to owning Shelter" }
      - { name: name, type: string, source: input, description: "Animal display name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | RABBIT | BIRD | OTHER" }
      - { name: breed, type: string, source: input, description: "Free-form breed description" }
      - { name: age_months, type: integer, source: input, description: "Age in whole months, must be >= 0" }
      - { name: weight_kg, type: number, source: input, description: "Weight in kilograms, must be > 0" }
      - { name: temperament, type: enum, source: input, description: "CALM | MODERATE | ENERGETIC | AGGRESSIVE" }
      - { name: special_needs, type: array, source: input, default: [], description: "Tags such as MEDICATION_REQUIRED, DIET_RESTRICTED, MOBILITY_LIMITED" }
      - { name: vaccination_compliant, type: boolean, source: computed, description: "True iff every required vaccine for this species has at least one VaccinationRecord with expiry_date strictly greater than the current time" }
      - { name: active_hold_count, type: integer, source: computed, description: "Number of ComplianceHolds with status ACTIVE for this animal" }
      - { name: adoption_eligible, type: boolean, source: computed, description: "True iff status == AVAILABLE AND vaccination_compliant AND no ACTIVE ComplianceHold of severity HIGH or CRITICAL" }
      - { name: boarding_zone_hint, type: string, source: computed, description: "Suggested boarding zone derived from species and temperament; final zone assigned on BoardingMatch creation" }
      - { name: status, type: enum, source: system, description: "INTAKE | AVAILABLE | ADOPTION_PENDING | ADOPTED | BOARDING | UNAVAILABLE" }

  - name: VaccinationRecord
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Unique identifier" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: animal_id, type: string, source: input, description: "FK to Animal receiving the vaccine" }
      - { name: vaccine_name, type: enum, source: input, description: "RABIES | DHPP | FVRCP | BORDETELLA | RHDV | OTHER" }
      - { name: administered_date, type: datetime, source: input, description: "Date the vaccine was administered, must be <= current time" }
      - { name: expiry_date, type: datetime, source: input, description: "Date the vaccine expires, must be strictly greater than administered_date" }
      - { name: batch_number, type: string, source: input, description: "Vaccine batch identifier" }
      - { name: veterinarian_id, type: string, source: system, description: "User ID of the Veterinarian who recorded the vaccination" }
      - { name: is_currently_valid, type: boolean, source: computed, description: "True iff expiry_date > current time" }

  - name: Adopter
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK to Shelter where the adopter is registered" }
      - { name: full_name, type: string, source: input, description: "Adopter's full legal name" }
      - { name: email, type: string, source: input, description: "Contact email, unique within a shelter" }
      - { name: phone, type: string, source: input, description: "Contact phone number" }
      - { name: home_type, type: enum, source: input, description: "HOUSE | APARTMENT | FARM | OTHER" }
      - { name: has_yard, type: boolean, source: input, description: "Whether the home has an enclosed yard" }
      - { name: has_other_pets, type: boolean, source: input, description: "Whether the adopter currently has other pets" }
      - { name: other_pet_species, type: array, source: input, default: [], description: "Species of existing pets if has_other_pets is true" }
      - { name: adoption_history_count, type: integer, source: computed, description: "Count of COMPLETED AdoptionApplications by this adopter" }
      - { name: latest_home_visit_id, type: string, source: computed, description: "ID of the most recent COMPLETED HomeVisit for this adopter, or null" }
      - { name: latest_home_visit_result, type: enum, source: computed, description: "Result of latest_home_visit_id: PASS | CONDITIONAL_PASS | FAIL | null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | BLACKLISTED" }

  - name: AdoptionApplication
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: system, description: "FK to Shelter, derived from animal at submission time" }
      - { name: animal_id, type: string, source: input, description: "FK to the Animal being adopted" }
      - { name: adopter_id, type: string, source: input, description: "FK to the Adopter submitting the application" }
      - { name: reason, type: string, source: input, description: "Free-form reason the adopter wants this animal" }
      - { name: home_visit_id, type: string, source: system, description: "FK to the HomeVisit linked to this application, or null" }
      - { name: animal_version_pinned, type: integer, source: system, description: "Animal.version captured when the application moved to UNDER_REVIEW; checked again at approval time" }
      - { name: adopter_version_pinned, type: integer, source: system, description: "Adopter.version captured when the application moved to UNDER_REVIEW; checked again at approval time" }
      - { name: reviewer_id, type: string, source: system, description: "User ID of the CaseWorker that began the review, set on transition to UNDER_REVIEW" }
      - { name: approver_id, type: string, source: system, description: "User ID of the ShelterManager that approved, set on transition to APPROVED" }
      - { name: rejection_reason, type: string, source: system, description: "Reason text supplied when transitioning to REJECTED, otherwise null" }
      - { name: fee_invoice_id, type: string, source: system, description: "FK to the adoption FeeInvoice created on approval, or null" }
      - { name: requires_home_visit, type: boolean, source: computed, description: "True iff Animal.species is DOG OR Animal.weight_kg >= 25" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | HOME_VISIT_REQUIRED | HOME_VISIT_SCHEDULED | REVIEWED | APPROVED | COMPLETED | REJECTED | WITHDRAWN" }

  - name: HomeVisit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK to the AdoptionApplication that requires this visit" }
      - { name: adopter_id, type: string, source: system, description: "FK to Adopter, derived from the application" }
      - { name: case_worker_id, type: string, source: system, description: "User ID of the CaseWorker assigned to perform the visit; set on creation" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned visit date, must be strictly greater than current time at creation" }
      - { name: yard_adequate, type: boolean, source: input, description: "Assessment field captured at completion: yard meets requirements" }
      - { name: space_adequate, type: boolean, source: input, description: "Assessment field captured at completion: indoor living space is adequate" }
      - { name: safety_hazards_found, type: boolean, source: input, description: "Assessment field captured at completion: safety hazards observed" }
      - { name: existing_pets_compatible, type: boolean, source: input, description: "Assessment field captured at completion: existing pets are compatible (true if has_other_pets is false)" }
      - { name: notes, type: string, source: input, description: "Free-form inspector notes" }
      - { name: overall_score, type: integer, source: computed, description: "Weighted score 0-100 computed at completion from the four assessment booleans" }
      - { name: result, type: enum, source: computed, description: "PASS (score >= 70) | CONDITIONAL_PASS (50 <= score < 70) | FAIL (score < 50); null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | EXPIRED" }

  - name: BoardingReservation
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK to the Shelter providing boarding" }
      - { name: animal_id, type: string, source: input, description: "FK to the Animal being boarded" }
      - { name: owner_name, type: string, source: input, description: "Name of the person bringing the animal for boarding" }
      - { name: owner_contact, type: string, source: input, description: "Phone or email contact for the owner" }
      - { name: check_in_date, type: datetime, source: input, description: "Planned check-in date, must be >= current date" }
      - { name: check_out_date, type: datetime, source: input, description: "Planned check-out date, must be strictly greater than check_in_date" }
      - { name: actual_check_in, type: datetime, source: system, description: "Timestamp recorded when reservation transitions to CHECKED_IN, otherwise null" }
      - { name: actual_check_out, type: datetime, source: system, description: "Timestamp recorded when reservation transitions to CHECKED_OUT, otherwise null" }
      - { name: planned_duration_days, type: integer, source: computed, description: "ceil((check_out_date - check_in_date) / 86400), used for provisional fee" }
      - { name: actual_duration_days, type: integer, source: computed, description: "ceil((actual_check_out - actual_check_in) / 86400), null until CHECKED_OUT" }
      - { name: special_instructions, type: string, source: input, description: "Care instructions supplied by the owner" }
      - { name: boarding_match_id, type: string, source: system, description: "FK to the BoardingMatch created at confirmation, or null" }
      - { name: fee_invoice_id, type: string, source: system, description: "FK to the boarding FeeInvoice created at confirmation, or null" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CHECKED_IN | CHECKED_OUT | CANCELLED" }

  - name: BoardingMatch
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Unique identifier" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: reservation_id, type: string, source: system, description: "FK to the originating BoardingReservation; immutable, unique" }
      - { name: animal_id, type: string, source: system, description: "FK to Animal, derived from the reservation" }
      - { name: shelter_id, type: string, source: system, description: "FK to Shelter, derived from the reservation" }
      - { name: compatibility_score, type: integer, source: computed, description: "Compatibility score 0-100 against animals already CHECKED_IN at the same shelter" }
      - { name: boarding_zone, type: enum, source: computed, description: "GENERAL | ACTIVE | SMALL_ANIMAL | ISOLATION; derived from species and temperament" }
      - { name: conflict_flags, type: array, source: computed, description: "Tags such as SPECIES_MISMATCH, AGGRESSIVE_NEAR_CALM, OVER_CAPACITY_RISK; informational only" }
      - { name: voided_at, type: datetime, source: system, description: "Timestamp when the match was voided due to reservation cancellation, or null" }

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: system, description: "FK to Shelter, derived from the source object" }
      - { name: reference_type, type: enum, source: system, description: "ADOPTION | BOARDING — what this invoice is for" }
      - { name: reference_id, type: string, source: system, description: "FK to the AdoptionApplication or BoardingReservation that triggered the invoice" }
      - { name: line_items, type: array, source: computed, description: "Array of {description, quantity, unit_price_cents, amount_cents} objects" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_items[].amount_cents" }
      - { name: discount_cents, type: integer, source: computed, description: "Promotional or loyalty discount applied to the invoice" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up((subtotal_cents - discount_cents) * shelter.tax_rate) computed in cents" }
      - { name: total_amount_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + tax_cents; never negative" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Cumulative amount received via /pay endpoints" }
      - { name: refund_amount_cents, type: integer, source: system, description: "Cumulative amount refunded via /refund endpoint" }
      - { name: balance_due_cents, type: integer, source: computed, description: "max(0, total_amount_cents - paid_amount_cents)" }
      - { name: settlement_batch_id, type: string, source: system, description: "FK to SettlementBatch once the invoice has been included in a settlement, or null" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | REFUNDED | VOID" }

  - name: ComplianceHold
    parent: null
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: input, description: "FK to the Animal under hold" }
      - { name: hold_type, type: enum, source: input, description: "VACCINATION_OVERDUE | HEALTH_CONCERN | BEHAVIOR_INCIDENT | QUARANTINE" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: reason, type: string, source: input, description: "Detailed reason for the hold" }
      - { name: imposed_by, type: string, source: system, description: "User ID who created the hold" }
      - { name: imposed_role, type: enum, source: system, description: "VETERINARIAN | SHELTER_MANAGER" }
      - { name: resolved_by, type: string, source: system, description: "User ID who resolved the hold, or null" }
      - { name: resolution_notes, type: string, source: system, description: "Notes captured at resolution, or null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESOLVED" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK to Shelter that owns this fee row" }
      - { name: fee_type, type: enum, source: input, description: "ADOPTION_BASE | BOARDING_DAILY | SPECIAL_NEEDS_SURCHARGE | LOYALTY_DISCOUNT_PCT" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | RABBIT | BIRD | OTHER | ALL — which species this row applies to" }
      - { name: amount_cents, type: integer, source: input, description: "Fee amount in cents (or basis points * 100 if fee_type is LOYALTY_DISCOUNT_PCT, where amount_cents stores the integer percentage 0-100)" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of validity period" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of validity period, null means open-ended" }
      - { name: is_currently_active, type: boolean, source: computed, description: "True iff effective_from <= current time AND (effective_to is null OR current time < effective_to)" }

  - name: SettlementBatch
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Unique identifier" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: shelter_id, type: string, source: input, description: "FK to Shelter being settled" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of settlement period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of settlement period; must be strictly greater than period_start" }
      - { name: invoice_ids, type: array, source: computed, description: "Array of FeeInvoice IDs included in this batch" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Sum of total_amount_cents for included invoices that are PAID" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Sum of refund_amount_cents for invoices included in the batch that have status REFUNDED" }
      - { name: net_amount_cents, type: integer, source: computed, description: "max(0, gross_amount_cents - refund_amount_cents)" }
      - { name: approved_by, type: string, source: system, description: "User ID that approved the batch, null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | PAID" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Shelter
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /petcare/shelters/:shelter_id/suspend"
        actor: ShelterManager
        preconditions:
          - "Shelter must currently be OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "Subsequent POST /petcare/adoption-applications and POST /petcare/boarding-reservations targeting this shelter are rejected with ERR_SHELTER_SUSPENDED"
          - "In-progress applications and reservations continue but cannot be approved or confirmed while SUSPENDED"

      - from: SUSPENDED
        to: OPEN
        trigger: "POST /petcare/shelters/:shelter_id/reopen"
        actor: ShelterManager
        preconditions:
          - "Shelter must currently be SUSPENDED (ERR_INVALID_STATE)"
          - "No animal at this shelter has an ACTIVE ComplianceHold of severity CRITICAL (ERR_CRITICAL_HOLD_PRESENT)"
        side_effects: []

  - entity: Animal
    field: status
    initial_state: INTAKE
    terminal_states: [ADOPTED]
    transitions:
      - from: INTAKE
        to: AVAILABLE
        trigger: "POST /petcare/animals/:animal_id/make-available"
        actor: CaseWorker
        preconditions:
          - "Animal must be INTAKE (ERR_INVALID_STATE)"
          - "Animal.vaccination_compliant must be true (ERR_VACCINATION_NOT_COMPLIANT)"
          - "No ACTIVE ComplianceHold of severity HIGH or CRITICAL (ERR_COMPLIANCE_HOLD_ACTIVE)"
          - "Owning Shelter must be OPEN (ERR_SHELTER_SUSPENDED)"
        side_effects:
          - "adoption_eligible recomputed"

      - from: AVAILABLE
        to: ADOPTION_PENDING
        trigger: "system (AdoptionApplication transitioned to APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "adoption_eligible becomes false"

      - from: ADOPTION_PENDING
        to: AVAILABLE
        trigger: "system (associated AdoptionApplication transitions to REJECTED or WITHDRAWN before COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "adoption_eligible recomputed"

      - from: ADOPTION_PENDING
        to: ADOPTED
        trigger: "system (associated AdoptionApplication transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "shelter.adoption_count incremented"

      - from: AVAILABLE
        to: BOARDING
        trigger: "system (associated BoardingReservation transitions to CHECKED_IN)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BOARDING
        to: AVAILABLE
        trigger: "system (associated BoardingReservation transitions to CHECKED_OUT)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [AVAILABLE, BOARDING]
        to: UNAVAILABLE
        trigger: "system (ComplianceHold of severity HIGH or CRITICAL created for this animal)"
        actor: system
        preconditions: []
        side_effects:
          - "adoption_eligible becomes false"
          - "Active BoardingReservation, if any, remains in its current state — animal continues to receive care"

      - from: UNAVAILABLE
        to: AVAILABLE
        trigger: "system (all ACTIVE ComplianceHolds of severity HIGH or CRITICAL on the animal are RESOLVED)"
        actor: system
        preconditions:
          - "active_hold_count of severity HIGH or CRITICAL must be zero"
        side_effects:
          - "adoption_eligible recomputed"

  - entity: AdoptionApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /petcare/adoption-applications/:application_id/start-review"
        actor: CaseWorker
        preconditions:
          - "Application must be SUBMITTED (ERR_INVALID_STATE)"
          - "Animal status must be AVAILABLE (ERR_ANIMAL_NOT_AVAILABLE)"
          - "Adopter status must be ACTIVE (ERR_ADOPTER_BLACKLISTED)"
          - "Owning Shelter must be OPEN (ERR_SHELTER_SUSPENDED)"
        side_effects:
          - "reviewer_id set to X-User-ID of the caller"
          - "animal_version_pinned set to current Animal.version"
          - "adopter_version_pinned set to current Adopter.version"

      - from: UNDER_REVIEW
        to: HOME_VISIT_REQUIRED
        trigger: "POST /petcare/adoption-applications/:application_id/require-home-visit"
        actor: CaseWorker
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_INVALID_STATE)"
          - "X-User-ID must equal reviewer_id (ERR_REVIEWER_MISMATCH)"
        side_effects: []

      - from: UNDER_REVIEW
        to: REVIEWED
        trigger: "POST /petcare/adoption-applications/:application_id/complete-review"
        actor: CaseWorker
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_INVALID_STATE)"
          - "X-User-ID must equal reviewer_id (ERR_REVIEWER_MISMATCH)"
          - "If application.requires_home_visit is true, reject with ERR_HOME_VISIT_REQUIRED — caller must use require-home-visit instead"
        side_effects: []

      - from: HOME_VISIT_REQUIRED
        to: HOME_VISIT_SCHEDULED
        trigger: "system (POST /petcare/home-visits creates a SCHEDULED HomeVisit referencing this application)"
        actor: system
        preconditions: []
        side_effects:
          - "home_visit_id set to the new HomeVisit.id"

      - from: HOME_VISIT_SCHEDULED
        to: REVIEWED
        trigger: "system (associated HomeVisit transitions to COMPLETED with result PASS or CONDITIONAL_PASS)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HOME_VISIT_SCHEDULED
        to: HOME_VISIT_REQUIRED
        trigger: "system (associated HomeVisit transitions to CANCELLED or EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "home_visit_id set to null"

      - from: HOME_VISIT_SCHEDULED
        to: REJECTED
        trigger: "system (associated HomeVisit transitions to COMPLETED with result FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "rejection_reason set to 'Home visit failed'"

      - from: REVIEWED
        to: APPROVED
        trigger: "POST /petcare/adoption-applications/:application_id/approve"
        actor: ShelterManager
        preconditions:
          - "Application must be REVIEWED (ERR_INVALID_STATE)"
          - "X-User-ID must differ from reviewer_id (ERR_SELF_APPROVAL)"
          - "Animal.version must equal animal_version_pinned (ERR_STALE_ANIMAL_DATA)"
          - "Adopter.version must equal adopter_version_pinned (ERR_STALE_ADOPTER_DATA)"
          - "Animal status must still be AVAILABLE (ERR_ANIMAL_NOT_AVAILABLE)"
          - "Owning Shelter must be OPEN (ERR_SHELTER_SUSPENDED)"
        side_effects:
          - "approver_id set to X-User-ID of the caller"
          - "Animal status transitions AVAILABLE -> ADOPTION_PENDING"
          - "FeeInvoice created with reference_type=ADOPTION, status=ISSUED, line items computed by the adoption_fee_calculation rule"
          - "fee_invoice_id set to the new invoice's id"

      - from: REVIEWED
        to: REJECTED
        trigger: "POST /petcare/adoption-applications/:application_id/reject"
        actor: ShelterManager
        preconditions:
          - "Application must be REVIEWED (ERR_INVALID_STATE)"
          - "X-User-ID must differ from reviewer_id (ERR_SELF_APPROVAL)"
          - "rejection_reason must be supplied in the request body (ERR_INVALID_REQUEST)"
        side_effects:
          - "rejection_reason set from request body"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /petcare/adoption-applications/:application_id/complete"
        actor: CaseWorker
        preconditions:
          - "Application must be APPROVED (ERR_INVALID_STATE)"
          - "Associated FeeInvoice status must be PAID (ERR_FEE_NOT_PAID)"
        side_effects:
          - "Animal status transitions ADOPTION_PENDING -> ADOPTED"
          - "shelter.adoption_count incremented"
          - "adopter.adoption_history_count incremented"

      - from: [SUBMITTED, UNDER_REVIEW, HOME_VISIT_REQUIRED, HOME_VISIT_SCHEDULED, REVIEWED]
        to: WITHDRAWN
        trigger: "POST /petcare/adoption-applications/:application_id/withdraw"
        actor: CaseWorker
        preconditions:
          - "Application must not be APPROVED, COMPLETED, or REJECTED (ERR_INVALID_STATE)"
        side_effects:
          - "If Animal status is ADOPTION_PENDING, revert it to AVAILABLE"
          - "If linked HomeVisit is SCHEDULED, transition that HomeVisit to CANCELLED"

  - entity: HomeVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /petcare/home-visits/:home_visit_id/complete"
        actor: CaseWorker
        preconditions:
          - "HomeVisit must be SCHEDULED (ERR_INVALID_STATE)"
          - "X-User-ID must equal case_worker_id (ERR_ASSESSOR_MISMATCH)"
          - "Request body must contain yard_adequate, space_adequate, safety_hazards_found, existing_pets_compatible, notes (ERR_INVALID_REQUEST)"
        side_effects:
          - "overall_score computed by the home_visit_scoring rule"
          - "result derived from overall_score"
          - "adopter.latest_home_visit_id and latest_home_visit_result updated"
          - "Linked AdoptionApplication transitions HOME_VISIT_SCHEDULED -> REVIEWED if result is PASS or CONDITIONAL_PASS, otherwise -> REJECTED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /petcare/home-visits/:home_visit_id/cancel"
        actor: CaseWorker
        preconditions:
          - "HomeVisit must be SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Linked AdoptionApplication transitions HOME_VISIT_SCHEDULED -> HOME_VISIT_REQUIRED"

      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /petcare/home-visits/expire-due (system sweep run by ShelterManager) — transitions any SCHEDULED visit whose scheduled_date is strictly less than current_time"
        actor: ShelterManager
        preconditions:
          - "scheduled_date must be strictly less than current time"
        side_effects:
          - "Linked AdoptionApplication transitions HOME_VISIT_SCHEDULED -> HOME_VISIT_REQUIRED"

  - entity: BoardingReservation
    field: status
    initial_state: REQUESTED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /petcare/boarding-reservations/:reservation_id/confirm"
        actor: ShelterManager
        preconditions:
          - "Reservation must be REQUESTED (ERR_INVALID_STATE)"
          - "Owning Shelter must be OPEN (ERR_SHELTER_SUSPENDED)"
          - "Animal.vaccination_compliant must be true (ERR_VACCINATION_NOT_COMPLIANT)"
          - "Number of CONFIRMED + CHECKED_IN reservations at this shelter must be < shelter.boarding_capacity (ERR_BOARDING_CAPACITY_FULL)"
          - "No CONFIRMED or CHECKED_IN reservation for the same animal whose [check_in_date, check_out_date) overlaps this reservation's interval (ERR_BOARDING_DATE_OVERLAP)"
          - "No ACTIVE ComplianceHold of severity HIGH or CRITICAL on the animal (ERR_COMPLIANCE_HOLD_ACTIVE)"
        side_effects:
          - "BoardingMatch created using boarding_compatibility_scoring; boarding_match_id set"
          - "FeeInvoice created with reference_type=BOARDING, status=ISSUED, line items computed by the boarding_fee_calculation rule using planned dates; fee_invoice_id set"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /petcare/boarding-reservations/:reservation_id/check-in"
        actor: CaseWorker
        preconditions:
          - "Reservation must be CONFIRMED (ERR_INVALID_STATE)"
          - "Animal.vaccination_compliant must still be true at the moment of check-in (ERR_VACCINATION_NOT_COMPLIANT)"
          - "No ACTIVE ComplianceHold of severity HIGH or CRITICAL on the animal (ERR_COMPLIANCE_HOLD_ACTIVE)"
          - "current_time must be >= check_in_date (ERR_TOO_EARLY_TO_CHECK_IN)"
        side_effects:
          - "actual_check_in set to current_time"
          - "shelter.current_boarding_count incremented"
          - "Animal status transitions AVAILABLE -> BOARDING"

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /petcare/boarding-reservations/:reservation_id/check-out"
        actor: CaseWorker
        preconditions:
          - "Reservation must be CHECKED_IN (ERR_INVALID_STATE)"
        side_effects:
          - "actual_check_out set to current_time"
          - "actual_duration_days recomputed"
          - "FeeInvoice line items recomputed using actual dates by the boarding_fee_calculation rule (final variant); total_amount_cents updated and balance_due_cents recomputed"
          - "shelter.current_boarding_count decremented"
          - "Animal status transitions BOARDING -> AVAILABLE"

      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /petcare/boarding-reservations/:reservation_id/cancel"
        actor: ShelterManager
        preconditions:
          - "Reservation must be REQUESTED or CONFIRMED (ERR_INVALID_STATE)"
        side_effects:
          - "If a BoardingMatch exists, set its voided_at to current_time"
          - "If FeeInvoice exists and status is ISSUED, transition invoice to VOID"
          - "If FeeInvoice exists and status is PAID or PARTIALLY_PAID, an explicit /refund call is required to clean up funds (no implicit refund)"

  - entity: FeeInvoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, REFUNDED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system (created by AdoptionApplication.approve or BoardingReservation.confirm with status set directly to ISSUED)"
        actor: system
        preconditions: []
        side_effects:
          - "Line items, subtotal_cents, discount_cents, tax_cents, total_amount_cents finalized at creation"

      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /petcare/fee-invoices/:invoice_id/pay"
        actor: CaseWorker
        preconditions:
          - "Invoice must be ISSUED (ERR_INVALID_STATE)"
          - "amount_cents in the request body must be > 0 and <= balance_due_cents (ERR_PAYMENT_AMOUNT_INVALID)"
          - "After this payment, paid_amount_cents + amount_cents must be < total_amount_cents"
        side_effects:
          - "paid_amount_cents += amount_cents"
          - "balance_due_cents recomputed"

      - from: [ISSUED, PARTIALLY_PAID]
        to: PAID
        trigger: "POST /petcare/fee-invoices/:invoice_id/pay"
        actor: CaseWorker
        preconditions:
          - "Invoice must be ISSUED or PARTIALLY_PAID (ERR_INVALID_STATE)"
          - "amount_cents in the request body must be > 0 and <= balance_due_cents (ERR_PAYMENT_AMOUNT_INVALID)"
          - "After this payment, paid_amount_cents + amount_cents must equal total_amount_cents"
        side_effects:
          - "paid_amount_cents = total_amount_cents, balance_due_cents = 0"
          - "shelter.revenue_pending_cents += total_amount_cents (until included in an APPROVED SettlementBatch)"

      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /petcare/fee-invoices/:invoice_id/pay (intermediate payment)"
        actor: CaseWorker
        preconditions:
          - "amount_cents > 0 and amount_cents < balance_due_cents (ERR_PAYMENT_AMOUNT_INVALID)"
        side_effects:
          - "paid_amount_cents += amount_cents"

      - from: [PAID, PARTIALLY_PAID]
        to: REFUNDED
        trigger: "POST /petcare/fee-invoices/:invoice_id/refund"
        actor: ShelterManager
        preconditions:
          - "Invoice must be PAID or PARTIALLY_PAID (ERR_INVALID_STATE)"
          - "Invoice must NOT already be associated with an APPROVED or PAID SettlementBatch (ERR_INVOICE_ALREADY_SETTLED)"
        side_effects:
          - "refund_amount_cents = paid_amount_cents"
          - "shelter.revenue_pending_cents decreased by paid_amount_cents"

      - from: [DRAFT, ISSUED]
        to: VOID
        trigger: "POST /petcare/fee-invoices/:invoice_id/void"
        actor: ShelterManager
        preconditions:
          - "Invoice must be DRAFT or ISSUED (ERR_INVALID_STATE)"
          - "paid_amount_cents must be 0 (ERR_INVOICE_HAS_PAYMENTS)"
        side_effects: []

  - entity: ComplianceHold
    field: status
    initial_state: ACTIVE
    terminal_states: [RESOLVED]
    transitions:
      - from: ACTIVE
        to: RESOLVED
        trigger: "POST /petcare/compliance-holds/:hold_id/resolve"
        actor: ShelterManager
        preconditions:
          - "Hold must be ACTIVE (ERR_INVALID_STATE)"
          - "resolution_notes must be supplied in the request body (ERR_INVALID_REQUEST)"
        side_effects:
          - "resolved_by set to X-User-ID, resolution_notes recorded"
          - "Animal.active_hold_count decremented; adoption_eligible recomputed"
          - "If the animal had transitioned to UNAVAILABLE because of HIGH/CRITICAL holds and now has none, animal status transitions UNAVAILABLE -> AVAILABLE"
          - "shelter.compliance_score recomputed"

  - entity: SettlementBatch
    field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /petcare/settlement-batches/:batch_id/approve"
        actor: ShelterManager
        preconditions:
          - "Batch must be DRAFT (ERR_INVALID_STATE)"
          - "All invoices in invoice_ids must still be PAID (ERR_INVOICE_STATUS_CHANGED)"
        side_effects:
          - "approved_by set to X-User-ID"
          - "Each included invoice's settlement_batch_id is set"
          - "shelter.revenue_settled_cents += net_amount_cents; shelter.revenue_pending_cents decreased correspondingly"

      - from: APPROVED
        to: PAID
        trigger: "POST /petcare/settlement-batches/:batch_id/mark-paid"
        actor: ShelterManager
        preconditions:
          - "Batch must be APPROVED (ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two AdoptionApplications for the same animal both reach REVIEWED and are approved by different ShelterManagers simultaneously"
    guarantee: "At most one application per animal can transition to APPROVED. The first writer succeeds and moves Animal AVAILABLE -> ADOPTION_PENDING; the second loses on the AVAILABLE precondition."
    error_id: ERR_ANIMAL_NOT_AVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Animal.status check during the approve transition"

  - scenario: "Application approve and ComplianceHold creation race on the same animal"
    guarantee: "Exactly one operation succeeds. If the hold (HIGH or CRITICAL) is committed first, the approve fails with ERR_COMPLIANCE_HOLD_ACTIVE. If the approve commits first, the animal becomes ADOPTION_PENDING and the hold creation still succeeds but does not retroactively cancel the application."
    error_id: ERR_COMPLIANCE_HOLD_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on the Animal record"

  - scenario: "PATCH /petcare/animals/:animal_id and POST /petcare/adoption-applications/:application_id/approve race; both observe matching versions but the PATCH commits first"
    guarantee: "PATCH succeeds and bumps Animal.version. The approve loses the pinned-version check and returns ERR_STALE_ANIMAL_DATA; the application stays in REVIEWED."
    error_id: ERR_STALE_ANIMAL_DATA
    http_status: 409

  - scenario: "Two BoardingReservation confirm calls for the same animal whose date intervals overlap"
    guarantee: "At most one of the two reservations transitions to CONFIRMED; the loser is rejected with ERR_BOARDING_DATE_OVERLAP."
    error_id: ERR_BOARDING_DATE_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on the (animal_id, date interval) check"

  - scenario: "Boarding confirm calls at a shelter exactly at the capacity boundary (current count == capacity - 1, two calls arrive)"
    guarantee: "Exactly one call succeeds; the other is rejected with ERR_BOARDING_CAPACITY_FULL. Capacity is checked at commit time, not at request time."
    error_id: ERR_BOARDING_CAPACITY_FULL
    http_status: 409

  - scenario: "POST /pay and POST /void race on the same FeeInvoice in ISSUED status"
    guarantee: "Exactly one operation succeeds. Either the payment is recorded (status -> PARTIALLY_PAID or PAID) and the subsequent void fails with ERR_INVOICE_HAS_PAYMENTS, OR the void completes (status -> VOID) and the subsequent payment fails with ERR_INVALID_STATE."
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 409
    serialization: "First-writer-wins on FeeInvoice.status"

  - scenario: "POST /refund and POST /settlement-batches/:id/approve race for an invoice that has just been PAID"
    guarantee: "Exactly one operation succeeds. If the refund commits first, the invoice becomes REFUNDED and the batch approval fails with ERR_INVOICE_STATUS_CHANGED for that invoice. If the batch approval commits first, the refund fails with ERR_INVOICE_ALREADY_SETTLED."
    error_id: ERR_INVOICE_ALREADY_SETTLED
    http_status: 409

  - scenario: "Two HomeVisit /complete calls for the same visit by different CaseWorkers"
    guarantee: "Exactly one transitions SCHEDULED -> COMPLETED; the loser receives ERR_INVALID_STATE. If neither caller equals the assigned case_worker_id, both receive ERR_ASSESSOR_MISMATCH."
    error_id: ERR_INVALID_STATE
    http_status: 409

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: vaccination_compliance
    trigger: "On VaccinationRecord creation, on read of Animal.vaccination_compliant, before make-available, before boarding confirm, before boarding check-in"
    algorithm: aggregation
    formula: |
      required = SPECIES_VACCINE_MAP[animal.species]
      for vaccine in required:
        records = VaccinationRecord where animal_id == animal.id and vaccine_name == vaccine
        if not any(r.expiry_date > current_time for r in records):
          return false
      return true
    input_set: "All VaccinationRecords for the animal; only records whose expiry_date is strictly greater than current_time count as valid."
    constants:
      SPECIES_VACCINE_MAP:
        DOG: [RABIES, DHPP]
        CAT: [RABIES, FVRCP]
        RABBIT: [RHDV]
        BIRD: []
        OTHER: []
    precision: "boolean — no rounding"
    variants:
      - name: adoption_compliance
        when: "Used for make-available and adoption approval gating"
        difference: "Uses SPECIES_VACCINE_MAP exactly as defined."
      - name: boarding_compliance
        when: "Used for boarding confirm and check-in gating"
        difference: "Adds BORDETELLA to the required set for DOG; species CAT/RABBIT/BIRD/OTHER use the same set as adoption_compliance. A DOG considered adoption-compliant may still fail boarding-compliance if BORDETELLA is missing or expired."

  - name: home_visit_scoring
    trigger: "POST /petcare/home-visits/:home_visit_id/complete"
    algorithm: weighted_scoring
    formula: |
      yard_pts   = 25 if yard_adequate else 0
      space_pts  = 30 if space_adequate else 0
      hazard_pts = 0  if safety_hazards_found else 25  # absence of hazards is rewarded
      pets_pts   = 20 if existing_pets_compatible else 0
      overall_score = yard_pts + space_pts + hazard_pts + pets_pts

      if overall_score >= PASS_THRESHOLD:
        result = PASS
      elif overall_score >= CONDITIONAL_THRESHOLD:
        result = CONDITIONAL_PASS
      else:
        result = FAIL
    input_set: "The four assessment booleans submitted in the /complete request body."
    constants:
      PASS_THRESHOLD: 70
      CONDITIONAL_THRESHOLD: 50
    precision: "integer — no rounding"
    variants:
      - name: yard_optional
        when: "Animal.species in [CAT, BIRD, RABBIT]"
        difference: "yard weight becomes 0; space weight increases from 30 to 55. Maximum possible score remains 100. PASS_THRESHOLD and CONDITIONAL_THRESHOLD are unchanged."

  - name: boarding_compatibility_scoring
    trigger: "BoardingMatch creation during /confirm"
    algorithm: weighted_scoring
    formula: |
      base = 100
      penalty = 0
      concurrent = animals at this shelter with status BOARDING (CHECKED_IN reservations)
      for other in concurrent:
        if other.species != animal.species:
          penalty += SPECIES_MISMATCH_PENALTY
        if other.temperament == AGGRESSIVE or animal.temperament == AGGRESSIVE:
          penalty += AGGRESSIVE_PENALTY
        if (other.temperament == ENERGETIC and animal.temperament == CALM) or \
           (other.temperament == CALM and animal.temperament == ENERGETIC):
          penalty += TEMPERAMENT_CLASH_PENALTY
      penalty += SPECIAL_NEEDS_PENALTY * len(animal.special_needs)
      compatibility_score = max(0, base - penalty)

      # Zone assignment is independent of the score
      if animal.temperament == AGGRESSIVE: boarding_zone = ISOLATION
      elif animal.temperament == ENERGETIC: boarding_zone = ACTIVE
      elif animal.species in [CAT, BIRD, RABBIT]: boarding_zone = SMALL_ANIMAL
      else: boarding_zone = GENERAL
    input_set: "All animals at the same shelter that are currently in status BOARDING (i.e., have a CHECKED_IN BoardingReservation) at the moment of /confirm. The new reservation's animal is excluded from the input set."
    constants:
      SPECIES_MISMATCH_PENALTY: 10
      AGGRESSIVE_PENALTY: 25
      TEMPERAMENT_CLASH_PENALTY: 15
      SPECIAL_NEEDS_PENALTY: 5
    precision: "integer — score floor at 0"

  - name: adoption_fee_calculation
    trigger: "AdoptionApplication.approve creates the FeeInvoice"
    algorithm: tiered_pricing
    formula: |
      base = lookup(FeeSchedule, shelter_id, fee_type=ADOPTION_BASE, species=animal.species, at=current_time)
      if base is null: base = lookup(... species=ALL ...)

      if animal.age_months >= AGE_SENIOR_THRESHOLD_MONTHS:
        base = floor(base * SENIOR_DISCOUNT_RATE)

      surcharge_unit = lookup(FeeSchedule, shelter_id, fee_type=SPECIAL_NEEDS_SURCHARGE, species=animal.species, at=current_time)
      if surcharge_unit is null: surcharge_unit = 0
      surcharge = surcharge_unit * len(animal.special_needs)

      subtotal_cents = base + surcharge

      loyalty_pct_row = lookup(FeeSchedule, shelter_id, fee_type=LOYALTY_DISCOUNT_PCT, species=ALL, at=current_time)
      loyalty_pct = loyalty_pct_row.amount_cents if loyalty_pct_row and adopter.adoption_history_count >= LOYALTY_THRESHOLD else 0
      discount_cents = floor(subtotal_cents * loyalty_pct / 100)

      tax_cents = round_half_up((subtotal_cents - discount_cents) * shelter.tax_rate)
      total_amount_cents = subtotal_cents - discount_cents + tax_cents
    input_set: "FeeSchedule rows for the shelter that are currently active at approval time, matched by fee_type and species (ALL fallback). Adopter.adoption_history_count is read at approval time."
    constants:
      AGE_SENIOR_THRESHOLD_MONTHS: 84  # 7 years
      SENIOR_DISCOUNT_RATE: 0.5
      LOYALTY_THRESHOLD: 2
    precision: "integer cents; floor on multiplications, round_half_up on tax"
    variants:
      - name: provisional_estimate
        when: "GET /petcare/adoption-applications/:id while status in [SUBMITTED, UNDER_REVIEW, REVIEWED]"
        difference: "Uses the FeeSchedule rows currently active at the time the GET is served. Result may change if FeeSchedule rows are added or expire before approval."
      - name: final_invoice
        when: "Computed at the moment AdoptionApplication transitions to APPROVED"
        difference: "Uses the FeeSchedule rows active at the approval timestamp; once written into the FeeInvoice line_items the values are pinned and immutable, even if FeeSchedule changes afterwards."

  - name: boarding_fee_calculation
    trigger: "BoardingReservation.confirm (provisional), BoardingReservation.check-out (final)"
    algorithm: tiered_pricing
    formula: |
      daily = lookup(FeeSchedule, shelter_id, fee_type=BOARDING_DAILY, species=animal.species, at=current_time)
      if daily is null: daily = lookup(... species=ALL ...)

      surcharge_unit = lookup(FeeSchedule, shelter_id, fee_type=SPECIAL_NEEDS_SURCHARGE, species=animal.species, at=current_time)
      if surcharge_unit is null: surcharge_unit = 0
      effective_daily = daily + surcharge_unit * len(animal.special_needs)

      duration_days = chosen_duration_days  # planned for /confirm, actual for /check-out
      if duration_days > LONG_STAY_THRESHOLD_DAYS:
        effective_daily = floor(effective_daily * LONG_STAY_DISCOUNT_RATE)

      subtotal_cents = effective_daily * duration_days
      discount_cents = 0
      tax_cents = round_half_up(subtotal_cents * shelter.tax_rate)
      total_amount_cents = subtotal_cents + tax_cents
    input_set: "FeeSchedule rows active at the moment the calculation runs. The duration_days input is planned_duration_days at /confirm and actual_duration_days at /check-out."
    constants:
      LONG_STAY_THRESHOLD_DAYS: 14
      LONG_STAY_DISCOUNT_RATE: 0.9
    precision: "integer cents; floor on multiplications, round_half_up on tax"
    variants:
      - name: provisional_boarding_fee
        when: "BoardingReservation.confirm"
        difference: "Uses planned_duration_days computed from check_in_date/check_out_date. Long-stay discount tested against planned_duration_days."
      - name: final_boarding_fee
        when: "BoardingReservation.check-out"
        difference: "Uses actual_duration_days computed from actual_check_in/actual_check_out. The line items, subtotal, tax, and total on the existing invoice are recomputed and overwritten. balance_due_cents is recomputed; if paid_amount_cents > new total_amount_cents the invoice still moves to PAID with paid_amount_cents reduced to new total_amount_cents and the difference recorded as a credit line item with negative amount."

  - name: shelter_compliance_score
    trigger: "VaccinationRecord creation, ComplianceHold creation/resolution, Animal status change"
    algorithm: aggregation
    formula: |
      animals = Animals at shelter with status != ADOPTED
      if len(animals) == 0:
        return 100.00
      compliant = count of animals where vaccination_compliant is true
      base = 100 * compliant / len(animals)
      hold_penalty = HOLD_PENALTY_POINTS * count(active ComplianceHolds across all animals at this shelter)
      compliance_score = max(0, base - hold_penalty)
    input_set: "All Animals at the shelter with status not ADOPTED, plus all ACTIVE ComplianceHolds for those animals."
    constants:
      HOLD_PENALTY_POINTS: 5
    precision: "2 decimal places, round_half_up"

  - name: settlement_amount
    trigger: "POST /petcare/settlement-batches"
    algorithm: chronological
    formula: |
      eligible_invoices = FeeInvoice where shelter_id == batch.shelter_id
                          and status in [PAID, REFUNDED]
                          and (paid_at within [period_start, period_end) for PAID
                               or refunded_at within [period_start, period_end) for REFUNDED)
                          and settlement_batch_id is null
      invoice_ids = [i.id for i in eligible_invoices]
      gross_amount_cents = sum(i.total_amount_cents for i in eligible_invoices if i.status == PAID)
      refund_amount_cents = sum(i.refund_amount_cents for i in eligible_invoices if i.status == REFUNDED)
      net_amount_cents = max(0, gross_amount_cents - refund_amount_cents)
    input_set: "All FeeInvoices for the shelter not yet attached to a SettlementBatch whose payment or refund timestamp falls in [period_start, period_end). Invoices are processed in chronological order of their state change to ensure deterministic batch composition."
    precision: "integer cents"
    variants:
      - name: gross_only_batch
        when: "No invoices in the period have been REFUNDED"
        difference: "refund_amount_cents = 0; net_amount_cents = gross_amount_cents."
      - name: net_with_clawback
        when: "At least one invoice in the period is REFUNDED"
        difference: "refund_amount_cents > 0; if refunds exceed PAID totals in the period (e.g., a refund of an invoice paid in a prior period), the batch is still created with net_amount_cents = 0 and the residual is carried into the shelter's revenue_pending_cents as a debit."

  - name: revenue_balance_reconciliation
    trigger: "FeeInvoice transition to PAID, REFUNDED; SettlementBatch transition to APPROVED"
    algorithm: aggregation
    formula: |
      revenue_pending_cents  = sum(total_amount_cents for PAID invoices with settlement_batch_id == null)
                              - sum(refund_amount_cents for REFUNDED invoices with settlement_batch_id == null)
      revenue_settled_cents  = sum(net_amount_cents for SettlementBatches in status APPROVED or PAID)
    input_set: "All FeeInvoices and SettlementBatches for the shelter."
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header must be present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role header must be present and one of ShelterManager | CaseWorker | Veterinarian"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Caller role must be authorized for the requested endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path parameters must reference existing resources, validated left-to-right"
    error_id: "ERR_SHELTER_NOT_FOUND | ERR_ANIMAL_NOT_FOUND | ERR_ADOPTER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_HOME_VISIT_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_HOLD_NOT_FOUND | ERR_FEE_SCHEDULE_NOT_FOUND | ERR_SETTLEMENT_BATCH_NOT_FOUND | ERR_VACCINATION_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: all path-scoped endpoints

  - priority: 5
    category: existence
    check: "Foreign-key references in the request body must resolve to existing resources"
    error_id: "ERR_SHELTER_NOT_FOUND | ERR_ANIMAL_NOT_FOUND | ERR_ADOPTER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND"
    http_status: 404
    applies_to: POST endpoints with FK fields

  - priority: 6
    category: state
    check: "Owning Shelter must be OPEN before accepting POST /petcare/adoption-applications, POST /petcare/boarding-reservations, or AdoptionApplication.approve"
    error_id: ERR_SHELTER_SUSPENDED
    http_status: 409
    applies_to: "POST /petcare/adoption-applications, POST /petcare/boarding-reservations, POST /petcare/adoption-applications/:id/approve, POST /petcare/adoption-applications/:id/start-review"

  - priority: 7
    category: state
    check: "Resource must be in a state from which the requested transition is permitted"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints performing a state transition

  - priority: 8
    category: business_safety
    check: "Animal.vaccination_compliant must be true for make-available, boarding confirm, and boarding check-in"
    error_id: ERR_VACCINATION_NOT_COMPLIANT
    http_status: 409
    applies_to: "POST /petcare/animals/:id/make-available, POST /petcare/boarding-reservations/:id/confirm, POST /petcare/boarding-reservations/:id/check-in"

  - priority: 9
    category: business_safety
    check: "No ACTIVE ComplianceHold of severity HIGH or CRITICAL on the animal for make-available, boarding confirm, boarding check-in, or application approve"
    error_id: ERR_COMPLIANCE_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /petcare/animals/:id/make-available, POST /petcare/boarding-reservations/:id/confirm, POST /petcare/boarding-reservations/:id/check-in, POST /petcare/adoption-applications/:id/approve"

  - priority: 10
    category: business_safety
    check: "Reopening a SUSPENDED shelter requires no animal at that shelter to have an ACTIVE CRITICAL ComplianceHold"
    error_id: ERR_CRITICAL_HOLD_PRESENT
    http_status: 409
    applies_to: "POST /petcare/shelters/:id/reopen"

  - priority: 11
    category: business_referential
    check: "Animal must be AVAILABLE for new adoption applications and at approval time"
    error_id: ERR_ANIMAL_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /petcare/adoption-applications, POST /petcare/adoption-applications/:id/start-review, POST /petcare/adoption-applications/:id/approve"

  - priority: 12
    category: business_referential
    check: "Adopter must have status ACTIVE (not BLACKLISTED)"
    error_id: ERR_ADOPTER_BLACKLISTED
    http_status: 409
    applies_to: "POST /petcare/adoption-applications, POST /petcare/adoption-applications/:id/start-review"

  - priority: 13
    category: business_constraint
    check: "Approver must differ from reviewer (segregation of duties)"
    error_id: ERR_SELF_APPROVAL
    http_status: 409
    applies_to: "POST /petcare/adoption-applications/:id/approve, POST /petcare/adoption-applications/:id/reject"

  - priority: 14
    category: business_constraint
    check: "Animal.version must equal animal_version_pinned at approval time"
    error_id: ERR_STALE_ANIMAL_DATA
    http_status: 409
    applies_to: "POST /petcare/adoption-applications/:id/approve"

  - priority: 15
    category: business_constraint
    check: "Adopter.version must equal adopter_version_pinned at approval time"
    error_id: ERR_STALE_ADOPTER_DATA
    http_status: 409
    applies_to: "POST /petcare/adoption-applications/:id/approve"

  - priority: 16
    category: business_constraint
    check: "If application.requires_home_visit is true, /complete-review is not allowed before a HomeVisit is COMPLETED with PASS or CONDITIONAL_PASS"
    error_id: ERR_HOME_VISIT_REQUIRED
    http_status: 409
    applies_to: "POST /petcare/adoption-applications/:id/complete-review"

  - priority: 17
    category: business_constraint
    check: "X-User-ID must equal the case_worker_id assigned to the HomeVisit on /complete"
    error_id: ERR_ASSESSOR_MISMATCH
    http_status: 409
    applies_to: "POST /petcare/home-visits/:id/complete"

  - priority: 18
    category: business_constraint
    check: "X-User-ID must equal the reviewer_id on /require-home-visit and /complete-review"
    error_id: ERR_REVIEWER_MISMATCH
    http_status: 409
    applies_to: "POST /petcare/adoption-applications/:id/require-home-visit, POST /petcare/adoption-applications/:id/complete-review"

  - priority: 19
    category: business_constraint
    check: "BoardingReservation date intervals must not overlap an existing CONFIRMED or CHECKED_IN reservation for the same animal"
    error_id: ERR_BOARDING_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /petcare/boarding-reservations/:id/confirm"

  - priority: 20
    category: business_temporal
    check: "BoardingReservation.check_out_date must be strictly greater than check_in_date and check_in_date must be >= the day of submission"
    error_id: ERR_INVALID_DATES
    http_status: 422
    applies_to: "POST /petcare/boarding-reservations"

  - priority: 21
    category: business_temporal
    check: "HomeVisit.scheduled_date must be strictly greater than current_time at creation"
    error_id: ERR_INVALID_DATES
    http_status: 422
    applies_to: "POST /petcare/home-visits"

  - priority: 22
    category: business_temporal
    check: "FeeSchedule.effective_to (if not null) must be strictly greater than effective_from"
    error_id: ERR_INVALID_DATES
    http_status: 422
    applies_to: "POST /petcare/fee-schedules"

  - priority: 23
    category: business_temporal
    check: "VaccinationRecord.expiry_date must be strictly greater than administered_date and administered_date must be <= current_time"
    error_id: ERR_INVALID_DATES
    http_status: 422
    applies_to: "POST /petcare/vaccination-records"

  - priority: 24
    category: business_temporal
    check: "BoardingReservation.check-in is rejected if current_time < check_in_date"
    error_id: ERR_TOO_EARLY_TO_CHECK_IN
    http_status: 409
    applies_to: "POST /petcare/boarding-reservations/:id/check-in"

  - priority: 25
    category: business_constraint
    check: "Number of CONFIRMED + CHECKED_IN reservations at shelter must remain < shelter.boarding_capacity"
    error_id: ERR_BOARDING_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /petcare/boarding-reservations/:id/confirm"

  - priority: 26
    category: business_fiscal
    check: "Adoption.complete is rejected unless the linked FeeInvoice is PAID"
    error_id: ERR_FEE_NOT_PAID
    http_status: 409
    applies_to: "POST /petcare/adoption-applications/:id/complete"

  - priority: 27
    category: business_fiscal
    check: "Payment amount_cents must be > 0 and <= balance_due_cents"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /petcare/fee-invoices/:id/pay"

  - priority: 28
    category: business_fiscal
    check: "Invoice cannot be voided if paid_amount_cents > 0"
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 409
    applies_to: "POST /petcare/fee-invoices/:id/void"

  - priority: 29
    category: business_fiscal
    check: "Invoice cannot be refunded if it is already attached to an APPROVED or PAID SettlementBatch"
    error_id: ERR_INVOICE_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /petcare/fee-invoices/:id/refund"

  - priority: 30
    category: business_fiscal
    check: "SettlementBatch.approve fails if any included invoice is no longer in PAID status"
    error_id: ERR_INVOICE_STATUS_CHANGED
    http_status: 409
    applies_to: "POST /petcare/settlement-batches/:id/approve"

  - priority: 31
    category: business_fiscal
    check: "Shelter.tax_rate at creation must be in [0.0, 0.30]; SettlementBatch.period_end strictly greater than period_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /petcare/shelters, POST /petcare/settlement-batches"

  - priority: 32
    category: concurrency
    check: "If a request body includes version on a PATCH and the value differs from the current resource version, reject"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

# =============================================================================
# Table 5: API Endpoint Table (40 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 20, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Shelters ---
  - method: POST
    path: "/petcare/shelters"
    description: "Create a new shelter"
    roles: [ShelterManager]
    code: 201
    input: [name, address, contact_email, boarding_capacity, tax_rate]
    output: Shelter
    side_effects: ["status set to OPEN; computed counters initialized to 0; compliance_score initialized to 100"]

  - method: GET
    path: "/petcare/shelters"
    description: "List all shelters"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Shelter[]"
    side_effects: []

  - method: GET
    path: "/petcare/shelters/:shelter_id"
    description: "Get a specific shelter"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: []
    output: Shelter
    side_effects: []

  - method: POST
    path: "/petcare/shelters/:shelter_id/suspend"
    description: "Suspend a shelter, blocking new adoption applications and boarding reservations"
    roles: [ShelterManager]
    code: 200
    input: []
    output: Shelter
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/petcare/shelters/:shelter_id/reopen"
    description: "Reopen a suspended shelter"
    roles: [ShelterManager]
    code: 200
    input: []
    output: Shelter
    side_effects: ["status -> OPEN if no CRITICAL holds present"]

  # --- Animals ---
  - method: POST
    path: "/petcare/animals"
    description: "Register a new animal"
    roles: [CaseWorker]
    code: 201
    input: [shelter_id, name, species, breed, age_months, weight_kg, temperament, "special_needs?"]
    output: Animal
    side_effects: ["status set to INTAKE; vaccination_compliant computed; boarding_zone_hint computed"]

  - method: GET
    path: "/petcare/animals"
    description: "List animals with filtering"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: ["shelter_id?", "species?", "status?", "limit?", "offset?"]
    output: "Animal[]"
    side_effects: []

  - method: GET
    path: "/petcare/animals/:animal_id"
    description: "Get a specific animal"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: []
    output: Animal
    side_effects: []

  - method: PATCH
    path: "/petcare/animals/:animal_id"
    description: "Update editable fields on an animal"
    roles: [CaseWorker]
    code: 200
    input: ["name?", "breed?", "age_months?", "weight_kg?", "temperament?", "special_needs?", version]
    output: Animal
    side_effects: ["adoption_eligible recomputed; boarding_zone_hint recomputed"]

  - method: POST
    path: "/petcare/animals/:animal_id/make-available"
    description: "Transition an animal from INTAKE to AVAILABLE"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Animal
    side_effects: ["status -> AVAILABLE"]

  # --- VaccinationRecords ---
  - method: POST
    path: "/petcare/vaccination-records"
    description: "Record a vaccination for an animal"
    roles: [Veterinarian]
    code: 201
    input: [animal_id, vaccine_name, administered_date, expiry_date, batch_number]
    output: VaccinationRecord
    side_effects: ["animal.vaccination_compliant recomputed; shelter.compliance_score recomputed"]

  - method: GET
    path: "/petcare/vaccination-records"
    description: "List vaccination records"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: ["animal_id?", "vaccine_name?", "limit?", "offset?"]
    output: "VaccinationRecord[]"
    side_effects: []

  - method: GET
    path: "/petcare/vaccination-records/:vaccination_record_id"
    description: "Get a specific vaccination record"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: []
    output: VaccinationRecord
    side_effects: []

  # --- Adopters ---
  - method: POST
    path: "/petcare/adopters"
    description: "Register a new adopter"
    roles: [CaseWorker]
    code: 201
    input: [shelter_id, full_name, email, phone, home_type, has_yard, has_other_pets, "other_pet_species?"]
    output: Adopter
    side_effects: ["status set to ACTIVE; counters initialized"]

  - method: GET
    path: "/petcare/adopters"
    description: "List adopters with filtering"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?", "status?", "limit?", "offset?"]
    output: "Adopter[]"
    side_effects: []

  - method: GET
    path: "/petcare/adopters/:adopter_id"
    description: "Get a specific adopter"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: Adopter
    side_effects: []

  - method: PATCH
    path: "/petcare/adopters/:adopter_id"
    description: "Update editable fields on an adopter"
    roles: [CaseWorker]
    code: 200
    input: ["full_name?", "email?", "phone?", "home_type?", "has_yard?", "has_other_pets?", "other_pet_species?", version]
    output: Adopter
    side_effects: []

  - method: POST
    path: "/petcare/adopters/:adopter_id/blacklist"
    description: "Mark an adopter as BLACKLISTED"
    roles: [ShelterManager]
    code: 200
    input: [reason]
    output: Adopter
    side_effects: ["status -> BLACKLISTED; all SUBMITTED/UNDER_REVIEW/HOME_VISIT_REQUIRED/HOME_VISIT_SCHEDULED/REVIEWED applications by this adopter transition to WITHDRAWN with cascade"]

  # --- AdoptionApplications ---
  - method: POST
    path: "/petcare/adoption-applications"
    description: "Submit a new adoption application"
    roles: [CaseWorker]
    code: 201
    input: [animal_id, adopter_id, reason]
    output: AdoptionApplication
    side_effects: ["status=SUBMITTED; shelter_id derived from animal; requires_home_visit computed"]

  - method: GET
    path: "/petcare/adoption-applications"
    description: "List adoption applications with filtering"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?", "adopter_id?", "animal_id?", "status?", "limit?", "offset?"]
    output: "AdoptionApplication[]"
    side_effects: []

  - method: GET
    path: "/petcare/adoption-applications/:application_id"
    description: "Get a specific adoption application"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: []

  - method: POST
    path: "/petcare/adoption-applications/:application_id/start-review"
    description: "Begin reviewing an application"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> UNDER_REVIEW; reviewer_id set; versions pinned"]

  - method: POST
    path: "/petcare/adoption-applications/:application_id/require-home-visit"
    description: "Mark an under-review application as requiring a home visit"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> HOME_VISIT_REQUIRED"]

  - method: POST
    path: "/petcare/adoption-applications/:application_id/complete-review"
    description: "Advance an under-review application to REVIEWED"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> REVIEWED"]

  - method: POST
    path: "/petcare/adoption-applications/:application_id/approve"
    description: "Approve a reviewed application"
    roles: [ShelterManager]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> APPROVED; Animal -> ADOPTION_PENDING; FeeInvoice (ADOPTION) created and linked"]

  - method: POST
    path: "/petcare/adoption-applications/:application_id/reject"
    description: "Reject a reviewed application"
    roles: [ShelterManager]
    code: 200
    input: [rejection_reason]
    output: AdoptionApplication
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/petcare/adoption-applications/:application_id/complete"
    description: "Complete an approved adoption after the fee invoice is paid"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> COMPLETED; Animal -> ADOPTED; counters updated"]

  - method: POST
    path: "/petcare/adoption-applications/:application_id/withdraw"
    description: "Withdraw an application before approval"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> WITHDRAWN; cascades to HomeVisit and Animal where applicable"]

  # --- HomeVisits ---
  - method: POST
    path: "/petcare/home-visits"
    description: "Schedule a home visit for an application that is HOME_VISIT_REQUIRED"
    roles: [CaseWorker]
    code: 201
    input: [application_id, scheduled_date]
    output: HomeVisit
    side_effects: ["status=SCHEDULED; case_worker_id set to X-User-ID; application transitions to HOME_VISIT_SCHEDULED"]

  - method: GET
    path: "/petcare/home-visits"
    description: "List home visits with filtering"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["application_id?", "adopter_id?", "status?", "limit?", "offset?"]
    output: "HomeVisit[]"
    side_effects: []

  - method: GET
    path: "/petcare/home-visits/:home_visit_id"
    description: "Get a specific home visit"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: HomeVisit
    side_effects: []

  - method: POST
    path: "/petcare/home-visits/:home_visit_id/complete"
    description: "Complete a home visit with assessment results"
    roles: [CaseWorker]
    code: 200
    input: [yard_adequate, space_adequate, safety_hazards_found, existing_pets_compatible, notes]
    output: HomeVisit
    side_effects: ["status -> COMPLETED; overall_score and result computed; application transitions to REVIEWED or REJECTED"]

  - method: POST
    path: "/petcare/home-visits/:home_visit_id/cancel"
    description: "Cancel a scheduled home visit"
    roles: [CaseWorker]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["status -> CANCELLED; application reverts to HOME_VISIT_REQUIRED"]

  # --- BoardingReservations ---
  - method: POST
    path: "/petcare/boarding-reservations"
    description: "Request a boarding reservation"
    roles: [CaseWorker]
    code: 201
    input: [shelter_id, animal_id, owner_name, owner_contact, check_in_date, check_out_date, "special_instructions?"]
    output: BoardingReservation
    side_effects: ["status=REQUESTED; planned_duration_days computed"]

  - method: GET
    path: "/petcare/boarding-reservations"
    description: "List boarding reservations with filtering"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?", "animal_id?", "status?", "limit?", "offset?"]
    output: "BoardingReservation[]"
    side_effects: []

  - method: GET
    path: "/petcare/boarding-reservations/:reservation_id"
    description: "Get a specific reservation"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: []

  - method: POST
    path: "/petcare/boarding-reservations/:reservation_id/confirm"
    description: "Confirm a reservation, creating its match and provisional invoice"
    roles: [ShelterManager]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status -> CONFIRMED; BoardingMatch created; FeeInvoice (BOARDING) created"]

  - method: POST
    path: "/petcare/boarding-reservations/:reservation_id/check-in"
    description: "Check the animal into boarding"
    roles: [CaseWorker]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status -> CHECKED_IN; actual_check_in set; current_boarding_count incremented; Animal -> BOARDING"]

  - method: POST
    path: "/petcare/boarding-reservations/:reservation_id/check-out"
    description: "Check the animal out of boarding and finalize the invoice"
    roles: [CaseWorker]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status -> CHECKED_OUT; actual_check_out set; invoice line items rewritten with final boarding fee; current_boarding_count decremented; Animal -> AVAILABLE"]

  - method: POST
    path: "/petcare/boarding-reservations/:reservation_id/cancel"
    description: "Cancel a requested or confirmed reservation"
    roles: [ShelterManager]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status -> CANCELLED; BoardingMatch voided; ISSUED invoice voided (PAID/PARTIALLY_PAID requires explicit refund)"]

  # --- BoardingMatches ---
  - method: GET
    path: "/petcare/boarding-matches/:boarding_match_id"
    description: "Get a specific boarding match"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: BoardingMatch
    side_effects: []

  # --- FeeInvoices ---
  - method: GET
    path: "/petcare/fee-invoices"
    description: "List fee invoices with filtering"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?", "reference_type?", "status?", "limit?", "offset?"]
    output: "FeeInvoice[]"
    side_effects: []

  - method: GET
    path: "/petcare/fee-invoices/:invoice_id"
    description: "Get a specific fee invoice"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []

  - method: POST
    path: "/petcare/fee-invoices/:invoice_id/pay"
    description: "Record a payment against an invoice"
    roles: [CaseWorker]
    code: 200
    input: [amount_cents]
    output: FeeInvoice
    side_effects: ["paid_amount_cents updated; status -> PARTIALLY_PAID or PAID; revenue_pending_cents updated when fully PAID"]

  - method: POST
    path: "/petcare/fee-invoices/:invoice_id/refund"
    description: "Refund a paid invoice"
    roles: [ShelterManager]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> REFUNDED; revenue_pending_cents decreased"]

  - method: POST
    path: "/petcare/fee-invoices/:invoice_id/void"
    description: "Void an unpaid invoice"
    roles: [ShelterManager]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> VOID"]

  # --- ComplianceHolds ---
  - method: POST
    path: "/petcare/compliance-holds"
    description: "Create a compliance hold for an animal"
    roles: [Veterinarian, ShelterManager]
    code: 201
    input: [animal_id, hold_type, severity, reason]
    output: ComplianceHold
    side_effects: ["status=ACTIVE; imposed_role recorded; animal active_hold_count incremented; if severity HIGH/CRITICAL, animal status may transition to UNAVAILABLE; shelter.compliance_score recomputed"]

  - method: GET
    path: "/petcare/compliance-holds"
    description: "List compliance holds with filtering"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: ["animal_id?", "status?", "severity?", "hold_type?", "limit?", "offset?"]
    output: "ComplianceHold[]"
    side_effects: []

  - method: GET
    path: "/petcare/compliance-holds/:hold_id"
    description: "Get a specific compliance hold"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: []
    output: ComplianceHold
    side_effects: []

  - method: POST
    path: "/petcare/compliance-holds/:hold_id/resolve"
    description: "Resolve an active compliance hold"
    roles: [ShelterManager]
    code: 200
    input: [resolution_notes]
    output: ComplianceHold
    side_effects: ["status -> RESOLVED; resolved_by recorded; animal active_hold_count decremented; animal status may revert UNAVAILABLE -> AVAILABLE; shelter.compliance_score recomputed"]

  # --- FeeSchedules ---
  - method: POST
    path: "/petcare/fee-schedules"
    description: "Create a fee schedule entry"
    roles: [ShelterManager]
    code: 201
    input: [shelter_id, fee_type, species, amount_cents, effective_from, "effective_to?"]
    output: FeeSchedule
    side_effects: ["is_currently_active computed"]

  - method: GET
    path: "/petcare/fee-schedules"
    description: "List fee schedule entries"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?", "fee_type?", "species?", "is_currently_active?", "limit?", "offset?"]
    output: "FeeSchedule[]"
    side_effects: []

  - method: GET
    path: "/petcare/fee-schedules/:fee_schedule_id"
    description: "Get a specific fee schedule entry"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  # --- SettlementBatches ---
  - method: POST
    path: "/petcare/settlement-batches"
    description: "Compose a draft settlement batch for a shelter and period"
    roles: [ShelterManager]
    code: 201
    input: [shelter_id, period_start, period_end]
    output: SettlementBatch
    side_effects: ["status=DRAFT; invoice_ids, gross/refund/net_amount_cents computed by settlement_amount rule"]

  - method: GET
    path: "/petcare/settlement-batches"
    description: "List settlement batches with filtering"
    roles: [ShelterManager]
    code: 200
    input: ["shelter_id?", "status?", "limit?", "offset?"]
    output: "SettlementBatch[]"
    side_effects: []

  - method: GET
    path: "/petcare/settlement-batches/:batch_id"
    description: "Get a specific settlement batch"
    roles: [ShelterManager]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []

  - method: POST
    path: "/petcare/settlement-batches/:batch_id/approve"
    description: "Approve a draft settlement batch for payout"
    roles: [ShelterManager]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["status -> APPROVED; included invoices' settlement_batch_id set; revenue_settled_cents updated"]

  - method: POST
    path: "/petcare/settlement-batches/:batch_id/mark-paid"
    description: "Mark an approved settlement batch as paid"
    roles: [ShelterManager]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["status -> PAID"]

# =============================================================================
# Table 6: Error Code Catalog (33 error codes)
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or invalid X-User-ID or X-User-Role header"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller role is not authorized for this endpoint"

  # --- Request validation ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required fields, wrong types, or values outside their declared ranges"

  - id: ERR_INVALID_DATES
    http: 422
    condition: "A date or date interval violates its temporal precondition"

  # --- Existence ---
  - id: ERR_SHELTER_NOT_FOUND
    http: 404
    condition: "No Shelter with the given ID"

  - id: ERR_ANIMAL_NOT_FOUND
    http: 404
    condition: "No Animal with the given ID"

  - id: ERR_ADOPTER_NOT_FOUND
    http: 404
    condition: "No Adopter with the given ID"

  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No AdoptionApplication with the given ID"

  - id: ERR_HOME_VISIT_NOT_FOUND
    http: 404
    condition: "No HomeVisit with the given ID"

  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "No BoardingReservation with the given ID"

  - id: ERR_BOARDING_MATCH_NOT_FOUND
    http: 404
    condition: "No BoardingMatch with the given ID"

  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "No FeeInvoice with the given ID"

  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "No ComplianceHold with the given ID"

  - id: ERR_FEE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "No FeeSchedule with the given ID"

  - id: ERR_VACCINATION_RECORD_NOT_FOUND
    http: 404
    condition: "No VaccinationRecord with the given ID"

  - id: ERR_SETTLEMENT_BATCH_NOT_FOUND
    http: 404
    condition: "No SettlementBatch with the given ID"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state that permits this transition"

  - id: ERR_SHELTER_SUSPENDED
    http: 409
    condition: "Owning shelter is SUSPENDED; new applications, reservations, or approvals are blocked"

  - id: ERR_ANIMAL_NOT_AVAILABLE
    http: 409
    condition: "Animal is not in AVAILABLE status when adoption application is submitted, started for review, or approved"

  - id: ERR_ADOPTER_BLACKLISTED
    http: 409
    condition: "Adopter is BLACKLISTED and cannot have applications opened or progressed"

  - id: ERR_TOO_EARLY_TO_CHECK_IN
    http: 409
    condition: "Boarding check-in attempted before the planned check_in_date"

  # --- Compliance / safety ---
  - id: ERR_VACCINATION_NOT_COMPLIANT
    http: 409
    condition: "Animal does not satisfy the required vaccine set for this operation"

  - id: ERR_COMPLIANCE_HOLD_ACTIVE
    http: 409
    condition: "Animal has an ACTIVE ComplianceHold of severity HIGH or CRITICAL"

  - id: ERR_CRITICAL_HOLD_PRESENT
    http: 409
    condition: "Shelter cannot reopen because at least one animal still has an ACTIVE CRITICAL hold"

  # --- Workflow / segregation of duties ---
  - id: ERR_SELF_APPROVAL
    http: 409
    condition: "Reviewer and approver of an adoption application must be different users"

  - id: ERR_REVIEWER_MISMATCH
    http: 409
    condition: "Only the assigned reviewer may perform the requested operation on the application"

  - id: ERR_ASSESSOR_MISMATCH
    http: 409
    condition: "Only the assigned case worker may complete the home visit"

  - id: ERR_HOME_VISIT_REQUIRED
    http: 409
    condition: "Application requires a successful home visit before /complete-review"

  - id: ERR_STALE_ANIMAL_DATA
    http: 409
    condition: "Animal.version no longer matches the value pinned at start-review"

  - id: ERR_STALE_ADOPTER_DATA
    http: 409
    condition: "Adopter.version no longer matches the value pinned at start-review"

  # --- Boarding ---
  - id: ERR_BOARDING_DATE_OVERLAP
    http: 409
    condition: "Animal already has a CONFIRMED or CHECKED_IN reservation that overlaps the requested interval"

  - id: ERR_BOARDING_CAPACITY_FULL
    http: 409
    condition: "Shelter has reached boarding_capacity; the reservation cannot be confirmed"

  # --- Fiscal ---
  - id: ERR_FEE_NOT_PAID
    http: 409
    condition: "Adoption cannot be completed because the fee invoice is not yet PAID"

  - id: ERR_PAYMENT_AMOUNT_INVALID
    http: 422
    condition: "Payment amount_cents is not strictly positive or exceeds balance_due_cents"

  - id: ERR_INVOICE_HAS_PAYMENTS
    http: 409
    condition: "Invoice cannot be voided because it already has paid_amount_cents > 0"

  - id: ERR_INVOICE_ALREADY_SETTLED
    http: 409
    condition: "Invoice cannot be refunded because it is already attached to an APPROVED or PAID SettlementBatch"

  - id: ERR_INVOICE_STATUS_CHANGED
    http: 409
    condition: "Settlement batch approval failed because at least one included invoice is no longer PAID"

  # --- Concurrency ---
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "version supplied in the request body does not match the current resource version"

# =============================================================================
# Table 7: RBAC Permission Matrix (segregation of duties)
# =============================================================================
roles:
  - name: ShelterManager
    description: "Senior shelter administrator. Owns shelter lifecycle, fee schedule and settlement, adoption approval/rejection, boarding confirmation/cancellation, refund/void of invoices, resolution of compliance holds, and adopter blacklisting. Cannot also act as reviewer or assessor for the same application."
    exclusive_operations:
      - "POST /petcare/shelters — Create shelter"
      - "POST /petcare/shelters/:id/suspend"
      - "POST /petcare/shelters/:id/reopen"
      - "POST /petcare/adopters/:id/blacklist"
      - "POST /petcare/adoption-applications/:id/approve"
      - "POST /petcare/adoption-applications/:id/reject"
      - "POST /petcare/boarding-reservations/:id/confirm"
      - "POST /petcare/boarding-reservations/:id/cancel"
      - "POST /petcare/fee-invoices/:id/refund"
      - "POST /petcare/fee-invoices/:id/void"
      - "POST /petcare/compliance-holds/:id/resolve"
      - "POST /petcare/fee-schedules"
      - "POST /petcare/settlement-batches"
      - "POST /petcare/settlement-batches/:id/approve"
      - "POST /petcare/settlement-batches/:id/mark-paid"
      - "POST /petcare/home-visits/expire-due (system sweep authority)"
    shared_operations:
      - "POST /petcare/compliance-holds — Create compliance hold (shared with Veterinarian)"
      - "GET /petcare/* — Read-only access to all resources"

  - name: CaseWorker
    description: "Frontline shelter staff. Manages animal intake, adopter records, application progression up to but not including approval/rejection, home visit scheduling and completion, boarding check-in/check-out, and payment recording. May not approve, reject, refund, void, blacklist, suspend, reopen, resolve holds, manage fee schedules, or run settlements. The CaseWorker who reviews an application may not be the one who later approves it (segregation of duties is enforced separately by the same-actor checks)."
    exclusive_operations:
      - "POST /petcare/animals — Register animal"
      - "PATCH /petcare/animals/:id"
      - "POST /petcare/animals/:id/make-available"
      - "POST /petcare/adopters — Register adopter"
      - "PATCH /petcare/adopters/:id"
      - "POST /petcare/adoption-applications — Submit application"
      - "POST /petcare/adoption-applications/:id/start-review"
      - "POST /petcare/adoption-applications/:id/require-home-visit"
      - "POST /petcare/adoption-applications/:id/complete-review"
      - "POST /petcare/adoption-applications/:id/complete"
      - "POST /petcare/adoption-applications/:id/withdraw"
      - "POST /petcare/home-visits — Schedule home visit"
      - "POST /petcare/home-visits/:id/complete"
      - "POST /petcare/home-visits/:id/cancel"
      - "POST /petcare/boarding-reservations — Request reservation"
      - "POST /petcare/boarding-reservations/:id/check-in"
      - "POST /petcare/boarding-reservations/:id/check-out"
      - "POST /petcare/fee-invoices/:id/pay"
    shared_operations:
      - "GET /petcare/* — Read-only access to all resources except SettlementBatch"

  - name: Veterinarian
    description: "Medical staff. Owns vaccination record creation and may impose compliance holds for medical reasons. Cannot manipulate adoption workflow, boarding workflow, or finances."
    exclusive_operations:
      - "POST /petcare/vaccination-records — Add a vaccination record"
    shared_operations:
      - "POST /petcare/compliance-holds — Create compliance hold (shared with ShelterManager)"
      - "GET /petcare/animals, GET /petcare/animals/:id"
      - "GET /petcare/vaccination-records, GET /petcare/vaccination-records/:id"
      - "GET /petcare/compliance-holds, GET /petcare/compliance-holds/:id"
      - "GET /petcare/shelters, GET /petcare/shelters/:id"
