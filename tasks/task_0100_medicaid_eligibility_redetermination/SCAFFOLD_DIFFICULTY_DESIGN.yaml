            - call: "POST /applications/${app_id}/verify"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/decide"
              payload: { target_status: "APPROVED" }
              as: CaseWorker
            - call: "POST /enrollments"
              payload: { household_id: "${hh_id}", application_id: "${app_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", redetermination_due: "2026-11-01T00:00:00Z" }
