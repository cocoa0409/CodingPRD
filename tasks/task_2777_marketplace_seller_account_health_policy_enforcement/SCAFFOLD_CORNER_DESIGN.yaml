      - name: calc_health_score_ratios_cap_and_floor_the_score_at_zero
        claim_type: weighted_scoring
        grounds:
          - "calculations.health_score.constants.RATIO_CAP"
          - "calculations.health_score.formula (max(0.00, ...))"
          - "calculations.metric_tier.formula"
          - "state_machines.Violation.transitions.null_to_UNDER_INVESTIGATION.note (empty-pool fallback)"
        distinguishing_aspect: |
          A catastrophic seller pins all four ratios at RATIO_CAP-or-1.0 and drives the raw penalty
          well past 100: 85.00 + 49.00 + 37.00 + 14.50 = 185.50, so health_score is FLOORED at
          0.00 rather than going negative, and every uncapped ratio (odr overshoots 9x, late 4x,
          cancellation 3x) is clamped to 2.0000 first. breached_metrics must come out in the fixed
          emission order. The rule catalogue deliberately contains no SHIPPING_PERFORMANCE /
          ACCOUNT rule, so the BREACHING tier's auto-violation pool is empty and the documented
          fallback applies: 201 with auto_violation_id null and no posture change.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Empty policy catalogue (no SHIPPING_PERFORMANCE / ACCOUNT rule exists)."
            - "One snapshot [2026-07-01, 2026-08-01): order_volume 1000, delivered_or_refunded_volume 1000, defect_claims_pending 0, defect_claims_substantiated 100, late_shipments 200, pre_fulfillment_cancellations 100, shipments_total 1000, shipments_with_valid_tracking 0."
            - "odr_final 0.1000 -> ratio (0.1000-0.0100)/0.0100 = 9.0 -> capped 2.0000 -> penalty 85.00."
            - "late_shipment_rate 0.2000 -> ratio 4.0 -> capped 2.0000 -> penalty 49.00."
            - "cancellation_rate 0.1000 -> ratio 3.0 -> capped 2.0000 -> penalty 37.00."
            - "valid_tracking_rate 0.0000 -> ratio (0.9500-0.0000)/0.9500 = 1.0 (below the cap) -> penalty 14.50."
            - "penalty_total 185.50 -> health_score max(0.00, -85.50) = 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${s_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 1000, delivered_or_refunded_volume: 1000, defect_claims_pending: 0, defect_claims_substantiated: 100, late_shipments: 200, pre_fulfillment_cancellations: 100, shipments_total: 1000, shipments_with_valid_tracking: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { ev: $.data.id, ev_score: $.data.health_score, ev_tier: $.data.metric_tier }
          assert:
            - "HTTP 201"
            - "HealthEvaluation.${ev}.odr_final == 0.1000 and HealthEvaluation.${ev}.odr_provisional == 0.1000"
            - "HealthEvaluation.${ev}.odr_variant_delta == 0.0000"
            - "HealthEvaluation.${ev}.late_shipment_rate == 0.2000"
            - "HealthEvaluation.${ev}.cancellation_rate == 0.1000"
            - "HealthEvaluation.${ev}.valid_tracking_rate == 0.0000"
            - "HealthEvaluation.${ev}.order_volume_final == 1000"
            - "${ev_score} == 0.00   # floored, never negative"
            - "${ev_tier} == BREACHING"
            - "HealthEvaluation.${ev}.breached_metrics == [ORDER_DEFECT_RATE, LATE_SHIPMENT_RATE, CANCELLATION_RATE, VALID_TRACKING_RATE]   # fixed emission order"
            - "HealthEvaluation.${ev}.auto_violation_id == null   # empty candidate pool: no SHIPPING_PERFORMANCE / ACCOUNT rule exists"
            - "violations list for ${s_id}: total_count == 0"
            - "Seller.${s_id}.health_score == 0.00 and Seller.${s_id}.metric_tier == BREACHING"
            - "Seller.${s_id}.disbursement_state == NORMAL   # no violation was minted, so nothing gates funds"
            - "Seller.${s_id}.enforcement_state == ACTIVE   # a metric tier never moves the enforcement dimension"

      - name: calc_zero_volume_seller_is_exempt_not_healthy
        claim_type: threshold
        grounds:
          - "calculations.metric_tier.formula (order_volume_final == 0 -> EXEMPT)"
          - "calculations.secondary_metric_rates.formula (shipments_total_sum == 0 -> 1.0000)"
          - "calculations.order_defect_rate.formula (order_volume 0 -> 0.0000)"
        distinguishing_aspect: |
          The metric_tier ladder is first-match-wins with EXEMPT at the TOP, so a seller who filed
          a real snapshot with zero volume is EXEMPT, not HEALTHY — even though its score is a
          perfect 100.00 and no metric breached. The zero-denominator guards must also fire in
          opposite directions: the three rate numerators collapse to 0.0000 while
          valid_tracking_rate defaults to 1.0000 (not 0.0000, which would have breached the 0.9500
          floor and dragged the score to 85.50).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "One snapshot [2026-07-01, 2026-08-01) with every counter at 0: order_volume 0, delivered_or_refunded_volume 0, defect_claims_pending 0, defect_claims_substantiated 0, late_shipments 0, pre_fulfillment_cancellations 0, shipments_total 0, shipments_with_valid_tracking 0."
