  # ===========================================================================
  # VALIDATIONS
  # ===========================================================================
  - section: validations
    instances:

      - name: unauthorized_role_outranks_the_malformed_body
        claim_type: priority_ordering
        grounds:
          - validations[priority 2 ERR_UNAUTHORIZED]
          - validations[priority 3 ERR_INVALID_REQUEST]
        distinguishing_aspect: "A RouteDriver posts an outlet with account_code missing: the role gate at priority 2 answers 403 ERR_UNAUTHORIZED and the body is never validated, so the response is not 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database with the clock pinned."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", region_code: "R-WEST" }
              as: RouteDriver
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${eid} == ERR_UNAUTHORIZED"
            - "no Outlet row exists"

      - name: malformed_body_outranks_the_unknown_path_id
        claim_type: priority_ordering
        grounds:
          - validations[priority 3 ERR_INVALID_REQUEST]
          - validations[priority 4 ERR_ROUTE_NOT_FOUND]
        distinguishing_aspect: "A negative sequence_index is submitted to a route id that does not exist: priority 3 wins with 400 ERR_INVALID_REQUEST rather than 404 ERR_ROUTE_NOT_FOUND."
        test_recipe:
          setup:
            - "One outlet and one real route RT-01 (so a genuine route version can be presented in the body), while the route id in the path is a UUID that was never issued."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
          trigger:
            - call: "POST /fountain-network/replenishment-routes/00000000-0000-0000-0000-0000000000ff/stops"
              payload: { outlet_id: "${o}", sequence_index: -1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${eid} == ERR_INVALID_REQUEST"
            - "no RouteStop row exists"

      - name: unknown_path_id_outranks_the_unknown_body_foreign_key
        claim_type: priority_ordering
        grounds:
          - validations[priority 4 ERR_ROUTE_NOT_FOUND]
          - validations[priority 5 ERR_OUTLET_NOT_FOUND]
        distinguishing_aspect: "Both the path route id and the body outlet_id are unknown; path ids are resolved first, so the answer is 404 ERR_ROUTE_NOT_FOUND and never ERR_OUTLET_NOT_FOUND."
        test_recipe:
          setup:
            - "Only one real route RT-01 exists, so a genuine route version can be presented; both the route id in the path and the outlet_id in the body are UUIDs that were never issued."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
          trigger:
            - call: "POST /fountain-network/replenishment-routes/00000000-0000-0000-0000-0000000000ff/stops"
