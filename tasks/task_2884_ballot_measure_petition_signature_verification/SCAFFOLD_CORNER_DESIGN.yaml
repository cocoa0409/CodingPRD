      - name: challenge_lifecycle_and_review_window_rejections
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 7]
          - validations[priority 10]
          - validations[priority 14]
          - validations[priority 15]
          - state_machines.Petition.challenge_status
          - errors[ERR_CHALLENGE_ALREADY_FILED]
          - errors[ERR_CHALLENGE_PENDING]
          - errors[ERR_INVALID_CHALLENGE_STATE]
          - errors[ERR_NOT_CHALLENGE_OWNER]
          - errors[ERR_CHALLENGE_REVIEW_WINDOW_EXPIRED]
        distinguishing_aspect: |
          The challenge dimension runs in parallel with the lifecycle dimension, and this
          walk pins the interaction in both directions: a filed challenge blocks the
          determination (ERR_CHALLENGE_PENDING, priority 15) without moving petition.status,
          and once the court has AFFIRMED, the determination goes through unchanged. Four
          refusals in between separate the guards that all look like "you cannot escalate
