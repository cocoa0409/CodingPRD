              payload: { court_id: "${court_ce1}", docket_number: "CE-1", caption: "CE1", lead_attorney_id: "${att_ce1}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_ce1}"
              captures: { case_ce1: $.data.id }
            - call: "POST /appellate/cases/${case_ce1}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["o@x.com"] }
              as: Attorney
              as_user_id: "${att_ce1}"
              captures: { f_ce1: $.data.id }
