            - { call: "POST /spice/formulas", payload: { product_code: "TOL-1", name: "Tolerance Probe", brand_type: BRANDED, target_flavor_units: 100.0, flavor_tolerance_pct: 2.0, max_moisture_pct: 10.0 }, as: FlavorScientist, captures: { f: $.data.id } }
