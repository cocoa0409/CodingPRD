      - name: c_appeal_resolve_segregation_of_duties
        claim_type: role_shared_allowed
        grounds: ["state_machines.BehaviorIncident", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The appeal resolver must differ from the adjudicator: resolve by adjudicator d1 -> ERR_SEGREGATION_OF_DUTIES; resolve by d2 UPHELD -> RESCINDED, member reinstated, and the incident's points stop counting."
        test_recipe:
          setup: ["member suspended by LEVEL_2 incident (3 points) adjudicated by d1 with suspension starting today; appeal filed"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
