      trigger:
      - call: POST /ssa/payee-cases/${pcx}/decide
        payload:
          outcome: APPROVED
        as: SeniorAdjudicator
        as_user_id: spec-6
        captures:
          err: $.data.error_id
      - call: POST /ssa/payee-cases/${pcx}/decide
        payload:
          outcome: DENIED
        as: SeniorAdjudicator
        as_user_id: sen-4
      assert:
      - 'First decide: 409 ERR_SAME_ADJUDICATOR (creator ''spec-6'' may not decide)'
      - 'Second decide by ''sen-4'': 200, PayeeCase.${pcx}.status == DENIED'
      - BenefitClaim.${cx2}.has_active_payee == false
- section: endpoints
  instances:
  - name: response_envelope_shape_on_success_and_error
    claim_type: response_envelope
    grounds:
    - response_envelope
    - endpoints[POST /ssa/workers]
    distinguishing_aspect: Every response carries meta.api_request_id + meta.api_request_timestamp + response_type; success wraps data as an object,
      error wraps data as {error_id, message}.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /ssa/workers
        payload:
          full_name: Env Check
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          we: $.data.id
      - call: GET /ssa/workers/99999999-8888-4777-8666-555555555555
        payload: {}
        as: ClaimsSpecialist
        captures:
          err: $.data.error_id
      assert:
      - 'Success response: response_type == ''object'', data.id == ${we}, meta.api_request_id present'
      - 'Error response: response_type == ''error'', data.error_id == ERR_WORKER_NOT_FOUND, data.message present'
  - name: noncovered_wage_report_tracked_but_never_indexed
    claim_type: standard_crud
    grounds:
    - entities.EarningsYear.fields.noncovered_earnings_cents
    - calculations.earnings_indexation
    distinguishing_aspect: A covered_employment=false report accumulates into noncovered_earnings_cents but contributes 0 to posted earnings and
      therefore nothing to AIME.
    test_recipe:
