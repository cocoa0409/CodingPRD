      - name: volunteer_withdraw_cascades_signup_and_entry
        claim_type: side_effect_execution
        grounds: [state_machines.Volunteer.ACTIVE_to_WITHDRAWN]
        distinguishing_aspect: "Withdrawal runs the full deactivation cascade: SIGNED_UP signup CANCELLED (seat freed), PENDING entry VOIDED."
