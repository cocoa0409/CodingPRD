          trigger:
            - call: "POST /mep/service-deliveries"
              payload: { plan_id: "${plan_id}", delivered_on: "2026-07-20", hours: 0.00, service_category: "INSTRUCTION" }
              as: ServiceCoordinator
            - call: "POST /mep/service-deliveries"
