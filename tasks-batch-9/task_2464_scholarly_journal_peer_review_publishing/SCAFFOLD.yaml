    path: "/appeals/{id}"
    description: "Read one appeal."
    roles: [SystemAdmin, EditorInChief, HandlingEditor, Author]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/appeals"
    description: "List appeals, filterable by manuscript, appealed decision and adjudicating editor."
    roles: [SystemAdmin, EditorInChief, HandlingEditor, Author]
    code: 200
    input: ["manuscript_id?", "decision_id?", "adjudicated_by_editor_id?", "state?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: GET
    path: "/ethics-cases/{id}"
    description: "Read one ethics case."
    roles: [SystemAdmin, EditorInChief, HandlingEditor]
    code: 200
    input: []
    output: EthicsCase
    side_effects: []

  - method: GET
    path: "/production-jobs/{id}"
    description: "Read one production job with both state dimensions, the booked slot and the indexing status."
    roles: [SystemAdmin, EditorInChief, ProductionStaff, Author]
    code: 200
    input: []
    output: ProductionJob
    side_effects: []

  - method: GET
    path: "/apc-invoices/{id}"
    description: "Read one APC invoice with every computed fee component and its settlement status."
    roles: [SystemAdmin, EditorInChief, ProductionStaff, Author]
    code: 200
    input: []
    output: APCInvoice
    side_effects: []

  - method: GET
    path: "/manuscripts/{manuscript_id}/apc-invoices/{invoice_id}"
    description: "Read one APC invoice in the scope of its manuscript; the fees desk uses the manuscript-scoped route when reconciling one article's billing, so the invoice must belong to the manuscript named in the path."
    roles: [SystemAdmin, EditorInChief, ProductionStaff, Author]
    code: 200
    input: []
    output: APCInvoice
    side_effects:
      - "read-only; an invoice whose manuscript_id differs from the path manuscript is rejected by validation rule 6 with ERR_PARENT_MISMATCH (409) rather than being silently returned"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_ROLE_HEADER_MISSING
    http: 400
    condition: "X-User-Role is absent or is not one of the six declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles."
  - id: ERR_IDENTITY_NOT_FOUND
    http: 403
    condition: "An entity_backed role supplies no X-User-ID, or one that matches no Editor / Reviewer / Author row."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "The acting Author is not the manuscript's corresponding author, the acting Reviewer is not the invitation's reviewer, or the acting Editor is not the assignment's editor."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The editor adjudicating an appeal issued the appealed decision, or the editor resolving an ethics case opened it."
  - id: ERR_EDITOR_LEVEL_MISMATCH
    http: 403
    condition: "The acting Editor's role_level does not match the acting role (a HANDLING editor acting as EditorInChief or vice versa), or the editor belongs to a different journal than the manuscript."

  # --- existence ----------------------------------------------------------
  - id: ERR_JOURNAL_NOT_FOUND
    http: 404
    condition: "journal_id in the path or body matches no Journal."
  - id: ERR_EDITOR_NOT_FOUND
    http: 404
    condition: "editor_id in the path or body matches no Editor."
  - id: ERR_AUTHOR_NOT_FOUND
    http: 404
    condition: "corresponding_author_id or an author path id matches no Author."
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "reviewer_id in the path or body matches no Reviewer."
  - id: ERR_MANUSCRIPT_NOT_FOUND
    http: 404
    condition: "manuscript_id in the path or body matches no Manuscript."
  - id: ERR_EDITOR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "An editor-assignment path id or replaced_assignment_id matches no EditorAssignment."
  - id: ERR_REVIEW_INVITATION_NOT_FOUND
    http: 404
    condition: "A review-invitation path id matches no ReviewInvitation."
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "decision_id matches no Decision."
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "An appeal path id matches no Appeal."
  - id: ERR_ETHICS_CASE_NOT_FOUND
    http: 404
    condition: "An ethics-case path id matches no EthicsCase."
  - id: ERR_PRODUCTION_JOB_NOT_FOUND
    http: 404
    condition: "A production-job path id matches no ProductionJob."
  - id: ERR_APC_INVOICE_NOT_FOUND
    http: 404
    condition: "An apc-invoice path id matches no APCInvoice."

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required field is missing, a field has the wrong JSON type, an enum value is not declared, a monetary or count field is negative, or a percentage falls outside [0, 100]."
  - id: ERR_INVALID_INTERVAL
    http: 400
    condition: "slot_end is earlier than slot_start, or a due_days value is not a positive integer."
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "A declared unique key collides: journal name, (journal_id, editor email), reviewer email, author email, a second ProductionJob for one manuscript, a second screening of one scan_type in one round, or a second unresolved EthicsCase of one case_type."
  - id: ERR_PARENT_MISMATCH
    http: 409
    condition: "The addressed child does not belong to the parent named in the path."
  - id: ERR_CLOCK_REWIND
    http: 409
    condition: "The requested current_utc is earlier than the stored logical clock."

  # --- concurrency --------------------------------------------------------
  - id: ERR_STALE_MANUSCRIPT_VERSION
    http: 412
    condition: "expected_manuscript_version does not equal the manuscript's current version, because another editorial write advanced it after the client last read the manuscript."
  - id: ERR_STALE_PRODUCTION_JOB_VERSION
    http: 412
    condition: "expected_production_job_version does not equal the production job's current version."

  # --- state --------------------------------------------------------------
  - id: ERR_INVALID_MANUSCRIPT_STATE
    http: 409
    condition: "The manuscript's status has no declared transition for the requested trigger."
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "The editor assignment's state has no declared transition for the requested trigger."
  - id: ERR_INVALID_INVITATION_STATE
    http: 409
    condition: "The review invitation's state has no declared transition for the requested trigger."
  - id: ERR_INVALID_APPEAL_STATE
    http: 409
    condition: "The appeal is not in state FILED."
  - id: ERR_INVALID_ETHICS_CASE_STATE
    http: 409
    condition: "The ethics case's state has no declared transition for the requested to_state or resolution."
  - id: ERR_INVALID_PRODUCTION_STAGE
    http: 409
    condition: "The requested content_stage or clearance_stage transition is not declared from the job's current stage pair."
  - id: ERR_INVALID_INVOICE_STATE
    http: 409
    condition: "The invoice is not in status ISSUED."
  - id: ERR_TERMINAL_STATE_LOCKED
    http: 409
    condition: "The subject is in a terminal state (DESK_REJECTED or RETRACTED manuscript, RECUSED or RELEASED assignment, closed invitation, adjudicated appeal, resolved ethics case, settled invoice, TERMINATED job)."

  # --- intake, screening and scope ---------------------------------------
  - id: ERR_SUBJECT_AREA_OUT_OF_SCOPE
    http: 409
    condition: "The manuscript's subject_area is not one of the journal's subject_areas, so it cannot be advanced to review."
  - id: ERR_INTEGRITY_BLOCK
    http: 409
    condition: "The current round's integrity rollup is BLOCK, so the manuscript cannot advance to review."
  - id: ERR_FORMATTING_NON_COMPLIANT
    http: 409
    condition: "formatting_status is NON_COMPLIANT: page_count or figure_count exceeds the journal limit, or a required data availability statement is absent."
  - id: ERR_ETHICS_HOLD
    http: 409
    condition: "An unresolved HIGH-severity EthicsCase freezes decisions, invoice issuance and publication for the manuscript."

  # --- editorial assignment ----------------------------------------------
  - id: ERR_EDITOR_CONFLICT_DECLARED
    http: 409
    condition: "The named editor has already declared a conflict on this manuscript, or the assignment is being activated with declared_conflict = true."
  - id: ERR_EDITOR_WORKLOAD_EXCEEDED
    http: 409
    condition: "The named editor's active_assignment_count already equals max_concurrent_assignments, or the editor does not cover the manuscript's subject_area."
  - id: ERR_NO_ELIGIBLE_EDITOR
    http: 409
    condition: "editor_id was omitted and editor_assignment_selection found no eligible handling editor."
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "The operation requires exactly one ACTIVE EditorAssignment on the manuscript held by the acting editor, and none exists."

  # --- reviewing ----------------------------------------------------------
  - id: ERR_REVIEWER_CONFLICT
    http: 409
    condition: "The candidate reviewer shares an email or affiliation with the corresponding author, appears among the coauthor emails, is the handling editor, or already holds an open invitation on the manuscript."
  - id: ERR_REVIEWER_WINDOW_CAPACITY
    http: 409
    condition: "The reviewer already has journal.reviewer_concurrent_window_limit open invitations whose half-open [invited_at, due_at) windows overlap the new one."
  - id: ERR_NO_ELIGIBLE_REVIEWER
    http: 409
    condition: "reviewer_id was omitted and reviewer_invitation_selection found no eligible reviewer."
  - id: ERR_INVITATION_EXPIRED
    http: 409
    condition: "The reviewer tries to accept an invitation at or after its due_at."
  - id: ERR_INVITATION_NOT_ACCEPTED
    http: 409
    condition: "A review is submitted for an invitation that is not in state ACCEPTED."
  - id: ERR_INSUFFICIENT_REVIEWS
    http: 409
    condition: "Fewer than journal.min_completed_reviews_for_decision reviews have been submitted in the manuscript's current round."

  # --- decisions and appeals ---------------------------------------------
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "A revision decision would open round journal.max_revision_rounds + 1."
  - id: ERR_DATA_AVAILABILITY_REQUIRED
    http: 409
    condition: "An ACCEPT decision is issued while the journal requires a data availability statement and the manuscript has none."
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "The appeal targets a non-rejection decision, is filed more than 30 days after the decision, is not against the manuscript's most recent decision, or duplicates an existing appeal on that decision."

  # --- ethics, licensing and production ----------------------------------
  - id: ERR_RETRACTION_NOT_SUPPORTED
    http: 409
    condition: "A CORRECTION resolution is requested while the manuscript is not PUBLISHED, or a RETRACTION resolution while it is neither PUBLISHED nor CORRECTED."
  - id: ERR_EMBARGO_NOT_APPLICABLE
    http: 409
    condition: "An embargo is requested for a CC_BY, CC_BY_NC or CC_BY_NC_ND licence, which publishes immediately."
  - id: ERR_LICENSE_LOCKED
    http: 409
    condition: "The licence is changed after the manuscript is published, corrected, retracted or desk-rejected."
  - id: ERR_SLOT_NOT_BOOKED
    http: 409
    condition: "The job is advanced to TYPESETTING before a typesetting slot has been booked."
  - id: ERR_TYPESET_SLOT_CONFLICT
    http: 409
    condition: "The requested closed slot interval conflicts with another live job of the same journal once the symmetric typeset_changeover_buffer_days buffer is applied."
  - id: ERR_PROOF_ROUND_LIMIT_REACHED
    http: 409
    condition: "A proof is rejected when proof_round already equals journal.max_proof_rounds."
  - id: ERR_DEPOSIT_NOT_READY
    http: 409
    condition: "An archival deposit is recorded before the job reaches clearance_stage FEE_CLEARED."
  - id: ERR_PRODUCTION_STAGE_NOT_READY
    http: 409
    condition: "Publication is requested before content_stage is PROOF_APPROVED and clearance_stage is DEPOSIT_CONFIRMED."

  # --- fees ---------------------------------------------------------------
  - id: ERR_UNPAID_APC_INVOICE
    http: 409
    condition: "Publication is requested while an APCInvoice for the manuscript is still in status ISSUED."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 409
    condition: "A PAY settlement supplies amount_cents different from total_due_cents, or pays an invoice whose total_due_cents is 0."
  - id: ERR_WAIVER_NOT_ALLOWED
    http: 409
    condition: "A WAIVE settlement omits waiver_reason, or a CANCEL settlement is attempted after the manuscript's ProductionJob has left clearance_stage LICENSE_PENDING."

# =============================================================================
# §1.7 RBAC Matrix
# role_model: segregation_of_duties — the editor who decides cannot adjudicate
# the appeal against that decision, and the editor who opens an ethics case
# cannot resolve it. EditorInChief and HandlingEditor are both backed by the
# Editor entity and are distinguished by Editor.role_level (CHIEF vs HANDLING);
# acting under a role whose role_level does not match the backing Editor row
# raises ERR_EDITOR_LEVEL_MISMATCH.
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Society editorial-office operator: maintains journals, people records and the operational sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /journals"
      - "PATCH /journals/{id}"
      - "POST /editors"
      - "POST /authors"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-reminder-sweep"
    shared_operations:
      - "POST /reviewers (with EditorInChief)"
      - "POST /manuscripts/{id}/integrity-screenings (with HandlingEditor)"
      - "POST /manuscripts/{id}/ethics-cases (with EditorInChief)"
      - "POST /apc-invoices/{id}/settlement (with ProductionStaff)"
      - "every GET except that GET /journals/{id}/metrics is limited to SystemAdmin and EditorInChief"

  - name: EditorInChief
    description: "Chief editor of one journal: assigns handling editors, adjudicates appeals and runs publication-ethics cases."
    identity: "entity_backed:Editor"
    exclusive_operations:
      - "POST /editor-assignments"
      - "POST /appeals/{id}/adjudication"
      - "POST /ethics-cases/{id}/advance"
      - "POST /ethics-cases/{id}/resolution"
    shared_operations:
      - "POST /reviewers (with SystemAdmin)"
      - "POST /manuscripts/{id}/ethics-cases (with SystemAdmin)"
      - "POST /editor-assignments/{id}/recusal (with HandlingEditor)"
      - "GET /journals/{id}/metrics (with SystemAdmin)"
      - "editorial GETs on journals, editors, authors, reviewers, manuscripts, assignments, invitations, reviews, decisions, appeals, ethics cases, production jobs and invoices"

  - name: HandlingEditor
    description: "Subject-area editor who screens the manuscript, manages reviewers and issues the decision."
    identity: "entity_backed:Editor"
    exclusive_operations:
      - "POST /manuscripts/{id}/screening-decision"
      - "POST /editor-assignments/{id}/conflict-declaration"
      - "POST /review-invitations"
      - "POST /review-invitations/{id}/withdraw"
      - "POST /manuscripts/{id}/decisions"
    shared_operations:
      - "POST /manuscripts/{id}/integrity-screenings (with SystemAdmin)"
      - "POST /editor-assignments/{id}/recusal (with EditorInChief)"
      - "editorial GETs on journals, editors, authors, reviewers, manuscripts, assignments, invitations, reviews, decisions, appeals and ethics cases"

  - name: Reviewer
    description: "Peer reviewer from the society reviewer database."
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /review-invitations/{id}/response"
      - "POST /review-invitations/{id}/reviews"
    shared_operations:
      - "GET /journals, GET /journals/{id}, GET /reviewers/{id}, GET /review-invitations, GET /review-invitations/{id}, GET /review-invitations/{id}/reviews"

  - name: Author
    description: "Corresponding author: submits, revises, licences, appeals and approves proofs."
    identity: "entity_backed:Author"
    exclusive_operations:
      - "POST /manuscripts"
      - "POST /manuscripts/{id}/licensing"
      - "POST /manuscripts/{id}/revisions"
      - "POST /appeals"
      - "POST /production-jobs/{id}/proof-approval"
    shared_operations:
      - "GET /journals, GET /journals/{id}, GET /authors/{id}, GET /manuscripts, GET /manuscripts/{id}, GET /manuscripts/{id}/production-jobs, GET /manuscripts/{id}/apc-invoices, GET /decisions, GET /decisions/{id}, GET /appeals, GET /appeals/{id}, GET /production-jobs/{id}, GET /apc-invoices/{id}"

  - name: ProductionStaff
    description: "Production and fees desk: invoices, typesetting slots, proofs, archival deposit and publication."
    identity: "opaque"
    exclusive_operations:
      - "POST /manuscripts/{id}/apc-invoices"
      - "POST /production-jobs/{id}/typeset-slot"
      - "POST /production-jobs/{id}/content-advance"
      - "POST /production-jobs/{id}/archival-deposit"
      - "POST /production-jobs/{id}/publication"
    shared_operations:
      - "POST /apc-invoices/{id}/settlement (with SystemAdmin)"
      - "GET /journals, GET /journals/{id}, GET /authors/{id}, GET /manuscripts, GET /manuscripts/{id}, GET /manuscripts/{id}/production-jobs, GET /manuscripts/{id}/apc-invoices, GET /production-jobs/{id}, GET /apc-invoices/{id}"
