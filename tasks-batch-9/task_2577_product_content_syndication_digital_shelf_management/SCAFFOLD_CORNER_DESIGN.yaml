      - name: shelf_blocked_listing_outranks_the_capacity_rule
        claim_type: priority_conflict
        grounds:
          - validations[priority=34]
          - validations[priority=45]
        excluded_because:
          difficulty_instance: shelf_blocked_priority_34_beats_feed_capacity_priority_45
          rationale: "That difficulty instance constructs a request that violates both rules and asserts ERR_LISTING_SHELF_BLOCKED, which is precisely this ordering claim."

      - name: prohibited_claim_outranks_the_length_ceiling
        claim_type: priority_conflict
        grounds:
          - validations[priority=35]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: prohibited_claim_priority_35_beats_attribute_length_priority_40
          rationale: "A value that is both over the ceiling and carries a prohibited token is asserted to return ERR_PROHIBITED_CLAIM there."

      - name: touching_deployment_windows_do_not_overlap
        claim_type: temporal_validation
        grounds:
          - validations[priority=43]
        excluded_because:
          difficulty_instance: deployment_windows_touch_at_a_shared_endpoint_without_overlapping
          rationale: "The half-open interval semantics, including the accepted touching pair, are asserted there."

      - name: touching_feed_windows_do_conflict
        claim_type: temporal_validation
        grounds:
          - validations[priority=44]
        excluded_because:
          difficulty_instance: feed_windows_touching_at_an_endpoint_do_count_as_a_conflict
          rationale: "The closed-interval semantics of the concurrent-feed-window aggregate, which make a touching window count as an intersection, are asserted there."

      - name: certified_score_exactly_at_the_queue_gate_passes
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=42]
        excluded_because:
          difficulty_instance: certified_completeness_exactly_at_85_passes_the_queue_gate
          rationale: "The inclusive boundary at 85.00 is the entire subject of that boundary-precision instance."

