# =============================================================================
# PRD-bench seed tables — task_0920_employer_onsite_nearsite_clinic
# §1.0–§1.7 live in this file.
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  920. Employer On-Site & Near-Site Clinic: eligible-population & enrollment,
  visit (primary/occ-health/wellness), biometric & health-risk assessment,
  referral & navigation, vendor/staffing & hours, utilization & ROI reporting,
  confidentiality wall, incentive integration

domain_name: employer-onsite-nearsite-clinic

# Flat topology: every resource collection is mounted at the API root, so a
# resource is addressed as /<collection> and /<collection>/{id}. There is no
# nesting of collections inside one another.
api_prefix: "/"

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: parallel

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential      # Referral.redirected_from_referral_id -> Referral.id

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: "beyond Expert — upper edge of §0.4 Expert band, pushed on density"
  targets:
    entities: 14
    endpoints: 70
    state_machines: 10
    non_linear_state_machines: 10
    calculations: 13
    dual_variant_calculations: 7
    error_codes: 35
    validation_rungs: 25
    occ_rules: 3
    conservation_invariants: 3
    max_cascade_depth: 5

# =============================================================================
# GLOBAL CONSTANTS — every named constant used anywhere in this scaffold has a
# concrete value here. Nothing downstream may reference a constant absent from
# this block or from a calculations[].constants block.
# =============================================================================
global_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- scheduling geometry ---
  APPOINTMENT_SLOT_MINUTES: 30
  PROVIDER_BUFFER_MINUTES: 0            # provider intervals are HALF-OPEN, zero buffer
  MAX_RESCHEDULES_PER_APPOINTMENT: 2

  # --- eligibility / enrollment ---
  RETRO_TERMINATION_GRACE_DAYS: 30

  # --- visits ---
  MAX_VISIT_AMENDMENTS: 3

  # --- biometric / HRA banding ---
  BP_ELEVATED_SYSTOLIC_MIN: 120
  BP_ELEVATED_SYSTOLIC_MAX: 129
  BP_STAGE1_SYSTOLIC_MIN: 130
  BP_STAGE1_SYSTOLIC_MAX: 139
  BP_STAGE1_DIASTOLIC_MIN: 80
  BP_STAGE1_DIASTOLIC_MAX: 89
  BP_STAGE2_SYSTOLIC_MIN: 140
  BP_STAGE2_DIASTOLIC_MIN: 90
  BMI_OVERWEIGHT_MIN: 25.0
  BMI_OBESE1_MIN: 30.0
  BMI_OBESE2_MIN: 35.0
  A1C_PREDIABETES_MIN: 5.7
  A1C_DIABETES_MIN: 6.5
  LDL_BORDERLINE_MIN: 100
  LDL_HIGH_MIN: 160
  COTININE_POSITIVE_MIN: 10.0
  SELF_ATTEST_UNVERIFIED_MULTIPLIER: 1.25
  SELF_ATTEST_MISSING_METRIC_POINTS: 1
  TOBACCO_SELF_REPORT_POINTS: 3
  RISK_BAND_LOW_MAX_POINTS: 3
  RISK_BAND_MODERATE_MAX_POINTS: 7
  OUTCOME_STANDARD_MAX_POINTS: 5

  # --- reasonable alternative standard ---
  MAX_RAS_REASSIGNMENTS: 1
  RAS_COMPLETION_WINDOW_DAYS: 90

  # --- incentives ---
  INCENTIVE_CAP_PCT_STANDARD: 0.30
  INCENTIVE_CAP_PCT_TOBACCO: 0.50
  OUTCOME_AWARD_CENTS: 60000
  PARTICIPATORY_AWARD_CENTS: 15000
  TOBACCO_CESSATION_AWARD_CENTS: 45000

  # --- referral / navigation SLA ---
  SLA_EMERGENT_HOURS: 4
  SLA_URGENT_HOURS: 48
  SLA_ROUTINE_BUSINESS_DAYS: 10

  # --- reporting ---
  MIN_CELL_SIZE: 6
  MAX_RESTATEMENTS: 2
  DIVERSION_RATE_PRIMARY_CARE: 0.62
  DIVERSION_RATE_OCC_HEALTH: 0.40
  DIVERSION_RATE_WELLNESS: 0.15
  BENCHMARK_COST_PRIMARY_CARE_CENTS: 18533
  BENCHMARK_COST_OCC_HEALTH_CENTS: 24011
  BENCHMARK_COST_WELLNESS_CENTS: 9007
  ROI_RATIO_DECIMALS: 4

  # --- role sets used by the confidentiality wall ---
  EMPLOYER_SIDE_ROLES: ["EmployerBenefitsAdmin", "PayrollProcessor"]
  CLINIC_SIDE_ROLES: ["Clinician", "CareNavigator", "ClinicManager"]

# =============================================================================
# §1.1 Entity-Relationship Table  (14 entities, flat topology)
# =============================================================================
entities:

  # ---------------------------------------------------------------- Employer
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Sponsoring employer legal name" }
      - { name: employer_code, type: string, source: input, description: "Short unique employer code", constraints: "unique across Employer; 2-16 chars" }
      - { name: annual_total_cost_of_coverage_cents, type: integer, source: input, description: "Annual total cost of coverage per participant, in cents; the base of the incentive cap", constraints: "integer >= 0" }
      - { name: tobacco_program_enabled, type: boolean, source: input, default: false, description: "True when the wellness program includes a tobacco-cessation component, which raises the incentive cap tier" }
      - { name: wellness_budget_cents, type: integer, source: input, description: "Employer-funded wellness budget for incentive awards, in cents", constraints: "integer >= 0" }
      - { name: wellness_budget_committed_cents, type: integer, source: computed, description: "Sum of IncentiveAward.award_amount_cents for this employer whose status is in {PENDING, APPROVED, EXPORTED, PAID}" }
      - { name: wellness_budget_remaining_cents, type: integer, source: computed, description: "wellness_budget_cents - wellness_budget_committed_cents; may be negative only if wellness_budget_cents is lowered after commitment (not reachable through the declared endpoints)" }
      - { name: program_cost_to_date_cents, type: integer, source: computed, default: 0, description: "Running sum of VendorContract.contract_cost_cents booked at each ReportingPeriod finalization for this employer" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE at creation; never changes through the declared endpoints", constraints: "one of ACTIVE" }

  # -------------------------------------------------------------------- Site
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: host_employer_id, type: string, source: input, description: "FK -> Employer.id; the employer whose premises host an ON_SITE clinic. NULL is allowed and is the normal case for NEAR_SITE clinics shared by several employers." }
      - { name: site_name, type: string, source: input, description: "Clinic site display name" }
      - { name: site_type, type: enum, source: input, description: "ON_SITE (single employer premises) or NEAR_SITE (shared, multi-employer)", constraints: "one of ON_SITE, NEAR_SITE" }
      - { name: open_time_utc, type: string, source: input, description: "Daily opening wall time in UTC, HH:MM 24h, e.g. 08:00" }
      - { name: close_time_utc, type: string, source: input, description: "Daily closing wall time in UTC, HH:MM 24h, e.g. 17:00" }
      - { name: operating_weekdays, type: array, source: input, description: "ISO weekday numbers the site operates: 1=Monday .. 7=Sunday, e.g. [1,2,3,4,5]" }
      - { name: closure_dates, type: array, source: input, default: [], description: "Holiday/closure override list of ISO dates YYYY-MM-DD on which the site is closed regardless of operating_weekdays" }
      - { name: daily_slot_capacity, type: integer, source: input, description: "Maximum number of capacity-holding appointments per service date at this site", constraints: "integer >= 1" }
      - { name: slots_held_count, type: integer, source: computed, default: 0, description: "Count of this site's Appointments whose status is BOOKED" }
      - { name: slots_consumed_count, type: integer, source: computed, default: 0, description: "Count of this site's Appointments whose status is CONSUMED" }
      - { name: slots_no_show_count, type: integer, source: computed, default: 0, description: "Count of this site's Appointments whose status is NO_SHOW" }
      - { name: slots_released_count, type: integer, source: computed, default: 0, description: "Count of this site's Appointments whose status is CANCELLED" }
      - { name: slots_requested_total, type: integer, source: computed, default: 0, description: "Count of every Appointment ever created at this site, in any status" }

  # ---------------------------------------------------------- VendorContract
  - name: VendorContract
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; the site this contract staffs and bills for" }
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the employer buying capacity at that site" }
      - { name: vendor_name, type: string, source: input, description: "Clinic operator (vendor) legal name" }
      - { name: fee_model, type: enum, source: input, description: "PER_VISIT bills per completed visit; FTE_HOUR bills per staffed hour", constraints: "one of PER_VISIT, FTE_HOUR" }
      - { name: per_visit_fee_cents, type: integer, source: input, description: "Fee per billable visit, in cents; used only when fee_model is PER_VISIT", constraints: "integer >= 0" }
      - { name: fte_hourly_rate_cents, type: integer, source: input, description: "Fee per staffed hour, in cents; used only when fee_model is FTE_HOUR", constraints: "integer >= 0" }
      - { name: minimum_guarantee_cents, type: integer, source: input, description: "Contractual minimum the employer owes the vendor per reporting period, in cents", constraints: "integer >= 0" }
      - { name: quota_visits_total, type: integer, source: input, description: "Number of appointment slots at this site reserved for this employer for the life of the contract", constraints: "integer >= 0" }
      - { name: quota_visits_consumed, type: integer, source: computed, default: 0, description: "Count of Appointments whose quota_contract_id is this contract and whose status is in {BOOKED, CONSUMED, NO_SHOW}" }
      - { name: quota_visits_released, type: integer, source: computed, default: 0, description: "Count of Appointments whose quota_contract_id is this contract and whose status is CANCELLED" }
      - { name: quota_visits_requested_total, type: integer, source: computed, default: 0, description: "Count of every Appointment ever assigned to this contract, in any status" }
      - { name: quota_visits_remaining, type: integer, source: computed, description: "quota_visits_total - quota_visits_consumed" }
      - { name: billable_visit_count, type: integer, source: computed, default: 0, description: "Visits frozen into this contract at the most recent ReportingPeriod finalization; 0 before any finalization" }
      - { name: staffed_hours, type: number, source: computed, default: 0, description: "Staffed hours frozen into this contract at the most recent ReportingPeriod finalization; 0 before any finalization" }
      - { name: gross_fee_cents, type: integer, source: computed, default: 0, description: "Fee before minimum-guarantee true-up, computed at finalization per calculations.vendor_contract_cost" }
      - { name: true_up_amount_cents, type: integer, source: computed, default: 0, description: "max(0, minimum_guarantee_cents - gross_fee_cents), computed at finalization" }
      - { name: contract_cost_cents, type: integer, source: computed, default: 0, description: "gross_fee_cents + true_up_amount_cents" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE at creation; set to TRUED_UP by the ReportingPeriod finalize cascade", constraints: "one of ACTIVE, TRUED_UP" }

  # ---------------------------------------------------------------- Provider
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; the provider's primary site" }
      - { name: full_name, type: string, source: input, description: "Provider display name" }
      - { name: provider_function, type: enum, source: input, description: "CLINICIAN delivers encounters; NAVIGATOR runs referral and navigation work", constraints: "one of CLINICIAN, NAVIGATOR" }
      - { name: license_expiry_date, type: string, source: input, description: "ISO date YYYY-MM-DD on which the licence expires. The provider is still CREDENTIALED ON this date (closed upper bound) and LAPSES the first time the clock reads a date strictly after it." }
      - { name: credential_status, type: enum, source: system, default: CREDENTIALED, description: "CREDENTIALED / LAPSED / DEACTIVATED per state_machines Provider.credential_status", constraints: "one of CREDENTIALED, LAPSED, DEACTIVATED" }
      - { name: renewal_count, type: integer, source: computed, default: 0, description: "Number of times credential-renewal has moved this provider LAPSED -> CREDENTIALED" }

  # ------------------------------------------------------------ StaffingShift
  - name: StaffingShift
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; the site being staffed" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the provider working the shift" }
      - { name: shift_start, type: datetime, source: input, description: "ISO 8601 UTC start instant of the staffed interval" }
      - { name: shift_end, type: datetime, source: input, description: "ISO 8601 UTC end instant of the staffed interval; must be strictly after shift_start" }
      - { name: staffed_hours, type: number, source: computed, description: "(shift_end - shift_start) expressed in hours, rounded to 2 decimal places, round_half_up" }
      - { name: coverage_role, type: enum, source: input, description: "Coverage class the shift provides", constraints: "one of PRIMARY_CARE, OCC_HEALTH, WELLNESS, NAVIGATION" }

  # -------------------------------------------------------- EligibilityRecord
  - name: EligibilityRecord
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the employer whose eligibility file produced this row" }
      - { name: subscriber_external_id, type: string, source: input, description: "Employer-side subscriber identifier from the eligibility file" }
      - { name: member_external_id, type: string, source: input, description: "Employer-side member identifier; unique within employer_id together with coverage span" }
      - { name: tier, type: enum, source: input, description: "Relationship tier driving service entitlements", constraints: "one of EMPLOYEE, SPOUSE, DEPENDENT, RETIREE" }
      - { name: effective_date, type: string, source: input, description: "ISO date YYYY-MM-DD on which coverage begins; coverage is CLOSED at this bound (covered ON this date)" }
      - { name: termination_date, type: string, source: input, default: null, description: "ISO date YYYY-MM-DD on which coverage ends, or null for open-ended. Coverage is CLOSED at this bound: the member is STILL covered ON the termination date." }
      - { name: retro_terminated, type: boolean, source: computed, default: false, description: "True when a terminate call set a termination_date strictly earlier than the clock date at the time of the call" }
      - { name: coverage_status, type: enum, source: computed, description: "FUTURE if clock date < effective_date; EFFECTIVE if effective_date <= clock date <= termination_date (or termination_date is null); EXPIRED if clock date > termination_date", constraints: "one of FUTURE, EFFECTIVE, EXPIRED" }

  # ------------------------------------------------------------- Participant
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the sponsoring employer" }
      - { name: eligibility_record_id, type: string, source: input, description: "FK -> EligibilityRecord.id; the eligibility row this enrollment rests on" }
      - { name: display_name, type: string, source: input, description: "Participant display name" }
      - { name: tier, type: enum, source: computed, description: "Copied from the backing EligibilityRecord.tier at enrollment", constraints: "one of EMPLOYEE, SPOUSE, DEPENDENT, RETIREE" }
      - { name: enrolled_on, type: string, source: system, description: "ISO date YYYY-MM-DD taken from the logical clock at enrollment" }
      - { name: enrollment_status, type: enum, source: system, default: ACTIVE, description: "Enrollment axis per state_machines Participant.enrollment_status", constraints: "one of ACTIVE, TERMINATED, CLOSED" }
      - { name: authorization_status, type: enum, source: system, default: NOT_REQUESTED, description: "Disclosure-authorization axis per state_machines Participant.authorization_status; advances independently of enrollment_status", constraints: "one of NOT_REQUESTED, GRANTED, REVOKED, WITHDRAWN" }
      - { name: termination_effective_date, type: string, source: system, default: null, description: "ISO date YYYY-MM-DD the termination takes effect; null while ACTIVE" }
      - { name: authorization_revoked_at, type: datetime, source: system, default: null, description: "Clock instant at which the participant last revoked disclosure authorization; null if never revoked" }
      - { name: completed_visit_count, type: integer, source: computed, default: 0, description: "Count of this participant's Visits whose encounter_status is in {COMPLETED, AMENDED, LOCKED}" }
      - { name: incentive_awarded_cents, type: integer, source: computed, default: 0, description: "Sum of IncentiveAward.award_amount_cents for this participant in any status" }

  # ------------------------------------------------------------- Appointment
  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; who the appointment is for" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; where the appointment is held" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; who will deliver the encounter" }
      - { name: quota_contract_id, type: string, source: computed, description: "FK -> VendorContract.id; the ACTIVE contract at site_id whose employer_id equals the participant's employer_id. Pinned at booking so the answer to 'whose quota did this consume' is stored, not re-derived." }
      - { name: visit_type, type: enum, source: input, description: "Track the encounter belongs to", constraints: "one of PRIMARY_CARE, OCC_HEALTH, WELLNESS" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC start instant of the appointment" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start plus APPOINTMENT_SLOT_MINUTES (30) minutes" }
      - { name: service_date, type: string, source: computed, description: "ISO date YYYY-MM-DD of scheduled_start in UTC" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "Per state_machines Appointment.status", constraints: "one of BOOKED, CANCELLED, NO_SHOW, CONSUMED" }
      - { name: reschedule_count, type: integer, source: computed, default: 0, description: "Number of successful reschedules; capped at MAX_RESCHEDULES_PER_APPOINTMENT (2)" }
      - { name: cancellation_reason, type: enum, source: system, default: null, description: "Reason the appointment left BOOKED", constraints: "one of PARTICIPANT_REQUEST, CLINIC_REQUEST, NO_SHOW, ENROLLMENT_TERMINATED" }

  # ------------------------------------------------------------------- Visit
  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id; the appointment that was checked in to create this visit" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; copied from the appointment" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from the appointment" }
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; copied from the appointment" }
      - { name: visit_type, type: enum, source: system, description: "Copied from the appointment", constraints: "one of PRIMARY_CARE, OCC_HEALTH, WELLNESS" }
      - { name: service_date, type: string, source: system, description: "ISO date YYYY-MM-DD copied from the appointment" }
      - { name: encounter_status, type: enum, source: system, default: CHECKED_IN, description: "Clinical axis per state_machines Visit.encounter_status", constraints: "one of CHECKED_IN, IN_PROGRESS, COMPLETED, AMENDED, LOCKED" }
      - { name: disclosure_status, type: enum, source: system, default: WALLED, description: "Confidentiality axis per state_machines Visit.disclosure_status; advances independently of encounter_status", constraints: "one of WALLED, RELEASE_PENDING, FITNESS_RELEASED, PARTICIPATION_RELEASED, NOT_DISCLOSABLE, SUPPRESSED" }
      - { name: fitness_conclusion, type: enum, source: input, default: null, description: "Employer-directed conclusion recorded on OCC_HEALTH visits only", constraints: "one of FIT_FOR_DUTY, FIT_WITH_RESTRICTIONS, NOT_FIT" }
      - { name: chargeable_party, type: enum, source: computed, description: "Who pays, forked by visit_type: PRIMARY_CARE -> HEALTH_PLAN, OCC_HEALTH -> EMPLOYER_DIRECT, WELLNESS -> WELLNESS_BUDGET", constraints: "one of HEALTH_PLAN, EMPLOYER_DIRECT, WELLNESS_BUDGET" }
      - { name: consumes_benefit_entitlement, type: boolean, source: computed, description: "True only for PRIMARY_CARE visits; OCC_HEALTH and WELLNESS visits do not draw down the health-plan benefit" }
      - { name: amendment_count, type: integer, source: computed, default: 0, description: "Number of successful amendments; capped at MAX_VISIT_AMENDMENTS (3)" }
      - { name: clinical_note, type: string, source: input, default: null, description: "Free-text clinical note; never disclosed to employer-side roles under any disclosure_status" }

  # -------------------------------------------------------- HealthAssessment
  - name: HealthAssessment
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the person assessed" }
      - { name: visit_id, type: string, source: input, default: null, description: "FK -> Visit.id; the in-clinic visit that produced the measurements. Required when source_type is CLINIC_MEASURED, must be null when source_type is SELF_ATTESTED." }
      - { name: source_type, type: enum, source: input, description: "CLINIC_MEASURED (verified in-clinic biometrics) or SELF_ATTESTED (participant-entered values)", constraints: "one of CLINIC_MEASURED, SELF_ATTESTED" }
      - { name: measurement_date, type: string, source: input, description: "ISO date YYYY-MM-DD the values were taken; decides which ReportingPeriod the outcome belongs to" }
      - { name: systolic_mmhg, type: integer, source: input, default: null, description: "Systolic blood pressure in mmHg" }
      - { name: diastolic_mmhg, type: integer, source: input, default: null, description: "Diastolic blood pressure in mmHg" }
      - { name: bmi, type: number, source: input, default: null, description: "Body mass index" }
      - { name: a1c_pct, type: number, source: input, default: null, description: "Haemoglobin A1c as a percentage" }
      - { name: ldl_mg_dl, type: integer, source: input, default: null, description: "LDL cholesterol in mg/dL" }
      - { name: cotinine_ng_ml, type: number, source: input, default: null, description: "Serum cotinine in ng/mL; only meaningful for CLINIC_MEASURED" }
      - { name: self_reported_tobacco, type: boolean, source: input, default: null, description: "Participant-declared tobacco use; only meaningful for SELF_ATTESTED" }
      - { name: risk_points_raw, type: integer, source: computed, description: "Unadjusted band-point total across the five metrics" }
      - { name: risk_points_total, type: integer, source: computed, description: "Final band-point total after the source_type variant adjustment" }
      - { name: risk_band, type: enum, source: computed, description: "LOW if risk_points_total <= 3; MODERATE if 4..7 inclusive; HIGH if >= 8", constraints: "one of LOW, MODERATE, HIGH" }
      - { name: outcome_standard_met, type: boolean, source: computed, description: "True when risk_points_total <= OUTCOME_STANDARD_MAX_POINTS (5), inclusive" }
      - { name: outcome_credit_status, type: enum, source: system, description: "MET_DIRECT when outcome_standard_met is true at creation; PENDING_ALTERNATIVE when false; CREDITED_VIA_RAS after a completed reasonable alternative standard", constraints: "one of MET_DIRECT, PENDING_ALTERNATIVE, CREDITED_VIA_RAS" }

  # ---------------------------------------------------------------- Referral
  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; who is being referred" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the completed encounter that generated the referral" }
      - { name: redirected_from_referral_id, type: string, source: system, default: null, description: "FK -> Referral.id; set on the successor referral created by a redirect, null on an originating referral. Self-referential link used to stop double-counting referral chains." }
      - { name: specialty, type: string, source: input, description: "Requested specialty, free text, e.g. ORTHOPEDICS" }
      - { name: steerage_tier, type: enum, source: input, description: "Network steerage tier of the destination", constraints: "one of CENTER_OF_EXCELLENCE, PREFERRED, STANDARD, OUT_OF_NETWORK" }
      - { name: urgency, type: enum, source: input, description: "Navigation urgency tier driving the SLA", constraints: "one of EMERGENT, URGENT, ROUTINE" }
      - { name: sla_due_at, type: datetime, source: computed, description: "Loop-closure deadline computed at creation per calculations.referral_sla_due_at" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Per state_machines Referral.status", constraints: "one of SUBMITTED, AUTHORIZED, DECLINED, REDIRECTED, ESCALATED, CLOSED_LOOP" }
      - { name: raised_by_provider_id, type: string, source: system, description: "FK -> Provider.id; the provider whose X-User-ID raised the referral. Copied unchanged onto a successor referral created by a redirect, so a navigator cannot launder its own referral through a redirect and then authorize it." }
      - { name: authorized_by_provider_id, type: string, source: system, default: null, description: "Provider.id of the navigator who authorized the referral. This is NOT a foreign-key declaration: it is the audit stamp compared against raised_by_provider_id by the segregation-of-duties rung." }
      - { name: escalated_at, type: datetime, source: system, default: null, description: "Clock instant at which the SLA breach escalated this referral" }
      - { name: loop_closed_at, type: datetime, source: system, default: null, description: "Clock instant at which the consult note was recorded" }
      - { name: consult_note_reference, type: string, source: input, default: null, description: "External reference of the returned consult note, recorded at loop closure" }

  # ------------------------------------------------------ AlternativeStandard
  - name: AlternativeStandard
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; who requested the alternative" }
      - { name: health_assessment_id, type: string, source: input, description: "FK -> HealthAssessment.id; the assessment whose outcome standard was not met" }
      - { name: requested_reason, type: string, source: input, description: "Participant-stated reason the outcome standard is unreasonably difficult or medically inadvisable" }
      - { name: alternative_type, type: enum, source: system, default: null, description: "Assigned alternative", constraints: "one of COACHING_PROGRAM, EDUCATION_MODULE, PHYSICIAN_ALTERNATIVE" }
      - { name: assigned_at, type: datetime, source: system, default: null, description: "Clock instant of the most recent assignment" }
      - { name: due_date, type: string, source: system, default: null, description: "ISO date YYYY-MM-DD equal to the assignment date plus RAS_COMPLETION_WINDOW_DAYS (90)" }
      - { name: reassignment_count, type: integer, source: computed, default: 0, description: "Number of assignments after the first; capped at MAX_RAS_REASSIGNMENTS (1)" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Per state_machines AlternativeStandard.status", constraints: "one of REQUESTED, ASSIGNED, COMPLETED, DENIED" }
      - { name: credit_granted, type: boolean, source: computed, default: false, description: "True once completion granted retroactive credit on the backing assessment" }

  # ----------------------------------------------------------- IncentiveAward
  - name: IncentiveAward
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; who earns the award" }
      - { name: employer_id, type: string, source: computed, description: "FK -> Employer.id; copied from the participant at creation" }
      - { name: reporting_period_id, type: string, source: input, description: "FK -> ReportingPeriod.id; the measurement period the award belongs to" }
      - { name: health_assessment_id, type: string, source: input, default: null, description: "FK -> HealthAssessment.id; required for OUTCOME_BASED awards, null otherwise" }
      - { name: award_type, type: enum, source: input, description: "OUTCOME_BASED is health-contingent; PARTICIPATORY and TOBACCO_CESSATION are participation-based", constraints: "one of OUTCOME_BASED, PARTICIPATORY, TOBACCO_CESSATION" }
      - { name: award_amount_cents, type: integer, source: computed, description: "Fixed by award_type per calculations.incentive_award_amount" }
      - { name: retroactive, type: boolean, source: computed, default: false, description: "True when the award was created by the reasonable-alternative-standard completion cascade rather than by a direct call" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Per state_machines IncentiveAward.status", constraints: "one of PENDING, APPROVED, EXPORTED, PAID, REVERSED, FORFEITED" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID that approved the award" }
      - { name: exported_by_user_id, type: string, source: system, default: null, description: "X-User-ID that exported the award to payroll" }
      - { name: payroll_reference, type: string, source: input, default: null, description: "Payroll batch reference recorded at export" }

  # ---------------------------------------------------------- ReportingPeriod
  - name: ReportingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the employer this period reports on" }
      - { name: period_start, type: string, source: input, description: "ISO date YYYY-MM-DD, first day of the period; the period interval is CLOSED at both ends" }
      - { name: period_end, type: string, source: input, description: "ISO date YYYY-MM-DD, last day of the period, inclusive" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Per state_machines ReportingPeriod.status", constraints: "one of OPEN, FINALIZED, RESTATING, CLOSED" }
      - { name: restatement_count, type: integer, source: computed, default: 0, description: "Number of times the period has been reopened for restatement; capped at MAX_RESTATEMENTS (2)" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "Clock instant of the most recent finalization" }
      - { name: incentive_awarded_cents, type: integer, source: computed, default: 0, description: "Sum of IncentiveAward.award_amount_cents for this period in any status" }
      - { name: incentive_pending_cents, type: integer, source: computed, default: 0, description: "Sum over awards whose status is in {PENDING, APPROVED, EXPORTED}" }
      - { name: incentive_paid_cents, type: integer, source: computed, default: 0, description: "Sum over awards whose status is PAID" }
      - { name: incentive_reversed_cents, type: integer, source: computed, default: 0, description: "Sum over awards whose status is REVERSED" }
      - { name: incentive_forfeited_cents, type: integer, source: computed, default: 0, description: "Sum over awards whose status is FORFEITED" }


# =============================================================================
# §1.2 State Machine Table  (10 machines; 10 non-linear)
#
# Two entities carry PARALLEL axes: Participant (enrollment_status x
# authorization_status) and Visit (encounter_status x disclosure_status). Each
# axis is declared as its own machine entry and identified by `state_field`.
# =============================================================================
state_machines:

  # ------------------------------------------------- Participant, axis 1 of 2
  - entity: Participant
    state_field: enrollment_status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /participants/{participant_id}/terminate"
        actor: EmployerBenefitsAdmin
        preconditions:
          - "participant.enrollment_status == ACTIVE"
          - "termination_effective_date is a valid ISO date and is not strictly earlier than clock_date minus RETRO_TERMINATION_GRACE_DAYS (30); a date exactly 30 days before the clock date is accepted (closed bound)"
        side_effects:
          - "Sets Participant.termination_effective_date to the supplied date."
          - "CASCADE HOP 2: every Appointment of this participant whose status == BOOKED transitions to CANCELLED with cancellation_reason = ENROLLMENT_TERMINATED."
          - "CASCADE HOP 3: caused by hop 2, each affected Appointment's Site recomputes slots_held_count and slots_released_count and increments Site.version by 1."
          - "CASCADE HOP 4: caused by hop 3, each affected Appointment's VendorContract (quota_contract_id) recomputes quota_visits_consumed, quota_visits_released and quota_visits_remaining."
          - "CASCADE HOP 2b: every IncentiveAward of this participant whose status == PENDING transitions to FORFEITED."
          - "CASCADE HOP 3b: caused by hop 2b, each affected ReportingPeriod recomputes incentive_pending_cents and incentive_forfeited_cents."
          - "CASCADE HOP 4b: caused by hop 3b, the Employer recomputes wellness_budget_committed_cents and wellness_budget_remaining_cents."
        note: "APPROVED, EXPORTED and PAID awards are NOT forfeited — only PENDING ones."
      - from: TERMINATED
        to: ACTIVE
        trigger: "POST /participants/{participant_id}/reinstate"
        actor: EmployerBenefitsAdmin
        preconditions:
          - "participant.enrollment_status == TERMINATED"
          - "clock_date <= termination_effective_date plus RETRO_TERMINATION_GRACE_DAYS (30); the 30th day itself still permits reinstatement (closed bound)"
          - "the backing EligibilityRecord.coverage_status == EFFECTIVE at the clock date"
        side_effects:
          - "Clears Participant.termination_effective_date to null."
          - "Cancelled appointments are NOT restored — the cancellation cascade is not compensated."
        note: "The ACTIVE -> TERMINATED -> ACTIVE loop may repeat any number of times."
      - from: TERMINATED
        to: CLOSED
        trigger: "system, evaluated on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "participant.enrollment_status == TERMINATED"
          - "the new clock date is strictly after termination_effective_date plus RETRO_TERMINATION_GRACE_DAYS (30)"
        side_effects:
          - "Participant.authorization_status is set to WITHDRAWN on the parallel axis."
          - "Reinstatement is no longer possible."

  # ------------------------------------------------- Participant, axis 2 of 2
  - entity: Participant
    state_field: authorization_status
    shape: cyclic
    initial_state: NOT_REQUESTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: NOT_REQUESTED
        to: GRANTED
        trigger: "POST /participants/{participant_id}/authorization with decision = GRANT"
        actor: Participant
        preconditions:
          - "participant.authorization_status == NOT_REQUESTED"
          - "participant.enrollment_status != CLOSED"
        side_effects:
          - "Enables the WALLED -> RELEASE_PENDING leg on the Visit disclosure axis for future visit completions."
      - from: GRANTED
        to: REVOKED
        trigger: "POST /participants/{participant_id}/authorization with decision = REVOKE"
        actor: Participant
        preconditions:
          - "participant.authorization_status == GRANTED"
        side_effects:
          - "Sets Participant.authorization_revoked_at to the clock instant."
          - "Every Visit of this participant whose disclosure_status is WALLED or RELEASE_PENDING transitions to SUPPRESSED."
          - "NON-FIRING LEG (explicit): Visits already in FITNESS_RELEASED or PARTICIPATION_RELEASED are left untouched. Revocation is prospective only and never retracts an already-released disclosure."
      - from: REVOKED
        to: GRANTED
        trigger: "POST /participants/{participant_id}/authorization with decision = GRANT"
        actor: Participant
        preconditions:
          - "participant.authorization_status == REVOKED"
          - "participant.enrollment_status != CLOSED"
        side_effects:
          - "Clears Participant.authorization_revoked_at to null."
          - "Visits already SUPPRESSED are NOT restored — suppression is permanent for those visits."
      - from: GRANTED
        to: WITHDRAWN
        trigger: "system, cascaded from Participant.enrollment_status TERMINATED -> CLOSED"
        actor: system
        preconditions: ["participant.enrollment_status transitions to CLOSED"]
        side_effects: ["No further authorization decisions are accepted."]
      - from: REVOKED
        to: WITHDRAWN
        trigger: "system, cascaded from Participant.enrollment_status TERMINATED -> CLOSED"
        actor: system
        preconditions: ["participant.enrollment_status transitions to CLOSED"]
        side_effects: ["No further authorization decisions are accepted."]
      - from: NOT_REQUESTED
        to: WITHDRAWN
        trigger: "system, cascaded from Participant.enrollment_status TERMINATED -> CLOSED"
        actor: system
        preconditions: ["participant.enrollment_status transitions to CLOSED"]
        side_effects: ["No further authorization decisions are accepted."]

  # ------------------------------------------------------------- Appointment
  - entity: Appointment
    state_field: status
    shape: branching_with_capped_self_loop
    initial_state: BOOKED
    terminal_states: [CANCELLED, NO_SHOW, CONSUMED]
    transitions:
      - from: BOOKED
        to: BOOKED
        trigger: "POST /appointments/{appointment_id}/reschedule"
        actor: Participant
        preconditions:
          - "appointment.status == BOOKED"
          - "appointment.reschedule_count < MAX_RESCHEDULES_PER_APPOINTMENT (2)"
          - "the new interval passes every scheduling rung (site closure, operating hours, staffing coverage, provider overlap, site capacity) exactly as at booking"
        side_effects:
          - "Sets scheduled_start, recomputes scheduled_end and service_date."
          - "Increments Appointment.reschedule_count by 1."
          - "Increments Site.version by 1 (day-level occupancy changed)."
        note: "Capped self-loop: the third reschedule attempt is rejected with ERR_RESCHEDULE_LIMIT_REACHED."
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /appointments/{appointment_id}/cancel with cancellation_reason in {PARTICIPANT_REQUEST, CLINIC_REQUEST}"
        actor: Participant
        preconditions:
          - "appointment.status == BOOKED"
        side_effects:
          - "Site.slots_held_count decreases by 1 and Site.slots_released_count increases by 1; Site.version increments by 1."
          - "VendorContract.quota_visits_consumed decreases by 1, quota_visits_released increases by 1, quota_visits_remaining recomputed."
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /appointments/{appointment_id}/cancel with cancellation_reason = NO_SHOW"
        actor: Clinician
        preconditions:
          - "appointment.status == BOOKED"
          - "the acting role is Clinician; Participant and CareNavigator may not pass NO_SHOW"
        side_effects:
          - "Site.slots_held_count decreases by 1 and Site.slots_no_show_count increases by 1; Site.version increments by 1."
          - "VendorContract quota counters are NOT changed — a no-show keeps consuming the employer's quota."
      - from: BOOKED
        to: CONSUMED
        trigger: "POST /appointments/{appointment_id}/check-in"
        actor: Clinician
        preconditions:
          - "appointment.status == BOOKED"
          - "participant.enrollment_status == ACTIVE"
          - "the backing EligibilityRecord covers appointment.service_date (closed interval)"
          - "provider.credential_status == CREDENTIALED"
        side_effects:
          - "Creates a Visit with encounter_status = CHECKED_IN and disclosure_status = WALLED, copying participant_id, provider_id, site_id, visit_type and service_date."
          - "Site.slots_held_count decreases by 1 and Site.slots_consumed_count increases by 1; Site.version increments by 1."

  # ------------------------------------------------------- Visit, axis 1 of 2
  - entity: Visit
    state_field: encounter_status
    shape: branching_with_capped_self_loop
    initial_state: CHECKED_IN
    terminal_states: [LOCKED]
    transitions:
      - from: CHECKED_IN
        to: IN_PROGRESS
        trigger: "POST /visits/{visit_id}/start"
        actor: Clinician
        preconditions:
          - "visit.encounter_status == CHECKED_IN"
          - "the acting Clinician's X-User-ID equals visit.provider_id"
        side_effects: ["No cross-entity effects."]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /visits/{visit_id}/complete"
        actor: Clinician
        preconditions:
          - "visit.encounter_status == IN_PROGRESS"
          - "the acting Clinician's X-User-ID equals visit.provider_id"
          - "if visit.visit_type == OCC_HEALTH then fitness_conclusion must be supplied"
        side_effects:
          - "Computes Visit.chargeable_party and Visit.consumes_benefit_entitlement from visit_type."
          - "Recomputes Participant.completed_visit_count."
          - "Advances the parallel disclosure axis: WALLED -> NOT_DISCLOSABLE for PRIMARY_CARE; WALLED -> SUPPRESSED when participant.authorization_status != GRANTED; otherwise WALLED -> RELEASE_PENDING."
      - from: COMPLETED
        to: AMENDED
        trigger: "POST /visits/{visit_id}/amend"
        actor: Clinician
        preconditions:
          - "visit.encounter_status == COMPLETED"
          - "visit.amendment_count < MAX_VISIT_AMENDMENTS (3)"
          - "the ReportingPeriod covering visit.service_date is not FINALIZED and not CLOSED"
          - "expected_visit_version equals visit.version"
        side_effects:
          - "Increments Visit.amendment_count by 1 and Visit.version by 1."
      - from: AMENDED
        to: AMENDED
        trigger: "POST /visits/{visit_id}/amend"
        actor: Clinician
        preconditions:
          - "visit.encounter_status == AMENDED"
          - "visit.amendment_count < MAX_VISIT_AMENDMENTS (3)"
          - "the ReportingPeriod covering visit.service_date is not FINALIZED and not CLOSED"
          - "expected_visit_version equals visit.version"
        side_effects:
          - "Increments Visit.amendment_count by 1 and Visit.version by 1."
        note: "Capped self-loop: the 4th amendment is rejected with ERR_INVALID_STATE."
      - from: COMPLETED
        to: LOCKED
        trigger: "system, cascaded from POST /reporting-periods/{period_id}/finalize"
        actor: system
        preconditions:
          - "visit.service_date falls inside the finalized period [period_start, period_end], both bounds inclusive"
        side_effects:
          - "CASCADE HOP 3: caused by this lock, every ACTIVE VendorContract of the period's employer refreshes billable_visit_count from the locked visits and computes gross_fee_cents, true_up_amount_cents and contract_cost_cents, then moves to TRUED_UP."
      - from: AMENDED
        to: LOCKED
        trigger: "system, cascaded from POST /reporting-periods/{period_id}/finalize"
        actor: system
        preconditions:
          - "visit.service_date falls inside the finalized period [period_start, period_end], both bounds inclusive"
        side_effects:
          - "CASCADE HOP 3: same contract refresh as from COMPLETED."

  # ------------------------------------------------------- Visit, axis 2 of 2
  - entity: Visit
    state_field: disclosure_status
    shape: parallel_with_multiway_terminal_fanout
    initial_state: WALLED
    terminal_states: [FITNESS_RELEASED, PARTICIPATION_RELEASED, NOT_DISCLOSABLE, SUPPRESSED]
    transitions:
      - from: WALLED
        to: RELEASE_PENDING
        trigger: "system, cascaded from POST /visits/{visit_id}/complete"
        actor: system
        preconditions:
          - "visit.visit_type is in {OCC_HEALTH, WELLNESS}"
          - "participant.authorization_status == GRANTED"
        side_effects: ["Makes the visit eligible for POST /visits/{visit_id}/disclosure-release."]
      - from: WALLED
        to: NOT_DISCLOSABLE
        trigger: "system, cascaded from POST /visits/{visit_id}/complete"
        actor: system
        preconditions:
          - "visit.visit_type == PRIMARY_CARE"
        side_effects: ["GET /visits/{visit_id}/employer-disclosure will reject with ERR_DISCLOSURE_NOT_PERMITTED for this visit forever."]
      - from: WALLED
        to: SUPPRESSED
        trigger: "system, cascaded from POST /visits/{visit_id}/complete or from an authorization REVOKE"
        actor: system
        preconditions:
          - "visit.visit_type is in {OCC_HEALTH, WELLNESS}"
          - "participant.authorization_status is NOT_REQUESTED or REVOKED"
        side_effects: ["No disclosure channel is ever opened for this visit."]
      - from: RELEASE_PENDING
        to: SUPPRESSED
        trigger: "system, cascaded from POST /participants/{participant_id}/authorization with decision = REVOKE"
        actor: system
        preconditions: ["participant.authorization_status transitions GRANTED -> REVOKED"]
        side_effects: ["The pending disclosure is cancelled before any employer-visible release."]
      - from: RELEASE_PENDING
        to: FITNESS_RELEASED
        trigger: "POST /visits/{visit_id}/disclosure-release"
        actor: Clinician
        preconditions:
          - "visit.disclosure_status == RELEASE_PENDING"
          - "visit.visit_type == OCC_HEALTH"
          - "visit.fitness_conclusion is not null"
          - "participant.authorization_status == GRANTED"
        side_effects:
          - "Employer-side roles may now read the fitness conclusion via GET /visits/{visit_id}/employer-disclosure; clinical_note is still withheld."
      - from: RELEASE_PENDING
        to: PARTICIPATION_RELEASED
        trigger: "POST /visits/{visit_id}/disclosure-release"
        actor: Clinician
        preconditions:
          - "visit.disclosure_status == RELEASE_PENDING"
          - "visit.visit_type == WELLNESS"
          - "participant.authorization_status == GRANTED"
        side_effects:
          - "Employer-side roles may now read participation only; no result, no conclusion, no clinical_note."

  # -------------------------------------------------------------- Referral
  - entity: Referral
    state_field: status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [CLOSED_LOOP, REDIRECTED]
    transitions:
      - from: SUBMITTED
        to: AUTHORIZED
        trigger: "system, cascaded from POST /referrals at creation"
        actor: system
        preconditions:
          - "referral.steerage_tier is in {CENTER_OF_EXCELLENCE, PREFERRED} — these tiers need no prior authorization"
        side_effects: ["authorized_by_provider_id stays null because no human authorized it."]
      - from: SUBMITTED
        to: AUTHORIZED
        trigger: "POST /referrals/{referral_id}/authorize"
        actor: CareNavigator
        preconditions:
          - "referral.status == SUBMITTED"
          - "referral.steerage_tier is in {STANDARD, OUT_OF_NETWORK}"
          - "the acting CareNavigator's X-User-ID differs from referral.raised_by_provider_id — whoever raised the referral may not also authorize it"
        side_effects: ["Sets authorized_by_provider_id to the acting navigator's Provider.id."]
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /referrals/{referral_id}/decline"
        actor: CareNavigator
        preconditions: ["referral.status == SUBMITTED"]
        side_effects: ["No cross-entity effects."]
      - from: DECLINED
        to: REDIRECTED
        trigger: "POST /referrals/{referral_id}/redirect"
        actor: CareNavigator
        preconditions: ["referral.status == DECLINED"]
        side_effects:
          - "Creates a successor Referral in status SUBMITTED with redirected_from_referral_id set to this referral's id, copying participant_id and visit_id and taking the new steerage_tier, specialty and urgency from the request."
          - "The successor recomputes its own sla_due_at from the clock instant at redirect time."
          - "Counting rule: only referrals whose redirected_from_referral_id is null enter referral counts, so a redirected chain is counted once."
        note: "This is the cycle: DECLINED -> REDIRECTED spawns a new SUBMITTED referral, so the chain can loop."
      - from: SUBMITTED
        to: ESCALATED
        trigger: "system, evaluated on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "the new clock instant is strictly after referral.sla_due_at; at exactly sla_due_at the referral does NOT escalate"
        side_effects: ["Sets escalated_at to the new clock instant."]
      - from: AUTHORIZED
        to: ESCALATED
        trigger: "system, evaluated on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "the new clock instant is strictly after referral.sla_due_at; at exactly sla_due_at the referral does NOT escalate"
        side_effects: ["Sets escalated_at to the new clock instant."]
      - from: AUTHORIZED
        to: CLOSED_LOOP
        trigger: "POST /referrals/{referral_id}/close-loop"
        actor: CareNavigator
        preconditions:
          - "referral.status == AUTHORIZED"
          - "consult_note_reference is supplied"
        side_effects: ["Sets loop_closed_at to the clock instant."]
      - from: ESCALATED
        to: CLOSED_LOOP
        trigger: "POST /referrals/{referral_id}/close-loop"
        actor: CareNavigator
        preconditions:
          - "referral.status == ESCALATED"
          - "consult_note_reference is supplied"
        side_effects: ["Sets loop_closed_at to the clock instant; escalated_at is preserved."]

  # ----------------------------------------------------- AlternativeStandard
  - entity: AlternativeStandard
    state_field: status
    shape: branching_with_capped_self_loop
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DENIED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "POST /alternative-standards/{standard_id}/assign"
        actor: CareNavigator
        preconditions:
          - "alternative_standard.status == REQUESTED"
        side_effects:
          - "Sets alternative_type, assigned_at to the clock instant and due_date to the assignment date plus RAS_COMPLETION_WINDOW_DAYS (90)."
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /alternative-standards/{standard_id}/assign"
        actor: CareNavigator
        preconditions:
          - "alternative_standard.status == ASSIGNED"
          - "alternative_standard.reassignment_count < MAX_RAS_REASSIGNMENTS (1)"
        side_effects:
          - "Replaces alternative_type, resets assigned_at and due_date, and increments reassignment_count by 1."
        note: "Capped self-loop: the second reassignment is rejected with ERR_INVALID_STATE."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /alternative-standards/{standard_id}/deny"
        actor: CareNavigator
        preconditions: ["alternative_standard.status == REQUESTED"]
        side_effects:
          - "The backing HealthAssessment keeps outcome_credit_status = PENDING_ALTERNATIVE; no incentive award is created."
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /alternative-standards/{standard_id}/complete"
        actor: CareNavigator
        preconditions:
          - "alternative_standard.status == ASSIGNED"
          - "the clock date is not strictly after due_date; completion ON due_date is accepted (closed bound)"
          - "the ReportingPeriod of the backing HealthAssessment.measurement_date is not FINALIZED and not CLOSED"
        side_effects:
          - "CASCADE HOP 1: sets credit_granted = true."
          - "CASCADE HOP 2: caused by hop 1, the backing HealthAssessment.outcome_credit_status becomes CREDITED_VIA_RAS while outcome_standard_met keeps its original false value."
          - "CASCADE HOP 3: caused by hop 2, an IncentiveAward of award_type OUTCOME_BASED is created for the participant in the ReportingPeriod that contains HealthAssessment.measurement_date, with retroactive = true, status PENDING and award_amount_cents = OUTCOME_AWARD_CENTS (60000)."
          - "CASCADE HOP 4: caused by hop 3, that ReportingPeriod recomputes incentive_awarded_cents and incentive_pending_cents."
          - "CASCADE HOP 5: caused by hop 4, the Employer recomputes wellness_budget_committed_cents and wellness_budget_remaining_cents."
        note: "This is the depth-5 cascade. The retroactive award lands in the ORIGINAL measurement period, not the period containing the completion date."

  # ---------------------------------------------------------- IncentiveAward
  - entity: IncentiveAward
    state_field: status
    shape: branching_multiway_terminal_fanout
    initial_state: PENDING
    terminal_states: [PAID, REVERSED, FORFEITED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /incentive-awards/{award_id}/approve"
        actor: EmployerBenefitsAdmin
        preconditions:
          - "award.status == PENDING"
          - "the award's ReportingPeriod.status is OPEN or RESTATING"
        side_effects:
          - "Sets approved_by_user_id to the acting X-User-ID."
          - "ReportingPeriod incentive_* buckets are recomputed (the award stays inside incentive_pending_cents)."
      - from: APPROVED
        to: EXPORTED
        trigger: "POST /incentive-awards/{award_id}/export"
        actor: PayrollProcessor
        preconditions:
          - "award.status == APPROVED"
          - "payroll_reference is supplied"
        side_effects:
          - "Sets exported_by_user_id and payroll_reference."
      - from: EXPORTED
        to: PAID
        trigger: "POST /incentive-awards/{award_id}/mark-paid"
        actor: PayrollProcessor
        preconditions: ["award.status == EXPORTED"]
        side_effects:
          - "ReportingPeriod moves the amount from incentive_pending_cents to incentive_paid_cents; incentive_awarded_cents is unchanged."
      - from: APPROVED
        to: REVERSED
        trigger: "POST /incentive-awards/{award_id}/reverse"
        actor: EmployerBenefitsAdmin
        preconditions: ["award.status == APPROVED"]
        side_effects:
          - "ReportingPeriod moves the amount from incentive_pending_cents to incentive_reversed_cents; incentive_awarded_cents is unchanged."
          - "Employer recomputes wellness_budget_committed_cents (a REVERSED award no longer commits budget)."
      - from: PAID
        to: REVERSED
        trigger: "POST /incentive-awards/{award_id}/reverse"
        actor: EmployerBenefitsAdmin
        preconditions: ["award.status == PAID"]
        side_effects:
          - "ReportingPeriod moves the amount from incentive_paid_cents to incentive_reversed_cents; incentive_awarded_cents is unchanged."
          - "Employer recomputes wellness_budget_committed_cents."
      - from: PENDING
        to: FORFEITED
        trigger: "system, cascaded from POST /participants/{participant_id}/terminate"
        actor: system
        preconditions: ["award.status == PENDING"]
        side_effects:
          - "ReportingPeriod moves the amount from incentive_pending_cents to incentive_forfeited_cents; incentive_awarded_cents is unchanged."
          - "Employer recomputes wellness_budget_committed_cents."

  # --------------------------------------------------------- ReportingPeriod
  - entity: ReportingPeriod
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /reporting-periods/{period_id}/finalize"
        actor: ProgramAdmin
        preconditions:
          - "period.status == OPEN"
          - "the clock date is strictly after period_end"
          - "period.restatement_count < MAX_RESTATEMENTS (2)"
        side_effects:
          - "CASCADE HOP 1: sets finalized_at to the clock instant and freezes the period's aggregates."
          - "CASCADE HOP 2: caused by hop 1, every Visit of this employer whose service_date lies inside [period_start, period_end] inclusive and whose encounter_status is COMPLETED or AMENDED moves to LOCKED."
          - "CASCADE HOP 3: caused by hop 2, every ACTIVE VendorContract of this employer sets billable_visit_count and staffed_hours from the frozen data, computes gross_fee_cents, true_up_amount_cents and contract_cost_cents, and moves to TRUED_UP."
          - "CASCADE HOP 4: caused by hop 3, Employer.program_cost_to_date_cents increases by the sum of those contract_cost_cents."
      - from: RESTATING
        to: FINALIZED
        trigger: "POST /reporting-periods/{period_id}/finalize"
        actor: ProgramAdmin
        preconditions:
          - "period.status == RESTATING"
          - "period.restatement_count < MAX_RESTATEMENTS (2)"
        side_effects:
          - "Same four cascade hops as the OPEN -> FINALIZED leg; contracts already TRUED_UP recompute in place and Employer.program_cost_to_date_cents is adjusted by the delta."
      - from: RESTATING
        to: CLOSED
        trigger: "POST /reporting-periods/{period_id}/finalize"
        actor: ProgramAdmin
        preconditions:
          - "period.status == RESTATING"
          - "period.restatement_count == MAX_RESTATEMENTS (2)"
        side_effects:
          - "Same four cascade hops, and the period becomes permanently immutable: no further restatement is possible."
      - from: FINALIZED
        to: RESTATING
        trigger: "POST /reporting-periods/{period_id}/restate"
        actor: ProgramAdmin
        preconditions:
          - "period.status == FINALIZED"
          - "period.restatement_count < MAX_RESTATEMENTS (2)"
        side_effects:
          - "Increments restatement_count by 1."
          - "Every LOCKED Visit whose service_date lies inside the period returns to encounter_status AMENDED so late-arriving corrections can be applied."
        note: "Cycle: FINALIZED -> RESTATING -> FINALIZED, capped at 2 restatements, after which finalization lands in CLOSED."

  # ----------------------------------------------------------------- Provider
  - entity: Provider
    state_field: credential_status
    shape: cyclic
    initial_state: CREDENTIALED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: CREDENTIALED
        to: LAPSED
        trigger: "system, evaluated on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "the new clock date is strictly after provider.license_expiry_date; on the expiry date itself the provider is still CREDENTIALED (closed upper bound)"
        side_effects: ["New bookings and check-ins naming this provider are rejected with ERR_PROVIDER_CREDENTIAL_LAPSED."]
      - from: LAPSED
        to: CREDENTIALED
        trigger: "POST /providers/{provider_id}/credential-renewal"
        actor: ClinicManager
        preconditions:
          - "provider.credential_status == LAPSED"
          - "the supplied license_expiry_date is not strictly earlier than the clock date"
        side_effects:
          - "Replaces license_expiry_date and increments renewal_count by 1."
        note: "Cycle: CREDENTIALED -> LAPSED -> CREDENTIALED may repeat."
      - from: CREDENTIALED
        to: DEACTIVATED
        trigger: "POST /providers/{provider_id}/deactivate"
        actor: ClinicManager
        preconditions: ["provider.credential_status == CREDENTIALED"]
        side_effects: ["The provider can no longer be named on a booking or a renewal."]
      - from: LAPSED
        to: DEACTIVATED
        trigger: "POST /providers/{provider_id}/deactivate"
        actor: ClinicManager
        preconditions: ["provider.credential_status == LAPSED"]
        side_effects: ["The provider can no longer be named on a booking or a renewal."]

# =============================================================================
# §1.2.1 Concurrency Rules  (3 OCC rules, all resolved on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: appointment-book-stale-site
    parent_entity: Site
    write_endpoint: "POST /appointments"
    occ_field: "expected_site_version"
    description: |
      Booking an appointment against a Site whose version has advanced since the
      client last read it is rejected. Every booking, cancellation, reschedule
      and check-in changes the site's day-level slot accounting and advances
      Site.version, so a booking that still carries an earlier version is acting
      on a stale view of remaining capacity.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: incentive-award-create-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /incentive-awards"
    occ_field: "expected_participant_version"
    description: |
      Creating an IncentiveAward for a Participant whose version has advanced
      since the client last read it is rejected. A new award legitimately adds
      to the participant's incentive_awarded_cents and to the program-cap
      consumption, so a create carrying an earlier version has priced the cap
      headroom from a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: visit-amend-stale-visit
    parent_entity: Visit
    write_endpoint: "POST /visits/{visit_id}/amend"
    occ_field: "expected_visit_version"
    description: |
      Amending a Visit whose version has advanced since the client last read it
      is rejected. An amendment legitimately supersedes the prior recorded
      encounter content, so an amendment carrying an earlier version would
      overwrite content the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# CONSERVATION INVARIANTS (3) — quantities that must partition exactly
# =============================================================================
conservation_invariants:
  - name: incentive_money_conservation
    scope: "each ReportingPeriod"
    formula: |
      ReportingPeriod.incentive_awarded_cents
        == ReportingPeriod.incentive_pending_cents
         + ReportingPeriod.incentive_paid_cents
         + ReportingPeriod.incentive_reversed_cents
         + ReportingPeriod.incentive_forfeited_cents
    note: "Every IncentiveAward status maps to exactly one bucket: PENDING/APPROVED/EXPORTED -> pending, PAID -> paid, REVERSED -> reversed, FORFEITED -> forfeited. Approve, export, mark-paid, reverse and forfeit only move cents between buckets; none of them changes incentive_awarded_cents."

  - name: site_slot_conservation
    scope: "each Site"
    formula: |
      Site.slots_requested_total
        == Site.slots_held_count
         + Site.slots_consumed_count
         + Site.slots_no_show_count
         + Site.slots_released_count
    note: "Every Appointment ever created at the site sits in exactly one of the four terminal-or-held buckets. A reschedule moves an appointment in time but keeps it in slots_held_count."

  - name: employer_quota_conservation
    scope: "each VendorContract"
    formula: |
      VendorContract.quota_visits_requested_total
        == VendorContract.quota_visits_consumed
         + VendorContract.quota_visits_released
      AND
      VendorContract.quota_visits_remaining
        == VendorContract.quota_visits_total - VendorContract.quota_visits_consumed
    note: "A cancelled appointment releases the employer's quota; a no-show does not. On a NEAR_SITE clinic shared by several employers each contract conserves its own quota independently."


# =============================================================================
# §1.3 Calculation Rules Table  (13 calculations; 7 dual-variant)
# =============================================================================
calculations:

  # 1 ------------------------------------------------------------------------
  - name: health_risk_score
    trigger: "POST /health-assessments — runs once at creation and writes risk_points_raw, risk_points_total, risk_band, outcome_standard_met and outcome_credit_status"
    algorithm: weighted_scoring
    formula: |
      # Step 1 — band points per metric. Each band is evaluated top-down and the
      # FIRST matching row wins, so the highest applicable band is selected.
      #
      # blood_pressure_points:
      #   3 if systolic >= 140 (inclusive) OR diastolic >= 90 (inclusive)
      #   2 if (130 <= systolic <= 139, both inclusive) OR (80 <= diastolic <= 89, both inclusive)
      #   1 if (120 <= systolic <= 129, both inclusive) AND diastolic < 80 (exclusive)
      #   0 otherwise (systolic < 120 exclusive AND diastolic < 80 exclusive)
      #
      # bmi_points:
      #   3 if bmi >= 35.0 (inclusive)
      #   2 if 30.0 <= bmi < 35.0 (lower inclusive, upper exclusive)
      #   1 if 25.0 <= bmi < 30.0 (lower inclusive, upper exclusive)
      #   0 if bmi < 25.0 (exclusive)
      #
      # a1c_points:
      #   3 if a1c_pct >= 6.5 (inclusive)
      #   1 if 5.7 <= a1c_pct < 6.5 (lower inclusive, upper exclusive)
      #   0 if a1c_pct < 5.7 (exclusive)
      #
      # ldl_points:
      #   2 if ldl_mg_dl >= 160 (inclusive)
      #   1 if 100 <= ldl_mg_dl < 160 (lower inclusive, upper exclusive)
      #   0 if ldl_mg_dl < 100 (exclusive)
      #
      # tobacco_points — FORKS ON source_type:
      #   CLINIC_MEASURED: 3 if cotinine_ng_ml >= 10.0 (inclusive) else 0
      #   SELF_ATTESTED:   TOBACCO_SELF_REPORT_POINTS (3) if self_reported_tobacco is true else 0
      #
      # Step 2 — missing metrics.
      #   CLINIC_MEASURED: systolic_mmhg, diastolic_mmhg, bmi, a1c_pct, ldl_mg_dl
      #     and cotinine_ng_ml are ALL required; a missing one is ERR_VALIDATION.
      #   SELF_ATTESTED: only bmi and self_reported_tobacco are required. Each of
      #     the blood-pressure pair (counted once), a1c_pct and ldl_mg_dl that is
      #     absent contributes SELF_ATTEST_MISSING_METRIC_POINTS (1) instead of 0.
      #
      # Step 3 — totals.
      risk_points_raw = blood_pressure_points + bmi_points + a1c_points
                        + ldl_points + tobacco_points + missing_metric_points
      #
      # Step 4 — source variant.
      #   CLINIC_MEASURED: risk_points_total = risk_points_raw
      #   SELF_ATTESTED:   risk_points_total = round_half_up(
      #                        risk_points_raw * SELF_ATTEST_UNVERIFIED_MULTIPLIER)
      #                    to a whole number
      #
      # Step 5 — band and outcome.
      #   risk_band = LOW      if risk_points_total <= 3 (inclusive)
      #               MODERATE if 4 <= risk_points_total <= 7 (both inclusive)
      #               HIGH     if risk_points_total >= 8 (inclusive)
      #   outcome_standard_met = (risk_points_total <= OUTCOME_STANDARD_MAX_POINTS), inclusive
      #   outcome_credit_status = MET_DIRECT if outcome_standard_met else PENDING_ALTERNATIVE
    input_set: "The single HealthAssessment being created. No other assessment, visit or award participates."
    constants:
      BP_STAGE2_SYSTOLIC_MIN: 140
      BP_STAGE2_DIASTOLIC_MIN: 90
      BP_STAGE1_SYSTOLIC_MIN: 130
      BP_STAGE1_SYSTOLIC_MAX: 139
      BP_STAGE1_DIASTOLIC_MIN: 80
      BP_STAGE1_DIASTOLIC_MAX: 89
      BP_ELEVATED_SYSTOLIC_MIN: 120
      BP_ELEVATED_SYSTOLIC_MAX: 129
      BMI_OVERWEIGHT_MIN: 25.0
      BMI_OBESE1_MIN: 30.0
      BMI_OBESE2_MIN: 35.0
      A1C_PREDIABETES_MIN: 5.7
      A1C_DIABETES_MIN: 6.5
      LDL_BORDERLINE_MIN: 100
      LDL_HIGH_MIN: 160
      COTININE_POSITIVE_MIN: 10.0
      TOBACCO_SELF_REPORT_POINTS: 3
      SELF_ATTEST_UNVERIFIED_MULTIPLIER: 1.25
      SELF_ATTEST_MISSING_METRIC_POINTS: 1
      RISK_BAND_LOW_MAX_POINTS: 3
      RISK_BAND_MODERATE_MAX_POINTS: 7
      OUTCOME_STANDARD_MAX_POINTS: 5
    precision: "Band points are integers. risk_points_total is a whole number; the SELF_ATTESTED multiplication is rounded half-up to a whole number."
    variants:
      - name: verified_clinic_biometrics
        when: "source_type == CLINIC_MEASURED"
        difference: "Tobacco status comes from measured cotinine; every metric is mandatory; the raw point total is used unadjusted."
      - name: self_attested_values
        when: "source_type == SELF_ATTESTED"
        difference: "Tobacco status comes from the self_reported_tobacco flag; absent metrics score 1 point each instead of 0; the raw total is multiplied by 1.25 and rounded half-up. Identical measurements therefore yield a HIGHER risk_points_total and can flip outcome_standard_met from true to false."

  # 2 ------------------------------------------------------------------------
  - name: incentive_award_amount
    trigger: "POST /incentive-awards, and the AlternativeStandard ASSIGNED -> COMPLETED cascade hop 3"
    algorithm: threshold
    formula: |
      award_amount_cents =
          OUTCOME_AWARD_CENTS (60000)             if award_type == OUTCOME_BASED
          PARTICIPATORY_AWARD_CENTS (15000)       if award_type == PARTICIPATORY
          TOBACCO_CESSATION_AWARD_CENTS (45000)   if award_type == TOBACCO_CESSATION
    input_set: "The award_type on the request, plus for OUTCOME_BASED the referenced HealthAssessment.outcome_credit_status."
    constants:
      OUTCOME_AWARD_CENTS: 60000
      PARTICIPATORY_AWARD_CENTS: 15000
      TOBACCO_CESSATION_AWARD_CENTS: 45000
    precision: "Whole cents; no rounding occurs."
    variants:
      - name: health_contingent_outcome
        when: "award_type == OUTCOME_BASED"
        difference: "Requires health_assessment_id. A direct call is only accepted when that assessment's outcome_credit_status == MET_DIRECT; the CREDITED_VIA_RAS path is reserved for the system cascade, and a direct call naming a CREDITED_VIA_RAS assessment is rejected with ERR_INVALID_STATE."
      - name: participation_only
        when: "award_type is PARTICIPATORY or TOBACCO_CESSATION"
        difference: "health_assessment_id must be null; no outcome standard is consulted, so a participant with a HIGH risk_band can still earn it."

  # 3 ------------------------------------------------------------------------
  - name: incentive_program_cap
    trigger: "Evaluated on POST /incentive-awards and on the AlternativeStandard completion cascade before the award is written"
    algorithm: threshold
    formula: |
      cap_pct   = INCENTIVE_CAP_PCT_TOBACCO (0.50) if employer.tobacco_program_enabled is true
                  else INCENTIVE_CAP_PCT_STANDARD (0.30)
      cap_cents = round_half_up(employer.annual_total_cost_of_coverage_cents * cap_pct)
      committed_cents = sum of IncentiveAward.award_amount_cents for the SAME
                        participant and the SAME reporting_period_id whose status
                        is in {PENDING, APPROVED, EXPORTED, PAID}
      # The candidate award is accepted when
      #   committed_cents + candidate_award_amount_cents <= cap_cents   (INCLUSIVE)
      # and rejected with ERR_INCENTIVE_CAP_EXCEEDED when the sum is strictly greater.
    input_set: "IncentiveAwards of one participant within one reporting period whose status is in {PENDING, APPROVED, EXPORTED, PAID}. REVERSED and FORFEITED awards release their cap headroom and are excluded."
    constants:
      INCENTIVE_CAP_PCT_STANDARD: 0.30
      INCENTIVE_CAP_PCT_TOBACCO: 0.50
    precision: "cap_cents is a whole number of cents, round_half_up."
    variants:
      - name: standard_cap
        when: "employer.tobacco_program_enabled is false"
        difference: "Cap is 30 percent of annual_total_cost_of_coverage_cents."
      - name: tobacco_inclusive_cap
        when: "employer.tobacco_program_enabled is true"
        difference: "Cap is 50 percent of the same base, so an award set that breaches the standard cap is accepted unchanged under the tobacco cap."

  # 4 ------------------------------------------------------------------------
  - name: vendor_contract_cost
    trigger: "ReportingPeriod finalize cascade hop 3 — writes billable_visit_count, staffed_hours, gross_fee_cents, true_up_amount_cents, contract_cost_cents and status TRUED_UP on each ACTIVE VendorContract of the employer"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED — the value is otherwise circular, because the
      # true-up depends on the gross fee, the program cost depends on the true-up,
      # and PEPM and ROI depend on the program cost.
      #   (1) freeze the visit set: Visits of this employer's participants at
      #       contract.site_id whose service_date is inside [period_start, period_end]
      #       (both inclusive) and whose encounter_status is LOCKED after hop 2.
      #   (2) compute gross_fee_cents from the fee_model branch.
      #   (3) compute true_up_amount_cents from gross_fee_cents.
      #   (4) contract_cost_cents = gross_fee_cents + true_up_amount_cents.
      #   (5) only then may program_cost_cents, pepm_cents and roi_ratio be computed.
      #
      billable_visit_count = count of the frozen visit set
      staffed_hours = sum over StaffingShift rows of this contract's site_id whose
                      shift_start is inside [period_start T00:00:00Z, period_end T23:59:59Z]
                      (both inclusive) of StaffingShift.staffed_hours, where each
                      shift's hours are rounded to 2 decimals half-up FIRST and the
                      rounded values are then summed
      gross_fee_cents =
          billable_visit_count * per_visit_fee_cents          if fee_model == PER_VISIT
          round_half_up(staffed_hours * fte_hourly_rate_cents) if fee_model == FTE_HOUR
      true_up_amount_cents = max(0, minimum_guarantee_cents - gross_fee_cents)
      contract_cost_cents  = gross_fee_cents + true_up_amount_cents
    input_set: "One VendorContract, the LOCKED visits of the period at its site for its employer's participants, and the StaffingShifts of its site inside the period."
    constants: {}
    precision: "All money is whole cents, round_half_up. Staffed hours are rounded to 2 decimals per shift before summation."
    variants:
      - name: per_visit_fee_model
        when: "fee_model == PER_VISIT"
        difference: "Only the frozen visit count matters; staffing hours are recorded but do not price the contract."
      - name: fte_hour_fee_model
        when: "fee_model == FTE_HOUR"
        difference: "Only staffed hours matter; a period with zero visits still bills the full staffed hours, so the minimum-guarantee true-up fires far less often than under PER_VISIT."

  # 5 ------------------------------------------------------------------------
  - name: engagement_metrics
    trigger: "GET /reporting-periods/{period_id}/utilization-report"
    algorithm: aggregation
    formula: |
      eligible_population_count =
        count of EligibilityRecord rows of the period's employer whose coverage
        span [effective_date, termination_date] (BOTH BOUNDS CLOSED; a null
        termination_date means unbounded) intersects [period_start, period_end]
        on at least one date
      enrolled_population_count =
        count of Participants of the period's employer whose enrolled_on <=
        period_end (inclusive) and whose enrollment_status is in
        {ACTIVE, TERMINATED, CLOSED} — i.e. everybody who was enrolled at any
        point on or before the last day of the period
      utilizing_participant_count =
        count of DISTINCT participant_id over Visits of the period's employer
        whose service_date is inside [period_start, period_end] (both inclusive)
        and whose encounter_status is in {COMPLETED, AMENDED, LOCKED}
      completed_visit_count = count of those same Visits (not distinct)

      engagement_rate_over_eligible =
        0.0 if eligible_population_count == 0
        else round_half_up(utilizing_participant_count / eligible_population_count, 4)
      engagement_rate_over_enrolled =
        0.0 if enrolled_population_count == 0
        else round_half_up(utilizing_participant_count / enrolled_population_count, 4)
      visits_per_utilizer =
        0.0 if utilizing_participant_count == 0
        else round_half_up(completed_visit_count / utilizing_participant_count, 4)
    input_set: "EligibilityRecords, Participants and Visits of one employer, filtered as spelled out above. CANCELLED and NO_SHOW appointments never enter any of the three figures."
    constants: {}
    precision: "Rates are decimals with 4 places, round_half_up. An empty denominator yields exactly 0.0, never null and never an error."
    variants:
      - name: over_eligible_population
        when: "denominator = eligible_population_count"
        difference: "Denominator counts eligibility-file rows intersecting the period, including people who never enrolled — the largest denominator and the smallest rate."
      - name: over_enrolled_population
        when: "denominator = enrolled_population_count"
        difference: "Denominator counts enrolled Participants only, so terminated-but-once-enrolled people count and never-enrolled eligible people do not."
      - name: per_utilizer_intensity
        when: "denominator = utilizing_participant_count"
        difference: "Not a rate at all but visits per person; the numerator switches from distinct participants to raw visit count, so no single formula can produce all three."

  # 6 ------------------------------------------------------------------------
  - name: avoided_cost_and_roi
    trigger: "GET /reporting-periods/{period_id}/utilization-report"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round EACH visit-type category to whole cents
      # half-up FIRST, then sum the rounded category values. Summing the raw
      # products first and rounding once at the end produces a different total
      # and is WRONG.
      for each visit_type in the fixed order [PRIMARY_CARE, OCC_HEALTH, WELLNESS]:
        n = count of Visits of the period's employer with that visit_type whose
            service_date is inside [period_start, period_end] (both inclusive)
            and whose encounter_status is in {COMPLETED, AMENDED, LOCKED}
        category_avoided_cents =
            round_half_up(n * diversion_rate(visit_type) * benchmark_cents(visit_type))
      avoided_cost_cents = sum of the three rounded category_avoided_cents

      program_cost_cents = sum of VendorContract.contract_cost_cents over the
        period's employer's contracts whose status is TRUED_UP; contracts still
        ACTIVE (period not yet finalized) contribute 0
      roi_ratio =
        0.0 if program_cost_cents == 0
        else round_half_up(avoided_cost_cents / program_cost_cents, ROI_RATIO_DECIMALS)
    input_set: "Visits of one employer inside the period in states {COMPLETED, AMENDED, LOCKED}, and that employer's TRUED_UP VendorContracts."
    constants:
      DIVERSION_RATE_PRIMARY_CARE: 0.62
      DIVERSION_RATE_OCC_HEALTH: 0.40
      DIVERSION_RATE_WELLNESS: 0.15
      BENCHMARK_COST_PRIMARY_CARE_CENTS: 18533
      BENCHMARK_COST_OCC_HEALTH_CENTS: 24011
      BENCHMARK_COST_WELLNESS_CENTS: 9007
      ROI_RATIO_DECIMALS: 4
    precision: "Category values are whole cents, round_half_up, computed BEFORE summation. roi_ratio has 4 decimals, round_half_up, and is computed from the already-rounded avoided_cost_cents and program_cost_cents."

  # 7 ------------------------------------------------------------------------
  - name: pepm_cost
    trigger: "GET /reporting-periods/{period_id}/utilization-report, computed after avoided_cost_and_roi"
    algorithm: aggregation
    formula: |
      period_month_count = number of distinct calendar months touched by
        [period_start, period_end], both bounds inclusive
        (e.g. 2026-01-01..2026-03-31 -> 3; 2026-01-15..2026-02-02 -> 2)
      pepm_cents =
        0 if enrolled_population_count == 0 or period_month_count == 0
        else round_half_up(program_cost_cents /
                           (enrolled_population_count * period_month_count))
    input_set: "program_cost_cents from avoided_cost_and_roi and enrolled_population_count from engagement_metrics. Neither is recomputed here."
    constants: {}
    precision: "Whole cents, round_half_up."

  # 8 ------------------------------------------------------------------------
  - name: small_cell_suppression
    trigger: "GET /reporting-periods/{period_id}/utilization-report, applied last, after every figure has been computed"
    algorithm: threshold
    formula: |
      # Suppression protects against re-identification and applies ONLY when the
      # caller's role is in EMPLOYER_SIDE_ROLES. A ProgramAdmin sees every figure
      # unsuppressed.
      for each visit_type cell in the fixed order [PRIMARY_CARE, OCC_HEALTH, WELLNESS]:
        d = distinct participant count contributing to that cell
        if d == 0:
            report the cell with visit_count 0 and distinct_participant_count 0
            and do NOT suppress it (an empty cell reveals nobody)
        else if d < MIN_CELL_SIZE (6):        # strictly fewer than 6
            set the cell's visit_count and distinct_participant_count to null
            and append the visit_type name to suppressed_cell_keys
        else:                                  # d >= 6, inclusive
            report the cell unchanged
      # The utilizing cell is protected on the same rule:
      if utilizing_participant_count > 0 and utilizing_participant_count < 6:
          set utilizing_participant_count and visits_per_utilizer to null and
          append "UTILIZING" to suppressed_cell_keys AFTER the visit-type keys
      # engagement_rate_over_eligible, engagement_rate_over_enrolled,
      # avoided_cost_cents, program_cost_cents, roi_ratio and pepm_cents are
      # never suppressed.
    input_set: "The already-computed report body plus the caller's role."
    constants:
      MIN_CELL_SIZE: 6
    precision: "Suppression replaces a number with null; it never rounds or approximates."

  # 9 ------------------------------------------------------------------------
  - name: referral_sla_due_at
    trigger: "POST /referrals at creation, and again on the successor referral created by POST /referrals/{referral_id}/redirect"
    algorithm: interval_merge
    formula: |
      base_instant = the logical clock instant at creation
      site = the Site referenced by the Visit named in visit_id (Visit.site_id)
      if urgency == EMERGENT:
          sla_due_at = base_instant + SLA_EMERGENT_HOURS (4) calendar hours
      else if urgency == URGENT:
          sla_due_at = base_instant + SLA_URGENT_HOURS (48) calendar hours
      else:  # ROUTINE
          # Count SLA_ROUTINE_BUSINESS_DAYS (10) SITE-OPEN days forward, starting
          # with the day AFTER base_instant's date (the base date itself never
          # counts). A site-open day is a date whose ISO weekday is in
          # site.operating_weekdays AND which is not listed in site.closure_dates.
          due_date  = the 10th such site-open date
          sla_due_at = due_date at site.close_time_utc
    input_set: "One Referral, its Visit's Site calendar, and the logical clock."
    constants:
      SLA_EMERGENT_HOURS: 4
      SLA_URGENT_HOURS: 48
      SLA_ROUTINE_BUSINESS_DAYS: 10
    precision: "sla_due_at is an ISO 8601 UTC instant with three fractional digits. Escalation compares STRICTLY: escalation fires only when the clock is strictly after sla_due_at."
    variants:
      - name: calendar_hour_sla
        when: "urgency is EMERGENT or URGENT"
        difference: "Pure wall-clock arithmetic; site closures and weekends are ignored, so an EMERGENT referral raised on a Friday evening is still due 4 hours later."
      - name: site_business_day_sla
        when: "urgency == ROUTINE"
        difference: "Skips non-operating weekdays and closure_dates, and lands at the site's close_time_utc rather than at the matching clock time of day, so the same base instant produces a completely different deadline."

  # 10 -----------------------------------------------------------------------
  - name: visit_disclosure_payload
    trigger: "GET /visits/{visit_id}/employer-disclosure"
    algorithm: projection
    formula: |
      if visit.disclosure_status == FITNESS_RELEASED:        # OCC_HEALTH only
          return { visit_id, visit_type, service_date,
                   disclosure_status,
                   fitness_conclusion: visit.fitness_conclusion,
                   participation_recorded: true,
                   clinical_detail_included: false }
      if visit.disclosure_status == PARTICIPATION_RELEASED:  # WELLNESS only
          return { visit_id, visit_type, service_date,
                   disclosure_status,
                   fitness_conclusion: null,
                   participation_recorded: true,
                   clinical_detail_included: false }
      otherwise (WALLED, RELEASE_PENDING, NOT_DISCLOSABLE, SUPPRESSED):
          reject with ERR_DISCLOSURE_NOT_PERMITTED
      # visit.clinical_note is never present in this payload under any status.
    input_set: "One Visit and its disclosure_status. The participant's current authorization_status is NOT re-consulted here: a release already made stays readable after a revocation."
    constants: {}
    precision: "Exact field projection; no arithmetic."
    variants:
      - name: occupational_health_fitness_disclosure
        when: "visit_type == OCC_HEALTH and disclosure_status == FITNESS_RELEASED"
        difference: "The employer legitimately receives a fitness-for-duty CONCLUSION because the encounter was employer-directed, while the underlying clinical detail stays walled."
      - name: wellness_participation_disclosure
        when: "visit_type == WELLNESS and disclosure_status == PARTICIPATION_RELEASED"
        difference: "The employer receives participation ONLY — fitness_conclusion is null even when a conclusion value exists on the row — so the same endpoint cannot serve both tracks with one projection."

  # 11 -----------------------------------------------------------------------
  - name: appointment_slot_geometry
    trigger: "POST /appointments and POST /appointments/{appointment_id}/reschedule"
    algorithm: interval_merge
    formula: |
      scheduled_end = scheduled_start + APPOINTMENT_SLOT_MINUTES (30) minutes
      service_date  = the UTC date part of scheduled_start

      # (i) OPERATING WINDOW — closed containment against the site's daily hours:
      #     the appointment is inside hours when
      #       time_of(scheduled_start) >= site.open_time_utc  (inclusive)
      #       AND time_of(scheduled_end) <= site.close_time_utc (inclusive)
      #     and the ISO weekday of service_date is in site.operating_weekdays.
      #
      # (ii) STAFFING COVERAGE — CLOSED containment inside one StaffingShift:
      #     there must exist a StaffingShift with the same site_id and the same
      #     provider_id where
      #       shift_start <= scheduled_start (inclusive)
      #       AND shift_end >= scheduled_end (inclusive)
      #     An appointment ending exactly at shift_end IS covered.
      #
      # (iii) PROVIDER OCCUPATION — HALF-OPEN pairwise overlap:
      #     the candidate interval [scheduled_start, scheduled_end) collides with
      #     an existing Appointment of the same provider_id whose status is in
      #     {BOOKED, CONSUMED, NO_SHOW} when
      #       candidate_start < existing_end AND existing_start < candidate_end
      #     PROVIDER_BUFFER_MINUTES is 0, so two appointments that merely touch
      #     (one ends exactly when the next begins) do NOT collide.
      #
      # (iv) SITE DAY CAPACITY — strict-less-than:
      #     day_count = count of this site's Appointments with the same
      #       service_date whose status is in {BOOKED, CONSUMED, NO_SHOW}
      #       (CANCELLED released its slot and is excluded)
      #     booking is permitted only while day_count < site.daily_slot_capacity,
      #     so the booking that makes the count EQUAL to the capacity succeeds and
      #     the next one is rejected.
    input_set: "The candidate interval, the site calendar, that site+provider's StaffingShifts, and the site's non-cancelled appointments on the same service_date."
    constants:
      APPOINTMENT_SLOT_MINUTES: 30
      PROVIDER_BUFFER_MINUTES: 0
    precision: "All instants are ISO 8601 UTC. Two different interval conventions are deliberately in force at once: staffing containment is CLOSED, provider occupation is HALF-OPEN."

  # 12 -----------------------------------------------------------------------
  - name: eligibility_coverage
    trigger: "POST /participants (enrollment), POST /appointments, POST /appointments/{appointment_id}/check-in, POST /participants/{participant_id}/reinstate, and GET /eligibility-records reads that surface coverage_status"
    algorithm: threshold
    formula: |
      # The coverage span is CLOSED AT BOTH ENDS — deliberately the opposite
      # convention to the half-open appointment intervals in
      # calculations.appointment_slot_geometry.
      covers(record, d) is true when
          record.effective_date <= d                       (inclusive)
          AND (record.termination_date is null OR d <= record.termination_date)  (inclusive)
      # A member is STILL covered ON the termination date.
      coverage_status =
          FUTURE    if clock_date < effective_date
          EFFECTIVE if covers(record, clock_date)
          EXPIRED   if termination_date is not null and clock_date > termination_date
    input_set: "One EligibilityRecord and one date — the clock date for coverage_status, or the appointment's service_date for a booking check."
    constants: {}
    precision: "Date-only comparisons in UTC; no time component participates."

  # 13 -----------------------------------------------------------------------
  - name: quota_contract_selection
    trigger: "POST /appointments and POST /appointments/{appointment_id}/reschedule — pins Appointment.quota_contract_id"
    algorithm: waterfall_allocation
    formula: |
      # SELECTOR POLICY — the request never names a contract, so all four elements
      # are pinned here.
      # (a) eligibility filter: VendorContract rows where
      #        contract.site_id == appointment.site_id
      #        AND contract.employer_id == participant.employer_id
      #        AND contract.status IN {ACTIVE, TRUED_UP}
      #        AND contract.quota_visits_consumed < contract.quota_visits_total
      #            (strictly less; a contract at exactly its quota is not eligible)
      # (b) ranking expression: ascending quota_visits_remaining, so the tightest
      #     contract is drained first.
      # (c) tie-break: ascending created_at (the earliest-created contract wins).
      #     Entity id is never consulted.
      # (d) empty candidate set: reject the booking with
      #     ERR_EMPLOYER_QUOTA_EXHAUSTED. This single error covers both "this
      #     employer has no contract at this site" and "its quota is used up".
      #
      # On a NEAR_SITE clinic each employer drains only its own contract, so two
      # employers booking at the same site consume different quotas while sharing
      # the one site-level daily_slot_capacity.
    input_set: "VendorContracts at the appointment's site whose employer matches the participant's employer."
    constants: {}
    precision: "Integer counts; no rounding."


# =============================================================================
# §1.4 Validation Rules Table — ONE ORDERED ENGINE, 25 rungs
#
# This is a single global ladder, not a per-handler if-chain. Every request runs
# the rungs in ascending priority and returns the FIRST error it hits, whatever
# handler it is bound for. Two rungs are deliberately placed high so that they
# PRE-EMPT rungs below them:
#   * rung 3  — the confidentiality wall pre-empts existence (4), scope (5),
#               payload (7/8) and every business rung. An employer-side role
#               asking about a NON-EXISTENT clinical record still gets the wall
#               error, never a 404, because the 404 itself would leak whether a
#               clinical record exists.
#   * rung 6  — the reporting-period freeze pre-empts payload (7/8), OCC (9),
#               state (10) and every business rung, so a malformed amendment of
#               a visit inside a FINALIZED period reports the freeze, not the
#               malformed body.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_safety
    check: "CONFIDENTIALITY WALL. A role in EMPLOYER_SIDE_ROLES {EmployerBenefitsAdmin, PayrollProcessor} may not touch individual-level clinical resources. The walled surface is exactly: GET /visits, GET /visits/{visit_id}, GET /health-assessments, GET /health-assessments/{assessment_id}, GET /referrals, GET /referrals/{referral_id}, GET /alternative-standards, GET /alternative-standards/{standard_id}. The check runs BEFORE the path ids are resolved, so a walled read of a non-existent id still returns the wall error."
    error_id: ERR_CONFIDENTIALITY_WALL
    http_status: 403
    applies_to: "GET /visits, GET /visits/{visit_id}, GET /health-assessments, GET /health-assessments/{assessment_id}, GET /referrals, GET /referrals/{referral_id}, GET /alternative-standards, GET /alternative-standards/{standard_id}"

  - priority: 4
    category: existence
    check: "Every id in the path exists, resolved left to right; then every FK id in the body exists"
    error_id: "ERR_EMPLOYER_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_AWARD_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id or an FK in the body"

  - priority: 5
    category: business_referential
    check: "Identity scope for entity-backed roles. Participant may only act where the resource's participant_id equals X-User-ID. EmployerBenefitsAdmin may only act where the resource's employer scope equals X-User-ID. Clinician requires the Provider named by X-User-ID to have provider_function == CLINICIAN and CareNavigator requires provider_function == NAVIGATOR."
    error_id: ERR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints acted on by Participant, EmployerBenefitsAdmin, Clinician or CareNavigator"

  - priority: 6
    category: business_temporal
    check: "REPORTING-PERIOD FREEZE. A write whose target record carries a date inside a ReportingPeriod of that employer whose status is FINALIZED or CLOSED is rejected. Covered writes and their governing date: POST /visits/{visit_id}/amend and POST /visits/{visit_id}/disclosure-release use Visit.service_date; POST /appointments/{appointment_id}/check-in and POST /appointments/{appointment_id}/cancel use Appointment.service_date; POST /health-assessments uses measurement_date; POST /alternative-standards/{standard_id}/complete uses the backing HealthAssessment.measurement_date; POST /incentive-awards uses the named period directly. A period in RESTATING status does NOT freeze."
    error_id: ERR_PERIOD_FINALIZED
    http_status: 409
    applies_to: "POST /visits/{visit_id}/amend, POST /visits/{visit_id}/disclosure-release, POST /appointments/{appointment_id}/check-in, POST /appointments/{appointment_id}/cancel, POST /health-assessments, POST /alternative-standards/{standard_id}/complete, POST /incentive-awards"

  - priority: 7
    category: business_constraint
    check: "Request body is well formed: every required field present, types correct, integers non-negative where declared, ISO dates and instants parseable, and conditionally-required fields honoured (fitness_conclusion on completing an OCC_HEALTH visit; health_assessment_id on an OUTCOME_BASED award and null otherwise; visit_id required for CLINIC_MEASURED assessments and null for SELF_ATTESTED)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 8
    category: business_constraint
    check: "Every enum-typed field carries a declared member of its enum — visit_type, site_type, fee_model, tier, coverage_role, source_type, steerage_tier, urgency, award_type, alternative_type, cancellation_reason, decision, provider_function"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all write endpoints carrying an enum field"

  - priority: 9
    category: state
    check: "Optimistic concurrency: the supplied expected_site_version / expected_participant_version / expected_visit_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appointments, POST /incentive-awards, POST /visits/{visit_id}/amend"

  - priority: 10
    category: state
    check: "The target entity is in a state from which the requested transition is declared in §1.2, including the AlternativeStandard reassignment cap, the visit amendment cap and the reporting-period restatement cap"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 11
    category: state
    check: "appointment.reschedule_count is strictly less than MAX_RESCHEDULES_PER_APPOINTMENT (2)"
    error_id: ERR_RESCHEDULE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /appointments/{appointment_id}/reschedule"

  - priority: 12
    category: business_referential
    check: "The participant is enrolled and covered on the governing date: participant.enrollment_status == ACTIVE, and the backing EligibilityRecord covers the date under the CLOSED-interval rule of calculations.eligibility_coverage. The governing date is the appointment's service_date for bookings and check-ins, the clock date for enrollment and reinstatement, and measurement_date for assessments."
    error_id: ERR_NOT_ELIGIBLE_ON_DATE
    http_status: 422
    applies_to: "POST /participants, POST /participants/{participant_id}/reinstate, POST /appointments, POST /appointments/{appointment_id}/reschedule, POST /appointments/{appointment_id}/check-in, POST /health-assessments"

  - priority: 13
    category: business_safety
    check: "Disclosure authorization is in force: participant.authorization_status == GRANTED at the moment of release"
    error_id: ERR_AUTHORIZATION_REVOKED
    http_status: 403
    applies_to: "POST /visits/{visit_id}/disclosure-release"

  - priority: 14
    category: business_safety
    check: "The requested disclosure is permitted for this visit: the visit's disclosure_status is RELEASE_PENDING for a release, or FITNESS_RELEASED / PARTICIPATION_RELEASED for an employer read"
    error_id: ERR_DISCLOSURE_NOT_PERMITTED
    http_status: 422
    applies_to: "GET /visits/{visit_id}/employer-disclosure, POST /visits/{visit_id}/disclosure-release"

  - priority: 15
    category: business_safety
    check: "The named Provider has credential_status == CREDENTIALED at the moment of the write"
    error_id: ERR_PROVIDER_CREDENTIAL_LAPSED
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{appointment_id}/reschedule, POST /appointments/{appointment_id}/check-in, POST /staffing-shifts"

  - priority: 16
    category: business_temporal
    check: "The appointment's service_date is not listed in site.closure_dates"
    error_id: ERR_SITE_CLOSED
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{appointment_id}/reschedule"

  - priority: 17
    category: business_temporal
    check: "The appointment interval sits inside the site's daily operating window under the CLOSED containment rule of calculations.appointment_slot_geometry, and the service_date's ISO weekday is in site.operating_weekdays"
    error_id: ERR_OUTSIDE_OPERATING_HOURS
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{appointment_id}/reschedule"

  - priority: 18
    category: business_constraint
    check: "A StaffingShift for the same site_id and provider_id CLOSED-contains the appointment interval (shift_start <= scheduled_start and shift_end >= scheduled_end, both inclusive)"
    error_id: ERR_STAFFING_COVERAGE_REQUIRED
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{appointment_id}/reschedule"

  - priority: 19
    category: business_temporal
    check: "No other Appointment of the same provider whose status is in {BOOKED, CONSUMED, NO_SHOW} overlaps the candidate interval under the HALF-OPEN rule; touching intervals do not collide"
    error_id: ERR_PROVIDER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{appointment_id}/reschedule"

  - priority: 20
    category: business_constraint
    check: "The site's non-cancelled appointment count on the service_date is strictly less than site.daily_slot_capacity before the write"
    error_id: ERR_SLOT_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{appointment_id}/reschedule"

  - priority: 21
    category: business_fiscal
    check: "A VendorContract selected by calculations.quota_contract_selection exists with quota_visits_consumed strictly less than quota_visits_total"
    error_id: ERR_EMPLOYER_QUOTA_EXHAUSTED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{appointment_id}/reschedule"

  - priority: 22
    category: business_safety
    check: "SEGREGATION OF DUTIES. The CareNavigator authorizing a referral (X-User-ID) must not equal referral.raised_by_provider_id - the provider who raised the referral may not authorize it. A redirect copies raised_by_provider_id onto the successor, so the constraint survives the redirect cycle."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /referrals/{referral_id}/authorize"

  - priority: 23
    category: business_constraint
    check: "Uniqueness of an eligibility row: no other EligibilityRecord of the same employer_id and member_external_id has a coverage span overlapping the new span under the CLOSED-interval rule"
    error_id: ERR_DUPLICATE_ELIGIBILITY
    http_status: 409
    applies_to: "POST /eligibility-records"

  - priority: 24
    category: business_fiscal
    check: "The participant's committed incentive cents for the period plus the candidate award is less than or equal to the cap from calculations.incentive_program_cap (inclusive)"
    error_id: ERR_INCENTIVE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /incentive-awards, POST /alternative-standards/{standard_id}/complete"

  - priority: 25
    category: business_fiscal
    check: "The employer's wellness_budget_committed_cents plus the candidate award is less than or equal to employer.wellness_budget_cents (inclusive)"
    error_id: ERR_WELLNESS_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /incentive-awards, POST /alternative-standards/{standard_id}/complete"


# =============================================================================
# §1.5 API Endpoint Table — 70 endpoints, flat collections at the API root
# =============================================================================
endpoints:

  # --------------------------------------------------------------- ops/clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time. Advancing the clock also runs three system sweeps in this order: (1) Providers whose license_expiry_date is strictly before the new date move CREDENTIALED -> LAPSED; (2) Referrals in SUBMITTED or AUTHORIZED whose sla_due_at is strictly before the new instant move to ESCALATED; (3) Participants in TERMINATED whose termination_effective_date plus 30 days is strictly before the new date move to CLOSED and their authorization axis to WITHDRAWN."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, lapsed_provider_ids: array, escalated_referral_ids: array, closed_participant_ids: array }"
    side_effects:
      - "Provider CREDENTIALED -> LAPSED sweep"
      - "Referral SLA escalation sweep"
      - "Participant TERMINATED -> CLOSED sweep with the authorization axis cascade"

  # ---------------------------------------------------------------- Employer
  - method: POST
    path: "/employers"
    description: "Registers a sponsoring employer."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, employer_code, annual_total_cost_of_coverage_cents, wellness_budget_cents, "tobacco_program_enabled?"]
    output: Employer
    side_effects: ["Initialises wellness_budget_committed_cents to 0, wellness_budget_remaining_cents to wellness_budget_cents and program_cost_to_date_cents to 0"]

  - method: GET
    path: "/employers/{employer_id}"
    description: "Reads one employer including the committed and remaining wellness budget."
    roles: [ProgramAdmin, EmployerBenefitsAdmin, ClinicManager]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # -------------------------------------------------------------------- Site
  - method: POST
    path: "/sites"
    description: "Creates an on-site or near-site clinic location with its weekly operating calendar and daily slot capacity."
    roles: [ProgramAdmin]
    code: 201
    input: [site_name, site_type, open_time_utc, close_time_utc, operating_weekdays, daily_slot_capacity, "host_employer_id?", "closure_dates?"]
    output: Site
    side_effects: ["Initialises all five slot counters to 0"]

  - method: GET
    path: "/sites"
    description: "Lists sites, optionally filtered by host employer or site type."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: ["host_employer_id?", "site_type?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: GET
    path: "/sites/{site_id}"
    description: "Reads one site with its live slot conservation counters and its current version (the value a booking must echo back as expected_site_version)."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: PATCH
    path: "/sites/{site_id}"
    description: "Updates the operating calendar, closure overrides or daily slot capacity of a site."
    roles: [ProgramAdmin, ClinicManager]
    code: 200
    input: ["open_time_utc?", "close_time_utc?", "operating_weekdays?", "closure_dates?", "daily_slot_capacity?"]
    output: Site
    side_effects: ["increments Site.version by 1"]

  # ---------------------------------------------------------- VendorContract
  - method: POST
    path: "/vendor-contracts"
    description: "Creates the contract under which a vendor staffs a site for one employer, fixing the fee model, the minimum guarantee and the employer's visit quota at that site."
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, employer_id, vendor_name, fee_model, per_visit_fee_cents, fte_hourly_rate_cents, minimum_guarantee_cents, quota_visits_total]
    output: VendorContract
    side_effects: ["Sets status to ACTIVE and all quota counters to 0; quota_visits_remaining equals quota_visits_total"]

  - method: GET
    path: "/vendor-contracts"
    description: "Lists vendor contracts, optionally filtered by site, employer or status."
    roles: [ProgramAdmin, ClinicManager, EmployerBenefitsAdmin]
    code: 200
    input: ["site_id?", "employer_id?", "status?", "limit?", "offset?"]
    output: VendorContract[]
    side_effects: []

  - method: GET
    path: "/vendor-contracts/{contract_id}"
    description: "Reads one vendor contract with its quota conservation counters and, once finalized, its fee breakdown."
    roles: [ProgramAdmin, ClinicManager, EmployerBenefitsAdmin]
    code: 200
    input: []
    output: VendorContract
    side_effects: []

  # ---------------------------------------------------------------- Provider
  - method: POST
    path: "/providers"
    description: "Registers a clinician or navigator at a site."
    roles: [ClinicManager]
    code: 201
    input: [site_id, full_name, provider_function, license_expiry_date]
    output: Provider
    side_effects: ["Sets credential_status to CREDENTIALED and renewal_count to 0"]

  - method: GET
    path: "/providers"
    description: "Lists providers, optionally filtered by site, credential status or function."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator, Participant]
    code: 200
    input: ["site_id?", "credential_status?", "provider_function?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  - method: GET
    path: "/providers/{provider_id}"
    description: "Reads one provider."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator, Participant]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: POST
    path: "/providers/{provider_id}/credential-renewal"
    description: "Renews a lapsed licence, moving the provider LAPSED -> CREDENTIALED."
    roles: [ClinicManager]
    code: 200
    input: [license_expiry_date]
    output: Provider
    side_effects: ["Replaces license_expiry_date and increments renewal_count by 1"]

  - method: POST
    path: "/providers/{provider_id}/deactivate"
    description: "Permanently deactivates a provider."
    roles: [ClinicManager]
    code: 200
    input: []
    output: Provider
    side_effects: ["Sets credential_status to DEACTIVATED, a terminal state"]

  # ----------------------------------------------------------- StaffingShift
  - method: POST
    path: "/staffing-shifts"
    description: "Publishes a staffed interval for one provider at one site. Appointments must be CLOSED-contained inside a shift of the same site and provider."
    roles: [ClinicManager]
    code: 201
    input: [site_id, provider_id, shift_start, shift_end, coverage_role]
    output: StaffingShift
    side_effects: ["Computes staffed_hours to 2 decimals, round_half_up"]

  - method: GET
    path: "/staffing-shifts"
    description: "Lists staffing shifts, optionally filtered by site or provider."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator]
    code: 200
    input: ["site_id?", "provider_id?", "limit?", "offset?"]
    output: StaffingShift[]
    side_effects: []

  - method: GET
    path: "/staffing-shifts/{shift_id}"
    description: "Reads one staffing shift."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator]
    code: 200
    input: []
    output: StaffingShift
    side_effects: []

  # -------------------------------------------------------- EligibilityRecord
  - method: POST
    path: "/eligibility-records"
    description: "Loads one row of the employer's eligibility file. The coverage span is closed at both ends."
    roles: [EmployerBenefitsAdmin]
    code: 201
    input: [employer_id, subscriber_external_id, member_external_id, tier, effective_date, "termination_date?"]
    output: EligibilityRecord
    side_effects: ["Computes coverage_status against the current clock date"]

  - method: GET
    path: "/eligibility-records"
    description: "Lists eligibility rows, optionally filtered by employer, member id or coverage status."
    roles: [ProgramAdmin, EmployerBenefitsAdmin, ClinicManager]
    code: 200
    input: ["employer_id?", "member_external_id?", "coverage_status?", "limit?", "offset?"]
    output: EligibilityRecord[]
    side_effects: []

  - method: GET
    path: "/eligibility-records/{record_id}"
    description: "Reads one eligibility row with its derived coverage_status."
    roles: [ProgramAdmin, EmployerBenefitsAdmin, ClinicManager]
    code: 200
    input: []
    output: EligibilityRecord
    side_effects: []

  - method: POST
    path: "/eligibility-records/{record_id}/terminate"
    description: "Sets or moves the coverage termination date. A date strictly earlier than the clock date is a retroactive termination and is only accepted inside the 30-day grace window."
    roles: [EmployerBenefitsAdmin]
    code: 200
    input: [termination_date]
    output: EligibilityRecord
    side_effects: ["Sets retro_terminated when the date is strictly before the clock date; recomputes coverage_status"]

  # ------------------------------------------------------------- Participant
  - method: POST
    path: "/participants"
    description: "Enrols a member against an eligibility row. Enrollment is refused when the row does not cover the clock date."
    roles: [EmployerBenefitsAdmin]
    code: 201
    input: [employer_id, eligibility_record_id, display_name]
    output: Participant
    side_effects: ["Copies tier from the eligibility row, sets enrolled_on from the clock, enrollment_status ACTIVE and authorization_status NOT_REQUESTED"]

  - method: GET
    path: "/participants"
    description: "Lists participants, optionally filtered by employer, eligibility row or enrollment status."
    roles: [ProgramAdmin, EmployerBenefitsAdmin, ClinicManager, Clinician, CareNavigator, Participant]
    code: 200
    input: ["employer_id?", "eligibility_record_id?", "enrollment_status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: GET
    path: "/participants/{participant_id}"
    description: "Reads one participant, including the current version a POST /incentive-awards must echo as expected_participant_version."
    roles: [ProgramAdmin, EmployerBenefitsAdmin, ClinicManager, Clinician, CareNavigator, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: POST
    path: "/participants/{participant_id}/terminate"
    description: "Terminates enrollment, cancelling booked appointments and forfeiting pending incentive awards."
    roles: [EmployerBenefitsAdmin]
    code: 200
    input: [termination_effective_date]
    output: Participant
    side_effects:
      - "Cancels BOOKED appointments (cascade hop 2)"
      - "Recomputes site slot counters and increments Site.version (hop 3)"
      - "Recomputes vendor contract quota counters (hop 4)"
      - "Forfeits PENDING incentive awards and recomputes period and employer money (hops 2b-4b)"

  - method: POST
    path: "/participants/{participant_id}/reinstate"
    description: "Reinstates a terminated participant inside the 30-day grace window."
    roles: [EmployerBenefitsAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["Clears termination_effective_date; cancelled appointments are NOT restored"]

  - method: POST
    path: "/participants/{participant_id}/authorization"
    description: "Records the participant's disclosure-authorization decision. decision is GRANT or REVOKE. Revocation is prospective only."
    roles: [Participant]
    code: 200
    input: [decision]
    output: Participant
    side_effects:
      - "GRANT opens the RELEASE_PENDING leg for future visit completions"
      - "REVOKE suppresses WALLED and RELEASE_PENDING visits but never retracts FITNESS_RELEASED or PARTICIPATION_RELEASED visits"

  # ------------------------------------------------------------- Appointment
  - method: POST
    path: "/appointments"
    description: "Books a 30-minute appointment. Guarded by optimistic concurrency on the site's version."
    roles: [Participant, CareNavigator]
    code: 201
    input: [participant_id, site_id, provider_id, visit_type, scheduled_start, expected_site_version]
    output: Appointment
    side_effects:
      - "Computes scheduled_end and service_date"
      - "Pins quota_contract_id via calculations.quota_contract_selection"
      - "Increments Site.slots_held_count and Site.slots_requested_total"
      - "increments Site.version by 1"
      - "Increments VendorContract.quota_visits_consumed and quota_visits_requested_total and recomputes quota_visits_remaining"

  - method: GET
    path: "/appointments"
    description: "Lists appointments, optionally filtered by participant, site, provider, consuming contract, status or service date."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator, Participant]
    code: 200
    input: ["participant_id?", "site_id?", "provider_id?", "quota_contract_id?", "status?", "service_date?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: GET
    path: "/appointments/{appointment_id}"
    description: "Reads one appointment including which vendor contract quota it consumed."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator, Participant]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{appointment_id}/reschedule"
    description: "Moves a booked appointment to a new start instant. Capped at 2 reschedules."
    roles: [Participant, CareNavigator]
    code: 200
    input: [scheduled_start]
    output: Appointment
    side_effects: ["Re-runs the full scheduling ladder", "Increments reschedule_count", "increments Site.version by 1"]

  - method: POST
    path: "/appointments/{appointment_id}/cancel"
    description: "Cancels a booked appointment. cancellation_reason NO_SHOW is reserved to the Clinician role and keeps the employer's quota consumed; PARTICIPANT_REQUEST and CLINIC_REQUEST release both the site slot and the quota."
    roles: [Participant, CareNavigator, Clinician]
    code: 200
    input: [cancellation_reason]
    output: Appointment
    side_effects: ["Moves the appointment to CANCELLED or NO_SHOW", "Recomputes site slot counters and increments Site.version by 1", "Recomputes vendor contract quota counters on the CANCELLED path only"]

  - method: POST
    path: "/appointments/{appointment_id}/check-in"
    description: "Checks the participant in and creates the Visit."
    roles: [Clinician]
    code: 201
    input: []
    output: Visit
    side_effects: ["Creates a Visit in CHECKED_IN / WALLED", "Moves the appointment to CONSUMED", "Recomputes site slot counters and increments Site.version by 1"]

  # ------------------------------------------------------------------- Visit
  - method: GET
    path: "/visits"
    description: "Lists visits. WALLED for employer-side roles at ladder rung 3."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: ["participant_id?", "provider_id?", "site_id?", "appointment_id?", "visit_type?", "encounter_status?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []

  - method: GET
    path: "/visits/{visit_id}"
    description: "Reads one visit with both status axes and its version. WALLED for employer-side roles at ladder rung 3, even when the id does not exist."
    roles: [ProgramAdmin, ClinicManager, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/visits/{visit_id}/start"
    description: "Moves the encounter axis CHECKED_IN -> IN_PROGRESS."
    roles: [Clinician]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/visits/{visit_id}/complete"
    description: "Completes the encounter, computes who pays, and advances the parallel disclosure axis to RELEASE_PENDING, NOT_DISCLOSABLE or SUPPRESSED."
    roles: [Clinician]
    code: 200
    input: ["fitness_conclusion?", "clinical_note?"]
    output: Visit
    side_effects: ["Computes chargeable_party and consumes_benefit_entitlement", "Recomputes Participant.completed_visit_count", "Advances disclosure_status"]

  - method: POST
    path: "/visits/{visit_id}/amend"
    description: "Amends a completed visit. Guarded by optimistic concurrency on the visit's own version and blocked by the reporting-period freeze."
    roles: [Clinician]
    code: 200
    input: [expected_visit_version, "clinical_note?", "fitness_conclusion?"]
    output: Visit
    side_effects: ["Increments amendment_count", "increments Visit.version by 1"]

  - method: POST
    path: "/visits/{visit_id}/disclosure-release"
    description: "Releases the employer-visible disclosure for an OCC_HEALTH or WELLNESS visit sitting in RELEASE_PENDING."
    roles: [Clinician]
    code: 200
    input: []
    output: Visit
    side_effects: ["Moves disclosure_status to FITNESS_RELEASED or PARTICIPATION_RELEASED depending on visit_type"]

  - method: GET
    path: "/visits/{visit_id}/employer-disclosure"
    description: "The only employer-visible view of an individual encounter. Returns a fitness conclusion for OCC_HEALTH and participation only for WELLNESS; never the clinical note."
    roles: [EmployerBenefitsAdmin, ProgramAdmin]
    code: 200
    input: []
    output: "{ visit_id: string, visit_type: string, service_date: string, disclosure_status: string, fitness_conclusion: string, participation_recorded: boolean, clinical_detail_included: boolean }"
    side_effects: []

  # -------------------------------------------------------- HealthAssessment
  - method: POST
    path: "/health-assessments"
    description: "Records a biometric screening or a self-attested health-risk assessment and scores it. Participants may only create SELF_ATTESTED rows for themselves."
    roles: [Clinician, Participant]
    code: 201
    input: [participant_id, source_type, measurement_date, "visit_id?", "systolic_mmhg?", "diastolic_mmhg?", "bmi?", "a1c_pct?", "ldl_mg_dl?", "cotinine_ng_ml?", "self_reported_tobacco?"]
    output: HealthAssessment
    side_effects: ["Runs calculations.health_risk_score and writes risk_points_raw, risk_points_total, risk_band, outcome_standard_met and outcome_credit_status"]

  - method: GET
    path: "/health-assessments"
    description: "Lists assessments. WALLED for employer-side roles at ladder rung 3."
    roles: [ProgramAdmin, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: ["participant_id?", "visit_id?", "source_type?", "limit?", "offset?"]
    output: HealthAssessment[]
    side_effects: []

  - method: GET
    path: "/health-assessments/{assessment_id}"
    description: "Reads one assessment. WALLED for employer-side roles at ladder rung 3."
    roles: [ProgramAdmin, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: []
    output: HealthAssessment
    side_effects: []

  # ---------------------------------------------------------------- Referral
  - method: POST
    path: "/referrals"
    description: "Raises a referral from a completed encounter, computes the navigation SLA, and auto-authorizes Center-of-Excellence and preferred tiers."
    roles: [Clinician, CareNavigator]
    code: 201
    input: [participant_id, visit_id, specialty, steerage_tier, urgency]
    output: Referral
    side_effects: ["Sets raised_by_provider_id to the acting provider's id", "Computes sla_due_at per calculations.referral_sla_due_at", "Auto-advances SUBMITTED -> AUTHORIZED for CENTER_OF_EXCELLENCE and PREFERRED"]

  - method: GET
    path: "/referrals"
    description: "Lists referrals. WALLED for employer-side roles at ladder rung 3."
    roles: [ProgramAdmin, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: ["participant_id?", "visit_id?", "redirected_from_referral_id?", "raised_by_provider_id?", "status?", "urgency?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/referrals/{referral_id}"
    description: "Reads one referral. WALLED for employer-side roles at ladder rung 3."
    roles: [ProgramAdmin, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{referral_id}/authorize"
    description: "Authorizes a STANDARD or OUT_OF_NETWORK referral. The navigator may not be the provider who conducted the originating encounter."
    roles: [CareNavigator]
    code: 200
    input: []
    output: Referral
    side_effects: ["Sets authorized_by_provider_id"]

  - method: POST
    path: "/referrals/{referral_id}/decline"
    description: "Declines a submitted referral."
    roles: [CareNavigator]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{referral_id}/redirect"
    description: "Redirects a declined referral by creating a successor referral linked through redirected_from_referral_id. Only chain heads are counted in reporting, so a redirect never double-counts."
    roles: [CareNavigator]
    code: 201
    input: [specialty, steerage_tier, urgency]
    output: Referral
    side_effects: ["Moves the declined referral to REDIRECTED", "Creates the successor in SUBMITTED with a freshly computed sla_due_at and with raised_by_provider_id copied unchanged from the predecessor"]

  - method: POST
    path: "/referrals/{referral_id}/close-loop"
    description: "Records the returned consult note and closes the loop."
    roles: [CareNavigator]
    code: 200
    input: [consult_note_reference]
    output: Referral
    side_effects: ["Sets loop_closed_at"]

  # ------------------------------------------------------ AlternativeStandard
  - method: POST
    path: "/alternative-standards"
    description: "A participant who did not meet the outcome standard requests a reasonable alternative."
    roles: [Participant]
    code: 201
    input: [participant_id, health_assessment_id, requested_reason]
    output: AlternativeStandard
    side_effects: []

  - method: GET
    path: "/alternative-standards"
    description: "Lists reasonable-alternative-standard requests. WALLED for employer-side roles at ladder rung 3."
    roles: [ProgramAdmin, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: ["participant_id?", "health_assessment_id?", "status?", "limit?", "offset?"]
    output: AlternativeStandard[]
    side_effects: []

  - method: GET
    path: "/alternative-standards/{standard_id}"
    description: "Reads one request. WALLED for employer-side roles at ladder rung 3."
    roles: [ProgramAdmin, Clinician, CareNavigator, Participant, EmployerBenefitsAdmin]
    code: 200
    input: []
    output: AlternativeStandard
    side_effects: []

  - method: POST
    path: "/alternative-standards/{standard_id}/assign"
    description: "Assigns or re-assigns the alternative. One re-assignment is permitted."
    roles: [CareNavigator]
    code: 200
    input: [alternative_type]
    output: AlternativeStandard
    side_effects: ["Sets assigned_at and due_date at assignment date plus 90 days", "Increments reassignment_count on the self-loop"]

  - method: POST
    path: "/alternative-standards/{standard_id}/complete"
    description: "Marks the alternative complete and grants outcome credit retroactively to the original measurement period. This is the depth-5 cascade."
    roles: [CareNavigator]
    code: 200
    input: []
    output: AlternativeStandard
    side_effects:
      - "hop 1 credit_granted true"
      - "hop 2 HealthAssessment.outcome_credit_status CREDITED_VIA_RAS"
      - "hop 3 retroactive OUTCOME_BASED IncentiveAward created in the measurement period"
      - "hop 4 ReportingPeriod incentive buckets recomputed"
      - "hop 5 Employer wellness budget recomputed"

  - method: POST
    path: "/alternative-standards/{standard_id}/deny"
    description: "Denies the request; no credit and no award."
    roles: [CareNavigator]
    code: 200
    input: []
    output: AlternativeStandard
    side_effects: []

  # ----------------------------------------------------------- IncentiveAward
  - method: POST
    path: "/incentive-awards"
    description: "Creates an incentive award. Guarded by optimistic concurrency on the participant's version, by the program cap and by the wellness budget."
    roles: [EmployerBenefitsAdmin]
    code: 201
    input: [participant_id, reporting_period_id, award_type, expected_participant_version, "health_assessment_id?"]
    output: IncentiveAward
    side_effects:
      - "Computes award_amount_cents"
      - "increments Participant.version by 1"
      - "Recomputes ReportingPeriod incentive buckets and Employer wellness budget"

  - method: GET
    path: "/incentive-awards"
    description: "Lists incentive awards, optionally filtered by participant, employer, period, backing assessment or status."
    roles: [ProgramAdmin, EmployerBenefitsAdmin, PayrollProcessor, Participant]
    code: 200
    input: ["participant_id?", "employer_id?", "reporting_period_id?", "health_assessment_id?", "status?", "limit?", "offset?"]
    output: IncentiveAward[]
    side_effects: []

  - method: GET
    path: "/incentive-awards/{award_id}"
    description: "Reads one incentive award."
    roles: [ProgramAdmin, EmployerBenefitsAdmin, PayrollProcessor, Participant]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: []

  - method: POST
    path: "/incentive-awards/{award_id}/approve"
    description: "Approves a pending award and records the approving user id."
    roles: [EmployerBenefitsAdmin]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["Sets approved_by_user_id"]

  - method: POST
    path: "/incentive-awards/{award_id}/export"
    description: "Exports an approved award to payroll under a batch reference."
    roles: [PayrollProcessor]
    code: 200
    input: [payroll_reference]
    output: IncentiveAward
    side_effects: ["Sets exported_by_user_id and payroll_reference"]

  - method: POST
    path: "/incentive-awards/{award_id}/mark-paid"
    description: "Confirms payroll settlement of an exported award."
    roles: [PayrollProcessor]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["Moves the amount from the period's pending bucket to its paid bucket"]

  - method: POST
    path: "/incentive-awards/{award_id}/reverse"
    description: "Reverses an approved or paid award, releasing both the cap headroom and the wellness budget."
    roles: [EmployerBenefitsAdmin]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["Moves the amount into the period's reversed bucket", "Recomputes Employer.wellness_budget_committed_cents"]

  # ---------------------------------------------------------- ReportingPeriod
  - method: POST
    path: "/reporting-periods"
    description: "Opens a reporting period for one employer. The period interval is closed at both ends."
    roles: [ProgramAdmin]
    code: 201
    input: [employer_id, period_start, period_end]
    output: ReportingPeriod
    side_effects: ["Sets status OPEN and restatement_count 0"]

  - method: GET
    path: "/reporting-periods"
    description: "Lists reporting periods, optionally filtered by employer or status."
    roles: [ProgramAdmin, EmployerBenefitsAdmin]
    code: 200
    input: ["employer_id?", "status?", "limit?", "offset?"]
    output: ReportingPeriod[]
    side_effects: []

  - method: GET
    path: "/reporting-periods/{period_id}"
    description: "Reads one reporting period with its five incentive money buckets."
    roles: [ProgramAdmin, EmployerBenefitsAdmin]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects: []

  - method: POST
    path: "/reporting-periods/{period_id}/finalize"
    description: "Finalizes the period, locking its visits, truing up its vendor contracts and freezing writes on records dated inside it."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects:
      - "hop 1 status FINALIZED (or CLOSED at the restatement cap) and finalized_at set"
      - "hop 2 in-period COMPLETED and AMENDED visits move to LOCKED"
      - "hop 3 ACTIVE vendor contracts compute gross_fee_cents, true_up_amount_cents and contract_cost_cents and move to TRUED_UP"
      - "hop 4 Employer.program_cost_to_date_cents increases by the contract costs"

  - method: POST
    path: "/reporting-periods/{period_id}/restate"
    description: "Reopens a finalized period for restatement, returning its locked visits to AMENDED. Capped at 2 restatements."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects: ["Increments restatement_count", "LOCKED visits inside the period return to AMENDED"]

  - method: GET
    path: "/reporting-periods/{period_id}/utilization-report"
    description: "Utilization and ROI report. Employer-side callers receive small-cell suppression; ProgramAdmin receives every figure unsuppressed."
    roles: [ProgramAdmin, EmployerBenefitsAdmin]
    code: 200
    input: []
    output: "{ reporting_period_id: string, eligible_population_count: integer, enrolled_population_count: integer, utilizing_participant_count: integer, completed_visit_count: integer, engagement_rate_over_eligible: number, engagement_rate_over_enrolled: number, visits_per_utilizer: number, primary_care_visit_count: integer, primary_care_participant_count: integer, occ_health_visit_count: integer, occ_health_participant_count: integer, wellness_visit_count: integer, wellness_participant_count: integer, suppressed_cell_keys: array, avoided_cost_cents: integer, program_cost_cents: integer, roi_ratio: number, pepm_cents: integer }"
    side_effects: []


# =============================================================================
# §1.6 Error Code Catalog — 35 codes
# =============================================================================
errors:

  # ---- auth and access gates ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_CONFIDENTIALITY_WALL
    http: 403
    condition: "An employer-side role (EmployerBenefitsAdmin or PayrollProcessor) touched an individual-level clinical resource. Raised at rung 3, before the path id is resolved, so it also answers reads of ids that do not exist."
  - id: ERR_SCOPE_VIOLATION
    http: 403
    condition: "An entity-backed role acted outside its own scope: a Participant on another participant's resource, an EmployerBenefitsAdmin on another employer's resource, a Clinician whose Provider has provider_function NAVIGATOR, or a CareNavigator whose Provider has provider_function CLINICIAN"

  # ---- existence ----
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "employer_id in the path or body matches no Employer"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "site_id in the path or body matches no Site"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "provider_id in the path or body matches no Provider"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "participant_id in the path or body matches no Participant"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "appointment_id in the path matches no Appointment"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "visit_id in the path or body matches no Visit, for a caller that is not employer-side"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id or health_assessment_id matches no HealthAssessment, for a caller that is not employer-side"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referral_id in the path matches no Referral, for a caller that is not employer-side"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "award_id in the path matches no IncentiveAward"
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "period_id or reporting_period_id matches no ReportingPeriod"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path or body id for an EligibilityRecord, VendorContract, StaffingShift or AlternativeStandard matches nothing"

  # ---- payload ----
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, unparseable date or instant, negative amount, or a conditionally-required field omitted (fitness_conclusion on completing an OCC_HEALTH visit, health_assessment_id on an OUTCOME_BASED award, visit_id on a CLINIC_MEASURED assessment, or any of the six biometric metrics on a CLINIC_MEASURED assessment)"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "An enum-typed field carries a value outside its declared member set"

  # ---- concurrency and state ----
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_site_version, expected_participant_version or expected_visit_version does not equal the parent entity's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the entity's current state, including a 4th visit amendment, a 2nd alternative-standard reassignment, a 3rd reporting-period restatement, a duplicate OUTCOME_BASED award for the same participant and period, and a direct OUTCOME_BASED award naming a CREDITED_VIA_RAS assessment"
  - id: ERR_RESCHEDULE_LIMIT_REACHED
    http: 409
    condition: "A third reschedule of the same appointment"
  - id: ERR_PERIOD_FINALIZED
    http: 409
    condition: "A write whose governing date falls inside a ReportingPeriod in status FINALIZED or CLOSED"

  # ---- eligibility, disclosure and credentials ----
  - id: ERR_NOT_ELIGIBLE_ON_DATE
    http: 422
    condition: "The participant is not ACTIVE, or the backing eligibility row does not cover the governing date under the closed-interval rule"
  - id: ERR_AUTHORIZATION_REVOKED
    http: 403
    condition: "A disclosure release was attempted while participant.authorization_status is not GRANTED"
  - id: ERR_DISCLOSURE_NOT_PERMITTED
    http: 422
    condition: "An employer disclosure read on a visit whose disclosure_status is WALLED, RELEASE_PENDING, NOT_DISCLOSABLE or SUPPRESSED, or a release attempt on a visit not sitting in RELEASE_PENDING"
  - id: ERR_PROVIDER_CREDENTIAL_LAPSED
    http: 422
    condition: "The named provider's credential_status is LAPSED or DEACTIVATED at the moment of the write"

  # ---- scheduling ----
  - id: ERR_SITE_CLOSED
    http: 422
    condition: "The requested service_date is listed in the site's closure_dates"
  - id: ERR_OUTSIDE_OPERATING_HOURS
    http: 422
    condition: "The appointment interval is not closed-contained in the site's daily window, or the service date's weekday is not in operating_weekdays"
  - id: ERR_STAFFING_COVERAGE_REQUIRED
    http: 422
    condition: "No StaffingShift of the same site and provider closed-contains the appointment interval"
  - id: ERR_PROVIDER_SLOT_CONFLICT
    http: 409
    condition: "The candidate interval half-open-overlaps another BOOKED, CONSUMED or NO_SHOW appointment of the same provider"
  - id: ERR_SLOT_CAPACITY_EXHAUSTED
    http: 409
    condition: "The site already holds daily_slot_capacity non-cancelled appointments on that service date"
  - id: ERR_EMPLOYER_QUOTA_EXHAUSTED
    http: 409
    condition: "No eligible VendorContract grants the participant's employer capacity at this site, or the selected contract's quota_visits_consumed already equals quota_visits_total"

  # ---- compliance and money ----
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The CareNavigator authorizing a referral is the same Provider that raised it (X-User-ID equals referral.raised_by_provider_id)"
  - id: ERR_DUPLICATE_ELIGIBILITY
    http: 409
    condition: "Another eligibility row for the same employer and member_external_id has an overlapping closed coverage span"
  - id: ERR_INCENTIVE_CAP_EXCEEDED
    http: 422
    condition: "The participant's committed incentive cents for the period plus the candidate award is strictly greater than the program cap"
  - id: ERR_WELLNESS_BUDGET_EXCEEDED
    http: 422
    condition: "The employer's committed wellness cents plus the candidate award is strictly greater than wellness_budget_cents"

# =============================================================================
# §1.7 RBAC Matrix — 7 roles, segregation-of-duties model
# =============================================================================
roles:

  - name: ProgramAdmin
    description: "Platform operator. Owns employers, sites, vendor contracts, reporting periods and the logical clock. Not an employer-side role, so the confidentiality wall does not apply and reports come back unsuppressed."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /employers"
      - "POST /sites"
      - "PATCH /sites/{site_id} (shared with ClinicManager)"
      - "POST /vendor-contracts"
      - "POST /reporting-periods"
      - "POST /reporting-periods/{period_id}/finalize"
      - "POST /reporting-periods/{period_id}/restate"
    shared_operations:
      - "GET /employers/{employer_id}"
      - "GET /sites, GET /sites/{site_id}"
      - "GET /vendor-contracts, GET /vendor-contracts/{contract_id}"
      - "GET /providers, GET /providers/{provider_id}"
      - "GET /staffing-shifts, GET /staffing-shifts/{shift_id}"
      - "GET /eligibility-records, GET /eligibility-records/{record_id}"
      - "GET /participants, GET /participants/{participant_id}"
      - "GET /appointments, GET /appointments/{appointment_id}"
      - "GET /visits, GET /visits/{visit_id}, GET /visits/{visit_id}/employer-disclosure"
      - "GET /health-assessments, GET /health-assessments/{assessment_id}"
      - "GET /referrals, GET /referrals/{referral_id}"
      - "GET /alternative-standards, GET /alternative-standards/{standard_id}"
      - "GET /incentive-awards, GET /incentive-awards/{award_id}"
      - "GET /reporting-periods, GET /reporting-periods/{period_id}, GET /reporting-periods/{period_id}/utilization-report"

  - name: ClinicManager
    description: "Vendor-side site operations. Owns providers, credentials, staffing shifts and the site calendar."
    identity: opaque
    exclusive_operations:
      - "POST /providers"
      - "POST /providers/{provider_id}/credential-renewal"
      - "POST /providers/{provider_id}/deactivate"
      - "POST /staffing-shifts"
    shared_operations:
      - "PATCH /sites/{site_id} (shared with ProgramAdmin)"
      - "GET /employers/{employer_id}"
      - "GET /sites, GET /sites/{site_id}"
      - "GET /vendor-contracts, GET /vendor-contracts/{contract_id}"
      - "GET /providers, GET /providers/{provider_id}"
      - "GET /staffing-shifts, GET /staffing-shifts/{shift_id}"
      - "GET /eligibility-records, GET /eligibility-records/{record_id}"
      - "GET /participants, GET /participants/{participant_id}"
      - "GET /appointments, GET /appointments/{appointment_id}"
      - "GET /visits, GET /visits/{visit_id}"

  - name: Clinician
    description: "Delivers encounters. X-User-ID is a Provider whose provider_function is CLINICIAN. May only advance visits it owns (visit.provider_id equals X-User-ID)."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /appointments/{appointment_id}/check-in"
      - "POST /visits/{visit_id}/start"
      - "POST /visits/{visit_id}/complete"
      - "POST /visits/{visit_id}/amend"
      - "POST /visits/{visit_id}/disclosure-release"
      - "POST /appointments/{appointment_id}/cancel with cancellation_reason NO_SHOW"
    shared_operations:
      - "POST /health-assessments (shared with Participant; only the Clinician may create CLINIC_MEASURED rows)"
      - "POST /referrals (shared with CareNavigator)"
      - "POST /appointments/{appointment_id}/cancel (shared with Participant and CareNavigator)"
      - "GET /sites, GET /sites/{site_id}"
      - "GET /providers, GET /providers/{provider_id}"
      - "GET /staffing-shifts, GET /staffing-shifts/{shift_id}"
      - "GET /participants, GET /participants/{participant_id}"
      - "GET /appointments, GET /appointments/{appointment_id}"
      - "GET /visits, GET /visits/{visit_id}"
      - "GET /health-assessments, GET /health-assessments/{assessment_id}"
      - "GET /referrals, GET /referrals/{referral_id}"
      - "GET /alternative-standards, GET /alternative-standards/{standard_id}"

  - name: CareNavigator
    description: "Runs referral steerage, navigation SLAs and reasonable-alternative standards. X-User-ID is a Provider whose provider_function is NAVIGATOR. Segregation of duties: may not authorize a referral it raised itself."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /referrals/{referral_id}/authorize"
      - "POST /referrals/{referral_id}/decline"
      - "POST /referrals/{referral_id}/redirect"
      - "POST /referrals/{referral_id}/close-loop"
      - "POST /alternative-standards/{standard_id}/assign"
      - "POST /alternative-standards/{standard_id}/complete"
      - "POST /alternative-standards/{standard_id}/deny"
    shared_operations:
      - "POST /appointments (shared with Participant)"
      - "POST /appointments/{appointment_id}/reschedule (shared with Participant)"
      - "POST /appointments/{appointment_id}/cancel (shared with Participant and Clinician)"
      - "POST /referrals (shared with Clinician)"
      - "GET /sites, GET /sites/{site_id}"
      - "GET /providers, GET /providers/{provider_id}"
      - "GET /staffing-shifts, GET /staffing-shifts/{shift_id}"
      - "GET /participants, GET /participants/{participant_id}"
      - "GET /appointments, GET /appointments/{appointment_id}"
      - "GET /visits, GET /visits/{visit_id}"
      - "GET /health-assessments, GET /health-assessments/{assessment_id}"
      - "GET /referrals, GET /referrals/{referral_id}"
      - "GET /alternative-standards, GET /alternative-standards/{standard_id}"

  - name: EmployerBenefitsAdmin
    description: "Employer-side benefits owner. X-User-ID is an Employer id. Loads the eligibility file, enrols members and runs the incentive program. Subject to the confidentiality wall at ladder rung 3 and to small-cell suppression on the utilization report."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /eligibility-records"
      - "POST /eligibility-records/{record_id}/terminate"
      - "POST /participants"
      - "POST /participants/{participant_id}/terminate"
      - "POST /participants/{participant_id}/reinstate"
      - "POST /incentive-awards"
      - "POST /incentive-awards/{award_id}/approve"
      - "POST /incentive-awards/{award_id}/reverse"
    shared_operations:
      - "GET /employers/{employer_id}"
      - "GET /sites, GET /sites/{site_id}"
      - "GET /vendor-contracts, GET /vendor-contracts/{contract_id}"
      - "GET /eligibility-records, GET /eligibility-records/{record_id}"
      - "GET /participants, GET /participants/{participant_id}"
      - "GET /visits/{visit_id}/employer-disclosure"
      - "GET /incentive-awards, GET /incentive-awards/{award_id}"
      - "GET /reporting-periods, GET /reporting-periods/{period_id}, GET /reporting-periods/{period_id}/utilization-report"
      - "Routed-but-walled: GET /visits, GET /visits/{visit_id}, GET /health-assessments, GET /health-assessments/{assessment_id}, GET /referrals, GET /referrals/{referral_id}, GET /alternative-standards, GET /alternative-standards/{standard_id} — the role passes rung 2 and is then refused at rung 3"

  - name: Participant
    description: "The eligible member. X-User-ID is a Participant id. Books and reschedules own appointments, self-attests health data, grants and revokes disclosure authorization, and requests reasonable alternatives."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /participants/{participant_id}/authorization"
      - "POST /alternative-standards"
    shared_operations:
      - "POST /appointments (shared with CareNavigator)"
      - "POST /appointments/{appointment_id}/reschedule (shared with CareNavigator)"
      - "POST /appointments/{appointment_id}/cancel (shared with CareNavigator and Clinician)"
      - "POST /health-assessments (shared with Clinician; a Participant may only create SELF_ATTESTED rows for itself)"
      - "GET /sites, GET /sites/{site_id}"
      - "GET /providers, GET /providers/{provider_id}"
      - "GET /participants, GET /participants/{participant_id}"
      - "GET /appointments, GET /appointments/{appointment_id}"
      - "GET /visits, GET /visits/{visit_id}"
      - "GET /health-assessments, GET /health-assessments/{assessment_id}"
      - "GET /referrals, GET /referrals/{referral_id}"
      - "GET /alternative-standards, GET /alternative-standards/{standard_id}"
      - "GET /incentive-awards, GET /incentive-awards/{award_id}"

  - name: PayrollProcessor
    description: "Employer-side payroll operator. Exports approved incentive awards and confirms settlement. Employer-side for the confidentiality wall, so any clinical route it is not routed to fails at rung 2 and the walled routes it is routed to fail at rung 3."
    identity: opaque
    exclusive_operations:
      - "POST /incentive-awards/{award_id}/export"
      - "POST /incentive-awards/{award_id}/mark-paid"
    shared_operations:
      - "GET /incentive-awards, GET /incentive-awards/{award_id}"

