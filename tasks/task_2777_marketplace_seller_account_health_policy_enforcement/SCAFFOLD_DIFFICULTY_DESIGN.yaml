            - "PolicyRule RM-ACK-1: REVIEW_MANIPULATION, base 2.50, removal_scope ACCOUNT, requires_poa false."
            - "Seller S1 holds action a1, which was appealed and DENIED by ar-1, so a1 is UPHELD with resolution_reason APPEAL_DENIED — acknowledge is no longer available from that state."
            - "Seller S2 is an unrelated registration with fully distinct tax id, bank token, address and email domain, so no RelatedAccountLink is minted."
