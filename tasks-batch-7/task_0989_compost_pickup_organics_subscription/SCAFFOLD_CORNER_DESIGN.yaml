      - name: pause_cancels_only_pickups_inside_window
        claim_type: side_effect_execution
        grounds: ["state_machines.Subscription.ACTIVE_to_PAUSED", "state_machines.PickupEvent"]
        distinguishing_aspect: "Pausing over [2026-06-08, 2026-06-15) cancels the 2026-06-08 pickup (inside the half-open window) but leaves the 2026-06-01 pickup SCHEDULED."
        test_recipe:
          setup: ["RES subscription; weeks 2026-06-01 and 2026-06-08 generated while ACTIVE"]
          setup_api_calls:
