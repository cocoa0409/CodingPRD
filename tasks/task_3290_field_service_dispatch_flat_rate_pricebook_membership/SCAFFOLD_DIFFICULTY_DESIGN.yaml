scaffold_difficulty_design:
  # ================================================================ RULE 1
  - rule_id: dual_variant_calc
    instances:
      - name: membership_recognition_missed_visit_divergence
        grounds:
          - calculations.membership_revenue_recognition
          - state_machines.MembershipVisit.SCHEDULED_to_MISSED
          - entities.MembershipAgreement.fields.revenue_recognized_cents
        distinguishing_aspect: |
          The two variants operate on the MembershipAgreement domain: BASE counts MISSED visits in its
          denominator while owed_excluding_missed drops them, so the identical four-visit agreement
          recognises 50000 cents under BASE and 66667 cents under the variant.
        test_recipe:
          setup:
            - "one branch at postal code 78701, one technician with skill HVAC"
            - "one membership plan priced 100000 cents with four included visits and a 30-day maintenance interval"
            - "one membership agreement on that plan, activated by a 30000-cent down payment"
            - "four membership visits at sequence numbers 1..4, scheduled 2026-10-01, 2026-11-01, 2026-12-01 and 2027-03-01"
            - "the logical clock advanced to 2027-02-01, so sequence 3 flips to MISSED and the agreement flips to OVERDUE while sequence 4 stays SCHEDULED"
            - "two of the four visits (sequences 1 and 2) completed through their own appointments"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2027-03-01T18:00:00Z" }], daily_capacity_hours: 40 }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/membership-plans"
              payload: { name: "Comfort Club", annual_price_cents: 100000, included_service_visit_count: 4, maintenance_visit_interval_days: 30, included_labor_discount_pct: 0.10, status: "PUBLISHED" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-TUNE", category: "HVAC", display_name: "System Tune", required_skill_code: "HVAC", estimated_hours: 1.0, flat_rate_cents: 5000, status: "PUBLISHED" }
              as: Dispatcher
              captures: { task_id: $.data.id }
            - call: "POST /api/membership-agreements"
              payload: { membership_plan_id: "${plan_id}", branch_id: "${br_id}", homeowner_name: "Ada", homeowner_postal_code: "78701", term_months: 12 }
              as: Technician
              captures: { ag_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/payments"
              payload: { amount_cents: 30000 }
              as: Dispatcher
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 1, scheduled_date: "2026-10-01T00:00:00Z" }
              as: Dispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 2, scheduled_date: "2026-11-01T00:00:00Z" }
              as: Dispatcher
              captures: { v2_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 3, scheduled_date: "2026-12-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 4, scheduled_date: "2027-03-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-10-01T09:00:00Z", window_end_utc: "2026-10-01T11:00:00Z", membership_agreement_id: "${ag_id}", membership_visit_sequence_number: 1 }
              as: Dispatcher
              captures: { a1_id: $.data.id }
            - call: "POST /api/appointments/${a1_id}/lines"
              payload: { pricebook_task_code: "HVAC-TUNE" }
              as: Dispatcher
              captures: { l1_id: $.data.id }
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-11-01T09:00:00Z", window_end_utc: "2026-11-01T11:00:00Z", membership_agreement_id: "${ag_id}", membership_visit_sequence_number: 2 }
              as: Dispatcher
              captures: { a2_id: $.data.id }
            - call: "POST /api/appointments/${a2_id}/lines"
              payload: { pricebook_task_code: "HVAC-TUNE" }
              as: Dispatcher
            - call: "POST /api/appointments/${a1_id}/complete"
              payload: { completion_description: "Replaced the filter, checked the condensate line, verified the thermostat calibration and the blower amperage." }
              as: Technician
            - call: "POST /api/appointments/${a1_id}/complete"
              payload: { completion_description: "Replaced the filter, checked the condensate line, verified the thermostat calibration and the blower amperage." }
              as: Technician
            - call: "POST /api/appointments/${a2_id}/complete"
              payload: { completion_description: "Replaced the filter, checked the condensate line, verified the thermostat calibration and the blower amperage." }
              as: Technician
            - call: "POST /api/appointments/${a2_id}/complete"
              payload: { completion_description: "Replaced the filter, checked the condensate line, verified the thermostat calibration and the blower amperage." }
              as: Technician
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/membership-agreements/${ag_id}/membership-visits"
              payload: { status: "COMPLETED" }
              as: Dispatcher
              captures: { ag_id_echo: "$.data[0].membership_agreement_id" }
          assert:
            - "MembershipAgreement.${ag_id}.visits_fulfilled_count == 2"
            - "the BASE variant of membership_revenue_recognition yields revenue_recognized_cents == 50000 (100000 * 2 / 4)"
            - "the owed_excluding_missed variant yields revenue_recognized_cents == 66667 (100000 * 2 / 3) on the identical visit set"
            - "the two variants disagree, so a single-valued assertion on revenue_recognized_cents can only pass for one variant"
      - name: campaign_attribution_visit_waterfall_divergence
        grounds:
          - calculations.campaign_attribution_revenue
          - entities.Campaign.fields.attributed_job_count
          - state_machines.MembershipVisit.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          A different entity domain from the membership variant above: the divergence sits on Campaign
          attribution, where BASE counts every attributed appointment (2) while visit_completion_waterfall
          drops the one whose maintenance visit never completed (1).
        test_recipe:
          setup:
            - "one branch, one HVAC technician, one HVAC pricebook task, one membership plan, one campaign"
            - "one membership agreement with visit sequence 1 scheduled 2026-12-01 and never completed"
            - "appointment A booked against the campaign and linked to that membership visit, but never completed"
            - "appointment B booked against the same campaign from a recorded call and never completed"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { name: "Fall Tune-Up", channel: "SEARCH", spend_cents: 50000 }
              as: PlatformAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /api/membership-plans"
              payload: { name: "Comfort Club", annual_price_cents: 100000, included_service_visit_count: 4, maintenance_visit_interval_days: 30, included_labor_discount_pct: 0.10, status: "PUBLISHED" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/membership-agreements"
              payload: { membership_plan_id: "${plan_id}", branch_id: "${br_id}", homeowner_name: "Ada", homeowner_postal_code: "78701", term_months: 12 }
              as: Technician
              captures: { ag_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/payments"
              payload: { amount_cents: 30000 }
              as: Dispatcher
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 1, scheduled_date: "2026-12-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /api/call-records"
              payload: { campaign_id: "${camp_id}", cs_user_id: "cs-77", duration_seconds: 420, recording_uri: "s3://calls/1188.wav", started_at_utc: "2026-09-02T14:00:00Z" }
              as: CustomerService
              captures: { call_id: $.data.id }
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-12-01T09:00:00Z", window_end_utc: "2026-12-01T11:00:00Z", campaign_id: "${camp_id}", call_record_id: "${call_id}", membership_agreement_id: "${ag_id}", membership_visit_sequence_number: 1 }
              as: Dispatcher
              captures: { a1_id: $.data.id }
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Bo", postal_code: "78701", window_start_utc: "2026-12-02T09:00:00Z", window_end_utc: "2026-12-02T11:00:00Z", campaign_id: "${camp_id}" }
              as: Dispatcher
              captures: { a2_id: $.data.id }
          trigger:
            - call: "GET /api/campaigns/${camp_id}"
              payload: { include_attribution: true }
              as: Manager
            - call: "GET /api/campaigns/${camp_id}"
              payload: { include_attribution: true, attribution_variant: "visit_completion_waterfall" }
              as: Manager
          assert:
            - "Campaign.${camp_id}.attributed_job_count == 2 under the chronological_created_at variant"
            - "Campaign.${camp_id}.attributed_job_count == 1 under the visit_completion_waterfall variant"
            - "the two variants disagree on the identical appointment set because only the non-member appointment has no membership visit to complete"
  # ================================================================ RULE 2
  - rule_id: combinatorial_formula
    instances:
      - name: technician_eligibility_filter_multi_input_selector
        grounds:
          - calculations.technician_eligibility_filter
          - validations[priority=10]
          - errors[ERR_NO_ELIGIBLE_TECHNICIAN]
        distinguishing_aspect: |
          Combinatorial mode (a): the selector combines six inputs with non-linear interaction (availability,
          remaining capacity, shift overlap, skill coverage, location prefix, branch) and then ranks the
          survivors by (scheduled_hours, dispatched_hours, postal_code, created_at).
        test_recipe:
          setup:
            - "one branch at postal code 78701 with two HVAC technicians, Dana and Eli, both at postal code 78702"
            - "Dana already carries one dispatched 1.0-hour appointment, so her scheduled_hours are 0 and her dispatched_hours are 1.0"
            - "Eli carries one booked but undispatched 1.0-hour appointment, so his scheduled_hours are 1.0 and his dispatched_hours are 0"
            - "one further appointment needing skill HVAC at postal code 78701, dispatched as the trigger"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-TUNE", category: "HVAC", display_name: "System Tune", required_skill_code: "HVAC", estimated_hours: 1.0, flat_rate_cents: 5000, status: "PUBLISHED" }
              as: Dispatcher
              captures: { task_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78702", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
              captures: { dana_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Eli", postal_code: "78702", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
              captures: { eli_id: $.data.id }
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Bo", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
              captures: { a_dana_id: $.data.id }
            - call: "POST /api/appointments/${a_dana_id}/lines"
              payload: { pricebook_task_code: "HVAC-TUNE" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${a_dana_id}" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Dee", postal_code: "78701", window_start_utc: "2026-09-10T15:00:00Z", window_end_utc: "2026-09-10T17:00:00Z" }
              as: Dispatcher
              captures: { a_eli_id: $.data.id }
            - call: "POST /api/appointments/${a_eli_id}/lines"
              payload: { pricebook_task_code: "HVAC-TUNE" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Cy", postal_code: "78701", window_start_utc: "2026-09-10T12:00:00Z", window_end_utc: "2026-09-10T14:00:00Z" }
              as: Dispatcher
              captures: { a_new_id: $.data.id }
            - call: "POST /api/appointments/${a_new_id}/lines"
              payload: { pricebook_task_code: "HVAC-TUNE" }
              as: Dispatcher
          trigger:
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${a_new_id}" }
              as: Dispatcher
          assert:
            - "the dispatch response's technician_id == Technician.${dana_id}, because Dana's scheduled_hours are 0 while Eli's are 1.0"
            - "Technician.${eli_id}.scheduled_hours == 1.0 and Technician.${eli_id}.dispatched_hours == 0 after the setup"
            - "Technician.${dana_id}.dispatched_hours == 2.0 after the trigger, since the setup dispatch and the trigger each commit 1.0 hour"
      - name: incentive_pay_nested_rounding_order
        grounds:
          - calculations.technician_monthly_incentive_pay
          - entities.Technician.fields.sales_coaching_strike_count
          - calculations.technician_revenue_ledger_total
        distinguishing_aspect: |
          Combinatorial mode (b): the rounding order is pinned as round-per-appointment-then-sum, so two
          15000-cent appointments contribute 300 + 300 = 600 rather than the 1200 a total-keyed tier would
          pay, and the clamp is applied to the summed gross rather than to each summand.
        test_recipe:
          setup:
            - "one branch and one HVAC technician"
            - "two HVAC tasks priced 15000 cents with estimated_hours 1.0"
            - "two appointments, one per task, each dispatched and completed, so the technician carries two completed appointments of 15000 cents each"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-20T18:00:00Z" }], daily_capacity_hours: 40 }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-TUNE", category: "HVAC", display_name: "System Tune", required_skill_code: "HVAC", estimated_hours: 1.0, flat_rate_cents: 15000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COIL", category: "HVAC", display_name: "Coil Clean", required_skill_code: "HVAC", estimated_hours: 1.0, flat_rate_cents: 15000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
              captures: { a1_id: $.data.id }
            - call: "POST /api/appointments/${a1_id}/lines"
              payload: { pricebook_task_code: "HVAC-TUNE" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${a1_id}" }
              as: Dispatcher
            - call: "POST /api/appointments/${a1_id}/complete"
              payload: { completion_description: "Cleaned the coil, replaced the filter and verified the blower amperage across the whole system." }
              as: Technician
            - call: "POST /api/appointments/${a1_id}/complete"
              payload: { completion_description: "Cleaned the coil, replaced the filter and verified the blower amperage across the whole system." }
              as: Technician
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Bo", postal_code: "78701", window_start_utc: "2026-09-11T09:00:00Z", window_end_utc: "2026-09-11T11:00:00Z" }
              as: Dispatcher
              captures: { a2_id: $.data.id }
            - call: "POST /api/appointments/${a2_id}/lines"
              payload: { pricebook_task_code: "HVAC-COIL" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${a2_id}" }
              as: Dispatcher
            - call: "POST /api/appointments/${a2_id}/complete"
              payload: { completion_description: "Cleaned the coil, replaced the filter and verified the blower amperage across the whole system." }
              as: Technician
            - call: "POST /api/appointments/${a2_id}/complete"
              payload: { completion_description: "Cleaned the coil, replaced the filter and verified the blower amperage across the whole system." }
              as: Technician
          trigger:
            - call: "GET /api/technicians/${tech_id}/incentive-statement"
              payload: { period_year: 2026, period_month: 9 }
              as: Manager
          assert:
            - "gross_component_cents == 600, the sum of two individually rounded 300-cent components (15000 * 0.02 each)"
            - "clamped_component_cents == 600 and charge_cents == 0"
            - "incentive_cents == 12 (600 * 0.020, rounded half-up)"
            - "a total-keyed reading of the same fixture returns 1200 for gross_component_cents, because the summed 30000 cents crosses into the 0.04 tier"
  # ================================================================ RULE 3
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_three_parallel_dimensions
        grounds:
          - state_machines.Appointment.OVERRIDE_PENDING_to_QUOTE_REJECTED
          - state_machines.Appointment.QUOTE_REJECTED_to_OVERRIDE_PENDING
          - state_machines.Appointment.DISPATCHED_to_COMPLETED
        distinguishing_aspect: |
          On the Appointment entity, status, dispatch_status and pricing_status advance independently: a
          rejected quote leaves status DISPATCHED and dispatch_status DISPATCHED untouched, and the quote
          can then loop QUOTE_REJECTED back to OVERRIDE_PENDING while the job never moves.
        test_recipe:
          setup:
            - "one branch, one technician with HVAC skill, one published 300000-cent HVAC task"
            - "one appointment dispatched, so status DISPATCHED, dispatch_status DISPATCHED, pricing_status AUTO_QUOTED"
            - "a first override request for 340000 cents rejected by the manager"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COMP", category: "HVAC", display_name: "Compressor Replacement", required_skill_code: "HVAC", estimated_hours: 3.0, flat_rate_cents: 300000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T12:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /api/appointments/${ap_id}/lines"
              payload: { pricebook_task_code: "HVAC-COMP" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
            - call: "POST /api/appointments/${ap_id}/override-requests"
              payload: { requested_price_cents: 340000 }
              as: Technician
              captures: { or1_id: $.data.id }
            - call: "GET /api/appointments/${ap_id}"
              payload: {}
              as: Dispatcher
              captures: { ap_v: $.data.version }
            - call: "POST /api/override-requests/${or1_id}/decide"
              payload: { decision: "REJECT", expected_appointment_version: "${ap_v}" }
              as: Manager
          trigger:
            - call: "POST /api/appointments/${ap_id}/override-requests"
              payload: { requested_price_cents: 342500 }
              as: Technician
          assert:
            - "the trigger succeeds and Appointment.${ap_id}.pricing_status returns to OVERRIDE_PENDING"
            - "Appointment.${ap_id}.status is still DISPATCHED and dispatch_status is still DISPATCHED after both the rejection and the re-filing"
            - "the rejected request is still recorded with status REJECTED while the new one is PENDING"
      - name: membership_visit_cyclic_missed_loop
        grounds:
          - state_machines.MembershipVisit.MISSED_to_SCHEDULED
          - state_machines.MembershipVisit.SCHEDULED_to_MISSED
          - state_machines.MembershipAgreement.OVERDUE_to_ACTIVE
        distinguishing_aspect: |
          On MembershipVisit the machine cycles SCHEDULED -> MISSED -> SCHEDULED and each lap pushes the
          parent agreement ACTIVE -> OVERDUE -> ACTIVE, so a single visit is visited, missed and reopened
          more than once without ever reaching a terminal state.
        test_recipe:
          setup:
            - "one branch, one membership plan priced 100000 cents with four visits and a 30-day interval"
            - "one agreement activated, with one visit scheduled at 2026-10-01"
            - "the logical clock advanced to 2026-11-15 so that visit flips to MISSED and the agreement to OVERDUE"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/membership-plans"
              payload: { name: "Comfort Club", annual_price_cents: 100000, included_service_visit_count: 4, maintenance_visit_interval_days: 30, included_labor_discount_pct: 0.10, status: "PUBLISHED" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/membership-agreements"
              payload: { membership_plan_id: "${plan_id}", branch_id: "${br_id}", homeowner_name: "Ada", homeowner_postal_code: "78701", term_months: 12 }
              as: Technician
              captures: { ag_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/payments"
              payload: { amount_cents: 30000 }
              as: Dispatcher
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 1, scheduled_date: "2026-10-01T00:00:00Z" }
              as: Dispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
