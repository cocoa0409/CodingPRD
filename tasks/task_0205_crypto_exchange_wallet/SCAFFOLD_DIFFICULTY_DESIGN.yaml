              as: Operator
              captures: { dep_ce: $.data.id }
            - call: "POST /deposits/${dep_ce}/confirmations"
              payload: { delta: 1 }
              as: Operator
            - call: "GET /accounts/${acc_ce}"
              as: Trader
              as_user_id: "${acc_ce}"
              captures: { v_ce: $.data.version }
            - call: "POST /withdrawal-addresses"
              payload: { account_id: "${acc_ce}", asset: "BTC", chain_address: "0xCE", label: "out", expected_account_version: "${v_ce}" }
