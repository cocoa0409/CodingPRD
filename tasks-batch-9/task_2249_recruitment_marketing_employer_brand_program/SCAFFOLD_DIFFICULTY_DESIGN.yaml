              payload: { job_posting_id: "${posting_id}", candidate_email: "cascade@example.com" }
              as: Anonymous
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              as: Anonymous
            - call: "POST /touchpoints"
              payload: { application_id: "${app_id}", channel_id: "${ch1_id}", media_flight_id: "${flight_id}", touch_type: "CLICK", occurred_at: "2026-08-01T12:00:00Z", media_cost_cents: 20000 }
