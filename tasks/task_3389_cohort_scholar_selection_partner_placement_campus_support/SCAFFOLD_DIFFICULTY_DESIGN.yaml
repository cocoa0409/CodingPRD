            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom A", nominator_id: "${np}" }, as: ProgramAdmin, captures: { na: $.data.id } }
            - { call: "POST /api/nominees/${na}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${na}", round_number: 1, leadership: 60, teamwork: 60, group_presence: 60 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${na}", round_number: 1, leadership: 60, teamwork: 60, group_presence: 60 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom B", nominator_id: "${np}" }, as: ProgramAdmin, captures: { nb: $.data.id } }
            - { call: "POST /api/nominees/${nb}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${nb}", round_number: 1, leadership: 59, teamwork: 60, group_presence: 61 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${nb}", round_number: 1, leadership: 59, teamwork: 60, group_presence: 61 }, as: Assessor, as_user_id: "assessor-b" }
          trigger:
            - { call: "POST /api/nominees/${na}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer, captures: { ast: $.data.status, ar1: $.data.round_1_score } }
            - { call: "POST /api/nominees/${nb}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer, captures: { berr: $.data.error_id } }
          assert:
            - "A advances: status == ROUND_2 with round_1_score == 600 (captured ${ast}, ${ar1}) — score == cutoff passes because the gate is >="
            - "B is rejected with error_id == ERR_CUTOFF_NOT_MET (captured ${berr}) at round_1_score == 599 (4*59+3*60+3*61 = 599, exactly one below the 600 cutoff)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_create_blocked_when_cohort_locked
        grounds:
          - state_machines.Cohort.FORMING_to_LOCKED
          - errors[ERR_COHORT_NOT_FORMING]
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair Offer -> Cohort: offer creation is legal only while the
          referenced cohort is FORMING; once the third acceptance locks the
          cohort, a perfectly eligible SELECTED nominee cannot receive an offer
          (ERR_COHORT_NOT_FORMING, state tier — which also beats the
          seats_remaining == 0 fiscal check that would otherwise fire). The
          sibling dependency (internship_blocked_by_scholar_standing) crosses
          Internship -> Scholar — a different entity pair.
