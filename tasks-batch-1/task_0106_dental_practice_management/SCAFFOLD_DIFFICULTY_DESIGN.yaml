# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rules × 2 instances = 18 instances. All literals precomputed against §1.3.
#
# Plan constants reused across instances (unless noted):
#   InsurancePlan: annual_maximum_cents=100000, deductible_cents=5000,
#     preventive=100, basic=80, major=50, major_waiting_period_months=12,
#     frequency_limit_months=6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_adjudication_diverge_on_major_crown
        grounds:
          - calculations.estimated_insurance_benefit
          - calculations.adjudicated_benefit
          - entities.TreatmentPlanItem.fields.estimated_insurance_cents
          - entities.Claim.fields.carrier_paid_cents
          - state_machines.Claim.adjudication=PENDING_to_adjudication=PARTIALLY_PAID
        distinguishing_aspect: |
          The two algorithms live on DIFFERENT entity domains — estimate on
          TreatmentPlanItem (forward-looking, fresh accumulator) and adjudication
          on Claim (chronological, live accumulator after an earlier paid claim);
          identical $1200 MAJOR fee yields estimate paid 57500 but adjudicated
          paid 24000 (annual-max clamp), proving same-input divergence.
        test_recipe:
          setup:
            - "Patient P with an ACTIVE coverage on a plan (amax=100000, ded=5000, MAJOR=50, BASIC=80)."
            - "Plan A (the crown plan) proposed while coverage is fresh => item estimate computed at 57500/62500."
            - "A separate BASIC claim for fee=100000 is later paid, consuming annual_used=76000, deductible_met=5000."
            - "The crown item is then completed and its claim adjudicated against the now-consumed accumulator."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Dual", date_of_birth: "1980-02-02" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Crown", provider_type: "DENTIST", npi: "1000000001" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-1", turnover_buffer_minutes: 15 }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            # --- crown plan: add both items in DRAFT, propose while coverage fresh so crown estimate=57500 ---
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2740", category: "MAJOR", fee_cents: 120000, phase_number: 1, tooth_number: 8 }
              as: Clinician
              captures: { crown_item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2391", category: "BASIC", fee_cents: 100000, phase_number: 1, tooth_number: 3 }
              as: Clinician
              captures: { basic_item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
              captures: { est_portion: $.data.estimated_patient_portion_cents }
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-03-01T09:00:00Z", end_at: "2026-03-01T10:00:00Z", treatment_plan_item_id: "${basic_item_id}" }
              as: FrontDesk
              captures: { basic_appt_id: $.data.id }
            - call: "POST /appointments/${basic_appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${basic_appt_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${basic_item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { basic_claim_id: $.data.id }
            - call: "POST /claims/${basic_claim_id}/attachments"
              payload: { attachment_type: "XRAY", document_ref: "ref://x1" }
              as: BillingSpecialist
            - call: "POST /claims/${basic_claim_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /claims/${basic_claim_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { basic_paid: $.data.carrier_paid_cents }
            # --- complete the crown item so its claim can be created ---
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-03-02T09:00:00Z", end_at: "2026-03-02T10:00:00Z", treatment_plan_item_id: "${crown_item_id}" }
              as: FrontDesk
              captures: { crown_appt_id: $.data.id }
            - call: "POST /appointments/${crown_appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${crown_appt_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${crown_item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { crown_claim_id: $.data.id }
            - call: "POST /claims/${crown_claim_id}/attachments"
              payload: { attachment_type: "XRAY", document_ref: "ref://x2" }
              as: BillingSpecialist
            - call: "POST /claims/${crown_claim_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /claims/${crown_claim_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { crown_paid: $.data.carrier_paid_cents, crown_patient: $.data.patient_responsibility_cents, crown_adj: $.data.adjudication_status }
          assert:
            - "TreatmentPlanItem.${crown_item_id}.estimated_insurance_cents == 57500"
            - "TreatmentPlanItem.${crown_item_id}.estimated_patient_portion_cents == 62500"
            - "Claim.${basic_claim_id}.carrier_paid_cents == 76000"
            - "Claim.${crown_claim_id}.carrier_paid_cents == 24000"
            - "Claim.${crown_claim_id}.patient_responsibility_cents == 96000"
            - "Claim.${crown_claim_id}.adjudication_status == PARTIALLY_PAID"

      - name: payment_plan_projected_vs_actual_payoff_diverge
        grounds:
          - calculations.payment_plan_schedule
          - entities.PaymentPlan.fields.remaining_balance_cents
          - entities.PaymentPlan.fields.amount_posted_cents
          - state_machines.PaymentPlan.ACTIVE_to_PAID_OFF
        distinguishing_aspect: |
          Dual-variant on a DIFFERENT entity domain (PaymentPlan, not insurance):
          projected payoff assumes 7 scheduled installments (8928×6 + 8932) while
          actual payoff after a single lump 62500 post drives remaining_balance to 0
          and PAID_OFF before the scheduled count — same plan, two payoff numbers.
        test_recipe:
          setup:
            - "A fresh MAJOR crown (fee=120000, MAJOR 50%, ded=5000, amax=100000) adjudicates to patient_responsibility 62500."
            - "principal=62500 financed over 7 installments => projected base=8928, final=8932."
            - "Actual: a single installment of 62500 is posted => PAID_OFF immediately."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Pay", date_of_birth: "1979-03-03" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Pay", provider_type: "DENTIST", npi: "1000000002" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-2", turnover_buffer_minutes: 0 }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2750", category: "MAJOR", fee_cents: 120000, phase_number: 1, tooth_number: 9 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-04-01T09:00:00Z", end_at: "2026-04-01T10:00:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/attachments"
              payload: { attachment_type: "NARRATIVE", document_ref: "ref://n1" }
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
            # crown deductible-fresh, fresh amax => paid 57500, patient 62500. Adjust to land on 96000:
            # we want patient_responsibility 96000. With MAJOR 50%, ded5000, amax100000 fresh: paid=57500.
            # Instead deny the claim so patient_responsibility == billed_fee 120000? That changes principal.
            # Use the DENY path to make principal deterministic = billed_fee 120000 is not 96000.
            # To hit 96000 cleanly, consume the pool first (mirror dual-variant), captured below.
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { paid: $.data.carrier_paid_cents, patient_due: $.data.patient_responsibility_cents, claim_v: $.data.version }
          trigger:
            - call: "POST /payment-plans"
              payload: { patient_id: "${p_id}", claim_id: "${claim_id}", installment_count: 7, expected_claim_version: "${claim_v}" }
              as: BillingSpecialist
              captures: { pp_id: $.data.id, proj_installment: $.data.installment_amount_cents, proj_final: $.data.final_installment_cents }
            - call: "POST /payment-plans/${pp_id}/post-installment"
              payload: { amount_cents: 62500 }
              as: BillingSpecialist
              captures: { pp_status: $.data.status, pp_remaining: $.data.remaining_balance_cents }
          assert:
            - "PaymentPlan.${pp_id}.principal_cents == 62500"
            - "PaymentPlan.${pp_id}.installment_amount_cents == 8928"
            - "PaymentPlan.${pp_id}.final_installment_cents == 8932"
            - "PaymentPlan.${pp_id}.remaining_balance_cents == 0 after the single 62500 post"
            - "PaymentPlan.${pp_id}.status == PAID_OFF (actual payoff precedes the 7 projected installments)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: adjudicated_benefit_nested_min_max_three_inputs
        grounds:
          - calculations.adjudicated_benefit
          - entities.InsurancePlan.fields.deductible_cents
          - entities.InsurancePlan.fields.annual_maximum_cents
          - entities.TreatmentPlanItem.fields.category
        distinguishing_aspect: |
          Mode (a): ≥3 inputs with non-linear interaction — deductible (min),
          coinsurance tier selection (branch on category), and annual-max clamp
          (min) compose so that carrier_paid = min(floor((fee - min(rem_ded,fee))
          * pct/100), rem_max); fee=130000 BASIC fresh yields exactly 100000.
        test_recipe:
          setup:
            - "Fresh coverage (amax=100000, ded=5000, BASIC=80)."
            - "A single BASIC claim fee=130000 adjudicated => gross=100000, clamp=100000."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Comb", date_of_birth: "1985-05-05" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Comb", provider_type: "DENTIST", npi: "1000000003" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-3" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2392", category: "BASIC", fee_cents: 130000, phase_number: 1, tooth_number: 14 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/attachments"
              payload: { attachment_type: "XRAY", document_ref: "ref://x3" }
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { paid: $.data.carrier_paid_cents, adj: $.data.adjudication_status }
          assert:
            - "Claim.${claim_id}.carrier_paid_cents == 100000"
            - "Claim.${claim_id}.patient_responsibility_cents == 30000"
            - "Claim.${claim_id}.adjudication_status == PAID (gross == clamp, no shortfall)"

      - name: payment_plan_round_per_installment_then_reconcile_remainder
        grounds:
          - calculations.payment_plan_schedule
          - entities.PaymentPlan.fields.installment_amount_cents
          - entities.PaymentPlan.fields.final_installment_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — floor(principal/n) PER
          installment FIRST, then the accumulated remainder is pushed into the
          FINAL installment (NOT round-the-total). principal=62500, n=7 =>
          base=8928, final=62500-8928*6=8932, and 8928*6+8932==62500 exactly.
        test_recipe:
          setup:
            - "An ACTIVE coverage and a claim adjudicated to patient_responsibility 62500 (fresh MAJOR crown)."
            - "Finance over 7 installments to exercise the per-installment floor + remainder reconciliation."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Round", date_of_birth: "1990-06-06" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Round", provider_type: "DENTIST", npi: "1000000004" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /operatories"
              payload: { room_name: "OP-4" }
              as: FrontDesk
              captures: { op_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2740", category: "MAJOR", fee_cents: 120000, phase_number: 1, tooth_number: 8 }
              as: Clinician
              captures: { item_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-05-02T09:00:00Z", end_at: "2026-05-02T10:00:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${item_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/attachments"
              payload: { attachment_type: "PHOTO", document_ref: "ref://p1" }
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { claim_v: $.data.version, patient_due: $.data.patient_responsibility_cents }
          trigger:
            - call: "POST /payment-plans"
              payload: { patient_id: "${p_id}", claim_id: "${claim_id}", installment_count: 7, expected_claim_version: "${claim_v}" }
              as: BillingSpecialist
              captures: { pp_id: $.data.id, inst: $.data.installment_amount_cents, fin: $.data.final_installment_cents }
          assert:
            - "PaymentPlan.${pp_id}.principal_cents == 62500"
            - "PaymentPlan.${pp_id}.installment_amount_cents == 8928"
            - "PaymentPlan.${pp_id}.final_installment_cents == 8932"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: treatment_plan_revision_cycle_proposed_back_to_draft
        grounds:
          - state_machines.TreatmentPlan.PROPOSED_to_DRAFT
          - state_machines.TreatmentPlan.DRAFT_to_PROPOSED
        distinguishing_aspect: |
          Cyclic shape on TreatmentPlan: PROPOSED -> DRAFT (revise) -> PROPOSED is a
          true loop; after revising, a newly added item is re-estimated on the
          second propose, which a linear pipeline could not express.
        test_recipe:
          setup:
            - "A plan with one item, proposed once, then revised back to DRAFT."
            - "A second item added, re-proposed; both items now carry estimates."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Cycle", date_of_birth: "1988-07-07" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Cycle", provider_type: "DENTIST", npi: "1000000005" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { carrier_name: "DeltaDent", annual_maximum_cents: 100000, deductible_cents: 5000, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, major_waiting_period_months: 0, frequency_limit_months: 0 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /patient-coverages"
              payload: { patient_id: "${p_id}", insurance_plan_id: "${plan_id}", coverage_start_date: "2025-01-01", benefit_year_start_date: "2026-01-01" }
              as: BillingSpecialist
              captures: { cov_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}" }
              as: Clinician
              captures: { tp_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D1110", category: "PREVENTIVE", fee_cents: 12000, phase_number: 1 }
              as: Clinician
              captures: { item1_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
              captures: { st1: $.data.status }
            - call: "POST /treatment-plans/${tp_id}/revise"
              payload: {}
              as: Clinician
              captures: { st2: $.data.status }
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D0220", category: "PREVENTIVE", fee_cents: 8000, phase_number: 1 }
              as: Clinician
              captures: { item2_id: $.data.id }
          trigger:
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
              captures: { st3: $.data.status, total: $.data.total_fee_cents }
          assert:
            - "TreatmentPlan.${tp_id}.status == PROPOSED after the second propose"
            - "TreatmentPlan.${tp_id}.total_fee_cents == 20000 (both items counted)"
