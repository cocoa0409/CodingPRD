# =============================================================================
# task_2124 — Contract Shuttle Service
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Taxonomy per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: endpoints
    instances:

      - name: create_service_contract_returns_success_envelope
        claim_type: standard_crud
        grounds:
          - endpoints[POST /service-contracts]
          - entities.ServiceContract.fields.status
          - entities.ServiceContract.fields.credit_balance_cents
        distinguishing_aspect: "POST /service-contracts returns 201 with response_type 'object', meta.api_request_id and meta.api_request_timestamp present, and data carrying a bare UUID id, version 1, status DRAFT and credit_balance_cents 0."
        test_recipe:
          setup:
            - "Empty database; logical clock untouched at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /service-contracts"
              payload: { client_name: "Envelope Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { ce1: $.data.id, ce1_v: $.data.version }
          assert:
            - "HTTP status is 201"
            - "response_type == 'object' and meta.api_request_id and meta.api_request_timestamp are present"
            - "${ce1} is a 36-character UUID with no type prefix"
            - "${ce1_v} == 1"
            - "ServiceContract.${ce1}.status == 'DRAFT'"
            - "ServiceContract.${ce1}.credit_balance_cents == 0"
            - "ServiceContract.${ce1}.branded_vehicle_count == 0 and ServiceContract.${ce1}.branded_ada_vehicle_count == 0"
            - "ServiceContract.${ce1}.predecessor_contract_id == null"

      - name: list_routes_paginates_with_total_count_and_has_more
        claim_type: standard_crud
        grounds:
          - endpoints[GET /routes]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three routes on one contract, limit 2 offset 0 returns 2 items with total_count 3 and has_more true, and limit 2 offset 2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract owning exactly three DRAFT routes."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Pagination Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cp1: $.data.id }
            - call: "POST /service-contracts/${cp1}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cp1}", name: "Route One", loop_minutes: 30, headway_minutes: 15, service_window_start_min: 420, service_window_end_min: 450, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
            - call: "POST /routes"
              payload: { contract_id: "${cp1}", name: "Route Two", loop_minutes: 30, headway_minutes: 15, service_window_start_min: 420, service_window_end_min: 450, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
            - call: "POST /routes"
              payload: { contract_id: "${cp1}", name: "Route Three", loop_minutes: 30, headway_minutes: 15, service_window_start_min: 420, service_window_end_min: 450, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
          trigger:
            - call: "GET /routes"
              payload: { contract_id: "${cp1}", limit: 2, offset: 0 }
              as: OpsPlanner
            - call: "GET /routes"
              payload: { contract_id: "${cp1}", limit: 2, offset: 2 }
              as: OpsPlanner
          assert:
            - "first response: response_type == 'array', len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second response: len(data) == 1, total_count == 3, has_more == false, offset == 2"

      - name: trips_list_is_ordered_by_scheduled_departure
        claim_type: computed_read
        grounds:
          - endpoints[GET /trips]
          - calculations.trip_generation
        distinguishing_aspect: "GET /trips for a route with headway 12 over the window 420..456 returns exactly four trips whose scheduled_departure_min values are 420, 432, 444 and 456 in that order, with scheduled_arrival_min 468, 480, 492 and 504."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with one PUBLISHED Route (loop 48, headway 12, window 420..456) published for 2026-09-02."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Ordering Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { co1: $.data.id }
            - call: "POST /service-contracts/${co1}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${co1}", name: "Ordered Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 180, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { ro1: $.data.id }
            - call: "POST /routes/${ro1}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
          trigger:
            - call: "GET /trips"
              payload: { route_id: "${ro1}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { o1: "$.data[0].scheduled_departure_min", o4: "$.data[3].scheduled_departure_min" }
          assert:
            - "total_count == 4"
            - "${o1} == 420 and ${o4} == 456"
            - "data[0].scheduled_arrival_min == 468 and data[3].scheduled_arrival_min == 504"
            - "every returned trip has dispatch_status 'SCHEDULED', settlement_status 'UNBILLED', vehicle_id null and driver_id null"
            - "every returned trip has contract_id == '${co1}' and service_date == '2026-09-02'"

  # =========================================================================
  - section: entities
    instances:

      - name: read_contract_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CONTRACT_NOT_FOUND]
          - validations[priority=50]
        distinguishing_aspect: "GET /service-contracts/{unknown uuid} returns 404 with error_id ERR_CONTRACT_NOT_FOUND inside the error envelope."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "GET /service-contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractAdmin
              captures: { e404: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${e404} == 'ERR_CONTRACT_NOT_FOUND'"
            - "response_type == 'error' and data.message is a non-empty string"

      - name: route_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=40]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /routes]
        distinguishing_aspect: "POST /routes without headway_minutes returns 400 ERR_INVALID_REQUEST and creates no Route row."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with no routes."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Missing Field Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cm1: $.data.id }
            - call: "POST /service-contracts/${cm1}/activate"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /routes"
              payload: { contract_id: "${cm1}", name: "No Headway", loop_minutes: 48, service_window_start_min: 420, service_window_end_min: 456, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { e400: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${e400} == 'ERR_INVALID_REQUEST'"
            - "GET /routes?contract_id=${cm1} -> total_count == 0"

      - name: contract_site_type_enum_value_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=40]
          - entities.ServiceContract.fields.site_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "site_type 'AIRPORT' is not a member of {HOTEL, CAMPUS, CORPORATE}, so POST /service-contracts returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /service-contracts"
              payload: { client_name: "Bad Enum", site_type: "AIRPORT", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { e_enum: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${e_enum} == 'ERR_INVALID_REQUEST'"
            - "GET /service-contracts -> total_count == 0"

      - name: vehicle_branding_contract_id_defaults_to_null
        claim_type: defaults
        grounds:
          - entities.Vehicle.fields.branding_contract_id
          - entities.Vehicle.fields.status
          - entities.Vehicle.fields.committed_block_minutes
        distinguishing_aspect: "Creating a vehicle without branding_contract_id leaves it null, status AVAILABLE and committed_block_minutes 0, and the vehicle appears in GET /vehicles filtered by status but not under any contract's branding filter."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with no branded vehicles."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Default Fleet Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cd1: $.data.id }
            - call: "POST /service-contracts/${cd1}/activate"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-2001", seat_capacity: 24, is_ada_accessible: false, odometer_km: 100, service_interval_km: 20000 }
              as: FleetManager
              captures: { vd1: $.data.id, vd1_brand: $.data.branding_contract_id }
          assert:
            - "HTTP status is 201"
            - "${vd1_brand} == null"
            - "Vehicle.${vd1}.status == 'AVAILABLE' and Vehicle.${vd1}.committed_block_minutes == 0 and Vehicle.${vd1}.version == 1"
            - "GET /vehicles?branding_contract_id=${cd1} -> total_count == 0"
            - "GET /vehicles?status=AVAILABLE -> total_count == 1"

      - name: ridership_count_rows_are_append_only_with_sequence_numbers
        claim_type: immutability
        grounds:
          - entities.RidershipCount.fields.sequence_no
          - entities.RidershipCount.fields.recorded_by_user_id
          - endpoints[POST /ridership-counts]
          - endpoints[GET /trips/{id}/ridership-counts]
        distinguishing_aspect: "RidershipCount declares common_fields false, so its rows carry id and created_at but no version and no update endpoint; two appends on the same trip receive sequence_no 1 and 2 and both remain readable."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with a PUBLISHED single-trip Route on 2026-09-02, the trip assigned, started and completed with a driver tally of 7 boardings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Append Only Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { ca1: $.data.id }
            - call: "POST /service-contracts/${ca1}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${ca1}", name: "Tally Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { ra1: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-2101", seat_capacity: 20, is_ada_accessible: false, odometer_km: 200, service_interval_km: 20000 }
              as: FleetManager
              captures: { va1: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Tally Driver", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { da1: $.data.id }
            - call: "POST /routes/${ra1}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${ra1}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { ta1: "$.data[0].id" }
            - call: "POST /trips/${ta1}/assign"
              payload: { vehicle_id: "${va1}", driver_id: "${da1}" }
              as: OpsPlanner
            - call: "POST /trips/${ta1}/start"
              payload: { actual_departure_min: 421 }
              as: DriverUser
              as_user_id: "${da1}"
            - call: "POST /trips/${ta1}/complete"
              payload: { actual_completion_min: 469, boarded: 7, alighted: 7, ada_boardings: 0 }
              as: DriverUser
              as_user_id: "${da1}"
          trigger:
            - call: "GET /trips/${ta1}/ridership-counts"
              payload: {}
              as: OpsPlanner
              captures: { rc1_seq: "$.data[0].sequence_no" }
          assert:
            - "total_count == 1"
            - "${rc1_seq} == 1"
            - "data[0].source == 'DRIVER_TALLY' and data[0].boarded == 7 and data[0].trip_id == '${ta1}'"
            - "data[0].recorded_by_user_id == '${da1}'"
            - "data[0] carries id and created_at but no version and no updated_at field"
            - "no PUT, PATCH or DELETE endpoint for RidershipCount exists anywhere in the API surface"

      - name: contract_renewal_chain_is_reachable_through_predecessor_filter
        claim_type: parent_relationships
        grounds:
          - entities.ServiceContract.fields.predecessor_contract_id
          - entities.RenewalOffer.fields.successor_contract_id
          - state_machines.ServiceContract.RENEWAL_PENDING_to_RENEWED
          - endpoints[GET /service-contracts]
        distinguishing_aspect: "Accepting a countered offer at 9100 mints a DRAFT successor whose predecessor_contract_id points back at the renewed contract, with term 2027-09-01..2028-08-31, and GET /service-contracts filtered by predecessor_contract_id returns exactly that one successor."
        test_recipe:
          setup:
            - "Logical clock at 2027-07-15T09:00:00Z."
            - "One ACTIVE ServiceContract at 9000 cents per service hour with term 2026-09-01..2027-08-31 and no APPROVED report, so the offer's proposed rate is 9315."
            - "One RenewalOffer already COUNTERED at 9100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T09:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Chain Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cc1: $.data.id }
            - call: "POST /service-contracts/${cc1}/activate"
              payload: {}
              as: ContractAdmin
              captures: { cc1_v: $.data.version }
            - call: "POST /renewal-offers"
              payload: { contract_id: "${cc1}", proposed_term_months: 12, expected_contract_version: "${cc1_v}" }
              as: ContractAdmin
              captures: { ofc: $.data.id }
            - call: "POST /renewal-offers/${ofc}/counter"
              payload: { counter_rate_cents_per_service_hour: 9100 }
              as: ClientLiaison
          trigger:
            - call: "POST /renewal-offers/${ofc}/respond"
              payload: { decision: "ACCEPT" }
              as: ContractAdmin
              captures: { succ: $.data.successor_contract_id, agreed: $.data.agreed_rate_cents_per_service_hour }
          assert:
            - "${agreed} == 9100"
            - "RenewalOffer.${ofc}.status == 'ACCEPTED'"
            - "GET /service-contracts/${cc1} -> ServiceContract.status == 'RENEWED'"
            - "GET /service-contracts/${succ} -> ServiceContract.status == 'DRAFT' and base_rate_cents_per_service_hour == 9100"
            - "GET /service-contracts/${succ} -> ServiceContract.predecessor_contract_id == '${cc1}'"
            - "GET /service-contracts/${succ} -> ServiceContract.term_start_date == '2027-09-01' and term_end_date == '2028-08-31'"
            - "GET /service-contracts?predecessor_contract_id=${cc1} -> total_count == 1 and data[0].id == '${succ}'"
            - "GET /renewal-offers?successor_contract_id=${succ} -> total_count == 1 and data[0].id == '${ofc}'"

      - name: branded_fleet_counters_recompute_on_brand
        claim_type: computed_fields
        grounds:
          - entities.ServiceContract.fields.branded_vehicle_count
          - entities.ServiceContract.fields.branded_ada_vehicle_count
          - endpoints[POST /vehicles/{id}/brand]
          - validations[priority=86]
        distinguishing_aspect: "After branding one ADA and one non-ADA vehicle onto a contract whose ada_min_accessible_pct is 50.00, branded_vehicle_count is 2 and branded_ada_vehicle_count is 1, which is exactly the 50.00 floor and therefore accepted."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with ada_min_accessible_pct 50.00 and no branded vehicles."
            - "One ADA-accessible vehicle already branded to that contract at creation time."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "ADA Floor Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 50.00 }
              as: ContractAdmin
              captures: { cf1: $.data.id }
            - call: "POST /service-contracts/${cf1}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-2201", seat_capacity: 20, is_ada_accessible: true, odometer_km: 300, service_interval_km: 20000, branding_contract_id: "${cf1}" }
              as: FleetManager
              captures: { vf1: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-2202", seat_capacity: 20, is_ada_accessible: false, odometer_km: 400, service_interval_km: 20000 }
              as: FleetManager
              captures: { vf2: $.data.id }
          trigger:
            - call: "POST /vehicles/${vf2}/brand"
              payload: { branding_contract_id: "${cf1}" }
              as: FleetManager
              captures: { vf2_brand: $.data.branding_contract_id }
          assert:
            - "${vf2_brand} == '${cf1}'"
            - "GET /service-contracts/${cf1} -> ServiceContract.branded_vehicle_count == 2"
            - "GET /service-contracts/${cf1} -> ServiceContract.branded_ada_vehicle_count == 1"
            - "GET /vehicles?branding_contract_id=${cf1} -> total_count == 2"

  # =========================================================================
  - section: state_machines
    instances:

      - name: activate_an_active_contract_returns_contract_not_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.ServiceContract.DRAFT_to_ACTIVE
          - errors[ERR_CONTRACT_NOT_DRAFT]
          - validations[priority=60]
        distinguishing_aspect: "The second activate observes status ACTIVE and is rejected with 409 ERR_CONTRACT_NOT_DRAFT; the contract's version does not advance a second time."
        test_recipe:
          setup:
            - "One ServiceContract already activated once, sitting at status ACTIVE with version 2."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Double Activate", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cv1: $.data.id }
            - call: "POST /service-contracts/${cv1}/activate"
              payload: {}
              as: ContractAdmin
              captures: { cv1_v: $.data.version }
          trigger:
            - call: "POST /service-contracts/${cv1}/activate"
              payload: {}
              as: ContractAdmin
              captures: { e_act: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${e_act} == 'ERR_CONTRACT_NOT_DRAFT'"
            - "${cv1_v} == 2"
            - "GET /service-contracts/${cv1} -> ServiceContract.version == 2 and ServiceContract.status == 'ACTIVE'"

      - name: publish_a_published_route_returns_route_not_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.Route.DRAFT_to_PUBLISHED
          - errors[ERR_ROUTE_NOT_DRAFT]
        distinguishing_aspect: "A second publish on an already PUBLISHED route returns 409 ERR_ROUTE_NOT_DRAFT and does not generate a second set of trips, so the trip count stays 2."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with one PUBLISHED Route (window 420..432, headway 12) holding exactly two trips for 2026-09-02."
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { client_name: "Double Publish", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cv2: $.data.id }
            - call: "POST /service-contracts/${cv2}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
