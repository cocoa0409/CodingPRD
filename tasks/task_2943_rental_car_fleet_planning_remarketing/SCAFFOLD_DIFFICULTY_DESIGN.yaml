      - name: redistribution_reject_repropose_cycle_capped_at_three_revisions
        grounds:
          - state_machines[RedistributionOrder]
          - entities.RedistributionOrder.fields.revision_count
          - errors.ERR_REVISION_LIMIT_REACHED
          - endpoints[POST /fleet/redistribution-orders/{order_id}/propose]
          - endpoints[POST /fleet/redistribution-orders/{order_id}/reject]
        distinguishing_aspect: |
          Where the previous instance is about two dimensions moving independently, this one
          is about a single dimension that RE-ENTERS a state it has already left: the
          PROPOSED -> REJECTED -> PROPOSED loop is legal but bounded, and the counter only
          advances on the re-entry edge (the first DRAFT -> PROPOSED leaves revision_count
          at 0). The fourth proposal is refused with ERR_REVISION_LIMIT_REACHED while the
          order stays parked in REJECTED rather than moving to a dead state.
