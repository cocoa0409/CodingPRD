            - "priority 45 on order A: 0 + 95380 <= 100000, so the order is admitted"
            - "${tl_mid_exposure} == 95380, ${tl_mid_util} == 95.38 and ${tl_mid_status} == WATCH — WATCH is a warning, not a block"
            - "order B: HTTP 402 with ${tl_b_err} == ERR_CREDIT_LIMIT_EXCEEDED, not ERR_BREWER_CREDIT_HOLD — priority 44 passed because the brewer is WATCH"
