  # =========================================================================
  # §0.5 Rule 8 — Resource / temporal overlap with contrasting interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: production_window_is_half_open_so_adjacency_is_accepted
        grounds:
          - validations.priority_29_ERR_PRODUCTION_WINDOW_OVERLAP
          - entities.VendorDataRequest.fields.issued_at
          - entities.VendorDataRequest.fields.due_at
          - endpoints.POST_parity_vendor_requests
        distinguishing_aspect: |
          Resource: the (administrator_id, plan_year_id) production window on VendorDataRequest.
          Interval semantics: HALF-OPEN [issued_at, due_at) with NO buffer, so a request issued one day
          before the incumbent's due_at collides while a request issued at exactly due_at is accepted.
          This is the opposite convention from the measurement-period rule below.
        test_recipe:
          setup:
            - "One Administrator with contractual_production_days 45 and one OPEN PlanYear."
            - "One VendorDataRequest issued at the default clock 2026-08-01T00:00:00Z, left OPEN, occupying [2026-08-01T00:00:00.000Z, 2026-09-15T00:00:00.000Z)."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr1_id: $.data.id, vr1_due: $.data.due_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 1, requested_submission_types: ["NETWORK_COMPOSITION"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 1, requested_submission_types: ["NETWORK_COMPOSITION"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr2_id: $.data.id }
          assert:
            - "VendorDataRequest.${vr1_id}.issued_at == 2026-08-01T00:00:00.000Z and due_at == 2026-09-15T00:00:00.000Z and regulatory_due_at == 2026-08-31T00:00:00.000Z"
            - "the request issued at 2026-09-14 -> 409 ERR_PRODUCTION_WINDOW_OVERLAP (2026-09-14 < 2026-09-15, the windows intersect)"
            - "the request issued at exactly 2026-09-15T00:00:00Z -> 201 (the incumbent window excludes its own due_at)"
            - "VendorDataRequest.${vr2_id}.issued_at == 2026-09-15T00:00:00.000Z and due_at == 2026-10-30T00:00:00.000Z and regulatory_due_at == 2026-10-15T00:00:00.000Z"
            - "Administrator.${adm_id}.outstanding_request_count == 2 and late_request_count == 1 (only vr1 is past its due_at)"
            - "Administrator.${adm_id}.cooperation_score == 85.00 and cooperation_status == COOPERATIVE"

      - name: measurement_period_is_closed_with_a_one_day_buffer_so_adjacency_is_rejected
        grounds:
          - validations.priority_28_ERR_MEASUREMENT_PERIOD_OVERLAP
          - entities.BenefitClassification.fields.measurement_period_start
          - entities.BenefitClassification.fields.measurement_period_end
          - endpoints.POST_parity_plan_years_id_classifications
        distinguishing_aspect: |
          A different resource entity (BenefitClassification, keyed on
          plan_year_id + benefit_category + network_tier + sub_classification) with deliberately
          opposite interval semantics: CLOSED [start, end] plus a mandatory 1-day separation, so a
          period beginning the very next day after the incumbent's end is REJECTED and only a two-day
          gap is accepted. One shared overlap helper cannot satisfy both this instance and the
          half-open production window above.
        test_recipe:
          setup:
            - "One Administrator and one OPEN PlanYear."
            - "One OUTPATIENT / IN_NETWORK / ALL_OTHER_OUTPATIENT classification covering 2026-01-01..2026-06-30."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "ALL_OTHER_OUTPATIENT", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_1_id: $.data.id }
          trigger:
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "ALL_OTHER_OUTPATIENT", measurement_period_start: "2026-07-01", measurement_period_end: "2026-12-31", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "ALL_OTHER_OUTPATIENT", measurement_period_start: "2026-07-02", measurement_period_end: "2026-12-31", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_2_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "OUT_OF_NETWORK", sub_classification: "ALL_OTHER_OUTPATIENT", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_3_id: $.data.id }
          assert:
            - "the 2026-07-01 period -> 409 ERR_MEASUREMENT_PERIOD_OVERLAP (adjacent with a zero-day gap fails the 1-day buffer, unlike the production window)"
            - "the 2026-07-02 period -> 201; BenefitClassification.${cls_2_id}.measurement_period_start == 2026-07-02"
            - "the identical 2026-01-01..2026-06-30 period on OUT_OF_NETWORK -> 201; the rule is scoped to the tier, so ${cls_3_id} coexists with ${cls_1_id}"
            - "GET /parity/plan-years/${py_id}/classifications returns exactly 3 rows"
            - "a period 2026-06-30..2026-06-30 on IN_NETWORK / ALL_OTHER_OUTPATIENT -> 409 ERR_MEASUREMENT_PERIOD_OVERLAP (a single-day period inside the incumbent still collides)"

  # =========================================================================
  # §0.5 Rule 9 — Compensating invariants
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: approve_then_abandon_returns_plan_year_liability_to_zero_with_no_drift
        grounds:
          - calculations.remediation_liability_cents
          - state_machines.CorrectiveActionPlan.APPROVED_to_ABANDONED
          - entities.PlanYear.fields.remediation_liability_cents
          - entities.NqtlItem.fields.status
        distinguishing_aspect: |
          Conserved quantity: PlanYear.remediation_liability_cents, a money ledger in whole cents.
          APPROVED adds the plan's frozen amount and ABANDONED subtracts exactly the same frozen
          amount, so the round trip returns the plan year to 0 even though the raw product was
          1655432.50 and was rounded on the way in. The compensation is partial by design: the item
          stays in VIOLATION and the participant notice is not withdrawn, so an implementation that
          "undoes everything" is also caught.
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear with cap 5000000 and covered_participant_count 1200, one classification."
            - "One PRIOR_AUTHORIZATION NqtlItem applied_to MENTAL_HEALTH_SUD_ONLY driven to VIOLATION by user-officer-01 (disparity_ratio 3.0000, stringency index 10.00)."
            - "One DRAFT CorrectiveActionPlan, DESIGN_CHANGE, 1327 claims x 4990 cents -> 1655433 cents frozen."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Prior authorization required for outpatient MH/SUD office visits only." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 300, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_v: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_v}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { py_v: $.data.version }
            - call: "POST /parity/nqtl-items/${item_id}/determinations"
              payload: { outcome: "VIOLATION", rationale: "Outpatient MH/SUD prior authorization denies at three times the comparable medical/surgical rate.", expected_plan_year_version: "${py_v}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "POST /parity/corrective-action-plans"
              payload: { nqtl_item_id: "${item_id}", remedy_type: "DESIGN_CHANGE", affected_claims_count: 1327, average_claim_cents: 4990, target_completion_date: "2026-12-31" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cap_id: $.data.id }
          trigger:
            - call: "POST /parity/corrective-action-plans/${cap_id}/decision"
              payload: { outcome: "APPROVED", decision_note: "Design change approved by an independent officer." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { liab_after_approve: $.data.remediation_liability_cents }
            - call: "POST /parity/corrective-action-plans/${cap_id}/closure"
              payload: { outcome: "ABANDONED", closure_note: "The design change was withdrawn before implementation; a replacement plan will be filed." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
          assert:
            - "before the approval: PlanYear.${py_id}.remediation_liability_cents == 0"
            - "after the approval: PlanYear.${py_id}.remediation_liability_cents == 1655433 and CorrectiveActionPlan.${cap_id}.status == APPROVED"
            - "after the abandonment: PlanYear.${py_id}.remediation_liability_cents == 0 exactly (not 1 cent, not -1 cent)"
            - "CorrectiveActionPlan.${cap_id}.status == ABANDONED and reprocessing_liability_cents is still 1655433 (frozen at creation)"
            - "NqtlItem.${item_id}.status is still VIOLATION (abandonment remedies nothing) and PlanYear.${py_id}.open_violation_count == 1"
            - "GET /parity/nqtl-items/${item_id}/participant-notices still returns exactly 1 row, notice_type VIOLATION_DISCLOSURE (the disclosure is append-only and is not retracted)"
            - "PlanYear.${py_id}.compliance_posture == VIOLATION and status == REMEDIATION"

      - name: production_returns_administrator_lateness_counters_to_their_baseline
        grounds:
          - calculations.administrator_cooperation_score
          - entities.Administrator.fields.outstanding_request_count
          - entities.Administrator.fields.late_request_count
          - state_machines.VendorDataRequest.fulfillment_OPEN_to_FULFILLED
          - calculations.plan_year_compliance_posture
        distinguishing_aspect: |
          A different conserved quantity — the Administrator's lateness counters and the cooperation
          score derived from them, not a money ledger. The clock alone drives late_request_count 0 -> 1
          and cooperation_score 100.00 -> 85.00; the fulfilling submission drives both back to their
          baseline without the clock ever moving backwards, because late counting is defined over
          {OPEN, PARTIAL} rows only. The invariant is restored by a forward action, not by an undo.
        test_recipe:
          setup:
            - "One Administrator with contractual_production_days 45, one OPEN PlanYear with no NqtlItem, one classification."
            - "One VendorDataRequest issued at the default clock 2026-08-01T00:00:00Z with requested_item_count 1 and requested_submission_types [DENIAL_RATES] (due_at 2026-09-15T00:00:00.000Z)."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "PRESCRIPTION_DRUGS", network_tier: "NOT_APPLICABLE", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/administrators/${adm_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { score_late: $.data.cooperation_score, late_late: $.data.late_request_count }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 137, mh_adjudicated_claims: 1919, ms_denials: 71, ms_adjudicated_claims: 1913 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /parity/administrators/${adm_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { score_final: $.data.cooperation_score, late_final: $.data.late_request_count }
          assert:
            - "baseline at the default clock: Administrator.${adm_id}.outstanding_request_count == 1, late_request_count == 0, cooperation_score == 100.00, cooperation_status == COOPERATIVE"
            - "after the clock move alone: late_request_count == 1 and cooperation_score == 85.00 with no vendor action at all"
            - "after the fulfilling submission: outstanding_request_count == 0, late_request_count == 0, cooperation_score == 100.00 exactly, cooperation_status == COOPERATIVE"
            - "Administrator.${adm_id}.regulatory_basis_cooperation_score == 100.00 (the regulatory variant is restored by the same rule, from 85.00)"
            - "Administrator.${adm_id}.breach_count == 0 and VendorDataRequest.${vr_id}.fulfillment_status == FULFILLED with escalation_status NONE"
            - "VendorDataRequest.${vr_id}.is_overdue == false once fulfilled"
            - "PlanYear.${py_id}.compliance_posture == COMPLIANT throughout (the administrator never left COOPERATIVE, so the posture ladder never reached AT_RISK)"
