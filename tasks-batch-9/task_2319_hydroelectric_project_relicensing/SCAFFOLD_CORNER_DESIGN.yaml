              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj_b}", plan_title: "Plan B" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan_b: $.data.id }
          trigger:
            - call: "POST /relicensing/comments"
              payload: { study_plan_id: "${plan_b}", party_id: "${pa}", resource_category: "FISH_PASSAGE", comment_text: "comment from a foreign party", is_mandatory_condition: true }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { err_foreign: $.data.error_id }
            - call: "GET /relicensing/projects/${proj_b}"
              payload: {}
              as: Regulator
              captures: { mand_b: $.data.unresolved_mandatory_comment_count, posture_b: $.data.regulatory_posture }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj_b}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { pb: $.data.id }
            - call: "POST /relicensing/comments"
              payload: { study_plan_id: "${plan_b}", party_id: "${pb}", resource_category: "FISH_PASSAGE", comment_text: "comment from the registered party", is_mandatory_condition: true }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { cmt: $.data.id, mand: $.data.is_mandatory_condition }
            - call: "GET /relicensing/projects/${proj_b}"
              payload: {}
              as: Regulator
              captures: { mand_b2: $.data.unresolved_mandatory_comment_count, posture_b2: $.data.regulatory_posture }
          assert:
            - "${err_foreign} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${mand_b} == 0 and ${posture_b} == OPEN (the rejected comment changed no counter)"
            - "the second comment returns HTTP 201 with ${mand} == true"
            - "${mand_b2} == 1 and ${posture_b2} == RESTRICTED"

      - name: same_user_cannot_price_the_measure_it_created
        claim_type: segregation_of_duties
        grounds:
          - roles.Licensee.restrictions
          - validations[priority=67]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The definitive estimate is a four-eyes step keyed on PmeMeasure.created_by_user_id, so the creating licensee user is rejected while a different licensee user succeeds and both cost and generation figures switch variant in that one call."
        test_recipe:
          setup:
            - "Project P-9054 with the PAD filed in 2026 and one LICENSEE_PROPOSED WATER_QUALITY measure created by u_lic_a (capital 600000.00, om 20000.00, construction_start_year 2026, flow 40, head 60, days 120)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9054", project_name: "Four Eyes Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
