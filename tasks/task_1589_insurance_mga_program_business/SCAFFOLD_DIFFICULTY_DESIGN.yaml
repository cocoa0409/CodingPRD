            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/audits", payload: { scope: "FULL", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-15T00:00:00Z" }, as: CarrierAuditor, captures: { audA: $.data.id } }
          trigger:
