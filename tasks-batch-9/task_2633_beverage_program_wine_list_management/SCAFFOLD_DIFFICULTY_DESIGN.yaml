# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2633 — Beverage Program & Wine List Management
# 9 rule_id blocks x 2 instances = 18 instances.
# Every numeric literal in an `assert:` was computed by executing the referenced
# §1.3 formula (and its constants) as code before being written here.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fifo_vs_weighted_average_event_settlement_cogs
        grounds:
          - calculations.lot_depletion_cogs
          - calculations.event_settlement_draw
          - entities.Venue.fields.costing_method
          - entities.InventoryLot.fields.unit_cost_cents
          - entities.WineDinnerEvent.fields.settled_cogs_cents
          - state_machines.WineDinnerEvent.CONFIRMED_to_SETTLED
          - state_machines.InventoryLot.ON_HAND_to_DEPLETED
        distinguishing_aspect: |
          Two venues holding byte-identical lot chains (6 bottles at 3000 cents received 2026-08-10,
          6 bottles at 5000 cents received 2026-08-20) settle byte-identical 24-seat events, and the
          FIFO venue books settled_cogs_cents 28000 while the WEIGHTED_AVERAGE venue books 32000 — a
          4000-cent divergence produced solely by Venue.costing_method, with the physical draw order
          (lot 1 emptied, then 2 bottles from lot 2) identical in both venues.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with costing_method FIFO and Venue SUM with costing_method WEIGHTED_AVERAGE, both with RED COGS target 28.0 and event_cogs_target_pct 28.0."
            - "Each venue has one CELLAR bin of capacity 48 and two ON_HAND lots of the same RED wine: 6 bottles at 3000 cents received 2026-08-10 and 6 bottles at 5000 cents received 2026-08-20."
            - "Each venue has a PUBLISHED ListVersion carrying one bottle-only ListEntry for that wine."
            - "Each venue has a CONFIRMED 24-seat WineDinnerEvent whose pour_plan asks 2 pours per seat of that entry, priced at final_ticket_price_cents 3000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, costing_method: "FIFO", event_cogs_target_pct: 28.0, corkage_fee_cents: 3500, corkage_waiver_purchase_ratio: 2, byo_bottle_limit_per_party: 2, byo_prohibited_categories: ["SPARKLING"], priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v_fifo_id: $.data.id }
            - call: "POST /beverage-program/venues"
              payload: { name: "Summit Grill", venue_code: "SUM", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, costing_method: "WEIGHTED_AVERAGE", event_cogs_target_pct: 28.0, corkage_fee_cents: 3500, corkage_waiver_purchase_ratio: 2, byo_bottle_limit_per_party: 2, byo_prohibited_categories: ["SPARKLING"], priority_rank: 2 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v_wac_id: $.data.id }
            - call: "POST /beverage-program/venues/${v_fifo_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v_fifo_id}"
              captures: { bin_fifo_id: $.data.id }
            - call: "POST /beverage-program/venues/${v_wac_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v_wac_id}"
              captures: { bin_wac_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_red_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v_fifo_id}", wine_id: "${w_red_id}", bin_id: "${bin_fifo_id}", bottles_received: 6, unit_cost_cents: 3000, received_at: "2026-08-10T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v_fifo_id}"
              captures: { lot_f1_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v_fifo_id}", wine_id: "${w_red_id}", bin_id: "${bin_fifo_id}", bottles_received: 6, unit_cost_cents: 5000, received_at: "2026-08-20T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v_fifo_id}"
              captures: { lot_f2_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v_wac_id}", wine_id: "${w_red_id}", bin_id: "${bin_wac_id}", bottles_received: 6, unit_cost_cents: 3000, received_at: "2026-08-10T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v_wac_id}"
              captures: { lot_w1_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v_wac_id}", wine_id: "${w_red_id}", bin_id: "${bin_wac_id}", bottles_received: 6, unit_cost_cents: 5000, received_at: "2026-08-20T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v_wac_id}"
              captures: { lot_w2_id: $.data.id }
            - call: "POST /beverage-program/venues/${v_fifo_id}/wine-lists"
              payload: { name: "Dinner List" }
              as: VenueSommelier
              as_user_id: "${v_fifo_id}"
              captures: { wl_f_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_f_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v_fifo_id}"
              captures: { lv_f_id: $.data.id, lv_f_v: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_f_id}/entries"
              payload: { wine_id: "${w_red_id}", sort_rank: 1, expected_list_version_version: "${lv_f_v}", by_the_glass: false, par_bottles: 6, tasting_note: "Cassis, graphite, long finish.", education_verified: true }
              as: VenueSommelier
              as_user_id: "${v_fifo_id}"
              captures: { e_f_id: $.data.id }
            - call: "POST /beverage-program/list-versions/${lv_f_id}/submit"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v_fifo_id}"
            - call: "POST /beverage-program/list-versions/${lv_f_id}/publish"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues/${v_wac_id}/wine-lists"
              payload: { name: "Dinner List" }
              as: VenueSommelier
              as_user_id: "${v_wac_id}"
              captures: { wl_w_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_w_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v_wac_id}"
              captures: { lv_w_id: $.data.id, lv_w_v: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_w_id}/entries"
              payload: { wine_id: "${w_red_id}", sort_rank: 1, expected_list_version_version: "${lv_w_v}", by_the_glass: false, par_bottles: 6, tasting_note: "Cassis, graphite, long finish.", education_verified: true }
              as: VenueSommelier
              as_user_id: "${v_wac_id}"
              captures: { e_w_id: $.data.id }
            - call: "POST /beverage-program/list-versions/${lv_w_id}/submit"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v_wac_id}"
            - call: "POST /beverage-program/list-versions/${lv_w_id}/publish"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/wine-dinner-events"
              payload: { venue_id: "${v_fifo_id}", list_version_id: "${lv_f_id}", name: "Cabernet Dinner", starts_at: "2026-10-10T18:00:00Z", ends_at: "2026-10-10T21:00:00Z", seat_count: 24, pour_plan: [{ list_entry_id: "${e_f_id}", pours_per_seat: 2 }] }
              as: VenueSommelier
              as_user_id: "${v_fifo_id}"
              captures: { ev_f_id: $.data.id }
            - call: "POST /beverage-program/wine-dinner-events/${ev_f_id}/price"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v_fifo_id}"
            - call: "POST /beverage-program/wine-dinner-events/${ev_f_id}/confirm"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/wine-dinner-events"
              payload: { venue_id: "${v_wac_id}", list_version_id: "${lv_w_id}", name: "Cabernet Dinner", starts_at: "2026-10-10T18:00:00Z", ends_at: "2026-10-10T21:00:00Z", seat_count: 24, pour_plan: [{ list_entry_id: "${e_w_id}", pours_per_seat: 2 }] }
              as: VenueSommelier
              as_user_id: "${v_wac_id}"
              captures: { ev_w_id: $.data.id }
            - call: "POST /beverage-program/wine-dinner-events/${ev_w_id}/price"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v_wac_id}"
            - call: "POST /beverage-program/wine-dinner-events/${ev_w_id}/confirm"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
          trigger:
            - call: "POST /beverage-program/wine-dinner-events/${ev_f_id}/settle"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /beverage-program/wine-dinner-events/${ev_w_id}/settle"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
          assert:
            - "WineDinnerEvent.${ev_f_id}.final_ticket_price_cents == 3000 and WineDinnerEvent.${ev_w_id}.final_ticket_price_cents == 3000"
            - "WineDinnerEvent.${ev_f_id}.settled_cogs_cents == 28000"
            - "WineDinnerEvent.${ev_w_id}.settled_cogs_cents == 32000"
            - "WineDinnerEvent.${ev_w_id}.settled_cogs_cents - WineDinnerEvent.${ev_f_id}.settled_cogs_cents == 4000"
            - "WineDinnerEvent.${ev_f_id}.settled_revenue_cents == 72000 and WineDinnerEvent.${ev_w_id}.settled_revenue_cents == 72000"
            - "Venue.${v_fifo_id}.cogs_ledger_cents == 28000 and Venue.${v_fifo_id}.revenue_ledger_cents == 72000"
            - "Venue.${v_wac_id}.cogs_ledger_cents == 32000 and Venue.${v_wac_id}.revenue_ledger_cents == 72000"
            - "InventoryLot.${lot_f1_id}.bottles_on_hand == 0 and InventoryLot.${lot_f1_id}.state == DEPLETED"
            - "InventoryLot.${lot_f2_id}.bottles_on_hand == 4 and InventoryLot.${lot_f2_id}.state == ON_HAND"
            - "InventoryLot.${lot_w1_id}.bottles_on_hand == 0 and InventoryLot.${lot_w2_id}.bottles_on_hand == 4"
            - "GET /beverage-program/depletion-entries?event_id=${ev_f_id} returns exactly 2 entries with reason EVENT and cogs_cents 18000 and 10000"
            - "GET /beverage-program/depletion-entries?event_id=${ev_w_id} returns exactly 2 entries with reason EVENT and cogs_cents 24000 and 8000 (6 and 2 bottles both costed at the blended 4000-cent unit)"
      - name: actual_vs_theoretical_pour_cost_variance
        grounds:
          - calculations.venue_pour_cost_variance
          - calculations.btg_close_cost_split
          - entities.Venue.fields.last_variance_pct
          - entities.Venue.fields.program_posture
          - entities.DepletionEntry.fields.reason
          - state_machines.BtgSlot.OPEN_to_CLOSED
          - validations[priority=63]
        distinguishing_aspect: |
          One identical DepletionEntry population yields ACTUAL 33.39% (all reasons: 4800 cogs over
          14375 revenue) and THEORETICAL 27.83% (sale reasons only: 4000 cogs over the same 14375
          revenue), because the single STAFF_EDUCATION entry contributes 800 cents of cost and zero
          revenue; the 5.56-point spread is what drives Venue.program_posture to RESTRICTED and opens
          a VarianceInvestigation — a different entity domain (Venue percentages) from the FIFO/WAC
          instance's per-lot monetary costing.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB, RED COGS target 28.0, program_posture OPEN, both ledgers 0."
            - "One CELLAR bin of capacity 48 and one ON_HAND lot of 12 RED bottles at 2400 cents each, received 2026-08-10."
            - "A PUBLISHED ListVersion with one by-the-glass ListEntry at pour_size_ml 177, so effective_pours is 3 and glass_price_cents is 2875."
            - "Two BtgSlots on that entry have been closed on 2026-09-01T12:00:00Z: slot 1 with 3 pours sold and no education pours, slot 2 with 2 pours sold and 1 education pour."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, costing_method: "FIFO", event_cogs_target_pct: 28.0, corkage_fee_cents: 3500, corkage_waiver_purchase_ratio: 2, byo_bottle_limit_per_party: 2, byo_prohibited_categories: ["SPARKLING"], priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_red_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "${w_red_id}", bin_id: "${bin_id}", bottles_received: 12, unit_cost_cents: 2400, received_at: "2026-08-10T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/wine-lists"
              payload: { name: "By The Glass" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_id: $.data.id, lv_v: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_red_id}", sort_rank: 1, expected_list_version_version: "${lv_v}", by_the_glass: true, pour_size_ml: 177, par_bottles: 6, tasting_note: "Cassis and graphite.", education_verified: false }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /beverage-program/list-versions/${lv_id}/submit"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/list-versions/${lv_id}/publish"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/btg-slots"
              payload: { venue_id: "${v1_id}", list_entry_id: "${e1_id}", lot_id: "${lot1_id}", slot_index: 1, preservation_method: "ARGON" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /beverage-program/btg-slots/${s1_id}/close"
              payload: { pours_sold: 3, staff_education_pours: 0 }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/btg-slots"
              payload: { venue_id: "${v1_id}", list_entry_id: "${e1_id}", lot_id: "${lot1_id}", slot_index: 2, preservation_method: "ARGON" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /beverage-program/btg-slots/${s2_id}/close"
              payload: { pours_sold: 2, staff_education_pours: 1 }
              as: VenueSommelier
              as_user_id: "${v1_id}"
          trigger:
            - call: "POST /beverage-program/venues/${v1_id}/pour-cost-runs"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "GET /beverage-program/venues/${v1_id}/pour-cost-report"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
          assert:
            - "ListEntry.${e1_id}.effective_pours == 3 and ListEntry.${e1_id}.glass_price_cents == 2875"
            - "pour-cost-report.actual_cogs_cents == 4800 and pour-cost-report.actual_revenue_cents == 14375"
            - "pour-cost-report.theoretical_cogs_cents == 4000 and pour-cost-report.theoretical_revenue_cents == 14375"
            - "pour-cost-report.actual_pour_cost_pct == 33.39"
            - "pour-cost-report.theoretical_pour_cost_pct == 27.83"
            - "pour-cost-report.variance_pct == 5.56 and pour-cost-report.entry_count == 3"
            - "Venue.${v1_id}.last_variance_pct == 5.56"
            - "Venue.${v1_id}.program_posture == RESTRICTED"
            - "Venue.${v1_id}.last_pour_cost_run_at == 2026-09-01T12:00:00Z"
            - "Venue.${v1_id}.cogs_ledger_cents == 4800 and Venue.${v1_id}.revenue_ledger_cents == 14375"
            - "GET /beverage-program/variance-investigations?venue_id=${v1_id} returns exactly 1 row in state OPEN with triggered_variance_pct == 5.56, period_start 2026-09-01T00:00:00Z and period_end 2026-09-02T00:00:00Z"
            - "GET /beverage-program/depletion-entries?list_entry_id=${e1_id} returns exactly 3 entries: SALE_BTG 3 pours / 2400 cogs / 8625 revenue, SALE_BTG 2 pours / 1600 cogs / 5750 revenue, STAFF_EDUCATION 1 pour / 800 cogs / 0 revenue"
            - "ListEntry.${e1_id}.contest_points == 5.00 (margin_factor clamps to 0.0 because realized 33.39% exceeds the 28.0 target)"
            - "InventoryLot.${lot1_id}.bottles_on_hand == 10 and InventoryLot.${lot1_id}.bottles_committed == 0 and InventoryLot.${lot1_id}.state == ON_HAND"
  - rule_id: combinatorial_formula
    instances:
      - name: allocation_waterfall_floor_then_remainder_priority_tiebreak
        grounds:
          - calculations.allocation_waterfall_grant
          - entities.AllocationClaim.fields.raw_share
          - entities.AllocationClaim.fields.remainder_awarded
          - entities.Venue.fields.priority_rank
          - state_machines.AllocationOffer.fulfillment_OPEN_to_ALLOCATED
          - state_machines.AllocationClaim.REQUESTED_to_GRANTED
          - state_machines.AllocationClaim.REQUESTED_to_PARTIALLY_GRANTED
          - concurrency_rules[claim-create-stale-offer]
        distinguishing_aspect: |
          MODE (b) nested rounding with a pinned order: 10 bottles against four 3-bottle claims give
          raw_share 2.5000 to every claim, so flooring first yields base 2 each and a remainder of 2,
          which the pinned frac DESC -> priority_rank ASC -> created_at ASC pass hands to the rank-1
          and rank-2 venues, producing the vector 3,3,2,2 with unallocated_bottles 0; the plausible
          "round_half_up each raw share then sum" reading returns 3,3,3,3 and over-allocates 12 of 10
          bottles.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Four venues with priority_rank 1, 2, 3 and 4 respectively."
            - "One Distributor whose compliance_state is CLEARED."
            - "One AllocationOffer of 10 bottles at 4500 cents each with response_deadline 2026-09-30T00:00:00Z, fulfillment_state OPEN and compliance_state CLEARED."
            - "Four AllocationClaims in state REQUESTED, one per venue, each requesting exactly 3 bottles, created in priority_rank order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Venue One", venue_code: "V1", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues"
              payload: { name: "Venue Two", venue_code: "V2", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 2 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v2_id: $.data.id }
            - call: "POST /beverage-program/venues"
              payload: { name: "Venue Three", venue_code: "V3", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 3 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v3_id: $.data.id }
            - call: "POST /beverage-program/venues"
              payload: { name: "Venue Four", venue_code: "V4", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 4 }
              as: BeverageDirector
              as_user_id: "bd-001"
