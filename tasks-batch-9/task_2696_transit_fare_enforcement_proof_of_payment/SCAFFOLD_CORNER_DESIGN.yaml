              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-encounters"
              payload: { deployment_id: "${d1}", inspector_id: "${i1}", rider_id: "${r1}", occurred_at: "2026-08-05T07:00:00Z", fare_media_type: "NONE", identity_capture_method: "GOVT_ID" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { e1: $.data.id }
            - call: "POST /citations"
              payload: { encounter_id: "${e1}" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /payment-plans"
              payload: { citation_id: "${c1}", installment_count: 3, down_payment_cents: 1000, expected_citation_version: "${cv1}" }
              as: Rider
              as_user_id: "${r1}"
              captures: { pp1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T09:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /payment-plans/${pp1}/assess-delinquency"
              payload: {}
              as: EnforcementPlanner
          assert:
            - "PaymentPlan.${pp1}.first_due_at == 2026-09-04T09:00:00Z and financed_cents == 8720"
            - "PaymentPlan.${pp1}.installments_paid_count == 0 (the down payment is not a PLAN_INSTALLMENT)"
            - "after assess-delinquency: PaymentPlan.${pp1}.missed_installment_count == 2 and status == DEFAULTED"
            - "Citation.${c1}.settlement_status == OUTSTANDING (back from PLAN_ACTIVE)"
            - "Citation.${c1}.outstanding_balance_cents == 8720 (the 1000 down payment still counts)"

      - name: offense_sequence_variant_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: offense_sequence_variants_diverge_on_prior_warning
          rationale: "The variant-divergence claim for citation_offense_sequence (same rider data, warning_inclusive returns 2 while citation_only returns 1, and the delta shows up as assessed_penalty_cents vs reduction_floor_cents) is the whole subject of that §1.8 dual_variant_calc instance."

      - name: evasion_rate_variant_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: evasion_rate_variants_diverge_on_identity_refusal
          rationale: "Both variants of deployment_evasion_rate_bps are computed on one close in that §1.8 instance, where an UNRESOLVED_IDENTITY encounter makes measured_evasion_rate_bps and resolved_evasion_rate_bps differ by a verified delta."

      - name: revenue_recovery_variant_selection_and_reconciliation
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: revenue_recovery_accrual_and_cash_bases_diverge_on_same_window
          rationale: "Variant selection by the basis input and the reconciliation between billed and banked money over one identical window — including the DISMISSAL_REVERSAL subtraction on the cash leg — is asserted end-to-end by that §1.8 instance."

      - name: assessed_penalty_precision_and_clamp_order
        claim_type: precision
        excluded_because:
          difficulty_instance: assessed_penalty_nested_clamp_after_conditional_assistance_discount
          rationale: "The pinned evaluation order of citation_assessed_penalty_cents (tier lookup, zone scaling with round_half_up, conditional assistance discount, then max(FLOOR, min(CAP, x))) and its rounding after each multiplicative step is asserted by that §1.8 combinatorial_formula instance."

      - name: payment_plan_schedule_remainder_precision
        claim_type: precision
        excluded_because:
          difficulty_instance: payment_plan_floor_then_absorb_remainder_in_final_installment
          rationale: "The normative floor-then-absorb rounding order of payment_plan_schedule, and the fact that sum(schedule) == financed_cents exactly rather than the round-then-sum over-collection, is asserted by that §1.8 instance."

      - name: equity_disparity_index_rounding_order
        claim_type: precision
        excluded_because:
          difficulty_instance: equity_disparity_index_rounds_group_rates_before_deviation
          rationale: "The round-group-rates-first ordering of equity_disparity_index (0.0834 under the pinned order versus 0.0833 when aggregating raw rates) is asserted by that §1.8 combinatorial_formula instance, together with the half-open window filter."

      - name: admin_fee_band_threshold_boundary
        claim_type: threshold
        excluded_because:
          difficulty_instance: admin_fee_band_keyed_on_pre_fee_assessed_penalty_at_band_edge
          rationale: "The threshold claim for citation_admin_fee_cents at exactly FEE_BAND_2_MAX (assessed 20000 -> fee 2400 / total 22400, versus the forbidden total-keyed 3000 / 23000) is asserted by that §1.8 boundary instance."

      - name: sample_adequacy_threshold_boundary
        claim_type: threshold
        excluded_because:
          difficulty_instance: sample_adequacy_ratio_exactly_at_eight_tenths_closes_the_deployment
          rationale: "The inclusive SAMPLE_ADEQUACY_MIN gate (0.8000 closes, one encounter fewer is refused with ERR_SAMPLE_SIZE_INADEQUATE) is asserted at the boundary by that §1.8 instance."

      - name: media_expiry_boundary_is_inclusive
        claim_type: threshold
        excluded_because:
          difficulty_instance: media_expiry_equal_to_occurred_at_is_valid_one_minute_earlier_is_expired
          rationale: "The strict `<` comparison in encounter_validation_result at media_expires_at == occurred_at is asserted on both sides of the boundary by that §1.8 boundary_precision_check instance."

  # ==========================================================================
  - section: validations
    instances:

      - name: deployment_on_a_line_not_assigned_to_the_zone_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=31]
          - errors.ERR_LINE_NOT_ASSIGNED_TO_ZONE
          - entities.ZoneLineAssignment.fields.effective_from
        distinguishing_aspect: "Both foreign keys resolve, so the existence rules pass; the request still fails with ERR_LINE_NOT_ASSIGNED_TO_ZONE (422) because no ZoneLineAssignment row joins zone Z1 to line L2."
        test_recipe:
          setup:
            - "Zone Z1 exists; line L1 is assigned to Z1; line L2 exists but is assigned to nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L2", mode: "BUS", daily_boardings: 18000, baseline_evasion_rate_bps: 450 }
              as: EnforcementPlanner
              captures: { l2: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l2}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { err_na: $.data.error_id }
          assert:
            - "HTTP 422 with ${err_na} == ERR_LINE_NOT_ASSIGNED_TO_ZONE"
            - "the error is not a 404: both ${z1} and ${l2} exist"
            - "GET /inspection-deployments?zone_id=${z1} returns total_count == 0"

      - name: duplicate_zone_code_and_duplicate_badge_number_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - errors.ERR_DUPLICATE_CODE
        distinguishing_aspect: "One rule guards four separate uniqueness scopes; the same ERR_DUPLICATE_CODE (409) is raised for a repeated zone_code and for a repeated inspector badge_number, while a different code in the same scope succeeds."
        test_recipe:
          setup:
            - "Zone Z1 and inspector B-100 already exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector One", certification_expiry: "2027-01-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Duplicate Code Zone", required_sign_count: 4 }
              as: EnforcementPlanner
              captures: { err_dup_zone: $.data.error_id }
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector Two", certification_expiry: "2027-06-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { err_dup_badge: $.data.error_id }
            - call: "POST /inspectors"
              payload: { badge_number: "B-200", display_name: "Inspector Two", certification_expiry: "2027-06-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { i2: $.data.id }
          assert:
            - "both duplicates return HTTP 409 with ${err_dup_zone} == ${err_dup_badge} == ERR_DUPLICATE_CODE"
            - "GET /fare-zones returns total_count == 1 (still only ${z1})"
            - "the third call succeeds: Inspector.${i2}.badge_number == B-200 and ${i2} != ${i1}"

      - name: repeating_a_zone_line_pair_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors.ERR_ASSIGNMENT_ALREADY_EXISTS
        distinguishing_aspect: "Uniqueness is on the (zone_id, line_id) pair, not on effective_from: a second assignment for the same pair with a later effective_from is refused with ERR_ASSIGNMENT_ALREADY_EXISTS (409), while the same line paired with a different zone is accepted."
        test_recipe:
          setup:
            - "Zones Z1 and Z2 exist; line L1 is already assigned to Z1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /fare-zones"
              payload: { zone_code: "Z2", name: "Midtown POP Zone", required_sign_count: 6 }
              as: EnforcementPlanner
              captures: { z2: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 6, effective_from: "2026-09-01T00:00:00Z" }
              as: EnforcementPlanner
              captures: { err_dup_asg: $.data.error_id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z2}", line_id: "${l1}", platform_segment_count: 2, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
              captures: { a2: $.data.id }
          assert:
            - "HTTP 409 with ${err_dup_asg} == ERR_ASSIGNMENT_ALREADY_EXISTS"
            - "ZoneLineAssignment.${a1}.platform_segment_count is still 4 and effective_from is unchanged"
            - "the cross-zone assignment succeeds: ZoneLineAssignment.${a2}.zone_id == ${z2}"
            - "GET /zone-line-assignments?line_id=${l1} returns total_count == 2"

      - name: reversed_and_sub_minute_windows_are_rejected_on_deployments_and_reports
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_TIME_WINDOW
          - endpoints[GET /reports/revenue-recovery]
        distinguishing_aspect: "One rule spans three endpoints: a reversed deployment window, a deployment window that is not a whole number of minutes apart, and a reversed report window all return ERR_INVALID_TIME_WINDOW (422)."
        test_recipe:
          setup:
            - "Zone Z1 with line L1 assigned so the referential rules pass."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T14:00:00Z", window_end: "2026-08-05T06:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { err_win_rev: $.data.error_id }
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:30Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { err_win_sec: $.data.error_id }
            - call: "GET /reports/revenue-recovery"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z", basis: "ACCRUAL" }
              as: EquityAnalyst
              captures: { err_win_rep: $.data.error_id }
          assert:
            - "all three calls return HTTP 422 with ${err_win_rev} == ${err_win_sec} == ${err_win_rep} == ERR_INVALID_TIME_WINDOW"
            - "GET /inspection-deployments returns total_count == 0 — neither malformed deployment was persisted"
            - "an equal-instant window (window_end == window_start) is rejected by the same rule since the comparison is strict"

      - name: a_second_deployment_on_another_line_in_the_same_zone_satisfies_every_temporal_rule
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=40]
          - validations[priority=41]
          - validations[priority=31]
          - entities.FareZone.fields.max_concurrent_deployments
        distinguishing_aspect: "Two deployments sharing one window are legal when they sit on different lines and the zone's max_concurrent_deployments is 2: the per-line overlap rule and the per-zone capacity rule both pass and the second create returns 201 PLANNED."
        test_recipe:
          setup:
            - "Zone Z1 with max_concurrent_deployments 2; lines L1 and L2 both assigned to Z1."
            - "Deployment D1 on L1 already covers 2026-08-05T06:00:00Z..14:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L2", mode: "BUS", daily_boardings: 18000, baseline_evasion_rate_bps: 450 }
              as: EnforcementPlanner
              captures: { l2: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l2}", platform_segment_count: 2, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l2}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 2, sampling_method: "CLUSTER_RANDOM", target_sample_size: 4 }
              as: EnforcementPlanner
              captures: { d2: $.data.id }
          assert:
            - "HTTP 201 with InspectionDeployment.${d2}.status == PLANNED and ${d2} != ${d1}"
            - "InspectionDeployment.${d2}.sampling_method == CLUSTER_RANDOM and target_sample_size == 4"
            - "GET /inspection-deployments?zone_id=${z1} returns total_count == 2"
            - "the per-line overlap rule did not fire because the two rows are on different line_id values"

      - name: hearing_decision_field_pairing_diversion_and_reduction_floor_rules
        claim_type: conditional_validation
        grounds:
          - validations[priority=49]
          - validations[priority=50]
          - validations[priority=54]
          - endpoints[POST /adjudication-hearings/{id}/decide]
        distinguishing_aspect: "Six malformed decisions on one SCHEDULED hearing separate three rules in priority order: the field-pairing rule (49) fires for a missing reason, a missing amount and a stray reason; the diversion rule (50) fires only once the fields are well formed; and the floor rule (54) fires only for an in-range decision whose amount is outside [9000, 18000)."
        test_recipe:
          setup:
            - "Rider R1 has one prior WARNING_ISSUED encounter, so the next citation is offense_sequence 2: assessed 18000, fee 2160, total 20160, reduction_floor 9000."
            - "Citation C1 is CONTESTED with hearing H1 SCHEDULED; clock at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/submit-for-signage"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector One", certification_expiry: "2027-01-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { i1: $.data.id }
            - call: "POST /riders"
              payload: { rider_ref: "R-100", display_name: "Rider One", demographic_band: "BAND_A", residence_geo_tract: "T-001", fare_assistance_enrolled: false }
              as: EnforcementPlanner
              captures: { r1: $.data.id }
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-deployments/${d1}/activate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-encounters"
              payload: { deployment_id: "${d1}", inspector_id: "${i1}", rider_id: "${r1}", occurred_at: "2026-08-05T07:00:00Z", fare_media_type: "NONE", identity_capture_method: "GOVT_ID" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { e0: $.data.id }
            - call: "POST /inspection-encounters/${e0}/resolve"
              payload: { disposition: "WARNING_ISSUED" }
              as: FareInspector
              as_user_id: "${i1}"
            - call: "POST /inspection-encounters"
              payload: { deployment_id: "${d1}", inspector_id: "${i1}", rider_id: "${r1}", occurred_at: "2026-08-05T07:30:00Z", fare_media_type: "NONE", identity_capture_method: "GOVT_ID" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { e1: $.data.id }
            - call: "POST /citations"
              payload: { encounter_id: "${e1}" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { c1: $.data.id }
            - call: "POST /citations/${c1}/contest"
              payload: {}
              as: Rider
              as_user_id: "${r1}"
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /adjudication-hearings/${h1}/decide"
              payload: { decision: "DISMISS" }
              as: HearingOfficer
              captures: { err_df1: $.data.error_id }
            - call: "POST /adjudication-hearings/${h1}/decide"
              payload: { decision: "REDUCE" }
              as: HearingOfficer
              captures: { err_df2: $.data.error_id }
            - call: "POST /adjudication-hearings/${h1}/decide"
              payload: { decision: "UPHOLD", dismissal_reason_code: "PROCEDURAL_DEFECT" }
              as: HearingOfficer
              captures: { err_df3: $.data.error_id }
            - call: "POST /adjudication-hearings/${h1}/decide"
              payload: { decision: "DISMISS", dismissal_reason_code: "FIRST_OFFENSE_DIVERSION" }
              as: HearingOfficer
              captures: { err_div: $.data.error_id }
            - call: "POST /adjudication-hearings/${h1}/decide"
              payload: { decision: "REDUCE", reduced_penalty_cents: 8000 }
              as: HearingOfficer
