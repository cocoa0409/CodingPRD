              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "OCC2 Sale", sale_date_utc: "2026-08-05T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "OCC2 Work", artist_name: "X", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id }
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "FLOOR" }
              as: SaleAdministrator
              captures: { paddle_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sv1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sv1}" }
              as: SaleAdministrator
              captures: { sv2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sv2}" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 1250000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lv_kd: $.data.version }
            - call: "POST /lots/${lot_id}/knock-down"
              payload: { expected_lot_version: "${lv_kd}" }
              as: Auctioneer
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: Auctioneer
              captures: { sv4: $.data.version }
            - call: "POST /auction-sales/${sale_id}/close"
              payload: { expected_auction_sale_version: "${sv4}" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lv_pre: $.data.version }
            - call: "POST /lots/${lot_id}/invoice"
              payload: { expected_lot_version: "${lv_pre}" }
              as: FinanceOfficer
          trigger:
            - call: "POST /lots/${lot_id}/invoice"
              payload: { expected_lot_version: "${lv_pre}" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412 and data.error_id == ERR_STALE_VERSION (lv_pre went stale after the first successful invoice bumped the lot version)"

      - name: occ_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Consignment.fields.version, state_machines.Consignment.DRAFT_to_ACTIVE]
        distinguishing_aspect: "Consignment.version starts at 1 on create and increments to 2 after activate (every mutation bumps version)."
        test_recipe:
          setup: ["A fresh consignment."]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "Estate Ver", email: "ver@x.com", country_code: "US", payout_iban: "US00000000000000000000120" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, v_create: $.data.version }
          trigger:
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${v_create}" }
              as: SaleAdministrator
              captures: { v_after: $.data.version }
          assert:
            - "Consignment.version on create == 1"
            - "Consignment.version after activate == 2"

      - name: rate_threshold_min_next_bid_band
        claim_type: rate_threshold_triggers
        grounds: [calculations.min_next_bid, "validations[priority=12]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_bid_increment_band_edge
          rationale: "The increment-band threshold at S==100000 (min_next_bid 110000) is the asserted §1.8 boundary instance."

