              payload: { decision: "SHORTLIST" }
              as: Recruiter
            - call: "POST /campus-recruiting/applications/${app2}/screen"
              payload: { decision: "SHORTLIST" }
              as: Recruiter
            - call: "POST /campus-recruiting/seasons/${sid}/employees"
              payload: { full_name: "Eve", email: "ev@co.com" }
              as: RecruitingAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/interview-days"
              payload: { window_start_at: "2026-06-08T09:00:00Z", window_end_at: "2026-06-08T17:00:00Z", capacity: 5 }
              as: Recruiter
              captures: { day_id: $.data.id }
          trigger:
            - call: "POST /campus-recruiting/interview-days/${day_id}/interview-slots"
              payload: { application_id: "${app1}", evaluator_id: "${ev_id}", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T11:00:00Z" }
              as: Recruiter
              captures: { s1: $.data.id }
            - call: "POST /campus-recruiting/interview-days/${day_id}/interview-slots"
              payload: { application_id: "${app2}", evaluator_id: "${ev_id}", start_at: "2026-06-08T11:00:00Z", end_at: "2026-06-08T11:30:00Z" }
              as: Recruiter
              captures: { err: $.data.error_id }
            - call: "POST /campus-recruiting/interview-days/${day_id}/interview-slots"
              payload: { application_id: "${app2}", evaluator_id: "${ev_id}", start_at: "2026-06-08T11:15:00Z", end_at: "2026-06-08T12:00:00Z" }
              as: Recruiter
              captures: { s2: $.data.id }
            - call: "GET /campus-recruiting/interview-days/${day_id}"
