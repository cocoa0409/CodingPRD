# =============================================================================
# Task 1199 §1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# excluded_because stubs cite the §1.8 instance that already covers the corner.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: festival_create_applies_defaults
        claim_type: creation
        grounds:
          - "entities.Festival"
          - "endpoints[POST /festivals]"
        distinguishing_aspect: "POST /festivals with all four required fields returns 201 with status PLANNING, version 1, and a server-minted UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /festivals"
              payload: { name: "Default Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fid: $.data.id, fstatus: $.data.status, fver: $.data.version }
          assert:
            - "${fstatus} == PLANNING (initial state)"
            - "${fver} == 1"
            - "${fid} is a UUID without any type prefix"

      - name: vendor_create_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.Vendor"
          - "endpoints[POST /vendors]"
        distinguishing_aspect: "A created vendor starts APPROVED with compliance_strikes 0 — both system-managed, not client input."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "Defaults LLC", contact_email: "d@defaults.com" }
              as: VendorManager
              captures: { vstatus: $.data.status, vstrikes: $.data.compliance_strikes }
          assert:
            - "${vstatus} == APPROVED"
            - "${vstrikes} == 0"

      - name: application_missing_category_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.VendorApplication.fields.category"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=8]"
        distinguishing_aspect: "Omitting required field category on POST /vendor-applications yields 400 ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["Festival APPLICATIONS_OPEN with a zone; one vendor"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Req Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - { call: "POST /zones", payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }, as: OperationsLead }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Req LLC", contact_email: "r@req.com" }
              as: VendorManager
              captures: { vend: $.data.id }
          trigger:
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vend}", festival_id: "${fest}", fee_model: "FLAT_FEE", power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vend}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (HTTP 400)"

      - name: zone_computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Zone.fields.reserved_power_amps"
          - "endpoints[POST /zones]"
        distinguishing_aspect: "Client-supplied reserved_power_amps is ignored: the response shows the computed value 0, not the submitted 999."
        test_recipe:
          setup: ["one festival"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Computed Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
          trigger:
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1, reserved_power_amps: 999 }
              as: OperationsLead
              captures: { rp: $.data.reserved_power_amps, rw: $.data.reserved_water_hookups }
          assert:
            - "${rp} == 0 (computed fields ignore client input)"
            - "${rw} == 0"

      - name: inspection_record_is_immutable_event
        claim_type: immutability
        grounds:
          - "entities.InspectionRecord"
        distinguishing_aspect: "InspectionRecord has common_fields false: the creation response carries id and created_at but NO version and NO updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["Festival CURATED with a RESERVED assignment"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Imm Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }
              as: OperationsLead
              captures: { zone: $.data.id }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Imm LLC", contact_email: "i@imm.com" }
              as: VendorManager
              captures: { vend: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vend}", festival_id: "${fest}", category: "FOOD_HOT", fee_model: "FLAT_FEE", proposed_flat_fee_cents: 50000, power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vend}"
              captures: { app: $.data.id }
            - { call: "POST /vendor-applications/${app}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${app}/decide", payload: { decision: "ACCEPTED", curated_fee_model: "FLAT_FEE", curated_flat_fee_cents: 50000 }, as: VendorManager }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "CURATED" }, as: FestivalDirector }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-01", power_outlet_max_amps: 60, has_water_hookup: false }
              as: OperationsLead
              captures: { booth: $.data.id }
            - call: "POST /booth-assignments"
              payload: { application_id: "${app}", booth_id: "${booth}", power_draw_amps: 20, requires_water: false }
              as: OperationsLead
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /inspection-records"
              payload: { assignment_id: "${asg}", type: "FIRE_SAFETY", result: "PASS" }
              as: HealthInspector
              captures: { iid: $.data.id, istatus: $.data.status }
          assert:
            - "${istatus} == COMPLETED (recorded with outcome at creation)"
            - "response has no version field and no updated_at field (common_fields false)"

      - name: vendor_list_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints[GET /vendors]"
          - "response_envelope"
        distinguishing_aspect: "GET /vendors?limit=1&offset=0 returns exactly 1 row with total_count 2 and has_more true; offset=1 returns the other row with has_more false."
        test_recipe:
          setup: ["two vendors exist"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { legal_name: "Page One", contact_email: "p1@x.com" }, as: VendorManager }
            - { call: "POST /vendors", payload: { legal_name: "Page Two", contact_email: "p2@x.com" }, as: VendorManager }
          trigger:
            - { call: "GET /vendors", payload: { limit: 1, offset: 0 }, as: VendorManager }
            - { call: "GET /vendors", payload: { limit: 1, offset: 1 }, as: VendorManager }
          assert:
            - "first page: 1 data row, total_count == 2, has_more == true"
            - "second page: 1 data row, total_count == 2, has_more == false"
            - "envelope carries meta.api_request_id and response_type array"

      - name: get_missing_festival_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_FESTIVAL_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_FESTIVAL_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /festivals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FestivalDirector
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FESTIVAL_NOT_FOUND (HTTP 404)"

      - name: assignment_denormalizes_festival_and_zone
        claim_type: system_fields
        grounds:
          - "entities.BoothAssignment.fields.festival_id"
          - "entities.BoothAssignment.fields.zone_id"
        distinguishing_aspect: "The create response's festival_id and zone_id are derived from booth.zone — the client never supplies them."
        test_recipe:
          setup: ["Festival CURATED; zone z; booth b in z; ACCEPTED application"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Denorm Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }
              as: OperationsLead
              captures: { zone: $.data.id }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Denorm LLC", contact_email: "d@denorm.com" }
              as: VendorManager
              captures: { vend: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vend}", festival_id: "${fest}", category: "FOOD_HOT", fee_model: "FLAT_FEE", proposed_flat_fee_cents: 50000, power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vend}"
              captures: { app: $.data.id }
            - { call: "POST /vendor-applications/${app}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${app}/decide", payload: { decision: "ACCEPTED", curated_fee_model: "FLAT_FEE", curated_flat_fee_cents: 50000 }, as: VendorManager }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "CURATED" }, as: FestivalDirector }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-01", power_outlet_max_amps: 60, has_water_hookup: false }
              as: OperationsLead
              captures: { booth: $.data.id }
          trigger:
            - call: "POST /booth-assignments"
              payload: { application_id: "${app}", booth_id: "${booth}", power_draw_amps: 20, requires_water: false }
              as: OperationsLead
              captures: { af: $.data.festival_id, az: $.data.zone_id }
          assert:
            - "${af} == ${fest} (denormalized from booth.zone.festival_id)"
            - "${az} == ${zone} (denormalized from booth.zone_id)"

      - name: booth_children_reachable_via_zone_filter
        claim_type: parent_relationships
        grounds:
          - "entities.Booth.fields.zone_id"
          - "endpoints[GET /booths]"
        distinguishing_aspect: "GET /booths?zone_id=z returns exactly z's booths — a booth of another zone is excluded (FK reverse reachability)."
        test_recipe:
          setup: ["festival with zones z1 and z2; booth B1 in z1, booth B2 in z2"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "FK Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }
              as: OperationsLead
              captures: { z1: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "South", power_capacity_amps: 100, water_hookup_total: 1 }
              as: OperationsLead
              captures: { z2: $.data.id }
            - { call: "POST /booths", payload: { zone_id: "${z1}", label: "N-01", power_outlet_max_amps: 60, has_water_hookup: false }, as: OperationsLead }
            - { call: "POST /booths", payload: { zone_id: "${z2}", label: "S-01", power_outlet_max_amps: 60, has_water_hookup: false }, as: OperationsLead }
          trigger:
            - { call: "GET /booths", payload: { zone_id: "${z1}" }, as: OperationsLead }
          assert:
            - "exactly 1 row, label N-01; the z2 booth (S-01) is absent"

  - section: state_machines
    instances:
      - name: festival_skip_status_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Festival"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "advance-status with to_status=CURATED from PLANNING is not the immediate successor and is rejected."
        test_recipe:
          setup: ["festival in PLANNING (a zone exists)"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Skip Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - { call: "POST /zones", payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }, as: OperationsLead }
          trigger:
            - call: "POST /festivals/${fest}/advance-status"
              payload: { to_status: "CURATED" }
              as: FestivalDirector
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION (HTTP 409)"

      - name: festival_open_requires_zone
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Festival.PLANNING_to_APPLICATIONS_OPEN"
          - "errors[ERR_FESTIVAL_NOT_CONFIGURED]"
        distinguishing_aspect: "PLANNING -> APPLICATIONS_OPEN with zero zones fails with ERR_FESTIVAL_NOT_CONFIGURED; adding a zone then succeeds."
        test_recipe:
          setup: ["festival in PLANNING with no zones"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "NoZone Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
          trigger:
            - call: "POST /festivals/${fest}/advance-status"
              payload: { to_status: "APPLICATIONS_OPEN" }
              as: FestivalDirector
              captures: { err: $.data.error_id }
            - { call: "POST /zones", payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }, as: OperationsLead }
            - call: "POST /festivals/${fest}/advance-status"
              payload: { to_status: "APPLICATIONS_OPEN" }
              as: FestivalDirector
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_FESTIVAL_NOT_CONFIGURED (HTTP 409)"
            - "after zone creation: ${st} == APPLICATIONS_OPEN"

      - name: festival_curated_blocked_by_pending_application
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Festival.APPLICATIONS_OPEN_to_CURATED"
          - "errors[ERR_APPLICATIONS_PENDING_REVIEW]"
        distinguishing_aspect: "A SUBMITTED application blocks CURATED; WAITLISTED applications do not (asserted by deciding WAITLISTED then advancing successfully)."
        test_recipe:
          setup: ["Festival APPLICATIONS_OPEN; one application still SUBMITTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Pending Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - { call: "POST /zones", payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }, as: OperationsLead }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Pend LLC", contact_email: "p@pend.com" }
              as: VendorManager
              captures: { vend: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vend}", festival_id: "${fest}", category: "FOOD_HOT", fee_model: "FLAT_FEE", proposed_flat_fee_cents: 50000, power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vend}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /festivals/${fest}/advance-status"
              payload: { to_status: "CURATED" }
              as: FestivalDirector
              captures: { err: $.data.error_id }
            - { call: "POST /vendor-applications/${app}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${app}/decide", payload: { decision: "WAITLISTED" }, as: VendorManager }
            - call: "POST /festivals/${fest}/advance-status"
              payload: { to_status: "CURATED" }
              as: FestivalDirector
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_APPLICATIONS_PENDING_REVIEW while the application is SUBMITTED"
            - "with the application WAITLISTED, advance succeeds: ${st} == CURATED"

      - name: festival_live_blocked_by_reserved_assignment
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Festival.CURATED_to_LIVE"
          - "errors[ERR_ASSIGNMENTS_UNCONFIRMED]"
        distinguishing_aspect: "A RESERVED (never confirmed) assignment blocks CURATED -> LIVE with ERR_ASSIGNMENTS_UNCONFIRMED."
        test_recipe:
          setup: ["Festival CURATED; one assignment left in RESERVED; clock already past event_start"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Unconf Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }
              as: OperationsLead
              captures: { zone: $.data.id }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Unconf LLC", contact_email: "u@unconf.com" }
              as: VendorManager
              captures: { vend: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vend}", festival_id: "${fest}", category: "FOOD_HOT", fee_model: "FLAT_FEE", proposed_flat_fee_cents: 50000, power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vend}"
              captures: { app: $.data.id }
            - { call: "POST /vendor-applications/${app}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${app}/decide", payload: { decision: "ACCEPTED", curated_fee_model: "FLAT_FEE", curated_flat_fee_cents: 50000 }, as: VendorManager }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "CURATED" }, as: FestivalDirector }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-01", power_outlet_max_amps: 60, has_water_hookup: false }
              as: OperationsLead
              captures: { booth: $.data.id }
            - { call: "POST /booth-assignments", payload: { application_id: "${app}", booth_id: "${booth}", power_draw_amps: 20, requires_water: false }, as: OperationsLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T12:00:00Z" }, as: FestivalDirector }
          trigger:
            - call: "POST /festivals/${fest}/advance-status"
              payload: { to_status: "LIVE" }
              as: FestivalDirector
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ASSIGNMENTS_UNCONFIRMED (HTTP 409)"

      - name: festival_live_requires_event_start_reached
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Festival.CURATED_to_LIVE"
          - "errors[ERR_FESTIVAL_NOT_STARTED]"
        distinguishing_aspect: "Clock at 11:59:59 (1s before event_start) blocks LIVE; at exactly 12:00:00 the >= boundary admits it."
        test_recipe:
          setup: ["Festival CURATED with no assignments; clock set one second before event_start"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Start Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - { call: "POST /zones", payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }, as: OperationsLead }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "CURATED" }, as: FestivalDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T11:59:59Z" }, as: FestivalDirector }
          trigger:
            - call: "POST /festivals/${fest}/advance-status"
              payload: { to_status: "LIVE" }
              as: FestivalDirector
              captures: { err: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T12:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals/${fest}/advance-status"
              payload: { to_status: "LIVE" }
              as: FestivalDirector
              captures: { st: $.data.status }
          assert:
            - "at event_start - 1s: ${err} == ERR_FESTIVAL_NOT_STARTED"
            - "at exactly event_start (INCLUSIVE >=): ${st} == LIVE"

      - name: festival_settlement_requires_event_end_passed
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Festival.LIVE_to_SETTLEMENT"
          - "errors[ERR_FESTIVAL_NOT_ENDED]"
        distinguishing_aspect: "Clock exactly equal to event_end blocks SETTLEMENT (strict >); one second after succeeds and completes ACTIVE assignments."
        test_recipe:
          setup: ["Festival LIVE with zero assignments; clock exactly at event_end"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
