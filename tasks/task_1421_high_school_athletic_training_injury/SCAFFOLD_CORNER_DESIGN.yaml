# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Corner Design (breadth coverage)
# High School Athletic Training & Injury Management
# Walks the claim-extraction guide against SCAFFOLD.yaml §1.1–§1.7.
# `excluded_because:` stubs mark corners already exercised by §1.8 instances.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: athlete_creation_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.Athlete.fields.participation_posture
          - entities.Athlete.fields.posture_reasons
        distinguishing_aspect: "A new athlete starts with computed posture NOT_CLEARED and empty posture_reasons; server-minted id/version/created_at are present and version == 1."
        test_recipe:
          setup: ["Trainer T1 exists"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
          trigger:
            - { call: "POST /athletes", payload: { full_name: "New Athlete", date_of_birth: "2010-01-15", grade: 9, sex: F, primary_sport: TENNIS, team_level: FRESHMAN, guardian_name: "Guard N", guardian_user_id: "g-9001", guardian_email: "gn@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a_posture: $.data.participation_posture, a_reasons: $.data.posture_reasons, a_v: $.data.version } }
          assert:
            - "a_posture == NOT_CLEARED (initial gate: no VERIFIED physical has ever existed)"
            - "a_reasons == [NO_VERIFIED_PHYSICAL]"
            - "a_v == 1 and the response carries server-minted id/created_at/updated_at"

      - name: physical_missing_athlete_rejected
        claim_type: required_fields
        grounds:
          - entities.PreParticipationPhysical.fields.athlete_id
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_ATHLETE_NOT_FOUND]
        distinguishing_aspect: "Omitting required athlete_id fails schema validation with ERR_INVALID_REQUEST (400); a well-formed but unknown athlete_id fails existence with ERR_ATHLETE_NOT_FOUND (404) — two distinct rejection layers."
        test_recipe:
          setup: ["Trainer T1 exists"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
          trigger:
            - { call: "POST /physicals", payload: { exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err1: $.data.error_id } }
            - { call: "POST /physicals", payload: { athlete_id: "00000000-0000-0000-0000-000000000000", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (missing required field)"
            - "err2 == ERR_ATHLETE_NOT_FOUND (existence check on body FK)"

      - name: supply_item_constraint_and_computed_stock
        claim_type: type_constraints
        grounds:
          - entities.SupplyItem.fields.reorder_threshold
          - entities.SupplyItem.fields.current_stock
          - entities.SupplyItem.fields.stock_status
        distinguishing_aspect: "reorder_threshold == par_level violates the (0 <= threshold < par_level) constraint; a valid create initializes computed current_stock == 0 and stock_status == OUT_OF_STOCK."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /supply-items", payload: { item_name: "Bad Item", category: TAPE, unit: ROLL, par_level: 10, reorder_threshold: 10, unit_cost_cents: 100 }, as: SystemAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /supply-items", payload: { item_name: "Good Item", category: TAPE, unit: ROLL, par_level: 10, reorder_threshold: 3, unit_cost_cents: 100 }, as: SystemAdmin, captures: { i_stock: $.data.current_stock, i_status: $.data.stock_status, i_v: $.data.version } }
          assert:
            - "err == ERR_INVALID_REQUEST (threshold must be strictly below par_level)"
            - "i_stock == 0 and i_status == OUT_OF_STOCK and i_v == 1"

      - name: event_invalid_date_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.AthleticEvent.fields.scheduled_end
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: "scheduled_end equal to scheduled_start violates the strict ordering (end must be strictly after start)."
        test_recipe:
          setup: ["Venue V exists"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Gym", venue_type: INDOOR, surface: COURT, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /events", payload: { event_name: "Zero-Length", sport: VOLLEYBALL, team_level: JV, event_type: PRACTICE, venue_id: "${v1}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T14:00:00Z", expected_attendance: 0 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_DATE_RANGE (http 422)"

      - name: immutable_environmental_reading_has_no_version
        claim_type: immutability
        grounds:
          - entities.EnvironmentalReading
        distinguishing_aspect: "EnvironmentalReading has common_fields: false — the read carries id and created_at but no version/updated_at, and no update or delete endpoint exists for it in §1.5."
        test_recipe:
          setup: ["Venue V exists; clock at 2026-08-02T14:00:00Z"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /venues", payload: { venue_name: "Field", venue_type: OUTDOOR, surface: GRASS, address: "1 Rd" }, as: SystemAdmin, captures: { v1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T14:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /weather-readings", payload: { venue_id: "${v1}", reading_type: HEAT_WBGT, value_wbgt_f: 82.5, recorded_at: "2026-08-02T13:00:00Z", source: MANUAL }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rdg: $.data.id } }
            - { call: "GET /weather-readings/${rdg}", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rdg_val: $.data.value_wbgt_f, rdg_created: $.data.created_at } }
          assert:
            - "rdg_val == 82.5 and rdg_created is present"
            - "the GET response contains NO version and NO updated_at key (append-only event entity)"

      - name: athlete_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_ATHLETE_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but nonexistent athlete id returns the resource-specific 404 code."
        test_recipe:
          setup: ["Trainer T1 exists"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
          trigger:
            - { call: "GET /athletes/00000000-0000-0000-0000-000000000000", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ATHLETE_NOT_FOUND (http 404)"

      - name: baseline_invalid_request_rejected
        claim_type: type_constraints
        grounds:
          - entities.BaselineConcussionTest.fields.symptom_score
          - entities.BaselineConcussionTest.fields.instrument
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "symptom_score 200 exceeds the 0..132 range and instrument XYZ is outside the enum — both fail with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Trainer T1 and athlete A exist"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: M, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-9101", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 200, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err1: $.data.error_id } }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: XYZ, symptom_score: 10, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (range violation)"
            - "err2 == ERR_INVALID_REQUEST (enum violation)"

      - name: clearance_summary_computed_read
        claim_type: computed_fields
        grounds:
          - entities.Athlete.fields.participation_posture
          - calculations.physical_expiry
          - calculations.baseline_validity
        distinguishing_aspect: "The clearance read composes computed fields from two source entities: physical_expires_on == exam_date + 13 months and baseline_valid_until == test_date + 24 months, with posture CLEARED."
        test_recipe:
          setup: ["Athlete A with VERIFIED physical (exam 2026-07-01, DISTRICT_13MO) and CURRENT baseline (2026-07-15)"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: F, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-9102", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /baseline-tests", payload: { athlete_id: "${a1}", test_date: "2026-07-15", instrument: SCAT6, symptom_score: 0, memory_index: 95.0, reaction_time_ms: 250.0, balance_errors: 1 }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { c_posture: $.data.participation_posture, c_pexp: $.data.physical_expires_on, c_bval: $.data.baseline_valid_until } }
          assert:
            - "c_posture == CLEARED"
            - "c_pexp == 2027-08-01T00:00:00Z"
            - "c_bval == 2028-07-15T00:00:00Z"

      - name: referenced_resources_not_found_return_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - errors[ERR_STAFF_NOT_FOUND]
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_EVENT_NOT_FOUND]
          - errors[ERR_INJURY_NOT_FOUND]
          - errors[ERR_REFERRAL_NOT_FOUND]
          - errors[ERR_PROTOCOL_NOT_FOUND]
          - errors[ERR_EAP_NOT_FOUND]
          - errors[ERR_PHYSICAL_NOT_FOUND]
          - errors[ERR_BASELINE_NOT_FOUND]
          - errors[ERR_NOTIFICATION_NOT_FOUND]
          - errors[ERR_SUPPLY_ITEM_NOT_FOUND]
          - errors[ERR_RESTOCK_ORDER_NOT_FOUND]
          - errors[ERR_BUDGET_NOT_FOUND]
        distinguishing_aspect: "Every resource-specific 404 in the catalog is triggerable through its single-resource GET (or, for coverage assignments and inventory transactions, the generic ERR_NOT_FOUND); ERR_BUDGET_NOT_FOUND fires on restock-order creation against a missing fiscal year."
        test_recipe:
          setup: ["Trainer T1 and one supply item exist"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /supply-items", payload: { item_name: "Tape", category: TAPE, unit: ROLL, par_level: 10, reorder_threshold: 3, unit_cost_cents: 100 }, as: SystemAdmin, captures: { item: $.data.id } }
          trigger:
            - { call: "GET /staff/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_staff: $.data.error_id } }
            - { call: "GET /venues/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_venue: $.data.error_id } }
            - { call: "GET /events/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_event: $.data.error_id } }
            - { call: "GET /injuries/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_inj: $.data.error_id } }
            - { call: "GET /referrals/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_ref: $.data.error_id } }
            - { call: "GET /rtp-protocols/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_rtp: $.data.error_id } }
            - { call: "GET /emergency-action-plans/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_eap: $.data.error_id } }
            - { call: "GET /physicals/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_ph: $.data.error_id } }
            - { call: "GET /baseline-tests/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_bt: $.data.error_id } }
            - { call: "GET /guardian-notifications/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_gn: $.data.error_id } }
            - { call: "GET /supply-items/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_si: $.data.error_id } }
            - { call: "GET /restock-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_ro: $.data.error_id } }
            - { call: "GET /coverage-assignments/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_ca: $.data.error_id } }
            - { call: "GET /inventory-transactions/00000000-0000-0000-0000-000000000000", payload: {}, as: SystemAdmin, captures: { e_tx: $.data.error_id } }
            - { call: "POST /restock-orders", payload: { supply_item_id: "${item}", quantity: 5, unit_cost_cents: 100, fiscal_year: 2099 }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { e_bud: $.data.error_id } }
          assert:
            - "e_staff == ERR_STAFF_NOT_FOUND; e_venue == ERR_VENUE_NOT_FOUND; e_event == ERR_EVENT_NOT_FOUND"
            - "e_inj == ERR_INJURY_NOT_FOUND; e_ref == ERR_REFERRAL_NOT_FOUND; e_rtp == ERR_PROTOCOL_NOT_FOUND"
            - "e_eap == ERR_EAP_NOT_FOUND; e_ph == ERR_PHYSICAL_NOT_FOUND; e_bt == ERR_BASELINE_NOT_FOUND"
            - "e_gn == ERR_NOTIFICATION_NOT_FOUND; e_si == ERR_SUPPLY_ITEM_NOT_FOUND; e_ro == ERR_RESTOCK_ORDER_NOT_FOUND"
            - "e_ca == ERR_NOT_FOUND and e_tx == ERR_NOT_FOUND (generic code for resources without a dedicated id)"
            - "e_bud == ERR_BUDGET_NOT_FOUND (no SupplyBudget for fiscal_year 2099)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: physical_verify_transition_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.PreParticipationPhysical.RECORDED_to_VERIFIED
        distinguishing_aspect: "Verify sets verified_by_staff_id to the caller and flips the athlete posture only one gate forward: with no baseline on file the athlete moves NOT_CLEARED -> INELIGIBLE (baseline gate still open)."
        test_recipe:
          setup: ["Trainer T1, nurse N1, athlete A; physical recorded by T1"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: F, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-9201", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id, ph_s0: $.data.status } }
          trigger:
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}", captures: { ph_s1: $.data.status, ph_verifier: $.data.verified_by_staff_id } }
            - { call: "GET /athletes/${a1}/clearance", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { posture: $.data.participation_posture, reasons: $.data.posture_reasons } }
          assert:
            - "ph_s0 == RECORDED (initial state)"
            - "ph_s1 == VERIFIED and ph_verifier == ${nr1}"
            - "posture == INELIGIBLE and reasons contains NO_CURRENT_BASELINE (physical gate passed, baseline gate still fails)"

      - name: physical_void_and_double_verify_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.PreParticipationPhysical.RECORDED_to_VOIDED
          - state_machines.PreParticipationPhysical.RECORDED_to_VERIFIED
        distinguishing_aspect: "Void is only legal from RECORDED (voiding a VERIFIED physical fails), and verify is idempotent-hostile (second verify on VERIFIED fails) — terminal/lockdown enforcement on both edges."
        test_recipe:
          setup: ["Trainer T1, nurse N1, athlete A; physical P1 VERIFIED; physical P2 RECORDED"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: M, primary_sport: BASEBALL, team_level: JV, guardian_name: "Guard A", guardian_user_id: "g-9202", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-01", examining_physician_name: "Dr X", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph1: $.data.id } }
            - { call: "POST /physicals/${ph1}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}" }
            - { call: "POST /physicals", payload: { athlete_id: "${a1}", exam_date: "2026-07-20", examining_physician_name: "Dr Y", outcome: CLEARED, validity_policy: DISTRICT_13MO }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ph2: $.data.id } }
          trigger:
            - { call: "POST /physicals/${ph1}/void", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err1: $.data.error_id } }
            - { call: "POST /physicals/${ph2}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}", captures: { ph2_s: $.data.status } }
            - { call: "POST /physicals/${ph2}/verify", payload: {}, as: SchoolNurse, as_user_id: "${nr1}", captures: { err2: $.data.error_id } }
            - { call: "POST /physicals/${ph2}/void", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err3: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_STATE (VOID allowed only from RECORDED)"
            - "ph2_s == VERIFIED"
            - "err2 == ERR_INVALID_STATE (double verify)"
            - "err3 == ERR_INVALID_STATE (void on VERIFIED)"

      - name: injury_reopen_cycle_and_close_window
        claim_type: valid_transition
        grounds:
          - state_machines.InjuryEvaluation.RESOLVED_to_OPEN
          - state_machines.InjuryEvaluation.RESOLVED_to_CLOSED
          - calculations.injury_close_window
        distinguishing_aspect: "The cyclic reopen edge (RESOLVED -> OPEN, resolved_at cleared) followed by the 30-day close window (inclusive boundary at exactly resolved_at + 30d) and terminal CLOSED lockdown."
        test_recipe:
          setup: ["Trainer T1, athlete A; SPRAIN/MINOR injury documented at default clock 2026-08-01T00:00:00Z (evaluated_at 2026-07-31T10:00)"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 10, sex: M, primary_sport: BASKETBALL, team_level: JV, guardian_name: "Guard A", guardian_user_id: "g-9203", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: ANKLE_FOOT, injury_type: SPRAIN, severity: MINOR, mechanism: "landing", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id, inj_s0: $.data.status } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /injuries/${inj}/resolve", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s_res: $.data.status, rat: $.data.resolved_at } }
            - { call: "POST /injuries/${inj}/reopen", payload: { reason: "pain returned" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s_reo: $.data.status, rat2: $.data.resolved_at } }
            - { call: "POST /injuries/${inj}/begin-care", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries/${inj}/resolve", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { rat3: $.data.resolved_at } }
            - { call: "POST /injuries/${inj}/close", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err_close: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /injuries/${inj}/close", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { s_closed: $.data.status } }
            - { call: "POST /injuries/${inj}/reopen", payload: { reason: "too late" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { err_term: $.data.error_id } }
          assert:
            - "inj_s0 == OPEN (initial state)"
            - "s_res == RESOLVED and rat == 2026-08-01T00:00:00Z (resolved_at = clock at resolve)"
            - "s_reo == OPEN and rat2 == null (cyclic reopen clears resolved_at)"
            - "err_close == ERR_CLOSE_WINDOW_NOT_MET (same-day close attempt)"
            - "s_closed == CLOSED at exactly 2026-08-31T00:00:00Z (resolved_at + 30 days, inclusive)"
            - "err_term == ERR_INVALID_STATE (CLOSED is terminal)"

      - name: referral_addendum_cycle
