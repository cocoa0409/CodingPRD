              payload: { full_name: "Vol T", email: "vt@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/treasury-transactions"
              payload: { club_id: "${club_id}", txn_kind: "DUES_PAYMENT", amount_cents: 1000 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/treasury-transactions"
              payload: { club_id: "${club_id}", txn_kind: "EXPENSE_REIMBURSEMENT", amount_cents: 800 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { txn_id: $.data.id }
            - call: "POST /api/treasury-transactions/${txn_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /api/treasury-transactions/${txn_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # already APPROVED; state (5) beats the latent fiscal overdraw (12)"

  # =========================================================================
