    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EventPricing[]
    side_effects: []
  - method: GET
    path: "/parking/garages/{id}/merchants"
    description: "List merchants enrolled in a garage (reverse-reachability for Merchant.garage_id)"
    roles: [FacilityAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Merchant[]
    side_effects: []
  - method: GET
    path: "/parking/garages/{id}/sessions"
