        distinguishing_aspect: "RECENCY_DEPTH = 3 is an input-set filter, not a weighting: with four windows the oldest (subscore 1.00) drops out entirely, giving 0.3680 and tier LOW; carrying it into the third weight slot would give 0.5360 and tier ELEVATED."
        test_recipe:
          setup:
            - "One provider and one customer left in the default PENDING/DISABLED state so no auto-suspension can fire"
