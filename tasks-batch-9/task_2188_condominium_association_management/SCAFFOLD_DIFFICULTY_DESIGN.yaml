          - calculations.encumbrance_conservation_invariant
        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint from the tally instance: the 10% overrun
          ceiling floor(estimated_cost_cents * 11 / 10) in CENTS, tested with an INCLUSIVE <= on
          POST /work-orders/{id}/invoice. With estimated_cost_cents 1234567 the ceiling is
          exactly 1358023 (13580237 / 10 = 1358023.7 truncated), so 1358023 must be accepted and
          1358024 must be rejected. An implementation using round_half_up or 1.1x float
          arithmetic yields 1358024 and wrongly accepts. Operating cash (2000000) and the
          contract cap (5000000) both comfortably cover 1358024, so priorities 44 and 46 cannot
          be responsible for the rejection.
