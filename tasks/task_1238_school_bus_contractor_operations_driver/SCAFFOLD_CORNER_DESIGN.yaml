            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd4}" }, as: ContractorOps, captures: { a4: "$.data[0].id", b4: "$.data[1].id" } }
            - { call: "POST /busops/assignments/${a4}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps, captures: { a4_st: $.data.status } }
            - { call: "GET /busops/drivers/${dr_id}", as: HRRecruiter, captures: { wk_at_cap: $.data.weekly_assigned_minutes } }
            - { call: "GET /busops/service-days/${sd4}", as: ContractorOps, captures: { sd4_v: $.data.version } }
            - { call: "POST /busops/service-days/${sd4}/lock", payload: { expected_service_day_version: "${sd4_v}" }, as: ContractorOps }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-05" }, as: ContractorOps, captures: { sd5: $.data.id } }
            - { call: "POST /busops/service-days/${sd5}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd5}" }, as: ContractorOps, captures: { a5: "$.data[0].id" } }
          trigger:
            - { call: "POST /busops/service-days/${sd4}/doubling-decisions", payload: { uncovered_assignment_id: "${b4}", absorbing_assignment_id: "${a4}" }, as: ContractorOps, captures: { b4_st: $.data.status } }
            - { call: "GET /busops/drivers/${dr_id}", as: HRRecruiter, captures: { wk_after_double: $.data.weekly_assigned_minutes } }
            - { call: "POST /busops/assignments/${a5}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps, captures: { err5: $.data.error_id } }
          assert:
