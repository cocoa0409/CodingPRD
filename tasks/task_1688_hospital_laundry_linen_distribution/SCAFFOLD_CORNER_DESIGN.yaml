  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /units]
          - response_envelope.pagination_fields
        distinguishing_aspect: "limit=1 over two units yields exactly one item with total_count 2 and has_more true; offset=1 returns the second."
        test_recipe:
          setup: ["facility with two units"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "4 West", unit_tier: "STANDARD" }, as: LinenManager, as_user_id: "lm-1", captures: { u2: $.data.id } }
          trigger:
            - { call: "GET /units", payload: { facility_id: "${fac}", limit: 1, offset: 0 }, as: LinenManager, as_user_id: "lm-1", captures: { tc: $.total_count, hm: $.has_more } }
            - { call: "GET /units", payload: { facility_id: "${fac}", limit: 1, offset: 1 }, as: LinenManager, as_user_id: "lm-1", captures: { hm2: $.has_more } }
          assert:
            - "page 1: exactly 1 item, total_count == 2, has_more == true"
            - "page 2: exactly 1 item, has_more == false"

      - name: filtered_list_by_unit_fk
        claim_type: listing
        grounds:
          - endpoints[GET /cart-runs]
          - entities.CartExchangeRun.fields.unit_id
        distinguishing_aspect: "FK reverse-reachability: GET /cart-runs?unit_id returns only that unit's runs."
        test_recipe:
          setup: ["facility; units U1 and U2 each with a par; one run per unit"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "4 West", unit_tier: "STANDARD" }, as: LinenManager, as_user_id: "lm-1", captures: { u2: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /par-levels", payload: { unit_id: "${u2}", stock_id: "${s1}", base_par_quantity: 10, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs", payload: { unit_id: "${u2}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
          trigger:
            - { call: "GET /cart-runs", payload: { unit_id: "${u1}" }, as: LinenManager, as_user_id: "lm-1", captures: { tc: $.total_count } }
          assert:
            - "total_count == 1 and the single element's id == ${r1} and unit_id == ${u1}"

      - name: late_delivery_flag_when_completed_after_window
        claim_type: computed_fields
        grounds:
          - entities.CartExchangeRun.fields.late_delivery
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Logical clock drives the compliance flag: completing at 09:30 for an 08:00-09:00 window sets late_delivery true; the next run completed at 09:30 within its 11:00-12:00 window stays false."
        test_recipe:
          setup: ["facility, unit, stock, par; runs r1 (08:00-09:00) and r2 (11:00-12:00); clock advanced to 09:30"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "TWICE_DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:30:00Z" }, as: LinenManager, as_user_id: "lm-1" }
          trigger:
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1", captures: { late1: $.data.late_delivery } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1", captures: { late2: $.data.late_delivery } }
          assert:
            - "r1.late_delivery == true (09:30 > 09:00)"
            - "r2.late_delivery == false (09:30 <= 12:00)"

      - name: metrics_computed_read_covered
        claim_type: computed_read
        grounds:
          - endpoints[GET /facilities/{facilityId}/metrics]
        excluded_because:
          difficulty_instance: facility_cost_per_apd_posted_vs_accrual
          rationale: "Metrics shape and both computed values are asserted in the §1.8 instance's trigger captures."

  # ===========================================================================
  - section: rbac
    instances:
      - name: clerk_cannot_create_cart_run
        claim_type: rbac_denial
        grounds:
          - roles[UnitClerk]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Peer-role boundary: UnitClerk may dispute/reconcile but not create cart runs (EVSOperator-only)."
        test_recipe:
          setup: ["facility, unit, stock, par"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
          trigger:
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: UnitClerk, as_user_id: "${u1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE and http status 403"

      - name: clerk_cannot_file_complaint_for_other_unit
        claim_type: rbac_denial
        grounds:
          - roles[UnitClerk]
          - errors[ERR_UNIT_OWNERSHIP]
        distinguishing_aspect: "Ownership on write: clerk of U1 filing a complaint with unit_id U2 fails ERR_UNIT_OWNERSHIP even though the role may create complaints."
        test_recipe:
          setup: ["facility; units U1, U2; stock S1; pars; manifest m1 DISPATCHED"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "4 West", unit_tier: "STANDARD" }, as: LinenManager, as_user_id: "lm-1", captures: { u2: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /par-levels", payload: { unit_id: "${u2}", stock_id: "${s1}", base_par_quantity: 10, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /complaints", payload: { unit_id: "${u2}", manifest_id: "${m1}", stock_id: "${s1}", complaint_type: "STAINS", pieces_affected: 1 }, as: UnitClerk, as_user_id: "${u1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNIT_OWNERSHIP and http status 403"

      - name: ico_cannot_verify_stains_complaint
        claim_type: rbac_denial
        grounds:
          - roles[InfectionControlOfficer]
          - state_machines.Complaint.OPEN_to_VERIFIED
        distinguishing_aspect: "Reverse conditional: InfectionControlOfficer is limited to ISOLATION_BREACH; verifying a STAINS complaint fails with ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["facility, unit, stock, par; manifest m1; STAINS complaint OPEN"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /complaints", payload: { unit_id: "${u1}", manifest_id: "${m1}", stock_id: "${s1}", complaint_type: "STAINS", pieces_affected: 1 }, as: UnitClerk, as_user_id: "${u1}", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /complaints/${c1}/verify", payload: {}, as: InfectionControlOfficer, as_user_id: "ico-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE and http status 403"

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_par_update_stale_after_surge_cascade
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[par_level_update_stale]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "optimistic_concurrency layer: the surge cascade silently bumps par.version from 1 to 2, so a PUT carrying the pre-cascade version fails 412; after close, a fresh version succeeds and increments to 3."
        test_recipe:
          setup: ["facility, unit, stock; par p1 (version 1 captured); surge activated (cascade recomputes effective_par, bumping p1 to version 2)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p1: $.data.id, pv: $.data.version } }
            - { call: "POST /surge-events", payload: { facility_id: "${fac}", severity: "LEVEL_1", par_multiplier: 1.5, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1", captures: { sg: $.data.id } }
            - { call: "POST /surge-events/${sg}/activate", payload: {}, as: LinenManager, as_user_id: "lm-1" }
          trigger:
            - { call: "PUT /par-levels/${p1}", payload: { base_par_quantity: 25, expected_par_level_version: "${pv}" }, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
            - { call: "POST /surge-events/${sg}/close", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "GET /par-levels/${p1}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { pv3: $.data.version } }
            - { call: "PUT /par-levels/${p1}", payload: { base_par_quantity: 25, expected_par_level_version: "${pv3}" }, as: LinenManager, as_user_id: "lm-1", captures: { v4: $.data.version, base: $.data.base_par_quantity, eff: $.data.effective_par } }
          assert:
            - "stale PUT: error_id == ERR_STALE_VERSION and http status 412"
            - "after close and fresh read: PUT succeeds, base_par_quantity == 25, effective_par == 25, version advanced by 1"

      - name: occ_stock_adjustment_stale
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[stock_adjustment_stale]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "optimistic_concurrency layer on a different parent: cart-run completion bumps stock.version, so an adjustment with the creation-time version fails 412; fresh version succeeds."
        test_recipe:
          setup: ["facility, unit, stock S1 (version 1 captured), par 20; fill run completed (in_circulation 100 -> 80, stock version advanced)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id, sv: $.data.version } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
          trigger:
            - { call: "POST /linen-stocks/${s1}/adjustments", payload: { delta_pieces: 5, reason: "FOUND", expected_linen_stock_version: "${sv}" }, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
            - { call: "GET /linen-stocks/${s1}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { sv2: $.data.version } }
            - { call: "POST /linen-stocks/${s1}/adjustments", payload: { delta_pieces: 5, reason: "FOUND", expected_linen_stock_version: "${sv2}" }, as: LinenManager, as_user_id: "lm-1", captures: { circ: $.data.in_circulation, v3: $.data.version } }
          assert:
            - "stale adjustment: error_id == ERR_STALE_VERSION and http status 412"
            - "fresh adjustment: in_circulation == 85 and version incremented by 1"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_complete
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.CartExchangeRun.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "immediate model: the complete call's own response carries the post-mutation state (status COMPLETED, computed restock_lines, on_hand effects) with no re-read or delay."
        test_recipe:
          setup: ["facility, unit, stock S1 par 20; run r1 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1", captures: { st: $.data.status, rl: $.data.restock_lines, late: $.data.late_delivery } }
          assert:
            - "response status == COMPLETED in the same request"
            - "response restock_lines == [ { stock_id: ${s1}, pieces: 20 } ] in the same request"
            - "response late_delivery == false in the same request"
