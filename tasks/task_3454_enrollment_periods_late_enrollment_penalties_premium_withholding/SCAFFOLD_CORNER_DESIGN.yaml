              payload: { full_name: "Oep Twice", date_of_birth: "1960-01-15" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-10T00:00:00Z" }
