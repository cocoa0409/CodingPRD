              as: ControlsEngineer
          trigger:
            - call: "POST /panel-shop/panels/${p_dh2}/program-versions"
              payload: { version_tag: "v1.0.0", content_hash: "dead0000eeff0011223344556677889900112233445566778899aabbccddeeff00", expected_panel_version: "${p_dh2_v}" }
              as: ControlsEngineer
              captures: { pv_dh2: "$.data.id" }
            - call: "GET /panel-shop/panels/${p_dh1}"
              payload: {}
