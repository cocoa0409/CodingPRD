# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# (task 1218). Breadth walk of SCAFFOLD.yaml §1.1–§1.7 per the
# claim-extraction-guide taxonomy. §1.8-covered corners appear as
# excluded_because stubs. Every non-stub chain replays from empty-DB.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_circle_missing_required_name_rejected
        claim_type: required_fields
        grounds:
          - entities.Circle.fields.name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /api/circles without required name (and other required config) is rejected 400 ERR_INVALID_REQUEST; nothing persists."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/circles", payload: {}, as: CircleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"
            - "GET /api/circles returns total_count == 0"

      - name: nonprofit_defaults_standing_good
        claim_type: defaults
        grounds:
          - entities.Nonprofit.fields.standing
        distinguishing_aspect: "A newly registered nonprofit starts with system-managed standing GOOD and version 1; no input field can set standing."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/nonprofits", payload: { ein: "10-0000001", legal_name: "NP Def", mission_category: "arts" }, as: CircleAdmin, captures: { np_id: $.data.id, st: $.data.standing, v: $.data.version } }
          assert:
            - "Nonprofit.${np_id}.standing == GOOD"
            - "Nonprofit.${np_id}.version == 1"

      - name: computed_pooled_balance_after_receive
        claim_type: computed_fields
        grounds:
          - entities.GivingCycle.fields.pooled_balance_cents
          - calculations.pooled_balance
        excluded_because:
          difficulty_instance: compensating_invariant / receive_refund_pooled_conservation
          rationale: "That instance asserts pooled_balance_cents == 100000 immediately after receive (and == 0 after the compensating refund)."

      - name: create_member_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Member
          - endpoints["POST /api/members"]
        distinguishing_aspect: "Client-supplied id on create is ignored: the server mints its own UUID and the response id differs from the supplied one."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/members", payload: { full_name: "M Sys", email: "msys@x.com", id: "00000000-0000-0000-0000-0000000000aa" }, as: CircleAdmin, captures: { mid: $.data.id } }
          assert:
            - "Member.${mid}.id != 00000000-0000-0000-0000-0000000000aa"
            - "Member.${mid}.created_at is server-stamped"

      - name: get_cycle_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints["GET /api/cycles/{cycle_id}"]
        distinguishing_aspect: "GET with a well-formed but non-existent cycle UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/cycles/00000000-0000-0000-0000-0000000000ff", as: CircleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: list_members_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints["GET /api/members"]
        distinguishing_aspect: "Pagination envelope: limit=10 page 1 returns 10 rows with total_count 11 and has_more true; offset=10 returns 1 row with has_more false."
        test_recipe:
          setup: ["11 members registered"]
          setup_api_calls:
            - { call: "POST /api/members", payload: { full_name: "P01", email: "p01@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P02", email: "p02@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P03", email: "p03@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P04", email: "p04@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P05", email: "p05@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P06", email: "p06@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P07", email: "p07@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P08", email: "p08@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P09", email: "p09@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P10", email: "p10@x.com" }, as: CircleAdmin }
            - { call: "POST /api/members", payload: { full_name: "P11", email: "p11@x.com" }, as: CircleAdmin }
          trigger:
            - { call: "GET /api/members?limit=10&offset=0", as: CircleAdmin }
            - { call: "GET /api/members?limit=10&offset=10", as: CircleAdmin }
          assert:
            - "Page 1: 10 rows, total_count == 11, has_more == true"
            - "Page 2: 1 row, total_count == 11, has_more == false"

      - name: create_membership_invalid_enum_tier_rejected
        claim_type: type_constraints
        grounds:
          - entities.Membership.fields.tier
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "tier GOLD is outside {STANDARD, LEADER} and is rejected 400 before any state or fiscal check."
        test_recipe:
          setup: ["Circle and member exist"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle EN", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/members", payload: { full_name: "M E", email: "me@x.com" }, as: CircleAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /api/memberships", payload: { member_id: "${m_id}", circle_id: "${circle_id}", tier: "GOLD" }, as: CircleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: create_membership_unknown_circle_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Membership.fields.circle_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "FK integrity: membership create referencing a non-existent circle_id fails 404 ERR_NOT_FOUND and persists nothing."
        test_recipe:
          setup: ["One member exists"]
          setup_api_calls:
            - { call: "POST /api/members", payload: { full_name: "M FK", email: "mfk@x.com" }, as: CircleAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /api/memberships", payload: { member_id: "${m_id}", circle_id: "00000000-0000-0000-0000-0000000000ee", tier: "STANDARD" }, as: CircleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: cycle_initial_phase_draft
        claim_type: initial_state
        grounds:
          - state_machines.GivingCycle
        distinguishing_aspect: "A newly created cycle starts in DRAFT with zeroed totals and config snapshotted from the circle."
        test_recipe:
          setup: ["One circle exists"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle SM0", admin_fee_percent: 5, quorum_percent: 60, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
          trigger:
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, ph: $.data.phase, qp: $.data.quorum_percent } }
          assert:
            - "GivingCycle.${cycle_id}.phase == DRAFT"
            - "quorum_percent snapshot == 60 (copied from circle at creation)"
            - "received_total_cents == 0 and pooled_balance_cents == 0"

      - name: advance_without_received_contribution_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GivingCycle.POOLING_to_NOMINATION
          - errors[ERR_EMPTY_POOL]
        distinguishing_aspect: "POOLING -> NOMINATION with only a PLEDGED (never RECEIVED) contribution fails ERR_EMPTY_POOL: pledged funds do not count."
        test_recipe:
          setup: ["Cycle in POOLING; one PLEDGED contribution 100000; received_total == 0"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle SM1", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.sm1@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}" }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
          trigger:
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EMPTY_POOL (409)"
            - "GivingCycle.${cycle_id}.phase == POOLING"

      - name: refund_request_on_refunded_contribution_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Contribution
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REFUNDED is terminal: a second request-refund on the same contribution fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cycle in POOLING; contribution 100000 already REFUNDED"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle SM2", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.sm2@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "POST /api/contributions/${c1_id}/request-refund", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/contributions/${c1_id}/approve-refund", payload: {}, as: CircleAdmin }
          trigger:
            - { call: "POST /api/contributions/${c1_id}/request-refund", payload: {}, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Contribution.${c1_id}.status == REFUNDED"

      - name: finalist_without_site_visit_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Nomination.VETTING_to_FINALIST
          - errors[ERR_SITE_VISIT_REQUIRED]
        distinguishing_aspect: "Passing vetting score (80 >= 70) is not enough: with zero COMPLETED site visits the finalist advance fails ERR_SITE_VISIT_REQUIRED."
        test_recipe:
          setup: ["Cycle in VETTING; nomination in VETTING scored 80/80/80; no site visit exists"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle SM3", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.sm3@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nonprofits", payload: { ein: "10-0000011", legal_name: "NP NoVisit", mission_category: "arts" }, as: CircleAdmin, captures: { np1_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cycle_id}", nonprofit_id: "${np1_id}", statement: "s" }, as: Member, as_user_id: "${m1_id}", captures: { n1_id: $.data.id } }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nominations/${n1_id}/start-vetting", payload: {}, as: CircleAdmin }
            - { call: "PATCH /api/nominations/${n1_id}", payload: { financial_health: 80, mission_alignment: 80, org_capacity: 80 }, as: CircleAdmin }
          trigger:
            - { call: "POST /api/nominations/${n1_id}/advance-to-finalist", payload: {}, as: CircleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SITE_VISIT_REQUIRED (409)"
            - "Nomination.${n1_id}.status == VETTING"

      - name: entering_voting_sets_window_and_snapshot
        claim_type: side_effect_execution
        grounds:
          - state_machines.GivingCycle.VETTING_to_VOTING
          - entities.GivingCycle.fields.voting_opens_at
          - entities.GivingCycle.fields.active_member_snapshot
        distinguishing_aspect: "The VETTING->VOTING advance stamps voting_opens_at = current clock, voting_closes_at = +7 days, and freezes active_member_snapshot at the count of ACTIVE memberships."
        test_recipe:
          setup: ["Cycle in VETTING with one FINALIST; 2 ACTIVE memberships; clock at 2026-06-10T11:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle SM4", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.sm4@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/members", payload: { full_name: "M Two", email: "m2.sm4@x.com" }, as: CircleAdmin, captures: { m2_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m2_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms2_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/memberships/${ms2_id}/accept", payload: {}, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nonprofits", payload: { ein: "10-0000012", legal_name: "NP Snap", mission_category: "arts" }, as: CircleAdmin, captures: { np1_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cycle_id}", nonprofit_id: "${np1_id}", statement: "s" }, as: Member, as_user_id: "${m1_id}", captures: { n1_id: $.data.id } }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nominations/${n1_id}/start-vetting", payload: {}, as: CircleAdmin }
            - { call: "PATCH /api/nominations/${n1_id}", payload: { financial_health: 80, mission_alignment: 80, org_capacity: 80 }, as: CircleAdmin }
            - { call: "POST /api/site-visits", payload: { nomination_id: "${n1_id}", starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T11:00:00Z" }, as: CircleAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T11:00:00Z" }, as: CircleAdmin }
            - { call: "POST /api/site-visits/${v1_id}/complete", payload: {}, as: CircleAdmin }
            - { call: "POST /api/nominations/${n1_id}/advance-to-finalist", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
          trigger:
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { opens: $.data.voting_opens_at, closes: $.data.voting_closes_at, snap: $.data.active_member_snapshot, ph: $.data.phase } }
          assert:
            - "phase == VOTING"
            - "voting_opens_at == 2026-06-10T11:00:00Z (current logical clock at entry)"
            - "voting_closes_at == 2026-06-17T11:00:00Z (opens + 7 days)"
            - "active_member_snapshot == 2"

      - name: site_visit_auto_no_show_after_end
        claim_type: valid_transition
        grounds:
          - state_machines.SiteVisit.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: "System auto-transition: advancing the logical clock past ends_at flips a still-SCHEDULED visit to NO_SHOW without any visit-scoped API call."
        test_recipe:
          setup: ["Cycle in VETTING; nomination in VETTING; visit SCHEDULED 2026-06-10T10:00-11:00Z"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle SM5", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.sm5@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nonprofits", payload: { ein: "10-0000013", legal_name: "NP NoShow", mission_category: "arts" }, as: CircleAdmin, captures: { np1_id: $.data.id } }
