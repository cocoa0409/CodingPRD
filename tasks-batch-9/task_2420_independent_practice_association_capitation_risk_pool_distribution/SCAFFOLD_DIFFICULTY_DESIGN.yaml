  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: enrollment_file_post_funding_cascade_depth_five
        depth: 5
        chain: "EnrollmentFile POSTED -> CapitationRemittance POSTED -> RiskPool funded -> RiskPool deficit_flag -> DelegationAgreement capitation_posture -> PhysicianMember panel_status"
        grounds:
          - state_machines.EnrollmentFile.RECONCILED_to_POSTED
          - calculations.pool_loss_ratio_and_deficit
          - calculations.capitation_posture_derivation
          - entities.RiskPool.fields.funded_cents
          - entities.DelegationAgreement.fields.capitation_posture
          - entities.PhysicianMember.fields.panel_status
        distinguishing_aspect: |
          Triggering transition: EnrollmentFile RECONCILED -> POSTED. Depth 5,
          strictly serial with no fan-out at any link: the remittance POSTS only
          because the file posted (L1), the pools are funded only because the
          remittance posted (L2), the deficit flag flips only because
          funded_cents moved (L3), the agreement posture changes only because
          the flag flipped (L4), and the panel closes only because the posture
          left CURRENT (L5). Removing any single link removes every link below
          it. Distinct from the depth-4 claim-payment cascade below, which is
          triggered by a DownstreamClaim transition and moves the paid side of
          the ledger rather than the funded side.
          setup_note: "Reusable fixture II plus two risk pools and one pre-existing PAID professional claim of 46000 cents."
        test_recipe:
          setup:
            - "Agreement AGR_R of fixture II is ACTIVE (base_pmpm_cents 30000, MEMBER_MONTHS_PRORATED, quality_withhold_bps 700, professional 6000 / institutional 4000 bps, max_panel_size 10), with physician PR (npi 3000000001) ACTIVE and panel_status OPEN."
            - "Enrollees R1 (31 covered July days), R2 (16 covered days from 2026-07-16) and R3 (10 covered days, assignment TERMINATED at 2026-07-11) are in place, so the 2026-07 remittance will compute expected 86275, withhold 6039, net_payable 80236, professional 48142, institutional 32094, member_month_count_bps 18387."
            - "A PROFESSIONAL and an INSTITUTIONAL RiskPool both cover 2026-01-01T00:00:00Z through 2026-12-31T23:59:59Z; both start with funded_cents 0."
            - "One PROFESSIONAL claim of 46000 cents is already PAID into the professional pool, so paid_claims_cents is 46000 while funded_cents is still 0 and loss_ratio_bps is 0 (deficit_flag false, capitation_posture CURRENT)."
            - "The 2026-07 EnrollmentFile is RECONCILED and the logical clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
