  - name: episode_estimate_employer_baseline_vs_provider_cost_view
    grounds:
    - calculations.estimated_total_billed
    - entities.Episode.fields.estimated_total_billed_cents
    - endpoints.GET_/episodes/{episode_id}
    distinguishing_aspect: 'Entity domain: Episode (forward-looking estimate, computed on read).

      Two view variants — employer_baseline (anchored on the employer

      RateBook family rate plus accrual) vs provider_cost (anchored on the

      applied bundle price minus accrual) — produce different cents for the

      same episode state; the domain (episode estimation) differs from the

      claim-adjudication domain of the sibling instance.

      '
    test_recipe:
      setup:
      - Clock 2026-09-01. Employer baseline RateBook has ORTHO_JOINT = 2500000. Contract price 3000000, travel benefit 500000, no outlier (share 0%). One episode approved (LOCKED at 3000000) with an ADMINISTERED
        travel benefit of 100000.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-DV2
          rates:
            ORTHO_JOINT: 2500000
            CARDIAC: 9000000
            BARIATRIC: 4000000
            SPINE: 6000000
        as: ProgramAdmin
        captures:
          rb: $.data.id
      - call: POST /coe/employers
        payload:
          legal_name: Beta Co
          ein: E-DV2
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          emp: $.data.id
      - call: POST /coe/bundle-templates
        payload:
          procedure_family: ORTHO_JOINT
          label: Knee
          warranty_days: 90
          implant_component_cap_cents: 500000
          readmit_policy: ALL_CAUSE
        as: ProgramAdmin
        captures:
          tpl: $.data.id
      - call: POST /coe/contracts
        payload:
          employer_id: ${emp}
          template_id: ${tpl}
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          bundle_price_cents: 3000000
          rate_components:
            facility: 2400000
            professional: 300000
            implant: 200000
            anesthesia: 100000
          outlier_threshold_cents: 5000000
          outlier_share_pct: 0
          episode_cap_per_month: 50
          concurrent_capacity: 50
          travel_benefit_cents: 500000
          lodging_benefit_cents: 0
          companion_allowed: false
        as: ProgramAdmin
        captures:
          ctr: $.data.id
      - call: POST /coe/contracts/${ctr}/activate
        payload: {}
        as: ProgramAdmin
      - call: POST /coe/patients
        payload:
          employer_id: ${emp}
          full_name: Pat C
          dob: '1965-05-05'
          member_id: M-DV2
        as: CareCoordinator
        captures:
          pa: $.data.id
      - call: POST /coe/episodes
        payload:
          patient_id: ${pa}
          contract_id: ${ctr}
          intake_request_id: IR-DV2
        as: CareCoordinator
        captures:
          ep: $.data.id
          ep_v: $.data.version
      - call: POST /coe/episodes/${ep}/screenings
        payload:
          doc_type: LAB
          result: CANDIDATE
        as: CareCoordinator
      - call: POST /coe/episodes/${ep}/reviews
        payload:
          conclusion: SURGERY_INDICATED
          expected_episode_version: ${ep_v}
        captures:
          occ_v14: $.data.version
        as: PhysicianReviewer
      - call: POST /coe/episodes/${ep}/benefits
        payload:
          kind: TRAVEL
          traveler: PATIENT
          amount_cents: 100000
          expected_episode_version: ${occ_v14}
        captures:
          occ_v15: $.data.version
        as: CareCoordinator
      trigger:
      - call: GET /coe/episodes/${ep}
        payload: {}
        as: EmployerRep
        as_user_id: ${emp}
        captures:
          est_emp: $.data.estimated_total_billed_cents
      - call: GET /coe/episodes/${ep}
        payload:
          view: clinic
        as: ClaimsAdmin
        captures:
          est_clinic: $.data.estimated_total_billed_cents
      assert:
      - 'first GET used the default employer view: estimated_total_billed_cents == 2600000 (2500000 + 100000)'
      - 'clinic view: estimated_total_billed_cents == 2900000 (3000000 - 100000)'
      - ${est_emp} != ${est_clinic} for identical episode state
- rule_id: combinatorial_formula
  instances:
  - name: related_care_payable_min_of_bill_and_remaining_bundle
    grounds:
    - calculations.claim_adjudication
    - entities.Contract.fields.bundle_price_cents
    distinguishing_aspect: 'Mode (a): nested min/max over >= 3 inputs with a conditional

      half-open window branch — payable = min(billed_cents, max(0,

      applied_bundle_price_cents - allocated)) where allocated accumulates

      the BUNDLE_CASE plus prior RELATED_CARE payouts, and the whole branch

      fires only when service_date_seq is inside [discharge_seq,

      warranty_end_seq). Distinct mode from the sibling''s nested-rounding.

      '
    test_recipe:
      setup:
      - Clock 2026-09-01. Contract price 3000000, warranty 90 days. Episode fully driven to POST_OP_TRACKING; BUNDLE_CASE claim approved at 3000000. One RELATED_CARE claim billed 200000 with service_date_seq
        = discharge_seq (in window).
      - allocated after the case claim == 3000000, so remaining bundle room is max(0, 3000000 - 3000000) = 0.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-CF1
          rates:
            ORTHO_JOINT: 2500000
            CARDIAC: 9000000
            BARIATRIC: 4000000
            SPINE: 6000000
        as: ProgramAdmin
        captures:
          rb: $.data.id
      - call: POST /coe/employers
        payload:
          legal_name: Gamma
          ein: E-CF1
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          emp: $.data.id
      - call: POST /coe/bundle-templates
        payload:
          procedure_family: ORTHO_JOINT
          label: Knee
          warranty_days: 90
          implant_component_cap_cents: 500000
          readmit_policy: ALL_CAUSE
        as: ProgramAdmin
        captures:
          tpl: $.data.id
      - call: POST /coe/contracts
        payload:
          employer_id: ${emp}
          template_id: ${tpl}
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          bundle_price_cents: 3000000
          rate_components:
            facility: 2400000
            professional: 300000
            implant: 200000
            anesthesia: 100000
          outlier_threshold_cents: 5000000
          outlier_share_pct: 0
          episode_cap_per_month: 50
          concurrent_capacity: 50
          travel_benefit_cents: 0
          lodging_benefit_cents: 0
          companion_allowed: false
        as: ProgramAdmin
        captures:
          ctr: $.data.id
      - call: POST /coe/contracts/${ctr}/activate
        payload: {}
        as: ProgramAdmin
      - call: POST /coe/patients
        payload:
          employer_id: ${emp}
          full_name: Pat D
          dob: '1960-03-03'
          member_id: M-CF1
        as: CareCoordinator
        captures:
          pa: $.data.id
      - call: POST /coe/episodes
        payload:
          patient_id: ${pa}
          contract_id: ${ctr}
          intake_request_id: IR-CF1
        as: CareCoordinator
        captures:
          ep: $.data.id
          ep_v: $.data.version
      - call: POST /coe/episodes/${ep}/screenings
        payload:
          doc_type: IMAGING
          result: CANDIDATE
        as: CareCoordinator
      - call: POST /coe/episodes/${ep}/reviews
        payload:
          conclusion: SURGERY_INDICATED
          expected_episode_version: ${ep_v}
        captures:
          occ_v16: $.data.version
        as: PhysicianReviewer
      - call: POST /coe/episodes/${ep}/schedule
        payload:
          requested_day_seq: 4
          expected_episode_version: ${occ_v16}
        captures:
          occ_v17: $.data.version
        as: CareCoordinator
      - call: POST /coe/episodes/${ep}/care-items
        payload:
          phase: PRE_OP
          local_provider_name: Local PT
          required: false
        as: CareCoordinator
      - call: POST /coe/episodes/${ep}/surgery-complete
        payload:
          expected_episode_version: ${occ_v17}
        captures:
          occ_v18: $.data.version
        as: CareCoordinator
      - call: POST /coe/episodes/${ep}/discharge
        payload:
          expected_episode_version: ${occ_v18}
        captures:
          occ_v19: $.data.version
        as: CareCoordinator
      - call: POST /coe/episodes/${ep}/claims
        payload:
          claim_type: BUNDLE_CASE
          submitting_entity: HOSPITAL
          service_date_seq: 4
          billed_cents: 3000000
          expected_episode_version: ${occ_v19}
        captures:
          clc: $.data.id
        as: ClaimsAdmin
      - call: POST /coe/claims/${clc}/adjudicate
        payload: {}
        captures:
          occ_v21: $.data.version
        as: ClaimsAdmin
      - call: POST /coe/episodes/${ep}/claims
        payload:
          claim_type: RELATED_CARE
          submitting_entity: SURGERY_CENTER
          service_date_seq: 5
          billed_cents: 200000
          expected_episode_version: ${occ_v19}
        captures:
          clrc: $.data.id
        as: ClaimsAdmin
      trigger:
      - call: POST /coe/claims/${clrc}/adjudicate
        payload: {}
        captures:
          occ_v23: $.data.version
        as: ClaimsAdmin
      assert:
      - Claim.${clc}.adjudicated_payable_cents == 3000000 (case rate paid first)
      - Claim.${clrc}.status == APPROVED and adjudicated_payable_cents == 0 because min(200000, max(0, 3000000 - 3000000)) == 0
      - adjudication_reason == APPROVED (zero payable is still an approval, not a denial)
  - name: outlier_truncation_then_add_rounding_order
    grounds:
    - calculations.claim_adjudication
    - entities.Contract.fields.outlier_threshold_cents
    - entities.Contract.fields.outlier_share_pct
    distinguishing_aspect: 'Mode (b): nested rounding where the pinned order matters — the

      outlier share division truncates to integer cents BEFORE being added

      to the bundle price; computing (bundle + excess) * share or rounding

      the final sum instead yields a different cent. Distinct mode from the

      sibling''s nested min/max formula.

      '
    test_recipe:
      setup:
      - Clock 2026-09-01. Contract price 3000000, outlier threshold 3100001, outlier share 33%. Episode driven to POST_OP_TRACKING; BUNDLE_CASE billed 3100002.
      - excess = 3100002 - 3100001 = 1; (1 * 33) / 100 truncated = 0; payable = 3000000 + 0 = 3000000.
