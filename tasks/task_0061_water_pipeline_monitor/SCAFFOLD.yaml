# =============================================================================
# Task 0061 — Smart Water Pipeline Network Monitoring
# Scaffold seed tables (§1.0 – §1.7) for downstream PRD / test / impl generation.
# =============================================================================

scenario: |
  Smart water pipeline network monitoring: pipeline topology management with
  pipeline-segment modeling, valve and pump-station nodes, district-metering-area
  (DMA) partitioning, topology-version control, and topology-change workflow;
  sensor data ingestion with multi-protocol device access (NB-IoT/LoRa/wired),
  polling-frequency configuration, data-validity check, abnormal-value filtering,
  and historical data archiving; pressure and flow anomaly detection with
  rule-based thresholds, dynamic baselines (time-of-day/day-of-week), multi-sensor
  cross-validation, alert-level classification, and alert-aggregation deduplication;
  leak localization with DMA-based water-balance analysis, pressure-gradient
  analysis, minimum-night-flow detection, suspected-leak-zone narrowing, and
  on-site verification dispatch; repair work order with work-order generation from
  alerts and inspection findings, priority classification, technician dispatch,
  parts requisition, repair record, and post-repair restoration verification; water
  balance analysis with input-output reconciliation by DMA, billed and unbilled
  consumption classification, apparent-loss and real-loss separation, periodic
  non-revenue water rate analysis, and trend reporting; event-driven
  synchronization with billing, GIS, and IM systems; audit logging for topology
  changes and alert handling.

domain_name: water-pipeline-monitor
api_prefix: /networks

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - version_pinning_on_approval
    - idempotency
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Network
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Network display name" }
      - { name: utility_code, type: string, source: input, description: "Owning utility identifier; unique across networks" }
      - { name: active_topology_version_id, type: string, source: computed, description: "TopologyVersion.id whose status=PUBLISHED; null when no version published yet" }
      - { name: nrw_target_pct, type: number, source: input, description: "Non-revenue water target percentage, e.g. 12.0 means 12.0%" }
      - { name: clock_epoch_ms, type: integer, source: system, description: "Monotonic test clock in milliseconds since epoch, advanced via POST /_clock/advance" }

  - name: TopologyVersion
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK Network.id" }
      - { name: version_number, type: integer, source: system, description: "Monotonic per network, starts at 1 on first DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | PUBLISHED | SUPERSEDED | REJECTED", constraints: "enum closed" }
      - { name: parent_version_id, type: string, source: input, description: "TopologyVersion.id this draft was branched from; null only for version_number=1" }
      - { name: change_summary, type: string, source: input, description: "Human description of changes contained in this version" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of TopologyEngineer who submitted for review" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of TopologyApprover; MUST differ from submitted_by" }
      - { name: published_at, type: datetime, source: system, description: "ISO 8601 UTC when status flipped to PUBLISHED" }
      - { name: rejection_reason, type: string, source: input, description: "Required on REJECTED transition" }

  - name: PipelineNode
    parent: TopologyVersion
    common_fields: false
    fields:
      - { name: topology_version_id, type: string, source: system, description: "FK TopologyVersion.id; node belongs to exactly one version" }
      - { name: node_code, type: string, source: input, description: "Stable identifier carried across versions, unique within (topology_version_id, node_code)" }
      - { name: kind, type: enum, source: input, description: "JUNCTION | VALVE | PUMP_STATION | RESERVOIR | CUSTOMER_TAP", constraints: "enum closed" }
      - { name: dma_id, type: string, source: input, description: "FK DMA.id; null only for kind=RESERVOIR (source nodes sit outside any DMA)" }
      - { name: latitude, type: number, source: input, description: "WGS-84 latitude in degrees" }
      - { name: longitude, type: number, source: input, description: "WGS-84 longitude in degrees" }
      - { name: elevation_m, type: number, source: input, description: "Meters above sea level; used in pressure-gradient analysis" }
      - { name: valve_default_open, type: boolean, source: input, description: "Required only when kind=VALVE; null otherwise" }

  - name: PipelineSegment
    parent: TopologyVersion
    common_fields: false
    fields:
      - { name: topology_version_id, type: string, source: system, description: "FK TopologyVersion.id" }
      - { name: segment_code, type: string, source: input, description: "Stable identifier, unique within (topology_version_id, segment_code)" }
      - { name: from_node_code, type: string, source: input, description: "PipelineNode.node_code in same topology version" }
      - { name: to_node_code, type: string, source: input, description: "PipelineNode.node_code in same topology version; MUST differ from from_node_code" }
      - { name: length_m, type: number, source: input, description: "Segment length in meters, strictly positive" }
      - { name: diameter_mm, type: integer, source: input, description: "Inner diameter in millimeters, strictly positive" }
      - { name: material, type: enum, source: input, description: "PVC | DUCTILE_IRON | STEEL | HDPE", constraints: "enum closed" }
      - { name: dma_id, type: string, source: computed, description: "Inherited from from_node_code's dma_id; segments crossing DMA boundaries set dma_id=null and are flagged as boundary segments" }

  - name: DMA
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK Network.id" }
      - { name: dma_code, type: string, source: input, description: "Unique within network" }
      - { name: name, type: string, source: input, description: "DMA display name" }
      - { name: status, type: enum, source: system, description: "OPEN | RESTRICTED | FROZEN", constraints: "Posture: OPEN allows all ops; RESTRICTED blocks new repair dispatch; FROZEN blocks all mutations except topology rollback and clock advance" }
      - { name: inlet_node_codes, type: array, source: input, description: "Node codes (active topology) that are DMA inlets; sensors here count toward input reconciliation" }
      - { name: outlet_node_codes, type: array, source: input, description: "Node codes that are DMA outlets" }
      - { name: open_critical_alert_count, type: integer, source: computed, description: "Count of Alert rows with dma_id=this and severity=CRITICAL and status IN {OPEN, ACKNOWLEDGED, INVESTIGATING}; gates posture" }

  - name: Device
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK Network.id" }
      - { name: device_code, type: string, source: input, description: "Unique within network" }
      - { name: mounted_on_node_code, type: string, source: input, description: "PipelineNode.node_code in the active topology; nullable for spare devices" }
      - { name: protocol, type: enum, source: input, description: "NB_IOT | LORA | WIRED", constraints: "enum closed" }
      - { name: sensor_kind, type: enum, source: input, description: "PRESSURE | FLOW | METER", constraints: "PRESSURE reports kPa; FLOW reports L/s; METER reports cumulative m^3" }
      - { name: polling_interval_s, type: integer, source: input, description: "Required polling cadence in seconds; min 30, max 3600" }
      - { name: valid_range_min, type: number, source: input, description: "Lower bound of physically plausible readings; readings below trigger ABNORMAL filtering" }
      - { name: valid_range_max, type: number, source: input, description: "Upper bound; readings above trigger ABNORMAL filtering" }
      - { name: status, type: enum, source: system, description: "PROVISIONED | ACTIVE | OFFLINE | DECOMMISSIONED", constraints: "enum closed" }
      - { name: last_reading_at, type: datetime, source: computed, description: "ISO 8601 UTC of most recent ACCEPTED reading; null if none accepted" }
      - { name: last_reading_value, type: number, source: computed, description: "Numeric value of last ACCEPTED reading" }
      - { name: missed_polls_consecutive, type: integer, source: computed, description: "Count of expected polling intervals with no reading since last_reading_at; OFFLINE when >= 3" }

  - name: Reading
    parent: Device
    common_fields: false
    fields:
      - { name: device_id, type: string, source: system, description: "FK Device.id" }
      - { name: observed_at, type: datetime, source: input, description: "Sensor timestamp ISO 8601 UTC" }
      - { name: ingested_at, type: datetime, source: system, description: "Server timestamp on POST" }
      - { name: raw_value, type: number, source: input, description: "Value as reported by device" }
      - { name: validity, type: enum, source: computed, description: "ACCEPTED | ABNORMAL_OUT_OF_RANGE | ABNORMAL_STALE | ABNORMAL_DUPLICATE", constraints: "ABNORMAL_* readings are stored but do not update Device.last_reading_*" }
      - { name: archive_tier, type: enum, source: computed, description: "HOT | WARM | COLD; readings auto-tier as clock advances (see calc reading_archive_tier)" }
      - { name: idempotency_key, type: string, source: input, description: "Optional client-supplied dedup key; identical (device_id, idempotency_key) replays return the existing reading" }

  - name: Alert
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK Network.id" }
      - { name: dma_id, type: string, source: system, description: "FK DMA.id; derived from the device's mounted node at trigger time" }
      - { name: trigger_device_id, type: string, source: system, description: "Device that produced the breaching reading" }
      - { name: alert_kind, type: enum, source: system, description: "PRESSURE_HIGH | PRESSURE_LOW | FLOW_SPIKE | FLOW_NIGHT_HIGH | CROSS_SENSOR_DISAGREEMENT", constraints: "enum closed" }
      - { name: severity, type: enum, source: computed, description: "INFO | WARNING | CRITICAL — see calc alert_severity_classification", constraints: "enum closed" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | INVESTIGATING | RESOLVED | SUPPRESSED", constraints: "enum closed" }
      - { name: first_breach_at, type: datetime, source: system, description: "Timestamp of the reading that opened the alert" }
      - { name: last_breach_at, type: datetime, source: system, description: "Latest contributing breach reading; advances on aggregation hits" }
      - { name: occurrence_count, type: integer, source: computed, description: "Number of dedup-merged breaches contributing to this Alert; starts at 1" }
      - { name: baseline_used, type: object, source: system, description: "{kind: STATIC|DYNAMIC, threshold: number, hour_of_day: int, day_of_week: int} captured at trigger time" }
      - { name: acknowledged_by, type: string, source: system, description: "X-User-ID of ControlOperator who acknowledged" }
      - { name: resolution_note, type: string, source: input, description: "Required when transitioning to RESOLVED via operator action" }

  - name: LeakInvestigation
    parent: Alert
    common_fields: true
    fields:
      - { name: alert_id, type: string, source: system, description: "FK Alert.id; one OPEN investigation per Alert at most" }
      - { name: dma_id, type: string, source: system, description: "Snapshot of Alert.dma_id at creation" }
      - { name: status, type: enum, source: system, description: "OPEN | NARROWED | DISPATCHED | CONFIRMED_LEAK | FALSE_POSITIVE", constraints: "enum closed" }
      - { name: water_balance_loss_lps, type: number, source: computed, description: "Most recent DMA water-balance shortfall in L/s used to confirm investigation" }
      - { name: min_night_flow_lps, type: number, source: computed, description: "Lowest hourly average flow on the inlet between 02:00 and 04:00 local within the analysis window" }
      - { name: pressure_gradient_anomaly_segments, type: array, source: computed, description: "List of segment_codes where measured head loss exceeds expected by gradient_anomaly_threshold_pct" }
      - { name: suspected_segment_codes, type: array, source: computed, description: "Final narrowed candidate set, intersection of pressure-gradient anomalies and downstream-of-inlet segments" }
      - { name: assigned_technician_id, type: string, source: system, description: "Technician X-User-ID on DISPATCHED transition" }

  - name: WorkOrder
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK Network.id" }
      - { name: origin, type: enum, source: input, description: "ALERT_AUTO | INVESTIGATION | INSPECTION_FINDING", constraints: "enum closed" }
      - { name: alert_id, type: string, source: input, description: "Required when origin=ALERT_AUTO" }
      - { name: investigation_id, type: string, source: input, description: "Required when origin=INVESTIGATION" }
      - { name: dma_id, type: string, source: system, description: "FK DMA.id; resolved from alert/investigation/segment at creation" }
      - { name: target_segment_code, type: string, source: input, description: "Pipeline segment scheduled for repair; resolved against active topology version" }
      - { name: priority, type: enum, source: computed, description: "P1 | P2 | P3 — see calc work_order_priority", constraints: "enum closed" }
      - { name: status, type: enum, source: system, description: "NEW | ASSIGNED | PARTS_PENDING | IN_PROGRESS | AWAITING_VERIFICATION | CLOSED_VERIFIED | CLOSED_REJECTED | CANCELLED", constraints: "enum closed" }
      - { name: assigned_technician_id, type: string, source: system, description: "Technician X-User-ID set on ASSIGNED" }
      - { name: parts_required, type: array, source: input, description: "List of {part_code, quantity}; populated on parts requisition" }
      - { name: started_at, type: datetime, source: system, description: "Set when status enters IN_PROGRESS" }
      - { name: completed_at, type: datetime, source: system, description: "Set when status enters AWAITING_VERIFICATION" }
      - { name: verified_at, type: datetime, source: system, description: "Set on CLOSED_VERIFIED transition" }
      - { name: verification_failure_count, type: integer, source: computed, description: "Increments each time verification rejects; CLOSED_REJECTED at >=2" }
      - { name: repair_record, type: object, source: input, description: "Free-form repair notes captured on COMPLETE transition: {summary, valve_isolations_used, leak_class}" }

  - name: WaterBalanceReport
    parent: DMA
    common_fields: false
    fields:
      - { name: dma_id, type: string, source: system, description: "FK DMA.id" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of analysis window (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of analysis window (UTC); MUST satisfy window_end > window_start and window_end - window_start in {3600s, 86400s, 604800s}" }
      - { name: input_volume_m3, type: number, source: computed, description: "Sum of inlet flow integrated across window" }
      - { name: billed_consumption_m3, type: number, source: computed, description: "Sum of METER readings tagged billed_flag=true" }
      - { name: unbilled_authorized_m3, type: number, source: computed, description: "Sum of METER readings tagged billed_flag=false, authorized=true (e.g., flushing)" }
      - { name: apparent_loss_m3, type: number, source: computed, description: "Estimated meter-error + unauthorized consumption — see calc water_balance_split" }
      - { name: real_loss_m3, type: number, source: computed, description: "Estimated physical leakage = input - billed - unbilled_authorized - apparent_loss; floored at 0" }
      - { name: nrw_pct, type: number, source: computed, description: "Non-revenue water percentage = (input - billed) / input * 100, rounded to 2 decimals" }
      - { name: published_at, type: datetime, source: system, description: "Set when report finalizes; immutable thereafter" }

  - name: SyncEvent
    parent: Network
    common_fields: false
    fields:
      - { name: network_id, type: string, source: system, description: "FK Network.id" }
      - { name: target_system, type: enum, source: system, description: "BILLING | GIS | IM", constraints: "enum closed" }
      - { name: event_type, type: enum, source: system, description: "TOPOLOGY_PUBLISHED | ALERT_OPENED | ALERT_RESOLVED | WORK_ORDER_CLOSED | WATER_BALANCE_PUBLISHED", constraints: "enum closed" }
      - { name: resource_kind, type: string, source: system, description: "Entity name of the originating resource" }
      - { name: resource_id, type: string, source: system, description: "ID of the originating resource" }
      - { name: payload, type: object, source: system, description: "Snapshot data sent to the target system" }
      - { name: emitted_at, type: datetime, source: system, description: "Server time of emission; append-only" }
      - { name: sequence_no, type: integer, source: system, description: "Monotonic per (network_id, target_system); used for replay ordering" }

  - name: AuditLog
    parent: Network
    common_fields: false
    fields:
      - { name: network_id, type: string, source: system, description: "FK Network.id" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role at time of action" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at time of action" }
      - { name: action, type: enum, source: system, description: "TOPOLOGY_SUBMITTED | TOPOLOGY_PUBLISHED | TOPOLOGY_REJECTED | TOPOLOGY_ROLLED_BACK | ALERT_ACK | ALERT_SUPPRESSED | ALERT_RESOLVED | DMA_POSTURE_CHANGED | WORK_ORDER_VERIFIED", constraints: "enum closed" }
      - { name: resource_kind, type: string, source: system, description: "Entity name of the affected resource" }
      - { name: resource_id, type: string, source: system, description: "ID of the affected resource" }
      - { name: detail, type: object, source: system, description: "Before/after snapshot fragments relevant to the action" }
      - { name: recorded_at, type: datetime, source: system, description: "Server time; append-only" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TopologyVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /networks/{net}/topology-versions/{id}/submit"
        actor: TopologyEngineer
        preconditions:
          - "TopologyVersion has at least one PipelineNode and one PipelineSegment"
          - "Every PipelineSegment.from_node_code and to_node_code references a PipelineNode in the same version"
          - "Every non-RESERVOIR PipelineNode.dma_id references an OPEN or RESTRICTED DMA (FROZEN DMAs reject submission)"
          - "Network has no other TopologyVersion in UNDER_REVIEW status"
        side_effects:
          - "TopologyVersion.submitted_by = X-User-ID"
          - "AuditLog row written with action=TOPOLOGY_SUBMITTED"

      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /networks/{net}/topology-versions/{id}/approve"
        actor: TopologyApprover
        preconditions:
          - "X-User-ID MUST differ from TopologyVersion.submitted_by (segregation of duties)"
          - "All DMAs referenced by this version are OPEN or RESTRICTED (no FROZEN)"
        side_effects:
          - "Previously PUBLISHED TopologyVersion (if any) for this network transitions to SUPERSEDED"
          - "Network.active_topology_version_id := this.id"
          - "Devices whose mounted_on_node_code no longer exists in the new active version transition to PROVISIONED with mounted_on_node_code cleared"
          - "Open Alerts referencing pipeline segments removed in this version transition to SUPPRESSED with resolution_note='TOPOLOGY_SUPERSEDED'"
          - "SyncEvent emitted with event_type=TOPOLOGY_PUBLISHED to BILLING, GIS, IM (three rows)"
          - "AuditLog row written with action=TOPOLOGY_PUBLISHED"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /networks/{net}/topology-versions/{id}/reject"
        actor: TopologyApprover
        preconditions:
          - "X-User-ID MUST differ from TopologyVersion.submitted_by"
          - "Request body provides rejection_reason"
        side_effects:
          - "TopologyVersion.rejection_reason stored"
          - "AuditLog row written with action=TOPOLOGY_REJECTED"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (newer TopologyVersion approved)"
        actor: system
        preconditions: []
        side_effects:
          - "Network.active_topology_version_id repointed to newer version"

      - from: SUPERSEDED
        to: PUBLISHED
        trigger: "POST /networks/{net}/topology-versions/{id}/rollback"
        actor: TopologyApprover
        preconditions:
          - "Current PUBLISHED version exists (cannot rollback to no active)"
          - "No open WorkOrder references a segment_code that exists in the target version but not in the current PUBLISHED version (would create dangling repair)"
        side_effects:
          - "Current PUBLISHED TopologyVersion → SUPERSEDED"
          - "Target version → PUBLISHED; Network.active_topology_version_id repointed"
          - "AuditLog row written with action=TOPOLOGY_ROLLED_BACK"
          - "SyncEvent emitted with event_type=TOPOLOGY_PUBLISHED to BILLING, GIS, IM"

  - entity: DMA
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (open_critical_alert_count crosses 0→>=1)"
        actor: system
        preconditions: []
        side_effects:
          - "All NEW WorkOrders for this DMA stay creatable but cannot transition to ASSIGNED (manual assignment blocked)"

      - from: RESTRICTED
        to: FROZEN
        trigger: "system (open_critical_alert_count >= 3)"
        actor: system
        preconditions: []
        side_effects:
          - "All non-terminal WorkOrders for this DMA pause: IN_PROGRESS WorkOrders transition to AWAITING_VERIFICATION with verification_failure_count unchanged"
          - "AuditLog row written with action=DMA_POSTURE_CHANGED, detail={from: RESTRICTED, to: FROZEN}"

      - from: FROZEN
        to: RESTRICTED
        trigger: "system (open_critical_alert_count drops below 3)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESTRICTED
        to: OPEN
        trigger: "system (open_critical_alert_count drops to 0)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLog row written with action=DMA_POSTURE_CHANGED, detail={from: RESTRICTED, to: OPEN}"

  - entity: Device
    initial_state: PROVISIONED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /networks/{net}/devices/{id}/activate"
        actor: ControlOperator
        preconditions:
          - "Device.mounted_on_node_code is non-null and exists in Network.active_topology_version_id"
          - "valid_range_min < valid_range_max"
        side_effects: []

      - from: ACTIVE
        to: OFFLINE
        trigger: "system (missed_polls_consecutive >= 3 on clock advance)"
        actor: system
        preconditions: []
        side_effects:
          - "Open Alerts where trigger_device_id=this and alert_kind in {PRESSURE_LOW, PRESSURE_HIGH, FLOW_SPIKE} transition to SUPPRESSED with resolution_note='DEVICE_OFFLINE'"

      - from: OFFLINE
        to: ACTIVE
        trigger: "POST /networks/{net}/devices/{id}/readings (any ACCEPTED reading)"
        actor: system
        preconditions: []
        side_effects:
          - "missed_polls_consecutive reset to 0"

      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /networks/{net}/devices/{id}/decommission"
        actor: ControlOperator
        preconditions:
          - "No OPEN or ACKNOWLEDGED Alert references this device"
        side_effects:
          - "All non-terminal LeakInvestigations whose Alert.trigger_device_id=this advance via FALSE_POSITIVE if status in {OPEN, NARROWED}"

      - from: OFFLINE
        to: DECOMMISSIONED
        trigger: "POST /networks/{net}/devices/{id}/decommission"
        actor: ControlOperator
        preconditions: []
        side_effects: []

  - entity: Alert
    initial_state: OPEN
    terminal_states: [RESOLVED, SUPPRESSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /networks/{net}/alerts/{id}/acknowledge"
        actor: ControlOperator
        preconditions:
          - "Alert.severity != INFO (INFO alerts auto-resolve and cannot be acknowledged)"
        side_effects:
          - "Alert.acknowledged_by = X-User-ID"
          - "AuditLog row written with action=ALERT_ACK"

      - from: ACKNOWLEDGED
        to: INVESTIGATING
        trigger: "POST /networks/{net}/alerts/{id}/investigations"
        actor: ControlOperator
        preconditions:
          - "Alert.severity in {WARNING, CRITICAL}"
          - "No existing non-terminal LeakInvestigation for this Alert"
        side_effects:
          - "LeakInvestigation created with status=OPEN; alert_id, dma_id snapshotted"

      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /networks/{net}/alerts/{id}/resolve"
        actor: ControlOperator
        preconditions:
          - "Either: associated LeakInvestigation.status in {CONFIRMED_LEAK, FALSE_POSITIVE}; OR there is a CLOSED_VERIFIED WorkOrder referencing the same investigation"
          - "Request body provides resolution_note"
        side_effects:
          - "DMA.open_critical_alert_count recomputed (drives DMA posture)"
          - "SyncEvent emitted with event_type=ALERT_RESOLVED to BILLING, IM"
          - "AuditLog row written with action=ALERT_RESOLVED"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /networks/{net}/alerts/{id}/resolve"
        actor: ControlOperator
        preconditions:
          - "Alert.severity = INFO"
          - "Request body provides resolution_note"
        side_effects:
          - "AuditLog row written with action=ALERT_RESOLVED"

      - from: OPEN
        to: SUPPRESSED
        trigger: "POST /networks/{net}/alerts/{id}/suppress"
        actor: ControlOperator
        preconditions:
          - "Request body provides resolution_note"
        side_effects:
          - "DMA.open_critical_alert_count recomputed"
          - "AuditLog row written with action=ALERT_SUPPRESSED"

      - from: ACKNOWLEDGED
        to: SUPPRESSED
        trigger: "POST /networks/{net}/alerts/{id}/suppress"
        actor: ControlOperator
        preconditions: []
        side_effects:
          - "DMA.open_critical_alert_count recomputed"
          - "AuditLog row written with action=ALERT_SUPPRESSED"

      - from: OPEN
        to: OPEN
        trigger: "system (additional breach reading within dedup window)"
        actor: system
        preconditions:
          - "New breach reading has same trigger_device_id, alert_kind"
          - "ingested_at - Alert.last_breach_at <= ALERT_DEDUP_WINDOW_S (=900)"
        side_effects:
          - "occurrence_count += 1; last_breach_at updated"

  - entity: LeakInvestigation
    initial_state: OPEN
    terminal_states: [CONFIRMED_LEAK, FALSE_POSITIVE]
    transitions:
      - from: OPEN
        to: NARROWED
        trigger: "POST /networks/{net}/investigations/{id}/narrow"
        actor: ControlOperator
        preconditions:
          - "Server has computed at least one of {min_night_flow_lps, water_balance_loss_lps}"
          - "DMA status != FROZEN"
        side_effects:
          - "suspected_segment_codes computed from pressure-gradient and downstream-of-inlet intersection"

      - from: NARROWED
        to: DISPATCHED
        trigger: "POST /networks/{net}/investigations/{id}/dispatch"
        actor: ControlOperator
        preconditions:
          - "suspected_segment_codes is non-empty"
          - "Request body assigns a technician X-User-ID owned by role Technician"
          - "DMA status in {OPEN, RESTRICTED}"
        side_effects:
          - "assigned_technician_id set"
          - "A WorkOrder is created with origin=INVESTIGATION (status=NEW, priority computed)"

      - from: DISPATCHED
        to: CONFIRMED_LEAK
        trigger: "system (linked WorkOrder verified with repair_record.leak_class in {LEAK_CONFIRMED, JOINT_FAILURE, PIPE_BURST})"
        actor: system
        preconditions: []
        side_effects: []

      - from: DISPATCHED
        to: FALSE_POSITIVE
        trigger: "system (linked WorkOrder verified with repair_record.leak_class=NO_LEAK_FOUND)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: FALSE_POSITIVE
        trigger: "system (parent Alert SUPPRESSED or trigger Device DECOMMISSIONED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: NARROWED
        to: FALSE_POSITIVE
        trigger: "system (parent Alert SUPPRESSED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    initial_state: NEW
    terminal_states: [CLOSED_VERIFIED, CLOSED_REJECTED, CANCELLED]
    transitions:
      - from: NEW
        to: ASSIGNED
        trigger: "POST /networks/{net}/work-orders/{id}/assign"
        actor: MaintenanceSupervisor
        preconditions:
          - "DMA.status in {OPEN} (RESTRICTED blocks assignment)"
          - "target_segment_code resolves to a segment in Network.active_topology_version_id"
          - "assigned_technician_id is a known Technician role"
        side_effects:
          - "assigned_technician_id set; AuditLog row written"

      - from: ASSIGNED
        to: PARTS_PENDING
        trigger: "POST /networks/{net}/work-orders/{id}/request-parts"
        actor: Technician
        preconditions:
          - "X-User-ID = WorkOrder.assigned_technician_id"
          - "parts_required array is non-empty"
        side_effects: []

      - from: PARTS_PENDING
        to: IN_PROGRESS
        trigger: "POST /networks/{net}/work-orders/{id}/start"
        actor: Technician
        preconditions:
          - "X-User-ID = WorkOrder.assigned_technician_id"
          - "DMA.status != FROZEN"
        side_effects:
          - "started_at = clock now"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /networks/{net}/work-orders/{id}/start"
        actor: Technician
        preconditions:
          - "X-User-ID = WorkOrder.assigned_technician_id"
          - "parts_required is empty"
          - "DMA.status != FROZEN"
        side_effects:
          - "started_at = clock now"

      - from: IN_PROGRESS
        to: AWAITING_VERIFICATION
        trigger: "POST /networks/{net}/work-orders/{id}/complete"
        actor: Technician
        preconditions:
          - "X-User-ID = WorkOrder.assigned_technician_id"
          - "Request body provides repair_record with leak_class"
        side_effects:
          - "completed_at = clock now; repair_record stored"

      - from: AWAITING_VERIFICATION
        to: CLOSED_VERIFIED
        trigger: "POST /networks/{net}/work-orders/{id}/verify (outcome=PASS)"
        actor: MaintenanceSupervisor
        preconditions:
          - "X-User-ID != WorkOrder.assigned_technician_id (segregation of duties: technician cannot verify own work)"
          - "Server has ingested at least one ACCEPTED Reading from a Device on the repaired segment after completed_at"
        side_effects:
          - "verified_at set; AuditLog row with action=WORK_ORDER_VERIFIED"
          - "If origin=INVESTIGATION: parent LeakInvestigation advances per repair_record.leak_class"
          - "SyncEvent emitted with event_type=WORK_ORDER_CLOSED to BILLING, IM"

      - from: AWAITING_VERIFICATION
        to: IN_PROGRESS
        trigger: "POST /networks/{net}/work-orders/{id}/verify (outcome=FAIL)"
        actor: MaintenanceSupervisor
        preconditions:
          - "X-User-ID != WorkOrder.assigned_technician_id"
          - "verification_failure_count < 1 (first failure only)"
        side_effects:
          - "verification_failure_count += 1"

      - from: AWAITING_VERIFICATION
        to: CLOSED_REJECTED
        trigger: "POST /networks/{net}/work-orders/{id}/verify (outcome=FAIL)"
        actor: MaintenanceSupervisor
        preconditions:
          - "X-User-ID != WorkOrder.assigned_technician_id"
          - "verification_failure_count >= 1 (second failure)"
        side_effects:
          - "verification_failure_count += 1"
          - "AuditLog row written"

      - from: NEW
        to: CANCELLED
        trigger: "POST /networks/{net}/work-orders/{id}/cancel"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /networks/{net}/work-orders/{id}/cancel"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects: []

      - from: PARTS_PENDING
        to: CANCELLED
        trigger: "POST /networks/{net}/work-orders/{id}/cancel"
        actor: MaintenanceSupervisor
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two TopologyApprovers approve the same UNDER_REVIEW version simultaneously"
    guarantee: "Exactly one approval succeeds; the second sees the version already PUBLISHED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TopologyVersion.status"

  - scenario: "Approve and reject the same UNDER_REVIEW version simultaneously"
    guarantee: "Exactly one transition wins; the loser is rejected because status already advanced"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TopologyVersion.status"

  - scenario: "Two clients submit identical (device_id, idempotency_key) readings simultaneously"
    guarantee: "At most one Reading row is created; the duplicate returns the original Reading with HTTP 200"
    error_id: ERR_DUPLICATE_READING
    http_status: 200
    serialization: "Idempotency key uniqueness on (device_id, idempotency_key)"

  - scenario: "Two operators acknowledge the same OPEN Alert simultaneously"
    guarantee: "First-writer-wins; second receives ERR_INVALID_STATE because Alert is no longer OPEN"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Alert.status"

  - scenario: "Two MaintenanceSupervisors assign the same NEW WorkOrder simultaneously"
    guarantee: "Exactly one assignment succeeds; loser receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on WorkOrder.status"

  - scenario: "PATCH /devices/{id} with stale version conflicts with concurrent update"
    guarantee: "OCC rejects the stale write"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "version field on Device"

  - scenario: "Two TopologyEngineers submit different DRAFT versions of the same network for review simultaneously"
    guarantee: "At most one UNDER_REVIEW per network; the second submission is rejected"
    error_id: ERR_REVIEW_IN_PROGRESS
    http_status: 409
    serialization: "First-writer-wins on Network.under_review TopologyVersion uniqueness"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: alert_severity_classification
    trigger: "Alert created or aggregated (POST /devices/{id}/readings, on every breach that opens/extends an Alert)"
    algorithm: tiered_pricing
    formula: |
      # Returns one of {INFO, WARNING, CRITICAL}.
      # baseline is per-device DYNAMIC if (hour_of_day, day_of_week) has >= MIN_HISTORY_HOURS hours of data,
      # else STATIC fallback to Device.valid_range bounds.
      # For PRESSURE_LOW / PRESSURE_HIGH (alert_kind):
      #   deviation_pct = |reading - baseline| / baseline * 100
      #   if deviation_pct <  WARNING_PCT (15.0): severity=INFO
      #   if WARNING_PCT <= deviation_pct < CRITICAL_PCT (30.0): severity=WARNING
      #   if deviation_pct >= CRITICAL_PCT (30.0): severity=CRITICAL
      # For FLOW_SPIKE:
      #   ratio = reading / baseline
      #   severity=INFO if ratio < 1.5, WARNING if 1.5 <= ratio < 2.5, CRITICAL if ratio >= 2.5
      # For CROSS_SENSOR_DISAGREEMENT (multi-sensor cross-validation):
      #   peer_disagreement_count = number of peer sensors in same DMA whose readings
      #     deviate from cluster median by >= CROSS_SENSOR_TOLERANCE_PCT (10.0)
      #   severity=WARNING if peer_disagreement_count == 1, CRITICAL if >= 2
      # Boundary precision: thresholds use >= for the lower edge and < for the upper edge of each tier.
    constants:
      WARNING_PCT: 15.0
      CRITICAL_PCT: 30.0
      FLOW_WARNING_RATIO: 1.5
      FLOW_CRITICAL_RATIO: 2.5
      CROSS_SENSOR_TOLERANCE_PCT: 10.0
      MIN_HISTORY_HOURS: 168
    precision: "deviation_pct rounded to 2 decimals (round_half_up); ratio rounded to 2 decimals"
    variants:
      - name: static_baseline
        when: "Device has fewer than MIN_HISTORY_HOURS hours of ACCEPTED readings for the current (hour_of_day, day_of_week) bucket"
        difference: "Baseline := midpoint of Device.valid_range_min and valid_range_max; deviation_pct is computed against this midpoint"
      - name: dynamic_baseline
        when: "Device has >= MIN_HISTORY_HOURS hours of historical ACCEPTED readings in the bucket"
        difference: "Baseline := arithmetic mean of ACCEPTED readings in the (hour_of_day, day_of_week) bucket over the past 28 days; same deviation_pct formula"

  - name: alert_aggregation_dedup
    trigger: "POST /devices/{id}/readings (when reading would otherwise open an Alert)"
    algorithm: threshold
    formula: |
      # On a new breach reading r for (device_id D, alert_kind K):
      #   find latest non-terminal Alert A with A.trigger_device_id=D, A.alert_kind=K
      #   if A exists and r.ingested_at - A.last_breach_at <= ALERT_DEDUP_WINDOW_S (900):
      #     A.occurrence_count += 1
      #     A.last_breach_at := r.ingested_at
      #     # severity recomputed; may upgrade INFO→WARNING→CRITICAL (downgrade not allowed once acknowledged)
      #   else:
      #     create new Alert with occurrence_count=1, first_breach_at=r.observed_at,
      #       last_breach_at=r.ingested_at
      # Boundary precision: equality (exactly 900s gap) is INSIDE the dedup window (<=, inclusive).
    constants:
      ALERT_DEDUP_WINDOW_S: 900
    precision: "Integer seconds; no rounding"

  - name: dma_water_balance
    trigger: "POST /networks/{net}/dmas/{dma_id}/water-balance-reports (creates WaterBalanceReport)"
    algorithm: aggregation
    formula: |
      # Compute over [window_start, window_end), window length must be 1h, 24h, or 7d.
      # Inputs derived from ACCEPTED Readings only; ABNORMAL_* excluded.
      # input_volume_m3 := sum over inlet devices D of integral(flow_lps(D, t) dt)
      #   where flow_lps is piecewise-constant between consecutive readings, in liters/sec,
      #   converted to m^3 by dividing by 1000.
      # billed_consumption_m3 := sum of (last_meter_in_window - first_meter_in_window) for each METER device
      #   tagged billed_flag=true in Device.constraints (we use device.sensor_kind=METER and metadata field
      #   billed_flag stored on Device).
      # unbilled_authorized_m3 := same diff for METER devices tagged billed_flag=false AND authorized=true.
      # apparent_loss_m3 := input_volume_m3 * APPARENT_LOSS_RATE (0.04)
      #   (constant model — small fixed fraction representing meter inaccuracy)
      # real_loss_m3 := max(0, input_volume_m3 - billed_consumption_m3
      #                       - unbilled_authorized_m3 - apparent_loss_m3)
      # nrw_pct := round((input_volume_m3 - billed_consumption_m3) / input_volume_m3 * 100, 2)
      #   if input_volume_m3 == 0: ERR_INSUFFICIENT_DATA
      # Boundary precision: window_end strictly exclusive (a reading exactly at window_end is NOT included).
      # Tie-break: if two readings on the same device share observed_at, the one with the lower
      # ingested_at is used in the integration (deterministic).
    constants:
      APPARENT_LOSS_RATE: 0.04
    precision: "All m^3 fields rounded to 3 decimals (round_half_up); nrw_pct rounded to 2 decimals"
    variants:
      - name: hourly_window
        when: "window_end - window_start == 3600s"
        difference: "Tier classifies as recent (HOT)"
      - name: daily_window
        when: "window_end - window_start == 86400s"
        difference: "Standard daily report; canonical for NRW trend"
      - name: weekly_window
        when: "window_end - window_start == 604800s"
        difference: "Aggregates 7 daily reports; uses sum-of-daily, NOT recompute from raw readings, to avoid double rounding"

  - name: leak_localization_narrowing
    trigger: "POST /networks/{net}/investigations/{id}/narrow"
    algorithm: topological
    formula: |
      # Step 1: pressure_gradient_anomaly_segments
      #   For each PipelineSegment S in active topology with both endpoints carrying ACTIVE
      #     pressure sensors P_from, P_to:
      #     expected_head_loss = HAZEN_WILLIAMS_K * length_m / (diameter_mm^4.87) * flow_estimate^1.85
      #       where flow_estimate is the median of FLOW devices on the segment's DMA
      #         over the past LOOKBACK_S (=3600), or 0 if no FLOW devices.
      #     measured_head_loss = (P_from.last_reading_value - P_to.last_reading_value)
      #       + (elevation_diff_m) * RHO_G_KPA_PER_M
      #     if (measured_head_loss - expected_head_loss) >= GRADIENT_ANOMALY_THRESHOLD_PCT * expected_head_loss / 100:
      #       include S
      # Step 2: min_night_flow_lps
      #   Compute min hourly average of inlet FLOW devices between 02:00–04:00 local-time
      #     across the last 7 nights of ACCEPTED readings; report the minimum across those 14 hours.
      # Step 3: water_balance_loss_lps
      #   Take the most recent WaterBalanceReport for this DMA with window length 86400s.
      #   loss_lps = real_loss_m3 * 1000 / 86400
      # Step 4: suspected_segment_codes
      #   Result := intersection of (pressure_gradient_anomaly_segments) AND
      #     (segments reachable downstream of DMA inlet nodes following directed edges).
      #   If the intersection is empty AND min_night_flow_lps >= NIGHT_FLOW_THRESHOLD_LPS,
      #     fallback Result := segments reachable downstream of the DMA inlet that border the
      #     lowest-pressure node, ranked by segment_code ascending.
    constants:
      HAZEN_WILLIAMS_K: 10.67
      RHO_G_KPA_PER_M: 9.81
      GRADIENT_ANOMALY_THRESHOLD_PCT: 25.0
      LOOKBACK_S: 3600
      NIGHT_FLOW_THRESHOLD_LPS: 2.0
    precision: "All loss/flow values rounded to 3 decimals; head losses to 2 decimals (round_half_up)"
    variants:
      - name: gradient_driven
        when: "pressure_gradient_anomaly_segments is non-empty AND min_night_flow_lps >= NIGHT_FLOW_THRESHOLD_LPS"
        difference: "Result is the intersection set"
      - name: night_flow_only
        when: "pressure_gradient_anomaly_segments is empty AND min_night_flow_lps >= NIGHT_FLOW_THRESHOLD_LPS"
        difference: "Result is the downstream-of-inlet fallback set ranked by node pressure"

  - name: work_order_priority
    trigger: "WorkOrder created (POST /work-orders or system-created from investigation dispatch)"
    algorithm: weighted_scoring
    formula: |
      # Compute priority score then bucket to P1/P2/P3.
      # severity_score := {CRITICAL: 10, WARNING: 5, INFO: 0}[Alert.severity if origin in {ALERT_AUTO, INVESTIGATION} else 0]
      # dma_score := 5 if DMA.open_critical_alert_count >= 3, else 2 if >=1, else 0
      # leak_score := 8 if origin=INVESTIGATION and parent investigation reports water_balance_loss_lps >= 1.0, else 0
      # downstream_customer_score := ceil(downstream_customer_count / 50)
      #   where downstream_customer_count is COUNT of PipelineNodes with kind=CUSTOMER_TAP
      #   reachable downstream of target_segment_code in the active topology.
      # Evaluation order is PINNED in this sequence:
      #   1. compute severity_score
      #   2. compute dma_score
      #   3. compute leak_score
      #   4. compute downstream_customer_score
      #   5. total_score := severity_score + dma_score + leak_score + downstream_customer_score
      # Priority bucket:
      #   total_score >= 15 → P1
      #   8 <= total_score < 15 → P2
      #   total_score < 8 → P3
      # Boundary precision: thresholds use >= for lower edge; total_score==15 → P1, total_score==8 → P2.
    constants:
      P1_THRESHOLD: 15
      P2_THRESHOLD: 8
      DOWNSTREAM_BUCKET_SIZE: 50
    precision: "Integer arithmetic; ceiling rounding for downstream bucket"

  - name: device_offline_detection
    trigger: "POST /_clock/advance (system sweep on every clock advance)"
    algorithm: threshold
    formula: |
      # For each ACTIVE Device D:
      #   expected_next_poll = D.last_reading_at + D.polling_interval_s seconds
      #   if D.last_reading_at is null: use D.created_at + D.polling_interval_s as the baseline.
      #   missed = floor((clock_now - expected_next_poll) / D.polling_interval_s) + 1
      #     if clock_now >= expected_next_poll, else 0
      #   D.missed_polls_consecutive := missed
      #   if missed >= OFFLINE_THRESHOLD (=3) and D.status==ACTIVE → D transitions to OFFLINE
      # Boundary precision: clock_now == expected_next_poll counts as 1 missed (>=, inclusive).
    constants:
      OFFLINE_THRESHOLD: 3
    precision: "Integer seconds"

  - name: reading_archive_tier
    trigger: "POST /_clock/advance and on POST /devices/{id}/readings"
    algorithm: threshold
    formula: |
      # age_s := clock_now - reading.ingested_at
      # archive_tier := HOT  if age_s <  HOT_RETENTION_S  (=86400)
      #                 WARM if HOT_RETENTION_S  <= age_s < WARM_RETENTION_S (=2592000)
      #                 COLD if age_s >= WARM_RETENTION_S
      # Tier transitions are monotonic (HOT→WARM→COLD only). Tier never regresses even if the
      # clock is rewound (the scaffold disallows clock rewind anyway).
    constants:
      HOT_RETENTION_S: 86400
      WARM_RETENTION_S: 2592000
    precision: "Integer seconds"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-id resources exist; left-to-right validation (Network before DMA before Device etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 5
    category: business_safety
    check: "DMA.status != FROZEN for any mutation other than topology rollback or clock advance"
    error_id: ERR_DMA_FROZEN
    http_status: 409
    applies_to: "all mutation endpoints under DMA scope"

  - priority: 6
    category: business_safety
    check: "TopologyApprover.X-User-ID != TopologyVersion.submitted_by on approve/reject (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /topology-versions/{id}/approve, POST /topology-versions/{id}/reject"

  - priority: 7
    category: business_referential
    check: "PipelineSegment.from_node_code and to_node_code both reference a PipelineNode in the same topology_version_id; from != to"
    error_id: ERR_TOPOLOGY_DANGLING_REFERENCE
    http_status: 422
    applies_to: "POST /topology-versions/{id}/segments, POST /topology-versions/{id}/submit"

  - priority: 8
    category: business_referential
    check: "Device.mounted_on_node_code exists in Network.active_topology_version_id when Device transitions to ACTIVE"
    error_id: ERR_DEVICE_UNMOUNTED
    http_status: 409
    applies_to: "POST /devices/{id}/activate"

  - priority: 9
    category: business_temporal
    check: "Reading.observed_at MUST be within [clock_now - MAX_BACKDATE_S, clock_now + MAX_FORWARD_S] where MAX_BACKDATE_S=604800 and MAX_FORWARD_S=60"
    error_id: ERR_READING_TIMESTAMP_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /devices/{id}/readings"

  - priority: 10
    category: business_constraint
    check: "Reading.raw_value must satisfy Device.valid_range_min <= raw_value <= valid_range_max to be ACCEPTED; out-of-range readings are STORED but flagged ABNORMAL_OUT_OF_RANGE and do not update last_reading_*"
    error_id: ERR_READING_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /devices/{id}/readings (only blocks when strict_mode=true query param)"

  - priority: 11
    category: business_constraint
    check: "Network has at most one TopologyVersion in UNDER_REVIEW at a time"
    error_id: ERR_REVIEW_IN_PROGRESS
    http_status: 409
    applies_to: "POST /topology-versions/{id}/submit"

  - priority: 12
    category: business_constraint
    check: "Verifier (MaintenanceSupervisor) MUST differ from WorkOrder.assigned_technician_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /work-orders/{id}/verify"

  - priority: 13
    category: business_constraint
    check: "Rollback target version must not leave any open WorkOrder referencing a segment_code absent from the target version"
    error_id: ERR_TOPOLOGY_ROLLBACK_BLOCKED
    http_status: 409
    applies_to: "POST /topology-versions/{id}/rollback"

  - priority: 14
    category: business_constraint
    check: "WaterBalanceReport window length MUST be exactly 3600s, 86400s, or 604800s; window_end > window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /dmas/{dma_id}/water-balance-reports"

  - priority: 15
    category: business_constraint
    check: "WaterBalanceReport: at least one inlet device with >=1 ACCEPTED reading and input_volume_m3 > 0"
    error_id: ERR_INSUFFICIENT_DATA
    http_status: 422
    applies_to: "POST /dmas/{dma_id}/water-balance-reports"

  - priority: 16
    category: business_constraint
    check: "Device.polling_interval_s in [30, 3600]; valid_range_min < valid_range_max"
    error_id: ERR_DEVICE_CONFIG_INVALID
    http_status: 422
    applies_to: "POST /devices, PATCH /devices/{id}"

  - priority: 17
    category: business_constraint
    check: "OCC version conflict on PATCH mutations"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /devices/{id}, PATCH /networks/{id}"

  - priority: 18
    category: business_referential
    check: "WorkOrder.target_segment_code resolves to a segment in Network.active_topology_version_id at assignment time"
    error_id: ERR_WORK_ORDER_SEGMENT_MISSING
    http_status: 422
    applies_to: "POST /work-orders, POST /work-orders/{id}/assign"

  - priority: 19
    category: business_constraint
    check: "Investigation narrow requires at least one of {min_night_flow_lps computed, water_balance_loss_lps available}"
    error_id: ERR_INVESTIGATION_NO_SIGNAL
    http_status: 409
    applies_to: "POST /investigations/{id}/narrow"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Networks ----
  - method: POST
    path: "/networks"
    description: "Create a Network (utility tenant)"
    roles: [TopologyApprover]
    code: 201
    input: [name, utility_code, "nrw_target_pct?"]
    output: Network
    side_effects: ["clock_epoch_ms initialized from server time at creation; active_topology_version_id=null"]

  - method: GET
    path: "/networks/{network_id}"
    description: "Get a Network"
    roles: [TopologyEngineer, TopologyApprover, ControlOperator, MaintenanceSupervisor, Technician, Auditor]
    code: 200
    input: []
    output: Network
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/_clock/advance"
    description: "Test-clock advance endpoint; drives time-gated transitions (device offline detection, reading archive tiering)"
    roles: [ControlOperator]
    code: 200
    input: [advance_ms]
    output: Network
    side_effects:
      - "clock_epoch_ms += advance_ms (must be > 0)"
      - "Device offline sweep runs (ACTIVE → OFFLINE per device_offline_detection)"
      - "Reading archive tiers re-evaluated for affected readings"
      - "Open Alerts whose trigger Device went OFFLINE transition to SUPPRESSED"

  # ---- Topology versions ----
  - method: POST
    path: "/networks/{network_id}/topology-versions"
    description: "Create a DRAFT TopologyVersion (optionally branched from parent_version_id)"
    roles: [TopologyEngineer]
    code: 201
    input: ["parent_version_id?", change_summary]
    output: TopologyVersion
    side_effects: ["version_number assigned monotonically"]

  - method: GET
    path: "/networks/{network_id}/topology-versions/{id}"
    description: "Read a TopologyVersion with nested nodes and segments"
    roles: [TopologyEngineer, TopologyApprover, ControlOperator, Auditor]
    code: 200
    input: []
    output: TopologyVersion
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/topology-versions/{id}/nodes"
    description: "Add a PipelineNode to a DRAFT TopologyVersion"
    roles: [TopologyEngineer]
    code: 201
    input: [node_code, kind, "dma_id?", latitude, longitude, elevation_m, "valve_default_open?"]
    output: PipelineNode
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/topology-versions/{id}/segments"
    description: "Add a PipelineSegment to a DRAFT TopologyVersion"
    roles: [TopologyEngineer]
    code: 201
    input: [segment_code, from_node_code, to_node_code, length_m, diameter_mm, material]
    output: PipelineSegment
    side_effects: ["dma_id derived from from_node_code; null when from/to span different DMAs"]

  - method: POST
    path: "/networks/{network_id}/topology-versions/{id}/submit"
    description: "Submit DRAFT for review"
    roles: [TopologyEngineer]
    code: 200
    input: []
    output: TopologyVersion
    side_effects: ["status → UNDER_REVIEW; submitted_by set; AuditLog row"]

  - method: POST
    path: "/networks/{network_id}/topology-versions/{id}/approve"
    description: "Approve UNDER_REVIEW → PUBLISHED"
    roles: [TopologyApprover]
    code: 200
    input: []
    output: TopologyVersion
    side_effects:
      - "Previous PUBLISHED → SUPERSEDED"
      - "Devices on missing nodes → PROVISIONED"
      - "Alerts on removed segments → SUPPRESSED"
      - "Three SyncEvent rows emitted (BILLING, GIS, IM)"
      - "AuditLog row written"

  - method: POST
    path: "/networks/{network_id}/topology-versions/{id}/reject"
    description: "Reject UNDER_REVIEW"
    roles: [TopologyApprover]
    code: 200
    input: [rejection_reason]
    output: TopologyVersion
    side_effects: ["AuditLog row written"]

  - method: POST
    path: "/networks/{network_id}/topology-versions/{id}/rollback"
    description: "Rollback to a SUPERSEDED TopologyVersion (re-publish)"
    roles: [TopologyApprover]
    code: 200
    input: []
    output: TopologyVersion
    side_effects:
      - "Current PUBLISHED → SUPERSEDED; target → PUBLISHED"
      - "AuditLog row written; three SyncEvent rows emitted"

  # ---- DMA ----
  - method: POST
    path: "/networks/{network_id}/dmas"
    description: "Create a DMA"
    roles: [TopologyEngineer]
    code: 201
    input: [dma_code, name, "inlet_node_codes?", "outlet_node_codes?"]
    output: DMA
    side_effects: ["status initialized to OPEN"]

  - method: GET
    path: "/networks/{network_id}/dmas/{dma_id}"
    description: "Get a DMA"
    roles: [TopologyEngineer, ControlOperator, MaintenanceSupervisor, Auditor]
    code: 200
    input: []
    output: DMA
    side_effects: []

  - method: GET
    path: "/networks/{network_id}/dmas"
    description: "List DMAs with optional status filter"
    roles: [TopologyEngineer, ControlOperator, MaintenanceSupervisor, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DMA[]"
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/dmas/{dma_id}/water-balance-reports"
    description: "Run a DMA water-balance report over a fixed-length window"
    roles: [ControlOperator]
    code: 201
    input: [window_start, window_end]
    output: WaterBalanceReport
    side_effects:
      - "Report finalized immutably; SyncEvent emitted (BILLING) with event_type=WATER_BALANCE_PUBLISHED"

  - method: GET
    path: "/networks/{network_id}/dmas/{dma_id}/water-balance-reports"
    description: "List published reports for a DMA"
    roles: [ControlOperator, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "WaterBalanceReport[]"
    side_effects: []

  # ---- Devices & readings ----
  - method: POST
    path: "/networks/{network_id}/devices"
    description: "Create a Device in PROVISIONED state"
    roles: [ControlOperator]
    code: 201
    input: [device_code, "mounted_on_node_code?", protocol, sensor_kind, polling_interval_s, valid_range_min, valid_range_max]
    output: Device
    side_effects: []

  - method: GET
    path: "/networks/{network_id}/devices/{id}"
    description: "Get a Device"
    roles: [ControlOperator, MaintenanceSupervisor, Auditor]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: PATCH
    path: "/networks/{network_id}/devices/{id}"
    description: "Update polling_interval_s, valid_range_*, or mounted_on_node_code (OCC via version)"
    roles: [ControlOperator]
    code: 200
    input: ["polling_interval_s?", "valid_range_min?", "valid_range_max?", "mounted_on_node_code?", version]
    output: Device
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/devices/{id}/activate"
    description: "Transition Device from PROVISIONED to ACTIVE"
    roles: [ControlOperator]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/devices/{id}/decommission"
    description: "Transition Device to DECOMMISSIONED"
    roles: [ControlOperator]
    code: 200
    input: []
    output: Device
    side_effects:
      - "Open LeakInvestigations triggered by this device → FALSE_POSITIVE (when in OPEN/NARROWED)"

  - method: POST
    path: "/networks/{network_id}/devices/{id}/readings"
    description: "Ingest a sensor reading"
    roles: [ControlOperator]
    code: 201
    input: [observed_at, raw_value, "idempotency_key?", "strict_mode?"]
    output: Reading
    side_effects:
      - "validity computed (ACCEPTED vs ABNORMAL_*)"
      - "If ACCEPTED: Device.last_reading_at, last_reading_value updated; missed_polls_consecutive=0"
      - "If breach: Alert opened OR aggregated per alert_aggregation_dedup"
      - "If Device.status=OFFLINE and reading=ACCEPTED: Device → ACTIVE"

  - method: GET
    path: "/networks/{network_id}/devices/{id}/readings"
    description: "List readings, with optional archive_tier filter"
    roles: [ControlOperator, Auditor]
    code: 200
    input: ["archive_tier?", "limit?", "offset?"]
    output: "Reading[]"
    side_effects: []

  # ---- Alerts ----
  - method: GET
    path: "/networks/{network_id}/alerts"
    description: "List alerts with optional filters"
    roles: [ControlOperator, MaintenanceSupervisor, Auditor]
    code: 200
    input: ["status?", "severity?", "dma_id?", "limit?", "offset?"]
    output: "Alert[]"
    side_effects: []

  - method: GET
    path: "/networks/{network_id}/alerts/{id}"
    description: "Get an Alert"
    roles: [ControlOperator, MaintenanceSupervisor, Auditor]
    code: 200
    input: []
    output: Alert
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/alerts/{id}/acknowledge"
    description: "Acknowledge an OPEN alert"
    roles: [ControlOperator]
    code: 200
    input: []
    output: Alert
    side_effects: ["acknowledged_by set; AuditLog row"]

  - method: POST
    path: "/networks/{network_id}/alerts/{id}/resolve"
    description: "Resolve an alert"
    roles: [ControlOperator]
    code: 200
    input: [resolution_note]
    output: Alert
    side_effects:
      - "DMA.open_critical_alert_count recomputed (may flip DMA posture)"
      - "SyncEvent emitted (BILLING, IM) with event_type=ALERT_RESOLVED"

  - method: POST
    path: "/networks/{network_id}/alerts/{id}/suppress"
    description: "Suppress an alert (false positive or topology change)"
    roles: [ControlOperator]
    code: 200
    input: [resolution_note]
    output: Alert
    side_effects: ["DMA.open_critical_alert_count recomputed; AuditLog row"]

  # ---- Investigations ----
  - method: POST
    path: "/networks/{network_id}/alerts/{id}/investigations"
    description: "Open a LeakInvestigation for an ACKNOWLEDGED alert"
    roles: [ControlOperator]
    code: 201
    input: []
    output: LeakInvestigation
    side_effects: ["Parent Alert transitions ACKNOWLEDGED → INVESTIGATING"]

  - method: GET
    path: "/networks/{network_id}/investigations/{id}"
    description: "Get a LeakInvestigation with computed signals"
    roles: [ControlOperator, MaintenanceSupervisor, Auditor]
    code: 200
    input: []
    output: LeakInvestigation
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/investigations/{id}/narrow"
    description: "Run leak-localization narrowing; populates suspected_segment_codes"
    roles: [ControlOperator]
    code: 200
    input: []
    output: LeakInvestigation
    side_effects: ["water_balance_loss_lps, min_night_flow_lps, pressure_gradient_anomaly_segments, suspected_segment_codes computed"]

  - method: POST
    path: "/networks/{network_id}/investigations/{id}/dispatch"
    description: "Dispatch a Technician; auto-creates a WorkOrder"
    roles: [ControlOperator]
    code: 200
    input: [assigned_technician_id, target_segment_code]
    output: LeakInvestigation
    side_effects: ["WorkOrder created with origin=INVESTIGATION, status=NEW, priority computed"]

  # ---- WorkOrders ----
  - method: POST
    path: "/networks/{network_id}/work-orders"
    description: "Create a WorkOrder directly (origin=INSPECTION_FINDING or ALERT_AUTO with alert_id)"
    roles: [MaintenanceSupervisor]
    code: 201
    input: [origin, "alert_id?", "investigation_id?", target_segment_code, "parts_required?"]
    output: WorkOrder
    side_effects: ["priority computed; status=NEW"]

  - method: GET
    path: "/networks/{network_id}/work-orders/{id}"
    description: "Get a WorkOrder"
    roles: [MaintenanceSupervisor, Technician, ControlOperator, Auditor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/networks/{network_id}/work-orders"
    description: "List WorkOrders with filters"
    roles: [MaintenanceSupervisor, Technician, ControlOperator, Auditor]
    code: 200
    input: ["status?", "priority?", "assigned_technician_id?", "dma_id?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/work-orders/{id}/assign"
    description: "Assign a Technician (DMA must be OPEN)"
    roles: [MaintenanceSupervisor]
    code: 200
    input: [assigned_technician_id]
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/work-orders/{id}/request-parts"
    description: "Request parts; transitions to PARTS_PENDING"
    roles: [Technician]
    code: 200
    input: [parts_required]
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/networks/{network_id}/work-orders/{id}/start"
    description: "Begin repair work; DMA must not be FROZEN"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["started_at set"]

  - method: POST
    path: "/networks/{network_id}/work-orders/{id}/complete"
    description: "Submit repair record; transitions to AWAITING_VERIFICATION"
    roles: [Technician]
    code: 200
    input: [repair_record]
    output: WorkOrder
    side_effects: ["completed_at set; repair_record stored"]

  - method: POST
    path: "/networks/{network_id}/work-orders/{id}/verify"
    description: "Verify completed repair (outcome=PASS|FAIL); supervisor must differ from technician"
    roles: [MaintenanceSupervisor]
    code: 200
    input: [outcome, "verification_note?"]
    output: WorkOrder
    side_effects:
      - "PASS: status → CLOSED_VERIFIED; verified_at set; AuditLog row; SyncEvent emitted (BILLING, IM); parent investigation advances"
      - "FAIL (first): status → IN_PROGRESS; verification_failure_count=1"
      - "FAIL (second): status → CLOSED_REJECTED; verification_failure_count=2"

  - method: POST
    path: "/networks/{network_id}/work-orders/{id}/cancel"
    description: "Cancel a non-terminal WorkOrder"
    roles: [MaintenanceSupervisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  # ---- Sync & audit ----
  - method: GET
    path: "/networks/{network_id}/sync-events"
    description: "List emitted SyncEvents with optional target_system filter; pagination supported"
    roles: [Auditor]
    code: 200
    input: ["target_system?", "event_type?", "limit?", "offset?"]
    output: "SyncEvent[]"
    side_effects: []

  - method: GET
    path: "/networks/{network_id}/audit-logs"
    description: "List AuditLog rows; pagination supported"
    roles: [Auditor]
    code: 200
    input: ["action?", "resource_kind?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role or X-User-ID header"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted to invoke this endpoint per RBAC matrix"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID performs steps that must be separated (topology submit+approve, work-order assign-as-technician+verify)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-id resource does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state from which the requested transition is undefined"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH version header does not match current entity.version"

  - id: ERR_DMA_FROZEN
    http: 409
    condition: "DMA.status=FROZEN blocks mutations other than topology rollback / clock advance"

  - id: ERR_REVIEW_IN_PROGRESS
    http: 409
    condition: "Network already has a TopologyVersion in UNDER_REVIEW"

  - id: ERR_TOPOLOGY_ROLLBACK_BLOCKED
    http: 409
    condition: "Rollback would orphan an open WorkOrder whose target_segment_code does not exist in the target version"

  - id: ERR_DUPLICATE_READING
    http: 200
    condition: "Replay of (device_id, idempotency_key) returns the existing Reading idempotently (200, not 201, because no new resource created)"

  - id: ERR_INVESTIGATION_NO_SIGNAL
    http: 409
    condition: "Narrow requested but neither min_night_flow_lps nor water_balance_loss_lps could be computed"

  - id: ERR_TOPOLOGY_DANGLING_REFERENCE
    http: 422
    condition: "PipelineSegment endpoints not present in same topology version, or from == to"

  - id: ERR_DEVICE_UNMOUNTED
    http: 409
    condition: "Device activation requires mounted_on_node_code to exist in the active topology"

  - id: ERR_READING_TIMESTAMP_OUT_OF_RANGE
    http: 422
    condition: "Reading.observed_at outside [clock_now - 604800s, clock_now + 60s]"

  - id: ERR_READING_OUT_OF_RANGE
    http: 422
    condition: "raw_value outside Device.valid_range when strict_mode=true; otherwise reading is stored as ABNORMAL_OUT_OF_RANGE"

  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "WaterBalanceReport window length not in {3600, 86400, 604800}s or window_end <= window_start"

  - id: ERR_INSUFFICIENT_DATA
    http: 422
    condition: "Water balance report has zero input_volume_m3 or no ACCEPTED inlet readings in window"

  - id: ERR_DEVICE_CONFIG_INVALID
    http: 422
    condition: "polling_interval_s outside [30,3600] or valid_range_min >= valid_range_max"

  - id: ERR_WORK_ORDER_SEGMENT_MISSING
    http: 422
    condition: "target_segment_code not present in Network.active_topology_version_id"

  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed JSON, missing required field, type mismatch, or unknown enum value"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TopologyEngineer
    description: "Designs and submits pipeline topology versions; creates DMAs and PipelineNodes/Segments in DRAFT versions."
    identity: opaque
    exclusive_operations:
      - "POST /networks/{net}/topology-versions"
      - "POST /networks/{net}/topology-versions/{id}/nodes"
      - "POST /networks/{net}/topology-versions/{id}/segments"
      - "POST /networks/{net}/topology-versions/{id}/submit"
      - "POST /networks/{net}/dmas"
    shared_operations:
      - "GET /networks/{net}"
      - "GET /networks/{net}/topology-versions/{id}"
      - "GET /networks/{net}/dmas/{dma_id}"
      - "GET /networks/{net}/dmas"

  - name: TopologyApprover
    description: "Approves, rejects, or rolls back published topology versions; creates Networks. May NOT submit a version it then approves."
    identity: opaque
    exclusive_operations:
      - "POST /networks"
      - "POST /networks/{net}/topology-versions/{id}/approve"
      - "POST /networks/{net}/topology-versions/{id}/reject"
      - "POST /networks/{net}/topology-versions/{id}/rollback"
    shared_operations:
      - "GET /networks/{net}"
      - "GET /networks/{net}/topology-versions/{id}"

  - name: ControlOperator
    description: "Runs the live monitoring loop: ingests readings, acknowledges/resolves/suppresses alerts, opens and narrows investigations, dispatches technicians, runs water-balance reports, advances the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /networks/{net}/_clock/advance"
      - "POST /networks/{net}/devices"
      - "PATCH /networks/{net}/devices/{id}"
      - "POST /networks/{net}/devices/{id}/activate"
      - "POST /networks/{net}/devices/{id}/decommission"
      - "POST /networks/{net}/devices/{id}/readings"
      - "POST /networks/{net}/alerts/{id}/acknowledge"
      - "POST /networks/{net}/alerts/{id}/resolve"
      - "POST /networks/{net}/alerts/{id}/suppress"
      - "POST /networks/{net}/alerts/{id}/investigations"
      - "POST /networks/{net}/investigations/{id}/narrow"
      - "POST /networks/{net}/investigations/{id}/dispatch"
      - "POST /networks/{net}/dmas/{dma_id}/water-balance-reports"
    shared_operations:
      - "GET /networks/{net}, GET /devices/{id}, GET /alerts/{id}, GET /work-orders/{id}, GET /investigations/{id}, GET /dmas/{dma_id}, GET /dmas/{dma_id}/water-balance-reports, GET /devices/{id}/readings"

  - name: MaintenanceSupervisor
    description: "Owns the repair workflow: creates and assigns WorkOrders, verifies completed repairs. Cannot verify a WorkOrder where their own X-User-ID is the assigned technician (SoD)."
    identity: opaque
    exclusive_operations:
      - "POST /networks/{net}/work-orders"
      - "POST /networks/{net}/work-orders/{id}/assign"
      - "POST /networks/{net}/work-orders/{id}/cancel"
      - "POST /networks/{net}/work-orders/{id}/verify"
    shared_operations:
      - "GET /networks/{net}, GET /work-orders/{id}, GET /work-orders, GET /devices/{id}, GET /alerts/{id}, GET /investigations/{id}, GET /dmas/{dma_id}"

  - name: Technician
    description: "Field worker executing repair tasks. Identified by the X-User-ID stored on WorkOrder.assigned_technician_id."
    identity: opaque
    exclusive_operations:
      - "POST /networks/{net}/work-orders/{id}/request-parts"
      - "POST /networks/{net}/work-orders/{id}/start"
      - "POST /networks/{net}/work-orders/{id}/complete"
    shared_operations:
      - "GET /networks/{net}, GET /work-orders/{id}, GET /work-orders"

  - name: Auditor
    description: "Read-only auditor with access to AuditLog, SyncEvent, and historical resources. Cannot mutate."
    identity: opaque
    exclusive_operations:
      - "GET /networks/{net}/audit-logs"
      - "GET /networks/{net}/sync-events"
    shared_operations:
      - "GET on every read endpoint across the API"
