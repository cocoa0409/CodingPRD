# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Enumerates every testable claim of §1.1–§1.7 not already covered by §1.8.
# section/claim_type vocabulary per references/claim-extraction-guide.md.
# PART 1: entities / state_machines / calculations. (PART 2 appended below.)
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: project_creation_success
        claim_type: creation
        grounds: ["endpoints.POST /api/projects", entities.Project, state_machines.Project]
        distinguishing_aspect: "Valid create returns 201 with input echo plus system fields: status INTAKE, strike_count 0, version 1, contractor_id stamped from the acting Contractor identity."
        test_recipe:
          setup: ["one registered contractor and one onboarded homeowner"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C1", license_no: "LIC-C1" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C1", email: "hc1@x.com", phone: "c1" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
          trigger:
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "1 Corner Way", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id, proj_status: $.data.status, proj_ctr: $.data.contractor_id, proj_v: $.data.version, proj_strikes: $.data.strike_count } }
          assert:
            - "201; status == INTAKE; version == 1; strike_count == 0"
            - "contractor_id == ${ctr_id} (stamped from identity, never from body)"
            - "address/basement_sqft/base_contract_cents echoed; id is a prefix-less UUID"

      - name: project_missing_required_base_contract_returns_400
        claim_type: required_fields
        grounds: ["endpoints.POST /api/projects", "errors[ERR_INVALID_REQUEST]", "validations[priority=26]"]
        distinguishing_aspect: "Omitting required base_contract_cents yields ERR_INVALID_REQUEST (400) and persists nothing."
        test_recipe:
          setup: ["contractor and homeowner exist"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C2", license_no: "LIC-C2" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C2", email: "hc2@x.com", phone: "c2" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
          trigger:
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "2 Corner Way", basement_sqft: 800 }, as: Contractor, as_user_id: "${ctr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: assessment_kind_defaults_to_screening
        claim_type: defaults
        grounds: [entities.MoistureAssessment.fields.assessment_kind, state_machines.MoistureAssessment]
        distinguishing_aspect: "assessment_kind omitted on create defaults to SCREENING and the new entity starts in initial state DRAFT."
        test_recipe:
          setup: ["project in INTAKE"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C3", license_no: "LIC-C3" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C3", email: "hc3@x.com", phone: "c3" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "3 Corner Way", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_kind: $.data.assessment_kind, ma_status: $.data.status } }
          assert:
            - "assessment_kind == SCREENING (default applied)"
            - "status == DRAFT (initial state)"
            - "Project advanced INTAKE -> ASSESSMENT on first assessment creation"

      - name: allowance_remaining_equals_budget_at_creation
        claim_type: computed_fields
        grounds: [entities.AllowanceLine.fields.remaining_cents, "endpoints.POST /api/projects/{id}/allowance-lines"]
        distinguishing_aspect: "Computed remaining_cents at creation equals budgeted_cents (reserved/drawn/actual all zero); a client-sent remaining_cents would be rejected as unknown field."
        test_recipe:
          setup: ["project in INTAKE"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C4", license_no: "LIC-C4" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C4", email: "hc4@x.com", phone: "c4" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "4 Corner Way", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${proj_id}/allowance-lines", payload: { name: "LIGHTING", budgeted_cents: 75000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { al_rem: $.data.remaining_cents, al_res: $.data.reserved_cents, al_drawn: $.data.drawn_cents, al_sel: $.data.selected } }
          assert:
            - "remaining_cents == 75000, reserved_cents == 0, drawn_cents == 0, selected == false, actual_cents == 0"

      - name: site_log_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.DailySiteLog, "endpoints.POST /api/projects/{id}/site-logs"]
        distinguishing_aspect: "DailySiteLog is common_fields:false — the create response carries id and created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["project IN_PROGRESS with an assigned PAINT phase started; clock 2026-06-05"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C5", license_no: "LIC-C5" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C5", email: "hc5@x.com", phone: "c5" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/subcontractors", payload: { name: "Paint C5", trade: "PAINT" }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "5 Corner Way", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "x", mechanical_relocations: [] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp_id: $.data.id } }
            - { call: "POST /api/design-packages/${dp_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp_id}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "POST /api/projects/${proj_id}/permits", payload: { bedroom_count: 0, windows: [], ceiling_height_in: 86, finished_area_sqft: 800, low_area_sqft: 100, prohibited_area_sqft: 0 }, as: Contractor, as_user_id: "${ctr_id}", captures: { pm_id: $.data.id } }
            - { call: "POST /api/permits/${pm_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/permits/${pm_id}/record-decision", payload: { outcome: "ISSUED" }, as: Inspector }
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "PAINT", zone: "REC", start_date: "2026-06-01", end_date: "2026-06-10", crew_count: 2, subcontractor_id: "${sub_id}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { wp_id: $.data.id } }
            - { call: "POST /api/work-phases/${wp_id}/start", payload: {}, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/projects/${proj_id}/site-logs", payload: { work_date: "2026-06-05", containment_intact: true, hepa_run_hours: 5, noise_db_max: 55, cleanup_completed: true }, as: Subcontractor, as_user_id: "${sub_id}", captures: { log_id: $.data.id, log_violation: $.data.violation, log_strike: $.data.strike_applied } }
          assert:
            - "201; response contains id and created_at; no version or updated_at key present"
            - "violation == false and strike_applied == false for a compliant log (noise 55 <= 65)"

      - name: project_create_extra_field_rejected
        claim_type: system_fields
        grounds: ["endpoints.POST /api/projects", entities.Project.fields.contractor_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Sending contractor_id (a system-stamped field) in the create body is rejected as an unknown input with ERR_INVALID_REQUEST — system fields are never client-writable."
        test_recipe:
          setup: ["contractor and homeowner exist"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C6", license_no: "LIC-C6" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C6", email: "hc6@x.com", phone: "c6" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
          trigger:
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", contractor_id: "${ctr_id}", address: "6 Corner Way", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400; no project persisted"

      - name: subcontractor_invalid_trade_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Subcontractor.fields.trade, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "trade outside the declared enum (ROOFING) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/subcontractors", payload: { name: "Roof Co", trade: "ROOFING" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: project_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but non-existent project UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["one contractor exists (auth only)"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C8", license_no: "LIC-C8" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
          trigger:
            - { call: "GET /api/projects/00000000-0000-4000-8000-000000000000", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: child_create_under_missing_parent_returns_404
        claim_type: parent_relationships
        grounds: ["endpoints.POST /api/projects/{id}/moisture-assessments", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a child under a non-existent project id fails existence left-to-right at the parent segment with ERR_NOT_FOUND."
        test_recipe:
          setup: ["one contractor exists"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C9", license_no: "LIC-C9" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
          trigger:
            - { call: "POST /api/projects/00000000-0000-4000-8000-000000000000/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 0, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: list_projects_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /api/projects"]
        distinguishing_aspect: "GET /api/projects with limit=1 over two projects returns one item plus pagination fields total_count == 2 and has_more == true; default limit is 10."
        test_recipe:
          setup: ["contractor with two homeowners and two projects"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C10", license_no: "LIC-C10" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C10a", email: "a@x.com", phone: "a" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_a: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C10b", email: "b@x.com", phone: "b" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_b: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_a}", address: "10a Corner Way", basement_sqft: 700, base_contract_cents: 3000000 }, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_b}", address: "10b Corner Way", basement_sqft: 710, base_contract_cents: 3100000 }, as: Contractor, as_user_id: "${ctr_id}" }
          trigger:
            - { call: "GET /api/projects?limit=1&offset=0", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
          assert:
            - "response_type == array; data has exactly 1 item; total_count == 2; has_more == true"
            - "filter homeowner_id=${ho_a} returns total_count == 1 (FK reverse-reachability via filtered list)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: design_approve_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DesignPackage.SUBMITTED_to_APPROVED, "validations[priority=8]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVE is only listed from SUBMITTED; calling it on a DRAFT package returns ERR_INVALID_STATE and leaves revision_number at 1."
        test_recipe:
          setup: ["project in ASSESSMENT with ACCEPTED assessment and a DRAFT design package"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C11", license_no: "LIC-C11" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C11", email: "hc11@x.com", phone: "c11" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "11 Corner Way", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "x", mechanical_relocations: [] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp_id: $.data.id } }
          trigger:
            - { call: "POST /api/design-packages/${dp_id}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409; package remains DRAFT"

      - name: change_order_approve_then_withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ChangeOrder, "validations[priority=9]", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "APPROVED is terminal for ChangeOrder; a subsequent withdraw returns ERR_ALREADY_TERMINAL and the price impact is not rolled back."
        test_recipe:
          setup: ["project INTAKE base 4000000; CO created with current version and approved"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C12", license_no: "LIC-C12" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C12", email: "hc12@x.com", phone: "c12" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "12 Corner Way", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id, v0: $.data.version } }
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "add shelf", kind: "ADD", scope_items: [{ description: "shelf", qty: 1, unit_cost_cents: 10000 }], allowance_draws: [], expected_project_version: "${v0}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { co_id: $.data.id, co_delta: $.data.price_delta_cents } }
            - { call: "POST /api/change-orders/${co_id}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
          trigger:
            - { call: "POST /api/change-orders/${co_id}/withdraw", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL, http 409"
            - "ChangeOrder.${co_id} remains APPROVED; price_delta_cents == 11500 stays applied to the project"

      - name: resume_restores_blocked_phases_and_resets_strikes
        claim_type: side_effect_execution
        grounds: [state_machines.Project.SUSPENDED_to_IN_PROGRESS, state_machines.WorkPhase.BLOCKED_to_IN_PROGRESS, entities.Project.fields.last_resumed_at]
        distinguishing_aspect: "Resume is the compensating transition of the suspension cascade: BLOCKED phases restore pre_block_status exactly (IN_PROGRESS here) and strike_count recomputes to 0 with the window re-anchored at last_resumed_at."
        test_recipe:
          setup: ["project SUSPENDED after three in-window violations; one PAINT phase was IN_PROGRESS when blocked"]
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC C13", license_no: "LIC-C13" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H C13", email: "hc13@x.com", phone: "c13" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/subcontractors", payload: { name: "Paint C13", trade: "PAINT" }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "13 Corner Way", basement_sqft: 800, base_contract_cents: 4000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "x", mechanical_relocations: [] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp_id: $.data.id } }
            - { call: "POST /api/design-packages/${dp_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp_id}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "POST /api/projects/${proj_id}/permits", payload: { bedroom_count: 0, windows: [], ceiling_height_in: 86, finished_area_sqft: 800, low_area_sqft: 100, prohibited_area_sqft: 0 }, as: Contractor, as_user_id: "${ctr_id}", captures: { pm_id: $.data.id } }
            - { call: "POST /api/permits/${pm_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/permits/${pm_id}/record-decision", payload: { outcome: "ISSUED" }, as: Inspector }
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "PAINT", zone: "REC", start_date: "2026-06-01", end_date: "2026-06-12", crew_count: 2, subcontractor_id: "${sub_id}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { wp_id: $.data.id } }
            - { call: "POST /api/work-phases/${wp_id}/start", payload: {}, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/projects/${proj_id}/site-logs", payload: { work_date: "2026-06-03", containment_intact: false, hepa_run_hours: 3, noise_db_max: 60, cleanup_completed: true }, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "POST /api/projects/${proj_id}/site-logs", payload: { work_date: "2026-06-04", containment_intact: false, hepa_run_hours: 3, noise_db_max: 60, cleanup_completed: true }, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "POST /api/projects/${proj_id}/site-logs", payload: { work_date: "2026-06-05", containment_intact: false, hepa_run_hours: 3, noise_db_max: 60, cleanup_completed: true }, as: Subcontractor, as_user_id: "${sub_id}" }
          trigger:
            - { call: "POST /api/projects/${proj_id}/resume", payload: { remediation_note: "reinstalled containment, crew retrained" }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_status: $.data.status, strikes: $.data.strike_count } }
            - { call: "GET /api/work-phases/${wp_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { wp_status: $.data.status, wp_pre: $.data.pre_block_status } }
          assert:
            - "Project.${proj_id}: status == IN_PROGRESS, strike_count == 0, last_resumed_at == 2026-06-05T00:00:00Z"
            - "WorkPhase.${wp_id}: status == IN_PROGRESS (restored from pre_block_status), pre_block_status null"

      - name: phase_predecessor_promotion_on_completion
        claim_type: valid_transition
        grounds: [state_machines.WorkPhase.PLANNED_to_READY, calculations.phase_sequence_gate]
        distinguishing_aspect: "Bubble-up gate: phase created with an unfinished predecessor stays PLANNED; completing the predecessor promotes it to READY (topological order, no manual trigger)."
