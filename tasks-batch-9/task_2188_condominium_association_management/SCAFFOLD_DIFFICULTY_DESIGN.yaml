              as: CommunityManager
              captures: { mtg_h1: "$.data.id" }
            - call: "POST /board-meetings/${mtg_h1}/send-notice"
              payload: {}
              as: CommunityManager
            - call: "POST /violation-cases"
              payload: { association_id: "${assoc_id}", unit_id: "${ua}", rule_code: "PARKING", reported_by_owner_id: "${tr}" }
              as: CommunityManager
              captures: { case1: "$.data.id" }
            - call: "POST /violation-cases/${case1}/send-notice"
              payload: {}
              as: CommunityManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T00:00:00Z" }
              as: CommunityManager
            - call: "POST /violation-cases/${case1}/schedule-hearing"
              payload: { hearing_meeting_id: "${mtg_h1}", hearing_slot_start: "2026-10-20T18:00:00Z" }
              as: BoardDirector
              as_user_id: "${d1}"
            - call: "POST /associations/${assoc_id}/board-meetings"
              payload: { scheduled_start: "2026-11-10T18:00:00Z", scheduled_end: "2026-11-10T21:00:00Z", agenda_kinds: ["HEARING"] }
              as: CommunityManager
              captures: { mtg_h2: "$.data.id" }
            - call: "POST /board-meetings/${mtg_h2}/send-notice"
              payload: {}
              as: CommunityManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T18:00:00Z" }
              as: CommunityManager
            - call: "POST /board-meetings/${mtg_h1}/convene"
              payload: { attending_owner_ids: ["${d1}", "${d2}", "${tr}"] }
              as: CommunityManager
            - call: "POST /violation-cases/${case1}/hearing-decision"
              payload: { outcome: "FINE" }
              as: BoardDirector
              as_user_id: "${d1}"
              captures: { fine_entry: "$.data.fine_entry_id" }
            - call: "POST /violation-cases/${case1}/appeal"
              payload: {}
              as: UnitOwner
              as_user_id: "${oa}"
            - call: "POST /violation-cases/${case1}/schedule-hearing"
              payload: { hearing_meeting_id: "${mtg_h2}", hearing_slot_start: "2026-11-10T18:00:00Z" }
              as: BoardDirector
              as_user_id: "${d1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-10T18:00:00Z" }
              as: CommunityManager
            - call: "POST /board-meetings/${mtg_h2}/convene"
              payload: { attending_owner_ids: ["${d1}", "${d2}", "${tr}"] }
              as: CommunityManager
          trigger:
            - call: "POST /violation-cases/${case1}/hearing-decision"
              payload: { outcome: "VACATE" }
              as: BoardDirector
              as_user_id: "${d2}"
          assert:
            - "PRE-FINE baseline: Unit.${ua}.balance_due_cents == 8000, delinquency_stage == LATE_NOTICE, voting_eligible == true; SpecialAssessment.${sa1}.eligible_weight_bp == 10000"
            - "POST-FINE baseline (right after the round-1 FINE decision at 2026-10-20T18:00:00Z): ViolationCase.${case1}.fine_tier == 1 and fine_amount_cents == 5000 (prior_count 0), the FINE LedgerEntry ${fine_entry} has amount_cents == 5000, bucket FINE, due_on == 2026-11-19T18:00:00Z and status POSTED; appeal_deadline_at == 2026-11-19T18:00:00Z; Unit.${ua}.balance_due_cents == 13000, oldest_unpaid_age_days == 202, delinquency_stage == LIEN_FILED, lien_recorded_at == 2026-10-20T18:00:00Z, voting_eligible == false; SpecialAssessment.${sa1}.eligible_weight_bp == 4000 and Vote.${ballot_a}.counted == false"
            - "APPEAL baseline: ViolationCase.${case1}.status == APPEALED with hearing_meeting_id null and hearing_slot_start null, BoardMeeting.${mtg_h1}.hearing_slot_count back to 0, and the FINE entry ${fine_entry} STILL POSTED with balance_due_cents still 13000 (an appeal is not a compensation)"
            - "TRIGGER: HTTP 200 with ViolationCase.${case1}.status == FINE_VACATED, hearing_round == 2 and decision_owner_id == ${d2}"
            - "COMPENSATION hop 1: LedgerEntry.${fine_entry}.status == REVERSED and exactly one REVERSAL LedgerEntry exists with reverses_entry_id == ${fine_entry}, amount_cents == -5000 and status == POSTED"
            - "COMPENSATION hop 2 (INVARIANT L): Unit.${ua}.balance_due_cents == 8000 — bit-for-bit the pre-fine value — and equals the signed sum over ALL of the unit's LedgerEntry rows including REVERSED ones: 8000 + 5000 + (-5000) == 8000"
            - "COMPENSATION hop 2 derived state: Unit.${ua}.oldest_unpaid_age_days == 223 (2026-04-01 to 2026-11-10), delinquency_stage == LATE_NOTICE (223 >= 30 but 8000 < 12000), lien_recorded_at == null, voting_eligible == true"
            - "COMPENSATION hop 3: SpecialAssessment.${sa1}.approval_status == BALLOTING with eligible_weight_bp == 10000 and Vote.${ballot_a}.counted == true"
            - "hop 4 correctly does NOT fire: Unit.${ua} has no ResaleCertificate in status ISSUED, so no certificate is voided and no RESALE_FEE reversal appears; Unit.${ua} ends with exactly 3 LedgerEntry rows"
            - "LedgerEntry.${cc_entry}.status == POSTED and amount_cents == 8000 — the compensation touched only the fine pair"
            - "UPHOLD CONTRAST (the compensation is specific to VACATE): a twin case on unit ${ub} walked identically but decided UPHOLD on appeal leaves its FINE entry POSTED, Unit.${ub}.balance_due_cents at the post-fine value, and posts no REVERSAL — so INVARIANT L holds there too, at the HIGHER balance"
            - "REPEAT-CHAIN CONTRAST: a NEW PARKING case opened on unit ${ua} after the vacatur, noticed and fined, computes fine_tier == 1 with fine_amount_cents == 5000 — the FINE_VACATED case is never written as its prior_case_id, so a vacated fine cannot inflate a later tier to 10000"

      - name: work_order_lifecycle_conserves_contract_authorization_cents_invariant_e
        grounds:
          - calculations.encumbrance_conservation_invariant
          - state_machines.MaintenanceWorkOrder.SCHEDULED_to_CANCELLED
          - state_machines.MaintenanceWorkOrder.COMPLETED_to_INVOICED
          - state_machines.VendorContract.ACTIVE_to_TERMINATED
          - concurrency_rules[work-order-create-stale-contract]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: contract authorization cents per VendorContract
          (INVARIANT E), where committed_cents must always equal the sum of encumbered_cents over
          orders in {SCHEDULED, IN_PROGRESS, ON_HOLD, COMPLETED}. Three deliberately non-round
          encumbrances (1234567 + 900000 + 765433 == 2900000) make every release checkable to the
          cent. The instance separates three easily-confused behaviours: a HOLD releases nothing
          (ON_HOLD stays inside the summation set), a CANCEL releases exactly the estimate, and an
          INVOICE removes estimated_cost_cents (1234567) from committed_cents while adding
          final_cost_cents (1300000) to invoiced_cents — an implementation that removes the final
          cost instead would leave 834567. A second cancel of the same order must release nothing
          twice.
