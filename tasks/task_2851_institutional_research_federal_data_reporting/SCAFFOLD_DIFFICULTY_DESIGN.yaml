# §1.8 Scaffold Difficulty Design — Institutional Research & Federal Data Reporting
# Test-targeting index for tasks/task_2851_institutional_research_federal_data_reporting.
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1-§1.7; deleting this file leaves
# the declared behaviour unchanged. All numeric asserts were computed against the §1.3
# formulas and their constants.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cohort_rate_federal_adjusted_vs_ranking_gross_diverge_15pp
        grounds:
          - calculations.cohort_rate_variants
          - entities.CohortDefinition.fields.federal_rate_pct
          - entities.CohortDefinition.fields.ranking_rate_pct
          - entities.CohortMember.fields.exclusion_status
          - state_machines.CohortMember.CLAIMED_to_APPROVED
        distinguishing_aspect: |
          One approved allowable exclusion on a non-completer leaves the federal variant's
          denominator (adjusted_count 4) but stays in the ranking variant's denominator
          (initial_count 5), so the same five members yield federal_rate_pct 75.0 and
          ranking_rate_pct 60.0 — a 15.0 pp divergence on identical roster data.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED (census date 2026-10-15 reached, logical clock at 2026-11-01T00:00:00Z)."
            - "A DRAFT GRAD_RATE_150 cohort for entry term FALL2020 holds five members: S001-S003 COMPLETED_150, S004-S005 STILL_ENROLLED."
            - "S005 has a CLAIMED DECEASED exclusion awaiting review; no cohort is locked, so no restatement cascade can fire."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 5, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "a1b2c3d4e5f60001", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/cohorts"
              payload: { cohort_type: "GRAD_RATE_150", entry_term: "FALL2020", publication_metric_key: "GRAD_RATE_150_FALL2020" }
              as: RegistrarOfficer
              captures: { coh: $.data.id }
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S001", entry_status: "FULL_TIME", outcome: "COMPLETED_150" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S002", entry_status: "FULL_TIME", outcome: "COMPLETED_150" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S003", entry_status: "FULL_TIME", outcome: "COMPLETED_150" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S004", entry_status: "FULL_TIME", outcome: "STILL_ENROLLED" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S005", entry_status: "FULL_TIME", outcome: "STILL_ENROLLED" }
              as: RegistrarOfficer
              captures: { m5: $.data.id }
            - call: "POST /ir/cohort-members/${m5}/exclusion-claim"
              payload: { exclusion_code: "DECEASED", exclusion_evidence_note: "Death certificate on file, dated 2021-03-04." }
              as: RegistrarOfficer
              as_user_id: "registrar-1"
          trigger:
            - call: "POST /ir/cohort-members/${m5}/exclusion-review"
              payload: { decision: "APPROVE", review_note: "Allowable exclusion approved on documentary evidence." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "GET /ir/cohorts/${coh}/rate-summary"
              payload: {}
              as: IRAnalyst
          assert:
            - "CohortMember.${m5}.exclusion_status == APPROVED"
            - "CohortDefinition.${coh}.initial_count == 5"
            - "CohortDefinition.${coh}.exclusion_count == 1"
            - "CohortDefinition.${coh}.adjusted_count == 4"
            - "CohortDefinition.${coh}.completers_count == 3"
            - "CohortDefinition.${coh}.federal_rate_pct == 75.0"
            - "CohortDefinition.${coh}.ranking_rate_pct == 60.0"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.federal_rate_pct == 75.0"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.ranking_rate_pct == 60.0"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.rate_divergence_pp == 15.0"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.retained_count == 5"
            - "CohortDefinition.${coh}.status == DRAFT (no cascade fired: the cohort was never locked)"
      - name: disclosure_small_cell_suppression_vs_controlled_rounding_variants
        grounds:
          - calculations.disclosure_avoidance
          - entities.DataRequest.fields.avoidance_method
          - entities.DisclosureCell.fields.suppression_state
          - entities.DisclosureCell.fields.released_count
          - state_machines.DisclosureCell.PENDING_to_PRIMARY_SUPPRESSED
          - state_machines.DisclosureCell.PENDING_to_COMPLEMENTARY_SUPPRESSED
        distinguishing_aspect: |
          The identical five-cell crosstab {ASIAN 3, BLACK 12, HISPANIC 20, WHITE 45,
          TWO_OR_MORE 0} screens to released_cell_count 3 / suppressed_cell_count 2 under
          SMALL_CELL_SUPPRESSION (ASIAN primary, BLACK complementary) but to
          released_cell_count 5 / suppressed_cell_count 0 with perturbed counts
          5, 10, 20, 45, 0 under CONTROLLED_ROUNDING.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is FROZEN: one ENROLLMENT component (TOTAL_HEADCOUNT 12000 against prior-year 12000, so prepare raises no edit check) is CERTIFIED."
            - "DataRequest A: MEDIA requester, avoidance_method SMALL_CELL_SUPPRESSION, min_cell_size 5, five RACE_ETHNICITY cells 3 / 12 / 20 / 45 / 0."
            - "DataRequest B: INTERNAL requester, avoidance_method CONTROLLED_ROUNDING, min_cell_size 5, the same five raw counts."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 12000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "a1b2c3d4e5f60002", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 12000, prior_year_value: 12000, source_field_path: "sis.enrollment.total_headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the fall enrollment component matches the census-locked extract." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/reporting-cycles/${cyc}/freeze"
              payload: {}
              as: IRDirector
            - call: "POST /ir/reporting-cycles/${cyc}/data-requests"
              payload: { requester_org: "State Capital Press Bureau", requester_type: "MEDIA", requested_metric_key: "HEADCOUNT_BY_RACE", avoidance_method: "SMALL_CELL_SUPPRESSION", min_cell_size: 5 }
              as: DisclosureOfficer
              captures: { req_a: $.data.id }
            - call: "POST /ir/data-requests/${req_a}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "ASIAN", raw_count: 3 }
              as: DisclosureOfficer
              captures: { a_asian: $.data.id }
            - call: "POST /ir/data-requests/${req_a}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "BLACK", raw_count: 12 }
              as: DisclosureOfficer
              captures: { a_black: $.data.id }
            - call: "POST /ir/data-requests/${req_a}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "HISPANIC", raw_count: 20 }
              as: DisclosureOfficer
              captures: { a_hispanic: $.data.id }
            - call: "POST /ir/data-requests/${req_a}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "WHITE", raw_count: 45 }
              as: DisclosureOfficer
              captures: { a_white: $.data.id }
            - call: "POST /ir/data-requests/${req_a}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "TWO_OR_MORE", raw_count: 0 }
              as: DisclosureOfficer
              captures: { a_two: $.data.id }
            - call: "POST /ir/reporting-cycles/${cyc}/data-requests"
              payload: { requester_org: "Regional Higher-Ed Research Consortium", requester_type: "INTERNAL", requested_metric_key: "HEADCOUNT_BY_RACE", avoidance_method: "CONTROLLED_ROUNDING", min_cell_size: 5 }
              as: DisclosureOfficer
              captures: { req_b: $.data.id }
            - call: "POST /ir/data-requests/${req_b}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "ASIAN", raw_count: 3 }
              as: DisclosureOfficer
              captures: { b_asian: $.data.id }
            - call: "POST /ir/data-requests/${req_b}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "BLACK", raw_count: 12 }
              as: DisclosureOfficer
              captures: { b_black: $.data.id }
            - call: "POST /ir/data-requests/${req_b}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "HISPANIC", raw_count: 20 }
              as: DisclosureOfficer
              captures: { b_hispanic: $.data.id }
            - call: "POST /ir/data-requests/${req_b}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "WHITE", raw_count: 45 }
              as: DisclosureOfficer
              captures: { b_white: $.data.id }
            - call: "POST /ir/data-requests/${req_b}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "TWO_OR_MORE", raw_count: 0 }
              as: DisclosureOfficer
              captures: { b_two: $.data.id }
          trigger:
            - call: "POST /ir/data-requests/${req_a}/screen"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "disclosure-1"
            - call: "POST /ir/data-requests/${req_b}/screen"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "disclosure-1"
          assert:
            - "DataRequest.${req_a}.status == SCREENED"
            - "DisclosureCell.${a_asian}.suppression_state == PRIMARY_SUPPRESSED and released_count is null"
            - "DisclosureCell.${a_black}.suppression_state == COMPLEMENTARY_SUPPRESSED and released_count is null"
            - "DisclosureCell.${a_hispanic}.suppression_state == RELEASED and released_count == 20"
            - "DisclosureCell.${a_white}.suppression_state == RELEASED and released_count == 45"
            - "DisclosureCell.${a_two}.suppression_state == RELEASED and released_count == 0"
            - "DataRequest.${req_a}.released_cell_count == 3"
            - "DataRequest.${req_a}.suppressed_cell_count == 2"
            - "DataRequest.${req_a}.residual_disclosure_risk == false"
            - "DataRequest.${req_b}.status == SCREENED"
            - "DisclosureCell.${b_asian}.suppression_state == RELEASED and released_count == 5"
            - "DisclosureCell.${b_black}.suppression_state == RELEASED and released_count == 10"
            - "DisclosureCell.${b_hispanic}.suppression_state == RELEASED and released_count == 20"
            - "DisclosureCell.${b_white}.suppression_state == RELEASED and released_count == 45"
            - "DisclosureCell.${b_two}.suppression_state == RELEASED and released_count == 0"
            - "DataRequest.${req_b}.released_cell_count == 5"
            - "DataRequest.${req_b}.suppressed_cell_count == 0"
            - "DataRequest.${req_b}.residual_disclosure_risk == false"
  - rule_id: combinatorial_formula
    instances:
      - name: finance_core_expense_per_fte_rounds_each_category_before_summing
        grounds:
          - calculations.core_expense_per_fte_cents
          - entities.SurveyComponent.fields.core_expense_per_fte_cents
          - entities.ComponentMetric.fields.reported_value
          - state_machines.SurveyComponent.DRAFT_to_PREPARED
        distinguishing_aspect: |
          The pinned order rounds each of the three functional expense categories to whole
          cents before summing (166668 + 83335 + 41668 == 291671); the plausible
          sum-then-round order gives 291670, so the single-cent gap falsifies any
          implementation that reorders the rounding step, and 500007 / 6 == 83334.5 also
          pins round_half_up rather than banker's rounding.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with one FINANCE census extract registered (coverage 2026-07-01 to 2027-06-30)."
            - "A DRAFT FINANCE component carries exactly four metrics: INSTRUCTION_EXPENSES_CENTS 1000007, ACADEMIC_SUPPORT_EXPENSES_CENTS 500007, STUDENT_SERVICES_EXPENSES_CENTS 250007, FTE_ENROLLMENT 6."
            - "No prior_year_value is supplied on any metric and every reported_value is above zero, so prepare raises no edit check."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "FINANCE", record_count: 4, coverage_start_date: "2026-07-01", coverage_end_date: "2027-06-30", checksum: "a1b2c3d4e5f60003", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff}", component_code: "FINANCE" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "INSTRUCTION_EXPENSES_CENTS", reported_value: 1000007, source_field_path: "fin.gl.instruction_total" }
              as: IRAnalyst
              captures: { m_instr: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "ACADEMIC_SUPPORT_EXPENSES_CENTS", reported_value: 500007, source_field_path: "fin.gl.academic_support_total" }
              as: IRAnalyst
              captures: { m_acad: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "STUDENT_SERVICES_EXPENSES_CENTS", reported_value: 250007, source_field_path: "fin.gl.student_services_total" }
              as: IRAnalyst
              captures: { m_svc: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "FTE_ENROLLMENT", reported_value: 6, source_field_path: "sis.enrollment.fte" }
              as: IRAnalyst
              captures: { m_fte: $.data.id }
          trigger:
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
          assert:
            - "SurveyComponent.${comp}.core_expense_per_fte_cents == 291671"
            - "SurveyComponent.${comp}.core_expense_per_fte_cents != 291670 (the sum-then-round order is a wrong answer)"
            - "SurveyComponent.${comp}.prep_status == PREPARED"
            - "SurveyComponent.${comp}.edit_status == CLEARED"
            - "SurveyComponent.${comp}.mapping_coverage_pct == 100.0"
            - "SurveyComponent.${comp}.fatal_open_count == 0"
            - "GET /ir/edit-checks?component_id=${comp} -> data has length 0"
            - "ComponentMetric.${m_acad}.variance_pct is null"
      - name: submission_reconciliation_allowance_tier_derives_from_raw_delta_only
        grounds:
          - calculations.submission_reconciliation
          - entities.ExternalSubmission.fields.raw_delta_pct
          - entities.ExternalSubmission.fields.allowance_pct
          - entities.ExternalSubmission.fields.effective_delta_pct
          - entities.ExternalSubmission.fields.tolerance_pct
          - state_machines.ExternalSubmission.DRAFT_to_RECONCILED
        distinguishing_aspect: |
          The allowance tier is selected once from the unadjusted raw_delta_pct 1.40
          (tier 2, allowance 0.50, effective 0.90 <= CONSORTIUM tolerance 1.00 -> RECONCILED);
          re-tiering the reduced 0.90 into the sub-1.00 band would yield allowance 0.00,
          effective 1.40 and status VARIANCE_HOLD, so the verdict itself distinguishes the
          single-pass evaluation from a fixed-point iteration.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED; its ENROLLMENT component is CERTIFIED with TOTAL_HEADCOUNT reported_value 1000 (prior-year 1000, so prepare raises no edit check)."
            - "A DRAFT ExternalSubmission targets a CONSORTIUM recipient with metric_key TOTAL_HEADCOUNT at reported_value 1014."
            - "Logical clock at 2026-11-01T00:00:00Z, before the 2027-02-15T23:59:59Z collection deadline."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "a1b2c3d4e5f60004", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.total_headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the fall enrollment headcount as reported to the federal collection." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/external-submissions"
              payload: { cycle_id: "${cyc}", component_id: "${comp}", target_type: "CONSORTIUM", target_name: "Regional Higher-Ed Consortium", metric_key: "TOTAL_HEADCOUNT", reported_value: 1014 }
              as: IRAnalyst
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /ir/external-submissions/${sub}/reconcile"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
          assert:
            - "ExternalSubmission.${sub}.federal_value == 1000"
            - "ExternalSubmission.${sub}.raw_delta_pct == 1.40"
            - "ExternalSubmission.${sub}.allowance_pct == 0.50"
            - "ExternalSubmission.${sub}.effective_delta_pct == 0.90"
            - "ExternalSubmission.${sub}.tolerance_pct == 1.00"
            - "ExternalSubmission.${sub}.status == RECONCILED"
            - "ExternalSubmission.${sub}.status != VARIANCE_HOLD (re-tiering the reduced delta is a wrong answer)"
  - rule_id: non_linear_state_machine
    instances:
      - name: cycle_posture_loops_frozen_reopened_census_locked_frozen_again
        grounds:
          - state_machines.ReportingCycle.FROZEN_to_REOPENED
          - state_machines.ReportingCycle.REOPENED_to_CENSUS_LOCKED
          - state_machines.ReportingCycle.CENSUS_LOCKED_to_FROZEN
          - entities.ReportingCycle.fields.reopen_count
          - entities.ReportingCycle.fields.snapshot_posture
          - calculations.cycle_active_record_count
        distinguishing_aspect: |
          The cycle re-enters CENSUS_LOCKED and FROZEN a second time through REOPENED —
          a genuine loop, not a forward-only ladder — and the second lap is distinguishable
          from the first by reopen_count == 1, by active_record_count == 2100 across the two
          LOCKED extracts, and by the component carrying two EditCheck rows of which the
          first-lap one is VOIDED.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 reached FROZEN once: extract EX-1 (ENROLLMENT, 2026-09-01 to 2026-10-15, record_count 1000) was registered and census-locked, and the ENROLLMENT component was prepared, explained, adjudicated ACCEPT and CERTIFIED."
            - "The component's single metric is TOTAL_HEADCOUNT 1100 against prior-year 1000, i.e. a 10.0 pct variance that raises one WARNING edit check on every prepare."
            - "Logical clock at 2026-11-01T00:00:00Z throughout, before the collection deadline."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "a1b2c3d4e5f60005", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
