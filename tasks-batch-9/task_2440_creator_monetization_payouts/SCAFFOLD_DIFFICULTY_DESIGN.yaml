            - "hop 1: ${ap_state} == UPHELD and ${ap_by} == 'reviewer-r2' and Appeal.${ap_id}.decided_at == '2026-08-01T00:00:00.000Z' and revision_round == 0"
            - "hop 2: ContentItem.${ci_id}.suitability_rating == GREEN and monetization_state == MONETIZED and rating_source == APPEAL"
            - "hop 2: ContentItem.${ci_id}.last_rated_by_user_id == null and open_appeal_count == 0"
            - "hop 3: RevenueEvent.${ev1_id}.status == ACCRUED and effective_share_bps == 8000 and creator_share_cents == 8000 and suitability_rating_at_accrual == GREEN"
            - "hop 3: RevenueEvent.${ev2_id}.status == ACCRUED and effective_share_bps == 8000 and creator_share_cents == 4000"
            - "hop 4: GET /monetization/creators/${cr_id}/ledger-entries?entry_type=ACCRUAL_RESTORE returns exactly two rows: amount_cents 8000 with balance_after_cents 8000 for source_id ${ev1_id}, then amount_cents 4000 with balance_after_cents 12000 for source_id ${ev2_id}"
            - "Creator.${cr_id}.ledger_balance_cents == 12000 (exactly the pre-rating value)"
