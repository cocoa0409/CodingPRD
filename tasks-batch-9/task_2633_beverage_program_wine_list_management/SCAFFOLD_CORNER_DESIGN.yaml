              as: DistributorRep
              as_user_id: "${d1_id}"
              captures: { off_id: $.data.id, off_v1: $.data.version }
          trigger:
            - call: "POST /beverage-program/allocation-offers/${off_id}/claims"
              payload: { venue_id: "${v1_id}", requested_bottles: 11, expected_offer_version: "${off_v1}" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/allocation-offers/${off_id}/claims"
              payload: { venue_id: "${v1_id}", requested_bottles: 10, expected_offer_version: "${off_v1}" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { c1_id: $.data.id }
            - call: "GET /beverage-program/allocation-offers/${off_id}"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
