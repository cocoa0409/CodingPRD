  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_half_open_windows_allow_adjacency_reject_intersection
        grounds:
          - validations.priority_8_business_temporal
          - errors.ERR_APPOINTMENT_WINDOW_OVERLAP
          - entities.AgentAppointment.fields.effective_end
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) with adjacency allowed.
          On AgentAppointment: [2026-01-01, 2026-06-01) then
          [2026-06-01, 2026-12-01) is legal (end == start touches), while
          [2026-03-01, 2026-04-01) is rejected as a strict intersection.
          Resource: (agent, state, line) triple.
        test_recipe:
          setup:
            - "Logical clock 2026-01-01T00:00:00Z. Agent A created (still APPLICANT — appointment creation does not require appointment status APPOINTED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /agents"
              payload: { agency_name: "Hill Country Insurance", principal_name: "A. Reyes", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { agent_a: $.data.id }
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-06-01T00:00:00Z" }
              as: UnderwritingReviewer
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-12-01T00:00:00Z" }
              as: UnderwritingReviewer
              captures: { appt2: $.data.id }
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: UnderwritingReviewer
              captures: { err: $.data.error_id }
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "OK", line_of_business: "AUTO", effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: UnderwritingReviewer
              captures: { appt3: $.data.id }
          assert:
            - "the adjacent appointment succeeds: AgentAppointment.${appt2}.status == ACTIVE (half-open adjacency end == start is allowed)"
            - "the strictly-intersecting appointment fails with 409 error_id == ERR_APPOINTMENT_WINDOW_OVERLAP"
            - "the same window in a DIFFERENT state (OK) succeeds: AgentAppointment.${appt3}.status == ACTIVE (overlap is scoped to (agent, state, line))"

      - name: rate_feed_windows_require_24h_buffer_touching_rejected
        grounds:
          - validations.priority_8_business_temporal
          - errors.ERR_FEED_WINDOW_GAP_VIOLATION
          - errors.ERR_FEED_WINDOW_OVERLAP
        distinguishing_aspect: |
          Different interval semantics from appointments: feed windows for
          (rater, product) must be non-overlapping AND separated by >= 24h on
          BOTH sides — touching windows (gap 0) are rejected, a 23h gap is
          rejected, and exactly 24h is allowed. Distinct resource entity
          (RateFeedPublication) and distinct geometry (buffer vs adjacency).
        test_recipe:
          setup:
            - "Logical clock 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Rater R with F1 created [2026-02-01T00:00:00Z, 2026-03-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /products"
              payload: { product_code: "P-AUTO", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { LIABILITY: { BASIC: 50000 } }, min_premium_cents: 0 }
              as: RatingManager
              captures: { p_auto: $.data.id }
            - call: "POST /products/${p_auto}/activate"
              payload: {}
              as: RatingManager
            - call: "POST /raters"
              payload: { rater_code: "PL-RATER", display_name: "PL Rater", feed_format_version: "v4.2", accepted_line_of_business: "AUTO" }
              as: RatingManager
              captures: { rater_id: $.data.id, rater_v: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-02-01T00:00:00Z", effective_end: "2026-03-01T00:00:00Z", rate_table_payload: { t: "f1" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_f1: $.data.id }
            - call: "GET /raters/${rater_id}"
              payload: {}
              as: RatingManager
              captures: { rater_v2: $.data.version }
          trigger:
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-04-01T00:00:00Z", rate_table_payload: { t: "touching" }, expected_rater_version: "${rater_v2}" }
              as: RatingManager
              captures: { err_touch: $.data.error_id }
            - call: "GET /raters/${rater_id}"
              payload: {}
              as: RatingManager
              captures: { rater_v3: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-03-01T23:00:00Z", effective_end: "2026-04-01T00:00:00Z", rate_table_payload: { t: "gap23h" }, expected_rater_version: "${rater_v3}" }
              as: RatingManager
              captures: { err_gap: $.data.error_id }
            - call: "GET /raters/${rater_id}"
              payload: {}
              as: RatingManager
              captures: { rater_v4: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-03-02T00:00:00Z", effective_end: "2026-04-01T00:00:00Z", rate_table_payload: { t: "gap24h" }, expected_rater_version: "${rater_v4}" }
              as: RatingManager
              captures: { feed_ok: $.data.id }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-02-15T00:00:00Z", effective_end: "2026-02-20T00:00:00Z", rate_table_payload: { t: "overlap" }, expected_rater_version: "${rater_v4} + 1" }
              as: RatingManager
              captures: { err_over: $.data.error_id }
          assert:
            - "touching window (gap 0h) fails with 409 error_id == ERR_FEED_WINDOW_GAP_VIOLATION (adjacency is NOT allowed here, unlike appointments)"
            - "23h gap fails with ERR_FEED_WINDOW_GAP_VIOLATION"
            - "exactly 24h gap succeeds: RateFeedPublication.${feed_ok}.status == DRAFT"
            - "strict intersection fails with 409 error_id == ERR_FEED_WINDOW_OVERLAP (overlap beats gap when both fire)"
            - "rejected creations still consume no version bump: the rater version only advanced on the successful creation"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_and_clawback_leave_commission_ledger_conserved
        grounds:
          - calculations.earned_premium_proration
          - state_machines.CommissionStatement.PAID_to_CLAWED_BACK
          - entities.Policy.fields.clawback_cents
        distinguishing_aspect: |
          Conserved quantity: the per-policy commission total. Forward action
          (bind -> commission 73000 credited) paired with its compensating
          actions (cancel at day 100 + claw-back) leaves
          retained 20000 + clawback 53000 == 73000 exactly — no drift — and
          the policy premium splits as earned 200000 + unearned 530000 ==
          730000.
        test_recipe:
          setup:
            - "Logical clock 2026-01-01T00:00:00Z. P-FLAT ACTIVE (BOTH; TIER_D 730000; factors 0). Feed published."
            - "Agent A APPOINTED (TX, AUTO) with flat 10% schedule. One AGENT policy bound [FLAT/TIER_D] at 2026-01-01."
            - "January statement generated, FINALIZED, PAID (commission 73000)."
            - "Clock advanced to 2026-04-11T00:00:00Z (exactly 100 days in force) and the policy cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /products"
              payload: { product_code: "P-FLAT", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { FLAT: { TIER_D: 730000 } }, min_premium_cents: 0 }
              as: RatingManager
              captures: { p_flat: $.data.id }
            - call: "POST /products/${p_flat}/activate"
              payload: {}
              as: RatingManager
            - call: "POST /raters"
              payload: { rater_code: "PL-RATER", display_name: "PL Rater", feed_format_version: "v4.2", accepted_line_of_business: "AUTO" }
              as: RatingManager
              captures: { rater_id: $.data.id, rater_v: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_flat}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "f" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_id: $.data.id }
            - call: "POST /rate-feed-publications/${feed_id}/publish"
              payload: {}
              as: RatingManager
            - call: "POST /agents"
              payload: { agency_name: "Hill Country Insurance", principal_name: "A. Reyes", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { agent_a: $.data.id, agent_v: $.data.version }
            - call: "POST /agents/${agent_a}/appointments"
