        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.ApprovalWorkflow.PENDING_to_REJECTED
        distinguishing_aspect: |
          Pair (business_safety @8 self-approval) vs (business_safety @9 mandatory-clause-missing):
          the drafter approves a version that also omits a mandatory clause; the higher-priority
          ERR_SELF_APPROVAL (@8) must win over ERR_MANDATORY_CLAUSE_MISSING (@9) — a different
          error-category pairing than the state-vs-safety conflict above.
