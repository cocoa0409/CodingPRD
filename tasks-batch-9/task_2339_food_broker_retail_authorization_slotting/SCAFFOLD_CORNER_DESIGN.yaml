              payload: { claim_amount_cents: 75000 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${d2}/substantiate"
              payload: { document_ref: "LETTER-2001" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${d2}/substantiate"
              payload: { document_ref: "EMAIL-2001" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${d2}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { rec2: $.data.recovered_cents, con2: $.data.conceded_cents, ss2: $.data.settlement_state, ds2: $.data.dispute_state }
            - call: "POST /deductions/${d3}/dispute"
