  instances:
  - name: ols_level_deflation_rounding_order
    claim_type: correct_result
    grounds:
    - calculations.adjusted_pay_gap
    excluded_because:
      difficulty_instance: gap_methodology_variants_diverge
      rationale: The 3.0612 OLS assert only holds with per-employee 2dp rounding before averaging (9166666.67 etc.); covered
        there.
  - name: prorata_floor_and_remainder
    claim_type: correct_result
    grounds:
    - calculations.remediation_suggested_allocation
    excluded_because:
      difficulty_instance: prorata_waterfall_remainder_distribution
      rationale: Floor + remainder waterfall asserted to the cent there.
  - name: adverse_impact_threshold_and_rounding
    claim_type: correct_result
    grounds:
    - calculations.adverse_impact_ratio
    excluded_because:
      difficulty_instance: four_fifths_ratio_exactly_at_threshold_not_flagged
      rationale: 0.8000 boundary and nested rounding order covered there and in adverse_impact_nested_rounding_order.
