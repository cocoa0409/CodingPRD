  - rule_id: boundary_precision_check
    instances:
      - name: coverage_gate_admits_exactly_ready_script_target_inclusive
        grounds:
          - calculations.script_coverage_index
          - calculations.script_coverage_index.constants.LOCK_COMPARISON
          - validations.priority_80_business_constraint
          - errors.ERR_SCRIPT_COVERAGE_INSUFFICIENT
          - entities.Season.fields.ready_script_target
          - entities.Season.fields.ready_script_count
          - entities.Season.fields.coverage_gap
          - entities.Season.fields.coverage_posture
          - endpoints.POST_/episodes/{episode_id}/lock-for-production
        distinguishing_aspect: |
          The lock gate is >= ready_script_target, not >. With target 2 the identical request is refused
          at count 1 (target - 1) and accepted at count exactly 2 (the boundary), so an off-by-one
          implementation using > fails the second call while one using >= on a stale count fails the
          first. The count itself is a filtered aggregate: an episode only counts when script_readiness
          is READY or LOCKED AND clearance_posture is CLEARED or CONDITIONAL_WAIVED, so E2 sitting in
          READY with clearance still PENDING must NOT move the count.
        test_recipe:
          setup:
            - "Agreement AG; season SE with ready_script_target 2 and episode_order 8."
            - "ACTIVE room RM with W1 CONFIRMED (STORY_EDITOR 600000, episodic_guarantee_count 0)."
            - "Episode E1 (UNIT_A, production start 2026-11-02) with assignment A1 = TELEPLAY by W1: all three milestones delivered, A1 APPROVED, so E1.script_readiness == READY."
            - "A clearance review R1 is opened over A1's accepted OUTLINE milestone with a single NAME item decided CLEARED, so R1.posture == CLEARED and E1.clearance_posture == CLEARED and Season.ready_script_count == 1."
            - "Episode E2 (UNIT_B, production start 2026-11-16) with assignment A2 = TELEPLAY by W1: all three milestones delivered and A2 APPROVED, so E2.script_readiness == READY but E2.clearance_posture is still PENDING, keeping ready_script_count at 1."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: *AGP
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
