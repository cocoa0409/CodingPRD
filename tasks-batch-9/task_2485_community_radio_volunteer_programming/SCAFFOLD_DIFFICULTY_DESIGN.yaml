scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: episode_royalty_survey_versus_census_diverge_on_identical_playlist
        grounds:
          - calculations.episode_royalty_liability_cents
          - entities.Episode.fields.provisional_royalty_cents
          - entities.Episode.fields.final_royalty_cents
          - state_machines.Episode.PENDING_to_SUBMITTED
          - state_machines.Episode.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          This instance varies the royalty calculation on Episode and the variant is selected implicitly by the log's own lifecycle stage - submit-log writes the SURVEY figure, log-decision CERTIFY writes the CENSUS figure - so the same three PlaylistEntry rows yield 529 and 481 cents and both numbers stay readable on the episode; the other dual_variant_calc instance varies the performance calculation on Program, is selected explicitly by the caller's review_window field, and diverges on window membership rather than on an uplift factor and rounding granularity.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-20T12:00:00Z."
            - "Volunteer Ada Reyes holds all three core certifications and is therefore CERTIFIED."
            - "Three other volunteers hold committee seats."
            - "MUSIC proposal 'Delta Sessions' is APPROVED on a composite score of exactly 4.00, so a Program exists."
            - "An IN_REVIEW grid carries a Monday 20:00 two-hour occupation of that program."
            - "One episode on that occupation is AIRED with its playlist log open, carrying three FEATURED spins of 185, 212 and 47 seconds."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-02-20T12:00:00Z" }, as: ProgramDirector }
            - { call: "POST /volunteers", payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }, as: TrainingCoordinator, captures: { host_id: "$.data.id" } }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BOARD_OPERATION", exam_score: 88 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "STATION_POLICY", exam_score: 90 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BROADCAST_REGULATION", exam_score: 91 }, as: TrainingCoordinator }
            - { call: "POST /volunteers", payload: { legal_name: "Bo Lin", email: "bo@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Cy Nakamura", email: "cy@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m2_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Dee Okafor", email: "dee@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m3_id: "$.data.id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "Delta Sessions", format_code: "MUSIC", language_code: "EN", requested_daypart: "EVENING", requested_duration_minutes: 120 }, as: Volunteer, as_user_id: "${host_id}", captures: { proposal_id: "$.data.id" } }
            - { call: "POST /program-proposals/${proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /program-proposals/${proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Fits the evening music block." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Well produced." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Sound proposal." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${proposal_id}", as: ProgramDirector, captures: { proposal_version: "$.data.version" } }
            - { call: "POST /program-proposals/${proposal_id}/decide", payload: { expected_proposal_version: "${proposal_version}" }, as: ProgramDirector }
            - { call: "GET /programs?proposal_id=${proposal_id}", as: ProgramDirector, captures: { program_id: "$.data[0].id" } }
            - { call: "POST /schedule-grids", payload: { season_code: "2026-SPRING", effective_from: "2026-01-05T00:00:00Z", effective_to: "2026-06-28T23:59:00Z" }, as: ProgramDirector, captures: { grid_id: "$.data.id", grid_version: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_version}", program_id: "${program_id}", day_of_week: 1, start_minute: 1200, duration_minutes: 120 }, as: ProgramDirector, captures: { slot_id: "$.data.id" } }
            - { call: "POST /episodes", payload: { program_id: "${program_id}", slot_assignment_id: "${slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-01-05T20:00:00Z" }, as: ProgramDirector, captures: { episode_id: "$.data.id" } }
            - { call: "POST /episodes/${episode_id}/air-result", payload: { air_status: "AIRED" }, as: ProgramDirector }
            - { call: "POST /episodes/${episode_id}/playlist-entries", payload: { sequence_number: 1, artist: "Riverbend Quartet", title: "Low Water", duration_seconds: 185, play_source: "LIBRARY_CD", is_local_artist: true }, as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /episodes/${episode_id}/playlist-entries", payload: { sequence_number: 2, artist: "Nine Mile Choir", title: "Levee Song", duration_seconds: 212, play_source: "DIGITAL", is_local_artist: true }, as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /episodes/${episode_id}/playlist-entries", payload: { sequence_number: 3, artist: "Tuesday Static", title: "Short Wave", duration_seconds: 47, play_source: "LIBRARY_VINYL", is_local_artist: false }, as: Volunteer, as_user_id: "${host_id}" }
          trigger:
            - { call: "POST /episodes/${episode_id}/submit-log", as: Volunteer, as_user_id: "${host_id}", captures: { submitted_provisional: "$.data.provisional_royalty_cents" } }
            - { call: "POST /episodes/${episode_id}/log-decision", payload: { decision: "CERTIFY" }, as: ComplianceOfficer, as_user_id: "officer-logs" }
          assert:
            - "submit-log returns 200 with Episode.log_status == SUBMITTED"
            - "Episode.featured_performance_count == 3 and Episode.local_featured_count == 2"
            - "Episode.provisional_royalty_cents == 529 after submit-log (SURVEY variant: 444 seconds at 65 cents per minute is 481.00 cents exactly, times the 1.10 sample uplift is 529.10, rounded half up)"
            - "log-decision returns 200 with Episode.log_status == CERTIFIED"
            - "Episode.final_royalty_cents == 481 (CENSUS variant: 200 + 230 + 51, each spin priced and rounded on its own with no uplift)"
            - "Episode.provisional_royalty_cents is still 529 on the certified episode, so the two variants differ by exactly 48 cents on identical inputs"
            - "GET /episodes/${episode_id} re-reads provisional_royalty_cents == 529 and final_royalty_cents == 481"

      - name: program_performance_trailing_six_versus_quarter_to_date_diverge
        grounds:
          - calculations.program_performance_score
          - entities.Program.fields.performance_score
          - entities.Program.fields.performance_score_method
          - entities.Episode.fields.air_status
        distinguishing_aspect: |
          This instance varies the performance calculation on Program, the variant is chosen by the caller through the review_window request field, and the two answers (100.00 versus 92.14) differ only because the seventh, oldest MISSED airing sits inside the calendar-quarter window and outside the six-most-recent window; the other dual_variant_calc instance varies the royalty calculation on Episode, picks its variant implicitly from the log lifecycle, and diverges through a sample uplift factor and a different rounding granularity.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-20T12:00:00Z, so the calendar quarter began 2026-01-01 and every airing below is in the past."
            - "A PUBLISHED grid carries a TALK program (Monday 19:00, 120 minutes) and a NEWS program (Tuesday 07:00, 30 minutes) that supplies a 20.00 percent public-affairs share; both programs are ON_AIR_ACTIVE."
            - "The TALK program has seven episodes on the Mondays of Q1 2026: 5 January MISSED, then 12, 19, 26 January and 2, 9, 16 February all AIRED."
            - "TALK episodes owe no playlist log (log_status stays NOT_REQUIRED) and log no spins, so log_compliance and local_share are both 1.0 and reliability alone moves the score."
            - "The TALK program carries zero compliance penalty points."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-02-20T12:00:00Z" }, as: ProgramDirector }
            - { call: "POST /volunteers", payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }, as: TrainingCoordinator, captures: { host_id: "$.data.id" } }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BOARD_OPERATION", exam_score: 88 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "STATION_POLICY", exam_score: 90 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BROADCAST_REGULATION", exam_score: 91 }, as: TrainingCoordinator }
            - { call: "POST /volunteers", payload: { legal_name: "Bo Lin", email: "bo@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Cy Nakamura", email: "cy@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m2_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Dee Okafor", email: "dee@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m3_id: "$.data.id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "Open Line", format_code: "TALK", language_code: "EN", requested_daypart: "EVENING", requested_duration_minutes: 120 }, as: Volunteer, as_user_id: "${host_id}", captures: { talk_proposal_id: "$.data.id" } }
            - { call: "POST /program-proposals/${talk_proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /program-proposals/${talk_proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${talk_proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Needed call-in show." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${talk_proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Strong host." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${talk_proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${talk_proposal_id}", as: ProgramDirector, captures: { talk_proposal_version: "$.data.version" } }
            - { call: "POST /program-proposals/${talk_proposal_id}/decide", payload: { expected_proposal_version: "${talk_proposal_version}" }, as: ProgramDirector }
            - { call: "GET /programs?proposal_id=${talk_proposal_id}", as: ProgramDirector, captures: { talk_program_id: "$.data[0].id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "County Report", format_code: "NEWS", language_code: "EN", requested_daypart: "MORNING_DRIVE", requested_duration_minutes: 30 }, as: Volunteer, as_user_id: "${host_id}", captures: { news_proposal_id: "$.data.id" } }
            - { call: "POST /program-proposals/${news_proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /program-proposals/${news_proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${news_proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Local news gap." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${news_proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Yes." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${news_proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Yes." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${news_proposal_id}", as: ProgramDirector, captures: { news_proposal_version: "$.data.version" } }
            - { call: "POST /program-proposals/${news_proposal_id}/decide", payload: { expected_proposal_version: "${news_proposal_version}" }, as: ProgramDirector }
            - { call: "GET /programs?proposal_id=${news_proposal_id}", as: ProgramDirector, captures: { news_program_id: "$.data[0].id" } }
            - { call: "POST /schedule-grids", payload: { season_code: "2026-WINTER", effective_from: "2026-01-05T00:00:00Z", effective_to: "2026-06-28T23:59:00Z" }, as: ProgramDirector, captures: { grid_id: "$.data.id", grid_v1: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v1}", program_id: "${talk_program_id}", day_of_week: 1, start_minute: 1140, duration_minutes: 120 }, as: ProgramDirector, captures: { talk_slot_id: "$.data.id" } }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v2: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v2}", program_id: "${news_program_id}", day_of_week: 2, start_minute: 420, duration_minutes: 30 }, as: ProgramDirector, captures: { news_slot_id: "$.data.id" } }
            - { call: "POST /slot-assignments/${talk_slot_id}/confirm", as: ProgramDirector }
            - { call: "POST /slot-assignments/${news_slot_id}/confirm", as: ProgramDirector }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v3: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/publish", payload: { expected_grid_version: "${grid_v3}" }, as: ProgramDirector }
            - { call: "POST /episodes", payload: { program_id: "${talk_program_id}", slot_assignment_id: "${talk_slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-01-05T19:00:00Z" }, as: ProgramDirector, captures: { ep1_id: "$.data.id" } }
            - { call: "POST /episodes", payload: { program_id: "${talk_program_id}", slot_assignment_id: "${talk_slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-01-12T19:00:00Z" }, as: ProgramDirector, captures: { ep2_id: "$.data.id" } }
            - { call: "POST /episodes", payload: { program_id: "${talk_program_id}", slot_assignment_id: "${talk_slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-01-19T19:00:00Z" }, as: ProgramDirector, captures: { ep3_id: "$.data.id" } }
            - { call: "POST /episodes", payload: { program_id: "${talk_program_id}", slot_assignment_id: "${talk_slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-01-26T19:00:00Z" }, as: ProgramDirector, captures: { ep4_id: "$.data.id" } }
            - { call: "POST /episodes", payload: { program_id: "${talk_program_id}", slot_assignment_id: "${talk_slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-02-02T19:00:00Z" }, as: ProgramDirector, captures: { ep5_id: "$.data.id" } }
            - { call: "POST /episodes", payload: { program_id: "${talk_program_id}", slot_assignment_id: "${talk_slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-02-09T19:00:00Z" }, as: ProgramDirector, captures: { ep6_id: "$.data.id" } }
            - { call: "POST /episodes", payload: { program_id: "${talk_program_id}", slot_assignment_id: "${talk_slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-02-16T19:00:00Z" }, as: ProgramDirector, captures: { ep7_id: "$.data.id" } }
            - { call: "POST /episodes/${ep1_id}/air-result", payload: { air_status: "MISSED" }, as: ProgramDirector }
            - { call: "POST /episodes/${ep2_id}/air-result", payload: { air_status: "AIRED" }, as: ProgramDirector }
            - { call: "POST /episodes/${ep3_id}/air-result", payload: { air_status: "AIRED" }, as: ProgramDirector }
            - { call: "POST /episodes/${ep4_id}/air-result", payload: { air_status: "AIRED" }, as: ProgramDirector }
            - { call: "POST /episodes/${ep5_id}/air-result", payload: { air_status: "AIRED" }, as: ProgramDirector }
            - { call: "POST /episodes/${ep6_id}/air-result", payload: { air_status: "AIRED" }, as: ProgramDirector }
            - { call: "POST /episodes/${ep7_id}/air-result", payload: { air_status: "AIRED" }, as: ProgramDirector }
          trigger:
            - { call: "POST /programs/${talk_program_id}/performance-reviews", payload: { review_window: "TRAILING_SIX" }, as: ProgramDirector, captures: { trailing_score: "$.data.performance_score" } }
            - { call: "POST /programs/${talk_program_id}/performance-reviews", payload: { review_window: "QUARTER_TO_DATE" }, as: ProgramDirector, captures: { quarter_score: "$.data.performance_score" } }
          assert:
            - "The TRAILING_SIX call returns 200 with Program.performance_score == 100.00 and Program.performance_score_method == TRAILING_SIX"
            - "The QUARTER_TO_DATE call returns 200 with Program.performance_score == 92.14 and Program.performance_score_method == QUARTER_TO_DATE (100 * (0.55 * 6/7 + 0.30 + 0.15) = 92.142857, rounded half up)"
            - "${quarter_score} != ${trailing_score} on identical entity state - only the requested window differs"
            - "Program.programming_status == ON_AIR_ACTIVE after both calls, because both scores are at or above the 60.00 recovery threshold"
            - "Program.last_evaluated_at == 2026-02-20T12:00:00Z after both calls"

  - rule_id: combinatorial_formula
    instances:
      - name: census_royalty_rounds_each_spin_before_summing
        grounds:
          - calculations.episode_royalty_liability_cents
          - entities.PlaylistEntry.fields.royalty_class
          - entities.Episode.fields.final_royalty_cents
        distinguishing_aspect: |
          Mode (b), rounding placement: three 30-second spins each price to exactly 32.5 cents, so rounding half up per spin and then summing gives 99 while summing the seconds first and rounding once gives 98, which makes the position of the single rounding step observable in one integer field; the other combinatorial_formula instance is mode (c) and fixes the evaluation ORDER of two independent ranking keys in the premium waterfall, where no rounding occurs at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-20T12:00:00Z."
            - "Certified host, three seated committee members and an APPROVED MUSIC program on a Monday 20:00 two-hour occupation."
            - "One AIRED episode with an open log carrying three 30-second spins - each exactly on the inclusive FEATURED boundary."
