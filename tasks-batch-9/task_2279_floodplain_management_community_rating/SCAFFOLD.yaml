  # --------------------------------------------------------- ImprovementRecord
  - method: POST
    path: "/floodplain/improvement-records"
    description: "Append an improvement/damage record, or a reversal of one, to a structure's cumulative ledger"
    roles: [FloodplainAdministrator]
    code: 201
    input: ["structure_id", "record_type", "event_date", "cost_usd?", "claim_paid_amount_usd?", "is_code_compliance_only?", "reverses_record_id?"]
    output: ImprovementRecord
    side_effects:
      - "source = ADMIN_ADJUSTMENT for IMPROVEMENT/DAMAGE, REVERSAL_ADJUSTMENT for REVERSAL"
      - "for REVERSAL: cost_usd / claim_paid_amount_usd / event_date copied from the target, counted_in_cumulative = false, target.reversed = true"
      - "market_value_at_event_usd = Structure.market_value_usd snapshot; counted_in_cumulative evaluated"
      - "calculations.structure_improvement_aggregates and calculations.repetitive_loss_classification re-run; Structure.version += 1"
      - "auto-case rule: when cumulative_improvement_pct >= SI_THRESHOLD_PCT and no case of the structure is in {OPEN, DETERMINED, APPEALED}, a DeterminationCase with method = CUMULATIVE is created — in status OPEN when the record's source is ADMIN_ADJUSTMENT or PERMIT_CLOSEOUT, and directly in status DETERMINED when the record's source is DISASTER_INSPECTION"
      - "reversal of a case's anchor record moves that case to WITHDRAWN and reverts Structure.substantial_status to NONE"
      - "when a linked Property's repetitive_loss_status changes and repetitive_loss_area_id is set, that area's analysis_status -> STALE"

  - method: GET
    path: "/floodplain/improvement-records/{recordId}"
    description: "Read a ledger record (immutable)"
    roles: [StateNfipCoordinator, FloodplainAdministrator, AppealsBoardMember, PropertyOwner]
    code: 200
    input: []
    output: ImprovementRecord
    side_effects: []

