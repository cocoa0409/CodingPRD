            - "data.error_id == \"ERR_DELIVERABLE_WEIGHT_TOTAL_INVALID\""
            - "GET /scope-definitions/${scope_id} shows status == \"DRAFT\", deliverable_weight_total_pct == 60.00 and approved_at == null"
