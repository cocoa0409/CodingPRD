# =============================================================================
# PRD Benchmark Seed Tables — Task 1908: Insider Trading Window & Preclearance
# =============================================================================

scenario: |
  1908. Insider Trading Window & Preclearance (public company legal department):
  blackout calendar by fiscal quarter & event-driven blackout, preclearance
  request review & approval expiry, restricted list maintenance from deal intake,
  exception request for hardship & committee approval, trade confirmation
  matching against approvals, violation investigation & disciplinary action,
  policy acknowledgment & annual training, 10b5-1 plan compliance monitoring

domain_name: insider-trading-compliance
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency      # OCC on preclearance decision / plan create-with-supersede / window extend
    - cascading_side_effects      # deal activate -> restricted entry -> auto-denials; confirmation flag -> case -> compliance hold
    - scheduled_deferred_actions  # approval expiry, cooling-off, window activate/lift, attestation overdue via sweep + logical clock
    - rate_threshold_triggers     # committee quorum boundary, sanction severity tiers

  entity_topology: flat           # peer entities linked by FK references; one self-referential merge link on BlackoutWindow
  state_machine_shape: branching  # approve/deny forks + auto-transitions; cyclic revision loops on TenB5Plan; escalation cycle on ViolationCase
  relationship_patterns:
    - one_to_many                 # CoveredPerson -> PreclearanceRequest / ExceptionRequest / TenB5Plan / TradeConfirmation / ViolationCase / Attestation
    - cross_aggregate             # TradeConfirmation matched to PreclearanceRequest or TenB5Plan; Deal -> RestrictedListEntry / BlackoutWindow
    - self_referential            # BlackoutWindow.merged_into_id
  role_model: segregation_of_duties  # requester cannot approve own request/plan; committee member cannot vote own exception
  consistency_model: immediate    # all cascades atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CoveredPerson
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the covered person" }
      - { name: email, type: string, source: input, description: "Work email; unique across covered persons" }
      - { name: designation, type: enum, source: input, description: "SECTION_16_OFFICER | DIRECTOR | EMPLOYEE | CONSULTANT — drives cooling-off variant and sanction severity bonus" }
      - { name: department, type: string, source: input, description: "Department name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED set by sanction cascade, reinstated by sweep" }
      - { name: suspended_until, type: datetime, source: system, description: "Null unless SUSPENDED; sweep reinstates when now >= suspended_until", default: null }
      - { name: policy_ack_current, type: boolean, source: computed, default: false, description: "True iff exists a COMPLETED POLICY_ACK Attestation for this person with completed_at within trailing 365 days of now" }
      - { name: training_current, type: boolean, source: computed, default: false, description: "True iff exists a COMPLETED ANNUAL_TRAINING Attestation with completed_at within trailing 365 days of now AND no OVERDUE ANNUAL_TRAINING attestation exists for this person" }
      - { name: compliance_hold, type: boolean, source: computed, default: false, description: "True iff exists a ViolationCase for this person with status in {OPENED, UNDER_INVESTIGATION, ESCALATED, SUBSTANTIATED, SANCTION_RECORDED}" }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: codename, type: string, source: input, description: "Confidential deal codename" }
      - { name: deal_type, type: enum, source: input, description: "MERGER | ACQUISITION | DIVESTITURE | FINANCING | RESTRUCTURING" }
      - { name: security_ticker, type: string, source: input, description: "Listed security affected by the deal (placed on restricted list on activation)" }
      - { name: event_blackout_start, type: datetime, source: input, description: "Optional; if present, activation creates an EVENT_DRIVEN BlackoutWindow with this start", default: null }
      - { name: event_blackout_end, type: datetime, source: input, description: "Optional; required iff event_blackout_start present", default: null }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE -> ACTIVE -> CLOSED | ABANDONED" }
      - { name: activated_at, type: datetime, source: system, description: "Set on activation", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Set on close/abandon", default: null }

  - name: RestrictedListEntry
    parent: null
    common_fields: true
    fields:
      - { name: security_ticker, type: string, source: input, description: "Ticker placed on the restricted list" }
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; set when source == DEAL_INTAKE, null for MANUAL entries", default: null }
      - { name: source, type: enum, source: system, default: MANUAL, description: "DEAL_INTAKE | MANUAL" }
      - { name: note, type: string, source: input, description: "Free-text rationale", default: null }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> REMOVED" }
      - { name: removed_reason, type: enum, source: system, description: "DEAL_CLOSED | MANUAL; set on removal", default: null }

  - name: BlackoutWindow
    parent: null
    common_fields: true
    fields:
      - { name: kind, type: enum, source: input, description: "QUARTERLY | EVENT_DRIVEN" }
      - { name: fiscal_year, type: integer, source: input, description: "Required iff kind == QUARTERLY", default: null }
      - { name: fiscal_quarter, type: enum, source: input, description: "Q1 | Q2 | Q3 | Q4; required iff kind == QUARTERLY", default: null }
      - { name: security_ticker, type: string, source: system, description: "Event-driven windows only: window applies to this ticker; from request input or sourcing Deal", default: null }
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; set for deal-sourced event-driven windows, null otherwise", default: null }
      - { name: start_at, type: datetime, source: input, description: "Window start; half-open interval [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (exclusive)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> ACTIVE -> LIFTED | CANCELLED | MERGED" }
      - { name: merged_into_id, type: string, source: system, description: "FK -> BlackoutWindow.id; set when this record was absorbed into a surviving window on create-merge", default: null }
      - { name: applicability_note, type: string, source: system, description: "Derived: QUARTERLY windows apply to all tickers; EVENT_DRIVEN windows apply to their security_ticker only", default: null }

  - name: PreclearanceRequest
    parent: null
    common_fields: true
    fields:
      - { name: covered_person_id, type: string, source: input, description: "FK -> CoveredPerson.id; requester; must equal X-User-ID for Insider role" }
      - { name: security_ticker, type: string, source: input, description: "Ticker to trade" }
      - { name: trade_side, type: enum, source: input, description: "BUY | SELL" }
      - { name: quantity, type: number, source: input, description: "Shares requested; > 0; up to 4 decimal places accepted" }
      - { name: proposed_trade_date, type: datetime, source: input, description: "Intended trade date" }
      - { name: exception_id, type: string, source: input, description: "FK -> ExceptionRequest.id; optional APPROVED hardship exception that bypasses the blackout screen for this ticker up to its quantity", default: null }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> UNDER_REVIEW -> APPROVED | DENIED; SUBMITTED -> WITHDRAWN; APPROVED -> EXPIRED | VOIDED | CLOSED" }
      - { name: denial_reason, type: enum, source: system, description: "RESTRICTED_LIST | OFFICER_DISCRETION; set on DENIED (restricted cascade sets RESTRICTED_LIST; officer DENY sets OFFICER_DISCRETION)", default: null }
      - { name: decided_by, type: string, source: system, description: "CoveredPerson id of the deciding ComplianceOfficer", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Decision timestamp", default: null }
      - { name: approval_valid_until, type: datetime, source: computed, description: "decided_at + 48 hours; confirmation trade_date <= this instant (inclusive) may match", default: null }
      - { name: matched_quantity, type: number, source: computed, default: 0, description: "Sum of quantities of confirmations in MATCHED_PRECLEARANCE against this request; 2dp round_half_up accumulated per confirmation" }
      - { name: remaining_quantity, type: number, source: computed, description: "quantity - matched_quantity while APPROVED; restored to full quantity if approval is VOIDED", default: null }

  - name: ExceptionRequest
    parent: null
    common_fields: true
    fields:
      - { name: covered_person_id, type: string, source: input, description: "FK -> CoveredPerson.id; hardship requester; must equal X-User-ID for Insider role" }
      - { name: security_ticker, type: string, source: input, description: "Ticker the hardship exception covers" }
      - { name: quantity, type: number, source: input, description: "Maximum shares the exception covers" }
      - { name: hardship_reason, type: string, source: input, description: "Free-text hardship justification" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> APPROVED | DENIED | WITHDRAWN | EXPIRED" }
      - { name: votes_for, type: integer, source: computed, default: 0, description: "Count of APPROVE votes" }
      - { name: votes_against, type: integer, source: computed, default: 0, description: "Count of REJECT votes" }
      - { name: voter_ids, type: array, source: system, default: [], description: "CoveredPerson ids of committee members who have voted (duplicate-vote detection)" }
      - { name: decision_window_end, type: datetime, source: system, description: "created_at + 5 days; sweep expires undecided requests past this instant" }
      - { name: decided_at, type: datetime, source: system, description: "Set when status leaves SUBMITTED by vote quorum", default: null }

  - name: TenB5Plan
    parent: null
    common_fields: true
    fields:
      - { name: covered_person_id, type: string, source: input, description: "FK -> CoveredPerson.id; plan owner; must equal X-User-ID for Insider role" }
      - { name: security_ticker, type: string, source: input, description: "Ticker the plan trades" }
      - { name: total_quantity, type: number, source: input, description: "Total shares the plan may trade" }
      - { name: first_trade_date, type: datetime, source: input, description: "Earliest trade date the plan authorizes" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> APPROVED | RETURNED; RETURNED -> SUBMITTED; APPROVED -> ACTIVE (sweep at cooling_off_end); ACTIVE -> SUSPENDED -> ACTIVE; any of DRAFT/SUBMITTED/RETURNED/APPROVED/ACTIVE/SUSPENDED -> TERMINATED; DRAFT/SUBMITTED/RETURNED -> CANCELLED by supersede" }
      - { name: approved_at, type: datetime, source: system, description: "Set on APPROVED", default: null }
      - { name: approved_by, type: string, source: system, description: "CoveredPerson id of approving ComplianceOfficer", default: null }
      - { name: return_note, type: string, source: system, description: "Reviewer note on RETURN", default: null }
      - { name: cooling_off_end, type: datetime, source: computed, description: "STANDARD variant: approved_at + 30 days; EXECUTIVE variant (SECTION_16_OFFICER | DIRECTOR): max(approved_at + 90 days, containing QUARTERLY window end_at + 2 days)", default: null }

  - name: TradeConfirmation
    parent: null
    common_fields: true
    fields:
      - { name: covered_person_id, type: string, source: input, description: "FK -> CoveredPerson.id; executing insider" }
      - { name: security_ticker, type: string, source: input, description: "Ticker traded" }
      - { name: trade_side, type: enum, source: input, description: "BUY | SELL" }
      - { name: quantity, type: number, source: input, description: "Shares executed; > 0; up to 4 decimal places accepted" }
      - { name: price, type: number, source: input, description: "Execution price per share; 2dp" }
      - { name: trade_date, type: datetime, source: input, description: "Execution timestamp" }
      - { name: broker_ref, type: string, source: input, description: "Broker confirmation reference" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED -> MATCHED_PRECLEARANCE | MATCHED_PLAN | FLAGGED; MATCHED_PRECLEARANCE -> RECEIVED (void cascade); FLAGGED -> CLEARED (unfounded case close)" }
      - { name: match_preclearance_id, type: string, source: system, description: "FK -> PreclearanceRequest.id; set when MATCHED_PRECLEARANCE", default: null }
      - { name: match_plan_id, type: string, source: system, description: "FK -> TenB5Plan.id; set when MATCHED_PLAN", default: null }
      - { name: flagged_reason, type: enum, source: system, description: "BLACKOUT_TRADE | RESTRICTED_LIST | NO_PRECLEARANCE; set when FLAGGED", default: null }
      - { name: trade_value, type: number, source: computed, description: "round_half_up(quantity * price, 2dp); feeds sanction severity value band" }

  - name: ViolationCase
    parent: null
    common_fields: true
    fields:
      - { name: covered_person_id, type: string, source: input, description: "FK -> CoveredPerson.id; subject of the investigation" }
      - { name: trade_confirmation_id, type: string, source: input, description: "FK -> TradeConfirmation.id; the flagged confirmation, when case originates from a confirmation", default: null }
      - { name: violation_type, type: enum, source: input, description: "BLACKOUT_TRADE | NO_PRECLEARANCE | RESTRICTED_LIST | PLAN_VIOLATION | OTHER" }
      - { name: source, type: enum, source: system, default: MANUAL, description: "AUTO_FLAG (from flagged confirmation) | MANUAL" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED -> UNDER_INVESTIGATION -> ESCALATED -> UNDER_INVESTIGATION; UNDER_INVESTIGATION -> SUBSTANTIATED | UNFOUNDED; SUBSTANTIATED -> SANCTION_RECORDED -> CLOSED; UNFOUNDED -> CLOSED" }
      - { name: severity_score, type: integer, source: computed, description: "Computed on SUBSTANTIATE per sanction_severity_score calculation", default: null }
      - { name: sanction, type: enum, source: computed, description: "WARNING | SUSPENSION_30D | SUSPENSION_90D | TERMINATION_REFERRAL; derived from severity_score bands at RECORD_SANCTION", default: null }
      - { name: sanction_recorded_at, type: datetime, source: system, description: "Set on RECORD_SANCTION", default: null }
      - { name: note, type: string, source: input, description: "Case notes", default: null }

  - name: Attestation
    parent: null
    common_fields: true
    fields:
      - { name: covered_person_id, type: string, source: input, description: "FK -> CoveredPerson.id; assignee" }
      - { name: kind, type: enum, source: input, description: "POLICY_ACK | ANNUAL_TRAINING" }
      - { name: period_year, type: integer, source: input, description: "Policy/training period year" }
      - { name: due_date, type: datetime, source: input, description: "Completion deadline; sweep flips ASSIGNED -> OVERDUE when due_date < now" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED -> COMPLETED | OVERDUE; OVERDUE -> COMPLETED (late completion allowed)" }
      - { name: completed_at, type: datetime, source: system, description: "Set on completion", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CoveredPerson
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (side effect of ViolationCase RECORD_SANCTION with sanction SUSPENSION_30D | SUSPENSION_90D)"
        actor: system
        preconditions: []
        side_effects:
          - "suspended_until = now + 30 days (SUSPENSION_30D) or now + 90 days (SUSPENSION_90D)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (POST /compliance-sweeps when now >= suspended_until)"
        actor: system
        preconditions: []
        side_effects:
          - "suspended_until = null"

  - entity: Deal
    initial_state: INTAKE
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /deals/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "Deal.status == INTAKE"
        side_effects:
          - "activated_at = now"
          - "Create RestrictedListEntry(security_ticker = Deal.security_ticker, source = DEAL_INTAKE, deal_id = Deal.id, status = ACTIVE); multiple ACTIVE entries per ticker are permitted across different sources (duplicate-block applies to manual creation only)"
          - "If event_blackout_start present: create BlackoutWindow(kind = EVENT_DRIVEN, security_ticker, deal_id, [event_blackout_start, event_blackout_end), status = SCHEDULED), applying the event-window merge rule (see blackout_interval_merge)"
          - "Cascade hop 2: every PreclearanceRequest with security_ticker == Deal.security_ticker and status in {SUBMITTED, UNDER_REVIEW} -> DENIED with denial_reason = RESTRICTED_LIST"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /deals/{id}/close with outcome = COMPLETED"
        actor: ComplianceOfficer
        preconditions:
          - "Deal.status == ACTIVE"
        side_effects:
          - "closed_at = now"
          - "Every RestrictedListEntry with deal_id == Deal.id and status == ACTIVE -> REMOVED with removed_reason = DEAL_CLOSED"
          - "Every BlackoutWindow with deal_id == Deal.id and status == ACTIVE -> LIFTED; status == SCHEDULED -> CANCELLED"
      - from: ACTIVE
        to: ABANDONED
        trigger: "POST /deals/{id}/close with outcome = ABANDONED"
        actor: ComplianceOfficer
        preconditions:
          - "Deal.status == ACTIVE"
        side_effects:
          - "closed_at = now"
          - "Every RestrictedListEntry with deal_id == Deal.id and status == ACTIVE -> REMOVED with removed_reason = DEAL_CLOSED"
          - "Every BlackoutWindow with deal_id == Deal.id and status in {SCHEDULED, ACTIVE} -> CANCELLED"

  - entity: RestrictedListEntry
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /restricted-list-entries/{id}/remove OR system (Deal close cascade)"
        actor: ComplianceOfficer | system
        preconditions:
          - "RestrictedListEntry.status == ACTIVE"
        side_effects:
          - "removed_reason = MANUAL (endpoint) or DEAL_CLOSED (cascade)"

  - entity: BlackoutWindow
    initial_state: SCHEDULED
    terminal_states: [LIFTED, CANCELLED, MERGED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (POST /compliance-sweeps when now >= start_at and now < end_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 2: every PreclearanceRequest with status == APPROVED whose proposed_trade_date falls in [start_at, end_at) and for which this window applies (QUARTERLY => all tickers; EVENT_DRIVEN => security_ticker match) -> VOIDED"
          - "Cascade hop 3: each VOIDED request releases its matched confirmations: every TradeConfirmation with match_preclearance_id == request.id and status == MATCHED_PRECLEARANCE -> RECEIVED, match_preclearance_id = null; request.matched_quantity = 0, remaining_quantity = quantity"
      - from: ACTIVE
        to: LIFTED
        trigger: "system (POST /compliance-sweeps when now >= end_at) OR system (Deal close COMPLETED cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /blackout-windows/{id}/cancel OR system (Deal close cascade)"
        actor: ComplianceOfficer | system
        preconditions:
          - "BlackoutWindow.status == SCHEDULED"
        side_effects: []
      - from: SCHEDULED
        to: MERGED
        trigger: "system (create-merge: a new EVENT_DRIVEN window whose interval overlaps or touches (gap == 0) an existing SCHEDULED/ACTIVE EVENT_DRIVEN window on the same ticker is absorbed; see blackout_interval_merge)"
        actor: system
        preconditions: []
        side_effects:
          - "merged_into_id = surviving window id"
          - "surviving window: start_at = min(starts), end_at = max(ends), version incremented"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /blackout-windows/{id}/extend (end_at moved later; OCC-guarded)"
        actor: ComplianceOfficer
        preconditions:
          - "BlackoutWindow.status == SCHEDULED"
          - "new_end_at > current end_at"
          - "expected_blackout_window_version == current version (else ERR_STALE_VERSION)"
        side_effects:
          - "end_at = new_end_at"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /blackout-windows/{id}/extend (end_at moved later; OCC-guarded)"
        actor: ComplianceOfficer
        preconditions:
          - "BlackoutWindow.status == ACTIVE"
          - "new_end_at > current end_at"
          - "expected_blackout_window_version == current version (else ERR_STALE_VERSION)"
        side_effects:
          - "end_at = new_end_at"

  - entity: PreclearanceRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, EXPIRED, VOIDED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /preclearance-requests/{id}/review"
        actor: ComplianceOfficer
        preconditions:
          - "PreclearanceRequest.status == SUBMITTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /preclearance-requests/{id}/decision with outcome = APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "PreclearanceRequest.status == UNDER_REVIEW"
          - "deciding officer's CoveredPerson id != covered_person_id (segregation of duties)"
          - "expected_preclearance_version == current version (else ERR_STALE_VERSION)"
          - "ticker not on restricted list (no ACTIVE RestrictedListEntry with security_ticker) — else decision rejected ERR_SECURITY_RESTRICTED"
          - "no SCHEDULED or ACTIVE applicable BlackoutWindow covers proposed_trade_date, unless exception_id references an APPROVED ExceptionRequest for this ticker with quantity >= request.quantity — else ERR_TRADE_IN_BLACKOUT"
        side_effects:
          - "decided_at = now; decided_by = officer id"
          - "approval_valid_until = decided_at + 48 hours (provisional validity variant: screens blackout calendar as known at decision time)"
          - "remaining_quantity = quantity"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /preclearance-requests/{id}/decision with outcome = DENY"
        actor: ComplianceOfficer
        preconditions:
          - "PreclearanceRequest.status == UNDER_REVIEW"
          - "deciding officer's CoveredPerson id != covered_person_id"
          - "expected_preclearance_version == current version"
        side_effects:
          - "decided_at = now; decided_by = officer id; denial_reason = OFFICER_DISCRETION"
      - from: SUBMITTED
        to: DENIED
        trigger: "system (Deal activate cascade / manual restricted-entry creation cascade when ticker becomes restricted)"
        actor: system
        preconditions: []
        side_effects:
          - "denial_reason = RESTRICTED_LIST"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system (Deal activate cascade / manual restricted-entry creation cascade when ticker becomes restricted)"
        actor: system
        preconditions: []
        side_effects:
          - "denial_reason = RESTRICTED_LIST"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /preclearance-requests/{id}/withdraw"
        actor: Insider
        preconditions:
          - "PreclearanceRequest.status == SUBMITTED"
          - "X-User-ID == covered_person_id"
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /preclearance-requests/{id}/withdraw"
        actor: Insider
        preconditions:
          - "PreclearanceRequest.status == UNDER_REVIEW"
          - "X-User-ID == covered_person_id"
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (POST /compliance-sweeps when now > approval_valid_until)"
        actor: system
        preconditions: []
        side_effects:
          - "matched confirmations remain matched; remaining_quantity is forfeited"
      - from: APPROVED
        to: VOIDED
        trigger: "system (BlackoutWindow SCHEDULED -> ACTIVE cascade; final validity variant: a window created after decided_at covers proposed_trade_date)"
        actor: system
        preconditions: []
        side_effects:
          - "matched confirmations revert to RECEIVED (see BlackoutWindow activation cascade hop 3)"
          - "matched_quantity = 0; remaining_quantity = quantity"
      - from: APPROVED
        to: CLOSED
        trigger: "system (when remaining_quantity reaches 0 after a confirmation match)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExceptionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "system (POST /exception-requests/{id}/vote causes votes_for >= 2)"
        actor: system
        preconditions: []
        side_effects:
          - "decided_at = now"
      - from: SUBMITTED
        to: DENIED
        trigger: "system (POST /exception-requests/{id}/vote causes votes_against >= 2)"
        actor: system
        preconditions: []
        side_effects:
          - "decided_at = now"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /exception-requests/{id}/withdraw"
        actor: Insider
        preconditions:
          - "ExceptionRequest.status == SUBMITTED"
          - "X-User-ID == covered_person_id"
        side_effects: []
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (POST /compliance-sweeps when now > decision_window_end and still SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TenB5Plan
    initial_state: DRAFT
    terminal_states: [TERMINATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tenb5-plans/{id}/submit"
        actor: Insider
        preconditions:
          - "TenB5Plan.status == DRAFT"
          - "X-User-ID == covered_person_id"
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /tenb5-plans/{id}/submit (revision loop)"
        actor: Insider
        preconditions:
          - "TenB5Plan.status == RETURNED"
          - "X-User-ID == covered_person_id"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tenb5-plans/{id}/decision with outcome = APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "TenB5Plan.status == SUBMITTED"
          - "deciding officer's CoveredPerson id != covered_person_id (segregation of duties)"
        side_effects:
          - "approved_at = now; approved_by = officer id"
          - "cooling_off_end computed per cooling_off_end calculation (variant by designation)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /tenb5-plans/{id}/decision with outcome = RETURN"
        actor: ComplianceOfficer
        preconditions:
          - "TenB5Plan.status == SUBMITTED"
          - "deciding officer's CoveredPerson id != covered_person_id"
        side_effects:
          - "return_note = decision payload return_note"
      - from: APPROVED
        to: ACTIVE
        trigger: "system (POST /compliance-sweeps when now >= cooling_off_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tenb5-plans/{id}/action with action = SUSPEND"
        actor: ComplianceOfficer
        preconditions:
          - "TenB5Plan.status == ACTIVE"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tenb5-plans/{id}/action with action = RESUME"
        actor: ComplianceOfficer
        preconditions:
          - "TenB5Plan.status == SUSPENDED"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /tenb5-plans/{id}/action with action = TERMINATE"
        actor: Insider | ComplianceOfficer
        preconditions:
          - "TenB5Plan.status == ACTIVE"
          - "if actor role is Insider: X-User-ID == covered_person_id"
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /tenb5-plans/{id}/action with action = TERMINATE"
        actor: Insider | ComplianceOfficer
        preconditions:
          - "TenB5Plan.status == SUSPENDED"
          - "if actor role is Insider: X-User-ID == covered_person_id"
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /tenb5-plans/{id}/action with action = TERMINATE"
        actor: Insider | ComplianceOfficer
        preconditions:
          - "TenB5Plan.status == DRAFT"
          - "if actor role is Insider: X-User-ID == covered_person_id"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "system (supersede: POST /tenb5-plans for same covered_person_id + security_ticker with a newer plan)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (supersede cascade from POST /tenb5-plans)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: CANCELLED
        trigger: "system (supersede cascade from POST /tenb5-plans)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TradeConfirmation
    initial_state: RECEIVED
    terminal_states: [MATCHED_PLAN, CLEARED]
    transitions:
      - from: RECEIVED
        to: MATCHED_PRECLEARANCE
        trigger: "system (matching pass on POST /trade-confirmations or sweep re-match)"
        actor: system
        preconditions:
          - "exists PreclearanceRequest: same covered_person_id + security_ticker + trade_side, status == APPROVED, trade_date in [decided_at, approval_valid_until] (both inclusive), remaining_quantity >= quantity; selector: earliest decided_at, tie-break created_at ASC"
        side_effects:
          - "match_preclearance_id = request id"
          - "request.matched_quantity accumulated per matched_quantity_consumption (per-line round_half_up to 2dp before accumulating); remaining_quantity = round_half_up(remaining_quantity - applied, 2dp)"
          - "if remaining_quantity == 0: request -> CLOSED"
      - from: RECEIVED
        to: MATCHED_PLAN
        trigger: "system (matching pass: no preclearance candidate)"
        actor: system
        preconditions:
          - "exists TenB5Plan: same covered_person_id + security_ticker, status == ACTIVE, trade_date >= cooling_off_end and trade_date >= first_trade_date; selector: earliest approved_at, tie-break created_at ASC"
        side_effects:
          - "match_plan_id = plan id"
      - from: RECEIVED
        to: FLAGGED
        trigger: "system (matching pass: no preclearance and no plan candidate)"
        actor: system
        preconditions: []
        side_effects:
          - "flagged_reason = BLACKOUT_TRADE if an ACTIVE applicable BlackoutWindow covers trade_date; else RESTRICTED_LIST if an ACTIVE RestrictedListEntry matches security_ticker; else NO_PRECLEARANCE"
          - "Cascade hop 2: create ViolationCase(covered_person_id, trade_confirmation_id = this confirmation, violation_type = flagged_reason, source = AUTO_FLAG, status = OPENED) unless an open case already references this confirmation (ERR_CASE_ALREADY_OPEN on duplicate attempt)"
          - "Cascade hop 3: CoveredPerson.compliance_hold recomputed to true (case in open set exists), which gates new preclearance submissions with ERR_COMPLIANCE_HOLD"
      - from: MATCHED_PRECLEARANCE
        to: RECEIVED
        trigger: "system (approval VOIDED cascade releases the match)"
        actor: system
        preconditions: []
        side_effects:
          - "match_preclearance_id = null"
      - from: FLAGGED
        to: CLEARED
        trigger: "system (ViolationCase UNFOUNDED -> CLOSED cascade for the case referencing this confirmation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ViolationCase
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: UNDER_INVESTIGATION
        trigger: "POST /violation-cases/{id}/action with action = BEGIN_INVESTIGATION"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status == OPENED"
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: ESCALATED
        trigger: "POST /violation-cases/{id}/action with action = ESCALATE"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status == UNDER_INVESTIGATION"
        side_effects: []
      - from: ESCALATED
        to: UNDER_INVESTIGATION
        trigger: "POST /violation-cases/{id}/action with action = DEESCALATE"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status == ESCALATED"
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /violation-cases/{id}/action with action = SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status in {UNDER_INVESTIGATION, ESCALATED}"
        side_effects:
          - "severity_score computed per sanction_severity_score"
      - from: ESCALATED
        to: SUBSTANTIATED
        trigger: "POST /violation-cases/{id}/action with action = SUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status in {UNDER_INVESTIGATION, ESCALATED}"
        side_effects:
          - "severity_score computed per sanction_severity_score"
      - from: UNDER_INVESTIGATION
        to: UNFOUNDED
        trigger: "POST /violation-cases/{id}/action with action = UNFOUND"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status in {UNDER_INVESTIGATION, ESCALATED}"
        side_effects: []
      - from: ESCALATED
        to: UNFOUNDED
        trigger: "POST /violation-cases/{id}/action with action = UNFOUND"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status in {UNDER_INVESTIGATION, ESCALATED}"
        side_effects: []
      - from: SUBSTANTIATED
        to: SANCTION_RECORDED
        trigger: "POST /violation-cases/{id}/action with action = RECORD_SANCTION"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status == SUBSTANTIATED"
        side_effects:
          - "sanction derived from severity_score bands (see sanction_severity_score); sanction_recorded_at = now"
          - "if sanction == SUSPENSION_30D or SUSPENSION_90D: CoveredPerson -> SUSPENDED with suspended_until set"
      - from: SANCTION_RECORDED
        to: CLOSED
        trigger: "POST /violation-cases/{id}/action with action = CLOSE"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status == SANCTION_RECORDED"
        side_effects:
          - "CoveredPerson.compliance_hold recomputed (false if no other open cases)"
      - from: UNFOUNDED
        to: CLOSED
        trigger: "POST /violation-cases/{id}/action with action = CLOSE"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.status == UNFOUNDED"
        side_effects:
          - "linked TradeConfirmation (trade_confirmation_id) with status == FLAGGED -> CLEARED"
          - "CoveredPerson.compliance_hold recomputed"

  - entity: Attestation
    initial_state: ASSIGNED
    terminal_states: [COMPLETED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /attestations/{id}/complete"
        actor: Insider
        preconditions:
          - "Attestation.status in {ASSIGNED, OVERDUE}"
          - "X-User-ID == covered_person_id"
        side_effects:
          - "completed_at = now"
          - "CoveredPerson.policy_ack_current / training_current recomputed"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /attestations/{id}/complete (late completion)"
        actor: Insider
        preconditions:
          - "Attestation.status in {ASSIGNED, OVERDUE}"
          - "X-User-ID == covered_person_id"
        side_effects:
          - "completed_at = now"
          - "CoveredPerson.policy_ack_current / training_current recomputed"
      - from: ASSIGNED
        to: OVERDUE
        trigger: "system (POST /compliance-sweeps when due_date < now)"
        actor: system
        preconditions: []
        side_effects:
          - "CoveredPerson.training_current recomputed (becomes false when an ANNUAL_TRAINING attestation is OVERDUE)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: preclearance-decision-stale-version
    parent_entity: PreclearanceRequest
    write_endpoint: "POST /preclearance-requests/{id}/decision"
    occ_field: "expected_preclearance_version"
    description: |
      A decision submitted against a PreclearanceRequest version the client
      observed earlier, after the request's version has since advanced (for
      example a review transition or another recorded mutation moved it past
      the observed version), is rejected as stale. The deciding officer must
      re-read the request and decide against its current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-create-stale-person-version
    parent_entity: CoveredPerson
    write_endpoint: "POST /tenb5-plans"
    occ_field: "expected_covered_person_version"
    description: |
      Creating a TenB5Plan against a CoveredPerson whose version has advanced
      since the client last observed it is rejected. Creating a plan supersedes
      (CANCELLED) any existing DRAFT/SUBMITTED/RETURNED plan for the same
      person and ticker and increments the person's version, so a creation
      carrying a previously observed version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: window-extend-stale-version
    parent_entity: BlackoutWindow
    write_endpoint: "POST /blackout-windows/{id}/extend"
    occ_field: "expected_blackout_window_version"
    description: |
      Extending a BlackoutWindow whose version has advanced since the client
      last observed it is rejected. An earlier extend already moved end_at and
      incremented the version, so an extension carrying the previously
      observed version is stale even though the window remains extendable.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: approval_valid_until
    trigger: "PreclearanceRequest UNDER_REVIEW -> APPROVED"
    algorithm: threshold
    formula: |
      approval_valid_until = decided_at + APPROVAL_TTL_HOURS hours
    input_set: "the request being approved"
    constants:
      APPROVAL_TTL_HOURS: 48
    precision: "second precision; confirmation trade_date <= approval_valid_until (inclusive) is inside the approval window"

  - name: preclearance_validity_check
    trigger: "variant PROVISIONAL: decision APPROVE; variant FINAL: BlackoutWindow activation sweep and confirmation matching"
    algorithm: threshold
    formula: |
      applicable(window, request) :=
        (window.kind == QUARTERLY) OR (window.kind == EVENT_DRIVEN AND window.security_ticker == request.security_ticker)
      blocked(request, as_of_windows) :=
        exists window in as_of_windows with window.status in {SCHEDULED, ACTIVE}
          AND applicable(window, request)
          AND request.proposed_trade_date in [window.start_at, window.end_at)
      exception_bypass(request) :=
        request.exception_id references an ExceptionRequest with status == APPROVED,
        security_ticker == request.security_ticker, and quantity >= request.quantity
      PROVISIONAL (at decision): approve allowed iff not blocked(request, windows known at decided_at) OR exception_bypass(request)
      FINAL (at window activation / match time): an APPROVED request is VOIDED iff blocked(request, windows known now)
        using only windows with created_at > request.decided_at, AND NOT exception_bypass(request)
    input_set: "PROVISIONAL: all BlackoutWindows existing at decision time; FINAL: BlackoutWindows created after decided_at"
    constants: {}
    precision: "interval containment uses half-open [start_at, end_at)"
    variants:
      - name: PROVISIONAL
        when: "decision APPROVE on an UNDER_REVIEW request"
        difference: "Screens only the blackout calendar as known at decision time; a later-created window cannot retroactively block the decision"
      - name: FINAL
        when: "BlackoutWindow SCHEDULED -> ACTIVE sweep, and confirmation matching"
        difference: "Re-evaluates against windows created after decided_at; an approval that was valid provisionally is VOIDED and its confirmations release — identical trade data yields a different outcome than the provisional verdict"

  - name: cooling_off_end
    trigger: "TenB5Plan SUBMITTED -> APPROVED"
    algorithm: threshold
    formula: |
      STANDARD: cooling_off_end = approved_at + 30 days
      EXECUTIVE: cooling_off_end = max(approved_at + 90 days, earnings_blackout_end + 2 days)
        where earnings_blackout_end = end_at of the QUARTERLY BlackoutWindow
        whose [start_at, end_at) contains approved_at; if none exists, approved_at + 90 days
    input_set: "the plan being approved; QUARTERLY windows in any non-MERGED status containing approved_at"
    constants:
      COOLING_OFF_STANDARD_DAYS: 30
      COOLING_OFF_EXECUTIVE_DAYS: 90
      EARNINGS_BUFFER_DAYS: 2
    precision: "second precision"
    variants:
      - name: STANDARD
        when: "owner designation is EMPLOYEE or CONSULTANT"
        difference: "fixed 30-day cooling-off"
      - name: EXECUTIVE
        when: "owner designation is SECTION_16_OFFICER or DIRECTOR"
        difference: "later of 90 days after approval and 2 days after the containing quarterly blackout end — identical approved_at yields a later cooling_off_end than STANDARD"

  - name: sanction_severity_score
    trigger: "ViolationCase -> SUBSTANTIATED"
    algorithm: weighted_scoring
    formula: |
      repeat_count = count of other ViolationCases for the same covered_person_id
                     with status in {SANCTION_RECORDED, CLOSED} AND sanction != null
      value_band_bonus = 20 if trade_value >= 100000 else 10 if trade_value >= 25000 else 0
        where trade_value = the linked TradeConfirmation.trade_value; 0 when no confirmation linked
      designation_bonus = 10 if designation in {SECTION_16_OFFICER, DIRECTOR} else 0
      score = min(100, BASE_POINTS[violation_type] + REPEAT_BONUS * repeat_count + value_band_bonus + designation_bonus)
      sanction mapping (at RECORD_SANCTION):
        score >= 75 -> TERMINATION_REFERRAL
        score >= 50 -> SUSPENSION_90D
        score >= 25 -> SUSPENSION_30D
        else -> WARNING
    input_set: "the case; the subject's other substantiated cases; the linked confirmation's trade_value; the subject's designation"
    constants:
      BASE_POINTS: { BLACKOUT_TRADE: 40, NO_PRECLEARANCE: 25, RESTRICTED_LIST: 50, PLAN_VIOLATION: 30, OTHER: 15 }
      REPEAT_BONUS: 15
      VALUE_BAND_HIGH: 100000
      VALUE_BAND_MID: 25000
      SCORE_CAP: 100
    precision: "integer score"

  - name: matched_quantity_consumption
    trigger: "TradeConfirmation RECEIVED -> MATCHED_PRECLEARANCE"
    algorithm: aggregation
    formula: |
      applied = round_half_up(min(confirmation.quantity, request.remaining_quantity), 2)
      request.matched_quantity = round_half_up(request.matched_quantity + applied, 2)
      request.remaining_quantity = round_half_up(request.remaining_quantity - applied, 2)
      PINNED ORDER: round each confirmation's applied quantity to 2dp BEFORE
      accumulating. (The alternative — summing raw confirmation quantities then
      rounding once — yields a different matched_quantity for inputs with >2dp,
      e.g. two confirmations of 10.005 accumulate to 20.02 under the pinned
      order vs 20.01 under sum-then-round.)
    input_set: "the confirmation being matched and the target PreclearanceRequest"
    constants: {}
    precision: "2 decimal places, round_half_up, per confirmation line before accumulation"

  - name: quorum_decision
    trigger: "POST /exception-requests/{id}/vote"
    algorithm: threshold
    formula: |
      after tallying the vote:
        if votes_for >= QUORUM -> status APPROVED
        else if votes_against >= QUORUM -> status DENIED
        else remains SUBMITTED
    input_set: "the ExceptionRequest's recorded votes"
    constants:
      QUORUM: 2
    precision: "integer vote counts; boundary is >= QUORUM (exactly 2 approvals decide)"

  - name: blackout_interval_merge
    trigger: "EVENT_DRIVEN BlackoutWindow creation (manual POST /blackout-windows or Deal activation cascade)"
    algorithm: interval_merge
    formula: |
      candidate = new EVENT_DRIVEN window for ticker T with [start_at, end_at)
      survivors = existing EVENT_DRIVEN windows with security_ticker == T and status in {SCHEDULED, ACTIVE}
      if any survivor S with S.interval overlapping or touching candidate (gap == 0, i.e. NOT (candidate.start_at > S.end_at OR candidate.end_at < S.start_at)):
        S.start_at = min(S.start_at, candidate.start_at)
        S.end_at = max(S.end_at, candidate.end_at)
        candidate record is still created but immediately set to MERGED with merged_into_id = S.id
        (multiple touching survivors: absorb into the one with earliest start_at, tie-break created_at ASC; other survivors -> MERGED into it)
      else: candidate remains SCHEDULED
    input_set: "EVENT_DRIVEN windows on the same ticker in {SCHEDULED, ACTIVE}"
    constants: {}
    precision: "adjacency (end_at == start_at) counts as touching and merges; QUARTERLY windows never merge"

  - name: attestation_currency
    trigger: "Attestation completion; sweep OVERDUE flip; read of CoveredPerson policy_ack_current / training_current"
    algorithm: aggregation
    formula: |
      policy_ack_current = exists Attestation(kind = POLICY_ACK, status = COMPLETED,
        completed_at within trailing 365 days of now)
      training_current = exists Attestation(kind = ANNUAL_TRAINING, status = COMPLETED,
        completed_at within trailing 365 days of now)
        AND NOT exists Attestation(kind = ANNUAL_TRAINING, status = OVERDUE)
    input_set: "Attestations of the CoveredPerson"
    constants:
      CURRENCY_WINDOW_DAYS: 365
    precision: "day precision on the 365-day trailing window"

  - name: sweep_recompute
    trigger: "POST /compliance-sweeps"
    algorithm: chronological
    formula: |
      In this fixed order:
        1. BlackoutWindows: SCHEDULED -> ACTIVE where now >= start_at and now < end_at (fire activation cascade per window, in start_at ASC, created_at ASC order)
        2. BlackoutWindows: ACTIVE -> LIFTED where now >= end_at
        3. PreclearanceRequests: APPROVED -> EXPIRED where now > approval_valid_until
        4. ExceptionRequests: SUBMITTED -> EXPIRED where now > decision_window_end
        5. TenB5Plans: APPROVED -> ACTIVE where now >= cooling_off_end
        6. Attestations: ASSIGNED -> OVERDUE where due_date < now (recompute training_current per person)
        7. CoveredPersons: SUSPENDED -> ACTIVE where now >= suspended_until
        8. Re-match pass: TradeConfirmations with status == RECEIVED, processed in trade_date ASC, created_at ASC order, re-run the matching transitions
    input_set: "all entities in the states listed, at the current logical clock"
    constants: {}
    precision: "order pinned as listed; per-category iteration in created_at ASC unless stated otherwise"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-template resource ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "request-body FK references exist (covered_person_id, exception_id, trade_confirmation_id, security tickers unrestricted)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "creation and action endpoints with body references"
  - priority: 5
    category: state
    check: "target resource in a valid from-state for the requested transition; also ERR_PLAN_NOT_ACTIVE when plan matching is attempted against a non-ACTIVE plan"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"
  - priority: 6
    category: business_safety
    check: "segregation of duties: deciding/voting actor's CoveredPerson id must differ from the request/plan/exception owner"
    error_id: ERR_SELF_ACTION_FORBIDDEN
    http_status: 403
    applies_to: "POST /preclearance-requests/{id}/decision, POST /tenb5-plans/{id}/decision, POST /exception-requests/{id}/vote"
  - priority: 7
    category: business_safety
    check: "security on restricted list: an ACTIVE RestrictedListEntry exists for the ticker"
    error_id: ERR_SECURITY_RESTRICTED
    http_status: 422
    applies_to: "POST /preclearance-requests, POST /preclearance-requests/{id}/decision (outcome=APPROVE)"
  - priority: 8
    category: business_safety
    check: "compliance hold: subject has an open ViolationCase"
    error_id: ERR_COMPLIANCE_HOLD
    http_status: 422
    applies_to: "POST /preclearance-requests, POST /tenb5-plans"
  - priority: 9
    category: business_temporal
    check: "proposed trade inside blackout: SCHEDULED/ACTIVE applicable BlackoutWindow covers proposed_trade_date, unless bypassed by an APPROVED exception"
    error_id: ERR_TRADE_IN_BLACKOUT
    http_status: 422
    applies_to: "POST /preclearance-requests, POST /preclearance-requests/{id}/decision (outcome=APPROVE)"
  - priority: 10
    category: business_temporal
    check: "date range sanity: end strictly after start; new_end_at strictly greater than current end_at"
    error_id: ERR_DATE_RANGE_INVALID
    http_status: 422
    applies_to: "POST /blackout-windows, POST /deals, POST /blackout-windows/{id}/extend"
  - priority: 11
    category: business_constraint
    check: "policy/training currency: CoveredPerson.policy_ack_current and training_current must both be true"
    error_id: ERR_POLICY_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /preclearance-requests, POST /tenb5-plans"
    note: "ERR_POLICY_ACK_REQUIRED reported when policy_ack_current is false; ERR_TRAINING_OVERDUE reported when policy_ack_current is true but training_current is false"
  - priority: 12
    category: business_constraint
    check: "training overdue: CoveredPerson.training_current false (with ack current)"
    error_id: ERR_TRAINING_OVERDUE
    http_status: 422
    applies_to: "POST /preclearance-requests, POST /tenb5-plans"
  - priority: 13
    category: business_constraint
    check: "duplicate committee vote: voter already in voter_ids; voting on a non-SUBMITTED exception is ERR_INVALID_STATE (priority 5)"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /exception-requests/{id}/vote"
  - priority: 14
    category: business_constraint
    check: "quarterly window overlap: half-open [start_at, end_at) overlap with an existing SCHEDULED/ACTIVE QUARTERLY window; adjacency (end == start) allowed"
    error_id: ERR_DUPLICATE_QUARTER_WINDOW
    http_status: 409
    applies_to: "POST /blackout-windows (kind=QUARTERLY)"
  - priority: 15
    category: business_constraint
    check: "duplicate active restricted entry for the same ticker on manual creation"
    error_id: ERR_DUPLICATE_RESTRICTED_ENTRY
    http_status: 409
    applies_to: "POST /restricted-list-entries"
  - priority: 16
    category: business_constraint
    check: "overlapping approval lane: same person + ticker has an APPROVED request whose closed approval window [decided_at, approval_valid_until] contains proposed_trade_date"
    error_id: ERR_OVERLAPPING_APPROVAL
    http_status: 409
    applies_to: "POST /preclearance-requests"
  - priority: 17
    category: business_constraint
    check: "exception-linked request quantity must not exceed the exception's quantity"
    error_id: ERR_QUANTITY_EXCEEDS_APPROVED
    http_status: 422
    applies_to: "POST /preclearance-requests (when exception_id present)"
  - priority: 18
    category: business_referential
    check: "duplicate open case for a confirmation: a ViolationCase in a non-CLOSED status already references trade_confirmation_id"
    error_id: ERR_CASE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /violation-cases"
  - priority: 19
    category: state
    check: "OCC: expected_*_version matches the parent entity's current version (evaluated with the transition's state checks, before side effects)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /preclearance-requests/{id}/decision, POST /tenb5-plans, POST /blackout-windows/{id}/extend"
  - priority: 20
    category: business_constraint
    check: "request body schema: required fields present, values well-typed, quantities > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
    note: "Syntactic shape check; only observable as the sole failing check (a malformed body cannot reach deeper rules)"
  - priority: 21
    category: business_constraint
    check: "enum fields carry only declared members"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all endpoints with enum inputs"
    note: "Syntactic shape check; only observable as the sole failing check"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [LegalAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- CoveredPerson ---
  - method: POST
    path: "/covered-persons"
    description: "Create a covered person"
    roles: [LegalAdmin]
    code: 201
    input: [full_name, email, designation, department]
    output: CoveredPerson
    side_effects: ["status=ACTIVE, currency flags false, version=1"]
  - method: GET
    path: "/covered-persons/{id}"
    description: "Get a covered person"
    roles: [Insider, ComplianceOfficer, CommitteeMember, LegalAdmin]
    code: 200
    input: []
    output: CoveredPerson
    side_effects: []
  - method: GET
    path: "/covered-persons"
    description: "List covered persons (paginated)"
    roles: [Insider, ComplianceOfficer, CommitteeMember, LegalAdmin]
    code: 200
    input: ["designation?", "status?"]
    output: CoveredPerson[]
    side_effects: []

  # --- Deal ---
  - method: POST
    path: "/deals"
    description: "Deal intake"
    roles: [ComplianceOfficer]
    code: 201
    input: [codename, deal_type, security_ticker, "event_blackout_start?", "event_blackout_end?"]
    output: Deal
    side_effects: ["status=INTAKE"]
  - method: GET
    path: "/deals/{id}"
    description: "Get a deal"
    roles: [ComplianceOfficer, LegalAdmin]
    code: 200
    input: []
    output: Deal
    side_effects: []
  - method: POST
    path: "/deals/{id}/activate"
    description: "Activate a deal: creates restricted entry, optional event blackout, auto-denies pending preclearances on the ticker"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "status INTAKE -> ACTIVE; activated_at set; increments Deal.version by 1"
      - "RestrictedListEntry created (DEAL_INTAKE) — always, even if a MANUAL entry is already ACTIVE for the ticker"
      - "EVENT_DRIVEN BlackoutWindow created when event_blackout_start present (merge rule applies)"
      - "Pending PreclearanceRequests on the ticker -> DENIED (RESTRICTED_LIST)"
  - method: POST
    path: "/deals/{id}/close"
    description: "Close a deal (COMPLETED) or abandon it (ABANDONED): removes deal-sourced restricted entries, lifts/cancels deal windows"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: Deal
    side_effects:
      - "status ACTIVE -> CLOSED (COMPLETED) | ABANDONED; closed_at set; increments Deal.version by 1"
      - "Deal-sourced ACTIVE RestrictedListEntries -> REMOVED (DEAL_CLOSED)"
      - "Deal-sourced windows LIFTED (COMPLETED on ACTIVE) or CANCELLED"
  - method: GET
    path: "/deals/{id}/restricted-list-entries"
    description: "List restricted list entries sourced from a deal"
    roles: [ComplianceOfficer, LegalAdmin]
    code: 200
    input: []
    output: RestrictedListEntry[]
    side_effects: []

  # --- RestrictedListEntry ---
  - method: POST
    path: "/restricted-list-entries"
    description: "Manually add a ticker to the restricted list"
    roles: [ComplianceOfficer]
    code: 201
    input: [security_ticker, "note?"]
    output: RestrictedListEntry
    side_effects:
      - "status=ACTIVE, source=MANUAL"
      - "Cascade: pending PreclearanceRequests (SUBMITTED/UNDER_REVIEW) on the ticker -> DENIED (RESTRICTED_LIST)"
  - method: GET
    path: "/restricted-list-entries"
    description: "List restricted list entries (paginated)"
    roles: [ComplianceOfficer, LegalAdmin]
    code: 200
    input: ["security_ticker?", "status?"]
    output: RestrictedListEntry[]
    side_effects: []
  - method: POST
    path: "/restricted-list-entries/{id}/remove"
    description: "Remove an entry from the restricted list"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RestrictedListEntry
    side_effects: ["status ACTIVE -> REMOVED, removed_reason=MANUAL"]

  # --- BlackoutWindow ---
  - method: POST
    path: "/blackout-windows"
    description: "Create a QUARTERLY or EVENT_DRIVEN blackout window; event windows merge on overlap/touch with an existing event window on the same ticker"
    roles: [ComplianceOfficer]
    code: 201
    input: [kind, "fiscal_year?", "fiscal_quarter?", "security_ticker?", start_at, end_at]
    output: BlackoutWindow
    side_effects: ["status=SCHEDULED (or MERGED when absorbed); surviving window end/start extended on merge"]
  - method: GET
    path: "/blackout-windows/{id}"
    description: "Get a blackout window"
    roles: [Insider, ComplianceOfficer, CommitteeMember, LegalAdmin]
    code: 200
    input: []
    output: BlackoutWindow
    side_effects: []
  - method: GET
    path: "/blackout-windows"
    description: "List blackout windows (paginated)"
    roles: [Insider, ComplianceOfficer, CommitteeMember, LegalAdmin]
    code: 200
    input: ["kind?", "status?", "security_ticker?", "deal_id?", "merged_into_id?"]
    output: BlackoutWindow[]
    side_effects: []
  - method: POST
    path: "/blackout-windows/{id}/cancel"
    description: "Cancel a SCHEDULED window"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BlackoutWindow
    side_effects: ["status SCHEDULED -> CANCELLED"]
  - method: POST
    path: "/blackout-windows/{id}/extend"
    description: "Extend a SCHEDULED/ACTIVE window's end_at (OCC-guarded)"
    roles: [ComplianceOfficer]
    code: 200
    input: [new_end_at, expected_blackout_window_version]
    output: BlackoutWindow
    side_effects: ["end_at = new_end_at; increments BlackoutWindow.version by 1"]

  # --- PreclearanceRequest ---
  - method: POST
    path: "/preclearance-requests"
    description: "Submit a preclearance request"
    roles: [Insider]
    code: 201
    input: [covered_person_id, security_ticker, trade_side, quantity, proposed_trade_date, "exception_id?"]
    output: PreclearanceRequest
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/preclearance-requests/{id}"
    description: "Get a preclearance request"
    roles: [Insider, ComplianceOfficer, LegalAdmin]
    code: 200
    input: []
    output: PreclearanceRequest
    side_effects: []
  - method: GET
    path: "/preclearance-requests"
    description: "List preclearance requests (paginated)"
    roles: [Insider, ComplianceOfficer, LegalAdmin]
    code: 200
    input: ["covered_person_id?", "status?"]
    output: PreclearanceRequest[]
    side_effects: []
  - method: POST
    path: "/preclearance-requests/{id}/review"
    description: "Move a request UNDER_REVIEW"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PreclearanceRequest
    side_effects: ["status SUBMITTED -> UNDER_REVIEW; increments PreclearanceRequest.version by 1"]
  - method: POST
    path: "/preclearance-requests/{id}/decision"
    description: "Approve or deny an UNDER_REVIEW request (OCC-guarded; segregation of duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "denial_reason?", expected_preclearance_version]
    output: PreclearanceRequest
    side_effects:
      - "status UNDER_REVIEW -> APPROVED | DENIED; decided_at/decided_by set; increments PreclearanceRequest.version by 1"
      - "on APPROVE: approval_valid_until = decided_at + 48h; remaining_quantity = quantity"
  - method: POST
    path: "/preclearance-requests/{id}/withdraw"
    description: "Withdraw a SUBMITTED/UNDER_REVIEW request"
    roles: [Insider]
    code: 200
    input: []
    output: PreclearanceRequest
    side_effects: ["status -> WITHDRAWN; increments PreclearanceRequest.version by 1"]
  - method: GET
    path: "/preclearance-requests/{id}/trade-confirmations"
    description: "List confirmations matched to a request"
    roles: [Insider, ComplianceOfficer, LegalAdmin]
    code: 200
    input: []
    output: TradeConfirmation[]
    side_effects: []

  # --- ExceptionRequest ---
  - method: POST
    path: "/exception-requests"
    description: "Submit a hardship exception request"
    roles: [Insider]
    code: 201
    input: [covered_person_id, security_ticker, quantity, hardship_reason]
    output: ExceptionRequest
    side_effects: ["status=SUBMITTED; decision_window_end = created_at + 5 days"]
  - method: GET
    path: "/exception-requests/{id}"
    description: "Get an exception request"
    roles: [Insider, ComplianceOfficer, CommitteeMember, LegalAdmin]
    code: 200
    input: []
    output: ExceptionRequest
    side_effects: []
  - method: GET
    path: "/exception-requests"
    description: "List exception requests (paginated)"
    roles: [Insider, ComplianceOfficer, CommitteeMember, LegalAdmin]
    code: 200
    input: ["covered_person_id?", "status?"]
    output: ExceptionRequest[]
    side_effects: []
  - method: POST
    path: "/exception-requests/{id}/vote"
    description: "Committee vote; quorum of 2 decides APPROVED/DENIED"
    roles: [CommitteeMember]
    code: 200
    input: [vote]
    output: ExceptionRequest
    side_effects:
      - "voter_ids += voter; votes_for/votes_against recomputed; increments ExceptionRequest.version by 1"
      - "on reaching quorum: status -> APPROVED | DENIED; decided_at set"
  - method: POST
    path: "/exception-requests/{id}/withdraw"
    description: "Withdraw a SUBMITTED exception request"
    roles: [Insider]
    code: 200
    input: []
    output: ExceptionRequest
    side_effects: ["status SUBMITTED -> WITHDRAWN; increments ExceptionRequest.version by 1"]
  - method: GET
    path: "/exception-requests/{id}/preclearance-requests"
    description: "List preclearance requests citing this exception"
    roles: [Insider, ComplianceOfficer, CommitteeMember, LegalAdmin]
    code: 200
    input: []
    output: PreclearanceRequest[]
    side_effects: []

  # --- TenB5Plan ---
  - method: POST
    path: "/tenb5-plans"
    description: "Create a 10b5-1 plan (OCC on CoveredPerson.version; supersedes existing DRAFT/SUBMITTED/RETURNED plan for same person + ticker)"
    roles: [Insider]
    code: 201
    input: [covered_person_id, security_ticker, total_quantity, first_trade_date, expected_covered_person_version]
    output: TenB5Plan
    side_effects:
      - "status=DRAFT"
      - "existing plan for same person + ticker in {DRAFT, SUBMITTED, RETURNED} -> CANCELLED"
      - "increments CoveredPerson.version by 1"
  - method: GET
    path: "/tenb5-plans/{id}"
    description: "Get a plan"
    roles: [Insider, ComplianceOfficer, LegalAdmin]
    code: 200
    input: []
    output: TenB5Plan
    side_effects: []
  - method: GET
    path: "/tenb5-plans"
    description: "List plans (paginated)"
    roles: [Insider, ComplianceOfficer, LegalAdmin]
    code: 200
    input: ["covered_person_id?", "status?"]
    output: TenB5Plan[]
    side_effects: []
  - method: POST
    path: "/tenb5-plans/{id}/submit"
    description: "Submit a DRAFT or RETURNED plan for review"
    roles: [Insider]
    code: 200
    input: []
    output: TenB5Plan
    side_effects: ["status DRAFT|RETURNED -> SUBMITTED; increments TenB5Plan.version by 1"]
  - method: POST
    path: "/tenb5-plans/{id}/decision"
    description: "Approve (computes cooling_off_end) or return a SUBMITTED plan (segregation of duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "return_note?"]
    output: TenB5Plan
    side_effects: ["status SUBMITTED -> APPROVED | RETURNED; approved_at/approved_by or return_note set; increments TenB5Plan.version by 1"]
  - method: POST
    path: "/tenb5-plans/{id}/action"
    description: "SUSPEND (ACTIVE), RESUME (SUSPENDED), TERMINATE (DRAFT/ACTIVE/SUSPENDED)"
    roles: [ComplianceOfficer, Insider]
    code: 200
    input: [action]
    output: TenB5Plan
    side_effects: ["status transition per action; increments TenB5Plan.version by 1"]

  # --- TradeConfirmation ---
  - method: POST
    path: "/trade-confirmations"
    description: "Ingest a broker trade confirmation; runs the matching pass (preclearance, then plan, else flag + auto-open violation case + compliance hold)"
    roles: [ComplianceOfficer]
    code: 201
    input: [covered_person_id, security_ticker, trade_side, quantity, price, trade_date, broker_ref]
    output: TradeConfirmation
    side_effects:
      - "status resolved by matching pass (RECEIVED transient; response shows final MATCHED_PRECLEARANCE | MATCHED_PLAN | FLAGGED)"
      - "on MATCHED_PRECLEARANCE: request quantities consumed per matched_quantity_consumption; request CLOSED at zero remaining"
      - "on FLAGGED: ViolationCase auto-created (AUTO_FLAG) and CoveredPerson.compliance_hold set"
  - method: GET
    path: "/trade-confirmations/{id}"
    description: "Get a confirmation"
    roles: [Insider, ComplianceOfficer, LegalAdmin]
    code: 200
    input: []
    output: TradeConfirmation
    side_effects: []
  - method: GET
    path: "/trade-confirmations"
    description: "List confirmations (paginated)"
    roles: [Insider, ComplianceOfficer, LegalAdmin]
    code: 200
    input: ["covered_person_id?", "match_plan_id?", "status?"]
    output: TradeConfirmation[]
    side_effects: []

  # --- ViolationCase ---
  - method: POST
    path: "/violation-cases"
    description: "Manually open a violation case"
    roles: [ComplianceOfficer]
    code: 201
    input: [covered_person_id, violation_type, "trade_confirmation_id?", "note?"]
    output: ViolationCase
    side_effects: ["status=OPENED, source=MANUAL; CoveredPerson.compliance_hold recomputed"]
  - method: GET
    path: "/violation-cases/{id}"
    description: "Get a violation case"
    roles: [ComplianceOfficer, LegalAdmin]
    code: 200
    input: []
    output: ViolationCase
    side_effects: []
  - method: GET
    path: "/violation-cases"
    description: "List violation cases (paginated)"
    roles: [ComplianceOfficer, LegalAdmin]
    code: 200
    input: ["covered_person_id?", "trade_confirmation_id?", "status?"]
    output: ViolationCase[]
    side_effects: []
  - method: POST
    path: "/violation-cases/{id}/action"
    description: "Advance a case: BEGIN_INVESTIGATION | ESCALATE | DEESCALATE | SUBSTANTIATE | UNFOUND | RECORD_SANCTION | CLOSE"
    roles: [ComplianceOfficer]
    code: 200
    input: [action]
    output: ViolationCase
    side_effects:
      - "status transition per action; increments ViolationCase.version by 1"
      - "SUBSTANTIATE computes severity_score; RECORD_SANCTION derives sanction and suspends the person for SUSPENSION_* sanctions"
      - "CLOSE from UNFOUNDED clears the linked confirmation and recomputes compliance_hold"

  # --- Attestation ---
  - method: POST
    path: "/attestations"
    description: "Assign a policy acknowledgment or annual training"
    roles: [LegalAdmin]
    code: 201
    input: [covered_person_id, kind, period_year, due_date]
    output: Attestation
    side_effects: ["status=ASSIGNED"]
  - method: GET
    path: "/attestations/{id}"
    description: "Get an attestation"
    roles: [Insider, ComplianceOfficer, LegalAdmin]
    code: 200
    input: []
    output: Attestation
    side_effects: []
  - method: GET
    path: "/attestations"
    description: "List attestations (paginated)"
    roles: [Insider, ComplianceOfficer, LegalAdmin]
    code: 200
    input: ["covered_person_id?", "kind?", "status?"]
    output: Attestation[]
    side_effects: []
  - method: POST
    path: "/attestations/{id}/complete"
    description: "Complete an attestation (ASSIGNED or OVERDUE)"
    roles: [Insider]
    code: 200
    input: []
    output: Attestation
    side_effects: ["status -> COMPLETED; completed_at set; recomputes CoveredPerson currency flags (increments CoveredPerson.version by 1)"]

  # --- Sweep ---
  - method: POST
    path: "/compliance-sweeps"
    description: "Run the compliance sweep (window activate/lift + void cascade, approval/exception expiry, plan activation at cooling_off_end, attestation overdue, suspension reinstatement, RECEIVED confirmation re-match) in the order pinned by sweep_recompute"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: "{ windows_activated: integer, windows_lifted: integer, approvals_expired: integer, approvals_voided: integer, exceptions_expired: integer, plans_activated: integer, attestations_overdue: integer, persons_reinstated: integer, confirmations_remanaged: integer }"
    side_effects: ["per sweep_recompute step order"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint, or Insider attempts an action on another person's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or malformed value (bad datetime, non-positive quantity)" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries a value outside its declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (incl. terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_SELF_ACTION_FORBIDDEN, http: 403, condition: "Segregation of duties: actor is the owner of the request/plan/exception being decided or voted on" }
  - { id: ERR_SECURITY_RESTRICTED, http: 422, condition: "Ticker has an ACTIVE RestrictedListEntry" }
  - { id: ERR_COMPLIANCE_HOLD, http: 422, condition: "Subject has an open ViolationCase blocking new submissions" }
  - { id: ERR_TRADE_IN_BLACKOUT, http: 422, condition: "Proposed trade date covered by a SCHEDULED/ACTIVE applicable BlackoutWindow without an APPROVED exception bypass" }
  - { id: ERR_DATE_RANGE_INVALID, http: 422, condition: "end_at <= start_at, or new_end_at <= current end_at, or event window end present without start" }
  - { id: ERR_POLICY_ACK_REQUIRED, http: 422, condition: "CoveredPerson.policy_ack_current is false" }
  - { id: ERR_TRAINING_OVERDUE, http: 422, condition: "policy_ack_current true but training_current false" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Committee member already voted on this exception request" }
  - { id: ERR_DUPLICATE_QUARTER_WINDOW, http: 409, condition: "New QUARTERLY window's half-open interval overlaps an existing SCHEDULED/ACTIVE QUARTERLY window" }
  - { id: ERR_DUPLICATE_RESTRICTED_ENTRY, http: 409, condition: "Manual entry for a ticker that already has an ACTIVE entry" }
  - { id: ERR_OVERLAPPING_APPROVAL, http: 409, condition: "proposed_trade_date falls inside the closed approval window [decided_at, approval_valid_until] of an existing APPROVED request for the same person + ticker" }
  - { id: ERR_QUANTITY_EXCEEDS_APPROVED, http: 422, condition: "Exception-linked preclearance quantity exceeds the exception's quantity" }
  - { id: ERR_CASE_ALREADY_OPEN, http: 409, condition: "A non-CLOSED ViolationCase already references this trade_confirmation_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Insider
    description: "Covered person (employee, officer, director, consultant) requesting preclearance, exceptions, and 10b5-1 plans, and completing own attestations"
    identity: "entity_backed:CoveredPerson"
    exclusive_operations:
      - "POST /preclearance-requests — submit own preclearance request"
      - "POST /preclearance-requests/{id}/withdraw — withdraw own request"
      - "POST /exception-requests — submit own hardship exception"
      - "POST /exception-requests/{id}/withdraw — withdraw own exception"
      - "POST /tenb5-plans — create own 10b5-1 plan"
      - "POST /tenb5-plans/{id}/submit — submit own plan"
      - "POST /attestations/{id}/complete — complete own attestation"
    shared_operations:
      - "GET reads of own resources and blackout windows"
      - "POST /tenb5-plans/{id}/action with action=TERMINATE on own plan (shared with ComplianceOfficer)"
  - name: ComplianceOfficer
    description: "Legal department compliance officer: reviews preclearance, maintains restricted list and blackout calendar, runs deal intake, ingests confirmations, investigates violations, runs sweeps. May never decide or vote on own submissions."
    identity: "entity_backed:CoveredPerson"
    exclusive_operations:
      - "POST /deals, /deals/{id}/activate, /deals/{id}/close — deal lifecycle"
      - "POST /restricted-list-entries, /restricted-list-entries/{id}/remove — restricted list maintenance"
      - "POST /blackout-windows, /blackout-windows/{id}/cancel, /blackout-windows/{id}/extend — blackout calendar"
      - "POST /preclearance-requests/{id}/review, /preclearance-requests/{id}/decision — preclearance review chain"
      - "POST /tenb5-plans/{id}/decision — plan review"
      - "POST /trade-confirmations — confirmation ingestion"
      - "POST /violation-cases, /violation-cases/{id}/action — investigation"
      - "POST /compliance-sweeps — sweep"
    shared_operations:
      - "GET reads across the surface"
      - "POST /tenb5-plans/{id}/action — SUSPEND/RESUME officer-only; TERMINATE shared with Insider owner"
  - name: CommitteeMember
    description: "Exception committee member: votes on hardship exception requests; cannot vote on own request"
    identity: "entity_backed:CoveredPerson"
    exclusive_operations:
      - "POST /exception-requests/{id}/vote — cast committee vote"
    shared_operations:
      - "GET reads of exception requests, blackout windows, covered persons"
  - name: LegalAdmin
    description: "Operational administrator: onboards covered persons, assigns attestations, sets the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /covered-persons — onboard covered person"
      - "POST /attestations — assign policy ack / annual training"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET reads across the surface"
