              as: PlantAdmin
              captures: { std_se_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 15.80, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
              captures: { plat_v_released: $.data.version }
            - call: "POST /plant/certification-records"
              payload: { platform_id: "${plat_id}", region_code: "SOUTHEAST", rated_seer2_submitted: 15.80, expected_platform_version: "${plat_v_released}" }
              as: CertificationEngineer
              as_user_id: "user-ce-1"
              captures: { cert_id: $.data.id }
            - call: "POST /plant/certification-records/${cert_id}/submit"
              payload: {}
              as: CertificationEngineer
              as_user_id: "user-ce-1"
            - call: "POST /plant/certification-records/${cert_id}/decide"
              payload: { decision: "REJECTED", rejection_reason: "SEER2 test report incomplete" }
              as: RegulatoryAuditor
