      - name: credential_validity_overlap_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CREDENTIAL_VALIDITY_OVERLAP]
          - validations[priority 20]
        distinguishing_aspect: "The half-open interval rule rejects a strictly overlapping credential window on the same device with 409 ERR_CREDENTIAL_VALIDITY_OVERLAP while accepting an exactly adjacent one."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / credential_validity_windows_per_device_reject_overlap_accept_adjacency
          rationale: "That §1.8 instance already triggers ERR_CREDENTIAL_VALIDITY_OVERLAP on the strictly-overlapping window and then proves the adjacent window is accepted in the same test, which is the stronger form of this claim."

      - name: trust_list_window_overlap_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TRUST_LIST_WINDOW_OVERLAP]
          - validations[priority 21]
        distinguishing_aspect: "Publishing a snapshot whose effective window strictly overlaps the incumbent returns 409 ERR_TRUST_LIST_WINDOW_OVERLAP."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / trust_list_snapshots_must_tile_exactly_rejecting_gap_and_overlap
          rationale: "That §1.8 instance triggers ERR_TRUST_LIST_WINDOW_OVERLAP as one of its three probes, alongside the gap rejection and the exact-tiling acceptance."

      - name: trust_list_window_gap_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TRUST_LIST_WINDOW_GAP]
          - validations[priority 21]
        distinguishing_aspect: "Publishing a snapshot that starts even one second after the incumbent ends returns 422 ERR_TRUST_LIST_WINDOW_GAP, because cross-state acceptance requires an unbroken tiling."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / trust_list_snapshots_must_tile_exactly_rejecting_gap_and_overlap
          rationale: "That §1.8 instance triggers ERR_TRUST_LIST_WINDOW_GAP with a one-second gap in the same test that proves exact adjacency is accepted."

      - name: reader_certificate_window_conflict_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CERT_WINDOW_CONFLICT]
          - validations[priority 22]
        distinguishing_aspect: "Re-registering the same app_identifier with a certificate that starts less than 24 hours after the incumbent's expiry returns 422 ERR_CERT_WINDOW_CONFLICT."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / verifier_trust_status_outranks_reader_cert_renewal_buffer
          rationale: "That §1.8 instance triggers ERR_CERT_WINDOW_CONFLICT once the verifier trust gate is satisfied, after first showing the trust gate outranks it."

      - name: verifier_not_trusted_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_VERIFIER_NOT_TRUSTED]
          - validations[priority 16]
        distinguishing_aspect: "A verifier outside {APPROVED, PROBATION} cannot register a reader app or open a presentation: 403 ERR_VERIFIER_NOT_TRUSTED."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / verifier_trust_status_outranks_reader_cert_renewal_buffer
          rationale: "That §1.8 instance triggers ERR_VERIFIER_NOT_TRUSTED on a SUSPENDED verifier whose request ALSO breaks the 24-hour certificate buffer, proving both the code and its precedence."

      - name: handset_surrender_prohibited_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HANDSET_SURRENDER_PROHIBITED]
          - validations[priority 13]
        distinguishing_aspect: "A presentation requesting handset_handling SURRENDER_TO_OFFICER returns 422 ERR_HANDSET_SURRENDER_PROHIBITED."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / handset_surrender_prohibition_outranks_retention_ceiling
          rationale: "That §1.8 instance triggers ERR_HANDSET_SURRENDER_PROHIBITED on a request that also exceeds the retention ceiling, so it pins both the code and its priority-13 precedence."

      - name: retention_ceiling_exceeded_error_corner
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RETENTION_CEILING_EXCEEDED]
          - validations[priority 31]
        distinguishing_aspect: "A presentation declaring retention_days above the verifier's retention_ceiling_days returns 422 ERR_RETENTION_CEILING_EXCEEDED."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / handset_surrender_prohibition_outranks_retention_ceiling
          rationale: "That §1.8 instance triggers ERR_RETENTION_CEILING_EXCEEDED in its second probe, once the surrender request is corrected to NO_SURRENDER, and the inclusive boundary at exactly the ceiling is covered by retention_days_exactly_at_the_ceiling_is_accepted in the validations section."

  # ===========================================================================
  # SECTION: rbac  (claim-extraction-guide "From Table 7" - every role can do
  # its own exclusive operations, cannot do another role's, plus the
  # role_model: segregation_of_duties row)
  # ===========================================================================
  - section: rbac
    instances:

      - name: proofing_agent_runs_all_three_of_its_exclusive_operations
        claim_type: exclusive_operations_permitted
        grounds:
          - roles[ProofingAgent].exclusive_operations
          - endpoints[POST /mdl/proofing-sessions]
          - endpoints[POST /mdl/proofing-sessions/{id}/evidence]
          - endpoints[POST /mdl/proofing-sessions/{id}/submit]
        distinguishing_aspect: "A ProofingAgent can open a session, capture evidence and submit it, and the session records proofing_agent_user_id = the submitting agent's X-User-ID - the field the segregation-of-duties rule later reads."
        test_recipe:
          setup:
            - "One InteropProfile and one eligible Holder exist."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_id: "$.data.id" }
          trigger:
            - call: "POST /mdl/proofing-sessions"
              payload: { holder_id: "${holder_id}", requested_assurance_level: "IAL2" }
              as: ProofingAgent
              as_user_id: "pa-007"
              captures: { session_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "STRONG", captured_at: "2026-07-20T09:00:00Z", source_reference: "doc-1" }
              as: ProofingAgent
              as_user_id: "pa-007"
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "KNOWLEDGE_CHECK", quality: "STRONG", captured_at: "2026-07-20T09:05:00Z", source_reference: "kba-1" }
              as: ProofingAgent
              as_user_id: "pa-007"
            - call: "POST /mdl/proofing-sessions/${session_id}/submit"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-007"
            - call: "GET /mdl/proofing-sessions/${session_id}"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-007"
          assert:
            - "POST /mdl/proofing-sessions status == 201"
            - "each POST /mdl/proofing-sessions/${session_id}/evidence status == 201"
            - "POST /mdl/proofing-sessions/${session_id}/submit status == 200"
            - "GET /mdl/proofing-sessions/${session_id} response data.state == \"SUBMITTED\""
            - "GET /mdl/proofing-sessions/${session_id} response data.evidence_count == 2"
            - "GET /mdl/proofing-sessions/${session_id} response data.proofing_agent_user_id == \"pa-007\""

      - name: privacy_auditor_reads_the_two_privacy_surfaces_it_owns
        claim_type: exclusive_operations_permitted
        grounds:
          - roles[PrivacyAuditor].shared_operations
          - endpoints[GET /mdl/verifiers/{id}/exposure-index]
          - endpoints[GET /mdl/verifiers/{id}/presentation-log-entries]
        distinguishing_aspect: "PrivacyAuditor is listed on the exposure-index and presentation-log-entries reads, so both return 200 for it on a brand-new verifier: both exposure variants read 0 and the log is empty."
        test_recipe:
          setup:
            - "One verifier exists with no reader apps and no presentations."
          setup_api_calls:
            - call: "POST /mdl/verifiers"
              payload: { organization_name: "Prairie Cellars", category: "AGE_RESTRICTED_RETAIL", purpose_scope: ["family_name", "age_over_21"], retention_ceiling_days: 30 }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { verifier_id: "$.data.id" }
          trigger:
            - call: "GET /mdl/verifiers/${verifier_id}/exposure-index"
              payload: {}
              as: PrivacyAuditor
              as_user_id: "pauditor-001"
            - call: "GET /mdl/verifiers/${verifier_id}/presentation-log-entries"
              payload: {}
              as: PrivacyAuditor
              as_user_id: "pauditor-001"
          assert:
            - "GET /mdl/verifiers/${verifier_id}/exposure-index status == 200"
            - "GET /mdl/verifiers/${verifier_id}/exposure-index response data.rolling_window_index == 0"
            - "GET /mdl/verifiers/${verifier_id}/exposure-index response data.since_last_attestation_index == 0"
            - "GET /mdl/verifiers/${verifier_id}/exposure-index response data.rolling_window_entry_count == 0"
            - "GET /mdl/verifiers/${verifier_id}/presentation-log-entries status == 200"
            - "GET /mdl/verifiers/${verifier_id}/presentation-log-entries response total_count == 0"

      - name: verifier_operator_registers_its_reader_app_and_attests_retention
        claim_type: exclusive_operations_permitted
        grounds:
          - roles[VerifierOperator].exclusive_operations
          - endpoints[POST /mdl/reader-apps]
          - endpoints[POST /mdl/verifiers/{id}/retention-attestation]
        distinguishing_aspect: "Acting on its OWN verifier id, a VerifierOperator may register a reader app and file a retention attestation: the attestation records attested_max_retention_days 14, sets last_attestation_at to the test clock and leaves trust_status APPROVED because the empty log scores 0."
        test_recipe:
          setup:
            - "One APPROVED verifier with retention_ceiling_days 30 and no presentations."
          setup_api_calls:
            - call: "POST /mdl/verifiers"
              payload: { organization_name: "Prairie Cellars", category: "AGE_RESTRICTED_RETAIL", purpose_scope: ["family_name", "age_over_21"], retention_ceiling_days: 30 }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { verifier_id: "$.data.id" }
            - call: "POST /mdl/verifiers/${verifier_id}/trust-decision"
              payload: { decision: "APPROVE" }
              as: SystemAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /mdl/reader-apps"
              payload: { verifier_id: "${verifier_id}", app_identifier: "till-a", certificate_serial: "SER-A1", cert_not_before: "2026-07-01T00:00:00Z", cert_not_after: "2027-07-01T00:00:00Z", requested_elements: ["family_name", "age_over_21"], base_rate_cents: 30 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
            - call: "POST /mdl/verifiers/${verifier_id}/retention-attestation"
              payload: { attested_max_retention_days: 14 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
            - call: "GET /mdl/verifiers/${verifier_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
          assert:
            - "POST /mdl/reader-apps status == 201"
            - "POST /mdl/verifiers/${verifier_id}/retention-attestation status == 200"
            - "GET /mdl/verifiers/${verifier_id} response data.attested_max_retention_days == 14"
            - "GET /mdl/verifiers/${verifier_id} response data.last_attestation_at == \"2026-08-01T00:00:00Z\""
            - "GET /mdl/verifiers/${verifier_id} response data.exposure_index == 0"
            - "GET /mdl/verifiers/${verifier_id} response data.trust_status == \"APPROVED\""

      - name: each_role_is_denied_another_roles_exclusive_operation
        claim_type: cross_role_operation_denied
        grounds:
          - roles[SystemAdmin].exclusive_operations
          - roles[ProofingAgent].exclusive_operations
          - roles[CredentialAdjudicator].exclusive_operations
          - roles[Holder].exclusive_operations
          - roles[VerifierOperator].exclusive_operations
          - roles[PrivacyAuditor].exclusive_operations
          - validations[priority 2]
        distinguishing_aspect: "Six probes, one per role, each aimed at another role's exclusive operation, all return 403 ERR_FORBIDDEN_ROLE - and because the role check sits at priority 2 they do so even when the path id does not exist, which is what distinguishes a real role gate from a 404-first implementation."
        test_recipe:
          setup:
            - "Empty database; every id used below is deliberately non-existent."
          setup_api_calls: []
          trigger:
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: Holder
              as_user_id: "ho-nope"
              captures: { err_holder_probe: "$.data.error_id" }
            - call: "POST /mdl/verifiers"
              payload: { organization_name: "Prairie Cellars", category: "AGE_RESTRICTED_RETAIL", purpose_scope: ["family_name", "age_over_21"], retention_ceiling_days: 30 }
              as: ProofingAgent
              as_user_id: "pa-001"
              captures: { err_proofing_probe: "$.data.error_id" }
            - call: "POST /mdl/proofing-sessions/ps-nope/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "STRONG", captured_at: "2026-07-20T09:00:00Z", source_reference: "doc-1" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
              captures: { err_adjudicator_probe: "$.data.error_id" }
            - call: "POST /mdl/devices/dev-nope/attest"
              payload: { attestation_result: "PASS", secure_element_grade: "HARDWARE_STRONGBOX" }
              as: VerifierOperator
              as_user_id: "vo-nope"
              captures: { err_verifier_probe: "$.data.error_id" }
            - call: "POST /mdl/credentials/cr-nope/revoke"
              payload: { reason: "ADMIN_HOLD" }
              as: PrivacyAuditor
              as_user_id: "pauditor-001"
              captures: { err_auditor_probe: "$.data.error_id" }
            - call: "POST /mdl/presentation-sessions/pres-nope/disclose"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { err_admin_probe: "$.data.error_id" }
          assert:
            - "POST /mdl/holders as Holder status == 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "POST /mdl/verifiers as ProofingAgent status == 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "POST /mdl/proofing-sessions/ps-nope/evidence as CredentialAdjudicator status == 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "POST /mdl/devices/dev-nope/attest as VerifierOperator status == 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "POST /mdl/credentials/cr-nope/revoke as PrivacyAuditor status == 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "POST /mdl/presentation-sessions/pres-nope/disclose as SystemAdmin status == 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\""

      - name: verifier_operator_cannot_register_a_reader_app_for_another_verifier
        claim_type: peer_resource_isolation
        grounds:
          - roles[VerifierOperator].entity_backed
          - validations[priority 6]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Both verifiers are APPROVED, so the trust gate at priority 16 is satisfied; the request still fails with 403 ERR_NOT_RESOURCE_OWNER because X-User-ID is verifier B while the body names verifier A, and A ends the test with zero reader apps."
        test_recipe:
          setup:
            - "Two verifiers, A and B, both APPROVED."
          setup_api_calls:
            - call: "POST /mdl/verifiers"
              payload: { organization_name: "Prairie Cellars", category: "AGE_RESTRICTED_RETAIL", purpose_scope: ["family_name", "age_over_21"], retention_ceiling_days: 30 }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { verifier_a_id: "$.data.id" }
            - call: "POST /mdl/verifiers/${verifier_a_id}/trust-decision"
              payload: { decision: "APPROVE" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/verifiers"
              payload: { organization_name: "Sandhills Bank", category: "FINANCIAL", purpose_scope: ["family_name", "birth_date"], retention_ceiling_days: 60 }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { verifier_b_id: "$.data.id" }
            - call: "POST /mdl/verifiers/${verifier_b_id}/trust-decision"
              payload: { decision: "APPROVE" }
              as: SystemAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /mdl/reader-apps"
              payload: { verifier_id: "${verifier_a_id}", app_identifier: "till-a", certificate_serial: "SER-A1", cert_not_before: "2026-07-01T00:00:00Z", cert_not_after: "2027-07-01T00:00:00Z", requested_elements: ["family_name", "age_over_21"], base_rate_cents: 30 }
              as: VerifierOperator
              as_user_id: "${verifier_b_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /mdl/verifiers/${verifier_a_id}/reader-apps"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
          assert:
            - "POST /mdl/reader-apps status == 403"
            - "response data.error_id == \"ERR_NOT_RESOURCE_OWNER\""
            - "GET /mdl/verifiers/${verifier_a_id}/reader-apps response total_count == 0"

      - name: same_user_cannot_adjudicate_the_session_they_proofed
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority 12]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The role header alone is not enough: a caller presenting X-User-Role CredentialAdjudicator but X-User-ID pa-007 - the very user recorded as proofing_agent_user_id - gets 409 ERR_SEGREGATION_OF_DUTIES, the session stays SUBMITTED with decision null, and a DIFFERENT adjudicator then succeeds."
        test_recipe:
          setup:
            - "Profile and eligible holder exist."
            - "Agent pa-007 opens, evidences (DOCUMENT_SCAN STRONG 250 + KNOWLEDGE_CHECK STRONG 90 + ADDRESS_CORROBORATION STRONG 80 = 420) and submits an IAL2 session."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions"
              payload: { holder_id: "${holder_id}", requested_assurance_level: "IAL2" }
              as: ProofingAgent
              as_user_id: "pa-007"
              captures: { session_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "STRONG", captured_at: "2026-07-20T09:00:00Z", source_reference: "doc-1" }
              as: ProofingAgent
              as_user_id: "pa-007"
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "KNOWLEDGE_CHECK", quality: "STRONG", captured_at: "2026-07-20T09:05:00Z", source_reference: "kba-1" }
              as: ProofingAgent
              as_user_id: "pa-007"
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "ADDRESS_CORROBORATION", quality: "STRONG", captured_at: "2026-07-20T09:10:00Z", source_reference: "addr-1" }
              as: ProofingAgent
              as_user_id: "pa-007"
            - call: "POST /mdl/proofing-sessions/${session_id}/submit"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-007"
          trigger:
            - call: "POST /mdl/proofing-sessions/${session_id}/adjudicate"
              payload: { decision: "VERIFY" }
              as: CredentialAdjudicator
              as_user_id: "pa-007"
              captures: { err: "$.data.error_id" }
            - call: "GET /mdl/proofing-sessions/${session_id}"
              payload: {}
              as: CredentialAdjudicator
              as_user_id: "ca-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/adjudicate"
              payload: { decision: "VERIFY" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
            - call: "GET /mdl/proofing-sessions/${session_id}"
              payload: {}
              as: CredentialAdjudicator
              as_user_id: "ca-001"
          assert:
            - "the adjudicate call sent with X-User-ID pa-007 status == 409"
            - "response data.error_id == \"ERR_SEGREGATION_OF_DUTIES\""
            - "the first GET /mdl/proofing-sessions/${session_id} response data.state == \"SUBMITTED\""
            - "the first GET /mdl/proofing-sessions/${session_id} response data.decision == null"
            - "the adjudicate call sent with X-User-ID ca-001 status == 200"
            - "the second GET /mdl/proofing-sessions/${session_id} response data.state == \"VERIFIED\""
            - "the second GET /mdl/proofing-sessions/${session_id} response data.assurance_score == 420"
            - "the second GET /mdl/proofing-sessions/${session_id} response data.granted_assurance_level == \"IAL2\""

  # ===========================================================================
  # SECTION: cross_cutting_complexity_layers
  # (claim-extraction-guide "From Cross-Cutting Complexity Layers" for the four
  #  declared layers: optimistic_concurrency, cascading_side_effects,
  #  dual_variant_calculation, rate_threshold_triggers)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_device_version_returns_stale_device_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[credential-provision-stale-device]
          - errors[ERR_STALE_DEVICE_VERSION]
          - validations[priority 11]
        distinguishing_aspect: "Provisioning with expected_device_version one BELOW the handset's current version returns 412 ERR_STALE_DEVICE_VERSION and creates nothing; retrying the identical body with the current version returns 201, so the guard is the version comparison and not the body."
        test_recipe:
          setup:
            - "Profile, eligible holder, one ATTESTED handset (create -> version 1, attest -> version 2) and one VERIFIED IAL2 proofing session."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_id: "$.data.id" }
            - call: "POST /mdl/devices"
              payload: { holder_id: "${holder_id}", platform: "ANDROID", model_name: "Pixel 9", hardware_attestation_token: "att-tok-a1", protection_method: "BIOMETRIC" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { device_id: "$.data.id" }
            - call: "POST /mdl/devices/${device_id}/attest"
              payload: { attestation_result: "PASS", secure_element_grade: "HARDWARE_STRONGBOX" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/proofing-sessions"
              payload: { holder_id: "${holder_id}", requested_assurance_level: "IAL2" }
              as: ProofingAgent
              as_user_id: "pa-001"
              captures: { session_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "STRONG", captured_at: "2026-07-20T09:00:00Z", source_reference: "doc-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "BIOMETRIC_MATCH", quality: "STRONG", captured_at: "2026-07-20T09:05:00Z", source_reference: "bio-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/submit"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/adjudicate"
              payload: { decision: "VERIFY" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
            - call: "GET /mdl/devices/${device_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { device_v: "$.data.version" }
          trigger:
            - call: "POST /mdl/credentials"
              payload: { holder_id: "${holder_id}", device_id: "${device_id}", proofing_session_id: "${session_id}", valid_from: "2026-08-01T00:00:00Z", valid_until: "2031-07-01T00:00:00Z", expected_device_version: "${device_v} - 1" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
              captures: { err: "$.data.error_id" }
            - call: "GET /mdl/credentials"
              payload: { holder_id: "${holder_id}" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
            - call: "POST /mdl/credentials"
              payload: { holder_id: "${holder_id}", device_id: "${device_id}", proofing_session_id: "${session_id}", valid_from: "2026-08-01T00:00:00Z", valid_until: "2031-07-01T00:00:00Z", expected_device_version: "${device_v}" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
            - call: "GET /mdl/devices/${device_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
          assert:
            - "the POST /mdl/credentials sent with the stale version status == 412"
            - "response data.error_id == \"ERR_STALE_DEVICE_VERSION\""
            - "GET /mdl/credentials response total_count == 0"
            - "the POST /mdl/credentials sent with the current version status == 201"
            - "GET /mdl/devices/${device_id} response data.state == \"BOUND\""
            - "GET /mdl/devices/${device_id} response data.version == 3"

      - name: stale_expected_interop_profile_version_returns_stale_interop_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[trust-list-publish-stale-profile]
          - errors[ERR_STALE_INTEROP_VERSION]
          - validations[priority 11]
        distinguishing_aspect: "Trust-list publication carries optimistic concurrency on the InteropProfile: a snapshot whose expected_interop_profile_version is one below the profile's version returns 412 ERR_STALE_INTEROP_VERSION and publishes nothing, while the same body with the current version publishes snapshot_sequence 1 and bumps the profile to version 2."
        test_recipe:
          setup:
            - "One InteropProfile at version 1 with no snapshots."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
