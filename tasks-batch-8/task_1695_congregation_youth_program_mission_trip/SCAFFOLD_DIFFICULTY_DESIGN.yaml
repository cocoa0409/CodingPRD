            # reg2 fundraising: CASH 20000 meets the 20000 goal
            - { call: "GET /youth-ministry/registrations/${reg2_id}/fundraising-account", as: Treasurer, captures: {acct2_id: "$.data[0].id"} }
            - { call: "POST /youth-ministry/fundraising-accounts/${acct2_id}/donations", payload: {donor_name: "D1", amount_cents: 20000, channel: "CASH"}, as: Treasurer, as_user_id: "treasurer-1" }
