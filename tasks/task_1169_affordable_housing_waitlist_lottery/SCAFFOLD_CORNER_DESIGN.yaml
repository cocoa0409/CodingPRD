              as: HousingDeveloper
              captures: { u1: "$.data.id" }
          trigger:
            - call: "POST /units/${u1}/service"
              payload: { action: "PLACE_OUT_OF_SERVICE" }
              as: HousingDeveloper
              captures: { st1: "$.data.status" }
            - call: "GET /properties/${p}"
              as: HousingDeveloper
              captures: { oos: "$.data.units_out_of_service_count", avail: "$.data.units_available_count" }
            - call: "POST /units/${u1}/service"
