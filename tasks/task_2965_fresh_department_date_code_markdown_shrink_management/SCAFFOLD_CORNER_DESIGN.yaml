  - section: rbac
    instances:
      - name: callers_cannot_act_without_a_valid_role_header_or_outside_their_role
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - rbac[StoreOperationsAdmin.exclusive_operations]
          - rbac[DepartmentManager.exclusive_operations]
          - rbac[ComplianceAuditor.exclusive_operations]
          - rbac[DonationPartner.exclusive_operations]
        distinguishing_aspect: |
          The two auth rules are ordered and distinct: empty X-User-Role and X-User-ID headers are
          ERR_UNAUTHENTICATED (401) before anything else, an unknown role string is
          ERR_UNAUTHORIZED (403), and each of the five declared roles is refused the other roles'
          exclusive writes with the same 403 — the clerk cannot register a store or verify shrink,
          the manager cannot open an audit, the auditor cannot price a lot, the admin cannot
          confirm a pickup and the partner cannot receive a lot.
        test_recipe:
          setup:
            - "Clock 2026-08-10T08:00:00.000Z; donation-enabled store 0412 with dock D1, a MID-ATL partner accepting MEAT, an ACTIVE MEAT ladder, a MEAT department and one 24-unit lot."
            - "One 2-unit DAMAGE shrink event RECORDED by u-clerk-1 and one SCHEDULED pickup."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1"], donation_program_enabled: true }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/food-bank-partners"
              payload: { name: "Mid-Atlantic Food Bank", contact_email: "ops@mafb.example", service_region_code: "MID-ATL", accepted_department_codes: ["MEAT"], cold_chain_certified: true }
              as: StoreOperationsAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "DAMAGE", quantity_units: 2 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { shrink_id: $.data.id }
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D1", scheduled_window_start: "2026-08-13T14:00:00.000Z", scheduled_window_end: "2026-08-13T15:00:00.000Z" }
              as: DepartmentManager
              captures: { pickup_id: $.data.id }
          trigger:
            - call: "GET /fresh/stores/${store_id}"
              payload: {}
              as: ""
              as_user_id: ""
            - call: "GET /fresh/stores/${store_id}"
              payload: {}
              as: "ShelfStocker"
              as_user_id: "u-stocker-1"
            - call: "POST /fresh/stores"
              payload: { store_number: "0499", name: "Fresh Market 0499", region_code: "MID-ATL" }
              as: FreshClerk
              as_user_id: "u-clerk-1"
            - call: "POST /fresh/shrink-events/${shrink_id}/verify"
              payload: {}
              as: FreshClerk
              as_user_id: "u-clerk-2"
            - call: "POST /fresh/compliance-audits"
              payload: { department_id: "${dept_id}", window_start_at: "2026-08-10T00:00:00.000Z", window_end_at: "2026-08-11T00:00:00.000Z" }
              as: DepartmentManager
              as_user_id: "u-mgr-1"
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}", pricing_variant: "LADDER_DAYS" }
