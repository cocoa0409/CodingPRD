            - call: "POST /neighborhood/events"
              payload: { group_id: "${g1_id}", neighborhood_id: "${n1_id}", title: "E1", venue_lat: 37.75, venue_lng: -122.42, starts_at: "2026-06-10T12:00:00Z", ends_at: "2026-06-10T14:00:00Z", capacity: 10 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { e1_id: "$.data.id" }
            - call: "POST /neighborhood/events"
              payload: { group_id: "${g1_id}", neighborhood_id: "${n1_id}", title: "E2", venue_lat: 37.75, venue_lng: -122.42, starts_at: "2026-06-10T12:00:00Z", ends_at: "2026-06-10T14:00:00Z", capacity: 10 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { e2_id: "$.data.id" }
