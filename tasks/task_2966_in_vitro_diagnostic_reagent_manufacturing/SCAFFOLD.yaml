errors:

  # --- protocol ------------------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "X-User-Role is unknown or not listed in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body, missing required field, undeclared enum member, violated numeric bound, or pagination outside limit 1..100 / offset >= 0" }
  - { id: ERR_SUBJECT_FIELD_MISMATCH, http: 400, condition: "POST /test-results carries subject fields that do not match its subject_type, e.g. a REAGENT_LOT record without reference_measured_value or a MATERIAL_LOT record carrying month_index" }

  # --- existence -----------------------------------------------------------
  - { id: ERR_MATERIAL_SPECIFICATION_NOT_FOUND, http: 404, condition: "material_specification_id in the path or body matches no MaterialSpecification" }
  - { id: ERR_MATERIAL_LOT_NOT_FOUND, http: 404, condition: "material_lot_id or changed_material_lot_id matches no MaterialLot" }
  - { id: ERR_PRODUCT_SPECIFICATION_NOT_FOUND, http: 404, condition: "product_specification_id matches no ProductSpecification" }
  - { id: ERR_DESIGN_CONTROL_RECORD_NOT_FOUND, http: 404, condition: "the path id or traces_to_record_id matches no DesignControlRecord" }
  - { id: ERR_REAGENT_LOT_NOT_FOUND, http: 404, condition: "reagent_lot_id, predicate_lot_id or candidate_lot_id matches no ReagentLot" }
  - { id: ERR_FILL_RUN_NOT_FOUND, http: 404, condition: "the fill-run path id matches no FillRun" }
  - { id: ERR_TEST_RESULT_NOT_FOUND, http: 404, condition: "the test-result path id matches no TestResult" }
  - { id: ERR_STABILITY_STUDY_NOT_FOUND, http: 404, condition: "stability_study_id matches no StabilityStudy" }
  - { id: ERR_BRIDGING_STUDY_NOT_FOUND, http: 404, condition: "the bridging-study path id matches no BridgingStudy" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "the complaint path id matches no Complaint" }
  - { id: ERR_DISTRIBUTION_ORDER_NOT_FOUND, http: 404, condition: "the distribution-order path id matches no DistributionOrder" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "the allocation path id matches no Allocation" }

  # --- segregation of duties ----------------------------------------------
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the acting X-User-ID already performed the incompatible step: a release test on the lot being dispositioned, the release of the lot whose field action is being decided, or the authoring of the design record being approved" }

  # --- state ---------------------------------------------------------------
  - { id: ERR_MATERIAL_LOT_STATE_INVALID, http: 409, condition: "MaterialLot.qualification_status admits no such transition, e.g. QUALIFY on a RECEIVED lot or any disposition on a REJECTED or QUARANTINED lot" }
  - { id: ERR_PRODUCT_STATE_INVALID, http: 409, condition: "ProductSpecification.clearance_status admits no such transition, e.g. clearance on an already CLEARED or WITHDRAWN product" }
  - { id: ERR_DESIGN_RECORD_STATE_INVALID, http: 409, condition: "the DesignControlRecord is not DRAFT, or its predecessor is not APPROVED" }
  - { id: ERR_REAGENT_LOT_STATE_INVALID, http: 409, condition: "the relevant ReagentLot dimension admits no such transition, e.g. RELEASE on a FILLED lot, a component add on an IN_PROCESS lot, or AVAILABLE on a lot whose disposition_status is not RELEASED" }
  - { id: ERR_FILL_RUN_STATE_INVALID, http: 409, condition: "FillRun.status admits no such transition, e.g. complete on a SCHEDULED run, start on a RUNNING run, or a sample on a COMPLETED run" }
  - { id: ERR_STABILITY_STUDY_STATE_INVALID, http: 409, condition: "StabilityStudy.status admits no such transition, e.g. a timepoint on a PROTOCOL_DRAFT study or conclude on an APPROVED study with no timepoints" }
  - { id: ERR_BRIDGING_STUDY_STATE_INVALID, http: 409, condition: "the BridgingStudy is not DRAFT, so it can no longer be decided" }
  - { id: ERR_COMPLAINT_STATE_INVALID, http: 409, condition: "Complaint.status admits no such transition, e.g. triage on a TRIAGED complaint, a malfunction report on a RECEIVED complaint, or close on a RECEIVED complaint" }
  - { id: ERR_ORDER_STATE_INVALID, http: 409, condition: "DistributionOrder.status admits no such transition, e.g. allocate on an already ALLOCATED or CANCELLED order" }
  - { id: ERR_ALLOCATION_STATE_INVALID, http: 409, condition: "Allocation.status admits no such transition, e.g. ship on a CANCELLED row, cancel on a SHIPPED row, or a cold-chain event on a RESERVED row" }

  # --- optimistic concurrency ---------------------------------------------
  - { id: ERR_STALE_REAGENT_LOT_VERSION, http: 412, condition: "expected_reagent_lot_version does not equal the ReagentLot's current version" }
  - { id: ERR_STALE_PRODUCT_SPEC_VERSION, http: 412, condition: "expected_product_specification_version does not equal the ProductSpecification's current version" }

  # --- uniqueness ----------------------------------------------------------
  - { id: ERR_DUPLICATE_MATERIAL_CODE, http: 409, condition: "material_code already registered" }
  - { id: ERR_DUPLICATE_PRODUCT_CODE, http: 409, condition: "product_code already registered" }
  - { id: ERR_DUPLICATE_VENDOR_LOT, http: 409, condition: "vendor_lot_code already booked in against the same material_specification_id" }
  - { id: ERR_DUPLICATE_LOT_CODE, http: 409, condition: "lot_code already used for the same product_specification_id" }
  - { id: ERR_DUPLICATE_TIMEPOINT, http: 409, condition: "a TestResult with the same stability_study_id, month_index and test_code already exists" }

  # --- safety / compliance -------------------------------------------------
  - { id: ERR_MATERIAL_NOT_QUALIFIED, http: 409, condition: "the raw material lot being dispensed is not QUALIFIED" }
  - { id: ERR_MATERIAL_EXPIRED, http: 409, condition: "the raw material lot's expiry_date is at or before the logical clock at dispensing" }
  - { id: ERR_INSUFFICIENT_MATERIAL, http: 409, condition: "quantity_used exceeds the raw lot's available_quantity_units" }
  - { id: ERR_ENVIRONMENTAL_NONCONFORMANCE, http: 409, condition: "release attempted while a FillRun of the lot has environmental_state DISQUALIFIED" }
  - { id: ERR_RELEASE_TESTS_INCOMPLETE, http: 409, condition: "a code in release_test_codes has no PASS TestResult on the lot" }
  - { id: ERR_REFERENCE_BIAS_EXCEEDED, http: 409, condition: "release_bias_max_pct exceeds the product's max_reference_bias_pct" }
  - { id: ERR_BOM_INCOMPLETE, http: 409, condition: "a code in required_material_codes has no CONSUMED LotComponent on the lot" }
  - { id: ERR_BRIDGING_REQUIRED, http: 409, condition: "bridging_required is true but no APPROVED BridgingStudy names this lot as candidate" }
  - { id: ERR_STABILITY_DATA_MISSING, http: 409, condition: "the requested shelf_life_basis has no COMPLETE StabilityStudy with an established shelf life on this product" }
  - { id: ERR_ACCEPTANCE_CRITERIA_NOT_MET, http: 409, condition: "the acceptance decision under the specification's acceptance_mode is REJECT_CRITERIA_NOT_MET, or a required test code has no result yet" }
  - { id: ERR_DESIGN_TRACE_INCOMPLETE, http: 409, condition: "clearance attempted while design_trace_complete is false" }
  - { id: ERR_MALFUNCTION_REPORT_PENDING, http: 409, condition: "close attempted on a reportable complaint whose reported_at is still null" }
  - { id: ERR_FIELD_ACTION_NOT_JUSTIFIED, http: 409, condition: "field_action REMOVAL requested on a complaint whose severity is not HIGH" }

  # --- temporal / resource overlap -----------------------------------------
  - { id: ERR_FILL_LINE_CONFLICT, http: 409, condition: "the requested run overlaps another SCHEDULED or RUNNING run on the same line once the 120-minute changeover buffer is applied to both ends" }
  - { id: ERR_CHAMBER_CAPACITY_EXCEEDED, http: 409, condition: "a third live study would occupy the same chamber over an instant of the requested half-open interval" }
  - { id: ERR_RETEST_WINDOW_EXPIRED, http: 409, condition: "the retest is recorded after first_oos_at plus retest_window_days" }
  - { id: ERR_MAX_RETESTS_EXCEEDED, http: 409, condition: "retest_count has already reached the specification's max_retests" }
  - { id: ERR_SHIP_BY_PASSED, http: 409, condition: "the order's ship_by is earlier than the logical clock at allocation" }
  - { id: ERR_SHELF_LIFE_TOO_SHORT, http: 409, condition: "at shipping the drawn lot's remaining shelf life is below the product's min_shelf_life_days_at_ship" }

  # --- structural constraints ----------------------------------------------
  - { id: ERR_INVALID_TRACE_LINK, http: 422, condition: "traces_to_record_id is null for a non-input record or set for a DESIGN_INPUT, links to the wrong predecessor type, or links across product specifications" }
  - { id: ERR_TEST_CODE_NOT_IN_SPEC, http: 422, condition: "test_code is not in the governing specification's required_test_codes or release_test_codes" }
  - { id: ERR_TIMEPOINT_NOT_PLANNED, http: 422, condition: "month_index is not a member of the study's planned_timepoints_months" }
  - { id: ERR_COMPONENT_ROLE_NOT_IN_BOM, http: 422, condition: "component_role does not match the dispensed material's material_type, or that material_code is not in the product's required_material_codes" }
  - { id: ERR_PAIRED_DATA_MISSING, http: 422, condition: "a code in paired_test_codes lacks a REAGENT_LOT TestResult on the predicate or the candidate lot, leaving equivalence_verdict PENDING" }
  - { id: ERR_NOT_EQUIVALENT, http: 409, condition: "bridging approval attempted while equivalence_verdict is NOT_EQUIVALENT" }

  # --- referential and fiscal gates ---------------------------------------
  - { id: ERR_PRODUCT_NOT_CLEARED, http: 409, condition: "release or allocation attempted on a product whose clearance_status is not CLEARED" }
  - { id: ERR_ALLOCATION_SHORTFALL, http: 409, condition: "under FEFO_STRICT the eligible pool cannot cover requested_units; nothing is persisted" }

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix (6 roles, all opaque: X-User-ID is an operator identifier and
# is never required to equal any entity's id. The segregation-of-duties model
# compares X-User-ID across steps rather than to a resource owner.)
# -----------------------------------------------------------------------------
roles:

  - name: QCAnalyst
    description: "Quality-control laboratory analyst: records every analytical measurement and every environmental or bioburden sample, and never decides a disposition"
    identity: "opaque"
    exclusive_operations:
      - "POST /test-results (all three subject types)"
      - "POST /fill-runs/{id}/samples"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint in §1.5"

  - name: ProductionOperator
    description: "Manufacturing operator: books raw material in, opens finished lots, dispenses the bill of materials and runs the filling lines"
    identity: "opaque"
    exclusive_operations:
      - "POST /reagent-lots"
      - "POST /reagent-lots/{id}/components"
      - "POST /fill-runs"
      - "POST /fill-runs/{id}/start"
      - "POST /fill-runs/{id}/complete"
      - "POST /fill-runs/{id}/abort"
    shared_operations:
      - "POST /material-lots (with PlatformAdmin)"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint in §1.5"

  - name: QAReleaser
    description: "Quality-assurance releaser: the only role that dispositions lots, approves design records and stability protocols, decides bridges and field actions; bound by segregation of duties against its own earlier analytical and release work"
    identity: "opaque"
    exclusive_operations:
      - "POST /material-lots/{id}/disposition"
      - "POST /reagent-lots/{id}/disposition"
      - "POST /reagent-lots/{id}/distribution-status"
      - "POST /design-control-records/{id}/approve"
      - "POST /stability-studies/{id}/approve-protocol"
      - "POST /bridging-studies/{id}/decision"
      - "POST /complaints/{id}/field-action"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint in §1.5"

  - name: RegulatoryAffairs
    description: "Regulatory affairs: owns the design history file, the clearance submission, the stability and bridging programmes and the complaint reporting file"
    identity: "opaque"
    exclusive_operations:
      - "POST /design-control-records"
      - "POST /product-specifications/{id}/clearance"
      - "POST /stability-studies"
      - "POST /stability-studies/{id}/conclude"
      - "POST /bridging-studies"
      - "POST /complaints/{id}/triage"
      - "POST /complaints/{id}/malfunction-report"
      - "POST /complaints/{id}/close"
    shared_operations:
      - "POST /material-specifications (with PlatformAdmin)"
      - "POST /product-specifications (with PlatformAdmin)"
      - "POST /complaints (with DistributionPlanner)"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint in §1.5"

  - name: DistributionPlanner
    description: "Distribution planner: books customer orders, runs the FEFO allocation, ships and cancels reservations and records cold-chain events"
    identity: "opaque"
    exclusive_operations:
      - "POST /distribution-orders"
      - "POST /distribution-orders/{id}/allocate"
      - "POST /allocations/{id}/ship"
      - "POST /allocations/{id}/cancel"
      - "POST /allocations/{id}/cold-chain-event"
    shared_operations:
      - "POST /complaints (with RegulatoryAffairs)"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint in §1.5"

  - name: PlatformAdmin
    description: "Platform administrator: maintains reference data and books raw material in, but holds no quality, regulatory or distribution authority — it cannot disposition, release, allocate or decide anything"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /material-specifications (with RegulatoryAffairs)"
      - "POST /product-specifications (with RegulatoryAffairs)"
      - "POST /material-lots (with ProductionOperator)"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint in §1.5"
