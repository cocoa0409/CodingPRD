# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3107_destination_medicine_referral_intake_multi_specialty_visit
#
# Breadth probe: every claim §1.1–§1.7 declares that §1.8 does not already
# exercise. Corners §1.8 covers appear as `excluded_because:` stubs.
# Anchors below re-declare the shared happy-path chain locally (YAML anchors
# do not cross file boundaries).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: specialty_service_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.SpecialtyService
          - endpoints.POST_/specialty-services
        distinguishing_aspect: "A service created without the two optional booleans comes back 201 with supports_imaging == false and supports_remote_products == true (declared defaults), version 1, and system-minted id/created_at/updated_at."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_svc_card
              call: "POST /specialty-services"
              payload: { code: "CARD", name: "Cardiology", destination_daily_capacity: 2, service_window_start_min: 480, service_window_end_min: 1020 }
              as: PlatformAdmin
              captures: { k_svc_card_id: $.data.id }
          assert:
            - "HTTP 201, response_type object"
            - "SpecialtyService.supports_imaging == false and supports_remote_products == true"
            - "SpecialtyService.version == 1 and id/created_at/updated_at are non-null"

      - name: referral_create_cascade_creates_patient_with_computed_flags
        claim_type: Computed Fields
        grounds:
          - entities.Patient.fields.is_international
          - entities.Patient.fields.requires_interpreter
          - endpoints.POST_/referrals
        distinguishing_aspect: "The cascade-created Patient derives is_international (residence_country != US) and requires_interpreter (preferred_language != en) — client cannot supply them; a German patient with preferred_language de yields is_international true and requires_interpreter true."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
          trigger:
            - &k_ref_intl
              call: "POST /referrals"
              payload: { patient: { full_name: "Ingrid International", date_of_birth: "1962-11-20", residence_country: "DE", residence_state: null, preferred_language: "de" }, referring_physician_name: "Dr. Vogel", referring_physician_contact: "vogel@example.de", reason: "oncology consult" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_ref_intl_id: $.data.id }
            - call: "GET /referrals/${k_ref_intl_id}/patient"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_pat_intl_id: "$.data[0].id" }
          assert:
            - "the patient list has exactly 1 element"
            - "Patient.is_international == true and requires_interpreter == true"
            - "Referral.status == SUBMITTED"

      - name: referral_create_missing_patient_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Referral.fields.patient
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "patient is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST, not a 422 and not a server crash."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /referrals"
              payload: { referring_physician_name: "Dr. Riley", referring_physician_contact: "riley@example.org", reason: "syncope" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: get_visit_case_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/visit-cases/{caseId}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the case path returns 404 ERR_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /visit-cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404, error_id == ERR_NOT_FOUND, response_type == error"

      - name: referrals_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/referrals
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three referrals, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; no params defaults to limit 10 offset 0."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Three referrals created."]
          setup_api_calls:
            - *k_clock
            - call: "POST /referrals"
              payload: { patient: { full_name: "A One", date_of_birth: "1970-01-01", residence_country: "US", residence_state: "WI", preferred_language: "en" }, referring_physician_name: "Dr. A", referring_physician_contact: "a@x.org", reason: "r1" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /referrals"
              payload: { patient: { full_name: "B Two", date_of_birth: "1971-01-01", residence_country: "US", residence_state: "WI", preferred_language: "en" }, referring_physician_name: "Dr. B", referring_physician_contact: "b@x.org", reason: "r2" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /referrals"
              payload: { patient: { full_name: "C Three", date_of_birth: "1972-01-01", residence_country: "US", residence_state: "WI", preferred_language: "en" }, referring_physician_name: "Dr. C", referring_physician_contact: "c@x.org", reason: "r3" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          trigger:
            - call: "GET /referrals"
              payload: { limit: 2, offset: 0 }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          assert:
            - "HTTP 200, response_type array, 2 rows, total_count == 3, has_more == true"
            - "GET /referrals?limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"

      - name: patient_read_only_surface_no_update_endpoints
        claim_type: Immutability
        grounds:
          - entities.Patient
        distinguishing_aspect: "Patient exposes only GET routes in §1.5 (no POST/PUT/PATCH/DELETE on /patients) and every field is source system/computed, copied from the creating referral — identity data cannot be mutated through the API, and no §1.9 setup chain may rely on mutating a Patient directly."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One referral with its cascade patient."]
          setup_api_calls:
            - *k_clock
            - *k_ref_intl
            - call: "GET /referrals/${k_ref_intl_id}/patient"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_pat_id2: "$.data[0].id" }
          trigger:
            - call: "GET /patients/${k_pat_id2}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          assert:
            - "GET /patients/${k_pat_id2} returns HTTP 200 with full_name copied from the referral payload"
            - "no PUT, PATCH, or DELETE route exists for /patients/{id} anywhere in §1.5 (auditable against the endpoint table)"

      - name: itinerary_get_returns_computed_totals_and_revision
        claim_type: Retrieval
        grounds:
          - entities.Itinerary
          - endpoints.GET_/itineraries/{itineraryId}
        distinguishing_aspect: "GET on an itinerary returns the computed provisional_total_cents/final_total_cents and the revision counter exactly as last recomputed."
        test_recipe:
          setup: ["DESTINATION case approved (itinerary exists, no visits)."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - &k_svc_neur
              call: "POST /specialty-services"
              payload: { code: "NEUR", name: "Neurology", destination_daily_capacity: 2, service_window_start_min: 480, service_window_end_min: 1020, supports_imaging: false, supports_remote_products: true }
              as: PlatformAdmin
              captures: { k_svc_neur_id: $.data.id }
            - &k_ref_dom
              call: "POST /referrals"
              payload: { patient: { full_name: "Dana Domestic", date_of_birth: "1970-05-01", residence_country: "US", residence_state: "WI", preferred_language: "en" }, referring_physician_name: "Dr. Riley", referring_physician_contact: "riley@example.org", reason: "syncope workup" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_ref_dom_id: $.data.id }
            - &k_rec1
              call: "POST /referrals/${k_ref_dom_id}/medical-records"
              payload: { record_type: "CLINICAL_NOTES", source_facility: "La Crosse General" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_rec1_id: $.data.id }
            - &k_rec1_verify
              call: "POST /referrals/${k_ref_dom_id}/medical-records/${k_rec1_id}/verify"
              payload: {}
              as: CaseReviewer
              as_user_id: "cr-boris"
            - &k_ref_submit
              call: "POST /referrals/${k_ref_dom_id}/submit-review"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - &k_case_create
              call: "POST /visit-cases"
              payload: { referral_id: "${k_ref_dom_id}", case_type: "DESTINATION", care_team_specialty_ids: ["${k_svc_card_id}", "${k_svc_neur_id}"] }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_case_id: $.data.id }
            - &k_case_approve
              call: "POST /visit-cases/${k_case_id}/reviews"
              payload: { outcome: "APPROVE", notes: "ok" }
              as: CaseReviewer
              as_user_id: "cr-boris"
            - call: "GET /visit-cases/${k_case_id}/itinerary"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_itin_id: "$.data[0].id" }
          trigger:
            - call: "GET /itineraries/${k_itin_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          assert:
            - "HTTP 200; Itinerary.status == DRAFT, revision == 1, provisional_total_cents == 0, final_total_cents == 0 (no visits)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: referral_initial_state_is_submitted
        claim_type: Initial State
        grounds: [state_machines.Referral]
        distinguishing_aspect: "A newly created referral reads back with status SUBMITTED before any record receipt."
        test_recipe:
          setup: ["Logical clock 2026-09-01."]
          setup_api_calls:
            - *k_clock
            - *k_ref_dom
          trigger:
            - call: "GET /referrals/${k_ref_dom_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          assert:
            - "Referral.status == SUBMITTED"

      - name: submit_review_without_verified_record_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Referral.RECORDS_PENDING_to_IN_REVIEW, errors.ERR_NO_VERIFIED_RECORDS]
        distinguishing_aspect: "submit-review with only a RECEIVED (never verified) record fails with ERR_NO_VERIFIED_RECORDS; the referral stays RECORDS_PENDING."
        test_recipe:
          setup: ["Referral with one RECEIVED record."]
          setup_api_calls:
            - *k_clock
            - *k_ref_dom
            - *k_rec1
          trigger:
            - call: "POST /referrals/${k_ref_dom_id}/submit-review"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_NO_VERIFIED_RECORDS"
            - "Referral.status remains RECORDS_PENDING"

      - name: verify_on_terminal_record_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.MedicalRecord, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "Re-verifying a VERIFIED record (terminal) returns ERR_INVALID_STATE; no additional fatigue accrues."
        test_recipe:
          setup: ["Referral with one VERIFIED record."]
          setup_api_calls:
            - *k_clock
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
          trigger:
            - call: "POST /referrals/${k_ref_dom_id}/medical-records/${k_rec1_id}/verify"
              payload: {}
              as: CaseReviewer
              as_user_id: "cr-boris"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"

      - name: withdraw_after_scheduled_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.VisitCase, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "Withdraw is legal only from INTAKE/AWAITING_FINANCIAL/FINANCIAL_CLEARED/SCHEDULING; a SCHEDULED case rejects withdraw with ERR_INVALID_STATE."
        test_recipe:
          setup: ["DESTINATION case fully scheduled (itinerary CONFIRMED, case SCHEDULED) via the standard 2-visit chain."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - &k_slot1
              call: "POST /specialty-services/${k_svc_card_id}/slots"
              payload: { slot_date: "2026-09-10", start_min: 540, end_min: 600 }
              as: PlatformAdmin
              captures: { k_slot1: $.data.id }
            - &k_slot2
              call: "POST /specialty-services/${k_svc_card_id}/slots"
              payload: { slot_date: "2026-09-10", start_min: 600, end_min: 660 }
              as: PlatformAdmin
              captures: { k_slot2: $.data.id }
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
            - *k_case_approve
            - &k_deposit
              call: "POST /visit-cases/${k_case_id}/billing-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 60000 }
              as: FinancialCounselor
              as_user_id: "fc-cora"
            - &k_case_v1
              call: "GET /visit-cases/${k_case_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_cv1: $.data.version }
            - &k_hold1
              call: "POST /visit-cases/${k_case_id}/slot-holds"
              payload: { appointment_slot_id: "${k_slot1}", visit_type: "CONSULT", listed_price_cents: 200000, sequencing_priority: 1, expected_case_version: "${k_cv1}" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_visit1: $.data.id, k_itin2: $.data.itinerary_id }
            - &k_case_v2
              call: "GET /visit-cases/${k_case_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_cv2: $.data.version }
            - &k_hold2
              call: "POST /visit-cases/${k_case_id}/slot-holds"
              payload: { appointment_slot_id: "${k_slot2}", visit_type: "IMAGING", listed_price_cents: 200000, sequencing_priority: 2, expected_case_version: "${k_cv2}" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /slots/${k_slot1}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /slots/${k_slot2}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /itineraries/${k_itin2}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          trigger:
            - call: "POST /visit-cases/${k_case_id}/withdraw"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"
            - "VisitCase.status remains SCHEDULED"

      - name: withdrawal_cascades_to_slots_visits_logistics
        claim_type: Cascade down
        grounds: [state_machines.VisitCase.INTAKE_to_WITHDRAWN, state_machines.LogisticsArrangement]
        distinguishing_aspect: "Manual withdrawal from SCHEDULING releases the HELD slot, cancels the PENDING visit, cancels the DRAFT itinerary, and cancels a REQUESTED logistics arrangement — all in one cascade."
        test_recipe:
          setup: ["Case FINANCIAL_CLEARED->SCHEDULING with one held slot; one REQUESTED TRAVEL arrangement."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_slot1
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
            - *k_case_approve
            - *k_deposit
            - *k_case_v1
            - *k_hold1
            - &k_log
              call: "POST /visit-cases/${k_case_id}/logistics"
              payload: { arrangement_type: "TRAVEL", details: "MSP flight", companion_count: 1 }
              as: LogisticsCoordinator
              as_user_id: "lc-erin"
              captures: { k_log_id: $.data.id }
          trigger:
            - call: "POST /visit-cases/${k_case_id}/withdraw"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          assert:
            - "VisitCase.status == WITHDRAWN"
            - "AppointmentSlot.${k_slot1}.status == RELEASED"
            - "Visit.${k_visit1}.status == CANCELLED"
            - "Itinerary.${k_itin2}.status == CANCELLED"
            - "LogisticsArrangement.${k_log_id}.status == CANCELLED"

      - name: case_auto_completes_and_referral_closes_after_communications
        claim_type: Bubble up
        grounds: [state_machines.VisitCase, state_machines.Referral.REVIEWED_to_CLOSED, errors.ERR_RESULTS_NOT_TRANSMITTED]
        distinguishing_aspect: "When the final visit completes, VisitCase auto-transitions to COMPLETED; the Referral closes only after both RESULTS_TO_REFERRER and CONTINUITY_PLAN communications exist — closure before the communications is impossible to observe because Referral.status stays REVIEWED until both land."
        test_recipe:
          setup: ["SCHEDULED 2-visit case; travel authorized; both visits completed in sequencing order on their slot date."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_slot1
            - *k_slot2
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
            - *k_case_approve
            - *k_deposit
            - *k_case_v1
            - *k_hold1
            - *k_case_v2
            - *k_hold2
            - call: "POST /slots/${k_slot1}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /slots/${k_slot2}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /itineraries/${k_itin2}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /visit-cases/${k_case_id}/estimate-letters"
              payload: {}
              as: FinancialCounselor
              as_user_id: "fc-cora"
            - call: "POST /visit-cases/${k_case_id}/authorize-travel"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T12:00:00Z" }
              as: PlatformAdmin
            - &k_visit2_get
              call: "GET /itineraries/${k_itin2}/visits"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { k_v1_id: "$.data[0].id", k_v2_id: "$.data[1].id" }
            - call: "POST /visits/${k_v1_id}/complete"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          trigger:
            - call: "POST /visits/${k_v2_id}/complete"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "GET /visit-cases/${k_case_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "GET /referrals/${k_ref_dom_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { ref_status_mid: $.data.status }
            - call: "POST /visit-cases/${k_case_id}/communications"
              payload: { comm_type: "RESULTS_TO_REFERRER", body: "findings attached" }
              as: CaseReviewer
              as_user_id: "cr-boris"
            - call: "POST /visit-cases/${k_case_id}/communications"
              payload: { comm_type: "CONTINUITY_PLAN", body: "plan", continuity_plan: { owner: "LOCAL_PHYSICIAN", follow_up_weeks: 4 } }
              as: CaseReviewer
              as_user_id: "cr-boris"
            - call: "GET /referrals/${k_ref_dom_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          assert:
            - "VisitCase.status == COMPLETED after the second completion"
            - "Referral.status == REVIEWED immediately after case completion (communications not yet sent)"
            - "Referral.status == CLOSED after both communications are created"

      - name: complete_out_of_sequencing_order_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Visit.CONFIRMED_to_COMPLETED, errors.ERR_SEQUENCING_VIOLATION]
        distinguishing_aspect: "Completing the priority-2 visit while the priority-1 same-day visit is still CONFIRMED fails with ERR_SEQUENCING_VIOLATION; completing in order succeeds."
        test_recipe:
          setup: ["SCHEDULED case with two same-day CONFIRMED visits (priorities 1 and 2); clock on the slot date; travel authorized."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_slot1
            - *k_slot2
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
            - *k_case_approve
            - *k_deposit
            - *k_case_v1
            - *k_hold1
            - *k_case_v2
            - *k_hold2
            - call: "POST /slots/${k_slot1}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /slots/${k_slot2}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /itineraries/${k_itin2}/confirm"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T12:00:00Z" }
              as: PlatformAdmin
            - *k_visit2_get
          trigger:
            - call: "POST /visits/${k_v2_id}/complete"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_SEQUENCING_VIOLATION"
            - "Visit.${k_v2_id}.status remains CONFIRMED"

      - name: complete_before_slot_date_rejected
        claim_type: Temporal validation
