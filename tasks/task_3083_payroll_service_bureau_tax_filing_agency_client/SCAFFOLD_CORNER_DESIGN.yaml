            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - *ck_submit
            - call: "POST /clients/${ck_cl}/credit-hold"
              payload: { hold: true }
              as: BureauCompliance
            - *ck_clv
          trigger:
            - call: "POST /payroll-runs/${ck_run}/initiate-impound"
              payload: { expected_client_version: "${ck_clv}" }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { err_hold: $.data.error_id }
          assert:
            - "the response status is 409 and err_hold == ERR_CREDIT_HOLD_ACTIVE"
            - "err_hold != ERR_CLIENT_NOT_ACTIVE (client IS active; the hold is the blocker)"
            - "GET /impounds?payroll_run_id=${ck_run} returns 0 rows"

  # ===========================================================================
  - section: rbac
    instances:

      - name: r_onboarder_cannot_create_jurisdiction
        claim_type: exclusive_denied
        grounds: [roles.BureauOnboarder, endpoints.POST_/jurisdictions, errors.ERR_FORBIDDEN]
        distinguishing_aspect: "Jurisdiction creation is BureauCompliance-exclusive; BureauOnboarder gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Clock at default. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "XX-1", name: "Nope", deposit_frequency: "MONTHLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 100000 }
              as: BureauOnboarder
              captures: { err_r1: $.data.error_id }
          assert:
            - "the response status is 403 and err_r1 == ERR_FORBIDDEN"

      - name: r_treasury_cannot_file_return
        claim_type: exclusive_denied
        grounds: [roles.BureauTreasury, "endpoints.POST_/returns/{returnId}/file", errors.ERR_FORBIDDEN]
        distinguishing_aspect: "Filing is BureauTaxFiler-exclusive; BureauTreasury gets 403 on /returns/{id}/file even for a valid DRAFT return."
        test_recipe:
          setup: ["Clock at 2026-10-05 (period closed). Client ACTIVE; DRAFT return exists."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_clv
            - call: "POST /returns"
              payload: { client_id: "${ck_cl}", jurisdiction_id: "${cj_fed}", period: "2026-Q3", expected_client_version: "${ck_clv}" }
              as: BureauTaxFiler
              captures: { rb_ret: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: BureauCompliance
          trigger:
            - call: "POST /returns/${rb_ret}/file"
              payload: {}
              as: BureauTreasury
              captures: { err_r2: $.data.error_id }
          assert:
            - "the response status is 403 and err_r2 == ERR_FORBIDDEN"
            - "TaxReturn.${rb_ret}.status == DRAFT (unchanged)"

      - name: r_client_admin_cannot_settle_impound
        claim_type: exclusive_denied
        grounds: [roles.ClientPayrollAdmin, "endpoints.POST_/impounds/{impoundId}/settle", errors.ERR_FORBIDDEN]
        distinguishing_aspect: "Settlement is treasury-only; the client admin who owns the run gets 403 ERR_FORBIDDEN on settle."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE; run IMPOUNDED."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - *ck_submit
            - *ck_clv
            - *ck_impound
          trigger:
            - call: "POST /impounds/${ck_imp}/settle"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { err_r3: $.data.error_id }
          assert:
            - "the response status is 403 and err_r3 == ERR_FORBIDDEN"
            - "Impound.${ck_imp}.status == PENDING (unchanged)"

      - name: r_filer_who_filed_cannot_accept_same_return
        claim_type: sod_step_block
        grounds: ["validations[priority=7]", errors.ERR_SOD_VIOLATION, complexity_profile.role_model]
        distinguishing_aspect: "Segregation of duties: filer-alpha filed the return; filer-alpha's accept attempt is 403 ERR_SOD_VIOLATION while filer-beta's accept succeeds — same role, different X-User-ID."
        test_recipe:
          setup: ["Clock at 2026-10-05. Client ACTIVE; return FILED by filer-alpha."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_clv
            - call: "POST /returns"
              payload: { client_id: "${ck_cl}", jurisdiction_id: "${cj_fed}", period: "2026-Q3", expected_client_version: "${ck_clv}" }
              as: BureauTaxFiler
              captures: { sod_ret: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: BureauCompliance
            - call: "POST /returns/${sod_ret}/file"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-alpha"
          trigger:
            - call: "POST /returns/${sod_ret}/accept"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-alpha"
              captures: { err_sod: $.data.error_id }
            - call: "POST /returns/${sod_ret}/accept"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-beta"
              captures: { sod_status: $.data.status }
          assert:
            - "filer-alpha's accept returns 403 and err_sod == ERR_SOD_VIOLATION"
            - "filer-beta's accept succeeds and sod_status == ACCEPTED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: l_occ_stale_client_version_on_deposit_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[deposit-create-stale-run]", errors.ERR_STALE_VERSION, "validations[priority=24]"]
        distinguishing_aspect: "After the first deposit create bumps PayrollRun.version, a second create carrying the pre-bump expected_payroll_run_version is 412 ERR_STALE_VERSION — deterministic with two sequential requests."
        test_recipe:
          setup: ["Clock at default. FED-941 and CA-DE9 jurisdictions. Client ACTIVE with verified registrations for both; run (tax 300000) SETTLED."]
          setup_api_calls:
            - *ck_jfed
            - call: "POST /jurisdictions"
              payload: { code: "CA-DE9", name: "CA EDD DE9", deposit_frequency: "QUARTERLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
              as: BureauCompliance
              captures: { occ_jca: $.data.id }
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - call: "POST /clients/${ck_cl}/registrations"
              payload: { jurisdiction_id: "${occ_jca}", agency_account_number: "EDD-OCC", poa_document_ref: "POA-OCC" }
              as: BureauOnboarder
              captures: { occ_reg: $.data.id }
            - call: "POST /registrations/${occ_reg}/verify"
              payload: {}
              as: BureauOnboarder
            - *ck_verify
            - *ck_activate
            - call: "POST /payroll-runs"
              payload: { client_id: "${ck_cl}", pay_date: "2026-09-04T00:00:00Z", period_start: "2026-08-22T00:00:00Z", period_end: "2026-09-04T00:00:00Z", gross_pay_cents: 1500000, total_tax_cents: 300000 }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { occ_run: $.data.id }
            - call: "POST /payroll-runs/${occ_run}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
            - call: "GET /clients/${ck_cl}"
              payload: {}
              as: BureauCompliance
              captures: { occ_clv: $.data.version }
            - call: "POST /payroll-runs/${occ_run}/initiate-impound"
              payload: { expected_client_version: "${occ_clv}" }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { occ_imp: $.data.id }
            - call: "POST /impounds/${occ_imp}/settle"
              payload: {}
              as: BureauTreasury
            - call: "GET /payroll-runs/${occ_run}"
              payload: {}
              as: BureauTaxFiler
              captures: { occ_runv: $.data.version }
            - call: "POST /payroll-runs/${occ_run}/deposits"
              payload: { jurisdiction_id: "${cj_fed}", amount_cents: 150000, expected_payroll_run_version: "${occ_runv}" }
              as: BureauTaxFiler
              captures: { occ_dep1: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${occ_run}/deposits"
              payload: { jurisdiction_id: "${occ_jca}", amount_cents: 150000, expected_payroll_run_version: "${occ_runv}" }
              as: BureauTaxFiler
              captures: { err_occ: $.data.error_id }
          assert:
