            - { call: "GET /om/priority-customers/${pc}", payload: {}, as: Dispatcher, captures: { pc_st: $.data.certification_status } }
            - { call: "GET /om/feeders/${fd_id}", payload: {}, as: Dispatcher, captures: { cnt: $.data.certified_priority_count } }
            - { call: "GET /om/outages/${ot}", payload: {}, as: Dispatcher, captures: { hp: $.data.has_priority_customers } }
          assert:
