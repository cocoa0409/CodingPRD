      - 'the owning liaison''s list: HTTP 200 with total_count == 1 and data[0].id == ${tr_id}'
      - 'the owning liaison''s item read: HTTP 200 with receiving_institution_id == ${inst_id}'
      - 'the foreign liaison''s DECLINE: HTTP 403 and data.error_id == ERR_INSTITUTION_SCOPE_VIOLATION; the request stays SUBMITTED'
