            - call: "POST /seasons"
              payload: { facility_id: "${f2}", season_name: "S2", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
