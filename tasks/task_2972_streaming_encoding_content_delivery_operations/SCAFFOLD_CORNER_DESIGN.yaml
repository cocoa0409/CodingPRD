            - "RoutingPolicy.${p_id}.state == STANDBY_ONLY and primary_vendor_id == ${v_id} and backup_vendor_id == null"
            - "RoutingPolicy.${p_id}.selection_reason_code == PERFORMANCE_RANK and resteer_count == 0"

      - name: metric_ingest_for_an_unserved_region_is_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_VENDOR_REGION_NOT_SERVED]
          - endpoints.POST_/playback-metrics
