scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_survivor_creation_returns_201_with_all_declared_fields
        claim_type: creation
        grounds: ["entities.Survivor", "endpoints[POST /survivors]"]
        distinguishing_aspect: "A single POST with every declared input present must return 201 and echo all input fields plus the computed priority_score and open_case_count and the four common fields. An implementation that returns a bare id, or that omits open_case_count until a case exists, fails."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
          trigger:
            - call: POST /survivors
              payload: { household_name: "Abbott Household", primary_contact_phone: "555-0201", household_size: 4, income_band: "VLI", head_of_household_age: 58, has_member_with_disability: true, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv: "$.data.id" }
          assert:
            - "HTTP 201."
            - "data.household_name == 'Abbott Household', data.household_size == 4, data.income_band == 'VLI', data.head_of_household_age == 58."
            - "data.has_member_with_disability == true, data.is_uninsured == false, data.consent_on_file == true, data.follow_up_opt_in == true."
            - "data.priority_score == 57 (VLI 30 + household 12 + disability 15)."
            - "data.open_case_count == 0."
            - "data.id, data.created_at, data.updated_at are present and data.version == 1."
      - name: corner_survivor_retrieval_returns_stored_row
        claim_type: retrieval
        grounds: ["endpoints[GET /survivors/{id}]"]
        distinguishing_aspect: "GET by id returns the same field values that POST stored, including the computed priority_score, and does not re-derive them differently on read."
        test_recipe:
          setup:
            - "One Survivor created with household_size 1, income_band LOW, age 70, is_uninsured true."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Barlow Household", primary_contact_phone: "555-0202", household_size: 1, income_band: "LOW", head_of_household_age: 70, has_member_with_disability: false, is_uninsured: true, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv2: "$.data.id" }
          trigger:
            - call: GET /survivors/{id}
              payload: {}
              as: CaseManager
              as_user_id: u_cm_1
          assert:
            - "HTTP 200 and data.id == ${sv2}."
            - "data.household_name == 'Barlow Household', data.household_size == 1, data.income_band == 'LOW', data.head_of_household_age == 70, data.is_uninsured == true."
            - "data.priority_score == 45 (LOW 20 + elder 10 + uninsured 15; household term 0)."
            - "data.version == 1."
      - name: corner_recovery_case_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints[GET /recovery-cases]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "Three cases exist for one survivor; a request with limit 2 and offset 0 must return 2 rows with total_count 3 and has_more true, and offset 2 must return 1 row with has_more false. An implementation that reports total_count as the page size, or that ignores offset, fails."
        test_recipe:
          setup:
            - "One Survivor with three RecoveryCases under three distinct disaster_codes."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Castellanos Household", primary_contact_phone: "555-0203", household_size: 3, income_band: "LOW", head_of_household_age: 44, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv3: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${sv3}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
            - call: POST /recovery-cases
              payload: { survivor_id: "${sv3}", disaster_code: "DR-4802", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
            - call: POST /recovery-cases
              payload: { survivor_id: "${sv3}", disaster_code: "DR-4803", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
          trigger:
            - call: GET /recovery-cases
              payload: { survivor_id: "${sv3}", limit: 2, offset: 0 }
              as: CaseManager
              as_user_id: u_cm_1
            - call: GET /recovery-cases
              payload: { survivor_id: "${sv3}", limit: 2, offset: 2 }
              as: CaseManager
              as_user_id: u_cm_1
          assert:
            - "First page: response_type == 'array', 2 rows returned, total_count == 3, limit == 2, offset == 0, has_more == true."
            - "Second page: 1 row returned, total_count == 3, offset == 2, has_more == false."
            - "GET /survivors/${sv3} now reports open_case_count == 3."
      - name: corner_survivor_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SURVIVOR_NOT_FOUND]", "endpoints[GET /survivors/{id}]"]
        distinguishing_aspect: "A well-formed but unknown UUID must produce 404 ERR_SURVIVOR_NOT_FOUND in the error envelope, not 200 with a null body and not 400."
        test_recipe:
          setup:
            - "Empty database; no Survivor rows exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
          trigger:
            - call: GET /survivors/00000000-0000-4000-8000-000000000000
              payload: {}
              as: CaseManager
              as_user_id: u_cm_1
              captures: { e: "$.data.error_id" }
          assert:
            - "HTTP 404."
            - "response_type == 'error' and data.error_id == 'ERR_SURVIVOR_NOT_FOUND'."
            - "data.message is a non-empty string and meta.api_request_id is present."
      - name: corner_survivor_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority 3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "household_name has source input with no default, so omitting it must yield 400 ERR_INVALID_REQUEST before any row is written. An implementation that defaults it to an empty string and returns 201 fails."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
          trigger:
            - call: POST /survivors
              payload: { primary_contact_phone: "555-0204", household_size: 2, income_band: "LOW", head_of_household_age: 40 }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { e: "$.data.error_id" }
          assert:
            - "HTTP 400 and data.error_id == 'ERR_INVALID_REQUEST'."
            - "No Survivor row is created."
      - name: corner_survivor_optional_flags_take_declared_defaults
        claim_type: defaults
        grounds: ["entities.Survivor.fields.has_member_with_disability", "entities.Survivor.fields.follow_up_opt_in"]
        distinguishing_aspect: "Omitting the four boolean flags must yield has_member_with_disability false, is_uninsured false, consent_on_file false and follow_up_opt_in TRUE — the last one defaults to true, unlike its three neighbours, and the priority score must reflect the defaults (MODERATE 10 + household 4 = 14)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
          trigger:
            - call: POST /survivors
              payload: { household_name: "Duarte Household", primary_contact_phone: "555-0205", household_size: 2, income_band: "MODERATE", head_of_household_age: 41 }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv5: "$.data.id" }
          assert:
            - "HTTP 201."
            - "data.has_member_with_disability == false, data.is_uninsured == false, data.consent_on_file == false."
            - "data.follow_up_opt_in == true."
            - "data.priority_score == 14 (MODERATE 10 + 4 for one extra member)."
      - name: corner_survivor_priority_score_is_computed_and_client_value_ignored
        claim_type: computed_fields
        grounds: ["calculations.survivor_priority_score", "entities.Survivor.fields.priority_score"]
        distinguishing_aspect: "priority_score has source computed, so a client-supplied value must be discarded and recomputed. Fixture ELI household 8 with disability, age 70, uninsured: 40 + min(20, 28) + 15 + 10 + 15 = 100 which is exactly SCORE_CEILING; an implementation that omits the ceiling or the household cap reports 108 or 128."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
          trigger:
            - call: POST /survivors
              payload: { household_name: "Espinoza Household", primary_contact_phone: "555-0206", household_size: 8, income_band: "ELI", head_of_household_age: 70, has_member_with_disability: true, is_uninsured: true, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv6: "$.data.id" }
          assert:
            - "data.priority_score == 100 (household term capped at 20 and the total capped at SCORE_CEILING 100)."
            - "data.open_case_count == 0."
      - name: corner_case_system_fields_are_server_minted_and_version_starts_at_one
        claim_type: system_fields
        grounds: ["entities.RecoveryCase.common_fields", "endpoints[POST /recovery-cases]"]
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted; a freshly created RecoveryCase must have version 1, case_status INTAKE and funding_status UNFUNDED, with created_at equal to the pinned logical clock rather than wall-clock now."
        test_recipe:
          setup:
            - "One Survivor; the logical clock is pinned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Fontaine Household", primary_contact_phone: "555-0207", household_size: 2, income_band: "LOW", head_of_household_age: 50, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv7: "$.data.id" }
          trigger:
            - call: POST /recovery-cases
              payload: { survivor_id: "${sv7}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { cs7: "$.data.id", vv: "$.data.version" }
          assert:
            - "HTTP 201, data.version == 1, data.id is a UUID with no type prefix."
            - "data.created_at == '2026-09-01T00:00:00.000Z' (the pinned logical clock, not wall time)."
            - "data.case_status == 'INTAKE' and data.funding_status == 'UNFUNDED'."
            - "data.total_committed_cents == 0 and data.total_net_disbursed_cents == 0."
      - name: corner_invalid_income_band_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Survivor.fields.income_band.constraints", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "income_band is constrained to five enum values; 'MIDDLE' must be rejected with 400 ERR_INVALID_REQUEST rather than stored and scored as 0 points."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
          trigger:
            - call: POST /survivors
              payload: { household_name: "Gagnon Household", primary_contact_phone: "555-0208", household_size: 2, income_band: "MIDDLE", head_of_household_age: 40, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { e: "$.data.error_id" }
          assert:
            - "HTTP 400 and data.error_id == 'ERR_INVALID_REQUEST'."
            - "No Survivor row is created."
      - name: corner_assessment_is_immutable_with_no_version_field
        claim_type: immutability
        grounds: ["entities.UnmetNeedAssessment.common_fields"]
        distinguishing_aspect: "UnmetNeedAssessment declares common_fields false, so it carries only id and created_at — no version and no updated_at — and §1.5 exposes no update or delete endpoint for it. Re-running the same variant must mint a NEW assessment row rather than mutate the previous one, which is why the pinned assessment_id on a presentation is a stable snapshot."
        test_recipe:
          setup:
            - "Case with one verified STRUCTURE DamageItem of 900000 and no assistance records."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Hollis Household", primary_contact_phone: "555-0209", household_size: 2, income_band: "LOW", head_of_household_age: 48, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv9: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${sv9}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { cs9: "$.data.id" }
            - call: POST /recovery-cases/{id}/damage-items
              payload: { category: "STRUCTURE", item_description: "Siding", documented_cost_cents: 900000, photo_count: 3, is_habitability_critical: true }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { dm9: "$.data.id" }
            - call: POST /damage-items/{id}/verification
              payload: { verification_status: "VERIFIED", verified_cost_cents: 900000 }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /recovery-cases/{id}/assessments
              payload: { variant: "PURPOSE_MATCHED" }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { as9a: "$.data.id" }
          trigger:
            - call: POST /recovery-cases/{id}/assessments
              payload: { variant: "PURPOSE_MATCHED" }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { as9b: "$.data.id" }
            - call: GET /recovery-cases/{id}/assessments
              payload: {}
              as: CaseManager
              as_user_id: u_cm_1
          assert:
            - "The second assessment has a different id from the first (${as9b} != ${as9a})."
            - "Neither assessment payload contains a 'version' or 'updated_at' field; both contain id and created_at."
            - "GET the assessments list returns total_count 2 with two distinct ids and two distinct created_at values, both with unmet_need_total_cents 900000 - the second determination appended a row instead of mutating the first."
      - name: corner_recovery_case_requires_existing_survivor_parent
        claim_type: parent_relationships
        grounds: ["entities.RecoveryCase.parent", "validations[priority 5]", "errors[ERR_SURVIVOR_NOT_FOUND]"]
        distinguishing_aspect: "RecoveryCase declares Survivor as its parent via survivor_id; a body FK pointing at a non-existent survivor must yield 404 ERR_SURVIVOR_NOT_FOUND at priority 5, after the body has already passed shape validation, and must not create an orphan case."
        test_recipe:
          setup:
            - "Empty database; no Survivor rows exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
          trigger:
            - call: POST /recovery-cases
              payload: { survivor_id: "00000000-0000-4000-8000-000000000001", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { e: "$.data.error_id" }
            - call: GET /recovery-cases
              payload: { disaster_code: "DR-4801" }
              as: CaseManager
              as_user_id: u_cm_1
          assert:
            - "HTTP 404 and data.error_id == 'ERR_SURVIVOR_NOT_FOUND'."
            - "GET /recovery-cases?disaster_code=DR-4801 returns total_count 0."
      - name: corner_self_referential_predecessor_must_belong_to_the_same_case
        claim_type: graph
        grounds: ["entities.ConstructionProject.fields.predecessor_project_id", "validations[priority 33]", "errors[ERR_PREDECESSOR_CASE_MISMATCH]"]
        distinguishing_aspect: "entity_topology is graph and ConstructionProject is self-referential. A predecessor drawn from a DIFFERENT RecoveryCase must be rejected with 422 ERR_PREDECESSOR_CASE_MISMATCH, while the same shape within one case is accepted — so the constraint is on the edge's endpoints, not on the field's presence."
        test_recipe:
          setup:
            - "One Survivor with two RecoveryCases, each carrying one ConstructionProject in SCOPED."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Ivers Household", primary_contact_phone: "555-0210", household_size: 3, income_band: "LOW", head_of_household_age: 47, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv10: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${sv10}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { csA: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${sv10}", disaster_code: "DR-4802", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { csB: "$.data.id" }
            - call: POST /construction-projects
              payload: { case_id: "${csA}", scope_code: "STRUCTURE_REBUILD", required_trade_hours: { GENERAL_LABOR: 80 }, estimated_material_cents: 100000 }
              as: ConstructionManager
              as_user_id: u_cn_1
              captures: { prA: "$.data.id" }
          trigger:
            - call: POST /construction-projects
              payload: { case_id: "${csB}", scope_code: "INTERIOR_REPAIR", required_trade_hours: { GENERAL_LABOR: 120 }, estimated_material_cents: 200000, predecessor_project_id: "${prA}" }
              as: ConstructionManager
              as_user_id: u_cn_1
              captures: { e: "$.data.error_id" }
            - call: POST /construction-projects
              payload: { case_id: "${csA}", scope_code: "INTERIOR_REPAIR", required_trade_hours: { GENERAL_LABOR: 120 }, estimated_material_cents: 200000, predecessor_project_id: "${prA}" }
              as: ConstructionManager
              as_user_id: u_cn_1
              captures: { prC: "$.data.id" }
            - call: GET /construction-projects
              payload: { predecessor_project_id: "${prA}" }
              as: ConstructionManager
              as_user_id: u_cn_1
          assert:
            - "The cross-case predecessor returns HTTP 422 with data.error_id == 'ERR_PREDECESSOR_CASE_MISMATCH'."
            - "The same-case predecessor returns HTTP 201 with data.predecessor_project_id == ${prA} and data.status == 'SCOPED'."
            - "GET /construction-projects?predecessor_project_id=${prA} returns total_count 1, containing only ${prC}."

  - section: state_machines
    instances:
      - name: corner_project_initial_state_is_scoped
        claim_type: initial_state
        grounds: ["state_machines.ConstructionProject.initial_state"]
        distinguishing_aspect: "A newly created ConstructionProject must be SCOPED with zero deployment counters, regardless of the case's own state; it is not auto-permitted just because required_trade_hours and a material estimate were supplied."
        test_recipe:
          setup:
            - "One Survivor and one RecoveryCase in INTAKE."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Jansen Household", primary_contact_phone: "555-0211", household_size: 2, income_band: "LOW", head_of_household_age: 43, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv11: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${sv11}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { cs11: "$.data.id" }
          trigger:
            - call: POST /construction-projects
              payload: { case_id: "${cs11}", scope_code: "INTERIOR_REPAIR", required_trade_hours: { GENERAL_LABOR: 100 }, estimated_material_cents: 250000 }
              as: ConstructionManager
              as_user_id: u_cn_1
              captures: { pr11: "$.data.id" }
          assert:
            - "HTTP 201 and data.status == 'SCOPED'."
            - "data.confirmed_deployment_count == 0 and data.permit_number == null."
            - "data.predecessor_project_id == null and data.version == 1."
      - name: corner_session_open_valid_transition_records_attendance
        claim_type: valid_transition
        grounds: ["state_machines.TableSession.transitions.SCHEDULED_to_IN_SESSION"]
        distinguishing_aspect: "Opening a SCHEDULED session with enough attending orgs must set status IN_SESSION, persist attending_member_org_ids, record chaired_by_user_id from the acting X-User-ID and bump version to 2."
        test_recipe:
          setup:
            - "Two ACTIVE MemberOrganizations and one SCHEDULED TableSession with quorum_min_member_orgs 2."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /member-organizations
