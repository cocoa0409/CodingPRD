              payload: { asset_system_id: "${sys_id}", description: "Resurface", cost_estimate_cents: 50000000, severity: 2, urgency: 2, recommended_year: 2028 }
              as: Consultant
              captures: { def_id: "$.data.id" }
          trigger:
            - call: "GET /fca/facilities/${fac_id}"
              payload: {}
              as: Consultant
              captures: { fci: "$.data.facility_condition_index" }
            - call: "GET /fca/facilities/${fac_id}/refresh-health"
              payload: {}
              as: Consultant
              captures: { health: "$.data.health" }
          assert:
            - "Facility.${fac_id}.facility_condition_index == 0.0500 (50000000 / 1000000000, 4dp round_half_up)"
            - "refresh-health.health == 'WATCH' (0.0500 >= WATCH_FCI_THRESHOLD 0.05 enters WATCH; a > comparison would wrongly return GOOD)"
            - "refresh-health.stale_systems == 0 (system last_assessed_epoch defaults to facility epoch 0)"
