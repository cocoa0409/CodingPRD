          - validations[priority=54]
          - entities.DistributionRecord.fields.ship_date
          - entities.ProductListing.fields.lot_authorized_units
        distinguishing_aspect: |
          A DIFFERENT resource entity (DistributionRecord lot windows on one listing) with the
          OPPOSITE interval semantics: CLOSED-CLOSED [ship_date, delivery_date], where touching
          endpoints COLLIDE — the exact case that is legal for inspections. The same probe set also
          separates the temporal rule from the aggregate one: a same-lot window that merely touches is
          refused by ERR_LOT_WINDOW_CONFLICT, a different lot in the identical window is accepted, and
