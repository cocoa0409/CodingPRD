  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: membership_not_active_outranks_consult_schedule_conflict
        grounds:
          - validations[priority=23]
          - validations[priority=30]
          - errors[ERR_MEMBERSHIP_NOT_ACTIVE]
          - errors[ERR_SCHEDULE_CONFLICT]
          - state_machines.Membership.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Category pair {state, business_temporal}. A single request violates
          rung 10 priority 23 (the membership is SUSPENDED) and rung 14 priority
          30 (the interval collides with a SCHEDULED booking on the same
          consultant after the 15-minute buffer); the lower priority number wins,
          so the response is ERR_MEMBERSHIP_NOT_ACTIVE with HTTP 409, never
          ERR_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-16T00:00:00Z after the setup chain"
            - "One PLUS plan, one physician with panel_slot_cap 20.0 licensed in CA"
            - "One family, one child, a membership started 2026-06-01 whose June invoice of 40000 cents is PAID"
            - "One SCHEDULED lactation consult on 2026-06-20 from 09:00 to 09:45 on that consultant, holding one entitlement unit"
            - "A July invoice of 40000 cents ISSUED with due_date 2026-06-15, unpaid, and the membership therefore SUSPENDED"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
