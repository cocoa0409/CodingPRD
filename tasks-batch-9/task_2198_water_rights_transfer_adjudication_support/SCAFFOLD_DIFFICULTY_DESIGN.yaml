            - call: PATCH /claimants/${claimant_a_id}/standing
              payload: {standing_status: DELINQUENT}
              as: BasinAdjudicator
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v2: version}
          trigger: >-
            POST /transfer-applications/${app_id}/submit with
            {expected_water_right_version: "${right_v2}"} while the claimant is
            DELINQUENT; then PATCH /claimants/${claimant_a_id}/standing back to
            IN_GOOD_STANDING and issue the identical submit again (re-capturing
            the right's version first, since the PATCH does not touch the right).
          assert: |
            TRIGGER (DELINQUENT):
              403 with error id ERR_CLAIMANT_NOT_IN_GOOD_STANDING   # priority 24
              and NOT 422 ERR_TRANSFERABLE_VOLUME_EXCEEDED
            CONTROL (IN_GOOD_STANDING, same 500.00 af):
              422 with error id ERR_TRANSFERABLE_VOLUME_EXCEEDED   # priority 45
            After both rejections nothing moved:
              app.status == DRAFT, app.escrowed_af == 0.00
              WaterRight: encumbered_af == 0.00, transferred_away_af == 0.00,
                transferable_af == 195.00, status == ACTIVE
              Claimant.open_application_count == 1 (the DRAFT still counts)
            The 403/422 split also proves the two rules are not collapsed into
            one generic 422 handler.
  # ---------------------------------------------------------------------------
  # RULE 6 — boundary_precision_check
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: pod_rate_equality_accepted_one_thousandth_rejected
        grounds: validations[priority=42]
        distinguishing_aspect: >-
          The point-of-diversion capacity gate is strict `>` at three decimal
          places: two overlapping leases at one headgate whose rates sum to
          EXACTLY max_rate_cfs 3.000 (1.250 + 1.750) are both accepted, while a
          third overlapping lease of only 0.001 cfs pushes the aggregate to
          3.001 and is rejected with 409. Bank credit is deliberately kept
          abundant (available_credit_af 80.00 against a 10.00 af request) so
          priority 46 cannot mask the rate boundary, and all three leases sit at
          the SAME headgate so priority 41 is inapplicable by construction.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, build the BASE RIGHT for claimant A with
            bank_enrolled true and ONE point of diversion whose max_rate_cfs is
            exactly 3.000, created before activation so it is AUTHORIZED. Open a
            bank account and deposit 100.00 af. Reserve lease A at that headgate
            for [2026-04-01, 2026-08-01) with diversion_rate_cfs 1.250 and
            requested_af 10.00.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/points-of-diversion
              payload: {legal_description: "NE1/4 S12 T4N R2E", stream_reach_code: "ALDER-01", max_rate_cfs: 3.000, stream_miles_from_headwater: 12.00}
              as: WaterRightsAnalyst
              captures: {pod_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /water-bank-accounts
              payload: {claimant_id: "${claimant_a_id}", basin_code: "ALDER-BASIN"}
              as: WaterRightsAnalyst
              captures: {acct_id: id}
            - call: GET /water-bank-accounts/${acct_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {acct_v1: version}
            - call: POST /water-bank-accounts/${acct_id}/deposits
              payload: {water_right_id: "${right_id}", deposit_af: 100.00, expected_water_bank_account_version: "${acct_v1}"}
              as: WaterRightsAnalyst
            - call: POST /lease-assignments
              payload: {water_bank_account_id: "${acct_id}", water_right_id: "${right_id}", point_of_diversion_id: "${pod_id}", lessee_name: "Lessee A", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-08-01T00:00:00Z", requested_af: 10.00, diversion_rate_cfs: 1.250, rental_rate_usd_per_af: 45.00, valuation_method: PRO_RATA_DAILY}
              as: WaterRightsAnalyst
              captures: {lease_a_id: id}
          trigger: >-
            POST /lease-assignments for the SAME headgate and the SAME window
            with diversion_rate_cfs 1.750 and requested_af 10.00 (aggregate
            exactly 3.000), then a third POST for the same headgate and window
            with diversion_rate_cfs 0.001 and requested_af 10.00 (aggregate
            3.001).
          assert: |
            Lease B (rate 1.750): 201 CREATED, status == RESERVED.
              peak_aggregate_rate_cfs == 3.000 == max_rate_cfs -> accepted
              because the gate is strict `>`.
            Lease C (rate 0.001): 409 with error id ERR_POD_CAPACITY_EXCEEDED.
              peak_aggregate_rate_cfs == 3.001 (0.001 + 1.250 + 1.750) exceeds
              3.000 by one thousandth.
            Account after B is created and C is rejected:
              deposited_credit_af == 100.00, committed_credit_af == 20.00,
              leased_out_af == 0.00, available_credit_af == 80.00,
              posture == OPEN
            The 10.00 af request never approaches the 80.00 af available credit,
            so a 409 (not a 422) is the only admissible failure and the boundary
            being tested is unambiguous.
            GET /lease-assignments?point_of_diversion_id=${pod_id} returns
            exactly 2 rows.

      - name: hcu_qualifying_set_and_haircut_boundaries
        grounds: validations[priority=28]
        distinguishing_aspect: >-
          Three adjacent boundaries on one calculation are pinned at once: (i) an
          EMPTY qualifying set is rejected with 422
          ERR_INSUFFICIENT_USE_HISTORY rather than quantified as 0.00 — both for
          a study period containing no records at all and for one containing
          only an AFFIDAVIT record, which counts for forfeiture but is
          inadmissible for quantification; (ii) the study period bounds are BOTH
          inclusive, so a 2022-2024 period admits the 2024 record; (iii) the
          short-history haircut uses a strict `<`, so 2 qualifying years take the
          0.85 haircut (165.75) while exactly 3 take none (195.00).
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, create claimant A and one water right
            with authorized_diversion_af 400.00, then post exactly three
            beneficial-use records: 2022 AFFIDAVIT 250.000 af (inadmissible for
            quantification), 2024 METER 300.000 af and 2025 METER 300.000 af.
            Activate the right.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2022, reported_diversion_af: 250.000, irrigated_acres: 90.00, verification_source: AFFIDAVIT}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
          trigger: >-
            Four POST /water-rights/${right_id}/hcu-studies calls, all
            DIVERSION_BASED: (1) 2019-2020, (2) 2022-2022, (3) 2024-2025,
            (4) after adding a 2023 METER record of 300.000 af, 2023-2025.
          assert: |
            (1) study_period 2019-2020 -> 422 ERR_INSUFFICIENT_USE_HISTORY
                (no records at all in the closed period; NOT a 201 with
                average_annual_cu_af 0.000)
            (2) study_period 2022-2022 -> 422 ERR_INSUFFICIENT_USE_HISTORY
                (the AFFIDAVIT record exists but is inadmissible, so
                qualifying_year_count == 0)
            (3) study_period 2024-2025 -> 201 with
                qualifying_year_count == 2
                average_annual_cu_af == 195.000     # (195.000 + 195.000) / 2
                short_history_haircut_applied == true    # 2 < 3, strict `<`
                transferable_cu_af == 165.75        # 195.000 * 0.85
            (4) after POST of the 2023 METER record, study_period 2023-2025 ->
                201 with
                qualifying_year_count == 3
                average_annual_cu_af == 195.000
                short_history_haircut_applied == false   # exactly 3 takes NO haircut
                transferable_cu_af == 195.00
            The 29.25 af gap between (3) and (4) is produced solely by one extra
            qualifying year crossing the MIN_QUALIFYING_YEARS boundary.
            Both study-period bounds are inclusive: a 2022-2024 period would
            admit the 2024 record, and none of these studies is capped
            (face_cap == 260.000).

      - name: forfeiture_five_year_boundary
        grounds: calculations.forfeiture_risk_score
        distinguishing_aspect: >-
          Statutory forfeiture eligibility is inclusive at exactly 5 consecutive
          non-use years. Two rights are given records that differ by ONE used
          year inside the same 10-year look-back [2016, 2025]: R1 used 2020 and
          2025 (longest non-use run 4 -> score 33.50 LOW -> forfeiture_eligible
          false -> declare-forfeiture is refused 422), R2 used only 2020
          (longest run 5 -> score 42.50 ELEVATED -> forfeiture_eligible true ->
          declare-forfeiture succeeds and zeroes all four ledger buckets). The
          current calendar year 2026 is excluded from the window, so a 2026
          record would not rescue R2 — that is asserted too.
        test_recipe:
          setup: >-
            Pin the clock at 2026-06-15 (calendar year 2026, so the look-back is
            the closed window [2016, 2025]). Create claimant A and two water
            rights R1 and R2, each authorized_diversion_af 400.00. Give R1 METER
            records for 2020 and 2025 (300.000 af each) and R2 a single METER
            record for 2020 (300.000 af), plus a 2026 METER record on R2 that
            must be ignored because the current year is outside the window.
            Activate both and certify a DIVERSION_BASED 2020-2020 study on R2
            (qualifying_year_count 1 -> transferable_cu_af 165.75) so the
            forfeiture cascade has volume to zero out.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-06-15T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00301", priority_date: "1899-03-02T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}
              as: WaterRightsAnalyst
              captures: {r1_id: id}
            - call: POST /water-rights/${r1_id}/beneficial-use-records
              payload: {use_year: 2020, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r1_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r1_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00302", priority_date: "1899-03-03T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}
              as: WaterRightsAnalyst
              captures: {r2_id: id}
            - call: POST /water-rights/${r2_id}/beneficial-use-records
              payload: {use_year: 2020, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r2_id}/beneficial-use-records
              payload: {use_year: 2026, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r2_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${r2_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2020, study_period_end_year: 2020}
              as: WaterRightsAnalyst
              captures: {r2_study_id: id}
            - call: GET /water-rights/${r2_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {r2_v1: version}
            - call: POST /hcu-studies/${r2_study_id}/certify
              payload: {expected_water_right_version: "${r2_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
          trigger: >-
            GET /water-rights/${r1_id}/forfeiture-assessment and
            GET /water-rights/${r2_id}/forfeiture-assessment, then
            POST /water-rights/${r1_id}/declare-forfeiture and
            POST /water-rights/${r2_id}/declare-forfeiture, both with
            {finding_note: "statutory non-use finding"}.
          assert: |
            Both assessments report lookback_start_year == 2016 and
            lookback_end_year == 2025 (2026 excluded).
            R1 (used 2020 and 2025):
              consecutive_nonuse_years == 4        # 2016-2019 and 2021-2024 both 4
              nonuse_component == 36, unverified_component == 0.00,
              underuse_component == 7.50, meter_credit == 10, suspended_penalty == 0
              forfeiture_risk_score == 33.50, forfeiture_risk_band == LOW
              forfeiture_eligible == false
              POST declare-forfeiture -> 422 ERR_FORFEITURE_NOT_ELIGIBLE,
              status stays ACTIVE
            R2 (used 2020 only; the 2026 record is outside the window):
              consecutive_nonuse_years == 5        # 2021-2025
              nonuse_component == 45, unverified_component == 0.00,
              underuse_component == 7.50, meter_credit == 10
              forfeiture_risk_score == 42.50, forfeiture_risk_band == ELEVATED
              forfeiture_eligible == true
              certified_hcu_af == 165.75 before the call (1 qualifying year ->
                195.000 * 0.85)
              POST declare-forfeiture -> 200 with status == FORFEITED and
              certified_hcu_af == 0.00, encumbered_af == 0.00,
              transferred_away_af == 0.00, transferable_af == 0.00
            One year of beneficial use is the entire difference between a 422 and
            a terminal, irreversible 200.
  # ---------------------------------------------------------------------------
  # RULE 7 — cross_entity_state_dependency  (two different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: lease_activation_blocked_by_account_posture
        grounds: validations[priority=22]
        distinguishing_aspect: >-
          Whether a LeaseAssignment may leave RESERVED depends on a field of a
          DIFFERENT entity — WaterBankAccount.posture — which is itself derived
          from the account's own available_credit_af and the holder Claimant's
          standing. A 44.00 af deposit against a 40.00 af reservation leaves
          available_credit_af at 4.00, one cent under the 5.00 low-credit floor,
          so posture is RESTRICTED and activation is refused 409 even though the
          lease itself is in a legal from-state and inside its own window. A
          further 6.00 af deposit — a mutation of the ACCOUNT, not of the lease —
          flips posture to OPEN and the identical activation then succeeds.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, build the BASE RIGHT for claimant A with
            bank_enrolled true and one AUTHORIZED point of diversion. Open a bank
            account and deposit exactly 44.00 af. Reserve a 40.00 af lease at
            that headgate for [2026-04-01, 2026-08-01) — committed_credit_af
            40.00, available_credit_af 4.00, posture RESTRICTED. Move the clock
            to 2026-04-05, inside the lease window, so priority 35 cannot be the
            reason for a refusal.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/points-of-diversion
              payload: {legal_description: "NE1/4 S12 T4N R2E", stream_reach_code: "ALDER-01", max_rate_cfs: 5.000, stream_miles_from_headwater: 12.00}
              as: WaterRightsAnalyst
              captures: {pod_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /water-bank-accounts
              payload: {claimant_id: "${claimant_a_id}", basin_code: "ALDER-BASIN"}
              as: WaterRightsAnalyst
              captures: {acct_id: id}
            - call: GET /water-bank-accounts/${acct_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {acct_v1: version}
            - call: POST /water-bank-accounts/${acct_id}/deposits
              payload: {water_right_id: "${right_id}", deposit_af: 44.00, expected_water_bank_account_version: "${acct_v1}"}
              as: WaterRightsAnalyst
              captures: {acct_v2: version}
            - call: POST /lease-assignments
              payload: {water_bank_account_id: "${acct_id}", water_right_id: "${right_id}", point_of_diversion_id: "${pod_id}", lessee_name: "Bench Ditch Co", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-08-01T00:00:00Z", requested_af: 40.00, diversion_rate_cfs: 1.500, rental_rate_usd_per_af: 45.00, valuation_method: PRO_RATA_DAILY}
              as: WaterRightsAnalyst
              captures: {lease_id: id}
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-04-05T00:00:00Z"}
              as: WaterRightsAnalyst
          trigger: >-
            POST /lease-assignments/${lease_id}/activate (expected to fail),
            then POST /water-bank-accounts/${acct_id}/deposits with
            {water_right_id: "${right_id}", deposit_af: 6.00,
            expected_water_bank_account_version: "${acct_v2}"}, then
            POST /lease-assignments/${lease_id}/activate again.
          assert: |
            FIRST activation attempt:
              409 with error id ERR_ACCOUNT_POSTURE_BLOCKED
              account state at that moment: deposited_credit_af == 44.00,
                committed_credit_af == 40.00, leased_out_af == 0.00,
                available_credit_af == 4.00, posture == RESTRICTED
                (4.00 < 5.00, strict `<`)
              lease.status is still RESERVED
            After the 6.00 af deposit (200):
              deposited_credit_af == 50.00, committed_credit_af == 40.00,
              leased_out_af == 0.00, available_credit_af == 10.00,
              posture == OPEN
              WaterRight: encumbered_af == 50.00, transferable_af == 145.00
            SECOND activation attempt (identical request):
              200 with lease.status == ACTIVE
              account: committed_credit_af == 0.00, leased_out_af == 40.00,
              available_credit_af == 10.00, posture == OPEN
            Nothing about the lease changed between the two calls — only the
            account's derived posture — which is exactly the cross-entity
            dependency being pinned.

      - name: claim_examination_gated_by_docket_phase
        grounds: validations[priority=19]
        distinguishing_aspect: >-
          An AdjudicationClaim's own filing_status is a legal from-state for
          examine (FILED -> EXAMINED), yet the call is refused 409
          ERR_DOCKET_PHASE_INVALID because the parent DecreeDocket is still in
          OPEN_FOR_CLAIMS. The docket cannot be advanced early either: at a clock
          before claim_filing_deadline the advance is refused 409
          ERR_WINDOW_STILL_OPEN. Only after the clock reaches the deadline and
          the docket advances to EXAMINATION does the identical examine call
          succeed — three states across two entities must line up, and the two
          refusals carry different error ids.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, build the BASE RIGHT for claimant A,
            then open a decree docket for the basin with claim_filing_deadline
            2026-04-01T00:00:00Z and file one adjudication claim on the right
            (claimed_priority_date identical to the right's 1901-05-01, so the
            priority-mismatch haircut cannot interfere, and claimed_af 180.00).
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /decree-dockets
              payload: {basin_code: "ALDER-BASIN", docket_number: "CV-2026-0007", claim_filing_deadline: "2026-04-01T00:00:00Z"}
              as: BasinAdjudicator
              captures: {docket_id: id}
            - call: POST /adjudication-claims
              payload: {decree_docket_id: "${docket_id}", water_right_id: "${right_id}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 180.00}
              as: BasinAdjudicator
              captures: {claim_id: id}
          trigger: >-
            POST /adjudication-claims/${claim_id}/examine with
            {examiner_recommended_af: 150.00, examination_note: "field records
            support 150 af"} while the docket is OPEN_FOR_CLAIMS; then
            POST /decree-dockets/${docket_id}/advance-phase with {target_phase:
            EXAMINATION} at the same early clock; then set the clock to
            2026-04-01T00:00:00Z, advance the phase, and repeat the identical
            examine call.
          assert: |
            (1) examine at docket phase OPEN_FOR_CLAIMS ->
                409 ERR_DOCKET_PHASE_INVALID; claim.filing_status stays FILED and
                examiner_recommended_af stays null
            (2) advance-phase to EXAMINATION at clock 2026-03-01 ->
                409 ERR_WINDOW_STILL_OPEN (the filing window is still open;
                docket.phase stays OPEN_FOR_CLAIMS, claim_count == 1)
            (3) at clock exactly 2026-04-01T00:00:00Z, advance-phase to
                EXAMINATION -> 200 with docket.phase == EXAMINATION
                (the temporal gate is `>=`, so the deadline instant qualifies,
                and priority 49's child gate is satisfied by claim_count == 1)
            (4) the identical examine call now -> 200 with
                claim.filing_status == EXAMINED,
                examiner_recommended_af == 150.00,
                verification_status still UNVERIFIED (the parallel dimension does
                not move), docket.decreed_claim_count == 0
            A decree attempt at this point would still fail: priority 19 requires
            OBJECTION_PERIOD and priority 20 requires FIELD_VERIFIED.
  # ---------------------------------------------------------------------------
  # RULE 8 — resource_temporal_overlap  (two DIFFERENT interval geometries)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: pod_half_open_adjacency_and_aggregate
        grounds: calculations.pod_concurrent_rate_load
        distinguishing_aspect: >-
          Headgate contention uses HALF-OPEN [start, end) semantics, so two
          back-to-back leases that touch at 2026-06-01 are BOTH accepted even
          though their rates sum to 4.000 against a max_rate_cfs of 3.000 — they
          never coexist. A third lease that genuinely straddles the seam
          [2026-05-15, 2026-06-15) overlaps both and is rejected on the
          conservative aggregate 1.500 + 2.000 + 2.000 == 5.500. A fourth lease
          starting exactly at 2026-06-01 overlaps only the later window and is
          accepted at aggregate exactly 3.000. Closed-interval or
          pairwise-maximum implementations get at least one of the four calls
          wrong.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, build the BASE RIGHT for claimant A with
            bank_enrolled true and one AUTHORIZED point of diversion whose
            max_rate_cfs is 3.000. Open a bank account, deposit 100.00 af, and
            reserve lease X at that headgate for [2026-04-01, 2026-06-01) with
            diversion_rate_cfs 2.000 and requested_af 10.00. All later leases use
            requested_af 10.00 as well, so bank credit (80.00 af or more
            available) never becomes the binding constraint.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/points-of-diversion
              payload: {legal_description: "NE1/4 S12 T4N R2E", stream_reach_code: "ALDER-01", max_rate_cfs: 3.000, stream_miles_from_headwater: 12.00}
              as: WaterRightsAnalyst
              captures: {pod_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /water-bank-accounts
              payload: {claimant_id: "${claimant_a_id}", basin_code: "ALDER-BASIN"}
              as: WaterRightsAnalyst
              captures: {acct_id: id}
            - call: GET /water-bank-accounts/${acct_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {acct_v1: version}
            - call: POST /water-bank-accounts/${acct_id}/deposits
              payload: {water_right_id: "${right_id}", deposit_af: 100.00, expected_water_bank_account_version: "${acct_v1}"}
              as: WaterRightsAnalyst
            - call: POST /lease-assignments
              payload: {water_bank_account_id: "${acct_id}", water_right_id: "${right_id}", point_of_diversion_id: "${pod_id}", lessee_name: "Lessee X", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-06-01T00:00:00Z", requested_af: 10.00, diversion_rate_cfs: 2.000, rental_rate_usd_per_af: 45.00, valuation_method: PRO_RATA_DAILY}
              as: WaterRightsAnalyst
              captures: {lease_x_id: id}
          trigger: >-
            Three further POST /lease-assignments calls at the SAME headgate,
            all with requested_af 10.00: (Y) [2026-06-01, 2026-08-01) at
            diversion_rate_cfs 2.000; (Z) [2026-05-15, 2026-06-15) at
            diversion_rate_cfs 1.500; (W) [2026-06-01, 2026-06-15) at
            diversion_rate_cfs 1.000.
          assert: |
            (Y) 201 RESERVED. X.lease_end_date == Y.lease_start_date ==
                2026-06-01T00:00:00Z, and half-open windows that merely touch do
                NOT overlap, so overlapping == [] and
                peak_aggregate_rate_cfs == 2.000 — accepted even though
                2.000 + 2.000 == 4.000 exceeds max_rate_cfs 3.000.
            (Z) 409 ERR_POD_CAPACITY_EXCEEDED. Z overlaps BOTH X
                (2026-04-01 < 2026-06-15 and 2026-06-01 > 2026-05-15) and Y
                (2026-06-01 < 2026-06-15 and 2026-08-01 > 2026-05-15), so
                peak_aggregate_rate_cfs == 5.500 > 3.000. The aggregate is
                conservative: no per-instant maximum is taken, even though X and
                Y never actually run together.
            (W) 201 RESERVED. W overlaps Y only (it touches X's end), so
                peak_aggregate_rate_cfs == 1.000 + 2.000 == 3.000 — exactly at
                capacity, accepted.
            Final state: 3 leases at the headgate (X, Y, W), account
            deposited_credit_af == 100.00, committed_credit_af == 30.00,
            leased_out_af == 0.00, available_credit_af == 70.00, posture == OPEN.

      - name: right_closed_buffer_across_headgates
        grounds: calculations.right_lease_exclusion_window
        distinguishing_aspect: >-
          The SAME right, at a DIFFERENT headgate, is governed by a CLOSED
          interval padded with a 7-day fallow buffer on both sides — the opposite
          geometry to the half-open, rate-aggregating test used within one
          headgate. An existing POD1 lease over [2026-04-01, 2026-06-30)
          projects the closed exclusion window [2026-03-25, 2026-07-07], so a
          POD2 candidate starting exactly on 2026-07-07 collides (touching
          endpoints DO collide) while one starting 2026-07-08 is accepted; the
          mirror boundary holds on the left, where a candidate ENDING exactly on
          2026-03-25 collides and one ending 2026-03-24 is accepted. Bank credit
          stays abundant throughout so only the geometry is under test.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, build the BASE RIGHT for claimant A with
            bank_enrolled true and TWO AUTHORIZED points of diversion (POD1 and
            POD2, max_rate_cfs 5.000 each), open a bank account, deposit 100.00
            af, and reserve one lease at POD1 for
            [2026-04-01T00:00:00Z, 2026-06-30T00:00:00Z) with requested_af 20.00
            and diversion_rate_cfs 1.000.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/points-of-diversion
              payload: {legal_description: "NE1/4 S12 T4N R2E", stream_reach_code: "ALDER-01", max_rate_cfs: 5.000, stream_miles_from_headwater: 12.00}
              as: WaterRightsAnalyst
              captures: {pod1_id: id}
            - call: POST /water-rights/${right_id}/points-of-diversion
              payload: {legal_description: "SW1/4 S12 T4N R2E", stream_reach_code: "ALDER-02", max_rate_cfs: 5.000, stream_miles_from_headwater: 15.00}
              as: WaterRightsAnalyst
              captures: {pod2_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /water-bank-accounts
              payload: {claimant_id: "${claimant_a_id}", basin_code: "ALDER-BASIN"}
              as: WaterRightsAnalyst
              captures: {acct_id: id}
            - call: GET /water-bank-accounts/${acct_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {acct_v1: version}
            - call: POST /water-bank-accounts/${acct_id}/deposits
              payload: {water_right_id: "${right_id}", deposit_af: 100.00, expected_water_bank_account_version: "${acct_v1}"}
              as: WaterRightsAnalyst
            - call: POST /lease-assignments
              payload: {water_bank_account_id: "${acct_id}", water_right_id: "${right_id}", point_of_diversion_id: "${pod1_id}", lessee_name: "Lessee POD1", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-06-30T00:00:00Z", requested_af: 20.00, diversion_rate_cfs: 1.000, rental_rate_usd_per_af: 45.00, valuation_method: PRO_RATA_DAILY}
              as: WaterRightsAnalyst
              captures: {lease_pod1_id: id}
          trigger: >-
            Four POST /lease-assignments calls at POD2, each with requested_af
            10.00 and diversion_rate_cfs 1.000: (a) [2026-07-07, 2026-09-01);
            (b) [2026-07-08, 2026-09-01); (c) [2026-01-01, 2026-03-25);
            (d) [2026-01-01, 2026-03-24).
          assert: |
            The POD1 lease projects E_excl_start == 2026-03-25T00:00:00Z and
            E_excl_end == 2026-07-07T00:00:00Z (7 whole days on each side).
            (a) 409 ERR_LEASE_WINDOW_CONFLICT — candidate.lease_start_date
                2026-07-07 <= E_excl_end 2026-07-07 (closed test, `<=`) and
                candidate.lease_end_date 2026-09-01 >= E_excl_start.
            (b) 201 RESERVED — 2026-07-08 is the first admissible start; the
                minimum accepted separation is the 7-day buffer plus one day.
            (c) 409 ERR_LEASE_WINDOW_CONFLICT — the mirror boundary:
                candidate.lease_end_date 2026-03-25 >= E_excl_start 2026-03-25.
            (d) 201 RESERVED — ending 2026-03-24 clears the left buffer.
            Both accepted POD2 leases coexist with the POD1 lease and with each
            other: same-headgate pairs are judged by
            calculations.pod_concurrent_rate_load instead, and 1.000 + 1.000
            never overlaps in time anyway.
            Account after all four calls: deposited_credit_af == 100.00,
            committed_credit_af == 40.00 (20.00 + 10.00 + 10.00),
            leased_out_af == 0.00, available_credit_af == 60.00, posture == OPEN —
            credit was never the binding constraint, so every 409 above is
            attributable to interval geometry alone.

  # ---------------------------------------------------------------------------
  # RULE 9 — compensating_invariant  (two different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: right_volume_ledger_submit_withdraw
        grounds: calculations.right_volume_ledger
        distinguishing_aspect: >-
          certified_hcu_af == transferable_af + encumbered_af +
          transferred_away_af must hold exactly at 2 decimal places before,
          during and after a compensating pair. Submitting a 70.00 af
          application moves volume from transferable (195.00 -> 125.00) into
          encumbered (0.00 -> 70.00) and re-derives the right's status to
          ENCUMBERED; withdrawing it must restore EACH bucket individually
          (195.00 / 0.00 / 0.00) and the status to ACTIVE, not merely keep the
          sum right. The child rows are part of the restoration:
          escrowed_af -> 0.00, the DRAFT InjuryAnalysis -> VOIDED,
          pending_review_count -> 0 and open_application_count -> 0.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01 and build the BASE RIGHT for claimant A
            (certified_hcu_af 195.00, transferable_af 195.00, encumbered_af 0.00,
            transferred_away_af 0.00, status ACTIVE). Draft a 70.00 af
            CHANGE_OF_USE application with a SEASONAL_AVERAGE injury analysis,
            then capture the right's version (the analysis bumped it).
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /transfer-applications
              payload: {water_right_id: "${right_id}", hcu_study_id: "${study_id}", application_type: CHANGE_OF_USE, requested_af: 70.00, proposed_purpose_of_use: MUNICIPAL}
              as: WaterRightsAnalyst
              captures: {app_id: id}
            - call: POST /transfer-applications/${app_id}/injury-analyses
              payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}
              as: WaterRightsAnalyst
              captures: {analysis_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v2: version}
          trigger: >-
            POST /transfer-applications/${app_id}/submit with
            {expected_water_right_version: "${right_v2}"} (forward action), then
            POST /transfer-applications/${app_id}/withdraw with
            {withdrawal_reason: "applicant re-scoping for next season"}
            (compensating action).
          assert: |
            Before the pair: certified_hcu_af == 195.00, transferable_af == 195.00,
              encumbered_af == 0.00, transferred_away_af == 0.00, status == ACTIVE,
              Claimant.open_application_count == 1 (the DRAFT),
              WaterRight.pending_review_count == 1 (the DRAFT analysis).
            After submit (200):
              app.status == SUBMITTED, app.escrowed_af == 70.00
              WaterRight: transferable_af == 125.00, encumbered_af == 70.00,
                transferred_away_af == 0.00, status == ENCUMBERED
              invariant: 195.00 == 125.00 + 70.00 + 0.00
            After withdraw (200):
              app.status == WITHDRAWN, app.escrowed_af == 0.00
              WaterRight: transferable_af == 195.00, encumbered_af == 0.00,
                transferred_away_af == 0.00, status == ACTIVE
              invariant: 195.00 == 195.00 + 0.00 + 0.00, and every individual
                bucket is back to its pre-submit value — not just the sum
              InjuryAnalysis.status == VOIDED and
                WaterRight.pending_review_count == 0
              Claimant.open_application_count == 0
            certified_hcu_af is untouched by both calls (195.00 throughout):
            withdrawal releases escrow, it does not un-certify the study.

      - name: bank_credit_ledger_reserve_cancel
        grounds: calculations.bank_credit_ledger
        distinguishing_aspect: >-
          The bank identity deposited_credit_af == available_credit_af +
          committed_credit_af + leased_out_af must survive a
          reserve/cancel-from-RESERVED pair with every term restored
          individually. Reserving 25.00 af against an 80.00 af deposit moves
          25.00 from available into committed; cancelling from RESERVED settles
          used_af at 0.00 (delivery never began, so the valuation_method is
          irrelevant), returns settlement_credit_af 25.00 and must leave
          deposited 80.00 / committed 0.00 / leased_out 0.00 / available 80.00.
          Crucially the PARENT right's ledger must also be untouched
          (encumbered_af 80.00, transferred_away_af 0.00, transferable_af
          115.00), because bank_hold subtracts used_af — an implementation that
          books requested_af instead of used_af on cancellation loses 25.00 af
          of the right's transferable volume.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, build the BASE RIGHT for claimant A with
            bank_enrolled true and one AUTHORIZED point of diversion, open a bank
            account and deposit 80.00 af (deposited 80.00 / available 80.00;
            right encumbered 80.00 / transferable 115.00).
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/points-of-diversion
              payload: {legal_description: "NE1/4 S12 T4N R2E", stream_reach_code: "ALDER-01", max_rate_cfs: 5.000, stream_miles_from_headwater: 12.00}
              as: WaterRightsAnalyst
              captures: {pod_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /water-bank-accounts
              payload: {claimant_id: "${claimant_a_id}", basin_code: "ALDER-BASIN"}
              as: WaterRightsAnalyst
              captures: {acct_id: id}
            - call: GET /water-bank-accounts/${acct_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {acct_v1: version}
            - call: POST /water-bank-accounts/${acct_id}/deposits
              payload: {water_right_id: "${right_id}", deposit_af: 80.00, expected_water_bank_account_version: "${acct_v1}"}
              as: WaterRightsAnalyst
          trigger: >-
            POST /lease-assignments with {water_bank_account_id: "${acct_id}",
            water_right_id: "${right_id}", point_of_diversion_id: "${pod_id}",
            lessee_name: "Bench Ditch Co", lease_start_date:
            "2026-04-01T00:00:00Z", lease_end_date: "2026-06-30T00:00:00Z",
            requested_af: 25.00, diversion_rate_cfs: 1.000,
            rental_rate_usd_per_af: 45.00, valuation_method: SEASON_BLOCK}
            (forward action), then POST /lease-assignments/{id}/cancel with
            {cancellation_reason: "lessee withdrew before delivery"}
            (compensating action, still at clock 2026-03-01 — before
            lease_start_date, which is legal for a RESERVED lease).
          assert: |
            After the reservation (201):
              lease.status == RESERVED, used_af == 0.00,
                settlement_credit_af == 0.00
              account: deposited_credit_af == 80.00, committed_credit_af == 25.00,
                leased_out_af == 0.00, available_credit_af == 55.00,
                suspended_lease_count == 0, posture == OPEN
              invariant: 80.00 == 55.00 + 25.00 + 0.00
              WaterRight unchanged: encumbered_af == 80.00,
                transferred_away_af == 0.00, transferable_af == 115.00,
                status == ENCUMBERED
            After the cancellation (200):
              lease.status == CANCELLED, used_af == 0.00,
                settlement_credit_af == 25.00
                (cancellation from RESERVED yields used_af 0.00 regardless of
                valuation_method — SEASON_BLOCK does NOT charge a first block
                here, because delivery never began)
              account: deposited_credit_af == 80.00, committed_credit_af == 0.00,
                leased_out_af == 0.00, available_credit_af == 80.00,
                posture == OPEN
              invariant: 80.00 == 80.00 + 0.00 + 0.00, with each term back to its
                pre-reservation value
              WaterRight still: encumbered_af == 80.00,
                transferred_away_af == 0.00, transferable_af == 115.00,
                certified_hcu_af == 195.00, status == ENCUMBERED
            The deposit is NOT returned by a lease cancellation — the credit
            stays in the bank account and the right stays encumbered by it, which
            is the second, independent conservation law being asserted.

