            - "W2 -> SC is REJECTED with ERR_REST_PERIOD_VIOLATION (409): gap 9h < 10"

      - name: isolation_closed_interval_touch_exclusive_conflicts_shared_allowed
        grounds:
          - validations[priority=10]
          - errors[ERR_ISOLATION_CONFLICT]
          - entities.Isolation.fields.isolation_mode
        distinguishing_aspect: |
          Different interval semantics than the worker rest-gap rule: CLOSED
          isolation intervals on equipment — touching at a single endpoint
          instant already counts as overlap — and overlap is only rejected when
          at least one side is EXCLUSIVE (SHARED + SHARED interior overlap is
          admitted). Resource: equipment_tag, not Worker.
        test_recipe:
          setup:
            - "Turnaround in SCOPE_FROZEN; isolation I1 SHARED on TK-301 over [2026-06-10, 2026-06-20]; isolation I2 SHARED on TK-301 over [2026-06-10, 2026-06-15] (interior overlap, admitted)"
