            - call: "POST /peds/encounters"
              payload: { membership_id: "${mem_id}", encounter_type: "SICK_VISIT", modality: "IN_PERSON", patient_state_code: "CA", started_at: "2026-06-15T12:00:00Z" }
              as: CareCoordinator
