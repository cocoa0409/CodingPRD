            - "Counterparty.${cp_a_id}.open_margin_call_count == 1 (the REQUIRED sibling is still outstanding)"
            - "HedgeInstrument.${inst_id}.collateral_posted_usd == 0.00"

      - name: mtm_publish_adverse_margin_call_chain
        grounds:
          - state_machines.MarkToMarketRun.COMPUTED_to_PUBLISHED
          - calculations.margin_requirement_usd
          - entities.MarkToMarketRun.fields.margin_calls_created
