  # ===========================================================================
  # SECTION 5 / 9 — endpoints  (claim-extraction-guide: From Table 5)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: logical_clock_starts_at_the_declared_epoch_before_any_set_call
        claim_type: computed_read
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.Participant.fields.age_at_year_end
          - entities.Enrollment.fields.opt_out_deadline
        distinguishing_aspect: "No clock call is made anywhere in this fixture, so every date-derived field must resolve against the declared startup instant 2026-08-01T00:00:00Z: a participant born 1980-05-10 is 46 at year end and an enrollment created now has opt_out_deadline 2026-08-31. An implementation that falls back to real wall-clock time produces a different age and a different deadline the moment the calendar year rolls over, which is exactly the non-determinism this endpoint exists to remove."
        test_recipe:
          setup:
            - "Empty database and a freshly started server whose logical clock has NEVER been set"
            - "ProgramYear 2026 configured, TDF2045 on the menu, Delta Fabrication (60 employees) registered, Rosa Lim created"
          setup_api_calls:
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
          trigger:
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-07-20", annual_compensation_cents: 9600000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { enr_id: "$.data.id" }
