            - "${err_state} == ERR_EVENT_STATE_FORBIDS_OPERATION with HTTP 409 — gate creation needs DRAFT"
            - "GET /gates?access_zone_id=${z1_id} has total_count == 1 returning ${g_id}, and GET /gates?event_id=${ev2_id} has total_count == 0"

      - name: void_endpoint_side_effect_sweep
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /tickets/{id}/void].side_effects
        excluded_because:
          difficulty_instance: ticket_void_cascade_reverses_listing_zone_and_settlement_pool
          rationale: |
            Every bullet of the void endpoint's side-effect list — listing suspension, zone
            and event counter decrements, the conditional refund out of the settlement pool
            and the audit row — is asserted there with before-and-after values.

      - name: credential_approval_side_effect_sweep
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /credential-requests/{id}/approve].side_effects
        excluded_because:
          difficulty_instance: credential_approval_cascade_freezes_zone_and_blocks_the_next_submit
          rationale: |
            The auto-issuance cascade, the forgone-revenue write, the recomputed zone posture
            and the knock-on refusal of the following submit are all covered by that
            instance's chain.

      - name: remediation_is_allowed_only_while_the_pool_can_fund_it
        claim_type: conditional_action
        grounds:
          - endpoints[POST /denied-entry-incidents/{id}/remediate].side_effects
          - validations[priority=36]
          - errors.ERR_SETTLEMENT_POOL_INSUFFICIENT
        excluded_because:
          difficulty_instance: settlement_pool_plus_patron_credits_is_conserved_by_remediation
          rationale: |
            That instance funds a remediation from the pool, checks the conservation identity
            across both ledgers and then exhausts the pool to show the same call refused, so
            the conditional-action claim is already exercised in both directions.
  # ===========================================================================
  # Table 6 — Errors (triggerability sweep over all 53 catalog codes)
  #
  # Coverage ledger for the codes NOT re-tested in this section:
  #   ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_NOT_TICKET_HOLDER  -> section rbac
  #   ERR_INVALID_REQUEST                                            -> section entities
  #     (access_zone_creation_missing_required_fire_code_capacity_returns_4XX,
  #      enum_and_range_constraints_rejected_on_ticket_and_credential_request)
  #   ERR_TICKET_NOT_FOUND       -> entities.ticket_read_with_an_unknown_id_returns_not_found
  #   ERR_ZONE_NOT_FOUND         -> endpoints.gate_links_to_a_zone_of_the_same_event_only
  #   ERR_CROSS_EVENT_REFERENCE  -> entities.ticket_creation_with_a_zone_from_another_event_is_rejected
  #                                 and endpoints.gate_links_to_a_zone_of_the_same_event_only
  #   ERR_EVENT_STATE_FORBIDS_OPERATION -> endpoints.gate_links_to_a_zone_of_the_same_event_only
  #   ERR_INVALID_STATE          -> state_machines (second close, decline-then-accept,
  #                                 reject-then-approve, skipped event stage)
  #   ERR_SESSION_NOT_OPEN       -> endpoints.offline_batch_is_best_effort_per_item_and_then_locks_the_session
  #   ERR_SEGREGATION_OF_DUTIES  -> validations.segregation_of_duties_blocks_the_requester_from_approving_the_request
  #   ERR_DUPLICATE_DEDUPE_KEY   -> validations.dedupe_key_uniqueness_is_scoped_to_one_scan_session
  #   ERR_COUNTERFEIT_BARCODE    -> validations.counterfeit_seed_is_adjudicated_before_the_epoch_and_device_checks
  #   ERR_MARKETPLACE_NOT_VERIFIED, ERR_TICKET_NOT_TRANSFERABLE
  #                              -> validations.unverified_channel_and_giveaway_tickets_cannot_be_listed_while_a_clean_listing_passes
  #   ERR_SELF_PURCHASE, ERR_RECIPIENT_NOT_VERIFIED (buyer leg)
  #                              -> validations.self_purchase_is_rejected_then_a_third_party_purchase_settles
  #   ERR_DUPLICATE_CODE         -> validations.zone_and_gate_codes_are_unique_per_event_but_reusable_across_events
  #   ERR_DUPLICATE_EMAIL        -> validations.patron_email_uniqueness_is_compared_case_insensitively
  #   ERR_STALE_TICKET_VERSION, ERR_STALE_GATE_VERSION, ERR_STALE_EVENT_VERSION
  #                              -> section cross-cutting complexity layers (one OCC test per §1.2.1 rule)
  # Everything else is either a real instance below or an explicit exclusion below.
  # ===========================================================================
  - section: errors
    instances:
      - name: every_path_collection_raises_its_own_not_found_code
        claim_type: triggerability
        grounds:
          - validations[priority=4]
          - errors.ERR_EVENT_NOT_FOUND
          - errors.ERR_ZONE_NOT_FOUND
          - errors.ERR_GATE_NOT_FOUND
          - errors.ERR_PATRON_NOT_FOUND
          - errors.ERR_TICKET_NOT_FOUND
          - errors.ERR_TRANSFER_NOT_FOUND
          - errors.ERR_LISTING_NOT_FOUND
          - errors.ERR_CREDENTIAL_REQUEST_NOT_FOUND
          - errors.ERR_SESSION_NOT_FOUND
          - errors.ERR_SCAN_EVENT_NOT_FOUND
          - errors.ERR_INCIDENT_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
        distinguishing_aspect: |
          Priority 4 is not one generic 404: each collection has its own code, so a single
          well-formed unknown UUID must produce twelve DIFFERENT error_ids depending only on
          which collection the path names. A stub that answers ERR_EVENT_NOT_FOUND everywhere,
          or that answers 422 because the id is not a stored key, fails this sweep.
        test_recipe:
          setup:
            - "Empty database; only the logical clock has been pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /events/00000000-0000-0000-0000-0000000000e1"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { e_event: $.data.error_id }
            - call: "GET /access-zones/00000000-0000-0000-0000-0000000000e2"
