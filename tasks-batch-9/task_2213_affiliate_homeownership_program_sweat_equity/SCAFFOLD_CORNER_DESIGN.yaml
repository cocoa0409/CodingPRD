            - "First FORBEARANCE: HTTP 200, lien_status == FORBEARANCE, forbearance_counseling_sessions == 1, status still CLOSED"
            - "First CURE: lien_status == ACTIVE, forbearance_counseling_sessions still 1 — curing does not give the counter back"
            - "Second FORBEARANCE: lien_status == FORBEARANCE, forbearance_counseling_sessions == 2"
            - "Second CURE: lien_status == ACTIVE, forbearance_counseling_sessions == 2"
            - "TRANSFER_NOTICE: lien_status == TRANSFER_PENDING and right_of_first_refusal_expires_on == 2026-09-04T12:00:00.000Z (effective_date plus 30 days)"
            - "RECAPTURE at 2026-09-05T12:00:00.000Z (strictly past the window): HTTP 200, lien_status == RECAPTURED, status still CLOSED"
            - "RECAPTURE arithmetic: months_elapsed == floor(31 / 30) == 1, so forgiven_amount_cents == 0 and lien_outstanding_cents == 1950000; shared_pct == 0.75 on appreciation of 16000000 - 15000000 == 1000000, i.e. 750000 cents of shared appreciation"
            - "Program after RECAPTURE: subsidy_disbursed_cents == 0, subsidy_committed_cents == 0, subsidy_pool_cents == 5750000 and subsidy_available_cents == 5750000 — the outstanding lien left the disbursed bucket and the 750000-cent appreciation share was added to the pool"
            - "households_served_count is still 1 — a recapture does not un-serve the household"

      - name: shift_completion_partner_credit_versus_no_show_fork
