  - section: calculations
    instances:
      - name: snap_estimate_covered_by_difficulty
        claim_type: correct_result
        grounds: ["calculations.snap_benefit_estimate"]
        excluded_because:
          difficulty_instance: snap_estimate_pinned_step_rounding
          rationale: "The §1.8 instance asserts the exact 19205-cent estimate and the rounding-order divergence."

      - name: screening_score_zero_gates_and_housing_ceiling
        claim_type: correct_result
        grounds: ["calculations.screening_score", "entities.BenefitsScreening.fields.result_band"]
        distinguishing_aspect: "Conditional branches dominate the weighted formula: CHILDCARE with dependents_under_18 == 0 scores exactly 0 regardless of other factors, and HOUSING with STABLE housing is ceiling-clamped to 39 — one point below the POSSIBLY_ELIGIBLE floor of 40 that the unclamped raw score (50) would have reached."
        test_recipe:
          setup:
            - "Two ACTIVE clients with VERIFIED assessments; one BENEFITS_COUNSELOR (both screenings auto-assign to them)"
            - "Client K: hh=2 income 100000 (ratio 0.5908), COST_BURDENED, food 3, dependents 0 -> CHILDCARE gate"
            - "Client L: hh=1 income 0 (ratio 0), STABLE, food 6, dependents 0 -> HOUSING ceiling case (raw 50 -> 39)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "B Be", email: "bene@hub.test", staff_role: "BENEFITS_COUNSELOR" }
              as: HubAdmin
              captures: { couns_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "k", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { ck_id: $.data.id, ck_v: $.data.version }
            - call: "POST /clients/${ck_id}/assessments"
              payload: { household_size: 2, monthly_income_cents: 100000, housing_status: "COST_BURDENED", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 3, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { ak_id: $.data.id }
            - call: "POST /clients/${ck_id}/assessments/${ak_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${ck_id}/assessments/${ak_id}/verify"
              payload: { expected_client_version: "${ck_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients"
              payload: { alias_name: "l", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /clients/${cl_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 0, housing_status: "STABLE", dependents_under_18: 0, receives_snap: true, receives_childcare_subsidy: false, food_insecurity_score: 6, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { al_id: $.data.id }
            - call: "POST /clients/${cl_id}/assessments/${al_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${cl_id}/assessments/${al_id}/verify"
              payload: { expected_client_version: "${cl_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${ck_id}/screenings"
              payload: { program: "CHILDCARE" }
              as: BenefitsCounselor
              as_user_id: "${couns_id}"
              captures: { sk_id: $.data.id }
            - call: "POST /clients/${cl_id}/screenings"
              payload: { program: "HOUSING" }
              as: BenefitsCounselor
              as_user_id: "${couns_id}"
              captures: { sl_id: $.data.id }
          trigger:
            - call: "POST /screenings/${sk_id}/score"
              payload: {}
              as: BenefitsCounselor
              as_user_id: "${couns_id}"
              captures: { k_score: $.data.score, k_band: $.data.result_band }
            - call: "POST /screenings/${sl_id}/score"
              payload: {}
              as: BenefitsCounselor
              as_user_id: "${couns_id}"
              captures: { l_score: $.data.score, l_band: $.data.result_band }
          assert:
            - "client K CHILDCARE: score == 0 and result_band == NOT_ELIGIBLE (dependents gate zeroes the whole formula)"
            - "client L HOUSING: score == 39 (raw 50 clamped by the STABLE ceiling) and result_band == NOT_ELIGIBLE — exactly 1 point below POSSIBLY_ELIGIBLE"

