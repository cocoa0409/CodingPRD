            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "TRANSACTIONAL", description: "Alerts", sample_messages: ["Alert"], help_message: "HELP", stop_message: "STOP", path_kind: "TOLL_FREE" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/approve"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/numbers"
              payload: { phone_number: "+18005551234", number_type: "TOLL_FREE", country_code: "US" }
              as: NumberProvisioner
              captures: { num: $.data.id }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/activate"
              payload: {}
