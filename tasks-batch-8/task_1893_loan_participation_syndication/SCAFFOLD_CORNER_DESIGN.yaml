          assert:
            - "with headers stripped by the harness: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, HTTP 400"

      - name: unknown_draw_id_returns_not_found
        claim_type: not_found
        grounds: ['validations[priority=4]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /api/draws/{unknown-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
