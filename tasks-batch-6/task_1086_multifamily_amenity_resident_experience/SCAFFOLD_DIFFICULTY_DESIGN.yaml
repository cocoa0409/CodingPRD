              as: PropertyManager
              as_user_id: "pm_triage"
            - call: "POST /service-requests/${sr1_id}/assign"
              payload: { vendor_id: "${vendor_id}", estimated_hours: 1 }
              as: PropertyManager
              as_user_id: "pm_assign"
            - call: "POST /service-requests"
              payload: { unit_id: "${unit_id}", resident_id: "${resident_id}", trade: "PLUMBING", description: "Clog" }
              as: PropertyManager
              captures: { sr2_id: $.data.id }
            - call: "POST /service-requests/${sr2_id}/triage"
              payload: {}
              as: PropertyManager
              as_user_id: "pm_triage"
          trigger:
            - call: "POST /service-requests/${sr2_id}/assign"
              payload: { vendor_id: "${vendor_id}", estimated_hours: 1 }
              as: PropertyManager
              as_user_id: "pm_assign"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VENDOR_TRADE_MISMATCH"

  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_cancel_at_exactly_24h_no_penalty
        grounds:
          - calculations.late_cancel_penalty
          - state_machines.AmenityBooking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          At exactly LATE_CANCEL_WINDOW_HOURS (24h) before start, hours_before_start >= 24 is true, so penalty is 0;
          one second later it would be round(deposit*0.5). Metric = hours-before-start on the cancel endpoint.
        test_recipe:
          setup:
            - "STANDARD resident; GYM deposit 10000, capacity 1, open all day. clock 2026-06-01 00:00; booking 2026-06-02 00:00-02:00 (exactly 24h out)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Fir", address: "6 Fir St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "601", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Ivy", email: "ivy@x.com", membership_tier: "STANDARD" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Gym", amenity_type: "GYM", capacity: 1, base_rate_cents_per_hour: 4000, deposit_cents: 10000, buffer_minutes: 0, open_minute: 0, close_minute: 1440 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-02T00:00:00Z", end_at: "2026-06-02T02:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /amenity-bookings/${booking_id}/cancel"
              payload: {}
              as: Resident
              as_user_id: "${resident_id}"
          assert:
            - "AmenityBooking.${booking_id}.status == CANCELLED"
            - "Resident.${resident_id}.rent_balance_cents == 0"
            - "Resident.${resident_id}.hold_balance_cents == 0"

      - name: event_register_at_capacity_waitlists
        grounds:
          - calculations.event_capacity_allocation
          - state_machines.EventRegistration.CREATE_to_WAITLISTED
          - entities.CommunityEvent.fields.reserved_count
        distinguishing_aspect: |
          Registration compares reserved_count < capacity strictly; the registration made when reserved_count == capacity (1)
          becomes WAITLISTED with fee_charged_cents 0. Metric = count boundary on the register endpoint.
        test_recipe:
          setup:
            - "Published event capacity 1 fee 500; resident A already RESERVED so reserved_count == 1; resident B registers."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Fir", address: "6 Fir St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "602", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_a_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "603", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_b_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_a_id}", full_name: "Jo", email: "jo@x.com" }
              as: PropertyManager
              captures: { res_a_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_b_id}", full_name: "Kai", email: "kai@x.com" }
              as: PropertyManager
              captures: { res_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /events"
              payload: { property_id: "${prop_id}", title: "Yoga", start_at: "2026-06-20T09:00:00Z", end_at: "2026-06-20T10:00:00Z", capacity: 1, fee_cents: 500 }
              as: PropertyManager
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/publish"
              payload: {}
              as: PropertyManager
            - call: "POST /events/${event_id}/register"
              payload: { resident_id: "${res_a_id}" }
              as: Resident
              as_user_id: "${res_a_id}"
              captures: { reg_a_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/register"
              payload: { resident_id: "${res_b_id}" }
              as: Resident
              as_user_id: "${res_b_id}"
              captures: { reg_b_id: $.data.id }
          assert:
            - "EventRegistration.${reg_b_id}.status == WAITLISTED"
            - "EventRegistration.${reg_b_id}.fee_charged_cents == 0"
            - "CommunityEvent.${event_id}.reserved_count == 1"
            - "CommunityEvent.${event_id}.waitlist_count == 1"

