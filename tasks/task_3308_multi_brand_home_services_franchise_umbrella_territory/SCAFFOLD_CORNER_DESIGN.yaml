        grounds:
          - errors.ERR_DUPLICATE_AGREEMENT_NUMBER
          - validations[priority=9]
          - entities.FranchiseAgreement.fields.agreement_number
        distinguishing_aspect: "agreement_number is franchisor-unique, so a second create with the same number is refused at priority 9 with 409 ERR_DUPLICATE_AGREEMENT_NUMBER rather than being accepted against a different territory."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Brand MS exists with two DEFINED territories MS-01 and MS-02 and one franchisee."
          setup_api_calls:
            - *k_clock
            - *k_fr
            - *k_brand_ms
            - *k_ter_ms
            - call: "POST /franchise/territories"
              payload: { territory_code: "MS-02", brand_id: "${ms_brand_id}", household_count: 15000, postal_codes: ["75003"], expansion_right_households: 20000, protected: true, franchisee_id: "${fr_id}" }
              as: FranchiseAdmin
              captures: { ter_two_id: $.data.id }
            - *k_agt
          trigger:
            - call: "POST /franchise/agreements"
              payload: { agreement_number: "A-MS-01", franchisee_id: "${fr_id}", brand_id: "${ms_brand_id}", territory_id: "${ter_two_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "JOURNEYMAN" }
              as: FranchiseAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_AGREEMENT_NUMBER"
            - "GET /franchise/agreements?territory_id=${ter_two_id} returns 0 rows"
            - "GET /franchise/agreements?agreement_number=A-MS-01 is not filterable, but GET /franchise/agreements?brand_id=${ms_brand_id} returns exactly 1 row"

