      - name: role_cannot_invoke_another_roles_exclusive_operation
        claim_type: role_cannot_do_others_exclusive
        grounds:
          - roles.BoardReviewer.exclusive_operations
          - roles.BoardLicensingOfficer.exclusive_operations
          - errors.ERR_UNAUTHORIZED
          - validations[priority=2]
        distinguishing_aspect: "Authorization is per-endpoint rather than board-versus-public: an Applicant is refused the reviewer's education evaluation AND a BoardReviewer is refused the licensing officer's licence creation, both with 403 ERR_UNAUTHORIZED and no state change."
