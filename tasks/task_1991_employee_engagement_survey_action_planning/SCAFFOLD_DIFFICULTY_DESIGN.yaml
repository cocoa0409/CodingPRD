  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: partial_then_full_submit_conserves_invite_totals
        grounds:
          - calculations.response_rate
          - state_machines.SurveyInvite.PARTIAL_to_SUBMITTED
        distinguishing_aspect: |
          Conserved quantity: invited_count == submitted_count + partial_count
          + expired_count + unanswered_count (INVITED/REMINDED). The forward
          action (submit-partial) followed by the compensating action (full
          submit on the same invite) must leave submitted_count +
          partial_count exactly 1 across the pair — no double count, no leak.
        test_recipe:
          setup:
            - "OPEN census cycle; Unit P with 1 ACTIVE employee"
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Invariant Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { iv_bank: $.data.id }
