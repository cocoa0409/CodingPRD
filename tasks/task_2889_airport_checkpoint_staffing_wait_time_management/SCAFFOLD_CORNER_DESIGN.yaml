          trigger:
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: SupervisoryOfficer
              as_user_id: "${nosup_id}"
              expect_status: 403
              captures: { sc_open_error: $.data.error_id }
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: CheckpointManager
              captures: { sc_open_state: $.data.lane_state }
            - call: "POST /screening-referrals"
              payload: { lane_id: "${lane_id}", referral_reason: "RANDOM", passenger_category: "MEDICAL_DEVICE", requires_private_screening: true }
              as: SupervisoryOfficer
              as_user_id: "${nosup_id}"
              captures: { sc_ref_id: $.data.id, sc_ref_private: $.data.requires_private_screening }
            - call: "POST /screening-referrals/${sc_ref_id}/begin"
              payload: { resolving_officer_id: "${nosup_id}" }
              as: SupervisoryOfficer
              as_user_id: "${nosup_id}"
              expect_status: 403
              captures: { sc_begin_error: $.data.error_id }
            - call: "POST /screening-referrals/${sc_ref_id}/begin"
              payload: { resolving_officer_id: "${sup_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { sc_begin_state: $.data.state }
            - call: "POST /screening-referrals/${sc_ref_id}/resolve"
