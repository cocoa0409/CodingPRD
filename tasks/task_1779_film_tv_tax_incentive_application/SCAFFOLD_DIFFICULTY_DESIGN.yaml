      - name: transfer_negotiation_counter_loop
        grounds:
          - state_machines.CreditTransfer.PROPOSED_to_COUNTERED
          - state_machines.CreditTransfer.COUNTERED_to_PROPOSED
          - state_machines.CreditTransfer.COUNTERED_to_ACCEPTED
          - state_machines.CreditTransfer.ACCEPTED_to_SETTLED
        distinguishing_aspect: |
          CreditTransfer runs a negotiation CYCLE with alternating actors:
          PROPOSED -(buyer counters)-> COUNTERED -(seller counter-counters)->
          PROPOSED -(buyer counters)-> COUNTERED -(seller accepts)-> ACCEPTED
          -> SETTLED; round_count reaches 3 and settlement debits the
          certificate by the FACE amount (10000000) while the agreed cash
          price is the last counter (9200000). Non-linear machine on a
          different entity than the application loop.
