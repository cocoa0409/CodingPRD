      - name: zone_economics_with_no_deliveries_reports_null_unit_costs
        claim_type: projection
        grounds:
          - "calculations.zone_cost_per_delivery"
          - "endpoints[GET /service-zones/{zone_id}/economics]"
          - "entities.ServiceZone.fields.remedy_spent_cents"
        distinguishing_aspect: >-
          The economics projection has to survive an empty numerator and an empty denominator at once: with
          one non-RETIRED robot and no terminal missions the capacity is still 1 * 600 == 600 minutes, so
          utilization_pct is 0.0 and allocated_overhead_cents is the 40000 base plus 150 * floor(0.0) == 0,
          while cost_per_delivery_cents and contribution_per_delivery_cents are null rather than 0 because
          delivered_count is 0, and throughput_per_robot_hour is 0.00 at two decimals.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with one APPROVED segment and remedy_spent_cents 0"
            - "exactly one Robot R1 with duty_state AVAILABLE, so fleet_capacity_minutes is 600"
            - "no DeliveryMission and no DeliveryOrder rows exist in the zone"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 2.0, sightline_m: 40.0, pedestrian_flow_per_min: 5.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "STAGE" }
              as: FleetDispatcher
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "MAKE_AVAILABLE" }
              as: FleetDispatcher
          trigger:
            - call: "GET /service-zones/${z}/economics"
              as: FleetDispatcher
          assert:
            - "the response is 200 with response data.zone_id == ${z}"
            - "response data.robot_active_minutes == 0"
            - "response data.fleet_capacity_minutes == 600"
            - "response data.utilization_pct == 0.0"
            - "response data.allocated_overhead_cents == 40000"
            - "response data.variable_cost_cents == 0"
            - "response data.delivered_count == 0"
            - "response data.cost_per_delivery_cents == null"
            - "response data.contribution_per_delivery_cents == null"
            - "response data.throughput_per_robot_hour == 0.00"
      - name: quote_and_settlement_read_different_input_sets
        claim_type: variant_divergence
        grounds:
          - "calculations.delivery_fee"
          - "entities.DeliveryOrder.fields.quoted_fee_cents"
          - "entities.DeliveryOrder.fields.settled_fee_cents"
        excluded_because:
          difficulty_instance: delivery_fee_quote_vs_settlement_diverges
          rationale: "that instance pins both variants on one order (850 against 817) and the resulting settlement_variance_cents, which is the entire divergence claim for this calculation."
      - name: crossing_risk_composes_tier_cap_and_hinge_terms
        claim_type: weighted_scoring
        grounds:
          - "calculations.crossing_risk_score"
          - "entities.SidewalkSegment.fields.crossing_risk_score"
        excluded_because:
          difficulty_instance: crossing_risk_score_tiered_plus_capped_plus_hinge
          rationale: "that instance already exercises the sightline tier, the flow cap, the control adjustment, the grade hinge, the ramp credit and the clamp floor in one fixture."
      - name: remedy_buckets_round_before_they_are_summed
        claim_type: precision
        grounds:
          - "calculations.customer_remedy_amount"
          - "entities.DeliveryOrder.fields.remedy_amount_cents"
        excluded_because:
          difficulty_instance: remedy_waterfall_rounds_each_bucket_before_summing
          rationale: "that instance is built on the one input where per-bucket and post-sum rounding differ (5936 against 5937), so a separate precision test cannot add signal."
      - name: utilization_is_rounded_before_overhead_reads_it
        claim_type: constraint_propagation
        grounds:
          - "calculations.zone_cost_per_delivery"
          - "entities.DeliveryMission.fields.active_minutes"
        excluded_because:
          difficulty_instance: zone_economics_pipeline_consumes_rounded_utilization
          rationale: "that instance walks all eight steps of the pipeline with a populated zone and asserts every intermediate, including the rounded value step 4 consumes."
      - name: rolling_autonomy_index_decays_by_recency
        claim_type: decay_function
        grounds:
          - "calculations.robot_autonomy_index"
          - "entities.Robot.fields.rolling_autonomy_index"
        excluded_because:
          difficulty_instance: autonomy_index_rolling_vs_lifetime_diverges
          rationale: "the 0.85 ** i decay is only observable against the undecayed lifetime variant, which is exactly what that instance contrasts on a two-mission history."
      - name: terminal_missions_are_weighted_in_completion_order
        claim_type: chronological
        grounds:
          - "calculations.robot_autonomy_index"
          - "entities.DeliveryMission.fields.completed_at_utc"
        excluded_because:
          difficulty_instance: autonomy_index_rolling_vs_lifetime_diverges
          rationale: "that instance advances the clock between the two completions precisely so the DESC ordering of the rolling window is falsifiable, so the chronological claim is covered."
      - name: merchant_ledger_reconciles_to_the_sum_of_quotes
        claim_type: reconciliation
        grounds:
          - "calculations.merchant_fee_ledger"
          - "entities.Merchant.fields.settlement_variance_cents"
        excluded_because:
          difficulty_instance: merchant_fee_buckets_conserved_across_cancel
          rationale: "that instance asserts the three-bucket identity against the 1662-cent sum of quotes at every step of a cancel-plus-delivery sequence."
  - section: validations
    instances:
      - name: robot_registration_over_the_ordinance_speed_is_refused
        claim_type: violation_to_error
        grounds:
          - "validations[priority=67]"
          - "errors.ERR_ORDINANCE_SPEED_EXCEEDED"
          - "entities.ServiceZone.fields.ordinance_max_speed_cm_s"
          - "entities.Robot.fields.max_speed_cm_s"
        distinguishing_aspect: >-
          The ordinance speed rule compares a robot field with a zone field, so it is a business rule at
          priority 67 rather than a range check: 200 cm/s is refused with 422
          ERR_ORDINANCE_SPEED_EXCEEDED, exactly 160 cm/s is admitted because the comparison is inclusive,
          and 161 cm/s is refused again.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with ordinance_max_speed_cm_s 160"
            - "no Robot rows exist yet"
            - "all three payloads below are otherwise identical and well formed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          trigger:
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-FAST", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 200 }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-EDGE", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 160 }
              as: PlatformAdmin
              captures: { redge: $.data.id }
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-OVER", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 161 }
              as: PlatformAdmin
          assert:
            - "the 200 cm/s create returns 422 with error_id ERR_ORDINANCE_SPEED_EXCEEDED"
            - "the 160 cm/s create returns 201 and Robot.${redge}.max_speed_cm_s == 160"
            - "the 161 cm/s create returns 422 with error_id ERR_ORDINANCE_SPEED_EXCEEDED"
            - "GET /robots?zone_id=${z} reports total_count == 1"
            - "Robot.${redge}.duty_state == OFFLINE"
      - name: route_plan_must_finish_inside_the_operating_window
        claim_type: temporal_validation
        grounds:
          - "validations[priority=68]"
          - "errors.ERR_CURFEW_WINDOW_VIOLATION"
          - "calculations.route_plan_geometry"
          - "entities.ServiceZone.fields.operating_window_end_utc_hhmm"
        distinguishing_aspect: >-
          The curfew rule is evaluated against the planned duration rather than against the current instant,
          so a 9-minute plan created at 20:55 would finish at 21:04 and is refused with 422
          ERR_CURFEW_WINDOW_VIOLATION, while the identical plan created at 20:51 finishes at exactly 21:00
          and is accepted because the containment check is inclusive at both ends.
        test_recipe:
          setup:
            - "ServiceZone Z1 PERMITTED with operating_window 0700..2100 and segments S1, S2, S3, S5 APPROVED"
            - "Merchant M1 ACTIVE PREFERRED; order O1 created at 09:00 and LOADED on a mission with Robot R1 (max_speed_cm_s 150)"
            - "the plan [S1, S2, S3, S5] is 774.0 m long, so planned_duration_min is 9"
            - "the mission version captured from the load response is still current, because a rejected plan create writes nothing"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 3.0, sightline_m: 40.0, pedestrian_flow_per_min: 6.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S2", segment_type: "CROSSING", crossing_control: "SIGNALIZED", length_m: 14.0, measured_clearance_cm: 150.0, surface_grade_pct: 1.5, sightline_m: 35.0, pedestrian_flow_per_min: 10.0, curb_ramp_present: true, connected_segment_ids: ["${s1}"] }
              as: PlatformAdmin
              captures: { s2: $.data.id }
