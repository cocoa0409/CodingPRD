  - section: endpoints
    instances:
      - name: logical_clock_startup_default_is_2026_08_01
        claim_type: action_endpoint
        grounds: ["endpoints.POST./_clock/set_current_utc", "calculations.report_cadence_schedule", "entities.StatusReport.fields.period_start"]
        distinguishing_aspect: "With no prior call to POST /_clock/set_current_utc the server clock reads exactly 2026-08-01T00:00:00Z, so the StatusReport minted by the first classification has period_start 2026-08-01T00:00:00.000Z and due_at 2026-08-08T00:00:00.000Z; a subsequent set call echoes the new instant."
        test_recipe:
          setup:
            - "Fresh server; the logical clock has never been set."
            - "FDA Recall classified CLASS_I."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
