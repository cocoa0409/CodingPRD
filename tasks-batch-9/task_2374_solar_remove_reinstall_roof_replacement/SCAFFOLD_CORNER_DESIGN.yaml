            - "ReroofProject.${p1}.deenergized_at == 2026-08-01T00:00:00Z"

      - name: corner_reschedule_is_only_available_on_a_weather_aborted_window
        claim_type: conditional_action
        grounds:
          - endpoints["POST /reroof/work-windows/{id}/reschedule"]
          - state_machines.WorkWindow.transitions["WEATHER_ABORTED -> SUPERSEDED"]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Reschedule is gated on the window already having been weather-aborted: the identical request is a 409 while the window is SCHEDULED and a 201 one call later, and the successful reschedule creates a second row rather than mutating the first - the aborted window becomes SUPERSEDED and keeps its abort_reason, while the replacement is SCHEDULED with supersedes_window_id pointing back at it and a fresh weather_risk_score."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, well before every window."
            - "One authorized HOST_OWNED project with a single SCHEDULED roofing window on 2026-08-10, weather_risk_score 70."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /reroof/work-windows"
              payload: { project_id: "${p1}", party_id: "${roofer_id}", trade: "ROOFING", start_utc: "2026-08-10T14:00:00Z", end_utc: "2026-08-10T22:00:00Z", weather_risk_score: 70 }
              as: ProjectCoordinator
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /reroof/work-windows/${w1}/reschedule"
              payload: { start_utc: "2026-08-12T14:00:00Z", end_utc: "2026-08-12T22:00:00Z" }
              as: ProjectCoordinator
              captures: { e_state: $.data.error_id }
            - call: "POST /reroof/work-windows/${w1}/status"
              payload: { action: "WEATHER_ABORT", abort_reason: "monsoon cell, 60 mph gusts forecast" }
              as: ProjectCoordinator
            - call: "POST /reroof/work-windows/${w1}/reschedule"
              payload: { start_utc: "2026-08-12T14:00:00Z", end_utc: "2026-08-12T22:00:00Z", weather_risk_score: 15 }
              as: ProjectCoordinator
              captures: { w2: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 409 and ${e_state} == ERR_INVALID_STATE"
            - "trigger call 3 returns HTTP 201"
            - "WorkWindow.${w1}.status == SUPERSEDED"
            - "WorkWindow.${w1}.abort_reason == monsoon cell, 60 mph gusts forecast"
            - "WorkWindow.${w1}.actual_end_utc == 2026-08-01T00:00:00Z"
            - "WorkWindow.${w1}.supersedes_window_id == null"
            - "WorkWindow.${w2}.status == SCHEDULED"
            - "WorkWindow.${w2}.supersedes_window_id == ${w1}"
            - "WorkWindow.${w2}.start_utc == 2026-08-12T14:00:00Z"
            - "WorkWindow.${w2}.weather_risk_score == 15"
            - "WorkWindow.${w2}.party_id == ${roofer_id}"
            - "WorkWindow.${w2}.trade == ROOFING"
            - "GET /reroof/work-windows?supersedes_window_id=${w1} returns exactly 1 row with id == ${w2}"
            - "ReroofProject.${p1}.weather_abort_count == 1"
            - "ReroofProject.${p1}.posture == OPEN (one abort is below the threshold of 2)"

  - section: errors
    instances:
      - name: corner_missing_or_unknown_role_headers_are_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 sits above everything, so a header problem answers 401 even when the rest of the request is nonsense: an unknown role string is a 401 rather than the 403 a real-but-wrong role would earn, and an entity-backed role with no X-User-ID is a 401 rather than a 404 on the missing party."
        test_recipe:
          setup:
            - "No authentication headers are sent except where stated. One Party exists so that the last call's only defect is the missing X-User-ID header."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
          trigger:
            - call: "GET /reroof/parties"
              as: "(no X-User-Role and no X-User-ID header sent at all)"
              captures: { e_none: $.data.error_id }
            - call: "POST /reroof/parties"
              payload: { name: "Ghost Roofing", party_type: "ROOFER", contact_email: "ghost@example.com" }
              as: "(X-User-Role: Architect - a role string that is not one of the six declared roles)"
              captures: { e_unknown: $.data.error_id }
            - call: "GET /reroof/parties"
              as: "(X-User-Role: SolarContractor with no X-User-ID header)"
              captures: { e_no_user: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 401"
            - "${e_none} == ERR_UNAUTHENTICATED"
            - "${e_unknown} == ERR_UNAUTHENTICATED"
            - "${e_no_user} == ERR_UNAUTHENTICATED"
            - "the error envelope carries only error_id and message, with data == null"
            - "GET /reroof/parties as ProjectCoordinator still returns exactly 1 row, so the refused POST persisted nothing"

