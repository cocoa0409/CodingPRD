          - "errors[ERR_DRILL_NOT_ELIGIBLE]"
        distinguishing_aspect: "Requesting DELINQUENCY drilling on an ACTIVE (not DELINQUENT) rental → ERR_DRILL_NOT_ELIGIBLE."
