              as: StoreAssociate
              captures: { nf_err: $.data.error_id }
          assert:
            - "the call returns error_id == ERR_NOT_FOUND"
            - "GET /stores/fusion-orders?store_id=${st218} returns zero orders"
            - "Store.${st218}.bin_engine_mass_grams == 600"

      - name: priority_ordering_placeholder_covered_by_difficulty_design
        claim_type: Priority Ordering
        grounds: ["validations[priority=7]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: store_posture_gate_beats_member_ceiling_gate_on_a_join
