# §1.9 Scaffold Corner Design (Breadth Audit of §1.5)
# Companion to SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8, the depth probe).
# Walked row-by-row against references/claim-extraction-guide.md's nine sections.
# Corners already asserted by a §1.8 instance appear as `excluded_because:` stubs
# citing that instance by name; every other row is a full instance whose
# setup_api_calls chain is executable from an empty DB using only §1.5 endpoints.
#
# Shared fixture vocabulary (identical to §1.8 so fixtures can be shared):
#   Program BSCS: total_credits_required 120, residency_min_credits 30,
#     pla_max_credits 30, pla_max_pct_bp 2500 -> effective_pla_cap_credits 30.
#   Program BSIT: pla_max_credits 45, pla_max_pct_bp 2500, total 120
#     -> effective_pla_cap_credits min(45, floor(120*2500/10000)=30) = 30,
#     i.e. the percentage arm binds and the flat arm does not.
#   Course CS150: 6 credits, LOWER, dept CS, outcomes OC1 weight_bp 8000 and
#     OC2 weight_bp 2000, both mastery_threshold_bp 7000.
#   Logical clock starts at 2026-08-01T00:00:00Z and moves only via
#     POST /_clock/set_current_utc.

scaffold_corner_design:

  # =====================================================================
  # 1. ENTITIES
  # =====================================================================
  - section: entities
    instances:
      - name: program_creation_computes_effective_pla_cap_from_the_binding_arm
        claim_type: creation
        grounds:
          - entities.Program
          - entities.Program.fields.effective_pla_cap_credits
          - calculations.program_pla_credit_capacity
          - endpoints[POST /programs]
        distinguishing_aspect: |
          POST /programs with every required field returns 201 and the response
          already carries the computed effective_pla_cap_credits 30 — min(45,
          floor(120*2500/10000)=30) — proving the percentage arm binds over the
          flat pla_max_credits 45, plus status ACTIVE and version 1 by default.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlaCoordinator
          trigger:
            - call: "POST /programs"
              payload: { program_code: "BSIT", title: "BS Information Technology", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 45, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"] }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id", prog_cap: "$.data.effective_pla_cap_credits" }
          assert:
            - "HTTP status == 201"
            - "Program.${prog_id}.program_code == BSIT"
            - "Program.${prog_id}.total_credits_required == 120"
            - "Program.${prog_id}.pla_max_credits == 45"
            - "Program.${prog_id}.pla_max_pct_bp == 2500"
            - "Program.${prog_id}.effective_pla_cap_credits == 30"
            - "Program.${prog_id}.status == ACTIVE"
            - "Program.${prog_id}.pla_pass_threshold_bp == null"
            - "Program.${prog_id}.version == 1"
            - "Program.${prog_id}.id is a non-empty string and created_at == 2026-08-01T00:00:00Z"

      - name: course_retrieval_returns_stored_data_and_outcome_count
        claim_type: retrieval
        grounds:
          - entities.Course
          - entities.Course.fields.outcome_count
          - entities.LearningOutcome
          - endpoints[POST /courses]
          - endpoints[GET /courses/{course_id}]
          - endpoints[GET /learning-outcomes]
        distinguishing_aspect: |
          GET /courses/{course_id} returns exactly the stored row — course_code
          CS150, credits 6, level LOWER, pla_eligible true — and outcome_count 2,
          which was never supplied by the client but derived from the two inline
          learning_outcomes, each readable through GET /learning-outcomes with
          course_id set to the parent and weight_bp summing to 10000.
        test_recipe:
          setup:
            - "Course CS150 created with two inline learning outcomes OC1 (8000 bp) and OC2 (2000 bp)."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
          trigger:
            - call: "GET /courses/${course_id}"
              as: PlaCoordinator
              captures: { got_count: "$.data.outcome_count" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc1_weight: "$.data[0].weight_bp", oc2_weight: "$.data[1].weight_bp" }
          assert:
            - "HTTP status == 200"
            - "Course.${course_id}.course_code == CS150"
            - "Course.${course_id}.credits == 6"
            - "Course.${course_id}.level == LOWER"
            - "Course.${course_id}.pla_eligible == true"
            - "Course.${course_id}.outcome_count == 2"
            - "GET /learning-outcomes?course_id=${course_id} returns response_type array with exactly 2 elements"
            - "LearningOutcome.${oc1_id}.course_id == ${course_id}"
            - "LearningOutcome.${oc1_id}.outcome_code == OC1"
            - "LearningOutcome.${oc1_id}.weight_bp == 8000"
            - "LearningOutcome.${oc1_id}.mastery_threshold_bp == 7000"
            - "the two returned weight_bp values sum to exactly 10000"

      - name: pla_claims_listing_paginates_in_created_at_then_claim_number_order
        claim_type: listing
        grounds:
          - entities.PlaClaim.fields.claim_number
          - endpoints[GET /pla-claims]
          - calculations.cap_unblock_waterfall
        distinguishing_aspect: |
          Three DRAFT claims for one student return in created_at ASC then
          claim_number ASC order — claim_number 1, 2, 3 — and limit=2 yields
          total_count 3 with has_more true, while offset=2 yields the single
          claim_number 3 row with has_more false; id order is never consulted.
        test_recipe:
          setup:
            - "Program BSCS and Student S-1001 MATRICULATED."
            - "Three PLA-eligible 3-credit courses CS150, CS160 and CS170 (one claim per course, so the duplicate-claim rule at priority 30 never fires)."
            - "Three PORTFOLIO claims created in that order, left in DRAFT."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 3, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c1_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS160", title: "Data Structures", department_code: "CS", credits: 3, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Choose a structure", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c2_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS170", title: "Systems", department_code: "CS", credits: 3, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Explain a kernel", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c3_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c1_id}", source_type: "PORTFOLIO", credits_requested: 3 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c2_id}", source_type: "PORTFOLIO", credits_requested: 3 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { k2_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c3_id}", source_type: "PORTFOLIO", credits_requested: 3 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { k3_id: "$.data.id" }
          trigger:
            - call: "GET /pla-claims?student_id=${stu_id}&limit=2&offset=0"
              as: PlaCoordinator
              captures: { p1_first: "$.data[0].claim_number", p1_second: "$.data[1].claim_number" }
            - call: "GET /pla-claims?student_id=${stu_id}&limit=2&offset=2"
              as: PlaCoordinator
              captures: { p2_first: "$.data[0].claim_number" }
          assert:
            - "PlaClaim.${k1_id}.claim_number == 1"
            - "PlaClaim.${k2_id}.claim_number == 2"
            - "PlaClaim.${k3_id}.claim_number == 3"
            - "page 1 response_type == array with exactly 2 elements, meta pagination total_count == 3 and has_more == true"
            - "page 1 element order is [${k1_id}, ${k2_id}] — created_at ASC then claim_number ASC"
            - "page 2 response_type == array with exactly 1 element, total_count == 3 and has_more == false"
            - "page 2 element is ${k3_id} with claim_number == 3"

      - name: student_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority 6]
          - errors[ERR_STUDENT_NOT_FOUND]
          - endpoints[GET /students/{student_id}]
        distinguishing_aspect: |
          GET /students/{student_id} for a well-formed but unknown UUID returns
          HTTP 404 with error_id ERR_STUDENT_NOT_FOUND, not an empty 200 body and
          not ERR_INVALID_REQUEST — path existence (priority 6) is checked before
          any body validation.
        test_recipe:
          setup:
            - "Empty database — no Student rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "GET /students/00000000-0000-0000-0000-000000000000"
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response_type == error"
            - "error_id == ERR_STUDENT_NOT_FOUND"
            - "no Student row was created as a side effect"

      - name: program_missing_required_residency_min_credits_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority 8]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /programs]
          - entities.Program.fields.residency_min_credits
        distinguishing_aspect: |
          residency_min_credits has source input and no default, so omitting it
          from POST /programs returns HTTP 400 ERR_INVALID_REQUEST and creates no
          Program row — the field is not silently defaulted to 0.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlaCoordinator
          trigger:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["PORTFOLIO"] }
              as: PlaCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /programs/{any id} finds no program with program_code BSCS — zero rows were persisted"

      - name: pla_claim_defaults_applied_when_optional_input_omitted
        claim_type: defaults
        grounds:
          - entities.PlaClaim.fields.rush_requested
          - entities.PlaClaim.fields.priority_tier
          - entities.PlaClaim.fields.assessment_status
          - entities.PlaClaim.fields.fee_status
          - entities.PlaClaim.fields.credit_status
          - endpoints[POST /pla-claims]
        distinguishing_aspect: |
          A POST /pla-claims body carrying only student_id, course_id,
          source_type and credits_requested yields rush_requested false,
          priority_tier STANDARD, assessment_status DRAFT, fee_status UNBILLED,
          credit_status NOT_POSTED, revision_round 0, sla_breach_count 0,
          appeal_count 0 and null credits_awarded / attempt_date /
          articulation_rule_id — nine declared defaults in one response.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150 (6 credits, LOWER), Student S-1001 MATRICULATED."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
          trigger:
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id", tier: "$.data.priority_tier" }
          assert:
            - "HTTP status == 201"
            - "PlaClaim.${claim_id}.rush_requested == false"
            - "PlaClaim.${claim_id}.priority_tier == STANDARD"
            - "PlaClaim.${claim_id}.assessment_status == DRAFT"
            - "PlaClaim.${claim_id}.fee_status == UNBILLED"
            - "PlaClaim.${claim_id}.credit_status == NOT_POSTED"
            - "PlaClaim.${claim_id}.revision_round == 0"
            - "PlaClaim.${claim_id}.sla_breach_count == 0"
            - "PlaClaim.${claim_id}.appeal_count == 0"
            - "PlaClaim.${claim_id}.credits_awarded == null"
            - "PlaClaim.${claim_id}.attempt_date == null"
            - "PlaClaim.${claim_id}.articulation_rule_id == null"
            - "PlaClaim.${claim_id}.hold_reason == null"

      - name: portfolio_artifact_count_is_computed_and_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Portfolio.fields.artifact_count
          - entities.Portfolio.fields.provisional_coverage_bp
          - endpoints[POST /portfolios]
          - endpoints[POST /portfolios/{portfolio_id}/artifacts]
        distinguishing_aspect: |
          POST /portfolios that smuggles artifact_count 7 and status SUBMITTED into
          the body still returns artifact_count 0 and status DRAFT, and after one
          artifact is attached artifact_count is 1 — the counter tracks Artifact
          rows, never the client's assertion.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150 with OC1 8000 bp and OC2 2000 bp, Student S-1001."
            - "One DRAFT PORTFOLIO claim for CS150."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
          trigger:
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Eight years of production Python", artifact_count: 7, status: "SUBMITTED", provisional_coverage_bp: 10000 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id", pf_count: "$.data.artifact_count" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Billing service", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
          assert:
            - "Portfolio.${pf_id}.artifact_count == 0 immediately after creation, NOT 7"
            - "Portfolio.${pf_id}.status == DRAFT, NOT SUBMITTED"
            - "Portfolio.${pf_id}.provisional_coverage_bp == null immediately after creation, NOT 10000"
            - "Portfolio.${pf_id}.revision_round == 0"
            - "after the artifact call, Portfolio.${pf_id}.artifact_count == 1"
            - "GET /artifacts?portfolio_id=${pf_id} returns exactly 1 element"

      - name: student_system_fields_are_server_generated_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Student
          - entities.Student.fields.pla_credits_reserved
          - entities.Student.fields.pla_credits_posted
          - endpoints[POST /students]
        distinguishing_aspect: |
          POST /students that supplies id, created_at, version and
          pla_credits_posted 99 returns a server-minted id different from the
          supplied one, created_at equal to the logical clock 2026-08-01T00:00:00Z,
          version 1 and pla_credits_posted 0 — every system/computed field is
          reset regardless of the body.
        test_recipe:
          setup:
            - "Program BSCS exists; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlaCoordinator
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", id: "11111111-1111-1111-1111-111111111111", created_at: "2001-01-01T00:00:00Z", version: 42, pla_credits_reserved: 12, pla_credits_posted: 99, fee_paid_net_cents: 5000 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id", stu_v: "$.data.version" }
          assert:
            - "HTTP status == 201"
            - "Student.${stu_id}.id != 11111111-1111-1111-1111-111111111111"
            - "Student.${stu_id}.created_at == 2026-08-01T00:00:00Z, NOT 2001-01-01T00:00:00Z"
            - "Student.${stu_id}.updated_at == 2026-08-01T00:00:00Z"
            - "Student.${stu_id}.version == 1, NOT 42"
            - "Student.${stu_id}.pla_credits_reserved == 0, NOT 12"
            - "Student.${stu_id}.pla_credits_posted == 0, NOT 99"
            - "Student.${stu_id}.pla_credits_awarded == 0"
            - "Student.${stu_id}.pla_upper_division_committed == 0"
            - "Student.${stu_id}.fee_paid_net_cents == 0, NOT 5000"
            - "Student.${stu_id}.enrollment_status == MATRICULATED (declared default)"

      - name: course_level_outside_enum_domain_rejected
        claim_type: type_constraints
        grounds:
          - entities.Course.fields.level
          - validations[priority 8]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /courses]
        distinguishing_aspect: |
          Course.level is constrained to LOWER | UPPER, so level GRADUATE returns
          HTTP 400 ERR_INVALID_REQUEST and persists no Course; the same endpoint
          also rejects a learning_outcomes set whose weight_bp sums to 9000 with
          ERR_OUTCOME_WEIGHTS_INVALID (priority 10), proving the enum check runs
          at the earlier priority.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlaCoordinator
          trigger:
            - call: "POST /courses"
              payload: { course_code: "CS900", title: "Graduate Seminar", department_code: "CS", credits: 3, level: "GRADUATE", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Read papers", weight_bp: 9000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST — the priority 8 enum-domain check wins over the priority 10 weight-sum check ERR_OUTCOME_WEIGHTS_INVALID"
            - "no Course with course_code CS900 exists afterwards"
            - "no LearningOutcome rows were created"

      - name: learning_outcome_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.LearningOutcome
          - endpoints[GET /learning-outcomes/{outcome_id}]
          - endpoints[GET /learning-outcomes]
        distinguishing_aspect: |
          LearningOutcome declares common_fields false, so its GET response
          carries id, course_id, outcome_code, description, weight_bp and
          mastery_threshold_bp but NO version and NO updated_at, and §1.5 declares
          no PATCH, PUT or DELETE on /learning-outcomes — outcomes change only by
          creating a new Course.
        test_recipe:
          setup:
            - "Course CS150 with outcomes OC1 (8000 bp) and OC2 (2000 bp)."
          setup_api_calls:
