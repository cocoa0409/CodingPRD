      - name: sample_tier_boundary_thirty_versus_thirty_one_declared_units
        grounds:
          - calculations.unit_sample_size
          - entities.Inspection.fields.sample_tier_value
          - entities.Inspection.fields.sample_size
          - entities.Property.fields.total_unit_count
        distinguishing_aspect: |
          The tier ladder is keyed on the DECLARED Property.total_unit_count, not on the number
          of Unit rows: 30 declared units land on the second tier, max(5, ceil(0.20 * 30)) = 6,
          while 31 declared units cross into the third tier, max(8, ceil(0.15 * 31)) = 8. Both
          properties own only two eligible units, so sample_size clamps to 2 in both cases and
          only sample_tier_value reveals which side of the boundary the request fell on.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 standard with LT_GAS."
            - "Property Alder Court declares total_unit_count 30 and owns units 101 and 102; Property Birch Court declares total_unit_count 31 and owns units 201 and 202."
            - "An inspection is scheduled on each property and the sample is drawn on Alder Court first."
