          NET_EXECUTION_HEADROOM is applied to the LIMIT, not to the exposure: with the limit patched
          down to 1000000.00 after the offer, execution compares 0.00 + 2000000.00 against
          round(1000000.00 x 1.50, 2) = 1500000.00 and fails; patching the limit to 1333333.34 raises
