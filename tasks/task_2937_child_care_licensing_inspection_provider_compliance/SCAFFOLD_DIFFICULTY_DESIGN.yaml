  # =======================================================================
  # Rule 4 — transitive cascades, both of depth 4, from different triggers
  #   chain A trigger: POST /licensing/complaints/{id}/determination
  #   chain B trigger: POST /licensing/background-checks/{id}/result
  # =======================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_substantiation_to_auto_violation_to_counters_to_enforcement
        grounds:
          - state_machines.Complaint.UNDER_INVESTIGATION_to_DETERMINED
          - calculations.violation_point_assessment
          - calculations.inspection_compliance_score
          - calculations.provider_risk_assessment
          - calculations.enforcement_ladder_step
          - calculations.enforcement_fine_amount
          - entities.Violation.fields.auto_generated
          - entities.EnforcementAction.fields.basis_points
        distinguishing_aspect: |
          Depth 4 with every link caused strictly by the previous one: the
          SUBSTANTIATED determination mints an auto Violation, whose existence
          alone re-derives the provider counters and the inspection score,
          whose new open_violation_points of 38 alone crosses
          PROBATION_THRESHOLD and mints a PROPOSED EnforcementAction with
          basis_points 38 and fine 151525 — a fine no direct call ever asked for.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "ChecklistItems SU-101 (SUPERVISION, CRITICAL, infant_sensitive true) and RA-201 (RATIO, SERIOUS)."
            - "Two Inspectors: Ada (will inspect) and Ben (will investigate), both certified for TODDLER and PRESCHOOL."
            - "One CENTER provider, license_status NONE, current_ladder_step 0."
            - "A SUPERVISION / PRESCHOOL complaint screened in (P2, investigation_due_at 2026-09-15T00:00:00Z)."
            - "A COMPLAINT inspection by Ada carrying SU-101/PRESCHOOL (15) and RA-201/TODDLER (8), submitted FAIL, FINALIZED with preliminary_compliance_score 75.80."
            - "Ben assigned as investigator (Ada is barred by segregation of duties)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio met", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["TODDLER", "PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ben Investigator", county_code: "CTY-01", certified_age_groups: ["TODDLER", "PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_b: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Sunfield Center", county_code: "CTY-01", site_address: "7 Sunfield Way", program_type: "CENTER", requested_capacity: 60 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "MANDATED_REPORTER", allegation_category: "SUPERVISION", affected_age_group: "PRESCHOOL", narrative: "Preschool room left without any adult for several minutes.", alleged_serious_harm: true, anonymous: false, complainant_name: "N. Nurse" }
              as: ComplaintIntakeSpecialist
              captures: { cmp: $.data.id }
            - call: "POST /licensing/complaints/${cmp}/screen"
              payload: { decision: "SCREEN_IN" }
              as: ComplaintIntakeSpecialist
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL", "TODDLER"], duration_minutes: 120, complaint_id: "${cmp}" }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_su}", primary_age_group: "PRESCHOOL", narrative: "Preschool room unattended at 09:40." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_su: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_ra}", primary_age_group: "TODDLER", narrative: "Toddler room at 14 children to two staff." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_ra: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "FAIL", age_groups_observed: ["PRESCHOOL", "TODDLER"] }
              as: LicensingInspector
