  - rule_id: non_linear_state_machine
    instances:
      - name: sample_custody_loops_rack_to_set_and_back_without_touching_match_axis
        grounds:
          - state_machines.Sample.IN_STUDIO_to_ON_SET
          - state_machines.Sample.ON_SET_to_IN_STUDIO
          - state_machines.Sample.ON_SET_to_RETURN_PENDING
          - entities.Sample.fields.custody_state
          - entities.Sample.fields.match_state
          - calculations.custody_ledger_counters
        distinguishing_aspect: |
          The custody axis is a genuine cycle: IN_STUDIO -> ON_SET -> IN_STUDIO -> ON_SET is
          accepted an unbounded number of times with no counter and no state loss, and the
          parallel match axis stays MATCHED with matched_style_id intact throughout, proving the
          two axes advance independently rather than as one linear lifecycle.
        test_recipe:
          setup:
            - "Vendor NRTH with sample_sla_days 14; style TOP1001; sample SMP-1001 RECEIVED, MATCHED to TOP1001 and moved to IN_STUDIO."
            - "Vendor.outstanding_sample_count is 1 and Style.content_state is SAMPLE_READY before the loop."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
