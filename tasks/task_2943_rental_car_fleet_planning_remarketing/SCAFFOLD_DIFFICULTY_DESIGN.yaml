          - calculations.fleet_plan_utilization_and_rpu
          - entities.FleetPlan.fields.planned_unit_count
          - entities.FleetPlan.fields.revenue_per_unit_target_cents
          - entities.Vehicle.fields.available_days_total
          - endpoints[GET /fleet/fleet-plans/{plan_id}/performance]
        distinguishing_aspect: |
          This instance lives in the FleetPlan capacity-planning domain, not the Vehicle
          valuation domain: FORWARD_LOOKING_PLANNED divides by planned_unit_count x season_days
          over the whole pipeline while CHRONOLOGICAL_ACTUAL divides by observed available days
          over IN_SERVICE units only, so one plan read returns utilization 0.1957 and 0.7407
          and revenue-per-unit 132000 and 1320000 from the identical vehicle rows.
        test_recipe:
          setup:
            - "One ATL market, one MIDSIZE segment, one ACTIVE MID-2026 policy, one PROGRAM manufacturer program."
            - "One LOCKED ATL PEAK 2026 plan with planned_unit_count 10, revenue_per_unit_target_cents 132000 and one 4-unit allocation."
            - "Vehicle VA is IN_SERVICE with rented_days_total 180, available_days_total 243 and revenue_to_date_cents 1320000."
            - "Vehicle VB is still IN_FLEETING with all three usage counters at 0, so it dilutes the planned variant and is invisible to the actual variant."
            - "Season PEAK fixes season_days at 92, so the planned denominator is 10 x 92 = 920."
