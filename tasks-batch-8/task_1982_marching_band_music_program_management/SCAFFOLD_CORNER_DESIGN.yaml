            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 5000 }, as: BoosterTreasurer, captures: { pay: $.data.id } }
          trigger:
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "REFUND", amount_cents: 6000, reference_payment_id: "${pay}" }, as: BoosterTreasurer, captures: { err: $.data.error_id } }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "REFUND", amount_cents: 5000, reference_payment_id: "${pay}" }, as: BoosterTreasurer }
          assert:
            - "err == ERR_REFUND_EXCEEDS_PAID for 6000"
            - "REFUND 5000 succeeds; Student.${stu}.account_balance_cents == 0"
      - name: reinstate_blocked_while_delinquent
        claim_type: violation_to_error
        grounds: [state_machines.Student.SUSPENDED_to_ENROLLED, "errors[ERR_STUDENT_DELINQUENT_FEES]"]
        distinguishing_aspect: "Reinstate of a SUSPENDED student whose balance 3000 > grace 2500 → ERR_STUDENT_DELINQUENT_FEES; after a payment brings balance to 2500, reinstate succeeds."
        test_recipe:
          setup: ["program grace 2500; student ENROLLED then SUSPENDED with MANUAL_DEBIT 3000"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "RI", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "RI", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "MANUAL_DEBIT", amount_cents: 3000 }, as: BoosterTreasurer }
            - { call: "POST /band/students/${stu}/suspend", payload: {}, as: BandDirector }
          trigger:
            - { call: "POST /band/students/${stu}/reinstate", payload: {}, as: BandDirector, captures: { err: $.data.error_id } }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 500 }, as: BoosterTreasurer }
            - { call: "POST /band/students/${stu}/reinstate", payload: {}, as: BandDirector }
          assert:
            - "err == ERR_STUDENT_DELINQUENT_FEES while balance == 3000"
            - "After payment 500 (balance == 2500 == grace): reinstate succeeds, enrollment_status == ENROLLED"
