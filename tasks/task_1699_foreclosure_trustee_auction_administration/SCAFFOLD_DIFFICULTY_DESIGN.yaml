            - { call: "GET /api/foreclosure-cases/${case_id}", as: CaseManager, captures: { cv: $.data.version } }
            - { call: "POST /api/foreclosure-cases/${case_id}/bidding-instructions", payload: { opening_bid_cents: 42000000, max_bid_cents: 43000000, strategy: "UP_TO_MAX", expected_foreclosure_case_version: "${cv}" }, as: Beneficiary, as_user_id: "${ben_id}" }
            - { call: "POST /api/auction-sales/${sale_id}/bidder-registrations", payload: { bidder_name: "Bidder K", bidder_email: "bk@bid.example", deposit_cents: 1000000 }, as: Auctioneer, captures: { reg_id: $.data.id } }
            - { call: "POST /api/bidder-registrations/${reg_id}/review", payload: { decision: "QUALIFY" }, as: Auctioneer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-23T10:30:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/auction-sales/${sale_id}/conduct", payload: {}, as: Auctioneer }
            - { call: "POST /api/auction-sales/${sale_id}/bids", payload: { bidder_registration_id: "${reg_id}", amount_cents: 43000000 }, as: ThirdPartyBidder, as_user_id: "${reg_id}" }
            - { call: "POST /api/auction-sales/${sale_id}/close", payload: {}, as: Auctioneer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: TrusteeAdmin }
