            - call: "GET /consumers/${cons_h_id}/claims"
              payload: { status: "ACTIVE" }
              as: ExchangeComplianceOfficer
              captures: { h_claim_1: "$.data[0].id", h_claim_2: "$.data[1].id", h_claim_3: "$.data[2].id" }
            - call: "POST /consumers/${cons_h_id}/disputes"
              payload: { loss_claim_id: "${h_claim_1}", dispute_reason: "WRONG_AMOUNT", dispute_statement: "Amount is wrong", expected_consumer_version: "${cons_h_v}" }
              as: Consumer
              as_user_id: "${cons_h_id}"
              captures: { h_disp_1: $.data.id, cons_h_v1: $.data.version }
            - call: "POST /consumers/${cons_h_id}/disputes"
              payload: { loss_claim_id: "${h_claim_2}", dispute_reason: "WRONG_DATE", dispute_statement: "Date is wrong", expected_consumer_version: "${cons_h_v1}" }
              as: Consumer
              as_user_id: "${cons_h_id}"
              captures: { h_disp_2: $.data.id, cons_h_v2: $.data.version }
            - call: "POST /consumers/${cons_h_id}/disputes"
              payload: { loss_claim_id: "${h_claim_3}", dispute_reason: "NOT_MY_CLAIM", dispute_statement: "Not mine", expected_consumer_version: "${cons_h_v2}" }
              as: Consumer
              as_user_id: "${cons_h_id}"
              captures: { h_disp_3: $.data.id }
            - call: "POST /disputes/${h_disp_1}/begin-reinvestigation"
              payload: {}
              as: ExchangeComplianceOfficer
            - call: "POST /disputes/${h_disp_2}/begin-reinvestigation"
              payload: {}
              as: ExchangeComplianceOfficer
            - call: "POST /disputes/${h_disp_3}/begin-reinvestigation"
              payload: {}
              as: ExchangeComplianceOfficer
          trigger:
            - call: "POST /disputes/${h_disp_1}/resolve"
              payload: { resolution_code: "VERIFIED_ACCURATE", resolution_notes: "Verified with carrier" }
              as: ExchangeComplianceOfficer
            - call: "POST /disputes/${h_disp_2}/resolve"
              payload: { resolution_code: "AMENDED", resolution_notes: "Date corrected", corrected_loss_date: "2025-02-15", corrected_loss_type: "COLLISION", corrected_cause_of_loss_code: "COL2", corrected_paid_amount_cents: 200000, corrected_claim_status_code: "CLOSED_WITH_PAYMENT" }
              as: ExchangeComplianceOfficer
            - call: "POST /disputes/${h_disp_3}/resolve"
              payload: { resolution_code: "DELETED", resolution_notes: "Wrong household" }
              as: ExchangeComplianceOfficer
          assert:
            - "ConsumerDispute.${h_disp_1}.status == RESOLVED_VERIFIED and LossClaim.${h_claim_1}.status == ACTIVE"
            - "ConsumerDispute.${h_disp_2}.status == RESOLVED_AMENDED and LossClaim.${h_claim_2}.status == AMENDED"
            - "a new LossClaim exists with amendment_of_id == ${h_claim_2}, loss_date == 2025-02-15, status == ACTIVE"
            - "ConsumerDispute.${h_disp_3}.status == RESOLVED_DELETED and LossClaim.${h_claim_3}.status == WITHDRAWN"
            - "GET /consumers/${cons_h_id}/claims?status=ACTIVE returns exactly 2 rows (the verified claim and the amendment), and status=WITHDRAWN returns 1 row"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: freeze_consumer_cascades_reports_then_obligates_notice_resolution
        grounds:
          - state_machines.LossHistoryReport.ISSUED_to_FROZEN
          - endpoints.POST_/consumers/{consumerId}/freeze
          - entities.LossHistoryReport.fields.status
        distinguishing_aspect: |
          Depth-3 cascade: POST /consumers/{id}/freeze mutates Consumer (link
          1), which flips every ISSUED LossHistoryReport of that consumer to
          FROZEN (link 2, caused by the consumer mutation), which in turn
          blocks any AdverseActionNotice.send referencing those reports
          because the report precondition ISSUED no longer holds (link 3,
          caused by the report flip, not directly by the freeze).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Carrier C1 ACTIVE; consumer Ivy with 1 ACTIVE claim; an inquiry has issued report R1 (ISSUED); a DRAFT AdverseActionNotice N1 references R1."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c1
            - &d_cons_i
              call: "POST /consumers"
              payload: { full_name: "Ivy Ingram", date_of_birth: "1995-06-30", address_line: "12 Ivy Ct, Denton TX", driver_license_number: "IVY-1" }
              as: PlatformAdmin
              captures: { cons_i_id: $.data.id, cons_i_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_i_id}", policy_number: "PI-1", claim_number: "I-001", loss_date: "2025-08-01", loss_type: "COMPREHENSIVE", cause_of_loss_code: "CMP1", paid_amount_cents: 80000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Ivy Ingram", subject_dob: "1995-06-30", subject_address: "12 Ivy Ct, Denton TX", subject_driver_license: "IVY-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_i: $.data.id, rep_i: $.data.report_id }
            - call: "POST /carriers/${c1_id}/adverse-action-notices"
              payload: { report_id: "${rep_i}", action_type: "RATE_INCREASE", notice_reason_codes: ["LOSS-FREQ"], report_influence_rank: 1 }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { notice_i: $.data.id }
          trigger:
            - call: "POST /consumers/${cons_i_id}/freeze"
              payload: {}
              as: ExchangeComplianceOfficer
            - call: "POST /adverse-action-notices/${notice_i}/send"
              payload: {}
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { send_err: $.data.error_id }
          assert:
            - "Consumer.${cons_i_id}.file_frozen == true and frozen_until == 2026-10-31T00:00:00Z (clock + 60 days)"
            - "LossHistoryReport.${rep_i}.status == FROZEN — link 2 of the cascade fired"
            - "the send attempt returns 409 with send_err == ERR_INVALID_STATE — link 3: the notice cannot send against a FROZEN report even though the notice itself was untouched by the freeze"
            - "a fresh inquiry for Ivy returns report_blocked_reason == FROZEN and report_id null"
            - "GET /audit-events?consumer_id=${cons_i_id} shows REPORT_FROZEN and DATA_FREEZE_APPLIED"

      - name: batch_completion_cascades_carrier_activation_then_unlocks_report_delivery
        grounds:
          - state_machines.ContributionBatch.VALIDATED_to_COMPLETED
          - state_machines.Carrier.SUSPENDED_to_ACTIVE
          - calculations.contribution_lag
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: a batch submission mutates
          the ContributionBatch (RECEIVED -> VALIDATED -> COMPLETED, link 1),
          and the COMPLETED transition itself recomputes the carrier's
          contribution_lag_days and flips the carrier SUSPENDED -> ACTIVE
          (link 2) — which re-enables report delivery on the very next
          inquiry (observable consequence of link 2).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Carrier C5 ACTIVE from a batch submitted 2026-09-01 for consumer Jake; clock advanced to 2026-10-17 so C5 is SUSPENDED (lag 46)."
            - "An inquiry while suspended returns report_blocked_reason RECIPROCITY."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - &d_c5
              call: "POST /carriers"
              payload: { legal_name: "Bluebonnet Assurance", naic_code: "55555" }
              as: PlatformAdmin
              captures: { c5_id: $.data.id }
            - &d_cons_j
              call: "POST /consumers"
              payload: { full_name: "Jake Jessup", date_of_birth: "1983-10-10", address_line: "44 Juniper St, Abilene TX", driver_license_number: "JAKE-1" }
              as: PlatformAdmin
              captures: { cons_j_id: $.data.id, cons_j_v: $.data.version }
            - call: "POST /carriers/${c5_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_j_id}", policy_number: "PJ-1", claim_number: "J-001", loss_date: "2025-12-01", loss_type: "OTHER", cause_of_loss_code: "OTH8", paid_amount_cents: 3000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c5_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-17T00:00:00Z" }
              as: PlatformAdmin
              captures: { susp5: $.data.suspended_carrier_ids }
            - call: "POST /carriers/${c5_id}/inquiries"
              payload: { subject_name: "Jake Jessup", subject_dob: "1983-10-10", subject_address: "44 Juniper St, Abilene TX", subject_driver_license: "JAKE-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c5_id}"
              captures: { inq_j_blocked: $.data.id }
          trigger:
            - call: "POST /carriers/${c5_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_j_id}", policy_number: "PJ-1", claim_number: "J-002", loss_date: "2026-10-01", loss_type: "OTHER", cause_of_loss_code: "OTH8", paid_amount_cents: 4000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c5_id}"
              captures: { batch_j2: $.data.id }
            - call: "POST /carriers/${c5_id}/inquiries"
              payload: { subject_name: "Jake Jessup", subject_dob: "1983-10-10", subject_address: "44 Juniper St, Abilene TX", subject_driver_license: "JAKE-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c5_id}"
              captures: { inq_j_ok: $.data.id, rep_j_ok: $.data.report_id }
          assert:
            - "while suspended, QuoteInquiry.${inq_j_blocked}.report_id is null and report_blocked_reason == RECIPROCITY"
            - "ContributionBatch.${batch_j2}.status == COMPLETED (link 1)"
            - "Carrier.${c5_id}.status == ACTIVE and contribution_lag_days == 0 after the batch completes (link 2 — caused by the batch transition, not by any direct carrier call)"
            - "the next inquiry issues a report: QuoteInquiry.${inq_j_ok}.report_id is non-null and LossHistoryReport.${rep_j_ok}.claim_count_reported == 2"
            - "GET /audit-events?carrier_id=${c5_id} shows BATCH_COMPLETED then CARRIER_REACTIVATED in that order"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_file_safety_beats_reciprocity_referential_on_inquiry
        grounds:
          - validations.priority_6_business_safety
          - validations.priority_8_business_referential
          - errors.ERR_CONSUMER_FILE_FROZEN
          - errors.ERR_RECIPROCITY_REQUIRED
        distinguishing_aspect: |
          Pair business_safety vs business_referential: an inquiry submitted
          while the subject consumer's file is frozen AND the inquiring
          carrier is SUSPENDED violates priority 6 and priority 8 together;
          the higher-priority safety check wins and the answer is
          ERR_CONSUMER_FILE_FROZEN, not ERR_RECIPROCITY_REQUIRED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Carrier C5 ACTIVE from a 2026-09-01 batch for consumer Kate; consumer Kate has a second claim contributed by carrier C6 (ACTIVE)."
            - "Kate's file is frozen; clock advanced to 2026-10-17 so C5 is SUSPENDED (lag 46) while Kate's freeze is still in force (frozen_until 2026-10-31)."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c5
            - &d_c6
              call: "POST /carriers"
              payload: { legal_name: "Llano National", naic_code: "66666" }
              as: PlatformAdmin
              captures: { c6_id: $.data.id }
            - &d_cons_k
              call: "POST /consumers"
              payload: { full_name: "Kate Kellogg", date_of_birth: "1991-09-09", address_line: "6 Kalmia Ave, Tyler TX", driver_license_number: "KATE-1" }
              as: PlatformAdmin
              captures: { cons_k_id: $.data.id, cons_k_v: $.data.version }
            - call: "POST /carriers/${c5_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_k_id}", policy_number: "PK-1", claim_number: "K-001", loss_date: "2025-04-01", loss_type: "PROPERTY", cause_of_loss_code: "PRP1", paid_amount_cents: 60000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c5_id}"
            - call: "POST /carriers/${c6_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_k_id}", policy_number: "PK-2", claim_number: "K-101", loss_date: "2025-05-01", loss_type: "PROPERTY", cause_of_loss_code: "PRP2", paid_amount_cents: 70000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c6_id}"
            - call: "POST /consumers/${cons_k_id}/freeze"
              payload: {}
              as: ExchangeComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-17T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carriers/${c5_id}/inquiries"
              payload: { subject_name: "Kate Kellogg", subject_dob: "1991-09-09", subject_address: "6 Kalmia Ave, Tyler TX", subject_driver_license: "KATE-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c5_id}"
              captures: { conflict_err: $.data.error_id }
          assert:
            - "the inquiry is rejected with 409 and conflict_err == ERR_CONSUMER_FILE_FROZEN"
            - "conflict_err != ERR_RECIPROCITY_REQUIRED — the frozen-file safety check (priority 6) is evaluated before the reciprocity referential check (priority 8) even though both hold"

      - name: invalid_state_beats_inquiry_cap_fiscal_on_notice_send
        grounds:
          - validations.priority_5_state
          - validations.priority_12_business_fiscal
          - errors.ERR_INVALID_STATE
          - errors.ERR_INQUIRY_CAP_EXCEEDED
        distinguishing_aspect: |
          Pair state vs business_fiscal: a carrier at the outstanding-notice
          cap attempts to SEND a notice that is already SENT (wrong state)
          cap is also exhausted; the state precondition
          (priority 5) wins over the fiscal cap (priority 12) and the answer
          is ERR_INVALID_STATE, not ERR_INQUIRY_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule created then max_outstanding_inquiries patched to 1."
            - "Carrier C1 ACTIVE; consumer Liam with 1 claim; report R1 issued; notice N1 filed and SENT (outstanding = 1 = cap)."
          setup_api_calls:
            - *d_clock
            - call: "POST /exchange-rules"
              payload: {}
              as: PlatformAdmin
            - call: "PATCH /exchange-rules"
              payload: { max_outstanding_inquiries: 1 }
              as: PlatformAdmin
            - *d_c1
            - &d_cons_l
              call: "POST /consumers"
              payload: { full_name: "Liam Lockett", date_of_birth: "1987-02-20", address_line: "19 Laurel Ln, Amarillo TX", driver_license_number: "LIAM-1" }
              as: PlatformAdmin
              captures: { cons_l_id: $.data.id, cons_l_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_l_id}", policy_number: "PL-1", claim_number: "L-001", loss_date: "2025-09-09", loss_type: "LIABILITY", cause_of_loss_code: "LIA1", paid_amount_cents: 90000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Liam Lockett", subject_dob: "1987-02-20", subject_address: "19 Laurel Ln, Amarillo TX", subject_driver_license: "LIAM-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { rep_l: $.data.report_id }
            - call: "POST /carriers/${c1_id}/adverse-action-notices"
              payload: { report_id: "${rep_l}", action_type: "DECLINE", notice_reason_codes: ["LOSS-SEV"], report_influence_rank: 1 }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { notice_l: $.data.id }
            - call: "POST /adverse-action-notices/${notice_l}/send"
              payload: {}
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /adverse-action-notices/${notice_l}/send"
              payload: {}
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { send2_err: $.data.error_id }
          assert:
            - "the second send returns 409 with send2_err == ERR_INVALID_STATE"
            - "send2_err != ERR_INQUIRY_CAP_EXCEEDED — the SENT notice fails its state precondition before the cap is consulted"
            - "a fresh POST /carriers/${c1_id}/adverse-action-notices (valid DRAFT path) returns 409 ERR_INQUIRY_CAP_EXCEEDED, proving the cap was independently live"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: match_disposition_threshold_inclusive_at_7000_and_5500
        grounds:
          - calculations.identity_match_score
          - entities.QuoteInquiry.fields.match_disposition
        distinguishing_aspect: |
          Metric: match_score threshold ladder. The boundaries are inclusive
          (>=): a score of exactly 7000 is DEFINITE, exactly 5500 is PROBABLE,
          exactly 4000 is POSSIBLE. The test constructs grade+loss
          combinations that land exactly on each boundary and one point below.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Carrier C1 ACTIVE."
            - "Consumer B7000 (Bea Bounds, DL B7-DL, address '1 Boundary St, Houston TX') with exactly 20 included zero-payment claims; the inquiry quotes her real DL and real address: 5000 (EXACT individual) + 1000 (EXACT address) + 0 (vehicle ABSENT) + 20 x 50 = 7000 exactly."
            - "Consumer B5500 (Bo Bond, DL B55-DL, address '2 Boundary St, Houston TX') with exactly 10 included zero-payment claims; the inquiry quotes his real DL but a stale address that matches no consumer, so the address grade is ABSENT: 5000 + 0 + 0 + 10 x 50 = 5500 exactly."
            - "Consumer B5450 (Bo Bund, DL B545-DL, address '3 Boundary St, Houston TX') with exactly 9 included zero-payment claims; the inquiry again quotes a stale non-matching address: 5000 + 0 + 0 + 9 x 50 = 5450, one loss below the PROBABLE boundary."
