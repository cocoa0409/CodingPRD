            - "at exactly 120 minutes: Shipment.${sh_a_cold}.status == DELIVERED, cold_chain_excursion_minutes == 120, and NO new CreditMemo appears for patient A (credit_balance_cents stays 1, the rounding true-up only)"
            - "at 121 minutes: Shipment.${sh_b_cold}.status == EXCEPTION_RETURNED"
            - "CycleLine.${line_b4}.line_status == CREDITED while patient B's Metformin line stays ADJUDICATED"
            - "a CreditMemo with reason COLD_CHAIN_EXCURSION and amount_cents 986 (exactly the credited line's copay) is issued to patient B"
            - "Patient.${pt_b}.credit_balance_cents == 987   # 1 rounding true-up + 986 excursion credit"
            - "FillCycle.${c_b}.total_copay_cents == 762 recomputed over the surviving ADJUDICATED line; final_copay_cents remains the 1747 stamped at dispatch, because the excursion is carried as a credit rather than by rewriting the shipped total"
            - "Prescription.${rx_b4}.days_dispensed_total == 0, refills_remaining == 3, refills_consumed == 0, last_dispensed_date == 2026-07-18, last_dispensed_days_supply == 28 — the dispense is fully reversed"
            - "an AdherenceEvent with event_type DELIVERY_EXCEPTION and source SYSTEM_SCAN exists on cycle ${c_b}"
            - "Patient.${pt_b}.autoship_status is still ACTIVE — an excursion is not an adherence signal"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: roll_generation_blocked_by_another_cycles_authorization_hold
        grounds:
          - validations.priority_25
          - errors.ERR_RX_PENDING_AUTHORIZATION
          - state_machines.Prescription.ACTIVE_to_PENDING_AUTHORIZATION
          - endpoints.POST_/pharmacy/fill-cycles/{id}/generate-roll
          - entities.Prescription.fields.status
        distinguishing_aspect: |
          Entity pair FillCycle x Prescription. The gate is on a THIRD party's state: cycle
          C1 is itself perfectly CLEARED and LINES_ADJUDICATED, but the adjudication of the
          NEXT cycle C2 exhausted the shared prescription's refills and pushed it to
          PENDING_AUTHORIZATION, so C1's roll cannot be built until the prescriber answers.
          Nothing about C1's own fields changed between the failing and succeeding call.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one patient synchronized BRIDGE_TO_START on anchor day 15 with a single Metformin ER [MORNING] prescription carrying refills_authorized 1"
            - "cycle C1 2026-08-15 .. 2026-09-12 adjudicated: line ADJUDICATED, insurance_status CLEARED, packaging_status LINES_ADJUDICATED, and the dispense left refills_remaining 0 while the prescription is still ACTIVE"
            - "cycle C2 starting 2026-09-12 (touching windows are legal) created and adjudicated, which held its line for authorization and moved the prescription ACTIVE -> PENDING_AUTHORIZATION"
            - "C1's roll has NOT been generated yet"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
