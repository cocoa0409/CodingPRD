          assert:
            - "${p1_seats} == 0 at creation and ${bs2_state} == \"ESCALATED_L1\" before any enrolment"
            - "${bs1_state} == \"RESKILLING\" with ${bs1_program} == ${p1_id}; ReskillingProgram.${p1_id}.seats_taken == 1 and Consultant.${c1_id}.availability_status == \"RESKILLING\""
