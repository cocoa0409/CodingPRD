            - "the manual FEDERAL notice is created with status PENDING, origin MANUAL and due_at 2026-11-14T10:00:00Z — anchored on ratified_at 2026-09-15T10:00:00Z plus 60 days, not on the clock"
            - "the decision then reads notification_count 3 and unacknowledged_notification_count 1, and the cycle's compliance_posture has gone BACKWARDS from NOTICES_CLEARED to NOTICES_PENDING — a derived posture tracks its current input set, not a high-water mark"
            - "after the new notice is SENT and ACKNOWLEDGED the cycle reads compliance_posture NOTICES_CLEARED again with unacknowledged_notification_count 0, and the decision's notification_count stays 3"

  # ==========================================================================
  # Consistency model — immediate
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_effect_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.program_viability_composite
          - calculations.staffing_reduction_waterfall
        distinguishing_aspect: |
          Nothing in this API lags: the write that supplies the third snapshot
          returns a program whose band has already flipped out of
          INSUFFICIENT_DATA, and the appointment create returns a program whose
          waterfall has already placed it in the reduction queue. The proof is a
          re-read that is byte-identical to the write response — same computed
          fields, same version — so no client ever needs to poll for a
          denormalised field to catch up.
        test_recipe:
          setup:
            - "Empty database; the recipe builds the program's metric history one snapshot at a time and reads the computed surface out of each write response."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2024FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { v_after_third: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-1", tenure_status: "ADJUNCT", fte: 0.25, annual_salary_cents: 4000000 }
              as: HRPartner
            - call: "GET /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { limit: 10, offset: 0 }
              as: HRPartner
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: HRPartner
            - call: "GET /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { limit: 10, offset: 0 }
              as: ReviewCoordinator
          assert:
            - "the first snapshot's own 201 response carries cost_per_credit_hour_cents 40000 (12000000 / 300), computed in the same request"
            - "the read after one snapshot shows snapshot_count 1, cost_per_credit_hour_rolling_cents 40000, cost_per_credit_hour_latest_cents 40000, composite_score null and viability_band INSUFFICIENT_DATA — three terms are required before a band exists"
            - "the read after the third snapshot shows snapshot_count 3, cost_per_credit_hour_rolling_cents 45946, cost_per_credit_hour_latest_cents 55000, composite_score 29.06 and viability_band NONVIABLE — the flip out of INSUFFICIENT_DATA happened inside the third write, with no intervening call"
            - "the appointment create's own 201 response reports notice_pay_cents 82192 and reduction_sequence_position 1 — the waterfall ran inside the create, so the appointment is already queued when the client first sees it"
            - "the appointment list agrees with that create response field for field, and the program read taken straight afterwards reports faculty_fte_baseline 0.25, active_fte_total 0.25, assigned_pool_fte 0.25, reducible_fte 0.25, severance_budget_cap_cents 5100000, staffing_liability_cents 82192 and deferred_fte 0.00"
            - "the program's version after the appointment create is ${v_after_third} + 1, and the snapshot list still returns total_count 3 — reads never mutate"

      - name: a_cascade_is_visible_on_the_parent_in_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ReviewCycle
          - state_machines.AcademicProgram
          - calculations.agency_notice_deadline
        distinguishing_aspect: |
          The cascade crosses aggregate boundaries — a write on a DecisionRecord
          changes a ReviewCycle, an AcademicProgram, that program's catalog axis
          and a set of AgencyNotification rows that did not exist a moment ago —
          and every one of those effects is readable on the very next request,
          including the derived compliance_posture that depends on rows the
          cascade itself minted. No effect is deferred to a sweep: the notices
          exist with their deadlines already stamped before any compliance sweep
          has run.
        test_recipe:
          setup:
            - "A NONVIABLE program whose cycle is in RESPONSE_SUBMITTED with a PROPOSED DISCONTINUATION decision; the clock is 2026-09-15T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2024FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Nala Osei", institution: "Westmoor University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "DISCONTINUE", finding_codes: ["F-ENROLL"], narrative: "Enrollment collapse." }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "CONCUR", response_text: "The department concurs." }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "DISCONTINUATION", rationale: "Sustained nonviability.", effective_term_index: 4, expected_cycle_version: "${cyc_v}" }
              as: Provost
              as_user_id: "provost-proposer"
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /provost/decision-records/${dec_id}/transitions"
              payload: { action: "RATIFY", ratification_note: "Board ratified." }
              as: Provost
              as_user_id: "provost-ratifier"
            - call: "GET /provost/review-cycles/${cycle_id}"
              payload: {}
              as: Provost
              as_user_id: "provost-ratifier"
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: Provost
              as_user_id: "provost-ratifier"
            - call: "GET /provost/decision-records/${dec_id}/agency-notifications"
              payload: { limit: 10, offset: 0 }
              as: Provost
              as_user_id: "provost-ratifier"
            - call: "GET /provost/decision-records/${dec_id}"
              payload: {}
              as: Provost
              as_user_id: "provost-ratifier"
          assert:
            - "the RATIFY response itself returns the DecisionRecord in state RATIFIED with ratified_at 2026-09-15T10:00:00Z, notification_count 2 and unacknowledged_notification_count 2 — the minted children are already counted in the response that minted them"
            - "the next read of the cycle shows state DECIDED, decided_at 2026-09-15T10:00:00Z and compliance_posture NOTICES_PENDING — a derived field over rows created by the same cascade"
            - "the next read of the program shows lifecycle_state TEACH_OUT_PENDING, catalog_status ADMISSIONS_CLOSED and catalog_status_pre_decision LISTED — the cascade recorded the pre-decision catalog value so a rescission can restore it"
            - "the notification list returns total_count 2 with no sweep having run: an ACCREDITOR notice with agency_code REGIONAL-ACC, status PENDING, origin AUTO_MINTED and due_at 2026-10-15T10:00:00Z, and a STATE_AGENCY notice with agency_code STATE-CHE, status PENDING, origin AUTO_MINTED and due_at 2026-10-30T10:00:00Z"
            - "the decision read agrees with the RATIFY response field for field — same state, same counters, same version — so nothing about the cascade was completed lazily between the two requests"
