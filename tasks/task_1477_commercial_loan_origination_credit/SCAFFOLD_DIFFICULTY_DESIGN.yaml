            - { call: "POST /credit/document-checklist-items", payload: { loan_application_id: "${app}", category: CLOSING_CONDITION, label: "Evidence of insurance" }, as: CreditAdministrator, as_user_id: "${adm}", captures: { cc1: $.data.id } }
            - { call: "POST /credit/document-checklist-items/${cc1}/transition", payload: { to: RECEIVED }, as: CreditAdministrator, as_user_id: "${adm}" }
            - { call: "POST /credit/document-checklist-items/${cc1}/transition", payload: { to: APPROVED }, as: CreditAdministrator, as_user_id: "${adm}" }
            - { call: "POST /credit/loan-applications/${app}/submit-for-closing", payload: {}, as: CreditAdministrator, as_user_id: "${adm}" }
            - { call: "POST /credit/funding-authorizations", payload: { loan_application_id: "${app}", amount_cents: 120000000, disbursement_date: "2026-08-15" }, as: CreditAdministrator, as_user_id: "${adm}", captures: { fa1: $.data.id } }
            - { call: "POST /credit/funding-authorizations/${fa1}/authorize", payload: {}, as: CreditPolicyOfficer, as_user_id: "${po}" }
          trigger:
            - { call: "POST /credit/funding-authorizations/${fa1}/release", payload: {}, as: CreditAdministrator, as_user_id: "${adm}", captures: { fa1_status: $.data.status } }
            - { call: "GET /credit/borrowers/${bor}", as: CreditAnalyst, as_user_id: "${an}", captures: { comm1: $.data.committed_exposure_cents, fund1: $.data.funded_exposure_cents, tot1: $.data.total_exposure_cents } }
            - { call: "POST /credit/funding-authorizations", payload: { loan_application_id: "${app}", amount_cents: 80000000, disbursement_date: "2026-08-16" }, as: CreditAdministrator, as_user_id: "${adm}", captures: { fa2: $.data.id } }
            - { call: "POST /credit/funding-authorizations/${fa2}/authorize", payload: {}, as: CreditPolicyOfficer, as_user_id: "${po}" }
            - { call: "POST /credit/funding-authorizations/${fa2}/release", payload: {}, as: CreditAdministrator, as_user_id: "${adm}", captures: { fa2_status: $.data.status } }
            - { call: "GET /credit/borrowers/${bor}", as: CreditAnalyst, as_user_id: "${an}", captures: { comm2: $.data.committed_exposure_cents, fund2: $.data.funded_exposure_cents, tot2: $.data.total_exposure_cents } }
          assert:
            - "after letter accept: committed_exposure_cents == 200000000, funded_exposure_cents == 0, total_exposure_cents == 200000000"
            - "after release of 120,000,000: committed_exposure_cents == 80000000 and funded_exposure_cents == 120000000 — total_exposure_cents == 200000000 UNCHANGED (compensating pair: committed -120,000,000, funded +120,000,000)"
            - "FundingAuthorization.${fa1}.status == RELEASED; CommitmentLetter.${letter}.status == FUNDED; LoanApplication.${app}.status == FUNDED; LoanApplication.${app}.funded_amount_cents == 120000000"
            - "after release of the remaining 80,000,000: committed_exposure_cents == 0 and funded_exposure_cents == 200000000 — total_exposure_cents STILL == 200000000 (invariant holds on every tranche)"
            - "LoanApplication.${app}.funded_amount_cents == 200000000 == letter.committed_amount_cents (full draw at exact cap allowed)"

      - name: participation_hold_conserved_across_commit_release
        grounds:
          - calculations.participation_hold_reconciliation
          - entities.LoanApplication.fields.bank_hold_amount_cents
          - entities.Participation.fields.allocated_amount_cents
          - state_machines.Participation.COMMITTED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = letter.committed_amount_cents decomposed as
          bank_hold_amount_cents + allocated-active participations (distinct
          from the borrower-exposure quantity above): propose (50,000,000),
          commit, propose (10,000,000), then RELEASE the committed slice —
          every step keeps bank_hold + sum(allocated over PROPOSED|COMMITTED)
          == 80,000,000, and the release returns both the allocation and its
          500,000-cent fee share to the bank.
        test_recipe:
          setup:
            - "Application in COMMITMENT: letter ISSUED with committed_amount_cents 80,000,000 (SMALL deal, fee 800,000); zero participations; bank_hold_amount_cents == 80,000,000"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
