      - name: fee_schedule_tier_shape_and_empty_rate_set_are_rejected_at_create_and_publish
        claim_type: violation_to_error
        grounds:
          - validations.priority_33.check
          - validations.priority_34.check
          - entities.FeeSchedule.fields.material_rates
        distinguishing_aspect: "Three distinct malformed tier shapes (a gap, an overlap and a first band that does not start at 0) all return ERR_FEE_TIER_DISCONTINUOUS at create, while an empty rate set is accepted at create and only refused at publish with ERR_FEE_SCHEDULE_HAS_NO_RATES."
        test_recipe:
          setup:
            - "One CA program and one PRO; no fee schedule exists yet."
          setup_api_calls:
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "ENTITY_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 1000000, small_producer_tonnage_threshold_kg: 1.000, exempt_product_categories: [], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              captures: { sp_s_id: $.data.id }
            - call: "POST /epr/pros"
              payload: { name: "Shape Test Stewardship", contact_email: "ops@shape.example" }
              as: ProgramRegulator
              captures: { pro_s_id: $.data.id }
            - call: "GET /epr/pros/${pro_s_id}"
              payload: {}
              as: ProAdministrator
              as_user_id: "${pro_s_id}"
              captures: { pro_s_ver: $.data.version }
          trigger:
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_s_id}", state_program_id: "${sp_s_id}", effective_from: "2026-01-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 900, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: 100, rate_cents_per_kg: 9 }, { material_type: "GLASS", tier_min_kg: 200, tier_max_kg: null, rate_cents_per_kg: 7 }] }
              as: ProAdministrator
              as_user_id: "${pro_s_id}"
              captures: { e_s1: $.data.error_id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_s_id}", state_program_id: "${sp_s_id}", effective_from: "2026-01-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 900, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: 300, rate_cents_per_kg: 9 }, { material_type: "GLASS", tier_min_kg: 200, tier_max_kg: null, rate_cents_per_kg: 7 }] }
              as: ProAdministrator
              as_user_id: "${pro_s_id}"
              captures: { e_s2: $.data.error_id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_s_id}", state_program_id: "${sp_s_id}", effective_from: "2026-01-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 900, material_rates: [{ material_type: "GLASS", tier_min_kg: 50, tier_max_kg: null, rate_cents_per_kg: 9 }] }
              as: ProAdministrator
              as_user_id: "${pro_s_id}"
              captures: { e_s3: $.data.error_id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_s_id}", state_program_id: "${sp_s_id}", effective_from: "2026-01-01", effective_to: "2026-06-30", membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 900, material_rates: [] }
              as: ProAdministrator
              as_user_id: "${pro_s_id}"
              captures: { fs_empty_id: $.data.id }
            - call: "POST /epr/fee-schedules/${fs_empty_id}/publish"
              payload: { expected_pro_version: "${pro_s_ver}" }
              as: ProAdministrator
              as_user_id: "${pro_s_id}"
              captures: { e_s4: $.data.error_id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_s_id}", state_program_id: "${sp_s_id}", effective_from: "2026-07-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 900, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: 100, rate_cents_per_kg: 9 }, { material_type: "GLASS", tier_min_kg: 100, tier_max_kg: null, rate_cents_per_kg: 7 }] }
              as: ProAdministrator
              as_user_id: "${pro_s_id}"
              captures: { fs_good_id: $.data.id }
            - call: "POST /epr/fee-schedules/${fs_good_id}/publish"
              payload: { expected_pro_version: "${pro_s_ver}" }
              as: ProAdministrator
              as_user_id: "${pro_s_id}"
          assert:
            - "Triggers 1, 2 and 3: HTTP 422 with error_id == ERR_FEE_TIER_DISCONTINUOUS (gap 100..200, overlap 200..300, and a first band starting at 50)"
            - "GET /epr/fee-schedules?pro_id=${pro_s_id} returns total_count == 0 immediately after trigger 3"
            - "Trigger 4: HTTP 201 with FeeSchedule.${fs_empty_id}.status == DRAFT and material_rates == [] — the shape check is vacuously satisfied"
            - "Trigger 5: HTTP 422 with error_id == ERR_FEE_SCHEDULE_HAS_NO_RATES, FeeSchedule.${fs_empty_id}.status stays DRAFT and Pro.${pro_s_id}.version stays ${pro_s_ver}"
            - "Trigger 6: HTTP 201 for the contiguous two-band schedule (0..100, 100..null)"
            - "Trigger 7: HTTP 200 with FeeSchedule.${fs_good_id}.status == PUBLISHED, version == 2 and Pro.${pro_s_id}.version == 2 — the earlier failed publish never consumed the expected version"

