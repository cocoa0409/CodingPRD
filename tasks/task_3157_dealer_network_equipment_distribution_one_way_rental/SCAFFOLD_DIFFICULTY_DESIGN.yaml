            - "HTTP status 409"

      - name: existence_beats_business_referential_suspended_dealer
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_REFERENCE_NOT_FOUND]
          - errors[ERR_DEALER_SUSPENDED]
        distinguishing_aspect: |
          Pair existence vs business_referential: a reservation create whose
          body dest_location_id does not exist AND whose origin dealer is
          SUSPENDED must return ERR_REFERENCE_NOT_FOUND (priority 5), not a
          dealer-posture error (priority 12 territory).
        test_recipe:
          setup:
            - "Location LA OPEN with dealer DA; DA suspended"
            - "Customer registered and license-verified (vehicle irrelevant)"
          setup_api_calls:
            - call: "POST /rental-network/locations"
