            - "dd_st == EXECUTED; old_st == REFINANCED; cv_st == WAIVED (depth-3 from the decision)"
            - "new_st == CURRENT and new_prin == 320000000 (new loan originated from payload)"
            - "err == ERR_LOAN_NOT_REPORTABLE (409) — submitting a lender report against the REFINANCED loan is a terminal-state rejection"

