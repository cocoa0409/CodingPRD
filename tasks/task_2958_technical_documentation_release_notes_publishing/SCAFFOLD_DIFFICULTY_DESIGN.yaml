            - "the response is NOT ERR_DUPLICATE_SIGNOFF_DISCIPLINE and NOT HTTP 409"
            - "no new SignOff row was created: GET /topics/${t_id}/sign-offs returns total_count 1"
            - "SignOff.${so_erin_id}.state is still PENDING and Reviewer.${rv_erin_id}.open_signoff_count == 1"
            - "Reviewer.${rv_dana_id}.open_signoff_count == 0"
            - "Topic.${t_id}.review_state is still PENDING_SIGNOFF"

      - name: writer_window_overlap_beats_capacity_exceeded_rejected
        grounds:
          - validations[priority=52]
          - validations[priority=61]
          - errors.ERR_WRITER_WINDOW_OVERLAP
          - errors.ERR_WRITER_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          A different pair on a different endpoint and a different pair of CATEGORIES: a
          business_constraint (52, scheduling collision) against a business_fiscal rule
          (61, capacity ceiling), both returning 409 so only the error_id distinguishes them.
          The failing request violates both at once — it overlaps the writer's existing window
          AND would push committed load from 26.00 to 52.00 against a 30-point ceiling — and
          the scheduling rule must be reported.
        test_recipe:
          setup:
            - "One release train ATLAS 20.0, one SENIOR writer with capacity_points 30."
            - "Plan item A: STANDARD, 6 pages, complexity 10, NEW_TOPIC, assigned 2026-08-03..2026-08-14 -> load_points 26.00, Writer.committed_load_points 26.00."
            - "Plan item B: identical shape, so its freshly computed load_points would also be 26.00 and 26.00 + 26.00 = 52.00 exceeds the 30-point ceiling."
            - "B is requested for 2026-08-10..2026-08-20, which intersects A's window outright."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "20.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 30 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-roles", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_a: $.data.id }
            - call: "POST /plan-items/${pi_a}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-scopes", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_b: $.data.id }
          trigger:
            - call: "POST /plan-items/${pi_b}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-10", window_end_date: "2026-08-20" }
              as: DocsLead
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_WRITER_WINDOW_OVERLAP with HTTP 409"
            - "the response is NOT ERR_WRITER_CAPACITY_EXCEEDED"
            - "DocPlanItem.${pi_b}.status is still DRAFTED with assigned_writer_id null, window_start_date null and load_points null"
            - "Writer.${w1_id}.committed_load_points == 26.00 and assignment_count == 1 (unchanged)"
            - "DocPlanItem.${pi_a}.load_points == 26.00 and window_start_date == 2026-08-03"

