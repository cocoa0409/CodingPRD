              captures: { fee20: $.data.assessed_fee_cents }
          assert:
            - "crew 19 (MEDIUM): assessed_fee_cents == 36250 (20000 + round(5000 x 1 x 1.25)=6250 + 10000)"
            - "crew 20 (LARGE, >= boundary): assessed_fee_cents == 37500 (20000 + round(5000 x 1 x 1.5)=7500 + 10000)"
            - "delta across the boundary == 1250 cents"
      - name: finalize_requires_exactly_zero_unresolved_comments
        grounds:
          - validations[priority=17]
          - entities.CompatibilityDetermination.fields.unresolved_comment_count
        distinguishing_aspect: |
          Zero-count edge (metric 2: a collection cardinality, not a numeric
          fee) reached via POST /refuge/determinations/{id}/finalize:
          unresolved_comment_count == 1 rejects with ERR_UNRESOLVED_COMMENTS;
          adjudicating to exactly 0 lets finalize succeed.
        test_recipe:
          setup:
            - "One determination in ADJUDICATION with exactly one SUBMITTED public comment."
          setup_api_calls:
            - call: "POST /refuge/determinations"
