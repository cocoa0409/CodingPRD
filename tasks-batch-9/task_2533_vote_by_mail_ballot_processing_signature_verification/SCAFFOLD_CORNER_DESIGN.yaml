            - *c_review1
          assert:
            - "Reviewer opening a round: HTTP 403 with data.error_id == \"ERR_ROLE_FORBIDDEN\""
            - "Reviewer issuing a cure: HTTP 403 with data.error_id == \"ERR_ROLE_FORBIDDEN\" (the role gate at priority 2 precedes the priority-6 signature-state gate that would have rejected an UNVERIFIED envelope)"
            - "The same round opened by ElectionsClerk: HTTP 201 with reviewer_id == ${rv1}, review_round == 1, status == \"ASSIGNED\""
            - "GET /vote-by-mail/signature-reviews?return_envelope_id=${en1} returns total_count == 1"

      - name: elections_clerk_cannot_adjudicate_cures_or_run_separation
        claim_type: Exclusive operations
        grounds:
          - roles.CanvassSupervisor.exclusive_operations
          - roles.ElectionsClerk.exclusive_operations
          - validations[ERR_ROLE_FORBIDDEN]
        distinguishing_aspect: "The clerk collects cure evidence but cannot decide it: adjudication and separation runs return 403 ERR_ROLE_FORBIDDEN for ElectionsClerk, leaving cn1 at UNDER_EVIDENCE_REVIEW and en1 SEALED, while CanvassSupervisor's adjudication succeeds."
        test_recipe:
          setup:
            - "Cure notice cn1 at UNDER_EVIDENCE_REVIEW after clerk-submitted evidence ce1 on envelope en1 (signature_status CURE_REQUIRED)."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_review1
            - *c_decision_missing
            - *c_cure1
            - *c_evidence1
          trigger:
            - call: "POST /vote-by-mail/cure-notices/${cn1}/adjudicate"
              payload: { outcome: "CURE" }
              as: ElectionsClerk
              captures: { clerk_adjudicate_err: $.data.error_id }
            - call: "POST /vote-by-mail/elections/${e1}/separation-runs"
              payload: { return_envelope_ids: ["${en1}"] }
              as: ElectionsClerk
              captures: { clerk_separation_err: $.data.error_id }
            - call: "POST /vote-by-mail/cure-notices/${cn1}/adjudicate"
              payload: { outcome: "CURE" }
              as: CanvassSupervisor
          assert:
            - "Clerk adjudication: HTTP 403 with data.error_id == \"ERR_ROLE_FORBIDDEN\""
            - "Clerk separation run: HTTP 403 with data.error_id == \"ERR_ROLE_FORBIDDEN\" (the role gate precedes both the empty-set and the secrecy-pool rules)"
            - "Supervisor adjudication: HTTP 200 with status == \"CURED\" and resolved_at == \"2026-11-03T12:00:00Z\""
            - "GET /vote-by-mail/return-envelopes/${en1} returns signature_status == \"ACCEPTED\" and GET /vote-by-mail/elections/${e1} returns open_cure_count == 0"
            - "GET /vote-by-mail/cure-evidence/${ce1} returns accepted == true"

      - name: canvass_supervisor_cannot_advance_posture_or_drive_the_clock
        claim_type: Exclusive operations
        grounds:
          - roles.ElectionsAdmin.exclusive_operations
          - roles.CanvassSupervisor.exclusive_operations
          - validations[ERR_ROLE_FORBIDDEN]
        distinguishing_aspect: "Posture advance, canvass sweep and the clock endpoint are ElectionsAdmin-exclusive: all three return 403 ERR_ROLE_FORBIDDEN for CanvassSupervisor and the election's posture and canvass_sweep_index are unchanged."
        test_recipe:
          setup:
            - "Election e1 in PRE_MAIL with canvass_sweep_index 0 and the clock at 2026-09-10T09:00:00Z."
