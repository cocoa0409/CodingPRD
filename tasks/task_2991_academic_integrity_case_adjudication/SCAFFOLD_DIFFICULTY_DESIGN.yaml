      - name: case_severity_index_escalation_band_read_from_provisional_mode_c
        grounds:
          - calculations.case_severity_index
          - entities.Case.fields.provisional_severity_index
          - entities.Case.fields.prior_escalation_points
          - endpoints[POST /integrity/cases]
        distinguishing_aspect: |
          MODE (c): the escalation band is selected from the PROVISIONAL index, so the naive
          self-referential shortcut of selecting it from the finished index changes BOTH outputs.
