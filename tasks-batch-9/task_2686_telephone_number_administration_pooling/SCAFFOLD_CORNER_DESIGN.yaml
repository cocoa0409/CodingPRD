      - name: third_information_request_hits_the_cycle_limit
        claim_type: Violation → Error
        grounds: ["errors[ERR_INFO_CYCLE_LIMIT_REACHED]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / allocation_request_info_request_cycle_twice_then_third_refused
          rationale: "The named §1.8 instance drives info_request_count to 2 through two full REQUEST_INFO / resubmission cycles and asserts the third REQUEST_INFO returns 409 with this code."
      - name: readiness_failure_makes_the_carrier_not_eligible_at_approval
        claim_type: Violation → Error
        grounds: ["errors[ERR_CARRIER_NOT_ELIGIBLE]", "validations[priority=13]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allocation_approval_rechecks_carrier_readiness_at_review_time
          rationale: "The named §1.8 instance FAILs the carrier's facilities readiness between submission and review and asserts the APPROVE returns 422 with this code while facilities_readiness_status reads FAILED."
      - name: utilization_below_the_growth_floor_refuses_the_approval
        claim_type: Violation → Error
        grounds: ["errors[ERR_UTILIZATION_THRESHOLD_NOT_MET]", "validations[priority=30]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / carrier_eligibility_beats_utilization_threshold_on_approval
          rationale: "After the licence is reinstated the named §1.8 instance re-approves the same request over a 40.00 filing and asserts this code is returned, so the standalone threshold violation is already covered."
      - name: port_activation_on_an_unrouted_block_is_refused
        claim_type: Violation → Error
        grounds: ["errors[ERR_PORT_BLOCK_NOT_ROUTED]", "validations[priority=18]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / port_activation_requires_block_routing_promoted_by_sweep
          rationale: "The named §1.8 instance ACTIVATEs a CONCURRED port request while the block is still ROUTING_PENDING and asserts the 409 with this code before the sweep promotes the routing record."

  - section: rbac
    instances:
      - name: numbering_administrator_exclusive_inventory_and_sweep_surface
        claim_type: Exclusive and shared operations
        grounds: ["roles.NumberingAdministrator.exclusive_operations", "endpoints[POST /numbering/reclamation-sweeps]", "endpoints[POST /numbering/blocks]"]
        distinguishing_aspect: "The administrator is the only role that can mint the whole inventory spine - carrier, NPA, rate center, block - and then run a sweep; the sweep is accepted with an empty result set rather than refused, proving the authorisation and not merely the happy-path effect."
        test_recipe:
          setup: ["Empty database. The administrator builds NPA 614 / COLUMBUS and loads one unassigned block 614-555-0; nothing is due for reclamation at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 0, contaminated_count: 0 }
              as: NumberingAdministrator
              captures: { blk_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/reclamation-sweeps"
              payload: { rate_center_id: "${rc_id}" }
              as: NumberingAdministrator
              as_user_id: "admin-1"
              captures: { swept: "$.data.swept_at" }
          assert:
            - "HTTP 200, response_type == \"object\", data.orders_issued == 0, data.blocks_released == 0, data.routing_activated == 0 and data.swept_at == \"2026-08-01T00:00:00Z\""
            - "Every setup call was accepted for the same role: the carrier, NPA, rate center and block creates each returned 201"
            - "GET /numbering/blocks/${blk_id} reads allocation_status == \"POOL_AVAILABLE\" - the sweep touched nothing"

      - name: regulatory_approver_cannot_register_a_carrier
        claim_type: Denied other roles' exclusive operations
        grounds: ["roles.NumberingAdministrator.exclusive_operations", "endpoints[POST /numbering/carriers]", "errors[ERR_ROLE_NOT_PERMITTED]", "validations[priority=2]"]
        distinguishing_aspect: "Carrier registration is administrator-exclusive, so the commission-side approver - who outranks the administrator on approvals - is still refused at priority 2 with the endpoint-level role error rather than the action-level mismatch."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: RegulatoryApprover
              as_user_id: "approver-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\" (not ERR_ACTION_ROLE_MISMATCH)"
            - "GET /numbering/carriers reads total_count == 0"

      - name: carrier_representative_cannot_load_block_inventory
        claim_type: Denied other roles' exclusive operations
        grounds: ["roles.NumberingAdministrator.exclusive_operations", "endpoints[POST /numbering/blocks]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "A carrier may ask for blocks but may never mint them: the same role that legitimately files allocation requests is refused on the inventory-load endpoint even when its payload is perfectly formed and its own carrier id is the intended holder."
        test_recipe:
          setup: ["Carrier A exists. NPA 614 / rate center COLUMBUS exists and holds no blocks."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 0, contaminated_count: 0, holder_carrier_id: "${a_id}", mark_activated: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\" (not ERR_NOT_RESOURCE_OWNER - the role check at priority 2 runs before the ownership check at priority 6)"
            - "GET /numbering/rate-centers/${rc_id}/blocks reads total_count == 0"

      - name: porting_operations_cannot_read_the_allocation_listing
        claim_type: Denied other roles' exclusive operations
        grounds: ["roles.PortingOperations.shared_operations", "endpoints[GET /numbering/allocation-requests]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "PortingOperations shares every GET except the allocation, filing and relief listings, so the carve-out has to be enforced: the same role that reads blocks and port requests freely is refused on the allocation listing."
        test_recipe:
          setup: ["Empty database - the refusal is decided from the role alone, before any row is read."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/blocks"
              payload: {}
              as: PortingOperations
              as_user_id: "porting-1"
            - call: "GET /numbering/allocation-requests"
              payload: {}
              as: PortingOperations
              as_user_id: "porting-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "The block listing returns HTTP 200 with total_count == 0 - PortingOperations is permitted there"
            - "The allocation listing returns HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\""

      - name: public_commenter_sees_the_relief_surface_and_nothing_else
