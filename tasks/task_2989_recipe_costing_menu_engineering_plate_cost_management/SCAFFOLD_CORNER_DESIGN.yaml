      - name: spec_change_order_reject_leaves_the_specification_untouched
        claim_type: side_effect_execution
        grounds:
          - state_machines[SpecChangeOrder] PENDING -> REJECTED
          - entities.Recipe.fields.open_spec_change_count
        distinguishing_aspect: "The reject arm is the null-effect arm of the fork: it decrements open_spec_change_count and stores the reason, but the component's ep_quantity is untouched, no snapshot is captured, propagation_status stays NOT_STARTED, the recipe keeps its FRESH cost and the prep guide stays CURRENT — every side effect the approve arm would have fired is absent."
        test_recipe:
          setup:
            - "GRILL WORLD's recipe only, ACTIVE (versions 1 create, 2 component, 3 roll-up, 4 submit-review, 5 activate) with batch 3880071 FRESH and a PrepGuide at revision 1, plus a COMPONENT_QTY spec change order raising the cheddar component from ep 400 to 600, submitted by u-dev-1. No menu item is needed: the claim is about the recipe's own specification."
