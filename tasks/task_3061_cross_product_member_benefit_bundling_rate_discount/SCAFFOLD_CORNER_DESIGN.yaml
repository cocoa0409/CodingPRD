            - "the same call with as_user_id ${r005_id} succeeds and moves the notice to ACKNOWLEDGED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_member_version_on_requalification_cycle_open_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cycle-open-supersede-stale-member]
          - validations[priority=5]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The OCC loser is detected purely by a stale expected_member_version carried in the request body, so two strictly sequential opens are enough to observe the 412 without any overlap in time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-L-001 holds an ADOPTED BANKING holding; its version is read and then left stale."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-L-001", full_name: "Sela Brandt", email: "sela@x.com" }
              as: Anonymous
              captures: { l001_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${l001_id}", product_line: "BANKING", balance_cents: 100000 }
              as: PlatformAdmin
              captures: { l001_h_id: $.data.id }
            - call: "POST /benefits/holdings/${l001_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${l001_id}"
            - call: "GET /benefits/members/${l001_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l001_v_stale: $.data.version }
            - call: "POST /benefits/members/${l001_id}/detect-churn"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /benefits/members/${l001_id}/requalification-cycles"
              payload: { expected_member_version: "${l001_v_stale}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "Member.${l001_id}.version advanced past ${l001_v_stale} because detect-churn mutated the member row"
            - "GET /benefits/requalification-cycles?member_id=${l001_id} returns 0 rows"
            - "re-reading the member and resending the open with the fresh version succeeds with 201 and increments version again"

      - name: correct_version_on_the_occ_write_endpoint_succeeds_and_advances_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[application-create-stale-loan]
          - endpoints.POST_/benefits/loan-accounts/{loan_account_id}/applications
        distinguishing_aspect: "The happy path of the same OCC guard: presenting the version freshly read from the loan allows the create, and the loan's version advances so a second attempt with the old value is rejected."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-L-002 has an ADOPTED LENDING holding with a loan and two ACTIVE rules of different stacking classes."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-L-002", full_name: "Timo Vasquez", email: "timo@x.com" }
              as: Anonymous
              captures: { l002_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${l002_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { l002_h_id: $.data.id }
            - call: "POST /benefits/holdings/${l002_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${l002_id}"
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "OCC_BASE_30", discount_kind: "MEMBER_TIER", stacking_class: "BASE", discount_bps: 30, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { l002_r1_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${l002_r1_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "OCC_ADD_20", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { l002_r2_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${l002_r2_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${l002_id}", holding_id: "${l002_h_id}", loan_type: "PERSONAL", principal_cents: 550000, base_apr_bps: 1200 }
              as: Underwriter
              captures: { l002_la_id: $.data.id }
            - call: "GET /benefits/loan-accounts/${l002_la_id}"
              payload: {}
              as: Underwriter
              captures: { l002_v1: $.data.version }
          trigger:
            - call: "POST /benefits/loan-accounts/${l002_la_id}/applications"
              payload: { rule_id: "${l002_r1_id}", expected_loan_account_version: "${l002_v1}" }
              as: BenefitsAdmin
              captures: { l002_app1_id: $.data.id }
          assert:
            - "the response status is 201 and DiscountApplication.${l002_app1_id}.application_state == APPLIED"
            - "the loan's version advanced past ${l002_v1} as the create bumped it"
            - "a second create on the other stacking class carrying the stale ${l002_v1} is rejected with 412 ERR_STALE_VERSION"
            - "re-reading the version and retrying the second create succeeds, leaving discount_stack_bps == 50 and effective_apr_bps == 1150"

      - name: holding_adopt_fans_out_derived_fields_across_the_member_row
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ProductHolding.PENDING_to_ADOPTED
          - calculations.product_adoption_count
          - calculations.product_line_set
          - calculations.member_tier
        distinguishing_aspect: "One adoption mutation refreshes four derived member fields in a single ordering, and re-adopting a second holding updates all four again without any of them drifting out of step."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-L-003 has two PENDING holdings on different product lines."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-L-003", full_name: "Ursa Klein", email: "ursa@x.com" }
              as: Anonymous
              captures: { l003_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${l003_id}", product_line: "BANKING", balance_cents: 200000 }
              as: PlatformAdmin
              captures: { l003_h1_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${l003_id}", product_line: "INVESTING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { l003_h2_id: $.data.id }
          trigger:
            - call: "POST /benefits/holdings/${l003_h1_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${l003_id}"
            - call: "POST /benefits/holdings/${l003_h2_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${l003_id}"
          assert:
            - "after the first adoption: product_adoption_count 1, product_line_set [\"BANKING\"], member_tier BASE"
            - "after the second adoption: product_adoption_count 2, product_line_set [\"BANKING\", \"INVESTING\"], member_tier PLUS"
            - "Member.${l003_id}.qualifying_deposit_balance_cents == 200000, updated by the same cascade"
            - "Member.${l003_id}.member_status == MEMBER_ACTIVE with member_since_at set on the first adoption"
            - "all four derived fields agree with a fresh GET after each mutation, with no stale intermediate value"

      - name: derived_field_reconciliation_between_entitlement_rows_and_the_member_rollup
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.benefit_entitlement_reconciliation
          - entities.BenefitEntitlement.fields.reconciliation_state
          - endpoints.POST_/benefits/members/{member_id}/entitlements/reconcile
        distinguishing_aspect: "reconciliation_state detects and then repairs drift: a row whose stored status disagrees with its guard verdict reads DRIFT_REPORTED, and the reconcile endpoint rewrites it so the same read turns IN_SYNC."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-L-004 has an ADOPTED BANKING holding whose DEPOSIT_RATE_BOOST entitlement is GRANTED, and the enrollment is then deliberately lapsed so the guard verdict flips."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-L-004", full_name: "Vito Marsh", email: "vito@x.com" }
              as: Anonymous
              captures: { l004_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${l004_id}", product_line: "BANKING", balance_cents: 600000 }
              as: PlatformAdmin
              captures: { l004_h_id: $.data.id }
            - call: "POST /benefits/holdings/${l004_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${l004_id}"
            - call: "POST /benefits/members/${l004_id}/entitlements"
              payload: { source_holding_id: "${l004_h_id}", benefit_code: "DEPOSIT_RATE_BOOST", value_bps: 50 }
              as: BenefitsAdmin
              captures: { l004_ent_id: $.data.id }
            - call: "POST /benefits/deposit-enrollments"
              payload: { member_id: "${l004_id}", required_monthly_amount_cents: 100000 }
              as: PlatformAdmin
              captures: { l004_en_id: $.data.id }
            - call: "POST /benefits/members/${l004_id}/deposits"
              payload: { enrollment_id: "${l004_en_id}", amount_cents: 200000, posted_at: "2026-09-01T00:00:00Z", holding_id: "${l004_h_id}" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${l004_en_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /benefits/members/${l004_id}/entitlements/reconcile"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "after activation BenefitEntitlement.${l004_ent_id}.entitlement_status == GRANTED and reconciliation_state == IN_SYNC"
            - "after the enrollment is lapsed the row's stored status disagrees with its guard verdict, so a plain GET reports reconciliation_state == DRIFT_REPORTED"
            - "the reconcile call rewrites the row and stamps reconciliation_state == RECONCILED"
            - "a subsequent read reports IN_SYNC and Member.${l004_id}.benefit_entitlement_state == PARTIAL"
            - "the rollup was recomputed on read before the repair rather than being served from a stale field"

      - name: operator_suspends_holdings_bulk_style_and_partial_failures_are_per_item
        claim_type: bulk_operations
        grounds:
          - endpoints.POST_/benefits/holdings/{holding_id}/suspend
          - state_machines.ProductHolding.ADOPTED_to_SUSPENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Three sequential suspends over a mix of ADOPTED and PENDING holdings yield per-item outcomes: the ADOPTED one succeeds, the two PENDING ones each fail independently and the failures do not roll back the success."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-L-005 holds one ADOPTED and two still-PENDING holdings."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-L-005", full_name: "Willa Sena", email: "willa@x.com" }
              as: Anonymous
              captures: { l005_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${l005_id}", product_line: "BANKING", balance_cents: 150000 }
              as: PlatformAdmin
              captures: { l005_h1_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${l005_id}", product_line: "INVESTING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { l005_h2_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${l005_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { l005_h3_id: $.data.id }
            - call: "POST /benefits/holdings/${l005_h1_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${l005_id}"
          trigger:
            - call: "POST /benefits/holdings/${l005_h1_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /benefits/holdings/${l005_h2_id}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the ADOPTED holding suspends successfully with 200 and adoption_status SUSPENDED"
            - "the PENDING holding is refused with 409 ERR_INVALID_STATE, since only ADOPTED holdings can be suspended"
            - "the successful suspend is not rolled back by the later failure"
            - "Member.${l005_id}.product_adoption_count drops to 0 after the suspend, since SUSPENDED rows are excluded"
            - "a third suspend on the still-PENDING CAREER holding fails the same way, independently of the second"

      - name: hard_delete_is_unavailable_so_closed_holdings_remain_queryable
        claim_type: soft_delete
        grounds:
          - entities.ProductHolding.fields.adoption_status
          - state_machines.ProductHolding.ADOPTED_to_CLOSED
          - endpoints.GET_/benefits/holdings
        distinguishing_aspect: "There is no DELETE on a holding; closing sets a terminal enum instead, so the row stays visible in the default list while being excluded from the derived adoption count."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-L-006 holds an ADOPTED INVESTING holding."
          setup_api_calls:
