            - "status remains PROVISIONAL; money fields unchanged"

      - name: occ_audit_certify_stale_rejected
        claim_type: stale_version_occ
        grounds: ["concurrency_rules[audit-certify-stale-version]", "errors[ERR_STALE_VERSION]"]
