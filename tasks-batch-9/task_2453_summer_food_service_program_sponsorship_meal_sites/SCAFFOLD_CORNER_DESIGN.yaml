          - endpoints[GET /sfsp/sponsor-budgets]
        distinguishing_aspect: "Exercises the create/read/list triple on SponsorBudget (not on Sponsor or Site): the POST response, the single GET and the filtered list all agree on the same computed admin_cost_ratio, and the status filter narrows a two-budget list to one row."
