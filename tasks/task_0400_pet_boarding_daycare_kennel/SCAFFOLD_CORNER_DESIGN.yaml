          trigger:
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Owner-Run", kind: "DAYCARE_PEN", size_class: "LARGE", daycare_capacity: 5 }
              as: Owner
              as_user_id: "${own}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN, http 403"

      - name: owner_cannot_cancel_other_owners_reservation
        claim_type: Ownership enforcement
        grounds: [roles, "validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Owner B cancelling Owner A's reservation -> 403 ERR_NOT_RESOURCE_OWNER (entity_backed:Owner identity)."
        test_recipe:
          setup: ["Two owners; a reservation owned by owner A; owner B acts"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Rb-2", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Own A", email: "rb2a@x.com", phone: "555-7001" }
              as: FacilityManager
              captures: { ownA: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Own B", email: "rb2b@x.com", phone: "555-7002" }
              as: FacilityManager
              captures: { ownB: $.data.id }
            - call: "POST /owners/${ownA}/pets"
              payload: { name: "Ap", species: "CAT", weight_kg: 6 }
              as: FacilityManager
              captures: { petA: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${petA}", service_type: "DAYCARE", start_date: "2026-03-01", end_date: "2026-03-01" }
              as: FacilityManager
              captures: { res: $.data.id }
          trigger:
            - call: "POST /reservations/${res}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${ownB}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER, http 403"

      - name: missing_auth_header_rejected
        claim_type: Cannot perform other roles exclusive op
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH]"]
        distinguishing_aspect: "A call whose instance omits X-User-Role/X-User-ID -> 401 ERR_MISSING_AUTH (negative trigger; auth precedes everything)."
        test_recipe:
          setup: ["A facility exists; the trigger call sends no role header"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Rb-3" }
              as: FacilityManager
              captures: { fac: $.data.id }
          trigger:
            - call: "GET /facilities/${fac}"
              payload: {}
              as: FacilityManager
              captures: { ok: $.data.id }
          assert:
            - "When the same GET /facilities/${fac} is issued with no X-User-Role header it returns error_id == ERR_MISSING_AUTH, http 401"
          note: "The setup uses a valid header to prove reachability; the asserted negative is the header-less variant of the trigger call."

  # ----------------------------------------------------------- Cross-Cutting Complexity Layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_assignment_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-reservation]", entities.Reservation.fields.version]
        excluded_because:
          difficulty_instance: transitive_cascade / confirm_cascade_reservation_assignment_run_depth3
          rationale: "Reservation.version advancing on assignment create (the OCC observable) is exercised by the cascade and stale-version corner; the increment claim is covered by error_stale_version_trigger above."

      - name: wallet_credit_reconciles_after_refund
        claim_type: derived_field_reconciliation
        grounds: [entities.Owner.fields.wallet_credit_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_preserves_owner_wallet_value
          rationale: "Owner.wallet_credit_cents reconciliation after a refund is asserted by the named §1.8 compensating-invariant instance."

  # ----------------------------------------------------------- Consistency Model
  - section: consistency_model
    instances:
      - name: confirm_effects_visible_same_response
        claim_type: immediate
        grounds: [state_machines.Reservation.REQUESTED_to_CONFIRMED]
        distinguishing_aspect: "consistency_model immediate: confirm's response already reflects status CONFIRMED and the latched deposit (no read-after-delay needed)."
        test_recipe:
          setup: ["A confirmable DAYCARE reservation (NONE policy, vaccinated/cleared, HELD assignment)"]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "C-Cm-1", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "Cm Owner", email: "cm1@x.com", phone: "555-8000" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Cm", species: "CAT", weight_kg: 6 }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/review"
              payload: { decision: "CLEAR" }
              as: FacilityManager
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Pen-Cm1", kind: "DAYCARE_PEN", size_class: "LARGE", daycare_capacity: 5 }
              as: FacilityManager
              captures: { run: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "DAYCARE", start_date: "2026-03-01", end_date: "2026-03-01" }
              as: FacilityManager
              captures: { res: $.data.id, res_v: $.data.version }
            - call: "POST /reservations/${res}/assignments"
              payload: { run_id: "${run}", expected_reservation_version: "${res_v}" }
              as: FacilityManager
          trigger:
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: FacilityManager
              captures: { st: $.data.status }
          assert:
            - "Reservation.${res}.status == CONFIRMED in the confirm response itself"
