      - name: side_effect_execution_on_the_draw_payment_leg
        claim_type: Side Effect Execution
        excluded_because:
          difficulty_instance: draw_payment_cascades_four_hops_to_construction_complete
          rationale: "That difficulty instance already asserts every side effect of POST /rehab/draw-requests/{id}/pay one by one — retainage withholding, net disbursement, loan disbursed_amount, contract_earned_cents, program-year disbursed/committed movement and the application's advance to CONSTRUCTION_COMPLETE — so a separate side-effect-per-transition probe would duplicate it verbatim."

      - name: cascade_down_from_a_suspended_contractor
        claim_type: Cascade down
        excluded_because:
          difficulty_instance: contractor_suspension_cascades_four_hops_to_a_failed_application
          rationale: "The suspension cascade parent-to-children leg (contractor -> bids -> solicitation -> application) is the asserted point of that difficulty instance; the corner worth keeping separate is the negative one, which this file covers as suspending_a_contractor_spares_a_bid_that_has_already_been_awarded."

      - name: bubble_up_when_the_final_draw_is_paid
        claim_type: Bubble up
        excluded_because:
          difficulty_instance: draw_payment_cascades_four_hops_to_construction_complete
          rationale: "The auto-transition of the parent once the last child is terminal (final DrawRequest PAID -> RehabLoan FULLY_DISBURSED -> RehabApplication CONSTRUCTION_COMPLETE) is exactly hops 2 and 3 of that difficulty chain."

      - name: ledger_sync_of_the_program_year_triad
        claim_type: Ledger sync
        excluded_because:
          difficulty_instance: program_year_money_triad_is_conserved_across_lien_draws_and_close_out_release
          rationale: "That instance reconciles committed / disbursed / uncommitted before and after every state change on the money path, which is the ledger-sync claim in its strongest form."

      - name: compensation_on_contractor_reinstatement
        claim_type: Compensation
        excluded_because:
          difficulty_instance: contractor_reinstatement_restores_the_solicitation_bid_census_without_drift
          rationale: "Undo-and-restore with no drift in bid_count / responsive_bid_count / low_bid_amount_cents is the asserted point of that difficulty instance."

      - name: parallel_workflow_and_compliance_axes
        claim_type: parallel
        excluded_because:
          difficulty_instance: application_workflow_and_compliance_axes_advance_independently
          rationale: "RehabApplication carries two independent state fields and that difficulty instance already walks both axes in interleaved order, asserting the combined state after each step."

      - name: guarded_transition_into_lien_recording
        claim_type: guarded transitions
        excluded_because:
          difficulty_instance: lien_recording_is_gated_by_the_applications_compliance_posture
          rationale: "The cross-entity guard 'RehabLoan STRUCTURED -> LIEN_RECORDED only if the application's compliance_posture is CLEAR or CLEARED_WITH_PROTOCOL' is that instance's whole subject, including both blocking error ids."

