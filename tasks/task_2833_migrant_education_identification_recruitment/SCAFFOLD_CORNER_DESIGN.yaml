  # =========================================================================
  # Table 6 has no claim table of its own - the directive is that every error in
  # the catalogue must be triggerable. The instances below close the gaps left by
  # the sections above; the remaining codes are triggered in `entities`
  # (ERR_STUDENT_NOT_FOUND, ERR_MOVE_NOT_FOUND, ERR_INVALID_REQUEST),
  # `state_machines` (ERR_MOVE_ALREADY_ADJUDICATED, ERR_COE_INVALID_STATE,
  # ERR_COE_NOT_IN_DRAFT, ERR_INTERVIEW_DOCUMENTATION_MISSING), `validations`
  # (ERR_MOVE_NOT_QUALIFYING, ERR_MOVE_DATE_IN_FUTURE, ERR_NO_QC_CANDIDATES),
  # `endpoints` (ERR_DELIVERY_NOT_REVERSIBLE), `rbac` (ERR_UNAUTHORIZED),
  # `complexity_layers` (both 412 codes) and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
  - section: errors
    instances:

      - name: corner_every_entity_path_id_returns_its_own_not_found_code
        claim_type: Error triggerability
        grounds:
          - errors[ERR_AREA_NOT_FOUND]
          - errors[ERR_RECRUITER_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_STUDENT_NOT_FOUND]
          - errors[ERR_MOVE_NOT_FOUND]
          - errors[ERR_INTERVIEW_NOT_FOUND]
          - errors[ERR_COE_NOT_FOUND]
          - errors[ERR_QC_REVIEW_NOT_FOUND]
          - errors[ERR_TERM_NOT_FOUND]
          - errors[ERR_TRANSFER_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_DELIVERY_NOT_FOUND]
          - validations[priority 3 path-existence]
        distinguishing_aspect: "All twelve path-existence codes are distinct and entity-specific: the same unknown identifier used against each of the twelve GET-by-id routes returns 404 with a different error_id each time, so a single shared 'not found' code would fail this."
        test_recipe:
          setup:
            - "empty database, logical clock at its 2026-08-01T00:00:00Z startup default"
            - "no rows of any entity exist, so the identifier 00000000-0000-0000-0000-000000009999 cannot resolve anywhere"
          setup_api_calls: []
          trigger:
            - call: "GET /mep/areas/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/recruiters/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/recruiter-assignments/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/students/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/qualifying-moves/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/interview-records/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/coes/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/qc-reviews/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/eligibility-terms/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/transfer-requests/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/service-plans/00000000-0000-0000-0000-000000009999"
              payload: {}
