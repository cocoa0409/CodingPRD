scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: referral_lag_clinical_trigger_versus_death_note_basis
        grounds:
          - calculations.referral_timeliness_lag
          - entities.DeathReferral.fields.referral_lag_minutes
          - entities.DeathReferral.fields.audit_lag_minutes
          - entities.DeathReferral.fields.timeliness_flag
          - endpoints[GET /opo/hospital-partners/{id}/performance]
        distinguishing_aspect: |
          The two variants of referral_timeliness_lag run on the DeathReferral entity domain: the
          clinical_trigger_basis measures from trigger_event_at (75 minutes, UNTIMELY against the
          60-minute window) while the death_note_basis measures the same stored row from
          death_pronounced_at (30 minutes, TIMELY), so the identical referral reports
          recertification_tier FAIL on one basis and PROBATION on the other.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T11:00:00Z."
            - "One HospitalPartner with timely_referral_window_minutes 60 and no referrals yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", referral_trigger_policy: "VENTILATED_NEURO_INJURY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
          trigger:
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7001", age_years: 52, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-08-10T09:45:00Z", death_pronounced_at: "2026-08-10T10:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "GET /opo/hospital-partners/${hosp_id}/performance"
              payload: { window_days: 365, basis: "CLINICAL_TRIGGER" }
              as: OpoAdmin
              captures: { rate_ct: $.data.timely_referral_rate, tier_ct: $.data.recertification_tier }
            - call: "GET /opo/hospital-partners/${hosp_id}/performance"
              payload: { window_days: 365, basis: "DEATH_NOTE" }
              as: OpoAdmin
              captures: { rate_dn: $.data.timely_referral_rate, tier_dn: $.data.recertification_tier }
          assert:
            - "DeathReferral.${ref_id}.referral_lag_minutes == 75"
            - "DeathReferral.${ref_id}.audit_lag_minutes == 30"
            - "DeathReferral.${ref_id}.timeliness_flag == UNTIMELY"
            - "HospitalPartner.${hosp_id}.untimely_referral_count == 1 and HospitalPartner.${hosp_id}.timely_referral_count == 0"
            - "HospitalPartner.${hosp_id}.timely_referral_rate == 0.00"
            - "${rate_ct} == 0.00 and ${tier_ct} == FAIL"
            - "${rate_dn} == 100.00 and ${tier_dn} == PROBATION"

      - name: behavioral_risk_interview_versus_records_only_variant
        grounds:
          - calculations.behavioral_risk_score
          - entities.EligibilityScreening.fields.risk_score
          - entities.EligibilityScreening.fields.risk_tier
          - entities.EligibilityScreening.fields.risk_variant_applied
          - state_machines.EligibilityScreening.INFO_REQUESTED_to_PENDING
        distinguishing_aspect: |
          The second dual-variant calculation lives on a different entity domain
          (EligibilityScreening risk scoring, not DeathReferral timeliness): with the identical
          reported factor list [IV_DRUG_USE_12MO], interview_based scores 6.50 / STANDARD while
          records_only imputes the three unresolved factors at half weight and scores 15.28 /
          INCREASED_RISK, a delta of 8.78 that flips the tier.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T11:00:00Z."
            - "Two referrals on the same hospital, each with a PENDING EligibilityScreening and risk_score null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7002", age_years: 48, ventilated: true, gcs_score: 3, cause_of_death_category: "HEAD_TRAUMA", trigger_event_at: "2026-08-10T10:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_a_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_a_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_a_id: $.data.id, scr_a_v: $.data.version }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7003", age_years: 48, ventilated: true, gcs_score: 3, cause_of_death_category: "HEAD_TRAUMA", trigger_event_at: "2026-08-10T10:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_b_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_b_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_b_id: $.data.id, scr_b_v: $.data.version }
          trigger:
            - call: "POST /opo/eligibility-screenings/${scr_a_id}/risk-assessment"
              payload: { risk_factors: ["IV_DRUG_USE_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_a_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /opo/eligibility-screenings/${scr_b_id}/risk-assessment"
              payload: { risk_factors: ["IV_DRUG_USE_12MO"], unresolved_factors: ["INCARCERATION_72H_12MO", "NEW_SEX_PARTNER_HIGH_RISK_12MO", "HEMODIALYSIS_12MO"], informant_reliability: "MEDICAL_RECORD_ONLY", expected_screening_version: "${scr_b_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
          assert:
            - "EligibilityScreening.${scr_a_id}.risk_score == 6.50"
            - "EligibilityScreening.${scr_a_id}.risk_tier == STANDARD"
            - "EligibilityScreening.${scr_a_id}.risk_variant_applied == INTERVIEW_BASED"
            - "EligibilityScreening.${scr_b_id}.risk_score == 15.28"
            - "EligibilityScreening.${scr_b_id}.risk_tier == INCREASED_RISK"
            - "EligibilityScreening.${scr_b_id}.risk_variant_applied == RECORDS_ONLY"
            - "EligibilityScreening.${scr_b_id}.risk_score - EligibilityScreening.${scr_a_id}.risk_score == 8.78"

      - name: hospital_lifetime_rate_versus_windowed_recert_denominator
        grounds:
          - calculations.hospital_timeliness_posture
          - entities.HospitalPartner.fields.timely_referral_rate
          - entities.HospitalPartner.fields.partner_posture
          - endpoints[GET /opo/hospital-partners/{id}/performance]
        distinguishing_aspect: |
          The third dual-variant calculation sits on the HospitalPartner entity domain: the
          incremental_lifetime variant counts every referral (3 of 4 timely -> 75.00 ->
          GOOD_STANDING) while the windowed_recert variant restricts the denominator to
          ventilated referrals (0 of 1 timely -> 0.00 -> FAIL) from the identical four rows.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T11:00:00Z."
            - "One hospital with window 60 minutes and four referrals: three non-ventilated and TIMELY, one ventilated and UNTIMELY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Lakeside Regional", hospital_code: "LAKE", referral_trigger_policy: "ALL_VENTILATED_DEATHS", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8001", age_years: 61, ventilated: false, gcs_score: 5, cause_of_death_category: "CVA_STROKE", trigger_event_at: "2026-08-10T10:30:00Z" }
              as: HospitalReferralClerk
              as_user_id: "${hosp_id}"
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8002", age_years: 58, ventilated: false, gcs_score: 6, cause_of_death_category: "CVA_STROKE", trigger_event_at: "2026-08-10T10:30:00Z" }
              as: HospitalReferralClerk
              as_user_id: "${hosp_id}"
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8003", age_years: 44, ventilated: false, gcs_score: 7, cause_of_death_category: "OTHER", trigger_event_at: "2026-08-10T10:30:00Z" }
              as: HospitalReferralClerk
              as_user_id: "${hosp_id}"
          trigger:
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-8004", age_years: 39, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-08-10T09:00:00Z" }
              as: HospitalReferralClerk
              as_user_id: "${hosp_id}"
              captures: { ref_vent_id: $.data.id }
            - call: "GET /opo/hospital-partners/${hosp_id}/performance"
              payload: { window_days: 365, basis: "CLINICAL_TRIGGER" }
              as: OpoAdmin
              captures: { elig_w: $.data.eligible_referral_count, rate_w: $.data.timely_referral_rate, tier_w: $.data.recertification_tier }
          assert:
            - "DeathReferral.${ref_vent_id}.referral_lag_minutes == 120 and DeathReferral.${ref_vent_id}.timeliness_flag == UNTIMELY"
            - "HospitalPartner.${hosp_id}.referral_count == 4 and HospitalPartner.${hosp_id}.timely_referral_count == 3"
            - "HospitalPartner.${hosp_id}.timely_referral_rate == 75.00"
            - "HospitalPartner.${hosp_id}.partner_posture == GOOD_STANDING"
            - "${elig_w} == 1"
            - "${rate_w} == 0.00"
            - "${tier_w} == FAIL"

  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_rounds_each_contribution_before_summing
        grounds:
          - calculations.behavioral_risk_score
          - entities.EligibilityScreening.fields.risk_score
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order is pinned: 6.50 x 1.15 = 7.475 -> 7.48 and
          1.50 x 1.15 = 1.725 -> 1.73 summing to 9.21, whereas the forbidden sum-then-round order
          yields 9.20; the one-cent gap is the whole assertion.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T11:00:00Z."
            - "One referral with a PENDING EligibilityScreening at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7101", age_years: 33, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-08-10T10:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
          trigger:
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["IV_DRUG_USE_12MO", "TATTOO_UNREGULATED_12MO"], informant_reliability: "SECONDARY_CONTACT", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
          assert:
            - "EligibilityScreening.${scr_id}.risk_score == 9.21"
            - "EligibilityScreening.${scr_id}.risk_score != 9.20"
            - "EligibilityScreening.${scr_id}.risk_tier == STANDARD"
            - "EligibilityScreening.${scr_id}.risk_variant_applied == INTERVIEW_BASED"
            - "EligibilityScreening.${scr_id}.version == 2"

      - name: viability_index_nested_min_max_with_pressor_penalty_cap
        grounds:
          - calculations.donor_viability_index
          - entities.PhysiologicObservation.fields.viability_index_snapshot
          - entities.PhysiologicObservation.fields.dmg_bundle_met
          - state_machines.DonorCase.physiologic_status_STABILIZING_to_OPTIMIZED
        distinguishing_aspect: |
          Mode (a) - five inputs interacting non-linearly through tier selection plus a nested
          max(0, base - min(15, 5 x pressor_count)): (320, 65 mmHg, 2 pressors, Na 148, urine 0.7)
          scores 40 + 15 + 20 = 75 OPTIMIZED, while (180, 55 mmHg, 3 pressors, Na 160, urine 0.3)
          has its penalty clamped at 15 so haemodynamics floor at 0 and the index is 15 + 0 + 5 = 20
          DECOMPENSATING - a different combinatorial mode from the rounding-order instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T11:00:00Z."
            - "One DonorCase in physiologic_status STABILIZING, allocation_status NOT_STARTED, case_posture OPEN, with no organs registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7201", age_years: 29, ventilated: true, gcs_score: 3, cause_of_death_category: "HEAD_TRAUMA", trigger_event_at: "2026-08-10T10:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["BLOOD_TRANSFUSION_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /opo/death-referrals/${ref_id}/authorizations"
              payload: { registry_hit: true, registry_document_ref: "REG-7201" }
              as: AuthorizationSpecialist
              as_user_id: "auth-1"
              captures: { auth_id: $.data.id }
            - call: "POST /opo/authorizations/${auth_id}/finalize"
              payload: {}
              as: AuthorizationSpecialist
              as_user_id: "auth-2"
            - call: "POST /opo/donor-cases"
              payload: { referral_id: "${ref_id}", authorization_id: "${auth_id}", donor_code: "D-7201" }
              as: DonorCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /opo/donor-cases/${case_id}/observations"
              payload: { recorded_at: "2026-08-10T10:40:00Z", map_mmhg: 65, pao2_fio2_ratio: 320, sodium: 148, urine_output_ml_per_kg_hr: 0.7, pressor_count: 2 }
              as: DonorCoordinator
              captures: { obs_hi_id: $.data.id }
            - call: "POST /opo/donor-cases/${case_id}/observations"
              payload: { recorded_at: "2026-08-10T10:50:00Z", map_mmhg: 55, pao2_fio2_ratio: 180, sodium: 160, urine_output_ml_per_kg_hr: 0.3, pressor_count: 3 }
              as: DonorCoordinator
              captures: { obs_lo_id: $.data.id }
          assert:
            - "PhysiologicObservation.${obs_hi_id}.viability_index_snapshot == 75"
            - "PhysiologicObservation.${obs_hi_id}.dmg_bundle_met == false"
            - "PhysiologicObservation.${obs_lo_id}.viability_index_snapshot == 20"
            - "DonorCase.${case_id}.viability_index == 20"
            - "DonorCase.${case_id}.physiologic_status == DECOMPENSATING"
            - "DonorCase.${case_id}.case_posture == RESTRICTED"
            - "DonorCase.${case_id}.observation_count == 2 and DonorCase.${case_id}.dmg_bundle_met_count == 0"
            - "DonorCase.${case_id}.allocation_status == NOT_STARTED"

      - name: cold_ischemic_projection_single_pass_prep_tier
        grounds:
          - calculations.cold_ischemic_projection
          - entities.Organ.fields.implant_prep_minutes
          - entities.Organ.fields.projected_cold_ischemic_minutes
          - entities.Organ.fields.projected_cit_margin_minutes
          - endpoints[POST /opo/organs/{id}/transport]
        distinguishing_aspect: |
          Mode (c) - the prep allowance is keyed on the remaining margin while the margin depends on
          the prep allowance; the pinned single pass selects the tier from the provisional margin
          720 - 116 - 500 - 45 = 59 (crash prep 20) and stops, giving 636 / margin 84, whereas
          re-deriving the tier from the final margin would wrongly yield 646 / margin 74.
        test_recipe:
          setup:
            - "A LIVER organ on an authorized donor case has been accepted and cross-clamped at 2026-08-05T06:00:00Z, so its status is RECOVERED."
            - "A FIXED_WING transport asset with concurrent_leg_capacity 2 and no legs assigned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T05:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7301", age_years: 35, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-08-05T04:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["BLOOD_TRANSFUSION_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "POST /opo/death-referrals/${ref_id}/authorizations"
              payload: { registry_hit: true, registry_document_ref: "REG-7301" }
              as: AuthorizationSpecialist
              as_user_id: "auth-1"
              captures: { auth_id: $.data.id }
            - call: "POST /opo/authorizations/${auth_id}/finalize"
              payload: {}
              as: AuthorizationSpecialist
              as_user_id: "auth-2"
            - call: "POST /opo/donor-cases"
              payload: { referral_id: "${ref_id}", authorization_id: "${auth_id}", donor_code: "D-7301" }
              as: DonorCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /opo/donor-cases/${case_id}/organs"
              payload: { organ_type: "LIVER" }
              as: DonorCoordinator
              captures: { organ_id: $.data.id }
            - call: "POST /opo/organs/${organ_id}/evaluation"
              payload: { decision: "ALLOCATABLE" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /opo/organs/${organ_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { organ_v: $.data.version }
            - call: "POST /opo/organs/${organ_id}/match-runs"
              payload: { expected_organ_version: "${organ_v}", primary_offer_slots: 2, candidates: [ { sequence_position: 1, center_code: "CTR-A", candidate_code: "CAND-A", acceptance_clock_minutes: 240 } ] }
              as: AllocationSpecialist
              captures: { run_id: $.data.id }
            - call: "GET /opo/match-runs/${run_id}/offers"
              payload: {}
              as: AllocationSpecialist
              captures: { offer1_id: "$.data[0].id" }
            - call: "POST /opo/match-runs/${run_id}/offers/${offer1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: AllocationSpecialist
              as_user_id: "alloc-1"
            - call: "POST /opo/recovery-teams"
              payload: { team_code: "ABD-1", specialty: "ABDOMINAL", turnaround_buffer_minutes: 90 }
              as: OpoAdmin
              captures: { team_id: $.data.id }
            - call: "POST /opo/donor-cases/${case_id}/recovery-operations"
              payload: { recovery_team_id: "${team_id}", or_start_at: "2026-08-05T05:30:00Z", or_end_at: "2026-08-05T09:30:00Z" }
              as: RecoveryLogistics
              captures: { op_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/recovery-operations/${op_id}/cross-clamp"
              payload: {}
              as: RecoveryLogistics
            - call: "POST /opo/transport-assets"
              payload: { asset_code: "JET-1", mode: "FIXED_WING", concurrent_leg_capacity: 2 }
              as: OpoAdmin
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /opo/organs/${organ_id}/transport"
              payload: { transport_asset_id: "${asset_id}", transport_mode: "FIXED_WING", transport_depart_at: "2026-08-05T07:56:00Z", transport_arrive_at: "2026-08-05T16:16:00Z" }
              as: RecoveryLogistics
          assert:
            - "Organ.${organ_id}.cross_clamp_at == 2026-08-05T06:00:00Z"
            - "Organ.${organ_id}.transit_minutes == 500"
            - "Organ.${organ_id}.implant_prep_minutes == 20"
            - "Organ.${organ_id}.projected_cold_ischemic_minutes == 636"
            - "Organ.${organ_id}.projected_cit_margin_minutes == 84"
            - "Organ.${organ_id}.projected_cold_ischemic_minutes != 646"
            - "Organ.${organ_id}.cit_limit_minutes == 720 and Organ.${organ_id}.status == RECOVERED"

  - rule_id: non_linear_state_machine
    instances:
      - name: screening_info_request_cycle_capped_at_two_loops
        grounds:
          - state_machines.EligibilityScreening.PENDING_to_INFO_REQUESTED
          - state_machines.EligibilityScreening.INFO_REQUESTED_to_PENDING
          - validations[priority 77]
          - errors.ERR_INFO_REQUEST_LIMIT_REACHED
        distinguishing_aspect: |
          Cyclic shape on EligibilityScreening: the pair PENDING -> INFO_REQUESTED -> PENDING is
          traversed twice with info_request_count climbing 0 -> 1 -> 2, and the third entry into the
          loop is refused with ERR_INFO_REQUEST_LIMIT_REACHED (409) while the row stays PENDING, so
          the cycle has a bounded termination condition rather than being a re-enterable loop.
        test_recipe:
          setup:
