      - name: data_file_variance_hold_loops_back_to_received
        grounds:
          - state_machines.DataFile.FORMAT_VALIDATED_to_HELD_VARIANCE
          - state_machines.DataFile.HELD_VARIANCE_to_RECEIVED
          - state_machines.DataFile.FORMAT_VALIDATED_to_ACCEPTED
          - calculations.data_file_control_reconciliation
          - entities.DataFile.fields.amendment_count
