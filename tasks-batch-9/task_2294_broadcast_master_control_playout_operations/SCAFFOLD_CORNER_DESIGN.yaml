      - name: arm_variance_is_permitted_at_exactly_thirty_seconds_and_refused_at_thirty_one
        claim_type: Precondition Enforcement
        grounds: "§1.2 Playlist VALIDATED -> ARMED precondition '|projected_end_variance_seconds| <= ARM_VARIANCE_TOLERANCE_SECONDS (30)'; §1.3 playlist_projected_end (PROJECTED basis); §1.4 priority 35 ERR_ARM_VARIANCE_EXCEEDED"
        distinguishing_aspect: "Two structurally identical playlists differ by one second of scheduled duration: variance +30 arms, variance +31 is refused. The tolerance is inclusive and symmetric, so this pins both the comparison operator and the sign handling."
