      - call: POST /rtw/placements/${pl_id}/submit-to-adjuster
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          dir_id: $.data.current_adjuster_directive_id
      - call: GET /rtw/transitional-jobs/${job_id}
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          seats1: $.data.filled_seats
      - call: POST /rtw/placements/${pl_id}/terminate
        payload:
          reason: Worker declined the assignment
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          pstat: $.data.placement_status
      - call: GET /rtw/transitional-jobs/${job_id}
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          seats2: $.data.filled_seats
      - call: GET /rtw/placements/${pl_id}/adjuster-directives
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          dstat: $.data[0].directive_status
      assert:
      - ${seats0} == 0
      - ${seats1} == 1
      - ${pstat} == DECLINED
      - ${seats2} == 0
      - ${seats2} == ${seats0}
      - ${dstat} == SUPERSEDED
      - Placement.${pl_id}.decline_reason == "Worker declined the assignment"
  - name: wage_ledger_total_conserved_across_post_and_reverse
    grounds:
    - entities.Claim.fields.wage_differential_paid_cents
    - entities.WageDifferentialEntry.fields.entry_status
    - entities.WageDifferentialEntry.fields.reverses_entry_id
    - endpoints.POST /rtw/wage-differential-entries/{id}/reverse
    distinguishing_aspect: 'Conserved quantity 2 is money in whole cents, a different conserved quantity from the seat count: Claim.wage_differential_paid_cents must always equal the sum of net_amount_cents
      over every ledger row of the claim, so posting 55003 and then reversing it leaves the claim total back at exactly 0 while both rows remain on the ledger.'
    test_recipe:
      setup:
      - One ACTIVE Placement whose claim has an empty wage ledger (wage_differential_paid_cents 0).
      - Five logged_hours rows are not required because the posted entry uses the PROVISIONAL variant.
      setup_api_calls:
      - call: POST /rtw/employees
        payload:
          full_name: Dana Ruiz
          employee_number: EMP-2201
          department_code: WHS
          pre_injury_weekly_wage_cents: 120000
          pre_injury_weekly_hours: 40
          benefit_tier: TIER_B
        as: ProgramAdmin
        captures:
          emp_id: $.data.id
      - call: POST /rtw/employees/${emp_id}/claims
        payload:
          claim_number: CLM-2201
          adjuster_user_id: adj-001
          injury_date: '2026-06-15'
        as: ProgramAdmin
        captures:
          claim_id: $.data.id
      - call: POST /rtw/claims/${claim_id}/adjuster-authorization
        payload:
          max_authorized_weekly_cost_cents: 150000
          claim_status_directive: RTW_ELIGIBLE
        as: ClaimAdjuster
        as_user_id: adj-001
        captures:
          claim_v: $.data.version
      - call: POST /rtw/treating-providers
        payload:
          full_name: Imani Okafor
          npi: '1234567890'
          specialty: Occupational Medicine
          credential_status: VERIFIED
        as: ProgramAdmin
        captures:
          prov_id: $.data.id
      - call: POST /rtw/supervisors
        payload:
          full_name: Sam Ortiz
          department_code: WHS
        as: ProgramAdmin
        captures:
          sup_id: $.data.id
      - call: POST /rtw/supervisors/${sup_id}/training-records
        payload:
          curriculum_code: RTW_CORE
          completed_on: '2026-05-01'
          valid_through: '2027-05-01'
        as: ProgramAdmin
        captures:
          train_id: $.data.id
      - call: POST /rtw/transitional-jobs
        payload:
          supervisor_id: ${sup_id}
          title: Parts Sorter
          department_code: WHS
          seat_capacity: 2
          demand_lift_lbs: 10
          demand_standing_minutes: 15
          demand_hours_per_day: 4
          demand_keyboard_minutes_per_hour: 20
          hourly_rate_cents: 1875
          risk_class: LOW
        as: ProgramAdmin
        captures:
          job_id: $.data.id
      - call: POST /rtw/claims/${claim_id}/restriction-sets
        payload:
          treating_provider_id: ${prov_id}
          expected_claim_version: ${claim_v}
          effective_from: '2026-08-01'
          valid_through: '2026-11-30'
          max_lift_lbs: 20
          max_continuous_standing_minutes: 30
          max_hours_per_day: 6
          keyboard_minutes_per_hour: 45
          overhead_reach_allowed: false
          driving_allowed: false
        as: TreatingProvider
        as_user_id: ${prov_id}
        captures:
          rs_id: $.data.id
      - call: POST /rtw/restriction-sets/${rs_id}/submit
        payload: {}
        as: TreatingProvider
        as_user_id: ${prov_id}
      - call: POST /rtw/restriction-sets/${rs_id}/verify
        payload: {}
        as: OccHealthNurse
        as_user_id: nurse-1
      - call: POST /rtw/restriction-sets/${rs_id}/activate
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          rs_v: $.data.version
      - call: POST /rtw/placements
        payload:
          restriction_set_id: ${rs_id}
          transitional_job_id: ${job_id}
          start_date: '2026-08-03'
          end_date: '2026-08-28'
          scheduled_hours_per_day: 4
          expected_restriction_set_version: ${rs_v}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          pl_id: $.data.id
      - call: POST /rtw/placements/${pl_id}/submit-to-adjuster
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          dir_id: $.data.current_adjuster_directive_id
      - call: POST /rtw/adjuster-directives/${dir_id}/decide
        payload:
          decision: AUTHORIZED
          authorized_weekly_cost_cents: 120000
        as: ClaimAdjuster
        as_user_id: adj-001
      - call: POST /rtw/placements/${pl_id}/activate
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
      - call: GET /rtw/claims/${claim_id}
        payload: {}
        as: ProgramAdmin
        captures:
          paid0: $.data.wage_differential_paid_cents
      trigger:
      - call: POST /rtw/placements/${pl_id}/wage-differential-entries
        payload:
          variant: PROVISIONAL
          period_start: '2026-08-03'
          period_end: '2026-08-07'
        as: ProgramAdmin
        captures:
          e_id: $.data.id
          e_net: $.data.net_amount_cents
      - call: GET /rtw/claims/${claim_id}
        payload: {}
        as: ProgramAdmin
        captures:
          paid1: $.data.wage_differential_paid_cents
      - call: POST /rtw/wage-differential-entries/${e_id}/reverse
        payload:
          reason: Period reopened by the adjuster
        as: ProgramAdmin
        captures:
          rev_id: $.data.id
          rev_net: $.data.net_amount_cents
          rev_link: $.data.reverses_entry_id
          rev_status: $.data.entry_status
      - call: GET /rtw/claims/${claim_id}
        payload: {}
        as: ProgramAdmin
        captures:
          paid2: $.data.wage_differential_paid_cents
      - call: GET /rtw/wage-differential-entries/${e_id}
        payload: {}
        as: ProgramAdmin
        captures:
          orig_status: $.data.entry_status
      assert:
      - ${paid0} == 0
      - ${e_net} == 55003
      - ${paid1} == 55003
      - ${rev_net} == -55003
      - ${rev_link} == ${e_id}
      - ${rev_status} == REVERSAL
      - ${orig_status} == REVERSED
      - ${paid2} == 0
      - ${paid2} == ${paid0}
