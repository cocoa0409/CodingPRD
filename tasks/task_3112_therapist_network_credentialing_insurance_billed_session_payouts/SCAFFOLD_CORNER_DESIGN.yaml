  - section: calculations
    instances:

      - name: resolved_rate_selects_the_highest_rate_set_version_on_overlapping_windows
        claim_type: Correct Result
        grounds:
          - calculations.resolved_session_rate_cents
          - calculations.resolved_session_rate_cents.variants.primary_state_rate
          - endpoints.POST_/network/payers/{id}/rates
        distinguishing_aspect: "When two rate rows for the same payer, license type, geography and code both cover the service date, the higher rate_set_version wins outright rather than averaging, summing or taking the earlier-published row."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; base setup plus a second rate row at version 2 with a higher rate, both covering the service date."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 2, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 18000, effective_from: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
          trigger:
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
          assert:
            - "GET /network/payers/${payer_id}/rates?license_type=LCSW&geography=CA returns exactly 2 rows"
            - "the session on 2026-06-03T16:00:00Z is billed at the version 2 rate: the resolved rate is 18000, not 15000 and not the 16500 average"
            - "the resolved rate is drawn from the row with the strictly higher rate_set_version, and both candidate windows cover the service date"

      - name: resolved_rate_ignores_a_rate_row_whose_end_instant_has_already_passed
        claim_type: Input Set Filtering
        grounds:
          - calculations.resolved_session_rate_cents
          - calculations.resolved_session_rate_cents.input_set
          - errors.ERR_TIMELY_FILING_EXPIRED
          - endpoints.POST_/network/claims
        distinguishing_aspect: "Rate selection is half-open on both ends, so a row covering the window up to and including 2026-06-03T16:00:00Z is out of the candidate set for a session starting at exactly that instant, and the fallback row governs instead."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; a version 1 row expiring at exactly the session start, a version 2 open-ended row at a different amount, and a far-future session so the new-clinician differential is skipped."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 1, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 15000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-03T16:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 2, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 16000, effective_from: "2026-06-03T16:00:00Z" }
              as: OpsAdmin
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
          trigger:
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
          assert:
            - "Session.${session_id}.quoted_cost_share_cents == 5060, derived from the version 2 rate of 16000 rather than the version 1 rate of 15000"
            - "the version 1 window is excluded because its effective_to is open-ended-exclusive and equals the session start exactly; the version 2 window is included because its effective_from is inclusive at that same instant"
            - "had the version 2 row carried effective_from 2026-06-03T16:00:01Z the candidate set would have been empty and the resolved rate would have been 0"

      - name: resolved_rate_is_zero_when_the_license_cannot_telehealth_into_the_patient_state
        claim_type: Constants Applied
        grounds:
          - calculations.resolved_session_rate_cents
          - entities.License.fields.telehealth_eligible
        distinguishing_aspect: "The telehealth gate short-circuits the differential steps entirely: with telehealth_eligible false on the only license, a VIDEO session resolves to the pinned non-eligible constant of 0 rather than to the 15000-contract rate the geography rows would otherwise supply."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; base setup except the license carries telehealth_eligible false, and the session is VIDEO."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - *c_clinician
            - call: "POST /network/clinicians/${clinician_id}/licenses"
              payload: { license_number: "LCSW-CA-55401", license_type: "LCSW", issuing_state: "CA", expires_on: "2027-06-30T00:00:00Z", telehealth_eligible: false }
              as: OpsAdmin
              captures: { license_id: $.data.id }
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
