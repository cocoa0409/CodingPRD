            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 100.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2026-08-01T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${cont_id}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
            - { call: "POST /hazwaste/containers/${cont_id}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-400", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${cont_id}", quantity_kg: 100.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_id: "$.data.id" } }
            - { call: "POST /hazwaste/manifests/${man_id}/ldr-notifications", payload: { treatment_standard_codes: ["TLV-01"], certification_statement: "certified" }, as: EHSManager }
          trigger:
