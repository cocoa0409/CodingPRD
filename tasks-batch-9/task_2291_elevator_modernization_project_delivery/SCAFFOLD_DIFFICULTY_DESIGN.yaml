            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
            - call: "POST /outage-windows/${ow1_id}/activate"
              as: ServiceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /outage-windows/${ow2_id}/activate"
              as: ServiceManager
          assert:
            - "The first activation (w1) returned HTTP 200 and ElevatorGroup.${g_id}.cars_in_service == 2, exactly meeting min_cars_in_service == 2"
            - "The trigger returns HTTP 409 with error_id ERR_GROUP_SERVICE_FLOOR"
