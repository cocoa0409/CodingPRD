            - "AGGREGATE COUNTERS COVER ONLY THE NOTES THAT MOVED: ${bk_r1_marked} == 1, ${bk_r1_fees} == 1 and ${bk_r1_late} == 1 — note P alone, out of three notes in the system"
            - "note P absorbed the work: ${bk_p_stage} == 'LATE', ${bk_p_fees} == 4497 and ${bk_p_count} == 1, with ${bk_p_pd_num} == 1"
            - "note Q was SKIPPED, not failed: ${bk_q_stage} == 'CURRENT', ${bk_q_fees} == 0, ${bk_q_count} == 0, GET /agreements/${bk_q}/late-fees returns total_count == 0, and ${bk_q_paid_num} == 1 with ${bk_q_paid_amt} == 89941"
