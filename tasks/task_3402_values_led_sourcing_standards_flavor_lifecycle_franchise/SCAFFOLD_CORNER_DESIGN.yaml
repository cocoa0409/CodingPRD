              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409); no blended_score, no premium"

      - name: slot_create_exceeding_plant_capacity_rejected
        claim_type: violation_to_error
        grounds: [calculations.slot_capacity_consumption, "errors[ERR_PLANT_CAPACITY_EXCEEDED]", "validations[priority=20]"]
        distinguishing_aspect: "A chunk-heavy flavor (chunk_load_pct 25 -> factor 1.5) with 54000 planned pints consumes ceil(540*1.5) = 810 units, exceeding VT_ST_ALBANS' 800-unit shift pool."
        test_recipe:
          setup: ["Flavor TEST_BATCH with chunk_load_pct 25, swirl_load_pct 0"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Chunk Monster", base_type: "DAIRY", chunk_load_pct: 25, swirl_load_pct: 0, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
          trigger:
            - call: "POST /creamery/production-slots"
              payload: { plant_code: "VT_ST_ALBANS", flavor_id: "${f_id}", production_date: "2026-10-05", shift: "DAY", planned_pints: 54000 }
              as: PlantScheduler
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PLANT_CAPACITY_EXCEEDED (HTTP 422); 810 units > 800 capacity"

  - section: calculations
    instances:
      - name: premium_tier_below_bar_pays_zero
        claim_type: correct_result
        grounds: [calculations.farm_premium_payment]
        distinguishing_aspect: "Below the 60-point program bar the tier is 0% and the gross is exactly 0 — the excess-volume bonus does NOT apply when the tier is 0 (blended 59, volume above baseline)."
        test_recipe:
          setup: ["Enrollment ASSESSED with env 59 / welfare 59 -> blended 59; payment declared 10000 over baseline 8000, price 45"]
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "Below Bar Farm", region: "VT", herd_size: 70, season_year: 2026, baseline_volume_liters: 8000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 59, welfare_practice_score: 59 }
              as: DairyProgramManager
              captures: { blended: $.data.blended_score }
          trigger:
            - call: "POST /creamery/enrollments/${e_id}/premium-payments"
              payload: { period: "Q3", declared_volume_liters: 10000, commodity_price_cents_per_liter: 45 }
              as: DairyProgramManager
              captures: { p_id: $.data.id, gross: $.data.gross_amount_cents, pct: $.data.premium_pct }
          assert:
            - "blended == 59"
            - "pct == 0 and gross == 0 (no premium, no excess bonus below the bar)"

      - name: audit_composite_weighted_and_findings_gate
        claim_type: constants_applied
        grounds: [calculations.audit_social_composite]
        distinguishing_aspect: "Composite uses the 0.4/0.3/0.3 weights (80/70/60 -> 71) and the findings gate independently: 90/90/90 with findings_count 3 is FAIL despite composite 90 >= 70."
        test_recipe:
          setup: ["Supplier with two audits: A scores 80/70/60 findings 0; B scores 90/90/90 findings 3"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Gate Supplier", country_code: "US", ingredient_category: "NUTS" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a1_id: $.data.id }
            - call: "POST /creamery/audits/${a1_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a1_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
              captures: { comp1: $.data.composite_score, out1: $.data.outcome }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-06T00:00:00Z" }
              as: SourcingManager
              captures: { a2_id: $.data.id }
            - call: "POST /creamery/audits/${a2_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-2"
            - call: "POST /creamery/audits/${a2_id}/complete"
              payload: { labor_score: 90, environment_score: 90, community_score: 90, findings_count: 3 }
              as: SustainabilityAuditor
              as_user_id: "aud-2"
              captures: { comp2: $.data.composite_score, out2: $.data.outcome }
          trigger: []
          assert:
            - "comp1 == 71 and out1 == PASS"
            - "comp2 == 90 and out2 == FAIL (findings_count 3 > 2 gate overrides composite)"

      - name: slot_units_chunk_swirl_multiplicative
        claim_type: correct_result
        grounds: [calculations.slot_capacity_consumption]
        distinguishing_aspect: "Chunk and swirl factors multiply: chunk 25 / swirl 20 on 500 pints yields ceil(5 * 1.5 * 1.25) = ceil(9.375) = 10 units; a plain formulation of the same size consumes 5."
        test_recipe:
          setup: ["Flavor HEAVY chunk 25 swirl 20; flavor PLAIN chunk 5 swirl 5; one slot each at different plants"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Heavy Chunk", base_type: "DAIRY", chunk_load_pct: 25, swirl_load_pct: 20, pint_price_cents: 150 }
              as: FlavorManager
              captures: { fh_id: $.data.id }
            - call: "POST /creamery/flavors"
              payload: { name: "Plain Jane", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { fp_id: $.data.id }
          trigger:
            - call: "POST /creamery/production-slots"
              payload: { plant_code: "VT_WATERBURY", flavor_id: "${fh_id}", production_date: "2026-10-05", shift: "DAY", planned_pints: 500 }
              as: PlantScheduler
              captures: { heavy_units: $.data.capacity_units }
            - call: "POST /creamery/production-slots"
              payload: { plant_code: "VT_WATERBURY", flavor_id: "${fp_id}", production_date: "2026-10-05", shift: "DAY", planned_pints: 500 }
              as: PlantScheduler
              captures: { plain_units: $.data.capacity_units }
          assert:
            - "heavy_units == 10"
            - "plain_units == 5"

      - name: order_total_nonpartner_no_discount
        claim_type: correct_result
        grounds: [calculations.supply_order_total]
        distinguishing_aspect: "FRANCHISEE shops get no discount: 3x199 + 1x299 totals exactly 896 cents; the partner discount only applies to NONPROFIT_PARTNER."
        test_recipe:
          setup: ["FRANCHISEE shop SITE_REVIEW (no approval needed to create orders? orders require nothing at create); flavors priced 199 and 299"]
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Full Price Shop", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 100000 }
              as: FranchiseAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /creamery/flavors"
              payload: { name: "Price A", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 199 }
              as: FlavorManager
              captures: { fa_id: $.data.id }
            - call: "POST /creamery/flavors"
              payload: { name: "Price B", base_type: "NON_DAIRY", chunk_load_pct: 0, swirl_load_pct: 0, pint_price_cents: 299 }
              as: FlavorManager
              captures: { fb_id: $.data.id }
          trigger:
            - call: "POST /creamery/scoop-shops/${shop_id}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "${fa_id}", quantity_pints: 3 }, { flavor_id: "${fb_id}", quantity_pints: 1 }] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { total: $.data.total_cents }
          assert:
            - "total == 896 (no discount for FRANCHISEE)"

      - name: claim_coverage_verified_empty_set_zero
        claim_type: input_set_filtering
        grounds: [calculations.claim_coverage]
        distinguishing_aspect: "Substantiating with only a PENDING certification yields declared coverage from that cert (100.0) but verified coverage exactly 0 — the VERIFIED status filter empties the input set."
        test_recipe:
          setup: ["Supplier PROSPECT with one PENDING cert (declared 100); flavor TEST_BATCH"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Pending Cert Dairy", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-PD", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z", declared_coverage_pct: 100 }
              as: SourcingManager
              captures: { c_id: $.data.id }
            - call: "POST /creamery/flavors"
              payload: { name: "Unverified Ube", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v: $.data.version }
          trigger:
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "FAIR_TRADE_SOURCING", certification_ids: ["${c_id}"], expected_flavor_version: "${f_v}" }
              as: FlavorManager
              captures: { cov_d: $.data.claim_coverage_declared_pct, cov_v: $.data.claim_coverage_verified_pct }
          assert:
            - "cov_d == 100.0 (declared basis counts the PENDING cert)"
            - "cov_v == 0 (no VERIFIED certs in the cited set)"

      - name: enrollment_reassessment_updates_blended
        claim_type: derived_field_reconciliation
        grounds: [state_machines.FarmProgramEnrollment.ASSESSED_to_ASSESSED, entities.FarmProgramEnrollment.fields.blended_score]
        distinguishing_aspect: "Re-assessment updates blended_score (60 -> 90) but does NOT recompute an already-created payment's gross_amount_cents (stays 10000)."
        test_recipe:
          setup: ["Enrollment assessed 60/60 (blended 60); payment declared 5000, baseline 5000, price 40 -> gross 10000"]
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "Reassess Ranch", region: "VT", herd_size: 60, season_year: 2026, baseline_volume_liters: 5000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 60, welfare_practice_score: 60 }
              as: DairyProgramManager
            - call: "POST /creamery/enrollments/${e_id}/premium-payments"
              payload: { period: "Q1", declared_volume_liters: 5000, commodity_price_cents_per_liter: 40 }
              as: DairyProgramManager
              captures: { p_id: $.data.id, gross0: $.data.gross_amount_cents }
          trigger:
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 90, welfare_practice_score: 90 }
              as: DairyProgramManager
              captures: { blended2: $.data.blended_score }
            - call: "GET /creamery/premium-payments/${p_id}"
              as: DairyProgramManager
              captures: { gross1: $.data.gross_amount_cents }
          assert:
            - "gross0 == 10000 (5000*40*0.05 at blended 60)"
            - "blended2 == 90 after re-assessment"
            - "gross1 == 10000 (existing payment not recomputed)"

  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /creamery/flavors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (HTTP 401); note the 404 would be reachable only after auth passes"

      - name: fan_cannot_create_supplier_unauthorized
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Fan is not in POST /creamery/suppliers roles; rejected 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /creamery/suppliers"
              payload: { name: "Fan Supplier", country_code: "US", ingredient_category: "DAIRY" }
              as: Fan
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED (HTTP 403)"

      - name: shop_operator_cannot_touch_other_shop
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "ShopOperator with X-User-ID of shop A placing an order under shop B's path id is rejected ERR_FORBIDDEN_OWNERSHIP (ownership compares X-User-ID to the ScoopShop id)."
        test_recipe:
          setup: ["Two shops A and B (SITE_REVIEW)"]
          setup_api_calls:
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Shop A", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 100000 }
              as: FranchiseAdmin
              captures: { shop_a: $.data.id }
            - call: "POST /creamery/scoop-shops"
              payload: { name: "Shop B", operator_type: "FRANCHISEE", city: "Reno", country_code: "US", credit_limit_cents: 100000 }
              as: FranchiseAdmin
              captures: { shop_b: $.data.id }
          trigger:
            - call: "POST /creamery/scoop-shops/${shop_b}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", quantity_pints: 1 }] }
              as: ShopOperator
              as_user_id: "${shop_a}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_OWNERSHIP (HTTP 403); ownership (priority 3) precedes flavor-existence (priority 7)"

      - name: auditor_cannot_verify_own_audit_sod
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_SOD_AUDITOR_VERIFY]"]
        distinguishing_aspect: "Segregation of duties: the auditor who performed the audit (auditor_user_id) cannot verify it, even though AuditVerifier role is correct — same person, different hat."
        test_recipe:
          setup: ["Audit COMPLETED by aud-1 (who also holds an AuditVerifier identity)"]
