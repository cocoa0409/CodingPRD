  - rule_id: resource_temporal_overlap
    instances:
      - name: box_appointment_overlap_half_open
        grounds:
          - state_machines.AccessAppointment.BOOKED_to_CHECKED_IN
          - errors[ERR_APPOINTMENT_OVERLAP]
          - entities.AccessAppointment.fields.scheduled_start
          - entities.AccessAppointment.fields.scheduled_end
        distinguishing_aspect: |
          Half-open [start, end) intervals on the SAME box: appt2 [10:30,11:30) overlaps appt1
          [10:00,11:00) → ERR_APPOINTMENT_OVERLAP. An adjacent appt [11:00,12:00) would be accepted
          (no buffer). Resource = Box.
