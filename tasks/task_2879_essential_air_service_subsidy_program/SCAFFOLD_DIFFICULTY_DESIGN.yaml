              as_user_id: "officer-1"
              captures: { agr_id: $.data.id }
          assert:
            - "After the first REOPEN: Solicitation.${sol_id}.round_number == 2 and status == OPEN"
            - "After the first REOPEN: Proposal.${p1_id}.evaluation_state == EXPIRED"
            - "After the first REOPEN: Proposal.${p1_id}.submission_state == SUBMITTED"
            - "After the second CLOSE: Proposal.${p1_id}.evaluation_state == EXPIRED (the CLOSE side effect only lifts NOT_EVALUATED rows)"
            - "The selection order on the all-expired pool returns 409 with ${no_candidates_error_id} == ERR_NO_ELIGIBLE_PROPOSALS and Solicitation.${sol_id}.status stays CLOSED"
            - "After the second REOPEN: Solicitation.${sol_id}.round_number == 3"
            - "After the third CLOSE: Proposal.${p2_id}.evaluation_state == UNDER_EVALUATION"
            - "Solicitation.${sol_id}.status == AWARDED and candidate_count_at_award == 1"
            - "Solicitation.${sol_id}.selected_proposal_id == ${p2_id}"
            - "Proposal.${p1_id}.evaluation_state == EXPIRED and Proposal.${p1_id}.composite_score is null"
            - "ServiceAgreement.${agr_id}.carrier_id == ${car2_id}"

      - name: proposal_withdrawal_leaves_evaluation_dimension_frozen
        grounds:
          - state_machines.Proposal.submission_state
          - state_machines.Proposal.evaluation_state
          - calculations.carrier_selection_ranking
          - entities.Proposal.fields.evaluation_state
        non_linear_feature: "parallel dimensions — submission_state and evaluation_state advance independently on the same row, so a WITHDRAW moves one dimension to its terminal state while the other stays frozen mid-flight at UNDER_EVALUATION and never reaches SELECTED or NOT_SELECTED"
        distinguishing_aspect: |
          Unlike the reopen cycle (one dimension, revisited states) this instance never revisits a
          state at all: the difficulty is that the combined state (WITHDRAWN, UNDER_EVALUATION) is
          reachable and legal, silently removes the row from the candidate set, and therefore hands
          the award to the runner-up even though the withdrawn row still carries a live evaluation
          state and no composite_score is ever written to it.
