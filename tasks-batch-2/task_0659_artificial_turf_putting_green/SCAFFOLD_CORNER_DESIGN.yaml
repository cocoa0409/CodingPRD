  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_quote_accept
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-accept-stale-project]
          - errors[ERR_STALE_PROJECT_VERSION]
          - entities.Project.fields.version
        distinguishing_aspect: "Accepting a quote with expected_project_version one behind the current Project.version (a sibling SENT quote's prior mutation bumped it) returns ERR_STALE_PROJECT_VERSION (412); the correct current version succeeds."
        test_recipe:
          setup: ["STANDARD project with one SENT quote q1; the client captured the project version, then an additional SENT quote q2 was created which bumped Project.version, making the captured value stale."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust OCC", email: "cocc@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-OCC", name: "OCC Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-OCC", name: "OCC Infill", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "28 Test St" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { m_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${m_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { d_id: $.data.id }
            - call: "POST /design-layouts/${d_id}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${d_id}", base_depth_in: 3 }
              as: SalesRep
              captures: { s_id: $.data.id }
            - call: "POST /base-prep-scopes/${s_id}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${d_id}", base_prep_scope_id: "${s_id}", deposit_pct: 0.30 }
              as: SalesRep
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OpsAdmin
              captures: { v_stale: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${d_id}", base_prep_scope_id: "${s_id}", deposit_pct: 0.40 }
              as: SalesRep
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/send"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${v_stale}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OpsAdmin
              captures: { v_fresh: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${v_fresh}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st: $.data.status }
          assert:
            - "stale accept (expected_project_version == ${v_stale}) returns ERR_STALE_PROJECT_VERSION (412)"
            - "fresh accept (expected_project_version == ${v_fresh}) succeeds; Quote.${q1}.status == ACCEPTED"
            - "Project.${proj_id}.finance_status == DEPOSIT_DUE"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Project.fields.version
          - state_machines.Project.workflow_status.DRAFT_to_MEASURED
        distinguishing_aspect: "Project.version starts at 1 and increments by exactly 1 on each mutation (create=1, first site-measure bumps to 2)."
        test_recipe:
          setup: ["A DRAFT project (version 1)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust Ver", email: "cver@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "29 Test St" }
              as: SalesRep
              captures: { proj_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OpsAdmin
              captures: { v1: $.data.version }
          assert:
            - "Project.${proj_id}.version == 1 at create"
            - "Project.${proj_id}.version == 2 after first site-measure; workflow_status == MEASURED"

