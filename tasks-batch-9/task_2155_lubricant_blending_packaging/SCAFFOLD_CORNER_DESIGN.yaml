              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
              captures: { spec1_v: $.data.version }
            - call: "POST /blend-recipes"
              payload: { product_spec_id: "${spec1}", total_mass_basis_kg: 1000.0, components: [ { component_code: "GRP2-150N", component_type: "BASE_OIL", mass_fraction_pct: 84.00, nominal_kv100_cst: 5.200, additive_family: "NONE" }, { component_code: "OCP-VII", component_type: "VI_IMPROVER", mass_fraction_pct: 6.00, nominal_kv100_cst: 850.000, additive_family: "NONE" }, { component_code: "ADD-SN-PLUS", component_type: "ADDITIVE_PACKAGE", mass_fraction_pct: 10.00, nominal_kv100_cst: 105.000, additive_family: "ZDDP_PCMO" } ] }
              as: ProductManager
              captures: { recipe1: $.data.id }
            - call: "POST /blend-recipes/${recipe1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /approval-claims"
              payload: { product_spec_id: "${spec1}", claim_body: "API", claim_code: "API SP" }
              as: ComplianceOfficer
              captures: { claim1: $.data.id }
            - call: "POST /approval-claims/${claim1}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /approval-claims/${claim1}/decision"
              payload: { decision: "APPROVE", licence_number: "API-1234" }
              as: ComplianceOfficer
            - call: "POST /product-specs/${spec1}/change-requests"
              payload: { requested_kv100_cst: 7.700, requested_kv100_tolerance_pct: 3.0, requested_min_additive_treat_pct: 8.00, requested_additive_family: "ZDDP_PCMO", expected_product_spec_version: "${spec1_v}" }
              as: ProductManager
              captures: { scr1: $.data.id }
            - call: "POST /spec-change-requests/${scr1}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /spec-change-requests/${scr1}/viscosity-review"
              payload: { decision: "CLEAR" }
              as: QualityManager
            - call: "POST /spec-change-requests/${scr1}/approval-review"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /spec-change-requests/${scr1}/make-effective"
              payload: {}
              as: ProductManager
            - call: "POST /blend-recipes"
              payload: { product_spec_id: "${spec1}", total_mass_basis_kg: 1000.0, components: [ { component_code: "GRP2-150N", component_type: "BASE_OIL", mass_fraction_pct: 84.00, nominal_kv100_cst: 5.200, additive_family: "NONE" }, { component_code: "OCP-VII", component_type: "VI_IMPROVER", mass_fraction_pct: 6.00, nominal_kv100_cst: 850.000, additive_family: "NONE" }, { component_code: "ADD-SN-PLUS", component_type: "ADDITIVE_PACKAGE", mass_fraction_pct: 10.00, nominal_kv100_cst: 105.000, additive_family: "ZDDP_PCMO" } ] }
              as: ProductManager
              captures: { recipe2: $.data.id }
            - call: "POST /blend-recipes/${recipe2}/activate"
              payload: {}
              as: ProductManager
          trigger:
            - call: "POST /approval-claims/${claim1}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /approval-claims/${claim1}/decision"
              payload: { decision: "APPROVE", licence_number: "API-5678" }
              as: ComplianceOfficer
          assert:
            - "before the trigger, ApprovalClaim.${claim1}.status == SUSPENDED with pinned_spec_revision 1 and requires_recertification true"
            - "BlendRecipe.${recipe2}.spec_revision_pinned == 2 and status == ACTIVE"
            - "after the re-submit, ApprovalClaim.${claim1}.pinned_spec_revision == 2"
            - "after the second approval, ApprovalClaim.${claim1}.status == ACTIVE and requires_recertification == false"
            - "BlendRecipe.${recipe1}.status == RETIRED"

