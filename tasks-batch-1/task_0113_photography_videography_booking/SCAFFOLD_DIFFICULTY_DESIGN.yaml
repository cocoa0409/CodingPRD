              as: Client
              as_user_id: "${c9}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: shooter_assign_stale_version_beats_double_booked
        # category pair: business_constraint/OCC (p7) vs business_temporal (p11)
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - concurrency_rules[second-shooter-assign-stale-schedule]
        distinguishing_aspect: |
          On second-shooter assignment, the OCC stale-version check (p7, ERR_STALE_SCHEDULE_VERSION,
          412) is evaluated before the double-booking temporal check (p11, ERR_SHOOTER_DOUBLE_BOOKED,
          409); when both would fire, 412 wins. Category pair: business_constraint vs business_temporal.
        test_recipe:
          setup:
            - "CONFIRMED WEDDING booking with schedule S (14:00-18:00). The schedule is rescheduled once (version bumped) so a stale expected version exists; second shooter P-second already assigned to an overlapping window via another schedule."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c10@x.com", full_name: "C Ten", phone: "1000" }
              as: StudioAdmin
              captures: { c10: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "lead10@x.com", full_name: "Lead 10", skills: ["PHOTO"], hourly_rate_cents: 12000 }
              as: StudioAdmin
              captures: { lead10: $.data.id }
