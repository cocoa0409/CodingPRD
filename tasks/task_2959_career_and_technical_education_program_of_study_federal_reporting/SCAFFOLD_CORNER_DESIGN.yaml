      - name: entertainment_charges_can_only_be_disallowed_and_disallowal_leaves_the_ledger_alone
        claim_type: side_effect_execution
        grounds:
          - validations[priority=15]
          - errors[ERR_UNALLOWABLE_USE]
          - state_machines.Expenditure.REQUESTED_to_DISALLOWED
          - calculations.expenditure_federal_share
          - entities.Expenditure.fields.finding_code
        distinguishing_aspect: |
          The DISALLOWED branch is the side-effect sibling of CERTIFIED and its declared divergence must hold exactly:
          approved_cents stays null, finding_code is written, and the GrantAward's version and every ledger field are
          left untouched — while the CERTIFY decision on an ENTERTAINMENT row is unconditionally refused.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status STATE_APPROVED with clna_phase CERTIFIED."
            - "One GrantAward for fiscal_year 2027 with allocation_cents 5000000, obligation window 2026-07-01 to 2027-06-30, version 2 after its first expenditure, and a zeroed ledger."
            - "One REQUESTED ENTERTAINMENT Expenditure with unit_cost_cents 40000, quantity 1 and federal_share_pct 0.0."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0801", title: "Medical Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
