  # ===========================================================================
  # 8. CROSS-CUTTING COMPLEXITY LAYERS — the four layers declared active in
  #    §1.0 complexity_layers: optimistic_concurrency (one instance per §1.2.1
  #    concurrency rule plus the three other expected_*_version guards and the
  #    version-increment claim), rate_threshold_triggers, cascading_side_effects
  #    and dual_variant_calculation.
  # ===========================================================================
  - section: cross_cutting_complexity_layers

    instances:

      - name: occ_stale_alarm_site_version_blocks_a_second_suspension_order
        claim_type: optimistic_concurrency — concurrency_rules.suspension-order-create-stale-site
        grounds:
          - concurrency_rules.suspension-order-create-stale-site
          - errors.ERR_STALE_ALARM_SITE_VERSION
          - endpoints.POST_/false-alarm-program/suspension-orders
        distinguishing_aspect: "The losing writer is legitimate on its face — six chargeable alarms are on record and the proposed interval collides with nothing — so no state precondition can catch it; only the version it read before another writer's payment moved AlarmSite.outstanding_balance_cents does, which is why the answer is 412 and not a 409."
        test_recipe:
          setup:
            - "Six COUNTED incidents at ${site_id} by 2026-09-20T01:00:00Z; the officer reads the premises version, and a billing clerk then posts a 1000-cent payment that bumps it."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_c3
            - *k_sys1
            - *k_app1
            - *k_sys2
            - *k_app2
            - *k_sys3
            - *k_app3
            - *k_sys4
            - *k_app4
            - *k_sys5
            - *k_app5
            - *k_sys6
            - *k_app6
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
            - *k_inc1_counted
            - *k_dr2
            - *k_dr2_val
            - *k_dr2_disp
            - *k_inc2
            - *k_inc2_counted
            - *k_dr3
            - *k_dr3_val
            - *k_dr3_disp
            - *k_inc3
            - *k_inc3_counted
            - *k_dr4
            - *k_dr4_val
            - *k_dr4_disp
            - *k_inc4
            - *k_inc4_counted
            - *k_dr5
            - *k_dr5_val
            - *k_dr5_disp
            - *k_inc5
            - *k_inc5_counted
            - *k_dr6
            - *k_dr6_val
            - *k_dr6_disp
            - *k_inc6
            - *k_inc6_counted
            - *k_site_v
            - &k_pay_bump_site
              call: "POST /false-alarm-program/payment-records"
              payload: { alarm_site_id: "${site_id}", amount_cents: 1000, tendered_on: "2026-09-20", method: "CHECK", allocation_mode: "AUTO_WATERFALL", expected_alarm_site_version: "${site_v_now}" }
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { pay_bump_id: $.data.id }
          trigger:
            - call: "POST /false-alarm-program/suspension-orders"
              payload: { alarm_site_id: "${site_id}", triggering_incident_id: "${inc6_id}", basis: "EXCESSIVE_FALSE_ALARMS", effective_from: "2026-10-31T01:00:00Z", effective_through: "2026-11-30T01:00:00Z", expected_alarm_site_version: "${site_v_now}" }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { err_occ_order: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_ALARM_SITE_VERSION"
            - "only the order the sixth determination auto-proposed exists: GET /false-alarm-program/suspension-orders?alarm_site_id=${site_id}&page=1&per_page=25 returns total_count 1, that row is PROPOSED with effective_from 2026-09-30T01:00:00Z, and no second order was created"
            - "the winner's effect survives untouched — the 1000-cent payment is still APPLIED and allocated"
            - "re-reading the premises and resubmitting the SAME body with the refreshed version succeeds and produces a second PROPOSED order over the non-colliding 2026-10-31 -> 2026-11-30 interval"

      - name: occ_stale_alarm_site_version_blocks_a_second_payment_record
        claim_type: optimistic_concurrency — concurrency_rules.payment-record-create-stale-site
        grounds:
          - concurrency_rules.payment-record-create-stale-site
          - errors.ERR_STALE_ALARM_SITE_VERSION
          - endpoints.POST_/false-alarm-program/payment-records
        distinguishing_aspect: "Partial tenders legitimately accumulate, so the second posting is a normal product operation and cannot be refused by any state rule — it is refused because an AUTO_WATERFALL sized against the pre-payment invoice set would re-credit an invoice the first tender already settled."
        test_recipe:
          setup:
            - "Invoice ${inv1_id} owes 5500 cents at 2026-08-01T00:00:00Z; both clerks read AlarmSite version ${site_v_now}, and the first posts 2000 cents."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_inv1
            - *k_site_v
            - &k_pay_first_2000
              call: "POST /false-alarm-program/payment-records"
              payload: { alarm_site_id: "${site_id}", amount_cents: 2000, tendered_on: "2026-08-01", method: "CARD", allocation_mode: "AUTO_WATERFALL", expected_alarm_site_version: "${site_v_now}" }
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { pay_first_id: $.data.id, pay_first_alloc: $.data.allocated_cents }
          trigger:
            - call: "POST /false-alarm-program/payment-records"
              payload: { alarm_site_id: "${site_id}", amount_cents: 3500, tendered_on: "2026-08-01", method: "CHECK", allocation_mode: "AUTO_WATERFALL", expected_alarm_site_version: "${site_v_now}" }
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { err_occ_pay: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_ALARM_SITE_VERSION"
            - "exactly ONE PaymentRecord exists for the premises with allocated_cents 2000; no receipt number was burned by the loser"
            - "PenaltyInvoice ${inv1_id} is PARTIALLY_PAID with paid_cents 2000 and outstanding_cents 3500 — the second tender applied nothing"
            - "the identical 3500-cent body with a refreshed version succeeds and takes the invoice to PAID"

      - name: occ_stale_penalty_invoice_version_blocks_a_second_adjustment
        claim_type: optimistic_concurrency — concurrency_rules.invoice-adjustment-stale-invoice
        grounds:
          - concurrency_rules.invoice-adjustment-stale-invoice
          - errors.ERR_STALE_PENALTY_INVOICE_VERSION
          - endpoints.POST_/false-alarm-program/penalty-invoices/{invoiceId}/adjustments
        distinguishing_aspect: "Adjustments legitimately stack — a REDUCE may follow a REDUCE — so the second 1000-cent reduction is perfectly valid against a 5500-cent assessment and would succeed if replayed; it fails only because the amount was sized against a balance another administrator has already cut, which is the exact double-reduction the version guard exists to stop."
        test_recipe:
          setup:
            - "Invoice ${inv1_id} is OPEN at 5500 cents; two administrators read version ${inv1_v} and the first posts a 1000-cent REDUCE."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_inv1
            - &k_adj_first_1000
              call: "POST /false-alarm-program/penalty-invoices/${inv1_id}/adjustments"
              payload: { adjustment_kind: "REDUCE", reason: "First administrator reduces the fee for a partial hardship.", expected_penalty_invoice_version: "${inv1_v}", amount_cents: 1000 }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { inv1_v_adj1: $.data.version, inv1_out_adj1: $.data.outstanding_cents }
          trigger:
            - call: "POST /false-alarm-program/penalty-invoices/${inv1_id}/adjustments"
              payload: { adjustment_kind: "REDUCE", reason: "Second administrator reduces the fee from the same stale view.", expected_penalty_invoice_version: "${inv1_v}", amount_cents: 1000 }
              as: ProgramAdministrator
              as_user_id: "pa-01"
              captures: { err_occ_adj: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_PENALTY_INVOICE_VERSION"
            - "PenaltyInvoice ${inv1_id} shows adjusted_cents 1000 and outstanding_cents 4500 — exactly one reduction landed"
            - "AlarmSite.${site_id}.outstanding_balance_cents reconciles to 4500, so no ledger drift followed the refusal"
            - "resubmitting with ${inv1_v_adj1} succeeds and takes adjusted_cents to 2000"

      - name: occ_stale_alarm_system_version_blocks_a_second_reconfiguration
