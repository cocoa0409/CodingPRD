      - name: apc_waiver_half_cent_rounds_half_up
        claim_type: precision
        grounds:
          - calculations.apc_net_amount
          - entities.APCInvoice.fields.waiver_cents
        distinguishing_aspect: |
          The income-band waiver is rounded ROUND_HALF_UP at the cent, not truncated and not banker's
          rounded: apc_base_cents 90010 under CC_BY leaves base 90010, the UPPER_MIDDLE 25 percent
          gives 22502.5 raw, which must be stored as 22503 (truncation and half-even both give
          22502), leaving net_apc_cents 67507 and, because 67507 is under RELIEF_TIER_1_CENTS,
          surcharge_relief_pct 0.
