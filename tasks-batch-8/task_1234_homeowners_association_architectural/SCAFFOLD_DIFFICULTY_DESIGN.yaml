            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cal C", email: "cal.c@x.com" }, as: Manager, captures: { owner_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Eve E", email: "eve.e@x.com" }, as: Manager, captures: { owner_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "Q-1", address: "1 Quota Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "front fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app1: $.data.id } }
            - { call: "POST /arc/applications/${app1}/attachments", payload: { kind: DRAWING, label: "plan", uri: "s3://q/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app1}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "wood", uri: "s3://q/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app1}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app1}/start-review", as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: PAINT, guideline_section: "SEC-3.1", description: "door repaint", requested_window_start: "2026-08-01", requested_window_end: "2026-08-20" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app2: $.data.id } }
            - { call: "POST /arc/applications/${app2}/attachments", payload: { kind: DRAWING, label: "elev", uri: "s3://q/d2" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app2}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "paint", uri: "s3://q/m2" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app2}/submit", as: Homeowner, as_user_id: "${owner_a}" }
