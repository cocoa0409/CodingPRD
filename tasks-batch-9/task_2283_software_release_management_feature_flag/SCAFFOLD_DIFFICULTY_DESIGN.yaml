              payload: { kind: "CAB", decision: "APPROVE", comment: "CAB minutes 2026-08-01" }
              as: ChangeApprover
              as_user_id: "u-appr-2"
          assert:
            - "ChangeRequest.${cr_crit}.risk_score_preliminary == 85"
            - "ChangeRequest.${cr_crit}.risk_class == CRITICAL"
            - "ChangeRequest.${cr_crit}.state immediately after submit == CAB_REVIEW"
            - "ChangeRequest.${cr_low}.risk_score_preliminary == 9"
            - "ChangeRequest.${cr_low}.risk_class == LOW"
            - "ChangeRequest.${cr_low}.state immediately after submit == APPROVED"
            - "ChangeRequest.${cr_low}.risk_score_final == 9"
            - "GET /change-requests/${cr_low}/approvals returns total_count == 0"
            - "ChangeRequest.${cr_crit}.state after the third approval == APPROVED"
            - "ChangeRequest.${cr_crit}.risk_score_final == 85"
