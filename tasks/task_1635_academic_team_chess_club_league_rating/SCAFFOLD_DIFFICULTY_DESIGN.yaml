  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: meet_postpone_reschedule_cycle
        grounds:
          - state_machines.Meet.SCHEDULED_to_POSTPONED
          - state_machines.Meet.POSTPONED_to_SCHEDULED
        distinguishing_aspect: |
          Meet is cyclic: SCHEDULED -> POSTPONED -> SCHEDULED -> POSTPONED -> SCHEDULED
          is legal, each lap re-running the date-occupation checks; version advances on
          every hop.
        test_recipe:
          setup:
            - "Season ACTIVE; clubs A,B; meet A(host) vs B on 2026-09-05 in DRAFT"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
          trigger:
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets/${meet_id}/postpone", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets/${meet_id}/reschedule", payload: { scheduled_date: "2026-09-06" }, as: FederationAdmin }
            - { call: "POST /api/meets/${meet_id}/postpone", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets/${meet_id}/reschedule", payload: { scheduled_date: "2026-09-07" }, as: FederationAdmin }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { m_status: $.data.status, m_ver: $.data.version } }
          assert:
            - "Meet.${meet_id}.status == SCHEDULED after two full postpone/reschedule laps — got ${m_status}"
            - "Meet.${meet_id}.scheduled_date == \"2026-09-07\""
            - "Meet.${meet_id}.version == 6 (create + 5 transitions) — got ${m_ver}"

      - name: dispute_fork_divergent_side_effects
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
          - state_machines.Dispute.UNDER_REVIEW_to_OVERTURNED
        distinguishing_aspect: |
          Dispute is a branching fork with divergent side-effect sets: UPHELD leaves
          ratings/points untouched (R stays 908, S stays 692) while OVERTURNED on the
          sibling pairing voids two RatingEvents and rebases both players (T 1008 -> 992,
          U 792 -> 808, points 3/0 -> 1/1).
        test_recipe:
          setup:
            - "Season threshold 4 ACTIVE; club A players R(900/25) and T(1000/25); club B players S(700/30) and U(800/30); memberships waived; one meet 1 round x 2 boards IN_PROGRESS; both boards confirmed WHITE_WIN"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach B", email: "cb@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "R", grade_level: 11, initial_rating: 900, initial_rated_games: 25 }, as: FederationAdmin, captures: { pr: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "T", grade_level: 11, initial_rating: 1000, initial_rated_games: 25 }, as: FederationAdmin, captures: { pt: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "S", grade_level: 9, initial_rating: 700, initial_rated_games: 30 }, as: FederationAdmin, captures: { ps: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "U", grade_level: 9, initial_rating: 800, initial_rated_games: 30 }, as: FederationAdmin, captures: { pu: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pr}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pt}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${ps}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m3: $.data.id } }
            - { call: "POST /api/memberships/${m3}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pu}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m4: $.data.id } }
            - { call: "POST /api/memberships/${m4}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 2 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv1: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pr}", black_player_id: "${ps}", expected_meet_version: "${mv1}" }, as: FederationAdmin, captures: { pair1: $.data.id } }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv2: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 2, white_player_id: "${pt}", black_player_id: "${pu}", expected_meet_version: "${mv2}" }, as: FederationAdmin, captures: { pair2: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/publish-pairings", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_a}", event_type: "MEET", meet_id: "${meet_id}" }, as: FederationAdmin, captures: { asg: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_a}" }
            - { call: "POST /api/meets/${meet_id}/start", payload: {}, as: FederationAdmin }
            - { call: "POST /api/pairings/${pair1}/report-result", payload: { result: "WHITE_WIN" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${pair1}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "POST /api/pairings/${pair2}/report-result", payload: { result: "WHITE_WIN" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${pair2}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "POST /api/pairings/${pair1}/dispute", payload: { reason: "board1 clock handling protest" }, as: ClubCoach, as_user_id: "${coach_b}", captures: { d1: $.data.id } }
            - { call: "POST /api/pairings/${pair2}/dispute", payload: { reason: "board2 illegal position claim" }, as: ClubCoach, as_user_id: "${coach_b}", captures: { d2: $.data.id } }
            - { call: "POST /api/disputes/${d1}/open-review", payload: {}, as: FederationAdmin }
            - { call: "POST /api/disputes/${d2}/open-review", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "POST /api/disputes/${d1}/resolve", payload: { outcome: "UPHELD", resolution_notes: "reported result stands" }, as: FederationAdmin }
            - { call: "POST /api/disputes/${d2}/resolve", payload: { outcome: "OVERTURNED", resolved_result: "DRAW", resolution_notes: "position was drawn by rule" }, as: FederationAdmin }
            - { call: "GET /api/players/${pt}", as: FederationAdmin, captures: { t_rating: $.data.rating, t_pts: $.data.performance_points } }
          assert:
            - "UPHELD branch: Player.${pr}.rating == 908 and Player.${ps}.rating == 692 (unchanged from confirmation; no new events)"
            - "OVERTURNED branch: Player.${pt}.rating == 992 and Player.${pu}.rating == 808 (void + replay + DRAW re-application) — got ${t_rating}"
            - "Player.${pt}.performance_points == 1 (draw), Player.${pr}.performance_points == 3 (win intact) — got ${t_pts}"
            - "Dispute.${d1}.status == UPHELD; Dispute.${d2}.status == OVERTURNED; both pairings CONFIRMED"

      - name: tournament_registration_reopen_cycle
        grounds:
          - state_machines.Tournament.REGISTRATION_OPEN_to_REGISTRATION_CLOSED
          - state_machines.Tournament.REGISTRATION_CLOSED_to_REGISTRATION_OPEN
        distinguishing_aspect: |
          Tournament registration is cyclic (OPEN -> CLOSED -> OPEN), unlike the
          Meet postpone loop — a different entity exercising a cycle; entries created
          after reopen are accepted and charged.
        test_recipe:
          setup:
            - "Season ACTIVE; club A funded 5000; one player with WAIVED membership; tournament fee 1035 with early-bird 10% (fee 932 at default clock)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, club_v: $.data.version } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 5000, memo: "funding", expected_club_version: "${club_v}" }, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P1", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments", payload: { season_id: "${season_id}", host_club_id: "${club_a}", name: "Open", start_date: "2026-10-02", end_date: "2026-10-03", entry_fee_cents: 1035, early_bird_deadline: "2026-09-15T00:00:00Z", early_bird_discount_pct: 0.10, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "Open", min_rating: 0, max_rating: 2900, allow_provisional: true, max_entries: 10 }, as: FederationAdmin, captures: { sec_id: $.data.id } }
          trigger:
            - { call: "POST /api/tournaments/${t_id}/open-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments/${t_id}/close-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments/${t_id}/reopen-registration", payload: {}, as: FederationAdmin, captures: { t_status: $.data.status } }
            - { call: "POST /api/sections/${sec_id}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { e_fee: $.data.fee_cents } }
          assert:
            - "Tournament.${t_id}.status == REGISTRATION_OPEN after the close->reopen lap — got ${t_status}"
            - "Entry created after reopen with fee_cents == 932 — got ${e_fee}"
  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispute_overturn_rating_rebase_cascade
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_OVERTURNED
          - state_machines.RatingEvent.EFFECTIVE_to_VOIDED
          - calculations.rating_replay
        distinguishing_aspect: |
          Depth-4 chain from the dispute-resolve trigger: Dispute OVERTURNED ->
          Pairing result rewritten (link 1) -> the pairing's two RatingEvents VOIDED
          (link 2) -> each player replayed, ratings/points recomputed (link 3) ->
          fresh RatingEvents posted from post-void snapshots and players replayed
          again (link 4). P goes 1008 -> 976, Q 792 -> 824, points 3/0 -> 0/3.
        test_recipe:
          setup:
            - "Season threshold 4 ACTIVE; P (club A, 1000/25) vs Q (club B, 800/30); memberships waived; meet IN_PROGRESS; pairing confirmed WHITE_WIN (P 1008, Q 792, points 3/0); dispute raised by away coach and moved UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach B", email: "cb@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P", grade_level: 11, initial_rating: 1000, initial_rated_games: 25 }, as: FederationAdmin, captures: { pp: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "Q", grade_level: 9, initial_rating: 800, initial_rated_games: 30 }, as: FederationAdmin, captures: { pq: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pp}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
