scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: refund_policy_schedule_vs_pro_rata_diverge_on_one_registration
        grounds:
          - calculations.refund_amount
          - entities.RefundTransferRequest.fields.refund_basis
          - entities.RefundTransferRequest.fields.computed_refund_cents
          - entities.RefundTransferRequest.fields.days_before_start
          - endpoints.POST /refund-transfer-requests/{id}/decide
        distinguishing_aspect: |
          Dual variant in the Registration money domain: policy_schedule reads ONLY
          days_before_start (1 day out -> 0.50) while pro_rata_attendance reads ONLY
          the unused-session ratio (0 of 10 attended -> capped at 0.90), so the very
          same registration with subtotal_paid 60000 is valued 30000 cents under the
          first variant and 54000 cents under the second.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-14T00:00:00Z, one day before the offering's 2026-09-15 start."
            - "Course EXT-101 (ceu_units 1.2), one TERM offering with min_enrollment 1, session_count 10, tuition_cents 60000, status OPEN."
            - "Learner Ada (loyalty_tier NEW) holds one SELF_PAY registration: total_due_cents 62400, processing_fee_cents 2400, amount_paid_cents 62400, ENROLLED x PAID, sessions_attended 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_one_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_main_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_one_id}", instructor_id: "${ins_main_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8, pay_basis: "CENSUS_LOCKED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_one_id: $.data.id }
            - call: "POST /instructor-contracts/${k_one_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_main_id}"
            - call: "POST /offerings/${o_one_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_one_v: $.data.version }
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
            - call: "POST /offerings/${o_one_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_one_v}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Learner
              as_user_id: "${l1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /refund-transfer-requests"
              payload: { registration_id: "${r1_id}", request_type: "REFUND", refund_basis: "POLICY_SCHEDULE" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { req1_id: $.data.id, refund_policy: $.data.computed_refund_cents }
            - call: "POST /refund-transfer-requests/${req1_id}/decide"
              payload: { decision: "APPROVE", refund_basis: "PRO_RATA_ATTENDANCE" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { refund_prorata: $.data.computed_refund_cents }
          assert:
            - "Registration.${r1_id}.total_due_cents == 62400"
            - "Registration.${r1_id}.processing_fee_cents == 2400"
            - "RefundTransferRequest.${req1_id}.days_before_start == 1"
            - "${refund_policy} == 30000"
            - "${refund_prorata} == 54000"
            - "${refund_policy} != ${refund_prorata}"
            - "RefundTransferRequest.${req1_id}.status == REFUND_APPROVED"

      - name: instructor_pay_census_locked_vs_final_completion_diverge
        grounds:
          - calculations.instructor_contract_pay
          - entities.InstructorContract.fields.pay_basis
          - entities.InstructorContract.fields.census_headcount
          - entities.InstructorContract.fields.final_headcount
          - entities.InstructorContract.fields.settled_pay_cents
          - state_machines.InstructorContract.ACTIVE_to_SETTLED
        distinguishing_aspect: |
          Dual variant in the InstructorContract payroll domain - a different entity
          domain from the Registration refund dual variant. Two contracts on the SAME
          offering with identical base_stipend_cents 250000, per_enrollment_cents 12345,
          cap 8 and SENIOR multiplier settle 330090 cents under census_locked
          (headcount frozen at 3 paid enrollments) and 315894 cents under
          final_completion (2 COMPLETED registrations at settle time).
        test_recipe:
          setup:
            - "One TERM offering EXT-101 with min_enrollment 3, session_count 10, tuition_cents 60000."
            - "Two SENIOR instructors each holding an ACTIVE contract on that offering: contract A with pay_basis CENSUS_LOCKED, contract B with pay_basis FINAL_COMPLETION; both base_stipend_cents 250000, per_enrollment_cents 12345, enrollment_cap_for_pay 8."
            - "Three NEW learners registered and SELF_PAY paid (total_due_cents 62400 each) and ENROLLED, so paid_enrollment_count == 3 at census."
            - "After census: learners 1 and 2 attend 10 of 10 sessions and are completed; learner 3 attends 5 of 10 and is never completed, becoming NO_SHOW when the offering closes."
            - "Logical clock advanced to 2026-11-15T00:00:00Z so the offering can be completed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 3, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_fall_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "bo@ext.edu", full_name: "Bo Lang", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_b_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_fall_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8, pay_basis: "CENSUS_LOCKED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_fall_id}", instructor_id: "${ins_b_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8, pay_basis: "FINAL_COMPLETION" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_b_id: $.data.id }
            - call: "POST /instructor-contracts/${k_a_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /instructor-contracts/${k_b_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_b_id}"
            - call: "POST /offerings/${o_fall_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v0: $.data.version }
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
            - call: "POST /learners"
              payload: { email: "ben@x.com", full_name: "Ben Osei", marketing_opt_in: true }
              as: Anonymous
              captures: { l2_id: $.data.id }
            - call: "POST /learners"
              payload: { email: "cai@x.com", full_name: "Cai Ruiz", marketing_opt_in: true }
              as: Anonymous
              captures: { l3_id: $.data.id }
            - call: "POST /offerings/${o_fall_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_v0}" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "GET /offerings/${o_fall_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v1: $.data.version }
            - call: "POST /offerings/${o_fall_id}/registrations"
              payload: { learner_id: "${l2_id}", expected_offering_version: "${o_v1}" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { r2_id: $.data.id }
            - call: "POST /registrations/${r2_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "GET /offerings/${o_fall_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v2: $.data.version }
            - call: "POST /offerings/${o_fall_id}/registrations"
              payload: { learner_id: "${l3_id}", expected_offering_version: "${o_v2}" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { r3_id: $.data.id }
            - call: "POST /registrations/${r3_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /offerings/${o_fall_id}/census"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /instructor-contracts/${k_a_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /instructor-contracts/${k_b_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /registrations/${r1_id}/attendance"
              payload: { sessions_attended: 10 }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /registrations/${r2_id}/attendance"
              payload: { sessions_attended: 10 }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /registrations/${r3_id}/attendance"
              payload: { sessions_attended: 5 }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /registrations/${r1_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /registrations/${r2_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /offerings/${o_fall_id}/complete"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /instructor-contracts/${k_a_id}/settle"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pay_a: $.data.settled_pay_cents, hc_a: $.data.census_headcount }
            - call: "POST /instructor-contracts/${k_b_id}/settle"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pay_b: $.data.settled_pay_cents, hc_b: $.data.final_headcount }
          assert:
            - "InstructorContract.${k_a_id}.census_headcount == 3"
            - "InstructorContract.${k_b_id}.final_headcount == 2"
            - "${pay_a} == 330090"
            - "${pay_b} == 315894"
            - "${pay_a} != ${pay_b}"
            - "InstructorContract.${k_a_id}.status == SETTLED"
            - "InstructorContract.${k_b_id}.status == SETTLED"
            - "Registration.${r3_id}.enrollment_status == NO_SHOW"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: net_program_revenue_rounds_per_line_before_summing
        grounds:
          - calculations.offering_net_program_revenue
          - entities.Offering.fields.net_program_revenue_cents
          - entities.Registration.fields.amount_paid_cents
          - entities.Registration.fields.amount_refunded_cents
        distinguishing_aspect: |
          Mode (b) - nested rounding where the ORDER decides the cents. Two paid
          registrations of 62300 cents each: rounding the 18.5% institutional
          overhead per line (11525.5 -> 11526 each, line_net 50524) and summing
          gives 101048, whereas summing gross to 124600 and rounding the overhead
          once (23051.0 -> 23051) gives 101049. The scaffold pins per-line rounding,
          so 101048 is the only correct answer.
        test_recipe:
          setup:
            - "One TERM offering on EXT-101 with tuition_cents 59904, session_count 10, min_enrollment 2, max_enrollment 10, status OPEN."
            - "Two NEW learners each registered and SELF_PAY paid: subtotal 59904, processing_fee_cents 2396 (4% tier), total_due_cents 62300, ENROLLED x PAID."
            - "No refunds; both registration lines carry gross 62300."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 2, max_enrollment: 10, tuition_cents: 59904 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_rev_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_rev_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_rev_id: $.data.id }
            - call: "POST /instructor-contracts/${k_rev_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /offerings/${o_rev_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v0: $.data.version }
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
            - call: "POST /learners"
              payload: { email: "ben@x.com", full_name: "Ben Osei", marketing_opt_in: true }
              as: Anonymous
              captures: { l2_id: $.data.id }
            - call: "POST /offerings/${o_rev_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_v0}" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { r1_id: $.data.id, r1_total: $.data.total_due_cents }
            - call: "POST /registrations/${r1_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "GET /offerings/${o_rev_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v1: $.data.version }
            - call: "POST /offerings/${o_rev_id}/registrations"
              payload: { learner_id: "${l2_id}", expected_offering_version: "${o_v1}" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /registrations/${r2_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "GET /offerings/${o_rev_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { net_rev: $.data.net_program_revenue_cents }
          assert:
            - "Registration.${r1_id}.processing_fee_cents == 2396"
            - "Registration.${r1_id}.total_due_cents == 62300"
            - "Registration.${r2_id}.total_due_cents == 62300"
            - "${net_rev} == 101048"
            - "${net_rev} != 101049"
            - "Offering.${o_rev_id}.paid_enrollment_count == 2"

      - name: fee_tier_read_from_subtotal_not_from_total_due
        grounds:
          - calculations.registration_price_resolution
          - entities.Registration.fields.processing_fee_cents
          - entities.Registration.fields.total_due_cents
          - entities.Registration.fields.loyalty_discount_cents
        distinguishing_aspect: |
          Mode (c) - circular-looking dependency with a pinned evaluation order.
          total_due_cents = subtotal_cents + processing_fee_cents, while the fee tier
          is selected from a breakpoint (75000) that subtotal 74000 and total 76960
          straddle. Reading the tier from subtotal (the pinned order) gives 4% ->
          fee 2960 -> total 76960; reading it from total_due_cents would give 2.5% ->
          fee 1850 -> total 75850. The two readings are both self-consistent, so only
          the pinned order makes the value well defined.
        test_recipe:
          setup:
            - "One TERM offering on EXT-101 with tuition_cents 74000, min_enrollment 1, max_enrollment 10, status OPEN."
            - "One learner with loyalty_tier NEW (zero completions), so loyalty_discount_cents is 0 and subtotal_cents equals 74000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 74000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_tier_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_tier_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_tier_id: $.data.id }
            - call: "POST /instructor-contracts/${k_tier_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /offerings/${o_tier_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v0: $.data.version }
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /offerings/${o_tier_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_v0}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id, fee: $.data.processing_fee_cents, total: $.data.total_due_cents }
          assert:
            - "Registration.${r1_id}.list_tuition_cents == 74000"
            - "Registration.${r1_id}.loyalty_discount_cents == 0"
            - "${fee} == 2960"
            - "${total} == 76960"
            - "${fee} != 1850"
            - "${total} != 75850"
            - "Registration.${r1_id}.enrollment_status == PENDING"
            - "Registration.${r1_id}.payment_status == UNPAID"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: cpl_petition_revision_loop_returns_to_submitted
        grounds:
          - state_machines.CplPetition.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.CplPetition.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.CplPetition.SUBMITTED_to_UNDER_REVIEW
          - entities.CplPetition.fields.revision_round
          - entities.CplPetition.fields.assessed_by_user_id
        distinguishing_aspect: |
          CYCLE on CplPetition: SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED ->
          SUBMITTED -> UNDER_REVIEW. The entity re-enters a state it has already
          occupied, revision_round advances from 0 to 1, and assessed_by_user_id is
          re-stamped by whichever ProgramAdmin takes the second review.
        test_recipe:
          setup:
            - "Learner Ada holds one ISSUED CompletionRecord on EXT-050 (ceu_awarded 0.5) after completing a censused offering with 4 of 4 sessions attended."
            - "A CplPetition targeting EXT-150 exists in status SUBMITTED with exactly one citation of that record at weight 1.0 and revision_round 0."
            - "ProgramAdmin admin-1 has already taken the petition UNDER_REVIEW, so assessed_by_user_id == admin-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-050", title: "Micro Credential Primer", ceu_units: 0.5, contact_hours: 5, list_price_cents: 25000, delivery_mode: "ONLINE_ASYNC", cpl_credit_units: 1.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_micro_id: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "EXT-150", title: "Applied Delivery Lab", ceu_units: 1.5, contact_hours: 15, list_price_cents: 45000, delivery_mode: "IN_PERSON", cpl_credit_units: 2.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_lab_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_micro_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 4, min_enrollment: 1, max_enrollment: 10, tuition_cents: 25000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_micro_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_micro_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_micro_id: $.data.id }
            - call: "POST /instructor-contracts/${k_micro_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /offerings/${o_micro_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v0: $.data.version }
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
            - call: "POST /offerings/${o_micro_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_v0}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Learner
              as_user_id: "${l1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /offerings/${o_micro_id}/census"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /instructor-contracts/${k_micro_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /registrations/${r1_id}/attendance"
              payload: { sessions_attended: 4 }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /registrations/${r1_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${ins_a_id}"
              captures: { cr1_id: $.data.id }
            - call: "POST /cpl-petitions"
              payload: { learner_id: "${l1_id}", target_course_id: "${c_lab_id}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /cpl-petitions/${p1_id}/citations"
              payload: { completion_record_id: "${cr1_id}", weight: 1.0 }
              as: Learner
              as_user_id: "${l1_id}"
            - call: "POST /cpl-petitions/${p1_id}/submit"
              payload: {}
              as: Learner
              as_user_id: "${l1_id}"
            - call: "POST /cpl-petitions/${p1_id}/review"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /cpl-petitions/${p1_id}/request-revision"
              payload: { decision_note: "Add the contact-hour transcript." }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { round_after_revision: $.data.revision_round, status_after_revision: $.data.status }
            - call: "POST /cpl-petitions/${p1_id}/submit"
              payload: {}
              as: Learner
              as_user_id: "${l1_id}"
              captures: { status_resubmitted: $.data.status }
            - call: "POST /cpl-petitions/${p1_id}/review"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-2"
              captures: { status_second_review: $.data.status, assessor_after: $.data.assessed_by_user_id }
          assert:
            - "${status_after_revision} == REVISION_REQUESTED"
            - "${round_after_revision} == 1"
            - "${status_resubmitted} == SUBMITTED"
            - "${status_second_review} == UNDER_REVIEW"
            - "${assessor_after} == admin-2"
            - "CplPetition.${p1_id}.revision_round == 1"

      - name: registration_axes_move_independently_waitlisted_and_paid
        grounds:
          - state_machines.Registration.PENDING_to_WAITLISTED
          - state_machines.Registration.UNPAID_to_PAID
          - state_machines.Offering.OPEN_to_WAITLIST_ONLY
          - entities.Registration.fields.enrollment_status
          - entities.Registration.fields.payment_status
        distinguishing_aspect: |
          PARALLEL state dimensions on Registration (a different entity from
          CplPetition): the money axis reaches PAID while the seat axis lands on
          WAITLISTED rather than ENROLLED, proving the two axes are independent
          rather than a single combined status.
        test_recipe:
          setup:
            - "One TERM offering on EXT-101 with max_enrollment 1, min_enrollment 1, tuition_cents 60000, status OPEN."
            - "Learner Ada has already registered and paid, taking the single seat, so the offering has flipped OPEN -> WAITLIST_ONLY."
            - "Learner Ben has a PENDING x UNPAID registration on the same offering."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 1, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_one_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_one_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_one_id: $.data.id }
            - call: "POST /instructor-contracts/${k_one_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /offerings/${o_one_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v0: $.data.version }
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
            - call: "POST /learners"
              payload: { email: "ben@x.com", full_name: "Ben Osei", marketing_opt_in: true }
              as: Anonymous
              captures: { l2_id: $.data.id }
            - call: "POST /offerings/${o_one_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_v0}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Learner
              as_user_id: "${l1_id}"
            - call: "GET /offerings/${o_one_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v1: $.data.version, status_after_first_seat: $.data.status }
            - call: "POST /offerings/${o_one_id}/registrations"
              payload: { learner_id: "${l2_id}", expected_offering_version: "${o_v1}" }
              as: Learner
              as_user_id: "${l2_id}"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /registrations/${r2_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Learner
              as_user_id: "${l2_id}"
              captures: { enr2: $.data.enrollment_status, pay2: $.data.payment_status }
          assert:
            - "${status_after_first_seat} == WAITLIST_ONLY"
            - "${enr2} == WAITLISTED"
            - "${pay2} == PAID"
            - "Registration.${r2_id}.amount_paid_cents == 62400"
            - "Registration.${r1_id}.enrollment_status == ENROLLED"
            - "Offering.${o_one_id}.confirmed_enrollment_count == 1"
            - "Offering.${o_one_id}.waitlist_count == 1"
            - "Offering.${o_one_id}.paid_enrollment_count == 1"

      - name: refund_transfer_request_forks_into_transfer_arm_not_refund_arm
        grounds:
          - state_machines.RefundTransferRequest.SUBMITTED_to_TRANSFER_APPROVED
          - state_machines.RefundTransferRequest.SUBMITTED_to_REFUND_APPROVED
          - entities.RefundTransferRequest.fields.request_type
          - entities.RefundTransferRequest.fields.status
        distinguishing_aspect: |
          BRANCHING fork-join on RefundTransferRequest (a third entity, distinct from
          CplPetition's cycle and Registration's parallel axes): the same SUBMITTED
          state forks into REFUND_APPROVED or TRANSFER_APPROVED with different
          precondition sets and different side effects, and both arms rejoin at
          SETTLED. A TRANSFER request lands in TRANSFER_APPROVED with
          computed_refund_cents still 0, never in REFUND_APPROVED.
        test_recipe:
          setup:
            - "Two TERM offerings on EXT-101: source (tuition 60000, 2026-09-15 to 2026-11-15) OPEN, destination (tuition 50000, 2027-01-15 to 2027-03-15) OPEN."
            - "One SENIOR instructor holds SIGNED contracts on both; the two teaching windows do not intersect."
            - "Learner Ada holds an ENROLLED x PAID registration on the source offering with amount_paid_cents 62400."
            - "Logical clock at 2026-08-01T00:00:00Z, well before the source offering's end_date, so the refund/transfer window is open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_src_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2027SP", start_date: "2027-01-15T00:00:00Z", end_date: "2027-03-15T00:00:00Z", census_at: "2027-01-05T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 50000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_dst_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_src_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_src_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_dst_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_dst_id: $.data.id }
            - call: "POST /instructor-contracts/${k_src_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /instructor-contracts/${k_dst_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /offerings/${o_src_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_src_v0: $.data.version }
            - call: "POST /offerings/${o_dst_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
            - call: "POST /offerings/${o_src_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_src_v0}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/pay"
              payload: { method: "SELF_PAY" }
              as: Learner
              as_user_id: "${l1_id}"
          trigger:
            - call: "POST /refund-transfer-requests"
              payload: { registration_id: "${r1_id}", request_type: "TRANSFER", target_offering_id: "${o_dst_id}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { req_t_id: $.data.id, status_submitted: $.data.status }
            - call: "POST /refund-transfer-requests/${req_t_id}/decide"
              payload: { decision: "APPROVE" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { status_decided: $.data.status, refund_at_decide: $.data.computed_refund_cents }
          assert:
            - "${status_submitted} == SUBMITTED"
            - "${status_decided} == TRANSFER_APPROVED"
            - "${status_decided} != REFUND_APPROVED"
            - "${refund_at_decide} == 0"
            - "RefundTransferRequest.${req_t_id}.request_type == TRANSFER"
            - "Registration.${r1_id}.enrollment_status == ENROLLED"
            - "Registration.${r1_id}.transferred_to_registration_id == null"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: census_cancellation_four_hop_registration_voucher_sponsor_chain
        grounds:
          - state_machines.Offering.OPEN_to_CANCELLED
          - state_machines.Registration.VOUCHER_COMMITTED_to_REFUNDED
          - state_machines.Voucher.EXHAUSTED_to_PARTIALLY_REDEEMED
          - calculations.corporate_voucher_ledger
          - calculations.instructor_kill_fee
          - entities.CorporateAccount.fields.committed_cents
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /offerings/{id}/census failing the
          minimum-enrollment test: hop 1 CANCELS the Offering; because the Offering
          is cancelled, hop 2 withdraws and fully refunds the Registration; because
          that Registration was voucher-funded, hop 3 releases 62400 cents from the
          Voucher's committed bucket back to remaining; because the Voucher's buckets
          moved, hop 4 rebalances the CorporateAccount ledger. Each hop is caused by
          the previous hop, not directly by the census call.
        test_recipe:
          setup:
            - "One TERM offering on EXT-101 with min_enrollment 3, max_enrollment 10, tuition_cents 60000, census_at 2026-09-05, status OPEN."
            - "A SENIOR instructor holds a SIGNED contract on it with base_stipend_cents 250000."
            - "CorporateAccount ACME funded 500000 cents; one voucher of face_value_cents 200000 assigned to learner Ada."
            - "Ada holds the offering's only registration, paid by VOUCHER: total_due_cents 62400, ENROLLED x VOUCHER_COMMITTED, so paid_enrollment_count is 1 - two short of min_enrollment."
            - "Voucher before the trigger: remaining_cents 137600, committed_cents 62400, consumed_cents 0, status PARTIALLY_REDEEMED."
            - "Sponsor ledger before the trigger: funded 500000, available 300000, unallocated 137600, committed 62400, consumed 0."
            - "Logical clock at 2026-09-05T00:00:00Z, exactly the offering's census_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-20T00:00:00Z", end_date: "2026-11-20T00:00:00Z", census_at: "2026-09-05T00:00:00Z", session_count: 10, min_enrollment: 3, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_small_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_small_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_small_id: $.data.id }
            - call: "POST /instructor-contracts/${k_small_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /offerings/${o_small_id}/open"
              payload: {}
              as: ProgramAdmin
