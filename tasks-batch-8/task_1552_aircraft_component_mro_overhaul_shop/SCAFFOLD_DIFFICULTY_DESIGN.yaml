scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual-variant calculations on DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tat_penalty_adjusted_vs_calendar_variant
        grounds:
          - calculations.tat_penalty_calc
          - entities.Customer.fields.penalty_delay_rule
          - entities.Invoice.fields.penalty_credit_cents
        distinguishing_aspect: |
          Invoice-domain calculation: identical received/released/approval timestamps produce
          penalty_credit 170000 under ADJUSTED (delay-excluding) vs 470000 under CALENDAR —
          two contract-legal readings of the same timestamps diverge on an Invoice field.
        test_recipe:
          setup:
            - "Two customers CA (penalty_delay_rule ADJUSTED) and CB (CALENDAR), identical TAT contract: 100h guarantee, 5000 cents/h, cap 50%"
            - "Each has an identical unit + OVERHAUL work order driven through the identical timeline: received 2026-08-01T00:00:00Z; quote at once; approval 2026-08-03T12:00:00Z (60h customer delay); release 2026-08-09T02:00:00Z (elapsed 194h); one 4h cell booking at 100000 cents/h; no parts"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAdj", certificate_number: "AIR-A", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000, penalty_delay_rule: "ADJUSTED" }, as: ShopManager, captures: { c_adj: $.data.id } }
            - { call: "POST /mro/customers", payload: { name: "AeroCal", certificate_number: "AIR-B", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000, penalty_delay_rule: "CALENDAR" }, as: ShopManager, captures: { c_cal: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-A1", ownership: "CUSTOMER", owner_customer_id: "${c_adj}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u_adj: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-B1", ownership: "CUSTOMER", owner_customer_id: "${c_cal}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u_cal: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_adj}", unit_id: "${u_adj}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo_adj: $.data.id } }
            - { call: "POST /mro/work-orders/${wo_adj}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo_adj}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_adj_q: $.data.version } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_cal}", unit_id: "${u_cal}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo_cal: $.data.id } }
            - { call: "POST /mro/work-orders/${wo_cal}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo_cal}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_cal_q: $.data.version } }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo_adj}/quote-approval", payload: { expected_work_order_version: "${v_adj_q}" }, as: Customer, as_user_id: "${c_adj}" }
            - { call: "POST /mro/work-orders/${wo_cal}/quote-approval", payload: { expected_work_order_version: "${v_cal_q}" }, as: Customer, as_user_id: "${c_cal}" }
            - { call: "POST /mro/work-orders/${wo_adj}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/work-orders/${wo_cal}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-B", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_b: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo_adj}", start_time: "2026-08-09T00:00:00Z", end_time: "2026-08-09T04:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/test-cells/${cell_b}/bookings", payload: { work_order_id: "${wo_cal}", start_time: "2026-08-09T00:00:00Z", end_time: "2026-08-09T04:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T02:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo_adj}/test-results", payload: { result: "PASS", atp_reference: "ATP-A1" }, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo_adj}/release", payload: {}, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo_cal}/test-results", payload: { result: "PASS", atp_reference: "ATP-B1" }, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo_cal}/release", payload: {}, as: Inspector, as_user_id: "insp-9" }
          trigger:
            - { call: "POST /mro/work-orders/${wo_adj}/invoice", payload: {}, as: CustomerServiceRep, captures: { pen_adj: $.data.penalty_credit_cents, tot_adj: $.data.total_cents } }
            - { call: "POST /mro/work-orders/${wo_cal}/invoice", payload: {}, as: CustomerServiceRep, captures: { pen_cal: $.data.penalty_credit_cents, tot_cal: $.data.total_cents } }
          assert:
            - "Invoice(${wo_adj}).penalty_variant == 'ADJUSTED' and penalty_credit_cents == 170000 (elapsed 194h - delay 60h = 134h; excess 34h * 5000)"
            - "Invoice(${wo_cal}).penalty_variant == 'CALENDAR' and penalty_credit_cents == 470000 (elapsed 194h; excess 94h * 5000)"
            - "tot_adj == 2230000 and tot_cal == 1930000 — identical timestamps, variant-only divergence of 300000 cents"
      - name: warranty_credit_full_vs_prorated_variant
        grounds:
          - calculations.warranty_credit_calc
          - entities.WarrantyClaim.fields.credit_variant
          - entities.WarrantyClaim.fields.credit_cents
        distinguishing_aspect: |
          WarrantyClaim-domain calculation (distinct entity domain from the TAT/Invoice instance):
          FULL credits the entire labor+parts base while PRORATED scales it by remaining cycles;
          the variant is selected by the claim_cycles_used*2 <= cycle_limit rule, and the two
          variants pay 2575000 vs 800000 on their respective claims.
        test_recipe:
          setup:
            - "Customer C, part (replacement 10000000, warranty 500 cycles / 24 months), two units U1/U2 each driven through a full OVERHAUL work order to CLOSED with an invoice"
            - "WO1 carries one requisition (qty 2 @ 250000, tier-2 markup 15% -> 575000): invoice base labor 2000000 + parts 575000 = 2575000"
            - "WO2 carries no parts: invoice base 2000000; claim1 uses 200 cycles (FULL band), claim2 uses 300 cycles (PRORATED band)"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U2", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 3900, cycles_since_overhaul: 250, manufactured_at: "2016-01-15" }, as: CustomerServiceRep, captures: { u2: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo1: $.data.id } }
            - { call: "POST /mro/work-orders/${wo1}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo1}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v1_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo1}/quote-approval", payload: { expected_work_order_version: "${v1_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo1}/parts-requisitions", payload: { part_number: "BRG-32-99", quantity: 2, requested_source: "OEM" }, as: Technician, captures: { rq1: $.data.id } }
            - { call: "POST /mro/parts-requisitions/${rq1}/source-approval", payload: { approved: true }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq1}/receive", payload: { unit_cost_cents: 250000 }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq1}/issue", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo1}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo1}", start_time: "2026-08-02T01:00:00Z", end_time: "2026-08-02T05:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T02:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo1}/test-results", payload: { result: "PASS", atp_reference: "ATP-1" }, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo1}/release", payload: {}, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo1}/invoice", payload: {}, as: CustomerServiceRep }
            - { call: "POST /mro/work-orders/${wo1}/close", payload: {}, as: CustomerServiceRep }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u2}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo2: $.data.id } }
            - { call: "POST /mro/work-orders/${wo2}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo2}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 500000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v2_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo2}/quote-approval", payload: { expected_work_order_version: "${v2_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo2}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo2}", start_time: "2026-08-02T05:00:00Z", end_time: "2026-08-02T09:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T06:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo2}/test-results", payload: { result: "PASS", atp_reference: "ATP-2" }, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo2}/release", payload: {}, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo2}/invoice", payload: {}, as: CustomerServiceRep }
            - { call: "POST /mro/work-orders/${wo2}/close", payload: {}, as: CustomerServiceRep }
          trigger:
            - { call: "POST /mro/warranty-claims", payload: { original_work_order_id: "${wo1}", claim_cycles_used: 200, claim_months_used: 10, failure_description: "Bearing spalling within warranty" }, as: Customer, as_user_id: "${c_id}", captures: { cl1: $.data.id } }
            - { call: "POST /mro/warranty-claims/${cl1}/review", payload: { decision: "ACCEPT" }, as: ShopManager, captures: { cl1_variant: $.data.credit_variant, cl1_credit: $.data.credit_cents } }
            - { call: "POST /mro/warranty-claims", payload: { original_work_order_id: "${wo2}", claim_cycles_used: 300, claim_months_used: 10, failure_description: "Seal leak within warranty" }, as: Customer, as_user_id: "${c_id}", captures: { cl2: $.data.id } }
            - { call: "POST /mro/warranty-claims/${cl2}/review", payload: { decision: "ACCEPT" }, as: ShopManager, captures: { cl2_variant: $.data.credit_variant, cl2_credit: $.data.credit_cents } }
          assert:
            - "WarrantyClaim(${cl1}).credit_variant == 'FULL' and credit_cents == 2575000 (200*2=400 <= 500)"
            - "WarrantyClaim(${cl2}).credit_variant == 'PRORATED' and credit_cents == 800000 (base 2000000 * (500-300)/500)"
            - "cl1_credit != cl2_credit — same acceptance action, variant-selected divergence"

  # =========================================================================
  # Rule 2 — combinatorial formulas across DIFFERENT modes (a), (b), (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tat_penalty_five_input_max_min_cap
        grounds:
          - calculations.tat_penalty_calc
          - entities.WorkOrder.fields.accumulated_delay_hours
        distinguishing_aspect: |
          Mode (a): five inputs (elapsed, delay, guarantee, rate, cap_pct x subtotal) interact
          through nested max()/min() — excess is floored at 0 and the penalty is capped by a
          percentage of the invoice subtotal computed only after the per-line sums exist.
        test_recipe:
          setup:
            - "Customer (ADJUSTED, 100h guarantee, 5000/h, cap 50%), part PN-32-ACT, unit SN-U1, OVERHAUL work order with one requisition (2 @ 250000 -> 575000) and one 4h booking @100000 (400000); quote at receipt; approval after 60h delay; release at elapsed 194h"
            - "Subtotal 2000000+575000+400000 = 2975000; cap = 1487500; raw penalty 34*5000 = 170000 (cap NOT binding here)"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo}/parts-requisitions", payload: { part_number: "BRG-32-99", quantity: 2, requested_source: "OEM" }, as: Technician, captures: { rq: $.data.id } }
            - { call: "POST /mro/parts-requisitions/${rq}/source-approval", payload: { approved: true }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq}/receive", payload: { unit_cost_cents: 250000 }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq}/issue", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-09T00:00:00Z", end_time: "2026-08-09T04:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T02:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/test-results", payload: { result: "PASS", atp_reference: "ATP-1" }, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo}/release", payload: {}, as: Inspector, as_user_id: "insp-9" }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/invoice", payload: {}, as: CustomerServiceRep, captures: { pen: $.data.penalty_credit_cents, tot: $.data.total_cents, parts: $.data.parts_cents, fee: $.data.test_fee_cents } }
          assert:
            - "pen == 170000 (max(0, 194-60-100)=34h excess * 5000, min against cap 1487500 not binding)"
            - "parts == 575000 and fee == 400000 and tot == 2805000"
            - "WorkOrder(${wo}).accumulated_delay_hours == 60.0 and promised_return_at == '2026-08-05T04:00:00Z' (received + 100h)"
      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_total_calc
          - entities.PartsRequisition.fields.extended_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each requisition line is rounded
          round_half_up to whole cents BEFORE summation; two qty-1 lines at unit_cost 33333 with
          25% markup yield 41666+41666 = 83332, while the forbidden sum-then-round order yields
          round(66666*1.25) = 83333 — a one-cent divergence the test must pin to 83332.
        test_recipe:
          setup:
            - "Standard OVERHAUL work order with TWO separate requisitions, each quantity 1 at unit_cost 33333 (tier-1 25% markup)"
            - "One 4h booking @ 100000 (400000); release well inside TAT so penalty is 0"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 100000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo}/parts-requisitions", payload: { part_number: "SEAL-1", quantity: 1, requested_source: "OEM" }, as: Technician, captures: { rq1: $.data.id } }
            - { call: "POST /mro/parts-requisitions/${rq1}/source-approval", payload: { approved: true }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq1}/receive", payload: { unit_cost_cents: 33333 }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq1}/issue", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/parts-requisitions", payload: { part_number: "SEAL-2", quantity: 1, requested_source: "OEM" }, as: Technician, captures: { rq2: $.data.id } }
            - { call: "POST /mro/parts-requisitions/${rq2}/source-approval", payload: { approved: true }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq2}/receive", payload: { unit_cost_cents: 33333 }, as: PartsBuyer }
            - { call: "POST /mro/parts-requisitions/${rq2}/issue", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-02T01:00:00Z", end_time: "2026-08-02T05:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T02:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/test-results", payload: { result: "PASS", atp_reference: "ATP-1" }, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo}/release", payload: {}, as: Inspector, as_user_id: "insp-9" }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/invoice", payload: {}, as: CustomerServiceRep, captures: { parts: $.data.parts_cents, tot: $.data.total_cents, pen: $.data.penalty_credit_cents } }
          assert:
            - "parts == 83332 (per-line round(33333*1.25)=41666 twice; NOT 83333 from sum-then-round)"
            - "pen == 0 (adjusted elapsed 2h <= 100h guarantee) and tot == 2483332"
      - name: exchange_settlement_pinned_evaluation_order
        grounds:
          - calculations.exchange_settlement_calc
          - entities.ExchangeAgreement.fields.late_fee_cents
          - entities.ExchangeAgreement.fields.core_charge_cents
        distinguishing_aspect: |
          Mode (c): the late-fee cap references (replacement_value - core_charge) while
          core_charge itself depends on the BER status of the same core — only the pinned
          (1)->(5) evaluation order makes the settlement well-defined; a BER core 3 days late
          yields late_fee 150000 under the cap max(0, 10000000-8000000), not 0 and not uncapped.
        test_recipe:
          setup:
            - "Customer C; part PN-32-ACT (replacement 10000000, BER 65% -> 6500000); pool unit SN-P1 (SHOP/IN_POOL/SERVICEABLE); core unit SN-C1 (CUSTOMER/OFF_SITE/UNSERVICEABLE)"
            - "Exchange fulfilled at 2026-08-01T00:00:00Z (core_due_date 2026-08-16); clock advanced to 2026-08-19T00:00:00Z (3 late days, inside 5-day grace)"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-P1", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 3000, cycles_since_overhaul: 50, manufactured_at: "2014-03-01" }, as: CustomerServiceRep, captures: { u_pool: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-C1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 7000, cycles_since_overhaul: 900, manufactured_at: "2012-05-01" }, as: CustomerServiceRep, captures: { u_core: $.data.id } }
            - { call: "POST /mro/exchange-agreements", payload: { customer_id: "${c_id}", part_id: "${p_id}" }, as: CustomerServiceRep, captures: { ex: $.data.id } }
            - { call: "POST /mro/exchange-agreements/${ex}/fulfill", payload: {}, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T00:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /mro/exchange-agreements/${ex}/core-return", payload: { core_unit_id: "${u_core}", core_teardown_estimate_cents: 7000000 }, as: Technician, captures: { st: $.data.status, cc: $.data.core_charge_cents, lf: $.data.late_fee_cents, tot: $.data.settlement_total_cents, ber: $.data.core_ber_flag } }
          assert:
            - "ber == true (7000000 >= 6500000) so core_charge_cents == 8000000 (80% of replacement)"
            - "lf == 150000 (3 days * 50000, capped by max(0, 10000000-8000000)=2000000 — cap non-binding)"
            - "tot == 8175000 (25000 admin + 8000000 + 150000) and st == 'CLOSED'"
            - "ComponentUnit(${u_core}).ownership == 'SHOP' and custody_status == 'IN_SHOP' (BER cores are not pooled)"

  # =========================================================================
  # Rule 3 — non-linear state machines on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_fail_retest_cycle
        grounds:
          - state_machines.WorkOrder.READY_FOR_TEST_to_REPAIR_IN_PROGRESS
          - state_machines.WorkOrder.REPAIR_IN_PROGRESS_to_READY_FOR_TEST
          - state_machines.WorkOrder.READY_FOR_TEST_to_TEST_PASSED
        distinguishing_aspect: |
          WorkOrder is cyclic: READY_FOR_TEST -> REPAIR_IN_PROGRESS -> READY_FOR_TEST ->
          TEST_PASSED; the FAIL hop also cascades an OPEN 'ATP FAILURE' DiscrepancyCard that
          blocks the second complete-repair until dispositioned.
        test_recipe:
          setup:
            - "OVERHAUL work order approved and repair-completed by tech-1; cell booked twice (first window consumed by the FAIL); clock inside each window at test time"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-03T00:00:00Z", end_time: "2026-08-03T04:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T01:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/test-results", payload: { result: "FAIL", atp_reference: "ATP-F1" }, as: Inspector, as_user_id: "insp-9", captures: { st_fail: $.data.status, tries1: $.data.test_attempt_count, open1: $.data.open_discrepancy_count } }
            - { call: "GET /mro/work-orders/${wo}/discrepancies", payload: {}, as: Technician, captures: { fail_card: "$.data[0].id" } }
            - { call: "POST /mro/discrepancies/${fail_card}/disposition", payload: { disposition_text: "Rework rig pin per CMM 32-11-01 para 7" }, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-03T05:00:00Z", end_time: "2026-08-03T09:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/test-results", payload: { result: "PASS", atp_reference: "ATP-F2" }, as: Inspector, as_user_id: "insp-9", captures: { st_pass: $.data.status, tries2: $.data.test_attempt_count, open2: $.data.open_discrepancy_count } }
          assert:
            - "st_fail == 'REPAIR_IN_PROGRESS' and tries1 == 1 and open1 == 1 (cascade created the OPEN ATP-FAILURE card)"
            - "fail_card card finding_text == 'ATP FAILURE: ATP-F1' with severity MAJOR and status OPEN before disposition"
            - "st_pass == 'TEST_PASSED' and tries2 == 2 and open2 == 0 — full retest loop completed"
      - name: requisition_reject_resubmit_cycle
        grounds:
          - state_machines.PartsRequisition.REQUESTED_to_SOURCE_REJECTED
          - state_machines.PartsRequisition.REQUESTED_to_APPROVED
          - state_machines.PartsRequisition.PMA_REJECTED_to_APPROVED
        distinguishing_aspect: |
          PartsRequisition (different entity than WorkOrder) is cyclic with a fork: an OEM
          request is SOURCE_REJECTED then re-approved (REQUESTED->SOURCE_REJECTED->APPROVED),
          and a separate PMA request is customer-rejected then salvaged via the OEM-override
          fork (PMA_PENDING_CUSTOMER->PMA_REJECTED->APPROVED) — two loop shapes on one machine.
        test_recipe:
          setup:
            - "Work order approved (REPAIR_IN_PROGRESS); requisition RQ-OEM (requested_source OEM) and requisition RQ-PMA (requested_source PMA) both created"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/parts-requisitions", payload: { part_number: "BRG-1", quantity: 1, requested_source: "OEM" }, as: Technician, captures: { rq_oem: $.data.id } }
            - { call: "POST /mro/parts-requisitions/${rq_oem}/source-approval", payload: { approved: false }, as: PartsBuyer, captures: { st1: $.data.status } }
            - { call: "POST /mro/parts-requisitions/${rq_oem}/source-approval", payload: { approved: true }, as: PartsBuyer, captures: { st2: $.data.status } }
            - { call: "POST /mro/work-orders/${wo}/parts-requisitions", payload: { part_number: "SEAL-PMA", quantity: 1, requested_source: "PMA" }, as: Technician, captures: { rq_pma: $.data.id, st3: $.data.status } }
            - { call: "POST /mro/parts-requisitions/${rq_pma}/pma-approval", payload: { approved: false }, as: Customer, as_user_id: "${c_id}", captures: { st4: $.data.status } }
            - { call: "POST /mro/parts-requisitions/${rq_pma}/source-approval", payload: { approved: true, source_override: "OEM" }, as: PartsBuyer, captures: { st5: $.data.status, src5: $.data.approved_source } }
          assert:
            - "st1 == 'SOURCE_REJECTED' then st2 == 'APPROVED' — reject/resubmit cycle on the OEM branch"
            - "st3 == 'PMA_PENDING_CUSTOMER' (PMA requests fork to the customer gate), st4 == 'PMA_REJECTED', st5 == 'APPROVED' with src5 == 'OEM' (override fork rejoins)"
            - "WorkOrder(${wo}).status == 'AWAITING_PARTS' while both requisitions unresolved"
      - name: unit_parallel_condition_custody_dimensions
        grounds:
          - state_machines.ComponentUnit
          - entities.ComponentUnit.fields.condition_status
          - entities.ComponentUnit.fields.custody_status
        distinguishing_aspect: |
          ComponentUnit carries two independent parallel state dimensions on one row:
          condition_status (SERVICEABLE/UNSERVICEABLE/SCRAPPED) and custody_status
          (OFF_SITE/IN_SHOP/AWAITING_SHIPMENT/SHIPPED/IN_POOL/ON_LEASE) move on different
          triggers — release flips condition to SERVICEABLE while custody only reaches
          AWAITING_SHIPMENT; close moves custody to SHIPPED without touching condition.
        test_recipe:
          setup:
            - "Unit SN-U1 (UNSERVICEABLE/OFF_SITE) driven through a full OVERHAUL work order past release and close"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-02T01:00:00Z", end_time: "2026-08-02T05:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T02:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/test-results", payload: { result: "PASS", atp_reference: "ATP-1" }, as: Inspector, as_user_id: "insp-9" }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/release", payload: {}, as: Inspector, as_user_id: "insp-9" }
            - { call: "GET /mro/units/${u1}", payload: {}, as: ShopManager, captures: { cond_rel: $.data.condition_status, cust_rel: $.data.custody_status, cso_rel: $.data.cycles_since_overhaul } }
            - { call: "POST /mro/work-orders/${wo}/invoice", payload: {}, as: CustomerServiceRep }
            - { call: "POST /mro/work-orders/${wo}/close", payload: {}, as: CustomerServiceRep }
            - { call: "GET /mro/units/${u1}", payload: {}, as: ShopManager, captures: { cond_fin: $.data.condition_status, cust_fin: $.data.custody_status } }
          assert:
            - "After release: cond_rel == 'SERVICEABLE' AND cust_rel == 'AWAITING_SHIPMENT' (condition flipped, custody only mid-path) and cso_rel == 0 (overhaul cycle reset)"
            - "After close: cust_fin == 'SHIPPED' AND cond_fin == 'SERVICEABLE' (custody moved; condition untouched) — dimensions provably independent"
            - "ComponentUnit(${u1}).total_cycles == 4800 throughout (shop never mutates operator-accumulated cycles)"

  # =========================================================================
  # Rule 4 — transitive cascades from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: core_return_settlement_chain_depth4
        grounds:
          - state_machines.ExchangeAgreement.FULFILLED_to_CLOSED
          - calculations.exchange_settlement_calc
          - calculations.credit_exposure_calc
        distinguishing_aspect: |
          Trigger POST core-return runs a depth-4 chain, each hop caused by the previous:
          (1) core unit inducted (ownership->SHOP, custody->IN_POOL, condition->SERVICEABLE) ->
          (2) induction evaluation settles and creates Invoice(EXCHANGE, ISSUED) ->
          (3) invoice issuance debits Customer.current_exposure_cents ->
          (4) exposure posting closes the agreement. Not a fan-out: each link reads the
          previous link's mutation.
        test_recipe:
          setup:
            - "Customer C (credit limit high); part PN-32-ACT; pool unit SN-P1 (SHOP/IN_POOL/SERVICEABLE); core SN-C1 (CUSTOMER/OFF_SITE/UNSERVICEABLE); agreement fulfilled at clock default 2026-08-01T00:00:00Z (core_due_date 2026-08-16)"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-P1", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 3000, cycles_since_overhaul: 50, manufactured_at: "2014-03-01" }, as: CustomerServiceRep, captures: { u_pool: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-C1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 7000, cycles_since_overhaul: 900, manufactured_at: "2012-05-01" }, as: CustomerServiceRep, captures: { u_core: $.data.id } }
            - { call: "POST /mro/exchange-agreements", payload: { customer_id: "${c_id}", part_id: "${p_id}" }, as: CustomerServiceRep, captures: { ex: $.data.id } }
            - { call: "POST /mro/exchange-agreements/${ex}/fulfill", payload: {}, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /mro/exchange-agreements/${ex}/core-return", payload: { core_unit_id: "${u_core}", core_teardown_estimate_cents: 1000000 }, as: Technician, captures: { st: $.data.status, tot: $.data.settlement_total_cents } }
            - { call: "GET /mro/units/${u_core}", payload: {}, as: ShopManager, captures: { own: $.data.ownership, cust: $.data.custody_status, cond: $.data.condition_status } }
            - { call: "GET /mro/invoices?exchange_agreement_id=${ex}", payload: {}, as: ShopManager, captures: { inv_tot: "$.data[0].total_cents", inv_src: "$.data[0].source_type", inv_st: "$.data[0].status" } }
            - { call: "GET /mro/customers/${c_id}", payload: {}, as: ShopManager, captures: { expo: $.data.current_exposure_cents } }
            - { call: "GET /mro/units/${u_core}/traceability", payload: {}, as: ShopManager }
          assert:
            - "own == 'SHOP' and cust == 'IN_POOL' and cond == 'SERVICEABLE' (hop 1: NON_BER core inducted straight to pool)"
            - "inv_src == 'EXCHANGE' and inv_st == 'ISSUED' and inv_tot == 25000 (hop 2: admin fee only — NON_BER, on time)"
            - "expo == 25000 (hop 3) and st == 'CLOSED' (hop 4) and tot == 25000"
            - "traceability for ${u_core} contains BIRTH then CORE_IN in chronological order (back-to-birth chain preserved)"
      - name: warranty_accept_rework_chain_depth3
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_ACCEPTED
          - entities.WarrantyClaim.fields.rework_work_order_id
          - calculations.warranty_credit_calc
        distinguishing_aspect: |
          Trigger POST review ACCEPT runs a depth-3 chain from a DIFFERENT trigger than
          core-return: (1) claim ACCEPTED with credit computed -> (2) acceptance spawns a
          rework WorkOrder directly in REPAIR_IN_PROGRESS -> (3) rework induction mutates the
          unit (custody SHIPPED->IN_SHOP, condition SERVICEABLE->UNSERVICEABLE) and appends a
          WARRANTY_INDUCT traceability event.
        test_recipe:
          setup:
            - "Customer C; unit SN-U1 driven through a complete OVERHAUL work order to CLOSED (invoice labor 2000000 + parts 575000 issued); claim at 200 cycles / 10 months"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
