- rule_id: priority_pair_validation_conflict
  instances:
  - name: stale_version_beats_invalid_state_on_sl_activation
    grounds:
    - validations[priority=5]
    - validations[priority=6]
    - concurrency_rules[service-level-activate-stale-contract]
    - errors.ERR_STALE_VERSION
    distinguishing_aspect: 'Priority pair (state-OCC at 5) vs (state-transition at 6): a service

      level already EFFECTIVE (transition invalid) activated with a stale

      contract version must return 412 ERR_STALE_VERSION, not 409

      ERR_INVALID_STATE — the OCC check outranks the state check.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01. Contract ACTIVE (version 3 after activation cascade + contract activation); service level sl2 still DRAFT but its
        sibling was activated earlier; the caller holds a stale observed contract version 2.
      - Additionally the target service level has already been archived... no — the target is EFFECTIVE already via a prior activation, so the
        transition is invalid AND the OCC value is stale.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
        captures:
          c_v_stale: $.data.version
      - call: GET /contracts/${c_id}
        payload: {}
        as: PlatformAdmin
        captures:
          c_v_fresh: $.data.version
      trigger:
      - call: POST /service-levels/${sl_asa_id}/transition
        payload:
          to_status: EFFECTIVE
          expected_contract_version: ${c_v_stale} - 1
        as: OpsManager
        captures:
          occ_err: $.data.error_id
      assert:
      - the response status is 412 and occ_err == ERR_STALE_VERSION
      - occ_err != ERR_INVALID_STATE even though the target is already EFFECTIVE
      - ServiceLevel.${sl_asa_id}.status remains EFFECTIVE and Contract.version unchanged
  - name: missing_role_beats_state_check_on_call_answer
    grounds:
    - validations[priority=2]
    - validations[priority=6]
    - errors.ERR_FORBIDDEN
    distinguishing_aspect: 'A different error-category pair than the OCC instance: (auth at 2)

      vs (state at 6). A KnowledgeManager (role not allowed on

      /calls/{id}/transition) attempting to answer a WAITING call must get

      403 ERR_FORBIDDEN, not 409 ERR_INVALID_STATE — auth outranks state.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01. ACTIVE contract with queue; one WAITING call (routing never happened, so ANSWERED would also be an invalid state).
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - *id004
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          pcall: $.data.id
      trigger:
      - call: POST /calls/${pcall}/transition
        payload:
          to_status: ANSWERED
        as: KnowledgeManager
        captures:
          role_err: $.data.error_id
      assert:
      - the response status is 403 and role_err == ERR_FORBIDDEN
      - role_err != ERR_INVALID_STATE even though WAITING -> ANSWERED is not a defined transition
      - Call.${pcall}.status remains WAITING
