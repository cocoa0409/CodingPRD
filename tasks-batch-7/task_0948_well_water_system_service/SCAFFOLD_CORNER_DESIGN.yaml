            - "WellProfile.${well_id}.last_inspection_completed_at == null"
            - "WellProfile.${well_id}.pressure_tank_drawdown_gallons == 6.0"
            - "WellProfile.${well_id}.duty_cycle_ratio == 5.00 and WellProfile.${well_id}.duty_cycle_class == MODERATE"
            - "GET /water-service/inspections with well_profile_id == ${well_id} and status == CANCELLED returns exactly 1 row"

      - name: corner_endpoint_technician_list_filters_combine_conjunctively
        claim_type: Standard CRUD
        grounds: ["endpoints", "entities.Technician.fields.tier", "entities.Technician.fields.status", "entities.Technician.fields.home_jurisdiction_code"]
        distinguishing_aspect: |
          Over four technicians the three declared filters combine with AND, not OR:
          tier=MASTER alone returns 2 rows, status=AVAILABLE alone returns 3, and
          tier=MASTER together with status=AVAILABLE and home_jurisdiction_code=JUR_ALPHA
          returns exactly 1. An implementation that ORs the predicates returns 4 for
          the combined query.
        test_recipe:
          setup:
            - "Four technicians: MASTER/AVAILABLE/JUR_ALPHA, MASTER/OFF_DUTY/JUR_ALPHA, JOURNEYMAN/AVAILABLE/JUR_BRAVO and APPRENTICE/AVAILABLE/JUR_ALPHA, created in that order."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/technicians"
              payload: { full_name: "Filter Master Alpha", tier: "MASTER", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tf1: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Filter Master Off", tier: "MASTER", home_jurisdiction_code: "JUR_ALPHA", status: "OFF_DUTY" }
              as: PlatformAdmin
              captures: { tf2: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Filter Journeyman Bravo", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_BRAVO", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tf3: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Filter Apprentice Alpha", tier: "APPRENTICE", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tf4: $.data.id }
          trigger:
            - call: "GET /water-service/technicians"
              payload: { tier: "MASTER" }
              as: Dispatcher
            - call: "GET /water-service/technicians"
              payload: { status: "AVAILABLE" }
              as: Dispatcher
            - call: "GET /water-service/technicians"
              payload: { home_jurisdiction_code: "JUR_BRAVO" }
              as: Dispatcher
            - call: "GET /water-service/technicians"
              payload: { tier: "MASTER", status: "AVAILABLE", home_jurisdiction_code: "JUR_ALPHA" }
              as: Dispatcher
          assert:
            - "The tier MASTER filter returns exactly 2 rows in the order ${tf1}, ${tf2} with total_count == 2"
            - "The status AVAILABLE filter returns exactly 3 rows in the order ${tf1}, ${tf3}, ${tf4}"
            - "The home_jurisdiction_code JUR_BRAVO filter returns exactly 1 row, ${tf3}"
            - "The combined tier plus status plus home_jurisdiction_code filter returns exactly 1 row, ${tf1}, with total_count == 1 and has_more == false"

