          - errors[ERR_LICENSE_EXPIRED]
          - errors[ERR_LICENSE_CATEGORY_MISMATCH]
          - errors[ERR_BUFFER_ZONE_VIOLATION]
          - errors[ERR_REI_ACTIVE]
          - errors[ERR_COURSE_CLOSED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / buffer_zone_safety_outranks_license_category_referential
          rationale: "ERR_BUFFER_ZONE_VIOLATION and ERR_LICENSE_CATEGORY_MISMATCH are both raised there; ERR_LICENSE_EXPIRED by application_verify_depends_on_verifier_applicator_license_state, ERR_REI_ACTIVE by rei_safety_outranks_play_conflict_temporal and window_start_exactly_at_rei_expiry_is_admitted, and ERR_COURSE_CLOSED by window_start_depends_on_course_play_posture."

      - name: pump_and_scheduling_capacity_errors_are_triggered_by_the_difficulty_suite
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PUMP_OFFLINE]
          - errors[ERR_PUMP_ZONE_CAPACITY]
          - errors[ERR_PUMP_FLOW_CAPACITY]
          - errors[ERR_WINDOW_OVERLAP]
          - errors[ERR_WINDOW_CONFLICTS_PLAY]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pump_station_zone_capacity_counts_half_open_intersections
          rationale: "ERR_PUMP_ZONE_CAPACITY is raised there, ERR_PUMP_FLOW_CAPACITY by pump_flow_constraint_outranks_water_allocation_fiscal, ERR_PUMP_OFFLINE by irrigation_run_creation_depends_on_pump_station_status, ERR_WINDOW_OVERLAP by crew_windows_on_one_turf_area_conflict_on_closed_intervals and ERR_WINDOW_CONFLICTS_PLAY by hole_occupancy_conflict_uses_paced_half_open_windows_plus_clearance."

      - name: cap_and_budget_errors_are_triggered_by_the_difficulty_suite
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DEFERRAL_LIMIT_REACHED]
          - errors[ERR_INSUFFICIENT_READINGS]
          - errors[ERR_NITROGEN_BUDGET_EXCEEDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / maintenance_window_defer_reschedule_cycle_caps_at_two
          rationale: "ERR_DEFERRAL_LIMIT_REACHED is raised there, ERR_INSUFFICIENT_READINGS by certification_requires_the_third_measured_green_exactly and ERR_NITROGEN_BUDGET_EXCEEDED by plan_ledger_exactly_at_budget_then_one_nickel_over."

  # =========================================================================
  - section: rbac
    instances:
      - name: each_role_cannot_perform_another_roles_exclusive_operation
        claim_type: role_isolation
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.Superintendent.exclusive_operations
          - roles.Agronomist.exclusive_operations
          - roles.Applicator.exclusive_operations
          - roles.EquipmentTechnician.exclusive_operations
        distinguishing_aspect: "Six calls cross the peer boundaries in both directions, five of them naming ids that resolve to nothing, so each must return ERR_UNAUTHORIZED (403) and never a 404: authorisation at priority 2 is decided before any existence check at priority 4 or later. The Superintendent is refused the Applicator's and the Agronomist's exclusive writes, which rules out a hierarchical-override reading of the role model, and the Applicator's refusal lands on a real DRAFT plan so it cannot be explained away by non-existence."
        test_recipe:
          setup:
            - "One course and one DRAFT 2026 plan, so the approve attempt targets a row that really exists; every other referenced id is a well-formed UUID that resolves to nothing."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
          trigger:
            - call: "POST /applications/11111111-1111-4111-8111-111111111120/void"
              payload: { void_reason: "DATA_ENTRY_ERROR" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_void: $.data.error_id }
            - call: "POST /equipment-units/11111111-1111-4111-8111-111111111121/retire"
              payload: {}
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { err_retire: $.data.error_id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "11111111-1111-4111-8111-111111111122", turf_area_id: "11111111-1111-4111-8111-111111111123", task_type: "MOWING", window_start: "2026-08-15T06:00:00Z", window_end: "2026-08-15T08:00:00Z", crew_size: 2 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { err_window: $.data.error_id }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v}" }
              as: Applicator
              as_user_id: "11111111-1111-4111-8111-111111111125"
              captures: { err_approve: $.data.error_id }
            - call: "POST /applications"
              payload: { turf_area_id: "11111111-1111-4111-8111-111111111126", product_id: "11111111-1111-4111-8111-111111111127", applicator_id: "11111111-1111-4111-8111-111111111128", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 100, wind_speed_mph: 4, distance_to_water_ft: 40 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_record: $.data.error_id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "11111111-1111-4111-8111-111111111129", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_plan: $.data.error_id }
          assert:
            - "all six calls return HTTP 403"
            - "${err_void} == ERR_UNAUTHORIZED (void is Superintendent-exclusive)"
            - "${err_retire} == ERR_UNAUTHORIZED (retire is Superintendent-exclusive; the technician may only log hours and service)"
            - "${err_window} == ERR_UNAUTHORIZED (booking crew windows is Agronomist-exclusive)"
            - "${err_approve} == ERR_UNAUTHORIZED (approve is Superintendent-exclusive) and neither ERR_SEGREGATION_OF_DUTIES nor ERR_PLAN_STATE_INVALID, even though the DRAFT plan could not legally be approved by anyone"
            - "${err_record} == ERR_UNAUTHORIZED (recording an application is Applicator-exclusive)"
            - "${err_plan} == ERR_UNAUTHORIZED (authoring a plan is Agronomist-exclusive)"
            - "no call returns 404, which proves priority 2 runs before the existence band"
            - "GET /applicators returns total_count == 0 and AgronomicPlan.${plan_id}.status == DRAFT with version == ${plan_v} == 1: nothing was created or moved by any refused call"

      - name: request_without_a_valid_role_header_is_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 tests two things: presence of X-User-Role and membership in the five declared roles, so an omitted header and the plausible-but-undeclared role Greenkeeper both return ERR_UNAUTHENTICATED (401) — not 403 — and a missing X-User-ID on a duties-relevant endpoint does the same."
        test_recipe:
          setup:
            - "One course, so the target of the read exists and cannot explain the failure."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          trigger:
            - call: "GET /courses/${course_id}"
              payload: {}
              as: "(X-User-Role header omitted entirely)"
              captures: { err_missing: $.data.error_id }
            - call: "GET /courses/${course_id}"
              payload: {}
              as: "Greenkeeper (not one of the five declared roles)"
              as_user_id: "super-1"
              captures: { err_unknown_role: $.data.error_id }
            - call: "POST /applications/11111111-1111-4111-8111-111111111130/verify"
              payload: {}
              as: Applicator
              as_user_id: "(X-User-ID header omitted entirely)"
              captures: { err_missing_user: $.data.error_id }
          assert:
            - "all three calls return HTTP 401"
            - "${err_missing} == ERR_UNAUTHENTICATED"
            - "${err_unknown_role} == ERR_UNAUTHENTICATED, not ERR_UNAUTHORIZED: an unknown role never reaches the endpoint's roles list"
            - "${err_missing_user} == ERR_UNAUTHENTICATED, not ERR_APPLICATION_NOT_FOUND: on a duties-relevant endpoint a missing X-User-ID fails priority 1, and authentication precedes existence"
            - "Course.${course_id}.version == 1"

      - name: plan_approval_by_the_submitting_user_is_forbidden
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=38]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.AgronomicPlan.SUBMITTED_to_ACTIVE
        distinguishing_aspect: "The duties check compares X-User-ID values and not roles: one dual-hatted human (dual-1) submits as Agronomist and is then refused as Superintendent with ERR_SEGREGATION_OF_DUTIES (403), while super-1 approves the very same submitted version successfully."
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN on hole 7."
            - "One 2026 plan with a PLANNED AERATION task, submitted by user dual-1 acting as Agronomist."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "dual-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "AERATION", planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "dual-1"
              captures: { task1_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "dual-1"
              captures: { plan_v_submitted: $.data.version }
          trigger:
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "dual-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "${plan_v_submitted} == 2 and AgronomicPlan.${plan_id}.submitted_by_user_id == dual-1"
            - "the dual-1 approval returns HTTP 403 with ${err_id} == ERR_SEGREGATION_OF_DUTIES, not ERR_UNAUTHORIZED (dual-1 legitimately holds the Superintendent role here)"
            - "after the refusal AgronomicPlan.${plan_id}.status == SUBMITTED and version == 2, so ${plan_v_submitted} is still current"
            - "the super-1 approval returns HTTP 200: AgronomicPlan.${plan_id}.status == ACTIVE and version == 3"
            - "PlanTask.${task1_id}.status == PLANNED"

