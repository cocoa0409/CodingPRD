  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_bulk_publish_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[bulk-publish-stale-provider]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A bulk publish carrying a stale expected_provider_version (captured before an intervening slot creation bumped the version) is rejected with 412 ERR_STALE_VERSION and creates/closes nothing."
        test_recipe:
          setup: ["bookable practice/provider; version observed, then a single slot created (version advanced), then bulk publish with the stale version"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
              captures: { prov_v: $.data.version }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /marketplace/providers/${prov_id}/slots/bulk-publish"
              payload: { slots: [{ start_at: "2026-09-04T10:00:00Z", end_at: "2026-09-04T10:30:00Z" }], expected_provider_version: "${prov_v}" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION with http 412"
            - "Slot.${s1} remains OPEN (the stale publish is fully rolled back)"

      - name: occ_patient_plan_update_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[patient-plan-update-stale]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PATCH /patients/{id} with a stale expected_patient_version is rejected 412; with the current version it succeeds and bumps version by 1."
        test_recipe:
          setup: ["patient registered (version 1); one plan exists"]
          setup_api_calls:
            - call: "POST /marketplace/insurance-plans"
              payload: { carrier: "Aetna", plan_name: "A1", plan_code: "A1" }
              as: OpsAdmin
              captures: { plan1: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat One", email: "p1@x.com" }
              as: Anonymous
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "PATCH /marketplace/patients/${pat_id}"
              payload: { plan_id: "${plan1}", expected_patient_version: "${pat_v}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { v2: $.data.version, plan_set: $.data.plan_id }
            - call: "PATCH /marketplace/patients/${pat_id}"
              payload: { plan_id: null, expected_patient_version: "${pat_v}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { err: $.data.error_id }
          assert:
            - "v2 == ${pat_v} + 1 and plan_set == ${plan1}"
            - "err == ERR_STALE_VERSION with http 412 on the stale second patch"
            - "Patient plan_id remains ${plan1}"

      - name: epoch_run_checkpoint_ages_strikes
        claim_type: rate_threshold_trigger
        grounds:
          - calculations.calc_reliability
        excluded_because:
          difficulty_instance: reliability_strike_aging_at_epoch_run
          rationale: "The epoch-window aging boundary (epoch 4 active vs epoch 5 expired) is asserted by the named §1.9 calculations instance."

      - name: subscription_practice_bills_flat_fee_not_per_booking
        claim_type: conditional_feature_flags
        grounds:
          - calculations.calc_fee_split
          - calculations.calc_invoice_aggregate
          - errors[ERR_BILLING_MODE_MISMATCH]
        distinguishing_aspect: "billing_mode is an entity-level feature flag: a SUBSCRIPTION practice's bookings create NO charges, and generate-invoices posts a single SUBSCRIPTION_FEE ledger entry of 30000 with charge_count 0."
        test_recipe:
          setup: ["SUBSCRIPTION practice (set at creation) with bookable provider, type, slot; one ATTRIBUTED-equivalent booking"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York", billing_mode: "SUBSCRIPTION", subscription_fee_cents: 30000 }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/appointment-types"
              payload: { code: "NEW30", display_name: "New patient 30", duration_minutes: 30, booked_copay_cents: 10000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { type_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat One", email: "p1@x.com" }
              as: Anonymous
              captures: { pat_id: $.data.id }
            - call: "POST /marketplace/slots/${s1}/bookings"
              payload: { patient_id: "${pat_id}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { b1: $.data.id }
          trigger:
            - call: "GET /marketplace/charges?booking_id=${b1}"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/billing/generate-invoices"
              payload: { practice_id: "${p_id}", period: "2026-09" }
              as: OpsAdmin
              captures: { inv_id: $.data.id, cc: $.data.charge_count, due: $.data.amount_due_cents }
            - call: "GET /marketplace/ledger-entries?invoice_id=${inv_id}"
              payload: {}
              as: OpsAdmin
          assert:
            - "No Charge exists for booking ${b1} (charge list total_count 0)"
            - "cc == 0 and due == 30000"
            - "The invoice has exactly one ledger entry of type SUBSCRIPTION_FEE with amount_cents == 30000"

