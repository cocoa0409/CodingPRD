            - "GET /filing-records filtered by superseded_filing_id ${filing1} returns total_count == 1 containing ${filing2}"
            - "penalty_points_total == 0.00 (only ${filing2} remains in the SUBMITTED/ACCEPTED input set) and compliance_score == 100.00 under the PROVISIONAL variant"

      - name: cascading_side_effects_layer_is_covered_by_the_four_level_outage_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: outage_create_cascades_four_levels_device_assignments_station_test_event
          rationale: "The §1.8 transitive_cascade instance already drives the layer end-to-end at full depth — POST /equipment-outages -> EASDevice READY->FAILED (hop 1) -> every ACTIVE/SILENT MonitoringAssignment ->SUSPENDED (hop 2) -> Station recompute to SUSPENDED_FILINGS (hop 3) -> every READY TestEvent ->READINESS_PENDING with readiness_score cleared (hop 4) — and asserts each level's fields plus the fact that terminal children are skipped. A corner duplicate would restate the same chain with the same numbers."

      - name: dual_variant_calculation_layer_is_covered_by_the_provisional_to_certified_flip
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: station_score_variant_flips_provisional_to_certified_on_filing_accept
          rationale: "The §1.8 dual_variant_calc instance already exercises both variants of calculations.station_compliance_score on identical data and asserts the exact delta produced by the switch at POST /filing-records/{id}/accept, including the CERTIFIED-only d5 (20.00 per unfiled test) and d6 (penalty_points_total) terms that the PROVISIONAL variant omits."

      - name: selector_policy_layer_is_covered_by_the_empty_pool_fallback_control_pair
        claim_type: selector_policy
        excluded_because:
          difficulty_instance: selector_empty_pool_fallback_versus_matched_control
          rationale: "The §1.8 boundary_precision_check instance pins both halves of calculations.relay_rule_selection's policy — the ranked pick (specificity DESC, priority ASC) against an otherwise identical alert whose candidate pool is empty, asserting the UNMATCHED_OPTIONAL / null / NONE / 0 fallback tuple. §1.9's calculations section additionally covers the specificity-vs-priority ordering and the mandatory-event-code upgrade, so a layer-level restatement adds no new claim."

  # ===========================================================================
  # SECTION 9 — Consistency model (§1.0 consistency_model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: alert_create_resolves_selector_and_suppression_inside_its_own_response
        claim_type: immediate
        grounds:
          - "§1.0 complexity_profile.consistency_model 'immediate'"
          - "§1.5 POST /alert-events side effects 'calculations.relay_rule_selection -> matched_relay_rule_id + relay_class_applied + forward_deadline_seconds + relay_state', 'calculations.duplicate_suppression_window -> suppression_reason + suppression_reference_alert_id'"
          - "§1.3 calculations.relay_rule_selection ranking and calculations.duplicate_suppression_window phase A half-open [received_at - 900s, received_at)"
        distinguishing_aspect: "No follow-up read is needed and none disagrees: the create response already carries the selector verdict and the suppression verdict for both the first alert and its 10-minute repeat, and a subsequent GET returns exactly the same values."
        test_recipe:
          setup:
            - "Clock 2026-08-12T08:00:00Z; plan KS 2026-R1 requiring ['PEP'] with mandatory_relay_event_codes [] activated; one ACTIVE relay rule (TOR, fips ['20173'], MANDATORY, priority 1, forward_delay_seconds 120) so specificity == 2; station KWEA; dev1 READY; ma1 PEP/WXPEP."
            - "alert1 received 2026-08-12T08:00:00Z; alert2 received 2026-08-12T08:10:00Z is inside alert1's phase-A window [2026-08-12T07:55:00Z, 2026-08-12T08:10:00Z) measured from alert2 (alert1 at 08:00:00 qualifies)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T08:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: ["20173"], relay_class: "MANDATORY", priority: 1, forward_delay_seconds: 120 }
              captures: { rule1: "$.data.id" }
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
          trigger:
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-9501", fips_codes: ["20173"], received_at: "2026-08-12T08:00:00Z" }
              captures: { alert1: "$.data.id" }
            - call: "GET /alert-events/${alert1}"
              as: FieldInspector
              as_user_id: insp-1
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T08:10:00Z" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-9502", fips_codes: ["20173"], received_at: "2026-08-12T08:10:00Z" }
              captures: { alert2: "$.data.id" }
            - call: "GET /alert-events/${alert2}"
              as: CertifyingOfficer
              as_user_id: cert-1
            - call: "POST /alert-events/${alert1}/confirm-relay"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
          assert:
            - "the POST response for ${alert1} already contains matched_relay_rule_id == ${rule1}, relay_class_applied == 'MANDATORY', forward_deadline_seconds == 120, relay_state == 'RELAY_PENDING', suppression_reason == 'NONE' and suppression_reference_alert_id == null"
            - "the immediate GET of ${alert1} is field-for-field identical to the POST response — nothing is filled in later"
            - "the POST response for ${alert2} already contains suppression_reason == 'STATION_REPEAT' and suppression_reference_alert_id == ${alert1}, computed from a row created by a previous request in the same run"
            - "${alert2} also carries matched_relay_rule_id == ${rule1} and relay_class_applied == 'MANDATORY': suppression does not suppress the selector output"
            - "the confirm-relay response for ${alert1} shows relay_state == 'RELAYED' with accessibility_state still 'ACCESSIBILITY_UNVERIFIED' in the same response body — no intermediate 'pending write' state is observable and no second read is required"

      - name: filing_create_returns_every_derived_figure_and_the_ledger_is_current_on_the_next_read
        claim_type: immediate
        grounds:
          - "§1.0 complexity_profile.consistency_model 'immediate'"
          - "§1.5 POST /filing-records side effects 'calculations.filing_penalty_points -> late_days, entry_subtotal_points, lateness_points, unconfirmed_relay_points, penalty_points', 'Station.penalty_points_total recomputed', 'Station recompute event'"
          - "§1.3 calculations.filing_penalty_points constants PER_ENTRY_LATE_RATE 0.065, kind_weight RECEIPT 1.0 / TRANSMISSION 1.8, LATE_DAY_POINTS 0.75, FILING_DUE_DAYS 5, FILING_GRACE_DAYS 10; ledger 'Station.penalty_points_total = round(sum over SUBMITTED/ACCEPTED, 2)'"
        distinguishing_aspect: "One request produces the whole derived set at once: the 201 body carries late_days 3, the per-entry subtotal 0.55, lateness 2.25 and penalty_points 2.80, and the very next read of the station already shows penalty_points_total 2.80 with no retry, delay or reconciliation step."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 requiring ['PEP'] activated; station KWEA; dev1 READY; ma1 PEP/WXPEP."
            - "te1 WEEKLY [2026-08-05T00:00:00Z, 2026-08-05T01:00:00Z) -> filing_deadline_at = window_end + 5 d = 2026-08-10T01:00:00Z, grace cutoff 2026-08-20T01:00:00Z."
            - "Readiness evaluated 2026-08-04T00:00:00Z -> 80.00 READY. Two log lines at 2026-08-05T00:30:00Z: one RECEIPT (WXPEP) and one TRANSMISSION. close-logging -> LOGGED."
            - "Filed at 2026-08-13T01:00:00Z -> late_days = 3. entry_subtotal = round(0.065*3*1.0, 2) + round(0.065*3*1.8, 2) = 0.20 + 0.35 = 0.55; lateness = 3 * 0.75 = 2.25; unconfirmed_relay_points = 0.00 (no MANDATORY relays in the 30-day lookback); penalty_points = min(25.00, 2.80) = 2.80, below the 5.00 station ceiling."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-05T01:00:00Z" }
              captures: { te1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-05T00:30:00Z" }
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "RECEIPT", source_call_sign: "WXPEP" }
              captures: { entry_receipt: "$.data.id" }
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "TRANSMISSION" }
              captures: { entry_tx: "$.data.id" }
            - call: "POST /test-events/${te1}/close-logging"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-13T01:00:00Z" }
            - call: "GET /test-events/${te1}"
              as: CertifyingOfficer
              as_user_id: cert-1
              captures: { tev1: "$.data.version" }
          trigger:
            - call: "POST /filing-records"
              as: CertifyingOfficer
              as_user_id: cert-1
              payload: { test_event_id: "${te1}", expected_test_event_version: "${tev1}", attestation_note: "late weekly filing, both lines logged" }
              captures: { filing1: "$.data.id" }
            - call: "GET /stations/${station_id}"
              as: CertifyingOfficer
              as_user_id: cert-1
            - call: "GET /stations/${station_id}/compliance-summary"
              as: FieldInspector
              as_user_id: insp-1
            - call: "GET /test-events/${te1}"
              as: FieldInspector
              as_user_id: insp-1
            - call: "GET /filing-records/${filing1}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "the 201 body of ${filing1} already carries filing_deadline_at-derived late_days == 3, entry_subtotal_points == 0.55, lateness_points == 2.25, unconfirmed_relay_points == 0.00 and penalty_points == 2.80, plus filed_at == '2026-08-13T01:00:00Z' and filed_by_user_id == 'cert-1'"
            - "the next request, GET /stations/${station_id}, already reports penalty_points_total == 2.80 — the ledger is not eventually consistent"
            - "the compliance-summary read agrees: penalty_points_total == 2.80, unfiled_test_count == 0, compliance_variant_applied == 'PROVISIONAL', compliance_score == 100.00, compliance_posture 'COMPLIANT' (d6 is a CERTIFIED-only deduction)"
            - "te1 is already 'FILED' with version ${tev1} + 1 in the same read, and logged_entry_count == 2"
            - "re-reading ${filing1} returns byte-identical figures — nothing was recomputed or corrected after the fact"

