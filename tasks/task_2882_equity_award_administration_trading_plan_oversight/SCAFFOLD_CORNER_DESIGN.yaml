        distinguishing_aspect: |
          limit must be an integer in [1, 100]: limit 0 and limit 101 are both refused with
          ERR_INVALID_PAGINATION (400) while limit 1 succeeds, so the bound is inclusive at 1
          and 100 rather than merely non-negative.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; two ACTIVE participants exist so the list is non-empty."
          setup_api_calls:
