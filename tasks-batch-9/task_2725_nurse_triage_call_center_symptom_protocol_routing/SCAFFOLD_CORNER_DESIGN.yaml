              payload: { state_code: "CA", license_number: "CA-10003", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_senior_late}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
