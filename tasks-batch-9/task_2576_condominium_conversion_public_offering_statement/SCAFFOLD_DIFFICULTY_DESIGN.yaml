          - state_machines.TenantHousehold.PRE_NOTICE_to_NOTICE_SERVED
          - state_machines.TenantHousehold.ACCRUED_to_PAID
          - state_machines.TenantHousehold.OFFERED_to_EXERCISED
          - state_machines.TenantHousehold.PAID_to_REVERSED
