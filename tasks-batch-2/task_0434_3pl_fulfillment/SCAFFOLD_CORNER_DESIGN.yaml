          == 3000, and Client.storage_balance_cents becomes 3000.
        test_recipe:
          setup:
            - "Client storage_rate_per_pallet_cents=1000; one PALLET bin holding two of the client's lots (two SKUs); accrue 3 days"
          setup_api_calls:
