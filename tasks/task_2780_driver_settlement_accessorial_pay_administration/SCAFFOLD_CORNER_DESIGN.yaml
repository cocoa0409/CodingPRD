        grounds:
          - calculations.settlement_period_accrual
          - calculations.settlement_line_generation
          - entities.SettlementLine.fields.sequence
          - entities.SettlementLine.fields.reference_id
        distinguishing_aspect: |
          The accrual order is delivered_at ASC with created_at only as a tie-break, so the load created SECOND
          but delivered FIRST must take sequence 1. LOAD_SEQX is created first and delivered 2026-08-06T18:00Z;
          LOAD_SEQY is created second and delivered 2026-08-04T18:00Z, so sequence 1 references LOAD_SEQY at
          46080 and sequence 2 references LOAD_SEQX at 36320. An implementation that iterated rows in insertion
          order would swap them.
