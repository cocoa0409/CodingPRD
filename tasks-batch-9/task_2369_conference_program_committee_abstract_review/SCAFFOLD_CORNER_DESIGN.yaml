          rationale: "The at-threshold / one-hundredth-below pair and the resulting case-open decision are the named §1.8 instance's whole subject."

      - name: aggregation_precision_on_the_cme_credit_floor
        claim_type: precision
        grounds:
          - calculations.cme_credit_award
        excluded_because:
          difficulty_instance: boundary_precision_check / cme_credit_floor_at_forty_four_versus_forty_five_minutes
          rationale: "The floor step at 44 versus 45 minutes and the 0.25-credit granularity are asserted by the named §1.8 instance."

      - name: interval_merge_adjacency_on_room_windows
        claim_type: interval_merge
        grounds:
          - calculations.session_room_overlap
        excluded_because:
          difficulty_instance: resource_temporal_overlap / room_intervals_are_half_open_so_touching_is_legal
          rationale: "Adjacent (gap 0) and overlapping room windows are both asserted by the named §1.8 instance."

