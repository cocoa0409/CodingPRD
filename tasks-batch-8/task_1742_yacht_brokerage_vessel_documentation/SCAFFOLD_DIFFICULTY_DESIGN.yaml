      - name: business_safety_vs_business_fiscal_on_deposit_entry
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_DEPOSIT_EXCESSIVE]
          - errors[ERR_DEPOSIT_INSUFFICIENT]
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal: a DEPOSIT entry
          cannot violate both rules on the same amount against one required
          floor, so the pair is exercised by two sub-cases on one endpoint —
          (i) an excessive amount (>2x required) returns ERR_DEPOSIT_EXCESSIVE
          even though sufficiency trivially passes, and (ii) an insufficient
          amount (<required) returns ERR_DEPOSIT_INSUFFICIENT while the safety
          cap passes; the conflict surface is that safety (7) is always
          evaluated before fiscal sufficiency (16) on this endpoint.
