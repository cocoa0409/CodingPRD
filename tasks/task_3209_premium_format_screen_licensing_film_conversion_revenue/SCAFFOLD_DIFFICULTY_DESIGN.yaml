    instances:
      - name: window_capacity_conserved_through_suspend_and_restore
        grounds:
          - entities.ReleaseWindow.fields.committed_premium_screen_seconds
          - state_machines.Auditorium.OPERATING_to_DEGRADED
          - state_machines.Auditorium.DEGRADED_to_OPERATING
        distinguishing_aspect: |
          Conserved quantity: ReleaseWindow.committed_premium_screen_seconds.
          A forward action (QA CRITICAL alert → auditorium DEGRADED → slot
          SUSPENDED) decrements the pool by slot.committed_screen_seconds;
          the compensating action (return-to-service → auditorium OPERATING →
          slot CONFIRMED) increments by the exact same amount. Final value
          equals initial value.
