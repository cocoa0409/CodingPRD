scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: visit_billable_entitled_versus_overage_same_visit_shape
        grounds:
          - calculations.visit_billable_amount
          - calculations.visit_base_fee
          - calculations.entitlement_consumption
          - calculations.travel_surcharge
          - entities.Visit.fields.entitlement_applied
          - entities.Visit.fields.billable_amount_cents
        distinguishing_aspect: |
          Two structurally different formulas on the Visit entity domain selected by the
          declared discriminator Visit.entitlement_applied: the ENTITLED branch evaluates to
          the travel surcharge alone (1500 for a Z2 property) while the OVERAGE branch
          evaluates base + expedite + travel surcharge (15000 for the same Z2 property),
          so two visits on the same property differ by exactly 13500 cents.
        test_recipe:
          setup:
            - "One Owner, one Z2 Property (18.0 miles), a STANDARD plan granting 4 entitlement units, an ACTIVE Subscription with an OPEN cycle."
            - "Two ROUTINE_WATCH visits on the same property and the same template; the first carries trigger_source SCHEDULED, the second OWNER_REQUESTED."
            - "Logical clock at 2026-06-02T14:00:00Z at both arrivals, so after_hours_flag is false for both."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Ada Snowbird", email: "ada@example.com", phone: "+15550100", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Naples Beach House", address_line: "12 Gulf Rd", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH", "SEASONAL_CLOSE", "SEASONAL_OPEN"], entitlement_rollover_policy: "EXPIRE", storm_guarantee_included: false }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
              captures: { cycle_id: $.data.current_cycle_id }
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "ROUTINE_WATCH", version_label: "2026.1", item_codes: ["EXT_WALK", "INT_WALK", "PLUMBING_CHECK"], critical_item_codes: ["PLUMBING_CHECK"], default_finding_category: "PLUMBING" }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-02T13:00:00Z", scheduled_end_at: "2026-06-02T15:00:00Z" }
              as: Dispatcher
              captures: { v_sched_id: $.data.id }
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "OWNER_REQUESTED", scheduled_start_at: "2026-06-03T13:00:00Z", scheduled_end_at: "2026-06-03T15:00:00Z" }
              as: Dispatcher
              captures: { v_owner_id: $.data.id }
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/visits/${v_sched_id}/depart"
              payload: {}
              as: FieldTech
            - call: "POST /property-care/visits/${v_sched_id}/arrive"
              payload: {}
              as: FieldTech
          trigger:
            - call: "POST /property-care/visits/${v_sched_id}/complete"
              payload: { completed_item_codes: ["EXT_WALK", "INT_WALK", "PLUMBING_CHECK"], failed_item_codes: [] }
              as: FieldTech
              captures: { sched_billable: $.data.billable_amount_cents, sched_entitled: $.data.entitlement_applied }
            - call: "POST /property-care/visits/${v_owner_id}/depart"
              payload: {}
              as: FieldTech
            - call: "POST /property-care/visits/${v_owner_id}/arrive"
              payload: {}
              as: FieldTech
            - call: "POST /property-care/visits/${v_owner_id}/complete"
              payload: { completed_item_codes: ["EXT_WALK", "INT_WALK", "PLUMBING_CHECK"], failed_item_codes: [] }
              as: FieldTech
              captures: { owner_billable: $.data.billable_amount_cents, owner_entitled: $.data.entitlement_applied }
          assert:
            - "Visit.${v_sched_id}.entitlement_applied == true"
            - "Visit.${v_sched_id}.billable_amount_cents == 1500"
            - "Visit.${v_owner_id}.entitlement_applied == false"
            - "Visit.${v_owner_id}.billable_amount_cents == 15000"
            - "Visit.${v_owner_id}.after_hours_flag == false"
            - "BillingCycle.${cycle_id}.entitlement_consumed_units == 1"
            - "BillingCycle.${cycle_id}.entitlement_remaining_units == 3"

      - name: tier_change_two_leg_proration_round_each_leg_then_sum
        grounds:
          - calculations.proration_amount
          - calculations.tier_change_entitlement_rederivation
          - entities.BillingCycle.fields.prorated_fee_cents
          - entities.BillingCycle.fields.entitlement_granted_units
          - concurrency_rules[tier-change-stale-subscription]
        distinguishing_aspect: |
          A second dual-variant calculation on a different entity domain (Subscription and
          BillingCycle money, not Visit money): the MID_CYCLE_TIER_CHANGE variant rounds each
          of two legs independently and then sums, producing 4663 + 26790 = 31453, whereas the
          MID_CYCLE_PAUSE variant is a single multiplicative term with one rounding operation.
          Summing the two legs before rounding yields 31454, one cent higher.
        test_recipe:
          setup:
            - "A STANDARD subscription (19986/month, 4 units) activated on 2026-06-01T00:00:00Z with an OPEN cycle at cycle_index 1."
            - "A PREMIUM plan at 34944/month granting 8 units exists in the catalogue."
            - "Logical clock advanced to 2026-06-08T00:00:00Z, exactly 7 whole days into the 30-day cycle."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Bo Snowbird", email: "bo@example.com", phone: "+15550101", primary_residence_state: "MI" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Sanibel Cottage", address_line: "4 Shell Ln", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"], entitlement_rollover_policy: "EXPIRE" }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 34944, included_visit_units: 8, covered_visit_types: ["ROUTINE_WATCH", "SEASONAL_CLOSE", "SEASONAL_OPEN"], entitlement_rollover_policy: "CARRY_CAPPED", storm_guarantee_included: true }
              as: PlatformAdmin
              captures: { prem_plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${std_plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
              captures: { cycle_id: $.data.current_cycle_id, sub_v: $.data.version }
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/subscriptions/${sub_id}/tier-changes"
              payload: { service_plan_id: "${prem_plan_id}", expected_subscription_version: "${sub_v}" }
              as: AccountManager
          assert:
            - "BillingCycle.${cycle_id}.prorated_fee_cents == 31453"
            - "BillingCycle.${cycle_id}.entitlement_granted_units == 8"
            - "BillingCycle.${cycle_id}.entitlement_remaining_units == 8"
            - "Subscription.${sub_id}.service_plan_id == ${prem_plan_id}"
            - "Subscription.${sub_id}.version == 2"

      - name: approval_ceiling_routine_owner_versus_storm_emergency
        grounds:
          - calculations.approval_ceiling
          - calculations.work_order_total
          - entities.WorkOrder.fields.pipeline
          - entities.WorkOrder.fields.approval_required
          - entities.Owner.fields.approval_ceiling_override_cents
          - state_machines.WorkOrder.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          A third dual-variant calculation on a third entity domain (WorkOrder authorization,
          not Visit money and not Subscription money): the ROUTINE_CEILING branch reads the
          per-Owner override (here 30000) and demands an Owner approval, while the
          EMERGENCY_CEILING branch structurally ignores the override and uses the flat 250000
          platform ceiling, so the SAME total of 49265 is approval_required true on ROUTINE
          and approval_required false on STORM.
        test_recipe:
          setup:
            - "An Owner with approval_ceiling_override_cents 30000 and a Z2 property with an ACTIVE STANDARD subscription."
            - "A COMPLETED ROUTINE_WATCH visit carrying one TRIAGED Finding."
            - "A StormEvent in the property's state whose landfall ETA is 4 hours after the clock, giving derived tier IMMINENT."
            - "Two work orders on two separate findings with identical estimates: 3.5 labour hours and 12000 parts cents, so both price to total_cents 49265."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Cy Snowbird", email: "cy@example.com", phone: "+15550102", primary_residence_state: "OH", approval_ceiling_override_cents: 30000 }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Marco Villa", address_line: "9 Palm Ct", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "ROUTINE_WATCH", version_label: "2026.1", item_codes: ["EXT_WALK", "INT_WALK"], critical_item_codes: [], default_finding_category: "PLUMBING" }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-02T13:00:00Z", scheduled_end_at: "2026-06-02T15:00:00Z" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/visits/${visit_id}/depart"
              payload: {}
              as: FieldTech
            - call: "POST /property-care/visits/${visit_id}/arrive"
              payload: {}
              as: FieldTech
            - call: "POST /property-care/visits/${visit_id}/complete"
              payload: { completed_item_codes: ["EXT_WALK", "INT_WALK"], failed_item_codes: [] }
              as: FieldTech
            - call: "POST /property-care/visits/${visit_id}/findings"
              payload: { item_code: "EXT_WALK", severity: "HIGH", category: "PLUMBING", description: "Routine leak" }
              as: FieldTech
              captures: { f_routine_id: $.data.id }
            - call: "POST /property-care/findings/${f_routine_id}/triage"
              payload: {}
              as: Dispatcher
              captures: { f_routine_v: $.data.version }
            - call: "POST /property-care/visits/${visit_id}/findings"
              payload: { item_code: "INT_WALK", severity: "HIGH", category: "STRUCTURAL", description: "Storm-exposed soffit" }
              as: FieldTech
              captures: { f_storm_id: $.data.id }
            - call: "POST /property-care/findings/${f_storm_id}/triage"
              payload: {}
              as: Dispatcher
              captures: { f_storm_v: $.data.version }
            - call: "POST /property-care/storm-events"
              payload: { name: "Hurricane Delta", region_state_code: "FL", landfall_eta_at: "2026-06-02T18:00:00Z" }
              as: StormCoordinator
              captures: { storm_id: $.data.id }
          trigger:
            - call: "POST /property-care/findings/${f_routine_id}/work-orders"
              payload: { work_type: "REPAIR", estimated_labour_hours: 3.5, estimated_parts_cents: 12000, expected_finding_version: "${f_routine_v}" }
              as: Dispatcher
              captures: { wo_routine_id: $.data.id, wo_routine_required: $.data.approval_required, wo_routine_total: $.data.total_cents }
            - call: "POST /property-care/findings/${f_storm_id}/work-orders"
              payload: { work_type: "STORM_MITIGATION", estimated_labour_hours: 3.5, estimated_parts_cents: 12000, expected_finding_version: "${f_storm_v}", storm_event_id: "${storm_id}" }
              as: StormCoordinator
              captures: { wo_storm_id: $.data.id, wo_storm_required: $.data.approval_required, wo_storm_total: $.data.total_cents }
          assert:
            - "WorkOrder.${wo_routine_id}.total_cents == 49265"
            - "WorkOrder.${wo_storm_id}.total_cents == 49265"
            - "WorkOrder.${wo_routine_id}.pipeline == ROUTINE"
            - "WorkOrder.${wo_storm_id}.pipeline == STORM"
            - "WorkOrder.${wo_routine_id}.approval_ceiling_cents == 30000"
            - "WorkOrder.${wo_storm_id}.approval_ceiling_cents == 250000"
            - "WorkOrder.${wo_routine_id}.approval_required == true"
            - "WorkOrder.${wo_routine_id}.status == PENDING_APPROVAL"
            - "WorkOrder.${wo_storm_id}.approval_required == false"
            - "WorkOrder.${wo_storm_id}.status == APPROVED"
            - "WorkOrder.${wo_storm_id}.approved_by_user_id == system"

  - rule_id: combinatorial_formula
    instances:
      - name: freeze_risk_score_three_input_nested_min_max_mode_a
        grounds:
          - calculations.freeze_risk_score
          - calculations.property_risk_posture
          - entities.Property.fields.freeze_risk_score
          - entities.Property.fields.risk_posture
          - entities.Property.fields.winterization_completeness_pct
        distinguishing_aspect: |
          Mode (a): three independent inputs (temperature delta, winterization completeness,
          occupancy) combined with a nested min against a per-term cap AND a global cap, plus
          two conditional branches. With setpoint 55, reading 48.0, zero winterization and a
          VACANT property the score is exactly 42.0 + 25.0 + 15.0 = 82.0 and the posture is
          CRITICAL; dropping any single term changes the band.
        test_recipe:
          setup:
            - "One Z2 Property with the default freeze_setpoint_f of 55, occupancy VACANT and no WinterizationRecord, so winterization_completeness_pct is 0.0."
            - "An ACTIVE STANDARD subscription so a visit may be scheduled."
            - "A ROUTINE_WATCH visit completed with interior_temp_f 48.0."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Di Snowbird", email: "di@example.com", phone: "+15550103", primary_residence_state: "WI" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Cold Cabin", address_line: "77 Pine Rd", state_code: "FL", travel_distance_miles: 18.0, freeze_setpoint_f: 55 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "ROUTINE_WATCH", version_label: "2026.1", item_codes: ["EXT_WALK", "INT_WALK"], critical_item_codes: [] }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-02T13:00:00Z", scheduled_end_at: "2026-06-02T15:00:00Z" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/visits/${visit_id}/depart"
              payload: {}
              as: FieldTech
            - call: "POST /property-care/visits/${visit_id}/arrive"
              payload: {}
              as: FieldTech
          trigger:
            - call: "POST /property-care/visits/${visit_id}/complete"
              payload: { completed_item_codes: ["EXT_WALK", "INT_WALK"], failed_item_codes: [], interior_temp_f: 48.0 }
              as: FieldTech
          assert:
            - "Property.${prop_id}.last_interior_temp_f == 48.0"
            - "Property.${prop_id}.winterization_completeness_pct == 0.0"
            - "Property.${prop_id}.freeze_risk_score == 82.0"
            - "Property.${prop_id}.risk_posture == CRITICAL"
            - "a SecurityIncident with property_id ${prop_id}, incident_type FREEZE_ALARM, severity HIGH and status REPORTED exists (48.0 is strictly below 55 - 3 = 52.0)"

      - name: invoice_tax_round_per_line_then_sum_mode_b
        grounds:
          - calculations.invoice_line_tax
          - calculations.invoice_total
          - entities.InvoiceLine.fields.tax_cents
          - entities.Invoice.fields.tax_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding whose ORDER changes the cents. Three ACTIVE taxable lines
          of 19986, 1250 and 1250 give per-line taxes of 1399 + 88 + 88 = 1575, while summing
          first and rounding once gives round_half_up(22486 * 0.07) = 1574. The scaffold pins
          per-line rounding, so Invoice.tax_cents is 1575 and total_cents is 24061.
        test_recipe:
          setup:
            - "An ACTIVE STANDARD subscription whose OPEN cycle has prorated_fee_cents 19986."
            - "A DRAFT Invoice on that cycle seeded with the SUBSCRIPTION_FEE line of 19986."
            - "Two additional ACTIVE taxable TRAVEL_SURCHARGE lines of 1250 each, whose 7 percent tax is exactly 87.5 and therefore rounds up per line."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Eli Snowbird", email: "eli@example.com", phone: "+15550104", primary_residence_state: "IL" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Bonita Bungalow", address_line: "21 Bay St", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
              captures: { cycle_id: $.data.current_cycle_id }
            - call: "POST /property-care/billing-cycles/${cycle_id}/invoices"
              payload: {}
              as: AccountManager
              captures: { inv_id: $.data.id }
            - call: "POST /property-care/invoices/${inv_id}/lines"
              payload: { line_type: "TRAVEL_SURCHARGE", description: "Zone Z2 trip 1", amount_cents: 1250, taxable: true }
              as: AccountManager
              captures: { line_a_id: $.data.id }
          trigger:
            - call: "POST /property-care/invoices/${inv_id}/lines"
              payload: { line_type: "TRAVEL_SURCHARGE", description: "Zone Z2 trip 2", amount_cents: 1250, taxable: true }
              as: AccountManager
              captures: { line_b_id: $.data.id }
          assert:
            - "InvoiceLine.${line_a_id}.tax_cents == 88"
            - "InvoiceLine.${line_b_id}.tax_cents == 88"
            - "Invoice.${inv_id}.gross_service_cents == 22486"
            - "Invoice.${inv_id}.subtotal_cents == 22486"
            - "Invoice.${inv_id}.tax_cents == 1575"
            - "Invoice.${inv_id}.total_cents == 24061"

      - name: work_order_total_markup_tier_read_off_base_mode_c
        grounds:
          - calculations.work_order_total
          - calculations.vendor_markup
          - calculations.labour_cost
          - entities.WorkOrder.fields.markup_cents
          - entities.WorkOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (c): an apparently circular dependency pinned by an explicit evaluation order.
          The markup percentage is selected by a value tier, and the tier is read off `base`
          (labour + parts) and never off total_cents. With base 96000 the tier stays below
          VENDOR_MARKUP_VOLUME_TIER_BASE_CENTS (100000) so the rate is 0.18 and the total is
          113280; reading the tier off the total (which exceeds 100000) would apply 0.15 and
          yield 110400.
        test_recipe:
          setup:
            - "A TRIAGED Finding on a COMPLETED ROUTINE_WATCH visit of a Z2 property with an ACTIVE STANDARD subscription."
            - "No vendor is bound yet, so labour_cost uses LABOUR_RATE_DEFAULT_CENTS_PER_HOUR (8500) and vendor_markup uses the MANAGED branch."
            - "Estimates of 8.0 labour hours and 28000 parts cents give base = 68000 + 28000 = 96000, just below the volume tier."
