            - "T2 standby_minutes == 31 -> standby_charge_cents == 250 ((31 - 30) * 250)"
            - "one minute across the threshold flips the charge from 0 to 250"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: line_creation_requires_valid_training
        grounds:
          - validations[priority=8]
          - entities.TrainingRecord.fields.is_valid
        distinguishing_aspect: |
          Entity pair RentalLine -> TrainingRecord: a RentalLine may only be created
          when a VALID TrainingRecord exists for the (customer, class) pair; the
          dependency crosses from the rental aggregate into the training documentation
          aggregate (the sibling instance crosses RentalContract -> DamageClaim).
        test_recipe:
          setup:
            - "Class BOOMT requires_familiarization=true; unit AVAILABLE; contract for untrained customer in DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Training Gate Co", contact_email: "ops@tg.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "BOOMT", category: "AERIAL_LIFT", max_working_height_ft: 51, min_rental_days: 4, daily_rate_cents: 20000, weekly_rate_cents: 80000, monthly_rate_cents: 240000, replacement_value_cents: 4000000, requires_familiarization: true }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "BOOMT-001", ansi_standard_ref: "ANSI A92.20" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "6 Gate Ln", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
          trigger:
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-05", requested_end_date: "2026-08-15", required_working_height_ft: 40, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /training-records"
              payload: { customer_id: "${cust_id}", class_id: "${class_id}", trainee_name: "Op T", trained_at: "2026-08-01T10:00:00Z" }
              as: YardTechnician
              as_user_id: "yt-1"
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-05", requested_end_date: "2026-08-15", required_working_height_ft: 40, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id, line_status: $.data.status }
          assert:
            - "without a TrainingRecord: error_id == ERR_FAMILIARIZATION_REQUIRED and no line is created"
            - "after a VALID TrainingRecord exists (trained 2026-08-01T10:00:00Z, valid_until 2027-08-01T10:00:00Z, clock 2026-08-01): creation succeeds, status RESERVED"
            - "rejection does not bump the contract version (second attempt reuses expected_contract_version ${cv} successfully)"

      - name: close_blocked_by_disputed_claim
        grounds:
          - validations[priority=13]
          - state_machines.RentalContract.ACTIVE_to_CLOSED
          - state_machines.DamageClaim.CHARGED_to_DISPUTED
        distinguishing_aspect: |
          Entity pair RentalContract -> DamageClaim: contract close is gated by the
          aggregate state of its claims (none in OPEN/ASSESSED/DISPUTED); the gate
          lifts only after the claim resolves. Different pair than RentalLine ->
          TrainingRecord.
        test_recipe:
          setup:
            - "Contract ACTIVE (waiver false); line delivered 2026-08-10T09:00:00Z, off-rent 2026-08-11T09:00:00Z, picked up -> RETURNED"
            - "DAMAGE claim estimate 50000 CHARGED then DISPUTED by the customer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Close Gate Co", contact_email: "ops@closegate.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19G", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19G-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "14 Mill St", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-12", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { dtrip: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${dtrip}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${dtrip}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: BranchManager
            - call: "POST /rental-lines/${line_id}/off-rent"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "PICKUP", driver_id: "drv-1", planned_start_utc: "2026-08-11T13:00:00Z", planned_end_utc: "2026-08-11T15:00:00Z" }
              as: RentalCoordinator
              captures: { ptrip: $.data.id }
            - call: "POST /delivery-trips/${ptrip}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${ptrip}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /damage-claims"
              payload: { line_id: "${line_id}", claim_type: "DAMAGE", description: "scratched cowling" }
              as: RentalCoordinator
              captures: { claim_id: $.data.id }
            - call: "POST /damage-claims/${claim_id}/assess"
              payload: { repair_estimate_cents: 50000 }
              as: BranchManager
            - call: "POST /damage-claims/${claim_id}/charge"
              as: BranchManager
            - call: "POST /damage-claims/${claim_id}/dispute"
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /rental-contracts/${contract_id}/close"
              as: RentalCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /damage-claims/${claim_id}/resolve"
              payload: { decision: "WAIVE" }
              as: BranchManager
            - call: "POST /rental-contracts/${contract_id}/close"
              as: RentalCoordinator
              captures: { c_status: $.data.status }
          assert:
            - "first close: error_id == ERR_OPEN_CLAIMS_EXIST (claim DISPUTED is in the blocking set {OPEN, ASSESSED, DISPUTED})"
            - "after resolve WAIVE: close succeeds and contract status == CLOSED"
            - "closed contract has closed_at set and invoice_total_cents == 44500 (rental 14500 = min(14500*1, 43500, 99000) for exactly 1 elapsed day + logistics 2*15000 = 30000 + damage 0 after waive)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics, different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_window_half_open
        grounds:
          - validations[priority=14]
          - entities.RentalLine.fields.requested_start_date
        distinguishing_aspect: |
          Interval semantics: pure half-open windows [requested_start_date,
          requested_end_date + 1 day) on the EquipmentUnit resource — adjacency
          (new start == existing end) is ALLOWED, any strict interior intersection
          is rejected. The sibling instance uses buffered intervals on DeliveryTrip.
        test_recipe:
          setup:
            - "Class S19W (daily 14500, weekly 43500, monthly 99000, min 1, height 25); unit UW; one customer"
            - "Contract A holds RESERVED line LA on UW with window [2026-08-05, 2026-08-11) (requested 2026-08-05..2026-08-10)"
            - "Contract B (DRAFT) exists for the same customer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Window Co", contact_email: "ops@window.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19W", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19W-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "21 A Ave", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { cA: $.data.id, cvA: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${cA}", unit_id: "${unit_id}", requested_start_date: "2026-08-05", requested_end_date: "2026-08-10", required_working_height_ft: 20, expected_contract_version: "${cvA}" }
              as: RentalCoordinator
              captures: { lA: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "22 B Ave", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { cB: $.data.id, cvB: $.data.version }
          trigger:
            - call: "POST /rental-lines"
              payload: { contract_id: "${cB}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-12", required_working_height_ft: 20, expected_contract_version: "${cvB}" }
              as: RentalCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /rental-lines"
              payload: { contract_id: "${cB}", unit_id: "${unit_id}", requested_start_date: "2026-08-11", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cvB}" }
              as: RentalCoordinator
              captures: { lB: $.data.id, lB_status: $.data.status }
          assert:
            - "overlapping request [2026-08-10, 2026-08-13) vs existing [2026-08-05, 2026-08-11): error_id == ERR_UNIT_WINDOW_CONFLICT"
            - "adjacent request [2026-08-11, 2026-08-16) starting exactly at the existing window's end: succeeds, status RESERVED (half-open semantics — shared boundary day is not an intersection)"
            - "rejected attempt does not bump contract B's version (second attempt reuses ${cvB})"

      - name: driver_route_buffered_window
        grounds:
          - validations[priority=15]
          - entities.DeliveryTrip.fields.driver_id
        distinguishing_aspect: |
          Interval semantics: buffered intervals — each SCHEDULED/EN_ROUTE trip blocks
          [planned_start - 45min, planned_end + 45min) for the same driver, so a trip
          starting 30 minutes after another ends still conflicts while one starting
          exactly at the +45min boundary is allowed. Different interval arithmetic and
          different resource entity (DeliveryTrip/driver) than the unit half-open rule.
        test_recipe:
          setup:
            - "Class S19R; three units; contract ACTIVE with RESERVED lines L1, L2, L3 (windows 2026-08-10..2026-08-15)"
            - "Trip A for driver drv-9 SCHEDULED 2026-08-10T09:00:00Z..11:00:00Z on L1 (buffered window [08:15, 11:45))"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Route Co", contact_email: "ops@route.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19R", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19R-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { u1: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19R-002", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { u2: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19R-003", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { u3: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "40 Route Ct", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${u1}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { l1: $.data.id }
            - call: "GET /rental-contracts/${contract_id}"
              as: RentalCoordinator
              captures: { cv2: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${u2}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv2}" }
              as: RentalCoordinator
              captures: { l2: $.data.id }
            - call: "GET /rental-contracts/${contract_id}"
              as: RentalCoordinator
              captures: { cv3: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${u3}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv3}" }
              as: RentalCoordinator
              captures: { l3: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${l1}", trip_type: "DELIVERY", driver_id: "drv-9", planned_start_utc: "2026-08-10T09:00:00Z", planned_end_utc: "2026-08-10T11:00:00Z" }
              as: RentalCoordinator
              captures: { tA: $.data.id }
          trigger:
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${l2}", trip_type: "DELIVERY", driver_id: "drv-9", planned_start_utc: "2026-08-10T11:30:00Z", planned_end_utc: "2026-08-10T13:00:00Z" }
              as: RentalCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${l3}", trip_type: "DELIVERY", driver_id: "drv-9", planned_start_utc: "2026-08-10T11:45:00Z", planned_end_utc: "2026-08-10T13:00:00Z" }
              as: RentalCoordinator
              captures: { tC: $.data.id, tC_status: $.data.status }
          assert:
            - "trip B starting 30 min after trip A's planned end (11:30 < 11:45 buffer end): error_id == ERR_ROUTE_WINDOW_CONFLICT"
            - "trip C starting exactly at the 45-minute buffer end (11:45): succeeds, status SCHEDULED (buffered interval is half-open at its end)"
            - "route buffering applies per driver_id only"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: charge_then_waive_damage_subtotal_conserved
        grounds:
          - calculations.damage_chargeback
          - state_machines.DamageClaim.ASSESSED_to_CHARGED
          - state_machines.DamageClaim.DISPUTED_to_WAIVED
          - entities.RentalContract.fields.damage_subtotal_cents
        distinguishing_aspect: |
          Conserved quantity: money — the invariant damage_subtotal_cents == sum of
          chargeback_cents over claims with status == CHARGED holds after every step,
          so the forward action (charge, +5000) paired with its compensating action
          (dispute then resolve WAIVE, -5000) leaves the contract's damage subtotal
          exactly unchanged.
        test_recipe:
          setup:
            - "Contract ACTIVE with damage_waiver_elected=true; line OUT_ON_RENT (delivered 2026-08-10T09:00:00Z)"
            - "Class S19Q (daily 14500, weekly 43500, monthly 99000, min 1, height 25)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Invariant Co", contact_email: "ops@invariant.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19Q", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19Q-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "18 Ledger Ln", damage_waiver_elected: true }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { trip_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${trip_id}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${trip_id}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /damage-claims"
              payload: { line_id: "${line_id}", claim_type: "DAMAGE", description: "battery tray cracked" }
              as: RentalCoordinator
              captures: { claim_id: $.data.id }
            - call: "POST /damage-claims/${claim_id}/assess"
              payload: { repair_estimate_cents: 50000 }
              as: BranchManager
          trigger:
            - call: "GET /rental-contracts/${contract_id}"
              as: RentalCoordinator
              captures: { d0: $.data.damage_subtotal_cents }
            - call: "POST /damage-claims/${claim_id}/charge"
              as: BranchManager
              captures: { cb: $.data.chargeback_cents }
            - call: "GET /rental-contracts/${contract_id}"
              as: RentalCoordinator
              captures: { d1: $.data.damage_subtotal_cents }
            - call: "POST /damage-claims/${claim_id}/dispute"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /damage-claims/${claim_id}/resolve"
              payload: { decision: "WAIVE" }
              as: BranchManager
            - call: "GET /rental-contracts/${contract_id}"
              as: RentalCoordinator
              captures: { d2: $.data.damage_subtotal_cents }
          assert:
            - "before charge: damage_subtotal_cents == 0"
            - "after charge: chargeback_cents == 5000 (waiver: 10% of 50000) and damage_subtotal_cents == 5000"
            - "after dispute + resolve WAIVE (compensating action): damage_subtotal_cents == 0 — exactly the pre-charge value, no drift"
            - "invariant holds at each observation: damage_subtotal_cents == sum of chargeback_cents over claims with status == CHARGED"

      - name: fleet_count_conserved_through_dispatch_loss_recovery
        grounds:
          - state_machines.EquipmentUnit.AVAILABLE_to_ON_RENT
          - state_machines.EquipmentUnit.ON_RENT_to_LOST
          - state_machines.EquipmentUnit.LOST_to_AVAILABLE
          - calculations.recovery_credit
        distinguishing_aspect: |
          Conserved quantity: fleet unit count per class — the invariant
          COUNT(units of class in {AVAILABLE, ON_RENT, QUARANTINED, LOST}) == total
          registered units holds through dispatch/return and loss/recovery
          compensating pairs; a different conserved quantity (cardinality, not money)
          than the damage-subtotal instance.
        test_recipe:
          setup:
            - "Class S19Z (daily 14500, weekly 43500, monthly 99000, min 1, height 25, replacement_value 2500000) with exactly 2 units UZ1, UZ2"
            - "Contract ACTIVE (waiver false); line on UZ1 window 2026-08-10..2026-08-20, delivered 2026-08-10T09:00:00Z -> UZ1 ON_RENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Fleet Count Co", contact_email: "ops@fleet.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19Z", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19Z-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { uz1: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19Z-002", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { uz2: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "77 Fleet St", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${uz1}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-20", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { trip_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${trip_id}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${trip_id}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
          trigger:
            - call: "GET /equipment-units?class_id=${class_id}&status=ON_RENT"
              as: BranchManager
              captures: { on_rent_after_dispatch: "$.data[0].status" }
            - call: "POST /damage-claims"
              payload: { line_id: "${line_id}", claim_type: "LOST", description: "unit stolen from jobsite overnight" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /damage-claims/${claim_id}/assess"
              as: BranchManager
              captures: { est: $.data.repair_estimate_cents }
            - call: "POST /damage-claims/${claim_id}/charge"
              as: BranchManager
              captures: { cb: $.data.chargeback_cents }
            - call: "GET /equipment-units/${uz1}"
              as: BranchManager
              captures: { u_lost: $.data.status }
            - call: "POST /equipment-units/${uz1}/recover"
              as: BranchManager
              captures: { u_back: $.data.status }
            - call: "GET /damage-claims/${claim_id}"
              as: BranchManager
              captures: { credit: $.data.recovery_credit_cents }
          assert:
            - "after dispatch: exactly 1 unit of the class is ON_RENT and 1 is AVAILABLE (total across statuses == 2)"
            - "LOST claim assess auto-sets repair_estimate_cents == 2500000 (class replacement value); charge yields chargeback_cents == 2500000 (waiver never applies to LOST)"
            - "after charge: UZ1 status == LOST; class-wide count AVAILABLE(1) + LOST(1) == 2 (loss mutates status, not cardinality)"
            - "after recover: UZ1 status == AVAILABLE; AVAILABLE count back to 2"
            - "recovery_credit_cents == 2000000 (round_half_up(0.80 * 2500000)) and contract damage_subtotal_cents == 500000 after recovery"
