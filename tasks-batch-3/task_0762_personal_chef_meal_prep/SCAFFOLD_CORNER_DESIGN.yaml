# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage)
# Personal-Chef Weekly Meal-Prep Service — Expert
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_client_version_on_dietary_plan_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dietary-plan-create-stale-client]
          - entities.Client.fields.version
        distinguishing_aspect: "A second dietary-plan create carrying the client version observed before the first create (now advanced) is rejected with ERR_STALE_CLIENT_VERSION (412)."
        test_recipe:
          setup:
            - "A client; one dietary plan already created (client.version advanced from the create)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Uma", email: "uma@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv0}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan1: $.data.id }
          trigger:
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["KETO"], allergen_tags: [], daily_calorie_target: 1800, expected_client_version: "${cv0}" }
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 and error_id == ERR_STALE_CLIENT_VERSION"
            - "DietaryPlan.${plan1}.status == ACTIVE (unchanged)"

      - name: invoice_pay_applies_wallet_credit_and_blocks_double_pay
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.BillingInvoice.ISSUED_to_PAID
          - entities.BillingInvoice.fields.credit_applied_cents
          - entities.Client.fields.wallet_credit_cents
        distinguishing_aspect: "Paying an issued 5600 invoice with a 5000 skip-credit sets credit_applied 5000, net 600, wallet 0; a second pay is rejected ERR_INVALID_INVOICE_STATE."
        test_recipe:
          setup:
            - "One PER_WEEK client (base 5000). menu1 approved then skipped -> wallet 5000. menu2 (one meal grocery 4000) cooked -> invoice gross 5600 ISSUED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Vic", email: "vic@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cookv@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu1: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu1}", meal_name: "M1", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "rice", quantity: 1, unit: "batch", unit_cost_cents: 4000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu1}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu1}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /weekly-menus/${menu1}/skip"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-16T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu2: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu2}", meal_name: "M2", meal_slot: "DINNER", servings: 2, ingredients: [{ name: "beans", quantity: 1, unit: "batch", unit_cost_cents: 4000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu2}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu2}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menu2}", chef_id: "${chef}", scheduled_start: "2026-03-04T09:00:00Z", scheduled_end: "2026-03-04T10:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { sess: $.data.id }
            - call: "POST /cook-sessions/${sess}/start"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /cook-sessions/${sess}/complete"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "GET /billing-invoices?weekly_menu_id=${menu2}"
              payload: {}
              as: PlatformAdmin
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /billing-invoices/${inv}/pay"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { applied: $.data.credit_applied_cents, net: $.data.net_amount_cents }
            - call: "POST /billing-invoices/${inv}/pay"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "BillingInvoice.${inv}.gross_amount_cents == 5600"
            - "BillingInvoice.${inv}.credit_applied_cents == 5000"
            - "BillingInvoice.${inv}.net_amount_cents == 600"
            - "Client.${cid}.wallet_credit_cents == 0"
            - "Second pay -> HTTP 409 error_id == ERR_INVALID_INVOICE_STATE"

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: get_weekly_menu_not_found_returns_404
        claim_type: not_found
        grounds: [entities.WeeklyMenu]
        distinguishing_aspect: "GET on a non-existent weekly-menu id returns ERR_WEEKLY_MENU_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /weekly-menus/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_WEEKLY_MENU_NOT_FOUND"

      - name: create_client_missing_required_billing_mode_returns_400
        claim_type: required_fields
        grounds: [entities.Client.fields.billing_mode]
        distinguishing_aspect: "Creating a client without the required billing_mode returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "NoMode", email: "nm@x.com", household_size: 2, weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_VALIDATION"

      - name: menu_meal_is_perishable_default_true
        claim_type: defaults
        grounds: [entities.MenuMeal.fields.is_perishable]
        distinguishing_aspect: "Creating a meal without is_perishable applies the default true."
        test_recipe:
          setup: ["A DRAFT menu for a client and plan."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Wes", email: "wes@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cookw@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
          trigger:
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Plain", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "oats", quantity: 1, unit: "batch", unit_cost_cents: 2000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
              captures: { perish: $.data.is_perishable }
          assert:
            - "MenuMeal.is_perishable == true"

      - name: grocery_cost_recomputed_on_meal_add
        claim_type: computed_fields
        grounds: [calculations.grocery_cost_cents, entities.WeeklyMenu.fields.grocery_cost_cents]
        distinguishing_aspect: "Adding a 4000 meal then a 3000 meal recomputes menu grocery_cost_cents to 7000."
        test_recipe:
          setup: ["A DRAFT menu."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Xan", email: "xan@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cookx@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "A", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "rice", quantity: 1, unit: "batch", unit_cost_cents: 4000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "B", meal_slot: "DINNER", servings: 2, ingredients: [{ name: "beans", quantity: 1, unit: "batch", unit_cost_cents: 3000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
          trigger:
            - call: "GET /weekly-menus/${menu}"
              payload: {}
              as: PlatformAdmin
              captures: { g: $.data.grocery_cost_cents }
          assert:
            - "WeeklyMenu.${menu}.grocery_cost_cents == 7000"

      - name: list_weekly_menus_pagination
        claim_type: listing
        grounds: [entities.WeeklyMenu]
        distinguishing_aspect: "GET /weekly-menus?client_id=..&limit=1 returns total_count 2, has_more true, one item."
        test_recipe:
          setup: ["A client with two DRAFT menus."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Yin", email: "yin@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cooky@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-16T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
          trigger:
            - call: "GET /weekly-menus?client_id=${cid}&limit=1&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "meta/pagination total_count == 2 and has_more == true and data length == 1"

      - name: create_client_response_envelope_shape
        claim_type: creation
        grounds: [entities.Client, response_envelope]
        distinguishing_aspect: "POST /clients returns response_type object, data.id present, status ACTIVE, wallet_credit_cents 0, version 1 (immediate consistency)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Zoe", email: "zoe@x.com", household_size: 3, billing_mode: "PER_MEAL", weekly_base_fee_cents: 4000, per_meal_fee_cents: 700, weekly_grocery_budget_cents: 80000, kitchen_open_hour: 8, kitchen_close_hour: 20 }
              as: PlatformAdmin
              captures: { cid: $.data.id, st: $.data.status, wc: $.data.wallet_credit_cents, ver: $.data.version }
          assert:
            - "HTTP 201, response_type == object, data.id present"
            - "Client.status == ACTIVE, wallet_credit_cents == 0, version == 1"

      - name: container_use_by_non_perishable_five_days
        claim_type: computed_fields
        grounds: [calculations.container_use_by_date, entities.Container.fields.label_use_by_date]
        distinguishing_aspect: "A non-perishable cooked meal produces a container whose label_use_by_date is prep + 5 days (vs 3 for perishable)."
        test_recipe:
          setup: ["An APPROVED menu with a non-perishable meal; clock set to a known instant; session in progress."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ana", email: "ana2@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cookz2@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "Jerky", meal_slot: "LUNCH", servings: 3, is_perishable: false, ingredients: [{ name: "dried beef", quantity: 1, unit: "bag", unit_cost_cents: 4000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
              captures: { meal: $.data.id }
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cook-sessions"
              payload: { weekly_menu_id: "${menu}", chef_id: "${chef}", scheduled_start: "2026-03-03T10:00:00Z", scheduled_end: "2026-03-03T11:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { sess: $.data.id }
            - call: "POST /cook-sessions/${sess}/start"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
          trigger:
            - call: "POST /cook-sessions/${sess}/complete"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
            - call: "GET /containers?menu_meal_id=${meal}"
              payload: {}
              as: PlatformAdmin
              captures: { useby: "$.data[0].label_use_by_date", portions: "$.data[0].portion_count" }
          assert:
            - "Container(menu_meal_id=${meal}).label_prep_date == 2026-03-03T10:00:00Z"
            - "Container(menu_meal_id=${meal}).label_use_by_date == 2026-03-08T10:00:00Z (prep + 5 non-perishable days)"
            - "Container(menu_meal_id=${meal}).portion_count == 3"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: propose_menu_with_no_meals_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WeeklyMenu.DRAFT_to_PROPOSED, "validations[priority=7]"]
        distinguishing_aspect: "Proposing a menu with zero meals returns ERR_MENU_HAS_NO_MEALS (409)."
        test_recipe:
          setup: ["A DRAFT menu with no meals."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Bo", email: "bo@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cookb@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
          trigger:
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_MENU_HAS_NO_MEALS"

      - name: propose_twice_idempotency_rejected
        claim_type: idempotency
        grounds: [state_machines.WeeklyMenu.DRAFT_to_PROPOSED, "validations[priority=7]"]
        distinguishing_aspect: "Proposing an already-PROPOSED menu returns ERR_INVALID_MENU_STATE (409)."
        test_recipe:
          setup: ["A menu with one meal, already proposed."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Cy", email: "cy@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cookc@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { chef: $.data.id }
            - call: "POST /dietary-plans"
              payload: { client_id: "${cid}", restriction_tags: ["OMNIVORE"], allergen_tags: [], daily_calorie_target: 2000, expected_client_version: "${cv}" }
              as: Client
              as_user_id: "${cid}"
              captures: { plan: $.data.id }
            - call: "POST /weekly-menus"
              payload: { client_id: "${cid}", dietary_plan_id: "${plan}", chef_id: "${chef}", week_start_date: "2026-03-09T00:00:00Z" }
              as: Chef
              as_user_id: "${chef}"
              captures: { menu: $.data.id }
            - call: "POST /menu-meals"
              payload: { weekly_menu_id: "${menu}", meal_name: "One", meal_slot: "LUNCH", servings: 2, ingredients: [{ name: "rice", quantity: 1, unit: "batch", unit_cost_cents: 4000, allergen_tags: [] }] }
              as: Chef
              as_user_id: "${chef}"
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
          trigger:
            - call: "POST /weekly-menus/${menu}/propose"
              payload: {}
              as: Chef
              as_user_id: "${chef}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_MENU_STATE"

      - name: skip_after_week_started_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WeeklyMenu.APPROVED_to_SKIPPED, "validations[priority=7]"]
        distinguishing_aspect: "Skipping an approved menu once the logical clock is at/after week_start_date returns ERR_WEEK_ALREADY_STARTED (409)."
        test_recipe:
          setup: ["An APPROVED menu with week_start 2026-03-09; clock advanced to 2026-03-09T00:00:00Z."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Di", email: "di@x.com", household_size: 2, billing_mode: "PER_WEEK", weekly_base_fee_cents: 5000, per_meal_fee_cents: 800, weekly_grocery_budget_cents: 100000, kitchen_open_hour: 0, kitchen_close_hour: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /chefs"
              payload: { full_name: "Cook", email: "cookd@x.com", hourly_rate_cents: 6000 }
              as: PlatformAdmin
