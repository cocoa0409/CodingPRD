# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# task_3299_mobile_wallet_card_provisioning_token_lifecycle_device
# Sections/claim_types per references/claim-extraction-guide.md.
# Anchors: &c0 clock-set; &ch cardholder; &act issuer activate (requires &agrA
# agreement create+activate); &devs secured device; &tokA ACTIVE token.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: cardholder_create_returns_declared_fields_and_active_status
        claim_type: Creation
        grounds:
          - entities.Cardholder
          - endpoints.POST_/cardholders
        distinguishing_aspect: "Cardholder creation with the three required inputs returns 201 with status ACTIVE, version 1, and system-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup: ["Clock default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - &c0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Any
            - &ch
              call: "POST /cardholders"
              payload: { legal_name: "Ada Byers", email: "ada@example.com", phone: "+15550001001" }
              as: Any
              captures: { ch_id: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "Cardholder.${ch_id}.status == ACTIVE and version == 1"
            - "id, created_at, updated_at present and non-null"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: device_list_paginates_and_filters_by_cardholder
        claim_type: Listing
        grounds:
          - endpoints.GET_/cardholders/{id}/devices
          - response_envelope.pagination_fields
        distinguishing_aspect: "The device sub-resource list returns pagination fields with declared defaults (limit 10, offset 0) and exposes total_count/has_more."
        test_recipe:
          setup: ["One cardholder."]
          setup_api_calls:
            - *c0
            - *ch
          trigger:
            - call: "POST /devices"
              payload: { cardholder_id: "${ch_id}", device_serial: "SN-1", device_model: "Phone X", os_version: "26.0" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /devices"
              payload: { cardholder_id: "${ch_id}", device_serial: "SN-2", device_model: "Pad Y", os_version: "26.0" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "GET /cardholders/${ch_id}/devices?limit=1&offset=0"
              payload: {}
              as: Any
          assert:
            - "page 1 returns 1 row with total_count == 2 and has_more == true"
            - "GET /cardholders/${ch_id}/devices?limit=1&offset=1 returns 1 row with has_more == false"
            - "GET /cardholders/${ch_id}/devices with no params returns 2 rows (default limit 10 not exceeded)"

      - name: token_get_unknown_id_returns_token_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/payment-tokens/{tokenId}
          - errors.ERR_TOKEN_NOT_FOUND
          - validations.priority_4
        distinguishing_aspect: "A syntactically valid but unallocated token id yields entity-specific 404 ERR_TOKEN_NOT_FOUND, not a generic 404 and not 400."
        test_recipe:
          setup: ["Clock default. Empty database."]
          setup_api_calls:
            - *c0
          trigger:
            - call: "GET /payment-tokens/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { e: $.data.error_id }
          assert:
            - "response 404 and e == ERR_TOKEN_NOT_FOUND"
            - "response_type == error and data carries error_id and message"

      - name: device_create_missing_serial_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Device.fields.device_serial
          - validations.priority_3
          - errors.ERR_VALIDATION
        distinguishing_aspect: "device_serial is a required input with no default; omitting it is a 400 ERR_VALIDATION from the schema check at priority 3 — not a 404 and not a state error."
        test_recipe:
          setup: ["One cardholder."]
          setup_api_calls:
            - *c0
            - *ch
          trigger:
            - call: "POST /devices"
              payload: { cardholder_id: "${ch_id}", device_model: "Phone X", os_version: "26.0" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e: $.data.error_id }
          assert:
            - "response 400 and e == ERR_VALIDATION"
            - "GET /cardholders/${ch_id}/devices returns 0 rows"

      - name: agreement_create_omitting_fee_floor_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.IssuerAgreement.fields.fee_floor_cents
        distinguishing_aspect: "fee_floor_cents declares default 0; omitting it stores 0 (not null) and a 1-cent auth fee computes as max(min(raw,cap),0) with no floor lift."
        test_recipe:
          setup: ["Issuer created."]
          setup_api_calls:
            - *c0
            - call: "POST /issuers"
              payload: { issuer_name: "Default Bank", country_code: "US" }
              as: PlatformAdmin
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /issuer-agreements"
              payload: { issuer_id: "${i_id}", branding_color: "#101010", branding_logo_ref: "logo://d", terms_version: "v1", fee_bps: 100, fee_cap_cents: 900, express_transit_supported: false, effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
          assert:
            - "IssuerAgreement.${a_id}.fee_floor_cents == 0 (integer zero, not null)"
            - "IssuerAgreement.${a_id}.status == PENDING"

      - name: device_security_posture_is_computed_never_stored
        claim_type: Computed Fields
        grounds:
          - entities.Device.fields.security_posture
          - calculations.security_posture
        distinguishing_aspect: "security_posture derives on every read from is_lost/passcode_enabled: DEGRADED at creation, HEALTHY after set-security, LOST after report_lost, back to HEALTHY after report_found — with no direct posture write anywhere."
        test_recipe:
          setup: ["One cardholder and one freshly created device."]
          setup_api_calls:
            - *c0
            - *ch
            - call: "POST /devices"
              payload: { cardholder_id: "${ch_id}", device_serial: "SN-9", device_model: "Phone X", os_version: "26.0" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { d_id: $.data.id, p0: $.data.security_posture }
          trigger:
            - call: "POST /devices/${d_id}/set-security"
              payload: { passcode_enabled: true, biometric_enabled: false }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { p1: $.data.security_posture }
            - call: "POST /devices/${d_id}/report_lost"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { p2: $.data.security_posture }
            - call: "POST /devices/${d_id}/report_found"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { p3: $.data.security_posture }
          assert:
            - "p0 == DEGRADED, p1 == HEALTHY, p2 == LOST, p3 == HEALTHY"
            - "no endpoint accepts security_posture as input (computed-only field)"

      - name: token_create_client_supplied_status_and_counters_are_ignored
        claim_type: System Fields
        grounds:
          - entities.PaymentToken.fields.status
          - entities.PaymentToken.fields.decline_count
          - endpoints.POST_/devices/{deviceId}/provisioning-sessions/{sessionId}/tokenize
        distinguishing_aspect: "Token status and counters are source: system; even if a client smuggles status/counter values into the tokenize body they are not declared inputs and the created token is ACTIVE with all counters 0."
        test_recipe:
          setup: ["Standard verified session on a HEALTHY device (anchors)."]
          setup_api_calls:
            - *c0
            - *ch
            - &iss
              call: "POST /issuers"
              payload: { issuer_name: "Meridian Bank", country_code: "US" }
              as: PlatformAdmin
              captures: { iss_id: $.data.id }
            - &agrA
              call: "POST /issuer-agreements"
              payload: { issuer_id: "${iss_id}", branding_color: "#112233", branding_logo_ref: "logo://m", terms_version: "v1", fee_bps: 150, fee_cap_cents: 500, fee_floor_cents: 0, express_transit_supported: true, effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { agr_id: $.data.id }
            - &agrA_on
              call: "POST /issuer-agreements/${agr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &act
              call: "POST /issuers/${iss_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &devs
              call: "POST /devices"
              payload: { cardholder_id: "${ch_id}", device_serial: "SN-001", device_model: "Phone X", os_version: "26.0" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { dev_id: $.data.id }
            - &devs_sec
              call: "POST /devices/${dev_id}/set-security"
              payload: { passcode_enabled: true, biometric_enabled: true }
              as: Cardholder
              as_user_id: "${ch_id}"
            - &acct
              call: "POST /card-accounts"
              payload: { cardholder_id: "${ch_id}", issuer_id: "${iss_id}", fpan_last4: "4242", card_product: "TRANSIT" }
              as: IssuerOperator
              captures: { acct_id: $.data.id }
            - &art
              call: "POST /card-artifacts"
              payload: { card_account_id: "${acct_id}", pan_last4: "4242", expiry: "0930", embossing_name: "ADA BYERS" }
              as: IssuerOperator
              captures: { art_id: $.data.id }
            - &sess
              call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${art_id}", idempotency_key: "prov-a" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { sess_id: $.data.id }
            - &verA
              call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - &verB
              call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/verify"
              payload: { method: "ISSUER_APP", code: "222222" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { sess_v: $.data.version }
          trigger:
            - &tokA
              call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/tokenize"
              payload: { expected_session_version: "${sess_v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { tok_id: $.data.id }
          assert:
            - "PaymentToken.${tok_id}.status == ACTIVE"
            - "decline_count == 0, consecutive_decline_count == 0, approved_auth_count == 0, auth_attempt_count == 0, suspension_count == 0"
            - "device_account_number is non-null and != the artifact pan_last4 string"

      - name: card_account_create_with_out_of_enum_product_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.CardAccount.fields.card_product
          - validations.priority_3
          - errors.ERR_VALIDATION
        distinguishing_aspect: "card_product is a closed enum {CREDIT, DEBIT, PREPAID, TRANSIT}; a value like CHARGE is rejected at priority 3 with 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Issuer ACTIVE with ACTIVE agreement; one cardholder."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
          trigger:
            - call: "POST /card-accounts"
              payload: { cardholder_id: "${ch_id}", issuer_id: "${iss_id}", fpan_last4: "4242", card_product: "CHARGE" }
              as: IssuerOperator
              captures: { e: $.data.error_id }
          assert:
            - "response 400 and e == ERR_VALIDATION"
            - "GET /card-accounts?cardholder_id=${ch_id} returns 0 rows"

      - name: body_foreign_keys_checked_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations.priority_4
          - endpoints.POST_/merchant-card-programs
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_CARD_ACCOUNT_NOT_FOUND
        distinguishing_aspect: "Flat topology puts both FKs in the body; existence is checked in input-list order (merchant_program_id before card_account_id): both unknown -> ERR_PROGRAM_NOT_FOUND; only card unknown -> ERR_CARD_ACCOUNT_NOT_FOUND."
        test_recipe:
          setup: ["Issuer ACTIVE; nothing else."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
          trigger:
            - call: "POST /merchant-card-programs"
              payload: { merchant_program_id: "00000000-0000-4000-8000-000000000001", card_account_id: "00000000-0000-4000-8000-000000000002" }
              as: IssuerOperator
              captures: { e1: $.data.error_id }
            - call: "POST /card-accounts"
              payload: { cardholder_id: "${ch_id}", issuer_id: "${iss_id}", fpan_last4: "4242", card_product: "CREDIT" }
              as: IssuerOperator
              captures: { acct_id: $.data.id }
            - call: "POST /merchant-card-programs"
              payload: { merchant_program_id: "00000000-0000-4000-8000-000000000001", card_account_id: "${acct_id}" }
              as: IssuerOperator
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_PROGRAM_NOT_FOUND (first input checked first)"
            - "e2 == ERR_PROGRAM_NOT_FOUND — program still unknown even though the account now exists"
            - "no MerchantCardProgram rows created"

      - name: allowlist_is_immutable_common_fields_false
        claim_type: Immutability
        grounds:
          - entities.TransitAllowlist
        distinguishing_aspect: "TransitAllowlist declares common_fields: false — the row carries id and created_at but no version/updated_at, and there is no update endpoint."
        test_recipe:
          setup: ["Issuer ACTIVE; OPEN card account; one transit operator."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *acct
            - call: "POST /transit-operators"
              payload: { operator_code: "BART", name: "Bay Transit", flat_fare_cents: 250, express_cap_cents: 1000 }
              as: PlatformAdmin
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /transit-allowlist"
              payload: { transit_operator_id: "${op_id}", card_account_id: "${acct_id}" }
              as: IssuerOperator
              captures: { al_id: $.data.id }
          assert:
            - "response 201 with id and created_at present"
            - "response carries no version field and no updated_at field"
            - "TransitAllowlist.${al_id}.status == ACTIVE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: issuer_activate_with_active_agreement_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.Issuer.DRAFT_to_ACTIVE
          - endpoints.POST_/issuers/{issuerId}/activate
        distinguishing_aspect: "The happy-path activation: DRAFT issuer with one ACTIVE agreement moves to ACTIVE and reports version increment."
        test_recipe:
          setup: ["Issuer created with one agreement activated."]
          setup_api_calls:
            - *c0
            - *iss
            - *agrA
            - *agrA_on
          trigger:
            - *act
          assert:
            - "Issuer.${iss_id}.status == ACTIVE"
            - "version incremented from its creation value"

      - name: issuer_activate_without_active_agreement_returns_agreement_required
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Issuer.DRAFT_to_ACTIVE
          - errors.ERR_AGREEMENT_REQUIRED
        distinguishing_aspect: "Issuer activation requires an ACTIVE agreement; a DRAFT issuer whose only agreement is still PENDING fails with ERR_AGREEMENT_REQUIRED (409), not ERR_INVALID_STATE."
        test_recipe:
          setup: ["Issuer created; its agreement left PENDING."]
          setup_api_calls:
            - *c0
            - *iss
            - *agrA
          trigger:
            - call: "POST /issuers/${iss_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "response 409 and e == ERR_AGREEMENT_REQUIRED"
            - "Issuer.${iss_id}.status still DRAFT"

      - name: token_suspend_from_suspended_returns_invalid_state
        claim_type: Invalid Transition
        grounds:
          - state_machines.PaymentToken
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "SUSPENDED is not a valid from-state for suspend: the second suspend fails with ERR_INVALID_STATE and suspension_count does not increment twice."
        test_recipe:
          setup: ["Standard ACTIVE token, then suspended once."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
            - call: "POST /devices/${dev_id}/tokens/${tok_id}/suspend"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
          trigger:
            - call: "POST /devices/${dev_id}/tokens/${tok_id}/suspend"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e: $.data.error_id }
          assert:
            - "response 409 and e == ERR_INVALID_STATE"
            - "PaymentToken.${tok_id}.suspension_count == 1 (unchanged by the rejected call)"

      - name: dispute_resolve_is_idempotent_once_terminal
        claim_type: Idempotency
        grounds:
          - state_machines.Dispute
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Dispute terminal states lock: resolving an already-WON dispute again is rejected ERR_INVALID_STATE and the card account is not toggled twice."
        test_recipe:
          setup: ["Standard token; APPROVED auth 12000; OPEN UNRECOGNIZED dispute resolved WON."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
            - call: "POST /payment-tokens/${tok_id}/authorizations"
              payload: { cryptogram: "cgm-7", amount_cents: 12000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { au_id: $.data.id }
            - call: "POST /authorizations/${au_id}/disputes"
              payload: { amount_cents: 12000, reason: "UNRECOGNIZED" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /disputes/${dp_id}/resolve-dispute"
              payload: { outcome: "WON" }
              as: IssuerOperator
          trigger:
            - call: "POST /disputes/${dp_id}/resolve-dispute"
              payload: { outcome: "LOST" }
              as: IssuerOperator
              captures: { e: $.data.error_id }
          assert:
            - "response 409 and e == ERR_INVALID_STATE"
            - "Dispute.${dp_id}.status still WON (not flipped to LOST)"

      - name: card_account_terminal_close_locks_all_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CardAccount
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CLOSED is terminal: reissue, close, and artifact suspend under a CLOSED account all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN card account with artifact; account closed."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *acct
            - *art
            - call: "POST /card-accounts/${acct_id}/close"
              payload: {}
              as: IssuerOperator
          trigger:
            - call: "POST /card-accounts/${acct_id}/reissue"
              payload: {}
              as: IssuerOperator
              captures: { e1: $.data.error_id }
            - call: "POST /card-accounts/${acct_id}/close"
              payload: {}
              as: IssuerOperator
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_INVALID_STATE (409)"
            - "e2 == ERR_INVALID_STATE (409)"
            - "CardAccount.${acct_id}.status still CLOSED"

      - name: provisioning_session_starts_verification_required_after_auto_step
        claim_type: Initial State
        grounds:
          - state_machines.ProvisioningSession
          - endpoints.POST_/devices/{deviceId}/provisioning-sessions
        distinguishing_aspect: "Creation lands in INITIATED and the system immediately steps to VERIFICATION_REQUIRED: the create response already reports VERIFICATION_REQUIRED with verification_attempt_count 0 and expires_at == created_at + 24h."
        test_recipe:
          setup: ["HEALTHY device, issuer ACTIVE, OPEN account, artifact."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
          trigger:
            - *sess
          assert:
            - "ProvisioningSession.${sess_id}.status == VERIFICATION_REQUIRED at creation response time"
            - "verification_attempt_count == 0"
            - "expires_at == 2026-09-02T00:00:00Z (created_at + 24h)"

      - name: issuer_suspend_cascade_suspends_only_active_tokens
        claim_type: Conditional cascade
        grounds:
          - state_machines.Issuer.ACTIVE_to_SUSPENDED
          - state_machines.PaymentToken
        distinguishing_aspect: "The issuer-suspend cascade is conditional on child state: ACTIVE tokens become SUSPENDED, an already-DEACTIVATED token on the same issuer is untouched."
        test_recipe:
          setup: ["Issuer ACTIVE; device with two tokens on the same issuer: token1 ACTIVE, token2 deactivated by the cardholder."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
            - call: "POST /card-artifacts"
              payload: { card_account_id: "${acct_id}", pan_last4: "5555", expiry: "0931", embossing_name: "ADA BYERS" }
              as: IssuerOperator
              captures: { art2_id: $.data.id }
            - call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${art2_id}", idempotency_key: "prov-b" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { sess2_id: $.data.id }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess2_id}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess2_id}/verify"
              payload: { method: "OTP_EMAIL", code: "333333" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { sess2_v: $.data.version }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess2_id}/tokenize"
              payload: { expected_session_version: "${sess2_v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { tok2_id: $.data.id }
            - call: "POST /devices/${dev_id}/tokens/${tok2_id}/deactivate"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
          trigger:
            - call: "POST /issuers/${iss_id}/suspend"
              payload: {}
              as: PlatformAdmin
          assert:
            - "PaymentToken.${tok_id}.status == SUSPENDED (cascaded)"
            - "PaymentToken.${tok2_id}.status == DEACTIVATED (untouched by the cascade)"
            - "PaymentToken.${tok2_id}.suspension_count == 0"

