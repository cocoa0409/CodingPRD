      - name: err_substitution_cap_exceeded_at_approval
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SUBSTITUTION_CAP_EXCEEDED]
          - calculations.substitution_cap
        distinguishing_aspect: "Cumulative cap at approval time: product planned total 1000 -> cap 200; approving a 200-unit request succeeds (== cap allowed) and approving a further 1-unit request fails ERR_SUBSTITUTION_CAP_EXCEEDED."
        test_recipe:
          setup: ["OPEN year; two products; forecast line planned 1000 week 6; substitution requests R1 qty 200 and R2 qty 1, both REQUESTED"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/products", payload: { name: "Apple", category: "PRODUCE", unit: "CASE", season_start_week: 30, season_end_week: 45 }, as: DistrictProgramAdmin, captures: { prod2: $.data.id } }
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 1000 }, as: DistrictProgramAdmin, captures: { fl: $.data.id } }
            - { call: "POST /f2s/substitution-requests", payload: { forecast_line_id: "${fl}", substitute_product_id: "${prod2}", quantity: 200, reason: "SEASONALITY_GAP" }, as: DistrictProgramAdmin, captures: { r1: $.data.id } }
            - { call: "POST /f2s/substitution-requests", payload: { forecast_line_id: "${fl}", substitute_product_id: "${prod2}", quantity: 1, reason: "SEASONALITY_GAP" }, as: DistrictProgramAdmin, captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /f2s/substitution-requests/${r1}/approve", payload: {}, as: StateGrantAuditor, as_user_id: "aud-1", captures: { s1: $.data.status } }
            - { call: "POST /f2s/substitution-requests/${r2}/approve", payload: {}, as: StateGrantAuditor, as_user_id: "aud-1", captures: { err: $.data.error_id } }
          assert:
            - "R1 (200 == cap 200) APPROVED"
            - "R2 (200 + 1 > 200): error_id == ERR_SUBSTITUTION_CAP_EXCEEDED"

      - name: err_window_capacity_full_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WINDOW_CAPACITY_FULL]
        excluded_because:
          difficulty_instance: "boundary_precision_check / window_capacity_exact_limit_boundary"
