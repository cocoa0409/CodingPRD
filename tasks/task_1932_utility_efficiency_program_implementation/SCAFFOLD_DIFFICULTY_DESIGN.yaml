              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "CRev", license_number: "L-REV", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { cert_id: $.data.id }
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "R", email: "r@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-R" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 500, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
          trigger:
            - call: "POST /efficiency/certifications/${cert_id}/revoke"
              payload: {}
              as: ProgramManager
          assert:
            - "Certification.status == REVOKED"
            - "Contractor.active_certification_count == 0 (link 1)"
            - "Contractor.status == SUSPENDED (link 2, auto-cascade)"
            - "Lead ${lead_id}.status == EXPIRED (link 3, cascade of cascade)"

