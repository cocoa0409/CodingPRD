  - rule_id: combinatorial_formula
    instances:
      - name: premium_component_rounding_order_and_rate_prerounding
        mode: b
        grounds:
          - calculations.certificate_premium_components
          - calculations.certificate_premium_components.precision
          - calculations.vessel_classification_decision.constants.VESSEL_OVERAGE_SURCHARGE_PCT
        distinguishing_aspect: |
          Mode (b): two nested rounding decisions whose ORDER changes the cents,
          both pinned in §1.3. (1) The composed marine rate is rounded to 4 dp
          BEFORE it multiplies the insured value — 3.500 x 1.35 x 1.25 = 5.90625
          becomes 5.9063 and the base premium is 6821.78, where multiplying by
          the unrounded rate would give 6821.72. (2) Each premium component is
          rounded to 2 dp and only then summed — 5457.38 + 693.00 + 294.53 =
          6444.91, where rounding the sum of the unrounded components
          (5457.375 + 693.00 + 294.525 = 6444.90) would give 6444.90. A wrong
          implementation is off by exactly one cent in case (2) and by six cents
          in case (1), so the assertions falsify either order independently.
        test_recipe:
          setup:
            - "the canonical ACTIVE OpenPolicy (premium 3.500, war 0.600, strikes 0.255, markup 0.10) and CommodityClass CC-ELEC (rate_loading_pct 0.35)"
            - "vessel VSL-A year_built 2015 -> APPROVED, overage_surcharge_pct 0.00"
            - "vessel VSL-B year_built 1996 -> age 30 at the default clock -> OVERAGE_SURCHARGED, overage_surcharge_pct 0.25"
            - "two DRAFT certificates with identical CIF inputs (insured_value 1155000.00 each), one per vessel, both across GREEN ports"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_load_id: $.data.id }
            - call: "POST /ports"
              payload: { unlocode: "NLRTM", name: "Rotterdam", country_code: "NL", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_disch_id: $.data.id }
            - call: "POST /commodity-classes"
              payload: { code: "CC-ELEC", description: "Consumer electronics", susceptibility_rating: "S3", required_packaging_code: "EXPORT_CRATE", rate_loading_pct: 0.35, max_conveyance_share_pct: 0.80, survey_required_above_amount: 500000 }
              as: Underwriter
              captures: { cc_id: $.data.id }
            - call: "POST /vessels"
              payload: { name: "MV Kite", imo_number: "9100001", year_built: 2015, classification_society: "LR", flag_code: "SG", vessel_accumulation_limit_amount: 5000000 }
              as: Underwriter
              captures: { vsl_a_id: $.data.id }
            - call: "POST /vessels/${vsl_a_id}/classification-review"
              payload: {}
              as: Underwriter
            - call: "POST /vessels"
              payload: { name: "MV Old Salt", imo_number: "9100002", year_built: 1996, classification_society: "LR", flag_code: "PA", vessel_accumulation_limit_amount: 5000000 }
              as: Underwriter
              captures: { vsl_b_id: $.data.id }
            - call: "POST /vessels/${vsl_b_id}/classification-review"
              payload: {}
              as: Underwriter
            - call: "POST /open-policies"
              payload: { policy_number: "OP-2596-A", assured_name: "Kite Trading Pte", inception_at: "2026-01-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z", freight_basis: "PREPAID", per_certificate_limit_amount: 2000000, conveyance_limit_amount: 3000000, annual_aggregate_limit_amount: 10000000, premium_rate_per_mille: 3.500, war_rate_per_mille: 0.600, strikes_rate_per_mille: 0.255, warehouse_to_warehouse: true, markup_pct: 0.10, deductible_amount: 2500 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /open-policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /certificates"
              payload: { open_policy_id: "${pol_id}", commodity_class_id: "${cc_id}", vessel_id: "${vsl_a_id}", loading_port_id: "${port_load_id}", discharge_port_id: "${port_disch_id}", certificate_number: "CERT-A", valuation_basis: "CIF_PLUS_MARKUP", packaging_code: "EXPORT_CRATE", package_count: 120, gross_weight_kg: 18000, sailing_date: "2026-08-10T00:00:00Z", discharge_date: "2026-09-05T00:00:00Z", invoice_value: 1000000, freight_amount: 45000, duty_amount: 5000, war_cover_requested: true, strikes_cover_requested: true }
              as: Assured
              as_user_id: "${pol_id}"
              captures: { cert_a_id: $.data.id }
            - call: "POST /certificates"
              payload: { open_policy_id: "${pol_id}", commodity_class_id: "${cc_id}", vessel_id: "${vsl_b_id}", loading_port_id: "${port_load_id}", discharge_port_id: "${port_disch_id}", certificate_number: "CERT-C", valuation_basis: "CIF_PLUS_MARKUP", packaging_code: "EXPORT_CRATE", package_count: 120, gross_weight_kg: 18000, sailing_date: "2026-08-10T00:00:00Z", discharge_date: "2026-09-05T00:00:00Z", invoice_value: 1000000, freight_amount: 45000, duty_amount: 5000, war_cover_requested: true, strikes_cover_requested: true }
              as: Assured
              as_user_id: "${pol_id}"
              captures: { cert_c_id: $.data.id }
            - call: "GET /open-policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /certificates/${cert_a_id}/issue"
              payload: { expected_open_policy_version: "${pol_v1}" }
              as: Underwriter
            - call: "GET /open-policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /certificates/${cert_c_id}/issue"
              payload: { expected_open_policy_version: "${pol_v2}" }
              as: Underwriter
          assert:
            - "Vessel.${vsl_b_id}.status == OVERAGE_SURCHARGED and Vessel.${vsl_b_id}.overage_surcharge_pct == 0.25"
            - "Certificate.${cert_a_id}.effective_rate_per_mille == 4.7250"
            - "Certificate.${cert_a_id}.base_premium_amount == 5457.38"
            - "Certificate.${cert_a_id}.war_premium_amount == 693.00"
            - "Certificate.${cert_a_id}.strikes_premium_amount == 294.53"
            - "Certificate.${cert_a_id}.total_premium_amount == 6444.91"
            - "Certificate.${cert_c_id}.effective_rate_per_mille == 5.9063"
            - "Certificate.${cert_c_id}.base_premium_amount == 6821.78"
            - "Certificate.${cert_c_id}.total_premium_amount == 7809.31"

      - name: ga_adjuster_fee_self_reference_evaluation_order
        mode: c
        grounds:
          - calculations.ga_contribution_allocation
          - calculations.ga_contribution_allocation.constants.GA_ADJUSTER_FEE_PCT
          - entities.GeneralAverageEvent.fields.adjuster_fee_amount
          - entities.GeneralAverageEvent.fields.total_allowance_amount
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency. total_allowance_amount
          includes adjuster_fee_amount, and adjuster_fee_amount is a percentage
          of the allowance — the scaffold pins the evaluation order so the fee
          is charged on the PRE-FEE base only: 0.05 x (120000.00 + 30000.00) =
          7500.00 and the allowance is 157500.00. The self-charging reading
          fee = 0.05 x (150000.00 + fee) yields 7894.74 and an allowance of
          157894.74, which would in turn shift contribution_rate from 0.080563
          to 0.080765 and both security calls. This is a different axis from
          premium_component_rounding_order_and_rate_prerounding, which is a
          rounding-order (mode b) claim with no self-reference.
        test_recipe:
          setup:
            - "the canonical ACTIVE OpenPolicy, CommodityClass CC-ELEC, APPROVED vessel VSL-A and two GREEN ports"
            - "two ISSUED certificates on VSL-A with the same sailing_date 2026-08-10T00:00:00Z: CERT-A insured 1155000.00 (CIF) and CERT-D insured 800000.00 (DECLARED_VALUE)"
            - "one DECLARED GeneralAverageEvent on VSL-A for that sailing_date with sacrifice 120000.00 and salvage 30000.00"
          setup_api_calls:
            - call: "POST /ports"
