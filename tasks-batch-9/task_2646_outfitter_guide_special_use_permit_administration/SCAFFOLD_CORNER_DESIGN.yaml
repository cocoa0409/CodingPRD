            - call: "POST /osup/use-areas"
              payload: { area_code: "WIL-02", name: "Willow Divide", total_allocated_service_days: 2000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8 }
              as: ProgramAdministrator
              captures: { ua2: "$.data.id" }
            - call: "POST /osup/use-areas/${ua2}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 2000, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na2: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na2}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua1}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Bear River floats." }
              as: PermitSpecialist
              captures: { app_1: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_1}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_1}/screen"
              payload: {}
