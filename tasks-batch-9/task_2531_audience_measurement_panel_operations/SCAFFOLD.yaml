scenario: |
  Generate task harder than expert level!

  2531. Audience Measurement Panel Operations (media audience measurement service): panel recruitment with demographic quota targets, geographic distribution and cooperation incentives, meter installation, household enumeration and compliance monitoring with fault detection, sample weighting and projection to population universes with periodic universe estimate updates, data editing rules for missing intervals, invalid tuning and outlier households, measurement of streaming and out-of-home viewing with different collection methodologies, client subscription tiers, data delivery schedules and custom analysis requests, accreditation audits of methodology with disclosure of limitations, methodology change management with client notification and impact analysis

domain_name: audience-measurement-panel-operations
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Fourteen peer entities linked by explicit foreign keys; no nesting in URL
  # paths beyond read-only sub-resource collections. Ownership is expressed by
  # FK fields in request bodies, never by URL hierarchy.

  state_machine_shape: cyclic
  # MethodologyChange cycles IMPACT_ASSESSED/NOTIFIED -> DRAFT on revision;
  # ClientDeliverable cycles DELIVERED -> REVISION_REQUESTED -> IN_PROGRESS;
  # Household cycles ACTIVE <-> FAULT_HOLD and ACTIVE <-> NONCOMPLIANT_HOLD;
  # Meter carries two independent state dimensions (install_status x
  # health_status) on the same row; ProcessingRun cycles OPEN -> PENDING_REPIN
  # -> OPEN. AccreditationAudit finalization branches into three divergent
  # side-effect sets (ACCREDITED / QUALIFIED / DENIED).

  relationship_patterns:
    - one_to_many          # Market -> QuotaCell, Household; ProcessingRun -> HouseholdWeight
    - many_to_many         # Client <-> Market via Client.contract_market_ids; Client <-> MethodologyChange via ClientNotification
    - self_referential     # MethodologyChange.supersedes_change_id -> MethodologyChange.id
    - polymorphic          # ClientDeliverable.kind discriminates SCHEDULED_DATASET vs CUSTOM_ANALYSIS lifecycles
    - cross_aggregate      # ProcessingRun pins UniverseEstimate + EditRuleSet across aggregate boundaries

  role_model: segregation_of_duties
  # ProcessingRun.publish forbids the statistician who opened the run;
  # AccreditationAudit.finalize forbids the auditor who opened the audit;
  # MethodologyChange.activate forbids the user who created the change.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Market
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable market name"
        constraints: "1..120 chars"
      - name: market_code
        type: string
        source: input
        description: "Designated market area code, unique across all markets"
        constraints: "matches ^DMA-[0-9]{3}$; globally unique"
      - name: dma_rank
        type: integer
        source: input
        description: "Market rank by population; smaller is larger market"
        constraints: ">= 1"
      - name: incentive_budget_cents
        type: integer
        source: input
        description: "Total cooperation-incentive budget authorised for this market"
        constraints: ">= 0"
      - name: incentive_budget_committed_cents
        type: integer
        source: computed
        description: "Sum of Household.incentive_accrued_cents over every Household whose market_id equals this Market.id (all statuses included). Conserved quantity of invariant INV_INCENTIVE_CENTS"
        default: 0
      - name: incentive_budget_reserved_cents
        type: integer
        source: computed
        description: "Sum over QuotaCell rows of this market of round_half_up(base_incentive_cents * INCENTIVE_BOOST_PCT * target_households, 0) for cells whose incentive_boost_active is true. Conserved quantity of invariant INV_BOOST_RESERVE_CENTS"
        default: 0
      - name: quota_cell_count
        type: integer
        source: computed
        description: "Count of QuotaCell rows whose market_id equals this Market.id"
        default: 0
      - name: filled_cell_count
        type: integer
        source: computed
        description: "Count of QuotaCell rows of this market whose quota_status == FILLED"
        default: 0
      - name: under_target_cell_count
        type: integer
        source: computed
        description: "Count of QuotaCell rows of this market whose quota_status == UNDER_TARGET"
        default: 0
      - name: open_audit_count
        type: integer
        source: computed
        description: "Count of AccreditationAudit rows of this market whose state == OPEN"
        default: 0
      - name: recruitment_posture
        type: enum
        source: computed
        description: "Derived recruitment gate evaluated by calculation market_recruitment_posture once at POST /markets and thereafter on every change to open_audit_count or to any child QuotaCell.quota_status. A market created with no quota cells has under_target_cell_count == 0, so clause 3 fires and the initial value is RESTRICTED"
        default: RESTRICTED
        constraints: "one of {OPEN, RESTRICTED, CLOSED, FROZEN}"
      - name: accreditation_status
        type: enum
        source: computed
        description: "Latest finalized AccreditationAudit outcome for this market"
        default: UNAUDITED
        constraints: "one of {UNAUDITED, ACCREDITED, QUALIFIED, DENIED}"
      - name: publication_blocked
        type: boolean
        source: computed
        description: "True once an AccreditationAudit of this market finalizes with outcome DENIED; blocks ProcessingRun publication until a later audit finalizes ACCREDITED or QUALIFIED"
        default: false
      - name: limitation_disclosures
        type: array
        source: computed
        description: "Append-only array of disclosure strings copied from AccreditationAudit.limitation_disclosures on finalize with outcome QUALIFIED or DENIED, appended in the order supplied in the finalize payload"
        default: "[]"
      - name: posture_changed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the most recent recruitment_posture evaluation that produced a new value; stamped at POST /markets by the initial evaluation and thereafter only when the value actually changes"
        default: "null"

  - name: QuotaCell
    parent: Market
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: "FK -> Market.id; owning market"
      - name: age_band
        type: enum
        source: input
        description: "Demographic age band of this quota cell"
        constraints: "one of {P18_34, P35_54, P55_PLUS}"
      - name: income_band
        type: enum
        source: input
        description: "Demographic income band of this quota cell"
        constraints: "one of {LOW, MID, HIGH}"
      - name: geo_zone
        type: enum
        source: input
        description: "Geographic distribution stratum inside the market"
        constraints: "one of {URBAN, SUBURBAN, RURAL}"
      - name: target_households
        type: integer
        source: input
        description: "Recruitment quota target for this demographic/geographic cell"
        constraints: ">= 1"
      - name: base_incentive_cents
        type: integer
        source: input
        description: "Base per-period cooperation incentive for households in this cell"
        constraints: ">= 0"
      - name: intab_count
        type: integer
        source: computed
        description: "Count of Household rows whose quota_cell_id equals this QuotaCell.id AND status == ACTIVE. Conserved quantity of invariant INV_INTAB_COUNT"
        default: 0
      - name: fill_rate
        type: number
        source: computed
        description: "round_half_up(intab_count / target_households, 4)"
        default: 0
      - name: quota_status
        type: enum
        source: computed
        description: "FILLED when fill_rate >= 1.0; ON_TARGET when fill_rate >= 0.8 and < 1.0; UNDER_TARGET otherwise"
        default: UNDER_TARGET
        constraints: "one of {UNDER_TARGET, ON_TARGET, FILLED}"
      - name: incentive_boost_active
        type: boolean
        source: computed
        description: "Set true when quota_status transitions to UNDER_TARGET; set false when quota_status transitions to ON_TARGET or FILLED"
        default: false
      - name: effective_incentive_multiplier
        type: number
        source: computed
        description: "1.25 when incentive_boost_active is true, otherwise 1.00"
        default: 1.00

  - name: UniverseEstimate
    parent: Market
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: "FK -> Market.id; market this universe vintage describes"
      - name: vintage_label
        type: string
        source: input
        description: "Universe estimate vintage label, unique per market"
        constraints: "matches ^[0-9]{4}Q[1-4]$; unique per (market_id, vintage_label)"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the vintage effectivity window (ISO 8601 UTC)"
      - name: effective_to
        type: datetime
        source: input
        description: "Inclusive end of the vintage effectivity window (ISO 8601 UTC); closed-interval semantics — see validation priority 24"
        constraints: "effective_to > effective_from"
      - name: cell_populations
        type: array
        source: input
        description: "Array of objects { quota_cell_id, population_households, population_persons }; quota_cell_id must be a QuotaCell.id whose market_id equals this market_id; population_households >= 1; entries are unique by quota_cell_id"
      - name: total_population_households
        type: integer
        source: computed
        description: "Sum of population_households over every cell_populations entry"
      - name: total_population_persons
        type: integer
        source: computed
        description: "Sum of population_persons over every cell_populations entry"
      - name: status
        type: enum
        source: computed
        description: "DRAFT on creation; PUBLISHED after POST publish; SUPERSEDED when a later vintage of the same market is published"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED}"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at which status became PUBLISHED; null while DRAFT"
        default: "null"
      - name: superseded_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at which status became SUPERSEDED; null otherwise"
        default: "null"

  - name: Household
    parent: Market
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: "FK -> Market.id; market the household is recruited into"
      - name: quota_cell_id
        type: string
        source: input
        description: "FK -> QuotaCell.id; demographic/geographic cell the household fills; must belong to market_id"
      - name: recruitment_source
        type: enum
        source: input
        description: "Channel that recruited the household"
        constraints: "one of {ADDRESS_SAMPLE, RDD_PHONE, ONLINE_PANEL_TRANSFER}"
      - name: persons_count
        type: integer
        source: input
        description: "Number of persons the recruiter recorded in the household"
        constraints: ">= 1"
      - name: recruited_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at creation; tenure and enumeration-due arithmetic read this field, never created_at"
      - name: status
        type: enum
        source: computed
        description: "Panel lifecycle state; see state_machines.Household"
        default: RECRUITED
        constraints: "one of {RECRUITED, INSTALL_SCHEDULED, ENUM_PENDING, ACTIVE, FAULT_HOLD, NONCOMPLIANT_HOLD, RETIRED}"
      - name: roster_persons_count
        type: integer
        source: computed
        description: "persons_count reported on the most recent enumeration submission; null before the first submission"
        default: "null"
      - name: tv_sets_count
        type: integer
        source: computed
        description: "TV set count reported on the most recent enumeration submission; null before the first submission"
        default: "null"
      - name: enumeration_count
        type: integer
        source: computed
        description: "Number of enumeration submissions accepted for this household"
        default: 0
      - name: enumeration_verdict
        type: enum
        source: computed
        description: "Verdict of the most recent enumeration submission per calculation enumeration_verdict"
        default: PENDING
        constraints: "one of {PENDING, COMPLIANT, NONCOMPLIANT}"
      - name: last_enumeration_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the most recent enumeration submission; null before the first"
        default: "null"
      - name: compliance_rate_rolling_30
        type: number
        source: computed
        description: "Variant ROLLING_30 of calculation household_compliance_rate; refreshed on every POST /tuning-intervals for this household and on every POST /processing-runs/{processing_run_id}/detect-faults that covers it"
        default: 0
      - name: incentive_accrued_cents
        type: integer
        source: computed
        description: "Running sum of accepted incentive accruals minus reversals for this household"
        default: 0
      - name: accrual_periods
        type: array
        source: computed
        description: "Array of objects { period_label, accrued_cents, reversed } in creation order; a reversal flips reversed to true and subtracts accrued_cents from incentive_accrued_cents"
        default: "[]"
      - name: retired_reason
        type: string
        source: computed
        description: "Reason string supplied to POST retire; null until retired"
        default: "null"

  - name: Meter
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; household the device is deployed to"
      - name: meter_type
        type: enum
        source: input
        description: "Collection methodology family of the device"
        constraints: "one of {TV_TUNER, STREAMING_ROUTER, PORTABLE_OOH}"
      - name: serial_no
        type: string
        source: input
        description: "Device serial number, globally unique across meters"
        constraints: "matches ^MT-[0-9]{6}$; globally unique"
      - name: install_status
        type: enum
        source: computed
        description: "Installation dimension; independent of health_status — see state_machines.Meter.install_status"
        default: SHIPPED
        constraints: "one of {SHIPPED, INSTALLED, REMOVED}"
      - name: health_status
        type: enum
        source: computed
        description: "Fault-detection dimension; independent of install_status — see state_machines.Meter.health_status"
        default: HEALTHY
        constraints: "one of {HEALTHY, SUSPECT, FAULTED}"
      - name: installed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at which install_status became INSTALLED; null while SHIPPED"
        default: "null"
      - name: fault_count
        type: integer
        source: computed
        description: "Number of times health_status has entered FAULTED over the device lifetime"
        default: 0
      - name: last_fault_code
        type: enum
        source: computed
        description: "Fault code of the most recent fault report or detection; null when never faulted"
        default: "null"
        constraints: "one of {NO_SIGNAL, POWER_LOSS, TAMPER, CLOCK_DRIFT, MISSING_INTERVALS}"
      - name: missing_minutes_last_scan
        type: integer
        source: computed
        description: "missing_minutes computed for this meter by the most recent POST /processing-runs/{processing_run_id}/detect-faults; null before the first scan"
        default: "null"

  - name: TuningInterval
    parent: Meter
    common_fields: true
    fields:
      - name: meter_id
        type: string
        source: input
        description: "FK -> Meter.id; device that collected the interval"
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; must equal the meter's household_id"
      - name: processing_run_id
        type: string
        source: computed
        description: "FK -> ProcessingRun.id; set when a run's edit pass claims the interval; null while unclaimed"
        default: "null"
      - name: source_methodology
        type: enum
        source: input
        description: "Collection methodology of this record; must match meter_type per validation priority 21"
        constraints: "one of {INHOME_TUNER, STREAMING_SDK, PORTABLE_OOH}"
      - name: start_iso
        type: datetime
        source: input
        description: "Inclusive start of the occupation interval on the meter (half-open [start_iso, end_iso) semantics — see validation priority 22)"
      - name: end_iso
        type: datetime
        source: input
        description: "Exclusive end of the occupation interval on the meter"
        constraints: "end_iso > start_iso; end_iso <= current logical clock"
      - name: station_code
        type: string
        source: input
        description: "Station or stream asset identifier tuned during the interval"
        constraints: "1..24 chars"
      - name: tuning_minutes
        type: integer
        source: input
        description: "Reported tuning minutes inside the interval"
        constraints: ">= 0; <= floor((end_iso - start_iso) / 60s)"
      - name: usable_minutes
        type: integer
        source: computed
        description: "round_half_up(tuning_minutes * METHODOLOGY_CREDIT_FACTOR[source_methodology], 0); recomputed by the owning run's edit pass and set to 0 when state becomes INVALIDATED"
        default: 0
      - name: state
        type: enum
        source: computed
        description: "RAW on ingest; EDITED / INVALIDATED / ASCRIBED assigned by the edit pass"
        default: RAW
        constraints: "one of {RAW, EDITED, INVALIDATED, ASCRIBED}"
      - name: invalidation_reason
        type: enum
        source: computed
        description: "Reason the edit pass invalidated the record; null unless state == INVALIDATED"
        default: "null"
        constraints: "one of {OVER_MAX_TUNING, OUTLIER_HOUSEHOLD, METER_FAULTED}"
      - name: ascribed
        type: boolean
        source: computed
        description: "True only for synthetic records the edit pass creates to fill a missing interval (state ASCRIBED)"
        default: false

  - name: EditRuleSet
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Rule-set label, globally unique"
        constraints: "1..60 chars; globally unique"
      - name: missing_interval_ascription_minutes
        type: integer
        source: input
        description: "Maximum gap length, in minutes, between two consecutive same-meter intervals that the edit pass fills with an ASCRIBED record"
        constraints: ">= 0; <= 240"
      - name: invalid_tuning_max_minutes
        type: integer
        source: input
        description: "A RAW record whose tuning_minutes exceeds this bound is INVALIDATED with reason OVER_MAX_TUNING"
        constraints: ">= 1"
      - name: outlier_household_minutes_cap
        type: integer
        source: input
        description: "A household whose summed usable_minutes inside the run window exceeds this bound is an outlier household; its records are INVALIDATED with reason OUTLIER_HOUSEHOLD"
        constraints: ">= 1"
      - name: outlier_weight_ratio_cap
        type: number
        source: input
        description: "Multiple of the run's mean base weight above which a household weight is capped and the excess redistributed"
        constraints: ">= 1.0000; 4 decimal places"
      - name: fault_missing_minutes_threshold
        type: integer
        source: input
        description: "missing_minutes at or above this bound sets a meter FAULTED; at or above half this bound (rounded half up) but below it sets SUSPECT"
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "DRAFT on creation; PUBLISHED after POST publish; SUPERSEDED when a MethodologyChange that targets it activates"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED}"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at which status became PUBLISHED; null while DRAFT"
        default: "null"

  - name: ProcessingRun
    parent: Market
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: "FK -> Market.id; market being processed"
      - name: universe_estimate_id
        type: string
        source: input
        description: "FK -> UniverseEstimate.id; version-pinned universe vintage this run projects to"
      - name: edit_rule_set_id
        type: string
        source: input
        description: "FK -> EditRuleSet.id; version-pinned editing rules this run applies"
      - name: window_start_iso
        type: datetime
        source: input
        description: "Inclusive start of the measurement window"
      - name: window_end_iso
        type: datetime
        source: input
        description: "Exclusive end of the measurement window"
        constraints: "window_end_iso > window_start_iso; window_end_iso <= current logical clock"
      - name: window_minutes
        type: integer
        source: computed
        description: "floor((window_end_iso - window_start_iso) / 60s)"
      - name: state
        type: enum
        source: computed
        description: "See state_machines.ProcessingRun"
        default: OPEN
        constraints: "one of {OPEN, EDITED, WEIGHTED, PUBLISHED, PENDING_REPIN, SUPERSEDED}"
      - name: weight_variant
        type: enum
        source: computed
        description: "Variant selected on POST weight; null until then"
        default: "null"
        constraints: "one of {DESIGN, FINAL}"
      - name: intab_snapshot_count
        type: integer
        source: computed
        description: "Count of Household rows of this market with status == ACTIVE at the instant the run row was created; frozen thereafter except on repin"
        default: 0
      - name: contributing_household_count
        type: integer
        source: computed
        description: "Count of Household rows of this market with status == ACTIVE that hold at least one TuningInterval of this run in state EDITED or ASCRIBED with usable_minutes > 0; set by the edit pass"
        default: 0
      - name: ascribed_interval_count
        type: integer
        source: computed
        description: "Count of TuningInterval rows the edit pass created with state ASCRIBED for this run"
        default: 0
      - name: invalidated_interval_count
        type: integer
        source: computed
        description: "Count of TuningInterval rows the edit pass moved to state INVALIDATED for this run"
        default: 0
      - name: outlier_household_count
        type: integer
        source: computed
        description: "Count of distinct households the edit pass classified as outliers for this run"
        default: 0
      - name: excluded_cell_count
        type: integer
        source: computed
        description: "Count of QuotaCell rows of this market that the weighting pass excluded because the variant's denominator was zero"
        default: 0
      - name: total_weight_mass
        type: number
        source: computed
        description: "Sum of HouseholdWeight.adjusted_weight over every row of this run, 4 decimal places"
        default: 0
      - name: projected_average_audience
        type: integer
        source: computed
        description: "Output of calculation projected_average_audience; null until state == WEIGHTED"
        default: "null"
      - name: limitation_disclosures
        type: array
        source: computed
        description: "Append-only array of disclosure codes appended by the edit and weighting passes in this fixed order per pass: CELL_NO_CONTRIBUTORS, OUTLIER_HOUSEHOLDS_EXCLUDED, ASCRIBED_INTERVALS_PRESENT, WEIGHT_CAP_APPLIED"
        default: "[]"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MethodologyStatistician that created the run; segregation-of-duties comparand for publish"
      - name: published_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MethodologyStatistician that published the run; null until PUBLISHED"
        default: "null"
      - name: repin_required_reason
        type: enum
        source: computed
        description: "Why the run needs repinning; null unless state == PENDING_REPIN"
        default: "null"
        constraints: "one of {RULE_SET_SUPERSEDED, UNIVERSE_SUPERSEDED}"
      - name: superseded_by_run_id
        type: string
        source: computed
        description: "Identifier of the ProcessingRun whose creation superseded this run; null unless state == SUPERSEDED"
        default: "null"

  - name: HouseholdWeight
    parent: ProcessingRun
    common_fields: true
    fields:
      - name: processing_run_id
        type: string
        source: input
        description: "FK -> ProcessingRun.id; run that produced this weight row"
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; household the weight applies to"
      - name: weight_variant
        type: enum
        source: computed
        description: "Copy of the owning run's weight_variant at the moment the row was written"
        constraints: "one of {DESIGN, FINAL}"
      - name: base_weight
        type: number
        source: computed
        description: "Output of calculation household_base_weight, 4 decimal places"
      - name: adjusted_weight
        type: number
        source: computed
        description: "Output of calculation weight_cap_redistribution, 4 decimal places"
      - name: usable_minutes
        type: integer
        source: computed
        description: "Sum of TuningInterval.usable_minutes for this household and run over records in state EDITED or ASCRIBED"
        default: 0
      - name: contribution
        type: number
        source: computed
        description: "round_half_up(adjusted_weight * usable_minutes / ProcessingRun.window_minutes, 2); the per-household rounding step of calculation projected_average_audience"
        default: 0
      - name: run_compliance_rate
        type: number
        source: computed
        description: "Variant RUN_SCOPED of calculation household_compliance_rate for this household and run window, 4 decimal places"
        default: 0
      - name: capped
        type: boolean
        source: computed
        description: "True when base_weight exceeded the run's weight cap and was clamped"
        default: false

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Subscribing client organisation name"
        constraints: "1..120 chars"
      - name: tier
        type: enum
        source: input
        description: "Subscription tier; drives fee, SLA and custom-analysis quota via TIER_TABLE"
        constraints: "one of {BASIC, STANDARD, PREMIUM}"
      - name: contract_market_ids
        type: array
        source: input
        description: "Array of Market.id values the subscription covers (many-to-many Client<->Market coverage; every element must resolve to an existing Market, and coverage is what POST /processing-runs/{id}/publish fans out over)"
        constraints: "1..10 unique elements"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on creation; SUSPENDED after POST suspend"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: tier_base_fee_cents
        type: integer
        source: computed
        description: "TIER_TABLE[tier].base_fee_cents, refreshed on every tier change"
      - name: delivery_sla_hours
        type: integer
        source: computed
        description: "TIER_TABLE[tier].sla_hours, refreshed on every tier change; only NEW ClientDeliverable rows read the refreshed value"
      - name: custom_analysis_quota
        type: integer
        source: computed
        description: "TIER_TABLE[tier].custom_analysis_quota, refreshed on every tier change"
      - name: custom_analysis_used
        type: integer
        source: computed
        description: "Count of ClientDeliverable rows of this client with kind == CUSTOM_ANALYSIS; never decremented, never reset by a tier change"
        default: 0
      - name: held_deliverable_count
        type: integer
        source: computed
        description: "Count of ClientDeliverable rows of this client with state == HELD"
        default: 0
      - name: delivery_sla_credit_cents
        type: integer
        source: computed
        description: "Running sum of round_half_up(tier_base_fee_cents * HELD_CREDIT_PCT, 0) credited once per deliverable that enters HELD through the methodology-change cascade"
        default: 0
      - name: suspended_reason
        type: string
        source: computed
        description: "Reason supplied to POST suspend; null while ACTIVE"
        default: "null"

  - name: ClientDeliverable
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; owning subscriber; for kind == CUSTOM_ANALYSIS the acting ClientUser's X-User-ID must equal this value"
      - name: processing_run_id
        type: string
        source: input
        description: "FK -> ProcessingRun.id; published run the deliverable draws on"
      - name: kind
        type: enum
        source: computed
        description: "SCHEDULED_DATASET for rows created by the run-publish fan-out; CUSTOM_ANALYSIS for rows created through POST /client-deliverables"
        constraints: "one of {SCHEDULED_DATASET, CUSTOM_ANALYSIS}"
      - name: question
        type: string
        source: input
        description: "Custom analysis question; null for kind == SCHEDULED_DATASET"
        default: "null"
        constraints: "1..400 chars when kind == CUSTOM_ANALYSIS"
      - name: requested_cell_count
        type: integer
        source: input
        description: "Number of demographic cells the delivery covers, for both kinds; it is the per-cell surcharge driver in deliverable_billing"
        default: 0
        constraints: ">= 0 and <= 24; must be >= 1 when kind == CUSTOM_ANALYSIS"
      - name: state
        type: enum
        source: computed
        description: "See state_machines.ClientDeliverable"
        constraints: "one of {SCHEDULED, REQUESTED, IN_PROGRESS, DELIVERED, REVISION_REQUESTED, HELD}"
      - name: held_from_state
        type: enum
        source: computed
        description: "State the row occupied immediately before entering HELD; POST release restores exactly this value"
        default: "null"
        constraints: "one of {SCHEDULED, REQUESTED, IN_PROGRESS}"
      - name: hold_reason
        type: enum
        source: computed
        description: "Why the row is held; null unless state == HELD"
        default: "null"
        constraints: "one of {UPSTREAM_RUN_REPIN, CLIENT_REQUESTED, DATA_QUALITY_REVIEW}"
      - name: due_at
        type: datetime
        source: computed
        description: "created_at plus Client.delivery_sla_hours hours, evaluated once at row creation from the client's then-current tier and never refreshed by a later tier change"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of accepted POST request-revision calls on this row"
        default: 0
      - name: gross_cents
        type: integer
        source: computed
        description: "Step 2 output of calculation deliverable_billing; null until first delivery"
        default: "null"
      - name: late_penalty_cents
        type: integer
        source: computed
        description: "Step 5 output of calculation deliverable_billing; null until first delivery"
        default: "null"
      - name: discount_cents
        type: integer
        source: computed
        description: "Step 6 output of calculation deliverable_billing; null until first delivery"
        default: "null"
      - name: total_cents
        type: integer
        source: computed
        description: "Step 7 output of calculation deliverable_billing; null until first delivery"
        default: "null"
      - name: days_late
        type: integer
        source: computed
        description: "Step 4 output of calculation deliverable_billing; null until first delivery"
        default: "null"
      - name: findings_summary
        type: string
        source: computed
        description: "Analyst narrative supplied to POST deliver; null for rows delivered through POST dispatch"
        default: "null"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the most recent transition into DELIVERED; null before the first"
        default: "null"

  - name: ClientNotification
    parent: MethodologyChange
    common_fields: true
    fields:
      - name: methodology_change_id
        type: string
        source: input
        description: "FK -> MethodologyChange.id; change being disclosed"
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; notified subscriber; the acknowledging ClientUser's X-User-ID must equal this value"
      - name: impact_tier
        type: enum
        source: computed
        description: "Copy of MethodologyChange.impact_tier at the instant the notification was created"
        constraints: "one of {MINOR, MODERATE, MATERIAL}"
      - name: disclosed_delta_pct
        type: number
        source: computed
        description: "Copy of MethodologyChange.impact_delta_pct at the instant the notification was created, 4 decimal places"
      - name: state
        type: enum
        source: computed
        description: "SENT on creation; ACKNOWLEDGED after POST acknowledge; CANCELLED when the change returns to DRAFT"
        default: SENT
        constraints: "one of {SENT, ACKNOWLEDGED, CANCELLED}"
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at creation"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of acknowledgement; null while SENT or CANCELLED"
        default: "null"

  - name: MethodologyChange
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Short description of the methodology change"
        constraints: "1..160 chars"
      - name: target_edit_rule_set_id
        type: string
        source: input
        description: "FK -> EditRuleSet.id; currently PUBLISHED rule set the change retires"
      - name: proposed_edit_rule_set_id
        type: string
        source: input
        description: "FK -> EditRuleSet.id; DRAFT rule set the change promotes; must differ from target_edit_rule_set_id"
      - name: supersedes_change_id
        type: string
        source: input
        description: "FK -> MethodologyChange.id; optional self-reference to the earlier change this one replaces; must be in state DRAFT, IMPACT_ASSESSED or NOTIFIED"
        default: "null"
      - name: affected_market_ids
        type: array
        source: input
        description: "Array of Market.id values in scope; every element must resolve to an existing Market and the notify fan-out intersects these with Client.contract_market_ids"
        constraints: "1..10 unique elements"
      - name: state
        type: enum
        source: computed
        description: "See state_machines.MethodologyChange"
        default: DRAFT
        constraints: "one of {DRAFT, IMPACT_ASSESSED, NOTIFIED, EFFECTIVE}"
      - name: baseline_processing_run_id
        type: string
        source: computed
        description: "Identifier of the PUBLISHED ProcessingRun supplied to the most recent impact analysis; null while never assessed"
        default: "null"
      - name: baseline_projected_average_audience
        type: integer
        source: computed
        description: "Copy of the baseline run's projected_average_audience at impact-analysis time, retained for disclosure"
        default: "null"
      - name: impact_delta_pct
        type: number
        source: computed
        description: "Output of calculation methodology_impact_delta, 4 decimal places; null while state == DRAFT"
        default: "null"
      - name: impact_tier
        type: enum
        source: computed
        description: "MATERIAL when impact_delta_pct >= 0.1500; MODERATE when >= 0.0500; MINOR otherwise"
        default: "null"
        constraints: "one of {MINOR, MODERATE, MATERIAL}"
      - name: notification_lead_hours
        type: integer
        source: computed
        description: "NOTIFICATION_LEAD_HOURS[impact_tier]; null while state == DRAFT"
        default: "null"
      - name: notification_deadline_at
        type: datetime
        source: computed
        description: "Logical clock at notify time plus notification_lead_hours hours; null until state == NOTIFIED"
        default: "null"
      - name: notified_client_count
        type: integer
        source: computed
        description: "Count of ClientNotification rows of this change in state SENT or ACKNOWLEDGED"
        default: 0
      - name: acknowledged_client_count
        type: integer
        source: computed
        description: "Count of ClientNotification rows of this change in state ACKNOWLEDGED"
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: "Number of accepted POST request-revision calls that returned this change to DRAFT"
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MethodologyStatistician that created the change; segregation-of-duties comparand for activate"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at which state became EFFECTIVE; null otherwise"
        default: "null"

  - name: AccreditationAudit
    parent: Market
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: "FK -> Market.id; market under audit"
      - name: scope_edit_rule_set_id
        type: string
        source: input
        description: "FK -> EditRuleSet.id; PUBLISHED rule set whose methodology is in scope"
      - name: auditor_note
        type: string
        source: input
        description: "Free-text scope note recorded at audit opening"
        constraints: "1..400 chars"
      - name: state
        type: enum
        source: computed
        description: "OPEN on creation; FINALIZED after POST finalize"
        default: OPEN
        constraints: "one of {OPEN, FINALIZED}"
      - name: outcome
        type: enum
        source: computed
        description: "Finalization verdict; null while OPEN"
        default: "null"
        constraints: "one of {ACCREDITED, QUALIFIED, DENIED}"
      - name: limitation_disclosures
        type: array
        source: computed
        description: "Array of disclosure strings supplied to POST finalize, stored in payload order; must be non-empty when outcome is QUALIFIED or DENIED"
        default: "[]"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AccreditationAuditor that opened the audit; segregation-of-duties comparand for finalize"
      - name: finalized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AccreditationAuditor that finalized the audit; null while OPEN"
        default: "null"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at which state became FINALIZED; null while OPEN"
        default: "null"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Household
    state_field: status
    initial_state: RECRUITED
    terminal_states: [RETIRED]
    transitions:
      - from: RECRUITED
        to: INSTALL_SCHEDULED
        trigger: "POST /meters (first Meter row created for this household)"
        actor: FieldTechnician
        preconditions:
          - "household.status == RECRUITED"
          - "Market.recruitment_posture != FROZEN"
        side_effects:
          - "Meter row created with install_status SHIPPED and health_status HEALTHY"
          - "household.status = INSTALL_SCHEDULED"
        note: "Adding a second or third meter to a household already past RECRUITED leaves status unchanged."
      - from: INSTALL_SCHEDULED
        to: ENUM_PENDING
        trigger: "POST /meters/{meter_id}/install-confirmations on a TV_TUNER meter"
        actor: FieldTechnician
        preconditions:
          - "meter.meter_type == TV_TUNER"
          - "meter.install_status == SHIPPED"
          - "household.status == INSTALL_SCHEDULED (an INSTALL_SCHEDULED household always has enumeration_verdict PENDING — it has never been enumerable)"
        side_effects:
          - "meter.install_status = INSTALLED; meter.installed_at = current logical clock"
          - "household.status = ENUM_PENDING"
          - "No QuotaCell.intab_count change"
      - from: ENUM_PENDING
        to: ACTIVE
        trigger: "POST /households/{household_id}/enumerations with a COMPLIANT verdict"
        actor: FieldTechnician
        preconditions:
          - "calculation enumeration_verdict yields COMPLIANT"
          - "household has >= 1 Meter with meter_type == TV_TUNER, install_status == INSTALLED and health_status == HEALTHY"
          - "Market.recruitment_posture != FROZEN"
        side_effects:
          - "household.enumeration_count += 1; roster_persons_count, tv_sets_count, enumeration_verdict, last_enumeration_at refreshed"
          - "household.status = ACTIVE"
          - "QuotaCell.intab_count += 1; fill_rate and quota_status recomputed"
          - "Market recruitment_posture recomputed"
      - from: ACTIVE
        to: NONCOMPLIANT_HOLD
        trigger: "POST /households/{household_id}/enumerations with a NONCOMPLIANT verdict"
        actor: FieldTechnician
        preconditions:
          - "calculation enumeration_verdict yields NONCOMPLIANT"
        side_effects:
          - "household.enumeration_count += 1; enumeration_verdict = NONCOMPLIANT"
          - "household.status = NONCOMPLIANT_HOLD"
          - "QuotaCell.intab_count -= 1; fill_rate and quota_status recomputed"
          - "Market recruitment_posture recomputed"
      - from: NONCOMPLIANT_HOLD
        to: ACTIVE
        trigger: "POST /households/{household_id}/enumerations with a COMPLIANT verdict"
        actor: FieldTechnician
        preconditions:
          - "calculation enumeration_verdict yields COMPLIANT"
          - "household has >= 1 Meter with meter_type == TV_TUNER, install_status == INSTALLED and health_status == HEALTHY"
        side_effects:
          - "household.enumeration_verdict = COMPLIANT; household.status = ACTIVE"
          - "QuotaCell.intab_count += 1; fill_rate and quota_status recomputed"
          - "Market recruitment_posture recomputed"
        note: "Cycle ACTIVE -> NONCOMPLIANT_HOLD -> ACTIVE; intab_count returns to its pre-hold value (invariant INV_INTAB_COUNT)."
      - from: ACTIVE
        to: FAULT_HOLD
        trigger: "cascade link 2 of POST /meters/{meter_id}/fault-reports or of POST /processing-runs/{processing_run_id}/detect-faults"
        actor: system
        preconditions:
          - "the meter whose health_status just became FAULTED has meter_type == TV_TUNER"
          - "after that change the household holds zero Meter rows with meter_type == TV_TUNER, install_status == INSTALLED and health_status == HEALTHY"
        side_effects:
          - "household.status = FAULT_HOLD"
          - "cascade link 3: QuotaCell.intab_count -= 1; fill_rate and quota_status recomputed"
          - "cascade link 4 (only when quota_status changed to UNDER_TARGET): QuotaCell.incentive_boost_active = true; effective_incentive_multiplier = 1.25; Market.incentive_budget_reserved_cents += round_half_up(base_incentive_cents * 0.25 * target_households, 0)"
          - "cascade link 5: Market.filled_cell_count / under_target_cell_count and recruitment_posture recomputed; Market.posture_changed_at stamped when the posture value changed"
      - from: FAULT_HOLD
        to: ACTIVE
        trigger: "cascade link 2 of POST /meters/{meter_id}/repairs"
        actor: system
        preconditions:
          - "the repaired meter has meter_type == TV_TUNER and install_status == INSTALLED"
          - "household.status == FAULT_HOLD"
          - "household.enumeration_verdict == COMPLIANT"
        side_effects:
          - "household.status = ACTIVE"
          - "QuotaCell.intab_count += 1; fill_rate and quota_status recomputed"
          - "when quota_status left UNDER_TARGET: QuotaCell.incentive_boost_active = false; effective_incentive_multiplier = 1.00; Market.incentive_budget_reserved_cents -= round_half_up(base_incentive_cents * 0.25 * target_households, 0)"
          - "Market recruitment_posture recomputed"
        note: "Compensating counterpart of ACTIVE -> FAULT_HOLD; restores invariants INV_INTAB_COUNT and INV_BOOST_RESERVE_CENTS exactly."
      - from: RECRUITED
        to: RETIRED
        trigger: "POST /households/{household_id}/retire"
        actor: PanelOperationsManager
        preconditions: ["household.status != RETIRED"]
        side_effects:
          - "household.status = RETIRED; retired_reason stored"
          - "every Meter of the household with install_status == INSTALLED moves to install_status REMOVED (conditional cascade: meters already REMOVED are untouched)"
        note: "Identical transition exists from INSTALL_SCHEDULED, ENUM_PENDING, ACTIVE, FAULT_HOLD and NONCOMPLIANT_HOLD."
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /households/{household_id}/retire"
        actor: PanelOperationsManager
        preconditions: ["household.status == ACTIVE"]
        side_effects:
          - "household.status = RETIRED; retired_reason stored"
          - "every INSTALLED Meter of the household moves to install_status REMOVED"
          - "QuotaCell.intab_count -= 1; fill_rate and quota_status recomputed"
          - "Market recruitment_posture recomputed"
          - "household.incentive_accrued_cents is NOT zeroed, so Market.incentive_budget_committed_cents is unchanged by retirement"

  - entity: Meter
    state_field: install_status
    initial_state: SHIPPED
    terminal_states: [REMOVED]
    transitions:
      - from: SHIPPED
        to: INSTALLED
        trigger: "POST /meters/{meter_id}/install-confirmations"
        actor: FieldTechnician
        preconditions:
          - "meter.install_status == SHIPPED"
          - "household.status != RETIRED"
        side_effects:
          - "meter.installed_at = current logical clock"
          - "household status transition per state_machines.Household when meter_type == TV_TUNER"
      - from: INSTALLED
        to: REMOVED
        trigger: "cascade of POST /households/{household_id}/retire"
        actor: system
        preconditions: ["meter.install_status == INSTALLED"]
        side_effects: ["meter.install_status = REMOVED"]
      - from: INSTALLED
        to: REMOVED
        trigger: "POST /meters/{meter_id}/removals"
        actor: FieldTechnician
        preconditions:
          - "meter.install_status == INSTALLED"
          - "household.status IN {INSTALL_SCHEDULED, ENUM_PENDING, NONCOMPLIANT_HOLD, FAULT_HOLD} - an ACTIVE (in-tab) household and a RETIRED household are both refused"
        side_effects:
          - "meter.install_status = REMOVED; health_status left exactly as it was"
          - "no household status change and no QuotaCell.intab_count change - the admitted household statuses are all already out of tab"
    note: "install_status and health_status are two independent dimensions of the same Meter row; a FAULTED meter is still INSTALLED, and a REMOVED meter keeps whatever health_status it last held."

  - entity: Meter
    state_field: health_status
    initial_state: HEALTHY
    terminal_states: []
    transitions:
      - from: HEALTHY
        to: FAULTED
        trigger: "POST /meters/{meter_id}/fault-reports"
        actor: FieldTechnician
        preconditions:
          - "meter.install_status == INSTALLED"
          - "meter.health_status IN {HEALTHY, SUSPECT}"
        side_effects:
          - "cascade link 1: meter.health_status = FAULTED; fault_count += 1; last_fault_code = payload fault_code"
          - "cascade links 2-5 per state_machines.Household ACTIVE -> FAULT_HOLD"
      - from: SUSPECT
        to: FAULTED
        trigger: "POST /processing-runs/{processing_run_id}/detect-faults when missing_minutes >= edit_rule_set.fault_missing_minutes_threshold"
        actor: MethodologyStatistician
        preconditions: ["meter.install_status == INSTALLED"]
        side_effects:
          - "meter.health_status = FAULTED; fault_count += 1; last_fault_code = MISSING_INTERVALS; missing_minutes_last_scan stored"
          - "cascade links 2-5 per state_machines.Household ACTIVE -> FAULT_HOLD"
      - from: HEALTHY
        to: SUSPECT
        trigger: "POST /processing-runs/{processing_run_id}/detect-faults when missing_minutes >= round_half_up(threshold / 2, 0) and < threshold"
        actor: MethodologyStatistician
        preconditions: ["meter.install_status == INSTALLED"]
        side_effects:
          - "meter.health_status = SUSPECT; missing_minutes_last_scan stored"
          - "no household or quota-cell change (SUSPECT does not remove a household from in-tab)"
      - from: FAULTED
        to: HEALTHY
        trigger: "POST /meters/{meter_id}/repairs"
        actor: FieldTechnician
        preconditions:
          - "meter.health_status IN {FAULTED, SUSPECT}"
          - "meter.install_status == INSTALLED"
        side_effects:
          - "meter.health_status = HEALTHY; last_fault_code cleared to null"
          - "cascade per state_machines.Household FAULT_HOLD -> ACTIVE"
      - from: SUSPECT
        to: HEALTHY
        trigger: "POST /meters/{meter_id}/repairs"
        actor: FieldTechnician
        preconditions: ["meter.health_status == SUSPECT", "meter.install_status == INSTALLED"]
        side_effects: ["meter.health_status = HEALTHY; last_fault_code cleared to null"]
    note: "Cyclic dimension HEALTHY -> SUSPECT -> FAULTED -> HEALTHY with no terminal state."

  - entity: ProcessingRun
    state_field: state
    initial_state: OPEN
    terminal_states: [PUBLISHED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /processing-runs/{processing_run_id}/detect-faults"
        actor: MethodologyStatistician
        preconditions:
          - "run.state == OPEN"
        side_effects:
          - "for every INSTALLED Meter of a Household of run.market_id, calculation meter_missing_minutes runs and may drive the Meter health_status dimension to SUSPECT or FAULTED"
          - "each FAULTED outcome triggers cascade links 2-5 per state_machines.Household ACTIVE -> FAULT_HOLD"
          - "Household.compliance_rate_rolling_30 refreshed for every household scanned"
        note: "Self-transition: run.state is unchanged; only meters, households, quota cells and the market move."
      - from: OPEN
        to: EDITED
        trigger: "POST /processing-runs/{processing_run_id}/edit"
        actor: MethodologyStatistician
        preconditions:
          - "run.state == OPEN"
          - "edit_rule_set.status == PUBLISHED"
        side_effects:
          - "every RAW TuningInterval whose [start_iso, end_iso) lies inside [window_start_iso, window_end_iso) and whose household_id belongs to run.market_id gets processing_run_id = run.id and is graded by calculation interval_editing"
          - "run.invalidated_interval_count, ascribed_interval_count, outlier_household_count, contributing_household_count set"
          - "HouseholdWeight rows are NOT created yet"
          - "run.limitation_disclosures appended in this order: OUTLIER_HOUSEHOLDS_EXCLUDED when outlier_household_count > 0, then ASCRIBED_INTERVALS_PRESENT when ascribed_interval_count > 0"
      - from: EDITED
        to: WEIGHTED
        trigger: "POST /processing-runs/{processing_run_id}/weight"
        actor: MethodologyStatistician
        preconditions:
          - "run.state == EDITED"
          - "universe_estimate.status == PUBLISHED"
          - "universe_estimate.effective_from <= run.window_start_iso AND universe_estimate.effective_to >= run.window_end_iso"
          - "at least one QuotaCell of run.market_id yields a non-zero denominator for the requested weight_variant"
        side_effects:
          - "run.weight_variant = payload weight_variant"
          - "one HouseholdWeight row per household in the variant's inclusion set, created in Household.created_at ASC order, with base_weight from calculation household_base_weight"
          - "calculation weight_cap_redistribution sets adjusted_weight and capped on every row; run.total_weight_mass set"
          - "calculation projected_average_audience sets HouseholdWeight.contribution on every row and run.projected_average_audience"
          - "HouseholdWeight.run_compliance_rate set from calculation household_compliance_rate variant RUN_SCOPED"
          - "run.excluded_cell_count incremented per zero-denominator cell; run.limitation_disclosures appended CELL_NO_CONTRIBUTORS then WEIGHT_CAP_APPLIED in that order when applicable"
      - from: WEIGHTED
        to: WEIGHTED
        trigger: "POST /processing-runs/{processing_run_id}/weight with a different weight_variant"
        actor: MethodologyStatistician
        preconditions:
          - "run.state == WEIGHTED"
          - "the payload weight_variant differs from run.weight_variant"
        side_effects:
          - "every HouseholdWeight row of the run is deleted first, then the whole weighting pass re-runs under the new variant"
          - "run.weight_variant, total_weight_mass, projected_average_audience, intab_snapshot_count and excluded_cell_count are overwritten, not accumulated"
          - "run.limitation_disclosures entries WEIGHT_CAP_APPLIED and CELL_NO_CONTRIBUTORS are recomputed from scratch for the new variant"
        note: "Self-transition: this is how the same edited data is projected under both weighting bases without opening a second run. Re-calling with the SAME variant is rejected (ERR_RUN_NOT_EDITED), so the pass is never silently repeated."
      - from: WEIGHTED
        to: PUBLISHED
        trigger: "POST /processing-runs/{processing_run_id}/publish"
        actor: MethodologyStatistician
        preconditions:
          - "run.state == WEIGHTED"
          - "X-User-ID != run.opened_by_user_id (segregation of duties)"
          - "Market.recruitment_posture != FROZEN"
          - "Market.publication_blocked == false"
          - "universe_estimate.status == PUBLISHED (still, i.e. not SUPERSEDED since pinning)"
        side_effects:
          - "run.state = PUBLISHED; published_by_user_id stamped from X-User-ID"
          - "run.limitation_disclosures has Market.limitation_disclosures appended, so a QUALIFIED accreditation outcome recorded before publication travels with the data"
          - "every ClientDeliverable already pinned to this run in state SCHEDULED becomes due: due_at = current logical clock + Client.delivery_sla_hours hours, walked in Client.created_at ASC order"
      - from: OPEN
        to: PENDING_REPIN
        trigger: "cascade link 2 of POST /methodology-changes/{methodology_change_id}/activate"
        actor: system
        preconditions:
          - "run.edit_rule_set_id == the change's target_edit_rule_set_id, whose status just became SUPERSEDED"
          - "run.state IN {OPEN, EDITED}"
        side_effects:
          - "run.state = PENDING_REPIN; repin_required_reason = RULE_SET_SUPERSEDED"
          - "cascade link 3: every ClientDeliverable of this run in state SCHEDULED, REQUESTED or IN_PROGRESS moves to HELD with hold_reason UPSTREAM_RUN_REPIN and held_from_state recorded"
          - "cascade link 4: for each such deliverable, Client.held_deliverable_count += 1 and Client.delivery_sla_credit_cents += round_half_up(Client.tier_base_fee_cents * 0.05, 0)"
      - from: EDITED
        to: PENDING_REPIN
        trigger: "cascade link 2 of POST /methodology-changes/{methodology_change_id}/activate"
        actor: system
        preconditions: ["run.state == EDITED", "run.edit_rule_set_id == the superseded target rule set"]
        side_effects:
          - "run.state = PENDING_REPIN; repin_required_reason = RULE_SET_SUPERSEDED"
          - "every HouseholdWeight row of the run is deleted and run.total_weight_mass / projected_average_audience reset to 0 / null"
          - "cascade links 3-4 as above"
      - from: PENDING_REPIN
        to: OPEN
        trigger: "POST /processing-runs/{processing_run_id}/repin"
        actor: MethodologyStatistician
        preconditions:
          - "run.state == PENDING_REPIN"
          - "the new edit_rule_set.status == PUBLISHED"
          - "the new universe_estimate.status == PUBLISHED and its window covers the run window"
        side_effects:
          - "run.edit_rule_set_id and universe_estimate_id replaced; repin_required_reason = null; run.state = OPEN"
          - "every TuningInterval whose processing_run_id == run.id returns to state RAW with processing_run_id = null, invalidation_reason = null; ASCRIBED rows created by the previous edit pass are deleted"
          - "run.invalidated_interval_count, ascribed_interval_count, outlier_household_count, contributing_household_count, excluded_cell_count reset to 0; limitation_disclosures reset to []"
          - "HouseholdWeight rows of the run deleted; total_weight_mass = 0; projected_average_audience = null; weight_variant = null"
      - from: OPEN
        to: SUPERSEDED
        trigger: "cascade of POST /processing-runs — a re-run created for the same market with a byte-identical window"
        actor: system
        preconditions:
          - "run.state IN {OPEN, EDITED, WEIGHTED, PENDING_REPIN}"
          - "the new run's market_id == run.market_id"
          - "the new run's window_start_iso == run.window_start_iso AND window_end_iso == run.window_end_iso (an EXACT re-run of the same window; a merely overlapping window is rejected by validation priority 37 instead of superseding anything)"
        side_effects:
          - "run.state = SUPERSEDED; superseded_by_run_id = the new run's id"
          - "every TuningInterval claimed by the run returns to state RAW with processing_run_id = null, usable_minutes = 0, invalidation_reason = null; synthetic ASCRIBED rows are deleted"
          - "HouseholdWeight rows of the run deleted"
        note: "A PUBLISHED run is never superseded: an identical-window re-run against a market that already published that window is rejected by validation priority 37, because a PUBLISHED run still counts as non-SUPERSEDED for the overlap check."

  - entity: ClientDeliverable
    state_field: state
    initial_state: SCHEDULED
    terminal_states: [DELIVERED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /client-deliverables/{client_deliverable_id}/dispatch"
        actor: ClientServiceRep
        preconditions:
          - "deliverable.state == SCHEDULED"
          - "deliverable.kind == SCHEDULED_DATASET"
          - "Client.status == ACTIVE"
          - "ProcessingRun.state == PUBLISHED"
        side_effects:
          - "calculation deliverable_billing runs and sets gross_cents, days_late, late_penalty_cents, discount_cents, total_cents"
          - "deliverable.state = DELIVERED; delivered_at stamped; findings_summary stays null"
        note: "Branch A of the fork: datasets skip IN_PROGRESS entirely and never carry findings_summary."
      - from: REQUESTED
        to: IN_PROGRESS
        trigger: "POST /client-deliverables/{client_deliverable_id}/start"
        actor: ClientServiceRep
        preconditions:
          - "deliverable.state IN {REQUESTED, REVISION_REQUESTED}"
          - "deliverable.kind == CUSTOM_ANALYSIS"
          - "Client.status == ACTIVE"
        side_effects: ["deliverable.state = IN_PROGRESS"]
      - from: IN_PROGRESS
        to: DELIVERED
        trigger: "POST /client-deliverables/{client_deliverable_id}/deliver"
        actor: ClientServiceRep
        preconditions:
          - "deliverable.state == IN_PROGRESS"
          - "Client.status == ACTIVE"
        side_effects:
          - "calculation deliverable_billing runs and sets gross_cents, days_late, late_penalty_cents, discount_cents, total_cents"
          - "deliverable.state = DELIVERED; delivered_at stamped; findings_summary stored"
        note: "Branch B of the fork: custom analyses always pass through IN_PROGRESS and always carry findings_summary, whereas branch A (dispatch) never does. Both branches price through deliverable_billing and both carry a requested_cell_count surcharge."
      - from: DELIVERED
        to: REVISION_REQUESTED
        trigger: "POST /client-deliverables/{client_deliverable_id}/request-revision"
        actor: ClientUser
        preconditions:
          - "deliverable.state == DELIVERED"
          - "deliverable.kind == CUSTOM_ANALYSIS"
          - "deliverable.revision_count < 2"
          - "X-User-ID == deliverable.client_id"
        side_effects:
          - "deliverable.state = REVISION_REQUESTED; revision_count += 1"
        note: "Cycle DELIVERED -> REVISION_REQUESTED -> IN_PROGRESS -> DELIVERED; DELIVERED is terminal for kind SCHEDULED_DATASET and for a CUSTOM_ANALYSIS whose revision_count == 2."
      - from: REVISION_REQUESTED
        to: IN_PROGRESS
        trigger: "POST /client-deliverables/{client_deliverable_id}/start"
        actor: ClientServiceRep
        preconditions: ["deliverable.state == REVISION_REQUESTED", "Client.status == ACTIVE"]
        side_effects: ["deliverable.state = IN_PROGRESS"]
      - from: SCHEDULED
        to: HELD
        trigger: "POST /client-deliverables/{client_deliverable_id}/hold, or cascade link 3 of POST /methodology-changes/{methodology_change_id}/activate"
        actor: ClientServiceRep
        preconditions: ["deliverable.state IN {SCHEDULED, REQUESTED, IN_PROGRESS}"]
        side_effects:
          - "deliverable.held_from_state = the pre-hold state; hold_reason set (CLIENT_REQUESTED or DATA_QUALITY_REVIEW when operator-initiated, UPSTREAM_RUN_REPIN when cascaded)"
          - "deliverable.state = HELD"
          - "Client.held_deliverable_count += 1"
          - "Client.delivery_sla_credit_cents += round_half_up(Client.tier_base_fee_cents * 0.05, 0) only when hold_reason == UPSTREAM_RUN_REPIN"
      - from: HELD
        to: SCHEDULED
        trigger: "POST /client-deliverables/{client_deliverable_id}/release"
        actor: ClientServiceRep
        preconditions:
          - "deliverable.state == HELD"
          - "ProcessingRun.state == PUBLISHED (a run still in PENDING_REPIN blocks release)"
        side_effects:
          - "deliverable.state = deliverable.held_from_state; held_from_state = null; hold_reason = null"
          - "Client.held_deliverable_count -= 1"
          - "Client.delivery_sla_credit_cents is NOT reversed by release"
        note: "Release restores exactly held_from_state, so the same call can land on SCHEDULED, REQUESTED or IN_PROGRESS."
    note: "Creation is polymorphic: a row created by POST /clients/{client_id}/scheduled-deliverables has kind SCHEDULED_DATASET and starts in SCHEDULED (the declared initial_state) and may be placed against a run that has not published yet, which is precisely why the upstream re-pin hold cascade can reach it; a row created by POST /client-deliverables has kind CUSTOM_ANALYSIS, requires an already-PUBLISHED run and starts in REQUESTED. No transition ever converts one kind into the other."

  - entity: MethodologyChange
    state_field: state
    initial_state: DRAFT
    terminal_states: [EFFECTIVE]
    transitions:
      - from: DRAFT
        to: IMPACT_ASSESSED
        trigger: "POST /methodology-changes/{methodology_change_id}/impact-analyses"
        actor: GovernanceDirector
        preconditions:
          - "change.state == DRAFT"
          - "payload expected_methodology_change_version == change.version"
          - "the baseline ProcessingRun exists, has state == PUBLISHED and its market_id is an element of change.affected_market_ids"
          - "target_edit_rule_set.status == PUBLISHED"
          - "proposed_edit_rule_set.status == DRAFT"
        side_effects:
          - "calculation methodology_impact_delta sets impact_delta_pct and impact_tier"
          - "notification_lead_hours = NOTIFICATION_LEAD_HOURS[impact_tier]"
          - "baseline_processing_run_id and baseline_projected_average_audience recorded"
          - "change.state = IMPACT_ASSESSED"
          - "increments MethodologyChange.version by 1"
      - from: IMPACT_ASSESSED
        to: NOTIFIED
        trigger: "POST /methodology-changes/{methodology_change_id}/notify"
        actor: GovernanceDirector
        preconditions:
          - "change.state == IMPACT_ASSESSED"
          - "at least one Client with status == ACTIVE has a contract_market_ids element inside change.affected_market_ids"
        side_effects:
          - "one ClientNotification row with state SENT per Client with status == ACTIVE whose contract_market_ids intersects affected_market_ids, created in Client.created_at ASC order, each carrying impact_tier and disclosed_delta_pct copied from the change"
          - "change.notified_client_count set; notification_deadline_at = current logical clock + notification_lead_hours hours"
          - "change.state = NOTIFIED"
      - from: NOTIFIED
        to: EFFECTIVE
        trigger: "POST /methodology-changes/{methodology_change_id}/activate"
        actor: GovernanceDirector
        preconditions:
          - "change.state == NOTIFIED"
          - "X-User-ID != change.created_by_user_id (segregation of duties)"
          - "current logical clock >= notification_deadline_at OR acknowledged_client_count == notified_client_count"
          - "proposed_edit_rule_set.status == DRAFT"
        side_effects:
          - "cascade link 1: change.state = EFFECTIVE, activated_at stamped; proposed EditRuleSet.status = PUBLISHED with published_at stamped; target EditRuleSet.status = SUPERSEDED"
          - "cascade link 2 (caused by link 1's SUPERSEDED rule set): every ProcessingRun whose edit_rule_set_id == target and state IN {OPEN, EDITED} moves to PENDING_REPIN with repin_required_reason RULE_SET_SUPERSEDED, in ProcessingRun.created_at ASC order"
          - "cascade link 3 (caused by link 2's run state change): every ClientDeliverable of those runs in state SCHEDULED, REQUESTED or IN_PROGRESS moves to HELD with hold_reason UPSTREAM_RUN_REPIN, in ClientDeliverable.created_at ASC order"
          - "cascade link 4 (caused by link 3's hold): for each held row, Client.held_deliverable_count += 1 and Client.delivery_sla_credit_cents += round_half_up(tier_base_fee_cents * 0.05, 0)"
      - from: IMPACT_ASSESSED
        to: DRAFT
        trigger: "POST /methodology-changes/{methodology_change_id}/request-revision"
        actor: GovernanceDirector
        preconditions: ["change.state IN {IMPACT_ASSESSED, NOTIFIED}"]
        side_effects:
          - "change.state = DRAFT; revision_count += 1"
          - "impact_delta_pct, impact_tier, notification_lead_hours, notification_deadline_at, baseline_processing_run_id and baseline_projected_average_audience reset to null"
          - "every ClientNotification of this change in state SENT moves to CANCELLED; rows already ACKNOWLEDGED are left untouched (conditional cascade)"
          - "notified_client_count and acknowledged_client_count recomputed from the surviving rows"
      - from: NOTIFIED
        to: DRAFT
        trigger: "POST /methodology-changes/{methodology_change_id}/request-revision"
        actor: GovernanceDirector
        preconditions: ["change.state == NOTIFIED"]
        side_effects:
          - "same side effects as IMPACT_ASSESSED -> DRAFT"
        note: "Cycle DRAFT -> IMPACT_ASSESSED -> NOTIFIED -> DRAFT -> ... with no bound on revision_count."

  - entity: ClientNotification
    state_field: state
    initial_state: SENT
    terminal_states: [ACKNOWLEDGED, CANCELLED]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /client-notifications/{client_notification_id}/acknowledge"
        actor: ClientUser
        preconditions:
          - "notification.state == SENT"
          - "X-User-ID == notification.client_id"
          - "MethodologyChange.state == NOTIFIED"
        side_effects:
          - "notification.state = ACKNOWLEDGED; acknowledged_at stamped"
          - "MethodologyChange.acknowledged_client_count += 1"
      - from: SENT
        to: CANCELLED
        trigger: "cascade of POST /methodology-changes/{methodology_change_id}/request-revision"
        actor: system
        preconditions: ["notification.state == SENT"]
        side_effects: ["notification.state = CANCELLED"]

  - entity: AccreditationAudit
    state_field: state
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /accreditation-audits/{accreditation_audit_id}/finalize with outcome ACCREDITED"
        actor: AccreditationAuditor
        preconditions:
          - "audit.state == OPEN"
          - "X-User-ID != audit.opened_by_user_id (segregation of duties)"
          - "payload limitation_disclosures may be empty for this outcome"
        side_effects:
          - "audit.state = FINALIZED; outcome = ACCREDITED; finalized_by_user_id and finalized_at stamped"
          - "Market.open_audit_count -= 1; Market.accreditation_status = ACCREDITED; Market.publication_blocked = false"
          - "Market.recruitment_posture recomputed (leaves FROZEN when no other audit is OPEN)"
          - "Market.limitation_disclosures unchanged"
      - from: OPEN
        to: FINALIZED
        trigger: "POST /accreditation-audits/{accreditation_audit_id}/finalize with outcome QUALIFIED"
        actor: AccreditationAuditor
        preconditions:
          - "audit.state == OPEN"
          - "X-User-ID != audit.opened_by_user_id"
          - "payload limitation_disclosures has >= 1 element"
        side_effects:
          - "audit.state = FINALIZED; outcome = QUALIFIED; limitation_disclosures stored in payload order"
          - "Market.open_audit_count -= 1; Market.accreditation_status = QUALIFIED; Market.publication_blocked = false"
          - "every element of the payload's limitation_disclosures is appended to Market.limitation_disclosures in payload order"
          - "Market.recruitment_posture recomputed"
      - from: OPEN
        to: FINALIZED
        trigger: "POST /accreditation-audits/{accreditation_audit_id}/finalize with outcome DENIED"
        actor: AccreditationAuditor
        preconditions:
          - "audit.state == OPEN"
          - "X-User-ID != audit.opened_by_user_id"
          - "payload limitation_disclosures has >= 1 element"
        side_effects:
          - "audit.state = FINALIZED; outcome = DENIED; limitation_disclosures stored in payload order"
          - "Market.open_audit_count -= 1; Market.accreditation_status = DENIED; Market.publication_blocked = true"
          - "every element of the payload's limitation_disclosures is appended to Market.limitation_disclosures in payload order"
          - "Market.recruitment_posture recomputed; publication remains blocked by publication_blocked even once posture leaves FROZEN"
    note: "Branching terminal transition: the three outcomes share a from-state but write disjoint side-effect sets on Market (accreditation_status, publication_blocked, limitation_disclosures). Audit creation itself is the opposite move: it increments Market.open_audit_count, which drives recruitment_posture to FROZEN."

  - entity: UniverseEstimate
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /universe-estimates/{universe_estimate_id}/publish"
        actor: MethodologyStatistician
        preconditions:
          - "estimate.status == DRAFT"
          - "every quota_cell_id in cell_populations still resolves to a QuotaCell of estimate.market_id"
        side_effects:
          - "estimate.status = PUBLISHED; published_at stamped"
          - "every other UniverseEstimate of the same market with status == PUBLISHED and effective_from < this estimate's effective_from moves to SUPERSEDED with superseded_at stamped"
          - "every ProcessingRun in state OPEN or EDITED pinned to a now-SUPERSEDED estimate moves to PENDING_REPIN with repin_required_reason UNIVERSE_SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "cascade of POST /universe-estimates/{universe_estimate_id}/publish for a later vintage of the same market"
        actor: system
        preconditions: ["estimate.status == PUBLISHED"]
        side_effects: ["estimate.status = SUPERSEDED; superseded_at stamped"]

  - entity: EditRuleSet
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /edit-rule-sets/{edit_rule_set_id}/publish"
        actor: MethodologyStatistician
        preconditions: ["rule_set.status == DRAFT"]
        side_effects: ["rule_set.status = PUBLISHED; published_at stamped"]
      - from: DRAFT
        to: PUBLISHED
        trigger: "cascade link 1 of POST /methodology-changes/{methodology_change_id}/activate (proposed rule set)"
        actor: system
        preconditions: ["rule_set.status == DRAFT", "rule_set.id == change.proposed_edit_rule_set_id"]
        side_effects: ["rule_set.status = PUBLISHED; published_at stamped"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "cascade link 1 of POST /methodology-changes/{methodology_change_id}/activate (target rule set)"
        actor: system
        preconditions: ["rule_set.status == PUBLISHED", "rule_set.id == change.target_edit_rule_set_id"]
        side_effects:
          - "rule_set.status = SUPERSEDED"
          - "cascade link 2 per state_machines.ProcessingRun OPEN|EDITED -> PENDING_REPIN"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-market
    parent_entity: Market
    write_endpoint: "POST /processing-runs"
    occ_field: "expected_market_version"
    description: |
      Creating a ProcessingRun against a Market whose version has advanced
      since the client last read it is rejected. Run creation legitimately
      supersedes any earlier run of the same market still in OPEN, EDITED or
      PENDING_REPIN, so a writer holding a stale view of the market would
      silently discard editing work it never observed; the version check turns
      that into a deterministic rejection.
    error_id: ERR_STALE_MARKET_VERSION
    http_status: 412
  - rule_id: universe-create-stale-market
    parent_entity: Market
    write_endpoint: "POST /universe-estimates"
    occ_field: "expected_market_version"
    description: |
      Creating a UniverseEstimate vintage against a Market whose version has
      advanced since the client last read it is rejected. A newly published
      vintage legitimately supersedes the market's earlier PUBLISHED vintage
      and repins its open runs, so a writer working from a stale market view
      would retire a vintage it never saw.
    error_id: ERR_STALE_MARKET_VERSION
    http_status: 412
  - rule_id: impact-analysis-stale-change
    parent_entity: MethodologyChange
    write_endpoint: "POST /methodology-changes/{methodology_change_id}/impact-analyses"
    occ_field: "expected_methodology_change_version"
    description: |
      Running an impact analysis against a MethodologyChange whose version has
      advanced since the client last read it is rejected. A fresh analysis
      legitimately overwrites impact_delta_pct, impact_tier and
      notification_lead_hours, so a writer whose view predates a revision round
      would publish a delta computed against a retired proposal.
    error_id: ERR_STALE_METHODOLOGY_CHANGE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: enumeration_verdict
    trigger: "POST /households/{household_id}/enumerations, before any household status transition"
    algorithm: threshold
    formula: |
      seq = household.enumeration_count + 1
      roster_ok   = (payload.roster_persons_count == household.persons_count)
      sets_ok     = (payload.tv_sets_count >= 1)
      if seq == 1:
          age_days = floor((current_logical_clock - household.recruited_at) / 86400 seconds)
          due_ok   = (age_days <= ENUMERATION_DUE_DAYS)          # 14 exactly is still on time
      else:
          due_ok   = true                                        # re-enumerations carry no due date
      verdict = COMPLIANT if (roster_ok and sets_ok and due_ok) else NONCOMPLIANT
    input_set: "Only the submitting household's persons_count, recruited_at and enumeration_count; no other entity participates"
    constants:
      ENUMERATION_DUE_DAYS: 14
    precision: "age_days is an integer floor of whole days"
    variants: []

  - name: quota_cell_fill
    trigger: "every change to QuotaCell.intab_count (Household ACTIVE entry/exit cascades and POST /households/{id}/retire)"
    algorithm: aggregation
    formula: |
      intab_count = COUNT(Household WHERE quota_cell_id == cell.id AND status == ACTIVE)
      fill_rate   = round_half_up(intab_count / cell.target_households, 4)
      quota_status = FILLED       if fill_rate >= 1.0000
                     ON_TARGET    if fill_rate >= 0.8000 and fill_rate < 1.0000
                     UNDER_TARGET otherwise
      # boost side of the same rule
      if quota_status == UNDER_TARGET and not cell.incentive_boost_active:
          cell.incentive_boost_active = true
          cell.effective_incentive_multiplier = 1.25
          market.incentive_budget_reserved_cents += round_half_up(
              cell.base_incentive_cents * INCENTIVE_BOOST_PCT * cell.target_households, 0)
      if quota_status != UNDER_TARGET and cell.incentive_boost_active:
          cell.incentive_boost_active = false
          cell.effective_incentive_multiplier = 1.00
          market.incentive_budget_reserved_cents -= round_half_up(
              cell.base_incentive_cents * INCENTIVE_BOOST_PCT * cell.target_households, 0)
    input_set: "Household rows of this cell with status == ACTIVE exactly; RECRUITED, INSTALL_SCHEDULED, ENUM_PENDING, FAULT_HOLD, NONCOMPLIANT_HOLD and RETIRED households are all excluded"
    constants:
      INCENTIVE_BOOST_PCT: 0.25
      FILLED_THRESHOLD: 1.0000
      ON_TARGET_THRESHOLD: 0.8000
    precision: "fill_rate 4 decimal places, round_half_up; reserved cents are whole cents, round_half_up"
    variants: []

  - name: market_recruitment_posture
    trigger: "POST /markets (initial evaluation, which stamps posture_changed_at), every change to Market.open_audit_count and every change to any child QuotaCell.quota_status"
    algorithm: constraint_propagation
    formula: |
      # evaluated in exactly this order; the first matching clause wins
      quota_cell_count       = COUNT(QuotaCell WHERE market_id == market.id)
      filled_cell_count      = COUNT(QuotaCell WHERE market_id == market.id AND quota_status == FILLED)
      under_target_cell_count= COUNT(QuotaCell WHERE market_id == market.id AND quota_status == UNDER_TARGET)
      1. if market.open_audit_count >= 1                              -> FROZEN
      2. elif quota_cell_count >= 1 and filled_cell_count == quota_cell_count -> CLOSED
      3. elif under_target_cell_count == 0                            -> RESTRICTED
      4. else                                                        -> OPEN
      if the resulting value differs from the stored one:
          market.posture_changed_at = current_logical_clock
    input_set: "All QuotaCell rows of the market regardless of status, plus AccreditationAudit rows of the market with state == OPEN"
    constants: {}
    precision: "integer counts only"
    variants: []
    note: "A market with zero quota cells and no open audit yields under_target_cell_count == 0 and therefore RESTRICTED, not OPEN — clause 3 fires before clause 4."

  - name: meter_missing_minutes
    trigger: "POST /processing-runs/{processing_run_id}/detect-faults, once per INSTALLED Meter of the run's market"
    algorithm: threshold
    formula: |
      covered = SUM(TuningInterval.tuning_minutes
                    WHERE meter_id == meter.id
                      AND state IN {RAW, EDITED, ASCRIBED}
                      AND start_iso >= run.window_start_iso
                      AND end_iso   <= run.window_end_iso)
      missing_minutes = max(0, run.window_minutes - covered)
      suspect_floor   = round_half_up(rule_set.fault_missing_minutes_threshold / 2, 0)
      if missing_minutes >= rule_set.fault_missing_minutes_threshold -> health_status FAULTED, last_fault_code MISSING_INTERVALS
      elif missing_minutes >= suspect_floor                          -> health_status SUSPECT
      else                                                           -> health_status left unchanged
      meter.missing_minutes_last_scan = missing_minutes
    input_set: "TuningInterval rows of that meter whose whole interval lies inside the run window and whose state is RAW, EDITED or ASCRIBED; INVALIDATED rows contribute nothing"
    constants: {}
    precision: "whole minutes; both comparisons are >= (a meter missing exactly the threshold is FAULTED, one minute less is SUSPECT)"
    variants: []

  - name: interval_editing
    trigger: "POST /processing-runs/{processing_run_id}/edit"
    algorithm: chronological
    formula: |
      # Step 1 - claim: every RAW TuningInterval whose household belongs to run.market_id and whose
      #          [start_iso, end_iso) lies inside [window_start_iso, window_end_iso) gets
      #          processing_run_id = run.id. Claim order: (household_id, meter_id, start_iso ASC,
      #          created_at ASC) - created_at breaks ties, never id.
      # Step 2 - invalid tuning: if tuning_minutes > rule_set.invalid_tuning_max_minutes
      #          -> state INVALIDATED, invalidation_reason OVER_MAX_TUNING, usable_minutes = 0
      # Step 3 - credit: else state EDITED and
      #          usable_minutes = round_half_up(tuning_minutes * METHODOLOGY_CREDIT_FACTOR[source_methodology], 0)
      # Step 4 - meter fault: every claimed record of a Meter with health_status == FAULTED
      #          -> state INVALIDATED, invalidation_reason METER_FAULTED, usable_minutes = 0
      # Step 5 - ascription of missing intervals: for each meter, walk its surviving EDITED records in
      #          start_iso ASC order; for each adjacent pair with
      #          gap_minutes = floor((next.start_iso - prev.end_iso) / 60s) in the range
      #          1 .. rule_set.missing_interval_ascription_minutes, create ONE synthetic record with
      #          state ASCRIBED, ascribed = true, start_iso = prev.end_iso, end_iso = next.start_iso,
      #          station_code = prev.station_code, tuning_minutes = gap_minutes and
      #          usable_minutes = round_half_up(gap_minutes * METHODOLOGY_CREDIT_FACTOR[prev.source_methodology], 0).
      #          PORTABLE_OOH meters are never ascribed (out-of-home absence is real absence).
      #          A gap of 0 minutes (adjacent records) produces nothing.
      # Step 6 - outlier households: household_usable = SUM(usable_minutes over that household's
      #          EDITED and ASCRIBED records of this run); if household_usable >
      #          rule_set.outlier_household_minutes_cap then EVERY claimed record of that household
      #          moves to INVALIDATED with invalidation_reason OUTLIER_HOUSEHOLD, usable_minutes = 0,
      #          and run.outlier_household_count += 1. Ascribed records of an outlier household are
      #          deleted rather than invalidated.
      # Step 7 - counters: run.invalidated_interval_count, run.ascribed_interval_count and
      #          run.contributing_household_count = COUNT(distinct household_id with status == ACTIVE
      #          holding >= 1 record of this run in state EDITED or ASCRIBED with usable_minutes > 0)
    input_set: "TuningInterval rows in state RAW only, fully contained in the run window, belonging to households of run.market_id; rows already claimed by another run are skipped"
    constants:
      METHODOLOGY_CREDIT_FACTOR: { INHOME_TUNER: 1.0, STREAMING_SDK: 1.0, PORTABLE_OOH: 0.5 }
    precision: "usable_minutes are whole minutes, round_half_up; steps execute in the numbered order and a later step overwrites an earlier one"
    variants: []

  - name: household_compliance_rate
    trigger: "variant ROLLING_30 on POST /tuning-intervals and on POST /processing-runs/{processing_run_id}/detect-faults; variant RUN_SCOPED during POST /processing-runs/{id}/weight"
    algorithm: aggregation
    formula: |
      # A day is compliant when the household's credited minutes on that UTC calendar date
      # reach MIN_COMPLIANT_DAY_MINUTES.
      compliant_days = COUNT(distinct UTC date d in window
                             WHERE SUM(day_minutes(interval) over intervals credited to d)
                                   >= MIN_COMPLIANT_DAY_MINUTES)
      rate = round_half_up(compliant_days / evaluated_days, 4)
      # day_minutes(interval) = TuningInterval.tuning_minutes under variant ROLLING_30 (panel-health
      # monitoring reads what the household actually reported, before any editing) and
      # TuningInterval.usable_minutes under variant RUN_SCOPED (the run reads credited data only).
      # An interval is credited to the UTC calendar date of its start_iso; intervals crossing
      # midnight are credited entirely to their start date.
      # evaluated_days == 0 yields rate = 0.0000 and never a division by zero.
    input_set: "See each variant — the two variants differ in the window, the interval-state filter AND the denominator basis"
    constants:
      MIN_COMPLIANT_DAY_MINUTES: 30
      ROLLING_WINDOW_DAYS: 30
    precision: "4 decimal places, round_half_up"
    variants:
      - name: ROLLING_30
        when: "Household.compliance_rate_rolling_30 — panel-health monitoring, independent of any run; recomputed and stored on POST /tuning-intervals and on POST /processing-runs/{processing_run_id}/detect-faults and NOT re-derived at read time, so the stored figure is a snapshot of the clock at the last ingest or scan"
        difference: "window = [current_logical_clock - 30 days, current_logical_clock); evaluated_days = COUNT(distinct UTC dates inside the window on which the household holds >= 1 interval in state RAW, EDITED or ASCRIBED) — REPORTED days only, so a household that reported on two days out of thirty is scored out of 2 and not out of 30; interval-state filter is state IN {RAW, EDITED, ASCRIBED} so unedited raw data already counts"
      - name: RUN_SCOPED
        when: "HouseholdWeight.run_compliance_rate — written by the weighting pass of one run"
        difference: "window = [run.window_start_iso, run.window_end_iso); evaluated_days = ceil(run.window_minutes / 1440) — EVERY calendar day of the run window counts whether the household reported on it or not; interval-state filter is state IN {EDITED, ASCRIBED} AND processing_run_id == run.id, so records the edit pass invalidated do not count"

  - name: household_base_weight
    trigger: "POST /processing-runs/{processing_run_id}/weight, one HouseholdWeight row per contributing household"
    algorithm: weighted_scoring
    formula: |
      cell_population = the population_households entry of run.universe_estimate.cell_populations
                        whose quota_cell_id == household.quota_cell_id
      denominator     = the variant-specific in-tab count for that cell (see variants)
      base_weight     = round_half_up(cell_population / denominator, 4)
      # denominator == 0 is impossible: a household only reaches the weighting pass when it is
      # itself counted by its own cell's denominator under the FINAL variant, and validation
      # V-WEIGHT-DESIGN-EMPTY-CELL rejects the run under the DESIGN variant.
    input_set: "Households holding >= 1 TuningInterval of this run in state EDITED or ASCRIBED with usable_minutes > 0; the DENOMINATOR's input set is what differs between variants"
    constants: {}
    precision: "base_weight 4 decimal places, round_half_up"
    variants:
      - name: DESIGN
        when: "run.weight_variant == DESIGN — the design-based weight used for interim/diagnostic runs"
        difference: "denominator = COUNT(Household WHERE quota_cell_id == cell AND status IN {RECRUITED, INSTALL_SCHEDULED, ENUM_PENDING, ACTIVE, FAULT_HOLD, NONCOMPLIANT_HOLD}) — every non-retired recruit counts, whether or not it delivered data"
      - name: FINAL
        when: "run.weight_variant == FINAL — the published weight"
        difference: "denominator = COUNT(Household WHERE quota_cell_id == cell AND the household contributed >= 1 EDITED or ASCRIBED interval to THIS run with usable_minutes > 0) — only actual data providers count, and the count is deliberately NOT re-filtered on the household's current status, so a household that is retired after the edit pass still counts itself and the denominator can never fall below the number of rows being weighted; FINAL weights are therefore always >= DESIGN weights for the same cell whenever every contributor of that cell is still non-retired"

  - name: weight_cap_redistribution
    trigger: "POST /processing-runs/{processing_run_id}/weight, immediately after every base_weight is computed and before any contribution is computed"
    algorithm: waterfall_allocation
    formula: |
      n         = COUNT(HouseholdWeight rows of this run)
      mass      = SUM(base_weight)
      mean_base = round_half_up(mass / n, 4)
      cap       = round_half_up(mean_base * rule_set.outlier_weight_ratio_cap, 4)
      capped_rows = rows WHERE base_weight > cap                    # strictly greater
      if capped_rows is empty:
          adjusted_weight = base_weight for every row; run.total_weight_mass = mass
      else:
          excess = SUM(base_weight - cap over capped_rows)
          for each capped row:   adjusted_weight = cap, capped = true
          receivers = rows WHERE base_weight <= cap, ordered by (created_at ASC)
          receiver_mass = SUM(base_weight over receivers)
          for each receiver:  share = round_half_up(excess * base_weight / receiver_mass, 4)
                              adjusted_weight = base_weight + share
          # remainder repair: mass must be conserved exactly
          drift = mass - SUM(adjusted_weight over ALL rows)
          add drift to the adjusted_weight of the FIRST receiver in (created_at ASC) order
          run.total_weight_mass = SUM(adjusted_weight) == mass
      # single pass only: a receiver pushed above cap by its share is NOT re-capped.
    input_set: "All HouseholdWeight rows of this run; the cap is relative to this run's own mean, never to a global constant"
    constants: {}
    precision: "4 decimal places throughout, round_half_up; total mass is conserved to the last 4th-decimal unit via the drift repair"
    variants: []

  - name: projected_average_audience
    trigger: "POST /processing-runs/{processing_run_id}/weight, after adjusted_weight is final"
    algorithm: aggregation
    formula: |
      # Step 1 - per household, rounded to 2dp:
      contribution = round_half_up(adjusted_weight * household_usable_minutes / run.window_minutes, 2)
      # Step 2 - sum the ALREADY-ROUNDED contributions:
      raw_total    = SUM(contribution)
      # Step 3 - round the sum to a whole household count:
      run.projected_average_audience = round_half_up(raw_total, 0)
      # The rounding order is pinned: rounding each household to 2dp BEFORE summing is required.
      # Summing unrounded products and rounding once at the end is a DIFFERENT (wrong) answer.
      household_usable_minutes = SUM(usable_minutes over that household's EDITED and ASCRIBED
                                     records of this run)
    input_set: "HouseholdWeight rows of this run only; households whose intervals were all invalidated have no row and contribute nothing"
    constants: {}
    precision: "contribution 2 decimal places round_half_up, then the sum of rounded values rounded to 0 decimal places round_half_up"
    variants: []

  - name: incentive_accrual_cents
    trigger: "POST /households/{household_id}/accrue-incentive"
    algorithm: tiered_pricing
    formula: |
      # Steps run in exactly this order; each step rounds to whole cents before the next reads it.
      1. tenure_months = floor((current_logical_clock - household.recruited_at) / 2592000 seconds)   # 30-day months
      2. tenure_mult   = 1.000 if tenure_months < 6
                         1.075 if 6 <= tenure_months < 24
                         1.150 if tenure_months >= 24
      3. cell_base     = round_half_up(quota_cell.base_incentive_cents
                                       * quota_cell.effective_incentive_multiplier, 0)
      4. tenure_amount = round_half_up(cell_base * tenure_mult, 0)
      5. bonus_amount  = round_half_up(tenure_amount * COMPLIANCE_BONUS_PCT, 0)
                         if household.compliance_rate_rolling_30 >= COMPLIANCE_BONUS_THRESHOLD else 0
      6. ooh_amount    = round_half_up(tenure_amount * OOH_SUPPLEMENT_PCT, 0)
                         if the household has >= 1 Meter with meter_type == PORTABLE_OOH and
                         install_status == INSTALLED else 0
      7. gross         = tenure_amount + bonus_amount + ooh_amount
      8. penalty       = round_half_up(gross * FAULT_PENALTY_PCT, 0)
                         if the household has >= 1 Meter with health_status == FAULTED else 0
      9. period_amount = min(gross - penalty, INCENTIVE_PERIOD_CAP_CENTS)
      # Rounding each component separately (step 5 and 6 off the ROUNDED tenure_amount, then summing
      # the rounded components) is required. Summing the unrounded components and rounding once
      # yields a different figure.
    input_set: "The household's own compliance_rate_rolling_30 and Meter rows, plus its QuotaCell's base_incentive_cents and effective_incentive_multiplier at call time"
    constants:
      COMPLIANCE_BONUS_PCT: 0.0855
      OOH_SUPPLEMENT_PCT: 0.0405
      FAULT_PENALTY_PCT: 0.25
      COMPLIANCE_BONUS_THRESHOLD: 0.90
      INCENTIVE_PERIOD_CAP_CENTS: 5000
      TENURE_MULTIPLIERS: { UNDER_6M: 1.000, M6_TO_23: 1.075, M24_PLUS: 1.150 }
    precision: "whole cents at every numbered step, round_half_up; no step ever consumes an unrounded intermediate"
    variants: []

  - name: deliverable_billing
    trigger: "POST /client-deliverables/{client_deliverable_id}/deliver and POST /client-deliverables/{client_deliverable_id}/dispatch"
    algorithm: tiered_pricing
    formula: |
      # Every bracket lookup below is keyed on gross_cents - the pre-discount, pre-penalty figure -
      # so the evaluation order is pinned and there is no circularity, even though discount and
      # penalty both look like they should feed back into the bracket.
      1. gross_cents   = client.tier_base_fee_cents
                         + deliverable.requested_cell_count * CELL_SURCHARGE_CENTS
      2. volume_pct    = 0.00 if gross_cents <  80000
                         0.10 if 80000 <= gross_cents < 150000
                         0.15 if gross_cents >= 150000                  # keyed on GROSS
      3. discount_cents= round_half_up(gross_cents * volume_pct, 0)
      4. days_late     = max(0, ceil((current_logical_clock - deliverable.due_at) / 86400 seconds))
      5. penalty_rate  = 0.000 if gross_cents <  80000
                         0.015 if 80000 <= gross_cents < 150000
                         0.025 if gross_cents >= 150000                  # ALSO keyed on GROSS,
                         # NOT on (gross - discount); using the net figure lands in a lower bracket
      6. late_penalty_cents = round_half_up(gross_cents * penalty_rate * days_late, 0)
      7. total_cents   = max(0, gross_cents - discount_cents - late_penalty_cents)
    input_set: "The deliverable's own requested_cell_count and due_at plus the owning Client's tier_base_fee_cents captured at delivery time"
    constants:
      CELL_SURCHARGE_CENTS: 5000
      VOLUME_BRACKETS: { UNDER_80000: 0.00, B80000_TO_149999: 0.10, B150000_PLUS: 0.15 }
      PENALTY_BRACKETS: { UNDER_80000: 0.000, B80000_TO_149999: 0.015, B150000_PLUS: 0.025 }
    precision: "whole cents, round_half_up; days_late is a ceiling of whole days so any lateness at all counts as a full day"
    variants: []

  - name: methodology_impact_delta
    trigger: "POST /methodology-changes/{methodology_change_id}/impact-analyses"
    algorithm: weighted_scoring
    formula: |
      baseline = the run named by payload.baseline_processing_run_id (state PUBLISHED)
      # three normalised sub-scores, each capped at 1.0
      a = min(1.0, abs(proposed.outlier_weight_ratio_cap - target.outlier_weight_ratio_cap) / 2.5)
      b = min(1.0, abs(proposed.invalid_tuning_max_minutes - target.invalid_tuning_max_minutes) / 300)
      c = min(1.0, abs(proposed.missing_interval_ascription_minutes
                       - target.missing_interval_ascription_minutes) / 60)
      impact_delta_pct = round_half_up(W_CAP * a + W_TUNING * b + W_ASCRIPTION * c, 4)
      impact_tier      = MATERIAL if impact_delta_pct >= 0.1500
                         MODERATE if impact_delta_pct >= 0.0500
                         MINOR    otherwise
      notification_lead_hours   = NOTIFICATION_LEAD_HOURS[impact_tier]
      notification_deadline_at  = current_logical_clock + notification_lead_hours hours
      baseline_projected_average_audience = baseline.projected_average_audience
    input_set: "The target and proposed EditRuleSet rows pinned on the MethodologyChange plus one PUBLISHED ProcessingRun as baseline; no household or interval data is read"
    constants:
      W_CAP: 0.40
      W_TUNING: 0.35
      W_ASCRIPTION: 0.25
      TIER_MATERIAL_THRESHOLD: 0.1500
      TIER_MODERATE_THRESHOLD: 0.0500
      NOTIFICATION_LEAD_HOURS: { MINOR: 72, MODERATE: 336, MATERIAL: 720 }
    precision: "impact_delta_pct 4 decimal places, round_half_up; each sub-score is capped BEFORE weighting, so no single dimension can carry the score past its own weight"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty and X-User-Role names one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "a ClientUser caller may only act on rows belonging to its own client: X-User-ID must equal the ClientDeliverable's client_id or the ClientNotification's client_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /client-deliverables/{client_deliverable_id}/request-revision, POST /client-notifications/{client_notification_id}/acknowledge"

  - priority: 4
    category: existence
    check: "every id in the path resolves to an existing row, validated left-to-right (market_id before quota_cell_id, household_id before meter_id, methodology_change_id before client_notification_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "every reference id in the request body resolves to an existing row (market_id, quota_cell_id, universe_estimate_id, edit_rule_set_id, processing_run_id, client_id, baseline_processing_run_id, target_edit_rule_set_id, proposed_edit_rule_set_id, supersedes_change_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying reference ids"

  - priority: 6
    category: existence
    check: "every required input field of the endpoint is present in the body"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"

  - priority: 7
    category: existence
    check: "each supplied value satisfies its declared enum membership, regex pattern, numeric range and ISO-8601 shape (market_code ^DMA-[0-9]{3}$, serial_no ^MT-[0-9]{6}$, vintage_label ^[0-9]{4}Q[1-4]$, target_households >= 1, roster_persons_count 1..12, tv_sets_count 0..8, tuning_minutes 1..1440, outlier_weight_ratio_cap >= 1.0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"

  - priority: 8
    category: state
    check: "when the endpoint declares an expected_<parent>_version input, the supplied value equals the parent's current version"
    error_id: "the concurrency rule's error_id (ERR_STALE_MARKET_VERSION or ERR_STALE_METHODOLOGY_CHANGE_VERSION)"
    http_status: 412
    applies_to: "POST /processing-runs, POST /universe-estimates, POST /methodology-changes/{methodology_change_id}/impact-analyses"

  - priority: 9
    category: business_temporal
    check: "the requested clock value is greater than or equal to the current logical clock; the clock never moves backwards"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 10
    category: business_safety
    check: "the target market's recruitment_posture is not CLOSED and not FROZEN — an open accreditation audit or a fully filled market stops intake before any cell-level check runs"
    error_id: ERR_RECRUITMENT_CLOSED
    http_status: 409
    applies_to: "POST /households"

  - priority: 11
    category: business_referential
    check: "the referenced quota cell's market_id equals the market_id in the same request body"
    error_id: ERR_QUOTA_CELL_MARKET_MISMATCH
    http_status: 422
    applies_to: "POST /households"

  - priority: 12
    category: business_constraint
    check: "the referenced quota cell's quota_status is not FILLED"
    error_id: ERR_QUOTA_CELL_FILLED
    http_status: 409
    applies_to: "POST /households"

  - priority: 13
    category: business_fiscal
    check: "market.incentive_budget_committed_cents + market.incentive_budget_reserved_cents + the amount about to be committed does not exceed market.incentive_budget_cents"
    error_id: ERR_INCENTIVE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /households/{household_id}/accrue-incentive, POST /markets/{market_id}/quota-cells"

  - priority: 14
    category: state
    check: "the household's status is RECRUITED or INSTALL_SCHEDULED — a household past enumeration no longer accepts new meters"
    error_id: ERR_HOUSEHOLD_NOT_ACCEPTING_METERS
    http_status: 409
    applies_to: "POST /meters"

  - priority: 15
    category: business_constraint
    check: "serial_no is globally unique across all Meter rows including REMOVED ones"
    error_id: ERR_METER_SERIAL_DUPLICATE
    http_status: 409
    applies_to: "POST /meters"

  - priority: 16
    category: business_constraint
    check: "the household holds no other meter of the same meter_type in install_status SHIPPED or INSTALLED (a REMOVED meter of that type does not block a replacement)"
    error_id: ERR_METER_TYPE_ALREADY_PRESENT
    http_status: 409
    applies_to: "POST /meters"

  - priority: 17
    category: state
    check: "the meter's install_status is SHIPPED"
    error_id: ERR_METER_NOT_SHIPPED
    http_status: 409
    applies_to: "POST /meters/{meter_id}/install-confirmations"

  - priority: 18
    category: state
    check: "the meter's health_status is HEALTHY or SUSPECT — a fault cannot be reported twice against the same device without an intervening repair"
    error_id: ERR_METER_ALREADY_FAULTED
    http_status: 409
    applies_to: "POST /meters/{meter_id}/fault-reports"

  - priority: 19
    category: state
    check: "the meter's health_status is FAULTED or SUSPECT and its install_status is not REMOVED — a HEALTHY device has nothing to repair"
    error_id: ERR_METER_NOT_FAULTED
    http_status: 409
    applies_to: "POST /meters/{meter_id}/repairs"

  - priority: 20
    category: state
    check: "the household's status is ENUM_PENDING, ACTIVE or NONCOMPLIANT_HOLD — re-enumeration of an active or held household is allowed, enumeration of a RECRUITED or RETIRED one is not"
    error_id: ERR_HOUSEHOLD_NOT_ENUMERABLE
    http_status: 409
    applies_to: "POST /households/{household_id}/enumerations"

  - priority: 21
    category: state
    check: "the household holds at least one Meter with meter_type == TV_TUNER and install_status == INSTALLED — a household metered only for streaming or out-of-home cannot be enumerated"
    error_id: ERR_NO_INSTALLED_METER
    http_status: 409
    applies_to: "POST /households/{household_id}/enumerations"

  - priority: 22
    category: state
    check: "at least one of those INSTALLED TV_TUNER meters has health_status == HEALTHY — a household whose only tuner is FAULTED or SUSPECT must be repaired before it can be enumerated, because a COMPLIANT verdict would otherwise put a blind household in-tab"
    error_id: ERR_METER_FAULTED
    http_status: 409
    applies_to: "POST /households/{household_id}/enumerations"

  - priority: 23
    category: business_safety
    check: "the market's recruitment_posture is not FROZEN — an open accreditation audit freezes the panel: no meter may be shipped into the market, no household may be enumerated in or out of tab, and no run of the market may be published while the audit stands"
    error_id: ERR_MARKET_FROZEN
    http_status: 409
    applies_to: "POST /meters, POST /households/{household_id}/enumerations, POST /processing-runs/{processing_run_id}/publish"

  - priority: 24
    category: business_referential
    check: "cell_populations lists exactly one entry per QuotaCell of the target market, with no duplicates and no foreign cells"
    error_id: ERR_UNIVERSE_CELL_COVERAGE
    http_status: 422
    applies_to: "POST /universe-estimates"

  - priority: 25
    category: business_temporal
    check: "effective_from is strictly before effective_to; start_iso is strictly before end_iso; window_start_iso is strictly before window_end_iso"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /universe-estimates, POST /tuning-intervals, POST /processing-runs"

  - priority: 26
    category: business_constraint
    check: "(market_id, vintage_label) is unique across UniverseEstimate rows in any status"
    error_id: ERR_UNIVERSE_VINTAGE_DUPLICATE
    http_status: 409
    applies_to: "POST /universe-estimates"

  - priority: 27
    category: state
    check: "the universe estimate's status is DRAFT"
    error_id: ERR_UNIVERSE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /universe-estimates/{universe_estimate_id}/publish"

  - priority: 28
    category: business_temporal
    check: "at least VINTAGE_MIN_GAP_DAYS (28) whole days have elapsed between the currently PUBLISHED vintage's published_at and the logical clock at this publish call"
    error_id: ERR_UNIVERSE_VINTAGE_TOO_SOON
    http_status: 409
    applies_to: "POST /universe-estimates/{universe_estimate_id}/publish"

  - priority: 29
    category: state
    check: "the referenced meter's install_status is INSTALLED"
    error_id: ERR_METER_NOT_INSTALLED
    http_status: 409
    applies_to: "POST /tuning-intervals, POST /meters/{meter_id}/removals"

  - priority: 30
    category: business_referential
    check: "source_methodology matches the meter's meter_type under the fixed mapping TV_TUNER->INHOME_TUNER, STREAMING_ROUTER->STREAMING_SDK, PORTABLE_OOH->PORTABLE_OOH"
    error_id: ERR_METHODOLOGY_METER_MISMATCH
    http_status: 422
    applies_to: "POST /tuning-intervals"

  - priority: 31
    category: business_temporal
    check: "the new [start_iso, end_iso) half-open interval does not overlap any existing TuningInterval of the same meter in state RAW, EDITED or ASCRIBED; touching endpoints (prev.end_iso == new.start_iso) do not overlap, and an INVALIDATED record does not block re-ingest"
    error_id: ERR_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /tuning-intervals"

  - priority: 32
    category: business_temporal
    check: "end_iso is less than or equal to the current logical clock — the panel cannot report viewing that has not happened yet"
    error_id: ERR_INTERVAL_IN_FUTURE
    http_status: 422
    applies_to: "POST /tuning-intervals"

  - priority: 33
    category: business_referential
    check: "the referenced universe estimate's market_id equals the run's market_id"
    error_id: ERR_UNIVERSE_MARKET_MISMATCH
    http_status: 422
    applies_to: "POST /processing-runs"

  - priority: 34
    category: state
    check: "the referenced universe estimate's status is PUBLISHED (DRAFT and SUPERSEDED vintages cannot anchor a run)"
    error_id: ERR_UNIVERSE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /processing-runs"

  - priority: 35
    category: state
    check: "the referenced edit rule set's status is PUBLISHED"
    error_id: ERR_RULE_SET_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /processing-runs"

  - priority: 36
    category: business_temporal
    check: "the run window lies wholly inside the pinned universe estimate's [effective_from, effective_to) range"
    error_id: ERR_RUN_WINDOW_OUTSIDE_UNIVERSE
    http_status: 422
    applies_to: "POST /processing-runs"

  - priority: 37
    category: business_temporal
    check: "the run window does not partially overlap the window of any other ProcessingRun of the same market whose state is not SUPERSEDED. Half-open comparison, so a run starting exactly at another's window_end_iso is accepted. A BYTE-IDENTICAL window is the one exception: it is accepted and supersedes the older run — unless that older run is PUBLISHED, in which case the identical window is rejected like any other overlap"
    error_id: ERR_RUN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /processing-runs"

  - priority: 38
    category: state
    check: "the run's state is OPEN"
    error_id: ERR_RUN_NOT_OPEN
    http_status: 409
    applies_to: "POST /processing-runs/{processing_run_id}/edit, POST /processing-runs/{processing_run_id}/detect-faults"

  - priority: 39
    category: state
    check: "the run's state is EDITED, or it is WEIGHTED and the payload weight_variant differs from the variant already applied. A run in OPEN, PENDING_REPIN, PUBLISHED or SUPERSEDED cannot be weighted, and re-weighting with the variant already in force is refused rather than silently repeated"
    error_id: ERR_RUN_NOT_EDITED
    http_status: 409
    applies_to: "POST /processing-runs/{processing_run_id}/weight"

  - priority: 40
    category: business_constraint
    check: "the run's contributing_household_count is at least 1 — a window in which every interval was invalidated cannot be projected"
    error_id: ERR_NO_CONTRIBUTING_HOUSEHOLDS
    http_status: 409
    applies_to: "POST /processing-runs/{processing_run_id}/weight"

  - priority: 41
    category: business_constraint
    check: "under weight_variant DESIGN every contributing household's quota cell has at least one non-RETIRED household, so no design denominator is zero"
    error_id: ERR_DESIGN_DENOMINATOR_EMPTY
    http_status: 409
    applies_to: "POST /processing-runs/{processing_run_id}/weight"

  - priority: 42
    category: state
    check: "the run's state is WEIGHTED"
    error_id: ERR_RUN_NOT_WEIGHTED
    http_status: 409
    applies_to: "POST /processing-runs/{processing_run_id}/publish"

  - priority: 43
    category: business_safety
    check: "the run's market has publication_blocked == false — a DENIED accreditation outcome blocks publication regardless of who calls and regardless of the run's own readiness"
    error_id: ERR_PUBLICATION_BLOCKED
    http_status: 409
    applies_to: "POST /processing-runs/{processing_run_id}/publish"

  - priority: 44
    category: business_safety
    check: "the publishing X-User-ID differs from the run's opened_by_user_id; the finalizing X-User-ID differs from the audit's opened_by_user_id; the activating X-User-ID differs from the methodology change's created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /processing-runs/{processing_run_id}/publish, POST /accreditation-audits/{accreditation_audit_id}/finalize, POST /methodology-changes/{methodology_change_id}/activate"

  - priority: 45
    category: state
    check: "the owning client's status is ACTIVE"
    error_id: ERR_CLIENT_SUSPENDED
    http_status: 409
    applies_to: "POST /client-deliverables, POST /clients/{client_id}/scheduled-deliverables"

  - priority: 46
    category: business_referential
    check: "the referenced run's market_id appears in the client's contract_market_ids"
    error_id: ERR_MARKET_NOT_CONTRACTED
    http_status: 403
    applies_to: "POST /client-deliverables, POST /clients/{client_id}/scheduled-deliverables"

  - priority: 47
    category: state
    check: "the referenced processing run's state is PUBLISHED. A custom analysis, a dispatch and an impact-analysis baseline all need published data; only a SCHEDULED_DATASET placement is allowed against an unpublished run"
    error_id: ERR_RUN_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /client-deliverables, POST /client-deliverables/{client_deliverable_id}/dispatch, POST /client-deliverables/{client_deliverable_id}/release, POST /methodology-changes/{methodology_change_id}/impact-analyses"

  - priority: 48
    category: state
    check: "for a scheduled dataset placement the referenced run's state is anything except SUPERSEDED — a delivery schedule may be set against a run that has not published yet, but never against a run that has been re-run away"
    error_id: ERR_RUN_SUPERSEDED
    http_status: 409
    applies_to: "POST /clients/{client_id}/scheduled-deliverables"

  - priority: 49
    category: business_fiscal
    check: "client.custom_analysis_used is strictly less than client.custom_analysis_quota; a BASIC-tier client has quota 0 and therefore can never file a custom analysis request"
    error_id: ERR_CUSTOM_ANALYSIS_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /client-deliverables"

  - priority: 50
    category: state
    check: "dispatch requires state SCHEDULED and kind SCHEDULED_DATASET; deliver requires state IN_PROGRESS; start requires state REQUESTED or REVISION_REQUESTED and kind CUSTOM_ANALYSIS; hold requires a non-terminal, non-HELD state. A HELD or already DELIVERED row satisfies none of them"
    error_id: ERR_DELIVERABLE_NOT_DELIVERABLE
    http_status: 409
    applies_to: "POST /client-deliverables/{client_deliverable_id}/dispatch, POST /client-deliverables/{client_deliverable_id}/deliver, POST /client-deliverables/{client_deliverable_id}/start, POST /client-deliverables/{client_deliverable_id}/hold"

  - priority: 51
    category: business_constraint
    check: "the deliverable is DELIVERED, has kind CUSTOM_ANALYSIS and a revision_count strictly less than REVISION_LIMIT (2); the acknowledging ClientUser must belong to the owning client"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /client-deliverables/{client_deliverable_id}/request-revision"

  - priority: 52
    category: state
    check: "the deliverable's state is HELD and its held_from_state is populated"
    error_id: ERR_DELIVERABLE_NOT_HELD
    http_status: 409
    applies_to: "POST /client-deliverables/{client_deliverable_id}/release"

  - priority: 53
    category: business_referential
    check: "target_edit_rule_set_id and proposed_edit_rule_set_id name two different EditRuleSet rows and the target is the one currently PUBLISHED"
    error_id: ERR_RULE_SET_NOT_DISTINCT
    http_status: 422
    applies_to: "POST /methodology-changes"

  - priority: 54
    category: state
    check: "the methodology change's state is DRAFT for impact-analyses, and IMPACT_ASSESSED or NOTIFIED for request-revision — an EFFECTIVE change is terminal and neither call reaches it"
    error_id: ERR_CHANGE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /methodology-changes/{methodology_change_id}/impact-analyses, POST /methodology-changes/{methodology_change_id}/request-revision"

  - priority: 55
    category: business_referential
    check: "the baseline run is PUBLISHED, pins edit_rule_set_id == the change's target_edit_rule_set_id, and its market_id appears in the change's affected_market_ids"
    error_id: ERR_BASELINE_RUN_INVALID
    http_status: 422
    applies_to: "POST /methodology-changes/{methodology_change_id}/impact-analyses"

  - priority: 56
    category: state
    check: "the methodology change's state is IMPACT_ASSESSED"
    error_id: ERR_CHANGE_NOT_ASSESSED
    http_status: 409
    applies_to: "POST /methodology-changes/{methodology_change_id}/notify"

  - priority: 57
    category: state
    check: "the methodology change's state is NOTIFIED"
    error_id: ERR_CHANGE_NOT_NOTIFIED
    http_status: 409
    applies_to: "POST /methodology-changes/{methodology_change_id}/activate"

  - priority: 58
    category: business_constraint
    check: "acknowledged_client_count equals notified_client_count — every notified client has acknowledged; CANCELLED notifications do not count towards either side"
    error_id: ERR_ACKNOWLEDGEMENTS_MISSING
    http_status: 409
    applies_to: "POST /methodology-changes/{methodology_change_id}/activate"

  - priority: 59
    category: business_temporal
    check: "the logical clock has reached notification_deadline_at (>= comparison, so activation at exactly the deadline instant is allowed)"
    error_id: ERR_NOTIFICATION_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /methodology-changes/{methodology_change_id}/activate"

  - priority: 60
    category: state
    check: "the client notification's state is SENT"
    error_id: ERR_NOTIFICATION_NOT_SENT
    http_status: 409
    applies_to: "POST /client-notifications/{client_notification_id}/acknowledge"

  - priority: 61
    category: business_constraint
    check: "the market has no AccreditationAudit in state OPEN"
    error_id: ERR_AUDIT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /accreditation-audits"

  - priority: 62
    category: state
    check: "the audit's state is OPEN"
    error_id: ERR_AUDIT_NOT_OPEN
    http_status: 409
    applies_to: "POST /accreditation-audits/{accreditation_audit_id}/finalize"

  - priority: 63
    category: business_safety
    check: "when outcome is QUALIFIED or DENIED the request carries at least one limitation_disclosures entry — a qualified or denied methodology may never be recorded without a stated limitation"
    error_id: ERR_DISCLOSURE_REQUIRED
    http_status: 422
    applies_to: "POST /accreditation-audits/{accreditation_audit_id}/finalize"

  - priority: 64
    category: state
    check: "the household's status is ACTIVE"
    error_id: ERR_HOUSEHOLD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /households/{household_id}/accrue-incentive"

  - priority: 65
    category: business_fiscal
    check: "the household has no existing accrual_periods entry with the supplied period_label and reversed == false"
    error_id: ERR_INCENTIVE_PERIOD_ALREADY_ACCRUED
    http_status: 409
    applies_to: "POST /households/{household_id}/accrue-incentive"

  - priority: 66
    category: state
    check: "the household's status is not already RETIRED"
    error_id: ERR_HOUSEHOLD_ALREADY_RETIRED
    http_status: 409
    applies_to: "POST /households/{household_id}/retire"

  - priority: 67
    category: state
    check: "the edit rule set's status is DRAFT"
    error_id: ERR_RULE_SET_NOT_DRAFT
    http_status: 409
    applies_to: "POST /edit-rule-sets/{edit_rule_set_id}/publish"

  - priority: 68
    category: business_constraint
    check: "no QuotaCell of this market already carries the same (age_band, income_band, geo_zone) triple"
    error_id: ERR_QUOTA_CELL_DUPLICATE
    http_status: 409
    applies_to: "POST /markets/{market_id}/quota-cells"

  - priority: 69
    category: business_fiscal
    check: "the household's accrual_periods holds an entry with this period_label whose reversed flag is false"
    error_id: ERR_INCENTIVE_PERIOD_NOT_ACCRUED
    http_status: 409
    applies_to: "POST /households/{household_id}/reverse-accrual"

  - priority: 70
    category: state
    check: "the run's state is PENDING_REPIN"
    error_id: ERR_RUN_NOT_PENDING_REPIN
    http_status: 409
    applies_to: "POST /processing-runs/{processing_run_id}/repin"

  - priority: 71
    category: state
    check: "the client's status is SUSPENDED"
    error_id: ERR_CLIENT_NOT_SUSPENDED
    http_status: 409
    applies_to: "POST /clients/{client_id}/reinstate"

  - priority: 72
    category: business_constraint
    check: "at least one Client with status IN {ACTIVE, SUSPENDED} has a contract_market_ids entry that appears in the change's affected_market_ids"
    error_id: ERR_NO_AFFECTED_CLIENTS
    http_status: 409
    applies_to: "POST /methodology-changes/{methodology_change_id}/notify"

  - priority: 73
    category: state
    check: "the meter's household status is one of {INSTALL_SCHEDULED, ENUM_PENDING, NONCOMPLIANT_HOLD, FAULT_HOLD}"
    error_id: ERR_HOUSEHOLD_IN_TAB
    http_status: 409
    applies_to: "POST /meters/{meter_id}/removals"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving endpoint, /_ namespace) -------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every deadline, tenure, window and lateness rule in this domain reads instead of wall-clock time. Before the first call the clock reads exactly 2026-08-01T00:00:00Z — that startup default is fixed and MUST NOT fall back to real wall-clock time. The clock is monotonic: a value earlier than the value currently in force is rejected with ERR_CLOCK_NOT_MONOTONIC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: [current_utc]
    output:
      current_utc: "ISO-8601 UTC timestamp now in force as the logical clock"
      previous_utc: "the value the clock held before this call"
    side_effects: []

  # --- Market ---------------------------------------------------------------
  - method: POST
    path: "/markets"
    description: "Registers a measurement market (DMA). recruitment_posture starts at RESTRICTED because a market with zero quota cells has under_target_cell_count == 0, accreditation_status starts at UNAUDITED and publication_blocked starts false."
    roles: [PanelOperationsManager]
    code: 201
    input: [name, market_code, dma_rank, incentive_budget_cents]
    output: Market
    side_effects: ["market_recruitment_posture evaluated on the empty cell set -> recruitment_posture RESTRICTED", "posture_changed_at set to the logical clock"]

  - method: GET
    path: "/markets/{market_id}"
    description: "Reads one market including its live budget, posture, accreditation and cell-count roll-ups."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: Market
    side_effects: []

  - method: GET
    path: "/markets"
    description: "Lists markets, newest first by created_at DESC then market_code ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["recruitment_posture?", "accreditation_status?", "limit?", "offset?"]
    output: Market[]
    side_effects: []

  - method: POST
    path: "/markets/{market_id}/budget-adjustments"
    description: "Raises or lowers the market's incentive_budget_cents by delta_cents. A reduction that would drop the ceiling below committed + reserved is rejected with ERR_INCENTIVE_BUDGET_EXCEEDED."
    roles: [PanelOperationsManager]
    code: 200
    input: [delta_cents, memo]
    output: Market
    side_effects: ["market.incentive_budget_cents += delta_cents", "market.version incremented by 1"]

  # --- QuotaCell -----------------------------------------------------------
  - method: POST
    path: "/markets/{market_id}/quota-cells"
    description: "Adds one demographic x geographic quota cell to a market. (age_band, income_band, geo_zone) must be unique within the market. The new cell starts empty, so quota_cell_fill puts it at UNDER_TARGET with incentive_boost_active true, which reserves boost budget and re-evaluates the market posture."
    roles: [PanelOperationsManager]
    code: 201
    input: [age_band, income_band, geo_zone, target_households, base_incentive_cents]
    output: QuotaCell
    side_effects: ["quota_cell_fill -> quota_status UNDER_TARGET, fill_rate 0.0000, incentive_boost_active true, effective_incentive_multiplier 1.25", "market.incentive_budget_reserved_cents increased by base_incentive_cents * 0.25 * target_households", "market.quota_cell_count += 1 and market.under_target_cell_count += 1", "market_recruitment_posture re-evaluated -> OPEN", "market.version incremented by 1"]

  - method: GET
    path: "/quota-cells/{quota_cell_id}"
    description: "Reads one quota cell with its live in-tab count, fill rate and incentive multiplier."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: QuotaCell
    side_effects: []

  - method: GET
    path: "/quota-cells"
    description: "Lists quota cells, optionally filtered by owning market and fill status, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["market_id?", "quota_status?", "incentive_boost_active?", "limit?", "offset?"]
    output: QuotaCell[]
    side_effects: []

  # --- UniverseEstimate ----------------------------------------------------
  - method: POST
    path: "/universe-estimates"
    description: "Drafts a population universe vintage for a market. cell_populations must name every quota cell of the market exactly once. expected_market_version pins the market the caller believes it read."
    roles: [MethodologyStatistician]
    code: 201
    input: [market_id, vintage_label, effective_from, effective_to, cell_populations, expected_market_version]
    output: UniverseEstimate
    side_effects: ["status DRAFT", "total_population_households and total_population_persons summed from cell_populations", "increments market.version by 1"]

  - method: POST
    path: "/universe-estimates/{universe_estimate_id}/publish"
    description: "Publishes a DRAFT vintage. The market's previously PUBLISHED vintage moves to SUPERSEDED, and every ProcessingRun of that market still pinned to the superseded vintage in state OPEN, EDITED or WEIGHTED is forced to PENDING_REPIN with repin_required_reason UNIVERSE_SUPERSEDED."
    roles: [MethodologyStatistician]
    code: 200
    input: []
    output: UniverseEstimate
    side_effects: ["status PUBLISHED, published_at set to the logical clock", "previous PUBLISHED vintage of the same market -> SUPERSEDED with superseded_at set", "cascade: non-terminal ProcessingRuns pinned to the superseded vintage -> PENDING_REPIN", "cascade: ClientDeliverables of those runs in a non-terminal state -> HELD with hold_reason UPSTREAM_RUN_REPIN"]

  - method: GET
    path: "/universe-estimates/{universe_estimate_id}"
    description: "Reads one universe vintage including its per-cell population array."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: UniverseEstimate
    side_effects: []

  - method: GET
    path: "/universe-estimates"
    description: "Lists universe vintages, optionally filtered by market and status, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["market_id?", "status?", "limit?", "offset?"]
    output: UniverseEstimate[]
    side_effects: []

  # --- EditRuleSet ---------------------------------------------------------
  - method: POST
    path: "/edit-rule-sets"
    description: "Drafts a data-editing rule set: the ascription window for missing intervals, the invalid-tuning ceiling, the outlier household minute cap, the outlier weight ratio cap and the meter fault threshold."
    roles: [MethodologyStatistician]
    code: 201
    input: [label, missing_interval_ascription_minutes, invalid_tuning_max_minutes, outlier_household_minutes_cap, outlier_weight_ratio_cap, fault_missing_minutes_threshold]
    output: EditRuleSet
    side_effects: ["status DRAFT"]

  - method: POST
    path: "/edit-rule-sets/{edit_rule_set_id}/publish"
    description: "Publishes a DRAFT rule set. The previously PUBLISHED rule set moves to SUPERSEDED, and every non-terminal ProcessingRun still pinned to it is forced to PENDING_REPIN with repin_required_reason RULE_SET_SUPERSEDED."
    roles: [MethodologyStatistician]
    code: 200
    input: []
    output: EditRuleSet
    side_effects: ["status PUBLISHED, published_at set to the logical clock", "previous PUBLISHED rule set -> SUPERSEDED", "cascade: non-terminal ProcessingRuns pinned to the superseded rule set -> PENDING_REPIN", "cascade: ClientDeliverables of those runs in a non-terminal state -> HELD with hold_reason UPSTREAM_RUN_REPIN"]

  - method: GET
    path: "/edit-rule-sets/{edit_rule_set_id}"
    description: "Reads one editing rule set."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: EditRuleSet
    side_effects: []

  - method: GET
    path: "/edit-rule-sets"
    description: "Lists editing rule sets, optionally filtered by status, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EditRuleSet[]
    side_effects: []

  # --- Household ------------------------------------------------------------
  - method: POST
    path: "/households"
    description: "Recruits a household into a quota cell. Blocked when the market's recruitment_posture is CLOSED or FROZEN, and when the target cell is already FILLED. recruited_at is stamped from the logical clock, which is what the incentive tenure multiplier later measures against."
    roles: [PanelOperationsManager]
    code: 201
    input: [market_id, quota_cell_id, recruitment_source, persons_count]
    output: Household
    side_effects: ["status RECRUITED", "recruited_at set to the logical clock", "enumeration_verdict PENDING", "compliance_rate_rolling_30 set to 0.0000"]


  - method: POST
    path: "/households/{household_id}/enumerations"
    description: "Records a household enumeration visit: the roster head-count and the number of TV sets found. Runs enumeration_verdict, writes the outcome onto the household and — because there is no separate activation call — the verdict itself is what moves the household in and out of the in-tab sample. The first enumeration also carries the ENUMERATION_DUE_DAYS deadline measured from recruited_at; re-enumerations do not."
    roles: [FieldTechnician]
    code: 200
    input: [roster_persons_count, tv_sets_count]
    output: Household
    side_effects: ["enumeration_count += 1; roster_persons_count, tv_sets_count and last_enumeration_at stored", "enumeration_verdict set to COMPLIANT or NONCOMPLIANT", "ENUM_PENDING + COMPLIANT -> ACTIVE, cell intab_count += 1, quota_cell_fill and market_recruitment_posture re-run", "ENUM_PENDING + NONCOMPLIANT -> NONCOMPLIANT_HOLD with no intab_count change", "ACTIVE + NONCOMPLIANT -> NONCOMPLIANT_HOLD, cell intab_count -= 1, quota_cell_fill and market_recruitment_posture re-run", "NONCOMPLIANT_HOLD + COMPLIANT -> ACTIVE, cell intab_count += 1 (the cycle restores intab_count to its pre-hold value exactly)"]


  - method: POST
    path: "/households/{household_id}/retire"
    description: "Retires a household permanently. RETIRED is terminal: no later enumeration, activation, accrual or meter operation is accepted."
    roles: [PanelOperationsManager]
    code: 200
    input: [retired_reason]
    output: Household
    side_effects: ["status RETIRED", "every meter of the household with install_status == INSTALLED -> REMOVED (conditional cascade: SHIPPED and already-REMOVED meters are untouched)", "if the household was ACTIVE its cell's intab_count -= 1 then quota_cell_fill and market_recruitment_posture re-run", "unreversed accrual_periods stay on the ledger; incentive_accrued_cents is not clawed back"]

  - method: POST
    path: "/households/{household_id}/accrue-incentive"
    description: "Accrues the cooperation incentive for one payment period. Runs incentive_accrual_cents, appends an accrual_periods entry and commits the amount against the market's incentive budget."
    roles: [PanelOperationsManager]
    code: 200
    input: [period_label]
    output: Household
    side_effects: ["accrual_periods gains an entry {period_label, accrued_cents, reversed: false}", "incentive_accrued_cents += accrued_cents", "market.incentive_budget_committed_cents += accrued_cents"]

  - method: POST
    path: "/households/{household_id}/reverse-accrual"
    description: "Reverses a previously accrued period, e.g. after an audit finds the compliance figure was wrong. The compensating invariant is exact: every field the accrual moved is moved back by the same amount, so incentive_accrued_cents and the market's committed budget return to their pre-accrual values with no drift."
    roles: [PanelOperationsManager]
    code: 200
    input: [period_label, memo]
    output: Household
    side_effects: ["the matching accrual_periods entry gets reversed: true and keeps its accrued_cents for the audit trail", "incentive_accrued_cents -= that entry's accrued_cents", "market.incentive_budget_committed_cents -= that entry's accrued_cents", "the period_label becomes accruable again"]

  - method: GET
    path: "/households/{household_id}"
    description: "Reads one household with its live status, enumeration verdict, rolling compliance rate and incentive ledger."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/households"
    description: "Lists households, optionally filtered by market, quota cell and status, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["market_id?", "quota_cell_id?", "status?", "enumeration_verdict?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  # --- Meter ----------------------------------------------------------------
  - method: POST
    path: "/meters"
    description: "Ships a meter to a household. serial_no is globally unique; a household may hold at most one meter of each meter_type in install_status SHIPPED or INSTALLED. The FIRST meter row created for a RECRUITED household is what moves that household to INSTALL_SCHEDULED — there is no separate scheduling call. A household past enumeration no longer accepts new meters, and a FROZEN market accepts none at all."
    roles: [FieldTechnician]
    code: 201
    input: [household_id, meter_type, serial_no]
    output: Meter
    side_effects: ["install_status SHIPPED", "health_status HEALTHY", "fault_count 0", "missing_minutes_last_scan 0", "when the household is RECRUITED its status becomes INSTALL_SCHEDULED; a second or third meter leaves the household status untouched"]

  - method: POST
    path: "/meters/{meter_id}/install-confirmations"
    description: "Marks a SHIPPED meter as physically installed. Only a TV_TUNER installation advances the household: an INSTALL_SCHEDULED household whose TV_TUNER meter is confirmed moves to ENUM_PENDING, so enumeration becomes possible. Installing a STREAMING_ROUTER or PORTABLE_OOH meter never changes the household status."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: Meter
    side_effects: ["install_status INSTALLED, installed_at set to the logical clock", "when meter_type == TV_TUNER and the household is INSTALL_SCHEDULED its status becomes ENUM_PENDING", "no QuotaCell.intab_count change — installation alone never puts a household in-tab"]


  - method: POST
    path: "/meters/{meter_id}/fault-reports"
    description: "Records a field-detected meter fault. health_status HEALTHY or SUSPECT moves to FAULTED. The five-link cascade only fires when the faulted device is a TV_TUNER and the household is left with no HEALTHY INSTALLED TV_TUNER: household -> FAULT_HOLD, cell intab_count down, cell possibly back to UNDER_TARGET with the incentive boost re-reserved, market roll-ups and posture recomputed."
    roles: [FieldTechnician]
    code: 200
    input: [fault_code]
    output: Meter
    side_effects: ["health_status FAULTED, last_fault_code set, fault_count += 1 (lifetime counter)", "cascade link 2: an ACTIVE household left with zero HEALTHY INSTALLED TV_TUNER meters -> FAULT_HOLD", "cascade link 3: QuotaCell.intab_count -= 1 and quota_cell_fill re-run", "cascade link 4: a cell that fell back to UNDER_TARGET re-arms incentive_boost_active and re-reserves market.incentive_budget_reserved_cents", "cascade link 5: market roll-ups and market_recruitment_posture recomputed, posture_changed_at stamped only when the posture value actually changed"]

  - method: POST
    path: "/meters/{meter_id}/repairs"
    description: "Clears a fault after repair: health_status FAULTED or SUSPECT returns to HEALTHY. This is the exact compensating counterpart of the fault cascade — repairing an INSTALLED TV_TUNER at a FAULT_HOLD household whose enumeration_verdict is still COMPLIANT returns the household to ACTIVE and reverses every ledger movement the fault made, cent for cent and count for count."
    roles: [FieldTechnician]
    code: 200
    input: [repair_note]
    output: Meter
    side_effects: ["health_status HEALTHY, missing_minutes_last_scan reset to 0", "fault_count is NOT decremented — it is a lifetime counter", "cascade link 2: a FAULT_HOLD household with enumeration_verdict COMPLIANT whose repaired meter is an INSTALLED TV_TUNER -> ACTIVE", "cascade link 3: QuotaCell.intab_count += 1 and quota_cell_fill re-run", "cascade link 4: a cell that left UNDER_TARGET disarms incentive_boost_active and releases the reserved boost cents", "cascade link 5: market roll-ups and market_recruitment_posture recomputed"]

  - method: POST
    path: "/meters/{meter_id}/removals"
    description: "Decommissions an INSTALLED meter and takes the device back out of the field: the panel's normal equipment-swap and end-of-service operation. Only permitted while the owning household is out of tab (INSTALL_SCHEDULED, ENUM_PENDING, NONCOMPLIANT_HOLD or FAULT_HOLD), so a removal never silently changes an in-tab head-count; an ACTIVE household must be taken out of tab first, and a RETIRED household's meters were already removed by the retirement cascade. Removing a household's only TV_TUNER is what leaves an otherwise enumerable household with no installed tuner."
    roles: [FieldTechnician]
    code: 200
    input: [removal_note]
    output: Meter
    side_effects: ["install_status REMOVED", "health_status and fault_count left exactly as they were - removal is not a repair", "no household status change and no QuotaCell.intab_count change", "the freed meter_type becomes available again, so a replacement device of the same type may be shipped"]

  - method: GET
    path: "/meters/{meter_id}"
    description: "Reads one meter with its install status, health status and last fault scan."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: Meter
    side_effects: []

  - method: GET
    path: "/meters"
    description: "Lists meters, optionally filtered by household, install status and health status, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["household_id?", "install_status?", "health_status?", "meter_type?", "limit?", "offset?"]
    output: Meter[]
    side_effects: []

  # --- TuningInterval -------------------------------------------------------
  - method: POST
    path: "/tuning-intervals"
    description: "Ingests one raw tuning interval from an installed meter. household_id is derived from the meter, never supplied. source_methodology must match the meter's type, the half-open window must not overlap another live interval of the same meter, and end_iso may not be in the future relative to the logical clock."
    roles: [MethodologyStatistician]
    code: 201
    input: [meter_id, source_methodology, start_iso, end_iso, station_code, tuning_minutes]
    output: TuningInterval
    side_effects: ["state RAW, usable_minutes 0, ascribed false, processing_run_id null", "household_id copied from the meter", "household_compliance_rate variant ROLLING_30 recomputed for the owning household"]

  - method: GET
    path: "/tuning-intervals/{tuning_interval_id}"
    description: "Reads one tuning interval including its edit state, invalidation reason and credited usable_minutes. Raw panel records are confidential: only panel operations, statisticians and accreditation auditors may read them."
    roles: [PanelOperationsManager, MethodologyStatistician, AccreditationAuditor]
    code: 200
    input: []
    output: TuningInterval
    side_effects: []

  - method: GET
    path: "/tuning-intervals"
    description: "Lists tuning intervals, optionally filtered by meter, household, claiming run and edit state, ordered by start_iso ASC then created_at ASC. Confidential: panel operations, statisticians and accreditation auditors only."
    roles: [PanelOperationsManager, MethodologyStatistician, AccreditationAuditor]
    code: 200
    input: ["meter_id?", "household_id?", "processing_run_id?", "state?", "source_methodology?", "ascribed?", "limit?", "offset?"]
    output: TuningInterval[]
    side_effects: []

  # --- ProcessingRun --------------------------------------------------------
  - method: POST
    path: "/processing-runs"
    description: "Opens a measurement processing run over a window of one market, version-pinning the PUBLISHED universe vintage and the PUBLISHED edit rule set it will use. weight_variant is NOT chosen here — it is chosen at weighting time. Creating a run whose window is byte-identical to an existing non-PUBLISHED run of the same market supersedes that older run; a merely overlapping window is rejected. expected_market_version pins the market the caller believes it read."
    roles: [MethodologyStatistician]
    code: 201
    input: [market_id, universe_estimate_id, edit_rule_set_id, window_start_iso, window_end_iso, expected_market_version]
    output: ProcessingRun
    side_effects: ["state OPEN, weight_variant null", "window_minutes computed as whole minutes between window_start_iso and window_end_iso", "opened_by_user_id set from X-User-ID", "an existing OPEN, EDITED, WEIGHTED or PENDING_REPIN run of the same market with a byte-identical window -> SUPERSEDED with superseded_by_run_id set, its claimed intervals released to RAW and its HouseholdWeight rows deleted", "increments market.version by 1"]

  - method: POST
    path: "/processing-runs/{processing_run_id}/detect-faults"
    description: "Runs meter_missing_minutes across every INSTALLED meter of the run's market, marking meters SUSPECT or FAULTED from the coverage shortfall inside the run window. A meter that turns FAULTED drops its ACTIVE household to FAULT_HOLD, which cascades into the cell fill rate and the market posture — a fault-detection scan can therefore change recruitment posture without anyone touching a household."
    roles: [MethodologyStatistician]
    code: 200
    input: []
    output: ProcessingRun
    side_effects: ["each scanned meter's missing_minutes_last_scan updated", "meters at or over the rule set's fault_missing_minutes_threshold -> health_status FAULTED with last_fault_code MISSING_INTERVALS and fault_count += 1", "meters at or over half the threshold but under it -> health_status SUSPECT", "every ACTIVE household owning a newly FAULTED meter -> FAULT_HOLD, cell intab_count -= 1, quota_cell_fill and market_recruitment_posture re-run", "household_compliance_rate variant ROLLING_30 refreshed for every scanned household"]

  - method: POST
    path: "/processing-runs/{processing_run_id}/edit"
    description: "Applies the pinned rule set's data-editing rules to every RAW interval inside the window: claims them for the run, invalidates over-max tuning, credits minutes by collection methodology, invalidates records from FAULTED meters, ascribes missing intervals inside the ascription window, then invalidates whole outlier households. Runs the interval_editing steps in their numbered order."
    roles: [MethodologyStatistician]
    code: 200
    input: []
    output: ProcessingRun
    side_effects: ["state EDITED", "claimed intervals get processing_run_id set and move to EDITED, INVALIDATED or (synthetic) ASCRIBED", "run.invalidated_interval_count, run.ascribed_interval_count, run.outlier_household_count and run.contributing_household_count written"]

  - method: POST
    path: "/processing-runs/{processing_run_id}/weight"
    description: "Projects the edited window under the requested weighting basis: household_base_weight under weight_variant DESIGN or FINAL, then weight_cap_redistribution against this run's own mean, then projected_average_audience. Writes one HouseholdWeight row per contributing household. Callable a second time from WEIGHTED with the OTHER variant, which deletes the previous rows and re-projects the same edited data; calling it again with the same variant is rejected."
    roles: [MethodologyStatistician]
    code: 200
    input: [weight_variant]
    output: ProcessingRun
    side_effects: ["state WEIGHTED, run.weight_variant set to the payload value", "any HouseholdWeight rows from a previous weighting pass of this run are deleted first", "one HouseholdWeight row per contributing household with base_weight, adjusted_weight, usable_minutes, contribution, run_compliance_rate and capped", "run.total_weight_mass and run.projected_average_audience written", "run.intab_snapshot_count and run.excluded_cell_count written", "household_compliance_rate variant RUN_SCOPED evaluated per weight row"]

  - method: POST
    path: "/processing-runs/{processing_run_id}/publish"
    description: "Publishes a WEIGHTED run. Requires a market that is not publication_blocked and a publisher different from the operator who opened the run. Publication copies the market's current limitation_disclosures onto the run, so an accreditation qualification recorded before publication is disclosed with the data."
    roles: [MethodologyStatistician]
    code: 200
    input: []
    output: ProcessingRun
    side_effects: ["state PUBLISHED (terminal)", "published_by_user_id set from X-User-ID", "market.limitation_disclosures appended to run.limitation_disclosures at publish time", "every ClientDeliverable pinned to this run in state SCHEDULED becomes due: due_at = logical clock + client.delivery_sla_hours hours, walked in client created_at ASC order"]

  - method: POST
    path: "/processing-runs/{processing_run_id}/repin"
    description: "Re-pins a PENDING_REPIN run onto the currently PUBLISHED universe vintage and/or edit rule set and returns it to OPEN so it can be re-edited. This is the cycle in the run state machine; every interval the previous edit pass claimed is released back to RAW so the new rules see untouched data."
    roles: [MethodologyStatistician]
    code: 200
    input: ["universe_estimate_id?", "edit_rule_set_id?"]
    output: ProcessingRun
    side_effects: ["state OPEN, repin_required_reason cleared to null", "supplied pins replaced; omitted pins left as they are", "every TuningInterval with processing_run_id == this run returns to state RAW with usable_minutes 0 and processing_run_id null; synthetic ASCRIBED records are deleted", "run counters (invalidated_interval_count, ascribed_interval_count, outlier_household_count, contributing_household_count) reset to 0", "HouseholdWeight rows of this run are deleted and total_weight_mass / projected_average_audience reset to 0"]

  - method: GET
    path: "/processing-runs/{processing_run_id}"
    description: "Reads one processing run with its pins, editing counters, weight mass and projection."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: ProcessingRun
    side_effects: []

  - method: GET
    path: "/processing-runs"
    description: "Lists processing runs, optionally filtered by market, pinned universe vintage, pinned rule set and state, ordered by window_start_iso ASC then created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["market_id?", "universe_estimate_id?", "edit_rule_set_id?", "state?", "weight_variant?", "limit?", "offset?"]
    output: ProcessingRun[]
    side_effects: []

  # --- HouseholdWeight ------------------------------------------------------
  - method: GET
    path: "/household-weights/{household_weight_id}"
    description: "Reads one household weight row: its base weight, its capped/redistributed adjusted weight, its run-scoped compliance rate and its contribution to the projection. Confidential panel output."
    roles: [PanelOperationsManager, MethodologyStatistician, AccreditationAuditor]
    code: 200
    input: []
    output: HouseholdWeight
    side_effects: []

  - method: GET
    path: "/household-weights"
    description: "Lists household weight rows, optionally filtered by run, household and capped flag, ordered by created_at ASC. Confidential panel output."
    roles: [PanelOperationsManager, MethodologyStatistician, AccreditationAuditor]
    code: 200
    input: ["processing_run_id?", "household_id?", "capped?", "weight_variant?", "limit?", "offset?"]
    output: HouseholdWeight[]
    side_effects: []

  # --- Client ---------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Registers a subscribing client on a tier. The tier fixes tier_base_fee_cents, delivery_sla_hours and custom_analysis_quota from the tier table; supplying them in the body is ignored. contract_market_ids lists the markets the client may receive data for."
    roles: [ClientServiceRep]
    code: 201
    input: [name, tier, contract_market_ids]
    output: Client
    side_effects: ["status ACTIVE", "tier_base_fee_cents, delivery_sla_hours and custom_analysis_quota derived from tier (BASIC 25000/168h/0, STANDARD 65000/72h/3, PREMIUM 120000/24h/10)", "custom_analysis_used 0, held_deliverable_count 0, delivery_sla_credit_cents 0"]

  - method: POST
    path: "/clients/{client_id}/suspend"
    description: "Suspends a client for non-payment or contract breach. A SUSPENDED client cannot receive new deliverables, and every non-terminal deliverable it owns is put on hold."
    roles: [ClientServiceRep]
    code: 200
    input: [suspended_reason]
    output: Client
    side_effects: ["status SUSPENDED", "cascade: every ClientDeliverable of the client in SCHEDULED, REQUESTED, IN_PROGRESS or REVISION_REQUESTED -> HELD with hold_reason CLIENT_REQUESTED and held_from_state recorded", "held_deliverable_count set to the number of holds now standing"]

  - method: POST
    path: "/clients/{client_id}/reinstate"
    description: "Returns a SUSPENDED client to ACTIVE. Deliverables are NOT auto-released: each hold must be released explicitly, so a reinstated client's backlog is reviewed one item at a time."
    roles: [ClientServiceRep]
    code: 200
    input: []
    output: Client
    side_effects: ["status ACTIVE, suspended_reason cleared to null", "held_deliverable_count left unchanged"]

  - method: POST
    path: "/clients/{client_id}/scheduled-deliverables"
    description: "Puts a scheduled dataset delivery for a run on the client's delivery schedule. Unlike a custom analysis this may be placed BEFORE the run publishes — delivery schedules are contractual and set in advance — so any run state except SUPERSEDED is accepted. kind is SCHEDULED_DATASET and the row starts in SCHEDULED; due_at stays null until the run publishes, at which point the client's tier SLA clock starts. Because such a row can sit against a run that is still editable, it is the deliverable that an upstream re-pin can put on hold."
    roles: [ClientServiceRep]
    code: 201
    input: [processing_run_id, requested_cell_count]
    output: ClientDeliverable
    side_effects: ["kind SCHEDULED_DATASET, state SCHEDULED, question null", "revision_count 0, gross_cents 0, total_cents 0", "due_at set immediately to the logical clock + client.delivery_sla_hours when the pinned run is already PUBLISHED, otherwise left null until publication"]

  - method: GET
    path: "/clients/{client_id}"
    description: "Reads one client with its tier-derived SLA, custom-analysis usage and hold counters."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "Lists clients, optionally filtered by tier and status, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["tier?", "status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  # --- ClientDeliverable ----------------------------------------------------
  - method: POST
    path: "/client-deliverables"
    description: "Files a custom analysis request against a published run. kind is CUSTOM_ANALYSIS and the row starts in REQUESTED, not in the machine's declared initial_state. Consumes one unit of the client's tier custom_analysis_quota, so a BASIC client (quota 0) is always refused."
    roles: [ClientServiceRep]
    code: 201
    input: [client_id, processing_run_id, question, requested_cell_count]
    output: ClientDeliverable
    side_effects: ["kind CUSTOM_ANALYSIS, state REQUESTED", "client.custom_analysis_used += 1", "due_at set to the logical clock + client.delivery_sla_hours"]

  - method: POST
    path: "/client-deliverables/{client_deliverable_id}/start"
    description: "Moves a SCHEDULED or REQUESTED deliverable to IN_PROGRESS."
    roles: [ClientServiceRep]
    code: 200
    input: []
    output: ClientDeliverable
    side_effects: ["state IN_PROGRESS"]

  - method: POST
    path: "/client-deliverables/{client_deliverable_id}/dispatch"
    description: "Dispatches a SCHEDULED_DATASET deliverable straight from SCHEDULED to DELIVERED — scheduled datasets skip the IN_PROGRESS analyst step. Prices the item with deliverable_billing."
    roles: [ClientServiceRep]
    code: 200
    input: ["findings_summary?"]
    output: ClientDeliverable
    side_effects: ["state DELIVERED, delivered_at set to the logical clock", "gross_cents, discount_cents, days_late, late_penalty_cents and total_cents written by deliverable_billing", "client.delivery_sla_credit_cents += late_penalty_cents"]

  - method: POST
    path: "/client-deliverables/{client_deliverable_id}/deliver"
    description: "Delivers an IN_PROGRESS custom analysis and prices it. Runs deliverable_billing: gross from the client's tier base fee plus a per-cell surcharge, a volume discount, and a lateness penalty whose rate brackets are BOTH keyed on the gross figure rather than on the discounted net."
    roles: [ClientServiceRep]
    code: 200
    input: [findings_summary]
    output: ClientDeliverable
    side_effects: ["state DELIVERED, delivered_at set to the logical clock", "gross_cents, discount_cents, days_late, late_penalty_cents and total_cents written by deliverable_billing", "client.delivery_sla_credit_cents += late_penalty_cents"]

  - method: POST
    path: "/client-deliverables/{client_deliverable_id}/request-revision"
    description: "The subscriber rejects a DELIVERED item and asks for a revision, moving it back to REVISION_REQUESTED. This is the deliverable cycle, and it is bounded: REVISION_LIMIT is 2. Only a ClientUser may ask — the servicing rep cannot open a revision on the client's behalf."
    roles: [ClientUser]
    code: 200
    input: [reason]
    output: ClientDeliverable
    side_effects: ["state REVISION_REQUESTED", "revision_count += 1", "delivered_at cleared to null; gross_cents, discount_cents, late_penalty_cents and total_cents reset to 0"]

  - method: POST
    path: "/client-deliverables/{client_deliverable_id}/hold"
    description: "Puts a non-terminal deliverable on hold, recording the state it was held from so the release is exact. Manual holds carry hold_reason CLIENT_REQUESTED or DATA_QUALITY_REVIEW; UPSTREAM_RUN_REPIN is reserved for the cascade and is rejected here."
    roles: [ClientServiceRep]
    code: 200
    input: [hold_reason]
    output: ClientDeliverable
    side_effects: ["held_from_state set to the current state, then state HELD", "client.held_deliverable_count += 1"]

  - method: POST
    path: "/client-deliverables/{client_deliverable_id}/release"
    description: "Releases a HELD deliverable back to exactly the state it was held from, which is what held_from_state records — the release is a compensating move, not a reset to SCHEDULED. A hold raised by an upstream re-pin can only be released once the pinned run is PUBLISHED again."
    roles: [ClientServiceRep]
    code: 200
    input: []
    output: ClientDeliverable
    side_effects: ["state restored from held_from_state; held_from_state and hold_reason cleared to null", "client.held_deliverable_count -= 1"]

  - method: GET
    path: "/client-deliverables/{client_deliverable_id}"
    description: "Reads one deliverable with its hold provenance, revision count and billing breakdown."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: ClientDeliverable
    side_effects: []

  - method: GET
    path: "/client-deliverables"
    description: "Lists deliverables, optionally filtered by client, pinned run, kind and state, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["client_id?", "processing_run_id?", "kind?", "state?", "hold_reason?", "limit?", "offset?"]
    output: ClientDeliverable[]
    side_effects: []

  # --- MethodologyChange ----------------------------------------------------
  - method: POST
    path: "/methodology-changes"
    description: "Opens a methodology change proposing a DRAFT rule set to replace the currently PUBLISHED one across a set of affected markets. supersedes_change_id optionally chains this change to the one it replaces."
    roles: [GovernanceDirector]
    code: 201
    input: [title, target_edit_rule_set_id, proposed_edit_rule_set_id, affected_market_ids, "supersedes_change_id?"]
    output: MethodologyChange
    side_effects: ["state DRAFT", "created_by_user_id set from X-User-ID", "impact_delta_pct 0.0000, impact_tier null, revision_count 0"]

  - method: POST
    path: "/methodology-changes/{methodology_change_id}/impact-analyses"
    description: "Runs methodology_impact_delta against a PUBLISHED baseline run, classifying the change MINOR, MODERATE or MATERIAL and deriving the client notification lead time and deadline from that tier. expected_methodology_change_version pins the change the caller believes it read."
    roles: [GovernanceDirector]
    code: 200
    input: [baseline_processing_run_id, expected_methodology_change_version]
    output: MethodologyChange
    side_effects: ["state IMPACT_ASSESSED", "impact_delta_pct, impact_tier, notification_lead_hours and notification_deadline_at written", "baseline_processing_run_id and baseline_projected_average_audience pinned", "revision_count is NOT touched here - it is owned exclusively by POST /methodology-changes/{methodology_change_id}/request-revision, so a draft-assess-revise-assess round trip leaves revision_count at exactly 1", "increments methodology_change.version by 1"]

  - method: POST
    path: "/methodology-changes/{methodology_change_id}/notify"
    description: "Notifies every client contracted to an affected market, creating one ClientNotification per client with the change's impact tier and disclosed delta. Suspended clients are notified too — disclosure is not a commercial privilege."
    roles: [GovernanceDirector]
    code: 200
    input: []
    output: MethodologyChange
    side_effects: ["state NOTIFIED", "one ClientNotification per distinct client whose contract_market_ids intersect affected_market_ids, state SENT, sent_at set to the logical clock, impact_tier and disclosed_delta_pct copied from the change", "notified_client_count set, acknowledged_client_count 0"]

  - method: POST
    path: "/methodology-changes/{methodology_change_id}/request-revision"
    description: "Sends an IMPACT_ASSESSED or NOTIFIED change back to DRAFT because the analysis or the disclosure was wrong. Every SENT notification of the change is CANCELLED, which is what makes the notification counters safe to rebuild: a cancelled notification counts towards neither notified_client_count nor acknowledged_client_count."
    roles: [GovernanceDirector]
    code: 200
    input: [reason]
    output: MethodologyChange
    side_effects: ["state DRAFT", "revision_count += 1", "impact_delta_pct, impact_tier, notification_lead_hours, notification_deadline_at, baseline_processing_run_id and baseline_projected_average_audience cleared", "cascade: every ClientNotification of this change in state SENT -> CANCELLED", "notified_client_count and acknowledged_client_count reset to 0"]

  - method: POST
    path: "/methodology-changes/{methodology_change_id}/activate"
    description: "Activates the change: the proposed rule set is published, the target rule set is superseded, and every non-terminal run pinned to the old rules is forced to PENDING_REPIN. Requires that every notified client has acknowledged AND that the tier's notification lead time has fully elapsed, and that the activating operator is not the one who drafted the change."
    roles: [GovernanceDirector]
    code: 200
    input: []
    output: MethodologyChange
    side_effects: ["state EFFECTIVE, activated_at set to the logical clock", "proposed EditRuleSet -> PUBLISHED with published_at set; target EditRuleSet -> SUPERSEDED", "cascade: non-terminal ProcessingRuns pinned to the superseded rule set -> PENDING_REPIN with repin_required_reason RULE_SET_SUPERSEDED", "cascade: ClientDeliverables of those runs in a non-terminal state -> HELD with hold_reason UPSTREAM_RUN_REPIN and client.held_deliverable_count incremented", "the superseded change named by supersedes_change_id keeps its own state — activation never rewrites history"]

  - method: GET
    path: "/methodology-changes/{methodology_change_id}"
    description: "Reads one methodology change with its impact analysis, notification counters and rule-set pins."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: MethodologyChange
    side_effects: []

  - method: GET
    path: "/methodology-changes"
    description: "Lists methodology changes, optionally filtered by state, by either pinned rule set and by the change they supersede, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["state?", "impact_tier?", "target_edit_rule_set_id?", "proposed_edit_rule_set_id?", "supersedes_change_id?", "limit?", "offset?"]
    output: MethodologyChange[]
    side_effects: []

  # --- ClientNotification ---------------------------------------------------
  - method: POST
    path: "/client-notifications/{client_notification_id}/acknowledge"
    description: "The subscriber acknowledges a methodology change notification. The acknowledgement is what unblocks activation, so this endpoint is the cross-entity gate between the client side and the governance side. Only a ClientUser may acknowledge."
    roles: [ClientUser]
    code: 200
    input: []
    output: ClientNotification
    side_effects: ["state ACKNOWLEDGED, acknowledged_at set to the logical clock", "methodology_change.acknowledged_client_count += 1"]

  - method: GET
    path: "/client-notifications/{client_notification_id}"
    description: "Reads one methodology change notification with its disclosed impact."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: ClientNotification
    side_effects: []

  - method: GET
    path: "/client-notifications"
    description: "Lists notifications, optionally filtered by the change being disclosed, the notified client and acknowledgement state, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["methodology_change_id?", "client_id?", "state?", "impact_tier?", "limit?", "offset?"]
    output: ClientNotification[]
    side_effects: []

  # --- AccreditationAudit ---------------------------------------------------
  - method: POST
    path: "/accreditation-audits"
    description: "Opens an accreditation audit of a market's methodology, scoped to a PUBLISHED rule set. Opening an audit freezes recruitment in that market immediately: market_recruitment_posture's first clause fires on open_audit_count >= 1 and overrides every cell-level consideration."
    roles: [AccreditationAuditor]
    code: 201
    input: [market_id, scope_edit_rule_set_id, auditor_note]
    output: AccreditationAudit
    side_effects: ["state OPEN", "opened_by_user_id set from X-User-ID", "market.open_audit_count += 1 then market_recruitment_posture re-evaluated -> FROZEN with posture_changed_at updated"]

  - method: POST
    path: "/accreditation-audits/{accreditation_audit_id}/finalize"
    description: "Finalizes the audit with an outcome and, for QUALIFIED or DENIED outcomes, the limitations that must be disclosed with the data. A DENIED outcome blocks publication for the market; a QUALIFIED outcome allows publication but forces the limitations onto every run published afterwards. The finalizing auditor must differ from the one who opened the audit."
    roles: [AccreditationAuditor]
    code: 200
    input: [outcome, limitation_disclosures]
    output: AccreditationAudit
    side_effects: ["state FINALIZED (terminal), outcome and limitation_disclosures stored, finalized_by_user_id and finalized_at set", "market.accreditation_status set to the outcome", "for QUALIFIED and DENIED every payload disclosure is APPENDED to market.limitation_disclosures in payload order; for ACCREDITED market.limitation_disclosures is left exactly as it was, so a disclosure once recorded is never erased by a later clean audit", "market.publication_blocked set true for DENIED, false for ACCREDITED and QUALIFIED", "market.open_audit_count -= 1 then market_recruitment_posture re-evaluated, releasing FROZEN"]

  - method: GET
    path: "/accreditation-audits/{accreditation_audit_id}"
    description: "Reads one accreditation audit with its outcome and disclosed limitations."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: []
    output: AccreditationAudit
    side_effects: []

  - method: GET
    path: "/accreditation-audits"
    description: "Lists accreditation audits, optionally filtered by market, scoped rule set and state, ordered by created_at ASC."
    roles: [PanelOperationsManager, FieldTechnician, MethodologyStatistician, ClientServiceRep, ClientUser, AccreditationAuditor, GovernanceDirector]
    code: 200
    input: ["market_id?", "scope_edit_rule_set_id?", "state?", "outcome?", "limit?", "offset?"]
    output: AccreditationAudit[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID missing or empty, or X-User-Role absent or not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed on the endpoint, or a ClientUser is acting on a row belonging to a different client"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input is missing, or a supplied value violates its enum, regex, range or ISO-8601 shape (including a manual hold whose hold_reason is UPSTREAM_RUN_REPIN)"

  # --- not found -----------------------------------------------------------
  - id: ERR_MARKET_NOT_FOUND
    http: 404
    condition: "market_id in a path or body does not resolve"
  - id: ERR_QUOTA_CELL_NOT_FOUND
    http: 404
    condition: "quota_cell_id in a path or body does not resolve"
  - id: ERR_UNIVERSE_ESTIMATE_NOT_FOUND
    http: 404
    condition: "universe_estimate_id in a path or body does not resolve"
  - id: ERR_EDIT_RULE_SET_NOT_FOUND
    http: 404
    condition: "edit_rule_set_id, target_edit_rule_set_id, proposed_edit_rule_set_id or scope_edit_rule_set_id does not resolve"
  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "household_id in a path or body does not resolve"
  - id: ERR_METER_NOT_FOUND
    http: 404
    condition: "meter_id in a path or body does not resolve"
  - id: ERR_TUNING_INTERVAL_NOT_FOUND
    http: 404
    condition: "tuning_interval_id in a path does not resolve"
  - id: ERR_PROCESSING_RUN_NOT_FOUND
    http: 404
    condition: "processing_run_id or baseline_processing_run_id does not resolve"
  - id: ERR_HOUSEHOLD_WEIGHT_NOT_FOUND
    http: 404
    condition: "household_weight_id in a path does not resolve"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id in a path or body does not resolve"
  - id: ERR_CLIENT_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "client_deliverable_id in a path does not resolve"
  - id: ERR_CLIENT_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "client_notification_id in a path does not resolve"
  - id: ERR_METHODOLOGY_CHANGE_NOT_FOUND
    http: 404
    condition: "methodology_change_id or supersedes_change_id does not resolve"
  - id: ERR_ACCREDITATION_AUDIT_NOT_FOUND
    http: 404
    condition: "accreditation_audit_id in a path does not resolve"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_MARKET_VERSION
    http: 412
    condition: "expected_market_version does not equal the market's current version on POST /universe-estimates or POST /processing-runs"
  - id: ERR_STALE_METHODOLOGY_CHANGE_VERSION
    http: 412
    condition: "expected_methodology_change_version does not equal the change's current version on POST /methodology-changes/{methodology_change_id}/impact-analyses"

  # --- clock ---------------------------------------------------------------
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "POST /_clock/set_current_utc with a value earlier than the clock currently in force"

  # --- recruitment / quota / budget ---------------------------------------
  - id: ERR_RECRUITMENT_CLOSED
    http: 409
    condition: "POST /households into a market whose recruitment_posture is CLOSED or FROZEN"
  - id: ERR_MARKET_FROZEN
    http: 409
    condition: "POST /meters, POST /households/{household_id}/enumerations or POST /processing-runs/{processing_run_id}/publish while the market's recruitment_posture is FROZEN because an accreditation audit is open"
  - id: ERR_QUOTA_CELL_MARKET_MISMATCH
    http: 422
    condition: "the quota cell named in the body belongs to a different market than market_id"
  - id: ERR_QUOTA_CELL_FILLED
    http: 409
    condition: "POST /households into a quota cell whose quota_status is FILLED"
  - id: ERR_INCENTIVE_BUDGET_EXCEEDED
    http: 409
    condition: "committed + reserved + the amount about to be committed or reserved would exceed the market's incentive_budget_cents, including a budget reduction that would fall below the amount already spoken for"
  - id: ERR_QUOTA_CELL_DUPLICATE
    http: 409
    condition: "POST /markets/{market_id}/quota-cells with an (age_band, income_band, geo_zone) triple already present in that market"

  # --- household lifecycle -------------------------------------------------
  - id: ERR_HOUSEHOLD_NOT_ACCEPTING_METERS
    http: 409
    condition: "POST /meters for a household whose status is not RECRUITED or INSTALL_SCHEDULED"
  - id: ERR_HOUSEHOLD_NOT_ENUMERABLE
    http: 409
    condition: "POST /households/{household_id}/enumerations for a household whose status is not ENUM_PENDING, ACTIVE or NONCOMPLIANT_HOLD"
  - id: ERR_NO_INSTALLED_METER
    http: 409
    condition: "the household holds no Meter with meter_type TV_TUNER and install_status INSTALLED"
  - id: ERR_METER_FAULTED
    http: 409
    condition: "every INSTALLED TV_TUNER meter of the household has health_status FAULTED or SUSPECT"
  - id: ERR_HOUSEHOLD_NOT_ACTIVE
    http: 409
    condition: "POST /households/{household_id}/accrue-incentive for a household whose status is not ACTIVE"
  - id: ERR_HOUSEHOLD_ALREADY_RETIRED
    http: 409
    condition: "POST /households/{household_id}/retire for a household already in the terminal RETIRED status"
  - id: ERR_INCENTIVE_PERIOD_ALREADY_ACCRUED
    http: 409
    condition: "POST /households/{household_id}/accrue-incentive with a period_label already present and not reversed"
  - id: ERR_INCENTIVE_PERIOD_NOT_ACCRUED
    http: 409
    condition: "POST /households/{household_id}/reverse-accrual with a period_label that has no unreversed accrual entry"

  # --- meters --------------------------------------------------------------
  - id: ERR_METER_SERIAL_DUPLICATE
    http: 409
    condition: "serial_no already exists on any Meter row, including REMOVED ones"
  - id: ERR_METER_TYPE_ALREADY_PRESENT
    http: 409
    condition: "the household already holds a SHIPPED or INSTALLED meter of the same meter_type"
  - id: ERR_METER_NOT_SHIPPED
    http: 409
    condition: "POST /meters/{meter_id}/install-confirmations for a meter whose install_status is not SHIPPED"
  - id: ERR_METER_NOT_INSTALLED
    http: 409
    condition: "POST /tuning-intervals for a meter whose install_status is not INSTALLED"
  - id: ERR_METER_ALREADY_FAULTED
    http: 409
    condition: "POST /meters/{meter_id}/fault-reports for a meter already in health_status FAULTED"
  - id: ERR_METER_NOT_FAULTED
    http: 409
    condition: "POST /meters/{meter_id}/repairs for a HEALTHY meter, or for a REMOVED device"

  # --- universe estimates --------------------------------------------------
  - id: ERR_HOUSEHOLD_IN_TAB
    http: 409
    condition: "POST /meters/{meter_id}/removals for a meter whose household status is ACTIVE (in tab) or RETIRED"
  - id: ERR_UNIVERSE_CELL_COVERAGE
    http: 422
    condition: "cell_populations does not name every quota cell of the market exactly once, or names a cell of another market"
  - id: ERR_UNIVERSE_VINTAGE_DUPLICATE
    http: 409
    condition: "(market_id, vintage_label) already exists in any status"
  - id: ERR_UNIVERSE_NOT_DRAFT
    http: 409
    condition: "POST /universe-estimates/{universe_estimate_id}/publish for a vintage that is already PUBLISHED or SUPERSEDED"
  - id: ERR_UNIVERSE_VINTAGE_TOO_SOON
    http: 409
    condition: "fewer than 28 whole days have elapsed since the currently PUBLISHED vintage's published_at"
  - id: ERR_UNIVERSE_NOT_PUBLISHED
    http: 409
    condition: "a run pins a universe vintage whose status is DRAFT or SUPERSEDED"
  - id: ERR_UNIVERSE_MARKET_MISMATCH
    http: 422
    condition: "the pinned universe vintage belongs to a different market than the run"

  # --- editing rule sets ---------------------------------------------------
  - id: ERR_RULE_SET_NOT_DRAFT
    http: 409
    condition: "POST /edit-rule-sets/{edit_rule_set_id}/publish for a rule set that is already PUBLISHED or SUPERSEDED"
  - id: ERR_RULE_SET_NOT_PUBLISHED
    http: 409
    condition: "a run or an accreditation audit references a rule set whose status is not PUBLISHED"
  - id: ERR_RULE_SET_NOT_DISTINCT
    http: 422
    condition: "target_edit_rule_set_id equals proposed_edit_rule_set_id, or the named target is not the currently PUBLISHED rule set"

  # --- tuning intervals ----------------------------------------------------
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "a start bound is not strictly before its end bound (universe effective range, interval, run window)"
  - id: ERR_METHODOLOGY_METER_MISMATCH
    http: 422
    condition: "source_methodology does not match the meter's meter_type under the fixed TV_TUNER/STREAMING_ROUTER/PORTABLE_OOH mapping"
  - id: ERR_INTERVAL_OVERLAP
    http: 409
    condition: "the new half-open interval overlaps an existing RAW, EDITED or ASCRIBED interval of the same meter"
  - id: ERR_INTERVAL_IN_FUTURE
    http: 422
    condition: "end_iso is later than the current logical clock"

  # --- processing runs -----------------------------------------------------
  - id: ERR_RUN_WINDOW_OUTSIDE_UNIVERSE
    http: 422
    condition: "the run window is not wholly inside the pinned vintage's [effective_from, effective_to) range"
  - id: ERR_RUN_WINDOW_OVERLAP
    http: 409
    condition: "the run window partially overlaps a non-SUPERSEDED run of the same market, or exactly matches the window of a PUBLISHED run"
  - id: ERR_RUN_NOT_OPEN
    http: 409
    condition: "POST /processing-runs/{processing_run_id}/edit or /detect-faults for a run whose state is not OPEN"
  - id: ERR_RUN_NOT_EDITED
    http: 409
    condition: "POST /processing-runs/{processing_run_id}/weight for a run that is not EDITED, and not WEIGHTED-with-a-different-variant"
  - id: ERR_RUN_NOT_WEIGHTED
    http: 409
    condition: "POST /processing-runs/{processing_run_id}/publish for a run whose state is not WEIGHTED"
  - id: ERR_RUN_NOT_PENDING_REPIN
    http: 409
    condition: "POST /processing-runs/{processing_run_id}/repin for a run whose state is not PENDING_REPIN"
  - id: ERR_RUN_NOT_PUBLISHED
    http: 409
    condition: "a custom analysis, a dispatch, a hold release or an impact-analysis baseline references a run that is not PUBLISHED"
  - id: ERR_RUN_SUPERSEDED
    http: 409
    condition: "a scheduled dataset placement references a run whose state is SUPERSEDED"
  - id: ERR_NO_CONTRIBUTING_HOUSEHOLDS
    http: 409
    condition: "the weighting pass finds contributing_household_count == 0 because every interval in the window was invalidated"
  - id: ERR_DESIGN_DENOMINATOR_EMPTY
    http: 409
    condition: "weight_variant DESIGN with a contributing household whose quota cell has no non-RETIRED household"
  - id: ERR_PUBLICATION_BLOCKED
    http: 409
    condition: "POST /processing-runs/{processing_run_id}/publish while the market's publication_blocked is true after a DENIED accreditation outcome"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID is the same operator who opened the run, opened the audit or drafted the methodology change"

  # --- clients and deliverables -------------------------------------------
  - id: ERR_CLIENT_SUSPENDED
    http: 409
    condition: "a deliverable is created, started, dispatched or delivered for a client whose status is SUSPENDED"
  - id: ERR_CLIENT_NOT_SUSPENDED
    http: 409
    condition: "POST /clients/{client_id}/reinstate for a client that is already ACTIVE"
  - id: ERR_MARKET_NOT_CONTRACTED
    http: 403
    condition: "the run's market_id does not appear in the client's contract_market_ids"
  - id: ERR_CUSTOM_ANALYSIS_QUOTA_EXCEEDED
    http: 409
    condition: "custom_analysis_used has reached the tier's custom_analysis_quota, which is 0 for BASIC"
  - id: ERR_DELIVERABLE_NOT_DELIVERABLE
    http: 409
    condition: "dispatch, deliver, start or hold called on a deliverable whose state or kind does not admit that step"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "request-revision on a deliverable that is not DELIVERED CUSTOM_ANALYSIS, or whose revision_count has reached 2"
  - id: ERR_DELIVERABLE_NOT_HELD
    http: 409
    condition: "POST /client-deliverables/{client_deliverable_id}/release for a deliverable whose state is not HELD"

  # --- methodology governance ---------------------------------------------
  - id: ERR_CHANGE_NOT_DRAFT
    http: 409
    condition: "impact-analyses on a change that is not DRAFT, or request-revision on a change that is neither IMPACT_ASSESSED nor NOTIFIED"
  - id: ERR_BASELINE_RUN_INVALID
    http: 422
    condition: "the baseline run is not PUBLISHED, is not pinned to the change's target rule set, or belongs to a market outside affected_market_ids"
  - id: ERR_CHANGE_NOT_ASSESSED
    http: 409
    condition: "POST /methodology-changes/{methodology_change_id}/notify for a change whose state is not IMPACT_ASSESSED"
  - id: ERR_CHANGE_NOT_NOTIFIED
    http: 409
    condition: "POST /methodology-changes/{methodology_change_id}/activate for a change whose state is not NOTIFIED"
  - id: ERR_ACKNOWLEDGEMENTS_MISSING
    http: 409
    condition: "activation attempted while acknowledged_client_count is below notified_client_count"
  - id: ERR_NOTIFICATION_PERIOD_OPEN
    http: 409
    condition: "activation attempted before the logical clock reaches notification_deadline_at"
  - id: ERR_NOTIFICATION_NOT_SENT
    http: 409
    condition: "acknowledge called on a notification whose state is ACKNOWLEDGED or CANCELLED"
  - id: ERR_NO_AFFECTED_CLIENTS
    http: 409
    condition: "POST /methodology-changes/{methodology_change_id}/notify when no client's contract_market_ids intersects affected_market_ids, so the change could become effective with nobody informed"

  # --- accreditation -------------------------------------------------------
  - id: ERR_AUDIT_ALREADY_OPEN
    http: 409
    condition: "POST /accreditation-audits for a market that already has an audit in state OPEN"
  - id: ERR_AUDIT_NOT_OPEN
    http: 409
    condition: "POST /accreditation-audits/{accreditation_audit_id}/finalize for an audit already FINALIZED"
  - id: ERR_DISCLOSURE_REQUIRED
    http: 422
    condition: "finalize with outcome QUALIFIED or DENIED and an empty limitation_disclosures list"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PanelOperationsManager
    description: "Owns the market surface: registers markets and quota cells, moves the incentive budget, recruits and retires households and runs the cooperation-incentive ledger."
    identity: "opaque"
    exclusive_operations:
      - "POST /markets"
      - "POST /markets/{market_id}/quota-cells"
      - "POST /markets/{market_id}/budget-adjustments"
      - "POST /households"
      - "POST /households/{household_id}/retire"
      - "POST /households/{household_id}/accrue-incentive"
      - "POST /households/{household_id}/reverse-accrual"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint, including the confidential GET /tuning-intervals* and GET /household-weights* reads"

  - name: FieldTechnician
    description: "Owns the field surface: ships and installs meters, reports and repairs faults, and performs household enumerations. Enumeration verdicts are what move households in and out of the in-tab sample."
    identity: "opaque"
    exclusive_operations:
      - "POST /meters"
      - "POST /meters/{meter_id}/install-confirmations"
      - "POST /meters/{meter_id}/fault-reports"
      - "POST /meters/{meter_id}/repairs"
      - "POST /households/{household_id}/enumerations"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every non-confidential GET endpoint"

  - name: MethodologyStatistician
    description: "Owns the measurement pipeline: universe vintages, editing rule sets, interval ingest and the open/edit/weight/publish run cycle. Two different statisticians are required to open and publish the same run."
    identity: "opaque"
    exclusive_operations:
      - "POST /universe-estimates"
      - "POST /universe-estimates/{universe_estimate_id}/publish"
      - "POST /edit-rule-sets"
      - "POST /edit-rule-sets/{edit_rule_set_id}/publish"
      - "POST /tuning-intervals"
      - "POST /processing-runs"
      - "POST /processing-runs/{processing_run_id}/detect-faults"
      - "POST /processing-runs/{processing_run_id}/edit"
      - "POST /processing-runs/{processing_run_id}/weight"
      - "POST /processing-runs/{processing_run_id}/publish"
      - "POST /processing-runs/{processing_run_id}/repin"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint, including the confidential GET /tuning-intervals* and GET /household-weights* reads"

  - name: ClientServiceRep
    description: "Owns the commercial surface: client records, tier assignment, suspension, the delivery schedule and the analyst side of deliverables. Cannot acknowledge a notification or ask for a revision on the client's behalf."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /clients/{client_id}/suspend"
      - "POST /clients/{client_id}/reinstate"
      - "POST /clients/{client_id}/scheduled-deliverables"
      - "POST /client-deliverables"
      - "POST /client-deliverables/{client_deliverable_id}/start"
      - "POST /client-deliverables/{client_deliverable_id}/dispatch"
      - "POST /client-deliverables/{client_deliverable_id}/deliver"
      - "POST /client-deliverables/{client_deliverable_id}/hold"
      - "POST /client-deliverables/{client_deliverable_id}/release"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every non-confidential GET endpoint"

  - name: ClientUser
    description: "The subscriber acting for itself. X-User-ID is the Client row's id, so every ClientUser call is scoped to that client's own deliverables and notifications."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /client-deliverables/{client_deliverable_id}/request-revision"
      - "POST /client-notifications/{client_notification_id}/acknowledge"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every non-confidential GET endpoint"

  - name: AccreditationAuditor
    description: "Independent auditor of methodology. Opening an audit freezes the market's panel; finalizing it sets the market's accreditation status, its disclosed limitations and whether publication is blocked. Two different auditors are required to open and finalize the same audit."
    identity: "opaque"
    exclusive_operations:
      - "POST /accreditation-audits"
      - "POST /accreditation-audits/{accreditation_audit_id}/finalize"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint, including the confidential GET /tuning-intervals* and GET /household-weights* reads"

  - name: GovernanceDirector
    description: "Owns methodology change management: drafting a change, running its impact analysis, notifying clients and activating it once the disclosure period has run and every notified client has acknowledged. A different director must activate than drafted."
    identity: "opaque"
    exclusive_operations:
      - "POST /methodology-changes"
      - "POST /methodology-changes/{methodology_change_id}/impact-analyses"
      - "POST /methodology-changes/{methodology_change_id}/notify"
      - "POST /methodology-changes/{methodology_change_id}/request-revision"
      - "POST /methodology-changes/{methodology_change_id}/activate"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every non-confidential GET endpoint"
