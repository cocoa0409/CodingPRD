  - section: RBAC
    instances:
      - name: every_role_can_perform_one_of_its_own_exclusive_operations
        claim_type: Exclusive Operations Allowed
        grounds:
          - roles[Anonymous].exclusive_operations
          - roles[NetworkAdmin].exclusive_operations
          - roles[FiscalOfficer].exclusive_operations
          - roles[QualityCoach].exclusive_operations
          - roles[Provider].exclusive_operations
          - roles[Substitute].exclusive_operations
        distinguishing_aspect: "One representative exclusive operation per declared role succeeds with its own role header: Anonymous apply, NetworkAdmin license-verification, Provider execute, FiscalOfficer advance, QualityCoach coaching-visit create and Substitute accept all return 2xx in a single chain."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id, mst0: $.data.membership_status }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version, mst1: $.data.membership_status }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING", "COACHING", "SUBSTITUTE_POOL"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
              captures: { agst: $.data.status }
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { c1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: NetworkAdmin
              captures: { cv1: $.data.version }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cl1: $.data.id }
            - call: "POST /fccn/subsidy-claims/${cl1}/submit"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Ada Nkemelu", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2500, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", reason: "ILLNESS", min_credential_level: "NONE" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa1: $.data.id }
          trigger:
            - call: "POST /fccn/subsidy-claims/${cl1}/advance"
              as: FiscalOfficer
              captures: { clst: $.data.status }
            - call: "POST /fccn/coaching-visits"
              payload: { provider_id: "${p1}", scheduled_on: "2026-08-10T00:00:00Z", focus_area: "CURRICULUM" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { v1: $.data.id, vst: $.data.status }
            - call: "POST /fccn/substitute-assignments/${sa1}/accept"
              as: Substitute
              as_user_id: "${s1}"
              captures: { sast: $.data.staffing_status }
          assert:
            - "${mst0} == APPLICANT (Anonymous apply accepted at 201) and ${mst1} == PENDING_AGREEMENT (NetworkAdmin exclusive op accepted)"
            - "${agst} == EXECUTED (Provider exclusive op accepted)"
            - "${clst} == ADVANCE_PAID (FiscalOfficer exclusive op accepted)"
            - "${vst} == SCHEDULED (QualityCoach exclusive op accepted)"
            - "${sast} == CONFIRMED (Substitute exclusive op accepted)"
            - "no call in this instance returns an error_id"

      - name: fiscal_officer_cannot_execute_a_membership_agreement_forbidden_role
