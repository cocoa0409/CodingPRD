              captures: { m1_id: $.data.id }
            - call: "POST /cash-vault/counting-machines"
              payload: { vault_id: "${v_id}", machine_code: "SORT-C52B", machine_type: "CURRENCY_SORTER", status: "AVAILABLE" }
