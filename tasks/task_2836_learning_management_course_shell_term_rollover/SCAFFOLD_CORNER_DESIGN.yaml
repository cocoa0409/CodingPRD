          - entities.AcademicTerm.fields.continuity_posture
        distinguishing_aspect: "One row, two machines: the posture moves NORMAL -> ELEVATED -> NORMAL without disturbing lifecycle_state, and lifecycle moves IN_SESSION -> FINALS -> GRADING without resetting the posture. Both dimensions share ONE version counter, so seven successful writes must land the row on version 7 while the rejected posture change bumps nothing."
        test_recipe:
          setup:
            - "A freshly created term 2026FA — lifecycle_state PLANNING, continuity_posture NORMAL, version 1."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
