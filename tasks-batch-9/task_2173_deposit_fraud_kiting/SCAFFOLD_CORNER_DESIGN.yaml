            - call: "POST /deposit-fraud/funding-sources/${fs_ag}/verification-attempts"
              payload: { micro_deposit_cents: "${md_ag}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_ag}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 50000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_ag_pending: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_ag}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 60000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_ag_cleared: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_ag}/deposit-items"
