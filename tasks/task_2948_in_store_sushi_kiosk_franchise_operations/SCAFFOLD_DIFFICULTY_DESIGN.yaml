            - call: "POST /kiosk-ops/chefs/${chef_id}/placement"
              payload: { assigned_kiosk_id: "${kiosk_id}", as_lead_chef: true }
              as: FranchisorOps
            - call: "POST /kiosk-ops/kiosks/${kiosk_id}/commission"
              payload: { commissioned_on: "2026-08-03" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/pos-sales-feeds"
              payload: { host_store_id: "${hs_id}", business_date: "2026-08-03", gross_sales_cents: 2400000, markdown_sales_cents: 300000, full_price_units: 100, markdown_units: 40, lines: [] }
              as: HostStoreManager
              as_user_id: "${hs_id}"
              captures: { feed_id: $.data.id }
            - call: "POST /kiosk-ops/pos-sales-feeds/${feed_id}/reconcile"
              as: FranchisorOps
            - call: "GET /kiosk-ops/license-agreements/${la_id}"
