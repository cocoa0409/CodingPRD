          Depth-2 chain from a different trigger (vendor suspend, not stop
          load-out): PartnerVendor APPROVED -> SUSPENDED causes each open
          CrossRentalRequest (REQUESTED or ACCEPTED) to cancel, and each such
          cancellation itself releases the hold expectation on the linked
          DRAFT reservation (observable as reservation staying DRAFT and the
          request terminal).
        test_recipe:
          setup:
            - "Vendor V APPROVED covering LAX; two CrossRentalRequests against V: one REQUESTED, one ACCEPTED"
            - "Each request linked to its own DRAFT reservation (created via rider-line source attempt with use_cross_rental where no in-house unit exists)"
