            - call: "GET /students/${sb}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sb_counts3: $.data.attempt_counts, sb_remaining3: $.data.remaining_attempts, sb_hold: $.data.advising_hold }
            - call: "GET /test-attempts/${att2}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { att2_ord_after: $.data.attempt_ordinal, att2_scored_at_after: $.data.scored_at, att2_gate_after: $.data.next_eligible_at }
            - call: "POST /test-attempts/${att2}/void"
              payload: { void_reason: "PROCTOR_ERROR" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { att2_voided: $.data.state, att2_gate_final: $.data.next_eligible_at }
            - call: "GET /students/${sb}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sb_counts4: $.data.attempt_counts, sb_remaining4: $.data.remaining_attempts }
            - call: "GET /test-attempts"
              payload: { student_id: "${sb}", state: "VOIDED" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { voided_first_state: "$.data[0].state", voided_first_gate: "$.data[0].next_eligible_at" }
          assert:
            - "BEFORE: ${sb_counts0}.MATH == 0 and ${sb_remaining0}.MATH == 3 — sum 3"
            - "AFTER SCORE 1: ${sb_counts1}.MATH == 1 and ${sb_remaining1}.MATH == 2 — sum 3; ${att1_ord} == 1, ${att1_scored_at} == \"2026-08-01T00:00:00Z\", ${att1_gate} == \"2026-08-15T00:00:00Z\""
            - "AFTER SCORE 2: ${sb_counts2}.MATH == 2 and ${sb_remaining2}.MATH == 1 — sum 3; ${att2_ord} == 2, ${att2_scored_at} == \"2026-08-20T00:00:00Z\", ${att2_gate} == \"2026-09-19T00:00:00Z\" (tier 2, 30 days)"
            - "${att1_voided} == \"VOIDED\" and ${att1_reason} == \"ADMIN_CORRECTION\" and ${att1_gate_after} == null"
            - "COMPENSATION: ${sb_counts3}.MATH == 1 and ${sb_remaining3}.MATH == 2 — EXACTLY the post-score-1 values, sum 3, no drift"
            - "RENUMBERING: ${att2_ord_after} == 1 and ${att2_scored_at_after} == \"2026-08-20T00:00:00Z\" (unchanged) and ${att2_gate_after} == \"2026-09-03T00:00:00Z\" — tier 1 applied to its OWN scored_at, NOT to the void instant"
            - "${att2_gate_after} != \"2026-09-19T00:00:00Z\" — leaving the ordinal at 2 is the failure this instance detects"
            - "${att2_gate_after} != \"2026-08-14T00:00:00Z\" — recomputing from the logical clock instead of scored_at is the other failure it detects"
            - "${att2_voided} == \"VOIDED\" and ${att2_gate_final} == null"
            - "FULL COMPENSATION: ${sb_counts4}.MATH == 0 and ${sb_remaining4}.MATH == 3 — identical to the pre-score baseline, sum 3"
            - "${voided_first_state} == \"VOIDED\" and ${voided_first_gate} == null, and GET /test-attempts?student_id=${sb}&state=VOIDED reports total_count 2 while the same query with state=SCORED reports total_count 0 — INVARIANT 2 holds: attempt_counts equals the number of SCORED attempts at every observation, including 1 == 1 while one attempt was voided and one survived"
            - "${sb_hold} is recomputed on the void per HOP 2 and is observable, but with no PlacementDetermination in play it stays false"

      - name: override_redemption_balance_returns_to_zero_after_drop_and_is_reusable
        conserved_quantity: "the override redemption balance: count(PrerequisiteOverride in CONSUMED) == count(Registration with override_id set and state IN {ENROLLED, COMPLETED}), with every ISSUED override carrying a null consumed_by_registration_id"
        grounds:
          - calculations.override_redemption_balance_invariant
          - endpoints[POST /registrations/{registration_id}/confirm]
          - endpoints[POST /registrations/{registration_id}/drop]
          - endpoints[POST /registrations/{registration_id}/grade]
        distinguishing_aspect: |
          A third conserved quantity spanning two aggregates, and the compensation
          has to be a genuine release rather than a status flag: after the drop the
          SAME override must be redeemable again by a brand-new registration, with
          consumed_by_registration_id repointed to the new row. The instance also
          pins the boundary of the claimed set — grading a redemption to COMPLETED
          keeps it claimed, so the balance must NOT be disturbed by a state change
          that merely leaves ENROLLED.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses READ-050 (ENGLISH, units 3.0) and MATH-050 (MATH, level_rank 50, units 5.0); ACTIVE BLOCKING PREREQUISITE MATH-050 -> READ-050 with min_grade C."
            - "One ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1)."
            - "Student SC: hs_gpa 2.50 VERIFIED, transcript_recorded_at 2025-06-01T00:00:00Z, determination placing MATH-050; no COMPLETED READ-050 registration, so the closure is UNMET without a grant."
            - "Section secY of MATH-050, term 2026FA, seat_capacity 5, OPEN, UNPAIRED — seats never bind."
            - "Override OC issued to SC on the MATH-050 -> READ-050 edge with expires_at 2026-12-01T00:00:00Z, comfortably in the future for the whole sequence."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "READ-050", title: "College Reading", subject_area: "ENGLISH", level_rank: 50, units: 3.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_read: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_050}", requisite_course_id: "${c_read}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R960", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 5 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secy: $.data.id }
            - call: "POST /sections/${secy}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secy_v0: $.data.version }
            - call: "POST /students"
              payload: { student_number: "SC", full_name: "Student C", race_ethnicity_code: "HISPANIC", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sc: $.data.id, sc_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sc}", subject_area: "MATH", expected_student_version: "${sc_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_c: $.data.id }
            - call: "POST /prerequisite-overrides"
              payload: { student_id: "${sc}", course_id: "${c_050}", requisite_id: "${req}", justification: "Concurrent reading support arranged.", expires_at: "2026-12-01T00:00:00Z" }
              as: Instructor
              as_user_id: "instructor-1"
              captures: { oc: $.data.id, oc_state0: $.data.state, oc_consumer0: $.data.consumed_by_registration_id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${sc}", section_id: "${secy}", override_id: "${oc}", expected_section_version: "${secy_v0}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1: $.data.id, reg1_prereq: $.data.prerequisite_status }
            - call: "GET /prerequisite-overrides/${oc}"
              payload: {}
              as: Instructor
              as_user_id: "instructor-1"
              captures: { oc_state_pending: $.data.state, oc_consumer_pending: $.data.consumed_by_registration_id }
            - call: "POST /registrations/${reg1}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1_state: $.data.state }
            - call: "GET /prerequisite-overrides/${oc}"
              payload: {}
              as: Instructor
              as_user_id: "instructor-1"
              captures: { oc_state1: $.data.state, oc_consumer1: $.data.consumed_by_registration_id }
            - call: "POST /registrations/${reg1}/grade"
              payload: { final_grade: "A" }
              as: Instructor
              as_user_id: "instructor-1"
              captures: { reg1_graded: $.data.state, reg1_success: $.data.success }
            - call: "GET /prerequisite-overrides/${oc}"
              payload: {}
              as: Instructor
              as_user_id: "instructor-1"
              captures: { oc_state_graded: $.data.state, oc_consumer_graded: $.data.consumed_by_registration_id }
            - call: "GET /registrations"
              payload: { override_id: "${oc}", state: "COMPLETED" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { claimed_first_state: "$.data[0].state", claimed_first_override: "$.data[0].override_id" }
            - call: "POST /registrations/${reg1}/drop"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1_dropped: $.data.state }
            - call: "GET /prerequisite-overrides/${oc}"
              payload: {}
              as: Instructor
              as_user_id: "instructor-1"
              captures: { oc_state2: $.data.state, oc_consumer2: $.data.consumed_by_registration_id }
            - call: "GET /prerequisite-overrides"
              payload: { state: "ISSUED" }
              as: Instructor
              as_user_id: "instructor-1"
              captures: { issued_first_state: "$.data[0].state", issued_first_consumer: "$.data[0].consumed_by_registration_id" }
            - call: "GET /sections/${secy}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secy_v2: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${sc}", section_id: "${secy}", override_id: "${oc}", expected_section_version: "${secy_v2}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2: $.data.id, reg2_prereq: $.data.prerequisite_status }
            - call: "POST /registrations/${reg2}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2_state: $.data.state }
            - call: "GET /prerequisite-overrides/${oc}"
              payload: {}
              as: Instructor
              as_user_id: "instructor-1"
              captures: { oc_state3: $.data.state, oc_consumer3: $.data.consumed_by_registration_id }
          assert:
            - "${oc_state0} == \"ISSUED\" and ${oc_consumer0} == null (setup) — balance 0 == 0"
            - "${reg1_prereq} == \"OVERRIDDEN\" and ${oc_state_pending} == \"ISSUED\" and ${oc_consumer_pending} == null — a PENDING hold does NOT redeem the grant, so the balance is still 0 == 0"
            - "${reg1_state} == \"ENROLLED\" and ${oc_state1} == \"CONSUMED\" and ${oc_consumer1} == \"${reg1}\" — balance 1 == 1"
            - "${reg1_graded} == \"COMPLETED\" and ${reg1_success} == true and ${oc_state_graded} == \"CONSUMED\" and ${oc_consumer_graded} == \"${reg1}\"; ${claimed_first_state} == \"COMPLETED\" and ${claimed_first_override} == \"${oc}\" with total_count 1 — leaving ENROLLED for COMPLETED must NOT disturb the balance, which stays 1 == 1"
            - "COMPENSATION: ${reg1_dropped} == \"DROPPED\", ${oc_state2} == \"ISSUED\", ${oc_consumer2} == null; ${issued_first_state} == \"ISSUED\" and ${issued_first_consumer} == null with total_count 1, while GET /prerequisite-overrides?state=CONSUMED reports total_count 0 — balance back to 0 == 0 and INVARIANT 3 restored"
            - "REUSABILITY: ${reg2_prereq} == \"OVERRIDDEN\" — the released grant is accepted again, so the drop was a real release and not a soft flag; an implementation that leaves OC in CONSUMED answers ERR_OVERRIDE_CONSUMED (409) here"
            - "${reg2_state} == \"ENROLLED\" and ${oc_state3} == \"CONSUMED\" and ${oc_consumer3} == \"${reg2}\" and ${oc_consumer3} != \"${reg1}\" — balance 1 == 1 with the pointer repointed to the NEW row"
            - "at no observation does count(CONSUMED overrides) differ from count(Registration rows with override_id set in ENROLLED or COMPLETED)"
