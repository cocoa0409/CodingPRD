            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "GOLD", extension_months: 24, price_cents: 12000, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE", refund_eligible: true }
              as: WarrantyAdmin
              captures: { gold_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1e@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-A", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_a_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-B", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_b_id: $.data.id }
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_a_id}", coverage_tier_id: "${gold_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_b_id}", coverage_tier_id: "${gold_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
            - call: "POST /proofs"
              payload: { registration_id: "${reg_a_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_a_id: $.data.id }
            - call: "POST /proofs/${proof_a_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /proofs"
              payload: { registration_id: "${reg_b_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_b_id: $.data.id }
            - call: "POST /proofs/${proof_b_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /claims"
              payload: { registration_id: "${reg_a_id}", defect_category: "MANUFACTURING", reported_date: "2025-01-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { claim_a_id: $.data.id }
            - call: "POST /claims"
              payload: { registration_id: "${reg_b_id}", defect_category: "MANUFACTURING", reported_date: "2025-01-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o1_id}"
