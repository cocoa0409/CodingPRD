            - "One OutageEvent per agreement, all detected_at 2026-08-01T00:00:00Z, all triaged to TRIAGED (severity LOW, elapsed 0 minutes)."
            - "Each outage's post-triage version is captured so the OCC field on POST /servicing/truck-rolls can be supplied."
