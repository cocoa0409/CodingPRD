scenario: |
  Generate task harder than expert level!

  2415. Draft & Combine Operations (professional sports league football operations): prospect eligibility determination with declaration deadlines and eligibility waivers, combine invitation selection with medical, testing and interview scheduling across a compressed week, medical evaluation record sharing with clubs under consent and confidentiality rules, draft order determination including lottery, tiebreakers and forfeited picks, trade processing during the draft with pick valuation and conditional pick tracking, selection clock administration with pass, timeout and out-of-order selection rules, compensatory pick formula calculation, undrafted free agent signing window and contract slotting by pick position

domain_name: draft-combine-operations
api_prefix: /draft-ops

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate, polymorphic]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: DraftCycle
    parent: null
    common_fields: true
    fields:
      - name: season_year
        type: integer
        source: input
        description: League season the draft cycle governs
        constraints: "2000..2100"
      - name: declaration_deadline_at
        type: datetime
        source: input
        description: Instant after which a prospect may no longer declare without a LATE_DECLARATION waiver
      - name: combine_week_start_at
        type: datetime
        source: input
        description: Inclusive start of the compressed combine week booking window
      - name: combine_week_end_at
        type: datetime
        source: input
        description: Exclusive end of the compressed combine week booking window
        constraints: "must be strictly after combine_week_start_at"
      - name: draft_start_at
        type: datetime
        source: input
        description: Instant the selection clock may first be started for overall pick 1
        constraints: "must be strictly after combine_week_end_at"
      - name: rounds_count
        type: integer
        source: input
        description: Number of draft rounds this cycle awards
        default: 7
        constraints: "1..7"
      - name: compressed_final_day
        type: boolean
        source: input
        description: When true, CLOCK_COMPRESSION_MINUTES is subtracted from every round clock in rounds 5 and later
        default: false
      - name: status
        type: enum
        source: computed
        description: Lifecycle phase of the cycle; advanced only by the phase endpoint or terminal transitions
        default: SETUP
        constraints: "SETUP | DECLARATION_OPEN | COMBINE_WEEK | ORDER_PENDING | ORDER_FINAL | DRAFT_LIVE | DRAFT_SUSPENDED | DRAFT_COMPLETE | UDFA_WINDOW | CLOSED"
      - name: club_count
        type: integer
        source: computed
        description: COUNT(Club WHERE draft_cycle_id = this.id AND registration_status = REGISTERED)
      - name: lottery_completed
        type: boolean
        source: computed
        description: True once the lottery endpoint has resolved slot assignments for this cycle
        default: false
      - name: lottery_slot_club_ids
        type: array
        source: computed
        description: Ordered Club.id values that won lottery slots 1..LOTTERY_SLOT_COUNT, in slot order; empty until the lottery runs
      - name: order_finalized_at
        type: datetime
        source: computed
        description: Instant the draft order was finalized and DraftPick rows were minted; null before finalize
      - name: current_overall_number
        type: integer
        source: computed
        description: overall_number of the DraftPick with status ON_CLOCK for this cycle, else 0
      - name: udfa_window_close_at
        type: datetime
        source: computed
        description: draft_start_at plus UDFA_WINDOW_HOURS hours; null before the draft order is finalized
      - name: posture
        type: enum
        source: computed
        description: "FROZEN when status in {DRAFT_SUSPENDED, CLOSED}; RESTRICTED when status in {DRAFT_LIVE, DRAFT_COMPLETE, UDFA_WINDOW}; otherwise OPEN"
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: pick_inventory_chart_points
        type: number
        source: computed
        description: SUM(DraftPick.chart_value_points WHERE draft_cycle_id = this.id AND status != FORFEITED), 1 decimal place
      - name: pick_inventory_count
        type: integer
        source: computed
        description: COUNT(DraftPick WHERE draft_cycle_id = this.id AND status != FORFEITED)

  - name: Club
    parent: null
    common_fields: true
    fields:
      - name: draft_cycle_id
        type: string
        source: input
        description: FK -> DraftCycle.id; the cycle this club participates in
      - name: club_code
        type: string
        source: input
        description: Short league club code, unique within the cycle
        constraints: "3 uppercase letters"
      - name: market_name
        type: string
        source: input
        description: Human-readable market name
      - name: registration_status
        type: enum
        source: input
        description: Whether the club counts toward club_count and the draft order
        default: REGISTERED
        constraints: "REGISTERED | WITHDRAWN"
      - name: playoff_qualified
        type: boolean
        source: input
        description: True when the club reached the prior season postseason; playoff clubs are ordered after all non-playoff clubs
        default: false
      - name: playoff_exit_round
        type: integer
        source: input
        description: Postseason round in which the club was eliminated; 0 for non-playoff clubs
        default: 0
        constraints: "0..4"
      - name: prior_season_win_pct
        type: number
        source: input
        description: Prior-season winning percentage, 3 decimal places, ascending order seeds the draft
        constraints: "0.000..1.000"
      - name: strength_of_schedule
        type: number
        source: input
        description: Prior-season strength of schedule, 3 decimal places, first tiebreaker (ascending)
        constraints: "0.000..1.000"
      - name: head_to_head_rank
        type: integer
        source: input
        description: League-published head-to-head rank, second tiebreaker (ascending)
        constraints: ">= 1"
      - name: lottery_combinations
        type: integer
        source: input
        description: Number of lottery combinations assigned to the club; 0 for playoff clubs
        default: 0
        constraints: ">= 0"
      - name: forfeited_round_numbers
        type: array
        source: computed
        description: Round numbers whose picks have been forfeited by league action, ascending
      - name: pre_lottery_rank
        type: integer
        source: computed
        description: 1-based rank among REGISTERED non-playoff clubs by draft_order_ranking seeding; 0 for playoff clubs
      - name: draft_order_index
        type: integer
        source: computed
        description: 1-based final draft order position after the lottery; 0 until the lottery resolves
      - name: rookie_pool_total_cents
        type: integer
        source: input
        description: Total rookie cap pool available to the club in whole cents
        constraints: ">= 0"
      - name: rookie_pool_remaining_cents
        type: integer
        source: computed
        description: rookie_pool_total_cents minus SUM(PlayerContract.first_year_cap_charge_cents WHERE club_id = this.id AND status = SIGNED)
      - name: draft_capital_points
        type: number
        source: computed
        description: "SUM(DraftPick.chart_value_points WHERE owning_club_id = this.id AND status in {PENDING, ON_CLOCK}), 1 decimal place"
      - name: trade_authorization_tier
        type: enum
        source: computed
        description: "FULL when draft_capital_points >= TRADE_TIER_FULL_MIN; LIMITED when >= TRADE_TIER_LIMITED_MIN; otherwise SUSPENDED"
        constraints: "FULL | LIMITED | SUSPENDED"
      - name: timeouts_remaining
        type: integer
        source: computed
        description: Selection-clock timeouts the club may still spend this cycle
        default: 2
      - name: udfa_pool_total_cents
        type: integer
        source: computed
        description: Result of udfa_pool_allocation for this club; 0 before the draft completes
      - name: udfa_pool_remaining_cents
        type: integer
        source: computed
        description: udfa_pool_total_cents minus SUM(PlayerContract.signing_bonus_cents WHERE club_id = this.id AND origin = UDFA AND status in {OFFERED, SIGNED})

  - name: Prospect
    parent: null
    common_fields: true
    fields:
      - name: draft_cycle_id
        type: string
        source: input
        description: FK -> DraftCycle.id; the cycle this prospect is entering
      - name: full_name
        type: string
        source: input
        description: Prospect legal name
      - name: position_group
        type: enum
        source: input
        description: Positional group used for combine invitation scarcity balancing
        constraints: "QB | RB | WR | TE | OL | DL | LB | DB | ST"
      - name: school_code
        type: string
        source: input
        description: Amateur institution code
      - name: seasons_played
        type: integer
        source: input
        description: Completed amateur seasons; fewer than ELIGIBILITY_MIN_SEASONS (3) requires an EARLY_ENTRY waiver
        constraints: "0..6"
      - name: scouting_grade
        type: number
        source: input
        description: League scouting grade, 2 decimal places; descending order drives combine invitation ranking
        constraints: "0.00..100.00"
      - name: position_group_scarcity_rank
        type: integer
        source: input
        description: League scarcity rank of the position group, ascending; first tiebreaker for invitation ranking
        constraints: ">= 1"
      - name: declaration_status
        type: enum
        source: computed
        description: Declaration dimension of the prospect's parallel state
        default: UNDECLARED
        constraints: "UNDECLARED | DECLARED | WITHDRAWN"
      - name: declared_at
        type: datetime
        source: computed
        description: Logical-clock instant the declaration was recorded; null while UNDECLARED
      - name: late_declaration_waived
        type: boolean
        source: computed
        description: True once a LATE_DECLARATION EligibilityWaiver for this prospect reaches GRANTED
        default: false
      - name: early_entry_waived
        type: boolean
        source: computed
        description: True once an EARLY_ENTRY EligibilityWaiver for this prospect reaches GRANTED
        default: false
      - name: eligibility_status
        type: enum
        source: computed
        description: Eligibility dimension of the prospect's parallel state
        default: UNREVIEWED
        constraints: "UNREVIEWED | ELIGIBLE | INELIGIBLE"
      - name: invitation_status
        type: enum
        source: computed
        description: Combine invitation dimension of the prospect's parallel state
        default: NOT_INVITED
        constraints: "NOT_INVITED | INVITED | ACCEPTED | DECLINED | WITHDRAWN"
      - name: consent_status
        type: enum
        source: computed
        description: Medical disclosure consent dimension; cyclic, a revoked consent may be granted again
        default: NONE
        constraints: "NONE | GRANTED | REVOKED"
      - name: consent_scope
        type: enum
        source: computed
        description: Widest MedicalRecordShare scope the current consent permits; null when consent_status != GRANTED
        constraints: "SUMMARY | FULL"
      - name: consent_expires_at
        type: datetime
        source: computed
        description: Instant the current consent lapses; caps every derived share expiry. Null when consent_status != GRANTED
      - name: medical_clearance_status
        type: enum
        source: computed
        description: Combine medical clearance derived from filed evaluations and consent state
        default: PENDING
        constraints: "PENDING | CLEARED | UNVERIFIED | FAILED"
      - name: drafted_pick_overall_number
        type: integer
        source: computed
        description: overall_number of the DraftPick that selected this prospect; 0 while undrafted
      - name: signing_status
        type: enum
        source: computed
        description: Contract dimension of the prospect's parallel state
        default: UNSIGNED
        constraints: "UNSIGNED | OFFER_OUT | SIGNED"

  - name: EligibilityWaiver
    parent: Prospect
    common_fields: true
    fields:
      - name: prospect_id
        type: string
        source: input
        description: FK -> Prospect.id; the prospect requesting relief
      - name: waiver_type
        type: enum
        source: input
        description: Kind of eligibility relief requested
        constraints: "LATE_DECLARATION | EARLY_ENTRY | MEDICAL_HARDSHIP"
      - name: rationale
        type: string
        source: input
        description: Written justification submitted with the request
      - name: status
        type: enum
        source: computed
        description: Committee review state; INFO_REQUESTED returns to UNDER_REVIEW, forming a bounded review loop
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | GRANTED | DENIED | WITHDRAWN"
      - name: info_request_count
        type: integer
        source: computed
        description: Number of REQUEST_INFO actions taken; capped at WAIVER_MAX_INFO_REQUESTS
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProspectAgent that filed the waiver
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilityCommittee member that opened review; null before OPEN_REVIEW
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilityCommittee member that granted or denied; must differ from opened_by_user_id
      - name: decision_note
        type: string
        source: input
        description: Committee note recorded with the GRANT or DENY action
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock instant of the terminal decision

  - name: MedicalStation
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: Facility-level station identifier, globally unique
      - name: exam_type
        type: enum
        source: input
        description: Category of examination the station performs
        constraints: "ORTHO | CARDIAC | IMAGING | NEURO"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: Sanitation and turnaround minutes that inflate every booking interval on both sides for conflict detection
        default: 15
        constraints: "0..60"
      - name: status
        type: enum
        source: input
        description: Whether the station accepts new bookings
        default: AVAILABLE
        constraints: "AVAILABLE | OFFLINE"

  - name: InterviewRoom
    parent: null
    common_fields: true
    fields:
      - name: room_code
        type: string
        source: input
        description: Facility-level interview room identifier, globally unique
      - name: concurrent_capacity
        type: integer
        source: input
        description: Maximum number of active bookings whose intervals overlap this room at any instant
        default: 2
        constraints: "1..8"
      - name: status
        type: enum
        source: input
        description: Whether the room accepts new bookings
        default: AVAILABLE
        constraints: "AVAILABLE | OFFLINE"

  - name: CombineBooking
    parent: null
    common_fields: true
    fields:
      - name: prospect_id
        type: string
        source: input
        description: FK -> Prospect.id; the prospect being scheduled
      - name: booking_type
        type: enum
        source: input
        description: Which combine activity this booking reserves
        constraints: "MEDICAL_EXAM | ON_FIELD_TEST | CLUB_INTERVIEW"
      - name: medical_station_id
        type: string
        source: input
        description: FK -> MedicalStation.id; required when booking_type = MEDICAL_EXAM, forbidden otherwise
      - name: interview_room_id
        type: string
        source: input
        description: FK -> InterviewRoom.id; required when booking_type = CLUB_INTERVIEW, forbidden otherwise
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; required when booking_type = CLUB_INTERVIEW, forbidden otherwise
      - name: starts_at
        type: datetime
        source: input
        description: Inclusive start of the reserved interval
      - name: ends_at
        type: datetime
        source: input
        description: Exclusive end of the reserved interval
        constraints: "must be strictly after starts_at"
      - name: status
        type: enum
        source: computed
        description: Booking lifecycle; only SCHEDULED and CHECKED_IN bookings occupy a resource
        default: SCHEDULED
        constraints: "SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED"
      - name: duration_minutes
        type: integer
        source: computed
        description: Whole minutes between starts_at and ends_at

  - name: MedicalEvaluation
    parent: CombineBooking
    common_fields: true
    fields:
      - name: combine_booking_id
        type: string
        source: input
        description: FK -> CombineBooking.id; the COMPLETED MEDICAL_EXAM booking this evaluation documents
      - name: prospect_id
        type: string
        source: input
        description: FK -> Prospect.id; must equal the booking's prospect_id
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CombineMedicalExaminer that filed the evaluation
      - name: findings_code
        type: string
        source: input
        description: Coded clinical finding summary
      - name: medical_grade
        type: enum
        source: input
        description: Examiner grade that drives confidentiality tier and prospect clearance
        constraints: "PASS | PASS_WITH_NOTE | FAIL_RECHECK | RED_FLAG"
      - name: confidentiality_tier
        type: enum
        source: computed
        description: "RESTRICTED when medical_grade in {FAIL_RECHECK, RED_FLAG}; otherwise STANDARD"
        constraints: "STANDARD | RESTRICTED"
      - name: disclosure_state
        type: enum
        source: computed
        description: SEALED evaluations reject new share requests; an evaluation seals when its last GRANTED share is revoked
        default: DISCLOSABLE
        constraints: "DISCLOSABLE | SEALED"
      - name: active_share_count
        type: integer
        source: computed
        description: COUNT(MedicalRecordShare WHERE medical_evaluation_id = this.id AND status = GRANTED)

  - name: MedicalRecordShare
    parent: MedicalEvaluation
    common_fields: true
    fields:
      - name: medical_evaluation_id
        type: string
        source: input
        description: FK -> MedicalEvaluation.id; the record being shared
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the club requesting access
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the requester
      - name: requested_by_role
        type: enum
        source: system
        description: X-User-Role of the requester, recorded for confidentiality-tier enforcement
        constraints: "ClubGM | ClubMedicalDirector"
      - name: scope
        type: enum
        source: input
        description: Breadth of disclosure requested; may not exceed the prospect's consent_scope
        constraints: "SUMMARY | FULL"
      - name: status
        type: enum
        source: computed
        description: Share lifecycle; a newer REQUESTED share for the same evaluation and club supersedes the prior one
        default: REQUESTED
        constraints: "REQUESTED | GRANTED | DENIED | REVOKED | EXPIRED | SUPERSEDED"
      - name: granted_at
        type: datetime
        source: computed
        description: Logical-clock instant the share was granted; null otherwise
      - name: expires_at
        type: datetime
        source: computed
        description: Result of medical_share_access_window; null until granted
      - name: effective_access
        type: enum
        source: computed
        description: "FULL or SUMMARY when status = GRANTED and current_utc < expires_at; otherwise NONE"
        constraints: "NONE | SUMMARY | FULL"
      - name: denial_reason
        type: string
        source: input
        description: Reason recorded when the share is denied or revoked

  - name: DraftPick
    parent: DraftCycle
    common_fields: true
    fields:
      - name: draft_cycle_id
        type: string
        source: computed
        description: FK -> DraftCycle.id; minted by draft-order finalize, never client-supplied
      - name: owning_club_id
        type: string
        source: computed
        description: FK -> Club.id; current owner, changed by accepted PickTrades
      - name: original_club_id
        type: string
        source: computed
        description: FK -> Club.id; club whose draft slot produced the pick, never changed by trades
      - name: round_number
        type: integer
        source: computed
        description: Round the pick belongs to
        constraints: "1..7"
      - name: pick_in_round
        type: integer
        source: computed
        description: 1-based position within the round
      - name: overall_number
        type: integer
        source: computed
        description: 1-based position across the whole draft; compensatory picks are appended at the end of their round
      - name: is_compensatory
        type: boolean
        source: computed
        description: True for picks minted from awarded CompensatoryClaims
        default: false
      - name: compensatory_sequence
        type: integer
        source: computed
        description: 1-based order among compensatory picks in the same round; 0 for regular picks
        default: 0
      - name: status
        type: enum
        source: computed
        description: Selection lifecycle; PASSED picks may still be used out of order, LAPSED picks feed the UDFA credit pool
        default: PENDING
        constraints: "PENDING | ON_CLOCK | USED | PASSED | FORFEITED | LAPSED"
      - name: chart_value_points
        type: number
        source: computed
        description: Trade-chart value from pick_trade_value_balance, 1 decimal place; set to 0.0 when the pick is FORFEITED
      - name: slot_total_value_cents
        type: integer
        source: computed
        description: slotted_rookie_contract_value total contract value for this pick position
      - name: slot_signing_bonus_cents
        type: integer
        source: computed
        description: slotted_rookie_contract_value signing bonus for this pick position
      - name: slot_first_year_cap_charge_cents
        type: integer
        source: computed
        description: slotted_rookie_contract_value first-year cap charge for this pick position
      - name: slot_total_cap_commitment_cents
        type: integer
        source: computed
        description: slotted_rookie_contract_value total cap commitment for this pick position
      - name: on_clock_started_at
        type: datetime
        source: computed
        description: Logical-clock instant the pick went ON_CLOCK; null otherwise
      - name: deadline_at
        type: datetime
        source: computed
        description: Result of selection_clock_deadline; null unless status = ON_CLOCK
      - name: timeouts_used
        type: integer
        source: computed
        description: Number of timeouts spent extending this pick's clock
        default: 0
      - name: out_of_order_authorized
        type: boolean
        source: computed
        description: True once the league authorized this pick to select while another pick holds the clock
        default: false
      - name: selected_prospect_id
        type: string
        source: computed
        description: FK -> Prospect.id; the prospect selected with this pick, null until used
      - name: selection_source
        type: enum
        source: computed
        description: How the selection was made relative to the clock
        constraints: "ON_TIME | AFTER_PASS | OUT_OF_ORDER"
      - name: pass_reason
        type: enum
        source: computed
        description: Why the pick was passed
        constraints: "VOLUNTARY | EXPIRED"

  - name: PickTrade
    parent: DraftCycle
    common_fields: true
    fields:
      - name: draft_cycle_id
        type: string
        source: input
        description: FK -> DraftCycle.id; cycle the traded picks belong to
      - name: proposing_club_id
        type: string
        source: input
        description: FK -> Club.id; club that opened the negotiation
      - name: receiving_club_id
        type: string
        source: input
        description: FK -> Club.id; counterparty club; must differ from proposing_club_id
      - name: offered_pick_ids
        type: array
        source: input
        description: DraftPick.id values the proposing club sends; each must be PENDING and owned by proposing_club_id
      - name: requested_pick_ids
        type: array
        source: input
        description: DraftPick.id values the proposing club asks for; each must be PENDING and owned by receiving_club_id
      - name: round_index
        type: integer
        source: computed
        description: Number of proposal or counter rounds consumed; capped at TRADE_MAX_NEGOTIATION_ROUNDS
        default: 1
      - name: status
        type: enum
        source: computed
        description: Negotiation dimension of the trade's parallel state
        default: PROPOSED
        constraints: "PROPOSED | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | VOIDED_BY_CAPITAL | RESCINDED"
      - name: last_actor_club_id
        type: string
        source: computed
        description: FK -> Club.id; club that made the most recent proposal or counter, and therefore may not act next
      - name: chart_balance_points
        type: number
        source: computed
        description: Authoritative variant of pick_trade_value_balance from the proposing club's view, 1 decimal place
      - name: imbalance_ratio
        type: number
        source: computed
        description: Absolute chart imbalance divided by the larger side, 4 decimal places; gates acceptance at TRADE_TOLERANCE_RATIO
      - name: surplus_balance_points
        type: number
        source: computed
        description: Advisory market-surplus variant of pick_trade_value_balance, 1 decimal place; never gates acceptance
      - name: conditional_round_number
        type: integer
        source: input
        description: Round of the conditional future pick attached to the trade; null when no condition is attached
        constraints: "1..7"
      - name: conditional_condition_code
        type: enum
        source: input
        description: Event that must occur for the conditional pick to convey
        constraints: "PLAYOFF_BERTH | SNAP_THRESHOLD | PRO_BOWL_SELECTION"
      - name: conditional_probability_tier
        type: enum
        source: computed
        description: "LIKELY for PLAYOFF_BERTH, POSSIBLE for SNAP_THRESHOLD, REMOTE for PRO_BOWL_SELECTION"
        constraints: "LIKELY | POSSIBLE | REMOTE"
      - name: conditional_status
        type: enum
        source: computed
        description: Conditional dimension of the trade's parallel state, independent of the negotiation dimension; set to OPEN at proposal time when a conditional pick is attached
        default: NONE
        constraints: "NONE | OPEN | MET_CONVEYED | UNMET_EXTINGUISHED | DEFERRED | VOID"
      - name: conditional_conveyed_overall_number
        type: integer
        source: computed
        description: overall_number recorded when a conditional pick conveys; 0 otherwise

  - name: CompensatoryClaim
    parent: DraftCycle
    common_fields: true
    fields:
      - name: draft_cycle_id
        type: string
        source: input
        description: FK -> DraftCycle.id; cycle the compensatory formula runs for
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; club claiming or charged for the player movement
      - name: claim_type
        type: enum
        source: input
        description: DEPARTURE claims earn credit; ARRIVAL claims cancel departures one-for-one
        constraints: "DEPARTURE | ARRIVAL"
      - name: player_name
        type: string
        source: input
        description: Player whose movement is claimed
      - name: departed_apy_cents
        type: integer
        source: input
        description: Average per-year contract value of the movement in whole cents
        constraints: ">= 0"
      - name: snap_pct
        type: number
        source: input
        description: Prior-season snap participation share, 2 decimal places
        constraints: "0.00..1.00"
      - name: postseason_honor
        type: enum
        source: input
        description: Highest postseason honor earned, adding a flat bonus to the claim score
        default: NONE
        constraints: "NONE | ALL_CONFERENCE | ALL_LEAGUE"
      - name: status
        type: enum
        source: computed
        description: Verification lifecycle of the claim
        default: SUBMITTED
        constraints: "SUBMITTED | VERIFIED | REJECTED | AWARDED | REJECTED_CAP"
      - name: claim_score
        type: number
        source: computed
        description: Authoritative variant of compensatory_pick_award_score using banded snap factors, 2 decimal places
      - name: advisory_snap_adjusted_score
        type: number
        source: computed
        description: Advisory variant of compensatory_pick_award_score using the raw snap share, 2 decimal places
      - name: qualifies
        type: boolean
        source: computed
        description: True when claim_score >= COMP_QUALIFY_SCORE_MIN
      - name: awarded_round
        type: integer
        source: computed
        description: Round the awarded compensatory pick lands in; 0 until awarded
      - name: awarded_sequence
        type: integer
        source: computed
        description: 1-based order among compensatory awards in the same round; 0 until awarded

  - name: PlayerContract
    parent: Prospect
    common_fields: true
    fields:
      - name: prospect_id
        type: string
        source: input
        description: FK -> Prospect.id; the player being signed
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the signing club
      - name: draft_pick_id
        type: string
        source: input
        description: FK -> DraftPick.id; required when origin = DRAFTED, forbidden when origin = UDFA
      - name: origin
        type: enum
        source: input
        description: Whether the contract is slotted to a draft pick or signed in the undrafted free agent window
        constraints: "DRAFTED | UDFA"
      - name: status
        type: enum
        source: computed
        description: Contract lifecycle; a newer OFFERED contract from the same club supersedes the prior one as LAPSED
        default: OFFERED
        constraints: "OFFERED | SIGNED | VOIDED | LAPSED"
      - name: contract_years
        type: integer
        source: computed
        description: CONTRACT_YEARS_DRAFTED for DRAFTED origin, CONTRACT_YEARS_UDFA for UDFA origin
      - name: total_value_cents
        type: integer
        source: computed
        description: slotted_rookie_contract_value total across contract_years
      - name: signing_bonus_cents
        type: integer
        source: computed
        description: Slotted bonus for DRAFTED contracts; the requested udfa_signing_bonus_cents for UDFA contracts
      - name: first_year_cap_charge_cents
        type: integer
        source: computed
        description: Year-one base plus the year-one prorated share of signing_bonus_cents
      - name: total_cap_commitment_cents
        type: integer
        source: computed
        description: Sum of per-year base values plus the sum of per-year prorated bonus shares, each rounded before summation
      - name: signed_at
        type: datetime
        source: computed
        description: Logical-clock instant the agent countersigned; null while OFFERED

state_machines:
  - entity: DraftCycle
    initial_state: SETUP
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: SETUP
        to: DECLARATION_OPEN
        trigger: "POST /draft-ops/draft-cycles/{id}/phase with target_status=DECLARATION_OPEN"
        actor: LeagueDraftAdmin
        preconditions: ["club_count >= 2"]
        side_effects: ["prospects may now declare", "increments DraftCycle.version by 1"]
      - from: DECLARATION_OPEN
        to: COMBINE_WEEK
        trigger: "POST /draft-ops/draft-cycles/{id}/phase with target_status=COMBINE_WEEK"
        actor: LeagueDraftAdmin
        preconditions: ["at least one Prospect in this cycle has declaration_status = DECLARED"]
        side_effects: ["declaration endpoint stops accepting new declarations", "combine bookings may now be created"]
      - from: COMBINE_WEEK
        to: ORDER_PENDING
        trigger: "POST /draft-ops/draft-cycles/{id}/phase with target_status=ORDER_PENDING"
        actor: LeagueDraftAdmin
        preconditions: ["no CombineBooking for a Prospect in this cycle remains in status SCHEDULED or CHECKED_IN"]
        side_effects: ["every Prospect with eligibility_status = UNREVIEWED is left UNREVIEWED and therefore unselectable"]
      - from: ORDER_PENDING
        to: ORDER_PENDING
        trigger: "POST /draft-ops/draft-cycles/{id}/lottery"
        actor: LeagueDraftAdmin
        preconditions: ["lottery_completed = false", "club_count >= 2", "every drawn combination sequence value is between 1 and the sum of lottery_combinations over REGISTERED non-playoff clubs"]
        side_effects: ["sets lottery_completed = true", "sets lottery_slot_club_ids", "sets Club.pre_lottery_rank and Club.draft_order_index for every REGISTERED club per draft_order_ranking"]
        note: "Self-transition; the lottery changes derived order fields without leaving ORDER_PENDING."
      - from: ORDER_PENDING
        to: ORDER_FINAL
        trigger: "POST /draft-ops/draft-cycles/{id}/draft-order/finalize"
        actor: LeagueDraftAdmin
        preconditions: ["lottery_completed = true", "order_finalized_at is null"]
        side_effects:
          - "mints rounds_count x club_count DraftPick rows in PENDING with computed overall_number, chart_value_points and slot_* values"
          - "for every Club, skips minting the picks whose round_number is in forfeited_round_numbers and instead mints them directly in FORFEITED with chart_value_points 0.0"
          - "runs compensatory_pick_award_score over VERIFIED CompensatoryClaims; awarded claims become AWARDED and mint compensatory DraftPicks appended to the end of their awarded_round; claims blocked by COMP_MAX_AWARDS_PER_CLUB or COMP_LEAGUE_MAX_AWARDS become REJECTED_CAP"
          - "sets order_finalized_at and udfa_window_close_at"
      - from: ORDER_FINAL
        to: DRAFT_LIVE
        trigger: "POST /draft-ops/draft-cycles/{id}/phase with target_status=DRAFT_LIVE"
        actor: LeagueDraftAdmin
        preconditions: ["current_utc >= draft_start_at"]
        side_effects: ["posture becomes RESTRICTED", "no DraftPick is ON_CLOCK until clock/advance runs"]
      - from: DRAFT_LIVE
        to: DRAFT_SUSPENDED
        trigger: "POST /draft-ops/draft-cycles/{id}/phase with target_status=DRAFT_SUSPENDED"
        actor: LeagueDraftAdmin
        preconditions: []
        side_effects: ["posture becomes FROZEN; every selection, trade and clock action is rejected with ERR_CYCLE_FROZEN"]
      - from: DRAFT_SUSPENDED
        to: DRAFT_LIVE
        trigger: "POST /draft-ops/draft-cycles/{id}/phase with target_status=DRAFT_LIVE"
        actor: LeagueDraftAdmin
        preconditions: []
        side_effects: ["posture returns to RESTRICTED; the ON_CLOCK pick keeps its existing deadline_at"]
        note: "Cyclic pair with the previous transition; suspension may repeat any number of times."
      - from: DRAFT_LIVE
        to: DRAFT_COMPLETE
        trigger: "POST /draft-ops/draft-cycles/{id}/clock/advance when no DraftPick in this cycle remains PENDING or ON_CLOCK"
        actor: system
        preconditions: ["every DraftPick in this cycle is in USED, PASSED, FORFEITED or LAPSED"]
        side_effects:
          - "every DraftPick still in PASSED becomes LAPSED"
          - "sets current_overall_number to 0"
      - from: DRAFT_COMPLETE
        to: UDFA_WINDOW
        trigger: "POST /draft-ops/draft-cycles/{id}/phase with target_status=UDFA_WINDOW"
        actor: LeagueDraftAdmin
        preconditions: []
        side_effects:
          - "runs udfa_pool_allocation for every REGISTERED Club and freezes Club.udfa_pool_total_cents"
          - "UDFA PlayerContracts may now be offered"
      - from: UDFA_WINDOW
        to: CLOSED
        trigger: "POST /draft-ops/draft-cycles/{id}/phase with target_status=CLOSED"
        actor: LeagueDraftAdmin
        preconditions: ["current_utc >= udfa_window_close_at"]
        side_effects: ["every PlayerContract still in OFFERED becomes LAPSED", "posture becomes FROZEN permanently"]

  - entity: Prospect
    initial_state: UNDECLARED
    terminal_states: [INELIGIBLE, SIGNED]
    shape: parallel
    parallel_dimensions: [declaration_status, eligibility_status, invitation_status, consent_status, signing_status]
    transitions:
      - state_field: declaration_status
        from: UNDECLARED
        to: DECLARED
        trigger: "POST /draft-ops/prospects/{id}/declaration with action=DECLARE"
        actor: ProspectAgent
        preconditions: ["cycle.status = DECLARATION_OPEN", "current_utc <= cycle.declaration_deadline_at OR late_declaration_waived = true"]
        side_effects: ["sets declared_at to current_utc"]
      - state_field: declaration_status
        from: DECLARED
        to: WITHDRAWN
        trigger: "POST /draft-ops/prospects/{id}/declaration with action=WITHDRAW"
        actor: ProspectAgent
        preconditions: ["cycle.status in {DECLARATION_OPEN, COMBINE_WEEK}", "signing_status = UNSIGNED"]
        side_effects: ["eligibility_status becomes INELIGIBLE", "every SCHEDULED CombineBooking for this prospect becomes CANCELLED"]
      - state_field: eligibility_status
        from: UNREVIEWED
        to: ELIGIBLE
        trigger: "POST /draft-ops/prospects/{id}/eligibility-determination with action=DECLARE_ELIGIBLE"
        actor: EligibilityCommittee
        preconditions: ["declaration_status = DECLARED", "seasons_played >= ELIGIBILITY_MIN_SEASONS (3) OR early_entry_waived = true"]
        side_effects: ["prospect becomes selectable once medical_clearance_status is not FAILED"]
      - state_field: eligibility_status
        from: UNREVIEWED
        to: INELIGIBLE
        trigger: "POST /draft-ops/prospects/{id}/eligibility-determination with action=DECLARE_INELIGIBLE"
        actor: EligibilityCommittee
        preconditions: ["declaration_status in {DECLARED, WITHDRAWN}"]
        side_effects: ["invitation_status becomes WITHDRAWN when it was INVITED or ACCEPTED", "every SCHEDULED CombineBooking for this prospect becomes CANCELLED"]
      - state_field: eligibility_status
        from: ELIGIBLE
        to: INELIGIBLE
        trigger: "POST /draft-ops/prospects/{id}/eligibility-determination with action=DECLARE_INELIGIBLE"
        actor: EligibilityCommittee
        preconditions: ["drafted_pick_overall_number = 0"]
        side_effects: ["invitation_status becomes WITHDRAWN when it was INVITED or ACCEPTED"]
      - state_field: invitation_status
        from: NOT_INVITED
        to: INVITED
        trigger: "POST /draft-ops/prospects/{id}/combine-invitation with action=INVITE, or the combine-invitations/select selector"
        actor: LeagueDraftAdmin
        preconditions: ["cycle.status in {DECLARATION_OPEN, COMBINE_WEEK}", "eligibility_status != INELIGIBLE", "declaration_status = DECLARED"]
        side_effects: []
      - state_field: invitation_status
        from: INVITED
        to: ACCEPTED
        trigger: "POST /draft-ops/prospects/{id}/combine-invitation with action=ACCEPT"
        actor: ProspectAgent
        preconditions: ["cycle.status in {DECLARATION_OPEN, COMBINE_WEEK}"]
        side_effects: ["bookings may now be created for this prospect"]
      - state_field: invitation_status
        from: INVITED
        to: DECLINED
        trigger: "POST /draft-ops/prospects/{id}/combine-invitation with action=DECLINE"
        actor: ProspectAgent
        preconditions: []
        side_effects: ["medical_clearance_status becomes UNVERIFIED"]
      - state_field: invitation_status
        from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /draft-ops/prospects/{id}/combine-invitation with action=WITHDRAW"
        actor: LeagueDraftAdmin
        preconditions: []
        side_effects: ["every SCHEDULED CombineBooking for this prospect becomes CANCELLED", "medical_clearance_status becomes UNVERIFIED"]
      - state_field: consent_status
        from: NONE
        to: GRANTED
        trigger: "POST /draft-ops/prospects/{id}/consent with action=GRANT"
        actor: ProspectAgent
        preconditions: ["declaration_status = DECLARED", "consent_expires_at is strictly after current_utc"]
        side_effects: ["sets consent_scope and consent_expires_at"]
      - state_field: consent_status
        from: GRANTED
        to: REVOKED
        trigger: "POST /draft-ops/prospects/{id}/consent with action=REVOKE"
        actor: ProspectAgent
        preconditions: []
        side_effects:
          - "every MedicalRecordShare in GRANTED for an evaluation of this prospect becomes REVOKED"
          - "each affected MedicalEvaluation recomputes active_share_count and becomes SEALED when it reaches 0"
          - "when every MedicalEvaluation of this prospect is SEALED, medical_clearance_status becomes UNVERIFIED because no club can verify the file"
          - "because medical_clearance_status left CLEARED, every PlayerContract for this prospect still in OFFERED becomes LAPSED and signing_status returns to UNSIGNED"
          - "clears consent_scope and consent_expires_at"
      - state_field: consent_status
        from: REVOKED
        to: GRANTED
        trigger: "POST /draft-ops/prospects/{id}/consent with action=GRANT"
        actor: ProspectAgent
        preconditions: ["consent_expires_at is strictly after current_utc"]
        side_effects: ["sets consent_scope and consent_expires_at", "previously REVOKED shares are NOT reinstated"]
        note: "Cyclic dimension: consent may be granted, revoked and granted again without bound."
      - state_field: medical_clearance_status
        from: PENDING
        to: CLEARED
        trigger: "POST /draft-ops/medical-evaluations with medical_grade in {PASS, PASS_WITH_NOTE}"
        actor: CombineMedicalExaminer
        preconditions: ["the referenced CombineBooking is COMPLETED and of booking_type MEDICAL_EXAM"]
        side_effects: []
      - state_field: medical_clearance_status
        from: PENDING
        to: FAILED
        trigger: "POST /draft-ops/medical-evaluations with medical_grade = RED_FLAG"
        actor: CombineMedicalExaminer
        preconditions: ["the referenced CombineBooking is COMPLETED and of booking_type MEDICAL_EXAM"]
        side_effects: ["prospect becomes unselectable with ERR_PROSPECT_NOT_SELECTABLE"]
      - state_field: signing_status
        from: UNSIGNED
        to: OFFER_OUT
        trigger: "POST /draft-ops/player-contracts"
        actor: ClubGM
        preconditions: ["expected_prospect_version matches Prospect.version"]
        side_effects: ["increments Prospect.version by 1"]
      - state_field: signing_status
        from: OFFER_OUT
        to: SIGNED
        trigger: "POST /draft-ops/player-contracts/{id}/status with action=SIGN"
        actor: ProspectAgent
        preconditions: ["the contract is OFFERED"]
        side_effects: ["recomputes Club.rookie_pool_remaining_cents"]
      - state_field: signing_status
        from: OFFER_OUT
        to: UNSIGNED
        trigger: "POST /draft-ops/player-contracts/{id}/status with action=VOID"
        actor: ClubGM
        preconditions: ["the contract is OFFERED"]
        side_effects: []

  - entity: EligibilityWaiver
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /draft-ops/eligibility-waivers/{id}/review with action=OPEN_REVIEW"
        actor: EligibilityCommittee
        preconditions: ["the acting X-User-ID differs from submitted_by_user_id"]
        side_effects: ["records opened_by_user_id"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /draft-ops/eligibility-waivers/{id}/review with action=REQUEST_INFO"
        actor: EligibilityCommittee
        preconditions: ["info_request_count < WAIVER_MAX_INFO_REQUESTS"]
        side_effects: ["increments info_request_count by 1"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /draft-ops/eligibility-waivers/{id}/review with action=OPEN_REVIEW"
        actor: EligibilityCommittee
        preconditions: []
        side_effects: ["records opened_by_user_id"]
        note: "Bounded review loop: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW, at most WAIVER_MAX_INFO_REQUESTS times."
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /draft-ops/eligibility-waivers/{id}/review with action=GRANT"
        actor: EligibilityCommittee
        preconditions: ["the acting X-User-ID differs from opened_by_user_id", "decision_note is present"]
        side_effects:
          - "sets Prospect.late_declaration_waived = true when waiver_type = LATE_DECLARATION"
          - "sets Prospect.early_entry_waived = true when waiver_type = EARLY_ENTRY"
          - "sets decided_by_user_id and decided_at"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /draft-ops/eligibility-waivers/{id}/review with action=DENY"
        actor: EligibilityCommittee
        preconditions: ["the acting X-User-ID differs from opened_by_user_id", "decision_note is present"]
        side_effects: ["sets decided_by_user_id and decided_at"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /draft-ops/eligibility-waivers/{id}/review with action=WITHDRAW"
        actor: ProspectAgent
        preconditions: ["the acting X-User-ID equals Prospect.id of prospect_id"]
        side_effects: []

  - entity: CombineBooking
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /draft-ops/combine-bookings/{id}/status with action=CHECK_IN"
        actor: LeagueDraftAdmin
        preconditions: ["cycle.status = COMBINE_WEEK", "current_utc >= starts_at minus BOOKING_CHECKIN_LEAD_MINUTES (30) minutes"]
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /draft-ops/combine-bookings/{id}/status with action=COMPLETE"
        actor: LeagueDraftAdmin
        preconditions: []
        side_effects: ["the resource interval is released; a MedicalEvaluation may now be filed for MEDICAL_EXAM bookings"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /draft-ops/combine-bookings/{id}/status with action=MARK_NO_SHOW"
        actor: LeagueDraftAdmin
        preconditions: ["current_utc >= ends_at"]
        side_effects: ["Prospect.medical_clearance_status becomes UNVERIFIED when booking_type = MEDICAL_EXAM"]
      - from: CHECKED_IN
        to: NO_SHOW
        trigger: "POST /draft-ops/combine-bookings/{id}/status with action=MARK_NO_SHOW"
        actor: LeagueDraftAdmin
        preconditions: ["current_utc >= ends_at"]
        side_effects: ["Prospect.medical_clearance_status becomes UNVERIFIED when booking_type = MEDICAL_EXAM"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /draft-ops/combine-bookings/{id}/status with action=CANCEL, or a cascade from prospect withdrawal or ineligibility"
        actor: LeagueDraftAdmin
        preconditions: []
        side_effects: ["the resource interval is released and no longer blocks new bookings"]

  - entity: MedicalRecordShare
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED, SUPERSEDED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /draft-ops/medical-record-shares/{id}/decision with action=GRANT"
        actor: LeagueDraftAdmin
        preconditions: ["Prospect.consent_status = GRANTED", "the evaluation is DISCLOSABLE", "scope does not exceed Prospect.consent_scope"]
        side_effects: ["sets granted_at and expires_at per medical_share_access_window", "increments MedicalEvaluation.active_share_count by 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /draft-ops/medical-record-shares/{id}/decision with action=DENY"
        actor: LeagueDraftAdmin
        preconditions: ["denial_reason is present"]
        side_effects: []
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "POST /draft-ops/medical-record-shares creating a newer request for the same medical_evaluation_id and club_id"
        actor: system
        preconditions: []
        side_effects: []
      - from: GRANTED
        to: REVOKED
        trigger: "POST /draft-ops/medical-record-shares/{id}/decision with action=REVOKE, or a cascade from consent revocation"
        actor: LeagueDraftAdmin
        preconditions: ["denial_reason is present when the action is called directly"]
        side_effects:
          - "decrements MedicalEvaluation.active_share_count by 1"
          - "MedicalEvaluation.disclosure_state becomes SEALED when active_share_count reaches 0"
      - from: GRANTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock to or past expires_at"
        actor: system
        preconditions: ["expires_at <= the new current_utc"]
        side_effects: ["decrements MedicalEvaluation.active_share_count by 1", "effective_access becomes NONE"]

  - entity: DraftPick
    initial_state: PENDING
    terminal_states: [USED, FORFEITED, LAPSED]
    shape: branching
    transitions:
      - from: PENDING
        to: ON_CLOCK
        trigger: "POST /draft-ops/draft-cycles/{id}/clock/advance"
        actor: system
        preconditions: ["cycle.status = DRAFT_LIVE", "no other DraftPick in the cycle is ON_CLOCK", "this pick has the lowest overall_number among PENDING picks"]
        side_effects: ["sets on_clock_started_at", "computes deadline_at per selection_clock_deadline", "sets cycle.current_overall_number"]
      - from: PENDING
        to: PENDING
        trigger: "POST /draft-ops/draft-picks/{id}/clock-action with action=AUTHORIZE_OUT_OF_ORDER"
        actor: LeagueDraftAdmin
        preconditions: ["cycle.status = DRAFT_LIVE", "out_of_order_authorized = false"]
        side_effects: ["sets out_of_order_authorized = true"]
      - from: ON_CLOCK
        to: ON_CLOCK
        trigger: "POST /draft-ops/draft-picks/{id}/clock-action with action=TIMEOUT"
        actor: ClubGM
        preconditions: ["cycle.status = DRAFT_LIVE", "current_utc < deadline_at", "owning club timeouts_remaining > 0"]
        side_effects: ["extends deadline_at by TIMEOUT_EXTENSION_MINUTES", "increments timeouts_used by 1", "decrements Club.timeouts_remaining by 1"]
      - from: ON_CLOCK
        to: USED
        trigger: "POST /draft-ops/draft-picks/{id}/selections"
        actor: ClubGM
        preconditions: ["cycle.status = DRAFT_LIVE", "current_utc < deadline_at", "owning_club_id equals the acting club", "the prospect is ELIGIBLE, not INELIGIBLE, medical_clearance_status != FAILED and undrafted"]
        side_effects:
          - "sets selected_prospect_id and selection_source = ON_TIME"
          - "sets Prospect.drafted_pick_overall_number"
          - "recomputes Club.draft_capital_points and trade_authorization_tier"
          - "puts the next PENDING pick ON_CLOCK with on_clock_started_at = current_utc"
      - from: PASSED
        to: USED
        trigger: "POST /draft-ops/draft-picks/{id}/selections"
        actor: ClubGM
        preconditions: ["cycle.status = DRAFT_LIVE", "owning_club_id equals the acting club", "the prospect is selectable"]
        side_effects: ["sets selection_source = AFTER_PASS", "sets Prospect.drafted_pick_overall_number", "clears pass_reason"]
        note: "A passed pick is not lost; its club may still use it any time before the draft completes."
      - from: PENDING
        to: USED
        trigger: "POST /draft-ops/draft-picks/{id}/selections with out_of_order_ack=true"
        actor: ClubGM
        preconditions: ["cycle.status = DRAFT_LIVE", "out_of_order_authorized = true", "another pick currently holds the clock"]
        side_effects: ["sets selection_source = OUT_OF_ORDER", "the ON_CLOCK pick keeps its deadline_at unchanged"]
      - from: ON_CLOCK
        to: PASSED
        trigger: "POST /draft-ops/draft-picks/{id}/clock-action with action=PASS"
        actor: ClubGM
        preconditions: ["cycle.status = DRAFT_LIVE", "current_utc < deadline_at"]
        side_effects: ["sets pass_reason = VOLUNTARY", "puts the next PENDING pick ON_CLOCK with on_clock_started_at = current_utc"]
      - from: ON_CLOCK
        to: PASSED
        trigger: "POST /draft-ops/draft-cycles/{id}/clock/advance when current_utc >= deadline_at"
        actor: system
        preconditions: ["cycle.status = DRAFT_LIVE", "current_utc >= deadline_at"]
        side_effects:
          - "sets pass_reason = EXPIRED"
          - "puts the next PENDING pick ON_CLOCK with on_clock_started_at = the expired pick's deadline_at, so the clock cascades within a single advance call"
      - from: PENDING
        to: FORFEITED
        trigger: "POST /draft-ops/draft-picks/{id}/clock-action with action=FORFEIT"
        actor: LeagueDraftAdmin
        preconditions: ["cycle.status in {ORDER_FINAL, DRAFT_LIVE}"]
        side_effects:
          - "sets chart_value_points = 0.0"
          - "appends round_number to Club.forfeited_round_numbers of original_club_id"
          - "recomputes owning Club.draft_capital_points and trade_authorization_tier"
          - "every PickTrade of the owning club still in PROPOSED or COUNTERED becomes VOIDED_BY_CAPITAL when the tier falls to SUSPENDED"
          - "recomputes DraftCycle.pick_inventory_chart_points and pick_inventory_count"
      - from: PASSED
        to: LAPSED
        trigger: "the DRAFT_LIVE -> DRAFT_COMPLETE transition"
        actor: system
        preconditions: []
        side_effects: ["slot_first_year_cap_charge_cents becomes part of the owning club's udfa_pool_allocation credit base"]

  - entity: PickTrade
    initial_state: PROPOSED
    terminal_states: [REJECTED, WITHDRAWN, VOIDED_BY_CAPITAL, RESCINDED]
    shape: cyclic
    parallel_dimensions: [status, conditional_status]
    transitions:
      - state_field: status
        from: PROPOSED
        to: COUNTERED
        trigger: "POST /draft-ops/pick-trades/{id}/counter"
        actor: ClubGM
        preconditions: ["the acting club is not last_actor_club_id", "round_index < TRADE_MAX_NEGOTIATION_ROUNDS", "the acting club's trade_authorization_tier != SUSPENDED"]
        side_effects: ["increments round_index by 1", "replaces offered_pick_ids and requested_pick_ids", "recomputes chart_balance_points, imbalance_ratio and surplus_balance_points", "sets last_actor_club_id to the acting club"]
      - state_field: status
        from: COUNTERED
        to: COUNTERED
        trigger: "POST /draft-ops/pick-trades/{id}/counter"
        actor: ClubGM
        preconditions: ["the acting club is not last_actor_club_id", "round_index < TRADE_MAX_NEGOTIATION_ROUNDS"]
        side_effects: ["increments round_index by 1", "recomputes the balance fields"]
        note: "Cyclic negotiation loop bounded by TRADE_MAX_NEGOTIATION_ROUNDS."
      - state_field: status
        from: PROPOSED
        to: ACCEPTED
        trigger: "POST /draft-ops/pick-trades/{id}/accept"
        actor: ClubGM
        preconditions:
          - "the acting club is not last_actor_club_id"
          - "cycle.posture != FROZEN"
          - "both clubs' trade_authorization_tier != SUSPENDED"
          - "imbalance_ratio <= TRADE_TOLERANCE_RATIO"
          - "every offered and requested pick is still PENDING and still owned by its declared side"
        side_effects:
          - "swaps owning_club_id on every offered and requested DraftPick"
          - "recomputes draft_capital_points and trade_authorization_tier for both clubs"
          - "leaves the conditional dimension untouched; it was already set to OPEN at proposal time when a condition was attached"
      - state_field: status
        from: COUNTERED
        to: ACCEPTED
        trigger: "POST /draft-ops/pick-trades/{id}/accept"
        actor: ClubGM
        preconditions: ["same as the PROPOSED -> ACCEPTED preconditions"]
        side_effects: ["same as the PROPOSED -> ACCEPTED side effects"]
      - state_field: status
        from: PROPOSED
        to: REJECTED
        trigger: "POST /draft-ops/pick-trades/{id}/termination with action=REJECT"
        actor: ClubGM
        preconditions: ["the acting club is not last_actor_club_id"]
        side_effects: []
      - state_field: status
        from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /draft-ops/pick-trades/{id}/termination with action=WITHDRAW"
        actor: ClubGM
        preconditions: ["the acting club is last_actor_club_id"]
        side_effects: []
      - state_field: status
        from: COUNTERED
        to: REJECTED
        trigger: "POST /draft-ops/pick-trades/{id}/termination with action=REJECT"
        actor: ClubGM
        preconditions: ["the acting club is not last_actor_club_id"]
        side_effects: []
      - state_field: status
        from: PROPOSED
        to: VOIDED_BY_CAPITAL
        trigger: "a FORFEIT that drops either club's trade_authorization_tier to SUSPENDED"
        actor: system
        preconditions: []
        side_effects: ["conditional_status becomes VOID when it was OPEN"]
      - state_field: status
        from: COUNTERED
        to: VOIDED_BY_CAPITAL
        trigger: "a FORFEIT that drops either club's trade_authorization_tier to SUSPENDED"
        actor: system
        preconditions: []
        side_effects: ["conditional_status becomes VOID when it was OPEN"]
      - state_field: status
        from: ACCEPTED
        to: RESCINDED
        trigger: "POST /draft-ops/pick-trades/{id}/termination with action=RESCIND"
        actor: LeagueDraftAdmin
        preconditions: ["every traded pick is still PENDING", "reason is present"]
        side_effects:
          - "restores owning_club_id on every traded DraftPick to the pre-acceptance owner"
          - "recomputes draft_capital_points and trade_authorization_tier for both clubs"
          - "conditional_status becomes VOID when it was OPEN"
        note: "Compensating transition: DraftCycle.pick_inventory_chart_points is identical before acceptance and after rescission."
      - state_field: conditional_status
        from: OPEN
        to: MET_CONVEYED
        trigger: "POST /draft-ops/pick-trades/{id}/conditional-resolution with condition_satisfied=true"
        actor: LeagueDraftAdmin
        preconditions: ["status = ACCEPTED", "conditional_probability_tier != REMOTE"]
        side_effects: ["sets conditional_conveyed_overall_number to the highest overall_number of the traded picks"]
      - state_field: conditional_status
        from: OPEN
        to: DEFERRED
        trigger: "POST /draft-ops/pick-trades/{id}/conditional-resolution with condition_satisfied=true"
        actor: LeagueDraftAdmin
        preconditions: ["status = ACCEPTED", "conditional_probability_tier = REMOTE"]
        side_effects: ["the conditional pick rolls to the following cycle and conditional_conveyed_overall_number stays 0"]
      - state_field: conditional_status
        from: OPEN
        to: UNMET_EXTINGUISHED
        trigger: "POST /draft-ops/pick-trades/{id}/conditional-resolution with condition_satisfied=false"
        actor: LeagueDraftAdmin
        preconditions: ["status = ACCEPTED"]
        side_effects: []

  - entity: CompensatoryClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, AWARDED, REJECTED_CAP]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /draft-ops/compensatory-claims/{id}/verify with action=VERIFY"
        actor: LeagueDraftAdmin
        preconditions: ["cycle.status in {COMBINE_WEEK, ORDER_PENDING}"]
        side_effects: ["freezes claim_score and advisory_snap_adjusted_score"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /draft-ops/compensatory-claims/{id}/verify with action=REJECT"
        actor: LeagueDraftAdmin
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: AWARDED
        trigger: "the ORDER_PENDING -> ORDER_FINAL finalize transition"
        actor: system
        preconditions: ["claim_type = DEPARTURE", "qualifies = true", "the claim is within COMP_MAX_AWARDS_PER_CLUB and COMP_LEAGUE_MAX_AWARDS after arrival cancellation"]
        side_effects: ["sets awarded_round and awarded_sequence", "mints a compensatory DraftPick appended to the end of awarded_round"]
      - from: VERIFIED
        to: REJECTED_CAP
        trigger: "the ORDER_PENDING -> ORDER_FINAL finalize transition"
        actor: system
        preconditions: ["qualifies = false, or the club or league award cap is already exhausted, or the claim was cancelled by an ARRIVAL claim"]
        side_effects: []

  - entity: PlayerContract
    initial_state: OFFERED
    terminal_states: [VOIDED, LAPSED]
    shape: branching
    transitions:
      - from: OFFERED
        to: SIGNED
        trigger: "POST /draft-ops/player-contracts/{id}/status with action=SIGN"
        actor: ProspectAgent
        preconditions: ["the acting X-User-ID equals prospect_id", "cycle.posture != FROZEN", "for UDFA origin, current_utc < cycle.udfa_window_close_at"]
        side_effects: ["sets signed_at", "sets Prospect.signing_status = SIGNED", "recomputes Club.rookie_pool_remaining_cents"]
      - from: OFFERED
        to: VOIDED
        trigger: "POST /draft-ops/player-contracts/{id}/status with action=VOID"
        actor: ClubGM
        preconditions: ["the acting club equals club_id"]
        side_effects: ["sets Prospect.signing_status = UNSIGNED"]
      - from: SIGNED
        to: VOIDED
        trigger: "POST /draft-ops/player-contracts/{id}/status with action=VOID"
        actor: ClubGM
        preconditions: ["the acting club equals club_id"]
        side_effects: ["sets Prospect.signing_status = UNSIGNED", "restores Club.rookie_pool_remaining_cents to its pre-signing value"]
        note: "Compensating transition: rookie_pool_remaining_cents plus the SIGNED first-year charges always equals rookie_pool_total_cents."
      - from: OFFERED
        to: LAPSED
        trigger: "a newer OFFERED contract from the same club for the same prospect, a consent revocation, or the UDFA_WINDOW -> CLOSED transition"
        actor: system
        preconditions: []
        side_effects: ["sets Prospect.signing_status = UNSIGNED unless a SIGNED contract exists"]

concurrency_rules:
  - rule_id: contract-offer-stale-prospect
    parent_entity: Prospect
    write_endpoint: "POST /draft-ops/player-contracts"
    occ_field: "expected_prospect_version"
    description: |
      Offering a PlayerContract against a Prospect whose version has advanced
      since the client last read it is rejected. A club's new OFFERED contract
      legitimately supersedes that club's prior OFFERED contract for the same
      prospect, so a stale-version check is the only deterministic way to stop a
      writer holding an outdated view of the prospect from overwriting an offer
      it never saw.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: share-request-stale-evaluation
    parent_entity: MedicalEvaluation
    write_endpoint: "POST /draft-ops/medical-record-shares"
    occ_field: "expected_medical_evaluation_version"
    description: |
      Requesting a MedicalRecordShare against a MedicalEvaluation whose version
      has advanced since the requester last read it is rejected. A newer request
      for the same evaluation and club legitimately supersedes the prior
      REQUESTED share, so the stale-version check prevents a requester with an
      outdated view of the evaluation's disclosure state from superseding a
      request it never observed.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

calculations:
  - name: draft_order_ranking
    trigger: "POST /draft-ops/draft-cycles/{id}/lottery"
    algorithm: chronological
    formula: |
      # Step 1 - seed the non-playoff pool (pre_lottery_rank)
      non_playoff = [c for c in Club
                     if c.draft_cycle_id == cycle.id
                     and c.registration_status == REGISTERED
                     and c.playoff_qualified == false]
      sort non_playoff by (prior_season_win_pct ASC,
                           strength_of_schedule ASC,
                           head_to_head_rank ASC,
                           created_at ASC)
      for i, c in enumerate(non_playoff): c.pre_lottery_rank = i + 1

      # Step 2 - assign contiguous combination ranges in pre_lottery_rank order
      cursor = 1
      for c in non_playoff (pre_lottery_rank ASC):
          c.range = [cursor, cursor + c.lottery_combinations - 1]
          cursor += c.lottery_combinations
      total_combinations = cursor - 1

      # Step 3 - resolve the drawn sequence into lottery slots
      LOTTERY_SLOT_COUNT = min(LOTTERY_SLOT_CAP, len(non_playoff))
      slots = []
      for v in drawn_combination_sequence:            # order given by the caller
          if len(slots) == LOTTERY_SLOT_COUNT: break
          owner = the club whose range contains v     # ranges are disjoint
          if owner in slots: continue                 # duplicate draw is skipped
          slots.append(owner)
      cycle.lottery_slot_club_ids = [c.id for c in slots]

      # Step 4 - build the final order
      order = list(slots)
      for c in non_playoff (pre_lottery_rank ASC):
          if c not in order: order.append(c)
      playoff = [c for c in Club
                 if c.draft_cycle_id == cycle.id
                 and c.registration_status == REGISTERED
                 and c.playoff_qualified == true]
      sort playoff by (playoff_exit_round ASC,
                       prior_season_win_pct ASC,
                       strength_of_schedule ASC,
                       created_at ASC)
      order += playoff
      for i, c in enumerate(order): c.draft_order_index = i + 1
    input_set: "Club rows with registration_status = REGISTERED for the cycle; WITHDRAWN clubs are excluded from both pools and receive draft_order_index 0"
    constants:
      LOTTERY_SLOT_CAP: 4
    precision: "integer ranks; win_pct and strength_of_schedule compared at 3 decimal places"
    note: "Deterministic: the only ordering inputs are declared business fields plus created_at. Club.id is never consulted."

  - name: combine_invitation_selection
    trigger: "POST /draft-ops/draft-cycles/{id}/combine-invitations/select"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter
      pool = [p for p in Prospect
              if p.draft_cycle_id == cycle.id
              and p.declaration_status == DECLARED
              and p.eligibility_status != INELIGIBLE
              and p.invitation_status == NOT_INVITED]
      # (b) ranking expression
      sort pool by (scouting_grade DESC,
      # (c) tie-break chain
                    position_group_scarcity_rank ASC,
                    created_at ASC)
      chosen = pool[0 : target_count]
      for p in chosen: p.invitation_status = INVITED
      # (d) empty-pool fallback
      if len(pool) == 0: reject with ERR_NO_ELIGIBLE_PROSPECTS (422)
      # when 0 < len(pool) < target_count the whole pool is invited and the
      # response reports invited_count = len(pool)
    input_set: "Only DECLARED, non-INELIGIBLE, NOT_INVITED prospects of this cycle; already-INVITED prospects are never re-selected"
    constants:
      INVITATION_MAX_TARGET_COUNT: 320
    precision: "scouting_grade compared at 2 decimal places"

  - name: slotted_rookie_contract_value
    trigger: "the ORDER_PENDING -> ORDER_FINAL finalize transition (per DraftPick) and POST /draft-ops/player-contracts (per PlayerContract)"
    algorithm: tiered_pricing
    formula: |
      # base year-one value from the pick's slot
      base_year1 = ROUND_BASE_CENTS[round_number]
                   - SLOT_DECREMENT_CENTS[round_number] * (pick_in_round - 1)
      year1 = max(base_year1, MIN_YEAR1_CENTS)

      # per-year escalated base values, ROUNDED PER YEAR then summed
      years = []
      v = year1
      for y in 1..contract_years:
          years.append(round_half_up(v))          # whole cents, per year
          v = round_half_up(v) * (1 + ESCALATOR_PCT)
      total_value_cents = sum(years)

      # signing bonus
      if origin == DRAFTED:
          signing_bonus_cents = round_half_up(total_value_cents
                                              * BONUS_SHARE_PCT[round_number])
      else:  # UDFA
          signing_bonus_cents = udfa_signing_bonus_cents (client-supplied)

      # PINNED ROUNDING ORDER: prorate per year, round each year, THEN sum.
      # Do NOT compute total_cap_commitment as total_value + signing_bonus.
      bonus_per_year = round_half_up(signing_bonus_cents / contract_years)
      first_year_cap_charge_cents = years[0] + bonus_per_year
      total_cap_commitment_cents  = total_value_cents
                                    + bonus_per_year * contract_years
    input_set: "One DraftPick position (round_number, pick_in_round) for slot values; PlayerContract.origin selects contract_years and the bonus source"
    constants:
      ROUND_BASE_CENTS: { 1: 120000000, 2: 100000000, 3: 92000000, 4: 88000000, 5: 85000000, 6: 82000000, 7: 80000000 }
      SLOT_DECREMENT_CENTS: { 1: 2000000, 2: 800000, 3: 400000, 4: 200000, 5: 120000, 6: 80000, 7: 40000 }
      MIN_YEAR1_CENTS: 79500000
      ESCALATOR_PCT: 0.0425
      CONTRACT_YEARS_DRAFTED: 4
      CONTRACT_YEARS_UDFA: 3
      BONUS_SHARE_PCT: { 1: 0.60, 2: 0.40, 3: 0.25, 4: 0.15, 5: 0.10, 6: 0.08, 7: 0.05 }
    precision: "whole cents, round_half_up, applied per year BEFORE summation; the pinned order makes total_cap_commitment_cents differ from total_value_cents + signing_bonus_cents by up to contract_years cents"
    note: "UDFA contracts use MIN_YEAR1_CENTS as year one because no pick slot exists; contract_years = CONTRACT_YEARS_UDFA."

  - name: pick_trade_value_balance
    trigger: "POST /draft-ops/pick-trades, POST /draft-ops/pick-trades/{id}/counter, and the ORDER_PENDING -> ORDER_FINAL finalize transition (for chart_value_points)"
    algorithm: threshold
    formula: |
      # per-pick chart value, minted at finalize
      chart_value_points = round_half_up(
          CHART_ROUND_BASE[round_number] * (CHART_DECAY ** (pick_in_round - 1)), 1)
      # a FORFEITED pick's chart_value_points is forced to 0.0

      incoming = sum(chart_value_points of requested_pick_ids)
      outgoing = sum(chart_value_points of offered_pick_ids)
      chart_balance_points = round_half_up(incoming - outgoing, 1)
      imbalance_ratio = round_half_up(
          abs(chart_balance_points) / max(incoming, outgoing, 1.0), 4)
      # acceptance gate (inclusive at the boundary)
      accept_allowed = imbalance_ratio <= TRADE_TOLERANCE_RATIO
    input_set: "DraftPicks named in offered_pick_ids and requested_pick_ids, each of which must be PENDING; FORFEITED, USED, PASSED and LAPSED picks may not appear"
    constants:
      CHART_ROUND_BASE: { 1: 1000.0, 2: 420.0, 3: 250.0, 4: 150.0, 5: 90.0, 6: 50.0, 7: 25.0 }
      CHART_DECAY: 0.94
      TRADE_TOLERANCE_RATIO: 0.15
      TRADE_TIER_FULL_MIN: 1200.0
      TRADE_TIER_LIMITED_MIN: 900.0
      SURPLUS_UNIT_CENTS: 1000000
      POSITIONAL_MARKET_APY_CENTS: { 1: 2200000000, 2: 1400000000, 3: 900000000, 4: 700000000, 5: 560000000, 6: 480000000, 7: 420000000 }
    precision: "chart values 1 decimal place round_half_up; imbalance_ratio 4 decimal places round_half_up"
    variants:
      - name: chart_authoritative
        when: "always; this is the value stored in chart_balance_points and the only variant that gates acceptance"
        difference: "Pure positional trade-chart arithmetic. Ignores contract economics entirely."
      - name: market_surplus_advisory
        when: "always; stored in surplus_balance_points and surfaced to club front offices, never enforced"
        difference: |
          Values each pick by the surplus between the positional market price of
          its round and the slotted rookie cost of that exact pick:
            pick_surplus = round_half_up(
                (POSITIONAL_MARKET_APY_CENTS[round_number]
                 - slot_total_value_cents) / SURPLUS_UNIT_CENTS, 1)
            surplus_balance_points = round_half_up(
                sum(pick_surplus of requested) - sum(pick_surplus of offered), 1)
          Because slotted cost falls much faster than market price across rounds,
          the surplus variant can carry the OPPOSITE SIGN from the chart variant
          for the same trade.

  - name: compensatory_pick_award_score
    trigger: "POST /draft-ops/compensatory-claims (preview), POST /draft-ops/compensatory-claims/{id}/verify (frozen), the ORDER_PENDING -> ORDER_FINAL finalize transition (awards)"
    algorithm: weighted_scoring
    formula: |
      base = departed_apy_cents / COMP_APY_UNIT_CENTS       # exact rational

      snap_factor = 1.00 if snap_pct >= 0.65
               else 0.85 if snap_pct >= 0.45
               else 0.70 if snap_pct >= 0.25
               else 0.50
      honors_bonus = 40 if postseason_honor == ALL_LEAGUE
                else 20 if postseason_honor == ALL_CONFERENCE
                else 0

      claim_score = round_half_up(base * snap_factor + honors_bonus, 2)
      qualifies   = claim_score >= COMP_QUALIFY_SCORE_MIN   # inclusive

      # award pass, run once at finalize, per club
      qualifying_departures = VERIFIED DEPARTURE claims with qualifies = true
      qualifying_arrivals   = VERIFIED ARRIVAL   claims with qualifies = true
      net_count = max(0, len(qualifying_departures) - len(qualifying_arrivals))
      ranked = sort(qualifying_departures, key=(claim_score DESC, created_at ASC))
      awarded = ranked[0 : min(net_count,
                               COMP_MAX_AWARDS_PER_CLUB,
                               COMP_LEAGUE_MAX_AWARDS - league_awards_so_far)]
      # league-wide ordering across clubs uses the same key, so the league cap
      # is consumed by the highest-scoring claims first
      for each awarded claim:
          awarded_round = 3 if claim_score >= 1200
                     else 4 if claim_score >= 700
                     else 5 if claim_score >= 450
                     else 6 if claim_score >= 300
                     else 7
          awarded_sequence = 1-based order within that awarded_round
      every remaining VERIFIED claim becomes REJECTED_CAP
    input_set: "CompensatoryClaim rows in status VERIFIED for the cycle; SUBMITTED and REJECTED claims are excluded from the award pass"
    constants:
      COMP_APY_UNIT_CENTS: 1000000
      COMP_QUALIFY_SCORE_MIN: 250.00
      COMP_MAX_AWARDS_PER_CLUB: 4
      COMP_LEAGUE_MAX_AWARDS: 8
    precision: "2 decimal places, round_half_up; awarded_round bands are inclusive at their lower bound"
    variants:
      - name: banded_snap_authoritative
        when: "always; stored in claim_score and the only variant that decides qualifies, awarded_round and awarded_sequence"
        difference: "Uses the four-step banded snap_factor, so every snap_pct in a band scores identically."
      - name: raw_snap_advisory
        when: "always; stored in advisory_snap_adjusted_score and published to clubs as a what-if figure"
        difference: |
          Multiplies by the raw snap share instead of the band:
            advisory_snap_adjusted_score = round_half_up(base * snap_pct
                                                         + honors_bonus, 2)
          For any snap_pct strictly inside a band the two variants diverge, and a
          claim can be advisory-below COMP_QUALIFY_SCORE_MIN while authoritatively
          qualifying.

  - name: selection_clock_deadline
    trigger: "any transition that puts a DraftPick ON_CLOCK, and every TIMEOUT clock-action"
    algorithm: interval_merge
    formula: |
      minutes = ROUND_CLOCK_MINUTES[round_number]
      if cycle.compressed_final_day and round_number >= COMPRESSION_FIRST_ROUND:
          minutes = minutes - CLOCK_COMPRESSION_MINUTES
      deadline_at = on_clock_started_at + minutes minutes
                    + TIMEOUT_EXTENSION_MINUTES * timeouts_used minutes

      # expiry is inclusive of the boundary instant
      expired = current_utc >= deadline_at
      # a TIMEOUT may only be spent while the clock is still running
      timeout_allowed = current_utc < deadline_at

      # cascade inside a single clock/advance call
      while the ON_CLOCK pick is expired:
          pick.status = PASSED; pick.pass_reason = EXPIRED
          next = the PENDING pick with the lowest overall_number
          if next is null: break
          next.on_clock_started_at = the expired pick's deadline_at
          next.deadline_at = recomputed from that instant
          next.status = ON_CLOCK
    input_set: "The single ON_CLOCK DraftPick of the cycle plus the PENDING picks ordered by overall_number ASC"
    constants:
      ROUND_CLOCK_MINUTES: { 1: 10, 2: 7, 3: 5, 4: 5, 5: 5, 6: 5, 7: 4 }
      TIMEOUT_EXTENSION_MINUTES: 2
      CLOCK_COMPRESSION_MINUTES: 1
      COMPRESSION_FIRST_ROUND: 5
      CLUB_TIMEOUTS_PER_CYCLE: 2
    precision: "whole minutes; comparisons at millisecond resolution with >= for expiry and < for timeout eligibility"

  - name: rookie_pool_charge
    trigger: "every PlayerContract status change and every read of Club"
    algorithm: aggregation
    formula: |
      signed_charge = SUM(PlayerContract.first_year_cap_charge_cents
                          WHERE club_id = club.id AND status = SIGNED)
      rookie_pool_remaining_cents = rookie_pool_total_cents - signed_charge
      # gate applied when a contract is signed
      if signed_charge_after_this_signing > rookie_pool_total_cents:
          reject with ERR_ROOKIE_POOL_EXCEEDED (422)
    input_set: "PlayerContract rows for the club in status SIGNED only; OFFERED, VOIDED and LAPSED contracts are excluded"
    constants: {}
    precision: "whole cents, exact integer arithmetic"
    note: "Compensating invariant: rookie_pool_remaining_cents + signed_charge == rookie_pool_total_cents after any sign/void sequence."

  - name: medical_share_access_window
    trigger: "the MedicalRecordShare REQUESTED -> GRANTED transition"
    algorithm: threshold
    formula: |
      candidates = [cycle.combine_week_end_at + MEDICAL_SHARE_TTL_DAYS days,
                    cycle.draft_start_at + MEDICAL_SHARE_DRAFT_GRACE_DAYS days,
                    prospect.consent_expires_at]
      expires_at = min(candidates)          # the earliest cap always wins
      effective_access = scope if (status == GRANTED and current_utc < expires_at)
                         else NONE
    input_set: "The share's MedicalEvaluation -> CombineBooking -> Prospect chain plus that prospect's DraftCycle window fields"
    constants:
      MEDICAL_SHARE_TTL_DAYS: 75
      MEDICAL_SHARE_DRAFT_GRACE_DAYS: 3
    precision: "millisecond datetime arithmetic; access ends at expires_at exclusive"

  - name: udfa_pool_allocation
    trigger: "the DRAFT_COMPLETE -> UDFA_WINDOW transition, once per REGISTERED Club"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - base pool
      base_pool = UDFA_BASE_POOL_CENTS
                  + round_half_up(club.rookie_pool_remaining_cents
                                  * UDFA_ROLLOVER_PCT)

      # STEP 2 - PINNED EVALUATION ORDER: the credit rate tier is keyed on
      # base_pool, NEVER on the post-credit total. Reversing these two steps
      # changes the tier and therefore the answer.
      credit_rate = UDFA_CREDIT_RATE_LOW  if base_pool >= UDFA_TIER_LOW_MIN
               else UDFA_CREDIT_RATE_MID  if base_pool >= UDFA_TIER_MID_MIN
               else UDFA_CREDIT_RATE_HIGH

      # STEP 3 - lapsed-pick credit
      raw_credit = SUM(DraftPick.slot_first_year_cap_charge_cents
                       WHERE owning_club_id = club.id AND status = LAPSED)
      udfa_pool_total_cents = base_pool + round_half_up(raw_credit * credit_rate)

      # STEP 4 - waterfall as UDFA contracts are offered, in created_at ASC order
      remaining = udfa_pool_total_cents
      for contract in UDFA contracts (created_at ASC) with status in {OFFERED, SIGNED}:
          if contract.signing_bonus_cents > remaining:
              reject with ERR_UDFA_POOL_EXHAUSTED (422)
          remaining -= contract.signing_bonus_cents
      udfa_pool_remaining_cents = remaining
    input_set: "DraftPicks owned by the club in status LAPSED only; USED, PASSED, PENDING and FORFEITED picks contribute nothing. Club.rookie_pool_remaining_cents is read at the instant of the transition and frozen."
    constants:
      UDFA_BASE_POOL_CENTS: 40000000
      UDFA_ROLLOVER_PCT: 0.10
      UDFA_TIER_LOW_MIN: 120000000
      UDFA_TIER_MID_MIN: 60000000
      UDFA_CREDIT_RATE_LOW: 0.25
      UDFA_CREDIT_RATE_MID: 0.40
      UDFA_CREDIT_RATE_HIGH: 0.55
      UDFA_WINDOW_HOURS: 72
    precision: "whole cents, round_half_up applied once at STEP 1 and once at STEP 3"

validations:
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "request body and query parameters parse, every required field is present, enums are members of their declared sets, numbers are inside their declared ranges, ends_at is strictly after starts_at, limit is 1..100 and offset is >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every resource named by a path parameter exists, validated left to right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "every FK supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints accepting FK fields"

  - priority: 6
    category: auth
    check: "for entity_backed roles, X-User-Id equals the resource's owning FK: ClubGM and ClubMedicalDirector must match the Club, ProspectAgent must match the Prospect"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all club-scoped and prospect-scoped mutations"

  - priority: 7
    category: state
    check: "the DraftCycle is in a status that permits this operation (declarations only in DECLARATION_OPEN, bookings only in COMBINE_WEEK, lottery and finalize only in ORDER_PENDING, selections and clock actions only in DRAFT_LIVE, trades only in ORDER_FINAL or DRAFT_LIVE, UDFA contracts only in UDFA_WINDOW)"
    error_id: ERR_CYCLE_PHASE_INVALID
    http_status: 409
    applies_to: "all cycle-scoped mutations"

  - priority: 8
    category: state
    check: "DraftCycle.posture is not FROZEN"
    error_id: ERR_CYCLE_FROZEN
    http_status: 409
    applies_to: "all cycle-scoped mutations"

  - priority: 9
    category: state
    check: "the requested transition exists from the target resource's current state for the supplied action"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action and status endpoints"

  - priority: 10
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
    applies_to: "POST /draft-ops/player-contracts, POST /draft-ops/medical-record-shares"

  - priority: 11
    category: business_safety
    check: "the prospect's consent_status is GRANTED, consent_expires_at is strictly after current_utc, and the requested scope does not exceed consent_scope"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 403
    applies_to: "POST /draft-ops/medical-record-shares, POST /draft-ops/medical-record-shares/{id}/decision"

  - priority: 12
    category: business_safety
    check: "the MedicalEvaluation.disclosure_state is DISCLOSABLE"
    error_id: ERR_EVALUATION_SEALED
    http_status: 409
    applies_to: "POST /draft-ops/medical-record-shares"

  - priority: 13
    category: business_safety
    check: "a RESTRICTED confidentiality_tier evaluation may only be requested or granted for a ClubMedicalDirector; a ClubGM request against a RESTRICTED evaluation is refused"
    error_id: ERR_CONFIDENTIALITY_TIER_VIOLATION
    http_status: 403
    applies_to: "POST /draft-ops/medical-record-shares, POST /draft-ops/medical-record-shares/{id}/decision"

  - priority: 14
    category: business_safety
    check: "the acting X-User-Id differs from the user who performed the conflicting earlier step: the waiver submitter may not open review, and the reviewer who opened review may not decide"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /draft-ops/eligibility-waivers/{id}/review"

  - priority: 15
    category: business_safety
    check: "proposing_club_id differs from receiving_club_id and the acting club is a party to the trade"
    error_id: ERR_SELF_TRADE_FORBIDDEN
    http_status: 422
    applies_to: "POST /draft-ops/pick-trades, POST /draft-ops/pick-trades/{id}/counter"

  - priority: 16
    category: business_temporal
    check: "current_utc <= DraftCycle.declaration_deadline_at, unless Prospect.late_declaration_waived is true"
    error_id: ERR_DECLARATION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /draft-ops/prospects/{id}/declaration"

  - priority: 17
    category: business_temporal
    check: "starts_at >= combine_week_start_at and ends_at <= combine_week_end_at"
    error_id: ERR_OUTSIDE_COMBINE_WEEK
    http_status: 422
    applies_to: "POST /draft-ops/combine-bookings"

  - priority: 18
    category: business_temporal
    check: "current_utc < DraftPick.deadline_at for any action that assumes a running clock"
    error_id: ERR_CLOCK_ALREADY_EXPIRED
    http_status: 409
    applies_to: "POST /draft-ops/draft-picks/{id}/selections, POST /draft-ops/draft-picks/{id}/clock-action"

  - priority: 19
    category: business_temporal
    check: "current_utc < DraftCycle.udfa_window_close_at for UDFA contract offers and signings"
    error_id: ERR_UDFA_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /draft-ops/player-contracts, POST /draft-ops/player-contracts/{id}/status"

  - priority: 20
    category: business_referential
    check: "every referenced Club, Prospect, DraftPick and CompensatoryClaim belongs to the same DraftCycle as the operation's cycle"
    error_id: ERR_CROSS_CYCLE_REFERENCE
    http_status: 422
    applies_to: "POST /draft-ops/pick-trades, POST /draft-ops/medical-record-shares, POST /draft-ops/player-contracts, POST /draft-ops/combine-bookings, POST /draft-ops/compensatory-claims"

  - priority: 21
    category: business_referential
    check: "booking_type MEDICAL_EXAM supplies exactly medical_station_id; CLUB_INTERVIEW supplies exactly interview_room_id and club_id; ON_FIELD_TEST supplies none of them"
    error_id: ERR_BOOKING_RESOURCE_MISMATCH
    http_status: 422
    applies_to: "POST /draft-ops/combine-bookings"

  - priority: 22
    category: business_referential
    check: "the referenced CombineBooking has booking_type MEDICAL_EXAM, status COMPLETED, and prospect_id equal to the supplied prospect_id"
    error_id: ERR_BOOKING_NOT_MEDICAL_COMPLETED
    http_status: 422
    applies_to: "POST /draft-ops/medical-evaluations"

  - priority: 23
    category: business_referential
    check: "every pick in offered_pick_ids is owned by proposing_club_id and every pick in requested_pick_ids is owned by receiving_club_id, and all of them are PENDING"
    error_id: ERR_PICK_NOT_OWNED_BY_CLUB
    http_status: 422
    applies_to: "POST /draft-ops/pick-trades, POST /draft-ops/pick-trades/{id}/counter, POST /draft-ops/pick-trades/{id}/accept"

  - priority: 24
    category: business_referential
    check: "for origin DRAFTED, draft_pick_id is present, its status is USED, its selected_prospect_id equals prospect_id and its owning_club_id equals club_id; for origin UDFA, draft_pick_id is absent and udfa_signing_bonus_cents is present"
    error_id: ERR_CONTRACT_PICK_MISMATCH
    http_status: 422
    applies_to: "POST /draft-ops/player-contracts"

  - priority: 25
    category: business_constraint
    check: "the prospect being selected has eligibility_status ELIGIBLE, medical_clearance_status not FAILED, declaration_status DECLARED and drafted_pick_overall_number 0"
    error_id: ERR_PROSPECT_NOT_SELECTABLE
    http_status: 422
    applies_to: "POST /draft-ops/draft-picks/{id}/selections"

  - priority: 26
    category: business_constraint
    check: "every value in drawn_combination_sequence is between 1 and the total assigned lottery combinations, and the sequence contains at least LOTTERY_SLOT_COUNT distinct owning clubs"
    error_id: ERR_LOTTERY_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /draft-ops/draft-cycles/{id}/lottery"

  - priority: 27
    category: business_constraint
    check: "club_code is unique among Clubs of the same draft_cycle_id"
    error_id: ERR_CLUB_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /draft-ops/clubs"

  - priority: 28
    category: business_constraint
    check: "the prospect's declaration_status is UNDECLARED when action is DECLARE"
    error_id: ERR_ALREADY_DECLARED
    http_status: 409
    applies_to: "POST /draft-ops/prospects/{id}/declaration"

  - priority: 29
    category: business_constraint
    check: "info_request_count < WAIVER_MAX_INFO_REQUESTS (2) when action is REQUEST_INFO"
    error_id: ERR_WAIVER_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /draft-ops/eligibility-waivers/{id}/review"

  - priority: 30
    category: business_constraint
    check: "round_index < TRADE_MAX_NEGOTIATION_ROUNDS (3) when action is a counter"
    error_id: ERR_TRADE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /draft-ops/pick-trades/{id}/counter"

  - priority: 31
    category: business_constraint
    check: "out_of_order_authorized is true whenever a PENDING pick is used while another pick holds the clock, and out_of_order_ack is true in the request"
    error_id: ERR_OUT_OF_ORDER_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /draft-ops/draft-picks/{id}/selections"

  - priority: 32
    category: business_constraint
    check: "the new interval, inflated by MedicalStation.turnaround_buffer_minutes on both sides, does not overlap the half-open interval of any SCHEDULED or CHECKED_IN booking already on that station"
    error_id: ERR_STATION_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /draft-ops/combine-bookings"

  - priority: 33
    category: business_constraint
    check: "the count of SCHEDULED or CHECKED_IN bookings on the InterviewRoom whose half-open intervals overlap the new interval is strictly less than concurrent_capacity; adjacency (gap 0) does not overlap"
    error_id: ERR_ROOM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /draft-ops/combine-bookings"

  - priority: 34
    category: business_constraint
    check: "the new interval, widened by PROSPECT_TRAVEL_GAP_MINUTES (10) on both sides, does not overlap any other SCHEDULED or CHECKED_IN booking of the same prospect"
    error_id: ERR_PROSPECT_ITINERARY_CONFLICT
    http_status: 409
    applies_to: "POST /draft-ops/combine-bookings"

  - priority: 35
    category: business_constraint
    check: "the combine invitation selector pool is non-empty"
    error_id: ERR_NO_ELIGIBLE_PROSPECTS
    http_status: 422
    applies_to: "POST /draft-ops/draft-cycles/{id}/combine-invitations/select"

  - priority: 36
    category: business_fiscal
    check: "neither party's trade_authorization_tier is SUSPENDED"
    error_id: ERR_TRADE_AUTHORIZATION_SUSPENDED
    http_status: 403
    applies_to: "POST /draft-ops/pick-trades, POST /draft-ops/pick-trades/{id}/counter, POST /draft-ops/pick-trades/{id}/accept"

  - priority: 37
    category: business_fiscal
    check: "imbalance_ratio <= TRADE_TOLERANCE_RATIO (0.15), inclusive at the boundary"
    error_id: ERR_TRADE_VALUE_IMBALANCED
    http_status: 422
    applies_to: "POST /draft-ops/pick-trades/{id}/accept"

  - priority: 38
    category: business_fiscal
    check: "the owning Club's timeouts_remaining is greater than 0 when action is TIMEOUT"
    error_id: ERR_NO_TIMEOUTS_REMAINING
    http_status: 409
    applies_to: "POST /draft-ops/draft-picks/{id}/clock-action"

  - priority: 39
    category: business_fiscal
    check: "signing this contract keeps the club's SIGNED first-year charges at or below rookie_pool_total_cents"
    error_id: ERR_ROOKIE_POOL_EXCEEDED
    http_status: 422
    applies_to: "POST /draft-ops/player-contracts/{id}/status"

  - priority: 40
    category: business_fiscal
    check: "the requested udfa_signing_bonus_cents is less than or equal to the club's udfa_pool_remaining_cents"
    error_id: ERR_UDFA_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST /draft-ops/player-contracts"

endpoints:
  - method: POST
    path: "/draft-ops/draft-cycles"
    description: "Create a draft cycle in SETUP with its declaration deadline, combine week window and draft start instant"
    roles: [LeagueDraftAdmin]
    code: 201
    input: [season_year, declaration_deadline_at, combine_week_start_at, combine_week_end_at, draft_start_at, "rounds_count?", "compressed_final_day?"]
    output: DraftCycle
    side_effects: ["sets status = SETUP, posture = OPEN, club_count = 0, lottery_completed = false"]

  - method: GET
    path: "/draft-ops/draft-cycles/{id}"
    description: "Read one draft cycle including posture, club_count, current_overall_number and pick inventory"
    roles: [LeagueDraftAdmin, ClubGM, ClubMedicalDirector, CombineMedicalExaminer, EligibilityCommittee, ProspectAgent]
    code: 200
    input: []
    output: DraftCycle
    side_effects: []

  - method: POST
    path: "/draft-ops/draft-cycles/{id}/phase"
    description: "Advance or suspend the cycle by requesting a target status; rejects any transition not declared in the DraftCycle state machine"
    roles: [LeagueDraftAdmin]
    code: 200
    input: [target_status]
    output: DraftCycle
    side_effects: ["applies the declared transition side effects", "runs udfa_pool_allocation on the DRAFT_COMPLETE -> UDFA_WINDOW transition", "lapses OFFERED contracts on the UDFA_WINDOW -> CLOSED transition", "increments DraftCycle.version by 1"]

  - method: POST
    path: "/draft-ops/draft-cycles/{id}/lottery"
    description: "Run the draft lottery from an explicit drawn combination sequence and resolve pre_lottery_rank and draft_order_index for every registered club"
    roles: [LeagueDraftAdmin]
    code: 200
    input: [drawn_combination_sequence]
    output: DraftCycle
    side_effects: ["runs draft_order_ranking", "sets lottery_completed = true and lottery_slot_club_ids", "sets Club.pre_lottery_rank and Club.draft_order_index"]

  - method: POST
    path: "/draft-ops/draft-cycles/{id}/draft-order/finalize"
    description: "Mint every DraftPick for the cycle from the resolved draft order, compute chart and slot values, and run the compensatory award pass"
    roles: [LeagueDraftAdmin]
    code: 200
    input: []
    output: "{ created_pick_count: integer, compensatory_pick_count: integer, first_overall_pick_id: string }"
    side_effects: ["mints DraftPick rows in PENDING", "mints FORFEITED picks for rounds in Club.forfeited_round_numbers", "awards or caps VERIFIED CompensatoryClaims", "sets order_finalized_at and udfa_window_close_at", "moves the cycle to ORDER_FINAL"]

  - method: POST
    path: "/draft-ops/draft-cycles/{id}/clock/advance"
    description: "Ops-run checkpoint for the selection clock: starts the first pick when none is on the clock, and cascades expiries while the on-clock pick's deadline_at is at or before current_utc"
    roles: [LeagueDraftAdmin]
    code: 200
    input: []
    output: "{ expired_pick_id: string, on_clock_pick_id: string, passed_count: integer, lapsed_count: integer }"
    side_effects: ["moves PENDING picks to ON_CLOCK and ON_CLOCK picks to PASSED with pass_reason = EXPIRED", "moves the cycle to DRAFT_COMPLETE and lapses PASSED picks when no pick remains PENDING or ON_CLOCK", "updates DraftCycle.current_overall_number"]

  - method: POST
    path: "/draft-ops/draft-cycles/{id}/combine-invitations/select"
    description: "Run the combine invitation selector over the cycle's declared, non-ineligible, not-yet-invited prospects and invite the top target_count"
    roles: [LeagueDraftAdmin]
    code: 200
    input: [target_count]
    output: "{ invited_count: integer, invited_prospect_ids: array }"
    side_effects: ["runs combine_invitation_selection", "sets Prospect.invitation_status = INVITED for each chosen prospect"]

  - method: GET
    path: "/draft-ops/draft-cycles/{id}/clubs"
    description: "List the clubs registered to this cycle, ordered by draft_order_index ASC then created_at ASC"
    roles: [LeagueDraftAdmin, ClubGM, EligibilityCommittee]
    code: 200
    input: ["registration_status?", "limit?", "offset?"]
    output: Club[]
    side_effects: []

  - method: GET
    path: "/draft-ops/draft-cycles/{id}/prospects"
    description: "List the prospects entering this cycle, ordered by created_at ASC"
    roles: [LeagueDraftAdmin, ClubGM, EligibilityCommittee, CombineMedicalExaminer]
    code: 200
    input: ["declaration_status?", "eligibility_status?", "invitation_status?", "limit?", "offset?"]
    output: Prospect[]
    side_effects: []

  - method: POST
    path: "/draft-ops/clubs"
    description: "Register a club into a draft cycle with its prior-season seeding inputs, lottery combinations and rookie pool"
    roles: [LeagueDraftAdmin]
    code: 201
    input: [draft_cycle_id, club_code, market_name, prior_season_win_pct, strength_of_schedule, head_to_head_rank, rookie_pool_total_cents, "registration_status?", "playoff_qualified?", "playoff_exit_round?", "lottery_combinations?"]
    output: Club
    side_effects: ["recomputes DraftCycle.club_count", "sets timeouts_remaining = CLUB_TIMEOUTS_PER_CYCLE"]

  - method: GET
    path: "/draft-ops/clubs/{id}"
    description: "Read one club including draft_capital_points, trade_authorization_tier and both cap pools"
    roles: [LeagueDraftAdmin, ClubGM, ClubMedicalDirector]
    code: 200
    input: []
    output: Club
    side_effects: []

  - method: POST
    path: "/draft-ops/prospects"
    description: "Register a prospect into a draft cycle with position group, seasons played and scouting inputs"
    roles: [LeagueDraftAdmin]
    code: 201
    input: [draft_cycle_id, full_name, position_group, school_code, seasons_played, scouting_grade, position_group_scarcity_rank]
    output: Prospect
    side_effects: ["sets all five parallel state dimensions to their initial values"]

  - method: GET
    path: "/draft-ops/prospects/{id}"
    description: "Read one prospect including every parallel state dimension and consent window"
    roles: [LeagueDraftAdmin, ClubGM, ClubMedicalDirector, CombineMedicalExaminer, EligibilityCommittee, ProspectAgent]
    code: 200
    input: []
    output: Prospect
    side_effects: []

  - method: POST
    path: "/draft-ops/prospects/{id}/declaration"
    description: "Declare for or withdraw from the draft on the declaration dimension"
    roles: [ProspectAgent]
    code: 200
    input: [action]
    output: Prospect
    side_effects: ["sets declared_at on DECLARE", "cancels SCHEDULED bookings and forces eligibility_status = INELIGIBLE on WITHDRAW"]

  - method: POST
    path: "/draft-ops/prospects/{id}/eligibility-determination"
    description: "Record the committee's eligibility determination on the eligibility dimension"
    roles: [EligibilityCommittee]
    code: 200
    input: [action]
    output: Prospect
    side_effects: ["withdraws an outstanding combine invitation and cancels SCHEDULED bookings on DECLARE_INELIGIBLE"]

  - method: POST
    path: "/draft-ops/prospects/{id}/combine-invitation"
    description: "Invite, accept, decline or withdraw a combine invitation on the invitation dimension"
    roles: [LeagueDraftAdmin, ProspectAgent]
    code: 200
    input: [action]
    output: Prospect
    side_effects: ["cancels SCHEDULED bookings and sets medical_clearance_status = UNVERIFIED on WITHDRAW and DECLINE"]

  - method: POST
    path: "/draft-ops/prospects/{id}/consent"
    description: "Grant or revoke medical disclosure consent on the consent dimension; revocation cascades through shares, evaluations, clearance and outstanding contract offers"
    roles: [ProspectAgent]
    code: 200
    input: [action, "scope?", "consent_expires_at?"]
    output: Prospect
    side_effects: ["sets consent_scope and consent_expires_at on GRANT", "revokes GRANTED shares, reseals evaluations, may set medical_clearance_status = UNVERIFIED and lapses OFFERED contracts on REVOKE"]

  - method: POST
    path: "/draft-ops/prospects/{id}/eligibility-waivers"
    description: "File an eligibility waiver request for the prospect"
    roles: [ProspectAgent]
    code: 201
    input: [waiver_type, rationale]
    output: EligibilityWaiver
    side_effects: ["records submitted_by_user_id from X-User-Id"]

  - method: GET
    path: "/draft-ops/prospects/{id}/eligibility-waivers"
    description: "List the eligibility waivers filed for this prospect, ordered by created_at ASC"
    roles: [LeagueDraftAdmin, EligibilityCommittee, ProspectAgent]
    code: 200
    input: ["status?", "waiver_type?", "limit?", "offset?"]
    output: EligibilityWaiver[]
    side_effects: []

  - method: POST
    path: "/draft-ops/eligibility-waivers/{id}/review"
    description: "Drive the waiver review loop: open review, request more information, grant, deny, or withdraw"
    roles: [EligibilityCommittee, ProspectAgent]
    code: 200
    input: [action, "decision_note?"]
    output: EligibilityWaiver
    side_effects: ["records opened_by_user_id or decided_by_user_id", "sets Prospect.late_declaration_waived or early_entry_waived on GRANT"]

  - method: POST
    path: "/draft-ops/medical-stations"
    description: "Register a facility-level medical station with its turnaround buffer"
    roles: [LeagueDraftAdmin]
    code: 201
    input: [station_code, exam_type, "turnaround_buffer_minutes?", "status?"]
    output: MedicalStation
    side_effects: []

  - method: GET
    path: "/draft-ops/medical-stations/{id}"
    description: "Read one medical station"
    roles: [LeagueDraftAdmin, CombineMedicalExaminer]
    code: 200
    input: []
    output: MedicalStation
    side_effects: []

  - method: POST
    path: "/draft-ops/interview-rooms"
    description: "Register a facility-level interview room with its concurrent capacity"
    roles: [LeagueDraftAdmin]
    code: 201
    input: [room_code, "concurrent_capacity?", "status?"]
    output: InterviewRoom
    side_effects: []

  - method: GET
    path: "/draft-ops/interview-rooms/{id}"
    description: "Read one interview room"
    roles: [LeagueDraftAdmin, ClubGM]
    code: 200
    input: []
    output: InterviewRoom
    side_effects: []

  - method: POST
    path: "/draft-ops/combine-bookings"
    description: "Book a medical exam, on-field test or club interview slot inside the compressed combine week"
    roles: [LeagueDraftAdmin]
    code: 201
    input: [prospect_id, booking_type, starts_at, ends_at, "medical_station_id?", "interview_room_id?", "club_id?"]
    output: CombineBooking
    side_effects: ["computes duration_minutes", "occupies the station or room interval for conflict detection"]

  - method: GET
    path: "/draft-ops/combine-bookings/{id}"
    description: "Read one combine booking"
    roles: [LeagueDraftAdmin, ClubGM, CombineMedicalExaminer, ProspectAgent]
    code: 200
    input: []
    output: CombineBooking
    side_effects: []

  - method: GET
    path: "/draft-ops/combine-bookings"
    description: "List combine bookings filtered by prospect, medical station, interview room, club or status, ordered by starts_at ASC then created_at ASC"
    roles: [LeagueDraftAdmin, ClubGM, CombineMedicalExaminer, ProspectAgent]
    code: 200
    input: ["prospect_id?", "medical_station_id?", "interview_room_id?", "club_id?", "booking_type?", "status?", "limit?", "offset?"]
    output: CombineBooking[]
    side_effects: []

  - method: POST
    path: "/draft-ops/combine-bookings/{id}/status"
    description: "Check in, complete, cancel or mark no-show for a combine booking"
    roles: [LeagueDraftAdmin]
    code: 200
    input: [action]
    output: CombineBooking
    side_effects: ["releases the resource interval on COMPLETE, CANCEL and MARK_NO_SHOW", "sets Prospect.medical_clearance_status = UNVERIFIED on MARK_NO_SHOW of a MEDICAL_EXAM"]

  - method: POST
    path: "/draft-ops/medical-evaluations"
    description: "File the examiner's medical evaluation against a completed medical exam booking"
    roles: [CombineMedicalExaminer]
    code: 201
    input: [combine_booking_id, prospect_id, findings_code, medical_grade]
    output: MedicalEvaluation
    side_effects: ["computes confidentiality_tier", "sets Prospect.medical_clearance_status to CLEARED or FAILED", "records filed_by_user_id from X-User-Id"]

  - method: GET
    path: "/draft-ops/medical-evaluations/{id}"
    description: "Read one medical evaluation including its confidentiality tier, disclosure state and active share count"
    roles: [LeagueDraftAdmin, ClubMedicalDirector, CombineMedicalExaminer]
    code: 200
    input: []
    output: MedicalEvaluation
    side_effects: []

  - method: GET
    path: "/draft-ops/medical-evaluations"
    description: "List medical evaluations filtered by prospect or booking, ordered by created_at ASC"
    roles: [LeagueDraftAdmin, ClubMedicalDirector, CombineMedicalExaminer]
    code: 200
    input: ["prospect_id?", "combine_booking_id?", "medical_grade?", "limit?", "offset?"]
    output: MedicalEvaluation[]
    side_effects: []

  - method: POST
    path: "/draft-ops/medical-record-shares"
    description: "Request club access to a prospect's medical evaluation under the prospect's consent; a newer request for the same evaluation and club supersedes the prior one"
    roles: [ClubGM, ClubMedicalDirector]
    code: 201
    input: [medical_evaluation_id, club_id, scope, expected_medical_evaluation_version]
    output: MedicalRecordShare
    side_effects: ["marks a prior REQUESTED share for the same evaluation and club as SUPERSEDED", "records requested_by_user_id and requested_by_role", "increments MedicalEvaluation.version by 1"]

  - method: GET
    path: "/draft-ops/medical-record-shares/{id}"
    description: "Read one medical record share including expires_at and effective_access"
    roles: [LeagueDraftAdmin, ClubGM, ClubMedicalDirector, ProspectAgent]
    code: 200
    input: []
    output: MedicalRecordShare
    side_effects: []

  - method: GET
    path: "/draft-ops/medical-record-shares"
    description: "List medical record shares filtered by evaluation, club or status, ordered by created_at ASC"
    roles: [LeagueDraftAdmin, ClubGM, ClubMedicalDirector, ProspectAgent]
    code: 200
    input: ["medical_evaluation_id?", "club_id?", "status?", "scope?", "limit?", "offset?"]
    output: MedicalRecordShare[]
    side_effects: []

  - method: POST
    path: "/draft-ops/medical-record-shares/{id}/decision"
    description: "Grant, deny or revoke a medical record share"
    roles: [LeagueDraftAdmin]
    code: 200
    input: [action, "denial_reason?"]
    output: MedicalRecordShare
    side_effects: ["runs medical_share_access_window on GRANT", "adjusts MedicalEvaluation.active_share_count", "seals the evaluation when active_share_count reaches 0"]

  - method: GET
    path: "/draft-ops/draft-picks/{id}"
    description: "Read one draft pick including chart value, slot values, clock deadline and selection source"
    roles: [LeagueDraftAdmin, ClubGM, ProspectAgent]
    code: 200
    input: []
    output: DraftPick
    side_effects: []

  - method: GET
    path: "/draft-ops/draft-picks"
    description: "List draft picks filtered by cycle, current owner, original club, selected prospect, round or status, ordered by overall_number ASC"
    roles: [LeagueDraftAdmin, ClubGM, ProspectAgent]
    code: 200
    input: ["draft_cycle_id?", "owning_club_id?", "original_club_id?", "selected_prospect_id?", "round_number?", "status?", "limit?", "offset?"]
    output: DraftPick[]
    side_effects: []

  - method: POST
    path: "/draft-ops/draft-picks/{id}/selections"
    description: "Make a selection with this pick, on the clock, after a pass, or out of order when the league has authorized it"
    roles: [ClubGM]
    code: 200
    input: [prospect_id, "out_of_order_ack?"]
    output: DraftPick
    side_effects: ["sets selected_prospect_id and selection_source", "sets Prospect.drafted_pick_overall_number", "puts the next PENDING pick ON_CLOCK when the used pick held the clock"]

  - method: POST
    path: "/draft-ops/draft-picks/{id}/clock-action"
    description: "Pass or take a timeout on the clock as the owning club, or forfeit a pick or authorize an out-of-order selection as the league"
    roles: [ClubGM, LeagueDraftAdmin]
    code: 200
    input: [action]
    output: DraftPick
    side_effects: ["PASS sets pass_reason = VOLUNTARY and advances the clock", "TIMEOUT extends deadline_at and decrements Club.timeouts_remaining", "FORFEIT zeroes chart_value_points and may cascade both clubs' trades to VOIDED_BY_CAPITAL", "AUTHORIZE_OUT_OF_ORDER sets out_of_order_authorized"]

  - method: POST
    path: "/draft-ops/pick-trades"
    description: "Propose a pick trade between two clubs, optionally attaching a conditional future pick"
    roles: [ClubGM]
    code: 201
    input: [draft_cycle_id, proposing_club_id, receiving_club_id, offered_pick_ids, requested_pick_ids, "conditional_round_number?", "conditional_condition_code?"]
    output: PickTrade
    side_effects: ["runs both variants of pick_trade_value_balance", "sets round_index = 1 and last_actor_club_id = proposing_club_id", "derives conditional_probability_tier and sets conditional_status = OPEN when a condition is attached"]

  - method: GET
    path: "/draft-ops/pick-trades/{id}"
    description: "Read one pick trade including both value variants and both state dimensions"
    roles: [LeagueDraftAdmin, ClubGM]
    code: 200
    input: []
    output: PickTrade
    side_effects: []

  - method: GET
    path: "/draft-ops/pick-trades"
    description: "List pick trades filtered by cycle, proposing club, receiving club, last actor club or status, ordered by created_at ASC"
    roles: [LeagueDraftAdmin, ClubGM]
    code: 200
    input: ["draft_cycle_id?", "proposing_club_id?", "receiving_club_id?", "last_actor_club_id?", "status?", "conditional_status?", "limit?", "offset?"]
    output: PickTrade[]
    side_effects: []

  - method: POST
    path: "/draft-ops/pick-trades/{id}/counter"
    description: "Counter the outstanding proposal with a new pick package, consuming one negotiation round"
    roles: [ClubGM]
    code: 200
    input: [offered_pick_ids, requested_pick_ids]
    output: PickTrade
    side_effects: ["increments round_index", "recomputes both value variants", "flips last_actor_club_id to the acting club"]

  - method: POST
    path: "/draft-ops/pick-trades/{id}/accept"
    description: "Accept the outstanding proposal and swap pick ownership when the chart imbalance is inside tolerance"
    roles: [ClubGM]
    code: 200
    input: []
    output: PickTrade
    side_effects: ["swaps DraftPick.owning_club_id for every traded pick", "recomputes draft_capital_points and trade_authorization_tier for both clubs", "leaves the conditional dimension at the value set when the trade was proposed"]

  - method: POST
    path: "/draft-ops/pick-trades/{id}/termination"
    description: "Withdraw, reject or league-rescind a pick trade; rescission restores pre-acceptance pick ownership"
    roles: [ClubGM, LeagueDraftAdmin]
    code: 200
    input: [action, "reason?"]
    output: PickTrade
    side_effects: ["RESCIND restores owning_club_id on every traded pick and voids an OPEN conditional", "recomputes both clubs' capital and tier"]

  - method: POST
    path: "/draft-ops/pick-trades/{id}/conditional-resolution"
    description: "Resolve the conditional dimension of an accepted trade as conveyed, deferred or extinguished"
    roles: [LeagueDraftAdmin]
    code: 200
    input: [condition_satisfied]
    output: PickTrade
    side_effects: ["sets conditional_conveyed_overall_number when the condition conveys", "defers a REMOTE-tier condition to the following cycle"]

  - method: POST
    path: "/draft-ops/compensatory-claims"
    description: "Submit a departure or arrival compensatory claim with the movement's APY, snap share and postseason honor"
    roles: [ClubGM]
    code: 201
    input: [draft_cycle_id, club_id, claim_type, player_name, departed_apy_cents, snap_pct, "postseason_honor?"]
    output: CompensatoryClaim
    side_effects: ["computes both variants of compensatory_pick_award_score and the qualifies flag"]

  - method: GET
    path: "/draft-ops/compensatory-claims/{id}"
    description: "Read one compensatory claim including both score variants and the award result"
    roles: [LeagueDraftAdmin, ClubGM]
    code: 200
    input: []
    output: CompensatoryClaim
    side_effects: []

  - method: GET
    path: "/draft-ops/compensatory-claims"
    description: "List compensatory claims filtered by cycle, club, claim type or status, ordered by claim_score DESC then created_at ASC"
    roles: [LeagueDraftAdmin, ClubGM]
    code: 200
    input: ["draft_cycle_id?", "club_id?", "claim_type?", "status?", "limit?", "offset?"]
    output: CompensatoryClaim[]
    side_effects: []

  - method: POST
    path: "/draft-ops/compensatory-claims/{id}/verify"
    description: "Verify or reject a submitted compensatory claim before the award pass runs"
    roles: [LeagueDraftAdmin]
    code: 200
    input: [action]
    output: CompensatoryClaim
    side_effects: ["freezes claim_score and advisory_snap_adjusted_score on VERIFY"]

  - method: POST
    path: "/draft-ops/player-contracts"
    description: "Offer a slotted rookie contract against a used draft pick, or an undrafted free agent contract inside the UDFA window"
    roles: [ClubGM]
    code: 201
    input: [prospect_id, club_id, origin, expected_prospect_version, "draft_pick_id?", "udfa_signing_bonus_cents?"]
    output: PlayerContract
    side_effects: ["runs slotted_rookie_contract_value with the pinned per-year rounding order", "lapses a prior OFFERED contract from the same club for the same prospect", "sets Prospect.signing_status = OFFER_OUT", "increments Prospect.version by 1"]

  - method: GET
    path: "/draft-ops/player-contracts/{id}"
    description: "Read one player contract including all four money fields"
    roles: [LeagueDraftAdmin, ClubGM, ProspectAgent]
    code: 200
    input: []
    output: PlayerContract
    side_effects: []

  - method: GET
    path: "/draft-ops/player-contracts"
    description: "List player contracts filtered by prospect, club, pick, origin or status, ordered by created_at ASC"
    roles: [LeagueDraftAdmin, ClubGM, ProspectAgent]
    code: 200
    input: ["prospect_id?", "club_id?", "draft_pick_id?", "origin?", "status?", "limit?", "offset?"]
    output: PlayerContract[]
    side_effects: []

  - method: POST
    path: "/draft-ops/player-contracts/{id}/status"
    description: "Countersign a contract as the prospect's agent, or void it as the signing club"
    roles: [ProspectAgent, ClubGM]
    code: 200
    input: [action]
    output: PlayerContract
    side_effects: ["SIGN sets signed_at, Prospect.signing_status = SIGNED and recomputes Club.rookie_pool_remaining_cents", "VOID returns Prospect.signing_status to UNSIGNED and restores the club's rookie pool"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call the logical clock reads exactly the server startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Advancing the clock also expires every GRANTED MedicalRecordShare whose expires_at is at or before the new instant."
    roles: [LeagueDraftAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock used by every deadline, window and expiry rule", "transitions GRANTED MedicalRecordShares whose expires_at <= the new instant to EXPIRED and decrements their evaluation's active_share_count"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Id or X-User-Role header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, unknown enum value, out-of-range number, ends_at not after starts_at, or bad pagination parameter"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a resource named by a path parameter does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign key supplied in the request body does not resolve"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource that belongs to a different Club or Prospect"
  - id: ERR_CYCLE_PHASE_INVALID
    http: 409
    condition: "the DraftCycle status does not permit this operation"
  - id: ERR_CYCLE_FROZEN
    http: 409
    condition: "the DraftCycle posture is FROZEN because the draft is suspended or the cycle is closed"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not a declared transition from the resource's current state"
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_prospect_version or expected_medical_evaluation_version does not match the parent's current version"
  - id: ERR_CONSENT_NOT_GRANTED
    http: 403
    condition: "the prospect has not granted consent, the consent has lapsed, or the requested scope exceeds consent_scope"
  - id: ERR_EVALUATION_SEALED
    http: 409
    condition: "a share is requested against a MedicalEvaluation whose disclosure_state is SEALED"
  - id: ERR_CONFIDENTIALITY_TIER_VIOLATION
    http: 403
    condition: "a ClubGM requests or is granted access to a RESTRICTED confidentiality_tier evaluation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-Id attempts two waiver steps that must be performed by different people"
  - id: ERR_SELF_TRADE_FORBIDDEN
    http: 422
    condition: "proposing_club_id equals receiving_club_id, or the acting club is not a party to the trade"
  - id: ERR_DECLARATION_DEADLINE_PASSED
    http: 409
    condition: "a declaration is attempted after declaration_deadline_at without a granted LATE_DECLARATION waiver"
  - id: ERR_OUTSIDE_COMBINE_WEEK
    http: 422
    condition: "a booking interval falls outside the cycle's combine week window"
  - id: ERR_CLOCK_ALREADY_EXPIRED
    http: 409
    condition: "a selection or clock action is attempted at or after the pick's deadline_at"
  - id: ERR_UDFA_WINDOW_CLOSED
    http: 409
    condition: "a UDFA contract is offered or signed at or after udfa_window_close_at"
  - id: ERR_CROSS_CYCLE_REFERENCE
    http: 422
    condition: "a referenced Club, Prospect, DraftPick or CompensatoryClaim belongs to a different DraftCycle"
  - id: ERR_BOOKING_RESOURCE_MISMATCH
    http: 422
    condition: "the resource fields supplied do not match the booking_type"
  - id: ERR_BOOKING_NOT_MEDICAL_COMPLETED
    http: 422
    condition: "the referenced booking is not a COMPLETED MEDICAL_EXAM booking for the supplied prospect"
  - id: ERR_PICK_NOT_OWNED_BY_CLUB
    http: 422
    condition: "a traded pick is not PENDING or is not owned by the club that declared it"
  - id: ERR_CONTRACT_PICK_MISMATCH
    http: 422
    condition: "draft_pick_id is missing, mismatched or supplied for the wrong contract origin"
  - id: ERR_PROSPECT_NOT_SELECTABLE
    http: 422
    condition: "the prospect is not ELIGIBLE, has a FAILED medical clearance, is undeclared, or is already drafted"
  - id: ERR_LOTTERY_SEQUENCE_INVALID
    http: 422
    condition: "a drawn combination value is out of range or the sequence cannot fill every lottery slot"
  - id: ERR_CLUB_CODE_DUPLICATE
    http: 409
    condition: "club_code already exists inside the same draft cycle"
  - id: ERR_ALREADY_DECLARED
    http: 409
    condition: "DECLARE is attempted on a prospect that is not UNDECLARED"
  - id: ERR_WAIVER_ROUNDS_EXHAUSTED
    http: 409
    condition: "REQUEST_INFO is attempted after WAIVER_MAX_INFO_REQUESTS information requests"
  - id: ERR_TRADE_ROUNDS_EXHAUSTED
    http: 409
    condition: "a counter is attempted after TRADE_MAX_NEGOTIATION_ROUNDS negotiation rounds"
  - id: ERR_OUT_OF_ORDER_NOT_AUTHORIZED
    http: 409
    condition: "a PENDING pick is used while another pick holds the clock without a league authorization or without out_of_order_ack"
  - id: ERR_STATION_SLOT_CONFLICT
    http: 409
    condition: "the buffer-inflated interval overlaps an existing active booking on the same medical station"
  - id: ERR_ROOM_CAPACITY_EXCEEDED
    http: 409
    condition: "the overlapping active booking count on the interview room already equals concurrent_capacity"
  - id: ERR_PROSPECT_ITINERARY_CONFLICT
    http: 409
    condition: "the travel-gap-widened interval overlaps another active booking of the same prospect"
  - id: ERR_NO_ELIGIBLE_PROSPECTS
    http: 422
    condition: "the combine invitation selector pool is empty"
  - id: ERR_TRADE_AUTHORIZATION_SUSPENDED
    http: 403
    condition: "a party club's trade_authorization_tier is SUSPENDED"
  - id: ERR_TRADE_VALUE_IMBALANCED
    http: 422
    condition: "imbalance_ratio exceeds TRADE_TOLERANCE_RATIO at acceptance"
  - id: ERR_NO_TIMEOUTS_REMAINING
    http: 409
    condition: "TIMEOUT is requested by a club with timeouts_remaining 0"
  - id: ERR_ROOKIE_POOL_EXCEEDED
    http: 422
    condition: "signing the contract would push the club's SIGNED first-year charges above rookie_pool_total_cents"
  - id: ERR_UDFA_POOL_EXHAUSTED
    http: 422
    condition: "the requested UDFA signing bonus exceeds the club's udfa_pool_remaining_cents"

roles:
  - name: LeagueDraftAdmin
    description: "League office operator running cycle phases, the lottery, the draft order, the selection clock, share decisions and claim verification"
    identity: "opaque"
    exclusive_operations:
      - "POST /draft-ops/draft-cycles"
      - "POST /draft-ops/draft-cycles/{id}/phase"
      - "POST /draft-ops/draft-cycles/{id}/lottery"
      - "POST /draft-ops/draft-cycles/{id}/draft-order/finalize"
      - "POST /draft-ops/draft-cycles/{id}/clock/advance"
      - "POST /draft-ops/draft-cycles/{id}/combine-invitations/select"
      - "POST /draft-ops/clubs"
      - "POST /draft-ops/prospects"
      - "POST /draft-ops/medical-stations"
      - "POST /draft-ops/interview-rooms"
      - "POST /draft-ops/combine-bookings"
      - "POST /draft-ops/combine-bookings/{id}/status"
      - "POST /draft-ops/medical-record-shares/{id}/decision"
      - "POST /draft-ops/compensatory-claims/{id}/verify"
      - "POST /draft-ops/pick-trades/{id}/conditional-resolution"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /draft-ops/prospects/{id}/combine-invitation (INVITE and WITHDRAW only)"
      - "POST /draft-ops/draft-picks/{id}/clock-action (FORFEIT and AUTHORIZE_OUT_OF_ORDER only)"
      - "POST /draft-ops/pick-trades/{id}/termination (RESCIND only)"
      - "all GET endpoints"

  - name: ClubGM
    description: "Club general manager who trades picks, makes selections, spends timeouts, files compensatory claims and offers contracts"
    identity: "entity_backed:Club"
    exclusive_operations:
      - "POST /draft-ops/pick-trades"
      - "POST /draft-ops/pick-trades/{id}/counter"
      - "POST /draft-ops/pick-trades/{id}/accept"
      - "POST /draft-ops/draft-picks/{id}/selections"
      - "POST /draft-ops/compensatory-claims"
      - "POST /draft-ops/player-contracts"
    shared_operations:
      - "POST /draft-ops/draft-picks/{id}/clock-action (PASS and TIMEOUT only)"
      - "POST /draft-ops/pick-trades/{id}/termination (WITHDRAW and REJECT only)"
      - "POST /draft-ops/player-contracts/{id}/status (VOID only)"
      - "POST /draft-ops/medical-record-shares (STANDARD confidentiality_tier evaluations only)"
      - "GET endpoints scoped to the acting club"

  - name: ClubMedicalDirector
    description: "Club medical staff cleared to request and read RESTRICTED medical evaluations for the club"
    identity: "entity_backed:Club"
    exclusive_operations:
      - "POST /draft-ops/medical-record-shares against a RESTRICTED confidentiality_tier evaluation"
    shared_operations:
      - "POST /draft-ops/medical-record-shares (STANDARD tier, shared with ClubGM)"
      - "GET /draft-ops/medical-evaluations and GET /draft-ops/medical-evaluations/{id}"
      - "GET /draft-ops/medical-record-shares and GET /draft-ops/medical-record-shares/{id}"

  - name: CombineMedicalExaminer
    description: "League-contracted examiner who files medical evaluations for completed combine medical exams"
    identity: "opaque"
    exclusive_operations:
      - "POST /draft-ops/medical-evaluations"
    shared_operations:
      - "GET /draft-ops/combine-bookings and GET /draft-ops/combine-bookings/{id}"
      - "GET /draft-ops/medical-evaluations and GET /draft-ops/medical-evaluations/{id}"
      - "GET /draft-ops/prospects/{id} and GET /draft-ops/draft-cycles/{id}/prospects"

  - name: EligibilityCommittee
    description: "League eligibility committee member who determines prospect eligibility and reviews waivers under segregation of duties"
    identity: "opaque"
    exclusive_operations:
      - "POST /draft-ops/prospects/{id}/eligibility-determination"
      - "POST /draft-ops/eligibility-waivers/{id}/review (OPEN_REVIEW, REQUEST_INFO, GRANT, DENY)"
    shared_operations:
      - "GET /draft-ops/prospects/{id} and GET /draft-ops/draft-cycles/{id}/prospects"
      - "GET /draft-ops/prospects/{id}/eligibility-waivers"
      - "GET /draft-ops/draft-cycles/{id}/clubs"

  - name: ProspectAgent
    description: "Certified agent acting for one prospect: declaration, invitation response, consent, waiver filing and contract countersignature"
    identity: "entity_backed:Prospect"
    exclusive_operations:
      - "POST /draft-ops/prospects/{id}/declaration"
      - "POST /draft-ops/prospects/{id}/consent"
      - "POST /draft-ops/prospects/{id}/eligibility-waivers"
    shared_operations:
      - "POST /draft-ops/prospects/{id}/combine-invitation (ACCEPT and DECLINE only)"
      - "POST /draft-ops/eligibility-waivers/{id}/review (WITHDRAW only)"
      - "POST /draft-ops/player-contracts/{id}/status (SIGN only)"
      - "GET endpoints scoped to the represented prospect"
