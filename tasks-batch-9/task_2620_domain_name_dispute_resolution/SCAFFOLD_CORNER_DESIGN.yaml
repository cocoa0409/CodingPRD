  - section: consistency_model
    note: |
      complexity_profile.consistency_model is `immediate`, so every derived field, counter and
      cross-entity status change must already be true in the mutating call's own response body -
      there is no lag, no re-read requirement and no denormalised field that settles later.
    instances:
      - name: derived_fields_and_counters_are_already_settled_in_the_mutating_response
        claim_type: correct_result
        grounds:
          - complexity_profile.consistency_model
          - calculations.case_ledger_reconciliation
          - calculations.panelist_conflict_score
          - calculations.panelist_honoraria_allocation
        distinguishing_aspect: "Three writes are checked twice each - once in the body the write itself returned and once by an immediate independent read - and the two must agree exactly. The screening response in particular has to carry conflict_score, honoraria_cents and accepted_at all at once, while the case row it never returns has already moved to PANEL_CONSTITUTED."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9044; domain immediate.example; complainant Immediate Ltd (country_code GB); panelist Bram de Vries (NL); a single-member case driven to RESPONSE_RECEIVED with nothing paid yet."
