              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2026, claimed_points: 500, expected_community_version: "${comm_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { std_id: $.data.id }
            - call: "POST /floodplain/higher-standards/${std_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2026, cycle_start_date: "2026-01-01T00:00:00Z", cycle_end_date: "2026-12-31T00:00:00Z", due_at: "2026-09-30T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_id: $.data.id }
            - call: "POST /floodplain/crs-cycles/${cycle_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/higher-standards/${std_id}/verify"
              payload: { decision: "VERIFY" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/crs-cycles/${cycle_id}/verify-visit"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          trigger:
            - call: "POST /floodplain/crs-cycles/${cycle_id}/certify"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "HigherStandard.${std_id}.max_points_allowed == 500"
            - "HigherStandard.${std_id}.verified_points == 500"
            - "CrsCycle.${cycle_id}.total_verified_points == 500"
            - "CrsCycle.${cycle_id}.provisional_class == 9"
            - "CrsCycle.${cycle_id}.resulting_class == 9"
            - "CrsCycle.${cycle_id}.status == CERTIFIED"
            - "Community.${comm_id}.crs_class == 9"

      - name: datum_conversion_accepts_certificate_at_exactly_zero_margin
        grounds:
          - calculations.certificate_datum_normalization
          - calculations.required_lowest_floor_elevation
          - state_machines.ElevationCertificate.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          A NGVD29 reading of 14.35 ft normalizes to 13.5 ft NAVD88 and produces
          freeboard_margin_ft exactly 0.0, which the inclusive ">= 0.0" acceptance test
          admits; the same survey read as 14.29 ft would normalize to 13.4 and be rejected.
        test_recipe:
          setup:
            - "Community freeboard_ft 1.5, EFFECTIVE AE panel BFE 12.0, so the permit requirement is 13.5 ft."
            - "Permit ISSUED and a FINISHED_CONSTRUCTION certificate filed in NGVD29 at 14.35 ft, status SUBMITTED."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0141", mapped_area_code: "RLA-1", owner_name: "R Owner", owner_email: "r@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 2025, market_value_usd: 310000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 200000.00, proposed_lowest_floor_elevation_ft: 13.5 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /floodplain/permits/${permit_id}/submit"
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /floodplain/permits/${permit_id}/review"
              payload: { decision: "APPROVE" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/permits/${permit_id}/issue"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/elevation-certificates"
              payload: { permit_id: "${permit_id}", structure_id: "${struct_id}", certificate_type: "FINISHED_CONSTRUCTION", datum: "NGVD29", measured_lowest_floor_ft: 14.35, measured_bfe_ft: 12.85, surveyor_license_no: "TX-RPLS-9002" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /floodplain/elevation-certificates/${cert_id}/review"
              payload: { decision: "ACCEPT" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "DevelopmentPermit.${permit_id}.required_lowest_floor_elevation_ft == 13.5"
            - "ElevationCertificate.${cert_id}.normalized_lowest_floor_ft == 13.5"
            - "ElevationCertificate.${cert_id}.freeboard_margin_ft == 0.0"
            - "ElevationCertificate.${cert_id}.status == ACCEPTED"
            - "ElevationCertificate.${cert_id}.retention_review_due_at == 2031-08-01T00:00:00Z"
            - "Structure.${struct_id}.compliance_status == COMPLIANT"
            - "Structure.${struct_id}.lowest_floor_elevation_ft == 13.5"

