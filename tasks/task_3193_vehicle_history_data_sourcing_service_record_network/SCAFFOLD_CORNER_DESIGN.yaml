            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "INSURER", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { ins: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /sources/${ins}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 2, payload_ref: "a1", idempotency_key: "k-a1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${ins}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 2, payload_ref: "a2", idempotency_key: "k-a2" }
              as: SourceOperator
              as_user_id: "${ins}"
              captures: { r2: $.data.id, s2: $.data.confidence_score }
          assert:
            - "Cross-source record accepted: r2 != r1, both ACTIVE"
            - "s2 == 60 (40 + cross-type 20, reliability 1.0)"

