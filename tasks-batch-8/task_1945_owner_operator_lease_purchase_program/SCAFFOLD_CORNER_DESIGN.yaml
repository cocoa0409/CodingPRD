# =============================================================================
# Task 1945 — Owner-Operator Lease-Purchase Program
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: walks the claim-extraction guide against §1.1–§1.7.
# Instances already exercised by §1.8 are emitted as excluded_because stubs.
# All names are unique across scaffold_difficulty_design ∪ scaffold_corner_design.
#
# Shared fixture conventions (each instance replays from empty DB):
#   default logical clock 2026-08-01T00:00:00Z; lease start 2026-08-03, term 52
#   (term end 2027-08-02); standard terms weekly 65000 / escrow 20000 / guarantee
#   150000 / buyout base 4500000; required docs W9, OPERATING_AUTHORITY,
#   INSURANCE_CERTIFICATE (verified with expires_on 2027-08-01 unless stated).
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: owner_operator_create_missing_cdl_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.OwnerOperator.fields.cdl_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "cdl_number is a required input field; omitting it fails request validation before any persistence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "No License" }, as: LeaseAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST (http 400)"

      - name: owner_operator_classification_defaults_pending_review
        claim_type: defaults
        grounds: [entities.OwnerOperator.fields.classification_status]
        distinguishing_aspect: "A freshly created operator carries classification_status PENDING_REVIEW and version 1 without any client input for those fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-ENT2" }, as: LeaseAdmin, captures: { op: $.data.id } }
          assert:
            - "OwnerOperator.${op}.classification_status == PENDING_REVIEW"
            - "OwnerOperator.${op}.version == 1"
            - "OwnerOperator.${op}.id is a server-minted UUID (no type prefix)"

      - name: truck_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TRUCK_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown truck id yields ERR_TRUCK_NOT_FOUND (404), never a 500 or empty body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /lease-program/trucks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: LeaseAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_TRUCK_NOT_FOUND"

      - name: compliance_doc_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ComplianceDocument.fields.doc_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "doc_type is a closed enum {W9, OPERATING_AUTHORITY, INSURANCE_CERTIFICATE, MEDICAL_CARD}; 'CDL' is rejected."
        test_recipe:
          setup: ["one registered operator"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-ENT4" }, as: LeaseAdmin, captures: { op: $.data.id } }
          trigger:
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "CDL", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: truck_create_extra_field_input_ignored
        claim_type: system_fields
        grounds: [entities.Truck.fields.vin]
        distinguishing_aspect: "Undeclared body fields (fleet_tag) are ignored: create succeeds and the response carries no such field."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-ENT5", year: 2023, make: "Mack", model: "Anthem", odometer_current: 10000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000, fleet_tag: "IGNORED" }, as: LeaseAdmin, captures: { truck: $.data.id } }
          assert:
            - "create returns 201 with Truck.${truck}.status == AVAILABLE"
            - "response data has no fleet_tag key"

      - name: common_fields_version_increments_on_mutation
        claim_type: system_fields
        grounds: [entities.LeaseAgreement.fields.status, state_machines.LeaseAgreement.APPLICATION_to_ACTIVE]
        distinguishing_aspect: "version starts at 1 on create and increments by exactly 1 on the activate mutation; updated_at is refreshed."
        test_recipe:
          setup: ["VERIFIED operator, AVAILABLE truck, APPLICATION lease"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-ENT6" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-ENT6", year: 2023, make: "Volvo", model: "VNL", odometer_current: 15000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin, captures: { v1: $.data.version } }
          assert:
            - "captured v0 == 1"
            - "captured v1 == 2 (exactly +1 on the activate mutation)"
            - "LeaseAgreement.${lease}.status == ACTIVE"

      - name: generic_get_not_found_sample_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_QUOTE_NOT_FOUND]", "errors[ERR_SETTLEMENT_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "The existence tier applies uniformly: unknown quote and settlement ids each yield their resource-specific 404 error_id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /lease-program/buyout-quotes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: LeaseAdmin, captures: { err1: $.data.error_id } }
            - { call: "GET /lease-program/settlement-statements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SettlementClerk, captures: { err2: $.data.error_id } }
          assert:
            - "captured err1 == ERR_QUOTE_NOT_FOUND"
            - "captured err2 == ERR_SETTLEMENT_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: settlement_finalize_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SettlementStatement.ISSUED_to_FINALIZED", "errors[ERR_SETTLEMENT_NOT_FINALIZABLE]"]
        distinguishing_aspect: "FINALIZE is only valid from ISSUED; a DRAFT settlement rejects with ERR_SETTLEMENT_NOT_FINALIZABLE and stays DRAFT."
        test_recipe:
          setup: ["ACTIVE lease (standard terms), W1 settlement created and left in DRAFT"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-SM1" }, as: LeaseAdmin, captures: { op: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-SM1", year: 2023, make: "Freightliner", model: "Cascadia", odometer_current: 60000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-03", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st: "$.data.id" } }
          trigger:
            - { call: "POST /lease-program/settlement-statements/${st}/finalize", payload: {}, as: SettlementClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_SETTLEMENT_NOT_FINALIZABLE"
            - "SettlementStatement.${st}.status == DRAFT (unchanged)"

      - name: settlement_dispute_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SettlementStatement.ISSUED_to_DISPUTED", "errors[ERR_SETTLEMENT_NOT_ISSUED]"]
        distinguishing_aspect: "DISPUTE is only valid from ISSUED; a DRAFT settlement rejects with ERR_SETTLEMENT_NOT_ISSUED even when the caller owns the lease."
        test_recipe:
          setup: ["ACTIVE lease (standard terms), W1 settlement in DRAFT"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-SM2" }, as: LeaseAdmin, captures: { op: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-SM2", year: 2023, make: "Kenworth", model: "T680", odometer_current: 61000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-03", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st: "$.data.id" } }
          trigger:
            - { call: "POST /lease-program/settlement-statements/${st}/dispute", payload: {}, as: Driver, as_user_id: "${op}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_SETTLEMENT_NOT_ISSUED"
            - "SettlementStatement.${st}.status == DRAFT (unchanged)"

      - name: lease_cure_from_active_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.LeaseAgreement.DEFAULTED_to_ACTIVE", "errors[ERR_LEASE_NOT_DEFAULTED]"]
        distinguishing_aspect: "cure-default is only valid from DEFAULTED; an ACTIVE lease rejects with ERR_LEASE_NOT_DEFAULTED regardless of payment amount."
        test_recipe:
          setup: ["ACTIVE lease (standard terms), no short payments"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-SM3" }, as: LeaseAdmin, captures: { op: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-SM3", year: 2023, make: "Peterbilt", model: "579", odometer_current: 62000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
          trigger:
            - { call: "POST /lease-program/lease-agreements/${lease}/cure-default", payload: { arrears_payment_cents: 100 }, as: LeaseAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_LEASE_NOT_DEFAULTED"
            - "LeaseAgreement.${lease}.status == ACTIVE (unchanged)"

      - name: lease_complete_before_term_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.LeaseAgreement.ACTIVE_to_COMPLETED", "errors[ERR_LEASE_TERM_NOT_REACHED]"]
        distinguishing_aspect: "complete requires clock >= start_date + term_weeks*7d (2027-08-02); at 2026-08-12 the lease rejects with ERR_LEASE_TERM_NOT_REACHED."
        test_recipe:
          setup: ["ACTIVE lease (start 2026-08-03, term 52), clock at 2026-08-12"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-SM4" }, as: LeaseAdmin, captures: { op: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-SM4", year: 2023, make: "Volvo", model: "VNL", odometer_current: 63000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
          trigger:
            - { call: "POST /lease-program/lease-agreements/${lease}/complete", payload: {}, as: LeaseAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_LEASE_TERM_NOT_REACHED"
            - "LeaseAgreement.${lease}.status == ACTIVE (unchanged)"

      - name: lease_terminate_terminal_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.LeaseAgreement.ACTIVE_to_TERMINATED", "errors[ERR_LEASE_ALREADY_TERMINAL]"]
        distinguishing_aspect: "TERMINATED is terminal: a second terminate on the same lease rejects with ERR_LEASE_ALREADY_TERMINAL and no side effects refire."
        test_recipe:
          setup: ["ACTIVE lease (standard terms) terminated once"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-SM5" }, as: LeaseAdmin, captures: { op: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-SM5", year: 2023, make: "Mack", model: "Anthem", odometer_current: 64000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/lease-agreements/${lease}/terminate", payload: {}, as: LeaseAdmin }
          trigger:
            - { call: "POST /lease-program/lease-agreements/${lease}/terminate", payload: {}, as: LeaseAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_LEASE_ALREADY_TERMINAL"
            - "LeaseAgreement.${lease}.status == TERMINATED (unchanged)"

      - name: escrow_disburse_not_pending_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.EscrowAccount.REFUND_PENDING_to_REFUNDED", "errors[ERR_ESCROW_NOT_REFUNDABLE]"]
        distinguishing_aspect: "disburse requires REFUND_PENDING; an ACCUMULATING escrow (active lease, balance 0) rejects with ERR_ESCROW_NOT_REFUNDABLE."
        test_recipe:
          setup: ["ACTIVE lease (standard terms); its EscrowAccount is ACCUMULATING"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-SM6" }, as: LeaseAdmin, captures: { op: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
