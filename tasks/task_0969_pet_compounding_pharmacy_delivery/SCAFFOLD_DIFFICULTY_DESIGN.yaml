            - { call: "POST /shipments/${shp}/temperature-readings", payload: { recorded_at: "2026-05-01T09:30:00Z", temp_celsius: 9 }, as: PharmacyTech }
            - { call: "GET /shipments/${shp}", payload: {}, as: PharmacyTech, captures: { tstat: $.data.transit_status, cc: $.data.cold_chain_status, acc: $.data.excursion_minutes_accumulated } }
