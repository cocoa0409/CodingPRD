scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: dual-variant calculations across DIFFERENT entity domains (>= 2)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: withdrawal_qualified_vs_non_qualified
        grounds:
          - calculations.withdrawal_basis_earnings_split
          - calculations.non_qualified_penalty
          - state_machines.Withdrawal.DISBURSED_to_CLASSIFIED
          - entities.Withdrawal.fields.penalty_cents
          - entities.Withdrawal.fields.qualified_amount_cents
        distinguishing_aspect: |
          Same Withdrawal entity, same requested/basis/earnings inputs, two valid
          classifications produce different tax outcomes: qualified leaves
          penalty_cents == 0 while non_qualified yields penalty_cents > 0 keyed
          off the proportional earnings share. Domain: Withdrawal lifecycle / tax
          characterization.
        test_recipe:
          setup:
            - "Seed StateRule NY with deduction_cap=$5000, parity=PARITY, lifetime_aggregate_cap=$500000"
            - "Create Donor in NY; Beneficiary as CHILD; Account in NY plan"
            - "Settle three Contributions to bring Account to basis=$6000, earnings=$4000, total=$10000 (manipulate by repeated settles and a small non-qualified withdrawal pre-test to seed earnings)"
            - "Submit Withdrawal W_q requested_amount_cents=100000 expense_category=POST_SECONDARY_TUITION and disburse"
            - "Attach EducationExpense for W_q with category POST_SECONDARY_TUITION, amount=100000, incurred_on in current calendar year; classify W_q"
            - "Submit Withdrawal W_nq requested_amount_cents=100000 expense_category=NON_QUALIFIED on same Account (post-W_q balances reflect first withdrawal); disburse and classify"
          trigger:
            - "POST /withdrawals/{W_q.id}/disburse then /classify"
            - "POST /withdrawals/{W_nq.id}/disburse then /classify"
          assert:
            - "W_q.qualified_amount_cents == 100000"
            - "W_q.non_qualified_amount_cents == 0"
            - "W_q.penalty_cents == 0"
            - "W_nq.qualified_amount_cents == 0"
            - "W_nq.non_qualified_amount_cents == 100000"
            - "W_nq.penalty_cents > 0"
            - "W_q.earnings_portion_cents and W_nq.earnings_portion_cents may differ because earnings_ratio changed between the two disbursements; the DUAL-variant signal is in penalty_cents (0 vs >0) on identical category-flipped inputs"

      - name: state_tax_credit_in_state_vs_cross_state
        grounds:
          - calculations.state_tax_benefit_credit
          - state_machines.Contribution.PENDING_to_SETTLED
          - entities.StateRule.fields.parity
          - entities.Donor.fields.ytd_state_deduction_used_cents
        distinguishing_aspect: |
          Same Contribution amount on a Donor with identical residence StateRule,
          but the account.state_plan_code differs between two siblings: the
          IN_STATE_ONLY rule produces credit_cents == amount (up to cap), while
          the cross-state target produces credit_cents == 0. Different entity
          domain (Donor/Contribution credit math, NOT withdrawal characterization).
        test_recipe:
          setup:
            - "Seed StateRule NY (parity=IN_STATE_ONLY, deduction_cap_cents=500000)"
            - "Seed StateRule UT (parity=IN_STATE_ONLY, deduction_cap_cents=300000)"
            - "Create Donor in NY (state_of_residence=NY) with ytd_state_deduction_used_cents=0"
            - "Open Account A_NY with state_plan_code=NY and Account A_UT with state_plan_code=UT (same donor, same beneficiary)"
            - "Create Contribution C_NY amount=200000 on A_NY, donor_id=Donor.id"
            - "Create Contribution C_UT amount=200000 on A_UT, donor_id=Donor.id"
          trigger:
            - "POST /contributions/{C_NY.id}/settle"
            - "POST /contributions/{C_UT.id}/settle"
          assert:
            - "After settling C_NY, Donor.ytd_state_deduction_used_cents == 200000"
            - "After settling C_UT, Donor.ytd_state_deduction_used_cents == 200000 (UNCHANGED — cross-state under IN_STATE_ONLY yields zero credit)"

  # =========================================================================
  # Rule 2: combinatorial formula across DIFFERENT modes (>= 2)
  # Modes: (a) >=3 inputs non-linear, (b) nested rounding, (c) circular eval-order
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: k12_cap_three_input_min
        grounds:
          - calculations.k12_cap_application
          - entities.Withdrawal.fields.expense_category
          - entities.Beneficiary.fields.k12_ytd_qualified_cents
          - entities.EducationExpense.fields.amount_cents
        distinguishing_aspect: |
          Mode (a): qualified_amount_cents = min(requested, receipts_total,
          cap_room) — three inputs, conditional branch on expense_category, and
          the cap_room input is itself an aggregation over OTHER accounts for
          the same beneficiary. No nested rounding here; the difficulty is the
          conditional inclusion plus the cross-account aggregation.
        test_recipe:
          setup:
            - "Create Beneficiary B with relationship_family_code=CHILD"
            - "Open Account A1 and A2 both with beneficiary_id=B.id"
            - "Drive Beneficiary.k12_ytd_qualified_cents to exactly 800000 via four classified K-12 withdrawals of 200000 each on A1, all with matching EducationExpense receipts"
            - "On A2 with sufficient balance, create Withdrawal W requested_amount_cents=500000 expense_category=K_12"
            - "Disburse W"
            - "Attach EducationExpense receipts to W totaling exactly 500000 with category=K_12"
          trigger:
            - "POST /withdrawals/{W.id}/classify"
          assert:
            - "W.qualified_amount_cents == 200000  # = min(500000, 500000, 1000000-800000)"
            - "W.non_qualified_amount_cents == 300000"
            - "Beneficiary B.k12_ytd_qualified_cents == 1000000 after classify"

      - name: penalty_nested_rounding_order
        grounds:
          - calculations.non_qualified_penalty
          - entities.Withdrawal.fields.penalty_cents
        distinguishing_aspect: |
          Mode (b): the scaffold pins ORDER as `round(earnings_share) then
          round(earnings_share * 0.10)`. The alternative ordering `round(
          earnings_portion * non_qualified / requested * 0.10)` (single
          rounding) produces a different cent. Scaffold's pinned order yields
          penalty=412; single-step yields 411 for inputs 12345/33333/100000.
        test_recipe:
          setup:
            - "Open Account A with seeded balances such that Withdrawal at disbursement records earnings_portion_cents == 12345 (build via specific contribution/withdrawal sequence pinned in PRD examples)"
            - "Submit Withdrawal W requested_amount_cents=100000, expense_category=K_12; disburse W"
            - "Attach EducationExpense receipts of K_12 category totaling 66667 cents (so qualified=66667 and non_qualified=33333)"
          trigger:
            - "POST /withdrawals/{W.id}/classify"
          assert:
            - "W.earnings_portion_cents == 12345"
            - "W.qualified_amount_cents == 66667"
            - "W.non_qualified_amount_cents == 33333"
            - "W.penalty_cents == 412  # nested: round(12345*33333/100000)=4115 then round(4115*0.10)=412"
            - "W.penalty_cents != 411  # single-step rounding (incorrect order) would yield 411"

  # =========================================================================
  # Rule 3: non-linear state-machine shape on DIFFERENT entities (>= 2)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: withdrawal_branching_disburse_or_reject
        grounds:
          - state_machines.Withdrawal.REQUESTED_to_DISBURSED
          - state_machines.Withdrawal.REQUESTED_to_REJECTED
          - state_machines.Withdrawal.DISBURSED_to_CLASSIFIED
          - state_machines.Withdrawal.CLASSIFIED_to_REPORTED
        distinguishing_aspect: |
          Branching fork from REQUESTED: either /disburse (advances to DISBURSED
          with full balance-debit side-effect set) or /reject (advances to
          REJECTED with rejected_reason side-effect and NO balance change). The
          two branches have entirely different side-effect sets — this is the
          branching fork-join shape that §0.5 demands. Entity: Withdrawal.
        test_recipe:
          setup:
            - "Open Account A with total_balance_cents == 500000"
            - "Submit Withdrawal W1 requested_amount_cents=100000, expense_category=POST_SECONDARY_TUITION (REQUESTED)"
            - "Submit Withdrawal W2 requested_amount_cents=100000, expense_category=POST_SECONDARY_TUITION (REQUESTED)"
          trigger:
            - "POST /withdrawals/{W1.id}/disburse"
            - "POST /withdrawals/{W2.id}/reject with rejected_reason=INSUFFICIENT_BALANCE"
          assert:
            - "W1.status == 'DISBURSED' and W1.basis_portion_cents + W1.earnings_portion_cents == 100000"
            - "W2.status == 'REJECTED' and W2.basis_portion_cents IS NULL and W2.earnings_portion_cents IS NULL"
            - "Account.total_balance_cents == 400000  # only W1 debited; W2 left balance unchanged"

      - name: recurring_plan_active_paused_cycle
        grounds:
          - state_machines.RecurringPlan.ACTIVE_to_PAUSED
          - state_machines.RecurringPlan.PAUSED_to_ACTIVE
          - state_machines.RecurringPlan.ACTIVE_to_CANCELLED
          - state_machines.RecurringPlan.PAUSED_to_CANCELLED
        distinguishing_aspect: |
          Cycle ACTIVE → PAUSED → ACTIVE allowed (revision loop), distinct from
          a linear pipeline. Two valid transitions out of PAUSED (resume vs
          cancel) make this both cyclic and branching. Entity: RecurringPlan
          (different from Withdrawal above).
        test_recipe:
          setup:
            - "Open Account A; create RecurringPlan P with cadence_days=30, amount_cents=50000"
          trigger:
            - "POST /recurring-plans/{P.id}/pause"
            - "POST /recurring-plans/{P.id}/resume"
            - "POST /recurring-plans/{P.id}/pause"
            - "POST /recurring-plans/{P.id}/cancel"
          assert:
            - "After 1st pause: P.status == 'PAUSED'"
            - "After resume: P.status == 'ACTIVE' AND P.next_run_at == now() + 30*86400 seconds"
            - "After 2nd pause: P.status == 'PAUSED'"
            - "After cancel: P.status == 'CANCELLED' (terminal)"

  # =========================================================================
  # Rule 4: transitive cascade chains from DIFFERENT triggers (>= 2)
  # one chain depth >= 3, other depth >= 2
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: restrict_pauses_plans_blocks_future_sweep
        grounds:
          - state_machines.Account.OPEN_to_RESTRICTED
          - state_machines.RecurringPlan.ACTIVE_to_PAUSED
          - endpoints["POST /_sweep/run-recurring"]
        distinguishing_aspect: |
          Depth-3 cascade: (1) POST /accounts/{id}/restrict flips Account.status
          OPEN → RESTRICTED; (2) THAT mutation causes every ACTIVE RecurringPlan
          on the account to transition ACTIVE → PAUSED (mutation of B caused by
          mutation of A, not by the original request); (3) the PAUSED state
          THEN causes the next /_sweep/run-recurring to skip those plans (no
          new Contributions materialized). Trigger: /restrict.
        test_recipe:
          setup:
            - "Open Account A; create RecurringPlan P1 and P2 (both ACTIVE) with next_run_at = now() + 1 second"
            - "Advance clock by 2 seconds so both plans are due"
          trigger:
            - "POST /accounts/{A.id}/restrict"
            - "POST /_sweep/run-recurring"
          assert:
            - "Account.status == 'RESTRICTED'"
            - "RecurringPlan P1.status == 'PAUSED' (caused by restrict, not by sweep)"
            - "RecurringPlan P2.status == 'PAUSED'"
            - "Sweep returned an empty Contribution[] (no plans eligible after restrict cascade)"

      - name: close_cancels_plans
        grounds:
          - state_machines.Account.OPEN_to_CLOSED
          - state_machines.RecurringPlan.ACTIVE_to_CANCELLED
          - state_machines.RecurringPlan.PAUSED_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 cascade: (1) POST /accounts/{id}/close flips Account.status
          OPEN → CLOSED; (2) THAT mutation causes every RecurringPlan with
          status IN {ACTIVE, PAUSED} on the account to transition to CANCELLED.
          Different trigger from /restrict; different terminal effect (CANCELLED
          is terminal, PAUSED is not). Origin: /close.
        test_recipe:
          setup:
            - "Open Account A with zero balance; create RecurringPlan P1 (ACTIVE) and P2 (after pause: PAUSED)"
            - "Verify Account.total_balance_cents == 0 (precondition for close)"
          trigger:
            - "POST /accounts/{A.id}/close"
          assert:
            - "Account.status == 'CLOSED'"
            - "P1.status == 'CANCELLED'  # caused by close, not by direct cancel call"
            - "P2.status == 'CANCELLED'  # PAUSED → CANCELLED path"

  # =========================================================================
  # Rule 5: validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_priority
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - errors.ERR_ACCOUNT_RESTRICTED
          - errors.ERR_LIFETIME_CAP_WOULD_EXCEED
        distinguishing_aspect: |
          Category pair: `state` (priority 6, ERR_ACCOUNT_RESTRICTED) vs
          `business_fiscal` (priority 15, ERR_LIFETIME_CAP_WOULD_EXCEED). Dual-
          failure: restrict an account AND attempt a contribution that would
          ALSO breach the lifetime cap. The state check fires first
          (ERR_ACCOUNT_RESTRICTED), not the fiscal one. Different category pair
          from the second instance below.
        test_recipe:
          setup:
            - "Seed StateRule with lifetime_aggregate_cap_cents = 1000000"
            - "Open Account A; settle a Contribution of 900000 (Account.total=900000, cap=1000000)"
            - "Restrict Account A"
            - "Create Contribution C of amount=200000 (would breach both cap and restricted-state)"
          trigger:
            - "POST /contributions/{C.id}/settle"
          assert:
            - "Response status code 409 and error_id == 'ERR_ACCOUNT_RESTRICTED' (state precedes fiscal)"
            - "error_id != 'ERR_LIFETIME_CAP_WOULD_EXCEED'"

      - name: business_safety_vs_business_constraint_priority
        grounds:
          - validations[priority=13]
          - validations[priority=16]
          - errors.ERR_BENEFICIARY_GENERATION_SKIP
          - errors.ERR_K12_CAP_EXCEEDED
        distinguishing_aspect: |
          Category pair: `business_safety` (priority 13, ERR_BENEFICIARY_GENERATION_SKIP)
          vs `business_constraint` (priority 16, ERR_K12_CAP_EXCEEDED). A
          single transaction that approves a generation-skipping beneficiary
          change AND creates a K-12 withdrawal beyond cap can only be
          orchestrated against two endpoints, so split: contrast a generation-
          skip approval failing with the safety error against an unrelated
          K-12-beyond-cap withdrawal failing with the constraint error to
          confirm distinct error categories surfacing at distinct priorities.
          (Different pair than instance 1: safety vs constraint, not state vs
          fiscal.)
        test_recipe:
          setup:
            - "Open Account A with current Beneficiary B_CHILD (relationship_family_code=CHILD)"
            - "Register new Beneficiary B_PARENT (relationship_family_code=PARENT) — generation-skip upward"
            - "Submit BeneficiaryChangeRequest BCR proposing B_PARENT"
            - "Separately: register Beneficiary B2 with k12_ytd_qualified_cents already at 1000000 (via classified K-12 withdrawals on a sibling account)"
            - "Open Account A2 with beneficiary_id=B2.id, fund A2"
          trigger:
            - "POST /beneficiary-change-requests/{BCR.id}/approve"
            - "POST /accounts/{A2.id}/withdrawals with requested_amount_cents=1 and expense_category=K_12"
          assert:
            - "BCR.approve response 422 with error_id == 'ERR_BENEFICIARY_GENERATION_SKIP'"
            - "/withdrawals response 422 with error_id == 'ERR_K12_CAP_EXCEEDED'"
            - "Both error_ids differ in category (safety vs constraint), priority (13 vs 16), and endpoint"

  # =========================================================================
  # Rule 6: boundary-precision checks on DIFFERENT metrics/endpoints (>= 2)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: k12_cap_exact_boundary_inclusive
        grounds:
          - validations[priority=16]
          - calculations.k12_cap_application
          - errors.ERR_K12_CAP_EXCEEDED
        distinguishing_aspect: |
          Numeric boundary on the K-12 annual cap. A withdrawal request that
          consumes the LAST cent of cap_room (req=cap_room exactly) is ALLOWED;
          req=cap_room+1 is REJECTED at create. The boundary is `<=` not `<`.
          Metric: K-12 dollars on /accounts/{id}/withdrawals.
        test_recipe:
          setup:
            - "Beneficiary B with k12_ytd_qualified_cents = 999999 (cap_room=1)"
            - "Open Account A with beneficiary_id=B.id and total_balance_cents >= 2"
          trigger:
            - "POST /accounts/{A.id}/withdrawals with requested_amount_cents=1, expense_category=K_12"
            - "POST /accounts/{A.id}/withdrawals with requested_amount_cents=2, expense_category=K_12"
          assert:
            - "First call returns 201 (boundary inclusive: 1 <= 1)"
            - "Second call returns 422 with error_id == 'ERR_K12_CAP_EXCEEDED'"

      - name: zero_balance_close_empty_set
        grounds:
          - state_machines.Account.OPEN_to_CLOSED
          - validations[priority=7]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Empty-set / zero-quantity boundary on a DIFFERENT metric and DIFFERENT
          endpoint. Closing an account requires Account.total_balance_cents
          == 0 exactly AND zero non-terminal Withdrawals (empty set); balance
          == 1 cent rejects with ERR_INVALID_STATE. Endpoint: POST /accounts/{id}/close.
        test_recipe:
          setup:
            - "Open Account A1 with total_balance_cents == 0 (no contributions)"
            - "Open Account A2; settle Contribution of 1 cent so total_balance_cents == 1"
            - "Open Account A3; settle Contribution of 0 (not allowed; instead) → A3 has balance==0 but one Withdrawal in REQUESTED state"
          trigger:
            - "POST /accounts/{A1.id}/close"
            - "POST /accounts/{A2.id}/close"
            - "POST /accounts/{A3.id}/close"
          assert:
            - "A1.close succeeds: status==CLOSED"
            - "A2.close returns 409 ERR_INVALID_STATE (balance==1, not zero)"
            - "A3.close returns 409 ERR_INVALID_STATE (non-terminal withdrawal exists, despite zero balance — empty-set check)"

  # =========================================================================
  # Rule 7: cross-entity state dependencies across DIFFERENT entity pairs (>= 2)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contribution_settle_requires_account_open
        grounds:
          - state_machines.Contribution.PENDING_to_SETTLED
          - state_machines.Account.OPEN_to_RESTRICTED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair: Contribution × Account. Contribution.PENDING→SETTLED is
          gated by Account.status == OPEN. If Account is RESTRICTED, the
          contribution stays PENDING and the settle call rejects.
        test_recipe:
          setup:
            - "Open Account A; create Contribution C of 50000 (PENDING)"
            - "Restrict Account A"
          trigger:
            - "POST /contributions/{C.id}/settle"
          assert:
            - "Response 409 error_id == 'ERR_ACCOUNT_RESTRICTED'"
            - "Contribution C.status == 'PENDING' unchanged"

      - name: withdrawal_classify_requires_tax_report_unlocked
        grounds:
          - state_machines.Withdrawal.DISBURSED_to_CLASSIFIED
          - entities.TaxReport.fields.locked
          - validations[priority=8]
        distinguishing_aspect: |
          Different entity pair: Withdrawal × TaxReport (NOT Withdrawal × Account
          and NOT Contribution × Account from instance 1). Withdrawal.DISBURSED
          →CLASSIFIED is gated by the TaxReport for (account_id, tax_year)
          NOT being locked. A locked report blocks the classify transition.
        test_recipe:
          setup:
            - "Open Account A; settle Contribution; create Withdrawal W in 2025 expense_category=POST_SECONDARY_TUITION and disburse it (DISBURSED)"
            - "Do NOT classify W yet"
            - "Create TaxReport TR for (A.id, 2025); finalize TR (TR.locked=true)"
          trigger:
            - "POST /withdrawals/{W.id}/classify"
          assert:
            - "Response 409 error_id == 'ERR_TAX_REPORT_LOCKED'"
            - "Withdrawal W.status == 'DISBURSED' unchanged"

  # =========================================================================
  # Rule 8: resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: recurring_plan_next_run_overlap_with_sweep_window
        grounds:
          - calculations.tax_report_aggregation
          - endpoints["POST /_sweep/run-recurring"]
          - entities.RecurringPlan.fields.next_run_at
        distinguishing_aspect: |
          Half-open interval semantics on the sweep: a RecurringPlan is eligible
          when `next_run_at <= now()` (inclusive boundary). After the sweep,
          next_run_at is advanced by cadence_days*86400 seconds. Two sweeps
          within the same cadence MUST materialize at most one Contribution per
          plan — the second sweep finds next_run_at > now() and skips. The
          interval geometry is "due-or-past-due, single advance per crossing".
        test_recipe:
          setup:
            - "Create RecurringPlan P with cadence_days=30, amount_cents=50000, next_run_at = now() (so P is exactly due)"
          trigger:
            - "POST /_sweep/run-recurring  # first sweep"
            - "POST /_sweep/run-recurring  # second sweep, no clock advance"
          assert:
            - "First sweep returns exactly one Contribution C1 for plan P, status=PENDING"
            - "Second sweep returns empty array (P.next_run_at has advanced past now())"
            - "P.next_run_at == sweep_time + 30*86400 seconds"

      - name: tax_report_year_window_inclusive_exclusive
        grounds:
          - calculations.tax_report_aggregation
          - state_machines.Withdrawal.CLASSIFIED_to_REPORTED
          - entities.TaxReport.fields.tax_year
        distinguishing_aspect: |
          Different interval semantics: CALENDAR-YEAR closed interval on the
          tax_report aggregation, NOT a half-open sweep. A Withdrawal disbursed
          at 2025-12-31T23:59:59.999Z falls in tax_year 2025; one disbursed at
          2026-01-01T00:00:00.000Z falls in 2026. Adjacent intervals must NOT
          double-count and must NOT leave a gap. Resource entity: TaxReport
          (vs RecurringPlan in instance 1).
        test_recipe:
          setup:
            - "Open Account A; fund it"
            - "Advance clock to 2025-12-31T23:59:59.500Z; create+disburse+classify Withdrawal W_2025 (100000 POST_SECONDARY_TUITION with receipts)"
            - "Advance clock to 2026-01-01T00:00:00.500Z; create+disburse+classify Withdrawal W_2026 (200000 POST_SECONDARY_TUITION with receipts for 2026 incurred dates)"
          trigger:
            - "POST /tax-reports for (A.id, 2025)"
            - "POST /tax-reports for (A.id, 2026)"
          assert:
            - "TR_2025.gross_distribution_cents == 100000 (W_2025 only)"
            - "TR_2026.gross_distribution_cents == 200000 (W_2026 only)"
            - "Sum across the two reports == 300000 (no double-count, no gap)"

  # =========================================================================
  # Rule 9: compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: beneficiary_change_preserves_balances
        grounds:
          - state_machines.BeneficiaryChangeRequest.SUBMITTED_to_APPROVED
          - endpoints["POST /beneficiary-change-requests/{id}/approve"]
          - entities.Account.fields.basis_balance_cents
          - entities.Account.fields.earnings_balance_cents
        distinguishing_aspect: |
          Conserved quantity: `(Account.basis_balance_cents, Account.earnings_balance_cents,
          Account.total_balance_cents)` triple. Approving a BeneficiaryChangeRequest
          mutates Account.beneficiary_id and updates Account.updated_at /
          version, but the THREE balance quantities are unchanged. Formula:
          (basis_after, earn_after, total_after) == (basis_before, earn_before,
          total_before).
        test_recipe:
          setup:
            - "Open Account A; settle three contributions to reach total_balance_cents=500000, basis=400000, earnings=100000 (build via specific contribution + non-qualified withdrawal sequence)"
            - "Register new Beneficiary B2 with permissible relationship to current (e.g., SIBLING of CHILD)"
            - "Submit BCR proposing B2"
          trigger:
            - "Read Account A balances (B_before, E_before, T_before) = (400000, 100000, 500000)"
            - "POST /beneficiary-change-requests/{BCR.id}/approve"
            - "Read Account A balances after"
          assert:
            - "Account.beneficiary_id == B2.id (state changed)"
            - "Account.basis_balance_cents == 400000 (UNCHANGED)"
            - "Account.earnings_balance_cents == 100000 (UNCHANGED)"
            - "Account.total_balance_cents == 500000 (UNCHANGED)"

      - name: contribution_reverse_preserves_donor_ytd
        grounds:
          - state_machines.Contribution.PENDING_to_REVERSED
          - entities.Donor.fields.ytd_contribution_total_cents
          - entities.Donor.fields.ytd_state_deduction_used_cents
        distinguishing_aspect: |
          Different conserved quantity: `(Donor.ytd_contribution_total_cents,
          Donor.ytd_state_deduction_used_cents)` pair. Reversing a PENDING
          Contribution must not affect either Donor YTD aggregate (the
          contribution never settled, so it never credited the donor). This is
          a different conserved quantity (donor-aggregated YTD) than the prior
          instance's (per-account balances).
        test_recipe:
          setup:
            - "Create Donor D (NY); register Beneficiary B (CHILD); open Account A in NY"
            - "Settle a baseline Contribution to D.ytd_contribution_total_cents = 100000 (and ytd_state_deduction_used_cents = 100000)"
