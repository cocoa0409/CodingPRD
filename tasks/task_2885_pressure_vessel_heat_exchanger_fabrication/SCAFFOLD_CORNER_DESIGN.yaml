        distinguishing_aspect: "The receiving-inspection resource is exercised end to end on one entity — create, read back by id, appear in a filtered list, then move to the terminal REJECTED state — and the list filter must follow the state change, so a heat rejected for a laminar indication disappears from ?status=QUARANTINE and shows up under ?status=REJECTED with the same id and version 2."
        test_recipe:
          setup:
            - "A QC_INSPECTOR Personnel row exists; no heats exist."
          setup_api_calls:
            - call: "POST /personnel"
