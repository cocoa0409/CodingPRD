    side_effects: []

  # ------------------------------------------------- writes: reference data ---
  - method: POST
    path: "/rostering/schools"
    description: "register a building with its password policy; policy fields fall back to district defaults when omitted"
    roles: [RosterOperator]
    code: 201
    input: [name, sis_school_id, building_code, grade_band, "min_password_length?", "password_requires_mixed_case?", "password_max_age_days?", "password_lockout_threshold?", "temp_password_ttl_hours?"]
    output: School
    side_effects: ["status = ACTIVE; enrolled_student_count = 0"]
  - method: PATCH
    path: "/rostering/schools/{school_id}"
    description: "amend a building's password policy or close the building"
    roles: [RosterOperator, DataGovernanceOfficer]
    code: 200
    input: ["status?", "min_password_length?", "password_requires_mixed_case?", "password_max_age_days?", "password_lockout_threshold?", "temp_password_ttl_hours?"]
    output: School
    side_effects: ["status = CLOSED removes the building from the activate-license candidate set of building_seat_allocation; already-provisioned accounts keep the stored policy values used by password_lifecycle_evaluation", "version incremented"]
  - method: POST
    path: "/rostering/terms"
    description: "create a term with its add/drop cutoff and archive retention"
    roles: [RosterOperator]
    code: 201
    input: [name, school_year, start_date, end_date, add_drop_cutoff_date, instructional_days, "archive_retention_days?"]
    output: Term
    side_effects: ["state = PLANNED; archived_access_expires_at = null"]
  - method: POST
    path: "/rostering/terms/{term_id}/activate"
    description: "open the term for scheduling and rostering (Term PLANNED -> ACTIVE)"
    roles: [RosterOperator]
    code: 200
    input: []
    output: Term
    side_effects: ["Term PLANNED -> ACTIVE", "version incremented"]
  - method: POST
    path: "/rostering/terms/{term_id}/rollover"
    description: "summer rollover: archive the term's sections, release seats and open the archived-access window (Term ACTIVE -> ROLLED_OVER)"
    roles: [DataGovernanceOfficer]
    code: 200
    input: []
    output: Term
    side_effects: ["Term ACTIVE -> ROLLED_OVER with its 4-hop cascade over Section, Enrollment, AppAccount and VendorApp", "archived_access_window: Term.archived_access_expires_at = (end_date + archive_retention_days) at 00:00:00.000Z", "renewal_recommendation_score recomputed onto every affected VendorApp.renewal_score / renewal_recommendation", "version incremented"]
  - method: POST
    path: "/rostering/teachers"
    description: "register a teacher in a building"
    roles: [RosterOperator]
    code: 201
    input: [school_id, sis_staff_id, full_name, email]
    output: Teacher
    side_effects: ["employment_status = ACTIVE"]
  - method: POST
    path: "/rostering/teachers/{teacher_id}/separate"
    description: "record a staff separation; sections lose their match and in-flight runs are held"
    roles: [DataGovernanceOfficer]
    code: 200
    input: [separation_effective_date]
    output: Teacher
    side_effects: ["Teacher ACTIVE -> SEPARATED with its depth-3 cascade: Section.roster_health = UNMATCHED_TEACHER, ErrorQueueItem UNMATCHED_TEACHER raised on affected in-flight runs, SyncRun TRANSFORMED -> HELD and VendorApp.sync_health = BLOCKED", "AppAccount identity_status -> DEPROVISIONED for the teacher's own accounts (SUSPENDED is reserved for summer rollover)", "version incremented"]
  - method: POST
    path: "/rostering/students"
    description: "register a student in a building"
    roles: [RosterOperator]
    code: 201
    input: [school_id, sis_student_id, first_name, last_name, grade_level, date_of_birth, "state_student_id?"]
    output: Student
    side_effects: ["enrollment_state = ENROLLED; active_enrollment_count = 0", "School.enrolled_student_count recomputed"]
  - method: POST
    path: "/rostering/students/{student_id}/withdraw"
    description: "withdraw a student; drops roster rows, releases seats and schedules SSO deprovisioning"
    roles: [DataGovernanceOfficer]
    code: 200
    input: [withdrawal_effective_date]
    output: Student
    side_effects: ["Student ENROLLED -> WITHDRAWN with its depth-4 cascade: Enrollment -> DROPPED, AppAccount seat RELEASED and identity DEPROVISIONED, BuildingAllocation.consumed_seats decremented, VendorApp counters and renewal fields recomputed", "sync_seat_charge refunds via AppAccount.refunded_charge_cents feeding VendorApp.committed_charge_cents", "School.enrolled_student_count recomputed", "version incremented"]

  # -------------------------------------------- writes: schedule and roster ---
  - method: POST
    path: "/rostering/sections"
    description: "create a course section in an ACTIVE term"
    roles: [RosterOperator]
    code: 201
    input: [school_id, term_id, "primary_teacher_id?", sis_section_id, course_code, subject, period_index, meeting_days, max_seats]
    output: Section
    side_effects: ["status = ACTIVE; active_enrollment_count = 0", "roster_health = UNMATCHED_TEACHER when primary_teacher_id is omitted, else OK", "ERR_TEACHER_PERIOD_CONFLICT enforced over the buffered period interval"]
  - method: PATCH
    path: "/rostering/sections/{section_id}"
    description: "amend a section: resize it, cancel it, or attach/replace its primary teacher"
    roles: [RosterOperator]
    code: 200
    input: ["status?", "max_seats?", "primary_teacher_id?"]
    output: Section
    side_effects: ["status = CANCELLED takes every non-DROPPED Enrollment to DROPPED with its seat-release cascade", "setting primary_teacher_id clears roster_health to OK", "version incremented"]
  - method: POST
    path: "/rostering/enrollments"
    description: "add a student to a section; classified IN_WINDOW or LATE_ADD against the term's add/drop cutoff"
    roles: [RosterOperator]
    code: 201
    input: [section_id, student_id, requested_effective_date, "source?"]
    output: Enrollment
    side_effects: ["roster_status = PENDING_ADD; add_drop_class = IN_WINDOW when requested_effective_date <= Term.add_drop_cutoff_date else LATE_ADD", "Enrollment PENDING_ADD -> ACTIVE in the same request when requested_effective_date <= clock date (effective_date = requested_effective_date); a future-dated add stays PENDING_ADD until a publish picks it up", "Section.active_enrollment_count and Student.active_enrollment_count recomputed"]
  - method: POST
    path: "/rostering/enrollments/{enrollment_id}/drop"
    description: "request a mid-year drop with its effective date"
    roles: [RosterOperator]
    code: 200
    input: [drop_effective_date]
    output: Enrollment
    side_effects: ["Enrollment ACTIVE -> PENDING_DROP, or PENDING_ADD -> DROPPED immediately with the conditional seat-release cascade", "Section.active_enrollment_count and Student.active_enrollment_count recomputed", "version incremented"]

  # ----------------------------------------------- writes: licence and seats --
  - method: POST
    path: "/rostering/vendor-apps"
    description: "register a vendor licence in DRAFT with its rostering standard, transformation rules and seat model"
    roles: [VendorIntegrationManager]
    code: 201
    input: [name, vendor_code, term_id, rostering_standard, identifier_strategy, username_domain, "name_format?", grade_band_scope, seat_model, allocation_policy, "block_seats?", "overage_policy?", "unmatched_teacher_policy?", total_seats, price_per_seat_cents]
    output: VendorApp
    side_effects: ["status = DRAFT; created_by_user_id = X-User-ID; unallocated_seats = total_seats; consumed_seats = 0; committed_charge_cents = 0; sync_health = OK"]
  - method: PATCH
    path: "/rostering/vendor-apps/{vendor_app_id}"
    description: "amend or suspend/resume/terminate a licence"
    roles: [VendorIntegrationManager, DataGovernanceOfficer]
    code: 200
    input: ["status?", "total_seats?", "price_per_seat_cents?", "overage_policy?", "unmatched_teacher_policy?"]
    output: VendorApp
    side_effects: ["VendorApp ACTIVE -> SUSPENDED / SUSPENDED -> ACTIVE / -> TERMINATED per the state machine", "TERMINATED releases every seat, deprovisions every identity and dismisses every OPEN ErrorQueueItem", "unallocated_seats recomputed; renewal_recommendation_score recomputed onto renewal_score / renewal_recommendation", "version incremented"]
  - method: POST
    path: "/rostering/vendor-apps/{vendor_app_id}/activate-license"
    description: "activate a DRAFT licence and split its seats across eligible buildings (building_seat_allocation); two-person control against the creator"
    roles: [DataGovernanceOfficer]
    code: 200
    input: []
    output: VendorApp
    side_effects: ["VendorApp DRAFT -> ACTIVE", "building_seat_allocation creates one BuildingAllocation per eligible School", "activated_by_user_id = X-User-ID; unallocated_seats set from the allocation remainder", "version incremented"]
  - method: PATCH
    path: "/rostering/building-allocations/{building_allocation_id}"
    description: "re-cut one building's seat allocation under optimistic concurrency on the parent licence"
    roles: [BuildingLicenseAdmin, DataGovernanceOfficer]
    code: 200
    input: [allocated_seats, expected_vendor_app_version]
    output: BuildingAllocation
    side_effects: ["allocated_seats overwritten; hard_cap re-derived from the licence's overage_policy", "VendorApp.unallocated_seats recomputed and VendorApp.version incremented", "version incremented"]

  # --------------------------------------- writes: identity and seat accounts --
  - method: POST
    path: "/rostering/app-accounts"
    description: "provision an SSO identity and take a seat; admission decided by seat_admission_capacity, username by username_derivation, temporary password by password_lifecycle_evaluation"
    roles: [IdentityAdmin]
    code: 201
    input: [building_allocation_id, subject_type, "student_id?", "teacher_id?", expected_vendor_app_version]
    output: AppAccount
    side_effects: ["seat_status = RESERVED and identity_status = PENDING_PROVISION; PROVISIONED is reached only by a later password-set call, never by create", "username written by username_derivation; password_state = TEMP_SET with password_expires_at from password_lifecycle_evaluation", "seat_admission_capacity increments BuildingAllocation.consumed_seats and, under POOL_FALLBACK overflow, borrowed_seats", "seat_charge_cents set from sync_seat_charge's rate_for_date; VendorApp.consumed_seats, unallocated_seats, committed_charge_cents recomputed and renewal_recommendation_score re-run; VendorApp.version incremented"]
  - method: POST
    path: "/rostering/app-accounts/{app_account_id}/password-set"
    description: "set or reset the account password against the subject building's policy"
    roles: [IdentityAdmin]
    code: 200
    input: [new_password]
    output: AppAccount
    side_effects: ["identity_status PENDING_PROVISION -> PROVISIONED (or SUSPENDED -> PROVISIONED on a post-rollover reactivation); the seat axis is untouched", "password_lifecycle_evaluation: password_state -> USER_SET, last_password_set_at = clock instant, failed_login_count = 0, password_expires_at recomputed", "version incremented"]
  - method: POST
    path: "/rostering/app-accounts/{app_account_id}/record-usage"
    description: "post vendor usage telemetry for one activity date, including failed logins"
    roles: [IdentityAdmin, VendorIntegrationManager]
    code: 200
    input: [activity_date, active_minutes, "session_count?", "failed_logins?"]
    output: AppAccount
    side_effects: ["active_minutes_total, session_count and last_activity_date updated", "password_lifecycle_evaluation: expiry re-evaluated and password_state -> LOCKED once failed_login_count >= School.password_lockout_threshold", "renewal_recommendation_score recomputed onto VendorApp.renewal_score / renewal_recommendation", "version incremented"]
  - method: POST
    path: "/rostering/app-accounts/{app_account_id}/release"
    description: "give the seat back without deprovisioning the identity"
    roles: [IdentityAdmin]
    code: 200
    input: []
    output: AppAccount
    side_effects: ["AppAccount seat axis RESERVED/ACTIVE -> RELEASED", "refunded_charge_cents set; BuildingAllocation.consumed_seats (or borrowed_seats) decremented", "VendorApp.consumed_seats, unallocated_seats, committed_charge_cents recomputed and renewal_recommendation_score re-run; VendorApp.version incremented"]
  - method: POST
    path: "/rostering/app-accounts/{app_account_id}/deprovision"
    description: "deprovision the SSO identity on or after its scheduled date"
    roles: [IdentityAdmin]
    code: 200
    input: [effective_date]
    output: AppAccount
    side_effects: ["AppAccount identity axis -> DEPROVISIONED with deprovision_scheduled_date = effective_date; password_state = EXPIRED", "the seat axis is NOT touched — a deprovisioned identity keeps its RESERVED or ACTIVE seat until release is called (parallel axes)", "renewal_recommendation_score recomputed onto VendorApp.renewal_score / renewal_recommendation", "version incremented"]

  # --------------------------------------- writes: sync pipeline and triage ---
  - method: POST
    path: "/rostering/sync-runs"
    description: "extract the source-of-truth roster for a licence (sync_scope_resolution); supersedes any earlier open run for the same licence"
    roles: [RosterOperator]
    code: 201
    input: [vendor_app_id, run_type]
    output: SyncRun
    side_effects: ["state = EXTRACTED; initiated_by_user_id = X-User-ID; extracted_at = clock instant", "sync_scope_resolution writes extracted_section_count and extracted_enrollment_count", "any earlier non-terminal SyncRun of the licence -> SUPERSEDED and its OPEN ErrorQueueItems -> DISMISSED", "archived_access_window gates run_type == ROLLOVER"]
  - method: POST
    path: "/rostering/sync-runs/{sync_run_id}/transform"
    description: "apply the vendor's transformation rules, project seats and charges, and raise the triage queue"
    roles: [RosterOperator]
    code: 200
    input: []
    output: SyncRun
    side_effects: ["SyncRun EXTRACTED -> TRANSFORMED, or -> HELD when a BLOCKING defect is raised", "sync_scope_resolution writes transformed_record_count; sync_seat_charge PROVISIONAL_TRANSFORM writes projected_seat_delta and projected_charge_cents", "one ErrorQueueItem per defect; blocking_error_count and advisory_error_count set", "transform_count incremented; transformed_at = clock instant; VendorApp.sync_health = BLOCKED on HELD", "version incremented"]
  - method: POST
    path: "/rostering/sync-runs/{sync_run_id}/publish"
    description: "publish the transformed roster to the vendor; two-person control against the run's initiator"
    roles: [DataGovernanceOfficer]
    code: 200
    input: []
    output: SyncRun
    side_effects: ["SyncRun TRANSFORMED -> PUBLISHED", "Enrollment PENDING_ADD -> ACTIVE (effective_date stamped) and PENDING_DROP -> DROPPED with seat release", "sync_seat_charge FINAL_PUBLISH writes published_seat_delta and published_charge_cents; the reconciliation delta is observable as published_charge_cents - projected_charge_cents and is never posted into VendorApp.committed_charge_cents", "remaining ADVISORY ErrorQueueItems -> DISMISSED", "renewal_recommendation_score recomputed onto VendorApp.renewal_score / renewal_recommendation; VendorApp.sync_health = OK", "published_by_user_id = X-User-ID; published_at = clock instant", "version incremented"]
  - method: POST
    path: "/rostering/error-queue-items/{error_queue_item_id}/resolve-match"
    description: "triage an unmatched teacher by attaching a replacement teacher to the section"
    roles: [DataGovernanceOfficer]
    code: 200
    input: [replacement_teacher_id, "resolution_note?"]
    output: ErrorQueueItem
    side_effects: ["ErrorQueueItem OPEN -> RESOLVED_MATCHED; resolved_by_user_id and resolved_at stamped", "Section.primary_teacher_id set and roster_health -> OK", "SyncRun.blocking_error_count recomputed; a HELD run stays HELD until transform is called again — triage never re-transforms on its own", "version incremented"]
  - method: POST
    path: "/rostering/error-queue-items/{error_queue_item_id}/merge-duplicate"
    description: "triage a duplicate student by merging the loser into the survivor"
    roles: [DataGovernanceOfficer]
    code: 200
    input: [surviving_student_id, "resolution_note?"]
    output: ErrorQueueItem
    side_effects: ["ErrorQueueItem OPEN -> RESOLVED_MERGED; resolved_by_user_id and resolved_at stamped", "the losing Student ENROLLED -> MERGED_DUPLICATE with duplicate_of_student_id set and its enrollments and app accounts wound down", "SyncRun.blocking_error_count recomputed; a HELD run stays HELD until transform is called again", "version incremented"]

  # ---------------------------------------------- test-driving: logical clock -
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical UTC clock, which every date/expiry/window rule reads. Before any call the clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and NEVER falls back to real wall-clock time."
    roles: [RosterOperator, DataGovernanceOfficer, VendorIntegrationManager, BuildingLicenseAdmin, IdentityAdmin]
    code: 200
    input: [now]
    output: "{ now: string }"
    side_effects: ["subsequent password_lifecycle_evaluation, archived_access_window, sync_seat_charge and renewal_recommendation_score evaluations read the new instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-Role header missing or blank"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the X-Role value is not listed in the target endpoint's roles"
  - id: ERR_SCOPE_VIOLATION
    http: 403
    condition: "an entity-backed role acted on a licence it did not create or on a building it is not bound to"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "publish attempted by the run's initiator, or activate-license attempted by the licence's creator"

  # ---- existence ----
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "school_id in the path or body does not resolve"
  - id: ERR_TERM_NOT_FOUND
    http: 404
    condition: "term_id in the path or body does not resolve"
  - id: ERR_TEACHER_NOT_FOUND
    http: 404
    condition: "teacher_id, primary_teacher_id or replacement_teacher_id does not resolve"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id or surviving_student_id does not resolve"
  - id: ERR_SECTION_NOT_FOUND
    http: 404
    condition: "section_id in the path or body does not resolve"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment_id in the path does not resolve"
  - id: ERR_VENDOR_APP_NOT_FOUND
    http: 404
    condition: "vendor_app_id in the path or body does not resolve"
  - id: ERR_BUILDING_ALLOCATION_NOT_FOUND
    http: 404
    condition: "building_allocation_id in the path or body does not resolve"
  - id: ERR_APP_ACCOUNT_NOT_FOUND
    http: 404
    condition: "app_account_id in the path does not resolve"
  - id: ERR_SYNC_RUN_NOT_FOUND
    http: 404
    condition: "sync_run_id in the path does not resolve"
  - id: ERR_ERROR_QUEUE_ITEM_NOT_FOUND
    http: 404
    condition: "error_queue_item_id in the path does not resolve"

  # ---- request shape and concurrency ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, out-of-range integer, malformed date/datetime, empty meeting_days or grade_band_scope, or an app-account body that does not carry exactly one subject id matching subject_type"
  - id: ERR_STALE_VENDOR_APP_VERSION
    http: 412
    condition: "expected_vendor_app_version does not equal the governing VendorApp.version"

  # ---- state preconditions ----
  - id: ERR_SCHOOL_CLOSED
    http: 409
    condition: "the governing School has status == CLOSED"
  - id: ERR_TERM_NOT_ACTIVE
    http: 409
    condition: "the governing Term is not in the state the operation requires (ACTIVE for scheduling/rostering and FULL/DELTA runs, PLANNED to activate, ACTIVE to roll over)"
  - id: ERR_TERM_WINDOW_CLOSED
    http: 422
    condition: "activate attempted after Term.end_date, or rollover attempted before Term.end_date"
  - id: ERR_STUDENT_NOT_ENROLLED
    http: 409
    condition: "the Student is WITHDRAWN or MERGED_DUPLICATE"
  - id: ERR_TEACHER_SEPARATED
    http: 409
    condition: "the Teacher has employment_status == SEPARATED"
  - id: ERR_ENROLLMENT_NOT_DROPPABLE
    http: 409
    condition: "the Enrollment is already PENDING_DROP or DROPPED"
  - id: ERR_VENDOR_APP_NOT_ACTIVE
    http: 409
    condition: "the VendorApp is DRAFT, SUSPENDED or TERMINATED when an ACTIVE licence is required"
  - id: ERR_VENDOR_APP_ALREADY_ACTIVATED
    http: 409
    condition: "activate-license called on a licence whose status is not DRAFT"
  - id: ERR_SYNC_RUN_STATE_INVALID
    http: 409
    condition: "transform called outside {EXTRACTED, HELD}, or publish called on a run that is not TRANSFORMED"
  - id: ERR_SYNC_RUN_SUPERSEDED
    http: 409
    condition: "the SyncRun has been superseded by a newer run of the same licence"
  - id: ERR_SEAT_ALREADY_RELEASED
    http: 409
    condition: "the AppAccount has seat_status == RELEASED"
  - id: ERR_ACCOUNT_DEPROVISIONED
    http: 409
    condition: "the AppAccount has identity_status == DEPROVISIONED"
  - id: ERR_ERROR_QUEUE_ITEM_NOT_OPEN
    http: 409
    condition: "the ErrorQueueItem is not OPEN, or its category does not match the resolution verb"
  - id: ERR_ARCHIVE_WINDOW_CLOSED
    http: 409
    condition: "archived-class access or a ROLLOVER run requested while Term.state != ROLLED_OVER or clock_now >= Term.archived_access_expires_at"

  # ---- identity and password safety ----
  - id: ERR_ACCOUNT_LOCKED
    http: 403
    condition: "password reset attempted on a LOCKED account by a role other than IdentityAdmin"
  - id: ERR_PASSWORD_TOO_SHORT
    http: 422
    condition: "new_password shorter than the subject building's min_password_length"
  - id: ERR_PASSWORD_COMPLEXITY
    http: 422
    condition: "new_password lacks mixed case while the subject building requires it"
  - id: ERR_DEPROVISION_NOT_DUE
    http: 409
    condition: "explicit deprovision requested before AppAccount.deprovision_scheduled_date"
  - id: ERR_IDENTIFIER_UNAVAILABLE
    http: 422
    condition: "username_derivation cannot produce an identifier: missing state_student_id under STATE_ID, a teacher under STATE_ID, a blank teacher email under EMAIL_LOCALPART, or an empty normalised localpart"

  # ---- governance ----
  - id: ERR_BLOCKING_ERRORS_UNRESOLVED
    http: 409
    condition: "publish attempted while the run still has OPEN BLOCKING ErrorQueueItems"
  - id: ERR_MERGE_SUBJECT_MISMATCH
    http: 422
    condition: "surviving_student_id is not one of the item's two duplicate candidates"

  # ---- temporal constraints ----
  - id: ERR_TERM_DATE_ORDER
    http: 422
    condition: "Term dates violate start_date <= add_drop_cutoff_date <= end_date"
  - id: ERR_EFFECTIVE_DATE_OUT_OF_TERM
    http: 422
    condition: "requested_effective_date falls outside the section's term window"
  - id: ERR_DROP_BEFORE_ADD
    http: 422
    condition: "drop_effective_date precedes the enrollment's effective date or falls after Term.end_date"
  - id: ERR_STUDENT_SCHEDULE_CONFLICT
    http: 409
    condition: "the student already has a non-DROPPED enrollment in the same period_index with an overlapping half-open date interval and a shared meeting day"
  - id: ERR_TEACHER_PERIOD_CONFLICT
    http: 409
    condition: "the teacher already teaches an ACTIVE section in the same term within the one-period travel buffer on a shared meeting day"

  # ---- referential coherence ----
  - id: ERR_SCHOOL_MISMATCH
    http: 422
    condition: "student and section, subject and building allocation, or replacement teacher and section belong to different buildings"

  # ---- uniqueness and capacity ----
  - id: ERR_DUPLICATE_SIS_ID
    http: 409
    condition: "sis_student_id or sis_staff_id already exists in the district"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "a non-DROPPED Enrollment already exists for this (section_id, student_id)"
  - id: ERR_DUPLICATE_APP_ACCOUNT
    http: 409
    condition: "a seat-holding AppAccount already exists for this (VendorApp, subject)"
  - id: ERR_SECTION_AT_CAPACITY
    http: 409
    condition: "Section.active_enrollment_count has reached Section.max_seats"
  - id: ERR_GRADE_BAND_OUT_OF_SCOPE
    http: 422
    condition: "the subject's own grade band is not in VendorApp.grade_band_scope: grade_band_of(grade_level) for a Student, School.grade_band for a Teacher"
  - id: ERR_NO_ELIGIBLE_BUILDINGS
    http: 422
    condition: "activate-license found no ACTIVE School inside the licence's grade_band_scope"
  - id: ERR_ALLOCATION_EXCEEDS_LICENSE
    http: 409
    condition: "a reallocation would push sum(allocated_seats) + sum(borrowed_seats) above VendorApp.total_seats"
  - id: ERR_ALLOCATION_BELOW_CONSUMED
    http: 409
    condition: "a reallocation would drop allocated_seats below the building's consumed_seats"

  # ---- fiscal / seat capacity (evaluated last) ----
  - id: ERR_BUILDING_ALLOCATION_EXHAUSTED
    http: 409
    condition: "the target building has no free seat and the licence is BLOCK (hard cap)"
  - id: ERR_DISTRICT_SEATS_EXHAUSTED
    http: 409
    condition: "the target building is full and the POOL_FALLBACK district pool is empty"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RosterOperator
    description: "district SIS data steward: maintains buildings, terms, staff, students, sections and enrollments, and drives the extraction/transform half of the rostering pipeline"
    identity: "opaque"
    exclusive_operations:
      - "POST /rostering/schools"
      - "POST /rostering/terms"
      - "POST /rostering/terms/{term_id}/activate"
      - "POST /rostering/teachers"
      - "POST /rostering/students"
      - "POST /rostering/sections"
      - "PATCH /rostering/sections/{section_id}"
      - "POST /rostering/enrollments"
      - "POST /rostering/enrollments/{enrollment_id}/drop"
      - "POST /rostering/sync-runs"
      - "POST /rostering/sync-runs/{sync_run_id}/transform"
    shared_operations:
      - "PATCH /rostering/schools/{school_id} (with DataGovernanceOfficer)"
      - "every GET under /rostering except the roster feed, which is limited to RosterOperator, DataGovernanceOfficer and VendorIntegrationManager"
      - "POST /_clock/set_current_utc"
  - name: DataGovernanceOfficer
    description: "district data-governance authority: the second pair of eyes. Publishes rosters, triages the error queue, records withdrawals and separations, rolls the year over and activates licences"
    identity: "opaque"
    exclusive_operations:
      - "POST /rostering/terms/{term_id}/rollover"
      - "POST /rostering/teachers/{teacher_id}/separate"
      - "POST /rostering/students/{student_id}/withdraw"
      - "POST /rostering/vendor-apps/{vendor_app_id}/activate-license"
      - "POST /rostering/sync-runs/{sync_run_id}/publish"
      - "POST /rostering/error-queue-items/{error_queue_item_id}/resolve-match"
      - "POST /rostering/error-queue-items/{error_queue_item_id}/merge-duplicate"
    shared_operations:
      - "PATCH /rostering/schools/{school_id} (with RosterOperator)"
      - "PATCH /rostering/vendor-apps/{vendor_app_id} (with VendorIntegrationManager)"
      - "PATCH /rostering/building-allocations/{building_allocation_id} (with BuildingLicenseAdmin)"
      - "every GET under /rostering"
      - "POST /_clock/set_current_utc"
  - name: VendorIntegrationManager
    description: "vendor-facing integration owner: registers the licence, chooses the rostering standard and transformation rules, consumes the roster feed and posts usage telemetry. An operator identity, not a persisted row: its X-User-ID is stamped onto VendorApp.created_by_user_id at registration and every later licence-scoped operation is bound to the licences carrying that value."
    identity: "opaque"
    exclusive_operations:
      - "POST /rostering/vendor-apps"
    shared_operations:
      - "PATCH /rostering/vendor-apps/{vendor_app_id} (with DataGovernanceOfficer; only for licences it created)"
      - "POST /rostering/app-accounts/{app_account_id}/record-usage (with IdentityAdmin; only under licences it created)"
      - "GET /rostering/vendor-apps/{vendor_app_id}/roster-feed and /renewal-summary (only for licences it created)"
      - "every other GET under /rostering"
      - "POST /_clock/set_current_utc"
  - name: BuildingLicenseAdmin
    description: "school-level licence administrator: re-cuts its own building's seat allocation under optimistic concurrency on the parent licence. Bound to exactly one School."
    identity: "entity_backed:School"
    exclusive_operations: []
    shared_operations:
      - "PATCH /rostering/building-allocations/{building_allocation_id} (with DataGovernanceOfficer; only for its own building)"
      - "GET /rostering/vendor-apps/{vendor_app_id}/renewal-summary"
      - "every other GET under /rostering except the roster feed"
      - "POST /_clock/set_current_utc"
  - name: IdentityAdmin
    description: "single-sign-on identity administrator: provisions and deprovisions SSO accounts, sets and resets passwords, releases seats. The only role that may set an account password, which is also what moves the identity axis PENDING_PROVISION -> PROVISIONED."
    identity: "opaque"
    exclusive_operations:
      - "POST /rostering/app-accounts"
      - "POST /rostering/app-accounts/{app_account_id}/password-set"
      - "POST /rostering/app-accounts/{app_account_id}/release"
      - "POST /rostering/app-accounts/{app_account_id}/deprovision"
    shared_operations:
      - "POST /rostering/app-accounts/{app_account_id}/record-usage (with VendorIntegrationManager)"
      - "every GET under /rostering except the roster feed and renewal summary"
      - "POST /_clock/set_current_utc"
