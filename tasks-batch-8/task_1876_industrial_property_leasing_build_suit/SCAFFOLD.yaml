# =============================================================================
# Task 1876 — Industrial Property Leasing & Build-to-Suit (industrial developer)
# PRD Benchmark Seed Tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1876. Industrial Property Leasing & Build-to-Suit (industrial developer): requirement intake (clear height/dock/power/yard) & site matching, market survey & tour coordination, LOI economics (rate/TI/free rent/escalation) negotiation, build-to-suit design & cost/rent conversion, delivery schedule & rent commencement conditions, expansion option & land banking, environmental & zoning use verification, broker commission & payment schedule

domain_name: industrial-property-leasing
api_prefix: /api

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat            # peer entities joined by foreign keys; no nested write paths
  state_machine_shape: cyclic      # LOI negotiation cycle + compliance re-review cycle + invoice dispute cycle
  relationship_patterns:
    - cross_aggregate              # Tour/LOI/ComplianceReview reference TenantRequirement & Site across aggregates
    - one_to_many                  # LOI -> milestones/invoices/options via foreign keys
  role_model: approval_chain       # TenantRep -> LeasingManager -> AssetManager on the LOI lifecycle
  consistency_model: immediate     # all side effects visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TenantRequirement
    parent: null
    common_fields: true
    fields:
      - { name: tenant_name, type: string, source: input, description: "Prospective tenant legal name" }
      - { name: use_type, type: enum, source: input, description: "DISTRIBUTION | MANUFACTURING | COLD_STORAGE | R_AND_D" }
      - { name: min_sf, type: integer, source: input, description: "Minimum acceptable square footage; must be > 0 and <= max_sf" }
      - { name: max_sf, type: integer, source: input, description: "Maximum acceptable square footage; must be >= min_sf" }
      - { name: min_clear_height_ft, type: number, source: input, description: "Minimum clear ceiling height in feet" }
      - { name: min_dock_doors, type: integer, source: input, description: "Minimum dock-high door count" }
      - { name: min_power_amps, type: integer, source: input, description: "Minimum electrical service in amps" }
      - { name: min_yard_depth_ft, type: integer, source: input, description: "Minimum truck court / yard depth in feet" }
      - { name: target_submarket, type: string, source: input, description: "Free-text submarket the tenant targets (market survey scope)" }
      - { name: required_delivery_date, type: datetime, source: input, description: "Date by which the tenant needs occupancy" }
      - { name: tenant_rep_id, type: string, source: system, description: "X-User-ID of the creating TenantRep; ownership token for rep-scoped writes" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SATISFIED | WITHDRAWN" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: site_name, type: string, source: input, description: "Marketing name of the building or land parcel" }
      - { name: submarket, type: string, source: input, description: "Submarket label used for market survey filtering" }
      - { name: parcel_type, type: enum, source: input, description: "EXISTING (standing building) | LAND_BANK (banked land for expansion/BTS)" }
      - { name: total_sf, type: integer, source: input, description: "Total rentable square feet of the site/parcel; immutable; > 0" }
      - { name: clear_height_ft, type: number, source: input, description: "Clear height in feet (0 for raw land)" }
      - { name: dock_doors, type: integer, source: input, description: "Dock-high door count (0 for raw land)" }
      - { name: power_amps, type: integer, source: input, description: "Electrical service in amps" }
      - { name: yard_depth_ft, type: integer, source: input, description: "Truck court depth in feet" }
      - { name: zoning_designation, type: string, source: input, description: "Zoning code, e.g. M-1, M-2, I-2" }
      - { name: environmental_phase, type: enum, source: input, description: "PHASE_I_COMPLETE | PHASE_II_REQUIRED | REMEDIATED" }
      - { name: asking_rate_psf, type: number, source: input, description: "Annual NNN asking rate per SF; anchor for match/negotiation floors" }
      - { name: reserved_sf, type: integer, source: computed, default: 0, description: "SF currently reserved by ACCEPTED LOIs or exercised expansion options" }
      - { name: available_sf, type: integer, source: computed, description: "Read-only = total_sf - reserved_sf" }
      - { name: status, type: enum, source: system, default: LISTED, description: "LISTED | RESERVED | COMMITTED | LEASED" }

  - name: Tour
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; toured site" }
      - { name: requirement_id, type: string, source: input, description: "FK -> TenantRequirement.id; requirement the tour serves" }
      - { name: tenant_rep_id, type: string, source: system, description: "X-User-ID of the creating TenantRep; calendar resource for overlap checks" }
      - { name: start_at, type: datetime, source: input, description: "Tour window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Tour window end; must be strictly after start_at" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED" }

  - name: LOI
    parent: null
    common_fields: true
    fields:
      - { name: requirement_id, type: string, source: input, description: "FK -> TenantRequirement.id" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: term_years, type: integer, source: input, description: "Lease term in whole years, 1..30" }
      - { name: leased_sf, type: integer, source: input, description: "Square footage under the LOI; must lie within requirement [min_sf, max_sf] and site available_sf" }
      - { name: base_rate_psf, type: number, source: input, description: "Year-1 annual NNN base rent per SF" }
      - { name: ti_allowance_psf, type: number, source: input, description: "Tenant-improvement allowance per SF (one-time credit)" }
      - { name: free_rent_months, type: integer, source: input, description: "Months of abated year-1 base rent; must be <= 12 at submit" }
      - { name: escalation_pct, type: number, source: input, description: "Annual escalation as decimal, e.g. 0.03; applied to base rate from year 2" }
      - { name: commission_basis, type: enum, source: input, default: GROSS_AGGREGATE, description: "GROSS_AGGREGATE | NET_EFFECTIVE — selects broker_commission variant" }
      - { name: aggregate_rent_total, type: number, source: computed, description: "Read-only; aggregate_rent over term at current terms" }
      - { name: net_effective_rent_psf, type: number, source: computed, description: "Read-only; net_effective_rent per SF per year at current terms" }
      - { name: negotiation_round, type: integer, source: system, default: 0, description: "Increments by 1 on every submit and every counter" }
      - { name: rent_commencement_date, type: datetime, source: system, description: "Null until the linked BuildToSuitPlan reaches DELIVERED; then = actual_date of its SUBSTANTIAL_COMPLETION milestone" }
      - { name: abatement_days, type: integer, source: computed, default: 0, description: "Extra free-rent days owed for late delivery; set at plan DELIVERED per delivery_delay_abatement" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | COUNTERED | ACCEPTED | EXECUTED | REJECTED | WITHDRAWN" }

  - name: BuildToSuitPlan
    parent: null
    common_fields: true
    fields:
      - { name: loi_id, type: string, source: system, description: "FK -> LOI.id; auto-created 1:1 when the LOI is EXECUTED" }
      - { name: hard_cost_total, type: number, source: input, description: "Hard construction cost budget (set via price)" }
      - { name: soft_cost_total, type: number, source: input, description: "Soft cost budget (architecture, permits, legal)" }
      - { name: contingency_pct, type: number, source: input, default: 0.05, description: "Contingency applied to hard+soft cost" }
      - { name: pricing_method, type: enum, source: input, description: "YIELD_ON_COST | MARKET_COMP — selects bts_cost_rent_conversion variant" }
      - { name: provisional_base_rate_psf, type: number, source: computed, description: "Pass-1 rent from base cost before commission load" }
      - { name: commission_cost_estimate, type: number, source: computed, description: "DEV_COMM_PCT x provisional aggregate rent; loaded into total cost in pass 2" }
      - { name: total_project_cost, type: number, source: computed, description: "base_cost + commission_cost_estimate (two-pass order pinned in bts_cost_rent_conversion)" }
      - { name: converted_base_rate_psf, type: number, source: computed, description: "Final cost-converted year-1 base rent per SF" }
      - { name: yield_on_cost, type: number, source: computed, description: "converted_base_rate_psf x leased_sf / total_project_cost, 4 decimal places" }
      - { name: status, type: enum, source: system, default: SCHEMATIC, description: "SCHEMATIC | PRICED | APPROVED | DELIVERED" }

  - name: DeliveryMilestone
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> BuildToSuitPlan.id" }
      - { name: milestone_type, type: enum, source: input, description: "PERMITS | SHELL | TI | SUBSTANTIAL_COMPLETION; unique per plan" }
      - { name: planned_date, type: datetime, source: input, description: "Contractual planned completion date" }
      - { name: actual_date, type: datetime, source: system, description: "Set from the complete call's actual_date input" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | COMPLETE" }

  - name: ExpansionOption
    parent: null
    common_fields: true
    fields:
      - { name: loi_id, type: string, source: input, description: "FK -> LOI.id; option rides on an ACCEPTED or EXECUTED LOI" }
      - { name: land_site_id, type: string, source: input, description: "FK -> Site.id; must reference a parcel_type == LAND_BANK site" }
      - { name: option_sf, type: integer, source: input, description: "SF of banked land the option controls" }
      - { name: window_open_date, type: datetime, source: input, description: "Earliest exercise instant (inclusive)" }
      - { name: window_close_date, type: datetime, source: input, description: "Latest exercise instant (inclusive); must be after window_open_date" }
      - { name: status, type: enum, source: system, default: GRANTED, description: "GRANTED | EXERCISED | EXPIRED | RELEASED" }

  - name: ComplianceReview
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site under review" }
      - { name: requirement_id, type: string, source: input, description: "FK -> TenantRequirement.id; use_type verified against zoning for ZONING_USE reviews" }
      - { name: review_type, type: enum, source: input, description: "ENVIRONMENTAL | ZONING_USE; unique per (site_id, requirement_id, review_type)" }
      - { name: findings, type: string, source: input, description: "Optional findings narrative recorded at create or resolve" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | IN_REVIEW | CLEARED | FLAGGED" }

  - name: CommissionInvoice
    parent: null
    common_fields: true
    fields:
      - { name: loi_id, type: string, source: system, description: "FK -> LOI.id; auto-created in pairs (TENANT_REP first, then LANDLORD_REP) when the LOI is EXECUTED" }
      - { name: broker_side, type: enum, source: system, description: "TENANT_REP | LANDLORD_REP" }
      - { name: commission_basis, type: enum, source: system, description: "Copied from LOI.commission_basis at execution; selects broker_commission variant" }
      - { name: commission_basis_amount, type: number, source: computed, description: "Basis the tiered schedule runs over (aggregate rent or net effective total)" }
      - { name: total_commission, type: number, source: computed, description: "This side's share of the tiered combined commission" }
      - { name: installment_1_amount, type: number, source: computed, description: "50% of total_commission rounded half-up to cents; due at lease execution" }
      - { name: installment_2_amount, type: number, source: computed, description: "total_commission - installment_1_amount (remainder pinned to installment 2); due at rent commencement" }
      - { name: installment_1_paid, type: boolean, source: system, default: false, description: "Set by pay(installment_number=1)" }
      - { name: installment_2_paid, type: boolean, source: system, default: false, description: "Set by pay(installment_number=2)" }
      - { name: installment_2_due, type: boolean, source: system, default: false, description: "Flipped true by the Site COMMITTED->LEASED transition (rent commencement)" }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded by the latest dispute" }
      - { name: status, type: enum, source: system, default: ACCRUED, description: "ACCRUED | INVOICED | PARTIALLY_PAID | PAID | DISPUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TenantRequirement
    initial_state: ACTIVE
    terminal_states: [SATISFIED, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /api/tenant-requirements/{id}/withdraw"
        actor: TenantRep
        preconditions:
          - "requirement.status == ACTIVE"
          - "acting TenantRep's X-User-ID == requirement.tenant_rep_id"
        side_effects:
          - "All Tours with requirement_id == id and status IN {REQUESTED, CONFIRMED} transition to CANCELLED"
          - "All LOIs with requirement_id == id and status IN {DRAFT, SUBMITTED, COUNTERED} transition to WITHDRAWN"
      - from: ACTIVE
        to: SATISFIED
        trigger: "system — an LOI with requirement_id == id reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Site
    initial_state: LISTED
    terminal_states: [LEASED]
    transitions:
      - from: LISTED
        to: RESERVED
        trigger: "system — POST /api/lois/{id}/accept succeeds, or POST /api/expansion-options/{id}/exercise succeeds (land parcel)"
        actor: system
        preconditions:
          - "site.available_sf >= the accepted LOI's leased_sf (or the option's option_sf)"
        side_effects:
          - "site.reserved_sf += leased_sf (or option_sf); site.available_sf recomputed as total_sf - reserved_sf"
          - "On LOI accept: every other LOI with site_id == site.id and status IN {SUBMITTED, COUNTERED} transitions to REJECTED (cascade link 2 caused by THIS transition, not by the accept call directly)"
      - from: RESERVED
        to: LISTED
        trigger: "system — the ACCEPTED LOI that reserved the site is withdrawn (LOI ACCEPTED -> WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "site.reserved_sf -= that LOI's leased_sf; site.available_sf recomputed"
      - from: RESERVED
        to: COMMITTED
        trigger: "system — the ACCEPTED LOI that reserved the site reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "All Tours with site_id == site.id, requirement_id != the executed LOI's requirement_id, and status IN {REQUESTED, CONFIRMED} transition to CANCELLED (cascade link 2 caused by THIS transition)"
      - from: COMMITTED
        to: LEASED
        trigger: "system — the linked BuildToSuitPlan reaches DELIVERED"
        actor: system
        preconditions: []
        side_effects:
          - "Every CommissionInvoice with loi_id == the linked LOI's id has installment_2_due set to true (cascade link 3 caused by THIS transition)"

  - entity: Tour
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/tours/{id}/confirm"
        actor: LeasingManager
        preconditions:
          - "tour.status == REQUESTED"
          - "tour site's status IN {LISTED, RESERVED} (cross-entity gate: Tour -> Site)"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/tours/{id}/complete"
        actor: TenantRep
        preconditions:
          - "tour.status == CONFIRMED"
          - "acting TenantRep's X-User-ID == tour.tenant_rep_id"
          - "logical clock >= tour.end_at (else ERR_TOUR_NOT_CONCLUDED)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/tours/{id}/cancel, or system cascade (requirement withdrawn / site committed to another requirement)"
        actor: TenantRep | LeasingManager | system
        preconditions:
          - "tour.status == REQUESTED (manual cancel)"
          - "manual cancel by TenantRep requires X-User-ID == tour.tenant_rep_id"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/tours/{id}/cancel, or system cascade"
        actor: TenantRep | LeasingManager | system
        preconditions:
          - "tour.status == CONFIRMED (manual cancel)"
          - "manual cancel by TenantRep requires X-User-ID == tour.tenant_rep_id"
        side_effects: []

  - entity: LOI
    initial_state: DRAFT
    terminal_states: [EXECUTED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/lois/{id}/submit"
        actor: TenantRep
        preconditions:
          - "loi.status == DRAFT"
          - "expected_loi_version == loi.version (OCC, else ERR_STALE_VERSION)"
          - "acting TenantRep owns the linked requirement"
          - "effective free_rent_months <= 12 (else ERR_FREE_RENT_OVER_CAP)"
        side_effects:
          - "negotiation_round += 1; loi.version += 1"
          - "aggregate_rent_total and net_effective_rent_psf recomputed at effective terms"
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /api/lois/{id}/counter"
        actor: LeasingManager
        preconditions:
          - "loi.status == SUBMITTED"
          - "expected_loi_version == loi.version (OCC, else ERR_STALE_VERSION)"
        side_effects:
          - "base_rate_psf / ti_allowance_psf / free_rent_months / escalation_pct replaced by the counter payload"
          - "negotiation_round += 1; loi.version += 1"
          - "aggregate_rent_total and net_effective_rent_psf recomputed at the countered terms"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /api/lois/{id}/submit (tenant resubmits, optionally revising terms)"
        actor: TenantRep
        preconditions:
          - "loi.status == COUNTERED"
          - "expected_loi_version == loi.version (OCC, else ERR_STALE_VERSION)"
          - "acting TenantRep owns the linked requirement"
          - "effective free_rent_months <= 12 (else ERR_FREE_RENT_OVER_CAP)"
        side_effects:
          - "any economics fields present in the payload replace current values"
          - "negotiation_round += 1; loi.version += 1"
          - "aggregate_rent_total and net_effective_rent_psf recomputed at effective terms"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/lois/{id}/accept"
        actor: LeasingManager
        preconditions:
          - "loi.status == SUBMITTED"
          - "loi site's status == LISTED (else ERR_SITE_NOT_LISTED)"
          - "site.available_sf >= loi.leased_sf (else ERR_INSUFFICIENT_SF)"
          - "net_effective_rent_psf >= round(0.60 * site.asking_rate_psf, 2) (else ERR_NER_BELOW_FLOOR)"
        side_effects:
          - "Site LISTED -> RESERVED with reserved_sf += leased_sf (cascade link 1; see Site machine for link 2)"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /api/lois/{id}/accept (accept the standing counter)"
        actor: LeasingManager
        preconditions:
          - "loi.status == COUNTERED"
          - "loi site's status == LISTED (else ERR_SITE_NOT_LISTED)"
          - "site.available_sf >= loi.leased_sf (else ERR_INSUFFICIENT_SF)"
          - "net_effective_rent_psf >= round(0.60 * site.asking_rate_psf, 2) (else ERR_NER_BELOW_FLOOR)"
        side_effects:
          - "Site LISTED -> RESERVED with reserved_sf += leased_sf (cascade link 1)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/lois/{id}/reject, or system cascade (another LOI's accept reserved the site)"
        actor: LeasingManager | system
        preconditions:
          - "loi.status == SUBMITTED (manual reject)"
        side_effects: []
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /api/lois/{id}/reject, or system cascade"
        actor: LeasingManager | system
        preconditions:
          - "loi.status == COUNTERED (manual reject)"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/lois/{id}/withdraw, or system cascade (requirement withdrawn)"
        actor: TenantRep | system
        preconditions:
          - "loi.status == DRAFT (manual withdraw); acting TenantRep owns the linked requirement"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/lois/{id}/withdraw, or system cascade (requirement withdrawn)"
        actor: TenantRep | system
        preconditions:
          - "loi.status == SUBMITTED (manual withdraw); acting TenantRep owns the linked requirement"
        side_effects: []
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /api/lois/{id}/withdraw, or system cascade (requirement withdrawn)"
        actor: TenantRep | system
        preconditions:
          - "loi.status == COUNTERED (manual withdraw); acting TenantRep owns the linked requirement"
        side_effects: []
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /api/lois/{id}/withdraw (tenant walks before execution)"
        actor: TenantRep
        preconditions:
          - "loi.status == ACCEPTED"
          - "acting TenantRep owns the linked requirement"
        side_effects:
          - "Site RESERVED -> LISTED with reserved_sf -= leased_sf (compensating release)"
          - "All ExpansionOptions with loi_id == id and status == GRANTED transition to RELEASED"
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /api/lois/{id}/execute"
        actor: AssetManager
        preconditions:
          - "loi.status == ACCEPTED"
          - "A ComplianceReview with (site_id == loi.site_id, requirement_id == loi.requirement_id, review_type == ENVIRONMENTAL) exists with status == CLEARED"
          - "A ComplianceReview with (site_id, requirement_id, review_type == ZONING_USE) exists with status == CLEARED (else ERR_COMPLIANCE_NOT_CLEARED)"
        side_effects:
          - "Site RESERVED -> COMMITTED (see Site machine for its link-2 tour cancellation)"
          - "TenantRequirement ACTIVE -> SATISFIED"
          - "A BuildToSuitPlan is auto-created with loi_id == id, status SCHEMATIC"
          - "Two CommissionInvoices are auto-created in fixed order — TENANT_REP first, LANDLORD_REP second — status ACCRUED, amounts per broker_commission at the LOI's final terms"

  - entity: BuildToSuitPlan
    initial_state: SCHEMATIC
    terminal_states: [DELIVERED]
    transitions:
      - from: SCHEMATIC
        to: PRICED
        trigger: "POST /api/bts-plans/{id}/price"
        actor: ProjectManager
        preconditions:
          - "plan.status == SCHEMATIC"
        side_effects:
          - "bts_cost_rent_conversion runs; provisional_base_rate_psf, commission_cost_estimate, total_project_cost, converted_base_rate_psf, yield_on_cost are written"
      - from: PRICED
        to: SCHEMATIC
        trigger: "POST /api/bts-plans/{id}/revise (design revision loop)"
        actor: ProjectManager
        preconditions:
          - "plan.status == PRICED"
        side_effects:
          - "computed pricing fields are retained from the last price run until the next price overwrites them"
      - from: PRICED
        to: APPROVED
        trigger: "POST /api/bts-plans/{id}/approve"
        actor: AssetManager
        preconditions:
          - "plan.status == PRICED"
          - "converted_base_rate_psf <= round(1.10 * loi.base_rate_psf, 2) (else ERR_RENT_CONVERSION_OVER_RUN)"
        side_effects:
          - "If all of the plan's DeliveryMilestones (at least one required) are already COMPLETE, the plan immediately continues APPROVED -> DELIVERED in the same request, firing the DELIVERED side effects below"
      - from: APPROVED
        to: DELIVERED
        trigger: "system — a DeliveryMilestone completion leaves every milestone of this plan COMPLETE (bubble-up)"
        actor: system
        preconditions:
          - "plan.status == APPROVED"
          - "count(plan milestones) >= 1 and all are COMPLETE"
        side_effects:
          - "Linked LOI.rent_commencement_date = actual_date of the plan's SUBSTANTIAL_COMPLETION milestone (cascade link 2)"
          - "Linked LOI.abatement_days = delivery_delay_abatement over that milestone (cascade link 2)"
          - "Site COMMITTED -> LEASED (cascade link 2; the Site LEASED transition itself flips invoice installment_2_due = true, link 3)"

  - entity: DeliveryMilestone
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: COMPLETE
        trigger: "POST /api/delivery-milestones/{id}/complete"
        actor: ProjectManager
        preconditions:
          - "milestone.status == PENDING"
          - "milestone plan's status IN {SCHEMATIC, PRICED, APPROVED}"
        side_effects:
          - "milestone.actual_date = payload actual_date"
          - "Bubble-up: if this completes the last PENDING milestone of an APPROVED plan, the plan transitions APPROVED -> DELIVERED (see BuildToSuitPlan machine)"

  - entity: ExpansionOption
    initial_state: GRANTED
    terminal_states: [EXERCISED, EXPIRED, RELEASED]
    transitions:
      - from: GRANTED
        to: EXERCISED
        trigger: "POST /api/expansion-options/{id}/exercise"
        actor: TenantRep
        preconditions:
          - "option.status == GRANTED"
          - "acting TenantRep owns the requirement of the linked LOI"
          - "A ZONING_USE ComplianceReview for (option.land_site_id, the LOI's requirement_id) exists with status == CLEARED (else ERR_COMPLIANCE_NOT_CLEARED)"
          - "land site's status == LISTED (else ERR_SITE_NOT_LISTED)"
          - "window_open_date <= logical clock (else ERR_OPTION_WINDOW_NOT_OPEN)"
          - "logical clock <= window_close_date, inclusive (else option transitions to EXPIRED and the call fails with ERR_OPTION_WINDOW_EXPIRED)"
          - "land site available_sf >= option_sf (else ERR_INSUFFICIENT_SF)"
        side_effects:
          - "land Site LISTED -> RESERVED with reserved_sf += option_sf"
      - from: GRANTED
        to: EXPIRED
        trigger: "system — an exercise attempt arrives with logical clock > window_close_date"
        actor: system
        preconditions: []
        side_effects:
          - "the triggering exercise call fails with ERR_OPTION_WINDOW_EXPIRED"
      - from: GRANTED
        to: RELEASED
        trigger: "POST /api/expansion-options/{id}/release, or system cascade (linked LOI withdrawn from ACCEPTED)"
        actor: TenantRep | system
        preconditions:
          - "option.status == GRANTED (manual release); acting TenantRep owns the linked LOI's requirement"
        side_effects: []

  - entity: ComplianceReview
    initial_state: PENDING
    terminal_states: [CLEARED]
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "POST /api/compliance-reviews/{id}/begin"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == PENDING"
        side_effects: []
      - from: FLAGGED
        to: IN_REVIEW
        trigger: "POST /api/compliance-reviews/{id}/begin (re-review loop after remediation)"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == FLAGGED"
        side_effects: []
      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /api/compliance-reviews/{id}/resolve with outcome == CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == IN_REVIEW"
        side_effects:
          - "findings replaced by payload findings when present"
      - from: IN_REVIEW
        to: FLAGGED
        trigger: "POST /api/compliance-reviews/{id}/resolve with outcome == FLAGGED"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == IN_REVIEW"
        side_effects:
          - "findings replaced by payload findings when present"

  - entity: CommissionInvoice
    initial_state: ACCRUED
    terminal_states: [PAID]
    transitions:
      - from: ACCRUED
        to: INVOICED
        trigger: "POST /api/commission-invoices/{id}/issue"
        actor: LeasingManager
        preconditions:
          - "invoice.status == ACCRUED"
        side_effects: []
      - from: DISPUTED
        to: INVOICED
        trigger: "POST /api/commission-invoices/{id}/issue (re-issue after dispute)"
        actor: LeasingManager
        preconditions:
          - "invoice.status == DISPUTED"
        side_effects:
          - "dispute_reason cleared to null; amounts unchanged"
      - from: INVOICED
        to: PARTIALLY_PAID
        trigger: "POST /api/commission-invoices/{id}/pay with installment_number == 1"
        actor: LeasingManager
        preconditions:
          - "invoice.status == INVOICED"
          - "installment_number == 1 (installment 2 requires installment_1_paid first; out-of-order pay fails ERR_INVALID_STATE)"
        side_effects:
          - "installment_1_paid = true"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /api/commission-invoices/{id}/pay with installment_number == 2"
        actor: LeasingManager
        preconditions:
          - "invoice.status == PARTIALLY_PAID"
          - "installment_number == 2"
          - "invoice.installment_2_due == true (else ERR_INSTALLMENT_NOT_DUE)"
        side_effects:
          - "installment_2_paid = true"
      - from: INVOICED
        to: DISPUTED
        trigger: "POST /api/commission-invoices/{id}/dispute"
        actor: LeasingManager
        preconditions:
          - "invoice.status == INVOICED"
        side_effects:
          - "dispute_reason = payload reason"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: loi-submit-stale-version
    parent_entity: LOI
    write_endpoint: "POST /api/lois/{id}/submit"
    occ_field: expected_loi_version
    description: |
      Submitting (or resubmitting after a counter) an LOI whose version has
      advanced beyond the version the client last observed is rejected. This
      captures the case where a LeasingManager's counter has legitimately
      advanced the LOI's terms since the TenantRep read them, making the
      TenantRep's view of the negotiation stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: loi-counter-stale-version
    parent_entity: LOI
    write_endpoint: "POST /api/lois/{id}/counter"
    occ_field: expected_loi_version
    description: |
      Countering an LOI whose version has advanced beyond the version the
      client last observed is rejected. This captures the case where a
      TenantRep's resubmission has legitimately advanced the negotiation since
      the LeasingManager read it, making the LeasingManager's counter stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: site_match_scoring
    trigger: "POST /api/match-evaluations (stateless; nothing persisted)"
    algorithm: weighted_scoring
    formula: |
      weights: clear_height 0.30, dock_doors 0.30, power_amps 0.20, yard_depth 0.20
      for each attribute: contribution = weight * min(site_attr / req_min, MATCH_CAP) / MATCH_CAP * 100
      match_score = round_half_up(sum(contributions), 2)
      hard_minimums_met = (site.clear_height_ft >= req.min_clear_height_ft)
        AND (site.dock_doors >= req.min_dock_doors)
        AND (site.power_amps >= req.min_power_amps)
        AND (site.yard_depth_ft >= req.min_yard_depth_ft)
        AND (site.total_sf >= req.min_sf)   # building big enough; upper bound enforced via leased_sf range at LOI create
    input_set: "One Site (any status) x one TenantRequirement; both must exist"
    constants:
      MATCH_CAP: 1.25
      W_CLEAR_HEIGHT: 0.30
      W_DOCK_DOORS: 0.30
      W_POWER: 0.20
      W_YARD: 0.20
    precision: "2 decimal places, round_half_up"

  - name: aggregate_rent
    trigger: "LOI submit, counter, resubmit (whenever effective terms change)"
    algorithm: aggregation
    formula: |
      aggregate_rent_total = round_half_up(
        sum over y in 1..term_years of base_rate_psf * leased_sf * (1 + escalation_pct)^(y-1), 2)
      Rounding order: sum the unrounded yearly terms first, then round once to cents.
    input_set: "The LOI's own current effective terms only (no other entities)"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: net_effective_rent
    trigger: "LOI submit, counter, resubmit (alongside aggregate_rent)"
    algorithm: aggregation
    formula: |
      free_rent_credit = round_half_up(free_rent_months * (base_rate_psf * leased_sf / 12), 2)
      ti_credit = round_half_up(min(ti_allowance_psf, TI_CAP_PSF) * leased_sf, 2)
      ner_total = aggregate_rent_total - free_rent_credit - ti_credit
      net_effective_rent_psf = round_half_up(ner_total / (term_years * leased_sf), 2)
      Non-linear inputs: base_rate, escalation (inside aggregate), free_rent_months,
      ti_allowance_psf (capped), term_years, leased_sf. Evaluation order pinned:
      aggregate first, then credits, then division.
    input_set: "The LOI's own current effective terms"
    constants:
      TI_CAP_PSF: 50
    precision: "2 decimal places, round_half_up"

  - name: bts_cost_rent_conversion
    trigger: "POST /api/bts-plans/{id}/price"
    algorithm: constraint_propagation
    formula: |
      Pinned two-pass evaluation order (breaks the cost->rent->commission->cost circle):
      pass 1: base_cost = (hard_cost_total + soft_cost_total) * (1 + contingency_pct)
      pass 1: provisional_base_rate_psf = round_half_up(base_cost * TARGET_YIELD / loi.leased_sf, 2)
      pass 1: provisional_AR = aggregate_rent formula over (provisional_base_rate_psf, loi.leased_sf, loi.term_years, loi.escalation_pct)
      pass 1: commission_cost_estimate = round_half_up(DEV_COMM_PCT * provisional_AR, 2)
      pass 2: total_project_cost = base_cost + commission_cost_estimate
      pass 2: variant selection for converted_base_rate_psf (see variants)
      pass 2: yield_on_cost = round_half_up(converted_base_rate_psf * loi.leased_sf / total_project_cost, 4)
    input_set: "The plan's cost inputs + the linked EXECUTED LOI's leased_sf, term_years, escalation_pct, and the linked Site's asking_rate_psf"
    constants:
      TARGET_YIELD: 0.08
      DEV_COMM_PCT: 0.04
      MARKET_MARKUP: 0.05
    precision: "rates 2 decimal places round_half_up; yield_on_cost 4 decimal places round_half_up"
    variants:
      - name: YIELD_ON_COST
        when: "pricing_method == YIELD_ON_COST"
        difference: "converted_base_rate_psf = round_half_up(total_project_cost * TARGET_YIELD / loi.leased_sf, 2)"
      - name: MARKET_COMP
        when: "pricing_method == MARKET_COMP"
        difference: "converted_base_rate_psf = max(site.asking_rate_psf, round_half_up(yield_on_cost_rate * (1 + MARKET_MARKUP), 2)) where yield_on_cost_rate is the YIELD_ON_COST result — identical cost inputs produce a different rent"

  - name: broker_commission
    trigger: "system — LOI ACCEPTED -> EXECUTED (both CommissionInvoices computed once, at the LOI's final terms)"
    algorithm: tiered_pricing
    formula: |
      basis = (commission_basis == GROSS_AGGREGATE) ? loi.aggregate_rent_total
                                                     : round_half_up(loi.net_effective_rent_psf * loi.term_years * loi.leased_sf, 2)
      tier1 = round_half_up(COMM_TIER1_RATE * min(basis, COMM_TIER1_CAP), 2)
      tier2 = round_half_up(COMM_TIER2_RATE * max(0, basis - COMM_TIER1_CAP), 2)
      combined = tier1 + tier2
      Rounding order (pinned): round each tier to cents first, then sum — never sum-then-round.
      tenant_invoice.total_commission = round_half_up(SIDE_SPLIT * combined, 2)
      landlord_invoice.total_commission = combined - tenant_invoice.total_commission  (remainder pinned to LANDLORD_REP)
      per invoice: installment_1_amount = round_half_up(INSTALLMENT_SPLIT * total_commission, 2)
                   installment_2_amount = total_commission - installment_1_amount      (remainder pinned to installment 2)
      each invoice's commission_basis_amount = basis
    input_set: "Exactly the two CommissionInvoices auto-created at execution; basis frozen from the LOI's final terms"
    constants:
      COMM_TIER1_RATE: 0.05
      COMM_TIER1_CAP: 500000
      COMM_TIER2_RATE: 0.03
      SIDE_SPLIT: 0.5
      INSTALLMENT_SPLIT: 0.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: GROSS_AGGREGATE
        when: "LOI.commission_basis == GROSS_AGGREGATE"
        difference: "basis = aggregate_rent_total (free-rent and TI credits ignored)"
      - name: NET_EFFECTIVE
        when: "LOI.commission_basis == NET_EFFECTIVE"
        difference: "basis = net_effective_rent_psf * term_years * leased_sf (credits reduce the basis) — identical LOI terms produce a smaller commission"

  - name: delivery_delay_abatement
    trigger: "system — BuildToSuitPlan APPROVED -> DELIVERED"
    algorithm: threshold
    formula: |
      delay_days = (substantial_completion.actual_date - substantial_completion.planned_date).days
      abatement_days = max(0, delay_days - DELAY_GRACE_DAYS)
      Boundary: delay_days == 30 yields 0; delay_days == 31 yields 1.
    input_set: "The plan's unique SUBSTANTIAL_COMPLETION milestone"
    constants:
      DELAY_GRACE_DAYS: 30
    precision: "whole days, no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "TenantRep ownership: X-User-ID equals the owning requirement/tour tenant_rep_id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /api/tenant-requirements/{id}/withdraw, POST /api/lois/{id}/submit, POST /api/lois/{id}/withdraw, POST /api/tours/{id}/complete, POST /api/tours/{id}/cancel (TenantRep), POST /api/expansion-options/{id}/exercise, POST /api/expansion-options/{id}/release" }
  - { priority: 4, category: existence, check: "Path ids and body FK ids (requirement_id, site_id, plan_id, loi_id, land_site_id) exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "Required request fields present with correct types", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 6, category: business_constraint, check: "Enum fields carry a declared member (use_type, parcel_type, pricing_method, milestone_type, review_type, outcome, commission_basis)", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all POST endpoints with enum inputs" }
  - { priority: 7, category: business_temporal, check: "Range sanity: tour end_at strictly after start_at; option window_close_date strictly after window_open_date; requirement min_sf <= max_sf", error_id: ERR_INVALID_TIME_RANGE, http_status: 422, applies_to: "POST /api/tours, POST /api/expansion-options, POST /api/tenant-requirements" }
  - { priority: 8, category: state, check: "State-machine precondition: the transition is declared from the entity's current status", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: state, check: "OCC: expected_loi_version equals the LOI's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/lois/{id}/submit, POST /api/lois/{id}/counter" }
  - { priority: 10, category: state, check: "Referenced site is LISTED where required (LOI create, LOI accept, option create, option exercise land parcel); tour confirm requires site IN {LISTED, RESERVED}", error_id: ERR_SITE_NOT_LISTED, http_status: 409, applies_to: "POST /api/lois, POST /api/lois/{id}/accept, POST /api/expansion-options, POST /api/expansion-options/{id}/exercise, POST /api/tours/{id}/confirm" }
  - { priority: 11, category: business_safety, check: "Compliance gate: LOI execute requires CLEARED ENVIRONMENTAL + ZONING_USE reviews for (site, requirement); option exercise requires CLEARED ZONING_USE review for (land_site, requirement)", error_id: ERR_COMPLIANCE_NOT_CLEARED, http_status: 409, applies_to: "POST /api/lois/{id}/execute, POST /api/expansion-options/{id}/exercise" }
  - { priority: 12, category: business_constraint, check: "Site meets all requirement hard minimums per site_match_scoring.hard_minimums_met", error_id: ERR_HARD_MINIMUMS_NOT_MET, http_status: 422, applies_to: "POST /api/lois" }
  - { priority: 13, category: business_constraint, check: "At least one COMPLETED Tour exists for (requirement_id, site_id)", error_id: ERR_NO_COMPLETED_TOUR, http_status: 409, applies_to: "POST /api/lois" }
  - { priority: 14, category: business_constraint, check: "No other LOI for (requirement_id, site_id) in status IN {DRAFT, SUBMITTED, COUNTERED, ACCEPTED}", error_id: ERR_LOI_ALREADY_OPEN, http_status: 409, applies_to: "POST /api/lois" }
  - { priority: 15, category: business_constraint, check: "leased_sf within requirement [min_sf, max_sf]", error_id: ERR_SF_OUT_OF_RANGE, http_status: 422, applies_to: "POST /api/lois" }
  - { priority: 16, category: business_constraint, check: "site.available_sf >= leased_sf (or option_sf)", error_id: ERR_INSUFFICIENT_SF, http_status: 422, applies_to: "POST /api/lois, POST /api/lois/{id}/accept, POST /api/expansion-options, POST /api/expansion-options/{id}/exercise" }
  - { priority: 17, category: business_constraint, check: "Tour site schedule: no non-CANCELLED tour at the same site whose buffered window [start_at - 30min, end_at + 30min) intersects the new tour's [start_at, end_at)", error_id: ERR_TOUR_SITE_CONFLICT, http_status: 409, applies_to: "POST /api/tours" }
  - { priority: 18, category: business_constraint, check: "TenantRep calendar: no non-CANCELLED tour by the same tenant_rep_id whose plain half-open window [start_at, end_at) intersects the new tour's (adjacent back-to-back tours are allowed)", error_id: ERR_REP_CALENDAR_CONFLICT, http_status: 409, applies_to: "POST /api/tours" }
  - { priority: 19, category: business_constraint, check: "milestone_type unique per plan; milestone create also requires plan status IN {SCHEMATIC, PRICED, APPROVED}", error_id: ERR_DUPLICATE_MILESTONE, http_status: 409, applies_to: "POST /api/delivery-milestones" }
  - { priority: 19, category: business_constraint, check: "review_type unique per (site_id, requirement_id, review_type)", error_id: ERR_DUPLICATE_REVIEW, http_status: 409, applies_to: "POST /api/compliance-reviews" }
  - { priority: 20, category: business_temporal, check: "Option exercise window: logical clock >= window_open_date else not-open; logical clock <= window_close_date (inclusive) else expired", error_id: ERR_OPTION_WINDOW_NOT_OPEN, http_status: 409, applies_to: "POST /api/expansion-options/{id}/exercise" }
  - { priority: 21, category: business_temporal, check: "Option exercise: logical clock > window_close_date — option transitions to EXPIRED and the call fails", error_id: ERR_OPTION_WINDOW_EXPIRED, http_status: 409, applies_to: "POST /api/expansion-options/{id}/exercise" }
  - { priority: 22, category: business_temporal, check: "Tour completion: logical clock >= tour.end_at", error_id: ERR_TOUR_NOT_CONCLUDED, http_status: 409, applies_to: "POST /api/tours/{id}/complete" }
  - { priority: 23, category: business_temporal, check: "Installment 2 payable only when installment_2_due == true (site LEASED)", error_id: ERR_INSTALLMENT_NOT_DUE, http_status: 409, applies_to: "POST /api/commission-invoices/{id}/pay" }
  - { priority: 24, category: business_fiscal, check: "Effective free_rent_months <= 12 at submit/resubmit", error_id: ERR_FREE_RENT_OVER_CAP, http_status: 422, applies_to: "POST /api/lois/{id}/submit" }
  - { priority: 25, category: business_fiscal, check: "Accept floor: net_effective_rent_psf >= round_half_up(0.60 * site.asking_rate_psf, 2)", error_id: ERR_NER_BELOW_FLOOR, http_status: 422, applies_to: "POST /api/lois/{id}/accept" }
  - { priority: 26, category: business_fiscal, check: "BTS approval cap: converted_base_rate_psf <= round_half_up(1.10 * loi.base_rate_psf, 2)", error_id: ERR_RENT_CONVERSION_OVER_RUN, http_status: 422, applies_to: "POST /api/bts-plans/{id}/approve" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/api/tenant-requirements", description: "Requirement intake: clear height / dock / power / yard / SF range", roles: [TenantRep], code: 201, input: [tenant_name, use_type, min_sf, max_sf, min_clear_height_ft, min_dock_doors, min_power_amps, min_yard_depth_ft, target_submarket, required_delivery_date], output: TenantRequirement, side_effects: ["tenant_rep_id stamped from X-User-ID", "status = ACTIVE"] }
  - { method: GET, path: "/api/tenant-requirements/{id}", description: "Fetch one requirement", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: [], output: TenantRequirement, side_effects: [] }
  - { method: POST, path: "/api/tenant-requirements/{id}/withdraw", description: "Withdraw a requirement; cascades to open LOIs and tours", roles: [TenantRep], code: 200, input: [], output: TenantRequirement, side_effects: ["TenantRequirement ACTIVE -> WITHDRAWN with cascades per state machine"] }
  - { method: POST, path: "/api/match-evaluations", description: "Stateless site matching: runs site_match_scoring for (requirement, site); persists nothing (market-survey screening read)", roles: [TenantRep, LeasingManager], code: 200, input: [requirement_id, site_id], output: { requirement_id: string, site_id: string, match_score: number, hard_minimums_met: boolean }, side_effects: [] }

  - { method: POST, path: "/api/sites", description: "Register a building or land-bank parcel in the developer's inventory", roles: [LeasingManager], code: 201, input: [site_name, submarket, parcel_type, total_sf, clear_height_ft, dock_doors, power_amps, yard_depth_ft, zoning_designation, environmental_phase, asking_rate_psf], output: Site, side_effects: ["status = LISTED", "reserved_sf = 0", "available_sf = total_sf"] }
  - { method: GET, path: "/api/sites", description: "Market survey list with filters and pagination", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: ["submarket?", "status?", "parcel_type?", "limit?", "offset?"], output: "Site[]", side_effects: [] }
  - { method: GET, path: "/api/sites/{id}", description: "Fetch one site", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: [], output: Site, side_effects: [] }

  - { method: POST, path: "/api/tours", description: "Request a tour window at a site for a requirement; enforces buffered site schedule and rep calendar overlap", roles: [TenantRep], code: 201, input: [site_id, requirement_id, start_at, end_at], output: Tour, side_effects: ["tenant_rep_id stamped from X-User-ID", "status = REQUESTED"] }
  - { method: GET, path: "/api/tours", description: "List/filter tours (FK reverse for site_id and requirement_id)", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: ["site_id?", "requirement_id?", "tenant_rep_id?", "status?", "limit?", "offset?"], output: "Tour[]", side_effects: [] }
  - { method: GET, path: "/api/tours/{id}", description: "Fetch one tour", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: [], output: Tour, side_effects: [] }
  - { method: POST, path: "/api/tours/{id}/confirm", description: "Developer confirms a requested tour", roles: [LeasingManager], code: 200, input: [], output: Tour, side_effects: ["Tour REQUESTED -> CONFIRMED"] }
  - { method: POST, path: "/api/tours/{id}/complete", description: "Mark a confirmed tour completed once its window has passed", roles: [TenantRep], code: 200, input: [], output: Tour, side_effects: ["Tour CONFIRMED -> COMPLETED"] }
  - { method: POST, path: "/api/tours/{id}/cancel", description: "Cancel a requested or confirmed tour", roles: [TenantRep, LeasingManager], code: 200, input: [], output: Tour, side_effects: ["Tour -> CANCELLED"] }

  - { method: POST, path: "/api/lois", description: "Open an LOI (economics: rate / TI / free rent / escalation) for a requirement on a toured, qualifying site", roles: [TenantRep], code: 201, input: [requirement_id, site_id, term_years, leased_sf, base_rate_psf, ti_allowance_psf, free_rent_months, escalation_pct, "commission_basis?"], output: LOI, side_effects: ["status = DRAFT", "negotiation_round = 0", "aggregate_rent_total and net_effective_rent_psf computed"] }
  - { method: GET, path: "/api/lois", description: "List/filter LOIs (FK reverse for requirement_id and site_id)", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: ["requirement_id?", "site_id?", "status?", "limit?", "offset?"], output: "LOI[]", side_effects: [] }
  - { method: GET, path: "/api/lois/{id}", description: "Fetch one LOI", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: [], output: LOI, side_effects: [] }
  - { method: POST, path: "/api/lois/{id}/submit", description: "Submit the LOI (from DRAFT) or resubmit after a counter (from COUNTERED), optionally revising economics", roles: [TenantRep], code: 200, input: [expected_loi_version, "base_rate_psf?", "ti_allowance_psf?", "free_rent_months?", "escalation_pct?", "term_years?", "leased_sf?"], output: LOI, side_effects: ["LOI -> SUBMITTED", "negotiation_round += 1", "increments LOI.version by 1", "economics recomputed"] }
  - { method: POST, path: "/api/lois/{id}/counter", description: "Developer counters with revised economics (negotiation cycle)", roles: [LeasingManager], code: 200, input: [expected_loi_version, base_rate_psf, ti_allowance_psf, free_rent_months, escalation_pct], output: LOI, side_effects: ["LOI -> COUNTERED", "negotiation_round += 1", "increments LOI.version by 1", "economics recomputed at counter terms"] }
  - { method: POST, path: "/api/lois/{id}/accept", description: "Developer accepts standing terms; reserves the site and rejects competing LOIs", roles: [LeasingManager], code: 200, input: [], output: LOI, side_effects: ["LOI -> ACCEPTED", "Site LISTED -> RESERVED (cascade link 1; competing LOIs auto-REJECTED at link 2)"] }
  - { method: POST, path: "/api/lois/{id}/reject", description: "Developer rejects a submitted or countered LOI", roles: [LeasingManager], code: 200, input: [], output: LOI, side_effects: ["LOI -> REJECTED"] }
  - { method: POST, path: "/api/lois/{id}/withdraw", description: "Tenant withdraws; from ACCEPTED this releases the site reservation and any GRANTED options", roles: [TenantRep], code: 200, input: [], output: LOI, side_effects: ["LOI -> WITHDRAWN", "compensating Site RESERVED -> LISTED when withdrawing from ACCEPTED"] }
  - { method: POST, path: "/api/lois/{id}/execute", description: "AssetManager executes an accepted LOI after environmental + zoning clearance; spawns BTS plan and commission invoices", roles: [AssetManager], code: 200, input: [], output: LOI, side_effects: ["LOI -> EXECUTED", "Site RESERVED -> COMMITTED", "TenantRequirement ACTIVE -> SATISFIED", "BuildToSuitPlan auto-created (SCHEMATIC)", "two CommissionInvoices auto-created (TENANT_REP first, LANDLORD_REP second; ACCRUED)"] }

  - { method: GET, path: "/api/bts-plans", description: "List/filter BTS plans (FK reverse for loi_id; 0 or 1 element per LOI)", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: ["loi_id?", "status?", "limit?", "offset?"], output: "BuildToSuitPlan[]", side_effects: [] }
  - { method: GET, path: "/api/bts-plans/{id}", description: "Fetch one BTS plan", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: [], output: BuildToSuitPlan, side_effects: [] }
  - { method: POST, path: "/api/bts-plans/{id}/price", description: "Run build-to-suit cost/rent conversion with the chosen pricing_method", roles: [ProjectManager], code: 200, input: [hard_cost_total, soft_cost_total, pricing_method, "contingency_pct?"], output: BuildToSuitPlan, side_effects: ["BuildToSuitPlan SCHEMATIC -> PRICED", "bts_cost_rent_conversion writes all computed pricing fields"] }
  - { method: POST, path: "/api/bts-plans/{id}/revise", description: "Send a priced plan back to schematic design (revision loop)", roles: [ProjectManager], code: 200, input: [], output: BuildToSuitPlan, side_effects: ["BuildToSuitPlan PRICED -> SCHEMATIC"] }
  - { method: POST, path: "/api/bts-plans/{id}/approve", description: "AssetManager approves pricing if the converted rent stays within the overrun cap", roles: [AssetManager], code: 200, input: [], output: BuildToSuitPlan, side_effects: ["BuildToSuitPlan PRICED -> APPROVED", "if all milestones already COMPLETE (>= 1), continues directly to DELIVERED with its cascades"] }

  - { method: POST, path: "/api/delivery-milestones", description: "Add a delivery milestone (permits / shell / TI / substantial completion) to a plan", roles: [ProjectManager], code: 201, input: [plan_id, milestone_type, planned_date], output: DeliveryMilestone, side_effects: ["status = PENDING"] }
  - { method: GET, path: "/api/delivery-milestones", description: "List/filter milestones (FK reverse for plan_id)", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: ["plan_id?", "milestone_type?", "status?", "limit?", "offset?"], output: "DeliveryMilestone[]", side_effects: [] }
  - { method: GET, path: "/api/delivery-milestones/{id}", description: "Fetch one milestone", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: [], output: DeliveryMilestone, side_effects: [] }
  - { method: POST, path: "/api/delivery-milestones/{id}/complete", description: "Complete a milestone with its actual date; may bubble the plan to DELIVERED", roles: [ProjectManager], code: 200, input: [actual_date], output: DeliveryMilestone, side_effects: ["DeliveryMilestone PENDING -> COMPLETE", "bubble-up: plan APPROVED -> DELIVERED when last milestone completes, firing rent commencement, abatement, site LEASED, invoice due cascades"] }

  - { method: POST, path: "/api/expansion-options", description: "Grant an expansion option over a land-bank parcel, riding on an ACCEPTED or EXECUTED LOI", roles: [LeasingManager], code: 201, input: [loi_id, land_site_id, option_sf, window_open_date, window_close_date], output: ExpansionOption, side_effects: ["status = GRANTED"] }
  - { method: GET, path: "/api/expansion-options", description: "List/filter options (FK reverse for loi_id and land_site_id)", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: ["loi_id?", "land_site_id?", "status?", "limit?", "offset?"], output: "ExpansionOption[]", side_effects: [] }
  - { method: GET, path: "/api/expansion-options/{id}", description: "Fetch one option", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: [], output: ExpansionOption, side_effects: [] }
  - { method: POST, path: "/api/expansion-options/{id}/exercise", description: "Tenant exercises the option inside its window after zoning clearance; reserves the banked land", roles: [TenantRep], code: 200, input: [], output: ExpansionOption, side_effects: ["ExpansionOption GRANTED -> EXERCISED", "land Site LISTED -> RESERVED with reserved_sf += option_sf"] }
  - { method: POST, path: "/api/expansion-options/{id}/release", description: "Tenant releases a granted option", roles: [TenantRep], code: 200, input: [], output: ExpansionOption, side_effects: ["ExpansionOption GRANTED -> RELEASED"] }

  - { method: POST, path: "/api/compliance-reviews", description: "Open an environmental or zoning-use verification for (site, requirement)", roles: [ComplianceOfficer], code: 201, input: [site_id, requirement_id, review_type, "findings?"], output: ComplianceReview, side_effects: ["status = PENDING"] }
  - { method: GET, path: "/api/compliance-reviews", description: "List/filter reviews (FK reverse for site_id and requirement_id)", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: ["site_id?", "requirement_id?", "review_type?", "status?", "limit?", "offset?"], output: "ComplianceReview[]", side_effects: [] }
  - { method: GET, path: "/api/compliance-reviews/{id}", description: "Fetch one review", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: [], output: ComplianceReview, side_effects: [] }
  - { method: POST, path: "/api/compliance-reviews/{id}/begin", description: "Begin (or re-begin after FLAGGED) a review", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceReview, side_effects: ["ComplianceReview PENDING|FLAGGED -> IN_REVIEW"] }
  - { method: POST, path: "/api/compliance-reviews/{id}/resolve", description: "Clear or flag an in-review compliance review", roles: [ComplianceOfficer], code: 200, input: [outcome, "findings?"], output: ComplianceReview, side_effects: ["ComplianceReview IN_REVIEW -> CLEARED or FLAGGED per outcome"] }

  - { method: GET, path: "/api/commission-invoices", description: "List/filter commission invoices (FK reverse for loi_id)", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: ["loi_id?", "broker_side?", "status?", "limit?", "offset?"], output: "CommissionInvoice[]", side_effects: [] }
  - { method: GET, path: "/api/commission-invoices/{id}", description: "Fetch one invoice", roles: [TenantRep, LeasingManager, ProjectManager, AssetManager, ComplianceOfficer], code: 200, input: [], output: CommissionInvoice, side_effects: [] }
  - { method: POST, path: "/api/commission-invoices/{id}/issue", description: "Issue (or re-issue after dispute) an accrued invoice", roles: [LeasingManager], code: 200, input: [], output: CommissionInvoice, side_effects: ["CommissionInvoice ACCRUED|DISPUTED -> INVOICED"] }
  - { method: POST, path: "/api/commission-invoices/{id}/pay", description: "Pay installment 1 (at execution) or installment 2 (only after rent commencement)", roles: [LeasingManager], code: 200, input: [installment_number], output: CommissionInvoice, side_effects: ["INVOICED -> PARTIALLY_PAID (installment 1) or PARTIALLY_PAID -> PAID (installment 2)"] }
  - { method: POST, path: "/api/commission-invoices/{id}/dispute", description: "Dispute an issued invoice", roles: [LeasingManager], code: 200, input: [reason], output: CommissionInvoice, side_effects: ["CommissionInvoice INVOICED -> DISPUTED", "dispute_reason recorded"] }

  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock; this call moves the logical clock used by tour completion, option windows, and option expiry", roles: [AssetManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock set"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or TenantRep ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or wrong type" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared member" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "end_at <= start_at, window_close_date <= window_open_date, or min_sf > max_sf" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not declared from the entity's current status (incl. terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_loi_version != LOI.version on submit or counter (OCC)" }
  - { id: ERR_SITE_NOT_LISTED, http: 409, condition: "Site not LISTED where LISTED is required (or not IN {LISTED, RESERVED} on tour confirm)" }
  - { id: ERR_COMPLIANCE_NOT_CLEARED, http: 409, condition: "Required ComplianceReview missing or not CLEARED for the gated action" }
  - { id: ERR_HARD_MINIMUMS_NOT_MET, http: 422, condition: "Site fails the requirement's hard minimums at LOI creation" }
  - { id: ERR_NO_COMPLETED_TOUR, http: 409, condition: "No COMPLETED tour exists for (requirement, site) at LOI creation" }
  - { id: ERR_LOI_ALREADY_OPEN, http: 409, condition: "Another LOI for (requirement, site) is DRAFT/SUBMITTED/COUNTERED/ACCEPTED" }
  - { id: ERR_SF_OUT_OF_RANGE, http: 422, condition: "leased_sf outside the requirement's [min_sf, max_sf]" }
  - { id: ERR_INSUFFICIENT_SF, http: 422, condition: "site.available_sf < requested leased_sf or option_sf" }
  - { id: ERR_TOUR_SITE_CONFLICT, http: 409, condition: "New tour intersects a non-CANCELLED tour at the same site under 30-minute buffered interval semantics" }
  - { id: ERR_REP_CALENDAR_CONFLICT, http: 409, condition: "New tour intersects a non-CANCELLED tour of the same tenant_rep_id under plain half-open interval semantics" }
  - { id: ERR_DUPLICATE_MILESTONE, http: 409, condition: "milestone_type already used on the plan" }
  - { id: ERR_DUPLICATE_REVIEW, http: 409, condition: "A review with the same (site_id, requirement_id, review_type) already exists" }
  - { id: ERR_OPTION_WINDOW_NOT_OPEN, http: 409, condition: "Exercise attempted before window_open_date" }
  - { id: ERR_OPTION_WINDOW_EXPIRED, http: 409, condition: "Exercise attempted after window_close_date (inclusive close); option transitions to EXPIRED" }
  - { id: ERR_TOUR_NOT_CONCLUDED, http: 409, condition: "Tour completion attempted before logical clock reaches end_at" }
  - { id: ERR_INSTALLMENT_NOT_DUE, http: 409, condition: "Installment 2 payment attempted before installment_2_due (site not yet LEASED)" }
  - { id: ERR_FREE_RENT_OVER_CAP, http: 422, condition: "Effective free_rent_months > 12 at submit/resubmit" }
  - { id: ERR_NER_BELOW_FLOOR, http: 422, condition: "net_effective_rent_psf < round_half_up(0.60 * asking_rate_psf, 2) at accept" }
  - { id: ERR_RENT_CONVERSION_OVER_RUN, http: 422, condition: "converted_base_rate_psf > round_half_up(1.10 * loi.base_rate_psf, 2) at BTS approve" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TenantRep
    description: "Tenant-side broker: owns requirement intake, tours, LOI submission/counters, option exercise"
    identity: opaque
    exclusive_operations: ["create/withdraw tenant requirements", "request/complete/cancel own tours", "create/submit/withdraw LOIs on own requirements", "exercise/release expansion options on own LOIs"]
    shared_operations: ["read any entity", "match-evaluations"]
  - name: LeasingManager
    description: "Developer-side leasing lead: owns site inventory, tour confirmation, LOI counters/accept/reject, option grants, commission administration"
    identity: opaque
    exclusive_operations: ["create sites", "confirm/cancel tours", "counter/accept/reject LOIs", "grant expansion options", "issue/pay/dispute commission invoices"]
    shared_operations: ["read any entity", "match-evaluations"]
  - name: ProjectManager
    description: "Developer-side construction lead: owns BTS pricing/revision and delivery milestones"
    identity: opaque
    exclusive_operations: ["price/revise BTS plans", "create/complete delivery milestones"]
    shared_operations: ["read any entity"]
  - name: AssetManager
    description: "Developer-side final approver: executes LOIs, approves BTS pricing, operates the logical clock"
    identity: opaque
    exclusive_operations: ["execute LOIs", "approve BTS plans", "set the logical clock"]
    shared_operations: ["read any entity"]
  - name: ComplianceOfficer
    description: "Environmental and zoning-use verifier"
    identity: opaque
    exclusive_operations: ["create/begin/resolve compliance reviews"]
    shared_operations: ["read any entity"]
