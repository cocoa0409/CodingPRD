            - call: "POST /chattel/loans/${l}/fund"
              payload: { first_due_date: "2026-09-01T00:00:00Z" }
              as: ClosingAgent
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /chattel/loans/${l}/servicing-assessment"
              payload: {}
              as: Servicer
          assert:
            - "HTTP 200"
            - "InsurancePolicy.${p}.status == LAPSED"
            - "Loan.${l}.insurance_compliance == NON_COMPLIANT"
            - "Loan.${l}.interest_accrued_unpaid_cents == 72308 (45 days from 2026-08-01 to 2026-09-15 at 1275 bps on 4600000)"
            - "Loan.${l}.last_accrual_date == 2026-09-15T00:00:00.000Z"
            - "Loan.${l}.delinquent_days == 14 and servicing_state == CURRENT"
            - "Loan.${l}.fees_outstanding_cents == 0 (no late fee: 14 < DELINQUENCY_THRESHOLD_DAYS 30)"
            - "Loan.${l}.principal_balance_cents == 4600000 (assessment never touches principal)"

      - name: lien_filing_rejected_fork_then_resubmit_returns_to_recorded
        claim_type: valid_transition
        grounds:
          - state_machines[LienFiling.status].transitions[SUBMITTED -> REJECTED]
          - state_machines[LienFiling.status].transitions[REJECTED -> SUBMITTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / lien_filing_reject_resubmit_cycle_returns_to_recorded
          rationale: "That §1.8 instance walks SUBMITTED -> REJECTED -> SUBMITTED -> RECORDED on one filing, asserting attempt_number, rejection_code and the loan's perfection_state at each hop, which covers both arms of the agency-response fork and the resubmit return edge."
      - name: cascade_down_default_declaration_sets_recovery_hold
        claim_type: cascade_down
        grounds:
          - endpoints[POST /chattel/loans/{loan_id}/default-declare]
          - calculations.borrower_exposure
        excluded_because:
          difficulty_instance: transitive_cascade / default_declaration_four_hop_loan_case_unit_borrower_cascade
          rationale: "That §1.8 instance asserts the whole Loan -> RecoveryCase -> ManufacturedUnit -> Borrower cascade produced by one default-declare, including unit.recovery_hold and the borrower's SUSPENDED status."
      - name: compensation_conversion_rescind_restores_released_title_lien
        claim_type: compensation
        grounds:
          - state_machines[LienFiling.status].transitions[RELEASED -> RECORDED]
          - state_machines[ManufacturedUnit.classification].transitions[REAL_PROPERTY -> PERSONAL_PROPERTY]
        excluded_because:
          difficulty_instance: compensating_invariant / conversion_rescission_restores_recorded_instrument_count
          rationale: "That §1.8 instance asserts every side effect of conversion COMPLETE is reversed by RESCIND, with the count of RECORDED instruments and the loan's collateral_classification, perfection_state and coverage scoring all restored to their pre-conversion values."
      - name: guarded_transition_fund_requires_executed_community_agreement
        claim_type: guarded_transitions
        grounds:
          - state_machines[Loan.underwriting_state].transitions[APPROVED -> FUNDED].preconditions
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / fund_requires_community_operator_agreement_executed
          rationale: "That §1.8 instance is exactly the cross-entity guard: funding is refused while the Community's operator_agreement_status is PENDING and succeeds once it is EXECUTED, with no change to the Loan itself between the two attempts."
      - name: branching_loan_three_dimensions_advance_independently
        claim_type: branching
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines[Loan.perfection_state]
        excluded_because:
          difficulty_instance: non_linear_state_machine / loan_three_state_dimensions_advance_independently
          rationale: "That §1.8 instance drives the underwriting, servicing and perfection dimensions along different arms of the branching shape and asserts the combined triple at each step."

  - section: calculations
    instances:

      - name: valuation_location_adjustment_is_negative_without_an_operator_agreement
        claim_type: correct_result
        grounds:
          - calculations.unit_book_valuation
          - entities.Valuation.fields.location_key
          - entities.Community.fields.operator_agreement_status
        distinguishing_aspect: "With operator_agreement_status still NONE the location key resolves to COMMUNITY_WITHOUT_AGREEMENT and LOCATION_ADJUSTMENT_BPS is -700, so location_adjustment_cents is -375581 and the same 1440 sqft 2018 unit certifies at 5239859 instead of the 5776403 it would reach with an executed agreement - the adjustment is taken on book_base_cents 5365440, never on a running subtotal."
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default, so valuation_year is 2026 and age_years is 8 (depreciation 2800 bps, below the 7000 bps cap)."
            - "One guide: base 4500 cents/sqft, multi-wide multiplier 11500 bps, annual depreciation 350 bps, effective 2026-01-01."
            - "One Community whose operator_agreement_status is NONE, hosting one 1440 sqft MULTI_WIDE GOOD PIER_AND_ANCHOR unit."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { v: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Valuation.${v}.valuation_year == 2026"
            - "Valuation.${v}.location_key == COMMUNITY_WITHOUT_AGREEMENT"
            - "Valuation.${v}.book_base_cents == 5365440"
            - "Valuation.${v}.condition_adjustment_cents == 0 (GOOD is 0 bps)"
            - "Valuation.${v}.location_adjustment_cents == -375581"
            - "Valuation.${v}.installation_adjustment_cents == 250000"
            - "Valuation.${v}.forced_sale_discount_cents == 0 and detach_and_move_cost_cents == 0"
            - "Valuation.${v}.certified_value_cents == 5239859"
            - "Valuation.${v}.status == DRAFT and certified_by_user_id == null and certified_at == null"
            - "ManufacturedUnit.${u}.version == 2 (creating a valuation bumps the unit's version)"

      - name: recovery_liquidation_on_an_unagreed_community_lot_subtracts_detach_and_move_cost
        claim_type: constants_applied
        grounds:
          - calculations.unit_book_valuation.constants.DETACH_AND_MOVE_COST_CENTS
          - calculations.unit_book_valuation.constants.RECOVERY_FORCED_SALE_DISCOUNT_BPS
          - entities.Valuation.fields.detach_and_move_cost_cents
        distinguishing_aspect: "DETACH_AND_MOVE_COST_CENTS 675000 is charged only when location_key == COMMUNITY_WITHOUT_AGREEMENT: on the same unit the RECOVERY_LIQUIDATION variant drops the 250000 installation adjustment, discounts the 4989859 adjusted figure by 2200 bps (1097769) and then subtracts the flat 675000 move cost, certifying at 3217090."
        test_recipe:
          setup:
            - "The same guide, community (operator_agreement_status NONE) and 1440 sqft 2018 GOOD PIER_AND_ANCHOR unit as the ORIGINATION case, plus one existing ORIGINATION valuation on that unit."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { v_orig: "$.data.id" }
            - call: "GET /chattel/units/${u}"
              payload: {}
              as: RecoveryManager
              captures: { u_v2: "$.data.version" }
          trigger:
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "RECOVERY_LIQUIDATION", expected_unit_version: "${u_v2}" }
              as: RecoveryManager
              captures: { vr: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Valuation.${vr}.location_key == COMMUNITY_WITHOUT_AGREEMENT"
            - "Valuation.${vr}.book_base_cents == 5365440 and condition_adjustment_cents == 0 and location_adjustment_cents == -375581"
            - "Valuation.${vr}.installation_adjustment_cents == 0 (the liquidation variant drops it entirely)"
            - "Valuation.${vr}.forced_sale_discount_cents == 1097769"
            - "Valuation.${vr}.detach_and_move_cost_cents == 675000"
            - "Valuation.${vr}.certified_value_cents == 3217090"
            - "Valuation.${v_orig}.status == DRAFT (a different-variant valuation does not supersede it)"
            - "Valuation.${v_orig}.certified_value_cents == 5239859 (unchanged)"

      - name: term_clamped_to_remaining_useful_life_below_the_floor_is_refused
        claim_type: constants_applied
        grounds:
          - calculations.loan_rate_and_term.constants.USEFUL_LIFE_YEARS
          - calculations.loan_rate_and_term.constants.MIN_TERM_MONTHS
          - validations[priority=61]
          - errors[ERR_TERM_FLOOR_UNREACHABLE]
        distinguishing_aspect: "A 1988 unit valued in 2026 has only (40 - 38) * 12 == 24 months of useful life left, so the four-way nested min collapses to 24; 24 is below MIN_TERM_MONTHS 60 and submit-underwriting is refused with ERR_TERM_FLOOR_UNREACHABLE (422) even though ltv_bps 9243 is comfortably inside the 9500 cap - the term floor, not leverage, is what kills the deal."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z so valuation_year is 2026; a 1988 unit hits the 7000 bps depreciation cap."
            - "One 1080 sqft SINGLE_WIDE model_year 1988 GOOD PIER_AND_ANCHOR unit on the borrower's own land, certifying at 1839220 cents."
            - "One DRAFT loan of 1700000 cents requesting 180 months."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Marcus Bell", credit_score: 728, monthly_income_cents: 610000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB8801234", manufacturer: "Fleetwood", model_year: 1988, width_class: "SINGLE_WIDE", square_feet: 1080, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 1, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b}", land_parcel_apn: "072-114-003", land_county: "Bibb" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { v: "$.data.id" }
            - call: "POST /chattel/valuations/${v}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b}", unit_id: "${u}", origination_valuation_id: "${v}", principal_cents: 1700000, requested_term_months: 180 }
              as: CreditAnalyst
              captures: { l: "$.data.id" }
          trigger:
            - call: "POST /chattel/loans/${l}/submit-underwriting"
              payload: {}
              as: CreditAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_TERM_FLOOR_UNREACHABLE with HTTP 422"
            - "the error_id is NOT ERR_LTV_CAP_EXCEEDED: 1700000 * 10000 / 1839220 rounds to 9243, inside the 9500 cap"
            - "Valuation.${v}.book_base_cents == 1458000 and location_adjustment_cents == 131220 and installation_adjustment_cents == 250000 and certified_value_cents == 1839220"
            - "Loan.${l}.underwriting_state == DRAFT (the refused submission left the loan where it was)"
            - "Loan.${l}.ltv_bps == null and apr_bps == null and term_months == null (no priced field is persisted by a refused submission)"

      - name: required_coverage_floors_at_principal_when_the_bps_leg_is_lower
