  # =============================================================================================
  # RULE 4 — transitive_cascade
  # =============================================================================================
  - rule_id: transitive_cascade
    instances:
      - name: implementation_cascade_five_links_project_plan_intersection_corridor_complaint
        grounds:
          - state_machines.RetimingProject.PLAN_DEVELOPMENT_to_IMPLEMENTED
          - state_machines.TimingPlan.CERTIFIED_to_DEPLOYED
          - state_machines.Corridor.SCREENED_to_DEFERRED
          - state_machines.CitizenComplaint.TRIAGED_to_OPEN
          - calculations.corridor_priority_score
          - calculations.corridor_avg_plan_age_days
          - calculations.priority_budget_allocation
          - entities.Intersection.fields.last_retimed_at
          - entities.CitizenComplaint.fields.reopen_count
        distinguishing_aspect: |
          Five genuinely transitive links, each caused by the previous one and each landing on a
          DIFFERENT entity: project -> IMPLEMENTED (link 1) causes plan -> DEPLOYED (link 2), which
          causes Intersection.last_retimed_at/priority_budget_sec refresh (link 3), which causes every
          Corridor holding that intersection to be re-scored under the programming variant and
          auto-DEFERRED below 35.00 (link 4), which causes that corridor's TRIAGED COORDINATION
          complaints to be requeued to OPEN (link 5). Removing link 3 alone would silently leave
          links 4 and 5 unfired.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z for the whole chain."
            - "Intersection i1 is READY and never retimed (timing_plan_age_days 3650)."
            - "Corridor c1 is ARTERIAL, annual_volume_change_pct 20.0, single member i1, SELECTED (screening score 91.25, programming score 91.25)."
            - "Corridor c2 is LOCAL, annual_volume_change_pct 0.0, single member i1 (many-to-many: i1 belongs to both corridors), and holds 3 complaints - two COORDINATION and one PEDESTRIAN - all TRIAGED."
            - "c2 was screened while i1 was still stale, giving screening score 38.40 (above DEFER_SCORE_THRESHOLD 35.00) and selection_status SCREENED."
            - "Project p1 on c1 is in PLAN_DEVELOPMENT with plan pl1 CERTIFIED at a coordinated cycle of 105 s."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { c1_screen_score: $.data.priority_score }
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Oldest arterial timing plans in the program" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors"
              payload: { name: "Elm Local Loop", jurisdiction_class: "LOCAL", annual_volume_change_pct: 0.0 }
              as: SignalOpsAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c2_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Ada Reyes", email: "ada.reyes@example.org", contact_pref: "EMAIL" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_id: $.data.id }
            - call: "POST /signal-ops/complaints"
