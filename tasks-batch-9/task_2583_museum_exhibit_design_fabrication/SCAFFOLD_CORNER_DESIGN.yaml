            - "${h1} == ERR_INVALID_INTERACTIVE_STATE with HTTP 409 - mark-fabricated needs PROTOTYPE_APPROVED, and SPECIFIED cannot short-circuit the loop"
            - "${h2} == ERR_INVALID_INTERACTIVE_STATE with HTTP 409 - a decision needs a submission first"
