    roles: [CellarLead]
    code: 201
    input: [harvest_lot_id, weight_lbs, position]
    output: BlendLine
    side_effects:
      - "Recompute target_juice_liters"
      - "Validates lot has sufficient unpressed_weight_lbs"

  - method: GET
    path: "/cidery/blend-lines"
    description: "Filtered list of blend lines (by press_batch_id, harvest_lot_id)"
    roles: [CellarLead, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "press_batch_id?", "harvest_lot_id?"]
    output: "BlendLine[]"
    side_effects: []

  - method: GET
    path: "/cidery/blend-lines/{id}"
    description: "Get a single blend line by id"
    roles: [CellarLead, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: BlendLine
    side_effects: []

  - method: POST
    path: "/cidery/press-batches/{batchId}/start"
    description: "Start pressing (PLANNED -> PRESSING)"
    roles: [CellarLead]
    code: 200
    input: []
    output: PressBatch
    side_effects:
      - "All lots consumed; lot.pressed_weight_lbs updated; lots auto-advance"
      - "Contract.received_weight_lbs unchanged (already counted at receive)"

  - method: POST
    path: "/cidery/press-batches/{batchId}/pause"
    description: "Pause pressing (PRESSING -> PLANNED); reverses lot consumption"
    roles: [CellarLead]
    code: 200
    input: [reason]
    output: PressBatch
    side_effects:
      - "Each lot.pressed_weight_lbs -= its BlendLine weight"
