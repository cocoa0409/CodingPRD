  - method: POST
    path: "/meter-exchanges/{meter_exchange_id}/cancel"
    description: "Cancel a SCHEDULED or FAILED exchange"
    roles: [MeterTechnician]
    code: 200
    input: []
    output: MeterExchange
    side_effects: ["CANCELLED"]

  # --- Inspections ---
  - method: POST
    path: "/inspections"
    description: "Request an inspection (application SCREEN_PASSED; a COMPLETED meter exchange exists; at most one SCHEDULED per application; scheduled_date >= now)"
    roles: [Applicant]
    code: 201
    input: [application_id, scheduled_date]
    output: Inspection
    side_effects: ["inspection_status=SCHEDULED"]
  - method: GET
    path: "/inspections"
    description: "List inspections"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: ["application_id?", "inspection_status?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/inspections/{inspection_id}"
    description: "Get inspection"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{inspection_id}/record-result"
    description: "Record inspection outcome (segregation of duties vs exchange technician; occurred_at within [scheduled_date, now]; defects required iff FAILED)"
    roles: [Inspector]
    code: 200
    input: [outcome, occurred_at, "defects?"]
    output: Inspection
    side_effects: ["RESULT_RECORDED; inspector_user_id = X-User-ID"]
  - method: POST
    path: "/inspections/{inspection_id}/cancel"
    description: "Cancel a SCHEDULED inspection"
    roles: [Applicant]
    code: 200
    input: []
    output: Inspection
    side_effects: ["CANCELLED"]

  # --- Meter readings ---
  - method: POST
    path: "/meter-readings"
    description: "Post a bimonthly/monthly meter reading (OCC on account version). A period exactly equal to an existing POSTED reading supersedes it (REVERSAL entries + new entries); a partial overlap is rejected."
    roles: [MeterTechnician]
    code: 201
    input: [service_account_id, period_start, period_end, import_wh, export_wh, expected_account_version]
    output: MeterReading
    side_effects: ["Ledger entries per calculations.monthly_netting; account balances recomputed; increments ServiceAccount.version by 1; first POSTED reading flips application PTO_GRANTED -> OPERATING"]
  - method: GET
    path: "/meter-readings"
    description: "List meter readings"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: ["service_account_id?", "reading_status?", "tariff_id?"]
    output: MeterReading[]
    side_effects: []
  - method: GET
    path: "/meter-readings/{meter_reading_id}"
    description: "Get meter reading"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: []
    output: MeterReading
    side_effects: []
  - method: POST
    path: "/meter-readings/{meter_reading_id}/void"
    description: "Void a POSTED reading (compensating REVERSAL entries)"
    roles: [MeterTechnician]
    code: 200
    input: [reason]
    output: MeterReading
    side_effects: ["VOIDED; REVERSAL ledger entries; balances recomputed"]

  # --- Credit ledger ---
  - method: GET
    path: "/ledger-entries"
    description: "List credit ledger entries (append-only)"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: ["service_account_id?", "meter_reading_id?", "annual_reconciliation_id?", "entry_type?"]
    output: CreditLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/ledger-entries/{ledger_entry_id}"
    description: "Get ledger entry"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: []
    output: CreditLedgerEntry
    side_effects: []

  # --- Annual reconciliations ---
  - method: POST
    path: "/annual-reconciliations"
    description: "Compute the annual true-up for an account (run window: [window_end, window_end + 60 days); one non-void per account-year)"
    roles: [ProgramAdministrator]
    code: 201
    input: [service_account_id, reconciliation_year]
    output: AnnualReconciliation
    side_effects: ["COMPUTED with surplus/payout/forfeiture figures; tariff pinned"]
  - method: GET
    path: "/annual-reconciliations"
    description: "List reconciliations"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: ["service_account_id?", "reconciliation_status?", "tariff_id?"]
    output: AnnualReconciliation[]
    side_effects: []
  - method: GET
    path: "/annual-reconciliations/{annual_reconciliation_id}"
    description: "Get reconciliation"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: []
    output: AnnualReconciliation
    side_effects: []
  - method: POST
    path: "/annual-reconciliations/{annual_reconciliation_id}/finalize"
    description: "Settle the reconciliation (posts ledger entries)"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: AnnualReconciliation
    side_effects: ["SETTLED; TRUE_UP_PAYOUT/TRUE_UP_FORFEIT or BANK_FORFEIT entries; balances recomputed"]
  - method: POST
    path: "/annual-reconciliations/{annual_reconciliation_id}/void"
    description: "Void a COMPUTED reconciliation (no ledger effect)"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: AnnualReconciliation
    side_effects: ["VOIDED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role missing, or role name not recognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted to invoke this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Applicant X-User-ID does not match the customer_id owning the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "Body foreign key references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum value, non-positive quantity, empty amend payload, missing deficiency_note on INCOMPLETE decision, period_end <= period_start" }
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version does not match the application's current version" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match the account's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Primary resource not in a state that permits the requested transition" }
  - { id: ERR_ESTIMATE_NOT_ISSUED, http: 409, condition: "Accept/decline attempted on an estimate not in ISSUED status" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Inspector recording the result is the technician who completed that application's meter exchange" }
  - { id: ERR_ESTIMATE_EXPIRED, http: 422, condition: "Accept attempted while now > valid_until (estimate still ISSUED; sweep not yet run)" }
  - { id: ERR_INSPECTION_DATE_INVALID, http: 422, condition: "scheduled_date < now at creation, or occurred_at outside [scheduled_date, now]" }
  - { id: ERR_TRUE_UP_WINDOW_NOT_OPEN, http: 422, condition: "Reconciliation creation outside [window_end, window_end + 60 days)" }
  - { id: ERR_TARIFF_WINDOW_OVERLAP, http: 422, condition: "New tariff window overlaps another schedule of the same program (half-open; touching allowed)" }
  - { id: ERR_READING_PERIOD_OVERLAP, http: 422, condition: "Reading period partially overlaps a POSTED reading of the same account (exact equality supersedes instead)" }
  - { id: ERR_EXCHANGE_WINDOW_INVALID, http: 422, condition: "window_end <= window_start" }
  - { id: ERR_EXCHANGE_WINDOW_OVERLAP, http: 422, condition: "Crew buffer conflict: [window_start - 30m, window_end + 30m) intersects another SCHEDULED exchange of the same crew_id" }
  - { id: ERR_EXCHANGE_ALREADY_ACTIVE, http: 422, condition: "Application already has a SCHEDULED meter exchange" }
  - { id: ERR_INSPECTION_EXISTS, http: 422, condition: "Application already has a SCHEDULED inspection" }
  - { id: ERR_SUPPLEMENTAL_REVIEW_OPEN, http: 422, condition: "Application already has an OPEN supplemental review" }
  - { id: ERR_DUPLICATE_ACTIVE_APPLICATION, http: 422, condition: "Another non-terminal application exists for the same service account (checked at submit)" }
  - { id: ERR_INCOMPLETE_DOCUMENTS, http: 422, condition: "Completeness COMPLETE decision while the required document set is not fully ACCEPTED" }
  - { id: ERR_NO_REJECTED_DOCUMENTS, http: 422, condition: "Completeness INCOMPLETE decision while no document is REJECTED" }
  - { id: ERR_DEFECTS_REQUIRED, http: 422, condition: "FAILED inspection recorded without defects" }
  - { id: ERR_SIZE_EXCEEDS_CLASS_CAP, http: 422, condition: "Amend would set system_size_watts_ac above the service-class cap" }
  - { id: ERR_PRODUCTION_EXCEEDS_LOAD, http: 422, condition: "Amend would set estimated_annual_production_wh above 110% of prior annual usage" }
  - { id: ERR_PROGRAM_NOT_ACCEPTING, http: 422, condition: "Submit while program is SUSPENDED or CLOSED" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 422, condition: "Operation requires account_status == ACTIVE" }
  - { id: ERR_ACCOUNT_NOT_NET_METERING, http: 422, condition: "Meter reading or true-up requires metering_status == NET_METERING" }
  - { id: ERR_METER_EXCHANGE_NOT_COMPLETED, http: 422, condition: "Inspection request or PTO requires a COMPLETED meter exchange for the application" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 422, condition: "PTO requires the latest inspection to be RESULT_RECORDED with outcome PASSED" }
  - { id: ERR_NO_EFFECTIVE_TARIFF, http: 422, condition: "No tariff schedule of the program is effective at the required instant (PTO now, reading period_start, true-up compute)" }
  - { id: ERR_PROGRAM_HAS_INFLIGHT_WORK, http: 422, condition: "Program close attempted with non-terminal applications" }
  - { id: ERR_ACCOUNT_HAS_INFLIGHT_APPLICATIONS, http: 422, condition: "Account close attempted with a non-terminal application referencing the account" }
  - { id: ERR_DUPLICATE_TRUE_UP, http: 422, condition: "A COMPUTED or SETTLED reconciliation already exists for (service_account_id, reconciliation_year)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Customer-side actor; owns service accounts via Customer identity; drives its own applications through intake, document upload, estimate acceptance, inspection requests"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/amend"
      - "POST /applications/{id}/withdraw"
      - "POST /documents"
      - "POST /cost-estimates/{id}/accept"
      - "POST /cost-estimates/{id}/decline"
      - "POST /inspections"
      - "POST /inspections/{id}/cancel"
    shared_operations:
      - "All GET endpoints"
  - name: InterconnectionCoordinator
    description: "Utility interconnection desk operator; screens completeness, reviews documents, grants PTO"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/completeness-decision"
      - "POST /documents/{id}/review"
      - "POST /applications/{id}/grant-pto"
    shared_operations:
      - "All GET endpoints"
  - name: DistributionEngineer
    description: "Utility engineer; runs technical screens, conducts supplemental reviews, issues upgrade cost estimates, marks work complete"
    identity: "opaque"
    exclusive_operations:
      - "POST /screening-reports"
      - "POST /supplemental-reviews"
      - "POST /supplemental-reviews/{id}/complete"
      - "POST /cost-estimates"
      - "POST /cost-estimates/{id}/mark-work-complete"
    shared_operations:
      - "All GET endpoints"
  - name: MeterTechnician
    description: "Meter shop technician; schedules/completes/fails/reschedules/cancels meter exchanges; posts and voids meter readings"
    identity: "opaque"
    exclusive_operations:
      - "POST /meter-exchanges"
      - "POST /meter-exchanges/{id}/complete"
      - "POST /meter-exchanges/{id}/fail"
      - "POST /meter-exchanges/{id}/reschedule"
      - "POST /meter-exchanges/{id}/cancel"
      - "POST /meter-readings"
      - "POST /meter-readings/{id}/void"
    shared_operations:
      - "All GET endpoints"
  - name: Inspector
    description: "Field inspector; records inspection results (segregated from the meter technician who completed the exchange)"
    identity: "opaque"
    exclusive_operations:
      - "POST /inspections/{id}/record-result"
    shared_operations:
      - "All GET endpoints"
  - name: ProgramAdministrator
    description: "Utility program office; owns all grid/tariff/program configuration, accounts, sweeps, true-ups, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs and all /programs/{id}/* actions"
      - "POST /tariff-schedules"
      - "POST /feeders"
      - "POST /service-transformers"
      - "POST /customers"
      - "POST /service-accounts and account status actions"
      - "POST /annual-reconciliations and finalize/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
