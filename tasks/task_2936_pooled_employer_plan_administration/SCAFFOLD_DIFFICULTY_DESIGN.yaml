            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Meridian Pooled Plan Services LLC", ein: "410000001", fidelity_bond_amount_cents: 100000000 }
              as: RegulatorOps
