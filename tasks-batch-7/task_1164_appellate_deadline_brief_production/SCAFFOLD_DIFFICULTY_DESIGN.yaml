              payload: { hearing_date: "2026-04-01T10:00:00Z", court_reporter: "R", estimated_pages: 5 }
              as: Attorney
              as_user_id: "${att_casc}"
              captures: { to_casc: $.data.id }
            - call: "POST /appellate/transcript-orders/${to_casc}/begin-preparation"
