# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Breadth Coverage Index
# Task 2358 — Farmland Preservation Easement Purchase
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented.
# Corners already asserted by a §1.8 instance appear as excluded_because
# stubs citing that instance by name.
#
# Fixture identity conventions (opaque roles): "admin-1" ProgramAdmin,
# "officer-1" AcquisitionOfficer, "reviewer-1" AppraisalReviewer,
# "appraiser-1"/"appraiser-2" Appraiser, "monitor-1" StewardshipMonitor.
# Landowner ids are server-minted and captured.
#
# The logical clock starts at its declared default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: program_creation_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.PreservationProgram
          - endpoints[POST /preservation-programs]
          - response_envelope.success
        distinguishing_aspect: "POST /preservation-programs with all fourteen input fields returns 201 and echoes every one, with status defaulted to ACTIVE, total_preserved_acres 0.00 and version 1."
        test_recipe:
          setup:
            - "Empty database. The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - &k_prog1
              call: "POST /preservation-programs"
              payload: { name: "Statewide Farmland Preservation", soil_weight: 0.35, size_weight: 0.15, contiguity_weight: 0.25, pressure_weight: 0.25, min_composite_score: 60.00, max_negotiation_rounds: 3, local_match_min_pct: 0.25, federal_max_share_pct: 0.50, impervious_allowance_pct: 0.02, amendment_policy: "STRICT", monitoring_interval_days: 365, monitoring_grace_days: 30, appraisal_engagement_buffer_days: 3 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "the response envelope has response_type == object and meta.api_request_id present"
            - "PreservationProgram.${prog_id}.name == Statewide Farmland Preservation"
            - "PreservationProgram.${prog_id}.soil_weight == 0.35 and size_weight == 0.15 and contiguity_weight == 0.25 and pressure_weight == 0.25"
            - "PreservationProgram.${prog_id}.min_composite_score == 60.00 and max_negotiation_rounds == 3"
            - "PreservationProgram.${prog_id}.local_match_min_pct == 0.25 and federal_max_share_pct == 0.50"
            - "PreservationProgram.${prog_id}.impervious_allowance_pct == 0.02 and amendment_policy == STRICT"
            - "PreservationProgram.${prog_id}.status == ACTIVE"
            - "PreservationProgram.${prog_id}.total_preserved_acres == 0.00"
            - "PreservationProgram.${prog_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: parcel_retrieval_returns_stored_and_derived_values
        claim_type: Retrieval
        grounds:
          - entities.Parcel
          - endpoints[GET /parcels/{id}]
          - calculations.parcel_soil_quality_score
          - calculations.parcel_development_pressure_score
        distinguishing_aspect: "GET /parcels/{id} returns the exact stored inputs plus the two scores stamped at creation, soil 84.00 and pressure 78.00, with status ELIGIBLE and version 1."
        test_recipe:
          setup:
            - "Program P1 exists. One Landowner exists. The clock is 2026-08-10."
            - "Parcel PA1 was created with acres 160.00, prime 120.00, statewide-important 24.00, contiguous 80.00, 640 ft frontage, sewer available, 2.0-acre zoning, baseline_dwelling_rights 4, unrestricted 288,000,000, restricted 112,450,000, lienholder Midstate Farm Credit."
          setup_api_calls:
            - *k_prog1
            - &k_lo_a
              call: "POST /landowners"
              payload: { legal_name: "Harlan Family Trust", mailing_state: "PA", tax_id_last4: "4417" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { lo_a_id: $.data.id }
            - &k_clk_0810
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &k_parcel_a
              call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 160.00, prime_soil_acres: 120.00, statewide_important_soil_acres: 24.00, contiguous_preserved_acres: 80.00, road_frontage_feet: 640, sewer_available: true, zoning_min_lot_acres: 2.0, baseline_dwelling_rights: 4, unrestricted_value_cents: 288000000, restricted_value_cents: 112450000, mortgage_lienholder_name: "Midstate Farm Credit" }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { parcel_a_id: $.data.id }
          trigger:
            - call: "GET /parcels/${parcel_a_id}"
              payload: {}
              as: Landowner
              as_user_id: "${lo_a_id}"
          assert:
            - "the trigger returns HTTP 200 with response_type == object"
            - "Parcel.${parcel_a_id}.acres == 160.00 and prime_soil_acres == 120.00 and statewide_important_soil_acres == 24.00"
            - "Parcel.${parcel_a_id}.contiguous_preserved_acres == 80.00 and road_frontage_feet == 640"
            - "Parcel.${parcel_a_id}.sewer_available == true and zoning_min_lot_acres == 2.0"
            - "Parcel.${parcel_a_id}.soil_quality_score == 84.00"
            - "Parcel.${parcel_a_id}.development_pressure_score == 78.00"
            - "Parcel.${parcel_a_id}.mortgage_lienholder_name == Midstate Farm Credit"
            - "Parcel.${parcel_a_id}.status == ELIGIBLE and version == 1"
            - "Parcel.${parcel_a_id}.created_at == 2026-08-10T00:00:00Z"

      - name: parcel_listing_paginates_with_landowner_and_status_filters
        claim_type: Listing
        grounds:
          - endpoints[GET /parcels]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - state_machines.Parcel.ELIGIBLE_to_UNDER_APPLICATION
        distinguishing_aspect: "With three ELIGIBLE parcels for one landowner, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false; after one parcel is attached to an application the status=ELIGIBLE filter drops to total_count 2 while the unfiltered list stays at 3."
        test_recipe:
          setup:
            - "Program P1, one Landowner, clock 2026-08-10, and three parcels PA1, PA2, PA3 all ELIGIBLE for that landowner."
            - "Round R1 is OPEN so one parcel can be attached to an application. The three canonical funding sources exist because opening a round requires at least one ACTIVE source under the program."
          setup_api_calls:
            - *k_prog1
            - &k_src_local
              call: "POST /funding-sources"
              payload: { program_id: "${prog_id}", source_name: "County Open Space Fund", level: "LOCAL", authorized_cents: 60000000, obligation_window_start: "2026-01-01T00:00:00Z", obligation_window_end: "2027-12-31T00:00:00Z", max_share_pct: 0.35, priority_order: 1, requires_match: false, fully_obligated_threshold_pct: 0.95 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { src_local_id: $.data.id }
            - &k_src_state
              call: "POST /funding-sources"
              payload: { program_id: "${prog_id}", source_name: "State Farmland Trust", level: "STATE", authorized_cents: 120000000, obligation_window_start: "2026-01-01T00:00:00Z", obligation_window_end: "2027-12-31T00:00:00Z", max_share_pct: 0.40, priority_order: 2, requires_match: false, fully_obligated_threshold_pct: 0.95 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { src_state_id: $.data.id }
            - &k_src_fed
              call: "POST /funding-sources"
              payload: { program_id: "${prog_id}", source_name: "Federal ACEP-ALE", level: "FEDERAL", authorized_cents: 200000000, obligation_window_start: "2026-01-01T00:00:00Z", obligation_window_end: "2027-12-31T00:00:00Z", max_share_pct: 0.25, priority_order: 3, requires_match: true, match_ratio: 1.0, fully_obligated_threshold_pct: 0.95 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { src_fed_id: $.data.id }
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 200.00, prime_soil_acres: 160.00, statewide_important_soil_acres: 0.00, contiguous_preserved_acres: 90.00, road_frontage_feet: 150, sewer_available: false, zoning_min_lot_acres: 5.0, baseline_dwelling_rights: 5, unrestricted_value_cents: 300000000, restricted_value_cents: 150000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { parcel_b_id: $.data.id }
            - call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Berks", acres: 80.00, prime_soil_acres: 72.00, statewide_important_soil_acres: 8.00, contiguous_preserved_acres: 60.00, road_frontage_feet: 400, sewer_available: true, zoning_min_lot_acres: 1.5, baseline_dwelling_rights: 3, unrestricted_value_cents: 120000000, restricted_value_cents: 45500000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { parcel_d_id: $.data.id }
            - &k_round1
              call: "POST /funding-rounds"
              payload: { program_id: "${prog_id}", round_label: "2026 Cycle A", opens_on: "2026-08-05T00:00:00Z", closes_on: "2026-09-30T00:00:00Z", pool_cents: 500000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { round1_id: $.data.id }
            - &k_round1_open
              call: "POST /funding-rounds/${round1_id}/opening"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /parcels"
              payload: { landowner_id: "${lo_a_id}", status: "ELIGIBLE", limit: 2, offset: 0 }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "GET /parcels"
              payload: { landowner_id: "${lo_a_id}", status: "ELIGIBLE", limit: 2, offset: 2 }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - &k_app_a
              call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_a_id}", landowner_id: "${lo_a_id}", requested_price_cents: 170000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "GET /parcels"
              payload: { landowner_id: "${lo_a_id}", status: "ELIGIBLE" }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "GET /parcels"
              payload: { landowner_id: "${lo_a_id}" }
              as: Landowner
              as_user_id: "${lo_a_id}"
          assert:
            - "the first trigger call returns response_type == array with 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second trigger call returns 1 row with total_count == 3, has_more == false, offset == 2"
            - "the rows across offset 0 and offset 2 are disjoint and together cover ${parcel_a_id}, ${parcel_b_id}, ${parcel_d_id}"
            - "the fourth trigger call returns total_count == 2 and does not contain ${parcel_a_id}"
            - "the fifth trigger call omits limit and offset, returns total_count == 3, has_more == false, limit == 10, offset == 0"
            - "Parcel.${parcel_a_id}.status == UNDER_APPLICATION"

      - name: funding_source_get_with_unknown_id_returns_source_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /funding-sources/{id}]
          - validations[priority=4]
          - errors.ERR_SOURCE_NOT_FOUND
          - response_envelope.error
        distinguishing_aspect: "GET /funding-sources/{id} for an id that was never minted returns 404 ERR_SOURCE_NOT_FOUND in the error envelope, not an empty 200 object."
        test_recipe:
          setup:
            - "Program P1 exists with no funding sources created."
          setup_api_calls:
            - *k_prog1
          trigger:
            - call: "GET /funding-sources/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the trigger returns HTTP 404"
            - "the response has response_type == error and data.error_id == ERR_SOURCE_NOT_FOUND"
            - "the response data carries a message field"
            - "GET /funding-sources?program_id=${prog_id} returns HTTP 200 with total_count == 0"

      - name: application_create_missing_requested_price_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /applications]
          - entities.Application.fields.proposed_price_cents
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /applications omitting requested_price_cents — an input field with no declared default — returns 422 ERR_INVALID_REQUEST and creates nothing, leaving Parcel PA1 ELIGIBLE and FundingRound.application_count at 0."
        test_recipe:
          setup:
            - "Program P1, Landowner, Parcel PA1 ELIGIBLE, round R1 OPEN, clock 2026-08-10."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_round1
            - *k_round1_open
          trigger:
            - call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_a_id}", landowner_id: "${lo_a_id}" }
              as: Landowner
              as_user_id: "${lo_a_id}"
          assert:
            - "the trigger returns HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "Parcel.${parcel_a_id}.status == ELIGIBLE"
            - "Parcel.${parcel_a_id}.version == 1"
            - "FundingRound.${round1_id}.application_count == 0"
            - "GET /applications?funding_round_id=${round1_id} returns total_count == 0"

      - name: program_create_omitting_monitoring_fields_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.PreservationProgram.fields.monitoring_interval_days
          - entities.PreservationProgram.fields.monitoring_grace_days
          - entities.PreservationProgram.fields.appraisal_engagement_buffer_days
          - endpoints[POST /preservation-programs]
          - calculations.stewardship_due_projection.constants
        distinguishing_aspect: "Omitting the three optional program fields yields monitoring_interval_days 365, monitoring_grace_days 30 and appraisal_engagement_buffer_days 3 — the declared defaults — rather than null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /preservation-programs"
              payload: { name: "Default Configuration Program", soil_weight: 0.35, size_weight: 0.15, contiguity_weight: 0.25, pressure_weight: 0.25, min_composite_score: 60.00, max_negotiation_rounds: 3, local_match_min_pct: 0.25, federal_max_share_pct: 0.50, impervious_allowance_pct: 0.02, amendment_policy: "CONDITIONAL" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_def_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "PreservationProgram.${prog_def_id}.monitoring_interval_days == 365"
            - "PreservationProgram.${prog_def_id}.monitoring_grace_days == 30"
            - "PreservationProgram.${prog_def_id}.appraisal_engagement_buffer_days == 3"
            - "PreservationProgram.${prog_def_id}.amendment_policy == CONDITIONAL"
            - "PreservationProgram.${prog_def_id}.status == ACTIVE"

      - name: parcel_computed_scores_are_derived_and_client_supplied_values_rejected
        claim_type: Computed Fields
        grounds:
          - entities.Parcel.fields.soil_quality_score
          - entities.Parcel.fields.development_pressure_score
          - endpoints[POST /parcels]
          - validations[priority=6]
        distinguishing_aspect: "soil_quality_score and development_pressure_score are absent from POST /parcels' input list, so the server derives 84.00 and 78.00; a payload that supplies soil_quality_score is rejected 422 ERR_INVALID_REQUEST as an unknown field rather than being honoured."
        test_recipe:
          setup:
            - "Program P1, Landowner, clock 2026-08-10."
          setup_api_calls:
            - *k_prog1
            - *k_lo_a
            - *k_clk_0810
          trigger:
            - *k_parcel_a
            - call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 160.00, prime_soil_acres: 120.00, statewide_important_soil_acres: 24.00, contiguous_preserved_acres: 80.00, road_frontage_feet: 640, sewer_available: true, zoning_min_lot_acres: 2.0, baseline_dwelling_rights: 4, unrestricted_value_cents: 288000000, restricted_value_cents: 112450000, soil_quality_score: 100.00 }
              as: Landowner
              as_user_id: "${lo_a_id}"
          assert:
            - "the first trigger call returns HTTP 201 with Parcel.${parcel_a_id}.soil_quality_score == 84.00 and development_pressure_score == 78.00"
            - "the second trigger call returns HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "GET /parcels?landowner_id=${lo_a_id} returns total_count == 1"
            - "Parcel.${parcel_a_id}.soil_quality_score != 100.00"

      - name: system_fields_are_server_generated_and_updated_at_advances_on_write
        claim_type: System Fields
        grounds:
          - entities.Parcel
          - endpoints[PATCH /parcels/{id}]
          - concurrency_rules.parcel-attribute-stale-parcel
        distinguishing_aspect: "id, created_at, updated_at and version are all server-generated: a freshly created parcel has version 1 with created_at == updated_at == 2026-08-10, and a PATCH at clock 2026-08-20 leaves created_at at 2026-08-10 while moving updated_at to 2026-08-20 and version to 2."
        test_recipe:
          setup:
            - "Program P1, Landowner, clock 2026-08-10, Parcel PA1 created."
            - "The clock is then advanced to 2026-08-20."
          setup_api_calls:
            - *k_prog1
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - call: "GET /parcels/${parcel_a_id}"
              payload: {}
              as: Landowner
              as_user_id: "${lo_a_id}"
              captures: { parcel_a_v1: $.data.version }
            - &k_clk_0820
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "PATCH /parcels/${parcel_a_id}"
              payload: { expected_parcel_version: "${parcel_a_v1}", contiguous_preserved_acres: 160.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the captured parcel_a_v1 == 1"
            - "the trigger returns HTTP 200"
            - "Parcel.${parcel_a_id}.version == 2"
            - "Parcel.${parcel_a_id}.created_at == 2026-08-10T00:00:00Z"
            - "Parcel.${parcel_a_id}.updated_at == 2026-08-20T00:00:00Z"
            - "Parcel.${parcel_a_id}.contiguous_preserved_acres == 160.00"
            - "Parcel.${parcel_a_id}.id is unchanged by the PATCH"

      - name: parcel_enum_and_numeric_type_constraints_are_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - entities.Parcel.fields.acres
          - entities.Parcel.fields.prime_soil_acres
          - entities.Appraisal.fields.method
          - endpoints[POST /parcels]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Three distinct domain violations all land on 422 ERR_INVALID_REQUEST: acres == 0 breaks acres > 0; prime 120.00 plus statewide-important 50.00 on 160.00 acres breaks prime + important <= acres; and method NARRATIVE is not a member of {PAIRED_SALES, INCOME_CAPITALIZATION}."
        test_recipe:
          setup:
            - "Program P1, Landowner, Parcel PA1, round R1 OPEN, Application AP1 filed at clock 2026-08-10."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_round1
            - *k_round1_open
            - *k_app_a
          trigger:
            - call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 0.00, prime_soil_acres: 0.00, statewide_important_soil_acres: 0.00, contiguous_preserved_acres: 0.00, road_frontage_feet: 100, sewer_available: false, zoning_min_lot_acres: 2.0, baseline_dwelling_rights: 1, unrestricted_value_cents: 1000000, restricted_value_cents: 500000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 160.00, prime_soil_acres: 120.00, statewide_important_soil_acres: 50.00, contiguous_preserved_acres: 80.00, road_frontage_feet: 640, sewer_available: true, zoning_min_lot_acres: 2.0, baseline_dwelling_rights: 4, unrestricted_value_cents: 288000000, restricted_value_cents: 112450000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "POST /applications/${app_a_id}/appraisals"
              payload: { appraiser_user_id: "appraiser-1", appraiser_firm: "Brandywine Rural Appraisal", engagement_start: "2026-08-12T00:00:00Z", engagement_end: "2026-08-26T00:00:00Z", method: "NARRATIVE" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
          assert:
            - "each of the three trigger calls returns HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "GET /parcels?landowner_id=${lo_a_id} returns total_count == 1"
            - "GET /applications/${app_a_id}/appraisals returns total_count == 0"
            - "Application.${app_a_id}.status == RECEIVED"

      - name: negotiation_round_is_immutable_and_exposes_no_version_field
        claim_type: Immutability
        grounds:
          - entities.NegotiationRound
          - endpoints[GET /applications/{id}/negotiation-rounds]
          - state_machines.Application.RANKED_to_OFFER_ISSUED
        distinguishing_aspect: "NegotiationRound is declared common_fields: false, so §1.5 exposes only the read endpoint GET /applications/{id}/negotiation-rounds — there is no POST, PATCH or delete for it and the returned rows carry no version field; the ledger only grows, and the OFFER row keeps amount_cents 175,550,000 even after a COUNTER row is appended."
        test_recipe:
          setup:
            - "Application AP1 is RANKED with certified_easement_value_cents 175,550,000 and an offer of 175,550,000 has been issued at clock 2026-10-05."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - &k_appraisal_a
              call: "POST /applications/${app_a_id}/appraisals"
              payload: { appraiser_user_id: "appraiser-1", appraiser_firm: "Brandywine Rural Appraisal", engagement_start: "2026-08-12T00:00:00Z", engagement_end: "2026-08-26T00:00:00Z", method: "PAIRED_SALES" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
              captures: { appr_a_id: $.data.id }
            - *k_clk_0820
            - &k_appr_submit_a
              call: "POST /appraisals/${appr_a_id}/submission"
              payload: { unrestricted_value_cents: 288000000, restricted_value_cents: 112450000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - &k_appr_certify_a
              call: "POST /appraisals/${appr_a_id}/review"
              payload: { decision: "CERTIFY" }
              as: AppraisalReviewer
              as_user_id: "reviewer-1"
            - &k_clk_1001
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &k_rank_r1
