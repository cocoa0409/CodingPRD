  # ---- writes: housing inventory -----------------------------------------
  - method: POST
    path: "/residence-life/buildings"
    description: "Create a residence hall. posture starts at OPEN."
    roles: [ResidenceDirector]
    code: 201
    input: ["name", "code", "campus_zone", "break_housing_enabled?"]
    output: Building
    side_effects: ["Building created with posture OPEN, bed_capacity 0, assigned_bed_count 0, version 1"]

  - method: POST
    path: "/residence-life/buildings/{building_id}/posture"
    description: "Drive the hall posture machine. target_posture EMERGENCY_CLOSED fires the four-link closure cascade; target_posture OPEN from EMERGENCY_CLOSED replays each room's pre_closure_status."
    roles: [ResidenceDirector]
    code: 200
    input: ["target_posture", "reason?"]
    output: Building
    side_effects:
      - "Rooms in the hall go OFFLINE (closure) or return to pre_closure_status (reopen)"
      - "APPROVED/CHECKED_IN BreakHousingRequest rows on those rooms become REVOKED"
      - "A RoomChangeCase with origin EMERGENCY_RELOCATION is created per revoked stay"
      - "Affected Students become RELOCATION_PENDING"
      - "SCHEDULED RoomInspection rows on those rooms become CANCELLED"
      - "Floor.programming_frozen toggles and programming_compliance_status is recomputed"
      - "increments Building.version by 1"

  - method: POST
    path: "/residence-life/buildings/{building_id}/consolidation"
    description: "Run calculation consolidation_plan over the hall. mode=PLAN reports the moves without applying them; mode=EXECUTE applies them and marks each emptied source room CONSOLIDATED."
    roles: [ResidenceDirector]
    code: 200
    input: ["mode"]
    output: { mode: string, planned_move_count: integer, executed_move_count: integer, vacated_room_ids: array, moved_student_ids: array, occupied_beds_after: integer, vacancy_rate_before: number }
    side_effects:
      - "EXECUTE only: Student.current_room_id updated per move; Room.occupied_beds updated on both sides; emptied source rooms transition OCCUPIED -> CONSOLIDATED"
      - "Building.assigned_bed_count is unchanged by the run"

  - method: POST
    path: "/residence-life/floors"
    description: "Create a floor inside a hall."
    roles: [ResidenceDirector]
    code: 201
    input: ["building_id", "floor_number", "required_programs_per_term?"]
    output: Floor
    side_effects: ["Floor created with all three programming buckets at 0 and programming_compliance_status PENDING"]

  - method: POST
    path: "/residence-life/floors/{floor_id}/budget-allocations"
    description: "Add cents to the floor's programming budget for the term. The new cents land in the available bucket."
    roles: [ResidenceDirector]
    code: 200
    input: ["amount_cents", "term_code"]
    output: Floor
    side_effects: ["programming_budget_cents += amount_cents; programming_available_cents recomputed", "increments Floor.version by 1"]

  - method: POST
    path: "/residence-life/rooms"
    description: "Create a room on a floor. Rebuilds the parent Floor and Building bed_capacity."
    roles: [ResidenceDirector]
    code: 201
    input: ["floor_id", "room_number", "bed_capacity", "last_renovation_year"]
    output: Room
    side_effects: ["Room created with status AVAILABLE and occupied_beds 0", "Floor.bed_capacity and Building.bed_capacity recomputed"]

  - method: POST
    path: "/residence-life/rooms/{room_id}/status"
    description: "Take a room OFFLINE or return it to AVAILABLE outside of a hall-wide closure."
    roles: [ResidenceDirector]
    code: 200
    input: ["target_status", "reason?"]
    output: Room
    side_effects:
      - "OFFLINE also cancels SCHEDULED RoomInspection rows on the room and revokes APPROVED/CHECKED_IN BreakHousingRequest rows for it"
      - "increments Room.version by 1"

  - method: POST
    path: "/residence-life/students"
    description: "Create a resident record."
    roles: [ResidenceDirector]
    code: 201
    input: ["full_name", "email", "class_year", "financial_hardship_flag?"]
    output: Student
    side_effects: ["Student created UNASSIGNED with conduct_standing GOOD, conduct_points 0, damage_balance_cents 0"]

  - method: POST
    path: "/residence-life/students/{student_id}/room-assignment"
    description: "Place a resident into a room (action=PLACE, room_id required) or vacate them (action=VACATE)."
    roles: [ResidenceDirector]
    code: 200
    input: ["action", "room_id?"]
    output: Student
    side_effects:
      - "PLACE: current_room_id := room_id; housing_status := ASSIGNED; Room.occupied_beds += 1; Room may transition AVAILABLE -> OCCUPIED; Floor.occupied_beds and Building.assigned_bed_count recomputed"
      - "VACATE: current_room_id := null; housing_status := UNASSIGNED; Room.occupied_beds -= 1; Room may transition OCCUPIED -> AVAILABLE"
      - "increments Student.version by 1"

  # ---- writes: RA recruitment, training, employment -----------------------
  - method: POST
    path: "/residence-life/ra-applications"
    description: "A student opens an RA application in DRAFT for one hiring term."
    roles: [Student, ResidenceDirector]
    code: 201
    input: ["applicant_student_id", "term_code", "essay_ref"]
    output: RAApplication
    side_effects: ["RAApplication created in DRAFT with revision_count 0"]

  - method: POST
    path: "/residence-life/ra-applications/{application_id}/submit"
    description: "Submit a DRAFT or REVISION_REQUESTED application for review."
    roles: [Student]
    code: 200
    input: ["essay_ref?"]
    output: RAApplication
    side_effects: ["status -> SUBMITTED; submitted_at stamped", "increments RAApplication.version by 1"]

  - method: POST
    path: "/residence-life/ra-applications/{application_id}/review"
    description: "A director opens review on a SUBMITTED application and records the interview score."
    roles: [ResidenceDirector]
    code: 200
    input: ["interview_score"]
    output: RAApplication
    side_effects: ["status -> UNDER_REVIEW; interview_score and reviewed_by_user_id stamped", "increments RAApplication.version by 1"]

  - method: POST
    path: "/residence-life/ra-applications/{application_id}/decision"
    description: "Decide an UNDER_REVIEW application: REQUEST_REVISION (cycles back), OFFER, or REJECT."
    roles: [ResidenceDirector]
    code: 200
    input: ["decision", "revision_notes?"]
    output: RAApplication
    side_effects: ["REQUEST_REVISION increments revision_count and returns the application to REVISION_REQUESTED", "increments RAApplication.version by 1"]

  - method: POST
    path: "/residence-life/ra-applications/{application_id}/response"
    description: "The applicant accepts or declines an OFFERED position. ACCEPT synthesizes the RA row."
    roles: [Student]
    code: 200
    input: ["response"]
    output: RAApplication
    side_effects: ["ACCEPT creates an RA in PROVISIONAL/UNCERTIFIED and stamps created_ra_id", "increments RAApplication.version by 1"]

  - method: POST
    path: "/residence-life/ras/{ra_id}/training-records"
    description: "Log one completed training module for an RA in training; credits come from MODULE_CREDITS and are never supplied by the caller."
    roles: [ResidenceDirector]
    code: 200
    input: ["module_code"]
    output: RA
    side_effects: ["module_code appended to completed_module_codes; training_credits_earned += MODULE_CREDITS[module_code]", "increments RA.version by 1"]

  - method: POST
    path: "/residence-life/ras/{ra_id}/certification"
    description: "Drive the RA certification dimension: START_TRAINING, CERTIFY, LAPSE. Never touches employment_status."
    roles: [ResidenceDirector]
    code: 200
    input: ["action"]
    output: RA
    side_effects: ["CERTIFY stamps certified_at", "increments RA.version by 1"]

  - method: POST
    path: "/residence-life/ras/{ra_id}/employment"
    description: "Drive the RA employment dimension: ACTIVATE, SUSPEND, REINSTATE, SEPARATE. Never touches certification_status. SEPARATE fires the three-link coverage cascade."
    roles: [ResidenceDirector]
    code: 200
    input: ["action", "reason?"]
    output: RA
    side_effects:
      - "SEPARATE returns the RA's future ASSIGNED/SWAP_PENDING shifts to OPEN, recomputes each Floor.uncovered_shift_count and flips coverage_status to CRITICAL at the threshold"
      - "increments RA.version by 1"

  - method: POST
    path: "/residence-life/ras/{ra_id}/floor-assignment"
    description: "Assign the RA to the floor they staff. Required before ACTIVATE."
    roles: [ResidenceDirector]
    code: 200
    input: ["floor_id"]
    output: RA
    side_effects: ["assigned_floor_id := floor_id", "increments RA.version by 1"]

  # ---- writes: duty rotation ---------------------------------------------
  - method: POST
    path: "/residence-life/duty-shifts"
    description: "Create an unstaffed on-call block on a floor. points_value is derived from shift_type."
    roles: [ResidenceDirector]
    code: 201
    input: ["floor_id", "shift_type", "start_at", "end_at"]
    output: DutyShift
    side_effects: ["DutyShift created OPEN; Floor.uncovered_shift_count and coverage_status recomputed"]

  - method: POST
    path: "/residence-life/duty-shifts/{shift_id}/assignment"
    description: "Assign a named RA to an OPEN shift, subject to the active/certified/floor checks and the half-open-plus-rest conflict rule."
    roles: [ResidenceDirector]
    code: 200
    input: ["ra_id"]
    output: DutyShift
    side_effects: ["status -> ASSIGNED; assigned_ra_id := ra_id; Floor.uncovered_shift_count and coverage_status recomputed", "increments DutyShift.version by 1"]

  - method: POST
    path: "/residence-life/duty-shifts/{shift_id}/auto-fill"
    description: "Let the server pick the assignee with calculation emergency_shift_assignee_selection (lowest FORWARD_28 load, tie-broken by missed shifts, then duty points, then created_at)."
    roles: [ResidenceDirector]
    code: 200
    input: ["exclude_ra_ids?"]
    output: DutyShift
    side_effects: ["status -> ASSIGNED; assigned_ra_id := the selected RA; filled_by_selector := true", "increments DutyShift.version by 1"]

  - method: POST
    path: "/residence-life/duty-shifts/{shift_id}/swap"
    description: "Duty swap cycle: action=REQUEST by the holding RA names a replacement; action=APPROVE by a director installs the replacement; action=WITHDRAW keeps the original holder."
    roles: [ResidentAssistant, ResidenceDirector]
    code: 200
    input: ["action", "replacement_ra_id?"]
    output: DutyShift
    side_effects: ["REQUEST -> SWAP_PENDING; APPROVE/WITHDRAW -> ASSIGNED", "increments DutyShift.version by 1"]

  - method: POST
    path: "/residence-life/duty-shifts/{shift_id}/outcome"
    description: "Close out a shift: CHECK_IN, COMPLETE, MARK_MISSED, or VOID. VOID from COMPLETED reverses the duty points exactly."
    roles: [ResidentAssistant, ResidenceDirector]
    code: 200
    input: ["action"]
    output: DutyShift
    side_effects: ["COMPLETE adds points_value to RA.duty_points_balance; MARK_MISSED increments RA.missed_shift_count; VOID from COMPLETED subtracts points_value again", "increments DutyShift.version by 1"]

  # ---- writes: incidents and conduct --------------------------------------
  - method: POST
    path: "/residence-life/incident-reports"
    description: "An RA drafts an incident report about a resident. filed_by_ra_id comes from X-User-ID."
    roles: [ResidentAssistant]
    code: 201
    input: ["room_id", "subject_student_id", "occurred_at", "severity", "policy_code", "narrative"]
    output: IncidentReport
    side_effects: ["IncidentReport created in DRAFT with return_count 0"]

  - method: POST
    path: "/residence-life/incident-reports/{report_id}/submit"
    description: "Submit a DRAFT or RETURNED_FOR_DETAIL report to the residence director."
    roles: [ResidentAssistant]
    code: 200
    input: ["narrative?"]
    output: IncidentReport
    side_effects: ["status -> SUBMITTED; submitted_at stamped", "increments IncidentReport.version by 1"]

  - method: POST
    path: "/residence-life/incident-reports/{report_id}/triage"
    description: "Triage fork: disposition=ROUTE opens a ConductCase and places a judicial hold, disposition=CLOSE_NO_ACTION closes with no student-side effect, disposition=RETURN sends the report back for detail."
    roles: [ResidenceDirector]
    code: 200
    input: ["disposition", "note?"]
    output: IncidentReport
    side_effects:
      - "ROUTE creates the ConductCase, stamps conduct_case_id and routed_by_user_id, and sets Student.judicial_hold := true"
      - "RETURN increments return_count"
      - "increments IncidentReport.version by 1"

  - method: POST
    path: "/residence-life/conduct-cases/{case_id}/hearing"
    description: "A conduct officer schedules the hearing inside the HEARING_WINDOW_DAYS window and is recorded as scheduled_by_user_id."
    roles: [ConductOfficer]
    code: 200
    input: ["hearing_at"]
    output: ConductCase
    side_effects: ["status -> HEARING_SCHEDULED; scheduled_by_user_id := X-User-ID", "increments ConductCase.version by 1"]

  - method: POST
    path: "/residence-life/conduct-cases/{case_id}/decision"
    description: "A DIFFERENT conduct officer decides the case. SANCTION fires the four-link conduct cascade; DISMISS clears the hold only."
    roles: [ConductOfficer]
    code: 200
    input: ["outcome"]
    output: ConductCase
    side_effects:
      - "SANCTION computes sanction_points, adds them to Student.conduct_points, may flip conduct_standing to PROBATION or SUSPENDED, denies the student's REQUESTED room-change cases and revokes their break-housing rows"
      - "Either outcome bubbles the linked IncidentReport to CLOSED_ADJUDICATED and clears judicial_hold when no other live case remains"
      - "increments ConductCase.version by 1"

  # ---- writes: inspection and damage billing ------------------------------
  - method: POST
    path: "/residence-life/room-inspections"
    description: "Schedule an inspection of a room. Requires expected_room_version to match Room.version; a newer inspection of the same room and type supersedes the prior SCHEDULED one."
    roles: [ResidentAssistant]
    code: 201
    input: ["room_id", "inspection_type", "scheduled_for", "expected_room_version"]
    output: RoomInspection
    side_effects:
      - "Any prior SCHEDULED RoomInspection for the same room_id and inspection_type transitions to SUPERSEDED"
      - "increments Room.version by 1"

  - method: POST
    path: "/residence-life/room-inspections/{inspection_id}/completion"
    description: "Record the walk-through: condition score and damage lines. A non-empty damage_lines array synthesizes a PENDING DamageCharge carrying the PROVISIONAL_LIST subtotal."
    roles: [ResidentAssistant]
    code: 200
    input: ["condition_score", "damage_lines", "responsible_student_id?"]
    output: RoomInspection
    side_effects:
      - "status -> COMPLETED; Room.condition_score := condition_score"
      - "DamageCharge created in PENDING with provisional_subtotal_cents; damage_charge_id stamped"
      - "increments RoomInspection.version by 1"

  - method: POST
    path: "/residence-life/damage-charges/{charge_id}/billing"
    description: "Bill a PENDING charge: applies the FINAL_DEPRECIATED assessment and the pinned settlement order, then opens the appeal window."
    roles: [BursarOfficer]
    code: 200
    input: ["note?"]
    output: DamageCharge
    side_effects: ["assessed_subtotal_cents, depreciation_rate, admin_fee_cents, hardship_relief_cents, final_amount_cents written; billed_at and appeal_deadline_at stamped; Student.damage_balance_cents recomputed", "increments DamageCharge.version by 1"]

  - method: POST
    path: "/residence-life/damage-charges/{charge_id}/appeal"
    description: "The billed student appeals inside the appeal window. Only one appeal per charge."
    roles: [Student]
    code: 200
    input: ["reason"]
    output: DamageCharge
    side_effects: ["status -> APPEALED; appeal_reason stamped", "increments DamageCharge.version by 1"]

  - method: POST
    path: "/residence-life/damage-charges/{charge_id}/appeal-resolution"
    description: "The bursar resolves the appeal: ADJUST re-runs the settlement from adjusted_subtotal_cents, UPHOLD leaves the amounts intact. Either way the charge returns to BILLED."
    roles: [BursarOfficer]
    code: 200
    input: ["action", "adjusted_subtotal_cents?"]
    output: DamageCharge
    side_effects: ["appeal_outcome stamped; amounts recomputed on ADJUST; billed_at and appeal_deadline_at re-stamped; Student.damage_balance_cents recomputed", "increments DamageCharge.version by 1"]

  - method: POST
    path: "/residence-life/damage-charges/{charge_id}/settlement"
    description: "Close the charge: SETTLE (paid) or WAIVE. WAIVE on a BILLED charge is the compensating action that restores the student's pre-billing balance exactly; WAIVE on a PENDING charge voids it with no ledger movement."
    roles: [BursarOfficer]
    code: 200
    input: ["action", "note?"]
    output: DamageCharge
    side_effects: ["status -> SETTLED, WAIVED or VOID; Student.damage_balance_cents recomputed", "increments DamageCharge.version by 1"]

  # ---- writes: mediation and room change ----------------------------------
  - method: POST
    path: "/residence-life/room-change-cases"
    description: "Open a room-change case. Requires expected_student_version to match Student.version. origin=ROOMMATE_CONFLICT starts the mediation dimension at INTAKE; any prior REQUESTED case for the same student is superseded and CANCELLED."
    roles: [Student, ResidenceDirector]
    code: 201
    input: ["student_id", "origin", "from_room_id", "expected_student_version", "roommate_student_id?"]
    output: RoomChangeCase
    side_effects:
      - "Any prior RoomChangeCase for the same student with placement_status == REQUESTED transitions to CANCELLED and its id is recorded on the new case as superseded_case_id"
      - "increments Student.version by 1"

  - method: POST
    path: "/residence-life/room-change-cases/{case_id}/mediation"
    description: "Drive the mediation dimension only: OPEN_INTAKE, SCHEDULE_SESSION, RECORD_SESSION (outcome AGREEMENT or IMPASSE). Never touches placement_status."
    roles: [ResidenceDirector]
    code: 200
    input: ["action", "session_at?", "outcome?"]
    output: RoomChangeCase
    side_effects: ["mediation_status and mediation_round advance; session_at stamped", "increments RoomChangeCase.version by 1"]

  - method: POST
    path: "/residence-life/room-change-cases/{case_id}/placement-request"
    description: "Drive the placement dimension to REQUESTED by naming a target room. Never touches mediation_status."
    roles: [Student, ResidenceDirector]
    code: 200
    input: ["to_room_id"]
    output: RoomChangeCase
    side_effects: ["placement_status -> REQUESTED; to_room_id stamped", "increments RoomChangeCase.version by 1"]

  - method: POST
    path: "/residence-life/room-change-cases/{case_id}/placement-decision"
    description: "Approve or deny a REQUESTED placement. Approval re-checks the target room, the hall posture and the student's conduct standing and judicial hold."
    roles: [ResidenceDirector]
    code: 200
    input: ["decision", "reason?"]
    output: RoomChangeCase
    side_effects: ["placement_status -> APPROVED or DENIED", "increments RoomChangeCase.version by 1"]

  - method: POST
    path: "/residence-life/room-change-cases/{case_id}/placement-completion"
    description: "Execute the approved move. Bed counts shift between the two rooms; the hall's assigned_bed_count is conserved."
    roles: [ResidenceDirector]
    code: 200
    input: ["note?"]
    output: RoomChangeCase
    side_effects:
      - "Student.current_room_id := to_room_id; from_room.occupied_beds -= 1; to_room.occupied_beds += 1; both rooms may change status; reverted_from_room_id recorded"
      - "Building.assigned_bed_count unchanged"
      - "increments RoomChangeCase.version by 1"

  - method: POST
    path: "/residence-life/room-change-cases/{case_id}/placement-revert"
    description: "Compensating action for a completed move: returns the student and both rooms to their exact pre-move bed counts."
    roles: [ResidenceDirector]
    code: 200
    input: ["reason"]
    output: RoomChangeCase
    side_effects:
      - "Student.current_room_id := reverted_from_room_id; to_room.occupied_beds -= 1; reverted_from_room.occupied_beds += 1; placement_status -> REVERTED"
      - "Building.assigned_bed_count unchanged end to end"
      - "increments RoomChangeCase.version by 1"

  # ---- writes: floor programming ------------------------------------------
  - method: POST
    path: "/residence-life/program-events"
    description: "An RA proposes a floor program with a budget ask. organizer_ra_id comes from X-User-ID."
    roles: [ResidentAssistant]
    code: 201
    input: ["floor_id", "title", "category", "scheduled_for", "requested_amount_cents"]
    output: ProgramEvent
    side_effects: ["ProgramEvent created in PROPOSED with encumbered_amount_cents 0"]

  - method: POST
    path: "/residence-life/program-events/{event_id}/decision"
    description: "Approve (encumbers the ask against the floor's available bucket) or deny a PROPOSED program."
    roles: [ResidenceDirector]
    code: 200
    input: ["decision", "reason?"]
    output: ProgramEvent
    side_effects: ["APPROVE moves requested_amount_cents from Floor.programming_available_cents into Floor.programming_encumbered_cents", "increments ProgramEvent.version by 1"]

  - method: POST
    path: "/residence-life/program-events/{event_id}/outcome"
    description: "HOLD records the program as delivered (with attendance) and refreshes floor compliance; CANCEL is the compensating action that releases the encumbrance exactly."
    roles: [ResidentAssistant, ResidenceDirector]
    code: 200
    input: ["action", "attendance_count?"]
    output: ProgramEvent
    side_effects: ["HOLD recomputes Floor.held_program_count and programming_compliance_status; CANCEL returns encumbered_amount_cents to Floor.programming_available_cents", "increments ProgramEvent.version by 1"]

  - method: POST
    path: "/residence-life/program-events/{event_id}/reimbursement"
    description: "Reimburse a HELD program from itemised receipts using calculation program_reimbursement_amount (round per line, then sum)."
    roles: [ResidenceDirector]
    code: 200
    input: ["receipt_lines"]
    output: ProgramEvent
    side_effects: ["reimbursed_amount_cents written; the floor's encumbered bucket is released and its spent bucket grows by the reimbursement", "increments ProgramEvent.version by 1"]

  # ---- writes: break housing ----------------------------------------------
  - method: POST
    path: "/residence-life/break-housing-requests"
    description: "Request to stay in a room over a break period. Dates are inclusive on both ends."
    roles: [Student, ResidenceDirector]
    code: 201
    input: ["student_id", "room_id", "break_code", "start_date", "end_date", "reason"]
    output: BreakHousingRequest
    side_effects: ["BreakHousingRequest created in REQUESTED"]

  - method: POST
    path: "/residence-life/break-housing-requests/{request_id}/decision"
    description: "Approve or deny a break stay. Approval runs the closed-interval aggregate capacity projection against the room."
    roles: [ResidenceDirector]
    code: 200
    input: ["decision", "reason?"]
    output: BreakHousingRequest
    side_effects: ["APPROVE recomputes Room.break_hold_count; decided_by_user_id stamped", "increments BreakHousingRequest.version by 1"]

  - method: POST
    path: "/residence-life/break-housing-requests/{request_id}/occupancy"
    description: "CHECK_IN the resident for an approved stay, or CLOSE the stay after its end_date."
    roles: [ResidentAssistant, ResidenceDirector]
    code: 200
    input: ["action", "note?"]
    output: BreakHousingRequest
    side_effects: ["CHECK_IN stamps checked_in_at; CLOSE recomputes Room.break_hold_count", "increments BreakHousingRequest.version by 1"]

  # ---- test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/residence-life/_clock/set_current_utc"
    description: "Set the server's logical clock. Every deadline, window, depreciation year and duty-load window in this API reads this clock and never the wall clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z, which is also TERM_START_UTC."
    roles: [ResidenceDirector]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string, previous_utc: string }
    side_effects: ["No entity is mutated; subsequent window, deadline and depreciation evaluations read the new instant"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing, empty, or names a role outside the RBAC matrix."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The authenticated role is not listed in the endpoint's roles[]."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource whose owning foreign key does not equal X-User-ID."

  - id: ERR_BUILDING_NOT_FOUND
    http: 404
    condition: "No Building with the given id."
  - id: ERR_FLOOR_NOT_FOUND
    http: 404
    condition: "No Floor with the given id, in the path or in a request body."
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "No Room with the given id, in the path or in a request body."
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "No Student with the given id, in the path or in a request body."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No RAApplication with the given id."
  - id: ERR_RA_NOT_FOUND
    http: 404
    condition: "No RA with the given id, in the path or as ra_id / replacement_ra_id in a body."
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "No DutyShift with the given id."
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "No IncidentReport with the given id."
  - id: ERR_CONDUCT_CASE_NOT_FOUND
    http: 404
    condition: "No ConductCase with the given id."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "No RoomInspection with the given id."
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "No DamageCharge with the given id."
  - id: ERR_ROOM_CHANGE_CASE_NOT_FOUND
    http: 404
    condition: "No RoomChangeCase with the given id."
  - id: ERR_PROGRAM_EVENT_NOT_FOUND
    http: 404
    condition: "No ProgramEvent with the given id."
  - id: ERR_BREAK_REQUEST_NOT_FOUND
    http: 404
    condition: "No BreakHousingRequest with the given id."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, out-of-range integer, unparseable datetime or date, end_at <= start_at, end_date < start_date, or pagination limit/offset outside 1..100 / >= 0."

  - id: ERR_STALE_ROOM_VERSION
    http: 412
    condition: "expected_room_version on POST /room-inspections does not equal the Room's current version."
  - id: ERR_STALE_STUDENT_VERSION
    http: 412
    condition: "expected_student_version on POST /room-change-cases does not equal the Student's current version."

  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "The RAApplication is not in a state from which the requested submit / review / decision / response edge is declared."
  - id: ERR_RA_STATE_INVALID
    http: 409
    condition: "The RA is not in a state from which the requested certification or employment action is declared (e.g. CERTIFY while UNCERTIFIED, ACTIVATE while SEPARATED, or logging a training module while not IN_TRAINING)."
  - id: ERR_SHIFT_STATE_INVALID
    http: 409
    condition: "The DutyShift is not in a state from which the requested assignment, swap or outcome action is declared."
  - id: ERR_INCIDENT_STATE_INVALID
    http: 409
    condition: "The IncidentReport is not in a state from which the requested submit or triage disposition is declared."
  - id: ERR_CONDUCT_CASE_STATE_INVALID
    http: 409
    condition: "The ConductCase is not OPEN when a hearing is scheduled, or not HEARING_SCHEDULED when a decision is issued."
  - id: ERR_INSPECTION_STATE_INVALID
    http: 409
    condition: "The RoomInspection is not SCHEDULED when completion is recorded."
  - id: ERR_CHARGE_STATE_INVALID
    http: 409
    condition: "The DamageCharge is not in a state from which the requested billing, appeal, appeal-resolution or settlement action is declared."
  - id: ERR_PLACEMENT_STATE_INVALID
    http: 409
    condition: "The RoomChangeCase placement dimension is not in a state from which the requested placement action is declared, or a ROOMMATE_CONFLICT case requests placement before mediation reached AGREEMENT_REACHED or IMPASSE."
  - id: ERR_MEDIATION_STATE_INVALID
    http: 409
    condition: "The RoomChangeCase mediation dimension is not in a state from which the requested mediation action is declared, or OPEN_INTAKE is used on a case with no roommate_student_id."
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "The ProgramEvent is not PROPOSED when decided, or not APPROVED/HELD when an outcome action is issued."
  - id: ERR_PROGRAM_NOT_HELD
    http: 409
    condition: "Reimbursement was requested for a ProgramEvent whose status is not HELD."
  - id: ERR_BREAK_REQUEST_STATE_INVALID
    http: 409
    condition: "The BreakHousingRequest is not REQUESTED when decided, not APPROVED when checked in, or not CHECKED_IN when closed."
  - id: ERR_INVALID_POSTURE_TRANSITION
    http: 409
    condition: "The requested target_posture is not reachable from the hall's current posture (notably EMERGENCY_CLOSED -> RESTRICTED)."

  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "A REQUEST_REVISION decision was issued when RAApplication.revision_count already equals MAX_REVISION_ROUNDS."
  - id: ERR_RETURN_LIMIT_REACHED
    http: 409
    condition: "A RETURN triage disposition was issued when IncidentReport.return_count already equals MAX_RETURN_ROUNDS."
  - id: ERR_MEDIATION_ROUND_LIMIT
    http: 409
    condition: "A SCHEDULE_SESSION action was issued when RoomChangeCase.mediation_round already equals MAX_MEDIATION_ROUNDS."
  - id: ERR_APPEAL_ALREADY_RESOLVED
    http: 409
    condition: "A second appeal was filed on a DamageCharge whose appeal_outcome is already ADJUSTED or UPHELD."

  - id: ERR_BUILDING_NOT_OPEN
    http: 409
    condition: "An operation that requires the hall to be operating was attempted while Building.posture is RESTRICTED or EMERGENCY_CLOSED."
  - id: ERR_ROOM_NOT_AVAILABLE
    http: 409
    condition: "The target Room has status OFFLINE or CONSOLIDATED."
  - id: ERR_ROOM_AT_CAPACITY
    http: 409
    condition: "The target Room already has occupied_beds == bed_capacity."

  - id: ERR_RA_NOT_CERTIFIED
    http: 409
    condition: "The RA named for a duty assignment, swap or inspection completion has certification_status other than CERTIFIED."
  - id: ERR_RA_NOT_ACTIVE
    http: 409
    condition: "The RA named for a duty assignment, swap, inspection, incident report or program proposal has employment_status other than ACTIVE."
  - id: ERR_TRAINING_CREDITS_INSUFFICIENT
    http: 409
    condition: "CERTIFY was attempted with training_credits_earned < CERTIFICATION_CREDIT_MIN."
  - id: ERR_MANDATORY_MODULE_MISSING
    http: 409
    condition: "CERTIFY was attempted while at least one code in MANDATORY_MODULE_CODES is absent from completed_module_codes."
  - id: ERR_MODULE_ALREADY_COMPLETED
    http: 409
    condition: "A module code already present in completed_module_codes was logged again."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The conduct officer deciding a case is the same X-User-ID that scheduled its hearing."
  - id: ERR_SELF_REPORT_FORBIDDEN
    http: 422
    condition: "An RA filed an incident report whose subject_student_id is that RA's own student_id."
  - id: ERR_JUDICIAL_HOLD
    http: 409
    condition: "A room-change placement approval was attempted for a student whose judicial_hold is true."
  - id: ERR_STUDENT_ON_PROBATION
    http: 409
    condition: "An operation that requires conduct_standing == GOOD (placement approval) or break_housing_eligible == true (break approval) was attempted for a student on PROBATION or SUSPENDED."
  - id: ERR_BREAK_HOUSING_DISABLED
    http: 409
    condition: "A break stay was approved in a hall whose break_housing_enabled is false."

  - id: ERR_DUTY_COVERAGE_CONFLICT
    http: 409
    condition: "The candidate shift intersects another shift held by the same RA under half-open interval semantics, or the clear gap between them is strictly less than MIN_REST_MINUTES."
  - id: ERR_SHIFT_WINDOW_NOT_REACHED
    http: 409
    condition: "A shift action was issued outside its clock window: assignment after start_at, check-in outside [start_at, end_at), completion before end_at, or mark-missed before end_at."
  - id: ERR_HEARING_WINDOW_EXCEEDED
    http: 409
    condition: "hearing_at is at or before the logical clock, or later than opened_at + HEARING_WINDOW_DAYS days."
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "The appeal arrived strictly after DamageCharge.appeal_deadline_at."

  - id: ERR_BREAK_HOUSING_CAPACITY
    http: 409
    condition: "Approving the stay would make the number of colliding APPROVED/CHECKED_IN closed-interval stays on the room exceed Room.bed_capacity."
  - id: ERR_DUPLICATE_BUILDING_CODE
    http: 409
    condition: "A Building already exists with the given code."
  - id: ERR_DUPLICATE_STUDENT_EMAIL
    http: 409
    condition: "A Student already exists with the given email."
  - id: ERR_DUPLICATE_FLOOR_NUMBER
    http: 409
    condition: "A Floor already exists with the given floor_number inside the same building_id."
  - id: ERR_DUPLICATE_ROOM_NUMBER
    http: 409
    condition: "A Room already exists with the given room_number on the same floor_id."
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "The applicant already has an RAApplication for the same term_code."
  - id: ERR_NO_ELIGIBLE_RA
    http: 422
    condition: "The auto-fill candidate pool computed by emergency_shift_assignee_selection is empty."
  - id: ERR_CENSUS_EMPTY
    http: 422
    condition: "Consolidation was requested for a hall whose census occupied_beds is 0."
  - id: ERR_CONSOLIDATION_NOT_WARRANTED
    http: 409
    condition: "Consolidation was requested for a hall whose census vacancy_rate is below CONSOLIDATION_MIN_VACANCY_RATE."

  - id: ERR_FLOOR_MISMATCH
    http: 422
    condition: "The floor of the shift, inspected room or proposed program does not equal the RA's assigned_floor_id."
  - id: ERR_STUDENT_NOT_IN_ROOM
    http: 422
    condition: "from_room_id does not equal Student.current_room_id, or to_room_id equals from_room_id."

  - id: ERR_PROGRAM_BUDGET_NOT_ALLOCATED
    http: 409
    condition: "A program was approved on a floor whose programming_budget_cents is 0."
  - id: ERR_FLOOR_BUDGET_EXCEEDED
    http: 409
    condition: "requested_amount_cents exceeds Floor.programming_available_cents at approval, or the reimbursement overrun exceeds Floor.programming_available_cents at reimbursement."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix   (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: ResidenceDirector
    description: "Professional residence life staff. Owns the housing inventory, RA hiring decisions, duty rotation, incident triage, mediation and the floor programming budget. Cannot adjudicate conduct and cannot bill damage."
    identity: "opaque"
    exclusive_operations:
      - "POST /residence-life/buildings"
      - "POST /residence-life/buildings/{building_id}/posture"
      - "POST /residence-life/buildings/{building_id}/consolidation"
      - "POST /residence-life/floors"
      - "POST /residence-life/floors/{floor_id}/budget-allocations"
      - "POST /residence-life/rooms"
      - "POST /residence-life/rooms/{room_id}/status"
      - "POST /residence-life/students"
      - "POST /residence-life/students/{student_id}/room-assignment"
      - "POST /residence-life/ra-applications/{application_id}/review"
      - "POST /residence-life/ra-applications/{application_id}/decision"
      - "POST /residence-life/ras/{ra_id}/training-records"
      - "POST /residence-life/ras/{ra_id}/certification"
      - "POST /residence-life/ras/{ra_id}/employment"
      - "POST /residence-life/ras/{ra_id}/floor-assignment"
      - "POST /residence-life/duty-shifts"
      - "POST /residence-life/duty-shifts/{shift_id}/assignment"
      - "POST /residence-life/duty-shifts/{shift_id}/auto-fill"
      - "POST /residence-life/incident-reports/{report_id}/triage"
      - "POST /residence-life/room-change-cases/{case_id}/mediation"
      - "POST /residence-life/room-change-cases/{case_id}/placement-decision"
      - "POST /residence-life/room-change-cases/{case_id}/placement-completion"
      - "POST /residence-life/room-change-cases/{case_id}/placement-revert"
      - "POST /residence-life/program-events/{event_id}/decision"
      - "POST /residence-life/program-events/{event_id}/reimbursement"
      - "POST /residence-life/break-housing-requests/{request_id}/decision"
      - "POST /residence-life/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
      - "POST /residence-life/ra-applications"
      - "POST /residence-life/duty-shifts/{shift_id}/swap"
      - "POST /residence-life/duty-shifts/{shift_id}/outcome"
      - "POST /residence-life/room-change-cases"
      - "POST /residence-life/room-change-cases/{case_id}/placement-request"
      - "POST /residence-life/program-events/{event_id}/outcome"
      - "POST /residence-life/break-housing-requests"
      - "POST /residence-life/break-housing-requests/{request_id}/occupancy"

  - name: ResidentAssistant
    description: "Student staff member on a floor. Files incident reports, inspects rooms, proposes floor programs and works the duty rotation. X-User-ID is the RA row's id, so every ownership check compares it to assigned_ra_id / filed_by_ra_id / inspector_ra_id."
    identity: "entity_backed:RA"
    exclusive_operations:
      - "POST /residence-life/incident-reports"
      - "POST /residence-life/incident-reports/{report_id}/submit"
      - "POST /residence-life/room-inspections"
      - "POST /residence-life/room-inspections/{inspection_id}/completion"
      - "POST /residence-life/program-events"
    shared_operations:
      - "every GET endpoint"
      - "POST /residence-life/duty-shifts/{shift_id}/swap"
      - "POST /residence-life/duty-shifts/{shift_id}/outcome"
      - "POST /residence-life/program-events/{event_id}/outcome"
      - "POST /residence-life/break-housing-requests/{request_id}/occupancy"

  - name: ConductOfficer
    description: "Student conduct office. Schedules and decides conduct cases. Segregation of duties: the officer who schedules a hearing may not decide that case."
    identity: "opaque"
    exclusive_operations:
      - "POST /residence-life/conduct-cases/{case_id}/hearing"
      - "POST /residence-life/conduct-cases/{case_id}/decision"
    shared_operations:
      - "every GET endpoint"

  - name: BursarOfficer
    description: "Student accounts office. Owns the damage ledger: billing, appeal resolution, settlement and waiver. Cannot inspect rooms or triage incidents."
    identity: "opaque"
    exclusive_operations:
      - "POST /residence-life/damage-charges/{charge_id}/billing"
      - "POST /residence-life/damage-charges/{charge_id}/appeal-resolution"
      - "POST /residence-life/damage-charges/{charge_id}/settlement"
    shared_operations:
      - "every GET endpoint"

  - name: Student
    description: "Resident. Applies for RA positions, opens room-change cases, appeals damage charges and requests break housing. X-User-ID is the Student row's id."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /residence-life/ra-applications/{application_id}/submit"
      - "POST /residence-life/ra-applications/{application_id}/response"
      - "POST /residence-life/damage-charges/{charge_id}/appeal"
    shared_operations:
      - "every GET endpoint"
      - "POST /residence-life/ra-applications"
      - "POST /residence-life/room-change-cases"
      - "POST /residence-life/room-change-cases/{case_id}/placement-request"
      - "POST /residence-life/break-housing-requests"
