            - "it returns limit_days == 45 and approaching_days == 36 — the DISTRIBUTOR constants, chosen from the custody bucket"
            - "it returns dwell_flag == APPROACHING (37 >= 36 and 37 <= 45) and cumulative_dwell_days == 4 (2 closed by the FILL plus 2 closed by the DISTRIBUTION scan)"
            - "it returns dwell_started_at == 2026-08-05T00:00:00Z and distributor_custody_started_at == 2026-08-05T00:00:00Z"
            - "the following keg read shows Keg.${k1_id}.dwell_flag == WITHIN_LIMIT — the computed classification was NOT persisted"
            - "Keg.${k1_id}.version is identical before and after the dwell read (a computed read is not a write)"

