            - call: "POST /exam-sessions/${s3_id}/start"
              payload: {}
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /exam-sessions/${s3_id}/submission"
              payload: { scored_correct_count: 58, pretest_correct_count: 5, proctor_attestation: true }
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /security-incidents"
              payload: { exam_session_id: "${s1_id}", reported_by_proctor_id: "${proc_id}", category: "PROHIBITED_MATERIAL", severity: "CRITICAL", narrative: "Unauthorized reference material recovered from the workstation." }
              as: Proctor
