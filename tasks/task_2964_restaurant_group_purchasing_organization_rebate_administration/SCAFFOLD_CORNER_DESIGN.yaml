          Four lines exercise the four arms of the selector against the SAME key
          space: a key owned by two items resolves to exactly one because the
          other item's deal is DRAFT; a key owned only by a DRAFT-deal item is
          EXCLUDED / DEAL_NOT_ACTIVE; a key owned by an ACTIVE-deal item whose
          deal dates do NOT cover the invoice date is also EXCLUDED /
