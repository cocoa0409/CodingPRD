      - name: consent_gate_outranks_cross_cycle_reference
        claim_type: priority_conflict
        grounds:
          - validations.priority_11
          - validations.priority_20
        distinguishing_aspect: "A share request that both lacks consent and names a club from another cycle must return the priority-11 consent error."
        excluded_because:
          difficulty_instance: consent_gate_priority_11_outranks_cross_cycle_reference_priority_20
          rationale: "The §1.8 instance builds the two-cycle fixture and asserts the priority-11 error with the priority-20 condition simultaneously live, which is the whole priority-conflict claim."
      - name: expired_clock_outranks_timeout_exhaustion
        claim_type: priority_conflict
        grounds:
          - validations.priority_18
          - validations.priority_38
        distinguishing_aspect: "A TIMEOUT requested after deadline_at by a club with no timeouts left must return the priority-18 clock error."
        excluded_because:
          difficulty_instance: expired_clock_priority_18_outranks_timeout_exhaustion_priority_38
          rationale: "The §1.8 instance already exhausts both timeouts and then crosses deadline_at in the same recipe so both conditions hold when the trigger fires."
      - name: declaration_deadline_outranks_already_declared
        claim_type: priority_conflict
        grounds:
          - validations.priority_16
          - validations.priority_28
        distinguishing_aspect: "A second DECLARE submitted after declaration_deadline_at must return the priority-16 deadline error, not the priority-28 duplicate error."
        excluded_because:
          difficulty_instance: declaration_deadline_priority_16_outranks_already_declared_priority_28
          rationale: "The §1.8 instance declares once, moves the clock past the deadline and re-declares, asserting the deadline error while the duplicate condition is also true."
      - name: selection_requires_a_non_suspended_parent_cycle
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_8
          - state_machines.DraftCycle.DRAFT_LIVE_to_DRAFT_SUSPENDED
        distinguishing_aspect: "A selection on an ON_CLOCK pick must be rejected while the parent cycle posture is FROZEN, and must succeed again after resumption."
        excluded_because:
          difficulty_instance: selection_blocked_while_parent_cycle_is_suspended
          rationale: "The §1.8 instance suspends the cycle, asserts the frozen rejection, resumes it and then asserts the same selection succeeding with the deadline preserved."
      - name: share_scope_may_not_exceed_prospect_consent_scope
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_11
          - entities.Prospect.fields.consent_scope
        distinguishing_aspect: "A FULL-scope share request against a prospect who granted only SUMMARY consent must be rejected."
        excluded_because:
          difficulty_instance: full_scope_share_blocked_by_narrower_prospect_consent_scope
          rationale: "The §1.8 instance covers the scope comparison in both directions on one fixture (SUMMARY granted, FULL requested then SUMMARY requested)."
