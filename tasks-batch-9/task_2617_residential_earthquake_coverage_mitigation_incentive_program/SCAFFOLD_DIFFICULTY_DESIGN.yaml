            - "after withdrawing B: ${s4_res} == 0, ${s4_dis} == 250000, ${s4_unc} == 750000 - the reservation returns to uncommitted and disbursed is untouched (sum 1000000)"
            - "${pol_b_mit} == \"UNMITIGATED\" - the withdrawal also compensates the policy-side cascade"
            - "the clawback attempt returns HTTP 409 with ${claw_err} == \"ERR_GRANT_INVALID_STATE\" (VERIFIED_COMPLETE is terminal)"
            - "${s5_res} == 0, ${s5_dis} == 250000, ${s5_unc} == 750000 - the refused call moved nothing"

