            - "PM-CVY closes at warranty_reserve_cents 50000 and warranty_paid_cents 0: across one refused approve, one void cascade, one refused create and one reinstatement, warranty_reserve_cents + warranty_paid_cents == initial_warranty_reserve_cents 50000 at every observation"

      # -----------------------------------------------------------------------
      # V8 — priority 38 (parallel-axis build-state guard) must be answered
      # before priority 82 (OCC on the warehouse), even though §1.2 happens to
      # LIST the OCC precondition earlier. §1.4 puts every OCC rung at 80+.
      # -----------------------------------------------------------------------
      - name: val_priority_ordering_unit_build_state_beats_stale_warehouse_version
        claim_type: "Priority Ordering"
        grounds:
          - validation_rules.priority_38
          - validation_rules.priority_82
          - errors.ERR_UNIT_INVALID_BUILD_STATE
          - errors.ERR_STALE_WAREHOUSE_VERSION
          - state_machines.FinishedUnit.logistics_status
          - endpoints.POST_/finished-units/{finished_unit_id}/store
        distinguishing_aspect: "One store request carrying BOTH an OUTFITTED (not yet SELLABLE) hull and a stale expected_warehouse_version must return 409 ERR_UNIT_INVALID_BUILD_STATE, and the identical stale version replayed after the hull is inspected must then return 412 ERR_STALE_WAREHOUSE_VERSION — the same body yields two different errors purely by the rung ordering."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. The PM-CVW base: one 2-cavity mould, oven OV-CVW, bay CB-CVW, site WH-CVA (capacity 100.0000 in one zone Z-A), resin lot LOT-CVW, four technicians."
            - "Cycle CYC-CVW demoulded two hulls. fu1 was trimmed, outfitted and inspected to SELLABLE; fu2 was trimmed and outfitted and is OUTFITTED with inspection_verdict null."
            - "fu1 has been stored at WH-CVA, so the warehouse version captured before that store (wh_v1) is now one behind, and the site reads committed_cube_m3 1.0000."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvW_pm
            - *cvW_mold
            - *cvW_oven
            - *cvW_bay
            - *cvA_wh
            - *cvW_lot
            - *cvW_po
            - *cvW_release
            - *cvW_cycle
            - *cvW_charge
            - *cvB_clk_0900
            - *cvW_start
            - *cvB_clk_1000
            - *cvW_cool
            - *cvB_clk_1035
            - *cvW_demold
            - *cvW_units
            - *cvW_trim1
            - *cvW_outfit1
            - *cvW_inspect1
            - *cvW_trim2
            - *cvW_outfit2
            - *cvW_get_wh1
            - *cvW_store1
          trigger:
            - call: "GET /finished-units/${fu2}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu2}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v_fresh: $.data.version }
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v_fresh}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "GET /finished-units/${fu2} reads build_status OUTFITTED and logistics_status UNALLOCATED before the first store attempt, and ${wh_v1} is exactly one less than the live Warehouse.version because fu1's store incremented it"
            - "the first store returns 409 ERR_UNIT_INVALID_BUILD_STATE — not 412 — even though expected_warehouse_version is provably stale; rung 38 is a parallel-axis guard evaluated long before the OCC rungs at 80+"
            - "note the audit point: §1.2's transition block LISTS the stale-warehouse precondition above the FROZEN and cap checks, but §1.4 assigns OCC priority 82 and states OCC is evaluated last; the §1.4 ladder is what this claim tests"
            - "after the inspect, fu2 reads build_status SELLABLE with inspection_verdict PASS (wall points 5.90..6.10 against wall_thickness_min_mm 4.50, cv well under 12.00, impact 120.00 >= 90.00, cosmetic grade A) — six measurement points satisfy rung 25"
            - "replaying the byte-identical store body now returns 412 ERR_STALE_WAREHOUSE_VERSION, which proves the OCC rung was violated all along in the first attempt and was merely out-ranked"
            - "the store with the freshly read version returns 200: fu2 becomes STORED in zone Z-A with is_zone_anchor false and stored_footprint_cube_m3 == round(1.0000 * 0.5000, 4) == 0.5000, because fu1 already anchors PM-CVW in that zone"
            - "the footprint summary reports committed_cube_m3 1.5000 (1.0000 anchor + 0.5000 nested), remaining_cube_m3 98.5000, utilization_pct == round(1.5000 / 100.0000 * 100, 2) == 1.50 and posture NORMAL"
            - "neither refused store advanced Warehouse.version: it moved exactly twice across the whole recipe, once per accepted store"

      # -----------------------------------------------------------------------
      # V9 — priority 51 (lot not qualified) must beat priority 72 (insufficient
      # mass) on POST /resin-charges; each rung is then shown firing alone.
      # -----------------------------------------------------------------------
      - name: val_priority_ordering_resin_lot_not_qualified_beats_resin_insufficient
        claim_type: "Priority Ordering"
        grounds:
          - validation_rules.priority_51
          - validation_rules.priority_72
          - errors.ERR_RESIN_LOT_NOT_QUALIFIED
          - errors.ERR_RESIN_INSUFFICIENT
          - calculations.qualified_resin_lot_count
          - calculations.resin_mass_ledger
          - endpoints.POST_/resin-charges
        distinguishing_aspect: "A 20.000 kg charge drawn from a 5.000 kg MDPE lot violates both rung 51 and rung 72 and must return 422 ERR_RESIN_LOT_NOT_QUALIFIED; the same charge from a qualified 5.000 kg lot returns 409 ERR_RESIN_INSUFFICIENT, and from a qualified 20.000 kg lot it succeeds by draining the lot to exactly 0.000."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVQ demands resin_grade HDPE_LINEAR, additive UV12, master colour SEAFOAM (max_color_delta_e 1.50) and a melt index inside [2.50, 6.00]; its 2-cavity mould MLD-CVQ-1 has nominal_charge_kg 20.000."
            - "Four lots exist, all colour SEAFOAM / delta 0.50 / additive UV12 / regrind 10.00 pct: LOT-CVQ-BAD is MDPE with 5.000 kg, LOT-CVQ-HOT is HDPE_LINEAR with melt_index 6.01 and 100.000 kg, LOT-CVQ-THIN is HDPE_LINEAR melt 4.00 with 5.000 kg, and LOT-CVQ-OK is HDPE_LINEAR melt 4.00 with 20.000 kg."
            - "ProductionOrder PO-CVQ (ordered_qty 2) is RELEASED — the qualified lot count is 2 (THIN and OK), so it reached READY_TO_SCHEDULE — and holds one SCHEDULED cycle at 2026-08-01T09:00:00Z with charged_mass_kg 0.000."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - &cvQ_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CVQ", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 10.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 1.0000, nest_factor: 0.5000, unit_weight_kg: 30.000, msrp_cents: 200000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - &cvQ_mold
              call: "POST /molds"
              payload: { mold_code: "MLD-CVQ-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 20.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - &cvQ_oven
              call: "POST /oven-stations"
              payload: { station_code: "OV-CVQ", arm_count: 1, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - &cvQ_bay
              call: "POST /cooling-bays"
              payload: { bay_code: "CB-CVQ", concurrent_slot_capacity: 1, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - *cvA_wh
            - &cvQ_lot_bad
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVQ-BAD", resin_grade: "MDPE", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 180, received_kg: 5.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_bad: $.data.id }
            - &cvQ_lot_hot
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVQ-HOT", resin_grade: "HDPE_LINEAR", melt_index_g10min: 6.01, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 190, received_kg: 100.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_hot: $.data.id }
            - &cvQ_lot_thin
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVQ-THIN", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 5.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_thin: $.data.id }
            - &cvQ_lot_ok
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVQ-OK", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 20.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_ok: $.data.id }
            - &cvQ_po
              call: "POST /production-orders"
              payload: { order_code: "PO-CVQ", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
